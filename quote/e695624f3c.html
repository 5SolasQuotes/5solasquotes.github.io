<main class="wrap"><figure class="quote" id="q-e695624f3c" data-kw="infants are not to be baptized">
<blockquote><p>And because they baptized Proselytes both Men, Women and Children, must Christians do so too? Sure the Custom of the Romish Church in baptizing of Infants, as a human Tradition, is every way of as good Authority to warrant us so to do, as the Custom of the unbelieving Jews. But pray take what a Learned Pedo-Baptist, and a Son of the Church of England, hath said in answer to this vain Conceit; &#x27;tis Sir Norton Knatchbull, in his Animadversiones in lib. Novi Testamenti, pag. 313. Ac cum videam summi judicii viros in his temporibus ex Rabbinis fundamenta petere veritatis, &amp;c. But when I see in these times some Men of the greatest Judgment to fetch the Foundation of Truth from the Rabbins, I cannot but stick at it: for whence was the Talmud sent to us, (they are the words (saith he) of Buxtorf in his Synagoga Judaica) that we should give so, much Credit thereto, that we should believe that the Mosaic Law either was or ought to be understood therefrom, much less the Gospel, to which they are professed Enemies?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-keach.html">Benjamin Keach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pedo-Baptism Disproved</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a> › <a href="../topics/baptism/subjects-of-baptism/believers.html">Believers</a></span><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a> › <a href="../topics/baptism/subjects-of-baptism/contra-infant-baptism.html">Contra infant baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c7037dede4" data-kw="">
<blockquote><p>We have a proof of this in Cornelius the centurion, who, after he had been previously endued with the graces of the Holy Spirit, was baptised for the remission of sins, not seeking a fuller forgiveness from baptism, but a surer exercise of faith; nay, an argument for assurance from a pledge. It will, perhaps, be objected, Why did Ananias say to Paul that he washed away his sins by baptism (Acts 22:16), if sins are not washed away by the power of baptism? I answer, we are said to receive, procure, and obtain, whatever according to the perception of our faith is exhibited to us by the Lord, whether he then attests it for the first time, or gives additional confirmation to what he had previously attested. All then that Ananias meant to say was, Be baptised, Paul, that you may be assured that your sins are forgiven you. In baptism, the Lord promises forgiveness of sins: receive it, and be secure. I have no intention, however, to detract from the power of baptism. I would only add to the sign the substance and reality, inasmuch as God works by external means.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.15.15</span></figcaption>

</figure><figure class="quote" id="q-5304def06a" data-kw="">
<blockquote><p>That condition is faith. It is the clearly pronounced doctrine of the Lutheran Church that baptism is altogether useless or void of any saving effect, unless the recipient be a believer. And by faith is not meant mere speculative assent, such as Simon Magus had, but true, living, and saving faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Condition on which the Efficacy of Baptism is suspended”</span></figcaption>

</figure><figure class="quote" id="q-4ddb9747d0" data-kw="covenant of grace">
<blockquote><p>Reply; How often have we shewed that this Text proves not that any Children, quatenus as such, should be baptized, nor, as such, that they are in the Covenant of Grace, or have the Promise made to them; the Promise runs to the Jews and to their Offspring, and not to them only, but to Gentiles also, who were said to be afar off: But pray observe, &#x27;tis to no more of the Jews and their Children or Offspring, and such who were afar off, than the Lord shall call or make Disciples by the Word and effectual Operations of the Holy Spirit. My Sons and Daughters are as much my Children when they are twenty or thirty Years old, as well as when Babes. Dr. Hammond also grants, Children in this Text doth not refer to Insants as such, but to the Posterity of the Jews, p. 490. Sect. 81. If ye be Christ&#x27;s, then you are Abraham&#x27;s Seed, and Heirs according to the Promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-keach.html">Benjamin Keach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pedo-Baptism Disproved</cite></span></figcaption>

</figure><figure class="quote" id="q-2b30abdfa1" data-kw="efficacy moral">
<blockquote><p>The opinion of the orthodox is far different. First, they admit no blotting out of sin in baptism, springing ex opere operato or from a virtue inherent in it (as was proved before when we considered the efficacy of the sacraments). Second, they say that the efficacy of baptism (taken oppositely for the element and its dispensation) is moral, as has already been set forth; but the efficacy of baptism considered compositely for the sign and thing signified is real with respect to the one receiving it, although it is not restricted to the moment of baptism. Third, they acknowledge in baptism the testification and sealing of the twofold grace promised in the gospel; both of justification (by which sin is taken away as to its guilt so that it is not imputed) and of sanctification (by which its pollution is lessened and corrected that it may no more rule in us in this life; not however that it is not absolutely or exists in us anymore). The grace of justification pardons all our sins: original, actual, past, present and future.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.19.3</span></figcaption>

<main class="wrap"><figure class="quote" id="q-24fdbe45f0" data-kw="">
<blockquote><p>WHAT Luther said of Justification by Faith, that may we concerning the Resurrection of the dead, Articulus est Ecclesiae stantis, aut cadentis; it is an Article with which the Church standeth or falleth; Yet so foul an error had taken the head of some Members in the Church of Corinth, as to deny this grand Truth, which St Paul calls in another place, one of the principles of the Doctrine of Christ: how say some among you, there is no Resurrection of the dead? v. 12.

And, is it not strange, that such who professed to believe the Resurrection of Christ should deny their own! but much more, that any in the Church of Corinth (especially in those early days) should have such a darkness found upon their minds, who stood so near the rising Sun? and that while St Paul himself was yet alive, who had planted this Church; by this we see, though Truth is errors elder, yet error is not much Truths younger. Though the Gospel-Church was purest in the Primitive times, yet it soon began to corrupt in its Members. Not unapt therefore was his saying, who compared (in this respect) the gathering of Churches to the gathering of Apples, which when first gathered, may appear all fair and sound, but then within a while, some amongst them begin to speak, and others to discover their rottenness.

No doubt this Church of Corinth, and so others gathered by the rest of the Apostles, appeared in their Members very sound in the faith, and fair in their lives at their first embracing of the Gospel; yet some we see did thus soon discover corruption in both. Now to recover the tainted, and especially to preserve the sound from this dangerous infection, the Apostle sets himself to defend this Article of our Faith, well knowing, that this was a blow made at the root of Christianity; which must needs fall to the ground, if this cannot be maintained; and he doth it with such invincible arguments, that if any Heretic shall now deny it, the reason cannot be deficiency in the proof here given, but rather a criminous conscience in himself, which makes him on his own defence, deny a Resurrection, for fear of the Judgment which attends it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Labour and Reward, or, A Sermon, part of which was Preached at the Funeral of the Right Honourable the Lady Mary Vere, relict of Sir Horace Vere, Baron of Tilbury, on the 10th of January, 1671, at Castle Heviningham in Essex</cite>, (London: Ralph Smith, 1672), pp 1-3.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf5c30a0dc" data-kw="same body identity">
<blockquote><p>Are the same bodies numerically which have died to be raised again? We affirm against the Socinians. It is not inquired whether they will be the same bodies as to qualities and conditions. For we confess that they will undergo a great change so as to be no longer animal, corruptible, weak, miserable and mortal, but spiritual, incorruptible, strong, glorious and immortal. But concerning numerical identity of substance—whether the same flesh which was dissolved by death will rise again—this we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.2.1–2</span></figcaption>

</figure><figure class="quote" id="q-bde91c87e8" data-kw="">
<blockquote><p>The wicked shall be raised by the power of Christ as a just Judge. The divine power that shut them up in the grave as in a prison, will bring them out, in order to their receiving the last sentence, to enter into the prison of hell. But the godly shall be raised by virtue of the Spirit of Christ, that bond of union betwixt Christ and those blessed bodies; so that it shall be to them as a pleasant awakening out of sleep.</p></blockquote>

</figure><figure class="quote" id="q-af53ab3b82" data-kw="">
<blockquote><p>Obj. The resurrection of Christ is declared by the Apostle to be the cause of our resurrection, and our resurrection is the effect, or benefit of Christ&#x27;s resurrection. But this cause does not extend to the wicked. Therefore they will not rise. Ans. Although the wicked will not rise because of the resurrection of Christ, yet they shall, nevertheless, be raised on account of the just judgment of God. by which they shall be consigned to everlasting punishment. For there may be many and different causes, (if not in number, at least in kind,) especially in different subjects, of one and the same effect. The cause of the resurrection of the godly is, therefore, the resurrection of Christ as of the head. But the resurrection of Christ is not the cause of the resurrection of the wicked, because they are not members of Christ, but the justice of God, and the truth of his threatening Briefly; the wicked shall rise from the dead, not because Christ rose, but on account of the justice of God, that they may be punished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 57 (resurrection of the body)</span></figcaption>

</figure><figure class="quote" id="q-654e99d971" data-kw="">
<blockquote><p>When the change above described has been accomplished, when once the resurrection has taken place, then, according to the language of Scripture, death shall be completely conquered. Not only shall those over whom he had triumphed, and whom he had so long detained in the prison of the grave, be delivered from his power, but there shall be no more death. … The victory over death is to be complete and final.</p></blockquote>

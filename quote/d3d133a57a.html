<main class="wrap"><figure class="quote" id="q-d3d133a57a" data-kw="">
<blockquote><p>I.I.XV. In the covenant of works, man is considered as working, and the reward to be given as of debt; and therefore man’s glorying is not excluded, but he may glory as a faithful servant may do upon the right discharge of his duty, and may claim the reward promised to his working. In the covenant of grace, man in himself ungodly is considered in the covenant, as believing; and eternal life is considered as the merit of the mediator, and as given to man out of free grace, which excludes all boasting, besides the glorying of the believing sinner in God, as his merciful Saviour. I.IX.XVI. The second thing, which we said, § II. was immutable in the covenant of works, was this; that eternal life was not obtainable on any other condition but that of perfect obedience: as may thus be invincibly proved: for, by virtue of this general rule, it was necessary for Christ to be made under the law, Gal. iv. 4. and fulfil all righteousness, and that for this end, that the righteousness of the law might be fulfilled, Rom. viii. 4. But if this righteousness had not been sacred and inviolable, Christ would have been under no necessity to submit to the covenant of the law, in order to merit eternal life for his people. This therefore is evident, that there ought to be a merit of perfect obedience on which a right to eternal life may be founded. Nor is it material whether that perfect obedience be performed by man himself, or by his surety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fd85c6ad04" data-kw="">
<blockquote><p>As to the relation of good works to rewards, it may be observed—(1.) The word merit, in the strict sense of the term, means that common quality of all actions or services to which a reward is due in strict justice on account of their intrinsic value or worthiness. It is evident that, in this strict sense, no work of any creature can in itself merit any reward from God, because (a) all the faculties he possesses were originally granted and are continuously sustained by God, so that he is already so far in debt to God that he can never bring God in debt to him. (b.) Nothing the creature can do can be a just equivalent for the incomparable favour of God and its consequences. There is another sense of the word, however, in which it may be affirmed that if Adam had in his original probation yielded the obedience required, he would have “merited” the reward conditioned upon it, not because of the intrinsic value of that obedience, but because of the terms of the covenant which God had graciously condescended to form with him. By nature, the creature owed the Creator obedience, while the Creator owed the creature nothing. But by covenant the Creator voluntarily bound himself to owe the creature eternal life, upon the condition of perfect obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, (Philadelphia: Presbyterian Board of Publication and Sabbath-School Work, 1869), 307–08.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

d-have-merited/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-83223a61ea" data-kw="">
<blockquote><p>There is nothing in the term reward to justify the inference that our works are the cause of salvation. First, let it be a fixed principle in our hearts, that the kingdom of heaven is not the hire of servants, but the inheritance of sons (Eph. 1:18); an inheritance obtained by those only whom the Lord has adopted as sons, and obtained for no other cause than this adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/privileges-of-sons.html">Privileges of Sons</a> › <a href="../topics/adoption/privileges-of-sons/heirs.html">Heirs</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span></div>

</figure><figure class="quote" id="q-77047bdab6" data-kw="">
<blockquote><p>…the Lutherans could not speak of any reward and exaltation for Christ. For according to them, the human nature of Christ shared in the divine attributes of omnipresence, omniscience, and omnipotence already from the moment of the incarnation. It therefore first received these attributes not as a reward for the mediatorial work done in the state of humiliation but already before hand, in virtue or its union with the divine nature, and also kept them throughout, be it that in his humiliation Christ did not make use of them, at least no public use. The exaltation was not a true and real exaltation, but only a matter of using, or publicly using, that which He already possessed from the beginning. It was not the outcome of an antecedent human development but merely a glorious manifestation of what He already was and possessed in secret.ª ª J. Gerhard, Loci theologici, ed. E. Preuss, 9 vols. (Berlin: G. Schlawitz, 1863-75), IV, 329; J. Quenstedt, Theologia, III, 324; D. Hollaz, Examen, 748; J.F. Buddeus, Inst. theol., 787.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 3.433</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><figure class="quote" id="q-3cdade0ee1" data-kw="">
<blockquote><p>Accordingly, when the Scripture speaks of &quot;a crown of righteousness which God the righteous Judge shall give&quot; &quot;at that day,&quot; (2 Tim. 4:8), I not only say with Augustine, … but I also add, how could he impute righteousness to our works, did not his indulgence hide the unrighteousness that is in them? How could he deem them worthy of reward, did he not with boundless goodness destroy what is unworthy in them? Augustine is wont to give the name of grace to eternal life, because, while it is the recompense of works, it is bestowed by the gratuitous gifts of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.5</span></figcaption>

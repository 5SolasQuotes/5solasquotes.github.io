<main class="wrap"><figure class="quote" id="q-bb73bf2c7a" data-kw="">
<blockquote><p>We are not here to understand by scandal, a thing actually displeasing the party offended; nor is it always to be judged by the matter, seeing offense in lawful matter may be taken where it is not given, as in that eating and drinking mentioned, Rom. 14, or in taking wages for preaching the gospel, 1 Cor. 9. Neither is it the pleasing of men that does always edify them, nor the displeasing of them that does stumble or scandalize them; but scandal is something accompanying word or deed with such circumstances as makes that word or deed inductive to sin, or impeditive of the spiritual life, or comfort of others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-steuart-of-pardovan.html">Walter Steuart of Pardovan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collections &amp; Observations Concerning the Worship, Discipline &amp; Government of the Church of Scotland</cite>, … (1709), bk. 4, Title 1, ‘Of Scandals &amp; Church-Discipline in General…’, p. 197</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f5f7f2e614" data-kw="">
<blockquote><p>4. But if we were malicious in offending at the ceremonies as things unlawful, and in urging of non-conformity as necessary, should they [the prelates] therefore contemn our being scandalized? Those that would have Titus circumcised, were they not malicious? [Gal. 2:3-5] Did they not urge circumcision as necessary? Held they it not unlawful, not to circumcise Titus? Yet did the apostle abstain, because they were to be scandalized, that is, made worse and more wicked calumniators by the circumcising of Titus, as I have showed (above, ch. 8, section 6); So that albeit we are not to care for the displeasing of men that malitiously and contumaciously urge (as necessary) abstaining from that which is lawful to be done, yet must we care for scandalizing them and making them worse: rather ere that be, we ought to abstain from the use of our liberty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, p. 45</span></figcaption>

</figure><figure class="quote" id="q-dd6eb3c3f5" data-kw="">
<blockquote><p>Lastly, there is difference in the faulty carriage of the persons: and that on both parts; especially on ours. For though our non-conforming brethren condemn us [conformists] with much liberty of speech and spirit, having yet less reason for it than the weak Romans had [in ch. 14] (for the strong among them might have forborn some things for the weak’s sake; and it would well have become them for the avoiding of scandal so to have done; which we cannot do without greater scandal in the open contempt of lawful authority…</p></blockquote>

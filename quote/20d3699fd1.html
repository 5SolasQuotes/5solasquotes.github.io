<blockquote><p>Christian mildness and mercy must be exhibited to the sheep of Christ in order to protect them from the wolves, and not to the wolves that they may scatter and destroy the sheep.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-18af1dae4c" data-kw="">
<blockquote><p>When as God has neither tied us to set forms, nor from them, save only as unsuitableness to any particular persons may make one less edifying than the other: And both free prayers and set forms, studied prayers and sudden prayers are all the work of man (as to man’s part): and therefore they must needs be imperfect and faulty as man is: And yet in both we may pray by the Spirit, even with the holy and fervent desires which the Spirit excites in us: And the Spirit may ordinarily be a Spirit of supplication in us and help our infirmities in the one way and in the other: And therefore, though I will not equal them (for I prefer some men’s free praying before any forms, and I prefer the Common prayers before some men’s free prayers), yet I may say that I will neither assent and consent to every word in the one, nor in the other, no not of any man that ever I heard: And yet I will not take it for unlawful to join with Church, or family, or person in the one or in the other: yea, upon long experience, if I had fully my own choice and liberty, I would use free prayer one part of the day (or one day) and a well composed form another part, because I see commodities by both, and such inconveniences of either way alone, as are, if possible to be avoided. But when the mind has received a prejudice against either way, by education, custom, or former distastes, no reason how clear soever will overcome it, till age and experience do mellow green and sour spirits and teach them to judge of things soberly and impartially, not as others judge of them, but as indeed they are.</p></blockquote>

h%20sinful%20neglect" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But while the conduct of Calvin, in the case of Servetus, must be judged of mainly and primarily by the truth or falsehood of the doctrine of the lawfulness of putting heretics and blasphemers to death, — and while every one now concedes that, tried by this test, it cannot be defended, it is quite possible that there may be other collateral views of the matter, which may materially affect our estimate of the different parties, and tell powerfully in the way either of palliation or of aggravation.

Indeed, the only fair and honest question in regard to the case of Servetus, now that the lawfulness of putting heretics to death has been long abandoned, is this — Does Calvin’s conduct in the matter furnish evidence that he was a bad or cruel man? Does it prove him to have been in any respect worse than the other Reformers — that is, worse than the best men of his age? This is the only question which is now entitled to consideration, and this question, we venture to assert, must be answered in the negative, by every one who is not perverted by hatred of the truth which Calvin taught, by every one who is possessed of impartiality and candour. The leading considerations which prove that this is the only answer that can be given to the question, we shall merely state, without enlarging upon them.

1. The doctrine of the lawfulness and duty of putting heretics and blasphemers to death, was then almost universally held, by Protestants as well as Papists, – by men of unquestionable piety and benevolence, if there were any such persons, – and those who were zealous for God’s truth were then not only willing but anxious to act upon this doctrine whenever opportunity occurred.

There is no need to produce evidence of this position; but it may be proper to advert here to a statement which seems to contradict it, made by Dr Stebbing thinks that Henry has gone too far in defending Calvin, and in his anxiety to repudiate all concurrence in this, he makes the following statement, in his preface: “Henry has defended Calvin in the case of Servetus with admirable ability; but the translator believes still, as he has ever believed, that when men enjoy so large a share of light and wisdom as Calvin possessed, they cannot be justified, if guilty of persecution, because they lived in times when wicked and vulgar minds warred against the rights of human conscience.”

Now this statement obviously and necessarily implies, that in Calvin’s time it was only “wicked and vulgar minds” who countenanced persecution, and that Calvin’s conduct is indefensible, because he agreed on this point only with the wicked and the vulgar, and differed from the better and higher class of minds, among his contemporaries. This is what Dr Stebbing has said. But of course he could not mean to say this; for he must have known, if he gave any attention to what he was saying, that the statement is unquestionably false.

Every one knows that in Calvin’s time the defence of persecuting principles was not confined to the “wicked and vulgar”, but was almost universally held, even among the best and highest minds. It is to be presumed that Mr Wallace did not perceive the folly or the falsehood of this statement of Dr Stebbing’s, when he quoted it with so much gusto, and set it forth as a “well-merited censure from the pen of one of Calvin’s most ardent admirers.”

2. Servetus was not only a heretic and blasphemer, but one about whom there was everything to provoke and nothing to conciliate. More than twenty years before his death he had put forth views which led Bucer, one of the most moderate of the Reformers, to declare that he ought to be torn in pieces. He continued thereafter to lead a life of deliberate hypocrisy, living for many years in the house of a popish prelate, conforming outwardly to the Church of Rome, while, at the same time, he embraced every safe opportunity of propagating his offensive heresies and blasphemies against the most sacred and fundamental doctrines of Christianity.

He repeatedly denied, upon oath, all knowledge of the books which he had published, and he conducted himself during his trial with reckless violence and mendacity. We do not mention these things as if they excused or palliated his being put to death, but merely as illustrating the unreasonableness and unfairness of attempting to represent the case as one of peculiar aggravation, or as specially entitled to sympathy. Chaufepie, whose article on Servetus in the 4th volume of his Continuation of Bayle’s Dictionary is, perhaps, upon the whole, the best and fairest view of the subject that exists, says: “Unfortunately for this great man (Calvin) he is more odious to certain people than Servetus is. They cannot resolve to render him the justice, which no impartial person can refuse to him, without doing an injury to his own judgment.”

3. Servetus had been convicted of heresy and blasphemy by a Popish tribunal at Vienne, and had been condemned to be burned by a slow fire; and he escaped from prison and came to Geneva with that sentence hanging over him. During his trial at Geneva the Popish authorities transmitted the sentence they had pronounced against him, and reclaimed him, that they might carry it into execution. It was then put to Servetus, whether he would go back to Vienne or go on with his trial at Geneva. He preferred to remain where he was, and there is good reason to believe that the determination of the civil authorities at Geneva to pronounce and execute upon him a sentence of death, was, in some measure, produced by the fear that the Papists would charge them with being indifferent, if not favourable, to heresy, if they spared him.

There is abundant evidence that this consideration operated, to some extent, as a motive, upon the conduct of the Protestant churches at the time of the Reformation. As a specimen of this, we may refer to Bishop Jewel’s “Apology of the Church of England,” a work which was approved of by the Convocation, and thus clothed with public authority. In the third chapter of the Apology, sect. 2, Jewel boasts, that Protestants not only detested and denounced all the heretics who had been condemned by the ancient church, but also that, when any of these heresies broke out amongst them, “they seriously and severely coerced the broachers of them with lawful and civil punishments.”

If this was distinctly set forth and boasted of as an ordinary rule of procedure, in opposition to Popish allegations, we cannot doubt that the consideration would operate most powerfully, in so very peculiar, and indeed unexampled, a case as that of Servetus, in which not only had a popish tribunal condemned him to the flames, but had publicly demanded his person that they might put that sentence in execution. In these circumstances, no Protestant tribunal could be expected to do anything else but pronounce a similar sentence, unless either the proof of the charge of heresy and blasphemy had failed, or they had believed it to be unlawful to put heretics and blasphemers to death.

4. Although Calvin, after having, notwithstanding extreme personal provocation, done everything in his power to convince Servetus of his errors, approved of putting him to death as an incorrigible heretic and blasphemer, he exerted his influence, but without success, to prevent his being burned, and to effect that he might be put to death by some less cruel and offensive process; so that to talk, as is often done, of Calvin burning Servetus, is simply and literally a falsehood.

5. The Reformers generally, and more especially two of the mildest and most moderate of them all, both in their theological views and in their general character, – Melancthon, representing the Lutherans, and Bullinger, representing the Zwinglians, – gave their full, formal, public approbation to the proceedings which took place in Geneva in the case of Servetus.

6. Archbishop Cranmer exerted all his influence with King Edward, and succeeded thereby, though not without great difficulty, in effecting the burning of two heretics – one of them a woman and the other a foreigner – whose offences were in every respect, and tried by any standard whatever, far less aggravated than Servetus’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John Calvin in The Reformers and the Theology of the Reformation</cite></span></figcaption>

There is no need to produce evidence of this position; but it may be proper to advert here to a statement which seems to contradict it, made by Dr Stebbing thinks that Henry has gone too far in defending Calvin, and in his anxiety to repudiate all concurrence in this, he makes the following statement, in his preface: “Henry has defended Calvin in the case of Servetus with admirable ability; but the translator believes still, as he has ever believed, that when men enjoy so large a share of light and wisdom as Calvin possessed, they cannot be justified, if guilty of persecution, because they lived in times when wicked and vulgar minds warred against the rights of human conscience.”

Now this statement obviously and necessarily implies, that in Calvin’s time it was only “wicked and vulgar minds” who countenanced persecution, and that Calvin’s conduct is indefensible, because he agreed on this point only with the wicked and the vulgar, and differed from the better and higher class of minds, among his contemporaries. This is what Dr Stebbing has said. But of course he could not mean to say this; for he must have known, if he gave any attention to what he was saying, that the statement is unquestionably false.

Every one knows that in Calvin’s time the defence of persecuting principles was not confined to the “wicked and vulgar”, but was almost universally held, even among the best and highest minds. It is to be presumed that Mr Wallace did not perceive the folly or the falsehood of this statement of Dr Stebbing’s, when he quoted it with so much gusto, and set it forth as a “well-merited censure from the pen of one of Calvin’s most ardent admirers.”

2. Servetus was not only a heretic and blasphemer, but one about whom there was everything to provoke and nothing to conciliate. More than twenty years before his death he had put forth views which led Bucer, one of the most moderate of the Reformers, to declare that he ought to be torn in pieces. He continued thereafter to lead a life of deliberate hypocrisy, living for many years in the house of a popish prelate, conforming outwardly to the Church of Rome, while, at the same time, he embraced every safe opportunity of propagating his offensive heresies and blasphemies against the most sacred and fundamental doctrines of Christianity.

He repeatedly denied, upon oath, all knowledge of the books which he had published, and he conducted himself during his trial with reckless violence and mendacity. We do not mention these things as if they excused or palliated his being put to death, but merely as illustrating the unreasonableness and unfairness of attempting to represent the case as one of peculiar aggravation, or as specially entitled to sympathy. Chaufepie, whose article on Servetus in the 4th volume of his Continuation of Bayle’s Dictionary is, perhaps, upon the whole, the best and fairest view of the subject that exists, says: “Unfortunately for this great man (Calvin) he is more odious to certain people than Servetus is. They cannot resolve to render him the justice, which no impartial person can refuse to him, without doing an injury to his own judgment.”

3. Servetus had been convicted of heresy and blasphemy by a Popish tribunal at Vienne, and had been condemned to be burned by a slow fire; and he escaped from prison and came to Geneva with that sentence hanging over him. During his trial at Geneva the Popish authorities transmitted the sentence they had pronounced against him, and reclaimed him, that they might carry it into execution. It was then put to Servetus, whether he would go back to Vienne or go on with his trial at Geneva. He preferred to remain where he was, and there is good reason to believe that the determination of the civil authorities at Geneva to pronounce and execute upon him a sentence of death, was, in some measure, produced by the fear that the Papists would charge them with being indifferent, if not favourable, to heresy, if they spared him.

There is abundant evidence that this consideration operated, to some extent, as a motive, upon the conduct of the Protestant churches at the time of the Reformation. As a specimen of this, we may refer to Bishop Jewel’s “Apology of the Church of England,” a work which was approved of by the Convocation, and thus clothed with public authority. In the third chapter of the Apology, sect. 2, Jewel boasts, that Protestants not only detested and denounced all the heretics who had been condemned by the ancient church, but also that, when any of these heresies broke out amongst them, “they seriously and severely coerced the broachers of them with lawful and civil punishments.”

If this was distinctly set forth and boasted of as an ordinary rule of procedure, in opposition to Popish allegations, we cannot doubt that the consideration would operate most powerfully, in so very peculiar, and indeed unexampled, a case as that of Servetus, in which not only had a popish tribunal condemned him to the flames, but had publicly demanded his person that they might put that sentence in execution. In these circumstances, no Protestant tribunal could be expected to do anything else but pronounce a similar sentence, unless either the proof of the charge of heresy and blasphemy had failed, or they had believed it to be unlawful to put heretics and blasphemers to death.

4. Although Calvin, after having, notwithstanding extreme personal provocation, done everything in his power to convince Servetus of his errors, approved of putting him to death as an incorrigible heretic and blasphemer, he exerted his influence, but without success, to prevent his being burned, and to effect that he might be put to death by some less cruel and offensive process; so that to talk, as is often done, of Calvin burning Servetus, is simply and literally a falsehood.

5. The Reformers generally, and more especially two of the mildest and most moderate of them all, both in their theological views and in their general character, – Melancthon, representing the Lutherans, and Bullinger, representing the Zwinglians, – gave their full, formal, public approbation to the proceedings which took place in Geneva in the case of Servetus.

6. Archbishop Cranmer exerted all his influence with King Edward, and succeeded thereby, though not without great difficulty, in effecting the burning of two heretics – one of them a woman and the other a foreigner – whose offences were in every respect, and tried by any standard whatever, far less aggravated than Servetus’s.”

— William Cunningham, John Calvin in The Reformers and the Theology of the Reformation">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+while+the+conduct+of+Calvin%2C+in+the+case+of+Servetus%2C+must+be+judged+of+mainly+and+primarily+by+the+truth+or+falsehood+of+the+doctrine+of+the+lawfulness+of+putting+heretics+and+blasphemers+to+death%2C+%E2%80%94+and+while+every+one+now+concedes+that%2C+tried+by+this+test%2C+it+cannot+be+defended%2C+it+is+quite+possible+that+there+may+be+other+collateral+views+of+the+matter%2C+which+may+materially+affect+our+estimate+of+the+different+parties%2C+and+tell+powerfully+in+the+way+either+of+palliation+or+of+aggravation.%0A%0AIndeed%2C+the+only+fair+and+honest+question+in+regard+to+the+case+of+Servetus%2C+now+that+the+lawfulness+of+putting+heretics+to+death+has+been+long+abandoned%2C+is+this+%E2%80%94+Does+Calvin%E2%80%99s+conduct+in+the+matter+furnish+evidence+that+he+was+a+bad+or+cruel+man%3F+Does+it+prove+him+to+have+been+in+any+respect+worse+than+the+other+Reformers+%E2%80%94+that+is%2C+worse+than+the+best+men+of+his+age%3F+This+is+the+only+question+which+is+now+entitled+to+consideration%2C+and+this+question%2C+we+venture+to+assert%2C+must+be+answered+in+the+negative%2C+by+every+one+who+is+not+perverted+by+hatred+of+the+truth+which+Calvin+taught%2C+by+every+one+who+is+possessed+of+impartiality+and+candour.+The+leading+considerations+which+prove+that+this+is+the+only+answer+that+can+be+given+to+the+question%2C+we+shall+merely+state%2C+without+enlarging+upon+them.%0A%0A1.+The+doctrine+of+the+lawfulness+and+duty+of+putting+heretics+and+blasphemers+to+death%2C+was+then+almost+universally+held%2C+by+Protestants+as+well+as+Papists%2C+%E2%80%93+by+men+of+unquestionable+piety+and+benevolence%2C+if+there+were+any+such+persons%2C+%E2%80%93+and+those+who+were+zealous+for+God%E2%80%99s+truth+were+then+not+only+willing+but+anxious+to+act+upon+this+doctrine+whenever+opportunity+occurred.%0A%0AThere+is+no+need+to+produce+evidence+of+this+position%3B+but+it+may+be+proper+to+advert+here+to+a+statement+which+seems+to+contradict+it%2C+made+by+Dr+Stebbing+thinks+that+Henry+has+gone+too+far+in+defending+Calvin%2C+and+in+his+anxiety+to+repudiate+all+concurrence+in+this%2C+he+makes+the+following+statement%2C+in+his+preface%3A+%E2%80%9CHenry+has+defended+Calvin+in+the+case+of+Servetus+with+admirable+ability%3B+but+the+translator+believes+still%2C+as+he+has+ever+believed%2C+that+when+men+enjoy+so+large+a+share+of+light+and+wisdom+as+Calvin+possessed%2C+they+cannot+be+justified%2C+if+guilty+of+persecution%2C+because+they+lived+in+times+when+wicked+and+vulgar+minds+warred+against+the+rights+of+human+conscience.%E2%80%9D%0A%0ANow+this+statement+obviously+and+necessarily+implies%2C+that+in+Calvin%E2%80%99s+time+it+was+only+%E2%80%9Cwicked+and+vulgar+minds%E2%80%9D+who+countenanced+persecution%2C+and+that+Calvin%E2%80%99s+conduct+is+indefensible%2C+because+he+agreed+on+this+point+only+with+the+wicked+and+the+vulgar%2C+and+differed+from+the+better+and+higher+class+of+minds%2C+among+his+contemporaries.+This+is+what+Dr+Stebbing+has+said.+But+of+course+he+could+not+mean+to+say+this%3B+for+he+must+have+known%2C+if+he+gave+any+attention+to+what+he+was+saying%2C+that+the+statement+is+unquestionably+false.%0A%0AEvery+one+knows+that+in+Calvin%E2%80%99s+time+the+defence+of+persecuting+principles+was+not+confined+to+the+%E2%80%9Cwicked+and+vulgar%E2%80%9D%2C+but+was+almost+universally+held%2C+even+among+the+best+and+highest+minds.+It+is+to+be+presumed+that+Mr+Wallace+did+not+perceive+the+folly+or+the+falsehood+of+this+statement+of+Dr+Stebbing%E2%80%99s%2C+when+he+quoted+it+with+so+much+gusto%2C+and+set+it+forth+as+a+%E2%80%9Cwell-merited+censure+from+the+pen+of+one+of+Calvin%E2%80%99s+most+ardent+admirers.%E2%80%9D%0A%0A2.+Servetus+was+not+only+a+heretic+and+blasphemer%2C+but+one+about+whom+there+was+everything+to+provoke+and+nothing+to+conciliate.+More+than+twenty+years+before+his+death+he+had+put+forth+views+which+led+Bucer%2C+one+of+the+most+moderate+of+the+Reformers%2C+to+declare+that+he+ought+to+be+torn+in+pieces.+He+continued+thereafter+to+lead+a+life+of+deliberate+hypocrisy%2C+living+for+many+years+in+the+house+of+a+popish+prelate%2C+conforming+outwardly+to+the+Church+of+Rome%2C+while%2C+at+the+same+time%2C+he+embraced+every+safe+opportunity+of+propagating+his+offensive+heresies+and+blasphemies+against+the+most+sacred+and+fundamental+doctrines+of+Christianity.%0A%0AHe+repeatedly+denied%2C+upon+oath%2C+all+knowledge+of+the+books+which+he+had+published%2C+and+he+conducted+himself+during+his+trial+with+reckless+violence+and+mendacity.+We+do+not+mention+these+things+as+if+they+excused+or+palliated+his+being+put+to+death%2C+but+merely+as+illustrating+the+unreasonableness+and+unfairness+of+attempting+to+represent+the+case+as+one+of+peculiar+aggravation%2C+or+as+specially+entitled+to+sympathy.+Chaufepie%2C+whose+article+on+Servetus+in+the+4th+volume+of+his+Continuation+of+Bayle%E2%80%99s+Dictionary+is%2C+perhaps%2C+upon+the+whole%2C+the+best+and+fairest+view+of+the+subject+that+exists%2C+says%3A+%E2%80%9CUnfortunately+for+this+great+man+%28Calvin%29+he+is+more+odious+to+certain+people+than+Servetus+is.+They+cannot+resolve+to+render+him+the+justice%2C+which+no+impartial+person+can+refuse+to+him%2C+without+doing+an+injury+to+his+own+judgment.%E2%80%9D%0A%0A3.+Servetus+had+been+convicted+of+heresy+and+blasphemy+by+a+Popish+tribunal+at+Vienne%2C+and+had+been+condemned+to+be+burned+by+a+slow+fire%3B+and+he+escaped+from+prison+and+came+to+Geneva+with+that+sentence+hanging+over+him.+During+his+trial+at+Geneva+the+Popish+authorities+transmitted+the+sentence+they+had+pronounced+against+him%2C+and+reclaimed+him%2C+that+they+might+carry+it+into+execution.+It+was+then+put+to+Servetus%2C+whether+he+would+go+back+to+Vienne+or+go+on+with+his+trial+at+Geneva.+He+preferred+to+remain+where+he+was%2C+and+there+is+good+reason+to+believe+that+the+determination+of+the+civil+authorities+at+Geneva+to+pronounce+and+execute+upon+him+a+sentence+of+death%2C+was%2C+in+some+measure%2C+produced+by+the+fear+that+the+Papists+would+charge+them+with+being+indifferent%2C+if+not+favourable%2C+to+heresy%2C+if+they+spared+him.%0A%0AThere+is+abundant+evidence+that+this+consideration+operated%2C+to+some+extent%2C+as+a+motive%2C+upon+the+conduct+of+the+Protestant+churches+at+the+time+of+the+Reformation.+As+a+specimen+of+this%2C+we+may+refer+to+Bishop+Jewel%E2%80%99s+%E2%80%9CApology+of+the+Church+of+England%2C%E2%80%9D+a+work+which+was+approved+of+by+the+Convocation%2C+and+thus+clothed+with+public+authority.+In+the+third+chapter+of+the+Apology%2C+sect.+2%2C+Jewel+boasts%2C+that+Protestants+not+only+detested+and+denounced+all+the+heretics+who+had+been+condemned+by+the+ancient+church%2C+but+also+that%2C+when+any+of+these+heresies+broke+out+amongst+them%2C+%E2%80%9Cthey+seriously+and+severely+coerced+the+broachers+of+them+with+lawful+and+civil+punishments.%E2%80%9D%0A%0AIf+this+was+distinctly+set+forth+and+boasted+of+as+an+ordinary+rule+of+procedure%2C+in+opposition+to+Popish+allegations%2C+we+cannot+doubt+that+the+consideration+would+operate+most+powerfully%2C+in+so+very+peculiar%2C+and+indeed+unexampled%2C+a+case+as+that+of+Servetus%2C+in+which+not+only+had+a+popish+tribunal+condemned+him+to+the+flames%2C+but+had+publicly+demanded+his+person+that+they+might+put+that+sentence+in+execution.+In+these+circumstances%2C+no+Protestant+tribunal+could+be+expected+to+do+anything+else+but+pronounce+a+similar+sentence%2C+unless+either+the+proof+of+the+charge+of+heresy+and+blasphemy+had+failed%2C+or+they+had+believed+it+to+be+unlawful+to+put+heretics+and+blasphemers+to+death.%0A%0A4.+Although+Calvin%2C+after+having%2C+notwithstanding+extreme+personal+provocation%2C+done+everything+in+his+power+to+convince+Servetus+of+his+errors%2C+approved+of+putting+him+to+death+as+an+incorrigible+heretic+and+blasphemer%2C+he+exerted+his+influence%2C+but+without+success%2C+to+prevent+his+being+burned%2C+and+to+effect+that+he+might+be+put+to+death+by+some+less+cruel+and+offensive+process%3B+so+that+to+talk%2C+as+is+often+done%2C+of+Calvin+burning+Servetus%2C+is+simply+and+literally+a+falsehood.%0A%0A5.+The+Reformers+generally%2C+and+more+especially+two+of+the+mildest+and+most+moderate+of+them+all%2C+both+in+their+theological+views+and+in+their+general+character%2C+%E2%80%93+Melancthon%2C+representing+the+Lutherans%2C+and+Bullinger%2C+representing+the+Zwinglians%2C+%E2%80%93+gave+their+full%2C+formal%2C+public+approbation+to+the+proceedings+which+took+place+in+Geneva+in+the+case+of+Servetus.%0A%0A6.+Archbishop+Cranmer+exerted+all+his+influence+with+King+Edward%2C+and+succeeded+thereby%2C+though+not+without+great+difficulty%2C+in+effecting+the+burning+of+two+heretics+%E2%80%93+one+of+them+a+woman+and+the+other+a+foreigner+%E2%80%93+whose+offences+were+in+every+respect%2C+and+tried+by+any+standard+whatever%2C+far+less+aggravated+than+Servetus%E2%80%99s.%E2%80%9D%0A%0A%E2%80%94+William+Cunningham%2C+John+Calvin+in+The+Reformers+and+the+Theology+of+the+Reformation&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe18e4f7a0c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e18e4f7a0c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/06/30/william-cunningham-on-the-reformers-and-the-punishment-of-heresy-and-blasphemy/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-20727f9d68" data-kw="">
<blockquote><p>For although, as I said, I little approve it, yet I see that sometimes in these indifferent matters some things, although they be grievous and burdensome, are to be born so long as it is not permitted by law to deviate from them; lest, if we contend for them more bitterly than we ought, this may be a hindrance to the advancement of the Gospel, and those things which are in their nature indifferent may, by our vehement contention, be represented as ungodly. Now these things, unless I am deceived, bring with them two most heavy inconveniences. For, if we should first suffer the Gospel both to be spread abroad and to take deep root, men would perhaps be better and more easily persuaded to remove these outward appurtenances. While any one is sick, and is by little and little amending, he takes it very ill that certain slight and trifling things, as well in food as in drink, should be removed from him. But the same person, having recovered his health, rejects those things of his own accord as disagreeable and of little use. If England were first well and diligently instructed and confirmed in the most necessary heads of religion, she would not, in my opinion, at length take it in ill part that these things, however superfluous, should be removed. But at this time, since a change is being introduced in necessary points of religion, and that with so great difficulty, if we should also speak of those things as ungodly which are indifferent, the minds of almost all men would be so turned away from us, that they would no longer show themselves to be attentive and patient hearers of sound doctrine and necessary sermons… Do not however gather from hence that I think a minister of the Gospel should never strive to assert the truth of the Scriptures and of doctrines. This I do not affirm: [those] who daily come forward, both in public and private disputations, in the most weighty controversies for religion. But this I say, that these things which are of less moment ought not to be a hindrance through our contention… Further, if we proceed to oppose these indifferent things as destructive and ungodly, we condemn very many Churches that are not alien from the Gospel, and we too bitterly reprove innumerable Churches which are of old distinguished as most worthy of praise. I do not forget that the authority of Churches, whether present or past, ought not to be of such force, that by them the truth of God’s Word should be overborne: for that ought to remain unshaken and unmoved… But I contend that on account of things indifferent, this ought by no means to come to pass that churches should be condemned, or that we should speak unfavourably of them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gorham, Gleanings of a few scattered ears during the period of the Reformation in England</cite>, (London, 1857), Letter 53, ‘Martyr to Bishop [John] Hooper’, Nov. 4, 1550, pp. 189-90, 92, 94-96</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b2ae6493e6" data-kw="">
<blockquote><p>But, good friend, if really Christ and Scripture be your guide, I desire no more; tell me, and lay by partiality: Did not Christ and his apostles use both in the synagogues, Church, meetings and writings a faulty translation of the Old Testament, and as bad as ours. Deny it if you can for shame. Though sometimes they varied, they mostly used the Septuagint, according to which our faulty translation of the Old Testament is made, as it differs from the Hebrew. Is this no confutation of you? [(1)] Yea, Christ and the apostles used it the rather because it was in common use… I would add a similitude [It was actually a real and common scenario in that era]: Supposing that we had just possession of the public church-places and tithes, and they are taken from us, and we can blame them that did it and say over and over, ‘We had possession;’ and therefore it is unlawful to meet in worse rooms, for God must have the best: will this hold when you cannot keep possession? Will you rather worship nowhere? This is no better than if you would tell all men they should die rather than eat brown bread, if force take all other [food] from them, because it is unjustly done and they had possession of better. Good friends, keep your possession for me, but I own not the famishing of all that are dispossessed. If you do, I do not… How much the Septuagint differs from the Hebrew, how many verses it leaves out, how many additions and alterations it makes, is commonly known. Christ’s and the apostles’ use of this was no approbation of its faults, much less their presence in the synagogues when others read Moses and the prophets in them. And the Psalms in the Septuagint translation were part of their liturgy. For man to speak faultily is no wonder: It has a more plausible pretence for separation to say that men corrupt the Word of God. And yet when it is but such an effect of human imperfection, it is no just pretence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, … (London: Parkhurst, 1684) | section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ See also the whole of this article.</span></figcaption>

<blockquote><p>…as to the preaching of the Word, we grant that the people are not obliged to give blind and implicit obedience to what is delivered by the ministers, as if they ought to receive as the Word of God whatsoever is delivered by them, but that they have power and ought by the judgment of discretion to search the Scriptures whether the things delivered by the ministers be so, to try the spirits whether they be of God or not, to prove all things and hold fast that which is good, Acts 17:11; 1 Jn. 4:1; 1 Thess. 5:18; and the like judgment of discretion we grant to them in relation to other parts of worship.</p></blockquote>

<blockquote><p>Other churches there are in the world which are not evidently guilty of the enormities in doctrine, worship and discipline before discoursed of. These all we judge to be true churches of Christ; and do hope that his promised presence is with them in their assemblies. Answerable hereunto is our judgment concerning their officers or rulers, and all their sacred administrations. It becomes us to think and believe that the one [their offices] have authority from Christ and that the other [their sacred administrations] are accepted with Him: For it is most unwarrantable rashness and presumption, yea an evident fruit of ignorance, or want of love, or secular private interest, when, upon lesser differences men judge churches to be no true churches and their ministers to be no true ministers, and consequently all their administrations to be invalid… But the validity or invalidity of the ordinances of Christ, which are the means of union and communion with Him unto all his disciples, depend not on the determination of things highly disputable in their notion, and not inconsistent with true Gospel-obedience in their practice… We stand to the judgment of Christ and his Word. We cannot but judge indeed that many Churches have missed, and do miss in some things the precise rules of their due constitution and walking; that many of them have added useless, superfluous rites to the worship of God among them; that there is in many of them a sinful neglect of evangelical discipline, or a carnal rule erected in the stead of it; that errors in doctrines of importance and danger, are prevalent in sundry of them; that their rulers are much influenced by a spirit of bitterness and envy against such as plead for reformation beyond their measure or interest; yet that hereupon they should all or any of them immediately forfeit their church-state, so as to have no lawful ministers, nor acceptable sacred administrations, is in itself a false imagination, and such as was never by us entertained.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Other churches there are in the world which are not evidently guilty of the enormities in doctrine, worship and discipline before discoursed of. These all we judge to be true churches of Christ; and do hope that his promised presence is with them in their assemblies. Answerable hereunto is our judgment concerning their officers or rulers, and all their sacred administrations. It becomes us to think and believe that the one [their offices] have authority from Christ and that the other [their sacred administrations] are accepted with Him: For it is most unwarrantable rashness and presumption, yea an evident fruit of ignorance, or want of love, or secular private interest, when, upon lesser differences men judge churches to be no true churches and their ministers to be no true ministers, and consequently all their administrations to be invalid… But the validity or invalidity of the ordinances of Christ, which are the means of union and communion with Him unto all his disciples, depend not on the determination of things highly disputable in their notion, and not inconsistent with true Gospel-obedience in their practice… We stand to the judgment of Christ and his Word. We cannot but judge indeed that many Churches have missed, and do miss in some things the precise rules of their due constitution and walking; that many of them have added useless, superfluous rites to the worship of God among them; that there is in many of them a sinful neglect of evangelical discipline, or a carnal rule erected in the stead of it; that errors in doctrines of importance and danger, are prevalent in sundry of them; that their rulers are much influenced by a spirit of bitterness and envy against such as plead for reformation beyond their measure or interest; yet that hereupon they should all or any of them immediately forfeit their church-state, so as to have no lawful ministers, nor acceptable sacred administrations, is in itself a false imagination, and such as was never by us entertained.”

— John Owen, A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious (1672), ch. 3, pp. 84-86">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COther+churches+there+are+in+the+world+which+are+not+evidently+guilty+of+the+enormities+in+doctrine%2C+worship+and+discipline+before+discoursed+of.+These+all+we+judge+to+be+true+churches+of+Christ%3B+and+do+hope+that+his+promised+presence+is+with+them+in+their+assemblies.+Answerable+hereunto+is+our+judgment+concerning+their+officers+or+rulers%2C+and+all+their+sacred+administrations.+It+becomes+us+to+think+and+believe+that+the+one+%5Btheir+offices%5D+have+authority+from+Christ+and+that+the+other+%5Btheir+sacred+administrations%5D+are+accepted+with+Him%3A+For+it+is+most+unwarrantable+rashness+and+presumption%2C+yea+an+evident+fruit+of+ignorance%2C+or+want+of+love%2C+or+secular+private+interest%2C+when%2C+upon+lesser+differences+men+judge+churches+to+be+no+true+churches+and+their+ministers+to+be+no+true+ministers%2C+and+consequently+all+their+administrations+to+be+invalid%E2%80%A6+But+the+validity+or+invalidity+of+the+ordinances+of+Christ%2C+which+are+the+means+of+union+and+communion+with+Him+unto+all+his+disciples%2C+depend+not+on+the+determination+of+things+highly+disputable+in+their+notion%2C+and+not+inconsistent+with+true+Gospel-obedience+in+their+practice%E2%80%A6+We+stand+to+the+judgment+of+Christ+and+his+Word.+We+cannot+but+judge+indeed+that+many+Churches+have+missed%2C+and+do+miss+in+some+things+the+precise+rules+of+their+due+constitution+and+walking%3B+that+many+of+them+have+added+useless%2C+superfluous+rites+to+the+worship+of+God+among+them%3B+that+there+is+in+many+of+them+a+sinful+neglect+of+evangelical+discipline%2C+or+a+carnal+rule+erected+in+the+stead+of+it%3B+that+errors+in+doctrines+of+importance+and+danger%2C+are+prevalent+in+sundry+of+them%3B+that+their+rulers+are+much+influenced+by+a+spirit+of+bitterness+and+envy+against+such+as+plead+for+reformation+beyond+their+measure+or+interest%3B+yet+that+hereupon+they+should+all+or+any+of+them+immediately+forfeit+their+church-state%2C+so+as+to+have+no+lawful+ministers%2C+nor+acceptable+sacred+administrations%2C+is+in+itself+a+false+imagination%2C+and+such+as+was+never+by+us+entertained.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+A+Discourse+concerning+Evangelical+Love%2C+Church-Peace+%26+Unity%2C+with+the+Occasions+%26+Reasons+present+Differences+%26+Divisions+about+Things+Sacred+%26+Religious+%281672%29%2C+ch.+3%2C+pp.+84-86&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F29283f1287.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/29283f1287.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Other%20churches%20there%20are%20in%20the,as%20was%20never%20by%20us%20entertained&amp;text=Other%20churches%20there%20are%20in%20the%20world%20which&amp;text=and%20such%20as%20was%20never%20by%20us%20entertained" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

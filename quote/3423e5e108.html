<main class="wrap"><figure class="quote" id="q-3423e5e108" data-kw="">
<blockquote><p>Of how much sorer punishment, suppose ye, shall he be thought worthy, who hath trodden under foot the Son of God, and hath counted the blood of the covenant, wherewith he was sanctified, an unholy thing, and hath done despite unto the Spirit of grace?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“Of how much sorer punishment, suppose ye, shall he be thought worthy, who hath trodden under foot the Son of God, and hath counted the blood of the covenant, wherewith he was sanctified, an unholy thing, and hath done despite unto the Spirit of grace?”

— John Calvin, Commentary on Hebrews">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COf+how+much+sorer+punishment%2C+suppose+ye%2C+shall+he+be+thought+worthy%2C+who+hath+trodden+under+foot+the+Son+of+God%2C+and+hath+counted+the+blood+of+the+covenant%2C+wherewith+he+was+sanctified%2C+an+unholy+thing%2C+and+hath+done+despite+unto+the+Spirit+of+grace%3F%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+Hebrews&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3423e5e108.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3423e5e108.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-common-operations-of-the-spirit/#:~:text=Of%20how%20much%20sorer%20punishment%2C%20suppose,despite%20unto%20the%20Spirit%20of%20grace&amp;text=Of%20how%20much%20sorer%20punishment%2C%20suppose%20ye%2C%20shall&amp;text=hath%20done%20despite%20unto%20the%20Spirit%20of%20grace" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bcce423899" data-kw="">
<blockquote><p>As we see from the Westminster Confession and the 1689 Baptist Confession the Puritans believed in the doctrines of grace such as election and particular redemption (Rom 8:28-30). They followed Calvin in resisting false human rationalisations. For instance they resisted the idea that God only loves the elect and hates the non-elect. This error is called hyper-Calvinism. It is a very serious error which is recurring today. The Puritans were experts in their understanding of the concept of common grace although they did not use that term.¹ Their teaching accords fully with the way in which the doctrine of Common Grace is expounded by Prof John Murray (cf Works). They believed that the Holy Spirit is constantly active in restraining evil and promoting good throughout society. The Puritans believed in the universal love of God for all mankind (1 Tim 2:1-6; 2 Peter 3:9). They believed in the universal provision of God for all mankind according to the covenant made with Noah as representative of the whole world (Gen 8:20-22 and Ps 145). ¹ [Webmaster’s note: This particular claim is not true. Following Calvin’s use of the term ‘general grace’, the puritans did use the term ‘common grace’, as is affirmed by Dr. Richard Muller below on p. 130, and as is instanced by James Durham (who has a whole section on ‘common grace’ in his Revelation commentary), Stephen Charnock (below), and John Bunyan (below).]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erroll-hulse.html">Erroll Hulse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Example of the English Puritans”</cite>, (Reformation Today 153, Sept/Oct 1996)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-3d59250527" data-kw="">
<blockquote><p>Mercy and love are seen, in that God gives us rain and fruitful seasons, and in that he fills our hearts with food and gladness; from that bounty which he bestows upon us as men, as his creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Light for Them That Sit in Darkness, in The Works of John Bunyan</cite>, (Grand Rapids, MI: Baker, 1977), 1:432</span></figcaption>

</figure><figure class="quote" id="q-51668855c3" data-kw="">
<blockquote><p>And accordingly we distinguish of the effects of God’s love in respect whereof He is said to love his creature. For they may be considered either in respect of life temporal, or of life spiritual, or of life eternal. The first effects of love, as touching life temporal, God communicates to all that have life; thus He is said to save both man and beast, and the eyes of all are said to wait upon Him; He hears the cry of ravens; the sparrows fall not to the ground without the providence divine; The very lions roaring after their prey, do seek their meat at [from] God. Thus He may be said to be as the Savior, so the lover of all men; but especially of them that believe, to wit, both in respect of the comforts of life spiritual, and the joys of life eternal which He affords unto them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Synod of Dort &amp; Arles Reduced to the Practice</cite>, (1651), p. 52</span></figcaption>

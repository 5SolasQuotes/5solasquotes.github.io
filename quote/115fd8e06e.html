<main class="wrap"><figure class="quote" id="q-115fd8e06e" data-kw="">
<blockquote><p>I do not desire to reflect upon our fathers for bringing home Charles Stuart to get the crown; indeed, some of them, and amongst others the reverend and worthy Mr [John] Livingstone, did regret and go mourning to the grave for it. Yea, his actions since, and the connivances of those who had his favour or any power under him, evidence that it is impossible to manifest or maintain the royal prerogatives of Jesus Christ and yet maintain the king’s civil rights.

Since it is so declared that we must either quit him as king or Christ, indeed for my part I am for no king but Jesus Christ, since they will have none but Caesar. When Christ is seated upon His throne and His crown upon His head, let such magistrates be appointed in every particular station as will employ their power for the advancement of His kingdom, and for destroying the kingdom of darkness in this land and in every place where Christ shall reign; and then let them be owned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cameron.html">Richard Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Good News to Scotland, 8 July 1680 in Sermons in Times of Persecution in Scotland, by Sufferers for the Royal Prerogatives of Jesus Christ</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-54003c0f60" data-kw="">
<blockquote><p>The practice of the ancient heathen rulers furnishes an argument for the public support of religion that ought not to be ignored. Ignorant as they were of supernatural revelation, they were necessarily thrown on the light of nature for direction. In such circumstances we have a right to apply the principle laid down by the Apostle Paul, when arguing with the Corinthians – “Doth not even nature teach you?”

Ignorant as they were of the true religion, the ancient heathen nations had an idea of the value and influence as a means of social improvement. However much their false religions may have failed as to the end proposed, their example shows at least that even the light of nature, dim as it is, suggests the obligation, to provide for the religious instruction of the community. …

The argument from the light of nature may not consistently be set aside as irrelevant by those who reject the authority of Scripture, claiming that civil government is founded in the law of nature, and that the light of nature is adequate for its administration. Mistaken as such are on this latter point, their own avowed principles demand of them an admission of the obligation of the civil magistrate to provide for the instruction of the people, as indicated by the light of nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Public Support of Religion in Reformed Presbyterian and Covenanter</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</a></div>
</figure><figure class="quote" id="q-8afa0a0b0e" data-kw="">
<blockquote><p>In this detestation of Christ towards Satan, for uttering blasphemy against his father, in his challenge to have power to dispose of all the kingdoms of the world as being his own; we are taught, not only to grieve at such blasphemies as we shall hear uttered against God, but to testified our detestation and indignation towards them. The world is full of black mouthed Rabshekas, who will not spare to blaspheme the glorious name of our God, &amp; to scoff &amp; deride his sacred word: now when we meet with such, we must not be like Stoics without affection, but in Christian wisdom from bleeding hearts for the reproach of God, shew forth godly zeal and indignation for the rescue of his glory.

The Hypocritical practise of wicked Jezabel in proclaiming a fast upon the false accusation of Naboth’s blasphemy against God and the king, may teach God’s Church to be zealous indeed against all blasphemers. When Rabsheka railed on the God of Israel, good king Hezekiah rent his clothes, and humbled himself in great measure for that reproach against his God. Tears were David’s meat day and night, while the heathen among whom he was constrained to live, said unto him where is thy God? And just Lot vexed his righteous soul from day to day with the unlawful deeds of the filthy Sodomites, living among them.

The practise of these godly men must be a president [precedent] for us to follow, that we hear no blasphemy against God without detestation. And as all God’s children must practise this duty, so especially Masters of families: David would not suffer a liar or a slanderer to come in his sight, or to abide in his house; much less would he have endured a blasphemer of God, or a slanderer of his word. The law commanded that the blasphemer should be stoned to death, who wittingly and willingly spake a word against God; and no doubt this law is perpetual.

Let a man but speak a word of disgrace against an earthly prince, and it costs him his life, and that justly: how much more then should he die the death though he had a thousand lives, that shall blaspheme the king of kings? Shall one that hath been baptized into the name of Christ, say there is no God, and that the Scriptures are but a device of man, and yet live? God forbid, for this hellish sin defiles a kingdom. And therefore the Magistrate with the sword of justice must cry out against such wretches, Away from us blasphemers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The combat between Christ and the Devil displayed: or A commentary upon the temptations of Christ</cite>, (London: Melchizedek Bradwood, 1606), pp 42-43.</span></figcaption>

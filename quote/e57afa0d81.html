<main class="wrap"><figure class="quote" id="q-e57afa0d81" data-kw="">
<blockquote><p>But, to insist still more stoutly upon this point, they add that baptism is a sacrament of repentance and of faith. Accordingly, since neither of these can come about in tender infancy, we must guard against admitting infants into the fellowship of baptism, lest its meaning be made empty and fleeting. But these darts are aimed more at God than at us. For it is very clear from many testimonies of Scripture that circumcision was also a sign of repentance [Jer. 4:4; 9:25; cf. Deut. 10:16; 30:6]. Then Paul calls it the seal of the righteousness of faith [Rom. 4:11]. Therefore, let a reason be required of God himself why he commanded it to be impressed on the bodies of infants. For since baptism and circumcision are in the same case, our opponents cannot give anything to one without conceding it to the other. If they have recourse to their usual way out, that the age of infancy then symbolized spiritual infants, their path is already blocked. We therefore say that, since God communicated circumcision to infants as a sacrament of repentance and of faith, it does not seem absurd if they are now made participants in baptism—unless men choose to rage openly at God’s institution. But as in all God’s acts, so in this very act also there shines enough wisdom and righteousness to repel the detractions of the impious. For although infants, at the very moment they were circumcised, did not comprehend with their understanding what that sign meant, they were truly circumcised to the mortification of their corrupt and defiled nature, a mortification that they would afterward practice in mature years. To sum up, this objection can be solved without difficulty: infants are baptized into future repentance and faith, and even though these have not yet been formed in them, the seed of both lies hidden within them by the secret working of the Spirit. With this answer everything gleaned from the meaning of baptism that they twist against us is once for all overthrown. Such is the label with which Paul marks it when he calls it the washing of regeneration and of renewal [Titus 3:5]. From this they reason that it is to be conferred only on persons capable of experiencing these things. But we are free to counter this by saying: neither was circumcision, which designated regeneration, to be conferred upon any but the regenerate. And thus a thing instituted by God will be condemned by us. Accordingly (as we have already suggested at various times), all the arguments that tend to shake circumcision are without force in assailing baptism. And they do not escape by saying that what rests upon God’s sure authority is established and fixed, even though there is no reason for it, but that such reverence is not due either infant baptism or other like things that are not commended to us by God’s express word; when once they are caught and held in this dilemma, they are held forever. God’s command concerning circumcision of infants was either lawful and not to be trifled with, or it was deserving of censure. If there was in it nothing incongruous or absurd, neither can anything absurd be found in the observance of infant baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, ed. John T. McNeill, trans. Ford Lewis Battles, vol. 1, The Library of Christian Classics (Louisville: Westminster John Knox Press, 2011), 4.16.20.</span></figcaption>

</figure><figure class="quote" id="q-c04ce8d7cf" data-kw="">
<blockquote><p>The same man is not always baptized at the same moment of time with water and with the Spirit. The reason is, because God, who acts in baptism, does not act in a physical way, as when medicine, taken into the body, exerts its power, whether you are awake or asleep, and fire heats, whether you know it or not. But, as the Lord is a most free agent, sometimes baptism of water is without the baptism of the Spirit, as the example of Simon Magus teaches, Act. 8:13, and sometimes the Holy Spirit is conferred first, and water baptism afterward, as in Act. 8:12, 37, 28, and sometimes baptism of the Spirit follows after, as in infants. For, even if, in infants, to whom the kingdom of heaven belongs, if you consider the divine ordination, certainly, baptism and justification and regeneration converge, from the nature of the covenant, “I will be your God and the God of your seed,” Gen. 17:7,” yet its effect is at last manifested in its time by its true marks. For, like the seed of the word, so also the seed of the sacraments lies in the earth like a deposit for as long as it seems good to the Lord to defer his grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Common Places</cite>, (Franeker, 1650), ch. 79, ‘On Baptism’, p. 833 trans. Charles Johnson</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

ood%20to%20the%20Lord%20to%20defer%20his%20grace" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Unless” (says Dr. [Jacob] Andreas [a Lutheran]) “regeneration be always united to baptism, and remains in such as are baptized, how should the troubled consciences of those be eased and comforted, who because they feel not in themselves any good motions of God’s Holy Spirit, find none other refuge but the Word and sacraments, especially the sacrament of baptism? Now this remedy would be of small force except it be opposed against those imaginations which the Devil casts into a troubled heart; yea, except it taught such that God is greater than our heart, who in baptism has not only offered us the adoption of sons, but hath indeed bestowed the same upon us: as it is said by Christ, ‘He that believeth and is baptized, shall be saved.’ And by Paul, ‘Ye which are baptized, have put on Christ.’ David being armed with the like comfort from his circumcision, feared not to join battle with that great giant Goliath: and if this were not so, it must needs follow that baptism were nothing else but an idle ceremony, and also the persons of the Trinity would be thought liars. Wherefore those afflicted men, when Satan assaults them, must resist him with these words: ‘Depart from me Satan, thou hast neither part nor portion in the inheritance of my soul, because I am baptized in the name of the holy Trinity, and so am truly made the son of God by adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Order which Mr. Theodore Beza used in Comforting Afflicted Consciences’ appended to William Perkins, A Golden Chain</cite>, … (Cambridge, 1600)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“Unless” (says Dr. [Jacob] Andreas [a Lutheran]) “regeneration be always united to baptism, and remains in such as are baptized, how should the troubled consciences of those be eased and comforted, who because they feel not in themselves any good motions of God’s Holy Spirit, find none other refuge but the Word and sacraments, especially the sacrament of baptism? Now this remedy would be of small force except it be opposed against those imaginations which the Devil casts into a troubled heart; yea, except it taught such that God is greater than our heart, who in baptism has not only offered us the adoption of sons, but hath indeed bestowed the same upon us: as it is said by Christ, ‘He that believeth and is baptized, shall be saved.’ And by Paul, ‘Ye which are baptized, have put on Christ.’ David being armed with the like comfort from his circumcision, feared not to join battle with that great giant Goliath: and if this were not so, it must needs follow that baptism were nothing else but an idle ceremony, and also the persons of the Trinity would be thought liars. Wherefore those afflicted men, when Satan assaults them, must resist him with these words: ‘Depart from me Satan, thou hast neither part nor portion in the inheritance of my soul, because I am baptized in the name of the holy Trinity, and so am truly made the son of God by adoption.”

— Theodore Beza, ‘The Order which Mr. Theodore Beza used in Comforting Afflicted Consciences’ appended to William Perkins, A Golden Chain… (Cambridge, 1600)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CUnless%E2%80%9D+%28says+Dr.+%5BJacob%5D+Andreas+%5Ba+Lutheran%5D%29+%E2%80%9Cregeneration+be+always+united+to+baptism%2C+and+remains+in+such+as+are+baptized%2C+how+should+the+troubled+consciences+of+those+be+eased+and+comforted%2C+who+because+they+feel+not+in+themselves+any+good+motions+of+God%E2%80%99s+Holy+Spirit%2C+find+none+other+refuge+but+the+Word+and+sacraments%2C+especially+the+sacrament+of+baptism%3F+Now+this+remedy+would+be+of+small+force+except+it+be+opposed+against+those+imaginations+which+the+Devil+casts+into+a+troubled+heart%3B+yea%2C+except+it+taught+such+that+God+is+greater+than+our+heart%2C+who+in+baptism+has+not+only+offered+us+the+adoption+of+sons%2C+but+hath+indeed+bestowed+the+same+upon+us%3A+as+it+is+said+by+Christ%2C+%E2%80%98He+that+believeth+and+is+baptized%2C+shall+be+saved.%E2%80%99+And+by+Paul%2C+%E2%80%98Ye+which+are+baptized%2C+have+put+on+Christ.%E2%80%99+David+being+armed+with+the+like+comfort+from+his+circumcision%2C+feared+not+to+join+battle+with+that+great+giant+Goliath%3A+and+if+this+were+not+so%2C+it+must+needs+follow+that+baptism+were+nothing+else+but+an+idle+ceremony%2C+and+also+the+persons+of+the+Trinity+would+be+thought+liars.+Wherefore+those+afflicted+men%2C+when+Satan+assaults+them%2C+must+resist+him+with+these+words%3A+%E2%80%98Depart+from+me+Satan%2C+thou+hast+neither+part+nor+portion+in+the+inheritance+of+my+soul%2C+because+I+am+baptized+in+the+name+of+the+holy+Trinity%2C+and+so+am+truly+made+the+son+of+God+by+adoption.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+%E2%80%98The+Order+which+Mr.+Theodore+Beza+used+in+Comforting+Afflicted+Consciences%E2%80%99+appended+to+William+Perkins%2C+A+Golden+Chain%E2%80%A6+%28Cambridge%2C+1600%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F529d8f82

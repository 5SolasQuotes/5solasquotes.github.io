<blockquote><p>God repeated the same covenant (of works) with the people of Israel through Moses . . . it is called the covenant of Moses, the covenant of law, and commonly the old covenant.” [“Idem fedus [sic] repetivit Deus cum populo Israelitico per Mosen…appellatur fedus Mosis, fedus legis, et communiter fedus vetus”]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syntagma</cite>, (1609), Lib. 6, cap. 33, col. 321).]</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-07ae059f1c" data-kw="">
<blockquote><p>But when expressions that import anger, or grief, are used [Gen. 6:6; Jud. 10:16; Ps. 78:40; 95:10; etc.], even concerning God Himself, we must sever in our conception everything of imperfection and ascribe everything of real perfection. We are not to think such expressions signify nothing, that they have no meaning, or that nothing at all is to be attributed to Him under them. Nor are we, again, to think they signify the same thing with what we find in ourselves and are wont to express by those names. In the divine nature, there may be real, and yet most serene complacency and displacency, viz. that are unaccompanied with the least commotion, and import nothing of imperfection, but perfection rather, as it is a perfection to apprehend things suitably to what in themselves they are… But we must take heed, lest, under the pretense that we cannot ascribe everything to God that such expressions seem to import, we therefore ascribe nothing. We ascribe nothing, if we do not ascribe to Him a real unwillingness that men should sin on, and perish; and consequently, a real willingness that they should turn to Him, and live; which so many plain texts assert. And therefore it is unavoidably imposed upon us to believe that God is truly unwilling of some things, which He does not think fit to interpose his omnipotency to hinder; and is truly willing of some things which He does not put forth his omnipotency to effect…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Redeemer’s Tears Wept Over Lost Souls, in Works</cite>, vol. 2, pp. 358-61</span></figcaption>

</figure><figure class="quote" id="q-282c786d74" data-kw="">
<blockquote><p>Besides, the text [2 Cor. 5:13] only says, ‘God is reconciling the world to Himself;’ now there is a great difference between God reconciling and reconciled: The former supposes in God a propensity to bring about the way of reconciliation; not that He is already reconciled, but this flows from a general love and pity He bears to mankind, whereby He procures a way that actual reconciliation may be obtained between man and God; yea Eph. 2:16 compared with Col. 1:20…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, … (London: Underhill, 1654) | sect. 2, sermon 6, That all men through Adam’s transgression are plunged into sin…, p. 56</span></figcaption>

</figure><figure class="quote" id="q-c387c9c582" data-kw="">
<blockquote><p>Jonah would not have shrunk from God’s command, had he been sent to the Ninevites to teach what he had been ordered to do among the chosen people. Had then a message been committed to Jonah, to set forth a gracious and merciful God to the Ninevites, he would not have hesitated a moment to offer his service. But as this express threatening, Nineveh shall be destroyed, was given him in charge, he became confounded, and sought at length to flee away rather than to execute such a command. Why so? Because he thus reasoned with himself, “I am to denounce a near ruin on the Ninevites; why does God command me to do this, except to invite these wretched men to repentance? Now if they repent, will not God be instantly ready to forgive them? He would otherwise deny his own nature: God cannot be unlike Himself, He cannot put off that disposition of which He has once testified to Moses [Ex. 34]. Since God, then, is reconcilable, if the Ninevites will return to the right way and flee to him, He will instantly embrace them: thus I shall be found to be false in my preaching.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jonah</cite>, ch. 4, verse 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-ed3d48e38e" data-kw="">
<blockquote><p>3rdly, Some natural good wishes for his welfare are implied in this love [to the rich young ruler]. There is in every wise and good man a hearty desire of the happiness of his fellow-creatures; he loves them all in this sense, even the foolish and the wicked. Human nature that has any goodness in it, is ready to wish well to any person, though he be an utter stranger and unknown, especially if he has some agreeable qualities. There may be an innocent inclination to see all men happy, though we know this shall not be brought to pass; for the Word of God declares that the most part of men walk in the broad way, and shall go down to hell. You know how passionately St. Paul longed for the salvation of all his countrymen the Jews [Rom. 9]. This is called a love of benevolence; and it is evident, by the following particulars, that the Lord expressed this good-will toward the young man in my text.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-watts.html">Isaac Watts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Sermon VII: A hopeful Youth falling short of Heaven” in Sermons on Various Subjects</cite>, (London: A. Macpherson, 1811), vol. 1, p. 160</span></figcaption>

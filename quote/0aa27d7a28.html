<main class="wrap"><figure class="quote" id="q-0aa27d7a28" data-kw="">
<blockquote><p>3… these forms of sound words are useful, and in some cases are necessary, and so have been used as declarations, not only of what we ourselves believe, but also, of what we judge that all should believe (unless we could think that others might rightly believe that as true, which we in our conscience judge to be false, a goodly piece of our ingenuous, loving-hearted Arminians’ charity) and also desire and require, that all should profess, or at least not openly contradict, with whom we join in nearest Church communion: So it was with the apostles in their canons, Acts 15. And so it is with particular Churches in their articles and confessions to this day; and so may it be always; Ringantur licet et rumpantur Socino-Remonstrantes [Let the Socinians and Remonstrants rage and burst, if they please]. Notwithstanding all the rage and invectives of Socinians, Arminians, Libertines and other sectaries, who will rather disturb, yea and ruin both Churches and States, and snap asunder the sacred bond of peace, than be thus hampered. 4. They [creeds and synopses of theology] are therefore in the 4th place Communionis Tessarae et Judices, not only badges of our Christian Church communion, but also great helps and furtherers of it, whereby uncomfortable divisions may be prevented, and the peace of the Church the better preserved, whilst we all profess the same truth and speak the same thing, being perfectly joined together in the same mind, and the same judgment, 1 Cor. 1:10. The Remonstrants indeed tell us that there are Non pauci pii, et probi, many honest godly men (they mean their own sweet selves and their dear party, for who [are] so honest and godly as they?) who dislike such forms and confessions…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-tuckney.html">Anthony Tuckney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Form of Sound Words’ a sermon on 2 Tim. 1:13 in A Good Day well improved, or Five Sermons upon Acts 9:31</cite>, … to which is annexed a sermon on 2 Tim. 1:13… (London: 1656), pp. 252-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-068e7925f0" data-kw="">
<blockquote><p>The language here employed [in the Scottish subscription formula in 1694 &amp; 1711] is cautious and temperate, and is thus well suited to the circumstances of a solemn profession to be made by a numerous body of men, who might not all see their way to concur in stronger and more specific phraseology. Besides, it is to be observed that the profession respects not merely the fundamentals or essentials of Presbyterianism in the abstract, which alone can be reasonably maintained to have the clear and positive sanction of apostolic practice; but ‘the Presbyterian government and discipline of this church,’ including the detailed development of the essential principles of Presbyterianism as exhibited in the actual constitution and arrangements of our church, and of all this in the concrete, or taken complexly, nothing higher or stronger could with propriety be affirmed, than that it is founded upon the word of God, and agreeable thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, vol. 1, p. 76</span></figcaption>

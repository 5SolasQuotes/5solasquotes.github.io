<main class="wrap"><figure class="quote" id="q-6ec4f2af8a" data-kw="">
<blockquote><p>True believers may have the assurance of their salvation divers ways shaken, diminished, and intermitted; as, by negligence in preserving of it, by falling into some special sin which woundeth the conscience and grieveth the Spirit; by some sudden or vehement temptation, by God’s withdrawing the light of his countenance, and suffering even such as fear him to walk in darkness and to have no light: yet are they never utterly destitute of that seed of God, and life of faith, that love of Christ and the brethren, that sincerity of heart, and conscience of duty, out of which, by the operation of the Spirit, this assurance may, in due time, be revived; and by the which, in the meantime, they are supported from utter despair.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 18.4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-209fbb2df4" data-kw="">
<blockquote><p>To doubt the love, the wisdom, and the faithfulness of God; to doubt the perfection of the work of Christ; to doubt the operation of the Spirit on the heart, what can tend more to the weakening and decay of this precious and costly grace? Every time the soul sinks under the pressure of a doubt of its interest in Christ, the effect must be a weakening of the soul&#x27;s view of the glory, perfection, and all-sufficiency of Christ&#x27;s work. But imperfectly may the doubting Christian be aware what dishonor is done to Jesus, what reflection is cast upon his great work, by every unbelieving fear he cherishes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Personal Declension and Revival of Religion in the Soul</cite>, p. 74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/doubts-and-fears.html">Doubts and Fears</a></span><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a></span></div>

<blockquote><p>Himself he may doubt, — he may doubt his ability to save himself, — he may doubt his power to better his condition, to make himself more worthy and acceptable, but never let him doubt that Christ is all that a poor, lost, convinced sinner wants. Let him not doubt that Jesus is the Friend of sinners, the Savior of sinners, and that he was never known to cast out one who in lowliness and brokenness of heart, sought his compassionate grace.</p></blockquote>

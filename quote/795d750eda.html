<main class="wrap"><figure class="quote" id="q-795d750eda" data-kw="">
<blockquote><p>CANON 4. If anyone maintains that God awaits our will to be cleansed from sin, but does not confess that even our will to be cleansed comes to us through the infusion and working of the Holy Spirit, he resists the Holy Spirit himself who says through Solomon, “The will is prepared by the Lord” (Prov. 8:35, LXX), and the salutary word of the Apostle, “For God is at work in you, both to will and to work for his good pleasure” (Phil. 2:13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/second-council-of-orange.html">Second Council of Orange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons And Decrees Of The Second Council Of Orange, (AD 529)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-82dcf6a70a" data-kw="Spirit personality agent">
<blockquote><p>He is an intelligent, voluntary, divine agent; he knoweth, he worketh as he will: which things, if, in their frequent repetition, they are not sufficient to evince an intelligent agent, a personal subsistence, that hath being, life, and will, we must confess that the Scripture was written on purpose to lead us into mistakes and misapprehensions of what we are, under penalty of eternal ruin, rightly to apprehend and believe.</p></blockquote>

</figure><figure class="quote" id="q-8658d5a952" data-kw="">
<blockquote><p>The Holy Spirit is not an atmosphere. He&#x27;s not a force. He is a person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/d-martyn-lloyd-jones.html">D. Martyn Lloyd-Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post on X (@TheMLJTrust)</cite>, Oct 25, 2025</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a> › <a href="../topics/the-trinity/the-holy-spirit/personality.html">Personality</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Holy Spirit is not an atmosphere. He&#x27;s not a force. He is a person.”

— D. Martyn Lloyd-Jones, Post on X (@TheMLJTrust), Oct 25, 2025">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Holy+Spirit+is+not+an+atmosphere.+He%27s+not+a+force.+He+is+a+person.%E2%80%9D%0A%0A%E2%80%94+D.+Martyn+Lloyd-Jones%2C+Post+on+X+%28%40TheMLJTrust%29%2C+Oct+25%2C+2025&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8658d5a952.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8658d5a952.html">Permalink</a><a class="src" href="https://x.com/TheMLJTrust/status/1982190430226887114" rel="noopener" target="_blank">Read it online · X</a></div>
</figure><figure class="quote" id="q-fde3152e82" data-kw="">
<blockquote><p>We shouldn’t doubt that the Holy Spirit lives in us, but we should certainly recognize that we are temples of the Holy Spirit, as Paul says in 1 Corinthians 6:19. If someone feels a love for God’s Word and gladly hears, speaks, thinks, teaches, and writes about Christ, you should know that this comes, not from a person’s will or reason, but from the Holy Spirit. It’s impossible for this to happen without the Holy Spirit. On the other hand, where there is hatred and contempt for the Word, we should know that the devil, the ruler of this world, blinds the hearts of the people and holds them captive so that the light of the gospel, the glory of Christ, can’t shine on them. We see this today in the masses who are not moved by the Word but despise it as if it has nothing to do with them. But those who have any kind of love and desire for the Word should gratefully acknowledge that these attitudes are poured into them by the Holy Spirit. For we are not born with these attitudes and cannot acquire them through the law. This transformation rests completely and absolutely in the hand of the Almighty. So when we eagerly listen to preaching about Jesus Christ, the Son of God—who for our sakes became a human being and subjected himself to the law to save us—then God sends the Holy Spirit into our hearts through this preaching. Therefore, it’s very useful for us to remember that we have the Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith Alone (p. 292). Zondervan. Kindle Edition.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

her-on-what-it-means-to-be-indwelled-by-the-spirit/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-ab7a2fd88e" data-kw="">
<blockquote><p>In the unity of the Godhead there be three persons, of one substance, power, and eternity: God the Father, God the Son, and God the Holy Ghost: the Father is of none, neither begotten, nor proceeding; the Son is eternally begotten of the Father; the Holy Ghost eternally proceeding from the Father and the Son.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ac655f2f74" data-kw="">
<blockquote><p>It is the height and riches of God’s mercy which from everlasting has prepared for the elect only, and in time bestows upon them only that special and effectual grace which infallibly brings them unto glory. It is a lower degree of mercy (and yet true mercy too) which is showed to the non-elect or reprobate, in preparing for them and bestowing upon them such means of grace as by their own default are made ineffectual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind… (Cambridge, 1641), ‘Answer: Whether absolute reprobation oppugne the truth and sincerity of God’</cite>, pp. 357-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-67c096ad66" data-kw="">
<blockquote><p>In point of fact, the Old Testament has a great deal to teach on the benevolent side of God’s self-revelation to the world at large. The strongest of terms are used on occasion to emphasize this truth. Even the covenant conception is not deemed too sacred to be employed for the purpose of describing the solemn manner in which God pledged to the whole of creation, in the day of Noah, His abundant, ever-flowing kindness in the sphere of natural life, His longsuffering in the view of universal sin, His common grace working for the restraint of sin. It is attributed to His righteousness, universally revealed, that He keeps this covenant and preserves man and beast. As Jonah took pity on his gourd, so He pities and spares the Ninevites and their cattle. His mercy is wider and deeper than the ocean of human misery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Doctrine of the Love of God in The Presbyterian &amp; Reformed Review 13:1-37 (1902)</cite>, p. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-7596899751" data-kw="">
<blockquote><p>[7.] Seventhly, Get this principle rooted in you, That it is the delight of Christ to give poor sinners an interest [legal right] in Himself. He is not only able to do it, but it is his delight to do it. Christ’s soul is in nothing more. Witness his leaving his Father’s bosom; witness his laying down his crown; witness those many sufferings and deaths that He went through in this world; witness those gospel acclamations, Mark 16:16, Rev. 22:17; witness those persuasive exhortations and gracious impetrations [obtaining by asking or petition] and entreaties, Isa. 53:11, Matt 11:28, 2 Cor. 5:20; witness divine injunctions and comminations [threatening of divine vengeance], 1 John 5:23, Matt 11:21; witness those pathetical lamentations, Matt 23:37, Luke 19:42, Ps. 81:13; and witness the inward motions and secret excitations of his blessed Spirit, Gen. 6:3, all which speak out his great willingness and delight to save poor sinners; so in Ps. 40:7,8, ‘I delight to do thy will, O my God; thy law is in my heart;’ or, as the Hebrew has it b’tok m’ee, ‘It is in the midst of my bowels.’ Now mark, the will of the Father was the salvation of sinners. This was the will of the Father, ‘That Jesus Christ should seek and save them that are lost,’ Matt 18:11. Now says Christ, ‘I delight to do thy will, O my God;’ it is the joy and rejoicing of my heart to be a-seeking and a-saving lost sinners. When Christ was an hungry, He went not into a victualling house [a house of eating], but into the temple, and taught the people most part of the day, to show how much He delighted in the salvation of sinners, etc. [Footnote: Christ did so much delight, and his heart was so much set upon the conversion and salvation of the Samaritans, that He neglected his own body to save their souls, as you may clearly see in John 4.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unsearchable Riches of Christ in Works, vol. 3</cite>, p. 206</span></figcaption>

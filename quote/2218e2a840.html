<main class="wrap"><figure class="quote" id="q-2218e2a840" data-kw="">
<blockquote><p>The basis for the imputation of Adam’s disobedience is to be found in the fact that God established the covenant of works with Adam—a covenant that Adam transgressed. The Lord entered into this covenant with Adam as the patriarch of the entire human race. This human race, so to speak, was in his loins, so that when Adam sinned, the entire world also sinned in him and fell away from God. We would be able to demonstrate and expound this at great length, doing so from the Holy Scriptures.

The other channel through which our innate corruption and unholiness, proceeding from the fall and disobedience of our first parents, is transmitted to us is by our inheriting of the pollution of their corruption—a corruption that cleaves to us.

We have heard how ungodly and unholy our first parents became by their disobedience toward God and by their fall from God, and how they thereby lost His image in their souls. Since all men have proceeded from them and have their origin in them as a stem and branch has in a tree, they must necessarily also be as corrupt, unholy, and ungodly as they were, for as the roots are, so must be the branches.

The Holy Scriptures therefore teach clearly, “And Adam…begat a son in his own likeness, after his image” (Gen. 5:3). The apostle teaches in 1 Corinthians 15:49, “And as we have borne the image of the earthy, we shall also bear the image of the heavenly.” The Savior plainly teaches in John 3:6, “That which is born of the flesh is flesh.” And Job testifies in Job 14:4, “Who can bring a clean thing out of an unclean? not one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 39.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-45d25bffc7" data-kw="">
<blockquote><p>What is the work of the Holy Ghost with respect unto the objective evidence which we have concerning the Scripture, that it is the word of God, which is the formal reason of our faith, and whereinto it is resolved?… … These things being supposed , we do affirm, That it is the authority and truth of God, as manifesting themselves in the supernatural revelation made in the Scripture [emphasis added], that our faith arises from and is resolved into. … As the issue of this whole discourse, it is affirmed that our faith is built on and resolved into the Scripture itself, which carries with it its own evidence of being a divine revelation; and therefore doth that faith ultimately rest on the truth and authority of God alone, and not on any human testimony, such as is that of the church, nor on any rational arguments or motive that are absolutely fallible.</p></blockquote>

<blockquote><p>Therefore we are pronounced righteous, not on the basis of the Law or of works or of our own righteousness but on the basis of pure grace. Paul insisted on the promise so vigorously and stressed it so often because he saw how necessary it is.</p></blockquote>

</figure><figure class="quote" id="q-a483e5ffc8" data-kw="">
<blockquote><p>We think, therefore, that congruous merit is founded rather in some dignity of the work than in a promise. For the promises by which God promises pardon to penitents are not such as those by which he promises a crown of glory to those who work well. For the latter contain a true pact, which God makes with man as with a laborer about wages to be paid; but the former do not properly contain a pact about wages to be paid, but an assertion of a thing certainly to come, so that a man may be made secure of obtaining pardon if he repents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, bk. 1, ch. 21 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-eaf605d126" data-kw="">
<blockquote><p>In Galatians 3:10 the apostle supplies the eighth argument: “As many as are of the works of the law and under the curse. For it is written: ‘Cursed is everyone who does not remain in all things, which are written in the book of the Law, to do them.’” And verse 13: “Christ redeemed us from the curse of the law, when He became a curse for us. For it is written: ‘Cursed is everyone who hangs on a tree.’” From these words it is manifest that the twofold curse hung over us: one of disobedience, and another of the penalty. Thomas Aquinas, in his explanation of the third chapter of Galatians, in the fifth reading, writes: “According to the twofold evil it can be called the twofold curse, namely, the curse of guilt and the curse of the penalty, etc.” The curse of disobedience is what falls on him who has transgressed the Law and who does not remain in all things that are written in the book of the Law, to do them. The curse of the penalty is what falls on him who takes upon himself the penalty of disobedience, about which it is said, “Cursed is everyone who hangs on a tree.” Christ has redeemed us from both curses, having been made the curse for us. But He could not have redeemed us from it, unless remaining in all things which are written in the Law and doing them, without doubt in our passage, for whom He became a curse on the cross. Indeed, He was serving us, not Himself. But both curses remain on those whom Christ has not redeemed. As the Judge of the living and the dead, “He will say to those who are at His left hand, ‘Cursed, depart from me into the eternal fire, which is prepared for the devil and his angels’” (Matt. 25:41). But from this such a demonstration exists: those whom Christ has redeemed from both curses denounced in the law, to them not only the death of the cross, but also remaining in all the things which are written in the law, is imputed for righteousness. And Christ has redeemed us from both curses denounced in the law. Therefore, not only the death of the cross, but also the remaining in all things which are written in the law, is imputed to us for righteousness.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“In Galatians 3:10 the apostle supplies the eighth argument: “As many as are of the works of the law and under the curse. For it is written: ‘Cursed is everyone who does not remain in all things, which are written in the book of the Law, to do them.’” And verse 13: “Christ redeemed us from the curse of the law, when He became a curse for us. For it is written: ‘Cursed is everyone who hangs on a tree.’” From these words it is manifest that the twofold curse hung over us: one of disobedience, and another of the penalty. Thomas Aquinas, in his explanation of the third chapter of Galatians, in the fifth reading, writes: “According to the twofold evil it can be called the twofold curse, namely, the curse of guilt and the curse of the penalty, etc.” The curse of disobedience is what falls on him who has transgressed the Law and who does not remain in all things that are written in the book of the Law, to do them. The curse of the penalty is what falls on him who takes upon himself the penalty of disobedience, about which it is said, “Cursed is everyone who hangs on a tree.” Christ has redeemed us from both curses, having been made the curse for us. But He could not have redeemed us from it, unless remaining in all things which are written in the Law and doing them, without doubt in our passage, for whom He became a curse on the cross. Indeed, He was serving us, not Himself. But both curses remain on those whom Christ has not redeemed. As the Judge of the living and the dead, “He will say to those who are at His left hand, ‘Cursed, depart from me into the eternal fire, which is prepared for the devil and his angels’” (Matt. 25:41). But from this such a demonstration exists: those whom Christ has redeemed from both curses denounced in the law, to them not only the death of the cross, but also remaining in all the things which are written in the law, is imputed for righteousness. And Christ has redeemed us from both curses denounced in the law. Therefore, not only the death of the cross, but also the remaining in all things which are written in the law, is imputed to us for righteousness.”

— Amandus Polanus, The Free Justification of Man the Sinner Before God, (1615) in Justification By Faith Alone: Selected Writings From Theodore Beza (1519–1605), Amandus Polanus (1561–1610), Francis Turretin (1623–1687), trans. Casey Carmichael, Volume 6: Classic Reformed Theology Theology (Reformation Heritage Books">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+Galatians+3%3A10+the+apostle+supplies+the+eighth+argument%3A+%E2%80%9CAs+many+as+are+of+the+works+of+the+law+and+under+the+curse.+For+it+is+written%3A+%E2%80%98Cursed+is+everyone+who+does+not+remain+in+all+things%2C+which+are+written+in+the+book+of+the+Law%2C+to+do+them.%E2%80%99%E2%80%9D+And+verse+13%3A+%E2%80%9CChrist+redeemed+us+from+the+curse+of+the+law%2C+when+He+became+a+curse+for+us.+For+it+is+written%3A+%E2%80%98Cursed+is+everyone+who+hangs+on+a+tree.%E2%80%99%E2%80%9D+From+these+words+it+is+manifest+that+the+twofold+curse+hung+over+us%3A+one+of+disobedience%2C+and+another+of+the+penalty.+Thomas+Aquinas%2C+in+his+explanation+of+the+third+chapter+of+Galatians%2C+in+the+fifth+reading%2C+writes%3A+%E2%80%9CAccording+to+the+twofold+evil+it+can+be+called+the+twofold+curse%2C+namely%2C+the+curse+of+guilt+and+the+curse+of+the+penalty%2C+etc.%E2%80%9D+The+curse+of+disobedience+is+what+falls+on+him+who+has+transgressed+the+Law+and+who+does+not+remain+in+all+things+that+are+written+in+the+book+of+the+Law%2C+to+do+them.+The+curse+of+the+penalty+is+what+falls+on+him+who+takes+upon+himself+the+penalty+of+disobedience%2C+about+which+it+is+said%2C+%E2%80%9CCursed+is+everyone+who+hangs+on+a+tree.%E2%80%9D+Christ+has+redeemed+us+from+both+curses%2C+having+been+made+the+curse+for+us.+But+He+could+not+have+redeemed+us+from+it%2C+unless+remaining+in+all+things+which+are+written+in+the+Law+and+doing+them%2C+without+doubt+in+our+passage%2C+for+whom+He+became+a+curse+on+the+cross.+Indeed%2C+He+was+serving+us%2C+not+Himself.+But+both+curses+remain+on+those+whom+Christ+has+not+redeemed.+As+the+Judge+of+the+living+and+the+dead%2C+%E2%80%9CHe+will+say+to+those+who+are+at+His+left+hand%2C+%E2%80%98Cursed%2C+depart+from+me+into+the+eternal+fire%2C+which+is+prepared+for+the+devil+and+his+angels%E2%80%99%E2%80%9D+%28Matt.+25%3A41%29.+But+from+this+such+a+demonstration+exists%3A+those+whom+Christ+has+redeemed+from+both+curses+denounced+in+the+law%2C+to+them+not+only+the+death+of+the+cross%2C+but+also+remaining+in+all+the+things+which+are+written+in+the+law%2C+is+imputed+for+righteousness.+And+Christ+has+redeemed+us+from+both+curses+denounced+in+the+law.+Therefore%2C+not+only+the+death+of+the+cross%2C+but+also+the+remaining+in+all+things+which+are+written+in+the+law%2C+is+imputed+to+us+for+righteousness.%E2%80%9D%0A%0A%E2%80%94+Amandus+Polanus%2C+The+Free+Justification+of+Man+the+Sinner+Before+God%2C+%281615%29+in+Justification+By+Faith+Alone%3A+Selected+Writings+From+Theodore+Beza+%281519%E2%80%931605%29%2C+Amandus+Polanus+%281561%E2%80%931610%29%2C+Francis+Turretin+%281623%E2%80%931687%29%2C+trans.+Casey+Carmichael%2C+Volume+6%3A+Classic+Reformed+Theology+Theology+%28Reformation+Heritage+Books&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feaf605d126.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eaf605d126.html">Permalink</a><a class="src" href="https://heidelblog.net/2026/03/polanus-galatians-310-teaches-the-imputation-of-christs-active-obedience/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<main class="wrap"><figure class="quote" id="q-a4ac7c0926" data-kw="">
<blockquote><p>Faith, abiding in Christ causes the conscience to be examined very carefully to see whether there still remain any sins, over which a man has not yet humbled himself before the great God, laying claim to the blood of His Son Jesus Christ which taketh away all sins, and for this sin in particular.

For, though the sins of believers bring them not, strictly speaking, under guilt or condemnation, they being once and for all freed from this in their initial justification: yet daily sins make them subject to paternal chastisement; yes, they bring about darkness and estrangement from God, and lack of liberty and a sense of sin, and a halting; so that such must be set free by a positive embracing of Jesus, before the soul can have any advancement in sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-comrie.html">Alexander Comrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ABC of Faith</cite>, trans. J. Marcus Banfield (1746; Ossett: Zoar Publications, 1978), p. 79.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5911d442cf" data-kw="">
<blockquote><p>Controversy II: What is justifying faith? … Antithesis [of Romanists]: Justifying faith is one of the dispositions for justification; it is not a certain knowledge of the divine will nor a trust in divine mercy in Christ, but a simple mental assent, by which we accept the whole word of God, even without understanding it, as well as the traditions of the Roman Church. [The Reformed] Censure:

1. The definition of faith and many examples in Hebrews 11 prove that faith is a confident assent, that is, a trust in God that generates obedience. See Romans 4, where Abraham’s faith is discussed.

2. The phrases “believe in God” (Job 12 and 14; 1 Peter 1) and “hope and trust in God,” and similar ones in the Psalms, prove that faith is not a simple assent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-a8c9ebcdf4" data-kw="">
<blockquote><p>Now we are to speak of the concurrence of these two graces. For when the Lord sweareth, that to those whom he redeemeth and justifieth, he will give grace to worship him in holiness and righteousness; from hence we doe necessarily collect, that sanctification is an unseparable companion of justification; and that no man can have assurance, that he is justified, unless he be in some measure sanctified.

Let no man therefore deceive himself with a vain profession of an idle and dead faith, for unless thou doest, at the least, desire and endeavour to worship God in holiness and righteousness; it is as certain. as the oath of the Lord is true, that as yet thou art not justified, nor actually made partaker of the redemption wrought by Christ. It is true, that our Saviour Christ in the days of his flesh, did redeem us meritoriously, paying a ransom sufficient for all that should believe in him: but none are actually made partakers of this Redemption, but they to whom it is applied; and it is applied only to those that truly believe; and true faith purifieth the heart, and worketh by love, and is to be demonstrated by good works. …

The reason hereof is evident. For 1. they who are engraffed into CHRIST by faith, as all those are which truly believe in him, in them CHRIST dwelleth by his spirit (for they are not his, who have not his spirit) applying unto them not only the merit of his death, to their redemption, &amp; the benefit of his resurrection to their justification, but also the virtue &amp; efficacy of his death to mortify their sins, &amp; of his resurrection to raise them to newness of life; so that for whose sins CHRIST died, they die to their sin; and for whose justification he arose, they also rise to newness of life The Apostle Rom. 6.3.4. affirmeth, that those who have been baptized into CHRIST, were baptized into his death, and resurrection; that as CHRIST did die and rise again; so they also die to sin, &amp; rise to newness of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace or An Exposition upon Luke 1. 73.74.75</cite>, (Dublin, 1631), pp 35-36.</span></figcaption>

<blockquote><p>(2) “He that is just, let him be justified still” (Rev. 22:11). I respond, That is to say, He that is justified, let him continue to declare himself justified, or, He who has been justified with respect to the first constitution of justification, let him, by renewing faith, act such that his justification may be continued.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-bd3490fb52" data-kw="">
<blockquote><p>The first sort [of objectors] say, ‘It is to no purpose to dispute against such as deny grounded principles.’ And by this means, because one grounded principle is denied them, they break off quite and clean, as though all mean of conference were taken away. Surely this principle of theirs is very true, but yet (in my judgment) it is very ill understood. I grant it is to no purpose to dispute against such as deny grounded principles, by the same principles which they deny: That is very true. But there may be some other principles common to both sides, by the which a man may profitably dispute with them, and by those common principles oftentimes prove and verify his own principles. And that is the thing which I intend to do in this work. As for example: The Christian grounds himself upon the Gospel; the Jew denies it: and therefore it were to no purpose to allege it unto him. But both the Jew and the Christian have one common principle and ground, which is the Old Testament: By this may the Christian profitably dispute against the Jew, yea even to the verifying of the Gospel. … Likewise the Jew is grounded upon the Old Testament, which the Gentile would mock at if he should allege it unto him. But both the Gentile and the Jew have one common nature, which furnishes them both with one common philosophy, and with one common sort of principles; as that there is one God which governs all things; that He is good, and no author of evil; that He is wise, and does not anything in vain. Also that man is born to be immortal; that to be happy he ought to serve God and continue in his favor. And therewithal, that he is subject to passions, inclined to evil, weak unto good and so forth. Of these common principles, the Jew may draw necessary conclusions, which the Gentile shall not perceive at the first, like as when a man understands a proposition, but conceives not yet the drift and consequence thereof… Thus shall the Jew by common principles and conclusions, verify his own ground which is the Old Testament… And what else is all this than that which is commonly done in geometry and logic, which by two lines or by two propositions that are commonly known and certain, do gather… a third proposition (that is to say, a conclusion) that was… either doubted of or hidden, and by means of the other two is evidently found out, and necessarily proved. … To be short, the mark that our faith looks at, is the Author of Nature and principle of all principles. The rules therefore and the principles of nature which He has made cannot be contrary unto Himself. And He is also the very reason and truth itself. All other reason then, and all other truth depends upon Him, and relies upon Him, neither is there, or can there be any reason or truth but in Him: So far off is it, that the thing which is true and reasonable in nature, is or can be false in divinity, which (to speak properly) is not against nature, but against the corruption of nature, and in very deed about nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-du-mornay.html">Philip Du Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Work concerning the Trueness of the Christian Religion… against Atheists, Epicures, Paynims, Jews, Mahumetists and other Infidels (London: Cadman, 1587), Preface, n.p.</cite></span></figcaption>

<blockquote><p>To summarize the five main approaches to teleology: Teleological eliminativism denies that there is any teleology at all in the natural world. Teleological reductionism allows that there is, but holds that it can be reduced to non-teleological phenomena. Platonic teleological realism holds that there is irreducible teleology in the natural world but only in the sense that an external ordering intellect orders things to certain ends. Aristotelian teleological realism holds that there is irreducible teleology in the natural world and that it is immanent, existing in things simply by virtue of their natures and in no way dependent on an ordering intelligence. Scholastic teleological realism holds that there is irreducible teleology in the natural world and that it is immanent to things given their natures, but also that the fact that they exist with natures directing them to those ends cannot itself ultimately be made sense of apart from a divine ordering intelligence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 2, ‘Teleology: a Shopper’s Guide’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 28-49</cite>, p. 36</span></figcaption>

<blockquote><p>…focuses on the relationship of theology and philosophy as formulated in the thought of three key Dutch Reformed theologians… All three were at the forefront of the philosophical debates that swirled in the Dutch Republic in the seventeenth and eighteenth centuries, especially instigated by the arrival of Renee Descartes (1596–1650) in the Netherlands in 1628… By studying these three theologians, Goudriaan “seeks to understand better how Dutch Reformed theology integrated and responded to philosophical views in the period from 1625 through 1750. Voetius, professor of theology at the University of Utrecht, was initially the premier defender against the Cartesian encroachment upon the Dutch Reformed Church that sought to undermine both her theology and piety. This mantle would be taken up by his successor at the university, Petrus van Mastricht. As might be expected, Goudriaan demonstrates that Voetius and Mastricht were in essential agreement with one another in their theology and polemic against Cartesianism as they engaged it from distinctly Reformed premises and commitments. Goudriaan deals successively with specific loci where the relationship between theology and philosophy was acutely tried and tested, including: reason and revelation; creation and the physical world; the providential rule of God over the world; anthropological issues of the relationship between the soul and the body; and divine and natural law. He notes that both Voetius and Mastricht had aligned themselves with the older Aristotelian philosophy against the newer Enlightenment philosophy, yet the debate was not waged over whose philosophical system was correct. This in itself would have been a losing concession, for it was precisely their aim that Reformed theology not be corrupted by alien philosophical concepts or categories that ultimately undermined Scriptural authority and teaching. Philosophy was instead viewed by them as an instrument or servant of the most basic Reformed principle, namely, the authority of Scripture as their principium cognoscendi. For them Scripture was not subordinated to philosophy, but philosophy to Scripture. This starting point alone accounted for the full-orbed nature of creation with its rich diversity, including spirits and bodies, heaven and earth, which Cartesian dualism could not account for or bring into any real, dynamic relation. Because of this common commitment to the Reformed principle of Scripture’s authority, Goudriaan observes, “the theological development from Voetius to Driessen supports the broader claim that biblical Christianity outlives the philosophical and conceptual apparatus with whose help it is explained.” To put it another way, philosophy was not the indispensable lord of theology, but its disposable handmaiden—it would, therefore, continue even when philosophies changed or failed.” – Daniel Ragusa Ariew, Roger – Descartes Among the Scholastics in History of Science &amp; Medicine Library, vol. 20 Pre (Brill, 2011) Schlebusch, J.A. – Cartesianism &amp; Reformed Scholastic Theology: A Comparative Study of the Controversy a Master’s thesis (Univ. of the Free State, South Africa, 2013) 160 pp. Includes a translation of two chapters of Christopher Wittich’s Two Dissertations in ch. 3, and of two chapters of Peter van Mastricht’s Vindication of the Truth, which reply to Wittich, in ch. 4. . . Cartesianism in Scotland in the Post-Reformation Articles Raffe, Alasdair – ‘Intellectual Change Before the Enlightenment: Scotland, the Netherlands &amp; the Reception of Cartesian Thought, 1650-1700’ The Scottish Historical Review, vol. 94; no. 238, pt. 1 (April 2015), pp. 24-47 Gellera, Giovanni ‘Descartes in Scotland &amp; Pre-Enlightenment Scottish Philosophy’ ‘The Scottish Faculties of Arts &amp; Cartesianism (1650-1700)’ History of Universities XXIX (2), pp. 166-187 ‘English Philosophers &amp; Scottish Academic Philosophy (1660–1700)’ (2017) ‘Robertson’s Philosophical Theses (1596): between Late Renaissance &amp; Early Modern Scholasticism’ eds. Alexander Broadie &amp; J.S. Reid, Philosophical Discourse in Seventeenth-Century Scotland: Key Texts (Scottish History Society) ‘The Philosophy of Robert Forbes: A Scottish Scholastic Response to Cartesianism’ Journal of Scottish Philosophy 11(2) (Sept., 2013), pp. 191-211 Abstract: “In the second half of the seventeenth century, philosophy teaching in the Scottish universities gradually moved from scholasticism to Cartesianism. Robert Forbes, regent at Marischal College and King’s College, Aberdeen, was a strenuous opponent of Descartes. The analysis of the philosophy of Forbes and of his teacher Patrick Gordon sheds light on the relationship between Scottish Reformed scholasticism and the reception of Descartes in Scotland.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…focuses on the relationship of theology and philosophy as formulated in the thought of three key Dutch Reformed theologians… All three were at the forefront of the philosophical debates that swirled in the Dutch Republic in the seventeenth and eighteenth centuries, especially instigated by the arrival of Renee Descartes (1596–1650) in the Netherlands in 1628… By studying these three theologians, Goudriaan “seeks to understand better how Dutch Reformed theology integrated and responded to philosophical views in the period from 1625 through 1750. Voetius, professor of theology at the University of Utrecht, was initially the premier defender against the Cartesian encroachment upon the Dutch Reformed Church that sought to undermine both her theology and piety. This mantle would be taken up by his successor at the university, Petrus van Mastricht. As might be expected, Goudriaan demonstrates that Voetius and Mastricht were in essential agreement with one another in their theology and polemic against Cartesianism as they engaged it from distinctly Reformed premises and commitments. Goudriaan deals successively with specific loci where the relationship between theology and philosophy was acutely tried and tested, including: reason and revelation; creation and the physical world; the providential rule of God over the world; anthropological issues of the relationship between the soul and the body; and divine and natural law. He notes that both Voetius and Mastricht had aligned themselves with the older Aristotelian philosophy against the newer Enlightenment philosophy, yet the debate was not waged over whose philosophical system was correct. This in itself would have been a losing concession, for it was precisely their aim that Reformed theology not be corrupted by alien philosophical concepts or categories that ultimately undermined Scriptural authority and teaching. Philosophy was instead viewed by them as an instrument or servant of the most basic Reformed principle, namely, the authority of Scripture as their principium cognoscendi. For them Scripture was not subordinated to philosophy, but philosophy to Scripture. This starting point alone accounted for the full-orbed nature of creation with its rich diversity, including spirits and bodies, heaven and earth, which Cartesian dualism could not account for or bring into any real, dynamic relation. Because of this common commitment to the Reformed principle of Scripture’s authority, Goudriaan observes, “the theological development from Voetius to Driessen supports the broader claim that biblical Christianity outlives the philosophical and conceptual apparatus with whose help it is explained.” To put it another way, philosophy was not the indispensable lord of theology, but its disposable handmaiden—it would, therefore, continue even when philosophies changed or failed.” – Daniel Ragusa Ariew, Roger – Descartes Among the Scholastics in History of Science &amp; Medicine Library, vol. 20 Pre (Brill, 2011) Schlebusch, J.A. – Cartesianism &amp; Reformed Scholastic Theology: A Comparative Study of the Controversy a Master’s thesis (Univ. of the Free State, South Africa, 2013) 160 pp. Includes a translation of two chapters of Christopher Wittich’s Two Dissertations in ch. 3, and of two chapters of Peter van Mastricht’s Vindication of the Truth, which reply to Wittich, in ch. 4. . . Cartesianism in Scotland in the Post-Reformation Articles Raffe, Alasdair – ‘Intellectual Change Before the Enlightenment: Scotland, the Netherlands &amp; the Reception of Cartesian Thought, 1650-1700’ The Scottish Historical Review, vol. 94; no. 238, pt. 1 (April 2015), pp. 24-47 Gellera, Giovanni ‘Descartes in Scotland &amp; Pre-Enlightenment Scottish Philosophy’ ‘The Scottish Faculties of Arts &amp; Cartesianism (1650-1700)’ History of Universities XXIX (2), pp. 166-187 ‘English Philosophers &amp; Scottish Academic Philosophy (1660–1700)’ (2017) ‘Robertson’s Philosophical Theses (1596): between Late Renaissance &amp; Early Modern Scholasticism’ eds. Alexander Broadie &amp; J.S. Reid, Philosophical Discourse in Seventeenth-Century Scotland: Key Texts (Scottish History Society) ‘The Philosophy of Robert Forbes: A Scottish Scholastic Response to Cartesianism’ Journal of Scottish Philosophy 11(2) (Sept., 2013), pp. 191-211 Abstract: “In the second half of the seventeenth century, philosophy teaching in the Scottish universities gradually moved from scholasticism to Cartesianism. Robert Forbes, regent at Marischal College and King’s College, Aberdeen, was a strenuous opponent of Descartes. The analysis of the philosophy of Forbes and of his teacher Patrick Gordon sheds light on the relationship between Scottish Reformed scholasticism and the reception of Descartes in Scotland.”

<main class="wrap"><figure class="quote" id="q-9316c5f744" data-kw="sponsion">
<blockquote><p>First, from the nature of the suretyship of Christ. Since that sponsion is nothing else than the perfectly absolute and immutable will of Christ, of substituting himself according to the eternal counsel of the Father in the place of the elect, and of making satisfaction for their sins, it necessarily implies by that very thing a real transference of the debts to him and the full deliverance and immunity of those for whom he agreed. Thus fidejussio as distinguished from expromissio cannot have place here simply, but expromissio. For the fidejussor is appointed only to insure confidence concerning the payment (not precisely his own) so as to promise that he will pay absolutely, but that the creditor may be made sure of the payment, where the principal debtor can be supplied still for paying it or at least where he still remains obligated and can and should first be applied to before the fidejussor. But here the case is evidently different. For as the elect were not so absolutely by paying, satisfaction could never be demanded of them. Thus by the suretyship and substitution of Christ i</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.9.5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d0abce20df" data-kw="elect">
<blockquote><p>Third, the elect themselves for whom the sponsion was made demanded an expromissor and not only a fidejussor. Their surety ought to be given for life (antipsychos) (as was said before) who would substitute himself for the guilty to endure the punishment they deserved and in this way deliver them (which a mere fidejussor could not do, who promises only to assure the creditor that he will receive the payment, but not exactly his own). Again, as the elect were not more by paying, so neither could a payment be expected from them forever; yea, neither according to the decree of God was it ever to be demanded. On this account, the surety was bound to take the payment absolutely upon himself and thus actually to bear the relation of expromissor. Finally, since they were not only about to be saved by Christ, but are in reality saved and received into heaven in virtue of the suretyship of Christ, it does not suffice for Christ to have been a fidejussor (who does not draw after himself the personal liberation of the original debtors); but he ought necessarily to have the relation of expromisso</p></blockquote>

</figure><figure class="quote" id="q-ac0b34ce13" data-kw="eternal">
<blockquote><p>The quality of the sponsor implies this. As he is God, infinite and most perfect, his sponsion ought to be most perfect and to involve whatever perfection can be conceived to be contained in an expromissor for the liberation of debtors. In addition, since he is such a sponsor as was neither invented nor given by men, but by God himself (yea, who from eternity offered himself to the Father and substituted himself in the place of sinners without their consciousness and desire; who was alone about to give payment according to the immutable decree of God, whose certainty was confirmed by various promises and sealed by many types), he could not have accomplished this unless even then he had fulfilled the functions of an expromissor and not only those of a fidejussor. Hence such was the efficacy and effect of that sponsion that in virtue of it the fathers were wholly freed from all punishments so that the payment could no longer be demanded of them. The learned men with whom we argue have not been able to deny this. Hence the very celebrated Cocceius: “The effect of the sponsion was that s</p></blockquote>

</figure><figure class="quote" id="q-71eec92229" data-kw="surety">
<blockquote><p>Moreover, here at the outset, we ought to come back to what we before observed—that this covenant of grace (instituted between an offended God and sinful, guilty man) could not have been ratified except by the intervention of a mediator, to reconcile the parties at variance with each other and perform the office of a surety, not only in the name of God (promising that he would fulfill the promises of the covenant, if we would fulfill its conditions—as, following Socinus, Curcellaeus falsely quibbles); but also to God for us—that he will fulfill all those conditions for us, which being performed, the inheritance according to the testament will come to us (most especially as to the fullest satisfaction to be given to divine justice for our sins). Nor does any controversy exist here among the orthodox, but only with the Socinians and their associates (against whom we will argue when we treat of the satisfaction). Statement of the question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.9.2</span></figcaption>

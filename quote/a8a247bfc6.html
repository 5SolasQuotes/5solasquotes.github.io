<main class="wrap"><figure class="quote" id="q-a8a247bfc6" data-kw="">
<blockquote><p>II… On the contrary, the latter [temporary faith] depends upon common grace which bestows even on the reprobate certain blessings: not only external and temporal, but also spiritual and initial gifts (although not saving) as a testification of a certain general love and to increase their guilt on the supposition of their contumacy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, p. 588</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, vol. 2, p. 588">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CII%E2%80%A6+On+the+contrary%2C+the+latter+%5Btemporary+faith%5D+depends+upon+common+grace+which+bestows+even+on+the+reprobate+certain+blessings%3A+not+only+external+and+temporal%2C+but+also+spiritual+and+initial+gifts+%28although+not+saving%29+as+a+testification+of+a+certain+general+love+and+to+increase+their+guilt+on+the+supposition+of+their+contumacy.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+vol.+2%2C+p.+588&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa8a247bfc6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a8a247bfc6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/common-grace#:~:text=On%20the%20contrary%2C%20the%20latter%20%5Btemporary,on%20the%20supposition%20of%20their%20contumacy&amp;text=On%20the%20contrary%2C%20the%20latter%20%5Btemporary%20faith%5D%20depends&amp;text=their%20guilt%20on%20the%20supposition%20of%20their%20contumacy" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e35882e0b2" data-kw="">
<blockquote><p>Thirdly, another cause of eternal reprobation is the act and working of distinguishing love, and everlasting grace: God has universal love, and particular love; general love, and distinguishing love; and so accordingly does decree, purpose, and determine: from general love, the extension of general grace and mercy; but from that love that is distinguishing, peculiar grace and mercy: Was not Esau Jacob’s Brother? Yet I loved Jacob, says the Lord, that is, with a better love, or a love that is more distinguishing: As he further makes appear in his answer to our Father Abraham, when he prayed to God for Ishmael: As for Ishmael, says He, I have heard thee; behold, I have blessed him, and will also make him fruitful: but my Covenant will I establish with Isaac, whom Sarah shall bear unto thee. Touching which words, there are these things observable: Mal. 1:2; Gen. 17:18,19, etc. 1. That God had better Love for Isaac, than he had for his Brother Ishmael. Yet, 2. Not because Isaac had done more worthy and goodly deeds, for Isaac was yet unborn. 3. This choice Blessing could not be denied to Ishmael because he had disinherited himself by sin; for this Blessing was entailed to Isaac, before Ishmael had a being also. Rom. 4:16-19; Gen. 15:4-5; Gen. 16. 4. These things therefore must needs fall out through the working of distinguishing love and mercy, which had so cast the business, that the purpose of God according to Election might stand. Further, Should not God decree to show distinguishing love and mercy, as well as that which is general and common, He must not discover his best love at all to the sons of men. Again, if He should reveal and extend his best love to all the World in general, then there would not be such a thing as Love that does distinguish; for distinguishing love appears in separating between Isaac and Ishmael, Jacob and Esau, the many called, and the few chosen. Thus by virtue of distinguishing love, some must be reprobate: For distinguishing love must leave some, both of the angels in Heaven, and the inhabitants of the Earth; wherefore the decree also that does establish it, must needs leave some.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reprobation Asserted</cite>, ch. 4, ‘Of the Causes of Reprobation’</span></figcaption>

</figure><figure class="quote" id="q-dca7db9516" data-kw="">
<blockquote><p>The Lord therefore did raise up his prophet Malachi (who was the last before Christ) sharply to rebuke, and plainly to convict this horrible ingratitude of that unthankful nation, who so shamefully had forgotten those so great benefits recently bestowed upon them. And thus begins he his prophecy: “I have loved you, sayeth the Lord,” in which words he speaks not of a common love, which in preserving and feeding all creatures is common to the reprobate, but of that love by the which he had sanctified and separated them from the rest of nations, to have his glory manifested.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“On Predestination” in The Works of John Knox</cite>, ed. David Laing (Edinburgh: J. Thin, 1895), 5:150-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-984ac52a70" data-kw="">
<blockquote><p>The Reformed commonly acknowledge a universal grace concerning natural things and a common grace concerning moral things, but saving grace concerning things that accompany salvation they do not allow, except as a grace proper to the elect: they acknowledge no saving grace that extends equally to each individual, not even that grace that they call objective.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (1698; RHB), vol. 2, bk. 2, ch. 17, section 32, ‘3. Does the saving grace of God extend equally to each and every person?’, p. 367</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-aaeaead8bb" data-kw="">
<blockquote><p>…we believe that all things without exception are under divine providence: whether heavenly or sublunary, great or small, necessary and natural or free and contingent. Thus nothing in the nature of things can be granted or happen which does not depend on it. The reasons are: (1) God created all things, therefore He also takes care of all things. For if it was glorious for God to create them, it ought not to be unbecoming in Him to take care of them. Nay, as He created, He is bound to conserve and govern them continually, since He never deserts His own work, but ought to be perpetually present with it that it may not sink back into nothingness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, On Providence</span></figcaption>

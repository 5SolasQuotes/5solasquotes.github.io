</figure><figure class="quote" id="q-47557be10b" data-kw="">
<blockquote><p>15. But when and in what sort and degree Christ gives the actual operations of the Spirit to all covenanted infants, it is wonderful hard for us to know. But this much seems clear:

1. That Christ may when he please work on the soul of an infant to change its disposition, before he come to the use of reason.

2. That Christ and his Spirit as in Covenant with infants, are ready to give all necessary assistance to infants for their inherent sanctification in the use of those means, and on those further conditions, on which we must wait for it and expect it. For the Holy Ghost is not so engaged to us in our Covenant or baptism, as to be obliged presently to give us all the grace that we want; but only to give it us on certain further conditions, and in the use of certain means. … In that also they are by Covenant and their parents promise, engaged to use those means which Christ has appointed for sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London: 1673) | Question 42, ‘But the great question is, How the Holy Ghost is given to infants in baptism?…’, p. 819</span></figcaption>

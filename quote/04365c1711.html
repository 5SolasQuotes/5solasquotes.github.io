<blockquote><p>Ob. But then Servants and Youth shall have no time of liberty to refresh themselves; visit their friends, and mend their apparel.

A. 1 The Sabbath or Lord’s day is a day of rest from servile labour appointed by the Lord himself, yet may not be spent any part of it in carnal delights, but wholly in religious exercises. 2 Other time I read of none in the Scripture. 3 I am well contented, there should be sometime allowed by the State for that end, and if not, sure I am, Masters and Governors of families ought to allow some convenient time to their servants for such occasions, and do freely do so my self.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-mocket.html">Thomas Mocket</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christmas, The Christian’s grand feast: Its original, growth, and observation, also of Easter, Whitsontide, and other holy days modestly discussed and determined. Also the beginning of the year, and other things observable</cite>, (London: Richard Wodenoth, 1650), p. 24.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ea0bc6aae3" data-kw="">
<blockquote><p>To acknowledge and confess, that, as we are convinced of our guilt, so, out of a deep sense thereof, we judge ourselves unworthy of the smallest benefits, most worthy of God’s fiercest wrath, and of all the curses of the law, and heaviest judgments inflicted upon the most rebellious sinners… Notwithstanding all which, to draw near to the throne of grace, encouraging ourselves with hope of a gracious answer of our prayers, in the riches and all-sufficiency of that only one oblation, the satisfaction and intercession of the Lord Jesus Christ… and humbly and earnestly to supplicate for mercy… And, with confidence of his mercy to his whole church, and the acceptance of our persons, through the merits and mediation of our High Priest, the Lord Jesus, to profess that it is the desire of our souls to have fellowship with God in the reverend and conscionable use of his holy ordinances; and, to that purpose, to pray earnestly for his grace and effectual assistance to the sanctification of his holy sabbath, the Lord’s day, in all the duties thereof, publick and private, both to ourselves, and to all other congregations of his people, according to the riches and excellency of the gospel, this day celebrated and enjoyed… And because we have been unprofitable hearers in times past, and now cannot of ourselves receive, as we should, the deep things of God, the mysteries of Jesus Christ, which require a spiritual discerning; to pray, that the Lord, who teacheth to profit, would graciously please to pour out the Spirit of grace, together with the outward means thereof, causing us to attain such a measure of the excellency of the knowledge of Christ Jesus our Lord, and, in him, of the things which belong to our peace…</p></blockquote>

</figure><figure class="quote" id="q-6e6e9458d0" data-kw="">
<blockquote><p>If the terms of our utmost ‘endeavors’ and ‘all the days of our lives’ are to be understood literally [in the SL&amp;C], and that we must not survive any violation of the Covenant… The terms of ‘forever’ [which the SL&amp;C does not use] or ‘for all the days of our lives’ are not in our contracts to be understood naturally, but morally. For we find it plainly in the [Mosaic] Judicial Law that after a Jew had taken a servant and bored a hole through his ear he was (as the text [Ex. 21:6] says) to serve him ‘forever,’ although one of them might possibly have died the next day, and both of them after a while might have been made captives to others. The law calls the league of marriage individua vitae consuetudo, a cohabitation for all the days of our lives, for so it should be ex voto contrahenti [out of the vow binding], in the sincere desires of the contractors. Yet we know one ordinarily dies before the other and that many conditions may happen to legitimate their divorce afterwards, though the contract was never so religiously made in the presence of almighty God at first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Anthony Ascham on the Expiring of the Solemn League &amp; Covenant</cite>, 1649’ (RBO)</span></figcaption>

of%20almighty%20God%20at%20first" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-308b743cae" data-kw="">
<blockquote><p>Objection 2: There is much error mixed with the few truths they preach, as Popery, Arminianism, etc. There are also invective reflections, yea railings against the people of God. Answer 1: What is morally good will bear the mixture of a great deal of evil, and yet retain its goodness still: the goodness being from God, who is a greater good than Satan or sin is an evil. Answer 2: We cannot expect from men of ordinary gifts that truth be preached without the mixture of errors more or less: We know but in part, therefore are to prove all things, and hold fast that which it good, Heb. 5:14. A saint, as other creatures, though weak and newly born, has a raft of what is food suitable and what sincere. Answer 3: As for those intemperate expressions and reflections on the people of God: I confess it is sad, but were there not such against Paul and his party? (Phil. 1:15) Yet notwithstanding they are to be heard even by the same persons they enveighed against, for the truth’s sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Case of Great &amp; Present Use</cite>, [Solemn League &amp;] Covenant &amp; Some of them [are] Supposed to be Scandalous in their Lives, Considered &amp; Affirmatively Resolved (1672; 1677), Consideration 2, pp. 12-13</span></figcaption>

0sake&amp;text=Objection%202%3A%20There%20is%20much%20error%20mixed%20with&amp;text=persons%20they%20enveighed%20against%2C%20for%20the%20truth%E2%80%99s%20sake" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>What shall I speak of such a clergy? who instead of praying that God would make his Church a praise, have endeavoured nothing more then to rob the Church of all that might make it praiseworthy, instead of desiring that the Church might enjoy fullness of ordinances, endeavouring to strip the Church of them all; to abolish Sabbaths, to bring the delight of days, the Queen of days under the curse of Job’s birthday, Let it not be joined to the days of the year, let it not come into the number of the months; to excommunicate preaching and praying, and cast them quite out of the Church; to turn the sacrament of the Lord’s supper into a sacrifice of the altar; Instead of praying that all ordinances and offices might be administered according to Christ’s rule and order, would have all things in God’s house &amp; worship done according to their own fancy, will, lust, humour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-newcomen.html">Matthew Newcomen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jerusalem’s Watch-men, the Lord’s Remembrancers: A Sermon Preached at the Abbey at Westminster, before both Houses of Parliament, and the Assembly of Divines, upon their Solemn Fast, July 7, 1643</cite>, (London: Christopher Meredith, 1643), pp 22-23.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“What shall I speak of such a clergy? who instead of praying that God would make his Church a praise, have endeavoured nothing more then to rob the Church of all that might make it praiseworthy, instead of desiring that the Church might enjoy fullness of ordinances, endeavouring to strip the Church of them all; to abolish Sabbaths, to bring the delight of days, the Queen of days under the curse of Job’s birthday, Let it not be joined to the days of the year, let it not come into the number of the months; to excommunicate preaching and praying, and cast them quite out of the Church; to turn the sacrament of the Lord’s supper into a sacrifice of the altar; Instead of praying that all ordinances and offices might be administered according to Christ’s rule and order, would have all things in God’s house &amp; worship done according to their own fancy, will, lust, humour.”

— Matthew Newcomen, Jerusalem’s Watch-men, the Lord’s Remembrancers: A Sermon Preached at the Abbey at Westminster, before both Houses of Parliament, and the Assembly of Divines, upon their Solemn Fast, July 7, 1643, (London: Christopher Meredith, 1643), pp 22-23.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+shall+I+speak+of+such+a+clergy%3F+who+instead+of+praying+that+God+would+make+his+Church+a+praise%2C+have+endeavoured+nothing+more+then+to+rob+the+Church+of+all+that+might+make+it+praiseworthy%2C+instead+of+desiring+that+the+Church+might+enjoy+fullness+of+ordinances%2C+endeavouring+to+strip+the+Church+of+them+all%3B+to+abolish+Sabbaths%2C+to+bring+the+delight+of+days%2C+the+Queen+of+days+under+the+curse+of+Job%E2%80%99s+birthday%2C+Let+it+not+be+joined+to+the+days+of+the+year%2C+let+it+not+come+into+the+number+of+the+months%3B+to+excommunicate+preaching+and+praying%2C+and+cast+them+quite+out+of+the+Church%3B+to+turn+the+sacrament+of+the+Lord%E2%80%99s+supper+into+a+sacrifice+of+the+altar%3B+Instead+of+praying+that+all+ordinances+and+offices+might+be+administered+according+to+Christ%E2%80%99s+rule+and+order%2C+would+have+all+things+in+God%E2%80%99s+house+%26+worship+done+according+to+their+own+fancy%2C+will%2C+lust%2C+humour.%E2%80%9D%0A%0A%E2%80%94+Matthew+Newcomen%2C+Jerusalem%E2%80%99s+Watch-men%2C+the+Lord%E2%80%99s+Remembrancers%3A+A+Sermon+Preached+at+the+Abbey+at+Westminster%2C+before+both+Houses+of+Parliament%2C+and+the+Assembly+of+Divines%2C+upon+their+Solemn+Fast%2C+July+7%2C+1643%2C+%28London%3A+Christopher+Meredith%2C+1643%29%2C+pp+22-23.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6bb7c73da1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6bb7c73da1.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/06/23/matthew-newcomen-on-the-evil-of-clergy-denigrating-the-sabbath-and-divine-ordinances/" rel="noopener" target="_blank"

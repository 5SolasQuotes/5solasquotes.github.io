<main class="wrap"><figure class="quote" id="q-f422f876d4" data-kw="">
<blockquote><p>In close connexion with the Headship of Christ, and flowing from it, is another fundamental principle of the Church of Scotland, commonly denominated her spiritual independence. This is that privilege conferred upon her by her Lord when he said, “I will give unto thee the key of the kingdom of heaven, and whatsoever thou shalt bind on earth shall be bound in heaven, and whatsoever thou shalt loose on earth shall be loosed in heaven;” and it is the principle thus embodied in her standards, “the Lord Jesus, as King and Head of his Church, hath therein appointed a government, in the hand of Church officers, distinct from the civil magistrate.”

This government is divine in its origin, spiritual in its nature, and independent in its exercise. It is not inconsistent with it for the State to acknowledge and patronise it, but it must not meddle with it so as to control or influence it. The judicatories of the Church and the State are co-ordinate, but entirely independent of each other. They have their distinct and separate provinces, and the one must not tamper with the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-morgan.html">James Morgan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belfast News-Letter</cite>, 18 March 1842.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

<blockquote><p>[R]eligious joy is greatly promoted by deep meditation, joined with active usefulness. These are united, because either is incomplete without the other, and together they produce a happy consummation. In secret the truth of God should be deeply and carefully contemplated; and as the heart is melted and inflamed by study, corresponding labours should be undertaken.

Mere study, without labour, is apt to induce a contemplative habit—agreeable, indeed, to the subject of it, but not useful to others; while activity, unaccompanied with deep meditation, is apt to degenerate into mere formality or vain-glory. When united, the principle and practice go together, and they mutually confirm and strengthen one another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-morgan.html">James Morgan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fruit of the Spirit – Joy in Christian Miscellany</cite></span></figcaption>

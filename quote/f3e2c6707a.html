<main class="wrap"><figure class="quote" id="q-f3e2c6707a" data-kw="">
<blockquote><p>If it be here objected that great vices have often made their appearance in the church we would reply that these are not defended and adhered to by the church, as by the various sects. Indeed, the church is the first to censure and condemn them. Hence, if there are faults in the church, these are disapproved of and removed. As long as this state of things lasts, so long the church remains.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, 59.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

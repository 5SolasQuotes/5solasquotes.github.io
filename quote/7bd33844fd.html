<blockquote><p>Regeneration is instantaneous, or happens in an instant. When it is termed successive by some, this is to be understood of the whole complex or collection of the term in the first few moments. Here we are dealing with the term regeneration in its first moment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Heinrich Heppe, Reformed Dogmatics</cite>, ed. Bizer, trans. Thomson (1950; Wipf &amp; Stock, 2007), ch. 20, ‘Calling’, section 17, pp. 518-9, citing Voet, II, 436 &amp; 449</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-34e17462fb" data-kw="">
<blockquote><p>In one word, then, by repentance I understand regeneration, the only aim of which is to form in us anew the image of God, which was sullied, and all but effaced by the transgression of Adam. So the apostle teaches when he says, ‘We all with open face beholding as in a glass the glory of the Lord, are changed into the same image from glory to glory, as by the Spirit of the Lord.’ Again, ‘Be renewed in the spirit of your mind,’ and ‘put ye on the new man, which after God is created in righteousness and true holiness.’ Again, ‘Put ye on the new man, which is renewed in knowledge after the image of him that created him.’ Accordingly, through the blessing of Christ we are renewed by that regeneration into the righteousness of God from which we had fallen through Adam, the Lord being pleased in this manner to restore the integrity of all whom He appoints to the inheritance of life. This renewal, indeed, is not accomplished in a moment, a day, or a year, but by uninterrupted, sometimes even by slow, progress God abolishes the remains of carnal corruption in his elect, cleanses them from pollution, and consecrates them as his temples, restoring all their inclinations to real purity, so that during their whole lives they may practise repentance, and know that death is the only termination to this warfare.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3. ‘Regeneration by Faith…’ in Institutes of the Christian Religion tr. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 2, bk. 3, pp. 149-82, pp. 159-60</span></figcaption>

</figure><figure class="quote" id="q-e5fd1f2691" data-kw="">
<blockquote><p>§IV. It [sanctification] is distinguished from regeneration. For regeneration, strictly taken, signifies the beginning of the spiritual life; but sanctification, the progress and continuation of the spiritual life, made through the habits of the spiritual virtues, by which the faithful are gradually led to perfection, although many take regeneration in a broader sense as a synonym for sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, trans. AI (Frankfurt: Zeitler, 1709), p. 2 Holtzfus (1659-1717) was a German, reformed professor of philosophy and theology at Frankfurt.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-819fdb1e4d" data-kw="">
<blockquote><p>Further I say that the force and efficacy of this most pure holiness which is in the flesh of Christ, flows even into us by the working of the Holy Ghost in us, so as we be hallowed in ourselves, that is to say, we be segregated from the defilings of this world, and serve God both in spirit and body. Which benefit is everywhere in the Scriptures called sanctification, or holiness, regeneration, or newbirth, illumination or enlightening, the new man, the new creature, and the Spirit or Spiritualness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Book of Christian Questions &amp; Answers</cite>, … (London: How, 1574), p. 45</span></figcaption>

</figure><figure class="quote" id="q-348dde9e91" data-kw="">
<blockquote><p>19. Because of this receiving, calling is termed conversion, Acts 26:20. All who obey the call of God are completely turned from sin to grace and from the world to follow God in Christ. It is also called regeneration or the very beginning of a new life, a new creation, a new creature–and it is often described in the Scriptures, Jn. 1:13; 3:6; 1 Jn. 3:9; 1 Pet. 1:23 and 2:2…

20. As for man, receiving is either passive or active. Phil. 3:12, ‘I apprehend, because I have been apprehended.’

21. The passive receiving of Christ is the process by which a spiritual principle of grace is generated in the will of man. Eph. 2:5, ‘He has quickened.’ …

30. Repentance has the same causes and principles as faith, for they are both free gifts of God. Eph. 2:8, ‘Faith is the gift of God;’ 2 Tim. 2:25, ‘Whether God may at some time give them repentance.’ They have the same subject; both have their seat in the heart or will of man. Rom. 10:9; 1 Kn. 8:48, ‘With the heart man believes.’ ‘They shall come back with all their heart.’ They are also begotten at the same time. But, first, they have diverse objects, for faith is properly directed to Christ and through Christ to God, but repentance is directed to God Himself who has been offended by the sin. Acts 20:21, ‘Turning towards God and faith in our Lord Jesus Christ.’ Second, they have diverse ends, for faith properly seeks reconciliation with God but repentance compliance with the will of God. Rom. 3:25, ‘A reconciliation through faith in his blood;’ Acts 26:20, ‘That they should… turn to God doing works fit for repentance.’

31. Repentance, so far as it comprises the care, anxiety, and terror connected with the law, precedes faith in order of nature, as a preparing and disposing cause, and is even found in the unregenerate; but insofar as it turns man away effectively and genuinely from sin, by which God is offended, it follows faith and depends upon it as an effect upon its cause and so belongs to those who have faith. … 34. Repentance is likely to be known before faith, because a sinner cannot easily persuade himself that he is reconciled to God in Christ before he feels himself to have left those sins which separated him from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, ed. tr. John Eusden (Labyrinth Press, 1983), bk. 1, ch. 26, ‘Calling’, pp. 158-60</span></figcaption>

n+to+God+doing+works+fit+for+repentance.%E2%80%99+31.+Repentance%2C+so+far+as+it+comprises+the+care%2C+anxiety%2C+and+terror+connected+with+the+law%2C+precedes+faith+in+order+of+nature%2C+as+a+preparing+and+disposing+cause%2C+and+is+even+found+in+the+unregenerate%3B+but+insofar+as+it+turns+man+away+effectively+and+genuinely+from+sin%2C+by+which+God+is+offended%2C+it+follows+faith+and+depends+upon+it+as+an+effect+upon+its+cause+and+so+belongs+to+those+who+have+faith.+%E2%80%A6+34.+Repentance+is+likely+to+be+known+before+faith%2C+because+a+sinner+cannot+easily+persuade+himself+that+he+is+reconciled+to+God+in+Christ+before+he+feels+himself+to+have+left+those+sins+which+separated+him+from+God.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+The+Marrow+of+Theology+3rd%2C+ed.+tr.+John+Eusden+%28Labyrinth+Press%2C+1983%29%2C+bk.+1%2C+ch.+26%2C+%E2%80%98Calling%E2%80%99%2C+pp.+158-60&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F348dde9e91.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/348dde9e91.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relation-of-repentance-to-saving-faith-justification/#:~:text=19.%20Because%20of%20this%20receiving%2C%20calling,sins%20which%20separated%20him%20from%20God&amp;text=19.%20Because%20of%20this%20receiving%2C%20calling%20is%20termed&amp;text=left%20those%20sins%20which%20separated%20him%20from%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

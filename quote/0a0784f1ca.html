<main class="wrap"><figure class="quote" id="q-0a0784f1ca" data-kw="">
<blockquote><p>Third, it is shown by the relation of effects to their cause. For effects proceed from the agent that causes them, in so far as they pre-exist in the agent; since every agent produces its like. Now effects pre-exist in their cause after the mode of the cause. Wherefore since the Divine Being is His own intellect, effects pre-exist in Him after the mode of intellect, and therefore proceed from Him after the same mode. Consequently, they proceed from Him after the mode of will, for His inclination to put in act what His intellect has conceived appertains to the will. Therefore the will of God is the cause of things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 19 | art. 4, I answer that</span></figcaption>

<blockquote><p>…the world’s creation, ended in six days, and declared to be perfected by his resting upon the seventh. In which number of days, He also pointed out, as it were, a set period of time, according to the revolution whereof times might be ever after computed, by weeks, or sevens of days. So that in that time, in which He made and fully finished the world, He set out a proportion of time, in which that Holy day should be observed; and by the perfecting of the world upon the seventh day, designed the very day, which, in that revolution of time, should be consecrated to Himself, and that by the ground upon which it was to be observed.</p></blockquote>

</figure><figure class="quote" id="q-0a819d3bca" data-kw="">
<blockquote><p>A simple survey of the world should of itself suffice to attest a Divine Providence. The heavens revolve daily, and, immense as is their fabric, and inconceivable the rapidity of their revolutions, we experience no concussion — no disturbance in the harmony of their motion. The sun, though varying its course every diurnal revolution, returns annually to the same point. The planets, in all their wanderings, maintain their respective positions. How could the earth hang suspended in the air were it not upheld by God’s hand? By what means could it maintain itself unmoved, while the heavens above are in constant rapid motion, did not its Divine Maker fix and establish it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 93:1</span></figcaption>

<blockquote><p>These things cannot occur until we have been justified by faith, and, regenerated, we receive the Holy Ghost: first, because the Law cannot be kept without [the knowledge of] Christ; and likewise the Law cannot be kept without the Holy Ghost. But the Holy Ghost is received by faith, according to the declaration of Paul, Gal. 3:14, ‘That we might receive the promise of the Spirit through faith.’ … Wherefore, when Paul says, Rom. 3:31, ‘We establish the Law through faith,’ by this we ought to understand, not only that those regenerated by faith receive the Holy Ghost, and have movements agreeing with God’s Law, but it is by far of the greatest importance that we add also this, that we ought to perceive that we are far distant from the perfection of the Law.</p></blockquote>

</figure><figure class="quote" id="q-151fbd74c5" data-kw="">
<blockquote><p>XXIV. In this [third state] it is asked: Whether in man’s first conversion to God our will cooperates actively with divine grace by its natural and inherent faculty, or whether in first conversion it behaves passively such that at the first moment of conversion it does not contribute at all, but allows the power of willing well to be infused into itself. The Papists assert the former; we, with Scripture, the latter. XXV. Eze. 11:19: ‘I will take away the heart of stone and give a heart of flesh.’ 1 Cor. 12:3: ‘No one can say Jesus is Lord except through the Holy Spirit.’ Ps. ‘Create in me a clean heart, O Lord, and renew a right spirit within me.’ Jn. 6:44: ‘No one can come to me unless the Father who sent me draws him.’ Phil. 2:13: ‘God is the one who works both to will and to accomplish.’ And these things concern that third [state]; the fourth follows. XXVI. In which those renewed and made children of God, moved by the Holy Spirit, act, namely freely cooperating with divine grace: for since the new man is gradually restored, that is, that image of God lost in Adam is gradually brought back, there is no doubt that they then freely will and meditate on actions conforming to divine Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on Free Will’</cite>, (Leiden: Patius, 1603), trans. AI Latin</span></figcaption>

olly-passive-therein/#:~:text=XXIV.%20In%20this%20%5Bthird%20state%5D%20it,on%20actions%20conforming%20to%20divine%20Law&amp;text=XXIV.%20In%20this%20%5Bthird%20state%5D%20it%20is%20asked&amp;text=and%20meditate%20on%20actions%20conforming%20to%20divine%20Law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9dbf374903" data-kw="">
<blockquote><p>‘Born again’. Being turned unto God by true faith and repentance: A metaphorical term. We are born again four ways:

1. Sacramentally, by Baptism.

2. Spiritually, by the Word.

3. Corporally, in the Resurrection.

4. Eternally, in our Glorification. Question: But why is our repentance likened to a new birth? Answer: [1] To distinguish true repentance, from that which is false and fained: for it imports five differences. …

2. That in true repentance there is a total change in the whole nature of man: He has grace in every part; a new mind and a new heart, a new memory, and a new conscience, a new language, and a new carriage both to God and man: for birth is the producing of all essential parts of man.

3. That in true repentance there is the pain of contrition, a broken spirit, the throws and pains of travail, there is true godly sorrow and grief in the birth of grace.

4. That there is in true repentance a daily hunger and thirst after the sincere milk of the Word, 1 Pet. 2:2.

5. That in the things of God’s Kingdom there is new life, and sense, and feeling, and motion. Secondly, to show the privilege of the penitent: for it signifies he gets more by his new birth than any child in nature can do by pleading his birthright: For if in repentance we be born unto God, then it shows:

1. That we have received power to be the sons of God, Jn. 1:2.

2. That with our adoption we enjoy the privileges of sons.

1. The favor of God, as a father.

2. The care of God to maintain us, Mt. 6:33.

3. The pardon of God in saving us from condemnation, Rom. 8:1.

4. The portion of God, even the inheritance which God gives as a Father, which is spoken of Rom. 8:17; Gal. 4:7. The use should be twofold: 1. That wee try ourselves carefully in the businesse of our repentance by the former signes:* 1.2 and secondly, that we comfort ourselves in the privileges of our new birth, rejoicing in our portion, and the favor of our heavenly Father. And thus of the reason of the phrase. Concerning the new birth, here we have occasion to consider of two things: 1. That it is needful often to be remembered of the doctrine of regeneration: the apostle having spoken of it before, falls upon it here again.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-000930b8b9" data-kw="">
<blockquote><p>The theology of Christians approves the teachings of philosophy if they are true, correct, and salutary. It uses them by its own right and makes them catholic. If they are too unclear, it sheds light on them; if they are mixed with harmful errors, it separates the precious from the cheap and keeps the one and destroys the other.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d21c6396fc" data-kw="">
<blockquote><p>16… This can be illustrated by the likeness of the soul. For the soul, which is whole in the whole body and whole in each part of the body, as to essence, is not more in the heart or brain than in the feet; for equally, as far as essence is concerned, it is in each part of the human body: yet it is said to be especially in the head, as to the effects which it produces more excellently and preeminently in the head than in the rest of the body. For indeed it diffuses the power of sensing throughout the whole body: but in the head, it effects the power of hearing, seeing, smelling, tasting: indeed, also of speaking, thinking, remembering, understanding, which powers it does not exert in other members.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System of Christian Theology</cite>, (Hanau, 1609-1610), bk. 2, God &amp; his Attributes, ch. 12, ‘On the Immensity of God’, pp. 159-60 tr. ChatGPT-4 by Monergism</span></figcaption>

</figure><figure class="quote" id="q-5f865897be" data-kw="">
<blockquote><p>I have often wished that one of the veteran theologians would have developed a form of logic like the one I have outlined here, though I have only sketched rather than fully worked it out. Even though Andreas Hyperius published Theological Topics in the previous century, he did not use the method that scholars desire. A theological logic should be crafted such that it first demonstrates a method of argumentation in general and then provides rules for forming judgments in individual common places of theological debate. Here, I have broken the first ice. Kindly judge, reader, what I have accomplished, and make this handbook richer through your own efforts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Logic, setting forth the Way one ought to Argue Singular Common Places in Most Holy Theology in General &amp; in Specific $5 Downloard</cite>, tr. Jonathan Tomes (Frankfurt, 1625)</span></figcaption>

</figure><figure class="quote" id="q-ca5ddc7651" data-kw="">
<blockquote><p>The purpose of this paper is to explain Descartes’ views on Metaphysics. It is my thesis that one of the ways in which he influenced not only modern philosophy, but the way in which we do philosophy even today, is by turning metaphysical inquiry into an epistemological enterprise. That is to say, he made the critique of knowledge necessary prior to any consideration of existence, and what may or may not have it… I will attempt to show that Descartes’ view of Metaphysics, in spite of the fact that he used familiar scholastic metaphysical terminology, actually turned Metaphysics into what is today termed Epistemology. Descartes, not Kant, was the first to perform a true critique of knowledge, and to make that critique a necessary preliminary to all questions about what exists outside our minds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-haines.html">David Haines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Descartes &amp; Epistemological Metaphysics’</cite></span></figcaption>

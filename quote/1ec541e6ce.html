<main class="wrap"><figure class="quote" id="q-1ec541e6ce" data-kw="">
<blockquote><p>Now from gymnastic art those sports will have to be proposed to youth which, besides what they contribute to the health and preservation of the body and the production of graceful movements, also render men fit and ready for military service and the advantageous use of arms. Young men should therefore exercise themselves in running, jumping, wrestling, horseback riding, the handling of all arms and weapons which are used for open and hand-to-hand combat, the arrangement of battle formations, the positioning of camp, and mock battle (Plato, Laws, VII, 803c, 813d-e). To these, nobles may add the exercise of hunting. These exercises which pertain to military science ought to be so constituted and conducted in such a serious manner that they approximate as much as possible the actual operations of war, as Plato has said (Plato, Laws VII, 824 a-c)… according to the words of the psalm: ‘It is God who girds me with strength for war and prepares my path’ (Ps. 18:32). In charge of these sports, as of the kind previously mentioned, there should always be men singularly experienced in the field involved, men of universal wisdom most zealous for all piety and virtue, who are admired and therefore have the authority and power to relate and to adapt all youthful sport to a zeal for and practice of the virtues, which is the one goal of all sports among Christians; for we have been created for the praise of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Reign of Christ in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969), bk. 2, ch. 54, ‘Honest Games’</cite>, pp. 352-53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2e809cbdf1" data-kw="">
<blockquote><p>But because there is no hope that most should be judicious, there is no other remedy for such but this of Christ’s prescript which I have here set down: First, happy is he that chooses a judicious faithful guide and learns of him till his own understanding be better illuminated; and that escapes the conduct of ignorant, erroneous, self-seeking, proud, dividing teachers. Secondly, continue in the communion of the generality of agreeing Christians: The generality of the godly are more unlikely to be forsaken of Christ than a few odd self-conceited singular professors. This is the way of peace to yourselves and to the Church of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 40, ‘Labour for a sound judgment to know good from evil, lest you trouble yourselves and others by mistakes: And till you grow so judicious, forsake not the guidance of a judicious teacher, nor the company of the agreeing generality of the Godly’</cite>, pp. 212-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

— Richard Baxter, The Cure of Church Divisions… (London, 1670), pt. 1, Direction 40, ‘Labour for a sound judgment to know good from evil, lest you trouble yourselves and others by mistakes: And till you grow so judicious, forsake not the guidance of a judicious teacher, nor the company of the agreeing generality of the Godly’, pp. 212-13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+because+there+is+no+hope+that+most+should+be+judicious%2C+there+is+no+other+remedy+for+such+but+this+of+Christ%E2%80%99s+prescript+which+I+have+here+set+down%3A+First%2C+happy+is+he+that+chooses+a+judicious+faithful+guide+and+learns+of+him+till+his+own+understanding+be+better+illuminated%3B+and+that+escapes+the+conduct+of+ignorant%2C+erroneous%2C+self-seeking%2C+proud%2C+dividing+teachers.+Secondly%2C+continue+in+the+communion+of+the+generality+of+agreeing+Christians%3A+The+generality+of+the+godly+are+more+unlikely+to+be+forsaken+of+Christ+than+a+few+odd+self-conceited+singular+professors.+This+is+the+way+of+peace+to+yourselves+and+to+the+Church+of+Christ.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Church+Divisions%E2%80%A6+%28London%2C+1670%29%2C+pt.+1%2C+Direction+40%2C+%E2%80%98Labour+for+a+sound+judgment+to+know+good+from+evil%2C+lest+you+trouble+yourselves+and+others+by+mistakes%3A+And+till+you+grow+so+judicious%2C+forsake+not+the+guidance+of+a+judicious+teacher%2C+nor+the+company+of+the+agreeing+generality+of+the+Godly%E2%80%99%2C+pp.+212-13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2e809cbdf1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2e809cbdf1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-truth/#:~:text=But%20because%20there%20is%20no%20hope,and%20to%20the%20Church%20of%20Christ." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-25a3563ea4" data-kw="">
<blockquote><p>Truth is the daughter of time, was the saying of old, and our daily experience gives in evidence and proof hereof, to every man’s ordinary observation. Only as in other births, so here, the barrenness and fruitfulness of several ages, depend merely upon God’s good pleasure; who opens and shuts the womb of truth from bearing, as He sees fit, according to the counsel of his own will. Not that there is any change in the truth, but the alteration grows, according to men’s apprehensions, to whom it is more or less discovered, according to God’s most just judgment and their own deservings. Sometimes God makes an eclipse of the truth at midday, that so He might express his wrath from Heaven against the unthankfulness, prophaness and atheism of a malignant world. … Sometimes when men entertain the truth in profession, but not in the love of it and that endeared affection that is due thereunto, the Lord gives men up to the activity of error, as the apostle speaks, because they did not love that the trutb should be truth, they embraced falsehood instead of truth, that so they might be deluded and damned… He that will estrange his affection [to others] because of the difference of apprehension in things difficult, he must be a stranger to himself one time or other. If men would be tender and careful to keep off offensive expressions, they might keep some distance in opinion, in some things, without hazard to truth or love. But when men set up their sheaves (though it be but in a dream, as Joseph’s was) and fall out with every one that will not fall down and adore them, they will bring much trouble into the world, but little advantage to the truth or peace. Again, the Reader must know for his direction in this inquiry, my aim only was, and is, to lay down, and that briefly, the grounds of our practice, according to that measure of light I have received, and to give answer to such reasons which might seem to weaken the evidence thereof: declining purposely, for the present, the examination of such answers which are made to the arguments alledged by some of our reverend Brethren touching the same subject: because I would neither prejudice nor prevent their proper defense, which I do suppose in the fittest season they will so present unto the world as shall be fully satisfactory to such as love and desire the knowledge of the truth. The sum is, we doubt not what we practise, but it’s beyond all doubt that all men are liars and we are in the number of those poor feeble men; either we do, or may err, though we do not know it; what we have learned we do profess and yet profess still to live that we may learn. And therefore the errand upon which this present discourse is sent, is summarily to show these two things unto the world: 1. That there must be more said (than yet it has been my happiness to see) before the principles we profess will be shaken, and consequently it cannot be expected, that we should be unsetled in our practice. 2. That I might occasion men eminently gifted to make further search, and to dig deeper, that if there be any vein of reason which lies yet lower, it might be brought to light, and we profess and promise, not only a ready ear to hear it, but a heart willing to welcome it. It’s the perfection of a man, amidst these many weaknesses we are surrounded withal, by many changes to come to perfection. It’s the honour and conquest of a man truly wise to be conquered by the truth: and he has attained the greatest liberty that suffers himself to be led captive thereby. … In the handling of all these particulars, so full of difficulty and obscurity, I am not such a stranger at home, but that I am easily sensible of the weight of the matter and mine own weakness: and therefore I can professe in a word of truth that against mine own inclination and affection I was haled by importunity to this so hard a task, to kindle my rush candle, to join with the light of others, at least to occasion them to set up their lamps. Now He that is the way, the truth, and the life, pave out all the ways of his people and make their paths plain before them: Lead us all into that truth which will lead us unto eternall life: bring us once unto that impotency and impossibility that we can do nothing against the truth, but for it, that so our congregations may not only be styled as Ezekiel’s temple, but be really what was prophesied the Churches should be in these last days, Jehovah Shammah [the Lord is There]. In the arms of his everlasting mercy I leave thee…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hooker.html">Thomas Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Sum of Church-Discipline… (London: Bellamy, 1648), Preface, no page numbers</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

ficulty+and+obscurity%2C+I+am+not+such+a+stranger+at+home%2C+but+that+I+am+easily+sensible+of+the+weight+of+the+matter+and+mine+own+weakness%3A+and+therefore+I+can+professe+in+a+word+of+truth+that+against+mine+own+inclination+and+affection+I+was+haled+by+importunity+to+this+so+hard+a+task%2C+to+kindle+my+rush+candle%2C+to+join+with+the+light+of+others%2C+at+least+to+occasion+them+to+set+up+their+lamps.+Now+He+that+is+the+way%2C+the+truth%2C+and+the+life%2C+pave+out+all+the+ways+of+his+people+and+make+their+paths+plain+before+them%3A+Lead+us+all+into+that+truth+which+will+lead+us+unto+eternall+life%3A+bring+us+once+unto+that+impotency+and+impossibility+that+we+can+do+nothing+against+the+truth%2C+but+for+it%2C+that+so+our+congregations+may+not+only+be+styled+as+Ezekiel%E2%80%99s+temple%2C+but+be+really+what+was+prophesied+the+Churches+should+be+in+these+last+days%2C+Jehovah+Shammah+%5Bthe+Lord+is+There%5D.+In+the+arms+of+his+everlasting+mercy+I+leave+thee%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Thomas+Hooker%2C+A+Survey+of+the+Sum+of+Church-Discipline%E2%80%A6+%28London%3A+Bellamy%2C+1648%29%2C+Preface%2C+no+page+numbers&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F25a3563ea4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/25a3563ea4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-truth/#:~:text=Truth%20is%20the%20daughter%20of%20time%2C,his%20everlasting%20mercy%20I%20leave%20thee%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-29b048a510" data-kw="">
<blockquote><p>The adopted [children of God] see their own sins, Satan’s snares, and Christ’s beauty which they whom the god of the world has blinded cannot discern.​</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beatitudes</cite>, p. 247</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>
<div class="actions"><button class="copy" data-copy="“The adopted [children of God] see their own sins, Satan’s snares, and Christ’s beauty which they whom the god of the world has blinded cannot discern.​”

— Thomas Watson, The Beatitudes, p. 247">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+adopted+%5Bchildren+of+God%5D+see+their+own+sins%2C+Satan%E2%80%99s+snares%2C+and+Christ%E2%80%99s+beauty+which+they+whom+the+god+of+the+world+has+blinded+cannot+discern.%E2%80%8B%E2%80%9D%0A%0A%E2%80%94+Thomas+Watson%2C+The+Beatitudes%2C+p.+247&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F29b048a510.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/29b048a510.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-beauty/#:~:text=The%20adopted%20%5Bchildren%20of%20God%5D%20see,the%20world%20has%20blinded%20cannot%20discern.%E2%80%8B" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-66ee2edf9a" data-kw="">
<blockquote><p>Aquinas’s own view of the matter is worth noting, however, since it touches on a deep difficulty in the philosophy of beauty. Aquinas regarded truth, goodness and unity as ‘transcendentals’—features of reality possessed by all things, since they are aspects of being, ways in which the supreme gift of being is made manifest to the understanding. His views on beauty are more implied than stated; nevertheless he wrote as though beauty too is such a transcendental (which is one way of explaining the point already made, that beauty belongs to every category). He also thought that beauty and goodness are, in the end, identical, being separate ways in which a single positive reality is rationally apprehended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roger-scruton.html">Roger Scruton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beauty: a Very Short Introduction Pre (Oxford University Press, 2011)</cite>, pp. 3-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

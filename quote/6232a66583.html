</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5785375741" data-kw="">
<blockquote><p>The origin of the doctrine of common grace was occasioned by the fact that there is in the world, alongside of the course of the Christian life with all its blessings, a natural course of life, which is not redemptive and yet exhibits many traces of the true, the good, and the beautiful. The question arose, How can we explain the comparatively orderly life in the world, seeing that the whole world lies under the curse of sin? How is it that the earth yields precious fruit in rich abundance and does not simply bring forth thorns and thistles? How we can we account for it that sinful man still retains some knowledge of God, of natural things, and of the difference between good and evil, and shows some regard for virtue and for good outward behavior? What explanation can be given for the special gifts and talents that with which the natural man is endowed, and of the development of science and art by those who are entirely devoid of the new life that is in Christ Jesus? How can we explain the religious aspirations of men everywhere, even of those who did not come in touch with the Christian religion? How can the unregenerate still speak truth, do good to others, and lead outwardly virtuous lives?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology (Eerdmans, 1968)</cite>, pp. 432-46</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</div>
</figure><figure class="quote" id="q-4211d83ec0" data-kw="">
<blockquote><p>5. God calls upon sinners to turn to Him by the internal voice and motions of His Spirit… There is a twofold call of the Spirit: more common and more special. 1. More common, and so many are called which never are thoroughly converted. It was the common work of the Spirit which made Felix tremble, which brought Agrippa within a step of Christianity and caused Herod to do many things. Multitudes of unregenerate ones have felt the waters stirred, the Holy Ghost moving them to conversion, and have readily proffered His aid and assistance, and perhaps, for awhile, they have been led by Him. But then they have refused to let go of some lust or vanity which He has bid them abandon. They would not turn their spiritual sloth into serious diligence about the concerns of their immortal souls, and so by disregarding His motions, and by slighting His help, they have made the Spirit to go away in grief who came in love to work upon them. 2. There is a call of the Spirit which is more special and efficacious…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Conversion of a Sinner, Explained &amp; Applied, a sermon on Eze. 33:11, 1669, in The Puritans on Conversion (Soli Deo Gloria, 1990)</cite>, pp. 105-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-44319088f9" data-kw="">
<blockquote><p>‘The love of God is the essential property or essence of God, whereby delighting Himself in it, He wishes it the good which He approves.’ To be distinguished are ‘the general love of God’, the object of which is creation generally, so that ‘no one either of men or even of demons may say that he is not loved by God’; God hates the sin in the godless, but loves the nature created by Him — and the ‘special love of God, by which He peculiarly pursues the separate elect.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syntagma Theologiae Christianae, 2.122, quoted by Heinrich Heppe, Reformed Dogmatics, p. 95. The whole, large quote is Heppe’s; the small quotes inside it are from Polanus’.</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-c1eaded1ee" data-kw="">
<blockquote><p>Christ is also the legislative Head of the Church. All her laws and ordinances are of Christ’s appointment. The ordinances of the Mosaic economy were prescribed by the Redeemer (Acts vii. 38); and when these had served their object, the same power which instituted those ancient rites abolished them, and in their stead appointed the precious ordinances of the New Testament (Matt. xxviii. 19, 20). The legislative power of Christ is completely ignored by the Church of Rome; for that church has not only repealed and set aside the laws and institutions which Christ has appointed, but she has also instituted laws and ordinances in addition, and in flat opposition, to the laws and ordinances appointed by the Great Lawgiver. The Church of England also has, in the most unwarrantable manner, prescribed holidays, introduced the rite of confirmation, and required the sign of the cross, and godfathers and godmothers in baptism, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the church, and terms of communion: together with the terms of communion of the Reformed Presbyterian Church in Ireland. To which is appended the Cameronian Dream</cite>, (Belfast, 1879), p. 30.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-67fe2bc755" data-kw="">
<blockquote><p>That which I first meet withal directly unto this purpose is, part 2, p. 157, the forbearance of communion with the Church of England in its parochial assemblies (that is in the way and manner before described) he opposes with two arguments. The first respects those who allow occasional communion with parochial churches but will not comply with them in that which is constant and absolute. For he says, if the first be lawful, the latter is necessary from the commands we have to preserve the peace and unity of the Church. And the not doing it, he says, is one of the provoking sins of the non-conformists; but whether it be a sin or no is sub Judice [under judgment]; that it is provoking unto some is sufficiently evident. I shall not make this any part of my contest… And it will be hard to prove that on a concession of the lawfulness of communion in some acts of divine worship, it will be necessary for men to oblige themselves unto total constant communion, with a renunciation and condemnation of all other ways and means of joint edification. It may also be lawful to do a thing with some respects and limitations, at some times, which it, may not be lawful to do absolutely and always. It may be necessary from outward circumstances to do that sometimes which is lawful in itself, though not necessary from itself; it can never be necessary to do that which is unlawful. Of the first sort they esteem occasional communion, and the other of the latter. Some time is spent [by the opponent] in taking off an exception unto this inference from the practise of our Saviour, who had occasional communion with the Jews in the Temple and ynagogues, which he proves to have been constant and perpetual, and not occasional only, and that He prescribed the same practise unto his disciples. But I think this labour might have been spared. For there is nothing more clear and certain than that our Lord Jesus Christ did join with the Jews in the observance of God’s institutions among them, on the one hand; and on the other, that he never joined with them in the observance of their own traditions and Pharasaical impositions, but warned all his disciples to avoid them and refuse them [Mt. 15], whose example we desire to follow; for concerning all such observances in the Church, he pronounced that sentence, ‘Every plant that my Heavenly Father has not planted shall be rooted up.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Inquiry into the Original, Nature, Institution, Power, Order, and Communion of Evangelical Churches</cite>, (London, 1681), polemic, section, pp. 252-53</span></figcaption>

</figure><figure class="quote" id="q-4c214d30fa" data-kw="">
<blockquote><p>If any thing be altered or added which is not commanded of God, being not essential, but accidental, and not as necessary, but as indifferent, appertaining to decency, or to order, or to edification, we cannot hence conclude that anything is altered of the appointed worship, or that there is another worship erected. As for example, Christ performed his Supper at night. The apostles were wont to perform it also in the morning, and the Church followed afterwards this time. Should a man hereupon say that anything is derogated from the Supper of the Lord? Surely no, because Christ commanded not the same to be celebrated in the night, as Himself observed it, but only ‘hoc facite,‘ that we should do that (for the matter or substance) which He did, but not at that time wherein He did it. Also to that the primitive Church (as appears in Justin Martyr) did mingle water with the wine in the Lord’s Supper; it is not a sufficient ground to say they altered or changed the institution of the Lord’s Supper, and that for two reasons: One, because it may be that the wine which Christ Jesus gave to his disciples was mingled with water, seeing the apostles do not report the contrary and it is probable that the primitive Church might receive this from the apostles. Another reason is because the primitive Church did not add water as a matter altogether necessary, and so as appertaining to the substance of the Lords Supper, but only to signify a mystery. But if any did commend it as necessary, they did undoubtedly deprave the Lord’s Supper. But they much more, who used only water in the Lord’s Supper, as the Aquarii did, against whom Cyprian did write: for it is evident, that Christ our Sauior used wine, and commanded that we also should do the like. To this add, in that the ancient bishops in the celebration of the Lord’s Supper did put on another garment than that they usually did wear, appertains nothing to the alteration of the Lord’s Supper: For Christ commanded not that we should celebrate his Supper with our usual garments, as He did, but only that we should do that which He did Himself. The like may be affirmed of sundry other things, as well in baptism as in the Supper of the Lord. The sum of all is this: Such things as are added, but yet as matters indifferent, for order, for decency and to edification, such matters do not change the substance of the sacraments, and therefore alter not the worship. But such things as are taken from the institution of Christ, or else are added as necessary, and appertaining to the substance, those things do corrupt the institution of the Lord, and so do establish another kind of worship. To this kind of addition appertain the places of forbidding to add to God’s Word, Dt. 4:1-2. Note that which he there says, ‘Ye shall not add to the Word which I command you,’ the Word of the Lord is necessary, it ties the conscience, and delivers the substance of the worship, and has nothing adiaphoral or indifferent therein: wherefore to add unto the Word is to ordain or appoint in God’s worship some thing as necessary, and as appertaining to the essence or worship of God, and which does so bind men’s consciences, even as the Word of God itself; wherefore he adds not unto the Word of God, which by the consent of the Church ordains anything, not as necessary, but as indifferent, and free for order only, or for decency, and unto edification, not binding the conscience of any by such an ordinance.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“If any thing be altered or added which is not commanded of God, being not essential, but accidental, and not as necessary, but as indifferent, appertaining to decency, or to order, or to edification, we cannot hence conclude that anything is altered of the appointed worship, or that there is another worship erected. As for example, Christ performed his Supper at night. The apostles were wont to perform it also in the morning, and the Church followed afterwards this time. Should a man hereupon say that anything is derogated from the Supper of the Lord? Surely no, because Christ commanded not the same to be celebrated in the night, as Himself observed it, but only ‘hoc facite,‘ that we should do that (for the matter or substance) which He did, but not at that time wherein He did it. Also to that the primitive Church (as appears in Justin Martyr) did mingle water with the wine in the Lord’s Supper; it is not a sufficient ground to say they altered or changed the institution of the Lord’s Supper, and that for two reasons: One, because it may be that the wine which Christ Jesus gave to his disciples was mingled with water, seeing the apostles do not report the contrary and it is probable that the primitive Church might receive this from the apostles. Another reason is because the primitive Church did not add water as a matter altogether necessary, and so as appertaining to the substance of the Lords Supper, but only to signify a mystery. But if any did commend it as necessary, they did undoubtedly deprave the Lord’s Supper. But they much more, who used only water in the Lord’s Supper, as the Aquarii did, against whom Cyprian did write: for it is evident, that Christ our Sauior used wine, and commanded that we also should do the like. To this add, in that the ancient bishops in the celebration of the Lord’s Supper did put on another garment than that they usually did wear, appertains nothing to the alteration of the Lord’s Supper: For Christ commanded not that we should celebrate his Supper with our usual garments, as He did, but only that we should do that which He did Himself. The like may be affirmed of sundry other things, as well in baptism as in the Supper of the Lord. The sum of all is this: Such things as are added, but yet as matters indifferent, for order, for decency and to edification, such matters do not change the substance of the sacraments, and therefore alter not the worship. But such things as are taken from the institution of Christ, or else are added as necessary, and appertaining to the substance, those things do corrupt the institution of the Lord, and so do establish another kind of worship. To this kind of addition appertain the places of forbidding to add to God’s Word, Dt. 4:1-2. Note that which he there says, ‘Ye shall not add to the Word which I command you,’ the Word of the Lord is necessary, it ties the conscience, and delivers the substance of the worship, and has nothing adiaphoral or indifferent therein: wherefore to add unto the Word is to ordain or appoint in God’s worship some thing as necessary, and as appertaining to the essence or worship of God, and which does so bind men’s consciences, even as the Word of God itself; wherefore he adds not unto the Word of God, which by the consent of the Church ordains anything, not as necessary, but as indifferent, and free for order only, or for decency, and unto edification, not binding the conscience of any by such an ordinance.”

— Jerome Zanchi, Other citations (work not named), Of Redemption, ch. 19, fol. 447, as quoted in John Sprint, Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1618), ‘Reformed Practices’, ‘Practice’, pp. 177-79">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+any+thing+be+altered+or+added+which+is+not+commanded+of+God%2C+being+not+essential%2C+but+accidental%2C+and+not+as+necessary%2C+but+as+indifferent%2C+appertaining+to+decency%2C+or+to+order%2C+or+to+edification%2C+we+cannot+hence+conclude+that+anything+is+altered+of+the+appointed+worship%2C+or+that+there+is+another+worship+erected.+As+for+example%2C+Christ+performed+his+Supper+at+night.+The+apostles+were+wont+to+perform+it+also+in+the+morning%2C+and+the+Church+followed+afterwards+this+time.+Should+a+man+hereupon+say+that+anything+is+derogated+from+the+Supper+of+the+Lord%3F+Surely+no%2C+because+Christ+commanded+not+the+same+to+be+celebrated+in+the+night%2C+as+Himself+observed+it%2C+but+only+%E2%80%98hoc+facite%2C%E2%80%98+that+we+should+do+that+%28for+the+matter+or+substance%29+which+He+did%2C+but+not+at+that+time+wherein+He+did+it.+Also+to+that+the+primitive+Church+%28as+appears+in+Justin+Martyr%29+did+mingle+water+with+the+wine+in+the+Lord%E2%80%99s+Supper%3B+it+is+not+a+sufficient+ground+to+say+they+altered+or+changed+the+institution+of+the+Lord%E2%80%99s+Supper%2C+and+that+for+two+reasons%3A+One%2C+because+it+may+be+that+the+wine+which+Christ+Jesus+gave+to+his+disciples+was+mingled+with+water%2C+seeing+the+apostles+do+not+report+the+contrary+and+it+is+probable+that+the+primitive+Church+might+receive+this+from+the+apostles.+Another+reason+is+because+the+primitive+Church+did+not+add+water+as+a+matter+altogether+necessary%2C+and+so+as+appertaining+to+the+substance+of+the+Lords+Supper%2C+but+only+to+signify+a+mystery.+But+if+any+did+commend+it+as+necessary%2C+they+did+undoubtedly+deprave+the+Lord%E2%80%99s+Supper.+But+they+much+more%2C+who+used+only+water+in+the+Lord%E2%80%99s+Supper%2C+as+the+Aquarii+did%2C+against+whom+Cyprian+did+write%3A+for+it+is+evident%2C+that+Christ+our+Sauior+used+wine%2C+and+commanded+that+we+also+should+do+the+like.+To+this+add%2C+in+that+the+ancient+bishops+in+the+celebration+of+the+Lord%E2%80%99s+Supper+did+put+on+another+garment+than+that+they+usually+did+wear%2C+appertains+nothing+to+the+alteration+of+the+Lord%E2%80%99s+Supper%3A+For+Christ+commanded+not+that+we+should+celebrate+his+Supper+with+our+usual+garments%2C+as+He+did%2C+but+only+that+we+should+do+that+which+He+did+Himself.+The+like+may+be+affirmed+of+sundry+other+things%2C+as+well+in+baptism+as+in+the+Supper+of+the+Lord.+The+sum+of+all+is+this%3A+Such+things+as+are+added%2C+but+yet+as+matters+indifferent%2C+for+order%2C+for+decency+and+to+edification%2C+such+matters+do+not+change+the+substance+of+the+sacraments%2C+and+therefore+alter+not+the+worship.+But+such+things+as+are+taken+from+the+institution+of+Christ%2C+or+else+are+added+as+necessary%2C+and+appertaining+to+the+substance%2C+those+things+do+corrupt+the+institution+of+the+Lord%2C+and+so+do+establish+another+kind+of+worship.+To+this+kind+of+addition+appertain+the+places+of+forbidding+to+add+to+God%E2%80%99s+Word%2C+Dt.+4%3A1-2.+Note+that+which+he+there+says%2C+%E2%80%98Ye+shall+not+add+to+the+Word+which+I+command+you%2C%E2%80%99+the+Word+of+the+Lord+is+necessary%2C+it+ties+the+conscience%2C+and+delivers+the+substance+of+the+worship%2C+and+has+nothing+adiaphoral+or+indifferent+therein%3A+wherefore+to+add+unto+the+Word+is+to+ordain+or+appoint+in+God%E2%80%99s+worship+some+thing+as+necessary%2C+and+as+appertaining+to+the+essence+or+worship+of+God%2C+and+which+does+so+bind+men%E2%80%99s+consciences%2C+even+as+the+Word+of+God+itself%3B+wherefore+he+adds+not+unto+the+Word+of+God%2C+which+by+the+consent+of+the+Church+ordains+anything%2C+not+as+necessary%2C+but+as+indifferent%2C+and+free+for+order+only%2C+or+for+decency%2C+and+unto+edification%2C+not+binding+the+conscience+of+any+by+such+an+ordinance.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+Other+citations+%28work+not+named%29%2C+Of+Redemption%2C+ch.+19%2C+fol.+447%2C+as+quoted+in+John+Sprint%2C+Cassander+Anglicanus%2C+showing+the+Necessity+of+Conformity+to+the+Prescribed+Ceremonies+of+our+Church+in+Case+of+Deprivation+%28London%3A+Bill%2C+1618%29%2C+%E2%80%98Reformed+Practices%E2%80%99%2C+%E2%80%98Practice%E2%80%99%2C+pp.+177-79&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4c214d30fa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4c214d30fa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-regulative-principle-of-worship/#:~:text=If%20any%20thing%20be%20altered%20or,of%20any%20by%20such%20an%20ordinance&amp;text=If%20any%20thing%20be%20altered%20or%20added%20which&amp;text=the%20conscience%20of%20any%20by%20such%20an%20ordinance" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>‘Occasional‘, properly, is that which has a reason, not from the nature of the thing itself, but from such occasional occurrences of providence, as God will not alter, and its that which has no moral nor sacred conveniency with the nature of worship, but has only a conveniency for such a time and place, as Christ’s preaching in a ship, when He is at the sea side, and a multitude are to hear Him, the ship has no agreement with the nature of preaching, more than a house has. Time, place, and persons are clearly such as agreed with that [Last] Supper, as [a supper] first, not as a sacred worship; and therefore [these particulars] were merely occasional, and so not imitable [by us]; and though Christ might have altered them, yet had they been occasional, and they have no sacred conveniency with this Supper, as this Supper; and if Christ had altered these for mere will, upon no reasons that concerns all suppers, they had not been occasional, but positive points of worship, and so had obliged us;</p></blockquote>

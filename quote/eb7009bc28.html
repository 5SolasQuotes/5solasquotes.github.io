<main class="wrap"><figure class="quote" id="q-eb7009bc28" data-kw="">
<blockquote><p>Critics of eternal punishment not only fail to do justice to the doom-worthiness of sin, the rigorousness of divine justice; they also infringe on the greatness of God’s love and the salvation that is in Christ. If the object had not been salvation from eternal destruction, the price of the blood of God’s own Son would have been much too high. The heaven that he won for us by his atoning death presupposes a hell from which he delivered us. The eternal life he imparted to us presupposes an eternal death from which he saved us. The grace and good pleasure of God in which he makes us participants forever presuppose a wrath into which we would otherwise have had to be plunged forever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed</cite>, Dogmatics, trans. John Vriend, ed. John Bolt (4 vols, Grand Rapids, 2003-08), iv, 713.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3472fb0e3b" data-kw="">
<blockquote><p>When Thomas Cranmer drew up his Articles of Religion in 1553, there were Forty-Two of them, not the eventual Thirty-Nine, and its final two articles condemned those who sought to restore the doctrines of millennialism and universal restoration. However, when the Articles were revised, they were omitted for reasons not entirely clear. As a result, there is nothing in the Articles of Religion that requires a belief in eternal conscious torment without the hope of repentance, which is something that later universalists would come to point out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/river-devereux.html">River Devereux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A History of Alternative Views of Hell</cite>, (2025)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/hell.html">Hell</a></span></div>

</figure><figure class="quote" id="q-e90e3fb79f" data-kw="">
<blockquote><p>God causes to be proclaimed to us that there is nothing the corrupt intellect of man—an intellect fully darkened by sin and increasingly blinded by Satan—more readily does than carelessly and erroneously trust in the mere external proclamation of the gospel. Such a man considers it to be sufficient unto salvation that he has intellectually comprehended the gospel, and therefore, he has truly believed and will certainly procure eternal salvation and deliverance through Christ and by God’s grace.

This is the lamentable and wretched faith of almost all our Reformed lip confessors, who stake their immortal souls on such a faith and thus enter into eternity with a mere intellectual and superficial affirmation that Christ is their saviour and that they will certainly be delivered and saved by Him. Sadly, the majority of them will not discover their grievous error and dreadful self-deceit until, being actually in hell, they then find it to be eternally impossible for them to retrace their steps and to restore what is amiss.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 90.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

nt-will-not-save-him-from-hell/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-d5273c7d9d" data-kw="">
<blockquote><p>Paradise signifies a garden, the word being translated out of Greek into Latin, and so into French and English. In Hebrew it is called Heden, which signifies delights, a garden of all manner of delights, a place beset with all kind of fruitful and beautiful trees. There were two special trees in it, one called the tree of life, the other of the knowledge of good and evil. Some say it was called the tree of life from the effect, because of the hidden power and force it had a of sustaining and prolonging man’s life.1 Although it be a dispute, whether it had this force as meat [food] to prolong life or as medicine to prevent death, old age and diseases, as likewise whether this power in the tree were natural or supernatural. Therefore others say it was called so not from the effect, but signification, because it was an outward sign, that God would give them immortality if they did continue. 1. Paradise was a little model of heaven, and a sign of the great heaven, assuring Adam, that if he continued in obedience to God, he should be translated into heaven, to enjoy God supernaturally, as there he did enjoy him naturally: for the Law saying, “Do this and live,” [Luke 10:28] means it of ever lasting life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Of Divinity Consisting Of Three Books</cite>, (London, 1646), 122 [Spelling and punctuation modernized].</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

e · Heidelblog</a></div>
</figure><figure class="quote" id="q-9b64e71071" data-kw="">
<blockquote><p>Wherefore, since the Word Himself has come to us from heaven, we need not, I reckon, go any more in search of human learning to Athens and the rest of Greece, and to Ionia. For if we have as our teacher Him that filled the universe with His holy energies in creation, salvation, beneficence, legislation, prophecy, teaching, we have the Teacher from whom all instruction comes; and the whole world, with Athens and Greece, has already become the domain of the Word.</p></blockquote>

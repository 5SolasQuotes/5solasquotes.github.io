<blockquote><p>To stir up every one to help forward this glorious work of the Jews’ conversion; they were sometimes the chief, and the first born; though now their dignity is gone, and they are as prisoners in the pit; help we to restore them to their former liberty, lift them out of the pit into which they are fallen; If it were but our enemies beast, we were bound to help it out, how much more these that have been the people of God, and have such promises made unto them?

What shall we do to help forward their calling and conversion?

Take away (as much as in us lies) the stumbling block, which hinders their coming in; and these blocks are two; First, The one is the Idolatry of Christian Churches, especially that of Rome, whiles we do anything to uphold these Idolatries, we doe put the stumbling block before them, to hinder them; but take away these stones and blocks which they stumble at, and then their way will be more easy and plain. Secondly, The other is the carnalness and licentiousness of the lives of Christians, this is a great stumbling block unto them; remove this from before them, let them see a spirit of grace shining upon us, and appearing in our lives: and then we shall make plain the way of the Lord for them to return to Sion, see Esay 57.14.

Intreat the Lord for them, that he would visit them in due time, be we their remembrancers before the Lord; they have long lain in the dungeon, as Esa. 42.22. and been made a prey of, and there hath been none to say, restore, let us therefore speak unto God in their behalf, and say, Lord restore thy ancient people, bring them back to the fellowship of thy Church; take to you the words of Micah, Chap. 7.14. Feed thy people with thy rod, and the flock of thine inheritance in the midst of Carmel; let them feed in Bashan and Gilead, as in old time; commend their estate unto God, and the rather should we do this, Because

1. They prayed for us when we were no people, that we might be the people of God, Psal. 67.1, 2. When the salvation of God was revealed to them, they prayed that it might be revealed unto us; We have a little sister (said they) Cant. 8.8. They took thought for us, we being then that little sister, and so let us do for them.

2. It is from them that the means of salvation is come to us, the Law is called their Law, Joh. 10.34. It was given as an inheritance to the children of Israel, Deut. 33.4. And the spiritual things of the Gospel, are called their spiritual things, Rom. 15.27. And thence is that in Esa. 2.3. The Law shall go forth of Sion, and the word of the Lord from Jerusalem: yea, and of them came Christ concerning the flesh, Rom. 9. All the means of grace and salvation, are theirs first, and from them they come unto us; and thence it is that Christ himself tells us, That salvation is of the Jews, Joh. 4.22. We owe them this therefore, as a requital unto them.

3. Consider a further good that shall come unto ourselves by their calling unto Christ, there shall be an increase of blessing coming to ourselves. Great light shall be manifested, and knowledge shall increase, Esa. 24. ult. The light of the Sun, and of the Moon shall be darkened, by the light which shall come from that Church, the light of the Jewish Church which was but as the light of the Moon, and the light of the Gentile Churches, which is as the Sun, shall both be dim in comparison of the light which shall be in that Church, when the glory of the Lord is risen upon them. See Esa. 60.1.2. which speaks of the estate of the Jewish Church after their calling, as appears by that which goes before, Chap. 59. end. Many of those dark Prophecies, which now lie hid in obscurity, shall then be brought to light; the accomplishment of them will then give us the interpretation.

4. Admit we neither had received benefit from them hitherto, nor could expect any further blessing hereafter, yet consider the glory which shall then come to Christ by their coming in, the glory of his kingdom shall be enlarged, Jerusalem shall be a throne of glory to him, Jer. 3.17. then shall the Lord be glorified in them, all the house of Israel shall glory in the Lord, Esa. 45.25. and shall draw others of the Gentiles unto them.

5. If there were neither good to ourselves, nor glory to Christ by their calling, yet even pity and compassion should move us; consider who they are, even the children of Abraham our father, and Sarah our mother; they are our brethren, and our flesh; and how should it pity us to see the children of our father in the dungeon, and prison-pit? Oh pray for them, that the blessing of Abraham their father may come upon them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-bulkeley.html">Peter Bulkeley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The gospel-covenant; or The covenant of grace opened</cite>, (London: Benjamin Allen, 1646), pp 19-21.</span></figcaption>

<blockquote><p>3. A magistrate may compel a heathen nation to the negative reverence of Christ in a indirect way, and that with the sword, though he cannot compel to the positive worshipping of Him: if a Christian prince subdue a pagan nation, he cannot force them with the sword to a positive receiving of the doctrine of the Gospel, but if it be a nation expressly blaspheming Christ, as the nation of the Jews now do, he may compel them to an abstinence from a professed blaspheming of Christ, because he is to use the sword against blasphemy.

4. The weapons of the Church as the Church are not carnal, but spiritual and mighty through God.</p></blockquote>

<blockquote><p>Secondly it is asked whether Jews or pagans can be over Christians or not. And it seems that yes:

1. From the fact that the apostle says, 1 Tim. 6:1: Let all who are under the yoke of slavery deem their masters worthy of all honor. Gloss: ‘Under the yoke of infidels.’ Therefore the apostle does not deny that infidels were able to be over the faithful.

2. Likewise, Extra, Of Many: Because to be cultivated. Therefore Jews can be over Christians. They have clung more longly to their lands, as owing to a contract of the place, let them remain for the cultivation of fields, rendering the customary payments to the aforesaid Christian men.

3. Likewise, they are able to receive a price for Christian slaves that have been purchased; which would not be the case unless they were able in some way to be over them, as is found in dist. 54, Fraternitatem.

4. It also seems so from what Gelasius says, XVII, question 4, where it is said that diligently. From this it seems that your care should faithfully examine the truth of affairs, so that neither religion may seem violated, nor a slave lying by this objection, strive to decline the rights of the rightful master, whom it is not certain to be a Christian, from the dominion of his master is not to be exempted. But the contrary seems true: a. From what is said in the Decretals, Multorum, where it is said: To no Jew. And it says that it is lawful to retain a Christian slave in his dominion, but, if any are found among them, let their freedom be preserved for them. Gregory: Whatever Christian slaves a Jew is found to have purchased, bring them without ambiguity to freedom according to the precepts of the laws, lest, God forbid, the Christian religion, made subject to the Jews, be polluted. b. Likewise, in dist. 54: No public offices are to be imposed on Jews by which they may be granted the punishment of inflicting upon Christians; let Christians have Jews as masters. But this was done so that to the Jews c. Likewise, it is found in the Decretals, On the Jews, where it is prohibited, To these things for all Christians. And this same thing is found there, when they expose themselves for some wage to the service of the Jews, as is continually said: Jews or Saracens, etc. But what reason is there that, on account of the Christian faith, the right over a slave should be taken away from him, since servitude was introduced by divine law and approved also by canon law? But the Christian religion does no wrong to anyone. [Solution]: To this it must be said that a Christian is not permitted to serve a Jew, on account of avoiding damage to the Christian religion, as is found in the Decretals, On the Jews, To these things for all, where it is said: The customs of the Jews and ours in no way agree. For this same reason also, if some, because of continual conversation and assiduous familiarity, are easily able to incline the minds of the simple to their superstition and faithlessness, and they themselves should be their slaves, let them be freed from their service, sometimes at a price being given, sometimes at no price being given. For a slave of a Jew is either homeborn or purchased. If homeborn, if he is or wishes to become a Christian, he is immediately snatched away into freedom, with no price given, as is found in the Code, On bishops, and dist. 54, Fraternitatem. But if he is purchased, either he was a Christian when he was bought or a pagan. If a Christian, he becomes free, with no price given; as is found in dist. 54, Mancipia, trade in Christians is forbidden to Jews, both by the law of the land and by the law of the forum. But if he was a pagan, either he was bought for the sake of service or for the sake of commerce. If for the sake of service, and he wishes to become a Christian, he becomes free without price, dist. 54, Fraternitatem. But in the second case, if within three months afterward he has not put him up for sale if he wishes to become a Christian, he is freed without price, because it is presumed that he bought him in order to serve. But if he has put him up for sale within that term and he wishes to become a Christian then or afterward, provided that the fault did not rest with the master so that he did not sell him, he is freed, the price of twelve solidi being returned by some Christian, dist. 54, Frater, and nitatem. Decretals, In the present council: If, however, a Jew shall circumcise one wishing to become a Christian, or shall imprint the mark of another sect, he is freed without price for the injury of his own body, dist. 54, Nulla, where it is said that if certain Christians have been defiled by them in Jewish rite or even circumcised, without the price being returned let them return to freedom and the Christian religion, but human law inflicts a heavier punishment. But what has been said about the slaves of the Jews can be said about the slaves of the Saracens: for the same suspicion and the same danger can exist in both. [To the objections]:

1. To the objection, however, on the contrary it must be said that that of the apostle is understood for the state of the primitive Church and so that unbelieving masters might be enticed to the conversion of faith through the services of faithful slaves. Hence the Gloss says: Rather, unbelieving masters are converted through the services of faithful slaves. But there is added there in the text: Lest the name of the Lord and doctrine be blasphemed. The Gloss: ‘As though of one invading what is another’s.’ According to that reasoning, it will seem to someone, and Christian doctrine will seem as if unjust, that it is also now so to be done. But to this it must be answered that another reason restores the pact. For now they ought not to serve, lest the name of the Lord be blasphemed; for thus Jews and pagans are inclined to this, that they may draw the faithful into faithlessness or apostasy. On account of which cohabitation with Jews and pagans, unless for the sake of preaching, is forbidden, lest the name of the Lord be blasphemed. Nor ought Christian doctrine on this account to seem unjust, since the caution of faith must be preferred to all.

2. To the second, however, it must be said that, although Christians may cultivate the landed estates of Jews, they ought not nevertheless to serve Jews in their house, lest bad familiarity be contracted. And from this they are not said rightly to be over them as over slaves, because they cannot transfer them to another place or to another service, as is said in the Decretals, On the Jews. And this was done in favor of Christians, not of Jews, that they may cultivate the landed estates or lands bought from Jews, because they had formerly lived in those lands.

3. To the third, however, it must be said that, although they may receive the price of servitude, nevertheless not for Christians already existing, but for pagans who wish to become Christians. For by the law of the land Christian slaves are freed from the service of Jews, lest there be danger to the Christian faith. In favor also of the Christian faith, to certain men wishing to receive Christianity freedom is granted.

4. But that which is said in XVII, question 4, does not expressly give to understand that he was a Christian, but that he said that he had been a Christian from infancy, and that the mark of circumcision had been impressed on him by the aforesaid lord, he would be freed. But if he was not a Christian, he is not to be freed from servitude by the fact that he has fled to the church, unless he wishes to become a Christian, and this canon seems to say this. Hence it is not introduced for the dominion of Jews, but for the dominion of Christians: for some wished to defraud their master of his own right, fleeing to the enclosures of the Church.

5. To the last it must be said that the catholic Church intends to do injury to no one, but has ordered this so that no injury be done to God; but injury would be done to God if faith in something were endangered on account of the observance of temporal justice.</p></blockquote>

dden+to+Jews%2C+both+by+the+law+of+the+land+and+by+the+law+of+the+forum.+But+if+he+was+a+pagan%2C+either+he+was+bought+for+the+sake+of+service+or+for+the+sake+of+commerce.+If+for+the+sake+of+service%2C+and+he+wishes+to+become+a+Christian%2C+he+becomes+free+without+price%2C+dist.+54%2C+Fraternitatem.+But+in+the+second+case%2C+if+within+three+months+afterward+he+has+not+put+him+up+for+sale+if+he+wishes+to+become+a+Christian%2C+he+is+freed+without+price%2C+because+it+is+presumed+that+he+bought+him+in+order+to+serve.+But+if+he+has+put+him+up+for+sale+within+that+term+and+he+wishes+to+become+a+Christian+then+or+afterward%2C+provided+that+the+fault+did+not+rest+with+the+master+so+that+he+did+not+sell+him%2C+he+is+freed%2C+the+price+of+twelve+solidi+being+returned+by+some+Christian%2C+dist.+54%2C+Frater%2C+and+nitatem.+Decretals%2C+In+the+present+council%3A+If%2C+however%2C+a+Jew+shall+circumcise+one+wishing+to+become+a+Christian%2C+or+shall+imprint+the+mark+of+another+sect%2C+he+is+freed+without+price+for+the+injury+of+his+own+body%2C+dist.+54%2C+Nulla%2C+where+it+is+said+that+if+certain+Christians+have+been+defiled+by+them+in+Jewish+rite+or+even+circumcised%2C+without+the+price+being+returned+let+them+return+to+freedom+and+the+Christian+religion%2C+but+human+law+inflicts+a+heavier+punishment.+But+what+has+been+said+about+the+slaves+of+the+Jews+can+be+said+about+the+slaves+of+the+Saracens%3A+for+the+same+suspicion+and+the+same+danger+can+exist+in+both.+%5BTo+the+objections%5D%3A+1.+To+the+objection%2C+however%2C+on+the+contrary+it+must+be+said+that+that+of+the+apostle+is+understood+for+the+state+of+the+primitive+Church+and+so+that+unbelieving+masters+might+be+enticed+to+the+conversion+of+faith+through+the+services+of+faithful+slaves.+Hence+the+Gloss+says%3A+Rather%2C+unbelieving+masters+are+converted+through+the+services+of+faithful+slaves.+But+there+is+added+there+in+the+text%3A+Lest+the+name+of+the+Lord+and+doctrine+be+blasphemed.+The+Gloss%3A+%E2%80%98As+though+of+one+ %2C+he+would+be+freed.+But+if+he+was+not+a+Christian%2C+he+is+not+to+be+freed+from+servitude+by+the+fact+that+he+has+fled+to+the+church%2C+unless+he+wishes+to+become+a+Christian%2C+and+this+canon+seems+to+say+this.+Hence+it+is+not+introduced+for+the+dominion+of+Jews%2C+but+for+the+dominion+of+Christians%3A+for+some+wished+to+defraud+their+master+of+his+own+right%2C+fleeing+to+the+enclosures+of+the+Church.+5.+To+the+last+it+must+be+said+that+the+catholic+Church+intends+to+do+injury+to+no+one%2C+but+has+ordered+this+so+that+no+injury+be+done+to+God%3B+but+injury+would+be+done+to+God+if+faith+in+something+were+endangered+on+account+of+the+observance+of+temporal+justice.%E2%80%9D%0A%0A%E2%80%94+Alexander+of+Hales%2C+Sum+of+Universal+Theology%2C+%28Paris%2C+1230-1245%29%2C+pt.+2+of+2%2C+inq.+3%2C+tract+8%2C+sect.+1%2C+quest.+1%2C+title+2+%7C+member+2+%7C+ch.+2%2C+%E2%80%98Whether+Jews+or+Pagans+can+Preside+over+Christians%3F%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd0aac9ca2b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d0aac9ca2b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=Secondly%20it%20is%20asked%20whether%20Jews,of%20the%20observance%20of%20temporal%20justice&amp;text=Secondly%20it%20is%20asked%20whether%20Jews%20or%20pagans&amp;text=on%20account%20of%20the%20observance%20of%20temporal%20justice" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>[T]here are some stupid preachers among us Germans (as I am sorry to hear) who are making the people believe that we ought not and must not fight against the Turks. Some are even so foolish as to say that it is not proper for Christians to bear the temporal sword or to be rulers. Furthermore, some actually want the Turk to come and rule because they think our German people are wild and uncivilized – indeed, that they are half-devil and half-man. …

Moreover, I hear it said that in Germany there are those who desire the coming of the Turk and his government because they would rather be under him than under the emperor or princes. It would be hard to fight against the Turk with such people.</p></blockquote>

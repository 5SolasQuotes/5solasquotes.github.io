<blockquote><p>33. Effectual calling consists in the production of faith…

34. Its object are the elect alone, although not all, such as are those who are intercepted by precipitous death before all use of reason. Its instrument is neither the voice of nature, nor the word of the Law, but of the gospel.</p></blockquote>

<blockquote><p>4. In this expression of ‘the Covenant,’ the spiritual good things promised therein are limited to Abraham and to his seed. But all infants whatsoever are not comprehended under the seed of Abraham. To say many thousands are excluded from the seals and outward administration of the Covenant, when yet everyone is partaker of the good promised in the Covenant, is to speak of ourselves, and not according to the Word of God. We will not tie the grace of God to outward means: but ordinarily we cannot affirm they pertain to the Covenant of Grace, and obtain the highest blessings promised therein, whom God does not vouchsafe so much as outwardly to receive into Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 6, ‘Of the Covenant of Grace as it was made and manifested to Abraham’, p. 92</span></figcaption>

<blockquote><p>1. God never did, nor ever will, justify and save a wicked Jew that lived and died impenitent, though he was of the seed of Abraham, and a Hebrew of the Hebrews, and had all the honour and advantages that attended circumcision. He does and will render indignation and wrath, tribulation and anguish, upon every soul of man that doeth evil; and of the Jew first, whose privileges and professions, instead of screening him from the judgment of God, will but aggravate his guilt and condemnation. See Rom. 2:3, 8–9, 17. Though God has favoured the Jews, above other nations, with the dignities of visible church-membership, yet He will not therefore accept of any particular persons of that dignity, if they allow themselves in immoralities contradictory to their profession; and particularly in persecution, which was now, more than any other, the national sin of the Jews.

2. He never did, nor ever will, reject or refuse an honest Gentile, who, though he has not the privileges and advantages that the Jews have, yet, like Cornelius, fears God, and worships Him, and works righteousness, that is, is just and charitable towards all men, who lives up to the light he has, both in a sincere devotion and in a regular conversation. Whatever nation he is of, though ever so far remote from kindred to the seed of Abraham, though ever so despicable, nay, though in ever so ill a name, that shall be no prejudice to him. God judges of men by their hearts, not by their country or parentage; and, wherever He finds an upright man, He will be found an upright God, Ps. 18:25. Observe, Fearing God, and working righteousness, must go together; for, as righteousness towards men is a branch of true religion, so religion towards God is a branch of universal righteousness. Godliness and honesty must go together, and neither will excuse for the want of the other. But, where these are predominant, no doubt is to be made of acceptance with God. Not that any man, since the fall, can obtain the favour of God otherwise than through the mediation of Jesus Christ, and by the grace of God in Him; but those that have not the knowledge of Him, and therefore cannot have an explicit regard to Him, may yet receive grace from God for his sake, to fear God and to work righteousness; and wherever God gives grace to do so, as He did to Cornelius, He will, through Christ, accept the work of his own hands. Now: (1) This was always a truth, before Peter perceived it, that God respecteth no man’s person; it was the fixed rule of judgment from the beginning: If thou doest well, shalt thou not be accepted? And, if not well, sin, and the punishment of it, lie at the door, Gen. 4:7. God will not ask in the great day what country men were of, but what they were, what they did, and how they stood affected towards Him and towards their neighbors; and, if men’s personal characters received neither advantage nor disadvantage from the great difference that existed between Jews and Gentiles, much less from any less difference of sentiments and practices that may happen to be among Christians themselves, as those about meats and days, Rom. 14:1-23. It is certain the kingdom of God is not meat and drink, but righteousness, and peace, and joy in the Holy Ghost; and he that in these things serveth Christ is accepted of God, and ought to be approved of men; for dare we reject those whom God doth not? (2) Yet now it was made more clear than it had been; this great truth had been darkened by the covenant of peculiarity made with Israel, and the badges of distinction put upon them; the ceremonial law was a wall of partition between them and other nations; it is true that in it God favoured that nation (Rom. 3:1–2; 9:4), and thence particular persons among them were ready to infer that they were sure of God’s acceptance, though they lived as they listed, and that no Gentile could possibly be accepted of God. God had said a great deal by the prophets to prevent and rectify this mistake, but now at length he does it effectually, by abolishing the covenant of peculiarity, repealing the ceremonial law, and so setting the matter at large, and placing both Jew and Gentile upon the same level before God; and Peter is here made to perceive it, by comparing the vision which he had with that which Cornelius had. Now in Christ Jesus, it is plain, neither circumcision availeth any thing, nor uncircumcision,Gal. 5:6; Col. 3:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, ch. 10, v. 35, “But in every nation he that feareth Him, and worketh righteousness, is accepted with Him.”</span></figcaption>

<blockquote><p>All friends, brothers, and equals that are endowed with greater grace, experience and knowledge – to the extent that they provide us with good and just counsel from God’s Word – must be acknowledged as our superiors. If David had rejected Abigail’s advice and suggestion in pushing him away from disproportionate vengeance, he would have also rejected God’s counsel and sinned against the fifth commandment of the Decalogue no less than if the supreme priest or prophet of God had commanded that same thing, according to his prophetic authority, which Abigail had only urged privately.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Careful Review of Arminianism</cite>, trans. David C. Noe (RHB, 2023), ch. 27, ‘Synods’</span></figcaption>

<div class="actions"><button class="copy" data-copy="“All friends, brothers, and equals that are endowed with greater grace, experience and knowledge – to the extent that they provide us with good and just counsel from God’s Word – must be acknowledged as our superiors. If David had rejected Abigail’s advice and suggestion in pushing him away from disproportionate vengeance, he would have also rejected God’s counsel and sinned against the fifth commandment of the Decalogue no less than if the supreme priest or prophet of God had commanded that same thing, according to his prophetic authority, which Abigail had only urged privately.”

<blockquote><p>Here are three opinions concerning these prophets mentioned by the apostle:

1. [that they were, and warrant, laymen preaching, as held by the Independent, Socinians and Arminians;]

2. That these prophets were Church officers, and no more but ordinary teachers or interpreters of Scripture in the Church: without excluding the sons of the prophets, or probationers from their assembly, and from exercising their gifts in preaching upon occasion, and fore-trial of their gifts, or of the growth and increase thereof, yet I remember no place in the New Testament where ordinary pastors are said to prophesy, except Rev. 11:3, where notwithstanding, prophesy is ascribed unto them in no other sense than the working of miracles, v. 6: ‘Those have power to shut heaven, that it rain not in the days of their prophesy, and have power over waters to turn them into blood, and to smite the earth with all plagues as often as they will.’ All which (prophesying and miracles) is spoken by way of allusion to Moses and Elijah.

3. That they were extraordinary prophets, immediately and extraordinarily inspired by the Holy Ghost; and that they are to be reckoned among these other administrations which were not to continue, or be ordinary in the Church: apostles, evangelists, workers of miracles. (Synopsis of Pure Theology, disp. 42, thesis 22; Martyr, Common Places, class. 4, ch. 1; Aretius, Theological Problems, place 62; Calvin, Institutes, bk. 4, ch. 3, §4; Diodati on 1 Cor. 14:1; the late English Annotations on 1 Cor. 12:28; Mr. [Paul] Bayne on Eph. 4:11, together with two learned countrymen of mine, Mr. David Dickson on 1 Cor. 14:31 and Mr. [Samuel] Rutherfurd on his Peaceable Plea, ch. 16) I know many Protestant writers of very good note, are of the second opinion. But with all due respect unto them, I hold the third opinion, with Gerhard [a Lutheran], Common Places, tome 6, p. 72, and diverse others.</p></blockquote>

<blockquote><p>It is asked, eighth, whether the covenant of grace was promulgated in the Decalogue. The famous Cameron, because he did not distinguish carefully enough between the use of the Decalogue and its nature, stated that the Decalogue was neither the covenant of works nor the covenant of grace, but a certain subservient covenant, insofar as like a pedagogue, it drove the elect to seek Christ (Gal. 3:24; Rom. 10:4–5). The celebrated Cocceius with his followers, since he stated that by its violation the covenant of works was plainly abolished, nor did anything remain except the eternal and universal testament of grace until the Israelites’ making of the calf, after which the Decalogue, with the adding of the twofold formula, “Do this and you will live,” and “Cursed be the one who will not remain in all things which are written in the book of the law,” accepted not indeed the essence of the covenant of works, but yet the appearance of it, stated that the Decalogue is the pure, unadulterated covenant of grace. On the contrary, the rest of the Reformed state that in the Decalogue there is no promulgation of the covenant of grace, but only the renewal of the covenant of works, although that renewal, at least in relation to the elect, had an evangelical use, that it would drive them to embrace Christ. This is so because: (1) the Decalogue has nothing of Christ, nothing of faith in Christ. (2) Even if it did set forth Christ and faith in Christ, which yet we do not grant, yet it still has in addition all moral good works; accordingly we would not be justified by faith alone, because without any doubt we are justified by the observance of the covenant of grace. (3) The Decalogue has all those things (with only the positive commandment excepted, concerning not eating the forbidden fruit) which God stipulated from our first parents in the covenant of works. (4) It is also sanctioned with threats and promises, in the same way as the covenant of works. Therefore nothing prohibits saying that it properly presents the covenant of works again, although in relation to the elect, for an evangelical end and use. Nor is it any hindrance that in it mention is made of that formula which pertains to the covenant of grace, “I am your God,” because entirely nothing is repugnant to urging obedience to the covenant of works by arguments and motives taken from the benefits of the covenant of grace. But we will set aside this argument for its proper place, concerning the dispensation of the covenant of grace under Moses (bk. 8, ch. 2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology: Redemption in Christ</cite>, vol. 4, trans. Todd Rester (Reformation Heritage Books, 2023), 45–46.</span></figcaption>

<blockquote><p>The commanding power of the law in positive precepts and prohibitions, which justified persons are subject unto, does make and constitute all their unconformities unto it to be no less truly and properly sins in their own nature, than they would be if their persons were obnoxious unto the curse of it.</p></blockquote>

</figure><figure class="quote" id="q-e0bbe98fe5" data-kw="">
<blockquote><p>Obj. 8. The law is the letter which killeth, and is the ministration of death and condemnation. (2 Cor. 3:6, 7.) But there is no condemnation to Christians. Therefore, the law does not have respect to Christians who are in Christ Jesus. Ans. There is here a fallacy of accident; for the law is not in itself the letter which killeth; since this comes to pass by the fault of men, who, the more clearly they perceive the difference between themselves and the law, the more fully do they give themselves over to despair in reference to their salvation, and are therefore slain by the law. Again, the law alone, without the gospel, is the letter, that is, it is the doctrine which merely teaches, demands obedience, denounces the wrath of God and death to such as are disobedient, without producing the spiritual obedience which it requires. But when it is joined with the gospel, which is the Spirit, it also commences to become the Spirit, which is effectual in the godly, inasmuch as those who are regenerated commence willingly and cheerfully to yield obedience to the law. The law, therefore, is the letter, 1. By itself and without the gospel. 2. In respect to those who are unregenerated. On the other hand, the gospel is the Spirit; that is, it is the ministration and means through which the Holy Ghost, which works spiritual obedience in us, is given; not indeed as though all who hear, would receive the Holy Ghost and be regenerated, but because faith, by which our hearts are quickened, so that they begin to yield obedience to the law, is received by it. It does not follow, therefore, that the law is no longer to be taught in the church; for Christ himself says: “I am not come to destroy the law, but to fulfill it.” (Matt. 5:17.) And Paul also says, that we establish the law through faith. (Rom. 3:31.) Christ fulfilled the law in two respects: by obedience and suffering. He was just and holy in himself and did not violate the law in a single instance, but partly performed in our behalf those things which he was not bound to do, and partly sustained the punishment of the law. He also fulfills the law in us in two ways, by teaching it and granting unto us his Spirit, that so we may commence obedience to it, as we proved when speaking of the abrogation of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. George W. Williard (Cincinnati: Elm Street Printing Company, 1888), 616–18.</span></figcaption>

<blockquote><p>At Sinai the covenant became a truly national covenant. The civil life of Israel was linked up with the covenant in such a say that the two could not be separated. In a large measure Church and Sate became one. To be in the Church was to be in the nation, and vice versa; and to leave the Chuch was to leave the nation. There was no spiritual excommunication; the ban meant cutting off by death. The Sinaitic covenant included a service that contained a positive reminder of the strict demands of the covenant of works. The law was placed very much in the foreground, giving prominence once more to the earlier legal element. But the covenant of Sinai was not a renewal of the covenant of works; in it the law was made subservient to the covenant of grace. This is indicated already in the introduction to the ten commandments, Ex. 20:2; Deut. 5:6, and further in Rom. 3:20; Gal. 3:24. It is true that at Sinai a conditional element was added to the covenant, but it was not the salvation of the Israelite but his theocratic standing in the nation, and the enjoyment of external blessings that was made dependent on the keeping of the law, Deut. 28:1-14. The law served a twofold purpose in connection with the covenant of grace: (1) to increase the consciousness of sin, Rom. 3:20; 4:15; Gal. 3:19; and (2) to be a tutor unto Christ, Gal. 3:24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, 4th edn, 298 (emphasis added).</span></figcaption>

<div class="actions"><button class="copy" data-copy="“At Sinai the covenant became a truly national covenant. The civil life of Israel was linked up with the covenant in such a say that the two could not be separated. In a large measure Church and Sate became one. To be in the Church was to be in the nation, and vice versa; and to leave the Chuch was to leave the nation. There was no spiritual excommunication; the ban meant cutting off by death. The Sinaitic covenant included a service that contained a positive reminder of the strict demands of the covenant of works. The law was placed very much in the foreground, giving prominence once more to the earlier legal element. But the covenant of Sinai was not a renewal of the covenant of works; in it the law was made subservient to the covenant of grace. This is indicated already in the introduction to the ten commandments, Ex. 20:2; Deut. 5:6, and further in Rom. 3:20; Gal. 3:24. It is true that at Sinai a conditional element was added to the covenant, but it was not the salvation of the Israelite but his theocratic standing in the nation, and the enjoyment of external blessings that was made dependent on the keeping of the law, Deut. 28:1-14. The law served a twofold purpose in connection with the covenant of grace: (1) to increase the consciousness of sin, Rom. 3:20; 4:15; Gal. 3:19; and (2) to be a tutor unto Christ, Gal. 3:24.”

— Louis Berkhof, Systematic Theology, 4th edn, 298 (emphasis added).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAt+Sinai+the+covenant+became+a+truly+national+covenant.+The+civil+life+of+Israel+was+linked+up+with+the+covenant+in+such+a+say+that+the+two+could+not+be+separated.+In+a+large+measure+Church+and+Sate+became+one.+To+be+in+the+Church+was+to+be+in+the+nation%2C+and+vice+versa%3B+and+to+leave+the+Chuch+was+to+leave+the+nation.+There+was+no+spiritual+excommunication%3B+the+ban+meant+cutting+off+by+death.+The+Sinaitic+covenant+included+a+service+that+contained+a+positive+reminder+of+the+strict+demands+of+the+covenant+of+works.+The+law+was+placed+very+much+in+the+foreground%2C+giving+prominence+once+more+to+the+earlier+legal+element.+But+the+covenant+of+Sinai+was+not+a+renewal+of+the+covenant+of+works%3B+in+it+the+law+was+made+subservient+to+the+covenant+of+grace.+This+is+indicated+already+in+the+introduction+to+the+ten+commandments%2C+Ex.+20%3A2%3B+Deut.+5%3A6%2C+and+further+in+Rom.+3%3A20%3B+Gal.+3%3A24.+It+is+true+that+at+Sinai+a+conditional+element+was+added+to+the+covenant%2C+but+it+was+not+the+salvation+of+the+Israelite+but+his+theocratic+standing+in+the+nation%2C+and+the+enjoyment+of+external+blessings+that+was+made+dependent+on+the+keeping+of+the+law%2C+Deut.+28%3A1-14.+The+law+served+a+twofold+purpose+in+connection+with+the+covenant+of+grace%3A+%281%29+to+increase+the+consciousness+of+sin%2C+Rom.+3%3A20%3B+4%3A15%3B+Gal.+3%3A19%3B+and+%282%29+to+be+a+tutor+unto+Christ%2C+Gal.+3%3A24.%E2%80%9D%0A%0A%E2%80%94+Louis+Berkhof%2C+Systematic+Theology%2C+4th+edn%2C+298+%28emphasis+added%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1e5b3da6f1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1e5b3da6f1.html">Permalink</a><a class="src" href="https://heidelblog.net/2013/11/was-louis-berkhof-a-heretic/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-3a2e559560" data-kw="believer obedience not punishment">
<blockquote><p>In the state of grace, it binds the believer only to obedience, not to punishment because there is no condemnation to those who are in Christ (Rom. 8:1), whose transgressions are forgiven (Ps. 32:1). Rather the question concerns the state of sin—whether in it the sinner is bound to both (which we assert). First, from the twofold condition of sinful man, who is both a creature and a sinful creature. As a creature, he owes to God obedience forever and never can be discharged from it. As a sinner, he owes punishment.</p></blockquote>

<blockquote><p>7. Man may be justified before man, not by man only, but by God also. 8. God also may justify us before man by our formal and inherent righteousness. Thus by sundry means here upon earth He sometimes justifies his children against the sundry calumniations and slanders of wicked men: But more specially He will do it at the Day of Judgment, in the face of the whole world, manifesting not only that righteousness of theirs, which they have in and by Christ; but the inherent innocency, integrity and sincerity of their hearts and ways, so much belied and traduced by the wicked enemies of sanctity and religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bradshaw.html">William Bradshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification… (London: Creede, 1615), ch. 16, sect. 7-8, pp. 92-93 Bradshaw (1571-1618) was an English, congregationalist puritan.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a6e7e6bf5f" data-kw="">
<blockquote><p>the word ‘justify’ has two meanings, the first signifies to absolve anyone from crimes… and to pronounce him just, and is opposed to the word ‘to condemn;’ and this signification is altogether forensic. The other meaning of the word is, that a man is made just from being unjust, as also to be sanctified is, to be made holy from being profane; in which signication the apostle has said, ‘And such were some of you, etc. [1 Cor. 6:11]’, i.e. you have been made, from being unclean, clean, holy from being profane, just from being unjust, by the Holy Ghost, on account of Christ, in whom you believe. To which meaning relates that passage also, which we read in the Revelation, ‘He that is just, let him be justified still more,’ i.e. let him become in truth, from being just, still more just, viz., in the same way as from being unjust, he had been made just. And the Fathers and especially S. Augustine, have interpreted the word in this sense… These are two certain meanings of this word ‘to justify’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>vol. 6, thesis 13, p. 81 [or 84?] in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4</cite>, p. 155</span></figcaption>

</figure><figure class="quote" id="q-c8ef50a25e" data-kw="">
<blockquote><p>2. How many ways does God justify? Four ways especially: (1) By way of Constitution. (2) Estimation. (3) Sentence, and (4) Execution. 1. Constitutively, by his Gospel-grant, or the New Covenant in the blood of Christ. The Covenant of grace is God’s pardoning act, and instrument by which we know whom, and upon what Terms God will pardon and justify; namely, all such as repent and believe the Gospel. We are constituted just and righteous, and exempted from the curse and penalties of the law. We may know the true way of justification by its opposition to the false or pretended way, Acts 13:38-39: ‘Through this man is preached unto you the forgiveness of sins; and by Him all that believe are justified from all those things from which they could not be justified by the law of Moses.’ The Jews expected to be justified by the law of Moses; but we are justified by the law of Christ, that is, this constitutes our right; and herein justification and sanctification differ: God sanctifies by his Spirit, but justifies by the sentence of his word, or promise of the Gospel. Our right immediately results thence, as by an act of indemnity we are freed from all the penalties which otherwise we might incur without any further act of the magistrate. We are constituted righteous by his deed of gift in the Gospel, but made holy by his Spirit; but if any quarrel at this term, and say that God by the New Covenant does declare who are justifiable, but does not justify, I answer further, we are justified: 2. By way of Estimation, whereby God does determine our right, accept or deem, and account them righteous, who fulfil the terms of the Gospel, and actually convey to them the fruits of Christ’s death: This is spoken of, 1 Cor. 6:11, ‘And such were some of you: but ye are washed, but ye are sanctified, but ye are justified;’ once vile sinners, now washed, sanctified and justified: as soon as they believe, they are put into a state of acceptation [Greek], that is, justifying, He continues to justify them unto the death, and He keeps them in that estate wherein they have exemption from the punishment of sin and a right to eternal life. 3. By way of Sentence. This is in part done here, when God interprets our righteousness and sincerity, Job 33:23-24: ‘If there be a messenger with him, an interpreter, one among a thousand, to show unto man his uprightness; then he is gracious unto him, and says, Deliver him from going down to the pit; I have found a ransom.’ And does by the Spirit of adoption assure us more and more of the pardon of our sins: but more solemnly at the Last Day, when the Judge does, sitting upon the throne, pronounce and declare us righteous before all the world, and as those who are accepted unto life, Acts 3:19, ‘That your sins may be blotted out, when the times of refreshing shall come from the presence of the Lord.’ Then the sentence is solemnly pronounced by the Judge sitting on the throne; and we are justified before God, men and angels. There are two parts of judgment, to condemn, and to absolve or justify: Mt. 12:36-37: ‘But I say unto you that for every idle word that a man shall speak, he shall give account thereof at the Day of Judgment; for by thy words thou shalt be justified, and by thy words thou shalt be condemned;’ then every man’s doom [verdict] shall be pronounced. 4. By way of Execution, when the sentence is executed. This is in part done here, as God takes off the penalties and fruits of sin, either in the way of his internal or external government, and gives us many blessings, as the pledge of his love, and above all, the gift of the Holy Spirit, whereby He sanctifies us more thoroughly, and works in us that which is pleasing in his sight: This He gives as the God of peace, as reconciled to us in Christ, Heb. 13:20-21: ‘Now the God of peace that brought again from the dead our Lord Jesus, that great shepherd of the sheep, through the blood of the everlasting Covenant, make you perfect in every good work, to do his will, working in you that which is pleasing in his sight, through Jesus Christ.’ 1 Thess. 5:23: ‘And the very God of peace sanctify you wholly: and I pray God your whole spirit, and soul, and body, be preserved blameless unto the coming of our Lord Jesus Christ;’ Faithful is he that calls you, who will do it: but more fully at the Last Day, when we enter into everlasting glory; and the wicked are turned into Hell with the Devil and his angels, Mt. 25:46, ‘And these shall go into everlasting punishment; but the righteous into life eternal’: then is the full and final execution, a perfect freedom from all misery, and a possession of all happiness. 3. How it can stand with the wisdom, justice and holiness of God to justify a sinner? ‘Tis a great crime to take the unrighteous to be righteous; and to pronounce the wicked justified, seems to be against the Word of God, Prov. 24:24, ‘He that saith unto the wicked, ‘Thou art righteous,’ him shall the people curse; nations shall abhor him.’ Prov. 17:15, ‘He that justifieth the wicked, and he that condemneth the just, even they both are an abomination unto the Lord.’ Now what is an abomination unto the Lord is surely contrary to his nature, Ex. 34:7, ‘He will by no means clear the guilty.’ Answer: … 3. Effectual calling, or the conversion of man, reconciles it with his holiness; for a sinner, as a sinner, is not justified, but a penitent believer [is]: ’tis true ’tis said, ‘God justifieth the ungodly,’ Rom. 4:5: those that were once so, but not those that continue so; certainly He sanctifies before he justifies, Acts 26:18: ‘To open their eyes, and turn them from darkness to light, and from the power of Satan to God, that they may receive forgiveness of sins, and inheritance among them that are sanctified, by faith that is in Me;’ and in many other places. No man is freed from the guilt of sin, which renders us obnoxious to God’s wrath, who is not freed from the filth of sin, which taints our faculties; for Christ is made to us both righteousness and sanctification, 1 Cor. 1:30. By losing God’s image, we lost his favor; and in the order wherein we lost it, we recover it. God regenerates that He may pardon and justify, and restores first our holiness and then our happiness: ’tis not consistent with God’s holiness to give us pardon and let us alone in our sins. A man would not put a toad in his bosom. But more fully to give you a prospect into this matter, let us take notice of the several things which are mentioned in Scripture, as belonging to our justification: as for instance: Sometimes we are said to be justified by grace, as Rom. 3:24, ‘Being justified freely by his grace’: sometimes by the blood of Christ, as Rom. 5:9, ‘Being justified by his blood, we shall be saved from wrath through Him’: sometimes by faith, as Rom. 5:1, ‘Being justified by faith, we have peace with God through our Lord Jesus Christ’: sometimes by works, James 2:24, ‘Ye see then how that by works a man is justified, and not by faith only.’ All these things concur to our justification and do not contradict, but imply one another: The first moving cause of all is grace; the meritorious cause, is Christ’s blood: the means of applying, or the condition on our part upon which we are capable at first of receiving so great a privilege, is faith: and the means of continuing in our justified estate is by good works, or new obedience. I say, our first actual pardon, justification and right to life is given upon condition of our first faith and repentance; but this estate is continued to us both by faith, Rom. 1:17, and new obedience; these fairly accord. The grace of God will do nothing without the intervention of Christ’s merits; and Christ’s merits do not profit us ’till it be applied by faith; and sound believers will live in a course of new obedience. Let us consider them severally: 1. The first moving cause that inclined God to shew us mercy, in our undone and lost estate, was meerly his grace… 2. We are justified by the blood of Christ… 3. We are justified by faith, Acts 13:39, ‘And by him all that believe are justified from all things from which ye could not be justified by the law of Moses’: certainly none are justified in a state of impenitency and unbelief; ’tis not enough to look to the first moving cause, the grace of God, or the impetration of it by the blood of Christ, but how it is applied to ourselves and what right we have. For the righteousness of Christ is none of ours, till we do repent and believe: let us see how our title does arise, when we thankfully, seriously and broken-heartedly accept Christ as our Lord and Savior, then we are found in Him not having our own righteousness. 4. We are justified by works, and not by faith only; by which are meant the fruits of sanctification: for true faith and true holiness will show itself by good works; faith gives us the first right, but works continue it, for otherwise a course of sin would put us into a state of damnation again: therefore at the Last Judgment these are considered, Rev. 20:12, ‘And the dead were judged out of those things which were written in the books, according to their works.’ Mt. 25:35-36: ‘For I was an hungry, and ye gave me meat; I was thirsty, and ye gave me drink; I was a stranger, and ye took me in; naked, and ye cloathed me; I was sick, and ye visited me; I was in prison, and ye came unto me.’ Faith is our consent, but obedience verifies it, or is our performance of what we consented unto; the one as covenant-making, the other as covenant-keeping; we are admitted by covenant-making, but continued in our privileges by covenant-keeping, Ps. 25:10, ‘All the paths of the Lord are mercy and truth unto such as keep his Covenant.’ But yet a little more must be said to reconcile the two apostles. Paul says, ‘A man is justified by faith, without the deeds of the law,’ Rom. 3:28, and James says, ch. 2:24, ‘Ye see then how by works a man is justified, and not by faith only.’ There is a twofold charge commenced against us, [1] as sinners, and breakers of the Law; [2] as hypocrites and unsound believers. To the first we have nothing but the merits of Christ to plead; to the second, a fruitful obedience; or else, Paul in the opposition between works and faith, means by works, legal observances; by faith true Christianity [inclusive of it working]. The Jews boasted of their legal observances, to the rejection of the faith of Christ; and James by faith, [meant] a dead faith; and by works, [he meant] Christian duties, or acts of obedience to God; not external observances of the law of man.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. How many ways does God justify? Four ways especially: (1) By way of Constitution. (2) Estimation. (3) Sentence, and (4) Execution. 1. Constitutively, by his Gospel-grant, or the New Covenant in the blood of Christ. The Covenant of grace is God’s pardoning act, and instrument by which we know whom, and upon what Terms God will pardon and justify; namely, all such as repent and believe the Gospel. We are constituted just and righteous, and exempted from the curse and penalties of the law. We may know the true way of justification by its opposition to the false or pretended way, Acts 13:38-39: ‘Through this man is preached unto you the forgiveness of sins; and by Him all that believe are justified from all those things from which they could not be justified by the law of Moses.’ The Jews expected to be justified by the law of Moses; but we are justified by the law of Christ, that is, this constitutes our right; and herein justification and sanctification differ: God sanctifies by his Spirit, but justifies by the sentence of his word, or promise of the Gospel. Our right immediately results thence, as by an act of indemnity we are freed from all the penalties which otherwise we might incur without any further act of the magistrate. We are constituted righteous by his deed of gift in the Gospel, but made holy by his Spirit; but if any quarrel at this term, and say that God by the New Covenant does declare who are justifiable, but does not justify, I answer further, we are justified: 2. By way of Estimation, whereby God does determine our right, accept or deem, and account them righteous, who fulfil the terms of the Gospel, and actually convey to them the fruits of Christ’s death: This is spoken of, 1 Cor. 6:11, ‘And such were some of you: but ye are washed, but ye are sanctified, but ye are justified;’ once vile sinners, now washed, sanctified and justified: as soon as they believe, they are put into a state of acceptation [Greek], that is, justifying, He continues to justify them unto the death, and He keeps them in that estate wherein they have exemption from the punishment of sin and a right to eternal life. 3. By way of Sentence. This is in part done here, when God interprets our righteousness and sincerity, Job 33:23-24: ‘If there be a messenger with him, an interpreter, one among a thousand, to show unto man his uprightness; then he is gracious unto him, and says, Deliver him from going down to the pit; I have found a ransom.’ And does by the Spirit of adoption assure us more and more of the pardon of our sins: but more solemnly at the Last Day, when the Judge does, sitting upon the throne, pronounce and declare us righteous before all the world, and as those who are accepted unto life, Acts 3:19, ‘That your sins may be blotted out, when the times of refreshing shall come from the presence of the Lord.’ Then the sentence is solemnly pronounced by the Judge sitting on the throne; and we are justified before God, men and angels. There are two parts of judgment, to condemn, and to absolve or justify: Mt. 12:36-37: ‘But I say unto you that for every idle word that a man shall speak, he shall give account thereof at the Day of Judgment; for by thy words thou shalt be justified, and by thy words thou shalt be condemned;’ then every man’s doom [verdict] shall be pronounced. 4. By way of Execution, when the sentence is executed. This is in part done here, as God takes off the penalties and fruits of sin, either in the way of his internal or external government, and gives us many blessings, as the pledge of his love, and above all, the gift of the Holy Spirit, whereby He sanctifies us more thoroughly, and works in us that which is pleasing in his sight: This He gives as the God of peace, as reconciled to us in Christ, Heb. 13:20-21: ‘Now the God of peace that brought again from the dead our Lord Jesus, that great shepherd of the sheep, through the blood of the everlasting Covenant, make you perfect in every good work, to do his will, working in you that which is pleasing in his sight, through Jesus Christ.’ 1 Thess. 5:23: ‘And the very God of peace sanctify you wholly: and I pray God your whole spirit, and soul, and body, be preserved blameless unto the coming of our Lord Jesus Christ;’ Faithful is he that calls you, who will do it: but more fully at the Last Day, when we enter into everlasting glory; and the wicked are turned into Hell with the Devil and his angels, Mt. 25:46, ‘And these shall go into everlasting punishment; but the righteous into life eternal’: then is the full and final execution, a perfect freedom from all misery, and a possession of all happiness. 3. How it can stand with the wisdom, justice and holiness of God to justify a sinner? ‘Tis a great crime to take the unrighteous to be righteous; and to pronounce the wicked justified, seems to be against the Word of God, Prov. 24:24, ‘He that saith unto the wicked, ‘Thou art righteous,’ him shall the people curse; nations shall abhor him.’ Prov. 17:15, ‘He that justifieth the wicked, and he that condemneth the just, even they both are an abomination unto the Lord.’ Now what is an abomination unto the Lord is surely contrary to his nature, Ex. 34:7, ‘He will by no means clear the guilty.’ Answer: … 3. Effectual calling, or the conversion of man, reconciles it with his holiness; for a sinner, as a sinner, is not justified, but a penitent believer [is]: ’tis true ’tis said, ‘God justifieth the ungodly,’ Rom. 4:5: those that were once so, but not those that continue so; certainly He sanctifies before he justifies, Acts 26:18: ‘To open their eyes, and turn them from darkness to light, and from the power of Satan to God, that they may receive forgiveness of sins, and inheritance among them that are sanctified, by faith that is in Me;’ and in many other places. No man is freed from the guilt of sin, which renders us obnoxious to God’s wrath, who is not freed from the filth of sin, which taints our faculties; for Christ is made to us both righteousness and sanctification, 1 Cor. 1:30. By losing God’s image, we lost his favor; and in the order wherein we lost it, we recover it. God regenerates that He may pardon and justify, and restores first our holiness and then our happiness: ’tis not consistent with God’s holiness to give us pardon and let us alone in our sins. A man would not put a toad in his bosom. But more fully to give you a prospect into this matter, let us take notice of the several things which are mentioned in Scripture, as belonging to our justification: as for instance: Sometimes we are said to be justified by grace, as Rom. 3:24, ‘Being justified freely by his grace’: sometimes by the blood of Christ, as Rom. 5:9, ‘Being justified by his blood, we shall be saved from wrath through Him’: sometimes by faith, as Rom. 5:1, ‘Being justified by faith, we have peace with God through our Lord Jesus Christ’: sometimes by works, James 2:24, ‘Ye see then how that by works a man is justified, and not by faith only.’ All these things concur to our justification and do not contradict, but imply one another: The first moving cause of all is grace; the meritorious cause, is Christ’s blood: the means of applying, or the condition on our part upon which we are capable at first of receiving so great a privilege, is faith: and the means of continuing in our justified estate is by good works, or new obedience. I say, our first actual pardon, justification and right to life is given upon condition of our first faith and repentance; but this estate is continued to us both by faith, Rom. 1:17, and new obedience; these fairly accord. The grace of God will do nothing without the intervention of Christ’s merits; and Christ’s merits do not profit us ’till it be applied by faith; and sound believers will live in a course of new obedience. Let us consider them severally: 1. The first moving cause that inclined God to shew us mercy, in our undone and lost estate, was meerly his grace… 2. We are justified by the blood of Christ… 3. We are justified by faith, Acts 13:39, ‘And by him all that believe are justified from all things from which ye could not be justified by the law of Moses’: certainly none are justified in a state of impenitency and unbelief; ’tis not enough to look to the first moving cause, the grace of God, or the impetration of it by the blood of Christ, but how it is applied to ourselves and what right we have. For the righteousness of Christ is none of ours, till we do repent and believe: let us see how our title does arise, when we thankfully, seriously and broken-heartedly accept Christ as our Lord and Savior, then we are found in Him not having our own righteousness. 4. We are justified by works, and not by faith only; by which are meant the fruits of sanctification: for true faith and true holiness will show itself by good works; faith gives us the first right, but works continue it, for otherwise a course of sin would put us into a state of damnation again: therefore at the Last Judgment these are considered, Rev. 20:12, ‘And the dead were judged out of those things which were written in the books, according to their works.’ Mt. 25:35-36: ‘For I was an hungry, and ye gave me meat; I was thirsty, and ye gave me drink; I was a stranger, and ye took me in; naked, and ye cloathed me; I was sick, and ye visited me; I was in prison, and ye came unto me.’ Faith is our consent, but obedience verifies it, or is our performance of what we consented unto; the one as covenant-making, the other as covenant-keeping; we are admitted by covenant-making, but continued in our privileges by covenant-keeping, Ps. 25:10, ‘All the paths of the Lord are mercy and truth unto such as keep his Covenant.’ But yet a little more must be said to reconcile the two apostles. Paul says, ‘A man is justified by faith, without the deeds of the law,’ Rom. 3:28, and James says, ch. 2:24, ‘Ye see then how by works a man is justified, and not by faith only.’ There is a twofold charge commenced against us, [1] as sinners, and breakers of the Law; [2] as hypocrites and unsound believers. To the first we have nothing but the merits of Christ to plead; to the second, a fruitful obedience; or else, Paul in the opposition between works and faith, means by works, legal observances; by faith true Christianity [inclusive of it working]. The Jews boasted of their legal observances, to the rejection of the faith of Christ; and James by faith, [meant] a dead faith; and by works, [he meant] Christian duties, or acts of obedience to God; not external observances of the law of man.”

— Thomas Manton, A Second Volume of Sermons… (d. 1677; London: Astwood, 1684) | Sermons on Rom. 8, Sermon 43, on Rom. 8:33, pp. 333-36">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+How+many+ways+does+God+justify%3F+Four+ways+especially%3A+%281%29+By+way+of+Constitution.+%282%29+Estimation.+%283%29+Sentence%2C+and+%284%29+Execution.+1.+Constitutively%2C+by+his+Gospel-grant%2C+or+the+New+Covenant+in+the+blood+of+Christ.+The+Covenant+of+grace+is+God%E2%80%99s+pardoning+act%2C+and+instrument+by+which+we+know+whom%2C+and+upon+what+Terms+God+will+pardon+and+justify%3B+namely%2C+all+such+as+repent+and+believe+the+Gospel.+We+are+constituted+just+and+righteous%2C+and+exempted+from+the+curse+and+penalties+of+the+law.+We+may+know+the+true+way+of+justification+by+its+opposition+to+the+false+or+pretended+way%2C+Acts+13%3A38-39%3A+%E2%80%98Through+this+man+is+preached+unto+you+the+forgiveness+of+sins%3B+and+by+Him+all+that+believe+are+justified+from+all+those+things+from+which+they+could+not+be+justified+by+the+law+of+Moses.%E2%80%99+The+Jews+expected+to+be+justified+by+the+law+of+Moses%3B+but+we+are+justified+by+the+law+of+Christ%2C+that+is%2C+this+constitutes+our+right%3B+and+herein+justification+and+sanctification+differ%3A+God+sanctifies+by+his+Spirit%2C+but+justifies+by+the+sentence+of+his+word%2C+or+promise+of+the+Gospel.+Our+right+immediately+results+thence%2C+as+by+an+act+of+indemnity+we+are+freed+from+all+the+penalties+which+otherwise+we+might+incur+without+any+further+act+of+the+magistrate.+We+are+constituted+righteous+by+his+deed+of+gift+in+the+Gospel%2C+but+made+holy+by+his+Spirit%3B+but+if+any+quarrel+at+this+term%2C+and+say+that+God+by+the+New+Covenant+does+declare+who+are+justifiable%2C+but+does+not+justify%2C+I+answer+further%2C+we+are+justified%3A+2.+By+way+of+Estimation%2C+whereby+God+does+determine+our+right%2C+accept+or+deem%2C+and+account+them+righteous%2C+who+fulfil+the+terms+of+the+Gospel%2C+and+actually+convey+to+them+the+fruits+of+Christ%E2%80%99s+death%3A+This+is+spoken+of%2C+1+Cor.+6%3A11%2C+%E2%80%98And+such+were+some+of+you%3A+but+ye+are+washed%2C+but+ye+are+sanctified%2C+but+ye+are+justified%3B%E2%80%99+once+vile+sinners%2C+now+washed%2C+sanctified+and+justified%3A+as+soon+as+they+believe%2C+they+are+put+into+a+state+of+acceptation+%5BGreek%5D%2C+that+is%2C+justifying%2C+He+continues+to+justify+them+unto+the+death%2C+and+He+keeps+them+in+that+estate+wherein+they+have+exemption+from+the+punishment+of+sin+and+a+right+to+eternal+life.+3.+By+way+of+Sentence.+This+is+in+part+done+here%2C+when+God+interprets+our+righteousness+and+sincerity%2C+Job+33%3A23-24%3A+%E2%80%98If+there+be+a+messenger+with+him%2C+an+interpreter%2C+one+among+a+thousand%2C+to+show+unto+man+his+uprightness%3B+then+he+is+gracious+unto+him%2C+and+says%2C+Deliver+him+from+going+down+to+the+pit%3B+I+have+found+a+ransom.%E2%80%99+And+does+by+the+Spirit+of+adoption+assure+us+more+and+more+of+the+pardon+of+our+sins%3A+but+more+solemnly+at+the+Last+Day%2C+when+the+Judge+does%2C+sitting+upon+the+throne%2C+pronounce+and+declare+us+righteous+before+all+the+world%2C+and+as+those+who+are+accepted+unto+life%2C+Acts+3%3A19%2C+%E2%80%98That+your+sins+may+be+blotted+out%2C+when+the+times+of+refreshing+shall+come+from+the+presence+of+the+Lord.%E2%80%99+Then+the+sentence+is+solemnly+pronounced+by+the+Judge+sitting+on+the+throne%3B+and+we+are+justified+before+God%2C+men+and+angels.+There+are+two+parts+of+judgment%2C+to+condemn%2C+and+to+absolve+or+justify%3A+Mt.+12%3A36-37%3A+%E2%80%98But+I+say+unto+you+that+for+every+idle+word+that+a+man+shall+speak%2C+he+shall+give+account+thereof+at+the+Day+of+Judgment%3B+for+by+thy+words+thou+shalt+be+justified%2C+and+by+thy+words+thou+shalt+be+condemned%3B%E2%80%99+then+every+man%E2%80%99s+doom+%5Bverdict%5D+shall+be+pronounced.+4.+By+way+of+Execution%2C+when+the+sentence+is+executed.+This+is+in+part+done+here%2C+as+God+takes+off+the+penalties+and+fruits+of+sin%2C+either+in+the+way+of+his+internal+or+external+government%2C+and+gives+us+many+blessings%2C+as+the+pledge+of+his+love%2C+and+above+all%2C+the+gift+of+the+Holy+Spirit%2C+whereby+He+sanctifies+us+more+thoroughly%2C+and+works+in+us+that+which+is+pleasing+in+his+sight%3A+This+He+gives+as+the+God+of+peace%2C+as+reconciled+to+us+in+Christ%2C+Heb.+13%3A20-21%3A+%E2%80%98Now+the+God+of+peace+that+brought+again+from+the+dead+our+Lord+Jesus%2C+that+great+shepherd+of+the+sheep%2C+through+the+blood+of+the+everlasting+Covenant%2C+make+you+perfect+in+every+good+work%2C+to+do+his+will%2C+working+in+you+that+which+is+pleasing+in+his+sight%2C+through+Jesus+Christ.%E2%80%99+1+Thess.+5%3A23%3A+%E2%80%98And+the+very+God+of+peace+sanctify+you+wholly%3A+and+I+pray+God+your+whole+spirit%2C+and+soul%2C+and+body%2C+be+preserved+blameless+unto+the+coming+of+our+Lord+Jesus+Christ%3B%E2%80%99+Faithful+is+he+that+calls+you%2C+who+will+do+it%3A+but+more+fully+at+the+Last+Day%2C+when+we+enter+into+everlasting+glory%3B+and+the+wicked+are+turned+into+Hell+with+the+Devil+and+his+angels%2C+Mt.+25%3A46%2C+%E2%80%98And+these+shall+go+into+everlasting+punishment%3B+but+the+righteous+into+life+eternal%E2%80%99%3A+then+is+the+full+and+final+execution%2C+a+perfect+freedom+from+all+misery%2C+and+a+possession+of+all+happiness.+3.+How+it+can+stand+with+the+wisdom%2C+justice+and+holiness+of+God+to+justify+a+sinner%3F+%E2%80%98Tis+a+great+crime+to+take+the+unrighteous+to+be+righteous%3B+and+to+pronounce+the+wicked+justified%2C+seems+to+be+against+the+Word+of+God%2C+Prov.+24%3A24%2C+%E2%80%98He+that+saith+unto+the+wicked%2C+%E2%80%98Thou+art+righteous%2C%E2%80%99+him+shall+the+people+curse%3B+nations+shall+abhor+him.%E2%80%99+Prov.+17%3A15%2C+%E2%80%98He+that+justifieth+the+wicked%2C+and+he+that+condemneth+the+just%2C+even+they+both+are+an+abomination+unto+the+Lord.%E2%80%99+Now+what+is+an+abomination+unto+the+Lord+is+surely+contrary+to+his+nature%2C+Ex.+34%3A7%2C+%E2%80%98He+will+by+no+means+clear+the+guilty.%E2%80%99+Answer%3A+%E2%80%A6+3.+Effectual+calling%2C+or+the+conversion+of+man%2C+reconciles+it+with+his+holiness%3B+for+a+sinner%2C+as+a+sinner%2C+is+not+justified%2C+but+a+penitent+believer+%5Bis%5D%3A+%E2%80%99tis+true+%E2%80%99tis+said%2C+%E2%80%98God+justifieth+the+ungodly%2C%E2%80%99+Rom.+4%3A5%3A+those+that+were+once+so%2C+but+not+those+that+continue+so%3B+certainly+He+sanctifies+before+he+justifies%2C+Acts+26%3A18%3A+%E2%80%98To+open+their+eyes%2C+and+turn+them+from+darkness+to+light%2C+and+from+the+power+of+Satan+to+God%2C+that+they+may+receive+forgiveness+of+sins%2C+and+inheritance+among+them+that+are+sanctified%2C+by+faith+that+is+in+Me%3B%E2%80%99+and+in+many+other+places.+No+man+is+freed+from+the+guilt+of+sin%2C+which+renders+us+obnoxious+to+God%E2%80%99s+wrath%2C+who+is+not+freed+from+the+filth+of+sin%2C+which+taints+our+faculties%3B+for+Christ+is+made+to+us+both+righteousness+and+sanctification%2C+1+Cor.+1%3A30.+By+losing+God%E2%80%99s+image%2C+we+lost+his+favor%3B+and+in+the+order+wherein+we+lost+it%2C+we+recover+it.+God+regenerates+that+He+may+pardon+and+justify%2C+and+restores+first+our+holiness+and+then+our+happiness%3A+%E2%80%99tis+not+consistent+with+God%E2%80%99s+holiness+to+give+us+pardon+and+let+us+alone+in+our+sins.+A+man+would+not+put+a+toad+in+his+bosom.+But+more+fully+to+give+you+a+prospect+into+this+matter%2C+let+us+take+notice+of+the+several+things+which+are+mentioned+in+Scripture%2C+as+belonging+to+our+justification%3A+as+for+instance%3A+Sometimes+we+are+said+to+be+justified+by+grace%2C+as+Rom.+3%3A24%2C+%E2%80%98Being+justified+freely+by+his+grace%E2%80%99%3A+sometimes+by+the+blood+of+Christ%2C+as+Rom.+5%3A9%2C+%E2%80%98Being+justified+by+his+blood%2C+we+shall+be+saved+from+wrath+through+Him%E2%80%99%3A+sometimes+by+faith%2C+as+Rom.+5%3A1%2C+%E2%80%98Being+justified+by+faith%2C+we+have+peace+with+God+through+our+Lord+Jesus+Christ%E2%80%99%3A+sometimes+by+works%2C+James+2%3A24%2C+%E2%80%98Ye+see+then+how+that+by+works+a+man+is+justified%2C+and+not+by+faith+only.%E2%80%99+All+these+things+concur+to+our+justification+and+do+not+contradict%2C+but+imply+one+another%3A+The+first+moving+cause+of+all+is+grace%3B+the+meritorious+cause%2C+is+Christ%E2%80%99s+blood%3A+the+means+of+applying%2C+or+the+condition+on+our+part+upon+which+we+are+capable+at+first+of+receiving+so+great+a+privilege%2C+is+faith%3A+and+the+means+of+continuing+in+our+justified+estate+is+by+good+works%2C+or+new+obedience.+I+say%2C+our+first+actual+pardon%2C+justification+and+right+to+life+is+given+upon+condition+of+our+first+faith+and+repentance%3B+but+this+estate+is+continued+to+us+both+by+faith%2C+Rom.+1%3A17%2C+and+new+obedience%3B+these+fairly+accord.+The+grace+of+God+will+do+nothing+without+the+intervention+of+Christ%E2%80%99s+merits%3B+and+Christ%E2%80%99s+merits+do+not+profit+us+%E2%80%99till+it+be+applied+by+faith%3B+and+sound+believers+will+live+in+a+course+of+new+obedience.+Let+us+consider+them+severally%3A+1.+The+first+moving+cause+that+inclined+God+to+shew+us+mercy%2C+in+our+undone+and+lost+estate%2C+was+meerly+his+grace%E2%80%A6+2.+We+are+justified+by+the+blood+of+Christ%E2%80%A6+3.+We+are+justified+by+faith%2C+Acts+13%3A39%2C+%E2%80%98And+by+him+all+that+believe+are+justified+from+all+things+from+which+ye+could+not+be+justified+by+the+law+of+Moses%E2%80%99%3A+certainly+none+are+justified+in+a+state+of+impenitency+and+unbelief%3B+%E2%80%99tis+not+enough+to+look+to+the+first+moving+cause%2C+the+grace+of+God%2C+or+the+impetration+of+it+by+the+blood+of+Christ%2C+but+how+it+is+applied+to+ourselves+and+what+right+we+have.+For+the+righteousness+of+Christ+is+none+of+ours%2C+till+we+do+repent+and+believe%3A+let+us+see+how+our+title+does+arise%2C+when+we+thankfully%2C+seriously+and+broken-heartedly+accept+Christ+as+our+Lord+and+Savior%2C+then+we+are+found+in+Him+not+having+our+own+righteousness.+4.+We+are+justified+by+works%2C+and+not+by+faith+only%3B+by+which+are+meant+the+fruits+of+sanctification%3A+for+true+faith+and+true+holiness+will+show+itself+by+good+works%3B+faith+gives+us+the+first+right%2C+but+works+continue+it%2C+for+otherwise+a+course+of+sin+would+put+us+into+a+state+of+damnation+again%3A+therefore+at+the+Last+Judgment+these+are+considered%2C+Rev.+20%3A12%2C+%E2%80%98And+the+dead+were+judged+out+of+those+things+which+were+written+in+the+books%2C+according+to+their+works.%E2%80%99+Mt.+25%3A35-36%3A+%E2%80%98For+I+was+an+hungry%2C+and+ye+gave+me+meat%3B+I+was+thirsty%2C+and+ye+gave+me+drink%3B+I+was+a+stranger%2C+and+ye+took+me+in%3B+naked%2C+and+ye+cloathed+me%3B+I+was+sick%2C+and+ye+visited+me%3B+I+was+in+prison%2C+and+ye+came+unto+me.%E2%80%99+Faith+is+our+consent%2C+but+obedience+verifies+it%2C+or+is+our+performance+of+what+we+consented+unto%3B+the+one+as+covenant-making%2C+the+other+as+covenant-keeping%3B+we+are+admitted+by+covenant-making%2C+but+continued+in+our+privileges+by+covenant-keeping%2C+Ps.+25%3A10%2C+%E2%80%98All+the+paths+of+the+Lord+are+mercy+and+truth+unto+such+as+keep+his+Covenant.%E2%80%99+But+yet+a+little+more+must+be+said+to+reconcile+the+two+apostles.+Paul+says%2C+%E2%80%98A+man+is+justified+by+faith%2C+without+the+deeds+of+the+law%2C%E2%80%99+Rom.+3%3A28%2C+and+James+says%2C+ch.+2%3A24%2C+%E2%80%98Ye+see+then+how+by+works+a+man+is+justified%2C+and+not+by+faith+only.%E2%80%99+There+is+a+twofold+charge+commenced+against+us%2C+%5B1%5D+as+sinners%2C+and+breakers+of+the+Law%3B+%5B2%5D+as+hypocrites+and+unsound+believers.+To+the+first+we+have+nothing+but+the+merits+of+Christ+to+plead%3B+to+the+second%2C+a+fruitful+obedience%3B+or+else%2C+Paul+in+the+opposition+between+works+and+faith%2C+means+by+works%2C+legal+observances%3B+by+faith+true+Christianity+%5Binclusive+of+it+working%5D.+The+Jews+boasted+of+their+legal+observances%2C+to+the+rejection+of+the+faith+of+Christ%3B+and+James+by+faith%2C+%5Bmeant%5D+a+dead+faith%3B+and+by+works%2C+%5Bhe+meant%5D+Christian+duties%2C+or+acts+of+obedience+to+God%3B+not+external+observances+of+the+law+of+man.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Second+Volume+of+Sermons%E2%80%A6+%28d.+1677%3B+London%3A+Astwood%2C+1684%29+%7C+Sermons+on+Rom.+8%2C+Sermon+43%2C+on+Rom.+8%3A33%2C+pp.+333-36&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc8ef50a25e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c8ef50a25e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=2.%20How%20many%20ways%20does%20God,observances%20of%20the%20law%20of%20man&amp;text=2.%20How%20many%20ways%20does%20God%20justify%3F%20Four&amp;text=not%20external%20observances%20of%20the%20law%20of%20man" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>At this point it may be asked whether justification is perfectly completed in this life? Let me say in response to this, first of all, that God’s benefits to us in Christ fall into two categories. One category includes benefits that are not inherent in man, such as his eternal predestination, his justification, and his adoption. The other includes benefits that are inherent in man, such as his effectual calling and his glorification. The benefits included in these two categories have this in common, that none of them—not predestination, not justification, not adoption, not effectual calling, not glorification—will be fully manifested and revealed until Christ’s own manifestation is full and perfect. Indeed, the revelation of these things in man has a beginning in the first manifestation of Christ Himself. Thus the apostle writes in Rom. 3:21, “but now the righteousness of God is revealed, etc.” But the revelation of them in believers is not yet full. Thus 1 Jn. 3:2: “We are already sons of God, but it has not yet appeared what we will be.</p></blockquote>

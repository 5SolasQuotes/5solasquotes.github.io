<main class="wrap"><figure class="quote" id="q-edae9b0d42" data-kw="">
<blockquote><p>But a woman in no case is capable of administrating baptism or the Lord’s Supper, except she were extraordinarily and immediately inspired to be a prophetess… 2. There is no such moral necessity of the sacraments as there is of the ministry of the Word, and consequently of some use of the keys where a scandalous person may infect the Lord’s flock. For where vision ceases the people perish, but it is never said, where baptism ceases the people perish; and therefore uncalled ministers in case of necessity, without ordination or calling from a presbytery, may preach and take on them the holy ministry and exercise power of jurisdiction, because the necessity of the souls of a congregation in a remote island requires so, but I hope no necessity in any [of] the most extraordinary case requires that a midwife may baptize, or that a private man remaining a private man may celebrate the Lord’s Supper to the Church without any calling from the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, pp. 454-455</span></figcaption>

<blockquote><p>The apostles have preached the Gospel to us from the Lord Jesus Christ; Jesus Christ [has done so] from God. Christ therefore was sent forth by God, and the apostles by Christ. Both these appointments, then, were made in an orderly way, according to the will of God. Having therefore received their orders, and being fully assured by the resurrection of our Lord Jesus Christ, and established in the Word of God, with full assurance of the Holy Ghost, they went forth proclaiming that the kingdom of God was at hand. And thus preaching through countries and cities, they appointed the firstfruits [of their labours], having first proved them by the Spirit, to be bishops and deacons of those who should afterwards believe. Nor was this any new thing, since indeed many ages before it was written concerning bishops and deacons. For thus saith the Scripture in a certain place, ‘I will appoint their bishops in righteousness, and their deacons in faith.’ [Isa. 60:17 LXX]</p></blockquote>

<blockquote><p>2. And as to the last edition of the Covenant of Grace by Christ [in the New Testament]: 1. The tenor of it extends to all; as is visible Mt. 28:19; Mk. 16:16; Jn. 3:16. 2. And Christ has made it the office of his ministers by his commission to promulgate and offer it to all. 3. And whereas providence concurs not to the universal execution, we must all confess, that Christ came not to put the world into a worse condition than He found them in. If He did any no good by his incarnation, He would do them no harm. Therefore they that never hear the Gospel, are still under the first edition of the Covenant made with Adam and Noah, so far as it is unaltered. I add that word [“so far as it is unaltered”], because, that so far as the promise was to give salvation by the Messiah hereafter to be incarnate, none is now bound to expect his future incarnation, because it is past. But the same benefits that were due to believers before Christs incarnation, are due since upon the true performance of so much of the condition as is still in force, and not repealed. … 4. And also, that more was required then, to be known particularly by the Jews that had the Scripture and tradition to acquaint them with the Messiah to come, than of the rest of the world, that had not those distinct discoveries, nor Abraham’s promises made known unto them: And how much Gen. 3:15 might cause them to understand, we may conjecture by the words. At least this much was required of all, that they believe that their sin deserves punishment and misery, and yet that God of his abundant mercy, by his wisdom securing his truth and justice, will pardon sin and grant salvation to all that truly believe and trust in that his wisdom and mercy, and repent of their sins, and unfeignedly give up themselves to God as their merciful Redeemer. Thus far we are agreed about the grace of the Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology</cite>, … (1675), Preface, pp. 5-6</span></figcaption>

</figure><figure class="quote" id="q-fdea1702b8" data-kw="">
<blockquote><p>Your next exception against the presbytery is for their expectants, these be the sons of the prophers, who in their preparations for the ministry, at their first exercises for assay and trial are heard in the presbytery; with this practise no reasonable man can find fault; it is naturally impossible for any, without a miracle, to attain the habit of preaching but by diverse initial and preparatory actions; where can these be so fitly performed as in the classes [presbyteries]? The expectants are present in the classes for their training, not as members, for they do not voice in any matters of discipline. The true mystery of this controversy is that the expectants [in Anglicanism] are permitted to preach before the holy hands of a bishop have conferred upon them the order of a deacon, and so [have] power to preach and baptize: The Church of Scotland did always reject this corruption as clearly contrary to Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Historical Vindication of the Government of the Church of Scotland</cite>, … (1646), ‘The Unloading of Issachar’s Burden’, p. 22</span></figcaption>

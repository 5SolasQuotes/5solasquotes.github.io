<main class="wrap"><figure class="quote" id="q-999f321427" data-kw="">
<blockquote><p>But if ever a man was justified in being keenly sensitive to the honour of the Westminster Confession of Faith, that man was Henry Cooke. He had waged a long and arduous war for that venerable document. It was identified alike with his conflicts and his triumphs.

He had studied its doctrines until they had become a part of his better being. For him it was no mere conglomerate of dogmas, heavy and hard; but rather a fountain of living waters, fresh and bountiful as the grace of that Divine Redeemer whom it placed upon the throne.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-smyth.html">Richard Smyth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Life and Times of Dr Henry Cooke in British and Foreign Evangelical Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-66cd10c262" data-kw="">
<blockquote><p>Then there may and ought to be uniting [in church union] when the evils that follow division or schism, are greater and more hurtful to the Church, than the evils that may be supposed to follow on union. I speak not of ills of sin (for the least of these are never to be chosen), but of evils and inconveniences that may indeed be hurtful to the Church in themselves, and sinful in respect of some persons, yet are not so to all: Now, in such evils the lesser is to be chosen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Concerning Scandal</cite>, pp. 321–22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“Then there may and ought to be uniting [in church union] when the evils that follow division or schism, are greater and more hurtful to the Church, than the evils that may be supposed to follow on union. I speak not of ills of sin (for the least of these are never to be chosen), but of evils and inconveniences that may indeed be hurtful to the Church in themselves, and sinful in respect of some persons, yet are not so to all: Now, in such evils the lesser is to be chosen.”

— James Durham, A Treatise Concerning Scandal, pp. 321–22">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThen+there+may+and+ought+to+be+uniting+%5Bin+church+union%5D+when+the+evils+that+follow+division+or+schism%2C+are+greater+and+more+hurtful+to+the+Church%2C+than+the+evils+that+may+be+supposed+to+follow+on+union.+I+speak+not+of+ills+of+sin+%28for+the+least+of+these+are+never+to+be+chosen%29%2C+but+of+evils+and+inconveniences+that+may+indeed+be+hurtful+to+the+Church+in+themselves%2C+and+sinful+in+respect+of+some+persons%2C+yet+are+not+so+to+all%3A+Now%2C+in+such+evils+the+lesser+is+to+be+chosen.%E2%80%9D%0A%0A%E2%80%94+James+Durham%2C+A+Treatise+Concerning+Scandal%2C+pp.+321%E2%80%9322&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F66cd10c262.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/66cd10c262.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/unity-of-the-church/#:~:text=Then%20there%20may%20and%20ought%20to,the%20lesser%20is%20to%20be%20chosen&amp;text=Then%20there%20may%20and%20ought%20to%20be%20uniting&amp;text=such%20evils%20the%20lesser%20is%20to%20be%20chosen" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2f7e6abfd9" data-kw="">
<blockquote><p>It may be noted here that the term ‘Cameronian’, often loosely applied to the adherents of Cameron and Cargill, was originally coined about 1678 or 1679 to describe, disparagingly, those who shared [Richard] Cameron’s views on the supremacy [of the English and Scottish king] and Indulgence (cf. The Nonconformist’s Vindication, 1700, p. 16; A True and Impartial Relation of Bothwell Bridge, 1797, p. 16 [1751, p. 20]). It did not, however, gain much currency until after the Revolution of 1688, when it was used to denote those elements of the United Societies which did not join the Revolution Settlement (cf. [Patrick Walker] Six Saints of the Covenant, vol. I. p. 251)¹ ¹ [Walker says previously in the volume: “I am reflected upon, and that several times to my face, by all divided parties, especially Dissenters, and particularly by these of them commonly called M’Millanites, but quite wrong designed, who should be called Hamiltonians after Robert Hamilton, who was the only man (as I shall afterwards instruct) that led them in these untroden, dangerous paths of positive disowning of the State, and separation from the Church, and [from] all others that dare not nor will not go their lengths in principles and practices, proclaiming the same to the world;” Ibid., pp. 138-39] The term was never owned by those to whom it was applied, and it is uniformly described in their literature as a ‘by-name’ or ‘nick-name’ (cf. A Short Memorial of Sufferings and Grievances, 1690, title page). To the same effect are some remarks by John M’Main (Earnest Contendings, 1723, p. 376) when in taking Wodrow severely to task for using the term in his History he asserts, ‘He calumniates and fixes upon these faithful witnesses of Jesus Christ that stigma, or name of reproach, wherewith their enemies had branded them, calling them after a man, and falsely alleging that they termed themselves so, and labours to make his readers, in this and future generations, believe the calumny thus confirmed, that they were not Presbyterians. But he cannot produce one instance among all the cloud of witnesses, whom he so reproaches, evincing that ever any of them did so term themselves.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>No King but Christ: the Story of Donald Cargill</cite>, (Durham: Evangelical Press, 1988), p. 253, ch. 9, endnote 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-5f4e797454" data-kw="">
<blockquote><p>It is no new thing to see men (happy in the greatest attainments of human learning, and blessed with the influences and graces of the Spirit of God while in this militant state, where great fogs of ignorance cloud the understandings of the best) differ in their judgments about sin and duty; since one way of thinking, and an entire harmony of judgments is reserved as a valuable jewel of that crown of glory which shall encircle the happy heads of the Church triumphant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

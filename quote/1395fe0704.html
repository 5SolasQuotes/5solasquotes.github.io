<main class="wrap"><figure class="quote" id="q-1395fe0704" data-kw="">
<blockquote><p>Is this difference rational, essential, or real?

It is not essential, as in the creatures, where every one hath his proper essence or being, defined and circumscribed: for the essence of the Father is not one, and the essence of the son another, and of the holy Ghost another: but one and the same, which the Father doth wholly communicate to the Son; the Father and the Son to the holy Ghost. Not only in reason, because not in notion, or mind, or only in word is he called Father, Son, and holy Ghost: neither respectively or by relation: as one man may both be, and be called a father and a son. But it is real, yet altogether incomprehensible, because each person hath his own peculiar definition, or his essential and incommunicable propriety, and differs from another not in essence, but in the manner of subsisting.

What is the outward difference?

It is taken from the works of God that be without, as that the Father sends the Son, the Son is sent as the Redeemer: the holy Ghost is the sanctifier. As in the Creed, the Father is distinguished from the Son by the work of creation: the Son by his incarnation, the holy Ghost from them both, by the work of sanctification and regeneration as where he appeared like a Dove, (Mat. 3.) and in cloven tongues, Act. 2. although all these things be effected by one and the self same God. As we use to say, the works of the Trinity without are indivisible: therefore here let us remember the saying of Gregory Nazianzen: I cannot imagine one, but presently I am compassed about on every side with the brightness of three: neither can I distinguish three, but forthwith I am brought again to one. Further, in the persons of the Deity there is an order, but there is none inequality: there is a distinction, but no diversity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guillaume-bucanus.html">Guillaume Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian religion framed out of God’s word, and the writings of the best divines, methodically handled by questions and answers, fit for all such as desire to know, or practise the will of God</cite>, trans. Robert Hill (London: George Snowdon and Leonell Snowdon, 1606), p. 11.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5aa3ed0740" data-kw="">
<blockquote><p>Wherefore seeing that in the holy scriptures, in the Trinity the unity of the Deity is plainly and clearly taught, it is meet that we do simply rest therein, and not curiously to search nor lust after any further knowledge in this life, then it which God hath revealed. Wherefore Christian Emperors a thousand years past did very well enact the pain of death against such as should spread abroad any new doctrine as concerning this Article, as reproachful to Godward should teach the contrary. For God doubtless would not be seen of Moses, &amp; yet is seen in Christ Exo. 33 and 34. 2 Cor. 4. And moreover God hath in his Law decreed, that every one that hath sacrificed unto gods, besides the only God, should be slain, and as blasphemous towards God, should be taken out of the way [Exod. 22; Levit. 24].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common places of Christian religion</cite>, trans. John Stockwood (London, 1572), fols. 35-6.</span></figcaption>

</figure><figure class="quote" id="q-ab8fbf7e6c" data-kw="">
<blockquote><p>By confused and involved expressions the heretics very frequently elude the truth and secure the ears of the unwary by the mere sound of common words, such as the titles Father and Son, which they do not truthfully utter to express a natural and genuine community of essence: for they are aware that God is called the Father of all creation, and remember that all the saints are named sons of God.

In like manner they declare that the relationship between the Father and the Son resembles that between the Father and the universe, so that the names Father and Son are rather titular than real. For the names are titular if the Persons have a distinct nature of a different essence, since no reality can be attached to the name of father unless it be based on the nature of his offspring. So the Father cannot be called Father of an alien substance unlike His own, for a perfect birth manifests no diversity between itself and the original substance.

Therefore we repudiate all the impious assertions that the Father is Father of a Son begotten of Himself and yet not of His own nature. We shall not call God Father for having a creature like Him in might and activity, but for begetting a nature of an essence not unlike or alien to Himself: for a natural birth does not admit of any dissimilarity with the Father’s nature.

Therefore those are anathema who assert that the Father is Father of a nature unlike Himself, so that something other than God is born of God, and who suppose that the essence of the Father degenerated in begetting the Son. For so far as in them lies they destroy the very birthless and changeless essence of the Father by daring to attribute to Him in the birth of His Only-begotten an alteration and degeneration of His natural essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Councils, or, The Faith of the Easterns</cite>, (c. 359), 20 in Nicene and Post-Nicene Fathers 2, 9: 9.</span></figcaption>

</figure><figure class="quote" id="q-738fce26aa" data-kw="">
<blockquote><p>The problem with EFS is not Arianism, but the fact that it entails tritheism. Advocates of EFS are… replacing terms like ‘unbegotten’ and ‘begotten’ with the ideas ‘authority’ and ‘submission’… EFS is more in the line of what might be called polytheistic homoiousianism, whereby the Father and the Son have distinct natures, but each is still eternally divine… Because Chalcedonian Christology insists that Jesus has two natures but only one hypostasis, dyothelitism [the orthodox doctrine that Christ has a divine will and a distinct human will] as a development of Chalcedonian Christology necessitates the recognition that a will must be a property of nature [and not the Person] in order for there to be two wills in Christ. To posit such terms as ‘obedience’ and ‘submission’ that imply a distinction of wills between the Father and the Son while affirming dyothelite Christology entails a distinction of natures between the Father and Son (and Spirit) resulting in tritheism… After this historical account, a word study of the term ‘submission’ will demonstrate that the term clearly implies an activity of the will yielding to another will and should therefore be rejected as an eternal property of a divine hypostasis.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/butner-jr-d-glenn.html">D. Glenn Butner Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Eternal Functional Subordination and the Problem of the Divine Will’ 19</cite>, pp. in JETS 58/1 (2015) 131–49 The article is also here., p. 132-3</span></figcaption>

</figure><figure class="quote" id="q-1a9897dd11" data-kw="">
<blockquote><p>As we said above, so now we repeat, that the divine generation must not be compared to the nature of men, nor the Son considered to be part of God, nor the generation to imply any passion whatever; God is not as man; for men beget passibly, having a transitive nature, which waits for periods by reason of its weakness. But with God this cannot be; for He is not composed of parts, but being impassible and simple, He is impassibly and indivisibly Father of the Son.</p></blockquote>

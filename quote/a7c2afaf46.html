<main class="wrap"><figure class="quote" id="q-a7c2afaf46" data-kw="">
<blockquote><p>He manifests the more grace and goodwill to our salvation, and that He is more ready to pardon than to punish, in that He waits so long on the sinner’s choice: Rom. 9:22, ‘What if God, willing to show his wrath, and to make his power known, endured with much long‑suffering the vessels of wrath filled to destruction?’ He tarries the sinner’s leisure till the day of patience be quite spent ere [before] He executes this threatening of the new covenant; and offers men all this while many helps and advantages, enticing them by his mercies, awing them by his judgments, persuading them by his word, drawing them by his Spirit, knocking at the door of their hearts by the serious impressions of his grace, and awakening them by the stings and checks of their own consciences; all which are so many signs and evidences that He takes no pleasure in the death of sinners, as the prejudiced world thinks, but does all that becomes Him to do, as a prudent and gracious lawgiver (though not all that He could do as an almighty God) and sovereign disposer of his grace; and if He should do that, the world would never be put upon choice and trial, and obedience would be a matter of necessity and constraint, not of willing acceptation; and men may as well quarrel at this as that He has not made them all angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works, vol. 21, pp. 463-79, Two sermons on Eze. 18:23. HT: David Ponter. | Sermon 1:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5a0e2e650e" data-kw="">
<blockquote><p>As we see from the Westminster Confession and the 1689 Baptist Confession the Puritans… followed Calvin in resisting false human rationalisations. For instance they resisted the idea that God only loves the elect and hates the non-elect. This error is called hyper-Calvinism. It is a very serious error which is recurring today. The Puritans… believed in the universal love of God for all mankind (1 Tim 2:1-6; 2 Peter 3:9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erroll-hulse.html">Erroll Hulse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Example of the English Puritans” (Reformation Today 153, Sept/Oct 1996)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-9d48b4ca22" data-kw="">
<blockquote><p>Indeed, God not only calls to all who hear His Word, but He also communicates various gifts to them. Speaking of persons who do not come to conversion, the apostle says that they were once enlightened, have tasted of the heavenly gift, and were made partakers of the Holy Ghost, and have tasted the good word of God, and the powers of the world to come. (Heb. 6:4,5) God sometimes grants to reprobates special gifts, also relating to His Word, giving a certain pleasure in it, which nevertheless does not lead to salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/g-h-kersten.html">G.H. Kersten</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 2</cite>, p. 369</span></figcaption>

</figure><figure class="quote" id="q-5363ba0ffb" data-kw="">
<blockquote><p>[1] If you interpret it of his divine love, the difficulty will not be great; for there is a general and common love, and a special love. With the first, God loves all his creatures, especially mankind, and amongst them those that have any strictures of his image in them more than others. But then there is a special love, and so all those are saved whom God thus loves…. Now this will easily solve the matter; there was a general love, or a liking and approbation of those moral virtues and good things which He saw in him [the rich young ruler], but not that special love which brings grace and salvation along with it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works, vol. 16, p. 457 on Mk. 10:21-23, “Then Jesus beholding him loved him, and said unto him… And he was sad at that saying, and went away grieved.”</cite></span></figcaption>

</figure><figure class="quote" id="q-498d9d8ee6" data-kw="">
<blockquote><p>If you look into 1 Peter 3:19-20, you there find that Christ “went and preached unto the spirits in prison; which sometime were disobedient, when once the long-suffering of God waited in the days of Noah.” The meaning of which is, that in the days before the flood, Christ by his Spirit strove [Gen. 6:3] with the disobedient and rebellious sinners in the ministry of Noah, who then were living men and women as we are, but now are “spirits in prison,” that is, damned souls in hell, for their disobedience…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Knocking at the Door of Sinners’ Hearts; or, A Solemn Entreaty to Receive the Savior and His Gospel in This the Day of Mercy (New York: American Tract Society, 1850), p. 97. This quote was compiled by Tony Byrne.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

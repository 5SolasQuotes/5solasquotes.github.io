<main class="wrap"><figure class="quote" id="q-c28bff1c27" data-kw="">
<blockquote><p>Consider therefore, his infinite condescension, grace, and love herein. Why all this towards you? Does he stand in need of you? Have you deserved it at his hands? Did you love him first? Cannot he be happy and blessed without you? Has he any design upon you, that he is so earnest in calling you unto him? Alas! it is nothing but the overflowing of mercy, compassion, and grace, that moves and acts him herein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations and Discourses on the Glory of Christ</cite>, pt. 2, ch. 1, “Application … an Exhortation unto Such as Are Not Yet Partakers of Him”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-states-of-christ/state-of-humiliation.html">State of Humiliation</a></span></div>

</figure><figure class="quote" id="q-750d639e01" data-kw="">
<blockquote><p>You will remember the multitude He has redeemed; not me alone, nor you alone, but “a multitude that no man can number,” which shall as far exceed the stars of heaven for number, as they exceed all mortal reckoning. Christ hath bought for Himself, some out of every kingdom, and nation, and tongue, under heaven; He hath redeemed from among men some of every rank, from the highest to the lowest; some of every colour—black and white; some of every standing in society, the best and the worst. For some of all sorts hath Jesus Christ given Himself a ransom that they might be redeemed unto Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Justification by Grace”</cite>, sermon on Rom. 3:24</span></figcaption>

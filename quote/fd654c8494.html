<blockquote><p>That a Sabbath is spoken of in these words of Gen. 2:3, “and God blessed the seventh day and sanctified it,” will be admitted, whatever diversity of opinion may exist in reference to its original institution and present obligation. This Sabbath, with its blessings, it is believed, belongs to the whole human family, however much it is decried as a part of Judaism, or a merely human institution, expedient on the whole, but always to yield to any important secular interest, governmental or individual.

At the present day, it has become lamentably common, profanely and wantonly to abuse, and pervert to purposes of gain and pleasure, the sanctity of its hours. Convenience is the law which regulates the multitude on this sacred day, and to this law must yield both the authority of God, and the statutes of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-holmes-agnew.html">John Holmes Agnew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Manual on the Christian Sabbath</cite>, (Philadelphia PA: Presbyterian Board of Publication, 1852), p. 51.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>I am to recall your minds — it may seem somewhat brusquely — to the contemplation of the duty of the Sabbath; and to ask you to let them rest for a moment on the bald notion of authority. I do not admit that, in so doing, I am asking you to lower your eyes. Rather, I conceive myself to be inviting you to raise them; to raise them to the very pinnacle of the pinnacle. After all is said, there is no greater word than “ought.” And there is no higher reason for keeping the Sabbath than that I ought to keep it; that I owe it to God the Lord to keep it in accordance with His command.

It may nevertheless require some little effort to withdraw our thoughts even for a moment from the utility of the Sabbath and fix them on its bare obligation. Since Prudhon taught the world the natural value of the Sabbath, its supernatural origin and sanction have, in wide circles, passed perhaps somewhat out of sight. In its abounding usefulness to man, it may seem so obviously man’s day that we may easily forget that it was for two thousand years before it was discovered to be man’s day already the Lord’s day; and, stretching back from that, from the creation of the world God’s day. The Sabbath is undoubtedly rooted in nature; in our human nature and in the nature of the created universe. Unbroken toil is not good for us: the recurrence of a day of rest is of advantage to us, physically, mentally, spiritually.

But had we been left to find this out for ourselves, we should probably have waited very long for it. Certainly Prudhon tardily learned it from observation, not of pure nature, but of the Sabbath-rest ordained by God. We are told on the highest authority that “the Sabbath was made for man.” Man needs it. It blesses his life. But man apparently would never have had it, had it not been “made” for him; made for him by Him Who from the beginning of the world has known all His works, and, knowing man, has made for him from the beginning of the world the day of rest which he needs. He Who needed no rest, in the greatness of His condescension, rested from the work which He had creatively made, that by His example He might woo man to his needed rest.

The Sabbath, then, is not an invention of man’s, but a creation of God’s. … It is Jehovah who made the Sabbath; though for man, the Sabbath is not of man, but has come to man as a gift from God Himself. And, as God has made it, so He has kept it, as He has kept all else that He has made, under His own hand. It is in the power of no man to unmake the Sabbath, or to remake it—diverting it from, or, as we might fondly hope, adjusting it better to, its divinely appointed function. What God has made it, that will He Himself see that it shall remain. This in effect our Saviour tells us in that very saying to which we have already alluded. For, immediately upon declaring that “the Sabbath was made for man”—with the open implication, of course, that it was by God that it was made for man—He proceeds to vindicate to Himself the sole empire over it. “So that,” He adds, “the Son of Man is Lord even of the Sabbath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Foundations of the Sabbath in the Word of God in Duncan J. McMillan, et al</cite></span></figcaption>

<blockquote><p>And now especially in this solemn transaction, endeavour to render God great to your selves: Enlarge your minds, that as far as is possible and needful, they may take in the entire notion of him. As to what he is in himself, you must conceive of him as a Spirit, as his own Word, which can best tell us what he is, instructs us; and so as a Being of far higher excellency than any thing you can see with your eyes, or touch with your hands, or than can come under the notice of any of your senses.

You may easily apprehend Spiritual Being to be the source and spring of life, and self-moving power. This World were all a dead unmoving lump, if there were no such thing as Spirit; as your bodies when the soul is fled. You must conceive him to be an Eternal, Self-subsisting Spirit, not sprung up into Being from another, as our souls are: But who from the excellency of his own Being, was necessarily of, and from himself; comprehending originally and eternally in himself the fulness of all Life and Being.

I would fain lead you here, as by the hand, a few plain and easy steps. You are sure that somewhat now is, of this you can be in no doubt; and next you may be as sure that somewhat hath, of it self, ever been: For if nothing at all now were, you can easily apprehend it impossible that any thing should ever be, or of it self now begin to be, and spring up out of nothing. Do but make this supposition in your own minds, and the matter will be as plain to you as any thing can be, that if nothing at all were now in being, nothing could ever come into being; wherefore you may be sure, that because there is somewhat now in being, there must have been somewhat or other always in being, that was eternally of it self. And then to go a little farther, since you know there are many things in being that were not of themselves, you may be sure that what was always of it self, had in it a sufficiency of active power to produce other things, otherwise nothing that is not of it self could ever be. As you know that we were not of our selves; and the case is the same as to whatsoever else our eyes behold.

You must conceive of God therefore as comprehending originally in his own Being, which is most peculiar to himself, a power to produce all whatsoever Being, Excellency and Perfection is to be found in all the whole Creation. For there can be nothing which either is not, or arises not from, what was of it self. And therefore that he is an absolutely, universally, and infinitely perfect Being, and therefore that Life, Knowledge, Wisdom, Power, Goodness, Holiness, Justice, Truth, and whatsoever other conceivable Excellencies, do all in highest perfection, belong, as necessary Attributes, unchangeably and without possibility of diminution unto him. And all which his own Word (agreeably to the plain reason of things) doth in multitudes of places ascribe to him; as you that are acquainted with the Bible cannot but know. You must therefore conceive of him, as the All in All. So great, so excellent, so glorious a One he is, to whom you are to surrender and yield your selves.

You are to conceive of him as most essentially One, for there can be but one All. And so his Word teaches you to conceive. Hear, O Israel! the Lord our God is one Lord, Deut. 6. 4. We know there is no other God but one, &amp;c. 1 Cor. 8. 4, 5, 6. Your thoughts therefore need not be divided within you, nor your minds hang in doubt, to whom you are to betake and yield your selves: there is no place or pretence for halting between two Opinions. He most righteously lays the sole claim to you, a just God and a Saviour, and there is none besides him, Isa. 45. 21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two sermons preached at Thurlow in Suffolk on those words, Rom. 6.13 “Yield your selves to God”</cite>, (London: Tho. Parkhurst, 1688), pp 5-8.</span></figcaption>

eing%2C+that+was+eternally+of+it+self.+And+then+to+go+a+little+farther%2C+since+you+know+there+are+many+things+in+being+that+were+not+of+themselves%2C+you+may+be+sure+that+what+was+always+of+it+self%2C+had+in+it+a+sufficiency+of+active+power+to+produce+other+things%2C+otherwise+nothing+that+is+not+of+it+self+could+ever+be.+As+you+know+that+we+were+not+of+our+selves%3B+and+the+case+is+the+same+as+to+whatsoever+else+our+eyes+behold.%0A%0AYou+must+conceive+of+God+therefore+as+comprehending+originally+in+his+own+Being%2C+which+is+most+peculiar+to+himself%2C+a+power+to+produce+all+whatsoever+Being%2C+Excellency+and+Perfection+is+to+be+found+in+all+the+whole+Creation.+For+there+can+be+nothing+which+either+is+not%2C+or+arises+not+from%2C+what+was+of+it+self.+And+therefore+that+he+is+an+absolutely%2C+universally%2C+and+infinitely+perfect+Being%2C+and+therefore+that+Life%2C+Knowledge%2C+Wisdom%2C+Power%2C+Goodness%2C+Holiness%2C+Justice%2C+Truth%2C+and+whatsoever+other+conceivable+Excellencies%2C+do+all+in+highest+perfection%2C+belong%2C+as+necessary+Attributes%2C+unchangeably+and+without+possibility+of+diminution+unto+him.+And+all+which+his+own+Word+%28agreeably+to+the+plain+reason+of+things%29+doth+in+multitudes+of+places+ascribe+to+him%3B+as+you+that+are+acquainted+with+the+Bible+cannot+but+know.+You+must+therefore+conceive+of+him%2C+as+the+All+in+All.+So+great%2C+so+excellent%2C+so+glorious+a+One+he+is%2C+to+whom+you+are+to+surrender+and+yield+your+selves.%0A%0AYou+are+to+conceive+of+him+as+most+essentially+One%2C+for+there+can+be+but+one+All.+And+so+his+Word+teaches+you+to+conceive.+Hear%2C+O+Israel%21+the+Lord+our+God+is+one+Lord%2C+Deut.+6.+4.+We+know+there+is+no+other+God+but+one%2C+%26c.+1+Cor.+8.+4%2C+5%2C+6.+Your+thoughts+therefore+need+not+be+divided+within+you%2C+nor+your+minds+hang+in+doubt%2C+to+whom+you+are+to+betake+and+yield+your+selves%3A+there+is+no+place+or+pretence+for+halting+between+two+Opinions.+He+most+righteously+lays+the+sole+claim+to+you%2C+a+just+God+and+a+Saviour%2C+and+there+is+none+besides+him%2C+Isa.+45.+21.%E2%80%9D%0A%0A%E2%80%94+John+Howe%2C+Two+sermons+preached+at+Thurlow+in+Suffolk+on+those+words%2C+Rom.+6.13+%E2%80%9CYield+your+selves+to+God%E2%80%9D%2C+%28London%3A+Tho.+Parkhurst%2C+1688%29%2C+pp+5-8.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6fafd94c7c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6fafd94c7c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/06/09/john-howe-on-god-as-all-in-all/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-655d825017" data-kw="">
<blockquote><p>‘Ye shall not do’ (says Moses) ‘after all things, which we do here this day, every man, all that is right in his own eyes.’ [Dt. 12:8]… And the speech of Moses seems to mean the true service of God, which was not yet perfected, neither could be in their travels, as it was after in Canaan, vv. 10-11. Not that they sacrificed after their fancy (says the Geneva notes) but that God would be served more purely in the land of Canaan. Junius upon this place notes: ‘Etsi oblationum lex una semper fuit ab initi• praescripta a Deo, non potuit tamen usque adeo in ambulatoriis Israelitarum castris observari, ant summo jure ab illis exigi, prout ostendit; Antithesis, verse 11; vide Num, 28:6.’ The [Romanist] Douay divines, on the place, give this observation, ‘In the desert they could not observe the ceremonies of the Law, but coming to rest, they were bound to keep all one set form of holy rites.’ The conclusion from this text is that God is pleased to dispense with his people in his own prescribed worship, until, if He has appointed, determined, or appropriated a certain form, time and place, they have opportunity to serve Him at that time, in that place, and after that form.</p></blockquote>

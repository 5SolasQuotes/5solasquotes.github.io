<main class="wrap"><figure class="quote" id="q-49003e754d" data-kw="">
<blockquote><p>Certain it is that many popes have been notorious heretics, as Liberius and Felix, who were Arians; Honorius, a Monothelite; and John XXIII, who denied the immortality of the soul. In the papal see, several schisms have been, and divers times many popes together, excommunicating one another and reciprocally calling one another Antichrist; and of those Antichrists, the worst commonly overcame. So according to the very canons of the Roman Church, factions and corruptions in the creation of the popes have several times made their election void and therefore have broken the thread of that succession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery</cite>, bk. 1, ch. 32</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-66d40d7be9" data-kw="">
<blockquote><p>The Council of Trent having stamped the Vulgate as ‘authentic,’ ordered that a correct edition of this authorized Vulgate should be published. But little was done in fulfilment of this decree for nearly forty years, when the task was undertaken by Pope Sixtus V., a Pontiff who seems really to have believed in his own infallibility. He employed a Board of learned men to act as revisers, but in complete subordination to himself. In his preface he claims the superiority to them which he exercised, as resulting from the singular privilege which he enjoyed as successor to Peter, the Prince of the Apostles, for whom Christ prayed that his faith should not fail, and who was charged to confirm the other Apostles in the faith. … But a glance at the volume was sufficient to convince any moderately learned man of the folly, not to say impiety, of such boastful presumption. Many passages were found covered with slips of paper on which new corrections had been printed; others were scratched out and merely corrected with a pen; and different copies were corrected in different ways. A closer examination showed those competent to judge that the edition had graver faults than could be accounted for by printers’ carelessness. Sixtus had changed the readings of those whom he had employed to report upon the text with the most arbitrary and unskilful hand; and it was scarcely an exaggeration to say with Bellarmine that his precipitate self-reliance had brought the Church into the most serious peril.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture XIV</span></figcaption>

</figure><figure class="quote" id="q-085c3e4109" data-kw="">
<blockquote><p>Now I confidently say that whosoever calls himself, or desires to be called, Universal Priest, is in his elation the precursor of Antichrist, because he proudly puts himself above all others. Nor is it by dissimilar pride that he is led into error; for, as that perverse one wishes to appear as above all men, so whosoever this one is who covets being called sole priest, he extols himself above all other priests.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters</cite>, bk. 7, ep. 33 (to the Emperor Maurice)</span></figcaption>

</figure><figure class="quote" id="q-b6d80b7d0a" data-kw="">
<blockquote><p>Let Peter have the pre-eminence, still there is a great difference between the honour of rank and the possession of power. We see that the Apostles usually left it to Peter to address the meeting, and in some measure take precedence in relating, exhorting, admonishing, but we no where read any thing at all of power.</p></blockquote>

</figure><figure class="quote" id="q-ed477133ac" data-kw="">
<blockquote><p>Nor do I regard that as an honour whereby I know that my brethren lose their honour. For my honour is the honour of the universal Church: my honour is the solid vigour of my brethren. Then am I truly honoured when the honour due to all and each is not denied them. For if your Holiness calls me Universal Pope, you deny that you are yourself what you call me universally. But far be this from us. Away with words that inflate vanity and wound charity.</p></blockquote>

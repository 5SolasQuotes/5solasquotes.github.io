<main class="wrap"><figure class="quote" id="q-35bc06d9de" data-kw="">
<blockquote><p>Kings shall be thy nursing fathers, and their queens thy nursing mothers.” Is. 49:23. First, this prophecy is addressed to the church; it is to her, that kings and queens shall be nursing fathers and mothers, as the context shows. Second, the prophecy refers to the times of the gospel, as is evident from the whole context. “Thus saith the Lord, I will lift up my hand to the Gentiles, and set my standard to the people: and they shall bring thy sons, and thy daughters shall be carried upon their shoulders.” verse 22.

Third, this prophecy contains a very important promise addressed to the church, namely: that in the times of the gospel, when the Lord’s hand is “lifted up to the Gentiles,” kings and their queens shall be nursing fathers and nursing mothers to the church. The language of this Scripture does not admit of mere protection as the only thing intended; that which is mainly intended is sustenance. The word rendered “nursing” expresses the idea of nutrition, and so it is given by our translators in the margin. They are called “nourishers.” The allusion in these phrases is to the nourishment with which the nurse supplies the infant child.

Doubtless, the nurse takes care of, and protects her infant charge; but she would be a sorry nurse, indeed, if she did nothing more. The idea intended is chiefly that of nutrition. Transfer this to the action predicated of “kings” towards the church in the New Testament times, and we have the meaning of the prophecy. In the nourishment promised to the church, there is included the means of religious instruction. It does not belong to kings to furnish even instrumentally spiritual nourishment; but it is within their province to supply the pecuniary means needed to maintain religious ordinances.

The church requires places in which her members may assemble to worship God. The ministers of the gospel, who devote themselves to the work, need, like other men, food and clothing, and houses to live in. To obtain these things, pecuniary means are indispensable. Mere voluntary effort has failed to do these things to the extent that the good of the church requires. A public provision for the maintenance of religious instruction is made by divine appointment, and exemplified during the preceding dispensation of religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Public Support of Religion in Reformed Presbyterian and Covenanter</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-03ef5595b5" data-kw="">
<blockquote><p>Many assume that the Continental Reformed had a loose view of the Sabbath, which allowed for people to engage in recreation, whereas the stuffy Puritans and Covenanters were legalists. We have previously pointed out that Henry Bullinger and Martin Bucer did not share this perspective. Johannes Wollebius gives us further reason to believe that the notion of a Continental Sabbath is probably a myth:

The Sabbath is profaned, 1. When we do the works of our outward calling needlessly, as when we make journeys or exact debts then, &amp; c. 2. When we spend the Sabbath in carnal works, as in gaming, dancing, revelling, idle talking, Stage-plays, and such like sins. 3. In idolatrous works.

Such a profanation is a most grievous sin, Exod. 31. 13, 14. Num. 15. 35. Neh. 13. 16. Jer. 17. 27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The abridgment of Christian divinity</cite>, trans. Alexander Ross (3rd edn, London, 1660), p. 371.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Now, besides the sacred signs of God’s own institution, we know that natural signs have also place in divine worship [WCF 1.6]; thus kneeling in time of prayer signifies the submission of our hearts and minds, the lifting up of our eyes and hands signifies the elevation of our affections; the rending of the garments signified the rending of the heart by sorrow; standing with a religious suspect [respect] to that which is before us signifies veneration or reverence, sitting at table signifies familiarity and fellowship. For ‘which of you’, says our Master, ‘having a servant ploughing, or feeding cattle, will say unto him by and by, when he is come from the field, Go and sit down to meat?’ (Lk. 17:7) All these signs have their significations from nature.</p></blockquote>

<blockquote><p>The [opposing] Doctor takes needless pains to prove sitting in the act of receiving the sacramental elements of bread and wine, not to be necessary. For we hold not sitting in special [to be] absolutely necessary in the act of receiving, but [rather] a table-gesture in general, whether sitting or standing about the table, we hold necessary; howbeit not to the essence, yet to the right ministration of the sacrament. And of these two table gestures, we hold sitting most aggreeable to the institution: for Christ setting down before his apostles, a pattern, conformed whereunto they should celebrate that holy action thereafter, celebrated the same sitting: and this gesture ougt not to be changed, no not in another table gesture without some urgent necessity. To stand at the minister’s hand [giving the elements], or to take in passing by, we account [to be] no table-gesture; for there is no use in that case more of a table-gesture, than if it were a dressor, or cup-board; and that kind of gesture takes away the distribution of the communicants [between themselves], which is not taken away by standing about the table. … Casaubonus does acknowledge the gesture of Christ and his apostles at the Paschal supper to have been not a simple lying, but a gesture consisting partly of sitting, and lying… Seeing therefore the Hebrew, Chaldaic and Rabbinical writers do interpret the one word indifferently by the other [whether sitting or lying], our vulgar translators [of the Bible] have done right in expressing Christ’s gesture by the word ‘sitting’. The Doctor himself at Perth Assembly [1618] confessed that our gesture of upright sitting and his apostles’ gesture at the Paschal supper were analoga [analogous]. If Christ had celebrated the Paschal supper in the days of David [1 Sam. 4:18; 20:25-34] or Solomon [1 Kings 2:19; 10:19; 2 Kings 4:10; 2 Chron. 9:18], before the custom of sitting at table in beds entered among the Jews [as a cultural custom], He had used the gesture of upright sitting, as the Jews did then and as the Jews do at this day when they celebrate the Paschal supper.</p></blockquote>

— David Calderwood, A Solution of Doctor Resolutus, his Resolutions for Kneeling, ([Amsterdam, 1619]), ch. 1, ‘A Table Gesture is Necessary’, pp. 5-6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+%5Bopposing%5D+Doctor+takes+needless+pains+to+prove+sitting+in+the+act+of+receiving+the+sacramental+elements+of+bread+and+wine%2C+not+to+be+necessary.+For+we+hold+not+sitting+in+special+%5Bto+be%5D+absolutely+necessary+in+the+act+of+receiving%2C+but+%5Brather%5D+a+table-gesture+in+general%2C+whether+sitting+or+standing+about+the+table%2C+we+hold+necessary%3B+howbeit+not+to+the+essence%2C+yet+to+the+right+ministration+of+the+sacrament.+And+of+these+two+table+gestures%2C+we+hold+sitting+most+aggreeable+to+the+institution%3A+for+Christ+setting+down+before+his+apostles%2C+a+pattern%2C+conformed+whereunto+they+should+celebrate+that+holy+action+thereafter%2C+celebrated+the+same+sitting%3A+and+this+gesture+ougt+not+to+be+changed%2C+no+not+in+another+table+gesture+without+some+urgent+necessity.+To+stand+at+the+minister%E2%80%99s+hand+%5Bgiving+the+elements%5D%2C+or+to+take+in+passing+by%2C+we+account+%5Bto+be%5D+no+table-gesture%3B+for+there+is+no+use+in+that+case+more+of+a+table-gesture%2C+than+if+it+were+a+dressor%2C+or+cup-board%3B+and+that+kind+of+gesture+takes+away+the+distribution+of+the+communicants+%5Bbetween+themselves%5D%2C+which+is+not+taken+away+by+standing+about+the+table.+%E2%80%A6+Casaubonus+does+acknowledge+the+gesture+of+Christ+and+his+apostles+at+the+Paschal+supper+to+have+been+not+a+simple+lying%2C+but+a+gesture+consisting+partly+of+sitting%2C+and+lying%E2%80%A6+Seeing+therefore+the+Hebrew%2C+Chaldaic+and+Rabbinical+writers+do+interpret+the+one+word+indifferently+by+the+other+%5Bwhether+sitting+or+lying%5D%2C+our+vulgar+translators+%5Bof+the+Bible%5D+have+done+right+in+expressing+Christ%E2%80%99s+gesture+by+the+word+%E2%80%98sitting%E2%80%99.+The+Doctor+himself+at+Perth+Assembly+%5B1618%5D+confessed+that+our+gesture+of+upright+s

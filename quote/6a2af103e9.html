<main class="wrap"><figure class="quote" id="q-6a2af103e9" data-kw="">
<blockquote><p>Calvin never for a moment ceased to view the Church in its totality and, as Karl Holl has noted, his ecumenicity took root in the Churches organized under his influence, resulting in a strong feeling of unity and an active intercourse between them. In conflicts within Calvinism, national difference has never played a part. In this ecumenical consciousness he sought, in fact, a ‘syncretism’ (a word employed in his Catechism) among Protestants. Calvin never drew the bounds of communion in terms of assent to one confession of faith… He sought to lay the foundation of a Europe-wide communion, with a doctrinal basis clearly but not narrowly defined. He hoped to obtain this by mutual deliberation and conciliar action. Had his aims been achieved, Protestantism would have taken the outlines of a Church ecumenical and conciliar, autonomous vis-a-vis the State though protected by it. The design of Calvin has the grandeur of a world-embracing Christian order… The three Protestantisms [Reformed, Zwinglian and Luthern] had become two [as the Zwinglian and Reformed merged], and Calvin never lost hope that the two would become one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Calvin | John T. McNeill, ch. 1. “The Ecumenical Idea &amp; Efforts to Realize it, 1517-1618” in eds. Ruth Rouse &amp; Stephen C. Neill, A History of the Ecumenical Movement: 1517-1948 (Philadelphia, 1967), p. 52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

c" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=Calvin%20never%20for%20a%20moment%20ceased,that%20the%20two%20would%20become%20one&amp;text=Calvin%20never%20for%20a%20moment%20ceased%20to%20view&amp;text=lost%20hope%20that%20the%20two%20would%20become%20one" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-65dcef411f" data-kw="">
<blockquote><p>Although I shall by Gods gracious assistance keep that station and distance from Popish errors where my judgement and conscience, guided by God’s Word, has set me, yet to leave the Romanists without excuse, as much as in me lies, I do most earnestly desire, and should most industriously promote, such a Christian and catholic accord as were most for the honor of Christ and the peace of Christendom. I know the youthful fervors of some are jealous of all such motions, and for fear of seeming lukewarm they resolve to boil over all bounds till they quench both truth and charity among Christians and make way for atheism, Turkism, confusion and barbarity. These hotter heads possibly dread what I calmly desire, that such a grand catholic convention of able ecclesiastics in these Western Churches might, by the consent of princes and chief magistrates, be so orderly convened with freedom, impartiality and due authority, as might enable them to consent in one canon or rule of Faith and good manners, that the clear and concurrent sense of Scriptures might be owned by all, in which all things necessary are contained either literally, or by just deductions; that what is dark or dubious should be left indifferently to Christians use and judgements; that all would agree in the same ancient fundamental articles of Faith, contained in primitive creeds, also in the same sacraments or holy mysteries, to be devoutly celebrated, so in the same way of good works to be practiced, that we might all have the same catechism, the same public liturgies, so composed that all Christians might with faith and charity say Amen to them and in their several languages understand them; that a commentary on Scriptures, and sermons containing all Christian necessary doctrine might be agreed upon, that neither curiosities nor controversies should be couched in public prayers or preachings, that all might enjoy the same catholic source and course of ecclesiastic ordination, ministry and authority, so tempering government and discipline in the Church, that none should justly think others too much exalted, nor themselves too much depressed, that catholic customs, ancient ceremonies and traditions, truly such, being consonant to God’s Word, and practically interpreting the meaning of it, might be observed by all, leaving yet such freedom in other things to particular Churches as might be most convenient, yet still subordinate to and to be regulated by the judgment of such a general council, contrary to which none should affect extravagant liberty to the ruin of Christian charity. Blessed Lord! What good Christian could be injured by such a Christian accord in the main concernments of religion, which cannot be impossible in the nature of the thing, because it was of old enjoyed, and many hundreds of years generally preserved among all Christians and Churches of any name and repute in all the world? Nor did either the heat of persecution or prosperity (as warm and soultry weather) dispirit this charity of Christians, who might still be as capable subjects of so great a blessing from God on earth, if passion, prejudice, partiality and private interests on all hands were laid aside, without parting with any true and real interest that concerns a wise or good man, either in conscience or honor, in civil or religious regards.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gauden.html">John Gauden</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hiera dakrya, Ecclesiae anglicanae suspiria, The Tears, Sighs, Complaints &amp; Prayers of the Church of England setting forth her former Constitution compared with her Present Condition</cite>, (London: J.G., 1659), bk. 3, ch. 17, pp. 315-16 Gauden (1605-1662) was an Anglican bishop and royalist.</span></figcaption>

</figure><figure class="quote" id="q-25f7b99c98" data-kw="">
<blockquote><p>Must you defy your mother, because you see your brethren fighting? Their dissension is her grief: Must she lose some sons, because some others quarrel? Do not so wrong yourself in afflicting her. Will you love Christ the less because his coat is divided? Yea, let me boldly say, The hem is torn a little, the garment is whole; or rather it is fretted a little, not torn; or rather the fringe, not the hem. Behold, here is one Christ, one Creed, one Baptism, one heaven, one way to it; in sum, one religion, one foundation, and (take away the tumultuous spirits of some rigorous Lutherans) one heart. Our differences are those of Paul and Barnabas, not those of Peter and Magus: if they be some, it is well they are no more; if many, that they are not capital. Show me that Church that has not complained of distraction; yea that family, yea that fraternity, yea that man that always agrees with himself.</p></blockquote>

<blockquote><p>We are charged by the Separatists that we preach canons, and man’s constitutions, as God’s Word; But we answer: These are not taught for doctrines, but only serve for some passage and carriages touching God’s service, specially in Church government…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church</cite>, … (London: Kyngston, 1631). Randall (1570–1622) was an English puritan. | pt. 2, Lecture 28, p. 200</span></figcaption>

<blockquote><p>…Church government. A point in my judgement, that in regard of itself, needs not to be so exactly looked into and precisely stood upon now, as heretofore: but yet in regard of many unhappy differences and inconveniences that haue risen about it, and been occasioned by it in the Church of God; therefore to satisfy the consciences of some that are weak, and to stop the mouths of others that are clamorous, humorous, and perverse; and to maintain peace and unity in the house of God, and to iustify the state of all reformed Churches, professing the saving faith of Jesus Christ, that howsoever they differ from one another in the matter of Church-government, as some have many failings and sore blemishes in their government, yet all are true Churches of God. I say, in these respects I know not any one point of religion, not fundamental, so necessary to be thoroughly sought into, and advisedly and duly to be considered of:</p></blockquote>

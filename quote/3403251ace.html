<main class="wrap"><figure class="quote" id="q-3403251ace" data-kw="">
<blockquote><p>I find ground to assert a twofold justification. First, a general and first-justification (which most places before-mentioned speak of), when a person passes from an unjustified to a justified estate. This is owned by all, and therefore I shall say no more of it. Secondly, a particular, renewed, repeated and after-justification, when any particular act is approved by God and a person is accounted righteous in reference unto that. This kind of justification must needs be understood in that place where this phrase is first used, Gen. 15:6, ‘Abraham believed God, and He counted it to him for righteousness.’ Here it relates to his faith in that particular promise of God, concerning an heir to be born of his own body, and the numerousness of his seed by him, verses 4-5; and so must be meant of God’s approbation of that particular act of faith as a righteous act, or his accounting him righteous in that particular act… ‘Tis but as he [Paul] gathers and infers the general from one particular, that if Abraham were justified by faith and not by such [legal] works, whereof he might glory, then all others are justified so too, he being the father of all that believe, verse 11. i.e. an eminent example or pattern of the justification of believers. I say, it must needs be understood of a particular justification, with reference to that particular act, and not of his first and general justification; for he [Abraham] was a justified person long before that, as appears in that when he was called out of his own country, Gen. 12:1, 3, he obeyed that call, verse 4, and so became the friend of God [Jm. 2:23], who blessed him, [Gen. 12] verses 2-3, and appeared unto him, verse 7, by which, and all the following story, it is evident, that he was a good, righteous and holy man long before those words were spoken of him, ch. 15:6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-clark.html">Samuel Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scripture-Justification, or a Discourse of Justification, according to the Evidence of Scripture-Light (London: S. Bridge, 1698) | 15. ‘Concerning the Kinds of Justification’</cite>, p. 81</span></figcaption>

<blockquote><p>[You must distinguish:] 20. Betwixt pardon and justification conditional, which is an immediate effect of Christ’s death and resurrection, or rather of the making of the new Covenant. 2. And pardon and justification absolute, when we have performed all the conditions. 21. Betwixt conditional pardon and justification, which is only potential (such is that which immediately follows the enacting of the new Covenant to men before faith, or before they have sinned). 2. And conditional justification, which is actual, and of which the person has true possession, such is our justification after faith, till the Last Judgment, which is ours actually, but yet upon condition of perseverance in faith and sincere obedience. … 25. Betwixt the accusation of the Law (from [which] Christ does justify believers). 2. And the accusation of the Gospel or new Covenant, for not performing its conditions at all (from which no man can be justified, and for which there is no sacrifice). … 27. Betwixt our first possession of justification, which is upon our contract with Christ or mere faith. 2. And the confirmation, continuation and accomplishment of it (whose condition is also sincere obedience and perseverance).</p></blockquote>

<blockquote><p>[On Rom. 5:17, 19] And here some one may enquire what this gift of justice is which flows to us from Christ our head?… Of this gift the apostle thus speaks; ‘For if by the offence of one man, etc.’ by which words St. Paul declares that, through the merit and good work of the second Adam, many receive the gift of justice and life, as through the sin of the first Adam his posterity had contracted hurt and death. But what other thing could this gift have been but the gift of the Holy Ghost, who should bring both justice and life to those who are endowed with Him.</p></blockquote>

</figure><figure class="quote" id="q-b8026e58bd" data-kw="">
<blockquote><p>The sum of my doctrine which I bring them [Scriptures] to confirm, I contract into these heads. 1. That faith justifies not as an instrumental efficient cause, but as conditio applicans et disponens, the applying and disposing condition: its applicatory nature being the aptitude to the office, and its being the condition of the promise being the formal or nearest reason of its interest. 2. That repentance is conditio disponens, a dispositive condition of our first justification. 3. That Covenant-keeping by sincere love, thankfulness and obedience to God▪ Redeemer is a condition of the continuing, or not-losing our state of justification. 4. That the renewal of our faith and repentance, upon our lapses into discerned wounding sins, is a condition of the particular pardon of those sins, and our discharge or justification from the guilt of them. 5. That all the foresaid conditions, faith, repentance, love, thankfulness, sincere obedience, together with final perseverance, do make up the condition of our final absolution in judgment, and our eternal glorification. 6. That in the Day of Judgement, seeing we must be Judged by the Gospel or New Covenant, and it will be no small part of the work of the day to enquire whether we have performed the conditions of that Covenant which gives us Christ, and life and pardon, or not; we must therefore against the accusation of non-performance (real or supposed) be justified by our own performance as our particular righteousness: and this is the judging or jusiifying us according to our works, which Scripture mentions. And upon this will our universal and final justification depend, as upon its condition. And therefore whoever will be justified at that day, must have a Justitia prolegalis or a righteousness of remission of sin through the blood of Christ, to plead against the Law, and also a personal evangelical righteousness, consisting in a performance of the conditions of the Gospel or new Covenant, which is the condition of our interest in the first; or else he cannot be justified (yet is this latter but subordinate to the former, as to that sentential absolution). 7. Seeing this twofold righteousness is necessary to our justification in judgment, therefore it must needs follow that it is necessary to the making us righteous, or our constitutive justification in this life (in the order before laid down): For the Law is the rule of judgment; and God judges men to be as they are; and therefore He makes them righteous, both by remission of all sin and by giving them to perform the conditions of the New Covenant, before He judge them so.</p></blockquote>

ghteousness+of+remission+of+sin+through+the+blood+of+Christ%2C+to+plead+against+the+Law%2C+and+also+a+personal+evangelical+righteousness%2C+consisting+in+a+performance+of+the+conditions+of+the+Gospel+or+new+Covenant%2C+which+is+the+condition+of+our+interest+in+the+first%3B+or+else+he+cannot+be+justified+%28yet+is+this+latter+but+subordinate+to+the+former%2C+as+to+that+sentential+absolution%29.+7.+Seeing+this+twofold+righteousness+is+necessary+to+our+justification+in+judgment%2C+therefore+it+must+needs+follow+that+it+is+necessary+to+the+making+us+righteous%2C+or+our+constitutive+justification+in+this+life+%28in+the+order+before+laid+down%29%3A+For+the+Law+is+the+rule+of+judgment%3B+and+God+judges+men+to+be+as+they+are%3B+and+therefore+He+makes+them+righteous%2C+both+by+remission+of+all+sin+and+by+giving+them+to+perform+the+conditions+of+the+New+Covenant%2C+before+He+judge+them+so.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Richard+Baxter%E2%80%99s+Confession+of+his+Faith%E2%80%A6+%28London%3A+1655%29%2C+ch.+3%2C+pp.+56-57&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb8026e58bd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b8026e58bd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=The%20sum%20of%20my%20doctrine%20which,Covenant%2C%20before%20He%20judge%20them%20so&amp;text=The%20sum%20of%20my%20doctrine%20which%20I%20bring&amp;text=the%20New%20Covenant%2C%20before%20He%20judge%20them%20so" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It must be diligently observed, that though justification be but one individual act in respect of the Father, Son and Holy Ghost, in the first act of faith, and conversion of a sinner, whereby the person of a man stands justified before God, and shall, without intercision of justification and loss of this favor of God, stand before the barre of God’s tribunal, and is, and always shall be absolutely justified and acquitted from all sins past, present and to come, because all obligations and handwritings against him, are in that act cancelled and blotted out: he forgiving all trespasses, Col. 2:13-14. Yet it must be known, that of this act there is (as it were) a double sentence: First, in court of heaven, at which time the elect in Christ have their names enrolled in the book of God’s effectual calling, and are numbered among the just, which sentence can never be revoked or blotted out: this is that which was passed with God (that I may so speak, after the manner of men) in the first act of conversion. Secondly, this sentence of forgiveness is passed in the court of the conscience of him that had the former sentence pronounced for him in heaven. This sentence is the second act of the holy Ghost, wrought in this manner. First, after that a sinner is cōvinced of his guiltiness of sin, and of his damnable condition because of his sin, then forgiveness is offered, and pronounced to the ear in that gracious promise of salvation to all that believe in Christ Jesus, which promise is proclaimed in the ministry of the Gospel, in which light of the Gospel, he shows unto a man possibility of salvation, setting before him (I speak of men of years and understanding) Christ the means of salvation; and by this means the Holy Ghost works faith in Christ; then confession and grief for sin; then prayer to ask forgiveness; and grace to live godly, and then does witness to his spirit that he is accepted of God. Thus sentence is pronounced in the conscience: from whence arises sense of God’s love, which is called the shedding abroad of the love of God in our hearts by the Holy Ghost, Rom. 5:5, also sense of the loving countenance of God, which is the sign of his loving kindness, and is that speech of God, by which he does say to our souls, he is our salvation, and then arises in our hearts peace of conscience, and joy in the Holy Ghost. This sentence of forgiveness unto the conscience has different degrees: it is sometimes more clear in the apprehension of the soul, sometimes more dim, yea sometimes quite blotted out in the counterpane of our release, or copy of our acquittance; as it was with David, Ps. 51, so that a person perfectly just before God, has sometime little or no sense or apprehension of it in his own conscience, but doubts whether he be in state of grace or no. Which happens because of the stain and guilt of new sins, which guilt abides in the conscience, until a man do confess his sins, repent, and ask forgiveness, and, by a renewed faith, apply forgiveness: by which means the evidence of his pardon is again by the Holy Ghost exemplified, and sentence by this new application is again pronounced in his conscience; whence arises new assurance of salvation, and renewed joy in the Holy Ghost. This is that justification, which for distinction sake, Divines call justification by parts, or continued, or repeated justification, or new application of one and the same justification: which justification though in respect of the sentence pronounced in heaven, is one individual act, whereby a man standeth alwayes just before God; yet in respect of the pronouncing of that sentence to the heart, it is not actually applied; neither can a particular sinne be said to be everie way actually forgiven, until after it have beene committed, is confessed, and repented of; nor untill forgivenesse be asked, and until the holy Ghost hath made new application thereof unto the conscience, through renewing of faith, by which a man doth again and again, as new sins are committed, apply the merits of the blood of Christ unto his soul. Also it must be known that the sentence of pardon which is passed in heaven with God, is not fully executed until the last degree of it, when sentence of absolution shall be pronounced by Christ Jesus: Come ye blessed of my Father, inherit the kingdom prepared for you from the foundation of the world, Matt. 25.34. It must moreover be conceived and held, that notwithstanding this distinction of justification between an absolute justification in respect of God, and a justification by parts in respect of application to mans conscience, there are not two kinds of justification, a first and a second, as the Papists hold: but one and the same justification, considered in different respects. In respect of God’s actual acceptation of a man’s person, justification is absolute; but in respect of the actual application and manifestation of God’s acceptation unto a mans conscience, justification is by parts and degrees. When a man already justified asks forgiveness, he doth not ask a new justification, but a second or new application of pardon unto the conscience of those particular sins which are daily committed, together with continuance of God’s favor, and more clear evidence that he is sealed up unto the day of redemption. The third thing to be spoken of for the better understanding the word [forgive] concerns the effects following the apprehension thereof; these are peace of conscience, and joy in the holy Ghost. These things touching justification and remission of sins being opened, we may understand what is prayed for, when we say, Forgive sins. We pray… Secondly, we pray that ourselves and others being justified and accepted into favor, it would please the Lord to continue this his favor, and that he would signify and make the same known to our hearts and consciences daily, by a new testification of the holy Ghost, accompanied with a new application of pardon for new sins daily committed, and that we may have more and more assurance of our perfect redemption at the day of judgment; and that we may have peace of conscience, and joy in the Holy Ghost, in the meantime.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0a899d1746" data-kw="">
<blockquote><p>First, That whatsoever resistance is here forbidden and threatened [in Romans 13], relates to inferior Magistrates as far as their authority reaches according to laws, as well as supreme Magistrates.

I may no more resist a Constable commanding me, or arresting me, or distraining my goods according to Law, then I may do the King commanding me, &amp;c.

Yet the Doctor [Henry Fearne] takes no notice of this at all. But as if it were, not only the higher power, in the singular number, but the Highest in the Superlative degree; He restrains all to the King, which is a dangerous fallacy, not only in the present Question, but against all government.

To which I add, to refuse to be subject to the Parliament according to Laws, and to resist is much more (by this Scripture) undeniably a resisting the ordinance of God, and brings damnation.

And what then will he say to those that have done so too, and against the Parliament, and those sent by their authority unquestionable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herbert-palmer.html">Herbert Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scripture and reason pleaded for defensive arms: or The whole controversy about subjects taking up arms Wherein besides other pamphlets, an answer is punctually directed to Dr. Ferne’s book, entitled, Resolving of conscience, &amp;c. The scriptures alleged are fully satisfied. The rational discourses ar</cite>, (London: John White, 1643), p. 9.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3b47021f5c" data-kw="">
<blockquote><p>As to the political law of the Jews, that has been abolished in two respects; first, as it served to distinguish the Jewish commonwealth from all others, and as it was a type of the Redeemer’s kingdom. Now there is no longer any difference between Jews and Gentiles in Christ, (Gal. iii. 28,) and the Messiah having appeared, there is no need for his kingdom to be typified.

Secondly, it is abrogated in those things which are of particular obligation, and which were only applicable to the Jews; as the law concerning the marriage of a brother’s wife, the law of divorce, the jubilee, the first-born, the sowing of fields with different seeds, &amp;c. &amp;c.

But it is not abrogated in those things which are of universal obligation, being founded on the law of nature; which serve for the explanation of the Decalogue, and are found in the New Testament. The Jewish nation may be considered in two characters, as a people, and as the Jewish people; whatever applies to them simply as a nation, can be applicable to others; but whatever applies to them as the Jewish nation, is of no more obligation upon us, than the laws of the ancient Assyrians, Persians, Greeks, and Romans, or the municipal laws of any foreign nation.</p></blockquote>

<blockquote><p>Quest. II. If Peace-makers be blessed, how can any Nation with good conscience make war?

Answ. The Lord’s commandment to have peace with all men, doth not bind men simply, but with this condition, if it be possible, and as much as in us lieth: but when there is no hope of maintaining peace, then the Lord alloweth a lawful war, such as is for just defence, or claim of our needful due and right: for herein the case standeth with the body politick, as it doth with the natural body; while there is hope of health and safety, the Physician useth gentle means; but when the case is desperate, then he useth desperate means, and sometimes gives rank poison, to try if by any means life may be saved. And so may the safety of a State be sought by war, when Motions of peace will not take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A godly and learned exposition of Christ’s Sermon in the Mount</cite>, (Cambridge: University of Cambridge, 1608), pp 35-36.</span></figcaption>

<blockquote><p>For the subject of royal power, we affirm, the first and ultimate, and native subject of all power is the community, as reasonable men naturally inclining to a society; but the ethical and political subject, or the legal and positive receptacle of this power is various, according to the various constitutions of the policy. In Scotland and England, it is the three estates of parliament; in other nations, some other judges or peers of the land.</p></blockquote>

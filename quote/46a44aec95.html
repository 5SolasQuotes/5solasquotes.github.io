<main class="wrap"><figure class="quote" id="q-46a44aec95" data-kw="">
<blockquote><p>We the undersigned preachers, under the jurisdiction of the Classis of Alkmaar, declare and witness that the teaching which is in that catechism adopted unanimously by the Reformed [the Heidelberg Catechism] and which is comprehended in the 37 articles of the Dutch Reformed Churches [the Belgic Confession] agrees in everything with the Holy Word of God, and consequently with the foundation of the teaching of salvation. We promise to maintain this same teaching, through God’s grace; and openly to reject teachings that are brought against or oppose it; and with all diligence and faithfulness according to our ability to stand against them, as we affirm the same with our signatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands.html">Netherlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Robert Godfrey, “Subscription in the Dutch Reformed Tradition” in Practice of Confessional Subscription, pp. 68-69 | Classis of Alkmaar 1608</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e61972510c" data-kw="">
<blockquote><p>Now that it is not sufficient that they be put to subscribe a confession of faith in only scripture words is clear: 1. Because the Jews will swear and seal the Old Testament in their own sense, but their sense makes the Old Testament to be the word of man, not the Word of God. The Sadducees acknowledged the five books of Moses to be the Word of God, yet because they denied the resurrection of the dead, Christ argues them, Mt. 22:45, ignorant both of the power of God asserted in the books of Moses and of the scriptures, especially of that scripture which God spake out of the bush to Moses: ‘I am the God of Abraham, the God of Isaac, etc.’ Ex. 3:6. Yet would the Sadducees have sworn and subscribed all the book of Exodus as the undoubted word of God, but when they denied the resurrection, sure these words ‘I am the God of Abraham etc.’ making the Covenant of grace to die when Abraham died, and Abraham to have perished in soul and body as they expounded it, was not the Word of God; And Papists will subscribe the Old and New Testament and the three Creeds, the Nicene Creed, the Creed of Athanasius and that which commonly is called the Apostles’ Creed. Yet as they expound the Word and these Creeds, we say they transform the Word of God into the doctrine of devils and most abominable idolatry. The greatest heretics that were, Arius, Nestorius, Appolliuaris, Macedonius, the Tritheists, acknowledge the Scripture to be the Word of God and will swear and subscribe the Word of God and contain themselves intra sacra scripturae locutiones, ‘within the words of scripure’. But their faith is not the faith of the Scripture, and this makes ten thousand and millions of faiths whereas the word ‘faith’ there is but one faith. For Arius has one faith, Apollinaris another, Nestorius another, and every heretic a faith according to the sense that he falsely puts on the Scripture, and all may swear one confession of faith in Scripture-words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Free Disputation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

<blockquote><p>…read with earnest care that Gospel which has been conveyed to us by the apostles, and read with earnest care the prophets, and you will find that the whole conduct, and all the doctrine, and all the sufferings of our Lord, were predicted through them.</p></blockquote>

</figure><figure class="quote" id="q-068e7925f0" data-kw="">
<blockquote><p>The language here employed [in the Scottish subscription formula in 1694 &amp; 1711] is cautious and temperate, and is thus well suited to the circumstances of a solemn profession to be made by a numerous body of men, who might not all see their way to concur in stronger and more specific phraseology. Besides, it is to be observed that the profession respects not merely the fundamentals or essentials of Presbyterianism in the abstract, which alone can be reasonably maintained to have the clear and positive sanction of apostolic practice; but ‘the Presbyterian government and discipline of this church,’ including the detailed development of the essential principles of Presbyterianism as exhibited in the actual constitution and arrangements of our church, and of all this in the concrete, or taken complexly, nothing higher or stronger could with propriety be affirmed, than that it is founded upon the word of God, and agreeable thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology, vol. 1</cite>, p. 76</span></figcaption>

<main class="wrap"><figure class="quote" id="q-f30c9cf677" data-kw="">
<blockquote><p>Saying AMEN, audibly to all. Neh. 8. 6. […]

As for an audible pronouncing of Amen, if the mind of them that pronounce it, have been upon that which the Minister uttered, and their heart have given consent thereto, it compriseth altogether as much as the Minister hath uttered. This is the only warranteable means for people to utter their mind in a Congregation. It must therefore be uttered by every one, altogether, so loud, as well as they hear what he hath uttered in their name. For the one is as requisite as the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s Sanctification</cite>, (London, 1641), p. 5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-17ea7365d2" data-kw="">
<blockquote><p>V. (3) From the salaries of the sacred ministers under the Old Testament (Num. 18:8-12), to whom were given ordinarily sacrifices, tithes, firstfruits, and other similar things, besides certain cities and suburban fields (Num. 35:1-8). Now although in the New Testament, we are not bound by those laws as to the special material from which and the manner in which the pay was given, still they remain as to kind and analogy, as is evident from the passage already quoted (1 Cor. 9:13).</p></blockquote>

</figure><figure class="quote" id="q-2d6dcbbc1b" data-kw="">
<blockquote><p>We reject therefore these opposite opinions following… 2. That a particular visible Church is by the Word of God limited to such bounds as that of necessity, [that] they may be ordinarily contained and ought to meet in one place for performing the public worship of God with mutual edification. For as we have showed that the consitution of such a church, as by reason of their multitude or some other cause, cannot ordinarily meet in one place, does well agree with the Word of God and apostolical institution. For the essence and lawful constitution of a church depends not on the outward circumstance of place, but on a due profession of faith, and bond of holy communion. For as [William] Ames says, ‘that same in profession does constitute a Church-visible, which in reality and its internal nature constitutes the Church-mystical, that is, faith.’ Marrow of Theology, bk. 1, ch. 32, thesis 7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 41-42 of ch. 3, ‘Of an Institute Visible Church’ in A Consideration of Certaine Controversies at this Time Agitated in the Kingdome of England, Concerning the Government of the Church of God (1645) Apollonius was a Dutch presbyterian, who is arguing against the English Independents.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-5619110d65" data-kw="">
<blockquote><p>Prayer consists in calling upon the true God, and arises from an acknowledgment and sense of our want, and from a desire of sharing in the divine bounty, in true conversion of heart and confidence in the promise of grace for the sake of Christ the mediator, asking at the hands of God such temporal and spiritual blessings as are necessary for us; or in giving thanks to God for the benefits received. The genus or general character of prayer consists invocation or adoration. Adoration is often used in the sense of the whole worship of God, since we regard him as the true God, whom we worship. Prayer is a species or part of invocation, for to call upon the true God is to ask of him such things as are necessary both for soul and body, and to render thanks to him for benefits received. It is here used in the sense of the general character of pray. There are, therefore, two species or parts comprehended in prayer—petition and thanksgiving. Petition is a prayer asking of God those blessings necessary both for the soul and body. Thanksgiving is prayer acknowledging and magnifying the benefits received from God, and binding those who receive these gifts to such gratitude as is pleasing to God. Thankfulness in general consists in acknowledging and professing what and how great is the benefit received, and in binding those who are the recipients thereof to the performance of such duties as are mutual, possible and becoming. It comprehends, therefore, truth and justice. The apostle Paul, in his first Epistle to Timothy, 2:1, enumerates four species of prayer, saying, “I exhort, therefore, that first of all supplication, prayers, intercessions, and giving of thanks, be made for all men.” The first includes prayers against evil things; the second, petitions for good things; the third, intercession for others; and the fourth, thanksgiving for benefits received and evils warded off. This distinction is drawn from the end or design of prayer. Prayer is also distinguished into public and private prayer, from the circumstances of person and place. Private prayer is the intercourse which a faithful soul has with God, asking, alone and apart from others, certain blessings for himself, or for others; or giving thanks for benefits received. This form of prayer is not restricted to any particular words or places, for oftentimes the heart, when burdened and distressed, gives utterance to nothing more than sighs and groans; and the Apostle commands “that men pray every where, lifting up holy hands.” (1 Tim. 2:8.) Public prayer is that which, by the use of certain words, is offered up to God by the whole church in the congregation, the minister leading, as it is right and proper that he should in the public gatherings of the church. Language, or the use of the tongue, is necessary for this form of prayer. Hence Christ said: When ye pray, say, Our Father, &amp;c. It was also chiefly for this that the tongue was made, that God might be praised and magnified by it; and it is out of the abundance of the heart that the mouth speaketh. Lastly, by this others are also invited to praise and worship God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism, G. W. Williard</cite>, (Cincinnati, OH: Elm Street Printing Company, 1888), 619–20.</span></figcaption>

/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-68720784c2" data-kw="">
<blockquote><p>Now let us prostrate ourselves before the majesty of our good God, recognizing the infinite faults of which we are guilty, praying that it will please him to make us feel them more and more, so that we may ask him to pardon them. And may we recognize ourselves as we truly are, in order to compel ourselves to reform by correcting all the vices which are still in us, and to submit ourselves to his holy will, so that we may not cease blessing him in our afflictions. Thus, may we recognize our offenses and, at the same time, may we ever taste the fatherly love he shows us, so that we may invoke his name and call upon him until he shows us signs of his favour, after we have felt his wrath. May he show his grace not only to us, but also to all the people and nations of the Earth…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons On Second Samuel Chapters 1–13</cite>, trans. Douglas Kelly (Edinburgh: The Banner of Truth Trust, 1992), 15..</span></figcaption>

</figure><figure class="quote" id="q-92fe329262" data-kw="">
<blockquote><p>The prayer for the blessed resurrection of bodies is a form of charity toward the dead, through which we wish for them and ask God that their bodies may rise to eternal life on the last day. This does not contradict faith: Because it is commanded by Christ: When He instructs us to pray that the kingdom of our Father in heaven may come, He refers not only to the kingdom of grace but also to the kingdom of glory, which will not come without the resurrection of bodies. Therefore, when we pray, “Thy kingdom come,” we are also praying for the future resurrection of the dead… Because we have the promise of the resurrection of the flesh to eternal life. Whatever is promised to us and to others, even to the deceased in Christ’s faith, it is right to pray for its fulfillment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System of Theology</cite>, (Hanau, 1609; 1615), vol. 2, bk. 10, ‘Moral Virtues’ Latin | 15. ‘On the Prayer [voto] for the Blessed Resurrection of Bodies’, p. 1</span></figcaption>

</figure><figure class="quote" id="q-ad8d89aeae" data-kw="">
<blockquote><p>O Jehovah! God of my salvation! Let me call upon you particularly to notice what I have just now stated, That although the prophet simply, and without hyperbole, recites the agony which he suffered from the greatness of his sorrows, yet his purpose was at the same time to supply the afflicted with a form of prayer that they might not faint under any adversities, however severe, which might befall them. We will hear him by and by bursting out into vehement complaints on account of the grievousness of his calamities; but he seasonably fortifies himself by this brief exordium, lest, carried away with the heat of his feelings, he might become chargeable with complaining and murmuring against God, instead of humbly supplicating Him for pardon. By applying to Him the appellation of the God of his salvation, casting, as it were, a bridle upon himself, he restrains the excess of his sorrow, shuts the door against despair, and strengthens and prepares himself for the endurance of the cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 88, trans. James Anderson.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“O Jehovah! God of my salvation! Let me call upon you particularly to notice what I have just now stated, That although the prophet simply, and without hyperbole, recites the agony which he suffered from the greatness of his sorrows, yet his purpose was at the same time to supply the afflicted with a form of prayer that they might not faint under any adversities, however severe, which might befall them. We will hear him by and by bursting out into vehement complaints on account of the grievousness of his calamities; but he seasonably fortifies himself by this brief exordium, lest, carried away with the heat of his feelings, he might become chargeable with complaining and murmuring against God, instead of humbly supplicating Him for pardon. By applying to Him the appellation of the God of his salvation, casting, as it were, a bridle upon himself, he restrains the excess of his sorrow, shuts the door against despair, and strengthens and prepares himself for the endurance of the cross.”

<main class="wrap"><figure class="quote" id="q-63d112067c" data-kw="Succession of doctrine">
<blockquote><p>Succession is necessary in the church, but of doctrine and of the common and pastoral office; but not of place, or of persons and of the extraordinary apostolic office. Pastors in the first way succeed the apostles, but no one could have succeeded them in the latter way. … There are officers who must perpetually accompany the church, as pastors and teachers. Others, who were appointed to found it (such as apostles and evangelists), ought to remain only for a time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.19.16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/apostolic-succession.html">Apostolic succession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7f4a9b7ead" data-kw="Succession">

</figure><figure class="quote" id="q-386ba41121" data-kw="">

</figure><figure class="quote" id="q-43f398b797" data-kw="Upon this rock">
<blockquote><p>Mt. 16:18 does not favor the primacy of Peter. First, the passage is allegorical and metaphorical, admitting of various interpretations. Assuredly, it cannot establish an ecumenical pontificate, which ought to be proved by some express passage. Second, these things are certainly said to Peter, but not about Peter. The reasons are various. (a) From the very words because Petra is expressly distinguished from Petro, both in person and in gender, as the denominating and the denominated. Yet if he had wished to indicate Peter, why did he use both? Why did he not say, “Thou art Peter and upon thee” (which would have removed all difficulty). Rather he says “and upon this rock.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.17.13</span></figcaption>

</figure><figure class="quote" id="q-36d770f0fc" data-kw="Succession of Peter">
<blockquote><p>No one succeeded the apostles in personal apostolic preeminence (hyperochē). Therefore neither did anyone succeed Peter. For the same principle ought to apply to all. Nor ought the privilege of Peter as to ecclesiastical monarchy to be opposed, because this is the capital falsehood (prōton pseudos), which has been refuted before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.19.4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9cc09eb96d" data-kw="">
<blockquote><p>6. The psalms of David, and other scriptural songs in the Old Testament, may, and ought to be sung in this part of gospel-worship: for saith he, ‘in psalms, hymns, and spiritual songs, singing,’ etc. or rather, ‘singing in psalms, hymns,’ etc. for so the words may be rendered: now all agree that hereby are designed the psalms of David, and other scriptural songs, though there be some difference about the kind of songs which are intended to be expressed by every one of those in particular.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Exposition of the Epistles of Paul to the Galatians, Ephesians, Philippians, Colossians, and Thessalonians</cite>, (1656-1674; London, 1841), p. 239 &amp; 365 | On Col., 3:16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-0d94c3eb73" data-kw="">
<blockquote><p>The Holy Ghost hath, under the New [Testament], plainly directed us to the use thereof [i.e., of the Psalms], Col. 3:16; Eph. 5:19. The Psalms, Hymns and Spiritual Songs, there recommended, are plainly the same with the Mizmorim, Tehillim, and Shirim, mentioned in the Hebrew titles of David’s Psalms, 3, 4, 5, etc.; 145, 120, 134.</p></blockquote>

</figure><figure class="quote" id="q-395d8ecd70" data-kw="">
<blockquote><p>Towards God the duty is set down, that when we are merry and cheerful, to sing psalms and hymns unto God, ver. 16. And therefore St. James saith, chap. 5:13, ‘if any be merry, let him sing psalms ;’ … …a hymn, is a song of thanksgiving for a benefit received, and therefore our Savior, after his supper, sang an hymn, Mt. 26:30, viz., for a particular benefit. Lastly, a song is a more general thing than either the psalm or hymn, viz., wherein we give thanks, not for particular benefits, but for general blessings received at God’s hands, as when David praised the Lord for the works of creation, as the heavens, etc., Ps. 104… Use. These must be spiritual songs, viz. holy psalms and songs, not profane and wicked love-songs…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Colossians</cite>, (d. 1603; rep. Edinburgh, 1864), Sermon 26, on Col. 3:16-17, p. 55, rt. col.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-17d2591676" data-kw="">
<blockquote><p>And the best recreation to a spiritual mind, when it is weary of worldly employments, is to walk into Christ’s garden, and there, by reading and meditating, singing of Psalms (Col. 3:16) and holy conference, you may solace yourself with the sweet comforts of the holy Spirit, and may work your heart to joy in God, even to joy in the holy Ghost, and to a delight in the Commandments and Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Daily Walk in Holy Security and Peace</cite>, … (London, 1631), ch. 9, ‘Of keeping Company, as in the sight of God’, section 3, p. 236-7. While Scudder in the passage immediately below allows Col. 3:16 to speak of uninspired compositions in the context of private or social conference, yet the only reference in the book to the content of the Church’s public praise is to ‘psalms’ simply, as is documented below., pp. 64-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

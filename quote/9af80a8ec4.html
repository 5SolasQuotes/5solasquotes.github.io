<main class="wrap"><figure class="quote" id="q-9af80a8ec4" data-kw="">
<blockquote><p>…Whereas it is said we may forbear the practice of things commanded by affirmative precepts, hic et nunc [here and now], in some places, and at some times; it must always be taken with this proviso, that there be not incurred a greater and more perilous scandal by forbearance, than would probably be occasioned by practice of the thing commanded… …if we speak of the scandal tending unto sorrow and vexation, more are scandalized [in this case] at the forbearance [of it], than in likelihood would be at the practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want of Church-Government.. (London, 1650), p. 13 Jeanes was an English presbyterian.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e154ab4537" data-kw="">
<blockquote><p>Now Papists confirm many of their superstitions by the English ceremonies… It will be said that Papists have no ground nor reason to confirm any of their superstitions by the English ceremonies. But I answer: 1. If it were so, yet forasmuch as Papists draw them to a confirmation of their superstitions, we should abstain from them as appearances of evil. Eating (at a private banquet) of that which was sacrificed to idols, did confirm an idolater and infidel in his religion, as Pareus notes (Commentary on 1 Cor. 10:28): yet from this the idolater had no reason to confirm himself in his idolatry; but because the idolater seeing it, might draw it to a confirmation, the apostle will have it for that respect foreborn. When the Arians abused trine [three-fold] immersion in baptism to signify three natures of the three persons, Pope Gregory and the Fourth Council of Toledo ordained that in Spain, thrice washing should no longer be used in baptism, but once only. The Arians had no just reason to draw such a signification from the ceremony of trine-immersion: yet was it abolished when those heretics did so abuse it. If any say that we are saved by the blood of the son of man, the phrase is orthodox, because of the communication or rather communion of properties, and the Nestorians cannot with good reason by it confirm their heresy, yet are we to abstain from this form of speech, in Zanchius his judgment, when it is drawn to the confirmation of that error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2, ch. 9</cite>, p. 36-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

</figure><figure class="quote" id="q-bda28d4fcf" data-kw="">
<blockquote><p>IX. Neither can the indifferency or lawfulness of the thing done, nor the ordinance of authority commanding the use of it, make the scandal following upon it to be only passive [and hence the commanders would be innocent], which otherwise, i.e. in case the thing were neither lawful, nor ordained by authority, should be active. Not the former; for our divines teach (Hemmings., Enchir. Theol., class 3, ch. 17; Magdeburg, Century 1, bk. 2, ch. 4, cols. 448-449) that scandalum datum [scandal given] rises sometimes, ex facto-in se adiaphoro [out of the fact in itself by the thing indifferent] when it is done intempessive, contra charitatis regulam [unseasonably contra the rule of charity]. Not the latter; for no human authority can take away the condition of scandal from that which otherwise should be scandal, because nullum homo potist vel charitati, vel conscientiis nostris imperare, vel periculum scandali d•…ti prestar•…, says a learned casuist (Ames, bk. 5, de Consc., ch. 11, q. 6). . ch. 9, p. 41 ” If this be not taken well from us, let one of our opposites speak for us, who aknowledges that human power cannot make us do that which we cannot do without giving of scandal, and that in this case, the pretext of obedience to superiors shall not excuse us at the hands of the Supreme Judge. (Dr. [John] Forbes, Iren., bk. 2, ch. 20, num. 19)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2</cite>, ch. 8, p. 32-33</span></figcaption>

<blockquote><p>…it is further confirmed by that great scandal whereby Peter compelled the Gentiles to judaize, Gal. 2:14. ‘He constrained them,’ says Perkins (Commentary on Gal. 2:14), ‘by the authority of his example, whereby he caused them to think that the observation of the Ceremonial Law was necessary.’ It was then the quality of his action which made the scandal active, because that which he did was inductive to sin; but we are not to think that Peter had an intention to draw the Gentiles to sin. (tome 1, an. 55, n. 39)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637) | pt. 2, ch. 9</cite>, pp. 39-40</span></figcaption>

<blockquote><p>Thus have I evinced a main point, namely, that when scandal is known to follow upon anything, if it be not necessary, there is no respect whatsoever which can justify it.</p></blockquote>

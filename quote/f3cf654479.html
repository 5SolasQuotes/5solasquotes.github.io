<blockquote><p>The ignorance of fundamentals condemns, which is to be understood [in] two ways: 1. The ignorance of fundamentals such as are supernatural fundamentals, condemns all within the visible church as a sin, but it does not formally condemn those who are [outside] the visible church (John 15:22). It only makes those who are without the church incurable, but does not formally condemn them, as medicine not known, and so not refused, makes sick men incurable, as a loss, but does not kill them as a sin. 2. Superstructures, which by consequence arise from fundamentals, are fundamental by consequence, and secondarily, as the second rank of stones that are immediately laid upon the foundation, are a foundation in respect of the higher parts of the wall, and therefore are materially fundamental. And the ignorance of these virtually condemns, and the denying of such, by consequence, is a denying of the foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rutherford-s-distinctions.html">Rutherford’s Distinctions</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (1644), pt. 2, ch. 4, section 5, p. 221 ff. | 2 Distinctions about Ignorance of Fundamentals</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>If ye state yourselves into parties, as the Corinthians did, how will ye avoid being puffed up for one against another? and what one says be taken as an oracle and what another says cried down according to interest and affection? Cum res transit in affectum, perit judicium [When a thing turns to affection, judgment perishes]. Beware of a wrong bias upon your affection, for that will bias and bribe your judgment, and forbear rash judgings and spurning at ministers, 1 Cor. 4:5. Censure only what the Scripture censures and approve only what it approves; else ye may soon take light for darkness, etc.</p></blockquote>

</figure><figure class="quote" id="q-74e165a50d" data-kw="">
<blockquote><p>And 1st, albeit there be errors, and errors of a heinous nature among some in a Church, this is not sufficient ground of separation from that Church, nay, not though these errors should remain uncensured. For, as was noticed above, there were some in the Church of Corinth who had drunk in this gross error, “That there is no resurrection of the body;” hence the apostle asks, “How say some among you, there is no resurrection of the dead?” (1 Cor. 15:12) The interrogation plainly intimates there were some among them who denied that great and fundamental doctrine of the Christian religion; and yet this Church of Corinth was a true Church of Christ, from which it was not lawful to separate. So, in the Church of Pergamos, there were some uncensured who held the doctrine of Balaam, and the doctrine of the Nicolaitans; and yet she was a true Church of Christ, right and approven in the main. So, in the Church of Thyatira, “that wicked woman” Jezebel was tolerated without being censured, though she taught the Lord’s servants to commit heinous iniquity. So, though there should be sundry persons leavened with gross errors in the Church of Scotland at this day, this is no sufficient ground for a secession or separation from her. I own it is a sin, and I think a very heinous sin in any Church, to wink at errors, or not to censure for, and be zealous against them, especially if of a heinous nature, as are some of these wherewith some among us have been charged… … And as [John] Owen justly (Exposition, p. 174) observes, “There may be a fundamental error in a true Church for a season, where the Church errs not fundamentally,” citing for proof of this, 1 Cor. 15; 2 Tim. 2:18.</p></blockquote>

</figure><figure class="quote" id="q-a9d41009ae" data-kw="">
<blockquote><p>It is true indeed, the apostle in his epistle to the Galatians, is very severe against some false teachers; which yet does not weaken, but really confirm the necessity of this forbearance and toleration. For those teachers were themselves against tolerating others, and would have the ceremonies of the Law imposed upon all Christians, as things necessary to salvation; by which means the Christian faith would have been greatly corrupted. And at the same time that he so sharply inveighs against these teachers, he is very large in recommending charity and forbearance, even in so freat a diversity of opinions as this was; and commands that “they who were overtaken in a fault, should be restored in the spirit of meekness;” (Gal. 5:13-15) and that “they should bear one another’s burdens.” (Gal. 6:1-2) And at last, when he had told them that the essence of Christianity did not consist in circumcision, or uncircumcision, i.e. in observing or omitting the ceremonies of the Law, but “in the new creature,” i.e. in true and real holiness; he adds these words, wherein he most affectionately desires, as well as commands, a mutual forbearance among persons who differ in things not fundamental; “and as many as walk according to this rule,” i.e. that agree in the essentials of Christianity, and form their lives according to this rule, “Peace be upon them, and mercy, and upon the Israel of God.” (Gal. 6:15-16)… And if we turn out thoughts to the following circumstances, we shall plainly perceive of how great weight these things are to recommend the like forbearance among Christians in these days: 1. The apostles were infallible, and if they would not attempt to compose these differences by exerting their authority, but chose to recommend forbearance on both sides, how much more should we take the like course, who have not the least pretences to infallibility? 2. The dispute was not about a trifle, but a very weighty affair, even the difference between the Law and the Gospel; a thing that did not consist in mere speculation, but had a great influence both upon practice and worship. Alas! How many trivial controversies in comparison of this do sour the minds of Christians in these days? 3. Both sides were furnished with very considerable arguments, the one a Law given by God, the other the defense of Christian liberty. 4. St. Paul himself, who so strenuously urged this forbearance, had before such a flaming zeal for the Law, that he was even mad for it. 5. Lastly, these precepts of forbearance were given after the vision from Heaven to Peter, and after the apostolic synod; so that these controversies had been sufficiently determined already, by this vision, and by the decree of the apostles. Whoever therefore shall seriously consider these circumstances, and weigh them impartially, can’t surely but conclude that these apostolical precepts of forbearance, if they had any weight in their times, ought to have much more in our times, and in the present controversies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-a-turretin.html">J.A. Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Fundamental Articles in Religion (London: Darby, 1720), ch. 7, ‘Church communion ought to be had among those not differing in fundamentals’</cite></span></figcaption>

— J.A. Turretin, A Discourse concerning Fundamental Articles in Religion (London: Darby, 1720), ch. 7, ‘Church communion ought to be had among those not differing in fundamentals’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+true+indeed%2C+the+apostle+in+his+epistle+to+the+Galatians%2C+is+very+severe+against+some+false+teachers%3B+which+yet+does+not+weaken%2C+but+really+confirm+the+necessity+of+this+forbearance+and+toleration.+For+those+teachers+were+themselves+against+tolerating+others%2C+and+would+have+the+ceremonies+of+the+Law+imposed+upon+all+Christians%2C+as+things+necessary+to+salvation%3B+by+which+means+the+Christian+faith+would+have+been+greatly+corrupted.+And+at+the+same+time+that+he+so+sharply+inveighs+against+these+teachers%2C+he+is+very+large+in+recommending+charity+and+forbearance%2C+even+in+so+freat+a+diversity+of+opinions+as+this+was%3B+and+commands+that+%E2%80%9Cthey+who+were+overtaken+in+a+fault%2C+should+be+restored+in+the+spirit+of+meekness%3B%E2%80%9D+%28Gal.+5%3A13-15%29+and+that+%E2%80%9Cthey+should+bear+one+another%E2%80%99s+burdens.%E2%80%9D+%28Gal.+6%3A1-2%29+And+at+last%2C+when+he+had+told+them+that+the+essence+of+Christianity+did+not+consist+in+circumcision%2C+or+uncircumcision%2C+i.e.+in+observing+or+omitting+the+ceremonies+of+the+Law%2C+but+%E2%80%9Cin+the+new+creature%2C%E2%80%9D+i.e.+in+true+and+real+holiness%3B+he+adds+these+words%2C+wherein+he+most+affectionately+desires%2C+as+well+as+commands%2C+a+mutual+forbearance+among+persons+who+differ+in+things+not+fundamental%3B+%E2%80%9Cand+as+many+as+walk+according+to+this+rule%2C%E2%80%9D+i.e.+that+agree+in+the+essentials+of+Christianity%2C+and+form+their+lives+according+to+this+rule%2C+%E2%80%9CPeace+be+upon+them%2C+and+mercy%2C+and+upon+the+Israel+of+God.%E2%80%9D+%28Gal.+6%3A15-16%29%E2%80%A6+And+if+we+turn+out+thoughts+to+the+following+circumstances%2C+we+shall+plainly+perceive+of+how+great+weight+these+things+are+to+recommend+the+like+forbearance+ <blockquote><p>Now if it could be made plain to the divided Protestant Churches, that indeed the causes of their divisions are extra-fundamental, it may be truly and hopefully concluded that for conscience sake towards God and for their mutual edification and preservation against the encroaching power of darkness, they would be moved to leave off passionate disputations and laying aside the causes of their separation to compose their differences in brotherly love.</p></blockquote>

<blockquote><p>In form this crying and sighing is that amid your trial you do not call God a tyrant, an angry judge, or a tormentor, but a Father—even though the sighing may be so faint that it can hardly be felt. By contrast the other crying is very great and is felt very strongly, when in genuine terror of conscience we call God wicked, cruel, an angry tyrant, and a judge. For then it seems that God has forsaken us and that He wants to banish us to hell. That is how the saints often complain the psalms (Ps. 31:22, 12): “I am driven far from Thy sight”; “I have become like a broken vessel.” This is certainly not a sigh that says: “Father”; it is the roar of hatred for God that cries loudly: “Harsh judge, cruel tormentor!” Now it is time to turn your eyes away from the Law, from works, and from your own feelings and conscience, to lay hold of the Gospel, and to depend solely on the promise of God. Then there is emitted a little sigh, which silences and drowns out that violent roaring; and nothing remains in your heart but the sigh that says: “Abba! Father! However much the Law may accuse me, and sin and death may terrify me, nevertheless Thou, O God, dost promise grace, righteousness, and eternal life through Christ.” And so the promise produces the sigh that cries: “Father!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 389.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In form this crying and sighing is that amid your trial you do not call God a tyrant, an angry judge, or a tormentor, but a Father—even though the sighing may be so faint that it can hardly be felt. By contrast the other crying is very great and is felt very strongly, when in genuine terror of conscience we call God wicked, cruel, an angry tyrant, and a judge. For then it seems that God has forsaken us and that He wants to banish us to hell. That is how the saints often complain the psalms (Ps. 31:22, 12): “I am driven far from Thy sight”; “I have become like a broken vessel.” This is certainly not a sigh that says: “Father”; it is the roar of hatred for God that cries loudly: “Harsh judge, cruel tormentor!” Now it is time to turn your eyes away from the Law, from works, and from your own feelings and conscience, to lay hold of the Gospel, and to depend solely on the promise of God. Then there is emitted a little sigh, which silences and drowns out that violent roaring; and nothing remains in your heart but the sigh that says: “Abba! Father! However much the Law may accuse me, and sin and death may terrify me, nevertheless Thou, O God, dost promise grace, righteousness, and eternal life through Christ.” And so the promise produces the sigh that cries: “Father!”

<blockquote><p>2. We must believe none that speak against the Light of Nature and common notices of all mankind: for that were to renounce humanity: And the Law of Nature is God’s first Law. But it is not the sentiments of nature as depraved which is this Law. 3. We must believe no men against the common senses of mankind, exercised on their duly qualified objects. Faith contradicts not common sense, though it go above it. We are men before we are Christians, and sense and reason are presupposed to faith… For if sense be not to be trusted, we know not that there is a Church, or a man, or a Bible or any thing in the world, and so nothing can be believed. Whether all sound senses may be deceived or not, God has given us no surer way of certainty. 4. Nothing is to be believed against the certain interest of all mankind and tending to their destruction; That which would damn souls, or deny their immortality and future hope, or ruin the Christian world or nations, is not to be believed to be duty or lawful: For truth is for good, and faith is for felicity; and no man is bound to such destructive things. 5. Nothing is to be believed as absolutely certain which depends on the mere honesty of the speakers: For all men are liable to mistake or lie. 6. The more ignorant, malicious, unconscionable, factious, siding, any man is, the less credible he is. And the wiser and nearer to the action any man is, and the more conscionable, peaceable and impartial he is, the more credible he is. An enemy speaking well of a man, is so far more credible than a friend: Multitudes, as capable and honest, are more credible than one. 7. As that certainty which is called moral, as depending on men’s free-will, is never absolute, but has many degrees, as the witness is more or less credible; so there is a certainty by men’s report, tradition or history which is physical and wholly infallible: As that there is such a place as Rome, Paris, etc. and that the statutes of the land were made by such kings and parliaments to whom they are ascribed; and that there have been such kings, etc. For proof of which know: 1. That besides the free acts, the will has some acts as necessary as it is to the fire to burn, viz. To Love ourselves and felicity, and more such. 2. That when all men of contrary interest, friends and foes, agree in a matter that has sensible evidence, it is the effect of such a necessitating cause. 3. And there is no cause in nature that can make them so agree in a lie. Therefore it is a natural certainty. Look back to the sixth chapter.</p></blockquote>

<blockquote><p>3. The goodness or badness of a human action may be considered two ways, viz. either in actu signato [in the signified act] and quo ad speciem [as to the species], or in actu exercito [in the exercised act] and quo ad individuum [as to the individual thing]. For an action is said to be specificated by its object and individuated by its circumstances. So that when an action is good or evill in respect of the object of it, then it is called good or evil quo ad speciem. When it is good or evil in respect of the circumstances of it, then it is said to be good or evil quo ad individuum. … 6. Every thing which is indifferent in the nature of it is not by-and-by indifferent in the use of it. But the use of a thing-indifferent ought evermore to be either choosed or refused, followed or forsaken, according to these three rules delivered to us in God’s Word: 1. the rule of piety, 2. the rule of charity, 3. the rule of purity. … We may not for the commandment of men transgress the rule of piety by doing any thing which is not for God’s glory and ordered according to his will; neither ought any of us to obey men except for the Lord’s sake and as the servants of Christ, doing the will of God, which teaches us the manner how we ought to obey men, namely, propter Christum et sicut Christus praecipit [for Christ and as if Christ commanded it]. For if we should know no more but the will of man for that which we do, then we should be the servants of men, not the servants of Christ. Neither yet may we for any human ordinance break the rule of charity, but whatsoever either would weaken or not edify our brother, be it never so lawful, never so profitable to ourselves, never so powerfully by earthly authority enjoined, Christians, who are not born unto themselves but unto Christ, unto his Church and unto the fellow members, must not dare to meddle with it. Nor lastly, may we obey men so as to break the law of purity, and perform any action with a doubtful conscience, that is, whereof either the Word has not, or we out of it have no warrant: in which case tender consciences must be tendered rather than be racked by authority: for be the things in themselves never so lawful, etc., they are utterly unlawful to me without such information… … 2. As for those actions which proceed from the deliberation of reason, howbeit many of them be indifferent quo ad speciem, yet none of them is, nor can be indifferent quo ad individuum. The reason of this difference and distinction is because every action has its species or kind from the object; and a human moral action has its species or kind from the object referred to the original of human actions, which is reason. Whereupon it comes that if the object of the action include something that agrees to the order of reason, it shall be a good action according to it’s kind: for example, to give alms to an indigent man. But if it include something that is repugnant to the order of reason, it shall be an evil action according to its kind, as to steal or take away another man’s goods. Now sometimes it happens that the object of an action does not include something that belongs to the order of reason, as to lift a straw from the ground, to go to the field etc. such actions are indifferent, according to their kind. But we must pronounce far otherwise of them, when we speak of them quo ad individuum, because as they are individuated by their circumstances, so in their individual being they have their goodness or badness from the same circumstances, as has been showed. So that no such action as is deliberated upon can be indifferent quo ad individuum; because oportet [it is needful] says Thomas, quod quilibet individualis actus habeat aliquam circumstantiam, per quam trahetur ad bonum, vel malum, ad minus ex parte intentionis finis [every individual act has some circumstance, through which it is drawn to the good or bad, to a lesser degree, from the part of the intention of the end].</p></blockquote>

— George Gillespie, English-Popish Ceremonies ([1637]), pt. 4, ch. 3, pp. 7-8 &amp; 11-12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+The+goodness+or+badness+of+a+human+action+may+be+considered+two+ways%2C+viz.+either+in+actu+signato+%5Bin+the+signified+act%5D+and+quo+ad+speciem+%5Bas+to+the+species%5D%2C+or+in+actu+exercito+%5Bin+the+exercised+act%5D+and+quo+ad+individuum+%5Bas+to+the+individual+thing%5D.+For+an+action+is+said+to+be+specificated+by+its+object+and+individuated+by+its+circumstances.+So+that+when+an+action+is+good+or+evill+in+respect+of+the+object+of+it%2C+then+it+is+called+good+or+evil+quo+ad+speciem.+When+it+is+good+or+evil+in+respect+of+the+circumstances+of+it%2C+then+it+is+said+to+be+good+or+evil+quo+ad+individuum.+%E2%80%A6+6.+Every+thing+which+is+indifferent+in+the+nature+of+it+is+not+by-and-by+indifferent+in+the+use+of+it.+But+the+use+of+a+thing-indifferent+ought+evermore+to+be+either+choosed+or+refused%2C+followed+or+forsaken%2C+according+to+these+three+rules+delivered+to+us+in+God%E2%80%99s+Word%3A+1.+the+rule+of+piety%2C+2.+the+rule+of+charity%2C+3.+the+rule+of+purity.+%E2%80%A6+We+may+not+for+the+commandment+of+men+transgress+the+rule+of+piety+by+doing+any+thing+which+is+not+for+God%E2%80%99s+glory+and+ordered+according+to+his+will%3B+neither+ought+any+of+us+to+obey+men+except+for+the+Lord%E2%80%99s+sake+and+as+the+servants+of+Christ%2C+doing+the+will+of+God%2C+which+teaches+us+the+manner+how+we+ought+to+obey+men%2C+namely%2C+propter+Christum+et+sicut+Christus+praecipit+%5Bfor+Christ+and+as+if+Christ+commanded+it%5D.+For+if+we+should+know+no+more+but+the+will+of+man+for+that+which+we+do%2C+then+we+should+be+the+servants+of+men%2C+not+the+servants+of+Christ.+Neither+yet+may+we+for+any+human+ordinance+break+the+rule+of+charity%2C+but+whatsoever+either+would+weaken+or+not+edify+our+brother%2C+be+it+never+so+lawful%2C+never+so+profitable+to+ourselves%2C+never+so+powerfully+by+earthly+authority+enjoined%2C+Christians%2C+who+are+not+born+unto+themselves+but+unto+Christ%2C+unto+his+Church+and+unto+the+fellow+members%2C+must+not+dare+to+meddle+with+it.+Nor+lastly%2C+may+we+obey+men+so+as+to+break+the+law+of+purity%2C+and+perform+any+action+with+a+doubtful+conscience%2C+that+is%2C+whereof+either+the+Word+has+not%2C+or+we+out+of+it+have+no+warrant%3A+in+which+case+tender+consciences+must+be+tendered+rather+than+be+racked+by+authority%3A+for+be+the+things+in+themselves+never+so+lawful%2C+etc.%2C+they+are+utterly+unlawful+to+me+without+such+information%E2%80%A6+%E2%80%A6+2.+As+for+those+actions+which+proceed+from+the+deliberation+of+reason%2C+howbeit+many+of+them+be+indifferent+quo+ad+speciem%2C+yet+none+of+them+is%2C+nor+can+be+indifferent+quo+ad+individuum.+The+reason+of+this+difference+and+distinction+is+because+every+action+has+its+species+or+kind+from+the+object%3B+and+a+human+moral+action+has+its+species+or+kind+from+the+object+referred+to+the+original+of+human+actions%2C+which+is+reason.+Whereupon+it+comes+that+if+the+object+of+the+action+include+something+that+agrees+to+the+order+of+reason%2C+it+shall+be+a+good+action+according+to+it%E2%80%99s+kind%3A+for+example%2C+to+give+alms+to+an+indigent+man.+But+if+it+include+something+that+is+repugnant+to+the+order+of+reason%2C+it+shall+be+an+evil+action+according+to+its+kind%2C+as+to+steal+or+take+away+another+man%E2%80%99s+goods.+Now+sometimes+it+happens+that+the+object+of+an+action+does+not+include+something+that+belongs+to+the+order+of+reason%2C+as+to+lift+a+straw+from+the+ground%2C+to+go+to+the+field+etc.+such+actions+are+indifferent%2C+according+to+their+kind.+But+we+must+pronounce+far+otherwise+of+them%2C+when+we+speak+of+them+quo+ad+individuum%2C+because+as+they+are+individuated+by+their+circumstances%2C+so+in+their+individual+being+they+have+their+goodness+or+badness+from+the+same+circumstances%2C+as+has+been+showed.+So+that+no+such+action+as+is+deliberated+upon+can+be+indifferent+quo+ad+individuum%3B+because+oportet+%5Bit+is+needful%5D+says+Thomas%2C+quod+quilibet+individualis+actus+habeat+aliquam+circumstantiam%2C+per+quam+trahetur+ad+bonum%2C+vel+malum%2C+ad+minus+ex+parte+intentionis+finis+%5Bevery+individual+act+has+some+circumstance%2C+through+which+it+is+drawn+to+the+good+or+bad%2C+to+a+lesser+degree%2C+from+the+part+of+the+intention+of+the+end%5D.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English-Popish+Ceremonies+%28%5B1637%5D%29%2C+pt.+4%2C+ch.+3%2C+pp.+7-8+%26+11-12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1edd077b99.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1edd077b99.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-human-laws-bind-the-conscience-how-they-do-not/#:~:text=3.%20The%20goodness%20or%20badness%20of,of%20the%20intention%20of%20the%20end&amp;text=3.%20The%20goodness%20or%20badness%20of%20a%20human&amp;text=the%20part%20of%20the%20intention%20of%20the%20end" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Learned politicians, as Bartholomeus Romulus, (Defens. part 1, n. 153, and Joannes de Anania (in c. fin. de his qui fil. occid.) teach… nor is he more to accuse his son, than to accuse himself, because the father loves the son better than himself,” (D. Listi quidem. Sect. Fin. quod, met. caus, et D. L. fin. c. de cura furiosi) and certainly a father had rather die in his own person, as choose to die in his son’s, in whom he affects a sort of immortality, in specie, quando non potest in individuo [in kind when not able in the individual]; but a king does not love his subjects with a natural or fatherly love thus; and if the affections differ, the power which seconds the affection, for the conservation either of being, or well-being, must also differ proportionally.</p></blockquote>

</figure><figure class="quote" id="q-3914f57ffb" data-kw="">
<blockquote><p>…hereafter provision must be made for spiritual ministers, who may instruct the sick in faith towards God, and comfort them up with hope of salvation, and take care of their souls, whom the Preservers [specially appointed civil officials for the plague] shall so choose in every parish, that they take not to so weighty a matter, whosoever comes first to hand, but such as they shall have known to be singularly given unto godliness, holiness, sobriety, and chastity… But if, peradventure, there can no such be found among the ordinary ministers, out of the rest of the people there must be chosen such, which come unto the next degrees of the foresaid virtues. For in this miserable time the things of most perfection come not always to be had. Therefore, as they say, ‘As we can, when as we would we may not.’ When such at length are chosen, whom the Preservers shall have judged meet and sufficient for every parish, it may not by any means be suffered that they go to any other than such as being taken with the plague, require their help. For I have said before, and say still, that not only the outward and common infectious air, but also contagious breaths and infectious breathings, or blowings, which are gathered and afterwards imparted to the whole: and others that are sick by the keepers, by such as sit by them, by the ministers of the church going hither and thither and standing by the infected, yea many times also by them that are dead, ought specially to be avoided. Which thing, when as by daily experience we are taught, and have proved also unto us to be true, by all means we have to take heed, lest that we leave the cause of this so great a disease in others, whom with all diligence we have, for fear of infection, put apart. Hereunto you may add, which we have oftentimes no less experience of, that many sick persons also (I speak not of such as are infected with the plague), albeit they be not infected with the company of such ministers, yet they will nevertheless refuse their presence for fear of the infection. Whereupon also this inconvenience will arise, yet they had rather receive never so simple comfort at the hands either of some of their own household, who for the most part are unmeet for this purpose, or else die alone than to undergo a double mischief…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books</cite>, … (London, 1583), bk. 1, ch. 5, ‘Of the Ministers of the Church’, pp. 19-20</span></figcaption>

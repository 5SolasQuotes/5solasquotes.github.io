<main class="wrap"><figure class="quote" id="q-19f44e6044" data-kw="">
<blockquote><p>Some make a mockery of the holy things of God. One part of the year they will be holy; a rotten, foolish affection of people that are popish. In Lent they will use a little austerity, oh! they will please God wondrously! but before and after they are devils incarnate. So they make that part of the year as a good parenthesis, in an unlearned and unwitty speech. A good parenthesis is unseemly in a wicked speech, and a good piece is unseemly in a ragged garment; so their lives that make a good show then (and there are few that do so, they are scarce among us; men are such atheists that there is not outward reformation, but if there be), if they give themselves leave to be civil, and to respect holy things a little time, afterward they return to their looseness again. Doth this patching out of a holy life please God? No, no! ‘I have sworn, and I will perform it, that I will keep thy righteous statutes,’ saith David, Ps. 119:106. And St Paul, ‘I have resolved to be so to the end;’ I will be myself still. So where grace is, there is a resolution against all sin for the time to come. If you entertain not this resolution, to walk ‘in holiness and righteousness all the days of your life,’ Luke 1:75, acknowledge no benefit by Christ’s redemption, and come not near the holy things of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Complete Works of Richard Sibbes, vol. 3 (Edinburgh; London; Dublin: James Nichol; James Nisbet and Co.; W. Robertson, 1862), 313.</cite></span></figcaption>

<blockquote><p>That they [Romanists] cry up a private, unproved, unwritten tradition of their own, as of equal authority with this safe and full rule, which is contained in this written Word of God. Their crime and fault may be considered, partly with respect to the object and matter; that these traditions are not indifferent customs, but essential points necessary to faith and christian practice. And so though a Christian be never so through and sound in his obedience to the Word of God, and true to the baptismal covenant, yet if he submits not to these unwritten traditions, he wants [lacks] some point necessary to faith and practice, and so to life eternal: which is contrary to Mark 16:16. “He that believes and is baptized, shall be saved; and he that believes not, shall be damned.” And John 17:3.” This is life eternal, to know you the only true God, and Jesus Christ whom you have sent.” Partly as to the subject, as they make their own faction to be the only keepers of these things; and that nothing is to be owned as apostolic tradition, but what is delivered as such by their authority; which is to leave the church to the tyranny and usurpation of a corrupt faction; to declare for apostolic tradition any thing which serves their end and interest, and for which no true historical evidence is produced. Now the unjust and fraudulent practices which they have used, to promote this usurpation over the churches of Christ, render them false men, most unfit to be trusted in this kind. Partly with respect to the manner, they will have these things to be received, pari reverentia et pietatis affectu, with the same reverence and pious affection with which we receive the Holy Scriptures; and so man’s post is set by God’s, and unproved traditions equaled with doctrines of faith. Their opinion is bad enough, but their practice is worse. For there they show they value these things more than the Scriptures. As superstition always abounds in its own things. Did ever any of their doctors [teachers] say the same things of traditions, which they take the boldness to say of Scripture? Did they ever call them pen and inkhorn, or parchment divinity, a nose of wax, a dumb rule, an obscure and ambiguous doctrine? These Blasphemies they vent boldly against the Scriptures: but did they ever speak these of traditions? And again, their common people are a thousand times better instructed in their traditions, than in the doctrine of salvation. They skill more of Lent, and Ember-weeks, etc. than they truly understand the doctrine of man’s misery and remedy. And call you this reverence and pious affection to the Scriptures and traditions? Partly because they would never give us a catalogue of unwritten traditions, necessary to be observed by all Christians; It may be lest they should amaze the people with the multitude of them, or else that the people may not know how many of their doctrines are destitute of Scripture proof, and so they plainly be discovered to be imposers on the belief of the Christian world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>XVIII Sermons on the Second Chapter of the 2nd Epistle to the Thessalonians… (London, 1679), 340–42 [Spelling and punctuation modernized].</cite></span></figcaption>

<blockquote><p>21. Neither are they for stated anniversary feasts or fasts, which are sadly profaned and abused among the Romanists, for at least the superstitious unthinking vulgar make little other use of them than for rioting and raveling, sporting and gamming, and other such dissolute practices, highly unbeseeming days that pass under the character and opinion of holy-days: Yet when emergencies and dispensations of providence occur that call for public humiliation and fasting, or solemn Thanksgiving, they think it their duty to consecrate some part of their time for fasts and thanksgivings, devoutly to deprecate God’s imminent wrath, and to plead the aversion of impendent judgments due to them for their sins, or to praise God for benefits received and to beg further favors; These being such pieces of religious work which God both by his Word and providence sometimes requires. Geneva: Treatise of Fasting; Acts of the Assembly, 1645. ss: Vlt.</p></blockquote>

<blockquote><p>At that time the superstitious observance of Lent had prevailed everywhere, because the common people thought that in it they were doing some exceptional service to God, and the pastors commended it as a holy imitation of Christ. On the contrary, it is plain that Christ did not fast to set an example for others, but to prove, in so beginning to proclaim the gospel, that it was no human doctrine but actually one sent from heaven [Matt. 4:2]. And the marvel is that such sheer hallucination (which is refuted so often and with such clear arguments) could creep upon men of keen judgment. For Christ does not fast often—as he would have to do if he had willed to lay down a law of yearly fasting—but only once, when he girded himself for the proclamation of the gospel. Nor does he fast in human fashion, as would have been fitting if he willed to arouse men to imitate him; but he shows an example rather to transport all men to admiration of him than to arouse them with zeal to imitate him. Finally, his reason for fasting was not different from that which Moses performed when he received the law at the Lord’s hand [Ex. 24:18; 34:28]. For since that miracle was manifested in Moses to establish the authority of the law, it ought not to have been omitted in Christ, lest the gospel seem to yield to the law. But since that time it never entered any man’s mind, on the excuse of following Moses, to establish such a form of fasting among the people of Israel. And none of the holy prophets and patriarchs followed it, even when they had enthusiasm and zeal enough for all pious exercises. For the statement that Elijah went forty days without food and drink [1 Kings 19:8] only served to apprise the people that he had been raised up to restore the law, from which almost all Israel had departed. It was, therefore, mere wrongheaded zeal, full of superstition, that they justified and painted fasting as the following of Christ. However, there was amazing diversity in the manner of fasting, as Cassiodorus relates from the ninth book of Socrates’ history. For the Romans (he says) had only three weeks, but for them the fast was continuous, except on Sunday and Saturday. The Illyrians and Greeks had six; others, seven; but fasting was at intervals. They differed as much in choice of foods: some ate only bread and water; others added vegetables; still others did not abstain from fish and fowl; others made no distinction in foods. Augustine also mentions this difference in his second letter to Januarius</p></blockquote>

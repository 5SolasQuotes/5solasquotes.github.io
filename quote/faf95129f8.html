<blockquote><p>Q. What is the second thing that the Scripture teacheth concerning God?

A. What God is, viz. a Spirit. • 1 Most simple, without mixture, or composition. • 2 Eternal, without beginning, or end. • 3 Infinite, without comprehension of place, or thought. • 4 Constant, without shadow of change. • 5 Absolute, in power, holiness, and glory.

Q. How then can he be known of us, being incomprehensible?

A. We only see his back parts, not his face, and conceive of him by his names, expressing what an one he is to us; not in his glorious nature, only known unto himself.

Q. What is the third thing which is taught us concerning God?

A. That there is only one God and no more; as also both nature teacheth, guiding all things to one principle; and reason acknowledgeth, admitting but one that is infinite, and independent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-crooke.html">Samuel Crooke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The guide unto true blessedness. Or, A body of the doctrine of the Scriptures, directing man to the saving knowledge of God</cite>, (London: John Pindley, 1613), pp 7-8.</span></figcaption>

<blockquote><p>In general, that God is perfect and perfectly blessed, I suppose will not be denied; it cannot be but by denying that he is God. He that is not perfect in himself and perfectly blessed is not God. To that which is perfect in any kind nothing is wanting in that kind. To that which is absolutely perfect nothing is wanting at all. He who is blessed is perfectly satisfied and filled, and hath no farther desire for supply. He who is blessed in himself is all-sufficient for himself. If God want or desire any thing for himself, he is neither perfect nor blessed. To ascribe, then, affections to God properly (such as before mentioned), is to deprive him of his perfection and blessedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined</cite>, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; 16 vols, Edinburgh: Banner of Truth, 1966), xii, 109.</span></figcaption>

<blockquote><p>But let us hear what reasons may be alleged to the Universality of redemption: I. Ezekiel 33. v. 11. As I live saith the Lord, I will not the death of the wicked: but, that the wicked return from his wicked way. Answ. The place is to be understood not simply but in respect; of the twain God rather wills the repentance of the sinner then his death. Again, he wills not death as it is the destruction of his creature; and so this place may be understood: yet nevertheless he wills the same as it is a means of manifestation of his justice: and therefore the prophet Esai saith, that God createth evil.

II. 1. Tim. 2. God would have all men to be saved and come to the acknowledgement of the truth. Ans. The place is meant not of the persons of all particular men, but of the orders and kinds of men. For in the first verse Paul exhorted Timothy that prayer should be made for all men: and in the second verse opening his own meaning, he addeth these words, for kings and all that be in authority: as though he should say, we must pray not only for private men and for the common people, but also for public persons, though they persecute the Gospel. But why? because in that very order God hath his elect which shall be saved. And on this manner Paul expounds himself elsewhere. There is neither Jew nor Grecian: there is neither bond nor free: there is neither male nor female: for ye are all one in Christ.

III. Rom. 11. v. 32. God hath shut up all in unbelief that he might have mercy on all. Ans. The word all, must be understood of all that are to be saved, both of Jews and Gentiles, as the article added to all importeth, and the meaning is, that God will save all whom he purposeth to save of his mercy, and not of their merit, because all are sinners as well Jews as Gentiles: thus Paul expounds himself, Galat. 3.22. The scripture hath concluded all under sin, that the promise by the faith of Jesus Christ should be given to them that believe. And if we should expound the word all, for every particular man, as some would have it, Paul must contradict himself, who said before that God would have mercy on whom he will have mercy, and whom he will he hardeneth, and in this very chapter his drift is to prove the rejection of the Jews, and the calling of the Gentiles.

IV. Joh. 3. 16. God so loved the world that he hath given his only begotten son, that whosoever believeth in him shall not perish but have everlasting life: and Joh. 6.51. I will give my flesh for the life of the world. Answ. By world, we must not understand every particular man in the world, but the Elect among the Jews and Gentiles: for in both these places Christ doth overthwart the conceit of the Jews, which thought that they alone were loved of God, and not the Gentiles. And how this word is to be understood in the new testament, Paul doeth fully declare. Rom. 11. v. 12. If (saith he) the fall of them, that is, the Jews, be the riches of the world, and the diminishing of them the riches of the Gentiles, &amp;c. and v. 15. If the casting away of them be the reconciling of the world, what shall the receiving be but life from the dead. Where by the world, he understands the body of the Gentiles in the last age of the world. And thus he fully declares his own meaning, when he saith to the Corinthians, God was in Christ reconciling the world unto himself.

V. Rom. 14. v. 15. Destroy not him with thy meat for whom Christ dyed. 2. Pet. 2.1. Denying the Lord that bought them, and bring upon themselves swift damnation. Therefore Christ died for them also which are condemned. Answ. The reason is not good. For in these and such like places the scripture speaks of men, not as they are indeed before God, but as they are in appearance and profession, and as they are in the acceptation with men. For so long as a man holds and embraces the Christian faith, so long in the judgement of charity we must esteem him to be one that is redeemed by Christ, though indeed he be not. And this is the meaning of Peter when he saith, that false prophets deny the Lord that bought them.

VI. In the preaching of the gospel grace is freely offered not only to the Elect, but to all men indifferently: and God in offering grace deludes no man: and therefore Christ’s death appertains and belongs to all men indifferently. Answer. The preaching of the Gospel is an ordinance of God appointed for the gathering together and the accomplishment of the number of the elect: and therefore in the ministerial of the word, grace and salvation is offered principally and directly to the elect; and only by consequent to them which are ordained to just damnation: because they are mingled with the elect in the same societies: and because the ministers of God, not knowing his secret counsel, in charity think all to be elect. And though God in offering grace do not confer it to all, yet is there no delusion. For the offering of grace doth not only serve for the conversion of a sinner, but also to be an occasion by men’s fault of blinding the mind and hardening the heart, and of taking away excuse in the day of judgement.

To conclude this point; Universal redemption of all men, we grant: the Scripture saith so: and there is an universality among the elect and believers: but universal Redemption of all and every man as well the damned as the elect and that effectually, wee renounce as having neither footing in the scripture, nor in the writings of any ancient and orthodox divine, for many hundred years after Christ, his words not depraved and mistaken.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), pp 479-80.</span></figcaption>

+he+purposeth+to+save+of+his+mercy%2C+and+not+of+their+merit%2C+because+all+are+sinners+as+well+Jews+as+Gentiles%3A+thus+Paul+expounds+himself%2C+Galat.+3.22.+The+scripture+hath+concluded+all+under+sin%2C+that+the+promise+by+the+faith+of+Jesus+Christ+should+be+given+to+them+that+believe.+And+if+we+should+expound+the+word+all%2C+for+every+particular+man%2C+as+some+would+have+it%2C+Paul+must+contradict+himself%2C+who+said+before+that+God+would+have+mercy+on+whom+he+will+have+mercy%2C+and+whom+he+will+he+hardeneth%2C+and+in+this+very+chapter+his+drift+is+to+prove+the+rejection+of+the+Jews%2C+and+the+calling+of+the+Gentiles.%0A%0AIV.+Joh.+3.+16.+God+so+loved+the+world+that+he+hath+given+his+only+begotten+son%2C+that+whosoever+believeth+in+him+shall+not+perish+but+have+everlasting+life%3A+and+Joh.+6.51.+I+will+give+my+flesh+for+the+life+of+the+world.+Answ.+By+world%2C+we+must+not+understand+every+particular+man+in+the+world%2C+but+the+Elect+among+the+Jews+and+Gentiles%3A+for+in+both+these+places+Christ+doth+overthwart+the+conceit+of+the+Jews%2C+which+thought+that+they+alone+were+loved+of+God%2C+and+not+the+Gentiles.+And+how+this+word+is+to+be+understood+in+the+new+testament%2C+Paul+doeth+fully+declare.+Rom.+11.+v.+12.+If+%28saith+he%29+the+fall+of+them%2C+that+is%2C+the+Jews%2C+be+the+riches+of+the+world%2C+and+the+diminishing+of+them+the+riches+of+the+Gentiles%2C+%26c.+and+v.+15.+If+the+casting+away+of+them+be+the+reconciling+of+the+world%2C+what+shall+the+receiving+be+but+life+from+the+dead.+Where+by+the+world%2C+he+understands+the+body+of+the+Gentiles+in+the+last+age+of+the+world.+And+thus+he+fully+declares+his+own+meaning%2C+when+he+saith+to+the+Corinthians%2C+God+was+in+Christ+reconciling+the+world+unto+himself.%0A%0AV.+Rom.+14.+v.+15.+Destroy+not+him+with+thy+meat+for+whom+Christ+dyed.+2.+Pet.+2.1.+Denying+the+Lord+that+bought+them%2C+and+bring+upon+themselves+swift+damnation.+Therefore+Christ+died+for+them+also+which+are+condemned.+Answ.+The+reason+is+not+good.+For+in+these+and+such+like+places+the+scripture+speaks+of+men%2C+not+as+they+are+indeed+before+God%2C+but+as+they+are+in+appearance+and+profession%2C+and+as+they+are+in+the+acceptation+with+men.+For+so+long+as+a+man+holds+and+embraces+the+Christian+faith%2C+so+long+in+the+judgement+of+charity+we+must+esteem+him+to+be+one+that+is+redeemed+by+Christ%2C+though+indeed+he+be+not.+And+this+is+the+meaning+of+Peter+when+he+saith%2C+that+false+prophets+deny+the+Lord+that+bought+them.%0A%0AVI.+In+the+preaching+of+the+gospel+grace+is+freely+offered+not+only+to+the+Elect%2C+but+to+all+men+indifferently%3A+and+God+in+offering+grace+deludes+no+man%3A+and+therefore+Christ%E2%80%99s+death+appertains+and+belongs+to+all+men+indifferently.+Answer.+The+preaching+of+the+Gospel+is+an+ordinance+of+God+appointed+for+the+gathering+together+and+the+accomplishment+of+the+number+of+the+elect%3A+and+therefore+in+the+ministerial+of+the+word%2C+grace+and+salvation+is+offered+principally+and+directly+to+the+elect%3B+and+only+by+consequent+to+them+which+are+ordained+to+just+damnation%3A+because+they+are+mingled+with+the+elect+in+the+same+societies%3A+and+because+the+ministers+of+God%2C+not+knowing+his+secret+counsel%2C+in+charity+think+all+to+be+elect.+And+though+God+in+offering+grace+do+not+confer+it+to+all%2C+yet+is+there+no+delusion.+For+the+offering+of+grace+doth+not+only+serve+for+the+conversion+of+a+sinner%2C+but+also+to+be+an+occasion+by+men%E2%80%99s+fault+of+blinding+the+mind+and+hardening+the+heart%2C+and+of+taking+away+excuse+in+the+day+of+judgement.%0A%0ATo+conclude+this+point%3B+Universal+redemption+of+all+men%2C+we+grant%3A+the+Scripture+saith+so%3A+and+there+is+an+universality+among+the+elect+and+believers%3A+but+universal+Redemption+of+all+and+every+man+as+well+the+damned+as+the+elect+and+that+effectually%2C+wee+renounce+as+having+neither+footing+in+the+scripture%2C+nor+in+the+writings+of+any+ancient+and+orthodox+divine%2C+for+many+hundred+years+after+Christ%2C+his+words+not+depraved+ <blockquote><p>Whether there were any flat necessity of man’s suffering after the Fall is doubted by many and denied by Socinus. Whether this necessity arises from God’s natural justice, or his ordinate, viz. his decree, and the verity of the threatening, is also with many of our own divines a great dispute: Whether God might have pardoned sin if He had not said, ‘The sinner shall die,’ may be doubted of (though I believe the affirmative, yet I judge it a frivolous presumptuous question. But the word of his threatening being once past, methinks it should be past question that He cannot absolutely pardon without the apparent violation of his truth, or wisdom. Some think that it proceeds from his wisdom rather than his justice, that man must suffer: see Mr. John Goodwin, Of Justification, pt. 2, p. 34), but why should we separate what God has conjoined? However, whether wisdom, or justice, or truth (or rather all these) were the ground of it, yet certain it is that a necessity there was that the penalty should be inflicted: or else the Son of God should not have made satisfaction, nor sinners bear so much themselves.</p></blockquote>

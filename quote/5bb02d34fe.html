<main class="wrap"><figure class="quote" id="q-5bb02d34fe" data-kw="">
<blockquote><p>Calvin, Beza, yea, all our writers condemn blind obedience as brutish… …concerns his conscience, knowing that he must do it in faith as he does all his moral actions; Ergo [Therefore], the magistrate must examine what he practices in his office, according to the Word, and must not take it upon the mere authority of the Church, else his faith in these moral acts of his office should be resolved ultimately on the authority of the Church, not on the Word of God, which no doubt is Popery; for so the warrant of the magistrate’s conscience should not be, ‘Thus saith the Lord,’ but ‘Thus saith the Church in their decrees.’ … 2. It’s against Scripture and reason that… all others, should obey the decrees of the Church with a blind faith, without inquiring in the warrants and grounds of their decrees, which is as good Popery as magistrates and all men are to believe as the Church believes with an implicit faith; so ignorance shall be the mother of devotion; Whoever impute[s] this to us, who have suffered for non-conformity, and upon this ground, that synods can err… … Thus they are servants and slaves who are obliged to follow the judgment of councils absolutely, without limitation; and because they say it, whether they warrant their decrees by the Word of God or not, that is a true major proposition: But now the assumption is most false, for neither magistrates nor any other are to follow the judgment of the Church absolutely, without limitation, and because they say it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), pp. 595-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><figure class="quote" id="q-59fc4a82a3" data-kw="">
<blockquote><p>By which it does manifestly appear that they would bear dominion over our consciences, not as lords only, by requiring the willing and ready assent of our consciences to those things which are urged upon us by their sole will and authority, but even as tyrants, not caring if they get so much as constrained obedience, and if by their authority they can compel conscience to that which is contrary to the [Greek] and full persuasion which it has conceived. It will be said that our consciences are in an error, and therefore ought to be corrected by the sentence of superiors, whose authority and will does bind us to receive and embrace the ceremonies, though our consciences do condemn them. Answer: Giving and not granting that our consciences do err in condemning the ceremonies, yet so long as they cannot be otherwise persuaded, the ceremonies ought not to be urged upon us, for if we be made to do that which our consciences do condemn, we are made to sin. Rom. 14:23. It is an audacious contempt in Calvin’s judgment to do any thing repugnante conscientia.</p></blockquote>

</figure><figure class="quote" id="q-90e3438abf" data-kw="">
<blockquote><p>Out of all which, I conclude that no law as a law does oblige the conscience, but that which has from the matter moral equity, and not from the intention of the lawgiver, as Cajetan, Silvester, Angelus and Corduba teach, which intention must take a rule from the matter of the law, and not give a rule. Gerson, no law (says he) is a law to be called as necessary to salvation (as all good laws should be) but that which de jure divino, is according to God’s law… And therefore his [Durandus’s] mind is that all obligation of conscience in human commandments comes from God’s will and law, that is, from the just and necessary matter of the law, not from the will of men.</p></blockquote>

<blockquote><p>2. Rash [Schisms]. 1. Where a ground and cause is pretended, but it is but a light cause. Possibly… some corruptions in or about the worship of God, but those not destructive to the ordinances, being not in substance, but in ceremony; and those such as the person offended is not enforced to be active in… Now in this case to separate, it is a rash separation, because it is upon a ground not sufficient, a light ground.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brinsley-jr.html">John Brinsley Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Araignment of the Present Schism of New Separation in Old England… (London: John Field, 1646) Brinsley (1600-1665) was an English nonconforming presbyterian clergyman and an ejected minister in 1662.</cite>, pp. 24-25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a79e38bdde" data-kw="">
<blockquote><p>If head-coverings were by a sovereign, positive, religious appointment, Paul might be expected to condemn their misuse as disobedience, lawlessness, a transgression, sin, iniquity or idolatry, possibly on par with… Saul’s religious treason (1 Sam. 15), Nadab and Abihu’s debacle (Lev. 10) or some of the Colossians’ and Galatians’ will-worship (Col. 2:16–23; Gal. 4:8–11). Instead his language is far different: Paul speaks of dishonor ([1 Cor. 11] v. 4), shame (vv. 6, 14), custom (v. 16), comeliness (v. 13), glory (v. 15) (also “becometh” in 1 Tim. 2:9–10), appeals for persons to judge within themselves (v. 13), and speaks of disagreements herein involving contention (v. 16). Peter associates women’s modest hair with an “ornament” and being “chaste” (1 Pet. 3:2–4). All these factors are common to nature’s light and society, arising therefrom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>1 Corinthians – Head Coverings are Not Perpetual &amp; they were Hair-Buns, with or without Material: Proven (RBO, 2022), pt. 1, ch. 5, ‘1 Corinthians 11’, ‘A Matter of Decorum, Not Necessarily Sin’</cite>, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>4. Zepperus, On the Sacraments, ch. 13, fol. 324-26, 328. 1. The furious clamors and persecutions of the Papists did not permit this reformation of ceremonies at the first: which were so violent and bloody, that it gave small or no leisure to the teachers and lights of the Church, neither was it safe for them to bend their care or cogitations this way. 2. The people were so drowned in the deep darkeness and idolatry of the Papacy that the amendment of ceremonies, and of external worship could not in those beginnings be undertaken. It was necessary to use doctrine, and to instruct the people of sundry and horrible errors, idolatry, superstitions and abuses, which the whole Papacy and Popish ceremonies have in their departure, that so all those ugly things might first be removed out of their minds, before they were removed from their sight. That which is not the work of one year, but a task of long season: For as ceremonies which are visible things and apprehended by the eyes do more affect and move than the invisible doctrine; So the people did closely stick to their accustomed ceremonies, and opposed themselves vehemently against the reformation of them: Even as we see at this day to come to pass, when as yet sound doctrine has prevailed and flourished for above these 80 years. 3. The Church in Popery was nothing else but a sick body: In which from the sole of the foot to the crown of the head, there was nothing sound and entire: Wherefore at the first beginning of reformation that whole chaos and abomination of error, and of Popish idolatry could not suddenly be perceived, but use and experience did daily manifest and teach every day more, than at the first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623) | ‘Reformed Practices’</cite>, pp. 173-74</span></figcaption>

</figure><figure class="quote" id="q-98709b5b6d" data-kw="">
<blockquote><p>That the Word and sacraments are not administered rightly and exactly, secundum [in Latin], as altogether agreeing with the prescript of the Lord, no not in all the world; yet albeit they be not administred according to that exact rule, and by reason of our frailty cannot be suddenly reformed, yet may they be so performed that they may be pleasing unto God and healthfull to the Church, yet so as the defect should be lamented and acknowledged; which point if it be not granted, there will be no pure or true Church in all the world; Zachary Ursinus, Catechism, pt. 2, to question 84, fol. 620. That albeit many evil things do go along and be done, yet these things are done by such as hinder reformation, and by the disobedient; not by such as wish and sue for amendment: For ‘blessed are they who hunger and thirst after righteousness,’ Mt. 5:6, (that is) which do desire good things to be done in the Church, which if they be not done it is not their fault: they may in that case retain a good conscience; Ursinus, ibid., fol. 618.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623) | ‘Reformed Practices’</cite>, pp. 119-20</span></figcaption>

<blockquote><p>V. 1, ‘And Nadab and Abihu’ — These jolly young priests, overjoyed haply of their new employment and overwarmed with wine, as some gather out of Lev. 10:9, over did themselves the very day of their service, Lev. 10:19 and are suddenly surprised by a doleful death. … V. 16, ‘And Moses diligently sought the goat of the sin offering, and, behold, it was burnt: and he was angry with Eleazar and Ithamar, the sons of Aaron’ Passion for their dead friends had so transported the priests that they knew not well what they did… but then it must not be excessive as here, and as 2 Sam. 18:33. … V. 18, ‘Behold, the blood of it was not brought in within the holy (place): ye should indeed have eaten it in the holy (place), as I commanded.’ Thus, by misreckoning a point, ye have missed the haven and hazarded yourselves to the rocks of the divine displeasure, against which your brethren so lately split.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-trapp.html">John Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary, on Lev. 10</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“V. 1, ‘And Nadab and Abihu’ — These jolly young priests, overjoyed haply of their new employment and overwarmed with wine, as some gather out of Lev. 10:9, over did themselves the very day of their service, Lev. 10:19 and are suddenly surprised by a doleful death. … V. 16, ‘And Moses diligently sought the goat of the sin offering, and, behold, it was burnt: and he was angry with Eleazar and Ithamar, the sons of Aaron’ Passion for their dead friends had so transported the priests that they knew not well what they did… but then it must not be excessive as here, and as 2 Sam. 18:33. … V. 18, ‘Behold, the blood of it was not brought in within the holy (place): ye should indeed have eaten it in the holy (place), as I commanded.’ Thus, by misreckoning a point, ye have missed the haven and hazarded yourselves to the rocks of the divine displeasure, against which your brethren so lately split.”

— John Trapp, Commentary, on Lev. 10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CV.+1%2C+%E2%80%98And+Nadab+and+Abihu%E2%80%99+%E2%80%94+These+jolly+young+priests%2C+overjoyed+haply+of+their+new+employment+and+overwarmed+with+wine%2C+as+some+gather+out+of+Lev.+10%3A9%2C+over+did+themselves+the+very+day+of+their+service%2C+Lev.+10%3A19+and+are+suddenly+surprised+by+a+doleful+death.+%E2%80%A6+V.+16%2C+%E2%80%98And+Moses+diligently+sought+the+goat+of+the+sin+offering%2C+and%2C+behold%2C+it+was+burnt%3A+and+he+was+angry+with+Eleazar+and+Ithamar%2C+the+sons+of+Aaron%E2%80%99+Passion+for+their+dead+friends+had+so+transported+the+priests+that+they+knew+not+well+what+they+did%E2%80%A6+but+then+it+must+not+be+excessive+as+here%2C+and+as+2+Sam.+18%3A33.+%E2%80%A6+V.+18%2C+%E2%80%98Behold%2C+the+blood+of+it+was+not+brought+in+within+the+holy+%28place%29%3A+ye+should+indeed+have+eaten+it+in+the+holy+%28place%29%2C+as+I+commanded.%E2%80%99+Thus%2C+by+misreckoning+a+point%2C+ye+have+missed+the+haven+and+hazarded+yourselves+to+the+rocks+of+the+divine+displeasure%2C+against+which+your+brethren+so+lately+split.%E2%80%9D%0A%0A%E2%80%94+John+Trapp%2C+Commentary%2C+on+Lev.+10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3b792111be.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3b792111be.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=V.%201%2C%20%E2%80%98And%20Nadab%20and%20Abihu%E2%80%99,which%20your%20brethren%20so%20lately%20split." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

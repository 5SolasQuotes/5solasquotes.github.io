<main class="wrap"><figure class="quote" id="q-4fd52be3d7" data-kw="">
<blockquote><p>I am to recall your minds — it may seem somewhat brusquely — to the contemplation of the duty of the Sabbath; and to ask you to let them rest for a moment on the bald notion of authority. I do not admit that, in so doing, I am asking you to lower your eyes. Rather, I conceive myself to be inviting you to raise them; to raise them to the very pinnacle of the pinnacle. After all is said, there is no greater word than “ought.” And there is no higher reason for keeping the Sabbath than that I ought to keep it; that I owe it to God the Lord to keep it in accordance with His command.

It may nevertheless require some little effort to withdraw our thoughts even for a moment from the utility of the Sabbath and fix them on its bare obligation. Since Prudhon taught the world the natural value of the Sabbath, its supernatural origin and sanction have, in wide circles, passed perhaps somewhat out of sight. In its abounding usefulness to man, it may seem so obviously man’s day that we may easily forget that it was for two thousand years before it was discovered to be man’s day already the Lord’s day; and, stretching back from that, from the creation of the world God’s day. The Sabbath is undoubtedly rooted in nature; in our human nature and in the nature of the created universe. Unbroken toil is not good for us: the recurrence of a day of rest is of advantage to us, physically, mentally, spiritually.

But had we been left to find this out for ourselves, we should probably have waited very long for it. Certainly Prudhon tardily learned it from observation, not of pure nature, but of the Sabbath-rest ordained by God. We are told on the highest authority that “the Sabbath was made for man.” Man needs it. It blesses his life. But man apparently would never have had it, had it not been “made” for him; made for him by Him Who from the beginning of the world has known all His works, and, knowing man, has made for him from the beginning of the world the day of rest which he needs. He Who needed no rest, in the greatness of His condescension, rested from the work which He had creatively made, that by His example He might woo man to his needed rest.

The Sabbath, then, is not an invention of man’s, but a creation of God’s. … It is Jehovah who made the Sabbath; though for man, the Sabbath is not of man, but has come to man as a gift from God Himself. And, as God has made it, so He has kept it, as He has kept all else that He has made, under His own hand. It is in the power of no man to unmake the Sabbath, or to remake it—diverting it from, or, as we might fondly hope, adjusting it better to, its divinely appointed function. What God has made it, that will He Himself see that it shall remain. This in effect our Saviour tells us in that very saying to which we have already alluded. For, immediately upon declaring that “the Sabbath was made for man”—with the open implication, of course, that it was by God that it was made for man—He proceeds to vindicate to Himself the sole empire over it. “So that,” He adds, “the Son of Man is Lord even of the Sabbath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Foundations of the Sabbath in the Word of God in Duncan J. McMillan, et al</cite></span></figcaption>

</figure><figure class="quote" id="q-25ed8c8b04" data-kw="">
<blockquote><p>Man, as a condemned sinner, can obtain nothing from God on his own account. He lies under the curse of a broken law; exposed to everlasting perdition. God can be to him only a consuming fire. There is an impassible barrier between such a man and God. There can be no communication between the holy and the unclean.

The prayers of the wicked are an abomination in the sight of God. He is surrounded with such an atmosphere of holiness, that the breathings of an impure spirit cannot reach him. There is only one channel of communication between the sinner and God, and that is Christ.

When God looks upon us, he can see nothing to approve. In his sight we are altogether as an unclean thing; even our righteousnesses are as filthy rags. Our holiest services are polluted in his sight. But there is a Day’s Man between us who is able to lay his hand upon both. Our prayers cannot come up before God with acceptance, but the angel of the everlasting covenant stands before the throne, with his golden vial, and He, the everlasting intercessor, pours from it the prayers of the saints, he perfumes them with the sacred incense of his own holiness, and they come up as a sweet savour before the Father. Thus it is that our prayers are all offered up for Christ’s sake, and it were well that we fully understood and deeply felt what is implied in the use of these most significant words.

There is reason to fear that many a prayer wafted heavenward remains unanswered, because the grand condition of all acceptable prayer is not fully felt as it ought to be! Men pray as if they had a right to ask, and a title to expect, favours from God, on their own independent footing. There is much trusting to his goodness and forbearance, and mercy, forgetful all the while, that God can only hear through the intercessor before the throne, and can only manifest his goodness through the one mediator, the man Christ Jesus.

When we ask of God, for Christ’s sake, the bestowment of any blessing, it were well that the truth were blazoned before the eye of our inner consciousness, that we cannot be accepted save in the beloved; that if God looks directly at us, we are condemned; that he can only be well pleased when he looks on us in the face of his anointed—when he beholds in the lamb that had been slain justice fully satisfied, and in the lamb now alive and living for ever more, the evidence of his own sealed and irrefragable covenant.

When we ask anything for Christ’s sake, we acknowledge that we are not worthy in ourselves to receive it—when we plead the name of Jesus, we acknowledge our own guilt, and proclaim him the sole ground of our hope —when we point to him, we entreat God not to look upon us—we renounce our own righteousness—we confess our own shame—we plead for a standing in Jesus—we claim an interest in his work—we profess to stand in his righteousness —to hope for mercy through his peace-speaking blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Believing Prayer Heard and Answered in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

uch+trusting+to+his+goodness+and+forbearance%2C+and+mercy%2C+forgetful+all+the+while%2C+that+God+can+only+hear+through+the+intercessor+before+the+throne%2C+and+can+only+manifest+his+goodness+through+the+one+mediator%2C+the+man+Christ+Jesus.%0A%0AWhen+we+ask+of+God%2C+for+Christ%E2%80%99s+sake%2C+the+bestowment+of+any+blessing%2C+it+were+well+that+the+truth+were+blazoned+before+the+eye+of+our+inner+consciousness%2C+that+we+cannot+be+accepted+save+in+the+beloved%3B+that+if+God+looks+directly+at+us%2C+we+are+condemned%3B+that+he+can+only+be+well+pleased+when+he+looks+on+us+in+the+face+of+his+anointed%E2%80%94when+he+beholds+in+the+lamb+that+had+been+slain+justice+fully+satisfied%2C+and+in+the+lamb+now+alive+and+living+for+ever+more%2C+the+evidence+of+his+own+sealed+and+irrefragable+covenant.%0A%0AWhen+we+ask+anything+for+Christ%E2%80%99s+sake%2C+we+acknowledge+that+we+are+not+worthy+in+ourselves+to+receive+it%E2%80%94when+we+plead+the+name+of+Jesus%2C+we+acknowledge+our+own+guilt%2C+and+proclaim+him+the+sole+ground+of+our+hope+%E2%80%94when+we+point+to+him%2C+we+entreat+God+not+to+look+upon+us%E2%80%94we+renounce+our+own+righteousness%E2%80%94we+confess+our+own+shame%E2%80%94we+plead+for+a+standing+in+Jesus%E2%80%94we+claim+an+interest+in+his+work%E2%80%94we+profess+to+stand+in+his+righteousness+%E2%80%94to+hope+for+mercy+through+his+peace-speaking+blood.%E2%80%9D%0A%0A%E2%80%94+William+Wilson%2C+Believing+Prayer+Heard+and+Answered+in+The+Free+Church+Pulpit%3B+Consisting+of+Discourses+by+the+Most+Eminent+divines+of+the+Free+Church+of+Scotland.+Vol.+I.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F25ed8c8b04.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/25ed8c8b04.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/09/21/william-wilson-on-the-acceptance-of-our-prayers-for-christs-sake/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

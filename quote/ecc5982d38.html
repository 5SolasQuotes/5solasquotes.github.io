<main class="wrap"><figure class="quote" id="q-ecc5982d38" data-kw="">
<blockquote><p>XIV. Although certain ordinations of the apostles (which referred to the rites and circumstances of divine worship) were variable and instituted only for a time (as the sanction concerning the not eating of blood and of things strangled [Acts 15:20]… because there was a special cause and reason for them and (this ceasing) the institution itself ought to cease also; still there were others invariable and of perpetual observance in the church, none of which were founded on any special occasion to last only for a time by which they might be rendered temporary…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. Dennison, Institutes of Eclenctic Theology, vol. 2, Eleventh Topic, ‘The Law of God’, Question 14, ‘The Lord’s Day’, p. 95 (d. 1687)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-30a0357d09" data-kw="">
<blockquote><p>For first although there be accidents or certain adjuncts of worship, yet there is no worship to be simply called accidental, because it has in it the very essence of worship. Secondly, as the least commands of God—even to iotas and tittles—are religiously to be observed (Mat. 5:18-19), so additions which seem very small are by the same reason to be rejected. Thirdly, Moses does seal up even those laws of the place of Divine worship, of the manner, of abstinence from blood, and the like, which must needs be referred to accidental worship (if any such be), with this very caution of not adding or taking away (Deut. 12:32).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1639), book 2, ch. 13, section 21, p. 272-73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-24dd033885" data-kw="">
<blockquote><p>Obiection II. There was blood and things strangled forbidden in the council at Jerusalem after Christ’s ascension, Acts 15. Answer. It was forbidden only in regard of offence and for a time, so long as the weak Jew remained weak, not in regard of conscience. And therefore afterward Paul says that all things, even blood itself was lawful, though not expedient, in regard of scandal (1 Cor. 6:12). And to the pure all things are pure (Titus 1:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience</cite>, (1606), p. 541</span></figcaption>

</figure><figure class="quote" id="q-899ec16a4d" data-kw="">
<blockquote><p>Yet we must remember, that this restriction [against eating blood] was part of the old law. Wherefore, what Tertullian relates, that in his time it was unlawful among Christians to taste the blood of cattle, savours of superstition. For the apostles, in commanding the Gentiles to observe this rite, for a short time, did not intend to inject a scruple into their consciences, but only to prevent the liberty which was otherwise sacred, from proving an occasion of offense to the ignorant and the weak.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 9:4</span></figcaption>

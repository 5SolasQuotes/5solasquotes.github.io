<main class="wrap"><figure class="quote" id="q-f16acd9be1" data-kw="">
<blockquote><p>It is able to be conceded that Christ merited immortality, that is, He exhibited such obedience as deserved such remuneration. It is asked whether Christ merited for us in all of his works equally?…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-deee31033b" data-kw="">
<blockquote><p>Let us not suppose, then, that the Holy Spirit, by this promise, commends the dignity of our works, as if they were deserving of such a reward. For Scripture leaves us nothing of which we may glory in the sight of God. Nay, rather its whole object is to repress, humble, cast down, and completely crush our pride. … to this happiness he gives the name of reward, hire, recompense, not as estimating the merit of works, but intimating that it is a compensation for their straits, sufferings, and affronts, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><figure class="quote" id="q-78a1576114" data-kw="">
<blockquote><p>Although some of our theologians lean more towards Zanchius’s view [of meriting] and others towards Calvin’s [not-meriting], they all agree that this question is not necessary, and that theologians may hold either view with the goodwill of their brothers, without disturbing the peace of the Church or creating discord among souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>7. ‘Whether Christ merited anything for Himself’ in Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), Posthumous Works, 2. Controversies on Christ’s Person &amp; Office</cite>, pp. 989-91 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>
<div class="actions"><button class="copy" data-copy="“Although some of our theologians lean more towards Zanchius’s view [of meriting] and others towards Calvin’s [not-meriting], they all agree that this question is not necessary, and that theologians may hold either view with the goodwill of their brothers, without disturbing the peace of the Church or creating discord among souls.”

— Louis Le Blanc, 7. ‘Whether Christ merited anything for Himself’ in Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), Posthumous Works, 2. Controversies on Christ’s Person &amp; Office, pp. 989-91 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+some+of+our+theologians+lean+more+towards+Zanchius%E2%80%99s+view+%5Bof+meriting%5D+and+others+towards+Calvin%E2%80%99s+%5Bnot-meriting%5D%2C+they+all+agree+that+this+question+is+not+necessary%2C+and+that+theologians+may+hold+either+view+with+the+goodwill+of+their+brothers%2C+without+disturbing+the+peace+of+the+Church+or+creating+discord+among+souls.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+7.+%E2%80%98Whether+Christ+merited+anything+for+Himself%E2%80%99+in+Theological+Theses+Published+at+Various+Times+in+the+Academy+of+Sedan+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+%281675%3B+London%2C+1683%29%2C+Posthumous+Works%2C+2.+Controversies+on+Christ%E2%80%99s+Person+%26+Office%2C+pp.+989-91+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F78a1576114.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/78a1576114.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/whether-christ-merited/#:~:text=Although%20some%20of%20our%20theologians%20lean,Church%20or%20creating%20discord%20among%20souls&amp;text=Although%20some%20of%20our%20theologians%20lean%20more%20towards&amp;text=of%20the%20Church%20or%20creating%20discord%20among%20souls" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3cdade0ee1" data-kw="">
<blockquote><p>Accordingly, when the Scripture speaks of &quot;a crown of righteousness which God the righteous Judge shall give&quot; &quot;at that day,&quot; (2 Tim. 4:8), I not only say with Augustine, … but I also add, how could he impute righteousness to our works, did not his indulgence hide the unrighteousness that is in them? How could he deem them worthy of reward, did he not with boundless goodness destroy what is unworthy in them? Augustine is wont to give the name of grace to eternal life, because, while it is the recompense of works, it is bestowed by the gratuitous gifts of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.5</span></figcaption>

</figure><figure class="quote" id="q-d3cacfc1c5" data-kw="">
<blockquote><p>Because he mentions &quot;the crown of righteousness&quot; and &quot;the righteous Judge,&quot; and employs the word &quot;render,&quot; the Papists endeavor, by means of this passage, to build up the merits of works in opposition to the grace of God. But their reasoning is absurd. … for as soon as God has received us into favor, he likewise accepts our works, so as even to deign to give them a reward, though it is not due to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles to Timothy, Titus, and Philemon</cite>, 2 Timothy 4:8</span></figcaption>

<main class="wrap"><figure class="quote" id="q-08d6a514fe" data-kw="Faith alone">
<blockquote><p>Man is justified by faith without works; therefore by faith alone. The reason of the consequence is manifest because there are not more modes of justifying than these two—by faith and by works. Thus, one being removed, the other must not only necessarily be left, but also left alone. Otherwise the enumeration would not be legitimate. … Now why would the apostle so often and so expressly institute an antithesis between faith and works in this matter, if works could concur with faith in any way to the act of justification? Would he not in this particular have occasioned believers to err by removing works absolutely and simply from it, if they contribute anything towards it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 16.8.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a> › <a href="../topics/justification/faith-alone/sola-fide.html">Sola fide</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/trent.html">Trent</a></span></div>

</figure><figure class="quote" id="q-f7715e2f2a" data-kw="Works follow justification">
<blockquote><p>A person is justified freely by faith without works (Rom. 3:24); yea, justification is of the wicked (Rom. 4:5; 5:6). No good works can be granted which precede his justification as causes, but only which follow as the effects and fruits springing from the faith of remission (Lk. 7:47; 1 Tim. 1:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 16.8.24</span></figcaption>

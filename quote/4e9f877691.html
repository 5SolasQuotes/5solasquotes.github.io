<blockquote><p>V. The form or manner of this calling is chiefly: (1) In the tender or offering of Christ and of all saving happiness in Him unto Sinners. (2) In sinners’ accepting, embracing or closing with this tender. 1. Christ, and all saving happiness in him, is offered or tendered unto sinners on God’s part, etc. Acts 4:12; Heb. 7:25; 1 Cor. 1:23-24; 2 Cor. 5:19-21; Mt. 22:2 to 15; Mt. 11:28-30. This tender or offer of Christ to sinners is twofold, viz. ineffectual and effectual. (1) Ineffectual, which becomes not fully efficacious to conversion and salvation. And this again is either, outward only, when Christ and his benefits are only outwardly tendered in his Gospel, New Covenant promises, etc. preached and propounded, Acts 2:38-39 &amp; 9:15 &amp; 13:38-39. As when the preaching of the Gospel is tendered to them that refuse to hear it, but put it from them, stop their ears against it, contradict, etc. Acts 7:57 &amp; 13:45-46, or if they do hear it, yet do not understand it (much less assent to it) as the hearer compared to the ground by the wayside, Mt. 13:4, 19. Inward also, when the Word is not only offered and propounded to the outward ear, but also to the inward heart: So that they not only hear it, but understand it, Mt. 21:45-46. Yea sometimes not only understand it, but also by a temporary faith for a time assent to it and receive it with joy, Mt. 13:5-6, 20-21; Lk. 8:6, 13. All these degrees of calling, outward and inward, are ineffectual and insufficient to salvation: yet are they of great use, consequence and advantage to the interessing of persons in the visible Church, to the partaking of all the ordinances and means of grace, whereby much sin may be prevented and perhaps true grace may be conveyed. (2) Effectual, when Christ and his benefits are so tendered to the mind and heart in the New Covenant-doctrine that the mind is savingly illuminated to understand and the heart effectually opened to assent to the tender, and fiducially to apply it, Lk. 8:15; Eph. 1:17; Jn. 6:45; Acts 16:14 &amp; 8:35-37. From this different tender of Christ ineffectual and effectual, arises that distinction of ineffectual calling; ‘Many are called and few chosen:’ (Mt. 22:14 &amp; 20:26) and effectual calling, viz. according to God’s purpose of election (Rom. 8:28, 30). That may befall hypocrites and reprobates; this is peculiar only to the elect. Thus Christ and all saving happiness in Him is propounded and tendered to sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mysterium &amp; Medulla Bibliorum: the Mystery &amp; Marrow of the Bible, viz. God’s Covenant with Man</cite>, … (London: R.W., 1657), bk. 4, Of God’s Covenant of Performance made and confirmed in Jesus Christ, ch. 6, Of the Blessed Messiah, Aphorism 4, ‘Of Christ’s Establishment of his New Covenant and Application of it to God’s Elect’, pp. 1645-46</span></figcaption>

<blockquote><p>Ineffectual calling is of the reprobate.—It is called ineffectual not per se [in-of-itself] but per accidens [by accident, or contrary to its intention], not in respect of God who calls, but in respect of men who have deaf ears of the heart. In itself calling is always effectual, although it is not so in those who are perishing, as the sun is effective by his light in itself, although it by no means illumines the blind.</p></blockquote>

<blockquote><p>Doctrine 3. All those, and those alone, make their election sure that make their calling sure. These two God has joined together, as the apostle does in this place, so that no man ought or may disjoin them. Hence election and calling are taken sometimes in the Scriptures for one and the same, as 1 Cor. 1:26-27, that which is called ‘calling,’ verse 26, is called ‘election,’ verse 27. There is indeed an outward and ineffectual calling, which is many times separated from election, as when it is said, ‘Many are called, but few are chosen.’ But effectual and saving calling has always a sure connection with election, Rom. 8:3•[30?] and 11:28-29.</p></blockquote>

<blockquote><p>Explanation 31. That we may the better know what effectual calling is, we are to consider of a double call, which does many times prove ineffectual, as: (1) Outward, in the preaching of the Word and the voice of the rod or any providence whatsoever, which does call men to repentance, faith and holiness; but notwithstanding all these outward calls, there are millions in the world who turn the deaf ear to God and will not return to Him by repentance, nor come to Christ by faith. (2dly) There is an inward call which is no less ineffectual than the former, and it is the Spirit’s call, as when He proceeds no further than that which divines call a common work, as: (1.) Common illumination, or some kind of floating knowledge in the head concerning the Word of God and spiritual matters; and no doubt but many men who have wicked hearts and lead bad lives may be well stored with gifts of this kind, as Judas for one. (2.) Some kind of flashy affections excited and stirred up in the soul towards good things, called foretastes of the powers of the world to come; and such was in Herod and Balaam. (3.) Some kind of faint languishing inclinations in the will to obedience, such as Herod had when he did many things. (4.) Some kind of sense of sin, both in its guilt and horror, such as Judas had; and yet notwithstanding all this inward work of the Spirit, his call may be ineffectual. And if all this may be without success, then no wonder if the Arminians’ call, that of moral suasion, or of arguments, do prove no better. But then (2dly) There is another inward call of the Spirit, which is effectual to the elect; sc. that whereby the Spirit does not only call, but enable them to come at his call, as when He does renew the mind and change the will, sanctify the heart, purify the conscience and affections, and does work a lively faith in such persons, and repentance from dead works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Main Principles of Christian Religion in a 107 Short Articles or Aphorisms, generally received as being prov’d from scripture: now further cleared and confirmed by the consonant doctrine recorded in the articles and homilies of the Church of England</cite>, … (London: 1675), ch. 1, pp. 57-59</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Explanation 31. That we may the better know what effectual calling is, we are to consider of a double call, which does many times prove ineffectual, as: (1) Outward, in the preaching of the Word and the voice of the rod or any providence whatsoever, which does call men to repentance, faith and holiness; but notwithstanding all these outward calls, there are millions in the world who turn the deaf ear to God and will not return to Him by repentance, nor come to Christ by faith. (2dly) There is an inward call which is no less ineffectual than the former, and it is the Spirit’s call, as when He proceeds no further than that which divines call a common work, as: (1.) Common illumination, or some kind of floating knowledge in the head concerning the Word of God and spiritual matters; and no doubt but many men who have wicked hearts and lead bad lives may be well stored with gifts of this kind, as Judas for one. (2.) Some kind of flashy affections excited and stirred up in the soul towards good things, called foretastes of the powers of the world to come; and such was in Herod and Balaam. (3.) Some kind of faint languishing inclinations in the will to obedience, such as Herod had when he did many things. (4.) Some kind of sense of sin, both in its guilt and horror, such as Judas had; and yet notwithstanding all this inward work of the Spirit, his call may be ineffectual. And if all this may be without success, then no wonder if the Arminians’ call, that of moral suasion, or of arguments, do prove no better. But then (2dly) There is another inward call of the Spirit, which is effectual to the elect; sc. that whereby the Spirit does not only call, but enable them to come at his call, as when He does renew the mind and change the will, sanctify the heart, purify the conscience and affections, and does work a lively faith in such persons, and repentance from dead works.”

— Thomas Adams, The Main Principles of Christian Religion in a 107 Short Articles or Aphorisms… (London: 1675), ch. 1, pp. 57-59">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CExplanation+31.+That+we+may+the+better+know+what+effectual+calling+is%2C+we+are+to+consider+of+a+double+call%2C+which+does+many+times+prove+ineffectual%2C+as%3A+%281%29+Outward%2C+in+the+preaching+of+the+Word+and+the+voice+of+the+rod+or+any+providence+whatsoever%2C+which+does+call+men+to+repentance%2C+faith+and+holiness%3B+but+notwithstanding+all+these+outward+calls%2C+there+are+millions+in+the+world+who+turn+the+deaf+ear+to+God+and+will+not+return+to+Him+by+repentance%2C+nor+come+to+Christ+by+faith.+%282dly%29+There+is+an+inward+call+which+is+no+less+ineffectual+than+the+former%2C+and+it+is+the+Spirit%E2%80%99s+call%2C+as+when+He+proceeds+no+further+than+that+which+divines+call+a+common+work%2C+as%3A+%281.%29+Common+illumination%2C+or+some+kind+of+floating+knowledge+in+the+head+concerning+the+Word+of+God+and+spiritual+matters%3B+and+no+doubt+but+many+men+who+have+wicked+hearts+and+lead+bad+lives+may+be+well+stored+with+gifts+of+this+kind%2C+as+Judas+for+one.+%282.%29+Some+kind+of+flashy+affections+excited+and+stirred+up+in+the+soul+towards+good+things%2C+called+foretastes+of+the+powers+of+the+world+to+come%3B+and+such+was+in+Herod+and+Balaam.+%283.%29+Some+kind+of+faint+languishing+inclinations+in+the+will+to+obedience%2C+such+as+Herod+had+when+he+did+many+things.+%284.%29+Some+kind+of+sense+of+sin%2C+both+in+its+guilt+and+horror%2C+such+as+Judas+had%3B+and+yet+notwithstanding+all+this+inward+work+of+the+Spirit%2C+his+call+may+be+ineffectual.+And+if+all+this+may+be+without+success%2C+then+no+wonder+if+the+Arminians%E2%80%99+call%2C+that+of+moral+suasion%2C+or+of+arguments%2C+do+prove+no+better.+But+then+%282dly%29+There+is+another+inward+call+of+the+Spirit%2C+which+is+effectual+to+the+elect%3B+sc.+that+whereby+the+Spirit+does+not+only+call%2C+but+enable+them+to+come+at+his+call%2C+as+when+He+does+renew+the+mind+and+change+the+will%2C+sanctify+the+heart%2C+purify+the+conscience+and+affections%2C+and+does+work+a+lively+faith+in+such+persons%2C+and+repentance+from+dead+works.%E2%80%9D%0A%0A%E2%80%94+Thomas+Adams%2C+The+Main+Principles+of+Christian+Religion+in+a+107+Short+Articles+or+Aphorisms%E2%80%A6+%28London%3A+1675%29%2C+ch.+1%2C+pp.+57-59&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffdbdcd8e20.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fdbdcd8e20.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-calling/#:~:text=Explanation%2031.%20That%20we%20may%20the,persons%2C%20and%20repentance%20from%20dead%20works&amp;text=Explanation%2031.%20That%20we%20may%20the%20better%20know&amp;text=in%20such%20persons%2C%20and%20repentance%20from%20dead%20works" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Fifthly, if thou art a holy person, if thou art one that hast that real holiness without which there is no happiness, then know for thy comfort, that thy holiness is a glorious witness and evidence of thy effectual vocation, 1 Pet. 1:15, ‘As He who hath called you is holy, so be ye holy in all manner of conversation.’ Many are externally called that are not internally called, and many are ineffectually called that are not effectually called. But now real holiness that speaks out an internal call, an effectual call, a call out of darkness into marvelous light… The Author of this call is a holy God; our holy calling depends upon the purpose of God, the power of God, and the grace and good pleasure of God; the means of our holy calling are the Spirit of God and the Word of God; and the ends of our calling are holiness and the glory of God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5d960536f8" data-kw="">
<blockquote><p>Very great surely is the light of the truth in this our age, which through God’s singular gift hath been found out in the holy scriptures by some faithful servants of Christ, and spreading abroad far and wide hath shined forth unto us as the sun in the firmament. But I pray, what and how many mists of errors, how divers and black clouds of heresies have been stirred up and raked out of the depth of hell by no small number of verletts and ministers of the devil to cast a darkness over this heavenly light?

I speak not now of tyrants, which ever have and yet doe employ and bend all their swords, all their power and the very force and might of their authority to this: that these candlesticks (of brittle earth I confess) wherein any of this light remaineth and shineth being bruised and broken by their iron-blows, the whole light of the divine wisdom (if God so pleased) might be utterly put out and extinguished and in place thereof that infernal darkness fetcht again from hell might succeed and bear the whole sway.

For this very cause, what in these our wretched times hath been done, what and what manner of slaughters of an infinite number of men, in many places committed, and in many other places attempted more then once, we have yet in fresh memory. And what and by whom the devil lately assayed in those valleys of yours. Though by God’s mighty hand defending you, the slaughter succeeded not to the wish of those ungodly wretches, your self know better then we do.

And now also what that ever-busy Satan is for the same intent continually attempting, what devises he purposeth, what treacheries he studies, what weapons he prepareth, what wars he brocheth against godly princes and magistrates, who desire to have this heavenly light to shine in their dominions and labour to spread the same far and wide into the whole world, the Lord himself knoweth, who dwelleth in the heavens, who also is wont to scatter the wicked counsels of the ungodly and to disperse them as vain smokes through his incredible love and mercy towards us, when it is most expedient for his church and when tyrants do look for nothing less then a disappointment of their intents which they so long and watchfully provided for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), 1: 53-55.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>1. IT [social covenanting] was expressly commanded under the Old Testament dispensation, Psalm lxxvi. 11. “Vow, and pay unto the LORD your God.” It behoves those, who deny its obligation in New Testament times, to prove that it was not, in its nature, a moral duty, but belonged to the ceremonial law, or judicial policy of the Jews. But this I presume, will not be easily done. If it was a type, where is its antitype? What peculiarity was there, in the circumstances of the Jews, rendering it expedient for them, to bind themselves to serve the Lord, while Christians are exempted from every such obligation?

IT seems to be the bent of the present generation, to get rid of all the obligations contained in the Old Testament. These deistical Christians (if I may be allowed the expression) resemble the children of old, who spoke half in the language of Canaan, and half in the language of Ashdod. But the Old and New Testament ought to be considered as the two Statute-books of heaven. All the Statutes contained in the former book, remain binding upon the conscience, if not repealed in the latter, either by express precept, necessary deduction, or approved example. Therefore, before the doctrine of covenanting be rejected, it ought to be proved, that it has been abrogated by the authority of that divine Legislator who first appointed it. It would be but reasonable to allow us the same privilege, in quoting the statutes of heaven, that every lawyer has in referring to acts of Parliament. Though these were made in the reign of Alfred the Great, and thirty folio volumes intervened between that in which these acts are contained, and the one in which those of the present age are recorded, yet, if they are not repealed by some subsequent act, they remain obligatory on the nation. By these the most important suits will be decided. Why should we deny the same authority to the unrepealed statutes of the King of nations?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-b-wylie.html">Samuel B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The obligation of covenants. A discourse</cite>, (Glasgow, 1803), pp 21-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>We believe that there is one Divine Essence, whom we call God. Not only because the contemplation of the things of nature teaches us that (Rom. 1:20), but much more because the Holy Scriptures testify of it to us (Deut. 4:32; Eph. 4:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, trans. James Clark (1558; Edinburgh, 2016), 1.1, p. 1.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-1f90b98568" data-kw="">
<blockquote><p>The rest of the Sabbath (which is as strictly enjoined as abstinence at a fast, yet) might be lawfully broken for the preservation of a man’s life, as we see in Elijah’s travel (1 King. 19. 8.) five or six Sabbaths together; yea for the preservation of the life of a beast, Luke 14. 5. yea for the preservation of the health of a beast, Luke 13. 15. For, God delights more in mercy, than in any external works even of His own service, Mat. 12. 7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The doctrine of fasting and prayer, and humiliation for sin. Delivered in sundry sermons at the fast appointed by publique authority, in the year 1625</cite>, (London: Edward Brewster, 1633), p. 60.</span></figcaption>

</figure><figure class="quote" id="q-1cc8942230" data-kw="">
<blockquote><p>Although Codex Alexandrinus was not published until 1786, various Westminster Divines had access to either the manuscript itself or collations of its readings. It is extensively cited in the ‘Westminster Annotations’ (a Bible commentary commissioned by the same Parliament that summoned the Westminster Assembly), while leading Westminster Divine Thomas Goodwin preferred its readings to the TR in a number of places in his published Works. The enthusiastic – and uncontroversial – use of this new manuscript by these Divines is one strand of evidence that, contrary to modern claims, Westminster Confession of Faith (and London Baptist Confession) 1:8 do not require the use of the Textus Receptus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-steele.html">Stephen Steele</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Westminster Divines &amp; the Alexandrian Codex’</cite>, (2023)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-4c3302b976" data-kw="">
<blockquote><p>When these things were finished, ‘the evening and the morning,’ Moses tells us, ‘were the first day.’ By ‘the evening’ here we understand not the beginning of the day according to the calculation which the Jews make during their festival seasons, but the close of the preceding day, and by the morning the beginning of the following day. Therefore Moses says ‘and the evening was,’ i.e., the darkness came on: just as he who labors during the day rests in the evening and on the following morning resumes his toils. Thus terminated the first day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-venema.html">Herman Venema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Translation of Hermann Venema’s inedited Institutes of Theology tr. Alexander W. Brown (d. 1787; Edinburgh: T&amp;T Clark, 1850), ch. 19, Creation, p. 344</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

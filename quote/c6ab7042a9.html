<main class="wrap"><figure class="quote" id="q-c6ab7042a9" data-kw="spiritual presence">
<blockquote><p>From what has been said the statement of the question is clearly gathered. First, it is not inquired about the presence of Christ in general—whether Christ is present in the Eucharist (which is asserted on both sides)—but concerning the mode of this presence: Is it corporeal and by indistancy (adiastasian) or is it spiritual? The Romanists and Lutherans hold the former; we hold the latter. Second, the question is not whether the body of Christ is present to the mind of believers in the Eucharist, and whether it is united closely with them. Rather the question is whether it is united with the sacramental signs and locally present with them. This they maintain; we deny. Third, the question is not about the real and substantial presence as to efficacy and virtue; for thus we do not deny that Christ’s body is present in the sacrament, inasmuch as in the lawful use it exerts its power in the communicants according to God’s ordination. But the question (according to the sense of our opponents) concerns a real presence by nearness (indistantiam). Fourth, it is not inquired whether our union</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b1da1a9cb3" data-kw="self-exam">
<blockquote><p>Christ used bread because with the divine blessing it is of all the elements the most efficacious for nourishing and strengthening the body; the most common, the most familiar and to be found everywhere, easily prepared and the most pleasant. However, the bread he used was unleavened; not from the necessity of the thing, but from an accidental circumstance of time, on account of the feast of the Passover, in which it was lawful neither to use nor to have any other (Ex. 12:19). Otherwise it was always fermented in Judea (whenever the Supper was celebrated outside of that time, Acts 2:42) as well as among the Gentiles (who used common and not unleavened bread). Hence it was called simply the “breaking of bread” (Acts 20:7; 1 Cor. 10:16; 11:26, 27). So that here so fierce a dispute on this subject falsely sprang up between the Greeks and Latins; the Greeks pressing the necessity of leavened, the latter of unleavened bread. The former were called “fermentarians” and the latter “azymites.” The thing is in itself indifferent (as many of the Romanists acknowledge); on account of which the p</p></blockquote>

</figure><figure class="quote" id="q-aee103fb5c" data-kw="real spiritual">
<blockquote><p>Now although this spiritual presence does not take place except faith mediates, it does not follow (as our opponents falsely charge upon us) that it is only imaginary and unreal (phantastikēn), by which not so much Christ as a phantasm (phantasma) of him or his image becomes present. Spiritual things are no less real and true than corporeal; nay, as they are more perfect, so their mode of presence ought to have perfection. I confess that by those to whom faith is only historical and consists in the bare knowledge of the object, that presence can be called less real (although not even so is a presence denied by philosophers by whom whatever is perceived by the intellect can be said to be truly present to it). But the Scriptures far otherwise describe faith and the presence which it works, while they designate it by sight, hearing and touch, by access, reception and manducation: all of which prove not an unreal (phantasticam) presence (which is made only by phantasms or notions and imaginary ideas), but a true and real presence. Otherwise our union with Christ (which is made by faith,</p></blockquote>

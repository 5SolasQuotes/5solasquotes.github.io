<main class="wrap"><figure class="quote" id="q-b42d51e283" data-kw="">
<blockquote><p>While Thomas Aquinas strongly resisted the blasphemous notion that God had the power to do things contrary to his nature (such as sin and lie), he did not adhere to the other erroneous view that divine omnipotence was restricted to what God actually does:

[I]f we consider his power absolutely, he can do other things besides those that are subject to his providence or operation: but he cannot do what has been eternally contained in the order to his providence, because he is unchangeable. Through failing to observe this distinction some have fallen into various errors. Some in an endeavour to extend to things themselves the unchangeableness of the divine order, said that all things must of necessity be as they are; so much so, that some declared that God is unable to do except what he does. Against this we have the words Matth. 26:53: Cannot I ask my Father, and he will give me presently more than twelve legions of angels?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, trans. English Dominican Fathers (c. 1265; London, 1924), 3.98.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-726bc7b9fc" data-kw="">
<blockquote><p>The Reformed divines who addressed the subjects of lawful civil government and resistance to tyranny often argued that a just ruler governs in the interests of the people, while a tyrant governs in his own interests. We find this very same distinction in the medieval scholastic theologian, Thomas Aquinas:

Fourth, it is necessary that a king have equity, because otherwise he would be a tyrant: for the tyrant turns everything within the kingdom to his own use, but a king orders his kingdom to the common good. Thus Proverbs says: a just king sets up the land; a covetous man destroys it (Prov 29:4). But he [Christ] came not seeking his own use, but yours, because the Son of Man did not come to be ministered to, but to minister (Matt 20:28). And who comes to minister? Surely the one who comes to give his soul for the redemption of many (Matt 20:28), and so that he might lead the redeemed to eternal glory, to which may he lead us, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermo Ecce Rex tuus</cite>, n2.1.4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>Having noted these presuppositions, we now say that no human reason can be the principle by which or through which, or else on the ground of which or why we believe, or the foundation, law, or norm for what must be believed, under whose direction we are to judge.</p></blockquote>

</figure><figure class="quote" id="q-a48f1afc21" data-kw="">
<blockquote><p>Now, by this we set aside the error of some who say that corporeal punishments are illicit to use. These people adduce as a basis for their error the text of Exodus ( 20:13): “You shall not kill,” which is mentioned again in Matthew (5:21). They also bring up what is said in Matthew (13:30), that the Lord replied to the stewards who wanted to gather up the cockle from amidst the wheat: “Let both grow until the harvest.” By the cockle we understand the children of the wicked one, whereas by the harvest we understand the end of the world, as is explained in the same place (Mat. 13:38-40). So, the wicked are not to be removed from among the good by killing them.

They also allege that so long as a man is existing in this world he can be changed for the better. So, he should not be removed from the world by execution, but kept for punishment.

Now, these arguments are frivolous. Indeed, in the law which says “You shall not kill” there is the later statement: “You shall not allow wrongdoers to live” (Exod. 22: 18). From this we are given to understand that the unjust execution of men is prohibited. This is also apparent from the Lord’s words in Matthew 5. For, after He said: “You have heard that it was said to them of old: You shall not kill” (Mat. 5:21), He added: “But I say to you that whosoever is angry with his brother,” etc.

From this He makes us understand that the killing which results from anger is prohibited, but not that which stems from a zeal for justice. Moreover, how the Lord’s statement, “Let both grow until the harvest,” should be understood is apparent through what follows: “lest perhaps, gathering up the cockle, you root up the wheat also together with it” (Mat. 13: 29). So, the execution of the wicked is forbidden wherever cannot be done without danger to the good. Of course, this often happens when the wicked are not clearly distinguished from the good by their sins, or when the danger of the evil involving many good men in their ruin is feared.

Finally, the fact that the evil, as long as they live, can be corrected from their errors does not prohibit the fact that they may be justly executed, for the danger which threatens from their way of life is greater and more certain than the good which may be expected from their improvement. They also have at the critical point of death the opportunity to be converted to God through repentance. And if they are so stubborn that even at the point of death their heart does not draw back from evil, it is possible to make a highly probable judgment that they would never come away from evil to the right use of their powers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, trans. English Dominican Fathers (c. 1265; London, 1924), 3.146.</span></figcaption>

</figure><figure class="quote" id="q-dc78cdef29" data-kw="">
<blockquote><p>A distinction is real (simply real) if it exists between thing and thing, for example between body and soul, between the members of the body, between cause and effect, between a faculty and its operation, between substance and accidents. A thing, at least according to Scotists, is whatever exists or can exist per se (i.e. through its own existence), and hence, if it is created, it can be directly and immediately produced by physical causality. The sign of a real distinction is separability or actual separation. Thomists, on the contrary, deny that separability is required for having a real distinction. So they say, for example, that faculties are really distinct from the soul though they cannot be separated from it. One must say the like of their real distinction between essence and existence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), ch. 2, On the Attributes in General &amp; on ‘One”, Article 4, ‘On Identity &amp; Distinction’, p. 30</span></figcaption>

<div class="actions"><button class="copy" data-copy="“A distinction is real (simply real) if it exists between thing and thing, for example between body and soul, between the members of the body, between cause and effect, between a faculty and its operation, between substance and accidents. A thing, at least according to Scotists, is whatever exists or can exist per se (i.e. through its own existence), and hence, if it is created, it can be directly and immediately produced by physical causality. The sign of a real distinction is separability or actual separation. Thomists, on the contrary, deny that separability is required for having a real distinction. So they say, for example, that faculties are really distinct from the soul though they cannot be separated from it. One must say the like of their real distinction between essence and existence.”

— Allan B. Wolter, Little Summary of Metaphysics, (Milwaukee: Bruce Publishing Co., 1958), ch. 2, On the Attributes in General &amp; on ‘One”, Article 4, ‘On Identity &amp; Distinction’, p. 30">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+distinction+is+real+%28simply+real%29+if+it+exists+between+thing+and+thing%2C+for+example+between+body+and+soul%2C+between+the+members+of+the+body%2C+between+cause+and+effect%2C+between+a+faculty+and+its+operation%2C+between+substance+and+accidents.+A+thing%2C+at+least+according+to+Scotists%2C+is+whatever+exists+or+can+exist+per+se+%28i.e.+through+its+own+existence%29%2C+and+hence%2C+if+it+is+created%2C+it+can+be+directly+and+immediately+produced+by+physical+causality.+The+sign+of+a+real+distinction+is+separability+or+actual+separation.+Thomists%2C+on+the+contrary%2C+deny+that+separability+is+required+for+having+a+real+distinction.+So+they+say%2C+for+example%2C+that+faculties+are+really+distinct+from+the+soul+though+they+cannot+be+separated+from+it.+One+must+say+the+like+of+their+real+distinction+between+essence+and+existence.%E2%80%9D%0A%0A%E2%80%94+Allan+B.+Wolter%2C+Little+Summary+of+Metaphysics%2C+%28Milwaukee%3A+Bruce+Publishing+Co.%2C+1958%29%2C+ch.+2%2C+On+the+Attributes+in+General+%26+on+%E2%80%98One%E2%80%9D%2C+Article+4%2C+%E2%80%98On+Identity+%26+Distinction%E2%80%99%2C+p.+30&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdc78cdef29.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dc78cdef29.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-particular-metaphysical-issues/#:~:text=A%20distinction%20is%20real%20%28simply%20real,real%20distinction%20between%20essence%20and%20existence&amp;text=A%20distinction%20is%20real%20%28simply%20real%29%20if%20it&amp;text=of%20their%20real%20distinction%20between%20essence%20and%20existence" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

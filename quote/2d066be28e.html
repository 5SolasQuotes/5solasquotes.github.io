<blockquote><p>But now in our times men have taken in hand to dispute this question upon this occasion, That many do so greatly fear this disease, and death which commonly followeth the same that forsaking all duties, not only of Christians, but also of Humanity, they have greatly increased the very wrath of God, which is the chief cause of this Sickness: and there hath in a manner been no stay or let in them; but where this great misery hath happened, the bonds of Man’s fellowships being once broken, it is much to be wondered at, that all Mankind hath not perished and been destroyed. …

For I deny, although it be agreed upon, that the Plague, of all other diseases, is most infectious; yea, and that unavoidable death for the most part doth presently follow: that therefore the Standing, in which God hath placed every man, is to be forsaken. I deny, I say, that therefore that thing is not to be preferred before Life itself, which we owe unto God, to our Country, and which we owe unto men, either for some public or pri­vate respect. And I had much more rather they would bestow their endeavours in persuasive disputes, to restrain men’s flying away for fear of the Plague, than that they should labour to prove their strange opinion of the Plague not to be contagious. …

But surely it is the part of a wise man to follow the Golden mean, so that he fly not when he should tarry, neither when he should go aside (for the term of flying away in this Argument seemeth to me to be very improper) by his rash tarrying, offend against the self-same Charity, which seemed to counsel him to stay.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A learned treatise of the plague wherein the two questions, whether the plague be infectious or no, and, whether and how far it may be shunned of Christians by going aside, are resolved. Written in Latin</cite>, (London: Thomas Ratcliffe, 1665), pp 1-2, 3.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0403f30cb2" data-kw="">
<blockquote><p>For we are as much obliged to believe non-fundamentals that are clear (as that there were eight persons saved in the ark, and the old world drowned with waters, Sodom burnt with fire), as to believe fundamentals, that there is no name whereby men may be saved, but by the name of Jesus, for the Authority of God speaking in his Word and his command does equally oblige to both; but there is no such necessity so absolute in believing non-fundamentals, as in believing these, without the knowledge whereof, we cannot be saved. But it never follows that errors in non-fundamentals published and taught to the ruin of the souls of many, they having such a strong connection and influence on the knowledge of fundamentals, are to be tolerated since our sinning here does as equally and strongly strike against the authority and express command of God (at least in most things of that kind) as in points fundamental; and therefore the magistrate, who is to look to the honor of God as a Christian, and peace of societies in all, is as much obliged to punish clearly opened, non-fundamental, as fundamental, false doctrines.</p></blockquote>

<blockquote><p>About the middle of August [1665] I set myself to write a short exhortation to those who were shut up because of the plague, and just when I had finished it, heard the melancholy news of my father’s death, on the 16th; upon which I wrote a letter to comfort my mother, wherewith I much comforted myself; and on the 24th sent abroad my little exhortation to those who were shut up, beseeching God that it might do good to all. And on the 30th I thought of writing a little treatise of comfort in this sad time, which I finished and sent to my bookseller September the first, praying the blessing of Heaven might attend upon these my little labors for the good of souls.” – Autobiography Grosvenor, Benjamin – Preparation for Death, the Best Preservative Against the Plague, being the substance of 2 Sermons (London, 1721) Grosvenor (1676–1758) was originally an English, primitive baptist, but was excommunicated when he became a presbyterian. He then served as a dissenting presbyterian minister and was a ‘moderate Calvinist’. From 1720-22 there were plagues in France (the Great Plague of Marseille) and in New England. England prepared for it, but apparently never got it. Barnard, John – ‘2nd Sermon, The Fatal Consequence of a People’s Persisting in Sin: Preached… on a Public Fast in the Time of the Measles, Jan, 14, 1713/14’ in Two Sermons: The Christian’s Behavior under Severe and Repeated Bereavements, and The Fatal Consequence of a Peoples Persisting in Sin (Boston, 1714) Clarke, Samuel – Sermons 7-9 in XVII sermons on several occasions… (London, 1724) on Isa. 26:9; Lk. 13:2-3 &amp; Mt. 24:7 Clarke (1675-1729) was a latitudinarian, Anglican clergyman and English philosopher. He is considered the major British figure in philosophy between John Locke and George Berkeley. Emerson, Joseph – ‘A Word to those that are Afflicted very much; Mr. Emerson’s sermon on the mortal sickness at Malden; Essay to preserve the memory, and improve the affliction, of the late mortal sickness at Malden; a sermon preached at the lecture in Malden, October 20th 1738, on occasion of the repeated and multiplied deaths of children in many families in said town, by the throat distemper’ (Boston, 1738) . American Presbyterians Davies, Samuel – ‘This Very Year You Are Going to Die!’ (1761) A sermon on Jer. 28:16, “This year thou shalt die.</p></blockquote>

<blockquote><p>Sept, 17, 1585 Lyttis of the deacons [servants] elected. Henry Nesbet and William Nesbet, bailies, Nicoll Uddert, Dean of Guild, James Ros, Thesaurer [Treasurer], William Littill, Androw Sclater, George Smyth, Tailor [Jailor?], of the Council, and Jhonn Stevinsoun, deykin [deacon/servant?] of the weavers, remembering that since the beginning of this present pestilence they have remained within this burgh constantly, sustained the burdening of the offices laid upon them unto this hour, with the loss and death for the most part of diverse of their children, servants, and family, and not without the extreme danger of their own lives, most eminently known unto all men, the rest of their brethren of the council and deykins [deacons/servants], which were no less astricted, oblist [obliged], and sworn to assist and take care of this commonwealth, having deserted their places and forsaken their offices, contrary to their oaths and allegiance made and given, and yet continuing has not repaired to this burgh at this most necessary time, approached and appointed to convene and surrogate others in their room, whereby the whole estate of this burgh is appearing to fall in confusion; Therefore…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Sept, 17, 1585 Lyttis of the deacons [servants] elected. Henry Nesbet and William Nesbet, bailies, Nicoll Uddert, Dean of Guild, James Ros, Thesaurer [Treasurer], William Littill, Androw Sclater, George Smyth, Tailor [Jailor?], of the Council, and Jhonn Stevinsoun, deykin [deacon/servant?] of the weavers, remembering that since the beginning of this present pestilence they have remained within this burgh constantly, sustained the burdening of the offices laid upon them unto this hour, with the loss and death for the most part of diverse of their children, servants, and family, and not without the extreme danger of their own lives, most eminently known unto all men, the rest of their brethren of the council and deykins [deacons/servants], which were no less astricted, oblist [obliged], and sworn to assist and take care of this commonwealth, having deserted their places and forsaken their offices, contrary to their oaths and allegiance made and given, and yet continuing has not repaired to this burgh at this most necessary time, approached and appointed to convene and surrogate others in their room, whereby the whole estate of this burgh is appearing to fall in confusion; Therefore…”

<blockquote><p>…it is the duty of a Christian Magistrate to provide that those things which either breed or nourish the plague, so far as they may, be taken away, and that regard may be had of those that be visited with this sickness, that all be not driven to be careful for all. But how they that serve in any public civil office may leave their charge in the time of the plague, I do not see; … But if in such calamities the magistrate do not in time provide, as much as may be, both by such lawful means as are not repugnant unto Christian charity, that the infection may be prevented, and also that the sick of the plague want [lack] nothing; he shall doubtless do very well both for the sick and the whole, and shall take away many questions which in this argument are wont [accustomed] to be raised:</p></blockquote>

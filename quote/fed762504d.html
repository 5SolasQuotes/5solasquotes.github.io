<main class="wrap"><figure class="quote" id="q-fed762504d" data-kw="">
<blockquote><p>Let us then here call to mind the distinction which has been showed betwixt religious ceremonies and moral circumstances: for as touching moral circumstances which serve for common order and decency in the worship of God, they being so many and so alterable that they could not be particularly determined in Scripture, for all the different and almost infinite cases which might occur, the Jewish Synagogue had the same power for determining things of this nature which the church of Christ now has. For the law did not define but left the[m to] be defined by the Synagogue, the set hours for all public divine service, when it should begin, how long it should last, the order [that] should be kept in the reading and expounding of the law, praying, singing, catechizing, excommunicating, censuring and absolving of delinquents, etc., the circumstances of the celebration of mariage, of the education of youth in schools and colleges, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, (1637), pt. 3, ch. 7, p. 119</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1e1e0634df" data-kw="">
<blockquote><p>Secondly, the farther that the members or Churches, either congregational, presbyterial, or national, are removed in local distance one from another, the less is the visible and external communion of rebuking, comforting, and admonishing one another; yet the power and obligation of these duties are not removed. So though the national Churches be locally distant one from another, yet their power of exercising duties… is not from thence concluded to be null. Yea, national duties upon occasion are still obligatory, and communion of men of sundry nations is clear to me, Isa. 2:3, ‘many nations shall flow unto the mountain of the Lord’s House,’ Zech. 8:23, ‘Ten men shall take hold out of all languages of the nations, they even shall take hold of the skirt of him that is a Jew, saying, we will go with you, for we have heard that God is with you.’ …the places [of Scripture] do well prove the power-lawful of performing duties, whereas the exercise of them in one place is not hic &amp; nunc, in ordinary providence, possible. And so this consequence must be weak: the whole catholic visible Churches in their principal guides cannot ordinarily and constantly meet, hic &amp; nunc, for the exercise of their power; Therefore they have no such power. For if the power be exercised in parts, which, through occurrences of providence and the corruption of men’s nature, cannot be exercised in whole at once, yet it’s not hence evinced [proven] to be a power not given of Christ for edification;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, pp. 300-301</span></figcaption>

</figure><figure class="quote" id="q-18af1dae4c" data-kw="">
<blockquote><p>When as God has neither tied us to set forms, nor from them, save only as unsuitableness to any particular persons may make one less edifying than the other: And both free prayers and set forms, studied prayers and sudden prayers are all the work of man (as to man’s part): and therefore they must needs be imperfect and faulty as man is: And yet in both we may pray by the Spirit, even with the holy and fervent desires which the Spirit excites in us: And the Spirit may ordinarily be a Spirit of supplication in us and help our infirmities in the one way and in the other: And therefore, though I will not equal them (for I prefer some men’s free praying before any forms, and I prefer the Common prayers before some men’s free prayers), yet I may say that I will neither assent and consent to every word in the one, nor in the other, no not of any man that ever I heard: And yet I will not take it for unlawful to join with Church, or family, or person in the one or in the other: yea, upon long experience, if I had fully my own choice and liberty, I would use free prayer one part of the day (or one day) and a well composed form another part, because I see commodities by both, and such inconveniences of either way alone, as are, if possible to be avoided. But when the mind has received a prejudice against either way, by education, custom, or former distastes, no reason how clear soever will overcome it, till age and experience do mellow green and sour spirits and teach them to judge of things soberly and impartially, not as others judge of them, but as indeed they are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, (London: Simmons, 1671), ‘To those Readers…’, pp. 5-6</span></figcaption>

<blockquote><p>45. A man is said to be a partaker of another’s sin in nine ways, indicated by the following: Command, counsel, consent, flattery [or coaxing], retreat, participating, nodding [or faltering], not opposing, not making public [or not revealing]. [Jussio, consilium, consensus, palpo, recursus, participans, nutans, non obstans, non manifestans.] Or, in sum, consent is given to sinners by counseling, defending, helping, permitting what we might hinder, and being silent when we might profitably speak, Rom. 1:32.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology (Baker, 1997), bk. 2, ch. 16, ‘Justice &amp; Charity toward our Neighbor,’ section 45</cite>, p. 305</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>And the truth is, that, besides many other evils, the iniquity and unhappiness of such oaths and covenants [such as the SL&amp;C, which he was just examining] lie much in this, that being commonly framed by persons that even, amongst themselves, are not fully of one mind, but have their different opinions and interests to serve, (and it was so even in this) they commonly patch up so many several articles and clauses, and those too of so versatile and ambiguous terms, that they prove most wretched snares and thickets of briers and thorns to the consciences of those who are engaged in them, and matter of endless contentions and disputes amongst them, about the true sense and intendment, and the ties and obligations of those doubtful clauses: especially in such alterations and revolutions of affairs as always may, and often do, even within few years, follow after them; for the models and productions of such devices are not usually long-lived. And whatsoever may be said for their excuse in whole or in part, who, in yielding to the power that pressed it, and the general opinion of this Church at that time, did take that [Solemn League and] Covenant [1643] in the most moderate and least schismatical sense that the terms can admit; yet, I know not what can be said to clear them of a very great sin, that not only framed such an engine, but violently imposed it upon all ranks of men; not ministers and other public persons only, but the whole body and community of the people, thereby engaging such droves of poor ignorant persons to they knew not what, and (to speak freely) to such a hodge-podge of things of various concernments, religious and civil, as church discipline and government, the privileges of parliaments, and liberties of subjects, and condign punishment of malignants— things hard enough for the wisest and learnedest to draw the just lines of, and to give plain definitions and decisions of them, and therefore certainly as far off from the reach of poor country people’s understanding as from the true interest of their souls. And yet to tie them by a religious oath, either to know all, or to contend for them blindfold, without knowing of them, where will there be instanced a greater oppression and tyranny over consciences than this? Certainly, they that now govern in this Church cannot be charged with anything near or like unto it; for whatsoever they require of entrants to the ministry, they require neither subscriptions nor oaths of ministers already entered, and far less of the whole body of the people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rober-leighton.html">Rober Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works new ed. (London: Duncan, 1830), vol. 4, ‘A Modest Defence of Moderate Episcopacy, as Established in Scotland at the Restoration of King Charles II [1660]’</cite>, pp. 391-92</span></figcaption>

<blockquote><p>VIII Rule. We must give place to the sway of the times wherein we live, so far forth as may stand with keeping faith and a good conscience. We may not be temporizers and change our religion with the times: but yet we may and must give place to times as we give place to the stream, so that it be done with keeping of true religion and good conscience. This rule was practiced by Paul… he was three years in Ephesus, an idolatrous place, where the great goddess Diana was worshipped; yet in all that time he contained himself and spake nothing in particular against Diana, but ony in general against false gods, saying that ‘they be no gods that are made with hands,’ v. 26. Nay, Alexander could not charge him with this, that he had in all that while blasphemed their goddess Diana. Paul therefore was feign to yield to the sway of those times that so he might do some good in Ephesus by his ministry. Whereas, if he had spoken against Diana directly, it had not been possible for him to have done that good by preaching which otherwise he did.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience (Cambridge. 1606), bk. 3, ch. 2</cite>, pp. 481-84</span></figcaption>

<blockquote><p>The two Demurrers…: ‘Except[ion] against this our present obedience, because the present power is yet new: neither is there a total cessation of all hopes of recovery.’ Philosophers hold that the definition of a man belongs to an infant as well as to one of many years, because after the organization of the parts, he is informed with the same principle of life and reason as a grown man is; and having the same form, is the same thing. Even so the present power has possessed all the parts of this kingdom, gives them life in the administration of public justice and protection, which are the soul of a State, and the power which preceded this, what did it infuse more vital than this? And now that that is taken away, if this other did not presently enter into its place, the commonwealth were dead and each man were left in his naturals to subsist of himself and to cast how he could in such a state of war, defend himself from all the rest of the world, every man in this State having an equal right to everything.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bounds &amp; Bonds of Public Obedience, or a Vindication of our Lawful Submission to the Present Government… (London, 1649) This was mor than likely written by Ascham despite it being attributed to Rouse.</cite>, p. 27</span></figcaption>

<blockquote><p>The demand was of the same man, who formerly did lawfully preach in a public assembly, if he should [now] obtain a license from the Lord bishop of the diocese, without any unlawful condition for to continue in that his course [of public preaching], whether that leave or license given does pollute the actions, seeing a man may ask leave of the great Turk to preach the gospel within his dominions? His [John Robinson’s] answer is that the very obtaining and receiving of such a license is unlawful, because it is a real acknowledgement that such a bishop has a lawful power to grant it. Which [in my judgment] is neither so nor so, for: 1. The asking and receiving of leave or license (which are both one) does not always imply an acknowledgement of his lawful authority from whom it is sought. If any man of violence shall usurp a power to himself, of permitting or hindering the lawful and good offices that pertain unto honest men, so that without his license a man could not buy or sell, or teach any science or trade of life; if an honest man whom these duties concern, should in that case take a license from that usurper (though he were no better than a strong thief) no reasonable man will say that in so doing he did acknowledge such [an] usurped power [to be] lawful. The rulers of Jewish synagogues had no lawful power over the apostles of Christ in any part of their ministry, neither would Paul ever acknowledge so much: yet he and Barnabas accepted of such license or leave from them sometime as they did usually grant unto those that acknowledged themselves lawfully subject to their authority. See an example, Acts 13:15. Mr. Robinson himself has granted in the first demand that a man may preach by leave in a parochial assembly: which leave must be given by the parochial minister and church-wardens, whose authority he holds one with the bishops. If therefore leave or license (whether in word or writing, that is all one) may be lawfully taken from them, without acknowledging any authority lawful which is unlawful, why not from the bishop? 2. There is some authority in the bishops derived from the king which may be acknowledged [as] lawful. Such is this of giving license, liberty and civil authority for men to do good. The civil magistrate may do it himself, or appoint others to do it, 2 Chron. 17:7. The abuse of this authority does not make it unlawful.</p></blockquote>

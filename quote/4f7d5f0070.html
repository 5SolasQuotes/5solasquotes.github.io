<main class="wrap"><figure class="quote" id="q-4f7d5f0070" data-kw="">
<blockquote><p>XV. Although we acknowledge the necessity of good works against the Epicureans, we do not on this account confound the law and the gospel and interfere with gratuitous justification by faith alone. Good works are required not for living according to the law, but because we live by the gospel; not as the causes on account of which life is given to us, but as effects which testify that life has been given to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology, trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 705. (17.3.15)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-373d280585" data-kw="">
<blockquote><p>Some of the passages show the quality or condition required of those who are promised eternal life (Heb. 10:36, etc.). Other passages show the mark and way of faith whereby one reaches eternal life (as in Mt. 25:35; James 1:25 and 2:14). And other places point out the fruit and effect of the salvation that has begun and that consists in the forgiveness of sins (as in Lk. 7:47, etc.).</p></blockquote>

</figure><figure class="quote" id="q-685f4674f0" data-kw="">
<blockquote><p>These good works, done in obedience to God’s commandments, are the fruits and evidences of a true and lively faith; and by them believers manifest their thankfulness, strengthen their assurance, edify their brethren, adorn the profession of the gospel, stop the mouths of the adversaries, and glorify God, whose workmanship they are, created in Christ Jesus thereunto, that having their fruit unto holiness they may have the end eternal life.</p></blockquote>

</figure><figure class="quote" id="q-71b550412f" data-kw="">
<blockquote><p>We conclude that Holy Scripture does not speak of a reward such as is owed, by a right of hire, on account of worthiness corresponding to the reward; but rather of that which is conferred not upon the idle but upon those who labor, by virtue of covenant and of a gratuitous promise. Hence it is elsewhere also called an inheritance. Nor ought the name “inheritance” to be thought to prevent its being called a “reward”; for even to an adopted son, who has diligently obeyed his adopter and endured many things for his sake, the inheritance comes by filial right, and yet, in respect of the works he has performed and the afflictions he has undergone, it may be called a reward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gerhard-j-vossius.html">Gerhard J. Vossius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theses on the Merit of Good Works as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 3, pp. 375-76, trans. ChatGPT-5 Vossius (1577-1649) was an Arminian professor of history and politics at Amsterdam.</cite>, p. 76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“We conclude that Holy Scripture does not speak of a reward such as is owed, by a right of hire, on account of worthiness corresponding to the reward; but rather of that which is conferred not upon the idle but upon those who labor, by virtue of covenant and of a gratuitous promise. Hence it is elsewhere also called an inheritance. Nor ought the name “inheritance” to be thought to prevent its being called a “reward”; for even to an adopted son, who has diligently obeyed his adopter and endured many things for his sake, the inheritance comes by filial right, and yet, in respect of the works he has performed and the afflictions he has undergone, it may be called a reward.”

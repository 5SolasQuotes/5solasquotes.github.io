<main class="wrap"><figure class="quote" id="q-cb3f8c4a52" data-kw="">
<blockquote><p>For the first, that our Religion must be grounded on God’s truth, it is the foundation upon which all other duties to God or man are to be built, for if they be not grounded on God’s truth, but devised by man’s brain, they are but human traditions, which the Lord will not accept, neither is it to any purpose, that we shew ourselves earnest, and forward in religion, unless it be true and agreeable to God’s holy word.

… Tis not sufficient that we profess the truth, but it must be done in truth and simplicity of heart; for how glorious soever our profession of the true religion is before men, yet it is abominable in the eyes of God, if it be not in truth, and from an upright heart, Joshua 24.14. Fear the Lord, and serve him in uprightness, and in truth which if we perform in our serving of God; it will be acceptable in his sight, though performed in great weakness, and mingled with many imperfections; let us therefore with our Saviour, pray unto God that we may be sanctified with his truth, that not only whatsoever we do, may be grounded on God’s truth, but that we may do it in truth and uprightness of heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s combat: or, His true spiritual warfare wherein is laid down the nature, power, and cunning deceit of Satan, the great enemy of our salvation. With the means whereby every good Christian may withstand his dreadful assaults</cite>, (London: Charles Tyus, 1664), p. 17.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-818604a118" data-kw="">
<blockquote><p>Conclusion 9: All the divine attributes, although they are really the same and can be predicated of each other in the identical sense, and also the proper effects and determinations of any one attributed to any other attribute, yet in the formal sense they are not predicated of each other without implication of contradiction. For example, the mercy of God formally is His anger or corrective and punitive justice, God hates sin, and condemns and afflicts the sinner with eternal punishments through mercy. But the reason for this implication is because the divine attributes are virtually distinguished, and insofar as they are distinguished they cannot formally be one and the same thing, because their formal effects, for example, to hate and to pity, to save Peter, and to punish Judas, are not formally the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1 tr. AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1 Latin | On the Power of God, pt. 2, p. 372</span></figcaption>

</figure><figure class="quote" id="q-cc5bb007b9" data-kw="">
<blockquote><p>It has become fashionable in modern evangelical and “Reformed” circles to deny the classic catholic and confessional Reformed doctrines of God’s impassibility and simplicity. The early church father, Irenaeus of Lyon reminds us that these doctrines were also denied by the early Gnostic heretics:

By their manner of speaking, they ascribe those things which apply to men to the Father of all, whom they also declare to be unknown to all; and they deny that He himself made the world, to guard against attributing want of power to Him; while, at the same time, they endow Him with human affections and passions.

But if they had known the Scriptures, and been taught by the truth, they would have known, beyond doubt, that God is not as men are; and that His thoughts are not like the thoughts of men. For the Father of all is at a vast distance from those affections and passions which operate among men. He is a simple, uncompounded Being, without diverse members, and altogether like, and equal to himself, since He is wholly understanding, and wholly spirit, and wholly thought, and wholly intelligence, and wholly reason, and wholly hearing, and wholly seeing, and wholly light, and the whole source of all that is good—even as the religious and pious are wont to speak concerning God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/irenaeus-of-lyons.html">Irenaeus of Lyons</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Heresies</cite>, (c. 175-85), 2.13.3 in Ante-Nicene Fathers, 1: 374.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-e2e17d4f76" data-kw="">
<blockquote><p>The divine attributes are certain essential properties, which God is pleased in Scripture to ascribe or attribute unto Himself; they are also called the perfections of God, or divine predications or titles. They are not distinguished from the essence really, but notionally; that is, they are not distinguished at all in God, but only to us-ward, according to our manner of conceiving. All the attributes in God are one and the same perfection. It is better said of God that He is his attributes than that He has attributes: The attributes are not distinguished in God, but in our manner of understanding, who, being unable to comprehend that mere act at once, do conceive thereof after the manner of many acts. (Est inadequatus conceptus sed non falsus [It is an inadequate concept, but not false]. See Weems, Of the Image of God in Man, ch. 13) The sun, when it is perpendicular, had it an eye, would behold all that at once which we, by reason of the inadequateness and unproportionableness of our sight, are necessitated to view by parts. In God all things are one and the same, according to the nature of God; though out of God [they appear] many and diverse, according to their own proper and created nature. The same heat in the sun produces diverse effects according to the various disposition of the objects: hardness in clay, softness in wax, life in insects and plants, etc. The same lines are one in the center, but distinguished and multiplied in the circumference. Water that is the same in the sea, out of the sea is variously and diversely qualified: sweet, bitter, sulfureous, etc. The matter in the liver is the same but the four humors of blood, choller, melancholy and phlegm that proceed from thence are very diverse. The soul which is one and the same produces very differing effects, as appears in the operations of the understanding, will, and affections. The sum is: The attributes, as was said before, are not distinguished in God, that is, from the divine essence or one from another really, but only notionally or virtually in our conception and in their objects in respect of the various effects thereupon: For every and all the attributes are the divine essence itself, according to that received proposition, ‘Whatsoever is in God, is God.’ (Fenner, Theol., bk. 1, ch. 3; Alsted, Theol., sect. 3, locus 2; Zanchi, Of the Nature of God, bk. 2, ch. 5, quest. 2) And this is the reason why some well describe the attributes from the essence of God: which manner of description, besides many useful notions clearly intimated thereby, does in the describing of the relative attributes, principle and fortify the understanding against that perilous tenet of Arminianism concerning the decree passing upon good or bad foreseen, with the evil consequences following thereupon. The divine attributes, though they can neither exactly be numbered or distributed, yet for our better understanding we may consider of them as Negative, Relative, Positive. … That God is a pure and simple act without all composition, is evident, because of his perfection; all composition supposes imperfection, because He is the first Being. Were there any composition in God, it would follow there were first and second in God: Something in God that were not first, or that there were more first Beings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 3-5</span></figcaption>

<blockquote><p>Let our Souls pause and imagine what an Incomprehensible Spirit GOD is! What is his Name, and his Sons Name, if thou canst tell. HE is that He is, has Life in Himself, and in Him we live and move and have our Being. The Worlds of Spirits, and so the Corporeal Universe, are his Workmanship, continually sustained and governed by Him.

His active Essence therefore intimately pervades and penetrates the immeasurable Frame! GOD is Life, Light, Mind, Self-existence; Glory, Blessedness, Perfection; incomparable, inconceivable. To Whom can we liken Him, or what Likeness can we compare unto Him? Singularity and Onliness is his Glory. There is One God, and no other than He.

We should not have dared to say of God that He is a Spirit, or to have called Spirits his Image and Likeness, if He Himself had not so spoken to us of Himself. Yet is there no other Image whereby our Minds can represent Him to themselves, but from their own spiritual Nature, Powers, and Operations. This therefore must be the first thing in the Image of God of Angels and Men, Spirituality. In this Glass we see the first Shadow of God. Our Souls discern it by Reflection on themselves. We then look without, look abroad, and see thro’ the Eyes of the Body Images of Wisdom, Power and Goodness, in every thing Material and Visible.

We see the Work of some perfectly wise, good, Almighty Intelligence. — It is in and from it self, that the poor finite Spirit of Man, conscious to its own Understanding and Affections, and enlightened from the Spirit and Word of God, conceives and infers what a transcendent Being and Spirit God is; the Framer of the Universe, and the Former and Father of all Spirits. It is because we in our Souls bear some Image of God, that we can at all apprehend &amp; know that God is a Spirit. The Beasts have Eyes to see the Fields of Grass and Corn as much as we, but not having our Souls to discern the Eternal Power and Godhead from the Things that are made, their Spirits are not the Likeness of God as ours are.

And yet the spiritual Nature of Angels and Men is not to be compared with the Spirituality of God, or the Simplicity of his Essence. The grossest Matter that our Eyes behold is not so much below the Soul of Man, as that is below the Spirituality of the Divine Nature. Never the less in the Faculties of the Human Soul we plainly see some Resemblance of the Infinite Eternal Spirit, the Maker and Preserver of all Things, visible &amp; invisible. And this is the first and most obvious part of the Image of God upon us in our Creation, that we are Souls or Spirits. God who made us this Soul, herein has made us in his own Image, after his Likeness; for He is THE SPIRIT, and the Father of Spirits.

God is a Spirit in a Sense far superior to that wherein Angels are to be so called. He maketh his Angels Spirits. I doubt not but God is more invisible to them, and in Comparison of them, than they are to us and in Comparison of us. Created Spirits are compounded Beings if compared with their MAKER; they are made what they are, and He who made them can if he please annihilate and dissolve them again.

But there is an ineffable, inconceivable Simplicity of Essence in the Divine Nature, which infinitely distinguishes His Spirituality from that of all Creatures.— Angels and Souls are Spirits but they singly occupy a space, and pass from place to place, with an incredible Swiftness, like Rays of Light; but the Invisible God is an Immense Being filling Heaven and Earth, always present and the same in all Places. This is as far above Souls or Angels, as they are above Bodies.

It is a most just and glorious Account that God gave of Himself to Moses, I AM THAT I AM. He is what no One else is or can be; He is alone what He is; what all his Creatures can but poorly represent, and less can understand; even as the Shadow of a Man does but poorly represent him in his Life, Look, Thought and Speech. — God is singly the Spiritual BEING, and there is none like Him, none beside Him. As there is none Good but One which is God, so is there but One only Spirit in the Universe, who filleth all in all.

Thus the Lord our God is ONE LORD, and the Knowledge of HIM is too wonderful for us; it is high, and we cannot attain to it: yea how little do we know of our own Spirits, which are made for the Knowledge of Him? It is but as thro’ a Glass darkly that we see any thing of GOD. The Ideas of Infinite, Eternal, Unchangeable and Self existent are the Proof and Illustration of his Spirituality. We can only explain and confirm the One from the other. As what Man knoweth the Things of a Man, save the Spirit of Man that is in him? even so the things of God knoweth no Man, but the Spirit of God: Which Things we therefore speak, not in the Words which Man’s Wisdom teacheth, but which the Holy Ghost teacheth, comparing spiritual things with spiritual.</p></blockquote>

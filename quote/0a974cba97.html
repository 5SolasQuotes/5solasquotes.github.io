<main class="wrap"><figure class="quote" id="q-0a974cba97" data-kw="">
<blockquote><p>…yet we find [in the N.T.] whole families baptized, and several saints greeted with the Church of God in such an house, which may as reasonably infer the children and servants of such families to have been baptized, and to have been reckoned Church-members; and we may as reasonably believe there were children in some of their houses and families who were baptized, as they [baptists] can confidently deny it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathaniel-taylor.html">Nathaniel Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Paidobaptismos Orthobaptismos: or, The Baptism of Infants Vindicated by Scriptures &amp; Reasons</cite>, ... (London, 1683), Argument 6, p. 51 Taylor was reformed.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0d115b7eac" data-kw="">
<blockquote><p>The third [sort of Anabaptists, after the two from the Early Church] broached theirs in the year 1525, which was this, (3) that baptism ought to be administred to none, but such as can give a good account of their faith; and in case any have been baptized in their infancy, that they ought to be re-baptized after they come to years of discretion, before they are to be admitted to the church of Christ. … For the third sort of Anabaptists, they have sunk deeper in the former quagmire… For they not only nullify all baptism administered either by Romish priests, or orthodox Protestants, but condemn [the] baptizing of children simply, which neither the first nor the second sort of Anabaptists [in the Early Church] did; for both the Novatians and Donatists, yea, and Pelagians too, though they denied original sin, yet they all allowed and practised the baptism of infants. The author of this third and worst sect of Anabaptists, was, as some say Muncerus; as others, Balthasar Pacimontanus, against whom Zwingli wrote; as others, Carolstadius; but I subscribe to Melancthou, who lived in those times… And he affirms, as I said before, that Nicholas Stock was the first that broached Anabaptism in Germany. This Stock affirmed, that God spake to him by an angel, and revealed his will to him in dreams, promising him the place of the angel Gabriel: in this man’s school was Thomas Muncer bred…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dippers Dipped, or, the Anabaptists Ducked &amp; Plunged</cite>, … (London, 1645), pp. 25 &amp; 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

0dissolving%20the%20bond%20of%20marriage" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b67c148690" data-kw="">
<blockquote><p>For we do not see it necessary to posit, or even possible to posit, actual faith in those infants (which some conjecture, others strongly assert), unless it is solidly proved from Scripture. For that extraordinary and miraculous motion of John the Baptist, Lk. 1:44, seems to contribute nothing to this matter. Since from a miracle no consequence is valid to the ordinary force, causality, disposition, act, or effect of any thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 432 ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-09f6d34181" data-kw="">
<blockquote><p>Lest any understand what I have said a few pages hence, as if I wholly denied common innate principles, observe that it is only actual connate knowledge that I deny, and in respect to which I say that the soul is rasa tabula [a blank slate]; but I confess a natural passive power for the knowing of them, and a greater disposition, or aptitude in the intellect to understand them, than conclusions drawn from them; and so that an infant also may have a sanctified intellect, by such aptitude and disposition. But I think not that ever these would be acted, in an ordinary natural way, without the help of some sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unreasonableness of Infidelity</cite>, (London: R.W., 1655), An Advertisement Explicatory, p. iix</span></figcaption>

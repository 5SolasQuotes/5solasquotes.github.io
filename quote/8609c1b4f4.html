<main class="wrap"><figure class="quote" id="q-8609c1b4f4" data-kw="">
<blockquote><p>The inability of sinful man is not… to be reckoned among those things which are absolutely impossible (adynata)… nor simplynatural (as that is natural from which we are called neither good nor bad; while this inability is certainly vicious and culpable); or as natural is contradistinguished from voluntary (as in a stone or brute there is a natural inability to speak). Our inability is in the highest degree voluntary; or as that is called natural which arises from a defect of natural faculty or power (such as the inability to see in the blind, to walk in the paralytic, to rise in the dead). Our inability does not exclude, but always supposes in man a natural power to understand and will… For although the phrase can in some measure be tolerated when understood of the natural power of willing (never taken away from us in whatever state we may be; as that by which we are distinguished from the brutes), still it cannot be admitted when we speak of the moral disposition of the will to good; not only to willing, but to willing well. Concerning this alone we dispute with our opponents…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, sections 39-40 of Question 4, ‘Whether the free will in a state of sin is so a servant of and enslaved by sin that it can do nothing but sin…’ in Institutes (P&amp;R), vol. 1, 10th Topic, pp. 681-83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-7d5bc10676" data-kw="">
<blockquote><p>…the Reformed customarily distinguish on the one side a fourfold good with which a person can be occupied in his choice, namely: (1) natural good, walking, reasoning; (2) moral good, the exercise of some sort of civil virtue; (3) ecclesiastical good, to which sort belong the duties of external divine worship; and (4) a spiritual and saving good, which accompanies salvation (Heb. 6:9)… With these things posited, they determine that… In the state of grace, through regeneration he recovers the strength lost by sin for doing spiritual and saving good, yet with some sort of a surviving inclination to evil… in the state of sin [being unconverted], to him is present some sort of strength toward natural, moral, and ecclesiastical good, but absolutely none for spiritual and saving good.</p></blockquote>

<blockquote><p>52. Because nothing is done without a sufficient Reason (sect. 1), also liberty in election cannot act without reason, we therefore define the same as that faculty of the mind to elect or choose out of more possible things what one pleases, agreeable to proposed reasons. Hence all coaction [coercion] by which man is compelled thorugh extrinsical violence is at a great distance from liberty; metaphysical necessity, where there is but one only object possible, and consequently election ceases, has nothing to do with liberty; also physical necessity (i.e. natural necessity), when there is no knowledge of the objects, is far distant from liberty (or is utterly inconsistent with the very nature of it); but there is only a moral necessity, which is no more than a certainty so that man is sweetly and willingly inclined or moved to this or that thing from these or other motives, namely because he sees what things are best. 53. Hence since liberty of indifference is repugnant to the principle of a sufficient reason, it is utterly impossible (i.e. there is no liberty of indifference); it is a chimera (or a groundless and vain imagination which has no foundation in reason or nature); it is nothing but the mere inaction of the will; besides let those who maintain an indifference of the equilibrium in liberty (or those who place the essence of liberty in the indifference of the will), let them answer us (let them reply to the following queries, viz.), Whether God, the (holy) angels and all the inhabitants of heaven are not most free, or act with the most perfect liberty? and whether they are indifferent about good and evil?</p></blockquote>

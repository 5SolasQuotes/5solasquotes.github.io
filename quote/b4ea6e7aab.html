<blockquote><p>It must be known that the will of sign (voluntas signi) relates to the will of good-pleasure (voluntas beneplaciti) in three ways: For there is a will of sign which never coincides with the will of good pleasure, such as permission, by which He permits evils to occur, since He never wills evils to occur; Some always coincide, such as operation; But some sometimes coincide and sometimes not, such as precept, prohibition, and counsel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-baptiste-gonet.html">Jean Baptiste Gonet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shield of Thomistic Theology</cite>, 5 vols. 10th ed. (1667; Antwerp: Pitteri, 1744), vol. 1, tract 4, On the Will of God &amp; his Providence, disp. 4, Antecedent &amp; Consequent Will of God tr. AI by The Faith Received | And in the Disputed Questions, quest. 23, On the Will of God, art. 3, reply to 6, he states:</span></figcaption>

<blockquote><p>5. In so doing God does all that belongs to Him to do as Legislator: For it must be understood that here He speaks those words ‘that the world by Him might be saved’ not as absolute-Lord merely or properly, but as Rector per Leges [a Governor through laws]; And it belongs to Him as Legislator only to propound salvation to man as his end: and to promise it on his conditions, and prescribe those conditions and command man to perform them: and to threaten him with the loss of that end (of salvation) if he perform them not. But to give faith, which is the condition itself, does not belong so God as Legislator. (No man living can claim the first act of faith, or effectual grace thereto, from God by any promise that He has made): But He gives it as Dominus absolutus [an absolute Lord], and as one that may do with his own as he list. So that it is Finis prescriptus et conditionaliter datus [the end prescribed and conditionally given], that is here spoken of; and not Finis Decretus [the end decreed] to be by God eventually infallibly accomplished. It is the end of God’s Law and Legislative Will, and so of God as mere Legislator or Rector per Leges: and not of his decretive will de eventu [of the event], and of God as absolute Lord above Laws, without them disposing of his own. (The prediction of events does collaterally and secundum quid [according to that] belong to his Law: but not per se and directly.) And 6. Consider that if it be never so much denied that God has properly a conditional will de rerum eventu [respecting the event of things], yet it is beyond all question true that He has a conditional will de debito [of debt or obligation] (officii, Præmii et Pænæ [of office or duty, reward and punishment]) and so his Law is conditional most commonly. He has constituted the Debitum pramii [debt of reward], the dueness of salvation on condition of believing, loving and sincerely obeying Christ. And therefore they must nor deny conditional promises and threatnings, though they deny conditional, decrees. This I add, because I know they here usually answer that God intends no end conditionally, but where He intends also the condition itself, that so it may be equivalent to absolute: But He intends as Legislator that faith shall be the prescribed means to glory, and glory the end promised to all that perform that condition; and so conditionally gives it.</p></blockquote>

</figure><figure class="quote" id="q-e483399691" data-kw="">
<blockquote><p>Objection 2: Mt. 23:37, ‘How often would I have gathered thy children together, and thou wouldst not. How did Christ will, and so will that He complains of those who would not, if He had not through his help made them able [to] will, whom He knew could not will? Answer. Christ is here said to have willed to gather them together, not by the will of his good pleasure, which may never be resisted, but by his signifying or revealed will. For He is said to will to gather all unto Himself, because by the preaching of the Word He calls all in common unto salvation, and prefixes to Himself this end of preaching, that they should commit themselves to his protection and fidelity. By this will therefore He may will to gather the Jews together, though in the meantime He do not help them, that they themselves may be able to will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian &amp; Plain Treatise of the Manner &amp; Order of Predestination &amp; of the Largeness of God’s Grace</cite>, (d. 1602: London: Welby &amp; Clarke, 1606), 4th Crimination, pp. 170-72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>In light of such problems, Leigh, Maccovius, and Twisse (very much following the tradition) indicate that the voluntas propositi or beneplaciti [proposed will or of good pleasure, i.e. the will of decree] alone is properly called the will of God, ‘which none can resist, Rom. 9:19,’ whereas the voluntas signi or commandment is only ‘improperly’ called God’s will… Baxter does agree with Twisse, however, that the commandments or signs of God are only improperly designated as the divine will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, 3.459</span></figcaption>

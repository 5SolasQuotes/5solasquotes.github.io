<main class="wrap"><figure class="quote" id="q-fcb03157a9" data-kw="">
<blockquote><p>To move them to this purpose to pray for him, or rather for the Gospel, he brings in their own example and experience. Thessalonians. I wish you not to pray for another thing but that ye have experimented your selves; see whether or not the Gospel be glorified among you? yea it is glorified. Ye are not bare professors of it: then are ye not bound to pray the Lord to communicate to other that grace that is bestowed on you? So they who finds the Gospel glorified in themselves, and finds her powerful in their hearts to a sanctified life, are bound to wish and crave this blessing to every soul. if it were possible. Wherefore shall I have a grace if I pray not to God to communicate that grace to another?

Wherefore should I enter in Heaven and not put out my hand to help others to that kingdom, if it be possible? Wherefore should I not pray, thy kingdom come? which is nothing in effect, but, Lord, open Heaven to thy people, and let many enter in, that thou may be glorified. And it is most certain, that, if a man have entered himself in Heaven, he will not inuy [sic] to have others with him; but he will strive to make room, if it were to all the world, that they may enter in. He will not be like the Pharisees that will not enter in Heaven themselves, neither yet will let others enter in it. A man that is once in the light he would have all in the light. As a man that is in darkness would have all in darkness with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the first and second Epistles of Paul to the Thessalonians</cite>, (Edinburgh: Robert Charteris, 1606), Part II, pp 120-21.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-709c62ee8d" data-kw="">
<blockquote><p>The most holy and heavenly man that ever breathed, durst not adventure the salvation of his soul upon the most heavenly thought that ever he conceived. Our impressions of this will help to keep your hearts right in point of righteousness; so as not to build your acceptation before God upon your good works, but only on the works of the Son of God. Study always to keep up the lively impression of this awful truth upon your hearts, that God could find matter of condemnation against you, not only for your worst sins, but from the best of your duties….[A]ll this will not make a righteousness by which I may expect to be justified or accepted of God. No, he [Apostle Paul] accounted all as dung and loss, in the point of justification, that he might be found in Christ, not having his own righteousness. So that you see, even in the presence of your best graces, works, and duties of obedience, free grace through imputed righteousness is to be your only sanctuary and city of refuge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Late Rev. Ebenezer Erskine</cite>, 1:145.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-5dd7c3879c" data-kw="">
<blockquote><p>Now in all dwelling in Christ there is a continual acting of life by believing, joying, resting in God. As Phillip says, Jn. 14:8, ‘Lord, show us the Father and it sufficeth us.’ Here life seeks a soul-satisfying union with life, for life is only a satisfactory object to life. Living things seek no dead things as such to be their happiness if reason do rightly act them, and God as revealed in Jesus Christ is that in which the saints find a soul-sufficiency for themselves; and the act of seeing God in Christ, whether in this life or in the life to come, is an act of life, for the soul lives in the ocean, sea, and bosom of a fair eternal truth. But does it act there? yea, it does, and the Scripture expresses its acting by seeing God, drinking the fountain of life. Then the soul, thus in Christ, drinks in love and milks, and sucks in the soul-rejoicing irradiations of Christ, and Christ letting out the breathings of the sweetness of his excellency on the face of the soul draws and sucks in reciprocally acts of admiration and wondering, Cant. 2:8, ‘The voice of my beloved, behold he cometh leaping upon the mountaines, and skipping on the hills;’ ‘behold’ is a word of wonder, 1 Jn. 3:1, ‘Behold what manner of love the Father hath bestowed on us.’ Not love only, but the manner and the kind of the Father’s love in Christ, is a world’s wonder, and 2 Thess. 1:10, Christ when he comes shall be wondered in them that believe. 2. Then again when we see and enjoy the drawing loveliness of Christ, He as the fountain and well of life pours in, in our intellectuall love and in the glancings and rays of our understanding, acts of divine light, lumps of fresh love from the spring of heaven’s love, and the soul opens its mouth wide and takes in the streams of Christ’s nectar, honey and milk, his consolations and love-breathings; and in his light we seeing light, and in his love, feeling love, He makes out light and love (as it were) coeternal with borrowed eternity; and we go along with the out-shinings of Christ’s bright countenance, to shine in borrowed light, to flame in borrowed coals of love; and as Christ is said to feed his flock among the lilies, the garden of Christ, his Church being the common pasture for the lambs of the flock; so He feeds the souls of the saints that enjoy Him, with the marrow, fatness and dainties of his light and love that shine in his face, even as the oil feeds the lamp; but with this difference, Christ’s dainties are not lessened because we feed upon them, as the oil is consumed with burning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), pp. 360-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-7879f4cc76" data-kw="">
<blockquote><p>The most studied source for Gerald Odonis’ doctrine of the beatiﬁc vision is the text of his Advent 1333 disputed question known as his Quodlibet. The polemic nature of the question and its structural idiosyncrasies have led to diﬃculties in interpreting Odonis’ theory of the ‘middle vision’ of the divine essence that the separate souls of the blessed have, as well as in understanding his defense of Pope John XXII’s controversial opinion [that saints do not enjoy the complete Beatific Vision till after the Final Judgment] (which excludes such a middle vision). By relating Odonis’ 1333 disputation to his earlier commentary on the Sentences… this paper shows how Odonis tried to ﬁt his doctrine of the ‘middle vision’ with his previous discussion…</p></blockquote>

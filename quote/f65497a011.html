<blockquote><p>…a second end of the saints meeting with Christ in the air, and that is their full and final justification; and this consists of two parts: 1. Their publick absolution. 2. The Judge’s pronouncing of them to be righteous.</p></blockquote>

— Thomas Case, pp. 133-38 in 2nd Use in Mount Pisgah, or a Prospect of Heaven, being an Exposition on the Fourth Chapter of the First Epistle of St. Paul to the Thessalonians... (London: Milbourn, 1670), pt. 2, p. 133">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6a+second+end+of+the+saints+meeting+with+Christ+in+the+air%2C+and+that+is+their+full+and+final+justification%3B+and+this+consists+of+two+parts%3A+1.+Their+publick+absolution.+2.+The+Judge%E2%80%99s+pronouncing+of+them+to+be+righteous.%E2%80%9D%0A%0A%E2%80%94+Thomas+Case%2C+pp.+133-38+in+2nd+Use+in+Mount+Pisgah%2C+or+a+Prospect+of+Heaven%2C+being+an+Exposition+on+the+Fourth+Chapter+of+the+First+Epistle+of+St.+Paul+to+the+Thessalonians...+%28London%3A+Milbourn%2C+1670%29%2C+pt.+2%2C+p.+133&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff65497a011.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f65497a011.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-justification-of-believers-at-the-final-judgment/#:~:text=%E2%80%A6a%20second%20end%20of%20the%20saints,pronouncing%20of%20them%20to%20be%20righteous." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a4c340efd8" data-kw="">
<blockquote><p>The question remains whether Christ will in the future, on the day of judgment, justify those who have believed in this life? And if so, is it not true that justification is actually perfected in the life to come rather than in this life? I respond that Christ will not, on that day of judgment, justify believers. He will, rather, declare on the basis of their works that they have believed and have been justified in this life. Indeed, the verb “justify” sometimes has the meaning of “declare justified.” James uses the word in this very sense when he speaks of the man who is justified according to his works. … But justification, someone will say, is a judicial sentence of life. And life is not perfected until Christ’s second coming. Is it not the case, therefore, that justification itself will not be perfected until Christ’s second coming? I respond that it is one thing for the judicial sentence of life to be complete, and another thing for life itself to be perfected. The sentence of life is surely complete already in this life, but life itself will not be perfected until Christ’s second coming. This argument, therefore, is fallacious and captious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’ tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 108-9 Rollock (c. 1555-1599) was a Scottish minister.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/the-last-judgment.html">The Last Judgment</a></span></div>

<blockquote><p>…he [James] prosecutes to the end of the [second] chapter… 3. That every man’s faith (and so together therewith every man that professes himself to have true faith) must one day be put to an open trial, to justify the truth of itself, and of his profession, and this afore all the world. And the believer also will be put upon the justification of his having had such a faith as God (ex consequenti, or ‘in the sequel’) professes only to justify man upon; for at the latter day it is faith [that] is the grace that must be tried and found unto honor and glory, 1 Peter 1:7. And the man that shall plead justification by faith alone (which James contradicts not), and that he had a saving faith, must undergo this examination, whether his faith produced such works, yea or no, as the nature of true faith, with difference from false and unfeigned faith (which James disputes against), does note.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Holiness in the Heart &amp; Life in Works (London: James Nichol, 1861), vol. 7, bk. 2, ch. 2, ‘Paul &amp; the Apostle James are Consistent…’</cite>, p. 179</span></figcaption>

</figure><figure class="quote" id="q-294f84affd" data-kw="">
<blockquote><p>1. God never did, nor ever will, justify and save a wicked Jew that lived and died impenitent, though he was of the seed of Abraham, and a Hebrew of the Hebrews, and had all the honour and advantages that attended circumcision. He does and will render indignation and wrath, tribulation and anguish, upon every soul of man that doeth evil; and of the Jew first, whose privileges and professions, instead of screening him from the judgment of God, will but aggravate his guilt and condemnation. See Rom. 2:3, 8–9, 17. Though God has favoured the Jews, above other nations, with the dignities of visible church-membership, yet He will not therefore accept of any particular persons of that dignity, if they allow themselves in immoralities contradictory to their profession; and particularly in persecution, which was now, more than any other, the national sin of the Jews. 2. He never did, nor ever will, reject or refuse an honest Gentile, who, though he has not the privileges and advantages that the Jews have, yet, like Cornelius, fears God, and worships Him, and works righteousness, that is, is just and charitable towards all men, who lives up to the light he has, both in a sincere devotion and in a regular conversation. Whatever nation he is of, though ever so far remote from kindred to the seed of Abraham, though ever so despicable, nay, though in ever so ill a name, that shall be no prejudice to him. God judges of men by their hearts, not by their country or parentage; and, wherever He finds an upright man, He will be found an upright God, Ps. 18:25. Observe, Fearing God, and working righteousness, must go together; for, as righteousness towards men is a branch of true religion, so religion towards God is a branch of universal righteousness. Godliness and honesty must go together, and neither will excuse for the want of the other. But, where these are predominant, no doubt is to be made of acceptance with God. Not that any man, since the fall, can obtain the favour of God otherwise than through the mediation of Jesus Christ, and by the grace of God in Him; but those that have not the knowledge of Him, and therefore cannot have an explicit regard to Him, may yet receive grace from God for his sake, to fear God and to work righteousness; and wherever God gives grace to do so, as He did to Cornelius, He will, through Christ, accept the work of his own hands. Now: (1) This was always a truth, before Peter perceived it, that God respecteth no man’s person; it was the fixed rule of judgment from the beginning: If thou doest well, shalt thou not be accepted? And, if not well, sin, and the punishment of it, lie at the door, Gen. 4:7. God will not ask in the great day what country men were of, but what they were, what they did, and how they stood affected towards Him and towards their neighbors; and, if men’s personal characters received neither advantage nor disadvantage from the great difference that existed between Jews and Gentiles, much less from any less difference of sentiments and practices that may happen to be among Christians themselves, as those about meats and days, Rom. 14:1-23. It is certain the kingdom of God is not meat and drink, but righteousness, and peace, and joy in the Holy Ghost; and he that in these things serveth Christ is accepted of God, and ought to be approved of men; for dare we reject those whom God doth not? (2) Yet now it was made more clear than it had been; this great truth had been darkened by the covenant of peculiarity made with Israel, and the badges of distinction put upon them; the ceremonial law was a wall of partition between them and other nations; it is true that in it God favoured that nation (Rom. 3:1–2; 9:4), and thence particular persons among them were ready to infer that they were sure of God’s acceptance, though they lived as they listed, and that no Gentile could possibly be accepted of God. God had said a great deal by the prophets to prevent and rectify this mistake, but now at length he does it effectually, by abolishing the covenant of peculiarity, repealing the ceremonial law, and so setting the matter at large, and placing both Jew and Gentile upon the same level before God; and Peter is here made to perceive it, by comparing the vision which he had with that which Cornelius had. Now in Christ Jesus, it is plain, neither circumcision availeth any thing, nor uncircumcision,Gal. 5:6; Col. 3:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts, ch. 10, v. 35, “But in every nation he that feareth Him, and worketh righteousness, is accepted with Him.”</cite></span></figcaption>

event and rectify this mistake, but now at length he does it effectually, by abolishing the covenant of peculiarity, repealing the ceremonial law, and so setting the matter at large, and placing both Jew and Gentile upon the same level before God; and Peter is here made to perceive it, by comparing the vision which he had with that which Cornelius had. Now in Christ Jesus, it is plain, neither circumcision availeth any thing, nor uncircumcision,Gal. 5:6; Col. 3:11.”

is+a+branch+of+true+religion%2C+so+religion+towards+God+is+a+branch+of+universal+righteousness.+Godliness+and+honesty+must+go+together%2C+and+neither+will+excuse+for+the+want+of+the+other.+But%2C+where+these+are+predominant%2C+no+doubt+is+to+be+made+of+acceptance+with+God.+Not+that+any+man%2C+since+the+fall%2C+can+obtain+the+favour+of+God+otherwise+than+through+the+mediation+of+Jesus+Christ%2C+and+by+the+grace+of+God+in+Him%3B+but+those+that+have+not+the+knowledge+of+Him%2C+and+therefore+cannot+have+an+explicit+regard+to+Him%2C+may+yet+receive+grace+from+God+for+his+sake%2C+to+fear+God+and+to+work+righteousness%3B+and+wherever+God+gives+grace+to+do+so%2C+as+He+did+to+Cornelius%2C+He+will%2C+through+Christ%2C+accept+the+work+of+his+own+hands.+Now%3A+%281%29+This+was+always+a+truth%2C+before+Peter+perceived+it%2C+that+God+respecteth+no+man%E2%80%99s+person%3B+it+was+the+fixed+rule+of+judgment+from+the+beginning%3A+If+thou+doest+well%2C+shalt+thou+not+be+accepted%3F+And%2C+if+not+well%2C+sin%2C+and+the+punishment+of+it%2C+lie+at+the+door%2C+Gen.+4%3A7.+God+will+not+ask+in+the+great+day+what+country+men+were+of%2C+but+what+they+were%2C+what+they+did%2C+and+how+they+stood+affected+towards+Him+and+towards+their+neighbors%3B+and%2C+if+men%E2%80%99s+personal+characters+received+neither+advantage+nor+disadvantage+from+the+great+difference+that+existed+between+Jews+and+Gentiles%2C+much+less+from+any+less+difference+of+sentiments+and+practices+that+may+happen+to+be+among+Christians+themselves%2C+as+those+about+meats+and+days%2C+Rom.+14%3A1-23.+It+is+certain+the+kingdom+of+God+is+not+meat+and+drink%2C+but+righteousness%2C+and+peace%2C+and+joy+in+the+Holy+Ghost%3B+and+he+that+in+these+things+serveth+Christ+is+accepted+of+God%2C+and+ought+to+be+approved+of+men%3B+for+dare+we+reject+those+whom+God+doth+not%3F+%282%29+Yet+now+it+was+made+more+clear+than+it+had+been%3B+this+great+truth+had+been+darkened+by+the+covenant+of+peculiarity+made+with+Israel%2C+and+the+badges+of+distinction

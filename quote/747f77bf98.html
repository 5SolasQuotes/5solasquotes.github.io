<main class="wrap"><figure class="quote" id="q-747f77bf98" data-kw="">
<blockquote><p>Here followeth now the second part of the magistrates’ ordinance, which consisteth in making good laws for the preservation of honesty, justice, and public peace; which is likewise accomplished in good and upright laws. But some there are who think it mere tyranny to lay laws on free men’s backs, as it were a yoke upon necks not used to labour; supposing that every one ought rather to be left to his own will and discretion. The apostle indeed did say, “The law is not given for the just, but for the unjust:” but the cause, why the law is not given to the just, is because he is just; for the just worketh justice, and doth of his own accord the thing which the law exacteth of every mortal man. Wherefore the law is not troublesome to the just man, because it is agreeable to the mind and thoughts of upright livers, who do embrace it with all their hearts. But the unjust desireth nothing more than to live as he lusteth: he is not conformable in any point to the law, and therefore must he by the law be kept under, and bridled from marring himself and hurting other.

So then, since to good men the laws are no troublesome burden but an acceptable pleasure, which are also necessary for the unjust, as ordained for the bridling of lawless and unruly people; it followeth consequently, that they are good and profitable for all men, and not to be rejected of any man. What may be said of that, moreover, that God himself, who did forsee the disposition of us men, what we would be, and hath still favoured the true liberty which he desired always to have preserved among his people, as one that ever meant them good, and never did ordain the thing that should turn to their hinderance or discommodity; that God himself (I say) was their lawgiver, and hath not suffered any age at any time to live as people without a law? Yea too, those commonweals have been happy always, that have admitted laws, and submitted themselves to be governed by laws; when as, contrarily, those kingdoms have of all other been most miserable, and torn in pieces by civil dissensions and foreign enemies, which, having banished upright laws, did strive to maintain their own kind of freedom, their uncontrolled dealing and licentious liberty, that is, their beastly lust and uncivil rudeness. Good laws therefore are for the health and preservation of the people, and necessary for the peace and safeguard of commonweals and kingdoms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 337-8.</span></figcaption>

<blockquote><p>These Calamities have not come upon us without Warnings. We were long ago apprised of the ambitious Schemes of our Enemies, and their Motions to carry them into Execution: And had we taken timely Measures, they might have been crushed, before they could arrive at such a formidable Height. But how have we generally behaved in such a critical Time; Alas! our Country has been sunk in a deep Sleep: A stupid Security has unmanned the Inhabitants: They could not realize a Danger at the Distance of 2 or 300 Miles: They would not be persuaded, that even French Papists could seriously design us an Injury: And hence little or nothing has been done for the Defence of our Country in Time, except by the Compulsion of Authority.

And now, when the Cloud thickens over our Heads, and alarms every thoughtful Mind with its near Approach, Multitudes, I am afraid, are still dissolved in careless Security, or enervated with an effeminate, cowardly Spirit. When the melancholy News first reached us concerning the Fate of our Army, then we saw how natural it is for the Presumptuous to fall into the opposite Extreme of unmanly Despondence and Consternation; and how little Men could do in such a Panic for their own Defence.

We have also suffered our poor Fellow-Subjects in the Frontier Counties to fall a helpless Prey to Blood-thirsty Savages, without affording them proper Assistance, which as Members of the same Body Politic, they had a Right to expect. They might as well have continued in a State of Nature, as be united in Society, if in such an Article of extreme Danger, they are left to shift for themselves. The bloody Barbarians have exercised on some of them the most unnatural and leisurely Tortures; and others they have butchered in their Beds, or in some unguarded Hour.

Can human Nature bear the Horror of the Sight! See yonder! the hairy Scalps, clotted with Gore! the mangled Limbs! the ript-up Women! the Heart and Bowels, still palpitating with Life, smoking on the Ground! See the Savages swilling their Blood, and imbibing a more outrageous Fury with the inhuman Draught! Sure these are not Men; they are not Beasts of Prey; they are something worse; they must be infernal Furies in human Shape. And have we tamely looked on, and suffered them to exercise these hellish Barbarities upon our Fellow-Men, our Fellow-Subjects, our Brethren? Alas! with what Horror must we look upon ourselves, as being little better than Accessories to their Blood?

And shall these Ravages go on unchecked? Shall Virginia incur the Guilt and the everlasting Shame, of tamely exchanging her Liberty, her Religion, and her All, for arbitrary Gallic Power, and for Popish Slavery, Tyranny and Massacre? Alas! are there none of her Children, that enjoyed all the Blessings of her Peace, that will espouse her Cause, and befriend her now in the Time of her Danger? Are Britons utterly degenerated by so short a Remove from their Mother-Country?

Is the Spirit of Patriotism entirely extinguished among us? And must I give thee up for lost, O my Country, and all that is included in that important Word? Must I look upon thee as a conquered, enslaved Province of France, and the Range of Indian Savages? My Heart breaks at the Thought. And must ye, our unhappy Brethren in our Frontiers, must ye stand the single Barriers of a ravaged Country, unassisted, unbefriended, unpitied? Alas! must I draw these shocking Conclusions?

No; I am agreeably checked by the happy, encouraging Prospect now before me. Is it a pleasing Dream? Or do I really see a Number of brave Men, without the Compulsion of Authority, without the Prospect of Gain, voluntarily associated in a Company, to march over horrendous Rocks and Mountains, into an hideous Wilderness, to succour their helpless Fellow-Subjects, and guard their Country?

Yes, Gentlemen, I see you here upon this Design; and were you all united to my Heart by the most endearing Ties of Nature, or Friendship, I could not wish to see you engaged in a nobler Cause; and whatever the Fondness of Passion might carry me to, I am sure my Judgment would never suffer me to persuade you to desert it. You all generously put your Lives in your Hands; and sundry of you have nobly disengaged yourselves from the strong and tender Ties that twine about the Heart of a Father, or a Husband, to confine you at home in inglorious Ease, and sneaking Retirement from Danger, when your Country calls for your Assistance.

While I have you before me, I have high Thoughts of a Virginian; and I entertain the pleasing Hope that my Country will yet emerge out of her Distress, and flourish with her usual Blessings. I am gratefully sensible of the unmerited Honour you have done me, in making Choice of me to address you upon so singular and important an Occasion: And I am sure I bring with me a Heart ardent to serve you and my Country, though I am affraid my Inability, and the Hurry of my Preparations, may give you Reason to repent your Choice. I cannot begin my Address to you with more proper Words than those of a great General, which I have read to you: Be of good Courage, and play the Men, for your People, and for the Cities of your God; and the Lord do what seemeth him good.</p></blockquote>

+before+me.+Is+it+a+pleasing+Dream%3F+Or+do+I+really+see+a+Number+of+brave+Men%2C+without+the+Compulsion+of+Authority%2C+without+the+Prospect+of+Gain%2C+voluntarily+associated+in+a+Company%2C+to+march+over+horrendous+Rocks+and+Mountains%2C+into+an+hideous+Wilderness%2C+to+succour+their+helpless+Fellow-Subjects%2C+and+guard+their+Country%3F%0A%0AYes%2C+Gentlemen%2C+I+see+you+here+upon+this+Design%3B+and+were+you+all+united+to+my+Heart+by+the+most+endearing+Ties+of+Nature%2C+or+Friendship%2C+I+could+not+wish+to+see+you+engaged+in+a+nobler+Cause%3B+and+whatever+the+Fondness+of+Passion+might+carry+me+to%2C+I+am+sure+my+Judgment+would+never+suffer+me+to+persuade+you+to+desert+it.+You+all+generously+put+your+Lives+in+your+Hands%3B+and+sundry+of+you+have+nobly+disengaged+yourselves+from+the+strong+and+tender+Ties+that+twine+about+the+Heart+of+a+Father%2C+or+a+Husband%2C+to+confine+you+at+home+in+inglorious+Ease%2C+and+sneaking+Retirement+from+Danger%2C+when+your+Country+calls+for+your+Assistance.%0A%0AWhile+I+have+you+before+me%2C+I+have+high+Thoughts+of+a+Virginian%3B+and+I+entertain+the+pleasing+Hope+that+my+Country+will+yet+emerge+out+of+her+Distress%2C+and+flourish+with+her+usual+Blessings.+I+am+gratefully+sensible+of+the+unmerited+Honour+you+have+done+me%2C+in+making+Choice+of+me+to+address+you+upon+so+singular+and+important+an+Occasion%3A+And+I+am+sure+I+bring+with+me+a+Heart+ardent+to+serve+you+and+my+Country%2C+though+I+am+affraid+my+Inability%2C+and+the+Hurry+of+my+Preparations%2C+may+give+you+Reason+to+repent+your+Choice.+I+cannot+begin+my+Address+to+you+with+more+proper+Words+than+those+of+a+great+General%2C+which+I+have+read+to+you%3A+Be+of+good+Courage%2C+and+play+the+Men%2C+for+your+People%2C+and+for+the+Cities+of+your+God%3B+and+the+Lord+do+what+seemeth+him+good.%E2%80%9D%0A%0A%E2%80%94+Samuel+Davies%2C+Religion+and+patriotism+the+constituents+of+a+good+soldier.+A+sermon+preached+to+Captain+Overton%E2%80%99s+Independent+Company+of+Volunteers%2C+raised+in+Han </figure><figure class="quote" id="q-28472d13d7" data-kw="">
<blockquote><p>To have a scrupulous conscience about matters of indifference argues a weak Christian; for so the Apostle calls them “weak in the faith,” such as bound conscience when Scripture left it free. One believer thought he might eat anything, and another doubted the lawfulness of eating sundry things. Now those who doubted, the Apostle called weak; and the weak conscience is apt to be defiled. Not to know our liberty, and to abuse our liberty, is an argument we have but little grace. Young converts call more things sins than ever God did; they perplex and entangle themselves merely in indifferent things. It is true, there ought to be a conscientious tenderness in all Christians; tenderness of conscience is our duty, but a tormenting, entangling scrupulosity is our infirmity. And yet, as a weak Christian is better than no Christian, a weak faith is better than a seared conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace: the truth, growth, and different degrees</cite>, ed. Don Kistler (Morgan PA, 1997), pp 17-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-6f6fce6380" data-kw="">
<blockquote><p>…and some Christian commonwealths, he [Barclay] means his own synagogue of Rome, spiritual Sodom, a cage of unclean birds, suffers harlots by law; and the whores pay so many thousands yearly to the Pope, and are free of all punishment by law, to eschew [avoid or lessen] homicides, adulteries of Romish priests, and other greater sins; therefore [it would conclude] God has given power to a king to play the tyrant without any fear of punishment to be inflicted by man. But if this be a good argument, the magistrate to whom God has committed the sword to take vengeance on evil doers (Rom. 13:3-6), such as are perjured persons, professed whores and harlots, has a lawful power from God to connive at sins and gross scandals in the commonwealth, as they dream that the king has power given from God to exercise all acts of tyranny without any resistance. But:

1. This was a grievous sin in Eli, that he being a father and a judge, punished not his sons for their uncleanness, and his house, in God’s heavy displeasure, was cut off from the priesthood therefore. Then God has given no such power to the judge.

2. The contrary duty is lying on the judge to execute judgment for the oppressed (Job 29:12-17; Jer. 22:15-16) and perverting of judgment, and conniving at the heinous sins of the wicked, is condemned (Num. 5:31-32; 1 Sam. 15:23; 1 Kings 29:42-43; Isa. 1:17; 10:1; 5:23); and therefore God has given no power to a judge to permit wicked men to commit grievous crimes without any punishment. As for the [Mosaic] law of divorce, it was indeed a permissive law, whereby the husband might give the wife a bill of divorce and be free of punishment before men, but not free of sin and guiltiness before God, for it was contrary to God’s institution of marriage at the beginning, as Christ says; and the prophet says (Mal. 2) that the Lord hates putting away; but that God has given any such permissive power to the king, that he may do what he pleases, and cannot be resisted, this is in question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1644; Edinburgh: Ogle, 1843), question 18, p. 76 lt col mid-bot</span></figcaption>

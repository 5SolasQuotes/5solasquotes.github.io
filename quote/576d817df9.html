<main class="wrap"><figure class="quote" id="q-576d817df9" data-kw="">
<blockquote><p>They do not receive this grace as they ought to do. They let it into the ear, giving it the hearing, but not into the heart, embracing of it. They shut the door of their souls against it. Now upon this condition it is that Christ promises to communicate Himself and his grace to those to whom He comes, viz. if they shall open the door to Him, ‘Behold, I stand at the door and knock, if any man hear my voice and open the door, I will come in, and sup with him, and he with Me.’ (Rev. 3.20). It is not the bare hearing of the voice of Christ speaking in his word, but the opening of the door, the letting of Him into the soul, receiving and entertaining Him by faith and love that will bring men to have communion with Him to be made partakers of his grace and Spirit. Now this many will not do; they shut the door of their souls against Jesus Christ, not letting in the motions of his Spirit into their hearts, but opposing, resisting it. This is that which Stephen charges upon the Jews, Acts 7:51, ‘Ye stiff-necked and uncircumcised in heart, and ears, ye do always resist the holy Ghost; as your fathers did so do you.’ And so is it with many, they hear the Word, but they do not let in the monitions of it, nor the motions of the Spirit into their hearts. Question: Why, but is not the grace of God irresistible? A. This is made a matter of controversy, eagerly debated betwixt Arminians and Orthodox divines; I shall not now wade into it. In a word take this resolution: The Spirit of grace in itself is irresistible (I mean so irresistible, as that though it may be opposed, yet it cannot be conquered) but it does not always work in an irresistable way and manner. In itself (I say) it is irresistible, so as if it will put forth its strength, it is able to make way for the motions of it; able to open the door of the soul, though never so closed shut against it, so as not only to illuminate the mind, but also to change the will; not by forcing and constraining it (which being contrary to the nature of the will, is inconsistent with it; should the will be forced, it should cease to be a will, the property whereof is to act freely), but by sweetly inclining it, of unwilling, making it willing to comply and yield to such terms as are tendered to it; by which means the grace of God becomes effectual in it. But this I shall not enlarge upon, resting contented with this, that the grace of God is sufficient for all that shall receive it: sufficient for their conversion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brinsley.html">John Brinsley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aqua cœlestis, or a Sovereign Cordial extracted from the Sufficiency of Divine Grace &amp; Strength made Perfect in Weakness</cite>, … (London: Sawbridge, 1663), pp. 54-56</span></figcaption>

<blockquote><p>Temptation: God has a double calling of men: an outward calling, by preaching the Word in men’s ears; an inward, by the irresistible work of the Spirit in their hearts. The outward calling is a part of God’s outward will: the inward and effectual calling is a part of his secret will. He calls me only with the outward call: and therefore I cannot be assured of God’s goodwill and meaning that I should believe, repent and be saved. Minister: You misconceive Gods calling. His outward calling by preaching the word in men’s ears is a means to convey the sense of the word preached inwardly to their understandings, and mediante intellectu [the intellect mediating], inwardly to stir up their wills to the doing of such things as they now see would make for their eternal good. And I appeal unto your own knowledge and experience: Did the Word preached never pierce further than your ears? Has it not enlightened your understanding with the wholesome doctrine of the gospel? Has not God’s Spirit at some time or other by the Word inwardly moved you to break off your sinful and lustful courses and to lead a sober, just and religious life? Why do you, contrary to your own conscience, falsely accuse God of affording you a bare outward calling, but no inward? Why do you traduce Him as not willing that you should believe, repent and so be saved? Take it for a certain rule: God always wills men should do those things which by his Word-written He enjoins them to do, and by his Spirit enlightening and inciting He so helps them to do that it is only the voluntary perverseness and stubbornness of their own wills resisting the Word and the Spirit which hinders them from doing those things which they should. It is true that God can make any hard and resisting heart a soft and obedient heart; and He does it where He has an eternal purpose out of special mercy so to do: And it is as true that God may justly leave a stubborn heart to his own resistency and perverseness; and this He does where He has purposed in justice so to do. Deus miseretur cujus vult, et quem vult indurat [God shows mercy to whom He wills, and He hardens whom He wills, Rom. 9:18]. If you long to be assured of this secret meaning or purpose of God towards you in particular before you resolve upon your repentance, I can assure you that it is the Devil who has stirred up in you a longing after a thing impossible that so he may procure your destruction. Strive therefore to bring this foolish and wicked fancy out of your mind and to judge of the meaning of God which belongs unto you according to his Word revealed unto you, leaving his secret and unsearchable will unto Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind</cite>, … (Cambridge, 1641), ‘To his imaginary conference’, pp. 476-77</span></figcaption>

<blockquote><p>For the part that most constantly teaches the forceableness of conversion, holds such a kind of actuating the will as does no whit hurt or infringe the liberty thereof; yea rather, which profits it; and while they speak of an irresistible act in turning us, they mean not such an act as cannot be at all resisted, if we would, but such a one as the will, through God’s gracious inclination, would not wish to resist, for that their will to resist is so overcome by the sweet motions of God’s Spirit, that now yieldance is made powerfully voluntary;</p></blockquote>

<blockquote><p>Wherefore we must grant that it is the effect, the event in the communication of the things promised, that is ascribed unto this covenant, and not only the use and application of means unto their production.</p></blockquote>

</figure><figure class="quote" id="q-1a4f8877c3" data-kw="">
<blockquote><p>Obs. XXIX. The new covenant is made with them alone who effectually and eventually are made partakers of the grace of it. — “This is the covenant that I will make with them,..... I will be merciful unto their unrighteousness,” etc. Those with whom the old covenant was made were all of them actual partakers of the benefits of it; and if they are not so with whom the new is made, it comes short of the old in efficacy, and may be utterly frustrated. Neither doth the indefinite proposal of the terms of the covenant prove that the covenant is made with them, or any of them, who enjoy not the benefits of it. Indeed this is the excellency of this covenant, and so it is here declared, that it doth effectually communicate all the grace and mercy contained in it unto all and every one with whom it is made; whomsoever it is made withal, his sins are pardoned.</p></blockquote>

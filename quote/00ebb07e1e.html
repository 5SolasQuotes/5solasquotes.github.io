<main class="wrap"><figure class="quote" id="q-00ebb07e1e" data-kw="">
<blockquote><p>How happy will that state be, when neither divine nor human learning shall be confined and imprisoned within only two or three nations of Europe, but shall be diffused all over the world, and this lower world shall be all over covered with light, the various parts of it mutually enlightening each other; when the most barbarous nations shall become as bright and polite as England; when ignorant heathen lands shall be stocked with most profound divines and most learned philosophers; when we shall from time to time have the most excellent books and wonderful performances brought from one end of the earth and another to surprise us—sometimes new and wondrous discoveries from Terra Australis Incognita, admirable books of devotion, the most divine and angelic strains from among the Hottentots, and the press shall groan in wild Tartary—when we shall have the great advantage of the sentiments of men of the most distant nations, different circumstances, customs and tempers; [when] learning shall not be restrained [by] the particular humour of a nation or their singular way of treating of things; when the distant extremes of the world shall shake hands together and all nations shall be acquainted and they shall all join the forces of their minds in exploring the glories of the Creator, their hearts in loving and adoring him, their hands in serving him, and their voices in making the world to ring with his praise.

What infinite advantages will they have for discovering the truth of every kind, to what they have now! There will continually be something new and surprising discovered in one part of the world and another [because of] the vast number of explorers, their different circumstances, their different paths to come at the truth. How many instructive and enlightening remains of antiquity will be discovered, here and there now buried amongst ignorant nations!</p></blockquote>

</figure><figure class="quote" id="q-647983ef1f" data-kw="">
<blockquote><p>This invented or will-worship [Col. 2:23], Cultus arbitrarius, has two specious things in it, as the apostle says: 1. The first is a kind of wisdom, and carries with it a trim show thereof: when a man shall be thought so wise as that he is able to devise and invent a worship for God, especially when men consider not what God has already prescribed, whereby their rites prove contrary to what He has appointed, and so they will be wiser than God. … Although, all will-worship, [Greek], be taken in an evil sense by many, upon the vulgar exposition of that place in Col. 2:23, yet that there may be some voluntary or free worship acceptable to God, though not specially commanded, provided it be not corruptive of or contrary to any right or worship commanded by Him, but subservient or agreeable thereto, is the judgement of learned divines; For under the law they had their voluntary and free-will offerings, besides those commanded by God, and though things were more particularly prescribed in the Levitical worship than now under the Gospel, the Church being then in its childhood, and confined to one nation, and the Spirit not then so plentifully given as now since the ascension of Christ, yet even then the Church prescribed diverse things in God’s worship not specially commanded, as in fasts and festival days, as that of the dedication of the Temple, approved by Christ’s own observance, Jn. 10, and sundry other things, all which were never taxed as unlawful, unless the worship appointed by God Himself were thereby corrupted or neglected, and so the continual practice of the Christian Church has been to prescribe and order several things in God’s worship, which no peaceable and holy men ever found fault with, provided, that they were agreeable to those general rules of moral worship required by God and no ways repugnant to those rites by Him appointed, but rather subservient to them, and contained nothing either impious and forbidden, or vain and ridiculous; nor the observance of them preferred before the commandments of God, or made equal to them; but a difference observed between things of immediate divine institution and those of ecclesiastical institution: To add to God’s institution anything as from God is forbidden, Dt. 12:32, but to add something for the more decent and orderly performance of what God has appointed, and to observe the same as an ecclesiastical institution, is nowhere forbidden, but rather commanded in all those texts that require us to hear the Church [Mt. 18] and to give obedience to her; and to observe this is also to obey God, who has given his Church power to ordain such things: And that that place in Col. 2:23, condemns not all voluntary or free worship no more than it does humility and chastening, or keeping under the body which are joined therewith, but rather that it makes for it has been lately proved by judicious and learned divines; and by one in a full tract upon this subject of will-worship; for the apostle there condemning certain Jewish and Pythagorean observances about touching, tasting, etc. says, verse 23, that they had a show of wisdom, if due cautions were observed, viz. if they were freely and voluntarily undertaken, not as necessary to salvation, and without rejecting what God had made, and if they were used in humility or modesty not condemning others which used them not, and if they sought thereby only to keep under the flesh. The contrary to all which those Pythagoreans and Jews practiced. By which exposition, which I take to be the most true, it is plain that the apostle is so far from condemning all voluntary or will-worship, that he rather approves and commends it, and condemns their forbearance of meats and other things because it was not freely or voluntarily undertaken, but as a thing necessary to salvation, etc. See [Hugo] Grotius in Col. 2:23, Et votum pro pace, pp. 100-103, and [Andrew] Rivet, Apologeticus, pp. 109-10, etc. Dr. [Henry] Hammond, Of Will-Worship. See also our reverend author in his sermon on Mt. 6:16, p. 124, etc. and on 1 Cor. 11:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Moral Law Expounded: Largely, Learnedly, Orthodoxly</cite>, … upon the Ten Commandments… (d. 1626; London: Sparke, 1642), On the Ten Commandments, 2nd Commandment, ch. 1, pp. 194-95 See, p. 196 for more.</span></figcaption>

n+Church+has+been+to+prescribe+and+order+several+things+in+God%E2%80%99s+worship%2C+which+no+peaceable+and+holy+men+ever+found+fault+with%2C+provided%2C+that+they+were+agreeable+to+those+general+rules+of+moral+worship+required+by+God+and+no+ways+repugnant+to+those+rites+by+Him+appointed%2C+but+rather+subservient+to+them%2C+and+contained+nothing+either+impious+and+forbidden%2C+or+vain+and+ridiculous%3B+nor+the+observance+of+them+preferred+before+the+commandments+of+God%2C+or+made+equal+to+them%3B+but+a+difference+observed+between+things+of+immediate+divine+institution+and+those+of+ecclesiastical+institution%3A+To+add+to+God%E2%80%99s+institution+anything+as+from+God+is+forbidden%2C+Dt.+12%3A32%2C+but+to+add+something+for+the+more+decent+and+orderly+performance+of+what+God+has+appointed%2C+and+to+observe+the+same+as+an+ecclesiastical+institution%2C+is+nowhere+forbidden%2C+but+rather+commanded+in+all+those+texts+that+require+us+to+hear+the+Church+%5BMt.+18%5D+and+to+give+obedience+to+her%3B+and+to+observe+this+is+also+to+obey+God%2C+who+has+given+his+Church+power+to+ordain+such+things%3A+And+that+that+place+in+Col.+2%3A23%2C+condemns+not+all+voluntary+or+free+worship+no+more+than+it+does+humility+and+chastening%2C+or+keeping+under+the+body+which+are+joined+therewith%2C+but+rather+that+it+makes+for+it+has+been+lately+proved+by+judicious+and+learned+divines%3B+and+by+one+in+a+full+tract+upon+this+subject+of+will-worship%3B+for+the+apostle+there+condemning+certain+Jewish+and+Pythagorean+observances+about+touching%2C+tasting%2C+etc.+says%2C+verse+23%2C+that+they+had+a+show+of+wisdom%2C+if+due+cautions+were+observed%2C+viz.+if+they+were+freely+and+voluntarily+undertaken%2C+not+as+necessary+to+salvation%2C+and+without+rejecting+what+God+had+made%2C+and+if+they+were+used+in+humility+or+modesty+not+condemning+others+which+used+them+not%2C+and+if+they+sought+thereby+only+to+keep+under+the+flesh.+The+contrary+to+all+which+those+Pythagoreans+and+Jews+practiced.+By+which+exposition%2C+which+I+take+to+be+the+most+true%2C+it+is+plain+that+the+apostle+is+so+far+from+condemning+all+voluntary+or+will-worship%2C+that+he+rather+approves+and+commends+it%2C+and+condemns+their+forbearance+of+meats+and+other+things+because+it+was+not+freely+or+voluntarily+undertaken%2C+but+as+a+thing+necessary+to+salvation%2C+etc.+See+%5BHugo%5D+Grotius+in+Col.+2%3A23%2C+Et+votum+pro+pace%2C+pp.+100-103%2C+and+%5BAndrew%5D+Rivet%2C+Apologeticus%2C+pp.+109-10%2C+etc.+Dr.+%5BHenry%5D+Hammond%2C+Of+Will-Worship.+See+also+our+reverend+author+in+his+sermon+on+Mt.+6%3A16%2C+p.+124%2C+etc.+and+on+1+Cor.+11%3A16.%E2%80%9D%0A%0A%E2%80%94+Lancelot+Andrewes%2C+The+Moral+Law+Expounded%3A+Largely%2C+Learnedly%2C+Orthodoxly%2C+%E2%80%A6+upon+the+Ten+Commandments%E2%80%A6+%28d.+1626%3B+London%3A+Sparke%2C+1642%29%2C+On+the+Ten+Commandments%2C+2nd+Commandment%2C+ch.+1%2C+pp.+194-95+See%2C+p.+196+for+more.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F647983ef1f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/647983ef1f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-regulative-principle-of-worship/#:~:text=This%20invented%20or%20will%2Dworship%20%5BCol.%202%3A23,etc.%20and%20on%201%20Cor.%2011%3A16&amp;text=This%20invented%20or%20will%2Dworship%20%5BCol.%202%3A23%5D%2C%20Cultus%20arbitrarius&amp;text=p.%20124%2C%20etc.%20and%20on%201%20Cor.%2011%3A16" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>3. Labour or pains for the enjoyment of the benefit and advantage of the solemn assemblies of the church, and in them of the appointed worship of God, is so far from entrenching on the rest of this day that it belongs unto its due observance. A mere bodily rest is no part of religious worship in itself; nor does it belong unto the sanctification of this day any farther than as it is a means for the due performance of the other duties belonging to it. We have no bounds under the gospel for a Sabbath-day’s journey, provided it be for Sabbath ends. In brief, all pains or labour that our station and condition in this world, that our troubles which may befall us, or any thing else, make necessary, as that without which we cannot enjoy the solemn ends and uses of this holy day of rest, are no way inconsistent with the due observance of it. It may be the lot of one man to take so much pains and to travel so far for, and in the due celebration of the Lord’s day, as if another should do the like without his occasions and circumstances, it would be a profanation of it.</p></blockquote>

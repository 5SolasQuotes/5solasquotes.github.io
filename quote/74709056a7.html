<main class="wrap"><figure class="quote" id="q-74709056a7" data-kw="">
<blockquote><p>[T]here is a clear and present danger that the devil may take away from us the pure doctrine of faith and may substitute for it the doctrines of works and of human traditions. It is very necessary, therefore, that this doctrine of faith be continually read and heard in public.

No matter how well known it may be or how carefully learned, the devil, our adversary, who prowls around and seeks to devour us (1 Peter 5:8), is not dead. Our flesh also goes on living. Besides, temptations of every sort attack and oppress us on every side. Therefore this doctrine can never be discussed and taught enough. If it is lost and perishes, the whole knowledge of truth, life, and salvation is lost and perishes at the same time. But if it flourishes, everything good flourishes — religion, true worship, the glory of God, and the right knowledge of all things and of all social conditions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Galatians: Chapters 1-4</cite>, (1535) in Luther’s Works: Volume 26, trans. and ed. Jaroslav Pelikan (St Louis, MO: Concordia Publishing House, 1963), p. 3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c7993e6b31" data-kw="">
<blockquote><p>Beauty and goodness in a thing are identical fundamentally; for they are based upon the same thing, namely, the form; and consequently goodness is praised as beauty. But they differ logically, for goodness properly relates to the appetite (goodness being what all things desire); and therefore it has the aspect of an end (the appetite being a kind of movement towards a thing). On the other hand, beauty relates to the cognitive faculty; for beautiful things are those which please when seen. Hence beauty consists in due proportion; for the senses delight in things duly proportioned, as in what is after their own kind—because even sense is a sort of reason, just as is every cognitive faculty. Now since knowledge is by assimilation, and similarity relates to form, beauty properly belongs to the nature of a formal cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1, q. 5, art. 4, reply to obj. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-dcd0422f7c" data-kw="">
<blockquote><p>I may say as Augustine did, though a good conscience be sufficient for myself, yet a good name is necessary for others; a good name is as precious ointment, yet there will not be wanting many flying reports to corrupt it; many are the obloquies and reproaches which by the sons of slander are cast upon me, they would fain have my name to be buried and rot above ground, before my friends can bury my body under it, yet herein is my comfort: there will be a resurrection of names as well as of bodies at the Last Day; I am assured that God will not only wipe off all tears from mine eyes, but all reproaches from my name also; I am, as says the apostle, counted a deceiver, yet true; as an apostate, yet firm to my first principles.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-363858582a" data-kw="">
<blockquote><p>If by God’s Scriptures these precedents be so plain, that reasonably no man can deny any point thereof, then have I good hope, that ye will admit it to be necessary, that you avoid idolatry, if the league betwixt God and you shall be kept sure. And, first, it is to be observed, that God’s justice being infinite in matters of religion, requireth like obedience of all those that be within this league at all times, that he requireth of every one nation or particular man in any one age. For all that be within this league are one body, as Moses doth witness reckoning men, women, children, servants, princes, priests, officers, and strangers, within the covenant of the Lord (Deut. 29). Then, what God requireth of one (as touching this league), he requireth of all, for his justice is immutable; and what he condemneth in any one, that he must condemn in others, for he is righteous without partiality.

Then, let us consider what God hath required of such as have been in league with him, and what he pronounceth damnable. Moses, the mouth of God to his people of Israel, speaketh as follows, ‘If thy brother, the son of thy mother, or the wife of thine own bosom, or thy neighbour whom thou lovest as thine own life, shall privily solicit thee, saying, Let us go and serve other gods whom thou hast not known, etc., obey him not, hear him not, neither yet let thine eye spare him: be not merciful unto him, nor hide him, but kill him. Let thy hand be first upon him, that such a one may be killed, and then the hand of the whole people. Stone him with stones till he die.’ [Deut. 13] And so likewise commandeth he to be done with a whole city, if the indwellers thereof turn back to idolatry; adding also, that the city and the whole spoil thereof shall be burnt; that no portion shall be saved, nor yet, that the city shall be builded for ever again, because it is accursed of God. Here is a plain declaration, what God requireth of them that will continue in league with him, and what he hath condemned by his express Word. And do we esteem, beloved brethren, that the immutable God will wink at our idolatry, as that he saw it not, seeing he commandeth judgments to be executed so severely against idolaters, and against such as only provoked or solicited others to idolatry; that neither should be blood nor affinity, neither multitude nor riches, save such as offend, neither yet, that we should conceal their offences; but that we should be the first that should accuse brother, son, daughter, or wife? And why? ‘Because he intendeth (saith Moses) to bring thee from the Lord thy God, who led thee forth from the land of Egypt; and therefore let him die, that all Israel hearing, may fear, and presume not after to commit the like abominations. Let nothing pertaining to such a man or city cleave unto thy hand, that the Lord may turn from the fury of his wrath, and be moved over thee with most tender mercy and affection; and that he may multiply thee, as he hath sworn unto thy fathers.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the faithful in England in R. S. Candlish (ed.), Select practical writings of John Knox</cite></span></figcaption>

f+turn+back+to+idolatry%3B+adding+also%2C+that+the+city+and+the+whole+spoil+thereof+shall+be+burnt%3B+that+no+portion+shall+be+saved%2C+nor+yet%2C+that+the+city+shall+be+builded+for+ever+again%2C+because+it+is+accursed+of+God.+Here+is+a+plain+declaration%2C+what+God+requireth+of+them+that+will+continue+in+league+with+him%2C+and+what+he+hath+condemned+by+his+express+Word.+And+do+we+esteem%2C+beloved+brethren%2C+that+the+immutable+God+will+wink+at+our+idolatry%2C+as+that+he+saw+it+not%2C+seeing+he+commandeth+judgments+to+be+executed+so+severely+against+idolaters%2C+and+against+such+as+only+provoked+or+solicited+others+to+idolatry%3B+that+neither+should+be+blood+nor+affinity%2C+neither+multitude+nor+riches%2C+save+such+as+offend%2C+neither+yet%2C+that+we+should+conceal+their+offences%3B+but+that+we+should+be+the+first+that+should+accuse+brother%2C+son%2C+daughter%2C+or+wife%3F+And+why%3F+%E2%80%98Because+he+intendeth+%28saith+Moses%29+to+bring+thee+from+the+Lord+thy+God%2C+who+led+thee+forth+from+the+land+of+Egypt%3B+and+therefore+let+him+die%2C+that+all+Israel+hearing%2C+may+fear%2C+and+presume+not+after+to+commit+the+like+abominations.+Let+nothing+pertaining+to+such+a+man+or+city+cleave+unto+thy+hand%2C+that+the+Lord+may+turn+from+the+fury+of+his+wrath%2C+and+be+moved+over+thee+with+most+tender+mercy+and+affection%3B+and+that+he+may+multiply+thee%2C+as+he+hath+sworn+unto+thy+fathers.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+John+Knox%2C+Letter+to+the+faithful+in+England+in+R.+S.+Candlish+%28ed.%29%2C+Select+practical+writings+of+John+Knox&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F363858582a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/363858582a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/09/12/john-knox-on-covenantal-theonomy-and-the-punishment-of-idolatry/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1e2b34c605" data-kw="">
<blockquote><p>Question 18: What if a woman have a husband that will not suffer her to read the Scriptures, nor go to God’s worship, public or private, or that so beats or abuses her, as that it cannot be expected that human nature should be in such a case kept fit for any holy action: or if a man have a wife that will scold at him when he is praying or instructing his family, and make it impossible to him to serve God with freedom, or peace and comfort? Answer: The woman must (at necessary seasons, though not when she would) both read the Scriptures and worship God, and suffer patiently what is inflicted on her: Martyrdom may be as comfortably suffered from a husband as from a prince. But yet if neither her own love and duty, and patience, nor friends’ persuasion, nor the magistrate’s justice can free her from such inhumane cruelty, as quite disables her for her duty to God and man, I see not but she may depart from such a tyrant. But the man has more means to restrain his wife from beating him, or doing such intollerable things: either by the magistrate, or by denying her what else she might have, or by his own violent restraining her, as belongs to a conjugal ruler, and as circumstances shall direct a prudent man. But yet in case that unsuitableness or sin be so great, that after long trial, there is no likelihood of any other cohabitation but what will tend to their spiritual hurt and calamity, it is their lesser sin to live asunder by mutual consent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt. 2, ‘Christian Economics’, ch. 9, ‘Cases About Divorce &amp; Separation’, p. 539</span></figcaption>

</figure><figure class="quote" id="q-0a899d1746" data-kw="">
<blockquote><p>First, That whatsoever resistance is here forbidden and threatened [in Romans 13], relates to inferior Magistrates as far as their authority reaches according to laws, as well as supreme Magistrates.

I may no more resist a Constable commanding me, or arresting me, or distraining my goods according to Law, then I may do the King commanding me, &amp;c.

Yet the Doctor [Henry Fearne] takes no notice of this at all. But as if it were, not only the higher power, in the singular number, but the Highest in the Superlative degree; He restrains all to the King, which is a dangerous fallacy, not only in the present Question, but against all government.

To which I add, to refuse to be subject to the Parliament according to Laws, and to resist is much more (by this Scripture) undeniably a resisting the ordinance of God, and brings damnation.

And what then will he say to those that have done so too, and against the Parliament, and those sent by their authority unquestionable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herbert-palmer.html">Herbert Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scripture and reason pleaded for defensive arms: or The whole controversy about subjects taking up arms Wherein besides other pamphlets, an answer is punctually directed to Dr. Ferne’s book, entitled, Resolving of conscience, &amp;c. The scriptures alleged are fully satisfied. The rational discourses ar</cite>, (London: John White, 1643), p. 9.</span></figcaption>

<blockquote><p>…let them persuade us that there are many beings by whose deity and providence all things are governed; let them show how the origins and beginnings of their sacred rites and gods were handed down to mortals; let them explain what is their source and principle; let them set forth what reward there is in their worship, and what punishment awaits neglect; why they wish to be worshipped by men; what the piety of men contributes to them, if they are blessed: and let them confirm all these things not by their own assertion (for the authority of a mortal man is of no weight), but by some divine testimonies, as we do. There is no occasion for violence and injury, for religion cannot be imposed by force; the matter must be carried on by words rather than by blows, that the will may be affected. Let them unsheath the weapon of their intellect; if their system is true, let it be asserted. We are prepared to hear, if they teach; while they are silent, we certainly pay no credit to them, as we do not yield to them even in their rage. Let them imitate us in setting forth the system of the whole matter: for we do not entice, as they say; but we teach, we prove, we show. And thus no one is detained by us against his will, for he is unserviceable to God who is destitute of faith and devotedness; and yet no one departs from us, since the truth itself detains him. Let them teach in this manner, if they have any confidence in the truth; let them speak, let them give utterance; let them venture, I say, to discuss with us something of this nature; and then assuredly their error and folly will be ridiculed by the old women, whom they despise, and by our boys. For, since they are especially clever, they know from books the race of the gods, and their exploits, and commands, and deaths, and tombs; they may also know that the rites themselves, in which they have been initiated, had their origin either in human actions, or in casualties, or in deaths. It is the part of incredible madness to imagine that they are gods, whom they cannot deny to have been mortal; or if they should be so shameless as to deny it, their own writings, and those of their own people, will refute them; in short, the very beginnings of the sacred rites will convict them. They may know, therefore, even from this very thing, how great a difference there is between truth and falsehood; for they themselves with all their eloquence are unable to persuade, whereas the unskilled and the uneducated are able, because the matter itself and the truth speaks. Why then do they rage, so that while they wish to lessen their folly, they increase it? Torture and piety are widely different; nor is it possible for truth to be united with violence, or justice with cruelty. But with good reason they do not venture to teach anything concerning divine things, lest they should both be derided by our people and be deserted by their own. For the common people for the most part, if they ascertain that these mysteries were instituted in memory of the dead, will condemn them, and seek for some truer object of worship. ‘Hence rites of mystic awe’ were instituted by crafty men, that the people may not know what they worship. But since we are acquainted with their systems, why do they either not believe us who are acquainted with both, or envy us because we have preferred truth to falsehood? But, they say, the public rites of religion must be defended. Oh with what an honorable inclination the wretched men go astray! For they are aware that there is nothing among men more excellent than religion, and that this ought to be defended with the whole of our power; but as they are deceived in the matter of religion itself, so also are they in the manner of its defense. For religion is to be defended, not by putting to death, but by dying; not by cruelty, but by patient endurance; not by guilt, but by good faith: for the former belong to evils, but the latter to goods; and it is necessary for that which is good to have place in religion, and not that which is evil. For if you wish to defend religion by bloodshed, and by tortures, and by guilt, it will no longer be defended, but will be polluted and profaned. For nothing is so much a matter of free-will as religion; in which, if the mind of the worshipper is disinclined to it, religion is at once taken away, and ceases to exist. The right method therefore is that you defend religion by patient endurance or by death; in which the preservation of the faith is both pleasing to God Himself and adds authority to religion. For if he who in this earthly warfare preserves his faith to his king in some illustrious action, if he shall continue to live, because more beloved and acceptable, and if he shall fall, obtains the highest glory, because he has undergone death for his leader; how much more is faith to be kept towards God, the Ruler of all, who is able to pay the reward of virtue, not only to the living, but also to the dead! Therefore the worship of God, since it belongs to heavenly warfare, requires the greatest devotedness and fidelity. For how will God either love the worshipper, if He Himself is not loved by him, or grant to the petitioner whatever he shall ask, when he draws near to offer his prayer without sincerity or reverence? But these men, when they come to offer sacrifice, present to their gods nothing from within, nothing of their own — no uprightness of mind, no reverence or fear. Therefore, when the worthless sacrifices are completed, they leave their religion altogether in the temple, and with the temple, as they had found it; and neither bring with them anything of it, nor take anything back. Hence it is that religious observances of this kind are neither able to make men good, nor to be firm and unchangeable. And thus men are easily led away from them, because nothing is learned in them relating to the life, nothing relating to wisdom, nothing to faith. For what is the religion of those gods? What is its power? What its discipline? What its origin? What its principle? What its foundation? What its substance? What is its tendency? Or what does it promise, so that it may be faithfully preserved and boldly defended by man? I see nothing else in it than a rite pertaining to the fingers only. But our religion is on this account firm and solid, and unchangeable, because it teaches justice, because it is always with us, because it has its existence altogether in the soul of the worshipper, because it has the mind itself for a sacrifice. In that religion nothing else is required but the blood of animals, and the smoke of incense, and the senseless pouring out of libations; but in this of ours, a good mind, a pure breast, an innocent life: those rites are frequented by unchaste adulteresses without any discrimination, by impudent procuresses, by filthy harlots; they are frequented by gladiators, robbers, thieves, and sorcerers, who pray for nothing else but that they may commit crimes with impunity. For what can the robber ask when he sacrifices, or the gladiator, but that they may slay? What the poisoner, but that he may escape notice? What the harlot, but that she may sin to the uttermost? What the adulteress, but either the death of her husband, or that her unchastity may be concealed? What the procuress, but that she may deprive many of their property? What the thief, but that he may commit more peculations? But in our religion there is no place even for a slight and ordinary offense; and if any one shall come to a sacrifice without a sound conscience, he hears what threats God denounces against him: that God, I say, who sees the secret places of the heart, who is always hostile to sins, who requires justice, who demands fidelity. What place is there here for an evil mind or for an evil prayer? But those unhappy men neither understand from their own crimes how evil it is to worship, since, defiled by all crimes, they come to offer prayer; and they imagine that they offer a pious sacrifice if they wash their skin; as though any streams could wash away, or any seas purify, the lusts which are shut up within their breast. How much better it is rather to cleanse the mind, which is defiled by evil desires, and to drive away all vices by the one laver of virtue and faith! For he who shall do this, although he bears a body which is defiled and sordid, is pure enough.</p></blockquote>

gion+itself%2C+so+also+are+they+in+the+manner+of+its+defense.+For+religion+is+to+be+defended%2C+not+by+putting+to+death%2C+but+by+dying%3B+not+by+cruelty%2C+but+by+patient+endurance%3B+not+by+guilt%2C+but+by+good+faith%3A+for+the+former+belong+to+evils%2C+but+the+latter+to+goods%3B+and+it+is+necessary+for+that+which+is+good+to+have+place+in+religion%2C+and+not+that+which+is+evil.+For+if+you+wish+to+defend+religion+by+bloodshed%2C+and+by+tortures%2C+and+by+guilt%2C+it+will+no+longer+be+defended%2C+but+will+be+polluted+and+profaned.+For+nothing+is+so+much+a+matter+of+free-will+as+religion%3B+in+which%2C+if+the+mind+of+the+worshipper+is+disinclined+to+it%2C+religion+is+at+once+taken+away%2C+and+ceases+to+exist.+The+right+method+therefore+is+that+you+defend+religion+by+patient+endurance+or+by+death%3B+in+which+the+preservation+of+the+faith+is+both+pleasing+to+God+Himself+and+adds+authority+to+religion.+For+if+he+who+in+this+earthly+warfare+preserves+his+faith+to+his+king+in+some+illustrious+action%2C+if+he+shall+continue+to+live%2C+because+more+beloved+and+acceptable%2C+and+if+he+shall+fall%2C+obtains+the+highest+glory%2C+because+he+has+undergone+death+for+his+leader%3B+how+much+more+is+faith+to+be+kept+towards+God%2C+the+Ruler+of+all%2C+who+is+able+to+pay+the+reward+of+virtue%2C+not+only+to+the+living%2C+but+also+to+the+dead%21+Therefore+the+worship+of+God%2C+since+it+belongs+to+heavenly+warfare%2C+requires+the+greatest+devotedness+and+fidelity.+For+how+will+God+either+love+the+worshipper%2C+if+He+Himself+is+not+loved+by+him%2C+or+grant+to+the+petitioner+whatever+he+shall+ask%2C+when+he+draws+near+to+offer+his+prayer+without+sincerity+or+reverence%3F+But+these+men%2C+when+they+come+to+offer+sacrifice%2C+present+to+their+gods+nothing+from+within%2C+nothing+of+their+own+%E2%80%94+no+uprightness+of+mind%2C+no+reverence+or+fear.+Therefore%2C+when+the+worthless+sacrifices+are+completed%2C+they+leave+their+religion+altogether+in+the+temple%2C+and+with+the+temple%2C+as+they+had+found+it%3B+and+neither+bring+with+them+anything+of+it%2C+nor+take+anything+back.+Hence+it+is+that+religious+observances+of+this+kind+are+neither+able+to+make+men+good%2C+nor+to+be+firm+and+unchangeable.+And+thus+men+are+easily+led+away+from+them%2C+because+nothing+is+learned+in+them+relating+to+the+life%2C+nothing+relating+to+wisdom%2C+nothing+to+faith.+For+what+is+the+religion+of+those+gods%3F+What+is+its+power%3F+What+its+discipline%3F+What+its+origin%3F+What+its+principle%3F+What+its+foundation%3F+What+its+substance%3F+What+is+its+tendency%3F+Or+what+does+it+promise%2C+so+that+it+may+be+faithfully+preserved+and+boldly+defended+by+man%3F+I+see+nothing+else+in+it+than+a+rite+pertaining+to+the+fingers+only.+But+our+religion+is+on+this+account+firm+and+solid%2C+and+unchangeable%2C+because+it+teaches+justice%2C+because+it+is+always+with+us%2C+because+it+has+its+existence+altogether+in+the+soul+of+the+worshipper%2C+because+it+has+the+mind+itself+for+a+sacrifice.+In+that+religion+nothing+else+is+required+but+the+blood+of+animals%2C+and+the+smoke+of+incense%2C+and+the+senseless+pouring+out+of+libations%3B+but+in+this+of+ours%2C+a+good+mind%2C+a+pure+breast%2C+an+innocent+life%3A+those+rites+are+frequented+by+unchaste+adulteresses+without+any+discrimination%2C+by+impudent+procuresses%2C+by+filthy+harlots%3B+they+are+frequented+by+gladiators%2C+robbers%2C+thieves%2C+and+sorcerers%2C+who+pray+for+nothing+else+but+that+they+may+commit+crimes+with+impunity.+For+what+can+the+robber+ask+when+he+sacrifices%2C+or+the+gladiator%2C+but+that+they+may+slay%3F+What+the+poisoner%2C+but+that+he+may+escape+notice%3F+What+the+harlot%2C+but+that+she+may+sin+to+the+uttermost%3F+What+the+adulteress%2C+but+either+the+death+of+her+husband%2C+or+that+her+unchastity+may+be+concealed%3F+What+the+procuress%2C+but+that+she+may+deprive+many+of+their+property%3F+What+the+thief%2C+but+that+he+may+commit+more+peculations%3F+But+in+our+religion+there+is+no+place+even+for+a+slight+and+ordinary+offense%3B+and+if+any+one+shall+come+to+a+sacrifice+without+a+sound+conscience%2C+he+hears+what+threats+God+denounces+against+him%3A+that+God%2C+I+say%2C+who+sees+the+secret+places+of+the+heart%2C+who+is+always+hostile+to+sins%2C+who+requires+justice%2C+who+demands+fidelity.+What+place+is+there+here+for+an+evil+mind+or+for+an+evil+prayer%3F+But+those+unhappy+men+neither+understand+from+their+own+crimes+how+evil+it+is+to+worship%2C+since%2C+defiled+by+all+crimes%2C+they+come+to+offer+prayer%3B+and+they+imagine+that+they+offer+a+pious+sacrifice+if+they+wash+their+skin%3B+as+though+any+streams+could+wash+away%2C+or+any+seas+purify%2C+the+lusts+which+are+shut+up+within+their+breast.+How+much+better+it+is+rather+to+cleanse+the+mind%2C+which+is+defiled+by+evil+desires%2C+and+to+drive+away+all+vices+by+the+one+laver+of+virtue+and+faith%21+For+he+who+shall+do+this%2C+although+he+bears+a+body+which+is+defiled+and+sordid%2C+is+pure+enough.%E2%80%9D%0A%0A%E2%80%94+Lactantius%2C+The+Divine+Institutes%2C+bk.+5%2C+ch.+20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbc4bcb1741.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bc4bcb1741.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-civil-magistrates-authority-around-spiritual-things-circa-sacra/#:~:text=let%20them%20persuade%20us%20that%20there,defiled%20and%20sordid%2C%20is%20pure%20enough&amp;text=let%20them%20persuade%20us%20that%20there%20are%20many&amp;text=which%20is%20defiled%20and%20sordid%2C%20is%20pure%20enough" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-0983660f7b" data-kw="">
<blockquote><p>Luther… does not even consider the possibility that Mary might have had other children than Jesus. This is consistent with his lifelong acceptance of the idea of the perpetual virginity of Mary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jaroslav-pelikan.html">Jaroslav Pelikan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>LW 22:214-215 Pelikan was a modern editor of Luther’s works and was a Lutheran at the time.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b95374da72" data-kw="">
<blockquote><p>Last of all, which you make the greatest matter, the perpetual virginity of the mother of Christ after his birth, although for my part I do believe it, and wish all men so to do, yet dare I affirm that it is not damnable not to believe it except it can be proved that the Scripture has taught it. But you object against me first the condemnation of Helvidius testified by Sozomenus. Whereto I answer that he was justly condemned, not because he believed not, but because he did obstinately deny it, and troubled the peace of the church about an unnecessary question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fulke.html">William Fulke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defense of the Sincere &amp; True Translations of the Holy Scriptures into the English Tongue... (London, 1583), A Brief Confutation of Sundry Cavils…</cite>, p. 53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-0b346e138f" data-kw="">
<blockquote><p>Objection 1. Yet our [Romanist] adversaries quarrel against this most rich and plentiful treasure of the holy Scriptures, alleging that we receive many things by tradition which are not in Scriptures, and yet we believe them; as Mary’s perpetual virginity and the baptism of infants? We make not Mary’s perpetual virginity any matter of religion, but a likely opinion so far as it can be maintained; that it were an unseemly and unfitting thing for a sinful man to use to the act of generation the vessel which was chosen and consecrated by the holy Ghost to so high an use as was the bringing forth of the Savior of the world; it has warrant from the apostle’s charge, Phil. 4:8, of doing whatsoever is honest, whatsoever is of good report, whatsoever is praise-worthy, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity... (1645), ‘A Large Explication of the Body of Christian Religion’</cite>, p. 20</span></figcaption>

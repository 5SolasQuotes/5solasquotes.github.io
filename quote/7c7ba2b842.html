<blockquote><p>The revealed will of sign, as such, teaches, illuminates, directs and obligates men to the regulation of acts, whether those regulated acts actually exist and happen, or not.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fcd6562ca2" data-kw="">
<blockquote><p>But against this it may be objected what St. Peter [and Timothy] says: that He would have all men to be saved and to come to the knowledge of his will. (2 Pet. 3 [v. 9]; 1 Tim. 2:4) And therefore either there are diverse and contrary wills in God, or it is his will that all should be saved, but yet are not, because they will not believe. I answer: That the will of God is diversely distinguished by the doctors, as [John] Damascene (The will of God is not diverse, Damascene, bk. 2, ch. 46), into an: 1. Antecedent will 2. Consequent will Lombard and the Schoolmen (bk. 1, ch. 45) into his: 1. Signified will 2. Well-pleasing will Tertullian (Lib. Exhort. ad castitatem.), into his: 1. Efficient will 2. Permissive will Whereof he calls the first voluntas pura and the other voluntas indulgentiae. St. Augustine (Enchiridion, ch. 102 &amp; 103), into his: 1. Effectual working and omnipotent will 2. Not working, or not efficient will Others into his: Absolute will Conditional will Others into his Secret will Revealed will All which, and all such like distinctions of God’s will, if they be diligently observed and well understood, do fall into the same end and do no ways prove either diverse wills to be in God or any contradiction to be in the will of God. For it is most certain that as the essence of God is most simple, without composition or division, so the will of God, which is nothing else but his eternal decree concerning all things, is one and the selfsame immutable and unresistible: in so much that the wicked, who as much as in them lies, do resist the will of God revealed and commanded unto us in his Word, yet notwithstanding, will they, nill they, they fulfill the will of God decreed in Himself from all eternity; as you may see most plainly in the example of Pilate, Herod and the wicked Jews, who in crucifying Christ, rebelled and resisted the will of God revealed in his word, yet herein they did perform the secret will of God, which before all worlds He had determined should be done, as St. Peter shows (Acts 2:23; Augustine in Enchiridion, ch. 98), Et sic in hoc ipso quod contra voluntatem Dei fecerunt, de ipsis facta est voluntas eius: And so in this very thing wherein they did against God’s will, God effected his own will. (Idem, de cor. et gratia) Et de his qui faciunt quod non vult, facit ipse, quae vult: And touching these men which do against his will, He does whatsoever He will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gryffith.html">William Gryffith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Delights of the Saints</cite>, … (London: Butter, 1622), pt. 1, pp. 11-13 Gryffith (c.1589–1672) was an Anglican bishop, opposed to the puritans.</span></figcaption>

</figure><figure class="quote" id="q-b5b07bba5c" data-kw="">
<blockquote><p>God’s Will Complancential, Providential and Beneplaciti. 3. Aquinas and others distinguished God’s Will unto Complacential , Providential, and Beneplaciti. (1) God’s Complacential Will, is his simple complacence in all good actions, habits, and events of men; yea it extends not only to moral, but to natural goods, as Gen. 1:31. There is a perpetual necessary volition in God which takes pleasure in all good, whether created or increated. Such is the infinite bonitie and purity of the divine nature as that it cannot but take infinite complacence in all good. This they call God’s Love of simple complacence, of which see Ruiz, De Volunt. Dei, Disp. 6, §2, p. 38 and Disp. 19, p. 214.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Court of the Gentiles. Part IV, Of Reformed Philosophy. Book III, Of Divine Predetermination, wherein the Nature of Divine Predetermination is fully explicated &amp; demonstrated, both in the general, as also more particularly, as to the substrate mater or entitative act of sin</cite>, (Maxwell &amp; Roberts, 1677), pt. 1, bk. 2, p. 357</span></figcaption>

<blockquote><p>5. Voluntatas absoluta and voluntas conditionata. The distinction between decretive and perceptive will, voluntas beneplaciti and voluntas signi, relates also to a distinction between absolute will and conditioned will (voluntas absoluta et voluntas conditionata). According to the former, God wills and determines that something should occur ‘without any condition’ in the object of God’s willing—but the latter, the conditional will, rests upon the fulfillment of a condition in or by the object of the divine will, for example, the will of God to save men upon condition of faith. Maccovius notes, against the Arminians, that the distinction is ‘utterly vain.’ Wendelin indicates that this distinction causes some difficulty, but makes perfectly good sense if it is understood solely in terms of the voluntas signi [will of sign, or revealed will]—granting that most of the divine precepts, promises, and condemnations are stated conditionally. The distinction is, however, extended improperly to the eternal decree, inasmuch as the decree cannot be ‘suspended on conditions’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd</cite>, 5. ‘Voluntas absoluta and voluntas conditionata’ in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd ed. (Baker Books, 2003), vol. 3, ch. 5.4, E. The Ad Intra–Ad Extra Distinctions, pp. 463-65, p. 463</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

rget="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/47e01e8576.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-conditional-aspects-of-gods-revealed-will/#:~:text=5.%20Voluntatas%20absoluta%20and%20voluntas%20conditionata,decree%20cannot%20be%20%E2%80%98suspended%20on%20conditions&amp;text=5.%20Voluntatas%20absoluta%20and%20voluntas%20conditionata.%20The%20distinction&amp;text=as%20the%20decree%20cannot%20be%20%E2%80%98suspended%20on%20conditions" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cdf2b964bf" data-kw="decretive preceptive">
<blockquote><p>Although the will in God is only one and most simple, yet because it is occupied differently about various objects, it may be apprehended as manifold. The first and principal distinction is that of the decretive and preceptive will. The former means that which God wills to do or permit himself; the latter what he wills that we should do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.15.1–2</span></figcaption>

<main class="wrap"><figure class="quote" id="q-abd2c30dd3" data-kw="">
<blockquote><p>To shorten something of this labour, if the books which you read are your own, mark with a pen, or pencil, the most considerable things in them which you desire to remember. Thus you may read that book the second time over with half the trouble, by your eye running over the paragraphs which your pencil has noted.

It is but a very weak objection against this practice to say, I shall spoil my book; for I persuade myself, that you did not buy it as a bookseller, to sell it again for gain, but as a scholar to improve your mind by it; and if the mind be improved, your advantage is abundant, though your book yield less money to your executors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-watts.html">Isaac Watts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Logic; or, The Right Use of Reason, in the Inquiry After Truth. With a Variety of Rules to Guard Against Error, in the Affairs of Religion and Human Life, as well as in the Sciences</cite>, (1722; Halifax: Milner and Sowerby, 1866), p. 74.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-74af20edbe" data-kw="">
<blockquote><p>From this cause [native depravity] it proceeds, that many children, who have the opportunity of a good religious education, learn scarcely any thing of the most important truths of Christianity. If they are compelled to commit the Catechism to memory, they are wont to do this without ever thinking of the doctrines contained in the words which they recite; so that, when the attention is at any time awakened to the subject of religion, as a personal concern, they feel themselves to be completely ignorant of the system of divine truth taught in the Bible. Yet even to these, the truths committed to memory are now of great utility. They are like a treasure which has been hidden, but is now discovered. Of two persons under conviction of sin, one of whom has had sound religious instruction, and the other none, the former will have an unspeakable advantage over the latter in many respects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-a-alexander.html">Archibald A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience</cite>, (Philadelphia: Presbyterian Board of Publication, 1841), ch. 1, p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

</figure><figure class="quote" id="q-d779bccb41" data-kw="">
<blockquote><p>And indeed it [the Exodus] was the greatest typ of Christ’s redemption of any providential event whatsoever. This was by Jesus Christ, for it was wrought by Him who appeared to Moses to redeem that people. But that was Christ, as is evident, because He is called ‘the angel of the Lord,’ Ed. 3:2-3. The bush represented the human nature of Christ, who is called the ‘branch.’ This bush grew on mount Sinai or Horeb, a word that signifies a dry place, as the human nature of Christ was a root out of dry ground. The bush burning with fire, represented the sufferings of Christ, in the fire of God’s wrath. It burned, and was not consumed; so Christ, though He suffered extremely, yet perished not; but overcame at last, and rose from his sufferings. Because this great mystery of the incarnation and sufferings of Christ was here represented, therefore Moses says, ‘I will turn aside, and behold this great sight.’ A great sight he might well call it, when there was represented, ‘God manifest in the flesh,’ suffering a dreadful death, and rising from the dead.</p></blockquote>

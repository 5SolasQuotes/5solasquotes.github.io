<main class="wrap"><figure class="quote" id="q-3d9f8b8c3a" data-kw="">
<blockquote><p>O Arian, the right inheritor to Lucifer, that would exalt his seat, and be like to the highest; whose fall shall be like, where the sin is equal. If God did highly allow the minister of Ephesus, for that he could in no wise abide such as said they were apostles, and were not in deed, how may any lay uncharitableness unto me, which for the love of my sweet Christ do abhor all fantastical Arians, in such sort as all men ought to do that love the Son of God unfeignedly? …

Was there ever heretic so bold and impudent as the Arian is, that durst take from the Son of God the glory which he had with the Father from the beginning? If Christ be the beginning and ending of all things (as he testifieth himself to St John), how may he be but a creature, like unto others? Who may dissemble such blasphemy that hath any spark of the Spirit of God? Who may hear with patience the right ways of the Lord perverted by these devilish holy Arians, and hold his peace?

A lively faith is not dumb, but is always ready to resist the gainsayers, as David saith, “I have believed, and therefore I have spoken.” Speak then, you that have tongues to praise and confess against these Arians; exalt your voice like a trumpet, that the simple people may beware of their Pharisaical venom, and be not deceived, as now many are unawares of simplicity. Suffer them not to pass by you unpointed at: yea, if they be so stout that they will not cease to speak against God our Saviour and Christ, (as they are all new baptized enemies thereto,) refrain not to spit at such inordinate swine as are not ashamed to tread under their feet the precious godhead of our Saviour Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-philpot.html">John Philpot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apology for Spitting upon an Arian</cite>, (n.d.) in Robert Eden (ed.), The Examinations and Writings of John Philpot, B.C.L., Archdeacon of Winchester: Martyr, 1555 (Cambridge: The University Press, 1842), pp 300-01.</span></figcaption>

<blockquote><p>1. The name and profession of a Christian and a Protestant, with going to church, and a heartless lip-service or saying their prayers, is the cloak of all ungodly Protestants.

2. Others, discerning the thinness of this cloak, do think to make themselves a better: and they take up the strictest opinions in religion, and own those which they account the strictest party, and own that which they esteem the purest and most spiritual worship: the cloak of these men is their opinions, party, and way of worship, while their carnal lives detect their hypocrisy.</p></blockquote>

<blockquote><p>11. This [church] covenant (thus distinguished from the Covenant of Grace) they hold to be that covenant which is sealed by the sacraments, and for the sealing and ratifying of which the sacraments were principally ordained of God, and therefore to be administered only to such as are first entered into this covenant, as seals thereof. Apology, p. 15, 19, 31; Answer to 9; pos. pp. 63 &amp; 66. And therefore, that such persons as (by their condition) cannot join in church covenant, nor live in church fellowship with a set society, are not bound to partake in sacraments. Apology, pp. 39 &amp; 41. See [John] Robinson, Justification, pp. 80 &amp; 110, though I do not find the Brownists so solicitously to distinguish between the church covenant and the Covenant of Grace as these our [Independent and congregationalist] brethren do.</p></blockquote>

<blockquote><p>IV. As to the people’s case, it needs no other answer:

      1. No member may remove without cause:

      2. Nor abruptly and uncharitably to the church’s dissatisfaction, when he may avoid it. But 3. He may remove upon many just causes (private or public) whether the church and pastors consent or not, so the manner be as becomes a Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, (1673), pt. 3, Christian Ecclesiastics, Question 104, ‘Is a pastor obliged to his flock for life? Or is it lawful so to oblige himself? And may he remove without their consent? And so also of a church-member, the same questions are put.’ Baxter was a congregationalist.</span></figcaption>

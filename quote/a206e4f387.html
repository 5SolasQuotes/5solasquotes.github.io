</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9490e704dd" data-kw="">
<blockquote><p>It’s [the light of nature is] altogether insufficient to prescribe or set down any worship of God. Hence God does so often forbid us to walk after our own imaginations and to do that which we shall choose. The apostle calls it will-worship, when a man’s will is the mere cause of it. Now, it’s true, men are more apt to admire this, as we see in the Pharisees and Papists; they dote upon their traditions more then God’s institutions… It’s true indeed, even in worship, light of Nature and prudence is instrumentally required to order the institutions of God; but as reason may not make a new article of faith, so neither a new part of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis</cite>, … (London, 1647), Lecture 7, pp. 74</span></figcaption>

<blockquote><p>every word that appertains to God may be required and discussed, and all knowledge of things out of them may be understood. But if anything do remain which the holy Scripture ought to be received to authorize any knowledge; but that which remains we must commit to the fire, that is, we must reserve it to God. For in this present world God would not have us to know all things.</p></blockquote>

</figure><figure class="quote" id="q-0921f67297" data-kw="">
<blockquote><p>There is one God, whom we do not otherwise acknowledge, brethren, but out of the holy Scriptures. For as he that would profess the wisdom of this world cannot otherwise attain hereunto, unless he read the doctrine of the philosophers; so whosoever of us will exercise piety toward God, cannot learn this elsewhere but out of the holy Scriptures. Whatsoever therefore the Holy Scriptures preach, let us know; and whatsoever they teach, let us understand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hippolytus-of-rome.html">Hippolytus of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>tome 3, Bibliotheca. Pat</cite>, pp. 20-21</span></figcaption>

<main class="wrap"><figure class="quote" id="q-0985b8d1c9" data-kw="">
<blockquote><p>As God raised Christ from the dead and set him at his own right hand in heavenly places; so you, that were dead in sins, hath he quickened and raised you up together in him. This analogy is the very thing he would have them understand. They had undergone a great change; they had been brought to life; they had been raised from the dead by the same almighty power which wrought in Christ. There was as great a difference between their present and their former condition, as between Christ in the tomb and Christ at the right hand of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Epistle to the Ephesians</cite>, on 1:19–20</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6e0adc620a" data-kw="Love Wisdom Election">
<blockquote><p>That the great God purposed and designed an union with himself of those whom in a special manner he had set himself to love; and that this union is the deepest and furthest design of his heart, of any he hath toward them, or the whole creation. The full demonstration of his manifold wisdom and power moved him to make a variety of persons, things, yea, of worlds; but then his goodness and his love moved him to reduce out of that variety an all out of every sort, as a pledge of his respect to all, unto an unity again, and that with himself; and this union is the top perfection of all his works, as that, John 17:23, ‘I in them, and they in me, that they may be made perfect in one.’ It is the perfection of the creature, whereof the unity of the three Persons is the pattern, and the perfection of God’s design.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Chapter of Ephesians</cite>, Works, vol. 1, Sermon X (Eph. 1:10)</span></figcaption>

</figure><figure class="quote" id="q-acc274196c" data-kw="Sanctification Holy Spirit">
<blockquote><p>True sanctification is the result of the soul&#x27;s union with the holy Jesus, the first and immediate receptacle of the sanctifying Spirit; out of whose fullness, his members do, by virtue of their union with him, receive sanctifying influences. The other is the mere product of the man&#x27;s own spirit, which, whatever it has, or seems to have, of the matter of true holiness—yet does not arise from the supernatural principles, nor to the high aims and ends thereof: for, as it comes from self, so it runs out into the dead sea of self again; and lies as wide of true holiness, as nature does of grace. They who have this species of holiness, are like common boatmen, who serve themselves with their own oars: whereas the ship bound for Immanuel&#x27;s land, sails by the blowings of the divine Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” V. Benefits: Sanctification</span></figcaption>

</figure><figure class="quote" id="q-76fc53ecbc" data-kw="Regeneration Sanctification">
<blockquote><p>Union with Christ is the foundation of all spiritual blessings, so that if there had been no connection with Him, there could be no regeneration, no justification, no sanctification, no glorification. It is so in the natural world—adumbrating the spiritual: sever one of the members from my physical body, and it is dead; only by its union with my person does it partake of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Union and Communion</cite>, Introduction</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b7e4f428d6" data-kw="">
<blockquote><p>How may we attribute this same work to God, to Satan, and to man as author, without either excusing Satan as associated with God, or making God the author of evil? Easily, if we consider first the end, and then the manner, of acting. The Lord&#x27;s purpose is to exercise the patience of His servant by calamity; Satan endeavors to drive him to desperation; the Chaldeans strive to acquire gain from another&#x27;s property contrary to law and right. So great is the diversity of purpose that already strongly marks the deed. There is no less difference in the manner. The Lord permits Satan to afflict His servant; He hands the Chaldeans over to be impelled by Satan, having chosen them as His ministers for this task. Satan with his poison darts arouses the wicked minds of the Chaldeans to execute that evil deed. They dash madly into injustice, and they render all their members guilty and befoul them by the crime.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.4.2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f4f7b0edf2" data-kw="Author of sin Depravity">
<blockquote><p>The power of action is from God, but the viciousness of that action from our own nature. As when a clock or watch hath some fault in any of the wheels, the man that winds it up, or putting his hand upon the wheels moves them, he is the cause of the motion, but it is the flaw in it, or deficiency of something, is the cause of its erroneous motion. … Our motion is from God,—Acts 17:28, &#x27;In him we move&#x27;,—but not the disorder of that motion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a> › <a href="../topics/providence/concurrence/concurrence-and-sin.html">Concurrence and sin</a></span><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/god-not-the-author-of-sin.html">God not the author of sin</a></span></div>

— Stephen Charnock, A Treatise on Divine Providence">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+power+of+action+is+from+God%2C+but+the+viciousness+of+that+action+from+our+own+nature.+As+when+a+clock+or+watch+hath+some+fault+in+any+of+the+wheels%2C+the+man+that+winds+it+up%2C+or+putting+his+hand+upon+the+wheels+moves+them%2C+he+is+the+cause+of+the+motion%2C+but+it+is+the+flaw+in+it%2C+or+deficiency+of+something%2C+is+the+cause+of+its+erroneous+motion.+%E2%80%A6+Our+motion+is+from+God%2C%E2%80%94Acts+17%3A28%2C+%27In+him+we+move%27%2C%E2%80%94but+not+the+disorder+of+that+motion.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+A+Treatise+on+Divine+Providence&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff4f7b0edf2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f4f7b0edf2.html">Permalink</a><a class="src" href="https://archive.org/details/bim_early-english-books-1641-1700_a-treatise-of-divine-pro_charnock-stephen_1680" rel="noopener" target="_blank">Read it online · Internet Archive (1680 ed.)</a></div>
</figure><figure class="quote" id="q-bc72ee2b84" data-kw="Permission Author of sin">
<blockquote><p>Not by permitting the evil action, because he is bound by no law to hinder sin. Not by determining it; for as he who puts out a fire so that it may not spread further is not the cause of the fire, so he who fixes bounds to sin is not the cause of sin. Not by directing it to a good end; for as it is the highest art to prepare a wholesome medicine from venomous animals, so it is glorious for God to draw light even out of darkness, and something good out of evils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 6 (providence), canon 11</span></figcaption>

</figure><figure class="quote" id="q-fcfddb7a0b" data-kw="Author of sin Permission">
<blockquote><p>God doth not infuse the lust, or excite it, though he doth present the object about which the lust is exercised. God delivered up Christ to the Jews, he presented him to them, but never commanded them to crucify him, nor infused that malice into them, nor quickened it; but he, seeing such a frame, withdrew his restraining grace, and left them to the conduct of their own vitiated wills. … God created the grape, and filled the vine with a sprightliness, but he doth never infuse a drunken frame into a man, or excite it. … In short, though it be by God&#x27;s permission that we can do evil, yet it is not by his inspiration that we will to do evil; that is wholly from ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite></span></figcaption>

</figure><figure class="quote" id="q-b4af681b72" data-kw="Author of sin">
<blockquote><p>The influences of divine providence concur with every action, be it what it may, as an action, since all live, and move, and have their being in God; every action, as an action, is from God; but the obliquity, irregularity, and sinfulness of the action, is from the creature: wherefore God is not the author of any sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, bk. 3, ch. 8 (Of the Sin and Fall of Our First Parents)</span></figcaption>

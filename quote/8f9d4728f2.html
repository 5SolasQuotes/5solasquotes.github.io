<blockquote><p>According to the instructor [the Heidelberg Catechism], it is this chastisement and wrath of God that this mediator and deliverer must bear in His humanity and on our behalf; that is, in His human soul and body. As we have seen, it is in the human nature that payment for sin must be made, for it is the human nature that has sinned. However, how would the mediator be capable of bearing God’s wrath on our behalf if He were merely a man? He would then be no more than a finite creature and would possess nothing more than finite strength and capabilities. God’s wrath, however, is a burden of infinite proportion, of which we must exclaim with Moses, “Who knoweth the power of thine anger?” (Ps. 90:11). Regarding this, the instructor taught us in Question 14 that no one “who is a mere creature, [is] able to satisfy for us…[because] no mere creature can sustain the burden of God’s eternal wrath against sin, so as to deliver others from it.

According to the instructor, it is therefore now evident that a mediator who is capable of bearing in His humanity and on our behalf the eternal and infinite wrath of God to which we have provoked Him by our sins must necessarily do so by virtue of His divinity. This means that such a mediator must possess divine power and infinite capacity proportionate to the infinite burden of God’s wrath that He is to bear on our behalf. If, however, He is to possess such divine power and infinite capacity, He must necessarily also be the true, infinite, and omnipotent God Himself, for God will not communicate His honor and attributes to another. These He retains exclusively for Himself, so that He will be able to say, “I am God, and there is none else” (Isa. 45:22), and thus it clearly follows that our mediator and deliverer must also be very God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 77.</span></figcaption>

<blockquote><p>Reply to Objection 4: Although the drop of blood that bled in the circumcision would be sufficient for every satisfaction, considering the condition of the divine person, nevertheless it would not be sufficient relative to the kind of penalty. For the human race was obligated to death, for which it was necessary that a death be paid. … Reply to Objection 6: The other penalties that Christ endured, although they were sufficient to make satisfaction on behalf of human nature, considering the condition of the one suffering, nonetheless this is not the case when considering the kind of penalty. For all other penalties were not contained in those penalties, as they were in the suffering of death.</p></blockquote>

<blockquote><p>3. The kingdom of the Son of God is twofold: universal and singular.

4. The universal kingdom of the Son of God is the kingdom that, by nature, God Himself truly possesses in common with the Father and the Holy Spirit throughout the universe, from eternity to eternity, and this by nature or by natural right, as the Only Begotten Son of God the Father. Hence, it is also called the divine kingdom by Athanasius in his work De Incarnatione Verbi Contra Arianos (On the Incarnation of the Word Against the Arians), Volume 1, Page 476. This same natural kingdom of His is accustomed to be called.

5. He has never relinquished nor will He ever relinquish this kingdom.

6. The singular kingdom of the Son of God is His special possession within the Church, which is His mystical body. It is often called the kingdom of gift and acquisition.

7. It encompasses both grace and glory.

8. The kingdom of grace is the governance of the Church in this life, in which Christ exhibits His grace to His elect for the attainment of their eternal salvation. This kingdom is called “human” by Athanasius in the aforementioned passage because it is administered by the Son of God in His capacity as the Word made flesh, voluntarily and graciously undertaking the role of Mediator. Hence, it is also appropriately called the “Economical” or “Mediatorial” kingdom, as it pertains specifically to us humans.

9. Christ will deliver this kingdom to God the Father, as stated in 1 Corinthians 15:24. As Athanasius noted in the previously mentioned passage, the Lord of heaven assumed the likeness of our humanity and took upon Himself the human throne of David, who is His Father according to the flesh, in order to rebuild and restore it. Through this restoration, we all reign in Him, and He will deliver the restored human kingdom to His Father. …

13. That God may be all in all [1 Cor. 15:28], that is, that God the Father may reign through the Son, through His own Word, after He has reigned here through Him as the Savior, as the same Athanasius piously declares.

14. The kingdom of glory is the governance of the Son of God, which will accompany the universal resurrection of all the dead. When the restoration and glorification of God’s elect are completed, they will contemplate the glory of God the Father in the Only Begotten Son through the Holy Spirit for eternity, and they will be blessed without end in the present vision of God and will reign gloriously with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians</cite>, tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601) | section XIV, Consequences</span></figcaption>

IV. This catholick church hath been sometimes more, sometimes less visible.[h] And particular churches, which are members thereof, are more or less pure, according as the doctrine of the gospel is taught and embraced, ordinances administered, and publick worship performed more or less purely in them.[i] [h] Rom. 11:3,4. Rev. 12:6,14. [i] Rev. 2-3. 1 Cor. 5:6,7.</p></blockquote>

<blockquote><p>Some that live in countries where none in twenty miles openly use the New one, come to Richard Baxter for counsel; he desires them to bring one of the contrary judgment and judge when they hear both: He tells them that:

1. They should keep up the New Translation as far as they can in God’s public worship, while the hurt will not be greater than the benefit.

2. That when they have no public church or worship to join with, but what uses the Old one, they should rather join with such than none, as also when they cannot have the New one without more hurt than benefit.

3. And that while they can have the New one, they should not renounce communion with the churches that use the Old one, as separating from it as unlawful, but only disown the faults of the Old one, while they disown not the communion of the churches in the use of it. The other says:

1. That it is a cursed thing to offer God a worse [worship] while we have better.

2. That we are sworn [by the SL&amp;C] against it.¹ ¹ [The SL&amp;C does not mention the KJV, but the argument is that the KJV is held (by them) to be part of the reformation, or the reforming process, that the SL&amp;C binds to.]

3. That it is false worship and obeying man before God.

4. That we [the ones who only use the New translation] do but keep our possession, which they would put us out of, and it’s they that separate from us, and not we from them.

5. That we keep to God’s Word, which is the only rule. And therefore communion with the Old Translation is unlawful, and we should rather suffer death. Baxter answers:

I. (1) That it is a cursed thing to give God no public worship because we cannot have the New Translation, and to live like atheists if we cannot have what we would. None is worse than the Old. Family worship without church worship is worse than an Old Translation. (2) And that it is not we that offer God the worse before the better; it is they that exclude the better, which we protest against, having not our choice.

II. That he that sware [1.] to give over all church worship unless he have the New Translation, swore wickedly like an atheist; and he that swore [2.] to communicate with no church that used the Old Translation, swore wickedly like a schismatic; and he that swore [3.] that God’s providence should never return him to a necessity of using the Old,¹ swore blasphemously, as if he could have governed the world against God. ¹ [Note that such conditions are not in the SL&amp;C. See also ‘All Vows are Qualified’ and ‘Vows can Never Bind Beyond God’s Law’.]

III. That all worship is so far false as it is faulty; That to forsake all public worship when we cannot have the better translation is to be righteous, unrighteously, over much [Eccl. 7:16], and too little [righteous], and to disobey both God and man.

IV. Keep your possession as long as you can without more hurt than good. I am not one that ever strove to take it from you. But do your brethren in prison enjoy public worship? You’ll say, ‘They do better. It’s easier bearing their imprisonment, poverty and death than your own.’ But what shall ten parts of the kingdom do that must have the Old Translation or none? You’ll say, ‘I suppose, they may give over all church worship as impossible and take up with family worship.’ But stay:

      1. Must you not first prove the Old so bad as that no-church worship is better? Have you proved this?

      2. Will not your reason prove that we must also separate from you? Have not weak ministers as bad faults as a weak translation?

      3. What’s become then of your saying, ‘We had possession’? Have they possession of better that have none at all? Or will you be without all, because you had once possession of better? And will it excuse your ungodliness that you can lay the blame on them that dispossessed you? Or if they be schismatics for so using you, does it follow that you are none, if you persuade all to separate from all God’s Church worship rather than join where the Old Translation is used?

V. God’s Word is the rule, but only a general rule for words, modes and circumstances. To love God and our neighbour and the unity of the Church are his greatest commands. Go learn what these mean. To violate these and forsake all Church worship, if you cannot have the best translation, is not to keep to the rule, but most grossly to violate it in the greatest commands against many Scripture admonitions which vehemently urge you to love and unity.</p></blockquote>

— Richard Baxter, Reformation &amp; Conformity, Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ | Seeking Reformation, Occasional Conformity &amp; Covenanting">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSome+that+live+in+countries+where+none+in+twenty+miles+openly+use+the+New+one%2C+come+to+Richard+Baxter+for+counsel%3B+he+desires+them+to+bring+one+of+the+contrary+judgment+and+judge+when+they+hear+both%3A+He+tells+them+that%3A+1.+They+should+keep+up+the+New+Translation+as+far+as+they+can+in+God%E2%80%99s+public+worship%2C+while+the+hurt+will+not+be+greater+than+the+benefit.+2.+That+when+they+have+no+public+church+or+worship+to+join+with%2C+but+what+uses+the+Old+one%2C+they+should+rather+join+with+such+than+none%2C+as+also+when+they+cannot+have+the+New+one+without+more+hurt+than+benefit.+3.+And+that+while+they+can+have+the+New+one%2C+they+should+not+renounce+communion+with+the+churches+that+use+the+Old+one%2C+as+separating+from+it+as+unlawful%2C+but+only+disown+the+faults+of+the+Old+one%2C+while+they+disown+not+the+communion+of+the+churches+in+the+use+of+it.+The+other+says%3A+1.+That+it+is+a+cursed+thing+to+offer+God+a+worse+%5Bworship%5D+while+we+have+better.+2.+That+we+are+sworn+%5Bby+the+SL%26C%5D+against+it.%C2%B9+%C2%B9+%5BThe+SL%26C+does+not+mention+the+KJV%2C+but+the+argument+is+that+the+KJV+is+held+%28by+them%29+to+be+part+of+the+reformation%2C+or+the+reforming+process%2C+that+the+SL%26C+binds+to.%5D+3.+That+it+is+false+worship+and+obeying+man+before+God.+4.+That+we+%5Bthe+ones+who+only+use+the+New+translation%5D+do+but+keep+our+possession%2C+which+they+would+put+us+out+of%2C+and+it%E2%80%99s+they+that+separate+from+us%2C+and+not+we+from+them.+5.+That+we+keep+to+God%E2%80%99s+Word%2C+which+is+the+only+rule.+And+therefore+communion+with+the+Old+Translation+is+unlawful%2C+and+we+should+rather+suffer+death.+Baxter+answers%3A+I.+%281%29+That+it+is+a+cursed+thing+to+give+God+no+public+worship+because+we+cannot+have+the+New+Translation%2C+and+to+live+like+atheists+if+we+cannot+have+what+we+would.+None+is+worse+than+the+Old.+Family+worship+without+church+worship+is+worse+than+an+Old+Translation.+%282%29+And+that+it+is+not+we+that+offer+God+the+worse+before+the+better%3B+it+is+they+that+exclude+the+better%2C+which+we+protest+against%2C+having+not+our+choice.+II.+That+he+that+sware+%5B1.%5D+to+give+over+all+church+worship+unless+he+have+the+New+Translation%2C+swore+wickedly+like+an+atheist%3B+and+he+that+swore+%5B2.%5D+to+communicate+with+no+church+that+used+the+Old+Translation%2C+swore+wickedly+like+a+schismatic%3B+and+he+that+swore+%5B3.%5D+that+God%E2%80%99s+providence+should+never+return+him+to+a+necessity+of+using+the+Old%2C%C2%B9+swore+blasphemously%2C+as+if+he+could+have+governed+the+world+against+God.+%C2%B9+%5BNote+that+such+conditions+are+not+in+the+SL%26C.+See+also+%E2%80%98All+Vows+are+Qualified%E2%80%99+and+%E2%80%98Vows+can+Never+Bind+Beyond+God%E2%80%99s+Law%E2%80%99.%5D+III.+That+all+worship+is+so+far+false+as+it+is+faulty%3B+That+to+forsake+all+public+worship+when+we+cannot+have+the+better+translation+is+to+be+righteous%2C+unrighteously%2C+over+much+%5BEccl.+7%3A16%5D%2C+and+too+little+%5Brighteous%5D%2C+and+to+disobey+both+God+and+man.+IV.+Keep+your+possession+as+long+as+you+can+without+more+hurt+than+good.+I+am+not+one+that+ever+strove+to+take+it+from+you.+But+do+your+brethren+in+prison+enjoy+public+worship%3F+You%E2%80%99ll+say%2C+%E2%80%98They+do+better.+It%E2%80%99s+easier+bearing+their+imprisonment%2C+poverty+and+death+than+your+own.%E2%80%99+But+what+shall+ten+parts+of+the+kingdom+do+that+must+have+the+Old+Translation+or+none%3F+You%E2%80%99ll+say%2C+%E2%80%98I+suppose%2C+they+may+give+over+all+church+worship+as+impossible+and+take+up+with+family+worship.%E2%80%99+But+stay%3A+1.+Must+you+not+first+prove+the+Old+so+bad+as+that+no-church+worship+is+better%3F+Have+you+proved+this%3F+2.+Will+not+your+reason+prove+that+we+must+also+separate+from+you%3F+Have+not+weak+ministers+as+bad+faults+as+a+weak+translation%3F+3.+What%E2%80%99s+become+then+of+your+saying%2C+%E2%80%98We+had+possession%E2%80%99%3F+Have+they+possession+of+better+that+have+none+at+all%3F+Or+will+you+be+without+all%2C+because+you+had+once+possession+of+better%3F+And+will+it+excuse+your+ungodliness+that+you+can+lay+the+blame+on+them+that+dispossessed+you%3F+Or+if+they+be+schismatics+for+so+using+you%2C+does+it+follow+that+you+are+none%2C+if+you+persuade+all+to+separate+from+all+God%E2%80%99s+Church+worship+rather+than+join+where+the+Old+Translation+is+used%3F+V.+God%E2%80%99s+Word+is+the+rule%2C+but+only+a+general+rule+for+words%2C+modes+and+circumstances.+To+love+God+and+our+neighbour+and+the+unity+of+the+Church+are+his+greatest+commands.+Go+learn+what+these+mean.+To+violate+these+and+forsake+all+Church+worship%2C+if+you+cannot+have+the+best+translation%2C+is+not+to+keep+to+the+rule%2C+but+most+grossly+to+violate+it+in+the+greatest+commands+against+many+Scripture+admonitions+which+vehemently+urge+you+to+love+and+unity.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Reformation+%26+Conformity%2C+Catholic+Communion+Doubly+Defended+by+Dr.+Owen%E2%80%99s+Vindicator+%26+Richard+Baxter%E2%80%A6+%28London%3A+Parkhurst%2C+1684%29%2C+section+5%2C+%E2%80%98A+comparison+of+the+use+of+a+faulty+translation+of+the+Scripture+and+a+faulty+liturgy%E2%80%99+%7C+Seeking+Reformation%2C+Occasional+Conformity+%26+Covenanting&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8cc1d43156.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8cc1d43156.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Some%20that%20live%20in%20countries%20where,urge%20you%20to%20love%20and%20unity&amp;text=Some%20that%20live%20in%20countries%20where%20none%20i

</figure><figure class="quote" id="q-f97e3e7708" data-kw="">
<blockquote><p>Not but that much of God’s Will is also contained in the Law of Nature; or may by the mere use of reason be learned from creatures, and providences: But yet this is nothing against the Scripture’s sufficiency and perfection: For besides all the superadded positives, the Scripture also contains all that which we call the Law of Nature; and it is there to be found more legible and discernable than in the best of our obscure, deceitful, corrupted hearts.</p></blockquote>

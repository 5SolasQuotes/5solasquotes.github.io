<main class="wrap"><figure class="quote" id="q-ae2341f834" data-kw="">
<blockquote><p>Did the limits of this discourse permit it, convincing proof could be furnished of the necessity—which has been disputed by some Calvinists even—that Christ should have rendered obedience to the precept of the law in order to the justification of his seed, and that this preceptive righteousness should be imputed to them, in order to the attainment of that end. That cannot now be attempted. Suffice it to say, that the elect seed of Christ were not merely, by virtue of his propitiatory sufferings, to be placed in a condition of confirmed innocence—of everlasting exemption from punishment, but to be entitled, on the ground of a perfect and unchallenged obedience to the preceptive requirements of the law, to the positive communications of the divine favour.

Not only was it incumbent on Christ to deliver his people from the death incurred by the fall of Adam, but as the second Adam to do what the first was required to do—to pay obedience to the precepts of the law. That, strictly speaking, is righteousness, and that the glorious representative of the elect wrought out for them. He produced a perfect obedience to the whole law, and therefore won for himself an adorable name by which he is known in the assemblies of the saints — “the Lord our righteousness.” Like the seamless robe he wore on the day of his crucifixion, the righteousness of Jesus is without division. “Let us not rend it,” but regard it, as he himself produced it—a grand totality, one and indivisible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Federal Theology: Its Import and its Regulative Influence in Memorial Volume of the Semi-Centennial of the Theological Seminary at Columbia, South Carolina</cite></span></figcaption>

<blockquote><p>…those [who err] who imagine that a faithful and regenerate man, by committing any crime or grievous sin, does for a sin loose his faith and justification. And of this first assertion there seem also to be two degrees. For when they say that a faithful man by committing a grievous sin does loose his faith, they mean either the act of faith only or the habit [the abiding principle of it] also. If the act only, which is [for the person] to believe [the] remission of [his] sin, and namely of that crime which he has committed, and whereof he has not as yet repented, we acknowledge that that act of faith when a man is fallen into a great sin is interrupted, until he rise again by repentance. But here is their error in that they think, because the act of faith is interrupted, that therefore there is an intercession of justification and reconciliation with God, and a falling from the state of grace and salvation, into the fearful state of damnation. Unless for the qualifying of their opinion they shall say that they speak not of justification in foro caelesti, ‘in the court of heaven,’ but in foro conscientiae, ‘in the court of their conscience,’ and of falling for a time from the assurance of salvation into the guilt of damnation, which if they shall avouch, there shall not need to be any controversy betwixt us. For we do confess that a man cannot be assured of the remission of any crime whilst he continues in it without repentance: and that howsoever there is no condemnation to them that are in Christ Jesus; yet a faithful man by committing any crime incurs the anger of God and provokes his judgments and not only deserves damnation, and is in himself guilty, or contracts the guilt of death, but many times also by the terror and trouble of his own conscience, aggravated partly by afflictions, partly by spiritual desertions and partly by the temptation of Satan, is, in his own opinion, in the state of damnation. But if we will speak properly, justification is to be considered an act of God, for it is God that justifies, and such an act as depends upon his eternal counsel and proceed[s] from his grace given unto us in Christ before all secular times [before the foundation of the world]. For whom He elects, them He calls, and whom He calls according to his purpose, them and no other He justifies, and whom He justifies, them and all them He glorifies. This act of God, which from our effectual vocation is continued to our glorification, is not interrupted, though the act of faith, which is the apprehension of it, be interrupted.</p></blockquote>

<blockquote><p>1. We begin with the most ancient father, Justin [Martyr]. He, in the book inscribed… an Exposition of the Faith, has these words: ‘The Son of God, as man, passed a life removed from all crime, and underwent a voluntary death; [Greek] that is, obliterating sin by a perfect and sinless conversation [conduct], and abolishing our debt by a debt that he owed not. Justin Martyr here plainly teaches, not only that the death and satisfaction of Christ are imputed to us for the blotting out of our punishment, but that his conversation itself, or active obedience, is imputed to us, for the obliteration of our sin.

2. Irenaeus, Against Heresies, bk. 5… in ch. 18: ‘The Lord has restored us to friendship by his incarnation, being made the Mediator between God and man; both propitiating the Father for us, against whom we had sinned, and making amends for our disobedience; bestowing moreover upon us that conversation [conduct] and obedience which is due to our Maker.’ …What else is this than the obedience of Christ both active and passive, made ours by imputation and bestowal?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Justification</cite>, …, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), ch. 29, p. 254</span></figcaption>

<blockquote><p>Ver. 5. “For Moses,” he says, “describeth the righteousness which is of the Law.” What he means is this. Moses showeth us the righteousness ensuing from the Law, what sort it is of, and whence. What sort is it then of, and what does it consist in? In fulfilling the commandments. “He (R. T. the man), that doeth these things,” He says, “shall live by (or in), them.” (Lev. 18:5.) And there is no other way of becoming righteous in the Law save by fulfilling the whole of it. But this has not been possible for any one, and therefore this righteousness has failed them. (διαπέπτωκεν). But tell us, Paul, of the other righteousness also, that which is of grace. What is that then, and of what does it consist? Hear the words in which he gives a clear sketch of it. For after he had refuted the other, he next goes on to this, and says, Ver. 6, 7, 8, 9. “But the righteousness which is of faith speaketh on this wise, Say not in thine heart, Who shall ascend into heaven (that is, to bring Christ down from above): or, Who shall descend into the deep? (that is, to bring up Christ again from the dead.) But what saith it? The word is nigh thee, even in thy mouth, and in thy heart, that is, the word of faith which we preach. That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised Him from the dead, thou shalt be saved. To prevent the Jews then from saying, How came they who had not found the lesser righteousness to find the greater? he gives a reason there was no answering, that this way was easier than that. For that requires the fulfilment of all things (for when thou doest all, then thou shalt live); but the righteousness which is of faith doth not say this, but what? “If thou confess with thy mouth the Lord Jesus, and believe in thy heart that God hath raised Him from the dead, thou shalt be saved.” Then again that we may not seem to be making it contemptible by showing it to be easy and cheap, observe how he expands his account of it. For he does not come immediately to the words just given, but what does he say? “But the righteousness which is of faith saith on this wise; Say not in thine heart, Who shall go up into heaven? (that is, to bring Christ down); or, Who shall descend into the deep? (that is, to bring up Christ again from the dead.”) For as to the virtue manifested in works there is opposed a listlessness, which relaxeth our labors,3 and it requireth a very wakeful soul not to yield to it: thus, when one is required to believe, there are reasonings which confuse and make havoc of the minds of most men, and it wants a soul of some vigor to shake them thoroughly off. And this is just why he brings the same before one. And as he did in Abraham’s case, so he does here also. For having there shown that he was justified by faith, lest he should seem to have gotten so great a crown by a mere chance, as if it were a thing of no account, to extol the nature of faith, he says, “Who against hope believed in hope, that he might become the father of many nations. And being not weak in faith, he considered his own body now dead, and the deadness of Sarah’s womb. He staggered not at the promise of God through unbelief; but was strong in faith, giving glory to God; and being fully persuaded that what He had promised He was able also to perform” (Rom. 4:18–21): so he showed that there is need of vigor, and a lofty soul, that takes in things beyond expectation, and stumbles not at appearances. This then he does here also, and shows that it requires a wise mind, and a spirit heavenly (Gr. heaven-reaching) and great. And he does not say merely, “Say not,” but, “Say not in thine heart,” that is, do not so much as think of doubting and saying with thyself, And how can this be? You see that this is a chief characteristic of faith, to leave all the consequences of this lower world, and so to seek for that which is above nature, and to cast out the feebleness of calculation, and so to accept everything from the Power of God. The Jews, however, did not merely assert this, but that it was not possible to be justified by faith. But himself turns even what had taken place to another account, that having shown the thing to be so great, that even after it had taken place it required faith, he might seem with good reason to bestow a crown on these: and he uses the words which are found in the Old Testament, being always at pains to keep quite clear of the charges of love of novelties, and of opposition to it. For this, which he here says of faith, Moses says to them of the commandment, so showing that they had enjoyed at God’s hand a great benefit. For there is no need to say, he means, that one must go up to heaven, or cross a great sea, and then receive the commandments, but things so great and grand hath God made of easy access to us. And what meaneth the phrase, “The Word is nigh thee?” That is, It is easy. For in thy mind and in thy tongue is thy salvation. There is no long journey to go, no seas to sail over, no mountains to pass, to get saved. But if you be not minded to cross so much as the threshold, you may even while you sit at home be saved. For “in thy mouth and in thy heart” is the source of salvation. And then on another score also he makes the word of faith easy, and says, that “God raised Him from the dead.” For just reflect upon the worthiness of the Worker, and you will no longer see any difficulty in the thing. That He is Lord then, is plain from the resurrection. And this he said at the beginning even of the Epistle. “Which was declared to be the Son of God with power … by the resurrection from the dead.” (Rom. 1:4.) But that the resurrection is easy too, has been shown even to those who are very unbelieving, from the might of the Worker of it. Since then the righteousness is greater, and light and easy to receive, is it not a sign of the utmost contentiousness to leave what is light and easy, and set about impossibilities? For they could not say that it was a thing they declined as burdensome. See then how he deprives them of all excuse. For what do they deserve to have said in their defence, who choose what is burdensome and impracticable, and pass by what is light, and able to save them, and to give them those things which the Law could not give? All this can come only from a contentious spirit, which is in a state of rebellion against God. For the Law is galling (ἐπαχθὴς), but grace is easy. The Law, though they dispute never so much, does not save; Grace yieldeth the righteousness resulting from itself, and that from the Law likewise. What plea then is to rescue them, since they are disposed to be contentious against this, but cling to that to no purpose whatever? Then, since he had made a strong assertion, he again confirms it from the Scripture.</p></blockquote>

romised+He+was+able+also+to+perform%E2%80%9D+%28Rom.+4%3A18%E2%80%9321%29%3A+so+he+showed+that+there+is+need+of+vigor%2C+and+a+lofty+soul%2C+that+takes+in+things+beyond+expectation%2C+and+stumbles+not+at+appearances.+This+then+he+does+here+also%2C+and+shows+that+it+requires+a+wise+mind%2C+and+a+spirit+heavenly+%28Gr.+heaven-reaching%29+and+great.+And+he+does+not+say+merely%2C+%E2%80%9CSay+not%2C%E2%80%9D+but%2C+%E2%80%9CSay+not+in+thine+heart%2C%E2%80%9D+that+is%2C+do+not+so+much+as+think+of+doubting+and+saying+with+thyself%2C+And+how+can+this+be%3F+You+see+that+this+is+a+chief+characteristic+of+faith%2C+to+leave+all+the+consequences+of+this+lower+world%2C+and+so+to+seek+for+that+which+is+above+nature%2C+and+to+cast+out+the+feebleness+of+calculation%2C+and+so+to+accept+everything+from+the+Power+of+God.+The+Jews%2C+however%2C+did+not+merely+assert+this%2C+but+that+it+was+not+possible+to+be+justified+by+faith.+But+himself+turns+even+what+had+taken+place+to+another+account%2C+that+having+shown+the+thing+to+be+so+great%2C+that+even+after+it+had+taken+place+it+required+faith%2C+he+might+seem+with+good+reason+to+bestow+a+crown+on+these%3A+and+he+uses+the+words+which+are+found+in+the+Old+Testament%2C+being+always+at+pains+to+keep+quite+clear+of+the+charges+of+love+of+novelties%2C+and+of+opposition+to+it.+For+this%2C+which+he+here+says+of+faith%2C+Moses+says+to+them+of+the+commandment%2C+so+showing+that+they+had+enjoyed+at+God%E2%80%99s+hand+a+great+benefit.+For+there+is+no+need+to+say%2C+he+means%2C+that+one+must+go+up+to+heaven%2C+or+cross+a+great+sea%2C+and+then+receive+the+commandments%2C+but+things+so+great+and+grand+hath+God+made+of+easy+access+to+us.+And+what+meaneth+the+phrase%2C+%E2%80%9CThe+Word+is+nigh+thee%3F%E2%80%9D+That+is%2C+It+is+easy.+For+in+thy+mind+and+in+thy+tongue+is+thy+salvation.+There+is+no+long+journey+to+go%2C+no+seas+to+sail+over%2C+no+mountains+to+pass%2C+to+get+saved.+But+if+you+be+not+minded+to+cross+so+much+as+the+threshold%2C+you+may+even+while+you+sit+at+home+be+saved.+For+%E2%80%9Cin+thy+mouth+and+in+thy+heart%E2%80%9D+is+the+source+of+salvation.+And+then+on+another+score+also+he+makes+the+word+of+faith+easy%2C+and+says%2C+that+%E2%80%9CGod+raised+Him+from+the+dead.%E2%80%9D+For+just+reflect+upon+the+worthiness+of+the+Worker%2C+and+you+will+no+longer+see+any+difficulty+in+the+thing.+That+He+is+Lord+then%2C+is+plain+from+the+resurrection.+And+this+he+said+at+the+beginning+even+of+the+Epistle.+%E2%80%9CWhich+was+declared+to+be+the+Son+of+God+with+power+%E2%80%A6+by+the+resurrection+from+the+dead.%E2%80%9D+%28Rom.+1%3A4.%29+But+that+the+resurrection+is+easy+too%2C+has+been+shown+even+to+those+who+are+very+unbelieving%2C+from+the+might+of+the+Worker+of+it.+Since+then+the+righteousness+is+greater%2C+and+light+and+easy+to+receive%2C+is+it+not+a+sign+of+the+utmost+contentiousness+to+leave+what+is+light+and+easy%2C+and+set+about+impossibilities%3F+For+they+could+not+say+that+it+was+a+thing+they+declined+as+burdensome.+See+then+how+he+deprives+them+of+all+excuse.+For+what+do+they+deserve+to+have+said+in+their+defence%2C+who+choose+what+is+burdensome+and+impracticable%2C+and+pass+by+what+is+light%2C+and+able+to+save+them%2C+and+to+give+them+those+things+which+the+Law+could+not+give%3F+All+this+can+come+only+from+a+contentious+spirit%2C+which+is+in+a+state+of+rebellion+against+God.+For+the+Law+is+galling+%28%E1%BC%90%CF%80%CE%B1%CF%87%CE%B8%E1%BD%B4%CF%82%29%2C+but+grace+is+easy.+The+Law%2C+though+they+dispute+never+so+much%2C+does+not+save%3B+Grace+yieldeth+the+righteousness+resulting+from+itself%2C+and+that+from+the+Law+likewise.+What+plea+then+is+to+rescue+them%2C+since+they+are+disposed+to+be+contentious+against+this%2C+but+cling+to+that+to+no+purpose+whatever%3F+Then%2C+since+he+had+made+a+strong+assertion%2C+he+again+confirms+it+from+the+Scripture.%E2%80%9D%0A%0A%E2%80%94+John+Chrysostom%2C+%E2%80%9CHomilies+of+St.+John+Chrysostom%2C+Archbishop+of+Constantinople%2C+on+the+Epistle+of+St.+Paul+to+the+Romans <blockquote><p>The state of the case is really this, — that the faithful are never reconciled to God without the gift of regeneration; nay, we are for this end justified, — that we may afterwards serve God in holiness of life. Christ indeed does not cleanse us by his blood, nor render God propitious to us by his expiation, in any other way than by making us partakers of his Spirit, who renews us to a holy life.</p></blockquote>

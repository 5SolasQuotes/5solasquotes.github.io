<main class="wrap"><figure class="quote" id="q-b1da1a9cb3" data-kw="self-exam">
<blockquote><p>Christ used bread because with the divine blessing it is of all the elements the most efficacious for nourishing and strengthening the body; the most common, the most familiar and to be found everywhere, easily prepared and the most pleasant. However, the bread he used was unleavened; not from the necessity of the thing, but from an accidental circumstance of time, on account of the feast of the Passover, in which it was lawful neither to use nor to have any other (Ex. 12:19). Otherwise it was always fermented in Judea (whenever the Supper was celebrated outside of that time, Acts 2:42) as well as among the Gentiles (who used common and not unleavened bread). Hence it was called simply the “breaking of bread” (Acts 20:7; 1 Cor. 10:16; 11:26, 27). So that here so fierce a dispute on this subject falsely sprang up between the Greeks and Latins; the Greeks pressing the necessity of leavened, the latter of unleavened bread. The former were called “fermentarians” and the latter “azymites.” The thing is in itself indifferent (as many of the Romanists acknowledge); on account of which the peace of the church ought not to be disturbed, but it should be left to their freedom (as it is evident that both the ancient and also the modern uses vary).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.22</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5fae02486d" data-kw="unworthy">
<blockquote><p>The reasons are: (1) from the institution and the example of Christ. Christ broke the bread and all the evangelists, and Paul, who individually relate this, agree that he did. Now who would affirm that the Son of God in so sacred an action did anything superfluous, or that all the apostles would have related this with so great carefulness, if the thing was merely indifferent and free? Who, on the other hand, does not see that Christ wished to prescribe the sacramental rites and ceremonies by his example and command when he ordered his disciples “to do this” (i.e., with respect to those administering, to take the bread, to bless, to break and give it to the communicants)? Again, there ought to be the same reason for the breaking as the giving of thanks and for the distribution because it is placed between them. Now no one denies that these latter ceremonies are necessary, belonging to the instituted rite and not merely indifferent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.24</span></figcaption>

</figure><figure class="quote" id="q-118969d3d1" data-kw="institution">
<blockquote><p>The other sacrament of the New Testament is the holy Supper, in which, by the distribution and reception of broken bread and poured-out wine, is declared and sealed to believers the communion of the body of Christ broken for them on the cross and of his blood shed for them unto eternal life. The more illustrious and of greater moment to the consolation of believers this mystery of the Christian religion is, with so much the greater violence has Satan always endeavored to obscure and corrupt it in order to deprive the church of this inestimable treasure. Hence it has happened that in no part of religion have such prolix and animated disputations been raised up, so that at length the Romanists seem to have constituted the sum of theology in this article, nor is there anything in theology or philosophy which they have not brought to bear upon this and compelled to serve their purpose. Various names by which it is usually expressed: (1) the Lord’s Supper (1 Cor. 11:20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.21.1</span></figcaption>

</figure><figure class="quote" id="q-aee103fb5c" data-kw="real spiritual">
<blockquote><p>Although this spiritual presence does not take place except faith mediates, it does not follow (as our opponents falsely charge upon us) that it is only imaginary and unreal (phantastikēn), by which not so much Christ as a phantasm (phantasma) of him or his image becomes present. Spiritual things are no less real and true than corporeal; nay, as they are more perfect, so their mode of presence ought to have perfection. I confess that by those to whom faith is only historical and consists in the bare knowledge of the object, that presence can be called less real (although not even so is a presence denied by philosophers by whom whatever is perceived by the intellect can be said to be truly present to it). But the Scriptures far otherwise describe faith and the presence which it works, while they designate it by sight, hearing and touch, by access, reception and manducation: all of which prove not an unreal (phantasticam) presence (which is made only by phantasms or notions and imaginary ideas), but a true and real presence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.4.6</span></figcaption>

</figure><figure class="quote" id="q-9728b127f4" data-kw="against mass">
<blockquote><p>Thus we determine that in the Christian church no true, real and properly so called propitiatory sacrifice is granted, except the sacrifice of Christ once offered on the cross. This we think neither can nor ought to be repeated. And so we reject and detest the sarifice of the Mass as diametrically opposed to the sacred Scriptures and to the Christian faith and highly injurious and derogatory to Christ. The reasons why we thus determine are many. Proof that no sacrifice of the Mass is granted: (1) from the silence of the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.29.5</span></figcaption>

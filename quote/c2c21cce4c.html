<main class="wrap"><figure class="quote" id="q-c2c21cce4c" data-kw="">
<blockquote><p>Faith is the key that opens the treasure chests of our God; prayer is the hand by which we grasp the treasures and are made rich. Prayer lifts our hearts from earth to heaven. It refreshes our memories of God’s promises in order to strengthen us. It brings assurance and safety against anything that causes us to fear. By it we receive from his hand all that we desire. Prayer supplies rest and peace for our souls. It maintains and strengthens reverence for the Lord. It increases the desire to turn to him who is the fountain and fullness of all things.

Prayer teaches us to forsake the world and to crucify our flesh. In prayer we see our heavenly and everlasting benefits for whose enjoyment we sigh. Nothing is more desirable as having fellowship with him apart from whom we cannot be blessed. Would you keep company with God, then you must either pray or read, for when we pray, we are speaking with God, and when we read, God is speaking to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-taffin.html">Jean Taffin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marks of God’s Children</cite>, trans. Peter Y. De Jong, ed. James A. De Jong (1588; Grand Rapids MI: Reformation Heritage Books, 2003), p. 139.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-443a86e113" data-kw="six petitions">
<blockquote><p>The reason why I do not agree with those who distinguish seven headings is that by inserting the adversative &quot;but&quot; the Evangelist seems to have meant to join those two members together. It is as if he had said: &quot;Do not allow us to be oppressed by temptation but rather bring help for our weakness, and deliver us from falling.&quot; Ancient writers of the church also agree with us, so that what has been added in seventh place in Matthew exegetically ought to be referred to the sixth petition. But even though the whole prayer is such that throughout it God&#x27;s glory is to be given chief place, still the first three petitions have been particularly assigned to God&#x27;s glory, and this alone we ought to look to in them, without consideration of what is called our own advantage. The three others are concerned with the care of ourselves, and are especially assigned to those things which we should ask for our own benefit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/the-lords-prayer.html">The Lord&#x27;s Prayer</a></span></div>

</figure><figure class="quote" id="q-55267ed6c2" data-kw="forgive us our debts">
<blockquote><p>45. The fifth petition e Next follows: &quot;Forgive us our debts&quot; [Matt. 6:12]. With this and the following petition, Christ briefly embraces all that makes for the heavenly life, as the spiritual covenant that God has made for the salvation of his church rests on these two members alone: &quot;I shall write my laws upon their hearts,&quot; and, &quot;I shall be merciful toward their iniquity&quot; [Jer. 31:33 p.; cf. ch. 33:8]. Here Christ begins with forgiveness of sins, then presently adds the second grace: that God protect us by the power of his Spirit and sustain us by his aid so we may stand unvanquished against all temptations. e(a) He calls sins &quot;debts&quot; because we owe penalty for them, aand we could in no way satisfy it unless we were released by this forgiveness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20</span></figcaption>

</figure><figure class="quote" id="q-bded0e8fc8" data-kw="Mary Idolatry">
<blockquote><p>Giving divine honor to the holy Virgin, or worshipping her with adoration, as Protestants say, due to God alone; of ascribing all the titles of Christ unto her, turning Lord in the Psalms in most places into Lady; praying to her, not only to entreat, yea, to command her Son to help and save them, but to save them herself, as she to whom her Son hath committed the administration of mercy, keeping that of justice to himself; with many other the like horrid blasphemies, which he shall hear more of if he desire it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions on Fiat Lux</cite>, ch. 15 (Blessed Virgin)</span></figcaption>

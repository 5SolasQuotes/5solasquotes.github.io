<blockquote><p>…he [Luther] erected no new Church, but by his ministry brought many faithful out of their impure and unsound [Roman] Church, into a more sound and pure Church, not only, for matters of ceremonies (for then he had been a schismatic to separate from them), but for matters of substance…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church</cite>, … (London: Kyngston, 1631). Randall (1570–1622) was an English puritan. | pt. 2, Lecture 26; pp. 167-68</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a75aea8d0d" data-kw="">
<blockquote><p>It is often said that the divided condition of Christendom is an evil, and so it is. But the evil consists in the existence of the errors which cause the divisions and not at all in the recognition of those errors when once they exist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity and Liberalism, New Edition</cite>, p. 50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-5db2709540" data-kw="">
<blockquote><p>How much the ministry of the Word and sacraments should weigh with us… so as to be a perpetual badge for distinguishing the Church, has been explained; for we have shown, first, that wherever it exists entire and unimpaired, no errors of conduct, no defects should prevent us from giving the name of Church; and, secondly, that trivial errors in this ministry ought not to make us regard it as illegitimate. Moreover, we have shown that the errors to which such pardon is due, are those by which the fundamental doctrine of religion is not injured, and by which those articles of religion, in which all believers should agree, are not suppressed, while, in regard to the sacraments, the defects are such as neither destroy nor impair the legitimate institution of their Author.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, tr. Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 3, bk. 4, ch. 2, §1, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-dec2505fa0" data-kw="">
<blockquote><p>In matters fundamental, as the profession of faith must be entire in all points of simple belief, so must the doctrine of the Church in all things concerning practice: but errors of inferior alloy, wherein godly men dissent pardonably one from another, both concerning faith and practice, may be found and maintained in the true Church.</p></blockquote>

</figure><figure class="quote" id="q-89bdd6d968" data-kw="">
<blockquote><p>And in the Acts we read that the faithful continued in the doctrine of the apostles, in the communion and breaking of bread, and in prayers (Acts 2:42), which is no other thing but a brief description of the true Church of Christ, instructed by the Word, in true faith and knit together in true charity, through the communion that is in Him. The which thing St. Ambrose teaches us saying (De Salubr., ch. 7), that the catholic Church is that where God speaks with his servants: and St. Augustine also (contra Cresco. Gramat., bk. •, ch. 11 etc.), where He places the ministry of ministers and pastors of the Church, in the Word of God and sacraments. Let us yet add hereunto the third mark of this Church, albeit it be not of the substance, but outward, to wit, the lawful vocation of pastors and ministers of the Church, which have the administration of the things aforesaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philippe de Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter</cite>, [in controversy with Romanism] (London: Barker, 1579), ch. 2, n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

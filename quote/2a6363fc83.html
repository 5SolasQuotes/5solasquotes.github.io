<main class="wrap"><figure class="quote" id="q-2a6363fc83" data-kw="">
<blockquote><p>No bodily receation therefore is to be used on this day but so far as it may help the soul to do more cheerefully the service of the Lord.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-29dfe35b27" data-kw="">
<blockquote><p>Question: Is it lawful to drink wine, or other strong drink, or to eat delicates and dainties on the Sabbath or no? Answer: If men have these things provided, and ready at hand of their own, or in the house where they are on the Sabbath, they may use them on the Sabbath; so as they use them moderately, and for the better enabling of them to perform holy duties both in public and private. Eccl. 10:17, Solomon would haue princes to eat in time, and for strength, and not for drunkenness. Much more then other men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-elton.html">Edward Elton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Holy Mind Touching Matters Moral which Himself Uttered in Ten Words</cite>, … (London: 1625), p. 105</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>
<div class="actions"><button class="copy" data-copy="“Question: Is it lawful to drink wine, or other strong drink, or to eat delicates and dainties on the Sabbath or no? Answer: If men have these things provided, and ready at hand of their own, or in the house where they are on the Sabbath, they may use them on the Sabbath; so as they use them moderately, and for the better enabling of them to perform holy duties both in public and private. Eccl. 10:17, Solomon would haue princes to eat in time, and for strength, and not for drunkenness. Much more then other men.”

</figure><figure class="quote" id="q-1fbfb885bf" data-kw="">
<blockquote><p>How blind is superstition, that they [the Pharisees] could think that it was contrary to the will of God that his people should fit themselves for the service of the Sabbath by a moderate refreshment?… What a little thing do they carp at? Wherein was the sin, the plucking of a few ears of corn, and rubbing them, could hardly be called servile labor, especially not in the sense of the commandment, which restrained not necessary labour, but such labor as took them off from the duties of the Sabbath, but their tradition had made this unlawful…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, … (London: Parkhurst, 1685), on Mt. 12, v. 2 margin note</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>
<div class="actions"><button class="copy" data-copy="“How blind is superstition, that they [the Pharisees] could think that it was contrary to the will of God that his people should fit themselves for the service of the Sabbath by a moderate refreshment?… What a little thing do they carp at? Wherein was the sin, the plucking of a few ears of corn, and rubbing them, could hardly be called servile labor, especially not in the sense of the commandment, which restrained not necessary labour, but such labor as took them off from the duties of the Sabbath, but their tradition had made this unlawful…”

</figure><figure class="quote" id="q-c4c27e5535" data-kw="">
<blockquote><p>That saying of our Savior, that the Sabbath was not made for man etc. was not uttered by Him to show that the action of the disciples in plucking and eating the ears of corn was warranted by necessity against the command of the Sabbath, but that it was not within the prohibition of works on the Sabbath, which ordinarily is restrained to works of a civil or servile nature, not to natural refreshment, which is always indulged on the Sabbath and so that work of mercy is not under the prohibition, for the plucking of the ears of corn, when they were in the field was no more then drawing drink out of a vessel and of this opinion is learned [Martin] Chemnitz: Hoc Christus it a defendit, ut simul ostendat extra casum contempus publici ministry, et turbationis cultus sabati propter otium externum Sabati, hominem ne levi quidē incommodo assiciendum. ‘By this Christ does so defend his disciples, as withal He shows that, out of the case of contempt of the public ministry and disturbance of the worships of the Sabbath, for the external rest of the Sabbath, a man is not to undergo the least damage.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-geree.html">John Geree</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Might Overcoming Right. Or a Clear Answer to Mr. John Goodwin’s Might and Right well met</cite>, (London: Bostock, 1649), ch. 1, section 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

ath&amp;text=man%20is%20not%20to%20undergo%20the%20least%20damage" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6f13d4c7a7" data-kw="">
<blockquote><p>…the great rule of Gospel administrations is that all things be done to edification. This is the main end of the ministry itself, in all the duties thereof, that are purely evangelical. For this end was the office of the ministry instituted, for this end are ministerial gifts dispensed, for this end were the sacraments appointed, and all Church assemblies, Church power, and whatever else belongs to Churches; it is all ordained for this end that the Body of Christ may be edified and increased with the increase of God, Eph. 4:7-15; Col. 2:19; Acts 9:31; Rom. 14:15, 19; 1 Cor. 10:23; ch. 14:3-5; 12:26; 2 Cor. 12:19; 1 Tim. 1:4. The full and adaequate rule of all Church-order and duties is that all things be done to edification. It does not hence ensue that whatever men shall judge to conduce to edification, may be used by themselves or imposed on others in the worship of God. Christ Himself, the onely wise and competent Judge in such cases…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, (London, 1662), ch. 10, ‘Other Considerations about the Imposition of Liturgies,’, p. 61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

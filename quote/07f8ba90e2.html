<main class="wrap"><figure class="quote" id="q-07f8ba90e2" data-kw="">
<blockquote><p>XII. As an instrument, He uses his word (Rom. 10:16), and that of both the Law and the Gospel, in different ways: by the former, indeed, preparing the way for the efficacy of vocation (Gal. 3:24), and by the latter, perfecting the same in the called (Rom. 1:16). XIII. This is also sometimes extraordinary, and God acts beyond the accustomed manner, so that what He is accustomed to effect together with the Word, He produces without its help or assistance, administering the matter by the revelation and efficacy of his Spirit alone (Acts 9:3-6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the Efficacious Vocation of the Sinner to Salvation trans. AI (Leiden: Marcus, 1620)</cite>, p. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-04aae92d6a" data-kw="">
<blockquote><p>There will be no one found among men that is free from every vice; but it is one thing to be blemished with ordinary vices, which do not hurt the reputation, because they are found in men of the highest excellence, and another thing to have a disgraceful name, or to be stained with any baseness. In order, therefore, that a bishop may not be without authority, he enjoins that there shall be made a selection of one who has a good and honorable reputation, and not chargeable with any remarkable vice.</p></blockquote>

</figure><figure class="quote" id="q-bda0dba676" data-kw="">
<blockquote><p>If [as Thomas Hooker says,] ‘the laying on of hands be no specificating act of an office, because it is used in other performances, as in the sending of Paul and Barnabas to preach to the Gentiles, Acts 13,’ then shall water not be essential to baptism, nor drinking to the Lord’s Supper, nor blessing sacramental in that Supper, because in Levitical washings, in the feasts-sacred, in the Passover, in praying for a blessing to the Word preached, all these were used. It’s loose logic, a genere ad speciem [a genus to the species]; the question is not of laying on of hands in general, but of a certain kind and species of laying on of hands by way of prayer and designation. Mr. Rutherford knows there be diverse kinds of laying on of hands. 2. Nor do I say that the rite is essential to ordination, but of the necessity of before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline penned by Mr. Thomas Hooker (1658)</cite>, pp. 428-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-a9db13165e" data-kw="">
<blockquote><p>The other two are ordinary office-bearers, pastors and teachers; I say two, though the disjunctive particle “some,” be not cast in between them; for they are distinguished, Rom. 12:7, 8, and the exercise of their respective offices is distinguished also, 1 Cor. 12:8; so that by pastors are meant those who, besides their ability to open up the text of Scripture in some measure, are chiefly gifted with the word of wisdom, wisely and powerfully to apply the word for working upon the affections, as the matter requires; and the teacher is he who is gifted with the word of knowledge, or ability to open up the mind of God in Scripture, establishing truth, and confuting error, without insisting much upon particular application; which office, because of the church’s poverty, is confined to the schools, and the ordinary exercise of it before the people left upon the pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Eph. 4:11.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

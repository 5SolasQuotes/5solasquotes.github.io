<main class="wrap"><figure class="quote" id="q-6edaff04ca" data-kw="">
<blockquote><p>Hearken and consider. Jehovah our God is one Lord. Besides him there is not any other God. He is one. But in this one Jehovah, you are to reckon One, Two, Three, and no more. There are three, each of whom is Jehovah, yet Jehovah is one. These three are quite equal to each other, because every one of them is the one Jehovah.

Their names are, the Father, the Son, the Holy Spirit. The Father is the first who is Jehovah, the Son is the second who is also the same Jehovah, the Holy Spirit is the third who is likewise the same Jehovah. This is our God, The one Jehovah, the Father, the Son, and the Holy Spirit, whom the angels of heaven worship for ever and ever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-love.html">John Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Addresses to the People of Otaheite, Designed to Assist the Labour of Missionaries and Other Instructors of the Ignorant. To which is Prefixed A Short Address to the Members and Friends of the Missionary Society in London in Sermons Preached on Public Occasions: With Fifteen Addresses to the People </cite></span></figcaption>

<blockquote><p>The operation of the Holy Spirit, although indescribable, is very remote from enthusiasm. In enthusiasm the objects which are impressed on the mind, do not come from without, but are inwardly suggested by the mind itself. But in the Spirit’s operations the object is always understood to make its approach from without, and to be derived from the word. Enthusiasm takes place by sudden motions, which go before reason itself, and often exclude it altogether; the operation of the Spirit draws along with it the cordial consent of the will. Once more, enthusiasm affects the mind, while the will often remains unchanged; and hence it is found even in the ungodly; whereas the operations of divine grace necessarily include a change of the heart.

Although we cannot explain the operation of grace, yet we may make a few remarks upon it. We believe, then, that this divine work exercises an immediate influence on the body and on the soul, in order that the passions may not pervert our reason and judgment. It also prevents such motions from being excited within the brain, as would excite evil thoughts in the mind. It calls off the mind from all those ideas and thoughts which would divert it from holiness.

It prevents those objects from fastening on the mind, which have a tendency to corrupt it. It induces such attention, during the reading or hearing of the word, as prevents the mind from forming a hasty or wrong judgment. It very often suggests and brings to remembrance the truths which we have heard or read. It fills the mind with great delight, either when we read the word, or are desirous of reducing it to practice. Lastly, it increases this sacred pleasure more and more, so as to overcome the pleasures of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 7.3, p. 342.</span></figcaption>

<blockquote><p>This righteousness then, which God communicates to man, and accepts alone, and owns as righteousness, has been revealed, he says, without the law, that is, without the aid of the law; and the law is to be understood as meaning works; for it is not proper to refer this to its teaching, which he immediately adduces as bearing witness to the gratuitous righteousness of faith. Some confine it to ceremonies; but this view I shall presently show to be unsound and frigid. We ought then to know, that the merits of works are excluded. We also see that he blends not works with the mercy of God; but having taken away and wholly removed all confidence in works, he sets up mercy alone. It is not unknown to me, that Augustine gives a different explanation; for he thinks that the righteousness of God is the grace of regeneration; and this grace he allows to be free, because God renews us, when unworthy, by his Spirit; and from this he excludes the works of the law, that is, those works, by which men of themselves endeavour, without renovation, to render God indebted to them. (Deum promereri—to oblige God.) I also well know, that some new speculators proudly adduce this sentiment, as though it were at this day revealed to them. But that the Apostle includes all works without exception, even those which the Lord produces in his own people, is evident from the context.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, trans. John Owen (Bellingham, WA: Logos Bible Software, 2010), 134.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

</figure><figure class="quote" id="q-74b5c996f0" data-kw="">
<blockquote><p>The Spirit. Esa. 11.2. The Spirit with all the gifts thereof are upon him; is sent and given by God the Father, and abide in Christ. Yet it is said upon him because the Spirit came down from heaven and did visibly rest on him. On me, I, that is on my Humanity. Math. 3.16. So that these words signify thus much. The gifts of the Holy Ghost, proceeding from God my Father, doth reside and dwell in this my Humanity, which ye see; by which gifts, I am sanctified to this Office of Reconciliation.

[Object.] But it may be said, what Excellency hath Christ by this, above others; for the Prophet Esay affirms the like of him, and so may other Holy men, that they have the Spirit.

[Answ.] To this, answer is, That that of Esay is chiefly to be understood of Christ, and not of himself; and with great difference the Spirit doth reside in Christ and in others. And this difference appears in two things.

First, in the Universality of the gifts in Christ. Second, in the Perfection of gifts. As touching the first God did not bestow one or two, or more gifts on the Humanity of Christ, but he powered them out most plentifully on him. John 3.34, 35. Col. 2.3.9. It pleased the Father, that all fullness should dwell in him: all gifts are not given to one, but to every member, as much as seems good to the Spirit of God. 1 Cor. 12.11. For as the head is the common receptacle of all the senses, and doth exercise their faculties, when as yet, every Sense hath it distinct Office; In the execution whereof, they are employed. [Simile.] So our head Christ, is most fully furnished with all necessary gifts, to the animating of his body, when as yet the members of his body have their several functions and parts, in which all their faculty or ability is circumscribed.

For the second, all the gifts of Christ were most perfect in him, perfect Wisdom, Knowledge, Justice, Holiness; not inchoate, but in their perfect maturity. There was no defect of any gift, or in any; but all were ministered unto, absolute in all parts and degrees, to the full perfection of his Humanity; and this not only from some time of his Age, but from his first Conception. Luke 1.35. To his Resurrection and Ascension. 2 Cor. 5.21.

Now the gifts, given to the Saints, are only the first fruits, a handful and as earnest-pence. 1 Cor. 13.12. We know but in part, we Love but in part. So that we may easily see, how far the dwelling of the Spirit in holy men, differs from the manner of the same in Christ. In the one without measure, in the other in measure. In Christ full, in us in part; in him Primarily, In us, Secondarily. So that as great difference as there is twixt the spring, and the stream flowing thence. Twixt the light of the Moon and stars, and the Sun. [Simile.] The one being borrowed and imperfect, the other being original, and always equal. So great difference is there twixt Christ and his Saints in regard of gifts. And indeed, this plenitude of gifts, is one of the peculiar Prerogatives, which the Humanity of Christ hath received by the Hypostatical union; neither can they be found in any other person, who is not God and man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brightman.html">Thomas Brightman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Brightman redivivus: or The post-humian of-spring of Mr. Thomas Brightman, in IIII. sermons. Viz. 1. Of the two covenants. 2. The danger of scandals. 3. God’s commission to Christ to preach the Gospel. 4. The saint’s security</cite>, (London: John Rothwell, 1647), pp 46-47.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

— Thomas Brightman, Brightman redivivus: or The post-humian of-spring of Mr. Thomas Brightman, in IIII. sermons. Viz. 1. Of the two covenants. 2. The danger of scandals. 3. God’s commission to Christ to preach the Gospel. 4. The saint’s security, (London: John Rothwell, 1647), pp 46-47.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Spirit.+Esa.+11.2.+The+Spirit+with+all+the+gifts+thereof+are+upon+him%3B+is+sent+and+given+by+God+the+Father%2C+and+abide+in+Christ.+Yet+it+is+said+upon+him+because+the+Spirit+came+down+from+heaven+and+did+visibly+rest+on+him.+On+me%2C+I%2C+that+is+on+my+Humanity.+Math.+3.16.+So+that+these+words+signify+thus+much.+The+gifts+of+the+Holy+Ghost%2C+proceeding+from+God+my+Father%2C+doth+reside+and+dwell+in+this+my+Humanity%2C+which+ye+see%3B+by+which+gifts%2C+I+am+sanctified+to+this+Office+of+Reconciliation.%0A%0A%5BObject.%5D+But+it+may+be+said%2C+what+Excellency+hath+Christ+by+this%2C+above+others%3B+for+the+Prophet+Esay+affirms+the+like+of+him%2C+and+so+may+other+Holy+men%2C+that+they+have+the+Spirit.%0A%0A%5BAnsw.%5D+To+this%2C+answer+is%2C+That+that+of+Esay+is+chiefly+to+be+understood+of+Christ%2C+and+not+of+himself%3B+and+with+great+difference+the+Spirit+doth+reside+in+Christ+and+in+others.+And+this+difference+appears+in+two+things.%0A%0AFirst%2C+in+the+Universality+of+the+gifts+in+Christ.+Second%2C+in+the+Perfection+of+gifts.+As+touching+the+first+God+did+not+bestow+one+or+two%2C+or+more+gifts+on+the+Humanity+of+Christ%2C+but+he+powered+them+out+most+plentifully+on+him.+John+3.34%2C+35.+Col.+2.3.9.+It+pleased+the+Father%2C+that+all+fullness+should+dwell+in+him%3A+all+gifts+are+not+given+to+one%2C+but+to+every+member%2C+as+much+as+seems+good+to+the+Spirit+of+God.+1+Cor.+12.11.+For+as+the+head+is+the+common+receptacle+of+all+the+senses%2C+and+doth+exercise+their+faculties%2C+when+as+yet%2C+every+Sense+hath+it+distinct+Office%3B+In+the+execution+whereof%2C+they+are+employed.+%5BSimile.%5D+So+our+head+Christ%2C+is+most+fully+furnished+with+all+necessary+gifts%2C+to+the+animating+of+his+body%2C+when+as+yet+the+members+of+his+body+have+their+several+functions+and+parts%2C+in+which+all+their+faculty+or+ability+is+circumscribed.%0A%0AFor+the+second%2C+all+the+gifts+of+Christ+were+most+perfect+in+him%2C+perfect+Wisdom%2C+Knowledge%2C+Justice%2C+Holiness%3B+not+inchoate%2C+but+in+their+perfect+maturity.+There+was+no+defect+of+any+gift%2C+or+in+any%3B+but+all+were+ministered+unto%2C+absolute+in+all+parts+and+degrees%2C+to+the+full+perfection+of+his+Humanity%3B+and+this+not+only+from+some+time+of+his+Age%2C+but+from+his+first+Conception.+Luke+1.35.+To+his+Resurrection+and+Ascension.+2+Cor.+5.21.%0A%0ANow+the+gifts%2C+given+to+the+Saints%2C+are+only+the+first+fruits%2C+a+handful+and+as+earnest-pence.+1+Cor.+13.12.+We+know+but+in+part%2C+we+Love+but+in+part.+So+that+we+may+easily+see%2C+how+far+the+dwelling+of+the+Spirit+in+holy+men%2C+differs+from+the+manner+of+the+same+in+Christ.+In+the+one+without+measure%2C+in+the+other+in+measure.+In+Christ+full%2C+in+us+in+part%3B+in+him+Primarily%2C+In+us%2C+Secondarily.+So+that+as+great+difference+as+there+is+twixt+the+spring%2C+and+the+stream+flowing+thence.+Twixt+the+light+of+the+Moon+and+stars%2C+and+the+Sun.+%5BSimile.%5D+The+one+being+borrowed+and+imperfect%2C+the+other+being+original%2C+and+always+equal.+So+great+difference+is+there+twixt+Christ+and+his+Saints+in+regard+of+gifts.+And+indeed%2C+this+plenitude+of+gifts%2C+is+one+of+the+peculiar+Prerogatives%2C+which+the+Humanity+of+Christ+hath+received+by+the+Hypostatical+union%3B+neither+can+they+be+found+in+any+other+person%2C+who+is+not+God+and+man.%E2%80%9D%0A%0A%E2%80%94+Thomas+Brightman%2C+Brightman+redivivus%3A+or+The+post-humian+of-spring+of+Mr.+Thomas+Brightman%2C+in+IIII.+sermons.+Viz.+1.+Of+the+two+covenants.+2.+The+danger+of+scandals.+3.+God%E2%80%99s+commission+to+Christ+to+preach+the+Gospel.+4.+The+saint%E2%80%99s+security%2C+%28London%3A+John+Rothwell%2C+1647%29%2C+p <blockquote><p>But that which abides always is certainly not changed, therefore if it suffers no change it is eternal. And so the Holy Spirit is eternal, but the creature is liable to fault, and therefore subject to change. But that which is subject to change cannot be eternal, and there cannot therefore be anything in common between the Spirit and the creature, because the Spirit is eternal, but every creature is temporal.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-097d771964" data-kw="">
<blockquote><p>Believe if ye will [as it is claimed by Romanists] that [Emperor] Constantine gave to the Popes of Rome freedom and immunity from the imperial laws… we teach no such kingly power given to Church-men, and judge this Donation [of Constantine] to be a forged lie, invented by Papists… 6. We do not teach that Church-men are loosed from the positive laws of emperors and kings. [The Romanist, Robert] Bellarmine says that the Magistrate can neither punish Church-men, nor convene them before the tribunal… And as he says, by divine law the Pope is eximed [exempt] from all laws of princes… And what they allege for Peter’s exemption from paying tribute, will exime all the disciples, and so all Church-men by divine right from the laws of princes. Yea all Clergy-men (say they) by a divine positive law are eximed from the laws of Magistrates… Paul will have every soul subject to superior powers, and except the Roman clergy want [lack] souls, they must also be subject. Solomon punished [the priest] Abiathar, Josiah burnt the bones of the priests upon the altar, Christ subjected Himself to his parents, payed tribute to Caesar, and commanded scribes and pharisees to do the like, Mt. 22, willing that they should give to Ceasar those things which are Caesar’s. Paul appealed to Caesar’s tribunal, and Rom. 13, as many as may do evil, as many as are in danger of resisting the power, are to be subject, Rom. 13:4. 2. but Church-men are such, therefore they are subject.</p></blockquote>

</figure><figure class="quote" id="q-3eb2342fa4" data-kw="">
<blockquote><p>The king receives royal power with the states to make good laws, and power by his royalty to execute those laws, and this power the community has devolved in the hands of the king and states of parliament; but the community keeps to themselves a power to resist tyranny, and to coerce it, and eatenus, ‘in so far’ is Saul subject, that David is not to compear before him, nor to lay down Goliah’s sword, nor disband his army of defence, though the king should command him so to do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 35</span></figcaption>

<blockquote><p>In 1849, a cholera epidemic was raging throughout the United States. Not long after former President James K. Polk died of the disease in June, President Zachary Taylor declared a national day of fasting and prayer to be observed on August 3, 1849. E.D. McMaster, in his final days as President of Miami University in Ohio, preached a sermon that day titled Impending Judgments Averted by Repentance.” – Andrew Myers, ‘National Judgments Call for National Repentance: E.D. McMaster’; see here for more background info. Henry, Symmes C. – The Pestilence, a Divine Visitation: a Sermon preached August the Third, 1849, the Day of the National Fast Ref (1849) Symmes was a presbyterian minister in New Jersey. On the 1855 epidemic of Yellow Fever in America Armstrong, George D. – ‘The Lesson of the Pestilence’ (1855) on Heb. 12:10 About the yellow-fever epidemic in 1855 in Norfolk, Virginia, and in America generally. Armstrong was a presbyterian pastor. Cummins, George David – ‘The Pestilence: God’s Messenger and Teacher’ (1855) on Num. 16:46 About the yellow-fever epidemic in Norfolk, Virginia. Cummins (1822-1876) was an American Anglican Bishop and founder of the Reformed Episcopal Church. He was a staunch evangelical of reformed doctrine and he opposed the influences of ritualism and the Anglo-Catholic Oxford Movement. Storrs, Richard S. – ‘Terrors of the Pestilence’ (1855) on Eccl. 9:12 Storrs (1821-1900) was a conservative, congregational minister of the Church of the Pilgrims in Brooklyn, NY. Handy, Isaac W.K. – ‘The Terrible Doings of God’ (1855) Handy was a confederate, presbyterian pastor who was a graduate of Princeton Theological Seminary. He preached this sermon in a baptist church upon the occasion of 28 members of a Masonic Lodge dying in the recent epidemic in Virginia. A book of his, about his being imprisoned by the Union in the North, has been reprinted by Sprinkle Publications. . Breed, William P. – II. ‘The Great Plague’ in Under the Oak (Philadelphia: Presbyterian Board of Publication, 1866), pp. 19-85 ‘Under the oak’ refers to Rev. Breed (1816-1889) sitting and talking with children on Sabbath afternoons under an oak. This story is for children, but contains much spiritual help on the topic. “A good many years ago, in a town in India, a hundred miles north of Calcutta, a man suddenly fell sick…</p></blockquote>

<blockquote><p>91. For the national synod ought to declare, and that with [the] greatest reverence, to the Magistrate the grounds of their sentence, and the reasons of their proceedings when he demands or enquires into the same, and desires to be satisfied: but if the Magistrate nevertheless do dissent, or cannot by contrary reasons (which may be brought, if he please) move the synod to alter their judgement, yet may he require and procure that the matter be again debated and canvassed in another national synod…</p></blockquote>

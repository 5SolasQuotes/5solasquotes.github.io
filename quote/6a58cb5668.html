<main class="wrap"><figure class="quote" id="q-6a58cb5668" data-kw="">
<blockquote><p>…judge now whether all the ill effects have come from one extreme [side of the parties, and not the other]. The truth is, having impartially observed the mischiefs of the age in which I have lived, I have found that both the extremes have been the chief causes and the peacemakers both the most understanding and the most innocent; and the nearer any of the several parties have come to them, the more innocent they have been. It is not mere episcopacy or liturgies that have done the mischief, for such excellent men as Cranmer, Ridley, Hooper, Farrar, Parker, Jewel, Grindal, Davenant, Ussher, etc. could use both profitably. It’s not mere presbytery, for such as Calvin, Beza, Daneau, Sadeel, Rivet, Chamier, Daille, Blondel have been excellent lights in the Church. It is not mere Independency, for Ramus, Ames, Henry Jacob, Jeremiah Burroughs and many others of that mind have been excellent, peaceable men. It is not mere Anabaptistry [baptists], for there have been many peaceable worthy men against infant baptism (and some bishops thought it not of divine institution); and when they were rebaptized, continued in love and communion with others. But it is proud ignorance and lack of Christian love causing excommunicating, persecuting, Separation or schism in some, and withdrawing censorious Separation in others, who (neither party) understand the truth nor ever loved their neighbors as themselves, nor learned to do as they would be done by. The worldly PR. IGs.¹ and the unruly PR. IGs. by persecution and by causeless Separation and alienation have done the hurt. ¹ [This may likely mean “Proud Ignorants”, as a contemporary critic of Baxter, who was unsure, so inferred… This is confirmed by Baxter’s anti-party spirit and morally adjudged perspective in the immediate context. Another option is “Presbyterians and Independents” as “G” may stand for “Gatherers”, as Independents were sometimes called; yet much of the persecution was done by bishops, prelates and Formalists, as Baxter notes, so this alternative seems less likely. Baxter though may have meant both, or left his meaning ambiguous so as not to be able to be blamed for it by the named parties (note that he was reckoned an Independent by some, though he called himself a presbyterian at times). It is not to be missed that the abbreviations spell “prigs”, which word was current in that era with its current meaning.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), pp. 59-60</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-64968dc87b" data-kw="">
<blockquote><p>3. It is strange divinity, ‘That that which is no sin, of itself, cannot be omitted without sin for the sole will and pleasure of men.’ [As the prelates argued] Human authority then may make it sin not to rub our beards, not to claw our heads, when we come to the Church to hear God’s Word. If human authority can make an indifferent act lawful, and the omission of it, sinful, [then] they may make all the indifferent acts in the world lawful acts; they might then make piping, leaping, laughing, acts of divine worship, and might make a Decalogue of their own: And if they may make an indifferent act to be sin, if it be omitted, they may by as good reason make sinful acts, as adultery, incest, murder, robbery, to be lawful acts; For if man’s inhibiting will be the formal reason of sin, then his commanding will must be the formal reason of obedience: And so rulers might command murder, robbery, incest, blasphemy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p. 652</span></figcaption>

<blockquote><p>As for the Love-feasts used in the primitive Church: 1. They had no religious state in divine worship, but were used only as moral signs of mutual charity. The Rhemists [Romanists] will have them called Coenas dominicas. But what-says Cartwright against them? ‘We grant that there were such feasts used in times past, but they were called by the name of [Greek] or Love-feasts, not by the name of the Lord’s Supper: neither could one without sacrilege give so holy a name to a common feast, which never had ground out of the Word, and which after for just cause was thrust out by the Word of God.’ 2. If it be thought, that they were used as sacred signs of Christian charity, because they were eaten in the Church. I answer, the eating of them in the Church is forbidden by the apostle. ‘What?’ says he, ‘have ye not houses to eat and to drink in?’ or despise ye the Church of God? Aperte vetat, says [David] Pareus: commessationes in Ecclesia, quocunque fueo pingantur. Vocabant [Greek] charitates: sed nihil minus erant. Erant schismatum fomenta. Singulae enim sectae suas instituebant. And a little after: Aliquae Ecclesiae obtemperasse videntur. Nam Iustini temporibus Romana Ecclesia [Greek] non habuit. (Commentary in that place)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 5, p. 90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>This language of ‘authentic’ [WCF 1.8] arose on account of the Roman Catholic assertion that the Latin Vulgate was the authentic standard by which the church should be appealing as authoritative. This was codified by the papists at the Council of Trent… Therefore, the Reformers were required to state unequivocally that the authoritative or authentic Scripture was that in the original Greek and Hebrew Scriptures and not the Latin translation…. It is clear, then, that our own Confession is not using the term “authentic” void of meaning. It is a reference to that which has final authority in matters of religious controversy and to that which the church should appeal. But notice again, it is not a printed text that is the appeal. It is to the original languages of the Hebrew and Greek. Therefore, “authentic” in §1.8 does not have historical connection to a particular printed text… Like Turretin, Owen is speaking of the manuscript tradition of copies rather than a collated, edited, and printed edition of the Greek New Testament.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“This language of ‘authentic’ [WCF 1.8] arose on account of the Roman Catholic assertion that the Latin Vulgate was the authentic standard by which the church should be appealing as authoritative. This was codified by the papists at the Council of Trent… Therefore, the Reformers were required to state unequivocally that the authoritative or authentic Scripture was that in the original Greek and Hebrew Scriptures and not the Latin translation…. It is clear, then, that our own Confession is not using the term “authentic” void of meaning. It is a reference to that which has final authority in matters of religious controversy and to that which the church should appeal. But notice again, it is not a printed text that is the appeal. It is to the original languages of the Hebrew and Greek. Therefore, “authentic” in §1.8 does not have historical connection to a particular printed text… Like Turretin, Owen is speaking of the manuscript tradition of copies rather than a collated, edited, and printed edition of the Greek New Testament.”

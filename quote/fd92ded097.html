<main class="wrap"><figure class="quote" id="q-fd92ded097" data-kw="Assurance|Election|Holy Spirit" data-pol="">
<blockquote><p>When the Holy Ghost sealeth a man up, the thing he makes known, the thing he sealeth to him is this, that he is in Christ, that he hath been elected in Christ by God the Father from everlasting, that he is one in Christ; he was one with him from everlasting, he was one with him when he hung upon the cross, he is one with him now in heaven.</p></blockquote>
<figcaption>— <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a>, <cite>An Exposition of the First Chapter of Ephesians (Works, vol. 1)</cite>, Sermon XVI (Eph. 1:13)</figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a469aee8d1" data-kw="Faith" data-pol="">
<blockquote><p>It is a REAL union. Such is our weakness in our present state, so much are we sunk in sin, that in our mind, we are prone to suspect spiritual realities to be only a fiction. But nothing is more real than what is spiritual: as approaching nearest to the nature of him who is the fountain of all reality, namely, God himself. We do not see with our eyes the union between our own soul and body; neither can we represent it to ourselves truly, by imagination, as we do sensible things: yet the reality of it is not to be doubted. Faith is no fancy—but &quot;the substance of things hoped for,&quot; Heb. 11:1. Neither is the union thereby made between Christ and believers imaginary—but most real: &quot;For we are members of his body, of his flesh, and of his bones,&quot; Eph. 5:30.</p></blockquote>
<figcaption>— <a href="../authors/thomas-boston.html">Thomas Boston</a>, <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” general observations (2)</figcaption>

</figure><figure class="quote" id="q-acc274196c" data-kw="Sanctification|Holy Spirit" data-pol="">
<blockquote><p>True sanctification is the result of the soul&#x27;s union with the holy Jesus, the first and immediate receptacle of the sanctifying Spirit; out of whose fullness, his members do, by virtue of their union with him, receive sanctifying influences. The other is the mere product of the man&#x27;s own spirit, which, whatever it has, or seems to have, of the matter of true holiness—yet does not arise from the supernatural principles, nor to the high aims and ends thereof: for, as it comes from self, so it runs out into the dead sea of self again; and lies as wide of true holiness, as nature does of grace. They who have this species of holiness, are like common boatmen, who serve themselves with their own oars: whereas the ship bound for Immanuel&#x27;s land, sails by the blowings of the divine Spirit.</p></blockquote>
<figcaption>— <a href="../authors/thomas-boston.html">Thomas Boston</a>, <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” V. Benefits: Sanctification</figcaption>

</figure><figure class="quote" id="q-6e0adc620a" data-kw="Love|Wisdom|Election" data-pol="">
<blockquote><p>That the great God purposed and designed an union with himself of those whom in a special manner he had set himself to love; and that this union is the deepest and furthest design of his heart, of any he hath toward them, or the whole creation. The full demonstration of his manifold wisdom and power moved him to make a variety of persons, things, yea, of worlds; but then his goodness and his love moved him to reduce out of that variety an all out of every sort, as a pledge of his respect to all, unto an unity again, and that with himself; and this union is the top perfection of all his works, as that, John 17:23, ‘I in them, and they in me, that they may be made perfect in one.’ It is the perfection of the creature, whereof the unity of the three Persons is the pattern, and the perfection of God’s design.</p></blockquote>
<figcaption>— <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a>, <cite>An Exposition of the First Chapter of Ephesians (Works, vol. 1)</cite>, Sermon X (Eph. 1:10)</figcaption>

</figure><figure class="quote" id="q-a0c02fe67f" data-kw="Communion|Faith|Submission" data-pol="">
<blockquote><p>On the part of the saints, it is their free, willing consent to receive, embrace, and submit to the Lord Jesus, as their husband, Lord, and Saviour—to abide with him, subject their souls to him, and to be ruled by him for ever.</p></blockquote>
<figcaption>— <a href="../authors/john-owen.html">John Owen</a>, <cite>Communion with God</cite>, Part 2, ch. 3, “We Freely Embrace Him”</figcaption>

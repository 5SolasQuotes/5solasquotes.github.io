<main class="wrap"><figure class="quote" id="q-6f12ebe81a" data-kw="">
<blockquote><p>First, in general, that God is perfect and perfectly blessed, I suppose will not be denied; it cannot be but by denying that He is God. He that is not perfect in Himself and perfectly blessed is not God. To that which is perfect in any kind nothing is wanting in that kind. To that which is absolutely perfect nothing is wanting at all. He who is blessed is perfectly satisfied and filled, and has no farther desire for supply. He who is blessed in Himself is all-sufficient for Himself. If God want or desire any thing for Himself, He is neither perfect nor blessed. To ascribe, then, affections to God properly [as his Socinian opponent does]… is to deprive Him of his perfection and blessedness. 1. Affections, considered in themselves, have always an incomplete, imperfect act of the will or volition joined with them. They are something that lies between the firm purpose of the soul and the execution of that purpose.^ The proper actings of affections lie between these two ; that is, in an incomplete, tumultuary volition. That God is not obnoxious to such volitions and incomplete actings of the will, besides the general consideration of his perfections and blessedness premised, is evident from that manner of procedure which is ascribed to him. His purposes and his works comprise all his actings. As the Lord hath purposed, so hath he done. ‘He worketh all things after the counsel of his own will.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ch. 4, ‘Of the Attribution of Passions &amp; Affections, Anger, Fear, Repentance unto God’ of Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined in Works, vol. 12</cite>, p. 109</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-33ef8d9b22" data-kw="">
<blockquote><p>For if a lord also is not so called unless when he begins to have a slave, that appellation likewise is relative and in time to God; for the creature is not from all eternity, of which He is the Lord. How then shall we make it good that relative terms themselves are not accidental, since nothing happens accidentally to God in time, because He is incapable of change, as we have argued in the beginning of this discussion? Behold! To be the Lord is not eternal to God; otherwise we should be compelled to say that the creature also is from eternity, since He would not be a lord from all eternity unless the creature also was a servant from all eternity… Certainly to be the Lord of man happened to God in time. And that all dispute may seem to be taken away, certainly to be your Lord, or mine, who have only lately begun to be, happened to God in time. How then shall we make it good that nothing is said of God according to accident, except because nothing happens to His nature by which He may be changed, so that those things are relative accidents which happen in connection with some change of the things of which they are spoken. As a friend is so called relatively… how much more easily ought we to admit, concerning that unchangeable substance of God, that something may be so predicated relatively in respect to the creature, that although it begin to be so predicated in time, yet nothing shall be understood to have happened to the substance itself of God, but only to that creature in respect to which it is predicated? Lord, it is said, ‘You have been made our refuge.’ God, therefore, is said to be our refuge relatively, for He is referred to us, and He then becomes our refuge when we flee to Him; pray does anything come to pass then in His nature, which, before we fled to Him, was not? In us therefore some change does take place; for we were worse before we fled to Him, and we become better by fleeing to Him: but in Him there is no change… Therefore that which begins to be spoken of God in time, and which was not spoken of Him before, is manifestly spoken of Him relatively; yet not according to any accident of God, so that anything should have happened to Him, but clearly according to some accident of that [thing or person], in respect to which God begins to be called something relatively… that what is said may be said in that way in which it can be comprehended by human affections. So also, when He is said to be angry with the unrighteous, and gentle with the good, they are changed, not He: just as the light is troublesome to weak eyes, pleasant to those that are strong; namely, by their change, not its own.</p></blockquote>

</figure><figure class="quote" id="q-c2a28cfe76" data-kw="">
<blockquote><p>Of love, mercy, and grace, the condition is something otherwise: principally they denote God’s essential goodness and kindness, which is eminent amongst his infinite perfections; and secondarily the effects thereof… The apostle tells us that God is “blessed forever,” Rom. 9:5; “He is the blessed and only Potentate,” 1 Tim. 6:15; ‘God all-sufficient’ Gen. 17:1. That which is inconsistent with absolute blessedness and all-sufficiency is not to be ascribed to God; to do so casts him down from his excellency. But can He be blessed, is He all-sufficient who is tossed up and down with hope, joy, fear, sorrow, repentance, anger, and the like?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ch. 4, ‘Of the Attribution of Passions &amp; Affections, Anger, Fear, Repentance unto God’ of Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined in Works, vol. 12, pp. 111-12, 114-5</cite>, pp. 114-5</span></figcaption>

</figure><figure class="quote" id="q-5f2f93fce0" data-kw="">
<blockquote><p>We must needs assert that in God there is love: because love is the first movement of the will and of every appetitive faculty. For since the acts of the will and of every appetitive faculty tend towards good and evil, as to their proper objects: and since good is essentially and especially the object of the will and the appetite, whereas evil is only the object secondarily and indirectly, as opposed to good; it follows that the acts of the will and appetite that regard good must naturally be prior to those that regard evil; thus, for instance, joy is prior to sorrow, love to hate: because what exists of itself is always prior to that which exists through another. Again, the more universal is naturally prior to what is less so. Hence the intellect is first directed to universal truth; and in the second place to particular and special truths. Now there are certain acts of the will and appetite that regard good under some special condition, as joy and delight regard good present and possessed; whereas desire and hope regard good not as yet possessed. Love, however, regards good universally, whether possessed or not. Hence love is naturally the first act of the will and appetite; for which reason all the other appetite movements presuppose love, as their root and origin. For nobody desires anything nor rejoices in anything, except as a good that is loved: nor is anything an object of hate except as opposed to the object of love. Similarly, it is clear that sorrow, and other things like to it, must be referred to love as to their first principle. Hence, in whomsoever there is will and appetite, there must also be love: since if the first is wanting, all that follows is also wanting. Now it has been shown that will is in God (Q[19], A[1]), and hence we must attribute love to Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa (d. 1274), pt. 1, quest. 20, art. 1, I answer that</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“We must needs assert that in God there is love: because love is the first movement of the will and of every appetitive faculty. For since the acts of the will and of every appetitive faculty tend towards good and evil, as to their proper objects: and since good is essentially and especially the object of the will and the appetite, whereas evil is only the object secondarily and indirectly, as opposed to good; it follows that the acts of the will and appetite that regard good must naturally be prior to those that regard evil; thus, for instance, joy is prior to sorrow, love to hate: because what exists of itself is always prior to that which exists through another. Again, the more universal is naturally prior to what is less so. Hence the intellect is first directed to universal truth; and in the second place to particular and special truths. Now there are certain acts of the will and appetite that regard good under some special condition, as joy and delight regard good present and possessed; whereas desire and hope regard good not as yet possessed. Love, however, regards good universally, whether possessed or not. Hence love is naturally the first act of the will and appetite; for which reason all the other appetite movements presuppose love, as their root and origin. For nobody desires anything nor rejoices in anything, except as a good that is loved: nor is anything an object of hate except as opposed to the object of love. Similarly, it is clear that sorrow, and other things like to it, must be referred to love as to their first principle. Hence, in whomsoever there is will and appetite, there must also be love: since if the first is wanting, all that follows is also wanting. Now it has been shown that will is in God (Q[19], A[1]), and hence we must attribute love to Him.”

— Thomas Aquinas, Summa (d. 1274), pt. 1, quest. 20, art. 1, I answer that">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+must+needs+assert+that+in+God+there+is+love%3A+because+love+is+the+first+movement+of+the+will+and+of+every+appetitive+faculty.+For+since+the+acts+of+the+will+and+of+every+appetitive+faculty+tend+towards+good+and+evil%2C+as+to+their+proper+objects%3A+and+since+good+is+essentially+and+especially+the+object+of+the+will+and+the+appetite%2C+whereas+evil+is+only+the+object+secondarily+and+indirectly%2C+as+opposed+to+good%3B+it+follows+that+the+acts+of+the+will+and+appetite+that+regard+good+must+naturally+be+prior+to+those+that+regard+evil%3B+thus%2C+for+instance%2C+joy+is+prior+to+sorrow%2C+love+to+hate%3A+because+what+exists+of+itself+is+always+prior+to+that+which+exists+through+another.+Again%2C+the+more+universal+is+naturally+prior+to+what+is+less+so.+Hence+the+intellect+is+first+directed+to+universal+truth%3B+and+in+the+second+place+to+particular+and+special+truths.+Now+there+are+certain+acts+of+the+will+and+appetite+that+regard+good+under+some+special+condition%2C+as+joy+and+delight+regard+good+present+and+possessed%3B+whereas+desire+and+hope+regard+good+not+as+yet+possessed.+Love%2C+however%2C+regards+good+universally%2C+whether+possessed+or+not.+Hence+love+is+naturally+the+first+act+of+the+will+and+appetite%3B+for+which+reason+all+the+other+appetite+movements+presuppose+love%2C+as+their+root+and+origin.+For+nobody+desires+anything+nor+rejoices+in+anything%2C+except+as+a+good+that+is+loved%3A+nor+is+anything+an+object+of+hate+except+as+opposed+to+the+object+of+love.+Similarly%2C+it+is+clear+that+sorrow%2C+and+other+things+like+to+it%2C+must+be+referred+to+love+as+to+their+first+principle.+Hence%2C+in+whomsoever+there+is+will+and+appetite%2C+there+must+also+be+love%3A+since+if+the+first+is+wanting%2C+all+that+follows+is+also+wanting.+Now+it+has+been+shown+that+will+is+in+God+%28Q%5B19%5D%2C+A%5B1%5D%29%2C+and+hence <blockquote><p>To the love of God belong what may be called his desires or wishes, etc. Now it is the absence of good which excites desire; but since God enjoys all good, it is plain that desire cannot properly apply to Him; yet it is frequently attributed to Him in scripture, and to this may be referred all those passages in which God is introduced speaking to this effect: “O that my people had hearkened unto me.” (Ps. 81:14; Isa. 48:14; Lk. 19:42) Therefore this desire in God denotes, that man’s obedience is highly pleasing to him, and that He will not pass it by unrewarded; at the same time it points out man’s duty, and his great wickedness in not discharging this duty. To this desire is opposed aversion, by which God is said to loathe sin, and to have no pleasure in the destruction of the creature. From what has been said, we clearly see what ideas we ought to have of the hope of God, of his joy, sorrow, jealousy, etc. Hope or expectation in God, intimates that the thing is due to Him. Thus when He said that He “looked that his vineyard should bring forth grapes,” (Isa. 5:2) He meant that the vineyard owed him fruit, and could not be fruitless without sin. God is said to rejoice when anything is pleasing to Him; and also when He performs anything which displays his glory, as when He does good to his people, or when He punishes the rebellious and ungodly. (Deut. 28:63; 30:9)</p></blockquote>

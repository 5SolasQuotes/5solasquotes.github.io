<main class="wrap"><figure class="quote" id="q-b610d4c24a" data-kw="">
<blockquote><p>Answer: 1. Some parcels of these epistles are written to Timothy and Titus as evangelists, such as none may now do but they only (2 Tim. 4:4; Tit. 1:3; 2 Tim. 1:5) and some other things which they gave in charge to elders. 2. Some things are written to them as Christians, as 1 Tim. 1:19; Tit. 3:3 and finaliter, or objectively, all is written for the Church’s good; but 3. the bulk of the epistle is written to them as elders, and is a rule of perpetual government, and especially, 1 Tim. 5:22; 2 Tim. 2:2, for these and the like they were to do with the presbytery, as is clear, 1 Tim. 4:14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644) | Part 1, p. 483</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“Answer: 1. Some parcels of these epistles are written to Timothy and Titus as evangelists, such as none may now do but they only (2 Tim. 4:4; Tit. 1:3; 2 Tim. 1:5) and some other things which they gave in charge to elders. 2. Some things are written to them as Christians, as 1 Tim. 1:19; Tit. 3:3 and finaliter, or objectively, all is written for the Church’s good; but 3. the bulk of the epistle is written to them as elders, and is a rule of perpetual government, and especially, 1 Tim. 5:22; 2 Tim. 2:2, for these and the like they were to do with the presbytery, as is clear, 1 Tim. 4:14.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-32882f1932" data-kw="">
<blockquote><p>The reason why it is believed, that regeneration does not usually accompany baptism, is simply because no evidences of spiritual life appear in baptized children more than in those which remain unbaptized. The education of children should proceed on the principle that they are in an unregenerate state, until evidences of piety clearly appear, in which case, they should be sedulously cherished and nurtured. These are Christ’s lambs — ” little ones, who believe in Him” whom none should offend or mislead upon the peril of a terrible punishment. But though the religious education of children should proceed on the ground that they are destitute of grace, it ought ever to be used as a means of grace. Every lesson, therefore, should be accompanied with the lifting up of the heart of the instructer to God for a blessing on the means. “Sanctify them through thy truth; thy word is truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-a-alexander.html">Archibald A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience</cite>, (Philadelphia: Presbyterian Board of Publication, 1841), pp. 26-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>3. We are much in the dark concerning the degree of infants’ glory: And therefore we can as little know what degree of grace is necessary to prepare them for their glory. 4. It is certain that infants before they are glorified, shall have all that grace that is prerequisite to their preparation and fruition.</p></blockquote>

</figure><figure class="quote" id="q-16e4b882f4" data-kw="">
<blockquote><p>2. To preach publicly as ordinary messengers, I say ‘ordinary’ because of our expectants of the ministry, who preach by the call of the Church for a time, as the sons of the prophets, while they be ordained pastors [in the time that they are in the process of being or becoming ordained]. To preach, I say, ‘publicly’, is a formal act of pastors who are sent, Rom. 10.</p></blockquote>

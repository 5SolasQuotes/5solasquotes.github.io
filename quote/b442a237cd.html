<main class="wrap"><figure class="quote" id="q-b442a237cd" data-kw="">
<blockquote><p>Having proved it is a Covenant, all the difficulty remaineth in declaring what Covenant it is; for here is much difference of judgements, even with the Learned and Orthodox: and this doth arise from the different places of the Scripture, which, although they be not contrary one to another, yet the weakness of our understandings is many times overmastered by some places:

Some (as you have heard) make it a Covenant of works, others a mixt Covenant, some a subservient Covenant; but I am persuaded to go with those who hold it to be a Covenant of grace: and indeed, it is very easy to bring strong arguments for the affirmative; but then there will be some difficulty to answer such places as are brought for the negative; and if the affirmative prove true, the dignity and excellency of the Law will appear the more. Now, before I come to the arguments, which induce me hereunto, consider in what sense it may be explained, that it is a Covenant of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis, or, A Vindication of the Moral Law and the Covenants, from the Errors of Papists, Arminians, Socinians, and more especially, Antinomians</cite>, (London, 1647), pp 231-32.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/ceremonial-law.html">Ceremonial Law</a></span></div>

Some (as you have heard) make it a Covenant of works, others a mixt Covenant, some a subservient Covenant; but I am persuaded to go with those who hold it to be a Covenant of grace: and indeed, it is very easy to bring strong arguments for the affirmative; but then there will be some difficulty to answer such places as are brought for the negative; and if the affirmative prove true, the dignity and excellency of the Law will appear the more. Now, before I come to the arguments, which induce me hereunto, consider in what sense it may be explained, that it is a Covenant of grace.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4fd2805867" data-kw="">

</figure><figure class="quote" id="q-2699ea0f28" data-kw="">
<blockquote><p>Under this [Mosaic] Covenant, the natural seed of Abraham bore the face of the Church and state, and God had promised abundance of temporals, and of spiritual, a scantling; But all under the outward administration of the Covenant were not in like manner partakers of the blessings promised in Covenant. For some had their part in temporal blessings only, and the outward ordinances; others were partakers of the spiritual blessings promised. But whatever good thing any of them enjoyed either temporal or spiritual, it was conferred upon them freely according to the Covenant of Grace, and not for the dignity of their works. It is true, the promise is conditional, if they obey, they shall reap the good things of the Land: but obedience was not a causal condition, why they should inherit the Land… So that herein there appears no intexture of the Covenant of works with the Covenant of Grace, nor any moderation of the Law to the strength and power of nature for the obtaining of outward blessings. But rather that God out of his abundant goodness is pleased freely to confer outward blessings promised in the Covenant upon some that did not cleave to him unfeignedly [purely], that he might make good his promise unto the spiritual seed, which by word and oath he had confirmed unto the Fathers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Reformed Books Online</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Was the Israelites’ Inheriting the Land by Grace</cite>, John Ball, A Treatise of the Covenant of Grace (London: Miller, 1645), p.142 This work was very influential upon the Westminster Assembly.</span></figcaption>

</figure><figure class="quote" id="q-db33a0351c" data-kw="">
<blockquote><p>The Sinai covenant-administration was no bargain for sinners, and I pity the poor Israelites who suffered under its administration, just as I understand perfectly well why seventy-three (nearly half) of their psalms were laments. I would have resisted this covenant also, had I been there, because such a legal covenant, whose conditions require strict obedience (and threaten severe curse-sanctions), is bound to fail if one of the parties to it is a sinful people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/t-david-gordon.html">T. David Gordon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law is Not of Faith</cite>, (2009), p. 251</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/ceremonial-law.html">Ceremonial Law</a></span></div>

<main class="wrap"><figure class="quote" id="q-fbb0deff39" data-kw="">
<blockquote><p>I. Repentance unto life is an evangelical gracea… a. Zec 12:10; Acts 11:18 II. By it a sinner… upon the apprehension of his mercy in Christ to such as are penitent, so grieves for and hates his sins as to turn from them all unto God,a purposing and endeavoring to walk with him in all the ways of his commandments.b a. Ps 51:4; 119:128; Isa 30:22; Jer 31:18-19; Ezek 18:30-31; 36:31; Joel 2:12-13; Amos 5:15; 2 Cor 7:11 b. 2 Kings 23:25; Psa 119:6, 59, 106; Luke 1:6 III. Although repentance be not to be rested in as any satisfaction for sin, or any cause of the pardon thereof,a which is the act of God’s free grace in Christ;b yet is it of such necessity to all sinners that none may expect pardon without it.c a. Eze 16:61-63; 36:31-32 b. Hos 14:2, 4; Rom 3:24; Eph 1:7 c. Luke 13:3, 5; Acts 17:30-31“ . . Articles 1600’s Davenant, John – section 5 in ch. 31, ‘Of the Necessity of Works to Salvation, or Justification’ in A Treatise on Justification: or The Disputatio de justitia habituali et actuali…, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), pp. 299-300 Note that what Davenant says here is substantially the same as what Owen says below, with a bit of difference of some terminology. Davenant would have done better to, instead of using the term “good works” in this context, to use “a certain inherent righteousness,” similar to Goodwin below. Davenant here denies that works are efficient or meritorious causes of justification. Yet he affirms that certain inward works, or a certain inherent righteousness, is necessary as concurrent or preliminary conditions to justification, which accompany it, by way of order, not of causality; and these things “He Himself effects in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith</cite>, ch. 15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eb42c02a7a" data-kw="">
<blockquote><p>Whether of these goes before, faith or repentance? Whereas we have said before that repentance is sometimes used by a synecdoche for that which they call contrition, and have showed that contrition is legal or evangelical, we have placed faith as it were in the middle, between the former of those sorrows which comes of the acknowledgement of our sins and the accusations of the conscience, or which proceeds from the Law, and the latter, which proceeds from the Gospel, for godly sorrow is an effect of faith as well as joy and gladness of conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion… (London: Snowdon, 1606), 30th Place, ‘Of Repentance…’, ‘Whether of these goes before, faith or repentance?’</cite>, p. 313</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-7ebe102409" data-kw="">
<blockquote><p>…the doubt touching the precedency of faith and repentance may be easily determined. For if faith be taken largely or generally for a belief of the promise, if we repent and receive it, then faith is before repentance: for there can be no turning without hope of pardon, nor coming home by hearty sorrow, without some expectation of mercy [see WCF 15.2 &amp; WSC 87]. Thus the exhortations run, ‘Turn unto the Lord, for He is merciful and gracious.’ ‘Repent, for the Kingdom of God is at hand.’ But if faith be taken more strictly, for that faith or belief whereby we receive, embrace, or rest upon the promise of God in Christ Jesus for pardon and forgiveness, then repentance goes before pardon: for no remission is promised to be enjoyed but upon condition of repentance… If repentance be necessary to Justification, of necessity it must go before justifying faith; because faith and justification are immediately coupled together. It is impossible to come unto Christ without repentance… Coming unto Christ is a lively motion of the soul, wherein arising from sin, it draws nigh or approaches unto Christ, that in Him it might be satisfied. The motion is one, but the points are two. For in drawing nigh unto Christ, the soul arises from sin: which may be called repentance.</p></blockquote>

<blockquote><p>2nd Problem: Whether faith precedes regeneration, at least repentance? Response: The former is denied; the latter is affirmed concerning faith in the first act, which in the order of nature precedes repentance considered both in the first act and in the second act. But it is denied concerning faith in the second act, at least the complete or formed second act. For such faith is necessarily preceded in the order of nature and of time by certain acts of repentance. This distinction observed will contribute not a little to reconciling the dogmatic and practical theologians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

— Gisbertus Voetius, Disputation 29, ‘On Regeneration’, pt. 1 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2nd+Problem%3A+Whether+faith+precedes+regeneration%2C+at+least+repentance%3F+Response%3A+The+former+is+denied%3B+the+latter+is+affirmed+concerning+faith+in+the+first+act%2C+which+in+the+order+of+nature+precedes+repentance+considered+both+in+the+first+act+and+in+the+second+act.+But+it+is+denied+concerning+faith+in+the+second+act%2C+at+least+the+complete+or+formed+second+act.+For+such+faith+is+necessarily+preceded+in+the+order+of+nature+and+of+time+by+certain+acts+of+repentance.+This+distinction+observed+will+contribute+not+a+little+to+reconciling+the+dogmatic+and+practical+theologians.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Disputation+29%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+1+%281639%29+tr.+AI+by+Roman+Prestarri+in+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+pp.+432-65+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0317e4973b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0317e4973b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relation-of-repentance-to-saving-faith-justification/#:~:text=2nd%20Problem%3A%20Whether%20faith%20precedes%20regeneration,reconciling%20the%20dogmatic%20and%20practical%20theologians&amp;text=2nd%20Problem%3A%20Whether%20faith%20precedes%20regeneration%2C%20at%20least&amp;text=little%20to%20reconciling%20the%20dogmatic%20and%20practical%20theologians" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0c51fe25c0" data-kw="">
<blockquote><p>Objection [of Papists]: But the minister may mistake the matter [in assuring a person of salvation]. Answer: True, if he speak absolutely, but if he speak upon condition of faith and true repentance he may thereupon assure a man of salvation: he may say, ‘Believe thou and repent truly, and thou shalt be saved.’ If a king should publish and make known that whosoever of such a city shall come and do such a thing, shall be thus or thus rewarded, and give charge to some to make it known to that city, shall we say that any having authority to publish the king’s pleasure, does mistake the matter in so doing, or that any of that place, to whom it should be said, go thou and do that which the king has appointed, and he thereupon going, and doing the thing appointed, does presume to take on him to know more than he ought touching the king’s pleasure? Surely no.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-elton.html">Edward Elton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians (London: Griffin, 1615), on Col. 2:18</cite>, p. 704</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Objection [of Papists]: But the minister may mistake the matter [in assuring a person of salvation]. Answer: True, if he speak absolutely, but if he speak upon condition of faith and true repentance he may thereupon assure a man of salvation: he may say, ‘Believe thou and repent truly, and thou shalt be saved.’ If a king should publish and make known that whosoever of such a city shall come and do such a thing, shall be thus or thus rewarded, and give charge to some to make it known to that city, shall we say that any having authority to publish the king’s pleasure, does mistake the matter in so doing, or that any of that place, to whom it should be said, go thou and do that which the king has appointed, and he thereupon going, and doing the thing appointed, does presume to take on him to know more than he ought touching the king’s pleasure? Surely no.”

— Edward Elton, An Exposition of the Epistle of St. Paul to the Colossians (London: Griffin, 1615), on Col. 2:18, p. 704">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObjection+%5Bof+Papists%5D%3A+But+the+minister+may+mistake+the+matter+%5Bin+assuring+a+person+of+salvation%5D.+Answer%3A+True%2C+if+he+speak+absolutely%2C+but+if+he+speak+upon+condition+of+faith+and+true+repentance+he+may+thereupon+assure+a+man+of+salvation%3A+he+may+say%2C+%E2%80%98Believe+thou+and+repent+truly%2C+and+thou+shalt+be+saved.%E2%80%99+If+a+king+should+publish+and+make+known+that+whosoever+of+such+a+city+shall+come+and+do+such+a+thing%2C+shall+be+thus+or+thus+rewarded%2C+and+give+charge+to+some+to+make+it+known+to+that+city%2C+shall+we+say+that+any+having+authority+to+publish+the+king%E2%80%99s+pleasure%2C+does+mistake+the+matter+in+so+doing%2C+or+that+any+of+that+place%2C+to+whom+it+should+be+said%2C+go+thou+and+do+that+which+the+king+has+appointed%2C+and+he+thereupon+going%2C+and+doing+the+thing+appointed%2C+does+presume+to+take+on+him+to+know+more+than+he+ought+touching+the+king%E2%80%99s+pleasure%3F+Surely+no.%E2%80%9D%0A%0A%E2%80%94+Edward+Elton%2C+An+Exposition+of+the+Epistle+of+St.+Paul+to+the+Colossians+%28London%3A+Griffin%2C+1615%29%2C+on+Col.+2%3A18%2C+p.+704&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0c51fe25c0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0c51fe25c0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relation-of-repentance-to-saving-faith-justification/#:~:text=Objection%20%5Bof%20Papists%5D%3A%20But%20the%20minister,touching%20the%20king%E2%80%99s%20pleasure%3F%20Surely%20no&amp;text=Objection%20%5Bof%20Papists%5D%3A%20But%20the%20minister%20may%20mistake&amp;text=he%20ought%20touching%20the%20king%E2%80%99s%20pleasure%3F%20Surely%20no" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

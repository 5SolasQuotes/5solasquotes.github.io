<main class="wrap"><figure class="quote" id="q-d930e29336" data-kw="">
<blockquote><p>Lord, though all this be come upon me, yet I will not depart from thee, or deal falsely in thy covenant. I know thou art still the same Jehovah, true, holy, gracious, faithful, all-sufficient; and therefore behold me prostrate before thee, and resolving still to love thee, still to fear thee, still to trust thee; thou art my God still and my portion forever. Though I had nothing left in the world that I could call mine, yet thou Lord alone art enough, yet thou alone art All.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations upon the Book of Job</cite>, (London: Henry Overton, 1644), 1: 190.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fa98faef09" data-kw="">
<blockquote><p>Our Saviour Christ before this prayer gives this commandment: After this manner pray ye: whereby he would not bind those whom he teacheth to pray, unto this set number of words as unto a work done: for that were to babble indeed. And the Apostles themselves, as we may read in their acts, and epistles, often prayed in other words after the delivery and receiving of this form of prayer from our Saviour Christ.

And that which is the strongest proof, Mathew and Luke setting down this Lord’s prayer, do not curiously observe the self same words altogether. But our Saviour Christ in a short example would shew unto his disciples the manner howe to pray, according as his custom was to teach a general doctrine by propounding some particular example, where under the special we are to understand the general.

And therefore in this platform of prayer, his purpose is to shew, [I] how few and small a number of words we must use in prayer, contrary to the vain babbling of the Pharisees &amp; of the Heathen. [II] Who is to be called upon, or to whom we must direct our prayer: [III] with what confidence we must pray: [IV] how and for what causes: [V] what things we are to ask: [VI] in what order: [VII] by what mean: [VIII] and for what end.

And thus are all the principal points, which are required in true prayer, contained in this platform. So that it was both truly and finely said of Austin in an Epistle to Proba, we have liberty in praying to use other words so that we say the same things which this prayer containeth: but we have not liberty to say other, divers or contrary things. And this it is which Mathew saith, cap. 6. v. 9. thus, or after this manner pray ye. And that saying of Christ recorded by S. Luke 11. v. 2. when ye pray, say is all one with this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A substantial and Godly exposition of the prayer commonly called the Lord’s Prayer</cite>, (Cambridge: John Legate, 1598), pp 7-9.</span></figcaption>

<blockquote><p>Oh, all you who know and delight in this King, observe all this. Let it wound your heart; let your soul bleed; and for sorrow let your eyes cry rivers of tears by reason of the fact that this glorious King of His Church is thus despised and scorned. Pray continually for Him (Ps. 72:15) and to Him, that He would reveal Himself to His Church as King before the eyes of the entire world. ‘Give ear, O Shepherd of Israel, Thou that leadest Joseph like a flock; Thou that dwellest between the cherubims, shine forth. Before Ephraim and Benjamin and Manasseh stir up thy strength, and come and save us’ (Ps. 80:1-2).</p></blockquote>

</figure><figure class="quote" id="q-57a4c48970" data-kw="">
<blockquote><p>Note that the Irish Reformed Presbyterian Synod considered the spread of Arminianism and the sectarian errors that resulted from the 1859 Revival in Ulster to be a cause for fasting:

THE Synod of the Reformed Presbyterian Church in Ireland, at its last Annual meeting, appointed Thursday, the 31st January, to be observed as a day of Public Fasting and Humiliation, by the congregations under their care. The following summary of Causes of Fasting were adopted by the Synod:-

The continued opposition of the kingdoms of this world to the high and righteous claims of the Divine Mediator – Slavery among the nations of the earth and more especially in the United States of North America – The continued existence of the power of Popery, and the efforts which are being put forth, in almost all Popish countries, to restore the Man of Sin to his former civil authority and power – The timid and sinful policy of British rulers, with respect to Popery, as is seen in the endowment of the Popish College of Maynooth, of Popish chaplains in the army and navy, jails, poorhouses, and penitentiaries; in printing Popish books for the Roman Catholic soldiers, and in filling up so many of the vacancies in the Irish Bar and Bench with Papists –

The general disregard manifested, by British Statesmen in their legislative acts to the Word of God, and the interests of true religion – A sinful expediency, hedges round from assault the degrading idolatry of India, retains on the statute-book the monstrous dogma of the Erastian and Popish teachers of soul-destroying heresies, and others who are induced to remain neutral and quiescent with respect to the honours of the Redeemer’s Crown – The continued divisions among the churches of the Reformation, and a general refusal on the part of these churches to return to ancient covenanted attainments – The prevalence of lax and erroneous views with respect to the doctrine, worship, discipline, and government of the church – The recent extensive spread of Arminian errors, and the tendency to sectarianism and extravagancy, on the part of many who profess to have experienced Divine illumination.

As regards our own church, we have to lament the want to unity among the several branches of the Reformed Presbyterian Church. Lukewarmness, illiberality, and a low state of spirituality, on the part of some, and spiritual pride on the part of others. A tendency, in some quarters, to recede from a faithful Scriptural testimony; and a scarcity of gospel labourers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reformed-presbyterian-synod-of-ireland.html">Reformed Presbyterian Synod of Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Causes of fasting’ Covenanter</cite></span></figcaption>

<blockquote><p>A Prayer for the King and Parliament, fit to be used by all good Christians daily in their Houses.

O God, the great Protector and guider of all Kings and Kingdoms, mercifully look with thy favourable eyes of mercy, upon this distressed Kingdom, and so inspire the heart of our Royal King Charles, whom thou hast called to the state and government of this Kingdom, and who through thy mercy, hath taken upon him the same, that he may effect all things to the honour and glory of thy name, and that he may receive the increase of all virtues, wherewith being decently adorned, he may both be able to avoid the monstrousness of vices, as also to come unto thee right gracious: and grant O merciful God, that there may be a true peace, and unity between Him and His Parliament and that thou O God, so inspire him with thy holy spirit, that he may hearken to his Parliament, and be ruled by them in all things that may be for the good of His sacred Person? and for His whole Kingdom[.]

[A]nd with the same holy spirit so inspire the hearts of this Parliament, whom it bath pleased thee to call together from several parts of this Kingdom, for the general good of the same, that they may do nothing but what may be to thy honour and glory, and that they may grow and persevere in all manner of virtue, setting all things in due order for the good of the kingdom; and that thy true Religion may here again be thoroughly settled amongst all men: Thou wouldst O God that none should perish, favourably look upon the souls deceived by devilish deceit of heretical Popish Sectaries and impiety, and remove from their hearts all such foulness, that they may be united to thy holy Church; and that all manner of wars or dissenions amongst thy people may be purged, and that thy servants earnestly craving thy mercy, the cruelty of their enemies be dispersed, thy Church truly settled, our king and Parliament faithfully united, we may evermore praise thee with incessant thankfulness, who livest and reignest one true and living God, world without end, Amen.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5f4e797454" data-kw="">
<blockquote><p>It is no new thing to see men (happy in the greatest attainments of human learning, and blessed with the influences and graces of the Spirit of God while in this militant state, where great fogs of ignorance cloud the understandings of the best) differ in their judgments about sin and duty; since one way of thinking, and an entire harmony of judgments is reserved as a valuable jewel of that crown of glory which shall encircle the happy heads of the Church triumphant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-823f45241a" data-kw="">
<blockquote><p>18. And if the unsoundness, badness or weakness of the pastors and the faultiness of the worship, order or discipline be not so great as to make communion with the church simply unlawful, yet any free man whose edification is greatly hindered by it, and can elsewhere have far greater helps for his salvation and join with a church which walks more conformably to the Christian rule, may lawfully remove himself to such a ministry and church, when it is not to the greater hurt of others than his own good. Especially such whose ignorance, weakness and deadness makes a lively and convincing ministry more needful to their safety and welfare than it is to others: For it is a sin, caeteris paribus [other things being equal], to prefer the worse before the better, and a sin to neglect the best means for our souls which we can lawfully enjoy: And the soul is more precious than to be hazarded or left in sin and darkness for an unnecessary circumstance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Concord</cite>, … (London: Parkhurst, 1691), pt. 2, Question 2, pp. 67-68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-6681570953" data-kw="">
<blockquote><p>Some more zealous than knowing and considerate did aggravate the acceptance of the indulgence to a great height, and ground of separation, and so wrought their enemies’ work for them better than they could do it for themselves: And so that division proved fatal at Bothwell, where they had a fair game, and opportunity to have defeated all their enemies, and brought prelacy down to the dust. It is observable there was this difference in the two appearances: Pentland had love, harmony and sympathy, wanting nothing but men and arms; Bothwell had both, and wanted harmony, but plagued with division.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-388b438a3a" data-kw="">
<blockquote><p>First, for schismatical Churches, that is, such as embrace and profess the common saving faith of the catholic Church; but yet have separated themselves from the outward communion of those particular visible Churches, that sometimes they have been, and should be members of: the cause of such schisms is sometimes pride, discontent, weakness, willfulness, pretended zeal, a factious spirit; always it is Satan’s instigation, and man’s acceptation: whatsoever the cause be, and how great soever the schism be, though they be justly condemned as schismatical, in regard they are rent from the outward fellowship of such visible congregations as they belong unto, yet because they hold correspondency with the catholic Church in matters of saving faith, and accordingly profess the same, they [the schismatics] cannot be denied to be true visible Churches: Such were the Donatists of old, and such are the Brownists at this day…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church… (London: Kyngston, 1631). Randall (1570–1622) was an English puritan. | pt. 2</cite>, Lecture 26; p. 151</span></figcaption>

</figure><figure class="quote" id="q-564f28c69a" data-kw="">
<blockquote><p>She [Wisdom] is studious of ecclesiastical peace: to that end she knows how to distinguish between substantials and ceremonials; nor dares she rent Christ’s seameless coat because the fringe is not every way complete. Between fundamentals and circumstantials, matters Fidei Catholicae, et scientiae theologicae [of the catholic Faith and between theological wisdom], necessary to be believed, and problematically disputed, allowing a latitude of opinion in some things, to those who hold the foundation; in a word, she abhors, as to injure the truth of Christ by error, so to disturb the peace of the Church by schism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathaniel-hardy.html">Nathaniel Hardy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wisdom’s Character &amp; Counterfeit deliniated in Two Sermons… (London: 1656), sermon on James 3:17, p. 14 Hardy (1618–1670) was an English presbyterian minister who turned episcopalian.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

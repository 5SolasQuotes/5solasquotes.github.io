<blockquote><p>We grant in this Question:

1. That private Christians from the common duty of charity, making use of those spiritual gifts which they have received from God for men’s edification, do sometimes convert to the faith those souls which went astray; and bring those who live in the world, out of the Church, unto the body of the Church of Christ. See Jn. 4:29, etc. 1 Cor. 7:16.

2. We do not think that the office of him who preaches the Word, as sent of God and the Church, do confer any efficacy to the Word preached by him; or has any influence upon the soul of him that is converted. For the power of God only, and the Spirit which accompanies the Word preached, does give to the Word preached a virtue and saving efficacy for the conversion and salvation of souls, 1 Cor. 12:11 and 15:10. But we affirm that the Word preached by him who is ordained to an ecclesiastical office, and does by his ecclesiastical office authoritatively preach the Word, is the ordinary means to which God does by the efficacy of his Spirit give assistance for the conversion of those who live in sin out of Church-communion. So that pastors, as pastors, by virtue of their pastoral office are the ordinary means of the conversion of those men who live in the world. This assertion is proved:

1. Because faith is given and first attained by the Word preached, by those who by an ecclesiastical call are sent of God, to the pastoral Office, and by virtue of mission and function preach the Word, whereby faith is wrought in man. See Rom. 10:14-15; 1 Cor. 3:19; Gal. 3:2.

2. Because pastors of Churches by reason of the office they bear, are fathers, who do first beget their children to Christ in the Church; and by the spiritual seed of God, do give spirit and life to those that are dead in sins: See 1 Cor. 4:15; Gal. 4:19; 2 Cor. 2:16.

3. Pastors are enjoined, as an office peculiarly belonging to them, to preach the Word of God with all meekness, mildness, and patience, if perhaps God will give repentance to those who are held captives in the snares of the Devil, 2 Tim. 2:24-26, to open the eyes of those who sit in darkness, and to bring them to the light of the Gospel and of grace, Acts 26:18, to seek lost sheep for the Lord, Eze. 34:4-5, and to bring into captivity to the obedience of Christ those who with high minds exalt themselves against the Word of God, 2 Cor. 10:4-5. We reject therefore the opposite positions of those:

1. Who affirm that the conversion of wicked men is not an effect intended that it should be produced by virtue of the ecclesiastical ministry as a means appointed to that end; and therefore that never any are converted by the pastors of the Church by virtue of any ecclesiastical office but by accident, as they are gifted Christians: affirming that ordinarily the conversion of such as go astray is by such Christians endued with gifts of prophesy. But it is certain from the holy Scripture that the ecclesiastical ministry is appointed by God for this end, as the ordinary means whereby such as are strangers and enemies to God may be reconciled, 2 Cor. 5:20, and brought to Christ, 2 Cor. 11:2-4.

2. Of those who affirm that sincere conversion of men is a certain argument that those by whose preaching the Word they are converted are sent of God, according to that Rom. 10:14-15; Jer. 23:32. But we judge that the sending which the apostle speaks of, Rom. 10:14-15, is a sending to an office in a due order, whether extraordinary or ordinary, ecclesiastically performed; and that it consists not only in conferring gifts, whereby a man is made fit for the ministery, or prophecy, but in conferring authority and conveying ministerial authority; as the Protestants prove by manifest arguments against the Socinians. And although private Christians in the duty of charity, and by reason of gifts wherein they are subservient to God, do convert some from their sins; yet it follows not that they are thus sent, as that they have authority as the ambassadours of Christ in his Name to preach the Word of God authoritatively; because they want [lack] the authoritative mission by the Church of Christ, whereby that ministry in the Church is conferred wherein men as the ambassadors of Christ preach the Word of reconciliation, 1 Tim. 4:14; Tit. 1:5, 9-10; 2 Cor. 5:20. Hence also our Belgic Reformed Churches acknowledge that preaching of the Word by ministers ecclesiastically called, is the ordinary means of men’s repentance and first reconciliation to God: as appears by the ecclesiastical Form of establishing pastors in the ministry of the Church through the whole Netherlands.</p></blockquote>

<blockquote><p>19. But the election of Paul [who was likely unmarried at the time] and such other[s] ought not to move us but that in choosing the ministers of the Church we must follow the doctrine of the same apostle taught us in the epistle unto Timothy, where he will that those which be novices in religion should not be chosen, but they which have a good testimony. But it must be considered that the rules described unto Timothy were given unto men, from whom, seeing other men’s minds be hidden and that they be utterly ignorant what is in them, it behoves that they use the cautions described by the apostle, lest they err in their elections. But God rightly chooses his without those rules (Ps. 7:11; Jer. 11:20; Apoc. 2:23), “For He trieth the reigns and the hearts, and changeth the wills of men at his own pleasure.” Albeit some have said, that Paul in Judaism was of very honest conversation, as he himself testifies unto the Philippians (Phil. 2:6). And in the latter epistle to Timothy he writes that he had served God from his forefathers with a pure conscience. But I hold not with these men. For I will not diminish his fault in persecuting of the Church, seeing Paul did so greatly after a sort reproach himself with the same. Wherefore when I allow of the solution now brought, this comes to mind that the canons which the apostle delivered unto Timothy are not always kept even as touching men. For Ambrose, the Bishop of Milan, when he was yet a novice, and youngling in the faith, was placed in the See of the Church. For he was sent from the emperor to execute the office of Praetor. (Margin Note: The commandments of God so far as sometime one gives place to another) Here the adversaries vaunt against us, that it is lawful sometimes to deal against the holy Scriptures, and that the words of God are not most steadfast. But we must note that the precepts of God sometime have not their own strength, neither in very deed be precepts. For when two precepts meet together so as they cross one another, whereof the one is more excellent than the other, and God would have that chiefly to be done than the other which is of less excellency, and as touching the will of God, inferior, gives place unto the first and has not the [obliging] authority of a commandment [in that situation]: because God would not have it to be done in that place and at that time. Even as Christ taught as touching the drawing of an ox and an ass out of a pit on the Sabboth day (Lk. 14:5). By which means He excused his disciples who had plucked off the ears of the corn on the Sabboth day (Matt 12:1) and had rubbed out the grain. And He often times testified that He would have mercy and not sacrifice. (Ibid., v. 7). The Church of Milan therefore was greatly molested by the Arians: it had need of a bishop and specially of a teacher that should be of great authority. These things were perceived to be in Ambrose. Neither was there any other fit man presented. Whereby that Church was quit from the other precept which was of less excellency, wherein it was commanded to beware of novices, or those which were not fully instructed. And of this matter it seems to be enough to have spoken somewhat by the way.</p></blockquote>

— Peter Martyr Vermigli, Common Places (1583), 4th Part, ch. 1, ‘Of Calling, and Especially unto the Ministry’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C19.+But+the+election+of+Paul+%5Bwho+was+likely+unmarried+at+the+time%5D+and+such+other%5Bs%5D+ought+not+to+move+us+but+that+in+choosing+the+ministers+of+the+Church+we+must+follow+the+doctrine+of+the+same+apostle+taught+us+in+the+epistle+unto+Timothy%2C+where+he+will+that+those+which+be+novices+in+religion+should+not+be+chosen%2C+but+they+which+have+a+good+testimony.+But+it+must+be+considered+that+the+rules+described+unto+Timothy+were+given+unto+men%2C+from+whom%2C+seeing+other+men%E2%80%99s+minds+be+hidden+and+that+they+be+utterly+ignorant+what+is+in+them%2C+it+behoves+that+they+use+the+cautions+described+by+the+apostle%2C+lest+they+err+in+their+elections.+But+God+rightly+chooses+his+without+those+rules+%28Ps.+7%3A11%3B+Jer.+11%3A20%3B+Apoc.+2%3A23%29%2C+%E2%80%9CFor+He+trieth+the+reigns+and+the+hearts%2C+and+changeth+the+wills+of+men+at+his+own+pleasure.%E2%80%9D+Albeit+some+have+said%2C+that+Paul+in+Judaism+was+of+very+honest+conversation%2C+as+he+himself+testifies+unto+the+Philippians+%28Phil.+2%3A6%29.+And+in+the+latter+epistle+to+Timothy+he+writes+that+he+had+served+God+from+his+forefathers+with+a+pure+conscience.+But+I+hold+not+with+these+men.+For+I+will+not+diminish+his+fault+in+persecuting+of+the+Church%2C+seeing+Paul+did+so+greatly+after+a+sort+reproach+himself+with+the+same.+Wherefore+when+I+allow+of+the+solution+now+brought%2C+this+comes+to+mind+that+the+canons+which+the+apostle+delivered+unto+Timothy+are+not+always+kept+even+as+touching+men.+For+Ambrose%2C+the+Bishop+of+Milan%2C+when+he+was+yet+a+novice%2C+and+youngling+in+the+faith%2C+was+placed+in+the+See+of+the+Church.+For+he+was+sent+from+the+emperor+to+execute+the+office+of+Praetor.+%28Margin+Note%3A+The+commandments+of+God+so+far+as+sometime+one+gives+place+to+another%29+Here+the+adversaries+vaunt+against+us%2C+that+it+is+lawful+sometimes+to+deal+against+the+holy+Scriptures%2C+and+that+the+words+of+God+are+not+most+steadfast.+But+we+must+note+that+the+precepts+of+God+sometime+have+not+their+own+strength%2C+neither+in+very+deed+be+precepts.+For+when+two+precepts+meet+together+so+as+they+cross+one+another%2C+whereof+the+one+is+more+excellent+than+the+other%2C+and+God+would+have+that+chiefly+to+be+done+than+the+other+which+is+of+less+excellency%2C+and+as+touching+the+will+of+God%2C+inferior%2C+gives+place+unto+the+first+and+has+not+the+%5Bobliging%5D+authority+of+a+commandment+%5Bin+that+situation%5D%3A+because+God+would+not+have+it+to+be+done+in+that+place+and+at+that+time.+Even+as+Christ+taught+as+touching+the+drawing+of+an+ox+and+an+ass+out+of+a+pit+on+the+Sabboth+day+%28Lk.+14%3A5%29.+By+which+means+He+excused+his+disciples+who+had+plucked+off+the+ears+of+the+corn+on+the+Sabboth+day+%28Matt+12%3A1%29+and+had+rubbed+out+the+grain.+And+He+often+times+testified+that+He+would+have+mercy+and+not+sacrifice.+%28Ibid.%2C+v.+7%29.+The+Church+of+Milan+therefore+was+greatly+molested+by+the+Arians%3A+it+had+need+of+a+bishop+and+specially+of+a+teacher+that+should+be+of+great+authority.+These+things+were+perceived+to+be+in+Ambrose.+Neither+was+there+any+other+fit+man+presented.+Whereby+that+Church+was+quit+from+the+other+precept+which+was+of+less+excellency%2C+wherein+it+was+commanded+to+beware+of+novices%2C+or+those+which+were+not+fully+instructed.+And+of+this+matter+it+seems+to+be+enough+to+have+spoken+somewhat+by+the+way.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+Common+Places+%281583%29%2C+4th+Part%2C+ch.+1%2C+%E2%80%98Of+Calling%2C+and+Especially+unto+the+Ministry%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5be7c41717.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5be7c41717.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/pastors#:~:text=19.%20But%20the%20election%20of%20Paul,have%20spoken%20somewhat%20by%20the%20way&amp;text=19.%20But%20the%20election%20of%20Paul%20%5Bwho%20was&amp;text=enough%20to%20have%20spoken%20somewhat%20by%20the%20way" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-07f8ba90e2" data-kw="">
<blockquote><p>XII. As an instrument, He uses his word (Rom. 10:16), and that of both the Law and the Gospel, in different ways: by the former, indeed, preparing the way for the efficacy of vocation (Gal. 3:24), and by the latter, perfecting the same in the called (Rom. 1:16).

XIII. This is also sometimes extraordinary, and God acts beyond the accustomed manner, so that what He is accustomed to effect together with the Word, He produces without its help or assistance, administering the matter by the revelation and efficacy of his Spirit alone (Acts 9:3-6).</p></blockquote>

</figure><figure class="quote" id="q-537ce0a611" data-kw="">
<blockquote><p>Where such sins are made the condition of ministration by men in power, as that all the whole ministry of a kingdom are bound in conscience to deny consent and conformity thereto [such as in 1662 in England], it is the duty of all the ministry in primo instante [‘in the first instance’], to forbear their ministerial office or [for] none [of them to do so]; for the reason is the same to all. For example: If ten or twenty untrue or unrighteous forbidden things must be subscribed, declared, covenanted or sworn, or as many sins practiced, yea were it but one, no doubt but the whole ministry is bound to deny conformity to any one such thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), sect. 6, p, 114</span></figcaption>

<main class="wrap"><figure class="quote" id="q-44ba6c29da" data-kw="">
<blockquote><p>The attention of the nation being excited to the African slave-trade, carried on by British subjects under parliamentary sanction; it was moved in the Synod, in May 1788, that they should petition Parliament for its abolition. The Synod judged it inexpedient for them to appear as petitioners in their judicative character; but agreed in expressing their detestation of this infamous traffic, as inconsistent both with religion and with humanity; and published their judgment on this head to the world. …

In our skirts is to be found the blood of many innocents. While this generation lies under the unspeakable guilt of shedding the blood of the saints in the last period of persecution, which has never been generally confessed and lamented; how many thousands have perished in consequence of the unlawful and inhuman traffic called The Slave Trade!

For many years past, the laws against the shocking crime of child-murder have not been duly executed. The horrid practice of duelling has long been the fashionable method of avenging an affront. Though good laws exist against this species of deliberate murder, they are but too seldom put in execution. But when the righteous Judge ariseth to make inquisition for blood, shall not he visit for these things: shall not his soul be avenged on such a nation as this?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-general-associate-synod-antiburgher-seceders.html">The General Associate Synod (Antiburgher Seceders)</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Agreed upon and Enacted by the General Associate Synod; Together with an Act Respecting Procedure in Covenanting Work</cite>, (Edinburgh: A. Neill &amp; Co., 1804), pp 63-64, 94-95.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

6c29da.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/44ba6c29da.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/07/20/the-general-associate-synod-antiburgher-seceders-on-the-african-slave-trade-and-britains-blood-guiltiness/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Beware of division yourselves, and give your help to recover, in all tenderness, these that have withdrawn, and encourage them not in their way. I’m persuaded that if they were not so much countenanced and encouraged by these that are hearers, the number of such would not be so great as it is. Let not that itching ear get place with you, so as to run away to their meetings whenever you have opportunity, and so to cast yourselves into a snare, and to do what in you lies to strengthen the division.</p></blockquote>

</figure><figure class="quote" id="q-ffce390ebe" data-kw="">
<blockquote><p>It had weight with me to mention the failings of the Church of Scotland in that period, that sundry of our separatists look upon the acts and determinations of the Church of Scotland in that period, as of little less authority than the Scripture for a rule, complaining that since the Revolution, ‘she has never revived and corroborated the registers, acts and constitutions of those Assemblies;’ affirming also, these ancient acts of the Church of Scotland ‘are a part of the traditions which we have received’: And therefore people ought to withdraw from ministers, as guilty of scandalous defections, while they remain so disorderly as not to observe them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>

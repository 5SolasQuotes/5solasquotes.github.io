<main class="wrap"><figure class="quote" id="q-bc9ba0123a" data-kw="">
<blockquote><p>Many flatter themselves that their state is good and their salvation sure because they do not live securely in a course of sin but, on the contrary, endeavor to keep the commandments as well as they can and because God is so merciful that He will surely pardon the sins that the infirmity of their nature renders unavoidable. This is a common but a very dangerous—yea, a fundamental—error; for it proceeds on the supposition that the righteous law can accept of defective or imperfect obedience and that divine justice can dispense with the punishment of sin. No man under the law as a covenant can be accepted for endeavoring to keep the precepts of it as well as he can. The law does not say, “Labor to obey” but “Do it” and “Do it perfectly and perpetually; do it without the smallest failure.” The least deficiency in obedience will subject a man to the curse. The self-righteous sinner, then, would do well to consider that he is under a law that demands absolute perfection of obedience on pain of death in all its dreadful extent and that, if he has transgressed but in a single instance, he is thereby exposed to the eternal execution of its righteous and tremendous penalty. “Tell me,” says our apostle, “ye that desire to be under the law, do ye not hear the law?” (Gal. 4:21). Do you not hear that it requires perfect obedience of you, on pain of the curse? And if it demands perfect obedience and, at the same time, complete satisfaction for sins that are past, what will you do, who cannot give to it either the one or the other? What will you do in the prospect of death and of judgment, who have no communion with the second Adam in His righteousness? Alas, your own righteousness is far, very far, from being commensurate with the perfect rule of that holy and righteous law by which all your thoughts, words, and actions are then to be tried! … Oh, that self-righteous and secure sinners would consider, before it is too late, how impossible it will be for them ever to obtain eternal life by their own righteousness and that they would, by faith, submit themselves to the righteousness of Jesus Christ, by which He has magnified the law and made it honorable!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 122–23, 124.</span></figcaption>

</figure><figure class="quote" id="q-e05a0dba4c" data-kw="">
<blockquote><p>If there is any head of Christian doctrine about which it is absolutely necessary to agree to obtain eternal life, it is that in which it is taught not only concerning the righteousness which is required of us before the judgment-seat of God, but also about the sure way of obtaining it, by the pure, unadulterated Word of God. Therefore, we owe great thanks to the Most High God, because in our times that jewel, so deeply buried in the extraordinary cunning of Satan and the sophists, I have dug up again, and it could not be brought back into the bright light even now without very great difficulties. And it has most uniformly wanted to be acknowledged in the greatest consensus of all the restored churches and asserted against all the attempts of the adversaries. But they make the faith of all theologians in this matter, that to which we owe the Christianity asserted by the tyranny of the Antichrist. The opinion in this head [of doctrine] is held in harmony, held publicly so many times not only in Germany, but also in Switzerland, and confirmed elsewhere in gatherings, and finally, clearly expressed in the published confessions of all nations. It could therefore rightly appear astonishing that several people dwelling in the very heart of the church are blind in such clear light, that not only do they not rejoice at the sight of it, but they also do not allow others to rejoice with peaceful consciences, if the Holy Spirit Himself long ago and the perpetual history of the church had not taught us about the false prophets to come, even at the last time. Such men appeared who had set out from the very school of Dr. Luther and of the great Philip Melanchthon, just as Cerinthus and Hebrion once did from the very company of the apostles. Wicelius, Staphylus, Osiander, Islebius, men whose memory must be contested, went out from us, since they were not from us. Such also is that anonymous man, a certain follower or perhaps a leader himself. Whichever of these he may be, there is blindness in these matters and audacity in asserting his allurements. I hope that all the learned and godly will come to know this from this response of ours.</p></blockquote>

ast+time.+Such+men+appeared+who+had+set+out+from+the+very+school+of+Dr.+Luther+and+of+the+great+Philip+Melanchthon%2C+just+as+Cerinthus+and+Hebrion+once+did+from+the+very+company+of+the+apostles.+Wicelius%2C+Staphylus%2C+Osiander%2C+Islebius%2C+men+whose+memory+must+be+contested%2C+went+out+from+us%2C+since+they+were+not+from+us.+Such+also+is+that+anonymous+man%2C+a+certain+follower+or+perhaps+a+leader+himself.+Whichever+of+these+he+may+be%2C+there+is+blindness+in+these+matters+and+audacity+in+asserting+his+allurements.+I+hope+that+all+the+learned+and+godly+will+come+to+know+this+from+this+response+of+ours.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+A+Defense+of+JustificationThrough+The+Righteousness+of+Christ+Alone+Freely+Imputed%2C+Obtained+by+Living+Faith+in+R.+Scott+Clark+and+Casey+Carmichael%2C+eds.%2C+Justification+By+Faith+Alone%3A+Selected+Writings+From+Theodore+Beza%2C+Amandus+Polanus%2C+and+Francis+Turretin%2C+trans.+Casey+Carmichael+%28Grand+Rapids%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe05a0dba4c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e05a0dba4c.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/08/beza-justification-through-faith-alone-is-shared-by-all-the-lutherans-and-all-the-reformed/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

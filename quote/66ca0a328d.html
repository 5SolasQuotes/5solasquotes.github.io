<blockquote><p>But now here, by the way, all magistrates and princes must be admonished to love the people subject to their charge and government, to bear with them bountifully, and not to nip them with immoderate exactions: which is easily done, if they themselves will be thrifty, and keep themselves moderately from riotous gluttony and over sumptuous pride. Let a good prince consider what a sin it is to have his palace abound in riotousness and surfeiting, while his cities and towns are tormented and pined with famine and hunger. Let magistrates consider that tributes and subsidies are not the private goods of them in authority, but the public substance of the whole commonweal. God hateth pillers and robbers. God abhorreth immoderate exactions. God curseth polling tyrants; but blesseth profitable and moderate magistrates.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 392-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-33c24143a8" data-kw="">
<blockquote><p>But here it is requisite, that we make a difference betwixt the office which is the good ordinance of God, and the evil person that doth not rightly execute that good office. If therefore in the magistrate evil be found, and not the good for which he was ordained, that cometh of other causes, and the fault thereof is the men of persons, which neglect God and corrupt the ordinance of God, and not in God, nor in his ordinance: for either the evil prince, seduced by the devil, corrupteth the ways of God, and by his own fault and naughtiness transgresseth God’s ordinance, so far, that he doth worthily deserve the name of devilish power, and not divine authority[.]

[W]e have an example of this in the magistrate of Jerusalem. For although he was able to refer the beginning of his power by degrees to Moses, and so to God himself who ordained it — yet, because he arrests the Saviour in the garden and binds him, it is said to his servants, “Ye are come out as it were to a thief with swords and staves; when I was with you daily in the temple, ye stretched not forth your hands against me. But this is even your hour, and the power of darkness.” Lo, here he calleth the ordinary magistrate the power of the devil, when he abuseth his power. What could be more evidently spoken? But here ye must mark, that the reproach was in the person, and not in the office.

Likewise also the Roman empire was ordained by God, as by the visions of Daniel it is clearly evident: and yet, when Nero, not without God’s ordinance, bare the sway in the empire, whatsoever he did as king and emperor, contrary to the office of a good king, that did he not of God, but of the devil: for whereas he hung up and beheaded the apostles of Christ, moving a bloody persecution against the church, that sprang not from elsewhere than from the devil, the father of murder. So then, verily, we ought not at any time to defend the tyrannical power, and say that it is of God: for tyranny is not a divine, but a devilish, kind of government; and tyrants themselves are properly the servants of the devil, and not of God.</p></blockquote>

</figure><figure class="quote" id="q-a791fd42df" data-kw="">
<blockquote><p>1. That the government of the Church is not Monarchical, no Monarch save Christ alone is Head and King of the Church, though every Monarch that’s truly Christian be a King in the Church; For it is one thing to be a King in the Church, and another to be King over the Church.

2. Every King as a member of the Church, is in an Ecclesiastical sense subject to the discipline of the Church; for such a kind of subjection will well consist with his Civil Sovereignty, because it is not a Civil Subjection. Judicious [John] Camero[n] was a man very tender of pitching upon any conclusion which might be prejudicial unto Kingly power, and he useth an excellent similitude to illustrate this point: As it is in the cure of the body, so is it in the cure of the Soul; now a King for the Cure of his body, must patiently yield himself to his College of Physicians, for though he rule over them as a King, yet he must be ruled by them as a patient. In like manner a wise King will (and every King ought to) be persuaded by the College Ecclesiastical in point of discipline to obey the Rules and orders of Jesus Christ; for the King in this point doth not obey the College, but Christ himself.

3. It is well known that Kings and Emperors have been subjected to Episcopal, and too often enslaved by Prelatical power. Who knows not that the Bishop [Ambrose] of Milan would not admit the Emperor to the Communion till he had repented of that outrage, and bloodshed at Thessalonica, which was occasioned by the Emperor’s passionate Command? It is generally confessed, that Ambrose did well in rejecting the Emperor from the Communion, and that the Emperor was no less an Emperor, and a far better man by submitting to a Minister of the Gospel, preaching, and administering some part of the discipline of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sion’s memento, and Gods alarum. In a sermon at Westminster, before the Honourable House of Commons, on the 31. of May 1643. the solemn day of their monthly fast</cite>, (London: Samuel Gellibrand, 1643), pp 30-31.</span></figcaption>

<blockquote><p>The law of God may be divided into ceremonial, judicial, and moral categories. This three-fold division of the law is sometimes called the Lex Triplex. In his commentary on the Westminster Shorter Catechism, Thomas Boston explains how the categories may be distinguished:

There are three sorts of laws we find in the word.

1. The ceremonial law, which was given by Moses. This bound only the Jews, and that to the coming of Christ, by whom it was abrogated, being a shadow of good things that were then to come: a hedge and partition-wall betwixt them and the Gentiles, which is now taken down.

2. The judicial law, which was the civil law of the Jews, given also first by Moses, which their civil concerns were to be regulated, in respect of which the Jewish government was a Theocracy. What a happy people were they under such a government! Yet does it not bind other nations farther than it is of moral equity, being peculiarly adapted to the circumstances of that nation.

3. The moral law, which is the declaration of the will of God to mankind, binding all men to perfect obedience thereto in all the duties of holiness and righteousness. The ceremonial law was given to them as a church in their particular circumstances; the judicial law as a state; but the moral law was given them in common with all mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion, with respect to Faith and Practice, upon the plan of the Assembly’s Shorter Catechism; Comprehending a Complete Body of Divinity</cite>, in The Complete Works of the Late Rev. Thomas Boston, Ettrick, ed. Samuel McMillan (12 vols, London, 1853), 2: 60-61.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

— Thomas Boston, An Illustration of the Doctrines of the Christian Religion, with respect to Faith and Practice, upon the plan of the Assembly’s Shorter Catechism; Comprehending a Complete Body of Divinity, in The Complete Works of the Late Rev. Thomas Boston, Ettrick, ed. Samuel McMillan (12 vols, London, 1853), 2: 60-61.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+law+of+God+may+be+divided+into+ceremonial%2C+judicial%2C+and+moral+categories.+This+three-fold+division+of+the+law+is+sometimes+called+the+Lex+Triplex.+In+his+commentary+on+the+Westminster+Shorter+Catechism%2C+Thomas+Boston+explains+how+the+categories+may+be+distinguished%3A%0A%0AThere+are+three+sorts+of+laws+we+find+in+the+word.%0A%0A1.+The+ceremonial+law%2C+which+was+given+by+Moses.+This+bound+only+the+Jews%2C+and+that+to+the+coming+of+Christ%2C+by+whom+it+was+abrogated%2C+being+a+shadow+of+good+things+that+were+then+to+come%3A+a+hedge+and+partition-wall+betwixt+them+and+the+Gentiles%2C+which+is+now+taken+down.%0A%0A2.+The+judicial+law%2C+which+was+the+civil+law+of+the+Jews%2C+given+also+first+by+Moses%2C+which+their+civil+concerns+were+to+be+regulated%2C+in+respect+of+which+the+Jewish+government+was+a+Theocracy.+What+a+happy+people+were+they+under+such+a+government%21+Yet+does+it+not+bind+other+nations+farther+than+it+is+of+moral+equity%2C+being+peculiarly+adapted+to+the+circumstances+of+that+nation.%0A%0A3.+The+moral+law%2C+which+is+the+declaration+of+the+will+of+God+to+mankind%2C+binding+all+men+to+perfect+obedience+thereto+in+all+the+duties+of+holiness+and+righteousness.+The+ceremonial+law+was+given+to+them+as+a+church+in+their+particular+circumstances%3B+the+judicial+law+as+a+state%3B+but+the+moral+law+was+given+them+in+common+with+all+mankind.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+An+Illustration+of+the+Doctrines+of+the+Christian+Religion%2C+with+respect+to+Faith+and+Practice%2C+upon+the+plan+of+the+Assembly%E2%80%99s+Shorter+Catechism%3B+Comprehending+a+Complete+Body+of+Divinity%2C+in+The+Complete+Works+of+the+Late+Rev.+Thomas+Boston%2C+Ettrick%2C+ed.+Samuel+McMillan+%2812+vols%2C+London%2C+1853%29%2C+2%3A+60-61.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa9081ee575.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a9081ee575.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/11/thomas-boston-on-the-three-fold-division-of-the-law/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>IN WHAT DOES THE CHURCH DIFFER FROM THE STATE? The chief differences between the church and the state are the following:

1. The state is a society which is bound by certain civil laws for the maintenance of external propriety and order, according to each table of the Decalogue. The church consists of those who embrace the gospel, and observe the sacraments according to divine appointment, and is governed by the Spirit and word of God, requiring both internal and external obedience.

2. In the church there are always some holy and godly persons, which is not always true of the state.

3. There are many and different states which are distinguished from each other by locality, time and laws; neither can he who is a citizen of one state, be a citizen of another also, or of all others; nor is there any one universal state of which all others are parts. The church, however, has been, is, and ever will be, one through out all periods, and among all nations. It is for this reason called Catholic, having many parts.

4. The head of the church is one, and in heaven, which head is Christ. The different states have many kings and rulers, and these upon earth.

5. The state has magisterial authority and power to make laws, to which it becomes us to yield obedience for conscience sake. The church is restricted and tied down to the word of God, and has no power to make new articles of faith. It may, indeed, establish “rules of order and propriety, but without binding the conscience; and that not with magisterial authority, but with consent.

6. The state is armed with power to inflict punishment upon obstinate offenders, and to preserve it laws with the sword. The church has merely the sword of the word, which consists in the denunciation of the wrath of God against those who are disobedient. One and the same person, as the prophets and priests of old, may sometimes act both in a civil and ecclesiastical capacity. Hence they ought to be carefully distinguished.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3e849e2b34" data-kw="">
<blockquote><p>It is of the utmost importance, however, that we should not misconceive the relation between “general” and “special” revelation. This relation is not one of contrast and opposition, but rather one of supplement and completion. They do not stand as two systems, each complete in itself, over against one another; but together they form one organic whole. The purpose of special revelation is not to correct, much less to set aside general revelation. General revelation needs no correction – God has not revealed himself falsely or misleadingly in it. And it cannot be set aside, – what it reveals of God is eternal and necessary truth. It might even be fairly pronounced inexact to speak of the purpose of special revelation as to supplement and complete general revelation, if the matter be conceived too abstractly. In itself, general revelation is neither imperfect nor incomplete – God does all things well.

The occasion of special revelation is extraneous to the organism of revelation itself, and lies in the necessity of meeting altered circumstances. Sin had entered in; and, speaking after the manner of man, the new conditions induced by sin required a new method and a new content for revelation. The modes of revelation adapted to sinless man would not suffice to make sinful man know God; the substance of truth revealed to sinless man would not suffice for the needs of sinful man. That sinful man might know and that he might know what sinful man needs to know, therefore, what we call special revelation entered in, not to abrogate general revelation as no longer useful, but to adapt the great organic process of revelation to the changed conditions and thus to conduct it surely onward to its originally contemplated end.

It is not to meet any failure in general revelation that special revelation is introduced, but to meet failure in man to whom the revelation is addressed. It is not the power of nature that it seeks to break, but the power of sin: nature it is its end rather to restore and to fulfil. The great organism of revelation thus includes all that God has done, looking towards the communication of knowledge of himself: and this includes the totality of his operations, in nature and history and grace. That portion of this organic process which is included in “grace” we call special revelation, which, therefore, has the same occasion and the same end as the dispensation of grace itself, of which it is a constituent element, or rather a specific aspect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity and Revelation (1902) in Selected Shorter Writings of Benjamin B. Warfield</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e551968cc0" data-kw="">
<blockquote><p>That true Religion is solely founded on special Revelation, as an altogether infallible Principium, alone and final, Psalm 119:105; Isaiah 8:20; Luke 16:29; Romans 10:17; Ephesians 2:20; 2 Timothy 3:15; 2 Peter 1:19, 20, without which Faith would not be divine, but only a human persuasion, Hebrews 11:1; Romans 4:20, 21.

Indeed, if the contrary opinion stand, Faith is completely converted into philosophical Knowledge: no longer will divine Revelation, unless in this name it be pleasing to trifle, be the true, sole, and ultimate foundation or Principium of our Religion; but that Reason itself, from which Revelation receives all true Authority and Meaning; as a similar analysis of the Papistical Faith in the Church is deservedly made by us, upon the Testimony and Interpretation of which these cause the Scripture altogether to depend; and of the Enthusiastical Faith in their own private Inspirations, unto which these likewise are wont to recur in all things, with continual twisting of the most manifest Scriptures.</p></blockquote>

html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/01/11/bernardinus-de-moor-the-true-religion-is-founded-on-special-revelation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-23136961b5" data-kw="object">
<blockquote><p>When God is set forth as the object of theology, he is not to be regarded simply as God in himself (for thus he is incomprehensible [akatalēptos] to us), but as revealed and as he has been pleased to manifest himself to us in his word, so that divine revelation is the formal relation which comes to be considered in this object. Nor is he to be considered exclusively under the relation of deity (according to the opinion of Thomas Aquinas and many Scholastics after him, for in this manner the knowledge of him could not be saving but deadly to sinners), but as he is our God (i.e., covenanted in Christ as he has revealed himself to us in his word not only as the object of knowledge, but also of worship). True religion (which theology teaches) consists of these two things. Sources of solution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.5.4</span></figcaption>

<blockquote><p>Rom. 1:19, 20 (concerning that which may be known of God, gnōstō tou Theou) does not favor a common religion by which all may be saved and which is sufficient for salvation. (1) Only that which may be known (gnōstō) is there spoken of and not that which is to be believed (pistō), which alone is saving. (2) Paul says the knowledge (to gnōston) of God is manifest in the Gentiles, but not all knowledge (pan gnōston) (viz., what may be learned from the book of nature, but not all that may be known of him from his word and which must be known in order to salvation, such as the mystery of the Trinity, and of Christ the Redeemer, etc.). (3) This knowledge (gnōston) which is restricted by the apostle to his “power and godhead” (i.e., to the knowledge of his existence and of those attributes which strike our senses in the works of creation and providence) is usually referred to natural theology; but is not extended to the knowledge of his will and mercy in Christ which can be derived only from his word, and not at all from his works and without which there can be no salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.4</span></figcaption>

<blockquote><p>Wherefore when this Word of God is now preached in the church by preachers lawfully called, we believe that the very Word of God is proclaimed, and received by the faithful; and that neither any other Word of God is to be invented nor is to be expected from heaven: and that now the Word itself which is preached is to be regarded, not the minister that preaches; for even if he be evil and a sinner, nevertheless the Word of God remains still true and good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, Other citations (work not named), chapter 1.</span></figcaption>

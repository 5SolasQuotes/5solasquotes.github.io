<main class="wrap"><figure class="quote" id="q-5b36801b03" data-kw="Mary Queen of Heaven">
<blockquote><p>In fact it contradicts the nature of deceased saints that they should be present in and care for diverse and widely scattered places at one and the same time, as when the [papal teachers] want to put one and the same saint in charge of diverse and widely scattered places. Think of Saint James for the Spanish, who dwell in Europe, India, and America. Or Saints Dominic and Francis, etc., for all their monasteries spread across the whole globe. Or even the blessed Virgin, whom they call Queen of Heaven, Mistress of the Earth, and Star of the Sea (Stella Maris)—even though this is a wrong rendering of Drop of the Sea (Stilla maris)—since it is fitting only for God to “look down from the heavens and behold all the sons of men, and from his dwelling-place to look forth upon all the inhabitants of the earth” (Psalm 33:13–14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, Disp. 40, On the Church (vol. 2)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-07640ab15d" data-kw="">
<blockquote><p>Many a one thinks that he has God and everything in abundance when he has money and possessions; he trusts in them and boasts of them with such firmness and assurance as to care for no one. Lo, such a man also has a god, Mammon by name, i.e., money and possessions, on which he sets all his heart, and which is also the most common idol on earth.… So, too, whoever trusts and boasts that he possesses great skill, prudence, power, favor, friendship, and honor has also a god, but not this true and only God.… Therefore I repeat that the chief explanation of this point is that to have a god is to have something in which the heart entirely trusts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Large Catechism</cite>, First Commandment (Mammon and creature-trust)</span></figcaption>

</figure><figure class="quote" id="q-e4ce59d60d" data-kw="">
<blockquote><p>All confidence reposed in creatures … is evidently opposed to a correct knowledge of God, since he who places his trust in creatures makes for himself many gods. Hence God expressly condemns in his word all those who repose their confidence either in men, or in power and riches, or in any created object. Avarice, or covetousness, is included in this vice, and condemned.… Idolatry … There are two forms or species of idolatry. One is, when another beside the true God is professedly worshiped, or, when that is worshiped for God which is no God.… The other form of idolatry is when we do not professedly worship another God, but err in the kind of worship we render unto him.… Those who worship God otherwise than he will be worshipped, imagine another God, one differently affected from what the true God is; and in this way they do not worship God, but a figment of their own brain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, on the First Commandment (creature-trust and forms of idolatry)</span></figcaption>

</figure><figure class="quote" id="q-9f7d4f5737" data-kw="">
<blockquote><p>See the goodness of God to our nation, who hath brought us out of mystical Egypt, delivering us from popery, which is Romish idolatry, and hath caused the light of his truth to break forth gloriously among us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, The Second Commandment</span></figcaption>

— Thomas Watson, The Ten Commandments, The Second Commandment">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSee+the+goodness+of+God+to+our+nation%2C+who+hath+brought+us+out+of+mystical+Egypt%2C+delivering+us+from+popery%2C+which+is+Romish+idolatry%2C+and+hath+caused+the+light+of+his+truth+to+break+forth+gloriously+among+us.%E2%80%9D%0A%0A%E2%80%94+Thomas+Watson%2C+The+Ten+Commandments%2C+The+Second+Commandment&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9f7d4f5737.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9f7d4f5737.html">Permalink</a><a class="src" href="https://ccel.org/ccel/watson/commandments" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-a6eef9a0dc" data-kw="">
<blockquote><p>In fact let us learn how greatly our nature inclines toward idolatry.… That saying of Horace still stands: once the gods of fools are born of fear. Or rather, as Scripture teaches, once the true knowledge of God has been blotted out by sin, the mind of man becomes a perpetual forge of idols.… Man will be compelled to confess that he is a transient being, and that those whose images he worships were once mortals like himself; yet he transfers divinity to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.11.8–9</span></figcaption>

<main class="wrap"><figure class="quote" id="q-e46797928f" data-kw="">
<blockquote><p>Why are the Scriptures our only rule of faith and obedience?

The Scriptures are our only rule of faith end obedience because as the written word of God they are unique and infallible, and therefore no other rule of faith and obedience may be placed alongside of them.

This principle of course does not rule out such subordinate standards as the [Westminster] Larger Catechism itself, which present not another rule in addition to Scripture, but merely a systematic summary of whet Scripture teaches. The Larger Catechism, for example, is a legitimate rule of faith and obedience only because, and only so far as, it is faithful to the teachings of the Scriptures. It possesses no inherent authority of its own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Studies in the Larger Catechism of the Westminster Assembly in Blue Banner Faith and Life</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5e87bb7bf1" data-kw="Supreme judge">
<blockquote><p>The supreme judge of controversies and legitimate interpreter of scripture should have these three properties: the first is, that we should certainly know that the sentence which he delivers is true, and that we can acquiesce in it; the second, that no appeal from that sentence shall be lawful; the third, that he be influenced by no partiality. Now the church or the pope possess none of these; whereas the scripture, and the Holy Spirit speaking in the scripture, have them all. Therefore the supreme decision is to be given to them, and not to the church or the pope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Question 5, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-6618087a6d" data-kw="">
<blockquote><p>And yet Holy Scripture is not so tied to those [original] languages that it cannot, and also ought not, be translated into other languages for the common use of the church. Likewise, all versions in those languages are considered authentic to the extent that they express the sources, according to which they must always be measured.

For this reason, the providence of God was always so illustrious and praiseworthy in preserving the sources, not only that they might not completely pass away but also that they might not be mutilated by the loss of any of the books, or that they might be deformed by any grave defect, while in the meantime not even one of the more ancient translations has come down to us whole and intact.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

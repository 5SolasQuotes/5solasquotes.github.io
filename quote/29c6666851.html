<blockquote><p>IV. This double covenant is proposed to us in Scripture: of nature and of grace; of works and of faith; legal and evangelical. The foundation of this distinction rests both on the different relation (σχέσει) of God contracting (who can be considered now as Creator and Lord, then as Redeemer and Father) and on the diverse condition of man (who may be viewed either as a perfect or as a fallen creature); also on the diverse mode of obtaining life and happiness (either by proper obedience or by another’s imputed); finally on the diverse duties prescribed to man (to wit, works or faith). For in the former, God as Creator demands perfect obedience from innocent man with the promise of life and eternal happiness; but in the latter, God as Father promises salvation in Christ to the fallen man under the condition of faith. The former rests upon the work of man; the latter upon the grace of God alone. The former upon a just Creator; the latter upon a merciful Redeemer. The former was made with innocent man without a mediator; the latter was made with fallen man by the intervention of a mediator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.3.4 (p. 575, modified according to the 1679 edition).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>…but after showing us that we have degenerated from our true origin, viz., the law of our Creator, adds, that Christ, through whom we have returned to favor with God, is set before us as a model, the image of which our lives should express. What do you require more effectual than this? Nay, what do you require beyond this? If the Lord adopts us for his sons on the condition that our life be a representation of Christ, the bond of our adoption—then, unless we dedicate and devote ourselves to righteousness, we not only, with the utmost perfidy, revolt from our Creator, but also abjure the Savior Himself.</p></blockquote>

<blockquote><p>Touching the catechesis of children in the Jewish church, the Old Testament abounds in many explicit commands. In the 12th and 13th chapters of Exodus, God commands the Jews to give particular instruction to their children and families in relation to the institution and benefits of the Passover. In the fourth chapter of the book of Deuteronomy he enjoins it upon parents to repeat to their children the entire history of the law which he had given them. In the sixth chapter of the same book, he requires that the doctrine of the unity of God, and of perfect love to him should be inculcated and impressed upon the minds of their children; and in the eleventh he commands them to explain the Decalogue to their children. Hence, under the Old Testament dispensation, children were taught in the family by their parents, and in the schools by the teachers of religion, the principal things contained in the prophets, viz.: such as respects God, the law, the promise of the gospel, the use of the sacraments, and sacrifices, which were types of the Messiah that was to come, and of the benefits which he was to purchase; for there can be no doubt but that the schools of the prophets Elijah, Elisha, etc., were established for this very purpose. It was also with this design that God delivered his law in the short and condensed form in which it is. “You shalt love the Lord your God with all your heart,” etc., “and your neighbor as yourself.” So also as it respects the gospel; it was briefly comprehended in the promises, “The seed of the woman shall bruise the serpent’s head;” “And in your seed shall all the nations be blessed.” They had, likewise, sacrifices, prayers, and other things which God required Abraham and his posterity to teach their children and families. Hence it is that this doctrine is presented in such a plain and simple form as to meet the capacity of children and such as are unlearned. In the New Testament we are told that Christ laid his hands upon little children and blessed them, and commanded that they should be brought unto him. Hence he says, in Mark 10:14, “Allow the little children to come to me and do not forbid them for of such is the kingdom of God.” That the catechesis of children was diligently attended to in the times of the apostles is evident from the example of Timothy, of whom it is said that he knew the holy Scriptures from a little child; and from what is said in the epistle to the Hebrews, where mention is made of some of the principal heads included in the catechism of the apostles, such as repentance from dead works, and of faith towards God, of the doctrine of baptism, and of laying on of hands, and of resurrection from the dead, and of eternal judgment, which the apostle terms milk for babes. These and similar points of doctrine were required from the Catechumens of adult age at the time of their baptism, and of children at the time of their confirmation by the laying on of hands. Hence, the apostle calls them the doctrine of baptism and laying on of hands. So likewise the Fathers wrote short summaries of doctrine, some fragments of which may still be seen in the Papal church. Eusebius writes of Origen, that he restored the custom of catechesis in Alexandria, which had been suffered to grow out of use during the times of persecution. Socrates writes thus in relation to the system of catechesis in the primitive church: “Our form of catechesis,” he says, “is in accordance with the mode which we have received from the Bishops who have preceded us, and according as we were taught when we laid the foundation of faith and were baptized, and according as we have learned from the Scriptures,” etc. Pope Gregory caused images and idols to be placed in the churches, that they might serve as books for the laity and children. After this period the doctrine of the church, through the negligence of the bishops and the subtlety of the Roman priests, became gradually more and more corrupt, and the custom of catechesis grew more and more into disuse, until at length it was changed into the ridiculous ceremony which to this day they call confirmation. So much concerning the origin and practice of catechesis in the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Orthodox Doctrine</cite>, 2.2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

+to+teach+their+children+and+families.+Hence+it+is+that+this+doctrine+is+presented+in+such+a+plain+and+simple+form+as+to+meet+the+capacity+of+children+and+such+as+are+unlearned.+In+the+New+Testament+we+are+told+that+Christ+laid+his+hands+upon+little+children+and+blessed+them%2C+and+commanded+that+they+should+be+brought+unto+him.+Hence+he+says%2C+in+Mark+10%3A14%2C+%E2%80%9CAllow+the+little+children+to+come+to+me+and+do+not+forbid+them+for+of+such+is+the+kingdom+of+God.%E2%80%9D+That+the+catechesis+of+children+was+diligently+attended+to+in+the+times+of+the+apostles+is+evident+from+the+example+of+Timothy%2C+of+whom+it+is+said+that+he+knew+the+holy+Scriptures+from+a+little+child%3B+and+from+what+is+said+in+the+epistle+to+the+Hebrews%2C+where+mention+is+made+of+some+of+the+principal+heads+included+in+the+catechism+of+the+apostles%2C+such+as+repentance+from+dead+works%2C+and+of+faith+towards+God%2C+of+the+doctrine+of+baptism%2C+and+of+laying+on+of+hands%2C+and+of+resurrection+from+the+dead%2C+and+of+eternal+judgment%2C+which+the+apostle+terms+milk+for+babes.+These+and+similar+points+of+doctrine+were+required+from+the+Catechumens+of+adult+age+at+the+time+of+their+baptism%2C+and+of+children+at+the+time+of+their+confirmation+by+the+laying+on+of+hands.+Hence%2C+the+apostle+calls+them+the+doctrine+of+baptism+and+laying+on+of+hands.+So+likewise+the+Fathers+wrote+short+summaries+of+doctrine%2C+some+fragments+of+which+may+still+be+seen+in+the+Papal+church.+Eusebius+writes+of+Origen%2C+that+he+restored+the+custom+of+catechesis+in+Alexandria%2C+which+had+been+suffered+to+grow+out+of+use+during+the+times+of+persecution.+Socrates+writes+thus+in+relation+to+the+system+of+catechesis+in+the+primitive+church%3A+%E2%80%9COur+form+of+catechesis%2C%E2%80%9D+he+says%2C+%E2%80%9Cis+in+accordance+with+the+mode+which+we+have+received+from+the+Bishops+who+have+preceded+us%2C+and+according+as+we+were+taught+when+we+laid+the+foundation+of+faith+and+were+baptized%2C+and+according+as+we+have+learned+from+the+Scriptures%2C%E2%80%9D+etc.+Pope+Gregory+caused+images+and+idols+to+be+placed+in+the+churches%2C+that+they+might+serve+as+books+for+the+laity+and+children.+After+this+period+the+doctrine+of+the+church%2C+through+the+negligence+of+the+bishops+and+the+subtlety+of+the+Roman+priests%2C+became+gradually+more+and+more+corrupt%2C+and+the+custom+of+catechesis+grew+more+and+more+into+disuse%2C+until+at+length+it+was+changed+into+the+ridiculous+ceremony+which+to+this+day+they+call+confirmation.+So+much+concerning+the+origin+and+practice+of+catechesis+in+the+church.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+A+Body+of+Orthodox+Doctrine%2C+2.2.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe2c45ce15a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e2c45ce15a.html">Permalink</a><a class="src" href="https://heidelblog.net/2013/08/ursinus-on-the-instruction-of-covenant-children/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Here at the outset, we ought to come back to what we before observed—that this covenant of grace (instituted between an offended God and sinful, guilty man) could not have been ratified except by the intervention of a mediator, to reconcile the parties at variance with each other and perform the office of a surety, not only in the name of God (promising that he would fulfill the promises of the covenant, if we would fulfill its conditions—as, following Socinus, Curcellaeus falsely quibbles); but also to God for us—that he will fulfill all those conditions for us, which being performed, the inheritance according to the testament will come to us (most especially as to the fullest satisfaction to be given to divine justice for our sins). Nor does any controversy exist here among the orthodox, but only with the Socinians and their associates (against whom we will argue when we treat of the satisfaction). Statement of the question.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8a3088fc96" data-kw="">
<blockquote><p>Next to the guilt of our sins, I fear nothing so much as our divisions, but could we first be reconciled to our God by faith, in the blood of Christ, and be firmly united together, and set all our shoulders as one man to this work, our enemies designs would all fail, and the work of God would prosper in our hands …</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-42755859e4" data-kw="">
<blockquote><p>Here [London] you may likewise see a Reverend Assembly of grave and learned Divines, who daily wait upon the Angel in the Mount, to receive from him the lively Oracles, and the pattern of God’s house, to present unto you. All these are of our own Nation; and with them you may see the Honourable, reverend, and learned Commissioners of the Church of Scotland; and in them behold the wisdom and affection of their whole Church and Nation, willing to live and die with us.

All these you may behold in one view; and which is more, you may behold them all of one heart, and one mind, after so many plots and conspiracies to divide them one from another, and thereby to ruin them all: And which is yet more, you may see them all met together this day on purpose, both to praise God for this union, and to rejoice in it, and to hold it out to all the world, and thereby to testify, that as one man they will live and die together in this common cause of God, of our Lord Jesus Christ, his Church, and these three kingdoms. O beloved! how beautiful is the face of this Assembly?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-marshall.html">Stephen Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sacred Panegyrick, or A Sermon of Thanksgiving, Preached to the two Houses of Parliament</cite>, (London: Stephen Bowtell, 1644), pp 2-3.</span></figcaption>

</figure><figure class="quote" id="q-22386b965e" data-kw="">
<blockquote><p>At its General Assembly in 1846, the Free Church of Scotland passed the following act clarifying how it received the Westminster Confession in relation to religious toleration and “persecuting principles.” While we are not convinced that this interpretation is congruous with the original intent of the Confession, we post it for reasons of historical interest:

WHEREAS it has become necessary, in consequence of the late change in the outward condition of the Church, to amend the Questions and Formula to be used at the licensing of Probationers, and the ordination of Deacons, Elders, and Ministers respectively, the General Assembly, with consent of a majority of Presbyteries, enact and ordain, that the following shall be the questions so to be used: And, considering that the Formula, to this Act subjoined, embodies the substance of the answers to the said questions, the Assembly appoint the same to be subscribed by all Probationers of the Church before receiving licence to preach the gospel, and by all office-bearers at the time of their admission:

And the General Assembly, in passing this act, think it right to declare, that, while the Church firmly maintains the same scriptural principles as to the duties of nations and their rulers in reference to true religion and the Church of Christ, for which she has hitherto contended, she disclaims intolerant or persecuting principles, and does not regard her Confession of Faith, or any portion thereof, when fairly interpreted, as favouring intolerance or persecution, or consider that her office-bearers, by subscribing it, profess any principles inconsistent with liberty of conscience and the right of private judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-general-assembly-of-the-free-church-of-scotland.html">The General Assembly of the Free Church of Scotland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Act anent Questions and Formula, Edinburgh, 1 June 1846, Sess. 24 in Acts of the General Assembly of the Free Church of Scotland, convened at Edinburgh, May 1846</cite>, (Edinburgh: John Greig, 1846), p. 27.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-7249d18b63" data-kw="">
<blockquote><p>After the defeat at Bothwell, he avoided the consequences of his attainder and condemnation by an escape into Holland. There, in Geneva and the Palatinate, he endeavoured to excite the sympathy of foreign protestants with the sufferings of their Scottish brethren; and along with his brother-in-law, Gordon of Earlston, he acted as commissioner in behalf of the united societies, whom he greatly assisted by his influence in obtaining for them the countenance and support of the continental churches. He continued to reside principally in Holland, although the English government, apprised of his intention of returning with arms and money to the assistance of his persecuted countrymen, repeatedly urged upon the States an application for his delivery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution</cite>, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3, p. 51</span></figcaption>

</figure><figure class="quote" id="q-92cc8cff8f" data-kw="">
<blockquote><p>Objection [of a congregationalist]: The union betwixt Christ and his Church is as strait and immediate, as the union betwixt the vine and the branches, betwixt the head and the body, betwixt the Husband and the Wife. Therefore every true Church of Christ has direct and immediate interest in, and title to Christ Himself, and the whole New Testament, and every ordinance of it. Answer: The strait union betwixt Christ and the Church, expressed by these comparisons, cannot be understood of the Church taken politically: for then the union betwixt Christ and the Church might be dissolved as often as the Church ceases to be ordered and governed as an Ecclesiastical republic. It is therefore to be understood either of the invisible Church, or at most of the visible Church taken metaphysically or entitatively. But I add withal, it is to be likewise understood of every faithful Christian: so that not only every true Church, but every true member thereof, by virtue of this union, has direct and immediate title to Christ, and to the benefit of all his ordinances for his edification and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, … (Edinburgh, 1641) | pt. 2, ch. 11, ‘Objections…’, pp. 201-2</span></figcaption>

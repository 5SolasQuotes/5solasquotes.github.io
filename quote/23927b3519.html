<main class="wrap"><figure class="quote" id="q-23927b3519" data-kw="">
<blockquote><p>[O]bserve the explanation, the origin, of persecution. It originates in the world’s hatred to Christ, and is directed against him. It must be so, seeing that Christ liveth in his people. Saul, Saul, wasting the Church, why persecutest thou me? And it is no extenuation of the world’s guilt in hating the saints, that they do not believe that Christ liveth in them—that they do not know or recognise Christ in them. Their rejection of those that are his stands exactly on the same footing with their rejection of him: “Henceforth the world knoweth us not, because it knew him not.”

Depravity blinded the world to the glory of Christ when he came in his own person, and blinds them to the measure of his glory in which he comes in the persons of his people. The bitter Ishmaelitish laugh and jest with which you, the worldling, scorn the Isaac of God, the promised seed; the hard words or hard deeds with which you, born after the flesh, persecute him that is born after the Spirit, will bear no excuse from your assertion that you did not know, you did not think, you did not see, that Christ was living in him—that it was really the promised Seed of the woman, Messiah himself, you were persecuting. For it is only your hatred and bitter prejudice that blind you. If you feared God and loved Christ, you would see him in his people: They that fear thee shall rejoice when they see me trusting in thy word; — “they shall glorify Christ in me.”

Ah ! consider, in your dislike of those that are Christ’s; in your suspicion of them; your hard thoughts and hard speeches concerning them; your discomfort in their presence when their godliness, their Christliness, comes out; your scornful joy over their infirmities and failures; —consider what a proof you have in all this of your deadly enmity to that Christ who liveth in them. You cannot but know that as yet Christ liveth in them only partially. If Christ is in them, the body is dead because of sin, though the Spirit is life because of righteousness. A body of sin and death is in them, as well as a living Christ. And that body of sin and death is a drawback on the completeness of the life and likeness of Christ in his people. They profess to give no more than a partial, though still a real, representation of Christ. They profess no more, though they long that it were far more, yea, long that it were unbroken and complete.

But were it so,—were their infirmities removed, their remaining corruption finally suppressed and extinguished; were there absolutely nothing seen or extant in them any more save Christ living in them in the unabated fulness and energy of his Holy grace and life; ah! you know that their society would be unspeakably more painful to you still; their Christliness would rebuke you more powerfully than now; your withdrawal from them, if withdrawal were possible, would be more complete: or if you could not escape their presence and their intercourse—if you found yourself in relations to them which you could not set aside—if you found them a people with whom, in their perfect righteousness, and holiness, and likeness to Christ, you could not but have to do,—ah! would not your dislike to them, your rejection of them, your resentment against them and their piety, break out in manifold strength and bitterness?

And what is this but just a proof that the more clearly Christ is revealed to you, the nearer Christ is brought to you, so much the more do you dislike him; and that were Christ, therefore, to come to you, not only in his own personal perfection in his people, but in himself, in his own perfect person, you would fully and finally reject Aim, and say, Depart from us, for we desire not thee, nor the knowledge of thy ways?” Ah! forget not that it is this, indeed, you do say, when now you reject his people. You reject, you persecute, him in them; for Christ liveth in them.

But let believers know what they are to expect at the world’s hands, and why. “Christ living in you” will not fare any better at the world’s hands than Christ sojourning in the world in the days of his flesh. The world is the same now as then. Christ in you is the same Christ as then. If they have kept his sayings, they will keep yours also; if they have persecuted him, they will persecute you. The servant is not greater than his Lord; it is enough if the servant be as his Lord. And it must be so, if his Lord liveth in him. Christ in his own person was the object of the world’s malice. Christ living in you will be so still.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Treasury Pulpit. No. III. “Christ Liveth in Me. ’, Family Treasury of Sabbath Reading</cite></span></figcaption>

</figure><figure class="quote" id="q-fc9a48e5b2" data-kw="">
<blockquote><p>Does infidelity or difference of religion make void the magistrate’s just and legal authority? No. Does it free the people from their due obedience to him? No (1 Pet. 2:13-15; Rom. 13:1-4; Titus 3:1). Well then, do not the Papists, Anabaptists and others err who maintain that subjects ought not to suffer a king that’s an infidel, or obey that king in his just commands that differs from them in religion? Yes. By what reasons are they confuted?

1. Because we are commanded to submit ourselves to every ordinance of man (1 Pet. 2:13). Namely, in all that they command us, if it be not contrary to God and his command. Otherwise (according to Acts 4:19) it is better to obey God than man. And it is said ‘for the Lord’s sake’, that is, because it is God’s will to govern us by them.

2. Because the Christians which were at Rome were commanded by the apostle to subject themselves to the higher powers, and that without exception of religion and piety, and even to that heathen, the Roman emperor (Rom. 13:1).

3. Because the same apostle, writing to Titus, bids him exhort the Cretians, his hearers, to obey magistrates, what manner of ones soever they be, not only believing ones but also those that are unbelieving, as then they were yet, most of them (Titus 3:1).

4. Because when the apostle Paul was pursued for his life and charged with matters criminal, he appealed unto Caesar (Acts 25:10-11).

5. Because the Prophet Jeremiah did own the power of Zedekiah who had turned aside to a false worship and had despised the oath which he had made to the king of Babylon (Eze. 17:16-17). ‘Now hear I pray thee (says the prophet), O my lord the king: let my supplication, I pray thee, be accepted before thee’ (Jer. 37:20).

6. Because Christ Himself paid tribute to Caesar, though he was free, being both the Son of God by nature and son of David by birth (Matt 22:21; Rom. 13:7).

7. Because Paul did own and acknowledge the power of King Agrippa (Acts 26:2).</p></blockquote>

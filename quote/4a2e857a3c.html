<blockquote><p>…the will, for Aquinas, just is the inclination of a rational substance toward what the intellect judges to be good… for Aquinas the will inclines of necessity toward what the intellect judges to be good, and in particular at what we judge will bring happiness. That does not entail that we cannot will what we judge to be in some way bad. Aquinas’s view is rather that whenever we will some end, it is because of some good we judge it to have, even if the intellect acknowledges it to be bad in other respects. At the moment of choice, it is the good that the intellect sees in it that it focuses on, and the will opts for it under that aspect. Though I follow here the common practice of speaking about what the intellect sees, what the will opts for, and so on, it is important to emphasize that strictly sepaking, it is the person or rational substance who does these things. The intellect and will are powers or capacities of this substance rather than substances in their own right. When it is said that the intellect knows something, this is to be understood as a shorthand way of saying that the person knows it, by virtue of his intellect. Similarly, when it is said that the will chooses some end, this is a shorthand way of saying that the person chooses it, by virtue of his will. Now many ends are pursued for the sake of further ends. You labor in order to earn an income… But Aquinas holds that there must be one ultimate end toward which all our actions are directed… he hold that that end is happiness. Moreover, he argues that what alone can bring happiness is to know and love God. That is not to deny that people disagree about what will bring happiness, and that many seek it in something other than God. The point is that whatever ultimate end they seek, they seek it as that which they suppose will bring happiness. And, Aquinas holds, what alone can really bring it is in fact God, even if some do not see that.</p></blockquote>

<blockquote><p>…yet this necessity of sinning, incident to all that are brought forth into the world, in massa peccati et perditionis, in the mass of original sin and perdition, is not such either in their, or our opinion, as whereby they cannot but sin; although they would abstain from it; though this be obtruded upon us as it was upon Remigius: whereupon he pleads for himself, and such as were of his mind in the doctrine of predestination after this manner, p 53: Nemo it a sentit aut dicit quod Dei praedestinatio aliquem invitum faciat peccare, ut jam non propriae voluntatis perversitate sed Divinae praedestinationis necessitate peccare videatur. ‘No man’ (says he) ‘does so think or speak as if God’s predestination made a man to sin against his will, in such sort as he should seeme to sin, not through the perverseness of his own will, but by the necessity of divine predestination.’ So say we; neither is this impotency of doing good, anywhere else, but in the corruption of the will, it being a moral impotency according to that of Saint Augustine, Libertas sine gratia non est libertas sed contumacia; ‘Liberty without grace, is not liberty, but wilfullness,’ and Remigius, Histor: Gottescal, p. 29, Ex quibus (says he) speaking of reprobates: Nemo potest salvari, non propter violentiam aliquam Divinae potestatis, sed propter indomabilem et perseverantem nequitiam suae iniquitatis. ‘Not one of them can be saved, not because of any violence of divine power, but by reason of the untameable and persevering naughtiness of their own iniquity.’ and p. 144: De reprobis nullum salvari ullatenus existimavi, non quia non possunt homines de bono ad malum commutari et de malis ac pravis boni ac recti fieri, sed quia in meliùs mutare noluerunt, et in pessimis operibus usque ad fiaē perseverare voluerunt. ‘None of the reprobates do we judge to be saved, not because they could not be changed from evil to good, and of evil and depraved become good and right, but because they would not be changed into better and would to the end persevere in wicked works.’ So then they could be changed but would not: But in what respect is it said they could be changed? was it in respect of the freedom of their wills without grace? Nothing less; see his own words, p. 34: Si dixisset generaliter, nemo hominum sine Dei gratia libero bene uti potest arbitrio, esset catholicus: ‘Had he said generally that no man can rightly use his free will, without the grace of God, he had been a catholic.’ But all the question is about the manner how this grace does work (to wit) whether God gives men grace to believe and repent if they will, and leaves to them to perform the act of faith and repentance; or whether God works the very act of faith and repentance, not to dispute of this point out of God’s Word, which clearly teaches that God works in us the will and the deed, according to his good pleasure, Phil. 3:13. And that he makes us perfect to every good work, working in us that which is pleasing in his sight through Jesus Christ. (Heb. 13:21) Let us take notice of the discourse between Hincmarus and Remigius on this argument that till the love of God comes, man is dead, his will is dead to that which is good. Now love is only given to the believers, posse charitatem habere naturae est hominum, charitatem autem habere gratiae est fidelium. (Of the Predestination of the Saints, ch. 5) For thus writes Hincmarus, p. 3.113: Bonum quod agimus et Dei est et nostrum, Dei per praevenientem gratiam, nostrum per subsequentē liberam voluntatem. ‘The good that we do is both God’s work and ours; of God by grace preventing, ours by free will following.’ To this Remigius answers and first he says Hincmarus discourses after such a manner as if a good work were partly God’s work and partly ours; and again as if the beginning of a good work were God’s, but the effect thereof of man’s free will; although as he (Hincmarus) does endeavor to temper this speech of his, by the addition of grace, not by the fulness of it; gratiae adjunctione non etiam plenitudine, ‘by the adjunction of grace, not also by the fulness of it.’ So he should have done, says Remigius, cum vere totum sit Dei; seeing indeed the whole is God’s work; As the truth itself says, ‘Without Me ye can do nothing,’ and the apostle, ‘What hast thou that that thou hast not received?’ Whence the blessed and glorious martyr Cyprian has so defined it, saying we must glory in nothing, seeing nothing is ours, and concludes thus: Bonum itaque nostrum totum Dei est, quia totum est ex Deo; et nihil boni nostri, nostrum est, quia nihil boni nostri est ex nobis. ‘Therefore our good works are wholly God’s, and no good of ours is ours, because it is not of us.’ And to reconcile this seeming contradiction, in calling it our good, yet denying it to be from us, he concludes thus: omne bonum nostrum, et totum Dei est, donando; et totum nostrum est, accipiendo. ‘Every good thing of ours is wholy God’s in as much as He gives it, and it becomes ours full and whole, for as much as we receive it.&#x27;</p></blockquote>

od+agimus+et+Dei+est+et+nostrum%2C+Dei+per+praevenientem+gratiam%2C+nostrum+per+subsequente%CC%84+liberam+voluntatem.+%E2%80%98The+good+that+we+do+is+both+God%E2%80%99s+work+and+ours%3B+of+God+by+grace+preventing%2C+ours+by+free+will+following.%E2%80%99+To+this+Remigius+answers+and+first+he+says+Hincmarus+discourses+after+such+a+manner+as+if+a+good+work+were+partly+God%E2%80%99s+work+and+partly+ours%3B+and+again+as+if+the+beginning+of+a+good+work+were+God%E2%80%99s%2C+but+the+effect+thereof+of+man%E2%80%99s+free+will%3B+although+as+he+%28Hincmarus%29+does+endeavor+to+temper+this+speech+of+his%2C+by+the+addition+of+grace%2C+not+by+the+fulness+of+it%3B+gratiae+adjunctione+non+etiam+plenitudine%2C+%E2%80%98by+the+adjunction+of+grace%2C+not+also+by+the+fulness+of+it.%E2%80%99+So+he+should+have+done%2C+says+Remigius%2C+cum+vere+totum+sit+Dei%3B+seeing+indeed+the+whole+is+God%E2%80%99s+work%3B+As+the+truth+itself+says%2C+%E2%80%98Without+Me+ye+can+do+nothing%2C%E2%80%99+and+the+apostle%2C+%E2%80%98What+hast+thou+that+that+thou+hast+not+received%3F%E2%80%99+Whence+the+blessed+and+glorious+martyr+Cyprian+has+so+defined+it%2C+saying+we+must+glory+in+nothing%2C+seeing+nothing+is+ours%2C+and+concludes+thus%3A+Bonum+itaque+nostrum+totum+Dei+est%2C+quia+totum+est+ex+Deo%3B+et+nihil+boni+nostri%2C+nostrum+est%2C+quia+nihil+boni+nostri+est+ex+nobis.+%E2%80%98Therefore+our+good+works+are+wholly+God%E2%80%99s%2C+and+no+good+of+ours+is+ours%2C+because+it+is+not+of+us.%E2%80%99+And+to+reconcile+this+seeming+contradiction%2C+in+calling+it+our+good%2C+yet+denying+it+to+be+from+us%2C+he+concludes+thus%3A+omne+bonum+nostrum%2C+et+totum+Dei+est%2C+donando%3B+et+totum+nostrum+est%2C+accipiendo.+%E2%80%98Every+good+thing+of+ours+is+wholy+God%E2%80%99s+in+as+much+as+He+gives+it%2C+and+it+becomes+ours+full+and+whole%2C+for+as+much+as+we+receive+it.%27%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+The+Riches+of+God%E2%80%99s+Love+unto+the+Vessels+of+Mercy%E2%80%A6+%28d.+1646%3B+Oxford%2C+1653%29+%7 <blockquote><p>…the conceptual order outstrips the order of things conceptualized. And it is this outstripping that entails the possibility of willing otherwise. Because the intellect is not necessitated to conceptualizing things one way rather than another, the will is not necessitated to being moved to one end rather than another. But neither is choice random or arbitrary. For choice is always for a reason, even if the reason is not necessitated. And to act for a reason is precisely not to act randomly or arbitrarily.</p></blockquote>

<blockquote><p>Edward Bagshaw, p. 18: ‘His own free-will has not the least power to receive the things of God. [1 Cor,. 2:14]’ Richard Baxter: 1. What not sanctified free-will? 2. What! not a receiving obediential power? A receiving power is a passive power (as it is strictly taken). Has a free-agent less power to receive grace than a marble to receive the engraving of the workman? Does no man ever receive grace? Or do they receive what they cannot receive? Has a man no more receptive power than a block or stone? I know it’s said ‘The natural man receiveth not, etc.’ [1 Cor,. 2:14], that is, understands not, believes not, and loves not in sensu composito [in a combined sense]: But its never said that, ‘Our free-will has not the least power to receive.’</p></blockquote>

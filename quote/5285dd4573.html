<main class="wrap"><figure class="quote" id="q-5285dd4573" data-kw="">
<blockquote><p>It is not to be feared, if we follow these statements of the Scripture, that we may magnify the corruption of nature too much, which is the worry of the men of Cologne and of Andrada, for this corruption which inheres in us cannot be recognized and deplored sufficiently, but there remains what the Psalm (19:12) says: “Who can discern his errors? Clear Thou me from hidden faults”; and what Jeremiah (17:9) proclaims: “The heart is deceitful above all things, and desperately corrupt; who can understand it?” We do not for this reason join ourselves to the Manichaeans, whose blasphemies we condemn and execrate, but we follow the Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part I, Topic on Original Sin, Sec. II</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/sin-and-free-will.html">Rome: Sin and Free Will</a> › <a href="../topics/rome/sin-and-free-will/original-sin.html">Original sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-562d5070cb" data-kw="">

</figure><figure class="quote" id="q-8f9e8de841" data-kw="">
<blockquote><p>If that law demands perfect conformity to the image of God, then these impulses of evil are clearly sinful. … The Protestant doctrine which pronounces these impulsive acts to be of the nature of sin is confirmed by the consciousness of the believer. He recognizes as evil in their own nature the first risings of malice, envy, pride, or cupidity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 2, pt. 2, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-ad804f504d" data-kw="">
<blockquote><p>John 6:44 says: “No one can come to Me unless the Father … draws him.” These testimonies show very clearly that unregenerate nature has in itself and of itself no strength, power, or faculty whatever which it may contribute of itself in order that it may cooperate with grace to some extent through its own powers, to begin and to effect spiritual actions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part I, Topic on Free Will, Sec. III</span></figcaption>

</figure><figure class="quote" id="q-237e92f553" data-kw="">
<blockquote><p>Original Sin standeth not in the following of Adam, (as the Pelagians do vainly talk;) but it is the fault and corruption of the Nature of every man, that naturally is ingendered of the offspring of Adam; whereby man is very far gone from original righteousness, and is of his own nature inclined to evil, so that the flesh lusteth always contrary to the spirit; and therefore in every person born into this world, it deserveth God&#x27;s wrath and damnation. And this infection of nature doth remain, yea in them that are regenerated; whereby the lust of the flesh, called in the Greek, &quot;Phronema Sarkos&quot;, which some do expound the wisdom, some sensuality, some the affection, some the desire, of the flesh, is not subject to the Law of God. And although there is no condemnation for them that believe and are baptized, yet the Apostle doth confess, that concupiscence and lust hath of itself the nature of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-england.html">Church of England</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Thirty-Nine Articles</cite>, 1563, Art. 9</span></figcaption>

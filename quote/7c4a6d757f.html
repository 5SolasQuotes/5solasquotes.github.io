<main class="wrap"><figure class="quote" id="q-7c4a6d757f" data-kw="">
<blockquote><p>[T]he apostle Paul “became all things to all men.” For it was not his doctrine that he accommodated to the views and feelings of his hearers. The truth which he taught was always the same, being the truth as it is in Jesus. It was simply his manner of stating and proving and illustrating it that he altered, according to the different tempers and different states of knowledge of those with whom he had to deal, that so the truth might have a fair and favourable hearing. “He became all things to all men, if by any means he might gain some.” This indeed is plainly necessary, in every attempt to convince and persuade reasonable men.

We must have some mutually acknowledged principles, some common ground, on which to build our argument, and that ground must be different, in regard to different individuals and classes of individuals. Thus, in arguing with Jews and with Gentiles on the truth and reasonableness of the Gospel, the Christian teacher had a different course to pursue, according to the different principles which they were severally willing to recognise.

With the Jews, he had the common ground of the Old Testament Scriptures; with the Gentiles, his common ground lay in what are called the articles of Natural Religion, whether these be really the discoveries of reason, or the traditionary remains of old revelation. Yet still always he aimed at the same result, to bring both Jews and Gentiles to the knowledge and belief of the grace and the judgment of God in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reason Insufficient without Revelation: A Sermon Preached in St. George’s Church, Edinburgh, on Sabbath 14th September, 1834</cite>, (Edinburgh: Waugh and Innes, 1834), pp 3-4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

<blockquote><p>(3) From the providence of God perpetually keeping watch for the safety of the church (which cannot be conceived to have allowed her to suffer so great a loss). Otherwise what would become of the wisdom and goodness and power of God if he had willed that such a precious treasure should be shown to his church and then taken away; and that the body of Scripture should exist at this day mutilated and defective? (4) From the duty of the church which is religiously to preserve the oracles of God committed to her and to search them diligently. That she has not been careless to her charge is evident even from this—that neither Christ nor his apostles ever charged the Jews with this crime. This sacrilege they (who did not omit lesser things) would not have passed over in silence, if they had been really guilty. Yea, Paul commends this privilege of the Jews because unto them were committed the oracles of God (logia tou Theou, Rom. 3:2; 9:4).</p></blockquote>

</figure><figure class="quote" id="q-68759469ef" data-kw="">
<blockquote><p>For he that is nether hot nor cold, but indifferent to use the college of God’s Word and Christ’s Church, with the word and gloss of man that teaches the use of images in the church, before he can prove by authority of God’s Word that they may be suffered in the church does not well, they have been the occasion of great hurt and idololatry the church of the Old Testament nor the New never taught the people with images. Therefore it shall be the office of every man that loves God and his Word to follow the Scripture only.</p></blockquote>

</figure><figure class="quote" id="q-44b4dcf481" data-kw="">
<blockquote><p>If the consequence is truly able to be proved according to natural light, then it may yet be proved from the Word of God because the light of reason is contained in the Word of God as a part is in the whole, and so to this extent the Word of God will prove the consequence. If truly the consequence is proved through natural reason which is not in the Word of God, we desire to hear such an invincible demonstration!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. Charles Johnson &amp; Travis Fentiman (1639-1642; 1668; RBO, 2019), ch. 1, section 17, p. 47</span></figcaption>

</figure><figure class="quote" id="q-302bbb00a4" data-kw="">
<blockquote><p>The Greek interpreter has translated this place more unfitly, using for ‘burnt offerings’, the general word ‘sacrifice’: somewhat also he leaves out, as namely that particle ‘all’ and he adds many things of his own; all which Jerome has rightly amended according to the truth of the Hebrew text. Now seeing the Greek translations are in diverse places faulty, and seeing that in all things we must follow the Hebrew, hereafter we will not much trouble ourselves about the Greek, unless peradventure we shall find anything worth the observation. God be thanked that in these days he has restored the knowledge of the Hebrew tongue, through ignorance whereof those that are unskillful will hardly believe how, often and how greatly the most learned Greek interpreters have erred in the true exposition of all the sacred books of the Old Testament, and especially of this; as also very many of the Latin interpreters, after Jerome’s emendations, but I return to the matter. For these things I touch in a manner against my will, which nevertheless I would have diligently to be marked of those, who bend themselves to the study of divinity, seeing it has pleased God in this age to make the Hebrew tongue so familiar unto us, lest with the Fathers in many places they err from the true and natural sense of the Scriptures; yet we must always that reverence which is due to men of such learning and antiquity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Job Expounded</cite>, … (University of Cambrdige, John Legatt, 1589), on Job, 1:5</span></figcaption>

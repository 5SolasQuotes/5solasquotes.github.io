<main class="wrap"><figure class="quote" id="q-0df8960d35" data-kw="">
<blockquote><p>God created Man in His own Image in respect of Life and Immortality. God made Adam a living Soul that can never die, a natural Image of HIM who only hath Immortality. And God covenanted with Adam that tho’ his Body was corruptible in it self, yet He would preserve it in Health, Ease and Strength, and it should never see Death in case he never sinned. God gave him therefore the Tree of Life to eat of, a Sign Pledge and Means of Immortality to his Body, and of the Continuance of Happiness to him in Soul and Body all his Days on Earth; and I doubt not it was also a Seal and Assurance to him of a Translation to a better World, a better Paradise in due Time.

Man could not but begin to be because he was a Creature; no more could the Angels of Heaven. God only is Eternal, from Everlasting to Everlasting, without Beginning or End. Spirits that can never cease to be, yet once were not. By God were the Invisible Thrones and Dominions above created, and so likewise the Spirits in Flesh. Both were made for an everlasting Existence and Duration. The Word of God’s Power upholds them in Being, whether in a holy and happy State, or in their sinful and miserable Condition.

This Immortality simply considered is a signal Likeness of the Everlasting Father upon his Offspring. Angels are in this Image of God upon them for ever and ever: Their Being, Glory, Blessedness, Joys are sure of an everlasting Duration. And Souls that are here sanctified in Jesus Christ are sure of going to Him at Death, and of Blessedness in his Likeness for Evermore. This Life and Immortality is bro’t to Light by the Gospel, and we are begotten to the lively Hope of it by the Resurrection of Jesus Christ from the dead. The Promise which GOD hath promised is this Eternal Life, in Soul and Body united, unto all them that by patient Continuance in well doing, seek after it.

And this shows us the Original State of Man; to what Life and Happiness he was designed and prepared in his Creation, in Conformity to the Life and Blessedness of his MAKER, even for an everlasting seeing serving and Enjoyment of Him. This therefore was an eminent Part of the Divine Image and Likeness on our First Parents, in the Day when they received their Being. They knew themselves made for Immortality, and that their present happy Circumstances could never cease, but might increase for ever and ever, and be changed for better and better, higher and high: to Everlasting. Death therefore was set before them to deter them from Sin; Death bodily and spiritual; not a Period to their Existence but to their Happiness; which alone is to be called Life; for to exist in Misery, in any great Degree of it, is Death rather than Life, and a reasonable Creature would chuse Strangling, rather than such an Existence. —

We read therefore of the Soul in a State of Misery, that it shall never see Life; and the second Death has power over it. The Curse comes on that Soul in the very Letter of it, In dying thou shalt die. The miserable Spirits in Hell are for ever dying, and yet never die; never see an End of their Misery; their Worm dieth not, and the Fire is not quenched. Here is the Loss of the Image of God to the uttermost. For God lives in the Perfection of Bliss, in ineffable inconceivable Blessedness, for ever and ever: And so do Angels and glorified Spirits in His Likeness and Favour: They have an Eternity of Happiness before them: But sinning Angels, and impenitent damned Souls, are in everlasting Chains of Darkness, reserved to unquenchable Fire and everlasting Burnings. The Image of Immortality upon them is an everlasting Curse! the Reverse of that Living Happy Soul which God at first made us.

Indeed there is no Image of God’s Self-Existence, his necessary Existence, his Independent Essence, his proper Eternity and Unchangeableness, in the immortal Nature of Angels or Men, or in the happy Immortality of holy Spirits. God is the High and lofty ONE that inhabiteth Eternity; having Life in Himself. Only the Eternal Word and Spirit who are One with the Father, are also the Brightness and express Image of his Eternal Glory. Yet every immortal Spirit is an Image of the Vital Being from Whom it came; in Whom alone is the Origin of Life, and the Life is the Light of Men and Angels: i. e. the Living God is the Spring and Fountain of it; as the Psalmist sings, “For with Thee is the Fountain of Life. When Man recovers his first and proper Immortality, as the Righteous shall do at the Resurrection, then the Image of God will be perfectly restored in him, never to be lost again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-colman.html">Benjamin Colman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dissertation on the image of God wherein man was created</cite>, (Boston: S. Kneeland and T. Green, 1736), pp 21-23.</span></figcaption>

<blockquote><p>It ought to be well understood in approaching this topic that the delineated distinctions, and further ones that will be made, are not magic solutions to ethical predicaments. Rather they are (very useful) tools that will go a long way towards working to what is righteous and pleasing before God. As with all tools, they may be used well, or irresponsibly. If through the multiplying of distinctions and terms (or the opposite, the lack of using such), a conclusion is reached that seems off or suspect, sophistry is likely being committed. Ethical conclusions reached should go with, and support an informed common sense in line with Scripture, not go against it. The purpose is to clearly understand and ground the reasons for right action, and to clear away all the mist, leaps and gymnastics of those who advocate error and manipulate truth as a wax-nose.</p></blockquote>

<blockquote><p>§XLVII. The purpose of created man with respect to God is the glory of his goodness, wisdom, power and sanctity (Prov. 16:4; Rom. 11:36). With respect to man, it is eternal life and salvation, which he ought to acquire by the consideration of his purpose and the use of the means (Lev. 18:5; Dt. 30:15,19; Eze. 33:11; Mt. 9:13; Lk. 10:28; Rom. 7:10; also Jn. 3:15-17; 2 Pet. 3:9; 1 Tim. 2:4; 1 Thess. 5:9). With respect to those who do not attend to the purpose of man and neglect the means of life, the end by accident, the event and consequence, is death (Rom. 7:10; Mk. 16:16; Jn. 3:18, 36; Rom. 1:18; 2 Cor. 2:16), and although man may fall short of his end, God is nevertheless not frustrated of his.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), trans. AI Latin</span></figcaption>

<div class="actions"><button class="copy" data-copy="“§XLVII. The purpose of created man with respect to God is the glory of his goodness, wisdom, power and sanctity (Prov. 16:4; Rom. 11:36). With respect to man, it is eternal life and salvation, which he ought to acquire by the consideration of his purpose and the use of the means (Lev. 18:5; Dt. 30:15,19; Eze. 33:11; Mt. 9:13; Lk. 10:28; Rom. 7:10; also Jn. 3:15-17; 2 Pet. 3:9; 1 Tim. 2:4; 1 Thess. 5:9). With respect to those who do not attend to the purpose of man and neglect the means of life, the end by accident, the event and consequence, is death (Rom. 7:10; Mk. 16:16; Jn. 3:18, 36; Rom. 1:18; 2 Cor. 2:16), and although man may fall short of his end, God is nevertheless not frustrated of his.”

— Barthold Holtzfus, ‘Theological Dissertation on Creation’, (Frankfurt: Steppinus, 1706), trans. AI Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7XLVII.+The+purpose+of+created+man+with+respect+to+God+is+the+glory+of+his+goodness%2C+wisdom%2C+power+and+sanctity+%28Prov.+16%3A4%3B+Rom.+11%3A36%29.+With+respect+to+man%2C+it+is+eternal+life+and+salvation%2C+which+he+ought+to+acquire+by+the+consideration+of+his+purpose+and+the+use+of+the+means+%28Lev.+18%3A5%3B+Dt.+30%3A15%2C19%3B+Eze.+33%3A11%3B+Mt.+9%3A13%3B+Lk.+10%3A28%3B+Rom.+7%3A10%3B+also+Jn.+3%3A15-17%3B+2+Pet.+3%3A9%3B+1+Tim.+2%3A4%3B+1+Thess.+5%3A9%29.+With+respect+to+those+who+do+not+attend+to+the+purpose+of+man+and+neglect+the+means+of+life%2C+the+end+by+accident%2C+the+event+and+consequence%2C+is+death+%28Rom.+7%3A10%3B+Mk.+16%3A16%3B+Jn.+3%3A18%2C+36%3B+Rom.+1%3A18%3B+2+Cor.+2%3A16%29%2C+and+although+man+may+fall+short+of+his+end%2C+God+is+nevertheless+not+frustrated+of+his.%E2%80%9D%0A%0A%E2%80%94+Barthold+Holtzfus%2C+%E2%80%98Theological+Dissertation+on+Creation%E2%80%99%2C+%28Frankfurt%3A+Steppinus%2C+1706%29%2C+trans.+AI+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5d68c0c067.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5d68c0c067.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/man-the-image-of-god#:~:text=XLVII.%20The%20purpose%20of%20created%20man,is%20nevertheless%20not%20frustrated%20of%20his&amp;text=XLVII.%20The%20purpose%20of%20created%20man%20with%20respect&amp;text=end%2C%20God%20is%20nevertheless%20not%20frustrated%20of%20his" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The nature of a thing: not how it is, but how it is meant to be… It is as though a physician who saw only broken arms assumed that if arms have no fractures there must be something wrong with them. How could we correct such a misguided physician? By calling his attention to the purpose or function of the arms, to their proper work. Broken arms cannot do their work as well as intact ones; therefore, brokenness is not their natural state. The nature of a thing is not determined by how something happens to be, but by what it is for — by what it is designed to do and to become, if everything goes well… What are men and women for? In one respect they are for the same thing: Being rational, they are for the knowledge of the truth, especially the truth about God. But there is a difference. A man is a rational being of that sex whose members are potentially fathers, and a woman is a rational being of that sex whose members are potentiality mothers. …potentiality is not the same thing as physical possibility. Consider a man who is infertile because of some disease. Although it is not physically possible for him to be a father, we should not say that he lacks the potentiality for fatherhood; as a man, he has the potentiality, but the disease has blocked its realization. It is just because he is a man, just because he is endowed with the potentiality for fatherhood, that the block to its physical realization is such an occasion for sorrow. Another reason why the expression ‘potentiality for fatherhood’ requires explanation is that although siring children is the most characteristic expression of fatherhood, it is far from its only expression… We can carry this line of reasoning still further. A potentiality is something like a calling. It wants, so to speak, to develop; it demands, so to speak, a response. It is like an arrow, notched in the string and aimed at the target, even if it never takes flight. It intimates an inbuilt meaning and expresses an inbuilt purpose, which cannot help but influence the mind and will of every person imbued with them… although not every woman is called to marry and bear physical children, ‘every woman, whether married or unmarried, is called upon to be a biological, psychological or spiritual mother.’ I am saying that for men, the reality is parallel. Not every man is called to marry and bear physical children, but every man, whether married or unmarried, is called upon to be a biological, psychological or spiritual father.</p></blockquote>

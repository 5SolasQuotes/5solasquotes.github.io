<blockquote><p>4. If providence necessitate him, as he is chased by persecution to one city, and is banished out of that, that he must fly to another and from that to another, and from that to a third, and is providentially necessitated to have no certain dwelling, as was Abraham and the saints’ case, Heb. 11:37-38; 1 Cor. 4:11, so was Christ’s case, Mt. 8:20…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-db1e04fa84" data-kw="">
<blockquote><p>1. Particular converts are first converted into the Church-catholic entitive, and secondarily conjoined into particular consociations, for the more opportune enjoyment of ordinances actually and constantly. 2. Every member of a particular congregation is a member of the Church-catholic entitive, and that relation does primarily belong unto him. 3. External profession of the true faith and subjection to God’s ordinances is enough to make a man capable of being a member of the Church-catholic visible, and so also of a particular congregation, quoad externam formam [as far as the external form]. 4. By baptism members are visibly and ministerially admitted into the Church-catholic visible. 5. By excommunication rightly administered, an offender is cast out of the Church-catholic visible, as much as out of a particular congregation. 6. Federal holiness belongs to none primarily because [they are] born of members of a particular congregation, but [rather as they are] of the Church-catholic. 7. They that are only in the Church-catholic visible are not ‘without’ in the apostle’s sense [1 Cor. 5:12]. 8. Children of believing parents have right to baptism, though their parents were not members of any particular congregation, and [they] are debarred from their due if [they are] denied it. 9. Every visible believer is or ought to be a member of the particular Church wherein and among whom he dwells. [This ought to be qualified by regular circumstances conducing to edification.] 10. The being in the general Covenant [of Grace] gives right to the ordinances, and not any particular covenant; neither do we find any mention in Scripture of any particular covenant either urged or used at admission of members into a particular congregation, or at the constitution thereof. 11. The invisible members of the Church which have internal communion with Christ are also visible members and have external communion in external ordinances. 12. The departure of a member from a particular congregation and removal to another for convenience or by necessity is no sin; but departing from the Church-catholic, and ceasing to be a member thereof, is a sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Essence &amp; Unity of the Church catholic, Visible, &amp; the Priority Thereof in Regard of Particular Churches, in Answer to the Objections made Against it</cite>, in Question 2, ‘Concerning Private Members’, pp. 257-8 of A Vindication of the Essence &amp; Unity of the Church catholic, Visible, &amp; the Priority Thereof in Regard of Particular Churches, in Answer to the Objections made Against it… (London, 1650)</span></figcaption>

<blockquote><p>IV. As to the people’s case, it needs no other answer: 1. No member may remove without cause: 2. Nor abruptly and uncharitably to the church’s dissatisfaction, when he may avoid it. But 3. He may remove upon many just causes (private or public) whether the church and pastors consent or not, so the manner be as becomes a Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, (1673), pt. 3, Christian Ecclesiastics, Question 104, ‘Is a pastor obliged to his flock for life? Or is it lawful so to oblige himself? And may he remove without their consent? And so also of a church-member, the same questions are put.’ Baxter was a congregationalist.</span></figcaption>

</figure><figure class="quote" id="q-330a4ce05d" data-kw="">
<blockquote><p>Mr. Hooker [a congregationalist]: ‘It’s a staple rule, no man by nature has an ecclesiastical power over another by constraint; one comes a Christian convert from China, to a country or city where many churches are, none of them can, by the rule of the Gospel, compel him to join with one more than another. He may freely choose what is most suitable to his heart, and may be most to promote his spiritual edification.’ [Rutherford’s] Answer: …The man comes from China acknowledging God in all his ways, as Abraham left his country (Gen. 12); if he be an idolater, they should not lodge him (2 Jn. 10); he comes not as indifferent to be married [the analogy used by congregationalists for joining] to this or this church, or to none at all; as a man sins not if he marry none at all (1 Cor. 7). But if he be a professor that joins to no Church, he lives scandalously; therefore the adequate cause of membership, or to this membership, is not mutual consent, as in marriage, but both parties are under a command to confess Christ before men; and its a selfish thing to make a man’s own heart the judge and determiner of his membership, and not the churches led by the rule of the Word: and so the Church is obliged to receive him, and he is obliged to join a member, according to Cant. 1:7-8; Mt. 10:32.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Mr. Hooker [a congregationalist]: ‘It’s a staple rule, no man by nature has an ecclesiastical power over another by constraint; one comes a Christian convert from China, to a country or city where many churches are, none of them can, by the rule of the Gospel, compel him to join with one more than another. He may freely choose what is most suitable to his heart, and may be most to promote his spiritual edification.’ [Rutherford’s] Answer: …The man comes from China acknowledging God in all his ways, as Abraham left his country (Gen. 12); if he be an idolater, they should not lodge him (2 Jn. 10); he comes not as indifferent to be married [the analogy used by congregationalists for joining] to this or this church, or to none at all; as a man sins not if he marry none at all (1 Cor. 7). But if he be a professor that joins to no Church, he lives scandalously; therefore the adequate cause of membership, or to this membership, is not mutual consent, as in marriage, but both parties are under a command to confess Christ before men; and its a selfish thing to make a man’s own heart the judge and determiner of his membership, and not the churches led by the rule of the Word: and so the Church is obliged to receive him, and he is obliged to join a member, according to Cant. 1:7-8; Mt. 10:32.”

— Samuel Rutherford, A Survey of the Survey of that Sum of Church-Discipline penned by Mr. Thomas Hooker… wherein the way of the churches of N. England is now re-examined (London, 1658), Book 3, ch. 1, p. 282-3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMr.+Hooker+%5Ba+congregationalist%5D%3A+%E2%80%98It%E2%80%99s+a+staple+rule%2C+no+man+by+nature+has+an+ecclesiastical+power+over+another+by+constraint%3B+one+comes+a+Christian+convert+from+China%2C+to+a+country+or+city+where+many+churches+are%2C+none+of+them+can%2C+by+the+rule+of+the+Gospel%2C+compel+him+to+join+with+one+more+than+another.+He+may+freely+choose+what+is+most+suitable+to+his+heart%2C+and+may+be+most+to+promote+his+spiritual+edification.%E2%80%99+%5BRutherford%E2%80%99s%5D+Answer%3A+%E2%80%A6The+man+comes+from+China+acknowledging+God+in+all+his+ways%2C+as+Abraham+left+his+country+%28Gen.+12%29%3B+if+he+be+an+idolater%2C+they+should+not+lodge+him+%282+Jn.+10%29%3B+he+comes+not+as+indifferent+to+be+married+%5Bthe+analogy+used+by+congregationalists+for+joining%5D+to+this+or+this+church%2C+or+to+none+at+all%3B+as+a+man+sins+not+if+he+marry+none+at+all+%281+Cor.+7%29.+But+if+he+be+a+professor+that+joins+to+no+Church%2C+he+lives+scandalously%3B+therefore+the+adequate+cause+of+membership%2C+or+to+this+membership%2C+is+not+mutual+consent%2C+as+in+marriage%2C+but+both+parties+are+under+a+command+to+confess+Christ+before+men%3B+and+its+a+selfish+thing+to+make+a+man%E2%80%99s+own+heart+the+judge+and+determiner+of+his+membership%2C+and+not+the+churches+led+by+the+rule+of+the+Word%3A+and+so+the+Church+is+obliged+to+receive+him%2C+and+he+is+obliged+to+join+a+member%2C+according+to+Cant.+1%3A7-8%3B+Mt.+10%3A32.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Survey+of+that+Sum+of+Church-Discipline+penned+by+Mr.+Thomas+Hooker%E2%80%A6+wherein+the+way+of+the+churches+of+N.+England+is+now+re-examined+%28London%2C+1658%29%2C+Book+3%2C+ch.+1%2C+p.+282-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F330a4ce05d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/330a4ce05d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=Mr.%20Hooker%20%5Ba%20congregationalist%5D%3A%20%E2%80%98It%E2%80%99s%20a,according%20to%20Cant.%201%3A7%2D8%3B%20Mt.%2010%3A32&amp;text=Mr.%20Hooker%20%5Ba%20congregationalist%5D%3A%20%E2%80%98It%E2%80%99s%20a%20staple%20rule&amp;text=a%20member%2C%20according%20to%20Cant.%201%3A7%2D8%3B%20Mt.%2010%3A32" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-15279c9495" data-kw="">
<blockquote><p>Yet surely as ministers derive their power from the Mediator Christ, so magistrates derive theirs from God Almighty, and both by vertue of their office, commission and capacity are unavoidably obliged to join their power and policy together for the suppression and punishment of vice and wickedness and the promoval and encouragement of virtue and piety, for no less will God call civil magistrates to an account for their negligence and maladministrations than Church pastors and ministers; therefore both should amicably correspond and cordially concur for advancing the peace and purity of the Church, for which purpose it is our hearty vote that God would pour forth a spirit of wisdom, zeal and holiness upon magistrates, ministers and all ranks and degrees of persons, Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-clark.html">James Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Presbyterial Government Described</cite>, … (Edinburgh, 1695), no page number</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>31. But the sense of these places [1 Jn. 2 and 2 Pet. 2] is that Christ gave Himself (which we easily acknowledge) as a sufficient price for the whole world and for the false teachers themselves. Even so, those alone are effectually redeemed who acknowledge this grace; not those who delight themselves in their own captivity, and are rejecters of Christ, such as are the reprobate.

32. We have already warned above about those universal passages that they ought to be, in certain places, restricted to all the elect, whom the Lord has [as his own], not only in Judea but also in all parts of the world, in which sense it may also be said that “the blood of Christ is a propitiation for the whole world”—although this text we freely acknowledge to be about sufficiency. … 37. However, it is incredible shamelessness of those critics which drives them to write that our church doctrine about the death of Christ, and its efficacy being limited to the elect and believers alone, leads people to despair, because one cannot deduce anything certain from mere particular propositions. …

9. We accordingly conclude with the Scriptures that all the elect or believers in Christ are saved by Christ…

10. But as one error begets another, our adversaries claiming that God equally loves all and that Christ died effectually for all, although they nominally admit there to be a certain number of the elect, nevertheless they undermine the whole force of divine election, and instead they move into the military camp of the Pelagians, who make foreseen faith and [foreseen] unbelief the cause of salvation and death, of election and reprobation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-tossanus.html">Daniel Tossanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on the place of the divine Paul</cite>, 1 Cor 15:22, ‘For as in Adam all die, so also in Christ shall all be made alive; and on the question: Whether Christ died for all? trans. Michael Lynch (Heidelberg: Smesmann, 1589) Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-cec55288b5" data-kw="">
<blockquote><p>Rejection of the errors of those: Who teach that Christ died for each and everyone sufficiently not only with regard to the worth, but even by reason of the intention, or for all conditionally if they believe; or who assert that Scripture teaches that Christ died for all men in general, and particularly that the Scripture passages Ezek. 18:21, etc., and 33:11; John 3:16; I Tim. 2:4; II Pet. 3:9 ought to extend to each and every man, and that the universality of love and grace is proved by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/genevan.html">Donald Davis Grohman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Genevan Reactions to the Saumur Doctrines of Hypothetical Universalism</cite>, Donald D. Grohman, The Genevan Reactions to the Saumur Doctrines of Hypothetical Universalism: 1635-1685 Th.D. diss, (Knox College in cooperation with Toronto School of Theology. 1971), pp. 231-35 For context see ‘Donald Grohman on Dort and the 1649 Genevan Articles’ at Calvin &amp; Calvinism and Grohman.</span></figcaption>

</figure><figure class="quote" id="q-b739b4f72c" data-kw="">
<blockquote><p>They further argue, that Christ is the meritorious cause of the resurrection; and since he has merited nothing for the wicked or reprobate they shall not be raised. The answer to which is, that Christ is the meritorious cause of the resurrection of life, but not of the resurrection of damnation; the saints will rise to life by virtue of union to Christ, through his merit, and the power of his resurrection: not so the wicked; they will rise, not through his merit, and by virtue of union to him, but by his almighty power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, bk. 7, ch. 4 (Of the Resurrection of the Body)</span></figcaption>

</figure><figure class="quote" id="q-d8e09614c0" data-kw="">
<blockquote><p>Whether Christ died for us, that is vicariously and in our place, and further that salvation was brought forth for us? It is affirmed against the Socinians. … Whether He is our mediator only so far as a messenger is? It is denied. Whether Christ truly reconciled us to the Father, or whether our redemption done through that indeed was only metaphorical? The former is affirmed, the latter is denied. … Whether Christ’s death is meritorious to us, or it was in truth a preparation only unto his priesthood? The former is affirmed. Whether the dogma of satisfaction and merit in the sacred pages is founded, or repugnant to right reason? The former is affirmed, the latter is denied. …</p></blockquote>

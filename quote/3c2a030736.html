<main class="wrap"><figure class="quote" id="q-3c2a030736" data-kw="">
<blockquote><p>Were there no more in praying but a communion with God, how sweet is it? When Christ prays, the ‘fashion of his countenance is changed,’ Lk. 9:29. There is a heaven in the bosom of prayer, though there were never a granting of the suit; sure there is a sin in making heaven a hire and in making duty a relative thing, a horse for a journey, a ship for a voyage to fetch home gold, where as there is heaven in praising God before the Throne, such as is both work and wages, and so in spiritual duties here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened… (1655)</cite>, p. 71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/nature-and-necessity-of-prayer.html">Nature and Necessity of Prayer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f3f8afa285" data-kw="">
<blockquote><p>Oh, all you who know and delight in this King, observe all this. Let it wound your heart; let your soul bleed; and for sorrow let your eyes cry rivers of tears by reason of the fact that this glorious King of His Church is thus despised and scorned. Pray continually for Him (Ps. 72:15) and to Him, that He would reveal Himself to His Church as King before the eyes of the entire world. ‘Give ear, O Shepherd of Israel, Thou that leadest Joseph like a flock; Thou that dwellest between the cherubims, shine forth. Before Ephraim and Benjamin and Manasseh stir up thy strength, and come and save us’ (Ps. 80:1-2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service, vol. 1, ch. 21, ‘The Kingly Office of Jesus Christ’</cite>, p. 568</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/nature-and-necessity-of-prayer.html">Nature and Necessity of Prayer</a></span></div>

</figure><figure class="quote" id="q-dcb5d925b1" data-kw="">

</figure><figure class="quote" id="q-7ccd6764ee" data-kw="">
<blockquote><p>We do not reject the commemoration or honorable mention of the dead saints, nor an annual thanksgiving for those who have departed in the faith of Christ: besides we have acknowledged that we may pray for a blessed resurrection, for a public absolution in the day of judgment and the perfect happiness of deceased believers, without any superstition. Hence that solemn prayer in our English [Anglican] Church, when the dead are conveyed to the tomb: ‘Almighty God… beseeching Thee, that it may please Thee of thy gracious goodness shortly to accomplish… that we, with all those who are departed in the true faith of thy holy name, may have our perfect consummation and bliss, both in body and soul, in they eternal and everlasting glory, etc.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Prayers of the Papists for the Dead are Vain’, p. 222 in The Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridge trans. Josiah Allport (1634; 1846) bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/nature-and-necessity-of-prayer.html">Nature and Necessity of Prayer</a></span></div>

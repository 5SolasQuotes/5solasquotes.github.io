<main class="wrap"><figure class="quote" id="q-2ae067612c" data-kw="">
<blockquote><p>And now that so much as I have said is required, active Obedience to legal, civil Authority to all Magistrates in their legal commands in civil matters; or at least passive yielding to the penalty of the Laws, in case of not obeying actively; and neither further then to legal commands of legal Authority, appears by the Apostle’s reason in this 1. verse. For there is no power but of God; which he redoubles in a second phrase, The powers that be are ordained of God, or under God … Every soul must be under their order … because they all are ordered by God under him, his deputies and vicegerents in their order and degree, higher and highest.

This is true of all powers, and therefore to all must subjection be performed. And to none hath God ordered or ordained any Authority but legal. Which as none will deny (no not the Doctor himself) of other Governors besides the supreme: So can none with reason affirm, that any hath more authority then the Laws, whether special or general, written or unwritten, have allotted them. Which Laws God ratifies (being not against his) and so the Authority according to them.

And this our Doctor also confesses (in sense) in more places then one of his Book, for active Obedience, that no more is due, but according to the Laws of God, and the established laws of the Land. Only he argues for passive obedience beyond this, every where. 1. Because he argues against resistance even of Tyranny. But in a word to refute this from the Apostle’s reason in the first verse.

If I be bound to be subject to tyranny, (or to suffer violence of a tyrant) by virtue of the commandment here. Then tyranny is the Ordinance of God, or Magistrates have power ordained of God to use tyrannous violence (for thus the Apostle argues for subjection from God’s ordaining the power) But this is false. Ergo, so is that, that I should be bound to suffer tyrannous violence. …

But I say again, that by all the foregoing context, and the reason from God’s Ordinance in the second verse: The prohibition of blaming of resistance, goes no further, then, of legal commands of legal authority. The Doctor will not (doth not) say that the most peremptory, or obstinate refusing to obey actively tyrannous and illegal commands is resistance. By what authority then of the Text or context will he stretch the prohibition to refusing to suffer tyrannous violence?

Or how does any resist unlawfully (though by Arms) when unlawful violence is offered him? which God no where gave authority to use to him, nor ever commanded him to yield unto? In a word, till God’s Ordinance can be proved allowing tyranny (which can never be) or undeniably ordaining a man to suffer it, which is no where in his word (I mean the extremity of tyranny depriving of life, or so) though often it is so in his providence, when he affords no means of resistance: This Text of the Apostle will no way condemn the resisting by Arms tyrannous and illegal outrageous violences. Besides all that, the context following refuses this sense of the Doctor, as I have already shewed. …

Then besides all that hath been said on the Text and context, I only add this: That then every meanest Officer (if wicked) may ruin the whole neighbourhood, because he may not be resisted by Arms, who yet will bring Arms to act his villanies. And so the blessed Ordinance of God in Magistracy shall turn to the greatest curse to Mankind (the best and most conscientious of them) that can be imagined, in regard of outward sufferings, and general confusion.

It remains therefore that as the Apostle in the following verses, banishes tyranny out of the context, describing every where a righteous Magistrate, and not a tyrant: So tyranny is to be banished out of the interpretation of this Text, which allows him that is a tyrant, no security, that he shall be endured, and not resisted even with Arms. Though it doth (and that most justly and necessarily) secure a just ruling Prince or Magistrate from all resistance, even when he punishes most severely according to Law and justice, upon the heaviest guilt of being found resisters against God (that resist such a rule) and the heaviest penalty of damnation.</p></blockquote>

<blockquote><p>I. The first thing is, to take notice of some of those pernicious winds wherewith the church of Christ is infested while here in a militant state.

1. Then, There is the wind of open violence, persecution, and bloodshed. The roaring lion he delights in blood, especially the blood of the saints, who are the true seed of the woman, and therefore commonly this is the first thing that he essays in order to ruin the church of Christ. Hence he instigated Cain to slay his brother Abel. He instigated the Jews to crucify the Lord of glory, and to persecute his apostles: and the Romans, by ten several persecutions, to raze the Christian church if possible from the face of the earth.

And it is well known how he did instigate malignant men in power under some reigns before the late revolution, to essay, by persecution and bloodshed, to raze a covenanted reformation, and all that owned it, from off the face of the earth. And we see the same spirit of enmity at this day raging against that same work and cause under another denomination; only the great Angel of the covenant does not allow as yet that wind to blow; but how soon the permission is given, I make no doubt but we may see the Grassmarket, and other places through Scotland, reeking as fast as ever with the blood of the saints.</p></blockquote>

<blockquote><p>In a disputation by writing, those of the other part [Richard Baxter and others] formed an argument, whose major proposition was to this sense… ‘Whatsoever book [of law] enjoins nothing but what is of itself lawful, and by lawful authority, enjoins nothing that is sinful’. We denied this proposition, and at last gave diverse reasons of our denial; amongst which one was that ‘It may be unlawful by accident, and therefore sinful’… And I must confess I am still guilty of so much weakness as to be confident that ‘Some things, not evil of themselves, may have accidents so evil as may make it a sin to him that shall command them.’ Is this opinion inconsistent with all government? Yea I must confess myself guilty of so much greater weakness as that I thought I should never have found a man on earth that had the ordinary reason of a man, that had made question of it; yea I shall say more than that which has offended, viz, ‘That whensoever the commanding or forbidding of a thing indifferent is like to occasion more hurt than good, and this may be foreseen, the commanding or forbidding it is a sin.’ … I think Paul spake not anything inconsistent with the government of God or man when he bid both the rulers and the people of the Church not to destroy him with their meat for whom Christ died: and when he says, he hath not his power to destruction, but to edification; yea there are evil accidents of a thing, not evil of itself, that are caused by the commander: and it is my opinion that they may prove his command unlawful.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“In a disputation by writing, those of the other part [Richard Baxter and others] formed an argument, whose major proposition was to this sense… ‘Whatsoever book [of law] enjoins nothing but what is of itself lawful, and by lawful authority, enjoins nothing that is sinful’. We denied this proposition, and at last gave diverse reasons of our denial; amongst which one was that ‘It may be unlawful by accident, and therefore sinful’… And I must confess I am still guilty of so much weakness as to be confident that ‘Some things, not evil of themselves, may have accidents so evil as may make it a sin to him that shall command them.’ Is this opinion inconsistent with all government? Yea I must confess myself guilty of so much greater weakness as that I thought I should never have found a man on earth that had the ordinary reason of a man, that had made question of it; yea I shall say more than that which has offended, viz, ‘That whensoever the commanding or forbidding of a thing indifferent is like to occasion more hurt than good, and this may be foreseen, the commanding or forbidding it is a sin.’ … I think Paul spake not anything inconsistent with the government of God or man when he bid both the rulers and the people of the Church not to destroy him with their meat for whom Christ died: and when he says, he hath not his power to destruction, but to edification; yea there are evil accidents of a thing, not evil of itself, that are caused by the commander: and it is my opinion that they may prove his command unlawful.”

</figure><figure class="quote" id="q-643bfc56c0" data-kw="">
<blockquote><p>A people may be, by God’s special commandment, subject to a conquering Nebuchadnezzar and a Caesar, as to their king, as was Judah commanded by the prophet Jeremiah to submit unto the yoke of the king of Babylon, and to pray for him, and the people of the Jews were to give to Caesar the things of Caesar; and yet both those were unjust conquerors: for those tyrants had no command of God to oppress and reign over the Lord’s people, yet were they to obey those kings; so the passive subjection was just and commanded of God, and the active [subjection], unjust and tyrannous, and forbidden of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>Having, in the first verse, described the origin of civil authority, and shown the conscientious submission due to it, the Apostle proceeds to draw this natural and important conclusion, that “whosoever, therefore, resisteth the power, resisteth the ordinance of God; and they that resist shall receive to themselves damnation.” By destroying the necessary distinction between the office and the right to hold it, and confounding power with the person invested with it, it has been asserted, that all who resist magistrates in the exercise of their authority, incur damnation.

Were this doctrine true, our Covenanting forefathers who refused obedience to many mandates of the reigning prince, took up arms against him, and resisted unto blood in opposing his unlawful authority, must have placed themselves in a most awful predicament. The doctrine, however, is utterly false, and contrary to Scripture, reason, and the practice of good men in all ages of the world. The devil and his agents are identified in nature, disposition, and employment.

So says the Saviour in his dialogue with the Scribes and Pharisees, in the 8th chapter of the Gospel by John; “I speak that which I have seen with my Father: and ye do that which ye have seen with your father. Ye are of your father the devil, and the lusts of your father ye will do.” Regarding the authority of this infernal tyrant, the precept is general and direct. – “Resist the devil and he will flee from you.” Solomon says, “As a roaring lion and a raging bear, so is a wicked ruler over the poor people.” – (Prov. xxviii. 15.) Are lions and bears not to be resisted?

Wicked rulers are actually instigated by the devil, as we read in Rev. ii. 10. “Fear none of these things which thou shalt suffer: behold, the devil shall cast some of you into prison, that ye may be tried, and ye shall have tribulation ten days: be thou faithful unto death, and I will give thee a crown of life.” That tyrannical rulers are, in this passage, proved to be actuated by him, is evident, since the devil casts nobody into prison but by the instrumentality of human agents.

Resistance to these, therefore, must be considered as lawful resistance to the devil himself – that is to say, laudable, rational, and praiseworthy in all who would obey God rather than men. The saints, indeed, being the subjects of that enmity which was put between the seed of the woman and the seed of the or would not submit to Pharaoh’s authority, requiring them to destroy their son, but hid him for a number of months, in order that his life might be preserved – and in doing this we are told, that they were not afraid of the king’s commandment. The same firmness was found in Daniel and his companions in Babylon. They would neither worship Nebuchadnezzar’s golden image, nor cease to pray to God at the mandate of Darius.

New Testament believers were also actuated by the same principle. When Peter and John were imprisoned for teaching the people, and preaching through Jesus the resurrection from the dead, and were commanded not to speak at all, nor teach in the name of Jesus, they boldly remonstrated and refused to obey in the following spirited terms. – “Whether it be right in the sight of God to hearken unto you more than unto God, judge ye. For we cannot be speak the things which we have seen and heard.” (Acts iv. 19, 20.)

If the Apostle Paul inculcates unqualified submission to Caesar, in the passage before us, as has been by some alleged, he must have been a consummate hypocrite and deceiver, utterly unworthy of attention, and refusing to do himself what he imposed upon others. The civil powers under which he lived, had prohibited, under the severest penalties, the publication of the Gospel: yet he says, “necessity is laid upon me; yea, woe is unto me if I preach not the Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-belfast-covenanter.html">The Belfast Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Dissertation on Rom. xiii. 1-6.’ Covenanter</cite></span></figcaption>

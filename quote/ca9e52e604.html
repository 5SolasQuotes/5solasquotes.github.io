<main class="wrap"><figure class="quote" id="q-ca9e52e604" data-kw="">
<blockquote><p>Thus the divine will is also called that which God wants done [voluntas signi], because it signifies what is acceptable to god; what He wants done by us. It is called ‘consequent’ because it follows that eternal antecedent; ‘conditional’ because the commandments, prohibitions, warnings, and promises of God all have a condition of obedience or disobedience attached to them. Finally it is called ‘revealed,’ because it is always explained in the word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Doctrine, pt. 1 in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965)</cite>, ch. 3, (3), proposition 2, p. 48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus the divine will is also called that which God wants done [voluntas signi], because it signifies what is acceptable to god; what He wants done by us. It is called ‘consequent’ because it follows that eternal antecedent; ‘conditional’ because the commandments, prohibitions, warnings, and promises of God all have a condition of obedience or disobedience attached to them. Finally it is called ‘revealed,’ because it is always explained in the word of God.”

</figure><figure class="quote" id="q-54f697d22b" data-kw="">
<blockquote><p>(1.) What we mean by a condition in the gospel-covenant. By a condition of the covenant, we do not mean in the strictest rigid sense of the word, such a restipulation to God from man of perfect obedience in his own person, at all times, so as the least failure therein forfeits all the mercies of the covenant; that is rather the condition of Adam’s covenant of works, than of the evangelical covenant: nor do we assert any meritorious condition, that in the nature of an impulsive cause shall bring man into the covenant and its privileges, or continue him in when brought in. This we renounce as well as you: but our question is about such a condition as is neither in the nature of an act perfect in every degree, nor meritorious in the least of the benefit conferred, nor yet done in our own strength. But plainly and briefly, our question is, Whether there be not something as an act required of us in point of duty, to a blessing consequent by virtue of a promise? Such a thing, whatever it be, hath the nature of a condition, inasmuch as it is antecedent to the benefit of the promise; and the mercy or benefit granted, is suspended until it be performed. The question is not, whether there be any intrinsical worth or value in the thing so required, to oblige the disposer to make or perform the grant or promise, but merely that it be antecedent to the enjoyment of the benefit; and that the disposer of the benefit do suspend the benefit until it be performed? Thus an act or duty of ours, which has nothing at all of merit in it, or answerable value to the benefit it relates to, may be in a proper sense a condition of the said benefit. ‘For what is a condition in the true notion of it, but (1) the suspension of a grant until something future be done?’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“John Flavel’s (1630–1691) Reply to Baptist Hyper-Calvinism from Vindiciæ Legis et Fœderis and the Issue of Conditions” from Vindiciæ Legis et Fœderis: Or, A Reply to Mr. Philip Cary’s Solemn Call (1690) in The Whole Works of the Rev. Mr. John Flavel, 6 vols. (London: Baynes &amp; Son, 1820), vol. 6, pp. 348–56 at Theological Meditations</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

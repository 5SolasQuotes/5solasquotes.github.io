<main class="wrap"><figure class="quote" id="q-9074c0da69" data-kw="">
<blockquote><p>It ought to be particularly noticed, that it is no ordinary token of gratitude which he promises, but such as God required for rare blessings; namely, that the faithful should come into his sanctuary, and there bear solemn testimony to the grace which they had received. The design of public and solemn thanksgiving is, that the faithful may employ themselves in all variety of ways, in serving and honouring God, and that they may encourage one another to act in the same manner. We know that God’s wonderful power shone forth in the protection of David; and that not only by one miracle, but by many. It is, therefore, not wonderful that he brings himself under obligation, by a solemn vow, to make open and public profession of his piety and faithfulness towards God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of Psalms, trans. James Anderson (Bellingham, WA: Logos Bible Software, 2010), 1.378–79.</cite></span></figcaption>

<blockquote><p>36. ‘And kneeling down’. The inward affection is indeed the chiefest thing in prayer; yet the external signs, as kneeling, uncovering of the head, lifting up of the hands, have a double use; the first is, that we exercise all our members to the glory and worship of God; secondly, that by this exercise our sluggishness may be awakened, as it were. There is also a third use in solemn and public prayer, because the children of God do by this means make profession of their godliness, and one of them does provoke another unto the reverence of God. And, as the lifting up of the hands is a token of boldness (fiducia, confidence) and of an earnest desire, so, to testify our humility, we fall down upon our knees.</p></blockquote>

</figure><figure class="quote" id="q-f988c5ccbc" data-kw="">
<blockquote><p>The specific element, then, in the part of worship we are considering is singing. Now it is pleaded that the church has discretionary power to employ instrumental music, as one of the circumstances allowed by our Standards. Let us submit it to the test of the criteria by which these circumstances are determined: First, they are not parts of the acts of worship by which they are modified; but this circumstance is a part of the act of singing praise by which it is performed. Secondly, these circumstances are common to the acts of human societies, not peculiar to, and distinctive of, those of the church. It is very certain that instrumental music is not such a circumstance. It will hardly be said that all societies play on instruments as well as the church. Thirdly, these circumstances are conditions necessary to the performance of the acts of worship, without which they either cannot be done at all, or not done decently and in order. That the singing of praise cannot be performed at all without instrumental music will be affirmed by none. But it may be affirmed that it cannot without it be performed decently and in order. Let it be noticed that the question is not whether it may be performed in an indecent and disorderly manner. Granted; but so may instrumental music. The question is, whether it cannot be done decently and in order without instrumental accompaniment. The question can only be determined by reference of the practice to a permanent and universal standard of propriety and decorum. And to say that the simple singing of God’s praise in His house is indecent and disorderly is to say, that for twelve centuries the church of Christ was guilty of this impropriety; for it is a matter of history that for that period not even the Church of Rome knew anything of instruments in her worship. To say that the simple singing of God’s praise violates the standard of decency and order of this age is to censure the glorious Free Church of Scotland and the Irish Presbyterian Church for an indecent and disorderly conduct of this part of divine worship. The ground, therefore, that instrumental music in public worship is one of those circumstances required by the rule that all things be done decently and in order cannot be maintained without a spirit of arrogance and censoriousness which would itself violate the higher principle of Christian charity. It is submitted, with all modesty, that this line of argument ought to be conclusive with Presbyterians, at least, against ranking instrumental music in public worship as one of the circumstances common to human actions and societies which fall under the discretion of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Discretionary Power of the Church, Matt 28:20’ (1875) in Sermons, ed. George A. Blackburn (1907).</cite></span></figcaption>

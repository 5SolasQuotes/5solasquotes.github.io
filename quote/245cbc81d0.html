<main class="wrap"><figure class="quote" id="q-245cbc81d0" data-kw="">
<blockquote><p>Of what then does our Lord in this place [Mt. 25:35,42] say that the god works of the holy are the cause; for they are added with the causal conjunction ‘for I was an hungered.’ etc.? They are the cause of the full attainment to and enjoyment of this kingdom, not of the right to it… God therefore makes the good works of those who are His, causes both of increasing and daily perfecting their salvation, and at length of fully enjoying it also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputata Ratisbonae, in altero colloqui, Anno XLVI. Et Collocutorum Augustanae Confessionis Responsa … De Justificatione, et locis doctrinae Euangelicae omnibus, quos doctrina de Iustificatione complectitur… (1548) as translated in Forbes, Justification, p. 311. Rutherford quotes from this work of Bucer to the same effect as below approvingly in his Examination, pp. 531-531.</cite>, p. 94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Of what then does our Lord in this place [Mt. 25:35,42] say that the god works of the holy are the cause; for they are added with the causal conjunction ‘for I was an hungered.’ etc.? They are the cause of the full attainment to and enjoyment of this kingdom, not of the right to it… God therefore makes the good works of those who are His, causes both of increasing and daily perfecting their salvation, and at length of fully enjoying it also.”

— Martin Bucer, Disputata Ratisbonae, in altero colloqui, Anno XLVI. Et Collocutorum Augustanae Confessionis Responsa … De Justificatione, et locis doctrinae Euangelicae omnibus, quos doctrina de Iustificatione complectitur… (1548) as translated in Forbes, Justification, p. 311. Rutherford quotes from this work of Bucer to the same effect as below approvingly in his Examination, pp. 531-531., p. 94">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COf+what+then+does+our+Lord+in+this+place+%5BMt.+25%3A35%2C42%5D+say+that+the+god+works+of+the+holy+are+the+cause%3B+for+they+are+added+with+the+causal+conjunction+%E2%80%98for+I+was+an+hungered.%E2%80%99+etc.%3F+They+are+the+cause+of+the+full+attainment+to+and+enjoyment+of+this+kingdom%2C+not+of+the+right+to+it%E2%80%A6+God+therefore+makes+the+good+works+of+those+who+are+His%2C+causes+both+of+increasing+and+daily+perfecting+their+salvation%2C+and+at+length+of+fully+enjoying+it+also.%E2%80%9D%0A%0A%E2%80%94+Martin+Bucer%2C+Disputata+Ratisbonae%2C+in+altero+colloqui%2C+Anno+XLVI.+Et+Collocutorum+Augustanae+Confessionis+Responsa+%E2%80%A6+De+Justificatione%2C+et+locis+doctrinae+Euangelicae+omnibus%2C+quos+doctrina+de+Iustificatione+complectitur%E2%80%A6+%281548%29+as+translated+in+Forbes%2C+Justification%2C+p.+311.+Rutherford+quotes+from+this+work+of+Bucer+to+the+same+effect+as+below+approvingly+in+his+Examination%2C+pp.+531-531.%2C+p.+94&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F245cbc81d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/245cbc81d0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=Of%20what%20then%20does%20our%20Lord,length%20of%20fully%20enjoying%20it%20also&amp;text=Of%20what%20then%20does%20our%20Lord%20in%20this&amp;text=and%20at%20length%20of%20fully%20enjoying%20it%20also" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6cae4a7dae" data-kw="">
<blockquote><p>But this fruit (of Christ’s death) the apostle says belongs not promiscuously to all, but to them only who obey Him; For only these do accept the offered benefit. The rest by their own fault are deprived of it, because they obstinately refuse it: To obey Christ is not only to profess the name of Christ, but it is to acknowledge Christ the only perfect Redeemer, by true affiance to adhere to him and to live worthy the Gospel. This condition is in the whole Gospel required in them that must be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 404 | On Heb.</cite>, 5:9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-4bfd89dcb1" data-kw="">
<blockquote><p>2. Good works are the way in which God hath appointed us to walk in order to our obtaining eternal life.–They are via ad regnum [the way to the kingdom], the path of life, ‘the way to God’s kingdom,’ the work we are to do ere we receive our reward, the race we are to run ere we be crowned [following Voet &amp; Rutherford, 1 Cor. 9:24-25; Heb. 12:1]. Though God save us not for them as meritorious causes of his saving us, yet those that are capable of doing them he doth not ordinarily save without them: [quotes Eph. 2:10 &amp; Heb. 12:14] Though eternal glory be not, as hath been proved, properly a reward, nor God’s giving it an act of strict justice; yet God hath, we acknowledge, determined to give it, per modum praemii, ‘after the manner of a reward;’ in that he will not give men the glory he intends them till they have done him some service; not treat them as conquerers who never fought his battle; not respect them as faithful servants who have been sluggards or loiterers. The ‘sanctification of the Spirit,’ as well as the ‘belief of the truth,’ must go before salvation, ‘because God hath from the beginning chosen us to salvation’ by the one as well as the other. (2 Thess. 2:13)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-veal.html">Edward Veal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the Good Works of Believers be Meritorious of Salvation: Negatum Est [It is Denied]’, pp. 213-214 in Puritan Sermons, 1659-1689, vol. 6</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-c699849847" data-kw="">
<blockquote><p>Faith, therefore, without works, is dead. We are saved by faith. But salvation includes deliverance from sin. If, therefore, our faith does not deliver us from sin, it does not save us. Antinomianism involves a contradiction in terms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, pt. 3, ch. 16, “Faith,” “Sanctification a Fruit of Faith”</span></figcaption>

— Charles Hodge, Systematic Theology, vol. 3, pt. 3, ch. 16, “Faith,” “Sanctification a Fruit of Faith”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFaith%2C+therefore%2C+without+works%2C+is+dead.+We+are+saved+by+faith.+But+salvation+includes+deliverance+from+sin.+If%2C+therefore%2C+our+faith+does+not+deliver+us+from+sin%2C+it+does+not+save+us.+Antinomianism+involves+a+contradiction+in+terms.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+vol.+3%2C+pt.+3%2C+ch.+16%2C+%E2%80%9CFaith%2C%E2%80%9D+%E2%80%9CSanctification+a+Fruit+of+Faith%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc699849847.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c699849847.html">Permalink</a><a class="src" href="https://ccel.org/ccel/hodge/theology3" rel="noopener" target="_blank">Read it online · CCEL, vol. 3</a></div>
</figure><figure class="quote" id="q-72c1ecd2d8" data-kw="">
<blockquote><p>Things commanded, in the unregenerate are sins, because although the actions and doings of those things are commanded, yet the person, from whom those actions proceed, pleases not God, neither is reconciled unto God. Further, that which the unregenerate do, they do it not to that end, whereunto they ought, that is, to the glory of God, neither is their action grounded of faith. For they know not whether or no they have God favorable to them, or whether that be pleasing unto Him which they do. But these conditions and circumstances are necessarily required to a good work: for it suffices not to do good works after a civil manner. Those civil works indeed are good, as they proceed from God: but as they are in unregenerate men, they are evil: even as it is sin, when a wicked man gives alms: because it proceeds not from the love of God and therefore not from faith, neither is referred unto God’s glory. But yet those things which men do being forbidden in the Law of God are of themselves and properly sins, because the nature or definition of sin doth properly agree unto them: which is, that they are done against the express commandment of God. And therefore in the Scripture things which are so done of men, are ever called evil, but never good. But those things which are commanded of God, when they are done by the unregenerate, or in hypocrisy, they are so discommended, as yet nevertheless they are counted and praised for good: and that not only in respect of God, who is the efficient of those things in men, in respect of whom all the actions of the wicked are just: but also in respect of the men themselves by whom they are done, so that they also are said to have done well, as 1 Kings 21, ‘Seest thou how Ahab is humbled before me? Because he submits himself before Me, I will not bring that evil in his days. And 2 Kn. 10, ‘The Lord said unto Jehu: Behold, because thou hast diligently executed that which was right in my eyes etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-ursinus.html">Zachary Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered… in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), Of Sin, 3. How many kinds of sin there are, 5. Sinful in itself or Not</cite>, pp. 94-95</span></figcaption>

— Zachary Ursinus, The Sum of Christian Religion: Delivered… in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), Of Sin, 3. How many kinds of sin there are, 5. Sinful in itself or Not, pp. 94-95">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThings+commanded%2C+in+the+unregenerate+are+sins%2C+because+although+the+actions+and+doings+of+those+things+are+commanded%2C+yet+the+person%2C+from+whom+those+actions+proceed%2C+pleases+not+God%2C+neither+is+reconciled+unto+God.+Further%2C+that+which+the+unregenerate+do%2C+they+do+it+not+to+that+end%2C+whereunto+they+ought%2C+that+is%2C+to+the+glory+of+God%2C+neither+is+their+action+grounded+of+faith.+For+they+know+not+whether+or+no+they+have+God+favorable+to+them%2C+or+whether+that+be+pleasing+unto+Him+which+they+do.+But+these+conditions+and+circumstances+are+necessarily+required+to+a+good+work%3A+for+it+suffices+not+to+do+good+works+after+a+civil+manner.+Those+civil+works+indeed+are+good%2C+as+they+proceed+from+God%3A+but+as+they+are+in+unregenerate+men%2C+they+are+evil%3A+even+as+it+is+sin%2C+when+a+wicked+man+gives+alms%3A+because+it+proceeds+not+from+the+love+of+God+and+therefore+not+from+faith%2C+neither+is+referred+unto+God%E2%80%99s+glory.+But+yet+those+things+which+men+do+being+forbidden+in+the+Law+of+God+are+of+themselves+and+properly+sins%2C+because+the+nature+or+definition+of+sin+doth+properly+agree+unto+them%3A+which+is%2C+that+they+are+done+against+the+express+commandment+of+God.+And+therefore+in+the+Scripture+things+which+are+so+done+of+men%2C+are+ever+called+evil%2C+but+never+good.+But+those+things+which+are+commanded+of+God%2C+when+they+are+done+by+the+unregenerate%2C+or+in+hypocrisy%2C+they+are+so+discommended%2C+as+yet+nevertheless+they+are+counted+and+praised+for+good%3A+and+that+not+only+in+respect+of+God%2C+who+is+the+efficient+of+those+things+in+men%2C+in+respect+of+whom+all+the+actions+of+the+wicked+are+just%3A+but+also+in+respect+of+the+men+themselves+by+whom+they+are+done%2C+so+that+they+also+are+said+to+have+done+well%2C+as+1+Kings+21%2C+%E2%80%98Seest+thou+how+Ahab+is+humbled+before+me%3F+Because+he+submits+himself+before+Me%2C+I+will+not+bring+that+evil+in+his+days.+And+2+Kn.+10%2C+%E2%80%98The+Lord+said+unto+Jehu%3A+Behold%2C+because+thou+hast+diligently+executed+that+which+was+right+in+my+eyes+etc.%E2%80%9D%0A%0A%E2%80%94+Zachary+Ursinus%2C+The+Sum+of+Christian+Religion%3A+Delivered%E2%80%A6+in+his+Lectures+upon+the+Catechism%E2%80%A6+tr.+Henrie+Parrie+%28Oxford%2C+1587%29%2C+Of+Sin%2C+3.+How+many+kinds+of+sin+there+are%2C+5.+Sinful+in+itself+or+Not%2C+pp.+94-95&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F72c1ecd2d8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/72c1ecd2d8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-virtues-good-works-of-unbelievers/#:~:text=Things%20commanded%2C%20in%20the%20unregenerate%20are,was%20right%20in%20my%20eyes%20etc&amp;text=Things%20commanded%2C%20in%20the%20unregenerate%20are%20sins%2C%20because&amp;text=that%20which%20was%20right%20in%20my%20eyes%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

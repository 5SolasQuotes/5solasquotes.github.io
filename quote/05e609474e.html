<main class="wrap"><figure class="quote" id="q-05e609474e" data-kw="">
<blockquote><p>It is not lawful to have pictures of Jesus Christ, because his divine nature cannot be pictured at all, and because his body, as it is now glorified, cannot be pictured as it is; and because, if it do not stir up devotion, it is in vain; if it do stir up devotion, it is a worshipping by an image or picture, and so a palpable breach of the Second Commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Explanation of the Assembly’s Shorter Catechism</cite>, (Philadelphia: Presbyterian Board of Publication, n.d.), p. 162</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-cd92ad65d4" data-kw="">
<blockquote><p>2. All representing of the Persons as distinct, as to set out the Father (personally considered) by the image of an old man, as if He were a creature, the Son under the image of a lamb or young man, the Holy Ghost under the image of a dove, all which wrongs the Godhead exceedingly… Again, as to what may be objected from the Lord’s appearing sometimes in the likeness of a man, or the Spirit’s descending as a dove, or as cloven tongues of fire: It is answered:

1. There is a great difference betwixt a sign of the Spirit’s presence, and a representation of the Spirit.

2. Betwixt what represents the Spirit, as He is one of the Persons of the Blessed Trinity, and what resembles some gift of his: The similitude of a dove descending upon Christ was to show his taking up his residence in Him, and furnishing Him with gifts and graces, and particularly holy simplicity and meekness without measure, and so his appearing in cloven tongues was to show his communicating the gift of tongues to the apostles.

3. Neither is there any warrant for drawing Him in these shapes, more than to look on every living dove, as representing Him: and the like may be said of God’s appearing sometimes in human likeness, it was but that men might have some visible help to discern something of God’s presence, but not to give any representation of Him, and these bodies were but for a time assumed, as a praelude and forerunning evidence of the Son’s being to become man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, … (London, 1675), 1st Commandment, p. 56</span></figcaption>

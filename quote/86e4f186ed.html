<main class="wrap"><figure class="quote" id="q-86e4f186ed" data-kw="">
<blockquote><p>Hence, just as the most frequently used writings of the Old Testament in the Church are the Psalms of David, who obtained pardon after his sin, so the most frequently used writings of the New Testament are the epistles of Paul, who obtained mercy, so that by these examples sinners might be aroused to hope; although another reason for this custom could be that in each of these writings is contained almost the whole teaching of theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Epistolam B. Pauli ad Romanos lectura</cite>, (c. 1259-65), Pr. 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc78cdef29" data-kw="">
<blockquote><p>A distinction is real (simply real) if it exists between thing and thing, for example between body and soul, between the members of the body, between cause and effect, between a faculty and its operation, between substance and accidents. A thing, at least according to Scotists, is whatever exists or can exist per se (i.e. through its own existence), and hence, if it is created, it can be directly and immediately produced by physical causality. The sign of a real distinction is separability or actual separation. Thomists, on the contrary, deny that separability is required for having a real distinction. So they say, for example, that faculties are really distinct from the soul though they cannot be separated from it. One must say the like of their real distinction between essence and existence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), ch. 2, On the Attributes in General &amp; on ‘One”, Article 4, ‘On Identity &amp; Distinction’, p. 30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-fa36de1ec1" data-kw="">
<blockquote><p>Cognition, according to St. Thomas, is a form of tendency by which the knower, without ceasing to be himself, becomes something else. A cognitive faculty is a capacity to take on the form of another being. The form received into the intellect is called the intelligible species. By it the knower is given the formal or intelligible determinations of the thing known. Thus informed, the knower actively expresses or acts out the part of the thing known, so that the accidental act of the knower becomes one (in intention) with the act of the thing known… This intention, expressed by the knower and expressing the thing known, has a twofold relation: it is a form or quality perfecting the knower and a relation of likeness to the thing known. Viewed in this latter relation, according to what it expresses, it is essentially the relation of truth, the conformity of intellect to thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-schmidt.html">Robert Schmidt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Domain of Logic according to S. Thomas Aquinas</cite>, (Hague: Martinus Nijhoff, 1966), ‘Conclusion’ | ‘Intention’ 306-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>1. The medieval scholastics that Roman Catholics turn to for the doctrine of God, such as Thomas Aquinas and Bonaventure, were completely ignorant of Greek and Hebrew, so they are incapable of giving a useful discussion of the names of God. Only one question of Aquinas’s Summa is devoted to the names of God ([pt. 1] q. 13), and it doesn’t actually state what his names are and what they mean, how they are used in Scripture, etc. Instead, it focuses on scholastic questions like “Whether any name can be applied to God substantially?” and “Whether what is said of God and of creatures is univocally predicated of them?” Protestant writers, meanwhile, such as Zanchi, Polanus, etc, give lengthy and profound analyses of the names of God in Greek and Hebrew.” (Charles Johnson, ‘No, Roman Catholic authors are not better on the doctrine of God’) . God’s Attributes Agreements Calvin: “I am that I am</p></blockquote>

d Books Online</a></div>
</figure><figure class="quote" id="q-577c12eebf" data-kw="">
<blockquote><p>For we both are, and know that we are, and delight in our being, and our knowledge of it. Moreover, in these three things no true-seeming illusion disturbs us; for we do not come into contact with these by some bodily sense, as we perceive the things outside of us—colors, e.g., by seeing, sounds by hearing, smells by smelling, tastes by tasting, hard and soft objects by touching—of all which sensible objects it is the images resembling them, but not themselves which we perceive in the mind and hold in the memory, and which excite us to desire the objects. But, without any delusive representation of images or phantasms, I am most certain that I am, and that I know and delight in this. In respect of these truths, I am not at all afraid of the arguments of the Academicians, who say, ‘What if you are deceived?’ For if I am deceived, I am. For he who is not, cannot be deceived; and if l am deceived, by this same token I am. And since I am if I am deceived, how am I deceived in believing that I am? for it is certain that I am if I am deceived. Since, therefore, I, the person deceived, should be, even if I were deceived, certainly I am not deceived in this knowledge that I am. And, consequently, neither am I deceived in knowing that I know. For, as I know that I am, so I know this also, that I know. And when I love these two things, I add to them a certain third thing, namely, my love, which is of equal moment. For neither am I deceived in this, that I love, since in those things which I love I am not deceived; though even if these were false, it would still be true that I loved false things. For how could I justly be blamed and prohibited from loving false things, if it were false that I loved them? But, since they are true and real, who doubts that when they are loved, the love of them is itself true and real? Further, as there is no one who does not wish to be happy, so there is no one who does not wish to be. For how can he be happy, if he is nothing?</p></blockquote>

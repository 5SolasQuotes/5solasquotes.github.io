<main class="wrap"><figure class="quote" id="q-e8d63176d2" data-kw="">
<blockquote><p>First, the communion of the Church does not consist in a local union, neither the separation, in removing of places: For there are a great many without, if we look to the place, who yet are within according to charity, and many again in place, that yet if we consider faith, are without: but the true Christian communion consists in the union of faith, and in the union of charity, which St. Augustine calls the nearness, or rather the neighborhood and dwelling together (as I may say) of hearts and agreement in doctrine: and the true separation, in the diversity or contrarieties of the self-same things. Now concerning the union of faith, it consists in that heavenly doctrine, which is comprehended unto us in the old and new Testament, tending only to this point, to make us feel our sin, and to show us a remedy therefore, in one only Jesus Christ crucified… We are therefore united in the Faith, with the patriarchs, prophets, apostles, martyrs, ancient doctors, and generally with the whole Church that was before the Law, under the Law, and under grace, yea and under the tyranny of Antichrist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philip Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter</cite>, [in controversy with Romanism] (London: Barker, 1579), ch. 10, n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

on-of-the-saints/#:~:text=First%2C%20the%20communion%20of%20the%20Church,and%20under%20the%20tyranny%20of%20Antichrist&amp;text=First%2C%20the%20communion%20of%20the%20Church%20does%20not&amp;text=grace%2C%20yea%20and%20under%20the%20tyranny%20of%20Antichrist" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f42aa4e4c7" data-kw="">
<blockquote><p>Saints by profession are also united in one body, and bound to maintain a holy fellowship and communion with each other. Professed saints compose the Church considered as visible… This union is not confined to those who live together, and can assemble in one place for the observance of religious ordinances, but extends to ‘all that in every place call upon the name of Jesus Christ our Lord, both theirs and ours.’ The visible bonds of this unity are specified by the Apostle Paul: ‘There is one body and one Spirit, even as ye are called in one hope of your calling; one Lord, one faith, one baptism; one God and Father of all, who is above all, and through all, and in you all.’ — Eph. iv. 4-6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Confession of Faith of the Westminster Assembly of Divines 4th</cite>, ed. (1845; Johnstone &amp; Hunter, 1850), ch. 26, ‘Of the Communion of Saints’, p. 274</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

</figure><figure class="quote" id="q-88a2cec56e" data-kw="">
<blockquote><p>In whatsoever body life is placed, the power and strength thereof is to guide, and also by a most sure bond to unite all the parts of the whole body, by how great a space soever they be dissevered one from the other: even so the congregation of the godly, which commonly (if the believers be considered of in respect that they be earthly men) is called the Church, how much soever it be compact of sundry people, and has her parts settled a great space one from another in the world: and that, as much as the uttermost quarter of the world is distant by the spaces of regions, from the other part of the world; yet nevertheless it is joined, knit, and couched together. And for that cause it is by Paul compared to a body, and that oftentimes in his epistles unto the Ephesians and Corinthians (Eph. 4:12 and 5:23; 1 Cor. 12:12). But by what bond the Christians (who so greatly differ one from another, whether respect be to their condition, country, or language) are so strictly knit together, it is sufficiently understood, by the order which joins this latter article of our faith unto the former [about the holy, catholic Church]. For there our faith confesses the Holy Ghost, and here it treats of the body of the faithful, which with a sincere faith, embracing the doctrine of Christ, is by Him gathered together in one. …By these things therefore ye understand, that the Church is a mystical body, the which is governed by the Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘I believe in the holy catholic Church, the communion of saints, etc.’ in ch. 18, ‘A plain exposition of Peter Martyr, upon the twelve articles of the Christian faith’ in pt. 2 of The Common Places</cite>, … (d. 1562; London, 1583), p. 630</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

</figure><figure class="quote" id="q-e6de303444" data-kw="">
<blockquote><p>For hence we may reason thus: I am indeed a member of the catholic Church of God, and therefore though my own prayers be weak, yet my comfort is this, I know that I am partaker of all the good prayers of all the people of God dispersed over the face of the whole earth, my fellow members, and of all the blessings which God bestows on them. This will make us in all our troubles to say with Elisha, ‘Fear not, for they that be with us are more than they that be with them.’… And surely though there were no other reason, yet this were sufficient to move a man to embrace Christian religion, considering that being a member of the Church he has part in all the prayers of the saints through the world, and of the blessings of God that come thereby… The communion of the living with the dead stands in two things: the one is, that the saints departed in the Church Triumphant do in general pray for the Church Militant upon earth, desiring the final deliverance of all their fellow members from all their miseries. And therefore in the Apocalypse they cry on this manner, ‘How long Lord holy and true! doest not Thou judge and avenge our blood on them that dwell on the earth. (Rev. 6:10) I say in general, because they pray not for the particular conditions and persons of men upon earth, considering they neither know, nor see, nor hear us: neither can they tell what things are done upon earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles</cite>, … (London, 1595), pp. 511-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

ass="src" href="https://reformedbooksonline.com/on-the-communion-of-the-saints/#:~:text=For%20hence%20we%20may%20reason%20thus,what%20things%20are%20done%20upon%20earth&amp;text=For%20hence%20we%20may%20reason%20thus%3A%20I%20am&amp;text=they%20tell%20what%20things%20are%20done%20upon%20earth" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…when the Creed speaks of the ‘Catholic church,’ meaning true saints, that serve God in truth, it speaks not ‘multitude,’ though it mean ‘universal’. But it speaks, that such are scattered up and down the world; here some in one nation, there some in another; here one in one city, there another in another. II. Therefore, ‘communion of saints’ cannot mean personal or local union, or communion: saints in one place, or in one lump, together: not a college of all saints in one place, but a communion betwixt them, as scattered here and there, all the world over. As there is a communion betwixt two friends, one in Turkey, another in England; one in New England, another in Old [England]… How would you understand that, Mt. 24:31, ‘And he shall send his angels with a great sound of a trumpet, and they shall gather together his elect from the four winds, from one end of heaven to the other.’ By the ‘angels,’ he means his messengers the ministers; by the ‘sound of a trumpet,’ he means the gospel; by the whole he means, that, after the destruction of Jerusalem, of which the speech is in the verses before,–God, by the preaching of the Gospel, would fetch in his elect among all nations, or call home the gentiles. But how gather them together? What, into any one place, or country, or city? No, but into such a communion, as we are speaking of, in the several nations or countries, where they lived: one saint in Judea, another in Assyria, another in Greece: all staying in the place where they receive the gospel, and yet all gathered together into one communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 3. ‘The Communion of Saints’ in An Exposition of Three Articles… (d. 1675), pp. 64-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>
<div class="actions"><button class="copy" data-copy="“…when the Creed speaks of the ‘Catholic church,’ meaning true saints, that serve God in truth, it speaks not ‘multitude,’ though it mean ‘universal’. But it speaks, that such are scattered up and down the world; here some in one nation, there some in another; here one in one city, there another in another. II. Therefore, ‘communion of saints’ cannot mean personal or local union, or communion: saints in one place, or in one lump, together: not a college of all saints in one place, but a communion betwixt them, as scattered here and there, all the world over. As there is a communion betwixt two friends, one in Turkey, another in England; one in New England, another in Old [England]… How would you understand that, Mt. 24:31, ‘And he shall send his angels with a great sound of a trumpet, and they shall gather together his elect from the four winds, from one end of heaven to the other.’ By the ‘angels,’ he means his messengers the ministers; by the ‘sound of a trumpet,’ he means the gospel; by the whole he means, that, after the destruction of Jerusalem, of which the speech is in the verses before,–God, by the preaching of the Gospel, would fetch in his elect among all nations, or call home the gentiles. But how gather them together? What, into any one place, or country, or city? No, but into such a communion, as we are speaking of, in the several nations or countries, where they lived: one saint in Judea, another in Assyria, another in Greece: all staying in the place where they receive the gospel, and yet all gathered together into one communion.”

— John Lightfoot, 3. ‘The Communion of Saints’ in An Exposition of Three Articles… (d. 1675), pp. 64-65">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6when+the+Creed+speaks+of+the+%E2%80%98Catholic+church%2C%E2%80%99+meaning+true+saints%2C+that+serve+God+in+truth%2C+it+speaks+not+%E2%80%98multitude%2C%E2%80%99+though+it+mean+%E2%80%98universal%E2%80%99.+But+it+speaks%2C+that+such+are+scattered+up+and+down+the+world%3B+here+some+in+one+nation%2C+there+some+in+another%3B+here+one+in+one+city%2C+there+another+in+another.+II.+Therefore%2C+%E2%80%98communion+of+saints%E2%80%99+cannot+mean+personal+or+local+union%2C+or+communion%3A+saints+in+one+place%2C+or+in+one+lump%2C+together%3A+not+a+college+of+all+saints+in+one+place%2C+but+a+communion+betwixt+them%2C+as+scattered+here+and+there%2C+all+the+world+over.+As+there+is+a+communion+betwixt+two+friends%2C+one+in+Turkey%2C+another+in+England%3B+one+in+New+England%2C+another+in+Old+%5BEngland%5D%E2%80%A6+How+would+you+understand+that%2C+Mt.+24%3A31%2C+%E2%80%98And+he+shall+send+his+angels+with+a+great+sound+of+a+trumpet%2C+and+they+shall+gather+together+his+elect+from+the+four+winds%2C+from+one+end+of+heaven+to+the+other.%E2%80%99+By+the+%E2%80%98angels%2C%E2%80%99+he+means+his+messengers+the+ministers%3B+by+the+%E2%80%98sound+of+a+trumpet%2C%E2%80%99+he+means+the+gospel%3B+by+the+whole+he+means%2C+that%2C+after+the+destruction+of+Jerusalem%2C+of+which+the+speech+is+in+the+verses+before%2C%E2%80%93God%2C+by+the+preaching+of+the+Gospel%2C+would+fetch+in+his+elect+among+all+nations%2C+or+call+home+the+gentiles.+But+how+gather+them+together%3F+What%2C+into+any+one+place%2C+or+country%2C+or+city%3F+No%2C+but+into+such+a+communion%2C+as+we+are+speaking+of%2C+in+the+several+nations+or+countries%2C+where+they+lived%3A+one+saint+in+Judea%2C+another+in+Assyria%2C+another+in+Greece%3A+all+staying+in+the+place+where+they+receive+the+gospel%2C+and+yet+all+gathered+together+into+one+communion.%E2%80

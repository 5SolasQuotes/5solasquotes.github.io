</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cd99044f54" data-kw="">
<blockquote><p>…we think that some things are tolerated which should not at all be endured. We are not spending so much time on those linen vestments that we would want the progress of God’s Word to be disturbed because of them–even just a little. Yet we judge that they have acted correctly and wisely who have thrown out of their churches that whole form of dress, which is more suited to actors than to ministers of the Word, as well as other remnants of paganism. For surely they can do a great deal of harm, as experience itself has taught; and they cannot help at all. But we certainly do not count the restoring of what has been thrown out among things that are indifferent [adiaphora].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beza, A Clear &amp; Simple Treatise on the Lord’s Supper (1559; RHB, 2016)</cite>, pp. 143-44</span></figcaption>

<blockquote><p>3. They hold that all outward means instituted and set apart to express and set forth the inward worship of God, are parts of Divine worship and that not only all moral actions, but all typical rites and figures, ordained to shadow forth in the solemn worship and service of God, any spiritual or religious act or habit in the mind of man, are special parts of the same, and therefore that every such act ought evidently to be prescribed by the Word of God, or else ought not to be done? it being a sin to perform any other worship to God, whether external or internal, moral or ceremonial, in whole or in part, then that which God Himself requires in his Word.</p></blockquote>

</figure><figure class="quote" id="q-a61f6dd84f" data-kw="">
<blockquote><p>The author looks at the history of the use of the cassock, scarf and bands in Scotland… The scarf is reported as being worn ‘by quite a number of ministers’, its use having been revived ‘about half a century ago’. Theories regarding its origin vary and are described. James Melville writes of seeing John Knox wearing a type of forerunner. They fell into disuse after the Revolution and until ‘our own times’. Bands are medieval in origin, though whether civil or ecclesiastical is in dispute. They are the only article which distinguishes the minister from the probationer. They were worn by some of the clergy in pre-Reformation times and in Reformed circles in England as early as 1566. They appear in Scotland from the end of the 16th century and their use appears unaffected by the Revolution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mcmillan.html">William McMillan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Scottish Ecclesiastical Dress’ Church Service Society Annual, 20 (1950)</cite>, pp. 32-43</span></figcaption>

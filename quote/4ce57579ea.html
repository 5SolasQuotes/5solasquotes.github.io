<blockquote><p>(1.) The life which he now led was a life of faith with respect unto things spiritual and eternal. For he had for the foundation and object hereof, [1.] The promise of the blessed Seed, and the spiritual blessing of all nations in him, as a confirmation of the first fundamental promise to the church, concerning the Seed of the woman that was to break the serpent’s head. And [2] God entered expressly into covenant with him, confirming it with the seal of circumcision, wherein he obliged himself to be his God, his God almighty, or all-sufficient, for his temporal and eternal good. To suppose that Abraham saw nothing in this promise and covenant but only things confined unto this life, nothing of spiritual grace or mercy, nothing of eternal reward or glory, is so contrary to the analogy of faith, to express testimony of Scripture, so destructive of all the foundations of religion, so unworthy of the nature and properties of God, rendering his title of “the father of the faithful,” and his example in believing, so useless, as that it is a wonder men of any tolerable sobriety should indulge to such an imagination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews, ed. W. H. Goold, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 24.67.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>This article will address the claim that Thomas Aquinas held to an Augustinian doctrine of predestination essentially compatible with that of the Reformed Churches, showing in what ways Thomas’s doctrine is compatible with the doctrine of the Reformed Churches and important ways in which it differs… Thomas did teach the perseverance of the elect, but not perseverance of the saints. What we mean by this is that he taught that all the elect will persevere, but that not only the elect, but many besides, are called to faith and given real conversion and grace, and eventually fall away. Their state in this life differs nothing from the elect. In keeping with this, one may not know in this life whether they are elect or reprobate.</p></blockquote>

</figure><figure class="quote" id="q-b6bfd17c0d" data-kw="">
<blockquote><p>I come now to the next attribute expressed in this proclamation, merciful: ‘The Lord, the Lord God, strong, gracious, merciful, abundant in goodness and truth, keeping mercy for thousands, forgiving iniquity, transgression, and sin,’ Ex. 34:6-7. Things attributed to God here are of three sorts: 1. The inward disposition or inclination, or aptitude and readiness to mercy, that is in the four first attributes, merciful, gracious, long-suffering, much in goodness, and truth is added. 2. There are his purposes and resolutions of mercy, keeping mercy for thousands; and they are immanent acts in God, kept and laid up in God’s own breast. 3. There are extrinsical acts of mercy issuing from both: ‘pardoning iniquity, transgression, and sin.’ The meaning plainly is, first, God is merciful as He is Jehovah; that is his nature. Secondly, He fully resolves to show mercy; there is his heart. Thirdly, He has done it, and does it every day, in pardoning sin; there is his wont and practice. So that God is every way merciful: in his nature, in his purposes, and in his deeds and performance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Object &amp; Acts of Justifying Faith, pt. 1, bk. 1, ch. 8, on Ex. 34:6-7 in The Works (d. 1680; Edinburgh: James Nichol, 1864), vol. 8</cite>, p. 55</span></figcaption>

<blockquote><p>yes: Baxter holds that Christ died for all men; but I cannot say that I am quite at one with what some of our friends have written on the subject of the atonement. I do not, for example, entirely agree with what Mr. Haldane says on that subject. I think that the word world, as applied in Scripture to the sacrifice of Christ, has been unnecessarily restricted; the common way of explaining it is that it simply includes Gentiles as well as Jews. [John 3:16] I do not like that explanation, and I think that there is one text that puts that interpretation entirely aside. The text to which I allude is, that “God commandeth all men, everywhere to repent. [Acts 17:30]”</p></blockquote>

<blockquote><p>8. He invites, Isa. 55:1-3, ‘Ho, every one that thirsteth come ye to the waters, and he that hath no money come, yea buy and eat without money, and without price;’ and again, verse 3, ‘Incline your ear and come unto Me, and your soul shall live;’ Hark how He calls, Mt. 11:29, ‘Come unto Me all ye that are weary, and heavy laden, and I will ease you.’ The Father says come, the Son says come, the Spirit says come; you that are in the hedges come; He sends out his servants to highway-people, Mt. 22:9. To as many as are found there: Why stay you disputing his will when He so often says ‘Come, come‘? Rev. 22:17, ‘The Spirit and the Bride say ‘Come,’ and let him that heareth say ‘Come,’ and let him that is athirst come, and whosoever will let him drink of the water of life freely.’ Is not all this enough to let thee know God is willing, and Christ is willing to receive thee? Lo, Christ will come to thee. 9. See that essence of glory bowing the heavens and coming down, laying aside his robes of majesty, and putting on thy filthy garments; see Him tiring Himself in going about from place to place upon no other errand than this, to cry at the markets, ‘Oh, if any sinners love life, happiness; if any will go to heaven: let them come to Me; I will show them the way to my father’s bosom and endear them to my fathers heart.’ Read his sermons, observe his pains; thou wilt find a willing Savior, not excepting publicans and harlots from the kingdom of God. 10. Wouldst thou have more tokens of his will yet? See Him dying, hanging upon the cross, dropping out his last blood, breathing out his last breath, stretching out his dying arms to encircle sinners should run in to Him, breathing out the breath of free grace in his very last act upon a thief that had not an hour to live; Who shall despair? who shall say Christ is not willing to save him, and not blaspheme eternal love? Speak truth! corrupt heart say thou art not willing to be saved. 11. Is not this yet enough? Observe Him setting ministers in his Church, lest thou shouldst not read, and none should tell thee the truth of his eternal love, to speak out his good will in thine ears: All our errand is nothing but this: Sinners, Christ is willing to save you; And as ambassadors for Christ, as though God did beseech you by us, we pray you in Christ’s stead to be ye reconciled to God, 2 Cor. 5:20. Why canst thou not believe his will? Consider in thy Savior’s will there is not only a latitude for, but an eagerness of thy eternal salvation: Why therefore dost thou say, ‘My sins are so great that God will not pardon me?’ Believe; O blaspheme not the God of infinite good-will.</p></blockquote>

e saved. 11. Is not this yet enough? Observe Him setting ministers in his Church, lest thou shouldst not read, and none should tell thee the truth of his eternal love, to speak out his good will in thine ears: All our errand is nothing but this: Sinners, Christ is willing to save you; And as ambassadors for Christ, as though God did beseech you by us, we pray you in Christ’s stead to be ye reconciled to God, 2 Cor. 5:20. Why canst thou not believe his will? Consider in thy Savior’s will there is not only a latitude for, but an eagerness of thy eternal salvation: Why therefore dost thou say, ‘My sins are so great that God will not pardon me?’ Believe; O blaspheme not the God of infinite good-will.”

— John Collinges, The Works of John Collings, vol. 1 (London: Tomlins, 1655), A Cordial for a Fainting Soul, pp. 57–58">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C8.+He+invites%2C+Isa.+55%3A1-3%2C+%E2%80%98Ho%2C+every+one+that+thirsteth+come+ye+to+the+waters%2C+and+he+that+hath+no+money+come%2C+yea+buy+and+eat+without+money%2C+and+without+price%3B%E2%80%99+and+again%2C+verse+3%2C+%E2%80%98Incline+your+ear+and+come+unto+Me%2C+and+your+soul+shall+live%3B%E2%80%99+Hark+how+He+calls%2C+Mt.+11%3A29%2C+%E2%80%98Come+unto+Me+all+ye+that+are+weary%2C+and+heavy+laden%2C+and+I+will+ease+you.%E2%80%99+The+Father+says+come%2C+the+Son+says+come%2C+the+Spirit+says+come%3B+you+that+are+in+the+hedges+come%3B+He+sends+out+his+servants+to+highway-people%2C+Mt.+22%3A9.+To+as+many+as+are+found+there%3A+Why+stay+you+disputing+his+will+when+He+so+often+says+%E2%80%98Come%2C+come%E2%80%98%3F+Rev.+22%3A17%2C+%E2%80%98The+Spirit+and+the+Bride+say+%E2%80%98Come%2C%E2%80%99+and+let+him+that+heareth+say+%E2%80%98Come%2C%E2%80%99+and+let+him+that+is+athirst+come%2C+and+whosoever+will+let+him+drink+of+the+water+of+life+freely.%E2%80%99+Is+not+all+this+enough+to+let+thee+know+God+is+willing%2C+and+Christ+is+willing+to+receive+thee%3F+Lo%2C+Christ+will+come+to+thee.+9.+See+that+essence+of+glory+bowing+the+heavens+and+coming+down%2C+laying+aside+his+robes+of+majesty%2C+and+putting+on+thy+filthy+garments%3B+see+Him+tiring+Himself+in+going+about+from+place+to+place+upon+no+other+errand+than+this%2C+to+cry+at+the+markets%2C+%E2%80%98Oh%2C+if+any+sinners+love+life%2C+happiness%3B+if+any+will+go+to+heaven%3A+let+them+come+to+Me%3B+I+will+show+them+the+way+to+my+father%E2%80%99s+bosom+and+endear+them+to+my+fathers+heart.%E2%80%99+Read+his+sermons%2C+observe+his+pains%3B+thou+wilt+find+a+willing+Savior%2C+not+excepting+publicans+and+harlots+from+the+kingdom+of+God.+10.+Wouldst+thou+have+more+tokens+of+his+will+yet%3F+See+Him+dying%2C+hanging+upon+the+cross%2C+dropping+out+his+last+blood%2C+breathing+out+his+last+breath%2C+stretching+out+his+dying+arms+to+encircle+sinners+should+run+in+to+Him%2C+breathing+out+the+breath+of+free+grace+in+his+very+last+act+upon+a+thief+that+had+not+an+hour+to+live%3B+Who+shall+despair%3F+who+shall+say+Christ+is+not+willing+to+save+him%2C+and+not+blaspheme+eternal+love%3F+Speak+truth%21+corrupt+heart+say+thou+art+not+willing+to+be+saved.+11.+Is+not+this+yet+enough%3F+Observe+Him+setting+ministers+in+his+Church%2C+lest+thou+shouldst+not+read%2C+and+none+should+tell+thee+the+truth+of+his+eternal+love%2C+to+speak+out+his+good+will+in+thine+ears%3A+All+our+errand+is+nothing+but+this%3A+Sinners%2C+Christ+is+willing+to+save+you%3B+And+as+ambassadors+for+Christ%2C+as+though+God+did+beseech+you+by+us%2C+we+pray+you+in+Christ%E2%80%99s+stead+to+be+ye+reconciled+to+God%2C+2+Cor.+5%3A20.+Why+canst+thou+not+believe+his+will%3F+Consider+in+thy+Savior%E2%80%99s+will+there+is+not+only+a+latitude+for%2C+but+an+eagerness+of+thy+eternal+salvation%3A+Why+therefore+dost+thou+say%2C+%E2%80%98My+sins+are+so+great+that+God+will+not+pardon+me%3F%E2%80%99+Believe%3B+O+blaspheme+not+the+God+of+infinite+good-will.%E2%80%9D%0A%0A%E2%80%94+John+Collinges%2C+The+Works+of+John+Collings%2C+vol.+1+%28London%3A+Tomlins%2C+1655%29%2C+A+Cordial+for+a+Fainting+Soul%2C+pp.+57%E2%80%9358&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa777c354c8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a777c354c8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=8.%20He%20invites%2C%20Isa.%2055%3A1%2D3%2C%20%E2%80%98Ho,not%20the%20God%20of%20infinite%20good%2Dwill&amp;text=8.%20He%20invites%2C%20Isa.%2055%3A1%2D3%2C%20%E2%80%98Ho%2C%20every%20one&amp;text=O%20blaspheme%20not%20the%20God%20of%20infinite%20good%2Dwill" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

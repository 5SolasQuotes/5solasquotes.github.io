<main class="wrap"><figure class="quote" id="q-dc6148f3bb" data-kw="">
<blockquote><p>‘Do not harshly rebuke an elder.’ He now recommends to Timothy gentleness and moderation in correcting faults. Correction is a medicine, which has always some bitterness, and consequently is disagreeable. Besides, Timothy being a young man, his severity would have been less tolerable, if it had not been somewhat moderated. ‘But exhort him as a father.’ The Apostle enjoins him to reprove elder persons as parents; and he even employs the milder term, ‘exhort.’ It is impossible not to be moved with reverence, when we place before our eyes our father or our mother; in consequence of which, instead of harsher vehemence, we are immediately influenced by modesty. Yet it ought to be observed, that he does not wish old men to be spared or indulged in such a manner as to sin with impunity and without correction; he only wishes that some respect should be paid to their age, that they may more patiently bear to be admonished. ‘The younger as brethren.’ Even towards younger persons he wishes moderation to be used, though not in an equal degree; for the vinegar must always be mingled with oil, but with this difference, that reverence should always be shown to older persons, and equals should be treated with brotherly gentleness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Timothy</cite>, 5:1</span></figcaption>

enses%20exercised%20to%20discern%20good%20and%20evil" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>All the officers of the New Testament both ordinary and extraordinary are designed and distinguished by their names, or compellations, as apostles, evangelists, presbyters, deacons. The extraordinary and superior have upon good reason the names of the ordinary and inferior common unto them, as the apostles are called ‘elders’ (1 Pet. 5:1). But this is not reciprocal, for the ordinary and inferior are never called by the names of the extraordinary and superior: the deacon is not called an ‘elder,’ nor the pastor by the name of the ‘apostle’ or ‘evangelist’. It is true that Barnabas is called an ‘apostle’ (Acts 14:4, 14) because he was an apostle [messenger] of Christ as Paul was. Titus and others and Epaphroditus are only called ‘apostles’ or messengers of the Church (2 Cor. 8:23; Phil. 2:25). Whence it must follow that the office of a bishop is not an office superior to the office of a pastor, since the name ‘bishop’ is common to the pastor; and that the office of a bishop and the office of a pastor are not different, but one and the same office, since the names are altogether common in all the places of the New Testament (Acts 20:28; Phil 1:1; 1 Tim. 3:2; 1 Pet. 5:1), and the Syriac Interpreter has translated the one by the other (Tit. 1:7). What reason can there be, while the officers are distinguished by their names and the names of ‘bishop’ and ‘pastor’ are common, but that the office of the bishop and elder is one and the same office; the one name signifying, sapientiae maturitatem [a maturity of wisdom], and the other Industriam curae Pastoralis [the industry of the pastoral oversight], says Beda.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unlawfulness and danger of Limited Prelacy, or Perpetual Presidency in the Church, Briefly Discovered</cite>, (1641), pp. 3-4</span></figcaption>

<main class="wrap"><figure class="quote" id="q-a52597727f" data-kw="">
<blockquote><p>For my part I cannot understand that the continuation of our justification has any other dependencies than has our justification itself. As faith alone is required unto the one, so faith alone is required unto the other, although its operations and effects in the discharge of its duty and office in justification, and the continuation of it, are diverse; nor can it otherwise be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-perseverance.html">Justification and Perseverance</a></span><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a> › <a href="../topics/justification/faith-alone/sola-fide.html">Sola fide</a></span><span class="t"><a href="../topics/arminians-remonstrants/neonomianism.html">Arminians (Remonstrants): Neonomianism</a> › <a href="../topics/arminians-remonstrants/neonomianism/reply-christs-righteousness-alone.html">Reply: Christ’s righteousness alone</a></span></div>

</figure><figure class="quote" id="q-7143ae7aa4" data-kw="">
<blockquote><p>A very few words will also free our inquiry from any concernment in that which is called sentential justification, at the day of judgement; for of what nature soever it be, the person concerning whom that sentence is pronounced was, — (1.) Actually and completely justified before God in this world; (2.) Made partaker of all the benefits of that justification, even unto a blessed resurrection in glory: “It is raised in glory,” 1 Cor. xv. 43. (3.) The souls of the most will long before have enjoyed a blessed rest with God, absolutely discharged and acquitted from all their labours and all their sins; there remains nothing but an actual admission of the whole person into eternal glory. Wherefore this judgement can be no more but declaratory, unto the glory of God, and the everlasting refreshment of them that have believed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 6</span></figcaption>

</figure><figure class="quote" id="q-b49c3cf9d4" data-kw="">
<blockquote><p>“It is God that justifieth;” and, therefore, the continuation of our justification is his act also. And this, on his part, depends on the immutability of his counsel; the unchangeableness of the everlasting covenant, which is “ordered in all things, and sure;” the faithfulness of his promises; the efficacy of his grace; his complacency in the propitiation of Christ; with the power of his intercession, and the irrevocable grant of the Holy Ghost unto them that do believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>

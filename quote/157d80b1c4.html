<main class="wrap"><figure class="quote" id="q-157d80b1c4" data-kw="">
<blockquote><p>It must not be omitted, that if any article is stated as necessary to be known, which cannot be understood, unless some other article shall have been previously understood and believed; that other article must also rank among those which are necessary. For example; it is necessary to know that we are saved only by the grace of our Lord Jesus Christ; for the Apostle Paul says, “If any man preach any other gospel unto you than that which we have preached unto you, let him be accursed.” But this can be neither understood nor believed, unless we know that sin has plunged us into so deep an abyss of misery, that our deliverance surpassed our own power, and even the united exertions of all creatures. Thus, from the necessity of the article respecting our deliverance, we strongly infer the necessity of the article respecting our misery. …When any thing, in fine, the necessity of which must have been more doubtful, is expressly represented as necessary to be known; it follows, that a doctrine will also be necessary, the necessity of which we should have been less, or at least not more, disposed to question. To give an instance of this: the Apostle teaches that the article regarding justification by faith in Christ without the works of the law, is necessary, when he asserts that they who are “ignorant of God’s righteousness, and going about to establish their own righteousness, have not submitted themselves to the righteousness of God.” The necessity of this article being thus demonstrated; it unavoidably follows, that it is necessary for us to know also, that, considered in ourselves, we are obnoxious to condemnation and wrath: for this last article is much more evident than the former, and more obvious to every one that is willing to examine himself; nor, without the knowledge of it, can we be induced to seek that righteousness which is in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacred Dissertations, on What Is Commonly Called the Apostles’ Creed</cite>, trans. Donald Fraser vol. 1 (Edinburgh: A. Fullarton &amp; Co., 1823), 25–26.</span></figcaption>

</figure><figure class="quote" id="q-9713d497d0" data-kw="">
<blockquote><p>Nor ought it to be doubted that condign merit can vary in these three ways. For if some work were much inferior to the reward promised by agreement—as if the lord of a vineyard hired laborers and promised as wages, not a denarius a day, but a hundred gold pieces—such merit would be ex condigno by reason of the pact, not by reason of the work. Conversely, if the work were really equal to the reward, or perhaps even greater, but no agreement had intervened, then if such merit ought to be called ex condigno, it would have to be called ex condigno by reason of the work, not by reason of the pact. … Finally, if a pact both intervenes and the work is truly equal to the reward, as when laborers are hired for the vineyard for a denarius a day according to the Gospel, that merit will be ex condigno by reason of the work and by reason of the pact.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.17 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-d9c2f60bea" data-kw="">
<blockquote><p>A threefold act of faith is to be considered and distinguished in justification: One is dispositional, by which I believe that Christ by His merit is the forgiveness of sins, according to the teaching of the Gospel, and thus my sins will also be forgiven me if I repent and truly rest in Christ’s merit. And when this act of faith is accompanied by our misery recognized from God’s law, and that hunger and thirst for righteousness, about which Matthew 5:6 speaks, the accused is thus put in a state, as the Pragmatists say, to receive and hear his absolving sentence. Therefore, as faith regarding this act precedes actual forgiveness of sins in the forum of heaven and conscience, so it is also required in the Word to obtain it. The second is formally justifying, by which, when the justifying and absolving sentence is pronounced and made known to me by the spirit of adoption, I believe in the present for me, sorrowing over sin and henceforth promising serious amendment, that God through Christ has forgiven all my sins, both those I have committed so far and those into which I may fall due to weakness in the future; and that God will never impute them to me for condemnation but, attributed with my Saviour’s righteousness, will regard me as innocent and certainly grant eternal life. And this act is simultaneous with the actual justification and forgiveness of sins. The third is consolatory, by which in the past I believe all my sins have already been forgiven me, and I am no longer under any condemnation, as Paul says in Rom. 8:1, and I trust that the absolution previously made known to me will be extended and applied by God’s mercy to daily sins of intrusion, for which I also daily seek forgiveness in that sense in the Lord’s Prayer. And this act of faith follows justification and forgiveness of sins. Hence it is clear in what sense and to what extent faith is a condition sought for it; for in the first sense, faith relates to justification antecedently, in the second simultaneously, in the third consequentially.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162 | LXVI. Samuel Maresius also teaches clearly in his System, in the eleventh place, thesis 57. He says:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“A threefold act of faith is to be considered and distinguished in justification: One is dispositional, by which I believe that Christ by His merit is the forgiveness of sins, according to the teaching of the Gospel, and thus my sins will also be forgiven me if I repent and truly rest in Christ’s merit. And when this act of faith is accompanied by our misery recognized from God’s law, and that hunger and thirst for righteousness, about which Matthew 5:6 speaks, the accused is thus put in a state, as the Pragmatists say, to receive and hear his absolving sentence. Therefore, as faith regarding this act precedes actual forgiveness of sins in the forum of heaven and conscience, so it is also required in the Word to obtain it. The second is formally justifying, by which, when the justifying and absolving sentence is pronounced and made known to me by the spirit of adoption, I believe in the present for me, sorrowing over sin and henceforth promising serious amendment, that God through Christ has forgiven all my sins, both those I have committed so far and those into which I may fall due to weakness in the future; and that God will never impute them to me for condemnation but, attributed with my Saviour’s righteousness, will regard me as innocent and certainly grant eternal life. And this act is simultaneous with the actual justification and forgiveness of sins. The third is consolatory, by which in the past I believe all my sins have already been forgiven me, and I am no longer under any condemnation, as Paul says in Rom. 8:1, and I trust that the absolution previously made known to me will be extended and applied by God’s mercy to daily sins of intrusion, for which I also daily seek forgiveness in that sense in the Lord’s Prayer. And this act of faith follows justification and forgiveness of sins. Hence it is clear in what sense and to what extent faith is a condition sought for it; for in the first sense, faith relates to justification antecedently, in the second simultaneously, in the third consequentially.”

— Louis Le Blanc, Theological Theses put forth at Various Times at the Academy of Sedan, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162 | LXVI. Samuel Maresius also teaches clearly in his System, in the eleventh place, thesis 57. He says:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+threefold+act+of+faith+is+to+be+considered+and+distinguished+in+justification%3A+One+is+dispositional%2C+by+which+I+believe+that+Christ+by+His+merit+is+the+forgiveness+of+sins%2C+according+to+the+teaching+of+the+Gospel%2C+and+thus+my+sins+will+also+be+forgiven+me+if+I+repent+and+truly+rest+in+Christ%E2%80%99s+merit.+And+when+this+act+of+faith+is+accompanied+by+our+misery+recognized+from+God%E2%80%99s+law%2C+and+that+hunger+and+thirst+for+righteousness%2C+about+which+Matthew+5%3A6+speaks%2C+the+accused+is+thus+put+in+a+state%2C+as+the+Pragmatists+say%2C+to+receive+and+hear+his+absolving+sentence.+Therefore%2C+as+faith+regarding+this+act+precedes+actual+forgiveness+of+sins+in+the+forum+of+heaven+and+conscience%2C+so+it+is+also+required+in+the+Word+to+obtain+it.+The+second+is+formally+justifying%2C+by+which%2C+when+the+justifying+and+absolving+sentence+is+pronounced+and+made+known+to+me+by+the+spirit+of+adoption%2C+I+believe+in+the+present+for+me%2C+sorrowing+over+sin+and+henceforth+promising+serious+amendment%2C+that+God+through+Christ+has+forgiven+all+my+sins%2C+both+those+I+have+committed+so+far+and+those+into+which+I+may+fall+due+to+weakness+in+the+future%3B+and+that+God+will+never+impute+them+to+me+for+condemnation+but%2C+attributed+with+my+Saviour%E2%80%99s+righteousness%2C+will+regard+me+as+innocent+and+certainly+grant+eternal+life.+And+this+act+is+simultaneous+with+the+actual+justification+and+forgiveness+of+sins.+The+third+is+consolatory%2C+by+which+in+the+past+I+believe+all+my+sins+have+already+been+forgiven+me%2C+and+I+am+no+longer+under+any+condemnation%2C+as+Paul+says+in+Rom.+8%3A1%2C+and+I+trust+that+the+absolution+previously+made+known+to+me+will+be+extended+and+applied+by+God%E2%80%99s+mercy+to+daily+sins+of+intrusion%2C+for+which+I+also+daily+seek+forgiveness+in+that+sense+in+the+Lord%E2%80%99s+Prayer.+And+this+act+of+faith+follows+justification+and+forgiveness+of+sins.+Hence+it+is+clear+in+what+sense+and+to+what+extent+faith+is+a+condition+sought+for+it%3B+for+in+the+first+sense%2C+faith+relates+to+justification+antecedently%2C+in+the+second+simultaneously%2C+in+the+third+consequentially.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+put+forth+at+Various+Times+at+the+Academy+of+Sedan%2C+vol.+2+3rd+ed.+tr.+AI+by+Colloquia+Scholastica+%281645%3B+London%3A+Moses+Pitt%2C+1683%29+Le+Blanc+%281614-1675%29+was+a+reformed+professor+of+theology+at+Sedan%2C+France.+%7C+%E2%80%98On+Justifying+Faith%E2%80%99%2C+pt.+1%2C+pp.+141+%26+146-56%2C+162+%7C+LXVI.+Samuel+Maresius+also+teaches+clearly+in+his+System%2C+in+the+eleventh+place%2C+thesis+57.+He+says%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd9c2f60bea.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d9c2f60bea.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/faith#:~:text=A%20threefold%20act%20of%20faith%20is,second%20simultaneously%2C%20in%20the%20third%20consequentially&amp;text=A%20threefold%20act%20of%20faith%20is%20to%20be&amp;text=in%20the%20second%20simultaneously%2C%20in%20the%20third%20consequentially" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Read sober books. Those that are given to reading, are as much under the influence of the books they read, as of the persons they converse with, and therefore in the choice of them you need to be very cautious, and take advice. Nothing more prompts vanity, especially among the refined part of mankind, than romances and plays, and loose poems; and thus even their solitudes and retirements, which we hope might contribute to their seriousness, are lost, and make them more vain, and more ingeniously so.

Let us therefore take the same method to make us sober, more sober; converse with those books which are substantial and judicious, out of which we may learn wisdom. The Book of God is given us on purpose to make us wise to salvation; make it familiar to you, and let it dwell in you richly. Let it lead you, let it talk with you; and do you follow it, and talk with it, Prov. vi. 22. And many other good books we have to help us to understand and apply the scripture, which we should be conversant with. Inquire not for merry books, songs, and jests, but serious books, which will help to put you into, and keep you in a serious frame.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sober-Mindedness Pressed upon Young People, in a Discourse on Titus II.6</cite>, (1712) in The Complete Works of the Rev. Matthew Henry; Being a Collection of all his Treatises, Sermons, and Tracts, as Published by Himself: And a Memoir of his Life (2 vols, Edinburgh: A. Fullarton and Co., 1853), 1: 82.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13c4f8ba15" data-kw="">
<blockquote><p>The Office. The death of Jesus Christ, as being every way powerful for reconcilement and union, did not only break down the partition-wall of guiltiness that stood betwixt God and man, but the wall of ceremonies that stood betwixt the Jews and the Gentiles: it made all that believe one with God, and made of both one, as the Apostle speaks —united them one to another.

The way of salvation was made known, not to one nation only, but to all people: so that whereas the knowledge of God was before confined to one little corner, it is now diffused through the nations; and whereas the dignity of their priesthood staid in a few persons, all they who believe are now thus dignified to be priests unto God the Father.

And this was signified by the rending of the vail of the Temple at his death; not only that those ceremonies and sacrifices were to cease, as being all fulfilled in him, but that the people of God, who were before by that vail held out in the outer court, were to be admitted into the Holy Place, as being all of them priests, and fitted to offer sacrifices.

The Priesthood of the Law was holy, and its holiness was signified by many outward things suitable to their manner, by anointings, and washings, and vestments; but in this spiritual priesthood of the Gospel, holiness itself is instead of all those, as being the substance of all. The children of God are all anointed, and purified, and clothed with holiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary upon the First Epistle General of Saint Peter</cite>, (1693-94) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 1: 236.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-75f12122c0" data-kw="">
<blockquote><p>…I will set down a catalogue of inventions of men used for religious ends and uses without any commandment of God, and that both before the Law and under the Law, and under the Gospel. First, before the Law we read of these things: The laying of the hand under the thigh in swearing, Gen. 24, etc. [Gen. 24:26, “And the man bowed down his head, and worshipped the Lord.”] Jacob’s pillar erected, as a religious monument, Gen. 28:18. Secondly, under the Law we read of these instances: [Josh. 7:6, “And Joshua rent his clothes, and fell to the earth upon his face before the ark of the Lord until the eventide, he and the elders of Israel, and put dust upon their heads.”] The altar of the two tribes and a half, Josh. 22:10 &amp; 27:30. [Josh. 24:25-27, “So Joshua made a covenant with the people that day, and set them a statute and an ordinance in Shechem. And Joshua wrote these words in the book of the law of God, and took a great stone, and set it up there under an oak, that was by the sanctuary of the Lord. And Joshua said unto all the people, Behold, this stone shall be a witness unto us; for it hath heard all the words of the Lord which he spake unto us: it shall be therefore a witness unto you, lest ye deny your God.] [1 Sam. 7:5-6, “Samuel said, Gather all Israel to Mizpeh, and I will pray for you unto the Lord. And they gathered together to Mizpeh, and drew water, and poured it out before the Lord, and fasted on that day, and said there, ‘We have sinned against the Lord.&#x27;”] David’s dancing and playing on all sorts of instruments and songs before the ark, 1 Chron. 13:8 and 15:16 and 2 Sam. 6:14. David’s wearing of a linen ephod, the garment of the Levites, 1 Chron. 15:27. David’s appointing of the offices of the Levites and his bringing in of the new order of singing men into the Temple, 1 Chron. 24 &amp; 25. The use of sackcloth and ashes in fasting. Solomon built another altar besides the altar of the Lord, 2 Chron. 7:7. Hezekiah kept the Passeover at a time not appointed by the Law, and the people kept it seven days longer, 2 Chron. 30:2-3, 23. About the celebration of the Passover, it is manifest that the godly Jews brought in of their own heads:

1. The gesture of sitting, which Christ Himself also used.

2. The solemn use of the cup, of which mention is made also that Christ used it, Lk. 22:17. The Rechabites abstinence not only from wine (according to the Law of the Nazarites), but from husbandry and houses, Jer. 35. The Jews had everywhere synagogues, which were not commanded by the Law, Lk. 7:5. [Jer. 34:18-19, “And I will give the men that have transgressed my covenant, which have not performed the words of the covenant which they had made before me, when they cut the calf in twain, and passed between the parts thereof, The princes of Judah, and the princes of Jerusalem, the eunuchs, and the priests, and all the people of the land, which passed between the parts of the calf;”] Mordecai appointed the feasts of Pur, or ‘lots’. Judas Maccabeus appointed the feast of Tabernacles, which our Saviour graced with his presence [Jn. 7:2]. Thirdly, under the Gospel: Our Savior Christ approved the gesture of sitting and the cup at the Passover, the Jewish synagogues, and the feast of Tabernacles. The apostle Paul used the Jewish ceremonies when they were no more the ordinances of God, as circumcision, shaving the head, purifying, vowing, contributing, yea sacrificing, Acts 21. Abstaining from meat sacrificed to idols. The observation of the Jewish Sabbath. The women’s coverings, 1 Cor. 11. The love-feasts. The holy kiss.</p></blockquote>

<blockquote><p>Alas! Sirs, you may make a shift to pass through this world unsuspected; many Moralists, yea, Christians, may subscribe their Names to your Testimonial, and give you the Right Hand of fellowship in this world, when you must be set at the Left in the next: Things will not then be carried as they are now. Deal faithfully with God and your own Souls; see you have the Root of the Matter, the Life of Grace: you may herd amongst the Sheep now, and be found amongst Goats at last.

A King will give his Subjects liberty to travel into another King’s Dominions, reserving their Loyalty to their own King: Papists in Queen Elizabeth’s days, being commanded to go to Church, or be punished, sent to the Pope for a Resolution of this Case of Conscience: His Answer was, They might comply; but Fili, da mihi cor, My Son, give me thy Heart: Thus the Devil will give you leave to read, pray, hear, receive, attend on Ordinances; but as long as he hath you fast by the Heart-strings, you are still his Slaves, none of God’s Servants: for the Soul is the Man: As a man thinketh in his Heart, so is he, Prov. 23.7.

As a man’s Principles are stated, so he receives his denomination, a good or a bad, a Jew, or an Heathen; a Saint or a Bruit. If you have a Beast’s Heart in the shape of a Man, God will esteem you no better than a Beast. And it’s an usual Saying, It is better be a Beast, than be like a Beast. It is the Saying of a Learned Man. Some make the Image of the Living God hewn out of the Stock of a dead Tree: But the New Creature is not such a lifeless thing as many imagine: It is the Spirit of power, of love, and of a sound mind, 2 Tim. 17.

This Text, (saith a good Divine) doth express the three parts of God’s Image in the New Creature … certainly this vital Principle hath strong and vigorous motions God-wards, and against Sin; It’s an holy Spark, working upwards to God, and forwards straight for Heaven: Most Professors are mistaken in this great Work; though Ministers are oft calling on you Sinners to look about you, we tell you, there’s a Cheat in the case, Satan is busy to lay his Brats in God’s Bed.

Counterfeit Coin is common; our Warnings now will be thought of, these frequent Summons will ring in your Ears, our Sermons will have a Repetition in this, or in another world: Conscience will gall you, and you cannot plead Ignorance, or say, [non putâram] I thought not of such a day. How often do we tell you of the danger of dying in your old state, and of that Sulphurous Lake, that thousands are scolded in that once lived as securely as you now do, and they are in an hopeless, helpless Eternity; and how can you tell but this may be the last day? the last warning or overture of Grace, the last knock at your Door? God may say, Away, be gone out of my sight, take him, Devil, I will no more be troubled with such a Miscreant.

But if after all this, you be senseless, and lie still while you are nailed in your Coffin, you are dead, twice dead; and this Security is a confutation of that Principle, that Adam and his Posterity by the Fall, is not dead, but sleepeth, or only in a swound and languor, but life is in him: No, no, this sad Stupor or Spiritual Lethargy, shews it’s not an excitation of a principle, but an infusion of new Life: all our shouting, and rubbing, and pricking, will not recover Sinners; we must leave them to a creating Power, and to him that can raise the Dead.</p></blockquote>

<blockquote><p>In our days we see that because there hath been much crying out against holy days, some also will not stick to cry out against the Sabbath. Well, if a papist in all other general points of doctrine should be truly converted unto Christ, and for want of instruction doubteth of the Sabbath, we are in love to deal with him, and for a season to support his weakness. How be it we must remember that the weak must not always be born with, as appeareth by the Apostle’s words chap 15:2. Let every man please his neighbour in that, that is good to edification.

So long then as the error is of weakness, and that it is but an infirmity in the man, from which by the knowledge of the truth he would be rid and be delivered, he must be born with. But if it proceed of illusion, obstinacy, and of a prefract [sic] judgment as deceived by the devil, then he must not be borne with, no not even now a days: nay, if we be herein faulty, the error is not so tolerable in us, as it was in them, in that they wanted the old and New Testament, both which are so abundantly opened unto us. But if one truly repenting him of his sins, and faithfully believing in Christ, shall through ignorance be afraid of the Sabbath, as of a servile ceremony, he is so far to be borne with, as he desireth to come to the truth, and if he come once to be obstinate, he is no longer to be borne with.</p></blockquote>

— Richard Greenham, A Treatise of the Sabbath in The Works of Richard Greenham – Volume Two">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+our+days+we+see+that+because+there+hath+been+much+crying+out+against+holy+days%2C+some+also+will+not+stick+to+cry+out+against+the+Sabbath.+Well%2C+if+a+papist+in+all+other+general+points+of+doctrine+should+be+truly+converted+unto+Christ%2C+and+for+want+of+instruction+doubteth+of+the+Sabbath%2C+we+are+in+love+to+deal+with+him%2C+and+for+a+season+to+support+his+weakness.+How+be+it+we+must+remember+that+the+weak+must+not+always+be+born+with%2C+as+appeareth+by+the+Apostle%E2%80%99s+words+chap+15%3A2.+Let+every+man+please+his+neighbour+in+that%2C+that+is+good+to+edification.%0A%0ASo+long+then+as+the+error+is+of+weakness%2C+and+that+it+is+but+an+infirmity+in+the+man%2C+from+which+by+the+knowledge+of+the+truth+he+would+be+rid+and+be+delivered%2C+he+must+be+born+with.+But+if+it+proceed+of+illusion%2C+obstinacy%2C+and+of+a+prefract+%5Bsic%5D+judgment+as+deceived+by+the+devil%2C+then+he+must+not+be+borne+with%2C+no+not+even+now+a+days%3A+nay%2C+if+we+be+herein+faulty%2C+the+error+is+not+so+tolerable+in+us%2C+as+it+was+in+them%2C+in+that+they+wanted+the+old+and+New+Testament%2C+both+which+are+so+abundantly+opened+unto+us.+But+if+one+truly+repenting+him+of+his+sins%2C+and+faithfully+believing+in+Christ%2C+shall+through+ignorance+be+afraid+of+the+Sabbath%2C+as+of+a+servile+ceremony%2C+he+is+so+far+to+be+borne+with%2C+as+he+desireth+to+come+to+the+truth%2C+and+if+he+come+once+to+be+obstinate%2C+he+is+no+longer+to+be+borne+with.%E2%80%9D%0A%0A%E2%80%94+Richard+Greenham%2C+A+Treatise+of+the+Sabbath+in+The+Works+of+Richard+Greenham+%E2%80%93+Volume+Two&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8c419ca35a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8c419ca35a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/04/07

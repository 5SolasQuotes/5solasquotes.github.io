<main class="wrap"><figure class="quote" id="q-68f9c7e4a4" data-kw="">
<blockquote><p>The almighty power, unsearchable wisdom, and infinite goodness of God so far manifest themselves in his providence, that it extendeth itself even to the first fall, and all other sins of angels and men; and that not by a bare permission, but such as hath joined with it a most wise and powerful bounding, and otherwise ordering, and governing of them, in a manifold dispensation, to his own holy ends; yet so, as the sinfulness thereof proceedeth only from the creature, and not from God, who, being most holy and righteous, neither is nor can be the author or approver of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 5.4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-15d6eeac77" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 6.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/permission-of-sin.html">Permission of sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“Our first parents, being seduced by the subtlety and temptation of Satan, sinned, in eating the forbidden fruit. This their sin, God was pleased, according to his wise and holy counsel, to permit, having purposed to order it to his own glory.”

</figure><figure class="quote" id="q-52550c975a" data-kw="Hardening Author of sin">
<blockquote><p>When God is here spoken of as hardening some of the children of men, it is not to be understood that God by any positive efficiency hardens any man&#x27;s heart. There is no positive act in God, as though he put forth any power to harden the heart. To suppose any such thing would be to make God the immediate author of sin. God is said to harden men in two ways: by withholding the powerful influences of his Spirit, without which their hearts will remain hardened, and grow harder and harder; in this sense he hardens them, as he leaves them to hardness. And again, by ordering those things in his providence which, through the abuse of their corruption, become the occasion of their hardening.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God&#x27;s Sovereignty</cite>, sermon on Romans 9:18</span></figcaption>

</figure><figure class="quote" id="q-2c9dc6be06" data-kw="Hardening Depravity Author of sin Reprobation">
<blockquote><p>God hardens some men&#x27;s hearts, as he did Pharaoh&#x27;s, and he wills to harden them, or he hardens them according to his decreeing will; &quot;Whom he will he hardens&quot;, (Romans 9:18) this he does not by any positive act, by infusing hardness and blindness into the hearts of men; which is contrary to his purity and holiness, and would make him the author of sin; but by leaving men to their natural blindness and hardness of heart; for the understanding is naturally darkened; and there is a natural blindness, hardness, and callousness of heart, through the corruption of nature, and which is increased by habits of sinning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, bk. 2, ch. 3 (Of the Decrees of Rejection)</span></figcaption>

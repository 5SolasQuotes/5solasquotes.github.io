<blockquote><p>Pardon of sin is an act of God’s free grace whereby to a repenting, believing sinner for the sake of Christ and his righteousness that obligation to punishment which ariseth from the sinfulness of his heart and life is dissolved and ceaseth; or this: ’tis a gracious act of God discharging the sinner by the gospel promise or grant from the obligation to punishment upon consideration of the satisfaction made by Christ accepted by the sinner and pleaded with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the Covenant of Grace</cite>, ed. Allan Harman (1692; Fearn: Christian Focus, 2002), p. 29.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3113a0b347" data-kw="">
<blockquote><p>How should we understand that Christ became a curse? The answer is that the Son of God not only felt the wounding of his members in his human nature, soul and body, but all that wrath of God and the curse that we would have felt if he had not taken our punishment on himself. Christ felt the curse not in theory but in fact so that we might be delivered from it, not in theory but in fact. And he took our curse to such an extent that not a single sin out of the sins of all the elect went unpunished. The reason for this is that every sin, even the smallest of them, deserved to be cursed. Christ did not satisfy [the demands of the law] imperfectly but perfectly, which is why he took on the curse of every single sin of ours. …

Let us compare our doctrine with that of the papists and see what kind of justifier they make out of Christ. Christ does not justify us in such a way as to give us works that are more perfect than those found in the Ten Commandments. A little earlier on Paul said, “The man who does these things will live because of them.” That rule of living must be perfect, and it would lead to eternal life if there was anyone who kept it, but that is not the way Christ justifies us. He was made a curse for us, Paul says, in order that we might be redeemed from the curse of the law. If Christ takes our curse fully on himself, it follows that all our sins without exception are punished in him. For even the least important sin deserves a curse. How deep was the abyss into which Christ plunged?

This obedience of the Son is greater than any righteousness of the law. Adam could have remained in the righteousness of the law if he had wanted to. But not even all the angels could have borne the curse owed for each and every sin of the elect, or done so with such obedience without complaining. Therefore this obedience of the Son is not only greater than the righteousness of the law, which Adam received at creation and which the law requires, but even the righteousness of all the angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolam Divi Pauli Apostoli ad Galatas Notae ex Concionibus Gasparis Oleviani Excerptae, et a Theodoro Beza Editae</cite>, (Geneva: Eustache Vignon, 1578). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 107.</span></figcaption>

</figure><figure class="quote" id="q-1d5f625a04" data-kw="">
<blockquote><p>Justification is therefore defined as: A gracious action of God, by His mercy toward the Elect, without any work or merit of their own, on account of the satisfaction of Christ, apprehended by true faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on Justification</cite>, Thesis II</span></figcaption>

</figure><figure class="quote" id="q-f2e78b0092" data-kw="">
<blockquote><p>It is instructive to observe what [Charles G.] Finney asseverates that he “holds, and expressly teaches,” that the grounds of justification are not, set as they are in contrast with the one thing, the love of God, which he declares that the ground of justification is. The ground of justification he asseverates is not (1) the obedience of Christ for us; (2) our own obedience either to the law or to the gospel; (3) the atonement of Christ; (4) anything in the mediatorial work of Christ; (5) the work of the Holy Spirit in us. It is not anything that either Christ or we have done; and it is not anything that we have done or have become under the operations of the Spirit. It is solely the divine benevolence.

The Atonement, from the point of view of the Rectoral theory, which Finney teaches, naturally has no adaptation to serve immediately as the ground of any act of God. Its only immediate effect is to bring men to repentance and faith; and thus the entire work of Christ is reduced to inducing men to repent and believe. It is not so clear, however, that the repentance and faith to which men are thus brought, together with their resultant obedience, do not constitute the proper ground of their justification in this scheme.

No doubt “the fundamental reason” of justification lies in the love of God: nothing is required, in this scheme, to enable the benevolent God to forgive sin,—it flows spontaneously out of His benevolence alone. But the benevolent God is not free to act on this scheme out of His benevolence alone. He has tied Himself up with governmental obligations. The love of God cannot fulfil itself in the actual justification of sinners, therefore, consistently with his governmental obligations, except in the case of those who have been brought by the Atonement (serving the purposes here of punishment) to repentance and faith, with the consequent amendment of life which is sanctification.

This “reformation of life” is obviously in such a sense the “condition” of justification that it may properly be called its ground. It is not the ground of God’s impulse to justify, but it is the ground of God’s actually justifying, the sinner. In it the manifestation of His love to this or that particular sinner is grounded. It is the ground of justification in the same sense in which the righteousness of Christ — active and passive—is in the Reformation doctrine of justification, namely, that in view of which God pardons the sins of those whom He justifies and accepts as righteous in His sight. When Finney strenuously argues that God can accept as righteous no one who is not intrinsically righteous, it cannot be denied that he teaches a work-salvation, and has put man’s own righteousness in the place occupied in the Reformation doctrine of justification by the righteousness of Christ.

Finney, it must be confessed, exhibits no desire to conceal from himself the seriousness of his departure from the Reformation teaching in his doctrine of justification. One of the reasons for his constant insistence that the righteousness of man—no less than the atoning work of Christ—is only a condition, not the ground, of justification, is to escape from all implication of a forensic doctrine of justification. He fairly rages against this forensic doctrine. “Now,” he exclaims of it, “this is certainly ‘another gospel’ from the one I am inculcating. It is not a difference merely upon some speculative or theoretic point. It is a point fundamental to the gospel of salvation if any one can be.”

It is with full consciousness, therefore, that he ranges himself over against the doctrine of the Reformation, as teaching “another gospel.” And the precise point on which his opposition turns is that the Reformation doctrine, by interposing an imputation of the righteousness of Christ as the ground on which the sinner is accepted as righteous, does not require perfect intrinsic righteousness as the condition precedent of justification.

This he cries out against as a doctrine of justification “in sin.” “It certainly cannot be true,” he declares, “that God accepts and justifies the sinner in his sins. I may safely challenge the world for either reason or Scripture to support the doctrine of justification in sin, in any degree of present rebellion against God. The Bible everywhere represents justified persons as sanctified, and always expressly conditionates justification on sanctification, in the sense of present obedience to God.” “Present, full and entire consecration of heart and life to God, and to His service,” he says again, “is an unalterable condition of present pardon of past sin, and of present acceptance with God”; and “the penitent soul remains justified no longer than the full-hearted consecration continues.”

At an earlier point he lays down the proposition that God cannot in any sense “justify one ‘who does not yield a present and full obedience to the moral law,” and, pouring scorn on any “method of justification” which does not presuppose such an obedience, exclaims, “What good can result to God, or the sinner, or to the universe by this pardoning and justifying an unsanctified soul?” “If what has been said is true,” he then remarks, “we see that the Church has fallen into a great and ruinous mistake, in supposing that a state of present sinlessness is a very rare, if not impossible, attainment in this life. If the doctrine of this lecture be true, it follows that the very beginning of true religion in the soul, implies the renunciation of all sin. Sin ceases when holiness begins.”

And he closes with an invective against those who object to such as “teach that God justifies no one, but upon condition of present sinlessness”—than which we could have no more precise assertion that justification proceeds on the presupposition of sinlessness. The attainment of sinlessness with Finney is the first, not the last step of the religious life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Oberlin Perfectionism. III. The Development of the Oberlin Teaching in Princeton Theological Review</cite></span></figcaption>

— Benjamin B. Warfield, Oberlin Perfectionism. III. The Development of the Oberlin Teaching in Princeton Theological Review">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+instructive+to+observe+what+%5BCharles+G.%5D+Finney+asseverates+that+he+%E2%80%9Cholds%2C+and+expressly+teaches%2C%E2%80%9D+that+the+grounds+of+justification+are+not%2C+set+as+they+are+in+contrast+with+the+one+thing%2C+the+love+of+God%2C+which+he+declares+that+the+ground+of+justification+is.+The+ground+of+justification+he+asseverates+is+not+%281%29+the+obedience+of+Christ+for+us%3B+%282%29+our+own+obedience+either+to+the+law+or+to+the+gospel%3B+%283%29+the+atonement+of+Christ%3B+%284%29+anything+in+the+mediatorial+work+of+Christ%3B+%285%29+the+work+of+the+Holy+Spirit+in+us.+It+is+not+anything+that+either+Christ+or+we+have+done%3B+and+it+is+not+anything+that+we+have+done+or+have+become+under+the+operations+of+the+Spirit.+It+is+solely+the+divine+benevolence.%0A%0AThe+Atonement%2C+from+the+point+of+view+of+the+Rectoral+theory%2C+which+Finney+teaches%2C+naturally+has+no+adaptation+to+serve+immediately+as+the+ground+of+any+act+of+God.+Its+only+immediate+effect+is+to+bring+men+to+repentance+and+faith%3B+and+thus+the+entire+work+of+Christ+is+reduced+to+inducing+men+to+repent+and+believe.+It+is+not+so+clear%2C+however%2C+that+the+repentance+and+faith+to+which+men+are+thus+brought%2C+together+with+their+resultant+obedience%2C+do+not+constitute+the+proper+ground+of+their+justification+in+this+scheme.%0A%0ANo+doubt+%E2%80%9Cthe+fundamental+reason%E2%80%9D+of+justification+lies+in+the+love+of+God%3A+nothing+is+required%2C+in+this+scheme%2C+to+enable+the+benevolent+God+to+forgive+sin%2C%E2%80%94it+flows+spontaneously+out+of+His+benevolence+alone.+But+the+benevolent+God+is+not+free+to+act+on+this+scheme+out+of+His+benevolence+alone.+He+has+tied+Himself+up+with+governmental+obligations.+The+love+of+God+cannot+fulfil+itself+in+the+actual+justification+of+sinners%2C+therefore%2C+consistently+with+his+governmental+obligations%2C+except+in+the+case+of+those+who+have+been+brought+by+the+Atonement+%28serving+the+purposes+here+of+punishment%29+to+repentance+and+faith%2C+with+the+consequent+amendment+of+life+which+is+sanctification.%0A%0AThis+%E2%80%9Creformation+of+life%E2%80%9D+is+obviously+in+such+a+sense+the+%E2%80%9Ccondition%E2%80%9D+of+justification+that+it+may+properly+be+called+its+ground.+It+is+not+the+ground+of+God%E2%80%99s+impulse+to+justify%2C+but+it+is+the+ground+of+God%E2%80%99s+actually+justifying%2C+the+sinner.+In+it+the+manifestation+of+His+love+to+this+or+that+particular+sinner+is+grounded.+It+is+the+ground+of+justification+in+the+same+sense+in+which+the+righteousness+of+Christ+%E2%80%94+active+and+passive%E2%80%94is+in+the+Reformation+doctrine+of+justification%2C+namely%2C+that+in+view+of+which+God+pardons+the+sins+of+those+whom+He+justifies+and+accepts+as+righteous+in+His+sight.+When+Finney+strenuously+argues+that+God+can+accept+as+righteous+no+one+who+is+not+intrinsically+righteous%2C+it+cannot+be+denied+that+he+teaches+a+work-salvation%2C+and+has+put+man%E2%80%99s+own+righteousness+in+the+place+occupied+in+the+Reformation+doctrine+of+justification+by+the+righteousness+of+Christ.%0A%0AFinney%2C+it+must+be+confessed%2C+exhibits+no+desire+to+conceal+from+himself+the+seriousness+of+his+departure+from+the+Reformation+teaching+in+his+doctrine+of+justification.+One+of+the+reasons+for+his+constant+insistence+that+the+righteousness+of+man%E2%80%94no+less+than+the+atoning+work+of+Christ%E2%80%94is+only+a+condition%2C+not+the+ground%2C+of+justification%2C+is+to+escape+from+all+implication+of+a+forensic+doctrine+of+justification.+He+fairly+rages+against+this+forensic+doctrine.+%E2%80%9CNow%2C%E2%80%9D+he+exclaims+of+it%2C+%E2%80%9Cthis+is+certainly+%E2%80%98another+gospel%E2%80%99+from+the+one+I+am+inculcating.+It+is+not+a+difference+merely+upon+some+speculative+or+theoretic+point.+It+is+a+point+fundamental+to+the+gospel+of+salvation+if+any+one+can+be.%E2%80%9D%0A%0AIt+is+with+full+consciousness%2C+therefore%2C+that+he+ranges+himself+over+against+the+doctrine+of+the+Reformation%2C+as+teaching+%E2%80%9Canother+gospel.%E2%80%9D+And+the+precise+point+on+which+his+opposition+turns+is+that+the+Reformation+doctrine%2C+by+interposing+an+imputation+of+the+righteousness+of+Christ+as+the+ground+on+which+the+sinner+is+accepted+as+righteous%2C+does+not+require+perfect+intrinsic+righteousness+as+the+condition+precedent+of+justification.%0A%0AThis+he+cries+out+against+as+a+doctrine+of+justification+%E2%80%9Cin+sin.%E2%80%9D+%E2%80%9CIt+certainly+cannot+be+true%2C%E2%80%9D+he+declares%2C+%E2%80%9Cthat+God+accepts+and+justifies+the+sinner+in+his+sins.+I+may+safely+challenge+the+world+for+either+reason+or+Scripture+to+support+the+doctrine+of+justification+in+sin%2C+in+any+degree+of+present+rebellion+against+God.+The+Bible+everywhere+represents+justified+persons+as+sanctified%2C+and+always+expressly+conditionates+justification+on+sanctification%2C+in+the+sense+of+present+obedience+to+God.%E2%80%9D+%E2%80%9CPresent%2C+full+and+entire+consecration+of+heart+and+life+to+God%2C+and+to+His+service%2C%E2%80%9D+he+says+again%2C+%E2%80%9Cis+an+unalterable+condition+of+present+pardon+of+past+sin%2C+and+of+present+acceptance+with+God%E2%80%9D%3B+and+%E2%80%9Cthe+penitent+soul+remains+justified+no+longer+than+the+full-hearted+consecration+continues.%E2%80%9D%0A%0AAt+an+earlier+point+he+lays+down+the+proposition+that+God+cannot+in+any+sense+%E2%80%9Cjustify+one+%E2%80%98who+does+not+yield+a+present+and+full+obedience+to+the+moral+law%2C%E2%80%9D+and%2C+pouring+scorn+on+any+%E2%80%9Cmethod+of+justification%E2%80%9D+which+does+not+presuppose+such+an+obedience%2C+exclaims%2C+%E2%80%9CWhat+good+can+result+to+God%2C+or+the+sinner%2C+or+to+the+universe+by+this+pardoning+and+justifying+an+unsanctified+soul%3F%E2%80%9D+%E2%80%9CIf+what+has+been+said+is+true%2C%E2%80%9D+he+then+remarks%2C+%E2%80%9Cwe+see+that+the+Church+has+fallen+into+a+great+and+ruinous+mistake%2C+in+supposing+that+a+state+of+present+sinlessness+is+a+very+rare%2C+if+not+impossible%2C+attainment+in+this+life.+If+the+doctrine+of+this+lecture+be+true%2C+it+follows+that+the+very+beginning+of+true+religion+in+the+soul%2C+implies+the+renunciation+of+all+sin.+Sin+ceases+when+holiness+begins.%E2%80%9D%0A%0AAnd+he+closes+with+an+invective+against+those+who+object+to+such+as+%E2%80%9Cteach+that+God+justifies+no+one%2C+but+upon+condition+of+present+sinlessness%E2%80%9D%E2%80%94than+which+we+could+have+no+more+precise+assertion+that+justification+proceeds+on+the+presupposition+of+sinlessness.+The+attainment+of+sinlessness+with+Finney+is+the+first%2C+not+the+last+step+of+the+religious+life.%E2%80%9D%0A%0A%E2%80%94+Benjamin+B.+Warfield%2C+Oberlin+Perfectionism.+III.+The+Development+of+the+Oberlin+Teaching+in+Princeton+Theological+Review&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff2e78b0092.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f2e78b0092.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/05/07/b-b-warfield-on-the-finneyite-doctrine-of-justification/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

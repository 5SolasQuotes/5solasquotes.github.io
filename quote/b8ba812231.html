<main class="wrap"><figure class="quote" id="q-b8ba812231" data-kw="">
<blockquote><p>Assurance is a jewel of that worth, a pearl of that price, that he who will have it must work, and sweat, and weep, and wait to obtain it. He must not only use diligence—but he must use all diligence; not only dig—but he must dig deep, before he can come to this golden mine. Assurance is that &quot;white stone,&quot; that &quot;new name,&quot; that hidden manna, which none can obtain but such as labor for it as for life. Assurance is such precious gold, that a man must win it before he can wear it.</p></blockquote>
<figcaption>— <a href="../authors/thomas-brooks.html">Thomas Brooks</a>, <cite>Heaven on Earth: A Treatise on Christian Assurance</cite>, p. 34</figcaption>
<div class="meta"><span class="t">Assurance of Salvation</span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-af50f08eea" data-kw="">
<blockquote><p>Assurance, such as Paul expresses in the verses which head this paper, is not a mere fancy or feeling. It is not the result of high animal spirits, or a sanguine temperament of body. It is a positive gift of the Holy Ghost, bestowed without reference to men&#x27;s bodily frames or constitutions, and a gift which every believer in Christ ought to aim at and seek after.</p></blockquote>
<figcaption>— <a href="../authors/j-c-ryle.html">J. C. Ryle</a>, <cite>Holiness</cite>, ch. “Assurance”, pp. 163–164</figcaption>
<div class="meta"><span class="t">Assurance of Salvation</span></div>

— J. C. Ryle, Holiness, ch. “Assurance”, pp. 163–164">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAssurance%2C+such+as+Paul+expresses+in+the+verses+which+head+this+paper%2C+is+not+a+mere+fancy+or+feeling.+It+is+not+the+result+of+high+animal+spirits%2C+or+a+sanguine+temperament+of+body.+It+is+a+positive+gift+of+the+Holy+Ghost%2C+bestowed+without+reference+to+men%27s+bodily+frames+or+constitutions%2C+and+a+gift+which+every+believer+in+Christ+ought+to+aim+at+and+seek+after.%E2%80%9D%0A%0A%E2%80%94+J.+C.+Ryle%2C+Holiness%2C+ch.+%E2%80%9CAssurance%E2%80%9D%2C+pp.+163%E2%80%93164&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf50f08eea.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af50f08eea.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-8e85739b7f" data-kw="">
<blockquote><p>A man may be really justified before God, and yet not have the evidence or assurance of it in his own mind; wherefore that evidence or assurance is not of the nature or essence of that faith whereby we are justified, nor does necessarily accompany our justification. But this manifestation of a man’s own justification unto himself, although it depend on many especial causes, which are not necessary unto his justification absolutely before God, is not a second justification when it is attained; but only the application of the former unto his conscience by the Holy Ghost.</p></blockquote>
<figcaption>— <a href="../authors/john-owen.html">John Owen</a>, <cite>The Doctrine of Justification by Faith</cite>, ch. 5</figcaption>
<div class="meta"><span class="t">Nature of Justification</span><span class="t">Assurance of Salvation</span></div>

</figure><figure class="quote" id="q-a1ab80edcc" data-kw="">
<blockquote><p>The Lord Jesus is very pitiful, and of tender mercy. He does not regard the quantity of faith, but the quality: He does not measure its degree, but its truth. He will not break any bruised reed, nor quench any smoking flax. He will never let it be said that any perished at the foot of the cross. &quot;Him that cometh unto Me,&quot; He says, &quot;I will in no wise cast out.&quot; (John 6:37.) Yes! Though a man&#x27;s faith be no bigger than a grain of mustard seed, if it only brings him to Christ, and enables him to touch the hem of His garment, he shall be saved,—saved as surely as the oldest saint in paradise,—saved as completely and eternally as Peter, or John, or Paul. There are degrees in our sanctification. In our justification there are none.</p></blockquote>
<figcaption>— <a href="../authors/j-c-ryle.html">J. C. Ryle</a>, <cite>Holiness</cite>, ch. “Assurance”, p. 171</figcaption>
<div class="meta"><span class="t">Degrees of Faith</span><span class="t">Assurance of Salvation</span></div>

</figure><figure class="quote" id="q-a469aee8d1" data-kw="Faith">
<blockquote><p>It is a REAL union. Such is our weakness in our present state, so much are we sunk in sin, that in our mind, we are prone to suspect spiritual realities to be only a fiction. But nothing is more real than what is spiritual: as approaching nearest to the nature of him who is the fountain of all reality, namely, God himself. We do not see with our eyes the union between our own soul and body; neither can we represent it to ourselves truly, by imagination, as we do sensible things: yet the reality of it is not to be doubted. Faith is no fancy—but &quot;the substance of things hoped for,&quot; Heb. 11:1. Neither is the union thereby made between Christ and believers imaginary—but most real: &quot;For we are members of his body, of his flesh, and of his bones,&quot; Eph. 5:30.</p></blockquote>
<figcaption>— <a href="../authors/thomas-boston.html">Thomas Boston</a>, <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” general observations (2)</figcaption>
<div class="meta"><span class="t">Nature of Union</span></div>

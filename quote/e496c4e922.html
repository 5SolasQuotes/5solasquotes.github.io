<main class="wrap"><figure class="quote" id="q-e496c4e922" data-kw="">
<blockquote><p>I call to witness theology, the queen and mistress of the other branches of learning, and it is almost our especial task to see that these are ready handmaids to it; not that confused theology drawn from the ditches of the scholastics, nor the theology that is merely common and teachable material handed down in a variety of manuals by scores of quite worthy and not inadequate men; but theology that is free, pure and undefiled drawn in from the fountain of fountains with the Holy Spirit and power of Almighty God aiding – and indeed completing – the whole task; theology that daily blossoms forth using all the supports of true philosophy and the other branches of knowledge which can serve to help or adorn it. We see the inmost shrines of truth unlocked and hidden meanings of the living page unearthed and set before us. ‘Hence the light and sacred draughts.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Oxford Orations</cite>, (1652-57), trans. John Glucker, ed. Peter Toon (1971), Second Oration, July 1654. Available from:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b0c8055d1d" data-kw="">
<blockquote><p>I answer that there were in the law some precepts that were purely ceremonial, as circumcision, the immolation of the lamb, and so on. Such laws, since they were only figurative, it is no longer licit to observe, for they were a figure of something to come; hence, anyone who observes them now would be signifying that Christ is still to come. But others were purely moral, and these must be observed now. …

But others were partly ceremonial and partly moral, as the judicial precepts. These laws are no longer to be used in regard to what is ceremonial; but in regard to what is moral, they must be obeyed. Yet it is not necessary that they be observed in their proper form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Epistolam B. Pauli ad Hebraeos lectura</cite>, (c. 1273), C. 7, L. 2, 339.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-35466486f9" data-kw="">
<blockquote><p>The telos of a thing or process is the end or goal toward which it points… Naturalists generally hold that teleological descriptions of natural phenomena are either false or, if true, are reducible to descriptions cast in non-teleological terms. Non-naturalists generally hold that at least some natural phenomena exhibit irreducible teleology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, ch. 2, ‘Teleology: a Shopper’s Guide’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 28-49, p. 28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-1a742dd648" data-kw="">
<blockquote><p>his [Descartes’] warning… that the main questions about God and the soul’s distinction from the body are among those that should be demonstrated by philosophy rather than theology (Descartes, Meditations on First Philosophy in The Philosophical Writings of Descartes, vol. 2, tr. John Cottingham, et al., Cambridge Univ. Press, 1984, p. 3)… In the branch of philosophy called first philosophy or metaphysics, he accomplished little, only explaining and defending two questions about God’s existence and the soul’s distinction from the body. For apart from those questions belonging to pneumatics and natural theology, he was so caught up in explaining them and defending them against objections that he revealed too clearly his weakness in understanding and judging metaphysical formalities and abstractions. I will not even [describe] how he went about proposing such lofty and difficult philosophical ideas in a methodical, precise, clear, and evident way, or how he dealt with similar things and hypotheses taken or assumed without proof, or the non-principles on which he built his own ideas. Finally, there are the contradictions, confusions, and evasions he typically resorted to when attacked by opponents, like a man who has fallen into water grasping at anything.</p></blockquote>

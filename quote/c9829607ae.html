<main class="wrap"><figure class="quote" id="q-c9829607ae" data-kw="">
<blockquote><p>How much of spiritual meaning and significance is revealed to the eye of faith, in that great truth “He inhabiteth eternity.” From eternity did God exist, and infinitely happy in his own glory. His being is underived, and never had a beginning; before angel and arch-angel were called into being to celebrate his praises, did our God exist in his own uncreated glory. The blessed spirits of heaven, who, as they receive their existence from the “high and lofty One,” derive also their happiness from the infinite happiness which resides in his perfections, and delight to magnify his glory, and to do his will. Their fervid praises ascend to him, who has given them all their powers of serving him, and their capacities of enjoying him. In the immediate dwelling place of God are the souls of the redeemed, who “have passed beyond tribulation, and who, clothed with white robes and palms in their hands,” cry with a loud voice, saying, “Salvation to our God which sitteth upon the throne, and unto the Lamb.”

Infinite happiness is in the immediate dwelling-place of him who inhabits eternity; unutterable glory is also around the God of our salvation. The Word of God elevates our faith, and calls upon us to entertain devout and adoring views of the glory of him, who is holy in his nature, and holy and righteous in all his ways. Yet, though thus glorious and exalted, though infinite in his own happiness, though inconceivably pure and holy in his essence, though requiring no services of any created beings that rejoices in the excellence of his will, to add to his internal and infinite happiness and complacency, yet, amazing truth of God’s own grace and condescension, he delights to come forth from the glory which he inhabits in eternity, and to dwell with them, who in the depths of humility and self-abasement, feel their own guilt and unworthiness in his holy and omniscient view, and in faith and love acknowledge him as their God in Christ.

What a precious revelation does the Prophet give of the grace of God! What a consolatory representation of his unsearchable condescension! While God dwells in the heavens, and praises of eternity — while he dwells in the “high and holy place” — a heavenly temple—the grandeur, the purity, the glory of which befit the blessed perfections of his nature — yet he dwells also with him who is of a contrite and humble spirit — God dwells with such for a blessed and gracious purpose — “to revive the spirit of the humble, and to revive the heart of the contrite ones.” In his wisdom and grace, he has devised a glorious plan of salvation, through which he can hold communion with those in whom these spiritual qualities reside.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mungo-fairlie-parker.html">Mungo Fairlie Parker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God s Dwelling with the Humble and Contrite, the Source of their Revival’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c8bc8a64e" data-kw="">
<blockquote><p>The first [evidence of scripture’s divinity listed in the Westminster Confession] is, “the heavenliness of the matter.” The matter of the Scriptures, or the various subjects there treated of, have all a reference, more or less direct, to things celestial and divine. They are connected throughout with God, the unseen world, and the eternal destinies of man. No merely human or temporal object seems to be aimed at or attended to.

Everything is connected, more or less directly and palpably, with Him whose throne is in the heavens; with the celestial origin and dignity of his intelligent creatures; with their relations to heaven; and with the end and the means of restoring to heaven those who had forfeited their birthright. Everything connected with this world is represented in the aspect in which it is seen from heaven, and in the light of a higher world. There is nothing that is of the earth earthy.

All breathes of heaven, and tends to lead the thoughts and desires to things unseen and eternal. The guilt and depravity of men are indeed set forth in glowing colours, and exhibited in fearful specimens of what man is and has done. But it is held forth as rebellion against the God of heaven. It is represented in the light in which it usually appears, not so much to men themselves as to the purer inhabitants of a higher and a holier region; and it is unfolded for the purpose of shewing men what they have lost, and what difficulties stand in the way of their restoration to heaven and happiness, and in order to lead them to turn their thoughts to that state where there is no more sin and no more sorrow.

The Bible indeed shews that God has been pleased to make revelations of his will, conveying regulations about temporal and earthly things, especially in connection with that remarkable people whom he selected to put his name in them. And many of these regulations, though in some respects intended to serve temporary purposes, and not now fitted to effect all the same ends as they once did for a season, are recorded in the same Scriptures, and form a part of the word of God.

But even these things were all written for our instruction, on whom the ends of the world have come; they were all fitted and intended to have some reference to the heavenly as well as the earthly Canaan; and they are still found, under the guidance of God’s Spirit, to minister instruction that is profitable for guiding and directing men in their journey to the Jerusalem that is above. Such books, containing such matter, and so free from everything that indicates an earthly origin, must have come from God</p></blockquote>

<blockquote><p>The heavens declare the glory of God. I have already said, that this psalm consists of two parts, in the first of which David celebrates the glory of God as manifested in his works; and, in the other, exalts and magnifies the knowledge of God which shines forth more clearly in his word. He only makes mention of the heavens; but, under this part of creation, which is the noblest, and the excellency of which is more conspicuous, he doubtless includes by synecdoche the whole fabric of the world.

There is certainly nothing so obscure or contemptible, even in the smallest corners of the earth, in which some marks of the power and wisdom of God may not be seen; but as a more distinct image of him is engraven on the heavens, David has particularly selected them for contemplation, that their splendour might lead us to contemplate all parts of the world. When a man, from beholding and contemplating the heavens, has been brought to acknowledge God, he will learn also to reflect upon and to admire his wisdom and power as displayed on the face of the earth, not only in general, but even in the minutest plants. In the first verse, the Psalmist repeats one thing twice, according to his usual manner.

He introduces the heavens as witnesses and preachers of the glory of God, attributing to the dumb creature a quality which, strictly speaking, does not belong to it, in order the more severely to upbraid men for their ingratitude, if they should pass over so clear a testimony with unheeding ears. This manner of speaking more powerfully moves and affects us than if he had said, The heavens show or manifest the glory of God. It is indeed a great thing, that in the splendour of the heavens there is presented to our view a lively image of God; but, as the living voice has a greater effect in exciting our attention, or at least teaches us more surely and with greater profit than simple beholding, to which no oral instruction is added, we ought to mark the force of the figure which the Psalmist uses when he says, that the heavens by their preaching declare the glory of God.

The repetition which he makes in the second clause is merely an explanation of the first. David shows how it is that the heavens proclaim to us the glory of God, namely, by openly bearing testimony that they have not been put together by chance, but were wonderfully created by the supreme Architect. When we behold the heavens, we cannot but be elevated, by the contemplation of them, to Him who is their great Creator; and the beautiful arrangement and wonderful variety which distinguish the courses and station of the heavenly bodies, together with the beauty and splendour which are manifest in them, cannot but furnish us with an evident proof of his providence.

Scripture, indeed, makes known to us the time and manner of the creation; but the heavens themselves, although God should say nothing on the subject, proclaim loudly and distinctly enough that they have been fashioned by his hands: and this of itself abundantly suffices to bear testimony to men of his glory. As soon as we acknowledge God to be the supreme Architect, who has erected the beauteous fabric of the universe, our minds must necessarily be ravished with wonder at his infinite goodness, wisdom, and power.

… Day unto day uttereth speech. Philosophers, who have more penetration into those matters than others, understand how the stars are arranged in such beautiful order, that notwithstanding their immense number there is no confusion; but to the ignorant and unlettered, the continual succession of days is a more undoubted proof of the providence of God. David, therefore, having spoken of the heavens, does not here descend from them to other parts of the world; but, from an effect more sensible and nearer our apprehension, he confirms what he has just now said, namely, that the glory of God not only shines, but also resounds in the heavens.

The words may be variously expounded, but the different expositions which have been given of them make little difference as to the sense. Some explain them thus, that no day passes in which God does not show some signal evidence of his power. Others are of opinion that they denote the augmentations of instruction and knowledge, – that every succeeding day contributes something new in proof of the existence and perfections of God. Others view them as meaning that the days and nights talk together, and reason concerning the glory of their Creator’, but this is a somewhat forced interpretation. David, I have no doubt, here teaches, from the established alternations of days and nights, that the course and revolutions of the sun, and moon, and stars, are regulated by the marvellous wisdom of God.

Whether we translate the words Day after day, or one day to another day, is of little consequence; for all that David means is the beautiful arrangement of time which the succession of days and nights effects. If, indeed, we were as attentive as we ought to be, even one day would suffice to bear testimony to us of the glory of God, and even one night would be sufficient to perform to us the same office. But when we see the sun and the moon performing their daily revolutions, — the sun by day appearing over our heads, and the moon succeeding in its turns — the sun ascending by degrees, while at the same time he approaches nearer us, — and afterwards bending his course so as to depart from us by little and little; — and when we see that by this means the length of the days and nights is regulated, and that the variation of their length is arranged according to a law so uniform, as invariably to recur at the same points of time in every successive year, we have in this a much brighter testimony to the glory of God.

David, therefore, with the highest reason, declares, that although God should not speak a single word to men, yet the orderly and useful succession of days and nights eloquently proclaims the glory of God, and that there is now left to men no pretext for ignorance; for since the days and nights perform towards us so well and so carefully the office of teachers, we may acquire, if we are duly attentive, a sufficient amount of knowledge under their tuition.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>
<div class="actions"><button class="copy" data-copy="“The heavens declare the glory of God. I have already said, that this psalm consists of two parts, in the first of which David celebrates the glory of God as manifested in his works; and, in the other, exalts and magnifies the knowledge of God which shines forth more clearly in his word. He only makes mention of the heavens; but, under this part of creation, which is the noblest, and the excellency of which is more conspicuous, he doubtless includes by synecdoche the whole fabric of the world.

There is certainly nothing so obscure or contemptible, even in the smallest corners of the earth, in which some marks of the power and wisdom of God may not be seen; but as a more distinct image of him is engraven on the heavens, David has particularly selected them for contemplation, that their splendour might lead us to contemplate all parts of the world. When a man, from beholding and contemplating the heavens, has been brought to acknowledge God, he will learn also to reflect upon and to admire his wisdom and power as displayed on the face of the earth, not only in general, but even in the minutest plants. In the first verse, the Psalmist repeats one thing twice, according to his usual manner.

He introduces the heavens as witnesses and preachers of the glory of God, attributing to the dumb creature a quality which, strictly speaking, does not belong to it, in order the more severely to upbraid men for their ingratitude, if they should pass over so clear a testimony with unheeding ears. This manner of speaking more powerfully moves and affects us than if he had said, The heavens show or manifest the glory of God. It is indeed a great thing, that in the splendour of the heavens there is presented to our view a lively image of God; but, as the living voice has a greater effect in exciting our attention, or at least teaches us more surely and with greater profit than simple beholding, to which no oral instruction is added, we ought to mark the force of the figure which the Psalmist uses when he says, that the heavens by their preaching declare the glory of God.

The repetition which he makes in the second clause is merely an explanation of the first. David shows how it is that the heavens proclaim to us the glory of God, namely, by openly bearing testimony that they have not been put together by chance, but were wonderfully created by the supreme Architect. When we behold the heavens, we cannot but be elevated, by the contemplation of them, to Him who is their great Creator; and the beautiful arrangement and wonderful variety which distinguish the courses and station of the heavenly bodies, together with the beauty and splendour which are manifest in them, cannot but furnish us with an evident proof of his providence.

Scripture, indeed, makes known to us the time and manner of the creation; but the heavens themselves, although God should say nothing on the subject, proclaim loudly and distinctly enough that they have been fashioned by his hands: and this of itself abundantly suffices to bear testimony to men of his glory. As soon as we acknowledge God to be the supreme Architect, who has erected the beauteous fabric of the universe, our minds must necessarily be ravished with wonder at his infinite goodness, wisdom, and power.

… Day unto day uttereth speech. Philosophers, who have more penetration into those matters than others, understand how the stars are arranged in such beautiful order, that notwithstanding their immense number there is no confusion; but to the ignorant and unlettered, the continual succession of days is a more undoubted proof of the providence of God. David, therefore, having spoken of the heavens, does not here descend from them to other parts of the world; but, from an effect more sensible and nearer our apprehension, he confirms what he has just now said, namely, that the glory of God not only shines, but also resounds in the heavens.

The words may be variously expounded, but the different expositions which have been given of them make little difference as to the sense. Some explain them thus, that no day passes in which God does not show some signal evidence of his power. Others are of opinion that they denote the augmentations of instruction and knowledge, – that every succeeding day contributes something new in proof of the existence and perfections of God. Others view them as meaning that the days and nights talk together, and reason concerning the glory of their Creator’, but this is a somewhat forced interpretation. David, I have no doubt, here teaches, from the established alternations of days and nights, that the course and revolutions of the sun, and moon, and stars, are regulated by the marvellous wisdom of God.

Whether we translate the words Day after day, or one day to another day, is of little consequence; for all that David means is the beautiful arrangement of time which the succession of days and nights effects. If, indeed, we were as attentive as we ought to be, even one day would suffice to bear testimony to us of the glory of God, and even one night would be sufficient to perform to us the same office. But when we see the sun and the moon performing their daily revolutions, — the sun by day appearing over our heads, and the moon succeeding in its turns — the sun ascending by degrees, while at the same time he approaches nearer us, — and afterwards bending his course so as to depart from us by little and little; — and when we see that by this means the length of the days and nights is regulated, and that the variation of their length is arranged according to a law so uniform, as invariably to recur at the same points of time in every successive year, we have in this a much brighter testimony to the glory of God.

David, therefore, with the highest reason, declares, that although God should not speak a single word to men, yet the orderly and useful succession of days and nights eloquently proclaims the glory of God, and that there is now left to men no pretext for ignorance; for since the days and nights perform towards us so well and so carefully the office of teachers, we may acquire, if we are duly attentive, a sufficient amount of knowledge under their tuition.”

— John Calvin, Commentary on the Book of Psalms, (1557), trans. James Anderson in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 4b: 308-11.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+heavens+declare+the+glory+of+God.+I+have+already+said%2C+that+this+psalm+consists+of+two+parts%2C+in+the+first+of+which+David+celebrates+the+glory+of+God+as+manifested+in+his+works%3B+and%2C+in+the+other%2C+exalts+and+magnifies+the+knowledge+of+God+which+shines+forth+more+clearly+in+his+word.+He+only+makes+mention+of+the+heavens%3B+but%2C+under+this+part+of+creation%2C+which+is+the+noblest%2C+and+the+excellency+of+which+is+more+conspicuous%2C+he+doubtless+includes+by+synecdoche+the+whole+fabric+of+the+world.%0A%0AThere+is+certainly+nothing+so+obscure+or+contemptible%2C+even+in+the+smallest+corners+of+the+earth%2C+in+which+some+marks+of+the+power+and+wisdom+of+God+may+not+be+seen%3B+but+as+a+more+distinct+image+of+him+is+engraven+on+the+heavens%2C+David+has+particularly+selected+them+for+contemplation%2C+that+their+splendour+might+lead+us+to+contemplate+all+parts+of+the+world.+When+a+man%2C+from+beholding+and+contemplating+the+heavens%2C+has+been+brought+to+acknowledge+God%2C+he+will+learn+also+to+reflect+upon+and+to+admire+his+wisdom+and+power+as+displayed+on+the+face+of+the+earth%2C+not+only+in+general%2C+but+even+in+the+minutest+plants.+In+the+first+verse%2C+the+Psalmist+repeats+one+thing+twice%2C+according+to+his+usual+manner.%0A%0AHe+introduces+the+heavens+as+witnesses+and+preachers+of+the+glory+of+God%2C+attributing+to+the+dumb+creature+a+quality+which%2C+strictly+speaking%2C+does+not+belong+to+it%2C+in+order+the+more+severely+to+upbraid+men+for+their+ingratitude%2C+if+they+should+pass+over+so+clear+a+testimony+with+unheeding+ears.+This+manner+of+speaking+more+powerfully+moves+and+affects+us+than+if+he+had+said%2C+The+heavens+show+or+manifest+the+glory+of+God.+It+is+indeed+a+great+thing%2C+that+in+the+splendour+of+the+heavens+there+is+presented+to+our+view+a+lively+image+of+God%3B+but%2C+as+the+living+voice+has+a+greater+effect+in+exciting+our+attention%2C+or+at+least+teaches+us+more+surely+and+with+greater+profit+than+simple+beholding%2C+to+which+no+oral+instruction+is+added%2C+we+ought+to+mark+the+force+of+the+figure+which+the+Psalmist+uses+when+he+says%2C+that+the+heavens+by+their+preaching+declare+the+glory+of+God.%0A%0AThe+repetition+which+he+makes+in+the+second+clause+is+merely+an+explanation+of+the+first.+David+shows+how+it+is+that+the+heavens+proclaim+to+us+the+glory+of+God%2C+namely%2C+by+openly+bearing+testimony+that+they+have+not+been+put+together+by+chance%2C+but+were+wonderfully+created+by+the+supreme+Architect.+When+we+behold+the+heavens%2C+we+cannot+but+be+elevated%2C+by+the+contemplation+of+them%2C+to+Him+who+is+their+great+Creator%3B+and+the+beautiful+arrangement+and+wonderful+variety+which+distinguish+the+courses+and+station+of+the+heavenly+bodies%2C+together+with+the+beauty+and+splendour+which+are+manifest+in+them%2C+cannot+but+furnish+us+with+an+evident+proof+of+his+providence.%0A%0AScripture%2C+indeed%2C+makes+known+to+us+the+time+and+manner+of+the+creation%3B+but+the+heavens+themselves%2C+although+God+should+say+nothing+on+the+subject%2C+proclaim+loudly+and+distinctly+enough+that+they+have+been+fashioned+by+his+hands%3A+and+this+of+itself+abundantly+suffices+to+bear+testimony+to+men+of+his+glory.+As+soon+as+we+acknowledge+God+to+be+the+supreme+Architect%2C+who+has+erected+the+beauteous+fabric+of+the+universe%2C+our+minds+must+necessarily+be+ravished+with+wonder+at+his+infinite+goodness%2C+wisdom%2C+and+power.%0A%0A%E2%80%A6+Day+unto+day+uttereth+speech.+Philosophers%2C+who+have+more+penetration+into+those+matters+than+others%2C+understand+how+the+stars+are+arranged+in+such+beautiful+order%2C+that+notwithstanding+their+immense+number+there+is+no+confusion%3B+but+to+the+ignorant+and+unlettered%2C+the+continual+succession+of+days+is+a+more+undoubted+proof+of+the+providence+of+God.+David%2C+therefore%2C+having+spoken+of+the+heavens%2C+does+not+here+descend+from+them+to+other+parts+of+the+world%3B+but%2C+from+an+effect+more+sensible+and+nearer+our+apprehension%2C+he+confirms+what+he+has+just+now+said%2C+namely%2C+that+the+glory+of+God+not+only+shines%2C+but+also+resounds+in+the+heavens.%0A%0AThe+words+may+be+variously+expounded%2C+but+the+different+expositions+which+have+been+given+of+them+make+little+difference+as+to+the+sense.+Some+explain+them+thus%2C+that+no+day+passes+in+which+God+does+not+show+some+signal+evidence+of+his+power.+Others+are+of+opinion+that+they+denote+the+augmentations+of+instruction+and+knowledge%2C+%E2%80%93+that+every+succeeding+day+contributes+something+new+in+proof+of+the+existence+and+perfections+of+God.+Others+view+them+as+meaning+that+the+days+and+nights+talk+together%2C+and+reason+concerning+the+glory+of+their+Creator%E2%80%99%2C+but+this+is+a+somewhat+forced+interpretation.+David%2C+I+have+no+doubt%2C+here+teaches%2C+from+the+established+alternations+of+days+and+nights%2C+that+the+course+and+revolutions+of+the+sun%2C+and+moon%2C+and+stars%2C+are+regulated+by+the+marvellous+wisdom+of+God.%0A%0AWhether+we+translate+the+words+Day+after+day%2C+or+one+day+to+another+day%2C+is+of+little+consequence%3B+for+all+that+David+means+is+the+beautiful+arrangement+of+time+which+the+succession+of+days+and+nights+effects.+If%2C+indeed%2C+we+were+as+attentive+as+we+ought+to+be%2C+even+one+day+would+suffice+to+bear+testimony+to+us+of+the+glory+of+God%2C+and+even+one+night+would+be+sufficient+to+perform+to+us+the+same+office.+But+when+we+see+the+sun+and+the+moon+performing+their+daily+revolutions%2C+%E2%80%94+the+sun+by+day+appearing+over+our+heads%2C+and+the+moon+succeeding+in+its+turns+%E2%80%94+the+sun+ascending+by+degrees%2C+while+at+the+same+time+he+approaches+nearer+us%2C+%E2%80%94+and+afterwards+bending+his+course+so+as+to+depart+from+us+by+little+and+little%3B+%E2%80%94+and+when+we+see+that+by+this+means+the+length+of+the+days+and+nights+is+regulated%2C+and+that+the+variation+of+their+length+is+arranged+according+to+a+law+so+uniform%2C+as+invariably+to+recur+at+the+same+points+of+time+in+every+successive+year%2C+we+have+in+this+a+much+brighter+testimony+to+the+glory+of+God.%0A%0ADavid%2C+therefore%2C+with+the+highest+reason%2C+declares%2C+that+although+God+should+not+speak+a+single+word+to+men%2C+yet+the+orderly+and+useful+succession+of+days+and+nights+eloquently+proclaims+the+glory+of+God%2C+and+that+there+is+now+left+to+men+no+pretext+for+ignorance%3B+for+since+the+days+and+nights+perform+towards+us+so+well+and+so+carefully+the+office+of+teachers%2C+we+may+acquire%2C+if+we+are+duly+attentive%2C+a+sufficient+amount+of+knowledge+under+their+tuition.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+the+Book+of+Psalms%2C+%281557%29%2C+trans.+James+Anderson+in+Calvin%E2%80%99s+Commentaries+%2822+vols%2C+Grand+Rapids%3A+Baker%2C+1993%29%2C+4b%3A+308-11.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F996accfb7d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/996accfb7d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/23/john-calvin-the-heavens-declare-the-glory-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><figure class="quote" id="q-e12381ac27" data-kw="degrees of glory">
<blockquote><p>Will there be degrees of glory? And will the glory in heaven be equal or unequal and unlike? The Romanists assert the inequality of glory from the inequality of merits which they are accustomed to place under it as a foundation. Among the orthodox the question is problematic; yet the more common opinion asserts degrees of glory without founding them upon merit of works, but upon the free gift of God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-93fca1848a" data-kw="parties">
<blockquote><p>Now there is not the same signification attached to God’s covenant in the Scriptures. It denotes properly a pact and agreement entered into between God and man, consisting partly in a stipulation of duty (or of the thing to be done) and partly in the promise of a reward (which is the meaning in Gen. 17:2 where God is said to wish to make a covenant with Abraham). At one time it is taken improperly for a simple promise (as the promise not to destroy the world again by a flood is called a covenant, Gen. 9:9). At another time, it is taken metonymically for the symbols and sacraments of a covenant: as circumcision is called a covenant (Gen. 17); the eucharistic “cup” is said to be “the new testament in the blood of Christ” (Lk. 22:20), i.e., a sign and seal of it; then for “the tables of the covenant” laid up in the ark (1 K. 8:21); again for the “covenanted people,” as the people of God are called “the holy covenant” (Dan. 11:28, 30); and for the Messiah, the foundation of that covenant, in whom it is made with us (“I will give thee for a covenant of the people,” Is. 49:8). But we, dism</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ddb9747d0" data-kw="covenant of grace">
<blockquote><p>Reply; How often have we shewed that this Text proves not that any Children, quatenus as such, should be baptized, nor, as such, that they are in the Covenant of Grace, or have the Promise made to them; the Promise runs to the Jews and to their Offspring, and not to them only, but to Gentiles also, who were said to be afar off: But pray observe, &#x27;tis to no more of the Jews and their Children or Offspring, and such who were afar off, than the Lord shall call or make Disciples by the Word and effectual Operations of the Holy Spirit. My Sons and Daughters are as much my Children when they are twenty or thirty Years old, as well as when Babes. Dr. Hammond also grants, Children in this Text doth not refer to Insants as such, but to the Posterity of the Jews, p. 490. Sect. 81. If ye be Christ&#x27;s, then you are Abraham&#x27;s Seed, and Heirs accordi</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-keach.html">Benjamin Keach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pedo-Baptism Disproved</cite></span></figcaption>

</figure><figure class="quote" id="q-fb228d71e6" data-kw="">
<blockquote><p>That the tender of the gospel to the conversion of sinners, is absolutely free (John 3:14–15; 1:12; Isa. 55:1; John 7:37), no way requiring, as absolutely necessary, any qualifications, preparations, terrors of the law, or preceding ministry of the law, but only and alone the naked soul, as a sinner and ungodly to receive Christ (1 Tim. 1:15; Rom. 4:5; 5:8), as crucified, dead, and buried, and risen again, being made a prince and a Savior for such sinners…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First London Baptist Confession</cite>, 1644, Art. 25</span></figcaption>

</figure><figure class="quote" id="q-3fdffb58ff" data-kw="seals">
<blockquote><p>The particularity of the covenant of grace appears from various considerations. (1) From its destination because there was no universal purpose and will in God to pity the whole human race, but a particular will to select and appoint unto salvation a certain number from the common corrupt mass (as has been proved in full, Volume I, Topic IV, Question 17). Therefore, as no such covenant was decided upon in the counsel of God, so neither was it made in time. 2. From its procurement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.6</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The particularity of the covenant of grace appears from various considerations. (1) From its destination because there was no universal purpose and will in God to pity the whole human race, but a particular will to select and appoint unto salvation a certain number from the common corrupt mass (as has been proved in full, Volume I, Topic IV, Question 17). Therefore, as no such covenant was decided upon in the counsel of God, so neither was it made in time. 2. From its procurement.”

— Francis Turretin, Institutes of Elenctic Theology, 12.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20particularity%20of%20the%20covenant%20of%20grace%20appears%20from%20various%20considerations.%20%281%29%20From%20its%20destination%20because%20there%20was%20no%20universal%20purpose%20and%20will%20in%20God%20to%20pity%20the%20whole%20human%20race%2C%20but%20a%20particular%20will%20to%20select%20and%20appoint%20unto%20salvation%20a%20certain%20number%20from%20the%20common%20corrupt%20mass%20%28as%20has%20been%20proved%20in%20full%2C%20Volume%20I%2C%20Topic%20IV%2C%20Question%2017%29.%20Therefore%2C%20as%20no%20such%20covenant%20was%20decided%20upon%20in%20the%20counsel%20of%20God%2C%20so%20neither%20was%20it%20made%20in%20time.%202.%20From%20its%20procurement.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2012.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3fdffb58ff.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3fdffb58ff.html">Permalink</a><a class="src" href="https://drive.google.com/file/d/1YcwwT0MNnEuPwYSOy3Gfw-0tA7Jvm9N8/view?usp=drivesdk" rel="noopener" target="_blank">Read it online · Drive (Nick&#x27;s copy)</a></div>
</figure><figure class="quote" id="q-ee48a721c6" data-kw="unity">
<blockquote><p>From these things the state of the question can clearly be gathered. The question is not: (1) whether the covenant of grace was various as to accidentals and the different modes and degrees of dispensation and manifestation (for we confess that under this relation [schesei] there is a multiple difference between the Old and New Testament or the old and new economy, as will be proved in its proper place). Rather the question is whether it was the same as to substance and the essential parts of the covenant, i.e., both as to the covenanted themselves and as to the federal pact consisting in the mutual obligation of the parties. Whether the same Mediator (Christ) in both; the same faith in Christ; promises of the same spiritual and heavenly blessings; the same way of reconciliation and salvation—the economy and administration only of the covenant varying. This our opponents deny; we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.5.5</span></figcaption>

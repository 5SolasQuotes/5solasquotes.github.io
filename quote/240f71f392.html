<main class="wrap"><figure class="quote" id="q-240f71f392" data-kw="">
<blockquote><p>The deformity of soul which came upon us in the loss of the image of God, wherein beauty and harmony of all our faculties, in all their actings in order unto their utmost end, did consist; that enmity unto God, even in the mind, which ensued therein; that darkness which our understandings were clouded, yea, blinded withal, —the spiritual death which passed on the whole soul, and total alienation from the life of God; that impotency unto good, that inclination unto evil, that deceitfulness of sin, that power and efficacy of corrupt lusts, which the Scriptures and experience so fully charge on the state of lost nature, are rejected as empty notions or fables. No wonder if such persons look upon imputed righteousness as the shadow of a dream, who esteem those things which evidence its necessity to be but fond imaginations. And small hope is there to bring such men to value the righteousness of Christ as imputed to them, who are so unacquainted with their own unrighteousness inherent in them. Until men know themselves better, they will care very little to know Christ at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith in The Works of John Owen, 5:21 (HT: Inwoo Lee)</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-86e2524294" data-kw="">
<blockquote><p>Though we do good works, we do not found our salvation upon them; for we can do no work but what is polluted by our flesh, and also punishable; and although we could perform such works, still the remembrance of one sin is sufficient to make God reject them. Thus, then, we would always be in doubt, tossed to and fro without any certainty, and our poor consciences would be continually vexed if they relied not on the merits of the suffering and death of our Savior.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belgic Confession</cite>, Art. 24</span></figcaption>

</figure><figure class="quote" id="q-4c49dd8aef" data-kw="">
<blockquote><p>A fifth argument is that which so much sounds in all books: If good works be the effect and fruit of our justification, then they cannot be conditions, or causa sine qua non [a cause without which: nothing] of our justification. The consequence is clear, because such a supposed condition, or causa sine qua non, must be antecedent, and going before. Now the Orthodox bring Augustine’s known position, which also may be made good out of Scripture, Bona opera non praecedunt justificandum, sed sequuntur justificatum [‘Good works do not precede being justified, but follow having been justified’]; and another to that sense is quoted out of Gregory: Non per opera venitur ad fidem, sed per fidem ad opera [‘not through works is one come to faith, but through faith to works’], faith must go before works. Till we are justified, we are not able to do anything that is good… Seeing therefore that justification is antecedent to a holy life, good works cannot be any condition of it; and by this we may see that more things are required to our salvation than to our justification; to the possession of heaven and [versus] the entitling us thereunto. For justification does entitle and interest us in that eternal inheritance which is performed by faith; but to be made actual partakers of everlasting happiness, good works are the way to that Kingdom, not the cause of it. Therefore none contend more then the Orthodox writers for the necessity of good works, and that in respect of salvation; yet in respect of our justification, then the Scripture calls them a menstruous rag and such as are utterly unworthy. It’s true that justification cannot be continued in a man unless he continue in good works, yet for all that they are not conditions of his justification: they are qualifications and determinations of the subject who is justified, but no conditions of his justification. As in the generation of man, though there be organical dispositions and qualifications for the soul, yet they have no causality upon the soul, but that is immediately infused by God. Its a thousand times affirmed by our divines, many things are required to the constitution of some subject, which yet are not either causes or conditions of such and such an effect: Light is necessarily required and dryness as qualities in fire, yet it burns as it’s hot, not as light or dry. To the integral being of a man are required his head and shoulders, so that the eye could not see if not seated there; yet a man’s shoulders are not the causa sine qua non of his seeing. Many things are necessarily conjoined together, and yet one is not the condition of the others’ effect. So that this doctrine does not exclude, but [does] command holy works, only it gives faith and works their proper place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated… (London, 1654) | sermon 24</cite>, p. 229-31</span></figcaption>

</figure><figure class="quote" id="q-bc9ba0123a" data-kw="">
<blockquote><p>Many flatter themselves that their state is good and their salvation sure because they do not live securely in a course of sin but, on the contrary, endeavor to keep the commandments as well as they can and because God is so merciful that He will surely pardon the sins that the infirmity of their nature renders unavoidable. This is a common but a very dangerous—yea, a fundamental—error; for it proceeds on the supposition that the righteous law can accept of defective or imperfect obedience and that divine justice can dispense with the punishment of sin. No man under the law as a covenant can be accepted for endeavoring to keep the precepts of it as well as he can. The law does not say, “Labor to obey” but “Do it” and “Do it perfectly and perpetually; do it without the smallest failure.” The least deficiency in obedience will subject a man to the curse. The self-righteous sinner, then, would do well to consider that he is under a law that demands absolute perfection of obedience on pain of death in all its dreadful extent and that, if he has transgressed but in a single instance, he is thereby exposed to the eternal execution of its righteous and tremendous penalty. “Tell me,” says our apostle, “ye that desire to be under the law, do ye not hear the law?” (Gal. 4:21). Do you not hear that it requires perfect obedience of you, on pain of the curse? And if it demands perfect obedience and, at the same time, complete satisfaction for sins that are past, what will you do, who cannot give to it either the one or the other? What will you do in the prospect of death and of judgment, who have no communion with the second Adam in His righteousness? Alas, your own righteousness is far, very far, from being commensurate with the perfect rule of that holy and righteous law by which all your thoughts, words, and actions are then to be tried! … Oh, that self-righteous and secure sinners would consider, before it is too late, how impossible it will be for them ever to obtain eternal life by their own righteousness and that they would, by faith, submit themselves to the righteousness of Jesus Christ, by which He has magnified the law and made it honorable!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel (Grand Rapids: Reformation Heritage Books), 122–23, 124.</cite></span></figcaption>

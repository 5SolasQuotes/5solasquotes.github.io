<main class="wrap"><figure class="quote" id="q-6ea275edff" data-kw="">
<blockquote><p>HERE we call attention to the precise state of the question. When we affirm our national covenants to be still binding on the country, many suppose that we thereby make our fathers a sort of federal heads to their posterity in this country, as Adam was a covenant head to our whole race. This is a misconception of the case. Our opinion on this subject is grounded, not on any thing peculiar to our fathers, but on a characteristic of organised society, common to it at all times, and in all places. We are also supposed to maintain that one party may contract moral obligation, which descends on another and a different party. This idea has been fostered by that unfortunate phrase, “the descending obligation of the covenants,” as if it descended from one party to another; whereas we maintain that it is a continued obligation on the same party.

The view of the matter entertained by us is this:- We believe that organised society has a standing before God distinct from that of its individual members that it is possessed of a permanent identity — that, notwithstanding the changes taking place upon its members, it is regarded by God as one during the whole course of its existence, just as an individual is morally one during his whole immortality, in despite of the changes taking place upon him during every period of his being. From the fact that society has this permanent character, it follows that every succeeding age is bound to fulfil all the unfulfilled engagements of those which preceded; and in doing so, it is not one class of persons discharging obligations come under by another class of persons; it is one society fulfilling the obligations contracted by itself — the same society represented by different members.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-white.html">William White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Covenant the best Defence of Christ’s crown; or our National Covenants Scriptural, Catholic, and of Permanent Obligation</cite>, (Edinburgh: W. P. Kennedy, 1844), pp 62-63.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-4ae8fece6a" data-kw="">
<blockquote><p>And when Robert Hamilton came from abroad [from the Netherlands] among them, they got a brow of brass, calling him [i.e. Alexander Shields, one of the last three Cameronian ministers] a liar, and upbraided him to his face, saying, although he used these arguments [to join the 1690 Church of Scotland] to draw them out of the way of the Lord, yet you dare not publish them. I well remember he said, ‘Dare I not? dare I not? I promise before you all, I both dare and will, and avow it before the world.’ [which he did] But alas they still gave us a deaf ear, and now will not be spoken to nor plead with; however it stands for our mite of testimony… But, if the Lord spare, I resolve to give the world a more surprising account of the rude treatment and unheard-of ingratitude Mr. Shields, [Thomas] Linning [another of the last three Cameronian ministers, which joined the 1690 Church of Scotland], and others received at that time, and since, at their hands… …all know that it was the fewest number of the United Societies, that was led off with Robert Hamilton to the disowning of King William as King of Britain and his Government; the greater part [of the Cameronians] reckoned it their duty to take a legal unite way of witnessing, by humble pleadings, representations, and protestations, pleading for and with their mother to put away her whoredoms.</p></blockquote>

<blockquote><p>We must therefore know, it is not every seperation from that which is called a Church that is a note of an Antichristian spirit, but it must be known whether that were the true Church; now this Church St. John speaks of was the true Church, for it was from such whose sins were forgiven; now if it be not a true Church that they break from, it is no sign of Antichrist: 2 Chron. 11:16, such as set their hearts to seek the Lord, separated themselves from those that followed Jeroboam, and came to Jerusalem; so the apostles were fain to seperate from the Church of the Jews which persecuted Christ, and them, and so constituted a Church by themselves, a Christian Church; so then it is not a seperation from a false Church, but a true, that is a sign of an Antichristian spirit. … Use 2. It may teach us what to judge of the Separatists, or Brownists, are they of Antichrist? Surely their practise is blame-worthy:

1. Because they seperate, where Christ keeps fellowship, Rev. 1:18; and that He walks with us, we argue, because He is still pleased to dispense to us the Word of Life, and edifies many souls thereby, and therefore surely Christ has fellowship, and shall man be more pure than his Maker? where Christ vouchsafes fellowship, shall man renounce it? If they be converted, where had they their conversion?

2. Have not many of God’s servants heretofore kept company with Churches as corrupt as ours are? Did not Peter and John keep company with them and shall they be more pure and curious?

3. Christ commands: ‘If thy brother offends admonish him; if he hear thee not, take two or three more; if he hear not them, then tell it to the Church, and if he hear not the Church, let him be to thee as an heathen, or publican;’ (Mt. 18:17) but if the church hear not thy complaint, He does not say let the church be as an heathen, or publican;</p></blockquote>

<blockquote><p>Also it is said, Acts 2:47, ‘God added to the Church daily such as should be saved’; which was not a particular congregational church, but the catholic. For it is not probable that those hundred and twenty that were together at Pentecost were one congregational church, for many of them were men of Galilee, which by their habitation could not pertain to the Church in Jerusalem, and yet the rest were added to them. … Again Eph. 4:4-5, the apostle proves the Church to be but one by diverse arguments. First he says, ‘There is but one body’ of Christ… Secondly, there is but one Spirit in that whole body, which is as one soul in one body. Thirdly, there is but one hope of their calling. Fourthly, there is but one Lord or King over the whole Church. Fifthly, there is but one Faith, i.e. one religion, doctrine, worship, the same commands and statutes for all. Sixthly, There is but one baptism to admit into this Church. Now if the whole world were under one King, and governed by one Law, and all capable of the same privileges, and all made denizons by the same way of enrollment, it would make but one empire; yet so it is with all the Churches in the world: they have the same King, Law, Word, sacraments, of admission and nutrition, which they visibly subject themselves unto and receive; therefore they are all one visible Church.</p></blockquote>

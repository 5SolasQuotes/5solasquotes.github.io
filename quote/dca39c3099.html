<main class="wrap"><figure class="quote" id="q-dca39c3099" data-kw="">
<blockquote><p>John the Baptist was an occasional conformist to the Jewish Church: He went to Jerusalem to worship thrice a year at the solemn feasts, according to the Law; but at other times he held separate assemblies in the wilderness of Judea at Jordan, and at Enon, where he taught and baptized… Our Lord Jesus Christ, the Author of our holy religion, was also an occasional conformist. We find Him sometimes in the Temple and synagogues; at other times preaching in private houses, on mountains and in the wilderness, etc… He preached in separate congregations, was a dissenter from the imposed ceremonies and traditions of the elders, and vindicated his disciples in their non-conformity to them, telling his censorious accusers that they ‘taught for doctrine the commandments of men.’ (Mt. 15:1-9; Mk. 7:1-8) The apostles of our Lord Jesus, in imitation of their Master, were occasional conformists. One while we find them in the Temple at public worship and teaching there. (Acts 3:1; 4:1) Another while in a private meeting, or conventicle, as some would call it. St. Luke says, ‘They continued daily with one accord in the Temple’, and ‘broke bread from house to house.’ (Acts 2:46) St. Paul, the apostle of the gentiles, was eminent for occasional conformity. He exhorts the Christians to assert their freedom from the law of ceremonies (Gal. 5:1), lives himself after the manner of the gentiles (Gal. 2:14), and by consequence, in fellowship with them, yet occasionally purified himself in the Temple, according to the Law of Moses. (Acts 21:26) He was a dissenter from the ceremonies of the Law, and yet submits to them to avoid offense. He statedly communicated with the gentile Churches, but holds occasional communion with the national Jewish Church. He judged occasional communion lawful, but did not therefore conclude constant communion a duty, nay, it had been sinful to him and all other Christians; for then they must have separated from the fellowship of the Gospel, and renounced Christianity… From this different constitutions of the Jewish [in Acts 15:21] and Gentile Churches, it follows, 1. That there was no exact uniformity in the Churches planted by the apostles. Nor did they make any laws of uniformity in lesser matters, as the condition of Christian communion; but left the believers to follow their different sentiments, and to approve themselves to God therein. Some were free to eat all things, others eat herbs, rather than forbidden flesh, or clean flesh dressed after the manner of the gentiles, some observed days, others not. (Rom. 14:2, 5) Here is a manifest difference in practice, and the rule or canon which the apostle gives about it, is not a rule of uniformity, but of charity, not to despise or judge one another. (Rom. 14:3)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-owen.html">James Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Moderation a Virtue, or, The Occasional Conformist Justified from the Imputation of Hypocrisy… (London: Baldwin, 1703)</cite>, pp. 7-9</span></figcaption>

<blockquote><p>There was a certain Count of your [Reformed] confession who possessed common jurisdiction in a certain church with a certain Prince of our [Lutheran] religion. Therefore since the Associate was judging that he [the reformed Count] had more of right in that church, he made sure that the altar was destroyed and that a table be built [for the Lord’s Supper] in the temple [church building]. The Prince found out later about this, and ordered that the table be removed and an altar be constructed again. The Count in return took care a second time in return that the altar be destroyed, and the table restored. The Prince likewise a second time ordered that the table be taken away and the altar restored. I do not know whether this happened a third time. But the [reformed] Count later heeded the [Lutheran] Prince’s strictness, and left off from his course, such that the altar remained in the temple in place of the table.</p></blockquote>

<blockquote><p>…Bread and Wine… Christ did not take these two by accident, because He found them then on the table, but by choice and election for their use in signifying… … But what shall those places or countries do that have no bread of corn, no fruit of the vine: I confess that though God said in the Passover, a lamb or kid, yet Christ expresses nothing there of other materials, and therefore in case of extreme necessity, where the proper elements cannot be had, they must either be without the ordinance, or celebrate in that which is analogical and which passes for bread with them, or wine with them; which it’s better (say some, Moulin, Buckler, p. 531; Beza, Epistle 2) to do, than wholly to be deprived; but this eclipse is not likely to be seen in our horizon, therefore I shall not further discuss it.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…Bread and Wine… Christ did not take these two by accident, because He found them then on the table, but by choice and election for their use in signifying… … But what shall those places or countries do that have no bread of corn, no fruit of the vine: I confess that though God said in the Passover, a lamb or kid, yet Christ expresses nothing there of other materials, and therefore in case of extreme necessity, where the proper elements cannot be had, they must either be without the ordinance, or celebrate in that which is analogical and which passes for bread with them, or wine with them; which it’s better (say some, Moulin, Buckler, p. 531; Beza, Epistle 2) to do, than wholly to be deprived; but this eclipse is not likely to be seen in our horizon, therefore I shall not further discuss it.”

— Richard Vines, A Treatise of the Right Institution, Administration &amp; Receiving of the Sacrament of the Lord’s Supper… (London, 1657), Ch. 6, ‘Of the Outwards of this Ordinance of the Supper’, section 3, ‘Of the Elements of Bread &amp; Wine’, pp. 72 &amp; 75 bound after Sermons Preached upon Several Public &amp; Eminent Occasions… (London, 1656) Vines was a presbyterian and Westminster divine.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6Bread+and+Wine%E2%80%A6+Christ+did+not+take+these+two+by+accident%2C+because+He+found+them+then+on+the+table%2C+but+by+choice+and+election+for+their+use+in+signifying%E2%80%A6+%E2%80%A6+But+what+shall+those+places+or+countries+do+that+have+no+bread+of+corn%2C+no+fruit+of+the+vine%3A+I+confess+that+though+God+said+in+the+Passover%2C+a+lamb+or+kid%2C+yet+Christ+expresses+nothing+there+of+other+materials%2C+and+therefore+in+case+of+extreme+necessity%2C+where+the+proper+elements+cannot+be+had%2C+they+must+either+be+without+the+ordinance%2C+or+celebrate+in+that+which+is+analogical+and+which+passes+for+bread+with+them%2C+or+wine+with+them%3B+which+it%E2%80%99s+better+%28say+some%2C+Moulin%2C+Buckler%2C+p.+531%3B+Beza%2C+Epistle+2%29+to+do%2C+than+wholly+to+be+deprived%3B+but+this+eclipse+is+not+likely+to+be+seen+in+our+horizon%2C+therefore+I+shall+not+further+discuss+it.%E2%80%9D%0A%0A%E2%80%94+Richard+Vines%2C+A+Treatise+of+the+Right+Institution%2C+Administration+%26+Receiving+of+the+Sacrament+of+the+Lord%E2%80%99s+Supper%E2%80%A6+%28London%2C+1657%29%2C+Ch.+6%2C+%E2%80%98Of+the+Outwards+of+this+Ordinance+of+the+Supper%E2%80%99%2C+section+3%2C+%E2%80%98Of+the+Elements+of+Bread+%26+Wine%E2%80%99%2C+pp.+72+%26+75+bound+after+Sermons+Preached+upon+Several+Public+%26+Eminent+Occasions%E2%80%A6+%28London%2C+1656%29+Vines+was+a+presbyterian+and+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff23d618857.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a c

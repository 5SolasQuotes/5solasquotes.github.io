<blockquote><p>2. Under the new covenant or testament, however, these promised blessings are not given to all men, because God is true, thus the covenant is necessarily discriminate. These blessings are given, however, doubly when the covenant is received. In the first place, by the substance of the covenant itself or by the promised blessings from God themselves, then by their administration in the visible assembly. In the first sense (learned from Jeremiah in the place already cited), which substance also is peculiar to the elect. For to all the elect and to them alone, this part, the remission of sins, renewal to the image of God, and the knowledge of God itself is therefor promised, or which embraces God’s favor which they would never have had from themselves (John 6:44,45; 64,65; 10:26; 11:52; Acts 13:47,48; Romans 8:29,30; 9:7,8,9,11,15,16; Titus 1:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De substantia foederis gratuiti inter deum et electos</cite>, 1.1.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-ee48a721c6" data-kw="unity">
<blockquote><p>From these things the state of the question can clearly be gathered. The question is not: (1) whether the covenant of grace was various as to accidentals and the different modes and degrees of dispensation and manifestation (for we confess that under this relation [schesei] there is a multiple difference between the Old and New Testament or the old and new economy, as will be proved in its proper place). Rather the question is whether it was the same as to substance and the essential parts of the covenant, i.e., both as to the covenanted themselves and as to the federal pact consisting in the mutual obligation of the parties. Whether the same Mediator (Christ) in both; the same faith in Christ; promises of the same spiritual and heavenly blessings; the same way of reconciliation and salvation—the economy and administration only of the covenant varying. This our opponents deny; we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.5.5</span></figcaption>

</figure><figure class="quote" id="q-4ce57579ea" data-kw="">
<blockquote><p>(1.) The life which he now led was a life of faith with respect unto things spiritual and eternal. For he had for the foundation and object hereof, [1.] The promise of the blessed Seed, and the spiritual blessing of all nations in him, as a confirmation of the first fundamental promise to the church, concerning the Seed of the woman that was to break the serpent’s head. And [2] God entered expressly into covenant with him, confirming it with the seal of circumcision, wherein he obliged himself to be his God, his God almighty, or all-sufficient, for his temporal and eternal good. To suppose that Abraham saw nothing in this promise and covenant but only things confined unto this life, nothing of spiritual grace or mercy, nothing of eternal reward or glory, is so contrary to the analogy of faith, to express testimony of Scripture, so destructive of all the foundations of religion, so unworthy of the nature and properties of God, rendering his title of “the father of the faithful,” and his example in believing, so useless, as that it is a wonder men of any tolerable sobriety should indulge to such an imagination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 24.67.</span></figcaption>

</a></div>
</figure><figure class="quote" id="q-2b13774c16" data-kw="">
<blockquote><p>1. The first ground is the Lord’s disposition and nature of mercy and placableness towards a poor sinner, which gives him footing for his hope abundantly in any particular case, as: (1.) From his Name and attributes, whereby He has made Himself known to his people. God proclaims his Name to Moses to be ‘the Lord, the Lord God, the powerful, the mighty Jehovah’ (Ex. 34 [vv. 6-7]), which ministers comfort when annexed to his manifestation of Himself in this way of mercy. ‘Merciful,’ inclined to pity the sin and misery of his people, ready to relieve them in their distress and not only just to require the due service and punish the defaults; ‘Gracious,’ of an affable condescending descending nature, not standing upon the distance that He is in as a great King above all his creatures; He may be petitioned, sought unto and prevailed with by his poor suitors. ‘Long-suffering,’ that is, not hasty to use severity with the worst of sinners, usually taking all other ways first with them, willing that all men should repent and come to the knowledge of the truth (1 Tim. 2:4): Trying many that repent not with much goodness to draw them to it. Enduring with much patience the very vessels of wrath before He brings destruction on them (Rom. 9:22). In all cases He forgives iniquity, transgression and sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-newcome.html">Henry Newcome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Hope</cite>, ... (London: E.C., 1660 [1659]), ch. 4, pp. 25-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

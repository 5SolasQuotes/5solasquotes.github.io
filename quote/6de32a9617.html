<main class="wrap"><figure class="quote" id="q-6de32a9617" data-kw="">
<blockquote><p>The Bible is a plain book. It is intelligible by the people. And they have the right, and are bound to read and interpret it for themselves; so that their faith may rest on the testimony of the Scriptures, and not on that of the Church. Such is the doctrine of Protestants on this subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §5</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Bible is a plain book. It is intelligible by the people. And they have the right, and are bound to read and interpret it for themselves; so that their faith may rest on the testimony of the Scriptures, and not on that of the Church. Such is the doctrine of Protestants on this subject.”

— Charles Hodge, Systematic Theology, vol. 1, Introduction, ch. 6, §5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20Bible%20is%20a%20plain%20book.%20It%20is%20intelligible%20by%20the%20people.%20And%20they%20have%20the%20right%2C%20and%20are%20bound%20to%20read%20and%20interpret%20it%20for%20themselves%3B%20so%20that%20their%20faith%20may%20rest%20on%20the%20testimony%20of%20the%20Scriptures%2C%20and%20not%20on%20that%20of%20the%20Church.%20Such%20is%20the%20doctrine%20of%20Protestants%20on%20this%20subject.%E2%80%9D%0A%0A%E2%80%94%20Charles%20Hodge%2C%20Systematic%20Theology%2C%20vol.%201%2C%20Introduction%2C%20ch.%206%2C%20%C2%A75&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6de32a9617.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6de32a9617.html">Permalink</a><a class="src" href="https://ccel.org/ccel/hodge/theology1" rel="noopener" target="_blank">Read it online · CCEL, vol. 1</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d8438f77a1" data-kw="">
<blockquote><p>But the Papists are doubly foolish, when they conclude from this passage, that no interpretation of a private man ought to be deemed authoritative. For they pervert what Peter says, that they may claim for their own councils the chief right of interpreting Scripture; but in this they act indeed childishly; for Peter calls interpretation private, not that of every individual, in order to prohibit each one to interpret; but he shews that whatever men bring of their own is profane.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, 2 Peter 1:20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-churchs-authority-over-scripture.html">The church&#x27;s authority over Scripture</a></span><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a> › <a href="../topics/the-church/creeds-confessions-and-councils/ecumenical-councils.html">Ecumenical councils</a></span></div>

— John Calvin, Commentaries on the Catholic Epistles, 2 Peter 1:20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut%20the%20Papists%20are%20doubly%20foolish%2C%20when%20they%20conclude%20from%20this%20passage%2C%20that%20no%20interpretation%20of%20a%20private%20man%20ought%20to%20be%20deemed%20authoritative.%20For%20they%20pervert%20what%20Peter%20says%2C%20that%20they%20may%20claim%20for%20their%20own%20councils%20the%20chief%20right%20of%20interpreting%20Scripture%3B%20but%20in%20this%20they%20act%20indeed%20childishly%3B%20for%20Peter%20calls%20interpretation%20private%2C%20not%20that%20of%20every%20individual%2C%20in%20order%20to%20prohibit%20each%20one%20to%20interpret%3B%20but%20he%20shews%20that%20whatever%20men%20bring%20of%20their%20own%20is%20profane.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentaries%20on%20the%20Catholic%20Epistles%2C%202%20Peter%201%3A20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd8438f77a1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d8438f77a1.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom45" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-af1d9fc9d0" data-kw="">
<blockquote><p>We do not say that each individual should acquiesce in that interpretation which his own private spirit frames and dictates to him; for this would be to open a door to fanatical tempers and spirits: but we say that that Spirit should be the judge, who speaks openly and expressly in the scriptures, and whom all may hear; by him we desire that all other spirits, that is, all doctrines, (for so the word is to be taken in this place,) should be examined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Controversy 1, Q. 5, ch. 5 (pp. 433–34)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“We do not say that each individual should acquiesce in that interpretation which his own private spirit frames and dictates to him; for this would be to open a door to fanatical tempers and spirits: but we say that that Spirit should be the judge, who speaks openly and expressly in the scriptures, and whom all may hear; by him we desire that all other spirits, that is, all doctrines, (for so the word is to be taken in this place,) should be examined.”

</figure><figure class="quote" id="q-a4810c40f0" data-kw="">
<blockquote><p>Were, then, the whole world unanimous, and were the minds of all men united together, still what would proceed from them, would be private or their own; for the word is here set in opposition to divine revelation; so that the faithful, inwardly illuminated by the Holy Spirit, acknowledge nothing but what God says in his word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, 2 Peter 1:20</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Were, then, the whole world unanimous, and were the minds of all men united together, still what would proceed from them, would be private or their own; for the word is here set in opposition to divine revelation; so that the faithful, inwardly illuminated by the Holy Spirit, acknowledge nothing but what God says in his word.”

— John Calvin, Commentaries on the Catholic Epistles, 2 Peter 1:20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWere%2C%20then%2C%20the%20whole%20world%20unanimous%2C%20and%20were%20the%20minds%20of%20all%20men%20united%20together%2C%20still%20what%20would%20proceed%20from%20them%2C%20would%20be%20private%20or%20their%20own%3B%20for%20the%20word%20is%20here%20set%20in%20opposition%20to%20divine%20revelation%3B%20so%20that%20the%20faithful%2C%20inwardly%20illuminated%20by%20the%20Holy%20Spirit%2C%20acknowledge%20nothing%20but%20what%20God%20says%20in%20his%20word.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentaries%20on%20the%20Catholic%20Epistles%2C%202%20Peter%201%3A20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa4810c40f0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a4810c40f0.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom45" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-a7d656db67" data-kw="Augustine Authority of the church">
<blockquote><p>Augustine, therefore, does not here say that the faith of the godly is founded on the authority of the Church; nor does he mean that the certainty of the gospel depends upon it; … the obvious inference from them is, that this holy man had no intention to suspend our faith in Scripture on the nod or decision of the Church, but only to intimate (what we too admit to be true) that those who are not yet enlightened by the Spirit of God, become teachable by reverence for the Church, and thus submit to learn the faith of Christ from the gospel. In this way, though the authority of the Church leads us on, and prepares us to believe in the gospel, it is plain that Augustine would have the certainty of the godly to rest on a very different foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.7.3</span></figcaption>

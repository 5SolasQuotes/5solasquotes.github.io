<main class="wrap"><figure class="quote" id="q-d49f56a941" data-kw="">
<blockquote><p>Wherefore we thought it right, to shew forth with all accuracy, in our present definition the error of such as make and venerate these, for it is the unanimous doctrine of all the holy Fathers and of the six Ecumenical Synods, that no one may imagine any kind of separation or mingling in opposition to the unsearchable, unspeakable, and incomprehensible union of the two natures in the one hypostasis or person. What avails, then, the folly of the painter, who from sinful love of gain depicts that which should not be depicted—that is, with his polluted hands he tries to fashion that which should only be believed in the heart and confessed with the mouth? He makes an image and calls it Christ. The name Christ signifies God and man. Consequently it is an image of God and man, and consequently he has in his foolish mind, in his representation of the created flesh, depicted the Godhead which cannot be represented, and thus mingled what should not be mingled. Thus he is guilty of a double blasphemy—the one in making an image of the Godhead, and the other by mingling the Godhead and manhood. Those fall into the same blasphemy who venerate the image, and the same woe rests upon both, because they err with Arius, Dioscorus, and Eutyches, and with the heresy of the Acephali. When, however, they are blamed for undertaking to depict the divine nature of Christ, which should not be depicted, they take refuge in the excuse: We represent only the flesh of Christ which we have seen and handled. But that is a Nestorian error. For it should be considered that flesh was also the flesh of God the Word, without any separation, perfectly assumed by the divine nature and made wholly divine. How could it now be separated and represented apart? So is it wish the human soul of Christ which mediates between the Godhead of the Son and the dulness of the flesh. As the human flesh is at the same time flesh of God the Word, so is the human soul also soul of God the Word, and both at the same time, the soul being deified as well as the body, and the Godhead remained undivided even in the separation of the soul from the body in his voluntary passion. For where the soul of Christ is, there is also his Godhead; and where the body of Christ is, there too is his Godhead. If then in his passion the divinity remained inseparable from these, how do the fools venture to separate the flesh from the Godhead, and represent it by itself as the image of a mere man? They fall into the abyss of impiety, since they separate the flesh from the Godhead, ascribe to it a subsistence of its own, a personality of its own, which they depict, and thus introduce a fourth person into the Trinity. Moreover, they represent as not being made divine, that which has been made divine by being assumed by the Godhead. Whoever, then, makes an image of Christ, either depicts the Godhead which cannot be depicted, and mingles it with the manhood (like the Monophysites), or he represents the body of Christ as not made divine and separate and as a person apart, like the Nestorians. The only admissible figure of the humanity of Christ, however, is bread and wine in the holy Supper. This and no other form, this and no other type, has he chosen to represent his incarnation. Bread he ordered to be brought, but not a representation of the human form, so that idolatry might not arise. And as the body of Christ is made divine, so also this figure of the body of Christ, the bread, is made divine by the descent of the Holy Spirit; it becomes the divine body of Christ by the mediation of the priest who, separating the oblation from that which is common, sanctifies it. The evil custom of assigning names to the images does not come down from Christ and the Apostles and the holy Fathers; nor have these left behind them, any prayer by which an image should be hallowed or made anything else than ordinary matter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-schaff.html">Philip Schaff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>eds., “Epitome of the Definition of the Iconoclastic Conciliabulum,” in The Seven Ecumenical Councils, trans. Henry R. Percival, vol. 14, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Charles Scribner’s Sons, 1900), 543–44.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-268fbb81ca" data-kw="">
<blockquote><p>And can a man devise to tear the majesty of our Lord Jesus Christ and to deface his glory more than by the things that the Papists do? Behold, they paint and portray Jesus Christ, who (as we know) is not only man, but also God manifested in the flesh: and what a representation is that? He is God’s eternal son, in whom dwells the fulness of the Godhead, yea even substantially. Seeing it is said, substantially, should we have portraitures and images whereby the only flesh may be represented? Is it not a wiping away of that which is chiefest in our Lord Jesus Christ, that is to wit, of his divine majesty? Yes: and therefore whensoever a crucifix stands mopping and mowing in the Church, it is all one as if the Devil had defaced the Son of God.</p></blockquote>

</figure><figure class="quote" id="q-523fa3b4da" data-kw="">
<blockquote><p>And after all this, if it should please God [that] any person of the blessed and most holy Trinity should appear in any visible shape, that shape might be depicted; of that shape an image might be made; I mean, it might naturally; it might if it were done for lawful ends, and unless a commandment were to the contrary; and therefore so long as God keeps himself within the secret recesses of his sanctuary, and the majesty of his invisibility, so long it is plain he intends the very first sense and words of his [Second] Commandement: but if he should cancel the great reason [Dt. 4, end] of his Commandement, and make that by an act of his own to become possible which in the nature of things is impossible, that is, that an image can be made of God; I should believe that God did intend to dispense in that part of the Commandement, and declare that he intended it only for a temporary band: For if the reason of the commandement were taken away; either the commandement also ceases to oblige; or must be bound upon us by another reason, or a new sanction, or at lest a new declaration; or else it would follow that then his visible appearance would become a snare to mankind. But because yet he has not yet appeared visibly and has by no figure or idea represented the Godhead; and that it is a truth which must last as long as Christian religion lasts, that no man can see God, therefore it follows that it is at no hand lawful to make an image of God or relating to the divinity. If a dove be made it must not be intended to represent the Holy Ghost, for besides that no dove did appear, nor shape of a dove, yet if it did, it related not to the person of the Holy Ghost, but to the impression made upon the person on whom the light descended: and if the figure of the crucifix be made, or of Jesus in the flesh, it is wholly relative to the creature, not to him as God; for that is impious, and unreasonable and impossible to be done in any natural proportion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium, or, The Rule of Conscience in all her General Measures serving as a great instrument for the determination of cases of conscience… (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook.</cite>, p. 336</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“And after all this, if it should please God [that] any person of the blessed and most holy Trinity should appear in any visible shape, that shape might be depicted; of that shape an image might be made; I mean, it might naturally; it might if it were done for lawful ends, and unless a commandment were to the contrary; and therefore so long as God keeps himself within the secret recesses of his sanctuary, and the majesty of his invisibility, so long it is plain he intends the very first sense and words of his [Second] Commandement: but if he should cancel the great reason [Dt. 4, end] of his Commandement, and make that by an act of his own to become possible which in the nature of things is impossible, that is, that an image can be made of God; I should believe that God did intend to dispense in that part of the Commandement, and declare that he intended it only for a temporary band: For if the reason of the commandement were taken away; either the commandement also ceases to oblige; or must be bound upon us by another reason, or a new sanction, or at lest a new declaration; or else it would follow that then his visible appearance would become a snare to mankind. But because yet he has not yet appeared visibly and has by no figure or idea represented the Godhead; and that it is a truth which must last as long as Christian religion lasts, that no man can see God, therefore it follows that it is at no hand lawful to make an image of God or relating to the divinity. If a dove be made it must not be intended to represent the Holy Ghost, for besides that no dove did appear, nor shape of a dove, yet if it did, it related not to the person of the Holy Ghost, but to the impression made upon the person on whom the light descended: and if the figure of the crucifix be made, or of Jesus in the flesh, it is wholly relative to the creature, not to him as God; for that is impious, and unreasonable and impossible to be done in any natural proportion.”

— Jeremy Taylor, Ductor dubitantium, or, The Rule of Conscience in all her General Measures serving as a great instrument for the determination of cases of conscience… (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook., p. 336">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+after+all+this%2C+if+it+should+please+God+%5Bthat%5D+any+person+of+the+blessed+and+most+holy+Trinity+should+appear+in+any+visible+shape%2C+that+shape+might+be+depicted%3B+of+that+shape+an+image+might+be+made%3B+I+mean%2C+it+might+naturally%3B+it+might+if+it+were+done+for+lawful+ends%2C+and+unless+a+commandment+were+to+the+contrary%3B+and+therefore+so+long+as+God+keeps+himself+within+the+secret+recesses+of+his+sanctuary%2C+and+the+majesty+of+his+invisibility%2C+so+long+it+is+plain+he+intends+the+very+first+sense+and+words+of+his+%5BSecond%5D+Commandement%3A+but+if+he+should+cancel+the+great+reason+%5BDt.+4%2C+end%5D+of+his+Commandement%2C+and+make+that+by+an+act+of+his+own+to+become+possible+which+in+the+nature+of+things+is+impossible%2C+that+is%2C+that+an+image+can+be+made+of+God%3B+I+should+believe+that+God+did+intend+to+dispense+in+that+part+of+the+Commandement%2C+and+declare+that+he+intended+it+only+for+a+temporary+band%3A+For+if+the+reason+of+the+commandement+were+taken+away%3B+either+the+commandement+also+ceases+to+oblige%3B+or+must+be+bound+upon+us+by+another+reason%2C+or+a+new+sanction%2C+or+at+lest+a+new+declaration%3B+or+else+it+would+follow+that+then+his+visible+appearance+would+become+a+snare+to+mankind.+But+because+yet+he+has+not+yet+appeared+visibly+and+has+by+no+figure+or+idea+represented+the+Godhead%3B+and+that+it+is+a+truth+which+must+last+as+long+as+Christian+religion+ <blockquote><p>Nay thou worshippest them, who makest them that they may be worshipped. But in all other senses the making a picture is not making an idol; and therefore that severe sense of the commandment, though as it is most probable it did oblige the Jews, and all persons in equal danger; yet because the reason may cease, and the danger be secured, when it is ceased, the obligation also is null; and therefore though that was in the commandment, yet it is no part of its morality; but that excepted, every other clause [of the Second Commandment] is moral and eternal.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e82de1bc9b" data-kw="">
<blockquote><p>But this sacred and holy image [of the glorified Christ in Rev. 1] instructs in all these points all the faithful of Christ most fully. Howbeit this image of Christ is not to be set forth with colors, since that colors cannot attain to the majesty thereof: but with the ecclesiastical doctrine, which has the promises of the Spirit of Christ: And is therefore more evident, and only meet for the true expressing thereof. Let us also print the same image, not upon any dead table with colors that will perish and fade, but in our hearts through the lively Spirit of God, which may also keep it in our minds, never to be wiped out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Hundred Sermons upon the Apocalypse of Jesus Christ</cite>, … (London: 1561), 5th Sermon, p. 33</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c2600adf74" data-kw="">
<blockquote><p>To make an image of God is to blaspheme Him. An infinite nature cannot be represented, but it must be an infinite disparagement to it. It may be asked, May not God be represented by such corporeal forms as sometimes He appeared in? Answer: In the burning bush and in the glory on Mount Sinai, God appeared not as in an image or representation of Himself, but as in symbols of his presence. Whether it were God or angels only that appeared to Abraham and Jacob in human shape, is controvertible; or it might be God the Son as a preludium to his incarnation. Besides, God did not take those human shapes as images or representations of Himself, but as signs of his presence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship, 2nd Part in The Remains of… John Corbet… (London: Parkhurst, 1684) | section 16, pp. 202-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

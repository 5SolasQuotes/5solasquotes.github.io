<blockquote><p>If rulers should command preaching, prayer, etc. to exclude the singing of psalms, that is their sin and not the people’s, who must not (like peevish children at meat) refuse all because they cannot have what they would.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9db19e5262" data-kw="">
<blockquote><p>As to [John Brown of Wamphray’s charge of the partially conforming Scottish ministers] being robbed of the key of discipline, Wamphray, exaggerating, means partially so, so far as the presbyteries were restricted in certain ways by the bishops, and that externally, whereas much of the spiritual discipline of Christ could still be fulfilled through the pastors’ ministries (as our [English puritan] authors below will profoundly show) and presbyteries. All Church order and discipline, be reminded, as to being performed in specific circumstances, is a matter of decency, order and edification, and is limited thereto (1 Cor. 14:26, 40).¹ ¹ See ‘How All Church Governing May be Practically Done unto Edification’ and ‘On How Church Discipline is Limited to Edification in its Time &amp; Place, etc.’ at ‘On the Ordinances, Order &amp; Policy of the Church’ (RBO) In a passage the puritans often commented on to our purpose, Dt. 12:8–11, God’s people were to put off their enjoined, stated worship ordinances while they were in the wilderness (in that broken and declining Church-state) till they came “to the rest and to the inheritance,” when God would give “you rest from all your enemies round about, so that ye dwell in safety. Then… shall ye bring all that I command you, your burnt offering, and your sacrifices…” One key factor, the passage says, for legitimately omitting whole swaths of public discipline and worship is ‘that ye dwell in safety.’… … Heb. 3:2 says, in a comparison with Christ, “Moses was faithful in all his house.” Yet Moses and the Israelites in Ex. 8:25–26 (in that broken and declining Church-state) were not sacrificing to God in Egypt so as not to scandalize the Egyptians and for their physical safety, for “will they not stone us?” Thus Moses (the prophetic mouthpiece here before Pharoah) reasoned regarding sacrificing animals before their enemies: “It is not meet so to do.” Yet God heard the Israelites’ prayers and accepted their moral obedience unto Him (Ex. 1:21; 2:24; 3:7; 4:31; 6:5; 9:20; 14:13, 31), which they did not transgress even when in danger of their lives (Ex. 1:17), in contrast to omitting public worship ordinances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, pp. 155-56</span></figcaption>

</figure><figure class="quote" id="q-4ecf20077e" data-kw="">
<blockquote><p>[Job 15:15] ‘For God finds not steadfastness in his saints (that is to say in his angels), neither are the heavens clean in his sight:’… For first and foremost they [men] had need to be cleaner and purer than the angels, and they had need to surmount the brightness of the sun and the stars, seeing that the heavens themselves are infected before God, if comparison should be made between them and Him… But there is another higher righteousness in God, which surmounts all creatures, insomuch as no angel is able to satisfy it. And no wonder at all: for what comparison is there between an infinite thing and a thing that has bounds? Behold, although the angels have great glory in them: yet are they but creatures. And what is God? He is an infinite thing, insomuch that when we think upon Him, we ought to be ravished into astonishment. So then let us not think it strange, that God’s righteousness should be so high that when all creatures come to that point, all that is to be found in them shall be nothing at all, but they shall deserve to be utterly wiped out… And so far are we unable to stand upright that the very angels of heaven are confounded there. And why? Because the very heavens themselves are not clean. For whereas God has created the sun to give light to the world, and given some brightness to the stars also: it follows not therefore that they have a divine perfection. We must remember what has been said afore: namely that all the creatures that God made do keep still some marks of his grace. But if a man would compare that which is in the creatures with that which is in God: he shall find that the one is all and the other is nothing. Thus ye see how the heavens are not clean, that is to say, that there is always some imperfection in the creatures, so as they have not the power to stand before God, as in respect of the infinite glory that is in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons… upon the Book of Job (London: 1574), 2nd sermon on ch. 15, 58th Sermon</cite>, pp. 298-99</span></figcaption>

</figure><figure class="quote" id="q-655d825017" data-kw="">
<blockquote><p>‘Ye shall not do’ (says Moses) ‘after all things, which we do here this day, every man, all that is right in his own eyes.’ [Dt. 12:8]… And the speech of Moses seems to mean the true service of God, which was not yet perfected, neither could be in their travels, as it was after in Canaan, vv. 10-11. Not that they sacrificed after their fancy (says the Geneva notes) but that God would be served more purely in the land of Canaan. Junius upon this place notes: ‘Etsi oblationum lex una semper fuit ab initi• praescripta a Deo, non potuit tamen usque adeo in ambulatoriis Israelitarum castris observari, ant summo jure ab illis exigi, prout ostendit; Antithesis, verse 11; vide Num, 28:6.’ The [Romanist] Douay divines, on the place, give this observation, ‘In the desert they could not observe the ceremonies of the Law, but coming to rest, they were bound to keep all one set form of holy rites.’ The conclusion from this text is that God is pleased to dispense with his people in his own prescribed worship, until, if He has appointed, determined, or appropriated a certain form, time and place, they have opportunity to serve Him at that time, in that place, and after that form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam… (London: R.B., 1642), ch. 1, section 4</cite>, p. 51</span></figcaption>

edbooksonline.com/on-church-ordinances/#:~:text=%E2%80%98Ye%20shall%20not%20do%E2%80%99%20%28says%20Moses%29,that%20place%2C%20and%20after%20that%20form." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

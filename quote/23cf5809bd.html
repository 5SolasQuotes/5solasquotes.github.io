<main class="wrap"><figure class="quote" id="q-23cf5809bd" data-kw="">
<blockquote><p>The Emperor Constantine… was wont to write prayers and orations or sermons of his own making (Eusebius, On the Life of Constantine, bk. 4, ch. 55 &amp; 32 &amp; 29) and reads some common prayers himself to the congregation in his house, ch. 17. (For he made his house a church and preached in it ordinarily himself, though he was both a layman and unbaptized; His sermon about Christianity to the clergy is published by Eusebius: and he preached a funeral oration about the immortality of the soul in his ordinary preaching place, a little before his death: Eusebius, ibid. ch. 55, etc. 29. etc. 17)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, p. 422</span></figcaption>

<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-f3f8d866d3" data-kw="">
<blockquote><p>Doctrine: We must if occasion require commend good Christians to others. So does Paul Phoebe here, and many others in his epistles. So did the brethren at Lystra and Iconium commend Timothy to Paul, Acts 16:2. So did the Brethren commend Gaius to John, 3 Jn. v. 3, and John, Demetrius, 3 Jn. 12. And in the primative Church it was so ordinary to give Christians letters of commendations, that he which acknowledged them not, was taxed as if he had denyed the faith. And there is great reason for it: For first it concerns them which are requested to commend, that they may show their charity: Secondly, the commended, that they may bee holpen. Thirdly, them to whom, that they may do good to the worthy, and not be deceived by the unworthy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/elnathan-parr.html">Elnathan Parr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Exposition upon the Whole Thirteenth, Fourteenth, Fifteenth &amp; Sixteenth Chapters of the Epistle of Saint Paul to the Romans</cite>, … (London: Eld, 1622), on Rom. 16:1-2, p. 314 Parr makes letters of commendation a duty of common Christian charity.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

nline · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3a1f853f00" data-kw="">
<blockquote><p>…and if Brownism be a bitter error and way, then the way of the Apologists [who are congregationalists] is not very sweet, their way being but Brown’s younger brother, agreeing with the Brownists in the nature and definition of the visible Church, in the independent power of a particular congregation, in the way of making officers, in the way of their ordinances, as prophesying, in the way of forms of prayer, in the sacraments, none to be admitted but church members, cum multis alijs [with many other things], and I desire the Apologists to give any material difference (however their grounds are different, and they do not go so far in consequences, nor are not so gross) between their churches and the Brownists:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or a Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge</cite>, … (London, 1644), p. 296</span></figcaption>

</figure><figure class="quote" id="q-8a69526e11" data-kw="">
<blockquote><p>That this covenant is not dissolved without the consent of this Church. Distinguish here direct dissolution from indirect, or that which consequently accompanies something else. The former is when someone decides to migrate elsewhere of his own accord; cessation of actual and explicit communion with and in that particular Church follows migration. Here, a free person is subject to the judgment of no Church; nor do the Bin and Luc. 12, D. 14, 14, which pertain directly to the Church. Unless someone extends ecclesiastical unity and power with the Pontificals to all secular matters, in order, as they say, to spiritual matters. … Furthermore, another departure is different from renunciation and separation or division, from exchange: just as one moves from one room to another in the same house, or from house to house in the same city. The former is directly subordinated to the judgment and authority of the Church; the latter is not at all. For he does not depart from Christ and ecclesiastical communion who migrates from one church to another. But he does depart who through migration forsakes all external communion of the Church or even passes over to sects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbert-voetius.html">Gisbert Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’, pp. 62-63 (PDF p. 67)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

<main class="wrap"><figure class="quote" id="q-9998183bd3" data-kw="">
<blockquote><p>The fact that some receive from God the gift of faith within time, and that others do not, stems from his eternal decree. For “all his works are known to God from eternity” (Acts 15:18; Eph. 1:11). In accordance with this decree God graciously softens the hearts, however hard, of the elect and inclines them to believe, but by a just judgment God leaves in their wickedness and hardness of heart those who have not been chosen. And in this especially is disclosed to us God’s act—unfathomable, and as merciful as it is just—of distinguishing between people equally lost. This is the well-known decree of election and reprobation revealed in God’s Word. The wicked, impure, and unstable distort this decree to their own ruin, but it provides holy and godly souls with comfort beyond words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god/nature-of-the-decree.html">Nature of the Decree</a> › <a href="../topics/the-decrees-of-god/nature-of-the-decree/eternal-wise-free-immutable-unconditional.html">Eternal, wise, free, immutable, unconditional</a></span><span class="t"><a href="../topics/reprobation/hardening.html">Hardening</a> › <a href="../topics/reprobation/hardening/permission-and-hardening.html">Permission and hardening</a></span></div>

</figure><figure class="quote" id="q-4abeab1df8" data-kw="liberty decree free">
<blockquote><p>The eternity of God’s decrees does not take away his liberty in decreeing. Although no moment can be assigned in which God was actually indifferent to decreeing this or that thing, still it is certain that the nature of God was in itself indifferent to decreeing this or that thing. For there was no necessary connection between God and creatures as exists between the Father and the Son (whom he could not but beget). On the other hand, he might (if he had willed) have abstained from any production of things.</p></blockquote>

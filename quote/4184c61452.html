<main class="wrap"><figure class="quote" id="q-4184c61452" data-kw="">
<blockquote><p>…that which these and the like [Scripture] testimonies unanimously speak unto us, is this, that the will of God is the sole rule of his worship, and all the concernment of it, and that his authority is the sole principle and cause of the relation of any thing to his worship, in a religious manner; and consequently that He never did, nor ever will allow that the wills of his creatures should be the rule or measure of his honor or worship, nor that their authority should cause any thing to hold a new relation unto Him, or any other but what it has by the law of its creation. As this is the sum and substance of the Second Commandment…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, (London, 1662), ch. 7, p. 46</span></figcaption>

<blockquote><p>This is the great secret of their religion, the original spring that sets all their endeavors in motion. They are a covenanted people, i.e. linked and confederated together to advance and propagate their faction and discipline, which they upon all occasions blasphemously call the kingdom of Jesus Christ. … …they confine the name of the godly only to themselves, as Papists do the name of catholic to them: And I have heard some of them say that it was not possible the power of godliness should prevail but under presbytery: If it be so, the world is much mistaken…</p></blockquote>

</figure><figure class="quote" id="q-07e45058e2" data-kw="">
<blockquote><p>…there is also required, that we have Him outwardly in our bodies and external actions; and that is, when as with the outward man we serve and worship Him. The which also we owe unto God, seeing He has created and redeemed both our souls and bodies, that we should in both perform service unto Him…. the Lord require it with the other, and that with the sweet incense of the heart and mind, we offer our bodies also a living sacrifice, holy and acceptable unto Him [Rom. 12:1-2]… Our Sauior also requires, not only that we have in us the heat of spiritual graces, but that also that we cause their light to shine out before men, that they seeing our good works, may glorify our Father which is in heaven… Now this external honour is either in outward signs or actions… Of the other sort is the outward service of God, in calling upon Him, vowing unto Him, swearing by his Name, celebrating feasts to his honor, and all outward obedience to the Law, which, in respect of the person to whom they are to be performed, namely, God alone and no other, are all required in the First Commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Godliness or a Treatise of a Christian Life</cite>, ... (London: Kingstone, 1622), bk. 2, ch. 6, section 7, ‘Of External Worship with our Bodies’, pp. 122-23</span></figcaption>

<blockquote><p>They offered fire that God had not commanded. Hence I say that all things in Gods worship must have a warrant out of God’s Word, must be commanded. It’s not enough that it is not forbidden: I beseech you observe it: it is not enough that a thing is not forbidden, and what hurt is there in it? But it must be commanded: I confess in matters that are civil and natural, there this may be enough; If it be but according to the rules of prudence, and not forbidden in the Word; we may make use of this in civil and natural things. But now when we come to matters of religion, and the worship of God, we must either have a command, or some what out of God’s Word by some consequence drawn from some command wherein God manifests his will; either a direct command, or by comparing one thing with another, or drawing consequences plainly from the words. We must have a warrant of the worship of God… It’s true, there are some things in the worship of God that are natural and civil helps, and there we need not have any command: As for instance; when we come to worship God, the congregation meets, they must have a convenient place to keep the air and weather from them: now this is but a natural help, and so far as I use the place of worship as a natural help I need have no command. But if I will put any thing in a place beyond what it has in its own nature, there I must look for a command. For if I account one place more holy than another; or to think that God should accept of worship in one place rather than in another: This is to raise it above what it is in its own nature. So that when any creature is raised in a religious way, above what it has in it by nature; if I have not Scripture to warrant me I am therein superstitious. It’s a very useful rule for to help you: If any creature that you make any use of in a way of religion beyond what it has in its own nature, if you have not some warrant from the Word of God (whatsoever specious show there may be in it) it is superstition. As now for the place, there was a place that was holy, but then it had an institution from God. And so for garments, to use those that are decent, the light of reason is enough: but if I will put any thing upon them beyond what there is in them in their own nature, as heretofore in a surplice, what, had that any more decency in its own nature, but only man’s institution? Now when man shall put a religious respect upon a thing, by virtue of his own institution when he has not a warrant from God; here’s superstition! … Now God has written the law of natural worship in our hearts, as that we should love God, fear God, trust in God, and pray to God; this God has written in our hearts: But there are other things in the worship of God that are not written in our hearts, that only depend upon the Will of God revealed in his Word, which were no duties except they were revealed in his Word. And these are of such a nature as we can see no reason for, but only this, because God will have them. As now, there are many kinds of ceremonies to manifest honor to princes that there is no reason for them at all, but merely because it is a civil institution so appointed: So God would have some ways for the honoring of Him, that the creature should not see into the reason of them, but merely the Will of God to have them so:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship</cite>, … (London, 1653), Sermon 1, pp. 9-11</span></figcaption>

+very+useful+rule+for+to+help+you%3A+If+any+creature+that+you+make+any+use+of+in+a+way+of+religion+beyond+what+it+has+in+its+own+nature%2C+if+you+have+not+some+warrant+from+the+Word+of+God+%28whatsoever+specious+show+there+may+be+in+it%29+it+is+superstition.+As+now+for+the+place%2C+there+was+a+place+that+was+holy%2C+but+then+it+had+an+institution+from+God.+And+so+for+garments%2C+to+use+those+that+are+decent%2C+the+light+of+reason+is+enough%3A+but+if+I+will+put+any+thing+upon+them+beyond+what+there+is+in+them+in+their+own+nature%2C+as+heretofore+in+a+surplice%2C+what%2C+had+that+any+more+decency+in+its+own+nature%2C+but+only+man%E2%80%99s+institution%3F+Now+when+man+shall+put+a+religious+respect+upon+a+thing%2C+by+virtue+of+his+own+institution+when+he+has+not+a+warrant+from+God%3B+here%E2%80%99s+superstition%21+%E2%80%A6+Now+God+has+written+the+law+of+natural+worship+in+our+hearts%2C+as+that+we+should+love+God%2C+fear+God%2C+trust+in+God%2C+and+pray+to+God%3B+this+God+has+written+in+our+hearts%3A+But+there+are+other+things+in+the+worship+of+God+that+are+not+written+in+our+hearts%2C+that+only+depend+upon+the+Will+of+God+revealed+in+his+Word%2C+which+were+no+duties+except+they+were+revealed+in+his+Word.+And+these+are+of+such+a+nature+as+we+can+see+no+reason+for%2C+but+only+this%2C+because+God+will+have+them.+As+now%2C+there+are+many+kinds+of+ceremonies+to+manifest+honor+to+princes+that+there+is+no+reason+for+them+at+all%2C+but+merely+because+it+is+a+civil+institution+so+appointed%3A+So+God+would+have+some+ways+for+the+honoring+of+Him%2C+that+the+creature+should+not+see+into+the+reason+of+them%2C+but+merely+the+Will+of+God+to+have+them+so%3A%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+Gospel+Worship%E2%80%A6+%28London%2C+1653%29%2C+Sermon+1%2C+pp.+9-11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feaf1d5cb57.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eaf1d5cb57.html">Permalink</a><a class="src" href="http

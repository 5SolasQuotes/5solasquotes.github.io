<main class="wrap"><figure class="quote" id="q-ea1baf7f9a" data-kw="two tables four and six">
<blockquote><p>Some assign five precepts to each table: as Josephus, “Moses brings forward two tables containing ten written precepts, five on each,” whom Philo follows and, of the fathers, Irenaeus. But this is false because Christ comprehends the fifth precept under the second table (Mt. 19:18); and Paul also when he calls it the first commandment of the second table with promise (Eph. 6:2). For in the first table, a promise is given in the second precept. Also the nature of the thing proves it because some are duties of religion towards God (prescribed in the first table), others of love and reverence for superiors (prescribed in the second table).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.5.2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-72e8445630" data-kw="keep faith lawful oaths">
<blockquote><p>First, to keep faith is an act of truth, justice and fidelity. He that keeps faith does what he says, the characteristic of truth. He does what he has promised and to which he is bound, the characteristic of fidelity. He restores to another what is his due according to the promise, the characteristic of justice. Second, it is lawful to swear faith to infidels, therefore also to keep faith with them as appears from the examples of Abraham making a covenant with Abimelech (Gen. 21:23, 24), of Isaac (Gen. 26:26), of Jacob (Gen. 31:53), of the spies with Rahab (Jos. 6:22), of the Israelites with the Gibeonites (Jos. 9:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.11.9–10</span></figcaption>

</figure><figure class="quote" id="q-a1bd63ace0" data-kw="judicial equity abrogation">
<blockquote><p>In that law various ends must be distinguished. For inasmuch as it was a distinction of the Jewish state from the Gentiles and a type of the kingdom of Christ, it is simply abrogated because there is no longer any distinction between the Jews and the Gentiles in Christ (Gal. 3:28; Eph. 2:14). As the Jewish state and polity has been destroyed, so there is no need of a type to adumbrate the future kingdom of Christ, since it has already come. But as to the good order or form of government of the people of God, those things which are of common and perpetual equity remain and must still be observed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.26.3</span></figcaption>

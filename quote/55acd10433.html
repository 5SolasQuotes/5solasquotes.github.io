<blockquote><p>I will not say but sometimes it may be meet to discover the least error, and it may be by circumstances so aggreged that it may be needful judicially to take notice of it, as when it’s involved with offence and ready to breed schism or scandal, or in such like cases (in which respect there are some things mentioned in the decree, Acts 15, which are not very material in themselves, as the eating of things strangled) yet, we say, it is not simply and always necessary for ministers to press at the convincing of all who maintain something different from truth, or which is supposed to be so by them, if it be of things extra-fundamental, or, which have not direct or palpable influence upon the violating of faith, or corrupting of manners, much less to censure for the maintaining of it. For, it is not of such that these epistles speak: and we see, Rom. 14, and in the epistles to the Corinthians, in the debate about meats and eating of things sacrificed to idols, and such like, wherein though there was still a right side and a wrong, yet does he rather press the forbearing of these debates, than the dipping into them, not astricting men always to follow this or that, providing it be done without breach of unity and charity. Hence it is that although there be somethings he will give no forbearance unto, but authoritatively and ministerially he decides in them, yet in the same epistles there is something amongst the saints that he seeks rather to heal, and to obtain mutual forbearance in, than peremptorily to decide. See Rom. 14:1; Cor. 8:2-3, etc.; Phil. 2:3. … …there may be somethings truly errors that may and should be forborne [tolerated] in themselves, yet their consequents ought not to be forborne, and this also may be at one time, and in one Church more necessary to be adverted to than in another, because consequents of schism, faction, division, etc. may sometimes follow on the meanest [the least] errors. And seeing these are always enemies to edification, even when they arise from the least ground, they are never absolutely to be foreborne; for to say, I am of Paul, and I am of Apollos, and for one to think such a man a better preacher than another, seems to be no great matter; yet when it begins to rent [tear] them, and to make factions in Corinth, it is not to be forborne, but to be reproved: And in the former difference of meats, the apostle condemns always the offence and schism that followed on it, although he did not peremptorily decide anything as to men’s practices, or censure for the opinion itself… Thus the differences and errors concerning Church-government by bishops, and in the Congregational way, may, we conceive, in themselves be forborne in persons where they are not vented to the shaking and drawing away of others; but if pressed in practice, to the renting of a Church, and preferred or equalled to the true government that is established by the Word, in that case they are not to be foreborn, because then truth is to be vindicated, and obstructions to edification in the renting or distracting of a Church to be removed, and at one time more than at another, as such an offence does waken a schism, and disturb order and union in one Church or at one time more than another: hence we see, Acts 15, some things are put in that decree in reference to that time, only for preventing of schism and scandal…</p></blockquote>

<blockquote><p>Now in the next place, for the further opening of the unity of the Faith, we are to call unto mind the distinction which the apostle makes betwixt the foundation and that which is builded thereupon: betwixt the principles of the doctrine of Christ and that which he calls perfection. The unity of the Faith and of the knowledge of the Son of God here spoken of, has reference (as we heard) to the foundation: as that which follows of a perfect man, and the measure of the stature of the fullness of Christ, to the superstruction and perfection. In the former there is a general unity among all true believers: in the latter, a great deal of variety, there being several degrees of perfection to be found in several persons, according to the measure of the gift of Christ. So we see in a material building, that still there is but one foundation, though great disparity be observed in sundry parts of the superstruction: some rooms are high, some low, some dark, some lightsome, some more substantially, some more slightly builded, and in tract of time some prove more ruinous than others; yet all of them belong to one building, as long as they hold together and stand upon the same foundation. And even thus is it in the spiritual building also, whether we respect the practical part of Christianity or the intellectual. In the practical we see wonderful great difference betwixt Christian and Christian: some by God’s mercy attain to a higher measure of perfection and keep themselves unspotted from the common corruptions of the world; others watch not so carefully over their ways and lead not such strict lives, but are oftentimes overtaken and fall fouly: that he who looketh upon the one and the other, would hardly think that one Heaven should receive them both. But although the one does so far outstrip the other in the practice of new obedience (which is the Christian man’s race) yet are there certain fundamental principles, in which they both concur; as a desire to fear God’s name, repentance for sins passed, and a sincere purpose of heart for the time to come to cleave unto the Lord. Which whosoever has is under mercy, and may not be excluded from the communion of saints. In like manner for the intellectual part: the first principles of the oracles of God (as the apostle calls them) hold the place of the common foundation, in which all Christians must be grounded: although some be babes, and for further knowledge are unskilful in the Word of righteousness; other some are of perfect age, who by reason of use have their senses exercised to discern both good and evil. The oracles of God contain abundance of matter in them, and whatsoever is found in them is a fit object for faith to apprehend: but that all Christians should uniformly agree in the profession of all those truths that are revealed there, is a thing that rather may be wished than ever hoped for. Yet the variety of men’s judgments in those many points, that belong to theological faith, does not dissolve the unity which they hold together in the fundamental principles of the catholic Faith. The unity of the Faith commended here [in Eph. 4:11-14], is a catholic unity, and such as every true Christian attains unto. ‘Till we ALL come in the unity of the Faith:’ says the apostle. As there is a common salvation, so is there a common Faith, which is alike precious in the highest apostle and the meanest believer. For we may not think that Heaven was prepared for deep clerks only: and therefore beside that larger measure of knowledge, whereof all are not capable, there must be a rule of Faith common to small and great; which as it must consist but of few propositions (for simple men cannot bear away many), so is it also requisite that those articles should be of such weight and moment that they may be sufficient to make a man wise unto salvation: that howsoever in other points learned men may go beyond common Christians, and exceed one another likewise by many degrees: yet in respect of these radical [root] truths, which is the necessary and common food of all the children of the Church, there is not an unity only, but such a kind of equality also brought in among all sorts of Christians, as was heretofore among the congregation of the Israelites in the collection of their manna; where he that gathered much had nothing over; and he that gathered little had no lack.</p></blockquote>

d+great%3B+which+as+it+must+consist+but+of+few+propositions+%28for+simple+men+cannot+bear+away+many%29%2C+so+is+it+also+requisite+that+those+articles+should+be+of+such+weight+and+moment+that+they+may+be+sufficient+to+make+a+man+wise+unto+salvation%3A+that+howsoever+in+other+points+learned+men+may+go+beyond+common+Christians%2C+and+exceed+one+another+likewise+by+many+degrees%3A+yet+in+respect+of+these+radical+%5Broot%5D+truths%2C+which+is+the+necessary+and+common+food+of+all+the+children+of+the+Church%2C+there+is+not+an+unity+only%2C+but+such+a+kind+of+equality+also+brought+in+among+all+sorts+of+Christians%2C+as+was+heretofore+among+the+congregation+of+the+Israelites+in+the+collection+of+their+manna%3B+where+he+that+gathered+much+had+nothing+over%3B+and+he+that+gathered+little+had+no+lack.%E2%80%9D%0A%0A%E2%80%94+James+Ussher%2C+A+Brief+Declaration+of+the+Universality+of+the+Church+of+Christ+%26+the+Unity+of+the+Catholic+Faith%E2%80%A6+%28London%2C+1629%29%2C+pp.+14-16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F23e8bfb1a5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/23e8bfb1a5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=Now%20in%20the%20next%20place%2C%20for,that%20gathered%20little%20had%20no%20lack&amp;text=Now%20in%20the%20next%20place%2C%20for%20the%20further&amp;text=and%20he%20that%20gathered%20little%20had%20no%20lack" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>5. Remember, that you have all but one end and one aim, that is, you are all of you elected and called to this assembly for the glory of your God, the honor of your king, the welfare of his people, the peace and purity of the Church, the punishing of offenders, the reforming of abuses and the taking away of all polluted and pernicious doctrines and practices from amongst us. And then the remembrance hereof will be a means to make you one.</p></blockquote>

</figure><figure class="quote" id="q-8ac99ed5c7" data-kw="">
<blockquote><p>And secondly, whereas they allege that we let the wicked continue in our Church without separation, whereas we should cut them off when we find them to be hypocrites. I answer: We doe separate, as much as in us lies, for we labor to have them separated from us, and also we labor to separate ourselves from them. First, we labor their separation from us, desiring their removal, bewailing their wickedness, and our condition that live in Mesech and Kedar, and reproving them for their sins; and if that will not serve, complaining against them to those that are in authority, that they may bee excommunicated, and withal we are instant with God by prayer to stir up the hearts of such as are in authority to execute his ordinances upon them: we do what we can to separate them from us, and it comes sometime to pass, that many are so separated from us; but if they should not, that indeed were the Churches sin, and a foul sin too; yet it destroyes not the true being of our Church. Secondly, if we cannot get them separated from us, yet we separate ourselves from them, and that is the separation that the Scripture so much beats upon in private persons, as we are more conscionable, so we doe more separate from them, from their wills, affections and courses; yea, we must separate as much as conveniently we may from their persons, at least from their sins, which for our parts we are persuaded to be the chief separation that the Scripture intends. Yea, but this is a secret separation, say they, under hand, not openly known. Nay, this is a notorious and known separation: For first, it is ingenuously professed on our part, to the moving of their after-hatred and despite against us; we disclaiming them that are lewd, swearing and profane wretches, and that openly, not caring who know it; and likewise it is known on their part, they upbraiding us therefore very reproachfully, with the names of Puritans, Precisions, holy Brethren, and such like, because we will not accompany with them; if this be not an holy and a plain separation, what is?… Yea, but say they, ye should separate from them in the assemblies, from the Word and the sacraments? I answer: Rather the wicked should separate from us in these things: where the assembly and business are naught in themselves, as at playhouses and such like, there the good must separate: but where the assembly and business is good in itself, there the bad must separate; and the reason is good, for it is none of theirs, and the good must tarry and be present, for it is their own right; and it is sin to refuse God’s ordinances for the pollution of others, 1 Sam. 2:17, 24… yet our holiness being true in us, and openly professed and practiced, it shall be enough to make us a true visible Church, yea, and an holy congregation in God’s acceptation, and in the charitable estimation of our brethren.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church</cite>, … (London: Kyngston, 1631). Randall (1570–1622) was an English puritan. | pt. 1, Lecture 12; pp. 208-9</span></figcaption>

<blockquote><p>Bucer believed that in a face-to-face dialogue it would be easierto persuade one’s opponents of the truth… Bucer knew well that written documents were subjected to differing interpretations. His preference for public dialogue also influenced many of his written works, which adopted the literary genre of a fictional dialogue. In these works, he would exemplify how men of differing opinions could peaceably and gradually arrive at agreement on the truth. This gradual approach was illustrative of his pedagogy for persuading and teaching others the truth of God’s word… As Stupperich has asserted, for Bucer unity would result not from compromise but from the clarification of misunderstandings that enable a unity in the truth.</p></blockquote>

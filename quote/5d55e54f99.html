</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-49d084ac22" data-kw="">
<blockquote><p>11. God has made more promises, donations and covenants than one or two, which must not be confounded: 1. His Law and Covenant made to and with man in innocency is one. 2. And his Law and Covenant made to and with Christ, as Mediator, is another. 3. And his absolute promise of a Saviour to the world, with the conditional promise or Law of Grace conjunct, was the first edition of another. And the Gospel, as after the incarnation promulgated, was a more perfect edition of it (to pass by Abraham’s Covenant of Peculiarity, and the Mosaical Law, as such). 12. Though Christ be promised in one of these, and be God’s antecedent gift, He may nevertheless be the Author of another, (and so far the foundation), as well as the meritorious cause. 13. That may be of free grace which is merited by Christ; yea, and that which is annexed to the evangelical worthiness of a believer. 14. That may be a condition required of us, to be done by the help of grace, which yet is the effect of that grace, and given us by God. 15. It is a true Covenant between God the Father, Son, and Holy Ghost, and man, which is solemnly entered into in baptism: And this is a Covenant of Grace, even that proceeds purely from grace; and of grace, as given by God, and by us accepted. He that will confound these various covenants, promises, and laws, on pretense of their unity (though there is doubtless a wonderful unity of all the parts both of God’s moral (signal) means, and his physical works), shall confound much of theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology, Plain, Pure, Peaceable... (London: White, 1675), ‘An Appendix to this Premonition,’ n.p.</cite></span></figcaption>

<blockquote><p>1. That there is such a covenant of which they speak which was entered between God and Christ containing the transactions which pass between the Father and the Son. The tenor of which covenant we find laid down by the prophet Isaiah 53:10 ff., and commented upon by the apostle, Phil. 2:6. There we see first the work that Christ by covenant was to undergo: to make his soul an offering for sin. That is, as elsewhere is expressed, to give His life a ransom for many, and as He covenanted, so He did, “He became obedient to death, even the death of the cross” (Phil. 2:8). And that upon account of this covenant entered, Christ Himself speaking to it and of His work in it, says, “This commandment have I received of my Father” (John 10:18). 2. The reward that He was to receive which is laid down by the prophet in many words. A. “He shall see his seed” (Isa. 53:10). As Isaac being received from the dead in figure saw a seed, had an innumerable posterity, so the Lord Christ who was received from the dead in truth has His seed in like manner, believers innumerable, which are called His seed in resemblance to the seed of man. B. “He shall prolong his days”, not the days of His seed, as some would have it, making this one with the former and rendering the words videbit semen long avum, being delivered from death, He shall live and reign eternally, Rev. 1:18. C. “The pleasure of the Lord shall prosper in his hand”; He shall irresistibly do whatsoever is the Father’s pleasure to be done in the work of man’s salvation. D. “He shall see the travail of his soul, and shall be satisfied”; upon this work done, He fully enjoys the whole of all his desires. E. “Therefore will I divide Him a portion with the great, and He shall divide the spoil with the strong.” He obtains a perfect victory, has a plenary and full conquest over every adversary. 3. We yield that the whole of these covenant transactions between God and Christ was on our behalf. Making His soul an offering for sin, He offers it for those that are fallen by iniquity. All is (as is there said) for the justification of many. Whatsoever it is that upon the work done redounds to Himself. Yet the reason of undertaking was for us: Unto us He was born, unto us He was given, He was wounded for our transgressions, He was bruised for our iniquities, He was delivered for our offences, and raised again for our justification. He endured the work and we reap the benefit. 4. We confess that it is the work of Christ that we enjoy being in covenant, as it is His gift that we enjoy the blessing of ordinances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-blake.html">Thomas Blake</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of God… (1658; rep. Puritan Publications), ch. 4</cite>, pp. 50-51</span></figcaption>

<blockquote><p>The will is a natural property, and therefore in the divine essence it is but one. The Father, Son, and Spirit, have not distinct wills. They are one God, and God’s will is one, as being an essential property of his nature; and therefore are there two wills in the one person of Christ, whereas there is but one will in the three persons of the Trinity… …for such is the distinction of the persons in the unity of the divine essence, as that they act in natural and essential acts reciprocally one towards another—namely, in understanding, love, and the like; they know and mutually love each other. And as they subsist distinctly, so they also act distinctly in those works which are of external operation. And whereas all these acts and operations, whether reciprocal or external, are either with a will or from a freedom of will and choice, the will of God in each Person, as to the peculiar acts ascribed unto Him, is his will therein peculiarly and eminently, though not exclusively to the other persons, by reason of their mutual in-being. The will of God as to the peculiar actings of the Father in this matter is the will of the Father, and the will of God with regard unto the peculiar actings of the Son is the will of the Son; not by a distinction of sundry wills, but by the distinct application of the same will unto its distinct acts in the persons of the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews… vol. 2 ed. W.H. Goold in Works (Edinburgh: T&amp;T Clark, 1862), vol. 19, Preliminary Exercitations, Ex. 28, ‘Federal Transactions Between the Father &amp; the Son’</cite>, pp. 87-88</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The will is a natural property, and therefore in the divine essence it is but one. The Father, Son, and Spirit, have not distinct wills. They are one God, and God’s will is one, as being an essential property of his nature; and therefore are there two wills in the one person of Christ, whereas there is but one will in the three persons of the Trinity… …for such is the distinction of the persons in the unity of the divine essence, as that they act in natural and essential acts reciprocally one towards another—namely, in understanding, love, and the like; they know and mutually love each other. And as they subsist distinctly, so they also act distinctly in those works which are of external operation. And whereas all these acts and operations, whether reciprocal or external, are either with a will or from a freedom of will and choice, the will of God in each Person, as to the peculiar acts ascribed unto Him, is his will therein peculiarly and eminently, though not exclusively to the other persons, by reason of their mutual in-being. The will of God as to the peculiar actings of the Father in this matter is the will of the Father, and the will of God with regard unto the peculiar actings of the Son is the will of the Son; not by a distinction of sundry wills, but by the distinct application of the same will unto its distinct acts in the persons of the Father and the Son.”

— John Owen, An Exposition of the Epistle to the Hebrews… vol. 2 ed. W.H. Goold in Works (Edinburgh: T&amp;T Clark, 1862), vol. 19, Preliminary Exercitations, Ex. 28, ‘Federal Transactions Between the Father &amp; the Son’, pp. 87-88">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+will+is+a+natural+property%2C+and+therefore+in+the+divine+essence+it+is+but+one.+The+Father%2C+Son%2C+and+Spirit%2C+have+not+distinct+wills.+They+are+one+God%2C+and+God%E2%80%99s+will+is+one%2C+as+being+an+essential+property+of+his+nature%3B+and+therefore+are+there+two+wills+in+the+one+person+of+Christ%2C+whereas+there+is+but+one+will+in+the+three+persons+of+the+Trinity%E2%80%A6+%E2%80%A6for+such+is+the+distinction+of+the+persons+in+the+unity+of+the+divine+essence%2C+as+that+they+act+in+natural+and+essential+acts+reciprocally+one+towards+another%E2%80%94namely%2C+in+understanding%2C+love%2C+and+the+like%3B+they+know+and+mutually+love+each+other.+And+as+they+subsist+distinctly%2C+so+they+also+act+distinctly+in+those+works+which+are+of+external+operation.+And+whereas+all+these+acts+and+operations%2C+whether+reciprocal+or+external%2C+are+either+with+a+will+or+from+a+freedom+of+will+and+choice%2C+the+will+of+God+in+each+Person%2C+as+to+the+peculiar+acts+ascribed+unto+Him%2C+is+his+will+therein+peculiarly+and+eminently%2C+though+not+exclusively+to+the+other+persons%2C+by+reason+of+their+mutual+in-being.+The+will+of+God+as+to+the+peculiar+actings+of+the+Father+in+this+matter+is+the+will+of+the+Father%2C+and+the+will+of+God+with+regard+unto+the+peculiar+actings+of+the+Son+is+the+will+of+the+Son%3B+not+by+a+distinction+of+sundry+wills%2C+but+by+the+distinct+application+of+the+same+will+unto+its+distinct+acts+in+the+persons+of+the+Father+and+the+Son.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+An+Exposition+of+the+Epistle+to+the+Hebrews%E2%80%A6+vol.+2+ed.+W.H.+Goold+in+Works+%28Edinburgh%3A+T%26T+Clark%2C+1862%29%2C+vol.+19%2C+Preliminary+Exercitations%2C+Ex.+28%2C+%E2%80%98Federal+Transactions+Between+the+Father+%26+the+Son%E2%80%99%2C+pp.+87-88&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fee137d1657.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ee137d1657.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-trinity#:~:text=The%20will%20is%20a%20natural%20property,of%20the%20Father%20and%20the%20Son&amp;text=The%20will%20is%20a%20natural%20property%2C%20and%20therefore&amp;text=the%20persons%20of%20the%20Father%20and%20the%20Son" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…in the good ol’ seventeenth century, Reformed theologians held to the principle of attributing ad extra works [all works directed externally outside of God to the creation] to all the persons of the Trinity. However, divines such as John Owen and Thomas Goodwin, to name just two of many, argued that certain outward works – depending on what they are – are more peculiarly attributed to one of the persons. This is also referred to as the doctrine of appropriations. Goodwin echoes this principle elsewhere: ‘In this will that common Axiome of Divines helps us, that what works all three Persons do towards us Ad extra, though they have all a joint hand in them, yet they are attributed more especially to one Person than to another; as Sanctification you know is attributed more especially to the Holy Ghost, Redemption to the Son, Creation to God the Father, though all Three Persons have a hand in it.’ That is to suggest that the persons all share a common prerogative, but often a certain work will be attributed to the Father, for example, in order to display his uniqueness. Both Goodwin and Owen wrestle with how this relates to the incarnation of the Son of God. So, for example, while some Divines attribute to the Spirit ‘the special Honour of tying that Marriage knot, or Union, between the Son of God, and that Man Jesus’, Goodwin believes that ‘that Action is more peculiarly to be Attributed to the Son Himself; as Second Person; who took up into one Person with Himself that Humane Nature’ (Heb. 2:16). Of course, Goodwin agrees that if they argue on the basis that the external works of the Trinity are undivided, there is no conflict. But, in Goodwin’s mind, it was ‘the Son’s Special Act … to assume [human nature]’. This is precisely what I say in the quote from Knowing Christ (p. 27). Owen argues that it was an outward act (ad extra) of the triune God, ‘As unto original efficiency’. However, ‘As unto authoritative designation, it was the act of the Father…. As unto the formation of the human nature, it was the peculiar act of the Spirit…. As unto the term of the assumption, or the taking of our nature unto himself, it was the peculiar act of the person of the Son.’ Essentially, Goodwin and Owen are claiming that the undivided works ad extra often manifest one of the persons as their terminus operationis [end of operation]. In the above example, the incarnation terminates on the Son though the act is (singularly) willed by the three persons of the Trinity. … If the Son did not decide to assume a human nature, then who did? God did, but, alas, dat old debbel [terminus operationis].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-jones.html">Mark Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Dat Old Debbel Tritheism?’ (2017) Jones’ context is not specifically about the Covenant of Redemption, but as may be seen, his discussion very much applies to it.</cite></span></figcaption>

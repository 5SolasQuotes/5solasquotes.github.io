<main class="wrap"><figure class="quote" id="q-5cc5f5e843" data-kw="">
<blockquote><p>It may also be said that this law is in the middle of a code, all the rest of which is acknowledged to be binding; and why not this? Were the other precepts of this code spoken by God from Sinai, amidst blackness and darkness, and tempest and terrors? So was this. Were the others written by the finger of God, on tables of stone? So was this. Were the others deposited in the ark of the testimony, in the holy of holies, under the wings of the cherubim? So was this.

No ceremonial or repealable law, given to the Jews, had these marks of honor put upon it. Did Christ say, “I came not to destroy, but to fulfil the law?” He said it as much of this as of any other precept. Did Christ’s most devoted followers keep the other commandments? So did they keep this. Luke 23: 56.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-swan-plumer.html">William Swan Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law of the Sabbath Still Binding, and What it Forbids in Tracts of American Tract Society. General Series</cite>, vol. VI, no. 187 (New York, n.d.), p. 3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-25f2d0e08b" data-kw="">
<blockquote><p>There are two sorts of things belonging to the church. Some which are intrinsical, and belonging to the soul or inward man, directly and primarily. Such things are not to be dispensed and administered by the civil magistrate:

I mean the word and sacraments, the keys of the kingdom of heaven, the suspension or excommunication of church officers or members, the ordination or deposition of officers, the determination and resolution from Scripture of controversies concerning the faith, the worship of God, the government of the church, cases of conscience.

These being in their nature, end, and use, merely spiritual, and belonging not to the outward man, but to the inward man or soul, are committed and entrusted to the pastors and other ruling officers of the church, and are not of civil and extrinsical, but of ecclesiastical and intrinsical cognisance and judgment.

There are other things belonging to the church, which are extrinsical, and do properly belong to the outward man, and are common to the church with other human societies or corporations: things of this kind fall within the civil jurisdiction; for the churches of Christ, being societies of men and women, and parts of commonwealths, are accountable unto and punishable by the civil magistrate, in their bodies, lives, civil liberties, and temporal estates, for trespasses against the law of God or the law of the land.

By the law of God I understand here jus divinum naturale, that is, the moral law or Decalogue, as it bindeth all nations (whether Christians or infidels), being the law of the Creator and King of nations. The magistrate, by his authority, may, and in duty ought, to keep his subjects within the bounds of external obedience to that law, and punish the external man with external punishments for external trespasses against that law.

From this obligation of the law, and subjection to the corrective power of the magistrate, Christian subjects are no more exempted than heathen subjects, but rather more straitly obliged. So that if any such trespass is committed by church officers or members, the magistrate hath power and authority to summon, examine, judge, and (after just conviction and to punish these, as well as other men. We do therefore abominate the disloyal papal tenet, that clergymen are not to be examined and judged by civil, but by ecclesiastical courts only, even in causes civil and criminal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming; or, The Divine Ordinance of Church Government Vindicated</cite>, (1646; Edinburgh: Robert Ogle, and Oliver &amp; Boyd, 1844), Book 2.8, p. 121.</span></figcaption>

</figure><figure class="quote" id="q-6e48ddefcd" data-kw="">
<blockquote><p>Nom. Did he break all the commandments, say you? Sir, I beseech you shew me wherein.

Evan. 1. He chose himself another God when he follows the devil.

2. He idolized and deified his own belly; as the apostle’s phrase is, “He made his belly his God.”

3. He took the name of God in vain, when he believed him not.

4. He kept not the rest and estate wherein God had set him.

5. He dishonoured his Father who was in heaven; and therefore his days were not prolonged in that land which the Lord his God had given him.

6. He massacred himself and all his posterity.

7. From Eve he was a virgin, but in eyes and mind he committed spiritual fornication.

8. He stole, like Achan, that which God had set aside not to be meddled with; and this his stealth is that which troubles all Israel :— the whole world.

9. He bear witness against God, when he believed the witness of the devil before him.

10. He coveted an evil covetousness, like Ammon, which cost him his life, and all his progeny. Now, whosoever considers what a nest of evils here were committed at one blow, must needs, with Musculus, see our case to be such, that we are compelled every way to commend the justice of God, and to condemn the sin of our first parents, saying concerning all mankind, as the prophet Hosea does concerning Israel, “Israel, thou hast destroyed thyself,” Hos. xiii. 9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 178-79.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-25c96cbda1" data-kw="moral law not abolished">
<blockquote><p>As it was not abolished but fulfilled by Christ, neither is its use among us to be abolished. Luke wants us to hear Moses and the prophets: “They have Moses and the prophets, let them hear them” (16:29). If they are to be heard, their commands must therefore be obeyed also. If this is said by Christ to the Jews of his time, it ought not forthwith to be understood of them to the exclusion of others. He does not give here a special, but a general precept to all who desire to escape the place of torment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.23.5</span></figcaption>

</figure><figure class="quote" id="q-af2aa585c5" data-kw="">
<blockquote><p>The perpetuity and the universal obligation of the Sabbath, and consequently its appointment in the beginning of time, are distinctly indicated by the place assigned it in the Decalogue. It is acknowledged that the other nine precepts are of universal and perpetual obligation; and for this reason they were written on tables of stone by the finger of God. But why should a ceremonial institution, designed for only one nation, and destined to pass away, be incorporated in a law which is obligatory on all men, and is to continue in force to the end of time?

True, there is something of the nature of a positive command in it; but it is also clearly moral. All our time belongs to God. Six parts of it he allows to be devoted to ordinary pursuits and pleasures; but the seventh he retains, and requires it to be specially and exclusively devoted to spiritual duties. The obligation to employ our time, or any part of it, according to divine direction, is clearly moral. And no reason can be assigned for the placing of the command to hallow the Sabbath in the Decalogue, save that, like the other nine, it is of universal and perpetual obligation. And since the other commandments were in substance given in the beginning of time, so was the fourth.</p></blockquote>

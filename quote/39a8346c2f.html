<main class="wrap"><figure class="quote" id="q-39a8346c2f" data-kw="">
<blockquote><p>Chrysostom addeth also this reason why we should pray: That by often calling upon God we may become familiar with him. Again, that we may more highly esteem, and more reverently use that which God bestoweth upon us when we ask and knock.

These things are carefully to be thought upon concerning the necessity and benefit of prayer, least that being otherwise too cold and backward unto prayer by these conceits, that God is forward to help us of his own accord, we do suffer our selves to be withdrawn from the exercise of prayer.

Neither let us abuse that most sweet sentence of the ready good-will of God toward us, which ought rather to be an incitation and a motive to excite and confirm our diligence &amp; confidence in prayer. There be some which reason thus, or at least do trouble themselves with those conceits: seeing God unasked, and before we pray doth know, yea beforehand hath set down &amp; appointed what he will do and what he will give: we do therefore either ask in vain, that which otherwise should come to pass; or else do wickedly in praying, as though we hoped by our prayer to turn God from his firm decree and purpose, and so make him changeable and constant [inconstant?].

To this objection some answer thus. If that which we ask be ordained beforehand to be done, then we pray upon good and sure confidence. If it be not, yet we go not about to hinder or stop the course of God’s predestination; because we pray that God’s will may be done. But Luther’s exposition is more plain &amp; safe; to wit, that we are not commanded to busy our selves about the hidden foreknowledge of God, or to search into his secret counsels: but we must dispose our selves according to his will revealed unto us in his word, where he teacheth that by repentance and prayer, God’s wrath is appeased, many dangers and evils are avoided, and many benefits obtained. Jer. 18. v. 8. Ezek. 33. v. 11.1. King. 8. v. 56. And therefore he hath straitly charged us to pray: yea he is angry when no man sets himself by prayer between the Lord and the land lest it be destroyed, Ezek. 22. v. 30. Both these therefore do warn us to pray, first that God of his own accord is ready to help, and knoweth what we want, &amp; what himself will do.

Secondly, that it is his will and commandment we should pray. Neither must we from the secret foreknowledge of god, frame or admit exceptions against those things which are plainly revealed and commanded in the word. If thou canst not reconcile them, leave unto God the hidden reasons of his secret foreknowledge, and doe thou those things which are commanded and appointed to thee in the revealed word; to wit, that thou mayest pray and that continually. These things I have noted by occasion of that saying: Your heavenly father knoweth whereof ye have need, even before ye ask, Math. 6. v. 8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A substantial and Godly exposition of the prayer commonly called the Lord’s Prayer</cite>, (Cambridge: John Legate, 1598), pp 5-7.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-29f73381cc" data-kw="">
<blockquote><p>The glory of God must be principally in our minds, and nearest our hearts in all our supplications. Christ prays first for his own glory, but as a means for the glory of his Father, before he prays particularly for the good of the church: ‘Glorify thy Son, that thy Son may also glorify thee;’ and only for such a glory for himself, whence the glory of the Father might spring with a greater brightness upon the Son; for, by the raising Christ, and manifesting the glory of his deity, the Father would be glorified in full declarations of himself, as the Father of our Lord Jesus Christ, the author of the great redemption, as a God that so loved the world as to send his Son into it for the redemption of it. ‘Hallowed be thy name,’ is the first petition in the Lord’s prayer.

The glory of God must weigh more in our thoughts than our private interest: his glory is to be our end in our common actions, 1 Cor. x. 31, much more in acts of religious worship. If another end be higher in our hearts, in our prayers, though we pray to God, we really worship an idol, viz. self; though God be the object, yet he is not the end. We must seek to God for all blessings, with the same end for which God gives them; he gives us the highest for his glory: Eph. i. 6, ‘He hath accepted us in his beloved, to the praise of the glory of his grace.’ We must beg for self subordinately, but for God’s glory ultimately. Our Saviour begged glory for himself, that he might return glory to his Father. To beg anything for ourselves principally, is the prayer of some lust, ambition, or covetousness; to beg anything for God’s glory is a prayer of grace, like that of our Saviour’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>, A Discourse on the Knowledge of God</cite>, in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 7.</span></figcaption>

</figure><figure class="quote" id="q-ad8d89aeae" data-kw="">
<blockquote><p>O Jehovah! God of my salvation! Let me call upon you particularly to notice what I have just now stated, That although the prophet simply, and without hyperbole, recites the agony which he suffered from the greatness of his sorrows, yet his purpose was at the same time to supply the afflicted with a form of prayer that they might not faint under any adversities, however severe, which might befall them. We will hear him by and by bursting out into vehement complaints on account of the grievousness of his calamities; but he seasonably fortifies himself by this brief exordium, lest, carried away with the heat of his feelings, he might become chargeable with complaining and murmuring against God, instead of humbly supplicating Him for pardon. By applying to Him the appellation of the God of his salvation, casting, as it were, a bridle upon himself, he restrains the excess of his sorrow, shuts the door against despair, and strengthens and prepares himself for the endurance of the cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 88, trans. James Anderson.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

</figure><figure class="quote" id="q-7ccd6764ee" data-kw="">
<blockquote><p>We do not reject the commemoration or honorable mention of the dead saints, nor an annual thanksgiving for those who have departed in the faith of Christ: besides we have acknowledged that we may pray for a blessed resurrection, for a public absolution in the day of judgment and the perfect happiness of deceased believers, without any superstition. Hence that solemn prayer in our English [Anglican] Church, when the dead are conveyed to the tomb: ‘Almighty God… beseeching Thee, that it may please Thee of thy gracious goodness shortly to accomplish… that we, with all those who are departed in the true faith of thy holy name, may have our perfect consummation and bliss, both in body and soul, in they eternal and everlasting glory, etc.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Prayers of the Papists for the Dead are Vain’</cite>, p. 222 in The Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridge trans. Josiah Allport (1634; 1846) bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“We do not reject the commemoration or honorable mention of the dead saints, nor an annual thanksgiving for those who have departed in the faith of Christ: besides we have acknowledged that we may pray for a blessed resurrection, for a public absolution in the day of judgment and the perfect happiness of deceased believers, without any superstition. Hence that solemn prayer in our English [Anglican] Church, when the dead are conveyed to the tomb: ‘Almighty God… beseeching Thee, that it may please Thee of thy gracious goodness shortly to accomplish… that we, with all those who are departed in the true faith of thy holy name, may have our perfect consummation and bliss, both in body and soul, in they eternal and everlasting glory, etc.&#x27;”

— John Davenant, ‘The Prayers of the Papists for the Dead are Vain’, p. 222 in The Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridge trans. Josiah Allport (1634; 1846) bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+do+not+reject+the+commemoration+or+honorable+mention+of+the+dead+saints%2C+nor+an+annual+thanksgiving+for+those+who+have+departed+in+the+faith+of+Christ%3A+besides+we+have+acknowledged+that+we+may+pray+for+a+blessed+resurrection%2C+for+a+public+absolution+in+the+day+of+judgment+and+the+perfect+happiness+of+deceased+believers%2C+without+any+superstition.+Hence+that+solemn+prayer+in+our+English+%5BAnglican%5D+Church%2C+when+the+dead+are+conveyed+to+the+tomb%3A+%E2%80%98Almighty+God%E2%80%A6+beseeching+Thee%2C+that+it+may+please+Thee+of+thy+gracious+goodness+shortly+to+accomplish%E2%80%A6+that+we%2C+with+all+those+who+are+departed+in+the+true+faith+of+thy+holy+name%2C+may+have+our+perfect+consummation+and+bliss%2C+both+in+body+and+soul%2C+in+they+eternal+and+everlasting+glory%2C+etc.%27%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+%E2%80%98The+Prayers+of+the+Papists+for+the+Dead+are+Vain%E2%80%99%2C+p.+222+in+The+Determinations%2C+or+Resolutions+of+Certain+Theological+Questions%2C+Publicly+Discussed+in+the+University+of+Cambridge+trans.+Josiah+Allport+%281634%3B+1846%29+bound+at+the+end+of+John+Davenant%2C+A+Treatise+on+Justification%2C+or+the+Disputatio+de+Justitia...+trans.+Josiah+Allport+%281631%3B+London%2C+1846%29%2C+vol.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7ccd6764ee.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7ccd6764ee.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/prayer#:~:text=We%20do%20not%20reject%20the%20commemoration,they%20eternal%20and%20everlasting%20glory%2C%20etc&amp;text=We%20do%20not%20reject%20the%20commemoration%20or%20honorable&amp;text=soul%2C%20in%20they%20eternal%20and%20everlasting%20glory%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-38a909b283" data-kw="kingdom come">
<blockquote><p>The second petition is: that God&#x27;s Kingdom come [Matt. 6:10]. Even though it contains nothing new, it is with good reason kept separate from the first petition; for if we consider our languor in the greatest matters of all, it behooves us to extend our discussion in order to drive home something that ought to have been thoroughly known of itself. … God reigns where men, both by denial of themselves and by contempt of the world and of earthly life, pledge themselves to his righteousness in order to aspire to a heavenly life. Thus there are two parts to this Kingdom: first, that God by the power of his Spirit correct all the desires of the flesh which by squadrons war against him; second, that he shape all our thoughts in obedience to his rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20.42</span></figcaption>

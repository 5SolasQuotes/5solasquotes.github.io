<main class="wrap"><figure class="quote" id="q-734562b80d" data-kw="">
<blockquote><p>O take a look of Him in his perfection. He is without measure and limits – without beginning and ending. He is one and the same in his nature, in his counsels, and in his love. He perfectly knoweth Himself, and all things that are possible. He can do all things that do not imply a contradiction, and argue imperfection.

He is good and doeth good; He is righteous in Himself, and equal in all his ways of dealing with his creatures. He is true without and dissimulation; He is holy, and delighteth in his own holiness, and in every resemblance of it, in his angels and in his saints.

O! who can think of Him and who can speak of Him aright? He is infinite in all his attributes; and every perfection hath a perfect meeting in Him. Albeit some of his attributes are in some degree communicable to his creatures, yet they are in Him in an altogether incommunicable manner and measure. There is nothing in God but what is God; for this is his name – “I am that I am.”

Again I say, Who can think of Him, and who can speak of Him aright? Who can comprehend Him, or compass Him about? Who by understanding can search out God? Humble and believing ignorance is better than curious and prying knowledge: for all that we can know of Him, is to know that we cannot know him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Honourable Societies of Strangers at Lewarden, in Friesland, 18 February 1686 in Thomas Houston (ed.), Spiritual Support and Consolation in Difficult Times: The Letters of the Rev. James Renwick (1865) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D. (4 vols, Edinburgh</cite></span></figcaption>

<blockquote><p>(1) The natural life supposes generation; so does the spiritual, which is therefore expressed by ‘regeneration’, or by ‘being born again’, Jn. 3:3 and 1 Jn. 2:27. Now look, as in natural generation we are first begotten, and then born, so here there is an act qua regeneramur, ‘by which we are begotten again’, and qua renascimur, ‘by which we are born again’. There is an act of God, by which we are begotten again, viz. by the powerful influence of grace upon our hearts, accompanying in the Word, Jm. 1:18; and there is an act of God, by which we are born again, viz. when the new creature is formed in us, and begins to discover itself (“being born again, not of corruptible seed, but of incorruptible”). Effectual calling and sanctification are these two [respective] acts: by the one we are begotten, by the other born; the one may be called our passive, the other our active regeneration.</p></blockquote>

<blockquote><p>7th Problem: Whether unregenerate or regenerate man sanctifies himself, or actively concurs to it? I respond: concerning the former, negatively; concerning the latter, affirmatively, if indeed sanctification in the moment and in the second act is understood, that is, its excitation and ἐνέργεια [energeia, energy/activity], or continuation. And thus the sayings 2 Cor. 7:1; 1 Jn. 3:3 are to be understood.</p></blockquote>

</figure><figure class="quote" id="q-9aa27b38b9" data-kw="">
<blockquote><p>What is the end of our Justification? … Lastly, that we ourselves might be bettered and made righteous. Gal. 2:17, “If then while we seek to be made righteous by Christ, we ourselves are found sinners, is Christ therefore the minister of sin? God forbid.” For to this end are we justified by faith through Christ, that the old man being abolished by the power and efficacy of Christ crucified, Christ might live in us and that we should by our study and labor endeavor to bring forth good works, [and] show ourselves thankful to God for so great a benefit. And therefore it is that the apostle Paul almost in all his epistles derives the doctrine of sanctification, or good works, from the doctrine of faith or justification as the cause from the effect, or the necessary consequent from the antecedent. What are the adjuncts of Justification? … For saiys Augustine, good works do follow a man already justified, and do not go before a man that is to be justified, as good fruits are not before a good tree… The works accompanying or following it are… Moreover the adopting of us to be sons of God, our sanctification or newness of life, the fruits whereof are described, Gal. 5:22. For they that are made partakers of Christ through faith, they do with Him receive the Holy Ghost, the author of all holiness; from whence it is, that these two benefits are indeed distinguished one from another, but yet so linked together by an unseparable bond that they can never be plucked asunder; and the latter is the testimony of the former, both in the soul of the faithful man himself and to other men also.</p></blockquote>

<blockquote><p>It’s a question, Whether this drawing [Jn. 12:32] be justification or sanctification? Antinomians say it’s both: But withal, both is one (say they). Answer: Position 1. Drawing is relative to running and walking, Cant. 1:4. Now this is rather in acts of sanctification and in running in the ways of God’s commandments, Ps. 119:32, than in justification, though “coming” go for an act of believing and approaching to Christ, Jn. 6:44, and so excludes not faith. Position 2. It is most unsound to affirm that justification and regeneration are all one;† for this must confound all acts flowing from justification with those that flow from regeneration, or the infused habit of sanctification. † [Margin Note:] ]Libertines falsely teach that justification and regeneration is one.

1. Justification is an indivisible act; the person is but once for all justified, by grace. But sanctification is a continued daily act.

2. Justification does not grow; the sinner is either freed from the guilt of sin and justified, or not freed; there is not a third. But in sanctification we are said to grow in grace, 2 Pet. 3:14, and advance in sanctification: nor is it ever consummate and perfect so long as we bear about a body of sin. Position 3. To repent, to mortify sin, is not to condemn all our works (as Mr. Town says) righteousness and judgment, and our best things in us, and then by faith to fly to grace; nor is it to distrust our own righteousness and embrace Christ’s in the promise.

1. Because this is faith; and the Scripture says we are justified by faith.

2. We receive Christ by faith, Jn. 1:12.

3. We receive and embrace the promise by faith, Heb. 11:11, and were persuaded of them.

4. We are to believe without staggering, Rom. 4.19.

5. We have peace of conscience through faith, Rom. 5:1.

6. By faith we have access into this grace wherein we stand, Rom. 5:2. And boldness to enter into the holy of holiest, and draw near to our High Priest, with full assurance of faith, Heb. 10:19-22. Now we are not justified by repentance and mortification; we neither receive Christ, nor embrace the promises by repentance. The apostle requires in repentance, sorrow, carefulness to eschew sin, clearing, indignation, fear, zeal, desire, revenge, 2 Cor. 7:10-11, but nowhere does the Scripture require this as an ingredient of repentance, that we have boldness and access, and full assurance: nor do Antinomians admit that by repentance we have peace or pardon, but this they ascribe to faith.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It’s a question, Whether this drawing [Jn. 12:32] be justification or sanctification? Antinomians say it’s both: But withal, both is one (say they). Answer: Position 1. Drawing is relative to running and walking, Cant. 1:4. Now this is rather in acts of sanctification and in running in the ways of God’s commandments, Ps. 119:32, than in justification, though “coming” go for an act of believing and approaching to Christ, Jn. 6:44, and so excludes not faith. Position 2. It is most unsound to affirm that justification and regeneration are all one;† for this must confound all acts flowing from justification with those that flow from regeneration, or the infused habit of sanctification. † [Margin Note:] ]Libertines falsely teach that justification and regeneration is one.

1. Justification is an indivisible act; the person is but once for all justified, by grace. But sanctification is a continued daily act.

2. Justification does not grow; the sinner is either freed from the guilt of sin and justified, or not freed; there is not a third. But in sanctification we are said to grow in grace, 2 Pet. 3:14, and advance in sanctification: nor is it ever consummate and perfect so long as we bear about a body of sin. Position 3. To repent, to mortify sin, is not to condemn all our works (as Mr. Town says) righteousness and judgment, and our best things in us, and then by faith to fly to grace; nor is it to distrust our own righteousness and embrace Christ’s in the promise.

1. Because this is faith; and the Scripture says we are justified by faith.

2. We receive Christ by faith, Jn. 1:12.

3. We receive and embrace the promise by faith, Heb. 11:11, and were persuaded of them.

4. We are to believe without staggering, Rom. 4.19.

5. We have peace of conscience through faith, Rom. 5:1.

6. By faith we have access into this grace wherein we stand, Rom. 5:2. And boldness to enter into the holy of holiest, and draw near to our High Priest, with full assurance of faith, Heb. 10:19-22. Now we are not justified by repentance and mortification; we neither receive Christ, nor embrace the promises by repentance. The apostle requires in repentance, sorrow, carefulness to eschew sin, clearing, indignation, fear, zeal, desire, revenge, 2 Cor. 7:10-11, but nowhere does the Scripture require this as an ingredient of repentance, that we have boldness and access, and full assurance: nor do Antinomians admit that by repentance we have peace or pardon, but this they ascribe to faith.”

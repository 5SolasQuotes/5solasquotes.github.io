<main class="wrap"><figure class="quote" id="q-0751cb3541" data-kw="">
<blockquote><p>…the retaining and using of temples [church buildings] which have been polluted with idols, be not in itself unlawful, yet the retaining of every such temple is not ever necessary, but sometimes it is expedient for further extirpation of superstition to demolish and destroy some such temples as have been horribly abused to idolatry, as Calvin (Commentary on Dt. 12:2 [80th sermon on Dt., on 12:1-5, pp. 491-92]) also and Zanchius (On the 4th Commandment, col. 709 [in All the Theological Works (1649), vol. 4]) do plainly insinuate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 2, p. 23</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-79ece82320" data-kw="">
<blockquote><p>God is not only a spirit or spiritual substance, but He is every way infinite and has sufficiency of all perfection in Himself. And therfore He takes no delight in any good thing that the creature can communicate to Him: but his delight is in the communication of his own goodness to us, and in all such duties whereby we conform ourselves to Him and magnify his goodness. Thus Paul, Acts 17:25, that ‘God needs nothing,’ and therefore He is not worshipped with anything made by the hands of man. And the Lord says by the Psalmist (Ps. 50; 8; 14) that He does not principally respect our gifts and our sacrifices, because all things are his, but He respects praise and thanksgiving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (d. 1602; London: Legatt, 1626), vol. 1, p. 703</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-632ea4b5ed" data-kw="">
<blockquote><p>There may be a partial separation when one ordinance is so corrupted that we cannot join in it and yet can join with the Church in all other acts of communion: and a total separation when either the Church will not suffer us to join with her in any part of her service unless we join in all; or she is so corrupt that we can join with her in nothing that is religious. The former by most wise and sober men is not reckoned such a schism as that any are to be blamed as schismatics on that account;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 10 Rule was a Scottish, divine-right presbyterian., p. 247</span></figcaption>

</figure><figure class="quote" id="q-aa20d12bb0" data-kw="">
<blockquote><p>Q. 161. How do the sacraments become effectual means of salvation? A. The sacraments become effectual means of salvation, not by any power in themselves, or any virtue derived from the piety or intention of him by whom they are administered, but only by the working of the Holy Ghost, and the blessing of Christ, by whom they are instituted.[s] [s] 1 Pet. 3:21. Acts 8:13 compared with verse 23. 1 Cor. 3:6,7. 1 Cor. 12:13.</p></blockquote>

</figure><figure class="quote" id="q-c256e08276" data-kw="">
<blockquote><p>We [nonconformists] never held it unlawful to join with a Church or minister that has some faults, both personal and in their acts of worship, as if all that joined were guilty of all the faults there committed: No not though we knew before hand that some false doctrine would be uttered or fault committed: Else we must separate from all the world, and all [people must separate] from us.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2cda512777" data-kw="">
<blockquote><p>The first error we mention was their inquisitorialness, — the excess of their ecclesiastical legislation. This refers to those who belonged to their own communion. It is well known that the discipline of the Church Courts, from kirk-sessions to general assemblies, even over those who were friends, was extreme. Such legislation could not be tolerated in our day, even among the most devoted Protestants. It was not desirable. Individuals, families, congregations, communities, were all dealt with by ecclesiastical or burghal authorities, and often in minute matters, which did not properly belong to the business of the Church.

We may admire the impartiality of the Church and its administrators, and their evident sincerity, sparing no class, high or low, contravening their regulations, — their honest zeal, — but we cannot approve of such severity of discipline, even for offences which properly came before the Church Courts. We have no authority in Scripture for clothing men under discipline in sackcloth, and making them appear before a congregation for successive days in a white sheet, and far less for the pillory, and ducking, and fines. …

The course pursued was well intended, but it was mistaken. It was more than the Word of God or the example of the Apostolic Church demanded, and must have made the transition from the moral relaxation of the Church of Rome, to the proper strictness of the Reformed standard, more difficult. The change must have been in many cases so violent as to disgust and repel. Gentler treatment might have won.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-g-lorimer.html">John G. Lorimer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Errors of the Age of the Reformation and the Light in which they should be regarded by the men of the Present Day in J. A. Wylie (ed.), Ter-Centenary of the Scottish Reformation, as Commemorated at Edinburgh, August 1860</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-32aa7ad0f8" data-kw="">
<blockquote><p>Princes therefore may not suffer bishops to usurp the power of suspending and depriving at their pleasure [as that belongs to presbyteries], and whensoever they commit any such tyranny in smiting of their fellow servants, it is the part of princes to cause these things to be redressed, and for this end graciously to receive the grievances of oppressed ministers. The Arians of old beeing assembled in a Council at Antioch [A.D. 341] (Canon 11), decreed that if any ecclesiastical person should, without the advice and the letters of the bishops of the province, and chiefly of the Metropolitan, go to the emperour to put up any grievance unto him, he should be cast out, not only from the holy communion, but from his proper dignity which he had in the Church. Whereupon Osiander has this observation (Hist. Eccl., Century 4, bk. 2, ch. 48, p. 242): ‘This canon also was composed against holy Athanasius: for Athanasius being expelled by the Arians, had fled to the Emperour Constantine the younger, and had from him obtained a return to his own Church. Now this canon is very unjust, which forbids that a bishop or any other minister of the Church, being unjustly oppressed, flee to his godly civil magistrate: since it was lawful to the apostle paul to appeal to the Roman Emperor, wicked Nero, as the acts of the apostles witness. But it may be seen in this place, that bishops were very soon seeking dominion, yea tyranny over the Church and over their colleges [ecclesiastical assemblies].&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, bk. 8, Digression 4, pp. 194-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>7. They [civil magistrates] might and ought to give their countenance unto, and join their authority with, such ecclesiastic statutes, overtures, or means, as Church-judicatories or officers might be about to make use of for this end in their places; and this can be no more prejudice to liberty, to countenance with their authority the ordinance of discipline, than to confirm by their authority the ordinance of preaching the Gospel. … 9. In recovering a people, in a reeling and staggering time, a magistrate may engage them to formerly received truth, and interpose his authority for this end, as is recorded of Josiah, 2 Chron. 34:31-33. Also, 10. He may and ought to remove all false worships, and endure no corrupt preaching, or writing, or meetings for that end, or administrating of corrupted sacraments, or any ordinance other than what is allowed; for, Josiah did cause the people stand to the Covenant that was made, and having removed all idolatrous worship, he made Israel to serve the Lord, that is, he made them abandon corrupt worship, and wait on pure ordinances, as keeping of the sabbaths, offering of sacrifices, etc. and that according to the manner prescribed by the Lord. Neither was it a wronging of their liberty, to do so, because:

1. It was the preservation of their liberty, to keep them from the abominable bondage of these evils.

2. It was their duty to abstain from these, and to follow the ordinances purely, and the magistrate may well put people to that.

3. It is one thing by force to keep folks from dishonouring God in a corrupt religion, (as Josiah did) another to force them to a religion; the one belongs to the ordering of the outward man, the other to the inward.

4. He might order them to keep the ordinances, and in going about them to keep the rule, because that is but a constraining of them to the means whereby religion works, and a making them, as it were, to give God a hearing, leaving their yielding and consenting to Him, when they have heard Him, to their own wills, which cannot be forced; yet it is reason that when God comes by His ordinances to treat with a people, that a magistrate should so far respect His glory and their good as to interpose His authority to make them hear.

5. Also, there is a difference between the constraining of a circumcised or baptized people, to worship God in the purity of ordinances, as they have been engaged thereto, which was Josiah’s practice, and the constraining of a people to engage and be baptized, which were not formerly engaged; because, actual members of a Church have not even that liberty as others have, to abandon ordinances: and this puts them to no new engagement in religion, but presses them to continue under former engagements, and accordingly to perform: Hence we see, that both in the Old and New Testament, Church-members have been put to many things, and restrained from many things, which had not been pertinent in the case of others. See, 2 Chron. 15:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, … (1659), pt. 3, ch. 4, pp. 252-4</span></figcaption>

A4.+He+might+order+them+to+keep+the+ordinances%2C+and+in+going+about+them+to+keep+the+rule%2C+because+that+is+but+a+constraining+of+them+to+the+means+whereby+religion+works%2C+and+a+making+them%2C+as+it+were%2C+to+give+God+a+hearing%2C+leaving+their+yielding+and+consenting+to+Him%2C+when+they+have+heard+Him%2C+to+their+own+wills%2C+which+cannot+be+forced%3B+yet+it+is+reason+that+when+God+comes+by+His+ordinances+to+treat+with+a+people%2C+that+a+magistrate+should+so+far+respect+His+glory+and+their+good+as+to+interpose+His+authority+to+make+them+hear.%0A%0A5.+Also%2C+there+is+a+difference+between+the+constraining+of+a+circumcised+or+baptized+people%2C+to+worship+God+in+the+purity+of+ordinances%2C+as+they+have+been+engaged+thereto%2C+which+was+Josiah%E2%80%99s+practice%2C+and+the+constraining+of+a+people+to+engage+and+be+baptized%2C+which+were+not+formerly+engaged%3B+because%2C+actual+members+of+a+Church+have+not+even+that+liberty+as+others+have%2C+to+abandon+ordinances%3A+and+this+puts+them+to+no+new+engagement+in+religion%2C+but+presses+them+to+continue+under+former+engagements%2C+and+accordingly+to+perform%3A+Hence+we+see%2C+that+both+in+the+Old+and+New+Testament%2C+Church-members+have+been+put+to+many+things%2C+and+restrained+from+many+things%2C+which+had+not+been+pertinent+in+the+case+of+others.+See%2C+2+Chron.+15%3A13.%E2%80%9D%0A%0A%E2%80%94+James+Durham%2C+The+Dying+Man%E2%80%99s+Testament+to+the+Church+of+Scotland%2C+%E2%80%A6+%281659%29%2C+pt.+3%2C+ch.+4%2C+pp.+252-4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc843576050.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c843576050.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/toleration/#:~:text=7.%20They%20%5Bcivil%20magistrates%5D%20might%20and,of%20others.%20See%2C%202%20Chron.%2015%3A13&amp;text=7.%20They%20%5Bcivil%20magistrates%5D%20might%20and%20ought%20to&amp;text=the%20case%20

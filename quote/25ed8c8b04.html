<main class="wrap"><figure class="quote" id="q-25ed8c8b04" data-kw="">
<blockquote><p>Man, as a condemned sinner, can obtain nothing from God on his own account. He lies under the curse of a broken law; exposed to everlasting perdition. God can be to him only a consuming fire. There is an impassible barrier between such a man and God. There can be no communication between the holy and the unclean.

The prayers of the wicked are an abomination in the sight of God. He is surrounded with such an atmosphere of holiness, that the breathings of an impure spirit cannot reach him. There is only one channel of communication between the sinner and God, and that is Christ.

When God looks upon us, he can see nothing to approve. In his sight we are altogether as an unclean thing; even our righteousnesses are as filthy rags. Our holiest services are polluted in his sight. But there is a Day’s Man between us who is able to lay his hand upon both. Our prayers cannot come up before God with acceptance, but the angel of the everlasting covenant stands before the throne, with his golden vial, and He, the everlasting intercessor, pours from it the prayers of the saints, he perfumes them with the sacred incense of his own holiness, and they come up as a sweet savour before the Father. Thus it is that our prayers are all offered up for Christ’s sake, and it were well that we fully understood and deeply felt what is implied in the use of these most significant words.

There is reason to fear that many a prayer wafted heavenward remains unanswered, because the grand condition of all acceptable prayer is not fully felt as it ought to be! Men pray as if they had a right to ask, and a title to expect, favours from God, on their own independent footing. There is much trusting to his goodness and forbearance, and mercy, forgetful all the while, that God can only hear through the intercessor before the throne, and can only manifest his goodness through the one mediator, the man Christ Jesus.

When we ask of God, for Christ’s sake, the bestowment of any blessing, it were well that the truth were blazoned before the eye of our inner consciousness, that we cannot be accepted save in the beloved; that if God looks directly at us, we are condemned; that he can only be well pleased when he looks on us in the face of his anointed—when he beholds in the lamb that had been slain justice fully satisfied, and in the lamb now alive and living for ever more, the evidence of his own sealed and irrefragable covenant.

When we ask anything for Christ’s sake, we acknowledge that we are not worthy in ourselves to receive it—when we plead the name of Jesus, we acknowledge our own guilt, and proclaim him the sole ground of our hope —when we point to him, we entreat God not to look upon us—we renounce our own righteousness—we confess our own shame—we plead for a standing in Jesus—we claim an interest in his work—we profess to stand in his righteousness —to hope for mercy through his peace-speaking blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Believing Prayer Heard and Answered in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>[E]ssential to religion is the revelation of God’s will as the regulative principle according to which man, as a servant, must engage himself. It has not been left to man to determine the manner in which he would serve God, for then he would stand above God. Anyone who engages himself in this way exalts himself above God and displeases the Lord in all his activity. “But in vain they do worship Me, teaching for doctrines the commandments of men” (Mat. 15:9).

Rather, the Lord Himself establishes for and reveals to man the regulative principle, indicating what He requires man to do and in which manner He wishes this to be accomplished. “Should not a people seek unto their God … To the law and to the testimony: if they speak not according to this Word, it is because there is no light in them” (Isa 8:19-20); “That ye may prove what is that good, and acceptable, and perfect, will of God” (Rom 12:2).</p></blockquote>

<blockquote><p>Now, what is the cause of most backsliding? I believe, as a general rule, one of the chief causes is neglect of private prayer. Of course the secret history of falls will not be known till the last day. I can only give my opinion as a minister of Christ and a student of the heart. That opinion is, I repeat distinctly, that backsliding generally first begins with neglect of private prayer.

Bibles read without prayer, sermons heard without prayer, marriages contracted without prayer, journeys undertaken without prayer, residences chosen without prayer, friendships formed without prayer, the daily act of private prayer itself hurried over or gone through without heart,—these are the kind of downward steps by which many a Christian descends to a condition of spiritual palsy, or reaches the point where God allows him to have a tremendous fall.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Practical Religion: Being Plain Papers on the Daily Duties, Experience, Dangers, and Privileges of Professing Christians</cite>, (1878; Edinburgh: Banner of Truth, 2013), p. 73.</span></figcaption>

<blockquote><p>[E]very good man, and especially a Minister should flee all occasion of vain glory: Yea, Christian modesty, and soberness require, that every man though they were endued with the greatest graces in the world, yet they should speak and think of themselves soberly: the more they have, the greater graces that God hath given them, the less they should account of themselves: yea, suppose they be something in the sight of God, yet looking to the naughtiness that abideth in this cankered nature, they should say of themselves (I am nothing) for the Apostle saith, 1. Cor. 8. 2 &amp; Gal. 6. 3. He that thinketh himself something, he is nothing &amp; Phil. 2. 3. Let every man account another man better than himself.

If a man will meditate on his own estate, either by night or by day, let him think of his infirmities, his sins and naughtiness: will he rejoice of himself in his own mind? look to Paul what he saith. 2. Corin. 12. 9. I will rejoice in mine infirmities, that the power of Jesus may dwell in me. The power of God never dwelt in a proud nor ambitious heart, but in an humble heart: God resisteth the proud, &amp; giveth grace to the humble,1. Pet. 5. 5. So Paul, when he was musing of himself, albeit hee had seen great visions, 2. Cor. 12. he complaineth of his infirmity to the Lord: the Lord answereth, My grace is sufficient for thee, my power is made perfect through weakness. Then thou that wouldst be strong in God, be weak in thy self: think night and day of thine infirmity &amp; misery by sin.</p></blockquote>

<blockquote><p>[S]ome are strongly tempted to the sin of uncleanness. But being blind regarding their desires, they think it no offence to cross boundaries regarding lustful eyes, loose speech, or secret desires. They know they are snared in this sin. But through long-standing habits they nourish their hearts in these loathsome delights; and when they become aware of their offences, they do not dislike them enough. Thus, they have brought themselves in bondage to their lusts.

Their hearts should therefore be much engaged in fighting against this sin and in observing and weighing its depravity, shame, and danger. They must heartily acknowledge the sin to God and daily offer earnest prayers to God against it, with confidence in both pardon and power to mortify and weaken it. They must use strong reasons to disgrace and renounce the sin. And they must wisely and watchfully avoid the occasions of nourishing the sin. If they do not do this, then this one sin (even if they do not offend grossly) will hold their conscience in great distress, cause them to wander in deep sorrow, and make them unfit for Christian duties.

Indeed, if they do not bestow more labour here than in other parts of their lives, it will slow down their progress and cause disorder and confusion to grow. The longer they have nourished such vain dreams, the more difficult will it be to awake out of them, even if they gladly would.</p></blockquote>

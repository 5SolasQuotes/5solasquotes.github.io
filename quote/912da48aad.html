<main class="wrap"><figure class="quote" id="q-912da48aad" data-kw="against purgatory limbo">
<blockquote><p>The papists make a fourfold hell: eternal punishment of sense and loss for the wicked; temporal punishment of sense and loss which they call purgatory; the limbus of infants; and the limbus of the fathers. On the contrary, the orthodox assert that the souls of the fathers were immediately received into heaven after death, where they enjoy happiness and are free from both kinds of punishment, both that of loss and that of sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.11.2–3</span></figcaption>

<blockquote><p>Since purgatory has been reared on many, and is daily propped up by new blasphemies; since it produces many grievous offenses, assuredly it is not to be connived at, however it might have been disguised for a time, that without any authority from the word of God, it was devised by prying audacious rashness, that credit was procured for it by fictitious revelations, the wiles of Satan, and that certain passages of Scripture were ignorantly wrested to its support.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.5.10</span></figcaption>

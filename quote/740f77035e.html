<main class="wrap"><figure class="quote" id="q-740f77035e" data-kw="">
<blockquote><p>A Synod must ever put a difference betwixt those who out of a real scruple of conscience, do in a modest and peaceable way, refuse obedience to their ordinances, still using the means of their better information, and those who contemptuously or factiously disobey the same, labouring with all their might to strengthen themselves in their error, and to persuade others to be of their mind.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f29f5b7daa" data-kw="">
<blockquote><p>…nor can it be said that church-censures are spiritual punishments and so work on the spirit and have instructing, rebuking and exhorting going before, but the sword is a bodily punishment, and has not instructing going before. For I answer [that] though these two punishments differ, yet they agree that formally both are alike compulsory of the conscience, and neither of them act upon the spirit by teaching and instructing as the Word does, so as excommunication of a heretic should have instructing and convincing going before, so should also the Magistrate presuppose, before he strike with the sword, that the false teacher has been instructed and convinced, and so he does formally punish him with the sword for his pertinacious perverting of souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (1649), ch. 2</cite>, p. 48</span></figcaption>

</figure><figure class="quote" id="q-db154a1515" data-kw="">
<blockquote><p>But, 2. All the power and authority of synods we conceive to be ministerial, not lordly, limited, regulated by the only Word of God in the Scripture, and in matters circumstantial, of order and decency, as time, place, persons… by the law of nature, rules of piety, charity, and Christian prudency, for the edification of our brethren and the glory of God; And a lawful synod we judge has power ministerial from Christ… commanding in the Lord… are to be obeyed, and the conscience submitted to them, not absolutely, not for the sole will and mere authority of the heralds, as if they were infallible, not with blind obedience, not without reclamation, or appeal, if they be either contrary or beside the scriptures, but conditionally in so far as they are agreeable to the Word of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist… (London, 1648), ‘A Brotherly and Free Epistle…’, no page numbers</cite></span></figcaption>

</figure><figure class="quote" id="q-6b2e80d829" data-kw="">
<blockquote><p>IV. (2) …Laws bind the conscience per se and directly, and a violation of them incurs guilt; but constitutions bind the conscience only indirectly, and a violation of them incurs guilt; but constitutions bind the conscience only indirectly and mediately in case of scandal and contempt. Hence the guilt arising from their violation is not properly on account of the violation of the constitution, but on account of the neglect of the authority which God ordained, and on account of the scandal given. … XX. Again, in the transgression of them [church constitutions] there can be no sin except indirectly (i.e., not on account of the usurpation of the thing itself [as in homicide, fornication], but on account of another thing [that is, from contempt of lawful authority], for because obedience is commanded by God, there is sin in a neglect of it, if with a neglect of brotherly edification, or if from impiety and license. However, if all these are absent, there will be no sin in a transgression of them… nor is the authority of the one commanding to be so much regarded as the cause of the command.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 285-6, 290-1 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

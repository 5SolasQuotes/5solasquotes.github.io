<main class="wrap"><figure class="quote" id="q-e7d3313ae5" data-kw="">
<blockquote><p>But the full state of the question arises out of these particulars thus: Whether Christ by his death did intend or purpose to procure remission of sins, and eternal life for every man either absolutely, or upon any condition. The affirmative is the judgment of Arminius and his followers; the negative of the contra-Remonstrants and their followers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-howe.html">Obadiah Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Universalist Examined &amp; Convicted, Destitute of Plain Sayings of Scripture or evidence of Reason</cite>, (London: Rothwell, 1648) 223 pp. ToC, ch. 1, end, n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“But the full state of the question arises out of these particulars thus: Whether Christ by his death did intend or purpose to procure remission of sins, and eternal life for every man either absolutely, or upon any condition. The affirmative is the judgment of Arminius and his followers; the negative of the contra-Remonstrants and their followers.”

— Obadiah Howe, The Universalist Examined &amp; Convicted, Destitute of Plain Sayings of Scripture or evidence of Reason, in Answer to a treatise entitled, The University of God’s Free Grace in Christ to Mankind (London: Rothwell, 1648) 223 pp. ToC, ch. 1, end, n.p.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+the+full+state+of+the+question+arises+out+of+these+particulars+thus%3A+Whether+Christ+by+his+death+did+intend+or+purpose+to+procure+remission+of+sins%2C+and+eternal+life+for+every+man+either+absolutely%2C+or+upon+any+condition.+The+affirmative+is+the+judgment+of+Arminius+and+his+followers%3B+the+negative+of+the+contra-Remonstrants+and+their+followers.%E2%80%9D%0A%0A%E2%80%94+Obadiah+Howe%2C+The+Universalist+Examined+%26+Convicted%2C+Destitute+of+Plain+Sayings+of+Scripture+or+evidence+of+Reason%2C+in+Answer+to+a+treatise+entitled%2C+The+University+of+God%E2%80%99s+Free+Grace+in+Christ+to+Mankind+%28London%3A+Rothwell%2C+1648%29+223+pp.+ToC%2C+ch.+1%2C+end%2C+n.p.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe7d3313ae5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e7d3313ae5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/arminianism/#:~:text=But%20the%20full%20state%20of%20the,of%20the%20contra%2DRemonstrants%20and%20their%20followers&amp;text=But%20the%20full%20state%20of%20the%20question%20arises&amp;text=the%20negative%20of%20the%20contra%2DRemonstrants%20and%20their%20followers" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-094fd40078" data-kw="">
<blockquote><p>Who teach: That without a special revelation we can have no certainty of future perseverance in this life. For by this doctrine the sure comfort of the true believers is taken away in this life, and the doubts of the papist are again introduced into the Church, while the Holy Scriptures constantly deduce this assurance, not from a special and extraordinary revelation, but from the marks proper to the children of God and from the very constant promises of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 5, Rejection of Errors, ¶5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/perseverance-of-the-saints/perseverance-and-assurance.html">Perseverance and Assurance</a> › <a href="../topics/perseverance-of-the-saints/perseverance-and-assurance/how-they-relate.html">How they relate</a></span><span class="t"><a href="../topics/arminians-remonstrants/falling-from-grace.html">Arminians (Remonstrants): Falling from Grace</a></span><span class="t"><a href="../topics/assurance-peace-and-joy/roman-denial-of-assurance.html">Roman Denial of Assurance</a> › <a href="../topics/assurance-peace-and-joy/roman-denial-of-assurance/trents-denial-of-certainty.html">Trent’s denial of certainty</a></span></div>
<div class="actions"><button class="copy" data-copy="“Who teach: That without a special revelation we can have no certainty of future perseverance in this life. For by this doctrine the sure comfort of the true believers is taken away in this life, and the doubts of the papist are again introduced into the Church, while the Holy Scriptures constantly deduce this assurance, not from a special and extraordinary revelation, but from the marks proper to the children of God and from the very constant promises of God.”

</figure><figure class="quote" id="q-78f2548b78" data-kw="">
<blockquote><p>Wherefore I say then, that on supposition that a man lives in this world, perseverance unto the end is a necessary condition of his justification. And if so, no man can be justified whilst he is in this world; for a condition does suspend that whereof it is a condition from existence until it be accomplished. It is, then, to no purpose to dispute any longer about justification, if indeed no man is, nor can be, justified in this life. But how contrary this is to Scripture and experience is known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-7d87be8070" data-kw="">
<blockquote><p>This proposition, — that God pardons men their sins, gives them the adoption of children, with a right unto the heavenly inheritance, according to their works, — is not only foreign to the gospel, but contradictory unto it, and destructive of it, as contrary unto all express testimonies of the Scripture, both in the Old Testament and the New, where these things are spoken of; but that God judges all men, and renders unto all men, at the last judgment, according unto their works, is true, and affirmed in the Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 6</span></figcaption>

— John Owen, The Doctrine of Justification by Faith, ch. 6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis%20proposition%2C%20%E2%80%94%20that%20God%20pardons%20men%20their%20sins%2C%20gives%20them%20the%20adoption%20of%20children%2C%20with%20a%20right%20unto%20the%20heavenly%20inheritance%2C%20according%20to%20their%20works%2C%20%E2%80%94%20is%20not%20only%20foreign%20to%20the%20gospel%2C%20but%20contradictory%20unto%20it%2C%20and%20destructive%20of%20it%2C%20as%20contrary%20unto%20all%20express%20testimonies%20of%20the%20Scripture%2C%20both%20in%20the%20Old%20Testament%20and%20the%20New%2C%20where%20these%20things%20are%20spoken%20of%3B%20but%20that%20God%20judges%20all%20men%2C%20and%20renders%20unto%20all%20men%2C%20at%20the%20last%20judgment%2C%20according%20unto%20their%20works%2C%20is%20true%2C%20and%20affirmed%20in%20the%20Scripture.%E2%80%9D%0A%0A%E2%80%94%20John%20Owen%2C%20The%20Doctrine%20of%20Justification%20by%20Faith%2C%20ch.%206&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7d87be8070.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7d87be8070.html">Permalink</a><a class="src" href="https://ccel.org/ccel/owen/just/just.x.html" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-83f3bb03b4" data-kw="">
<blockquote><p>By negative infidelity understand the mere lack of faith in one to whom the catholic Faith has either not been announced, or certainly not sufficiently. Such is the infidelity of those who have either heard nothing of the Faith, like the pagans; or have indeed heard, but so cursorily that the mysteries of the faith have not yet been shown to them to be evidently credible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Negative Infidelity</cite>, [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 54-59, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

— Samuel Ward, ‘Negative Infidelity [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 54-59, p. 54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+negative+infidelity+understand+the+mere+lack+of+faith+in+one+to+whom+the+catholic+Faith+has+either+not+been+announced%2C+or+certainly+not+sufficiently.+Such+is+the+infidelity+of+those+who+have+either+heard+nothing+of+the+Faith%2C+like+the+pagans%3B+or+have+indeed+heard%2C+but+so+cursorily+that+the+mysteries+of+the+faith+have+not+yet+been+shown+to+them+to+be+evidently+credible.%E2%80%9D%0A%0A%E2%80%94+Samuel+Ward%2C+%E2%80%98Negative+Infidelity+%5Bof+the+Gospel%5D+Condemns+No+One+%5Bdue+to+Invincible+Ignorance%5D%E2%80%99+in+Theological+Determinations+in+Works+of+Samuel+Ward%2C+ed.+Seth+Ward+%28d.+1643%3B+Gallibrand%2C+1658%29%2C+pp.+54-59%2C+p.+54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F83f3bb03b4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/83f3bb03b4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/arminianism/#:~:text=By%20negative%20infidelity%20understand%20the%20mere,to%20them%20to%20be%20evidently%20credible&amp;text=By%20negative%20infidelity%20understand%20the%20mere%20lack%20of&amp;text=been%20shown%20to%20them%20to%20be%20evidently%20credible" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

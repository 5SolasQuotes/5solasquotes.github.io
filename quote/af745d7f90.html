<blockquote><p>‘He that shows mercy, let him do it with cheerfulness.’ And this seems to have been the office of widows and of old men, which were to that end maintained by the Church, that they should take care of strangers and of them that were sick. For good cause he commands these to have cheerfulness. For men that be weak and afflicted, are much relieved if they see their necessities are ministered unto with cheerfulness… Thus much spake Paul concerning the public ministries of the Church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite>, … (London, 1583), pt. 4, ch.1, ‘Of Diverse Ministries of the Church’, p. 8 on Rom. 12:8</span></figcaption>

<blockquote><p>4. Stephen [a deacon] did no more (Acts ch. 7) in his apology than any witnesses of Christ convened before rulers may do who are obliged to be ready always to give an answer to every one who asks them of the hope that is in them, with meekness and fear, 1 Pet. 3:15, yea though it were a woman who yet may not preach, 1 Cor. 14:34.</p></blockquote>

</figure><figure class="quote" id="q-0a52960761" data-kw="">
<blockquote><p>The second defect which he [an opponent] wishes supplied is that the temporary ruling elders may be made perpetual and for life… This I assent unto providing he admit a distinction betwixt the office itself, and the exercise of the same. The office of a ruling elder ought to be for his life no less than the pastors; yet must we not condemn those Churches which dispense with the intermission of their actual attendance for a certain space, and permit them to exercise their office by course, as the Levites did of old, whose example himself here takes for a pattern.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the Points of Ruling-Elders</cite>, … (Edinburgh, 1641), pt, 1 | Postscript, p. 5</span></figcaption>

<main class="wrap"><figure class="quote" id="q-00de4c06dd" data-kw="">
<blockquote><p>And what needs it also that we should speak of the power of prayer, by which we, with the publican, and all other pious persons, do humbly beg from God pardon of our sins, in order to obtain the same, having been so taught by our Savior Himself, ‘Forgive us our sins,’ or of that of other previous acts–since the matter is clearer than the noon-day sun. Nor does this interfere with our being justified gratis, as the Scripture teaches, for in these we put nothing at all of merit, any more than in faith itself… Amandus Polanus, a writer rigid in other respects, yet compelled by the force of truth, lays down this thesis, as the universal opinion of all Protestants, and very agreeable to the teaching of the Fathers. ‘By repentance, confession, prayers, and tears, proceeding from faith, we obtain forgiveness of sins, but we do not, properly speaking, merit it; and therefore we obtain forgiveness of sins, not by the merit of our penitence and prayer, but by the mercy and benignity of God.’ (Catholic Symphony, ch. 27, On the Remission of Sins, p. 951 ff., thesis 2) Which thesis, after a sufficiently sound elucidation, he confirms by some very clear testimonies of the Fathers, to which we could add numberless others, were not the thing itself most clear and certain. Would that all Protestants constantly professed this opinion, thus enunciated by Polanus: for there would remain scarce any matter for controversy regarding this article among the more right-thinking of both sides.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae et Pacificae Controversiarum de Justificatione</cite>, ... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 1, ch. 3, p. 31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-47764201aa" data-kw="">
<blockquote><p>II. As soon as a principle of new life is infused into the adult person by the Spirit of Grace, immediately spiritual acting of every kind springs up from that principle, actions so pervading and exciting one another, and so mingled in their exercise that they can scarcely be distinguished in practice; and as difficult is it to determine which is first in time, which last. Surely it is not possible but that the soul, quickened by the Spirit, should in that supernatural light wherewith it is illuminated, both see itself defiled and undone with innumerable sins, and see Christ full of grace, truth and salvation. Such a view cannot but cause both, that with shame and sorrow it be displeased with itself, and with ardent desire be carried out unto Christ. Hence arises the receiving and accepting of Christ, that it may be delivered from the fiithiness and guilt of its sins. Now it cannot receive Him for justification except at the same time it receive him for sanctification: nor receive Him as a Priest to expiate sin, unless it also receive him as a King to whom it may submit in order to obedience. Hence it follows that that act of faith whereby we receive Christ for righteousness cannot be exercised without either a previous, or at least a concomitant repentance, and a purpose of a new life. If therefore faith go before justification, as we have lately asserted; the same must be said of repentance, springing up together with it from the same principle of spiritual life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain</cite>, (1696; Glasgow, 1807), ch. 11, ‘Whether repentance precedes the remission of sins? [Yes]’, pp. 119-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-052ea44d12" data-kw="">
<blockquote><p>Now, since Christ confers upon us, and we obtain by faith, both free reconciliation and newness of life, reason and order require that I should here begin to treat of both. The shortest transition, however, will be from faith to repentance; for repentance being properly understood it will better appear how a man is justified freely by faith alone, and yet that holiness of life, real holiness, as it is called, is inseparable from the free imputation of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.3.1</span></figcaption>

</figure><figure class="quote" id="q-afc14a999a" data-kw="">
<blockquote><p>It is asked further: But since through faith the righteousness of Christ belongs to him who has been effectually called, cannot one be at least denominated righteous according to that righteousness which belongs to him through faith? I would not, indeed, completely deny that one who has been effectually called is already righteous through faith. But I would not admit that he can be called and named righteous, because the Judge’s sentence—which sentence evidently arises from some further grace—has not yet been delivered and pronounced concerning him. For it is entirely of grace that God pronounces righteous those who are already (in accordance with effectual calling) righteous through faith, and imputes to them another’s righteousness as if it were their own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’</cite>, trans. Aaron Clay Denlinger &amp; Noah Phillips MAJT 27 (d. 1599; 2016), p. 103</span></figcaption>

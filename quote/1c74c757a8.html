<main class="wrap"><figure class="quote" id="q-1c74c757a8" data-kw="">
<blockquote><p>I am ordained into this Church, resigning, we shall say, all other life prospects which I might be warranted to cherish and devoting to her service all my energies and interests, embarking on her prospects also all the temporal interests on my family. I am then ordained in terms of an Ordination Vow. This vow is not an instrument special in my case, not peculiar to me. It is the vow taken also by all my brothers who in this Church are exactly my peers. It has been already taken by all the brothers who in this transaction of exacting and accepting my vow represent to me and act the part towards me of the Church. Not to mention that they are thus bound by the self-same vow already, taking into account merely that they exact and I render this vow in my ordination, is it conceivable that speaking of this one ordination merely I alone became bound by it? Is this merely a pact on my side without being a compact between me and the Church? . . . Do I then come under obligation to the Church without the Church coming under obligation to me? Who would make an assertion so outrageous? The idea of a vow between creatures of God binding only one party in the transaction is a sheer paralogism [piece of illogical reasoning]. This vow entails very weighty obligations on my side and on the side of the Church the weight of obligation is as great. The obligation is manifestly reciprocal. That inheres in the idea of it. Laying out of view the contingency of my convictions as to the subject-matter of my vow coming to be changed and my leaving the Church accordingly, I am bound by it, aye, and until the Church shall release me. Is it conceivable that all this time the Church should have been silently reserving a right to release herself what time she may be able to outvote me? Is it possible that on what are actually called ‘general impressions’ and considerations of ‘good sense’ it is proposed to regulate anew our Church Communion and I am to be – by a dispensing power, we presume – set free from my ordination vow and the Church from her reciprocal and another is to be substituted in its stead? Has a majority power to do this? Yes, if I have power to change my vow and still continue in the Church. And yes, if the Church was not bound to me by prescribing and accepting my vow… A majority may prove treacherous to a vow, just as an individual may: nor is it in the power of the multiplication table to settle a question of morals. Our ordination vow taking us bound to our Confession settles that we have a Constitution, clearly enough defines it, renders us answerable to it and pledges the Church reciprocally as amenable to it also.</p></blockquote>

<blockquote><p>4. Passive obedience to wicked emperors can but be enjoined (Rom. 13) but only in the manner and upon [the] supposition that we must be subject to them and must suffer against our wills all the ill of punishment that they can inflict, we must suffer patiently, and because it is God’s permissive will that they punish us unjustly; For it is not God’s ruling and approving will (called voluntas signi [the will of sign, or his revealed will]) that they should, against the law of God and man kill us and persecute us; and therefore neither Rom. 13, nor 1 Pet. 2, nor any other place in God’s Word, any common divine, natural, national or any municipal law, commands formally obedience passive, or subjection passive, or non-resistance under the notion of passive obedience; Yea, to me, obedience-passive (if we speak of obedience, properly called, as relative essentially to a law) is a chimera, a dream, and repugnantia in adjecto; and therefore I utterly deny that resistance-passive, or subjection-passive, does formally fall under either commandment of God, affirmative or negative; Only the unlawful manner of resistance by way of revenge, or for defense of Popery and false religion, and out of impatient toleration of monarchy or any tyranny, is forbidden in God’s Word; And certainly all the words used [in] Rom. 13, as they fall under a formal commandment of God, are words of action, not of any chimerical passive obedience, as we are not to resist actively God’s ordinance, as his ordinance, (vv. 1-2), that is, to resist God actively. We are to do good works, not evil, if we would have the ruler no terror to us (v. 3). We must not do ill if we would be free of vengeance’s sword (v. 7); we are to pay tribute and to give fear and honor to the ruler, all which are evidently actions, not passive subjection; and if any passive subjection be commanded, it is not here, nor in the First Commandment commanded; but [rather it is] in the First Commandment under the hand of patience and submission under God’s hand in sufferings, or in the Third Commandment under the hand of rather dying for Christ than denying his truth before men. Hence I argue here (Rom. 13; 1 Pet. 2 ; Tit. 3) is nothing else but an exposition of the Fifth Commandment; but in the Fifth Commandment only active obedience is formally commanded, and the subordination of inferiors to superiors is ordained, and passive obedience is nowhere commanded, but only modus rei [the mode of the thing], the manner of suffering, and the occasion of the commandment; …Paul established magistracy and commands obedience in the Lord; and he is more to prove the office of the magistrate to be of God than any other thing (and to show what is his due) than to establish absoluteness in Nero to be of God; yea, to me, every word in the text speaks limitedness of princes, and cries down absoluteness: (1.) No power of God, (2.) no ordinance of God, who is a terror to evil, but a praise to good works, (3.) no minister of God for good, etc. can be a power to which we submit ourselves on earth as next unto God without controlment. That passive obedience falls formally under no commandment of God, I prove thus: All obedience liable to a divine commandment does commend morally the performer of obedience as having a will conformed to God’s moral law; and deformity betwixt the will of him who performs not obedience involves the non-obedient in wrath and guiltiness. But non-passive subjection to the sword of the judge does not morally commend him that suffers not punishment; for no man is formally a sinner against a moral law because he suffers not the ill of punishment, nor is he morally good, or to be commended, because he suffers ill of punishment, but because he does the ill of sin. And all [the] evil of punishment unjustly inflicted has God’s voluntas beneplaciti [the will of good-pleasure, or decree], the instrumental and hidden decree of God, which orders both good and ill (Eph. 1:11) for its rule and cause, and has not God’s will or approbation called, voluntas signi, for its rule: both are contrary to that will. I am sure Epiphanius (1. 1, torn. 3, heres. 40), Basil (in Ps. 32), Nazianzen Orat. (ad subd. et imperat.), Hilarary (li. ad Constant.) and Augustine all cite these words and say the same. If, then, passive subjection be not commanded, non-subjection-passive cannot be forbidden, and this text, Rom. 13 and 1 Pet. 2, cannot a whit help the bad cause of royalists. All then must be reduced to some action of resisting; arguments for passive subjection, though there were ship-fulls of them, they cannot help us.</p></blockquote>

ood and ill (Eph. 1:11) for its rule and cause, and has not God’s will or approbation called, voluntas signi, for its rule: both are contrary to that will. I am sure Epiphanius (1. 1, torn. 3, heres. 40), Basil (in Ps. 32), Nazianzen Orat. (ad subd. et imperat.), Hilarary (li. ad Constant.) and Augustine all cite these words and say the same. If, then, passive subjection be not commanded, non-subjection-passive cannot be forbidden, and this text, Rom. 13 and 1 Pet. 2, cannot a whit help the bad cause of royalists. All then must be reduced to some action of resisting; arguments for passive subjection, though there were ship-fulls of them, they cannot help us.”

— Samuel Rutherford, Question 30, ‘Whether or No[t] Passive Obedience be a Mean[s] to which we are Subjected in Conscience by Virtue of a Divine Commandment…’ Summary in Lex Rex (1644), pp. 155 rt. col. – 156">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+Passive+obedience+to+wicked+emperors+can+but+be+enjoined+%28Rom.+13%29+but+only+in+the+manner+and+upon+%5Bthe%5D+supposition+that+we+must+be+subject+to+them+and+must+suffer+against+our+wills+all+the+ill+of+punishment+that+they+can+inflict%2C+we+must+suffer+patiently%2C+and+because+it+is+God%E2%80%99s+permissive+will+that+they+punish+us+unjustly%3B+For+it+is+not+God%E2%80%99s+ruling+and+approving+will+%28called+voluntas+signi+%5Bthe+will+of+sign%2C+or+his+revealed+will%5D%29+that+they+should%2C+against+the+law+of+God+and+man+kill+us+and+persecute+us%3B+and+therefore+neither+Rom.+13%2C+nor+1+Pet.+2%2C+nor+any+other+place+in+God%E2%80%99s+Word%2C+any+common+divine%2C+natural%2C+national+or+any+municipal+law%2C+commands+formally+obedience+passive%2C+or+subjection+passive%2C+or+non-resistance+under+the+notion+of+passive+obedience%3B+Yea%2C+to+me%2C+obedience-passive+%28if+we+speak+of+obedience%2C+properly+called%2C+as+relative+essentially+to+a+law%29+is+a+chimera%2C+a+dream%2C+and+repugnantia+in+adjecto%3B+and+therefore+I+utterly+deny+that+resistance-passive%2C+or+subjection-passive%2C+does+formally+fall+under+either+commandment+of+God%2C+affirmative+or+negative%3B+Only+the+unlawful+manner+of+resistance+by+way+of+revenge%2C+or+for+defense+of+Popery+and+false+religion%2C+and+out+of+impatient+toleration+of+monarchy+or+any+tyranny%2C+is+forbidden+in+God%E2%80%99s+Word%3B+And+certainly+all+the+words+used+%5Bin%5D+Rom.+13%2C+as+they+fall+under+a+formal+commandment+of+God%2C+are+words+of+action%2C+not+of+any+chimerical+passive+obedience%2C+as+we+are+not+to+resist+actively+God%E2%80%99s+ordinance%2C+as+his+ordinance%2C+%28vv.+1-2%29%2C+that+is%2C+to+resist+God+actively.+We+are+to+do+good+works%2C+not+evil%2C+if+we+would+have+the+ruler+no+terror+to+us+%28v.+3%29.+We+must+not+do+ill+if+we+would+be+free+of+vengeance%E2%80%99s+sword+%28v.+7%29%3B+we+are+to+pay+tribute+and+to+give+fear+and+honor+to+the+ruler%2C+all+which+are+evidently+actions%2C+not+passive+subjection%3B+and+if+any+passive+subjection+be+commanded%2C+it+is+not+here%2C+nor+in+the+First+Commandment+commanded%3B+but+%5Brather+it+is%5D+in+the+First+Commandment+under+the+hand+of+patience+and+submission+under+God%E2%80%99s+hand+in+sufferings%2C+or+in+the+Third+Commandment+under+the+hand+of+rather+dying+for+Christ+than+denying+his+truth+before+men.+Hence+I+argue+here+%28Rom.+13%3B+1+Pet.+2+%3B+Tit.+3%29+is+nothing+else+but+an+exposition+of+the+Fifth+Commandment%3B+but+in+the+Fifth+Commandment+only+active+obedience+is+formally+commanded%2C+and+the+subordination+of+inferiors+to+superiors+is+ordained%2C+and+passive+obedience+is+nowhere+commanded%2C+but+only+modus+rei+%5Bthe+mode+of+the+thing%5D%2C+the+manner+of+suffering%2C+and+the+occasion+of+the+commandment%3B+%E2%80%A6Paul+established+magistracy+and+commands+obedience+in+the+Lord%3B+and+he+is+more+to+prove+the+office+of+the+magistrate+to+be+of+God+than+any+other+thing+%28and+to+show+what+is+his+due%29+than+to+establish+absoluteness+in+Nero+to+be+of+God%3B+yea%2C+to+me%2C+every+word+in+the+text+speaks+limitedness+of+princes%2C+and+cries+down+absoluteness%3A+%281.%29+No+power+of+God%2C+%282.%29+no+ordinance+of+God%2C+who+is+a+terror+to+evil%2C+but+a+praise+to+good+works%2C+%283.%29+no+minister+of+God+for+good%2C+etc.+can+be+a+power+to+which+we+submit+ourselves+on+earth+as+next+unto+God+without+controlment.+That+passive+obedience+falls+formally+under+no+commandment+of+God%2C+I+prove+thus%3A+All+obedience+liable+to+a+divine+commandment+does+commend+morally+the+performer+of+obedience+as+having+a+will+conformed+to+God%E2%80%99s+moral+law%3B+and+deformity+betwixt+the+will+of+him+who+performs+not+obedience+involves+the+non-obedient+in+wrath+and+guiltiness.+But+non-passive+subjection+to+the+sword+of+the+judge+does+not+morally+commend+him+that+suffers+not+punishment%3B+for+no+man+is+formally+a+sinner+against+a+moral+law+because+he+suffers+not+the+ill+of+punishment%2C+nor+is+he+morally+good%2C+or+to+be+commended%2C+because+he+suffers+ill+of+punishment%2C+but+because+he+does+the+ill+of+sin.+And+all+%5Bthe%5D+evil+of+punishment+unjustly+inflicted+has+God%E2%80%99s+voluntas+beneplaciti+%5Bthe+will+of+good-pleasure%2C+or+decree%5D%2C+the+instrumental+and+hidden+decree+of+God%2C+which+orders+both+good+and+ill+%28Eph.+1%3A11%29+for+its+rule+and+cause%2C+and+has+not+God%E2%80%99s+will+or+approbation+called%2C+voluntas+signi%2C+for+its+rule%3A+both+are+contrary+to+that+will.+I+am+sure+Epiphanius+%281.+1%2C+torn.+3%2C+heres.+40%29%2C+Basil+%28in+Ps.+32%29%2C+Nazianzen+Orat.+%28ad+subd.+et+imperat.%29%2C+Hilarary+%28li.+ad+Constant.%29+and+Augustine+all+cite+these+words+and+say+the+same.+If%2C+then%2C+passive+subjection+be+not+commanded%2C+non-subjection-passive+cannot+be+forbidden%2C+and+this+text%2C+Rom.+13+and+1+Pet.+2%2C+cannot+a+whit+help+the+bad+cause+of+royalists.+All+then+must+be+reduced+to+some+action+of+resisting%3B+arguments+for+passive+subjection%2C+though+there+were+ship-fulls+of+them%2C+they+cannot+help+us.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Question+30%2C+%E2%80%98Whether+or+No%5Bt%5D+Passive+Obedience+be+a+Mean%5Bs%5D+to+which+we+are+Subjected+in+Conscience+by+Virtue+of+a+Divine+Commandment%E2%80%A6%E2%80%99+Summary+in+Lex+Rex+%281644%29%2C+pp.+155+rt.+col.+%E2%80%93+156&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9aa1a1740a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9aa1a1740a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-passive-obedience/#:~:text=4.%20Passive%20obedience%20to%20wicked%20emperors,of%20them%2C%20they%20cannot%20help%20us&amp;text=4.%20Passive%20obedience%20to%20wicked%20emperors%20can%20but&amp;t <blockquote><p>XXVII. Self-interest, self-government and family-government are all antecedent to public government, which rules them for the common good, but has no authority to destroy them: No king or prelate can bind a man to do that which would damn his soul, nor to omit that which is needful to his salvation: All power is for edification: They are God’s ministers for God. XXVIII. As it belongs to self-government to choose our own diet, and clothes, and wives, and physicians, (though we may be restrained from doing public hurt on such pretences); And it belong to family government to educate our own children, and choose their tutors, callings, wives, etc. so it more nearly belongs to self-government to choose the most safe and profitable means of our own salvation, which no man may forbid us; and to avoid that which is pernicious or hurtful; and to family-government to do the like for our children.</p></blockquote>

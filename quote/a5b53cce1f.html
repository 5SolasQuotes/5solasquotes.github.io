<main class="wrap"><figure class="quote" id="q-a5b53cce1f" data-kw="">
<blockquote><p>II. What are the Parts of the law, and what their Differences? Laws are divine and human. Human laws are such as are instituted by men, and which bind certain persons to certain external duties concerning which there is no express divine precept or prohibition with a promise of reward and threatening of punishment, corporal and temporal. Human laws are either civil or ecclesiastical. Civil are such positive laws as are instituted by magistrates, or by some corporation, or state, in reference to a certain order or class of actions to be observed in the state in contracts, trials, punishments, &amp;c. Ecclesiastical, or ceremonial laws, are those which the church institutes in reference to the order which is to be observed in the ministry of the church, and which lay down certain prescriptions in reference to those things which contribute to the divine law…. Divine laws are those which God has instituted, which belong partly to angels, partly to men, and partly to certain classes of men. These do not only require external actions or obedience, but they also require internal qualities, actions and motives: nor do they merely propose temporal rewards and punishments; but also such as are spiritual and eternal. They are also the ends for which human laws are instituted. Of divine laws there are some that are eternal and unchangeable; whilst there are others that are changeable; yet only by God himself, who has instituted them. The divine law is ordinarily divided, or considered as consisting of three parts; the moral, the ceremonial and the judicial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, 34th Lord’s Day, ‘Of the 10 Commandments’, pp. 490-491</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-74b996f70a" data-kw="">
<blockquote><p>Since we have need of civil laws and the power of punishing, it will be wisest not to contemn those given by Moses; but seriously rather to consider what the meaning of God was in them, what he chiefly required, and how much it might be to the good of every nation, if they would borrow thence their manner of governing the commonwealth; yet freely all things and with the Spirit of Christ. For what Solon or Plato, or Aristotle, what lawyers or Caesars could make better laws than God? And it is no light argument, that many magistrates at this day do not enough acknowledge the Kingdom of Christ, though they would seem most Christian, in that they govern their States by laws so diverse from those of Moses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 5:19, as quoted by John Milton, A Complete Collection of the Historical, Political &amp; Miscellaneous Works of John Milton, vol. 1, p. 394</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-d330f3a329" data-kw="">
<blockquote><p>§ 10, Direction 7. Meddle not with lawsuits till you have offered an equal arbitration of indifferent men, or used all possible means of love to prevent them. Lawsuits are not the first, but the last remedy. Try all others before you use them. § 11, Direction 8. When you must needs go to law, compose your minds to unfeigned love towards him that you must contend with, and watch over your hearts with suspicion and the strictest care, lest secret disaffection get advantage by it; And go to your neighbor and labor to possess his heart also with love, and to demulce [pacify] his mind, that you may not use the courts of justice as soldiers do their weapons, to do the worst they can against another, as an enemy: but as loving friends do use an amicable arbitration, resolving contentedly to stand to what the judge determines, without any alienation of mind or abatement of brotherly love. § 12, Direction 9. Be not too confident of the righteousness of your own cause, but ask counsel of some understanding, godly and impartial men; and hear all that can be said, and patiently consider of the case, and do as you would have others do by you.</p></blockquote>

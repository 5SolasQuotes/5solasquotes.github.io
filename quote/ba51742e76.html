</figure><figure class="quote" id="q-9be2d609ce" data-kw="">
<blockquote><p>§66… There is a second thing unlawful also, and that is the misdetermining of those same modes and circumstances which he is authorized to determine. For he is (as is said) to do it by God’s General Rule. Here therefore we must thus conclude: 1. That every misordering of such great affairs is the sin of them that do it. 2. But yet that the subject is not exempted from obedience by every such mistake of the governor: but by some, he is. §67. If the mischoosing of such circumstances by Church-governors be but an inconvenience and do not destroy the ordinance itself, or frustrate the ends of it, we are to obey: 1. For he is the judge in his own work, and not we: 2. the thing is not sinful, though inconvenient. 3. Obedience is commanded to our lawful governors… §68. But if a governor so misdetermine but a mode or circumstance as will overthrow the substance and ends of the worship, I would not obey, except some greater evil were likely to follow my not obeying at that particular season than the frustrating of the duty itself would come to. As for example: If a governor make a new sacrament, I will not obey, because his command is null and the thing [is] simply evil. If he miscommand a circumstance of time or place, or gesture, I will consider the consequents. If he command the solemn assemblies to be held a mile or two or three from the people, I will obey him, if it be but as far as I can go without frustrating the work itself. But if he command us all to go ten miles or twenty miles to worship, I would obey for some time to avoid a greater evil, but ordinarily I would no more obey than if he forbade all Christian assemblies, for it comes all to one. So if he command the assemblies to be at break of day or after sun-setting, I would obey. But if he command that we assemble only at midnight, what should I do then? The thing is not simply unlawful: He does but misdo his own work. And therefore for some times I would obey, if it were necessary to avoid a greater evil. But if he make it the ordinary case, I would not obey: because it destroys the worship itself in a manner, as if he simply forbade it, and this he has no power to do. An inconvenient gesture I would use in obedience and to avoid a greater evil: But I would not obey him that would command me to stand on my head always in hearing. An unhandsome vesture I would use in obedience to a lawful governor and to avoid a greater evil: But not so ridiculous a vesture as would set all the people on laughing so as to frustrate the work that we assemble for. §69. In all such cases where governors act not as usurpers in a matter that they have no authority in, but only misdo their own work, it much concerns the subjects to foresee what’s likely to be the consequents of their obeying or disobeying, and accordingly to do that which tends most to the ends of the work: still holding to this rule, that we must obey in all things lawful. §70. And when we do obey in a case of miscommanding, it is not a doing evil that good may come of it, as some do misconceive: But it is only a submitting to that which is ill commanded, but not evil in him that does submit. It is the determiner that is the cause of the inconvenience, and not the obeyer. Nor is it inconvenient for me to obey, though it be worse perhaps to him that commands. While he sins in commanding, he may make it my duty to obey.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations on Church Government &amp; Worship (London, 1659)</cite>, ch. 2; pp. 423-24</span></figcaption>

<blockquote><p>While the people with fear and joy see God lighting his own fire, fire from heaven, the two sons of Aaron, in a careless presumption, will be serving Him with a common flame; as if He might not have leave to choose the forms of his own worship. If this had been done some ages after, when the memory of the original of this heavenly fire had been worn out, it might have been excused with ignorance; but now, when God had newly sent his fire from above, newly commanded the continuance of it, either to let it go out, or, while it still flamed, to fetch profane coals to God’s altar, could savour of no less than presumption and sacrilege. … Speed of death is not always a judgment: suddenness, as it is ever justly suspicable, so then certainly argues anger, when it finds us in an act of sin. Leisure of repentance is an argument of favor. When God gives a man law, it implies that He would not have judgment surprise him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contemplations on the Historical Passages of the Old &amp; New Testaments (1614; London: 1868), bk. 6, Contemplation 2</cite>, pp. 66-67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“While the people with fear and joy see God lighting his own fire, fire from heaven, the two sons of Aaron, in a careless presumption, will be serving Him with a common flame; as if He might not have leave to choose the forms of his own worship. If this had been done some ages after, when the memory of the original of this heavenly fire had been worn out, it might have been excused with ignorance; but now, when God had newly sent his fire from above, newly commanded the continuance of it, either to let it go out, or, while it still flamed, to fetch profane coals to God’s altar, could savour of no less than presumption and sacrilege. … Speed of death is not always a judgment: suddenness, as it is ever justly suspicable, so then certainly argues anger, when it finds us in an act of sin. Leisure of repentance is an argument of favor. When God gives a man law, it implies that He would not have judgment surprise him.”

— Joseph Hall, Contemplations on the Historical Passages of the Old &amp; New Testaments (1614; London: 1868), bk. 6, Contemplation 2, pp. 66-67">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhile+the+people+with+fear+and+joy+see+God+lighting+his+own+fire%2C+fire+from+heaven%2C+the+two+sons+of+Aaron%2C+in+a+careless+presumption%2C+will+be+serving+Him+with+a+common+flame%3B+as+if+He+might+not+have+leave+to+choose+the+forms+of+his+own+worship.+If+this+had+been+done+some+ages+after%2C+when+the+memory+of+the+original+of+this+heavenly+fire+had+been+worn+out%2C+it+might+have+been+excused+with+ignorance%3B+but+now%2C+when+God+had+newly+sent+his+fire+from+above%2C+newly+commanded+the+continuance+of+it%2C+either+to+let+it+go+out%2C+or%2C+while+it+still+flamed%2C+to+fetch+profane+coals+to+God%E2%80%99s+altar%2C+could+savour+of+no+less+than+presumption+and+sacrilege.+%E2%80%A6+Speed+of+death+is+not+always+a+judgment%3A+suddenness%2C+as+it+is+ever+justly+suspicable%2C+so+then+certainly+argues+anger%2C+when+it+finds+us+in+an+act+of+sin.+Leisure+of+repentance+is+an+argument+of+favor.+When+God+gives+a+man+law%2C+it+implies+that+He+would+not+have+judgment+surprise+him.%E2%80%9D%0A%0A%E2%80%94+Joseph+Hall%2C+Contemplations+on+the+Historical+Passages+of+the+Old+%26+New+Testaments+%281614%3B+London%3A+1868%29%2C+bk.+6%2C+Contemplation+2%2C+pp.+66-67&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb150bf6217.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b150bf6217.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=While%20the%20people%20with%20fear%20and,would%20not%20have%20judgment%20surprise%20him&amp;text=While%20the%20people%20with%20fear%20and%20joy%20see&amp;text=that%20He%20would%20not%20have%20judgment%20surprise%20him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-844a025f83" data-kw="">
<blockquote><p>Again the law of God, is either perpetual, or for a certain time. The perpetual law of God, is that law which doth always bind all reasonable creatures to obedience: and that is called the moral law. The moral law is that law which teacheth how every one ought to behave himself, in inward, and outward manners, that his whole life may be agreeable to God’s will.

The sum of that is comprehended in the decalogue or ten commandments. The decalogue or ten commandments is a brief sum of the moral law, containing ten precepts. And that is divided into two tables or parts. The first table containeth four commandments, concerning our duties toward God, or concerning love towards God, or concerning his worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The substance of Christian religion soundly set forth in two books, by definitions and partitions, framed according to the rules of a natural method, by Amandus Polanus professor of divinity. The first book concerneth faith. The second concerneth good works. The principal pointes whereof are contain</cite>, trans. Elijahu Wilcocks (London: John Oxenbridge, 1595), p. 53.</span></figcaption>

</figure><figure class="quote" id="q-25f2d0e08b" data-kw="">
<blockquote><p>There are two sorts of things belonging to the church. Some which are intrinsical, and belonging to the soul or inward man, directly and primarily. Such things are not to be dispensed and administered by the civil magistrate:

I mean the word and sacraments, the keys of the kingdom of heaven, the suspension or excommunication of church officers or members, the ordination or deposition of officers, the determination and resolution from Scripture of controversies concerning the faith, the worship of God, the government of the church, cases of conscience.

These being in their nature, end, and use, merely spiritual, and belonging not to the outward man, but to the inward man or soul, are committed and entrusted to the pastors and other ruling officers of the church, and are not of civil and extrinsical, but of ecclesiastical and intrinsical cognisance and judgment.

There are other things belonging to the church, which are extrinsical, and do properly belong to the outward man, and are common to the church with other human societies or corporations: things of this kind fall within the civil jurisdiction; for the churches of Christ, being societies of men and women, and parts of commonwealths, are accountable unto and punishable by the civil magistrate, in their bodies, lives, civil liberties, and temporal estates, for trespasses against the law of God or the law of the land.

By the law of God I understand here jus divinum naturale, that is, the moral law or Decalogue, as it bindeth all nations (whether Christians or infidels), being the law of the Creator and King of nations. The magistrate, by his authority, may, and in duty ought, to keep his subjects within the bounds of external obedience to that law, and punish the external man with external punishments for external trespasses against that law.

From this obligation of the law, and subjection to the corrective power of the magistrate, Christian subjects are no more exempted than heathen subjects, but rather more straitly obliged. So that if any such trespass is committed by church officers or members, the magistrate hath power and authority to summon, examine, judge, and (after just conviction and to punish these, as well as other men. We do therefore abominate the disloyal papal tenet, that clergymen are not to be examined and judged by civil, but by ecclesiastical courts only, even in causes civil and criminal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming; or, The Divine Ordinance of Church Government Vindicated</cite>, (1646; Edinburgh: Robert Ogle, and Oliver &amp; Boyd, 1844), Book 2.8, p. 121.</span></figcaption>

</figure><figure class="quote" id="q-20de63699f" data-kw="">
<blockquote><p>Thus ye see Jesus Christ is either the subject of all in the scriptures, or the end of it all. He is the very proper subject of the gospel. Paul knew nothing but Christ crucified in his preaching; and he is the very end and scope “of the law for righteousness,” Rom. 10.3. All the preaching of a covenant of works, all the curses and threatenings of the Bible, all the rigid exactions of obedience, all come to this one great design; not that we set about such a walking to please God, or do something to pacify him, but that we being concluded under sin and wrath on the one hand, and an impossibility to save ourselves on the other hand, Gal. 3.22, Rom. 5.20, 21, may be pursued unto Jesus Christ for righteousness and life, who is both able to save us, and ready to welcome us.

Therefore the Gospel opens the door of salvation in Christ, the law is behind us with fire and sword, and destruction pursuing us; and all for this end, that sinners may come to him and have life. Thus the law is made the pedagogue of the soul to lead to Christ; Christ is behind us, cursing, condemning, threatening us, and he is before with stretched-out arms ready to receive us, bless us, and save us, inviting, promising, exhorting to have life. Christ is on Mount Sinai, delivering the law with thunders, Acts 7.38; and he is on the Mount Zion, in the calm voice; he is both upon the mountain of cursings and blessings, and on both doing the part of a mediator, Gal. 3.19,20.

It is love that is in his heart which made him first cover his countenance with frowns and threats; and it is love that again displays itself in his smiling countenance. Thus souls are enclosed with love pursuing and love receiving; and thus the law, which seems most contrary to the Gospel, testifies of Christ. It gives him this testimony, that except salvation be in him, it is nowhere else.

The law says, It is not in me, seek it not in obedience; I can do nothing but destroy you, if you abide under my jurisdiction. The ceremonies and sacrifices say, If you can behold the end of this ministry,—if a veil be not upon your hearts, as it was upon Moses’ face, (2 Cor. 3. 13.) you may see where it is; it is not in your obedience, but in the death and suffering of the Son of God whom we represent. Then the Gospel takes all these coverings and veils away and gives a plain and open testimony of him: There is no name under heaven to be saved by, but Christ’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism</cite>, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 48-49.</span></figcaption>

<blockquote><p>The relation of the law to the Gospel is one of the most important questions of theology. To misunderstand it, is to misunderstand the whole theory of the Divine government, and the whole plan of redemption. It needs not to add that it is, in a very marked and special sense, one of the questions of the day.

Views regarding it have been recently, and ostentatiously promulgated, which cut far deeper into the foundations of both morality and religion, than is at all perceived by multitudes of those who favourably listen to them, or even by some of those who adopt and teach them. …

In bringing out the relation of the law to the mission and work of Christ, the first thing to which attention must be turned, is the great and fundamental fact, that it was the existence of the law, and the necessity which had arisen for upholding it in all its integrity and honour, which brought Christ into this world. As saith the Apostle Paul, “Where no law is, there is no transgression.” In the absence of law there could have been no sinner, and, therefore, no saviour. The proper and scriptural definition of sin is this, — “it is the transgression of the law.” The object of law is to express the will and to assert the authority of the Ruler. The law declares this to be right and that to be wrong — this to be duty and that to be disobedience — this to be required and that to be forbidden.

Where no law is, therefore, it follows of necessity that there is, and can be, no such thing as sin; for, as already has been said, — “sin is the transgression of the law.” It is a contempt of the authority and disregard of the will of God. But that will cannot be disregarded where there is no law to express it; and that authority cannot be contemned, where there is no law to assert it. The fact that law did not begin, for the first time, to exist in this world when it was given on the two tables of stone to the people of Israel, was made conclusively manifest from this, — that there was sin in the world for ages before.

Sin, as Paul tells us (Rom. v. 12), “is not imputed” — is not held to exist; that is, “where there is no law.” But as death, which is the wages of sin, reigned universally among men, “from Adam to Moses,” the conclusion is inevitable that law existed, and was in full force all the while. And I again repeat, it was the existence of this law, as a law, which man had broken, and under whose awful curse and penalty he had consequently fallen, which created the necessity for Christ’s coming into the world, if man was to be saved.

It is this very truth which is explicitly proclaimed in those well-known words of the Epistle to the Galatians (iv. 4-5), “When the fulness of the time was come, God sent forth His Son, made of a woman, made under the law, to redeem them that were under the law” (or more strictly and literally “those under the law;” those, that is, that were, and those that are and those that are to be, under the law), “that we might receive the adoption of sons.”

In His pre-existent state, as the eternal and only begotten Son of God, Christ was not under the law. He was then in the form of God, and thought it not robbery to be equal with God. As such, He was not a member or subject of the kingdom of Heaven, but its Sovereign Head and Lord. He possessed, indeed, in that condition, the most absolute and perfect holiness; but it was not the holiness which consists in obedience. The law which is holy, and the commandment which is holy, and just, and good, was conformed to Him; not He to the law. His holiness was exercised as the lawgiver, in making the law, and in governing the world by it.

But in undertaking, and entering on the blessed mission which brought Him down from heaven to earth, He “took upon Him the form of a servant, and was made in the likeness of men.” (Phil. ii. 7). By so doing, He placed himself “under the law;” the very law to which those were subject, whom He had come to redeem. Had they — that is, the human race — kept that law, His interposition in their behalf would not have been required. The law itself would have secured them eternal life. But having broken that law, they had both forfeited the rewards of obedience, and incurred the tremendous penalty of transgression. It was in this extremity that Christ came to seek and to save that which was lost: and this He did, by meeting, in the room and stead of His people — and as their substitute and surety — all the law’s demands.

We have thus seen, as the first result of our inquiry into the subject before us, that the law stands, to the mission and work of Christ, in a relation of the closest and most fundamental kind. Take away the law, and you take away the gospel; for, in taking away the law, you take away the only adequate ground, or necessity, for such a work as Christ came into this world to accomplish.</p></blockquote>

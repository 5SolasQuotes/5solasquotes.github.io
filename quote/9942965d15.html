<main class="wrap"><figure class="quote" id="q-9942965d15" data-kw="">
<blockquote><p>The elements being now sanctified by the word and prayer, the minister, being at the table, is to take the bread in his hand, and say, in these expressions, (or other the like, used by Christ or his apostle upon this occasion): ‘According to the holy institution, command, and example of our blessed Saviour Jesus Christ, I take this bread, and, having given thanks, break it, and give it unto you; (there the minister, who is also himself to communicate, is to break the bread, and give it to the communicants;) Take ye, eat ye; this is the body of Christ which is broken for you: do this in remembrance of him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for the Public Worship of God</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/elements-and-words.html">Elements and Words</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2ace8b8da3" data-kw="">
<blockquote><p>After the thanksgiving, it is very clear that our Divine Lord broke the bread. We scarcely know what kind of bread was used on that occasion; it was probably the thin passover cake of the Jews; but there is nothing said in Scripture about the use of leavened or unleavened bread, and therefore it matters not which we use. Where there is no ordinance, there is no obligation; and we are, therefore, left free to use the bread. which it is our custom to eat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-h-spurgeon.html">Charles H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This quote was compiled by Andy Webb</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/elements-and-words.html">Elements and Words</a></span></div>

</figure><figure class="quote" id="q-0fbb9ae289" data-kw="">
<blockquote><p>He took bread. The bread which Christ took was leavened bread, such as they ate at the feast of the Passover. This circumstance, however, does not properly belong to the Supper, any more than the evening at which time it was instituted; for the use of leavened bread at the institution was accidental. Hence we must not infer from this that there is any necessity for the use of such bread in the celebration of the Supper, or that Christ would lay down any particular way of baking or using it. Yet still the bread which is used in the celebration of the Lord’s supper differs from common bread, for whilst the latter is eaten for the nourishment of the body, the former is received for the nourishment of the soul, or for the confirmation of our faith, and union with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism, reprinted 1888, trans. G.W. Williard, 4th American ed,, Cincinnati, | Question 77</cite>, p. 384</span></figcaption>

</figure><figure class="quote" id="q-5d20b26263" data-kw="">
<blockquote><p>It is indifferent whether we use white or red wine; we are no more bound to the wine of Judea than to the wine of France at the ministration of the Supper: these are but national differences.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly… ([Leiden, 1619]), ‘Kneeling in the Act of Receiving’, ‘Kneeling Considered as it is a Breach of the Institution’</cite>, p. 38</span></figcaption>

</figure><figure class="quote" id="q-a96796ee1c" data-kw="">
<blockquote><p>Took bread. Matthew 26:26 , it is said, “ as they were eating, ” i.e. during the repast, “ Jesus took bread, ” that is, he took of the bread lying on the table; and as it was at the time of the Passover, there is no doubt that the bread used was unleavened. It was the thin Passover bread of the Jews. But as no part of the significancy of the rite depends on the kind of bread used, as there is no precept on the subject, and as the apostles subsequently in the celebration of the ordinance used ordinary bread, it is evidently a matter of indifference what kind of bread is used. It was however for a long time a subject of bitter controversy. At first the Latins and Greeks used leavened bread; when the Latins introduced the unleavened wafer from superstitious fear of any of the fragments being dropped, the Greeks retained the use of fermented bread, and accused the Latins of Judaizing. Romanists and Lutherans use unleavened wafers; Protestants generally ordinary bread.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>1878 | This quote was compiled by Andy Webb</cite></span></figcaption>

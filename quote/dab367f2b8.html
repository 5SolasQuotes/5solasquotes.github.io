<main class="wrap"><figure class="quote" id="q-dab367f2b8" data-kw="">
<blockquote><p>Quest. CXXIV. Is it lawful to use David’s psalms in our assemblies?

Answ. Yes: 1. Christ used them at his last supper, as is most probable; and he ordinarily joined with the Jews that used them; and so did the apostles.

2. It is confessed lawful to read or say them; therefore also to sing them. For saying and singing difference not the main end.

3. They are suitable to our use, and were the liturgy of the Jewish church, not on a ceremonial account, but for that fitness which is common to us with them.

4. We are commanded in the New Testament to sing psalms; and we are not commanded to compose new ones; nor can every one make psalms, who is commanded to sing psalms. And if it be lawful to sing psalms of our own or our neighbour’s making, much more of God’s making by his Spirit in his prophets.

Object. They are not suitable to all our cases, nor to all in the assembly.

Answ. 1. We may use them in that measure of suitableness to our cases which they have. You may join with a man in prayer who expresseth part of your wants, though he express not all. Else you must join with no man in the world.

2. If ungodly men are present when the faithful speak to God, must we not speak our proper case, because they are present? The minister in church-administrations speaketh principally in the name of the faithful, and not of hypocrites. Must he leave out of his prayers all that is proper to the godly, merely because some wicked men are there? No more must the church do in singing unto God.

3. They that cannot speak every word in a psalm just as their own case, may yet speak it as instructive; otherwise they might not read or say it.

But the sectarian objections against singing David’s psalms are so frivolous, that I will not tire the reader with any more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory. Part III. Christian Ecclesiastics: Or, Directions to Pastors and People about Sacred Doctrine, Worship, and Discipline, and their Mutual Duties. With the Solution of a Multitude of Church Controversies, and Cases of Conscience</cite>, in The Practical Works of the Rev. Richard Baxter, ed. William Orme (23 vols, London: James Duncan, 1830), 5: 496-97.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5d1d7cee19" data-kw="">
<blockquote><p>Psalms are song by emperors; the common people rejoice in them. Each man does his utmost in singing what will be a blessing to all. Psalms are sung in the home and rehearsed on the streets. The psalm is learned without labor and remembered with delight. Psalmody unites those who disagree, makes friends of those at odds, and brings together those who are out of charity with one another. Who could retain a grievance against the man whom he had joined in singing before God? The singing of praise is the very bond of unity, when the whole people join a single act of song.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-ambrose.html">Ambrose of Milan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition 9</cite>, trans. Erik Routley in The Church and Music (London: Duckworth, 1950), 129.</span></figcaption>

<blockquote><p>By psalms are meant the Psalms of David, and others that compose the book that goes with that name; and by hymns we are to understand, not such as are made by good men, without the inspiration of the Spirit of God; since they are placed between psalms and spiritual songs, made by men inspired by the Holy Ghost… but these are only another name for the book of Psalms, the running title of which may as well be the book of Hymns, as it is rendered by Ainsworth… and by ‘spiritual songs’ are meant the same Psalms of David, Asaph, etc. and the titles of many of them are songs… These three words answer to Mizmorim, Tehillim, and Shirim, the several titles of David’s Psalms…</p></blockquote>

</figure><figure class="quote" id="q-394b30f141" data-kw="">
<blockquote><p>Wicked men cry out of bands and cords in religion… Away with this strictness and preciseness, it extinguishes the joy and pleasure of our lives; give us our cups instead of bibles, our profane songs instead of spiritual psalms, our sports and pastimes instead of prayers and sermons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Flavel on the Content of Singing Public Praise to God</cite>, vol. 1; vol. 4, ‘England’s Duty’, p. 557</span></figcaption>

— John Flavel, Flavel on the Content of Singing Public Praise to God, vol. 1; vol. 4, ‘England’s Duty’, p. 557">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWicked+men+cry+out+of+bands+and+cords+in+religion%E2%80%A6+Away+with+this+strictness+and+preciseness%2C+it+extinguishes+the+joy+and+pleasure+of+our+lives%3B+give+us+our+cups+instead+of+bibles%2C+our+profane+songs+instead+of+spiritual+psalms%2C+our+sports+and+pastimes+instead+of+prayers+and+sermons.%E2%80%9D%0A%0A%E2%80%94+John+Flavel%2C+Flavel+on+the+Content+of+Singing+Public+Praise+to+God%2C+vol.+1%3B+vol.+4%2C+%E2%80%98England%E2%80%99s+Duty%E2%80%99%2C+p.+557&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F394b30f141.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/394b30f141.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=Wicked%20men%20cry%20out%20of%20bands,pastimes%20instead%20of%20prayers%20and%20sermons&amp;text=Wicked%20men%20cry%20out%20of%20bands%20and%20cords&amp;text=sports%20and%20pastimes%20instead%20of%20prayers%20and%20sermons" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-76cecfc135" data-kw="">
<blockquote><p>(1) It is extremely dangerous. Heresies and errors by this means, may, and often have been very insensibly introduced into churches, congregations or families. (2) There is no need of it. The Holy Ghost hath, in the Psalms of David, and other scriptural songs, furnished us with such a rich collection of gospel doctrines and precious promises – an extensive fund of solid experiences – an exhaustless mine of gospel grace and truth – an endless variety to suit every state or condition, in which either our own soul, or the church of Christ, can be upon earth. These were framed by him who searcheth the hearts, and knows the deep things of God; and hence must be better adapted to the case of souls or societies, than any private composition whatever. (3) Though the Holy Ghost never saw meet to leave us a liturgy of prayers; yet from the poetical compositions thereof, it is plain he intended these psalms and songs for a standing form of praise in the church. It is certain they were used in this manner under the Old Testament. The Holy Ghost hath, under the New, plainly directed us to the use hereof, Col. iii. 16. Eph. v. 19. The PSALMS, HYMNS, and SPIRITUAL SONGS, there recommended are plainly the same with the MIZMOREM, TEHILLIM, and SHIRIM, mentioned in the Hebrew titles of David’s Psalms, iii. iv. v. &amp;c. cxlv. cxx. – cxxxiv.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms of David, in metre: allowed by the authority of the General Assembly of the Church of Scotland, and of the Presbyterian Churches in</cite>, America. With notes exhibiting the connexion, explaining the sense, and for directing and animating devotion (Pittsburgh, 1812), iv-v.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

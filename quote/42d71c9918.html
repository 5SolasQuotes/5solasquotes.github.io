<main class="wrap"><figure class="quote" id="q-42d71c9918" data-kw="">
<blockquote><p>There can be no safety, no holiness, and no happiness to those who are out of Christ. No safety, because all such are under the condemnation of the law, verses 1-3; no holiness, because only such as are united to Christ have the Spirit of Christ, verse 9; and no happiness, because “to be carnally minded is death,” verse 6. Hence those who are in Christ, should be very humble, seeing they are nothing, and he is everything; very grateful, and very holy. And those who are out of Christ, should at once go to him, that they may attain safety, holiness, and happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Epistle to the Romans</cite>, rev. ed., 1886, ch. 8, Remarks</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e5278482a5" data-kw="Mediator">
<blockquote><p>That the saints are nearer unto Christ than angels are, as I told you before; he is so a head to men as he is not to them. Both their union and ours with God is by Christ; now, if we be more united to Christ than they are, then we are more nearly united to God too; more nearly united to Christ we are, for he is our brother, he hath our nature, he hath more of ours, he hath done more for us; we are sons by adoption in him, he is our husband. To which of all the angels was it said that Christ is their husband? Of which of all the angels is it said that Christ is their Saviour?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Chapter of Ephesians</cite>, Works, vol. 1, Sermon X (Eph. 1:10), Obs. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-9b16df32c0" data-kw="Imputation">
<blockquote><p>When they demand, How can we be justified by the righteousness of another? Can I be rich with another man&#x27;s money, or preferred by another man&#x27;s honours? Our answer is, yes, if that other be my surety or husband. Indeed Peter can not be justified by the righteousness of Paul; but both may be justified by the righteousness of Christ imputed to them; they being members, jointly knit to one common Head. Principal and surety are one in obligations and constructions of law. Head and members are one body, branch and stock are one tree; and it is no strange thing to see a graff live by the sap of another stock, when once it is ingrafted into it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Method of Grace</cite>, Sermon 2 (John 17:23), reality of the union, 2nd proof</span></figcaption>

</figure><figure class="quote" id="q-a0d64276a6" data-kw="">

<blockquote><p>Q. Did the Lord make the world in an instant? A. No, but by parts, in the space of six days, described at large by Moses, Gen. 1. … Q. What is the first degree of Christ’s exaltation? A. His resurrection the third day, whereby his soul and body by the power of the Godhead, were brought together again, and so rose again from death, appearing to his disciples for the space of forty days, 1 Cor. 15:4; Jn. 2:19; Acts 1:3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-shepard.html">Thomas Shepard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First Principles of the Oracles of God</cite>, … (d. 1649; London: Rothwel, 1655), pp. 6 &amp; 10</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1363c36e62" data-kw="">
<blockquote><p>ch. 2, ‘While some have thought all things were simultaneously made in both matter and form, others that it was through intervals of time’ Indeed, some of the holy fathers who have excellently examined the words and mysteries of God seem to have written seemingly conflicting things on this matter. Some indeed have taught that all things were created simultaneously in both matter and form, which Augustine seems to have thought. Others, however, have more strongly proved and asserted that a raw and formless prime matter, holding a mixture and confusion of the four elements, was created; yet afterward, through the intervals of six days [intervalla sex dierum], from that matter the kinds of corporeal things were formed according to their proper species. This judgment which Gregory, Jerome, Bede and many others commend and prefer, also seems to agree more closely with the Scripture of Genesis, from which the first knowledge of this matter was revealed to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-lombard.html">Peter Lombard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Four Books of Sentences 2nd</cite>, ed. (c. 1150; Florence: College of St. Bonaventura, 1916), vol. 1, bk. 2, dist. 12, ch. 2, pp. 358-59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

 rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-28d430f201" data-kw="">
<blockquote><p>Use 1. In that God did choose to make the world in this space of time, who could as easily have made it, as well in one moment, as in six days; this should teach us to take time for meditation on his works. He that could in one instant, at one word have brought forth heaven full of stars, the air full of fowls, the water full of fishes, the earth full of beasts, creeping things, trees, etc. was pleased to make several days works of this wonderful creation, and to proceed distinctly and orderly in his work: teaching us by the manner of his working only by his Word without instruments, that he could have done all at once, which now He did at several times… …few of us could say that of all the time we have spent, ever sith-hence we had the use of our understandings, in a serious meditation on God’s works, to this end that we might glorify the Maker, would not make up one week, not one six days, not so long as the Lord was in bringing them forth. Is not this a shame for man, who was made of purpose to glorify God in his works, that he should not in all his life spend so much time in meditating on the works of God, notwithstanding his dulness and sloth of apprehension, as the Lord was pleased to take in making of them, notwithstanding his omnipotency, which could have made them all in less than one minute, as easily as in a thousand years!… And what if I should say, it were expedient herein to follow the same order in considering of the Lord’s works, as the Lord Himself did in their creation; that is, to bind ourselves to do the work of the Day in its day, namely on the same day wherein each work was done, to meditate on the work of that Day?… …the Lord has been pleased, not only to let us know how many days He spent in the creation of all the whole, but also particularly and distinctly to acquaint us with his several days’ works; telling us what He did the first Day, what he did the second Day, etc. I dare boldly say, it is expedient even to tie ourselves to set apart some time in those several days for a more special view of those several works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-maynard.html">John Maynard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beauty &amp; Order of the Creation Together with Natural &amp; Allegorical Meditations on the Six Days Works of the Creation</cite>, … (d. 1665; London: T.M., 1668), ch. 2, pp. 36-40</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

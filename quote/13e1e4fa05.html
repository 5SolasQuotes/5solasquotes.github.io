<blockquote><p>Some that live in countries where none in twenty miles openly use the New one, come to Richard Baxter for counsel; he desires them to bring one of the contrary judgment and judge when they hear both: He tells them that: 1. They should keep up the New Translation as far as they can in God’s public worship, while the hurt will not be greater than the benefit. 2. That when they have no public church or worship to join with, but what uses the Old one, they should rather join with such than none, as also when they cannot have the New one without more hurt than benefit. 3. And that while they can have the New one, they should not renounce communion with the churches that use the Old one, as separating from it as unlawful, but only disown the faults of the Old one, while they disown not the communion of the churches in the use of it. The other says: 1. That it is a cursed thing to offer God a worse [worship] while we have better. 2. That we are sworn [by the SL&amp;C] against it.¹ ¹ [The SL&amp;C does not mention the KJV, but the argument is that the KJV is held (by them) to be part of the reformation, or the reforming process, that the SL&amp;C binds to.] 3. That it is false worship and obeying man before God. 4. That we [the ones who only use the New translation] do but keep our possession, which they would put us out of, and it’s they that separate from us, and not we from them. 5. That we keep to God’s Word, which is the only rule. And therefore communion with the Old Translation is unlawful, and we should rather suffer death. Baxter answers: I. (1) That it is a cursed thing to give God no public worship because we cannot have the New Translation, and to live like atheists if we cannot have what we would. None is worse than the Old. Family worship without church worship is worse than an Old Translation. (2) And that it is not we that offer God the worse before the better; it is they that exclude the better, which we protest against, having not our choice. II. That he that sware [1.] to give over all church worship unless he have the New Translation, swore wickedly like an atheist; and he that swore [2.] to communicate with no church that used the Old Translation, swore wickedly like a schismatic; and he that swore [3.] that God’s providence should never return him to a necessity of using the Old,¹ swore blasphemously, as if he could have governed the world against God. ¹ [Note that such conditions are not in the SL&amp;C. See also ‘All Vows are Qualified’ and ‘Vows can Never Bind Beyond God’s Law’.] III. That all worship is so far false as it is faulty; That to forsake all public worship when we cannot have the better translation is to be righteous, unrighteously, over much [Eccl. 7:16], and too little [righteous], and to disobey both God and man. IV. Keep your possession as long as you can without more hurt than good. I am not one that ever strove to take it from you. But do your brethren in prison enjoy public worship? You’ll say, ‘They do better. It’s easier bearing their imprisonment, poverty and death than your own.’ But what shall ten parts of the kingdom do that must have the Old Translation or none? You’ll say, ‘I suppose, they may give over all church worship as impossible and take up with family worship.’ But stay: 1. Must you not first prove the Old so bad as that no-church worship is better? Have you proved this? 2. Will not your reason prove that we must also separate from you? Have not weak ministers as bad faults as a weak translation? 3. What’s become then of your saying, ‘We had possession’? Have they possession of better that have none at all? Or will you be without all, because you had once possession of better? And will it excuse your ungodliness that you can lay the blame on them that dispossessed you? Or if they be schismatics for so using you, does it follow that you are none, if you persuade all to separate from all God’s Church worship rather than join where the Old Translation is used? V. God’s Word is the rule, but only a general rule for words, modes and circumstances. To love God and our neighbour and the unity of the Church are his greatest commands. Go learn what these mean. To violate these and forsake all Church worship, if you cannot have the best translation, is not to keep to the rule, but most grossly to violate it in the greatest commands against many Scripture admonitions which vehemently urge you to love and unity.</p></blockquote>

<blockquote><p>17. As God has not tied us to words in prayer or preaching (though he have recorded many forms in Scripture), but left all to choose what words, time and circumstances make fit (by book, or without) so the conveniences and inconveniences both of set forms and of free speaking are on each part so great and undeniable that we have no cause to censure that Church which uses both; that is, which agrees on a set form to show what the Church professes to own, if the minister should blutter out any error or indecency, and yet not restrain ministers from the due use of free speech. 18. It is a great sin out of a fond conceit of the excellency of either way above its due value to think and speak with unjust vilifying of the other way when God has tied us to neither alone: It is contrary to knowledge, love, peace and concord out of a self-conceitedness, peevishness or false prejudice received from others to think and speak worse of other men’s words in prayer than they deserve and to frighten the ignorant from lawful communion by calling that sin or false worship that is not so.</p></blockquote>

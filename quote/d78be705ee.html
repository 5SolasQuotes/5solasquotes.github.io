<main class="wrap"><figure class="quote" id="q-d78be705ee" data-kw="">
<blockquote><p>[Benedict Pictet:] Now we call goodness that affection in God, by which he is inclined to communicate himself to his creatures… The first act of God’s goodness in time is creation, and because what is produced always depends on what produces it, the second act of goodness is preservation.” (Theol. chr., II.vii.2-3; cf. Ridgely, Body of Divinity (1885), p. 109.) In this most inclusive sense, the divine goodness can be identified as benevolentia, the ‘inclination of the will to do good as far as it is possible and lawful to do so‘ or, indeed, as ‘the love of God towards his creatures’ by which he acts to ‘promote their happiness and perfection.’ (Venema, Inst. theol., VII (p. 163).) Accordingly, Scripture teaches that ‘God is love’ (1 John 4:8), that he is ‘good and upright’ (Ps. 25:8), that he takes ‘no pleasure’ in the death of his creatures (Ezek. 18:32), would have none perish (2 Pet. 3:9), and ‘will have all men to be saved‘ (1 Tim. 2:4). (Cf. Venema, Inst. theol., VII (p. 163), with Turretin, Inst. theol. elencticae, III.xx.2, 5.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, p. 509</span></figcaption>

</figure><figure class="quote" id="q-1cf9912c79" data-kw="">
<blockquote><p>…these considerations must be premised: 1. That mercy is otherwise in God than in man: in man indeed it is a grief or compassion conceived upon another’s misery: but in God it is only a propension and readiness of the divine will to help those which are in misery. 2. Mercy in God either signifies the inclination, power, faculty and property to show mercy, and this is natural in God: or the act and exercising of that property toward the creature, and this is so natural in God as yet it is directed by his will. 3. A thing is said to be natural two ways: Either that which only proceeds from the instinct of nature, as the fire naturally burns: or that whereunto nature inclines, yet not without direction of the will, as thus a man is said to speak, to understand naturally: So God is both ways naturally merciful, in Himself the first way; toward his creatures the second. Now to the arguments we answer: 1. The apostle [in Rom. 9:18] speaks not of the natural property, but of the act of mercy, which is directed by the will of God. 2. All the natural properties which are in God He always uses not, nor towards all: as his justice, power, longanimity, mercy: they are always in God, but He exercises them as it pleases Him. 3. Justice and mercy are not contrary, but cruelty is opposed to mercy: neither is there any contrariety in God, but in the effects in diverse subjects: as the Sun with the same heat mollifies the wax and hardens the clay. 4. Neither are these properties unequal in God, but the effects and acts only are unequal, as it pleases God to dispose in his freewill.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla, that is, a Six-fold Commentary upon the Most Divine Epistle of the Holy Apostle, St. Paul to the Romans</cite>, … Romans... (Lege, 1611) | on ch. 9, Places of Controversy, Controversy 12, Whether mercy be a natural property in God, or an effect only of his will, against Socinus?</span></figcaption>

<blockquote><p>This argues God’s willingness to be reconciled, that the Lord is thus pleading with you. And let me speak to everyone in this place who has felt God pleading thus with them. Know that the Lord, by this work of His, strives with you to bring you to be reconciled to Him. This is nothing other than the striving of the Spirit of God Himself with you, though perhaps you think this is troublesome to you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Reconciliation, or Christ’s Trumpet of Peace to the World</cite>, (d. 1646; 1657; Soli Deo Gloria, 1997), ch. 74, The Fourteenth Argument, pp. 316-17</span></figcaption>

</figure><figure class="quote" id="q-5592ef0e54" data-kw="">
<blockquote><p>I answer that, There is will in God, as there is intellect: since will follows upon intellect. For as natural things have actual existence by their form, so the intellect is actually intelligent by its intelligible form. Now everything has this aptitude towards its natural form, that when it has it not, it tends towards it; and when it has it, it is at rest therein. It is the same with every natural perfection, which is a natural good. This aptitude to good in things without knowledge is called natural appetite. Whence also intellectual natures have a like aptitude as apprehended through its intelligible form; so as to rest therein when possessed, and when not possessed to seek to possess it, both of which pertain to the will. Hence in every intellectual being there is will, just as in every sensible being there is animal appetite. And so there must be will in God, since there is intellect in Him. And as His intellect is His own existence, so is His will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 | quest. 19 | art. 1, Whether there is will in God</span></figcaption>

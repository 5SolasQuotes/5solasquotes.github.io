<main class="wrap"><figure class="quote" id="q-5302f036bd" data-kw="">
<blockquote><p>We observe comely circumstances in the celebration of the sacrament, but we justly condemn those who have added such things unto which they have fancied mysteries, and proper significations, and that of those effects which appertain unto the water of baptism: As though the work should be twice or thrice done, and that either nothing, or that was not sufficient which was done by divine appointment, unless human rashness should have added supply.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-60e895d05e" data-kw="">
<blockquote><p>Paybody [a Formalist] thinks kneeling in the act of receiving the communion to be expedient for the reverend using and handling of that holy sacrament, and that much reverence arises to the sacrament from it. Answer: I verily believe that more reverence arises to the sacrament from kneeling than is due to it; But I am sure there is no less true reverence of that holy sacrament among such as kneel not in the receiving of it than among such as do kneel. I hope it is not unknown how humbly and reverently many sincere Christians, with fear and trembling, do address themselves to that most holy sacrament, who yet for all the world, would not kneel in receiving it. Thus we see that these expediencies pretended for the ceremonies are attained unto as well and better without them, than by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | 2nd Part, ch. 2, ‘Against those of our Opposites, who plead for the Ceremonies as things expedient’, p. 14</span></figcaption>

</figure><figure class="quote" id="q-02ff74f216" data-kw="">
<blockquote><p>…the bishop’s own words. For he says that we kneel before the elements [of the Supper], ‘having them in our sight, or object to our senses, as ordinary signs, means, and memorials, to stir us up, to worship, etc.’ Now if we have them in our sight and before our senses for this purpose, that they may be means, signs, and memorials to stir us up to worship, then (sure) their being really before our senses is not accidental to us when we kneel. Since Dr. Burgess has been so dull and sottish as to write that ‘the signs are but accidentally before the communicants when they receive,’ he is to be ignominiously exsibilat; for making the sacred sacramental signs to be no otherwise present than the walls of the Church, the nails and timber of the material table whereupon the elements are set, or anything else accidentally before the communicants.</p></blockquote>

</figure><figure class="quote" id="q-9977fa1737" data-kw="">
<blockquote><p>They [the three friends of Daniel] expressly refuse knee-bowing [to the idol], and the reason is, because if ye bow your knee religiously to a stock, it is not in your power or free choice to stay the flux and motion of religious honor off, or from, the stock; but because religious bowing does not convey honor to the thing before which ye bow by your free will, but by God and nature’s institution, even as weeping naturally expresses sorrow, laughing, gladnesse, so does religious bowing signify religious honoring, without any act of the free choice of the worshipped intervening. It is impossible to adore God in and through an image, and give no religious reverence to the image at all; as it is impossible to hear the Word and tremble at it, and yet none of that religious trembling be bounded and terminated upon the Word, as it is impossible to kneel to the king’s ambassador conveying all and whole that civil honor to the king, but some honor must redound to the ambassador; a father cannot love the doctor for his son’s cause, but some love he must confer really upon the doctor, if not absolute, yet relative, for his son’s cause. Jacob could not kiss Joseph his son’s coat, and yet refer that whole expressed affection to Joseph and nothing at all to the coat, for then should there be no reason why he should kiss the coat rather than the skin of the beast supposed to be the devourer of his son; If therefore the communicant should kiss the sacramental bread as he bows religiously before it, as the object of his sacramental worship, which he receives, I hope it would be thought very like the kissing of the calves of Samaria, and a religious expression of love to the bread; and by the same case, religious bowing to God, by the intervening of bread, a representative object, must be an expression of religious honoring of bread, but no religious honoring by religious bowing can be expressed, but [it is] adoration of bread…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), Ch. 1; pp.147-8</span></figcaption>

<blockquote><p>4. As in serious prayer, specially in secret, the affections of the heart do utter themselves in the answerable gestures of the body, as well as in the voice and words of the mouth: so those gestures have their own speech unto God, no less than the words of the mouth have; as here, ‘I have stretched out my hands unto Thee,’ is brought forth to express his submissive rendering up of himself unto God and his dependance upon him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the Last Fifty Psalms from Ps. 100 to the End</cite>, (London, 1653), on Ps., 88:9</span></figcaption>

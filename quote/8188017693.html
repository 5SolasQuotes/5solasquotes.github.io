<blockquote><p>Article 11, ‘We are accounted righteous before God only for the Merit of our Lord and Savior Jesus Christ, and not for our own works or deservings: wherefore that we are justified by faith only, is a most wholesome doctrine, etc.’ Exposition: Though he that does righteousness is righteous, and the Scripture throughout and frequently mentions an inherent personal righteousness necessary to salvation, yet this is no universal righteousness, nor such as will justify us according to the Law of Innocency or Works; but is merely subordinate to the merit and efficacy of the sacrifice and righteousness of Christ, which only merits for us as a price, our faith being only the requisite (yet given) moral qualification for the reception of the free gift of pardon, justification and adoption, and has not the least part of the office or honor of Christ; yet are Christ’s words true, that by men’s words they shall be justified or condemned: And all men shall be judged according to their works: And James truly says that by works a man is justified, and not by faith only: Not by works of perfection or of Moses’s Law, nor any that as a price or commutation do make the reward to be of debt, and not of grace; but by a practical faith or Christianity: such acts as faith it self is, and prove our belief to be such as Christ has promised justification and salvation to; such as by justifying belief to be sincere, do justify the person against the charge of infidelity, hypocrisy, impenitence and ungodliness, Christianity is that faith which Paul opposes to works.</p></blockquote>

<blockquote><p>2. The predicate [of the verse Rom. 6:7 is], ‘is freed from sin.’ The word [for “freed”] δεδικαιωται, the Vulgar [Vulgate] has, justificatus est a peccato [is justified from sin]: Beza, with many of the ancients, liberatus est [is liberated]. Our translation has both in the text, “freed,” in the margin, “justified”. Whether you take one or the other word, it imports deliverance from the yoke and dominion of sin, so as not to obey its motions and commands. For the apostle does not speak here of the forgiveness of sin, but the abolition of its power and dominion; for it is brought as a reason why those whose old man is crucified with Christ should not serve sin; and the word “justified” is the rather used, because one justified and absolved by his judge, is also released and set free from his bonds; so are we. … I. The nature of this freedom from sin. I told you before, it is an exemption from the dominion and reign of sin. 1. We quit the evil disposition and temper of our souls… 2. We renounce our former course of living, after the habits we are free from the acts, we do not, and durst not to live in sin, the former conversation [conduct] is cast off as well as the former lusts… Now this freedom is expressed by a word that signifies justification, and fitly: 1. Because of the nature of justification, in which there are two branches; liberatio a poena [liberation from punishment], and acceptatio ad vitam [acceptance to life]. The punishment incurred by the Fall is poena damni and poena sensus, the loss and the pain: Both may be considered as in this life, or the life to come… But in this life we must also consider the loss and pain. The pains are all those miseries and afflictive evils, which came into the world by reason of sin. The loss is loss of God’s image: that threatening, ‘Thou shalt die the death,’ Gen. 2:17, implied spiritual death as well as temporal and eternal. Now we are justified when we are freed from punishment, and among other punishments from the punishment of loss, when God giveth us the blessing, which sin had deprived us of: As for instance, when He gives us the sanctifying Spirit [Rom. 5:5], this is called a receiving the atonement, Rom. 5:11. We had forfeited it by sin, and God being pacified in Christ, does restore it to us. Man brought upon himself spiritual death by sin, and the gift of the sanctifying Spirit is the great and first act of God’s pardoning mercy, and a means to qualify us for other parts of pardon. Though the thing be plain of itself, yet to make it more clear to us: 2. Let us distinguish of the kinds of justification. There is a twofold justification, it is either constitutive or executive. First, constitutive justification is by the new Covenant, when those who submit to the terms are constituted or made righteous: Jn. 5:24, ‘He that hears my word, and believes in Him that sent Me, has everlasting life, and shall not come into condemnation; but is passed from death to life.’ There is God’s grant, and whosoever can make good his claim, has a right to justification by God’s own grant, according to the law of grace, he is one freed from sin. Secondly, executive, when God accordingly takes off all penalties and evils, and gives us all the good which belongs to the righteous or justified: as in the case in hand, when God gives us the Spirit to break the power and reign of sin: And therefore so often in Scripture is God said to sanctify us as a God of peace, or as a God pacified and reconciled to us in Jesus Christ: Heb. 13:20-21, ‘Now the God of peace that brought again from the dead our Lord Jesus, that great Shepherd of the sheep, through the blood of the everlasting covenant, make you perfect in every good work to do his will, working in you that which is well-pleasing in his sight.’ 1 Thess. 5:23, ‘And the very God of peace sanctify ye wholly, etc.’ 2 Cor. 5:18, ‘And all things are of God, who hath reconciled us to Himself by Jesus Christ.’ This God does as a Judge, acting according to the rules of government constituted in the new Covenant, upon the account of the merit of Christ, and our actual interest in Him. II. As to the degree, how far we are freed from sin. 1. All the justified and converted to God are freed from the Reign of it. The flesh, though it remaineth, is made subject to the Spirit, which by degrees doth destroy the reliques of sin: For it is said of the justified, Rom. 8.1. There is no condemnation to them that are in Christ Jesus, who walk not after the flesh, but after the Spirit. 2. The more obedient we are to the motions of the sanctifying Spirit, the more power we have against sin: Gal. 5.18. If ye be led by the Spirit, ye are not under the Law, under the irritating Power and Curse of it. Many sins are in a great measure left uncured as a part of our punishment. … 4. Where the work is really begun and duly submitted unto, we have hopes of a better estate, it still increases towards that perfect blessedness, when we shall be without spot and blemish, or any such thing, Eph. 5:27. What a life do God’s holy ones live in Heaven, who are wholly freed from sin?… There is none in Heaven by the first Covenant [of Words]; all that are there come thither as sanctified and justified by Jesus Christ, and in the way of his pardoning grace. Surely since we have the same Redeemer, depend upon the merit of the same sacrifice, and wait for the same Spirit in the use of all holy means and endeavours, He will not be strange to us… … IV. How is it a consequent of our dying with Christ?… … 2. It is his privilege, being crucified with Christ; he has a right, and not a right only, but his justification is executed and applied to him by the gift of the sanctifying Spirit, which is the surest token of God’s love, and the true effect of his approbation… … Use 1. To inform us of the intimate connection between all the parts and branches of the grace of the Gospel. We are absolved and discharged from the power of sin as well as from the guilt of it. All will grant that justification respects the guilt of sin; but the apostle tells us here that justification respects the power of sin also. The penalty was the loss of God’s image as well as of his favor: so that pardon is executed and applied when our natures are sanctified and healed. The privation of the Spirit being the great punishment, the gift of the Spirit is a great branch of our absolution, and so Christ’s reconciling and renewing grace fairly accord and agree.</p></blockquote>

+Fall+is+poena+damni+and+poena+sensus%2C+the+loss+and+the+pain%3A+Both+may+be+considered+as+in+this+life%2C+or+the+life+to+come%E2%80%A6+But+in+this+life+we+must+also+consider+the+loss+and+pain.+The+pains+are+all+those+miseries+and+afflictive+evils%2C+which+came+into+the+world+by+reason+of+sin.+The+loss+is+loss+of+God%E2%80%99s+image%3A+that+threatening%2C+%E2%80%98Thou+shalt+die+the+death%2C%E2%80%99+Gen.+2%3A17%2C+implied+spiritual+death+as+well+as+temporal+and+eternal.+Now+we+are+justified+when+we+are+freed+from+punishment%2C+and+among+other+punishments+from+the+punishment+of+loss%2C+when+God+giveth+us+the+blessing%2C+which+sin+had+deprived+us+of%3A+As+for+instance%2C+when+He+gives+us+the+sanctifying+Spirit+%5BRom.+5%3A5%5D%2C+this+is+called+a+receiving+the+atonement%2C+Rom.+5%3A11.+We+had+forfeited+it+by+sin%2C+and+God+being+pacified+in+Christ%2C+does+restore+it+to+us.+Man+brought+upon+himself+spiritual+death+by+sin%2C+and+the+gift+of+the+sanctifying+Spirit+is+the+great+and+first+act+of+God%E2%80%99s+pardoning+mercy%2C+and+a+means+to+qualify+us+for+other+parts+of+pardon.+Though+the+thing+be+plain+of+itself%2C+yet+to+make+it+more+clear+to+us%3A+2.+Let+us+distinguish+of+the+kinds+of+justification.+There+is+a+twofold+justification%2C+it+is+either+constitutive+or+executive.+First%2C+constitutive+justification+is+by+the+new+Covenant%2C+when+those+who+submit+to+the+terms+are+constituted+or+made+righteous%3A+Jn.+5%3A24%2C+%E2%80%98He+that+hears+my+word%2C+and+believes+in+Him+that+sent+Me%2C+has+everlasting+life%2C+and+shall+not+come+into+condemnation%3B+but+is+passed+from+death+to+life.%E2%80%99+There+is+God%E2%80%99s+grant%2C+and+whosoever+can+make+good+his+claim%2C+has+a+right+to+justification+by+God%E2%80%99s+own+grant%2C+according+to+the+law+of+grace%2C+he+is+one+freed+from+sin.+Secondly%2C+executive%2C+when+God+accordingly+takes+off+all+penalties+and+evils%2C+and+gives+us+all+the+good+which+belongs+to+the+righteous+or+justified%3A+as+in+the+case+in+hand%2C+when+God+gives+us+the+Spirit+to+break+the+power+and+reign+of+sin%3A+And+therefore+so+often+in+Scripture+is+God+said+to+sanctify+us+as+a+God+of+peace%2C+or+as+a+God+pacified+and+reconciled+to+us+in+Jesus+Christ%3A+Heb.+13%3A20-21%2C+%E2%80%98Now+the+God+of+peace+that+brought+again+from+the+dead+our+Lord+Jesus%2C+that+great+Shepherd+of+the+sheep%2C+through+the+blood+of+the+everlasting+covenant%2C+make+you+perfect+in+every+good+work+to+do+his+will%2C+working+in+you+that+which+is+well-pleasing+in+his+sight.%E2%80%99+1+Thess.+5%3A23%2C+%E2%80%98And+the+very+God+of+peace+sanctify+ye+wholly%2C+etc.%E2%80%99+2+Cor.+5%3A18%2C+%E2%80%98And+all+things+are+of+God%2C+who+hath+reconciled+us+to+Himself+by+Jesus+Christ.%E2%80%99+This+God+does+as+a+Judge%2C+acting+according+to+the+rules+of+government+constituted+in+the+new+Covenant%2C+upon+the+account+of+the+merit+of+Christ%2C+and+our+actual+interest+in+Him.+II.+As+to+the+degree%2C+how+far+we+are+freed+from+sin.+1.+All+the+justified+and+converted+to+God+are+freed+from+the+Reign+of+it.+The+flesh%2C+though+it+remaineth%2C+is+made+subject+to+the+Spirit%2C+which+by+degrees+doth+destroy+the+reliques+of+sin%3A+For+it+is+said+of+the+justified%2C+Rom.+8.1.+There+is+no+condemnation+to+them+that+are+in+Christ+Jesus%2C+who+walk+not+after+the+flesh%2C+but+after+the+Spirit.+2.+The+more+obedient+we+are+to+the+motions+of+the+sanctifying+Spirit%2C+the+more+power+we+have+against+sin%3A+Gal.+5.18.+If+ye+be+led+by+the+Spirit%2C+ye+are+not+under+the+Law%2C+under+the+irritating+Power+and+Curse+of+it.+Many+sins+are+in+a+great+measure+left+uncured+as+a+part+of+our+punishment.+%E2%80%A6+4.+Where+the+work+is+really+begun+and+duly+submitted+unto%2C+we+have+hopes+of+a+better+estate%2C+it+still+increases+towards+that+perfect+blessedness%2C+when+we+shall+be+without+spot+and+blemish%2C+or+any+such+thing%2C+Eph.+5%3A27.+What+a+life+do+God%E2%80%99s+holy+ones+live+in+Heaven%2C+who+are+wholly+freed+from+sin%3F%E2%80%A6+There+is+none+in+Heaven+by+the+first+Covenant+%5Bof+Words%5D%3B+all+that+are+there+come+thither+as+sanctified+and+justified+by+Jesus+Christ%2C+and+in+the+way+of+his+pardoning+grace.+Surely+since+we+have+the+same+Redeemer%2C+depend+upon+the+merit+of+the+same+sacrifice%2C+and+wait+for+the+same+Spirit+in+the+use+of+all+holy+means+and+endeavours%2C+He+will+not+be+strange+to+us%E2%80%A6+%E2%80%A6+IV.+How+is+it+a+consequent+of+our+dying+with+Christ%3F%E2%80%A6+%E2%80%A6+2.+It+is+his+privilege%2C+being+crucified+with+Christ%3B+he+has+a+right%2C+and+not+a+right+only%2C+but+his+justification+is+executed+and+applied+to+him+by+the+gift+of+the+sanctifying+Spirit%2C+which+is+the+surest+token+of+God%E2%80%99s+love%2C+and+the+true+effect+of+his+approbation%E2%80%A6+%E2%80%A6+Use+1.+To+inform+us+of+the+intimate+connection+between+all+the+parts+and+branches+of+the+grace+of+the+Gospel.+We+are+absolved+and+discharged+from+the+power+of+sin+as+well+as+from+the+guilt+of+it.+All+will+grant+that+justification+respects+the+guilt+of+sin%3B+but+the+apostle+tells+us+here+that+justification+respects+the+power+of+sin+also.+The+penalty+was+the+loss+of+God%E2%80%99s+image+as+well+as+of+his+favor%3A+so+that+pardon+is+executed+and+applied+when+our+natures+are+sanctified+and+healed.+The+privation+of+the+Spirit+being+the+great+punishment%2C+the+gift+of+the+Spirit+is+a+great+branch+of+our+absolution%2C+and+so+Christ%E2%80%99s+reconciling+and+renewing+grace+fairly+accord+and+agree.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Second+Volume+of+Sermons%E2%80%A6+%28d.+1677%3B+London%3A+Astwood%2C+1684%29+%7C+Sermons+on+Rom.+6%2C+Sermon+6%2C+pp.+36-41+on+Rom.+6%3A7%2C+%E2%80%9CFor+he+that+is+dead+is+freed+%5B%CE%B4%CE%B5%CE%B4%CE%B9%CE%BA%CE%B1%CE%B9%CF%89%CF%84%CE%B1%CE%B9%2C+justified%5D+from+sin.%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fae8014cdae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ae8014cdae.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=2.%20The%20predicate%20%5Bof%20the%20verse,renewing%20grace%20fairly%20accord%20and%20agree&amp;text=2.%20The%20predicate%20%5Bof%20the%20verse%20Rom.%206%3A7&amp;text=reconciling%20and%20renewing%20grace%20fairly%20accord%20and%20agree" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>[On Rom. 5:17, 19] And here some one may enquire what this gift of justice is which flows to us from Christ our head?… Of this gift the apostle thus speaks; ‘For if by the offence of one man, etc.’ by which words St. Paul declares that, through the merit and good work of the second Adam, many receive the gift of justice and life, as through the sin of the first Adam his posterity had contracted hurt and death. But what other thing could this gift have been but the gift of the Holy Ghost, who should bring both justice and life to those who are endowed with Him.</p></blockquote>

</figure><figure class="quote" id="q-4e82b1b8ef" data-kw="">
<blockquote><p>…once vile sinners, now washed, sanctified and justified: as soon as they believe, they are put into a state of acceptation [Greek], that is, justifying, He continues to justify them unto the death, and He keeps them in that estate wherein they have exemption from the punishment of sin and a right to eternal life… All these things concur to our justification and do not contradict, but imply one another: The first moving cause of all is grace; the meritorious cause, is Christ’s blood: the means of applying, or the condition on our part upon which we are capable at first of receiving so great a privilege, is faith: and the means of continuing in our justified estate, is by good works, or new obedience. I say, our first actual pardon, justification, and right to life, is given upon condition of our first faith and repentance; but this estate is continued to us both by faith, Rom. 1:17 and new obedience; these fairly accord. The grace of God will do nothing without the intervention of Christ’s merits; and Christ’s merits do not profit us ’till it be applied by faith; and sound believers will live in a course of new obedience.</p></blockquote>

%20obedience&amp;text=once%20vile%20sinners%2C%20now%20washed%2C%20sanctified%20and%20justified&amp;text=will%20live%20in%20a%20course%20of%20new%20obedience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d46ead5565" data-kw="">
<blockquote><p>When the world was lost by the one sin of Adam, the grace of Christ has not only abolished this sin and the death which it introduced, but also has at the same time taken away those endless sins… and brought as many as are of Christ into full justification; so that God has now not only forgiven them the sins both of Adam and of themselves, etc., but has at the same time given his Spirit of solid and perfect justice, to conform us to the image of the First-begotten. ‘Justification’ here occurs, which, as it is opposed to ‘condemnation,’ so it signifies properly that justification by which God absolves from all sins those that are Christ’s… and because he means a full justification, the perfect bestowal of justice is also contained in this justification; for it [justification] will then at length be consummated when along with sin, the last enemy, death, shall also have been destroyed, and the saints shall have been filled with every fruit of justice.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“When the world was lost by the one sin of Adam, the grace of Christ has not only abolished this sin and the death which it introduced, but also has at the same time taken away those endless sins… and brought as many as are of Christ into full justification; so that God has now not only forgiven them the sins both of Adam and of themselves, etc., but has at the same time given his Spirit of solid and perfect justice, to conform us to the image of the First-begotten. ‘Justification’ here occurs, which, as it is opposed to ‘condemnation,’ so it signifies properly that justification by which God absolves from all sins those that are Christ’s… and because he means a full justification, the perfect bestowal of justice is also contained in this justification; for it [justification] will then at length be consummated when along with sin, the last enemy, death, shall also have been destroyed, and the saints shall have been filled with every fruit of justice.”

— Martin Bucer, in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, pp. 157-59 | On Rom. 5:16, Observation 3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+the+world+was+lost+by+the+one+sin+of+Adam%2C+the+grace+of+Christ+has+not+only+abolished+this+sin+and+the+death+which+it+introduced%2C+but+also+has+at+the+same+time+taken+away+those+endless+sins%E2%80%A6+and+brought+as+many+as+are+of+Christ+into+full+justification%3B+so+that+God+has+now+not+only+forgiven+them+the+sins+both+of+Adam+and+of+themselves%2C+etc.%2C+but+has+at+the+same+time+given+his+Spirit+of+solid+and+perfect+justice%2C+to+conform+us+to+the+image+of+the+First-begotten.+%E2%80%98Justification%E2%80%99+here+occurs%2C+which%2C+as+it+is+opposed+to+%E2%80%98condemnation%2C%E2%80%99+so+it+signifies+properly+that+justification+by+which+God+absolves+from+all+sins+those+that+are+Christ%E2%80%99s%E2%80%A6+and+because+he+means+a+full+justification%2C+the+perfect+bestowal+of+justice+is+also+contained+in+this+justification%3B+for+it+%5Bjustification%5D+will+then+at+length+be+consummated+when+along+with+sin%2C+the+last+enemy%2C+death%2C+shall+also+have+been+destroyed%2C+and+the+saints+shall+have+been+filled+with+every+fruit+of+justice.%E2%80%9D%0A%0A%E2%80%94+Martin+Bucer%2C+in+William+Forbes%2C+Considerationes+Modestae+et+Pacificae+Controversiarum+de+Justificatione...+4th+ed.+%28d.+1634%3B+1658%3B+Oxford%3A+Parker%2C+1850%29%2C+vol.+1%2C+bk.+2%2C+ch.+4%2C+pp.+157-59+%7C+On+Rom.+5%3A16%2C+Observation+3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd46ead5565.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d46ead5565.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=When%20the%20world%20was%20lost%20by,filled%20with%20every%20fruit%20of%20justice&amp;text=Whe

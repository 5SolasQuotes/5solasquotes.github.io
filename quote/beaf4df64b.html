<main class="wrap"><figure class="quote" id="q-beaf4df64b" data-kw="">
<blockquote><p>A purity spiral is a theory which argues for the existence of a form of groupthink in which it becomes more beneficial to hold certain views than to not hold them, and more extreme views are rewarded while expressing doubt, nuance, or moderation is punished (a process sometimes called “moral outbidding”). It is argued that this feedback loop leads to members competing to demonstrate the zealotry or purity of their views. A purity spiral is argued to occur when a community’s primary focus becomes implementing a single value that has no upper limit, and where that value does not have an agreed interpretation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wikipedia.html">Wikipedia</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Purity Spiral” 12-2025</cite></span></figcaption>

</figure><figure class="quote" id="q-00ec4eb6e3" data-kw="">

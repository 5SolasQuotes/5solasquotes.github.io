<blockquote><p>In general, Wittich tried to refute Spinoza’s monism by mobilizing Cartesian principles, which is particularly perspicuous in his discussion of God’s being. However, once he turned to the issue of the divine will, he openly contradicted Descartes’ teaching and approached Spinoza’s necessitarianism. He chose to do so to remain orthodox, evading the accusation of Socinian heresy, which the conservative theologian Petrus van Mastricht had made against his Theologia pacifica (1671). This paper concludes that the widespread fear concerning Socinianism deeply conditioned the way theologians reacted to the Cartesian philosophy in the Netherlands in the late seventeenth century.” – Abstract Sangiacomo, Andrea – ‘Divine Action &amp; God’s Immutability: a Historical Case Study on how to Resist Occasionalism’ European Journal of Philosophy of Religion, 7/4 (Summer 2015), pp. 115-135 Sangiacomo is an associate professor at the faculty of philosophy at the University of Groningen (NL). Abstract: “Today’s debates present ‘occasionalism’ as the position that any satisfying account of divine action must avoid. In this paper I discuss how a leading [French] Cartesian author of the end of the seventeenth century, Pierre-Sylvain Régis [1632–1707], attempted to avoid occasionalism. Régis’s case is illuminating because it stresses both the difficulties connected with the traditional alternatives to occasionalism (so-called ‘concurrentism’ and ‘mere-conservationism’) and also those aspects embedded in the occasionalist position that should be taken into due account. The paper focuses on Régis’s own account of secondary causation in order to show how the challenge of avoiding occasionalism can lead to the development of new accounts of divine action.</p></blockquote>

<blockquote><p>How wrongly most of the Scholastic authors have thought concerning original sin can be obscure to no one who is moderately versed in their books. Nor have they recently imbibed this error of opinion, but they have retained it as drawn from ancient times and masters. For Lombard, who has held the first place in the school for now five hundred years, testifies that certain theologians before him taught that original sin is nothing but the guilt of punishment for the sin of the first man, by which his posterity are liable and subject to temporal and eternal punishment for the actual sin of Adam, so that it is neither a fault nor a punishment (Lombard, dist. 30, ch. 5). And although he not obscurely signifies that so insane an opinion is displeasing to him, he was nevertheless unable to persuade his disciples from being devolved into the same or a greater absurdity of opinion. For Scotus did not fear to affirm that after any sin whatsoever has been committed, nothing remains in us except the guilt of punishment (Scotus, in 2, d. 34, q. 1, art. 2). And Biel, a blind man, follows this blind man (Biel in 2, d. 30, q. 1). But if nothing inhered in Adam after the fall except the guilt of punishment, certainly not a fault, but a bare guilt, passed to his posterity by propagation. Durandus also makes original sin nothing other than mere guilt, when he disputes that Adam’s will is considered ours in no other way than because Adam, by sinning voluntarily, brought destruction and the privation of original justice upon us all; wherefore he denies that this sin ought to be called a fault (Durandus, in 2, d. 30, q. 2). William, Bishop of Paris, also taught this, when he proceeded so far as to defend that this natural vice is worthy of no punishment (Wilhelmus Paris, De vitiis et peccat.). Ockham professes that he would have gone into that opinion which posits that original sin is nothing but divine non-acceptance on account of some preceding demerit in another, if he were not prohibited by the authorities of certain fathers, which seemed to him to say that original fault is the lack of justice that ought to be present (Occamus, in 2, q. 14). Thus for this man, original sin would be only the non-acceptance of God on account of Adam’s offense, if he did not wish to seem to depart from the diverse opinion of the saints. Are these men ever to be thought to have even dreamed of the contagion and magnitude of original sin?</p></blockquote>

<blockquote><p>5. …And certainly, the nature of first principles requires that they not be proven, but taken for granted. 6. That habit or natural intellectual power (…since the natural power of the intellect itself, both practical and speculative, suffices [for the innate knowledge of God]; which is to establish its necessity with Thomas Aquinas in his 1st book of the Sentences, dist. 21, ad 1) comprehends the truth of principles immediately, without reasoning or proof, by a kind of simple intuition. It grasps partly theoretical principles and partly practical ones. Among the particular theoretical first principles, I place first and formost: ‘God exists’; and among the practical first principles, first and foremost: ‘God ought to be worshipped.&#x27;</p></blockquote>

<blockquote><p>1. Concerning metaphysics to be produced by the Reformed, long before me the most learned men from all sides have thought much; and who, if even the least leisure had been theirs from their affair, would here easily have borne off the prize. [William] Twisse pities the fate of Christianity that until now the students of our [reformed] academies have used no other instructors but Jesuits: and they hope to be able to aspire to the arduous progress of things where it lies open by natural light by such masters. Yet who would have been more fit than him to undertake this labor for the sake of the theological youth? Who would have more suitably cleansed that Augean stable of the Jesuits; and thus through natural reason would have paved for us the royal way to the innermost parts of sacred theology? lest the enemies of the Orthodox religion through first philosophy, defiled and polluted by them, should make a straight attack on pure and sacred theology. But that most famous man has departed; and what others would have not undeservedly demanded from him, he in vain desired in others. Must therefore so great a work be put off to the coming of Elijah or of Christ the Savior? Not indeed. Provision must especially be made for those who will one day propose the mysteries of God to the people. Provision must be made as quickly as possible, lest like the Israelites the students be perpetually compelled to borrow arms from the Philistines, the enemies of divine truth. I designate the writings of the Jesuits, which certainly are not traversed safely enough by studious youth, because they prepare the way to Pelagianism, Skepticism, Libertinism and many other things.</p></blockquote>

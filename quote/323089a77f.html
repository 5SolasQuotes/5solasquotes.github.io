<blockquote><p>7. The Nature of Natural Law – A law is natural and common if common reason produces it for the common necessity and welfare of human social life in general. Therefore, it is called natural law.

8. The Nature of Civil Law – A law is civil or individual if individual right reason introduces and establishes it because of the necessity and welfare of the social life of some specific place. Therefore, it is called individual law or the civil law of some place. …

11. Common Law – Therefore, common law is that which has been inscribed on human hearts by nature or by God from birth and that by which human beings are moved either to act or avoid actions, whichever is sufficient for preserving the common good of human society, convicts wrongdoers of evil, or excuses the innocent.

12. The Knowledge of and Tendency toward Natural Law in Human Beings – Thus, there is a knowledge and natural inclination for this law in the human heart. Because of it, a person knows what is just and is urged by the hidden impulse of nature to do what is just and to not do what is unjust.

13. Different terms for Natural Law – This law is designated with different names. Sometimes it is called natural law. Other times, it is called the law of nature. It is also called natural reason, the silent law, the law that nature provides to the human race, the rule or law of God, or the immutable law.

14. Where the Foundations of Law Lie – Moreover, God teaches and inscribes on human hearts general principles of fairness and justice and unfairness and injustice; he binds, urges, and incites all people either to do or avoid these things; and by means of their internal consciences he accuses those who fail in these things and excuses those who do them. Therefore, he urges people toward good and calls them back from evil. If someone follows his leading to good, that person is excused. Whoever does not, he accuses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-althusius.html">Johannes Althusius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dicaeologicae libri tres, totum et universum Jus</cite>, (1618), 1.13.7-8, 11-14 in On Law and Power, trans. Jeffrey J. Veenstra (Grand Rapids MI: Christian’s Library Press, 2013), pp 8-9.</span></figcaption>

<blockquote><p>Neither, however, do we think ourselves bound to teach that God could not forbid sin but under the penalty of eternal death; for we hold that not one or another kind of punishment is necessary, but that punishment itself is necessary, and the punishment, according to the rule of God’s wisdom and justice, is death. Moreover, a rational creature, conscious of its proper subjection and obediential dependence, being created and existing, God did not account it at all necessary to forbid it to sin by a free act of his will, under one penalty or another; for both these follow from the very situation of the creature, and the order of dependence,–namely, that it should not transgress by withdrawing itself from the right and dominion of the Creator, and if it should transgress, that it should be obnoxious and exposed to coercion and punishment. But it being supposed that God should forbid sin by an external legislation, the appointment of punishment, even though there should be no mention made of it, must be coequal with the prohibition. …The modification of punishment respects either its appointment or infliction. Punishment itself is considered either in respect of its general end, which is the punishment of transgression, and has a regard to the condition of the creatures with respect to God; or in respect of some special end, and has a respect to the condition of the creatures among themselves. But whatever modification punishment may undergo, provided it attain its proper end, by accomplishing the object in view, the nature of punishment is preserved no less than if numberless degrees were added to it. As to the establishment of punishment, then, in a human court, as it has not primarily and properly a respect to the punishment of transgression, nor a regard to the condition of the creatures with respect to God, but with respect to one another, that degree of punishment is just which is fit and proper for accomplishing the proposed end. The punishment, then, of theft by a quadruple restitution had in its appointment no such modification conjoined with it as could render it unfit and improper in respect of the end proposed, among that people to whom that law concerning retributions was given; but as the infliction of punishment, according to the sentence of the law, depended on the supreme Ruler of that people, it belonged to him to provide that no temporal dispensation with punishment exercised by him, in right of his dominion, should turn out to the injury of the commonwealth. …But not even in a human court can any such modification be admitted as would render the punishment useless in respect of its end; nor, in respect of God, do we think any degree or mode of punishment necessary, but such as may answer the end of the punishment, so far as respects the state of the creatures with respect to God…</p></blockquote>

<blockquote><p>VII. But the orthodox speak far differently. They affirm that there is a natural law, not arising from a voluntary contract or law of society, but from a divine obligation being impressed by God upon the conscience of man in his very creation, on which the difference between right and wrong is founded and which contains the practical principles of immovable truth (such as: “God should be worshipped,” “parents honoured,” “we should live virtuously,” “injure no one,” “do to others what we would wish them to do to us” and the like).

Also that so many remains and evidences of this law are still left in our nature (although it has been in different ways corrupted and obscured by sin) that there is no mortal who cannot feel its force either more or less. Now they wish this law to be called natural, not because it has its origin from bare nature (since it depends upon God the supreme lawgiver), but because it becomes known from the aspect of creatures and the relation of man to God, and the knowledge of it is impressed upon the mind by nature, not acquired by tradition or instruction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.1.7.</span></figcaption>

<blockquote><p>It is an indispensable duty to forgive; we are not bound to trust an enemy, but we are bound to forgive him… It is with going to law as it is with going to war; when the just rights of a nation are invaded, it is lawful to go to war; so when a man’s estate is trespassed upon by another, he may go to law to recover it. But the law must be used in the last place; when no entreaties or arbitrations will prevail, then the chancery must decide it. Yet this is no revenge, it is not so much to injure another, as to right one’s self, which may be, and yet we may live in charity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord’s Prayer</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“It is an indispensable duty to forgive; we are not bound to trust an enemy, but we are bound to forgive him… It is with going to law as it is with going to war; when the just rights of a nation are invaded, it is lawful to go to war; so when a man’s estate is trespassed upon by another, he may go to law to recover it. But the law must be used in the last place; when no entreaties or arbitrations will prevail, then the chancery must decide it. Yet this is no revenge, it is not so much to injure another, as to right one’s self, which may be, and yet we may live in charity.”

<blockquote><p>Assertion 4. There may be some cases in which it is expedient to admit an accuser, and not to admit a process without one. As suppose one were under no ill report and yet some gross scandal were imputed to him, which were not of such fame, or had not such presumptions as to give ground for a Church-judicatory immediately to interpose, and the scandal being of such a nature as the trial thereof could neither be omitted, nor closed in private; in that case, suppose one should complain of the Church’s negligence in the same, asserting the evidences to be clear, and offering to make them out; In such a case, I say, the Church can hardly refuse to hear him, lest they be thought partial; nor is there ground, nor is it fit for them immediately to pursue it: Therefore an accuser is expedient, that so, upon the one side, the Church’s impartiality may be vindicated in refusing the complaint of no sober man, nor the uttermost of any trial, that in well grounded reason they may expect; And, on the other side, that the mouths of some needless and too importunate complainers may be stopped, and they themselves found censurable, if either without cause they traduce the Church-officers as negligent and partial, while there is access to make out before them such a truth if it be truth; or if precipitantly and inconsiderately (if not maliciously) they have tabled a scandal against another as a public scandal which they cannot make out, and so have needlessly troubled a Church-judicatory in such a matter and sinfully wronged their neighbor. For, a process in such cases where it cannot be made out, is scandalous: therefore if a person rest not satisfied so as to abstain till he have trial put to the utmost, he is to be dealt with as a scandalous person, lest men take liberty, under the pretext of pursuing offences, to defame others and abuse the ordinance of Christ. And though it be just in such a case, that he be materially dealt with as unjust accusers use to be in civil courts, yet this does not only flow from the consideration of such a persons being a formal accuser, but from the nature of the deed which is scandalous in such a measure, and that publicly, and therefore is to be restrained, whether the person take on him that formal consideration or not, lest yet, upon the matter, he continue publicly and importunately to press the pursuit. And we conceive, the imposing the title of accuser in such a case, or the making of it necessary, that one take on him that formal notion, is rather for conveniency to restrain men’s inordinateness and stop their mouths, and to add weight to the matter of the sentence if they fail, than as being simply necessary for making such a person to be accounted scandalous, if he come short.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5f064b23ae" data-kw="">
<blockquote><p>There are several cases in which separation from the Church of England is sinful, as: 1. If any separate as the Papists do, because they are against sound doctrine or any good that is in the Church. 2. If any renounce communion with all the parish-churches under the name of the Church of England. 3. If any renounce communion with the Church of England as it is a Christian kingdom, headed by one Christian protestant king. 4. If they renounce communion with the Church of England as it is called one from the association or concord of its pastors or Church governors. 5. If any renounce communion with faulty bishops or worship, or discipline, simply and absolutely, and not only secundum quid [according to what; that is in a qualified manner], and so forsake the good that is in them for the sake of the evil. In a word, 1. all that separate for a wrong cause, 2. or further than they separate from Christ, or than Christ would have them separate, do sin. 2. But they that renounce any corruption as such, and the Church no further than secundum quid [according to that], as it is faulty, do well: For we must so renounce the faults of all Churches and Christians in the world (and our own first), but not the Churches and Christians for any tolerable faults, so that we commit no sin ourselves, which they impose as the condition of their communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen (1684; RBO, 2024)</cite>, p. 85</span></figcaption>

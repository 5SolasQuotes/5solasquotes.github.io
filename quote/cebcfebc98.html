<blockquote><p>Of CHRIST.

This is the sum of that Doctrine which we have concerning GOD. The other followeth, concerning Emanuel, GOD with us. Emanuel (GOD with us) is in one Person, the Son of GOD, and very Man, conceived of a Virgin by the Holy GHOST: Who is also CHRIST, or Anointed; called of his Father, ever since the Fall of Adam, to be a Mediator between GOD and Man; of a Covenant, to save through Faith in him (that is, by apprehending of the Covenant) certain few Men, whom GOD his Father hath chosen from Eternity, and given unto him, to set forth in them the praise of his Mercy.

This Covenant is called the Covenant of Grace: And ratified by the Death of Him that made it, hath also the Name of a Testament. Being always one and the same in substance, it is nevertheless distinguished, or distinctly to be considered in the Old and the New Testament. The Old Testament was the Covenant, through CHRIST to come. The New Testament, is the Covenant, through CHRIST already come; JESUS, the Son of Marie.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Sacred Divinity Briefly &amp; Methodically Propounded: More Largely &amp; Clearly Handled and Explained</cite>, (London: William Stansby, [1625]), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>Chapter 11 – Seeing it is not possible that the reprobate should receive this grace and live, and also seeing this is infallibly foreseen of God; and again, seeing God has fore-determined to suffer it so to be: Why does He yet will and command that the Gospel, and so grace in the general tenders [offers] thereof, should be proffered unto them? That God is willing to save even those that perish forever, is apparent, both from the consideration of the goodness of his nature, of man’s being his creature, and indeed in a miserable state. But I say, as I have also said already, there is a great difference between his being willing to save them, through their complying with these his reasonable terms, and his being resolved to save them, whether they, as men, will close therewith, or no: So only He saves the elect themselves, even according to the riches of his Grace, even according to his riches in glory, by Christ Jesus working effectually in them what the Gospel, as a condition, calls for from them.</p></blockquote>

</figure><figure class="quote" id="q-1609803b37" data-kw="">
<blockquote><p>Further, The inclination of thy heart towards fruitless and unprofitable creatures does fore-preach to thee the inclination of the heart of God towards thee in the Judgment: If thou hast either cow or any other beast that is now unprofitable to thee, though thou mayst suffer them for some time to be with thee, as God suffers sinners in the world, yet all this while thy heart is not with them, but thou wilt take thy time to clear thy hands of them. Why, just so shall thy judgment be as God says, ‘Though Moses and Samuel stood before Me,’ that is, to pray Me to spare this people, ‘yet my heart could not be towards them; therefore cast them out of my sight and let them go forth.’ Jer. 15:1; Eze. 14:13-14.</p></blockquote>

</figure><figure class="quote" id="q-ab070bda2a" data-kw="">
<blockquote><p>Highly prize and frequent All the Means of Grace in Public and Private God’s Ordinances are his Sacred Channels wherein alone in ordinary, his streams of grace do flow. How did David exult in the enjoyment of them! How did he lament in the want of them! Christians ought to observe all Christ’s Commandments and Ordinances.

They must not forsake the Assembling of themselves together, as the manner of some is, O blessed is that people that know the joyful sound! The New Covenant, and the Administrations thereof are to continue till the end of this world: and therefore they ought still to be attended upon by all God’s New Covenant People.</p></blockquote>

</figure><figure class="quote" id="q-9e10921dfd" data-kw="">
<blockquote><p>I. How God delights not in the death of a sinner… If God has more pleasure in the conversion of sinners than their destruction, why are there not more converted than we find to be? The greatest part of mankind are perishing in their unbelief and impenitency. Answer: (1) I might answer, that this text speaks not absolutely, but comparatively. God rejoices in the execution of his justice, as well as in all his other works; but if you compare things with things, He rejoices rather in acts of mercy than in acts of vengeance. His disposition inclines Him to mercy rather than to wrath: ‘Mercy pleases Him,’ Mic. 7:18; and mercy rejoices over judgment in the conflict. Justice is alienum opus, ‘his strange work,’ Isa. 28:21; Lam. 3:33, ‘He does not afflict willingly, nor grieve the children of men;’ not with his heart. Mercy, like live honey, drops of its own accord. He is forced to the other [judgment]; it [judgment] is wrested from Him. Though the properties are equally infinite in God, yet they do diversely exert themselves towards men as to the effects. Now the world is upon its trial. God’s primary end is the conversion of a sinner; his secondary end the honor of his vindictive justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 21, Two sermons on Eze. 18:23, pp. 463-79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

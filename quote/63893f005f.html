<main class="wrap"><figure class="quote" id="q-63893f005f" data-kw="">
<blockquote><p>The argument by which we prove the right of children to baptism is strictly analogous to that by which we prove the perpetual obligation of the Lord’s Day. The Anabaptist is compelled on that subject to adopt the same line of argument that we do on baptism. He goes back to the Old Testament Dispensation to find there the principle of one day’s rest after six days’ work, in the same way as we go back to find the principle of the church membership of infants. He finds that the principle of resting one day out of seven existed long before the law of Moses, though it was incorporated therein; just as we find the principle of infant church membership existing from the days of Abraham, though it was incorporated in the law given at Sinai 430 years after Abraham (Gal. iii. 17).

He finds that the law of the Sabbath was acknowledged by God’s people down till the coming of Christ; and we find that the law of the church membership of infants was acknowledged by them down till the same period. Finding nothing in the New Testament to set aside the principle of one day’s rest after six days’ work, he considers that the law of the Sabbath is still in force; exactly as we, finding nothing in the New Testament to set aside the principle of infant church membership, conclude that that portion of the Divine law is in full force still. He discovers, however, that the New Testament introduces a modification, in consequence of which he considers himself warranted in devoting the first clay of the week instead of the last to purposes of rest and worship: and we discover, too, that the New Testament introduces a modification, in consequence of which we consider ourselves warranted in recognising the church membership of infants by the ordinance of baptism, instead of by the ordinance of circumcision.

He maintains that the change from the seventh to the first day of the week does not interfere with the great unrepealed principle of one day’s rest after six days’ work, and he concludes, therefore, that the law of the Sabbath is a perpetual ordinance: and we maintain that the change of the initiatory rite from circumcision to baptism does not interfere with the great unrepealed principle of infant membership; and we conclude, therefore, that infant membership in the Church of God is a perpetual ordinance.

He insists that if men do not discover sufficient authority in the New Testament for the change of day, this does not free them from the law of the Sabbath, but binds them to keep it on the seventh day instead of the first and we insist that if men do not see sufficient authority in the New Testament for infant baptism, this does not free them from the law of infant church membership, but binds them to acknowledge that membership by circumcising instead of baptizing them. In short, the mode of proof is the same exactly in the one case as it is in the other.

So much is this the case, that that section of Anabaptists known as Plymouth Brethren, with admirable consistency, deny the perpetual obligation of the Sabbath as well as the church membership of infants. The ordinary Anabaptist shrinks from this; he holds by the Sabbath, and rejects infant baptism; and, strange to tell, the very same argument which, on the one subject, he thinks ought to convince everybody, he asserts, on the other subject, should convince nobody. The same proof that, in the one case, pleases him well, on the other does not please him at all. Prejudice, it is to be feared, warps the judgment of these good people even more than they themselves suspect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-witherow.html">Thomas Witherow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scriptural Baptism: Its Mode &amp; Subjects as opposed to the views of the Anabaptists</cite>, (Belfast: C. Aitchson, 1869), pp 50-52.</span></figcaption>

<blockquote><p>11. ‘Then Zipporah tooke a sharpe knife and cut away the foreskin of her son.’ The two things that here might be considered (namely, that doctrine of Popery concerning the danger of children dying unbaptized, and secondly of such an absolute necessity of baptism, as that women must administer it in time of supposed need) I forbear to stand upon now: I have sufficiently touched them in my Notes upon Genesis. Therefore do but remember with yourself (touching the first) that we make a great difference betwixt want [lack] of the sacrament and contempt of the same; contempt, damning; and want, not, through the strength of God’s promise; meaning, by want, when God so prevents by death, that it cannot be had, according to the manner allowed in the Word. And, touching the second, observe, that this act of Zipporah, here, in circumcizing her child, was merely extraordinary, and does no way warrant women to baptize now-a-days.</p></blockquote>

<blockquote><p>However, we do not therefore exclude form the fellowship of this sacrament those children who were born of Christian stock and baptized parents–even though their own parents through their wicked lives or impure faith cause the efficacy of the covenant sealed in their own baptism to be ineffective for themselves–if those same parents or the relatives who have authority over them present them for baptism according to the customary order in our churches. For in the new covenant the son does not bear the iniquity of the father, and of such children God remains God just the same, as He Himself bears witness in Ezekiel 16 and 23. There He calls the children of the godless Israelites his own sons, whom they had begotten for God, although they were sacrificing them to Molech. And it is from these children that God also normally gathers his church through the ordinary preaching of the Word. And for this reason he also commanded the children of such Israelites (of whom many had died in their ungodliness) to be circumcised, no less than those of the godly ones (Joshua 5:4 and 6)–which necessary deed also the Israelite and the early Christian church always have considered beyond debate.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“However, we do not therefore exclude form the fellowship of this sacrament those children who were born of Christian stock and baptized parents–even though their own parents through their wicked lives or impure faith cause the efficacy of the covenant sealed in their own baptism to be ineffective for themselves–if those same parents or the relatives who have authority over them present them for baptism according to the customary order in our churches. For in the new covenant the son does not bear the iniquity of the father, and of such children God remains God just the same, as He Himself bears witness in Ezekiel 16 and 23. There He calls the children of the godless Israelites his own sons, whom they had begotten for God, although they were sacrificing them to Molech. And it is from these children that God also normally gathers his church through the ordinary preaching of the Word. And for this reason he also commanded the children of such Israelites (of whom many had died in their ungodliness) to be circumcised, no less than those of the godly ones (Joshua 5:4 and 6)–which necessary deed also the Israelite and the early Christian church always have considered beyond debate.”

<blockquote><p>‘Tis one thing to dispute of the absolute sovereign power of God, and what are the truths, without the belief whereof ’tis absolutely, and altogether impossible that one can be saved: Which question (I doubt) is hardly determinable by Scripture, nor do I know what edification there is in the canvassing of it; sure I am ’tis a question much abused. ‘Tis another thing to dispute what are these truths, which in a Church where the Gospel is truly preached, all and every one (come to years of knowledge and discretion) and having means and occasions to learn, are bound to know (and according to the revealed will and ordinary dispensation of God) must learn, as they desire or expect to have a true fellowship with Christ in the sacrament of the Lord’s Supper, or to be accepted of God, and saved eternally.</p></blockquote>

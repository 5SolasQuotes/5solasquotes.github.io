<main class="wrap"><figure class="quote" id="q-097d771964" data-kw="">
<blockquote><p>Believe if ye will [as it is claimed by Romanists] that [Emperor] Constantine gave to the Popes of Rome freedom and immunity from the imperial laws… we teach no such kingly power given to Church-men, and judge this Donation [of Constantine] to be a forged lie, invented by Papists… 6. We do not teach that Church-men are loosed from the positive laws of emperors and kings. [The Romanist, Robert] Bellarmine says that the Magistrate can neither punish Church-men, nor convene them before the tribunal… And as he says, by divine law the Pope is eximed [exempt] from all laws of princes… And what they allege for Peter’s exemption from paying tribute, will exime all the disciples, and so all Church-men by divine right from the laws of princes. Yea all Clergy-men (say they) by a divine positive law are eximed from the laws of Magistrates… Paul will have every soul subject to superior powers, and except the Roman clergy want [lack] souls, they must also be subject. Solomon punished [the priest] Abiathar, Josiah burnt the bones of the priests upon the altar, Christ subjected Himself to his parents, payed tribute to Caesar, and commanded scribes and pharisees to do the like, Mt. 22, willing that they should give to Ceasar those things which are Caesar’s. Paul appealed to Caesar’s tribunal, and Rom. 13, as many as may do evil, as many as are in danger of resisting the power, are to be subject, Rom. 13:4. 2. but Church-men are such, therefore they are subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 2, Appendix</cite>, p. 454</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b7047b830e" data-kw="">
<blockquote><p>XVII. As extraordinary evils require extraordinary helps, so the Magistrate may do many things in a time of the Church’s gathering, backsliding or corruption which he cannot do so long as the Church is in a well constitut[ed] &amp; reformed condition: But from this to infer that he may demolish the established order and fabric of a right[ly] constitut[ed] and reformed Church, on purpose to give a proof of his extraordinary power, by reducing the same into order again; Or that he may make use of this extraordinary power, when the ordinary and appointed means are to be had, and also in case to effectuate the cure; to infer this (I say) were both impious and incongruous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Banders Disbanded… (1681)</cite>, p. 45</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-56880e1e24" data-kw="">
<blockquote><p>2. My second distinction shall be this: The magistrate may and ought not only to conserve justice, peace and order in the commonwealth and in the church, as it is in the commonwealth, but also to take special care of the conservation of the true reformed religion and of the reformation of it when and wherein it needs to be reformed, imperative [by command], not elicitive [not by drawing forth the power by oneself]. The magistrate (says Dr. [Andrew] Rivet on the Decalogue, p. 262) is neither to administer Word, nor sacra- ments, nor church discipline, etc., but he is to take care that all these things be done by those whom God has called thereunto. Whatever is properly spiritual, belonging to the soul and inward man (such as church censures, and the other particular before mentioned), cannot be actus elicitus [an elicited act] of the magistrate… Yet all these, and generally the administration of the keys of the kingdom of Heaven, are actus imperati [having been commanded] of the Christian magistrate, and that both antecedenter [antecedently, before-hand] and consequenter [consequently, after-the-fact]: Antecedently, the magistrate may command church officers to suspend or excommunicate all obstinate and scandalous persons; he may command the classes to ordain able and godly ministers, and no other; he may command a synod to meet to debate and determine such or such a controversy. Consequently, also, when the thing is examined, judged, resolved, or done by the ecclesiastical power, the magistrate has power and authority to add his civil sanction, confirmation, or ratification; to make the ecclesiastical sentence to be obeyed and submitted unto by all whom it concerns; — in all which the Christian magistrate does exceeding much for the conservation and purgation of religion, not eliciendo actus, doing or exercising by himself, or by his own authority, acts of church government or discipline, but taking care that such and such things be done by those to whom they do belong.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming... (London, 1646), bk. 2, ch. 8</cite>, pp. 122-23</span></figcaption>

</figure><figure class="quote" id="q-2fbace919d" data-kw="">
<blockquote><p>15. In times of extraordinary necessities of the Church, or State, or poor, there must be extraordinary bounty in our contributions; As if an enemy be ready to invade the land, or if some extraordinary work of God (as the conversion of some heathen nations) do require it, or some extraordinary persecution, and distress befall the pastors, or in a year of famine, plague, or war, when the necessities of the poor are extraordinary: The tenths in such cases will not suffice, from those that have more to give; Therefore in such a time, the primitive Christians sold their possessions, and laid down the price at the feet of the Apostles.</p></blockquote>

<blockquote><p>That the [ecclesiastical] gathering ought to be assembled by order and then by authority of someone elected among them, we do not doubt that it is the office of the magistrate to order and provide for the ecclesiastical state to be governed well and ruled in peace, as well as to increase therein (1 Tim. 2:2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theodore Beza’s Confession (1560): A Brief &amp; Pithy Sum of Christian Faith’, 5th Point, ‘Of the Church’, 13. ‘To Whom it Belongs to Call a Council’ in Reformed Confessions of the 16th &amp; 17th Centuries, ed. Dennison (RHB, 2010), vol. 2</cite>, pp. 305-6</span></figcaption>

<main class="wrap"><figure class="quote" id="q-67ba3cedeb" data-kw="">
<blockquote><p>Singing of psalms must be used in thy family. The Lord Jesus and his family did practise this duty: Mat. xxvi. 30, ‘And when they sang a hymn, they went out into the Mount of Olives.’ David in that psalm, at the dedication of his house, speaketh that his glory should sing praise to God, and not be silent, Ps. xxx. title, ver. 4 and 12. Our tongues are called our glory, not only because by our speech we excel beasts, but chiefly because therewith we should glorify God. It is observable that most of those places which prophesy the Gentiles’ conversion, do mention their worshipping the true God by singing, Ps. cviii. 3, c., and lxiv. 4; Isa. liv. 1, and lii. 8.

The Holy Ghost when he commandeth that the word should keep house with us, doth also enjoin us to ‘teach and admonish one another in psalms, and hymns, and spiritual songs,’ (which are the titles of David’s psalms, and the known division of them, expressly answering to the Hebrew words, Shurim, Telhillim, and Mizinurim, by which his psalms are distinguished and entitled, as the learned observe,) ‘singing and making melody with grace in our hearts to the Lord,’ Col. iii. 16; Eph. v. 19; James v. 13. Basil speaks high in the praise of praising God by this holy exercise. Chrysostom speaketh of some in his time who always concluded their suppers with singing a psalm, and, saith he, they lived like angels.

This ordinance will much quicken holy affections, and help a Christian to serve God with more cheerfulness. When the Israelites were singing the 136th psalm at the bringing in the ark, the glory of the Lord filled the house, 2 Chron. xx. 22. The sweet singer in Israel was the man after God’s own heart.

Only, reader, be careful to sing David’s psalms with David’s spirit, and not like a nightingale to sing by rote: ‘I will sing with my spirit, and I will sing with the understanding also.’ Making melody with grace in the heart, is the best tune to set all David’s psalms with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling</cite>, (1661-65) in The Works of George Swinnock, M.A. (5 vols, Edinburgh: James Nichol, 1868), 1: 341-42.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a357c874ee" data-kw="">
<blockquote><p>Col. 3:16, ‘Let the word of Christ dwell in you richly in all wisdom, teaching and admonishing one another in Psalms, hymns, and spiritual songs, singing with grace in your hearts to the Lord,’ etc. He did not here mean (in this place) any new Psalms or hymns, for he bade them admonish each other in those Psalms and hymns; therefore those Psalms and hymns were then Canonical: although I could wish that upon some occasion (were it not for startling the weak in knowledge) that some preacher that were a solid man, would frame a Psalm for that special occasion (for he that can make a prayer according to the Word, is able also to make a Psalm) but this I think would be inconvenient; but this is fit to be done, viz. the preacher himself should fit a Psalm out of the Book of Psalms for the several occasions, and suitable to his sermon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-palmer.html">George Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sectaries Unmasked and Confuted, by the treating upon diverse points of doctrine in debate betwixt the Presbyterialists and Sectarists, Anabaptists, Independents, and Papists</cite>, (London, 1647), p. 45. Palmer was an English presbyterian. The concession that Palmer makes below actually shows that such a practice as composing a hymn upon a special occasion was not in fact being done.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-0e33c54de6" data-kw="">
<blockquote><p>Those who wish to know the bearing of Scripture on human hymns as matter of God’s worship should read the two excellent little treatises, respectively entitled, The True Psalmody, and The Public Worship of God, the first of which is an American publication, and the other was penned by the late Dr. [James] Gibson.

It is enough to state here that the Psalms are as much superior to uninspired hymns as God’s Word is to man’s word, and we ought to serve God with the best; that there is no warrant for worshipping God with human hymns, and therefore we have no ground for hoping that such praise will be accepted; and, further, while admitting that metrical translations of other portions of the Bible are not to be compared with mere human hymns, the fact of God’s having gathered the Psalms, Songs and Hymns of various inspired writers into one Book of Psalms, seems conclusively to show that that Book alone was meant to serve as our manual of praise.

Christ specially referred to “the Book of Psalms,” and Paul, quoting the words, “Thou art my Son, this day have I begotten thee,” says they are “ written in the second Psalm,” thus indicating that they were then arranged in their present order. There must be some reason why the Prayer or Psalm of Moses in the 90th Psalm found a place in that Book, though his Song in the 15th chapter of Exodus did not; why David’s Psalm of thanksgiving, when the ark was brought to Zion, is reproduced in the 105th, 96th, and 106th Psalms; why the 14th and 53rd Psalms are almost exactly the same; and why the 108th Psalm is embodied in the 57th and 60th. The reason given above seems the most satisfactory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-hay-fleming.html">David Hay Fleming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Hymnology of the Scottish Reformation. I. in Original Secession Magazine</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>Q. 37: What is required touching singing of psalms in the church? That they be such as are parts of the Word of God, formed by the Holy Ghost into psalms or songs, which many may conveniently sing together, exhorting and admonishing themselves mutually with grace in their hearts (Matt. 26:30; Eph. 5:19; Col. 3:16).</p></blockquote>

<blockquote><p>One of the sections of the Directory is given to the Singing of Psalms, and declares it “the duty of Christians to praise God publickly by singing of psalms together in the congregation, and also privately in the family”. This rubric manifestly implied the provision of a Psalm Book, and it was made part of the function of the Assembly in preparing a basis for uniformity of worship in the churches of the three kingdoms, to supply them with a common Psalm Book. The way was prepared for this by the submitment to the Assembly by the House of Commons on Nov. 20, 1643, of the query whether “it may not be useful and profitable to the Church that the Psalms set forth by Mr. Rouse be permitted to be publicly sung”.

The result of the Assembly’s examination of Mr. Rouse’s version (first printed in 1643) was to recommend it, after it had been subjected to a thorough revision at its own hands, to Parliament as a suitable Psalm-Book for the Church (autumn of 1645). The Commons accordingly ordered the book printed in this revised form (it appeared in 1646, i. e., Feb. 1647), and (April 15, 1646) issued an order establishing it as the sole Psalm Book to be used in the Churches of England and Wales, though the House of Lords never concurred in this order.

The Scotch Assembly subjected the book to a still furthermore searching revision, and by an act passed in 1649 (ratified by the Estates of Parliament in 1650) approved it in this new form for use in the Scottish Churches. It is in this Scottish revision alone (printed in 1650) in which they can only by courtesy continue to bear the name of Francis Rouse as their author, that these Psalms have passed into wide use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Assembly and its Work in Princeton Theological Review</cite></span></figcaption>

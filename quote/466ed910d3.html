<main class="wrap"><figure class="quote" id="q-466ed910d3" data-kw="">
<blockquote><p>On the second point, when God is worshipped by inventions of men, he condemns this “fear” as superstitious, though men endeavour to cloak it under a plausible pretence of religion, or devotion, or reverence. He assigns the reason, that it “hath been taught by men.” I consider מלמדה (mĕlŭmmādāh)1 to have a passive signification; for he means, that to make “the commandments of men,” and not the word of God, the rule of worshipping him, is a subversion of all order. But it is the will of the Lord, that our “fear,” and the reverence with which we worship him, shall be regulated by the rule of his word; and he demands nothing so much as simple obedience, by which we shall conform ourselves and all our actions to the rule of the word, and not turn aside to the right hand or to the left. Hence it is sufficiently evident, that those who learn from “the inventions of men” how they should worship God, not only are manifestly foolish, but wear themselves out by destructive toil, because they do nothing else than provoke God’s anger; for he could not testify more plainly than by the tremendous severity of this chastisement, how great is the abhorrence with which he regards false worship. The flesh reckons it to be improper that God should not only reckon as worthless, but even punish severely, the efforts of those who, through ignorance and error, weary themselves in attempts to appease God; but we ought not to wonder if he thus maintains his authority. Christ himself explains this passage, saying, “In vain do they worship me, teaching doctrines, the commandments of men.” (Matt. 15:9.) Some have chosen to add a conjunction, “teaching doctrines and commandments of men,” as if the meaning had not been sufficiently clear. But he evidently means something different, namely, that we act absurdly when we follow “the commandments of men” for our doctrine and rule of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah</cite>, trans. William Pringle (repr. Bellingham, WA: Logos Bible Software, 2010), 2.324–25.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6aa3248cec" data-kw="">
<blockquote><p>1. A stinted liturgy is in it self lawful. 2. A stinted liturgy in some parts of public holy service is ordinarily necessary. 3. In the parts where it is not of necessity, it may not only be submitted to, but desired when the peace of the Church requires it. 4. There is so great difference between ministers and people, and times, that it may be convenient and eligible to some, at some times, and unfit and not eligible to others, and at other times. 5. The ministers and Churches that earnestly desire it, should not by the magistrate be generally or absolutely forbidden the use of a convenient prescribed liturgy. 6. To prescribe a frame of stinted service, or prayer, etc. and lay a necessity, or the peace of the Church upon it, and to punish, silence, suspend, excommunicate, or reproach the able, peaceable, godly ministers, or people that (justly or unjustly) scruple the using of it, is so great a sin that no conscionable ministers should attempt it or desire it, nor any godly magistrate suffer it. 7. The safest way of composing such a public form is to take it all, for matter and words, out of the Holy Scriptures. 8. Yet is not this of such necessity, but that we may join in it, or use it, if the form of words be not from Scripture. 9. The matter of a common liturgy, in which we expect any general concord, should not be any unnecessary things, much less things doubtfull, or forbidden. 10. Forms of public prayer should not be constantly used by ministers that are able to pray without them: and none else should be admitted ordinarily to the ministry, but such as are able competently to pray without such forms; unless in great necessities of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, Question 4, ‘Whether a stinted Liturgy, or form of worship, be a desirable means for the peace of these churches?’ in Five Disputations of Church-Government &amp; Worship (London, 1659) Note this was published the year before Charles II returned, as persons were contemplating seeking to unify the nation in a form of church government and worship. | Baxter seeks to prove in his treatment ten propositions:</span></figcaption>

<blockquote><p>With regard to “removing… monuments of idolatry,” establishment Anglicans had long affirmed and practiced this, interpreting the phrase as referring (only) to such Romanist monuments and not to the Anglican ceremonies, the latter being held to be not inherently unlawful.¹ ¹ So bishop Richard Cox (c. 1500–1581), who opposed John Knox at Frankfurt regarding the Anglican Liturgy, was a zealous and firm remover of Romanist monuments of superstition and idolatry: Wenig, “Reformation during the Episcopate of Richard Cox,” pp. 167 &amp; 170.</p></blockquote>

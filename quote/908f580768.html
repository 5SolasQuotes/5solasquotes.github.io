<main class="wrap"><figure class="quote" id="q-908f580768" data-kw="">
<blockquote><p>I shall not now enquire whether these acts of Christ’s will and holy love did issue and proceed from Him per modum naturae [through the mode of nature, as Rutherford held; see below], or per modum rationis [through the mode of reason], as they speak in the Schools, or both; that is, whether they were only the natural weights and inclinations, and desires of the will and habit of charity to his own self-preservation, without any deliberation, such as is to be found in children before the use of reason; or whether they proceeded from Him out of a deliberate consideration and pondering, not so much of the now-impending evils and the fury of his Father’s wrath, as the love He bore to his own people the Jews, whose destruction and casting off He foresaw would be the consequents of his death: though Suarez seems to me to have proved the latter as well as the former.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-creed.html">William Creed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>paragraphs 61-73, pp. 236-43 in sect. 13 in The Refuter Refuted, or Dr. [Henry] Hammond’s Ektenesteron Defended, against the impertinent cavils of Mr. Henry Jeanes... (London: Royston, 1660)</cite>, pp. 237-38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c017f546bb" data-kw="">
<blockquote><p>Thirdly, if thou wouldst prepare thyself for the Word, entreat God to bless it to thee: The operations of the Spirit must accompany the administration of the Word, or it will be ineffectual: It is the Spirit that quickeneth, Jn. 6.63. The fire burns naturally, and the water cools naturally; but if the fire of the Word ever burn up thy corruptions, or the water of the Word refresh thee with real consolations, it must not be by its own nature, but by a divine power.</p></blockquote>

</figure><figure class="quote" id="q-57b3a16f4e" data-kw="">
<blockquote><p>4. This turning the grace of God into lasciviousness argues the grossest folly; it is a forsaking of our own mercy, a receiving the grace of God in vain. What is, if this be not to neglect great salvation; to be prodigal of blessedness; to ravel out and to wanton away the offers of Christ Himself? Who would not heartily chide himself that by toying, trifling, or unnecessary lingering in the way to the exchange, misses of a bargain by which he might have gained a thousand pounds?… 4. Grace turned into lasciviousness is the top of all ingratitude. What greater unkindness than to be evil because God is good?… To be lascivious because God is gracious is to fight against God with his own weapons, to wound God with that arm which He has cured (Hos. 7:15), to kill and crucify Him who has freed us from death: In a word, to make that a pillow for presumption which God appointed for an antidote against despair.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude… (London: Maxey, 1652), on v. 4</cite>, pp. 333-34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

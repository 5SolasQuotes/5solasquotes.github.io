<blockquote><p>The following post is an extract from the Minority Report of the Committee on Song in the Public Worship of God submitted to the General Assembly of the Orthodox Presbyterian Church in 1947. The Minority Report was written primarily by John Murray (pictured), with the assistance of William Young:

In dealing with this question it should be appreciated that the singing of God’s praise is a distinct act of worship. It is to be distinguished, for example, from the reading of the Scripture and from the offering of prayer to God. It is, of course, true that songs of praise often include what is of the nature of prayer to God, as it is also true that in the offering of prayer to God there is much that is of the nature of praise and thanksgiving. But it is not proper to appeal to the divine authorization or warrant we possess as to the content of prayer in order to determine the question as to the content of song.

Prayer is one element of worship, singing is another. Similarity or even identity of content does not in the least obliterate the distinction between these two specific kinds of exercise in the worship of God. Because of this distinction we may not say that the offering of prayer and the singing of praise to God are the same thing and argue from the divine authorization we possess respecting the one to the authorization respecting the other. One or two examples may be given of the necessity and importance of guarding the distinctiveness of the several parts of worship and of determining from the Scripture what its prescriptions are respecting each element.

Both reports submitted by this committee are agreed that some Scripture songs may be sung in the public worship of God. But these Scripture songs may also be read as Scripture and they may be used in preaching. In such cases the actual materials are the same. But reading the Scripture is not the same exercise of worship as singing, and neither is preaching the same as singing, or reading the Scripture. The same kind of distinction applies to the exercises of praying and singing even when the content is identical.

The Lord’s Supper is an act of thanksgiving as well as one of commemoration and communion. But though the partaking of the bread and the wine includes thanksgiving, just as prayer and singing do, yet the celebration of the Lord’s Supper is an act of worship distinct from both prayer and singing, and the divine prescriptions respecting the celebration of the Lord’s Supper cannot be determined by the divine prescriptions regarding prayer or singing but must rather be derived from the revelation God has given respecting the observance of that distinct element of the worship of God.

Consequently the minority contends that the argument used in the report of the committee, to wit, that, since we are not limited in our prayers to the words of Scripture or to the “prayers” given us in Scripture, therefore the same freedom is granted in song, is invalid. We may not argue thus from the divine warrant respecting one element to the divine warrant respecting another. The question of the divine prescription regarding the songs that may be sung in the public worship of God must be answered, therefore, on the basis of the teaching of Scripture with respect to that specific element of worship.</p></blockquote>

<blockquote><p>Q. What is the fourth Commandment?

A. Remember, &amp;c.

Q. What is the general meaning of the 4. Commandment?

2 A. The general meaning of the fourth Commandment, is that solemn times of worship, necessary to Religion at God’s own appointment, and chiefly a standing day in the week, free from worldly business to attend on God.

Is it not the solemn times of worship, necessary to Religion, at God’s own appointment, and chiefly, a standing day in the week, of rest from worldly business to attend on God?

Yes.

Or, May men of themselves appoint any days or times, as necessary to Religion?

No.

Or, May we unnecessarily spend God’s Day upon our selves?

No.

Or, Upon any worldly matters?

No.</p></blockquote>

<blockquote><p>After He had washed their feet, and had taken his garments, and was set down again, He said unto them, ‘Know ye what I have done to ye, ye call me Master and Lord, and ye say well, for so I am; if I then your Lord and Master have washed your feet, ye also ought to wash one another’s feet, for I have given you an example that ye should do as I have done to you.’ ‘Tis evident that it is the moral duty of brotherly love, in condescension, and mutual helpfulness to be expressed in all necessary offices as occasion doth require, that is the thing which Jesus Christ here enjoins his disciples, and leads them to by his own example in an office of love then in use in those parts. The same is to be said of the holy kiss, Rom. 16:16 which was a temporary occasional token of entire love; which may in answer thereunto, be expressed by any sober usage of salutation amongst men to the same purpose. But the things themselves were not instituted for any continuance, nor do represent any special grace of the New Covenant, which is inseparable from every institution of Gospel worship properly so called. Common usages or practises therefore, directed to be used in a due manner, and unto a proper end, where they are used, make them not institutions of worship. Neither have they in them as so commanded or directed, any one thing that concurs to the constitution of a Gospel-Ordinance: for neither had they their rise in the authority of Christ, nor is any continuance of them enjoined, nor any promise annexed unto them, nor any grace of the New Covenant represented or exhibited in them.</p></blockquote>

uote/fde2d15b26.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-holy-kiss-foot-washing-anointing-with-oil/#:~:text=After%20He%20had%20washed%20their%20feet,Covenant%20represented%20or%20exhibited%20in%20them&amp;text=After%20He%20had%20washed%20their%20feet%2C%20and%20had&amp;text=the%20New%20Covenant%20represented%20or%20exhibited%20in%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>IN the blessed Life of our Saviour we read once and again of his going into the Synagogues, to attend the public Worship of God on the Sabbath days. Luke 4.6. As his Custom was he went into the Synagogue on the Sabbath day. This he did to teach and require us to keep the Sabbath as he did. He has given us this Example that we should follow his steps. So he served and worshiped God, fulfilling all Righteousness, and so must we. He came not to destroy the Law and the Prophets, but to fulfil them. Had he put an end to the Sacred weekly Sabbath, it had destroyed the Law and the Prophets with a witness.

But Christ fulfilled this Law, and kept many a Sabbath to the glory of God in a perfect manner, so as no mere man, nor all the Holy men of God together, ever did or can do. He has taught us how to Sabbatise; how to spend our Sabbaths in the solemn Assemblies, and in works of piety and mercy. Many a high Exercise of devotion, and many a good work of charity, did he upon the Sabbath-day. He fill’d up the Holy time with work, and the work with Spirit. For these very works of God like goodness he was sometimes reproached as a breaker of the Sabbath; but it turned to the confusion of his ignorant and superstitious, if not hypocritical and malicious Accusers. As in Mark 3. Init. He sanctified and honoured the Sabbath by his divine Sermons, and by his miracles of mercy on that blessed day. He made it a Day of his Blessing to men, both on temporal and spiritual accounts. Luk. 13.10, 17.

He kept that blessed Law for his Elect, which Believers themselves keep so poorly and imperfectly.—He also taught his Disciples and followers to observe and keep the Sabbath-day, Indeed some of the superstitious Pharisees did sometimes tax the Disciples with taking undue liberties on the Holy Sabbath. But what was it? they plucked an ear of corn and eat of it as they passed thro’ a field. They were hungry and it was but a proper and needed taste, and an ordinary hasty bit, for their support and refreshment in the services of the day.

The Women also that followed our Lord Jesus, and ministered unto him, were strict Sabbatizers: Luk. 23. ult. They rested on the Sabbath day according to the Commandment. Tho’ they were preparing spices for the dead body of their dear Saviour, yet they laid by the holy care and labour of love till the Sabbath was over. Verily God’s Sabbaths did they keep; even as if the words of my Text were then in their remembrance, and they considered that as the holy work of the Tabernacle was to give place to the holy Rest of God’s day, so their pious ministering to that sacred Temple of the Deity, our Lord’s Body.—And that was the last Seventh day Sabbath which the Disciples kept.

For early in the morning of the next day, being the first day of the week these Women came unto the Sepulchre, bringing the Spices which they had prepared; and they found not the Body of Jesus, but had a vision of Angels who told them of his resurrection from the dead.— And that same day the Lord himself appeared several times to one and another of his Followers; to Mary Magdalene, to the two disciples on their way to Emmaus, to Simon, and to the ten together in the Evening: when he blessed them, breathed on ’em, and gave them their Commission.

That day seven night, being again the first day of the week, the Lord appeared again unto them, Thomas being then present, and shewed them his hands and his feet.— Now by the Resurrection of Christ on the first day of the week, and by his repeated visits to them on this day, the Inspired Apostles (under the infallible Conduct of the Holy Ghost) from thenceforth held their solemn Meetings, their holy Convocations, on this day of the seven, and called it the Lord’s-Day.— On this first day of the week, the Disciples were all with one accord in one place, assembled as on their holy Sabbath, when suddenly there appeared the cloven Tongues of fire and sat upon them, and they were all filled with the Holy Ghost; and spake in every language the wonderful works of God; the proper service of the Sabbath day.

That this day of Pentecost was the first day of the week is easily computed and proved. The day after the Passover was the first day of the feast of unleavened bread; (see Lev. 23.5, 6.) which was as a Sabbath to the Jews; They were to have an holy Convocation on it, and to do no servile work thereon. On the next day was the Offering of the first-fruits unto the Lord: And from this day, (the next but one after the Passover) they were ordered to count fifty days, or seven weeks complete; and then was the feast of Pentecost, so called from the fiftieth day.

Now see how these things were all fulfilled in the Dying and Resurrection of our Lord Jesus, and in the pouring out of the Spirit on the day of Pentecost.— Our blessed Lord Jesus was slain at the Passover, which fell that year on a fryday: Then was the Lamb of God offered, Christ our Passover sacrificed for us.— That Evening therefore was the preparation, as it is called John 19.31. scil. the preparation both for the weekly Sabbath, and also for the Feast of unleavened bread; which made that Sabbath a high day. The Jews therefore were earnest with Pilate to have the Bodies taken down early from the Cross. This whole Sabbath our Lord’s Body lay in the grave.

And the next morning early, being the first day of the week, the next day but one after the Passover, the day of the offering of the first-fruits unto the Lord, he rose from the dead, and became the first-fruits of them that sleep. Now compute just seven weeks from this day of our Lord’s Resurrection, and the first day of the eighth week, even the fiftieth day, was the day of Pentecost; when the Spirit, (the promise of the Father) was poured out from the ascended Jesus upon his Apostles, as they were assembled together for his solemn Worship.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8b651ea6cb" data-kw="">
<blockquote><p>We discern beauty in concrete objects and abstract ideas, in works of nature and works of art, in things, animals and people, in objects, qualities and actions. As the list expands to take in just about every ontological category (there are beautiful propositions as well as beautiful worlds, beautiful proofs as well as beautiful snails, even beautiful diseases and beautiful deaths), it becomes obvious that we are not describing a property like shape, size or colour, uncontroversially present to all who can find their way around the physical world. For one thing: how could there be a single property exhibited by so many disparate types of thing?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roger-scruton.html">Roger Scruton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beauty: a Very Short Introduction Pre</cite>, (Oxford University Press, 2011) 180 pp. ToC, p. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-70b462bc5a" data-kw="">
<blockquote><p>Q. What if by the wrong a man does me, I observe such infirmity, yea and iniquity to be in him, as by experience I find him to be a far other man than at first I supposed him to be, ought I notwithstanding to make such account of him as I did before? A. We must put difference betwixt a wrong done upon such an occasion as may afterwards be avoided, and that which is done upon an evil disposition, which remaining in a man, may be a means to make him continue to do more and more wrongs. The wrong of the former must be so forgiven, as the wrong doer be so accepted as if he had done no wrong at all. As for the latter, we are to try if he may be brought to sight of his evil disposition, and to repentance for the same. If he be, then ought we to esteem him as if he never had done us any hurt. But if obstinately he persist in that evil disposition, and be like, on all occasions, again and again to wrong us, though we do, as we ought, fully forgive all the wrongs done, and neither take any present revenge, nor keep them in mind and memory for any future revenge, yet may we in our judgment esteem him to be such an one as we find him to be. (Woe to them that call evil good: that put light for darkness, and sweet for bitter.) For example, if I find one of whom I have had a very good account, and thereupon used him very familiarly, to have no command of his tongue, but on all occasions to be ready to blab out, and blaze abroad whatsoever he sees or hears, if therein he have wronged me, I may forbear to use him so familiarly as I did before, and take heed what secrets I communicate to him, though I fully forgive the wrong that is past. Or if I have accounted one to be an entire friend to me, but by experience find him to be hollow-hearted, and maliciously minded against me, I ought wisely and warily to avoid his society, and to take heed of the snares which he lays for me. (For which we have the pattern of David, and Christ) yet so to pass by the wrongs done as if none had been done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Go to God: or, an Explanation of the Perfect Pattern of Prayer, the Lord’s Prayer</cite>, (London, 1626), §148. ‘Of a full forgiving one another,’, pp. 186-87</span></figcaption>

</figure><figure class="quote" id="q-9a6c66249f" data-kw="">
<blockquote><p>This we showed was the order of love in respect of nearness of conjunction with us. But now in respect of excellency and the honor which is therefore due to any, it is otherwise: for in some cases the person of greater excellency must be preferred before such as be of near relation to us. St. Paul honored Nero, an infidel, appealing to him. Thus a stranger may be honored rather than one of our own country, as Daniel was honored by Darius above all the princes of Babylon: and Joseph, though a stranger, by Pharaoh above all the rulers of Egypt. Thus one that is not allied may be honored before one of our own kindred, as Moses appointed Aaron and not any of his own sons to succeed him in the government of Israel. Now such persons as are to be honored in respect of their excellent gifts and of their nearness to God, which we ought to esteem and honor above all nearness to ourselves by any relations to us, and that not only for itself, but also our honor and respect being the reward which God has appointed to such gifts; although in respect of ourselves also we are to regard them, they being of great use and profit to us by their gifts. The heathen man said that every one made more account of 〈Greek〉, than of 〈Greek〉, ‘of his own things’, than ‘of God’s’, and the apostle complains of such as sought 〈 in non-Latin alphabet 〉, ‘their own things, and not the things of Christ’. But if we look at the 〈◊〉 of any, we must not chiefly look at ourselves, but to honor God in his gifts, for we must consider them in a double respect: 1. As they are useful and beneficial to us, and so the duty is diliges, thou shalt love them. 2. As they are near to God, by that excellency which he has given them: and so we must do more than love them, we must honor them. If it be here demanded: Why did not God make all men excellent alike and fit to be superiors? Answer: God made men of finite natures and therefore of such condition that one should need the help of another: for which end the woman also was made to be an helper to the man. Besides, seeing men grow in wisdom and abilities for several 〈◊〉 according to their finite capacities, industry and education, necessarily it follows that as the stars differ each from other in glory, so one man does excel another. In this regard the elder brother, having as dignity of primogeniture, so more maturity of years and reason was appointed by God to rule over the rest of the family. Yet God the King of kings and Lord of lords, the fountain and original of all rule, made Moses the younger brother ruler and as a God to Aaron, the elder brother, and preferred David before his elder brethren, and Solomon before Adonijah and Absalom when He first framed and composed a national government in his own people. But having settled the platform of that rule He intended by the practice of David and Solomon in a monarchical course (the best of all kinds of governments and approved by God, because He rested in it), He left the managing of that kingdom and rule to the true and lawful heirs of David in all after-times, because they by education under their parents, and aptness of children to walk in the steps of their fathers and to fit their spirits and carriage to what they are born to, would probably best perform the royal and weighty charge of ruling as kings, and make election of the most able, active and faithful instruments to assist them in 〈◊〉 their great affairs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pattern of Catechistical Doctrine at Large; or a Learned &amp; Pious Exposition of the 10 Commandments</cite>, (d. 1626; 1675) 5th Commandment, ch. 2, p. 321</span></figcaption>

<div class="actions"><button class="copy" data-copy="“This we showed was the order of love in respect of nearness of conjunction with us. But now in respect of excellency and the honor which is therefore due to any, it is otherwise: for in some cases the person of greater excellency must be preferred before such as be of near relation to us. St. Paul honored Nero, an infidel, appealing to him. Thus a stranger may be honored rather than one of our own country, as Daniel was honored by Darius above all the princes of Babylon: and Joseph, though a stranger, by Pharaoh above all the rulers of Egypt. Thus one that is not allied may be honored before one of our own kindred, as Moses appointed Aaron and not any of his own sons to succeed him in the government of Israel. Now such persons as are to be honored in respect of their excellent gifts and of their nearness to God, which we ought to esteem and honor above all nearness to ourselves by any relations to us, and that not only for itself, but also our honor and respect being the reward which God has appointed to such gifts; although in respect of ourselves also we are to regard them, they being of great use and profit to us by their gifts. The heathen man said that every one made more account of 〈Greek〉, than of 〈Greek〉, ‘of his own things’, than ‘of God’s’, and the apostle complains of such as sought 〈 in non-Latin alphabet 〉, ‘their own things, and not the things of Christ’. But if we look at the 〈◊〉 of any, we must not chiefly look at ourselves, but to honor God in his gifts, for we must consider them in a double respect: 1. As they are useful and beneficial to us, and so the duty is diliges, thou shalt love them. 2. As they are near to God, by that excellency which he has given them: and so we must do more than love them, we must honor them. If it be here demanded: Why did not God make all men excellent alike and fit to be superiors? Answer: God made men of finite natures and therefore of such condition that one should need the help of another: for which end the woman also was made to be an helper to the man. Besides, seeing men grow in wisdom and abilities for several 〈◊〉 according to their finite capacities, industry and education, necessarily it follows that as the stars differ each from other in glory, so one man does excel another. In this regard the elder brother, having as dignity of primogeniture, so more maturity of years and reason was appointed by God to rule over the rest of the family. Yet God the King of kings and Lord of lords, the fountain and original of all rule, made Moses the younger brother ruler and as a God to Aaron, the elder brother, and preferred David before his elder brethren, and Solomon before Adonijah and Absalom when He first framed and composed a national government in his own people. But having settled the platform of that rule He intended by the practice of David and Solomon in a monarchical course (the best of all kinds of governments and approved by God, because He rested in it), He left the managing of that kingdom and rule to the true and lawful heirs of David in all after-times, because they by education under their parents, and aptness of children to walk in the steps of their fathers and to fit their spirits and carriage to what they are born to, would probably best perform the royal and weighty charge of ruling as kings, and make election of the most able, active and faithful instruments to assist them in 〈◊〉 their great affairs.”

— Lancelot Andrewes, A Pattern of Catechistical Doctrine at Large; or a Learned &amp; Pious Exposition of the 10 Commandments (d. 1626; 1675) 5th Commandment, ch. 2, p. 321">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+we+showed+was+the+order+of+love+in+respect+of+nearness+of+conjunction+with+us.+But+now+in+respect+of+excellency+and+the+honor+which+is+therefore+due+to+any%2C+it+is+otherwise%3A+for+in+some+cases+the+person+of+greater+excellency+must+be+preferred+before+such+as+be+of+near+relation+to+us.+St.+Paul+honored+Nero%2C+an+infidel%2C+appealing+to+him.+Thus+a+stranger+may+be+honored+rather+than+one+of+our+own+country%2C+as+Daniel+was+honored+by+Darius+above+all+the+princes+of+Babylon%3A+and+Joseph%2C+though+a+stranger%2C+by+Pharaoh+above+all+the+rulers+of+Egypt.+Thus+one+that+is+not+allied+may+be+honored+before+one+of+our+own+kindred%2C+as+Moses+appointed+Aaron+and+not+any+of+his+own+sons+to+succeed+him+in+the+government+of+Israel.+Now+such+persons+as+are+to+be+honored+in+respect+of+their+excellent+gifts+and+of+their+nearness+to+God%2C+which+we+ought+to+esteem+and+honor+above+all+nearness+to+ourselves+by+any+relations+to+us%2C+and+that+not+only+for+itself%2C+but+also+our+honor+and+respect+being+the+reward+which+God+has+appointed+to+such+gifts%3B+although+in+respect+of+ourselves+also+we+are+to+regard+them%2C+they+being+of+great+use+and+profit+to+us+by+their+gifts.+The+heathen+man+said+that+every+one+made+more+account+of+%E3%80%88Greek%E3%80%89%2C+than+of+%E3%80%88Greek%E3%80%89%2C+%E2%80%98of+his+own+things%E2%80%99%2C+than+%E2%80%98of+God%E2%80%99s%E2%80%99%2C+and+the+apostle+complains+of+such+as+sought+%E3%80%88+in+non-Latin+alphabet+%E3%80%89%2C+%E2%80%98their+own+things%2C+and+not+the+things+of+Christ%E2%80%99.+But+if+we+look+at+the+%E3%80%88%E2%97%8A%E3%80%89+of+any%2C+we+must+not+chiefly+look+at+ourselves%2C+but+to+honor+God+in+his+gifts%2C+for+we+must+consider+them+in+a+double+respect%3A+1.+As+they+are+useful+and+beneficial+to+us%2C+and+so+the+duty+is+diliges%2C+thou+shalt+love+them.+2.+As+they+are+near+to+God%2C+by+that+excellency+which+he+has+given+them%3A+and+so+we+must+do+more+than+love+them%2C+we+must+honor+them.+If+it+be+here+demanded%3A+Why+did+not+God+make+all+men+excellent+alike+and+fit+to+be+superiors%3F+Answer%3A+God+made+men+of+finite+natures+and+therefore+of+such+condition+that+one+should+need+the+help+of+another%3A+for+which+end+the+woman+also+was+made+to+be+an+helper+to+the+man.+Besides%2C+seeing+men+grow+in+wisdom+and+abilities+for+several+%E3%80%88%E2%97%8A%E3%80%89+according+to+their+finite+capacities%2C+industry+and+education%2C+necessarily+it+follows+that+as+the+stars+differ+each+from+other+in+glory%2C+so+one+man+does+excel+another.+In+this+regard+the+elder+brother%2C+having+as+dignity+of+primogeniture%2C+so+more+maturity+of+years+and+reason+was+appointed+by+God+to+rule+over+the+rest+of+the+family.+Yet+God+the+King+of+kings+and+Lord+of+lords%2C+the+fountain+and+original+of+all+rule%2C+made+Moses+the+younger+brother+ruler+and+as+a+God+to+Aaron%2C+the+elder+brother%2C+and+preferred+David+before+his+elder+brethren%2C+and+Solomon+before+Adonijah+and+Absalom+when+He+first+framed+and+composed+a+national+government+in+his+own+people.+But+having+settled+the+platform+of+that+rule+He+intended+by+the+practice+of+David+and+Solomon+in+a+monarchical+course+%28the+best+of+all+kinds+of+governments+and+approved+by+God%2C+because+He+rested+in+it%29%2C+He+left+the+managing+of+that+kingdom+and+rule+to+the+true+and+lawful+heirs+of+David+in+all+after-times%2C+because+they+by+education+under+their+parents%2C+and+aptness+of+children+to+walk+in+the+steps+of+their+fathers+and+to+fit+their+spirits+and+carriage+to+what+they+are+born+to%2C+would+probably+best+perform+the+royal+and+weighty+charge+of+ruling+as+kings%2C+and+make+election+of+the+most+able%2C+active+and+faithful+instruments+to+assist+them+in+%E3%80%88%E2%97%8A%E3%80%89+their+great+affairs.%E2%80%9D%0A%0A%E2%80%94+Lancelot+Andrewes%2C+A+Pattern+of+Catechistical+Doctrine+at+Large%3B+or+a+Learned+%26+Pious+Exposition+of+the+10+Commandments+%28d.+1626%3B+1675%29+5th+Commandment%2C+ch.+2%2C+p.+321&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9a6c66249f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9a6c66249f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-love-charity/#:~:text=This%20we%20showed%20was%20the%20order,them%20in%20%E3%80%88%E2%97%8A%E3%80%89%20their%20great%20affairs&amp;text=This%20we%20showed%20was%20the%20order%20of%20love&amp;text=to%20assist%20them%20in%20%E3%80%88%E2%97%8A%E3%80%89%20their%20great%20affairs" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-80aa743a1a" data-kw="">
<blockquote><p>…in the use of all indifferencies, in our meals, in our feastings, and merry meetings, in our journeys, in our ordinary talk, and discourse, in our walks, in the actions of our ordinary vocations: Indeed the rule of God’s Word does not at all either command, or forbid the matter of such actions: but the manner of performing them comes under the rule: They are all to be done to the glory of God, in the name of Christ: every good creature is to be sanctified by the Word, and prayer: That command which God gave Abraham (to walk before Him [Gen. 17:1]) is not to be straitened unto the ordinances of God, but to be extended unto all deliberate acts of a man’s life and conversation, Gen. 17:1. Zechariah (in his prophecy of the general call or conversion of Jews, and gentiles) gives this for one character of such, as shall be converted, that they shall have a sacred and sanctified use of things common and indifferent: ‘In that day shall there be upon the bells of their horses, holiness unto the Lord, yea, every pot in Jerusalem and Judah shall be holiness unto the Lord of Hosts,’ Zech. 14:20-21. Not only acts of immediate worship, but all rationall actions, whatsoever, should be offered up as spiritual sacrifices acceptable unto God by Jesus Christ, 1 Pet. 2:5. The apostle exhorts the Romans to salute one another with a holy kiss, Rom. 16:16, this kiss was no religious rite in God’s worship, but a ceremony of civility; and therefore in itself a thing indifferent: And yet the apostle requires holiness for the qualification of it: All our civil actions ought to be such, as becomes saints; that is, so far forth holy for manner, that they be free from sin, and unto the glory of God: Indeed this is a strictness impossible unto lapsed man: But though we cannot exactly and perfectly observe it, yet we may sincerely and cordially endeavor it:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise concerning the Indifferency of Human Actions in A Second Part of The Mixture of Scholastical Divinity with Practical in Several Tractates</cite>, (1660), pp. 58-59</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-27b9fb99a7" data-kw="">
<blockquote><p>There is a twofold worship due only to God, internal and external.… Internal, which consists in the acts of the soul and actions answerable thereto. When the mind is most taken up with an object, and the heart and affections most set upon it, this is soul worship, and this is due only to God.… Now according to this distinction of worship there are two sorts of idolatry, 1. Open, outward idolatry.… 2. Secret and soul idolatry, when the mind and heart is set upon anything more than God; when anything is more valued, more intended; anything more trusted, more loved, or our endeavours more for any other thing than God. Then is that soul worship, which is due only to God … given to other things besides him. And this is as true, as heinous idolatry, as the former, though not so open, discernible, nor so much observed.… Secret idolaters shall have no inheritance in the kingdom of God. Soul idolatry will exclude men out of heaven as well as open idolatry. He that serves his lusts is as uncapable of heaven as he that serves, worships idols of wood or stone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (definition of soul idolatry)</span></figcaption>

</figure><figure class="quote" id="q-84fbff3845" data-kw="">
<blockquote><p>Now generally in the Decalogue is commanded the worship of God: that which is contrary to God’s worship is forbidden. The worship of God is either immediate, when moral works are immediately performed unto God: or mediate, when moral works are performed unto our neighbor in respect of God.</p></blockquote>

<blockquote><p>…it lies as a necessary duty upon all to worship and serve God. The Hebrew words and Greek are several and observable that express this worship, which are exactly handled among the learned; The ground of this worship is because He is the Jehovah, who giveth us our being, and all other mercies: It is therefore most natural and a most indispensable debt to acknowledge Him for his supreme excellency herein and to give Him a peculiar and proper worship. Now this worship and service is either internal, or external, or mixed, compounded of both; internal consists in our love of God above all things, faith and hope in Him, obedience to his commands, which the Scripture prefers before all external worship; External is that of adoration and inclination of the body, kissing the hand, bowing the knee, dedicating temples, altars, and offering of sacrifices; Mixed is compounded of both these, such as calling upon God’s name by petition and thanksgiving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652), section 3, sermon 27, p. 156</span></figcaption>

<blockquote><p>Early in the Reformation the liturgy of Strasbourg [Germany] eliminated the offertory. No collection was taken in the service of worship itself. Nevertheless a chest was put in each of the churches so that on leaving the church worshippers could deposit their alms. The collection of alms as people left worship became characteristic of Reformed churches. We hear of this being the practice of the Reformed Church of Augsburg [Germany]. In Basel [Switzerland], after the minister had given the Benediction, he was to remind the congregation to contribute to the care of the poor, and as the people left the service they put their alms in one of the alms chests which stood near the door.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hughes-oliphant-old.html">Hughes Oliphant Old</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Worship in Guides to the Reformed Tradition</cite>, (John Knox Press, 1984), p. 153</span></figcaption>

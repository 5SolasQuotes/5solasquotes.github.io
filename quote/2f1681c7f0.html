<main class="wrap"><figure class="quote" id="q-2f1681c7f0" data-kw="">
<blockquote><p>The fast is indicted [called and set] eight days before, and the causes laid open for preparing of the people for humiliation (as Joel 2:1-3; Isa. 22:12,13). We have no anniversary [annual] and set fasts or feasts either, because God Himself by his judgment imminent, or already inflicted, or by permitting his people to follow their own ways, calls to fasting and mourning (Isa. 22:13, Joel 2:1-6, etc.), and so by his mercies and wonderful deliverances calls to extraordinary joy of thanksgiving (Ps. 118:24). The doctrine of the Law is preached (as Joel 2 and Isa 58), and the fast observed with abstinence from meat and drink, and carnal and ordinary pleasures (Joel 2:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland (1642), Chapter 20, Article 7</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/fasting-and-watchfulness.html">Fasting and Watchfulness</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7a244c1171" data-kw="">
<blockquote><p>We honor the martyrs with the honor of love and fellowship, which we also give to holy people in this life, as we acknowledge that their hearts were prepared for such suffering for the truth of the Gospel. But they are venerated even more in death, as they are now free from all uncertainties. And we honor them with greater confidence, as we now praise them as victors living in a more blessed life, rather than still fighting in this life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System of Theology (Hanau, 1609; 1615), vol. 2, bk. 10, ‘Moral Virtues’ Latin | 17. ‘On the Honor to Be Shown to Deceased Saints’ | Augustine’s words are:</cite></span></figcaption>

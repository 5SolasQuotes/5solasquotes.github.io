<main class="wrap"><figure class="quote" id="q-e3c4b7bc33" data-kw="">
<blockquote><p>Life Eternal is the life of glory, wherein the soul, joined to our body, enjoys God forever, being advanced to the highest top and height of her felicity. The Cause of this life is God, to wit, the Father the efficient, the Son the meritorious, and the Holy Ghost the sealing and applying cause. The Matter, which has the respect of the subject, are those good things, which neither eye has seen, nor ear heard, nor can the mind of man comprehend. That which is of the Object, are all the blessed and elect. The Form is the most perfect knowledge, vision, and fruition of God Himself, and the exceeding felicity &amp; blessedness of man, which accompanies the same, which also consists both in the separation, and absence of all evil things, and in the participation, and presence of all good things; both are both perfect and eternal. The End is the glory of God’s grace, and the glorifying of the elect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity… (London, 1610), bk. 3, ch. 8, ‘Of Man’s Estate After this Life’ | The Part Confirming</cite>, pp. 589-90</span></figcaption>

nk">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5dd7c3879c" data-kw="">
<blockquote><p>Now in all dwelling in Christ there is a continual acting of life by believing, joying, resting in God. As Phillip says, Jn. 14:8, ‘Lord, show us the Father and it sufficeth us.’ Here life seeks a soul-satisfying union with life, for life is only a satisfactory object to life. Living things seek no dead things as such to be their happiness if reason do rightly act them, and God as revealed in Jesus Christ is that in which the saints find a soul-sufficiency for themselves; and the act of seeing God in Christ, whether in this life or in the life to come, is an act of life, for the soul lives in the ocean, sea, and bosom of a fair eternal truth. But does it act there? yea, it does, and the Scripture expresses its acting by seeing God, drinking the fountain of life. Then the soul, thus in Christ, drinks in love and milks, and sucks in the soul-rejoicing irradiations of Christ, and Christ letting out the breathings of the sweetness of his excellency on the face of the soul draws and sucks in reciprocally acts of admiration and wondering, Cant. 2:8, ‘The voice of my beloved, behold he cometh leaping upon the mountaines, and skipping on the hills;’ ‘behold’ is a word of wonder, 1 Jn. 3:1, ‘Behold what manner of love the Father hath bestowed on us.’ Not love only, but the manner and the kind of the Father’s love in Christ, is a world’s wonder, and 2 Thess. 1:10, Christ when he comes shall be wondered in them that believe. 2. Then again when we see and enjoy the drawing loveliness of Christ, He as the fountain and well of life pours in, in our intellectuall love and in the glancings and rays of our understanding, acts of divine light, lumps of fresh love from the spring of heaven’s love, and the soul opens its mouth wide and takes in the streams of Christ’s nectar, honey and milk, his consolations and love-breathings; and in his light we seeing light, and in his love, feeling love, He makes out light and love (as it were) coeternal with borrowed eternity; and we go along with the out-shinings of Christ’s bright countenance, to shine in borrowed light, to flame in borrowed coals of love; and as Christ is said to feed his flock among the lilies, the garden of Christ, his Church being the common pasture for the lambs of the flock; so He feeds the souls of the saints that enjoy Him, with the marrow, fatness and dainties of his light and love that shine in his face, even as the oil feeds the lamp; but with this difference, Christ’s dainties are not lessened because we feed upon them, as the oil is consumed with burning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, pp. 360-61</span></figcaption>

<blockquote><p>We say that the said good works are pleasing and acceptable to God, and indeed have their reward from God, yet not a reward of any preceding merit properly so-called, which would have either an equality with the prize of eternal life, or even a proportion to it; but a reward that is only gracious, resting on the benignity and mercy of God.</p></blockquote>

</figure><figure class="quote" id="q-05565fda67" data-kw="">
<blockquote><p>Life eternal is the highest degree of blessedness, in which we shall be made partakers of Christ’s glory, enjoying the sight of God, and heavenly joys forever and ever. The Rules: … III. That eternal happiness consists in our freedom from all evil; in the variety, magnitude and eternity of joys… IV. The variety of joys, is considered in the glorification of man, in the delights of heavenly mansions, in the blessed society of the saints, but chiefly in the union with God… … II. There shall be such a communion with God, that we shall see Him without end, love Him without tediousness, and praise Him without wearisomeness… XII. So great shall be that joy, that neither our tongues can express it, nor our minds conceive it… XIII. Neither shall any bounds be set to this happiness, nor shall we ever fall from it, but it shall continue forever…</p></blockquote>

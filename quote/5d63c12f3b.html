<main class="wrap"><figure class="quote" id="q-5d63c12f3b" data-kw="">
<blockquote><p>My Brethren and I, that have had Occasion here to confer about you, see a Beauty in the Providence of your being in Communion with the English Church; otherwise such great Confluences from among them, had not attended your Ministry, nor consequently received the Benefit, or reaped the Advantage by it, which so many of them have done.

And tho’ infinite Wisdom has made and may yet make this an alluring Bait to draw them forth; yet as England’s Reformation at first (from Popery and its superstitious and ceremonial Services) however great and glorious, was far from being to full as that of some other Protestant Churches, particularly that of Scotland; so we would fain hope, that, when a new and general Reformation shall be set on Foot, some more at least of the Rags of that Romish Church will be dropp’d, such as (abstracting at present from the Subject of Church-Government) many useless Rites and Customs relating to Worship, that have no scriptural Foundation.

This is what some of the most pious and eminent Divines of your Communion, have wished to see reformed, knowing that many of these were retained at first, only under a View of Reforming gradually, and from some prudential Considerations; and knowing also that the continued Retaining of these Things, which the reforming Fathers designed gradually to cast off, has been more stumbling to the Friends, than ever it was gaining to the Enemies of the Reformation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Letter from the Reverend Mr. Ralph Erskine to the Reverend Mr. Geo. Whitefield</cite>, (Philadelphia: B. Franklin, 1741), pp 5-6.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f6e533dfc7" data-kw="">
<blockquote><p>I alleging, what was wrong in the administration of our laws, either in church or state, is more through the default of some of the administrators, than either to the laws now in being, or yet to the supreme magistrate: from which I see I cannot state my sufferings upon anything amiss, although they are still grievous; neither can I have peace to refuse obedience to the civil magistrate in all things accoding to the Word of God. This my protesting, and refusing to join with them, enraged them exceedingly against me; and as their scourge of tongues was grievously bent against others, so now was it against myself, in a most grievous, unjust and unreasonable manner, and very hypocritically gave it out far and near… Thus I left that party of the dissenters who now commonly go under the name of Mr. M’Millan’s people; for the Quakers, Gibb’s faction, the Harlaw’s faction, and episcopacy by bishops, I had never any thing to do with them in matters of religion, neither directly nor indirectly; yea, my soul abhors all their evil ways: but I lieved retired by myself; all which time the Lord pitied me, and restored me to some measure of communion with Himself. Praise, praise. Amen…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-nisbet.html">James Nisbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Private Life of the Persecuted</cite>, (Edinburgh: Oliphant, 1827), pp. 237-38</span></figcaption>

</figure><figure class="quote" id="q-b81c5cf4e4" data-kw="">
<blockquote><p>At the Revolution, all the faithful ministers were earnest for the formal recognition of the Covenants. This however was delayed, the time not being suitable. The General Assembly, however, in its acts 1690, 1700, 1701, mention breach of covenant as a cause of fasting. (Wodrow’s Correspondence, vol. i. pp. 124, 125.) Even so late as 1726, after a debate with some brethren that were for putting in the covenants more plainly, they were agreed to be included under the more courtly phraseology of solemn engagements to God. (Wodrow, vol. iii. p. 256.) Till after the secession all the eminent evangelical ministers continued to maintain the permanent obligation of the covenants.

It was not until Moderatism had destroyed the spiritual understanding of the church, that there ceased to be men who gave warning to the nation of the sin of covenant-breaking. About 1727, that spurious spirituality which has since done so much injury, made its appearance in Mr [John] Glass and his adherents. Among other things they denied the obligation of our covenants. Various ministers of the Establishment distinguished themselves in defending what till then were the common principles of the better party in the church. One of these subscribes himself, “a well-wisher of the Covenanted Reformation;” another subscribes himself, “a lover of peace and truth,” – both published in 1727, and both maintain the warrantableness and continued obligation of national covenants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-white.html">William White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Covenant the best Defence of Christ’s crown; or our National Covenants Scriptural, Catholic, and of Permanent Obligation</cite>, (Edinburgh: W. P. Kennedy, 1844), p. 89.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

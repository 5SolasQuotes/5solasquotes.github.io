<main class="wrap"><figure class="quote" id="q-1ffe2b06fc" data-kw="">
<blockquote><p>[The first time was when the ceremonial law was obliging under the Mosaic system.] The second time was from the ascension of Christ, till about the time of the destruction of the Temple and city: in which ceremonies ceased to bind conscience and remained indifferent. Hereupon Paul circumcised Timothy: the apostles after Christs ascension, as occasion was offered were present in the temple, Acts 3:1; And the council of Jerusalem tendering the weakness of some believers, decreed that the Church for a time should abstain from strangled [animals] and blood. And there was good reason of this, because the Church of the Jews was not yet sufficiently convicted that an end was put to the ceremonial law by the death of Christ. In the third time, which was after the publishing of the Gospel, ceremonies of the Jews Church became unlawful, and so shall continue to the world’s end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience</cite>, (1596), pp. 21-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-24dd033885" data-kw="">
<blockquote><p>Obiection II. There was blood and things strangled forbidden in the council at Jerusalem after Christ’s ascension, Acts 15. Answer. It was forbidden only in regard of offence and for a time, so long as the weak Jew remained weak, not in regard of conscience. And therefore afterward Paul says that all things, even blood itself was lawful, though not expedient, in regard of scandal (1 Cor. 6:12). And to the pure all things are pure (Titus 1:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience</cite>, (1606), p. 541</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-b2d8991f58" data-kw="">
<blockquote><p>Here, however, where God compares polygamy with divorce, he says that polygamy is the worse and more detestable crime; for the husband impurely connects himself with another woman, and then, not only deals unfaithfully with his wife to whom he is bound, but also forcibly detains her: thus his crime is doubled. For if he replies and says that he keeps the wife to whom he is bound, he is yet an adulterer as to the second wife: thus he blends, as they say, holy with profane things; and then to adultery and lasciviousness he adds cruelty, for he holds under his authority a miserable woman, who would prefer death to such a condition; for we know what power jealousy has over women. And when any one introduces a harlot, how can a lawful wife bear such an indignity without being miserably tormented?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Malachi</cite>, 2:16</span></figcaption>

<blockquote><p>…and in obedience to the king all are to do their duty, and his care is universal over all, and his end [is] universal. That which is the end of pastors, doctors, elders, deacons, lawyers, judges, etc. is, in an universal intention, the king’s end, even God’s honor, by procuring in a regal way, that all do their duty in keeping the two Tables of the Law, and so is he the great politic-wheel moving by his royal motions all the under wheels toward that same end.</p></blockquote>

</figure><figure class="quote" id="q-89da217c34" data-kw="">
<blockquote><p>§18. Of a child’s carriage in case a parent provide an unfit mate or none at all. … 2nd Question, “What if the parent be negligent, and in due time provide no fit match? May not the child provide one for himself? Answer: A parent’s negligence is not a sufficient pretext to make a child [wholly] cast off that subiection which he owes to his parent. Yet I deny not but that a child knowing where a fit match is to be had, may make known as much to his parent (as Sampson did) and crave both his consent and help thereunto, Judg. 14:2. And if his parent give no ear to his humble suit, he may use the mediation of his kindred or other friends. Yea if necessity require that the child be married, and his parent add wilfulness to negligence, and will not be moved at all, neither by the humble suit of his child, nor by the earnest solicitation of any friends, means may be made to the Magistrate (who is in God’s place over the parent as well as over the child, and ought to afford relief unto the child) and what the Magistrate does in that case is as good a warrant to the child as if the parent had done it. The like means may be used if a parent be an idolater, heretic, or atheist, and will not yield that his child be married to any but to one of his own profession and disposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Domestical Duties… (London, 1662), the 5th Treatise, the Duties of Children, pp. 449-50</span></figcaption>

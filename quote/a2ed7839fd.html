<main class="wrap"><figure class="quote" id="q-a2ed7839fd" data-kw="">
<blockquote><p>The passions of the [human] soul are perfections in those, in which it is a perfection to seek what is lacking, and to flee what is hurtful: they are not perfections in Him, whose Will is satisfied only with His own Sufficiency; and who is not able to receive from another source any good that He might desire, and whom no evil is able to threaten, that He should fear; therefore, nothing is able to be presented to Him, by the impulse of which His Will might be moved from its immovable state.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernhard-de-moor.html">Bernhard De Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Didactic-Elenctic Theology (1761-1772), IV:26, ‘The Impassibility of God’</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-860e8e6f5a" data-kw="">
<blockquote><p>…his virtues follow; which as they have their seat in man, in the will and affections, so it is not inconvenient for method’s sake to refer them to the same in God. Gods virtues are his essence considered, as it always works orderly, fitly and agreeably to perfect reason. They are not things differing from his essence as in us, but we must conceive of them according to our capacity, and handle them distinctly. By virtues we understand first in general the idea of virtue, or the chiefest moral perfection, by which God is in Himself absolutely the best, and in respect of which all the virtues of angels and men are only slender shadows and representations.</p></blockquote>

<blockquote><p>Hence although love considered affectively and on the part of the internal act is equal in God (because it does not admit of increase and diminution), yet regarded effectively (or on the part of the good which He wills to anyone) it is unequal because some effects of love are greater than others.</p></blockquote>

</figure><figure class="quote" id="q-c7a35ec843" data-kw="">
<blockquote><p>Inasmuch, moreover, as the divine affections are understood as descriptive of God’s movement or egress toward the finite order, they are not only to be understood as communicable attributes par excellence, they are also attributes defined primarily in their relationship to finite objects. It is by these affectiones or virtues that God sustains his relations with creatures–they are the preeminent example of the so-called communicabilia or relative attributes. (Mastricht, Theoretic-practica theologia, II.xv.19) In attempting to define the issue still more precisely, Owen distinguished between ‘attributes of Deity which, in order to their exercise, require no determined object antecedent to their agress’ and ‘attributes which can in no wise have an egress or be exercised without an object predetermined, and, as it were, by some circumstances prepared for them.’ (Owen, Dissertation of the Divine Justice, in Works, X, p. 508) The affections fall, clearly, into the latter category, the virtues into the former.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD (Baker, 2003), pt. 2, ch. 6.3, 3. ‘Doctrinal Conclusions’</cite>, pp. 559-60</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><figure class="quote" id="q-6f12ebe81a" data-kw="">
<blockquote><p>First, in general, that God is perfect and perfectly blessed, I suppose will not be denied; it cannot be but by denying that He is God. He that is not perfect in Himself and perfectly blessed is not God. To that which is perfect in any kind nothing is wanting in that kind. To that which is absolutely perfect nothing is wanting at all. He who is blessed is perfectly satisfied and filled, and has no farther desire for supply. He who is blessed in Himself is all-sufficient for Himself. If God want or desire any thing for Himself, He is neither perfect nor blessed. To ascribe, then, affections to God properly [as his Socinian opponent does]… is to deprive Him of his perfection and blessedness. 1. Affections, considered in themselves, have always an incomplete, imperfect act of the will or volition joined with them. They are something that lies between the firm purpose of the soul and the execution of that purpose.^ The proper actings of affections lie between these two ; that is, in an incomplete, tumultuary volition. That God is not obnoxious to such volitions and incomplete actings of the will, besides the general consideration of his perfections and blessedness premised, is evident from that manner of procedure which is ascribed to him. His purposes and his works comprise all his actings. As the Lord hath purposed, so hath he done. ‘He worketh all things after the counsel of his own will.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ch. 4, ‘Of the Attribution of Passions &amp; Affections, Anger, Fear, Repentance unto God’ of Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined in Works, vol. 12</cite>, p. 109</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

<blockquote><p>Why would Men oblige us to believe things that are incredible, to justify the Church of Rome? They tell us, That the Priesthood of their Priests, is the same as that of Jesus Christ. I know not whether Heaven and Earth are more distant, and if Light and Darkness be more different. Jesus Christ is God, those Priests are Men. Jesus Christ abides for ever; those Priests die. No Man succeeds Jesus Christ; Priests succeed one the other. Jesus Christ offered not for himself; the Priests offer for their own Sins, as for those of the People. Jesus Christ is Holy, separate from Sinners; Priests are often engaged into great Disorders. Jesus Christ hath offered once one sole Sacrifice; these offer every day, and reiterate their Sacrifice.

Jesus Christ finishes his Sacrifice in the Holy Places not made with hands; Priests make their Sacrifices upon Altars of Stone, and in Temples made by Man’s hand. In fine, Melchisedeck was a singular Man, and only; it must needs be therefore, that he who was to sustain that Priesthood, whereof his was the Figure, should be a singular and only Person; but the Priests are in great Numbers. After that, can Men deny, that Priests are Sacrifices much rather like the Order of Aaron, than that of Melchisedeck? And if it be so, we say it once more, The Establishment of their Priesthood destroys that of Christ by good Consequence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-jurieu.html">Pierre Jurieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A preservative against the change of religion, or, A just and true idea of the Roman Catholick religion, opposed to the flattering portraictures made thereof, and particularly to that of my Lord of Condom</cite>, trans. Claudius Gilbert (London: Thomas Cockerill, 1683), pp 157-58.</span></figcaption>

<blockquote><p>There is now no national membership in the Church of Christ, limited to one hereditary family or favored race; but in the fellowship of one faith and one spirit, all, of whatever tribe or tongue or nation, are one with Christ, and one with each other… Earthly and outward causes of separation are overborne and controlled by this higher principle of unity. Separation in race or tongue is no separation to be accounted of among the followers of Christ, who are joined together in that one Spirit. Distance on the earth is no distance to be regarded between those who are partakers together of the same Holy Ghost. Local churches or societies, divided in place and outward worship, become merged in the oneness of a higher fellowship. Separated in the outward act of worship, they are joined in the communion of the same Spirit. The assemblies of Christians in every quarter of the globe, who worship God in sincerity and truth, are one in such a sense as their distance from one another admits of; and they must all be regarded as branches of the universal Church of Christ throughout the world, the great community of believers, separated by distance and kindred and tongue, who cannot meet together in the body, but who really meet together in the Spirit. The invisible Church of Christ on earth is local, but it is also catholic.</p></blockquote>

<blockquote><p>We reject therefore these opposite opinions following… 2. That a particular visible Church is by the Word of God limited to such bounds as that of necessity, [that] they may be ordinarily contained and ought to meet in one place for performing the public worship of God with mutual edification. For as we have showed that the consitution of such a church, as by reason of their multitude or some other cause, cannot ordinarily meet in one place, does well agree with the Word of God and apostolical institution. For the essence and lawful constitution of a church depends not on the outward circumstance of place, but on a due profession of faith, and bond of holy communion. For as [William] Ames says, ‘that same in profession does constitute a Church-visible, which in reality and its internal nature constitutes the Church-mystical, that is, faith.’ Marrow of Theology, bk. 1, ch. 32, thesis 7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 41-42 of ch. 3, ‘Of an Institute Visible Church’ in A Consideration of Certaine Controversies at this Time Agitated in the Kingdome of England, Concerning the Government of the Church of God (1645) Apollonius was a Dutch presbyterian, who is arguing against the English Independents.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“We reject therefore these opposite opinions following… 2. That a particular visible Church is by the Word of God limited to such bounds as that of necessity, [that] they may be ordinarily contained and ought to meet in one place for performing the public worship of God with mutual edification. For as we have showed that the consitution of such a church, as by reason of their multitude or some other cause, cannot ordinarily meet in one place, does well agree with the Word of God and apostolical institution. For the essence and lawful constitution of a church depends not on the outward circumstance of place, but on a due profession of faith, and bond of holy communion. For as [William] Ames says, ‘that same in profession does constitute a Church-visible, which in reality and its internal nature constitutes the Church-mystical, that is, faith.’ Marrow of Theology, bk. 1, ch. 32, thesis 7.”

— Wilhelm Apollonius, Other citations (work not named), pp. 41-42 of ch. 3, ‘Of an Institute Visible Church’ in A Consideration of Certaine Controversies at this Time Agitated in the Kingdome of England, Concerning the Government of the Church of God (1645) Apollonius was a Dutch presbyterian, who is arguing against the English Independents.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+reject+therefore+these+opposite+opinions+following%E2%80%A6+2.+That+a+particular+visible+Church+is+by+the+Word+of+God+limited+to+such+bounds+as+that+of+necessity%2C+%5Bthat%5D+they+may+be+ordinarily+contained+and+ought+to+meet+in+one+place+for+performing+the+public+worship+of+God+with+mutual+edification.+For+as+we+have+showed+that+the+consitution+of+such+a+church%2C+as+by+reason+of+their+multitude+or+some+other+cause%2C+cannot+ordinarily+meet+in+one+place%2C+does+well+agree+with+the+Word+of+God+and+apostolical+institution.+For+the+essence+and+lawful+constitution+of+a+church+depends+not+on+the+outward+circumstance+of+place%2C+but+on+a+due+profession+of+faith%2C+and+bond+of+holy+communion.+For+as+%5BWilliam%5D+Ames+says%2C+%E2%80%98that+same+in+profession+does+constitute+a+Church-visible%2C+which+in+reality+and+its+internal+nature+constitutes+the+Church-mystical%2C+that+is%2C+faith.%E2%80%99+Marrow+of+Theology%2C+bk.+1%2C+ch.+32%2C+thesis+7.%E2%80%9D%0A%0A%E2%80%94+Wilhelm+Apollonius%2C+Other+citations+%28work+not+named%29%2C+pp.+41-42+of+ch.+3%2C+%E2%80%98Of+an+Institute+Visible+Church%E2%80%99+in+A+Consideration+of+Certaine+Controversies+at+this+Time+Agitated+in+the+Kingdome+of+England%2C+Concerning+the+Government+of+the+Church+of+God+%281645%29+Apollonius+was+a+Dutch+presbyterian%2C+who+is+arguing+against+the+English+Independents.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2d6dcbbc1b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2d6dcbbc1b.html">Permalink</a><a class="src" href="https:/

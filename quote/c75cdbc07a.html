<main class="wrap"><figure class="quote" id="q-c75cdbc07a" data-kw="">
<blockquote><p>The grace which is exhibited in or by the sacraments rightly used, is not conferred by any power in them; neither doth the efficacy of a sacrament depend upon the piety or intention of him that doth administer it: but upon the work of the Spirit, and the word of institution, which contains, together with a precept authorizing the use thereof, a promise of benefit to worthy receivers. … Although it be a great sin to contemn or neglect this ordinance, yet grace and salvation are not so inseparably annexed unto it, as that no person can be regenerated, or saved, without it; or, that all that are baptized are undoubtedly regenerated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 27.3; 28.5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b107b86234" data-kw="">
<blockquote><p>Question 72. Is then the external baptism with water, the washing away of sin itself? Answer. Not at all, for the blood of Jesus Christ only, and the Holy Ghost, cleanse us from all sin. …So when it is said, “Baptism saves us,” is “the washing of regeneration,” and “the washing away of sin;” it is the same thing as to say, Baptism is the sign of all these things. Question 73. Why then doth the Holy Ghost call baptism “the washing of regeneration,” and “the washing away of sins?” Answer. God speaks thus not without great cause, to wit, not only thereby to teach us, that, as the filth of the body is purged away by water, so our sins are removed by the blood and Spirit of Jesus Christ; but especially that, by this divine pledge and sign, he may assure us that we are spiritually cleansed from our sins as really as we are externally washed with water.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Lord’s Day 27, Q. 72–73</span></figcaption>

</figure><figure class="quote" id="q-b945658aed" data-kw="">
<blockquote><p>The first, the most obvious, and the most decisive argument against this doctrine is, that, so far as any work or act of the sinner is concerned, the Bible everywhere teaches that the only indispensable condition of salvation is faith in Jesus Christ.… Whosoever believes on the Son hath everlasting life. This stands firm. It matters not to what Church he may belong; it matters not whether he be Jew or Gentile, bond or free, learned or unlearned, good or bad, baptized or unbaptized, whosoever believes shall be saved.… Neither does the Bible anywhere teach that Christian baptism effects either pardon or regeneration in those still out of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Direct Arguments against the Doctrine of Baptismal Regeneration”</span></figcaption>

</figure><figure class="quote" id="q-9cbaa3a91f" data-kw="">
<blockquote><p>In this matter of baptism — if I may be pardoned for saying it — I can only conclude that all the doctors have been in error from the time of the apostles. . . . All the doctors have ascribed to the water a power which it does not have and the holy apostles did not teach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Baptism</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“In this matter of baptism — if I may be pardoned for saying it — I can only conclude that all the doctors have been in error from the time of the apostles. . . . All the doctors have ascribed to the water a power which it does not have and the holy apostles did not teach.”

— Huldrych Zwingli, Of Baptism">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+this+matter+of+baptism+%E2%80%94+if+I+may+be+pardoned+for+saying+it+%E2%80%94+I+can+only+conclude+that+all+the+doctors+have+been+in+error+from+the+time+of+the+apostles.+.+.+.+All+the+doctors+have+ascribed+to+the+water+a+power+which+it+does+not+have+and+the+holy+apostles+did+not+teach.%E2%80%9D%0A%0A%E2%80%94+Huldrych+Zwingli%2C+Of+Baptism&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9cbaa3a91f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9cbaa3a91f.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-747d987750" data-kw="">
<blockquote><p>Peter also says that “baptism also doth now save us” (1 Peter 3:21). For he did not mean to intimate that our ablution and salvation are perfected by water, or that water possesses in itself the virtue of purifying, regenerating, and renewing; nor does he mean that it is the cause of salvation, but only that the knowledge and certainty of such gifts are perceived in this sacrament. This the words themselves evidently show. For Paul connects together the word of life and baptism of water, as if he had said, by the gospel the message of our ablution and sanctification is announced; by baptism this message is sealed. And Peter immediately subjoins, that that baptism is “not the putting away of the filth of the flesh, but the answer of a good conscience toward God, which is of faith.” Nay, the only purification which baptism promises is by means of the sprinkling of the blood of Christ, who is figured by water from the resemblance to cleansing and washing. Who, then, can say that we are cleansed by that water which certainly attests that the blood of Christ is our true and only laver? …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.15.2</span></figcaption>

<blockquote><p>47. Yet because the lifting up of the heart to God is together required, Simul &amp; consequenter, and going along with the thing that is sung, and it is also the end of that meditation; therefore we are said to sing in our heart to the Lord, Col. 3:16, and psalms that are sung have the consideration of prayers.

48. But because this religious melody hath the respect of prayers, therefore it is not so fit that the Decalogue, and other such like, which do not partake the nature of prayer, be turned into meter and be sung instead of psalms. … 53. But in the melody of singing, because it tendeth to our mutual edification, attention, and stirring up of pious affections among us one toward another, Col. 3:16, therefore all do join their voices together, 1. Chron. 16:35; Mk. 14:26.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity Drawn out of the Holy Scriptures, and the Interpreters thereof, and brought into Method</cite>, (London: 1642), Book 2, ch. 9, ‘Of Prayer’, p. 284</span></figcaption>

</figure><figure class="quote" id="q-eb80694733" data-kw="">
<blockquote><p>When one examines the Psalms of David with Hymns and Spiritual Songs, which was the end-product of this synodical action, one is immediately struck by the fact that the church was concerned with providing the texts of the psalms but not with preserving the Genevan tunes. All but a few of the psalms were presented in four-line stanzas in short metre, common metre, or long metre. In spite of this radical departure from the continental Reformed practice, the book retained settings of each of the 150 psalms and continued to do so in each succeeding psalter until 1869. In the edition of the hymnal published in that year the psalms had nearly disappeared among the 1007 hymns.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/various.html">Various</a></span><span class="wk"><span class="lbl">Work:</span> <cite>We Used to Sing Only Psalms — What Happened? 1987</cite>, [Norman] Kansfield comments:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-b68b133225" data-kw="">
<blockquote><p>Now these words (which are the known division of David’s psalms, and expressly answering to the Hebrew words Shurim, Tehillim, and Mizmorim, by which his psalms are distinguished and entitled), being so precisely used by the apostle in both places, do plainly point us to the Book of Psalms.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-aafb2b9365" data-kw="">
<blockquote><p>Let the most bitter-spirited antagonist ingenuously say, ‘Is not the whole Book of Psalms (so often avowed, cited, and used by Christ) Sepher-Tehillim, a Book of Praises, composed for the Churches use unto the end of time [in contrast to adding instrumentation]?’ or think you that this so excellent a part of Scripture was written only to inform us what the saints of God did before us, but not what we also must do by their example [of playing instruments in worship]? As for the abuse of music, we abominate it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon Delivered in the Cathedral Church of Canterbury, concerning church-music</cite>, (London, 1663), p. 15. This sermon was given shortly after the Restoration and Great Ejection of 1662, in order to defend in Reading’s church, the cathedral church in Canterbury, that instruments were lawful in public worship, contra the dissenting puritans. Cathedral churches usually had more ornate music than parish churches.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

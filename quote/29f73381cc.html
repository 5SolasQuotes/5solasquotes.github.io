<main class="wrap"><figure class="quote" id="q-29f73381cc" data-kw="">
<blockquote><p>The glory of God must be principally in our minds, and nearest our hearts in all our supplications. Christ prays first for his own glory, but as a means for the glory of his Father, before he prays particularly for the good of the church: ‘Glorify thy Son, that thy Son may also glorify thee;’ and only for such a glory for himself, whence the glory of the Father might spring with a greater brightness upon the Son; for, by the raising Christ, and manifesting the glory of his deity, the Father would be glorified in full declarations of himself, as the Father of our Lord Jesus Christ, the author of the great redemption, as a God that so loved the world as to send his Son into it for the redemption of it. ‘Hallowed be thy name,’ is the first petition in the Lord’s prayer.

The glory of God must weigh more in our thoughts than our private interest: his glory is to be our end in our common actions, 1 Cor. x. 31, much more in acts of religious worship. If another end be higher in our hearts, in our prayers, though we pray to God, we really worship an idol, viz. self; though God be the object, yet he is not the end. We must seek to God for all blessings, with the same end for which God gives them; he gives us the highest for his glory: Eph. i. 6, ‘He hath accepted us in his beloved, to the praise of the glory of his grace.’ We must beg for self subordinately, but for God’s glory ultimately. Our Saviour begged glory for himself, that he might return glory to his Father. To beg anything for ourselves principally, is the prayer of some lust, ambition, or covetousness; to beg anything for God’s glory is a prayer of grace, like that of our Saviour’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>, A Discourse on the Knowledge of God</cite>, in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f2ebe23f33" data-kw="">
<blockquote><p>The means whereby men may stir up their dull and heavy hearts, &amp; so prepare themselves to prayer, are three. The first is to read diligently the word of God, concerning those matters about which they are to pray: &amp; what then? This will be a means not only to direct him, but also to quicken the heart more fervently to deliver his prayer.

This is evident by a comparison. The beams of the sun descending, heat not before they come to the earth, or some solid body where they may reflect, and then by that means the earth and air adjoining is made hot: even so the Lord sends down unto us his blessed word, even as beams and the goodly sunshine, and thereby he speaks to our hearts: now when we make our prayers of that which we have read, God’s word is as it were reflected, and our hearts are thereby warmed with the comfortable heat of God’s Holy Spirit, to pour out our prayers to God more fervently.

The second means is to pray to God that he would strengthen us with his Spirit, that we might be able to pray as it is practised, Psal. 143.1. The third means is the consideration of God’s most glorious majesty, wherein he is willing; and secondly his omnipotence, whereby he is able to grant our requests.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Lord’s Prayer: In the way of Catechising, serving for Ignorant People</cite>, in The Work of William Perkins (Cambridge: John Legate, 1600), pp 530-31.</span></figcaption>

<blockquote><p>Nay, here idolatry is manifest; since the worship of adoration and religious invocation is due to God alone (Ps. 50:15; Matt. 4:10; Rom. 10:17), nor can the calves of the lips be offered to the Saints, nor the incense of prayers burned to them, without their thereby being reckoned omniscient, omnipotent, omnipresent, and immense — able in a moment to be present to all who invoke them, in various places, on various matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-maresius.html">Samuel Maresius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Concise Refutation of Papism</cite>, p. 17</span></figcaption>

</figure><figure class="quote" id="q-64f2ad3033" data-kw="">
<blockquote><p>Thy Word (O Lord) is holy and pure, as is thine own Majesty, and being sincerely preached, worketh either to the salvation or condemnation of the hearers. And we all that are here assembled before thee at this time, are of uncircumcised hearts and ears: utterly unworthy by reason of that sin, wherein we were conceived and borne; and of those actual transgressions that we have multiplied against thy Majesty, in thought, word and deed, from our first being, until this present hour; once to set foot into thy Temple or to hear thy Word at all. Utterly unfit and unable by reason of our custom in sin, and the hardness of our hearts to profit by it, when as we hear it.

So that (Lord) we are at this time in danger, to be unprofitable hearers of thy holy Word, and by being unprofitable bearers of the same, we are in danger of thy heavy displeasure. Yet forasmuch as it hath pleased thee in mercy to command us this exercise, to appoint it to be the only ordinary means, whereby thou wilt work Faith and repentance in thy children, and the principal means whereby thou wilt increase them, to promise also graciously that thou wilt accompany the outward ministry of thy Word, with the inward grace and blessing of thy Spirit, in the hearts of them that shall be reverently and faithfully exercised in the same:

We therefore in humble obedience, to this thy holy commandment, and in full affiance and confidence in this thy gracious promise, are bold to present our selves before thee at this time: Beseeching thee in thy sons blood to wash away all our sins, so as they may never be laid to our charge again, either in the world to come to our condemnation, or at this time to bring a curse upon this our exercise.

Good Lord so sprinkle that blood of thy Son upon our consciences, that we may be assured of thy love and favour towards us in him. By it sanctify us at this time, and thy word to our uses, opening and enlightening our understanding so as we may be able to understand and conceive of thy word aright, strengthening our memories so as we may be able to remember it, softening our hard and stony hearts, so as we may be able to believe it, to yield unto it, to apply it to our own souls, to meditate and confer thereupon, to practise it in our lives, and conversations, to stir up one another to the obedience thereof.

That this our exercise may tend to the increase of our knowledge, and of our obedience, of our Faith, and of repentance, the glory of thy blessed name, and the everlasting comfort of our own souls: Hear us (O Lord) in these our requests, in what else soever thou knowest good for us, or any of thy Church: for Jesus Christ his sake our Lord and only Saviour. In whose name we continue our prayers unto thee, as he himself hath taught us, Saying,

Our Father which art in Heaven, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The doctrine of fasting and prayer, and humiliation for sin. Delivered in sundry sermons at the fast appointed by publique authority, in the year 1625</cite>, (London: Edward Brewster, 1633), unpaginated.</span></figcaption>

rld+to+come+to+our+condemnation%2C+or+at+this+time+to+bring+a+curse+upon+this+our+exercise.%0A%0AGood+Lord+so+sprinkle+that+blood+of+thy+Son+upon+our+consciences%2C+that+we+may+be+assured+of+thy+love+and+favour+towards+us+in+him.+By+it+sanctify+us+at+this+time%2C+and+thy+word+to+our+uses%2C+opening+and+enlightening+our+understanding+so+as+we+may+be+able+to+understand+and+conceive+of+thy+word+aright%2C+strengthening+our+memories+so+as+we+may+be+able+to+remember+it%2C+softening+our+hard+and+stony+hearts%2C+so+as+we+may+be+able+to+believe+it%2C+to+yield+unto+it%2C+to+apply+it+to+our+own+souls%2C+to+meditate+and+confer+thereupon%2C+to+practise+it+in+our+lives%2C+and+conversations%2C+to+stir+up+one+another+to+the+obedience+thereof.%0A%0AThat+this+our+exercise+may+tend+to+the+increase+of+our+knowledge%2C+and+of+our+obedience%2C+of+our+Faith%2C+and+of+repentance%2C+the+glory+of+thy+blessed+name%2C+and+the+everlasting+comfort+of+our+own+souls%3A+Hear+us+%28O+Lord%29+in+these+our+requests%2C+in+what+else+soever+thou+knowest+good+for+us%2C+or+any+of+thy+Church%3A+for+Jesus+Christ+his+sake+our+Lord+and+only+Saviour.+In+whose+name+we+continue+our+prayers+unto+thee%2C+as+he+himself+hath+taught+us%2C+Saying%2C%0A%0AOur+Father+which+art+in+Heaven%2C+%26c.%E2%80%9D%0A%0A%E2%80%94+Arthur+Hildersham%2C+The+doctrine+of+fasting+and+prayer%2C+and+humiliation+for+sin.+Delivered+in+sundry+sermons+at+the+fast+appointed+by+publique+authority%2C+in+the+year+1625%2C+%28London%3A+Edward+Brewster%2C+1633%29%2C+unpaginated.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F64f2ad3033.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/64f2ad3033.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/06/19/arthur-hildersham-a-prayer-for-the-hearing-of-the-word/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

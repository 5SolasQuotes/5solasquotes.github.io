<main class="wrap"><figure class="quote" id="q-f486f665f6" data-kw="">
<blockquote><p>The misconduct of their women (some of whom seem to have been inspired) in the public assembly, who laid by their veils, the common token of subjection to their husbands in that part of the world… … it must be observed that it was a signification either of shame or subjection for persons to be veiled, or covered, in the eastern countries, contrary to the custom of ours, where the being bare-headed betokens subjection, and being covered superiority and dominion… Now, believe evil angels will be sure to mix in all Christian assemblies, therefore should women wear the token of their shamefacedness and subjection, which in that age and country, was a veil… He [Paul] sums up all by referring those who were contentious to the usages and customs of the churches, v. 16. Custom is in a great measure the rule of decency. And the common practice of the churches is what would have them govern themselves by. He does not silence the contentious by mere authority, but lets them know that they would appear to the world as very odd and singular in their humor if they would quarrel for a custom to which all the churches of Christ were at that time utter strangers, or against a custom in which they all concurred, and that upon the ground of natural decency. It was the common usage of the churches for women to appear in public assemblies, and join in public worship, veiled; and it was manifestly decent that they should do so. Those must be very contentious indeed who would quarrel with this, or lay it aside.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0d68aa6d6c" data-kw="">
<blockquote><p>To those who, in a narrow spirit, insist on having divine prescription for the most insignificant details of religious life and public worship, this appeal to ‘nature itself,’ [v. 14] as a great guide in relation to the decencies of public worship, should read a wholesome lesson. Nature, though uniform in its essential features, varies in all that is subordinate in different regions and at different periods. In matters of feeling, taste, and decorum, as to the way in which the relation of the sexes should be expressed, eastern and western ideas notoriously and widely differ, and they should be allowed their natural and proper development.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-brown.html">David Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1 Cor. 11 in A Popular Commentary on the New Testament, ed. Philip Schaff, p. 203</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>we must see why it is that St. Paul praises the Corinthians… Now we note that in the Church of God there is first of all doctrine, and then there is order and policy… As for the rest, other than doctrine, there is also policy, and this policy is left to us in liberty. So, for example, we are presently assembled at eight o’clock; one might well arrange for it to be at seven o’clock, or change the order in some regard. And, indeed, we often see that one Church will by no means have precisely the same order as another… and do we have a different Christianity on that account? Not at all. For what belongs to outward order and policy (as I said) has been left to human liberty. It is true we must proceed with sound-mindedness and modesty, and ever consider what is fitting for the edification of the Church, as we will be exhorted in the fourteenth chapter, and there it will be treated more fully. …he did not inject himself by imposing certain laws, bringing souls into bondage; he did not erect a ‘divine service’ such as one sees in Papistry. None of all that. Rather he conveyed to them an order designed to maintain decency, peace and concord among them… So, when the gospel is preached in any place, and a church is raised up, some particular ordinances must be established, which one will know to be proper and which everyone will use in his liberty. But this (as I said) has nothing to do with adding to the doctrine of faith, nor with making laws that put our souls in bondage.</p></blockquote>

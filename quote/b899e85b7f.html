<main class="wrap"><figure class="quote" id="q-b899e85b7f" data-kw="">
<blockquote><p>For who in his right wits will run upon a man which he clearly sees hath the plague sore running upon him? What Christian in his right mind spiritually, having any fear of God in his heart, life in his soul, or tenderness in his conscience, will delightfully thrust himself into the company of swearers, drunkards, scorners, filthy talkers, profane jesters, or any fellows of such infamous rank? especially since the soul is a thousand times more capable of the contagion of sin, than the body of any infectious disease?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bolton.html">Robert Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Some General Directions for a Comfortable Walking with God</cite>, … (London, 1626) 1625 was a plague year., p. 67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

— Samuel Rutherford, The Due Right of Presbyteries… (London, 1644), pt. 2, ch. 4, section 5, p. 202 Rutherford is speaking to his congregationalist opponents.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6show+us+a+warrant+from+the+Law+and+the+Testimony+where+any+are+to+be+debarred+from+the+seals+of+the+Covenant%2C+and+that+ordinarily+%28where+sickness+and+some+other+physical+impediments+do+not+occur%29+where+there+is+no+moral+unworthiness+or+guiltiness+in+the+persons+debarred%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries%E2%80%A6+%28London%2C+1644%29%2C+pt.+2%2C+ch.+4%2C+section+5%2C+p.+202+Rutherford+is+speaking+to+his+congregationalist+opponents.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F451c398e7d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/451c398e7d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/historic-reformed-quotes-on-social-distancing-the-adaptation-of-the-church/#:~:text=show%20us%20a%20warrant%20from%20the,or%20guiltiness%20in%20the%20persons%20debarred&amp;text=show%20us%20a%20warrant%20from%20the%20Law%20and&amp;text=moral%20unworthiness%20or%20guiltiness%20in%20the%20persons%20debarred" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-93bcfc0f7e" data-kw="">
<blockquote><p>And so judgement-like is [men’s] withdrawing [from God], and smells so of vengeance, that God plagues withdrawing with withdrawing: Hos. 5:4, ‘They will not frame their doings to turn unto their God.’ And what is the issue of that? ‘They shall go with their flocks and herds to seek the Lord, but they shall not find Him; for He hath withdrawn Himself from them.’ Prov. 1:24, ‘I called, and ye refused;’ Verse 26, then this must follow, verse 28 (as also Jn. 8:21, the like is) ‘they shall call upon Me, but I will not answer.’ Use 6. It’s a terrible plague of God, which we would eschew as hell, to wit, provoking of God by such sins as may procure that God should in his judgement mar the lock of the heart, the will, that the door should neither shut nor open; and cast poison into the soul, so as angels and men, heaven and earth cannot help or cure it: Christ is good at opening hearts, and drawing sinners; and He is as good at judicial closing of hearts: If He but put his finger in the eye, and snap in pieces the optic nerves, all the world cannot restore sight, or open the heart. He that is nearest to be drawn to Christ, and yet never drawn, is deepest in hell: An evangelic-fire of God’s fury is worse than a Sinai-fire, though it burn up to mid-heaven:

1. Sinning against the light of nature and the known will of God, as idolatry and the principles of your own religion, true and known to be so, brings delivering up to judicial blindness, Rom. 1:21.

2. If ye put your finger in nature’s eye, and blow out that candle, God will give you up to vile affections, Rom. 1:24 and a reprobate mind, vv. 26-28. Some blow out the candle of nature, and God blows out the sun of the Gospel, that it is to them like sack-cloth of hair, and a moon like blood.

3. Resisting of the call of God, brings on the plague of hardness of heart; Pro. 1:24-27; Acts 28:23-27; Jn. 8:21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, ... (London, 1647), pp. 332-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-6997373933" data-kw="">
<blockquote><p>2. He [the king] is the head of the persons who make the Church, and so is a politic-head, but he is not the head of the Church-visible, as it is such. The head-visible and members are of one nature; the king as king is a politic and civil head; the visible Church is not a politic and civil, but an ecclesiastic body… Nathan as a man was David’s servant, but as a prophet he was God’s servant, and not David’s servant.</p></blockquote>

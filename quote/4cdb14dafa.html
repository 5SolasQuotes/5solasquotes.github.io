<main class="wrap"><figure class="quote" id="q-4cdb14dafa" data-kw="">
<blockquote><p>For Aquinas, a necessary condition for repentance is the recognition of a higher good the realization of which is frustrated by the action of which one repents (Of Evil, quest. 3, art. 13). He compares this to correcting an intellectual error by reasoning back to first principles (an example of which would be the law of non-contradiction). If one is correct about which principles are truly first, then rectifying the error is possible. But if one is incorrect about that, rectifying an error is far more difficult, because one will not have anything more fundamental to appeal to in order to correct one’s mistake about which principles are truly first. Similarly, if one correctly understands which ultimate end will conduce to human happiness, repentance of sin will be much easier than if one is wrong about the ultimate end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature Ref (Editiones Scholastica, 2024), pt. 4, ch. 10</cite>, p. 481</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c6ac1d6124" data-kw="">
<blockquote><p>This question is rightly instituted to counter the unjust calumny of the Romanists, who defame us everywhere with the name of Solifidians, because we assert that we are justified by faith alone, as if we reject all dispositions for justification and all other preparatory works for justification… …we say that the said preparatory works are given [by God], that is, are prerequisite for justification, before God either forgives sins or accepts to life. For God does not justify any sinner living in the Church, but a sinner who believes with catholic Faith, fears punishment, hopes for pardon, loves and desires beatitude, loves God graciously inviting to salvation, acknowledges and condemns sins, is truly sorry for offending God, is weary of his former life, and pants for a new one. A sinner, unless he has been prepared and disposed by these previous arts, does not seek a physician, nor does he run and flee to Christ the Justifier and Savior, nor does he desire to flee… we demonstrate from the scriptures that this array of preparatory works is necessary.” – 32-33 Collinges, John – The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved, wherein is laid down the soul’s glory in Christ and the way by which the soul comes to Christ, delivered in two lecture sermons… (London: 1646) 81 pp. This is excellent. Ambrose, Isaac – The Doctrine &amp; Directions but more especially the Practice &amp; Behavior of a Man in the Act of the New Birth… (London: 1650) Hooker, Thomas – multiple works Grebenitz, Elias – Disputation 3, ‘On Regeneration in General’ in ‘Theological Treatise on Regeneration in Three Disputations [&amp; on Conversion &amp; Preparation]’ trans. AI (Becman, 1671), pp. 60-87 Grebenitz (1627-1689) was a German reformed professor of logic, metaphysics and theology at Frankfurt. Le Blanc de Beaulieu, Louis – Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683) L <blockquote><p>1st Problem: Whether natural man can use the light of nature (which some call the remnants of the divine image, good disposition, common or universal grace, first and preventing grace) so rightly that by that good use he can obtain greater grace, namely, evangelical and salvific grace? Response: So indeed the ancient and more recent Pelagians would have it, whose recooked error see in Johann Arnold Corvinus’s treatise against Tilenus, ch. 6. But we deny it, from Mt. 11:23 [11:25-27]; Ps. 147:19–20; Acts 14:16; and 10:6–7[?]; Eph. 2:12–13 with Titus 3:3.</p></blockquote>

<blockquote><p>Q. 87. What is repentance unto life? A. Repentance unto life is a saving grace,[g] whereby a sinner, out of a true sense of his sin,[h] and apprehension of the mercy of God in Christ,[i] doth, with grief and hatred of his sin, turn from it unto God,[k] with full purpose of, and endeavour after, new obedience.[l] [g] Acts 11:18. [h] Acts 2:37,38. [i] Joel 2:12. Jer. 3:22. [k] Jer. 31:18,19. Ezek. 36:31. [l] 2 Cor. 7:11. Isa. 1:16,17.</p></blockquote>

<blockquote><p>In man’s conversion to God we urge not the necessity of anything that is unnecessary. We stand not on certain modes, methods and circumstances, in which it may be brought about, wherein the wisdom of God proceeds variously towards several persons, according to the different circumstances of their condition. As for instance, we assert not a general necessity of this or that measure of humiliation, much less of a dismal despairing horror (as some have said of us); we press conviction and humiliation no farther than to make a sinner restless till he come to Christ, and find rest to his soul in Him.</p></blockquote>

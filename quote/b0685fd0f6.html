</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fcfddb7a0b" data-kw="Author of sin Permission">
<blockquote><p>God doth not infuse the lust, or excite it, though he doth present the object about which the lust is exercised. God delivered up Christ to the Jews, he presented him to them, but never commanded them to crucify him, nor infused that malice into them, nor quickened it; but he, seeing such a frame, withdrew his restraining grace, and left them to the conduct of their own vitiated wills. … God created the grape, and filled the vine with a sprightliness, but he doth never infuse a drunken frame into a man, or excite it. … In short, though it be by God&#x27;s permission that we can do evil, yet it is not by his inspiration that we will to do evil; that is wholly from ourselves.</p></blockquote>

<blockquote><p>[Scotus:] ‘That the effect is not right is caused now not because of the prior cause, which on its own part would cause rightly if the second cause were to cause; but because of the defect of the secondary cause, which in its power has the option of co-causing with the first cause or not cocausing. And if it does not co-cause with the first cause as it is bound to, there is no rectitude in the common effect of both.&#x27;</p></blockquote>

<blockquote><p>I. Durandus [d.1334], a celebrated figure among ancient Scholastic theologians, believed and taught that God concurs with secondary causes remotely and mediately only; namely, because He gave all things their own nature and essence and conferred upon them the power to act, and continuously preserves both by his power: with the condition that each creature, having once received its power from God and continuously preserved, performs its own motions independently without God immediately and directly influencing their acts and effects. From this follows that God is only a remote cause of the acts of creatures, while the creature itself is the proximate and immediate cause. II. Among more recent theologians, a certain Louis of Dole from the Capuchin order, whose book was published with many approvals from doctors, aligns with Durandus’ view. He says that for God to concur with man in action is nothing other than creating free will for natural acts or giving the power or habit of acting in supernatural ones, by which the will itself does everything in every supernatural act without any other immediate divine concurrence promoting the action, as reported by Samuel Rutherford, professor of theology at the University of St. Andrews, in his Scholastic Disputation on Divine Providence, ch. 25. III. According to these doctors, there is no difficulty in reconciling divine concurrence with the freedom of human acts since God does not immediately concur with them but mediately only through the free will that He created once and continuously preserves. IV. However, this opinion is generally rejected in the Roman School. Except for very few, the doctors of the Roman Church, both ancient and recent, agree that God cooperates with secondary causes in such a way that there is no action of a secondary cause that does not proceed directly from God as well as from the secondary cause, and that no action can be exercised by a creature unless God confers being on that action directly and immediately. V. They derive this from certain Scripture passages. The principal one is found in Acts 17:28: “In Him we live and move and have our being.” For when the apostle says that we live in God, that is, by Him, and have our being, he sufficiently teaches that God is the one who gave us our nature and all faculties initially and continuously preserves them; therefore, when he adds that we also move in God, he seems to clearly teach that all our movements and actions, like nature itself, proceed immediately from God and are done by His power. VI. They also refer to what Christ says in Jn. 5:17: “My Father is working until now, and I am working.” For that continuous operation attributed to God there cannot be more conveniently explained than by the continuous influence by which God concurs in all actions of created things and produces them together with them; especially since it is clear that Christ understands there an operation similar to what He had just performed in healing the lame man. VII. They also infer this from all those places where Scripture singularly attributes to God things that are done daily in nature through secondary causes. For example, when it is said in Ps. 104 that God waters the mountains from His upper chambers, makes grass grow for the cattle and plants for people to use, and in Ps. 135 that He brings forth the wind from His storehouses, and in the New Testament that He clothes the grass of the field and gives each seed its own body, Mt. 6:30, 1 Cor. 15:38. It seems that Scripture would not have used such language if in these matters no singular and immediate action of God intervened and they had no other proximate and immediate cause than nature itself created by God. VIII. To these testimonies from sacred Scripture, they also add an argument derived from natural reason. For they reason that no created substance can remain in nature unless God preserves them immediately by His influence; much more, therefore, similar influence is needed for the motions and actions of substances: for how could it be true that accidents depend less on God for their preservation than substances themselves? Since what is necessary for the preservation of a thing is more reasonably necessary for its first production, it follows that nothing at all can be produced by secondary causes unless the actual and immediate influence of the primary cause intervenes simultaneously. IX. From these and similar reasons, the doctors of the Roman Church conclude almost unanimously that God concurs and cooperates with all secondary causes, whether necessary, free, or contingent, in each of their actions, and indeed directly and immediately. However, when asked what this cooperation of the primary cause with the secondary cause is and in what it consists, there is great variety of opinions among scholastic doctors. … XXVI. But the majority of the doctors of the Roman Church today reject that opinion [of physical predetermination of the Thomists] and assert that the pre-moving and predetermining influence of God on the human will to its individual acts completely undermines the freedom of human choice. Furthermore, they argue that it follows that God is the author of sin since, according to this view, He predetermines people even to intrinsically evil acts and imposes a certain necessity of doing evil upon them. XXVII. Therefore, they philosophize very differently about the concurrence of God. First, they establish that when God concurs and cooperates with secondary causes, He does not do anything or imprint on the faculty itself that acts, for example, on our will. Instead, He only immediately influences and acts on the action and effect of the secondary cause, producing it at the very moment it is produced by the secondary cause. XXVIII. Then they consequently teach that the action of the first cause concurring with the secondary cause is not an action really distinct from the action of the secondary cause but the same action insofar as it receives its being from the first cause. Thus, when God, for example, concurs with the will in the act of willing or not willing, He does not exert an action in the will distinct from the action of the will itself but only confers being on the action of the will together with the will and preserves that action. Consequently, divine cooperation in this respect is not something different from our volition but our very volition insofar as it immediately depends on God for its production and preservation. XXIX. Furthermore, as also clearly follows from what has been said, they deny that the secondary cause is moved by the first cause to act or determined by the same in acting to produce such an action. Therefore, according to their opinion, the secondary cause, and consequently the will, does not act because God moves it and applies it to action. Rather, God cooperates with it because it disposes itself to act. The divine concurrence and influence is something indifferent in itself, which is determined by secondary causes to various kinds of actions. [The section on Molinism, below, then follows]</p></blockquote>

+preserves.+IV.+However%2C+this+opinion+is+generally+rejected+in+the+Roman+School.+Except+for+very+few%2C+the+doctors+of+the+Roman+Church%2C+both+ancient+and+recent%2C+agree+that+God+cooperates+with+secondary+causes+in+such+a+way+that+there+is+no+action+of+a+secondary+cause+that+does+not+proceed+directly+from+God+as+well+as+from+the+secondary+cause%2C+and+that+no+action+can+be+exercised+by+a+creature+unless+God+confers+being+on+that+action+directly+and+immediately.+V.+They+derive+this+from+certain+Scripture+passages.+The+principal+one+is+found+in+Acts+17%3A28%3A+%E2%80%9CIn+Him+we+live+and+move+and+have+our+being.%E2%80%9D+For+when+the+apostle+says+that+we+live+in+God%2C+that+is%2C+by+Him%2C+and+have+our+being%2C+he+sufficiently+teaches+that+God+is+the+one+who+gave+us+our+nature+and+all+faculties+initially+and+continuously+preserves+them%3B+therefore%2C+when+he+adds+that+we+also+move+in+God%2C+he+seems+to+clearly+teach+that+all+our+movements+and+actions%2C+like+nature+itself%2C+proceed+immediately+from+God+and+are+done+by+His+power.+VI.+They+also+refer+to+what+Christ+says+in+Jn.+5%3A17%3A+%E2%80%9CMy+Father+is+working+until+now%2C+and+I+am+working.%E2%80%9D+For+that+continuous+operation+attributed+to+God+there+cannot+be+more+conveniently+explained+than+by+the+continuous+influence+by+which+God+concurs+in+all+actions+of+created+things+and+produces+them+together+with+them%3B+especially+since+it+is+clear+that+Christ+understands+there+an+operation+similar+to+what+He+had+just+performed+in+healing+the+lame+man.+VII.+They+also+infer+this+from+all+those+places+where+Scripture+singularly+attributes+to+God+things+that+are+done+daily+in+nature+through+secondary+causes.+For+example%2C+when+it+is+said+in+Ps.+104+that+God+waters+the+mountains+from+His+upper+chambers%2C+makes+grass+grow+for+the+cattle+and+plants+for+people+to+use%2C+and+in+Ps.+135+that+He+brings+forth+the+wind+from+His+storehouses%2C+and+in+the+New+Testament+that+He+clothes+the+grass+of+the+field+and+gives+each+seed+its+own+body%2C+Mt.+6%3A30%2C+1+Cor.+15%3A38.+It+seems+that+Scripture+would+not+have+used+such+language+if+in+these+matters+no+singular+and+immediate+action+of+God+intervened+and+they+had+no+other+proximate+and+immediate+cause+than+nature+itself+created+by+God.+VIII.+To+these+testimonies+from+sacred+Scripture%2C+they+also+add+an+argument+derived+from+natural+reason.+For+they+reason+that+no+created+substance+can+remain+in+nature+unless+God+preserves+them+immediately+by+His+influence%3B+much+more%2C+therefore%2C+similar+influence+is+needed+for+the+motions+and+actions+of+substances%3A+for+how+could+it+be+true+that+accidents+depend+less+on+God+for+their+preservation+than+substances+themselves%3F+Since+what+is+necessary+for+the+preservation+of+a+thing+is+more+reasonably+necessary+for+its+first+production%2C+it+follows+that+nothing+at+all+can+be+produced+by+secondary+causes+unless+the+actual+and+immediate+influence+of+the+primary+cause+intervenes+simultaneously.+IX.+From+these+and+similar+reasons%2C+the+doctors+of+the+Roman+Church+conclude+almost+unanimously+that+God+concurs+and+cooperates+with+all+secondary+causes%2C+whether+necessary%2C+free%2C+or+contingent%2C+in+each+of+their+actions%2C+and+indeed+directly+and+immediately.+However%2C+when+asked+what+this+cooperation+of+the+primary+cause+with+the+secondary+cause+is+and+in+what+it+consists%2C+there+is+great+variety+of+opinions+among+scholastic+doctors.+%E2%80%A6+XXVI.+But+the+majority+of+the+doctors+of+the+Roman+Church+today+reject+that+opinion+%5Bof+physical+predetermination+of+the+Thomists%5D+and+assert+that+the+pre-moving+and+predetermining+influence+of+God+on+the+human+will+to+its+individual+acts+completely+undermines+the+freedom+of+human+choice.+Furthermore%2C+they+argue+that+it+follows+that+God+is+the+author+of+sin+since%2C+according+to+this+view%2C+He+predetermines+people+even+to+intrinsically+evil+acts+and+imposes+a+certain+necessity+of+doing+evil+upon+them.+XXVII.+Therefore%2C+they+philosophize+very+differently+about+the+concurrence+of+God.+First%2C+they+establish+that+when+God+concurs+and+cooperates+with+secondary+causes%2C+He+does+not+do+anything+or+imprint+on+the+faculty+itself+that+acts%2C+for+example%2C+on+our+will.+Instead%2C+He+only+immediately+influences+and+acts+on+the+action+and+effect+of+the+secondary+cause%2C+producing+it+at+the+very+moment+it+is+produced+by+the+secondary+cause.+XXVIII.+Then+they+consequently+teach+that+the+action+of+the+first+cause+concurring+with+the+secondary+cause+is+not+an+action+really+distinct+from+the+action+of+the+secondary+cause+but+the+same+action+insofar+as+it+receives+its+being+from+the+first+cause.+Thus%2C+when+God%2C+for+example%2C+concurs+with+the+will+in+the+act+of+willing+or+not+willing%2C+He+does+not+exert+an+action+in+the+will+distinct+from+the+action+of+the+will+itself+but+only+confers+being+on+the+action+of+the+will+together+with+the+will+and+preserves+that+action.+Consequently%2C+divine+cooperation+in+this+respect+is+not+something+different+from+our+volition+but+our+very+volition+insofar+as+it+immediately+depends+on+God+for+its+production+and+preservation.+XXIX.+Furthermore%2C+as+also+clearly+follows+from+what+has+been+said%2C+they+deny+that+the+secondary+cause+is+moved+by+the+first+cause+to+act+or+determined+by+the+same+in+acting+to+produce+such+an+action.+Therefore%2C+according+to+their+opinion%2C+the+secondary+cause%2C+and+consequently+the+will%2C+does+not+act+because+God+moves+it+and+applies+it+to+action.+Rather%2C+God+cooperates+with+it+because+it+disposes+itself+to+act.+The+divine+concurrence+and+influence+is+something+indifferent+in+itself%2C+which+is+determined+by+secondary+causes+to+various+kinds+of+actions.+%5BThe+section+on+Molinism%2C+below%2C+then+follows%5D%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+published+at+Various+Times+in+the+Academy+of+Sedan%2C+vol.+1+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+%E2%80%98How+Divine+Concurrence+can+be+Reconciled+with+Free+Will%E2%80%99%2C+pp.+338-39+Latin+Le+Blanc+%281614-1675%29+was+a+French+reformed+professor+of+theology+at+Sedan.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0258572243.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0258572243.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=I.%20Durandus%20%5Bd.1334%5D%2C%20a%20celebrated%20figure,section%20on%20Molinism%2C%20below%2C%20then%20follows&amp;text=I.%20Durandus%20%5Bd.1334%5D%2C%20a%20celebrated%20figure%20among%20ancient&amp;text=actions.%20%5BThe%20section%20on%20Molinism%2C%20below%2C%20then%20follows" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Every action, as such, is undoubtedly good, it being an actual exertion of those operative powers given us by God for that very end; God therefore may be the Author of all actions (as He undoubtedly is), and yet not be the Author of evil. … Suppose a boy, who knows not how to write, has his hand guided by his master and nevertheless makes false letters, quite unlike the copy set him, though his preceptor, who guides his hand, is the cause of his writing at all, yet his own ignorance and unskilfulness are the cause of his writing so badly. Just so, God is the supreme Author of our action, abstractedly taken, but our own vitiosity is the cause of our acting amiss.</p></blockquote>

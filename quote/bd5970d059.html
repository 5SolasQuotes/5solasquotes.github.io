<blockquote><p>XXV. The question concerning the number of fundamental articles which our adversaries have proposed, besides being rash (since Scripture says nothing definitely about it) is also useless and unnecessary because there is no need of our knowing particularly the number of such articles, if we can prove that they err fundamentally in one or more. And this can be done easily with regard to the papists, Socinians, Anabaptists and similar heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, question 14, ‘Are some theological topics fundamental, others not; and how can they be mutually distinguished?’ in Institutes of Elenctic Theology, tr. George M. Giger, ed. James Dennison Jr. (1679–1685; P&amp;R, 1992), vol. 1, 1st Topic, pp. 48-55, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>17. For there are two kinds of errors: some which consist only in belief, others which, besides belief, add some outward action. Of the first kind are the errors concerning the nature of Jesus Christ, concerning Predestination and concerning Free Will. Of the second are: Communion under one kind, adoration of the Host, and prayer in a tongue not understood by him that prays. The errors of this latter kind, although very often less grave than the former, yet divide minds far more sharply, and often cause schism. For if I communicate in the sacrament with one who errs concerning predestination or the nature of Jesus Christ, or who believes that the body of the Lord is everywhere—though the error be great—nevertheless it does not disturb him who communicates with him. But if I should come to communicate with one who adores the bread, or pretends to sacrifice Jesus Christ, such an action would scandalize me and drive me away for fear of participating in idolatry or in a false sacrifice. Now we have this advantage: that with the Lutheran Churches all our differences are of the first kind; and that, as to the external matters which they practice in the Church, we have no disagreement which is not easy to compose.</p></blockquote>

</figure><figure class="quote" id="q-587b900ea0" data-kw="">
<blockquote><p>For profession brings a Church into outward fellowship with Christ’s body (as bad servants with a good master) and so into the way of being savingly of the body of Christ if they resist not, grieve not, quench not, or despise not the Spirit of grace. Secondly, for the form of a true Church, that is Christ united unto the persons professing his saving truth. For as the form of a man is his soul united to his body, so the form of a Church, which is the body of Christ, is Christ united unto it. Now, that Christ is united unto our Church is proved thus: because He gives the law of union to us as to the body, and makes it effectuall for conviction, or conversion, to serve the living and true God. As a king is united to his subjects by his laws, and executions of them for rewards and punishments: so is Jesus Christ to our Church. As the head united gives laws to the body for safety: so does Christ give laws to us for our salvation in his Word.</p></blockquote>

0Word" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2a0e5d748a" data-kw="">
<blockquote><p>Our brethren of Scotland writing against the tyranny of Prelates, when they were under it, in that book entitled, English and Popish Ceremonies [by Gillespie], have this passage: ‘If the error of conscience be about things unnecessary, then it is tutior pars, ‘the surest and safest way’ not to urge men to do that which in their consciences they condemn.’ And the ministers of the protestant Churches in France, giving their judgments, De pace inter Evangelicos procuranda, How Peace amongst the Protestants in Germany may be had, set forth by [John] Duraeus, say thus: ‘Let all matters controversal be brought into such a certain model as may give satisfaction to both parties; and that if it be possible, framed out of the very words of Scripture: and let no man require anything else of his brother.’ [Jerome] Zanchi, on the 4th Commandment, has this notable speech, ‘That which I say,’ says he: ‘is diligently to be observed, that those who would stir up princes to have all people, kingdoms, commonwealths which (not overthrowing the fundamentals of religion), differ from them in anything, condemned of heresy, excluded from friendship, driven out of their territories: these are no friends,’ says he, ‘either to their princes or to the Church of Christ.’ Many think they do great service to Christ, the Church and State, if they can stir up magistrates to suppress whatsoever they conceive are errors; it may be their hearts are upright in the main, they aim at peace, but certainly they cause much disturbance in Church and State. Bishop [John] Davenant in a little book entitled his, Exhortation to Brotherly Love amongst Churches, the ninth chapter, has this title: ‘That brotherly communion between Churches evangelical is not to be cut asunder because of diverse opinions about questions controversial.’ And in the beginning of the 10th chapter: ‘This is to be premised: The bonds of the brotherly communion of Christian Churches ought not to be dissolved upon every difference of opinions, but only for the denying or opposing fundamentals.’ Here see the moderation of a prelate. Thus Cyprian of old delivered his opinion and practised it accordingly, differing from many of his brethren, but withal professes: That he meant not to prescribe or give laws to any, that he would not contend with any of his colleagues so as to break divine concord and the peace of our Lord; that he was far from judging or censuring any of his brethren or cutting off from his communion any that were of a different mind; and that in such case none ought to constrain his colleague by tyrannical violence (therein glancing at the violent proceeding of Stephen to whom he wrote) to a necessity of believing or following what he thinks meet. (Epistle 72, to Stephen; Epistle 73, to Jubajanum) This modesty and charity of Cyprian is very often and very deservedly commended by St. Augustine (Contra Donatists, bk. 1, ch. 18; bk. •, chs. 1-2), says Dr. Potter, an episcopal man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, to the Lovers of Truth and Peace. Heart-Divisions Opened</cite>, … (London: Robert Davvlman, 1653), ch. 9; pp. 55-56</span></figcaption>

ht not to be dissolved upon every difference of opinions, but only for the denying or opposing fundamentals.’ Here see the moderation of a prelate. Thus Cyprian of old delivered his opinion and practised it accordingly, differing from many of his brethren, but withal professes: That he meant not to prescribe or give laws to any, that he would not contend with any of his colleagues so as to break divine concord and the peace of our Lord; that he was far from judging or censuring any of his brethren or cutting off from his communion any that were of a different mind; and that in such case none ought to constrain his colleague by tyrannical violence (therein glancing at the violent proceeding of Stephen to whom he wrote) to a necessity of believing or following what he thinks meet. (Epistle 72, to Stephen; Epistle 73, to Jubajanum) This modesty and charity of Cyprian is very often and very deservedly commended by St. Augustine (Contra Donatists, bk. 1, ch. 18; bk. •, chs. 1-2), says Dr. Potter, an episcopal man.”

<blockquote><p>God’s covenant is a bargain which God hath made with men, in which God promiseth to men some good, &amp; requireth of them again, that they perform those things which he commandeth. And that covenant is either eternal or temporal. The eternal covenant is a covenant in which God promiseth men eternal life. And that is two fold, the covenant of works, or the covenant of grace.

The covenant of works, is a bargain of God made with men concerning eternal life, to which is both a condition of perfect obedience adjoined, to be performed by man, &amp; also a threatening of eternal death if he shall not perform perfect obedience. Gen. 2.17.

The repetition of the covenant of works is made by God, Exod. 19.5. Deut. 5.2. 1. King. 8.21. Heb. 8.9. and that chiefly for four causes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The substance of Christian religion soundly set forth in two books, by definitions and partitions, framed according to the rules of a natural method, by Amandus Polanus professor of divinity. The first book concerneth faith. The second concerneth good works. The principal points whereof are containe</cite>, trans. Elijahu Wilcocks (London: John Oxenbridge, 1595), pp 87-88.</span></figcaption>

<blockquote><p>Therefore the nature of the human race, generated from the flesh of the one transgressor, if it is self-sufficient for fulfilling the law and for perfecting righteousness, ought to be sure of its reward, that is, of everlasting life, even if in any nation or at any former time faith in the blood of Christ was unknown to it. For God is not so unjust as to defraud righteous persons of the reward of righteousness… Man’s nature, indeed, was created at first faultless and without any sin; but that nature of man in which every one is born from Adam, now wants the Physician, because it is not sound. … This grace, however, of Christ, without which neither infants nor adults can be saved, is not rendered for any merits, but is given gratis, on account of which it is also called grace. ‘Being justified,’ says the apostle, ‘freely through His blood.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Nature and Grace, Against Pelagius</cite>, (415), 2, 3, 4 in NPNF1, 5: 122.</span></figcaption>

<blockquote><p>I. God made a double covenant with man, the one of works and the other of grace; the former before, the latter after the fall.

II. The covenant of works was confirmed by a double sacrament, to wit, the Tree of Life, and the tree of the knowledge of good and evil both being planted in the midst of paradise.

III. They had a double use.

      1. That man’s obedience might be tried, by using of the one, and abstaining from the other.

      2. That the Tree of Life might ratify eternal happiness to those that should obey, but the Tree of Knowledge should signify to the disobedient, the loss of the greatest happiness and the possession of the greatest mercy.

IV. Therefore the Tree of Life was so called, not from any innate faculty it had to give life, but from a sacramental signification.

V. Likewise the Tree of Knowledge of good and evil, had this denomination from signifying the chief good and evil and from the event.

VI. The happiness of man being yet in his integrity, consisted chiefly in the image of God. …XIV. Man even in respect of his body was immortal, but not simply, as though his body being composed of the elements could not be resolved into its principles, but by Divine Covenant; not as thought it could not die, but because it had a possibility not to die….</p></blockquote>

<blockquote><p>…describes the entire biblical history as a series of events by which an original covenant of works is gradually annulled, bringing new phases in the history of the covenant of grace. He shows that God’s standard way of relating to mankind is through covenant, which, at its heart, is friendship with God.” – Bookflap Vlak, Johannes – Dissertation 1, On the Covenant of Works of God in A Triad of Dissertations: on the Covenants of God of Works &amp; of Peace, &amp; on Justification in Response to Leydekker (1689), pp. 71-170 trans. AI Latin Vlak (c.1635-1690) appears to have leaned towards Cocceius, contra Leydekker who was a Voetian. Flavel, John – Vindiciæ Legis &amp; Fœderis: or, A Reply to Mr. Philip Cary’s Solemn Call, wherein he Pretends to Answer All the Arguments of Mr. Allen, Mr. Baxter, Mr. Sydenham, Mr. Sedgwick, Mr. Roberts, and Dr. Burthogge for the Right of Believers’ Infants to Baptism, by Proving the Law at Sinai &amp; the Covenant of Circumcision with Abraham were the Very Same with Adam’s Covenant of Works, &amp; that Because the Gospel-Covenant is Absolute (London, 1690) . 1700’s Hopkins, Ezekiel – The Doctrine of the Two Covenants, wherein the Nature of Original Sin is at Large Explained… (London, 1712) Table of Contents This is also in vol. 2 of his Works. Hopkins (1634-1690) was a reformed, Anglican divine in the Church of Ireland. Hog, James – Some Select Notes Towards Detecting a Covered Mixture of the Covenant of Works, &amp; of Grace: With the Danger of that Evil; &amp; a Few Advices for Remedying Thereof. Contained in a Letter to a Friend Upon the Head Ref (1718) 20 pp. Hog (c.1658-1734) was a Scottish minister at Carnock, known for his role in the Marrow Controversy within the Church of Scotland. Taylor, Richard – Discourses on the Fall &amp; Misery of Man: &amp; on the Covenant of Grace (London: John Clark, 1725) 379 pp. Herman Witsius footnotes this work under the statement: “The formularies of the Protestant Churches in general, and the writings of the most eminent Reformed Divines…” – On the Apostles’ Creed, Note XII, p. 386 Wilson, David – Palæmon’s Creed Reviewed &amp; Examined: wherein Several Gross &amp; Dangerous Errors, Advanced by the Author of the Letters on Theron &amp; Aspasio, are Detected &amp; Refuted; &amp; the Protestant Doctrine Concerning the Covenant of Works &amp; the Covenant of Grace, Conviction of Sin, Regeneration, Faith, Justification, Inherent Grace, etc., Vindicated from the Cavils and Exceptions of that Author, and shown to be entirely conformable to the Apostolic Doctrine concerning the several points afore-mentioned, vol. 1, 2 (London, 1762) Wikipedia: “Theron and Aspasio, or a series of Letters upon the most important and interesting Subjects [by James Hervey, 1724-58, an Anglican clergyman], which appeared in 1755, and was equally well received, called forth some adverse criticism even from Calvinists, on account of tendencies which were considered to lead to antinomianism, and was strongly objected to by Wesley in his Preservative against unsettled Notions in Religion. Besides carrying into England the theological disputes to which the Marrow of Modern Divinity had given rise in Scotland (the Marrow Controversy), it also led to what is known as the Sandemanian controversy as to the nature of saving faith.</p></blockquote>

<blockquote><p>The covenant of God generally is a promise under some one certain condition. And it is twofold; the first is the covenant of works; the second is the covenant of grace. Paul ( Gal. iv. 24) expressly sets down two covenants, which in the Old Testament were shadowed by two women, as by types, to wit, Hagar, the handmaid, and Sarah, the free woman; for, saith he, these be those two covenants. Let us then speak something of these two covenants; and first of the covenant of works. The covenant of works, which may also be called a legal or natural covenant, is founded in nature, which by creation was pure and holy, and in the law of God, which in the first creation was engraven in man’s heart. For after that God had created man after his own image, pure and holy, and had written his law in his mind, he made a covenant with man, wherein he promised him eternal life, under the condition of holy and good works, which should be answerable to the holiness and goodness of their creation, and conformable to his law. And that nature thus beautified with holiness and righteousness and the light of God’s law, is the foundation of the covenant of works, it is very evident; for that it could not well stand with the justice of God to make a covenant under condition of good works and perfect obedience to his law, except he had first created man pure and holy, and had engraven his law in his heart, whence those good works might proceed. For this cause, when he was to repeat that covenant of works to the people of Israel, he first gave the law written in tables of stone; then he made a covenant with his people, saying, Do these things, and ye shall live. Therefore the ground of the covenant of works was not Christ, nor the grace of God in Christ, but the nature of man in the first creation holy and perfect, endued also with the knowledge of the law. For, as touching the covenant of works, there was no mediator in the beginning between God and man, that God should in him, as in and by a mediator, make his covenant with man. And the cause that there was no need of a mediator was this, that albeit there were two parties entering into a covenant, yet there was no such breach or variance betwixt them that they had need of any mediator to make reconciliation between them; for, as for the covenant of works, God made this covenant with man, as one friend doth with another. For in the creation we were God’s friends, and not his enemies. Thus far of the ground of the covenant of works.</p></blockquote>

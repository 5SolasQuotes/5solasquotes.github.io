<main class="wrap"><figure class="quote" id="q-ee7f641456" data-kw="">
<blockquote><p>Because there is a difference betwixt carrying the colors [banner or flag] in an army tali modo [in such a way] as all the army at once may see the colors, and the carrying of the colors. Yet the colors are a note-visible of such an army: so there is a difference betwixt preaching the Word, simpliciter, and preaching the Word, tali modo, ‘in such a way’ in one material house only. And therefore it is necessary that government which concerns many Churches consociated, be in its exercise hic &amp; nunc [here and now], larger than preaching of the Word in its exercise, hic &amp; nunc: which cannot be done but to a multitude which convenes epi to auto, ‘to the same material place’. And we see an act of government, Acts 15, by confession of our [Independent] Brethren, belonging to diverse consociated Churches and performed by them, and yet these cannot ordinarily meet to one and the same place in all their members for hearing of the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, pp. 303-304</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3f773fed63" data-kw="">
<blockquote><p>So there be two sort of things in God’s worship: things either [1] merely moral, or [2] merely natural. And here also we consider things circumstantial, as time, place, etc. And circumstances are either [1.] merely physical, or 2. merely moral, or 3. mixed, partly moral, partly physical. Circumstances merely physical are such adjuncts of divine worship, as are common and unseparable concomitants of both civil, natural, and religious or sacred actions performed by men, and as they are such, contribute no moral goodness or badness to the action or agent in the performance thereof… …as as they are in themselves mere physical acts, kneeling, sitting, standing… time, place, family, country… 1. All these are common concomitants of civil, natural, and religious actions, for all actions performed by man of what kind soever, as natural, to eat, sleep; or civil, to declaim an oration before the people; or religious, to preach or pray, must be done… in some time, in some place, for they are not actions eternal, and so must be done in time and place… and they are inseparable adjuncts of all these actions because neither actions natural, civil, nor religious, can be performed, but by some persons… in some time, in some place: and lastly, they are mere circumstantials, and contribute no moral goodness or badness to the actions, as they are but common, inseparable circumstances; for because he preaches in time, or in place simply, the preaching is neither morally good, nor ill, better or worse… 3. There be some mixed circumstances, as these same physical circumstances, clothed with their own seasonable conveniences; so time for worship, and due and convenient time is required… a place is required for private worship, and a fit place, such as is not the market-street for private praying; the inconveniency of the circumstance may vitiate [impair the quality or efficiency of] the worship. I did say that Christ Jesus has set down in the Word a perfect platform of Church-Government, in all morals; I say in all morals, because the Word does not teach us any thing of circumstances, physical as physical… And therefore there is no greater reason to put us to prove all the natural and unseparable circumstances of worship, such as time and place, without which it is impossible any action at all can be performed…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), pp. 2-4</span></figcaption>

</figure><figure class="quote" id="q-6c67a959d7" data-kw="">
<blockquote><p>Another fault is that all the people are appointed in diverse places to say after the minister, whereby not only the time is unprofitably wasted and a confused voice of the people, one speaking after another, caused but an opinion bred in their heads that those only be their prayers which they say and pronounce with their own mouths, which causes them to give the less heed to the rest of the prayers which they rehearse not after the minister, which, notwithstanding are as well their prayers as those which they pronounce after the minister otherwise than the order which is left unto the church of God does bear. For God has ordained the minister to this end, that, as in public meetings he only is the mouth of the Lord from Him to the people, even so he ought to be the only mouth of the people from them unto the Lord, and that all the people should attend to that which is said by the minister, and in the end both declare their consent to that which is said, and their hope that it should so be and come to pass which is prayed, by the word “Amen;” as St. Paul declares in the epistle to the Corinthians [1 Cor. 14:6], and Justin Martyr shows to have been the custom of the churches in his time. Although these blots in the Common Prayer be such as may easily enough appear unto any which is not wedded to a prejudicate opinion and that there is no great difficulty in this matter, yet I know that this treatise of prayer will be subject to many reprehensions and that there will not be wanting some probable colors also whereby these things may be defended if men will set themselves to strive and to contend: yet (for the desire that I have that these things should be amended and for the instruction of the simpler which are studious of the truth) I have been bold to utter that which I think, not doubting also but that the light of the truth shall be able to scatter all those mists of reasons which shall go about to darken the clearness thereof.</p></blockquote>

t+I+have+that+these+things+should+be+amended+and+for+the+instruction+of+the+simpler+which+are+studious+of+the+truth%29+I+have+been+bold+to+utter+that+which+I+think%2C+not+doubting+also+but+that+the+light+of+the+truth+shall+be+able+to+scatter+all+those+mists+of+reasons+which+shall+go+about+to+darken+the+clearness+thereof.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cartwright%2C+A+Reply+to+an+Answer+made+of+M.+Doctor+Whitgift+Against+the+Admonition+to+the+Parliament+%28%5BHempstead%5D+1573%29%2C+%E2%80%98To+the+next+section+contained+in+the+77th%2C+78th+and+a+piece+of+the+79th+page%E2%80%99%2C+pp.+138-39&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6c67a959d7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6c67a959d7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/responsive-readings/#:~:text=Another%20fault%20is%20that%20all%20the,about%20to%20darken%20the%20clearness%20thereof&amp;text=Another%20fault%20is%20that%20all%20the%20people%20are&amp;text=shall%20go%20about%20to%20darken%20the%20clearness%20thereof" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-03e5a05929" data-kw="Mary|Queen of Heaven|Mediator|Idolatry">
<blockquote><p>Thirdly, It is a standing testimony against that idolatry which he foresaw his church would in after-ages sink into, in giving undue honours to the virgin Mary, a crime which the Roman catholics, as they call themselves, are notoriously guilty of, when they call her the queen of heaven, the salvation of the world, their mediatrix, their life and hope; … The Son of God is appointed our Advocate with the Father; but the mother of our Lord was never designed to be our advocate with the Son.</p></blockquote>

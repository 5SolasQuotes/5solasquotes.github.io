<blockquote><p>1. The effects of slavery on domestic relations.

The system of American Slavery confers upon slaveholders an absolute right of property in their slaves. This sets aside the husband’s interest in his wife, and the wife’s interest in her husband. Although slave-laws do not recognize the relation of marriage between slaves, it is recognized of God — and in his sight the slave is equally entitled with his master to enter into the relation, — and has the same right of protection in its enjoyment. But slavery, in its practical working, steps in between the slave and the enjoyment of his right.

This evil is not merely an abuse of the system; it necessarily flows from it. The right of property claimed by the master, and secured by law, gives him the power of disposing of the slave in anyway, and at any time, that may suit his inclination or his interest; a power which is so commonly used as to approximate very nearly to universality. The husband is torn from his wife; and the wife from her husband. We refer not to the anguish of heart caused by such involuntary separations; nor to the inability thus induced to perform mutually the obligations belonging to the relation. These have already been presented as direct arguments against slavery. At present we refer only to the violation of right which unavoidably follows the system. To secure the right of the slave would affect the master’s claim, therefore his right, however sacred, is cancelled to gratify the avarice of the slaveholder, and to maintain the system of iniquity.

By the law of God, as well as of reason, the husband is bound to protect and support his wife, but slavery denies him the right of doing either, farther than may suit the inclination of his master. His wife may, without crime, or the charge of crime, be flogged most cruelly before his eyes, and slavery does not even permit him to complain; the most wanton outrages may be committed on her person, and he dare not lift his hand to rescue her; nor even open his lips to remonstrate. The law provides no remedy; it does not even admit his right to seek redress; one thing, and only one, the law contemplates:— The absolute right of the master, to the entire exclusion of all right on the part of the slave. Slavery thus, in its practical working, violates rights, which are admitted by reason and guaranteed by the authority of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-roney.html">Moses Roney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The holding of human beings in a state of slavery sinful in Reformed Presbyterian</cite></span></figcaption>

<blockquote><p>…being persuaded in my conscience that the Lord had a true Church in this Realm [of England]… which, being assembled out of all the parts of the land in Parliament, did commit this authority to ordain ministers unto the bishops: and knowing out of the Word of God that every true Church has this power and authority to ordain ministers: I considered with myself that though the Church offended in committing this power and authority unto them that by the Law of God were not capable of it, yet I might without sin seek and take the Church’s ordination at their hands: as I may reverence and take the benefit of the prince’s power and authority, which is of God, though it be committed unto and exercised by men that by the Law of God are not capable of it. Secondly, seeing it is a thing not to be refused if a man entering into the ministry might have the approbation of all and every one of the ministers of the Gospel in the land:¹ it seems unto me the approbation of that bishop, that is also a minister and preacher of the Gospel, cannot be deemed to be merely unlawful.² ¹ [That such makes a valid ordination, see ‘The Implicit or Tacit Consent of Church Governors is Sufficient for the Power of Being an Office-Bearer’ and ‘That Persons who enter Church Office by Corruption, with the Standing Consent of the Rest of the Church Governors, is Valid’.] ² [Samuel Rutherford with much of the reformed likewise rightly argued that, while the office of a regular episcopal bishop is not Scriptural, nor do they have power, nor should be given power so that a single bishop could ordain a minister, yet the bishops did receive and maintain, with corruptions, the nature of the ministerial office: ‘That Episcopal Bishops &amp; Prelates are Unlawful but Valid Gospel Ministers’.] Thirdly, the authority of the Christian Magistrate (without whose liking and allowance a minister cannot be admitted to the ministry in peace) coming [joining] to the bishop by act of Parliament, I may more boldly come to him³ for his approbation in regard of the Law: not looking so much unto the man, [but] as regarding with reverence the power of the law and Christian magistrate.</p></blockquote>

<blockquote><p>As Baillie explained, there were certain cases of necessity in which a presbytery could deem it expedient to appoint a temporary bishop, either to prevent schism schism and preserve the unity of the national church or to preside over an ecclesiastical assembly as moderator… The type of ‘superintendent’ of which Baillie approved in the ancient church was never granted powers of order or jurisdiction that were not also given to preaching presbyters… Ordination was given by divine right to the presbytery of Ephesus–not just the meeting of presbyters but the ‘office and grade of presbyter’ as described by St Jerome and Calvin–which continued to exist even after the ordination of Timothy as a bishop; a delegation, rather than relegation of powers of jurisdiction. Acts 20:17 and 28 both outlined the divine warrant of temporary, ambulatory pastors who were ‘given the power of determining doctrine and expelling heretics from the church by the Sacred Spirit’. Yet Baillie quickly affirmed that the superiority maintained in these loci were during periods when the church’s polity was in flux.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-campbell.html">Alexander Campbell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Episcopacy in the Mind of Robert Baillie</cite>, 1637-1662’ The Scottish Historical Review, vol. 93, no. 236, pt. 1 (April 2014), pp. 29-55, p. 49</span></figcaption>

<div class="actions"><button class="copy" data-copy="“As Baillie explained, there were certain cases of necessity in which a presbytery could deem it expedient to appoint a temporary bishop, either to prevent schism schism and preserve the unity of the national church or to preside over an ecclesiastical assembly as moderator… The type of ‘superintendent’ of which Baillie approved in the ancient church was never granted powers of order or jurisdiction that were not also given to preaching presbyters… Ordination was given by divine right to the presbytery of Ephesus–not just the meeting of presbyters but the ‘office and grade of presbyter’ as described by St Jerome and Calvin–which continued to exist even after the ordination of Timothy as a bishop; a delegation, rather than relegation of powers of jurisdiction. Acts 20:17 and 28 both outlined the divine warrant of temporary, ambulatory pastors who were ‘given the power of determining doctrine and expelling heretics from the church by the Sacred Spirit’. Yet Baillie quickly affirmed that the superiority maintained in these loci were during periods when the church’s polity was in flux.”

0were%20certain,the%20church%E2%80%99s%20polity%20was%20in%20flux&amp;text=As%20Baillie%20explained%2C%20there%20were%20certain%20cases%20of&amp;text=periods%20when%20the%20church%E2%80%99s%20polity%20was%20in%20flux" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>This great execution upon them together with the diligence of Luther and other Divines to inform their minds did for some time much compesce [to restrain] that evil spirit and so much fright him out of all the bounds of upper Germany, that he did never since that time stir much in these Quarters: but behold his behavior elsewhere. Being rejected of Luther and his Disciples, he went to try Zwingli and his friends: unaware, and upon a sudden great numbers of Anabaptists did arise in Zurich, Bern, Basle, and many other parts of Switzerland: at the beginning they dissembled [lied about] the worst of their tenets [beliefs], they dealt earnestly with Zwingli to gather out of the churches he had reformed new separate congregations: many remonstrances [complaints] did they make to him against the profanity of the common multitude, and for the holiness that ought to be in every church member; they alleged a necessity for the saints to put themselves in new distinct churches (S). The same things did they press upon Oeco­lampadius at Basle, but when these grave men had rejected their motion, and demonstrated the iniquity of their schismatic way: then without more ado having seduced multitudes by their cor­ner and night sermons, they did themselves erect without any permission either of the magistrates or ministers, their separate congregations (T), and for a visible distinguishing character of their way they publicly anabaptized all who did enter into their society (V). For these insolencies the magistrate was offended and put some of them in prison, presently they cried out loud of persecution for conscience (X), and of unjust condemnation be­fore their cause was tried: hereupon many public disputations were instituted, Zwingli and others in Zurich many days from morning till evening did debate with them in presence of the magistrate and all who pleased at great length upon all their tenets; this same did Oecolampadius in Basle, and others in Bern, the arguments and answers with the consent of both sides were written and published, by this means many received satisfaction, many also remained obstinate in their error and became tumul­tuous in their practices, which caused the most of them to be ba­nished out of these States. To this severity the magistrate was forced by the danger of their principles, and their usual wal­king accordingly, where fear kept them not in order: in Chri­stian Commonwealths they counted magistrates unlawful, they took their enthusiasms and revelations for Gods express commandments, and it was one of their prophets ordinary revela­tions to cut off by the sword all magistrates, and whosoever op­posed their way, though father, mother, brother, or dearest friend, yea so powerfully did Satan insinuate himself in their or­dinary raptures, that no man could be secure from their cruelty, as by this example is visible. At Saint gall in Zwitzerland in the year 1526. Feb. 8. Thomas Skyker having spent the whole night with a company of Ana­baptists in their religious exercises, in the morning he was filled with an enthusiasm, and before his father, mother, and whole company, he commanded in the name of God his German bro­ther Leonard Skyker to kneel before him, and having gotten obe­dience thus far, his next prank was before them all to cut off his brother’s head, avowing he had an express warrant from God so to do (Y). Many such private murders and divers public uproars, made the magistrate every where to keep a severe hand over them; yet for all that could be done, they got into their hands the town of Munster; here the wisdom and patience of God permitted them to act to the full, all their speculations. A Story recorded by many, and needful to be remembered to the world’s end, for a memento unto all men to be very wary of an erroneous spirit, though he do appear at the first in the habit of the greatest piety and innocence; the matter was thus: In the year 1533 and 1534 by the labors of Bernard Rotman and some Hessian Preachers, Munster the greatest and strongest town of Westphalia was persuaded to cast out the Popish cor­ruptions; while the work of Reformation was there going on apace, the Anabaptists came in and mixed themselves according to their custom; for this has ever been the way of schismatics, like drones and wasps to fall upon the labors of others; they use not any where to be the instruments of any Reformation or con­version, but when that work by the labor of others is done, then they come in to spoil all, pressing upon a reformed and a con­verted people their fancies (Z). When the Gospel was flourishing in Munster, a certain Tay­lor of Leiden in Holland, one John Becold did come to Town, who at home in his own country, had drunk in all the Anabaptist ra­very [madness]: the man was of a quick and subtle wit, a great dissembler [liar], insinuating himself in the favor of the ministers, he did propone [put forward] at first only by way of scruple his arguments against infant bap­tism (AA): but in the mean time in his secret conventicles over all the city, he did instill the whole mystery of Anabaptism: The chief Minister Rotman did at the beginning preach zealously against that way (BB), but after that one Stapreda, a violent Anabaptist had eropen [?] in to be his colleague, Rotman was gai­ned to that party, and at a public disputation declared himself for them, notwithstanding the other Ministers did confute so clearly the Anabaptists grounds, that the Town Senate remained satisfied, and by that Edict commanded all the Anabaptists to depart the City (CC). But this Statute was so slackly executed, that the most remained still in Town, and did in their night meetings so diligently advance their cause, that a great many more were conquered; upon which strength waxing confident they defied their opposites, and came to a public insurrecti­on (DD). As yet the orthodox were the greater part, but the schisma­tics were the more witty [intelligent] and industrious, they managed so well their smaller strength, that they became not only considerable, but so formidable, that their adversaries were glad to indulge them their liberty and toleration which they had long desired (EE); but behold the issue of that indulgence. They who of a long time had made it their great work to cry down persecution and up toleration, when they had obtained that desire, they did not stand there, but went on every day to add new members to their society, til at last finding the great increase of their strength within the city, they did invite by messengers and letters their associates abroad from all quarters to join with them. These sum­mons made many strangers to slock [to entice] to the town, upon whose appearance without farther delay a public proclamation was issued for all to be rebaptized, or else immediately to depart the city under the pain of death (FF). Many of the best did flee, whose houses and goods were seized, yet many good people were forced to stay, for the Bishop of Munster had then blocked the City, whereby divers of those who offered to get out were killed and spoiled, and the rest were frighted from attempting any escape to the country. The Anabaptists becoming absolute masters of the town, made it their first care to discharge all the former magistrates, and to substitute in their place a new senate of their own fa­ction (GG), over which they did set two consuls, Knipperdolling and Kippenburgh, two of their most forward friends.They seised on the goods of all and killed whom they would. About that time a certain Baker of Harlem, Jan Mathis did make himself a great prophet among them, this man one day did deliver as a revelation from heaven, that every one should bring together all his books and papers, the Bible only excepted, of all these he made a fair bonfire (HH). His next command was, that every one should bring forth all his money and goods under the pain of death, that all might be common (II): none durst [to dare] be bold to disobey, justice was so quick and severe amongst them. One Truteling a smith for a merry [humorous] word against the prophets was brought forth before the people and shot dead by the Prophet Mathis own hands (KK); after this Mathis pretending a commission from God went out his alone, with confidence to overthrow the whole camp of them who besieged the city, but by the first of the enemy’s soldiers the false prophet was killed (LL).</p></blockquote>

h+private+murders+and+divers+public+uproars%2C+made+the+magistrate+every+where+to+keep+a+severe+hand+over+them%3B+yet+for+all+that+could+be+done%2C+they+got+into+their+hands+the+town+of+Munster%3B+here+the+wisdom+and+patience+of+God+permitted+them+to+act+to+the+full%2C+all+their+speculations.+A+Story+recorded+by+many%2C+and+needful+to+be+remembered+to+the+world%E2%80%99s+end%2C+for+a+memento+unto+all+men+to+be+very+wary+of+an+erroneous+spirit%2C+though+he+do+appear+at+the+first+in+the+habit+of+the+greatest+piety+and+innocence%3B+the+matter+was+thus%3A+In+the+year+1533+and+1534+by+the+labors+of+Bernard+Rotman+and+some+Hessian+Preachers%2C+Munster+the+greatest+and+strongest+town+of+Westphalia+was+persuaded+to+cast+out+the+Popish+cor%C2%ADruptions%3B+while+the+work+of+Reformation+was+there+going+on+apace%2C+the+Anabaptists+came+in+and+mixed+themselves+according+to+their+custom%3B+for+this+has+ever+been+the+way+of+schismatics%2C+like+drones+and+wasps+to+fall+upon+the+labors+of+others%3B+they+use+not+any+where+to+be+the+instruments+of+any+Reformation+or+con%C2%ADversion%2C+but+when+that+work+by+the+labor+of+others+is+done%2C+then+they+come+in+to+spoil+all%2C+pressing+upon+a+reformed+and+a+con%C2%ADverted+people+their+fancies+%28Z%29.+When+the+Gospel+was+flourishing+in+Munster%2C+a+certain+Tay%C2%ADlor+of+Leiden+in+Holland%2C+one+John+Becold+did+come+to+Town%2C+who+at+home+in+his+own+country%2C+had+drunk+in+all+the+Anabaptist+ra%C2%ADvery+%5Bmadness%5D%3A+the+man+was+of+a+quick+and+subtle+wit%2C+a+great+dissembler+%5Bliar%5D%2C+insinuating+himself+in+the+favor+of+the+ministers%2C+he+did+propone+%5Bput+forward%5D+at+first+only+by+way+of+scruple+his+arguments+against+infant+bap%C2%ADtism+%28AA%29%3A+but+in+the+mean+time+in+his+secret+conventicles+over+all+the+city%2C+he+did+instill+the+whole+mystery+of+Anabaptism%3A+The+chief+Minister+Rotman+did+at+the+beginning+preach+zealously+against+that+way+%28BB%29%2C+but+after+that+one+Stapreda%2C+a+violent+Anabaptist+had+eropen+%5B%3F%5D+in+to+be+his+colleague%2C+Rotman+was+gai%C2%ADned+to+that+party%2C+and+at+a+public+disputation+declared+himself+for+them%2C+notwithstanding+the+other+Ministers+did+confute+so+clearly+the+Anabaptists+grounds%2C+that+the+Town+Senate+remained+satisfied%2C+and+by+that+Edict+commanded+all+the+Anabaptists+to+depart+the+City+%28CC%29.+But+this+Statute+was+so+slackly+executed%2C+that+the+most+remained+still+in+Town%2C+and+did+in+their+night+meetings+so+diligently+advance+their+cause%2C+that+a+great+many+more+were+conquered%3B+upon+which+strength+waxing+confident+they+defied+their+opposites%2C+and+came+to+a+public+insurrecti%C2%ADon+%28DD%29.+As+yet+the+orthodox+were+the+greater+part%2C+but+the+schisma%C2%ADtics+were+the+more+witty+%5Bintelligent%5D+and+industrious%2C+they+managed+so+well+their+smaller+strength%2C+that+they+became+not+only+considerable%2C+but+so+formidable%2C+that+their+adversaries+were+glad+to+indulge+them+their+liberty+and+toleration+which+they+had+long+desired+%28EE%29%3B+but+behold+the+issue+of+that+indulgence.+They+who+of+a+long+time+had+made+it+their+great+work+to+cry+down+persecution+and+up+toleration%2C+when+they+had+obtained+that+desire%2C+they+did+not+stand+there%2C+but+went+on+every+day+to+add+new+members+to+their+society%2C+til+at+last+finding+the+great+increase+of+their+strength+within+the+city%2C+they+did+invite+by+messengers+and+letters+their+associates+abroad+from+all+quarters+to+join+with+them.+These+sum%C2%ADmons+made+many+strangers+to+slock+%5Bto+entice%5D+to+the+town%2C+upon+whose+appearance+without+farther+delay+a+public+proclamation+was+issued+for+all+to+be+rebaptized%2C+or+else+immediately+to+depart+the+city+under+the+pain+of+death+%28FF%29.+Many+of+the+best+did+flee%2C+whose+houses+and+goods+were+seized%2C+yet+many+good+people+were+forced+to+stay%2C+for+the+Bishop+of+Munster+had+then+blocked+the+City%2C+whereby+divers+of+those+who+offered+to+get+out+were+killed+and+spoiled%2C+and+the+rest+were+frighted+from+attempting+any+escape+to+the+country.+The+Anabaptists+becoming+absolute+masters+of+the+town%2C+made+it+their+first+care+to+discharge+all+the+former+magistrates%2C+and+to+substitute+in+their+place+a+new+senate+of+their+own+fa%C2%ADction+%28GG%29%2C+over+which+they+did+set+two+consuls%2C+Knipperdolling+and+Kippenburgh%2C+two+of+their+most+forward+friends.They+seised+on+the+goods+of+all+and+killed+whom+they+would.+About+that+time+a+certain+Baker+of+Harlem%2C+Jan+Mathis+did+make+himself+a+great+prophet+among+them%2C+this+man+one+day+did+deliver+as+a+revelation+from+heaven%2C+that+every+one+should+bring+together+all+his+books+and+papers%2C+the+Bible+only+excepted%2C+of+all+these+he+made+a+fair+bonfire+%28HH%29.+His+next+command+was%2C+that+every+one+should+bring+forth+all+his+money+and+goods+under+the+pain+of+death%2C+that+all+might+be+common+%28II%29%3A+none+durst+%5Bto+dare%5D+be+bold+to+disobey%2C+justice+was+so+quick+and+severe+amongst+them.+One+Truteling+a+smith+for+a+merry+%5Bhumorous%5D+word+against+the+prophets+was+brought+forth+before+the+people+and+shot+dead+by+the+Prophet+Mathis+own+hands+%28KK%29%3B+after+this+Mathis+pretending+a+commission+from+God+went+out+his+alone%2C+with+confidence+to+overthrow+the+whole+camp+of+them+who+besieged+the+city%2C+but+by+the+first+of+the+enemy%E2%80%99s+soldiers+the+false+prophet+was+killed+%28LL%29.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+Anabaptism%2C+The+True+Fountain+of+Independency%2C+Brownisme%2C+Antinomy%2C+Familism%2C+and+the+most+of+the+other+Errors+Which+For+The+Time+Do+Trouble+the+Church+of+England%2C+Unsealed%2C+%28London%2C+1647%29%2C+6%E2%80%9310.+NB%3A+For+ease+of+reading+and+because+archaic+spelling+tend+to+make+older+writers+seem+unintelligent%2C+the+s&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb7442c1df2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b7442c1df2.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/05/baillie-versus-tombes-3-how-the-particular-baptists-appeared-to-early-presbyterians/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

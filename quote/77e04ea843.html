<blockquote><p>If to carry the Ark on a new cart, instead of on the shoulders of the priests; and if to touch it, to prevent its fall or injury. was so criminal in the sight of heaven, what is it to exclude entirely from the worship of God his Divine songs, and substitute our own in their stead! Has God authorized such a course? Where? When? In what part of Scripture has God condemned his own Psalter, and declared it unfit for the Gospel Church as it stands, with all its figures and flowers, its prayers and promises, its curses and its consolations?

No proof can be adduced from the Bible that we have authority to remodel the Psalms, and gospelize them, and substitute our own improvement of them, and our own songs in their stead. And is the lack of such authority a matter of no moment? Is God less jealous now, respecting His worship and authority, than he was in the days of Nadab and Uzza?

Certainly not; he is the same unchangeable Jehovah, yesterday, today, and forever; and in the coming downfall of Babylon — in the dreadful catastrophe that is to overwhelm the “Man of Sin” for changing times and laws, and seating himself in the Temple of God, the Church will be taught most emphatically that God is to be sought now, as formerly, “after the due order.</p></blockquote>

<blockquote><p>There is no cause why any man should deny this epistle, as maintaining the popish sacrament of extreme unction, for that it does not, but speaks of the use of the gift of healing which was in the primitive church in the elders of the congregation, expressed by the outward sign of anointing with oil, as it is manifest, Mk. 6:13. Whereof, as Bede thinks, came the custom of anointing them that were possessed with devils, and the sick with oil, which he confesses might be done not only of the priests, but also of every Christian in their necessity, as Innocent teaches. Therefore, although he allow the ceremony, yet he allows not your sacrament, which may be ministered by none but by a priest, and unto none, but them that be in extremity of sickness, when health is despaired: yea, Bede understands it to pertain not only to them that are sick in body, but also to them that are weak in faith, though they be whole in body. “Commanding,” says he, “him that is weak in body, or in faith, that he which has sustained a greater wound, should remember to cure himself with the aid of more men, and them of the elder sort, neither should refer the cause of his weakness to the younger sort, and less learned, lest he receive by them, any hurtful speech or counsel.” You see therefore, that even the custom and use of the ceremony is greatly changed from the days of Bede, which is but seven or eight hundred years ago. For in the popish church one priest is sufficient, young or old, who comes not to give any ghostly counsel, but commonly when a man is past his senses. It is certain therefore, that in Bede’s time, this anointing was not taken for a sacrament. But you say, what dishonor is it to God that a sacrament should be instituted in oil more than in water, etc. Verily if God had instituted any such perpetual sacrament in oil, as He does in water, we would nothing doubt of it. But this sign of anointing was temporal, as the gift of healing whereunto it was annexed was but for a season, and that does this Scripture tell us sufficiently, seeing experience testifies that the gift of healing does not now remain. Where you say the church of God has always used it, it is false: for the Greek church never received it to this day as a sacrament, and for many hundred years it was counted a free ceremony in the Latin church, as appears by the epistle of Innocent and that which Bede writes, that it was lawful for all Christians to use it. But when we say it pertained to the gift of healing, you ask, “whether Christ appointed any certain creature or external element unto the apostles generally to work miracles by.” I answer no: for with external sign and without, they did miracles. Yet it appears, Mk. 6:13, that He appointed them to anoint the sick with oil that they might recover health, though it were not necessary so to do at all times, when they healed the sick. Where you say, “that Christ would have miracles in the beginning wrought by sundry sacraments which remain, the miracles ceasing,” we find no such matter, which it were so, the institution and commandment of the perpetuity of them were sufficient for their continuance. You demand, “whether ever we read or heard that men were generally commanded to seek for their health by miraculous means?” We read that men were commanded generally to seek all spiritual and miraculous gilts, as long at God gave them, and not health only, but the gift of healing also, 1 Cor. 12:31; ch. 14:1, under the general rule of submitting all our requests and whole will to God’s will. You demand, whether all priests or elders had the gift of miracles in the primitive church. We answer, it is not necessary that every one had the gift of healing, yet among the company of elders that were in every church, some doubtless had when others had which were not elders of the church. Or the gift might be given to the whole number, which every one had not, as Paul speaks of the gift of prophecy, given by laying on of the hands of the elders, 1 Tim. 4:14. Neither would the apostle promise health, if the gift of healing had not been general in every congregation. But though the apostles had the gift to cure men and revive them, yet there was no such general precept to call for the apostles, to heal men or restore them: so long as that gift continued in the church, it was all men’s duty to seek the use of it, so far as it would stand with God’s pleasure. Therefore as Paul sets down an order for the right use of the gifts of tongues, 1 Cor. 14:27, so does James here for the gift of healing. You ask if any external element, or miraculous practice unless it were a sacrament, had promise of the remission of all kind of actual sins joined to it? But neither has the element of oil any such promise annexed unto it, but the prayers of the faithful, as 1 John 5:6. You ask whether James could institute such a ceremony of himself? etc. We say he did not institute any such ceremony as you speak of, nor mentions any such, but wills the gift of healing, to be used according as God had appointed. As for the promise of remission of sins, he annexes it not to the element, but out of the general doctrine of prayer, he shows the fruit thereof to be the obtaining of remission of sins. But at “other times,” you say, “we rail at the popish church, for annexing of remission of sins, to the element of water. Here we are driven to hold that James prescribed a miraculous oil, which had much more power and efficacy.” Concerning your popish holy water, although it be conjured to be health of body and soul, which includes not only venial but all sins: yet even your doctrine of venial sins is intolerable. For who gave you authority to annex any remission of sins to that or any other creature? But that you say, we are driven to hold, is false, for we hold no such thing, either that James of his own authority prescribed a miraculous oil, or that any such power or efficacy to remit sins, was in the oil, or annexed to it. Therefore you are driven to the straits, that without shame feign a sacrament of a ceremony used only for health of body, and are bold to slander the universal church of Christ, with such a practice as never was received in the church of Christ, for a sacrament. How the ceremony was used in Bede’s time I have showed before. The testimony of Innocent and De visitat. infirm. I have answered before, Gal. 4, sect. 2. Bernard writes no more but that Malachi was anointed according to the ceremony used in his time. The other councils that follow, being of later years, are according to the epistle of Innocent. Who because, he says, that this anointing may be used, not only of the priests, but also of all Christians, you are driven to a poor shift, in saying they used it not in that sacramental sort which the apostle prescribes; but Innocent says plainly they might use it lawfully, without any distinction of sacramental sort, as his words are manifest, which with small learning, may easily be understood. But where you say, “they use it as Christians do now the water of baptism, to take it home with them after it was hallowed, and to give it to their diseased to drink,” no doubt it was a vile superstitious abusing of the sacrament of baptism, as there have been many by conjurers and idolaters, but never used of well instructed Christians.</p></blockquote>

ether+all+priests+or+elders+had+the+gift+of+miracles+in+the+primitive+church.+We+answer%2C+it+is+not+necessary+that+every+one+had+the+gift+of+healing%2C+yet+among+the+company+of+elders+that+were+in+every+church%2C+some+doubtless+had+when+others+had+which+were+not+elders+of+the+church.+Or+the+gift+might+be+given+to+the+whole+number%2C+which+every+one+had+not%2C+as+Paul+speaks+of+the+gift+of+prophecy%2C+given+by+laying+on+of+the+hands+of+the+elders%2C+1+Tim.+4%3A14.+Neither+would+the+apostle+promise+health%2C+if+the+gift+of+healing+had+not+been+general+in+every+congregation.+But+though+the+apostles+had+the+gift+to+cure+men+and+revive+them%2C+yet+there+was+no+such+general+precept+to+call+for+the+apostles%2C+to+heal+men+or+restore+them%3A+so+long+as+that+gift+continued+in+the+church%2C+it+was+all+men%E2%80%99s+duty+to+seek+the+use+of+it%2C+so+far+as+it+would+stand+with+God%E2%80%99s+pleasure.+Therefore+as+Paul+sets+down+an+order+for+the+right+use+of+the+gifts+of+tongues%2C+1+Cor.+14%3A27%2C+so+does+James+here+for+the+gift+of+healing.+You+ask+if+any+external+element%2C+or+miraculous+practice+unless+it+were+a+sacrament%2C+had+promise+of+the+remission+of+all+kind+of+actual+sins+joined+to+it%3F+But+neither+has+the+element+of+oil+any+such+promise+annexed+unto+it%2C+but+the+prayers+of+the+faithful%2C+as+1+John+5%3A6.+You+ask+whether+James+could+institute+such+a+ceremony+of+himself%3F+etc.+We+say+he+did+not+institute+any+such+ceremony+as+you+speak+of%2C+nor+mentions+any+such%2C+but+wills+the+gift+of+healing%2C+to+be+used+according+as+God+had+appointed.+As+for+the+promise+of+remission+of+sins%2C+he+annexes+it+not+to+the+element%2C+but+out+of+the+general+doctrine+of+prayer%2C+he+shows+the+fruit+thereof+to+be+the+obtaining+of+remission+of+sins.+But+at+%E2%80%9Cother+times%2C%E2%80%9D+you+say%2C+%E2%80%9Cwe+rail+at+the+popish+church%2C+for+annexing+of+remission+of+sins%2C+to+the+element+of+water.+Here+we+are+driven+to+hold+that+James+prescribed+a+miraculous+oil%2C+which+had+much+more+power+and+efficacy.%E2%80%9D+Concerning+your+popish+holy+water%2C+although+it+be+conjured+to+be+health+of+body+and+soul%2C+which+includes+not+only+venial+but+all+sins%3A+yet+even+your+doctrine+of+venial+sins+is+intolerable.+For+who+gave+you+authority+to+annex+any+remission+of+sins+to+that+or+any+other+creature%3F+But+that+you+say%2C+we+are+driven+to+hold%2C+is+false%2C+for+we+hold+no+such+thing%2C+either+that+James+of+his+own+authority+prescribed+a+miraculous+oil%2C+or+that+any+such+power+or+efficacy+to+remit+sins%2C+was+in+the+oil%2C+or+annexed+to+it.+Therefore+you+are+driven+to+the+straits%2C+that+without+shame+feign+a+sacrament+of+a+ceremony+used+only+for+health+of+body%2C+and+are+bold+to+slander+the+universal+church+of+Christ%2C+with+such+a+practice+as+never+was+received+in+the+church+of+Christ%2C+for+a+sacrament.+How+the+ceremony+was+used+in+Bede%E2%80%99s+time+I+have+showed+before.+The+testimony+of+Innocent+and+De+visitat.+infirm.+I+have+answered+before%2C+Gal.+4%2C+sect.+2.+Bernard+writes+no+more+but+that+Malachi+was+anointed+according+to+the+ceremony+used+in+his+time.+The+other+councils+that+follow%2C+being+of+later+years%2C+are+according+to+the+epistle+of+Innocent.+Who+because%2C+he+says%2C+that+this+anointing+may+be+used%2C+not+only+of+the+priests%2C+but+also+of+all+Christians%2C+you+are+driven+to+a+poor+shift%2C+in+saying+they+used+it+not+in+that+sacramental+sort+which+the+apostle+prescribes%3B+but+Innocent+says+plainly+they+might+use+it+lawfully%2C+without+any+distinction+of+sacramental+sort%2C+as+his+words+are+manifest%2C+which+with+small+learning%2C+may+easily+be+understood.+But+where+you+say%2C+%E2%80%9Cthey+use+it+as+Christians+do+now+the+water+of+baptism%2C+to+take+it+home+with+them+after+it+was+hallowed%2C+and+to+give+it+to+their+diseased+to+drink%2C%E2%80%9D+no+doubt+it+was+a+vile+superstitious+abusing+of+the+sacrament+of+baptism%2C+as+there+have+been+many+by+conjurers+and+idolaters%2C+but+never+used+of+well+instructed+Christians.%E2%80%9D%0A%0A%E2%80%94+William+Fulke%2C+Confutation+of+the+Rhemish+Testament%2C+%28d.+1589%3B+NY%3A+Leavitt%2C+1834%29%2C+p.+361%2C+on+James+5%3A14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa7b6c67296.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a7b6c67296.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-holy-kiss-foot-washing-anointing-with-oil/#:~:text=There%20is%20no%20cause%20why%20any,never%20used%20of%20well%20instructed%20Christians&amp;text=There%20is%20no%20cause%20why%20any%20man%20should&amp;text=idolaters%2C%20but%20never%20used%20of%20well%20instructed%20Christians" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5d1d7cee19" data-kw="">
<blockquote><p>Psalms are song by emperors; the common people rejoice in them. Each man does his utmost in singing what will be a blessing to all. Psalms are sung in the home and rehearsed on the streets. The psalm is learned without labor and remembered with delight. Psalmody unites those who disagree, makes friends of those at odds, and brings together those who are out of charity with one another. Who could retain a grievance against the man whom he had joined in singing before God? The singing of praise is the very bond of unity, when the whole people join a single act of song.</p></blockquote>

</figure><figure class="quote" id="q-f6ee7b820c" data-kw="">
<blockquote><p>Am I suggesting that women return to wearing coverings or veils? No. We must distinguish between the fundamental principle that underlies a text and the application of that principle in a specific culture… Now, in the first century, failure to wear a covering sent a signal to the congregation that a woman was rejecting the authority of male leadership. Paul was concerned about head coverings only because of the message they sent to people in that culture… Lack of head coverings sends no message at all in our culture. Nevertheless, that does not mean that this text does not apply to our culture. The principle still stands that women should pray and prophesies will be one indication of whether she is humble and submissive. The principle enunciated here should be applied in a variety of ways given the diversity of the human situation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-r-schreiner.html">Thomas R. Schreiner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Head Coverings, Prophecies &amp; the Trinity</cite>, 1 Corinthians 11:2-16’ in eds. Piper &amp; Grudem, Recovering Biblical Manhood &amp; Womanhood: a Response to Evangelical Feminism (Crossway, 1991), pp. 124-39, p. 138</span></figcaption>

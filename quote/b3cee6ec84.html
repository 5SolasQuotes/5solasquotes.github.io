<main class="wrap"><figure class="quote" id="q-b3cee6ec84" data-kw="">
<blockquote><p>[T]he books of Moses and the prophets through so many ages, and captivities, came sound and uncorrupted even until the time of Christ and his apostles. For the Lord Jesus and the apostles used those books as true copies and authentical; which undoubtedly they neither would, nor could, have done, if so be that either they had been corrupted, or altogether perished. The books also, which the apostles of Christ have added, were throughout all persecutions kept in the church safe and uncorrupted, and are come sound and uncorrupted into our hands, upon whom the ends of the world are fallen. For by the vigilant care and unspeakable goodness of God, our Father, it is brought to pass, that no age at any time either hath or shall want so great a treasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids MI: Reformation Heritage Books, 2004), i, 55.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7f6dfea4c5" data-kw="">
<blockquote><p>It is not the spirit of man that can, and doth thus work: for first, the spirit of man perceiveth not the things of God, till God’s Spirit acquaint him with them. Secondly, they be foolishness unto him. Thirdly, his wisdom is enmity with God, so as God’s wisdom in divine mysteries, and man’s wisdom can never agree in one. Fourthly, the spirit of man savoreth the things of the flesh, and not of the Spirit of God. Fifthly, his heart is continually evil, till he be regenerate. Sixthly and lastly, it is evidently known by too much miserable experience, that man loveth not the study of the Scriptures, he cannot delight in them, he cannot away to frame his life after them; everyone that hath any spark of divine knowledge, knoweth this to be true from his own natural corruption, both in himself and others also.

Now can any reasonable-minded man think, that such an averse spirit as is in man, so disaffecting the holy Scriptures, and the study thereof, that it can be that Spirit which persuadeth and draweth men, contrary to it corrupt self, to embrace that Religion which is grounded upon the Scriptures, and to press to the obedience thereof? Yea, can it be man’s spirit, that worketh love to such a Religion, which so opposeth man’s corruption, as the worldly wise Politician derideth it, the pleasurable man hateth it, the greedy of gain cannot abide to be ruled by it, and the haughty spirit which hunteth after the pride of life, hath it in great contempt? so as none in very deed, but only such as do deny themselves, do forsake the world, and can be well contented to take up their cross, and follow Christ, either can, or will embrace the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Look beyond Luther: or An answer to that question, so often and so insultingly proposed by our adversaries, asking us; where this our religion was before Luther’s time? Whereto are added sound props to bear up honest-hearted Protestants, that they fall not from their saving-faith</cite>, (London: Felix Kingston, 1623), p. 4.</span></figcaption>

</figure><figure class="quote" id="q-162c1c713d" data-kw="">
<blockquote><p>Meanwhile we remark, that this principle, instead of being a principle, either of oppression on the one hand, or slavish submission on the other, is the great charter of Christian liberty, and of the elevated dignity of Christ’s freemen; while the opposite principle is not only the badge, but the instrument of tyranny on the one hand, and of slavish submission to the impositions and inventions of men on the other. It is no slavery, and no degradation to submit to the commands, and walk according to the rules prescribed by the Majesty of heaven and earth. “I will walk at liberty, because I seek thy precepts,” said David. ” Ye shall know the truth, and the truth shall make you free,” says our Lord; …

This is verified by the whole facts alike of individual and of social history, civil and ecclesiastical. That is the history of individual and monkish fanaticism? Not a history, in the first instance, of bad men, but the history of good men following their own inventions, and putting in practice their own devices, and being “wise above what was written;” and the whole issuing in the excesses of folly, and the most enormous crimes of lust and murder. What is the history of the whole gorgeous and burdensome, and even puerile, ceremonial and ritual of Rome, now being copied and imitated in the Church of England at the present moment?

Not the history of things positively forbidden by the Bible in so many words, but the history of things which are “not prescribed in Holy Scripture.” If one man is at liberty to plead for his own invention, because it is not forbidden in the Bible, why may not another do the same for his, and forthwith set it up, on the principle that all is lawful in the worship of God which is not forbidden? What right have the anti-ritualists of England, unless they adopt our principle, to disturb the public peace by their present opposition] Nay, what right have such parties to oppose the ritual of Antichrist himself?

Very different is the case when the Christian man and the Christian church can demand, ” By what Bible authority do you these things? and who gave you this authority?”

Would that the professing church of Christ—would that Christian men might seriously ponder, in the first instance, the great principle to which we have given expression in the words of the Westminster Confession of Faith. It is one which seems to us just, reasonable, and scriptural, and of unspeakable importance to the liberty and highest interests of the Christian church, and their only security against the irruptions of the Papacy, and the introduction of its worst practices into the Church of England.

We tell them, and tell all men, that history, experience, and rational reflection, show that men waste their breath against all such inventions, and gratuitously disturb the peace both of Church and State, if they cannot plead the authority of the Word of God for what they are doing; and what is more, they disturb it in vain—for ”will-worship,” sanctioned, will have its own way, and human nature, “priest and people, love to have it so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-gibson.html">James Gibson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Public Worship of God: Its Authority and Modes, Hymns and Hymn Books</cite>, (London: James Nisbet and Son, 1869), pp 17-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

+his%2C+and+forthwith+set+it+up%2C+on+the+principle+that+all+is+lawful+in+the+worship+of+God+which+is+not+forbidden%3F+What+right+have+the+anti-ritualists+of+England%2C+unless+they+adopt+our+principle%2C+to+disturb+the+public+peace+by+their+present+opposition%5D+Nay%2C+what+right+have+such+parties+to+oppose+the+ritual+of+Antichrist+himself%3F%0A%0AVery+different+is+the+case+when+the+Christian+man+and+the+Christian+church+can+demand%2C+%E2%80%9D+By+what+Bible+authority+do+you+these+things%3F+and+who+gave+you+this+authority%3F%E2%80%9D%0A%0AWould+that+the+professing+church+of+Christ%E2%80%94would+that+Christian+men+might+seriously+ponder%2C+in+the+first+instance%2C+the+great+principle+to+which+we+have+given+expression+in+the+words+of+the+Westminster+Confession+of+Faith.+It+is+one+which+seems+to+us+just%2C+reasonable%2C+and+scriptural%2C+and+of+unspeakable+importance+to+the+liberty+and+highest+interests+of+the+Christian+church%2C+and+their+only+security+against+the+irruptions+of+the+Papacy%2C+and+the+introduction+of+its+worst+practices+into+the+Church+of+England.%0A%0AWe+tell+them%2C+and+tell+all+men%2C+that+history%2C+experience%2C+and+rational+reflection%2C+show+that+men+waste+their+breath+against+all+such+inventions%2C+and+gratuitously+disturb+the+peace+both+of+Church+and+State%2C+if+they+cannot+plead+the+authority+of+the+Word+of+God+for+what+they+are+doing%3B+and+what+is+more%2C+they+disturb+it+in+vain%E2%80%94for+%E2%80%9Dwill-worship%2C%E2%80%9D+sanctioned%2C+will+have+its+own+way%2C+and+human+nature%2C+%E2%80%9Cpriest+and+people%2C+love+to+have+it+so.%E2%80%9D%0A%0A%E2%80%94+James+Gibson%2C+The+Public+Worship+of+God%3A+Its+Authority+and+Modes%2C+Hymns+and+Hymn+Books%2C+%28London%3A+James+Nisbet+and+Son%2C+1869%29%2C+pp+17-18.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F162c1c713d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/162c1c713d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/04/16/james-gibson-on-the-regulative-principle-and-the-defence-of-christian-liberty-in-worship/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>CANON 24. Concerning the branches of the vine. The branches on the vine do not give life to the vine, but receive life from it; thus the vine is related to its branches in such a way that it supplies them with what they need to live, and does not take this from them. Thus it is to the advantage of the disciples, not Christ, both to have Christ abiding in them and to abide in Christ. For if the vine is cut down another can shoot up from the live root; but one who is cut off from the vine cannot live without the root (John 15:5ff).</p></blockquote>

<blockquote><p>Thus far, then, is the liberty given by Christ unto his church preserved entire; and the request seems not immodest that is made for the continuance of it. When men cry to God for the liberty in his worship which was left unto them by Christ and his apostles, he will undoubtedly hear, though their fellow-servants should be deaf to the like requests made unto them; and truly they must have a great confidence in their own wisdom and sufficiency, who will undertake to appoint, and impose on others, the observation of things in the worship of God which neither our Lord Jesus nor his apostles did appoint or impose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 15 (Edinburgh: T&amp;T Clark, n.d.), 17.</span></figcaption>

<blockquote><p>These Sections teach the following propositions: 1st. God alone is Lord of the human conscience, which is responsible only to his authority. 2d. God has authoritatively addressed the human conscience only in his law, the only perfect revelation of which in this world is the inspired Scriptures. Hence God himself has set the human conscience free from all obligation to believe or obey any such doctrines or commandments of men as are either contrary to or aside from the teachings of that Word. 3d. Hence to believe such doctrines, or to obey such commandments as a matter of conscience, is to be guilty of the sin of betraying the liberty of conscience and its loyalty to its only Lord; and to require such an obedience of others is to be guilty of the sin of usurping the prerogative of God and attempting to destroy the most precious liberties of men. 4th. This Christian liberty is not, however, absolute. It has its distinct end and limits. Its end is that every person, without hindrance of his fellow-men, should have opportunity to serve God according to his will. The limits of this liberty are of two kinds: (a.) The authority of God, the Lord of conscience. (b.) The equal liberties and rights of our fellow-men, with whom we dwell in organized societies. 5th. Since God has established both the Church and the State, obedience to the legitimate authorities of either, acting within their rightful sphere, is an essential part of obedience to God. 6th. The Church has the right from God of exercising its discipline upon any who maintain or practice opinions or actions plainly contrary to the light of nature, the doctrines of the Scripture or the peace and welfare of the Christian community. 1st. That, in the highest and only absolute sense, God alone is Lord of the human conscience, has never been denied. The real question raised by Romanists, and those in general who have claimed the authority of binding and loosing the consciences of their fellow-men, relates to the standard which God has given us of his will, and the means he has chosen to enforce it. The Romanists maintain that the true standard and organ of the will of God in the world is the infallible inspired Church, or body of bishops ordained regularly in a direct line from the apostles and in communion with the See of Rome. They hold that this Church has power to define doctrines and enact laws in God’s name, binding the consciences of men; and that it possesses, in the power of the keys, the right, in execution of these laws, to absolve or condemn in God’s name, to bind or loose the subject and open or shut the kingdom of heaven, and to impose ecclesiastical penalties. By far the larger part of what the Church of Rome actually enforces in the way of faith and practice is derived from ecclesiastical tradition and evidently perverted interpretations of Scripture. The Erastian State churches of Germany and England have often attempted to enforce outward uniformity in profession and worship, in spite of the conscientious scruples of multitudes of their best citizens, on the plea that the right and responsibility of regulating the ecclesiastical as well as the civil interests of the nation devolve upon the civil magistrate. In opposition to all this, Protestants insist— 2d. That God has given only one, and that a perfect, rule of faith and practice in spiritual matters in the inspired Scriptures, and that he has hence set free the human conscience from all obligation to believe or obey any such doctrines or commandments of men as are contrary to or aside from the teachings of that Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, on the Westminster Confession of Faith ch. 20 in A Commentary on the Confession of Faith (Philadelphia, 1920), 358–60.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

<blockquote><p>If it be asked whether ignorance can excuse a man, and how far it excuses. Answer 1. There is no ignorance (properly so called) that excuses wholly, pro toto, it being of itself sinful, and men being obliged to know what is sin, and what not; neither can ever men do that out of faith which they do in ignorance, and know not if it be in itself sinful or lawful: this is to be understood in respect of ignorantia Juris, non facti, of ‘the ignorance of the Law, and not of the ignorance of the fact’ (as they call it); for men may sometimes be ignorant of this, and yet be innocent, as when one is cutting with an axe, and it falls off the helve, etc. but in respect of the Law, there is no invincible ignorance that can excuse any for their not knowing God’s mind, because they are obliged to know it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, … (London, 1675), 1st Commandment, pp. 45-46</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

<blockquote><p>§26. Direction 15. It is ever unseasonable to perform a lesser duty of worship when a greater should be done: Therefore it much concerns you to be able to discern when two duties are inconsistent which is then the greater and to be preferred: In which the interest of the end must much direct you: that being usually the greatest which has the greatest tendency to the greatest good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London: 1673), pt. 3, ch. 2, p. 686</span></figcaption>

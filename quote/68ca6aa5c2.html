<main class="wrap"><figure class="quote" id="q-68ca6aa5c2" data-kw="">
<blockquote><p>XXVI. Although the wicked as well as the pious will rise again, still the resurrection of each will be diverse as to cause as well as with regard to manner. The latter, indeed, will be made by Christ the Mediator, as head, by the efficacy of his quickening Spirit (Rom. 8:11), to an immortality of glory. But the former by Christ as the Son of God, the Lord and Judge, by virtue of his omnipotence and justice, to eternal punishment, in which the wicked will acquire a physical immortality and incorruptibility, but in order to greater punishment—that they may suffer for ever and thus feel that they die, so as never to die; not only by a punishment of loss, but also by the severest punishment of sense, of which there will be no end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.1.26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection/resurrection-of-the-body.html">Resurrection of the Body</a> › <a href="../topics/resurrection/resurrection-of-the-body/resurrection-of-the-just-and-unjust.html">Resurrection of the just and unjust</a></span><span class="t"><a href="../topics/judgment-and-the-final-state/the-last-judgment.html">The Last Judgment</a> › <a href="../topics/judgment-and-the-final-state/the-last-judgment/the-judge.html">The Judge</a></span><span class="t"><a href="../topics/resurrection/christs-resurrection-as-the-pledge.html">Christ&#x27;s Resurrection as the Pledge</a> › <a href="../topics/resurrection/christs-resurrection-as-the-pledge/united-to-the-risen-head.html">United to the risen Head</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-654e99d971" data-kw="">
<blockquote><p>When the change above described has been accomplished, when once the resurrection has taken place, then, according to the language of Scripture, death shall be completely conquered. Not only shall those over whom he had triumphed, and whom he had so long detained in the prison of the grave, be delivered from his power, but there shall be no more death. … The victory over death is to be complete and final.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Epistle to the Corinthians</cite>, on 15:54</span></figcaption>

</figure><figure class="quote" id="q-4ca0e1084c" data-kw="">
<blockquote><p>III. Although the resurrection of the dead surpasses nature and man&#x27;s corrupt reason, yet it is neither against nature nor against right reason. For right reason teaches both that the dead can be raised and that they are to be raised. The former is concluded from the omnipotence of God, the latter from his justice. For as it is just that certain sins should be punished after this life, so it is also just that what was the partner of the sins should be the partner of the penalties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 34 (the resurrection), canon 3</span></figcaption>

</figure><figure class="quote" id="q-f76e8433df" data-kw="">
<blockquote><p>Now although the efficiency of Christ&#x27;s Resurrection extends to the resurrection of the good and wicked alike, still its exemplarity extends properly only to the just, who are made conformable with His Sonship, according to Romans 8:29.</p></blockquote>

</figure><figure class="quote" id="q-bf5c30a0dc" data-kw="same body identity">
<blockquote><p>Are the same bodies numerically which have died to be raised again? We affirm against the Socinians. It is not inquired whether they will be the same bodies as to qualities and conditions. For we confess that they will undergo a great change so as to be no longer animal, corruptible, weak, miserable and mortal, but spiritual, incorruptible, strong, glorious and immortal. But concerning numerical identity of substance—whether the same flesh which was dissolved by death will rise again—this we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.2.1–2</span></figcaption>

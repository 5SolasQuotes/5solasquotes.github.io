<main class="wrap"><figure class="quote" id="q-c19b347d3b" data-kw="">
<blockquote><p>The admission of ministers to their offices must consist in consent of the people and kirk whereto they shall be appointed, and in approbation of the learned ministers appointed for their examination. … Other ceremony than the public approbation of the people, and declaration of the chief minister, that the person there presented is appointed to serve that kirk, we cannot approve; for albeit the apostles used the imposition of hands, yet seeing the miracle is ceased, the using of the ceremony we judge is not necessary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/first-scottish-book-of-discipline.html">First Scottish Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fourth Head, Concerning Ministers and Their Lawful Election</cite></span></figcaption>

<blockquote><p>3. Christ gives gifts to men now in the due use of means and not by miracle: Therefore He gives them in great diversity and by hard study and long time, Heb. 5:12, “For the time they ought to have been teachers,” etc. Therefore a novice must not be a bishop, but an elder [older person], whence the office had its name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), p. 68</span></figcaption>

— Richard Baxter, Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen (1684; RBO, 2024), p. 68">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+Christ+gives+gifts+to+men+now+in+the+due+use+of+means+and+not+by+miracle%3A+Therefore+He+gives+them+in+great+diversity+and+by+hard+study+and+long+time%2C+Heb.+5%3A12%2C+%E2%80%9CFor+the+time+they+ought+to+have+been+teachers%2C%E2%80%9D+etc.+Therefore+a+novice+must+not+be+a+bishop%2C+but+an+elder+%5Bolder+person%5D%2C+whence+the+office+had+its+name.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Richard+Baxter+on+Worship+%26+Catholicity+against+Separatism+%26+John+Owen+%281684%3B+RBO%2C+2024%29%2C+p.+68&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3b26aa11de.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3b26aa11de.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/preparation-for-ministry#:~:text=3.%20Christ%20gives%20gifts%20to%20men,whence%20the%20office%20had%20its%20name&amp;text=3.%20Christ%20gives%20gifts%20to%20men%20now%20in&amp;text=older%20person%5D%2C%20whence%20the%20office%20had%20its%20name" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2d7bd346a7" data-kw="">
<blockquote><p>Notwithstanding of all the multiplicity of Popish orders, yet Peter Lombard (pt. 4, distinction 4) treading the vestiges of the primitive simplicity, did observe that the apostles left only two sacred orders to be perpetual in the Church, the order of deacons and the order of elders. The administration of deacons is exercised about things bodily. The administration of elders about things spiritual. The former about the goods: the latter about the government of the Church. Now elders are of three sorts: 1. Preaching Elders, or Pastors, 2. Teaching Elders or Doctors, 3. Ruling Elders. All these are elders, because they have voice in presbyteries and all assemblies of the Church, and the government of the Church is incumbent to them all: nor only to the pastor and elder, but to the doctor also. The bishop of Dune, in his Examen conjurationis Scoticae [‘Examination of the Scottish Conjuration’], p. 35, alleges that our Church of Scotland did never yet determine whether doctors and deacons have right of voicing in the consistories and assemblies of the Church. But had he read our book of Policy, he might have found that it excludes deacons from being members of presbyteries and assemblies, ch. 8, but admits doctors into the same, ch. 5. The doctor being an elder, as said is, should assist the pastor in the government of the Kirk and concur with the elders, his brethren, in all assemblies, by reason the interpretation of the Word, which is [the] only judge in ecclesiastical matters, is committed to his charge. But they differ in that the pastor labors in the Word of exhortation, that is, by the gift of wisdom, applies the Word to the manners of his flock, and that in season and out of season, as he knows their particular cases to require. The doctor labours in the Word of doctrine, that is, without such applications as the pastor uses, by simple teaching he preserves the truth and sound interpretation of the Scriptures against all heresy and error. The ruling elder does neither of these, but labours in the government and policy of the Church only. The apostle has distinguished these three sorts of elders, 1 Tim. 5:17, ‘Let elders that rule well be counted worthy of double honour, especially they who labour in the Word and doctrine,’ where, as Beza notes, he distinguishes the Word, which is the pastor’s part, from doctrine, which is the doctor’s part. Even as Rom. 12:7-8, he distinguishes teaching from exhortation: and 1 Cor. 12:8 puts the Word of wisdom and the word of knowledge for two different things. Now beside those elders which labour in the Word, and those which labor in doctrine, Paul speaks to Timothy of a third sort of elders, which labor neither in the Word nor doctrine, but in ruling well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the Points of Ruling-Elders</cite>, …. (Edinburgh: Bryson, 1641), ch. 2, pp. 8-10</span></figcaption>

</figure><figure class="quote" id="q-546a5fc60b" data-kw="">
<blockquote><p>We grant in this Question:

1. That private Christians from the common duty of charity, making use of those spiritual gifts which they have received from God for men’s edification, do sometimes convert to the faith those souls which went astray; and bring those who live in the world, out of the Church, unto the body of the Church of Christ. See Jn. 4:29, etc. 1 Cor. 7:16.

2. We do not think that the office of him who preaches the Word, as sent of God and the Church, do confer any efficacy to the Word preached by him; or has any influence upon the soul of him that is converted. For the power of God only, and the Spirit which accompanies the Word preached, does give to the Word preached a virtue and saving efficacy for the conversion and salvation of souls, 1 Cor. 12:11 and 15:10. But we affirm that the Word preached by him who is ordained to an ecclesiastical office, and does by his ecclesiastical office authoritatively preach the Word, is the ordinary means to which God does by the efficacy of his Spirit give assistance for the conversion of those who live in sin out of Church-communion. So that pastors, as pastors, by virtue of their pastoral office are the ordinary means of the conversion of those men who live in the world. This assertion is proved:

1. Because faith is given and first attained by the Word preached, by those who by an ecclesiastical call are sent of God, to the pastoral Office, and by virtue of mission and function preach the Word, whereby faith is wrought in man. See Rom. 10:14-15; 1 Cor. 3:19; Gal. 3:2.

2. Because pastors of Churches by reason of the office they bear, are fathers, who do first beget their children to Christ in the Church; and by the spiritual seed of God, do give spirit and life to those that are dead in sins: See 1 Cor. 4:15; Gal. 4:19; 2 Cor. 2:16.

3. Pastors are enjoined, as an office peculiarly belonging to them, to preach the Word of God with all meekness, mildness, and patience, if perhaps God will give repentance to those who are held captives in the snares of the Devil, 2 Tim. 2:24-26, to open the eyes of those who sit in darkness, and to bring them to the light of the Gospel and of grace, Acts 26:18, to seek lost sheep for the Lord, Eze. 34:4-5, and to bring into captivity to the obedience of Christ those who with high minds exalt themselves against the Word of God, 2 Cor. 10:4-5. We reject therefore the opposite positions of those:

1. Who affirm that the conversion of wicked men is not an effect intended that it should be produced by virtue of the ecclesiastical ministry as a means appointed to that end; and therefore that never any are converted by the pastors of the Church by virtue of any ecclesiastical office but by accident, as they are gifted Christians: affirming that ordinarily the conversion of such as go astray is by such Christians endued with gifts of prophesy. But it is certain from the holy Scripture that the ecclesiastical ministry is appointed by God for this end, as the ordinary means whereby such as are strangers and enemies to God may be reconciled, 2 Cor. 5:20, and brought to Christ, 2 Cor. 11:2-4.

2. Of those who affirm that sincere conversion of men is a certain argument that those by whose preaching the Word they are converted are sent of God, according to that Rom. 10:14-15; Jer. 23:32. But we judge that the sending which the apostle speaks of, Rom. 10:14-15, is a sending to an office in a due order, whether extraordinary or ordinary, ecclesiastically performed; and that it consists not only in conferring gifts, whereby a man is made fit for the ministery, or prophecy, but in conferring authority and conveying ministerial authority; as the Protestants prove by manifest arguments against the Socinians. And although private Christians in the duty of charity, and by reason of gifts wherein they are subservient to God, do convert some from their sins; yet it follows not that they are thus sent, as that they have authority as the ambassadours of Christ in his Name to preach the Word of God authoritatively; because they want [lack] the authoritative mission by the Church of Christ, whereby that ministry in the Church is conferred wherein men as the ambassadors of Christ preach the Word of reconciliation, 1 Tim. 4:14; Tit. 1:5, 9-10; 2 Cor. 5:20. Hence also our Belgic Reformed Churches acknowledge that preaching of the Word by ministers ecclesiastically called, is the ordinary means of men’s repentance and first reconciliation to God: as appears by the ecclesiastical Form of establishing pastors in the ministry of the Church through the whole Netherlands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God</cite>, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 67-70</span></figcaption>

1. Who affirm that the conversion of wicked men is not an effect intended that it should be produced by virtue of the ecclesiastical ministry as a means appointed to that end; and therefore that never any are converted by the pastors of the Church by virtue of any ecclesiastical office but by accident, as they are gifted Christians: affirming that ordinarily the conversion of such as go astray is by such Christians endued with gifts of prophesy. But it is certain from the holy Scripture that the ecclesiastical ministry is appointed by God for this end, as the ordinary means whereby such as are strangers and enemies to God may be reconciled, 2 Cor. 5:20, and brought to Christ, 2 Cor. 11:2-4.

2. Of those who affirm that sincere conversion of men is a certain argument that those by whose preaching the Word they are converted are sent of God, according to that Rom. 10:14-15; Jer. 23:32. But we judge that the sending which the apostle speaks of, Rom. 10:14-15, is a sending to an office in a due order, whether extraordinary or ordinary, ecclesiastically performed; and that it consists not only in conferring gifts, whereby a man is made fit for the ministery, or prophecy, but in conferring authority and conveying ministerial authority; as the Protestants prove by manifest arguments against the Socinians. And although private Christians in the duty of charity, and by reason of gifts wherein they are subservient to God, do convert some from their sins; yet it follows not that they are thus sent, as that they have authority as the ambassadours of Christ in his Name to preach the Word of God authoritatively; because they want [lack] the authoritative mission by the Church of Christ, whereby that ministry in the Church is conferred wherein men as the ambassadors of Christ preach the Word of reconciliation, 1 Tim. 4:14; Tit. 1:5, 9-10; 2 Cor. 5:20. Hence also our Belgic Reformed Churches acknowledge that preaching of the Word by ministers ecclesiastically called, is the ordinary means of men’s repentance and first reconciliation to God: as appears by the ecclesiastical Form of establishing pastors in the ministry of the Church through the whole Netherlands.”

— Wilhelm Apollonius, A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 67-70">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+grant+in+this+Question%3A+1.+That+private+Christians+from+the+common+duty+of+charity%2C+making+use+of+those+spiritual+gifts+which+they+have+received+from+God+for+men%E2%80%99s+edification%2C+do+sometimes+convert+to+the+faith+those+souls+which+went+astray%3B+and+bring+those+who+live+in+the+world%2C+out+of+the+Church%2C+unto+the+body+of+the+Church+of+Christ.+See+Jn.+4%3A29%2C+etc.+1+Cor.+7%3A16.+2.+We+do+not+think+that+the+office+of+him+who+preaches+the+Word%2C+as+sent+of+God+and+the+Church%2C+do+confer+any+efficacy+to+the+Word+preached+by+him%3B+or+has+any+influence+upon+the+soul+of+him+that+is+converted.+For+the+power+of+God+only%2C+and+the+Spirit+which+accompanies+the+Word+preached%2C+does+give+to+the+Word+preached+a+virtue+and+saving+efficacy+for+the+conversion+and+salvation+of+souls%2C+1+Cor.+12%3A11+and+15%3A10.+But+we+affirm+that+the+Word+preached+by+him+who+is+ordained+to+an+ecclesiastical+office%2C+and+does+by+his+ecclesiastical+office+authoritatively+preach+the+Word%2C+is+the+ordinary+means+to+which+God+does+by+the+efficacy+of+his+Spirit+give+assistance+for+the+conversion+of+those+who+live+in+sin+out+of+Church-communion.+So+that+pastors%2C+as+pastors%2C+by+virtue+of+their+pastoral+office+are+the+ordinary+means+of+the+conversion+of+those+men+who+live+in+the+world.+This+assertion+is+proved%3A+1.+Because+faith+is+given+and+first+attained+by+the+Word+preached%2C+by+those+who+by+an+ecclesiastical+call+are+sent+of+God%2C+to+the+pastoral+Office%2C+and+by+virtue+of+mission+and+function+preach+the+Word%2C+whereby+faith+is+wrought+in+man.+See+Rom.+10%3A14-15%3B+1+Cor.+3%3A19%3B+Gal.+3%3A2.+2.+Because+pastors+of+Churches+by+reason+of+the+office+they+bear%2C+are+fathers%2C+who+do+first+beget+their+children+to+Christ+in+the+Church%3B+and+by+the+spiritual+seed+of+God%2C+do+give+spirit+and+life+to+those+that+are+dead+in+sins%3A+See+1+Cor.+4%3A15%3B+Gal.+4%3A19%3B+2+Cor.+2%3A16.+3.+Pastors+are+enjoined%2C+as+an+office+peculiarly+belonging+to+them%2C+to+preach+the+Word+of+God+with+all+meekness%2C+mildness%2C+and+patience%2C+if+perhaps+God+will+give+repentance+to+those+who+are+held+captives+in+the+snares+of+the+Devil%2C+2+Tim.+2%3A24-26%2C+to+open+the+eyes+of+those+who+sit+in+darkness%2C+and+to+bring+them+to+the+light+of+the+Gospel+and+of+grace%2C+Acts+26%3A18%2C+to+seek+lost+sheep+for+the+Lord%2C+Eze.+34%3A4-5%2C+and+to+bring+into+captivity+to+the+obedience+of+Christ+those+who+with+high+minds+exalt+themselves+against+the+Word+of+God%2C+2+Cor.+10%3A4-5.+We+reject+therefore+the+opposite+positions+of+those%3A+1.+Who+affirm+that+the+conversion+of+wicked+men+is+not+an+effect+intended+that+it+should+be+produced+by+virtue+of+the+ecclesiastical+ministry+as+a+means+appointed+to+that+end%3B+and+therefore+that+never+any+are+converted+by+the+pastors+of+the+Church+by+virtue+of+any+ecclesiastical+office+but+by+accident%2C+as+they+are+gifted+Christians%3A+affirming+that+ordinarily+the+conversion+of+such+as+go+astray+is+by+such+Christians+endued+with+gifts+of+prophesy.+But+it+is+certain+from+the+holy+Scripture+that+the+ecclesiastical+ministry+is+appointed+by+God+for+this+end%2C+as+the+ordinary+means+whereby+such+as+are+strangers+and+enemies+to+God+may+be+reconciled%2C+2+Cor.+5%3A20%2C+and+brought+to+Christ%2C+2+Cor.+11%3A2-4.+2.+Of+those+who+affirm+that+sincere+conversion+of+men+is+a+certain+argument+that+those+by+whose+preaching+the+Word+they+are+converted+are+sent+of+God%2C+according+to+that+Rom.+10%3A14-15%3B+Jer.+23%3A32.+But+we+judge+that+the+sending+which+the+apostle+speaks+of%2C+Rom.+10%3A14-15%2C+is+a+sending+to+an+office+in+a+due+order%2C+whether+extraordinary+or+ordinary%2C+ecclesiastically+performed%3B+and+that+it+consists+not+only+in+conferring+gifts%2C+whereby+a+man+is+made+fit+for+the+ministery%2C+or+prophecy%2C+but+in+conferring+authority+and+conveying+ministerial+authority%3B+as+the+Protestants+prove+by+manifest+arguments+against+the+Socinians.+And+although+private+Christians+in+the+duty+of+charity%2C+and+by+reason+of+gifts+wherein+they+are+subservient+to+God%2C+do+convert+some+from+their+sins%3B+yet+it+follows+not+that+they+are+thus+sent%2C+as+that+they+have+authority+as+the+ambassadours+of+Christ+in+his+Name+to+preach+the+Word+of+God+authoritatively%3B+because+they+want+%5Black%5D+the+authoritative+mission+by+the+Church+of+Christ%2C+whereby+that+ministry+in+the+Church+is+conferred+wherein+men+as+the+ambassadors+of+Christ+preach+the+Word+of+reconciliation%2C+1+Tim.+4%3A14%3B+Tit.+1%3A5%2C+9-10%3B+2+Cor.+5%3A20.+Hence+also+our+Belgic+Reformed+Churches+acknowledge+that+preaching+of+the+Word+by+ministers+ecclesiastically+called%2C+is+the+ordinary+means+of+men%E2%80%99s+repentance+and+first+reconciliation+to+God%3A+as+appears+by+the+ecclesiastical+Form+of+establishing+pastors+in+the+ministry+of+the+Church+through+the+whole+Netherlands.%E2%80%9D%0A%0A%E2%80%94+Wilhelm+Apollonius%2C+A+Consideration+of+Certain+Controversies+at+this+Time+Agitated+in+the+Kingdom+of+England+concerning+the+Government+of+the+Church+of+God%2C+%28London%3A+G.M.%2C+1645%29%2C+ch.+5%2C+%E2%80%98Of+the+Ecclesiastical+Ministry%2C+and+the+Exercise+thereof%E2%80%99%2C+pp.+67-70&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F546a5fc60b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/546a5fc60b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/pastors#:~:text=We%20grant%20in%20this%20Question%3A%201,the%20Church%20through%20the%20whole%20Netherlands&amp;text=We%20grant%20in%20this%20Question%3A%201.%20That%20private&amp;text=ministry%20of%20the%20Church%20through%20the%20whole%20Netherlands" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-a09c007962" data-kw="Augustine canonical scriptures">
<blockquote><p>Augustine, De Natura et Gratia, c. 91, writes thus: “I owe an absolute assent only to the canonical scriptures.” What value, may I ask, did this father set upon traditions, when he declared that he owed an absolute assent to nothing but the canonical scriptures?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 6, ch. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/the-fathers.html">The fathers</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/unwritten-traditions.html">Unwritten traditions</a></span></div>
<div class="actions"><button class="copy" data-copy="“Augustine, De Natura et Gratia, c. 91, writes thus: “I owe an absolute assent only to the canonical scriptures.” What value, may I ask, did this father set upon traditions, when he declared that he owed an absolute assent to nothing but the canonical scriptures?”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0a2dfef12d" data-kw="">
<blockquote><p>It has been assumed that Theology has to do with the facts or truths of the Bible; in other words, that the Scriptures of the Old and New Testaments are the only infallible rule of faith and practice. This, however, is not a conceded point. Some claim for Reason a paramount, or, at least a coördinate authority in matters of religion. Others assume an internal supernatural light to which they attribute paramount, or coördinate authority. Others rely on the authority of an infallible church. With Protestants, the Bible is the only infallible source of knowledge of divine things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. II</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/nature-of-theology.html">Nature of Theology</a> › <a href="../topics/theology/nature-of-theology/method-of-theology.html">Method of theology</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>

— Charles Hodge, Systematic Theology, vol. 1, Introduction, ch. II">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+has+been+assumed+that+Theology+has+to+do+with+the+facts+or+truths+of+the+Bible%3B+in+other+words%2C+that+the+Scriptures+of+the+Old+and+New+Testaments+are+the+only+infallible+rule+of+faith+and+practice.+This%2C+however%2C+is+not+a+conceded+point.+Some+claim+for+Reason+a+paramount%2C+or%2C+at+least+a+co%C3%B6rdinate+authority+in+matters+of+religion.+Others+assume+an+internal+supernatural+light+to+which+they+attribute+paramount%2C+or+co%C3%B6rdinate+authority.+Others+rely+on+the+authority+of+an+infallible+church.+With+Protestants%2C+the+Bible+is+the+only+infallible+source+of+knowledge+of+divine+things.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+vol.+1%2C+Introduction%2C+ch.+II&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0a2dfef12d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0a2dfef12d.html">Permalink</a><a class="src" href="https://ccel.org/ccel/hodge/theology1" rel="noopener" target="_blank">Read it online · CCEL, vol. 1</a></div>
</figure><figure class="quote" id="q-22b111434a" data-kw="">
<blockquote><p>The Holy Scripture is the only sufficient, certain and infallible rule of all saving knowledge, faith and obedience … The whole counsel of God concerning all things necessary for his own glory, man’s salvation, faith and life, is either expressly set down or necessarily contained in the Holy Scripture: unto which nothing at any time is to be added, whether by new revelation of the Spirit, or traditions of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 1.1, 1.6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/holy-scripture/inerrancy-and-infallibility.html">Inerrancy and Infallibility</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Holy Scripture is the only sufficient, certain and infallible rule of all saving knowledge, faith and obedience … The whole counsel of God concerning all things necessary for his own glory, man’s salvation, faith and life, is either expressly set down or necessarily contained in the Holy Scripture: unto which nothing at any time is to be added, whether by new revelation of the Spirit, or traditions of men.”

— Particular Baptists, Second London Baptist Confession of Faith, 1689, 1.1, 1.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Holy+Scripture+is+the+only+sufficient%2C+certain+and+infallible+rule+of+all+saving+knowledge%2C+faith+and+obedience+%E2%80%A6+The+whole+counsel+of+God+concerning+all+things+necessary+for+his+own+glory%2C+man%E2%80%99s+salvation%2C+faith+and+life%2C+is+either+expressly+set+down+or+necessarily+contained+in+the+Holy+Scripture%3A+unto+which+nothing+at+any+time+is+to+be+added%2C+whether+by+new+revelation+of+the+Spirit%2C+or+traditions+of+men.%E2%80%9D%0A%0A%E2%80%94+Particular+Baptists%2C+Second+London+Baptist+Confession+of+Faith%2C+1689%2C+1.1%2C+1.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F22b111434a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/22b111434a.html">Permalink</a><a class="src" href="https://founders.org/library/1689-confession/" rel="noopener" target="_blank">Read it online · Founders Ministries</a></div>
</figure><figure class="quote" id="q-3e453359e8" data-kw="">
<blockquote><p>Wherefore we suffer not ourselves, in controversies about religion, or matters of faith, to be pressed with the bare testimonies of Fathers, or Decrees of Councils; much less with received customs, or with the multitude of men being of one judgment, or with prescription of long time. Therefore, in controversies of religion, or matters of faith, we cannot admit any other judge than God himself, pronouncing by the holy Scriptures, what is true, what is false, what is to be followed, or what to be avoided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/the-fathers.html">The fathers</a></span><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a> › <a href="../topics/the-church/creeds-confessions-and-councils/ecumenical-councils.html">Ecumenical councils</a></span></div>

— Heinrich Bullinger, The Second Helvetic Confession, 1566, ch. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWherefore+we+suffer+not+ourselves%2C+in+controversies+about+religion%2C+or+matters+of+faith%2C+to+be+pressed+with+the+bare+testimonies+of+Fathers%2C+or+Decrees+of+Councils%3B+much+less+with+received+customs%2C+or+with+the+multitude+of+men+being+of+one+judgment%2C+or+with+prescription+of+long+time.+Therefore%2C+in+controversies+of+religion%2C+or+matters+of+faith%2C+we+cannot+admit+any+other+judge+than+God+himself%2C+pronouncing+by+the+holy+Scriptures%2C+what+is+true%2C+what+is+false%2C+what+is+to+be+followed%2C+or+what+to+be+avoided.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+The+Second+Helvetic+Confession%2C+1566%2C+ch.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e453359e8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3e453359e8.html">Permalink</a><a class="src" href="https://www.ccel.org/creeds/helvetic.htm" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-6165730314" data-kw="">
<blockquote><p>Ever since the Scripture was written, the generality of the church was obliged to attend thereunto alone, as their only rule of faith and obedience. And although God reserved unto himself a liberty under the Old Testament, and until the completing of all the books of the New, to add new revelations as he pleased, yet he always bound up the faith and obedience of the present church unto what he had already revealed. And he hath now, by the Spirit of his Son, put an end unto all expectation of any new, of any other revelations, wherein the faith or obedience of the church should be concerned; at least, we take it for granted in this inquiry that infallible inspirations in the discovery of things not before revealed are ceased in the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 2</span></figcaption>

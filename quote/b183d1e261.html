</figure><figure class="quote" id="q-b0d6ffec2e" data-kw="Word Wisdom Spirit">
<blockquote><p>The Son is the Word and Wisdom of the Father, begotten from eternity and without beginning in time, and the Holy Spirit is the divine power proceeding from the Father and the Son. In this matter, we must tread cautiously and with suspended judgment. This doctrine must be approached soberly and reverently, as it surpasses human comprehension.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Trinity</cite>, Thesis VIII–IX</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Son is the Word and Wisdom of the Father, begotten from eternity and without beginning in time, and the Holy Spirit is the divine power proceeding from the Father and the Son. In this matter, we must tread cautiously and with suspended judgment. This doctrine must be approached soberly and reverently, as it surpasses human comprehension.”

</figure><figure class="quote" id="q-7b33af83f5" data-kw="Spirit deity Ananias">
<blockquote><p>The title of God and the attribute of eternal Spirit, given in sacred Scripture, prove that the Spirit in whose name we are baptized is not a quality, grace, or effect. When Peter reproached Ananias for lying to the Holy Spirit, he said that Ananias had lied not to men but to God (Acts 5:4). Paul infers that we are the temple of God because the Spirit dwells in us (1 Cor. 3:16 and 6:19). As Augustine eloquently teaches in Epistle 66, if we were commanded to build a temple for God out of wood and stone, because such worship is due to Him alone, it would clearly argue His divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XXV</span></figcaption>

</figure><figure class="quote" id="q-67d7d97470" data-kw="">
<blockquote><p>It is the special office of the Spirit to convince the world of sin; to reveal Christ, to regenerate the soul, to lead men to the exercise of faith and repentance; to dwell in those whom He thus renews, as a principle of a new and divine life. By this indwelling of the Spirit, believers are united to Christ, and to one another, so that they form one body. This is the foundation of the communion of saints, making them one in faith, one in love, one in their inward life, and one in their hopes and final destiny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, pt. 1, ch. 8, “The Holy Spirit”</span></figcaption>

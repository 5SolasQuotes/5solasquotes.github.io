<main class="wrap"><figure class="quote" id="q-69a6893b9f" data-kw="">
<blockquote><p>XXIII. The mode by which God acts in efficacious vocation having now been explained, it remains for us to see how man conducts himself toward it. Here, there can be a twofold notion of man, as he is considered either in the first act of conversion or in the second act. Considered in the former, he behaves purely passively toward the efficacy of his vocation, contributing nothing as such, only receiving what is impressed upon him from elsewhere. XXIV. In the second act, however, there is some operation of man, and here he also performs his parts, so that he himself acts, believes, and wills rightly; yet in such a way that he perfects all these things in the virtue of the Holy Spirit as the principal mover. He indeed moves himself, but as one who has been moved, and thus he receives all good inclinations from Him, by which he is active (Phil. 2:12-13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the Efficacious Vocation of the Sinner to Salvation</cite>, trans. AI (Leiden: Marcus, 1620), p. 5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6841728b32" data-kw="">
<blockquote><p>…the similarities and differences between the conclusions reached by Scotus and Aquinas. Though Scotus became the standard reference point for discussions of intuitive versus abstractive cognition, this does not mean his account of the beatific vision fundamentally differed from Thomas’s regarding the vision of the divine essence. Both affirmed that the intelligible species could not be creaturely or a created similitude to see the divine essence, both affirmed the necessity of the supernatural agent to elevate the created intellect, and both affirmed a sense in which the beatific vision is ‘natural’ in the creature. They disagreed on how to define such a natural desire (with Aquinas claiming it is elicited and Scotus it is innate), the status of obediential potency (Aquinas distinguishing it from natural potency and Scotus conflating the two), the necessity of the light of glory, and whether what is natural should be measured merely by passive potencies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-seals.html">Zachary Seals</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Beatific Vision in the Synopsis Purioris: Its Medieval Context’ in Reformed Theological Review</cite>, vol. 82, no. 1 (April 2023), pp. 3-12</span></figcaption>

ncies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-be619dae70" data-kw="">
<blockquote><p>§X. Impotence is wont to be distinguished into physical or natural, and moral: The former arises from a defect of the natural faculty required for doing something; e.g., in the deaf for hearing; in the blind for seeing; in a wall for speaking. The latter has its origin from a voluntary evil disposition of the soul and a perverse custom, such as is in a drunken man, a gambler, and a thief; of whom the first cannot abstain from drink, the second from gaming, the third from theft. If these things are applied to the present theological matter; the impotence which is congenital to man after the Fall, and is in him from his very birth, can be called natural, not because it is a destruction of the will and of the natural liberty of the will, but because, having arisen from the first sin of Adam, it has degenerated as it were into nature and is transmitted to posterity: as if leprosy, a stone, epilepsy, or another kind of disease is propagated from parents to children by the contagion of nature through natural generation.</p></blockquote>

</figure><figure class="quote" id="q-4e8cb2b806" data-kw="">
<blockquote><p>…we can distinguish between natural passive potency and supernatural or obediential passive potency. A natural passive potency points to an outcome that can be realized given only a thing’s natural capacities, and can be actualized by some agent that is itself a mixture of active and passive potency. A supernatural or obediential potency points to an outcome that cannot be realized given only a thing’s natural capacities, and requires as an agent a purely actual divine cause. In human beings, potencies for eating, sleeping, walking, talking, thinking, willing, writing poems or doing science, and even coming to know the truths of natural theology and natural law are for the Scholastic all natural potencies; whereas the capacity to attain the Beatific Vision is an obediential potency.</p></blockquote>

<blockquote><p>37. Everything caused either immediately or mediately by a free cause is contingent, and conversely every contingent being is caused immediately or mediately by a free cause. 38. Every cause that causes contingently is either itself a free will or depends for its existence or its causing on a free cause.</p></blockquote>

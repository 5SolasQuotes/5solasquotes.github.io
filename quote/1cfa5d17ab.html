<blockquote><p>He does not knock at the door of his friends merely, but at the door of his enemies. He knocks at the door of the vilest of sinners…

3. Behold the extent of his willingness to receive sinners. The sinner sometimes says, ‘I am willing to receive Christ, but He is not willing to receive me.’ But what says the text? ‘Behold I stand at the door and knock.’ Does not this imply his readiness and willingness to come in? Nor is this all—He calls, ‘Open unto Me—open unto Me.’ Nor is this all—He says, ‘if any man hear my voice and open the door, I will come in.’ He positively declares that He is willing. Nor is this all—you may say, I am such a great sinner—I have rejected him so long, that He will not receive me now. But what says the Savior? ‘If any man hear my voice’—vile as he may be, if he is on the side of hell—‘if any man hear my voice and open the door, I will come in to him, and sup with him, and he with Me.’ If you are not now a Christian, permit me to say that you have never heard his voice, nor opened the door, nor been willing to receive Him. You have never complied with the invitation in the text. The Savior is ready and willing, but you will not come to Him that you might have life. [Jn. 5:40]

4. Behold your danger. The Savior stands at your door. He does not sit. He stands ready to enter or ready to depart… He may say, as he once said to the Jews, ‘I go my way. Ye shall see me, and shall die in your sins.’ How often ‘I would,’ and ‘ye would not.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/asahel-nettleton.html">Asahel Nettleton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Remains of the Late Rev. Asahel Nettleton</cite>, ed. B. Tyler (Hartford: Robins &amp; Smith, 1845), Sermon 25, ‘Christ Standing at the Door’, pp. 300-302</span></figcaption>

</figure><figure class="quote" id="q-f0bd9502b8" data-kw="">
<blockquote><p>‘Behold, I stand at the door and knock, If any man will open…’ (Rev. 3:20). Alas, we cannot open the door, it is so locked and barred and bolted that it is impossible for us to open it. True, it is so, but yet there is a way to open, and that is to be opening when God would help us to open. When God offers to help you to open the door, then set upon opening the door, and whatever the bolts, bars and locks are, you shall be sure to have it open. Ah, but when does God offer to help us to open it? Then when His Spirit knocks, when in the motions of it He solicits us to open, then God offers His help to help us to open. Take that time and then set on the work and the door shall be opened. But if that time is neglected we may strive to open but cannot open, because then that power is gone that would have helped us to open. See Eccl. 9:12, ‘For man also knoweth not his time.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-dyke.html">Jeremiah Dyke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of Quenching &amp; Not Quenching of the Spirit’</cite>, (d. 1620; 1640; RBO, 2018), p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

<blockquote><p>2… Look yonder on the amiable Jesus Christ (for a marriage between whom and thy precious soul I am now wooing). Do but observe his condescending willingness to be united to thee: That great Ahasuerus courts his own captive Esther. The Potter makes suit to his own clay, woos thee, though He wants [needs] thee not; is infinitely happy without thee, yet is not, cannot be satisfied but with thee. Heark how He commands, entreats, begs thee to be reconciled, 2 Cor. 5:20; Swears and pawns his life upon it, that He desires not thy death, Eze. 33:11; seals his oath with his blood; and if after all this thou art fond of thine own damnation and hadst rather be at an agreement with Hell, than with Him; see how the brinish tears trickle down his cheeks, Lk. 19:41-42. He weeps for thee, that dost not, wilt not weep for thyself: Nay, after all this obdurate obstinacy, is resolved still to wait, that He may be gracious, Isa. 30:18. Stands yet and knocks, though his head be wet with rain, and his locks with the dew of the night; fain He would have thee open the door, that He may be come in and sup with thee, and thou with Him, Rev. 3:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-lye.html">Thomas Lye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Morning Exercise Methodized</cite>, (London: E.M., 1660), Sermon 18, p. 397</span></figcaption>

<blockquote><p>3. Behold I stand at the door of thy heart as one ready to help thy weakness. (2 Thess. 2; Ps. 106) And I knock at the portal of thy conscience as one that would gladly comfort thee, I send forth my heavenly Word to succour thee, lighten thee, raise thee up and save thee.

4. If any man with a glad heart will hear my voice, or the true preaching of my Word (Jn. 10; Mk. 16; Gal. [?]; Lk. [?]) and open the door of his faith, thankfully to receive it, I will come in unto him, enduing with all spiritual delights, as righteousness, peace, love and joy in the Holy Ghost.

5. Yea to him shall I make manifest as to my friend the hidden mysteries of the Scripture (Jn. 15; Lk. 14; Mt. 8; [?] Cor. 2) and secret counsels of my Father. And he shall finally sup with Me and I with him in the eternal habitacle of God, where no heart can esteem what He has prepared for them that love Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bale.html">John Bale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Image of both Churches after the most wonderful and heavenly Revelation of St. John</cite>, ... (d. 1563), ch. 3, p. 50 Bale was an Anglican reformer.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“3. Behold I stand at the door of thy heart as one ready to help thy weakness. (2 Thess. 2; Ps. 106) And I knock at the portal of thy conscience as one that would gladly comfort thee, I send forth my heavenly Word to succour thee, lighten thee, raise thee up and save thee.

4. If any man with a glad heart will hear my voice, or the true preaching of my Word (Jn. 10; Mk. 16; Gal. [?]; Lk. [?]) and open the door of his faith, thankfully to receive it, I will come in unto him, enduing with all spiritual delights, as righteousness, peace, love and joy in the Holy Ghost.

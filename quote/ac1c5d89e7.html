<blockquote><p>A bishop ordained of God, or set up by the law of God, does declare nothing else but their calling, which by an other more special name, are called pastors, whom (says Luke [in Acts 20]) the holy Ghost has appointed bishops to feed the Church of God. And either of these names of pastor or of bishop is proper to them in the New Testament, whereby the apostle does distinguish them from apostles, prophets, and evangelists, which were callings to endure for a time, Eph. 4:11, and from deacons, 1 Tim. 3 and Phil. 1:1, for otherwise they are everywhere called elders… But they are called bishops in regard of the sheep committed unto them, as though a man should call them watchmen of [or?] overseers. These now were one alone, as where any church had but one pastor, or more if the church had more than one. And the meeting of them together jointly with their elders, whom Paul calls ‘governors’ [1 Cor. 12], of the other common name called, was the eldership. Their duty was to attend on the word and prayer, both publicly and privately, and in common to governe the Church, as appears by many places of Scripture. … Of the Bishop that is of Man The bishop that is of man, that is to say, brought into the Church by the alone wisdom of man, besides the express Word of God, is a certain power given to one certain pastor above his other fellows, yet limited with certain orders or rules provided against tyranny. They which did bear this office of bishop, are called bishops in regard of their fellow elders and the whole clergy, as watchmen set over the clergy. That this calling was not brought in by the Word, it is manifest by that, that there is not to be found in the New Testament so much as one syllable, whereby there may be the least surmise of any such thing. For although we doubt not, but all things ought to be done orderly in the Lord’s house, and therefore that some one should be president in every assembly… … The Answer to the First Question Where as Satan’s bishop has been the overthrow of the Church and all Christian kingdoms, whose head is the Roman Antichrist, it is to be looked unto of all hands, especially of all godly princes, that they at once abolish it, if they mind the reformation of the Church and their own safety. As for the bishop ordained by man and brought into the Church by little and little, whereby Satan made him a way for greater things, it had been tolerable… experience of so many ages does teach us too well, that unless this root also be plucked up, it will come to pass that the same fruit will sprout and bud forth again. Finally, seeing the Lord has so often decided this controversy of superiority among his own disciples, that He shut it clean out, seeing the rule both for doctrine and good order of the Church is to be sought for out of the very writings of the apostles: and it is manifested, the churches then prospered, when all this authority of one man over the rest, yet was not, but as that grew up, so all things fell to decay. Finally, seeing where the remnants of this government by a few are not clean taken away, the work of the Lord, is openly hindered: Our judgement is that after the chasing away of this device of man, the churches shall be well provided for, if they may be repaired according to the writings of the apostles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Judgment of a Most Reverend &amp; Learned Man from Beyond the Seas Concerning a Threefold Order of Bishops [of God, of Man, of the Devil], with a Declaration of Certain Other Weighty Points Concerning the Discipline &amp; Government of the Church ([London, 1585]) 43</cite>, pp. ToC</span></figcaption>

<blockquote><p>I remember one of our brethren of Scotland, in a discourse tending to the advancing of the presbyterian way, tells us that Dr. Montague, the late worthy bishop of Winchester, asked King James of blessed memory (whose sweet affability the world well knew) how it came about that there were so few heresies and errors of doctrine broached and prosecuted to the public disturbance of the Church of Scotland? Unto which the wise and learned king is said to have returned this answer: ‘That every parish has their pastor ever present with them and watching over them; that the pastor has his elders and deacons sorted with him; that he with them once a week meets at a set time and place for the censure of manners or whatever disorder falls out in the parish; so as he by this means perfectly knows his flock and every aberration of them, either in matter of opinion or practice: And lest any error or heresy may seize upon the pastor; they have their presbyteries, consisting of several shrivalties, which meet together in the chief town or city next to them, every week also once; and have there their exercise of prophesying; after which the moderator of the said meeting asks and gathers the judgements of all the said pastors concerning the doctrine then delivered, or, of any other doubtful point that is then and there propounded; And if the said presbyters be divided in their opinions, then the question is, under an enjoined silence, put over to the next synod, which is held twice a year; unto that all the pastors of that quarter or province duly resort; accompanied with their elders; the moderator of the former synod begins the action; then a new moderator is chosen for the present, or (as it seldom falls out) the last moderator, by voices, continued. Any question of doubt being proposed is either decided by that meeting or (if it cannot be so done) is, with charge of silence, reserved till the national synod or general assembly; which they hold every year once; whither come not the pastors only, but the king himself or his commissioners and some of all orders and degrees sufficiently authorized for the determining of any controversy that shall arise amongst them.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/king-james-i.html">King James I</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as narrated by Joseph Hall, ‘A Modest Offer of some meet Considerations tendered to the Learned Prolocutor and to the rest of the Assembly of Divines met at Westminster’ (Oxford, 1644)</cite>, pp. 8-10</span></figcaption>

<div class="actions"><button class="copy" data-copy="“I remember one of our brethren of Scotland, in a discourse tending to the advancing of the presbyterian way, tells us that Dr. Montague, the late worthy bishop of Winchester, asked King James of blessed memory (whose sweet affability the world well knew) how it came about that there were so few heresies and errors of doctrine broached and prosecuted to the public disturbance of the Church of Scotland? Unto which the wise and learned king is said to have returned this answer: ‘That every parish has their pastor ever present with them and watching over them; that the pastor has his elders and deacons sorted with him; that he with them once a week meets at a set time and place for the censure of manners or whatever disorder falls out in the parish; so as he by this means perfectly knows his flock and every aberration of them, either in matter of opinion or practice: And lest any error or heresy may seize upon the pastor; they have their presbyteries, consisting of several shrivalties, which meet together in the chief town or city next to them, every week also once; and have there their exercise of prophesying; after which the moderator of the said meeting asks and gathers the judgements of all the said pastors concerning the doctrine then delivered, or, of any other doubtful point that is then and there propounded; And if the said presbyters be divided in their opinions, then the question is, under an enjoined silence, put over to the next synod, which is held twice a year; unto that all the pastors of that quarter or province duly resort; accompanied with their elders; the moderator of the former synod begins the action; then a new moderator is chosen for the present, or (as it seldom falls out) the last moderator, by voices, continued. Any question of doubt being proposed is either decided by that meeting or (if it cannot be so done) is, with charge of silence, reserved till the national synod or general assembly; which they hold every year once; whither come not the pastors only, but the king himself or his commissioners and some of all orders and degrees sufficiently authorized for the determining of any controversy that shall arise amongst them.&#x27;”

— King James I, as narrated by Joseph Hall, ‘A Modest Offer of some meet Considerations tendered to the Learned Prolocutor and to the rest of the Assembly of Divines met at Westminster’ (Oxford, 1644), pp. 8-10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+remember+one+of+our+brethren+of+Scotland%2C+in+a+discourse+tending+to+the+advancing+of+the+presbyterian+way%2C+tells+us+that+Dr.+Montague%2C+the+late+worthy+bishop+of+Winchester%2C+asked+King+James+of+blessed+memory+%28whose+sweet+affability+the+world+well+knew%29+how+it+came+about+that+there+were+so+few+heresies+and+errors+of+doctrine+broached+and+prosecuted+to+the+public+disturbance+of+the+Church+of+Scotland%3F+Unto+which+the+wise+and+learned+king+is+said+to+have+returned+this+answer%3A+%E2%80%98That+every+parish+has+their+pastor+ever+present+with+them+and+watching+over+them%3B+that+the+pastor+has+his+elders+and+deacons+sorted+with+him%3B+that+he+with+them+once+a+week+meets+at+a+set+time+and+place+for+the+censure+of+manners+or+whatever+disorder+falls+out+in+the+parish%3B+so+as+he+by+this+means+perfectly+knows+his+flock+and+every+aberration+of+them%2C+either+in+matter+of+opinion+or+practice%3A+And+lest+any+error+or+heresy+may+seize+upon+the+pastor%3B+they+have+their+presbyteries%2C+consisting+of+several+shrivalties%2C+which+meet+together+in+the+chief+town+or+city+next+to+them%2C+every+week+also+once%3B+and+have+there+their+exercise+of+prophesying%3B+after+which+the+moderator+of+the+said+meeting+asks+and+gathers+the+judgements+of+all+the+said+pastors+concerning+the+doctrine+then+delivered%2C+or%2C+of+any+other+doubtful+point+that+is+then+and+there+propounded%3B+And+if+the+said+presbyters+be+divided+in+their+opinions%2C+then+the+question+is%2C+under+an+enjoined+silence%2C+put+over+to+the+next+synod%2C+which+is+held+twice+a+year%3B+unto+that+all+the+pastors+of+that+quarter+or+province+duly+resort%3B+accompanied+with+their+elders%3B+the+moderator+of+the+former+synod+begins+the+action% <blockquote><p>But we have yet more to do, for the consequence of our argument is also denied both by the prelatical faction and by others [congregationalists] (whom we are more sorry to contradict) holding that reasons fetched from the Jewish Church do better fat the prelates than the consistorians; howsoever now to fetch the form of government for the Church from the Church of the Jews, were, say they, to revive the Old Testament. To me it seems strange that both the one side and the other do when they please reason from the forms of the Jewish Church and yet they will not permit us to reason in like manner. The former go about to prove the prelacy by the high priesthood and the lawful use of organs in the Church from the like in the temple of Solomon. The latter do argue that a congregation has right not only to elect ministers, but to ordain them and lay hands on them because the people of Israel laid hands on the Levites. That the maintenance of the ministers of the Gospel ought to be voluntary, because under the Law God would not have the priests and Levites to have any part or inheritance in the land of Canaan, but to be sustained by the offerings and altars of the Lord. That the power of excommunication is in the body of the Church, because the Lord laid upon all Israel the duty of removing the unclean and of putting away leaven out of their houses at the feast of Passover. Is it right dealing now to forbid us to reason from the form of the Jews? I will not use any further expostulation, but let the reader judge. The truth is this, even as that which is in a child, as he is a child, agrees not to a man, yet that which is in a child, as he is animal rationale, agrees also to a man: so what we find in the Jewish Church, as it was Jewish or in infancy and under the pedagogy of the Law, agrees not indeed to the Christian Church. But whatsoever the Jewish Church had as it was a political Church, or ecclesiastical republic (of which sort of things, the diversity and subordination of ecclesiastical courts was one) does belong by the same reason to the Christian Church. I say further, though the commonwealth and civil policy of the Jews be not in all points a pattern to our civil policy, yet I am sure it is no error to imitate the civil policy of the Jews in such things as they had, not for any special reason proper to them, but are common to all well constituted commonwealths, and so we may argue from their commonwealth that it is a good policy to have diverse civil courts and the higher to receive appellations from the inferior, as it was among them. Shall we not by the very like reason fetch from their ecclesiastical republic, diversity of spiritual courts, and the supreme to receive appellations from the inferior, because so was the constitution of the Jewish Church and that under the common respect and account of a political Church, and not for any special reason which does not concern us.</p></blockquote>

<blockquote><p>Passion, provoked by some men’s badness, has too much conquered love to conformists in some men’s minds so that they scruple not too uncharitable opinions and words of them. This is contrary to Christian love. I doubt not but there were hundredsº of godly conformable ministers in England on Aug. 24 1662. Seven thousand or more did conform that had been kept in in the [puritan] Parliament’s time [1640’s to 1650’s]; were all those seven thousand tolerable the year before and ungodly the next year? Many conformists now in London were taken for very good men in 1659. At once the other extreme [of people] most study to get them out [of the establishment]; and shall we also call all men on pain of hazarding their souls to forsake them? º [Note that he does not say thousands.] A very great Churchman above 40 years ago was heard say to his brethren: ‘The non-conformable puritans are snakes. We have the law against them and can tread them down when we will: But it is the conformable puritan that is the devil of England, to be cast out.’ And shall we second this, and that as in opposition to it? Grace is lost as far as Christian, impartial love is lost. And they that lose religion themselves, which lies in love, are likely to be no good keepers of it in the Church. If a good man that we value become a danger to the truth, we are angry if his error be but contradicted, lest his name be blemished: But some dare say the conformists are all false, ready to betray the Church to Papists, who now do far more to keep them out than we do. This is against Lam. 3:17 [“Thou hast removed my soul far off from peace.”]. If there be any such conformists high or low, I am none of their advocate;ª God will find them out and judge them. But I am confident that it is also conformists (by the advantage of their possession) that will do more to stop their [Papists] desired success than nonconformists can do. ª [Regarding full lay-conformity to Anglicanism after 1662, as required by law, Baxter lists 12 things he refused as sinful and/or irrational: The English Nonconformity (1689), ch. 4, pp. 22-23. Regarding ministerial conformity, he lists 40 things just before it in the same chapter: pp. 17-22.] I am sure Bishop [John] Jewel, [James] Ussher, [Thomas] Morton, [Joseph] Hall, [George] Downame, [John] Davenant, etc. were far from Popery. And what man living has written stronglier against it than Dr. Isaac Barrow (against whose book a doctor has newly dashed his reputation, as a bubble against a rock: And what the Bishop of Lincoln, the Bishop of Hereford, Dr. Peter Moulin, Dr. Stillingfleet, and many more have done, is known. Your [non-conformist puritan] Mr. Matthew Mead once commended a conformist for a benefice to me with these words, ‘I take him to be the holiest man I know;’ I have loved him the better ever since for his candor, charity and impartiality.</p></blockquote>

-conformity-to-what-is-not-right/#:~:text=Passion%2C%20provoked%20by%20some%20men%E2%80%99s%20badness,for%20his%20candor%2C%20charity%20and%20impartiality&amp;text=Passion%2C%20provoked%20by%20some%20men%E2%80%99s%20badness%2C%20has%20too&amp;text=ever%20since%20for%20his%20candor%2C%20charity%20and%20impartiality" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8b4283b22d" data-kw="">
<blockquote><p>If the Church prescribe anything lawfully, so that she prescribe no more than she has power given her to prescribe, her ordinance must be accompanied with some good reason and warrant given for the satisfaction of tender consciences… It becomes not the spouse of Christ, endued with the spirit of meekness, to command anything imperiously, and without a reason given… Tertullian’s testimony is known (in Apologet.): Nulla lex, etc. ‘No law (says he) owes to itself alone the conscience of its equity, but to those from whom it expects obedience. Moreover, it is a suspected law which will not have itself to be proved, but a wicked law, which not being proved, yet bears rule.’… Neither can the Church prescribe anything lawfully which she shows not to have been convenient, even before her determination. … If the ceremonies be lawful to us because the law and ordinance of the Church prescribes them, then either the bare and naked prescription of the Church, having no other warrant than the Church’s own authority, make them to be thus lawful; or else the law of the Church, as grounded upon and warranted by the law of God and nature… If they take them (as needs they must) to the latter part, then let them either say that the ceremonies are lawful unto us, because the Church judges them to be agreeable to the law of God and nature, or because the Church proves unto us, by evident reasons, that they are indeed agreeable unto these laws. If they yield us the latter, then it is not the Church’s law, but the Church’s reasons given for her law, which can warrant the lawfulness of them unto us; which does elude and elide all that which they allege for the lawfulness of them from the power and authority of the Church. And further, if any such reasons be to be give forth for the ceremonies, why are they so long kept up from us?… It will be answered (I know), that if they Church command anything repugnant to God’s Word we are not bound to do it, nor to receive it as lawful, though the Church judge so of it; but otherwise, if that which the Church judges to be agreeable to the law of God and nature (and in that respect prescribes) be not repugnant to the Word of God, but in itself indifferent, then are we to embrace it as convenient, and consonant to the law of God and nature, neither ought we to call in question the lawfulness of it. But I reply, that [in this case] either we must judge a thing to be repugnant or not repugnant to the Word, to be indifferent or not indifferent in itself, [merely] because the Church judges so of it [which is insufficient to conscience], or else because the Church proves unto us by an evident reason that it is so… the argument is still set afoot [incomplete]; then we must receive everything (be it ever so bad) as indifferent, if only the Church happen so to judge of it; for quod competit alicui qua tale, etc. So that if we receive anything as indifferent, for this respect, because the Church judges it to be so, then shall we receive everything for indifferent which the Church shall so judge of [which is absurd].</p></blockquote>

<blockquote><p>In natural things, it is to be noted that the whole fulness of perfection due to a thing, is not from the mere substantial form that gives it its species since a thing derives much from supervening accidents, as man does from shape, color and the like; and if any one of these accidents be out of due proportion, evil is the result. So it is with action. For the plenitude of its goodness does not consist wholly in its species, but also in certain additions which accrue to it by reason of certain accidents: and such are its due circumstances. Wherefore if something be wanting that is requisite as a due circumstance the action will be evil. … Circumstances are outside an action inasmuch as they are not part of its essence; but they are in an action as accidents thereof… Every accident is not accidentally in its subject, for some are proper accidents; and of these every art takes notice. And thus it is that the circumstances of actions are considered in the doctrine of morals… Since good and being are convertible, according as being is predicated of substance and of accident, so is good predicated of a thing both in respect of its essential being, and in respect of its accidental being; and this, both in natural things and in moral actions.</p></blockquote>

ml">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-circumstances/#:~:text=In%20natural%20things%2C%20it%20is%20to,natural%20things%20and%20in%20moral%20actions&amp;text=In%20natural%20things%2C%20it%20is%20to%20be%20noted&amp;text=both%20in%20natural%20things%20and%20in%20moral%20actions" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>‘Yea, but’ (say they) ‘our ceremonies are typical and Jewish ceremonies, which hurt our worship.’ They mean (as I conceive) they are teaching ceremonies, not ceremonies of mere order, but significant, to put us in mind of duty. I am sorry that this should be accounted a fault. If they did not signify, how could they edify? (1 Cor. 14:26) Were they types and shadows of the mysteries of the Gospel invented by men, indeed Christ were ill-advised not to ordain them. But being only moral documents and monitors of some duties, I wonder where their guilt lies. If I had an hundred boxes in my house for my uses, and some few of them had a mark upon them to direct me where my money lay, that I might be careful of that, does this savor of want of natural wisdom? So neither does it taste of want of spiritual wisdom to set a mark upon some few ceremonies, to put me in mind of my duty to Christ. ‘What are these’ (say they) ‘but images set up to ourselves for religious use?’ What? to worship? to adore God in or by? No, but to remind us of what we ought to do. And this was the practice of the Church in all ages: Abraham put his servant’s hand under his thigh in swearing, surely to signify his subjection to him in that business about the promised seed (Gen. 24:2). Moses set up an altar when Amalek was overthrown and called it Jehovah-Nissi, to signify that the Lord was their banner (Ex. 17:15). The two tribes and a half built an altar, not to distinguish their borders, but to signify that they were God’s people and that they had all one God, to whom they and their posterity must sacrifice upon his own altar (Josh. 22:24–35). Samuel set up a stone when the Philistines were discomfited and called it Eben-Ezer, to signify that the Lord helped them (1 Sam. 7:12). When Christ the truth was come, he used human significant ceremonies, as the feast of dedication (John 10:22), sitting at the Passover—a sign of rest (Matt. 26:20)—the water pots of the Jewish purifications (John 2:6), the custom of embalming (John 19:39–40), besides other formalities of the synagogue. (Lk. 4:17-20) The Corinthians had the women’s veil in the congregation, to signify subjection (1 Cor. 11:5–6), and the kiss of peace to signify love (Rom. 16:20; 2 Pet. 2:11). Other Christians had agapae [love-feasts] at the sacrament (Jude), in the room whereof the Christians’ offertory was brought in for pious uses, to signify that love they should have one to another. So we have standing at the Belief [Apostles’ Creed], to signify that it is not a prayer and that we are ready to confess our faith; kneeling at the commandments, to signify the honor we have to that God that gave it, and that we must be ready to dart up prayer for our obedience; and kneeling at the sacrament, to signify an humble acknowledgment of God’s love for so great a benefit. And do we and all these saints before us set up images to ourselves in these ceremonies for religious use? God forbid. The practice of these saints, when the laws of God were purely taught and kept, teaches us that though we may not set up an image to worship God by or in, yet may we set up some edifying signs to put us in mind of those duties we owe to God (1 Cor. 14): The patriarchs may build altars, give their children proper names to be admonishing signs of their duties to God; and we may set all our senses on work that way. We may set up a post in a dark and dangerous passage, that when I go that way and touch it, it may signify my danger, and I may avoid it. I may set a watchman in a tower to give a sound when the enemy comes, that he may signify my enemy’s approach, and I may avoid him. I may set up a sea mark to signify a rock near, that I split not upon it. And may not we be as wise for our souls as for our bodies? God forbid. I am sure He has nowhere forbidden it. Therefore it is not against Christ. If it be not against Him, it is for Him, says our Savior (Mk. 9:40).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b6c88927fa" data-kw="">
<blockquote><p>Let us care for nothing but to get Christ, and let Christ be the end of our faith and works, and then let Christ alone for bringing us to life, heaven, and happiness. Let us by faith make way for Christ to come into our hearts to be our Prophet, Priest, King, and Shepherd, that we may receive Him offering Himself, and then He will make way for us to God, heaven and eternal happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/job-throckmorton.html">Job Throckmorton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Faith, pp. 63-64 as given in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 396 Throckmorton (1545-1601) was an English puritan.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-611e1783bf" data-kw="">
<blockquote><p>6. The effects of this first [divine] work are these: (1) A hearty welcoming of Christ Jesus into the soul; they do not take up with comfort on this side [of] Christ; Men’s troubles are known by their satisfaction… But if we see the necessity of a Savior, receive Him into our hearts and believe in Him with all our hearts, desire and delight and all is carried after Christ, and after the refreshings of his grace and are satisfied with none but Christ, and our hearts pant for Him, as the hart pants after the water brooks, you ought to bless God that He has left the impression of the effect, though He has not left the impression of the way; Ps. 42:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>One Hundred &amp; Ninety Sermons on the Hundred &amp; Nineteenth Psalm… (d. 1677; London: T.P., 1681), sermon 98</cite>, p. 605</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-e976162133" data-kw="">
<blockquote><p>If the door of thine heart be opened by this key, to give admission to the King of Glory, God’s hand must turn the key. The Lord opened the heart of Lydia, that she attended to the words of Paul, Acts 16. Paul might have preached his heart out before Lydia’s heart would have opened to let the Word in, if God had not undertaken the work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling… (London: T.P., 1662), ch. 15, ‘How a Christian may exercise himself to godliness in hearing and reading the Word, and of preparation for hearing’</cite>, p. 217</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“If the door of thine heart be opened by this key, to give admission to the King of Glory, God’s hand must turn the key. The Lord opened the heart of Lydia, that she attended to the words of Paul, Acts 16. Paul might have preached his heart out before Lydia’s heart would have opened to let the Word in, if God had not undertaken the work.”

</figure><figure class="quote" id="q-d18b7522d8" data-kw="">
<blockquote><p>Sixthly, by his not only offering acquaintance with us upon these terms, by his ambassadors, his ministers, but by his coming personally by his Spirit to our several hearts, inviting and soliciting us to this acquaintance. According to that of our Lord Jesus Christ, ‘Behold I stand at the door and knock; if any man hear my voice, and open to Me, I will come in to him, and will sup with him, and he with Me.’ The Greeks and Romans of old were wont always to have their feasts at supper; therefore when it is said here, ‘I will come in to him, and sup with him,’ it is as if He had said, ‘I will come in to him and feast with him.’ And feasting together was of old a symbol of perfect reconciliation, and intimate friendship and acquaintance. Now, behold here the wonderful goodness and condescension of God, and his gracious disposition and inclination towards peace and acquaintance with his poor creatures… Behold therefore, I say, and admire the gracious disposition of God towards sinful man, and the great desire He has towards peace and renewed acquaintance with Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-newcomen.html">Matthew Newcomen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Best Acquaintance &amp; Highest Honor of Christians, or a Discourse of Acquaintance with God (London: Parker, 1679), ch. 4</cite>, pp. 48-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

ner" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fe626717c5" data-kw="">
<blockquote><p>It’s true which our Saviour told Nicodemus, Jn. 3:17, that God sent not his Son into the world to condemn the world, but that the world through Him might be saved. Christ does not knock at any man’s heart with that intent that He may have the more advantage against Him, if he let Him not in; no He comes with purpose and desire to bring in salvation with Him…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pinke.html">William Pinke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Trial of a Christian’s Sincere Love Unto Christ (d. 1629; Oxford: Lichfield, 1636), p. 23 Pinke (1599?–1629) was an English puritan in the established Church.</cite></span></figcaption>

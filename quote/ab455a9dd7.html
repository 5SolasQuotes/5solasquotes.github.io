<blockquote><p>4. The fourth sort of erroneous persons which I judge holy Churches and saints ought to separate from, are such as err in fundamentals or foundation points of religion, holding opinions that lay the ax to the root of the Tree of Life. Now as these sorts of errors are most dangerous to be permitted, so they are most difficult to single out; for though it be a thing out of doubt that there are foundation doctrines which the Church of God ought to prefer in order to its being before its peace and unity, yet it remains very doubtful whether several of those precious and substantial truths that are highly to be prized and much contended for, and are by several godly and sound Christians esteemed foundation points, be so or no: that is, so to be esteemed foundations as the persons not believing them or holding error contrary to them (and are otherwise in the main gracious), be thereby made incommunicable: But as in the former cases, so in this, I shall decline coming to particulars as a work above my capacity and shall only tender my thoughts in some few general rules; and so leave it to them who are more able to add. 1. First, I judge that errors against the foundation points of religion must be of such a nature and tendency as do strike at the very root of saving-grace and tend to unstate the the person holding them from a possibility of salvation, he living and dying therein; for so Paul argues, 1 Cor. 15:14, concerning the resurrection of the dead: ‘If Christ be not risen then is our preaching vain, and our faith is also vain.’ And also verses 17-18, ‘And if Christ be not raised, your Faith is vain, ye are yet in your sins. Then they also that are fallen asleep in Christ, are perished.’ 2. I judge they must be errors contrary to the general tendency and scope of Scripture and to the doctrines of salvation plainly and evidently therein expressed which all true believers concur and agree in: And therefore says the apostle: ‘If our Gospel be hid, it is hid to them that are lost,’ 2 Cor. 3:3; and so chapter 11:3, ‘But I fear lest by any means, as the serpent beguiled Eve through his subtilty, so your minds should be corrupted from the simplicity that is in Christ. For if he that comes preaches another Jesus, whom we have not preached, or if ye receive another spirit which ye have not received, or another Gospel which ye have not excepted, etc. ye might well bear with him.’ And so Gal. 1:6-8, ‘I marvel that ye are so soon removed from him that has called you into the grace of Christ, unto another Gospel: Which is not another; but there be some which trouble you, and would pervert the Gospel of Christ. But though we, or an angel from Heaven preach another Gospel unto you, then that which we have preached, let him be accursed.’ Now it is evident that that bringing in another Gospel was a joining circumcision and the works of the Law with faith in Christ in justification, contrary to the very essence of Gospel faith, as they held it. Objection: Why, how did they hold it? Did not you before number this among one of the errors Paul permitted in the Church of Rome, etc. and pressed the Church to union, without separating from it? Answer: They held it rigidly, imposing it upon others as of necessity to salvation, ch. 2:14 and 6:12. For where the same error was held more moderately, as we observe before in the Church of Rome and Corinth, etc. the apostle deals milder with it; there he says, ‘Circumcision is nothing, nor uncircumcision is nothing,’ 1 Cor. 7:19. ‘Is any man called being circumcised; let him not be uncircumcised,’ verse 8. But when they come to hold it imposingly and positively, as in this verse, he then changes his voice: then ‘O foolish Galatians, who has bewitched you, that ye should not obey the truth?’ etc. ch. 3:1-4, then, ‘Behold, I Paul say unto you, that if ye be circumcised, Christ shall profit you nothing; For I testify again to every man that is circumcised, Christ is become of none effect unto you,’ ch. 5:2-4. So that the manner of holding an error alters the case of its fundamentalness much: It was Peter’s separating from the saints differing minded, and dissimulation, rather than his error, ch. 2:11-14, that made Paul withstand him to the face, verse 11… That if those errors and heresies the Scripture mentions as dangerous and unsufferable in the Church of God, which the Churches and saints of God are onely exhorted to reject and withdraw from, was all either of a scandalous profane nature, denying the power of godliness, on the one hand, or contrary to a godly life, inconsistent with true grace, or striking at the foundation of saving faith on the other hand: Then the Churches and saints of God, who desire not to be wise above what is written at this day, ought only to reject and withdraw from such…</p></blockquote>

<blockquote><p>He did not desire to nourish fights of one faction againt another; he knew that the truth is difficult to come by through polemics; and it was in the truth that he wanted consensus. If the fundamentals of the Christian faith could be agreed upon, then the controversies that were plaguing the Church could be accommodated ‘without ill will [Greek] [fairly, reasonably, equitably] and for the general restoration in every way of concord in the Church.</p></blockquote>

<blockquote><p>And concerning the bounds and limits of this forbearance, all will undeniably acknowledge that it ought not to be extended indifferently unto all persons, opinions and practises, but that these four propositions are agreeable to the truth of Christianity: … Secondly, that it is not the mind of Christ that any of his servants should profess themselves willing or obliged to bear with any person which does endeavour, and with any doctrine or practice which does tend to overthrow the faith in his name, which is delivered to the saints (Jude 3), or to destroy the life and power of godliness either in the private or publick profession of religion (Tit. 1:10-11; 2 Tim. 3:5-8; Gal. 5:7-13), or to dissolve the bonds of holy communion amongst Christian brethren (Phil. 3:2; Jud. 19; Rom. 16:17-18), or to abolish the orderly relations and obligations natural and moral, without which human societies cannot stand (1 Tim. 5:8; Mt. 15:4-6; 1 Tim. 4:3), or to put down the authority which God has set up in and over human societies for the administration of justice therein (2 Pet. 2:10; Rom. 13:1-8). … Fourthly, that in matters of greater weight, which are not merely circumstantial, but are conceived to be determined by the Word, yet so, as that it is differently understood: in this case the mind of Christ is that the rules of Christian charity and mutual edification, be inviolably observed with all long suffering and forbearance. And this course ought to be continued so long, either as there is hope to gain the advantage of loving conferences, whereby differences may be reconciled, and mistakes and scandals prevented and taken out of the way; or so long as there is cause to think that God may reveal his profitable truths to such as err not wilfully, but through weakeness of judgment and harmlessly, Phil. 3:15-16 and 2 Tim. 2:22-26.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And concerning the bounds and limits of this forbearance, all will undeniably acknowledge that it ought not to be extended indifferently unto all persons, opinions and practises, but that these four propositions are agreeable to the truth of Christianity: … Secondly, that it is not the mind of Christ that any of his servants should profess themselves willing or obliged to bear with any person which does endeavour, and with any doctrine or practice which does tend to overthrow the faith in his name, which is delivered to the saints (Jude 3), or to destroy the life and power of godliness either in the private or publick profession of religion (Tit. 1:10-11; 2 Tim. 3:5-8; Gal. 5:7-13), or to dissolve the bonds of holy communion amongst Christian brethren (Phil. 3:2; Jud. 19; Rom. 16:17-18), or to abolish the orderly relations and obligations natural and moral, without which human societies cannot stand (1 Tim. 5:8; Mt. 15:4-6; 1 Tim. 4:3), or to put down the authority which God has set up in and over human societies for the administration of justice therein (2 Pet. 2:10; Rom. 13:1-8). … Fourthly, that in matters of greater weight, which are not merely circumstantial, but are conceived to be determined by the Word, yet so, as that it is differently understood: in this case the mind of Christ is that the rules of Christian charity and mutual edification, be inviolably observed with all long suffering and forbearance. And this course ought to be continued so long, either as there is hope to gain the advantage of loving conferences, whereby differences may be reconciled, and mistakes and scandals prevented and taken out of the way; or so long as there is cause to think that God may reveal his profitable truths to such as err not wilfully, but through weakeness of judgment and harmlessly, Phil. 3:15-16 and 2 Tim. 2:22-26.”

— Joseph Caryl, The Moderator: endeavoring a Full Composure &amp; Quiet Settlement of those many differences both in doctrine &amp; discipline which have so long disturbed the peace &amp; welfare of this Commonwealth… (London: Bellamy, 1652), ch. 8, pp. 57-58 Caryl was a congregationalist.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+concerning+the+bounds+and+limits+of+this+forbearance%2C+all+will+undeniably+acknowledge+that+it+ought+not+to+be+extended+indifferently+unto+all+persons%2C+opinions+and+practises%2C+but+that+these+four+propositions+are+agreeable+to+the+truth+of+Christianity%3A+%E2%80%A6+Secondly%2C+that+it+is+not+the+mind+of+Christ+that+any+of+his+servants+should+profess+themselves+willing+or+obliged+to+bear+with+any+person+which+does+endeavour%2C+and+with+any+doctrine+or+practice+which+does+tend+to+overthrow+the+faith+in+his+name%2C+which+is+delivered+to+the+saints+%28Jude+3%29%2C+or+to+destroy+the+life+and+power+of+godliness+either+in+the+private+or+publick+profession+of+religion+%28Tit.+1%3A10-11%3B+2+Tim.+3%3A5-8%3B+Gal.+5%3A7-13%29%2C+or+to+dissolve+the+bonds+of+holy+communion+amongst+Christian+brethren+%28Phil.+3%3A2%3B+Jud.+19%3B+Rom.+16%3A17-18%29%2C+or+to+abolish+the+orderly+relations+and+obligations+natural+and+moral%2C+without+which+human+societies+cannot+stand+%281+Tim.+5%3A8%3B+Mt.+15%3A4-6%3B+1+Tim.+4%3A3%29%2C+or+to+put+down+the+authority+which+God+has+set+up+in+and+over+human+societies+for+the+administration+of+justice+therein+%282+Pet.+2%3A10%3B+Rom.+13%3A1-8%29.+%E2%80%A6+Fourthly%2C+that+in+matters+of+greater+weight%2C+which+are+not+merely+circumstantial%2C+but+are+conceived+to+be+determined+by+the+Word%2C+yet+so%2C+as+that+it+is+differently+understood%3A+in+this+case+the+mind+of+Christ+is+that+the+rules+of+Christian+charity+and+mutual+edification%2C+be+inviolably+observed+with+all+long+suffering+and+forbearance.+And+this+course+ought+to+be+continued+so+long%2C+either+as+there+is+hope+to+gain+the+advantage+of+loving+conferences%2C+whereby+differences+may+be+reconciled%2C+and+mistakes+and+scandals+prevented+and+taken+out+of+the+way%3B+or+so+long+as+there+is+cause+to+think+that+God+may+reveal+his+profitable+truths+to+such+as+err+not+wilfully%2C+but+through+weakeness+of+judgment+and+harmlessly%2C+Phil.+3%3A15-16+and+2+Tim.+2%3A22-26.%E2%80%9D%0A%0A%E2%80%94+Joseph+Caryl%2C+The+Moderator%3A+endeavoring+a+Full+Composure+%26+Quiet+Settlement+of+those+many+differences+both+in+doctrine+%26+discipline+which+have+so+long+disturbed+the+peace+%26+welfare+of+this+Commonwealth%E2%80%A6+%28London%3A+Bellamy%2C+1652%29%2C+ch.+8%2C+pp.+57-58+Caryl+was+a+congregationalist.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc657d1c5d6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c657d1c5d6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=And%20concerning%20the%20bounds%20and%20limits,Phil.%203%3A15%2D16%20and%202%20Tim.%202%3A22%2D26&amp;text=And%20concerning%20the%20bounds%20and%20limits%20of%20this&amp;text=and%20harmlessly%2C%20Phil.%203%3A15%2D16%20and%202%20Tim.%202%3A22%2D26" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And 1st, albeit there be errors, and errors of a heinous nature among some in a Church, this is not sufficient ground of separation from that Church, nay, not though these errors should remain uncensured. For, as was noticed above, there were some in the Church of Corinth who had drunk in this gross error, “That there is no resurrection of the body;” hence the apostle asks, “How say some among you, there is no resurrection of the dead?” (1 Cor. 15:12) The interrogation plainly intimates there were some among them who denied that great and fundamental doctrine of the Christian religion; and yet this Church of Corinth was a true Church of Christ, from which it was not lawful to separate. So, in the Church of Pergamos, there were some uncensured who held the doctrine of Balaam, and the doctrine of the Nicolaitans; and yet she was a true Church of Christ, right and approven in the main. So, in the Church of Thyatira, “that wicked woman” Jezebel was tolerated without being censured, though she taught the Lord’s servants to commit heinous iniquity. So, though there should be sundry persons leavened with gross errors in the Church of Scotland at this day, this is no sufficient ground for a secession or separation from her. I own it is a sin, and I think a very heinous sin in any Church, to wink at errors, or not to censure for, and be zealous against them, especially if of a heinous nature, as are some of these wherewith some among us have been charged… … And as [John] Owen justly (Exposition, p. 174) observes, “There may be a fundamental error in a true Church for a season, where the Church errs not fundamentally,” citing for proof of this, 1 Cor. 15; 2 Tim. 2:18.</p></blockquote>

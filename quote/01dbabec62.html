<main class="wrap"><figure class="quote" id="q-01dbabec62" data-kw="">
<blockquote><p>The state and condition of the church with respect unto them has utterly ceased; and nothing can be more vain than to pretend any succession unto them, in the whole or any part of their office, unless men can justify their claim unto it by any or all of those things which concurred unto it in the apostles, which they cannot do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Inquiry into the Original, Nature, Institution, Power, Order, and Communion of Evangelical Churches</cite>, ch. 3 (Works 15)</span></figcaption>

</figure><figure class="quote" id="q-c70c9db27d" data-kw="">
<blockquote><p>Whereas they say that there is a double head of the church, one imperial, which is Christ alone, the other ministerial, which is the pope governing the whole church under Christ; I answer, this distinction robs Christ of His honor because in setting up their ministerial head, they are fain to borrow of Christ things proper unto Him, as the privilege to forgive sins properly and the power to govern the whole earth by making of laws that shall as truly bind conscience as the laws of God, etc.</p></blockquote>

</figure><figure class="quote" id="q-44327ec6c7" data-kw="">
<blockquote><p>Has it never occurred to you that the pope, cardinals, bishops, monks, and that the whole synagogue of Satan are trouble-makers? The truth is, they are worse than false apostles. The files [sic] apostles taught that in addition to faith in Christ the works of the Law of God were necessary unto salvation. But the papists omit faith altogether and teach self-devised traditions and works that are not commanded of God, indeed are contrary to the Word of God, and for these traditions they demand preferred attention and obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, p. 22</span></figcaption>

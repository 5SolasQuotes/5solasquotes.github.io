<main class="wrap"><figure class="quote" id="q-f06f0da33b" data-kw="hebrew greek">
<blockquote><p>The following arguments prove that the sources have not been corrupted. (1) The providence of God which could not permit books which it willed to be written by inspiration (theopneustois) for the salvation of men (and to continue unto the end of the world that they might draw from them waters of salvation) to become so corrupted as to render them unfit for this purpose. And since new revelations are not to be expected (after God has recorded in the Scriptures his entire will concerning the doctrine of salvation), what can be more derogatory to God (who has promised his constant presence with the church) than to assert that he has permitted the books containing this doctrine to become so corrupt that they cannot serve as a canon of faith? (2) The fidelity of the Christian church and unceasing labor in preserving the manuscripts; for since Christians have always labored with great zeal to keep this sacred deposit uncorrupted, it is not credible that they would either corrupt it themselves or suffer it to be corrupted by others. (3) The religion of the Jews who have bestowed upon the sa</p></blockquote>

</figure><figure class="quote" id="q-8ac7680810" data-kw="vowels">
<blockquote><p>Again, the authority of an authentic writing is twofold: the one is founded upon the things themselves of which it treats and has relation to the men to whom the writing is directed; the other is occupied with the treatise itself and the writing and refers to the copies and translations made from it. Over all these this law obtains—that they ought to be referred to the authentic writing and if they vary from it, to be corrected and emended. The former authority may be either greater or lesser according to the authority of him from whom the writing comes and in proportion to the power which he has over the persons to whom he directs his writing. But in the sacred Scriptures this authority is the very highest, such as can be in no other writing, since we are bound straightway to believe God for that supreme power which he has over men as over all other things, and for that highest truth and wisdom distinguishing him, and to obey in all things which his most sacred word (contained in the authentic Scripture) enjoins for belief or practice. But the latter consists in this, that the autog</p></blockquote>

</figure><figure class="quote" id="q-8eb2adb7dd" data-kw="vulgate">
<blockquote><p>Although we respect the Vulgate as an ancient version, we deny its authenticity. (1) It was elaborated by human skill and has no God-inspired (theopnueston) author which the authentic edition demands. For whether its author was Jerome (as the papists hold) or some other one before his time (who combined the Italian version and the Vulgate so-called) or Sixtus V and Clement VIII (who in many particulars corrected the old one which was used in the church) no one of them was inspired (theopneustos).</p></blockquote>

</figure><figure class="quote" id="q-1494d5bc06" data-kw="">
<blockquote><p>Let the weathercocks spin round as much as they please, but we must have fixed points of faith. Unless we have infallibility somewhere, faith is impossible. The true faith teaches us facts which cannot be questioned. Where is faith to build if there be no rock, and nothing left us but shifting sand? As for us, we find infallibility in the Scriptures of the Old and New Testament, and our one desire is to have them opened up to our minds by the Holy Spirit.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9bcdb50bbb" data-kw="">
<blockquote><p>by way of precept there is an absolute necessity of uniting laid upon the Church, so that it falls not under debate whether a Church should continue divided or united in these [in thesis]… seeing that union is both commanded as a duty and commanded as eminently tending to the edification of the Church, and therefore is so frequently joined with edification? Nor is it to be asked by a Church what is to be done for the Church’s good in a divided way, thereby supposing a dispensation, as it were, to be given to division and a forbearing of the use of means for the attaining thereof; or rather supposing a stating or fixing of division, and yet notwithstanding thereof, thinking to carry on edification?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, ... (Edinburgh: Higgins, 1659), pt. 4, ch. 7, pp. 315-16</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dda96007fb" data-kw="">
<blockquote><p>Local separation without mental can make no culpable schism; for Nil nisi Voluntarium est morale [‘nothing without the will is moral’]; if a man be imprisoned or be sick and cannot come to the church, it is innocent separation; I have been at no church this half year, much against my will; O that God would heal me of this separation!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684) | pt. 1, ch. 4, p. 33</span></figcaption>

</figure><figure class="quote" id="q-83bee89ed8" data-kw="">
<blockquote><p>And when the diet of the General Assembly came, having first done what they could for incapacitating all Brethren of differing judgment from these Resolutions, to sit in the Assembly, by citing them to the Assembly as guilty persons… did also make acts appointing and ordaining censures against all persons in this Church, whether Ministers or professors [professing Christians], that did not acknowledge the authority, and submit to the acts and constitutions of that Assembly concerning those Resolutions, and barring all such expectants [those training for the ministry] from entrance to the Ministry as should not acknowledge that authority, and submit to those constitutions; And in their Assembly of the next year at Edinburgh, do provide and ordain presbyteries to take special care, that upon the calling of any expectant to a particular charge of the ministry, before they admit him to his trials, they require him under his hand to pass from the Protestations and Declinators against this and the preceding General Assembly, if he has been accessory to the same; and to promise and give assurance that he shall abstain from holding up debates and controversies about matters of differences in this Kirk since the Assembly, 1650, in preaching, writing, or otherwise; upon the performance whereof, the presbytery shall proceed to his trials; If not, in that case the presbytery shall forbear to proceed, until the next General Assembly; leaving liberty to the presbytery or congregation for planting of the place otherwise: …By these proceedings and practices, the most unjust and irregular that we have known in this Church since we did begin to look at reformation in the year 1638, and which were indeed the great cause of the distempers and distractions that have since followed, malignant and disaffected men in congregations and presbyteries have got up the head, and having the advantage of the acts already mentioned, they do make a bar thereof to shut the door against the calling of able and godly men to the work of the Ministry, who cannot bring their consciences in bondage to these things;… …though yet the protesting Brethren have been tender even of these things [of order in due process], and have made conscience as to do nothing evil and sinful in itself, so to do nothing from contempt or disrespect to the least point of order; yea, they have been careful to keep within the bounds, warranted and allowed unto them of God; And, if it be fit to compare, we may truly say, that for all the noise our Brethren make against them, for the violation of order, and taking irregular courses, they have been more careful than themselves have been, and that they have more just and weighty grievance against them, even upon this accompt [account], than they have against the protesting Brethren:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them</cite>, … (1658), pp. 20-23</span></figcaption>

</figure><figure class="quote" id="q-68b231c68e" data-kw="">
<blockquote><p>You must do it in a peaceable way, so as to manifest that you desire peace, and not to be the least disturbance to the peace of the Church, but that the peace of it is dear and precious to you; therefore, when ye have witnessed the truth, and discharged your conscience in it, you must then be content to sit down quiet: For so the rule is, ‘That the spirits of the prophets must be subject to the prophets,’ in that case. But if it should prove that the Church should continue, if the evil be notorious and great as requires departing, and the Church, after all means used, and all patience, should continue in it; in such a case you may desire to be dismissed from it and depart, but in as peaceable a way as possibly can be; yet continuing in due respect unto the Church for all that, though you should depart, only leaving your witness behind you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-bcc51754c5" data-kw="">
<blockquote><p>It is evident that there may be union and communion with a Church where there are several corruptions neither confessed nor reformed. As for example, there may be difference of judgment about many things, and doctrinal determinations of disputable points exacted by synods, contrary to our sentiments; and yet there may be forbearance with protestations, if we be not constrained to subscribe or homologate the same. In worship there may be many defects and disorders. In discipline and government there may be many dissatisfactions with Church officers, unjust censures, unfit ordinations, erroneous decisions, wrong constitutions of judicatories, dissatisfactions with persons that have the main stroke in the administrations, occasioning jealousies and fears of misgovernment for the time to come, and the like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is evident that there may be union and communion with a Church where there are several corruptions neither confessed nor reformed. As for example, there may be difference of judgment about many things, and doctrinal determinations of disputable points exacted by synods, contrary to our sentiments; and yet there may be forbearance with protestations, if we be not constrained to subscribe or homologate the same. In worship there may be many defects and disorders. In discipline and government there may be many dissatisfactions with Church officers, unjust censures, unfit ordinations, erroneous decisions, wrong constitutions of judicatories, dissatisfactions with persons that have the main stroke in the administrations, occasioning jealousies and fears of misgovernment for the time to come, and the like.”

<main class="wrap"><figure class="quote" id="q-6a1e669d94" data-kw="">
<blockquote><p>It is false also that all the Churches abroad have human ceremonies so twisted with their solemn worship that presbyterians cannot join with them. We have often (and do when occasion serves) very cordially and to our edification joined with them, and yet partake in none of these: nor is [there] so much of these [human ceremonies] among them as he would make us believe.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9bc7b9831b" data-kw="">
<blockquote><p>Should there be a gathering destitute of bread and wine, as perchance among the Indians, who for bread use the baked marrow of a certain tree, or a fixed root, or rice, or such other things, the gathering may–if, I say, there is no bread of corn–safely use what it is accustomed to use in place of bread. It is not so much the outward form and kind of corn that ought to be regarded, as the nourishment and what chiefly nourishes. The same must be said if wine is lacking. Something else might be applied, in place of wine, as scarcely any nation is discoverable, which has not some beverage which it uses to restore the spirits in place of wine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-braun.html">Johannes Braun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Doctrine of the Covenants, or a System of Didactic &amp; Elenchtic Theology</cite>, (Amsterdam, 1688), p. 593 as trans. in Heinrich Heppe, Reformed Dogmatics ed. Ernst Bizer tr. G.T. Thomson (Wipf &amp; Stock, 2007), p. 631</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-bf71ee8906" data-kw="">
<blockquote><p>3. That the ordinance of superiors cannot make the ceremonies [which were claimed to be indifferent, to be] necessary, I have proven in the first part of this Dispute. This is given for one of the chief marks of the man of sin [in 1 Tim. 4:1-5], ‘That which is indifferent, he by his laws and prohibitions maketh to be sin;’ (Morney, Mister. of Iniq., in the Conclusion) and shall they who profess to take part with Christ against Antichrist [such as the prelates] do no less than this? It will be replyed that the ceremonies are not thought necessary in themselves, nor non-conformity unlawful in itself, but only in respect of the Church’s ordinance. Just so the Papists profess that the omission of their rites and observances is not a sin in itself, but only in respect of contemning the Church’s customs and commandments. How comes it then that they [the prelates] are not ashamed to pretend such a necessity for the stumbling blocks of those offending ceremonies among us, as Papists pretend for the like among them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, pp. 46-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

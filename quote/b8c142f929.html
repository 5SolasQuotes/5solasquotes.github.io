<main class="wrap"><figure class="quote" id="q-b8c142f929" data-kw="">
<blockquote><p>And shall endeavor to bring the churches of God in the three kingdoms to the nearest conjunction and uniformity in religion, confession of faith,” etc. The solemn League and Covenant was sworn in the year 1643, the Confession of Faith was sent hither and approven by the Assembly not till the year 1647, for which see the Act of assembly, printed before the Confession. And can we think, that those who, in pursuance of the [Solemn League and] covenant, framed this Confession of Faith, to declare to the world the faith of covenanters, would so juggle, as to put in articles of faith which would bind others, but not themselves?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Evil, Nature &amp; Danger of Schism: a Sermon’</cite>, (1708): | As to the [Westminster] Confession of Faith, | I know they will say, that article is meant of lands not covenanted: there had been some shadow of force in this perhaps, if this Confession of Faith had been framed before the covenant [of 1581]: but upon the contrary it was long after [in 1646], and was the product of the solemn League and Covenant [1643], as appears from the first article of the [Solemn League and] Covenant, in these words</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-73e5398435" data-kw="">
<blockquote><p>VIII Rule. We must give place to the sway of the times wherein we live, so far forth as may stand with keeping faith and a good conscience. We may not be temporizers and change our religion with the times: but yet we may and must give place to times as we give place to the stream, so that it be done with keeping of true religion and good conscience. This rule was practiced by Paul… he was three years in Ephesus, an idolatrous place, where the great goddess Diana was worshipped; yet in all that time he contained himself and spake nothing in particular against Diana, but ony in general against false gods, saying that ‘they be no gods that are made with hands,’ v. 26. Nay, Alexander could not charge him with this, that he had in all that while blasphemed their goddess Diana. Paul therefore was feign to yield to the sway of those times that so he might do some good in Ephesus by his ministry. Whereas, if he had spoken against Diana directly, it had not been possible for him to have done that good by preaching which otherwise he did.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience</cite>, (Cambridge. 1606), bk. 3, ch. 2, pp. 481-84</span></figcaption>

<blockquote><p>Assertion 1 — There is an oath betwixt the king and his people, laying on by reciprocation of bands mutual civil obligation upon the king to the people and the people to the king; 2 Sam. 5:3, “So all the elders of Israel came to the king to Hebron, and king David made a covenant with them in Hebron before the Lord, and they anointed David king over Israel.” 1 Chron. 11:3, “And David made a covenant with them before the Lord, and they anointed David king over Israel, according to the word of the Lord by Samuel.” 2 Chron. 23:2-3, ” And they went about in Judah, and gathered the Levites out of all the cities of Judah, and the chief of the fathers of Israel, and they came to Jerusalem. And all the congregation made a covenant with the king [Joash] in the house of God.” 2 Kings 11:17, “Jehoiada made a covenant between the Lord and the king and the people, that they should be the Lord’s people; between the king also and the people.” Eccl. 8:2, “I counsel thee to keep the king’s commandment, and that in regard of the oath of God.</p></blockquote>

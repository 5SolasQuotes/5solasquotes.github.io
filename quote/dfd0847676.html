<main class="wrap"><figure class="quote" id="q-dfd0847676" data-kw="">
<blockquote><p>There are many today who are tired of singing the Bible Psalms in the worship of God. This has various reasons, no doubt. Some are tired of singing the Psalms because they are not willing to bear the cross of being different from the big, popular churches. The other churches sing popular hymns, and the Psalms seem to be not only different but peculiar and old-fashioned. Some object to the Psalms because they do not like theology of the Psalms, with its emphasis on the righteousness and justice of God, and His destruction of His enemies. Some object to the Psalms because they do not like the Jewish flavor and coloring of the Psalms—the names of people and places, the references to the history of the children of Israel, the Hebrew flavor of the language. …Those who object to the Psalms do not want to dwell in the tents of Shem.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Singing The Whole Of the Psalter, Wholeheartedly. Ashamed of the Tents of Shem?; The Semitic Roots of Christian Worship.”</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8850c67c9d" data-kw="">
<blockquote><p>As Calvin and the church in Geneva sang the Apostle’s Creed and yet did not sing man-made hymns (multitudes of which were current in that era, being widely sung by the Lutherans), it is evident that they considered the Creed to be a different element of worship than singing praise to God. Calvin was very familiar, as his writings show, with creeds and the nature of them. Calvin in Geneva evidently thought that it was permissible to sing one’s confession of their faith before God in public worship and yet not to sing man-made praise to God (the two being different). This distinction is confirmed to have been well understood in that general era in that the Synod of Dort (1618), while approving of singing the Creed for the Dutch Church (whose worship practice was very similar to that of Geneva’s), yet condemned singing man-made hymns:</p></blockquote>

</figure><figure class="quote" id="q-bb319eb0b3" data-kw="">
<blockquote><p>But he is not satisfied that in the Christian Assemblies, in the apostles’ times there were no manner of forms. Who says there were not? There was a form of sound doctrine (which the apostle tells us of), there were Psalms, Hymns, and spiritual Songs in forms, they are the three titles of David’s Psalms; we have nothing to do with any thing but forms of prayer, made by some particular ministers, or Church officers, to be used by all other ministers.</p></blockquote>

<blockquote><p>47. Yet because the lifting up of the heart to God is together required, Simul &amp; consequenter, and going along with the thing that is sung, and it is also the end of that meditation; therefore we are said to sing in our heart to the Lord, Col. 3:16, and psalms that are sung have the consideration of prayers. 48. But because this religious melody hath the respect of prayers, therefore it is not so fit that the Decalogue, and other such like, which do not partake the nature of prayer, be turned into meter and be sung instead of psalms. … 53. But in the melody of singing, because it tendeth to our mutual edification, attention, and stirring up of pious affections among us one toward another, Col. 3:16, therefore all do join their voices together, 1. Chron. 16:35; Mk. 14:26.</p></blockquote>

<blockquote><p>As for public prayers, there are two kinds of them—the one is expressed in words only, the other with song; and this is no recent invention, for from the first origin of the church, this has been the case, as appears in history. And even St. Paul does not speak of verbal prayer alone, but also of singing. And in truth, we know by experience that song has great force and power in moving and inflaming the heart of man to invoke and praise God with more vehement and ardent zeal. It should always be seen to that the song should not be light and frivolous, but that it have weight and majesty, as saith St. Augustine; and also that there is a great difference between the music that is employed for the enjoyment of men at table, and in their houses, and the psalms which they sing in church in the presence of God and his angels. But when the form here given is rightly judged of, we hope that it will be found holy and pure; seeing that it is simply constructed for the edification of which we have spoken, as well as that the use of singing may be greatly extended. So that even in the houses and in the fields, it may be to us an incitement and an instrument or means to praise God and raise our hearts to him; and to console us in meditating on his power, goodness, wisdom, and justice, which is more necessary for us than we know how to express. For the first, it is not without cause that the Holy Spirit exhorts us so carefully, by the Holy Scripture, to rejoice ourselves in God, and that all our joy should rest there as its true end. For he knows how truly we are inclined to please ourselves in vanity. Thus while our nature draws and leads us to seek all means of foolish and vicious enjoyment—on the contrary, our Lord, to separate and draw us from the allurements of the flesh and of the world, presents to us every possible means to fill us with that spiritual joy which he commends so much to us. But amongst other things which are suitable for the recreation of men, and for yielding them pleasure, music is either the first, or one of the chief, and we must esteem it a gift of God bestowed for that end. Therefore, by so much the more, we ought to see that it is not abused, for fear of soiling and contaminating it; turning that to our condemnation which was given for our profit and good. Even were there no other consideration than this alone, it ought to move us to regulate the use of music, so as to make it subservient to all good morals, and that it should not give occasion for loosing the bridle of dissoluteness, that it should not lead to voluptuousness, nor be the instrument of immodesty and impurity. But further, there is scarcely anything in this world which can more powerfully turn or bend hither and thither the manners of men, as Plato has wisely remarked. And in fact we experimentally feel that it has a secret and incredible power over our hearts to move them one way or other. Therefore we ought to be so much the more careful to regulate it in such a manner, that it may be useful to us, and in no ways pernicious. For this reason, the ancient doctors of the church often complained that the people of their time were addicted to disgraceful and immodest songs, which, not without cause, they esteemed and called a deadly and Satanic poison for corrupting the world. But in speaking of music, I include two parts, to wit, the words, or subject and matter; secondly, the song or melody. It is true that all evil words, as saith St. Paul, corrupt good manners, but when melody is united to them, they much more powerfully pierce the heart, and enter in: just as when by a funnel wine is poured into a vessel, so poison and corruption is infused into the depth of the heart by the melody. What then is to be done? It is to have songs not only pure, but also holy, that they may be incitements to stir us up to pray to and praise God, and to meditate on his works, in order to love him, fear him, honour and glorify him. But what St. Augustine says is true, that none can sing things worthy of God but he who has received power from himself. Wherefore when we have sought all round, searching here and there, we shall find no songs better and more suitable for this end than the Psalms of David which the Holy Spirit dictated and gave to him. And therefore when we sing them, we are as certain that God has put words into our mouths as if he himself sang within us to exalt his glory. Wherefore Chrysostom exhorts all men and women and little children to accustom themselves to sing them as a means of associating themselves with the company of angels; further, we must remember what St. Paul says, that spiritual songs cannot be sung well but with the heart; but the heart requires the understanding: and in that saith St. Augustine lies the difference between the song of man and that of birds, for a linnet, a nightingale, and a jay, may sing well, but it will be without understanding. But the peculiar gift of man is to sing knowing what he says. Further, the understanding ought to accompany the heart and affections, which cannot be unless we have the song imprinted in our memory, that we may be ever singing it. This present book [the Genevan Psalter, 1543], for this cause, besides what otherwise has been said, ought to be particularly acceptable to every one who desires, without reproach, and according to God, to rejoice in seeing his own salvation, and the good of his neighbours; and thus has no need to be much recommended by me, as it carries in itself its own value and praise. Only let the world be well advised, that instead of songs partly vain and frivolous, partly foolish and dull, partly filthy and vile, and consequently wicked and hurtful, which it has heretofore used, it should accustom itself hereafter to sing these heavenly and divine songs, with good king David. Touching the music, it appeared that it should be simple in the way we have put it, to carry weight and majesty suitable to the subject, and even fit to be sung in church as has been said.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Preface to the 1543 Genevan Psalter</span></figcaption>

are suitable for the recreation of men, and for yielding them pleasure, music is either the first, or one of the chief, and we must esteem it a gift of God bestowed for that end. Therefore, by so much the more, we ought to see that it is not abused, for fear of soiling and contaminating it; turning that to our condemnation which was given for our profit and good. Even were there no other consideration than this alone, it ought to move us to regulate the use of music, so as to make it subservient to all good morals, and that it should not give occasion for loosing the bridle of dissoluteness, that it should not lead to voluptuousness, nor be the instrument of immodesty and impurity. But further, there is scarcely anything in this world which can more powerfully turn or bend hither and thither the manners of men, as Plato has wisely remarked. And in fact we experimentally feel that it has a secret and incredible power over our hearts to move them one way or other. Therefore we ought to be so much the more careful to regulate it in such a manner, that it may be useful to us, and in no ways pernicious. For this reason, the ancient doctors of the church often complained that the people of their time were addicted to disgraceful and immodest songs, which, not without cause, they esteemed and called a deadly and Satanic poison for corrupting the world. But in speaking of music, I include two parts, to wit, the words, or subject and matter; secondly, the song or melody. It is true that all evil words, as saith St. Paul, corrupt good manners, but when melody is united to them, they much more powerfully pierce the heart, and enter in: just as when by a funnel wine is poured into a vessel, so poison and corruption is infused into the depth of the heart by the melody. What then is to be done? It is to have songs not only pure, but also holy, that they may be incitements to stir us up to pray to and praise God, and to meditate on his works, in order to love him, fear him, honour and glorify him. But what St. Augustine says is true, that none can sing things worthy of God but he who has received power from himself. Wherefore when we have sought all round, searching here and there, we shall find no songs better and more suitable for this end than the Psalms of David which the Holy Spirit dictated and gave to him. And therefore when we sing them, we are as certain that God has put words into our mouths as if he himself sang within us to exalt his glory. Wherefore Chrysostom exhorts all men and women and little children to accustom themselves to sing them as a means of associating themselves with the company of angels; further, we must remember what St. Paul says, that spiritual songs cannot be sung well but with the heart; but the heart requires the understanding: and in that saith St. Augustine lies the difference between the song of man and that of birds, for a linnet, a nightingale, and a jay, may sing well, but it will be without understanding. But the peculiar gift of man is to sing knowing what he says. Further, the understanding ought to accompany the heart and affections, which cannot be unless we have the song imprinted in our memory, that we may be ever singing it. This present book [the Genevan Psalter, 1543], for this cause, besides what otherwise has been said, ought to be particularly acceptable to every one who desires, without reproach, and according to God, to rejoice in seeing his own salvation, and the good of his neighbours; and thus has no need to be much recommended by me, as it carries in itself its own value and praise. Only let the world be well advised, that instead of songs partly vain and frivolous, partly foolish and dull, partly filthy and vile, and consequently wicked and hurtful, which it has heretofore used, it should accustom itself hereafter to sing these heavenly and divine songs, with good king David. Touching the music, it appeared that it should be simple in the way we have put it, to carry weight and majesty suitable to the subject, and even fit to be sung in church as has been said.”

— John Calvin, Preface to the 1543 Genevan Psalter">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+for+public+prayers%2C+there+are+two+kinds+of+them%E2%80%94the+one+is+expressed+in+words+only%2C+the+other+with+song%3B+and+this+is+no+recent+invention%2C+for+from+the+first+origin+of+the+church%2C+this+has+been+the+case%2C+as+appears+in+history.+And+even+St.+Paul+does+not+speak+of+verbal+prayer+alone%2C+but+also+of+singing.+And+in+truth%2C+we+know+by+experience+that+song+has+great+force+and+power+in+moving+and+inflaming+the+heart+of+man+to+invoke+and+praise+God+with+more+vehement+and+ardent+zeal.+It+should+always+be+seen+to+that+the+song+should+not+be+light+and+frivolous%2C+but+that+it+have+weight+and+majesty%2C+as+saith+St.+Augustine%3B+and+also+that+there+is+a+great+difference+between+the+music+that+is+employed+for+the+enjoyment+of+men+at+table%2C+and+in+their+houses%2C+and+the+psalms+which+they+sing+in+church+in+the+presence+of+God+and+his+angels.+But+when+the+form+here+given+is+rightly+judged+of%2C+we+hope+that+it+will+be+found+holy+and+pure%3B+seeing+that+it+is+simply+constructed+for+the+edification+of+which+we+have+spoken%2C+as+well+as+that+the+use+of+singing+may+be+greatly+extended.+So+that+even+in+the+houses+and+in+the+fields%2C+it+may+be+to+us+an+incitement+and+an+instrument+or+means+to+praise+God+and+raise+our+hearts+to+him%3B+and+to+console+us+in+meditating+on+his+power%2C+goodness%2C+wisdom%2C+and+justice%2C+which+is+more+necessary+for+us+than+we+know+how+to+express.+For+the+first%2C+it+is+not+without+cause+that+the+Holy+Spirit+exhorts+us+so+carefully%2C+by+the+Holy+Scripture%2C+to+rejoice+ourselves+in+God%2C+and+that+all+our+joy+should+rest+there+as+its+true+end.+For+he+knows+how+truly+we+are+inclined+to+please+ourselves+in+vanity.+Thus+while+our+nature+draws+and+leads+us+to+seek+all+means+of+foolish+and+vicious+enjoyment%E2%80%94on+the+contrary%2C+our+Lord%2C+to+separate+and+draw+us+from+the+allurements+of+the+flesh+and+of+the+world%2C+presents+to+us+every+possible+means+to+fill+us+with+that+spiritual+joy+which+he+commends+so+much+to+us.+But+amongst+other+things+which+are+suitable+for+the+recreation+of+men%2C+and+for+yielding+them+pleasure%2C+music+is+either+the+first%2C+or+one+of+the+chief%2C+and+we+must+esteem+it+a+gift+of+God+bestowed+for+that+end.+Therefore%2C+by+so+much+the+more%2C+we+ought+to+see+that+it+is+not+abused%2C+for+fear+of+soiling+and+contaminating+it%3B+turning+that+to+our+condemnation+which+was+given+for+our+profit+and+good.+Even+were+there+no+other+consideration+than+this+alone%2C+it+ought+to+move+us+to+regulate+the+use+of+music%2C+so+as+to+make+it+subservient+to+all+good+morals%2C+and+that+it+should+not+give+occasion+for+loosing+the+bridle+of+dissoluteness%2C+that+it+should+not+lead+to+voluptuousness%2C+nor+be+the+instrument+of+immodesty+and+impurity.+But+further%2C+there+is+scarcely+anything+in+this+world+which+can+more+powerfully+turn+or+bend+hither+and+thither+the+manners+of+men%2C+as+Plato+has+wisely+remarked.+And+in+fact+we+experimentally+feel+that+it+has+a+secret+and+incredible+power+over+our+hearts+to+move+them+one+way+or+other.+Therefore+we+ought+to+be+so+much+the+more+careful+to+regulate+it+in+such+a+manner%2C+that+it+may+be+useful+to+us%2C+and+in+no+ways+pernicious.+For+this+reason%2C+the+ancient+doctors+of+the+church+often+complained+that+the+people+of+their+time+were+addicted+to+disgraceful+and+immodest+songs%2C+which%2C+not+without+cause%2C+they+esteemed+and+called+a+deadly+and+Satanic+poison+for+corrupting+the+world.+But+in+speaking+of+music%2C+I+include+two+parts%2C+to+wit%2C+the+words%2C+or+subject+and+matter%3B+secondly%2C+the+song+or+melody.+It+is+true+that+all+evil+words%2C+as+saith+St.+Paul%2C+corrupt+good+manners%2C+but+when+melody+is+united+to+them%2C+they+much+more+powerfully+pierce+the+heart%2C+and+enter+in%3A+just+as+when+by+a+funnel+wine+is+poured+into+a+vessel%2C+so+poison+and+corruption+is+infused+into+the+depth+of+the+heart+by+the+melody.+What+then+is+to+be+done%3F+It+is+to+have+songs+not+only+pure%2C+but+also+holy%2C+that+they+may+be+incitements+to+stir+us+up+to+pray+to+and+praise+God%2C+and+to+meditate+on+his+works%2C+in+order+to+love+him%2C+fear+him%2C+honour+and+glorify+him.+But+what+St.+Augustine+says+is+true%2C+that+none+can+sing+things+worthy+of+God+but+he+who+has+received+power+from+himself.+Wherefore+when+we+have+sought+all+round%2C+searching+here+and+there%2C+we+shall+find+no+songs+better+and+more+suitable+for+this+end+than+the+Psalms+of+David+which+the+Holy+Spirit+dictated+and+gave+to+him.+And+therefore+when+we+sing+them%2C+we+are+as+certain+that+God+has+put+words+into+our+mouths+as+if+he+himself+sang+within+us+to+exalt+his+glory.+Wherefore+Chrysostom+exhorts+all+men+and+women+and+little+children+to+accustom+themselves+to+sing+them+as+a+means+of+associating+themselves+with+the+company+of+angels%3B+further%2C+we+must+remember+what+St.+Paul+says%2C+that+spiritual+songs+cannot+be+sung+well+but+with+the+heart%3B+but+the+heart+requires+the+understanding%3A+and+in+that+saith+St.+Augustine+lies+the+difference+between+the+song+of+man+and+that+of+birds%2C+for+a+linnet%2C+a+nightingale%2C+and+a+jay%2C+may+sing+well%2C+but+it+will+be+without+understanding.+But+the+peculiar+gift+of+man+is+to+sing+knowing+what+he+says.+Further%2C+the+understanding+ought+to+accompany+the+heart+and+affections%2C+which+cannot+be+unless+we+have+the+song+imprinted+in+our+memory%2C+that+we+may+be+ever+singing+it.+This+present+book+%5Bthe+Genevan+Psalter%2C+1543%5D%2C+for+this+cause%2C+besides+what+otherwise+has+been+said%2C+ought+to+be+particularly+acceptable+to+every+one+who+desires%2C+without+reproach%2C+and+according+to+God%2C+to+rejoice+in+seeing+his+own+salvation%2C+and+the+good+of+his+neighbours%3B+and+thus+has+no+need+to+be+much+recommended+by+me%2C+as+it+carries+in+itself+its+own+value+and+praise.+Only+let+the+world+be+well+advised%2C+that+instead+of+songs+partly+vain+and+frivolous%2C+partly+foolish+and+dull%2C+partly+filthy+and+vile%2C+and+consequently+wicked+and+hurtful%2C+which+it+has+heretofore+used%2C+it+should+accustom+itself+hereafter+to+sing+these+heavenly+and+divine+songs%2C+with+good+king+David.+Touching+the+music%2C+it+appeared+that+it+should+be+simple+in+the+way+we+have+put+it%2C+to+carry+weight+and+majesty+suitable+to+the+subject%2C+and+even+fit+to+be+sung+in+church+as+has+been+said.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Preface+to+the+1543+Genevan+Psalter&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2a169505ee.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2a169505ee.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/05/saturday-psalm-series-we-sing-psalms-in-public-worship-calvin/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

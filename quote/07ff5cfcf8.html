<main class="wrap"><figure class="quote" id="q-07ff5cfcf8" data-kw="">
<blockquote><p>…what would he say of those Scottish protestants imprisoned in the Castle of Scherisburgh in France, who being commanded by the captain to come to the mass, answered that to do anything that was against their conscience they would not, neither for him nor yet for the king (History of the Church of Scotland, bk. 1, p. 181)? If he approve this answer of theirs, he must allow us to say that we will do nothing which is against our consciences. We submit ourselves and all which we have to the king and to inferior governors we render all due subjection, which we owe to them. But no mortal man has domination over our consciences, which are subject to one only Lawgiver and ruled by his Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, … (1637), pt. 3, ch. 4, p. 49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-5b1aa6c82d" data-kw="">
<blockquote><p>Mather enumerates and condemns all forms of commercial dishonesty and business corruption—including the kidnapping of Africans into slavery. He also gives us a sense of the accommodations of the old theocracy (20 years after the Glorious Revolution and 18 years after the witchcraft crisis) with the new horizons of the eighteenth century, telling the Assembly: ‘In two or three too memorable days of temptation that have been upon us, there have been errors committed. You are always ready to declare unto all the world that you disapprove those errors. You are willing to inform all mankind with your declaration that no man may be persecuted because he is conscientiously not of the same religious opinions with those that are uppermost. And that persons are not to be judged confederates with evil spirits merely because the evil spirits do make possessed people cry out upon them.’ Finally, and as expected, he applies the lesson to the place of America in the grand drama of redemption, holding out the hope that the churches of New England will play the leading role…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cotton-mather.html">Cotton Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theopolis Americana, an Essay on the Golden Street of the Holy City: publishing a Testimony Against the Corruptions of the Market-Place. With some good hopes of better things to be yet seen in the American world. In a sermon, to the General Assembly of the Massachusett-Province in New-England</cite>, Theopolis Americana, an Essay on the Golden Street of the Holy City: publishing a Testimony Against the Corruptions of the Market-Place. With some good hopes of better things to be yet seen in the American world. In a sermon, to the General Assembly of the Massachusett-Province in New-England (Boston, 1710) UNL on Rev., 21:21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>
<div class="actions"><button class="copy" data-copy="“Mather enumerates and condemns all forms of commercial dishonesty and business corruption—including the kidnapping of Africans into slavery. He also gives us a sense of the accommodations of the old theocracy (20 years after the Glorious Revolution and 18 years after the witchcraft crisis) with the new horizons of the eighteenth century, telling the Assembly: ‘In two or three too memorable days of temptation that have been upon us, there have been errors committed. You are always ready to declare unto all the world that you disapprove those errors. You are willing to inform all mankind with your declaration that no man may be persecuted because he is conscientiously not of the same religious opinions with those that are uppermost. And that persons are not to be judged confederates with evil spirits merely because the evil spirits do make possessed people cry out upon them.’ Finally, and as expected, he applies the lesson to the place of America in the grand drama of redemption, holding out the hope that the churches of New England will play the leading role…”

</figure><figure class="quote" id="q-f2d5d7b1c4" data-kw="">
<blockquote><p>All the question is concerning the imperated [commanded] acts and these external, that is not touching opinions and acts of the mind, but that which is visible and audible in these opinions, to wit, the speaking, professed holding of them, publishing, teaching, printing, and known external persuading of others to be of our mind. So that the question will come to this, whether the Magistrate’s sword be to regulate our words that concerns our neighbor, as that we lie not, we forswear not, to the hurt of the life and credit of our neighbor, that we slander not, rail upon no man, far less against the prince and ruler of the people, but whether the words we utter or publish of God though never such blasphemies, and lies, because they come from the conscience (as is truths or words we speak for or against our neighbor did not flow from a conscience either good or ill) be above or beyond all swords or coercive power of men. It is clear the question must be thus stated, for all the laws of the Old Testament (which we hold in their moral equity to be perpetual) that are touching blasphemies, heresies, solicitation to worship false gods and the breach of which the godly magistrate was to punish, command or forbid only such things as may be proved by two or three witnesses, and which husband and wife are not to conceal, and from which all Israel must abstain for fear of the like punishment, Dt. 13:8-11; 17:5-6; Lev. 20:1-5. But opinions in the mind, acts of the understanding, can never be proved by witnesses and such as neither Magistrate nor Church can censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (1649), ch. 4, pp. 46-47</span></figcaption>

<main class="wrap"><figure class="quote" id="q-6a86336749" data-kw="">
<blockquote><p>V… But as a supernatural good, spiritual and religious, man knew God, His revealed will, and found his supreme happiness therein with perfect accuracy. He was also endowed with an excellent knowledge of other things, as evidenced by the accurate naming of creatures according to their natures (Genesis 2:19-20) and the instantaneous recognition of his spouse, which amply confirmed this (Genesis 2:23). [Faustus] Socinus, then, must be considered utterly foolish for attributing brutish stupidity to such an excellent man… From this habitual righteousness, like a fountain, actual holiness arose in the lower faculties and the entire composite. The harmony (συμμετρία) of the sensitive appetite, both in desire (ἐπιθυμία) and passion (πάθος), was conformed to the superior faculties and right reason. This assembly of habits (commonly called Original Righteousness) constituted this image of God, particularly as its highest point (καρυφαῖον)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download</cite>, tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-038fc680a3" data-kw="">
<blockquote><p>For the whole man, as Maldonatus not badly reasons, is said to be born of flesh and to be wholly flesh, although the soul, the other part of him, is neither born of flesh, nor is flesh because he is born of blood and of the will of the flesh, and of the will of man [Jn. 1:13], that is in a carnal and human manner, by which manner those who are born, are born sinners, that is, carnal. And the soul itself, although a spiritual substance, when stained with sin, is carnal. On the contrary, the flesh, when it is free from sin, and joined to God, is called ‘spirit’.</p></blockquote>

</figure><figure class="quote" id="q-a4cc6d4d11" data-kw="">
<blockquote><p>If by ‘thinking’ we mean the capacity for what Bermudez calls direct belief modification, goal-desires, simple seeing, dispositions to form beliefs about things of a general type, and so forth, then non-linguistic animals are capable of thinking. But all of this falls within the range of capacities made possible by what Aristotelians traditionally call the ‘internal senses’. It doesn’t follow that non-linguistic animals are capable of what Bermudez calls second-order cognition, higher-order desires, the attribution to others of propositional attitudes, reflective belief modification, a grasp of compound, modal, tensed and general propositions, situation-desires and epistemic seeing, and so forth… If that is the sort of thing we mean by ‘thinking,’ then there is good reason to conclude that non-linguistic animals are not capable of thinking… Karl Popper drew a distinction between four main functions of language. The first is the expressive function, which involves the outward expression of an inward state… The second is the signaling function, which adds to the expressive function the generation of a reaction in others. Popper compares it to the dange signals an animal might send out in order to alert other animals… The third is the descriptive function, which involves the expression of a proposition, something that can be either true or false… The fourth is the argumentative function, which involves the expression of an inference from one or more propositions to another in a manner that can be said to be either valid or invalid… While the most primitive animals may be incapable of behavior that performs even the first two of these functions, there are also obviously animals that can perform them, and in that sense they can be said to have language. But… [this] does not entail being capable of the descriptive and argumentative functions… Whether animals lacking that particular sort of language, can be said to think in the sense of entertaining concepts, propositions, and logical inferences… the answer must be in the negative.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholasticae, 2024) | pt. 1, ‘What is Mind?’ | ‘Thought &amp; Language’, pp. 99-102, ch. 3 ‘The Intellect’</span></figcaption>

<blockquote><p>[3.] If parents, by refusing to comply with the desire of their children [in desiring to marry someone], plainly, in the judgment of the wisest of men, obstruct their happiness, and the glory of God herein. Or, if they have no reason for their not complying, or the reason given is contrary to the laws of God, or the common sense of all impartial judges; especially if the affair took its first rise from them, and afterwards they changed their mind, without sufficient ground. This, without doubt, lessens, or it may be so circumstanced, that it wholly takes away the charge of sin in the child, in acting contrary to the will of his parents, and fastens the guilt on them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, (1731; 1814), vol. 3, pp. 522-23, commenting on Westminster’s Larger Catechism</span></figcaption>

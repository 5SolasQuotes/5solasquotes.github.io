<blockquote><p>4. the king’s power is accumulative [Rom. 13:4], in giving to the Church, and aiding and helping; God has given to the king the Ten Commandments, and the Gospel, as a pupil is given to a tutor: The King holds his sword above the Law of God, to ward off the strokes of wicked men who do hurt the Law; but the king’s power is not privative, to take any privilege from the Law and the Church: so his power is as a tutor to keep, not as a father who may both give and take away from his son the inheritance; his power is defensive, not offensive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable and Temperate Plea (1642), ch. 19</cite>, p. 298</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9e80044434" data-kw="">
<blockquote><p>And here comes in the way that general bond wherewith man is especially bound unto man, and that without taking away of humanity itself, cannot be broken; There is also another bond binding every citizen unto his country and city. But both these bonds I affirm to be natural and universal, that everyone must have regard of his estate, and calling; for some serve in public offices, either civil, or the ministry; the rest are private persons… …yet, lest in this case [of flight], any man by flattering of himself, might sin against his neighbour [in neglecting his duty towards him], it is the duty of a Christian magistrate to provide that those things which either breed or nourish the plague, so far as they may, be taken away, and that regard may be had of those that be visited with this sickness, that all be not driven to be careful for all. … But if in such calamities the magistrate do not in time provide, as much as may be, both by such lawful means as are not repugnant unto Christian charity, that the infection may be prevented, and also that the sick of the plague want [lack] nothing…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Treatise of the Plague… (London, 1580; rep. 1665)</cite>, p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

the%20way%20that%20general&amp;text=the%20sick%20of%20the%20plague%20want%20%5Black%5D%20nothing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>On his return home on the 31st he found that the mysterious and awful visitation of the cholera — which he always anticipated would, in its alarming and desolating course, visit Inverness — had broken out. The first decided cases appeared on the 21st. On the Sabbath following, the 2nd September, he improved the visitation by preaching in the forenoon from Ps. 106:29, “Thus they provoked Him to anger with their inventions; and the plague brake in among them.” In the afternoon, from Joel 2:14, “Who knoweth if He will return and repent, and leave a blessing behind Him, even a meat offering and a drink offering unto the Lord your God” — subjects peculiarly appropriate. On the first appearance of this awful disease, and during its progress, the feelings excited in the minds of the inhabitants, and depicted in their countenances, none could adequately describe but those who were eye-witnesses. The common sympathies of our nature with those in affliction, and the ties and tender affections of friendship seemed, in some cases, to be totally cut asunder, — all seemed to be absorbed with their own individual cases. Several families fled to the country. Though rather timid and sensitive as to visiting the sick, in cases of contagious fevers, he deemed it his duty to remain at his post, publicly and privately exhorting his people to improve the visitation. Prayer meetings were frequent in various quarters of the town, each night, in places and by persons of whom it could not be said that ” prayers were wont to be made.” He united with them, entering in some measure into the spirit as well as unto the letter of the noble and patriotic resolution of Nehemiah, “should such a man as I flee?” as will be seen in the following extract of a letter which communicated to the writer [the biographer] his unlooked-for and much-lamented death [after attending Lord’s Day worship and the Tuesday evening prayer meeting]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-findlater.html">Robert Findlater</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoir of the Rev. Robert Findlater... (Glasgow ), p. 307. Findlater was a Church of Scotland minister in Inverness.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>In 1849, a cholera epidemic was raging throughout the United States. Not long after former President James K. Polk died of the disease in June, President Zachary Taylor declared a national day of fasting and prayer to be observed on August 3, 1849. E.D. McMaster, in his final days as President of Miami University in Ohio, preached a sermon that day titled Impending Judgments Averted by Repentance.” – Andrew Myers, ‘National Judgments Call for National Repentance: E.D. McMaster’; see here for more background info. Henry, Symmes C. – The Pestilence, a Divine Visitation: a Sermon preached August the Third, 1849, the Day of the National Fast Ref (1849) Symmes was a presbyterian minister in New Jersey. On the 1855 epidemic of Yellow Fever in America Armstrong, George D. – ‘The Lesson of the Pestilence’ (1855) on Heb. 12:10 About the yellow-fever epidemic in 1855 in Norfolk, Virginia, and in America generally. Armstrong was a presbyterian pastor. Cummins, George David – ‘The Pestilence: God’s Messenger and Teacher’ (1855) on Num. 16:46 About the yellow-fever epidemic in Norfolk, Virginia. Cummins (1822-1876) was an American Anglican Bishop and founder of the Reformed Episcopal Church. He was a staunch evangelical of reformed doctrine and he opposed the influences of ritualism and the Anglo-Catholic Oxford Movement. Storrs, Richard S. – ‘Terrors of the Pestilence’ (1855) on Eccl. 9:12 Storrs (1821-1900) was a conservative, congregational minister of the Church of the Pilgrims in Brooklyn, NY. Handy, Isaac W.K. – ‘The Terrible Doings of God’ (1855) Handy was a confederate, presbyterian pastor who was a graduate of Princeton Theological Seminary. He preached this sermon in a baptist church upon the occasion of 28 members of a Masonic Lodge dying in the recent epidemic in Virginia. A book of his, about his being imprisoned by the Union in the North, has been reprinted by Sprinkle Publications. . Breed, William P. – II. ‘The Great Plague’ in Under the Oak (Philadelphia: Presbyterian Board of Publication, 1866), pp. 19-85 ‘Under the oak’ refers to Rev. Breed (1816-1889) sitting and talking with children on Sabbath afternoons under an oak. This story is for children, but contains much spiritual help on the topic. “A good many years ago, in a town in India, a hundred miles north of Calcutta, a man suddenly fell sick…</p></blockquote>

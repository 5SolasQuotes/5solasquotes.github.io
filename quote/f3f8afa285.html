<main class="wrap"><figure class="quote" id="q-f3f8afa285" data-kw="">
<blockquote><p>Oh, all you who know and delight in this King, observe all this. Let it wound your heart; let your soul bleed; and for sorrow let your eyes cry rivers of tears by reason of the fact that this glorious King of His Church is thus despised and scorned. Pray continually for Him (Ps. 72:15) and to Him, that He would reveal Himself to His Church as King before the eyes of the entire world. ‘Give ear, O Shepherd of Israel, Thou that leadest Joseph like a flock; Thou that dwellest between the cherubims, shine forth. Before Ephraim and Benjamin and Manasseh stir up thy strength, and come and save us’ (Ps. 80:1-2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service, vol. 1, ch. 21, ‘The Kingly Office of Jesus Christ’</cite>, p. 568</span></figcaption>

<blockquote><p>We prefer public prayers made by the congregation in the church before private prayers, not because of the place, but in respect of the congregation, whose prayers jointly altogether are more fervent and effectual than the prayer of one man… Argument 1. The promise of our Savior is general, ‘Wheresoever two or three are gathered together, I am in the midst amongst them,’ Mt. 18:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis Papismi... (London, 1592)</cite>, pp. 367-8</span></figcaption>

</figure><figure class="quote" id="q-3c2a030736" data-kw="">
<blockquote><p>Were there no more in praying but a communion with God, how sweet is it? When Christ prays, the ‘fashion of his countenance is changed,’ Lk. 9:29. There is a heaven in the bosom of prayer, though there were never a granting of the suit; sure there is a sin in making heaven a hire and in making duty a relative thing, a horse for a journey, a ship for a voyage to fetch home gold, where as there is heaven in praising God before the Throne, such as is both work and wages, and so in spiritual duties here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened… (1655)</cite>, p. 71</span></figcaption>

</figure><figure class="quote" id="q-7a244c1171" data-kw="">
<blockquote><p>We honor the martyrs with the honor of love and fellowship, which we also give to holy people in this life, as we acknowledge that their hearts were prepared for such suffering for the truth of the Gospel. But they are venerated even more in death, as they are now free from all uncertainties. And we honor them with greater confidence, as we now praise them as victors living in a more blessed life, rather than still fighting in this life.</p></blockquote>

</figure><figure class="quote" id="q-f54649e8d6" data-kw="">
<blockquote><p>([Margin Note:] What sort of influences we are to seek from God) But this is also a tempting of God: 1. We are not to pray for influences-physical simply and absolutely for all uses and ends to work miracles, to remove mountains, but especially we are to pray for more influences and such as are suitable to our ordinary duties: Ps. 119:36, ‘Incline my heart’ (but he suits not of God every bowing of the heart abstracted from the Word) ‘incline my heart unto thy testimonies and not to covetousness.’ Verse 133, ‘Order my heart in thy steps; let not any iniquity have dominion over me.’ 2. David seeks not every sort of quickening influences, but Ps. 119:25, ‘Quicken Thou me according to thy Word.’ Verse 40, ‘Quicken me in thy righteousness.’ Verse 88, ‘Quicken me after thy loving kindness.’ Verse 149, ‘O Lord, quicken me according to thy judgement.’ Verse 156 and 116, ‘Uphold me according to thy word, that I may live.’ Quakers and Familists seek after the furious wild-fire of hell, skaddings and flamings of a spirit abstracted from the Word…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e9472f1586" data-kw="">
<blockquote><p>The grand object of the Christian ministry is to win souls to Christ, and to build them up in holiness and comfort through faith unto salvation. Those entrusted with it are required to aim at nothing lower than the rearing up of that spiritual temple in which God delights to dwell. How honourable their office; but, at the same time, how awfully responsible! Were it not that our sufficiency is of God, who could venture to undertake it without presumption the most daring?

Brethren, pray for us, that the word of the Lord may have free course and be glorified—that we may be found faithful, and that you may be rooted and built up in Christ, and at length made pillars in the temple above. And that you may be stirred up to do so, cherish a profound sense of the sacred nature and the momentous issues of the ministerial office. Remember that its great object is to build up living stones on the Rock of Ages.

This is a counsel which ought not at any time to be regarded as unseasonable, but which, at the present day, deserves to be pondered with peculiar care. I am verily persuaded that most of the troubles through which we have lately passed have originated in this, among other kindred causes, —viz., ignorance or inconsideration of the true nature and design of the Christian ministry. For, did men but view it seriously in the light of Scripture, and in connection with its bearings on the world to come, surely they would tremble at the thought of subjecting to the rude hand of merely secular authority the functions of an office so spiritual in its nature, and bearing so directly on the high interests of eternity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-couper.html">David Couper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ, the Builder and Ruler of the Temple in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>Saying AMEN, audibly to all. Neh. 8. 6. […]

As for an audible pronouncing of Amen, if the mind of them that pronounce it, have been upon that which the Minister uttered, and their heart have given consent thereto, it compriseth altogether as much as the Minister hath uttered. This is the only warranteable means for people to utter their mind in a Congregation. It must therefore be uttered by every one, altogether, so loud, as well as they hear what he hath uttered in their name. For the one is as requisite as the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s Sanctification</cite>, (London, 1641), p. 5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-5fe307e2c4" data-kw="">
<blockquote><p>The reasons by which it appears that this restraint of kindling a fire [by the Israelites in the wilderness] on the Sabbath day was only temporary, are these: … Secondly, this seems to cross our Savior’s general rule, Mk. 2:27, that the Sabbath was made for man, and not man for the Sabbath; He means for man’s comfort and refreshing, for which kindling of fire and dressing of meat may be, and are in a sort necessary. Thirdly, our Savior allows the loosing of a beast from the stall, and leading of him to the water on the Sabbath day: now we know, the beast might be provided for by setting water in the stall overnight, which would refresh it sufficiently, and better than meat dressed overnight could comfort many men. Fourthly, we find our Savior present at a great feast, Lk. 14:1, where many, and it seems persons of quality, verses 7, 12, were bidden: now it is very unlikely that the provisions for that feast were dressed over night; and if it were dressed on that day, neither would the Pharisee have permitted, nor our Savior have countenanced the dinner with his presence, if dressing of meat, kindling of fires on the Sabbath day, had been forbidden by the law. Now why the dressing of manna, while the Israelites were in their peregrination in the wilderness was forbidden, though the dressing of other meats might be allowed afterwards, there may be some reason given. For manna it may be… as good and comfortable eaten cold as hot, and the preparing overnight, might be no inconvenience at all; howsoever it is out of question that in that unsetled condition of the Israelites wandering in the wilderness, when they were enforced to pick up fuel, where they could get it, baking and boiling must needs be more troublesome and laborious than it was afterwards in Canaan, where being settled in their dwellings, they had all things whereof they were to make use for such works provided and ready at hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Way to the Tree of Life Discovered in Sundry Directions for the Profitable Reading of the Scriptures</cite>, ... (1647), A Digression concerning the Morality of the Fourth Commandement, Section III, ‘The Morality &amp; Perpetuity of the Sabbath Proved out of the Fourth Commandement’, pp. 294-95 White was a Westminster divine.</span></figcaption>

</figure><figure class="quote" id="q-c3e59fbef6" data-kw="">
<blockquote><p>All these upon my own knowledge were the true causes why so great a number of those persons who were counted most religious, fell in with the parliament in England; insomuch that the generality of the stricter diligent sort of preachers joined with them, though not in meddling with arms, yet in judgment, and in flying to their garrisons; and almost all those afterwards called presbyterians were before conformists: Very few of all that learned and pious synod at Westminster were nonconformists before, and yet were for the parliament, supposing that the interest of religion lay on that side. Yet did they still keep up an honorable esteem of all that they thought religious on the other side, such as Bishop Davenant, Bishop Hall, Bishop Morton, Archbishop Ussher, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reliquiæ Baxterianæ</cite>, (London: Parkhurst, 1696), bk. 1, pt. 1, p. 33</span></figcaption>

<blockquote><p>…it is too evident that many and great corruptions are to our sin and shame retained… but yet they are extrinsic and not of the substance of God’s worship, which for matter, and essential form, remains entire and properly his own (though not so acceptable) under, as well as without them; and will not therefore warrant my separation, or non-communion so far as to lie at home, or loiter in the churchyard, until the Common-Prayer (whereby God is truly, though not orderly, invocated and worshipped; wherein I, as a member of that Church, am interested, and unto which, as it is public, solemn prayer, though in an unsuitable method, my ‘Amen’ is an indispensable duty) being ended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation</cite>, … in a Letter, written July 20, 1661… (1662), pp. 23-24 Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland.</span></figcaption>

<blockquote><p>XXVII. Regarding the acts of faith, many Reformed theologians usually distinguish three acts or parts of justifying faith. The first is knowledge by which we recognize and understand the Word of God, at least in terms of what is necessary for salvation. The second is assent that we give to all that has been revealed to us in the Word of God. The third is confidence by which the believer specifically applies the general promise of the word to themselves. This is the teaching of Ursinus and Pareus in the Catechetical Explanations, question 21; of Wendelinus in Christian Theology, book 2, chapter 24, Thesis 13, 14, &amp; 15; of Tilenus in a disputation on justifying faith, Thesis 20; and also of Trelcatius in the above-cited location. … XLVI. Moreover, many doctors of the Reformed school, as we saw above, count confidence among the acts of faith; but they want it to be the proper formal and specific act of faith, and its primary part. Yet, others seem to be of a different opinion; they teach that confidence is indeed an outcome and effect of faith, but not an act of faith properly said. This is among others the opinion of Garrissoles, a professor at Montauban Academy while he was alive. ‘If you ask whether faith is not confidence,’ he says: ‘I respond that confidence indeed adheres to faith with an indissoluble bond, yet, if we speak properly, it is not faith, but an effect, springing necessarily as it were from faith.’ (in the Explanation of the Catechism of Christian Religion, on the eighteenth section.) XLV. Beza held the same opinion, writing about Paul’s words in Eph. 3, where it says, ‘In whom we have boldness and access with confidence by the faith of him,’ deducing that confidence differs from faith as an effect from its cause. ‘From this passage,’ he says: ‘it is clearly apparent that confidence differs from faith as an effect from a cause, and therefore it is mistakenly substituted for faith by some, even though these two always coexist.’ Peter du Moulin also teaches the same in his Second Disputation on Justification and Justifying Faith, thesis 19 and subsequent. ‘We consider,’ he says, ‘faith and confidence to be different, and the latter to be the inseparable fruit and effect of the former.’ To which Anthony Faius adds, in Theses Disputed in Geneva, thesis 20: ‘The liberty through which access to God is easy, and the confidence through which we cry Abba Father, are effects of faith.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-62bc35a5e2" data-kw="">
<blockquote><p>VIII. Third, the object of the justifying action:… (2) men (1 Tim. 2:5), not just any, but: … (d) called to receive the Redeemer and the conditions of redemption (Rom. 8:30; 1 Pt. 2:9–10); (e) regenerated and made alive (Eph. 2:5), illuminated in mind (Eph. 1:17–19), renewed in heart or will (Ezek. 36:26), so that they are able to submit to calling, and receive the Redeemer offered to them, and the terms of redemption; (f) converted (Jer. 31:18–19), so that through the power received in regeneration, they by faith actually receive God and the Mediator (Phil. 3:12), and turn themselves from their sins to righteousness (Jer. 31:19); (g) united with Christ, so that they possess, in none other than Christ, a righteousness not their own, but Christ’s, that which is through faith (Phil. 3:9; 1 Cor. 1:30; Acts 4:12). From these things can at the same time be perceived the order and procedure of God whereby he is accustomed to provide the justification of the miserable sinner. IX… whereby he calls the elect to receive the Redeemer given to them (2 Tim. 1:9), whereby he grants faith to them, by means of which they receive him (Phil. 1:29) and are united with him (Phil. 3:9), the same grace, I say, whereby he reckons and pronounces them righteous in Christ.</p></blockquote>

e2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/62bc35a5e2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=VIII.%20Third%2C%20the%20object%20of%20the,and%20pronounces%20them%20righteous%20in%20Christ&amp;text=VIII.%20Third%2C%20the%20object%20of%20the%20justifying%20action&amp;text=he%20reckons%20and%20pronounces%20them%20righteous%20in%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c440dd2bf7" data-kw="">
<blockquote><p>In our justification in this life by faith, Christ is considered as our propitiation and advocate, as he who has made atonement for sin, and brought in everlasting righteousness; but at the last day, and in the last judgment, he is considered only as the judge.</p></blockquote>

</figure><figure class="quote" id="q-08d6a514fe" data-kw="Faith alone">
<blockquote><p>Man is justified by faith without works; therefore by faith alone. The reason of the consequence is manifest because there are not more modes of justifying than these two—by faith and by works. Thus, one being removed, the other must not only necessarily be left, but also left alone. Otherwise the enumeration would not be legitimate. … Now why would the apostle so often and so expressly institute an antithesis between faith and works in this matter, if works could concur with faith in any way to the act of justification? Would he not in this particular have occasioned believers to err by removing works absolutely and simply from it, if they contribute anything towards it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 16.8.8</span></figcaption>

</figure><figure class="quote" id="q-2a0c39a651" data-kw="">
<blockquote><p>Because we are justified solely because of the righteousness of Christ, our role in justification is not to obey but to have faith in Christ… When we seek to justify ourselves by human effort of any kind, we undermine the sufficiency of Christ’s atoning work. Only justification by faith alone preserves the honor and glory of what Jesus did on the cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jay-harvey.html">Jay Harvey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Don’t Call it a Comeback</cite>, p. 100</span></figcaption>

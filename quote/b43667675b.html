<main class="wrap"><figure class="quote" id="q-b43667675b" data-kw="">
<blockquote><p>5. It is observed, that David’s psalms were sung formerly with musical instruments, as the harp, timbrel, and cymbal, and organs; and why not with these now? If these are to be disused, why not singing itself? I answer, these are not essential to singing, and so may be laid aside, and that continue; it was usual to burn incense at the time of prayer, typical of Christ’s mediation, and of the acceptance of prayer through it; that is now disused; but prayer being a moral duty, still remains: the above instruments were used only when the church was in its infant-state, and what is showy, gaudy, and pompous, are pleasing to children; and as an ancient writer observes, “these were fit for babes, but in the churches (under the gospel-dispensation, which is more manly) the use of these, fit for babes, is taken away, and bare or plain singing is left.” As for organs… were first introduced by a pope of Rome, Vitalianus, and that in the seventh century, and not before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Body of Doctrinal &amp; Practical Divinity</cite>, vol. 3, ‘Of Singing Psalms As A Part of Public Worship’ (London, 1796), p. 384</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-4843d0e5f4" data-kw="">
<blockquote><p>A second characteristic of Puritan worship was its utter simplicity and sincerity. This unostentatious and modest form of worship found its appropriate domestic setting in meeting-houses… The Puritans refused to let the pealing organ blow To the full-voiced quire below In service high and anthems clear… in favour of the pedestrian metres of the Psalms so that all could memorize them and sing them in unison… their sense of holiness in approaching God was so strong that they could do without any theatrical or adventitious aids which would make tawdry the splendour of the Creator’s covenant mercies to his own.</p></blockquote>

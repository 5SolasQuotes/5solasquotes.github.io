<main class="wrap"><figure class="quote" id="q-5f3e720410" data-kw="">
<blockquote><p>…love consists in a certain agreement of the lover with the object loved, while hatred consists in a certain disagreement or dissonance. Now we should consider in each thing, what agrees with it, before that which disagrees: since a thing disagrees with another, through destroying or hindering that which agrees with it. Consequently love must needs precede hatred; and nothing is hated, save through being contrary to a suitable thing which is loved. And hence it is that every hatred is caused by love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, Question 29, ‘Of Hatred’ | Article 2, ‘Whether Love is a Cause of Hatred? [Yes]’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-973f800a2f" data-kw="">
<blockquote><p>The will of God is also to be viewed in the light of the various ‘affections’ attributed to God. these ‘affections’ are, in man, termed emotions or passions and are associated with human weakness and mutability. In relation to God, however, the ‘affections’: ‘do not designate any passions or emotions, nor are to be understood as diverse divine wills, for this would imply mutation in God, but as acts of the same will, indicating its different relations.’ (Pictet, Theol. chr. I.vii.1) Of course, the immutability of God, like his being unmoved, describes a God who is also actus purus [pure act]: thus neither concept indicates a divine immobility or quiescence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, (Baker, 2003), vol. 3, pt. 2, ch. 5.4, D. The ad intra Distinctions, p. 454</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><figure class="quote" id="q-b7df78fc1c" data-kw="">
<blockquote><p>Helm (1990) urged the coining of an entirely new term, ‘theomotions’, to express divine affect in contradistinction to human varieties [Helm, ‘The Impossibility of Divine Passibility’ in ed. N.M. de S. Cameron, The Power &amp; Weakness of God (Edinburgh: Rutherford House, 1990), pp. 119-140]. And Scrutton (2005) suggested that differentiating ‘passions’ from ‘affections’, a la Augustine and Aquinas, would move the conversation forward.</p></blockquote>

</figure><figure class="quote" id="q-2a8bd00e99" data-kw="">
<blockquote><p>Whether relations are in God unto creatures, e.g. Creator, Lord, etc.: It is affirmed by Ockam and Gabriella, 1. d. 30, q. 5; Durand, q. 3; Marsil. 1. q. 32, art. 1; Gregory of Rimini, 1. d. 28, q. 3, art. 1; Peter Hurtad. It is denied by Thomists, but it is a dispute about a name, as notes Vasquez in 1 Tho. q. 13, art. 7, ‘For there is, indeed, no new foundation on the part of God, but on the part of the creature. Therefore the Thomists call the relation a relatio rationis [relation of reason].&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, (London: White, 1675), sect. 4, ‘Of God’s Relations to the Creature &amp; Denominations (thereupon) in his Power, Knowledge &amp; Will’, p. 8, margin note</span></figcaption>

</figure><figure class="quote" id="q-c54d9e9900" data-kw="">
<blockquote><p>As the Divine will cannot but be perfect, so it cannot be wanting to render the highest love to itself, to its goodness, to the Divine nature, which is due to Him. Indeed, the acts of those, ad extra are not necessary, but upon a condition. To love righteousness without Himself, or to detect sin, or inflict punishment for the committing of it, could not have been, had there been no righteous creature for Him to love, no sinning creature for Him to loathe and to exercise his justice upon as the object of punishment. Some attributes require a condition to make the acts of them necessary, as it is at God’s liberty whether He will create a rational creature or no… It is at his liberty whether He will permit a creature to sin; but if He sees good to suffer it, it is impossible but that He should detest that creature that goes cross to his righteous nature. His holiness is not solely an act of his will, for then he might be unholy as well as holy…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses upon the Existence &amp; Attributes of God 2 vols</cite>, vol. 2 (Robert Carter, 1853), Discourse 11, ‘On the Holiness of God’, pp. 115-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

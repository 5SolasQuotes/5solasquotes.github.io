<main class="wrap"><figure class="quote" id="q-e7e46bfbc0" data-kw="">
<blockquote><p>But it does not follow that God owes anything to us, because he renders righteously what he renders; for he is righteous even in those acts of kindness which are of free grace. And he &quot;renders the reward&quot; which he has promised, not because we take the lead by any act of obedience, but because, in the same course of liberality in which he has begun to act toward us, he follows up his former gifts by those which are afterwards bestowed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles to Timothy, Titus, and Philemon</cite>, 2 Timothy 4:8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5b54395096" data-kw="">
<blockquote><p>Let them, if they will, expect eternal life for their good works; only let us on the authority of Paul hope for it from the grace of God. … Let the saying of Paul then stand fast — that “the inheritance is not of the law but of faith, that the promise according to grace may be sure to every one that believeth.” (Romans 4:14.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session 6, on canon 26</span></figcaption>

</figure><figure class="quote" id="q-14a3722262" data-kw="">
<blockquote><p>Filial adoption, in making us partakers by grace in the divine nature, can bestow true merit on us as a result of God&#x27;s gratuitous justice. This is our right by grace, the full right of love, making us &quot;co-heirs&quot; with Christ and worthy of obtaining &quot;the promised inheritance of eternal life.&quot; The merits of our good works are gifts of the divine goodness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §2009</span></figcaption>

</figure><figure class="quote" id="q-4c0cb98b84" data-kw="">
<blockquote><p>This disputation on merits will be fourfold. First we must treat whether there are any true merits of the just. Secondly, what merit is, or what is required to constitute true merit. Thirdly, of what kind these merits are, that is, whether they are ex condigno or only ex congruo. Fourthly, for what they are merits, or what it is that properly falls under merit.</p></blockquote>

</figure><figure class="quote" id="q-b8e4f9d6ce" data-kw="">
<blockquote><p>What have these most pestilential Sophists left to Christ on which to exert his virtue? They say that he merited for us the first grace, that is, the occasion of meriting, and that it is our part not to let slip the occasion thus offered. O the daring effrontery of impiety! Who would have thought that men professing the name of Christ would thus strip him of his power, and all but trample him under foot?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.6</span></figcaption>

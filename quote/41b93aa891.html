<main class="wrap"><figure class="quote" id="q-41b93aa891" data-kw="">
<blockquote><p>The image of God refers to a likeness shared with God regarding intellect, will, integrity, righteousness, dominion over creatures, which occurs in human beings and angels alone.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-41388c7879" data-kw="">
<blockquote><p>Man truly begets man, although the soul is created by God, not because he only bestows him a body, nor because he prepares the body for receiving the soul… but because from the man who begets comes the very action by which the rational soul is substantially united to the body, and begins to inform, inhabit, and fill the whole material of the body. Thus in our opinion, the begetting of man is located in that action by which, through prolific virtue, the soul is joined by an essential bond to the body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baron.html">Robert Baron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Exercise, on the Origin of the Soul &amp; the Propagation of Sin</cite>, [Traductionem] of Souls &amp; the Propagation of Sin are Confuted in Philosophy Serving Theology, that is, a Pius &amp; Sober Explication of Philosophical Questions Occurring Occassionally in Theological Disputations (Oxford, 1641) ToC, p. 84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Man truly begets man, although the soul is created by God, not because he only bestows him a body, nor because he prepares the body for receiving the soul… but because from the man who begets comes the very action by which the rational soul is substantially united to the body, and begins to inform, inhabit, and fill the whole material of the body. Thus in our opinion, the begetting of man is located in that action by which, through prolific virtue, the soul is joined by an essential bond to the body.”

</figure><figure class="quote" id="q-038fc680a3" data-kw="">
<blockquote><p>For the whole man, as Maldonatus not badly reasons, is said to be born of flesh and to be wholly flesh, although the soul, the other part of him, is neither born of flesh, nor is flesh because he is born of blood and of the will of the flesh, and of the will of man [Jn. 1:13], that is in a carnal and human manner, by which manner those who are born, are born sinners, that is, carnal. And the soul itself, although a spiritual substance, when stained with sin, is carnal. On the contrary, the flesh, when it is free from sin, and joined to God, is called ‘spirit’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Catholic Opposite the Papist Catholic</cite>, (1630), Question 14, ‘On Concupiscence, or the remnants of original sin in the regenerated man’, p. 3 trans. AI</span></figcaption>

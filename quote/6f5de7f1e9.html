<blockquote><p>He grants Translations are of good use, but not in the worship of God: and if of good use elsewhere, why not there? Saint Paul exhorts the Colossians, That the Word of God might dwell in them richly, in all wisdom. They being Grecians, I take it for granted, that the most of them were not skilled in the Hebrew, the New Testament being not written, not any of it, till after Pentecost, not all of it until John a matter of sixty years after Christ’s death. This to the Colossians could not be meant of the New Testament, but of the Old.

So again, the Thessalonians, being Grecians, did not understand the Hebrew, yet they were commanded to prove all things: By what? why by the Scriptures, and this was the Old Testament which, they understanding not (the Hebrew) then it cannot but be meant of the translation.

This Conclusion I think is clear, sith the Churches of the Gentiles were commanded to read Moses and the Prophets, and read them they could not but in a translation; therefore translations are commanded by God, as an Ordinance and constitution of Heaven itself.</p></blockquote>

<blockquote><p>34. In all Reformed Churches men use[d] to enter into the places of public worship with their hats off [is the claim, in accordance with the Anglican practice that the puritans rejected]. In France the women that are persons of quality unmask themselves. And the devoutest sort both of men and women use[d] to kneel, and make a short prayer for God’s blessing on the service they come to perform, before they sit down; Yet the [Westminster] Directory (though it pretends conformity with them) prohibits these very things, which are likewise used upon the same occasions.

35. In some places all the people stand bare as long as they are in the Church, as in Hungary and Transylvania, where the Prince himself uses to be uncovered. In others they stand bare only during the service, as at Geneva, where they are covered only at sermon. In Poland and Lithuania they sing, and both read and hear the Scripture standing, and they beat their breast at the end of their prayers. Everywhere they use to kneel at prayer [especially in the 1500’s]; and if all do not kneel when they may conveniently, it is scandalous. It was ordered by the last National Assembly of the Reformed Churches of France held at Loudun, that all should be bare-headed whilst the office of baptism is read. Which was not so much a new constitution as the renewing of an old one as may be seen in their Discipline, which will have those censured that shall not uncover themselves when sacraments are celebrated. And although there is too much irreverence in the said Churches both at the administration of sacraments and at all other holy duties performed in the congregation, it is well known that it is against the mind of the ministers, who very often use to reprehend the people for this abuse, and exhort them to behave themselves more reverently in the house of God. By which we may guess what judgement they would make of those of the presbyterian congregations, who never kneel [they rather generally stood at prayer in the 1600’s], and never uncover their heads, or only a little the top or one side of them at prayer… And because this outward reverence is so slighted and almost laughed at by some, though great pretenders to reformation, I think it not amiss to transcribe here at length the very words of the Discipline established in the French Reformed Churches, by which may be seen how much they value it (ch. 10, article 1): ‘That irreverence shall be mended which is seen in many when they are present at Common Prayer in the Church, or at their private prayer in the family, not to uncover their head and not to bend their knees; a thing which is contrary to piety, gives suspicion of pride, and may offend the godly. Wherefore the ministers shall be warned, as likewise the elders and heads of families, to watch carefully, that during the said prayers every one, without exception or acception of persons, do by these outward signs stifie the humility of their hearts, and of that inward homage which they yield unto God.’

36. In the Churches of Lithuania and Polonia, where they have their hats on at sermon, they always put them off at the name of Jesus; and the women, if they be sitting, bow down their head; if they they stand, they make a curtsy. The Reformed Church of Bremen [Germany] do the like. And the same reverence was used at the naming of that holy name by a great many, though not by all, nor always, before the wars in the Palatinate [Germany], and no doubt but they do so still.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-durel.html">John Durel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Government &amp; Public Worship of God</cite>, … (London, 1662), Introduction, pp. 32-34 Durel (1625–1683) was an Anglican, Erastian, clergyman and academic, here seeking to support the Anglican practices.</span></figcaption>

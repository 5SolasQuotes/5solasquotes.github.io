<main class="wrap"><figure class="quote" id="q-e1c9e29009" data-kw="">
<blockquote><p>2. Yet is it not altogether to be denied but that the Lord may in particulars of the last kind sometimes reveal himself to some by foretelling events before they come, such as the famine that Agabus foretold of, or Pauls imprisonment, were: of such the story of the martyrs and saints do sometimes make mention;</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8203363a8d" data-kw="">
<blockquote><p>It is not by Romanists only that it is denied, practically at least, if not theoretically. Nothing is more common among Protestants, especially in our day, than the attempt to coerce the conscience of men by public opinion; to make the opinions of men on questions of morals a rule of duty for the people, and even for the Church. If we would stand fast in the liberty wherewith Christ has made us free, we must adhere to the principle that in matters of religion and morals the Scriptures alone have authority to bind the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. VI, §4</span></figcaption>

</figure><figure class="quote" id="q-59f4555384" data-kw="">
<blockquote><p>Christ’s first disciples were chosen by Him in order that they might disperse throughout the whole world, and preach His faith everywhere, according to Mt. 28:19, “Going… teach ye all nations.” Now it was not fitting that they who were being sent to teach others should need to be taught by others, either as to how they should speak to other people, or as to how they were to understand those who spoke to them; and all the more seeing that those who were being sent were of one nation, that of Judea, according to Is. 27:6, “When they shall rush out from Jacob [*Vulg.: ‘When they shall rush in unto Jacob,’ etc.]… they shall fill the face of the world with seed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, trans. Fathers of the English Dominican Province (Benziger Bros., 1947), 2nd part of 2nd part, Question 176, ‘Of the Grace of Tongues’, Article 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-008711bfe9" data-kw="">
<blockquote><p>Thus a careful analysis of Gillespie’s wider thought brings Gillspie far more nearly into line with his cessationist colleagues at the Assembly than may have been supposed by recent scholars such as Berends. Nothing that Gillespie concludes necessarily separates him from the majority view of the Reformed orthodox. He appeals to the same texts which others applied earlier to immediately-inspired prophets, but these texts, as we have seen, can also be used to justify a later non-miraculous though otherwise analogous gift of the Holy Spirit, as John Own and other Westminster divines maintained. Neither does anything Gillespie says preclude an explanation like Rutherford’s of the Knoxian foretellers- namely that modern ‘prophets’ were applying Scripture principles to providential circumstances under the leading of the Holy Spirit. None of the Scottish commissioners, including Blair and Gillespie, therefore, needs to be understood as a proponent of a continuing immediate revelation. Indeed, there is insufficient evidence to allow that conclusion concerning any of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ch. 5, ‘Whether these prophets and prophesyings in the primitive church, 1 Cor. 14; 12:28; eph. 4:11; were extraordinary and not so to continue; or whether they are precedents for the preaching or prophesying of such as are neither ordained ministers nor probationers for the ministry’ in A Treatise of Miscellany Questions | Garnet Milne, p. 247:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus a careful analysis of Gillespie’s wider thought brings Gillspie far more nearly into line with his cessationist colleagues at the Assembly than may have been supposed by recent scholars such as Berends. Nothing that Gillespie concludes necessarily separates him from the majority view of the Reformed orthodox. He appeals to the same texts which others applied earlier to immediately-inspired prophets, but these texts, as we have seen, can also be used to justify a later non-miraculous though otherwise analogous gift of the Holy Spirit, as John Own and other Westminster divines maintained. Neither does anything Gillespie says preclude an explanation like Rutherford’s of the Knoxian foretellers- namely that modern ‘prophets’ were applying Scripture principles to providential circumstances under the leading of the Holy Spirit. None of the Scottish commissioners, including Blair and Gillespie, therefore, needs to be understood as a proponent of a continuing immediate revelation. Indeed, there is insufficient evidence to allow that conclusion concerning any of them.”

%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F008711bfe9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/008711bfe9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/cessationism/#:~:text=Thus%20a%20careful%20analysis%20of%20Gillespie%E2%80%99s,that%20conclusion%20concerning%20any%20of%20them&amp;text=Thus%20a%20careful%20analysis%20of%20Gillespie%E2%80%99s%20wider%20thought&amp;text=to%20allow%20that%20conclusion%20concerning%20any%20of%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2fcae9d028" data-kw="">
<blockquote><p>In the earliest times, “the Holy Ghost fell upon them that believed: and they spake with tongues,” which they had not learned, “as the Spirit gave them utterance.” These were signs adapted to the time. For there behooved to be that betokening of the Holy Spirit in all tongues, to show that the Gospel of God was to run through all tongues over the whole earth. That thing was done for a betokening, and it passed away. In the laying on of hands now, that persons may receive the Holy Ghost, do we look that they should speak with tongues? Or when we laid the hand on these infants, did each one of you look to see whether they would speak with tongues, and, when he saw that they did not speak with tongues, was any of you so wrong-minded as to say, These have not received the Holy Ghost; for, had they received, they would speak with tongues as was the case in those times? If then the witness of the presence of the Holy Ghost be not now given through these miracles, by what is it given, by what does one get to know that he has received the Holy Ghost? Let him question his own heart. If he love his brother, the Spirit of God dwelleth in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on the First Epistle of John, Homily 6, on 1 Jn. 3:19-4:3</cite>, section 10 in NPNF1, 7:497-98</span></figcaption>

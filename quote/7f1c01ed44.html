<main class="wrap"><figure class="quote" id="q-7f1c01ed44" data-kw="">
<blockquote><p>This post is very interesting for revealing how establishmentarians’ believed that it was the duty of the civil magistrate to fund the propagation of the gospel and to support places of learning. It further proves that Libertarian Theology (small governmentism, that seeks to restrict the state to crime, defence, and very little else) is really a fruit of Baptist Voluntaryism and not Presbyterian establishmentarianism:

Were the State constituted on Scriptural principles, and the true religion established by public authority, it can never be shown that it would be unjust to decree a moderate tax, in order to maintain and propagate Christianity throughout the community. Who ever objects against the appropriations that are made out of the national treasury, to endow Colleges and Universities, and to promote general education? Now, if the reason for making these appropriations be that education advances the ends of civil government, as it tends to further the peace and prosperity of society, it can be shown, with tenfold conclusiveness, that civil rulers should extend their bounty to the true religion established in their dominions. Education is a blessing to a people, but pure Christianity is a blessing incomparably greater. All that education can ever do, towards promoting good order and industry and obedience to the laws throughout a community, will be accomplished much more efficiently by the doctrines of true religion faithfully inculcated, and its ordinances Scripturally administered. This being admitted, and we presume it will not be easy to deny the premises or conclusions, it follows, that a slight tax for the support of a national religious establishment cannot be regarded as a grievance, even by those who swell the ranks of dissent. […] For its own intrinsic excellence, and for the good which its establishment produces, we maintain that genuine Christianity should be supported; and that a portion of the public money were well applied, when used for the purpose of providing places of accommodation for worship, and of maintaining a regular ministry in unevangelised parts of the country. Should unbelievers, or persons who dissent from the establishment, complain that they are unjustly taxed for supporting a system which they disapprove, let them be told that the same objection may be brought with equal, if not superior force, against an endowment being extended by the State to places of learning. Besides, the principle of the objection [that unbelievers should not be taxed to support something they do not like] equally strikes against almost every appropriation of the public money for any general object, and goes to unhinge completely the operations of government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Nov. 1831, pp 395-6</span></figcaption>

<blockquote><p>3. And if communicants will be at the charge of maintaining a pastor whom they can better trust their souls with, than him whom the patron chooses for them, the orthodox or tolerating magistrate must see that he be not an heretic, that does more hurt than good; and must keep them under the laws of loyalty and peace, and see that they sow not sedition, and revile not others under pretense of worshipping God.

4. And no men should, without necessity, lose the advantages of a public ministry which the most consent to, and which has the magistrates countenance and maintenance; because gathering singular churches within parish-bounds, seems some accusation of the parish-minister or Church; and such Churches are oft tempted to envy and censoriousness, and are usually envied and censured by others: And unity is much of our strength and beauty. But in case of necessity it may be done.</p></blockquote>

<blockquote><p>But if that cannot be conveniently had, as in a national Church it may fall out, then the Magistrate as a preserver of peace and truth, may command the sincerer part [of the Church] to convene in a synod, and do their duty, as the good kings of the people of God did: 2 Chron. 15, Asa gathered together a people who entered in covenant to seek the Lord God with all their heart, and laid an obligation of punishment to death on the rest, vv. 12-13; and Jehoshaphat, 2 Chron. 23:4, he laid charge on Hilkiah the High Priest, and the priests of the second order, whom he knew to be better affected to the work, to bring out the vessels made for Baal; which proves that the king should put the sincerest to do that, which in common belongs to the whole, in which case of the erring of the most part of the Church, the prince indirectly condemns the erring part of the [ecclesiastical] synod, because it is his place to forbid and to punish with the sword, the transgressors of God’s Law. But because his power is accumulative [to build up, according to the truth], not privative [to take away], under that pretense he has not power to hinder the sincerer part to meet and determine according to the Word of God. … …but the king’s power cannot make Church-canons [determinations], for it is a part of the ministerial calling to make canons, and therefore he [the magistrate] cannot annul and dissolve canons: but some greater kingly power is due to the king in the case of the Church’s aberring, than in the case of the Church’s right administration; and as our divines do justly give to the prince an extraordinary kingly power in the case of universal apostasy of the Church, as Jehoshaphat, Hezekiah, Josiah, and other worthy reformers in the Church of the Jews, did warrantably use their kingly power, when the Church-men were corrupted and negligent in their duty; so in a particular case of a particular error of the synod, the king as king, may use his kingly power in this fact, that is, secundum quid extraordinarie [according to that which you must do extraordinarily], for the king is obliged as king to add his accumulative power of a civil sanction to all just and necessary Church constitutions, and if the canon or Church constitution be wicked and popish, he is obliged to deny his civil sanction, and not that only, (for he that is not with Christ is against him) but he is to employ his kingly power against such canons, and so is to deliver the Church of God in that, and in denying his accumulative power to unjust canons, he adds his kingly power accumulative to the true Church, in saving them from these unjust canons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), Pt. 2, pp. 412-414</span></figcaption>

y use his kingly power in this fact, that is, secundum quid extraordinarie [according to that which you must do extraordinarily], for the king is obliged as king to add his accumulative power of a civil sanction to all just and necessary Church constitutions, and if the canon or Church constitution be wicked and popish, he is obliged to deny his civil sanction, and not that only, (for he that is not with Christ is against him) but he is to employ his kingly power against such canons, and so is to deliver the Church of God in that, and in denying his accumulative power to unjust canons, he adds his kingly power accumulative to the true Church, in saving them from these unjust canons.”

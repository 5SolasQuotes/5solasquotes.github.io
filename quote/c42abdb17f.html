<main class="wrap"><figure class="quote" id="q-c42abdb17f" data-kw="">
<blockquote><p>‘It comes sometime to pass’ (says St. Augustine) ‘that the children of bond-slaves are brought to baptism by their Lord; sometime the parents being dead, the friends alive undertake that office, sometime stangers or virgins consecrated unto God, which neither have, nor can have children of their own, take up infants in the open streets, and so offer them unto baptism, whom the cruelty of unnatural parents casts out, and leaves to the adventure of uncertain pity.’ As therefore he which did the part of a neighbor, was a neighbor to that wounded man whom the parable of the Gospel describes, so they are fathers, although strangers, that bring infants to him which makes them the sons of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Mr. Richard Hooker (that learned and judicious divine), in Eight Books of Ecclesiastical Polity… (London, 1666), bk.5, section 64, p. 244 Hooker (1554–1600) was a prominent Anglican apologist.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-2b3f2cfaf8" data-kw="">
<blockquote><p>But we do exclude from baptism the children of those who clearly are strangers to the covenant, such as the children of heathens, Muslims, Jews, and of similar people… And for this reason we should leave them–like foreigners–to the judgement of God… unless they happen through lawful adoption or through the just and properly-designated status of slaves to be enrolled and taken up into the families of believers as though belonging to them.† For in this case many Reformed churches do baptize those children, because they deem that God has adopted them into the fellowship of his covenant in this manner, that is to say by the covenant of Genesis 17:12-13, which in the early church was so far beyond debate that from it Augustine on several occasions deduced a powerful argument against the Pelagians for election by grace. [On the Grace of Christ &amp; on Original Sin 2.35 in NPNF1 5.249-50] † This is a remarkable position, given the fact that the Synod of Dort had decided negatively on the issue in response to a question from East-India if it was allowed to baptize a child from pagan parents adopted into a Christian family. At the synod, the professors and the delegates from Zeeland, Friesland and Utrecht did not object to baptism, together with the majority of foreign delegates, but the delegates from Holland and Gelderland objected because human adoption does not imply divine adoption. Adopted children first had to profess faith and only then could be baptized, though as infants they could be commended to God’s gracious care by the laying-on of hands. See Acta of the Synod of Dordt, eds. Donald Sinnema, Christian Moser, and Herman Selderhuis (Gottingen: Vandenhoeck &amp; Ruprecht), 30-32.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology (1625; Brill, 2020), vol. 2, Disputation 44, ‘On the Sacrament of Baptism’, section 49</cite>, p. 165</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

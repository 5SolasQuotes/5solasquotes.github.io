<main class="wrap"><figure class="quote" id="q-cf6d09d969" data-kw="">
<blockquote><p>We have always thought that the serious imperfections that are justly chargeable upon the most favourite uninspired hymns furnish a powerful argument against employing them in the Psalmody of the Church. The Inspired Psalms, as being the dictates of the Spirit of truth, are entirely free from error, and although, in some cases, we may be unable to discover the application of the figures, or the full import of the expressions, we cannot hesitate for a moment to declare, that in arrangement, expression, and design, the psalms are absolutely perfect. To say otherwise, as some modern hymn-makers have done, is to charge the Author of inspiration with imperfection, and to cast contempt on his best gift to our world. No such declaration, however, can, with propriety, be used in relation to those merely human compositions which have been introduced to rank with the Psalms of David, or, in many cases, to supplant them, in the praises of the Church. Select the most esteemed of them, and they will be found, either in matter, or style, or arrangement, to betray evident marks of human imperfection: in some instances, noxious error it diffused under the embellishments of poetry; in others, the style is turgid, abounding in puerile conceits or unnatural images, and forced expressions; while, in almost all, there is a wide departure from the unadorned simplicity and dignified gravity of the Words of the Holy One of Israel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Mar. 1837, p. 49</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-391e62f9e4" data-kw="">
<blockquote><p>Although we must not regard as the doctrine of the Reformed those which can by any method be deduced from their confessions and be imputed to them; nor as the opinion of the Lutherans that which may be inferred from their doctrine – it does not follow that we must not consider as the word of God that which may be lawfully and plainly deduced from it. The cases are entirely different. For the Holy Spirit (who searches the deep things of God as he is omniscient) could foresee and intend whatever it was possible to gather rightly from his words. But men (who are neither omniscient nor infallible) were unable to know what might in after times be deduced from their words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of elenctic theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), i, 42.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

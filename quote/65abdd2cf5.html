<blockquote><p>…we are in order to reflect on the nature of it [saving belief]. Which is indeed very closely, but significantly couched in the preposition… ’tis [Greek] believe and trust IN, or UPON the Lord Jesus. Believe at once his propensity and power to save thee. Believe his power, for he is Dominus, The Lord. And believe his propensity, for He is Jesus, the Savior.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7176c29a50" data-kw="">
<blockquote><p>Hence likewise we may collect how really and cheerfully willing Christ is to save sinners. Certainly, He that makes such bitter lamentation over the foreseen ruins of Jerusalem, must needs have a very cordial, and unfeigned will and desire of her salvation… What a pathetic expostulation is here, which carries in it notices of vehement affections? Oh! how willing is Christ to give unto sinners the things that belong unto their peace? Yea, is He not more willing to bestow great things than small? Does not his willingness to give, infinitely exceed the sinners’ willingness to receive? Is not Christ more glad to receive poor and weary souls, than they are to come unto Him?… Is not every thing about Christ mighty drawing, alluring, and inviting?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Tears for Jerusalem’s Unbelief &amp; Ruin, Now Humbly Recommended to England’s Consideration in this Her Day of Trial &amp; Danger</cite>, (1679) 254 pp., pp. 66-67</span></figcaption>

</figure><figure class="quote" id="q-c358548691" data-kw="">
<blockquote><p>3… The true resolution is that God wills all things on account of His own goodness, as the ultimate end and the first reason for willing all things. However, this does not exclude that, in willing, He attends to the greater or lesser goodness in the things themselves, for from this arises also the greater or lesser fittingness of acting or willing, even on account of His own goodness. And the fact that God operates all things for Himself does not prevent Him from pursuing rational creatures with true love of benevolence and friendship. For they are capable of such love, and it befits the divine goodness to love them thus. Also, because He does not love them for His own utility or advantage, but for their own good. That this good of theirs is ordered to the glory of God as the ultimate end by God Himself is not contrary to the nature of friendship, for this does not exclude the due order to God or to the ultimate end. But God loves lower creatures with the love of concupiscence, because He wills all of them for the advantage and utility of rational creatures, and irrational beings are not capable of greater love. This is clear from Aristotle (Ethics VIII, ch. 2), St. Thomas (I, q. 20, a. 2, ad 3 and 4; Contra Gentiles, ch. 19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-suarez.html">Francis Suarez</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Thomas, pt. 1, On the Divine Substance &amp; its Attributes, pp. 505-6 tr. AI in All the Works (d. 1617; Paris: Vives, 1855), vol. 1 Latin Suarez was a major Jesuit theologian.</span></figcaption>

</figure><figure class="quote" id="q-879366644a" data-kw="">
<blockquote><p>If God’s love is known by what it hates, it is also known by what it loves or inclines toward. First, in a sense, it extends to all creatures. All creatures have some good from God.136 Even the wicked share in this benevolence. “God is kind to the unthankful and evil.”137 Man is now naturally contrary to God and positively evil, but the Luke 6:35 sermon shows that God still loves him in some ways. Indeed, Edwards goes on to say in another sermon: “even in damnation.”138 Yet, fundamentally, “holy persons love holy things for their holiness.”139 136. Unpublished MS sermon on Ps. 145:15–21, “All creatures in heaven and earth have their good things from God,” p. 1, St. Ind., Nov. 1, 1753. 137. Unpublished MS sermon on Lk. 6:35. 138. Unpublished MS sermon on Eph. 4:15–16, “In a company of Christians among whom Christianity has its genuine effect, love is the beginning and love is the middle and love is the end of all their affairs,” p. 2, May 1743. 139. Unpublished MS sermons on Ps. 119:[1]40.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rational Biblical Theology of Jonathan Edwards</cite>, 3 vols. (Powhatan, VA: Berea Publications; Orlando, FL: Ligonier Ministries, 1993), vol. 2, p. 38</span></figcaption>

<blockquote><p>…and if it be asked, what may be imported by this speech properly? We answer, ‘O that my people had hearkened unto Me, etc.’ [Ps. 81:13] shows these six things: … 4. Fourthly, that God delights not in the death or destruction of his people, but that they should repent and live. … 6. Sixthly, that God requires a suitable meeting of his people to his dispensations, that is, that they may be so willing to hearken to his voice, and so loath to offend Him, as He does manifest by Word and works his willingness to save them and his loathness to destroy them. From the Lord’s lamenting, learn further: … 3. He who hears God uttering his wishes for the conversion of His people and lamenting that His Word is not believed, and that his offer of grace is not received, does give God an evil meeting and neither believes God’s goodness, nor cares for his own salvation, except he join with God lamenting his own misbelief in time past, and do with heartily the same with God for his own conversion for time to come;</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…and if it be asked, what may be imported by this speech properly? We answer, ‘O that my people had hearkened unto Me, etc.’ [Ps. 81:13] shows these six things: … 4. Fourthly, that God delights not in the death or destruction of his people, but that they should repent and live. … 6. Sixthly, that God requires a suitable meeting of his people to his dispensations, that is, that they may be so willing to hearken to his voice, and so loath to offend Him, as He does manifest by Word and works his willingness to save them and his loathness to destroy them. From the Lord’s lamenting, learn further: … 3. He who hears God uttering his wishes for the conversion of His people and lamenting that His Word is not believed, and that his offer of grace is not received, does give God an evil meeting and neither believes God’s goodness, nor cares for his own salvation, except he join with God lamenting his own misbelief in time past, and do with heartily the same with God for his own conversion for time to come;”

<blockquote><p>The Lord God said, or, had said, to wit, upon the sixth day, on which the woman was made, Genesis i. 27-28. Not good; not convenient either for my purpose of the increase of mankind, or for man’s personal comfort, or for the propagation of his kind. Meet for him; a most emphatical phrase, signifying thus much, one correspondent to him, suitable both to his nature and necessity, one altogether like to him in shape and constitution, disposition and affection; a second self; or one to be at hand and near to him, to stand continually before him, familiarly to converse with him, to be always ready to succour, serve, and comfort him; or one whose eye, respect, and care, as well as desire, Genesis iii. 16, should be to him, whose business it shall be to please and help him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Holy Bible</cite>, (1685; 3 vols, London: Banner of Truth, 1962), 1: 7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>13. …There is all in God that is good, and perfect, and excellent in our desires and wishes for the conversion and salvation of wicked men. As, for instance, there is a love to holiness, absolutely considered, or an agreeableness of holiness to his nature and will; or, in other words, to his natural inclination. The holiness and happiness of the creature, absolutely considered, are things that he loves. These things are infinitely more agreeable to his nature than to ours. There is all in God that belongs to our desire of the holiness and happiness of unconverted men and reprobates, excepting what implies imperfection. All that is consistent with infinite knowledge, wisdom, power, self-sufficience, infinite happiness, and immutability. Therefore, there is no reason that his absolute prescience, or his wise determination and ordering what is future, should hinder his expressing this disposition of his nature, in like manner as we are wont to express such a disposition in ourselves, viz. by calls and invitations, and the like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Remarks on Important Theological Controversies</cite>, ch. 3, “Concerning the Divine Decrees in General, &amp; Election in Particular,” from paragraphs 9 &amp; 13, in The Works of Jonathan Edwards, ed. Edward Hickman (†1758), vol. 2, pp. 527-28 and in Select Works (Banner of Truth), 2:528</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

ref="../quote/ae9b64812a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=There%20is%20all%20in%20God%20that,calls%20and%20invitations%2C%20and%20the%20like&amp;text=There%20is%20all%20in%20God%20that%20is%20good&amp;text=viz.%20by%20calls%20and%20invitations%2C%20and%20the%20like" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7e2eae3479" data-kw="">
<blockquote><p>Nor is it sufficient to say, in the third place, that the relation is that of suretyship and substitution. This undoubtedly is a great step in advance. Only let the ground thus taken up be secured. Let the inquiry be pressed to the uttermost; let it be exhausted.

All truly scientific investigation searches on and on, till it arrives at somewhat of which no further explanation can be given or is required. Theology as a science meets this canon, and then claims a right to rest. Let us then still inquire.

Christ undertakes the work of Calvary, the death of the cross, for His people, because He stands towards them in the relation of a surety — a surety on their behalf to the offended Lawgiver and Judge. Be it so: but what shall justify His occupying that relation? What renders it fit, proper, righteous, that He should be accepted as standing in that relation towards them, and in that relation suffering for them? To this also it is not difficult to reply. He is their surety, because He is their substitute. He acts on their behalf, because He stands in their room. One only question now remains; and there can be no possibility, as there should be no inducement, to evade it. The relation of a substitute justifies the suretyship; what shall justify the substitution?

It is to this at last that the question must really be narrowed. The exact hinge and whole stress of the inquiry is here. And we can attain no satisfaction on this point, no sufficient answer to this question, and therefore no satisfactory conclusion to our whole line of investigation, till the doctrine of the everlasting Covenant oneness comes into view. That is the great underlying relation. That is the grand primary conjunction between the Redeemer and the redeemed, which alone bears up, and justifies, and accounts for all else in respect of relation which can be predicated as true concerning them. “Both He that sanctifieth and they that are sanctified are All Of One: for Which cause He is not ashamed to call them brethren” (Heb. ii. 11).

His substitution is a good reason for His suretyship. Covenant oneness is, if possible, a still better reason for His substitution. For now is the vicariousness of His sacrifice not merely brought to light, but vindicated. It is not merely true that He suffers for us; it is also true that we suffer in Him. And the latter of these propositions justifies the truth and righteousness of the former. He is substituted for us, because He is one With us —identified with us, and we with Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Atonement: In its Relations to the Covenant, the Priesthood, the Intercession of our Lord</cite>, (London: James Nisbet &amp; Co., 1870), pp 34-35.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-f9eaa7a495" data-kw="">
<blockquote><p>Grace is not born in us. … Even the children of saints are born in sin. Grace doth not run in the blood. Inherent holiness is not propagated, which yet doth not impede the propagation of federal holiness. Though the seed of believers are born polluted it doth not therefore follow that they are not born privileged. David who acknowledgeth the corruption his mother bore him in (Ps. 51:5) yet pleads the privilege his mother bore him to (Ps. 116:16, the son of thy handmaiden; so Ps. 86:16). Though a wise man do not beget a wise man, yet a freeman begets a freeman. I was born free, saith Paul.

We are all born diseased and impotent, but being born of believers we are born by the pool-side, not always under the internal but always under the external administration of the covenant. Israel as the seed of Abraham were transgressors from the womb, but as the seed of Abraham, to them pertained the adoption (Rom. 9:4). Those who will not admit this blessing of Abraham to come upon the Gentiles must expunge it out of their Bibles (Gal. 3:7, 14; Acts 2:39).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the Covenant of Grace</cite>, ed. Allan Harman (1692; Fearn: Christian Focus, 2002), pp 139-40.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>And such a hope ought especially to encourage us to repent, for we see that God is ready to receive us and seeks reconciliation with us, and is always prepared to forgive all our sins, provided we from the heart return to Him; and He seems as one unwilling to inflict punishment.</p></blockquote>

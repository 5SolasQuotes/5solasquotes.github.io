<main class="wrap"><figure class="quote" id="q-b08aff16c7" data-kw="">
<blockquote><p>Every Jewish city of any repute had its council, which sat in the chief synagogue of the city; and as in the Jewish polity, church and state were not only intimately united, but were, in fact, identical;[1] this council had supreme authority in all matters, whether ecclesiastical or civil. Each council had its President or Patriarch. Its members were styled Presbyters, or Elders. …

Maimonides, in his treatise on fasting, sets before us the same form of government. Whenever there is a fast for rain, “the ark is brought out into the street; the assembled people cover themselves with sackcloth, and scatter ashes on the ark, and on the book of the law: then one of the congregation takes some of the ashes, and sprinkles them on the head of the President. The ark is then placed in the midst; and, all sitting down, some Rabbi of the Elders stands up to read, &amp;c.” This quotation from Maimonides exhibits the form of government above described; viz. a council, consisting of members called Elders, and a President, the head of this council.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/campegius-vitringa.html">Campegius Vitringa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Synagogue and the Church, being an attempt to show, that the Government, Ministers, and Services of the Church, were derived from those of the Synagogue</cite>, trans. and ed. Joshua L. Bernard (1685; London: B. Fellowes, 1842), pp 53-54, 55-56.</span></figcaption>

<blockquote><p>In Scripture the term bishop signifies exactly the same thing as elder, whether he is only an elder or even a pastor. I will strive to confirm this from several testimonies of sacred Scripture brought forth into our midst. Titus 1:5 says, “For the sake of this matter, remain in Crete, so that you may proceed to set in order what remains there, and establish elders town-by-town.” Then, describing what sort of men they should be, he says, “it is necessary that an elder be blameless,” et cetera. In Acts 20:17ff. Paul is said to have summoned to Miletus Ephesian elders, whom he then addresses in this way: “Attend to yourselves and to the whole flock, for which the Holy Spirit has established you as elders.” Note there in passing that it is not said that they are elders because they preside over the presbytery, but because they preside over their flock.

Philippians 1:1 says, “Paul and Timothy, servants of Jesus Christ to all the saints in Christ Jesus who are at Philippi, together with the elders and deacons.” He calls bishops elders. Indeed, Chrysostom, writing on this passage, says, “What belongs to the matter of whether there were bishops of the same city? It is not,” he says, “but that those who were then elders, the same were bishops.” In 1 Peter 5:2 Peter, compelling elders, says, “Feed the flock which is in your possession, elders [ἐπισκοποῦντες].” Finally, in this passage Paul, recounting all the orders of the ministers of the Word, says nothing about bishops as different from pastors. And Ambrose observed that when he wrote on this passage. He says, “the writings of the apostle do not agree in all ways with the ordering of the church which exists now.”

What is more, no Scripture speaks or means otherwise about bishops. And daily experience teaches that this kind of men, who are ambitious and enslaved to their stomach, make shipwreck of their conscience. The antichrist introduced the origin from this foundation and human invention, as it were, which God never blessed in His Word. They appoint the bishop as overseer over the presbytery for the sake of removing schism. But is it the case that I may say nothing from contrary experience, which Gregory of Nazianzus says to this response in Oratio in Maxim? He says, “Would that there may be no prerogative of a throne! But now this right side and left and middle, superior and inferior seats and that imported custom of going before or of coming over the same rank have broken us into many parts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, trans. Casey B. Carmichael, Classic Reformed Theology, vol. 5 (1593; Kindle edn, Grand Rapids MI: Reformation Heritage Books, 2021), Kindle Locations 2901-2919.</span></figcaption>

<blockquote><p>28. We have, therefore, a most excellent and sure mark to distinguish… the legitimate observances of the Church, if we remember that one of two things, or both together, are always intended, viz., that in the sacred assembly of the faithful, all things may be done decently, and with becoming dignity, and that human society may be maintained. In order by certain bonds, as It were, of moderation and humanity… since nothing here is sought but the maintenance of charity by a common office… 30. …the whole sum of righteousness, and all the parts of divine worship, and everything necessary to salvation, the Lord has faithfully comprehended, and clearly unfolded, in his sacred oracles, so that in them He alone is the only Master to be heard. But as in external discipline and ceremonies [he used as an example bowing in prayer], he has not been pleased to prescribe every particular that we ought to observe, (he foresaw that this depended on the nature of the times, and that one form would not suit all ages, in them we must have recourse to the general rules which he has given, employing them to test whatever the necessity of the Church may require to be enjoined for order and decency. Lastly, as he has not delivered any express command, because things of this nature are not necessary to salvation, and, for the edification of the Church, should be accommodated to the varying circumstances of each age and nation, it will be proper, as the interest of the Church may require, to change and abrogate the old, as well as to introduce new forms. I confess, indeed, that we are not to innovate rashly or incessantly, or for trivial causes. Charity is the best judge of what tends to hurt or to edify: if we allow her to be guide, all things will be safe. 31. Things which have been appointed according to this rule, it is the duty of the Christian people to observe with a free conscience indeed, and without superstition, but also with a pious and ready inclination to obey…</p></blockquote>

<blockquote><p>The common opinion, however, among Protestants is, that the prophecies concerning Antichrist have special reference to the papacy. This conviction is founded in Paul’s second epistle to the Thessalonians. … The first question, to be determined in the interpretation of this prophecy, is, Whether Antichrist is a particular individual, or an institution, a power, or a corporation. Protestants generally adopt the latter view; because they do not regard any one pope, but the papacy, as the Antichrist of Scripture. In favour of this view it may be urged, (1.) That it is according to the analogy of prophecy to speak of nations, institutions, or kingdoms, as individuals. In Daniel, the ten kings are ten kingdoms or dynasties; the several beasts which he saw in vision, were not the symbols of particular men, but of nations. When therefore the Apostle speaks of Antichrist as “the man of sin,” and “the son of perdition,” it is perfectly consistent with Scriptural usage to understand him to refer to an order of men, or to an institution.

(2.) The work assigned to Antichrist in prophecy, extends over far too long a period to be accomplished by one man. (3.) Those who insist that the antichrist here predicted, is an individual man, are forced to admit that what is said in 2 Thessalonians ii. 7 (“He who now letteth, will let, until he be taken out of the way”) is to be understood of a power. It is generally understood of the Roman power. Luthardt understands it of the moral power which sustains the right, and therefore is opposed to the reckless disregard of all law, which is one of the characteristics of Antichrist. It is true that he supposes that reference is also made to one of the guardian or protecting angels spoken of by the prophet Daniel. But such an angel is not to be “taken out of the way.” And there is nothing in the context or in Paul’s writings anywhere to justify the assumption that reference is here had to any angelic personage.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-22f8a9feea" data-kw="">
<blockquote><p>Regeneration (says Dr. [William] Twisse) is to be preferred before salvation, the one [is] a translation from the state of nature into the state of grace; the other is only a translation from the state of grace into the state of glory. By the one we are made the sons of God; by the other we only obtain the inheritance of the sons of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), bk. 7, ch. 2, ‘Of Effectual Vocation’, p. 490</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e5e27610a2" data-kw="">
<blockquote><p>In the conversion of a man there is no concurrence of the powers of free arbitrium. But at the first moment of it man and his will act in a purely passive state. Here we are speaking of the first impulse and moment of conversion, or the first beginning of this movement, in which acknowledging his sins man turns to God. And this first beginning, we assert, does not depend on the natural strength of the will, but is the beginning of grace alone, according to the express testimonies of Scripture, Col. 2:13 (and you being dead through your trespasses and the uncircumcision of your flesh, you, I say, he did quicken together with him, having forgiven us all our tresspasses), where it is said that men are dead in sins… Yet at the very moment in which God effects in us the grace of conversion He also bends man’s will to desire and seek for that grace, and so in the progress of conversion the will co-operates with divine grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bartholomaus-keckermann.html">Bartholomaus Keckermann</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as translated in Heinrich Heppe, Reformed Dogmatics</cite>, ed. Bizer, trans. Thomson (d. 1609; 1950; Wipf &amp; Stock, 2007), ch. 20, ‘Calling’, section 20, pp. 520-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>
<div class="actions"><button class="copy" data-copy="“In the conversion of a man there is no concurrence of the powers of free arbitrium. But at the first moment of it man and his will act in a purely passive state. Here we are speaking of the first impulse and moment of conversion, or the first beginning of this movement, in which acknowledging his sins man turns to God. And this first beginning, we assert, does not depend on the natural strength of the will, but is the beginning of grace alone, according to the express testimonies of Scripture, Col. 2:13 (and you being dead through your trespasses and the uncircumcision of your flesh, you, I say, he did quicken together with him, having forgiven us all our tresspasses), where it is said that men are dead in sins… Yet at the very moment in which God effects in us the grace of conversion He also bends man’s will to desire and seek for that grace, and so in the progress of conversion the will co-operates with divine grace.”

0is&amp;text=of%20conversion%20the%20will%20co%2Doperates%20with%20divine%20grace" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-34237a9c9e" data-kw="">
<blockquote><p>§XII. Conversion is distinguished into first conversion, which is the action of God alone and the giving of new life; and second conversion, which is the act of man gladly accepting virtue and fleeing sin after he has been regenerated by the Spirit (Lam. 5:21; Song of Sol. 1:4). … Controversy 3 – Is man in the first act of regeneration merely passive? We affirm against the Socinians and the Arminians.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-716fae5111" data-kw="">
<blockquote><p>These things cannot occur until we have been justified by faith, and, regenerated, we receive the Holy Ghost: first, because the Law cannot be kept without [the knowledge of] Christ; and likewise the Law cannot be kept without the Holy Ghost. But the Holy Ghost is received by faith, according to the declaration of Paul, Gal. 3:14, ‘That we might receive the promise of the Spirit through faith.’ … Wherefore, when Paul says, Rom. 3:31, ‘We establish the Law through faith,’ by this we ought to understand, not only that those regenerated by faith receive the Holy Ghost, and have movements agreeing with God’s Law, but it is by far of the greatest importance that we add also this, that we ought to perceive that we are far distant from the perfection of the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apology of the Augsburg Confession</cite>, Trans. F. Bente &amp; W. H. T. Dau (1531; Project Gutenberg, 2004) | pt. 6, Article 3, Of Love and the Fulfilling of the Law</span></figcaption>

<main class="wrap"><figure class="quote" id="q-1c4891c8bd" data-kw="">
<blockquote><p>We do in the very first article of our Agreement [of Baxter’s Chuch-Association] disclaim a present engaging ourselves for any party, as such: or against any… we only desire a unanimous agreement in practice, so far as we are already agreed in judgment, that our discord or strangeness may neither hinder our further edification, nor yet deprive the Church of God’s ordinances, or of the beauty, strength and other benefits of union.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653) | ‘Objections Answered’, p. 74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ab1ce17cc0" data-kw="">
<blockquote><p>For there be some errors in light things, not fundamental in religion, upon which a separation may happen, by the pride and pertinacy of some pastors, even of them that are orthodox: As the error of the Quartadecimani, who celebrated the feast of Easter precisely upon the fourteenth day of the moon of March; for which cause Victor, bishop of Rome, separated himself from their communion; wherein, although the error was on their side, yet the schism was on Victor’s side, and he was more guilty than they… For no doubt but that such separations commonly happen by the ambition of the pastors that lead the people, who groan under that yoke, and desire concord, grieving for the separation. Yea it may happen that both the Churches that forsake their mutual communion are both in the wrong. It may happen also, that the party that hath the truth on his side, is cause of the schism, by the harshness, or ambition, or want of charity of them that govern. As when two brothers are quarrelling, they are brothers nevertheless: So it is possible that two dissenting churches will be nevertheless members of the same body, in God’s account, whose wisdom is not obnoxious to our violence… I could wish also that a man should not be pronounced an heretic that is ignorant of some article of Faith by a simple and negative ignorance, such as is that of infants; not by an obstinate ignorance, which arms itself with reasons against the truth. Thus the apostles were at first ignorant of the resurrection, and were not heretics for that. I wish also that an error be not presently called an heresy, when it is about a light thing, not about the fundamentals of Faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery, Opposed to the Antiquity of True Christianity</cite>, … (London: White, 1662), bk. 1, ch. 7, pp. 14-15</span></figcaption>

</figure><figure class="quote" id="q-096963ca8c" data-kw="">
<blockquote><p>In this context researchers differentiate the colloquies on inaugurating reform in the early years of the Reformation (which were to prepare for the secular government’s decision to introduce new teaching and ecclesiastical practice or to legitimize such a decision) from the later religious dialogues that ideally aimed at a convergence of two religious parties. Contemporaries hardly noticed this difference… Despite all the parallels with the medieval process of disputation, sixteenth-century religious colloquies differed from the academic model at essential points… The representatives of the Reformation decisively rejected the syllogism of Scholasticism as a relevant structure for argumentation for determining theological truth and untruth. A hermeneutic based upon and drawn from Holy Scripture was to govern the establishing of the truth, not arguments based on major and minor premises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/irene-dingel.html">Irene Dingel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 19, ‘Christian Ecumenical Efforts’ in eds. Appold &amp; Minnich, The Cambridge History of Reformation Era Theology (Cambridge University Press, 2023), pp. 372-84, p. 373</span></figcaption>

r%20premises" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5a18007793" data-kw="">
<blockquote><p>Important religious colloquies were also held beyond the borders of the Holy Roman Empire, extending beyond regional dialogues. The Colloquy of Poissy in France and the “Colloquium Charitativum” of Thorn in Poland are among the most well known, but there were more.</p></blockquote>

</figure><figure class="quote" id="q-15e78e36c0" data-kw="">
<blockquote><p>Conclusion 2. That a real and approved holiness is a sure-note that the error which they hold is not a damning, destroying error. I say, though the holiness of those men that maintain an opinion, be not a sure note that the opinion they maintain is a truth, yet it is a certain evidence that it is not an undoing and destructive error. Christ says that the elect shall not be deceived, Mt. 24:24, that is, though they may be carried aside with some sinful, yet they shall not be drawn away with undoing errors. And we have all the harmony of Scripture for that: He tells us that they who do his will, shall know his doctrine, that we shall all be taught of God, that we shall hear his voice, and shall not follow the voice of strangers, and that we have received an anointing of the holy One, whereby we know all things. All which places are to be understood of necessary truths, not accessory; of truths that are essential and fundamental, not circumstantial: and it proves fully to us that God will never give up his holy ones to undoing errors. That’s the second answer; that holiness is a sure note, that the opinions which they hold (though an error) yet it is not a damning and destroying error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, ... (1646), p. 166</span></figcaption>

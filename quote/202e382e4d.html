<main class="wrap"><figure class="quote" id="q-202e382e4d" data-kw="">
<blockquote><p>Adhere constantly and honestly to the Covenanted Principles of the Church of Scotland, and to that Testimony which has been lifted up for them. I fear a generation is rising up which will endeavour silently to let slip these matters, as if they were ashamed to hold them fast, or even to speak of them. May the Lord forbid that any of you should enter into this confederacy against Jesus Christ and his cause! This from a dying father and minister, and a witness for Christ.

(Signed) JOHN BROWN</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown.html">John Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The absurdity and perfidy of all authoritative toleration of gross heresy, blasphemy, idolatry, popery, in Britain. In two letters to a friend. In which the doctrine of the Westminster Confession of Faith relative to toleration of a false religion, and the power of the civil magistrate about sacred </cite>, (1780; Glasgow, 1803), xix.</span></figcaption>

</figure><figure class="quote" id="q-3235a6afdb" data-kw="">
<blockquote><p>After the defeat [of Argyle’s expedition, 1685], two of the ministers who came over with Argyle’s party sought to join with the Society. The Society rejected them because they had left the country during a time of need, joined with Indulged ministers in worship, spoken out against the Society, associated with Argyle’s expedition, and had not supported [Donald] Cargill and [Richard] Cameron. In their defense, the two ministers compared their associations abroad with Renwick’s foreign ordination and expressed concerns regarding the Society’s testimonies and declarations. The two ministers would not abstain from fellowship with the Indulged, but ‘declared their willingness to lay things in present controversy aside, until they should be determined by a competent judicatory [which the Society People were not].’ (Shields, Faithful Contendings, pp. 168-182) The Society members, finding these terms unacceptable, decided not to join with these two ministers. Some left with the two ministers resulting in yet another painful division. (Ibid., 169)… [Patrick] Walker also listed James Nisbet as one who could attest to the conflicts that took place among the Society members during this time. James memoir describes how he saw first hand the divisions that resulted from the Argyle affair: ‘But, alas! I got my comforts a little lowered this day upon the reason following: There came to that meeting some of the worthy gentlemen who came home this year with the Earl of Argyle on his expedition; they and some other of our Christian friends looked shy and cold upon one another upon the account of some difference in judgment and opinion that was among them. [This] was matter of sorrow of heart to me now, but much more so afterwards, when I saw the woeful consequences thereof; for I quickly observed that these differences of opinion occasioned much alienation of affection, even among those who were otherwise truly religious. Likewise, it served much to eat out the vitals of religion in the waste of much precious time, which was spent in debating and contending, which might otherwise have been very usefully spent in seeking after and in pursuit of the one thing needful, the better part, which could not have been taken from them.’ (Nisbet, Private Life, pp. 114-15)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-nisbet-moore.html">Edwin Nisbet Moore</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Covenant Heritage</cite>, (2000) Moore is very sympathetic with the Cameronians., p. 117</span></figcaption>

</figure><figure class="quote" id="q-37debbfd3e" data-kw="">
<blockquote><p>The Pharises were rigid separatists and quarrelled with Christ because He would not separate, but was a friend to publicans and sinners, Lk. 15:27-28. They pretend they abhor a mixed company, and yet they revile and fly from real saints. They are all for gathering churches out of churches, which is the very way to destroy churches. How do we destroy houses but by pulling one stone and one piece from another?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical &amp; Polemical Commentary, Or Exposition upon 2 Tim. 3-4</cite>, section 18, ‘They Separate Themselves from the True Churches of Christ’ in ch. 7, ‘Of the Peculiar Manner &amp; Form of Speech used by the Quintinists (i.e. a pack of Libertines then living)’ in A Practical &amp; Polemical Commentary, or, Exposition upon the Third &amp; Fourth Chapters of the Latter Epistle of Saint Paul to Timothy… (London, 1658), on 2 Tim. 3:8, pp. 166-67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

%20piece%20from%20another" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The second distinction is, between congregations ‘which have a competent and well-qualified eldership, and small congregations, who have but few office-bearers, and those, it may be, not sufficiently able for church government. In this case of insufficiency, a congregation may not independently, by itself, exercise jurisdiction, and not in re propis,” says Parker.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

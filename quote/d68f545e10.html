<main class="wrap"><figure class="quote" id="q-d68f545e10" data-kw="">
<blockquote><p>1. Now we can clearly see from what has already been said that all men adopted by God into the company of his people since the beginning of the world were covenanted to him by the same law and by the bond of the same doctrine as obtains among us. It is very important to make this point.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, Institutes Christian Religion, ed. John T. McNeill, tr. Ford Lewis Battles in The Library of Christian Classics, vol. 20 (Philadelphia: Westminster Press, 1960), vol. 1 | ch. 10, ‘The Similarity of the Old &amp; New Testaments’, p. 428, bk. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“1. Now we can clearly see from what has already been said that all men adopted by God into the company of his people since the beginning of the world were covenanted to him by the same law and by the bond of the same doctrine as obtains among us. It is very important to make this point.”

— John Calvin, Institutes Christian Religion, ed. John T. McNeill, tr. Ford Lewis Battles in The Library of Christian Classics, vol. 20 (Philadelphia: Westminster Press, 1960), vol. 1 | ch. 10, ‘The Similarity of the Old &amp; New Testaments’, p. 428, bk. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Now+we+can+clearly+see+from+what+has+already+been+said+that+all+men+adopted+by+God+into+the+company+of+his+people+since+the+beginning+of+the+world+were+covenanted+to+him+by+the+same+law+and+by+the+bond+of+the+same+doctrine+as+obtains+among+us.+It+is+very+important+to+make+this+point.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+Christian+Religion%2C+ed.+John+T.+McNeill%2C+tr.+Ford+Lewis+Battles+in+The+Library+of+Christian+Classics%2C+vol.+20+%28Philadelphia%3A+Westminster+Press%2C+1960%29%2C+vol.+1+%7C+ch.+10%2C+%E2%80%98The+Similarity+of+the+Old+%26+New+Testaments%E2%80%99%2C+p.+428%2C+bk.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd68f545e10.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d68f545e10.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=1.%20Now%20we%20can%20clearly%20see,very%20important%20to%20make%20this%20point&amp;text=1.%20Now%20we%20can%20clearly%20see%20from%20what&amp;text=It%20is%20very%20important%20to%20make%20this%20point" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-22c42f5a25" data-kw="">
<blockquote><p>All those other individuals, however, who have attempted or dared to offer a written record of the acts of the Lord or of the apostles, failed to commend themselves in their own times as men of the character which would induce the Church to yield them its confidence, and to admit their compositions to the canonical authority of the Holy Books. And this was the case not merely because they were persons who could make no rightful claim to have credit given them in their narrations, but also because in a deceitful manner they introduced into their writings certain matters which are condemned at once by the catholic and apostolic rule of faith, and by sound doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>NPNF1</cite>, The Harmony of the Gospels, bk. 1, ch. 1, p. 78, vol. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-db801550a1" data-kw="">
<blockquote><p>Classis Walcheren in Zeeland [in 1574] drafted the earliest form of subscription used by ministers: ‘We the undersigned ministers of the Word of God, within these islands of Walcheren, do hereby believe and confess that the written [Belgic] Confession of Faith of the Christian churches of the Netherlands, lying under Spanish rule, contained in 37 articles and printed again in the year 1573 at Dordrecht, conforms (ghelijkformigh is) in all parts to the Word of God. And so we promise to orient our doctrine and worship to it, in our teaching, consolation, and admonition, and to oppose what conflicts with it, according to our abilities.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands.html">Donald Sinnema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Origin of the Form of Subscription in the Dutch Reformed Tradition” in Calvin Theological Journal</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“Classis Walcheren in Zeeland [in 1574] drafted the earliest form of subscription used by ministers: ‘We the undersigned ministers of the Word of God, within these islands of Walcheren, do hereby believe and confess that the written [Belgic] Confession of Faith of the Christian churches of the Netherlands, lying under Spanish rule, contained in 37 articles and printed again in the year 1573 at Dordrecht, conforms (ghelijkformigh is) in all parts to the Word of God. And so we promise to orient our doctrine and worship to it, in our teaching, consolation, and admonition, and to oppose what conflicts with it, according to our abilities.&#x27;”

— Netherlands, Donald Sinnema, “The Origin of the Form of Subscription in the Dutch Reformed Tradition” in Calvin Theological Journal (July 2007), p. 260">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CClassis+Walcheren+in+Zeeland+%5Bin+1574%5D+drafted+the+earliest+form+of+subscription+used+by+ministers%3A+%E2%80%98We+the+undersigned+ministers+of+the+Word+of+God%2C+within+these+islands+of+Walcheren%2C+do+hereby+believe+and+confess+that+the+written+%5BBelgic%5D+Confession+of+Faith+of+the+Christian+churches+of+the+Netherlands%2C+lying+under+Spanish+rule%2C+contained+in+37+articles+and+printed+again+in+the+year+1573+at+Dordrecht%2C+conforms+%28ghelijkformigh+is%29+in+all+parts+to+the+Word+of+God.+And+so+we+promise+to+orient+our+doctrine+and+worship+to+it%2C+in+our+teaching%2C+consolation%2C+and+admonition%2C+and+to+oppose+what+conflicts+with+it%2C+according+to+our+abilities.%27%E2%80%9D%0A%0A%E2%80%94+Netherlands%2C+Donald+Sinnema%2C+%E2%80%9CThe+Origin+of+the+Form+of+Subscription+in+the+Dutch+Reformed+Tradition%E2%80%9D+in+Calvin+Theological+Journal+%28July+2007%29%2C+p.+260&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdb801550a1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/db801550a1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=Classis%20Walcheren%20in%20Zeeland%20%5Bin%201574,with%20it%2C%20according%20to%20our%20abilities&amp;text=Classis%20Walcheren%20in%20Zeeland%20%5Bin%201574%5D%20drafted%20the&amp;text=what%20conflicts%20with%20it%2C%20according%20to%20our%20abilities" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-932238d719" data-kw="">
<blockquote><p>Seing that we and our household have subscribed, and given this public confession of our faith, to the good example of our subjects, we command and charge all commissioners and ministers to crave the same confession of their parishoners, and proceed against the refusers [i.e. commissioners and ministers] according to our laws, and order of the Kirk; delivering their names and lawful process to the ministers of our house, with all haste and diligence, under the pain of fourty pound, to be taken from their stipends; that we, with advice of our counsel, may take order with such proud contemners of God and our laws. Subscribed with our hand, at Holyroodhouse, the second day of March, 1580 (now 1581), the 14th year of our reign.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Kirk of Scotland (ed. Thomas Thomson, Wodrow Society, 1843)</cite>, vol. 3, pp. 501-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“Seing that we and our household have subscribed, and given this public confession of our faith, to the good example of our subjects, we command and charge all commissioners and ministers to crave the same confession of their parishoners, and proceed against the refusers [i.e. commissioners and ministers] according to our laws, and order of the Kirk; delivering their names and lawful process to the ministers of our house, with all haste and diligence, under the pain of fourty pound, to be taken from their stipends; that we, with advice of our counsel, may take order with such proud contemners of God and our laws. Subscribed with our hand, at Holyroodhouse, the second day of March, 1580 (now 1581), the 14th year of our reign.”

ave%20subscribed&amp;text=now%201581%29%2C%20the%2014th%20year%20of%20our%20reign" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2d24026d79" data-kw="">
<blockquote><p>For matter of imposing-upon, I am not guitly. In the [Westminster] Assembly, I gave my vote with others; that the Confession of Faith, put out by authority, should not be required to be subscribed to, we having been burnt in the hand in that kind before: but so as not to be publicly preached or written against; which indeed is contrary to that ‘liberty of prophesying’ which some so call for…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-tuckney.html">Anthony Tuckney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Moral &amp; Religious Aphorisms collected from the Manuscript Papers of the Reverend &amp; Learned Doctor Whichcote... ed. Samuel Salter (London: Payne, 1753), 3rd Letter, pp. 76-77 Tuckney (d. 1670) was a Westminster divine. For context to this quote, see Leith, p. 104.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

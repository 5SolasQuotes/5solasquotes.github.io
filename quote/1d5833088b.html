<main class="wrap"><figure class="quote" id="q-1d5833088b" data-kw="">
<blockquote><p>Let us take notice, then, that in excommunicating this limitation be observed — that this part of discipline be exercised by the common counsel of the elders, and with the consent of the people, and that this is a remedy in opposition to tyranny. For nothing is more at variance with the discipline of Christ than tyranny, for which you open a wide door, if you give one man the entire power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 5, v. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2ea1e4dea4" data-kw="">
<blockquote><p>4. …it is sure [that] baptism in fieri, as it is administrate[d] and professed, is the means of the excommunicate[d] man’s solemn installing and engaging to be a follower of Christ: and by the scandal that brings on excommunication, baptism as professed and as binding is so far hurt as the Covenant-baptismal is violated: and if the man be excommunicate[d] for apostasy, then it is disputable whether baptism be not quite undone.</p></blockquote>

</figure><figure class="quote" id="q-7a2bda26c7" data-kw="">
<blockquote><p>When the congregation is dissolved by persecution, the godly pastor [on the supposition of congregationalism] is cast out of his Master’s service by the nature of this [local-church] covenant [of the congregationalists], because he is faithful to Christ, and that by Christ Himself.</p></blockquote>

</figure><figure class="quote" id="q-6670386a33" data-kw="">
<blockquote><p>Our divines from Scripture make three degrees of excommunication:

1. A debarring from the Lord’s Supper, Mt. 5:24, but it is not indeed a delivering to Satan or excommunication: this is called the lesser excommunication.

2. A delivering to Satan, the greater excommunication, 1 Cor. 5:3-4, of this we speak here especially.

3. Maranatha in the Syriac, is an utter cursing till Christ’s Second Coming.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, Ch. 9, section 9, p. 283</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

</figure><figure class="quote" id="q-546308854b" data-kw="">
<blockquote><p>Therefore, he [the one that has been greater-excommunicated] is not altogether cut off from the Church, for delivering to Satan is medicinal, not vindictive, as the Great Excommunication is which is called Anathema Maranatha, which we cannot use but against such as have sinned the sin against the Holy Ghost, and is hardly discerned, and I would think such an one as Julian the Apostate should be debarred from the communion of the Word preached [unlike in greater-excommunication]. But these who are ordinarily excommunicated for contumacy and particular faults, and not for universal apostasy, are not altogether excluded from all brotherhood of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 273</span></figcaption>

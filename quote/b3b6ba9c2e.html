<blockquote><p>A Holy Commonwealth… is a candid confession as to why a conservative [congregationalist] Puritan fought for Parliament in the Civil War and gave his support to the Cromwells. Baxter publicly repudiated the work in 1670, and in 1683 the Oxford University authorities ordered it to be part of a book-burning that included the works of Hobbes and Milton.” – on Amazon Hale, Matthew – The Analysis of the Law 3rd ed. (d. 1676; n.p., n.d.) Hale (1609-1676) was an Anglican and influential barrister, judge and jurist most noted for his treatise, The History of the Pleas of the Crown. Hale’s early works, including, A Discourse of the Knowledge of God, reflect his early Puritan and Reformed background. After ca. 1660 his thought becomes more Arminian. Hale’s Analysis of the Common Law (below) is noted as the first published history of English law and a strong influence on William Blackstone’s Commentaries on the Laws of England. Hale’s jurisprudence struck a middle-ground between Edward Coke’s “appeal to reason” and John Selden’s “appeal to contract”, while refuting elements of Thomas Hobbes’s theory of natural law. Stair, James Dalrymple – The Institutions of the Law of Scotland, Deduced from its Originals, &amp; Collated with the Civil, Canon &amp; Feudal Laws, &amp; with the Customs of Neighboring Nations… (Edinburgh, 1681) Dalrymple (1619–1695), 1st Viscount of Stair, was a Scottish lawyer, statesman and had close relationships at times with leading covenanters. In 1662, as a judge, though it was required of him, he refused to declare the National Covenant and the Solemn League &amp; Covenant to be unlawful oaths. The work above shows influences from Stair’s philosophical training, his foreign travels, and continental jurists as well as English lawyers. In 1695 there was published a small volume entitled, A Vindication of the Divine Perfections, Illustrating the Glory of God in them by Reason and Revelation, methodically digested… It is undoubtedly Stair’s work, and was edited by the two Nonconformist divines, William Bates and John Howe. . 1700’s See below on Common Law &amp; English law. . 1800’s Thomas, John Penford – A Treatise of Universal Jurisprudence (London, 1829) ToC Bastiat, Frederic – The Law (1850; NY: 1964) Bastiat (1801–1850) was a French economist, writer and a prominent member of the French Liberal School. A Freemason and a member of the French National Assembly, Bastiat developed the economic concept of opportunity cost. As an advocate of classical economics and the economics of Adam Smith, his views favored a free market and influenced the Austrian School. Bastiat did most of his writing during the years just before — and immediately following — the Revolution of February 1848. This was the period when France was rapidly turning to complete socialism. As a Deputy to the Legislative Assembly, Bastiat was studying and explaining each socialist fallacy as it appeared. And he explained how socialism must inevitably degenerate into communism. But most of his countrymen chose to ignore his logic. Lindley, Nathaniel – An Introduction to the Study of Jurisprudence, being a translation of the general part of [Anton] Thibaut’s System Des Pandekten Rechts, with Notes &amp; Illustrations (London, 1855) Thibaut (1772–1840) was a German jurist. Wiki: “The fame of this book [of Thibaut’s] results from its being the first modern complete compendium of the subject, distinguished alike by the accuracy of its sources and the freedom and unpedantic manner in which the subject is handled. It is, in effect, a codification of the Roman law as it then obtained in Germany, modified by canon law and the practice of the courts into a comprehensive system of Pandect [Roman] law.</p></blockquote>

<blockquote><p>I respond [to an Arminian]: Be it so, that the precept “Repent and believe the Gospel” binds all and every man; be it so, that that precept is proclaimable to all men by the will of God; yet since in fact it is not announced to all, and that by a special dispensation of God, such are excused by invincible ignorance, so that they do not exercise supernatural acts concerning supernatural objects. For invincible ignorance on this part rightly excuses. For positive precepts do not bind those to whom they are not promulgated. And therefore, such a one, as he can have no knowledge of any obligation, so he can be conscious to himself of no prevarication. (See Puteanus on pt. 1 of 2, q. 90, art. 4, concl. 1). 2… But for something to be imputed to a man as a fault, it must in some way be avoidable, voluntary, and known.</p></blockquote>

<blockquote><p>XXXIV. …Human laws are positive, binding only on the part of the legislator, not on the part of the thing. On the contrary, the moral law [of God] is of natural right, binding in itself and on the part of the thing.</p></blockquote>

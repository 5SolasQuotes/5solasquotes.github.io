<main class="wrap"><figure class="quote" id="q-019d23eff1" data-kw="">
<blockquote><p>Much of the division, however, resulted from disowning the [civil] government [in 1680]… by the societies. The General Society rejected and rebuked many godly Presbyterian ministers because they would not disown the king although they shared the same views concerning church doctrine, worship and government. To make matters worse, the societies broke fellowship with those who listened to such ministers, causing further divisions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-nisbet-moore.html">Edwin Nisbet Moore</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Covenant Heritage</cite>, (2000) Moore is very sympathetic with the Cameronians., p. 95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-68b231c68e" data-kw="">
<blockquote><p>You must do it in a peaceable way, so as to manifest that you desire peace, and not to be the least disturbance to the peace of the Church, but that the peace of it is dear and precious to you; therefore, when ye have witnessed the truth, and discharged your conscience in it, you must then be content to sit down quiet: For so the rule is, ‘That the spirits of the prophets must be subject to the prophets,’ in that case. But if it should prove that the Church should continue, if the evil be notorious and great as requires departing, and the Church, after all means used, and all patience, should continue in it; in such a case you may desire to be dismissed from it and depart, but in as peaceable a way as possibly can be; yet continuing in due respect unto the Church for all that, though you should depart, only leaving your witness behind you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-1a1e1e72f4" data-kw="">
<blockquote><p>[James] Renwick, he was told, would have to subscribe the Confession and Catechisms of the Dutch church, as was mandatory in all ordinations; otherwise there was no prospect of the Presbytery ordaining him. Hamilton asked to see a copy of the Confession, and found his worst fears confirmed… there were vestiges of pre-Reformation practices–ceremonial, liturgy, and the role of the civil power in the church–which were reflected all too plainly in the [Belgic] Confession. Hamilton on seeing this, urgently consulted Renwick. Together they had to accept that Renwick could not subscribe the [Belgic] Confession, since to do so would be to compromise the basic principles of the Scottish Reformation and Covenants… …he [Hamilton] went round the ministers of the Presbytery and pleaded with them that, if Renwick was to subscribe anything, ti should be the Confession and Catechisms of the Church of Scotland… they eventually assented.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preacher to the Remnant: The Story of James Renwick</cite>, (Blue Banner Productions, 2009), pp. 58-59</span></figcaption>

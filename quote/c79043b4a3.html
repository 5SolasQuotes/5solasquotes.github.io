<main class="wrap"><figure class="quote" id="q-c79043b4a3" data-kw="">
<blockquote><p>The very next day after my preaching from Acts 10:33, as above related, Mr. [John] Macmillan came to Eskdale, and some of my hearers went to him. This was what I got to begin with. On the morrow after I went up to S. to see J. L.’s family and others; my design was to endeavour to prevent their perverting others. When I came there, I went first into the house of one of my hearers; and there I was surprised with the news of Mr. Macmillan’s being in J. L.’s, and others with him. The old man came in to me. Is. L came into that house, but never noticed me; but I carried courteously to her, and told her I had a mind to have come and seen them. She told me, I should be welcome. When I went in, J. L. shewed not common civility. I was set down among three men, strangers, none of whom I knew. They were S. H. of H., Mr. St. and Mr. Sm. The last I took for Mr. Macmillan, having never seen the man.

Being set down, I was resolved to divert disputes, at least a while, with some discourse of practical godliness. Wherefore being asked, “What news?” I said, that news were hard to be got here, the place being so far remote from towns; that it was like Jerusalem; Psalm 125:2; which brought us at length to the discourse of communion with God; concerning which S. H. gave his opinion, that it consisted in doing the will of God, keeping his commandments. I told him, that all communion was mutual, and therefore it could not consist in that; and shewed, that actual communion with God, which we ordinarily call communion with God, consists in the Lord’s letting down the influences of his grace on the soul, and the soul’s reacting the same in the exercise of grace. O, says he, that is extraordinary; wherewith I was stunned. I told him, it was that without which neither he nor I would be saved. How will you prove that? said he. So I was put to prove it to him.

Thereafter he brought in the matter of the separation; told, that he understood I was an enemy to them, and preached against them. I acknowledged, that I judged their way was not of God; and therefore, when it fell in my way, I did preach against it. And understanding that lie meant of a note I had at Morbattle sacrament, I desired him to tell me what he heard I had said. He shifted this; and I told him, viz. that I exhorted those that had met with God at this occasion, to tell them that it was so; and that they thereupon, according to the spirit of the gospel, should say, “We will go with you, for we hear the Lord is with you.” J. L. said, if that were true, that the Lord were with you, we would join with you. Mr. St. having no will to make that the determining point, told me, that he knew not but the Lord was with the church of the Jews in time of great corruption. To which I answered, And neither did Christ himself separate from them in that time; and urged them with that, Luke 4:16. After other shifts, they were at length brought to that desperate answer, That Christ was the lawmaker, and therefore not imitable by us.

The person whom I took for Mr. Macmillan was not like to speak, and therefore I asked for Mr. Macmillan. I staid there with them an hour and a half at least; but saw not Mr. Macmillan. When I was coming away, I desired Mr. St. to tell him, that seeing I had not seen him, he would come to my house and see me; which he undertook to tell him. Above six weeks after this rencounter, and my not meeting Mr. Macmillan having made a noise in the country, I heard that John Scot in Laugshawburn had said of me, that I was a liar, and he would prove me a liar, for I had never asked for Mr. Macmillan, nor desired him to come to my house. This was at first very troublesome to me. Afterwards I found real joy in my heart, in that I was made partaker of the sufferings of Christ, while I saw a spirit of bitterness possessing some of that party. However, the truth was brought to light after, by the confession of some of that party. Mr. Macmillan was in that house in the time, in an outer chamber; and Adam Linton told me, that he was certainly informed, that he caused the lass lock the door, and give him in the key at the door head or foot, whatever was his design in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs</cite>, (1731) in The Whole Works of the Late Reverend Thomas Boston of Ettrick, ed. Samuel McMillan (12 vols, Aberdeen: George and Robert King, 1852), 12: 199-200.</span></figcaption>

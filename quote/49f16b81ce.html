<main class="wrap"><figure class="quote" id="q-49f16b81ce" data-kw="">
<blockquote><p>This, then, we must first and principally remember, To set ourselves against all sin. In confession, none to be dissembled; in supplication, none to be excepted; in conversion, none to be reserved; never give it over so long as any is left. — “O Lord, yet it works, yet it lives, yet it tempts, yet it pains me. Sin hath not done accusing of me; let not thy mercy have done forgiving of sin. Sin hath not done rebelling in me; let not thy grace have done subduing of sin.” When men kill snakes or vipers, so long as they see them pant, or offer to thrust out a sting, they strike them still.

Sin, like the thief on the cross, when it is fast nailed, and kept from its old tyranny, yet will, as much as it can, revile and spit out venom upon Christ. O therefore give it not over; break the legs of it; crucify it clean through, till it be quite dead. None can pray, or turn unto God in truth, or hope to be delivered from judgements in mercy, so long as he holds fast any known sin. Can any man look to receive benefit by the blood of Christ, who hugs the villain that shed it? Is it not treason, knowingly to harbour and entertain a traitor? Whosoever loves and holds fast sin, lies unto God in every prayer that he makes.

This serveth to prove and humble us for our hypocrisy and halvings with God in our conversions from sin, and confessions of it. We are willing to pray for the pardon of them all, we would have none hurt us; but when it comes to parting, and taking all away, this we cannot away with. Some are fat, delicate, golden sins; we would fain spare these, as Saul did Agag; and hide them, as Achan’s did his wedge. Herod hears John gladly in many things; but if he restrain him of his Herodias, he must expect to be himself restrained. Agrippa will be almost a Christian, but altogether may chance bring a chain with it. Jehu will down with Baal and his priests; but he knows not how to part with his calves, lest he venture his kingdom.

Policy is ever entering caveats against piety. Thus men huck, and stand upon abatements with Christ, in the bargain of salvation; not considering, that the purchase of Heaven is like the buying of the Sibyl’s prophecy; the longer we stand off, the dearer every day it will cost us; the more tears, the harder repentance, the deeper sorrow, the stronger cries. These men know not the price of a soul, nor the worth of a Saviour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Israel’s Prayer in Time of Trouble, with God’s Gracious Answer Thereunto; or An Explication of the Fourteenth Chapter of the Prophet Hosea, in Seven Sermons, Preached upon so many days of Solemn Humiliation</cite>, (1645) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), 3: 192-93.</span></figcaption>

<blockquote><p>3… But more especially the Holy Ghost is compared to a wind in respect of its irresistable workings; as nothing can resist the wind, it goes and blows which way soever it will; so nothing can resist the Spirit of God, wheresoever it has a purpose to work efficaciously; I will not say, but the heart of a man may resist and reject the work of the Spirit in some measure, and in some degrees; Stephen told the Jews, they had always resisted the Holy Ghost (Act. 7:51); and the apostle tells of strong holds, and of every high thing that exalts itself against God (2 Cor. 10:5); so there is a natural contrariety, a constant enmity and active resisting of God’s Spirit by our spirits; we must therefore distinguish between a prevalent and a gradual resisting; the Spirit in conversion so works that He takes away the prevalent, but not the gradual resisting; A man before he be converted is froward, and full of cavils and prejudices; he is unwilling to be saved; he cannot abide the truth; he does what he can to stifle all good motions: yet if he belong to the election of grace, God will at last over-master his heart and make him of unwilling, willing; He will omnipotently bow and change the will and work on his soul by his mighty power efficaciously, insuperably and irresistably.</p></blockquote>

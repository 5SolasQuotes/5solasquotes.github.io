<main class="wrap"><figure class="quote" id="q-d0737e51bf" data-kw="">
<blockquote><p>As for Mr. Baxter, I am far from joining with them who damn him as an Heretic, as bad as Pelagius. Altho’ he had not in every Point (as Bucolner says of another) Caput regulatum Calvini; nevertheless he was a Man of excellent Natural Parts, of great Reading and Learning, and of eminent Piety; and one that did great Service for the Church of God; an happy Instrument of converting many Souls, and is now undoubtedly among the Blessed. Maccovius said of our Ames, whose Judgment differed from his in some Matters of Controversy, Sit Anima men cum pientissimâ Animâ Amesij; so say I, Sit Anima mea cum Animâ Baxteri.

This notwithstanding, it is better to maintain the Truth with the Generality of the Orthodox than to err with Origen: Mr. Baxter was subject to Mistakes. Bernardus non videt omnia. His Aphorisms about Justification was very [illegible word] to the most judicious Divines both in England and New-England.

His Christian Directory hath some Superstitious Things in it, which his Antagonist (Mr. Danvers) hath noted, and thereby exposed him to those Men who have no Kindness for his Memory. In many of his Writings these are Arminianish. Notions, which I wish had never been there. He honoured himself in his imitating Austin, in writing a Book of Retractations: I wish he had done more that Way. Were he now living, it would not trouble him to see any of his Mistakes corrected. Not long before his Death, in private Discourse, he did seriously profess his Desires to me, that if I observed any dangerous Error in any of his Writings, in Case the Lord should continue my Life after his, I would refute that Error. This argued both a Sincere Love to Truth, and Humility to be in his Holy Soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/increase-mather.html">Increase Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dissertation concerning the future conversion of the Jewish Nation. Answering the objections of the Reverend and learned Mr. Baxter, Dr. Lightfoot, and others: With an enquiry into the first resurrection</cite>, (1695; London: Nath. Hillier, 1709), pp 1-2.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6f8bf551cd" data-kw="">
<blockquote><p>Many evangelicals think that you can be a Christian while treating the church as an optional extra. The Reformed faith denies this, and so the Westminster Confession teaches that outside the visible church there is no ordinary possibility of salvation (WCF 25:2). Likewise, Henry Bullinger expresses the same opinion when he says: ‘Without the church, as it were without the ark of Noe, is no salvation: but in the church, I mean, in the fellowship of Christ and the saints, is full forgiveness of all offences.’</p></blockquote>

</figure><figure class="quote" id="q-8f01fded6d" data-kw="">
<blockquote><p>Matters of smaller weight, and so covertly discovered that no great offence to the Church was to be feared in them, I wholly passed by, as one that discerned nothing of them, or had been unfurnished of replies. For other of greater moment, and so openly delivered, as there was just cause of fear, least the truth and church of God should be prejudiced and periled by it, and such as the conscience of my duty &amp; calling would not suffer me altogether to pass over, this was my course, to deliver, when I should have just cause by my text, the truth of such doctrine as he had otherwise taught in general speeches, without touch of his person in any sort, and further at convenient opportunity to confer with him in such points.

According to which determination, whereas he had taught certain things concerning predestination otherwise then the word of God doth, as it is understood by all churches professing the gospel, and not unlike that wherewith Coranus some times troubled his church; I both delivered the truth of such points in a general doctrine, without any touch of him in particular, and conferred with him also privately upon such articles.

In which conference, I remember, when I urged the consent of all churches, and good writers against him that I knew, and desired if it were otherwise, what authors he had seen of such doctrine, he answered me that his best author was his own reason: which I wished him to take heed of, as a matter standing with Christian modesty &amp; wisdom in a doctrine not received by the church, not to trust to his own judgment so far, as to publish it before he had conferred with others of his profession, labouring by daily prayer, and study to know the will of God, as he did, to see how they understood such doctrine: notwithstanding he with wavering replying that he would some other time deal more largely in the matter, I wished him, &amp; prayed him not so to do, for the peace of the church, which by such meanes might be hazarded; seeing he could not but think, that men, who make any conscience of their ministry, will judge it a necessary duty in them, to teach the truth, and to convince the contrary.

Another time upon like occasion of this doctrine of his that the assurance of that we believe by the word, is not so certain, as of that we perceive by sense; I both taught the doctrine otherwise, namely the assurance of faith to be greater, which assureth both of things above, and contrary to all sense and human understanding, and dealt with him also privately upon that point.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-travers.html">Walter Travers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Supplication made to the Privy Counsel</cite>, (Oxford: John Barnes, 1612), pp 12-13.</span></figcaption>

</figure><figure class="quote" id="q-8e0bf6110d" data-kw="">
<blockquote><p>In 1720, the [Presbyterian] Synod [of Ulster] adopted the so-called ‘Pacific Act,’ which in the same breath professed adherence to the Westminster Confession, extended the Act of 1705 to all intrants to the ministry, though licensed and ordained elsewhere; and ‘legalized the practice of receiving explanations of objectionable phrases.’ In 1721 a motion was made and carried that all the members of Synod who are willing to subscribe the Westminster Confession of Faith, according to the terms of the Pacific Act, be allowed by this Synod to do it. Charitable declarations were made by both parties in the Synod and approved by Synod. The great majority of the members of Synod signed the following formula: ‘Reserving to ourselves the benefit of the Pacific Act, we believe the Westminster Confession of Faith to be founded on the Word of God, and therefore as such, by this our subscription, we do own the said Confession as the confession of our faith.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-cooper.html">James Cooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confessions of Faith &amp; Formulas of Subscription</cite>, … (Glasgow: MacLehose &amp; Sons, 1907), pp. 19-22</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In 1720, the [Presbyterian] Synod [of Ulster] adopted the so-called ‘Pacific Act,’ which in the same breath professed adherence to the Westminster Confession, extended the Act of 1705 to all intrants to the ministry, though licensed and ordained elsewhere; and ‘legalized the practice of receiving explanations of objectionable phrases.’ In 1721 a motion was made and carried that all the members of Synod who are willing to subscribe the Westminster Confession of Faith, according to the terms of the Pacific Act, be allowed by this Synod to do it. Charitable declarations were made by both parties in the Synod and approved by Synod. The great majority of the members of Synod signed the following formula: ‘Reserving to ourselves the benefit of the Pacific Act, we believe the Westminster Confession of Faith to be founded on the Word of God, and therefore as such, by this our subscription, we do own the said Confession as the confession of our faith.&#x27;”

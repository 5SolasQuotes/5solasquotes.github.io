<blockquote><p>…it is further confirmed by that great scandal whereby Peter compelled the Gentiles to judaize, Gal. 2:14. ‘He constrained them,’ says Perkins (Commentary on Gal. 2:14), ‘by the authority of his example, whereby he caused them to think that the observation of the Ceremonial Law was necessary.’ It was then the quality of his action which made the scandal active, because that which he did was inductive to sin; but we are not to think that Peter had an intention to draw the Gentiles to sin. (tome 1, an. 55, n. 39)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 2, ch. 9, pp. 39-40</span></figcaption>

<blockquote><p>There is no scandall taken, but (if it be known to be taken, and the thing at which it is taken be not necessary) it is also given. … 2. Giving and not granting that the scandal of them who were first offended at the ceremonies [c. 1618] was only passive, yet the using of them after scandal is known to rise out of them, must be an active scandal, because the keeping of a thing which is not necessary, after scandal rises out of it, is an active scandal, though the scandal which at first rose out of it, had been only passive…</p></blockquote>

</figure><figure class="quote" id="q-e3be58e389" data-kw="">
<blockquote><p>Thirdly, If an occasional offence of weaker brethren may be a ground for restraining Christian liberty, then much more may commands from lawful authority do it; but the offence of weaker brethren may restrain Christian liberty, as to the exercise of it, as appears by the apostle’s discourse, Rom. 14:21. The reason of the consequence lies here, that a case of mere offence, which is here pleaded towards weak brethren, cannot have that obligation upon conscience which a known duty of obeying lawful authority, in things in themselves lawful, has. Nay further, insisting only on the law of scandal, I would fain know whether it be a greater offence and scandal to Christians’ consciences to infringe the lawful authority of the magistrate and to deny obedience to his commands, in things undetermined by the Law of God, or else to offend the consciences, that is, go against the judgements of some well-meaning, but less-knowing Christians. Or thus, whether in the matter of scandal, it be a greater offence to go against the judgments of the weaker and more ignorant, or the more knowing and able, when the one have only their own weak apprehension to bias them, the other are backed by and grounded upon an established law. And whether it be not a greater scandal to religion to disobey a Christian magistrate than it is to offend some private Christians. Let these things be examined, and then let us see whether the argument will not hold à majori; if the law of scandal as to private Christians may restrain liberty, then may a command from the magistrate do it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-stillingfleet.html">Edward Stillingfleet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, a Weapon-Salve for the Church’s Wounds, or the Divine Right of Particular Forms of Church-Government Discussed &amp; Examined</cite>, … (London: 1662), pt. 1, ch. 2, pp. 55-56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thirdly, If an occasional offence of weaker brethren may be a ground for restraining Christian liberty, then much more may commands from lawful authority do it; but the offence of weaker brethren may restrain Christian liberty, as to the exercise of it, as appears by the apostle’s discourse, Rom. 14:21. The reason of the consequence lies here, that a case of mere offence, which is here pleaded towards weak brethren, cannot have that obligation upon conscience which a known duty of obeying lawful authority, in things in themselves lawful, has. Nay further, insisting only on the law of scandal, I would fain know whether it be a greater offence and scandal to Christians’ consciences to infringe the lawful authority of the magistrate and to deny obedience to his commands, in things undetermined by the Law of God, or else to offend the consciences, that is, go against the judgements of some well-meaning, but less-knowing Christians. Or thus, whether in the matter of scandal, it be a greater offence to go against the judgments of the weaker and more ignorant, or the more knowing and able, when the one have only their own weak apprehension to bias them, the other are backed by and grounded upon an established law. And whether it be not a greater scandal to religion to disobey a Christian magistrate than it is to offend some private Christians. Let these things be examined, and then let us see whether the argument will not hold à majori; if the law of scandal as to private Christians may restrain liberty, then may a command from the magistrate do it.”

— Edward Stillingfleet, Irenicum: a Weapon-Salve for the Church’s Wounds, or the Divine Right of particular forms of Church-Government Discussed &amp; Examined according to the principles of the Law of Nature… (London: 1662), pt. 1, ch. 2, pp. 55-56">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThirdly%2C+If+an+occasional+offence+of+weaker+brethren+may+be+a+ground+for+restraining+Christian+liberty%2C+then+much+more+may+commands+from+lawful+authority+do+it%3B+but+the+offence+of+weaker+brethren+may+restrain+Christian+liberty%2C+as+to+the+exercise+of+it%2C+as+appears+by+the+apostle%E2%80%99s+discourse%2C+Rom.+14%3A21.+The+reason+of+the+consequence+lies+here%2C+that+a+case+of+mere+offence%2C+which+is+here+pleaded+towards+weak+brethren%2C+cannot+have+that+obligation+upon+conscience+which+a+known+duty+of+obeying+lawful+authority%2C+in+things+in+themselves+lawful%2C+has.+Nay+further%2C+insisting+only+on+the+law+of+scandal%2C+I+would+fain+know+whether+it+be+a+greater+offence+and+scandal+to+Christians%E2%80%99+consciences+to+infringe+the+lawful+authority+of+the+magistrate+and+to+deny+obedience+to+his+commands%2C+in+things+undetermined+by+the+Law+of+God%2C+or+else+to+offend+the+consciences%2C+that+is%2C+go+against+the+judgements+of+some+well-meaning%2C+but+less-knowing+Christians.+Or+thus%2C+whether+in+the+matter+of+scandal%2C+it+be+a+greater+offence+to+go+against+the+judgments+of+the+weaker+and+more+ignorant%2C+or+the+more+knowing+and+able%2C+when+the+one+have+only+their+own+weak+apprehension+to+bias+them%2C+the+other+are+backed+by+and+grounded+upon+an+established+law.+And+whether+it+be+not+a+greater+scandal+to+religion+to+disobey+a+Christian+magistrate+than+it+is+to+offend+some+private+Christians.+Let+these+things+be+examined%2C+and+then+let+us+see+whether+the+argument+will+not+hold+%C3%A0+majori%3B+if+the+law+of+scandal+as+to+private+Christians+may+restrain+liberty%2C+then+may+a+command+from+the+magistrate+do+it.%E2%80%9D%0A%0A%E2%80%94+Edward+Stillingfleet%2C+Irenicum%3A+a+Weapon-Salve+for+the+Church%E2%80%99s+Wounds%2C+or+the+Divine+Right+of+particular+forms+of+Church-Government+Discussed+%26+Examined+according+to+the+principles+of+the+Law+of+Nature%E2%80%A6+%28London%3A+1662%29%2C+pt.+1%2C+ch.+2%2C+pp.+55-56&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe3be58e389.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e3be58e389.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-scandal/#:~:text=Thirdly%2C%20If%20an%20occasional%20offence%20of,command%20from%20the%20magistrate%20do%20it&amp;text=Thirdly%2C%20If%20an%20occasional%20offence%20of%20weaker%20brethren&amp;text=may%20a%20command%20from%20the%20magistrate%20do%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3ddeedd518" data-kw="">
<blockquote><p>Now for the last thing which makes things indifferent with us scandalous: we are not left without witness from the Scriptures in such cases. But that ceremonies, known to be scandalous, were notwithstanding used: for, it is manifest concerning the Jewish ceremonies that they were scandalous in the usage to the gentiles and in the omitting to the Jews, Acts 21:21-22, 27-28; Gal. 2:3, 9, 12. But that this point of scandal may be distinctly understood, diverse rules are to be considered of: First, that the angering or bare displeasing of other men is not the offense or scandal condemned in Scripture, as not only the words in the original show, but all sound divines grant. A scandal is a stumbling block that occasions a man to fall from grace in the profession of it, into sin or error. Secondly, that to give offense, by doing anything which is simply evil in itself (as David did by his adultery and murder), this is out of all question abominable. Thirdly, that the offense of aliens is to be regarded, that is, we must not do anything by which men that are not yet converted may be hardened from the liking of religion: and so, offense must not be given either to the Jews or to the Grecian, 1 Cor. 10:31. Fourthly, that when the authority of the magistrate or Church has determined concerning the use of things indifferent, we are not now left free, nor are bound to look at the scandal of particular persons; but must make conscience of it, that we offend not the Church, by working a greater hurt or loss to the Church than the particular hurt of private persons can extend unto. In such cases as this, the apostle’s rule holds: ‘If any man seem to be contentious, we have no such custom, nor the Church of God,’ 1 Cor. 11:16. And we are bound, in this text of the apostle Peter [1 Pet. 2:13] to obey the human ordinances of men in authority, from which obligation other men’s offense cannot free us. And the apostle charges us to look to it that we offend not the Church in prescribed ordinances, and that we be careful not to offend private men in free ceremonies. Fiftly, that where ceremonies are left free and indifferent and have no commandement to restrain their use or enjoin it, there are men to redeem the offense of their brethren with no other price than the loss of liberty in things indifferent. The apostle Paul says rather than [that] he will offend his brother, he will never eat flesh while he lives, 1 Cor. 10:8, 13. He does not say he will never preach the Gospel while he lives, or never receive the sacraments while he lives: a necessity lay upon him to preach the Gospel, and to yield to the use of all lawful things to get his liberty, whosoever be offended. Sixtly, that where the person that takes offense is wilfully ignorant and by all means avoids instruction and will not have the patience to be taught, such offense is not to be regarded. Thus our Savior Christ teaches confidently his doctrine of eating his flesh, though the Capernaites were offended: and some of his disciples turned apostates about it, being such persons as would not abide the exposition of his meaning, Jn. 6:52. Seventhly, the like is to be said of such persons as take offense out of envy or malice, as the man in the parable that envied Christ’s bounty (Mt. 20:15), or the Pharisees, that out of malice were offended at Christ, Mt. 15:14; 1 Pet. 2:8. Eighthly, that in things that have proved scandalous, yet we are not bound to lose our liberty till the weak brother declare his offense. Meat sacrificed to idols was offensive to many in all countries, yet the apostle’s rule is, ‘Eat and make no question unless one say, ‘This is meat sacrificed to idols,” 1 Cor. 10:25, 28.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter</cite>, ... (London, 1623), on 1 Pet. 2:13, pp. 595-97</span></figcaption>

we+have+no+such+custom%2C+nor+the+Church+of+God%2C%E2%80%99+1+Cor.+11%3A16.+And+we+are+bound%2C+in+this+text+of+the+apostle+Peter+%5B1+Pet.+2%3A13%5D+to+obey+the+human+ordinances+of+men+in+authority%2C+from+which+obligation+other+men%E2%80%99s+offense+cannot+free+us.+And+the+apostle+charges+us+to+look+to+it+that+we+offend+not+the+Church+in+prescribed+ordinances%2C+and+that+we+be+careful+not+to+offend+private+men+in+free+ceremonies.+Fiftly%2C+that+where+ceremonies+are+left+free+and+indifferent+and+have+no+commandement+to+restrain+their+use+or+enjoin+it%2C+there+are+men+to+redeem+the+offense+of+their+brethren+with+no+other+price+than+the+loss+of+liberty+in+things+indifferent.+The+apostle+Paul+says+rather+than+%5Bthat%5D+he+will+offend+his+brother%2C+he+will+never+eat+flesh+while+he+lives%2C+1+Cor.+10%3A8%2C+13.+He+does+not+say+he+will+never+preach+the+Gospel+while+he+lives%2C+or+never+receive+the+sacraments+while+he+lives%3A+a+necessity+lay+upon+him+to+preach+the+Gospel%2C+and+to+yield+to+the+use+of+all+lawful+things+to+get+his+liberty%2C+whosoever+be+offended.+Sixtly%2C+that+where+the+person+that+takes+offense+is+wilfully+ignorant+and+by+all+means+avoids+instruction+and+will+not+have+the+patience+to+be+taught%2C+such+offense+is+not+to+be+regarded.+Thus+our+Savior+Christ+teaches+confidently+his+doctrine+of+eating+his+flesh%2C+though+the+Capernaites+were+offended%3A+and+some+of+his+disciples+turned+apostates+about+it%2C+being+such+persons+as+would+not+abide+the+exposition+of+his+meaning%2C+Jn.+6%3A52.+Seventhly%2C+the+like+is+to+be+said+of+such+persons+as+take+offense+out+of+envy+or+malice%2C+as+the+man+in+the+parable+that+envied+Christ%E2%80%99s+bounty+%28Mt.+20%3A15%29%2C+or+the+Pharisees%2C+that+out+of+malice+were+offended+at+Christ%2C+Mt.+15%3A14%3B+1+Pet.+2%3A8.+Eighthly%2C+that+in+things+that+have+proved+scandalous%2C+yet+we+are+not+bound+to+lose+our+liberty+till+the+weak+brother+declare+his+offense.+Meat+sacrificed+to+idols+was+offensive+to+many+in+all+countries%2C+yet+the+apostle%E2%80%99s+rule+is%2C+%E2%80%98Eat+and+make+no+question+unless+one+say%2C+%E2%80%98This+is+meat+sacrificed+to+idols%2C%E2%80%9D+1+Cor.+10%3A25%2C+28.%E2%80%9D%0A%0A%E2%80%94+Nicholas+Byfield%2C+A+Commentary%3A+or+Sermons+upon+the+Second+Chapter+of+the+First+Epistle+of+Saint+Peter...+%28London%2C+1623%29%2C+on+1+Pet.+2%3A13%2C+pp.+595-97&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3ddeedd518.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3ddeedd518.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-scandal/#:~:text=Now%20for%20the%20last%20thing%20which,to%20idols%2C%E2%80%9D%201%20Cor.%2010%3A25%2C%2028&amp;text=Now%20for%20the%20last%20thing%20which%20makes%20things&amp;text=meat%20sacrificed%20to%20idols%2C%E2%80%9D%201%20Cor.%2010%3A25%2C%2028" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I believe indeed that these men do auoid offenses, to wit, offenses of the world, that they would not be any offense unto tyrants and antichrists… But these be not the offenses which Christ taught to be avoided when He says of the scribes and Pharisees, ‘Let them alone, they are blind, and leaders of the blind.’ What offenses then be dissallowed?… Yea, and the weaker brethren newly conuerted unto the Gospel… But we ought (say they) to bear with the weak ones, and sometimes to frame ourselues unto them… Wherefore somewhat must be done for their weakeness’s sake: as Paul in his epistle to the Romans faithfully gave advise. We grant that somewhat must be consented to for their sakes that be so weak: howbeit… Yea, we must not always bear with the weak ones in those indifferent things, except in the meantime, while they may be the better and more perfectly taught. But when they once understand the thing, and yet nevertheless stick fast in their opinion, their weakeness is not to be nourished. Moreover, we must not so much bear with them, as by our example we should hurt others and also many members of Christ.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2080b22833" data-kw="">
<blockquote><p>Let us give place and consent to the Holy Scripture (says St. Augustine) for it can neither deceive nor be deceived. The bishops also and clergy of England in the epistle of their book to the King’s grace (De peccatorum meritis et remissione, ch. 22) do affirm that holy Scripture alone shows men the right path to come to God to see Him, to know Him, to love Him, to serve Him and so to serve Him as He most desires. Wherefore they are rather obstinate against God, which instead of his only Word, preach and teach other doctrines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/miles-coverdale.html">Miles Coverdale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Confutation of that Treatise which one John Standish made against the protestation of D. Barnes in the year 1540. Wherein the holy scriptures</cite>, (perverted and wrested in his said treatise) are restored to their own true understanding again… ([Zurich: C. Froschauer, 1541?]), Confutation, Protestation of S. Robert Barnes, no page numbers</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a></span></div>

<blockquote><p>As all were not true prophets, the Apostle here declares that they ought to have been examined and tried. And he addresses not only the whole Church, but also every one of the faithful. … That we may then be fit judges, we must necessarily be endowed with and directed by the Spirit of discernment. But as the Apostle would have commanded this in vain, were there no power of judging supplied, we may with certainty conclude, that the godly shall never be left destitute of the Spirit of wisdom as to what is necessary, provided they ask for him of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Catholic Epistles</cite>, 1 John 4:1</span></figcaption>

</figure><figure class="quote" id="q-33d2cb8c22" data-kw="">

</figure><figure class="quote" id="q-6165730314" data-kw="">
<blockquote><p>Ever since the Scripture was written, the generality of the church was obliged to attend thereunto alone, as their only rule of faith and obedience. And although God reserved unto himself a liberty under the Old Testament, and until the completing of all the books of the New, to add new revelations as he pleased, yet he always bound up the faith and obedience of the present church unto what he had already revealed. And he hath now, by the Spirit of his Son, put an end unto all expectation of any new, of any other revelations, wherein the faith or obedience of the church should be concerned; at least, we take it for granted in this inquiry that infallible inspirations in the discovery of things not before revealed are ceased in the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 2</span></figcaption>

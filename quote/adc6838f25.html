<blockquote><p>V. A confederation or stipulation is required [of laymen coming to a congregation], whereby they promise God and the Church to continue and progress in that communion of Saints… But more explicitly, those being admitted to the communion of the Church enter into that holy confederation when they respond not only to particular questions about repentance, faith, and gratitude, specifically applied to themselves, but also to those general questions which conclude the series: Do they acknowledge the doctrine of our churches to be the orthodox faith and the way of salvation? Do they promise by God’s grace to persevere in that doctrine until death? Do they promise to live holily and worthily according to that doctrine? Do they submit to ecclesiastical discipline? And this is the method of stipulation and confederation in our churches. As for the manner of confederation by oath or the subscription of a formula or instrument, it does not seem necessary. It suffices that this is done before many witnesses, but we do not consider it illicit; as we shall soon discuss in the Problems.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’, p. 19 (PDF p. 11)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-71c04a633c" data-kw="">
<blockquote><p>Sixthly, the ministers are primarily ministers of the Church catholic; secondarily, of this or that particular flock or congregation: and therefore the catholic is the prime Church. And this appears by this demonstration: That Church to the which the donation of the ministry was first made, is the first subject thereof, but that was the Church catholic, therefore. For proof hereof see 1 Cor. 12:28-29, ‘God hath set some in the Church, first apostles, secondarily prophets, thirdly teachers.’ Now this Church was the Church catholic, and not any particular congregation, for it is the Church to which the Lord gave apostles. Note also from hence, that the same Church to which God gave apostles, and prophets, to the same He gave teachers also. Bishop and pastor may seem to be in respect to the particular relation to some particular place, wherein by the polity of the Church a particular minister is set, but presbyter, minister, and teacher, more general, extending to the whole Church catholic. Paul an apostle calls himself a teacher and preacher, 2 Tim. 1:11. Peter also and John the apostles call themselves presbyters, 1 Pet. 5:1-2; Ep. John 1; 3 John 1, we find also that ministers are in Scripture spoken of under a general notion. They are called ministers of the Word, Luke 1:2, and ministers of God, 2 Cor. 6:4, and ministers of Christ, 1 Cor. 4:1, and ministers of the New Testament, 2 Cor. 3:6, and ministers of the Gospel, 1 Thess. 3:2, and ministers of the Lord, Eph. 6:21, where the ministerial office is noted by the reference thereof to the author that employs them, and the subject about which they are employed, and not by the object to whom they preached; They are not called ministers of the people, but their teachers, rulers, pastors, overseers, or ministers for them, Col. 1:7. And if a minister of this or that congregation were not a minister of the Church catholic visible, then he were no minister out of his own congregation, and therefore could not preach, or administer any sacrament, as a minister, out of his own congregation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed</cite>, (London, 1645), pp. 32-33</span></figcaption>

</figure><figure class="quote" id="q-fdd471083f" data-kw="">
<blockquote><p>I confess there might be in some towns no greater number of Christians than did meet together in one place, notwithstanding whereof the pastor or pastors and elders of that congregation, might and did manage the government of the same, and exercise jurisdiction therein. I confess also that in those cities wherein there was a greater number of Christians than could meet together into one place for the worship of God, the presbytery did consist of the pastors and elders within such a city: For it cannot be proved that there were at that time any Christian congregations in landward villages (the persecution forcing Christians to choose the shelter of cities, for which reason many are of opinion that the infidels in those days were called pagani, because they alone dwelt in pagis [districts]) and if there had been any such adjacent to cities, we must think the same should have been subject to the common presbytery, their own pastors and elders being a part thereof. Howsoever it cannot be called in question that the presbytery in the apostolic Churches was made up of as many as could conveniently meet together, for managing the ordinary matters of jurisdiction and Church-government. The pastors and elders of diverse cities could not conveniently have such ordinary meetings, especially in the time of persecution; only the pastors and elders within one city had such conveniency. And so to conclude, we do not forsake, but follow the patern, when we join together a number of pastors and elders out of the congregations in a convenient circuit, to make up a common presbytery, which has power and authority to govern those congregations; for if the presbytery which we find in those cities wherein the apostles planted churches, be a sure pattern for our classical presbyteries (as we have proved it to be)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, ... (Edinburgh: 1641), pt. 2, ch. 3, pp. 146-47</span></figcaption>

<blockquote><p>Be not easily tempted to cast at your ministers of whose heart-honesty you have had sufficient demonstration. If once Satan get you to begin a little to spurn at them, he will not cease tempting and providence may justly let snares be rained on you, occasions of stumbling be afforded you, till ye turn quite off and become wild. Notorious it is that people’s idolizing, inamoredness with some, and rooted prejudice at others upon partialities and by-respects are both a cause, foment and consequent of woeful divisions, 1 Cor. 1:11-12 and 3:3-4. O esteem your pastors highly in love for their work’s sake and let not every petty difference cast you and them out: Keep not distance with them, but go and lovingly confer with them anent what ye and they differ in: And if ye get not satisfaction, recommend the matter to God, but let love and peace stand entire notwithstanding. What is Satan’s great engine, and consequently his design for marring your good of ministers; but by stating prejudices in your minds at them? Shut your ears and hearts then to all charms that would suggest ill thoughts of your honest ministers. Receive not lightly ill reports of them, spread perhaps industriously to make them odious (Jer. 20:10) to alienate you from them, as Gal. 4:15-16. Be not then too credulous, try e’re ye trust, and admit no bad impressions of them before ye have found that truly they deserve [them].</p></blockquote>

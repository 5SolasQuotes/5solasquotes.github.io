<blockquote><p>43. What is the connection of the exaltation of the Mediator to His humiliation? The connection of legal consequence. Christ is Mediator not as a private person but as an official person, as Head of His members. Hence He must receive the fruits of His merits in Himself. And as He did not suffer for Himself, so too He was not glorified for Himself.</p></blockquote>

</figure><figure class="quote" id="q-bac036e02d" data-kw="">
<blockquote><p>Christ complains, Isa. 49:4, “Then I said, I have laboured in vain, I have spent my strength for nought, and in vain”: there’s work. Shall He have nothing for his work? He adds, “Yet surely my judgement is with the Lord, and my work with my God.” v. 6. He receives an answer of a full reward for his work… And as One who laboured for us, so He craves his wages, though the Jews pay him unworthily. Zech. 11.12, “Then I said, if ye think good, give (Me) my price, and if not, forbear; pay Me, or pay Me not: Yet the Lord paid Him. Phil. 2:7, “He made Himself of no reputation, and took upon Him the form of a servant,–and became obedient to the death, the death of the cross.” Here is work: followeth his wages, call it merit, or what else, it’s a reward and the end of his suffering, which Christ both desired and intended, as the fruit of his labours. v. 9, dio [??], “Therefore God highly exalted Him, and gave Him a Name above every name”… Isa. 53:10, “When He shall make his soul an offering for sin (which was work hard enough) He shall see his seed (which was his soul’s desired wages) He shall prolong his days, the pleasure of the Lord shall prosper in hand: 11. He shall see of the travail of his soul, and be satisfied. 12. Therefore will I divide him (a portion) with the great, and he shall divide the spoil with the strong”: that is an ample reward. Follows his work, because “he hath poured out his soul unto death, and he was numbered with the transgressors, and bare the sins of many, and made intercession for the transgressors.” Hence, his care to finish the work of Him that sent Him, and to do his will, Jn. 4:34; Jn. 17:4; Jn. 8:29, and as the Father loved, so He rewarded the obedience of his Son, not by necessity of nature, but by a voluntary compact, but He loves his obedience, Jn. 10:17, “Therefore doth my Father love me, because I lay down my life, that I might take it again.”…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Part 2, ch. 6, Argument 10: ‘From the Work of Christ, and the wages, which a Covenant Calls for’ in The Covenant of Life Opened (Edinburgh, 1655), pp. 299-300 Rutherford is arguing that there is an eternal Covenant (of Redemption), because there is work as the condition, and a promise to that work.</span></figcaption>

</figure><figure class="quote" id="q-d8aa891617" data-kw="">
<blockquote><p>Therefore the Papists err grievously when they confuse works taken generally with merits, and as soon as they hear of a pious work being commanded, immediately understand merit and a work spoken of in a legal sense. Likewise, when they hear that a reward is promised, they again understand it juridically and legally, as in some contract of hiring and payment; whereas reward is commonly called whatever we obtain after preceding labor and difficulties, whose fear might have deterred us from a good purpose, and which are compensated by the sweetness of the good that follows. Such are not only: (1) the rendering of a good to which a preceding work corresponds in equal worth (that is, merit of condignity)… … (3) Likewise, the execution of a promise made under a condition—not only of gratefully accepting and not despising the gift (for no donation is so free and pure as not to include this condition), but also of a certain work, besides acceptance and gratitude, required in addition—which therefore is in some sense meritorious, although there is perhaps no equality or commutation between the work and the promised reward; as if a father promises a jewel to his son who takes bitter medicine, or a prince promises a prize to a subject engaged in an exercise or contest beneficial to him. In this case, the donation is not purely free, since the thing does not begin to be owed as soon as the promise is accepted, but only when the condition is fulfilled; nor is it properly merit of condignity, since the worker benefits himself rather than giving something to another for which he ought to receive an equal price. Hence again it effects nothing properly by its own virtue or dignity, but only from the liberality, magnificence, and mercy of the giver, or of one interceding with him. Yet it is a certain merit improperly so called, which they call merit by covenant. Something of this kind, with respect to good works in the children of God, to whom God has promised rewards, is admitted by the Apology of the Augsburg Confession [written by Philip Melanchthon] in response to the argument—although others, on account of the ambiguity and great abuse of the term “merit,” not without reason reject it altogether. [4] Another [kind of merit] is what they call merit of congruity [or proportion], which either seems not to signify merit at all, or involves a contradiction, etc.</p></blockquote>

<blockquote><p>There is no definite doctrinal decision in this matter. The concept meritum de congruo is not without ambiguity, inasmuch as the claim arising from it can be greater or less, hence the opinions of theologians are divided. a) Meritum de congruo and the sinner. A person in mortal sin can merit de congruo, by his free co-operation with actual grace, further actual graces in preparation for justification, and finally the grace of justification itself. (Sent. probabilis.)</p></blockquote>

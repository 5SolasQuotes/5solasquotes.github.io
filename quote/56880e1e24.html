<blockquote><p>2. My second distinction shall be this: The magistrate may and ought not only to conserve justice, peace and order in the commonwealth and in the church, as it is in the commonwealth, but also to take special care of the conservation of the true reformed religion and of the reformation of it when and wherein it needs to be reformed, imperative [by command], not elicitive [not by drawing forth the power by oneself]. The magistrate (says Dr. [Andrew] Rivet on the Decalogue, p. 262) is neither to administer Word, nor sacra- ments, nor church discipline, etc., but he is to take care that all these things be done by those whom God has called thereunto. Whatever is properly spiritual, belonging to the soul and inward man (such as church censures, and the other particular before mentioned), cannot be actus elicitus [an elicited act] of the magistrate… Yet all these, and generally the administration of the keys of the kingdom of Heaven, are actus imperati [having been commanded] of the Christian magistrate, and that both antecedenter [antecedently, before-hand] and consequenter [consequently, after-the-fact]: Antecedently, the magistrate may command church officers to suspend or excommunicate all obstinate and scandalous persons; he may command the classes to ordain able and godly ministers, and no other; he may command a synod to meet to debate and determine such or such a controversy. Consequently, also, when the thing is examined, judged, resolved, or done by the ecclesiastical power, the magistrate has power and authority to add his civil sanction, confirmation, or ratification; to make the ecclesiastical sentence to be obeyed and submitted unto by all whom it concerns; — in all which the Christian magistrate does exceeding much for the conservation and purgation of religion, not eliciendo actus, doing or exercising by himself, or by his own authority, acts of church government or discipline, but taking care that such and such things be done by those to whom they do belong.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming... (London, 1646), bk. 2, ch. 8</cite>, pp. 122-23</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-129abc9c11" data-kw="">
<blockquote><p>Those who are engaged in a spiritual ministry such as preachers and pastors must likewise remain steadfast before the peril of death.¹ We have a plain command from Christ, “A good shepherd lays down his life for the sheep but the hireling sees the wolf coming and flees” [Jn. 10:11]. For when people are dying, they most need a spiritual ministry which strengthens and comforts their consciences by Word and sacrament and in faith overcomes death. ¹ Elector John wrote Luther and urged him and the professors at the university to leave on account of the plague and go to Jena. Luther, Bugenhagen, and two chaplains, however, stayed on at Wittenberg. However, where enough preachers are available in one locality and they agree to encourage the other clergy to leave in order not to expose themselves needlessly to danger, I do not consider such conduct sinful because spiritual services are provided for and because they would have been ready and willing to stay if it had been necessary. We read that St. Athanasius fled from his church that his life might be spared because many others were there to administer his office (Augustine, MPL 30.1017). Similarly, the brethren in Damascus lowered Paul in a basket over the wall to make it possible for him to escape, Acts 9 [:25]. And also in Acts 19[:30] Paul allowed himself to be kept from risking danger in the marketplace because it was not essential for him to do so.</p></blockquote>

<blockquote><p>But if the Church be remiss [to discipline a criminal in its midst], this is a defect, and somewhat extraordinary; if the Magistrate command the Church to do their duty, and they neglect to do it, the Magistrate’s cognizance [trial of the man] then may be antecedent [to the Church’s trial] and not consequent [to the Church’s trial]…</p></blockquote>

<blockquote><p>One of the best known and most esteemed of John Owen’s works. It is unnecessary to say that he is the prince of divines. to master his works is to be a profound theologian. Owen is said to be prolix, but it would be truer to say that he is condensed. His style is heavy because he gives notes of what he might have said, and passes on without fully developing the great thoughts of his capacious mind. He requires hard study, and none of us ought to grudge it.” – Spurgeon Allen, James – Serious Advice to delivered ones from sickness or any other dangers threatening death, how they ought to carry it that their mercies may be continued, and other misery prevented, or, The healed ones prophulacticon, or healthful diet, delivered in several sermons on John 5:14 (Boston, 1679) Allen (1632-1710) appears to have been a faithful, New England minister. Here are about 15 or so other works of his. Sibbes, Richard – ‘A Rescue from Death, with a Return of Praise’ Works, 6.133-57 on Ps. 107:17 ff. Mather, Cotton – ‘Mens Sana in Corpore Sano. A Discourse upon Recovery from Sickness. Directing how Natural Health, may be Improved into Spiritual: especially by them that have Lately Recovered it’ (Boston, 1698) . 1700’s Wadsworth, Benjamin – ‘Christian Advice to the Sick and Well. In Answer to these Questions: I. What should Christians do, when under bodily sickness? II. How should Christians in health, improve the sickness of others; and how should they carry it towards the sick? III. How should Christians behave themselves, when recovered from sickness? And, None but the Righteous Saved: a Sermon on 1 Cor. 6:9’ Ref (Boston, 1714) Newton, John – Letter 36, ‘To a Gay [Merry] Friend, on his Recovery from Illness’ Works (London, 1808), vol. 1 (of 6), pp. 353-7 . . On Visiting the Sick, especially Church Officers Articles 1500’s Calvin, John – ‘Visitation of the Sick’ in Calvin’s Tracts: containing Treatises on the Sacraments… vol. 2, trans. Beveridge (Edinburgh, 1849), pp. 127-8 . 1600’s Westminster Assembly pp. 84-95 of Journal of the Proceedings of the Assembly of Divines… in The Whole Works of the Rev. John Lightfoot, vol. 13 This is on whether it is a function of the pastoral office to visit the sick. Taylor, Jeremy – ch. 5, ‘Of Visitation of the Sick’ in The Rules &amp; Exercises of Holy Dying: together with prayers &amp; acts of virtue to be used by sick and dying persons, or by others standing in their attendance; to which are added rules for the visitation of the sick &amp; offices proper for that ministry new ed. (Oxford: 1857), pp. 73-229 Taylor (1613-1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He is sometimes known as the “Shakespeare of Divines” for his poetic style of expression, and he is frequently cited as one of the greatest prose writers in the English language. Swinnock, George – ‘A Good Wish about the Visitation of the Sick’ in Works, 3:24-37 (d. 1673) This is a prayer that we, pastors specifically, may be more dutiful in visiting the sick, etc. Poole, Matthew – ‘How Ministers or Christian Friends may and ought to apply themselves to Sick Persons, for their Good, and the Discharge of their Own Conscience’ in Puritan Sermons, vol. 1 on Job 23:23-24 Stearne, John – The Curate’s Manual, with Reference to the Sick &amp; Dying, from the Latin of John Stearne, Vicar of Trim in the 17th Century, with Additions, Original &amp; Selected by the Rev. Kirby Trimmer… (1697; London, 1840) ToC Stearne (1660-1745) was an Anglican bishop. His original work was Tractatus de Visitatione Infirmorum (Dublin, 1697; London, 1700, several editions). . 1800’s Ely, Ezra Stiles – Visits of Mercy, being the Journal of the Stated Preacher to the Hospital and Alms House in the City of New York, 1811, vols. 1, 2 (New York, 1813) Ely (1786-1861) was an American presbyterian minister during the Second Great Awakening. Wells, John D. – The Pastor in the Sick-Room, Three Lectures delivered at Princeton Theological Seminary, March, 1892 (Philadelphia: Pres. Board of Publication, 1893) 130 pp. Wells (1815-1903) was a graduate of Old Princeton in 1844 and learned “at the feet of Dr. Archibald Alexander, Dr. Samuel Miller, Dr. Charles Hodge and Dr. Joseph Addison Alexander, all of blessed memory.</p></blockquote>

ns. Beveridge (Edinburgh, 1849), pp. 127-8 . 1600’s Westminster Assembly pp. 84-95 of Journal of the Proceedings of the Assembly of Divines… in The Whole Works of the Rev. John Lightfoot, vol. 13 This is on whether it is a function of the pastoral office to visit the sick. Taylor, Jeremy – ch. 5, ‘Of Visitation of the Sick’ in The Rules &amp; Exercises of Holy Dying: together with prayers &amp; acts of virtue to be used by sick and dying persons, or by others standing in their attendance; to which are added rules for the visitation of the sick &amp; offices proper for that ministry new ed. (Oxford: 1857), pp. 73-229 Taylor (1613-1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He is sometimes known as the “Shakespeare of Divines” for his poetic style of expression, and he is frequently cited as one of the greatest prose writers in the English language. Swinnock, George – ‘A Good Wish about the Visitation of the Sick’ in Works, 3:24-37 (d. 1673) This is a prayer that we, pastors specifically, may be more dutiful in visiting the sick, etc. Poole, Matthew – ‘How Ministers or Christian Friends may and ought to apply themselves to Sick Persons, for their Good, and the Discharge of their Own Conscience’ in Puritan Sermons, vol. 1 on Job 23:23-24 Stearne, John – The Curate’s Manual, with Reference to the Sick &amp; Dying, from the Latin of John Stearne, Vicar of Trim in the 17th Century, with Additions, Original &amp; Selected by the Rev. Kirby Trimmer… (1697; London, 1840) ToC Stearne (1660-1745) was an Anglican bishop. His original work was Tractatus de Visitatione Infirmorum (Dublin, 1697; London, 1700, several editions). . 1800’s Ely, Ezra Stiles – Visits of Mercy, being the Journal of the Stated Preacher to the Hospital and Alms House in the City of New York, 1811, vols. 1, 2 (New York, 1813) Ely (1786-1861) was an American presbyterian minister during the Second Great Awakening. Wells, John D. – The Pastor in the Sick-Room, Three Lectures delivered at Princeton Theological Seminary, March, 1892 (Philadelphia: Pres. Board of Publication, 1893) 130 pp. Wells (1815-1903) was a graduate of Old Princeton in 1844 and learned “at the feet of Dr. Archibald Alexander, Dr. Samuel Miller, Dr. Charles Hodge and Dr. Joseph Addison Alexander, all of blessed memory.”

<blockquote><p>By the diatactic [Teaching] power a Synod may institute, restore, or change, according to the condition and exigence of the Church, the external circumstances in the worship of God, and ecclesiastical discipline: I mean those circumstances which are common both to civil and sacred societies, the conveniency whereof is determinable by the light of Nature, always observing the general rules of the Word, which commands that all be done to the glory of God, that all be done to edifying, that all be done in order and decency, that we give none offence, that we support the weak, that we give no place to the enemies of the truth, nor symbolize with idolaters, etc. Now for avoiding disorder and disconformity in a nation professing one religion, it is fit that National Synods give certain directions and rules even concerning these rites and circumstances, not having therein an arbitrary or autocratorke power, but being always tied to follow the rules foresaid.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d9177e4d18" data-kw="fate Stoic">
<blockquote><p>Is the providence of God rightly called “fate,” and is a fatal necessity properly ascribed to it? We distinguish. The question is necessary that our doctrine may be freed from the calumnies of Romanists and others who continually oppose to it the tables of the fates and the fatal and Stoical necessity of all things and events.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.2.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/fate-fortune-and-chance.html">Fate, Fortune and Chance</a> › <a href="../topics/providence/fate-fortune-and-chance/contingency.html">Contingency</a></span><span class="t"><a href="../topics/the-decrees-of-god/necessity-and-contingency.html">Necessity and Contingency</a> › <a href="../topics/the-decrees-of-god/necessity-and-contingency/fate.html">Fate</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dbd64be838" data-kw="Permission Author of sin Free Will">
<blockquote><p>In evil actions, however, he so concurs as neither to effect, assist, nor approve of them, but to permit and efficaciously direct; not by infusing wickedness, but by so determining rational creatures physically to the substance of the act in the genus of being, that they (when left to themselves failing from the law) move and determine themselves to bad actions in the genus of morals, performing them freely and voluntarily (hekousiōs). Hence the guilt rests upon them alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.6.8</span></figcaption>

</figure><figure class="quote" id="q-dac24ced2c" data-kw="Affliction">
<blockquote><p>The truth is, the crook in the lot is the great engine of Providence for making men appear in their true colours, discovering both their ill and their good. And if the grace of God is in them, it will bring it out, and cause it to display itself. It so puts the Christian to his shifts, that however it makes him stagger for awhile, yet it will at length evidence both the reality and the strength of grace in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crook in the Lot</cite>, Doct. I, head III (why God makes a crook)</span></figcaption>

</figure><figure class="quote" id="q-19caa75f31" data-kw="Author of sin">
<blockquote><p>Nor does he become the author of sin by his providence, because that lawlessness is nothing except a defect of operation, of which there cannot exist an author or efficient cause, but only a deficient cause, for which reason alone, the author of sin, insofar as it is such, is the creature, by its transgressing of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §18</span></figcaption>

</figure><figure class="quote" id="q-061a365aa6" data-kw="upholds continual">
<blockquote><p>God upholds the world, and causes all those laws which he hath impressed upon every creature, to be put in execution: not as a man that makes a watch, and winds it up, and then suffers it to go of itself; but there is a continual concurrence of God to this goodly frame. For they do not only live, but move in him, or by him; his living and omnipotent power runs through every vein of the creation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on Divine Providence</span></figcaption>

<blockquote><p>As many professing Christians in the United States are about to reject the crown rights of Jesus Christ over them at the ballot-box in order to vote for a Mormon anti-christ (on the pretext that he is the lesser of two evils), Samuel Rutherford gives us the following timely reminder of the need for civil rulers to bow before the King of kings:

Then grace makes rich men parliament men, and there is a wide difference between a public man, and a public spirit. All parliament men are public men, but they are not all public spirits, else so many of them would not have deserted the public, and run away from Christ’s colours, to seek their own private idols. Men void of grace make an idol of themselves; every wicked man is wholly himself, and wholly his own; they all seek their own, not the things of Jesus Christ (Phil. 2:21). He who is for the Bridegroom, cannot be against the Bride, nor against the commonwealth. He who is a statesman of heaven, and knows savingly the fundamental laws of Jesus Christ, the power, and prerogative royal of the King of Kings; he who is acquainted with the frame and constitution of the kingdom of sin, in his own heart; he who fears God, who fears his own light, and is awed with the decrees and laws of an enlightened conscience, shall be fast for the public. And the man who sells his religion and his soul for his private ends, will soon sell his country, his parliament, the laws and liberties of the kingdom. Will he put the law of God, and the crown and sceptre of that princely Lord Jesus to the market, and will he stick, for his court and honour, to sell the laws of England, and will he forfeit heaven, and will he not forfeit you all, and your Parliament and liberties?</p></blockquote>

<blockquote><p>That, however, of which it now consists (for it must not be called immaterial) is corporeal substance. For it will be, and in part already is, the ordinary place of glorified bodies, Jn. 14:2-3; 17:24. It was visibly opened, Mt. 3:16; Acts 7:56, and was passed through by Christ ascending, Eph. 4:10. It also has its own magnitude, Jn. 14:2-3. Meanwhile, we maintain that this substance is most subtle, most lucid, and subject to no corruption, on the ground of the places: 1 Tim. 6:16; Rev. 21-22. The position of this heaven is uppermost and outermost, above all visible heavens, Dt. 4:39; Lk. 2:14; Eph. 4:10. Its circuit, moreover, is most capacious, Jn. 14:2-3.</p></blockquote>

</figure><figure class="quote" id="q-16aaad586b" data-kw="">
<blockquote><p>In fact we assert from Scripture that the pious who have died under either of both testaments are not enjoying some heavenly joy apart from the presence of God, as some of the great men used to think [such as Justin Martyr, Dialogue with Trypho 5 and Irenaeus, Against Heresies 2.34.1 &amp; 5.31.2], but that they are fully enjoying true and unbroken blessedness in God’s very presence. Even so we do not deny that some degree of happiness is kept aside for them until the last day, when [their souls] will be joined to their bodies. This is demonstrated by very many places of Scripture, for also David locates the place of their true blessedness as the presence of God (Psalm 26:23 and [Ps.] 84). And Paul desires ‘to depart and to be with Christ’ (Philippians 1:23); and 2 Corinthians 5:8: ‘And so we choose rather to depart from the body and go to dwell with the Lord.’ The apostle testifies that Christ is with the Father, and on the Father’s throne (Revelation 3:21; John 17:5; Hebrews 9:24). Therefore also throughout Revelation the deceased saints are placed together with the angels before the throne of God and the Lamb, so that they sing constant praises and give thanks to Him, as can be seen in Revelation 4:8, 5:8, and 7:9.</p></blockquote>

oksonline.com/on-the-beatific-vision/#:~:text=In%20fact%20we%20assert%20from%20Scripture,in%20Revelation%204%3A8%2C%205%3A8%2C%20and%207%3A9&amp;text=In%20fact%20we%20assert%20from%20Scripture%20that%20the&amp;text=be%20seen%20in%20Revelation%204%3A8%2C%205%3A8%2C%20and%207%3A9" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d616c94f53" data-kw="">
<blockquote><p>Heaven is not heaven without Christ. It is better to be in any place with Christ than to be in heaven itself without him. Paul loved to see Christ, to embrace him, and enjoy him that had done so much and suffered so much for his soul. To be with Christ is to be at the springhead of all happiness. Every creature thinks itself best in its own element, that is the place it thrives in, and enjoys its happiness in; now Christ is the element of a Christian. Again, it is far better, because to be with Christ is to have the marriage consummated. Is not marriage better than the contract? Is not home better than absence? To be with Christ is to be at home. Is not triumph better than to be in conflict? But to be with Christ is to triumph over all enemies, to be out of Satan’s reach. Is not perfection better than imperfection? Here all is but imperfect, in heaven there is perfection. Here the grace in a man is with combat of flesh and spirit, but in heaven there is pure peace, pure joy, pure grace. Grace indeed is glory here, but it is glory with conflict. Is it not much far better to die, that we may be with Christ, than to live a conflicting life here? Death is but a grim sergeant that lets us into a glorious palace, that takes off our rags, that we may be clothed with better robes, that ends all our misery, and is the beginning of all our happiness. Why should we be afraid of death? It is but a departure to a better condition. It is but as Jordan to the children of Israel, by which they passed to Canaan. Of itself it is an enemy indeed, but now it is harmless, nay, now it has become a friend. It is one part of the church’s journey. It ends all our misery and sin; and it is the suburbs of heaven. It is a shame for Christians to be afraid of that which Paul makes the object of his desire (Phil. 1:23).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Heaven is not heaven without Christ. It is better to be in any place with Christ than to be in heaven itself without him. Paul loved to see Christ, to embrace him, and enjoy him that had done so much and suffered so much for his soul. To be with Christ is to be at the springhead of all happiness. Every creature thinks itself best in its own element, that is the place it thrives in, and enjoys its happiness in; now Christ is the element of a Christian. Again, it is far better, because to be with Christ is to have the marriage consummated. Is not marriage better than the contract? Is not home better than absence? To be with Christ is to be at home. Is not triumph better than to be in conflict? But to be with Christ is to triumph over all enemies, to be out of Satan’s reach. Is not perfection better than imperfection? Here all is but imperfect, in heaven there is perfection. Here the grace in a man is with combat of flesh and spirit, but in heaven there is pure peace, pure joy, pure grace. Grace indeed is glory here, but it is glory with conflict. Is it not much far better to die, that we may be with Christ, than to live a conflicting life here? Death is but a grim sergeant that lets us into a glorious palace, that takes off our rags, that we may be clothed with better robes, that ends all our misery, and is the beginning of all our happiness. Why should we be afraid of death? It is but a departure to a better condition. It is but as Jordan to the children of Israel, by which they passed to Canaan. Of itself it is an enemy indeed, but now it is harmless, nay, now it has become a friend. It is one part of the church’s journey. It ends all our misery and sin; and it is the suburbs of heaven. It is a shame for Christians to be afraid of that which Paul makes the object of his desire (Phil. 1:23).”

— Richard Sibbes, David B. MacKinnon, ed., Refreshment for the Soul: A Year of Daily Readings From ‘The Heavenly Doctor’ Richard Sibbes (The Banner of Truth, 2022), 30.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHeaven+is+not+heaven+without+Christ.+It+is+better+to+be+in+any+place+with+Christ+than+to+be+in+heaven+itself+without+him.+Paul+loved+to+see+Christ%2C+to+embrace+him%2C+and+enjoy+him+that+had+done+so+much+and+suffered+so+much+for+his+soul.+To+be+with+Christ+is+to+be+at+the+springhead+of+all+happiness.+Every+creature+thinks+itself+best+in+its+own+element%2C+that+is+the+place+it+thrives+in%2C+and+enjoys+its+happiness+in%3B+now+Christ+is+the+element+of+a+Christian.+Again%2C+it+is+far+better%2C+because+to+be+with+Christ+is+to+have+the+marriage+consummated.+Is+not+marriage+better+than+the+contract%3F+Is+not+home+better+than+absence%3F+To+be+with+Christ+is+to+be+at+home.+Is+not+triumph+better+than+to+be+in+conflict%3F+But+to+be+with+Christ+is+to+triumph+over+all+enemies%2C+to+be+out+of+Satan%E2%80%99s+reach.+Is+not+perfection+better+than+imperfection%3F+Here+all+is+but+imperfect%2C+in+heaven+there+is+perfection.+Here+the+grace+in+a+man+is+with+combat+of+flesh+and+spirit%2C+but+in+heaven+there+is+pure+peace%2C+pure+joy%2C+pure+grace.+Grace+indeed+is+glory+here%2C+but+it+is+glory+with+conflict.+Is+it+not+much+far+better+to+die%2C+that+we+may+be+with+Christ%2C+than+to+live+a+conflicting+life+here%3F+Death+is+but+a+grim+sergeant+that+lets+us+into+a+glorious+palace%2C+that+takes+off+our+rags%2C+that+we+may+be+clothed+with+better+robes%2C+that+ends+all+our+misery%2C+and+is+the+beginning+of+all+our+happiness.+Why+should+we+be+afraid+of+death%3F+It+is+but+a+departure+to+a+better+condition.+It+is+but+as+Jordan+to+the+children+of+Israel%2C+by+which+they+passed+to+Canaan.+Of+itself+it+is+an+enemy+indeed%2C+but+now+it+is+harmless%2C+nay%2C+now+it+has+become+a+friend.+It+is+one+part+of+the+church%E2%80%99s+journey.+It+ends+all+our+misery+and+sin%3B+and+it+is+the+suburbs+of+heaven.+It+is+a+shame+for+Christians+to+be+afraid+of+that+which+Paul+makes+the+object+of+his+desire+%28Phil.+1%3A23%29.%E2%80%9D%0A%0A%E2%80%94+Richard+Sibbes%2C+David+B.+MacKinnon%2C+ed.%2C+Refreshment+for+the+Soul%3A+A+Year+of+Daily+Readings+From+%E2%80%98The+Heavenly+Doctor%E2%80%99+Richard+Sibbes+%28The+Banner+of+Truth%2C+2022%29%2C+30.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd616c94f53.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d616c94f53.html">Permalink</a><a class="src" href="https://heidelblog.net/2026/07/sibbes-heaven-is-not-heaven-without-christ/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>I come now to my third [point]: that it is lawful to do good works intuitu mercedis, ‘with an eye or respect to the recompense of reward’. It is plain that Nehemiah here did so: “Remember me, O my God, concerning this,” etc. [Neh. 13:14] So did Moses, of whom it is said that he chose rather to suffer affliction with the people of God than to enjoy the pleasures of sin for a season; esteeming the reproach of Christ greater riches than the treasures of Egypt(Heb. 11:25–26), for, says the text, [Greek] (aspiciebat or intuebatur) [Greek], he had respect unto the recompense of reward. And, I confess, it seems an unreasonable thing to me [1] that that which is made the end (though but in part) of the action should not be at all looked unto by the agent; whereas finis is principium actionis [‘the end is the principle of the action]; and [2] that that which God has promised unto us as an encouragement, to make us work with the more alacrity, should not be thought on nor looked to in our working. Do not they who would persuade this go the way to discourage men from good works, by removing out of their sight the encouragement which God has given them? But they object, the obedience of God’s children ought to be filial, that is, free, and not mercenary, as that of hirelings. I answer: obedience which is only for reward, without all respect or motive of love and duty, is the obedience of a hireling; not that which acknowledges the tie of obedience-absolute, and the reward no otherwise due than of his Father’s free love and bounty, as every true child of God does, and ought to do. They object again that of the apostle, 1 Cor. 13:5, “Charity seeks not her own.” Now, say they, the works of God’s children must proceed from love and charity. I answer: what though charity seeks not her own? May not yet a charitable man so much as look or hope for his own, or have an eye to what is promised him? But this place is altogether misapplied and abused: for that property of charity now mentioned (as some also of the rest in that chapter) concerns only our charity towards men, and not our charity towards God; the meaning thereof being that a charitable man will sooner lose his own than, by seeking or contending for it, break the bond of charity.</p></blockquote>

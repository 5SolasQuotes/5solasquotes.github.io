<main class="wrap"><figure class="quote" id="q-049f8a4265" data-kw="">
<blockquote><p>Verse 20. ‘And the Lord hearkened to Hezekiah, and healed the people.’ That is, He sanctified them by his Spirit in an extraordinary way; or, He did not punish them, but forgive them that their infirmity, and accepted them as if they had been purified. Verse 22. ‘And Hezekiah spake comfortably to all the Levites, that taught the good knowledge of the Lord.’ That is, he encouraged them in their work, and gave them hope of God’s mercy to the people as concerning those that had eaten the Passover and were not cleansed according to the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-jackson.html">Arthur Jackson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon the Remaining Historical Part of the Old Testament... (Cambridge, 1646) Jackson (1593?-1666) was an English clergyman of strong presbyterian and royalist views; he was ejected in the Great Ejection of 1662. | on 2 Chron. 30, vv. 20 &amp; 22</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-dd7b17c97f" data-kw="">
<blockquote><p>Verse 17… ‘Why did ye not eat?’ They ought to eat this he-goat, Lev. 6:16, which, when they were not able on account of grief, they supposed was to be burned ([Cornelius] Lapide). … Verse 19… ‘How was I able to eat, etc.?’… that is to say, I was not, therefore, worthy or fit, who should eat. See Dt. 12:7; 26:14; Hos. 9:4 ([Henry] Ainsworth). Therefore, it was to be burned, as was done with the rest (Bonfrerius)… Some maintain that Aaron justifies himself (thus Lyra, Bonfrerius). This does not satisfy; for Moses blames this. It was rather a mitigation of the crime, than a just defense ([Andrew] Willet)… Verse 20: ‘And when Moses heard that, he was content’; ‘He received satisfaction’ Hebrew: ‘it was good, etc.’ Moses received the excuse as just (Menochius, Lapide, Ainsworth). For often the letter of the Law yields to necessities: 2 Chron. 30:18, etc.; Mt. 12:3, 4 (Ainsworth). [Others deny this:] Rather in human compassion he tolerates the infirmities of Aaron (Willet out of [Martin Cellarius] Borrhaus [d. 1564]). Because Aaron had recognized the defect, and because he was unwilling to add affliction to the afflicted (Lyra); and he discerned that the evil was lesser (Willet out of Calvin).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Synopsis of Interpreters, on Lev. 10 in The Exegetical Labors of the Reverend Matthew Poole, vol. 6 (VA: Master Poole Publishing, 2011)</cite>, pp. 152-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

ia=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dd7b17c97f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Verse%2017%E2%80%A6%20%E2%80%98Why%20did%20ye%20not,was%20lesser%20%28Willet%20out%20of%20Calvin%29." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2ae1b34237" data-kw="">
<blockquote><p>In like manner is Rahab commended as one that by reason of her faith and works perished not with them which obeyed not, when she had received the spies peaceably. Yet if we look into the story, we shall easily discern a great deal of infirmity in that very work of love and mercy, by which she got the testimony of such a notable faith: for she bewrayed much unbelief in making a lie to preserve the spies in safety… So the angel (as is recorded in the Gospel) rebuked those good and faithful women, for that they sought the living among the dead: yet… He is risen again, as He foretold you that He would: yet herein does your uprightness appear, that you hold out still in the love and profession of Christ, even now, when He is in such disgrace and dislike… Thus we may perceive how favourable the Lord is towards his children that offend not upon set purpose and presumptuously: but through Satan’s instigation or through human frailty… This makes for the confutation of their error: 1. That think they have no calling to come to the sacrament because they see more and greater faults in themselves than they can espie, or then, indeed, there are in many other Christians… They find so much hypocrisy, so much pride, so much vain-glory and self-love… that they… begin to fear that God will in no sort accept of them, if they should come unto the table of his Son… and therefore [these things] should by no means keep them from the holy sacrament… Further, [2.] those that by reason of their infirmities will forgoe that ordinance do greatly dishonor God and lay an hard imputation upon Him, as who should say that He were such an extreme and rigorous Judge as will accept of none but of those that have attained to a great measure of perfection. Besides, [3.]… they have a calling to partake of the sacrament, as appears in this text… all such as prepared their whole hearts (that is, did their best endeauour with a true and sincere heart) to seek the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20 | (London, 1610), 4th Sermon</cite>, pp. 125-28</span></figcaption>

</figure><figure class="quote" id="q-98709b5b6d" data-kw="">
<blockquote><p>That the Word and sacraments are not administered rightly and exactly, secundum [in Latin], as altogether agreeing with the prescript of the Lord, no not in all the world; yet albeit they be not administred according to that exact rule, and by reason of our frailty cannot be suddenly reformed, yet may they be so performed that they may be pleasing unto God and healthfull to the Church, yet so as the defect should be lamented and acknowledged; which point if it be not granted, there will be no pure or true Church in all the world; Zachary Ursinus, Catechism, pt. 2, to question 84, fol. 620. That albeit many evil things do go along and be done, yet these things are done by such as hinder reformation, and by the disobedient; not by such as wish and sue for amendment: For ‘blessed are they who hunger and thirst after righteousness,’ Mt. 5:6, (that is) which do desire good things to be done in the Church, which if they be not done it is not their fault: they may in that case retain a good conscience; Ursinus, ibid., fol. 618.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“That the Word and sacraments are not administered rightly and exactly, secundum [in Latin], as altogether agreeing with the prescript of the Lord, no not in all the world; yet albeit they be not administred according to that exact rule, and by reason of our frailty cannot be suddenly reformed, yet may they be so performed that they may be pleasing unto God and healthfull to the Church, yet so as the defect should be lamented and acknowledged; which point if it be not granted, there will be no pure or true Church in all the world; Zachary Ursinus, Catechism, pt. 2, to question 84, fol. 620. That albeit many evil things do go along and be done, yet these things are done by such as hinder reformation, and by the disobedient; not by such as wish and sue for amendment: For ‘blessed are they who hunger and thirst after righteousness,’ Mt. 5:6, (that is) which do desire good things to be done in the Church, which if they be not done it is not their fault: they may in that case retain a good conscience; Ursinus, ibid., fol. 618.”

— John Sprint, Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623) | ‘Reformed Practices’, pp. 119-20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+the+Word+and+sacraments+are+not+administered+rightly+and+exactly%2C+secundum+%5Bin+Latin%5D%2C+as+altogether+agreeing+with+the+prescript+of+the+Lord%2C+no+not+in+all+the+world%3B+yet+albeit+they+be+not+administred+according+to+that+exact+rule%2C+and+by+reason+of+our+frailty+cannot+be+suddenly+reformed%2C+yet+may+they+be+so+performed+that+they+may+be+pleasing+unto+God+and+healthfull+to+the+Church%2C+yet+so+as+the+defect+should+be+lamented+and+acknowledged%3B+which+point+if+it+be+not+granted%2C+there+will+be+no+pure+or+true+Church+in+all+the+world%3B+Zachary+Ursinus%2C+Catechism%2C+pt.+2%2C+to+question+84%2C+fol.+620.+That+albeit+many+evil+things+do+go+along+and+be+done%2C+yet+these+things+are+done+by+such+as+hinder+reformation%2C+and+by+the+disobedient%3B+not+by+such+as+wish+and+sue+for+amendment%3A+For+%E2%80%98blessed+are+they+who+hunger+and+thirst+after+righteousness%2C%E2%80%99+Mt.+5%3A6%2C+%28that+is%29+which+do+desire+good+things+to+be+done+in+the+Church%2C+which+if+they+be+not+done+it+is+not+their+fault%3A+they+may+in+that+case+retain+a+good+conscience%3B+Ursinus%2C+ibid.%2C+fol.+618.%E2%80%9D%0A%0A%E2%80%94+John+Sprint%2C+Cassander+Anglicanus%2C+showing+the+Necessity+of+Conformity+to+the+Prescribed+Ceremonies+of+our+Church+in+Case+of+Deprivation+%28London%3A+Bill%2C+1623%29+%7C+%E2%80%98Reformed+Practices%E2%80%99%2C+pp.+119-20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F98709b5b6d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/98709b5b6d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=That%20the%20Word%20and%20sacraments%20are,good%20conscience%3B%20Ursinus%2C%20ibid.%

<blockquote><p>The Divine Will, Antecedent and Consequent ‘The will.’ says St. Thomas (Ia, q. 19, a. 6, ad 1), ‘is related to things as they are in themselves, with all their particular circumstances. Hence we will a thing simply (simpliciter) when we will it with all its concrete circumstances. This will we call the consequent will… Thus it is clear that everything which God wills simpliciter comes to pass. If, on the contrary, we will a thing in itself good, but independently of its circumstances, this will is called the antecedent will, or conditional will, since the good in question is not realized here and now. That man should live, says St. Thomas (Ibid.), is good. But if the man is a murderer, it is good that he be executed. Antecedently, God wills that harvests come to maturity, but He allows for some higher good, that not all harvests do in fact mature. Similarly, He wills antecedently the salvation of all men, tough for some higher good, of which He alone is judge, He permits some to sin and perish… It is thus that St. Thomas harmonizes God’s antecedent will, of which St. John Damascene speaks, with God’s omnipotence. . The Supreme Principles Nothing comes to pass, either in heaven or on earth, unless God either brings it to pass in mercy, or then in justice permits it. This principle, taught in the universal Church, shows that there is in God a conditional and antecedent will, relative to a good which does not come to pass, the privation of which He permits in view of some higher good. … All that God wills, He does. This principle has no exception. All that God wills (purely, simply, unconditionally) comes to pass without our freedom being thereby in any way forced, because God moves that freedom sweetly and strongly, actualizing it, not destroying. He wills efficaciously that we freely consent and we do free consent. The supreme efficacy of divine causality, says St. Thomas (Ia, q. 19, a. 6), extends to the free mode of our acts… Hence we find that in the ninth century, to terminate the long controversy with Gottschalk, the Council of Thuzey (860), at the instance of the Augustinian bishops, harmonized God’s will of universal salvation with the sinner’s responsibility. That Council’s synodal letter (OL, CXXVI, 123; Denz., 17th ed., p. 145, no. 320, note 2.) contains this sentence: Whatever He has willed in heaven or on earth, God has done. For nothing comes to pass in heaven or on earth that He does not in mercy bring to pass or permits to come to pass in justice. Since God’s love is the cause of created goodness, says St. Thomas (Ia, q. 20, a. 3), no created thing would be better than another, if God did not give one a great[er] good than He gives to another. This is equivalent to St. Paul’s word: What has thou that thou hast not received? (1 Cor. 4:7)</p></blockquote>

<blockquote><p>In the next place you [Thomas Jackson, an Arminian] touch upon a distinction much talked of, and as much advanced by some as cried down by others. Yet both Scotus and Durandus give a tolerable, and Aquinas with the Dominicans after him, an orthodox interpretation thereof, though neither suitable to the mind of [John] Damascene, commonly reputed the father of it. Yet look what in this kind is wanting in them is supplied by [Gregory] Arminiensis, who gives both an orthodox construction thereof, and that also in conformity to the opinion of Damascene, of whose text he gives a very sound and orthodox interpretation and the more orthodox the more opposite to their constructions who, with great cry of words draw it to the countenancing of their Arminian tenets without cause. Love, you say, is the fruit of God’s antecedent will, wrath and severity are the proper effects of his consequent will. Fruit and effect you make all one (as with good reason you may). Now what, I pray you, is this effect which you call love? You seem to intimate that they are the effects of creation, as when you say, ‘Every particular faculty of soul or body is a pledge undoubted of God’s love.’ Yet faculties of souls and bodies are found in beasts, but God’s antecedent will in Damascene is referred wholly unto men. Neither does Damascene at all refer it to the work of creation, but makes it to be that whereby God will have all to be saved. Liberty of will is proper to man in distinction from beasts, but who sees not that this indifferently makes him obnoxious unto damnation as well as capable of salvation? Then when you say wrath and severity is the effect of God’s consequent will, what do you mean by ‘wrath’? Is it either a resolution to take vengeance, or the execution of vengeance itself? I think you take it for the execution of vengeance itself. Now there is an execution of reward also properly opposite unto this which, whether it be the same love you speak of, it became you to express so much, or whether you conceive it to be different, yet it were fit you should take notice of it and acknowledge that this is a fruit of God’s consequent will as well as wrath; that as effectually presupposing obedience, as this disobedience: and that love in rewarding is every way as infallibly consequent to the obeying of God’s will revealed as wrath is of our neglecting and despising it. A full explication of this distinction you promise in good time; how well you perform it we may in good time consider with God’s help. Next you enter upon another form of the same distinction (as you pretend) and you suffer it to fly with one wing, for you talk of God’s absolute will (which you seem to confound with God’s antecedent will), but as touching the member congruously opposite, you leave us to seek for that. But as it is we are to consider it: God’s absolute will was (you say) to have men capable of Heaven and Hell, of joys and miseries immortal. This cannot be understood of God’s consequent will; for this absolute will is indifferent to end in the bestowing of reward or punishment, and is immediately terminated only in making man capable of either; but his consequent will is not so indifferent. For the only effect thereof you mention to be wrath and severity, and this presupposes rather than causes capableness. Neither can this absolute will be the antecedent will of God according to Damascene’s meaning. For the antecedent will in Damascene is only referred to the will of God, whereby He wills man’s salvation: but this absolute will is (you say) to have men capable of Heaven and Hell. To help this, you tell us that this absolute will (whose possible objects are two) is in the first place set on man’s eternal joy. But you do not proceed to show on what it is set in the next place, as if by such like incongruities you desired rather to confound your reader [rather] than to satisfy him. Yet by the tenor of your discourse you leave it to us to guess that in the second place, to wit upon the despising of God’s love, it is set upon a man’s damnation. So that by this your doctrine, both God’s antecedent will and consequent will is all one, and that is God’s absolute will. But no such thing is found in Damascene, from whom, such as you are, do usually take this distinction of will antecedent in God and will consequent: And indeed you do well to make one as absolute as another; for like as wrath, the fruit of this will of God in the second place (as you imply) has not its course but upon presupposition of disobedience; so in like manner, the proper opposite to wrath on the other side, the fruit of this will of God in the first place, has not its course but upon presupposition of obedience.</p></blockquote>

3F+Is+it+either+a+resolution+to+take+vengeance%2C+or+the+execution+of+vengeance+itself%3F+I+think+you+take+it+for+the+execution+of+vengeance+itself.+Now+there+is+an+execution+of+reward+also+properly+opposite+unto+this+which%2C+whether+it+be+the+same+love+you+speak+of%2C+it+became+you+to+express+so+much%2C+or+whether+you+conceive+it+to+be+different%2C+yet+it+were+fit+you+should+take+notice+of+it+and+acknowledge+that+this+is+a+fruit+of+God%E2%80%99s+consequent+will+as+well+as+wrath%3B+that+as+effectually+presupposing+obedience%2C+as+this+disobedience%3A+and+that+love+in+rewarding+is+every+way+as+infallibly+consequent+to+the+obeying+of+God%E2%80%99s+will+revealed+as+wrath+is+of+our+neglecting+and+despising+it.+A+full+explication+of+this+distinction+you+promise+in+good+time%3B+how+well+you+perform+it+we+may+in+good+time+consider+with+God%E2%80%99s+help.+Next+you+enter+upon+another+form+of+the+same+distinction+%28as+you+pretend%29+and+you+suffer+it+to+fly+with+one+wing%2C+for+you+talk+of+God%E2%80%99s+absolute+will+%28which+you+seem+to+confound+with+God%E2%80%99s+antecedent+will%29%2C+but+as+touching+the+member+congruously+opposite%2C+you+leave+us+to+seek+for+that.+But+as+it+is+we+are+to+consider+it%3A+God%E2%80%99s+absolute+will+was+%28you+say%29+to+have+men+capable+of+Heaven+and+Hell%2C+of+joys+and+miseries+immortal.+This+cannot+be+understood+of+God%E2%80%99s+consequent+will%3B+for+this+absolute+will+is+indifferent+to+end+in+the+bestowing+of+reward+or+punishment%2C+and+is+immediately+terminated+only+in+making+man+capable+of+either%3B+but+his+consequent+will+is+not+so+indifferent.+For+the+only+effect+thereof+you+mention+to+be+wrath+and+severity%2C+and+this+presupposes+rather+than+causes+capableness.+Neither+can+this+absolute+will+be+the+antecedent+will+of+God+according+to+Damascene%E2%80%99s+meaning.+For+the+antecedent+will+in+Damascene+is+only+referred+to+the+will+of+God%2C+whereby+He+wills+man%E2%80%99s+salvation%3A+but+this+absolute+will+is+%28you+say%29+to+have+men+capable+of+Heaven+and+Hell.+To+help+this%2C+you+tell+us+that+this+absolute+will+%28whose+possible+objects+are+two%29+is+in+the+first+place+set+on+man%E2%80%99s+eternal+joy.+But+you+do+not+proceed+to+show+on+what+it+is+set+in+the+next+place%2C+as+if+by+such+like+incongruities+you+desired+rather+to+confound+your+reader+%5Brather%5D+than+to+satisfy+him.+Yet+by+the+tenor+of+your+discourse+you+leave+it+to+us+to+guess+that+in+the+second+place%2C+to+wit+upon+the+despising+of+God%E2%80%99s+love%2C+it+is+set+upon+a+man%E2%80%99s+damnation.+So+that+by+this+your+doctrine%2C+both+God%E2%80%99s+antecedent+will+and+consequent+will+is+all+one%2C+and+that+is+God%E2%80%99s+absolute+will.+But+no+such+thing+is+found+in+Damascene%2C+from+whom%2C+such+as+you+are%2C+do+usually+take+this+distinction+of+will+antecedent+in+God+and+will+consequent%3A+And+indeed+you+do+well+to+make+one+as+absolute+as+another%3B+for+like+as+wrath%2C+the+fruit+of+this+will+of+God+in+the+second+place+%28as+you+imply%29+has+not+its+course+but+upon+presupposition+of+disobedience%3B+so+in+like+manner%2C+the+proper+opposite+to+wrath+on+the+other+side%2C+the+fruit+of+this+will+of+God+in+the+first+place%2C+has+not+its+course+but+upon+presupposition+of+obedience.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+A+Discovery+of+Dr.+Jackson%E2%80%99s+Vanity%E2%80%A6+%28Amsterdam%3A+Thorp%2C+1631%29%2C+pp.+677-80&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdd4ecb3709.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dd4ecb3709.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=In%20the%20next%20place%20you%20%5BThomas,course%20but%20upon%20presupposition%20of%20obedience." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9aa4adf912" data-kw="">
<blockquote><p>Another reason is taken according to another way of distinguishing: because some are signs of the absolute divine will, others of the conditional. I say, therefore, that because one cannot act against the absolute will, one cannot act against the signs of the absolute will, such as are fulfillment and permission. But because one can act against the antecedent or conditional will, because man can turn away from the order to which he was created by his institution: hence it is that one can act against the will of the sign which signifies that, namely against prohibition, precept, and counsel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences (d. 1274), bk. 1 | dist. 47 | quest. 2, ‘Whether anyone can act against the will of the sign’</cite></span></figcaption>

<blockquote><p>The revealed will of sign, as such, teaches, illuminates, directs and obligates men to the regulation of acts, whether those regulated acts actually exist and happen, or not.</p></blockquote>

</figure><figure class="quote" id="q-b414c636c8" data-kw="">
<blockquote><p>Shall it be said that sin does not displease God; that He has no will against sin; it is not repugnant to his will? Yes; it is to his revealed will, to his law. But is that an untrue revelation? His law is not his will itself, but the signum [sign], the discovery of his will. Now, is it an insignificant sign? A sign that signifies nothing? Or to which there belongs no correspondent significatum [signification]? –nothing that is signified by it? Is that which is signified (for sure no one will say it signifies nothing) his real will, yea or no? Who can deny it? That will, then (and a most calm, sedate, impassionate will it must be understood to be), sin and consequently the consequent miseries of his creatures, are repugnant unto. … Therefore, it seems out of question, that the holy God does constantly and perpetually, in a true sense, will universal obedience, and the consequent felicity of all his creatures capable thereof; i.e. He does will it with simple complacency, as what were highly grateful to Him, simply considered by itself. Who can doubt, but that purity, holiness, blessedness, wheresoever they were to be beheld among his creatures, would be a pleasing and delightful spectacle to Him, being most agreeable to the perfect excellency, purity, and benignity of his own nature, and that their deformity and misery must be consequently unpleasing?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Redeemer’s Tears Wept Over Lost Souls, Appendix, “How God is said to Will the Salvation of them that Perish”</cite>, pp. 386-8</span></figcaption>

<main class="wrap"><figure class="quote" id="q-cc11ba6ba9" data-kw="">
<blockquote><p>And to provoke you, give me leave to give you a brief view of the hedge that God hath made about the second Commandment. The intent of that Commandment is, that God’s people should worship him with his own worship, and his own ordinances, and never dare to tender to him the devises, and traditions of men for a homage. Now the Lord knowing the itch, and proneness in men to be tampering in the worship of God, to set their thresholds by his threshold, hath set such a hedge about it, that if a man did consider it seriously, he could not but admire that ever mortal man should dare in the matter of Gods worship, to meddle any jot further than the Lord himself hath commanded: it standing like the Cherubims, and the flaming Sword, which turned every way to keep the way of the Tree of Life.

First, he is a jealous God, as if he should say, the matter of my worship is to me as the marriage bed; and I am a Husband easily provoked to jealousy, which is the rage of a man, and will accept no ransom.

Secondly, all such are said to hate God, I will visit the sins of them that hate me. They all pretend that they are lovers of him. They that made men kiss the Calves, yet would have them swear Jehovah liveth. Jeroboam pretended nothing but respect to God, and to God’s people, when he set up his Calves: so these men pretend reverence and veneration to God’s Ordinances: but God protests that they all hate him, which may appear by the odious names he gives to their sin, calling it sometimes Rebellion, as being a denying his Sovereignty, Josh. 22. 16. 22. Sometimes Apostasy, Jer. 2. 13. Sometimes Adultery, the most unpardonable sin betwixt man and wife, Ezek. 16. And sometimes Blasphemy. Isai. 65. 7.

Thirdly, it is a sin that hath vengeance, and punishment entailed upon it to the Third and fourth generation. The Jews say to this day, that there was never any calamity betided their Nation, since their coming out of Egypt, but there was an ounce of the Golden Calf in it. It is a sin that GOD fails not to visit upon Children, to the third and fourth Generation.

But now on the other side, God will shew mercy to thousands of them that love him, and keep his Commandments. How is that? The Lord interprets them to love him that purely worship him. As a man who finds his wife faithful in the marriage bed, judgeth that she loves him, and that her heart is one with his, whatever other infirmities she may have. Yea, they are interpreted to keep all his Commandments. God will trust them for all his Commandments, whom he finds faithful in his worship: Yea, to a thousand Generations, he will remember them, which is longer than this wicked world shall stand. The kindness and faithfulness of them that maintain and preserve the pure Religion and worship of God, shall ever be in the sight of God for them and their posterity.

Oh! let me help your reckoning in the day of the LORD, intreating you for the Children’s sake of your own body, to lay what I have said to heart, that you may provide that the Ordinances of God be neither taken away, nor defiled, that GOD may be purely worshipped in his own way for time to come. And that by a Generation of men, who seek only to glory in our flesh, we bee not judged our of our Religion, nor misled in such a way of service, as that God’s soul should take no pleasure in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-marshall.html">Stephen Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached before the Honourable House of Commons, now assembled in Parliament, at their public fast, November 17. 1640</cite>, (London: Samuel Man, 1641), pp 40-42.</span></figcaption>

</figure><figure class="quote" id="q-f9e2ad6028" data-kw="">
<blockquote><p>All delight arising from suitableness between the mind and the object; a mind that is truly great cannot please it self in these low things that others do: To eat and drink, gather riches, build houses, and delight themselves in these contentments of the flesh. As Sueton reports of Domitian: Who had the great affaires of the Empire to busy himself in; yet he did constantly spend some time every day in catching of flies:

But a truly noble spirit is with David considering how he may lay out himself in some great service for the glory of God, the advancement of his Ordinances, and the enlargement of the Kingdom of his dear Son. As for other things he looks upon Them as beneath him, As Themistocles after a great victory won against the Persians, walked up and down among the slain, and saw here &amp; there some great &amp; rich spoils, which he disdained to stoop for, but said to one that stood by him, Tolle haec, tu qui Themistocles non es. Let such take care of these things that have spirits fit for no higher things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-strong.html">William Strong</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The way to the highest honour: Presented in a sermon preached before the Right Honourable House of Peers, in the Abbey Church at Westminster, at their late solemn monthly fast. Feb. 24. 1646</cite>, (London: John Saywell, 1647), epistle dedicatory.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“All delight arising from suitableness between the mind and the object; a mind that is truly great cannot please it self in these low things that others do: To eat and drink, gather riches, build houses, and delight themselves in these contentments of the flesh. As Sueton reports of Domitian: Who had the great affaires of the Empire to busy himself in; yet he did constantly spend some time every day in catching of flies:

But a truly noble spirit is with David considering how he may lay out himself in some great service for the glory of God, the advancement of his Ordinances, and the enlargement of the Kingdom of his dear Son. As for other things he looks upon Them as beneath him, As Themistocles after a great victory won against the Persians, walked up and down among the slain, and saw here &amp; there some great &amp; rich spoils, which he disdained to stoop for, but said to one that stood by him, Tolle haec, tu qui Themistocles non es. Let such take care of these things that have spirits fit for no higher things.”

— William Strong, The way to the highest honour: Presented in a sermon preached before the Right Honourable House of Peers, in the Abbey Church at Westminster, at their late solemn monthly fast. Feb. 24. 1646, (London: John Saywell, 1647), epistle dedicatory.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAll+delight+arising+from+suitableness+between+the+mind+and+the+object%3B+a+mind+that+is+truly+great+cannot+please+it+self+in+these+low+things+that+others+do%3A+To+eat+and+drink%2C+gather+riches%2C+build+houses%2C+and+delight+themselves+in+these+contentments+of+the+flesh.+As+Sueton+reports+of+Domitian%3A+Who+had+the+great+affaires+of+the+Empire+to+busy+himself+in%3B+yet+he+did+constantly+spend+some+time+every+day+in+catching+of+flies%3A%0A%0ABut+a+truly+noble+spirit+is+with+David+considering+how+he+may+lay+out+himself+in+some+great+service+for+the+glory+of+God%2C+the+advancement+of+his+Ordinances%2C+and+the+enlargement+of+the+Kingdom+of+his+dear+Son.+As+for+other+things+he+looks+upon+Them+as+beneath+him%2C+As+Themistocles+after+a+great+victory+won+against+the+Persians%2C+walked+up+and+down+among+the+slain%2C+and+saw+here+%26+there+some+great+%26+rich+spoils%2C+which+he+disdained+to+stoop+for%2C+but+said+to+one+that+stood+by+him%2C+Tolle+haec%2C+tu+qui+Themistocles+non+es.+Let+such+take+care+of+these+things+that+have+spirits+fit+for+no+higher+things.%E2%80%9D%0A%0A%E2%80%94+William+Strong%2C+The+way+to+the+highest+honour%3A+Presented+in+a+sermon+preached+before+the+Right+Honourable+House+of+Peers%2C+in+the+Abbey+Church+at+Westminster%2C+at+their+late+solemn+monthly+fast.+Feb.+24.+1646%2C+%28London%3A+John+Saywell%2C+1647%29%2C+epistle+dedicatory.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff9e2ad6028.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f9e2ad6028.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/08/27/william-strong-on-great-minds

<blockquote><p>What is desired ceases to be beautiful to the extent that it is desired. The starry heaven is unspeakably beautiful, said Schopenhauer, because it is desired by no one. Beauty delights us not because it is profitable to us. Our delight in beauty is entirely disinterested. Beauty awakens the kind of movement within our faculty of desiring that creates enjoyment in pure, disinterested, beholding, whether such beholding is physical or spiritual. Truth satisfies our understanding. The good fulfills our desires and awakens our love. Beauty provides rest and delight. Materially and objectively they are one. The true, the good, and the beautiful form one unbreakable triad. All that is, in the same measure that it is, is also true, good and beautiful. This unity can disintegrate only temporarily, in this world of disharmonies… Nonetheless, these three are materially one… The true, the good, and the beautiful differ only formally, insofar as the same thing exists in a varied relationship to the rich organization of our spirit. After all, God Himself is also the truth, the holy [good], and the glory [beautiful].</p></blockquote>

</figure><figure class="quote" id="q-4aab833104" data-kw="">
<blockquote><p>Anger, as stated above (Article 1), is properly the name of a passion. A passion of the sensitive appetite is good in so far as it is regulated by reason, whereas it is evil if it set the order of reason aside. Now the order of reason, in regard to anger, may be considered in relation to two things. First, in relation to the appetible object to which anger tends, and that is revenge. Wherefore if one desire revenge to be taken in accordance with the order of reason, the desire of anger is praiseworthy, and is called “zealous anger” [Cf. Gregory, Moral. v, 45. On the other hand, if one desire the taking of vengeance in any way whatever contrary to the order of reason, for instance if he desire the punishment of one who has not deserved it, or beyond his deserts, or again contrary to the order prescribed by law, or not for the due end, namely the maintaining of justice and the correction of defaults, then the desire of anger will be sinful, and this is called sinful anger. Secondly, the order of reason in regard to anger may be considered in relation to the mode of being angry, namely that the movement of anger should not be immoderately fierce, neither internally nor externally; and if this condition be disregarded, anger will not lack sin, even though just vengeance be desired.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, 2nd pt. of 2nd pt., question 158, ‘Anger’, article 2, ‘Whether anger is a sin’</span></figcaption>

<blockquote><p>Reformed moral philosophers in the period of early orthodoxy (ca. 1550–ca. 1650) continue a medieval tradition of engaging moral questions in conversation with Aristotle’s Nicomachean Ethics, and they often address the moral status of self-love in connection with the virtue of friendship. There is broad agreement among these authors that self-love is not only not necessarily sinful, but that some kinds of self-love are morally good and that self-love is the source and rule for love of one’s neighbor. Lambert Daneau’s Ethices Christianae, however, stands in a more complex relationship to this consensus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-mcginnis.html">Andrew McGinnis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Moral Status of Self-Love in Early Reformed Ethics’ in Journal of Early Modern Christianity Ref</cite>, (2023)</span></figcaption>

<blockquote><p>Further, if people are thus unjustly charged, it may be some comfort to consider the best of Christ’s servants have been thus accused, as appears from what the apostle says, 2 Cor. 1:17-18, when it seems such as turned his enemies in that Church had charged him with lightness and changeableness in his doctrine and principles, as well as in his purposes, where, for his own vindication, he is obliged to use a sort of solemn oath, saying, ‘But as God is true, our word,’ or preaching, ‘toward you was not yea and nay.’ And Durham on Scandal (p. 176) instances this as one of the ways whereby the Devil carries on division in the Church, viz. by making people charge ministers with ‘lightness’ and ‘changeableness,’ as if they were of one mind this year and of another the next. As formerly I endeavored to contribute my mite in opposing what I judged amiss in the Church of Scotland, so, through grace, I hope to continue and cannot see a shadow of reason to imagine but it is as acceptable to God, and much more acceptable to Him to oppose what may be amiss in her conduct, in a way of Church-communion, as in a separate state, ‘Separation’ (as the Protesters say) ‘being highly impedimental to reformation.’ (Rep. to Ass., 1652) I know every Christian, and ministers of the Gospel, in a special manner, ought to be very cautious, guarding against giving offense to any of Christ’s little ones, but if they will take offense at doing what is plain present duty, though they are to be pitied and used tenderly, yet they are not to be regarded so as to omit duty for fear they take offense. When the great apostle of the gentiles opposed Peter, and other saints, who pretending greater strictness, did separate from the gentile converts, he knew his conduct in that would offend many who were dear unto the Lord; yet he regarded not their offense, but ‘withstood Peter to the face, because he was to be blamed.’ (Gal. 2:11-14) Our Lord Jesus knew his healing and curing diseased persons on the Sabbath would occasion such as watched him (Mk. 3:2) to take offense; He also knew his familiar converse with publicans and sinners would be stumbling and offensive to sundry; yet he would not forbear it. Sometimes we are called to deny ourselves as to our ease, conveniency, pleasure and satisfaction rather than occasion the offending of such as causelessly take offense, but, according to our Lord’s example, commanded present duty is to be done, let never so many stumble or be offended. Hence [Matthew] Henry says (on Mk. 2:16), ‘Those are too tender of their own good name who, to preserve it with some nice people, will decline a good work; Christ would not do so.’ And tender Christians, who may be ready to take offense, ought to consider what danger there is in being ‘righteous over much.’ If the prophetess Miriam, or Aaron, the saint of God, speak against Moses, his Lord will resent it, asking ‘Wherefore were ye not afraid to speak against my servant Moses?’ (Num. 12:8) Now, for doing what, in my opinion, is plain present duty in this case, viz. the opposing what I take to be sinful schism, though I should further suffer in my reputation from some, yet ’tis some satisfaction to think in this I’m far from being singular; for here I suffer with a cloud of faithful witnesses, as…</p></blockquote>

— John Currie, A Vindication of the Real Reformation-Principles of the Church of Scotland concerning Separation, etc.... (Edinburgh: A. Alison, 1740), To the Reader, pp. viii-ix">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFurther%2C+if+people+are+thus+unjustly+charged%2C+it+may+be+some+comfort+to+consider+the+best+of+Christ%E2%80%99s+servants+have+been+thus+accused%2C+as+appears+from+what+the+apostle+says%2C+2+Cor.+1%3A17-18%2C+when+it+seems+such+as+turned+his+enemies+in+that+Church+had+charged+him+with+lightness+and+changeableness+in+his+doctrine+and+principles%2C+as+well+as+in+his+purposes%2C+where%2C+for+his+own+vindication%2C+he+is+obliged+to+use+a+sort+of+solemn+oath%2C+saying%2C+%E2%80%98But+as+God+is+true%2C+our+word%2C%E2%80%99+or+preaching%2C+%E2%80%98toward+you+was+not+yea+and+nay.%E2%80%99+And+Durham+on+Scandal+%28p.+176%29+instances+this+as+one+of+the+ways+whereby+the+Devil+carries+on+division+in+the+Church%2C+viz.+by+making+people+charge+ministers+with+%E2%80%98lightness%E2%80%99+and+%E2%80%98changeableness%2C%E2%80%99+as+if+they+were+of+one+mind+this+year+and+of+another+the+next.+As+formerly+I+endeavored+to+contribute+my+mite+in+opposing+what+I+judged+amiss+in+the+Church+of+Scotland%2C+so%2C+through+grace%2C+I+hope+to+continue+and+cannot+see+a+shadow+of+reason+to+imagine+but+it+is+as+acceptable+to+God%2C+and+much+more+acceptable+to+Him+to+oppose+what+may+be+amiss+in+her+conduct%2C+in+a+way+of+Church-communion%2C+as+in+a+separate+state%2C+%E2%80%98Separation%E2%80%99+%28as+the+Protesters+say%29+%E2%80%98being+highly+impedimental+to+reformation.%E2%80%99+%28Rep.+to+Ass.%2C+1652%29+I+know+every+Christian%2C+and+ministers+of+the+Gospel%2C+in+a+special+manner%2C+ought+to+be+very+cautious%2C+guarding+against+giving+offense+to+any+of+Christ%E2%80%99s+little+ones%2C+but+if+they+will+take+offense+at+doing+what+is+plain+present+duty%2C+though+they+are+to+be+pitied+and+used+tenderly%2C+yet+they+are+not+to+be+regarded+so+as+to+omit+duty+for+fear+they+take+offense.+When+the+great+apostle+of+the+gentiles+opposed+Peter%2C+and+other+saints%2C+who+pretending+greater+strictness%2C+did+separate+from+the+gentile+converts%2C+he+knew+his+conduct+in+that+would+offend+many+who+were+dear+unto+the+Lord%3B+yet+he+regarded+not+their+offense%2C+but+%E2%80%98withstood+Peter+to+the+face%2C+because+he+was+to+be+blamed.%E2%80%99+%28Gal.+2%3A11-14%29+Our+Lord+Jesus+knew+his+healing+and+curing+diseased+persons+on+the+Sabbath+would+occasion+such+as+watched+him+%28Mk.+3%3A2%29+to+take+offense%3B+He+also+knew+his+familiar+converse+with+publicans+and+sinners+would+be+stumbling+and+offensive+to+sundry%3B+yet+he+would+not+forbear+it.+Sometimes+we+are+called+to+deny+ourselves+as+to+our+ease%2C+conveniency%2C+pleasure+and+satisfaction+rather+than+occasion+the+offending+of+such+as+causelessly+take+offense%2C+but%2C+according+to+our+Lord%E2%80%99s+example%2C+commanded+present+duty+is+to+be+done%2C+let+never+so+many+stumble+or+be+offended.+Hence+%5BMatthew%5D+Henry+says+%28on+Mk.+2%3A16%29%2C+%E2%80%98Those+are+too+tender+of+their+own+good+name+who%2C+to+preserve+it+with+some+nice+people%2C+will+decline+a+good+work%3B+Christ+would+not+do+so.%E2%80%99+And+tender+Christians%2C+who+may+be+ready+to+take+offense%2C+ought+to+consider+what+danger+there+is+in+being+%E2%80%98righteous+over+much.%E2%80%99+If+the+prophetess+Miriam%2C+or+Aaron%2C+the+saint+of+God%2C+speak+against+Moses%2C+his+Lord+will+resent+it%2C+asking+%E2%80%98Wherefore+were+ye+not+afraid+to+speak+against+my+servant+Moses%3F%E2%80%99+%28Num.+12%3A8%29+Now%2C+for+doing+what%2C+in+my+opinion%2C+is+plain+present+duty+in+this+case%2C+viz.+the+opposing+what+I+take+to+be+sinful+schism%2C+though+I+should+further+suffer+in+my+reputation+from+some%2C+yet+%E2%80%99tis+some+satisfaction+to+think+in+this+I%E2%80%99m+far+from+being+singular%3B+for+here+I+suffer+with+a+cloud+of+faithful+witnesses%2C+as%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+John+Currie%2C+A+Vindication+of+the+Real+Reformation-Principles+of+the+Church+of+Scotland+concerning+Separation%2C+etc....+%28Edinburgh%3A+A.+Alison%2C+1740%29%2C+To+the+Reader%2C+pp.+viii-ix&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F645fa28869.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/645fa28869.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-scandal/#:~:text=Further%2C%20if%20people%20are%20thus%20unjustly,a%20cloud%20of%20faithful%20witnesses%2C%20as&amp;text=Further%2C%20if%20people%20are%20thus%20unjustly%20charged%2C%20it&amp;text=suffer%20with%20a%20cloud%20of%20faithful%20witnesses%2C%20as" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-e983214fe0" data-kw="infinity greatness">
<blockquote><p>The infinity of God follows his simplicity and is equally diffused through the other attributes of God, and by it the divine nature is conceived as free from all limit in imperfection: as to essence (by incomprehensibility) and as to duration (by eternity) and as to circumscription, in reference to place (by immensity).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.8.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a> › <a href="../topics/attributes-of-god/infinity-and-immensity/greatness.html">Greatness</a></span></div>
<div class="actions"><button class="copy" data-copy="“The infinity of God follows his simplicity and is equally diffused through the other attributes of God, and by it the divine nature is conceived as free from all limit in imperfection: as to essence (by incomprehensibility) and as to duration (by eternity) and as to circumscription, in reference to place (by immensity).”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a96a7c4a35" data-kw="will necessary free">
<blockquote><p>Does God will some things necessarily and others freely? We affirm. Because good is either uncreated and infinite or finite and created, a twofold object can be assigned to the will: a primary (viz., God) as the infinite good; but the secondary (all created things out of God). Himself, indeed, necessarily by complacency, but all other things freely by decree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.14.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a> › <a href="../topics/attributes-of-god/will-of-god/free-and-necessary-will.html">Free and necessary will</a></span></div>
<div class="actions"><button class="copy" data-copy="“Does God will some things necessarily and others freely? We affirm. Because good is either uncreated and infinite or finite and created, a twofold object can be assigned to the will: a primary (viz., God) as the infinite good; but the secondary (all created things out of God). Himself, indeed, necessarily by complacency, but all other things freely by decree.”

— Francis Turretin, Institutes of Elenctic Theology, 3.14.1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDoes%20God%20will%20some%20things%20necessarily%20and%20others%20freely%3F%20We%20affirm.%20Because%20good%20is%20either%20uncreated%20and%20infinite%20or%20finite%20and%20created%2C%20a%20twofold%20object%20can%20be%20assigned%20to%20the%20will%3A%20a%20primary%20%28viz.%2C%20God%29%20as%20the%20infinite%20good%3B%20but%20the%20secondary%20%28all%20created%20things%20out%20of%20God%29.%20Himself%2C%20indeed%2C%20necessarily%20by%20complacency%2C%20but%20all%20other%20things%20freely%20by%20decree.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.14.1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa96a7c4a35.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a96a7c4a35.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-347ef5d07d" data-kw="">
<blockquote><p>Love of necessity involves feeling, and if there be no feeling in God, there can be no love. That He produces happiness is no proof of love. The earth does that unconsciously and without design. … He may be cold, insensible, indifferent, or even unconscious; He ceases to be God in the sense of the Bible, and in the sense in which we need a God, unless He can love as well as know and act. … We must adhere to the truth in its Scriptural form, or we lose it altogether. We must believe that God is love in the sense in which that word comes home to every human heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, pt. 1, ch. 5, § 13, “The Goodness of God” (“Love”)</span></figcaption>

</figure><figure class="quote" id="q-3906a14668" data-kw="foreknowledge contingents">
<blockquote><p>Do all things fall under the knowledge of God, both singulars and future contingencies? We affirm against Socinus. He knows all things perfectly, undividedly, distinctly and immutably. Perfectly because he knows all things by himself or by his essence. Undividedly, because he knows all things intuitively and noetically, not discursively and dianoetically.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.12.1–2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a> › <a href="../topics/attributes-of-god/knowledge-and-wisdom/foreknowledge.html">Foreknowledge</a></span><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a> › <a href="../topics/attributes-of-god/knowledge-and-wisdom/knowledge-of-future-contingents.html">Knowledge of future contingents</a></span></div>
<div class="actions"><button class="copy" data-copy="“Do all things fall under the knowledge of God, both singulars and future contingencies? We affirm against Socinus. He knows all things perfectly, undividedly, distinctly and immutably. Perfectly because he knows all things by himself or by his essence. Undividedly, because he knows all things intuitively and noetically, not discursively and dianoetically.”

</figure><figure class="quote" id="q-f2494a6812" data-kw="Contentment Wisdom">
<blockquote><p>We, indeed, look at things by pieces, we look at one detail and do not consider the relation that one thing has to another, but God looks at all things at once, and sees the relation that one thing has to another. When a child looks at a clock, it looks first at one wheel, and then at another wheel: he does not look at them all together or the dependence that one has upon another; but the workman has his eyes on them all together and sees the dependence of all, one upon another: so it is in God&#x27;s providence. Now notice how this works to contentment: when a certain passage of providence befalls me, that is one wheel, and it may be that if this wheel were stopped, a thousand other things might come to be stopped by this. In a clock, stop but one wheel and you stop every wheel, because they are dependant upon one another. So when God has ordered a thing for the present to be thus and thus, how do you know how many things depend upon this thing? God may have some work to do twenty years hence that depends on this passage of providence that falls out this day or this week.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rare Jewel of Christian Contentment</cite>, ch. 3, Lesson 9 (variety and order of providence)</span></figcaption>

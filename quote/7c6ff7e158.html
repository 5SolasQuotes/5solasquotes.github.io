</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ad9c349332" data-kw="">
<blockquote><p>What cannot warrant a breach where there is union, that cannot warrantably be the ground to keep up a division; Now there are many miscarriages or defects, which are really gross, and yet will not warrant a schism, as all that write thereon do clear, and is obvious to all. The reason of the consequence is, because making up of a breach is no less a duty than preventing thereof; and further, if it began upon such a ground, then the continuing thereof upon the same ground is but the continuing in the same sin; and it cannot be thought that any party by dividing upon an unjust ground can afterward be justified upon the same ground; It remains therefore, that if the ground was not sufficient at first to warrant a separation or division, it cannot be sufficient afterward to continue the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, ... (Edinburgh: Higgins, 1659), pt. 4, ch. 7, p. 320</span></figcaption>

<blockquote><p>…this penetrating essay examines the claims of the Plymouth Brethren and similar movements that sought to establish a “pure church” composed only of demonstrably regenerate believers. With historical learning, theological precision, and pastoral concern, Croskery argues that Scripture itself distinguishes between the visible and invisible church, and that attempts to create a perfectly pure communion on earth inevitably lead not to greater holiness, but to fragmentation, sectarianism, and spiritual pride.” – Blurb . 1900’s MacPherson, John – ‘Unity of the Church: The Sin of Schism’ (1901) 43 paragraphs from The Doctrine of the Church in Scottish Theology MacPherson was a minister in the Free Church of Scotland in the late 1800’s who here masterfully surveys the thought on the broadest unity of the church during the second reformation in Scotland (mid-1600’s). . 2000’s Winzer, Matthew – ‘A Review of Greg Barrow’s The Covenanted Reformation Defended‘ (2006) 18 paragraphs The jist of the Still Waters Revival’s claims, according to Dr. Richard Bacon, is that “they maintain that we can treat churches that lack the full well-being of the church just as we would treat a false church. Then they define full well-being as including the Solemn League and Covenant (1643) and several other documents that they refer to as ‘terms of communion.’ . . Books 1500’s Gifford, George A Short Treatise Against the Donatists of England, whom we call Brownists, wherein, by the Answers unto Certain Writings of theirs, Diverse of their Heresies are Noted, with Sundry Fantastical Opinions… (London, 1590) 110 pp. ToC Gifford (c. 1548–1600 or 1620?) was a non-conformist, English, puritan preacher at Maldon in Essex, England. John Greenwood replied to this work in, An Answer to George Gifford’s Pretended Defence. A Plain Declaration that our Brownists be Full Donatists by Comparing them Together from Point to Point out of the Writings of Augustine. Also a Reply to Master Greenwood touching Read Prayer, wherein his Gross Ignorance is Detected… (London, 1590) 126 pp. ToC This work is in reply to John Greenwood’s, An Answer to George Gifford’s Pretended Defence…, which was a reply to Gifford’s, A Short Treatise… A Short Reply unto the Last Printed Books of Henry Barrow &amp; John Greenwood, the Chief Ringleaders of our Donatists in England. Wherein is laid Open their Gross Ignorance &amp; Foul Errors: upon which their Whole Building is Founded (London, 1591) 98 pp. ToC . 1600’s English Puritans – A Refutation of the Errors of Separatists (1604; RBO, 2025) 300 pp. with an Extended Intro by Travis Fentiman: “Defending the Lawfulness of Partial-Conformity in Worship &amp; Church Government (including under Civil Impositions) from Scripture, Westminster &amp; the Scottish Indulgence Controversy, contra George Gillespie, while Driving against Denominationalism, for the Unifying of Christ’s Church</p></blockquote>

0penetrating%20essay%20examines%20the%20claims,for%20the%20Unifying%20of%20Christ%E2%80%99s%20Church&amp;text=this%20penetrating%20essay%20examines%20the%20claims%20of%20the&amp;text=against%20Denominationalism%2C%20for%20the%20Unifying%20of%20Christ%E2%80%99s%20Church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-11fa616f61" data-kw="">
<blockquote><p>I am reflected upon, and that several times to my face, by all divided parties, especially Dissenters, and particularly by these of them commonly called M’Millanites, but quite wrong designed, who should be called Hamiltonians after Robert Hamilton [was 39-40 years old], who was the only man (as I shall afterwards instruct) that led them in these untroden, dangerous paths of positive disowning of the State, and separation from the Church, and [from] all others that dare not nor will not go their lengths in principles and practices, proclaiming the same to the world; but it is straight before me, and I firmly resolve, if the Lord will, to give a more distinct account of the rise, steps, and unheard-of heights of all the right-hand extremes that have been in Scotland these 49 years, past and present; and set them up as beacons to the following ages, to beware of splitting upon such dangerous rocks. … But it is plain that these formed, divided parties of Dissenters are so puffed up with a frothy conceit of themselves and their actings, that they speak and write with, as if religion, zeal and faithfulness, wit and sense, would live and die with them; and none [other are held] to know anything of the times, nor what Israel ought to do, disdaining, disesteeming, disregarding, rash and harsh constructing of all who differ from, or oppose, them or their way of managing of a testimony; the very reverse of a gospel spirit. And I am sadly confirmed, by the many, long, melancholly debates these 48 years, of the truth of this spiritual pride rampant amongst them.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I am reflected upon, and that several times to my face, by all divided parties, especially Dissenters, and particularly by these of them commonly called M’Millanites, but quite wrong designed, who should be called Hamiltonians after Robert Hamilton [was 39-40 years old], who was the only man (as I shall afterwards instruct) that led them in these untroden, dangerous paths of positive disowning of the State, and separation from the Church, and [from] all others that dare not nor will not go their lengths in principles and practices, proclaiming the same to the world; but it is straight before me, and I firmly resolve, if the Lord will, to give a more distinct account of the rise, steps, and unheard-of heights of all the right-hand extremes that have been in Scotland these 49 years, past and present; and set them up as beacons to the following ages, to beware of splitting upon such dangerous rocks. … But it is plain that these formed, divided parties of Dissenters are so puffed up with a frothy conceit of themselves and their actings, that they speak and write with, as if religion, zeal and faithfulness, wit and sense, would live and die with them; and none [other are held] to know anything of the times, nor what Israel ought to do, disdaining, disesteeming, disregarding, rash and harsh constructing of all who differ from, or oppose, them or their way of managing of a testimony; the very reverse of a gospel spirit. And I am sadly confirmed, by the many, long, melancholly debates these 48 years, of the truth of this spiritual pride rampant amongst them.”

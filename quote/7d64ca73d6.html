<main class="wrap"><figure class="quote" id="q-7d64ca73d6" data-kw="">
<blockquote><p>Judge, therefore, reader, whether the pope with his be the church; whether their authority be above the scripture; whether all they teach without scripture be equal with the scripture; whether they have erred, and not only whether they can. And against the mist of their sophistry take the ensamples that are past, in the Old Testament and authentic stories, and the present practice which thou seest before thine eyes.

Judge whether it be possible that any good should come out of their dumb ceremonies and sacraments into thy soul. Judge their penance, pilgrimages, pardons, purgatory, praying to posts, dumb blessings, dumb absolutions, their dumb pattering, and howling, their dumb strange holy gestures, with all their dumb disguisings, their satisfactions and justifyings. And because thou findest them false in so many things, trust them in nothing; but judge them in all things.

Mark at the last the practice of our fleshly spirituality and their ways, by which they have walked above eight hundred years; how they establish their lies, first, with falsifying the scripture; then through corrupting with their riches, whereof they have infinite treasure in store; and last of all, with the sword. Have they not compelled the emperors of the earth, and the great lords and high officers to be obedient unto them, to dispute for them, and to be their tormentors …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Sir Thomas More’s Dialogue, The Supper of the Lord after the True Meaning of John VI. and 1 Cor. XI., and WM. Tracy’s Testament Expounded, ed. Henry Walter (Cambridge: The Parker Society, 1850), pp 9-10.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-6aa08d6122" data-kw="">
<blockquote><p>Read sober books. Those that are given to reading, are as much under the influence of the books they read, as of the persons they converse with, and therefore in the choice of them you need to be very cautious, and take advice. Nothing more prompts vanity, especially among the refined part of mankind, than romances and plays, and loose poems; and thus even their solitudes and retirements, which we hope might contribute to their seriousness, are lost, and make them more vain, and more ingeniously so.

Let us therefore take the same method to make us sober, more sober; converse with those books which are substantial and judicious, out of which we may learn wisdom. The Book of God is given us on purpose to make us wise to salvation; make it familiar to you, and let it dwell in you richly. Let it lead you, let it talk with you; and do you follow it, and talk with it, Prov. vi. 22. And many other good books we have to help us to understand and apply the scripture, which we should be conversant with. Inquire not for merry books, songs, and jests, but serious books, which will help to put you into, and keep you in a serious frame.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sober-Mindedness Pressed upon Young People, in a Discourse on Titus II.6</cite>, (1712) in The Complete Works of the Rev. Matthew Henry; Being a Collection of all his Treatises, Sermons, and Tracts, as Published by Himself: And a Memoir of his Life (2 vols, Edinburgh: A. Fullarton and Co., 1853), 1: 82.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Having considered the reasons for which the word of God has been committed to writing, we must now ascertain where that record is to be found. Shall we seek it among the heathens? No book of theirs is met with which can be accounted divine. All is uncertain, fabulous, full of superstition and idolatry. Shall we look for it among the Mahomedans? They have the Koran, we confess; but that book is hardly worthy of a man in his sense; and whatever good is in it, has entirely been derived from the Jews and Christians. Truly no where else must the word of God be sought for but in the books of the Old and New Testament …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 1.5, p. 13.</span></figcaption>

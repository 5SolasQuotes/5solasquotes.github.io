<blockquote><p>Q. 17. May not rich men, that have no need, forbear the six days’ labour?

A. No; if they are able. It is part of God’s service, and riches are his gift: and to whom he giveth much, from them he expecteth not less, but more. Shall servants work less because they have more wages?

It is not only for their own supplies that God commandeth men to labour, but also for the public good, and the benefit or relief of others, and the health of their bodies, and the suitable employment of their minds, and that none of their short, precious time be lost in sinful idleness.

Q. 18. But it will seem sordid for lords, and knights, and ladies to labour?

A. It is swinish and sinful not to labour; but they must do it in works that are suitable to their places. As physicians, schoolmasters, and church ministers labour not in the same kind of employment as ploughmen and tradesmen do; so magistrates have their proper labour in government, and rich persons have families, children, and servants to oversee, their poor neighbours and tenants to visit, encourage, and relieve, and their equals so to converse with as tendeth to the greatest good; but none must live idly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catechising of Families. A Teacher of Householders how to Teach their Households</cite>, (1682) in The Practical Works of Richard Baxter (4 vols, London: George Virtue, 1838), 3: 129.</span></figcaption>

<blockquote><p>The even more basic principle involved [in the indulgence controversy] is whether a minister may give up some liberty for a time, even indefinitely, for the furthering of Christ’s ministry, even for its long-term survival (Isa. 26:20) or the eternal well-being of souls (Col. 1:24)? Besides Jesus’s example and teaching in a broken and declining Church, Mt. 17:24–27; 26:51–54; Lk. 9:51; 22:43; 23:35–37; Jn. 10:17–18; Gal. 4:4–5; Phil. 2:8, see that of Paul often under the same state, Acts 16:3–4; 21:13, 23–26; 1 Cor. 4:11–12; 8:13; 9:12, 19–23; 2 Cor. 6:3–10; 11:23–28; Gal. 5:13; Phil. 1:12–14; 2 Tim. 2:9–10; 2 Thess. 3:8–9. Or is this principle sinful? If a person has liberty to amputate their own bodily extremities in some needful circumstances for the greater good of the whole (Mt. 18:8–9), from the greater to the lesser, may not one give up some of their bodily liberty for a greater good?</p></blockquote>

<blockquote><p>The chief practical argument in favour of Universalism is, doubtless, the sinful callousness of Christians towards this tremendous destiny of their sinful fellow-creatures. Can we contemplate the exposure of our friends, neighbours, and children to a fate so terrible [as hell], and feel so little sensibility, and make efforts so few and weak for their deliverance! And yet, we profess to have faith! How can our unbelieving friends be made to credit the sincerity of our convictions? Here, doubtless, is the best argument of Satan for their scepticism. And the best refutation of this heresy is the exhibition by God’s people of a holy, humble, yet burning zeal to pluck men as brands from the burning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-l-dabney.html">R. L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus and Notes of the Course of Systematic and Polemic Theology Taught in Union Theological Seminary, Virginia</cite>, (2nd edn, St Louis MO: Presbyterian Publishing Company, 1878), pp 861-62.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-6f6fce6380" data-kw="">
<blockquote><p>…and some Christian commonwealths, he [Barclay] means his own synagogue of Rome, spiritual Sodom, a cage of unclean birds, suffers harlots by law; and the whores pay so many thousands yearly to the Pope, and are free of all punishment by law, to eschew [avoid or lessen] homicides, adulteries of Romish priests, and other greater sins; therefore [it would conclude] God has given power to a king to play the tyrant without any fear of punishment to be inflicted by man. But if this be a good argument, the magistrate to whom God has committed the sword to take vengeance on evil doers (Rom. 13:3-6), such as are perjured persons, professed whores and harlots, has a lawful power from God to connive at sins and gross scandals in the commonwealth, as they dream that the king has power given from God to exercise all acts of tyranny without any resistance. But:

1. This was a grievous sin in Eli, that he being a father and a judge, punished not his sons for their uncleanness, and his house, in God’s heavy displeasure, was cut off from the priesthood therefore. Then God has given no such power to the judge.

2. The contrary duty is lying on the judge to execute judgment for the oppressed (Job 29:12-17; Jer. 22:15-16) and perverting of judgment, and conniving at the heinous sins of the wicked, is condemned (Num. 5:31-32; 1 Sam. 15:23; 1 Kings 29:42-43; Isa. 1:17; 10:1; 5:23); and therefore God has given no power to a judge to permit wicked men to commit grievous crimes without any punishment. As for the [Mosaic] law of divorce, it was indeed a permissive law, whereby the husband might give the wife a bill of divorce and be free of punishment before men, but not free of sin and guiltiness before God, for it was contrary to God’s institution of marriage at the beginning, as Christ says; and the prophet says (Mal. 2) that the Lord hates putting away; but that God has given any such permissive power to the king, that he may do what he pleases, and cannot be resisted, this is in question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1644; Edinburgh: Ogle, 1843), question 18, p. 76 lt col mid-bot</span></figcaption>

<blockquote><p>It is one of the most important things in the world for the resolving of a thousand cases of conscience and the directing of a Christian life to know which duties are the greater and which are the lesser, and so which is to be preferred in competition; For that which is a duty at another time is a sin when it is done instead of a greater! as Christ has resolved in the case of the Sabbath. If good must be loved as good, then the greatest good must be most loved and sought. Sacrifice instead of mercy is a sin: Our gift must be left at the altar while we go to be reconciled to our brother. Mt. 5. Never hearken to those men who would set up their controverted duties or any positives and lesser things against the duties of nature itself or the great substantial parts of godliness.</p></blockquote>

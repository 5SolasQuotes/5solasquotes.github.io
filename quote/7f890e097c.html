<blockquote><p>So David said to Nathan, “I have sinned against the Lord.” And Nathan said to David, “The Lord also has put away your sin; you shall not die.” (2 Samuel 12:13)

Here we must note how God receives poor sinners, and accomplishes what he says by his prophet, that ‘he desires not the death’ of his own, nor to lose them, but that ‘they be converted and live’ (Ezek. 18:23). We see this portrayed in a living portrait when God pronounced by the mouth of his prophet that David’s sin was pardoned. As he was quick to make himself docile and bow his head, indeed making himself nothing at all before God, we see that God responded by readily receiving him in mercy. And that is how he will act towards all sinners, for it is not a story which applies just to one man. On the contrary, God tells us that he is always ready and prepared to grant us mercy when we come to him – if it is without hypocrisy, and if we feel the way that David did.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on 2 Samuel: chapters 1-13</cite>, trans. D. F. Kelly (Edinburgh, 1992), pp 565-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>And this is clear by all covenants in the Word of God: even the covenant between God and man is in like manner mutual — “I will be your God, and ye shall be my people.” The covenant is so mutual, that if the people break the covenant, God is loosed from his part of the covenant, Zech. 11:10. The covenant gives to the believer ‘a sort of action of law,’ and jus quoddam, to plead with God in respect of his fidelity to stand to that covenant that binds him by reason of his fidelity, Isa. 43:26; 63:16; Dan. 9:4-5;</p></blockquote>

</figure><figure class="quote" id="q-256a69721d" data-kw="">
<blockquote><p>(Verse. 31) ‘He forsakes not forever.’… Moreover, this is most sure, that the nature of God is such as that He delights not in our afflictions, being Himself naturally good, gentle, slow to anger and of great compassion. Thus we see how God is described unto us throughout the whole volume of the scripture, namely, in the 34th chapter of Exodus, insomuch that whenas Isaiah in his 28th chapter says He punishes and afflicts us, it seems rather that He deals like a stranger, and not like Himself. And namely, in the midst of all our afflictions, He makes his singular goodness always appear in the moderating of our punishments, turning them all to our benefit and welfare. And according hereunto, most notably wrote Saint Augustine in his epistles to Felix and Rusticus, saying, What is it that our good God will not mercifully do unto man? And how can it be but that He will show him all the favor He can, considering that all the tribulations which He sends are more benefits…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-tossanus.html">Daniel Tossanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lamentations &amp; Holy Mournings of the Prophet Jeremiah</cite>, … (London: Windet, 1587), ch. 3, p. 131-32</span></figcaption>

d it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bf275ede3d" data-kw="">
<blockquote><p>That the covenant of grace is the contract of marriage, the plan of which was agreed upon in the council of peace, betwixt the Father and the Son, from all eternity: Psa. Ixxxix. 3. “I have made a covenant with my chosen, I have sworn unto David my servant.” It was originally made with the Bridegroom, as the Head, Husband, and Representative of the bride, wherein he undertakes, that the grace of God shall reign and be glorified through his own righteousness, to her eternal life and salvation.

As Surety of the covenant, he undertakes to fulfil the condition of it, by his own obedience unto death, to buy his bride from the hands of justice, by paying a ransom of his own blood for her, and to buy. at the same time, all the blessings and goods of the covenant for her use; and that, by the power of his word and Spirit, he will make her to take hold of his covenant, bring her within the bond of it, and make an effectual application thereof in due time, according to the order of the covenant; and that he will betroth her unto himself for ever, in righteousness, and in judgment, and in loving-kindness, and in mercies; yea, that he will betroth her unto himself in faithfulness, and that she shall know the Lord, Hos. ii. 19, 20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The wise virgins going forth to meet the bridegroom in The Whole Works of Ebenezer Erskine</cite></span></figcaption>

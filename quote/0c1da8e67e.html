<main class="wrap"><figure class="quote" id="q-0c1da8e67e" data-kw="">
<blockquote><p>That the afflictions that do befall the saints are such as proceed from God’s dearest love. ‘As many as I love, I rebuke and chasten,’ Rev. iii. 19. Saints, saith God, think not that I hate you, because I thus chide you. He that escapes reprehension may suspect his adoption. God had one Son without corruption, but no son without correction. A gracious soul may look through the darkest cloud, and see a God smiling on him. We must look through the anger of his correction to the sweetness of his countenance; and as by the rainbow we see the beautiful image of the sun’s light in the midst of a dark and waterish cloud.

When Munster lay sick, and his friends asked him how he did and how he felt himself, he pointed to his sores and ulcers, whereof he was full, and said, ‘These are God’s gems and jewels, wherewith he decketh his best friends, and to me they are more precious than all the gold and silver in the world.’ A soul at first conversion is but cast; but God by afflictions doth square and fit, and fashion it for that glory above, which doth speak them out to flow from precious love; therefore the afflictions that do attend the people of God should be no bar to holiness, nor no motive to draw the soul to ways of wickedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Precious Remedies Against Satan’s Devices</cite>, (1676) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 1: 52.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><figure class="quote" id="q-2a31d27502" data-kw="">
<blockquote><p>Sometimes, by elevating his People above the bitterness of their afflictions, by the surpassing sweetness of his Presence, and transporting consolations. Great afflictions may be upon them, but greater divine refreshments may even drown and swallow them up. Our abounding afflictions are sweetly cured by Christ’s abounding and superabounding Consolations. The Moon and Stars are in the sky at mid-day, as well as at mid-night, but not one of them then appears; because the Sun shining in his strength, hath outshined them all: So when Jesus Christ the glorious Sun of righteousness shines in his strength of Grace and Consolation upon the hearts of his afflicted, he so shines away their troubles and distresses, that they scarce appear.

If Christ steel the Spirit with Faith, Courage and Magnanimity, and fill the heart with the Consolations of God, which are not small; how easy is it to trample upon the greatest tribulation, and count all afflictions as no afflictions, yea as great advantages! Holy [John] Bradford Martyr said; I thank God more of this Prison, then of any Parlour, yea then of any pleasure that ever I had; for in it I find God, my most sweet good God always. And Laurence Sanders Martyr confessed; I was in Prison, till I got into Prison. Hierom hath a good note concerning Job: That God came nearest to Job in his extremities, and dealt with him then most familiarly. And he adds: Let strokes come, let all kind of Punishments come: so that after these Christ will come.</p></blockquote>

</figure><figure class="quote" id="q-a6f0f2b191" data-kw="">
<blockquote><p>May it please your Grace and your Lordships, I Should not presume to take up any part of that time, which Your Grace so happily employs in the Government and Conservation of a whole Nation; nor to divert the rest of this honourable Board from those important Affairs, which usually call your Lordships hither; were I not under an Obligation both of Gratitude and Duty, to be an Interpreter for those poor Protestants, lately come out of France, to take Sanctuary with you: and to express for them and in their names, as they have earnestly desired me, a part of that grateful sense, which they have, and will for ever preserve, of your Lordships Christian Charity and Generosity towards them: This they have often, I assure you, acknowledged to Heav’n in their Prayers, but could not be satisfied, till they had made their solemn and public Acknowledgments to their Noble Benefactors.

Life and Religion are the two things most dear and valuable of all upon earth: Life is the ground of all the Good and Happiness we enjoy in this world, and Religion is the foundation of all the Felicities we hope for in that to come; so that those persons that are deprived both of the comforts of Life, and the Profession and Exercise of their Religion, may justly be looked upon as the truest objects of pity that we can meet with in this world; and by the same rule, those that have a lively sympathy with such, have the true principle of a Christian Spirit, and are the true examples of a Christian Practice.

What extreme Hardships and Sufferings those Protestants were under in their own Country, both as to their Livelihood and Religion, is too sad and too notorious a truth, as well as too big a Subject for me now to enlarge upon. The many Proclamations which their Prince made against them, for pulling down and demolishing most of their Churches, and excluding them from all Trades and Preferments, are well known, they could neither serve God, nor enjoy themselves; They are forbidden to quit their Country, and yet by their hard usage, and persecution, in effect, not suffered to stay.

The Cry of that Egyptian-like Bondage and Slavery, they groaned under, that entered into the ears of the Lord of Hosts, entered also into your noble and charitable Hearts, and there has met with Compassion and Pity; and by your Christian Example and Charity you have set your selves Patterns to this whole Nation: By it you have excited the general Beneficence of all; and by it, no less than by your Orders, you have already influenced this great City (and I hope will shortly after, the whole Kingdom) into an Obedience to that truly Christian, and royal Law of Beneficence and Mercy.

And although this be eminent, and extraordinary in its kind, yet it is no wonder that that Illustrious Person, who began as early to be good, as to be great, whose matchless Courtesy and Generosity are not only known to his Friends, to his Servants, to Strangers, but even to his greatest Enemies; who has learned by a long experience, what it is to suffer for Righteousness sake, and to forsake all, rather than his Honour and Religion; no wonder, I say, that He should be ready and zealous to relieve those that suffer innocently, and for a good Conscience, and who forsake their All, rather than forsake their God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-drelincourt.html">Peter Drelincourt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A speech made to His Grace the Duke of Ormond Lord Lieutenant of Ireland, and to the Lords of His Majesties most Honourable Privy Council to return the humble thanks of the French Protestants lately arrived in this kingdom, and graciously relieved by them</cite>, (Dubliln: William Mendey, 1682), pp 3-5.</span></figcaption>

— Peter Drelincourt, A speech made to His Grace the Duke of Ormond Lord Lieutenant of Ireland, and to the Lords of His Majesties most Honourable Privy Council to return the humble thanks of the French Protestants lately arrived in this kingdom, and graciously relieved by them, (Dubliln: William Mendey, 1682), pp 3-5.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMay+it+please+your+Grace+and+your+Lordships%2C+I+Should+not+presume+to+take+up+any+part+of+that+time%2C+which+Your+Grace+so+happily+employs+in+the+Government+and+Conservation+of+a+whole+Nation%3B+nor+to+divert+the+rest+of+this+honourable+Board+from+those+important+Affairs%2C+which+usually+call+your+Lordships+hither%3B+were+I+not+under+an+Obligation+both+of+Gratitude+and+Duty%2C+to+be+an+Interpreter+for+those+poor+Protestants%2C+lately+come+out+of+France%2C+to+take+Sanctuary+with+you%3A+and+to+express+for+them+and+in+their+names%2C+as+they+have+earnestly+desired+me%2C+a+part+of+that+grateful+sense%2C+which+they+have%2C+and+will+for+ever+preserve%2C+of+your+Lordships+Christian+Charity+and+Generosity+towards+them%3A+This+they+have+often%2C+I+assure+you%2C+acknowledged+to+Heav%E2%80%99n+in+their+Prayers%2C+but+could+not+be+satisfied%2C+till+they+had+made+their+solemn+and+public+Acknowledgments+to+their+Noble+Benefactors.%0A%0ALife+and+Religion+are+the+two+things+most+dear+and+valuable+of+all+upon+earth%3A+Life+is+the+ground+of+all+the+Good+and+Happiness+we+enjoy+in+this+world%2C+and+Religion+is+the+foundation+of+all+the+Felicities+we+hope+for+in+that+to+come%3B+so+that+those+persons+that+are+deprived+both+of+the+comforts+of+Life%2C+and+the+Profession+and+Exercise+of+their+Religion%2C+may+justly+be+looked+upon+as+the+truest+objects+of+pity+that+we+can+meet+with+in+this+world%3B+and+by+the+same+rule%2C+those+that+have+a+lively+sympathy+with+such%2C+have+the+true+principle+of+a+Christian+Spirit%2C+and+are+the+true+examples+of+a+Christian+Practice.%0A%0AWhat+extreme+Hardships+and+Suffe

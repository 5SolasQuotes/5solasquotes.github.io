<main class="wrap"><figure class="quote" id="q-cd558758bf" data-kw="">
<blockquote><p>In man’s conversion to God we urge not the necessity of anything that is unnecessary. We stand not on certain modes, methods and circumstances, in which it may be brought about, wherein the wisdom of God proceeds variously towards several persons, according to the different circumstances of their condition. As for instance, we assert not a general necessity of this or that measure of humiliation, much less of a dismal despairing horror (as some have said of us); we press conviction and humiliation no farther than to make a sinner restless till he come to Christ, and find rest to his soul in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Account given of the Principles &amp; Practices of Several Nonconformists</cite>, … (London: Parkhurst, 1682), pp. 19-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-17afc6fb4a" data-kw="">
<blockquote><p>Repentance is a detestation of wicked life, and a turn to the better. Whence the parts of repentance are two: withdrawal from evil, and approach to the good, Psalm 34:14, depart from evil, and do good. It is evident that this repentance, insofar as it is saving conversion to God, that is, Sanctification begun or continued, pertains to the Gospel: (1.) Because it is an effect of evangelical doctrine. (2.) Because the baptism of repentance, which John preached, Mk. 1:4, is not a sacrament of the Law, but of the Gospel. (3.) Because the Gospel alone works that sorrow that is according to God, 2 Cor. 7:10. But the Law works wrath, Rom. 4:15. (4.) Because it immediately flows from the remission of sins, insofar as the Gospel is the preaching of the remission of sins and of repentance, Mk. 6:12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634). ‘Gospel-Offer &amp; Covenant of Grace’ Wendelin (1584-1652)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><figure class="quote" id="q-9a39d46651" data-kw="">
<blockquote><p>Sin can never be too much lamented or repented of; but at the same time we are not so to mourn over sin as to forget that Jesus died, and thereby cancelled all our guilt.</p></blockquote>

</figure><figure class="quote" id="q-37c89f6727" data-kw="">
<blockquote><p>However, such [good] works, through a new supervening sin, are said to be mortified, when they are impeded from their own proper effect and operation. For as a living thing through death loses the operation of life, so things are said by analogy to be mortified, when they are impeded from their own proper effect or operation. But the effect of good works which emanate from faith and grace, by divine ordinance and pact, is to lead to eternal life. This effect, however, is cut off when a grave sin intervenes, by which, as I might say, the said good works are mortified; and they are deprived of their own proper effect and operation of leading to life, so much so that the force of these, while the guilt of that sin lasts, is suspended. We say, however, that these very works, mortified by grave sin, are revived by penitence and recover their former vigor and virtue of leading to life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Good Works Mortified by Sin are Revived by Penitence’ in Theological Determinations in Works of Samuel Ward</cite>, … ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 189-94, p. 192</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5b7bdd323b" data-kw="">
<blockquote><p>Position 3. To repent, to mortify sin, is not to condemn all our works (as Mr. Town says) righteousness and judgment, and our best things in us, and then by faith to fly to grace; nor is it to distrust our own righteousness and embrace Christ’s in the promise: 1. Because this is faith; and the Scripture says we are justified by faith. 2. We receive Christ by faith, Jn. 1:12. 3. We receive and embrace the promise by faith, Heb. 11:11, and were persuaded of them. 4. We are to believe without staggering, Rom. 4.19. 5. We have peace of conscience through faith, Rom. 5:1. 6. By faith we have access into this grace wherein we stand, Rom. 5:2. And boldness to enter into the holy of holiest, and draw near to our High Priest, with full assurance of faith, Heb. 10:19-22. Now we are not justified by repentance and mortification; we neither receive Christ, nor embrace the promises by repentance. The apostle requires in repentance, sorrow, carefulness to eschew sin, clearing, indignation, fear, zeal, desire, revenge, 2 Cor. 7:10-11, but nowhere does the Scripture require this as an ingredient of repentance, that we have boldness and access, and full assurance: nor do Antinomians admit that by repentance we have peace or pardon, but this they ascribe to faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), p. 272</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

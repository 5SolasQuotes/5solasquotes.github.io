<main class="wrap"><figure class="quote" id="q-7002eb38f7" data-kw="">
<blockquote><p>IN the first place, the wrath of man praises God, as it is an example and illustration of divine truth, and clearly points out the corruption of our nature, which is the foundation stone of the doctrine of redemption. Nothing can be more absolutely necessary to true religion, than a clear and full conviction of the sinfulness of our nature and state.

Without this there can be neither repentance in the sinner, nor humility in the believer. Without this all that is said in scripture of the wisdom and mercy of God, in providing a Saviour, is without force and without meaning. Justly does our Saviour say, The whole have no need of a physician, but those that are sick. I came not to call the righteous but sinners to repentance. Those who are not sensible that they are sinners, will treat every exhortation to repentance, and every offer of mercy, with disdain or defiance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-witherspoon.html">John Witherspoon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The dominion of Providence over the passions of men. A sermon preached at Princeton, on the 17th of May, 1776. Being the general fast appointed by the Congress through the United Colonies. To which is added, an address to the natives of Scotland residing in America</cite>, (Philadelphia: R. Aitken, 1776), pp 7-8.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fb531881d3" data-kw="">
<blockquote><p>Men have generally formed such conceptions of the present state of human nature, and the extent of its powers, as they wish to be true, and wishing them to be true, have asserted them to be so; and after dressing her up in a gay attire of their own making, to complete her honour, and fix the crown of glory upon her head, have complacently enough given her salvation of her own working out. Hence it is, that human merit and personal righteousness pass so currently in this refined age as the only, conditions of our acceptance with God, and justification in his sight. The success of this modern method of Christian-making is easily accounted for. For as it ascribes the whole praise of his salvation to man himself, it is much more agreeable to the pride of the human heart, than the gospel method of salvation, which resolves the whole into the free grace of God in Christ Jesus. But though such a scheme of salvation is greedily swallowed by the human heart, yet if it has not the sanction of the infallible oracles of truth, it must be looked upon as “a cunningly devised fable.”

Whilst such unscriptural principles as these, with respect to the way of access to the divine favour, are assiduously propagated by some, and greedily swallowed by others, the following publication cannot be deemed an unseasonable one. It turns upon a capital article in the Christian system, upon our notions of which all our views of the method of acceptance with God must depend. For if one man maintains that human nature, by proper culture and improvement, may acquire strength and integrity equal to that which it had in the days of primaeval rectitude, salvation by works will to him appear quite practicable. But on the other hand, if another man, according to sacred writ, believes that the descendants of Adam are obnoxious to the curse of the law, and “dead in trespasses and sins,” he will clearly see the necessity of Christ’s satisfaction to remove the one, and the power of the Spirit to raise from the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-boston.html">Michael Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Works, from the Sacred Records</cite>, (1772) in The Whole Works of the Late Reverend Thomas Boston of Ettrick, ed. Samuel McMillan (12 vols, Aberdeen: George and Robert King, 1852), 11: 174-75.</span></figcaption>

</figure><figure class="quote" id="q-3a7960a975" data-kw="">
<blockquote><p>Canon 10: God entered into the Covenant of Works not only with Adam for himself, but also, in him as the head androot with the whole human race. Man would, by virtue of the blessing of the nature derived from Adam, inherit also the same perfection, provided he continued in it. So Adam by his sorrowful fall sinned and lost the benefits promised in the Covenant not only for himself, but also for the whole human race that would be born by the flesh. We hold, therefore, that the sin of Adam is imputed by the mysterious and just judgment of God to all his posterity. For the Apostle testifies that “in Adam all sinned, by one man’s disobedience many were made sinners” (Rom 5:12,19) and “in Adam all die” (I Cor 15:21–22). But there appears no way in which hereditary corruption could fall, as a spiritual death, upon the whole human race by the just judgment of God, unless some sin of that race preceded, incurring the penalty of that death. For God, the most supreme Judge of all the earth, punishes none but the guilty. Canon 11: For a double reason, therefore, man, because of sin, is by nature, and hence from his birth, before committing any actual sin, exposed to God’s wrath and curse; first, on account of the transgression and disobedience which he committed in the loins of Adam; and, secondly, on account of the consequent hereditary corruption implanted to his very conception, whereby his whole nature is depraved and spiritually dead; so that original sin may rightly be regarded as twofold, imputed sin and inherent hereditary sin. Canon 12: Accordingly we can not, without harm to the Divine truth, agree with those who deny that Adam represented his posterity by God’s intention, and that his sin is imputed, therefore, immediately to his posterity; and under this mediate and consequent imputation not only destroy the imputation of the first sin, but also expose the doctrine of hereditary corruption to grave danger.</p></blockquote>

<blockquote><p>Night pollutions are not altogether against our will; they are sinful pollutions except concupiscence and lustful habitual day lusts, the cause of them, be not sinful pollutions, yea and forbidden in the Seventh Commandment… …we conceive legal [Mosaic] uncleanness, as the monthly diseases of women, night pollutions, want [lack] of circumcision, did typify much natural and original heart corruption, which cannot be punished by men or the Church…</p></blockquote>

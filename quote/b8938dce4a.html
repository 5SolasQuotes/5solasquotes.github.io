<main class="wrap"><figure class="quote" id="q-b8938dce4a" data-kw="">
<blockquote><p>What does it mean to die to the law through the law, when it would seem that one dies to the law through Christ? Paul does not deny that we receive that blessing through Christ, but he is explaining rather how believers relate to the law. Because they recognize their misery and helplessness thanks to the law, they die in so far as they turn to the faith and hope of justification and not by the degree to which they give Christ the obedience due to him. To die to the law therefore is both to stop seeking justification in the law and being terrified by its curse, and to live for God by being born again.

Paul reveals the benefits of Christ and the effects of our fellowship with the one through whom the old person in us is being daily crucified so that a new life may take root in us by faith in the one who gave himself up on our behalf. He concludes therefore that he has not abolished the grace of God, that is to say, he has not abused the doctrine of the gospel and grace as the false apostles wanted to do. Rather, he was trying to illustrate his point, because if a sinner’s justification came by the ceremonial or moral law, Christ would have died in vain and would not have achieved his object.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-tossanus.html">Daniel Tossanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Opera Theologica II, quod Commentarios in Reliquos Divi Pauli Aliorumque Aposolorum Epistolas Continent</cite>, (Hanau, 1604). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 78.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

C+p.+78.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb8938dce4a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b8938dce4a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/11/19/daniel-toussain-on-dying-to-the-law/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ad8dce818" data-kw="">
<blockquote><p>Hence in the first justification of believing sinners, all future sins are remitted as unto any actual obligation unto the curse of the Law… And although sin cannot be actually pardoned before it be actually committed, yet may the obligation unto the curse of the Law be virtually taken away from such sins in justified persons as are consistent with a justified estate, or the terms of the Covenant of Grace, antecedently unto their actual commission. God at once in this sense forgives all their iniquities, and heals all their diseases, redeems their life from destruction, and crowns them with loving kindness and mercies, Ps. 103:2-3. Future sins are not so pardoned as that when they are committed they should be no sins, which cannot be, unless the commanding power of the Law be abrogated. But their respect unto the curse of the Law, or their power to oblige the justified person thereunto is taken away. … Whereas therefore one essential part of justification consists in the pardon of our sins, and sins cannot be actually pardoned before they are actually committed… Justification is at once complete in the imputation of a perfect righteousness, the grant of a right and title unto the heavenly inheritance, the actual pardon of all past sins, and the virtual pardon of future sins…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, … (London: Boulter, 1677), ch. 5, pp. 202-3</span></figcaption>

<blockquote><p>‘And whom He called, them also He justified.’ Having spoken of our calling, we come now to speak of our justification. This is a new benefit different from the former benefit of our calling, posterior to it in order of working but not in time: for in the same moment wherein the Lord by effectual calling gives us faith to believe, He does also justify us.</p></blockquote>

</figure><figure class="quote" id="q-86d39f2348" data-kw="">
<blockquote><p>1. That righteouseness whereby we are justified before God is the fulfilling of God’s law.

2. Legal justice is the fulfilling of the law, performed by him which is named just.

3. Evangelical justice is the punnishment of our sins, which Christ endured for us, freely imputed by God to them that believe.

4. Since the fall of man no man besides Christ alone in this life is justified before God by the righteouseness of the law.

5. We are justified only by faith in Christ.

6. And yet the righteousness of the law must in this life be begun in all that will be saved.</p></blockquote>

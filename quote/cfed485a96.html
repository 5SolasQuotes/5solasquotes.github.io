<main class="wrap"><figure class="quote" id="q-cfed485a96" data-kw="">
<blockquote><p>Christ is said To knock at the door (the outward call here spoken of) and if any admit Him, He will come in and sup with him, Rev. 3:20. So then you see, to be called to the graces and duties of the Gospel, is matter of great joy and comfort;… Oh then how great is the madness and folly of all recusants to this gracious offer!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, (1652; Ames, Iowa, 1990), Section 12, Sermon 108</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b6c88927fa" data-kw="">
<blockquote><p>Let us care for nothing but to get Christ, and let Christ be the end of our faith and works, and then let Christ alone for bringing us to life, heaven, and happiness. Let us by faith make way for Christ to come into our hearts to be our Prophet, Priest, King, and Shepherd, that we may receive Him offering Himself, and then He will make way for us to God, heaven and eternal happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/job-throckmorton.html">Job Throckmorton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Faith, pp. 63-64 as given in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 396 Throckmorton (1545-1601) was an English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-d966461caf" data-kw="">
<blockquote><p>It is the voice of my beloved that knocketh, saying, Open to me. This is another sudden apprehension, and sensible acknowledgement of the Church’s, to which she is quickened and excited by the strong and mighty calls and pulsations, by which Christ endeavors to awaken her; whose voice she cannot but know and confess, though she be not so dutiful as she ought to be in obeying it; and therefore she does here aggravate and bewail her fault, which is so much the greater because of his importunity, and tender vehemency for admission: For when Christ calls, and knocks, and begs at the door of our souls to enter, what vile ingratitude is it to shut Him out? When He solicits and entreats so many ways; by his Word and ministers; by his rods and corrections (which have their voice, Mic. 6:9) by his mercies and kindness, but chiefly by the constant admonitions, and provocations, and motions of his Spirit; what inexcusable, obstinate madness is it to deny and drive Him away? Is anything so worthy to be harbored there, as He is? And is it not an incomparable honor, that He will vouchsafe to come under our roof? Whosoever is shut out, sure he deserves an hospitable reception, who will come and sup with such as we are, and brings his feast along with him. Aperi Christo sed extraneis claude, seculo claude, etc. [‘Open to Christ, but to outsiders, shut, shut the world’], drive away and banish all things else, but give Him the best lodging. It is demanded, Can we open? Is it in our power? Has not He the keys Himself, and is not He the door Himself? Does not He shut and none can open? Yes, but when He bids you to open, He lends you a key; and when He infuses grace and says He enables you to open, it is his gift, but your grace; his inspiration, but your improvement: And oh! How blessed are they that are but his turn-keys, his door-keepers. Is there a greater honor, or happiness than to co-operate with God, in that which of all others is the most God-like work, the salvation of souls?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english-annotations.html">English Annotations</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Annotations (the Westminster Annotations)</cite>, 3rd ed. (1658), on Song 5:2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-2ec24cdd2c" data-kw="">
<blockquote><p>Others (Immanuel Tremellius &amp; Thomas Wilcox) interpret this of the doors of our heart, according to that Apoc. 3:20, ‘Behold I stand at the doors and knock, if any man hear my voice and open the door, I will come in unto him, etc.’ In the Gospel’s history we find that Christ had a fourfold entertainment among men. Some received Him into house, not into heart, as Simon the Pharisee (Lk. 7:44), who gave Him no kiss, nor water to his feet: some into heart, but not into house, as the faithful centurion, esteeming himself unworthy that Christ (Mt. 8:8) shouId come under his roof: some neither into soul nor heart, as the graceIess Gergesites, Mt. 8:54; some both into house and heart, as Lazarus (Jn. 11:11, 15), Mary (Lk. 10:38), Martha. Now that Christ may dwell in our hearts by faith (Eph. 3:17), and that our bodies may be temples of his Holy Spirit (1 Cor. 6:19); we must as our prophet exhorts here, ‘lift up our souls,’ that is, in the words of St. Paul, Col. 3:2, our affections must be set on things which are above, and not on things which are on earth, if we desire to lift up our heart unto Christ’s verity, we may not lift it up unto the world’s vanity (Augustine in location), that is, we must not fasten our love too much upon the things of this life, but on those pleasures at God’s right hand, which are evermore… O Lord, which art the God of my salvation (Ps. 18:47), I lift my heart to Thee (Ps. 25:1), desirous to seek Thee, both in the right ubi, ‘where’ Thou mayst be found, and in the right quando, ‘while’ Thou mayst be found: Open my dull ears and hard heart, that thy Son my Savior may come in and dwell with me: Grant me grace that I may still hear while He calls, open while He knocks, and hold Him also when I have Him, that I may both ascend thine hill, and stand in thine holy place, that I may not only sojourn in thy tabernacle, but also rest and dwell upon the mountain of thine holiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-boys.html">John Boys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Dominical</cite>, [Lordly] Epistles &amp; Gospels used in our English Liturgy... (d. 1625; 1638) | Ascension Day Evening Prayer, Psalm 24, p. 912</span></figcaption>

<blockquote><p>Secondly, Those who have not as yet received Christ to dwell in them are to be moved, as they desire Heaven’s glory hereafter and the comfortable hopes of it here upon earth, to give entertainment unto Jesus Chist. Zacchaeus upon a hint given of Christ’s willingness to come into his house, comes down out of the sycamore tree quickly, and receives him joyfully (Lk. 19:4). Now do you with seriousness consider with what 1. importunity, 2. patience, 3. and promises the Lord Jesus calls upon you for entertainment. ‘Behold, I stand at the door and knock, if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ (Rev. 3:20)</p></blockquote>

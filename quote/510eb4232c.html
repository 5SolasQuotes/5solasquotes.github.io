<main class="wrap"><figure class="quote" id="q-510eb4232c" data-kw="">
<blockquote><p>For the persons and duties of men may be accepted with God, when they walk and act in sincerity according to their light, though in many things, and those of no small importance, sundry irregularities are found, both in what they do, and in the manner of doing it. Where persons walk before God in their integrity, and practice nothing contrary to their light and conviction in his worship, God is merciful unto them, although they order not everything according to the rule and measure of the Word. So was it with them who came to the Passover in the days of Hezekiah: they had not cleansed themselves, but did eat the Passover otherwise than it was written, 2 Chron. 30:18; for whom the good king made the solemn prayer suited to their occasion: ‘The good Lord pardon every one that prepareth his heart to seek the Lord God of his fathers, though he be not cleansed according to the purification of the sanctuary; and the Lord hearkened unto Hezekiah and healed the people,’ vv. 18-20. Here was a duty for the substance of it appointed of God, but in the manner of its performance there was a failure: they did it not according to what was written, which is the sole rule of all religious duties. This God was displeased withal, yet graciously passed by the offence, and accepted them whose hearts were upright in what they did.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Work of the Holy Spirit in Prayer with a Brief Inquiry into the Nature and Use of Mental Prayer and Forms</cite>, (London: 1682), ch. 11, pp. 232-33</span></figcaption>

</figure><figure class="quote" id="q-fe61baa87e" data-kw="">
<blockquote><p>Distinction 2. If the sins be against the worship of God, as idolatry, or sins of a wicked conversation, the worship of God remaining pure and sound, at least in professed fundamentals. 3. If the idolatry be essential idolatry, as the adoring of the work of men’s hands, or only idolatry by participation, as Popish ceremonies, the surplice and cross, being as means of worship, but not adored, and so being idols by participation, as [William] Ames and Mr. [John] Ball do well distinguish (Fresh Suit Against Ceremonies [pt. 2, ch. 2, sect. 10-14, p. 207, says 107]; Answer to Mr. Cann, pt. 2, p. 23), and before them, so does the learned [John] Reynolds (De [romanae ecclesiae] idololatria, bk. 2, ch. 2) and [Thomas] Bilson (of Chri. Ar. Subject., part 4, pp. 321-22) make use of the distinction. … 5. Diverse degrees of separation are to be considered: hence these considerations: … 2. If the whole and most part of the Church turn idolatrous and worship idols (which is essential idolatry), we are to separate from that Church: the Levites and the two tribes did well, as Mr. Ball says, to make a separation from Jeroboam’s calves; and the godly, laudably, 2 Kings 16:11, did not separate from the Israel and Church of God because the altar of Damascus was set up, and because of the high places. Things dedicated unto idols, as Lutheran images, may be called, and are called, 1 Cor. 10:34 [vv. 14, 28], idolatry, yet are they idolatry by participation, and so the cup of devils, 1 Cor. 10 [v. 21]. Paul does not command separation from the Church of Corinth and the Table of the Lord there. … 5th Consideration. I see not but we may¹ separate from the Lord’s Supper where bread is adored and from baptism where the sign of the Cross is added to Christ’s ordinances, and yet are we not separated from the Church, for we professedly hear the Word, and visibly allow truth of the doctrine maintained by that Church, which do pollute the sacraments, and we are ready to seal it with our blood, and it is an act of visible profession of a Church to suffer for the doctrine mentioned by that Church. ¹ [Note that Rutherford says we “may”, and not that it is a necessity. As Samuel Bolton says on this page, one might be physially forced to attend the mass, yet this is without guilt. Baxter, also on this page, argues that one may submit to one’s baby being baptized with the sign of the cross in certain necessary conditions.] 6. We may well hold that [Pseudo?] Ambrose says well that a Church wanting the foundation of the apostles, is to be forsaken (Commentary on Luke, bk. 6, ch. 1 [This work is not in Patrologia Latina vols. 14-17 and may not be rightly attributed, yet see this reference for it]). … 8. There may be causes of non-union with a Church, which are not sufficient causes of separation: Paul would not separate from the Church of the Jews though they rejected Christ, till they openly blasphemed, Acts 13:44-46; Acts 18:6. And when they opposed themselves and blasphemed, Paul shook his raiment and said unto them, ‘Your blood be upon your own heads, I am clean; from henceforth I will go to the Gentiles.’ There is a lawful separation, and yet before the Jews came to this, there was no just cause why any should have joined to the Church of the Jews who denied the Messiah and persecuted his servants, Acts 4; Acts 5, seeing there was a cleaner Church to which converts might join themselves, Acts 2:40-42. 9. There is no just cause to leave a less clean Church (if it be a true Church) and to go to a purer and cleaner, though one who is a member of no Church have liberty of election to join to that Church which he conceives to be purest and cleanest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644) | pt. 2, ch. 4, sect. 5, pp. 252-55</span></figcaption>

<blockquote><p>And the reason why there must be this sanctifying of the heart is: 1. First, because the Lord does first accept of the person before He does accept of the action: Men indeed do accept of the persons of men because they do good actions, but God accepts of the actions of men because their persons are good. If indeed we see a man do good, then we love him and accept of the person of the man; but God first will accept of the person before the action: As the Lord accepted of Abel first, and then He accepted his offering [Gen. 4:4; Heb. 11:4]… you must first look after means of acceptation of your persons, which is through the righteousness of Jesus Christ, and through the sanctification of his Spirit, whereby you come to have his image and life, and so are accepted, and then all that proceeds from you comes to be accepted… 2. Secondly, our hearts must be sanctified because the Lord does look more to the principle from whence a thing comes than at the thing itself… So God is not pleased with anything that comes from us except He knows that it comes from a principle of love, grace, and holiness in our hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship</cite>, ... (London: 1647) | Sermon 4, on Lev. 10:3, “I will be sanctified in them that come nigh Me.”, pp. 69-70</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“And the reason why there must be this sanctifying of the heart is: 1. First, because the Lord does first accept of the person before He does accept of the action: Men indeed do accept of the persons of men because they do good actions, but God accepts of the actions of men because their persons are good. If indeed we see a man do good, then we love him and accept of the person of the man; but God first will accept of the person before the action: As the Lord accepted of Abel first, and then He accepted his offering [Gen. 4:4; Heb. 11:4]… you must first look after means of acceptation of your persons, which is through the righteousness of Jesus Christ, and through the sanctification of his Spirit, whereby you come to have his image and life, and so are accepted, and then all that proceeds from you comes to be accepted… 2. Secondly, our hearts must be sanctified because the Lord does look more to the principle from whence a thing comes than at the thing itself… So God is not pleased with anything that comes from us except He knows that it comes from a principle of love, grace, and holiness in our hearts.”

<blockquote><p>11. He [a schismatic] condemns as idolaters all the Churches on earth for six hundred, if not one thousand years after the apostles; not one Church, Christian or heretic (as far as any history tells us that I have found), did ever deny such things as he calls false worship or idolatry. They all went further than our [Anglican] parish churches do. At baptism they used the white garment, tasting milk and honey, chrism or anointing the forehead, crossing; they adored only standing, and not kneeling, every Lord’s Day, all as significant ceremonies: No one Church or person is said to scruple these; I think they did not [do] well: but God rejected not their worship. 12. He makes all or near all the Churches on earth idolaters at this day: All on earth save the Protestants are far grosser in their liturgies and ceremonies than the English: Of the Protesants, Sweden, Denmark, Saxony and all the Lutherans have liturgies, crossing, ceremonies, church-images, consubstantiation. The Helvetians [Swiss] are such as are called Erastians, making the magistrate the only ruler, and [making] sacraments common [to all, having no excommunication]. Geneva and France, yea and Holland, have their liturgies and some rites.</p></blockquote>

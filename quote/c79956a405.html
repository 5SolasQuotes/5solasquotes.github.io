<main class="wrap"><figure class="quote" id="q-c79956a405" data-kw="">
<blockquote><p>His desire was, to sit as loosely as possible by earthly things; to obtain a view of heavenly things, in all their reality and ineffable glory; to let them sway his whole nature, and mould his soul for heaven, by their transforming power.

How much it were to be desired, that all the disciples of the same Master whom he served should, in this, follow his example. He acted upon a right conception and just estimate of things. He aspired at intimate communion with God—a refreshing foretaste of heaven upon earth.

And if God is inviting his people to pitch their aspirations to such a height, with the assurance that he will sustain them there,—nay, lift them higher and higher, by shedding down the influences of his Holy Spirit, to act within them as a refiner’s fire—by quickening and strengthening the eye of faith, to enable them to see far within the veil, —it is surely but a poor return for so much mercy, when they are contented with an occasional glimpse of Immanuel’s person, and the beatitudes of the land of his glory, caught amidst those busy pursuits and perplexing occupations of this world, to which they cling with the fondness of strong passion, and with a grasp so eager as to show that it is much against their desire that it should ever be relaxed.

The jealousy with which [James] Halley watched over his own thoughts, and which was formerly noticed, he did not abandon after entering thus formally into covenant with God: nay, with care still more solicitous he scrutinized his heart, and brought the candle of the Word to the work. The complaints which he so often enters against his own depravity—the bitter words he writes against his secret thoughts and imaginations— his coldness, languor, and spiritual indifference—will be best understood, and most keenly sympathized in, by those who, by the like strict analysis of their own hearts, seek to know themselves.

Whilst they are firmly persuaded that the new and better covenant is in all things well ordered, having Christ Jesus at once for its Mediator and Surety; that its conditions change not with the risings and depressions of their spiritual experience, but are independent of the moods and frames of those who, by receiving Christ as all their hope and salvation, have their names entered in the Book of Life; yet it often occasions much grief, that their faith is so fruitless, their shortcomings so many, their graces so feeble, and their depraved passions so strong. Nor do they cease to be more anxious in watching against sin, crying for deliverance, knocking at heaven with importunate solicitude, and saying to God, “We will not go, unless thou bless us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-clarkston-fairbairn.html">John Clarkston Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Character of the Late James Halley, A.B., Student of Theology. By the Editor in Christian Miscellany</cite></span></figcaption>

<blockquote><p>This comprehensive application of the [Scriptural] rule [articulated by Rutherford] was necessitated because the advocates for human ceremonies had argued that such things might be justified as circumstances of worship. It was maintained that circumstances which were not forbidden were lawful if they were edifying. Their reformed opponents quickly saw that this argument effectively created a class of religious actions which were beside the Word in matters of faith and worship. Their response was clear and concise: any action which served as a means of worship was a moral action and required the warrant of God’s Word. To the point, Rutherford asserted, “In actions or religious means of worship, and actions moral, whatever is beside the Word of God is against the Word of God”. (Divine Right of Church Government, 1646, [Intro, section 2], pp. 19-20)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-winzer.html">Matthew Winzer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Constitutional Principle of the Scottish Reformation</cite>, 2012, vol. 2, pp. 1-42</span></figcaption>

<blockquote><p>Physician: Whether being with the sick, he have especially &amp; before all things exhorted them to have a firm, and undoubting faith in God, without whom no medicine is available and wholesome.

Whether for recovery of his bodily health he have advised and prescribed to his patient any things that be hurtful and dangerous to the health of his soul, as all those things are, that be not warranted by the word of God, but directly against the remedies which the Lord hath ordained.

As when they prescribe unto them superstitious observances, peevish calculations and childish mawmetries [sic], &amp;c. Also when they bear their patient in hand or make him to think that some certain Saints have power to send &amp; also to take away this or that disease: as though God were not the only governor of all things did not depend on him.</p></blockquote>

<blockquote><p>Latin songs, as well as organs (first introduced into the churches by Pope Vitellianus about 665) are for the most part abolished in the churches of this land. Not that use of the Latin language or of music is rejected of itself and the youth are rightly allowed these in their place, as in the schools and at home in their houses. But it is more profitable and more edifying when in the public assemblies, the prayer, singing, and the whole of the service of worship is performed in a known and intelligible language so that the common man is able to retain something from it, and to say Amen. And this has the apostle Paul commanded the Corinthians in their assemblies (1 Cor. 14), who otherwise highly extols tongues and the variety of languages. So also the superfluous and unbeneficial costs expended on organs are much better directed to other necessary causes in the maintenance of churches and schools.</p></blockquote>

<blockquote><p>…young men who would ‘endure long and hard labor in so much that after twelve hours hard work they will go in the evening to football, stoole ball, cricket, prison-base, wrestling, cugel throwing, or some such like vehement exercise.&#x27;” 7 Richard Baxter maintained that the argument from lack of spare time on week-days was a “sad argument to be used by them that by racking of rents do keep them (laboring people) in poverty.”8 The Puritan protest against Sabbath profanation was also a protest against overwork on the other six days of the week. But the truth is, it is not the minds of poor laboring men, that are overworked and tired on week-days, but it is their bodies; and therefore there is no recreation so suitable to them as the ease of the body, and the holy and joyful exercise of the mind, upon their Creator, and their Redeemer, and their everlasting rest.9 1 Bownd, Sabbathum Veteris, p. 271; cf. Dudley Fenner, A Short and Profitable Treatise, of lavvful and unlavvful Recreations; William Perkins, 1558-1602: English Puritanist, ed. by Thomas F. Merrill (Nieuwkoop, 1966), pp. 217-22 with extracts from Perkins’ The Whole Treatise of Cases of Conscience, Book 3. 2 Elton, An Exposition of the Ten Commandments, pp. 54-56; George Walker, The Doctrine of the Holy Weekly Sabbath (London, 1641), p. 157; Richard Baxter, The Divine Appointment of the Lord’s Day, pp. 440, 444-445. 3 Cf. Nicolas Bifield (Byfield), The Beginning of the Doctrine of Christ, or, A Catalogue of Sinnes (London, 1636), p. 63. 4 For a survey of the relative truth of this point, see Carl Bridenbaugh, Vexed and Troubled Englishmen, 1590-1642 (New York, 1968), pp. 109-118. 5 John Dod and Robert Cleaver, A Plaine and Familiar Exposition of the Ten Commandments (London, 1628), p. 140. 6 Percy Scholes (The Puritans and Music in England and New England(London, 1934), pp. 104-111) mentions the provisions of a bill presented to Parliament in 1647 which allowed every other Tuesday to be designated as a holiday. Scholes’ judicious treatment of the Puritan attitude toward recreation is refreshing as well as accurate; cf. also pp. 302-331. Compare Hugh Martin, Puritanism and Richard Baxter (London, 1954), pp. 101-106. 7 Bridenbaugh, Vexed, p. 115. 8 Baxter, Divine Appointment, p. 444. 9 Ibid., p. 445.</p></blockquote>

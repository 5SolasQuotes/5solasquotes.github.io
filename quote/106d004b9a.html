<blockquote><p>Objection. 1. But the wicked receive many of the gifts of the Holy Spirit, who nevertheless do not ask or desire them. Therefore these things are not merely given to such as desire them. Answer. The wicked do indeed receive many gifts; but not such as are principal nor peculiar to the elect, as faith, repentance, conversion, remission of sins and regeneration. And still further, the gifts which they do receive do not contribute to their salvation, but to their destruction. And should any one reply, and say that infants do not desire the Holy Ghost, and yet receive him, so that he must be given to more than those who ask and desire, we answer that the Holy Ghost is not given to any except such as desire him, which is to say, to adults who are capable of asking and seeking him. And yet even infants desire the Holy Ghost after their manner, in that they have in possibility an inclination to seek him just as they according to their manner believe, or have an inclination to faith. “Out of the mouth of babes and sucklings hast thou ordained strength.” (Ps. 8:2.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism, G. W. Williard</cite>, (Cincinnati, OH: Elm Street Printing Company, 1888), 619–20.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling.html">Effectual Calling</a></span></div>

<blockquote><p>20. In what sense is grace irresistible? It must be remembered that the true Christian is the subject at the same time of those moral and mediate influences of grace upon the will, common to him and to the unconverted, and also of those special influences of grace within the will, which are certainly efficacious. The first class of influences Christians may, and constantly do resist, through the law of sin remaining in their members. The second class of influences are certainly efficacious, but are neither resistible nor irresistible, because they act from within and carry the will spontaneously with them. It is to be lamented that the term irresistible grace has ever been used, since it suggests the idea of a mechanical and coercive influence upon an unwilling subject, while, in truth, it is the transcendent act of the infinite Creator, making the creature spontaneously willing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology 2nd ed., enlarged</cite>, ed. enlarged (London: Nelson, 1879), ch. 28, ‘The Application of Redemption…’, pp. 451-52</span></figcaption>

<blockquote><p>[19] Q. What is the outward theological calling? An. It is medium ad salitem [a means to salt], as the word and sacraments and the members of the visible church belong unto it. [20] Q. What is that inward theological calling? An. It is when God’s word brings [God’s word’s ring?] does not rest in our outward ears but comes into the heart and works somewhat there. [21] Q. How many ways [is] this taken? An. It is either effectual or ineffectual. [22] Q. What is the inward ineffectual calling? An. When it comes into the heart and falls as on stony ground. [23] Q. How far may this inward ineffectual calling bring us? An. To these four degrees of grace principally. 1. It may bring a man to see his own sin &amp; misery. 2ly. It may so work upon him, as it may bring him to have a desire after the thing persuaded [for?] 3ly It may bring him to some kind of degree of possession of the thing called for. 4ly It may bring him to some outward correspondence, as to reform many sins. [24] Q. Why then is it called an ineffectual calling? An. Because it does not fully persuade [the] heart to come in. … [30] Q. By what wording in scripture is our vocation expressed? An. By many expressions: as first by alluring and persuading. Hos. 2:14. 2ly by inviting and compelling. Math 22:4. 3ly by stretching out of the hand. Rom. 10:21. 4ly by beseeching, 2 Cor. 5:20. 5ly by drawing us. John 6.44. Lastly by apprehending. [31] Q. Do all these properly belong to effectual calling? An. No, the four first may be applied to ineffectual calling. … [38] Q. Whither do effectual and ineffectual calling differ in this respect or no, do not both come from God? An. They agree in this that both proceed from God, yet they differ in regard of the manner of work, for God does the work not secundum propositum [according to the purpose], but secundum obviam [according to the thing encountered]. … [55] Q. What and how many are the instrumental causes of our vocation? An. They are of two sorts either primary or secondary? [56] Q. What were the primary? An. The word. [57] Q. In what propositions was that expressed? An. James 5:11 [1:21?] suggests the word is the ordinary means whereby He calls and so by consequence the ministry of it. 2d. That it was but an instrumental cause under God and so it’s called the [sassed?] of God, the arm of god and sometime the power of God. 3ly. That as it’s but an instrumental cause so it did only belong to those which are adults, for infants may be said to be sanctified but not called. 4. That it was but a separable instrument. [58] Q. How can we say if the converting word is a separable means? An. For two reasons: Because the word may be without the Spirit. 2. Because the Spirit may be and may call some without the word. … [86] Q. Now you have spoken of the primary instruments of salvation as the word and sacraments. What are the secondary instruments? An. They are many as: 1. The mercies and favors of God common to all. Rom. 10:21 [“But to Israel he saith, All day long I have stretched forth my hands unto a disobedient and gainsaying people.”]. Bounty is one thing that may cause love so that one main instrument or means God uses to call us home which is to draw us with the thick cords of love [Hos. 11:4]. … [95] Q. Whether do effectual and ineffectual calling differ in this [Q: 94: ‘who are they whom God is thus pleased to call’]? An. Yes, for the ineffectual calling, many are called but few are chosen.</p></blockquote>

— Anthony Tuckney, A Brief &amp; Pithy Catechism (1628)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5B19%5D+Q.+What+is+the+outward+theological+calling%3F+An.+It+is+medium+ad+salitem+%5Ba+means+to+salt%5D%2C+as+the+word+and+sacraments+and+the+members+of+the+visible+church+belong+unto+it.+%5B20%5D+Q.+What+is+that+inward+theological+calling%3F+An.+It+is+when+God%E2%80%99s+word+brings+%5BGod%E2%80%99s+word%E2%80%99s+ring%3F%5D+does+not+rest+in+our+outward+ears+but+comes+into+the+heart+and+works+somewhat+there.+%5B21%5D+Q.+How+many+ways+%5Bis%5D+this+taken%3F+An.+It+is+either+effectual+or+ineffectual.+%5B22%5D+Q.+What+is+the+inward+ineffectual+calling%3F+An.+When+it+comes+into+the+heart+and+falls+as+on+stony+ground.+%5B23%5D+Q.+How+far+may+this+inward+ineffectual+calling+bring+us%3F+An.+To+these+four+degrees+of+grace+principally.+1.+It+may+bring+a+man+to+see+his+own+sin+%26+misery.+2ly.+It+may+so+work+upon+him%2C+as+it+may+bring+him+to+have+a+desire+after+the+thing+persuaded+%5Bfor%3F%5D+3ly+It+may+bring+him+to+some+kind+of+degree+of+possession+of+the+thing+called+for.+4ly+It+may+bring+him+to+some+outward+correspondence%2C+as+to+reform+many+sins.+%5B24%5D+Q.+Why+then+is+it+called+an+ineffectual+calling%3F+An.+Because+it+does+not+fully+persuade+%5Bthe%5D+heart+to+come+in.+%E2%80%A6+%5B30%5D+Q.+By+what+wording+in+scripture+is+our+vocation+expressed%3F+An.+By+many+expressions%3A+as+first+by+alluring+and+persuading.+Hos.+2%3A14.+2ly+by+inviting+and+compelling.+Math+22%3A4.+3ly+by+stretching+out+of+the+hand.+Rom.+10%3A21.+4ly+by+beseeching%2C+2+Cor.+5%3A20.+5ly+by+drawing+us.+John+6.44.+Lastly+by+apprehending.+%5B31%5D+Q.+Do+all+these+properly+belong+to+effectual+calling%3F+An.+No%2C+the+four+first+may+be+applied+to+ineffectual+calling.+%E2%80%A6+%5B38%5D+Q.+Whither+do+effectual+and+ineffectual+calling+differ+in+this+respect+or+no%2C+do+not+both+come+from+God%3F+An.+They+agree+in+this+that+both+proceed+from+God%2C+yet+they+differ+in+regard+of+the+manner+of+work%2C+for+God+does+the+work+not+secundum+propositum+%5Baccording+to+the+purpose%5D%2C+but+secundum+obviam+%5Baccording+to+the+thing+encountered%5D.+%E2%80%A6+%5B55%5D+Q.+What+and+how+many+are+the+instrumental+causes+of+our+vocation%3F+An.+They+are+of+two+sorts+either+primary+or+secondary%3F+%5B56%5D+Q.+What+were+the+primary%3F+An.+The+word.+%5B57%5D+Q.+In+what+propositions+was+that+expressed%3F+An.+James+5%3A11+%5B1%3A21%3F%5D+suggests+the+word+is+the+ordinary+means+whereby+He+calls+and+so+by+consequence+the+ministry+of+it.+2d.+That+it+was+but+an+instrumental+cause+under+God+and+so+it%E2%80%99s+called+the+%5Bsassed%3F%5D+of+God%2C+the+arm+of+god+and+sometime+the+power+of+God.+3ly.+That+as+it%E2%80%99s+but+an+instrumental+cause+so+it+did+only+belong+to+those+which+are+adults%2C+for+infants+may+be+said+to+be+sanctified+but+not+called.+4.+That+it+was+but+a+separable+instrument.+%5B58%5D+Q.+How+can+we+say+if+the+converting+word+is+a+separable+means%3F+An.+For+two+reasons%3A+Because+the+word+may+be+without+the+Spirit.+2.+Because+the+Spirit+may+be+and+may+call+some+without+the+word.+%E2%80%A6+%5B86%5D+Q.+Now+you+have+spoken+of+the+primary+instruments+of+salvation+as+the+word+and+sacraments.+What+are+the+secondary+instruments%3F+An.+They+are+many+as%3A+1.+The+mercies+and+favors+of+God+common+to+all.+Rom.+10%3A21+%5B%E2%80%9CBut+to+Israel+he+saith%2C+All+day+long+I+have+stretched+forth+my+hands+unto+a+disobedient+and+gainsaying+people.%E2%80%9D%5D.+Bounty+is+one+thing+that+may+cause+love+so+that+one+main+instrument+or+means+God+uses+to+call+us+home+which+is+to+draw+us+with+the+thick+cords+of+love+%5BHos.+11%3A4%5D.+%E2%80%A6+%5B95%5D+Q.+Whether+do+effectual+and+ineffectual+calling+differ+in+this+%5BQ%3A+94%3A+%E2%80%98who+are+they+whom+God+is+thus+pleased+to+call%E2%80%99%5D%3F+An.+Yes%2C+for+the+ineffectual+calling%2C+many+are+called+but+few+are+chosen.%E2%80%9D%0A%0A%E2%80%94+Anthony+Tuckney%2C+A+Brief+%26+Pithy+Catechism+%281628%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F973366d52e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/973366d52e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-calling/#:~:text=19%5D%20Q.%20What%20is%20the%20outward,are%20called%20but%20few%20are%20chosen&amp;text=19%5D%20Q.%20What%20is%20the%20outward%20theological%20calling&amp;text=calling%2C%20many%20are%20called%20but%20few%20are%20chosen" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>He does not knock at the door of his friends merely, but at the door of his enemies. He knocks at the door of the vilest of sinners… 3. Behold the extent of his willingness to receive sinners. The sinner sometimes says, ‘I am willing to receive Christ, but He is not willing to receive me.’ But what says the text? ‘Behold I stand at the door and knock.’ Does not this imply his readiness and willingness to come in? Nor is this all—He calls, ‘Open unto Me—open unto Me.’ Nor is this all—He says, ‘if any man hear my voice and open the door, I will come in.’ He positively declares that He is willing. Nor is this all—you may say, I am such a great sinner—I have rejected him so long, that He will not receive me now. But what says the Savior? ‘If any man hear my voice’—vile as he may be, if he is on the side of hell—‘if any man hear my voice and open the door, I will come in to him, and sup with him, and he with Me.’ If you are not now a Christian, permit me to say that you have never heard his voice, nor opened the door, nor been willing to receive Him. You have never complied with the invitation in the text. The Savior is ready and willing, but you will not come to Him that you might have life. [Jn. 5:40] 4. Behold your danger. The Savior stands at your door. He does not sit. He stands ready to enter or ready to depart… He may say, as he once said to the Jews, ‘I go my way. Ye shall see me, and shall die in your sins.’ How often ‘I would,’ and ‘ye would not.&#x27;</p></blockquote>

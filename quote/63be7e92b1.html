<main class="wrap"><figure class="quote" id="q-63be7e92b1" data-kw="">
<blockquote><p>Sports and pastimes, and natural wonted recreations, such as may be used on the week day are also forbidden [on the Sabbath], and therefore in the place alleged before, it is forbidden to seek one’s own pleasure or will, and sure he that taketh leave to use pastimes seeks his own pleasure as he that followeth his business.

Indeed when work is forbidden, sports can hardly be allowed which are never lawful, but as sauce for work, only the spiritual pastimes of singing holy Psalms and Songs as a spiritual recreation is allowed to prevent all weariness. Indeed the exercises of the day are of such divers kinds, that nothing but mere fleshliness can cause a man to be weary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A system or body of divinity consisting of ten books: wherein the fundamentals and main grounds of religion are opened, the contrary errors refuted, most of the controversies between us, the papists, Arminians, and Socinians discussed and handled, several Scriptures explained and vindicated from cor</cite>, (London: William Lee, 1654), IX.V, p. 818.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2234423053" data-kw="">
<blockquote><p>…that arrangement which takes away all confusion, barbarity, obstinacy, turbulence, and dissension. There are examples of the first sort in Paul: that profane drinking bouts should not be mingled with the sacred supper of the Lord (1 Cor. 11:21-22), and that women should not go out in public with uncovered heads (1 Cor. 11:5). And we have many others in daily use, such as: that we pray with knees bent and head bare… [Calvin implicitly distinguishes that female covering in Paul’s time was a normal social propriety for appearing in public. Greek and Roman men on the other hand, went uncovered in public. In Reformation Geneva, men normally wore hats in public, but then uncovered for prayer.] But because He did not will in outward discipline and ceremonies what we ought to do (because He foresaw that this depended upon the state of the times, and He did not deem one form suitable for all ages), here we must take refuge in those general rules which He has given, that whatever the necessity if the church will require for order and decorum should be tested against these… Lastly, because He has taught nothing specifically, and because these things are not necessary to salvation, and for the upbuilding of the church ought to be variously accommodated to the customs of each nation and age, it will be fitting (as the advantage of the church will require) to change and abrogate traditional practices and to establish new ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (Westminster Press), bk. 4, ch. 10, sections 29-30, pp. 1207-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-274a098af2" data-kw="">
<blockquote><p>Now if the Pope’s Commands are in force, and the Commands of God dispensed with, the Commands of the Pope will soon just out the Commands of God. You know the Pope hath by the Plenitude of his power struck out the second Commandment, and by the same authority he may when he please, strike out the first Commandment, and by consequent all the rest; and then he may make a new Preface, and a new Decalogue, if that number will content him, he may say as the Extravagant saith, that he himself [is the Lord our God,] who desires to bring us into the land of Egypt, the house of bondage (he should do well to put in that) where we shall have no other God but the Pope, for he exalts himself above all that is called God; but we may have as many Images, and Idols as we please, and so take the Name of our God in vain; we must keep all the Saint’s days, and then we shall not be at leisure to keep the Lord’s-day; you know the Pope’s Agents here in England, about four years ago, did not only dispense with the people for observing the Lord’s-day, but enjoin them to prophane it: you know their Doctrine about equivocation, and Fornication; they do too often count Murther meritorious, a Doctrine which doth well become the mouth of that purple whore, who is drunk with the blood of Saints.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sion’s memento, and Gods alarum. In a sermon at Westminster, before the Honourable House of Commons, on the 31. of May 1643. the solemn day of their monthly fast</cite>, (London: Samuel Gellibrand, 1643), p. 15.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Q. What is the 2d. Commandment?

A. Thou shalt not make to thy self any graven image, &amp;c.

Q. What is the meaning of this Commandment?

Ans. That we should worship the true God with true worship: such as God hath ordained, not such as man hath invented.</p></blockquote>

<blockquote><p>…’It is a public offence’ (says the Author [an opponent]) ‘that they have worshipped God according to the precepts of men, etc.’ [Rutherford’s] Answer: This is the crime of conformity which I wish were publicly repented by all which have defiled themselves with submitting to an antichristian government and the will-worship of men, yet does not this make ministers no ministers, so as they must receive ordination to the ministry of new. Peter’s fall took not away his apostleship, nor Jonah’s flying from God, nor David’s adultery made them not leave off to be prophets.</p></blockquote>

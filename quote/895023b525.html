<main class="wrap"><figure class="quote" id="q-895023b525" data-kw="">
<blockquote><p>[T]he special statute designed to prevent this crime, “He that stealeth a man and selleth him, or if he be found in his hand, he shall surely be put to death,” forever brands with the stamp of God’s reprobation and curse American slavery, and rendered the practice of such an iniquity in the Jewish Commonwealth impossible. The law does not read, he that stealeth a slave and selleth him, nor he that stealeth a servant even, and selleth him, but he that stealeth a man. It was the crime of stealing a man from himself, of removing him from a condition of freedom to a condition of bondage, as our slaves were stolen in the first instance from Africa, against which this law was directed; the very grossest outrage that can be perpetrated on humanity, a crime in God’s sight of the deepest dye, and therefore adjudged worthy of the severest punishment known to the divine law, namely, death.

Dare Mr. Van Dyke deny this? So have said all the churches; – his own included, in its testimony of 1801 – previous to its enlightenment and sanctification by the price of cotton, sugar, and tobacco! So have all the civilized nations of the world agreed, by declaring the foreign slave-trade murder and piracy, words all too mild to express the enormity of its guilt. There was no such crime as slave-stealing known in Israel, for the simple reason that there were no slaves to steal. However criminal helping a man to freedom may be, it is not forbidden in the divine word; on the contrary … it is highly commended. But the crime of man-stealing was known in the heathen nations round about Israel; and against the practice of such enormity, God guarded his chosen people by the fiery sword of this express and unqualified enactment. Can any man deny that American slavery originated in man-stealing? If so, does it not stand condemned and cursed in its very root, by the law of that God whose judgment is according to truth? Moreover, as if the Spirit designed to anticipate all subterfuges, it is added, “and if he be found in his hand, he shall surely be put to death.” Had it been made for our system, and designed to meet the argument with which it is attempted to be supported, it could not have been more specific.

How many transfers then, I ask, in the name of all that is sacred, does it require to transform this vice into a virtue? – this crime, against which the judgments of Heaven are denounced, into a grand missionary enterprise, and its practice into the highest exercise of a heavenly beneficence and piety? …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-r-w-sloane.html">J. R. W. Sloane</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Review of Rev. Henry J. Van Dyke’s discourse on “The character and influence of abolitionism,” a sermon preached in the Third Reformed Presbyterian Church, Twenty-Third Street, New York, on Sabbath evening, December 23, 1860</cite>, (New York, 1861), pp 10-11. Available from here.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9484f8547e" data-kw="">
<blockquote><p>Now that a just harmony may be kept between these two different orders and administrations, two extremes must be avoided. [The first is] that they be not confounded, either (1) by giving the spiritual power, which is proper to the church, into the hand of the civil magistrate, as Erastus would have done in the matter of excommunication. If any magistrate should presume to thrust himself by his authority or otherwise into a work which properly belongs to a church officer, let him remember what befell Saul and Uzziah for so doing.

Or (2) by giving civil power to church officers, who are called to attend only to spiritual matters, and the things of God, and therefore may not be distracted from them by secular entanglements. I say, church officers, not church members; for they (not being limited as the officers are by God) are capable of two different employments, suiting with two different men in them, in different respects, as has been said. And as they may lawfully be employed about things of this life, so they are of all men fittest, being sanctified and dedicated to God to carry on all worldly and civil business to God’s ends, as we shall declare in due time. …

The second extreme to be avoided is that these two different orders and states, ecclesiastical and civil be not set in opposition as contraries, that one should destroy the other, but as coordinate states in the same place reaching forth help mutually each to other, for the welfare of both, according to God. So that both officers and members of churches be subject, in respect of the outward man, to the civil power of those who bear rule in the civil state according to God, and teach others so to do.

And that the civil magistrates and officers, in regard of the inward man, subject themselves spiritually to the power of Christ in church ordinances, and by their civil power preserve the same in outward peace and purity; and this will best be attained, when the pastor may say to the magistrate, as Gregory Nazianzen wrote to the magistrate of Nazianzum, “I know thou art a sheep of my flock, a holy sheep of a holy flock,” [and] again, “You rule with Christ, and administer to Christ; you have the sword from him: let this gift which you have received from him be kept pure for him.” And [it is attained] when the civil magistrate in his church-state answers Ambrose [according to] his description of a good emperor: “A good magistrate is within the church, not above it.</p></blockquote>

<blockquote><p>II. Law is an ordinance of reason, instituted by him who has the care of a community, concerning good things, for the common and particular advantage of some society; teaching what is to be done and what is not, and likewise commanding or forbidding the same, and obligating the rational creature to perform those things by the threatening of punishment and the promise of reward. … XIX. From this distinction of the Mosaic law, judgment is easily made concerning the difference and agreement of these three parts [the moral, ceremonial and judicial laws], both in substance and as to their accidental abrogation. They agree: 1. in author, both principal and ministerial. 2. in general end, namely, the common good.</p></blockquote>

<blockquote><p>Neither are Kings and Princes blameless in this case of Famine, who though their charge be to provide for the good of the people, yet they utterly neglect them, rather impoverishing their subjects, yea, even in the dearest years, burthening them with taxes and subsidies: the Court is costly, and will be gallant: horses, hounds, hawks, harlots, jesters, must be maintained, who wrings for it? the poor subject, who must rather be undone, then the Court should want: from whence followeth this inconvenience, that the people being thus exhausted, and drunk up by these sucking subsidies and exactions, many of them become desperate, and utterly neglect their family at home, and setting the Hare’s head to the Goose gibbets, and all that they have at a mumme [sic] chance, will rather loosely misspend it themselves, then thus to be made sponges, and that which they have to be squeezed from them by crushing Courtiers.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Neither are Kings and Princes blameless in this case of Famine, who though their charge be to provide for the good of the people, yet they utterly neglect them, rather impoverishing their subjects, yea, even in the dearest years, burthening them with taxes and subsidies: the Court is costly, and will be gallant: horses, hounds, hawks, harlots, jesters, must be maintained, who wrings for it? the poor subject, who must rather be undone, then the Court should want: from whence followeth this inconvenience, that the people being thus exhausted, and drunk up by these sucking subsidies and exactions, many of them become desperate, and utterly neglect their family at home, and setting the Hare’s head to the Goose gibbets, and all that they have at a mumme [sic] chance, will rather loosely misspend it themselves, then thus to be made sponges, and that which they have to be squeezed from them by crushing Courtiers.”

</figure><figure class="quote" id="q-7359ad460f" data-kw="">
<blockquote><p>Since Thou hast commanded us to pray for kings and princes, and for all who are placed in authority, we pray, among others, for those governments whose theological professors are present in this solemn ecclesiastical assembly, as well as for those who are yet expected; and for his royal majesty of Great Britain, James I, who is a courageous and conscientious protector of the true faith. We pray for his son-in-law, the illustrious Prince Elector of the Roman Empire and Palatinate on the Rhine, and for the Chief Magistrate of the Empire. We pray for the illustrious Duke and Elector of Brandenburg, for the illustrious Count of Hesse, for the United Cantons in Switzerland, for the high-borne counts of Nassau and Wetteravia, and for the honourable and worthy Council, the Republics of Geneva, Bremen, and Emden.

Especially we pray for those whom Thou hast placed over us in the Reformed Netherlands: for the exalted lords the States General, and for their exalted deputies to this Synod; for the illustrious and warlike hero, the Prince of Orange, and for the entire house of Nassau; for the noble-minded lords states of Holland and West Friesland; for the most wise noble-minded lords, the Presidents and Counselors of both of the Courts of Justice; and for the respectable Council of this city, the Lord Sheriff, Mayor, Aldermen, and the eight judges.

Grant that each and every one of them might serve Thee with reverence and rejoice with trembling. Confirm their scepter and secure their throne in ever-increasing measure, that they might remain faithful, nurturing fathers of Thy church in these regions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/balthasar-lydius.html">Balthasar Lydius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Prayer of Balthasar Lydius’, trans. Douglas J. Kuiper and H. David Schuringa Protestant Reformed Theological Journal</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-20c3a53900" data-kw="">
<blockquote><p>For suppose we agree that its [God’s] existence involved no actualization of potential. Might not we still say that its activity involved the actualization of potential? Might not we thus say that while it had no potentialities with respect to its existence, it does have potentialities with respect to its activity (such as its activity of actualizing the existence of other things)? There are several problems with this suggestion, however, one of which might be obvious now that we have set out the principle agere sequitur esse [action follows being], according to which what a thing does reflects what it is. If the first cause of things exists in a purely actual way, how could it act in a less than purely actual way? How could its acting involve potentiality any more than its existence does? A thing’s existence is, after all, what is metaphysically most fundamental about it; everything else follows from that. In this case we are talking about something whose very existence is purely actual and devoid of potentiality. So, from where in its nature are the (metaphysically less fundamental) potentialities for activity that the critic suggests it has supposed to derive? Another problem with the suggestion in question is that to say of God that he has potentiality with respect to his activity, though not with respect to his existence, entails that God has parts—a purely actual part, and a part that is a potentiality. Now, as we saw in chapter 2, whatever has parts requires a cause. The reason is that the whole of which the parts are constituents is merely potential until actualized by some principle which combines the parts. This principle cannot be something intrinsic to the thing, for in that case it would be the cause of itself, which is incoherent. So, it must be something extrinsic to the thing. Keep in mind that this is true even if we think of the thing in question as having always existed, since we still need some explanation of why the parts are combined at all regardless of how long they have been combined. Even if the thing had no temporally prior cause, it would still require an ontologically prior cause. But to say of the first cause of things that it has a cause of its own is also incoherent, since if it has a cause of its own, it just isn’t really the first cause at all, and it isn’t what terminates the regress of a hierarchical series of the causes of the existence of things. For this reason too, then, there isn’t any sense to be made of the idea that God qua [as] first cause has potentialities with respect to his activity. So, again, God is purely actual, with no potentiality at all.</p></blockquote>

<blockquote><p>Immutability is God without any alteration in respect of being, will or any accidents, Ps. 102:27-28; Mal. 3:6; Jam. 1:17, ‘With whom is no variableness, nor shadow of turning.’ Objection: God might have willed or not willed the being of the creature, else He were not free. He that may both will and not will is mutable. The sum is: The liberty and immutability of God seem not to consist together. Answer: That immutability and liberty consist together is evident from the nature of God, who wills his own being freely. (see Smising, [Tract on the One God] tract 2, disp. 3, quest. 1, num. 23) If He were subject to co-action and mutability, He were not God. If by reason of our weakness we are less able so distinctly to discern the liberty of God as concerning the creature in the act of God willing, yet it is clearly to be seen in the object willed, viz. the creature: because nothing is more manifest than that there is no necessary connection between the being of God and the being thereof. God had been the same, perfect and blessed forever, though the creature had never been. Objection 2: God’s will in his decree and his will in the command are often contrary one unto another; therefore He is not immutable. Answer: No such thing. The decree determines what shall be; the command shows what ought to be. God’s willing the futurition of the betraying of Christ by Judas, and yet willing it to be Judas’s duty not to betray Christ, have not the least appearance of two wills in God. Objection 3: God sometime[s] promises and performs not: threatens and executes not; therefore He may seem not to be immutable. Answer: Such promises and threatnings are to be understood conditionally, not absolutely. See Jer. 18:7, 10. Objection 4: God in Scripture is often said to repent; He that repents is not immutable. Answer: Such speeches, though spoken after the manner of men for the help of our understanding, yet are to be understood as becomes the nature of God. God is therefore said to repent because He does as men do when they repent, that is, He changes his deeds: yet without any change of his will. Nay, those changes of his deeds are the executions of his unchangeable will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 8-9</span></figcaption>

<blockquote><p>41. Potency involves some imperfection if it is understood in the sense of subjective or objective potency (potential being) [see pp. 51-52] or of passive or obediential potency¹ [see pp. 52-53]; but not if it is understood as: the possible is opposed to the impossible. ¹ [See also ‘On Obediential Potency’.] The point is plain from the definitions of these potencies; for all these potencies adduced before agree in that they express the capacity of receiving some real perfection, and so that which is said to be in this sort of potency is in itself perfectible and hence in some way imperfect. Actual being on the contrary does not involve imperfection. The same must be said of the logically possible and of active potency¹ [that these do not involve imperfection]. ¹ [The importance here is because the First Cause (i.e. God) has no passive potency, or capability to be acted upon or effected, but has all active potency, that is, to act upon others. This is not special pleading for God, but is plainly necessary for what a First Cause must be. See ‘On the Distinction Between Passive Power (Denied) &amp; Active Power (Affirmed) About God’.] 42. Act and potency as constitutive principles involve imperfection insofar as they are mutually perfectible in themselves; for only the imperfect is perfectible. 43. Potential being considered in itself is not simply real, that is, does not really exist, save virtually in its causes. But it differs conceptually from the absolutely nothing and from being of reason [that which only exists in a mind]; for the idea of a possible quiddity [what-ness or essence] involves the relation of non-repugnance to existence, while the others do not. 44. Therefore that which is a potential being cannot have the reason for its existence in itself but in its cause; so the potential is the causable. 45. If something is a potential being, something else is actual. Potential being does not in fact exist; therefore if it can in fact exist, some being is required that can effect it; therefore (from conclusions 24 and 26) something actually exists, namely at least the first ineffectible efficient cause. 46. If something is in subjective, passive, objective, or obediential potency it is causable. The point is plain from the definitions, at least as concerns the real perfection to which something is in potency. 47. Therefore if something is uncausable, it is not in this sort of potency,¹ but is pure act (from negation of the previous conclusion). ¹ [The importance again, is that the First Cause (i.e. God) can have no passive potency to be acted on (which would be an imperfection), but, in the words of Wolter, has all logical potency, or active potency to cause others (which is no imperfection, but the height of perfection).]</p></blockquote>

herefore if it can in fact exist, some being is required that can effect it; therefore (from conclusions 24 and 26) something actually exists, namely at least the first ineffectible efficient cause. 46. If something is in subjective, passive, objective, or obediential potency it is causable. The point is plain from the definitions, at least as concerns the real perfection to which something is in potency. 47. Therefore if something is uncausable, it is not in this sort of potency,¹ but is pure act (from negation of the previous conclusion). ¹ [The importance again, is that the First Cause (i.e. God) can have no passive potency to be acted on (which would be an imperfection), but, in the words of Wolter, has all logical potency, or active potency to cause others (which is no imperfection, but the height of perfection).]”

— Allan B. Wolter, ‘Allan Wolter’s Conclusions respecting Reality, Proving God’ (1958), ‘Conclusions respecting Reality’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C41.+Potency+involves+some+imperfection+if+it+is+understood+in+the+sense+of+subjective+or+objective+potency+%28potential+being%29+%5Bsee+pp.+51-52%5D+or+of+passive+or+obediential+potency%C2%B9+%5Bsee+pp.+52-53%5D%3B+but+not+if+it+is+understood+as%3A+the+possible+is+opposed+to+the+impossible.+%C2%B9+%5BSee+also+%E2%80%98On+Obediential+Potency%E2%80%99.%5D+The+point+is+plain+from+the+definitions+of+these+potencies%3B+for+all+these+potencies+adduced+before+agree+in+that+they+express+the+capacity+of+receiving+some+real+perfection%2C+and+so+that+which+is+said+to+be+in+this+sort+of+potency+is+in+itself+perfectible+and+hence+in+some+way+imperfect.+Actual+being+on+the+contrary+does+not+involve+imperfection.+The+same+must+be+said+of+the+logically+possible+and+of+active+potency%C2%B9+%5Bthat+these+do+not+involve+imperfection%5D.+%C2%B9+%5BThe+importance+here+is+because+the+First+Cause+%28i.e.+God%29+has+no+passive+potency%2C+or+capability+to+be+acted+upon+or+effected%2C+but+has+all+active+potency%2C+that+is%2C+to+act+upon+others.+This+is+not+special+pleading+for+God%2C+but+is+plainly+necessary+for+what+a+First+Cause+must+be.+See+%E2%80%98On+the+Distinction+Between+Passive+Power+%28Denied%29+%26+Active+Power+%28Affirmed%29+About+God%E2%80%99.%5D+42.+Act+and+potency+as+constitutive+principles+involve+imperfection+insofar+as+they+are+mutually+perfectible+in+themselves%3B+for+only+the+imperfect+is+perfectible.+43.+Potential+being+considered+in+itself+is+not+simply+real%2C+that+is%2C+does+not+really+exist%2C+save+virtually+in+its+causes.+But+it+differs+conceptually+from+the+absolutely+nothing+and+from+being+of+reason+%5Bthat+which+only+exists+in+a+mind%5D%3B+for+the+idea+of+a+possible+quiddity+%5Bwhat-ness+or+essence%5D+involves+the+relation+of+non-repugnance+to+existence%2C+while+the+others+do+not.+44.+Therefore+that+which+is+a+potential+being+cannot+have+the+reason+for+its+existence+in+itself+but+in+its+cause%3B+so+the+potential+is+the+causable.+45.+If+something+is+a+potential+being%2C+something+else+is+actual.+Potential+being+does+not+in+fact+exist%3B+therefore+if+it+can+in+fact+exist%2C+some+being+is+required+that+can+effect+it%3B+therefore+%28from+conclusions+24+and+26%29+something+actually+exists%2C+namely+at+least+the+first+ineffectible+efficient+cause.+46.+If+something+is+in+subjective%2C+passive%2C+objective%2C+or+obediential+potency+it+is+causable.+The+point+is+plain+from+the+definitions%2C+at+least+as+concerns+the+real+perfection+to+which+something+is+in+potency.+47.+Therefore+if+something+is+uncausable%2C+it+is+not+in+this+sort+of+potency%2C%C2%B9+but+is+pure+act+%28from+negation+of+the+previous+conclusion%29.+%C2%B9+%5BThe+importance+again%2C+is+that+the+First+Cause+%28i.e.+God%29+can+have+no+passive+potency+to+be+acted+on+%28which+would+be+an+imperfection%29%2C+but%2C+in+the+words+of+Wolter%2C+has+all+logical+potency%2C+or+active+potency+to+cause+others+%28which+is+no+imperfection%2C+but+the+height+of+perfection%29.%5D%E2%80%9D%0A%0A%E2%80%94+Allan+B.+Wolter%2C+%E2%80%98Allan+Wolter%E2%80%99s+Conclusions+respecting+Reality%2C+Proving+God%E2%80%99+%281958%29%2C+%E2%80%98Conclusions+respecting+Reality%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff37f11e482.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f37f11e482.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-god-as-pure-act/#:~:text=41.%20Potency%20involves%20some%20imperfection%20if,imperfection%2C%20but%20the%20height%20of%20perfection&amp;text=41.%20Potency%20involves%20some%20imperfection%20if%20it%20is&amp;text=is%20no%20imperfection%2C%20but%20the%20height%20of%20perfection" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>II. It is not queried whether passive power (which is the principle of suffering from another) may be granted in God. Since this cannot be supposed without imperfection and change, it is evident that it should be removed far from him. Nor if the generation of the Son or the spiration of the Spirit is expressed in passive terms, does it immediately follow that there is in God passive power (since this denotes a mere relation [schesin] to the persons generating and spirating). But we treat only of the active power, the principle of acting on another.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-191b7244e3" data-kw="">
<blockquote><p>You are pleased, dear sir, very kindly to ask me, whether I could sign the Westminster Confession of Faith, and submit to the presbyterian form of government; and to offer to use your influence to procure a call for me to some congregation in Scotland. I should be very ungrateful if I were not thankful for such kindness and friendship. As to my subscribing to the substance of the Westminster Confession, there would be no difficulty; and as to the presbyterian government, I have long been perfectly out of conceit of our unsettled, independent, confused way of church government in this land, and the presbyterian way has ever appeared to me most agreeable to the word of God, and the reason and nature of things; though I cannot say that I think that the presbyterian government of the Church of Scotland is so perfect, that it cannot, in some respects, be mended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>From a letter from Edwards to John Erskine in Scotland. ‘Memoir of Edwards’, prefixed to the London edition of his Works, p. 163 Edwards was an early-1700’s, New England congregationalist</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9f4237cccc" data-kw="">
<blockquote><p>I know that even by some of the Fathers these two places, to wit, Eph. 4:11-12 and 1 Tim. 3:2 with 8, are adduced for the same end [for bishops]: because, in the first place, the apostle reckons out both extraordinary and ordinary preaching-officers, without making any mention of bishops: which could not be, if they were not the same with pastors that are named, as Ambrose on the place asserts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lecture 3, ‘Concerning the Identity of Angel, Bishop &amp; Presbyter’ in A Commentary upon the Book of the Revelation (Edinburgh, 1658), pp. 223-33</cite>, p. 224</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-58da2d3e5c" data-kw="">
<blockquote><p>Furthermore, our theologians believe that churches should be free to send and delegate to councils even private individuals, provided they are pious, learned, and knowledgeable in ecclesiastical matters, and these, in such a case, can give their vote on proposed matters in common with the pastors and elders. This is also taught and believed by Whitaker in Controversy 3, On Councils, question 3, the illustrious Moses Amyraut in his Theses on Councils, part 2, Wendelin in Christian Theology, book 1, chapter 28, thesis 31, Bucanus in place 43, number 23, and Tilenus in Disputations on Councils, 1, and many others. Hence, it is evident what the status of this controversy with the modern Pontiffs is, namely, whether only bishops have a decisive vote in councils, which the Pontiffs affirm, or whether the same right belongs to any delegates of the churches, whether they are pastors or from other governors of the Church, or even otherwise private individuals, which our theologians teach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>2. ‘Who are to be called to councils, and of what kind of persons they should consist’ in Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), Posthumous Works, 4. Controversies on Councils, pp. 1029-31 Latin</cite>, p. 1,031</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/the-ruling-of-the-church#:~:text=Furthermore%2C%20our%20theologians%20believe%20that%20churches,private%20individuals%2C%20which%20our%20theologians%20teach&amp;text=Furthermore%2C%20our%20theologians%20believe%20that%20churches%20should%20be&amp;text=even%20otherwise%20private%20individuals%2C%20which%20our%20theologians%20teach" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-d0d239f23f" data-kw="">
<blockquote><p>A man may be in some sort called by another to exercise some power which is not his that so called him. As when a physician is called by the civil magistrate or by a bishop to exercise such art as he has, among the people that are ruled by him. For no man I think will say that such a physician in giving of a potion does exercise a kingly or an episcopal power. So likewise is the case of a schoolmaster set in place by a bishops license and authority: in teaching of grammar, he does not exercise the power of a bishop.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr. [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615)</cite>, p. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

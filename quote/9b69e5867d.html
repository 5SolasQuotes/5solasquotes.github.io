<main class="wrap"><figure class="quote" id="q-9b69e5867d" data-kw="">
<blockquote><p>Is it possible to find a single instance in Scripture of accepted worship that was not prescribed by God? In the first act of worship recorded after the Fall, we are told that the person and offering of Cain were rejected, whilst those of Abel were accepted. Apart from the fact that a mere thank-offering, although it might suit an angel or an unfallen man, was totally unsuitable for a sinner, it is clear that there was a divine appointment of sacrifice pointing to the cross of Christ, for it is said, “By faith Abel offered unto God a more excellent sacrifice than Cain.”

Now faith implies a revelation or a testimony on which to rest, and it is evident that by the first promise in Eden, and the emblematical coats of skins, implying that the innocent must suffer that the guilty might be clothed, the doctrine of substitution was taught to our first parents before they were driven from the scene of their transgression. From the very first, therefore, acceptable worship was coupled with God’s appointment of sacrifice, and with the principle that “without shedding of blood there is no remission.”

Proceeding on this central principle, when men ceased to use their simple altars of earth or stone, and when an elaborate system of worship was introduced embodying still clearer types and emblems of the coming Messiah and His work, nothing was left to the invention of Moses, although so eminent in wisdom, and although God spake to him “as a man speaketh to his friend.” The most minute arrangements were made by God in regard to all parts of worship down to the pins of the tabernacle, and He said to Moses, “See thou do all things after the pattern shewed thee on the Mount.” God said, “What thing soever I command you, observe to do it; thou shalt not add thereto nor diminish from it.”

When David gave instructions to Solomon in regard to building the temple, it is said he gave “the pattern of all that he had by the Spirit;” and at the end he repeats this Divine appointment as follows:—“All this, said David, the Lord made me understand in writing by His hand upon me; even all the works of this pattern” (1 Chron. xxviii. 19). Every deviation from this, even in the smallest particular, and even when a good motive might have been pleaded, was condemned and resented by God.

By and by this system, with all its peculiarities, as having served its purpose, was done away with, and we emerge into the clearer light of the New Testament dispensation as foretold by Christ to the woman of Samaria. But the same principle still continues, and is clearly enforced. Christ commands His apostles to go and teach all nations, but still it is with this solemn injunction, “Teaching them to observe all things whatsoever I have commanded you;” it is not whatsoever I have not forbidden.

They were simply ambassadors for Christ, acting under written and limited instructions which were also in the hands of all the people, that all might judge how far they acted in accordance with them. Accordingly, when the Apostle Paul gives instructions in regard to the Sacrament of the Lord’s Supper, he says, “I have received of the Lord that which also I delivered unto you.” There is no permission to be found in the Word of God to alter, add to, or modify the ordinances of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anarchy in Worship or Recent Innovations Contrasted with the Constitution of the Presbyterian Church and the Vows of Her Office-Bearers</cite>, (Edinburgh: Lyon &amp; Gemmell, 1875), pp 11-12.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1b8532b14b" data-kw="">
<blockquote><p>This grand mercy is described in Scripture by God his giving something to us, not our doing any thing to him. It is described by God’s actions, &amp; not ours to him, which may abundantly satisfy the heart against all doubts and fears; thus the Scripture calls it forgiving, not imputing sin, imputing righteousness, making righteous, all which are actions from God to us, not ours to him, so that we are no where said in a good sense to Justify ourselves, or commanded to it, as we are to repent, or believe, and to crucify the lusts of the flesh, because it is wholly God’s action; by faith indeed we apprehend it, but it’s God’s action, as the window letteth in the light, but it is the Sun that doth enlighten.

And from this particular, we may gather much comfort, for when we look into our selves and see no such righteousness or holiness, that we dare hold out to God, then we may remember, this is not by our doing to God, but receiving from him; and in this sense, it is more blessed for us to receive, then to give. This made the Father say, justitia nostra, est indulgentia tua, our righteousness is thy indulgence.

Therefore let not the troubled heart say, where is my perfect repenting? where is my perfect obedience? but rather ask, where is God’s forgiving? where is God’s not imputing? how hardly is the soul drawn off from resting in it self? it is not thy doing, but God’s doing; thou must not consider, what do I, but what God doth. The Antinomian, he indeed wringeth these breasts of Consolation, till blood cometh, but the true sweet milk of the word must not therefore be thrown away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), pp 12-13.</span></figcaption>

</figure><figure class="quote" id="q-df8375b2d9" data-kw="">
<blockquote><p>The distortion of double predestination looks like this: There is a symmetry that exists between election and reprobation. God works in the same way and same manner with respect to the elect and to the reprobate. That is to say, from all eternity God decreed some to election and by divine initiative works faith in their hearts and brings them actively to salvation. By the same token, from all eternity God decrees some to sin and damnation (destinare ad peccatum) and actively intervenes to work sin in their lives, bringing them to damnation by divine initiative. In the case of the elect, regeneration is the monergistic work of God. In the case of the reprobate, sin and degeneration are the monergistic work of God. Stated another way, we can establish a parallelism of foreordination and predestination by means of a positive symmetry. We can call this a positive-positive view of predestination. This is, God positively and actively intervenes in the lives of the elect to bring them to salvation. In the same way God positively and actively intervenes in the life of the reprobate to bring him to sin. This distortion of positive-positive predestination clearly makes God the author of sin who punishes a person for doing what God monergistically and irresistibly coerces man to do. Such a view is indeed a monstrous assault on the integrity of God. This is not the Reformed view of predestination, but a gross and inexcusable caricature of the doctrine. Such a view may be identified with what is often loosely described as hyper-Calvinism and involves a radical form of supralapsarianism. Such a view of predestination has been virtually universally and monolithically rejected by Reformed thinkers.</p></blockquote>

— R. C. Sproul, Chosen But Free, Chapter on Double Predestination">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+distortion+of+double+predestination+looks+like+this%3A+There+is+a+symmetry+that+exists+between+election+and+reprobation.+God+works+in+the+same+way+and+same+manner+with+respect+to+the+elect+and+to+the+reprobate.+That+is+to+say%2C+from+all+eternity+God+decreed+some+to+election+and+by+divine+initiative+works+faith+in+their+hearts+and+brings+them+actively+to+salvation.+By+the+same+token%2C+from+all+eternity+God+decrees+some+to+sin+and+damnation+%28destinare+ad+peccatum%29+and+actively+intervenes+to+work+sin+in+their+lives%2C+bringing+them+to+damnation+by+divine+initiative.+In+the+case+of+the+elect%2C+regeneration+is+the+monergistic+work+of+God.+In+the+case+of+the+reprobate%2C+sin+and+degeneration+are+the+monergistic+work+of+God.+Stated+another+way%2C+we+can+establish+a+parallelism+of+foreordination+and+predestination+by+means+of+a+positive+symmetry.+We+can+call+this+a+positive-positive+view+of+predestination.+This+is%2C+God+positively+and+actively+intervenes+in+the+lives+of+the+elect+to+bring+them+to+salvation.+In+the+same+way+God+positively+and+actively+intervenes+in+the+life+of+the+reprobate+to+bring+him+to+sin.+This+distortion+of+positive-positive+predestination+clearly+makes+God+the+author+of+sin+who+punishes+a+person+for+doing+what+God+monergistically+and+irresistibly+coerces+man+to+do.+Such+a+view+is+indeed+a+monstrous+assault+on+the+integrity+of+God.+This+is+not+the+Reformed+view+of+predestination%2C+but+a+gross+and+inexcusable+caricature+of+the+doctrine.+Such+a+view+may+be+identified+with+what+is+often+loosely+described+as+hyper-Calvinism+and+involves+a+radical+form+of+supralapsarianism.+Such+a+view+of+predestination+has+been+virtually+universally+and+monolithically+rejected+by+Reformed+thinkers.%E2%80%9D%0A%0A%E2%80%94+R.+C.+Sproul%2C+Chosen+But+Free%2C+Chapter+on+Double+Predestination&amp;url=https%3A%2F%2F5solasquo </figure><figure class="quote" id="q-30a6aaea5e" data-kw="">
<blockquote><p>That is what my Antinomians, too, are doing today. They are preaching finely and (I can think nothing else) with real seriousness about Christ’s grace, the forgiveness of sins, and the other things that can be said concerning redemption. But they flee the consequence of this, as though it were the very devil, and will not speak to the people about the Third Article, think that they ought not to terrify people, or disturb them, but always to preach in a comforting way about grace and the forgiveness of sins in Christ, and utterly avoid such words as these: “Listen! You want to be a Christian and yet remain an adulterer, fornicator, drunken swine, proud, covetous, a usurer, envious, revengeful, malicious!” On the contrary, they say: “Listen! Though you are an adulterer, a fornicator, a miser, or any other kind of sinner, only believe, and you will be saved and need not fear the law; Christ has fulfilled it all!” Tell me, is that not granting the premise and denying the conclusion? Nay, it is taking away Christ and bringing Him to nought, at the same time that He is most highly preached. It is saying Yes and No to the same thing. There is no such Christ, Who has died for these sinners who, after forgiveness of sins, do not leave their sins and lead a new life. Thus they finely preach the logic of Nestorious and Eutyches, that Christ is this and is yet not this. They are fine Easter preachers, but shamefully poor Pentecost preachers, for they preach nothing de sanctificatione et vivificatione Spiritus Sancti, i.e., concerning sanctification by the Holy Spirit, but preach only about redemption by Christ, though Christ, Whom they extol so highly (and rightly so!) is Christ, i.e., He has purchased redemption from sin and death, in order that the Holy Spirit shall make new men of us, in place of the old Adam, so that we die unto sin and live unto righteousness, as St. Paul teaches in Romans 6:1, beginning and increasing this life here on earth, and completing it yonder. What Christ has earned for us is not only gratia, “grace,” but also donum, the “gift” of the Holy Ghost, so that we might not only have forgiveness of sin, but also cease from sinning. Whoever, then, does not cease from sinning, but continues in his former wicked life, must have another Christ from the Antinomians, for the real Christ is not there, even though all the angels were to cry only “Christ! Christ!”; and he must be damned with his new Christ.</p></blockquote>

<blockquote><p>A usus didacticus or normativus. This is the so-called tertius uses legis, the third use of the law. The law is a rule of life for believers, reminding them of their their duties and leading them in the way of life and salvation. This third use of the law is denied by the Antinomians.</p></blockquote>

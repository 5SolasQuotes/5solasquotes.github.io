<main class="wrap"><figure class="quote" id="q-5103928f02" data-kw="">
<blockquote><p>…and first of repentance the continual and inseparable companion of faith. For albeit it be daily made more perfect after justification, yet because no man is justified without repentance, and the beginning thereof goes before justification, therefore we have purposed in this first place to declare what our belief is concerning the same. I. To Justification, and therefore to the communion with Christ, repentance is necessary. We believe that to the true participation of Christ’s righteousness, and so to the communion with Christ, repentance is very needful: whereby being turned from sin and from the world, by changing our minds and wills, we are turned to God and are joined unto Him, and so obtain forgiveness of our sins in Him and by Him, and be clothed with his righteousness and holiness. For the first thing that John Baptist, yea that Christ Himself preached, was repentance for the remission of sins. (Mk. 1:4, 15) ‘And, except’ (says Christ) ‘ye repent, ye shall all likewise perish.’ (Lk. 13:3, 5) … V. A sum of the doctrine of repentance, everywhere and always necessary to all of years of discretion. …repentance is a changing of the mind and heart, stirred up in us through the Holy Ghost, by the Word both of the Law and the gospel: wherein we grieve from our heart: we detest: we lament: we lothe and bewail: confess before God all our sins, and even the corruption of our nature, as things utterly repugnant (as the law teaches) to the will of God, and to the cleansing whereof, the death of God’s own Son (as the gospel preaches) was needful: and do humbly pray and entreat for pardon and forgiveness of the same: and do earnestly resolve upon amendment of our life, and on a continual study and care of innocency and Christian virtues, and exercise ourselves in the same diligently all the days of our life: to the glory of God and edification of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of the Christian Religion</cite>, … (1586; Cambridge, 1599), ch. 18. ’Of Repentance’, pp. 142-45</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bcca9dd70b" data-kw="">
<blockquote><p>24… It is right that he who, in adult age, is admitted to the fellowship of a covenant by one from whom he had hitherto been alienated, should previously learn its conditions; but it is not so with the infant born to him. He, according to the terms of the promise, is included in the promise by hereditary right from his mother’s womb. Or, to state the matter more briefly and more clearly. If the children of believers, without the help of understanding, are partakers of the covenant, there is no reason why they should be denied the sign, because they are unable to swear to its stipulations… But the child descended from unbelieving parents is deemed an alien to the covenant until he is united to God by faith. Hence, it is not strange that the sign is withheld when the thing signified would be vain and fallacious. In that view, Paul says that the gentiles, so long as they were plunged in idolatry, were strangers to the covenant (Eph. 2:11). The whole matter may, if I mistake not, be thus briefly and clearly expounded: Those who, in adult age, embrace the faith of Christ, having hitherto been aliens from the covenant, are not to receive the sign of baptism without previous faith and repentance. These alone can give them access to the fellowship of the covenant, whereas children, deriving their origin from Christians, as they are immediately on their birth received by God as heirs of the covenant, are also to be admitted to baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 3, bk. 4; ch. 16, pp. 373-74</span></figcaption>

</figure><figure class="quote" id="q-0c51fe25c0" data-kw="">
<blockquote><p>Objection [of Papists]: But the minister may mistake the matter [in assuring a person of salvation]. Answer: True, if he speak absolutely, but if he speak upon condition of faith and true repentance he may thereupon assure a man of salvation: he may say, ‘Believe thou and repent truly, and thou shalt be saved.’ If a king should publish and make known that whosoever of such a city shall come and do such a thing, shall be thus or thus rewarded, and give charge to some to make it known to that city, shall we say that any having authority to publish the king’s pleasure, does mistake the matter in so doing, or that any of that place, to whom it should be said, go thou and do that which the king has appointed, and he thereupon going, and doing the thing appointed, does presume to take on him to know more than he ought touching the king’s pleasure? Surely no.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-elton.html">Edward Elton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, (London: Griffin, 1615), on Col. 2:18, p. 704</span></figcaption>

</figure><figure class="quote" id="q-abfce73be5" data-kw="">
<blockquote><p>True it is, that without faith and repentance, there is no salvation; and a man dying impenitent, is damned. But, we must know that as faith and repentance are conditions, which God has ordained, and so requires on our part, though Himself give them, and work them in us; so they are a part of those means which God has appointed to attain the end of our salvation. And the meanes are such, so fixed and established of God, as they shall always attend upon his purpose and pleasure in our election to grace and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-burton.html">Henry Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plea to an Appeal traversed Dialogue-wise</cite>, (London: W. Jones, 1626), p. 36</span></figcaption>

<blockquote><p>By these and other Scripture-sentences, everyone easily sees that there are two conditions given man that he may escape the judgment of God’s justice and obtain the promise of mercy. One is the blessed seed, Christ, and his death and sacrifice. The other is faith in Christ and repentance. There is great difference between these conditions: one is simple, not conditionate, and (as they say) simply given, without respect to another dignity (or worthiness); but the other is conditionate, and given secundum quid [in a certain way], that is, receiving all its authority and certainty from the former: to wit, repentance and faith in Christ. The first condition depends on no other, but is of itself, and from itself, authentical, and gives from itself to the other all its force, virtue, and dignity. Hence the first is more principal and the chief; but the other is less principal and viler. This greater or less principality consists in this, that the first is the cause-efficient of expiation and security from God’s justice, and of obtaining mercy. And the latter is an instrumental cause, or organ of acceptance, applying reconciliation and mercy obtained. That respects justice; this mercy. By that satisfaction is given to the just Judge, without the hurt or diminution of his justice, as Himself proclaims from heaven, Mt. 3:17 and 17:5, “in whom I am well pleased,” or “in whom I am appeased,” or rest satisfied. But by that other, to wit, faith and repentance, man satisfies himself in his own conscience, that he may consist without any offence from the justice of God. As therefore it is a heinous error of them who confound these conditions in the business of justification, so peculiarly does Socinus err and break forth into blasphemy, while, turning his eye to this condition—to wit, faith and repentance, which is the less principal—and resting on this alone, he affirms it to be the efficient and meritorious cause of obtaining mercy. But the other more principal, without which this would be as a body without a soul, or a shell without a kernel, he blindly passes over and neglects, as if he saw it not. For if only bare faith in Christ and repentance would suffice to obtain God’s mercy, of what use, I pray you, was that former condition premised to this? to wit, the promise and exhibition of the Holy One, and of his death and sacrifice, and the express injunction that men’s eyes and faith be directed to this holy seed. Socinus therefore does violence to God, disjoining what He has conjoined; and that which God would have put first, he does not so much as let it follow after, but endeavours wholly to remove and blot it out of the memory of men.” – pp. 53-54, trans. Baxter, Baxter’s Confession (1655), ch. 10, sect. 3, pp. 388-90 Lubbertus, Sibrandus – De Iesu Christo servatore, hoc est, cur et qua ratione Jesus Christus noster servator sit, libri quatuor. Contra Faustum Socinum (Franeker, 1611) 650 pp. This was the first-scale reply to Socinus’s De Servatore. Hoornbeek, Johannes – Socinianism Confuted, vol. 1, 2 (Amsterdam, 1650/62) ToC 1, 2 Hoornbeek goes through the whole system of Socinianism; hence this work is virtually a polemical systematic theology. Table of Contents vol. 1 Bk. 1 1. Whether in sacred Scripture there is truly any disagreement and contradiction 1 2. Whether the authentic text of sacred Scripture in many places has been changed and corrupted 28 3. Whether some of the sacred books of the O.T. have perished 48 4. Whether under the New Testament, the reading of the O.T. is not necessary and of great moment 56 … Bk. 2 10. Whether the eternity of God has temporal parts and succession, through what is before and that which follows 262 11. Whether God, his presence, is omnipresent 285 12. Whether God has all knowledge [scientiam], even of future contingencies 319 13. Whether attributes, or properties in God are accidents or qualities really different from God and really different between themselves 367 14. Whether

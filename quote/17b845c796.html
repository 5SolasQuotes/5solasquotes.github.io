<main class="wrap"><figure class="quote" id="q-17b845c796" data-kw="">
<blockquote><p>Bucer’s thought categorized Christian theological truths (of the disputed doctrines of the day) into a hierarchy, the doctrine of justification being of high importance for the Church. As such, difficulties over other doctrines like the Lord’s Supper could be pragmatically defined and resolved so as to preserve the unity that was held in the truth of justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-lugioyo.html">Brian Lugioyo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Martin Bucer’s Doctrine of Justification: Reformation Theology &amp; Early Modern Irenicism</cite>, (Oxford Univ. Press, 2010) 260 pp. ToC, p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“Bucer’s thought categorized Christian theological truths (of the disputed doctrines of the day) into a hierarchy, the doctrine of justification being of high importance for the Church. As such, difficulties over other doctrines like the Lord’s Supper could be pragmatically defined and resolved so as to preserve the unity that was held in the truth of justification.”

</figure><figure class="quote" id="q-cf3a92e9a9" data-kw="">
<blockquote><p>Much has been made by historians of the Scots ‘forcing’ their austere brand of religion upon their English brethren. However, it is clear that Scottish commissioners were aware their role was limited to advising only and that the construction of the Church rested with English members of the Assembly. Indeed, the Westminster Assembly did invite the Scottish commissioners to become full members of the Assembly, an invitation which the Scots declined, thereby recognising and respecting England’s right to define its own church government… The Scots fully encouraged the English to set up a Classical Presbytery based on English tradition and encouraged compromise [or rather a principled accommodation to the Independents]. In response to [the Independent] Philip Nye’s sharp accusation that the Scots had ‘given’ the Assembly a whole system of church government, the Scottish members responded that ‘we were well content the Assembly should take their own order, and not tie themselves to ours.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kirsteen-m-mackenzie.html">Kirsteen M. MacKenzie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Solemn League &amp; Covenant of the Three Kingdoms &amp; the Cromwellian Union</cite>, 1643-1663 (Routledge, 2018), ch. 1, pp. 37-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

%20tie%20themselves%20to%20ours" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1cc4cca8bd" data-kw="">
<blockquote><p>That as union is ever a duty, so we conceive if men interessed will do their duty, there can be no division amongst orthodox divines or ministers but it is possible also to compose it, and union is a thing attainable. For: 1. We are not speaking of composing divisions that are stated upon the fundamental things; [2.] nor are we speaking of removing all differences, as if all men were to be one in judgment in every point of truth; there may be difference where there is no division, as has been said. Nor, 3. when we speak of men’s doing their duty, do we mean a full up-coming of everything in knowledge and practice…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, … (Edinburgh: Higgins, 1659), pt. 4, ch. 7, ‘General Grounds leading to Unity’, pp. 316–18</span></figcaption>

</figure><figure class="quote" id="q-709e1f272f" data-kw="">
<blockquote><p>1. Consider many things are darkly laid down in the Scriptures, and the scope of God and Christ therein, is not to cause contention, difference, and censuring: but to unite us more strongly in those things are clear, and to cause a forbearance of one another in things are dark and doubtful: Phil. 3:15-16: ‘If in anything you be otherwise minded, God shall reveal even this unto you: Nevertheless whereto we have already attained, let us walke by the same rule, and let us minde the same thing.’ Says Paul: ‘I confide not in my own works or righteousness, but look at Christ alone; I labour to win Christ, and be found in Him; I press after Him and none but Him, and mind nothing else as a means of salvation; if any be otherwise minded through ignorance, or weakness of Faith (as many were, who affected Mosaical rites and ceremonies) God shall reveal even this unto you; he will make known the truth unto you; nevertheless, though there be differences, let us forbear one another therein, and whereto we have attained, let us walk harmoniously and peaceably together, minding the same things.’ What is clear held out unto us in the Gospel, let us consent in, and walk answerably; in what is dark, doubtful, let us forbear each other, and stay till God reveal more. If we cannot unite in all, let us unite in what is clear. Things fundamental, and absolutely necessary, are clearliest laid down in the Word; they are expressly commanded, or held forth in Scripture, whether they be matters of Faith or practice, they are not things drawn out by remote consequences, and strength of men’s parts, but immediatly from, or in, the Word, and in these most may, or do agree, not being many in number; so far as we have attained in these, let us walk; and as King James says, in other things, place may be given to Christian liberty; and let us take heed how we charge men to hold fundamental errors, when fundamentals are few, Rom. 10:9; 1 Jn. 4:2, and men’s errors are extra-fundamentals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-greenhill.html">William Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition continued upon the Sixth, Seventh, Eighth, Ninth, Tenth, Eleventh, Twelfth &amp; Thirteenth Chapters of the prophet Ezekiel</cite>, (London: 1649), on 11:19, ‘Helps to Unite our Hearts, or Uniting Directions,’, pp. 411-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

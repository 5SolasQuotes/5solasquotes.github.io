</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-67c096ad66" data-kw="">
<blockquote><p>In point of fact, the Old Testament has a great deal to teach on the benevolent side of God’s self-revelation to the world at large. The strongest of terms are used on occasion to emphasize this truth. Even the covenant conception is not deemed too sacred to be employed for the purpose of describing the solemn manner in which God pledged to the whole of creation, in the day of Noah, His abundant, ever-flowing kindness in the sphere of natural life, His longsuffering in the view of universal sin, His common grace working for the restraint of sin. It is attributed to His righteousness, universally revealed, that He keeps this covenant and preserves man and beast. As Jonah took pity on his gourd, so He pities and spares the Ninevites and their cattle. His mercy is wider and deeper than the ocean of human misery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Doctrine of the Love of God in The Presbyterian &amp; Reformed Review 13:1-37</cite>, (1902), p. 11</span></figcaption>

</figure><figure class="quote" id="q-2ddd2ba5cf" data-kw="">
<blockquote><p>When the goodness of God is exercised towards His rational creatures, it assumes the higher character of love, and this love may again be distinguished according to the objects on which it terminates. In distinction from the goodness of God in general, it may be defined as that perfection of God by which He is eternally moved to self–communication. Since God is absolutely good in Himself, His love cannot find complete satisfaction in any object that falls short of absolute perfection. He loves His rational creatures for His own sake, or, to express it otherwise, He loves in them Himself, His virtues, His work, and His gifts. He does not even withdraw His love completely from the sinner in his present sinful state, though the latter’s sin is an abomination to Him, since He recognizes even in the sinner His image-bearer. John 3:16; Matt. 5:44,45. At the same time He loves believers with a special love, since He contemplates them as His spiritual children in Christ. It is to them that He communicates Himself in the fullest and richest sense, with all the fulness of His grace and mercy. John 16:27; Rom. 5:8; I John 3:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology, Part I</cite>, ch. 7, On the Communicable Attributes of God, C. Moral Attributes, 1. The Goodness of God, b. The Love of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

e%20goodness%20of%20God%20is%20exercised%20towards&amp;text=mercy.%20John%2016%3A27%3B%20Rom.%205%3A8%3B%20I%20John%203%3A1" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. A change from the offers of Grace, to the Revelations of Wrath: Shall thy loving kindness be declared in the grave, or thy faithfulness in destruction (says the Psalmist) in Psalm 88:11. True in the 1 Pet. 3:19-20, we read of Christ’s preaching by his Spirit to the Spirits in Prison, that is, to souls in Hell: But mark, when was it that he preach’d to them? not when in prison, but in the days of Noah, when they lived in the world. There is never an offer of grace and love made to souls in the Grave; while life lasts, the soul hears the joyful sound: And O the sweet offers, the gracious tenders, the loving invitations, that are made to him of Christ, of Grace, of Eternal Life and Love! O the wooings, the meltings, the entreatings, the allurings of Divine Love to and over the soul! but when death comes, farewell all these, farewell all the sweet offers of Christ, and all the blessed motions of the Spirit; then there’s nothing but wrath revealed, and wrath shall come on the neglecting soul to the uttermost. 5. A Change from fair probabilities to utter Impossibilities of Life and Salvation; a sad change still: Now is the accepted time, now is the day of Salvation; now, and not hereafter, 2 Cor. 6:2. Now there is a fair probability of the worst of Sinners to be saved, if they will look after Salvation, and mind their eternal Concerns; Christ is both able and willing to save: To save was the end of his coming into the World, and of all he did and suffered here, 1 Tim. 1:15. Now they are besought and entreated to be reconciled to God, 2 Cor. 5:19,20, but when Death comes, that changes these fair probabilities into utter Impossibilities of Life and Salvation. Therefore mark: Now (says the Apostle) is the day of Salvation; that is, now whilst Life lasts, and while the Gospel is preached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-pearse.html">Edward Pearse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1674(?) | The Great Concern, or A Serious Warning to a Timely and Thorough Preparation for Death (London: Printed for J. Robinson, at the Golden Lyon in St. Paul’s Church-Yard; and B. Aylmer at the three Pigeons in Cornhill, 1674), 73–75. The two quotes below were compiled by Tony Byrne</span></figcaption>

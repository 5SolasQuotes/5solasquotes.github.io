<blockquote><p>The twelfth subject of Meditation. Meditate of hell. 1. Meditate upon the pain of loss, Mat. 25.10. and the door was shut. To have Christ’s face veiled over, and a perpetual eclipse, and mid-night in the soul, to be cast out of God’s presence, in whose presence is fullness of joy, this doth accent and embitter the condition of the damned; ’tis like mingling gall with wormwood.

2. Meditate upon the pain of sense; the Photinians hold there is no hell, but they speak in a dream, Psalm 9.17. The wicked shall be turned into hell. And here meditate of two things.

1. The place of hell.

2. The company.

1. Meditate of the place of hell. ‘Tis called a place of torment, Luke 16.28. There are two things especially in hell to torment.

2. Fire, Revel. 20.15. ‘Tis called a lake of burning fire, Austin, Peter Lombard, Gregory the Great, say, this fire of hell is a material fire, though they say it is infinitely hotter than any culinary fire; that is but painted fire to this. I wish none of us may know what kind of fire it is, but I rather think, the fire of hell is partly material, and partly spiritual; the material fire is to work upon the body, the spiritual to torture the soul. This is the wrath of God, which is both fire and bellows, who knows the power of thy anger, Psalm 90.11.

But it may be objected, if there be any material fire in hell, it will consume the bodies there? I answer, it shall burn without consuming, as Moses bush did, Ex. 3.2. The power of God silenceth all disputes. If God by his infinite power could make the fire of the three children not to consume, cannot he make the fire of hell burn and not consume? Austin in his book, de civitate Dei, tells us of a strange salt in Sicily, which if it be put in the fire swims; That God which can make salt, contrary to its nature, swim in the fire, can make the bodies of the damned not consume in the fire.

2. The worm, Mark 9.44. Where the worm never dies, Homer in his Odisses fains, that Titius his liver was gnawn by two vultures in hell. This never-dying worm Christ speaks of, is the gnawing of a guilty conscience. Melanchthon calls it Erynnis conscientiae; an hellish fury, Siculi non invenere tyranni tormentum majus,—they that will not hear conscience preaching, shall feel conscience gnawing; and so great is the extremity of these two, the fire which burns, and the worm which bites, that there will follow gnashing of teeth, Mat 8.12. the damned will gnash their teeth for horror and anguish. That must needs be sad cheer (as Latimer saith) where weeping is served in for the first course, and gnashing of teeth for the second: to endure this will be intolerable, to avoid it will be impossible.

3. Meditate of the company in hell, the devil and his Angels, Matth. 25.41. Job complains he was a companion to owls, chap. 30.29. What will it be to be a companion to devils? Consider, 1. Their ghastly deformity, they make hell look blacker. 2. Their deadly antipathy; they are fired with rage against man-kind; first they become tempters, then tormentors.

Meditate much on hell. Let us go into hell by contemplation, that we may not go into hell by condemnation. How restless is the condition of the damned; The ancients fain of Endymion, that he got leave of Jupiter always to sleep. What would the damned in hell give for such a Licence? in their pains is neither intermission, nor mitigation.

The serious meditation of hell, would make us, 1. Fear sin as hell. Sin is hell’s fuel; sin like Sampson’s foxes, carries devouring fire in the tail of it.

2. The meditation of hell would cause rejoicing in a child of God. The Saints fear of hell is like the two Marie’s fear, Matth. 28.8. They departed from the Sepulchre with fear and great joy. A believer may fear to think of the place of torment, but rejoice to think he shall not come into this place. When a man stands upon a high rock, he trembles to look down into the sea, yet he rejoiceth that he is not there struggling with the waves. A child of God, when he thinks of hell, he rejoiceth with trembling. A Prison is not made for the King’s sons to be put in.

A great Naturalist observes that nothing will so soon quench fire as salt and blood; sure I am, the salt brinish tears of repentance, and the blood of Christ will quench the fire of hell to a believer. Christ himself hath felt the pains of hell for you. The Lamb of God being roasted in the fire of God’s wrath, by this burnt-offering the Lord is now appeased towards his people. Oh how may the godly rejoice. There’s no condemnation to them that are in Christ, Rom. 8.1. When the Son of God was in the furnace, Dan. 3.25. the fire did the three children no hurt; so Christ being for a time in the fiery furnace of God’s wrath, that fire can do a believer no hurt. The Saints have the garment of Christ’s righteousness upon them, and the fire of hell can never singe this garment.</p></blockquote>

<blockquote><p>XL. Are good works therefore unnecessary for our justification? To become righteous from being guilty and liable to punishment—that is, to receive the abundance of grace and the gift of righteousness—they are not necessary as antecedents. But they are absolutely necessary as consequences. They are the fruits and ends of justification, from which justification ought not and cannot be separated. For in the New Covenant, God has first promised us the forgiveness of sins, and then sanctification. Christ has been made for us not only righteousness, but also sanctification. Faith embraces both promises, and draws both benefits from the fullness of Christ, into whom it inserts us. Thus, a faith that does not produce good works as its fruits reveals itself not to be true faith at all, but a rotten corpse of faith, which mimics the outward appearance of faith but has no power, movement, or activity. Therefore, in order that we may be declared righteous, and that it may be shown (whether in the court of our conscience or in the final judgment) that God has truly granted us forgiveness of sins, good works are necessary as posterior evidences, as they say. For faith is known by its works, just as a tree is known by its fruits. References: Heb. 10:16; 2 Cor. 1:30; Jm. 1:11.</p></blockquote>

<blockquote><p>How much of spiritual meaning and significance is revealed to the eye of faith, in that great truth “He inhabiteth eternity.” From eternity did God exist, and infinitely happy in his own glory. His being is underived, and never had a beginning; before angel and arch-angel were called into being to celebrate his praises, did our God exist in his own uncreated glory. The blessed spirits of heaven, who, as they receive their existence from the “high and lofty One,” derive also their happiness from the infinite happiness which resides in his perfections, and delight to magnify his glory, and to do his will. Their fervid praises ascend to him, who has given them all their powers of serving him, and their capacities of enjoying him. In the immediate dwelling place of God are the souls of the redeemed, who “have passed beyond tribulation, and who, clothed with white robes and palms in their hands,” cry with a loud voice, saying, “Salvation to our God which sitteth upon the throne, and unto the Lamb.”

Infinite happiness is in the immediate dwelling-place of him who inhabits eternity; unutterable glory is also around the God of our salvation. The Word of God elevates our faith, and calls upon us to entertain devout and adoring views of the glory of him, who is holy in his nature, and holy and righteous in all his ways. Yet, though thus glorious and exalted, though infinite in his own happiness, though inconceivably pure and holy in his essence, though requiring no services of any created beings that rejoices in the excellence of his will, to add to his internal and infinite happiness and complacency, yet, amazing truth of God’s own grace and condescension, he delights to come forth from the glory which he inhabits in eternity, and to dwell with them, who in the depths of humility and self-abasement, feel their own guilt and unworthiness in his holy and omniscient view, and in faith and love acknowledge him as their God in Christ.

What a precious revelation does the Prophet give of the grace of God! What a consolatory representation of his unsearchable condescension! While God dwells in the heavens, and praises of eternity — while he dwells in the “high and holy place” — a heavenly temple—the grandeur, the purity, the glory of which befit the blessed perfections of his nature — yet he dwells also with him who is of a contrite and humble spirit — God dwells with such for a blessed and gracious purpose — “to revive the spirit of the humble, and to revive the heart of the contrite ones.” In his wisdom and grace, he has devised a glorious plan of salvation, through which he can hold communion with those in whom these spiritual qualities reside.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mungo-fairlie-parker.html">Mungo Fairlie Parker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God s Dwelling with the Humble and Contrite, the Source of their Revival’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

nd+infinite+happiness+and+complacency%2C+yet%2C+amazing+truth+of+God%E2%80%99s+own+grace+and+condescension%2C+he+delights+to+come+forth+from+the+glory+which+he+inhabits+in+eternity%2C+and+to+dwell+with+them%2C+who+in+the+depths+of+humility+and+self-abasement%2C+feel+their+own+guilt+and+unworthiness+in+his+holy+and+omniscient+view%2C+and+in+faith+and+love+acknowledge+him+as+their+God+in+Christ.%0A%0AWhat+a+precious+revelation+does+the+Prophet+give+of+the+grace+of+God%21+What+a+consolatory+representation+of+his+unsearchable+condescension%21+While+God+dwells+in+the+heavens%2C+and+praises+of+eternity+%E2%80%94+while+he+dwells+in+the+%E2%80%9Chigh+and+holy+place%E2%80%9D+%E2%80%94+a+heavenly+temple%E2%80%94the+grandeur%2C+the+purity%2C+the+glory+of+which+befit+the+blessed+perfections+of+his+nature+%E2%80%94+yet+he+dwells+also+with+him+who+is+of+a+contrite+and+humble+spirit+%E2%80%94+God+dwells+with+such+for+a+blessed+and+gracious+purpose+%E2%80%94+%E2%80%9Cto+revive+the+spirit+of+the+humble%2C+and+to+revive+the+heart+of+the+contrite+ones.%E2%80%9D+In+his+wisdom+and+grace%2C+he+has+devised+a+glorious+plan+of+salvation%2C+through+which+he+can+hold+communion+with+those+in+whom+these+spiritual+qualities+reside.%E2%80%9D%0A%0A%E2%80%94+Mungo+Fairlie+Parker%2C+God+s+Dwelling+with+the+Humble+and+Contrite%2C+the+Source+of+their+Revival%E2%80%99+in+The+Free+Church+Pulpit%3B+Consisting+of+Discourses+by+the+Most+Eminent+divines+of+the+Free+Church+of+Scotland.+Vol.+I.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc9829607ae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c9829607ae.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/02/01/mungo-fairlie-parker-on-the-gracious-condescension-of-the-infinitely-exalted-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-4b93237d7c" data-kw="">
<blockquote><p>[We reject the errors of those] Who teach: That Christ by His satisfaction merited neither salvation itself for any one, nor faith, whereby this satisfaction of Christ unto salvation is effectually appropriated; but that He merited for the Father only the authority or the perfect will to deal again with man, and to prescribe new conditions as He might desire, obedience to which, however, depended on the free will of man, so that it therefore might have come to pass that either none or all should fulfill these conditions. For these adjudge too contemptuously the death of Christ, in no way acknowledge that most important fruit or benefit thereby gained, and bring again out of hell the Pelagian error. Paragraph 4 [We reject the errors of those] Who teach: That the new covenant of grace, which God the Father, through the mediation of the death of Christ, made with man, does not herein consist that we by faith, in as much as it accepts the merits of Christ, are justified before God and saved, but in the fact that God, having revoked the demand of perfect obedience of faith, regards faith itself and the obedience of faith, although imperfect, as the perfect obedience of the law, and does esteem it worthy of the reward of eternal life through grace. For these contradict the Scriptures, “being justified freely by His grace through the redemption that is in Christ Jesus, whom God set forth as a propitiation by His blood, through faith” (Rom 3:24-25). And these proclaim, as did the wicked Socinius, a new and strange justification of man before God, against the consensus of the whole church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons</cite>, 2nd Head of Doctrine, Rejection of Errors, 9 May, 1619.</span></figcaption>

</figure><figure class="quote" id="q-56978ca130" data-kw="">
<blockquote><p>Obedience is Heaven begun, and the sons of God rejoice to see him take his honour, and call all worlds around him to esteem and love him, as most worthy. They are not under the law in whole or part, so far as it has sanctions, threats, or promises. But let us hear in mind — for there may he ere long another Antinomian outbreak — that in the measure in which we win Christ, it will be our meat to do the Father’s will as it was his beforehand. Our willingness to obey just shows how far we have tasted the sweetness of the promises, how far we have apprehended Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord s Jealousy Against Backsliders Consistent with His Unchanging Love’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-810bf8d936" data-kw="">
<blockquote><p>But we read not” (says Erastus) “where Christ has changed those laws in the New Testament.” It is true, Christ has not said in particular: “I abolish the debarring of the leper seven days, and he that is thus and thus unclean shall be separated till the evening;” nor has He said particularly of every carnal ordinance and judicial law: “it is abolished.” But we conceive the whole bulk of the Judicial Law, as judicial, and as it concerned the republic of the Jews only, is abolished, though the moral equity of all those be not abolished… … But sure Erastus errs who will have all such to be killed by the magistrate under the New Testament because they were killed by him in the Old: Why, but then the whole judicial law of God shall oblige us Christians as Carolostadius and others teach? I humbly conceive that the putting of some to death in the Old Testament, as it was a punishment to them [the malefactors], so was it a mysterious teaching of us how God hated such and such sins; and mysteries of that kind are gone with other shadows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. Travis Fentiman, ‘Samuel Rutherford on the Judicial Laws of Moses: Excerpts Arranged Topically’, pp. 4-6, 23 | Divine Right of Church Government (1646), pp. 383, 493-94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9cdcbe8cb2" data-kw="">
<blockquote><p>Now all this being unquestionably true of the Jewish Sanhedrin: if we should suppose, that they had no supreme Sanhedrin but that which had the power of civil Magistracy, then I ask where is that Christian State, which was, or is, or ought to be molded according to this pattern. Must ministers have vote in parliament? Must they be civil lawyers? Must all criminal and capital judgments be according to the Judicial Law of Moses, and none otherwise? Must there be no civil punishment, without previous admonition of the offender? Must Parliaments sit, as it were in the Temple of God, and interpret Scripture, which sense is true, and which false, and determine controversies of faith and cases of conscience, and judge of all false doctrines? Yet all this must be if there be a parallel made with the Jewish Sanhedrin. I know some divines hold, that the Judicial Law of Moses, so far as concerns the punishments of sins against the moral Law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, etc. ought to be a rule to the Christian Magistrate. and for my part, I wish more respect were had to it, and that it were more consulted with.</p></blockquote>

</figure><figure class="quote" id="q-752bf8d5c6" data-kw="">
<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called [to the Savoy Conference] by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XI. They spake not against episcopacy, as it is a presidency among and over presbyters differing in degree, and not in office, called ‘order’, and that in a Church of the lowest species. …

XIII. They said nothing against metropolitans, patriarchs, lay-chancellors, commissaries, officials, surrogates, archdeacons, etc. as officers of the king, appointed to do nothing (besides the sacred ministry if they be clergymen) but what belongs to magistracy [according to circa sara].

XIV. They said nothing against any promise of obedience to them only in the capacities and in the exercise of the power forementioned.

XV. Much less did they ever oppose or question swearing to the king, according to the oaths of Allegiance and Supremacy: And I with diverse others also being (for some ends) entered as his chaplains in ordinary, took also that Oath of Fidelity which the king’s household servants take. XVI. We never were for any dishonoring of kings by public excommunications, much less by subjects or foreigners, whom kings never choose to be their pastors; but only in case of necessity, for such a denial of sacramental communion to them, as Bishop Andrewes in Tortura Torti and Bishop Bilson [The True Difference between Christian Subjection &amp; Unchristian Rebellion, pt. 3, pp. 376-77] plead for, which is but to forbear ourselves a sinful act. XVII. We never pleaded for any elders’ (or chancellors’) power of the keys, who are but laymen. XVIII. We never held that magistrates are bound to add their force by the sword to the censures of the Church as such, and to punish men more because the Church has by excommunication cast them out, or because they are not reconciled. XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689) The preface is dated 1683., ch. 3, pp. 11-13</span></figcaption>

<blockquote><p>[1. The Rule of Reformation.] The rule of building the house of God, and of the reformation of religion is the same and perpetual: the commandment of God, and not the commandment of man one or more, whether they be civil or ecclesiastical persons. It is their part to provide according to their places and callings, to command and direct that the Commandment of God be obeyed. This King commands not that his will be done, but what God has commanded. Neither King nor Parliament can command otherwise. Civil powers have great authority, not only in things civil, but in matters of Religion; and they sin against God, if they use not the authority which God hath put in their hands, for the good of Religion. To them belongs inspection and watching over, not only ecclesiasticos [ecclesiastical persons], but ecclesiastica [that which is ecclesiastical]. Ecclesiastical persons are subject to civil authority no less than others; and in respect of things-ecclesiastical, or matters of religion, Eusebius brings in Constantine the great, saying: ‘Vos Episcopi in Ecclesia, ego extra Ecclesiam seu templum Episcopus a Deo constitutus sum‘ [Ye are overseers in the Church; I am constituted of God an overseer outside of the Church Church]: Not that any mortal man whether Pope or Prince, can be properly Head of the Church, or vice-gerent [regent] unto Christ the Mediator in his special and economical Kingdom of Grace: for princes are vice-gerents to God, and to his Son Jesus Christ as He is God, in his universal Kingdom of Providence; and this watching and inspection of princes and magistrates, is objective ecclesiastica [objectively ecclesiastical], but formaliter civilis [formally civil], it is about matters of religion in a civil manner, and in a way suitable to the nature and quality of their place and power. The faithful custody and preservation of religion, is a part of their office: for they are not only keepers of the Second, but of the First Table of the Law… Religion also expects from them the civil sanction, that the worship of God, and the wholesome constitutions of the Church about religion, be confirmed and settled by their Laws. Coaction [coercion] also is theirs, for they by their power [in a Christian nation] are to constrain their subjects to the duties of religion, and to coerce and stop them that they do nothing to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sermon Preached To the Honorable House of Commons, at Their late Solemn Fast, Wed., Dec. 27</cite>, 1643’ (London, 1644)</span></figcaption>

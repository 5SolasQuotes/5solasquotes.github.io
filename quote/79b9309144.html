<blockquote><p>[Objection to a limited application of redemption:] (4) That the redemption of Christ is of infinite value. I respond, And hence it certainly could be sufficient for each and every one to be redeemed, if only, from the intention of the Father, the Redeemer had willed to destine and devote it to all; the contrary of which He Himself declares (John 17:9).</p></blockquote>

</figure><figure class="quote" id="q-f1145c7e24" data-kw="">
<blockquote><p>Not all those who are called are predestined. For Christ said: ‘Many are called, but few are chosen’ (Mt. 22:14). But they contend that the calling is universal and that God would wish everyone saved. If it is understood as universal calling because it is offered to all and no one is excluded by name, it is true. If it is also called universal because the death of Christ and his redemption is sufficient for the whole world; that also is most true. But if this universality is meant so that He it is in everyone’s hand to receive the promises, I deny it: because to some it is given, to others it is not given. As if we did not see also that for a long time the very preaching of the Gospel was not given to many places, ages, and nations. God would have all to be saved, provided they believe. He gives faith to whom it seems good to Him. For He may justly do with his own what he will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Free Will &amp; Predestination” in Philosophical Works</cite>, trans. Joseph P. McLelland (Kirksville, MO: Sixteenth Century Essays &amp; Studies, 1994), vol 4, p. 332</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

s Online</a></div>
</figure><figure class="quote" id="q-39e34c7d9b" data-kw="">
<blockquote><p>This notion, as if the justification, righteousness, and life spoken of in Rom. v. implied the resurrection of damnation, is not only without ground from Scripture, but contrary to reason. For those are there spoken of as great benefits, by the grace and free gift of God: but this is the contrary, in the highest degree possible; the most consummate calamity. To obviate this, our author supposes the resurrection of all to be a great benefit in itself, though turned into a calamity by the sin and folly of obstinate sinners, who abuse God&#x27;s goodness. But the far greater part of mankind, since Adam, have never had opportunity to abuse this goodness, it having never been made known to them. Men cannot abuse a kindness, which they never had either in possession, promise, offer, or some intimation: but a resurrection is made known only by divine revelation which few comparatively have enjoyed. So that as to such wicked men as die in lands of darkness, if their resurrection comes at all by Christ, it comes from him, and to them, only is a curse, and not a blessing; for it never comes to them at all by any conveyance, grant, promise, or offer, or any thing by which they can claim it, or know any thing of it, till it comes as an infinite calamity, past all remedy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Christian Doctrine of Original Sin Defended</cite>, pt. 2, ch. 4, sec. 1 (on Rom. 5:12–21)</span></figcaption>

</figure><figure class="quote" id="q-ddb35e7337" data-kw="">
<blockquote><p>The second sort of divines (Contra-Remonstrants) [those against the Arminians] distinguish the sufficiency and efficiency of Christ’s death. In respect of the worth and greatness of the price, He died for all men: because it was sufficient for the redemption of every man in the world if they did repent and believe; and God might, without impeachment of justice, have offered salvation to every man in the world had it been his pleasure. In the efficiency, as every man or any man has fruit by the death of Christ, so Christ died for him. But this is not of one kind: some fruit is common to every man; for as Christ is lord of all things in heaven and earth, even the earthly blessings which infidels enjoy may be termed fruits of Christ’s death. Others proper to the members of the visible Church, and common to them, as to be called by the word, enjoy the ordinances of grace, live under the covenant, partake of some graces that come from Christ, which, through their fault, be not saving; and in this sense Christ died for all that be under the covenant. But other fruits of Christ’s death, according to the will of God and intention of Christ as Mediator, be peculiar to the sheep of Christ, his brethren, them that be given unto him of the Father, as faith unfeigned, regeneration, pardon of sin, adoption, etc.; and so they hold Christ died efficiently for his people only, in this sense,–namely, so as to bring them effectually to faith, grace, and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (1645), pp. 205-6, According to Mitchell and Struthers, who compiled the 1800’s edition of the Notes to the Westminster Assembly, Ball’s work “was held in high esteem by the Puritans, and [was] recommended by Reynolds, as well as Calamy and several other members of the Westminster Assembly.”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“The second sort of divines (Contra-Remonstrants) [those against the Arminians] distinguish the sufficiency and efficiency of Christ’s death. In respect of the worth and greatness of the price, He died for all men: because it was sufficient for the redemption of every man in the world if they did repent and believe; and God might, without impeachment of justice, have offered salvation to every man in the world had it been his pleasure. In the efficiency, as every man or any man has fruit by the death of Christ, so Christ died for him. But this is not of one kind: some fruit is common to every man; for as Christ is lord of all things in heaven and earth, even the earthly blessings which infidels enjoy may be termed fruits of Christ’s death. Others proper to the members of the visible Church, and common to them, as to be called by the word, enjoy the ordinances of grace, live under the covenant, partake of some graces that come from Christ, which, through their fault, be not saving; and in this sense Christ died for all that be under the covenant. But other fruits of Christ’s death, according to the will of God and intention of Christ as Mediator, be peculiar to the sheep of Christ, his brethren, them that be given unto him of the Father, as faith unfeigned, regeneration, pardon of sin, adoption, etc.; and so they hold Christ died efficiently for his people only, in this sense,–namely, so as to bring them effectually to faith, grace, and glory.”

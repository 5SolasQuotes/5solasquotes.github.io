<blockquote><p>But besides these most public appearances of Jehovah, there hath been, in splendid succession, a series of particular signal interpositions, which hath diffused, through the different times and societies of the church, his majesty and his praises. With a view to these subordinate displays of Divine glory, David utters a prophecy, which includes a long train of remarkable events, not to be finished till the end of the world, in the following words: Psal. cxlv. 4-7. “One generation shall praise thy works to another, and shall declare thy mighty acts. Men shall speak of the might of thy terrible acts; they shall abundantly utter the memory of thy great goodness, and shall sing of thy righteousness.”

These words inform mankind, that, from time to time, they shall see coming forth to view such events as shall give farther evidence of the divinity of God’s word, of the certainty of its promises and its threatenings, of the eternal counsels and the supreme power of the true God, and of the subjection of all events to his control, his designs, his glory, and the happiness of his people.

Such was that great public change in Britain, which the completion of an hundred benign years has lately brought back, with fresh delight, to our memories and mouths. God himself doth observe, and will bring into judgment, the thoughts, words and conduct of those who profess, or who decline to profess, a grateful recollection of that magnificent period.

That I may promote such sentiments on this subject as shall be honourable to God and profitable to us, let me endeavour to apply the light of God’s word to that event: for as the pieces of burnished metal, placed on the summits of high buildings, however bright in themselves, yet hardly appear till they are kindled into splendour by the beams of the sun; so, till we are specially enlightened by the word and the Spirit of God, our ideas will fall exceedingly short of the dignity of this, and every other Divine work.

I find therefore in the Scripture history, that the record of signal events is frequently accompanied with particular inspired compositions, which celebrate the glory of God displayed in these events. Such compositions were of important use for directing and animating the praises of those persons who witnessed the occasions of them. By means of these compositions, believers, in succeeding ages, not only are excited to remember the great events, but are enabled, in the sympathy of faith, to enter into the feelings of those who were then present. And a third use of these sacred compositions is, that they remain in the church’s treasury, to be applied to new occasions, in some respects similar to the original occasions of their being written.

The words of my text are the conclusion of one of those inspired songs, which breathe wonderful sentiments of gratitude and triumph. We shall then do some justice to the memory of God’s interpositions at the Revolution, when we feel something of that sacred fire which animated the writer of this psalm. It was composed, most probably, on occasion of that stroke, inflicted by an angelic arm, which repelled the blasphemies, and disappointed the bloody designs of Senacherib, the Assyrian monarch. This deliverance is recorded in three different places of the sacred book. Those who duly consider the mischiefs which were prevented by the Revolution, the blessings introduced thereby, together with the surprising concurrence of circumstances giving birth to that event, will not blame my application of this psalm to the present subject, as being over-strained or unnatural.</p></blockquote>

<blockquote><p>…we consider things circumstantial, as time, place, etc. And circumstances are either merely physical, or 2. merely moral, or 3. mixed, partly moral, partly physical. Circumstances merely physical are such adjuncts of divine worship as are common and inseparable concomitants of both civil, natural and religious or sacred actions performed by men, and as they are such, contribute no moral goodness or badness to the action or agent in the performance thereof, such as I take to be the seven individuall proprieties of every man: forma, figura, locus, tempus, strips, patria, nomen. Under form and figure, the first two, I comprehend such a proportion of body, a man of a high stature or low, a man beautiful or not beautiful, to which I crave leave to reduce all external forms of habits, as clothes, the head covered or not covered, the situation of the body, as as they are in themselves, mere physical acts, kneeling, sitting, standing, the eyes cast down to the earth or lifted up, the hands lifted up, or not lifted up, the knocking on the breast, or not knocking, motions of the soul, that are natural… 1. All these are common concomitants of civil, natural and religious actions, for all actions performed by man of what kind soever, as natural, to eat, sleep, or civil, to declaim an oration before the people, or religious, to preach or pray, must be done by some persons, John or Thomas, men of some family, in some time, in some place, for they are not actions eternal, and so must be done in time and place, so the agents must have some habit [garment], some gesture in the doing of all these actions, and they are unseparable adjuncts of all these actions because neither actions natural, civil, nor religious can be performed but by some persons in some habit and gesture, in some time, in some place: and lastly, they are mere circumstantials, and contribute no moral goodness or badness to the actions, as they are but common and inseparable circumstances; for because he preaches in time, or in place simply, the preaching is neither morally good, nor ill, better or worse, because Thomas prays in gown or cloak, in this place, rather than that place… the praying is neither the more or the less acceptable to God because of these common and unseparable adjuncts. … I did say that Christ Jesus has set down in the Word a perfect platform of Church-government in all morals; I say ‘in all morals’ because the Word does not teach us anything of circumstances, physical as physical. Scriptura talia non ponit, sed supponit [Scripture does not appoint such things, but supposes them]: The Scripture says not that the Worship of God must have a time, a place, when, and where it’s to be performed, a person, who is to perform it, a habit, or garments on the person that worships; the Scripture teaches none of these, but supposes that they are and must be, because nature teaches that without time, place, person, habit, gesture, it’s impossible that these or any human actions can be; and therefore Prelatical Formalists do without all sense or reason require that we should prove by Scripture, the lawfulness of time, place, person, habit, gesture in God’s worship; for these are presupposed in all actions, natural, civil, religious, private, public, lawful, unlawful, in acts of arts, sciences, of moral conversing and all…</p></blockquote>

tural%2C+civil%2C+nor+religious+can+be+performed+but+by+some+persons+in+some+habit+and+gesture%2C+in+some+time%2C+in+some+place%3A+and+lastly%2C+they+are+mere+circumstantials%2C+and+contribute+no+moral+goodness+or+badness+to+the+actions%2C+as+they+are+but+common+and+inseparable+circumstances%3B+for+because+he+preaches+in+time%2C+or+in+place+simply%2C+the+preaching+is+neither+morally+good%2C+nor+ill%2C+better+or+worse%2C+because+Thomas+prays+in+gown+or+cloak%2C+in+this+place%2C+rather+than+that+place%E2%80%A6+the+praying+is+neither+the+more+or+the+less+acceptable+to+God+because+of+these+common+and+unseparable+adjuncts.+%E2%80%A6+I+did+say+that+Christ+Jesus+has+set+down+in+the+Word+a+perfect+platform+of+Church-government+in+all+morals%3B+I+say+%E2%80%98in+all+morals%E2%80%99+because+the+Word+does+not+teach+us+anything+of+circumstances%2C+physical+as+physical.+Scriptura+talia+non+ponit%2C+sed+supponit+%5BScripture+does+not+appoint+such+things%2C+but+supposes+them%5D%3A+The+Scripture+says+not+that+the+Worship+of+God+must+have+a+time%2C+a+place%2C+when%2C+and+where+it%E2%80%99s+to+be+performed%2C+a+person%2C+who+is+to+perform+it%2C+a+habit%2C+or+garments+on+the+person+that+worships%3B+the+Scripture+teaches+none+of+these%2C+but+supposes+that+they+are+and+must+be%2C+because+nature+teaches+that+without+time%2C+place%2C+person%2C+habit%2C+gesture%2C+it%E2%80%99s+impossible+that+these+or+any+human+actions+can+be%3B+and+therefore+Prelatical+Formalists+do+without+all+sense+or+reason+require+that+we+should+prove+by+Scripture%2C+the+lawfulness+of+time%2C+place%2C+person%2C+habit%2C+gesture+in+God%E2%80%99s+worship%3B+for+these+are+presupposed+in+all+actions%2C+natural%2C+civil%2C+religious%2C+private%2C+public%2C+lawful%2C+unlawful%2C+in+acts+of+arts%2C+sciences%2C+of+moral+conversing+and+all%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%2C+%E2%80%A6+%281646%29%2C+Introduction%2C+pp.+2-5&amp;url=https%3A%2F%2F5solasquotes.github.io%2F <blockquote><p>Honest recreation: a thing that fitteth us for the service of God, and of every good duty; as Shooting, Music, putting forth of Riddles, and the like: for these the Word of God doth by name speak of. So David, 2. Sam. 1. 18. to teach the children of Judah to handle the Bow, uttered that Lamentation which is there extant of Saul and Jonathan. And himself, by the sweetness of his Music, refreshed the troubled heart of Saul, 1. Sam. 16. 24. Of the other we have an Example in the Riddle put forth by SAMSON, Judges 14. 14. Out of the eater came meat, and out of the strong came sweetness. The contrary whereof is, first, the dulling of our selves by a continual wearying of the mind and body, without intermission.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Sacred Divinity Briefly &amp; Methodically Propounded: More Largely &amp; Clearly Handled and Explained</cite>, (London: William Stansby, [1625]), 1.5, pp 135-36.</span></figcaption>

<blockquote><p>…the pollution and profanation of the Lord’s Supper [in this case]… is extrinsic, not in the sacrament itself, but only in the unworthy receiver. And again, we suppose that the minister has used all lawful likely means to prevent it. And therefore it is without his default.</p></blockquote>

</figure><figure class="quote" id="q-26081e435a" data-kw="">
<blockquote><p>With regard to the form to be observed in receiving the sacraments, it is not without reason that you entertain doubts and scruples, for nothing is better than to abide by that pure simplicity which we hold from the Son of God, whose ordinance ought to be our single rule, to which also the usage of the apostles was perfectly conformable. And indeed the moment we deviate ever so little from it, our admixture of human invention cannot fail to be a corruption. But it seems to us that your condition is different from that of the pastors of the place and the great body of the people. If the pastors did their duty, they would employ all their endeavours to retrench those superfluities which do not tend to edification, or rather which serve to obscure the clearness of the gospel. The [civil] governors on their part would also do well to see to it. It is a vice to be condemned so far as they are concerned, that they keep up these unmeaning mummeries — which are as it were a residue of Popish superstitions, the recollection of which we should strive as much as in us lies to exterminate. But in your capacity of private individuals, not only you may lawfully, but what is more, you should support and suffer such abuses as it is not in your power to correct. We do not hold lighted candles in the celebration of the eucharist, nor figured bread to be such indifferent things that we would willingly consent to their introduction, or approve of them, though we object not to accommodate ourselves to the use of them, where they have been already established, when we have no authority to oppose them. If we were called upon to receive such ceremonies, we should hold ourselves bound according to the position in which God has placed us, to admit of no compromise in resisting their introduction, and in maintaining constantly the purity which the church confided to us already possesses. But should our lot be cast in some place where a different form prevails, there is not one of us who from spite against a candle or a chasuble [a ministerial vestment] would consent to separate himself from the body of the church, and so deprive himself of the use of the sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters</cite>, vol 3 (Philadelphia: Presbyterian Board of Publication), Letter 346, ‘To the Brethren of Wezel’, pp. 30-31. Calvin is speaking to reformed refugees attending Lutheran churches. See the whole letter in general.</span></figcaption>

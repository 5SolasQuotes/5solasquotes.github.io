<main class="wrap"><figure class="quote" id="q-5b3d3aaa91" data-kw="">
<blockquote><p>Now that is the will of God which Christ both did and taught. Humility in conversation; steadfastness in faith; modesty in words; justice in deeds; mercifulness in works; discipline in morals; to be unable to do a wrong, and to be able to bear a wrong when done; to keep peace with the brethren; to love God with all one’s heart; to love Him in that He is a Father; to fear Him in that He is God; to prefer nothing whatever to Christ, because He did not prefer anything to us; to adhere inseparably to His love; to stand by His cross bravely and faithfully; when there is any contest on behalf of His name and honour, to exhibit in discourse that constancy wherewith we make confession; in torture, that confidence wherewith we do battle; in death, that patience whereby we are crowned;—this is to desire to be fellow-heirs with Christ; this is to do the commandment of God; this is to fulfil the will of the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cyprian-of-carthage.html">Cyprian of Carthage</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on the Lord’s Prayer</cite>, (c. 252), 15 in Ante-Nicene Fathers, 5: 451.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-64484590ae" data-kw="">
<blockquote><p>Man&#x27;s meritorious work may be considered in two ways: first, as it proceeds from free-will; secondly, as it proceeds from the grace of the Holy Ghost. If it is considered as regards the substance of the work, and inasmuch as it springs from the free-will, there can be no condignity because of the very great inequality. But there is congruity, on account of an equality of proportion: for it would seem congruous that, if a man does what he can, God should reward him according to the excellence of his power. If, however, we speak of a meritorious work, inasmuch as it proceeds from the grace of the Holy Ghost moving us to life everlasting, it is meritorious of life everlasting condignly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, I-II, q. 114, a. 3</span></figcaption>

</figure><figure class="quote" id="q-8d2d2850a6" data-kw="">
<blockquote><p>Neither does faith justify as the beginning of justification only: first, because there are no degrees of justification before God; for in the first act it is perfect: and to that act continued throughout this life, faith, as I showed before out of diverse of the Fathers, suffices. I say, suffices to justification: and therefore is not the beginning only, but also the continuance and consummation thereof: for as in the first act it justifies, so also in the continuance of justification: for by it we stand, and by it we live, and so long as we have faith, it is imputed unto us for righteousness even from faith to faith, as it was to Abraham, after he had long continued in the faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification</cite>, (London: 1633), ch. 10, ‘Bellarmine’s Arguments…’, p. 391</span></figcaption>

</figure><figure class="quote" id="q-07466e7fed" data-kw="">
<blockquote><p>Faith in Christ crucified is not commanded in the Law. For the apostle in Rom. 4:4–5 and 10:5–6, 11 sets faith in opposition to the Law; and in Gal. 3:12 he says that ‘The Law is not of faith,’ because the Law promises life to those who do the things contained in it. Therefore, faith is not comprehended under the Law. Nor indeed can there be any commerce between the Law and Christ as Mediator: “You are severed from Christ, you who are justified by the Law; you have fallen from grace” (Gal. 5:4). Faith in Christ crucified is a certain kind of righteousness: for it is obedience, and as it were a conformity to the command of God, as in 1 Jn. 3:23, “This is his commandment, that we should believe on the name of his Son,” and Jn. 3:36, “He who believes in the Son has eternal life; but he who does not obey the Son shall not see life, but the wrath of God abides on him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-wotton.html">Anthony Wotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Reconciliation of a Sinner… in which the Doctrine of the Anglican Church on the Justification of the Ungodly is explicated and defended (Basil, 1624), bk. 1, ch. 6, p. 138</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

n&amp;text=but%20the%20wrath%20of%20God%20abides%20on%20him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

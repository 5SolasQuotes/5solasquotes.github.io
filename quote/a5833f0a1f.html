<main class="wrap"><figure class="quote" id="q-a5833f0a1f" data-kw="">
<blockquote><p>Would ye then obtain justification in Christ? You must previously possess Christ. But you cannot possess him without being made a partaker of his sanctification: for Christ cannot be divided. Since the Lord, therefore, does not grant us the enjoyment of these blessings without bestowing himself, he bestows both at once but never the one without the other. Thus it appears how true it is that we are justified not without, and yet not by works, since in the participation of Christ, by which we are justified, is contained not less sanctification than justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.16.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-sanctification-distinguished.html">Justification and Sanctification Distinguished</a> › <a href="../topics/justification/justification-and-sanctification-distinguished/distinguished-but-inseparable.html">Distinguished but inseparable</a></span><span class="t"><a href="../topics/union-with-christ/union-and-justification-sanctification.html">Union and Justification / Sanctification</a> › <a href="../topics/union-with-christ/union-and-justification-sanctification/both-flow-from-union.html">Both flow from union</a></span><span class="t"><a href="../topics/sanctification/sanctification-and-justification.html">Sanctification and Justification</a> › <a href="../topics/sanctification/sanctification-and-justification/distinct-but-inseparable.html">Distinct but inseparable</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-155e914340" data-kw="">
<blockquote><p>We acknowledge, then, that as soon as any one is justified, renewal also necessarily follows: and there is no dispute as to whether or not Christ sanctifies all whom he justifies. It were to rend the gospel, and divide Christ himself, to attempt to separate the righteousness which we obtain by faith from repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session 6, p. 86</span></figcaption>

</figure><figure class="quote" id="q-b37d09fdd4" data-kw="">
<blockquote><p>From this interpretation of Andrada I now finally understand what the Tridentine decree is after when it declares that justification consists of two parts, remission of sins and renewal, because they nevertheless say not long afterward that the sole formal cause of justification is the renewal, or love.</p></blockquote>

</figure><figure class="quote" id="q-b01fcdf19a" data-kw="">
<blockquote><p>It is indeed true, that we are justified in Christ through the mercy of God alone; but it is equally true and certain, that all who are justified are called by the Lord, that they may live worthy of their vocation. Let then the faithful learn to embrace him, not only for justification, but also for sanctification, as he has been given to us for both these purposes, lest they rend him asunder by their mutilated faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistle to the Romans</cite>, Romans 8:13</span></figcaption>

<main class="wrap"><figure class="quote" id="q-12412e837b" data-kw="">
<blockquote><p>For if we give not entrance to Christ, all this will be a further aggravation of our damnation. How will this justify the sentence upon us hereafter, when Christ shall set us on the left hand (Mt. 25) and say: ‘Depart from Me [Mt. 7], for I invited you to come to Me, I knocked at the door of your hearts, and you would give Me no entrance. ‘Depart from us,’ said you; Therefore now depart you from Me.’ What do profane persons in the Church, but bid Christ depart from them, especially in the motions of his Spirit; they entertain Him in the outward room, the brain; they know a little of Christ, but in the heart, the secret room, He must not come there to rule. Is it not equal that He should bid us (Mt. 23:41), ‘Depart ye cursed I know you not? You would not give entrance to Me, I will not now to you.’ As to the foolish virgins He speaks and, Prov. 1:28, wisdom knocks and has no entrance, therefore in times of danger, they call upon her, but she rejoices at their destruction; Where God magnifies his mercy in this kind in sweet allurements and inviting by judgments, mercies, ministry and Spirit, He will magnify his judgment after. Those that have neglected Heaven with the prerogatives, and advantages in this kind, they shall be cast into Hell. ‘Woe to thee Chorazin,’ etc. as you know in the Gospel (Mt. 11:21). This is one thing that may humble us of this place and nation, that Christ has no further entrance, nor better entertainment after so long knocking? For the entertaining of his Word is the welcoming of Himself, as it is, Col. 3:16, ‘Let the word of God dwell plentifully in you,’ and ‘Let Christ dwell in your hearts by faith.’ Eph. 3:17. Compare those places, Let the Word dwell plenteously in you by wisdom, and let Christ dwell in your hearts by faith. For then does Christ dwell in the heart when the truth dwells in us. Therefore what entertainment we give to his truth, we give to Himself. Now what means of knocking has He not used among us a long time? For works of all sorts, He has drawn us by the cords of a man, by all kind of favors. For mercies, How many deliverances have we had (No nation the like; we are a miracle of the Christian world) from foreign invasion and domestical conspiracies at home? How many mercies do we enjoy? Abundance together with long peace, and plenty. Besides, if this would not do, God has added corrections with all these, in every element, in every manner, infection in the air, judgments in inundations; we have had rumors of wars, etc. threatenings, shakings of the rod only, but such as might have awaked us; And then He has knocked at our hearts by the example of other nations. By what He has done to them, He has showed us what He might justly have done to us; we are no better then they.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bowels Opened</cite>, (London: G.M., 1639) | 5th Sermon, pp. 153-55</span></figcaption>

t online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee56563c5a" data-kw="">
<blockquote><p>Christ knocks at the door of thy heart, O sinner. Though invisible to mortal eyes, He is here, whether you regard it or not. He knocks. But how? By his Word—by a preached gospel—by the admonitions of conscience—and by the strivings of his Spirit. Nor is this all. He calls. “Unto you O men, I call, and my voice is unto the sons of men.” [Prov. 8] He calls by all the invitations of mercy contained in the Bible.</p></blockquote>

<blockquote><p>1. When the Lord Jesus comes and stands knocking at the door of your heart with the hammer of his Word, and with the hand of his Spirit, then bow yourself with all your might (as Sampson did, Judg. 16:30) to pull back every bolt and to draw in every bar that would keep the door shut against this blessed and bleeding Redeemer. The duty indeed is yours, but the ability is his: as much as in you lies, cause every lust of your heart to make room for your dear Jesus.

2. Welcome Christ into your heart with joy. Say to Him as Laban did to Abraham’s servant, ‘Come in thou blessed of the Lord, thou art welcome; wherefore standest thou without?’ Gen. 24:31. Christ will come to you with a blessing in his hand to bestow on you, as he did to Jacob, Gen. 32:26, etc. David-literal says to his son (that invited him to his house), ‘Why should we be chargeable to thee, my son?’ 2 Sam. 13:25. But this David-spiritual will not be chargeable: wheresoever He comes, where He comes to sup with any soul, He brings his supper with Him, Rev. 3:20, and eats but of his own honeycomb, and of his own honey, Cant. 5:1. This blessed guest brings his blessing with Him, as the ark did to the house of Obed-Edom.

3. When Christ is come into your house to dwell in your heart by faith, Eph. 3:17, be careful to keep his habitation quiet and comfortable; to this end you must adjure your corruptions by the roes and by the hinds of the field that they stir not up nor awake your beloved until He please, Cant. 2:7. ‘Tis pity such a blessed guest should meet with any disturbance; lay God’s charge upon your lusts…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. When the Lord Jesus comes and stands knocking at the door of your heart with the hammer of his Word, and with the hand of his Spirit, then bow yourself with all your might (as Sampson did, Judg. 16:30) to pull back every bolt and to draw in every bar that would keep the door shut against this blessed and bleeding Redeemer. The duty indeed is yours, but the ability is his: as much as in you lies, cause every lust of your heart to make room for your dear Jesus.

2. Welcome Christ into your heart with joy. Say to Him as Laban did to Abraham’s servant, ‘Come in thou blessed of the Lord, thou art welcome; wherefore standest thou without?’ Gen. 24:31. Christ will come to you with a blessing in his hand to bestow on you, as he did to Jacob, Gen. 32:26, etc. David-literal says to his son (that invited him to his house), ‘Why should we be chargeable to thee, my son?’ 2 Sam. 13:25. But this David-spiritual will not be chargeable: wheresoever He comes, where He comes to sup with any soul, He brings his supper with Him, Rev. 3:20, and eats but of his own honeycomb, and of his own honey, Cant. 5:1. This blessed guest brings his blessing with Him, as the ark did to the house of Obed-Edom.

3. When Christ is come into your house to dwell in your heart by faith, Eph. 3:17, be careful to keep his habitation quiet and comfortable; to this end you must adjure your corruptions by the roes and by the hinds of the field that they stir not up nor awake your beloved until He please, Cant. 2:7. ‘Tis pity such a blessed guest should meet with any disturbance; lay God’s charge upon your lusts…”

— Christopher Ness, The Crown &amp; Glory of a Christian, consisting in a Sound Conversion, … (London: Newman, 1676), bk. 2, pp. 10-13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+When+the+Lord+Jesus+comes+and+stands+knocking+at+the+door+of+your+heart+with+the+hammer+of+his+Word%2C+and+with+the+hand+of+his+Spirit%2C+then+bow+yourself+with+all+your+might+%28as+Sampson+did%2C+Judg.+16%3A30%29+to+pull+back+every+bolt+and+to+draw+in+every+bar+that+would+keep+the+door+shut+against+this+blessed+and+bleeding+Redeemer.+The+duty+indeed+is+yours%2C+but+the+ability+is+his%3A+as+much+as+in+you+lies%2C+cause+every+lust+of+your+heart+to+make+room+for+your+dear+Jesus.+2.+Welcome+Christ+into+your+heart+with+joy.+Say+to+Him+as+Laban+did+to+Abraham%E2%80%99s+servant%2C+%E2%80%98Come+in+thou+blessed+of+the+Lord%2C+thou+art+welcome%3B+wherefore+standest+thou+without%3F%E2%80%99+Gen.+24%3A31.+Christ+will+come+to+you+with+a+blessing+in+his+hand+to+bestow+on+you%2C+as+he+did+to+Jacob%2C+Gen.+32%3A26%2C+etc.+David-literal+says+to+his+son+%28that+invited+him+to+his+house%29%2C+%E2%80%98Why+should+we+be+chargeable+to+thee%2C+my+son%3F%E2%80%99+2+Sam.+13%3A25.+But+this+David-spiritual+will+not+be+chargeable%3A+wheresoever+He+comes%2C+where+He+comes+to+sup+with+any+soul%2C+He+brings+his+supper+with+Him%2C+Rev.+3%3A20%2C+and+eats+but+of+his+own+honeycomb%2C+and+of+his+own+honey%2C+Cant.+5%3A1.+This+blessed+guest+brings+his+blessing+with+Him%2C+as+the+ark+did+to+the+house+of+Obed-Edom.+3.+When+Christ+is+come+into+your+house+to+dwell+in+your+heart+by+faith%2C+Eph.+3%3A17%2C+be+careful+to+keep+his+habitation+quiet+and+comfortable%3B+to+this+end+you+must+adjure+your+corruptions+by+the+roes+and+by+the+hinds+of+the+field+that+they+stir+not+up+nor+awake+your+beloved+until+He+please%2C+Cant.+2%3A7.+%E2%80%98Tis+pity+such+a+blessed+guest+should+meet+with+any+disturbance%3B+lay+God%E2%80%99s+charge+upon+your+lusts%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Christopher+Ness%2C+The

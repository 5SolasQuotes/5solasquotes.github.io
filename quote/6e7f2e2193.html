<main class="wrap"><figure class="quote" id="q-6e7f2e2193" data-kw="">
<blockquote><p>And let your hearts be possessed of those two excellent graces. Humility and Charity. Then will your tongue not be in danger of hurting your neighbour; for it is pride and self-love, makes men delight in that. Those are the idols to which men make sacrifice of the good name and reputation of others.

The humble man delights in self-disesteem, and is glad to see his brethren’s name flourish; it is pleasing music to him to hear the virtues of others acknowledged and commended, and a harsh discord to his lowly thoughts, to hear any thing of his own. And the other. Charity, thinks no evil, is so far from casting false aspersions on any, that it rather casts a veil upon true failings and blemishes: Love covers a multitude of sins. It is like God’s love that begets it, which covers all the sins of his own children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, (1701) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 399.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dfa59e1768" data-kw="">
<blockquote><p>That the truth of the gospel. There was no danger that Paul would be deprived of his liberty even by yielding to them; but the example would have done harm to others, and therefore he prudently inquired what was expedient. This shows us how far offenses must be avoided, and points us to edification as the object which ought to be kept in view in all matters of indifference. The amount, is this: “We are the servants of the brethren, but still keeping in view that we all serve the Lord, and that the liberty of our conscience shall remain unimpaired.” When false brethren wished to bring the saints in to bondage, it was their duty not to yield to them. The truth of the gospel denotes its genuine purity, or, which means the same thing, its pure and entire doctrine. For the false apostles did not altogether set aside the gospel, but mixed up with it their own notions, so as to give it a false and disguised aspect, which it always has when we make the smallest departure “from the simplicity that is in Christ.” (2 Cor 11:3.) With what effrontery then will the Papists boast that they possess the gospel, which is not only corrupted by many inventions, but more than adulterated by many wicked doctrines? Let us remember that it is not enough to retain the name of the gospel, and some kind of summary of its doctrines, if its solid purity do not remain untouched. Where are the men who, by pretended moderation, endeavor to bring about a reconciliation between us and the Papists? as if the doctrine of religion, like a matter affecting money or property, could be compromised. With what abhorrence would such a transaction have been regarded by Paul, who affirms that it is not the true gospel, if it is not pure!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians and Ephesians</cite>, 2:5</span></figcaption>

</figure><figure class="quote" id="q-13cadfdfe6" data-kw="">
<blockquote><p>To conclude this, separation from Churches, from which Christ does not separate, is schismatical; now it’s clear in the Scripture that Christ owns churches where faith is sound for the substance, and their worship, Gospel-worship, though there be many defects and sinful mixtures among them. And what I have said concerning the schismaticalness of separation because of the sinful mixtures of those who are wicked in practice, is as true concerning separation from them who are erroneous in judgment; if the errors of those from whom the separation is made, be not fundamental, and hinder communion with Christ the head. And much more clear (if clearer can be) is the schismaticalness of those who separate from and renounce all communion with those churches which are not of their own manner of constitution and modelled according to the platform of their own particular church-order. To refrain fellowship and communion with such Churches who profess Christ their Lord, whose faith is sound, whose worship is Gospel-worship, whose lives are holy, because they come not into that particular way of church-order which we have pitched upon, is a schismatical rending of the Church of Christ to pieces… Herein likewise those separatists among ourselves are heinously faulty who censure and condemn all other churches, though their faith, worship and conversation be never so scriptural, merely because they are not gathered into church order according to their own patterns. In Scripture, Churches are commended and dignified, according as their fundamental faith was sound and their lives holy; not according to the regularity of their first manner of gathering.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude</cite>, ... (London: Maxey, 1654), on verse 19, Observations, p. 593</span></figcaption>

<blockquote><p>There was also a paper, entitled An information against Mr Renwick’s party, given in to ministers… the papers had been left by Alexander Gordon… There was nothing on the face of the ‘information’ paper to suggest that it had not been compiled by the Carrick men themselves, but the style and substance of it pointed directly to Robert Langlands… The Societies, it charged… had imposed restrictions on ministers and cast off the whole suffering ministry… they had made ‘canons’ laying down the qualifications of those fitted to be members of their meetings, forbidding association with those they regarded as unfaithful, even to the extent of servants joining in family worship with their masters, or children with their parents;¹ and, not least, they had ‘cast off most part of the societies in the shires of Ayr and Galloway, chiefly upon these two heads, that they would not disown and condemn the [civil] declaration published by Argyle, and because they were clear to call and hear faithful suffering ministers’.</p></blockquote>

<blockquote><p>Use 2: It may teach us what to judge of the Seperatists, or Brownists…

1. Because they seperate where Christ keeps fellowship, Rev. 1:18, and that He walks with us, we argue, because He is still pleased to dispense to us the Word of Life, and edifies many souls thereby, and therefore surely Christ has fellowship, and shall man be more pure than his Maker? where Christ vouchsafes fellowship, shall man renounce it? …

2. But they say that our Church consists of a mixed multitude, so was that 2 Chron. 20:13, when Jehoshaphat assembled all Judah before the Lord, there was a mixed multitude (Num. 11:4), and they did it out of fear, and yet it was a true Church, and so is ours, though there be a mixed multitude. And yet this falling off, because it is not from the main doctrine, but from the skirts, and some circumstantials, therefore they do not fall utterly from Christ, but yet it is not possible but they weaken their faith.</p></blockquote>

1. Because they seperate where Christ keeps fellowship, Rev. 1:18, and that He walks with us, we argue, because He is still pleased to dispense to us the Word of Life, and edifies many souls thereby, and therefore surely Christ has fellowship, and shall man be more pure than his Maker? where Christ vouchsafes fellowship, shall man renounce it? …

2. But they say that our Church consists of a mixed multitude, so was that 2 Chron. 20:13, when Jehoshaphat assembled all Judah before the Lord, there was a mixed multitude (Num. 11:4), and they did it out of fear, and yet it was a true Church, and so is ours, though there be a mixed multitude. And yet this falling off, because it is not from the main doctrine, but from the skirts, and some circumstantials, therefore they do not fall utterly from Christ, but yet it is not possible but they weaken their faith.”

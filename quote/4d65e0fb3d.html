<blockquote><p>Direction 6. Study before you go, what particular temptations you are like to meet with, and study well for particular preservatives against them all: As you will not go into a place infected with the plague, without an antidote. It is no small task to get a mind prepared for travel.</p></blockquote>

<blockquote><p>In the siege of Leyden we have a thrilling example of their sufferings and heroism. Three months after the commencement of the siege the food-supply was exhausted. A fearful famine began to rage. For seven weeks the inhabitants had no bread to eat and multitudes perished of hunger. On the heels of the famine came the plague or black death, which carried off a third part of the citizens. The apparently doomed survivors subsisted on dogs and cats. To the summons to surrender, they replied: ” As long as you hear the mew of a cat or the bark of a dog you may know that the city holds out. And when all have perished but ourselves, we will devour our left arms, retaining our right to defend our women, our liberty, and our religion against the foreign tyrant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands-leiden.html">Egbert Watson Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Creed of the Presbyterians</cite></span></figcaption>

<blockquote><p>It’s now high time that every crime be brought to punishment: Wrath long contained, and oft refrained, at last must have a vent. Justice severe cannot forbear to plague sin any longer; But must inflict with hand most strict mischief upon the wronger. … Eternal smart is the desert ev’n of the least offence; Then wonder not if I allot to you this recompence: But wonder more that, since so sore and lasting plagues are due To every sin, you liv’d therein, who well the danger knew. .. Die feign they would, if die they could but death will not be had; God’s direful wrath their bodies hath for ev’r immortal made. They live to lie in misery. and bear eternal woe: And live they must whil’st God is just, that He may plague them so. … O love the Lord, all ye his saints, who hath Redeemed you from everlasting wrath: Who hath by dying made your souls to live, And what He dearly bought doth freely give. Give up your selves to walk in all his ways, And study how to live unto his praise. The time is short you have to serve Him here: The day of your deliverance draweth near. Lift up your heads, ye upright ones in heart, Who in Christ’s Purchase have obtain’d a part; Behold! He rides upon a shining cloud, With angel’s voice, and trumpet sounding loud. He comes to save his folk from all their foes, And plague the men that holiness oppose. So come, Lord Jesus, quickly come we pray, Yea come and hasten our Redemption Day.</p></blockquote>

</figure><figure class="quote" id="q-d9109a0038" data-kw="">
<blockquote><p>There has to be a system of government regulation, up to and including quarantine, in order to stop the spread of dangerous pathogens. These should be regarded as invaders. If a society has the right to create a military defense system against invading armies, then it has the right to do the same with respect to invading armies of pathogens. Only the civil government can do this. This cannot be done on a profit-seeking basis. This is not a matter for the free market to solve. The free market can solve certain issues, such as the development of anti-pathogen chemicals or techniques. There can be profit in this. But the taxpayer is going to have to provide the money that civil governments use to develop systematic pathogen defense strategies, and then implement these strategies. In terms of the total cost of government, these are minor expenditures. Societies have used them throughout history. Most people accept them. There is no well-organized opposition to their use. Compared to the massive expenditures of the modern state on projects that are clearly banned by the Bible, these exceptions do not constitute a threat to the freedom of covenant-keeping people. Furthermore, those free market economists who would deny any of these expenditures have not developed comprehensive monographs on how the free market could attain these goals. They are legitimate goals. Free-market economists need to come to grips with this fact: they cannot beat something with nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gary-north.html">Gary North</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conclusion’ in Ch. 56, ‘Boundary Violations’, ‘C. Public Health’, ‘2. Quarantine’ in Christian Economics</cite>, vol. 4 (2020)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>…the King has sufficient power to oppose wasters of his kingdom and to require homage of his subjects. Suppose he have not an unlimited power to forbid these of other nations and Churches, and his own, to go to a synod, within or without his nation, for the settling of the Churches in necessary peace and truth, if the Churches must seek liberty and counsel for their souls good, and edification: nor has he any lawful power from God to hinder his own subjects to send commissioners to sound and godly synods for counsel and synodical light, more than Jeroboam could lawfully forbid the people to go and worship at Jerusalem, upon pretense that they might be persuaded to cleave to Rehoboam their lawful prince, and waste his new kingdom: nor hath the prince an unlimited and absolute power to exact such absolute homage of his people; nor such a power over their moving from place: ([Margin note:] The Lord of Life has principally in the First Table laid a law upon our locomotive, and all our actings, to honor and love Him first, and the prince only secondarily and subordinately to God; if God charge us first to go to public meetings to honor Him, the Prince under pretense of peace cannot forbid the people to go up to Jerusalem to worship; we are to obey God rather than man.) for so the [claimed] Church Independent of Jerusalem consisting of ten thousand, if not more, should have no intrinsic power to meet for the public worship of God; but the prince must have a lawful power to hinder their meeting, or then the Church cannot have a lawful power to meet; for the convening of ten thousands, if abused, is as dangerous for wasting of a kingdom in its own way, as the convening of a national synod, is, or may be destructive to peace.</p></blockquote>

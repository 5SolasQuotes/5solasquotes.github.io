<blockquote><p>Besides this evangelical character which unquestionably belongs to the Mosaic covenant, it is presented in two other aspects in the Word of God. First, it was a national covenant with the Hebrew people. In this view the parties were God and the people of Israel; the promise was national security and prosperity; the condition was the obedience of the people as a nation to the Mosaic law; and the mediator was Moses. In this aspect it was a legal covenant. It said, “Do this and live.” Secondly, it contained, as does also the New Testament, a renewed proclamation of the original covenant of works. It is as true now as in the days of Adam, it always has been and always must be true, that rational creatures who perfectly obey the law of God are blessed in the enjoyment of his favour; and that those who sin are subject to his wrath and curse. Our Lord assured the young man who came to Him for instruction that if he kept the commandments he should live (emphasis added).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (1872), 2.374–376.</span></figcaption>

</figure><figure class="quote" id="q-8de89ac022" data-kw="">
<blockquote><p>1. This contract between God and the first Adam, is in sacred writ, expressly styled a covenant. “These are the two covenants; the one from the mount Sinai, which gendereth to bondage, which is Agar.” Here are two covenants mentioned, the one of which, genders to bondage, and the other, to liberty or freedom. The covenant of grace, or “The law of the Spirit of life in Christ Jesus,” is the one which genders to liberty, or which makes free from the law of sin and death. The one, therefore, which genders to bondage, must be that law or covenant of works, which was republished to the Israelites, from mount Sinai; which required perfect obedience to the ten commandments, on pain of death, and contained a promise of life, to the man who should do, or perform such obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Covenant of Works</cite>, 5</span></figcaption>

</figure><figure class="quote" id="q-02da253815" data-kw="">
<blockquote><p>1. This covenant, called “the old covenant,” was never intended to be of itself the absolute rule and law of life and salvation unto the church, but was made with a particular design, and with respect unto particular ends. This the apostle proves undeniably in this epistle, especially in the chapter foregoing, and those two that follow. Hence it follows that it could abrogate or disannul nothing which God at any time before had given as a general rule unto the church. For that which is particular cannot abrogate any thing that was general, and before it; as that which is general doth abrogate all antecedent particulars, as the new covenant doth abrogate the old. And this we must consider in both the instances belonging hereunto. For,— (1.) God had before given the covenant of works, or perfect obedience, unto all mankind, in the law of creation. But this covenant at Sinai did not abrogate or disannul that covenant, nor any way fulfil it. And the reason is, because it was never intended to come in the place or room thereof, as a covenant, containing an entire rule of all the faith and obedience of the whole church. God did not intend in it to abrogate the covenant of works, and to substitute this in the place thereof; yea, in sundry things it re-enforced, established, and confirmed that covenant. For,— [1.] It revived, declared, and expressed all the commands of that covenant in the decalogue; for that is nothing but a divine summary of the law written in the heart of man at his creation. And herein the dreadful manner of its delivery or promulgation, with its writing in tables of stone, is also to be considered; for in them the nature of that first covenant, with its inexorableness as unto perfect obedience, was represented. And because none could answer its demands, or comply with it therein, it was called “the ministration of death,” causing fear and bondage, 2 Cor. 3:7. [2.] It revived the sanction of the first covenant, in the curse or sentence of death which it denounced against all transgressors. Death was the penalty of the transgression of the first covenant: “In the day that thou eatest, thou shalt die the death.” And this sentence was revived and represented anew in the curse wherewith this covenant was ratified, “Cursed be he that confirmeth not all the words of this law to do them,” Deut. 27:26; Gal. 3:10. For the design of God in it was to bind a sense of that curse on the consciences of men, until He came by whom it was taken away, as the apostle declares, Gal. 3:19. [3.] It revived the promise of that covenant,—that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Rom. 10:5; as he doth, Lev. 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 23.77–78.</span></figcaption>

enant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-ef5dce598c" data-kw="">
<blockquote><p>At present there is gneral agreement that the doctrine of the covenants is a peculiarly Reformed doctrine. It emerged in Reformed theology where it was assured of a permanent place and in a way that has also remained confined within these bounds. It is true that towards the end fo the seventeenth century this doctrine was taken over by several Lutheran theologians,¹ but this apparently took place by way of imitation, the doctrine being unknown within the genuine Lutheran framework. ¹ Diestel (Jahrbucher fur Deutsche Theologie, 10, 266) lists those Lutheran theologians who gave a place to the covenant in their system, viz., Calixtus, Wolfgang Jager of Tubingen, Caspar, Exner, Reuter, and others. Cocceius enjoyed a good reputation in Germany, especially as an exegete, even among the Lutherans. The covenant of works was emphasized. This is strange since there is no place for it in a consistent Lutheran system. Federal and natural unity were placed side by side in the covenant of works without subordinating the one to the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of the Covenant in Reformed Theology’ in Redemptive History &amp; Biblical Interpretation: the Shorter Writings of Geerhardus Vos</cite>, ed. Richard Gaffin (d. 1949; Presbyterian &amp; Reformed, 1980), p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works/nature-of-the-covenant.html">Nature of the Covenant</a></span></div>
<div class="actions"><button class="copy" data-copy="“At present there is gneral agreement that the doctrine of the covenants is a peculiarly Reformed doctrine. It emerged in Reformed theology where it was assured of a permanent place and in a way that has also remained confined within these bounds. It is true that towards the end fo the seventeenth century this doctrine was taken over by several Lutheran theologians,¹ but this apparently took place by way of imitation, the doctrine being unknown within the genuine Lutheran framework. ¹ Diestel (Jahrbucher fur Deutsche Theologie, 10, 266) lists those Lutheran theologians who gave a place to the covenant in their system, viz., Calixtus, Wolfgang Jager of Tubingen, Caspar, Exner, Reuter, and others. Cocceius enjoyed a good reputation in Germany, especially as an exegete, even among the Lutherans. The covenant of works was emphasized. This is strange since there is no place for it in a consistent Lutheran system. Federal and natural unity were placed side by side in the covenant of works without subordinating the one to the other.”

— Geerhardus Vos, ‘The Doctrine of the Covenant in Reformed Theology’ in Redemptive History &amp; Biblical Interpretation: the Shorter Writings of Geerhardus Vos ed. Richard Gaffin (d. 1949; Presbyterian &amp; Reformed, 1980), p.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAt+present+there+is+gneral+agreement+that+the+doctrine+of+the+covenants+is+a+peculiarly+Reformed+doctrine.+It+emerged+in+Reformed+theology+where+it+was+assured+of+a+permanent+place+and+in+a+way+that+has+also+remained+confined+within+these+bounds.+It+is+true+that+towards+the+end+fo+the+seventeenth+century+this+doctrine+was+taken+over+by+several+Lutheran+theologians%2C%C2%B9+but+this+apparently+took+place+by+way+of+imitation%2C+the+doctrine+being+unknown+within+the+genuine+Lutheran+framework.+%C2%B9+Diestel+%28Jahrbucher+fur+Deutsche+Theologie%2C+10%2C+266%29+lists+those+Lutheran+theologians+who+gave+a+place+to+the+covenant+in+their+system%2C+viz.%2C+Calixtus%2C+Wolfgang+Jager+of+Tubingen%2C+Caspar%2C+Exner%2C+Reuter%2C+and+others.+Cocceius+enjoyed+a+good+reputation+in+Germany%2C+especially+as+an+exegete%2C+even+among+the+Lutherans.+The+covenant+of+works+was+emphasized.+This+is+strange+since+there+is+no+place+for+it+in+a+consistent+Lutheran+system.+Federal+and+natural+unity+were+placed+side+by+side+in+the+covenant+of+works+without+subordinating+the+one+to+the+other.%E2%80%9D%0A%0A%E2%80%94+Geerhardus+Vos%2C+%E2%80%98The+Doctrine+of+the+Covenant+in+Reformed+Theology%E2%80%99+in+Redemptive+History+%26+Biblical+Interpretation%3A+the+Shorter+Writings+of+Geerhardus+Vos+ed.+Richard+Gaffin+%28d.+1949%3B+Presbyterian+%26+Reformed%2C+1980%29%2C+p.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fef5dce598c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ef5dce598c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-covenant-of-works/#:~:text=At%20present%20there%20is%20gneral%20agreement,su

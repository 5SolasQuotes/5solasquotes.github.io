<main class="wrap"><figure class="quote" id="q-2860e14caa" data-kw="">
<blockquote><p>[W]e cannot yield obedience, for conscience’ sake, to the present civil authority in North America. […]

1. The federal constitution, or instrument of national union, does not even recognize the existence of God, the King of Nations. In these civil deeds, though the immediate end may be the happiness of the commonwealth, yet the ultimate end, as well in this as in every other thing we do, should be the glory of God. Ought not men, in the formation of their deeds, to consider their responsibility to the moral governor, and their obligation to acknowledge his authority? Prov. 3:5: “In all thy ways acknowledge him, and he shall direct thy paths.” That a national deed, employed about the fundamental stipulations of magistracy as an ordinance of God, and the investiture of magistrates as his ministers, should nowhere recognize the existence of the Governor of the universe, is, to say nothing worse of it, truly lamentable. May it not be said of this nation as of Israel, Hos. 8:4: “They have set up kings, but not by me; they have made princes, and I knew it not?” Did not the framers of this instrument act, not only as if there had been no divine revelation for the supreme standard of their conduct; but also as if there had been no God? Did they not, in this, resemble the fool mentioned, Ps. 14:1, who “said in his heart, There is no God?” Every official act of the governor of a province must have some specific stamp of his dependence upon the authority which appointed him: and shall a nation act as if independent of the God of the universe, and expect to be guiltless?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), pp 34-5.</span></figcaption>

<blockquote><p>I answer that, The existence of God can be proved in five ways. The first and more manifest way is the argument from motion. It is certain, and evident to our senses, that in the world some things are in motion. Now whatever is in motion is put in motion by another, for nothing can be in motion except as it is in potentiality to that towards which it is in motion; whereas a thing moves inasmuch as it is in act. For motion is nothing else than the reduction of something from potentiality to actuality. But nothing can be reduced from potentiality to actuality, except by something in a state of actuality. Thus that which is actually hot, as fire, makes wood, which is potentially hot, to be actually hot, and thereby moves and changes it. Now it is not possible that the same thing should be at once in actuality and potentiality in the same respect, but only in different respects. For what is actually hot cannot simultaneously be potentially hot; but it is simultaneously potentially cold. It is therefore impossible that in the same respect and in the same way a thing should be both mover and moved, i.e., that it should move itself. Therefore, whatever is in motion must be put in motion by another. If that by which it is put in motion be itself put in motion, then this also must needs be put in motion by another, and that by another again. But this cannot go on to infinity, because then there would be no first mover, and, consequently, no other mover; seeing that subsequent movers move only inasmuch as they are put in motion by the first mover; as the staff moves only because it is put in motion by the hand. Therefore it is necessary to arrive at a first mover, put in motion by no other; and this everyone understands to be God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, q. 2, article 3, ‘Whether God Exists’, ‘I answer that’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

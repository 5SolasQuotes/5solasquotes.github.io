<main class="wrap"><figure class="quote" id="q-cf6f469558" data-kw="">
<blockquote><p>The embracing of refusing the Oath of Abjuration, affords not the least ground for separation. This proposition,” adds he, “shines with such a bright and convincing light of truth, that none who can allow themselves, without prejudice, to reflect upon its evidence, will refuse to admit of it as undeniable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

— John Currie, An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+embracing+of+refusing+the+Oath+of+Abjuration%2C+affords+not+the+least+ground+for+separation.+This+proposition%2C%E2%80%9D+adds+he%2C+%E2%80%9Cshines+with+such+a+bright+and+convincing+light+of+truth%2C+that+none+who+can+allow+themselves%2C+without+prejudice%2C+to+reflect+upon+its+evidence%2C+will+refuse+to+admit+of+it+as+undeniable.%E2%80%9D%0A%0A%E2%80%94+John+Currie%2C+An+Essay+on+Separation%3A+or+a+Vindication+of+the+Church+of+Scotland+contra+the+Seceders&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcf6f469558.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cf6f469558.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/john-currie-essay-on-separation-or-a-vindication-of-the-church-of-scotland-contra-the-seceders/#:~:text=The%20embracing%20of%20refusing%20the%20Oath,to%20admit%20of%20it%20as%20undeniable&amp;text=The%20embracing%20of%20refusing%20the%20Oath%20of%20Abjuration&amp;text=will%20refuse%20to%20admit%20of%20it%20as%20undeniable" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-236068a358" data-kw="">
<blockquote><p>Consider that a separation, when not upon clear and just grounds, is a greater sin before God, and more piercing to the heart of Christ, than either murder or adultery, etc. because this is to dissolve the union of his Church and to divide Christian societies. Whosoever shall be found to plead for this, I dare affirm he blows that fire with his breath, which Christ would quench with his blood. My dear friends, weigh seriously, as before the Lord, how Jesus Christ will take it at any man or woman’s hand to tear the commission of any of his ambassadors, whom he will still own as an ambassador, and as negotiating a peace between God and sinners: Sure I need neither tell you that withdrawing from hearing such is a tearing their commission; nor need I tell you that this will be found a sin more hateful and heinous in the sight of Jesus Christ than many others that appear more black.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-0ed5b45341" data-kw="">
<blockquote><p>It’s no duty [to separate from an impure church], as he elsewhere says, because there is no command; it’s no duty, and therefore we read not this word, ‘come forth’, in any of the epistles written to the seven Churches [in Rev. 2-3], against which Christ says He has such and such things. They that lived in the impurer are not called forth into the purer, but there are promises made to them that keep themselves pure, and duties enjoined them toward the impurer part. For we may not make every disease the plague. Shall the sons of God, the angels, forsake the Lord’s Presence because Satan came also amongst them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Sacrament, p. 246 &amp; p. 31 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’</cite>, p. 55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“It’s no duty [to separate from an impure church], as he elsewhere says, because there is no command; it’s no duty, and therefore we read not this word, ‘come forth’, in any of the epistles written to the seven Churches [in Rev. 2-3], against which Christ says He has such and such things. They that lived in the impurer are not called forth into the purer, but there are promises made to them that keep themselves pure, and duties enjoined them toward the impurer part. For we may not make every disease the plague. Shall the sons of God, the angels, forsake the Lord’s Presence because Satan came also amongst them?”

em" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6e67728399" data-kw="">
<blockquote><p>Our Lord Jesus is no approver nor countenancer of separation from a true Church for the faults of some members in it; neither do faults in some members, and defects in ministers and officers in executing discipline, pollute the ordinances in themselves, or to others who are free of that guilt; and so do not necessitate a separation from such a Church, or any ordinance thereof: For, this and the former epistle being compared together, these things are clear, that there were gross members in the Church, adulterers, Nicolaitans, seducers, etc. that they are continued in Church-communion, ‘thou hast them and sufferest them,’ clearly import this; for that angel no otherwise had them but as Church-members under his charge. 3. That this angel sinfully permitted them to continue Church-members, and therefore is reproved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-8cb7567c9a" data-kw="">
<blockquote><p>Thus their divisions increased, and the necessary work which might and should have been gone into, was by their debates first delayed and then entirely marred. And enemies had it to observe and remark that ministers preached and prayed against one another. And Mr. Cargil, they say, publicly protested that they behoved to part one from another because a good many of them would not go into a day of humiliation. When this project failed, I am told, Mr. Hamilton [a lay-leader in the covenanting army] took upon him to send orders to Mr. Welsh, Mr. Hume, Mr. Rae, and others of the more moderate party, to preach against the indulgence, otherwise he and a good many of the officers would not hear them. It is said, Mr. Rae sent a very home and close answer to him, and desired the messenger to tell Mr. Hamilton and the rest, that he had been wrestling against Erastianism in the magistrate for many years; and he would never truckle to the worst kind of Erastianism in the common people [led by Hamilton, with such orders]; that he would receive no instructions from him nor any of them as to the subject and matter of his sermons; and wished he might mind what belonged to him, and not go beyond his sphere and station.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3</cite>, pp. 90-95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>Also, though it be true that one and the same man may both teach and exhort, and the comparison of the natural body [Rom. 12:4] does not in all things hold, for one member cannot both be the eye to see and the ear to hear [in the human body], but both are here a sort of eye to the Church; yet has Christ made the pastor and the doctor different. It is needless to dispute if they differ in nature, and if it be a confounding of Christ’s order that one be both, when Christ has given gifts for both to one man, for first, the Word of God does difference them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 1</cite>, p. 158</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8a99c437fa" data-kw="">
<blockquote><p>Now beside the apostles, prophets and evangelists, which were not ordained to be ordinary and perpetual offices in the Church, there are but two ecclesiastical orders or degrees instituted by Christ in the New Testament, viz. elders and deacons. Excellenter Canones d•…os tantum sacros ordines appellari censent, Diaconatus scilicet &amp; Presbyterat•…, quia hos solos primitiva Ecclesia legitur habuisse, &amp; de hi•… sol•… praeceptum Apostli habe•…, says the Master of Sentences (bk. 4, distinction [??])… Moreover, 1 Tim. 3, he gives order only for bishops and deacons, but says nothing of a third order. Wherefore it is manifest that beside those two orders of elders and deacons, there is no other ecclesiastical order which has any divine institution, or necessary use in the Church. And princes should do well to apply their power and authority to the extirpation and rooting out of Popes, Cardinals, Patriarches, Primates, Archbishops, Bishops, Suffragans, Abbots, Deanes, Vice-Deans, Priors, Archdeacons, Subdeacons, Chancellours, Chantours, Subchantours, Exorcists, Monks, Hermits, Acoluths, and all the whole rabble of Popish orders, which undo the Church, and work more mischief in the earth than can be either soon seene or shortly told. But contrary wise, princes ought to establish and mantain in the Church, elders and deacons, according to the apostolical institution. Now elders are either such as labor in the Word and doctrine, or else such as are appointed for discipline only…. And many more of our divines, who teach that the apostle 1 Tim. 5:17, directly implies that there were some elders who ruled well, and yet labored not in the Word and doctrine, and those elders he means by them that rule, Rom. 12:8 and by governments, 1 Cor. 12:28, where the apostle says not ‘helps in governements,’ as our new English translation corruptly reads, but ‘helps, governements,’ etc. plainly putting ‘governements’ for a different order from ‘helps’ or deacons… Deacons were instituted by the apostles for collecting, receiving, keeping, and distributing of ecclesiastical goods, which were given and dedicated for the maintenance of ministers, churches, schools, and for the help and relief of the poor, the stranger, the sick and the weak, also for furnishing of such things as are necessary to the ministration of the sacraments. Beside which employments, the Scripture has assigned neither preaching, nor baptizing, nor any other ecclesiastical function to ordinary deacons… And as for the other sort of elders, together with deacons, we judge the ancient order of this Church [of Scotland], to have been most convenient for providing of well qualified men for those functions and offices. For the eighth head of the first book of discipline, touching the election of elders and deacons, ordains that men of best knowledge and cleanest life, be nominated to be in election, and that their names be publicly read to the whole Church by the minister, giving them advertisement, that from among them must be chosen elders and deacons: that if any of these nominated be noted with public infamy, he ought to be repelled: And that if any man know others of better qualities within the Church, then these that be nominated, they should be put in election, that the Church may have the choice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), ch. 8, Digression 1, ‘Of the Vocation of Men of Ecclesiastical Order’</cite>, pp. 160-63</span></figcaption>

e+were+some+elders+who+ruled+well%2C+and+yet+labored+not+in+the+Word+and+doctrine%2C+and+those+elders+he+means+by+them+that+rule%2C+Rom.+12%3A8+and+by+governments%2C+1+Cor.+12%3A28%2C+where+the+apostle+says+not+%E2%80%98helps+in+governements%2C%E2%80%99+as+our+new+English+translation+corruptly+reads%2C+but+%E2%80%98helps%2C+governements%2C%E2%80%99+etc.+plainly+putting+%E2%80%98governements%E2%80%99+for+a+different+order+from+%E2%80%98helps%E2%80%99+or+deacons%E2%80%A6+Deacons+were+instituted+by+the+apostles+for+collecting%2C+receiving%2C+keeping%2C+and+distributing+of+ecclesiastical+goods%2C+which+were+given+and+dedicated+for+the+maintenance+of+ministers%2C+churches%2C+schools%2C+and+for+the+help+and+relief+of+the+poor%2C+the+stranger%2C+the+sick+and+the+weak%2C+also+for+furnishing+of+such+things+as+are+necessary+to+the+ministration+of+the+sacraments.+Beside+which+employments%2C+the+Scripture+has+assigned+neither+preaching%2C+nor+baptizing%2C+nor+any+other+ecclesiastical+function+to+ordinary+deacons%E2%80%A6+And+as+for+the+other+sort+of+elders%2C+together+with+deacons%2C+we+judge+the+ancient+order+of+this+Church+%5Bof+Scotland%5D%2C+to+have+been+most+convenient+for+providing+of+well+qualified+men+for+those+functions+and+offices.+For+the+eighth+head+of+the+first+book+of+discipline%2C+touching+the+election+of+elders+and+deacons%2C+ordains+that+men+of+best+knowledge+and+cleanest+life%2C+be+nominated+to+be+in+election%2C+and+that+their+names+be+publicly+read+to+the+whole+Church+by+the+minister%2C+giving+them+advertisement%2C+that+from+among+them+must+be+chosen+elders+and+deacons%3A+that+if+any+of+these+nominated+be+noted+with+public+infamy%2C+he+ought+to+be+repelled%3A+And+that+if+any+man+know+others+of+better+qualities+within+the+Church%2C+then+these+that+be+nominated%2C+they+should+be+put+in+election%2C+that+the+Church+may+have+the+choice.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+ch.+8%2C+Digression+1%2C+%E2%80%98Of+the+Vocation+of+Men+of+Ecclesiastical+Order%E2%80%99%2C+pp.+160-63&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8a99c437fa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8a99c437fa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/deacons#:~:text=Now%20beside%20the%20apostles%2C%20prophets%20and,the%20Church%20may%20have%20the%20choice&amp;text=Now%20beside%20the%20apostles%2C%20prophets%20and%20evangelists%2C%20which&amp;text=election%2C%20that%20the%20Church%20may%20have%20the%20choice" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-95255754b2" data-kw="">
<blockquote><p>When subsequently one presbyter was chosen to preside over the rest, this was done to remedy schism and to prevent each individual from rending the church of Christ by drawing it to himself. For even at Alexandria from the time of Mark the Evangelist until the episcopates of Heraclas and Dionysius the presbyters always named as bishop one of their own number chosen by themselves and set in a more exalted position, just as an army elects a general, or as deacons appoint one of themselves whom they know to be diligent and call him archdeacon. For what function, excepting ordination, belongs to a bishop that does not also belong to a presbyter?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 146 (to Evangelus)</cite>, §1</span></figcaption>

</figure><figure class="quote" id="q-c888c44880" data-kw="">
<blockquote><p>The author with the Scriptures makes a pastor, a bishop, a preaching elder, to be altogether one and in nothing to differ, but as three synonymous names of one and the same officer, which by divine right is indeed superior to a ruling elder, or presbyter; this no man ever did question, but no way superior to a preaching elder [as presbyterians hold], of whom alone is all the present question [with episcopacy].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unlawfulness &amp; Danger of Limited Episcopacy.. (1641)</cite>, p. 17</span></figcaption>

<blockquote><p>THE DUTY OF THE HIGH POWERS AND OF THE OTHER TEMPORAL MAGISTRATES.

The duty of the high powers and of the other temporal rulers is to be learned in the law of God, to maintain pure and Christian religion, to nourish and defend the preachers and students of God’s word, to banish all false religion and idolatry, to punish, yea, and if they will not turn, to kill the preachers and maintainers of false doctrine, to judge equally and indifferently without partiality, to take no bribes, nor to oppress the common people, but to care for them as a father for his children, to defend the good, to correct the evil, to advance virtue, and to punish vice. … With holy fatherly a care Moyses, Samuel, David, and divers other noble princes governed their people, the holy scriptures do evidently declare.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-becon.html">Thomas Becon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to be Known of the Faithful Newly set Forth to the Great Profit of all the Readers (1569) in The Catechism of Thomas Becon … with other pieces written by him in the Reign of King Edward the Sixth, ed. John Ayre (Cambridge: The Parker Society, 1844), pp 511, 514.</cite></span></figcaption>

<blockquote><p>§25… We must distinguish: 1. between a lawful impose or contracter, and a violent usurper or robber that injuriously compels us to swear.

2. Between the obvious usual sense of the words and an unusual forced sense.

3. Between a sincere, involuntary misunderstanding the imposer, and a voluntary fraudulent reservation or private sense.

4. Between one that I owe something to antecedently, and one that I owe nothing to but by the mere self-obligation of my vow.

5. Between an imposer that is himself the culpable cause of my misunderstanding him, and one that is not the cause, but my own weakness or negligence is the cause.

6. Between a case where both senses may be kept, and a case where they cannot, being inconsistent. … Proposition 6. If the imposer be a robber or usurper, or one that I owe nothing to in justice, but what I oblige myself to by my oath, I am not then bound at all to keep my oath in his sense, if my own sense was according to the common use of the words. Proposition 7. Though I may not lie to a robber or tyrant that unjustly imposes promises or oaths upon me, yet if he put an oath or promise on me which is good and lawful in the proper usual sense of the words, though bad in his sense (which is contrary to the plain words), whether I may take this to save my liberty or life, I leave to the consideration of the judicious: that which may be said against it is, that oaths must not be used indirectly and dissemblingly. That which may be said for it is:

1. That I have no obligation to fit my words to his personal private sense.

2. That I deceive him not, but only permit him to deceive himself, as long as it is he and not I that misuses the words.

3. That I am to have chief respect to the public sense: and it is not his sense, but mine that is the public sense.

4. That the saving of a man’s life or liberty is cause enough for the taking [of] a lawful oath. [Baxter elsewhere says this: “Lawyer: But as you have said that those great men, [Hugo] Grotius and Bishop Jeremy Taylor were for profitable lying, so you know that worthy Latitudinarian doctor who was wont to say that if false knaves would turn him out of his ministry and living by ensnaring impositions, he would take the words in the best sense he could subdue them to, whatever the authors meant; and it was as lawful for him to defend himself against knaves with his tongue, as with his hands and sword. … §32. Rule 18. Though an oath imposed by an usurper or by violence is not to be taken in formal obedience, nor at all, unless the greatness of the benefit require it, yet being taken it is nevertheless obligatory (supposing nothing else do make it void). Man is a free agent and cannot be forced though he may be frightened: If he swear to a thief for the saving of his life, he voluntarily does choose the inconveniences of the oath as a means to save his life. Therefore being a voluntary act it is obligatory. Else there should be no obligation on us to suffer for Christ, but anything might be sworn or done to escape suffering: See of this Dr. Sanderson largely, Lectures 4, sect. 14-16. The imposition and the oath are different things. In the imposition, a thief or tyrant is the party commanding, and I am the party commanded: And his having no authority to command me, does nullify only his command and makes me not obliged to obey him, nor to take it in any obedience to him: But yet if I do take it without any authority obliging me (as private oaths are taken), it is still an oath or vow, in which the parties are God and man: Man vowing and making himself a debtor to God: And God has authority to require me to keep my vows, when men have no authority to require me to make them. All men confess that private Vows bind: And the nullity of the imposer’s authority makes them but private vows. This case is easy and commonly agreed on.</p></blockquote>

<blockquote><p>Quest. IV. Did the Lord by Moses give to the Jews, as a Body Politick, sundry Judicial Laws, which expired together with their state? Yes. Do they oblige any other now, further than the general equity thereof may require. No. Exod. 21. from the first to the last ver. Exod. 22. 1. to verse 29. Gen. 49. 10. 1 Cor. 9. 8, 9, 10. 1 Peter 2. 13. 14. Matth. 5. 17. 38. 39. Well then, do not some err, though otherwise Orthodox, who maintain, that the whole Judicial Law of the Jews is yet alive, and binding all of us, who are Christian Gentiles? Yes. By what reasons are they confuted? (1) Because, the Judicial Law, was delivered by Moses to the Israelites to be observed, as to a Body Politick; Exod. 21 chapter. (2) Because, this Law, in many things, which are of particular right, was accommodated, to the Common-wealth of the Jews, and not to other Nations also; Exod. 22. 3. Exod. 21. 2. Lev. 25. 2, 3. Deut: 24. 1, 2, 3. Deut. 25. 5, 6, 7. (3) Because, in other things, which are not of particular right, it is neither from the Law of Nature, obliging by Reason; neither is it pressed upon Believers under the Gospel, to be observed. (4) Because, Believers are appointed under the Gospel to obey the civil Laws, and commands of those under whose Government they live, providing they be just, and that for Conscience sake. Rom. 13. 1. 1 Peter 2. 13, 14. Titus 3. 1.</p></blockquote>

— David Dickson, Truth’s Victory Over Error, (Edinburgh, 1684), 144–45.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQuest.+IV.+Did+the+Lord+by+Moses+give+to+the+Jews%2C+as+a+Body+Politick%2C+sundry+Judicial+Laws%2C+which+expired+together+with+their+state%3F+Yes.+Do+they+oblige+any+other+now%2C+further+than+the+general+equity+thereof+may+require.+No.+Exod.+21.+from+the+first+to+the+last+ver.+Exod.+22.+1.+to+verse+29.+Gen.+49.+10.+1+Cor.+9.+8%2C+9%2C+10.+1+Peter+2.+13.+14.+Matth.+5.+17.+38.+39.+Well+then%2C+do+not+some+err%2C+though+otherwise+Orthodox%2C+who+maintain%2C+that+the+whole+Judicial+Law+of+the+Jews+is+yet+alive%2C+and+binding+all+of+us%2C+who+are+Christian+Gentiles%3F+Yes.+By+what+reasons+are+they+confuted%3F+%281%29+Because%2C+the+Judicial+Law%2C+was+delivered+by+Moses+to+the+Israelites+to+be+observed%2C+as+to+a+Body+Politick%3B+Exod.+21+chapter.+%282%29+Because%2C+this+Law%2C+in+many+things%2C+which+are+of+particular+right%2C+was+accommodated%2C+to+the+Common-wealth+of+the+Jews%2C+and+not+to+other+Nations+also%3B+Exod.+22.+3.+Exod.+21.+2.+Lev.+25.+2%2C+3.+Deut%3A+24.+1%2C+2%2C+3.+Deut.+25.+5%2C+6%2C+7.+%283%29+Because%2C+in+other+things%2C+which+are+not+of+particular+right%2C+it+is+neither+from+the+Law+of+Nature%2C+obliging+by+Reason%3B+neither+is+it+pressed+upon+Believers+under+the+Gospel%2C+to+be+observed.+%284%29+Because%2C+Believers+are+appointed+under+the+Gospel+to+obey+the+civil+Laws%2C+and+commands+of+those+under+whose+Government+they+live%2C+providing+they+be+just%2C+and+that+for+Conscience+sake.+Rom.+13.+1.+1+Peter+2.+13%2C+14.+Titus+3.+1.%E2%80%9D%0A%0A%E2%80%94+David+Dickson%2C+Truth%E2%80%99s+Victory+Over+Error%2C+%28Edinburgh%2C+1684%29%2C+144%E2%80%9345.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fabb0085706.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/abb0085706.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/01/dickson-theonomy-is-an-error/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-1c7f1ad299" data-kw="">
<blockquote><p>Magistracy (saith he, p. 135.) is a power ordained of God, an Image of the power and judgement committed to Christ; Scripture and the gift of wisdom, justice and righteousness, are his unction now. Page 138. They are set up more specially to minister peace and judgement to Gods people in the flesh.

Then Nero, the great Turk, the Indian Kings, being ordained of God, Rom. 3.1. as the image of Christ, must be his submediators and under Deputies, little spiritual Kings, and Prophets, and Priests under Christ as Mediator. And who gave the Scriptures, the Law, written Gospel, and such an unction to the Indian Kings? for they are Magistrates. The man cannot speak of Christian Magistrates; for Rom. 13. which he citeth, speaketh of Nero, whose head was dry from all unction of the Gospel, or new Testament.

If the Magistrate be an Image of Christ’s power, and that power committed to him; they may under the Mediator Christ, ministerially judge of the doctrine preached by Ministers, if true or false. And if they be set up to minister justice more specially to God’s people in the flesh; then the people of God in the Spirit, and in all Spirit, as Saltmarsh saith most of them all are, shall be under no Magistrate; but this he saith of all, page 288, 293, 200, 201, 202, &amp;c. And by this every Magistrate must be a Christian of an image of the Mediator’s power; or then no Christian, or spiritual man can be a Magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 1.21, pp 215-16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-c6852c840c" data-kw="">
<blockquote><p>The truth is, the times were very sad, and nothing but lamentation and bemoanings heard in the streets. Those that had wealth retired into the country, but those that were needy were, if not taken away by death, almost starved, and so consequently ready to mutiny against their superiors for relief. All the gates of colleges and halls were constantly kept shut day and night, a few persons being left in them to keep possession. The shops of the town were closed, none but the attendants on the sick or the collectors for them were to be seen stirring abroad, the churches were seldom or never open for divine service.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/london.html">Charles Creighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A History of Epidemics in Britain, from A.D. 664 to the Extinction of the Plague</cite></span></figcaption>

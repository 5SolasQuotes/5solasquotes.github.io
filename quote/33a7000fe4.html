<main class="wrap"><figure class="quote" id="q-33a7000fe4" data-kw="">
<blockquote><p>In the order of eminence he [Scotus] shows that 1) some eminent nature is simply first in perfection; 2) a supreme nature is uncausable; 3) a supreme nature actually exists. Next Scotus shows that this triple primacy, namely of efficiency, finality, and eminence, belongs to the same quiddity or nature. Having proved these relative properties of the first being, he proceeds further to prove the infinity of the first being. Having proved infinity, he demonstrates that God is unique in nature, using six (or seven) arguments…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alan-b-wolter.html">Alan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958)</cite>, p. 86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d4371b9201" data-kw="">
<blockquote><p>The idea that no philosophies are better than [an]other has also only become less plausible in the last ten years… The idea that there are no gradations among secular thinkers with regard to natural theology and natural law or even the hidden things is empirically disproven by Jordan Peterson and like thinkers… Cornelius Van Til and Karl Barth both argued that, among all the various positions of philosophers, we should not acknowledge that some are better and others worse. They are all equally the wisdom of this age to which the hidden wisdom of Christ is opposed. Emil Brunner came back with a rebuttal, affirming the betterness of the kind of anti-materialist and moral realist philosophy of Socrates, Plato, and Aristotle and their modern successors, as opposed to the naturalism of Darwin, Marx, Freud, and Nietzsche. I would say the same for Jordan Peterson with respect to the New Atheists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joel-carini.html">Joel Carini</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Natural Man Does Not Accept the Things of the Spirit of God – But He Can Accept Natural Theology, a Response to Brian Mattson &amp; Richard Gaffin’ (2024)</cite></span></figcaption>

</figure><figure class="quote" id="q-94f2641b32" data-kw="">
<blockquote><p>The soul, by which each was man, was not educed from the potency of the body, but was created from nothing by God [in Gen. 2], infused into the body and personally united with it. For God breathed into the body the spirit of life, that is, the soul, Gen. 2:7, and thus man was made a living soul, in the same place and 1 Cor. 15:45. Therefore the soul of man is of a spiritual nature, as it is everywhere called ‘spirit’, Ps. 31:5; Eccl. 12:7; Zech. 12:1; Lk. 23:46; Acts 7:59. It is immortal, which cannot be killed, Mt. 10:28, but after death remains surviving, Mt. 22:32; Phil. 1:23; Lk. 16:22-23ff. Endowed also with the faculty of understanding and willing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alting.html">Johann H. Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-e7c712a36c" data-kw="">
<blockquote><p>Many things are usually inquired about angels in general, and about the good ones in particular, by the common writers of theses and common places. We now postponing them (because other things are more urgent) will only ventilate two questions for the present about hierarchies and guardian angels. He who desires the rest, let him go to the writers of common places, and Suarez, bk. 8, On Angels, and the rest of the scholastics on Thomas, [Summa,] pt. 1, but to be read with judgment;</p></blockquote>

</figure><figure class="quote" id="q-eda808d4d5" data-kw="">
<blockquote><p>Doth the plowman plow all day to sow? doth he open and break the clods of his ground? When he hath made plain the face thereof, doth he not cast abroad the fitches, and scatter the cummin, and cast in the principal wheat and the appointed barley and the rie in their place? For his God doth instruct him to discretion, and doth teach him. For the fitches are not threshed with a threshing instrument, neither is a cart wheel turned about upon the cummin; but the fitches are beaten out with a staff, and the cummin with a rod. Bread corn is bruised; because he will not ever be threshing it, nor break it with the wheel of his cart, nor bruise it with his horsemen. This also cometh forth from the Lord of hosts, which is wonderful in counsel, and excellent in working.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">Old Testament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Isa.</cite>, 28:24-29</span></figcaption>

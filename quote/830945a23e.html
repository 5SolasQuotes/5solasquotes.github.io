<blockquote><p>Lastly, God’s spirit works not with ceremonies, and so they are as the offering of swines’ blood and the slaying of a man; and so abomination to God, Isa. 66:3.

2. The Holy Spirit is merited to us by Christ, Jn. 16:14, “He shall receive of mine and show unto you”: but who can say that the grace of joy in the Holy Ghost, wrought by the droning of organs and the holiness taught by surplice, is a work of the spirit merited by Christ as our High Priest?

3. God has made no promise that He will work by ceremonies, for the Spirit works not without the Word; so then I might resist the working of the Spirit and not sin against the Word; and this is Anabaptists’ Enthusiasm: If God work not by them, they be vain and fruitless; and the idol is unlawful for this [reason], that ‘it profits not’. Also, the Spirit’s action is either natural or supernatural here: If natural, it is a natural work, and a natural spirit, and to be rejected: If supernatural, we may devise means to produce supernatural effects: men’s ceremonies can produce supernatural joy, comfort, peace, and acts of grace purchased to us by Christs merit; this is a miracle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), Question 3, ‘Whether Ceremonies Have any Divinity in Them’, p. 136</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b43667675b" data-kw="">
<blockquote><p>5. It is observed, that David’s psalms were sung formerly with musical instruments, as the harp, timbrel, and cymbal, and organs; and why not with these now? If these are to be disused, why not singing itself? I answer, these are not essential to singing, and so may be laid aside, and that continue; it was usual to burn incense at the time of prayer, typical of Christ’s mediation, and of the acceptance of prayer through it; that is now disused; but prayer being a moral duty, still remains: the above instruments were used only when the church was in its infant-state, and what is showy, gaudy, and pompous, are pleasing to children; and as an ancient writer observes, “these were fit for babes, but in the churches (under the gospel-dispensation, which is more manly) the use of these, fit for babes, is taken away, and bare or plain singing is left.” As for organs… were first introduced by a pope of Rome, Vitalianus, and that in the seventh century, and not before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Body of Doctrinal &amp; Practical Divinity</cite>, vol. 3, ‘Of Singing Psalms As A Part of Public Worship’ (London, 1796), p. 384</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

that%20in%20the%20seventh%20century%2C%20and%20not%20before" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e600bb499b" data-kw="">
<blockquote><p>Concerning Musical Organs It is certain that in the ancient church and in Solomon’s temple, the use of musical instruments was accepted. Now that Christ has come, and together with the ancient priesthood and sacrifice and the representation appertaining to the Law, the use of instruments in churches has vanished like a shadow. For the various instruments of the musicians symbolized the parts and members of the elect, i.e., that the elect must worship the Lord with heart, soul, word and in every way. Thus David mentions every kind of instrument so that man may glorify God with all his strength, mind and members. He must speak and sing in the assembly with delight from the soul. For Paul would not only disapprove of the use of crude instruments, but does not permit in the church incomprehensible human words and singing that lacks edifying force; indeed, he calls them mindless that teach and sing in the assembly like barbarians in unfamiliar languages (1 Cor. 14). The fathers teach the same. There is not so much as a reference to the organ in the New Testament, nor of its introduction into the purer church; but it was only introduced in theatrical Masses, as if in obscene sport, by immoral priests to make clowns cut capers. The papal chronicles attribute its introduction to Pope Vitalian [†672]. The resolutions of the councils, together with Jerome, condemn the stentorian noise in churches of persons shouting in theatrical fashion (Amos 5, 6). In the prophets, the Lord prohibits the playing of the harp and organs, and commands that teaching be done with the human voice, not with shadows and tricks. Therefore, they do wrong that mumble foolishly before God the canonical hours as if superstitiously chattering to themselves something of merit in the process, and who keep an organ in the sacred assembly like papists and others. What my father has not planted will be rooted out (Matt. 15:13)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hungarian-confessio-catholica.html">Hungarian Confessio Catholica</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Hungarian Confessio Catholica</cite>, 1562 | ed. Dennison, Jr., Reformed Confessions of the 16th and 17th Centuries in English Translation (RHB), vol. 2, pp. 565-66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-079c9d00ef" data-kw="">
<blockquote><p>The Jewish way under the law of praising the Lord was upon the timbrel, the harp, psaltery, and ten-stringed instruments, and other instruments of music that belonged to ceremonial worship that is now abolished. Christ, who is the end of the law, has torn or taken away the ceremonies of the law, and there is no warrant now to make use of the organs, as they do in the Popish Church, and in the Prelatical Church of England, and even among them that are more reformed, those over in Holland. Oh, but we have a great advantage in being free of these! But there are some in the other extreme, that are for no music at all, but we are to sing and praise vocally, and with the heart too. This reproves Quakers, who make a mock at singing of psalms. But we will let them see a fine ancient warrant for vocal music. “And be not drunk with wine… speaking to yourselves in psalms, hymns, and spiritual songs, making melody in your hearts to the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cameron.html">Richard Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Lecture 2’ on Ps. 92, in Sermons Delivered in Times of Persecution in Scotland</cite></span></figcaption>

</figure><figure class="quote" id="q-b7320d7710" data-kw="">
<blockquote><p>If the Divine BEING, by reason of their Childishness in which they then were, did allow ‘em to offer Sacrifices; why do you wonder that he also allowed ‘em that Musick which is performed by the Harp and Psaltery?</p></blockquote>

<main class="wrap"><figure class="quote" id="q-68359dbab2" data-kw="">
<blockquote><p>[R]eligious joy is greatly promoted by deep meditation, joined with active usefulness. These are united, because either is incomplete without the other, and together they produce a happy consummation. In secret the truth of God should be deeply and carefully contemplated; and as the heart is melted and inflamed by study, corresponding labours should be undertaken.

Mere study, without labour, is apt to induce a contemplative habit—agreeable, indeed, to the subject of it, but not useful to others; while activity, unaccompanied with deep meditation, is apt to degenerate into mere formality or vain-glory. When united, the principle and practice go together, and they mutually confirm and strengthen one another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-morgan.html">James Morgan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fruit of the Spirit – Joy in Christian Miscellany</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-355accd44f" data-kw="">
<blockquote><p>If a sinner, being justified, has all things at once that are necessary for salvation? And if personal holiness, and progress in holy obedience, is not necessary to a justified persons’s possession of glory, in case of his continuing in life after his justification? …[F]or though the believer’s progress in holy obedience, by reason of the many stops interruptions, and assaults he frequently meets with from Satan, the world, and in-dwelling corruption, is far from being alike at all times, yet ‘the path of the just,’ though he frequently fall, will be ‘as the shining light, that shineth more and more unto the perfect day.’ Though he may, at time ‘become weary and faint in his mind,’ yet he shall he, by waiting on the Lord, ‘renew his strength, and mount up as with eagles’ wings,’ &amp;c. But still the believer has all this in and from Christ: for whence can our progress in holiness come, but from the supply of his Spirit? Our walking in holy obedience, and every good motion of ours, must be in him, and from him, who is the Way and the Life, who is our head of influences, and the fountain of our strength, and who ‘works in us both to will and to do.’ ‘Abide in me,’ says he ‘and I in you. For without me ye can do nothing. If a man abide not in me, he is cast forth as a branch, and is withered.’ But if the meaning of the query be, of such a necessity of holy obedience, in order to the possession of glory, as imports any kind of causality, we dare not answer in the affirmative; for we cannot look on personal holiness, or good works, as properly federal and conditional means of obtaining the possession of heaven, though we own they are necessary to make us meet for it. These answers, contained in this and the preceding pages, (viz. of the manuscript given in,) are subscribed at Edinburgh, March 12th, 1722, by us, James Hog, Carnock. Thomas Boston, Etterick. John Williamson, Inveresk. James Kid, Queensferry. Gabriel Wilson, Maxton. Ebenezer Erskine, Portmoack. Ralph Erskine, Dunfermline. James Wardlaw, Dunfermline. Henry Davidson, Galashiels. James Bathgate, Orwel. William Hunter, Lillieslead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, ed. Thomas Boston (Scotland, UK: Christian Focus Publications, repr. 2009), 358, 376.</span></figcaption>

</figure><figure class="quote" id="q-1de1276527" data-kw="">
<blockquote><p>Obj. 4. Further, In the Old Law God was praised with musical instruments and human song, according to Ps. 32:2, 3: “Give praise to the Lord on the harp, sing to Him with the psaltery, the instrument of ten strings. Sing to Him a new canticle.” But the Church does not make use of musical instruments, such as harps and psalteries, in the divine praises, for fear of seeming to imitate the Jews. Therefore in like manner neither should song be used in the divine praises. On the contrary, Blessed Ambrose established singing in the Church of Milan, as Augustine relates (Conf. ix.). Reply Obj. 4. As the Philosopher says (Polit. viii.), Teaching should not be accompanied with a flute or any artificial instrument such as the harp or anything else of this kind: but only with such things as make good hearers. For suchlike musical instruments move the soul to pleasure rather than create a good disposition within it. In the Old Testament instruments of this description were employed, both because the people were more coarse and carnal—so that they needed to be aroused by such instruments as also by earthly promises—and because these material instruments were figures of something else.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, trans. Fathers of the English Dominican Province (Bellingham, WA: Logos Bible Software, 2009), 2a.2ae.91.</span></figcaption>

target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-b0c7e74abf" data-kw="">
<blockquote><p>Also whatever is a profession in fact, of a false religion by ceremonies indifferent, and yet proper to a false religion, is a denying of the true religion; but the using of these ceremonies, used by Papists and Jews is such; Therefore… The proposition [above] is Scripture, Gal. 2:14, Peter lived after the manner of the Jews in using the religious materials of the Jews, though he had no Jewish intention or opinion; yea, Acts 10, he disputes against that: So circumcision, Gal. 6:14-15, is put for the Jewish Church. Now altars, organs, Jewish ephods, or surplice, Mass-clothes, and Romish crossing, bowing to altars, images, are badges of Jewish and Popish religion:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), Question 3, ‘Whether Ceremonies Have any Divinity in Them’, pp. 142-143</span></figcaption>

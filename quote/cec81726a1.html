<blockquote><p>In Psalm 68:31 we read, “Ethiopia [or Cush] shall soon stretch out her hands unto God.” The early Seceder, Ebenezer Erskine, interpreted this text as a prediction that the Gentile nations, including those in Africa, would enter into covenant with God:

The words read … are a declaration of the success of the gospel among the Gentile nations. Ethiopia, Egypt, and other places of the world, would submit unto his royal sceptre, when it should be swayed among them in the dispensation of the gospel, Princes shall come out of Egypt, Ethiopia shall soon stretch out her hands unto God. …

From which it appears, that Ethiopia, Scotland, and all the Gentile nations, and every individual among them is, by nature, in a most dismal and deplorable condition, without God, the chief good, without Christ, the only Saviour, without hope of salvation, without the true church, where life and immortality alone is brought to light; without God’s covenant of promise, which is the only charter of salvation; under the power of sin and Satan, the great enemy of their salvation; and, consequently, in a state of hostility against God. …

Lastly, This phrase of stretching out the hand to God implies an open profession of the faith in Christ, before the world, angels, men, and devils, which is sometimes called in Scripture an avouching of the Lord to be our God; and is sometimes done there by a person or people, with the solemnity of lifting up the hand, an ancient form of swearing, Rev. x. 5, 6, when the angel swore by him that liveth for ever and ever, he doth it with his hand lifted up to heaven.

So here, Ethiopia shall soon stretch out her hands unto God, that is, the inhabitants of Ethiopia, and of the Gentile nations, shall openly profess the God and Father of our Lord Jesus Christ to be their God, and they shall do it with the solemnity of an oath or covenant, as Israel they shall do it with the solemnity of an oath or covenant, as Israel did, Josh. xxiv. 22. When Joshua told them, “Ye are witnesses against yourselves, that ye have chosen you the Lord, to serve him.” And in this manner have we, in this land, and neighbouring nations, lifted up our hand to God, declaring him to be our God, and ourselves to be his people, although, alas! these covenants have been scandalously broken, burnt, and in a great measure buried. …

See from this doctrine, wherein the essence either of personal or national covenanting with God doth consist. Why, it just lies in following the example of Ethiopia, which stretched out the hand unto God, in a way of faith and solemn profession, that the God of Christ shall be their God, and that the Father of Christ shall be their Father; and that in the strength of the grace that is in Jesus, promised in a new covenant of grace, they will cleave unto him by a personal holy walk and conversation; and that, through grace, they will cleave unto the doctrine, discipline, worship, and government, that he has appointed in his house, in his holy oracles.

It must be a strange kind of spirit, that either sets his people on edge against such covenants, or turns them to an indifferency about the public work and cause of Christ, as if it were not worth the contending for, or suffering for. When God commands us to “contend for the faith delivered to the saints,” Jude iii., and to “stand fast in the liberty wherewith Christ hath made us free,” Gal. v. 1. It appears evidently to be a plot of hell for burying a testimony for our solemn covenants, and for the reformation of Scotland, and for our encouraging judicatories to go on in their course of backsliding from the Lord, and his work and way.</p></blockquote>

<blockquote><p>While all duties are commanded in the law, all privileges and blessings are offered in the gospel. While the former are required of all, the latter are presented to all. Christ and all the blessings of His great salvation are in the gospel offered freely, fully, presently, and particularly, and that to sinners of mankind in common; and as they are offered, so must they be received by sinners. The ministers of the gospel are authorized by the Lord Jesus to “preach the gospel to every creature” (Mark 16:15)—that is, to publish the full and free offer of Himself and of His righteousness and salvation to every rational creature, every son and daughter of Adam to whom they may have access to speak. And it is, indeed, good tidings of great joy which shall be to all people that “unto us” sinners of the human race this “child is born,” this “son is given” (Isa. 9:6). The receiving of Christ by faith supposes a previous offering or giving of Him to hearers of the gospel in order to afford them a warrant to receive Him. As the raining of the manna about the camp of Israel in the wilderness is called a giving of it prior to their eating of it, so the gospel offer of Christ is styled a giving of Him previous to a sinner’s reception of Him by faith (John 6:31–32). Indeed, it is as necessary a part of the glorious plan of salvation by Jesus Christ that He be given in offer before believing as that He be given in possession in and after believing.</p></blockquote>

<blockquote><p>Q. What are the false grounds of the Lord’s making the Covenant of Grace?

A. There are two bastard grounds devised by Arminians. 1. Because the Covenant of Works cannot oblige both to active and passive obedience, but to one of them only (say they) and the Covenant of Works was so rigid, that God could not follow it out, and cast infants in hell for a sin which is theirs, only by imputation, and was pardoned to the first man that committed it. Therefore he was necessitated to make a Covenant of Grace with all mankind, none excepted. But the Covenant of Works is broken, and can now be a way of Justification and salvation to none, but yet it obliges all. And sin cannot make us lawless, for the spiritual Law is of an eternal obligation.

2. They that never heard of Christ, perish by the Law, and not by the Covenant of Grace of which they never heard, and the Gospel is written in the heart of none. 3. The first Covenant was holy and spiritual, and God should unjustly threaten death upon infants, if they be not guilty of eternal condemnation, as Arminius, disp. pub. 7. th. 16.3. and the Scripture saith, infants are guilty of this sin, Eph. 2.3. Rom. 5. Psal. 51.5. Job 14.4. As also Christ must not have died for the sins of Infants, if there be no sin in them, they need not the ransom of Christ’s Blood.

The other bastard ground is, the natural antecedent desire and love of God to have all saved, moved him (say they) to make this Covenant of Grace with all. But this makes away free-grace, and changes God as the blind Talmud, which saith God hath a secret place in which he afflicts himself, because he burnt the Temple, and delivered the Jews to captivity. As also, the Lord remembering the captivity of the Jews, and their desolation, he powers out two tears every day in the Sea or Ocean, and for grief, smites his breasts with both his hands. And the Alcoran saith, that God and the Angels wish well to Mahomet, but cannot free him from death. So made the Heathen their Jupiter to deplore the destinies which he could not amend. And what is this, but to say, God hath passionate desires to have all, Elect, and Reprobate, Men, and Angels, to obey and be eternally saved, but he cannot help the matter; and therefore must upon the same account, be sorrowful and mourn that he cannot get all saved, which destroys the power of grace and restrains the outgoings of free-love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The covenant of life opened, or, A treatise of the covenant of grace</cite>, (Edinburgh: Robert Brown, 1655), 1.10, pp 56-57.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Q. What are the false grounds of the Lord’s making the Covenant of Grace?

A. There are two bastard grounds devised by Arminians. 1. Because the Covenant of Works cannot oblige both to active and passive obedience, but to one of them only (say they) and the Covenant of Works was so rigid, that God could not follow it out, and cast infants in hell for a sin which is theirs, only by imputation, and was pardoned to the first man that committed it. Therefore he was necessitated to make a Covenant of Grace with all mankind, none excepted. But the Covenant of Works is broken, and can now be a way of Justification and salvation to none, but yet it obliges all. And sin cannot make us lawless, for the spiritual Law is of an eternal obligation.

2. They that never heard of Christ, perish by the Law, and not by the Covenant of Grace of which they never heard, and the Gospel is written in the heart of none. 3. The first Covenant was holy and spiritual, and God should unjustly threaten death upon infants, if they be not guilty of eternal condemnation, as Arminius, disp. pub. 7. th. 16.3. and the Scripture saith, infants are guilty of this sin, Eph. 2.3. Rom. 5. Psal. 51.5. Job 14.4. As also Christ must not have died for the sins of Infants, if there be no sin in them, they need not the ransom of Christ’s Blood.

</figure><figure class="quote" id="q-5c95a48cd0" data-kw="">
<blockquote><p>To be a God unto thee. In this single word we are plainly taught, that this was a spiritual covenant, not confirmed in reference to the present life only; but one from which Abraham might conceive the hope of eternal salvation, so that being raised even to heaven, he might lay hold of solid and perfect bliss. For those whom God adopts to himself, from among a people—seeing that he makes them partakers of his righteousness and of all good things—he also constitutes heirs of celestial life. Let us then mark this as the principal part of the covenant, that He who is the God of the living, not of the dead, promises to be a God to the children of Abraham. It follows afterwards, in the way of augmentation of the grant, that he promises to give them the land. I confess, indeed, that something greater and more excellent than itself was shadowed forth by the land of Canaan; yet this is not at variance with the statement, that the promise now made was an accession to that primary one, ‘I will be thy God.’ Now, although God again affirms, as before, that He will give the land to Abraham himself, we nevertheless know, that Abraham never possessed dominion over it; but the holy man was contented with his title to it alone, although the possession of it was not granted him; and, therefore, he calmly passed from his earthly pilgrimage into heaven. God again repeats that He will be a God to the posterity of Abraham, in order that they may not settle upon earth, but may regard themselves as trained for higher things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 1.450.</span></figcaption>

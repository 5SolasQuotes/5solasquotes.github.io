<main class="wrap"><figure class="quote" id="q-a7deb7955d" data-kw="">
<blockquote><p>But our [prelate] doctors will have the commandments-positive of men to stand [upon the Church of Scotland], and the commandments of God, which are expressly of the law of nature to fall before their Dagon, and to lose all obligatory power, whereas God’s own positive-law yields, and loses obligatory power, when God’s natural commandment of mercy comes in competition with it, as is clear as the noon-day, in David famishing, who eat[s] the showbread, which by a positive law, was not lawful to any save the priests only, to eat, yet must man’s law stand and God’s law of nature fall at the pleasure of these Doctors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646), Appendix, ‘An Introduction to the Doctrine of Scandal’, Question 3</cite>, p. 32</span></figcaption>

</figure><figure class="quote" id="q-9e2bfe81dd" data-kw="">
<blockquote><p>We indeed know that repudiation [divorce], properly speaking, had never been allowed by God; for though it was not punished under the [Mosaic] Law, yet it was not permitted. It was the same as with a magistrate, who is constrained to bear many things which he does not approve; for we cannot so deal with mankind as to restrain all vices. It is indeed desirable, that no vice should be tolerated; but we must have a regard to what is possible. Hence Moses has specified no punishment, according to the heinousness of the crime, if one repudiated his wife; and yet it was never permitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Mal.</cite>, 2:16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-d217a63508" data-kw="">
<blockquote><p>Objection. But do not the laws of men in authority bind the conscience? Answer. Not by themselves and primarily, but secondarily by participation, with the Law of God which does immediately and of itself bind the conscience; as water does make hot and scald sometimes, not of itself, but as it participates in the heat of fire, which immediately from the nature of it makes hot. If they command anything repugnant to God’s Word we may disobey it, and not sin: provided that our denial of obedience come from conscience of God’s will, and not from want of due subjection in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-bayne.html">Paul Bayne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Help to True Happiness, or a Brief &amp; Learned Exposition of the Main &amp; Fundamental Points of Christian Religion (London, 1618), pt. 1, question 3</cite>, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-8ac8089445" data-kw="">
<blockquote><p>But I consider that there is a wide difference between the case of a congregation or society in which the right [of ladies to vote for ecclesiastical officers] had been recognized, at least tacitly and by practice, and the case of another congregation or society which had never recognized it, but had uniformly acted on a different principle. In the latter case, I would think it my duty to continue the common practice, not only because it had been the custom, but also because I looked on it as well-founded. And if any individuals should complain that they were denied their rights, I would say to them, ‘You are not denied any rights which were ever recognized in the body of which you are members; and provided you think that the right of election is too much circumscribed by its laws or usages, the least thing that is incumbent on you is, to wait until you can obtain a rectification of the supposed evil in a regular way, and, in the meantime, to show me and those whose province it is to authorize the alteration, that our present practice and mode of management is faulty and unscriptural.’ … It is generally allowed that when he refers to ‘nature itself’, he means to include custom, which is in many cases the best expounder of those principles and feelings which are natural to man, and recognized by those who are unenlightened by divine revelation; and by the manner in which he appeals to it, the apostle teaches us that there is a regard due to such dictates even in what relates to the Church; as we are taught by several places of the New Testament, that, from inadvertence or from other causes, Christians and Christian Churches may fall into opinions and practices, which those who had only nature’s dim lamp to guide them avoided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Right of Females to Vote in the Election of Ministers and Elders’, pp. 3, 5 from Miscellaneous Writings, Chiefly Historical (1841)</cite>, pp. 669-76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

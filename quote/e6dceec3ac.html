<main class="wrap"><figure class="quote" id="q-e6dceec3ac" data-kw="">
<blockquote><p>2. Yet every error or difference in judgment about points wherein learned and godly men may differ, and which subverts not the faith, nor is destructive to godliness, or when persons, out of conscience, do not come up to the observation of all these rules, which are or shall be established by authority for regulating the outward worship of God and government of his Church, the censure of [greater] excommunication should not be inflicted for such causes. See [James] Durham on Scandal. The letter from the Assembly of Divines at Westminster, with the answer of our General Assembly 1645.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-steuart-of-pardovan.html">Walter Steuart of Pardovan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collections &amp; Observations Concerning the Worship, Discipline, and Government of the Church of Scotland (Edinburgh, 1770), Book IV, Title VI, ‘Of the Order Proceeding to [Greater] Excommunication’, Section 2, p. 234. See also the whole of Title VI.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>
<div class="actions"><button class="copy" data-copy="“2. Yet every error or difference in judgment about points wherein learned and godly men may differ, and which subverts not the faith, nor is destructive to godliness, or when persons, out of conscience, do not come up to the observation of all these rules, which are or shall be established by authority for regulating the outward worship of God and government of his Church, the censure of [greater] excommunication should not be inflicted for such causes. See [James] Durham on Scandal. The letter from the Assembly of Divines at Westminster, with the answer of our General Assembly 1645.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f8559dcad1" data-kw="">

<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>
<div class="actions"><button class="copy" data-copy="“They excommunicate not for light faults and trifles, as the liar says: our discipline says the contrary.”

— Samuel Rutherford, Lex Rex... (1644; Edinburgh: Ogle, 1843), p. xxiii">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+excommunicate+not+for+light+faults+and+trifles%2C+as+the+liar+says%3A+our+discipline+says+the+contrary.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex...+%281644%3B+Edinburgh%3A+Ogle%2C+1843%29%2C+p.+xxiii&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff8559dcad1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f8559dcad1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-excommunication/#:~:text=They%20excommunicate%20not%20for%20light%20faults,says%3A%20our%20discipline%20says%20the%20contrary." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9095db9731" data-kw="">
<blockquote><p>2. Some sins may be of so heinous scandal, that if the person repent of them this day, his absolution and reception may be delayed till the scandal be removed: 1. Because the public good is to be preferred before any man’s personal good. 2. And the Churches, or enemies about, cannot so suddenly know of a man’s repentance. If they hear of a man’s murder, perjury or adultery today, and hear that he is absolved tomorrow, they will think that the Church consists of such, or that it makes very light of sin. Therefore the ancient Churches delayed and imposed penances, partly to avoid such scandal. 3. And partly because that some sins are so heinous that a sudden profession is not a sufficient evidence of repentance, unless there be also some evidence of contrition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Question 94, ‘For what sins may a man be denied communion or [be] excommunicated? Whether for impenitence in every little sin? Or for great sin without impenitence?’ in A Christian Directory: a Sum of Practical Theology and Cases of Conscience (1673), pt. 3</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>
<div class="actions"><button class="copy" data-copy="“2. Some sins may be of so heinous scandal, that if the person repent of them this day, his absolution and reception may be delayed till the scandal be removed: 1. Because the public good is to be preferred before any man’s personal good. 2. And the Churches, or enemies about, cannot so suddenly know of a man’s repentance. If they hear of a man’s murder, perjury or adultery today, and hear that he is absolved tomorrow, they will think that the Church consists of such, or that it makes very light of sin. Therefore the ancient Churches delayed and imposed penances, partly to avoid such scandal. 3. And partly because that some sins are so heinous that a sudden profession is not a sufficient evidence of repentance, unless there be also some evidence of contrition.”

</figure><figure class="quote" id="q-30aacc52e1" data-kw="">
<blockquote><p>…asking the General Assembly to take such action in the case of members of the Church who remove, without certificate, or who fail, for a length of time, to attend upon the ordinances of the gospel, as will secure constitutional and uniform action throughout the Presbyterian churches… It [a session or presbyterial court] can do what it pleases, as a Church court, provided it infringes on no article of its contract with other courts, and on no principle of the Word of God. It has no need therefore to go to the General Assembly to ask power to do what from its very nature as a Church court it has the right to do. A session must have a right to say who are the members of the church over which it presides. It might as well ask for power to erase from its roll the names of the dead, as to seek authority to say that those who have left them and wandered off no one knows where, have left them, and are no longer under their watch and care… According to our view the sessions have all the power they need in this matter inherent in themselves…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions in Church Polity… (NY: Scribner’s Sons, 1878), pt. 2, ch. 12, section 1, ‘The Session says who are church members’ (1850)</cite>, pp. 190-91</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

</figure><figure class="quote" id="q-6668ee5356" data-kw="">
<blockquote><p>Nor do we put that necessity on the sacraments, but where the man is excluded from the sacraments, for such a sin as if he repent not, he is excluded from salvation; it concerns him much to think it a weighty judgment to be excluded from the seals.</p></blockquote>

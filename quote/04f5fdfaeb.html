<main class="wrap"><figure class="quote" id="q-04f5fdfaeb" data-kw="">
<blockquote><p>We must distinctly understand, that neither here nor elsewhere does the Lord Jesus overthrow the obligation of the fourth commandment. Neither here nor elsewhere is there a word to justify the vague assertions of some modern teachers, that “Christians ought not to keep a Sabbath,” and that it is “a Jewish institution which has passed away.”

The utmost that our Lord does, is to place the claims of the Sabbath on the right foundation. He clears the day of rest from the false and superstitious teaching of the Jews, about the right way of observing it. He shows us clearly that works of necessity and works of mercy are no breach of the fourth commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on the Gospels: John, Volume One</cite>, (1869; Edinburgh: Banner of Truth, 1987), p. 279.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-27e7cc0633" data-kw="">
<blockquote><p>The question is not whether reason is the instrument by which or the medium through which we can be drawn to faith. For we acknowledge that reason can be both: the former indeed always and everywhere; the later with regard to presupposed articles. Rather the question is whether it is the first principle from which the doctrines of faith are proved; or the foundation upon which they are built, so that we must hold to be false in things of faith what the nature light or human reason cannot comprehend. This we deny. . . . If reason is the principle of faith, then first it would follow that all religion is natural and demonstrable by natural reason and natural light. Thus nature and grace, natural and supernatural revelation would be confounded. . . . A ministerial and organic relation is quite different from a principial and despotic. . . . We must observe the distinction between an instrument of faith and the foundation of faith. . . . The Lutherans falsely object to us that we hold reason to be the principle and rule of demonstration in controversies because we sometimes draw arguments from reason, and argue from reason against the ubiquity of Christ’s body. For we assign to reason only a ministerial and instrumental, not a principal office. And if, in compound questions, we use reason for the purpose of proof, it bears the relation not of a principle but of means from which theologian argues; and the are not with us primary arguments, but only secondary and auxiliary forces. Besides, while theologian uses arguments drawn from reason, he does it rather as a philosopher rather than as a theologian. As to the ubiquity of the body of Christ, we reject this doctrine both philosophically and theologically, because it is absurd and contradicts the first principles of theology and philosophy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.8.4, 5, 6, 24</span></figcaption>

hy.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+1.8.4%2C+5%2C+6%2C+24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F27e7cc0633.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/27e7cc0633.html">Permalink</a><a class="src" href="https://heidelblog.net/2013/04/reason-is-not-the-principium-but-instrument-of-faith/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-b5d3fe3556" data-kw="">
<blockquote><p>A corrupt and wicked life argues a man to be a stranger to God, and God him; for otherwise a man might draw nigh to God, and have unclean hands too, which the Text [James 4:8] supposes that it cannot be. That power which draws a man into acquaintance with God, doth proportionably kill sin.

That power which flows from God in acquaintance with a man, kills sin too: whether I go out to the sun, or the sun come in to me, the darkness is expelled: sin hath not dominion over them that are under grace, Rom. 6. 14. the knowledge of God sets a man loose from his bondage to the enslaving lusts he before served, ye shall know the truth, and the truth shall make you free, John 8. 32. draw nigh to God, and be unclean if you can. That faith which is uniting to Christ, is a purifying faith; rebellion against the Commandments of God, is inconsistent with communion with God; you may fast, and pray, and ask, that you may consume upon your lusts, ver. 4. like a cutpurse in a Church, who comes not thither to seek God, but his prey.

They that draw nigh to God, must cleanse their hands; I will wash mine hands in innocency, so will I compass thine Altar, O Lord, Psal. 26. 6. Where you may observe, that thanksgivings and praises, which the Psalmist calls sacrifices of shouting, or loud music, Psal. 27. 6. and wherein they used (as one saith) … are to be performed with washen hands: so in your prayers, the Lord requires that you should lift up pure hands, 1 Tim. 2. 8. and what a sweet reflection may you make upon your deliverances which are wonderful, when you can say, I was upright with God, and I kept my self from mine iniquity? Therefore hath the Lord recompensed me according to my righteousness, according to the cleanness of my hands in his eye-sight, Psal. 18. 23, 24.

If ye fall into straits, and be plunged into depths of misery; If your face be foul with weeping, and on your eye lids be the shadow of death; what a lifting up of the head will it be unto you, to be able to say, Not for any injustice in my hands? Job. 16. 17. If the Lord shall deliver this Island from the oppression and injustice under which it hath groaned; what a crown and comfort will it be to you, that it is delivered by the pureness of your hands? Job. 22. 30.

To conclude. If there be a frustration of our counsels, and our endeavours bring forth nothing but wind; You shall find the reason why God makes all void and ineffectual, Isa. 59. 6. Their webs shall not become garments, neither shall they cover themselves with their works; Their works are works of iniquity, and the act of violence is in their hands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The purifying of unclean hearts and hands: opened in a sermon preached before the Honourable House of Commons, at their solemn fast, January 28. 1645 in Margaret’s Westminster</cite>, (London: Abel Roper, 1646), pp 9-10.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

ith+God%2C+and+I+kept+my+self+from+mine+iniquity%3F+Therefore+hath+the+Lord+recompensed+me+according+to+my+righteousness%2C+according+to+the+cleanness+of+my+hands+in+his+eye-sight%2C+Psal.+18.+23%2C+24.%0A%0AIf+ye+fall+into+straits%2C+and+be+plunged+into+depths+of+misery%3B+If+your+face+be+foul+with+weeping%2C+and+on+your+eye+lids+be+the+shadow+of+death%3B+what+a+lifting+up+of+the+head+will+it+be+unto+you%2C+to+be+able+to+say%2C+Not+for+any+injustice+in+my+hands%3F+Job.+16.+17.+If+the+Lord+shall+deliver+this+Island+from+the+oppression+and+injustice+under+which+it+hath+groaned%3B+what+a+crown+and+comfort+will+it+be+to+you%2C+that+it+is+delivered+by+the+pureness+of+your+hands%3F+Job.+22.+30.%0A%0ATo+conclude.+If+there+be+a+frustration+of+our+counsels%2C+and+our+endeavours+bring+forth+nothing+but+wind%3B+You+shall+find+the+reason+why+God+makes+all+void+and+ineffectual%2C+Isa.+59.+6.+Their+webs+shall+not+become+garments%2C+neither+shall+they+cover+themselves+with+their+works%3B+Their+works+are+works+of+iniquity%2C+and+the+act+of+violence+is+in+their+hands.%E2%80%9D%0A%0A%E2%80%94+Richard+Vines%2C+The+purifying+of+unclean+hearts+and+hands%3A+opened+in+a+sermon+preached+before+the+Honourable+House+of+Commons%2C+at+their+solemn+fast%2C+January+28.+1645+in+Margaret%E2%80%99s+Westminster%2C+%28London%3A+Abel+Roper%2C+1646%29%2C+pp+9-10.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb5d3fe3556.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b5d3fe3556.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/09/14/richard-vines-on-cleansing-our-hands/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

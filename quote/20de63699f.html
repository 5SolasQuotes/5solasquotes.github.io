<main class="wrap"><figure class="quote" id="q-20de63699f" data-kw="">
<blockquote><p>Thus ye see Jesus Christ is either the subject of all in the scriptures, or the end of it all. He is the very proper subject of the gospel. Paul knew nothing but Christ crucified in his preaching; and he is the very end and scope “of the law for righteousness,” Rom. 10.3. All the preaching of a covenant of works, all the curses and threatenings of the Bible, all the rigid exactions of obedience, all come to this one great design; not that we set about such a walking to please God, or do something to pacify him, but that we being concluded under sin and wrath on the one hand, and an impossibility to save ourselves on the other hand, Gal. 3.22, Rom. 5.20, 21, may be pursued unto Jesus Christ for righteousness and life, who is both able to save us, and ready to welcome us.

Therefore the Gospel opens the door of salvation in Christ, the law is behind us with fire and sword, and destruction pursuing us; and all for this end, that sinners may come to him and have life. Thus the law is made the pedagogue of the soul to lead to Christ; Christ is behind us, cursing, condemning, threatening us, and he is before with stretched-out arms ready to receive us, bless us, and save us, inviting, promising, exhorting to have life. Christ is on Mount Sinai, delivering the law with thunders, Acts 7.38; and he is on the Mount Zion, in the calm voice; he is both upon the mountain of cursings and blessings, and on both doing the part of a mediator, Gal. 3.19,20.

It is love that is in his heart which made him first cover his countenance with frowns and threats; and it is love that again displays itself in his smiling countenance. Thus souls are enclosed with love pursuing and love receiving; and thus the law, which seems most contrary to the Gospel, testifies of Christ. It gives him this testimony, that except salvation be in him, it is nowhere else.

The law says, It is not in me, seek it not in obedience; I can do nothing but destroy you, if you abide under my jurisdiction. The ceremonies and sacrifices say, If you can behold the end of this ministry,—if a veil be not upon your hearts, as it was upon Moses’ face, (2 Cor. 3. 13.) you may see where it is; it is not in your obedience, but in the death and suffering of the Son of God whom we represent. Then the Gospel takes all these coverings and veils away and gives a plain and open testimony of him: There is no name under heaven to be saved by, but Christ’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism</cite>, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 48-49.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5ff5aaf85c" data-kw="">
<blockquote><p>We know it was the cursed error of the Manichees and Marcionites, that the Law was only carnal, and had only carnal promises; whereas it’s evident, that the Fathers had the same faith for substance as we have. It’s true, if we take Law and Gospel in this strict difference, as some Divines do, that all the Precepts, wheresoever they are, must be under the Law, and all the Promises be reduced to the Gospel, whether in Old or New Testament; in which sense Divines then say, Lex jubet &amp; Gratia juvat; the Law commands, and Grace helps; and, Lex imperat, the Law commands, and Fides impetrat, Faith obtaineth; then the Law can have no sanction by Promise: But where can this be shewed in Scripture? When we speak of the sanction of the Law by Promise, we take it as in the administration of it by Moses, which was Evangelical; not as it was given to Adam, with a Promise of Eternal life upon perfect obedience: for the Apostle Paul’s propositions, To him that worketh, the reward is reckoned of debt; and, the doers of the Law are justified, were never verifiable, but in the state of innocency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis: or, a vindication of the moral law and the covenants, from the errors of the papists, Arminians, Socinians, and more especially, Antinomians. In XXX lectures, preached at Laurence-Jury,</cite>, London (2nd edn, London, 1647), pp 5-6.</span></figcaption>

</figure><figure class="quote" id="q-aca7e1212a" data-kw="images worship denied">
<blockquote><p>The question is not whether images may be made which ought to be valued by us (whether we regard the artist, material or antiquity, or even on account of the prototype, if he is a man of some reputation, dear to us). Rather the question is: Should any religious worship (whether called adoration or veneration) be paid to images of God and the saints made by the hand of men? Among our opponents, there is no agreement on this point, some roundly showing adoration, others however, to avoid odium, urging only veneration. But this is an empty distinction. Since religious worship is only one and does not admit of various species, it is equally such by whatever name it may be designated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9.2</span></figcaption>

<blockquote><p>Thus there is no work truly and properly good and acceptable to God which does not agree with the law and is not prescribed by it; and whatsoever is not commanded nor forbidden by it is to be considered in its own nature indifferent and left to the freedom of man, unless this freedom has been restricted by some positive law.</p></blockquote>

</figure><figure class="quote" id="q-7d61bfb3e3" data-kw="">
<blockquote><p>What is it to have other gods besides the true God? I fear upon search, we have more idolaters among us than we are aware of. (1) To TRUST in anything more than God, is to make it a god. If we trust in our RICHES, we make riches our God.… Money is his creator, redeemer, comforter: his creator, for if he has money, he thinks he is made; his redeemer, for if he is in danger, he trusts to his money to redeem him; his comforter, for if he is sad, money is the golden harp to drive away the evil spirit. Thus by trusting to money, we make it a god.… If we trust in THE ARM OF FLESH, we make it a god.… If we trust in our WISDOM, we make it a god.… If we trust in our MORALITY, we make it a god.… If we trust to our DUTIES to save us, we make them a god.… Use duty—but do not trust to it; for then you make it a god.… If we trust in our GRACE, we make a god of it. Grace is but a creature; if we trust to it we make it an idol.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“What is it to have other gods besides the true God? I fear upon search, we have more idolaters among us than we are aware of. (1) To TRUST in anything more than God, is to make it a god. If we trust in our RICHES, we make riches our God.… Money is his creator, redeemer, comforter: his creator, for if he has money, he thinks he is made; his redeemer, for if he is in danger, he trusts to his money to redeem him; his comforter, for if he is sad, money is the golden harp to drive away the evil spirit. Thus by trusting to money, we make it a god.… If we trust in THE ARM OF FLESH, we make it a god.… If we trust in our WISDOM, we make it a god.… If we trust in our MORALITY, we make it a god.… If we trust to our DUTIES to save us, we make them a god.… Use duty—but do not trust to it; for then you make it a god.… If we trust in our GRACE, we make a god of it. Grace is but a creature; if we trust to it we make it an idol.”

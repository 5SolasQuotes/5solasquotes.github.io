<main class="wrap"><figure class="quote" id="q-3d63b23ba5" data-kw="">
<blockquote><p>§5. The covenant of God with man is different than those made by men among themselves. For men make covenants for mutual benefits; however, God makes covenant for His people. Indeed, the covenant of God is nothing other than the divine declaration of the way of receiving the love of God as well as the union and communion of becoming a partaker in Him. If man makes use of this way he is in the friendship of God, or, the Creator is his own, God is his own in a personal way (Gen. 17:7), and he is one spirit with God (1 Cor. 6:17), who is one with him (John 17:21); his is . . . (the intimate fellowship of God; Ps. 25:14, compared with Job 29:4, John 14:23.) The one who is outside of the covenant is. . . (without God, Eph. 2:12). This declaration, taken from Hebrews 8:6, can rightly be called…(divine legislation sanctioned in the promises), and when it is attached to the application of the Testament or the plan of the future inheritance, (we discuss this application below in §179 and §184). . . (the legislation of the Testament) or. . . (the Testament according to the force of the Covenant and Law) is described.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summary of the doctrine concerning the covenant or testament</cite>, … (1661).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-36cb0103bc" data-kw="">
<blockquote><p>1. As love stands opposed to hatred and wrath, and enmity. Considering man as God’s creature, he was not hated of God; God hates not the work of his own hand; but considering him as a lapsed creature, as degenerated into the plant of a strange vine, after that God had created him a generous, noble plant… How suitable to us now is it to have a Savior? That is love, and who has loves, considering the aversion in the holy Divine Being from mankind as rebellious seed, a seed of evil-doers? Who could have suited us to have become a Savior unto us, but one who had a kind propension and inclination to us, inclining Him to the great work of man’s redemption and reconciliation to God, especially also considering that there could be no remission of sins without blood…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Intercourses of Divine Love betwixt Christ &amp; his Church</cite>, (London: Snowden, 1683), p. 156</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-8512b1e2d9" data-kw="">
<blockquote><p>Moreover, the chief point of all Scripture is that we should not doubt but hope, trust, and believe for a certainty that God is merciful, kind, and patient, that He does not lie and deceive but is faithful and true. He keeps His promises and has now accomplished what He had promised, handing over His only Son into death for our sins, so that everyone who believes in the Son should not perish but have eternal life (John 3:16). Here there can surely be no doubt whether God has been reconciled and is favorably disposed toward us, whether the hate and wrath of God have been removed; for He permits His own Son to die for us sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 386.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-304b498ee6" data-kw="">
<blockquote><p>And indeed, strictly speaking, there are no demands and conditions in the gospel but only promises and gifts. Faith and repentance are as much benefits of the covenant of grace as justification (and so forth).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, 4.454</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-21f5ef72eb" data-kw="">
<blockquote><p>Thus then is Christ made use of as the way to the Father in the point of justification when the poor weakened sinner, convinced of his sin and misery, of his own inability to help himself, of the insufficiency of all means beside Christ, of Christ’s all-sufficiency, readiness and willingness to help, of the equity and reasonableness of the conditions on which He is offered, and life through Him, is now content and fully satisfied with this way, actually renouncing all other ways whatsoever, and does with heart and hand embrace Jesus Christ and take Him as He is offered in the gospel to make use of Him for all things, to lean to Him and rest upon Him in all hazards; and particularly to refuge itself in his wings and to rest there with complacency, satisfaction and delight; and hide itself from the wrath of God and all accusations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Way the Truth &amp; the Life</cite>, (1677), ch. 6, How Christ is Made Use of for Justification, as a Way</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

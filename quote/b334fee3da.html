<main class="wrap"><figure class="quote" id="q-b334fee3da" data-kw="">
<blockquote><p>Even when we choose evil, we choose for the good, albeit poorly. The choice of the sinner for evil in this sense is not a choice for an alternate, competing reality that is diametrically opposed to the order of goodness. It is a poor choice— an attempt at the good that fails in ways that are both person ally and socially destructive. Understood in this way, vice is not so much an equal alternative to virtue, but a corruption and weakening of the virtus of human nature, which by its natural form is ordered to the good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-m-lynch.html">Reginald M. Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Divine Causality &amp; Human Freedom</cite>, “Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 230 Lynch is a Dominican and writes in the Thomist tradition.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/nature-of-sin.html">Nature of Sin</a></span></div>

</figure><figure class="quote" id="q-cedf944e34" data-kw="privation">
<blockquote><p>Hence it follows that the formal reason of sin consists in anomia and privation, denoting the want of the rectitude or goodness which ought to be in the rational creature according to the prescription of the law (whether it belongs to the nature or qualities or actions themselves, for it deprives all these of conformity with the law and so constitutes them guilty of sin). But this privation is not pure or simple, but corrupting; not idle, but energetic; not of pure negation, but of depraved disposition, by which not only is the due rectitude taken away, but also an undue unrectitude and a depraved quality laid down, infecting all the faculties. Just as a physical disease is not only a removal of the temper of the humors, but also a corrupt disposition and disorder (dyskrasia) of them, so sin (which holds the relation of a moral disease of the soul) is not only the negation of a good, but the position of a corrupt disposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.1</span></figcaption>

</figure><figure class="quote" id="q-813babd94c" data-kw="">
<blockquote><p>XXIV. It is asked, fifth, whether infants before all use of reason are subject to actual sin… The Cartesian theologians, because they state that the rational soul is nothing except actual thought, such as is either agreeable or repugnant to the divine law, are also compelled to state that actual sin occurs also in infants… The Reformed, although they acknowledge that original corruption is actually present in infants, from which by nature they are prone to all actual sins, and moreover bear in themselves the seeds of the same, nonetheless deny that they are properly subject to any actual sin, because: (1) Scripture teaches that they do not sin according to the similitude of Adam, that is, actually. Also because (2) Scripture calls them innocent (Ps. 106:38). For since this could not be said with regard to original sin, from which they are pronounced unclean (1 Cor. 7:14), nothing remains except that they are called innocent with regard to actual sin, inasmuch as they do not discern between their right hand and their left hand ( Jonah 4:11). (3) They are said to have done neither good nor evil (Rom. 9:11). (4) To infants as such, there is no law prescribed against which they would commit that which is against the law; they recognize no law, and thus also cannot compose themselves to any law, nor deviate from any. Nevertheless they object: (1) that the imagination of man’s heart is called evil from his youth (Gen. 8:21 with 6:5). I respond, יצר in this passage means that the shape and disposition of the heart in infants is, not from actual sins, but from original corruption, only evil, from their very infancy (Prov. 22:15). (2) That the human mind consists in actual thought, which can not only be congruent with divine law, but also repugnant to it. I respond: (1) That the human mind is a thinking substance which, with organs adequately disposed, can think, we do not doubt, just as it is a reasoning substance, not because it is always reasoning in actuality, but because it can reason, with necessary things put in place. (b) If we grant that the mind in the infant thinks in actuality, yet it does not follow from this that he actually sins, because, as we have said, the infant before all use of reason does not have prescribed to him a law which could be transgressed. Nor is it valid to say that his actual thought can be not conformable, in fact repugnant, to the law, since even a goring ox’s killing of a man is materially repugnant to the law, and yet from this that ox is not properly a murderer, and does not sin by slaying him, because there is not prescribed to it a law which would be transgressed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 4, ch. 3, ‘Actual Sin’ | section 24, p. 511-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/nature-of-sin.html">Nature of Sin</a></span></div>

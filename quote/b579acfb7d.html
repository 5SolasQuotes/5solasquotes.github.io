<main class="wrap"><figure class="quote" id="q-b579acfb7d" data-kw="">
<blockquote><p>‘God is to be worshipped in Spirit and in Truth’; no worshipping can be more true, or more spiritual than the Psalter said with a pure mind and a hearty devotion. For David was God’s instrument to the Church, teaching and admonishing us (as our duty is to each other) in psalms and hymns, and spiritual songs, and the Spirit of Truth was the Grand Dictator of what David wrote; so that we may confidently use this devotion as the Church of God ever did, making her addresses to God most frequently by the Psalms:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalter of David with Titles and Collects according to the matter of each Psalm: whereunto is added Devotions for the help and assistance of all Christian people, in all occasions and necessities (London, 1647) ‘The Preface’, no page number. Taylor (1613–1667) was a conformed cleric in the Church of England who advocated for very liturgical worship. The Preface is very good, at length, with regard to the psalms. Some of the references to ‘hymns’ refer to the psalms themselves. Taylor held to predominant psalmody.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-c802b39c4c" data-kw="">
<blockquote><p>I say, we close our prayers ordinarily with praise and glory to the Father, the Son, and the Holy Ghost; because it is warrantable from Scripture-practice, to wit, in blessing; and agreeable to the truth and liberty of Gospel-worship; and yet we refuse it in singing (mark it, not in praising), because, for that exercise, the Lord having instructed us with a sufficient plenty of Divine composures, we think it neither needful nor acceptable that we should gratify an arbitrary imposition in receiving the supplement of a human addition: It is true, the words are Scriptural, but can you say that the Scripture bears any such allowance for their use in singing as it doth for the Psalms of David? Yea and many other spiritual songs in Scripture, whereof you might indeed with some reason reprehend our too great disuse:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist… ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect.</cite>, p. 279-80</span></figcaption>

<blockquote><p>…the venerable councils of the fathers [referring to Laodicea (365) and Braga (563) above] decree that vulgar psalms should not at all be sung in the Church and that ‘nothing put together in poetic fashion’ should be employed in the divine praises. … …so that to avoid growths and errors of that kind they [‘God-fearing ones‘] cling more vigorously and more carefully to divine authority and statutes of the church. This very wholesome care for the faith and method of observance, namely, that in God’s temple and before the divine altar only the melody of divine eloquence be rehearsed, is most strongly commended to us also by the authority and examples of the Old Testament, as in the book of Chronicles where one reads that blessed David, king and prophet of God, first established in tabernacle or temple the choirs of Levites praising the Lord, and delivered to them by divine providence inspired utterances, psalms, hymns, and canticles; his own as well as those of others who prophesied along with him, and decreed that they should be sung both morning and evening amid the divine burnt offerings and sacrifices. It is fitting that this custom, handed down from the holy prophets, preserved most carefully by the fathers who came afterward, even to the time of the New Testament, when it was necessary for that temple to be destroyed, it is fitting that this custom be continued with devout reverence. It is therefore especially needful that we truly desire to celebrate the divine praises without even the least offense and hesitation. Let us apply ourselves wholly to divine words in which there is no error, no ambiguity.. … There is therefore no doubt that each instructed believer will freely assent to such holy authority and such evident truth. But if any contentious and stubborn person attempts to disagree, and should wish to drink from a muddy stream rather than from the purest spring, he should take care that he not become ill with that most ruinous debility which a certain one of the ancient fathers wisely and briefly warned should be avoided, observing that when truth has been despised the one who imagines he is complying with custom is either envious and spiteful toward the brethren to whom truth is revealed or ungrateful toward God by whose inspiration His church is set in order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/agobard-of-lyons.html">Agobard of Lyons</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Divine Psalmody c. 836 10 paragraphs</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-c555918365" data-kw="">
<blockquote><p>The apostle names three sorts of them [i.e. ‘divine canticles’], psalms, hymns, or praises, and odes, or songs… You have various examples of them all in the book of Psalms… It is with these sacred lyres, of which the word of Christ affords us both the matter and the form, that the apostle would have us solace ourselves. St. James gives us orders for it: ‘Is any among you merry? let him sings psalms,’ James 5:13. The apostle calls all these sonnets spiritual, both on account of their author, who is the Holy Spirit, and also of their matter, which concerns only divine and heavenly things, the glory of God, and our salvation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-daille.html">John Daille</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Daille (1594-1670) was a French Huguenot. Commentary on Col.</cite>, 3:16</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The apostle names three sorts of them [i.e. ‘divine canticles’], psalms, hymns, or praises, and odes, or songs… You have various examples of them all in the book of Psalms… It is with these sacred lyres, of which the word of Christ affords us both the matter and the form, that the apostle would have us solace ourselves. St. James gives us orders for it: ‘Is any among you merry? let him sings psalms,’ James 5:13. The apostle calls all these sonnets spiritual, both on account of their author, who is the Holy Spirit, and also of their matter, which concerns only divine and heavenly things, the glory of God, and our salvation…”

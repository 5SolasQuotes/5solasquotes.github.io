<main class="wrap"><figure class="quote" id="q-ea6928ec62" data-kw="">
<blockquote><p>…whereas your surplice is arbitrarily institute[d], and imposed to signify innocency, without either real foundation or sufficient warrant, wherein, whether you do more usurp against God’s prerogative to appoint sacred and mysterious signs, and that simplicity, in which he has set forth his Gospel, or be more grossly mistaken in the event and fruit of your application, is a great question? I grant that necessity or decency have introduced many things circumstantial that are rational, and consequently upon some real antecedent ground expressive of their use and end: as grave apparel in pastors, a becoming covering of pulpits, tables in sacred use, regulation of time, postures, gestures and the like, without which worship cannot be performed; But to ascribe a liberty to the Church of appointing ceremonies, having for reason of their signification, the will of the instituter, and their use only in the representation, is so manifest an impingement upon Divine authority and the sacraments thereby ordained, and has already produced such a mass of superstitious superfluity in the Romish-Church, that I much admire to find a serious person pleading for such fopperies…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … (1671), 3rd Dialogue, pp. 111-12</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d5c4fbf3c4" data-kw="">
<blockquote><p>As for those who allege some conveniency in the ceremonies, they say more than can abide the proof of reason, which the induction [enumeration] of some particulars shall demonstrate. Dr. [Thomas] Morton (Particular Defense, ch. 1, sect. 1 [1618]) alleges for the surplice that the difference of outward garments cannot but be held convenient for the distinguishing of ministers from laics [laity] in the discharge of their function. Answer: This conveniency is as well seen to without the surplice. If a man having a black gown upon him be seen exercising the function of a minister, it is very strange if any man think it not sufficiently distinguished from laics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (Naphtali Press, 1993) | Part 2, Ch. 2, p. 73</span></figcaption>

</figure><figure class="quote" id="q-ff022d37d0" data-kw="">
<blockquote><p>What if we should yield to the Bishop that kneeling [to the bread and wine in the Supper] and holidays are with us applied to another service, and used with another meaning than they are with the Papists [as is often claimed with vestments]? Does that excuse our conformity with Papists in the external use of these ceremonies? If so, J. [John] Hart did rightly argue out of Pope Innocentius, that the church does not Judaize by the sacrament of unction or anointing, because it figures and works another thing in the New Testament than it did in the Old (Rainolds, Conference with Hart, ch. 8, div. 4, p. 496). Rainolds answers, that though it were so, yet is the ceremony Jewish; and mark his reason (which carries a fit proportion to our present purpose), ‘I trust’, he says, ‘you will not maintain but it were Judaism for your church to sacrifice a lamb in burnt-offering, though you did it to signify, not Christ that was to come, as the Jews did, but that Christ is come, etc. St. Peter did constrain the Gentiles to Judaize, when they were induced by his example and authority to follow the Jewish rite in choice of meat; yet neither he nor they allowed it in that meaning which it was given to the Jews in; for it was given them to betoken that holiness, and train them up into it, which Christ by his grace should bring to the faithful. And Peter knew that Christ had done this in truth, and taken away that figure, yea the whole yoke of the law of Moses; which point he taught the Gentiles also. Wherefore, although your church keeps the Jewish rites with another meaning than God ordained them for the Jews… yet this of Peter shows that the thing is Jewish, and you to Judaize to keep them. (Ibid., p. 496 [567])</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (Naphtali Press, 1993) | Part 3, ch. 3, p. 195 This very much applies to the issue of vestments:</span></figcaption>

</figure><figure class="quote" id="q-c47959bd3f" data-kw="">
<blockquote><p>In Scotland it appears to have been the regular custom for ministers to wear a gown when conducting divine service. The cassock also was in frequent use, but this is not surprising since it was not a liturgical vestment, but the usual out-of-doors dress of the ministry. In England, however, the Puritans appear to have discarded the cassock, whilst there is little evidence to show that the early Puritans wore gowns.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horton-davies.html">Horton Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 46-48 in Ch. 4 of The Worship of the English Puritans (Soli Deo Gloria, 1997), p. 47</span></figcaption>

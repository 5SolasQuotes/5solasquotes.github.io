<main class="wrap"><figure class="quote" id="q-3bc4224d2d" data-kw="">
<blockquote><p>I hope I need not caution some in this assembly that they beware of imagining these various perfections of God, under the names of mercy, truth, righteousness and peace, as if they were really distinct and different things in God; or, as if they were really different parties, making a formal consultation, in order, to their agreement; For God is one, and cannot be divided; he is one infinite, eternal and unchangeable Being; there are not distinct and different things in his nature and essence, however his perfections be thus represented to our weak, finite capacities, which cannot understand the perfections of God but in several parts, as it were.

By mercy then, here, we are to understand God himself, as he is a merciful and a gracious God: By truth we are to understand the same God, as he is a true and faithful God: By righteousness we may understand his justice, or God himself, as he is a just and righteous God; and, by peace, the same God, as he is the God of peace, and a God reconciling the world to himself. So that the whole comes to this; it is the great and eternal God himself, consulting with himself, in a manner becoming his infinite and adorable perfections, how to glorify himself in all his glorious attributes in the way of saving sinners in and by Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The harmony of the divine attributes displayed; in the redemption &amp; salvation of sinners by Jesus Christ. Being a sermon preached at Dunfermline on the 20th of September 1723; immediately after the celebration of the Lord’s Supper</cite>, (1723; Boston: S. Kneeland and T. Green, 1748), p. 6.</span></figcaption>

<blockquote><p>§.10. Otherwise the will of God is distinguished into the will of sign [voluntas signi] and the will of good pleasure [voluntas beneplaciti]. The latter is, and is conceived as, the very complacency of God decreeing concerning the futurition of things, and approving Himself and whatever is in some manner similar to Himself. The former, which is called of sign, is indicated through some sign, and is made manifest among men: of which the will of precept is also a part. For those signs are referred to the number of five, and were formerly comprehended in this verse: He foretells, forbids, permits, commands, fulfils [Prædicit, prohibet, permittit, præcipit, implet]. §.11. Here it is inquired whether the will of precept and the will of decree do not very often conflict with one another: because what He wills by the will of precept, we often see not to come to pass, and thus it is evident from the event that God in His decree willed it not to be done. But we easily reconcile these by observing that the will of the mandate says nothing other than that God wills the obligation of the rational creature: but the will of decree, that He wills to permit a particular man not to answer to his obligation; or sometimes, if the mandate be positive, that He wills the obligation to endure for a time, until He Himself dissolves it. §.12. Those who distinguish the will of God into efficacious and inefficacious, absolute and conditional, antecedent and consequent, etc., in order to free the liberty of the will [libertas arbitrii] from all necessity of the event, labor in vain and ascribe many imperfections to God. Wherefore we acknowledge no will of decree which is not efficacious, absolute, and antecedent, as in the chapter on the decree of God we shall see that no other is to be admitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed</cite>, … (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</span></figcaption>

</figure><figure class="quote" id="q-51f48035a7" data-kw="">
<blockquote><p>XXI. God will have all men to be saved and He will have wicked men to be damned: that, is his antecedent will; this, his consequent: that, is sometimes frustrated of its end, this never; and its fitting that seeing his will cannot be fulfilled by us, it should be fulfilled upon us. They that will not satisfy his will by their obedience, shall satisfy his will in suffering just vengeance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Century of Divine Meditations upon Predestination</cite>, … (London: Young, 1646), pp. 15-16, 19, 21-23, 89-92 Ross (c. 1590–1654) was a Scottish minister and chaplain-in-ordinary to King Charles I. He was not the Aberdeen doctor of the same name.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>13. Again (2) The Scripture every where points out the end of Christ’s coming and dying to have been to procure and obtain some good to man; it were endless to cite the Scriptures speaking this out plainly: But if it had been only to have procured a possibility, then the proper and immediate end of his dying had been only to have procured something to God, viz. a power to Him, that He might, without hurt to his justice, prescribe a possible way of salvation. Now, not to discuss that question agitated among orthodox divines, viz. whether it was impossible for God to have pardoned the sins of man without a satisfaction made by his Son, or not; meaning antecedently to a decree, determining this way of manifestation of the justice of God; only I must say that as yet I can see nothing from Scripture determining the egresses of the relative justice of God to be more essential to God, and less subject to the free determinations of his good will and pleasure, than are the egresses of his mercy; nor do I see any necessity for asserting this against the Socinians, seing our ground, walking upon a decree, is proof against all their assaults; far less see I any necessity of founding our whole debate with the Socinians upon that ground; yea I cannot but judge it the result of great imprudence so to do, seeing the Socinians may reply that the sole ground of that opposition to them is not only questioned, but plainly denied by such as we account orthodox and learned; and may hence gather that we have no other solid ground whereupon to debate with them but such as the learned of our own side overthrow. The depth’s of God’s Counsel are beyond our fathoming and it is hard for us to say hithertil the omnipotent can come, but not one ince further. I dare not be wise above what is writen and I would gladly see one passage of Scripture declaring this to have been in itself utterly impossible and inconsistent with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quakerism: the Pathway to Paganism, or a View of the Quakers’ Religion, being an Examination of the Theses &amp; Apology of Robert Barclay, one of their Number</cite>, ... (Edinburgh: Cairns, 1678), ch. 8, ‘Of Universal Redemption’, p. 163 Brown was a disciple of Rutherford.</span></figcaption>

uch+as+the+learned+of+our+own+side+overthrow.+The+depth%E2%80%99s+of+God%E2%80%99s+Counsel+are+beyond+our+fathoming+and+it+is+hard+for+us+to+say+hithertil+the+omnipotent+can+come%2C+but+not+one+ince+further.+I+dare+not+be+wise+above+what+is+writen+and+I+would+gladly+see+one+passage+of+Scripture+declaring+this+to+have+been+in+itself+utterly+impossible+and+inconsistent+with+God.%E2%80%9D%0A%0A%E2%80%94+John+Brown+of+Wamphray%2C+Quakerism%3A+the+Pathway+to+Paganism%2C+or+a+View+of+the+Quakers%E2%80%99+Religion%2C+being+an+Examination+of+the+Theses+%26+Apology+of+Robert+Barclay%2C+one+of+their+Number%2C+...+%28Edinburgh%3A+Cairns%2C+1678%29%2C+ch.+8%2C+%E2%80%98Of+Universal+Redemption%E2%80%99%2C+p.+163+Brown+was+a+disciple+of+Rutherford.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F28a89c8f51.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/28a89c8f51.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-justice-of-god/#:~:text=13.%20Again%20%282%29%20The%20Scripture%20every,utterly%20impossible%20and%20inconsistent%20with%20God&amp;text=13.%20Again%20%282%29%20The%20Scripture%20every%20where%20points&amp;text=in%20itself%20utterly%20impossible%20and%20inconsistent%20with%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Hitherto we have spoken of the perfection of Gods nature: Now followeth the life of GOD, by which the Divine Nature is in perpetual action, living, and moving in it self. Psal. 42. 2. My soule thirsteth for God, even for the living God, when shall I come and appeare before the presence of God? Heb. 3. 12. See there be not at any time in any of you an evel heart to depart [note] from the living God. The divine Nature, is especially in perpetual operation by three attributes, the which do manifest the operation of God towards his creatures. These are his Wisdom, Will, and Omnipotency. The wisdom or knowledge of God, is that by the which God doth, not by certaine notions abstracted from the things themselves, but by his own essence: nor successively and by discourse of reason, but by one eternal and immutable act of understanding, distinctly and perfectly know himself, and all other things, though infinite, whether they have been or not. Mat. 11. 27. No man knoweth the son but the Father, nor the Father but the [note] Son, and he to whom the Son will reveale him. Heb. 4. 13. There is nothing created, which is not manifest in his sight: but all things are naked and open to his eyes, with whom we have to do, Psal. 147. 5. His wisdom is infinite.</p></blockquote>

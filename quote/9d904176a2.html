<main class="wrap"><figure class="quote" id="q-9d904176a2" data-kw="">
<blockquote><p>That by giving out themselves in these meetings as the generality of the godly throughout the land, or delegates in a sort from them, they do cast an imputation upon the bulk of the national Church beside, who are against their way, and do not join with them in these courses, as not only wrong in that matter, but as not godly, some very few excepted. Which as we know to be a most false imputation (not many of these, of any rank, who owned the cause from the beginning, going along with them). So it is an evidence of a strange divisive and separating spirit in our Brethren.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-sharp.html">James Sharp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A True Representation of the Rise, Progress &amp; State of the Present Divisions of the Church of Scotland</cite>, (London, 1657), p. 33</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d73f9ef76a" data-kw="">
<blockquote><p>For the work of peace, at the persuasion of some friends, he took a journey thitherward [to Lutheran Sweden], where he arrived in June, anno 1636… a resolution was taken to permit Master Dury to treat with the divines of that kingdom… to which he might address himself particularly, and lay open his intention… There he had conference both collegially and severally with the professors of divinity, who gave full assent unto his desires, and set down these conditions, upon which they were ready to agree, and join with the reformed side:

1. That a full agreement should be made in all the fundamental articles of Faith.

2. That all errors overthrowing the foundation, or tending to overthrow the same, should be condemned.

3. That in matters ceremonial and of indifferency, there should be a mutual toleration.

4. That betwixt the parties, united sincerity and uprightness should be maintained, lest ancient errors might be upheld under doubtful speeches.

5. That when peace is made, none should be suffered to maintain, excuse or spread any more the errors once condemned.

6. That ambitious and needless disputes and brabblings should be inhibited on all sides.

7. That former reproaches and injuries should be put to oblivion.

8. That the Church government should be settled according to apostolical rules. These demands the rest agreed unto, neither was any thing of moment added thereunto by any.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quote on Dury</cite>, Samuel Hartlib, A Brief Relation of that which has been Lately attempted to Procure Ecclesiastical Peace amongst Protestants (London: I.R., 1641), pp. 16-17</span></figcaption>

<blockquote><p>17. For there are two kinds of errors: some which consist only in belief, others which, besides belief, add some outward action. Of the first kind are the errors concerning the nature of Jesus Christ, concerning Predestination and concerning Free Will. Of the second are: Communion under one kind, adoration of the Host, and prayer in a tongue not understood by him that prays. The errors of this latter kind, although very often less grave than the former, yet divide minds far more sharply, and often cause schism. For if I communicate in the sacrament with one who errs concerning predestination or the nature of Jesus Christ, or who believes that the body of the Lord is everywhere—though the error be great—nevertheless it does not disturb him who communicates with him. But if I should come to communicate with one who adores the bread, or pretends to sacrifice Jesus Christ, such an action would scandalize me and drive me away for fear of participating in idolatry or in a false sacrifice. Now we have this advantage: that with the Lutheran Churches all our differences are of the first kind; and that, as to the external matters which they practice in the Church, we have no disagreement which is not easy to compose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in David Blondel, Authentic Accounts of the Reformed Churches of France, Germany &amp; Great Britain, concerning the Peace &amp; Brotherly Charity which all the Servants of God should Maintain among Protestants (Amsterdam: Blaeu, 1655), pp. 72-76 trans. ChatGPT-5 | Overture for Working toward the Union of the Christian Churches which have Shaken off the Yoke of the Papacy, and for Appeasing the Differences that have Already Arisen, or may Arise Hereafter</span></figcaption>

<blockquote><p>the scribes and Pharisees, which were the doctors of that Church, erred in some fundamental points of doctrine, teaching justification by works: and withal they greatly corrupted the law of God, both by their doctrine and traditions… yet for all this, Christ did not separate from that Church, neither taught his disciples so to do, but was present at their sacrifices and assemblies, and kept his Passover with them: and so did his apostles, till they saw them of obstinacy and maliciousness refuse the grace of God, offered unto them in the ministry of the Gospel. Now their example must teach us that so long as our Church holds Christ, we must esteem it to be the Church of God, and not for some wants thereof depart from it.</p></blockquote>

<blockquote><p>The most significant attempts to overcome religious division between the old church and those desiring reformation were those colloquies that the emperor called at the level of the Holy Roman Empire of the German Nation. They took place in a twenty-year period beginning in 1540. Thereafter this type of imperial colloquy faded because the Religious Peace of Augsburg (1555) guaranteed adherents of the Augsburg Confession legal protection within the boundaries of their own territories. This essentially rendered further Catholic-Evangelical colloquies superfluous.</p></blockquote>

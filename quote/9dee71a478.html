<main class="wrap"><figure class="quote" id="q-9dee71a478" data-kw="">
<blockquote><p>The Onan passage (Gen. 38) is often marshaled as evidence that God does indeed forbid conception control (the spilling of seed without the purpose of conception). Certainly this passage opposes selfishness in the use of conception control and it also illustrates six concrete laws that were broken by Onan. However, neither the Onan example nor the law of God show our BLCC [Biblically Limited Conception Control] practices to be in sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’ (2017)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Onan passage (Gen. 38) is often marshaled as evidence that God does indeed forbid conception control (the spilling of seed without the purpose of conception). Certainly this passage opposes selfishness in the use of conception control and it also illustrates six concrete laws that were broken by Onan. However, neither the Onan example nor the law of God show our BLCC [Biblically Limited Conception Control] practices to be in sin.”

</figure><figure class="quote" id="q-5e345233f7" data-kw="">
<blockquote><p>1. There be some preparations which go before faith: Faith is a seed of heaven… so does the Lord set up a new world of faith in a soul void of faith by degrees: There’s a time when there’s neither perfect night, nor perfect day: but the twilight of the morning… There’s a half summer, and a half spring in the close of the spring which God made. The embryo, or birth not yet animated, is neither seed only, nor a man-child only… … 3. Its true, the new creation and life of God is virtually seminaliter [seminally] in these preparations, as the seed is a tree in hope, the blossom an apple, the foundation a palace in its beginning; so half a desire in the non-converted is love sickness for Christ in the seed, legal humiliation is in hope evangelic repentance and mortification: But as the seed and the growing tree differ not gradually only, but in nature and specifically, as a thing without life is not of that same nature and essence with a creature that has a vegetative life and growth, so the preparatory good affections of desire, hunger sorrow, humiliation going before conversion, differ specifically from those renewed affections which follow after…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Trial &amp; Triumph of Faith… (London, 1652), Sermon 21, ‘Then Jesus Answered &amp; Said unto Her, ‘O Woman, great is thy Faith, etc.”</cite>, pp. 312-14</span></figcaption>

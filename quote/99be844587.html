<main class="wrap"><figure class="quote" id="q-99be844587" data-kw="">
<blockquote><p>Conquest, seeing it is an act of violence and God’s revenging justice for the sins of a people, cannot give in God’s court such a just title to the throne as the people are to submit their consciences unto, except God reveal his regulating will by some immediate voice from heaven, as he commanded Judah to submit to Nebuchadnezzar as to their king by the mouth of Jeremiah. Now this is not a rule to us; for then, if the Spanish king should invade this land, and, as Nebuchadnezzar did, deface the temple and instruments and means of God’s worship, and abolish the true worship of God, it should be unlawful to resist him, after he had once conquered the land: neither God’s Word, nor the law of nature could permit this. I suppose, even by grant of adversaries, now no act of violence done to a people, though in God’s court they have deserved it, can be a testimony to us of God’s regulating will; except it have some warrant from the law and testimony [Scripture], it is no rule to our conscience to acknowledge him a lawful magistrate whose sole law to the throne is an act of the bloody instrument of divine wrath, I mean the sword. That, therefore, Judah was to submit, according to God’s Word, to Nebuchadnezzar, whose conscience and best warranted calling to the kingdom of Judah was his bloody sword, even if we suppose Jeremiah had not commanded them to submit to the king of Babylon, I think cannot be said.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f2ae6a267c" data-kw="">
<blockquote><p>3. We may allow passive subjection in some cases, even to tyrants; when the Lord lays on that yoke, and in effect says, He will have us to lie under it a while, as He commanded the Jews to be subject to Nebuchadnezzar: of which passage, adduced to prove subjection to tyrants universally, [George] Buchanan ubi supra infers that if all tyrants be to be subjected to, because God by His prophet commanded His people to be subject to one tyrant; then it must be likewise concluded that all tyrants ought to be killed, because Ahab’s house was commanded to be destroyed by Jehu. But passive subjection, when people are not in capacity to resist, is necessary. I do not say passive obedience, which is a mere chimera, invented in the brains of such sycophants as would make the world slaves to tyrants. Whosoever suffers if he can shun it, is an enemy to his own being: for every natural thing must strive to preserve itself against what annoys it; and also he sins against the order of God, who in vain has ordained so many lawful means for preservation of our being, if we must suffer it to be destroyed, having power to help it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-shields.html">Alexander Shields</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Hind let Loose</cite>, … (1687), pt. 3, Head 5, p. 582</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

oks Online</a></div>
</figure><figure class="quote" id="q-6e30913758" data-kw="">
<blockquote><p>No person is exempt by any Law of God from this punishment, be he king, queen, or emperor, he must die the death, for God has not placed them above others, to transgress his laws as they list, but to be subject to them as well as others, and if they be subject to his laws, then to the punishment also, so much the more as their example is more dangerous.</p></blockquote>

</figure><figure class="quote" id="q-18f4a949e3" data-kw="">
<blockquote><p>For the words themselves, ‘Honor the King’, I have already spoken at large of the duty contained herein: Know we only, that by the King here, is meant Caesar, who was a heathen emperor, one that intruded himself, ruled tyrannously, and was an idolater… … Under this honor is understood, the inward reverence in heart to be declared outwardly by obedience to all their godly commandments, cheerfulness in payments, prayer and thanksgiving, etc. Now if all this be due to a wicked King, as here, and now to be performed of us, if we had a wicked king, what then is to be done of us to such a king as God has bestowed on us?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rogers.html">John Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly and Fruitful Exposition upon all the First Epistle of Peter</cite>, (d. 1636; 1650) | On 1 Tim., 2:17</span></figcaption>

</figure><figure class="quote" id="q-25a73203b7" data-kw="">
<blockquote><p>But I pray you what do people get when wars for recoveries of dubious rights are long and calamitous? What are the people of France or the people of Spain better for the long and hereditary anger of their two kings? Or what was the world better for Alexander’s conquering it? The [English Parliament] Houses which are burnt and the millions of bodies left dead in the field are the peoples; and princes scorning to derive from them [the people] still trample them to dung.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bounds &amp; Bonds of Public Obedience</cite>, … (London, 1649) This was mor than likely written by Ascham despite it being attributed to Rouse., p. 34</span></figcaption>

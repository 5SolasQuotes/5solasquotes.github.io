<main class="wrap"><figure class="quote" id="q-7c2060f6f5" data-kw="">
<blockquote><p>Most false it is that the Tabernacle and Temple were nothing but a meeting place of the people for worship, as our churches or chapels, are:

1. Because it is to argue the Holy Ghost of want [lack] of wisdom, to spend so much canonic Scripture in setting down things idly, not tending, at all to edification, and teaching us nothing of God, and in specifying the form, height, length, breadth, curtains, candlesticks, sockets, rings of natural places that contained their bodies… Now certain it is, ‘Whatsoever things were written aforetime, were written for our learning, Rom. 15:4.

2. Many things in the Tabernacle, as candles in daylight, rings, sockets, showbread, belonged nothing to a natural place, as our chapels, or meeting houses do.

3. Expressly the Scripture makes them more than places; to wit, holy, religious, and typical signs of divine institution; as the Tabernacle was a type, Heb. 8:2,5; 9:1,2 etc.; 10:1-3. And the Temple a type of Christ’s body, Jn. 2:19; 1:14-15. And all these were types and shadows of heavenly things, Heb. chapters 8-10; Gal. 4:1-2, etc.; Col. 2:16,17. Which our churches and chapels are not, being only places common to sacred and civil actions. …

3. Yea, because the Tabernacle and Temple and their implements were teaching shadows of good things to come, and our Churches and Chapels are not so, nor have they any moral or religious use or influence on our spirits as the Tabernacle and Temple had; therefore the Lord, who is express in all morals, which of their own nature do teach and edify; he behoved to name Bezaliel, and Aholiah, and the form and color of the priests’ garments, which also are typical, and could not name our elders, or the color or form of their garments.

4. All these weak retortions [of Rutherford’s Anglican opponents] suppose that the Tabernacle and Temple were types of our meeting houses for worship, which is a mere conjecture; they were no more types of our chapels than of the Jewish synagogues;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Intro, section 3, pp. 48-49</span></figcaption>

<blockquote><p>3. That the ordinance of superiors cannot make the ceremonies [which were claimed to be indifferent, to be] necessary, I have proven in the first part of this Dispute. This is given for one of the chief marks of the man of sin [in 1 Tim. 4:1-5], ‘That which is indifferent, he by his laws and prohibitions maketh to be sin;’ (Morney, Mister. of Iniq., in the Conclusion) and shall they who profess to take part with Christ against Antichrist [such as the prelates] do no less than this? It will be replyed that the ceremonies are not thought necessary in themselves, nor non-conformity unlawful in itself, but only in respect of the Church’s ordinance. Just so the Papists profess that the omission of their rites and observances is not a sin in itself, but only in respect of contemning the Church’s customs and commandments. How comes it then that they [the prelates] are not ashamed to pretend such a necessity for the stumbling blocks of those offending ceremonies among us, as Papists pretend for the like among them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, pp. 46-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>After He had washed their feet, and had taken his garments, and was set down again, He said unto them, ‘Know ye what I have done to ye, ye call me Master and Lord, and ye say well, for so I am; if I then your Lord and Master have washed your feet, ye also ought to wash one another’s feet, for I have given you an example that ye should do as I have done to you.’ ‘Tis evident that it is the moral duty of brotherly love, in condescension, and mutual helpfulness to be expressed in all necessary offices as occasion doth require, that is the thing which Jesus Christ here enjoins his disciples, and leads them to by his own example in an office of love then in use in those parts. The same is to be said of the holy kiss, Rom. 16:16 which was a temporary occasional token of entire love; which may in answer thereunto, be expressed by any sober usage of salutation amongst men to the same purpose. But the things themselves were not instituted for any continuance, nor do represent any special grace of the New Covenant, which is inseparable from every institution of Gospel worship properly so called. Common usages or practises therefore, directed to be used in a due manner, and unto a proper end, where they are used, make them not institutions of worship. Neither have they in them as so commanded or directed, any one thing that concurs to the constitution of a Gospel-Ordinance: for neither had they their rise in the authority of Christ, nor is any continuance of them enjoined, nor any promise annexed unto them, nor any grace of the New Covenant represented or exhibited in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John</cite>, 13:12-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

not+institutions+of+worship.+Neither+have+they+in+them+as+so+commanded+or+directed%2C+any+one+thing+that+concurs+to+the+constitution+of+a+Gospel-Ordinance%3A+for+neither+had+they+their+rise+in+the+authority+of+Christ%2C+nor+is+any+continuance+of+them+enjoined%2C+nor+any+promise+annexed+unto+them%2C+nor+any+grace+of+the+New+Covenant+represented+or+exhibited+in+them.%E2%80%9D%0A%0A%E2%80%94+Explication%2C+Mention+is+made+in+the+Scriptures+of+sundry+things+practiced+by+the+Lord+Christ+and+his+Apostles%2C+which+being+then+in+common+use+amongst+men%2C+were+occasionally+made+by+them+symbolical+instructions+in+moral+duties.+Such+were+washing+of+feet+by+one+another%2C+the+holy+kiss%2C+and+the+like%3B+but+there+being+no+more+in+them%2C+but+a+sanctified+use+directed+unto+the+present+civil+customs+and+usages%2C+the+commands+given+concerning+them%2C+respect+not+the+outward+action%2C+nor+appointed+any+continuance+of+them%2C+being+peculiarly+suited+unto+the+state+of+things+and+persons+in+those+countries%3B+as+John+13%3A12-15&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffde2d15b26.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fde2d15b26.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-holy-kiss-foot-washing-anointing-with-oil/#:~:text=After%20He%20had%20washed%20their%20feet,Covenant%20represented%20or%20exhibited%20in%20them&amp;text=After%20He%20had%20washed%20their%20feet%2C%20and%20had&amp;text=the%20New%20Covenant%20represented%20or%20exhibited%20in%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

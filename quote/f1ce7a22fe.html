</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ad2710556d" data-kw="">
<blockquote><p>This may move us to embrace integrity and sincerity, because the Lord so highly esteems it, that He accepts of our obedience as perfect which springs from it, though it be stained with much corruption, and joined with many imperfections. …those are said to have been perfect before God who in simplicity and uprightness of heart laboured after perfection, and served God in sincerity and truth, as Noah, Abraham, Job, David, Asa, Zachary and Elizabeth, though they had many corruptions and imperfections which in the Scriptures are recorded of them… And therefore David uses his sincerity in praying, as an argument to persuade the Lord to give him audience: ‘Give ear’ (says he) ‘unto my prayers, which go not out of feigned lips.’ (Ps. 17:1) And Hezekiah’s integrity of life, as a reason to move Him for the repealing of the sentence of death and prolonging of his days. ‘Remember now, O Lord,’ (says he) ‘I beseech thee, how I have walked before thee in truth, and with a perfect heart, etc.’ (Isa. 29:13)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Godliness or a Treatise of a Christian Life</cite>, (London: 1622), bk. 4, ch. 1, §4 ‘That our imperfect obedience is accepted of God, if it be done in sincerity and integrity’, pp. 405-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

ay%20move%20us%20to%20embrace,a%20perfect%20heart%2C%20etc.%E2%80%99%20%28Isa.%2029%3A13&amp;text=This%20may%20move%20us%20to%20embrace%20integrity%20and&amp;text=and%20with%20a%20perfect%20heart%2C%20etc.%E2%80%99%20%28Isa.%2029%3A13" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cb64ce6484" data-kw="">
<blockquote><p>Objection: But this case is unlike to that of liturgies. Answer: The Scripture is God’s own Word: A mistranslation makes that to be his Word that is not; which sure is a tenderer matter than in what words we speak our own minds to God. Sure [it is that] a depravation of Scripture is more [of a depravavation] than [that of] a ceremony: Were liturgies such an alteration of God’s own words, you would more plausibly accuse them. One that said, ‘God said this’ or that, which He said not, was worse than one that spake his own words indecently to God. To say, ‘This is God’s Word,’ which is not, is indeed adding to it [Prov. 30:6]; but so it is not to speak words as our own. How much the Septuagint differs from the Hebrew, how many verses it leaves out, how many additions and alterations it makes, is commonly known. Christ’s and the apostles’ use of this was no approbation of its faults, much less their presence in the synagogues when others read Moses and the prophets in them. And the Psalms in the Septuagint translation were part of their liturgy. For man to speak faultily is no wonder: It has a more plausible pretence for separation to say that men corrupt the Word of God. And yet when it is but such an effect of human imperfection, it is no just pretence. But yet a word more: Question 1: Do you think that the Pharisees and scribes had so much of the gift of extemporary prayer that they could, and did use to make long prayers, as if it were by the spirit-extempore? Say so and you will disgrace the doctors’ arguments that lay so much on this manner of praying [by forms]. No doubt but it was forms and liturgies that they used; yet when Christ condemns them for praying in the streets to be seen and using long prayer for a pretence to devour widows’ houses:

2. Did Christ speak one word against them as forms or liturgies? Did He want [lack] zeal or knowledge?

3. Had they not been good in themselves, what cloak could they have made for so great evil?

4. Did Christ or his apostles ever forbear [abstain from] the synagogues for the sake of these long liturgies?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation &amp; Conformity</cite>, Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ | Bad Translation &amp; Bad Liturgy</span></figcaption>

</figure><figure class="quote" id="q-95da656997" data-kw="">
<blockquote><p>Bodily worship without soul-worship is nothing; but soul-worship may be accepted without bodily worship; therefore it is the soul that God does principally look at in holy duties: If you be not able to worship God in your bodies, you may worship Him in your souls, and God regards that bodily exercise in holy duties is little worth… but it is nothing in comparison: the great work is the work of the soul, for God is a Spirit and must be worshipped in spirit. And God is said to be a Spirit… it notes the simplicity of God… but in the simplicity of your hearts you must come to worship God, and thus you shall worship Him with such worship as is some way suitable to him as he is a Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship</cite>, ... (London: 1647) | Sermon 6, pp. 93-94</span></figcaption>

</figure><figure class="quote" id="q-b967e823a2" data-kw="">
<blockquote><p>§4. So if a pastor call the assembly at an inconvenient hour, or to an inconvenient place, though it be his sin to do so, yet is it their duty to obey. If in the manner of prayer he (tolerably) miscarry, they may not therefore refuse to join with him. If of two translations of Scripture, or two versions of the Psalms, he use the worser (so it be tolerable), they must obey. §5. Yet if the miscarriage be so great in the ordering even of these circumstances, or in the manner of duties, as shall overthrow the duty itself, and be inconsistent with the ends, or bring greater evils upon the Church than our refusing to obey the pastors (in those cases) can do; then (as I have before showed) we are not bound to follow him in such a case: But otherwise we are. §6… If none shall obey a magistrate or pastor in the works of their own office, as long as they think he did them not the best way, all government then would be presently overthrown, and obedience denied… §7. And the things in which the pastor is now supposed to err, are not of themselves unlawful, but only by such an accident, as being overweighed by another accident, shall cease to make them unlawful. For instance: If the pastor appoint a more imperfect version of the Psalms to be sung in the Church (as is commonly done in England), the obeying of him in the use of this will not bring so much hurt to the Church as the disobeying on that account would do: For besides the sin of disobedience itself, the Church would be in a confusion if they forsake his conduct that preserves the union; and some will be for this and some for that, and so the worship itself will be overthrown. But if the pastor would command a version so corrupt as would overthrow the duty itself, or be as bad as non-performance, the Church is then to seek redress and not obey him. So if he command a time inconvenient, but tolerable (as to meet at sun rising or sun setting) it were better [to] obey than dissolve the Church (if we cannot be otherwise relieved). But if he appoint a time that’s intolerably unfit (as at midnight), I would not obey (except in such necessity as leaves [public worship] to that time or none)… §9. If I be bound to obey a governor if he set me to pick straws, or to hunt a feather, it follows not that he may lawfully command it. I have heard many pleading for ceremonies say that if the magistrate commanded them, and would not otherwise permit them to preach the Gospel, they would preach in a fool’s coat and a fool’s cap with a feather rather than forbear. But I do not think that any of them would justify that ruler that would make such a law that no man should preach or celebrate the sacraments but in a fool’s coat and cap: such might expect to be judged by Christ, as the scorners of Him and his ordinances.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“§4. So if a pastor call the assembly at an inconvenient hour, or to an inconvenient place, though it be his sin to do so, yet is it their duty to obey. If in the manner of prayer he (tolerably) miscarry, they may not therefore refuse to join with him. If of two translations of Scripture, or two versions of the Psalms, he use the worser (so it be tolerable), they must obey. §5. Yet if the miscarriage be so great in the ordering even of these circumstances, or in the manner of duties, as shall overthrow the duty itself, and be inconsistent with the ends, or bring greater evils upon the Church than our refusing to obey the pastors (in those cases) can do; then (as I have before showed) we are not bound to follow him in such a case: But otherwise we are. §6… If none shall obey a magistrate or pastor in the works of their own office, as long as they think he did them not the best way, all government then would be presently overthrown, and obedience denied… §7. And the things in which the pastor is now supposed to err, are not of themselves unlawful, but only by such an accident, as being overweighed by another accident, shall cease to make them unlawful. For instance: If the pastor appoint a more imperfect version of the Psalms to be sung in the Church (as is commonly done in England), the obeying of him in the use of this will not bring so much hurt to the Church as the disobeying on that account would do: For besides the sin of disobedience itself, the Church would be in a confusion if they forsake his conduct that preserves the union; and some will be for this and some for that, and so the worship itself will be overthrown. But if the pastor would command a version so corrupt as would overthrow the duty itself, or be as bad as non-performance, the Church is then to seek redress and not obey him. So if he command a time inconvenient, but tolerable (as to meet at sun rising or sun setting) it were better [to] obey than dissolve the Church (if we cannot be otherwise relieved). But if he appoint a time that’s intolerably unfit (as at midnight), I would not obey (except in such necessity as leaves [public worship] to that time or none)… §9. If I be bound to obey a governor if he set me to pick straws, or to hunt a feather, it follows not that he may lawfully command it. I have heard many pleading for ceremonies say that if the magistrate commanded them, and would not otherwise permit them to preach the Gospel, they would preach in a fool’s coat and a fool’s cap with a feather rather than forbear. But I do not think that any of them would justify that ruler that would make such a law that no man should preach or celebrate the sacraments but in a fool’s coat and cap: such might expect to be judged by Christ, as the scorners of Him and his ordinances.”

— Richard Baxter, Five Disputations on Church Government &amp; Worship (London, 1659) | ch. 12, ‘It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded’, pp. 461-63">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A74.+So+if+a+pastor+call+the+assembly+at+an+inconvenient+hour%2C+or+to+an+inconvenient+place%2C+though+it+be+his+sin+to+do+so%2C+yet+is+it+their+duty+to+obey.+If+in+the+manner+of+prayer+he+%28tolerably%29+miscarry%2C+they+may+not+therefore+refuse+to+join+with+him.+If+of+two+translations+of+Scripture%2C+or+two+versions+of+the+Psalms%2C+he+use+the+worser+%28so+it+be+tolerable%29%2C+they+must+obey.+%C2%A75.+Yet+if+the+miscarriage+be+so+great+in+the+ordering+even+of+these+circumstances%2C+or+in+the+manner+of+duties%2C+as+shall+overthrow+the+duty+itself%2C+and+be+inconsistent+with+the+ends%2C+or+bring+greater+evils+upon+the+Church+than+our+refusing+to+obey+the+pastors+%28in+those+cases%29+can+do%3B+then+%28as+I+have+before+showed%29+we+are+not+bound+to+follow+him+in+such+a+case%3A+But+otherwise+we+are.+%C2%A76%E2%80%A6+If+none+shall+obey+a+magistrate+or+pastor+in+the+works+of+their+own+office%2C+as+long+as+they+think+he+did+them+not+the+best+way%2C+all+government+then+would+be+presently+overthrown%2C+and+obedience+denied%E2%80%A6+%C2%A77.+And+the+things+in+which+the+pastor+is+now+supposed+to+err%2C+are+not+of+themselves+unlawful%2C+but+only+by+such+an+accident%2C+as+being+overweighed+by+another+accident%2C+shall+cease+to+make+them+unlawful.+For+instance%3A+If+the+pastor+appoint+a+more+imperfect+version+of+the+Psalms+to+be+sung+in+the+Church+%28as+is+commonly+done+in+England%29%2C+the+obeying+of+him+in+the+use+of+this+will+not+bring+so+much+hurt+to+the+Church+as+the+disobeying+on+that+account+would+do%3A+For+besides+the+sin+of+disobedience+itself%2C+the+Church+would+be+in+a+confusion+if+they+forsake+his+conduct+that+preserves+the+union%3B+and+some+will+be+for+this+and+some+for+that%2C+and+so+the+worship+itself+will+be+overthrown.+But+if+the+pastor+would+command+a+version+so+corrupt+as+would+overthrow+the+duty+itself%2C+or+be+as+bad+as+non-performance%2C+the+Church+is+then+to+seek+redress+and+not+obey+him.+So+if+he+command+a+time+inconvenient%2C+but+tolerable+%28as+to+meet+at+sun+rising+or+sun+setting%29+it+were+better+%5Bto%5D+obey+than+dissolve+the+Church+%28if+we+cannot+be+otherwise+relieved%29.+But+if+he+appoint+a+time+that%E2%80%99s+intolerably+unfit+%28as+at+midnight%29%2C+I+would+not+obey+%28except+in+such+necessity+as+leaves+%5Bpublic+worship%5D+to+that+time+or+none%29%E2%80%A6+%C2%A79.+If+I+be+bound+to+obey+a+governor+if+he+set+me+to+pick+straws%2C+or+to+hunt+a+feather%2C+it+follows+not+that+he+may+lawfully+command+it.+I+have+heard+many+pleading+for+ceremonies+say+that+if+the+magistrate+commanded+them%2C+and+would+not+otherwise+permit+them+to+preach+the+Gospel%2C+they+would+preach+in+a+fool%E2%80%99s+coat+and+a+fool%E2%80%99s+cap+with+a+feather+rather+than+forbear.+But+I+do+not+think+that+any+of+them+would+justify+that+ruler+that+would+make+such+a+law+that+no+man+should+preach+or+celebrate+the+sacraments+but+in+a+fool%E2%80%99s+coat+and+cap%3A+such+might+expect+to+be+judged+by+Christ%2C+as+the+scorners+of+Him+and+his+ordinances.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Five+Disputations+on+Church+Government+%26+Worship+%28London%2C+1659%29+%7C+ch.+12%2C+%E2%80%98It+may+be+very+sinful+to+command+some+ceremonies%2C+when+yet+it+may+be+the+subjects%E2%80%99+duty+to+use+them+when+they+are+commanded%E2%80%99%2C+pp.+461-63&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb967e823a2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b967e823a2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=4.%20So%20if%20a%20pastor%20call,scorners%20of%20Him%20and%20his%20ordinances&amp;text=4.%20So%20if%20a%20pastor%20call%20the

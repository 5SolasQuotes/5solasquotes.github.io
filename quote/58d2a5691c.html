<main class="wrap"><figure class="quote" id="q-58d2a5691c" data-kw="">
<blockquote><p>A contemporary chronicler informs us that in August 1545 a fatal pestilence visited all the burghs of Scotland… He [Wishart] was urged to resume his public ministrations, but as those who attended the sick or exhibited symptoms of ailment were carefully avoided, there was difficulty in arranging matters. Wishart proposed to preach from the East Port, the sick and suspected being accommodated without, and those in health within the walls. The proposal was accepted, and the preacher discoursed from the 20th verse of the 107th Psalm: ” He sent His Word and healed them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-wishart.html">George Wishart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Charles Rogers, Life of George Wishart, the Scottish Martyr</cite>, ... (Edinburgh, 1876), pp. 24-25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>72. Fifthly, they [the Church and magistrate] are distinguished by the effect. The effect of civil power is either proper or by way of redundance; The proper effect is the safety-temporal of the commonwealth, external tranquility, the fruition of civil liberty, and of all things which are necessary to the civil society of men: The effect by way of redundance is the good of the Church, to wit, insofar as by execution of justice and good laws, some impediments that usually hinder and disturb the course of the Gospel, are avoided or taken away.

73. For by how much the more faithfully the Magistrate executes his office in punishing the wicked, and cherishing and encouraging good men, taking away those things which withstand the Gospel, and punishing or driving away the troublers and subverters of the Church; so much the more the orthodox faith and godliness are reverenced and had in estimation, sins are hated and feared: Finally, all the subjects contained (as much as concerns the outward man) within the lists of God’s Law; whence also by consequence it happens by God’s blessing, that the Church is defiled with fewer scandals and does obtain the more freedom and peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 111 Propositions… (1647), #72-73</span></figcaption>

</figure><figure class="quote" id="q-5483cd99bf" data-kw="">
<blockquote><p>Now we must treat of going aside; for so I had rather call it, than flying; though I think it the part of a wise-man to fly peril with reason. There are some therefore, which do without exception find fault with going aside for the plague, that they count it a very heinous offence, though they think that those which tarry ought not to use rashness. There are on the other side which hold that every man, so soon as the plague cometh, ought to provide for himself, having no regard, or but very small of the fellowship and duties which Christian Charity doth command. Now I for my part do dissent from both these and especially from the latter, as having most lawful causes:</p></blockquote>

</figure><figure class="quote" id="q-56be02b615" data-kw="">
<blockquote><p>2. And you will hinder the great benefit which the world may get, by their vain attire: For (though it be no thanks to them that intend it not) yet it is a very great commodity that comes to mankind by these people’s sin: that fools should go about in fools-coats, and that empty brains, and proud and wanton hearts should be so openly detected in the streets and churches: that sober people may avoid them; and that wise, and chaste, and civil people may not be deceived by such in marriage to their undoing: As the different clothing of the different sexes is necessary to chastity and order; so it is a matter of great convenience in a commonwealth, that sots, and swaggerers, and phrenetics, and Idiots, and proud, and wanton lustful persons should be openly distinguished from others: As in a plague-time the doors of infected houses are marked with a ‘Lord have mercy on us’: And the wisest magistrate knew not how to have accomplished this himself by a law, as the wretches themselves do by their voluntary choice: For if it were not voluntary, it would be no distinguishing badge of their profession. Now for any honest civil people to join with them and take up their livery, and the habit of their Order, is to profess themselves such as they, and so to encourage and approve them, or else to confound the proud and humble, the vain and the sober, the wanton and the chaste, and destroy the benefit of distinction.</p></blockquote>

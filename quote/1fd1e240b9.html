<main class="wrap"><figure class="quote" id="q-1fd1e240b9" data-kw="">
<blockquote><p>There is nothing in the fourth commandment, fixing this weekly rest to the seventh day of the week. The law in the decalogue does not point out any day of the week, but only a day succeeding six days of labour. It is said, “God blessed the Sabbath-day, and hallowed it.”

… The resurrection of Christ was a very glorious event, to which the highest importance is properly attached, and which is well worthy of a weekly and joyful commemoration. His resurrection was life from the dead to all his people, and to all their hopes. If the completion of creation was worthy of a weekly celebration, much more is the same true of the completion of redemption. For Christians to celebrate the seventh day of the week, would be to keep a feast on the gloomiest day of the week—the day on which their Lord lay in the sepulchre of Joseph.

… Apostolic example is as safe and correct a guide as apostolic precept, and no serious and candid reader of the New Testament can doubt that the apostles and early Christians did observe the first day of the week as the rest appointed by God. This fact, therefore, clearly determines our duty. Many duties are taught us by the example of inspired men. An appeal to such example is fair, and the example itself is binding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-swan-plumer.html">William Swan Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law of the Sabbath Still Binding, and What it Forbids,</cite>, Tracts of American Tract Society. General Series, Volume 6, no. 187 (New York, n.d.), p. 13.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf5c30a0dc" data-kw="same body identity">
<blockquote><p>Are the same bodies numerically which have died to be raised again? We affirm against the Socinians. It is not inquired whether they will be the same bodies as to qualities and conditions. For we confess that they will undergo a great change so as to be no longer animal, corruptible, weak, miserable and mortal, but spiritual, incorruptible, strong, glorious and immortal. But concerning numerical identity of substance—whether the same flesh which was dissolved by death will rise again—this we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.2.1–2</span></figcaption>

</figure><figure class="quote" id="q-af53ab3b82" data-kw="">
<blockquote><p>Obj. The resurrection of Christ is declared by the Apostle to be the cause of our resurrection, and our resurrection is the effect, or benefit of Christ&#x27;s resurrection. But this cause does not extend to the wicked. Therefore they will not rise. Ans. Although the wicked will not rise because of the resurrection of Christ, yet they shall, nevertheless, be raised on account of the just judgment of God. by which they shall be consigned to everlasting punishment. For there may be many and different causes, (if not in number, at least in kind,) especially in different subjects, of one and the same effect. The cause of the resurrection of the godly is, therefore, the resurrection of Christ as of the head. But the resurrection of Christ is not the cause of the resurrection of the wicked, because they are not members of Christ, but the justice of God, and the truth of his threatening Briefly; the wicked shall rise from the dead, not because Christ rose, but on account of the justice of God, that they may be punished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 57 (resurrection of the body)</span></figcaption>

</figure><figure class="quote" id="q-8e7d1e6c6f" data-kw="">
<blockquote><p>…The belief of the disciples in the resurrection, according to the New Testament, was due simply to the fact of the resurrection. Those disciples came to believe that Jesus had risen from the dead for the simple reason that Jesus had risen from the dead. He had risen from the dead; and they had not only seen his tomb. empty but had seen him alive after his death on the cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Person of Jesus</cite>, (Philadelphia: Westminster Seminary Press, 2017), 89.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection.html">Resurrection</a></span></div>

</figure><figure class="quote" id="q-b739b4f72c" data-kw="">
<blockquote><p>They further argue, that Christ is the meritorious cause of the resurrection; and since he has merited nothing for the wicked or reprobate they shall not be raised. The answer to which is, that Christ is the meritorious cause of the resurrection of life, but not of the resurrection of damnation; the saints will rise to life by virtue of union to Christ, through his merit, and the power of his resurrection: not so the wicked; they will rise, not through his merit, and by virtue of union to him, but by his almighty power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, bk. 7, ch. 4 (Of the Resurrection of the Body)</span></figcaption>

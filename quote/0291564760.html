</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ae744ad4b" data-kw="">
<blockquote><p>And we must also add that whatever be their original and constitution, if all their governors were as the apostles, yet have they no power but what is for edification, and not for destruction; If they do or shall appoint and impose on men what tends unto the destruction of their souls, and not unto their edification, as it is fallen out in the Church of Rome; not only particular churches, but every individual believer is warranted to withdraw from their communion… Let none mistake themselves herein, believers are not made for churches, but churches are appointed for believers. Their edification, their guidance and direction in the profession of the faith and performance of divine worship in assemblies according to the mind of God, is their use and end; without which they are of no signification. The end of Christ in the constitution of his churches, was not the molding of his disciples into such ecclesiastical shapes, as might be subservient unto the power, interest, advantages and dignity of them that may in any season come to be over them; but to constitute a way and order of giving such officers unto them, as might be in all things useful and subservient unto their edification; as is expresly affirmed, Eph. 4:11-14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Vindication of the Non-Conformists from the Charge of Schism… (1680)</cite>, p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

ad it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d9df8860b7" data-kw="">
<blockquote><p>Divisions and contendings have been the undoing of this Church first and last, but I think more of late, and more shamefully than ever, the matter being so small (if wisely considered) about which all this noise has been made. I take not upon me to justify the indulged ministers, neither will I rigidly condemn them: But, if the separating from their ministry and pressing the matter with such heat and violence shall be found to be good service done to Christ, I have read the Scriptures wrong; and the sad consequences of it are convincing enough, if people were humble and convincible. It was this contention which expelled that profitable and most edifying exercise of mutual prayer and Christian conference (that I may say nothing how it drove from the shepherds’ tents) upon which followed a sensible decay in the exercise of godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-b1a9d43570" data-kw="">

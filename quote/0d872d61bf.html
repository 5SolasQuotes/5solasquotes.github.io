<main class="wrap"><figure class="quote" id="q-0d872d61bf" data-kw="">
<blockquote><p>That this confounding both of the titles and offices of bishop and presbyter [as synonymous], will be found agreeable to the most pure primitive times. It is true, within some few ages, difference was made between bishops and presbyters in the Church; yet was never that distinction counted by them to be jure divino, or by the Law of God; but as a thing belonging to order in the Church, and brought in by custom: which was, that he who was of greatest age and respect, and did preside in the meetings, was particularly called bishop, which afterward was established by some Councils… not only Jerome was of that mind with Aerius (whose opinion was that the bishop and the presbyter were equal and the same) but also, that Ambrosius, Augustinus, Sedulius, Primasius, Chrysostomus, Theoderetus, Oecumenius and Theophilactus were of that same mind… If it be asked, How this distinction [between presbyter and bishop] did enter? He [Jerome] answers in that epistle [to Evagrius]… that when afterward one came to be elected and preferred to the rest, it was done for the remedy of schism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lecture 3, ‘Concerning the Identity of Angel, Bishop &amp; Presbyter’ in A Commentary upon the Book of the Revelation</cite>, (Edinburgh, 1658), pp. 223-33, p. 225</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2d68b0f711" data-kw="">
<blockquote><p>Here it must be noted that Church history has constrained all that understand it to confess (both Papists, Greeks and Protestants) that: [1.] The ordination of bishops and presbyters was in the power of the bishops, and the election in the power of the people, not only the first 300 years under heathen emperors, but for many hundred years after under Christian emperors and princes. 2. That this was taken for their right given them by God. To cite more proofs, for this would expose us to the reader’s censure as unnecessary tediousness: Many Papists largely prove it, as does David Blondel beyond exception, De jure plebis in regimine Ecclesiastico, with more. 3. That yet we here plead not for the necessity of so much as the people’s election as it signifies the first nomination of the person, but only for the necessity of consent, either explicitly or implicitly expressed. If the senior pastors have the first nomination, or, if it be the magistrate, or patrons, as with us, we quarrel not against it if the flock do but consent. Parents may choose husbands and wives for their children; but they are not such at all till mutual consent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), sect. 6, pp. 80-81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-323e74c17f" data-kw="">
<blockquote><p>A bishop ordained of God, or set up by the law of God, does declare nothing else but their calling, which by an other more special name, are called pastors, whom (says Luke [in Acts 20]) the holy Ghost has appointed bishops to feed the Church of God. And either of these names of pastor or of bishop is proper to them in the New Testament, whereby the apostle does distinguish them from apostles, prophets, and evangelists, which were callings to endure for a time, Eph. 4:11, and from deacons, 1 Tim. 3 and Phil. 1:1, for otherwise they are everywhere called elders… But they are called bishops in regard of the sheep committed unto them, as though a man should call them watchmen of [or?] overseers. These now were one alone, as where any church had but one pastor, or more if the church had more than one. And the meeting of them together jointly with their elders, whom Paul calls ‘governors’ [1 Cor. 12], of the other common name called, was the eldership. Their duty was to attend on the word and prayer, both publicly and privately, and in common to governe the Church, as appears by many places of Scripture. … Of the Bishop that is of Man The bishop that is of man, that is to say, brought into the Church by the alone wisdom of man, besides the express Word of God, is a certain power given to one certain pastor above his other fellows, yet limited with certain orders or rules provided against tyranny. They which did bear this office of bishop, are called bishops in regard of their fellow elders and the whole clergy, as watchmen set over the clergy. That this calling was not brought in by the Word, it is manifest by that, that there is not to be found in the New Testament so much as one syllable, whereby there may be the least surmise of any such thing. For although we doubt not, but all things ought to be done orderly in the Lord’s house, and therefore that some one should be president in every assembly… … The Answer to the First Question Where as Satan’s bishop has been the overthrow of the Church and all Christian kingdoms, whose head is the Roman Antichrist, it is to be looked unto of all hands, especially of all godly princes, that they at once abolish it, if they mind the reformation of the Church and their own safety. As for the bishop ordained by man and brought into the Church by little and little, whereby Satan made him a way for greater things, it had been tolerable… experience of so many ages does teach us too well, that unless this root also be plucked up, it will come to pass that the same fruit will sprout and bud forth again. Finally, seeing the Lord has so often decided this controversy of superiority among his own disciples, that He shut it clean out, seeing the rule both for doctrine and good order of the Church is to be sought for out of the very writings of the apostles: and it is manifested, the churches then prospered, when all this authority of one man over the rest, yet was not, but as that grew up, so all things fell to decay. Finally, seeing where the remnants of this government by a few are not clean taken away, the work of the Lord, is openly hindered: Our judgement is that after the chasing away of this device of man, the churches shall be well provided for, if they may be repaired according to the writings of the apostles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Judgment of a Most Reverend &amp; Learned Man from Beyond the Seas Concerning a Threefold Order of Bishops</cite>, [of God, of Man, of the Devil], with a Declaration of Certain Other Weighty Points Concerning the Discipline &amp; Government of the Church ([London, 1585]) 43, pp. ToC</span></figcaption>

cerning+a+Threefold+Order+of+Bishops+%5Bof+God%2C+of+Man%2C+of+the+Devil%5D%2C+with+a+Declaration+of+Certain+Other+Weighty+Points+Concerning+the+Discipline+%26+Government+of+the+Church+%28%5BLondon%2C+1585%5D%29+43%2C+pp.+ToC&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F323e74c17f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/323e74c17f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/prelacy#:~:text=A%20bishop%20ordained%20of%20God%2C%20or,to%20the%20writings%20of%20the%20apostles&amp;text=A%20bishop%20ordained%20of%20God%2C%20or%20set%20up&amp;text=repaired%20according%20to%20the%20writings%20of%20the%20apostles" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Thirdly, the Scripture intimates this difference between ministry and magistracy, that the work of the ministry and the administrations thereof are performed in the name of Jesus Christ, as Mediator and King of the Church: the work of the magistracy not so… Now let our opposites show (if they can) where they find in Scripture that the Christian magistrate is to rule in the name of Christ, to judge in the name of Christ, to make laws in the name of Christ, to make war or peace in the name of Christ, to punish evil-doers with the temporal sword in the name of Christ. Of the ministry I did show that in the name of the Lord Jesus Christ we do assemble ourselves together, Mt. 18:20, in his name do we preach, Lk. 24:47; Acts 4:17-18; 5:28,44; 9:27, in his name do we baptize, Acts 2:38, 8:16; 19:5, in his name do we excommunicate, 1 Cor. 5:5… … A minister of Christ does both preach and baptize in the name of Christ, as Mediator, that is, vice Christi [in the place of Christ], in Christ’s stead, and having authority for that effect from Christ, as Mediator; for Christ, as Mediator, gave us our comission to preach and baptize… So that to preach and baptize epi to onomati Iesou Christou (which we find both of preaching, Lk. 24:47, and of baptizing, Acts 2:38) comprehends a formal commission, power and auhority, given and derived from Christ. … The ministers of Christ do act in the name of Christ, that is, in the name, authority, room and place of Christ: We are ambassadors for Christ, and we preach in Christ’s stead, 2 Cor. 5:20. This… makes good my argument. Why did he [Mr. Hussey, an Erastian] not show us the like concerning magistracy? I suppose he would, if he could…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, (1646), bk. 2, ch. 7, pp. 109-112</span></figcaption>

</figure><figure class="quote" id="q-6982e00e09" data-kw="">
<blockquote><p>Because bishop and presbyter are everywhere in Scripture taken for one and the same (so that the difference is only in the name, not in the thing—bishop, with regard to his office and function; presbyter, with regard to his age and dignity), the same characters and the same functions are ascribed to both.</p></blockquote>

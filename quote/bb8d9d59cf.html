<main class="wrap"><figure class="quote" id="q-bb8d9d59cf" data-kw="">
<blockquote><p>The Jews object: forasmuch as we even our selves confess, that the law of the ten commandments is perpetual or everlasting: and that the precept touching the Sabbath is part of the ten Commandments, therefore it is not to be abolished or taken away. We answer, that the Decalogue or ten commandments is perpetual or everlasting, so far as it is moral: and that the additions or circumstances of the moral commandments for signification sake, were to be kept no longer then until the coming of the Messias.

Secondly they reply, that it is written concerning the Sabbath. Exod. 31. It is an everlasting covenant: it is an everlasting sign between me &amp; the sons of Israel. We answer, first that the ceremonial Sabbath is perpetual unto the coming of Christ, which was the end of ceremonies. Jerem. 31. Dan. 9. Secondly, that the Sabbath is everlasting, concerning the signification, which is a ceasing from sin, and a rest in the Lord. For so all the figures of the old law are everlasting, yea, &amp; the kingdom of David it self, the which notwithstanding was to be destroyed before the coming of the Messias. Gen. 49. The Sceptre shall not be taken away from Judah until Silo come. And 2. Sam. 7. Thy throne shall be sure for ever. Ezech. 37. My servant David shall be a Prince unto thē for ever. In the same place, And the Gentiles shall know, that I the Lord doe sanctify Israel, forasmuch as my sanctuary shall be among them for ever.

Thirdly they say: albeit it should be granted, that the ceremonies of Moses are mutable or such as may be changed, yet the laws given before Moses are unchangeable, amongst the which is also the keeping of the seventh day. We deny the Major, as touching ceremonies: for ceremonies ordained by God before Moses, because they were figures of benefits to be received in the Messias to come, are taken away by his coming, as circumcision given unto Abraham: as also the sacrifices commanded unto our first parents.

Fourthly they reply: That the laws given by God before the fall, are not figures of benefits to be received in the Messias, and that they do bind all mankind at all times: for then as at that time the promise concerning the Messias was not yet given, and there was one &amp; the same condition &amp; estate of all mankind, the which was comprehended in our first parents: but the Sabbath of the seventh day was ordained of God, after the creation of the world was finished, before the fall of mankind: therefore it is universal and perpetual.

We answer by distinguishing of the Maior: the which is true concerning moral laws, the natural knowledges [sic] whereof were imprinted in the mind of man in the creation, but is not true as touching the ceremony or keeping of the seventh day, as which after the fall in the law of Moses was made a figure of the benefits to be received in the Messias, and therefore like as other ceremonies, either then, or before ordained, was made subject unto change by the coming of the Messias. For God would not have shadows of things to come to remain, the things themselves being exhibited and given already. Albeit therefore that we grant, that the exercises of the worship of God on the seventh day were to be observed &amp; kept by the commandment of God, as well as if men had not sinned (like as the exercise of abstaining from the tree of knowledge of good and evil) as after they had sinned: yet after that God placed this ceremony among the shadows of the Messias to come, by this self same new law given by Moses, he made the same changeable together with the other Ceremonies.

If fifthly it be objected: The cause of a law being perpetual, maketh the law also to be perpetual: but the cause of hallowing the seventh day, namely the remembrance and setting forth of the creation, and the meditating and thinking upon the works of God is perpetual: Therefore the law of the seventh day, even after that Christ is come, is unchangeable, &amp;c.

Here also we distinguish the Major, namely that the law is unchangeable in regard of the cause or end unchangeable, if that cause or end do necessarily and perpetually require this law as an effect or means: but not so, if at other times, and by other means we may better come unto that end, or if the law-maker by an other law may as well attain unto the same end. Forasmuch then, as there may be a meditation and setting forth of the works of God, as well upon an other day, as upon the seventh day, as at the beginning for a cause applied unto the first times, God ordained the seventh day for the ministry, so afterward for a cause applied unto the times of the Messias being come, he abrogated or took away the same law, and left it at liberty unto the Church to choose other days: Which Church for a probable and reasonable cause, chose the first day, on the which the rising again of Christ fell, by the which a spiritual &amp; everlasting Sabbath is begun in us. And that this change &amp; alteration was made by the Church in the times of the Apostles, it appeareth out of the 20. chapter of the Acts: The first day of the week, the Disciples being gathered together to break bread, Paul preached. Apoc. 1. I was taken in the spirit upon the Lord’s day.</p></blockquote>

<blockquote><p>[2 Corinthians 1] Vers. 24. Not for that we have dominion over your Faith, but are helpers of your joy: for by Faith ye stand.

Hence arises another Objection: Therefore thou makest thy self Lord of our Faith, as if thou couldest punish when thou wouldst. He answers by denying any Mastery, affirming the power of his Ministry, and that to be employed to the benefit of the Church, that timely Censures, according to the Will of Christ, being used, those that repented might at length rejoice: He gives an account why he denied any dominion over their Faith, because Faith is the bond of conjunction with Christ, by which Faith we stand fast in the Grace of God, in right and title unto Christ, in the possession of things present, and in hopes of future good things: Therefore Faith admits no Lord, besides God; it admits of men only as Ministers, and helpers.</p></blockquote>

<blockquote><p>Every oath concerning a lawful and possible thing which can be performed without detriment to religion, to the obedience due to magistrates and the salvation of our neighbour ought to be kept without treachery and deceit; even if extorted by violence or fear, or connected with temporal injury and involving loss to the swearer.

Such an oath was made with the invocation of the divine name, which is not to be profaned. Its truth rests upon the express words of Scripture: “Ye shall not steal, neither deal falsely, neither lie one to another. And ye shall not swear by my name falsely” (Lev. 19:11, 12). “Thou shalt not forswear thyself, but shalt perform unto the Lord thine oaths” (Mt. 5:33). “He that sweareth evil” (i.e., and evil of loss which he sees to be injurious to his property, not of fault) “and changeth not, shall dwell in the mountain of the Lord” (Ps. 15:4). Although the injury done takes away the obligation with respect to the man doing the injury (since no right is founded upon injustice), still the obligation made to God remains (which without irreverence and injury to God cannot be considered as void). …

V. This very thing is confirmed by the example of the Israelites toward the Gibeonites. Although they had confirmed by an oath the covenant made with the former (deceived by their treachery as if they were strangers from most remote places), they did not rescind the oath when their treachery and deceit was afterwards found out, but fulfilled it in good faith (although they belonged to those nations whom God had devoted to destruction) … And when Saul (a hundred years afterwards) put to death certain of the Gibeonites, God testified how greatly he was displeased by sending a famine. This perjury could be atoned for only by the hanging of seven sons of Saul (2 S. 21:1ff.).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Every oath concerning a lawful and possible thing which can be performed without detriment to religion, to the obedience due to magistrates and the salvation of our neighbour ought to be kept without treachery and deceit; even if extorted by violence or fear, or connected with temporal injury and involving loss to the swearer.

Such an oath was made with the invocation of the divine name, which is not to be profaned. Its truth rests upon the express words of Scripture: “Ye shall not steal, neither deal falsely, neither lie one to another. And ye shall not swear by my name falsely” (Lev. 19:11, 12). “Thou shalt not forswear thyself, but shalt perform unto the Lord thine oaths” (Mt. 5:33). “He that sweareth evil” (i.e., and evil of loss which he sees to be injurious to his property, not of fault) “and changeth not, shall dwell in the mountain of the Lord” (Ps. 15:4). Although the injury done takes away the obligation with respect to the man doing the injury (since no right is founded upon injustice), still the obligation made to God remains (which without irreverence and injury to God cannot be considered as void). …

V. This very thing is confirmed by the example of the Israelites toward the Gibeonites. Although they had confirmed by an oath the covenant made with the former (deceived by their treachery as if they were strangers from most remote places), they did not rescind the oath when their treachery and deceit was afterwards found out, but fulfilled it in good faith (although they belonged to those nations whom God had devoted to destruction) … And when Saul (a hundred years afterwards) put to death certain of the Gibeonites, God testified how greatly he was displeased by sending a famine. This perjury could be atoned for only by the hanging of seven sons of Saul (2 S. 21:1ff.).”

— Francis Turretin, Institutes of Elenctic Theology, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.11.4, 5.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEvery+oath+concerning+a+lawful+and+possible+thing+which+can+be+performed+without+detriment+to+religion%2C+to+the+obedience+due+to+magistrates+and+the+salvation+of+our+neighbour+ought+to+be+kept+without+treachery+and+deceit%3B+even+if+extorted+by+violence+or+fear%2C+or+connected+with+temporal+injury+and+involving+loss+to+the+swearer.%0A%0ASuch+an+oath+was+made+with+the+invocation+of+the+divine+name%2C+which+is+not+to+be+profaned.+Its+truth+rests+upon+the+express+words+of+Scripture%3A+%E2%80%9CYe+shall+not+steal%2C+neither+deal+falsely%2C+neither+lie+one+to+another.+And+ye+shall+not+swear+by+my+name+falsely%E2%80%9D+%28Lev.+19%3A11%2C+12%29.+%E2%80%9CThou+shalt+not+forswear+thyself%2C+but+shalt+perform+unto+the+Lord+thine+oaths%E2%80%9D+%28Mt.+5%3A33%29.+%E2%80%9CHe+that+sweareth+evil%E2%80%9D+%28i.e.%2C+and+evil+of+loss+which+he+sees+to+be+injurious+to+his+property%2C+not+of+fault%29+%E2%80%9Cand+changeth+not%2C+shall+dwell+in+the+mountain+of+the+Lord%E2%80%9D+%28Ps.+15%3A4%29.+Although+the+injury+done+takes+away+the+obligation+with+respect+to+the+man+doing+the+injury+%28since+no+right+is+founded+upon+injustice%29%2C+still+the+obligation+made+to+God+remains+%28which+without+irreverence+and+injury+to+God+cannot+be+considered+as+void%29.+%E2%80%A6%0A%0AV.+This+very+thing+is+confirmed+by+the+example+of+the+Israelites+toward+the+Gibeonites.+Although+they+had+confirmed+by+an+oath+the+covenant+made+with+the+former+%28deceived+by+their+treachery+as+if+they+were+strangers+from+most+remote+places%29%2C+they+did+not+rescind+the+oath+when+their+treachery+and+deceit+was+afterwards+found+out%2C+but+fulfilled+it+in+good+faith+%28although+they+belonged+to+those+nations+whom+God+had+devoted+to+destruction%29+%E2%80%A6+And+when+Saul <blockquote><p>In Francis Turretin’s day, there were some who appealed to the alleged discrepancies in Matthew 27:9 and Mark 1:2 in an attempt to demonstrate that scripture contradicted itself. Turretin was unmoved by their sophistries and provided a perfectly rational explanation as to why Matthew referred to Jeremiah and why Mark referred to Isaiah:

The prophecy concerning the thirty pieces of silver and the field bought with them is cited from Jeremiah (Mt. 27:9), which is certainly found in Zech. 11:12. From this some attribute universal falsehood and slips of the memory (sphalma mnēmonikon) to Matthew. But the difficulty can be cleared up in various ways. Some are of the opinion that the name Jeremiah (leremiou) has crept into the text from the ignorance of transcribers (since zou may have been written as an abbreviation of Zachariou), but that the error is one of small importance (viz., occurring in a proper name the correction of which is easily made from a comparison of the Old and New Testaments). Others (with better reason) maintain that there is here a blending (synchysin) of two prophetical passages from which this testimony is drawn, viz., from Jer. 32 and Zech. 11. Cases similar to this occur in: Mt. 21:5 from Is. 62:11 and Zech. 9:9; Mt. 21:13 from Is. 56:7 and Jer. 7:11; Acts 1:20 from Pss. 69:25 and 109:8; 1 Pet. 2:7, 8 from Ps. 118:22 and Is. 8:14.

Nor is it an unusual thing (when the words or testimonies belong to two persons) to omit one and give only the name of the other (as Mk. 1:2, 3 where the first part is taken from Malachi, the latter from Isaiah, and yet Malachi is omitted and Isaiah alone mentioned). And this can be done with greater propriety when the one who is cited is either more ancient than the other, and the later has drawn many things from him (as is the case here). For Jeremiah was before Zechariah, and Zechariah borrowed many things from him and imitated (as it were) his addresses (as might easily be shown from Zech. 1:14 which is taken from Jer. 18:11 and 35:15; and Zech. 3:8 from Jer. 23:5). Hence the Jews were in the habit of saying, “the spirit of Jeremiah is in Zechariah.”

To this it can be added that from the tradition of the Rabbis in the Babylonion Talmud (Baba Bathra, 14, cf. BT 1:70) which Rabbi David Kimchi quotes in his preface to the prophet Jeremiah, Jeremiah stands at the head of the prophets and is therefore named first (Mt. 16:14). Therefore Matthew (citing these words contained in the book of the prophets) could quote them only under his name because he held the first place there. So in Lk. 24:44, the book of holy writings (Hagiographorum) is mentioned under the name of the Psalms because this is the first of them. Finally, Jeremiah alone might be mentioned here by Matthew because he wished to give an account, not so much of the thirty pieces of silver or of the price for which Christ was bought (about which Zechariah treats), as of the price of the bought field (about which Jeremiah treats). Therefore what is said here of the price is drawn from Zechariah, and what is said of the field from Jeremiah.</p></blockquote>

<blockquote><p>1. What this Covenant is. You must know, that there is a double covenant, there is a covenant of works, and a covenant of grace: The covenant of works runs in these terms: “Do this and you shall live, and I will be your God.” This is the covenant that was made with Adam and the covenant that is expressed by Moses in the Moral Law, “Do this and live.” The second is the covenant of grace, and that runs in these terms: “You shall believe, you shalt take my Son for your Lord, and your Savior, and you shall likewise receive the gift of righteousness, which was wrought by him, for an absolution for your sins, for a reconciliation with me, and thereupon thou shall grow up in love and obedience towards me and then I will be your God, and you shall be my people.” This is the covenant of grace, “you shall believe, and take my Son and accept of the gift of righteousness” and “I will be your God.” The difference between them you shall find, 2 Cor. 3. where you shall see 3 differences, to reduce them to those heads, I will not trouble you with particular places, lest I stay too long upon them. The first covenant “was a ministration of the letter,” that is, in the first covenant, there was no more heard nor seen, but the naked commandment it was written in Tables of stone, and presented to them, there went with it no aptness, no disposition to keep it: they heard what the Law was, they saw what God required, but there was no more, and those that were declarers of it, were but the ministers of the Letter, and not of the Spirit. Secondly, this covenant, it brings only a servile fear, and enmity: for when a man looks upon the Author of this covenant, and he hears no more but the Law, and what it requires: he looks upon God, as a hard Master, as an enemy; again, he looks upon his Law as a hard and cruel Law, as a heavy yoke, as an unsupportable bondage, and therefore he hates it, and wishes there were no such Law; he runs from it, as a Bond slave runs from his Master, as far as it is in his power. This is that which is said, Gal 4. Hagar genders to bondage, that is, the covenant of works begets bond-men, and slaves, and not sons and freemen; and likewise that, Heb. 12:18. says the Apostle, “You are not come to Mount Sinai, to the burning of fire, to clouds, to darkness, to tempest, to the sound of a trumpet, so that Moses himself did quake and tremble.” That is, when a man looks upon this covenant of works, it causes in him a fear and enmity, that is the 2nd difference. The third is, That it is a ministration of death, as it is called, 2 Cor. 3. a ministration of death, that is, it propounds a curse to all those that do not keep it, and shews no means to avoid it: and therefore a man is affected to it, and to God the Author of it, as one is to an enemy that seeks his destruction; and therefore the ministration of it is said to be the ministration of death. The reason of this is, not because there is any ill in the Law, it is a ministration of the letter, it begets fear and enmity, it is a ministration of death: I say, this arises not from hence, that the Law of God is a cruel deadly Law: (for the Law is good) but it arises from the weakness, and the infirmity of the flesh: As for example, if you would take a potter’s vessel, and dash it against the firm Wall, the reason why the Wall is the destruction of the Vessel, is not any infirmity or weakness in the wall, for it is the excellency and virtue of the Wall to be hard, it should be so; but it is the weakness and fragility, and brittleness of the vessel, and thence comes it to be broken asunder, and so in this case, the reason why this Law or Covenant of works is a ministration of death, and of enmity, it is not because there is any imperfection in the law, it arises rather from the perfection of it, but it is from the weakness of the flesh that is not able to keep the law? it is the excellency of the aw, that it is so perfect, that a man is not able to keep it: it arises, I say, from the weakness and infirmity of the flesh, that is not able to observe this law. First, is a ministration of the Spirit, and not of the letter. Secondly, a ministration of love, not of enmity; of freedom, not of bondage; it is a ministration of righteousness, as it is there called the ministration of righteousness; for if the ministration of condemnation were glorious, much more shall the ministration of righteousness exceed in glory. Thirdly, a ministration of life and justification, and not a ministration of death and condemnation. The ground of this, and how it is thus, we shall show you, expressing to you the order how these depend, and follow one upon the other: when a man hath looked upon the covenant of works, and sees death in it, sees a strict law that he is not able to keep: then comes the covenant of grace, and shows to him a righteousness to satisfy that law that himself never wrought, shows him a way of obtaining pardon and remission for the sins that he hath committed against this law, by the death and satisfaction of another: when he sees this, he sees withal the goodness and mercy of God, giving this to him for his salvation out of his free grace and mercy: and when he sees it, the opinion, of a sinner is changed, mark; I say, his opinion, his disposition, and affection is altered, he looks not on God now as upon a hard and cruel Master, but he looks upon him now as a God exceeding full of mercy and compassion: whence this follows, that his heart melts toward the Lord, it relents, it comes to be a soft heart, that is easy and tractable, it is not haled now to the commandment, but out of an ingenuity and willingness he comes and serves the LORD, with alacrity and cheerfulness: the disposition is wrought in him, because now he sees another way, his apprehension is altered, even as a servant when it is revealed to him that he is a son, and that those hard tasks that are laid on him, are the best way to lead him to happiness, they are but rules of direction, for his own wealth, and for his own advantage, he doth them now with all willingness, the case is altered, he looks not now upon the Law of God as an enemy, or as a hard bondage, but he looks upon all the law of God as a wholesome and profitable rule of direction, that he is willing to keep for his own comfort: now, when the heart is thus softened, then the Spirit of God is sent into his heart, and writes the Law of God in his inward parts; as you shall see if you compare these two places together, Heb. 8. 8. 9. 10. “Behold, says the Lord, I will make a new covenant and this is the Testament that I will make with the house of Israel: After those days saith the Lord, I will put my laws into their minds and in their hearts will I write them; and I will be….” [the following pages are missing in the typescript].</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. What this Covenant is. You must know, that there is a double covenant, there is a covenant of works, and a covenant of grace: The covenant of works runs in these terms: “Do this and you shall live, and I will be your God.” This is the covenant that was made with Adam and the covenant that is expressed by Moses in the Moral Law, “Do this and live.” The second is the covenant of grace, and that runs in these terms: “You shall believe, you shalt take my Son for your Lord, and your Savior, and you shall likewise receive the gift of righteousness, which was wrought by him, for an absolution for your sins, for a reconciliation with me, and thereupon thou shall grow up in love and obedience towards me and then I will be your God, and you shall be my people.” This is the covenant of grace, “you shall believe, and take my Son and accept of the gift of righteousness” and “I will be your God.” The difference between them you shall find, 2 Cor. 3. where you shall see 3 differences, to reduce them to those heads, I will not trouble you with particular places, lest I stay too long upon them. The first covenant “was a ministration of the letter,” that is, in the first covenant, there was no more heard nor seen, but the naked commandment it was written in Tables of stone, and presented to them, there went with it no aptness, no disposition to keep it: they heard what the Law was, they saw what God required, but there was no more, and those that were declarers of it, were but the ministers of the Letter, and not of the Spirit. Secondly, this covenant, it brings only a servile fear, and enmity: for when a man looks upon the Author of this covenant, and he hears no more but the Law, and what it requires: he looks upon God, as a hard Master, as an enemy; again, he looks upon his Law as a hard and cruel Law, as a heavy yoke, as an unsupportable bondage, and therefore he hates it, and wishes there were no such Law; he runs from it, as a Bond slave runs from his Master, as far as it is in his power. This is that which is said, Gal 4. Hagar genders to bondage, that is, the covenant of works begets bond-men, and slaves, and not sons and freemen; and likewise that, Heb. 12:18. says the Apostle, “You are not come to Mount Sinai, to the burning of fire, to clouds, to darkness, to tempest, to the sound of a trumpet, so that Moses himself did quake and tremble.” That is, when a man looks upon this covenant of works, it causes in him a fear and enmity, that is the 2nd difference. The third is, That it is a ministration of death, as it is called, 2 Cor. 3. a ministration of death, that is, it propounds a curse to all those that do not keep it, and shews no means to avoid it: and therefore a man is affected to it, and to God the Author of it, as one is to an enemy that seeks his destruction; and therefore the ministration of it is said to be the ministration of death. The reason of this is, not because there is any ill in the Law, it is a ministration of the letter, it begets fear and enmity, it is a ministration of death: I say, this arises not from hence, that the Law of God is a cruel deadly Law: (for the Law is good) but it arises from the weakness, and the infirmity of the flesh: As for example, if you would take a potter’s vessel, and dash it against the firm Wall, the reason why the Wall is the destruction of the Vessel, is not any infirmity or weakness in the wall, for it is the excellency and virtue of the Wall to be hard, it should be so; but it is the weakness and fragility, and brittleness of the vessel, and thence comes it to be broken asunder, and so in this case, the reason why this Law or Covenant of works is a ministration of death, and of enmity, it is not because there is any imperfection in the law, it arises rather from the perfection of it, but it is from the weakness of the flesh that is not able to keep the law? it is the excellency of the aw, that it is so perfect, that a man is not able to keep it: it arises, I say, from the weakness and infirmity of the flesh, that is not able to observe this law. First, is a ministration of the Spirit, and not of the letter. Secondly, a ministration of love, not of enmity; of freedom, not of bondage; it is a ministration of righteousness, as it is there called the ministration of righteousness; for if the ministration of condemnation were glorious, much more shall the ministration of righteousness exceed in glory. Thirdly, a ministration of life and justification, and not a ministration of death and condemnation. The ground of this, and how it is thus, we shall show you, expressing to you the order how these depend, and follow one upon the other: when a man hath looked upon the covenant of works, and sees death in it, sees a strict law that he is not able to keep: then comes the covenant of grace, and shows to him a righteousness to satisfy that law that himself never wrought, shows him a way of obtaining pardon and remission for the sins that he hath committed against this law, by the death and satisfaction of another: when he sees this, he sees withal the goodness and mercy of God, giving this to him for his salvation out of his free grace and mercy: and when he sees it, the opinion, of a sinner is changed, mark; I say, his opinion, his disposition, and affection is altered, he looks not on God now as upon a hard and cruel Master, but he looks upon him now as a God exceeding full of mercy and compassion: whence this follows, that his heart melts toward the Lord, it relents, it comes to be a soft heart, that is easy and tractable, it is not haled now to the commandment, but out of an ingenuity and willingness he comes and serves the LORD, with alacrity and cheerfulness: the disposition is wrought in him, because now he sees another way, his apprehension is altered, even as a servant when it is revealed to him that he is a son, and that those hard tasks that are laid on him, are the best way to lead him to happiness, they are but rules of direction, for his own wealth, and for his own advantage, he doth them now with all willingness, the case is altered, he looks not now upon the Law of God as an enemy, or as a hard bondage, but he looks upon all the law of God as a wholesome and profitable rule of direction, that he is willing to keep for his own comfort: now, when the heart is thus softened, then the Spirit of God is sent into his heart, and writes the Law of God in his inward parts; as you shall see if you compare these two places together, Heb. 8. 8. 9. 10. “Behold, says the Lord, I will make a new covenant and this is the Testament that I will make with the house of Israel: After those days saith the Lord, I will put my laws into their minds and in their hearts will I write them; and I will be….” [the following pages are missing in the typescript].”

— John Preston, The New Covenant or The Saints Portion, (London, 1639), 314–18. [spelling and punctuation modernized]">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+What+this+Covenant+is.+You+must+know%2C+that+there+is+a+double+covenant%2C+there+is+a+covenant+of+works%2C+and+a+covenant+of+grace%3A+The+covenant+of+works+runs+in+these+terms%3A+%E2%80%9CDo+this+and+you+shall+live%2C+and+I+will+be+your+God.%E2%80%9D+This+is+the+covenant+that+was+made+with+Adam+and+the+covenant+that+is+expressed+by+Moses+in+the+Moral+Law%2C+%E2%80%9CDo+this+and+live.%E2%80%9D+The+second+is+the+covenant+of+grace%2C+and+that+runs+in+these+terms%3A+%E2%80%9CYou+shall+believe%2C+you+shalt+take+my+Son+for+your+Lord%2C+and+your+Savior%2C+and+you+shall+likewise+receive+the+gift+of+righteousness%2C+which+was+wrought+by+him%2C+for+an+absolution+for+your+sins%2C+for+a+reconciliation+with+me%2C+and+thereupon+thou+shall+grow+up+in+love+and+obedience+towards+me+and+then+I+will+be+your+God%2C+and+you+shall+be+my+people.%E2%80%9D+This+is+the+covenant+of+grace%2C+%E2%80%9Cyou+shall+believe%2C+and+take+my+Son+and+accept+of+the+gift+of+righteousness%E2%80%9D+and+%E2%80%9CI+will+be+your+God.%E2%80%9D+The+difference+between+them+you+shall+find%2C+2+Cor.+3.+where+you+shall+see+3+differences%2C+to+reduce+them+to+those+heads%2C+I+will+not+trouble+you+with+particular+places%2C+lest+I+stay+too+long+upon+them.+The+first+covenant+%E2%80%9Cwas+a+ministration+of+the+letter%2C%E2%80%9D+that+is%2C+in+the+first+covenant%2C+there+was+no+more+heard+nor+seen%2C+but+the+naked+commandment+it+was+written+in+Tables+of+stone%2C+and+presented+to+them%2C+there+went+with+it+no+aptness%2C+no+disposition+to+keep+it%3A+they+heard+what+the+Law+was%2C+they+saw+what+God+required%2C+but+there+was+no+more%2C+and+those+that+were+declarers+of+it%2C+were+but+the+ministers+of+the+Letter%2C+and+not+of+the+Spirit.+Secondly%2C+this+covenant%2C+it+brings+only+a+servile+fear%2C+and+enmity%3A+for+when+a+man+looks+upon+the+Author+of+this+covenant%2C+and+he+hears+no+more+but+the+Law%2C+and+what+it+requires%3A+he+looks+upon+God%2C+as+a+hard+Master%2C+as+an+enemy%3B+again%2C+he+looks+upon+his+Law+as+a+hard+and+cruel+Law%2C+as+a+heavy+yoke%2C+as+an+unsupportable+bondage%2C+and+therefore+he+hates+it%2C+and+wishes+there+were+no+such+Law%3B+he+runs+from+it%2C+as+a+Bond+slave+runs+from+his+Master%2C+as+far+as+it+is+in+his+power.+This+is+that+which+is+said%2C+Gal+4.+Hagar+genders+to+bondage%2C+that+is%2C+the+covenant+of+works+begets+bond-men%2C+and+slaves%2C+and+not+sons+and+freemen%3B+and+likewise+that%2C+Heb.+12%3A18.+says+the+Apostle%2C+%E2%80%9CYou+are+not+come+to+Mount+Sinai%2C+to+the+burning+of+fire%2C+to+clouds%2C+to+darkness%2C+to+tempest%2C+to+the+sound+of+a+trumpet%2C+so+that+Moses+himself+did+quake+and+tremble.%E2%80%9D+That+is%2C+when+a+man+looks+upon+this+covenant+of+works%2C+it+causes+in+him+a+fear+and+enmity%2C+that+is+the+2nd+difference.+The+third+is%2C+That+it+is+a+ministration+of+death%2C+as+it+is+called%2C+2+Cor.+3.+a+ministration+of+death%2C+that+is%2C+it+propounds+a+curse+to+all+those+that+do+not+keep+it%2C+and+shews+no+means+to+avoid+it%3A+and+therefore+a+man+is+affected+to+it%2C+and+to+God+the+Author+of+it%2C+as+one+is+to+an+enemy+that+seeks+his+destruction%3B+and+therefore+the+ministration+of+it+is+said+to+be+the+ministration+of+death.+The+reason+of+this+is%2C+not+because+there+is+any+ill+in+the+Law%2C+it+is+a+ministration+of+the+letter%2C+it+begets+fear+and+enmity%2C+it+is+a+ministration+of+death%3A+I+say%2C+this+arises+not+from+hence%2C+that+the+Law+of+God+is+a+cruel+deadly+Law%3A+%28for+the+Law+is+good%29+but+it+arises+from+the+weakness%2C+and+the+infirmity+of+the+flesh%3A+As+for+example%2C+if+you+would+take+a+potter%E2%80%99s+vessel%2C+and+dash+it+against+the+firm+Wall%2C+the+reason+why+the+Wall+is+the+destruction+of+the+Vessel%2C+is+not+any+infirmity+or+weakness+in+the+wall%2C+for+it+is+the+excellency+and+virtue+of+the+Wall+to+be+hard%2C+it+should+be+so%3B+but+it+is+the+weakness+and+fragility%2C+and+brittleness+of+the+vessel%2C+and+thence+comes+it+to+be+broken+asunder%2C+and+so+in+this+case%2C+the+reason+why+this+Law+or+Covenant+of+works+is+a+ministration+of+death%2C+and+of+enmity%2C+it+is+not+because+there+is+any+imperfection+in+the+law%2C+it+arises+rather+from+the+perfection+of+it%2C+but+it+is+from+the+weakness+of+the+flesh+that+is+not+able+to+keep+the+law%3F+it+is+the+excellency+of+the+aw%2C+that+it+is+so+perfect%2C+that+a+man+is+not+able+to+keep+it%3A+it+arises%2C+I+say%2C+from+the+weakness+and+infirmity+of+the+flesh%2C+that+is+not+able+to+observe+this+law.+First%2C+is+a+ministration+of+the+Spirit%2C+and+not+of+the+letter.+Secondly%2C+a+ministration+of+love%2C+not+of+enmity%3B+of+freedom%2C+not+of+bondage%3B+it+is+a+ministration+of+righteousness%2C+as+it+is+there+called+the+ministration+of+righteousness%3B+for+if+the+ministration+of+condemnation+were+glorious%2C+much+more+shall+the+ministration+of+righteousness+exceed+in+glory.+Thirdly%2C+a+ministration+of+life+and+justification%2C+and+not+a+ministration+of+death+and+condemnation.+The+ground+of+this%2C+and+how+it+is+thus%2C+we+shall+show+you%2C+expressing+to+you+the+order+how+these+depend%2C+and+follow+one+upon+the+other%3A+when+a+man+hath+looked+upon+the+covenant+of+works%2C+and+sees+death+in+it%2C+sees+a+strict+law+that+he+is+not+able+to+keep%3A+then+comes+the+covenant+of+grace%2C+and+shows+to+him+a+righteousness+to+satisfy+that+law+that+himself+never+wrought%2C+shows+him+a+way+of+obtaining+pardon+and+remission+for+the+sins+that+he+hath+committed+against+this+law%2C+by+the+death+and+satisfaction+of+another%3A+when+he+sees+this%2C+he+sees+withal+the+goodness+and+mercy+of+God%2C+giving+this+to+him+for+his+salvation+out+of+his+free+grace+and+mercy%3A+and+when+he+sees+it%2C+the+opinion%2C+of+a+sinner+is+changed%2C+mark%3B+I+say%2C+his+opinion%2C+his+disposition%2C+and+affection+is+altered%2C+he+looks+not+on+God+now+as+upon+a+hard+and+cruel+Master%2C+but+he+looks+upon+him+now+as+a+God+exceeding+full+of+mercy+and+compassion%3A+whence+this+follows%2C+that+his+heart+melts+toward+the+Lord%2C+it+relents%2C+it+comes+to+be+a+soft+heart%2C+that+is+easy+and+tractable%2C+it+is+not+haled+now+to+the+commandment%2C+but+out+of+an+ingenuity+and+willingness+he+comes+and+serves+the+LORD%2C+with+alacrity+and+cheerfulness%3A+the+disposition+is+wrought+in+him%2C+because+now+he+sees+another+way%2C+his+apprehension+is+altered%2C+even+as+a+servant+when+it+is+revealed+to+him+that+he+is+a+son%2C+and+that+those+hard+tasks+that+are+laid+on+him%2C+are+the+best+way+to+lead+him+to+happiness%2C+they+are+but+rules+of+direction%2C+for+his+own+wealth%2C+and+for+his+own+advantage%2C+he+doth+them+now+with+all+willingness%2C+the+case+is+altered%2C+he+looks+not+now+upon+the+Law+of+God+as+an+enemy%2C+or+as+a+hard+bondage%2C+but+he+looks+upon+all+the+law+of+God+as+a+wholesome+and+profitable+rule+of+direction%2C+that+he+is+willing+to+keep+for+his+own+comfort%3A+now%2C+when+the+heart+is+thus+softened%2C+then+the+Spirit+of+God+is+sent+into+his+heart%2C+and+writes+the+Law+of+God+in+his+inward+parts%3B+as+you+shall+see+if+you+compare+these+two+places+together%2C+Heb.+8.+8.+9.+10.+%E2%80%9CBehold%2C+says+the+Lord%2C+I+will+make+a+new+covenant+and+this+is+the+Testament+that+I+will+make+with+the+house+of+Israel%3A+After+those+days+saith+the+Lord%2C+I+will+put+my+laws+into+their+minds+and+in+their+hearts+will+I+write+them%3B+and+I+will+be%E2%80%A6.%E2%80%9D+%5Bthe+following+pages+are+missing+in+the+typescript%5D.%E2%80%9D%0A%0A%E2%80%94+John+Preston%2C+The+New+Covenant+or+The+Saints+Portion%2C+%28London%2C+1639%29%2C+314%E2%80%9318.+%5Bspelling+and+punctuation+modernized%5D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F779c3f5d94.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/779c3f5d94.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/01/preston-on-the-distinction-between-the-covenants-of-works-and-grace/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

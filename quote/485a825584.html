<main class="wrap"><figure class="quote" id="q-485a825584" data-kw="">
<blockquote><p>Their [Rome’s] unbloody Sacrifice (as they style it) of a feigned transubstantiated body, is far worse then if they had such Sacrifices of beasts and fowls, as were under the Law. Those sacrifices, at that time, did set out the virtue of Christ’s death, and nourish their faith and hope in the benefits thereof. But the fore-said Popish sacrifice would take away the virtue and efficacy of Christ’s sacrifice, if it could be taken away.

For I demand, whether the sacrifice that they pretend to offer up, be the very same, that Christ himself offered upon the cross. If they say, the same, what need is there that it should be offered up again? Was not Christ’s once offering of it up sufficient? The Apostle doth assuredly intend as much by his frequent mention of this word once, which is exclusively to be taken: once for all, and not to be reiterated. If it be another sacrifice, then the sacrifice of Christ was not perfect.

For hereby the Apostle proveth the Priesthood of the Law to be unperfect; because another was to succeed in the room of it. Whereas some say, that their offering up of the body of Christ, is but by way of application; that seems to contradict their own position; for they teach that the fore-mentioned transubstantiated body, offered up by a Priest, is a true, real, propitiatory sacrifice for the quick and dead.

Besides, the end of Christ’s intercession, and the virtue thereof is made void by that which is avouched of the applicatory virtue of their sacrifice. For the continual application of Christ’s own sacrifice, is the end of Christ’s intercession. They think to evade all these absurdities by a distinction betwixt a bloody and unbloody sacrifice, saying, that the sacrifice which Christ himself offered up was a bloody sacrifice, but that which they offer up, unbloody. To this distinction I answer.

1. It’s without any warrant or ground from Scripture.

2. It being applied, according to their position, to one and the same thing (for they say that the body of Christ, which their Priest offereth up, is the very same that Christ offered upon the cross) it implieth contradictory terms, namely, that the same thing should be bloody and unbloody.

3. According to their own position, their sacrifice cannot be unbloody: for they hold that the wine is transubstantiated into blood, as well as the bread into a body, and both make one sacrifice. How can that be unbloody, which consists of blood? Yea, of blood poured out, as their wine is into the chalice, and out of the chalice into the Priests mouth.

4. If it be unbloody, it hath no virtue for the taking away of sin: For without shedding of blood is no remission.</p></blockquote>

</figure><figure class="quote" id="q-ae8f77685b" data-kw="">
<blockquote><p>We loudly maintain that the sacrifice of the Mass is nothing else than an impious profanation of the Lord’s Supper. This we make plain by the clear words of our Lord. For in instituting the sacred Supper, he does not enjoin us to sacrifice, but invites us to partake of the sacrifice which he himself once offered. He commands distribution to be made, and orders all alike to communicate in both symbols. And there is no obscurity in the words; Take, distribute among yourselves; drink ye all of this cup. What resemblance is there between the observance which corresponds to our Lord’s command and the Papal Mass, in which they pretend that Christ offers himself to the Father to expiate the sins of the world by the sacrifice of himself, and not only so, but also to obtain redemption for the dead – in which no invitation is given to partake, but one individual sets himself apart from the whole flock – and where, if any one comes forward to partake, the half is withheld from him?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons and decrees of the Council of</cite>, Trent, with the antidote (1547) in John Calvin: tracts and letters, trans. and ed. Henry Beveridge (7 vols, Edinburgh, 1851), iii, 59.</span></figcaption>

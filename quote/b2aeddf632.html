<main class="wrap"><figure class="quote" id="q-b2aeddf632" data-kw="">
<blockquote><p>To which thing it is no light instigation, that by these late tumults you have tried, that the peace of the Common-wealth doth consist in the integrity of Religion, neither can the purity of true Religion (which is maintained by you) be violated, but that also the pillars on which your Commonwealth standeth, and by which the authority of your supreme Magistracy is sustained, will be shaken. For these two are so knit together by a mutual bond, that the one cannot be overthrown, but the other also must fall down.

Your authority was struck, at through the side of Religion; and in the foundations of the Church, the foundations of the common-wealth were undermined. Your power therefore will be found safe, when obedience due to princes, shall be thought to be a part of piety: and when the Pastors of the Church shall train up, by the word of God, the people to perform obedience to you. And, on the other side, the Church shall flourish when Princes shall be her nursing fathers, and shall think themselves to be set by God at the stern of the Commonwealth, that God might reign by them, and that Religion might grow up, and might carefully be manured under the shadow of the civil power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), xxi-xxii.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

Your authority was struck, at through the side of Religion; and in the foundations of the Church, the foundations of the common-wealth were undermined. Your power therefore will be found safe, when obedience due to princes, shall be thought to be a part of piety: and when the Pastors of the Church shall train up, by the word of God, the people to perform obedience to you. And, on the other side, the Church shall flourish when Princes shall be her nursing fathers, and shall think themselves to be set by God at the stern of the Commonwealth, that God might reign by them, and that Religion might grow up, and might carefully be manured under the shadow of the civil power.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5791856475" data-kw="">
<blockquote><p>I beseech you therefore, brethren, by the mercies of God, that ye offer up your bodies a living sacrifice, holy, and acceptable unto God, which is your reasonable worshipping… He desires us to offer ourselves unto God. And this oblation he says shall have the nature of a sacrifice… A sacrifice is a voluntary action, wherein we worship God and offer unto Him somewhat, whereby we testify his chief dignity and dominion, and our servitude and submission towards Him. In this definition are expressed all the causes. The matter is the oblation: the form is the action, not a natural action, but that which is done with election, and inspired by the Holy Ghost: neither is it a political or economical action but a religious action: for that pertains to the worshipping of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most Learned &amp; Fruitful Commentaries</cite>, … upon… Romans… trans. H.B. (London: Daye, 1568), | on Romans 12, pp. 410-11, 413</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>‘reasonable service’: Or, worship. That is, a spiritual service, so called in opposition to the carnal rites of the ceremonial law; and he calls it a ‘reasonable service’ because it consists not in the outward offering up of unreasonable beasts, as in the Old Testament: but in the offering up of ourselves, who are men endued with reason. The like exhortation we have, Heb. 13:15; 1 Pet. 2:5. Or, agreeable to the rules of true reason.</p></blockquote>

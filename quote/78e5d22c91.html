<blockquote><p>III. Whether the Christian Sabbath requires a day of twenty-four hours, or a νυχθήμερον [a night-and-day]? [VI.C.1. The Thesis: The Day, Not the Night, Is Properly the Sabbath] Answer: I see this asserted by some, but I require the reasons. This is of the substance of the Sabbath: that a day of rest succeed six working days. But those working days are the courses of the sun above the earth; nor does the night make a part thereof, according to that saying: “I must work the works of Him that sent me, while it is day” (John 9:4), and John 11:9, and Psalm 104:22–23 [recte v. 22ff.]. Now that the Jews observed a night-and-day rest, and indeed beginning from evening, contributed nothing to its substantial sanctification and proportional partition of labor and rest. For ordinary human labor is destined for the day—that is, that space of time which is distinct from the night—as from the passages John 9:4; Psalm 104 just cited, and from the common light of nature and universal experience, I judge to be evident. Nor is it an objection that extraordinary cases of necessity sometimes require the labors of men both by night and by day. The same we also freely concede concerning the nocturnal treatment and meditation of sacred things, or the prolongation thereof into the late hours of the night (Acts 20:9), a particular case so requiring. But as it cannot be inferred thence that individual nights, equally as days, are to be spent in ordinary labours, excluding all sleep, so from the virtue of the partition prescribed in the Decalogue it cannot be inferred that the entire night preceding the Sabbath is ordinarily to be devoted to sacred exercises equally as the day. Such sabbatizing would savor of the nocturnal vigils once introduced into the Church ἀλόγως [irrationally] from some extraordinary occasion, and afterward λογίως [rationally] abrogated—the remnants or surrogates of which still survive in Popery today. Concerning which, see Hospinian, On Feasts, chapter 7. [VI.C.2. Objection I: The Commencement of the Sabbath from Evening] But perhaps someone will say: 1. Objection. The commencement of the Sabbath from the preceding evening was expressly enjoined upon the Israelites; therefore the night is equally the Sabbath of the Lord [Sabbathum Jehova] as the day is the day of the Lord [dies Domini]. Answer: 1. I grant that rest was enjoined—namely, rest and abstinence from ordinary labor—because this is the conditio sine qua non [condition without which not], or as it were the removing of the impediment to Sabbath preparation and observance. For commonly men through the sleeplessness and labor of that night are rendered unfit for vigorously performing the exercises of piety on the following day, so that the Sabbath is to them more a burden, δύσβατον [hard to walk], than עֹנֶג [oneg], that is, delights (Isaiah 58:13). But I deny that the sleep or rest of sleep was prohibited, and that a vigil and sanctification of that night through labor in divine worship and exercises of piety, both public and private, was enjoined. 2. Granting that rest itself was, by divine institution, a sacred part or a part of the sanctification of the Israelite Sabbath, and indeed equally through the night destined for sleep as through the day destined for the works of divine worship: yet it does not follow thence that this circumstantial and accessory element pertains to the substance of the weekly Sabbath instituted from the beginning of the world, and consequently is moral and immutable, by which we are bound equally as the Israelites. It suffices that rest from labors be observed by us in general and materially, as a condition without which not—although it be not believed to be formally and properly holy, formally as a sacred rest from ordinary labor both negatively (by ceasing from work) and positively (through sleep) after the manner of an economical sanctity. Whatever may be the case concerning rest under the Old Testament (about which I do not wish here anxiously to inquire), at least under the New Testament I judge that no rest from labour is to be adorned with the name of virtue, good work, and holiness in itself and of itself, but only in order to another thing—namely, that we may wholly and expressly devote ourselves to divine worship and sanctify that day with spiritual exercises. And thus I judge that sufficient provision is made for the practice of Sabbath sanctification against all profanations—in the same manner as we judge, concerning the matter of religious fasting, about abstinence from food. What, moreover, is commanded in the fourth precept concerning the rest of beasts of burden, that is ordered to the rest of men—without which the Sabbath cannot be solemnly sanctified or holily spent with spiritual works. [VI.C.3. Objection II: The Consequence for Nations with Continuous Night] 2. Objection. Hence it would follow that no Sabbath whatsoever is to be kept for certain months by those nations for whom there is then a continuous night. But this is absurd. Answer: This is the objection of Thomas Shepard, who in his English treatise entitled Theses Sabbaticae, pt. 2, inquires into the commencement of the Sabbath beyond other writers. We deny the consequence. For those nations can and ought, just as they separate their working days in those long darknesses from the nights or ordinary time of rest, so also separate and observe the seventh day as free from ordinary works and occupied with divine worship. This simple opinion of mine on this question I think will satisfy those who are solely solicitous about the practice of piety and the Sabbath.</p></blockquote>

</figure><figure class="quote" id="q-de4b2f942e" data-kw="">
<blockquote><p>And Nehemiah, which is the Tirshatha, and Ezra the priest the scribe, and the Levites that taught the people, said unto all the people, ‘This day is holy unto the Lord your God; mourn not, nor weep.’ For all the people wept, when they heard the words of the law. Then he said unto them: ‘Go your way, eat the fat, and drink the sweet, and send portions unto them for whom nothing is prepared: for this day is holy unto our Lord: neither be ye sorry; for the joy of the Lord is your strength.’ So the Levites stilled all the people, saying, ‘Hold your peace, for the day is holy; neither be ye grieved.’ And all the people went their way to eat, and to drink, and to send portions, and to make great mirth, because they had understood the words that were declared unto them.</p></blockquote>

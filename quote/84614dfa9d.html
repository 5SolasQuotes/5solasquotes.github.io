<blockquote><p>That Justification is pardon of sin, for a man is not justified, in that he is pardoned, but rather it supposeth him guilty: It is true, Remission of sin doth suppose a man faulty in himself, but because Christ did take our sins upon him, and we are accepted of through him, as our Surety, therefore may remission of sin be well called Justification: Indeed pardon can never be called an inherent righteousness, or a qualitative Justice (but rather it opposeth it) but it may be called a Legal or Judicial righteousness, because God for the obedience and satisfaction of Christ, doth account of us as righteous, having pardoned our sin; and withal imputing Christ’s righteousness to us, both which make up our Justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), pp 17-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ac48967e05" data-kw="">
<blockquote><p>‘Which believe in Him that raised up Jesus our Lord from the dead, who was delivered for our sins, and is risen again for our justification.’ …But here arises a doubt, by what means the apostle may seem to seioine and to put asunder these things one from the other: namely, the forgiveness of sin, and justification: and one the other side, the faith of the death, from the faith of the resurrection, when as it seems that by the faith of each part, of his death (I say) and of his resurrection is given not only remission of sins but also justification. … …wherefore there are yet behind two other very likely interpretations: Of which the first is, that in very deed, by the death of Christ was paid the price of our redemption. But, that it might be applied unto us, there needs the Holy Ghost, to move us to believe, and Christ to give unto us this Holy Ghost, rose again from death, sent abroad his apostles to preach into all parts of the world, and now also before the Father, executes the office of an intercessor and high priest: therefore is He said to have risen again to help us that we might obtain justification. Chrysostom seems to lean unto this sentence. The second exposition [as pertaining to inherent righteousness] is that the faith of the death and of the resurrection brings justification: but Paul seioyned them aptly to declare the analogy and proportion between them. Unto the death of Christ answers very well the forgiveness of sins, for by reason of them, death was due unto us. And as Christ, as touching this corruptible life, died, so also ought we, when we are justified to die unto sin. Again because justification seems herein to be declared in that we begin a new life, therefore is it referred unto the resurrection of Christ: for that he then seemed to have begun a celestial and happy life. Paul used in a maner the self-same form of words in this same epistle, when he says [Rom. 10]: ‘with the heart we believe unto righteousness: and with the mouth is confession made to salvation.’ For the faith of the heart both works righteousness and also brings salvation: but because salvation and instauration are chiefly declared in action, therefore he ascribed it to confession. But whither of these expositions is the truer, neither will I contend, nor also now declare. Of those things which have now been spoken, we gather a most sweet consolation: for thereby we do not only know the weight of sin, but also we understand that God bare a singular good love towards us: as one which gave his only begotten Son, and that unto the death to deliver us from sins. Farther, seeing Christ is said to have risen from the dead for our justification, we easily see that we are by Him called back to a new life: unto which yet we cannot aspire, except we be of Him elected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Most Learned &amp; Fruitful Commentary upon the Epistle of St. Paul to the Romans</cite>, ... (d. 1562; London: 1568), on ch. 4, verse 25, p. 97</span></figcaption>

</figure><figure class="quote" id="q-6c4c0825ad" data-kw="">
<blockquote><p>This excellency of the subject notwithstanding ought not to dull the edge of our most diligent search into it, but sharpen it rather, to endeavour so to define justification, that we may justify our definition. Which we cannot do, without distinguishing of a three-fold righteousness: first, a perfect righteousness, but not inherent; of which, 2 Cor. 5.21. secondly, inherent, but not perfect; of which, Luke 1.75. and Apoc. 22.11. thirdly, perfect and inherent, of which, Heb. 12.23. The first, is the righteousness by which we are justified; the second, by which we are sanctified; and the third, by which we are glorified.

The first consisteth as well of Christ’s active as his passive obedience, and in the imputation thereof by faith consisteth the essence of our justification, which may be thus defined: an act of God, whereby he acquitteth every penitent and believing sinner, by not imputing to him his sins, and imputing to him the perfect satisfaction and righteousness of Christ.

Every part of this definition may be proved by clear testimonies of Scripture; and besides, it hath that … certain mark or touch-stone of a true definition, that it meeteth with all doubts, and confronteth all errors broached against the nature of justification: first, the error of the Libertines, by that clause, every penitent: secondly, of the Antinomians, in the clause, not imputing their sin: thirdly, the Socinians, in the clause, perfect satisfaction: and lastly, the Arminians and Papists, in the last clause, imputing Christ’s righteousness, no habit or act of ours, no, not the act of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacra nemesis, The Levite’s scourge, or, Mercurius disciplined. Also diverse remarkable disputes and resolved in the Assembly of Divines related, episcopacy asserted, truth righted, innocency vindicated against detraction</cite>, (Oxford: Leonard Lichfield, 1644), p. 20.</span></figcaption>

<blockquote><p>It is a great sin to think any sin little; but it is a greater sin to think the righteousness of Christ is not above all sin. Our disobedience is the disobedience of man; but Christ’s obedience is the obedience of God: therefore, our believing in Christ doth please God better than if we had continued innocency, and never sinned. The least sin is unpardonable without this obedience and righteousness of Christ; and the greatest is pardonable by it. Therefore, O seek in to Christ, to be clothed upon with this righteousness.</p></blockquote>

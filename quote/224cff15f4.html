<main class="wrap"><figure class="quote" id="q-224cff15f4" data-kw="">
<blockquote><p>That the excellency of the work may be yet further evidenced: consider it in the objects whereabout it is conversant; that is, either Things, or Persons. Things are Doctrine, Worship, and Government; Doctrine is a ray or beam of supernatural truth issued out from God as a special favour to his people, tending to inform them in right notions and apprehensions concerning God, Christ, our souls, and the whole way of salvation. This is called the word of life, the wholesome word, the word of salvation; how useful is this word, since men do as surely perish by damnable heresies, as by moral vices.

Doctrine is as the waters of the Sanctuary, how great a sin to puddle or poison these! was it not capital among the Romans to poison the common springs? How noisome was that plague to the Egyptians to have all their waters whereof they should drink, turned into blood? was it not much more (as the soul is more excellent then the body) pestilential to have all the main Articles of our Religion (not that of Justification excepted) to be all, or the most, desperately corrupted, as may be seen in the Ministers Remonstrance exhibited, together with their Petition for Reformation.

The second particular, whereabout Reformation is conversant, is worship; whereby God and we have communion one with another, wee doe in a holy manner trade with God and he with us. This is as Jacob’s ladder, The Angels of God ascend and descend by it; our prayers ascend, God’s blessings descend. The ordinances are those golden pipes by which the golden oil empties it self into the hearts of God’s people; They are the Churches breasts from whence her children suck nourishment; They are the Churches barn and her Wine-press: They are on Christ’s part the kisses of his mouth, the mutual embraces betwixt God and the Christian Soul; Dry up all the breasts in such a City as this, how great will the cry of the Infants be? This mischief by the putting down of Preaching, and strange Innovations brought and urged upon us in our most solemn worship, had in a great part seized upon us, and will yet certainly prevail if the Reformers do not seasonably and strongly oppose.

The third particular is Church Discipline or Government; all Societies, and so the Church, is upheld by ruling and being ruled. This amongst other benefits it will yield, That it will preserve the honour of God’s censures and ordinances, that great censure of Excommunication, which is no less then the delivery up of a man to Satan, and (next the day of judgement) it is judicium maxime tremendum, it shall no longer Lackey up and down for Duties and Fees as it hath done amongst us, and as it did in the darkest times of Popery as Gerson complains, Lib. de Eccles. defect. Quid est, quod Gladius Ecclesiae, scilicet Excommunicatio, extrahitur pro re nihili, ut pro re nummariâ?

This once established, will direct us to put a difference betwixt the holy and the prophane, the clean and the unclean, for want whereof the Lord challenges the Priests. Hath not this been, and is it not yet in a great part, remaining upon us, as one of our land destroying sins; the promiscuous thrusting in of scandalous and ignorant persons upon the Sacrament of the Lord’s Supper, to the horrible prophaning of the same, and no power that would hitherto be allowed as legal, no not for making stay of such? Misunderstand me not, I mean not, that men should be cut short of that latitude which the Laws of Christ allow; only let that hedge and mound of Discipline be erected, whereby holy things may not be indifferently administered, as well to men egregiously prophane, and that after conviction, as to the Lord his holy ones.</p></blockquote>

<blockquote><p>How highly doth it concern us all, to present God daily for England’s sins, with broken hearts, his well pleasing Sacrifices who knows how God may repent him of the evil? …

I. The SWORD hath been threatened or inflicted on people for these sins ensuing, viz.

1. Sottish ignorance of God and of his ways, Jerem. 4. 19, 20, 21, 22. 2. Disobedience to Gods commands, Deut. 28. 15,—22, 23, 24. Job 36. 11. 3. Backsliding from God, forsaking of God, Jerem. 15. 1, 2, 6. 4. Idolatry, Deut. 28. 21. to 26. Judg. 5 8. Psal. 78. 58. to 63. Isa. 65. 11, 12. Jer. 9. 13. to 17. &amp; 16. 4, 11, 12. &amp; 32. 28, 29 30. &amp;c. &amp; 44 25, 27. 5. Breach of Covenant, Jerem. 34 18. to the end of the Chapter. 6. Distrusting the Lord, and relying on the arm of flesh; as Asa on the King of Syria, 2 Chro. 16. 7, 8 9. 7. Prophesying lies in the name of the Lord, and entertaining them, Jer. 14. 13. to 17. 8. Mocking and misusing the messengers of God, and despising God’s word by them, 2 Chro. 36. 15, 16, 17. 9. The sins and provocations of a profane and wicked King, as of Manasses, Jer. 15. 24. 2 King. 24. 23, 41. 10. Warring against the Church and people of God, as did Amaleck, Exod. 17. 8, 16. 11. Insulting over God’s afflicted Church and people, as Tyre did over Jerusalem, Ezek. 26 1. to 15. 12. Murder, Blood, Cruelty, &amp;c. 2 Sam. 2. 9, 10. 13. Pride, Haughtiness, &amp;c. Isa. 3. 16, 25. 14. Oppression, Isa. 3. 12, 13, 14, 25. Jer. 6. 4. to 9 Job 27. 13 14. 15. Incorrigibleness under Gods Judgements, Levit. 26. 16. to 36. …

For, which of all those Abominations fore-mentioned is not England deeply guilty of? And shall England think to commit the same sins, and yet escape the judgements of God?</p></blockquote>

</figure><figure class="quote" id="q-739cd44fcb" data-kw="">
<blockquote><p>1. The word ‘church’ [say the Independents] signifies always a gathered together church, or such as may gather together, Acts 11:26, a whole year they assembled with the Church, Acts 20:7, the disciples came together to break bread; so Acts 1:10; 2:44,46; Acts 5:12; 15:25. [Rutherford’s] Answer: [1.] Our brother Mr. [George] Gillespie (Assertion of the Government of the Church of Scotland, pt. 2, ch. 3, p. 141-42) says many interpreters expound [in Greek], ‘they were together’, that is, of one accord in love and amity: and also [physical] churches not being builded, and they meeting in private houses, as in Mary’s house, Acts 12, school of Tyrranus, Acts 19:9, in an upper chamber, Acts 20:8, Paul’s lodging at Rome, Acts 28:13. What private houses (Acts 10:9) could ordinarily contain so many thousands?

2. The Scripture speaks so [as] to give us an example of the public meeting for public worship where it is not needful that all met in one place collectively; it is enough they meet all distributively.

3. Neither does the word ‘church’ always signify a meeting of one single congregation, as Acts 12:5; prayers were made [for Peter in jail] by the church, that is by all professors [throughout Jerusalem]. Herod vexed the church, Acts 8:3. Saul made havoc of the church; ‘I persecuted the Church.’ (1 Cor. 15:9) There is no necessity to expound these of people meeting ordinarily to worship God; for Herod and Saul persecuted all, whither apostles or professors in houses, not respecting their meeting in one place; Also [that] it shall follow that prayers were not made in private, but only in the church, that is, in the convened congregation for Peter, which is absurd: And that they were a visible-church is clear, else Herod and Saul could not persecute them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (1642), ch. 7, ‘If there be No True Visible Church in the New Testament, but Only a Congregation Meeting in One Place, &amp; No Presbyterial or Representative Church (as They Call it) at All’, p. 81 Rutherford is arguing against the novel Independent Church government. See also the chapter at large.</span></figcaption>

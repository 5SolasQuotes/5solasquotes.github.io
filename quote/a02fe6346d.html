<blockquote><p>mere hieroglyphics, to represent the constant tender love and watchfulness of God over the ark of his covenant and the people that kept it, and had nothing of the nature of images in them.” (Works 14.446) Durham seems even more uncomfortable over the problem posed by the cherubim. He would like to ban representations of angels altogether, but he hesitates to take too firm a stand: ‘From this ground also it would seem, that painting of angels might be condemned, as a thing impossible, they being spirits which no corporeal thing can represent, beside that the representing of them has some hazard with it: and for those cherubims that were made by God’s direction under the Old Testament, they were rather some emblem of the nature and service of angels, as being full of zeal, and always (as it were) upon wing read to obey God’s will, than any likeness of themselves.’ (Law Unsealed, pp. 68–69) The bronze serpent made by Moses is clearly a happier example. The worship of this “Nehushtan” by later generations demonstrates how easily even lawful images may be abused. (Cf. ibid., p. 69; Boston, Works 2.151; Watson, Body of Divinity, pp. 388-89)</p></blockquote>

<blockquote><p>11. The angels, as touching their substance and nature, seeing they be spirits, cannot be expressed; yet is it lawful sometimes to picture them in such wise, as they have showed themselves unto men: for they be not, as God is, infinite; but are bounded and limited. Neither does the commandment of God forbid this, unless their pictures were made, to the intent they should be religiously and devoutly worshipped.</p></blockquote>

</figure><figure class="quote" id="q-c59f2a8881" data-kw="">
<blockquote><p>Angels have limits both to their essence and to their operation, or, as it is termed, a sphere of activity. But it is difficult for us to understand… It is at least certain that they are not in a place strictly or locally so as to be extended or diffused in it; for they are not bodies, which alone are extended in space of their own and commensurate with it… Thomas [Quodlibet 1, q. 3, art. 1] is more correct [than Duns Scotus] in denying that they are in a place without operating, because they are everywhere and operate by knowledge and will, even ad extra, by glorifying God, and serving Him among men and all other creatures. So that they may be said to be in a place not because they are bounded by a place, but because they themselves rather bound the place by their operation, as Thomas rightly says… Therefore angels whom no medium resists must move very swiftly… Nor does it follow from this that angels move in a moment or by deserting their localization acquire a new one in a moment… as well as the distance between the termini, which involves some measure of delay.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-heidegger.html">Johann H. Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as in Heinrich Heppe, Reformed Dogmatics, ch. 10, §§21-22</cite>, p. 209</span></figcaption>

<blockquote><p>Angels are intelligent spirits free from a body. Propositions … IV. Angels are in a particular place not as if they were enclosed within it, but to the exclusion of being anywhere else [non circumscriptive sed definitive]. V. Angels cannot be in several places at once. VI. Angels truly move from one place to another.</p></blockquote>

</figure><figure class="quote" id="q-ac76ea673f" data-kw="">
<blockquote><p>V. Human veracity, and therefore authority, is always fallible, and therefore cannot generate infallible faith. On the contrary, in divine things, as the truth and authority of God speaking, so faith had in Him is infallible. 1 Sam. 24:10, “And David said to Saul, ‘Why do you listen to the words of men who say …?&#x27;” And ch. 27:12, “So Achish believed David.” 1 Kings 10:7, “However I did not believe the words until I came …” Prov. 14:15, “The simple believes every word.” This, therefore, is faith–to believe someone’s words. When he is a man, it is human faith; but if God’s words are adhered to, it is divine faith. 1 John 5:9, “If we receive the witness of men, the witness of God is greater” – that is, that we may receive the testimony which God has given about his Son. There men are believed by human faith; here God, by divine faith. John 4:41-42, “And many more believed because of His own word,” that is, Christ’s. “Then they said to the woman, ‘Now we believe, not because of what you said, for we ourselves have heard Him and we know that this is indeed the Christ, the Savior of the world.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on Faith’</cite>, tr. Onku with AI (Leiden: Johann Elsevir, 1661) Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

text=V.%20Human%20veracity%2C%20and%20therefore%20authority,Christ%2C%20the%20Savior%20of%20the%20world&amp;text=V.%20Human%20veracity%2C%20and%20therefore%20authority%2C%20is%20always&amp;text=indeed%20the%20Christ%2C%20the%20Savior%20of%20the%20world" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Again, as sanctification is imperfect, so faith has its degrees by which it increases and grows, both as to knowledge and as to trust. In this sense, we do not deny that faith can be called in a certain sense implicit, both in children and the uninstructed (who have only an obscure knowledge) and in the more advanced (in whom the light is always mixed with darkness, who often can reach only the fact [to hoti], but do not rise to the why [to dioti]). Thus the faith of the Old Testament fathers could be called obscure and implicit with respect to ours on account of the obscurity of the revelation. But the question is whether faith in its conception included knowledge; if not a full, still a true and certain knowledge in its own order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, tr. George M. Giger, ed. James Dennison Jr. (1679–1685; P&amp;R, 1994) | 15th Topic, 9th Question, ‘Is faith assent without knowledge and can it be defined better by ignorance than by knowledge? We deny against the Romanists.’ in vol. 2, pp. 564-68, p. 565</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

</figure><figure class="quote" id="q-3098484179" data-kw="">
<blockquote><p>II. The question is not whether faith… is a full and perfect knowledge of mysteries, both as to the reason (to dioti) and the fact (to hoti), so that we ought to believe nothing which we do not clearly and distinctly perceive. For as most gospel mysteries in the greatest degree escape the grasp of the reason, they can never be clearly and distinctly perceived by us as to the wherefore (to dioti) or the how (to pos) or their nature and mode, but only as to the fact because they are truly thus revealed.</p></blockquote>

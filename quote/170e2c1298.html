<main class="wrap"><figure class="quote" id="q-170e2c1298" data-kw="">
<blockquote><p>What does it mean to have a god? or, what is God? Answer: A god means that from which we are to expect all good and to which we are to take refuge in all distress, so that to have a God is nothing else than to trust and believe Him from the [whole] heart; as I have often said that the confidence and faith of the heart alone make both God and an idol. If your faith and trust be right, then is your god also true; and, on the other hand, if your trust be false and wrong, then you have not the true God; for these two belong together, faith and God. That now, I say, upon which you set your heart and put your trust is properly your god. Therefore it is the intent of this commandment to require true faith and trust of the heart which settles upon the only true God, and clings to Him alone.… Whatever you lack of good things, expect it of Me, and look to Me for it, and whenever you suffer misfortune and distress, creep and cling to Me. I, yes, I, will give you enough and help you out of every need; only let not your heart cleave to or rest in any other.</p></blockquote>
<figcaption>— <a href="../authors/martin-luther.html">Martin Luther</a>, <cite>The Large Catechism</cite>, First Commandment</figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7d52868f27" data-kw="">
<blockquote><p>Every sin invades the rights of God and strips him of one or other of his perfections. It is such a vilifying of God as if he were not God; as if he were not the supreme Creator and benefactor of the world; as if we had not our being from him; as if the air we breathed in, the food we lived by were our own by right of supremacy, not of donation.… That affection that excites a man to break his law would excite him to annihilate his being if it were in his power. A man in every sin aims to set up his own will as his rule and his own glory as the end of his actions, against the will and glory of God; and could a sinner attain his end, God would be destroyed: God cannot outlive his will and his glory.</p></blockquote>
<figcaption>— <a href="../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>The Existence and Attributes of God</cite>, Discourse 2, On Practical Atheism (every sin invades God’s rights)</figcaption>

</figure><figure class="quote" id="q-6b796f8cf5" data-kw="">
<blockquote><p>That which we most love we worship as our God; for love is an act of soul-worship.… This is undoubtedly true, if we intend hereby that love which is superlative and transcendent; for to be loved above all things is an act of honour, worship, which the Lord challenges as his due in peculiar, Deut. 6:5.… Other things may be loved, but he will be loved above all other things.… He looks upon us as not worshipping him at all, not taking him for a God, when we love other things more, or as much as himself, 1 John 2:15.… Those that love their riches, the things of the world, more than, or equally with, God, they make these their gods.… Love, whenever it is inordinate, it is an idolatrous affection.… That which we most trust we make our god; for confidence and dependence is an act of worship which the Lord calls for as due only to himself.… Trust in the creature is always idolatrous.</p></blockquote>
<figcaption>— <a href="../authors/david-clarkson.html">David Clarkson</a>, <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (love and trust as soul worship)</figcaption>

</figure><figure class="quote" id="q-83366dc9c8" data-kw="">
<blockquote><p>And the reasons the man adds of this his assertion contain the grand plea of all idolaters, heathenish and antichristian: &quot;Whatever is given to them,&quot; saith he, &quot;who are in that subordination is given to God.&quot; So said the Pagans of old, so say the Papists at this day; all redounds to the glory of God, when they worship stocks and stones, because he appoints them so to do. And so said the Israelites when they worshipped the golden calf: &quot;It is a feast to Jehovah.&quot;</p></blockquote>
<figcaption>— <a href="../authors/john-owen.html">John Owen</a>, <cite>Vindiciae Evangelicae</cite>, ch. 19</figcaption>

</figure><figure class="quote" id="q-7b7ba306fb" data-kw="">
<blockquote><p>This is one part of atheism and self-idolatry, to magnify ourselves, with the forgetfulness and to the injury of our Creator.… In ascribing the glory of what we do or have to ourselves, to our own wisdom, power, virtue, etc.… He regards Babylon as his heaven and himself as his idol, as if he were all and God nothing.… So much as we sacrifice to our own credit, to the dexterity of our hands, or the sagacity of our wit, we detract from God.</p></blockquote>
<figcaption>— <a href="../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>The Existence and Attributes of God</cite>, Discourse 2, On Practical Atheism (self-idolatry)</figcaption>

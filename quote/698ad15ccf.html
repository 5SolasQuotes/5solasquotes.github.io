<main class="wrap"><figure class="quote" id="q-698ad15ccf" data-kw="">
<blockquote><p>When addressing the House of Commons, the Westminster divines pointed out that the “ignorant” were to be barred from communion. This is also taught in the Larger Catechism, Q&amp;A 173. There has, however, been some debate as to precisely what this refers to. Judging by other sources it would appear that “points of lesser concernment” referred to extra-confessional issues, at least this appears to be how the stricter Covenanters received the Westminster standards (see here). What is interesting to note here is that the divines thought that ignorance concerning the sacraments was enough to warrant suspension from the Lord’s Table:

The Assembly of Divines, having received an Order from this Honourable House, requiring them to expresse the particulars of that Ignorance &amp; Scandall, for which they conceive, that some persons ought to be suspended from the communion, do humbly present their sense both of the one &amp; of the other, in manner following.

[1.] By Ignorance, we mean, not all weaknesse of Knowledge, or the want of knowledge of points of lesser concernment to all sorts: But a want of a competent measure of Understanding in the Grounds &amp; principles of Religion layd down in the holy Scriptures, particularly in these, concerning God, the Father, Sonne, &amp; Holy Ghost; the state of man by Creation, &amp; by his fall; the Redemption by Jesus Christ; the way &amp; means to apply Christ &amp; his benefits; the nature &amp; necessity of Faith, Repentance &amp; a godly life; the nature &amp; use of the Sacraments; &amp; the condition of man after this life. […]

3. When any are found guilty of such Ignorance, or such Scandalls, we humbly conceive they ought to be suspended from the Communion, until they give sufficient proofe of their knowledge &amp; of their Repentance: The tryall of all which, we humbly conceive, is to be referred to the Eldership of the particular Congregation, of which any are reputed members; it being impossible to make such an enumeration of all particulars, as may be universally applicable to all persons and cases.

4. In this we have been the more bold to present our humble desires to the Honourable Houses, because other Reformed churches do in this manner take a triall of the knowledge of all those that would come to the Lords Supper, before they do admit them, &amp; withhold such as are found ignorant, as also those that are found scandalous, from the sacrament, untill they have sufficient proofe of the knowledge of the one sort, &amp; the Repentance of the other.

5. In the managing of all which, the Eldership is to proceed with all christian moderation &amp; prudence: And in case any person should be injured herein, there is a Remedy by the subordination of Assemblyes.

William Twisse prolocutor

Henry Roborough. Scriba

Adoniram Byfield scriba</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-westminster-divines.html">The Westminster divines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Honourable the House of Commons assembled in Parliament, 25 Mar. 1645 in The minutes and papers of the Westminster Assembly 1643-1652</cite>, ed. Chad VanDixhoorn (5 vols, Oxford: Oxford University Press, 2012), v, 182-4.</span></figcaption>

</figure><figure class="quote" id="q-9a44bb35d9" data-kw="">
<blockquote><p>Of those who desire truly Christian government only a small band are “political dissenters.” Admit that they are the far-seeing, the logical, the consistent, and the courageous national reformers; give them the credit of occupying “the post of honour in the forefront of the hottest battle.” … ; admit that they hold a place in the National Reform movement similar to that of the Garrisonians in the Anti-Slavery movement. … It by no means follows that political dissent is the only way, or even the principal way, to promote the cause of National Reform. It by no means follows that this cause is to be carried by the conversion of any considerable number of “the members of other churches to political dissent.” It by no means follows that political dissent should be insisted upon as essential to the National Reform movement.

In the January R. P. and C. [Reformed Presbyterian and Covenanter] it is clearly intimated that the National Reform movement, with its organ, the Christian Statesman, should be placed on the ground of political dissent. Reference is made to the Garrisonian movement as showing how potent, if not omnipotent, was political dissent in the antislavery conflict. Let it not be forgotten that the Garrisonians never made political dissent their main theme, never made political dissent a test for anti-slavery workers, never aimed to convert any considerable number of the anti-slavery people to their views. What would have been the result had they won over a majority of the anti-slavery people, is a question which only the lineal descendants of the schoolmen would care to ask.

What would be the result should we adopt the suggestion made in the November number of Our Banner, i.e. Should we send out a corps of true (?) National Reformers “to win over the members of other churches to political dissent,” is a question which must take its place beside the unanswerable question. What shall we do with all the larks we shall catch when the skies fall? Is it not notorious that the ablest and most faithful and zealous of our ministers, even those who insist that political dissent should be kept in the front of all national reform work, instead of winning over the members of other churches, have barely been able to keep their own people true to their ideas of political dissent?

No; the Garrisonians and the Covenanters, in their opposition to slavery, never dreamed of success by means of the conversion of the anti-slavery hosts to their views; and their success came without any such conversion. What they steadily aimed to do was to win over a majority of the people to a position of determined opposition to slavery. Nor is this whole work to be ascribed to them alone. They were the forerunners of “the great uprising for liberty and justice.” God employed them to do a noble work, for which let them be rewarded with immortal honour; but let us not forget that scores, hundreds, millions of others were employed to do a work none the less necessary to be done. A grand debate, which lasted for 30 years. debate in the Congress of the United States with a continent for an audience, resulted in the overthrow of slavery, first from its dominant place in the government by the election of Abraham Lincoln, and then from the whole land by battle.

To give the whole credit of the success of the anti-slavery movement to the little band of political dissenters, taking no note of all that was done by such men as Seward, Sumner, Chase, Stanton, Lincoln, yes, such men as Grant, Sherman and John Brown, and millions of those who for a lifetime wrought, prayed, voted and fought against slavery, without ever once dreaming of political dissent, is about as fair a representation of the beginning, progress and consummation of the anti-slavery movement as to represent that we owe the splendour and glory of the brightest summer day to the light of the morning star.

Of the hosts that, in debate and in tattle carried the anti-slavery cause to success, only a very small band were political dissenters. To put it mildly, is there not every reason to believe that the advocates and champions of the National Reform movement will need the aid of others than political dissenters? In fact, notice that those who make the most of political dissent do themselves, always in the end, admit that the amendment must be carried by those who are not political dissenters; and some of them maintain that it must be carried by them alone, since political dissenters could not even vote for the complete amendment, were it proposed, because, according to them, this would be inconsistent with “political dissent.</p></blockquote>

In the January R. P. and C. [Reformed Presbyterian and Covenanter] it is clearly intimated that the National Reform movement, with its organ, the Christian Statesman, should be placed on the ground of political dissent. Reference is made to the Garrisonian movement as showing how potent, if not omnipotent, was political dissent in the antislavery conflict. Let it not be forgotten that the Garrisonians never made political dissent their main theme, never made political dissent a test for anti-slavery workers, never aimed to convert any considerable number of the anti-slavery people to their views. What would have been the result had they won over a majority of the anti-slavery people, is a question which only the lineal descendants of the schoolmen would care to ask.

What would be the result should we adopt the suggestion made in the November number of Our Banner, i.e. Should we send out a corps of true (?) National Reformers “to win over the members of other churches to political dissent,” is a question which must take its place beside the unanswerable question. What shall we do with all the larks we shall catch when the skies fall? Is it not notorious that the ablest and most faithful and zealous of our ministers, even those who insist that political dissent should be kept in the front of all national reform work, instead of winning over the members of other churches, have barely been able to keep their own people true to their ideas of political dissent?

No; the Garrisonians and the Covenanters, in their opposition to slavery, never dreamed of success by means of the conversion of the anti-slavery hosts to their views; and their success came without any such conversion. What they steadily aimed to do was to win over a majority of the people to a position of determined opposition to slavery. Nor is this whole work to be ascribed to them alone. They were the forerunners of “the great uprising for liberty and justice.” God employed them to do a noble work, for which let them be rewarded with immortal honour; but let us not forget that scores, hundreds, millions of others were employed to do a work none the less necessary to be done. A grand debate, which lasted for 30 years. debate in the Congress of the United States with a continent for an audience, resulted in the overthrow of slavery, first from its dominant place in the government by the election of Abraham Lincoln, and then from the whole land by battle.

To give the whole credit of the success of the anti-slavery movement to the little band of political dissenters, taking no note of all that was done by such men as Seward, Sumner, Chase, Stanton, Lincoln, yes, such men as Grant, Sherman and John Brown, and millions of those who for a lifetime wrought, prayed, voted and fought against slavery, without ever once dreaming of political dissent, is about as fair a representation of the beginning, progress and consummation of the anti-slavery movement as to represent that we owe the splendour and glory of the brightest summer day to the light of the morning star.

Of the hosts that, in debate and in tattle carried the anti-slavery cause to success, only a very small band were political dissenters. To put it mildly, is there not every reason to believe that the advocates and champions of the National Reform movement will need the aid of others than political dissenters? In fact, notice that those who make the most of political dissent do themselves, always in the end, admit that the amendment must be carried by those who are not political dissenters; and some of them maintain that it must be carried by them alone, since political dissenters could not even vote for the complete amendment, were it proposed, because, according to them, this would be inconsistent with “political dissent.”

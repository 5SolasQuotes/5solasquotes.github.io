<blockquote><p>2. Though a Church retain the fundamentals, yet if we be forced to avow and believe as truth, doctrines everting the foundation of faith, against the article of one God, if we must worship as many gods as there be hosts, if Christ’s kingly, priestly and prophetical office be overturned, as we were forced in Popery to do, we are to separate from the Church in that case.</p></blockquote>

<blockquote><p>6. Whatever sad differences be oft amongst these [Christians], which both their darkness of mind and contrariety of natural dispositions may influence, yet does not still that blessed unity of the Spirit stand fixed and sure, by which the whole race of the saints are united in a new and spiritual nature in these sweet and sensible communications of the Spirit, and do all meet in one blessed center, yea so near an intercourse of souls and sympathy does result thence (however the sad prevalence of corruption may for some time darken the same) as no union and concord like this is in all the societies of the earth, and may be such a witness to the truth of Christianity, as to silence even the greatest atheist.</p></blockquote>

</figure><figure class="quote" id="q-321cf00249" data-kw="">
<blockquote><p>We shall here declare what offences are censurable with this greatest and last censure of excommunication, according to the order that is there prescribed, and which, as it requires, ‘that it be inflicted with great and mature deliberation, and after all other good means have been essayed;’ so it appoints in these express words: ‘That such errours in practice as subvert the Faith, or any other errours which overthrow the power of godliness; if the party who holds them spread them, seeking to draw others after him; and such sins in practice as cause the name and truth of God to be blasphemed, cannot stand with the power of godliness; and such practices, as in their own nature manifestly subvert that order, unity and peace which Christ has established in his Church; and particularly all those scandalous sins, for which any person is to be suspended from the sacrament of the Lord’s Supper, obstinately persisted in; these being publicly known, to the just scandal of the Church; The sentence of excommunication may and ought to proceed, according to the directions after following. But the persons that hold other errors in judgment, about which learned and godly men possibly may and do differ, and which subvert not the faith, nor are destructive to godliness, or that be guilty of such sins of infirmity as are commonly found in the children of God: or being otherwise sound in the Faith and holy in life (and so not falling under censure by the former rules) endeavour to keep the unity of the spirit in the bond of peace; and do yet out of conscience not come up to the observation of all those rules which are or shall be established by authority for regulating the outward worship of God and government of his Church; the sentence of excommunication for these causes shall not be denounced against them.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancaster-presbyterians.html">Lancaster Presbyterians</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Censures of the Church Revived</cite>, … (London: Eversden, 1659) sect. 4, p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-ddd1e27fbd" data-kw="">
<blockquote><p>1. There is a separation Negative, or a non-union, and a separation Positive. Though a Church of schismatics retaining the sound faith, yet separating from [the] other [Church]…

2. If the whole and most part of the Church turn idolatrous, and worship idols (which is essential idolatry) we are to separate from that Church: the Levites and the two tribes did well, as Mr. [John] Ball says, to make a separation from Jeroboam’s calves; and the godly laudably, 2 Kn. 16:11, did not separate from the Israel and Church of God, because the Altar of Damascus was set up and because of the high places. Things dedicated unto idols, as Lutheran images, may be called, and are called, 1 Cor. 10:34, idolatry, yet are they idolatry by participation, and so the cup of devils, 1 Cor. 10. Paul does not command separation from the Church of Corinth and the Table of the Lord there. 3rd Consideration. There is a separation from the Church in the most part, or from the Church in the least and best part. In Achab’s time Israel, and the Church thereof, for the most part, worshipped Baal; Elijah, Micaiah, Obadiah, and other godly separated from the Church of Israel in the most part: Jeremiah wished to have a cottage in the wilderness (no doubt a godly wish) that he might separate from the Church all then for the most part corrupted, yet remained they a part of the visible Church and a part in the visible Church, and therefore did he not separate from the Church according to the least and best part thereof; [Note that the difference above is over fundamental issues, not every degree of purity in fundamentally sound churches.] The godly in England who refused the Popish ceremonies and Antichristian bishops did well not to separate from the visible Church in England, and yet they separated from the mainest and worst part, which cannot be denied to be a ministerial Church. 4th Consideration. If a Church be incorrigible in a wicked conversation, and yet retain the true faith of Christ, it is presumed God has there some to be saved, and that where Christs ordinances be, there also where Christ’s ordinances be, there also Christ’s Church-presence is; And therefore I doubt much if the Church should be separated from, for the case is not here as with one simple person, for it is clear, all are not involved in that incorrigible obstinacy, and that is yet a true visible communion, in which we are to remain, for there is some union with the head Christ, where the faith is kept sound, and that visibly; though a private brother remaining sound in the faith, yet being scandalous and obstinately flagitious be to be cast off, as an heathen, yet are we not to deal so with an orthodox Church, where most part are scandalous. … 6. We may well hold that Ambrose says well (Commentary on Luke, bk. 6, ch. 1), that a Church wanting the foundation of the apostles is to be forsaken. … 8. There may be causes of non-union with a Church, which are not sufficient causes of separation: Paul would not separate from the Church of the Jews, though they rejected Christ, till they openly blasphemed, Acts 13:44-46; 18:16. And when they opposed themselves and blasphemed, Paul shook his raiment and said unto them, ‘Your blood be upon your own heads, I am clean, from henceforth I will go to the gentiles.’ There is a lawful separation, and yet before the Jews came to this, there was no just cause why any should have joined to the Church of the Jews, who denied the Messiah, and persecuted his servants, Acts 4-5, seeing there was a cleaner Church, to which converts might join themselves, Acts 2:40-42.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (London: Griffin, 1644), pt. 2, ch. 4, sect. 5, Question 3, In what cases it is lawful to separate from a Church?, pp. 253-55</span></figcaption>

ty+in+fundamentally+sound+churches.%5D+The+godly+in+England+who+refused+the+Popish+ceremonies+and+Antichristian+bishops+did+well+not+to+separate+from+the+visible+Church+in+England%2C+and+yet+they+separated+from+the+mainest+and+worst+part%2C+which+cannot+be+denied+to+be+a+ministerial+Church.+4th+Consideration.+If+a+Church+be+incorrigible+in+a+wicked+conversation%2C+and+yet+retain+the+true+faith+of+Christ%2C+it+is+presumed+God+has+there+some+to+be+saved%2C+and+that+where+Christs+ordinances+be%2C+there+also+where+Christ%E2%80%99s+ordinances+be%2C+there+also+Christ%E2%80%99s+Church-presence+is%3B+And+therefore+I+doubt+much+if+the+Church+should+be+separated+from%2C+for+the+case+is+not+here+as+with+one+simple+person%2C+for+it+is+clear%2C+all+are+not+involved+in+that+incorrigible+obstinacy%2C+and+that+is+yet+a+true+visible+communion%2C+in+which+we+are+to+remain%2C+for+there+is+some+union+with+the+head+Christ%2C+where+the+faith+is+kept+sound%2C+and+that+visibly%3B+though+a+private+brother+remaining+sound+in+the+faith%2C+yet+being+scandalous+and+obstinately+flagitious+be+to+be+cast+off%2C+as+an+heathen%2C+yet+are+we+not+to+deal+so+with+an+orthodox+Church%2C+where+most+part+are+scandalous.+%E2%80%A6+6.+We+may+well+hold+that+Ambrose+says+well+%28Commentary+on+Luke%2C+bk.+6%2C+ch.+1%29%2C+that+a+Church+wanting+the+foundation+of+the+apostles+is+to+be+forsaken.+%E2%80%A6+8.+There+may+be+causes+of+non-union+with+a+Church%2C+which+are+not+sufficient+causes+of+separation%3A+Paul+would+not+separate+from+the+Church+of+the+Jews%2C+though+they+rejected+Christ%2C+till+they+openly+blasphemed%2C+Acts+13%3A44-46%3B+18%3A16.+And+when+they+opposed+themselves+and+blasphemed%2C+Paul+shook+his+raiment+and+said+unto+them%2C+%E2%80%98Your+blood+be+upon+your+own+heads%2C+I+am+clean%2C+from+henceforth+I+will+go+to+the+gentiles.%E2%80%99+There+is+a+lawful+separation%2C+and+yet+before+the+Jews+came+to+this%2C+there+was+no+just+cause+why+any+should+have+joined+to+the+Church+of+the+Jews%2C+who+denied+the+Messiah%2C+and+persecuted+his+servants%2C+Acts+4-5%2C+seeing+there+was+a+cleaner+Church%2C+to+which+converts+might+join+themselves%2C+Acts+2%3A40-42.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries%2C+%E2%80%98Acts+15%2C+A+Pattern+of+a+Juridicial+Synod%E2%80%99%2C+%28London%3A+Griffin%2C+1644%29%2C+pt.+2%2C+ch.+4%2C+sect.+5%2C+Question+3%2C+In+what+cases+it+is+lawful+to+separate+from+a+Church%3F%2C+pp.+253-55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fddd1e27fbd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ddd1e27fbd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=1.%20There%20is%20a%20separation%20Negative,converts%20might%20join%20themselves%2C%20Acts%202%3A40%2D42&amp;text=1.%20There%20is%20a%20separation%20Negative%2C%20or%20a&amp;text=to%20which%20converts%20might%20join%20themselves%2C%20Acts%202%3A40%2D42" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ca4866a32c" data-kw="">
<blockquote><p>And what shall I say in the conclusion, now I am near to my departure from this contentious world? but sound a retreat to all these unhappy militants, that will not let holiness prosper by the necessary advantage of peace. Cease your proud contendings, O vain-glorious militant clergy! Learn of the Prince of peace and the holy angels that preached Him, to give glory to God in the highest, who gives peace on earth, and well-pleasedness in (or towards) men. Did Christ or his apostles make such work for Christians as you do? The great Shepherd of the flock will take your pretences of order, orthodoxness (or truth) and piety for no excuse for your corrupting order, faith and practice by your tyranny, self-conceitedness and blind zeal and superstition; and for using his name against Himself, to the destroying of that love, and concord and unity which He has bequeathed to his Church; and for serving his enemy, and dividing his people, and hardening infidels and ungodly ones by these scandals. Return to the primitive simplicity, that we may return to unity, love and peace. Dream not of them upon your own corrupting terms. And read and read over again and again James 3, which does describe you, condemn you, and instruct you. If you say, ‘Physicion heal thyself: Who has wrote more of controversies?’ I answer, peruse what I have written and you will see it is of controversies, but against controversies, tending to end and reconcile. If anything be otherwise (except necessary defence of certain necessary faith or duty), I retract it and condemn it: Let it be as not written. I have meddled much with controversies in this book: but it is to end them. The God of Peace give wisdom and peaceable principles, minds and hearts to his servants, that (though I shall not live to see it) true love and piety may revive in the Christian world, by the endeavors of a healing ministry, and the shaming, restraint and reformation of the contentious clergy, whether tyrannical, dogmatical or superstitious.</p></blockquote>

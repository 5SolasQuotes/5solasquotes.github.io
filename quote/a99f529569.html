<main class="wrap"><figure class="quote" id="q-a99f529569" data-kw="">
<blockquote><p>Man is first created; and because for his good, it is necessary, “the Sabbath is,” subsequently, “made for man.” The being whom God has created must have his best interests provided for at whatever cost. The earth not only must bring forth to him fruit for food, tree whose seed is in his kind, and all manner of herb; but the heavens, with their glorious and gigantic host, must be subjected to the law which demands man’s best and highest happiness; and their myriad orbs must circle onwards in an ever-moving order, regulated to his necessity, marking off to him his times and his seasons, and bringing round to him; at its proper, and heaven-appointed interval, this holy day of rest. And thus it is that, in evidence of God’s love to man, “the Sabbath is made for him.”

How beautifully is the spirit of the gospel seen reigning here, changing the law of bondage into the “perfect law of liberty!” (James i. 25.) And how ought this to infuse a spirit of love and joy into all our Sabbath observance! Had it been otherwise – had we been introduced into a series of arrangements completed without respect to, or without thought of us, and for the farther perfecting of which we derived our being and our place in God’s universe – we would have been under the strictest law to God, not to frustrate this object of our creation; and the Sabbath would have demanded from us the most strict and holy observance, as containing in itself the very cause and reason of our existence; and Sabbath desecration would have been the most audacious rebellion against the Lord of the Sabbath, who had shown his regard for the day of rest, making mand for the Sabbath.

But, oh! With how much greater force does the command to sanctify the holy day come upon us, when we are told that in love to us it was designedly instituted. And how should it come to us, not so much as the utterance of a lawgiver demanding acknowledgment of his own authority and glory, as the kindly request of a loving parent, entreating us to take advantage of a plan he had devised, for perfecting our own highest happiness and interest!

Oh! If fear and subjection would, in the one case, have produced a full and perfect compliance, how much more ought this to be accomplished now by responsive gratitude and love; and remembering at how tremendous an expense of wisdom and of power he hath caused the heavenly emblems of his omnipotence to bring round to us the day of rest, the Sabbath, made for our good, ought we not to be prepared to meet, in a responsive spirit of love, the command, “Remember the Sabbath-day to keep it holy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath made for Man: A Sermon Preached in the Free Church, Panbride, on February 2, 1845. In accordance with the Recommendation of the General Assembly</cite>, (Dundee: McCosh, 1845), pp 9-10.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eb630e1512" data-kw="">
<blockquote><p>That the Sabbath has existed from the beginning; that it was given to man in Paradise — an institution not for the Jews only, but for man and for all time — never since abolished or superseded; that it was re-published from Sinai, not as a mere ceremonial appointment, but as part of that moral law which is of immutable obligation; and that at the time of the resurrection of Christ, while for a very sufficient reason, the day of observance was changed, the commandment continued still in force, linked through all succeeding ages with new associations, as the memorial of finished redemption as well as of creation.

Such is substantially the doctrine of all our Presbyterian Churches, as set forth in those [Westminster] standards which we all acknowledge, and notwithstanding what has recently occurred, may be looked upon as the common belief of Presbyterian Scotland still, regarding the grounds of the obligation of the Sabbath. In England, as well as in Scotland, it was the commonly received opinion, not only among the Puritans, but among the most distinguished divines of the Church of England, that from the beginning of the world to the present time, the Sabbatic law has continued to be the same.</p></blockquote>

<blockquote><p>Ma. It may seem that this Law doth condemn the art of Painting and Graving ; so that it is not lawful to have any images at all.

Sch. Not so: For in this first Table he speaketh not of any artificial thing civilly to be used, but only treateth of things which do appertain to the worshipping of God.

Ma. What is then the meaning of this Commandment?

Sch. In this second Commandment, God first forbiddeth us to make any Images to express or counterfeit him, or to seek him or to worship him in Images. And secondly, he chargeth us, not to worship the Images themselves or to abuse them in any wise by Idolatry or Superstition: but that we worship God alone in spirit and truth and as himself hath commanded us in his Word, to worship him, and not otherwise, after our own fantasies.

Ma. Why is it not lawful to express GOD with a bodily and visible form?

Sch. Because there can be no likeness or agreeing between God, who is a spirit, eternal, infinite, unmeasurable, incomprehensible, and a bodily, frail, dead, and vain shape or Image.</p></blockquote>

<blockquote><p>There is a political end of the Sabbath, viz. The refreshment and recreative breathing of the outward man, a relaxation of the body from the pains and toil of the week; and therefore the Sabbath is called a rest. It is said of God Himself that on the seventh day He rested and was refreshed, Ex. 31:17. And how much more does poor man stand in need of rest and refreshment? Death indeed fairly unpins our tabernacle of clay, folds it up and lays it in the grave, but too much labour tears it down; man’s body is taken down by death, is thrown down by too much toil, therefore the wearisome labours of the week must be allayed by the rest of the Sabbath. The very name of a Sabbath signifies nothing but rest, strongly to argue, that that holy day was appointed for mans relaxation from the hurries of the world, and the sweats of the week. The Sabbath is a rest to the body and a revival to the soul, the body’s ease, and the soul’s enjoyment; the outward man on the Sabbath recovers strength, and the inward man receives Christ: Our exhausted spirits on God’s holy day are sweetly recruited, and our importunate souls are rarely answered, they then prey upon a Christ offered in the Gospel. Plato observes that the gods willing to recrui• mankind over-toiled with labour, in pity have appointed festival days for their ease and relaxation. Thus that heathen philosopher gives in his verdict to this particular; Indeed God’s blessed Sabbath shores up a piece of clay, and it builds up a piece of eternity, the precious and the immortal soul. The Sabbath is the body’s friend, and the soul’s fosterer; the body’s rest-time, and the soul’s term-time.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1b49b0f61f" data-kw="">
<blockquote><p>Mr. Anthony Wotton, a man, by Mr. Walker’s own confession, of special note for his piety, life and learning, while he lived, which both the University of Cambridge and the City of London are able also to give ample testimony unto;” – Mr. Anthony Wotton’s Defence, Preface, p. 3 Wiki: “In 1611 George Walker (1581?-1651) accused him of Socinianism; this led to a ‘conference’ of learned divines, which ended in Wotton’s vindication. The controversy went on till 1615, and in 1641, long after Wotton’s death, Walker repeated his accusations. This provoked Mr. Anthony Wotton’s Defence (Cambridge, 1641, published under the name of Thomas Gataker, who, however, only wrote the postscript, the Defence being by Wotton’s son, Samuel… Walker replied in A True Relation of the Chief Passages between Mr. Anthony Wotton and Mr. George Walker in … 1611, and in the Years next following … till 1615 (London, 1642, 4to).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-wotton.html">Anthony Wotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Reconciliation of a Sinner… in which the Doctrine of the Anglican Church on the Justification of the Ungodly is explicated and defended (Basil, 1624) 445</cite>, pp. no ToC</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-513ea6e239" data-kw="">
<blockquote><p>10. The form of active justification we hold to be both the plenary remission of sins and the imputation of the righteousness of Christ; nor do we hold that these phrases ought to be either equated or confounded. The form of passive justification we constitute in the apprehension and sense of both in subjects who are capable thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on Justification’ in Disputationum Theologicarum Miscellaneorum Pars Prima (Geneva: Chovet, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-e06d74f326" data-kw="">
<blockquote><p>Our justification means not only that our sins are forgiven and that we have been declared to be righteous by God Himself, not merely that we were righteous at the moment when we believed, but permanently righteous. For justification means this also, that we are given by God the positive righteousness of His own Son, the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/d-martyn-lloyd-jones.html">D. Martyn Lloyd-Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Depression – Its Causes and its Cures</cite>, p. 74</span></figcaption>

</figure><figure class="quote" id="q-c10208e521" data-kw="">
<blockquote><p>Not any protestant divine… did ever teach that faith, new obedience, repentance are grounds upon which God justifies a sinner.</p></blockquote>

— Samuel Rutherford, Christ Dying &amp; Drawing Sinners to Himself, p. 77">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNot+any+protestant+divine%E2%80%A6+did+ever+teach+that+faith%2C+new+obedience%2C+repentance+are+grounds+upon+which+God+justifies+a+sinner.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself%2C+p.+77&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc10208e521.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c10208e521.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=Not%20any%20protestant%20divine,upon%20which%20God%20justifies%20a%20sinner&amp;text=Not%20any%20protestant%20divine&amp;text=are%20grounds%20upon%20which%20God%20justifies%20a%20sinner" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a6c3d9a315" data-kw="">
<blockquote><p>There are innumerable passages in Scripture in which forgiveness of sins is attributed to good works, proceeding from faith and the special aid of grace. to mot for the present that passage, St. James 2:24, where man is expressly said to be ‘justified by works, and not by faith only;’ to omit, I say, that passage, about the meaning of which there is such warm contention between the parties, and of which we will afterwards treat in its proper place, see Eze. 17:21, and 33:12, 14-16, 19; Mt. 6:14; 18:35; Lk. 6:37; James 5:19-20, etc. Nay, any one who attentively reads the Scriptures will find that there are perhaps more passages which exact the condition of good works for obtaining the pardon of sins and eternal life, than there are which require the condition of faith, simply so called (Apology for the Remonstrants’ Confession, ch. 22, p. 237 verso); although it [i.e. faith] is necessarily always understood (nay rather presupposed) in them all. Let whoever chooses consult the Collection of passages for good works taken from both Testaments by G. Wicelius (Coacervatio locorum utriusque Testamenti de absoluta necessitate bonorum operum), and others; but especially let him diligently, and without prejudice, read the Holy Scriptures themselves. Scripture also very frequently teaches that we are purged from sins by the participation of the sacraments. (Eph. 5:26; Acts 2:38; 22:16; Tit. 3:5-7; Mt. 26:27-28 and frequently others)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 1, ch. 3</cite>, pp. 39-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

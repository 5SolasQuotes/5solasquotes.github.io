<main class="wrap"><figure class="quote" id="q-ee337ad3d7" data-kw="">
<blockquote><p>What is God’s simplicity? That attribute of God whereby He is free of all composition and distinction. God is free: a) Of logical composition; in Him there is no distinction between genus and species. b) Of natural composition; in Him there is no distinction between substance and form. c) Of supernatural composition; in Him there is no distinction between slumbering capacity and action. Proof texts: 1 John 1:5; 4:8; Amos 4:2; 6:8. The Socinians and Vossius deny this attribute in order better to escape the Trinity, that is, the oneness in being of the three Persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: A System of Christian Theology Single Volume Edition</cite>, trans. and ed. Richard B. Gaffin, Jr. (Bellingham: Lexham Press, 2020), 19.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-274c512c3c" data-kw="">
<blockquote><p>§2. Just as the essence and existence of God do not really differ from His vital actuality [actuositas vitalis], but are distinguished only by a mental abstraction: so His understanding and willing are comprehended under His life, or most perfect thought, as by no means really distinct from one another, but as identified in God—so that the distinction here also is nothing but the abstraction of our mind.</p></blockquote>

</figure><figure class="quote" id="q-fc92de52bb" data-kw="">

</figure><figure class="quote" id="q-466c820d74" data-kw="">
<blockquote><p>Instance 1: If the persons are really the same as the essence, they are really the same among themselves; the reason is, because things which are the same with one third thing are the same among themselves. Response: This axiom must be limited: Things which are the same with one third singular incommunicable thing are the same among themselves. But the divine essence is communicable to the three persons. Thus Becanus, Scholastic Theology, treatise 2, ch. 2, quest. 3. Nothing prevents also adding the commonplace limitation to that axiom: They are the same among themselves with respect to that third thing. And thus the persons are the same among themselves with respect to the one and same essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1 tr. AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1, On the One &amp; Most Simple Essence of God, p. 225 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

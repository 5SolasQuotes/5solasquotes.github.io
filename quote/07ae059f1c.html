<main class="wrap"><figure class="quote" id="q-07ae059f1c" data-kw="">
<blockquote><p>But when expressions that import anger, or grief, are used [Gen. 6:6; Jud. 10:16; Ps. 78:40; 95:10; etc.], even concerning God Himself, we must sever in our conception everything of imperfection and ascribe everything of real perfection. We are not to think such expressions signify nothing, that they have no meaning, or that nothing at all is to be attributed to Him under them. Nor are we, again, to think they signify the same thing with what we find in ourselves and are wont to express by those names. In the divine nature, there may be real, and yet most serene complacency and displacency, viz. that are unaccompanied with the least commotion, and import nothing of imperfection, but perfection rather, as it is a perfection to apprehend things suitably to what in themselves they are… But we must take heed, lest, under the pretense that we cannot ascribe everything to God that such expressions seem to import, we therefore ascribe nothing. We ascribe nothing, if we do not ascribe to Him a real unwillingness that men should sin on, and perish; and consequently, a real willingness that they should turn to Him, and live; which so many plain texts assert. And therefore it is unavoidably imposed upon us to believe that God is truly unwilling of some things, which He does not think fit to interpose his omnipotency to hinder; and is truly willing of some things which He does not put forth his omnipotency to effect…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Redeemer’s Tears Wept Over Lost Souls, in Works, vol. 2</cite>, pp. 358-61</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ae9b64812a" data-kw="">
<blockquote><p>13. …There is all in God that is good, and perfect, and excellent in our desires and wishes for the conversion and salvation of wicked men. As, for instance, there is a love to holiness, absolutely considered, or an agreeableness of holiness to his nature and will; or, in other words, to his natural inclination. The holiness and happiness of the creature, absolutely considered, are things that he loves. These things are infinitely more agreeable to his nature than to ours. There is all in God that belongs to our desire of the holiness and happiness of unconverted men and reprobates, excepting what implies imperfection. All that is consistent with infinite knowledge, wisdom, power, self-sufficience, infinite happiness, and immutability. Therefore, there is no reason that his absolute prescience, or his wise determination and ordering what is future, should hinder his expressing this disposition of his nature, in like manner as we are wont to express such a disposition in ourselves, viz. by calls and invitations, and the like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Remarks on Important Theological Controversies, ch. 3, “Concerning the Divine Decrees in General, &amp; Election in Particular,” from paragraphs 9 &amp; 13, in The Works of Jonathan Edwards, ed. Edward Hickman (†1758), vol. 2, pp. 527-28 and in Select Works (Banner of Truth)</cite>, 2:528</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

ref="../quote/ae9b64812a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=There%20is%20all%20in%20God%20that,calls%20and%20invitations%2C%20and%20the%20like&amp;text=There%20is%20all%20in%20God%20that%20is%20good&amp;text=viz.%20by%20calls%20and%20invitations%2C%20and%20the%20like" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a51d71ac82" data-kw="">
<blockquote><p>The second consideration which we would have the Christian to take along with him when he begins to study the mercy and love of God is this: know that it is natural and native for Him to love; justice is his strange act, Isa. 28:21, importing his great unwillingness to be much taken up in the exercise of that attribute of justice. If we would ask the question, What is God? we could have no answer so suitable and pertinent to it as that which He has given Himself, He is merciful and loving. It is his great design, and likewise his desire, to be taken up in his attribute of mercy… And we conceive, that which does eminently declare how much God delights in mercy, and how natural it is for Him to love, is this: that notwithstanding there was a strong and invincible impediment laid in the way of the exercise of the attribute of mercy (which if angels and men had attempted to have loosed, should eternally have crushed and depressed them into the lowest hell), yet love was not hindered in its exercise by this strong impediment. O blessed be that love, for it was strong; and that good will, for it was wonderful: that when there was such an impediment laid in the way, it did put wisdom in exercise to find out the way how it might exercise itself towards man without leaving an imputation on justice! It likewise put omnipotent power to exercise, that it might exercise the decrees of wisdom that were such a holy and divine restraint on the love of God; and before the curse was proclaimed towards man for the breach of his holy law, love did propose the way how that everlasting curse, which man by his own hand had wrapped about his own neck, might be taken away…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-gray.html">Andrew Gray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works… (d. 1656; Aberdeen: King, 1839)</cite>, pp. 455-56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-f476704f37" data-kw="">
<blockquote><p>‘His strange work;’ the execution of his judgment against Israel, which He calls his strange work, to intimate either: … 2. That this work of bringing total and irrecoverable destruction upon Israel was contrary to the benignity of his own nature, and to the usual way of dealing with his people, whom He used and delighted to protect, and spare, and bless; and whom, even when He is angry with them, and punishes them, He handles more gently than He does other persons, in judgment remembering mercy to them, as was noted, Isa. 27:7-8; see also Isa. 26:11.</p></blockquote>

<blockquote><p>Moreover, [Iain] Murray thinks God’s universal love necessarily entails that God desires the highest good (i.e. the eternal salvation) of all men in the revealed will… this also answers the Gillite [from John Gill] position that God loves all merely in a temporal sense, but doesn’t desire their highest good, or in the sense of their eternal salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/excerpts.html">Excerpts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Review of David Silversides’s The Free Offer: Biblical and Reformed, from “Book Reviews,” in Banner of Truth, 507 (December 2005), p. 22. | Tony Byrne’s comments at the end are very important:</cite></span></figcaption>

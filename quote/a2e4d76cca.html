<main class="wrap"><figure class="quote" id="q-a2e4d76cca" data-kw="">
<blockquote><p>Walk in the ways of God, in his fear and love—keep communion with him and he will direct you: Ps. 25:13, ‘The secret of the Lord is with them that fear him; he will show them his covenant.’ God discovereth himself particularly to his own people. They are his friends, and you know friends reveal themselves mutually to one another in the greatest secrets; as Christ giveth the reason: John 15:15, ‘I have called you friends, for all things that I have heard of my Father, I have revealed to you.’ Those that keep up a continual acquaintance with God, by manifesting their love and fear of him, shall have divine mysteries manifested to them: Col. 1:26, ‘The mystery that was hid from ages is made manifest to the saints.’

Truths that have long lain hid through many successions and revolutions of ages, are at length made known to holy persons. Where there is purity, there is revelation: ‘The pure in heart shall see God,’ Mat. 5:8. They shall see more of his truth and mind in those things which if they should judge if by their own reason, they would contemn. So also it is said, Prov. 3:32, ‘His secret is with the righteous.’ They have not only other kinds of knowledge, but knowledge of the secret of such a way as is veiled with contempt, reproach, and unlikelihood to the world. Blind and carnal men sometimes stumble upon the despised ways of Christ; but they do but plough with the saints’ heifer, and light their torch at the altar. Their selfends and by-interests make them borrow from truth; but it is with them as it is with parrots, they speak the words of men not of reason but custom; they learn a truth when it is delivered, they have been used to such notions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition upon the Fifty-Third Chapter of Isaiah</cite>, (1703) in The Complete Works of Thomas Manton, D.D. (22 vols, London: James Nisbet &amp; Co., 1871), 3: 226.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

<blockquote><p>VII. An example is [the Lutheran] Matthias Flacius Illyricus, who, in a dispute against Victorinus Strigelius in the sixties of the last century, asserted that original sin is substantial and continued to assert it. He did not realize this implied that God, if not the author of sin as he denied, was not the Creator of all substances and things, thus implying two creators and two gods. Flacius did not understand or admit that this followed from his premises. It is unjust to say that Flacius held there were two gods, although this could be deduced from his opinions by sound consequences.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-calixt.html">George Calixt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Judgment on Theological Controversies agitated between the Lutherans &amp; Reformed, and on the mutual brotherhood and tolerance of parties because of consensus</cite>, tr. by AI by WesternCatholike (1650; Leiden, 1652), pp. 4-5</span></figcaption>

</figure><figure class="quote" id="q-7126c0e937" data-kw="">
<blockquote><p>On the other hand, we must labour for humility, prudence, gentleness, meekness. A man may be very zealous and resolute, and yet very meek and merciful: Jesus Christ was a Lion and yet a Lamb also; in one place, He telleth them He cometh to send “fire on the earth:” and, in another place, rebuketh His disciples “for their fiery spirits.” There was the composition in Moses, and in Paul; and it is of great use, especially in this work of reformation.

I have not observed any disputes carried on with more bitterness in men’s writings, and with a more unsanctified heat of spirit, yea, and by godly men too, than in controversies about discipline, church government, ceremonies, and the like. Surely, to argue about government with such ungoverned passions, to argue for reformation with a spirit so unreformed, is very uncomely.

Let us be zealous, as Christ was, to cast out all, to extirpate and root out every plant His heavenly Father hath not planted; and yet let us do it in an orderly way, and with the Spirit of Christ, whose servants we are. “The servant of the Lord must not strive, but be gentle to all men, apt to teach, patient, in meekness instructing those that oppose.” We solemnly engage this day our utmost endeavours for reformation; let us remember this, that too much heat, as well as too much coldness, may harden men in their ways, and hinder reformation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Solemn League and Covenant. Exhortation at Westminster (1643) in James Kerr (ed.), The Covenants and the Covenanters: Covenants, Sermons, and Documents of the Covenanted Reformation</cite></span></figcaption>

</figure><figure class="quote" id="q-049837a5a4" data-kw="">
<blockquote><p>[T]he Gospel, guide of my pilgrim steps to a better world, sheds many precious blessings on this one. I believe it was intended to do so. This is no accident; ’tis the purpose of Him who, our pattern as well as propitiation, divided his time between the interests of this world and the next; taught us to care for men’s bodies as well as for their souls, to carry a loaf of bread as well as a Bible to the houses of the poor; and who, with the very hand that had been opening the gates of Paradise, dried the cheek of grief, bound up bleeding hearts, gave a brother to a sister’s arms, and lighted with joy the dark abodes of sorrow.

What Christ was in temporal things to a narrow circle, Christianity has been to a wide one. What country has she ever entered without a troop of earthly blessings in her train? Christianity is not all for the next world. We are too apt to forget this — ministers as well as people; and I am not the servant of Jesus I should be, unless I walk in the footsteps of Him who spent his strength and passed his time as well in blessing men’s bodies as in saving their souls. Let not the Church forget her duty to the world. Let not the world forget what she owes to the Church; nor, in persecuting religion, be the senseless infant that, ignorant of what it owes a mother, beats the kind breast it hangs on.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-guthrie.html">Thomas Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God s Truth and Man’s Freedom: A Sermon’ in J. A. Wylie (ed.), Ter-Centenary of the Scottish Reformation, as Commemorated at Edinburgh, August 1860</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

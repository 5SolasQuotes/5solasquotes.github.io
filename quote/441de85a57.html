<main class="wrap"><figure class="quote" id="q-441de85a57" data-kw="">
<blockquote><p>The visible Church under the Old Testament, the charter of which was God’s covenant with Abraham, is likened by the Apostle Paul to a stately, wide-spreading olive tree. [Rom. 11] The race of Israel, incorporated in the Church, were the natural branches; converted Gentiles are the branches grafted in; and when Israel shall turn to the Lord, the natural branches shall be again restored; and the one goodly olive tree, verdant and beautiful, shall overspread all lands, and shall embrace, under its shadow, the people of all nations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Treatise on Christian Baptism</cite>, (1853) in Works: Doctrinal and Practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh, 1876), iii, 39-40.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/jews-and-muslims.html">Jews and Muslims</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-64ff8f668d" data-kw="">
<blockquote><p>First, we need to keep in mind the Fregean point that a difference in sense does not entail a difference in reference. To use Frege’s famous example, the sense of the expression “the morning star” is different from the sense of the expression “the evening star.” But these two expressions refer to one and the same thing, viz. the planet Venus. Similarly, expressions like “the God of the Christians” and “the God of the Muslims” differ in sense, but it doesn’t follow from that alone that they don’t refer to the same God… Second, even a speaker’s erroneous beliefs don’t entail that he is not referring to the same thing that speakers with correct beliefs are referring to… Similarly, the fact that Muslims have what Christians regard as a number of erroneous beliefs about God does not by itself entail that Muslims and Christians are not referring to the same thing when they use the expression “God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Christians, Muslims &amp; the Reference of ‘God”</cite>, (2015) 40 paragraphs</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/jews-and-muslims.html">Jews and Muslims</a></span></div>

</figure><figure class="quote" id="q-eb8b04a664" data-kw="">
<blockquote><p>Where are now the seven churches in the Lesser Asia? and where are many of those churches that were planted by the apostle of the Gentiles? Alas! their candlestick has been long ago removed out of its place, and the delusions of Mahomet prevail in those places where once the pure doctrines of the gospel were preached.</p></blockquote>

</figure><figure class="quote" id="q-700824f36e" data-kw="">
<blockquote><p>Every false theology and so-called theology is opposed to Christian theology in that it is either ignorant of Christ or speaks falsely about him. The former is professed by unbelievers, such as (1) the pagans, whom Paul separates into barbarians and Scythians (Col. 3:11); (2) the modern Jews, who also hatefully persecute Christ (I say modern, for in reality the ancient Jews thought the same thing concerning Christ as we do); and 3) the Muslims, who are aware of Christ and receive him, but only as an extraordinary prophet, not as the God-man Redeemer, over whom they even prefer that most crafty impostor Muhammad, and substitute his tenets found in the Qur’an for the divine oracles of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology Volume 1: Prolegomena</cite>, trans. Todd M. Rester, ed. Joel R. Beeke (1699; Grand Rapids MI: Reformation Heritage Books, 2018), 1.1.1.XXI, p. 79.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/jews-and-muslims.html">Jews and Muslims</a></span></div>
<div class="actions"><button class="copy" data-copy="“Every false theology and so-called theology is opposed to Christian theology in that it is either ignorant of Christ or speaks falsely about him. The former is professed by unbelievers, such as (1) the pagans, whom Paul separates into barbarians and Scythians (Col. 3:11); (2) the modern Jews, who also hatefully persecute Christ (I say modern, for in reality the ancient Jews thought the same thing concerning Christ as we do); and 3) the Muslims, who are aware of Christ and receive him, but only as an extraordinary prophet, not as the God-man Redeemer, over whom they even prefer that most crafty impostor Muhammad, and substitute his tenets found in the Qur’an for the divine oracles of Christ.”

</figure><figure class="quote" id="q-ec09ea65c9" data-kw="">
<blockquote><p>I have some parts of Mohammed’s Koran which in German might be called a book of sermons or doctrines of the kind that we call pope’s decretals. When I have time I must translate it into German so that everyone may see what a foul and shameful book it is.

In the first place, he greatly praises Christ and Mary as being the only ones without sin, and yet he believes nothing more of Christ than that he is a holy prophet, like Jeremiah or Jonah, and denies that he is God’s Son and true God. Furthermore, he does not believe that Christ is the Saviour of the world who died for our sins, but that he preached to his own time and completed his work before his death, just like any other prophet.

On the other hand, Mohammed highly exalts and praises himself and boasts that he has talked with God and the angels, and that since Christ’s office of prophet is now complete, he has been commanded to bring the world to his faith, and if the world is not willing to compel it or punish it with the sword; there is much glorification of the sword in it. Therefore the Turks think that their Mohammed is much higher and greater than Christ, for the office of Christ has come to an end and Mohammed’s office is still in force.

From this anyone can easily see that Mohammed is a destroyer of our Lord Christ and his kingdom, and if anyone denies the articles concerning Christ, that he is God’s Son, that he died for us and still lives and reigns at the right hand of God, what has he left of Christ? Father, Son, Holy Ghost, baptism, the sacrament, gospel, faith, and all Christian doctrine and life are gone, and instead of Christ only Mohammed with his doctrine of works and especially of the sword is left. That is the chief doctrines of the Turkish faith in which all abominations, all errors, all devils are piled up in one heap.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On War Against the Turk</cite>, (1528), trans. Charles M. Jacobs in Luther’s Works, 46: 176-77.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/jews-and-muslims.html">Jews and Muslims</a></span></div>

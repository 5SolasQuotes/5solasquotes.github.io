<main class="wrap"><figure class="quote" id="q-2dae8c6713" data-kw="">
<blockquote><p>2. How names are to be given to places, we cannot better learn than of those ancient founders of names, the holy Patriarchs: As Abraham Gen. 22:14 calls the mountain Jehovah-jireh, ‘The Lord hath seen.’ So Jacob gives holy names to the place where he met the angels, Gen. 32:2, and where he wrestled with the angel, v. 31. They, as we see, gave holy and reverent names unto places, not made peculiar for God’s service, but only for civil use for the places to be called and known by: how much more ought churches and houses of God to be called by his name? We therefore conclude that churches ought not to be erected in saints’ names, to worship them thereby and make them our patrons, mediators, and presenters of our prayers [as Romanists]: for this were great idolatry: Even like as the heathen called their temples by the names of their idols, Venus, Jupiter, Diana and the like: Yet we refuse not to call our churches by the names of saints, as they have been called of old, because we are not inventors of names; and terms inured by continual custom can hardly be left. We use them only as civil terms to distinguish places by: if any otherwise use them, for any religious purpose, they do amiss. And yet we deny not but that the names of holy men may be safely remembered by thanksgiving unto God for such excellent instruments, and setting before our eyes their good example. And concerning the names which have been superstitiously given in times past unto churches and other places (though it were to be wished that they never had been so given) yet now we use them (setting apart all superstition) as civil names of difference, as St. Luke [the author of Acts] describes the ship of Alexandria wherein they were carried, whose badge (says he) was Castor &amp; Pollux, Acts 28:11. In a civil matter of description, he refuses not to use the names of the heathen gods. Augustine also gives a good rule concerning such names. He speaks of the names of days, which were called after the names of heathenish idols, as the fourth day in the week, which we call Wednesday, was then called and is yet in the Latin tongue,Dies Mercurij, Mercury, his day. ‘Sic dicitur, a paganis, &amp; a multis Christianis, sed nolumus vt dicant, et vtinam corrigātur: melius de ore Christiano ritus loquendi ecclesiasticus procedit.’ So it is called of the heathen, and of many Christians, but I would not have them called so, and I wish they were amended: for a Christian kind of speaking best becomes a Christian. Sed si quem forte cōsuetudo traxerit, etc. sciat illos omnes homines fuisse. ‘But if custom prevail with a man so to speak, let him understand that all they were but men,’ whom the heathen take for gods. So say we, it were to be wished that we had names void of all show of superstition: but seeing for our speaking we must be ruled by custom, let us know that those saints by whose names places are called, are no gods, nor God’s fellows, nor patrons or mediators for us, nor any way to be worshipped: But they are the fellow servants of all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis Papismi… (London, 1592)</cite>, pp. 369-370</span></figcaption>

<blockquote><p>1. The root of the difference between the Old Nonconformists and the Conformists was that one sort thought they should stick to the mere Scripture rule and simplicity, and go far from all additions which were found invented or abused by the Papists, in doctrine, worship and government; and the other side thought that they should show more reverence to the customs of the ancient Church, and retain that which was not forbidden in the Scripture, which was introduced before the ripeness of the Papacy, or before the year 600 at least, and which was found lawful in the Roman Church, and common to them with the Greek, that we might not seem singular, odd and humorous, or to go further from the Papists than reason and necessity drave us. And the laity seemed nowhere so sensible of the difference as between the way of ceremony and unceremonious simplicity, and the way of our many short liturgic prayers and offices and the way of free-praying from the present sense and habits of the speaker; while pacificators thought both seasonably good.</p></blockquote>

<blockquote><p>3. It is strange divinity, ‘That that which is no sin, of itself, cannot be omitted without sin for the sole will and pleasure of men.’ [As the prelates argued] Human authority then may make it sin not to rub our beards, not to claw our heads, when we come to the Church to hear God’s Word. If human authority can make an indifferent act lawful, and the omission of it, sinful, [then] they may make all the indifferent acts in the world lawful acts; they might then make piping, leaping, laughing, acts of divine worship, and might make a Decalogue of their own: And if they may make an indifferent act to be sin, if it be omitted, they may by as good reason make sinful acts, as adultery, incest, murder, robbery, to be lawful acts; For if man’s inhibiting will be the formal reason of sin, then his commanding will must be the formal reason of obedience: And so rulers might command murder, robbery, incest, blasphemy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646)</cite>, p. 652</span></figcaption>

<blockquote><p>And to be precise, [Christ instituted the sacrament] ‘after washing their feet,’ as many [sources] say. For when the meal was begun (John 13:2), He rose from the table (verse 4) and washed the feet of his disciples, as was the customary practice of eastern peoples (Luke 7:44). He did so in order that by this exemplary action He might show them the way to humility and love, and testify his favor towards those who are his–that He is certainly the one who cleanses his people from their uncleanness (John 13:8-10, 14). And He did so in order to teach them by means of a comparison (and not a sacrament) with what frame of mind they ought to approach these sacred things. Even so the western church has, elsewhere and sometimes not without abuse, adopted the practice as a sacrament. … Nor do the following facts have any force of being required or observed: that the supper was given to them… after their feet had been washed… (some [things] of which were observed for some time in the early church).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-thysius.html">Antonius Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Synopsis of Purer Theology... (1625; Brill), vol. 3, Disputation 45, ‘On the Lord’s Supper’, pp. 183-85 &amp; 187</cite></span></figcaption>

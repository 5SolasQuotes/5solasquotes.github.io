<blockquote><p>The apostle signifies the same thing by different words when he says, ‘Ye are washed, ye are sanctified, ye are justified:’ he has said, ‘ye are washed,’ on account of holy baptism; ‘ye are sanctified,’ on account of the Holy Ghost; but ‘ye are justified,’ on account of justifying faith, etc.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c686c264f" data-kw="">
<blockquote><p>Justification is one, and immovable: That it is, and in what way XVIII. The justification taught so far is certainly one, and only one, first (1) by reason of the immutable divine decree (Gal. 3:8; Rom. 8:30), so that, just as all things are (Acts 15:18) so also the number of those to be justified, the abstract number as well as the concrete number, is known to him from eternity (2 Tim. 2:19), although from this eternal decree it ought not to be said that he justified actually from eternity (Gal. 3:8). (2) By reason of Christ, on whom, as the common principle and head of those to be justified, God placed each and every sin of each and every elect person, once and for all (2 Cor. 5:19). Finally, (3) also by reason of himself, insofar as after faith, once it is begun, it will continue without any interruption for eternity, nor will the sins of those once truly justified ever be actually revived again, although by succeeding sins they deserve to be revived (Ezek. 18:24). Yet this is so by such a unity that consists in flux, insofar as to individual sins, as soon as they have been perpetrated, after particular faith and repentance, the satisfaction and merits of Christ must be applied individually. And for this reason, as we have already taught, it has its own stages: (a) its beginning, which happens immediately after the first act of faith (John 3:16; 1:12); (b) its continuation, which is accomplished through continued acts of believing and repenting, according to the repetition and renewal of sins (2 Sam. 12:13); (c) its consummation, which will be accomplished before the tribunal as if by the living voice of the Judge (Matt. 25:34). And so also each person once justified can be, from faith and repentance, by virtue of the unmoved promise of God, infallibly certain of his own justification (John 3:16; Acts 10:43), because God cannot lie (Titus 1:2; Heb. 6:17–18).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’</cite>, p. 124</span></figcaption>

</figure><figure class="quote" id="q-7d996b190a" data-kw="">
<blockquote><p>The incarnation of Christ was once done and is not to be done again; but remission of sin is so done as that it is continually to be done for us, and the ultimate complete effect of it will then only be when sin shall be quite taken away, so that a total and full remission will be only at the Day of Judgment, as appears, Acts 3:19, ‘That your sins may be blotted out, when the times of refreshing shall come:’ Not but that every sin here forgiven is fully and perfectly forgiven, but because we renew sin daily, therefore there is need of a daily pardon: Away therefore with all such opinions as shall either plead such an inherent righteousness in the Pelagian way, or such an imputed righteousness in the Antinomian way that will overthrow this petition [in the Lord’s prayer] for forgiveness of sins.</p></blockquote>

<blockquote><p>3. To whomsoever the guilt of any particular sin is charged, he has either committed that sin or not committed it. 4. If he has committed it, he can in no other way be truly justified before God than by pleading the satisfaction of Christ, performed for him in general. 5. If he has not committed it, then his own innocence or righteousness may be pleaded for his justification; which is to be justified from his own works, or from a formal and inherent righteousness in himself, insofar as this is concerned.</p></blockquote>

</figure><figure class="quote" id="q-3658de9588" data-kw="">
<blockquote><p>There is therefore a twofold justification. One whereby, in ourselves being sinners, we are justified before God, from without us: The other whereby being now justified before God from without us, we are justified before Him within ourselves. The first of these is the cause of the second. The second is the effect and demonstration of the first. The first is done by faith, the other by works. Both must concur that the righteousness of the Law may be fulfilled in us… Let us speak fullier of the second sort of justification. It is that whereby God, by regeneration given us, and the works of sincere faith which we performed, absolves us from the charge of hypocrisy, profaness and impiety, and no longer takes us for men dead in sin, servants of the Devil and children of the world, but for true believers, his sons restored to his image, endued with his life and translated into his Kingdom: which judgment of God, the Law also approves. Not that it [the Law] takes it self-satisfied by our works, but because being bereaved of its dominion and subjected to Christ our Lord, it cannot choose but [to] commend the works which come from faith in Christ and from his Spirit, and account them for true righteousness, though they are imperfect; and them that perform them, for truly righteous and sons pleasing to God. Let it be here enquired, seeing Scripture does often and expressly ascribe to us both these righteousnesses we speak of, and therefore we are in respect of them both to be judged righteous, not only with men, but with God, whether in the same sense as we are said to be justified by works, Jam. 2, and to be justified by words, Mt. 12, works may not be said to be imputed to us for righteousness? Not indeed as faith is imputed to righteousness: but as the fact of Phineas is said to be imputed to him for righteousness, Ps. 106:31.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 10, sect. 3, pp. 342-52 in Richard Baxter’s Confession of his Faith… (London: 1655) The page numbering is misnumbered. The whole of sect. 3 has more on this topic, as Baxter quotes 80 authors in support of his views on the necessity of works for believers in salvation.</cite>, pp. 344-47</span></figcaption>

<div class="actions"><button class="copy" data-copy="“There is therefore a twofold justification. One whereby, in ourselves being sinners, we are justified before God, from without us: The other whereby being now justified before God from without us, we are justified before Him within ourselves. The first of these is the cause of the second. The second is the effect and demonstration of the first. The first is done by faith, the other by works. Both must concur that the righteousness of the Law may be fulfilled in us… Let us speak fullier of the second sort of justification. It is that whereby God, by regeneration given us, and the works of sincere faith which we performed, absolves us from the charge of hypocrisy, profaness and impiety, and no longer takes us for men dead in sin, servants of the Devil and children of the world, but for true believers, his sons restored to his image, endued with his life and translated into his Kingdom: which judgment of God, the Law also approves. Not that it [the Law] takes it self-satisfied by our works, but because being bereaved of its dominion and subjected to Christ our Lord, it cannot choose but [to] commend the works which come from faith in Christ and from his Spirit, and account them for true righteousness, though they are imperfect; and them that perform them, for truly righteous and sons pleasing to God. Let it be here enquired, seeing Scripture does often and expressly ascribe to us both these righteousnesses we speak of, and therefore we are in respect of them both to be judged righteous, not only with men, but with God, whether in the same sense as we are said to be justified by works, Jam. 2, and to be justified by words, Mt. 12, works may not be said to be imputed to us for righteousness? Not indeed as faith is imputed to righteousness: but as the fact of Phineas is said to be imputed to him for righteousness, Ps. 106:31.”

— Richard Baxter, ch. 10, sect. 3, pp. 342-52 in Richard Baxter’s Confession of his Faith… (London: 1655) The page numbering is misnumbered. The whole of sect. 3 has more on this topic, as Baxter quotes 80 authors in support of his views on the necessity of works for believers in salvation., pp. 344-47">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+therefore+a+twofold+justification.+One+whereby%2C+in+ourselves+being+sinners%2C+we+are+justified+before+God%2C+from+without+us%3A+The+other+whereby+being+now+justified+before+God+from+without+us%2C+we+are+justified+before+Him+within+ourselves.+The+first+of+these+is+the+cause+of+the+second.+The+second+is+the+effect+and+demonstration+of+the+first.+The+first+is+done+by+faith%2C+the+other+by+works.+Both+must+concur+that+the+righteousness+of+the+Law+may+be+fulfilled+in+us%E2%80%A6+Let+us+speak+fullier+of+the+second+sort+of+justification.+It+is+that+whereby+God%2C+by+regeneration+given+us%2C+and+the+works+of+sincere+faith+which+we+performed%2C+absolves+us+from+the+charge+of+hypocrisy%2C+profaness+and+impiety%2C+and+no+longer+takes+us+for+men+dead+in+sin%2C+servants+of+the+Devil+and+children+of+the+world%2C+but+for+true+believers%2C+his+sons+restored+to+his+image%2C+endued+with+his+life+and+translated+into+his+Kingdom%3A+which+judgment+of+God%2C+the+Law+also+approves.+Not+that+it+%5Bthe+Law%5D+takes+it+self-satisfied+by+our+works%2C+but+because+being+bereaved+of+its+dominion+and+subjected+to+Christ+our+Lord%2C+it+cannot+choose+but+%5Bto%5D+commend+the+works+which+come+from+faith+in+Christ+and+from+his+Spirit%2C+and+account+them+for+true+righteousness%2C+though+they+are+imperfect%3B+and+them+that+perform+them%2C+for+truly+righteous+and+sons+pleasing+to+God.+Let+it+be+here+enquired%2C+seeing+Scripture+does+often+and+expressly+ascribe+to+us+both+these+righteousnesses+we+speak+of%2C+and+therefore+we+are+in+respect+of+them+both+to+be+judged+righteous%2C+not+only+with+men%2C+but+with+God%2C+whether+in+the+same+sense+as+we+are+said+to+be+justified+by+works%2C+Jam.+2%2C+and+to+be+justified+by+words%2C+Mt.+12%2C+works+may+not+be+said+to+be+imputed+to+us+for+righteousness%3F+Not+indeed+as+faith+is+imputed+to+righteousness%3A+but+as+the+fact+of+Phineas+is+said+to+be+imputed+to+him+for+righteousness%2C+Ps.+106%3A31.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+ch.+10%2C+sect.+3%2C+pp.+342-52+in+Richard+Baxter%E2%80%99s+Confession+of+his+Faith%E2%80%A6+%28London%3A+1655%29+The+page+numbering+is+misnumbered.+The+whole+of+sect.+3+has+more+on+this+topic%2C+as+Baxter+quotes+80+authors+in+support+of+his+views+on+the+necessity+of+works+for+believers+in+salvation.%2C+pp.+344-47&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3658de9588.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3658de9588.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=There%20is%20therefore%20a%20twofold%20justification,to%20him%20for%20righteousness%2C%20Ps.%20106%3A31&amp;text=There%20is%20therefore%20a%20twofold%20justification.%20One%20whereby&amp;text=be%20imputed%20to%20him%20for%20righteousness%2C%20Ps.%20106%3A31" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

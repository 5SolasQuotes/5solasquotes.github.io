<main class="wrap"><figure class="quote" id="q-dd88b72fbc" data-kw="">
<blockquote><p>Preaching of the word, being the power of God unto salvation, and one of the greatest and most excellent works belonging to the ministry of the gospel, should be so performed, that the workman need not be ashamed, but may save himself, and those that hear him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for the Publick Worship of God | ‘Of the Preaching of the Word’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Preaching of the word, being the power of God unto salvation, and one of the greatest and most excellent works belonging to the ministry of the gospel, should be so performed, that the workman need not be ashamed, but may save himself, and those that hear him.”

— Westminster Assembly, Directory for the Publick Worship of God | ‘Of the Preaching of the Word’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPreaching+of+the+word%2C+being+the+power+of+God+unto+salvation%2C+and+one+of+the+greatest+and+most+excellent+works+belonging+to+the+ministry+of+the+gospel%2C+should+be+so+performed%2C+that+the+workman+need+not+be+ashamed%2C+but+may+save+himself%2C+and+those+that+hear+him.%E2%80%9D%0A%0A%E2%80%94+Westminster+Assembly%2C+Directory+for+the+Publick+Worship+of+God+%7C+%E2%80%98Of+the+Preaching+of+the+Word%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdd88b72fbc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dd88b72fbc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/#:~:text=Preaching%20of%20the%20word%2C%20being%20the,himself%2C%20and%20those%20that%20hear%20him." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d342678c42" data-kw="">
<blockquote><p>The things set down under the former head as forbidden are such new ordinances of worship as are coordinate with the divine ordinances and are in a proper sense additions, pretending or in themselves expressing the same nature, reason, end and use that the divine ordinances have and consequently importing an insufficiency in them. But there are such institutions of men in subordination to the divine institutions as serve for the more convenient modifying and ordering of the same; and they are not proper additions because they are not of the same nature and use: and these are unlawful. All such modes of a duty as are necessary in genere, and not determined in specie (as when there must be a practice one way or other, but whether this way or that way, is not determined of God) are left free to human determination. This human determination must be regulated by the general rules of God’s Word, of which there be these two chief: First, that all determinations be made for edification and not for destruction. Secondly, that all things be done decently and in order. These two rules we find expressly in Scripture, and they are also of the law of nature. These things are neither the essential nor integral parts of divine worship; but if any of them be called “parts” thereof, as being direct expressions of honor to God, they are but accidental parts, as the putting off the hat in divine worship is a worshipping of God so far as it is an expression of honor to God. … Whatsoever nature or custom has so made decent or reverent that the negation of it is indecent or irreverent, is doubtless commanded of God in his worship, though not by any particular, yet by general laws. And the institution and observation of such things is no addition to God’s Law, but merely an application of the general Law in particular cases, as the Law itself does warrant. All these are such mutable things as are not fit to be in particular the matter of a universal law because they are fit in one place and at one time, and not another. Note that things not determined of God and left to the determination of men must be such as are necessary in genere, and not things idle and superfluous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Divine Worship… in The Remains of the Reverend and Learned Mr. John Corbet, Late of Chichester Printed from his own Manuscripts (London: Thomas Parkhurst, 1684), pt. 3 | sect. 5, What things of or belonging to Divine Worship may be Devised or Instituted by Man</cite></span></figcaption>

</figure><figure class="quote" id="q-374cc9f8bc" data-kw="">
<blockquote><p>The direct worship of God is that which is offered directly to God and which is taught in the first table.</p></blockquote>

</figure><figure class="quote" id="q-74b6e0f3c8" data-kw="">
<blockquote><p>Lawfulnesse is an essential property of divine worship resulting from God’s particular approving will in his Word, as is clear, Hosea 8:5; 1 Chron. 15:13; Lev. 10:1; 2 Sam. 7:7; Jer. 7:30; Acts 15:24… …for it [arbitrary worship] cannot have its warrant from God’s general will whereby the proposition of a syllogism is warranted, but not the assumption, for thus the golden calfe of Jeroboam, the worshipping of Satan, should be lawful: for I can form a syllogism to it from Scripture (All worship commanded in the Word is lawful, but Jeroboam’s golden calf is commanded in the Word; Therefore, it is lawful… If ceremonies come partly from men’s will, partly from the light of reason, then do they conclude the lawfulness of ceremonies either fallibly or necessarily: If the former be said, we have little warrant of conscience to practice them; nor can God be honored, nor these things lawful, good, and edificative, more than unlawful, evil and unapt to edify, seeing there be no light of Scripture or nature to make them good to us; and because a fallible and unnecessary consequence is over fallible and unnecessary, and stands (as Aristotle says well) in an indivisible point. It is a non-consequence, and so men’s will is the best house that ceremonies are descended of. If they can be proved by a necessary and infallible consequence, we desire to hear it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (London, 1646) Westminster divine</cite>, pp. 120-21</span></figcaption>

</figure><figure class="quote" id="q-722b31153c" data-kw="">
<blockquote><p>The sorts of this worship are twofold: 1. Solemn. 2. Common. The solemn worship is that whereto men do wholly give themselves, setting themselves apart from all other things to attend it wholly. The common is that which is to be performed to God jointly in and with our other affairs, so far forth as in them we have anything to do with Him or any thing of his.</p></blockquote>

<blockquote><p>On the other hand, it says that ‘David and Israel sang a hymn to God, that is with instruments’ and music (2 Sam. 6:5). David assembled such a multitude that all might worship God with one accord. He well knew that God had not made himself known to him alone, but had established the whole family of Abraham. Thus, David wanted everyone to imitate him, and showed the way for there to be mutual accord, that small and great might demonstrate that they wanted to serve God. Here we see the true use of hymns: we are to encourage one another to celebrate and magnify the name of God in our hymns (Eph. 5:19-20).

It would be enough for each one to pray to God in his heart, and for each one to give him thanks. This is the true worship of God: ‘Call upon me in the day of your trouble’ (Psa. 50:15), says the Lord, ‘and then praise me when you know that I have answered’. We can surely do that from the heart, but our mouth must state ever more clearly the very concerns which cause us to pray to God. Even though everyone can still privately invoke God by themselves, we have this privilege of assembling in public in order to testify to our faith, and then to encourage others by our example. When we pray to God here in the church, and sing the psalms, it is not to show ourselves off, as hypocrites do, but to declare that we seek nothing but that God may be glorified among us.

Our assembling in his name also should certainly serve as a thorn to prick us because of our laziness. That is how we are to encourage one another (Heb. 3:13), and that is why people were not to sing hymns of praise to God for only a temporary period of time, but until the end of the world. Since we are surrounded with flesh and blood, we need means such as these (to lift our spirit up to God), and thus the obligation to sing hymns of praise is common both to us and to the ancients.

There is a difference, however, concerning the instruments of music. It would be nothing but mimicry if we followed David today in singing with cymbals, flutes, tambourines and psalteries. In fact, the papists were seriously deceived in their desire to worship God with their pompous inclusion of organs, trumpets, oboes and similar instruments. That has only served to amuse the people in their vanity, and to turn them away from the true institution which God has ordained. We must, at the same time, be aware of all the privileges which we have in common with the fathers who have lived under the Law and, on the other hand, be aware of the things wherein they are separated from us.

All those things which we have in common with them are lasting, and must be maintained until the end of the world. But we are not to keep observing these things which were only for the time of the Law, unless we want to make a confused mixture which confounds heaven with earth. In a word, the musical instruments were in the same class as sacrifices, candelabra, lamps and similar things. There is nothing that the papists have not turned to some use. Because there was the chandelier with the lamps (in the Old Testament), thus there had to be candles (in the church); because there was perfume then, there had to be incense now. There were ritual washings then, so there had to be holy water now. The papists, in brief, have shown themselves in every possible way to be apes without any discretion!

As I have said, we must notice that what God had instituted for the time of symbols (before the coming of our Lord Jesus Christ) must be put aside and not enforced today. It is true that God ought to be heartily praised, both by musical instruments and by mouth. But it is another matter when we conduct the worship of God in church. If we want to sing praises in the name of God, we would do much better to have psalms instead of common dissolute songs. We sing in order to give him thanks – and not in order to produce a solemn ceremony as a meritorious work that we do for God.

Those who take this approach are reverting to a sort of Jewishism, as if they wanted to mingle the Law and the Gospel, and thus bury our Lord Jesus Christ. When we are told that David sang with a musical instrument, let us carefully remember that we are not to make a rule out of it. Rather, we are to recognise today that we must sing the praises of God in simplicity, since the shadows of the Law are past, and since in our Lord Jesus Christ we have the truth and embodiment of all these things which were given to the ancient fathers in the time of their ignorance or smallness of faith. They did not have such revelation as we have today in the Gospel.

In sum, we see how God was adored both in truth and in type. He was adored in truth because, in giving him praises, people magnified his name and recognised that all came from him. Nevertheless, there were types joined with the reality, insofar as they were necessary at that time. Today, we certainly have some pure worship of God is called heavenly, in that it is not enclosed amid these shadows, and with a half-effect. This is the meaning of the account of their moving the ark.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on 2 Samuel: Chapters 1-13</cite>, trans. D. F. Kelly (Edinburgh: Banner of Truth, 1992), pp 240-42.</span></figcaption>

<blockquote><p>Singing of psalms is authorised in Scripture as a part of the public worship of God, and therefore some circumstances connected with the singing of psalms which it may be necessary, from a regard to decency and order, to regulate, may be regulated by the church; but this affords no warrant for introducing an entirely distinct or different thing, in order, it is said, to heighten the devotion by instrumental music.

It may be contended, indeed, that the introduction of instrumental music is merely a regulation of the mode of performing the unquestionable duty of singing psalms. This seems to be rather a lax use of words; and besides, experience seems to shew that the introduction of this invention of man, in place of aiding or assisting, has a powerful tendency to exclude or to put an end to the practice of singing psalms by the congregation, which God has unquestionably sanctioned and required.</p></blockquote>

<blockquote><p>The specific element, then, in the part of worship we are considering is singing. Now it is pleaded that the church has discretionary power to employ instrumental music, as one of the circumstances allowed by our Standards. Let us submit it to the test of the criteria by which these circumstances are determined: First, they are not parts of the acts of worship by which they are modified; but this circumstance is a part of the act of singing praise by which it is performed. Secondly, these circumstances are common to the acts of human societies, not peculiar to, and distinctive of, those of the church. It is very certain that instrumental music is not such a circumstance. It will hardly be said that all societies play on instruments as well as the church. Thirdly, these circumstances are conditions necessary to the performance of the acts of worship, without which they either cannot be done at all, or not done decently and in order. That the singing of praise cannot be performed at all without instrumental music will be affirmed by none. But it may be affirmed that it cannot without it be performed decently and in order. Let it be noticed that the question is not whether it may be performed in an indecent and disorderly manner. Granted; but so may instrumental music. The question is, whether it cannot be done decently and in order without instrumental accompaniment. The question can only be determined by reference of the practice to a permanent and universal standard of propriety and decorum. And to say that the simple singing of God’s praise in His house is indecent and disorderly is to say, that for twelve centuries the church of Christ was guilty of this impropriety; for it is a matter of history that for that period not even the Church of Rome knew anything of instruments in her worship. To say that the simple singing of God’s praise violates the standard of decency and order of this age is to censure the glorious Free Church of Scotland and the Irish Presbyterian Church for an indecent and disorderly conduct of this part of divine worship. The ground, therefore, that instrumental music in public worship is one of those circumstances required by the rule that all things be done decently and in order cannot be maintained without a spirit of arrogance and censoriousness which would itself violate the higher principle of Christian charity. It is submitted, with all modesty, that this line of argument ought to be conclusive with Presbyterians, at least, against ranking instrumental music in public worship as one of the circumstances common to human actions and societies which fall under the discretion of the church.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The specific element, then, in the part of worship we are considering is singing. Now it is pleaded that the church has discretionary power to employ instrumental music, as one of the circumstances allowed by our Standards. Let us submit it to the test of the criteria by which these circumstances are determined: First, they are not parts of the acts of worship by which they are modified; but this circumstance is a part of the act of singing praise by which it is performed. Secondly, these circumstances are common to the acts of human societies, not peculiar to, and distinctive of, those of the church. It is very certain that instrumental music is not such a circumstance. It will hardly be said that all societies play on instruments as well as the church. Thirdly, these circumstances are conditions necessary to the performance of the acts of worship, without which they either cannot be done at all, or not done decently and in order. That the singing of praise cannot be performed at all without instrumental music will be affirmed by none. But it may be affirmed that it cannot without it be performed decently and in order. Let it be noticed that the question is not whether it may be performed in an indecent and disorderly manner. Granted; but so may instrumental music. The question is, whether it cannot be done decently and in order without instrumental accompaniment. The question can only be determined by reference of the practice to a permanent and universal standard of propriety and decorum. And to say that the simple singing of God’s praise in His house is indecent and disorderly is to say, that for twelve centuries the church of Christ was guilty of this impropriety; for it is a matter of history that for that period not even the Church of Rome knew anything of instruments in her worship. To say that the simple singing of God’s praise violates the standard of decency and order of this age is to censure the glorious Free Church of Scotland and the Irish Presbyterian Church for an indecent and disorderly conduct of this part of divine worship. The ground, therefore, that instrumental music in public worship is one of those circumstances required by the rule that all things be done decently and in order cannot be maintained without a spirit of arrogance and censoriousness which would itself violate the higher principle of Christian charity. It is submitted, with all modesty, that this line of argument ought to be conclusive with Presbyterians, at least, against ranking instrumental music in public worship as one of the circumstances common to human actions and societies which fall under the discretion of the church.”

— John L. Girardeau, ‘The Discretionary Power of the Church, Matt 28:20’, (1875) in Sermons, ed. George A. Blackburn (1907).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+specific+element%2C+then%2C+in+the+part+of+worship+we+are+considering+is+singing.+Now+it+is+pleaded+that+the+church+has+discretionary+power+to+employ+instrumental+music%2C+as+one+of+the+circumstances+allowed+by+our+Standards.+Let+us+submit+it+to+the+test+of+the+criteria+by+which+these+circumstances+are+determined%3A+First%2C+they+are+not+parts+of+the+acts+of+worship+by+which+they+are+modified%3B+but+this+circumstance+is+a+part+of+the+act+of+singing+praise+by+which+it+is+performed.+Secondly%2C+these+circumstances+are+common+to+the+acts+of+human+societies%2C+not+peculiar+to%2C+and+distinctive+of%2C+those+of+the+church.+It+is+very+certain+that+instrumental+music+is+not+such+a+circumstance.+It+will+hardly+be+said+that+all+societies+play+on+instruments+as+well+as+the+church.+Thirdly%2C+these+circumstances+are+conditions+necessary+to+the+performance+of+the+acts+of+worship%2C+without+which+they+either+cannot+be+done+at+all%2C+or+not+done+decently+and+in+order.+That+the+singing+of+praise+cannot+be+performed+at+all+without+instrumental+music+will+be+affirmed+by+none.+But+it+may+be+affirmed+that+it+cannot+without+it+be+performed+decently+and+in+order.+Let+it+be+noticed+that+the+question+is+not+whether+it+may+be+performed+in+an+indecent+and+disorderly+manner.+Granted%3B+but+so+may+instrumental+music.+The+question+is%2C+whether+it+cannot+be+done+decently+and+in+order+without+instrumental+accompaniment.+The+question+can+only+be+determined+by+reference+of+the+practice+to+a+permanent+and+universal+standard+of+propriety+and+decorum.+And+to+say+that+the+simple+singing+of+God%E2%80%99s+praise+in+His+house+is+indecent+and+disorderly+is+to+say%2C+that+for+twelve+centuries+the+church+of+Christ+was+guilty+of+this+impropriety%3B+for+it+is+a+matter+of+history+that+for+that+period+not+eve <blockquote><p>In withstanding the doctrinal assaults of Infidel opposers, the Sabbath has only resisted one of its double dangers. The more fearful hazard of obliteration through the covetousness of men, it must perpetually incur. The mountain crag which has bared its head to the storms of forty centuries, may yet be undermined at its base, and sweeping downward with the avalanche, spread ruin in its path.

So the Sabbath which, from the birth of time, has lifted its testimonial spire, pointing to the heavens amidst the bowlings of Atheism, may yet be washed from its base, by the unchecked currents of worldliness and vanity. We allege that this danger increases with the advance of science, and the progress of art. Occasional breaches of the Sabbatic rest, may always be expected to occur; but the very circumstance, that they are exceptional and not stated, carries along with them a check upon the evil. The very departure from one’s ordinary policy will suggest an inquiry as to its propriety.

The man is immediately sisted at the bar of his own conscience, compelled either to repudiate the settled policy of his life in keeping the Lord’s day, or else to justify this occasional violation of its sacred rest. In the same way, the apparent inconsistency between the two, brings up the whole subject for adjudication before the Christian public, who are compelled to render a decision. Thus the usual observance of the day will be a standing protest against its occasional breaches. But in those employments where there is a foreseen and fore-pledged violation of the Sabbath, in which the din of labour is unremittingly heard, it may easily fall into desuetude, and, in course of years, be forgotten.

In the march of civilization, and in the consequent multiplication of the mechanical arts, those occupations become more and more numerous. It would perhaps astonish those, who have paid little attention to this matter, to know how large the catalogue of such is already swelled. In the blowing of glass, the smelting of iron, the boiling of sugar, the printing of daily newspapers, the publication of legislative records, the postal arrangements of the country, the plying of steam vessels between contiguous ports, the working of rail-roads, and the operation of the telegraph, we have sufficient examples of a large class of employments, in which, upon the plea of a coercive necessity, the Sabbath is habitually violated.

The momentous question now arises, how shall the Christian world aet in regard to these occupations? Can any broad principles be stated, which shall guide Christian men in their individual conduct, and direct the Church in the exercise of salutary discipline? God’s reservation of the Sabbath to his own use is so clear, and his propriety in it so indefeasible, that the whole question must be remitted to his decision. According to the Scriptures, there are but two grounds upon which the Sabbath can be vacated, either the law of necessity, or the plea of mercy. These pursuits will scarcely be covered by the mantle of the latter, nor be successfully advocated upon the authority of the former. Grant, for example, that by the intermission of the Sabbath, the furnaces of glass and iron cool down to such a temperature, that an entire day will be consumed in heating them again to the working point; nothing more is proved than the disadvantage arising from the loss of one-sixth of time, during which labour and capital are unproductive.

All kinds of business lie under peculiar disadvantages, of one kind or another, which are taken into account in estimating the value of their productions. If a Christian man, labouring productively five-sixths of his time, cannot compete with those who labour seven-sixths, there is perhaps no alternative but to exchange his calling for another, in which he may have less profits, and a sounder conscience. In other words, we uncover an important distinction, that to make out a sacrifice is not to prove a necessity.

We greatly fear that a large proportion of Sabbath breaking, especially on the part of professing Christians, is traceable to the neglect of this distinction. A man, for instance, is unexpectedly delayed upon a journey, perhaps almost within sight of his home—to tarry by the way will involve much inconvenience and discomfort, and perhaps pecuniary risk or loss—then add the anxieties he may feel about wife and children, and he is at once flattered into the belief of a stringent necessity upon him to violate God’s law.

Beloved brethren! How often must it be repeated, that a Christian profession, from first to last, involves sacrifices frequent and severe! Whoever assumes it, does in act and in form place himself on God’s altar, a whole burnt-offering. He is “bought with a price” and the vow is taken with awful solemnity, as in the court of Heaven to “glorify God in his body and his spirit, which are God’s.” And surely we are inattentive observers of Divine Providence, if we do not discover many circumstances in our life ordered expressly to test the sincerity and value of this profession.

We have offered all in sacrifice to God, our time and life and being, and when an emergency shall arrive, putting our religion to the proof, shall we plead against the claims of God upon His own day, the sacrifice involved in some partial loss of interest or comfort? Shall we not rather feel that God affords us a fit opportunity of practically renewing our covenant, and fulfilling our vows of self-consecration; and that ample compensation is e joyed in the privilege of bearing an honorable testimony in behalf of all religion, in the testimony which we bear for the Sabbath?</p></blockquote>

<blockquote><p>What natural, or carnal affections may be excited by them [ceremonies], as men may inflame themselves with idols, Isa. 57:5, or what outward, outside devotion they may direct unto or excite, is uncertain; but that they are no means of stirring up the grace of God in the hearts of believers, or of the increase or strengthening of their faith, which things alone God accepts in Gospel worship, seeing they are not appointed by Him for any such purpose, is most certain: For to say that anything will effectually stir up devotion, that is, excite, strengthen or increase grace in the heart towards God, that is not of his own appointment, is on the one hand to reflect on his wisdom and care towards his Church, as if he had been wanting towards it in things so necessary, which He declares against, Isa. 5:4, ‘What,’ says He, ‘could have been done more to my vineyard, that I have not done in it?’; So on the other [hand], it extols the wisdom of men above what is meet to ascribe unto it. Shall men find out that which God would not, or could not, in matters of so great importance unto his glory and the souls of them that obey Him? yea, and it cannot be but that attendance unto them and their effects must needs divert the mind from those proper spiritual actings of faith and grace, which is its duty to attend unto. And this is evidently seen in them who indulging to themselves in their observation in multiplied instances, as in the Church of Rome, have changed the whole spiritual worship of the Church, into a theatrical pompeous show of carnal devotion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers, and render the worship itself in its performance more decent, beautiful and orderly…?’ pp. 57-58 This quote’s context does not specifically respect musical instruments.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-a8bc63c528" data-kw="">
<blockquote><p>The most specious thing that could be said to the contrary is in this, that since consent of the parties, through which their wills agree to the same conditions, is the form of a covenant, and such a consent between the Father and the Son could not have obtained from eternity, because to both belong one and the same will, there also cannot be allowed a covenant between them. We meet this objection by observing that just as in God the essence, one and the same in number, is as it were contracted through the characteristic properties in such a way that three persons are constituted, so also the will, which coincides with the essence, is as it were contracted in the same manner, so that to each person belongs, with the essence, his will. This same thing is more clearly evident than the noon-day sun in the internal operations of God ad intra, as much in the reciprocal essential operations, by which for example, the Father knows the Son, and loves him, and the Son in turn the Father, as in the personal operations, by which the Father generates the Son, the Son proceeds through generation from the Father, and so forth. In addition, in the external operations, the same thing is observable in its own way, insofar as creation is asserted for the Father, redemption for the Son, and sanctification for the Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 4, bk. 5, ch. 1</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee137d1657" data-kw="">
<blockquote><p>The will is a natural property, and therefore in the divine essence it is but one. The Father, Son, and Spirit, have not distinct wills. They are one God, and God’s will is one, as being an essential property of his nature; and therefore are there two wills in the one person of Christ, whereas there is but one will in the three persons of the Trinity… …for such is the distinction of the persons in the unity of the divine essence, as that they act in natural and essential acts reciprocally one towards another—namely, in understanding, love, and the like; they know and mutually love each other. And as they subsist distinctly, so they also act distinctly in those works which are of external operation. And whereas all these acts and operations, whether reciprocal or external, are either with a will or from a freedom of will and choice, the will of God in each Person, as to the peculiar acts ascribed unto Him, is his will therein peculiarly and eminently, though not exclusively to the other persons, by reason of their mutual in-being. The will of God as to the peculiar actings of the Father in this matter is the will of the Father, and the will of God with regard unto the peculiar actings of the Son is the will of the Son; not by a distinction of sundry wills, but by the distinct application of the same will unto its distinct acts in the persons of the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, … vol. 2 ed. W.H. Goold in Works (Edinburgh: T&amp;T Clark, 1862), vol. 19, Preliminary Exercitations, Ex. 28, ‘Federal Transactions Between the Father &amp; the Son’, pp. 87-88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span><span class="t"><a href="../topics/covenant-of-redemption/counsel-of-peace.html">Counsel of Peace</a></span></div>

<blockquote><p>…in the good ol’ seventeenth century, Reformed theologians held to the principle of attributing ad extra works [all works directed externally outside of God to the creation] to all the persons of the Trinity. However, divines such as John Owen and Thomas Goodwin, to name just two of many, argued that certain outward works – depending on what they are – are more peculiarly attributed to one of the persons. This is also referred to as the doctrine of appropriations. Goodwin echoes this principle elsewhere: ‘In this will that common Axiome of Divines helps us, that what works all three Persons do towards us Ad extra, though they have all a joint hand in them, yet they are attributed more especially to one Person than to another; as Sanctification you know is attributed more especially to the Holy Ghost, Redemption to the Son, Creation to God the Father, though all Three Persons have a hand in it.’ That is to suggest that the persons all share a common prerogative, but often a certain work will be attributed to the Father, for example, in order to display his uniqueness. Both Goodwin and Owen wrestle with how this relates to the incarnation of the Son of God. So, for example, while some Divines attribute to the Spirit ‘the special Honour of tying that Marriage knot, or Union, between the Son of God, and that Man Jesus’, Goodwin believes that ‘that Action is more peculiarly to be Attributed to the Son Himself; as Second Person; who took up into one Person with Himself that Humane Nature’ (Heb. 2:16). Of course, Goodwin agrees that if they argue on the basis that the external works of the Trinity are undivided, there is no conflict. But, in Goodwin’s mind, it was ‘the Son’s Special Act … to assume [human nature]’. This is precisely what I say in the quote from Knowing Christ (p. 27). Owen argues that it was an outward act (ad extra) of the triune God, ‘As unto original efficiency’. However, ‘As unto authoritative designation, it was the act of the Father…. As unto the formation of the human nature, it was the peculiar act of the Spirit…. As unto the term of the assumption, or the taking of our nature unto himself, it was the peculiar act of the person of the Son.’ Essentially, Goodwin and Owen are claiming that the undivided works ad extra often manifest one of the persons as their terminus operationis [end of operation]. In the above example, the incarnation terminates on the Son though the act is (singularly) willed by the three persons of the Trinity. … If the Son did not decide to assume a human nature, then who did? God did, but, alas, dat old debbel [terminus operationis].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-jones.html">Mark Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Dat Old Debbel Tritheism?’</cite>, (2017) Jones’ context is not specifically about the Covenant of Redemption, but as may be seen, his discussion very much applies to it.</span></figcaption>

<blockquote><p>11. God has made more promises, donations and covenants than one or two, which must not be confounded:

1. His Law and Covenant made to and with man in innocency is one.

2. And his Law and Covenant made to and with Christ, as Mediator, is another.

3. And his absolute promise of a Saviour to the world, with the conditional promise or Law of Grace conjunct, was the first edition of another. And the Gospel, as after the incarnation promulgated, was a more perfect edition of it (to pass by Abraham’s Covenant of Peculiarity, and the Mosaical Law, as such).

12. Though Christ be promised in one of these, and be God’s antecedent gift, He may nevertheless be the Author of another, (and so far the foundation), as well as the meritorious cause.

13. That may be of free grace which is merited by Christ; yea, and that which is annexed to the evangelical worthiness of a believer.

14. That may be a condition required of us, to be done by the help of grace, which yet is the effect of that grace, and given us by God.

15. It is a true Covenant between God the Father, Son, and Holy Ghost, and man, which is solemnly entered into in baptism: And this is a Covenant of Grace, even that proceeds purely from grace; and of grace, as given by God, and by us accepted. He that will confound these various covenants, promises, and laws, on pretense of their unity (though there is doubtless a wonderful unity of all the parts both of God’s moral (signal) means, and his physical works), shall confound much of theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology, Plain, Pure, Peaceable</cite>, ... (London: White, 1675), ‘An Appendix to this Premonition,’ n.p.</span></figcaption>

1. His Law and Covenant made to and with man in innocency is one.

2. And his Law and Covenant made to and with Christ, as Mediator, is another.

3. And his absolute promise of a Saviour to the world, with the conditional promise or Law of Grace conjunct, was the first edition of another. And the Gospel, as after the incarnation promulgated, was a more perfect edition of it (to pass by Abraham’s Covenant of Peculiarity, and the Mosaical Law, as such).

12. Though Christ be promised in one of these, and be God’s antecedent gift, He may nevertheless be the Author of another, (and so far the foundation), as well as the meritorious cause.

13. That may be of free grace which is merited by Christ; yea, and that which is annexed to the evangelical worthiness of a believer.

14. That may be a condition required of us, to be done by the help of grace, which yet is the effect of that grace, and given us by God.

15. It is a true Covenant between God the Father, Son, and Holy Ghost, and man, which is solemnly entered into in baptism: And this is a Covenant of Grace, even that proceeds purely from grace; and of grace, as given by God, and by us accepted. He that will confound these various covenants, promises, and laws, on pretense of their unity (though there is doubtless a wonderful unity of all the parts both of God’s moral (signal) means, and his physical works), shall confound much of theology.”

<blockquote><p>IV. With matters standing thus [with all men condemned by sin], God out of his immense mercy toward his elect looked out himself for a means of their reconciliation with him… And entering into a pact with his Son, he promised that if he would offer himself as an expiatory victim for guilt, he would see long-lived seed, setting apart the elect who were in servitude (Isaiah 53:10). And here we have both the justice and mercy of God made manifest (Rom 5:17): Justice indeed in that he required the restitution of his honor and willed that the right of the law be fulfilled in those to be redeemed (Rom 8:4); but Mercy in that he transferred our obligation to punishment to another, and required the satisfaction, which he could have completely repudiated, from another, whom he himself had chosen and appointed as our sponsor. Indeed, so far is gratuitous remission of sins from being opposed to this satisfaction, that it cannot but have a place in that satisfaction (such as this one is) where another pays and something else is paid than he who was and what was in the obligation, and more so when he to whom satisfaction ought to be made can reject all satisfaction, and especially when he himself appoints the sponsor and in him reconciles himself with his enemies, all of which obtain here.</p></blockquote>

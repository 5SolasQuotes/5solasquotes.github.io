<main class="wrap"><figure class="quote" id="q-e9d125e39c" data-kw="">
<blockquote><p>And with respect to the government of Christ’s house, alas! the generality of the present age seem to be agreed, that it is a matter of mere indifferency and moonshine, whether a person be of the Episcopalian, Independent, or Presbyterial way of thinking about it; although it is the declared principle of this church, founded on the word of God, solemnly sworn unto and sealed by the blood of many of the Lord’s witnesses, That the spiritual power and authority, is lodged, neither in the hand of the civil magistrate, not in the community of the faithful, as they call them, but in church officers, ministers and elders acting in parity, and judicatories subordinate to one another. Now, we say that a faithful minister of Christ is set for the defence of the gospel, namely, both for the defence of gospel-truth, and likewise of the hedge of government, which the glorious Head hath set about it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The character of a faithful minister of Christ in The works of Ebenezer Erskine</cite></span></figcaption>

<blockquote><p>That such inconveniencie may be shunned, it is fit that when any change is to be made in the policy of a Church, not the clergy alone, but the elders also, and men of understanding among the layity, in a lawfull assembly, freely give their voices and consent thereunto. Good reason have our writers to hold against Papists, that laymen ought to have place in councils, wherein things which concern the whole Church are to be deliberated upon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, … (1637), Pt. 3, ch. 8, p. 147</span></figcaption>

</figure><figure class="quote" id="q-a9a44859c5" data-kw="">
<blockquote><p>The prophets of Neo-Confederate mythology often try to pretend that the only people who were opposed to the culture of the ante-bellum South were Jacobins and Unitarians. However, we find that an orthodox Ulster Presbyterian newspaper, the Londonderry Standard, had this to say about some of the practices which existed in the Southern states prior to the American Civil War/War Between the States:

The monstrous anti-Christian code which, in reference to the slave population and people of colour, is established in some of the Southern States of the Union is truly revolting […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/londonderry-standard.html">Londonderry Standard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Londonderry Standard</cite>, 9 Oct. 1846</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>
<div class="actions"><button class="copy" data-copy="“The prophets of Neo-Confederate mythology often try to pretend that the only people who were opposed to the culture of the ante-bellum South were Jacobins and Unitarians. However, we find that an orthodox Ulster Presbyterian newspaper, the Londonderry Standard, had this to say about some of the practices which existed in the Southern states prior to the American Civil War/War Between the States:

The monstrous anti-Christian code which, in reference to the slave population and people of colour, is established in some of the Southern States of the Union is truly revolting […]”

— Londonderry Standard, Londonderry Standard, 9 Oct. 1846">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+prophets+of+Neo-Confederate+mythology+often+try+to+pretend+that+the+only+people+who+were+opposed+to+the+culture+of+the+ante-bellum+South+were+Jacobins+and+Unitarians.+However%2C+we+find+that+an+orthodox+Ulster+Presbyterian+newspaper%2C+the+Londonderry+Standard%2C+had+this+to+say+about+some+of+the+practices+which+existed+in+the+Southern+states+prior+to+the+American+Civil+War%2FWar+Between+the+States%3A%0A%0AThe+monstrous+anti-Christian+code+which%2C+in+reference+to+the+slave+population+and+people+of+colour%2C+is+established+in+some+of+the+Southern+States+of+the+Union+is+truly+revolting+%5B%E2%80%A6%5D%E2%80%9D%0A%0A%E2%80%94+Londonderry+Standard%2C+Londonderry+Standard%2C+9+Oct.+1846&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa9a44859c5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a9a44859c5.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2011/10/13/derry-presbyterians-on-the-old-south/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-5dd59c9ee0" data-kw="">
<blockquote><p>In 1646, when the Presbyterians had fully regained the ascendancy, the Scottish Parliament passed an act, requiring every parish to have a schoolmaster, and ordaining, that if in any case, heritors or land-holders neglected raising means for his support, the Presbytery should nominate twelve men, to make the assessment upon their property. Indeed, strange as it may appear, the period between 1638 and 1660, seems almost entitled to be called the golden age of popular education in Scotland. In the universal diffusion of religious instruction, it was decidedly so. ‘For,’ says Kirkton, a very respectable Church historian of the times, ‘every parish had a minister, every village a school, every family almost had a Bible—yea, in most of the country, all the children of age could read, and were provided with Bibles either by their parents, or ministers.

I have lived many years in a parish, where I never heard an oath — and you would not, for a great part of the country, have lodged in a family, where the Lord was not worshipped by reading, singing, and prayer. ‘Nobody,’ he quaintly adds, ‘complained more of our church government, than our taverners, whose ordinary lament was, that their trade was hopeless—people were become so sober.’ It was thus, by planting the school by the side of the kirk, that the Reformed clergy raised the people of Scotland, both from feudal bondage and spiritual thraldom; and most grateful was the return which they every where received. During that period, school teaching was a regular profession — as much so as that of the ministry, and men were educated for it. Piety no less than learning and aptness to teach, was regarded as an essential qualification in a school-master. The parish school was the nursery of the kirk, and the master was expected to co-operate with the minister, in all his plans and efforts for the spiritual good of the rising generation. To command the best talents and to place the teacher on the highest vantage ground, in the discharge of his duties, a house was provided for his family, and he received a liberal and permanent support. In the sacredness of his office, the pastor was above him; but in talents and scholarship, it was thought that the school-master stood upon nearly the same level.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reformed-presbyterian.html">Reformed Presbyterian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Presbyterian</cite>, Dec. 1837, pp 307-08</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-67a90d231a" data-kw="">
<blockquote><p>The Scriptures warrant us to look forward to a period when it [the church] shall resume the appearance of a united and peaceful community. Then shall it be fulfilled as it is written: “The earth shall be full of the knowledge of the Lord, as the waters cover the sea.” [Isaiah 11:9; Habakkuk 2:14] “The Lord shall be King over all the earth; in that day shall there be one Lord, and His name one.” [Zechariah 14:9] But before this consummation can be attained there must be some agreement as to the proper form of ecclesiastical government. And doubtless the Church shall then, in all its arrangements, be a model of symmetry and beauty. There will be no provision made for useless drones or meretricious ornamentations; but all will be taught to look for life and sustentation to the Head; all will be prepared, in some way, to conduce to the promulgation of His glory; all will be encouraged to endeavour to promote the general well-being; and thus all will be builded together for an habitation of God through the Spirit. The framework of the Church throughout will reveal the hand of Him who is excellent in counsel and wonderful in working.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-d-killen.html">W. D. Killen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>framework of the church. A treatise on church government</cite>, (Edinburgh, 1890), pp 4-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<main class="wrap"><figure class="quote" id="q-74e5918464" data-kw="">
<blockquote><p>Do we find it difficult to rise as early on that day as during the week, that with the morning we may commence our duties? Let conscience speak, and we shall wake early. Let our love to God, and his service, only be as strong as our attachment to the things of the world, and no more of the Sabbath will be wasted in slumber, than of Monday morning. Men who labour through the week, contend for this indulgence; that they are wearied and need rest: besides, that the Sabbath is given for rest.

But, no reader of the Bible can say, that it is the rest of indolence and spiritual inactivity. The worship of God does not commonly demand the labours and exercise of the body; the mind only is called into healthful action; and this is also refreshing to the body. In answer to the plea, that being worn down with the cares of the week, and its toils, we may, consistently with duty, lie later on Sabbath morning than any other, it may be asked, Have we a right to expend our strength during the week, so as to unfit us for the duties of the Sabbath when they arrive?

If we found ourselves disinclined early to seek the Lord, last Sabbath, are we not bound to guard against such languor, when this holy day shall again dawn? Is not duty plain, that we ought to relax our labours on Saturday, that we may not lose the most precious hours of the Lord’s day? Were we our own, we might exercise our pleasure. But we are not. Man’s chief end is, to glorify God, and enjoy him, in this world, as well as hereafter.

Suppose you hire a man, to labour for you — you have a right to all his time; but you give him five days in the week for his own employment on condition that he will devote himself wholly to your work on the sixth. Has this man a right, so to arrange his business, and expend his strength, during the five days he labours for himself, that when the sixth day arrives, he cannot rise until late, nor commence his work until the morning be nearly past?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/silas-milton-andrews.html">Silas Milton Andrews</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath at Home</cite>, (Philadelphia PA: Presbyterian Board of Publication, 1840), pp 11-12.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d6fbf690f8" data-kw="">
<blockquote><p>Worship, generally, is the tender of our homage to God, and giving Him immediate honor. Accordingly, a part of worship, is whatsoever is presented to God, (whether thing or action) as a special homage, and as an immediate honor to Him. Or at least ought to be so, if it be not. …

1. As worship comprehends under the term both true worship and false worship, or right worship and will-worship; So the cause of it is our intention to present it as a special homage (as was said) and an immediate honor to God. Such intention, we say, is the formal cause, that such an action is worship in him that presents it, or such a thing, in him that tenders it. And without such intention, no action is formally worship in any man, however it be in the nature of the action, or in any other person that presents it. As for instance: The repeating of any sentence of Scripture, or the Lord’s prayer, intending thereby to honor God, is a part of worship: But to repeat it, to teach a child to spell or read, or to understand a language, or to use it as a charm or the like, is certainly no worship, because it wants an intention of immediate honoring God by it. So to kneel down before an image or crucifix with intention to honor God by that action is worship (though false and idolatrous), but to kneel down before it, not seeing it, nor thinking of it, or to pull out a thorn out of one’s foot or the like, is no worship: because, again, here wants an intention of honoring God by such an action.

2. But now, as worship denotes only true and right worship, so the proper efficient cause, and that which both legitimates and necessitates such intention, is the command of God. What He commands to be presented to Him, whether seeming substance or circumstance, has the nature of a special homage and immediate honor to Him, and ought to be presented (as often as it is presented) with such intention. From which command also flows an answerable acceptation of such a commanded thing or action, when accordingly performed with that intention: And with that intention there may and should also be an expectation of such acceptation, whereby the intention is proved in a man’s conscience, whether the matter be commanded or not. For will-worshippers expect an acceptation, though without warrant. And profane hypocrites, though they pretend to worship God, yet when they intend it not, they expect no acceptation. We say then, our expectation of acceptation declares whether we tender such a thing as a part of worship, or use it as a mere circumstance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/definitions-of-worship.html">Herbert Palmer &amp; Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sabbatum redivivum, or the Christian Sabbath Vindicated</cite>, (London: White, 1645), ch. 12</span></figcaption>

</figure><figure class="quote" id="q-20c41fa54e" data-kw="">
<blockquote><p>May we not rather pray for the hastening of this day seeing there is so much need of it? For there is no effectual remedy of corruptions in government and the miseries which flow from them, but that; especially seeing that when Christ says with such asseveration. Surely I come quickly. John seems to answer in the name of the Church, Amen. Even so come Lord Jesus?

Answ. We do or should pray daily, Thy Kingdom come. And we may pray for the accomplishing of all prophesies, but more especially for promises; but we may not pray for the end but with reference to all known means ordained thereunto; and as it’s vain to imagine that times determined in God’s decree, can be changed: so is it also presumptuous to desire it. It must suffice us that Christ comes quickly; not in our imaginary due season, but in the Father’s. To this we must add our Amen.

Even so, as fully persuading our selves, that his coming shall be, even the self day as Moses speaks of God’s faithfulness in his promise to bring Israel out of Egypt. But yet the Lamb’s wife hath not made her self ready, neither is she prepared as a bride adorned for her Husband; and though the promise is exceeding comfortable which is oft repeated behold I come quickly, and the performance of it is most certain on God’s part, and desirable on ours, yet our best meanes to hasten it is to further our own and the Churches reformation.</p></blockquote>

<blockquote><p>But, Mr. Prefacer [Howe’s separatist opponent], if your judgment upon the case itself, be true, I conceive that truth, accompanied with your temper of spirit, is much worse than their error.</p></blockquote>

</figure><figure class="quote" id="q-b49b78d7ff" data-kw="">
<blockquote><p>…there being no greater affront to God in the world, nor any thing more destructive to ourselves, than thus presumptuously to sin both against Him and our own souls by presenting ourselves before Him so directly contrary to his nature and commands; for He has taken such care that his worship should be free from all such mixtures of hatred and malice, that He will rather for a time dispense with his worship itself and have it deferred than endure that it should be thus unduly performed: ‘For if thou bring thy gift to the altar, and there remember that thy brother has ought against thee, leave there thy gift before the altar, first, be reconciled unto thy brother, and then come and offer thy gift.’ (Mt. 5:23-24) Whereby it appears that the performance of any outward service unto God, without Love to our brother, is very displeasing unto Him, who requires mercy rather than sacrifice at our hands: For if the gift, when brought to the altar, must rather be left there than offered up, sure there can be no acceptance or reconciliation with God, unless we be also reconciled unto our brother, because that this must be done before the other can be begun. How many then have offered not only fruitless, but abominable sacrifices unto Him, and instead of pacifying, have but the rather provoked Him, nay, and have with all earnestness, even besought Him to ruin and destroy them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-jekyll.html">Thomas Jekyll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Peace &amp; Love Recommended &amp; Persuaded in Two Sermons</cite>, … (1675) Jekyll (d. 1698) was an Anglican minister.</span></figcaption>

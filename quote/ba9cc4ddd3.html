<main class="wrap"><figure class="quote" id="q-ba9cc4ddd3" data-kw="">
<blockquote><p>It remains for us to speak of the thing itself which is involved in this communication. The thing itself here is called the body and blood of the Lord, concerning whose communication they inquire. But the symbols are certain and sufficiently clear, since the senses can judge of them.

Here, some explain and resolve the matter in different ways. Certain people say that the body itself is given together with the symbols. Our writers, on the other hand, say that the truth of the body and its fruit are given, while the body itself remains in heaven in a definite place.

If it may be said without offending the peaceable, agreement here would have been easy. For that earlier opinion, if you refer it to faith, contains nothing absurd. For to faith, the very body of the Lord is most present. Faith, penetrating the heavens, does not chase after shadows or empty symbols, but embraces the very body of the Lord, is nourished by it, and enjoys it no less truly than our physical bodies are nourished by outward bread and wine.

But if you refer it to the stomach and the teeth, then of course it is absurd, and neither can nor ought to be believed. Thus, when we say that the virtue and use of the absent body are distributed, and we do not say that it is absent to faith. For to the devout soul, through faith, we say that it is present; but to our outward senses, we understand it to be absent.

In this way, therefore, agreement would have been easy. For in this we agree: that on both sides we deny a local presence, and we shall not be caught here in the crude manner of the Capernaumites.

Concerning the manner, then, about which they anxiously inquire, agreement would be easy if we were equally concerned for the peace of the Church. For Christ is present with His symbols by covenant, not by mixture, not by confusion, not by consubstantiation. This manner is called by some sacramental, because it properly belongs to the sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedictus-aretius.html">Benedictus Aretius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Three Sermons of Master Benedictus Aretius of Bern, Theologian, on the Lord’s Supper</cite>, (Lausanne: Most Illustrious Lords of Bern, 1578), pp 40-41. (Translated by Copilot.)</span></figcaption>

<blockquote><p>Mercy comprehends the duties of the Second Table, as the knowledge of God the duties of the First Table. Now this piety towards God and charity towards our neighbour was more acceptable service towards God than all the rites of their external worship.</p></blockquote>

</figure><figure class="quote" id="q-43b893ee43" data-kw="">
<blockquote><p>And let us remember, my brothers, that we have today taken the holy Sacrament to be the cement of this peace, and the incorruptible and immortal seal of the bond of this fraternal affection. For it is not only the pledge of the mercy of God towards us, the assurance of the remission of our sins in the death of Christ, the confirmation of the truth of his promises: it is not only the mark by which we testify reciprocally, he, that he wants to have communion with us, we, that we want to have communion with him, it is still a solemn declaration, and a kind of oath that we make, that we want to have inviolable communion the ones with the others.

It is for that that we eat of one same bread, in order to protest highly that we want to be one same body: it is for that that we drink of one same cup; as if we said in the presence of God and of his holy Angels, that as we are watered of one same Spirit, we want to have only same sentiments and same movements, and as we tend towards one same end, and run in one same career, we run there of same ardour, equally and constantly, without hindering, and without interferring the ones the others.</p></blockquote>

<blockquote><p>Respect the sacramental table to which you have approached, the bread of which you have partaken, the cup in which you have communicated, being consecrated by the sufferings of Christ.5 5. Note that this allusion implies that Communion in both Kinds was given separately, as in the Anglican Church, not by intinction, as in the present Orthodox Eastern Church. Gregory Nazianzen | “Select Orations of Saint Gregory Nazianzen,” in S. Cyril of Jerusalem, S. Gregory Nazianzen, ed. Philip Schaff and Henry Wace, trans. Charles Gordon Browne and James Edward Swallow, vol. 7, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Christian Literature Company, 1894), 40.31 (p. 371). The first mention of intinction in the West, is at Carthage in the fifth century. We know it was practised in the seventh century and by the twelfth it had become general, to give place to the withdrawal of the chalice altogether in the West. Henry R. Percival | “The Canons of the 318 Holy Fathers Assembled in the City of Nice, in Bithynia,” in The Seven Ecumenical Councils, ed. Philip Schaff and Henry Wace, vol. 14, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Charles Scribner’s Sons, 1900), 31. All forms of intinction had virtually disappeared in the W. by c. 1200. The third form (dipping the Host into the consecrated wine) has been sporadically revived in modern times in the Anglican Communion as a method both of reservation and of giving Communion to the sick. F. L. Cross and Elizabeth A. Livingstone | eds., The Oxford Dictionary of the Christian Church (Oxford; New York: Oxford University Press, 2005), s.v. “Intinction.</p></blockquote>

</figure><figure class="quote" id="q-820b3cb529" data-kw="">
<blockquote><p>Do they [our divines] not teach… That the negative precepts of the Law do bind, not only at all times, but likewise to all times, (whereupon it follows that we may never do that which is inconvenient or scandalous), and that the affirmative precepts though they bind at all times, yet not to all times, but only quando expedit [when it is expedient] (whereupon it follows that we are never bound to the practice of any duty commanded in the Law of God except only when it is expedient to be done)? …forasmuch as to abstain from things scandalous and inconvenient is one of the negative precepts of the Law of God… it follows that the use and practice of the same is altogether unlawful unto us.</p></blockquote>

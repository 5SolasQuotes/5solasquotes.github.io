<main class="wrap"><figure class="quote" id="q-7b3ddb0eda" data-kw="">
<blockquote><p>We, therefore, maintain that the rational soul is infused by God into the embryo, not indeed θύραθεν ἐπεισιέναι (entering from without), as Aristotle wishes in book 2 of On the Generation of Animals, chapter 3, but is formed by God in the fetus itself and the rudiment of the human body. Scripture teaches this. For in Isa. 57:16 God speaks thus: “The spirit from my face shall clothe man, and I make the souls.” And in Zech. 12:1: “Thus says the Lord, who stretches out the heavens, and lays the foundation of the earth, and forms the spirit within him.”…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Untying of Grave Questions</cite>, (Leiden: Elzevirana, 1632), Treatise 5, on Original Sin, ch. 1, ‘Whether there is original sin, in whom it exists, and whether it is removed by Baptism. Only Christ is excepted from this stain. Not even the Virgin Mary was immune from it’ trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“We, therefore, maintain that the rational soul is infused by God into the embryo, not indeed θύραθεν ἐπεισιέναι (entering from without), as Aristotle wishes in book 2 of On the Generation of Animals, chapter 3, but is formed by God in the fetus itself and the rudiment of the human body. Scripture teaches this. For in Isa. 57:16 God speaks thus: “The spirit from my face shall clothe man, and I make the souls.” And in Zech. 12:1: “Thus says the Lord, who stretches out the heavens, and lays the foundation of the earth, and forms the spirit within him.”…”

0within%20him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9dee71a478" data-kw="">
<blockquote><p>The Onan passage (Gen. 38) is often marshaled as evidence that God does indeed forbid conception control (the spilling of seed without the purpose of conception). Certainly this passage opposes selfishness in the use of conception control and it also illustrates six concrete laws that were broken by Onan. However, neither the Onan example nor the law of God show our BLCC [Biblically Limited Conception Control] practices to be in sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’</cite>, (2017)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-b1f5f5dfda" data-kw="">
<blockquote><p>Indeed, there are almost as many Scriptures that speak of the curse of many children (Gen. 3:16; Eccl. 6:3; Is. 49:19-21; Deut. 28:18-19; Ezek. 5:7-8 [KJV]; Jer. 15:9; Job 27:13-15; Luke 23:29) as there are that speak of the blessings of having many children (Gen. 17:2,20; 22:17; 26:24; 28:3; 35:11; 48:4; Ex. 32:13; Deut. 7:14; Ps. 17:14; 113:9; 127:1-5; 128:1-6; Prov. 17:6; 1 Tim. 5:14). The fall has brought about circumstances that certainly lead to great difficulties – so great that the Scripture no longer speaks of those many children as always being a blessing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’</cite>, (2017)</span></figcaption>

</figure><figure class="quote" id="q-6e3c03ef1c" data-kw="">
<blockquote><p>The rational soul is infused around the third day from the conception of the seed, understand if the conception proceeds to life and is not frustrated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648) Latin | Disputations on Creation, Appendix 1 | After problem 24, pp. 332-33 | “Problem 3: At what time the soul is infused into the body. | Where there is an open distinction between pregnant women in whom the fetus is animated [animatus est, ensouled], and in whom it is not. It is therefore expedient to know when it is animated. | Others who deny that the soul is infused immediately from conception do not agree among themselves at what point of time or with how many days having passed, the intellective soul is united to the body. Valles in his Controversies, bk. 2, ch. 9 at the end says that females are never formed before the fortieth day, but males are formed in thirty or thirty-five days. The Coimbrans in their commentary on Aristotle’s On the Soul, bk. 2, article 2, section 2 say that the more common opinion, which they also follow, is that in males the conformation of the body is completed, and consequently the soul infused, around the fortieth day, in females around the eightieth. Feyens in his treatise, On the Formation of the Fetus, question 8, conclusion 2, says:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

s+infused+immediately+from+conception+do+not+agree+among+themselves+at+what+point+of+time+or+with+how+many+days+having+passed%2C+the+intellective+soul+is+united+to+the+body.+Valles+in+his+Controversies%2C+bk.+2%2C+ch.+9+at+the+end+says+that+females+are+never+formed+before+the+fortieth+day%2C+but+males+are+formed+in+thirty+or+thirty-five+days.+The+Coimbrans+in+their+commentary+on+Aristotle%E2%80%99s+On+the+Soul%2C+bk.+2%2C+article+2%2C+section+2+say+that+the+more+common+opinion%2C+which+they+also+follow%2C+is+that+in+males+the+conformation+of+the+body+is+completed%2C+and+consequently+the+soul+infused%2C+around+the+fortieth+day%2C+in+females+around+the+eightieth.+Feyens+in+his+treatise%2C+On+the+Formation+of+the+Fetus%2C+question+8%2C+conclusion+2%2C+says%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6e3c03ef1c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6e3c03ef1c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=The%20rational%20soul%20is%20infused%20around,to%20life%20and%20is%20not%20frustrated&amp;text=The%20rational%20soul%20is%20infused%20around%20the%20third&amp;text=conception%20proceeds%20to%20life%20and%20is%20not%20frustrated" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

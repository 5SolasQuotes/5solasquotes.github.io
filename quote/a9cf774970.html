</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b571955e76" data-kw="">
<blockquote><p>…in the doctrine of scandal, which is more intricate and obscure than every divine conceives, God places acts of providential necessity as emergent significations of his approving will, which are so to us in place of a divine commandment of God’s revealed will, and these providential acts of necessity do no less oblige us to moral obedience than any of the express written commandments of God. I clear it thus: There is an express law, It is sin and unlawful for David, or any man, who is not one of the Lord’s priests, to eat showbread. But God comes in and puts David in such a posture of divine providence that if he eat not showbread, he shall be sinfully guilty of violating a higher moral law of God, who says, ‘I will have mercy and not sacrifice.’ Then David shall be cruel to his own life, and sin against the Sixth Commandment, ‘Thou shalt do no murder,’ if he eat not; for not to eat, when you are in a providential condition of starving, if you may have it, is to kill yourself, and this providential condition does no less oblige you to the moral obedience of the Sixth Command than if God in the letter of the Law should command you to eat. This fact of David was not done by any extraordinary impulsion of the Spirit, but by a constant channel that providence ordinarily runs in, according to which I, or any professor [of Christianity] must be obliged to prefer a work of mercy to sacrifice, that is, by which we are to give obedience to the Sixth Command, which is not to kill; even as without extraordinary impulsion, I may absent myself from hearing the Word when I find going to Church may endanger my life, for non-obedience to affirmatives [affirmative commands] in a greater necessity is ordinary. And therefore Christian prudence, with which the Wisdom of God keeps house, Prov. 8:12, does determine many things of scandal: And prudence is a virtue commanded in the Word of God, for a wise man observes times, and so will he observe all other circumstances… Now these [things against a positive divine law] we are upon no ordinary necessity to do, but such as may encroach upon the hazard of the loss of life, in which case an exigence of providence does stand for a command of non-murdering; had Saul and his army been reduced to a danger of starving in a wilderness, and could have no food except they should kill and eat the cattle of the Amalakites, conceive the Lord’s preferring of mercy before sacrifice should warrant them to eat of the Amalakites cattle, yet would this providential necessity be so limited as it may fall out that it stand not for a divine command, for it holds in affirmative commands only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Appendix, Intro to Scandal, question 6, pp. 81-83</span></figcaption>

</figure><figure class="quote" id="q-4c3302b976" data-kw="">
<blockquote><p>When these things were finished, ‘the evening and the morning,’ Moses tells us, ‘were the first day.’ By ‘the evening’ here we understand not the beginning of the day according to the calculation which the Jews make during their festival seasons, but the close of the preceding day, and by the morning the beginning of the following day. Therefore Moses says ‘and the evening was,’ i.e., the darkness came on: just as he who labors during the day rests in the evening and on the following morning resumes his toils. Thus terminated the first day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-venema.html">Herman Venema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Translation of Hermann Venema’s inedited Institutes of Theology tr. Alexander W. Brown (d. 1787; Edinburgh: T&amp;T Clark, 1850), ch. 19, Creation, p. 344</span></figcaption>

<blockquote><p>…we conceive therefore these to be permitted.

1. All duties of piety, as was sacrificing under the Old Testament, or preaching, hearing or going about the sacraments under the New Testament: In which sense, Mt. 12, our Lord says the priests profaned the Sabbath and were blameless, not that formally they prophaned the Sabbath, or did indeed break that command, but materially they wrought in killing beasts, etc. which had been unlawful, had it not been in the exercises of piety.

2. All things that have a tendency, as necessary helps and means to the performance of the former works of piety, are lawful, as going to the congregation to hear the Law, calling the assembly for worship by trumpets, or bells, or by a voice, journeying, going or riding to Church, etc. because the duties of the Sabbath cannot well be done without some of these, nor at all without others of them. If it should be asked here, what that, which is called a Sabbaths day journey, Acts 1:12, was among the Jews? and whence it came, and what way may it be stinted or limited among Christians? Answer: It was to them 2000 cubits… It arose to be reckoned so from these grounds:

1. From their expounding Ex. 16:29, ‘Let none go out of his place;’ thus, Let none go without the bounds of the city, which with its suburbs was 2000 cubits, or a mile about.

2. That the Tabernacle of the congregation was so far from the tents of these who pitched about it in the wilderness, Num. 2, as they supposed; and that the priests kept that distance from the people in entering with the ark into Jordan, Josh. 3:4, whence they gathered that a man might still go to the ark or place of worship, as it was then in these cases at a distance from them, and no further on the Sabbath day. But we say whatever superstitiously or on custom they took up (for that is but their tradition) we cannot stint a Sabbath day’s journey to so many miles, fewer or more, but it must be as the man is in providence cast to reside further from, or nearer to the place where the ordinances are dispensed; for one may go many miles and not profane the Sabbath, if he cannot have the public ordinances nearer, whereas another may break the Sabbath by going but to his neighbor’s door, yea by walking in his own house, or to his door, if either it be done idly, or with respect to another civil or worldly end, which agrees not to that day; it is not here remoteness or nearness, but what sways us, and what is our end, that we are to try by.</p></blockquote>

1. From their expounding Ex. 16:29, ‘Let none go out of his place;’ thus, Let none go without the bounds of the city, which with its suburbs was 2000 cubits, or a mile about.

2. That the Tabernacle of the congregation was so far from the tents of these who pitched about it in the wilderness, Num. 2, as they supposed; and that the priests kept that distance from the people in entering with the ark into Jordan, Josh. 3:4, whence they gathered that a man might still go to the ark or place of worship, as it was then in these cases at a distance from them, and no further on the Sabbath day. But we say whatever superstitiously or on custom they took up (for that is but their tradition) we cannot stint a Sabbath day’s journey to so many miles, fewer or more, but it must be as the man is in providence cast to reside further from, or nearer to the place where the ordinances are dispensed; for one may go many miles and not profane the Sabbath, if he cannot have the public ordinances nearer, whereas another may break the Sabbath by going but to his neighbor’s door, yea by walking in his own house, or to his door, if either it be done idly, or with respect to another civil or worldly end, which agrees not to that day; it is not here remoteness or nearness, but what sways us, and what is our end, that we are to try by.”

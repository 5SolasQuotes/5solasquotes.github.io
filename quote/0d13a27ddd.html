<main class="wrap"><figure class="quote" id="q-0d13a27ddd" data-kw="">
<blockquote><p>It is impossible for the sins of the nearer ancestors, or even any other but the first sin of our first parent to be transmitted by way of origin. The reason is that a man begets his like in species but not in individual. Consequently those things that pertain directly to the individual, such as personal actions and matters affecting them, are not transmitted by parents to their children: for a grammarian does not transmit to his son the knowledge of grammar that he has acquired by his own studies. On the other hand, those things that concern the nature of the species, are transmitted by parents to their children, unless there be a defect of nature: thus a man with eyes begets a son having eyes, unless nature fails. And if nature be strong, even certain accidents of the individual pertaining to natural disposition, are transmitted to the children, e.g. fleetness of body, acuteness of intellect… Other actual sins, however, whether of the first parent or of others, do not corrupt the nature as nature, but only as the nature of that person, i.e. in respect of the proneness to sin: and consequently other sins are not transmitted. According to Augustine in his letter to Avitus [Ep. ad Auxilium ccl.], children are never inflicted with spiritual punishment on account of their parents, unless they share in their guilt, either in their origin, or by imitation, because every soul is God’s immediate property, as stated in Ezekiel 18:4. A man can more easily transmit that which he has of himself, provided it be transmissible. But the actual sins of our nearer ancestors are not transmissible, because they are purely personal, as stated above.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, Part 2, Q. 81, A. 2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7d52868f27" data-kw="">
<blockquote><p>Every sin invades the rights of God and strips him of one or other of his perfections. It is such a vilifying of God as if he were not God; as if he were not the supreme Creator and benefactor of the world; as if we had not our being from him; as if the air we breathed in, the food we lived by were our own by right of supremacy, not of donation.… That affection that excites a man to break his law would excite him to annihilate his being if it were in his power. A man in every sin aims to set up his own will as his rule and his own glory as the end of his actions, against the will and glory of God; and could a sinner attain his end, God would be destroyed: God cannot outlive his will and his glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse 2, On Practical Atheism (every sin invades God’s rights)</span></figcaption>

</figure><figure class="quote" id="q-b334fee3da" data-kw="">
<blockquote><p>Even when we choose evil, we choose for the good, albeit poorly. The choice of the sinner for evil in this sense is not a choice for an alternate, competing reality that is diametrically opposed to the order of goodness. It is a poor choice— an attempt at the good that fails in ways that are both person ally and socially destructive. Understood in this way, vice is not so much an equal alternative to virtue, but a corruption and weakening of the virtus of human nature, which by its natural form is ordered to the good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-m-lynch.html">Reginald M. Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries</cite>, “Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 230 Lynch is a Dominican and writes in the Thomist tradition.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/nature-of-sin.html">Nature of Sin</a></span></div>

</figure><figure class="quote" id="q-f28ca9d143" data-kw="">
<blockquote><p>1. Men enter and initiate themselves in a vicious practice by smaller sins. Heinous sins are too alarming for the conscience of a young sinner; and therefore he only ventures upon such as are smaller, at first. Every particular kind of vice creeps in this gradual manner. 2. Having once begun in the ways of sin, he ventures upon something greater and more daring. His courage grows with his experience. Now, sins of a deeper die do not look so frightful as before. Custom makes everything familiar. No person who once breaks over the limits of a clear conscience knows where he shall stop. 3. Open sins soon throw a man into the hands of ungodly companions. Open sins determine his character, and give him a place with the ungodly. He shuns the society of good men, because their presence is a restraint, and their example a reproof to him. There are none with whom he can associate but the ungodly. 4. In the next stage, the sinner begins to feel the force of habit and inveterate custom; he becomes rooted and settled in an evil way.—Those who have been long habituated to any sin, how hopeless is their reform! One single act of sin seems nothing; but one after another imperceptibly strengthens the disposition, and enslaves the unhappy criminal beyond the hope of recovery. 5. The next stage in a sinner’s course is to lose the sense of shame, and sin boldly and openly. So long as shame remains, it is a great drawback. But it is an evidence of an uncommon height of impiety, when natural shame is gone. 6. Another stage in the sinner’s progress is to harden himself so far as to sin without remorse of conscience. The frequent repetition of sins stupefies the conscience. They, as it were, weary it out, and drive it to despair. It ceases all its reproofs, and, like a frequently discouraged friend, suffers the infatuated sinner to take his course. And hence, 7. Hardened sinners often come to boast and glory in their wickedness. It is something to be beyond shame; but it is still more to glory in wickedness, and esteem it honorable. Glorious ambition indeed! 8. Not content with being wicked themselves, they use all their arts and influence to make others wicked also. They are zealous in sinning, and industrious in the promotion of the infernal cause.—They extinguish the fear of God in others, and laugh down their own conscientious scruples. And now, 9. To close the scene, those who have thus far hardened themselves, are given up by God to judicial blindness of mind and hardness of heart. They are marked out as vessels of wrath fitted to destruction. This is the consequence of their obstinacy. They are devoted the judgment they deserve. Reader! view it with terror.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-witherspoon.html">John Witherspoon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Evangelical Guardian</cite>, 4.10 (February 1847), pp. 461-62</span></figcaption>

<blockquote><p>5. Children! Be humbled under the sense of the iniquity of your parents when ye remember their ways, or possess what unjustly they have gotten, ye become guilty of their sins, without repentance. Especially you have need to take notice of this that are the children of parents that have opposed the purity of God’s service and worship and the work of its reformation, and have been corrupters of it: Children may be partakers of their parents’ faults and so plagued for them several ways; and we think that this forfeiture is more than ordinary. And therefore, as amongst men there are special crimes beyond ordinary procuring such a sentence, so is it here. And: 1. They be guilty by following their foot-steps, in walking in their parents sins, as Jeroboam’s children did. 2. In approving their fathers’ way, praising their fathers’ sayings or doings, as it is Psalm 49:13. 3. In winking at their parents’ sins and wickedness. 4. In boasting of their oppressions, bloodshed, etc. as if they were were acts of valor and manhood. 5. In being content that their fathers sinned, if it gained any possession to them. 6. In possessing and enjoying without repentance what to their knowledge they sinfully purchased. 7. In spending prodigally and riotously what the parents covetously gathered; the sin of the parent here is the seed of the sons’ sin. 8. In professing sorrow for the want [lack] of occasion to live in ignorance, profanity, or looseness as their fathers did, as in Jer. 44:17-19, they said that things went well then. [9.] In not being humbled before God for the sins of predecessors, nor confessing them to him, as Lev. 26:40, nor repairing the losses or injuries which we knew they did to any that were wronged or oppressed by them.</p></blockquote>

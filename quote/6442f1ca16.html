<main class="wrap"><figure class="quote" id="q-6442f1ca16" data-kw="">
<blockquote><p>Few seem to have any opinions of their own, or to think for themselves. Like dead fish, they go with the stream and tide: what others think right, they think right; and what others call wrong, they call wrong too. There are not many original thinkers in the world. Most men are like sheep. If it was the fashion of the day to be Romanists, they would be Romanists, – if to be Mahometans, they would be Mahometans [Muslims]. They dread the idea of going against the current of the time. In a word, the opinion of the day becomes their religion, their creed, their Bible, and their God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Upper Room: Being a Few Truths for the Times</cite>, (1880; Edinburgh: Banner of Truth, 1970), p. 391.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>Order is an excellent means of edification and of preserving truth, charity and peace, but it is but a means to the ends of the things ordered and the public good. Therefore if order should be made the advantage of heresy, Church-tyranny or iniquity, and be turned against the good of Church and souls (as it is in the policy of the Roman Church and in well ordered armies of rebels or such as have unlawful wars), this would make it no schism or sin to break such order.</p></blockquote>

</figure><figure class="quote" id="q-3b47021f5c" data-kw="">
<blockquote><p>As to the political law of the Jews, that has been abolished in two respects; first, as it served to distinguish the Jewish commonwealth from all others, and as it was a type of the Redeemer’s kingdom. Now there is no longer any difference between Jews and Gentiles in Christ, (Gal. iii. 28,) and the Messiah having appeared, there is no need for his kingdom to be typified.

Secondly, it is abrogated in those things which are of particular obligation, and which were only applicable to the Jews; as the law concerning the marriage of a brother’s wife, the law of divorce, the jubilee, the first-born, the sowing of fields with different seeds, &amp;c. &amp;c.

But it is not abrogated in those things which are of universal obligation, being founded on the law of nature; which serve for the explanation of the Decalogue, and are found in the New Testament. The Jewish nation may be considered in two characters, as a people, and as the Jewish people; whatever applies to them simply as a nation, can be applicable to others; but whatever applies to them as the Jewish nation, is of no more obligation upon us, than the laws of the ancient Assyrians, Persians, Greeks, and Romans, or the municipal laws of any foreign nation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 6.18, p. 333.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

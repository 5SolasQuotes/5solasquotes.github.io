<main class="wrap"><figure class="quote" id="q-0f64f5e2a4" data-kw="">
<blockquote><p>…Which, as I take it, is to be understood of any time of her coming abroad. But this kind of covering is not used in these cold countries, but instead thereof hats, or other dresses, a difference being yet still retained, in that the woman’s cover upon her head is fixed, but the man moves his in salutation and for reverence at any time… But this as has been already touched out of Beza, holds not but in such countries where to sit with the hat off argues authority, and to be covered, subjection; In these parts it is contrariwise, and therefore our preaching uncovered does not seem to be grounded upon this, but rather to have been taken up in reverence to God… And upon the like reason men are appointed to hear the Word of God read being uncovered, and to follow the same order at the preaching of the Word is most commendable in all, that are not constrained by their bodily infirmity to cover. Only I say it is altogether from the purpose of this place to teach a necessity of so doing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon All the Epistles of the Apostle Saint Paul... (London, 1631), on 1 Cor. 11 Mayer (1583–1664) was an English clergyman, who, it appears, conformed at 1662. | Question 4</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9201d7f829" data-kw="">
<blockquote><p>2nd Point. …whereby we have good light for the expounding of a place in Paul, 1 Cor. 11:10, saying, that the woman ought to have power over her head, that is, be covered, because of the angels. Whereby ‘angels’ may well be understood the preachers and ministers of the Gospel. And the reason of that precept may be this: Among the Corinthians the covering of the head was not as it is with us, a token of preeminence and superiority, but a sign of subjection. And therefore the apostle would have the women of Corinth, when they came into the congregation, to have their heads covered, according to the custom of their country in other assemblies, to signify their submission and reverence unto the ministry of the Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Learned Exposition or Commentary upon the Three First Chapters of the Revelation… (d. 1602; London, 1606)</cite>, ch. 1, pp. 69-70</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-c0c6ee3e9b" data-kw="">
<blockquote><p>Out of all which it is manifestly gathered, if men indeed nourish [their] hair, it is not simply contrary to nature, but whatever Paul here [v. 14] wrote of nature, it is necessary to be received of the custom of that time and people.</p></blockquote>

</figure><figure class="quote" id="q-f5c66c7321" data-kw="">
<blockquote><p>Honor is but the expressing of the inward respect we bear to persons by outward signs, speeches and gestures; without the outward signification of it thus, no man can tell who is honored: and as is the custom of the nation, so we express this, whether by uncovering the head, bowing the body, etc.</p></blockquote>

</figure><figure class="quote" id="q-d01a75c6aa" data-kw="">
<blockquote><p>The testimonies of Cyprian, Ambrose, Augustine, are easily answered, in a few words: They speak not of mystical rites, or significant ceremonies, but of some civil external usages gotten into worship; different in diverse places; as Socrates [the early Church, ecclesiastical historian] tells us of many, in his time, as in observation of Easter or Lent: in receiving the Lord’s Supper at evening or morning, standing or sitting, etc. Such an usage in Reformed Churches, is, that somewhere the ministers preach with heads covered, otherwhere, bare-headed, and many the like: In such things, those ancients advise to conform to the usages of the places where they come: but surely, would never have wise people to comply in things inexpediently sinful, in worship, in any place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-bagshaw.html">Edward Bagshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The XXIV Cases concerning things Indifferent in Religious Worship Considered… (London, 1663), The Grand Case Considered, I. Touching Things Inexpedient</cite>, pp. 41-42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

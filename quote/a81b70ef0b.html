<main class="wrap"><figure class="quote" id="q-a81b70ef0b" data-kw="">
<blockquote><p>Here I might admonish them which separate themselves from our church [of England]. As Paul saith, ‘Examine whether you be in the faith,’ so examine whether you have the show of error. Hath it not the show of error to broach a religion which was never heard of before? Hath it not the show of error to retain an opinion which the author himself [Robert Browne] hath recanted, as though ye would suck up that which the dog hath vomited? Hath it not the show of error to affirm that those preachers may not be heard, which (by their own confessions) have converted them to the knowledge of God, and daily convert others? Hath it not the show of error to affirm that the Lord’s prayer may not be used for a prayer, which for anything that we or they can read, was so used from the beginning?

Hath it not the show of error to say that no man may use any set prayer, seeing there be many set prayers, and psalms, and blessings in the holy Scripture, which were used in the same form? Hath it not the show of error to affirm that we have no church, and yet to grant that our martyrs which died in popery were true members of the church? Hath it not the show of error to affirm that two or three may excommunicate all the rest without a minister, seeing the pastor is the mouth of the church?

Hath it not the show of error to affirm that the church of Christ was ever invisible before this age, and that it is such a small flock as their number is, and that it hath set foot nowhere but in England? Hath it not the show of error to hold that for good and sound religion which is altered every day, adding and detracting, as though a man should make a religion of his own invention, so fast as new conceits come into his brain: Let them think what Paul Saith unto them, ‘Be wise unto sobriety,’ Rom. xii. 3, and suspect that construction which yourselves devised; for Solomon saith, There is an error upon the right hand as well as upon the left, Prov. iv. 27; that is (as I may call it), the zealous error; and if this be not, I know none within this land.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Trial of the Spirits</cite>, (1591) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 1: 143.</span></figcaption>

<blockquote><p>2. The greatest charge… appears [to be] that the Church of Scotland does not press the renewing of the Covenants, National [1638] and Solemn League [1643]. But there are several things as to this that they take no notice of, which, if noticed, might, in a great measure, allay their clamour: (1) That the National Covenant is, indeed, a confession of our faith, very praiseworthy in its time, but I conceive, for variety and perspicuity, not to be compared with the Westminster Confession, which we own and press. (2) That the Westminster Confession is ratified in King William’s Parliament, and the other [the National Covenant] was approven [implicitly, not explicitly] by the last Parliament of King Charles the Second [in 1681], where I think [James] the Duke of York presided, and included [it] in the bosom of the Test [for civil office] as a point thereof; which honour I believe that Parliament would not have given to the Westminster Confession. (3) As to the Solemn League, they would do well to consider, more seriously, what that answer does overly take notice of, p. 13, near the beginning, viz. that the [General] Assembly [of the Church of Scotland] appoints its being subscribed by all the true professors of the Reformed religion, only after its reception and approbation in the kingdom of England. But they should have considered further, that the Assembly, for aught I can find, by their act, do not appoint even that it be subscribed, only they recommend to the honorable Convention of Estates, that, being examined and approved by them, it may be sent to England, to be received and approven there, that after that it may be, with all religious solemnity, sworn, etc. (4) They would consider whether it be practicable to get England to consent to renew that Covenant, and if it be, whether they themselves will undertake to gain their consent. (5.) Whether we can renew it without their consent, and whether, in that case, it would be a league and covenant. (6) Whether that league and covenant obliges us by open force to constrain them to extirpate prelacy, when they are not willing and do not consent to it. (7) Whether it be in our power to do it. And, (8) Whether it were lawful for us to do it if it were in our power; and whether ever our blessed Lord gave any such commandment to his followers by the power of the sword to reform nations, as it is said Mahomet gave to his followers, and Romish antichrist has too much practiced. Another heavy charge against the Church of Scotland, on which these people ground their schism and separation, is, that the breaches of these covenants, and other such sins of public defection, are not, or have not been, publicly acknowledged. But this is very uncharitable, for, 1690, there was a very full acknowledgment and enumeration of those sins, and of defection in the causes of the fast emitted by that Assembly… For breach of covenant is really among the causes of that fast [in 1706], seeing the act expressly requires ministers both to warn of and confess the national sins enumerated in causes of fast 1690, 1700, and 1701, in all which breach of covenant is very particularly acknowledged… And now, if that be a sufficient ground of separation from the Church of Scotland, I could appeal to all the Protestant Churches in Europe… Another charge against mhiisters, wherefore they are to be separated from, is because our civil rulers have only asserted as the ground of their re-establishing Presbytery, that it was more agreeable to the people’s inclinations, etc.; ergo [therefore], ministers must be disowned. But have any ministers ever asserted that this is the only ground; have they not, do they not plead its divine right? Yea, if I mistake not, even the Parliament, in one of the acts, have asserted its being agreeable to and founded upon the Word of God. But I am weary of these things, and therefore will not go furder, nor meddle with that which seems to be also a great prejudice against ministers, their subjecting to the Government and our present Queen, who is of the communion of the Church of England. But, would ever our worthy Reformers, of whom they so much boast, have refused subjection to King James the Sixth and his son King Charles [I], because of that communion? Would they not have been well satisfied, if they had but suffered the Church of Scotland to enjoy her privileges? But I must now forbear, and remember I am not writing an answer to that paper, nor do I design it… I had forgot to signify, that though the author of the Modest Reply greatly quarrels [with] our Church constitution, yet, from what appears through his discourse, there is too much ground to apprehend that the great eye-sore is the civil constitution, and hinc illae lacrymae [hence those tears]!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 39, ‘Vindication of the Church of Scotland in Answer to a Cameronian Pamphlet’</cite>, (1710) in The Correspondence of the Rev. Robert Wodrow, 3 vols. (Edinburgh: Wodrow Society, 1842), vol. 1, pp. 122-27</span></figcaption>

<div class="actions"><button class="copy" data-copy="“2. The greatest charge… appears [to be] that the Church of Scotland does not press the renewing of the Covenants, National [1638] and Solemn League [1643]. But there are several things as to this that they take no notice of, which, if noticed, might, in a great measure, allay their clamour: (1) That the National Covenant is, indeed, a confession of our faith, very praiseworthy in its time, but I conceive, for variety and perspicuity, not to be compared with the Westminster Confession, which we own and press. (2) That the Westminster Confession is ratified in King William’s Parliament, and the other [the National Covenant] was approven [implicitly, not explicitly] by the last Parliament of King Charles the Second [in 1681], where I think [James] the Duke of York presided, and included [it] in the bosom of the Test [for civil office] as a point thereof; which honour I believe that Parliament would not have given to the Westminster Confession. (3) As to the Solemn League, they would do well to consider, more seriously, what that answer does overly take notice of, p. 13, near the beginning, viz. that the [General] Assembly [of the Church of Scotland] appoints its being subscribed by all the true professors of the Reformed religion, only after its reception and approbation in the kingdom of England. But they should have considered further, that the Assembly, for aught I can find, by their act, do not appoint even that it be subscribed, only they recommend to the honorable Convention of Estates, that, being examined and approved by them, it may be sent to England, to be received and approven there, that after that it may be, with all religious solemnity, sworn, etc. (4) They would consider whether it be practicable to get England to consent to renew that Covenant, and if it be, whether they themselves will undertake to gain their consent. (5.) Whether we can renew it without their consent, and whether, in that case, it lso a great prejudice against ministers, their subjecting to the Government and our present Queen, who is of the communion of the Church of England. But, would ever our worthy Reformers, of whom they so much boast, have refused subjection to King James the Sixth and his son King Charles [I], because of that communion? Would they not have been well satisfied, if they had but suffered the Church of Scotland to enjoy her privileges? But I must now forbear, and remember I am not writing an answer to that paper, nor do I design it… I had forgot to signify, that though the author of the Modest Reply greatly quarrels [with] our Church constitution, yet, from what appears through his discourse, there is too much ground to apprehend that the great eye-sore is the civil constitution, and hinc illae lacrymae [hence those tears]!”

— Robert Wodrow, Letter 39, ‘Vindication of the Church of Scotland in Answer to a Cameronian Pamphlet’, (1710) in The Correspondence of the Rev. Robert Wodrow, 3 vols. (Edinburgh: Wodrow Society, 1842), vol. 1, pp. 122-27">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+The+greatest+charge%E2%80%A6+appears+%5Bto+be%5D+that+the+Church+of+Scotland+does+not+press+the+renewing+of+the+Covenants%2C+National+%5B1638%5D+and+Solemn+League+%5B1643%5D.+But+there+are+several+things+as+to+this+that+they+take+no+notice+of%2C+which%2C+if+noticed%2C+might%2C+in+a+great+measure%2C+allay+their+clamour%3A+%281%29+That+the+National+Covenant+is%2C+indeed%2C+a+confession+of+our+faith%2C+very+praiseworthy+in+its+time%2C+but+I+conceive%2C+for+variety+and+perspicuity%2C+not+to+be+compared+with+the+Westminster+Confession%2C+which+we+own+and+press.+%282%29+That+the+Westminster+Confession+is+ratified+in+King+William%E2%80%99s+Parliament%2C+and+the+other+%5Bthe+National+Covenant%5D+was+approven+%5Bimplicitly%2C+not+explicitly%5D+by+the+last+Parliament+of+King+Charles+the+Second+%5Bin+1681%5D%2C+where+I+think+%5BJames%5D+the+Duke+of+York+presided%2C+and+included+%5Bit%5D+in+the+bosom+of+the+Test+%5Bfor+civil+office%5D+as+a+point+thereof%3B+which+honour+I+believe+that+Parliament+would+not+have+given+to+the+Westminster+Confession.+%283%29+As+to+the+Solemn+League%2C+they+would+do+well+to+consider%2C+more+seriously%2C+what+that+answer+does+overly+take+notice+of%2C+p.+13%2C+near+the+beginning%2C+viz.+that+the+%5BGeneral%5D+Assembly+%5Bof+the+Church+of+Scotland%5D+appoints+its+being+subscribed+by+all+the+true+professors+of+the+Reformed+religion%2C+only+after+its+reception+and+approbation+in+the+kingdom+of+England.+But+they+should+have+considered+further%2C+that+the+Assembly%2C+for+aught+I+can+find%2C+by+their+act%2C+do+not+appoint+even+that+it+be+subscribed%2C+only+they+recommend+to+the+honorable+Convention+of+Estates%2C+that%2C+being+examined+and+approved+by+them%2C+it+may+be+sent+to+England%2C+to+be+received+and+approven+there%2C+that+after+that+it+may+be%2C+with+all+religious+solemnity%2C+sworn%2C+etc.+%284%29+They+would+consider+whether+it+be+practicable+to+get+England+to+consent+to+renew+that+Covenant%2C+and+if+it+be%2C+whether+they+themselves+will+undertake+to+gain+their+consent.+%285.%29+Whether+we+can+renew+it+without+their+consent%2C+and+whether%2C+in+that+case%2C+it+would+be+a+league+and+covenant.+%286%29+Whether+that+league+and+covenant+obliges+us+by+open+force+to+constrain+them+to+extirpate+prelacy%2C+when+they+are+not+willing+and+do+not+consent+to+it.+%287%29+Whether+it+be+in+our+power+to+do+it.+And%2C+%288%29+Whether+it+were+lawful+for+us+to+do+it+if+it+were+in+our+power%3B+and+whether+ever+our+blessed+Lord+gave+any+such+commandment+to+his+followers+by+the+power+of+the+sword+to+reform+nations%2C+as+it+is+said+Mahomet+gave+to+his+followers%2C+and+Romish+antichrist+has+too+much+practiced.+Another+heavy+charge+against+the+Church+of+Scotland%2C+on+which+these+people+ground+their+schism+and+separation%2C+is%2C+that+the+breaches+of+these+covenants%2C+and+other+such+sins+of+public+defection%2C+are+not%2C+or+have+not+been%2C+publicly+acknowledged.+But+this+is+very+uncharitable%2C+for%2C+1690%2C+there+was+a+very+full+acknowledgment+and+enumeration+of+those+sins%2C+and+of+defection+in+the+causes+of+the+fast+emitted+by+that+Assembly%E2%80%A6+For+breach+of+covenant+is+really+among+the+causes+of+that+fast+%5Bin+1706%5D%2C+seeing+the+act+expressly+requires+ministers+both+to+warn+of+and+confess+the+national+sins+enumerated+in+causes+of+fast+1690%2C+1700%2C+and+1701%2C+in+all+which+breach+of+covenant+is+very+particularly+acknowledged%E2%80%A6+And+now%2C+if+that+be+a+sufficient+ground+of+separation+from+the+Church+of+Scotland%2C+I+could+appeal+to+all+the+Protestant+Churches+in+Europe%E2%80%A6+Another+charge+against+mhiisters%2C+wherefore+they+are+to+be+separated+from%2C+is+because+our+civil+rulers+have+only+asserted+as+the+ground+of+their+re-establishing+Presbytery%2C+that+it+was+more+agreeable+to+the+people%E2%80%99s+inclinations%2C+etc.%3B+ergo+%5Btherefore%5D%2C+ministers+must+be+disowned.+But+have+any+ministers+ever+asserted+that+this+is+the+only+ground%3B+have+they+not%2C+do+they+not+plead+its+divine+right%3F+Yea%2C+if+I+mistake+not%2C+even+the+Parliament%2C+in+one+of+the+acts%2C+have+asserted+its+being+agreeable+to+and+founded+upon+the+Word+of+God.+But+I+am+weary+of+these+things%2C+and+therefore+will+not+go+furder%2C+nor+meddle+with+that+which+seems+to+be+also+a+great+prejudice+against+ministers%2C+their+subjecting+to+the+Government+and+our+present+Queen%2C+who+is+of+the+communion+of+the+Church+of+England.+But%2C+would+ever+our+worthy+Reformers%2C+of+whom+they+so+much+boast%2C+have+refused+subjection+to+King+James+the+Sixth+and+his+son+King+Charles+%5BI%5D%2C+because+of+that+communion%3F+Would+they+not+have+been+well+satisfied%2C+if+they+had+but+suffered+the+Church+of+Scotland+to+enjoy+her+privileges%3F+But+I+must+now+forbear%2C+and+remember+I+am+not+writing+an+answer+to+that+paper%2C+nor+do+I+design+it%E2%80%A6+I+had+forgot+to+signify%2C+that+though+the+author+of+the+Modest+Reply+greatly+quarrels+%5Bwith%5D+our+Church+constitution%2C+yet%2C+from+what+appears+through+his+discourse%2C+there+is+too+much+ground+to+apprehend+that+the+great+eye-sore+is+the+civil+constitution%2C+and+hinc+illae+lacrymae+%5Bhence+those+tears%5D%21%E2%80%9D%0A%0A%E2%80%94+Robert+Wodrow%2C+Letter+39%2C+%E2%80%98Vindication+of+the+Church+of+Scotland+in+Answer+to+a+Cameronian+Pamphlet%E2%80%99%2C+%281710%29+in+The+Correspondence+of+the+Rev.+Robert+Wodrow%2C+3+vols.+%28Edinburgh%3A+Wodrow+Society%2C+1842%29%2C+vol.+1%2C+pp.+122-27&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5b2b566a7a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5b2b566a7a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=2.%20The%20greatest%

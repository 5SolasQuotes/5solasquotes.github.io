<blockquote><p>47. Yet because the lifting up of the heart to God is together required, Simul &amp; consequenter, and going along with the thing that is sung, and it is also the end of that meditation; therefore we are said to sing in our heart to the Lord, Col. 3:16, and psalms that are sung have the consideration of prayers. 48. But because this religious melody hath the respect of prayers, therefore it is not so fit that the Decalogue, and other such like, which do not partake the nature of prayer, be turned into meter and be sung instead of psalms. … 53. But in the melody of singing, because it tendeth to our mutual edification, attention, and stirring up of pious affections among us one toward another, Col. 3:16, therefore all do join their voices together, 1. Chron. 16:35; Mk. 14:26.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity Drawn out of the Holy Scriptures, and the Interpreters thereof, and brought into Method (London: 1642), Book 2, ch. 9, ‘Of Prayer’</cite>, p. 284</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9dccb82cb1" data-kw="">
<blockquote><p>Add unto this, that whereas in praying we are to speak only unto God, it is otherwise in singing, where we are taught to ‘speak unto ourselves in psalms’, and ‘to teach, and admonish ourselves in psalms, and hymns, and spiritual songs’ (Eph. 5:19; Col. 3:16). What greater difference? In prayers we speak only to God: in psalms to our selves mutually, or one to another…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Justification of Separation from the Church of England Against Mr. Richard Bernard his Invective, entitled, The Separatists Schism (Amsterdam, 1610), p. 467. See through p. 469 where only psalms are mentioned, and that from the book of psalms.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-4842eb8ff8" data-kw="">
<blockquote><p>That it is an ancient and excellent ordinance of God, that in his worship and service we should sing psalms, even David’s Psalms, and that we should sing them in that manner as may be most unto edification. Observe the proof of this doctrine, as I shall propound it unto you distinctly in three points: … Thirdly, the Psalms that God’s people did use to sing in the worship of God were most usually David’s Psalms, and those that are accounted among his: and that even at such times when there were prophets in the Church that had extraordinary gifts, and were inspired by the Holy Ghost, yet the Church did not usually sing any other than David’s Psalms: This we shall see in the days of Hezekiah, 2 Chron. 29:30. Hezekiah the King, and the princes commanded the Levites to sing praise to the Lord, with the words of David, and of Asaph the Seer. The like we may see in Ezra’s time, Ezra 3:10. They set the priests in their apparel with trumpets; and the Levites the sons of Asaph with cymbals to praise the Lord with those songs (as Tremelius rendreth it) that David the King of Israel did deliver; and the Psalm they sung was, Ps. 136, as appeareth by the 11th verse. And this may also further appear by that which we read, Neh. 12:46. To which purpose it is worthy the observing that though there were many of God’s holy servants that made songs, and psalms beside David, as Deborah, Jud. 5:1, and Anna, the mother of Samuel, 1 Sam. 2:1, and Solomon, Cant. 1:1, and Mary the blessed Virgin, Lk. 1:46, such as might be used, yet were none of them committed to the musicians to be publicly sung in the temple, but these of David only. In which respect he (by an excellency) is called the sweet Psalmist of Israel, 2 Sam. 3:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>152 Lectures upon Psalm 51… (London, 1635), Lecture 1, p. 4-5 This section is occasioned upon the title of Ps. 51, that it is a psalm of David ‘to the chief musician’.</cite></span></figcaption>

</figure><figure class="quote" id="q-cfde23bc92" data-kw="">
<blockquote><p>But because prayers are after two manner of sorts, that is, either in words only, or else with song joined thereunto; and this latter part… is called by many into doubt, whether it may be used in a reformed church; it is expedient that we note briefly a few things pertaining thereunto. S[t]. Paul giving a rule how men should sing… in another place, showing what songs should be sung, exhorteth the Ephesians to “edify one another with psalms, songs of praise, and such as are spiritual…”… … and confirmed by all Antiquity. As, besides other places, is most manifest by the words of Pliny, called the younger, who, when he was depute in Asia unto the Emperor Trajan, and had received charge to inquire out the Christians to put them to death, writ among other things, touching the Christians, “That their manners were to sing verses or psalms early in the morning to Christ their God.”… And there are no songs more appropriate than the Psalms of the Prophet David, which the Holy Ghost hath framed to the same use, and commended to the Church, as containing the effect of the whole Scriptures, that hereby our hearts might be more lively touched, as appeareth by Moses, Hezekiah, Judith, Debora, Mary, Zechariah, and others, who by songs and metre, rather than in their commune speech and prose, gave thanks to God for such comfort as he sent them. Here it were to[o] long to entreat of the metre; but for as much as the learned doubt not thereof, and it is plainly proven that the Psalms are not only metre, and contain just caesuras [rhythmical pauses], but also have grace and majesty in the verse more than any other places of the Scriptures, we need not to enter into any probation. For they that are skillful in the Hebrew tongue, [Read Moses Chabib, in his books called, מרפא לשון דרכי נרעם] by comparing the Psalms with the rest of the Scriptures, easily may perceive the metre. And to whom is it not known, how the Holy Ghost by all means sought to help our memory, when he factioned [fashioned] many Psalms according to the letters of the alphabet; so that every verse beginneth with the letters thereof in order. Sometimes A. beginneth the half verse, and B. the other half; and in another place, three verses, yea and eight verses with one letter, even the Psalm throughout; as if all men should be inflamed with the love thereof, both for variety of matter, and also briefness, easiness, and delectation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whittingham.html">William Whittingham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Form of Prayers and Ministration of the Sacraments, &amp;c., used in the English Congregation at Geneva: and Approved by the Famous and Godly Learned Man, John Calvin (1556; Imprinted at Edinburgh, by Robert Lekprewik and are to be should at his house at the neither bow. Cum priuilegio. 1562), ‘To our Brethren in England…’, pp. 165-6 “This Preface, or Address, is usually ascribed to [William] Whittingham…”, David Laing, Knox’s Works, 4.157.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“But because prayers are after two manner of sorts, that is, either in words only, or else with song joined thereunto; and this latter part… is called by many into doubt, whether it may be used in a reformed church; it is expedient that we note briefly a few things pertaining thereunto. S[t]. Paul giving a rule how men should sing… in another place, showing what songs should be sung, exhorteth the Ephesians to “edify one another with psalms, songs of praise, and such as are spiritual…”… … and confirmed by all Antiquity. As, besides other places, is most manifest by the words of Pliny, called the younger, who, when he was depute in Asia unto the Emperor Trajan, and had received charge to inquire out the Christians to put them to death, writ among other things, touching the Christians, “That their manners were to sing verses or psalms early in the morning to Christ their God.”… And there are no songs more appropriate than the Psalms of the Prophet David, which the Holy Ghost hath framed to the same use, and commended to the Church, as containing the effect of the whole Scriptures, that hereby our hearts might be more lively touched, as appeareth by Moses, Hezekiah, Judith, Debora, Mary, Zechariah, and others, who by songs and metre, rather than in their commune speech and prose, gave thanks to God for such comfort as he sent them. Here it were to[o] long to entreat of the metre; but for as much as the learned doubt not thereof, and it is plainly proven that the Psalms are not only metre, and contain just caesuras [rhythmical pauses], but also have grace and majesty in the verse more than any other places of the Scriptures, we need not to enter into any probation. For they that are skillful in the Hebrew tongue, [Read Moses Chabib, in his books called, מרפא לשון דרכי נרעם] by comparing the Psalms with the rest of the Scriptures, easily may perceive the metre. And to whom is it not known, how the Holy Ghost by all means sought to help our memory, when he factioned [fashioned] many Psalms according to the letters of the alphabet; so that every verse beginneth with the letters thereof in order. Sometimes A. beginneth the half verse, and B. the other half; and in another place, three verses, yea and eight verses with one letter, even the Psalm throughout; as if all men should be inflamed with the love thereof, both for variety of matter, and also briefness, easiness, and delectation.”

— William Whittingham, The Form of Prayers and Ministration of the Sacraments, &amp;c., used in the English Congregation at Geneva: and Approved by the Famous and Godly Learned Man, John Calvin (1556; Imprinted at Edinburgh, by Robert Lekprewik and are to be should at his house at the neither bow. Cum priuilegio. 1562), ‘To our Brethren in England…’, pp. 165-6 “This Preface, or Address, is usually ascribed to [William] Whittingham…”, David Laing, Knox’s Works, 4.157.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+because+prayers+are+after+two+manner+of+sorts%2C+that+is%2C+either+in+words+only%2C+or+else+with+song+joined+thereunto%3B+and+this+latter+part%E2%80%A6+is+called+by+many+into+doubt%2C+whether+it+may+be+used+in+a+reformed+church%3B+it+is+expedient+that+we+note+briefly+a+few+things+pertaining+thereunto.+S%5Bt%5D.+Paul+giving+a+rule+how+men+should+sing%E2%80%A6+in+another+place%2C+showing+what+songs+should+be+sung%2C+exhorteth+the+Ephesians+to+%E2%80%9Cedify+one+another+with+psalms%2C+songs+of+praise%2C+and+such+as+are+spiritual%E2%80%A6%E2%80%9D%E2%80%A6+%E2%80%A6+and+confirmed+by+all+Antiquity.+As%2C+besides+other+places%2C+is+most+manifest+by+the+words+of+Pliny%2C+called+the+younger%2C+who%2C+when+he+was+depute+in+Asia+unto+the+Emperor+Trajan%2C+and+had+received+charge+to+inquire+out+the+Christians+to+put+them+to+death%2C+writ+among+other+things%2C+touching+the+Christians%2C+%E2%80%9CThat+their+manners+were+to+sing+verses+or+psalms+early+in+the+morning+to+Christ+their+God.%E2%80%9D%E2%80%A6+And+there+are+no+songs+more+appropriate+than+the+Psalms+of+the+Prophet+David%2C+which+the+Holy+Ghost+hath+framed+to+the+same+use%2C+and+commended+to+the+Church%2C+as+containing+the+effect+of+the+whole+Scriptures%2C+that+hereby+our+hearts+might+be+more+lively+touched%2C+as+appeareth+by+Moses%2C+Hezekiah%2C+Judith%2C+Debora%2C+Mary%2C+Zechariah%2C+and+others%2C+who+by+songs+and+metre%2C+rather+than+in+their+commune+speech+and+prose%2C+gave+thanks+to+God+for+such+comfort+as+he+sent+them.+Here+it+were+to%5Bo%5D+long+to+entreat+of+the+metre%3B+but+for+as+much+as+the+learned+doubt+not+thereof%2C+and+it+is+plainly+proven+that+the+Psalms+are+not+only+metre%2C+and+contain+just+caesuras+%5Brhythmical+pauses%5D%2C+but+also+have+grace+and+majesty+in+the+verse+more+than+any+other+places+of+the+Scriptures%2C+we+need+not+to+enter+into+any+probation.+For+they+that+are+skillful+in+the+Hebrew+tongue%2C+%5BRead+Moses+Chabib%2C+in+his+books+called%2C+%D7%9E%D7%A8%D7%A4%D7%90+%D7%9C%D7%A9%D7%95%D7%9F+%D7%93%D7%A8%D7%9B%D7%99+%D7%A0%D7%A8%D7%A2%D7%9D%5D+by+comparing+the+Psalms+with+the+rest+of+the+Scriptures%2C+easily+may+perceive+the+metre.+And+to+whom+is+it+not+known%2C+how+the+Holy+Ghost+by+all+means+sought+to+help+our+memory%2C+when+he+factioned+%5Bfashioned%5D+many+Psalms+according+to+the+letters+of+the+alphabet%3B+so+that+every+verse+beginneth+with+the+letters+thereof+in+order.+Sometimes+A.+beginneth+the+half+verse%2C+and+B.+the+other+half%3B+and+in+another+place%2C+three+verses%2C+yea+and+eight+verses+with+one+letter%2C+even+the+Psalm+throughout%3B+as+if+all+men+should+be+inflamed+with+the+love+thereof%2C+both+for+variety+of+matter%2C+and+also+briefness%2C+easiness%2C+and+delectation.%E2%80%9D%0A%0A%E2%80%94+William+Whittingham%2C+The+Form+of+Prayers+and+Ministration+of+the+Sacraments%2C+%26c.%2C+used+in+the+English+Congregation+at+Geneva%3A+and+Approved+by+the+Famous+and+Godly+Learned+Man%2C+John+Calvin+%281556%3B+Imprinted+at+Edinburgh%2C+by+Robert+Lekprewik+and+are+to+be+should+at+his+house+at+the+neither+bow.+Cum+priuilegio.+1562%29%2C+%E2%80%98To+our+Brethren+in+England%E2%80%A6%E2%80%99%2C+pp.+165-6+%E2%80%9CThis+Preface%2C+or+Address%2C+is+usually+ascribed+to+%5BWilliam%5D+Whittingham%E2%80%A6%E2%80%9D%2C+David+Laing%2C+Knox%E2%80%99s+Works%2C+4.157.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcfde23bc92.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../

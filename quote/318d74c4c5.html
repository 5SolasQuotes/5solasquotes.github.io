<main class="wrap"><figure class="quote" id="q-318d74c4c5" data-kw="">
<blockquote><p>He who believes has eternal life. In justification not only the merit of Christ’s passive obedience is imputed but also that of his active obedience. In that benefaction believers receive forgiveness, exemption from punishment, and are not returned to the prefall state of Adam, who with the power granted to him had to keep the law and earn eternal life. On the contrary: on the basis of Christ’s perfect obedience, they are immediately entitled to eternal life; the holy works accomplished by Christ are credited to them; they do not, by keeping the law, have to earn eternal life, but do good works based on the principle of eternal life already granted to them in faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, trans. John Vriend, ed. John Bolt (4 vols, Grand Rapids: Baker Academic, 2003-08), iv, 635.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c5cb3f9194" data-kw="">
<blockquote><p>Two things are seen in Christ which are necessary to our justification: the one is death; the other, resurrection from the dead, etc. [Rom. 4:25] It was fitting that by his death the sins of the world should be expiated, etc. while by his resurrection from the dead, it pleased the same goodness of God to grant the Holy Ghost, through whom the gospel might be believed, and the justice that was lost by the sin of the first Adam might be restored. The apostle has expressed both parts in these words, ‘Who was delivered on account of our sins, etc. [and was raised again for our justification]’ [Rom. 4:25] In his death therefore is found satisfaction for sin; in his resurrection the gift of the Holy Ghost, by which our justification to life is effected…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-borrhaus.html">Martin Borrhaus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, pp. 157-59 Borrhaus (1499–1564) was a professor of philosophy and Old Testament at Basel in the reformed tradition. | On Gen. 15:4, pp. 161-62</span></figcaption>

</figure><figure class="quote" id="q-0bdc33d40a" data-kw="">
<blockquote><p>For convincing a man of sin, righteousness, and judgment, by the gospel. As for convincing a man of sin, and righteousness, and judgment, by the gospel, or covenant of grace, he must understand three things:

1. That not believing in Jesus Christ, or refusing of the covenant of grace offered in him, is a greater and more dangerous sin than all other sins against the law; because the hearers of the gospel, not believing in Christ, do reject God’s mercy in Christ, the only way of freedom from sin and wrath, and will not yield to be reconciled to God.

2. Next, he must understand, that perfect remission of sin, and true righteousness, is to be had only by faith in Jesus; but God requires no other conditions but faith; and testifies from heaven, that he is well pleased to justify sinners upon this condition.

3. He must understand, that upon righteousness received by faith, judgment shall follow, on the one hand, to the destroying of the works of the devil in the believer, and to the perfecting of the work of sanctification in him, with power: and that, upon refusing to take righteousness by faith in Jesus Christ, judgment shall follow, on the other hand, to the condemnation of the unbeliever, and destroying of him with Satan and his servants for ever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson-james-durham.html">David Dickson &amp; James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Saving Knowledge</cite>, (Edinburgh, 1650; repr. Crown &amp; Covenant Publications, 2022), 20–21.</span></figcaption>

u-must-understand/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Mr. Wotton in his papers which he dispersed in this city, and which he acknowledged to be his own when I [Walker] brought them to his face before Mr. Gataker and eight other grave ministers, does deny the imputation of the whole obedience of Christ, to the Law of God; both active and passive, both jointly and severally. He affirms that there is no end or use whatsoever of the imputation of Christ his righteousness for justification. He renounces the law in whole and part, performed by ourselves, or any other in our stead for our justification… he sets up faith, even the act of believing for righteousness, affirms that it is said to be imputed in a proper sense without a trope, and serves for all purposes in our justification under the Gospel, as perfect righteousness of works performed to the whole law did for man’s justification in the first covenant. He denies the punishment of our sins in Christ, and the satisfaction which in Him our head &amp; surety was made to God’s justice for purchase of our pardon… These and such like speeches I condemned for Socinian heresy and blasphemy, as Beza, Paraeus and Lubertus had done before me, and for this Mr. Gataker did deride me, when I gave in my charge against Mr. Wotton 27 years ago, and now [Gataker] blames it in me as falsehood and dishonesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A True Relation of the Chief Passages Between Mr. Anthony Wotton &amp; Mr. George Walker</cite>, A True Relation of the Chief Passages Between Mr. Anthony Wotton &amp; Mr. George Walker in the Years 1611-1615, Written by George Walker for the Vindicating of Himself from Some Imputations Laid on Him by Mr. Thomas Gataker in his Defense of Mr. Wotton (1642) 36 pp., pp. 1-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-04a4146caa" data-kw="">
<blockquote><p>It is a clear case, that these three [belief, fear and love] are the only means, yea a perfectly sufficient means to make the solder and the union between God and man, and to bring a man to the possession and fruition of God (for this comprehends the whole man), so that the whole man is possessed of God, and inflamed by God, when his understanding knows Him, and sees the excellency that is in Him, and when the affections of his heart cleave to Him, and close with the most sovereign affections of fear and love, and then when all his whole man is at the command of this, etc.</p></blockquote>

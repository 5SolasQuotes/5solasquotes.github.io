<blockquote><p>As to 1, the world is one, as the sacred Scriptures teach in innumerable places. It will suffice to have indicated Jn. 1:3; Col. 1:16 compared with Gen. 1, 2, where one world created by the works of six days is described:</p></blockquote>

</figure><figure class="quote" id="q-6a3cda8d11" data-kw="">
<blockquote><p>But even according to what was said above (A. 2), that these names signify the divine substance, although in an imperfect manner, it is also clear from what has been said (AA. 1, 2) that they have diverse meanings. For the idea signified by the name is the conception in the intellect of the thing signified by the name. But our intellect, since it knows God from creatures, in order to understand God, forms conceptions proportional to the perfections flowing from God to creatures, which perfections pre-exist in God unitedly and simply, whereas in creatures they are received and divided and multiplied. As therefore, to the different perfections of creatures, there corresponds one simple principle represented by different perfections of creatures in a various and manifold manner, so also to the various and multiplied conceptions of our intellect, there corresponds one altogether simple principle, according to these conceptions, imperfectly understood. Therefore although the names applied to God signify one thing, still because they signify that under many and different aspects, they are not synonymous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1 | quest. 13 | art. 4, I answer that</cite></span></figcaption>

</figure><figure class="quote" id="q-46682f7824" data-kw="">
<blockquote><p>The forme of Creation, to wit, of that which is primary, is both that hidden force of divine power, put into that first matter, according to the being and conditions of the same: as also the external, immediate and instant bringing forth of the matter &amp; the state thereof, without shape and order: But, of that which is secondary, the form internal is that common and hidden nature of the whole frame, which God has imprinted into all things after a common mean and manner: but the external, whereof speech is here, is that powerful bringing forth of all things, out of the first matter in the beginning of time, by the space of six days; as also the most godly disposing of the same, both in themselues and among themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity (London, 1610), bk. 2, ch. 3, Of Creation, Confirming Part</cite>, p. 104</span></figcaption>

</figure><figure class="quote" id="q-7ed895c771" data-kw="">
<blockquote><p>Thus also a celebration of the finishing of the creation within the space of seven days, which is termed the Sabbath, was observed not only amongst the Grecians and Italians (for of the Hebrews it is clear enough) but also by… and by the most ancient appellations of the days in the week. …and that the lives of those which lived at the beginning, and afterward were protracted almost to the space of a thousand years, it [is] witnessed by Berosus, Manethos, and others…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugo-grotius.html">Hugo Grotius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>True Religion Explained &amp; Defended… (London, 1632), sect. 15</cite>, pp. 47-48</span></figcaption>

<main class="wrap"><figure class="quote" id="q-f327f9ab65" data-kw="">
<blockquote><p>The clearness of the Scripture is twofold; even as the obscurity is twofold also. The one is external, placed in the ministry of the word; the other internal, placed in the understanding of the heart. If you speak of the internal clearness, no man sees one iota in the Scriptures, but he that hath the Spirit of God. … If you speak of the external clearness, nothing whatever is left obscure or ambiguous; but all things that are in the Scriptures, are by the Word brought forth into the clearest light, and proclaimed to the whole world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bondage of the Will</cite>, sect. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/clarity.html">Clarity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5ba654705c" data-kw="Perspicuity">
<blockquote><p>We do not say that every thing is immediately plain and easy in the scriptures, so as to be intelligible to every one; but we say that those things which at first seem obscure and difficult, are afterwards rendered easy, if one be diligent in reading them, and bring with him a pure and pious mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 4, ch. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/clarity.html">Clarity</a></span></div>
<div class="actions"><button class="copy" data-copy="“We do not say that every thing is immediately plain and easy in the scriptures, so as to be intelligible to every one; but we say that those things which at first seem obscure and difficult, are afterwards rendered easy, if one be diligent in reading them, and bring with him a pure and pious mind.”

— William Whitaker, A Disputation on Holy Scripture, Question 4, ch. 3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+do+not+say+that+every+thing+is+immediately+plain+and+easy+in+the+scriptures%2C+so+as+to+be+intelligible+to+every+one%3B+but+we+say+that+those+things+which+at+first+seem+obscure+and+difficult%2C+are+afterwards+rendered+easy%2C+if+one+be+diligent+in+reading+them%2C+and+bring+with+him+a+pure+and+pious+mind.%E2%80%9D%0A%0A%E2%80%94+William+Whitaker%2C+A+Disputation+on+Holy+Scripture%2C+Question+4%2C+ch.+3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5ba654705c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5ba654705c.html">Permalink</a><a class="src" href="https://archive.org/details/disputationonhol00whituoft" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>
</figure><figure class="quote" id="q-9d4abd4aee" data-kw="">
<blockquote><p>That Scripture has this perspicuity is plain (1) from Scripture itself, which proclaims its lucidity. &quot;The testimony of Jehovah is sure, enlightening the eyes&quot; (Ps. 19:8). &quot;Thy words are a lamp to my feet&quot; (Ps. 119:105). &quot;A light shining in the darkness&quot; (II Peter 1:19). &quot;The law is a lamp&quot; (Prov. 6:23). … For Scripture is called &quot;clear&quot; (lucidus) not only because it throws light upon the matters that are understood, but also because it is clear in itself and has been made suitable for throwing light on these matters, if used by people with the eyes of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/clarity.html">Clarity</a></span></div>
<div class="actions"><button class="copy" data-copy="“That Scripture has this perspicuity is plain (1) from Scripture itself, which proclaims its lucidity. &quot;The testimony of Jehovah is sure, enlightening the eyes&quot; (Ps. 19:8). &quot;Thy words are a lamp to my feet&quot; (Ps. 119:105). &quot;A light shining in the darkness&quot; (II Peter 1:19). &quot;The law is a lamp&quot; (Prov. 6:23). … For Scripture is called &quot;clear&quot; (lucidus) not only because it throws light upon the matters that are understood, but also because it is clear in itself and has been made suitable for throwing light on these matters, if used by people with the eyes of faith.”

— Francis Turretin, Institutes of Elenctic Theology, 2.17.8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat%20Scripture%20has%20this%20perspicuity%20is%20plain%20%281%29%20from%20Scripture%20itself%2C%20which%20proclaims%20its%20lucidity.%20%22The%20testimony%20of%20Jehovah%20is%20sure%2C%20enlightening%20the%20eyes%22%20%28Ps.%2019%3A8%29.%20%22Thy%20words%20are%20a%20lamp%20to%20my%20feet%22%20%28Ps.%20119%3A105%29.%20%22A%20light%20shining%20in%20the%20darkness%22%20%28II%20Peter%201%3A19%29.%20%22The%20law%20is%20a%20lamp%22%20%28Prov.%206%3A23%29.%20%E2%80%A6%20For%20Scripture%20is%20called%20%22clear%22%20%28lucidus%29%20not%20only%20because%20it%20throws%20light%20upon%20the%20matters%20that%20are%20understood%2C%20but%20also%20because%20it%20is%20clear%20in%20itself%20and%20has%20been%20made%20suitable%20for%20throwing%20light%20on%20these%20matters%2C%20if%20used%20by%20people%20with%20the%20eyes%20of%20faith.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%202.17.8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9d4abd4aee.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9d4abd4aee.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-12c2017005" data-kw="">
<blockquote><p>The fact that all the true people of God in every age and in every part of the Church, in the exercise of their private judgment, in accordance with the simple rules above stated, agree as to the meaning of Scripture in all things necessary either in faith or practice, is a decisive proof of the perspicuity of the Bible, and of the safety of allowing the people the enjoyment of the divine right of private judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-churchs-authority-over-scripture.html">The church&#x27;s authority over Scripture</a></span><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/clarity.html">Clarity</a></span></div>

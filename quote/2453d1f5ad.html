<main class="wrap"><figure class="quote" id="q-2453d1f5ad" data-kw="">
<blockquote><p>The first great duty of man is to honour the living God. For this he has all the necessary capacities. He is endowed with thought, and affection, and the one is capable of being turned lovingly upon the Lord, and the other can be improved illimitably.

And there is another duty which a righteous man will perform. He will labour to promote the happiness of his brethren of the human family; to remove if possible, the sorrows that may gather around them; to wipe away the tears from their eyes; to soothe their aching hearts, and to lead them by precept, and example to the bosom of the universal Father.

There is another great duty devolving upon men; a duty which the majority of mankind places first upon the list; a regard for one’s own happiness. This blessing so eagerly sought, but which is so seldom found, can only be secured by the discharge of the two former duties. Love to God and man, opens the road to happiness. Love and obedience united, produce this happy state of mind.

He who lives the holiest life, enjoys the happiest spirit; so it has been since men or angels have had being, and so it ever will be. He who loves God, and his fellow men, receives the approbation of Jehovah, and his conscience is the witness. Perfect love flows from the heart in several directions, and like a stream from the brain of a mountain, it gladdens every spot through which it flows. It prepares us to maintain all the relations of life. We become faithful patriots, friends, brothers, companions, parents and Christians.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ba1a071221" data-kw="">
<blockquote><p>The third consolation which Moses here describes is gladness at beauty bestowed — ‘Let the beauty of the Lord our God be upon us.’ Sorrow mars the countenance and clothes the body with sackcloth; but if the Lord will come to us and adorn us with his beauty, then the stains of mourning will speedily disappear. Brethren, what a beauty is this which the Lord giveth— ‘the beauty of the Lord our God!’ This comeliness is the beauty of his grace; for our covenant God is the God of all grace. If the Lord makes us to know that we are his our faces shine. If He fills us with his life and love, then brightness flashes from the eyes, and there is a grace about every movement. This ‘beauty’ means holiness; for holiness is the beauty of God. If the Holy Spirit works in you the beauty of holiness, you will rise superior to your afflictions. If this church shall be made the holier by its bereavements, we shall gain much by our losses. This beauty of the Lord must surely mean his presence with us. As the sun beautifies all things, so does God’s presence. When we know that Jesus is with us, when we feel that he is our helper, when we bask in his love, when he abides with us in power, this is the beauty of the saints. If we have Christ in us, Christ with us, we can bear any amount of trouble. ‘I can do all things, or can bear All suffering if my Lord be there.’ This beauty gives to the believer an attractiveness in the eyes of men: they perceive that we have been with Jesus, and they behold our faces shining like the faces of angels. It is a great thing when a Christian is so happy, so holy, and so heavenly that he attracts others to Christ, and people seek his company because they perceive that he has been in the company of the blessed Lord. God give you this, and if you have it, dear friend, you may forget your sorrows: they are transfigured into joy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-h-spurgeon.html">Charles H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Gladness for Sadness’ on Ps. 90:15-17</cite>, (Jan. 14, 1883) in Metropolitan Tabernacle Pulpit, vol. 29</span></figcaption>

<blockquote><p>Thus, to return to the Scriptural example in Acts 21:20–26 (with 16:3 &amp; 18:21), when new Christians with serious misconceptions about what God required for public worship thought that Paul (a mature Christian teacher) taught against their way of worship, which was seriously defective, Paul, without a fuss, at the instigation of other Christian leaders, publicly led and performed that defective worship to prevent scandal to the erring, for the sake of visible Christian unity. Rather than dissent and abstain, Paul publicly led and participated in that defective, burdensome worship for the greater good. If that was true for inferior, carnal ordinances with no spiritual efficacy (2 Cor. 3:6–17; Heb. 7:18–19; 8:13; 9:10; 10:1–4), how much more does it pertain to impurities in the greater, spiritual, efficacious and enduring ordinances of God?</p></blockquote>

</figure><figure class="quote" id="q-28472d13d7" data-kw="">
<blockquote><p>To have a scrupulous conscience about matters of indifference argues a weak Christian; for so the Apostle calls them “weak in the faith,” such as bound conscience when Scripture left it free. One believer thought he might eat anything, and another doubted the lawfulness of eating sundry things. Now those who doubted, the Apostle called weak; and the weak conscience is apt to be defiled. Not to know our liberty, and to abuse our liberty, is an argument we have but little grace. Young converts call more things sins than ever God did; they perplex and entangle themselves merely in indifferent things. It is true, there ought to be a conscientious tenderness in all Christians; tenderness of conscience is our duty, but a tormenting, entangling scrupulosity is our infirmity. And yet, as a weak Christian is better than no Christian, a weak faith is better than a seared conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace: the truth, growth, and different degrees</cite>, ed. Don Kistler (Morgan PA, 1997), pp 17-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>
<div class="actions"><button class="copy" data-copy="“To have a scrupulous conscience about matters of indifference argues a weak Christian; for so the Apostle calls them “weak in the faith,” such as bound conscience when Scripture left it free. One believer thought he might eat anything, and another doubted the lawfulness of eating sundry things. Now those who doubted, the Apostle called weak; and the weak conscience is apt to be defiled. Not to know our liberty, and to abuse our liberty, is an argument we have but little grace. Young converts call more things sins than ever God did; they perplex and entangle themselves merely in indifferent things. It is true, there ought to be a conscientious tenderness in all Christians; tenderness of conscience is our duty, but a tormenting, entangling scrupulosity is our infirmity. And yet, as a weak Christian is better than no Christian, a weak faith is better than a seared conscience.”

<blockquote><p>Sanctify yourselves therefore, and be holy, for I am the Lord your God.” (Leviticus 20:8 Geneva Bible)

In his annotations on the above text, the Genevan-Italian Reformed divine, Giovanni Diodati made the following observation concerning true worship:

All your holiness consists in fearing, and obeying me [God], and not in any superstition, or false worship, chosen according to your mind.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e412663113" data-kw="">
<blockquote><p>Six days shalt thou labour.] The command of due labour and diligence in our particular callings, is not of this place; it belongs properly to the Eighth precept, and in some way, to the Seventh: here, it is only mentioned premissively, and for illustration of this duty here enjoined.

And further, there is under it a motive from abundant equity: seeing that God hath made the proportion thus, not pinched to us, but dealt very liberally in the time granted for our own work, what gross, not impiety only, but iniquity and ingratitude will it be, to encroach upon that small part He hath nominated and set apart for His service! …

Thou shall labour six days.] Not so as in them to forget and take no notice of God, nor at all to call upon Him and worship Him, and think to acquit all by some kind of attendance on Him on the Sabbath. They who do so, are most unsanctified themselves, and therefore, cannot sanctify the Sabbath to God. Such profane persons do profane and pollute all they touch with their foul hands, for such be all profane hands lifted up to God in prayer.

The life of the godly is not a visiting of God only in His house on this day, but a daily and constant walking with God in our own houses, and in all our ways, making both our houses and our hearts. His houses, His temples, where He may dwell with us, and we may offer Him our daily sacrifices. Only, the peculiar of this day is, that we may not divide it betwixt Heaven and Earth, but it shall be wholly for the service of God, and no work at all to have place in it that may hinder that, and suits not with the sanctifying of it: for so we are to understand the word. No manner of work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, (1701) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 381.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-225a1af2b5" data-kw="">
<blockquote><p>By the Diataktic [Teaching] power [of the Church,] a synod may institute, restore or change, according to the condition and exigence of the Church, the external circumstances in the worship of God and ecclesiastical discipline: I mean those circumstances which are common both to civil and sacred societies, the conveniency whereof is determinable by the light of Nature, always observing the general rules of the Word, which commands that all be done to the glory of God, that all be done to edifying, that all be done in order and decency, that we give none offence, that we support the weak, that we give no place to the enemies of the truth, nor symbolize with idolaters, etc. Now for avoiding disorder and disconformity in a nation professing one religion [such as Scotland], it is fit that national synods give certain directions and rules even concerning these rites and circumstances, not having therein an arbitrary or autocratoric power, but being always tied to follow the rules foresaid.</p></blockquote>

</figure><figure class="quote" id="q-814c750a7b" data-kw="">
<blockquote><p>The light of nature sheweth that there is a God, who hath lordship and sovereignty over all; is good, and doeth good unto all; and is therefore to be feared, loved, praised, called upon, trusted in, and served, with all the heart, and with all the soul, and with all the might.[a] But the acceptable way of worshipping the true God is instituted by himself, and so limited by his own revealed will, that he may not be worshipped according to the imaginations and devices of men, or the suggestions of Satan, under any visible representation, or any other way not prescribed in the holy Scripture.[b] [a] Rom. 1:20. Acts 17:24. Ps. 119:68. Jer. 10:7. Ps. 31:23. Ps. 18:3. Rom. 10:12. Ps. 62:8. Josh. 24:14. Mark 12:33. [b] Deut. 12:32. Matt. 15:9. Acts 17:25. Matt. 4:9,10. Deut. 4:15-20. Exod. 20:4-6. Col. 2:23.</p></blockquote>

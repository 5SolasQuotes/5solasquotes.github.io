<blockquote><p>Then he [Satan] begins his strongest batteries, or main temptations, when we are first entering into a renewed state: Now this is most usual in the days of our youth. Thus many of our worthies observe, Mr. [Thomas] Ford, speaking of young people, faith, Amongst the usually the stream of converting grace most runs. It may be in some grace is wrought very early, even in childhood, but ordinarily ’tis after they come under catechising, and are more adult. And Mr. Burges thus, Conversion does not only belong to the old, but to the young; yea, commonly conversion is sooner wrought upon the younger sort of people; for they have not resisted the grace of God so much, they have not provoked God to give them up to their own heart’s lusts, and desires, as many ages persons have; so then let young ones hearken to sermons, let them attend to what the ministers of God exhort. Remember thy Creator in the days of thy youth; and it is good to bear the yoke in they youth; it is good to feel the bitterness of sin betimes, Eccl. 12:1; Lam. 3:27. And Vortier thus, The Lord can convert and bring home to himself at all times, in middle age, in old age, at the very last, as the thief upon the cross; yet the time of effectual calling is more ordinary in the time of youth. Some have observed the time of effectual calling to be between the years of eighteen and thirty, most commonly. And I believe that most saints experience, that the Lord wrought upon them in their younger days. Marriages are most in younger times, so are spiritual contracts in Jesus Christ. David was good when young, Daniel a young prophet; Timothy a young preacher, Samuel began with God betimes, Abijah good when a child, so was Josiah. Hammers thus, Those who in their infancy were considered as parts of their parents, and so by virtue of their parents’ membership enjoyed the ordinance of baptism; when once grown up to maturity and ripeness of years, they are to be looked upon and considered in themselves, and no longer as in their parents, and therefore as being in a capacity so to do, they ought now to take hold of the covenant for themselves, and to render a personal account of their faith. It pleases God, that many do so even very early; which agrees with the former opinion, that some are regenerated after they come under catechizing. It was the use of the Jews, as Mr. Buxtorf reports, that so soon as their circumcised children were able to speak, they taught them some select places of Scripture, and so proceeding on by degrees at thirteen years of age, they were called filii praecepti, sons of the precept; and then they were to receive the passover, as says Mr. Weem, and to observe the 613 precepts, which comprehended in them the sum of the Mosaical law, and Jewish religion, and then they themselves were accounted guilty and liable to punishment, both divine and human, if they did transgress the law, whereas before their faults were imputed to their fathers, of whom the punishment was exacted… I hope, I may say of Gentiles as well as Jews, that conversion is sometimes very early, even as early as at thirteen years of age, though it be not ordinary. And oh! how good is it for a man to bear the yoke in his youth, seeing it must be born at one time or other? The burden of sin at that age will be the lighter, the flowing of heavenly affections will be the sweeter, the removal of sin, in all likehood will be sooner, at least the surer; God having engaged Himself that ‘they that seek Him early shall find Him,’ Prov. 8:17. Satan knows all this very well, and therefore he sets a stricter watch on youth…</p></blockquote>

<blockquote><p>2. No man may take this honour to himself, unless he be called of God, and sent to preach his Word in the Name of God, Rom. 10:14-15. But all who have the gifts of preaching the Word are not called and sent of God. For those who are sent of God are sent either by an immediate and extraordinary call, or by a mediate call by the Church: but whereas now an extraordinary mission or sending is ceased in the Church, those are therefore by the ordinary ecclesiastical call separated to the office of preaching, who may lawfully undertake it. 1 Tim. 4:14 &amp; 5:22; 2 Tim. 2:2-3. … We reject therefore the contrary assertion of those [congregationalists] who affirm this to be an ordinance perpetual and ordinary in the Church, that a private Christian endued with gifts, either ordinarily or upon occasion, being thought fit in the judgment of those to whom it belongs, may (by the Word of God) preach publicly in the church-assembly with all authority, though he bear no Church office. But to us it’s certain that even under the Old Testament in the Jewish Church, every one was not admitted to speak publicly in the synagogues, but that it was the ordinary function of those that are called scribes and lawyers (the Levites being also for this cause distributed into many places), whereupon they are said to sit on Moses’s chair. If any were endued with extraordinary gifts of prophecy, as the prophets in Israel, this was permitted and enjoyned him by the Word of God, publicly to preach in God’s Name. When the prophet Amos was forbidden by the Chief Priest to prophecy at Bethel, he does not challenge this liberty to the Israelites, that they might publicly preach the Word of God in God’s Name in the holy assemblies, but pleads his extraordinary mission, whereby he was sent of God to preach this word, Amos 7:14-15. And so perhaps was it permitted to the sons of the prophets, who were fitted, educated, and set apart for the ecclesiastical ministry, 1 Sam. 19:20. In the synagogues, after the reading of Moses and the prophets was ended, there were exhortations added; which exhortations if at any time occasion required, and it so seemed good to the rulers of the synagogue, in corrupt times especially, it was indeed permitted to some, out of order, to teach and exhort; but they were always such as had testimony of their gifts, and of whom there was a general opinion of their mission extraordinary or ordinary, by reason of the doctrine they preached, and the works they did. Thus at Nazareth Christ was permitted in the synagogue to read and explain the writings of the prophets, Lk. 4:16, as one who by reason of his majesty and miracles did everywhere obtain audience, as reverend Beza here notes; by which right he taught both in the Temple and everywhere: wherefore also the ordinary doctors demanded of him by what authority he did it, Mt. 21:23. So we find that Paul and Barnabas were allowed, Acts 13:15, publicly to speak and exhort in the synagogue at Antioch; as being such whose fame was already known to those of Antioch: for they had, before this time, for a whole year preached the Word of God to many there, and brought many to the faith of Christ; and Agabus who was joined with them, did by an extraordinary gift of prophesy foretell to those of Antioch the famine approaching; where were also many other prophets and doctors, who preached the Word of God both to Jews and Greeks: See Acts 11:19-21, 25-28, and 13:1-2, etc. But in the practice of the New Testament, none but prophets by gift and office, either extraordinary or ordinary, were permitted publicly in the assembly of believers to preach the Word of God in Christ’s Name, as appears, 1 Cor. 14:29-31, etc. The apostle speaks not of any in the congregation promiscuously, but of prophets lawfully called to instruct the Church of God (says Beza on this place) and therefore they are not to be hearkened to [namely the congregationalists], who from hence gather that any of the assembly may speak in the Church, and who reprehend the custom of having only a sermon preached by one.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. No man may take this honour to himself, unless he be called of God, and sent to preach his Word in the Name of God, Rom. 10:14-15. But all who have the gifts of preaching the Word are not called and sent of God. For those who are sent of God are sent either by an immediate and extraordinary call, or by a mediate call by the Church: but whereas now an extraordinary mission or sending is ceased in the Church, those are therefore by the ordinary ecclesiastical call separated to the office of preaching, who may lawfully undertake it. 1 Tim. 4:14 &amp; 5:22; 2 Tim. 2:2-3. … We reject therefore the contrary assertion of those [congregationalists] who affirm this to be an ordinance perpetual and ordinary in the Church, that a private Christian endued with gifts, either ordinarily or upon occasion, being thought fit in the judgment of those to whom it belongs, may (by the Word of God) preach publicly in the church-assembly with all authority, though he bear no Church office. But to us it’s certain that even under the Old Testament in the Jewish Church, every one was not admitted to speak publicly in the synagogues, but that it was the ordinary function of those that are called scribes and lawyers (the Levites being also for this cause distributed into many places), whereupon they are said to sit on Moses’s chair. If any were endued with extraordinary gifts of prophecy, as the prophets in Israel, this was permitted and enjoyned him by the Word of God, publicly to preach in God’s Name. When the prophet Amos was forbidden by the Chief Priest to prophecy at Bethel, he does not challenge this liberty to the Israelites, that they might publicly preach the Word of God in God’s Name in the holy assemblies, but pleads his extraordinary mission, whereby he was sent of God to preach this word, Amos 7:14-15. And so perhaps was it permitted to the sons of the prophets, who were fitted, educated, and set apart for the ecclesiastical ministry, 1 Sam. 19:20. In the synagogues, after the reading of Moses and the prophets was ended, there were exhortations added; which exhortations if at any time occasion required, and it so seemed good to the rulers of the synagogue, in corrupt times especially, it was indeed permitted to some, out of order, to teach and exhort; but they were always such as had testimony of their gifts, and of whom there was a general opinion of their mission extraordinary or ordinary, by reason of the doctrine they preached, and the works they did. Thus at Nazareth Christ was permitted in the synagogue to read and explain the writings of the prophets, Lk. 4:16, as one who by reason of his majesty and miracles did everywhere obtain audience, as reverend Beza here notes; by which right he taught both in the Temple and everywhere: wherefore also the ordinary doctors demanded of him by what authority he did it, Mt. 21:23. So we find that Paul and Barnabas were allowed, Acts 13:15, publicly to speak and exhort in the synagogue at Antioch; as being such whose fame was already known to those of Antioch: for they had, before this time, for a whole year preached the Word of God to many there, and brought many to the faith of Christ; and Agabus who was joined with them, did by an extraordinary gift of prophesy foretell to those of Antioch the famine approaching; where were also many other prophets and doctors, who preached the Word of God both to Jews and Greeks: See Acts 11:19-21, 25-28, and 13:1-2, etc. But in the practice of the New Testament, none but prophets by gift and office, either extraordinary or ordinary, were permitted publicly in the assembly of believers to preach the Word of God in Christ’s Name, as appears, 1 Cor. 14:29-31, etc. The apostle speaks not of any in the congregation promiscuously, but of prophets lawfully called to instruct the Church of God (says Beza on this place) and therefore they are not to be hearkened to [namely the congregationalists], who from hence gather that any of the assembly may speak in the Church, and who reprehend the custom of having only a sermon preached by one.”

— Wilhelm Apollonius, A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England, Concerning the Government of the Church of God (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, p. 79, 80-83">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+No+man+may+take+this+honour+to+himself%2C+unless+he+be+called+of+God%2C+and+sent+to+preach+his+Word+in+the+Name+of+God%2C+Rom.+10%3A14-15.+But+all+who+have+the+gifts+of+preaching+the+Word+are+not+called+and+sent+of+God.+For+those+who+are+sent+of+God+are+sent+either+by+an+immediate+and+extraordinary+call%2C+or+by+a+mediate+call+by+the+Church%3A+but+whereas+now+an+extraordinary+mission+or+sending+is+ceased+in+the+Church%2C+those+are+therefore+by+the+ordinary+ecclesiastical+call+separated+to+the+office+of+preaching%2C+who+may+lawfully+undertake+it.+1+Tim.+4%3A14+%26+5%3A22%3B+2+Tim.+2%3A2-3.+%E2%80%A6+We+reject+therefore+the+contrary+assertion+of+those+%5Bcongregationalists%5D+who+affirm+this+to+be+an+ordinance+perpetual+and+ordinary+in+the+Church%2C+that+a+private+Christian+endued+with+gifts%2C+either+ordinarily+or+upon+occasion%2C+being+thought+fit+in+the+judgment+of+those+to+whom+it+belongs%2C+may+%28by+the+Word+of+God%29+preach+publicly+in+the+church-assembly+with+all+authority%2C+though+he+bear+no+Church+office.+But+to+us+it%E2%80%99s+certain+that+even+under+the+Old+Testament+in+the+Jewish+Church%2C+every+one+was+not+admitted+to+speak+publicly+in+the+synagogues%2C+but+that+it+was+the+ordinary+function+of+those+that+are+called+scribes+and+lawyers+%28the+Levites+being+also+for+this+cause+distributed+into+many+places%29%2C+whereupon+they+are+said+to+sit+on+Moses%E2%80%99s+chair.+If+any+were+endued+with+extraordinary+gifts+of+prophecy%2C+as+the+prophets+in+Israel%2C+this+was+permitted+and+enjoyned+him+by+the+Word+of+God%2C+publicly+to+preach+in+God%E2%80%99s+Name.+When+the+prophet+Amos+was+forbidden+by+the+Chief+Priest+to+prophecy+at+Bethel%2C+he+does+not+challenge+this+liberty+to+the+Israelites%2C+that+they+might+publicly+preach+the+Word+of+God+in+God%E2%80%99s+Name+in+the+holy+assemblies%2C+but+pleads+his+extraordinary+mission%2C+whereby+he+was+sent+of+God+to+preach+this+word%2C+Amos+7%3A14-15.+And+so+perhaps+was+it+permitted+to+the+sons+of+the+prophets%2C+who+were+fitted%2C+educated%2C+and+set+apart+for+the+ecclesiastical+ministry%2C+1+Sam.+19%3A20.+In+the+synagogues%2C+after+the+reading+of+Moses+and+the+prophets+was+ended%2C+there+were+exhortations+added%3B+which+exhortations+if+at+any+time+occasion+required%2C+and+it+so+seemed+good+to+the+rulers+of+the+synagogue%2C+in+corrupt+times+especially%2C+it+was+indeed+permitted+to+some%2C+out+of+order%2C+to+teach+and+exhort%3B+but+they+were+always+such+as+had+testimony+of+their+gifts%2C+and+of+whom+there+was+a+general+opinion+of+their+mission+extraordinary+or+ordinary%2C+by+reason+of+the+doctrine+they+preached%2C+and+the+works+they+did.+Thus+at+Nazareth+Christ+was+permitted+in+the+synagogue+to+read+and+explain+the+writings+of+the+prophets%2C+Lk.+4%3A16%2C+as+one+who+by+reason+of+his+majesty+and+miracles+did+everywhere+obtain+audience%2C+as+reverend+Beza+here+notes%3B+by+which+right+he+taught+both+in+the+Temple+and+everywhere%3A+wherefore+also+the+ordinary+doctors+demanded+of+him+by+what+authority+he+did+it%2C+Mt.+21%3A23.+So+we+find+that+Paul+and+Barnabas+were+allowed%2C+Acts+13%3A15%2C+publicly+to+speak+and+exhort+in+the+synagogue+at+Antioch%3B+as+being+such+whose+fame+was+already+known+to+those+of+Antioch%3A+for+they+had%2C+before+this+time%2C+for+a+whole+year+preached+the+Word+of+God+to+many+there%2C+and+brought+many+to+the+faith+of+Christ%3B+and+Agabus+who+was+joined+with+them%2C+did+by+an+extraordinary+gift+of+prophesy+foretell+to+those+of+Antioch+the+famine+approaching%3B+where+were+also+many+other+prophets+and+doctors%2C+who+preached+the+Word+of+God+both+to+Jews+and+Greeks%3A+See+Acts+11%3A19-21%2C+25-28%2C+and+13%3A1-2%2C+etc.+But+in+the+practice+of+the+New+Testament%2C+none+but+prophets+by+gift+and+office%2C+either+extraordinary+or+ordinary%2C+were+permitted+publicly+in+the+assembly+of+believers+to+preach+the+Word+of+God+in+Christ%E2%80%99s+Name%2C+as+appears%2C+1+Cor.+14%3A29-31%2C+etc.+The+apostle+speaks+not+of+any+in+the+congregation+promiscuously%2C+but+of+prophets+lawfully+called+to+instruct+the+Church+of+God+%28says+Beza+on+this+place%29+and+therefore+they+are+not+to+be+hearkened+to+%5Bnamely+the+congregationalists%5D%2C+who+from+hence+gather+that+any+of+the+assembly+may+speak+in+the+Church%2C+and+who+reprehend+the+custom+of+having+only+a+sermon+preached+by+one.%E2%80%9D%0A%0A%E2%80%94+Wilhelm+Apollonius%2C+A+Consideration+of+Certain+Controversies+at+this+Time+Agitated+in+the+Kingdom+of+England%2C+Concerning+the+Government+of+the+Church+of+God+%28London%3A+G.M.%2C+1645%29%2C+ch.+5%2C+%E2%80%98Of+the+Ecclesiastical+Ministry%2C+and+the+Exercise+thereof%E2%80%99%2C+p.+79%2C+80-83&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff2ebf57220.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f2ebf57220.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-an-extraordinary-calling/#:~:text=2.%20No%20man%20may%20take%20this,only%20a%20sermon%20preached%20by%20one&amp;text=2.%20No%20man%20may%20take%20this%20honour%20to&amp;text=of%20having%20only%20a%20sermon%20preached%20by%20one" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Question 1. If so much knowledge will save a man as helps him to love God as God, may not heathens or infidels at least be saved? For they know that there is one God who is infinitely good and perfect, and more amiable than all the world, and the great benefactor of man, and of the whole creation: So that there is no goodness but what is in Him, or from Him, and through Him, and finally to Him: And man’s will is made to love apprehended good, and follows the last practical act of the intellect, at least where there is no competitor, but omnimoda ratio boni. And all men know that God is not only best in Himself, but good, yea best to them, because that all they have is from Him: and they have daily experience of pardoning grace contrary to their commerit. It seems therefore that they may love God as God. Answer:

1. To cause a man to love God as God, there is necessary both objective revelation of God’s amiableness, and such subjective grace which consists in a right disposition of the soul.

2. Objective revelation is considered as sufficient either to well disposed, or to an ill disposed soul.

3. This right disposition consists both in the abatement of men’s inclinations to contrary (sensual) objects, and in the inclining them to that which is divine and spiritual. And now I answer:

1. It cannot be denied but that so much of God’s amiableness or goodness is revealed to infidels that have not the Gospel, by the means mentioned in the objection, as is sufficient to bring men under an obligation to love God as God, and to leave them unexcusable that do not.

2. Therefore to such the impossibility is not physical, but moral.

3. And there is in that objective revelation, so much sufficiency, as that if the soul itself were sanctified and well disposed, it might love God upon such revelation. (Which [Moses] Amyraldus has largely proved.)

4. But to an unholy and undisposed soul no objective revelation is sufficient without the Spirit’s help and operations.

5. Only the Spirit of Christ the Mediator, as given by and from Him, does thus operate on souls, as savingly to renew them. (Of all this I have discoursed more largely in my Catholic Theology, and the applied Epitome.)

6. Whether ever the Spirit of Christ does thus operate on any that hear not of Christ’s incarnation, must be known either by the Scripture or by experience. [1.] By the Scripture I am not able to prove the universal negative, though it’s easy to prove sanctification incomparably more common in the Church, than on those without, if any there have it. The case of infants and of the Churches, and the world before Christ’s incarnation, must here come into consideration. 2. And by experience no man can prove the negative; because no man has experience what is in the hearts of all the persons in the world.</p></blockquote>

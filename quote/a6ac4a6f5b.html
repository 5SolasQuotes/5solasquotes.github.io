<blockquote><p>Recreation is an exercise joined with the fear of God, conversant with things indifferent, for the preservation of bodily strength and the confirmation of the mind in holiness (Eccl. 2.2; Isa. 5.12; 1 Cor. 10.9; Luke 6.25; Deut. 12.7). To this end has the Word of God permitted shooting (2 Sam. 1.18), musical consort (Neh. 7.67), putting forth riddles (Judges 14.12), hunting of wild beasts (Cant. 2.15), searching out or the contemplation of the works of God (1 Kings 4.33).</p></blockquote>

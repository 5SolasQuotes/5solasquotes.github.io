<blockquote><p>Some judicial precepts are Juris communis, of common equity, such as are agreeable to the instinct and law of nature, common to all men; and these for substance bind all persons, both Jews and Gentiles; as being Moral, and so agreeing with the Moral Law. These judicial precepts which were Juris particularis, of particular equity, such as pertained especially to the Jews’ commonwealth, and were fitted for them and their time, are now abolished, e.g., that a man should marry with none but his own stock; that the brother should raise up seed to his brother, and that a thief should restore fourfold, this was peculiar to the Jewish commonwealth and not to ours…. So then those judicial and civil precepts which are agreeable to the Moral Law, and do confirm and uphold it, they bind for ever. For example, ’tis a judicial Law that adulterers and adulteresses should die the death; now this being agreeable to common equity, and to the Law of Nature, as appears (Gen. 38:24) where Judah (before this judicial Law was publish by Moses) appoints Tamar his daughter-in-Law to be burnt for this sin, and Nebuchadnezzar burnt Ahab and Zedekiah for it (Jer. 29:21-23), so this judicial Law of putting witches to death by the magistrate, is agreeable to common equity, it helps to preserve all the Moral precepts which are broken by the idolatry, murder, and malice, of witches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical &amp; Polemical Commentary, Or Exposition upon 2 Tim. 3-4</cite>, (1658), pp. 227-28</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3032479f3f" data-kw="">
<blockquote><p>Assertion 4. There may be some cases in which it is expedient to admit an accuser, and not to admit a process without one. As suppose one were under no ill report and yet some gross scandal were imputed to him, which were not of such fame, or had not such presumptions as to give ground for a Church-judicatory immediately to interpose, and the scandal being of such a nature as the trial thereof could neither be omitted, nor closed in private; in that case, suppose one should complain of the Church’s negligence in the same, asserting the evidences to be clear, and offering to make them out; In such a case, I say, the Church can hardly refuse to hear him, lest they be thought partial; nor is there ground, nor is it fit for them immediately to pursue it: Therefore an accuser is expedient, that so, upon the one side, the Church’s impartiality may be vindicated in refusing the complaint of no sober man, nor the uttermost of any trial, that in well grounded reason they may expect; And, on the other side, that the mouths of some needless and too importunate complainers may be stopped, and they themselves found censurable, if either without cause they traduce the Church-officers as negligent and partial, while there is access to make out before them such a truth if it be truth; or if precipitantly and inconsiderately (if not maliciously) they have tabled a scandal against another as a public scandal which they cannot make out, and so have needlessly troubled a Church-judicatory in such a matter and sinfully wronged their neighbor. For, a process in such cases where it cannot be made out, is scandalous: therefore if a person rest not satisfied so as to abstain till he have trial put to the utmost, he is to be dealt with as a scandalous person, lest men take liberty, under the pretext of pursuing offences, to defame others and abuse the ordinance of Christ. And though it be just in such a case, that he be materially dealt with as unjust accusers use to be in civil courts, yet this does not only flow from the consideration of such a persons being a formal accuser, but from the nature of the deed which is scandalous in such a measure, and that publicly, and therefore is to be restrained, whether the person take on him that formal consideration or not, lest yet, upon the matter, he continue publicly and importunately to press the pursuit. And we conceive, the imposing the title of accuser in such a case, or the making of it necessary, that one take on him that formal notion, is rather for conveniency to restrain men’s inordinateness and stop their mouths, and to add weight to the matter of the sentence if they fail, than as being simply necessary for making such a person to be accounted scandalous, if he come short.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, … (Edinburgh, 1659), pt. 2, ch. 10, ‘Clearing whether in Church-processes an Accuser be always necessary’, pp. 120-21</span></figcaption>

<blockquote><p>closed with the Presbyterian in the beginning of the rebellion, took the [Solemn League &amp;] Covenant [1643], sided with the Independents, became a great creature of the long parliament by whose authority he was made tutor to James, Duke of York [would later be King James II], and an active person against his sovereign [King Charles I]”. Ascham was murdered by royalists in Spain. Wiki: “His first published work was A Discourse… This appeared in 1648, probably in July at the height of the political uncertainty engendered by the second Civil War. The previous month the Army had shown that it wielded both political and military power and Ascham’s Discourse was widely seen as a defense of the Army as the conquering power, and as a plea for “the rank of the people” to adopt a position of political quiescence. Parliament’s ultimate victory and the establishment of the Commonwealth posed a problem for those who felt unable to accept the legality of the new government but were now being required to give it their allegiance, and also for those who regarded their oath of allegiance to King Charles I… as a solemn oath to God that could not be broken. One argument, provided by a group of political theorists variously called the Engagers, or de facto theorists, was to argue that an individual could give their obedience to the de facto government in being simply because it was in power. For many such a theory was deeply shocking since it emphasized power at the expense of authority, and subordinated allegiance to self-interest. The debate was initiated by Francis Rous who published a brief pamphlet in April 1649 [The Lawfulness of Obeying the Present Government] in which he argued that allegiance could be given to the Commonwealth even though it were acknowledged to be an illegal power. It was a radical shift in the basis of the argument that was to be followed through by theorists engaged in the debate on de facto government. In the debate that followed Ascham played a major part in developing a theory of political obligation to the de facto power. In 1649 it is possible that he was author of a short anonymous pamphlet, A Combate between Two Seconds. One for Obeying the Present Government. The Other the second part of a Demurrer undeservedly called Religious, which was published in July. This work firstly took issue with those whose arguments continued to be based on Romans 13:1–2 and in particular addressed the arguments in an anonymous work that may have been published in two parts, but that is extant only in its second part entitled The Second Part of the Religious Demurrer; and secondly bypassed the critical emphasis on Romans 13:1–2 to develop arguments based on the need to protect oneself from chaos, as originally deployed by Ascham in his 1648 Discourse. Having thus entered the pamphlet “war”, Ascham then began to expand his arguments. He was certainly the author of a longer pamphlet, The Bounds and Bonds of Publique Obedience, which appeared in August 1649; and by November he had added nine chapters to his 1648 Discourse, which now appeared under the title Of the Confusions and Revolutions of Government. This work attracted the attention of Robert Sanderson who criticized it in a short and pungent pamphlet [Resolutions of Conscience (by a learned Divine) in answer to a letter sent with Mr. Ascham’s Book, Treating, How farre it may be lawful to submit to an Usurped Power.]. Ascham’s Reply to a paper of Dr. Sanderson’s, containing a censure of Mr. A. A. his book of the Confusions and Revolution of Government, which was published on 9 January 1650, was directed as much as against Edward Gee‘s Exercitation concerning usurped powers as against Sanderson’s work. In these works Ascham’s essential argument was that in a situation in which people had to look after their own safety, they were justified in giving their allegiance to any power that was capable of protecting them, whatever the legality of its title to power. By the autumn of 1649 the debate began to center on the specific question of the Oath of Allegiance and the Engagement to the Commonwealth: Two Acts of Parliament were passed requiring people to take an Oath of Allegiance to the Commonwealth, on 11/12 October 1649, and on 2 January 1650. Conventionally oaths were regarded as “the strictest ties and obligations that a man can be under”. For many the Engagement to the Commonwealth was impossible to take because it overrode their prior obligation to the monarchy (King Charles I and his heirs). The Presbyterian Richard Baxter held that he “could not judge it seemly for him that believed there is a God to play fast and loose with a dreadful oath”. (Reliquiae Baxterianae, London, 1696, p. 54) In contrast, Ascham argued that all oaths involved tacit conditions, of which the ability of the government to protect the people was the main one. A government that could not protect its people lost the right to their allegiance. Ascham’s 1648 Discourse was to be republished, anonymously, following the ousting of King James II [in 1688/9]. Then the question of the legality of the oath of allegiance to King William and Queen Mary [in the Glorious Revolution] had come to the fore. It did not, however, generate any discussion. By then the leading theorist in the field was Thomas Hobbes, whose De Corpore Politico, De Cive (first edition), and Leviathan, had systematized a coherent and secular defense of the contract as between ruler and ruled.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“closed with the Presbyterian in the beginning of the rebellion, took the [Solemn League &amp;] Covenant [1643], sided with the Independents, became a great creature of the long parliament by whose authority he was made tutor to James, Duke of York [would later be King James II], and an active person against his sovereign [King Charles I]”. Ascham was murdered by royalists in Spain. Wiki: “His first published work was A Discourse… This appeared in 1648, probably in July at the height of the political uncertainty engendered by the second Civil War. The previous month the Army had shown that it wielded both political and military power and Ascham’s Discourse was widely seen as a defense of the Army as the conquering power, and as a plea for “the rank of the people” to adopt a position of political quiescence. Parliament’s ultimate victory and the establishment of the Commonwealth posed a problem for those who felt unable to accept the legality of the new government but were now being required to give it their allegiance, and also for those who regarded their oath of allegiance to King Charles I… as a solemn oath to God that could not be broken. One argument, provided by a group of political theorists variously called the Engagers, or de facto theorists, was to argue that an individual could give their obedience to the de facto government in being simply because it was in power. For many such a theory was deeply shocking since it emphasized power at the expense of authority, and subordinated allegiance to self-interest. The debate was initiated by Francis Rous who published a brief pamphlet in April 1649 [The Lawfulness of Obeying the Present Government] in which he argued that allegiance could be given to the Commonwealth even though it were acknowledged to be an illegal power. It was a radical shift in the basis of the argument that was to be followed through by theorists engaged in the debate on de facto government. In the debate that followed Ascham played a major part in developing a theory of political obligation to the de facto power. In 1649 it is possible that he was author of a short anonymous pamphlet, A Combate between Two Seconds. One for Obeying the Present Government. The Other the second part of a Demurrer undeservedly called Religious, which was published in July. This work firstly took issue with those whose arguments continued to be based on Romans 13:1–2 and in particular addressed the arguments in an anonymous work that may have been published in two parts, but that is extant only in its second part entitled The Second Part of the Religious Demurrer; and secondly bypassed the critical emphasis on Romans 13:1–2 to develop arguments based on the need to protect oneself from chaos, as originally deployed by Ascham in his 1648 Discourse. Having thus entered the pamphlet “war”, Ascham then began to expand his arguments. He was certainly the author of a longer pamphlet, The Bounds and Bonds of Publique Obedience, which appeared in August 1649; and by November he had added nine chapters to his 1648 Discourse, which now appeared under the title Of the Confusions and Revolutions of Government. This work attracted the attention of Robert Sanderson who criticized it in a short and pungent pamphlet [Resolutions of Conscience (by a learned Divine) in answer to a letter sent with Mr. Ascham’s Book, Treating, How farre it may be lawful to submit to an Usurped Power.]. Ascham’s Reply to a paper of Dr. Sanderson’s, containing a censure of Mr. A. A. his book of the Confusions and Revolution of Government, which was published on 9 January 1650, was directed as much as against Edward Gee‘s Exercitation concerning usurped powers as against Sanderson’s work. In these works Ascham’s essential argument was that in a situation in which people had to look after their own safety, they were justified in giving their allegiance to any power that was capable of protecting them, whatever the legality of its title to power. By the autumn of 1649 the debate began to center on the specific question of the Oath of Allegiance and the Engagement to the Commonwealth: Two Acts of Parliament were passed requiring people to take an Oath of Allegiance to the Commonwealth, on 11/12 October 1649, and on 2 January 1650. Conventionally oaths were regarded as “the strictest ties and obligations that a man can be under”. For many the Engagement to the Commonwealth was impossible to take because it overrode their prior obligation to the monarchy (King Charles I and his heirs). The Presbyterian Richard Baxter held that he “could not judge it seemly for him that believed there is a God to play fast and loose with a dreadful oath”. (Reliquiae Baxterianae, London, 1696, p. 54) In contrast, Ascham argued that all oaths involved tacit conditions, of which the ability of the government to protect the people was the main one. A government that could not protect its people lost the right to their allegiance. Ascham’s 1648 Discourse was to be republished, anonymously, following the ousting of King James II [in 1688/9]. Then the question of the legality of the oath of allegiance to King William and Queen Mary [in the Glorious Revolution] had come to the fore. It did not, however, generate any discussion. By then the leading theorist in the field was Thomas Hobbes, whose De Corpore Politico, De Cive (first edition), and Leviathan, had systematized a coherent and secular defense of the contract as between ruler and ruled.”

— Antony Ascham, A Discourse, wherein is Examined what is Particularly Lawful during the Confusions &amp; Revolutions of Government: or, How far a Man may Conform to the Powers &amp; Commands of Those who Hold Kingdoms Divided by Wars… (London, 1648) | Ascham (c. 1614–1650) was a was a reformed, puritan, British academic, political theorist, Parliamentarian and diplomat. According to Anthony Wood, Ascham:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9Cclosed+with+the+Presbyterian+in+the+beginning+of+the+rebellion%2C+took+the+%5BSolemn+League+%26%5D+Covenant+%5B1643%5D%2C+sided+with+the+Independents%2C+became+a+great+creature+of+the+long+parliament+by+whose+authority+he+was+made+tutor+to+James%2C+Duke+of+York+%5Bwould+later+be+King+James+II%5D%2C+and+an+active+person+against+his+sovereign+%5BKing+Charles+I%5D%E2%80%9D.+Ascham+was+murdered+by+royalists+in+Spain.+Wiki%3A+%E2%80%9CHis+first+published+work+was+A+Discourse%E2%80%A6+This+appeared+in+1648%2C+probably+in+July+at+the+height+of+the+political+uncertainty+engendered+by+the+second+Civil+War.+The+previous+month+the+Army+had+shown+that+it+wielded+both+political+and+military+power+and+Ascham%E2%80%99s+Discourse+was+widely+seen+as+a+defense+of+the+Army+as+the+conquering+power%2C+and+as+a+plea+for+%E2%80%9Cthe+rank+of+the+people%E2%80%9D+to+adopt+a+position+of+political+quiescence.+Parliament%E2%80%99s+ultimate+victory+and+the+establishment+of+the+Commonwealth+posed+a+problem+for+those+who+felt+unable+to+accept+the+legality+of+the+new+government+but+were+now+being+required+to+give+it+their+allegiance%2C+and+also+for+those+who+regarded+their+oath+of+allegiance+to+King+Charles+I%E2%80%A6+as+a+solemn+oath+to+God+that+could+not+be+broken.+One+argument%2C+provided+by+a+group+of+political+theorists+variously+called+the+Engagers%2C+or+de+facto+theorists%2C+was+to+argue+that+an+individual+could+give+their+obedience+to+the+de+facto+government+in+being+simply+because+it+was+in+power.+For+many+such+a+theory+was+deeply+shocking+since+it+emphasized+power+at+the+expense+of+authority%2C+and+subordinated+allegiance+to+self-interest.+The+debate+was+initiated+by+Francis+Rous+who+published+a+brief+pamphlet+in+April+1649+%5BThe+Lawfulness+of+Obeying+the+Present+Government%5D+in+which+he+argued+that+allegiance+could+be+given+to+the+Commonwealth+even+though+it+were+acknowledged+to+be+an+illegal+power.+It+was+a+radical+shift+in+the+basis+of+the+argument+that+was+to+be+followed+through+by+theorists+engaged+in+the+debate+on+de+facto+government.+In+the+debate+that+followed+Ascham+played+a+major+part+in+developing+a+theory+of+political+obligation+to+the+de+facto+power.+In+1649+it+is+possible+that+he+was+author+of+a+short+anonymous+pamphlet%2C+A+Combate+between+Two+Seconds.+One+for+Obeying+the+Present+Government.+The+Other+the+second+part+of+a+Demurrer+undeservedly+called+Religious%2C+which+was+published+in+July.+This+work+firstly+took+issue+with+those+whose+arguments+continued+to+be+based+on+Romans+13%3A1%E2%80%932+and+in+particular+addressed+the+arguments+in+an+anonymous+work+that+may+have+been+published+in+two+parts%2C+but+that+is+extant+only+in+its+second+part+entitled+The+Second+Part+of+the+Religious+Demurrer%3B+and+secondly+bypassed+the+critical+emphasis+on+Romans+13%3A1%E2%80%932+to+develop+arguments+based+on+the+need+to+protect+oneself+from+chaos%2C+as+originally+deployed+by+Ascham+in+his+1648+Discourse.+Having+thus+entered+the+pamphlet+%E2%80%9Cwar%E2%80%9D%2C+Ascham+then+began+to+expand+his+arguments.+He+was+certainly+the+author+of+a+longer+pamphlet%2C+The+Bounds+and+Bonds+of+Publique+Obedience%2C+which+appeared+in+August+1649%3B+and+by+November+he+had+added+nine+chapters+to+his+1648+Discourse%2C+which+now+appeared+under+the+title+Of+the+Confusions+and+Revolutions+of+Government.+This+work+attracted+the+attention+of+Robert+Sanderson+who+criticized+it+in+a+short+and+pungent+pamphlet+%5BResolutions+of+Conscience+%28by+a+learned+Divine%29+in+answer+to+a+letter+sent+with+Mr.+Ascham%E2%80%99s+Book%2C+Treating%2C+How+farre+it+may+be+lawful+to+submit+to+an+Usurped+Power.%5D.+Ascham%E2%80%99s+Reply+to+a+paper+of+Dr.+Sanderson%E2%80%99s%2C+containing+a+censure+of+Mr.+A.+A.+his+book+of+the+Confusions+and+Revolution+of+Government%2C+which+was+published+on+9+January+1650%2C+was+directed+as+much+as+against+Edward+Gee%E2%80%98s+Exercitation+concerning+usurped+powers+as+against+Sanderson%E2%80%99s+work.+In+these+works+Ascham%E2%80%99s+essential+argument+was+that+in+a+situation+in+which+people+had+to+look+after+their+own+safety%2C+they+were+justified+in+giving+their+allegiance+to+any+power+that+was+capable+of+protecting+them%2C+whatever+the+legality+of+its+title+to+power.+By+the+autumn+of+1649+the+debate+began+to+center+on+the+specific+question+of+the+Oath+of+Allegiance+and+the+Engagement+to+the+Commonwealth%3A+Two+Acts+of+Parliament+were+passed+requiring+people+to+take+an+Oath+of+Allegiance+to+the+Commonwealth%2C+on+11%2F12+October+1649%2C+and+on+2+January+1650.+Conventionally+oaths+were+regarded+as+%E2%80%9Cthe+strictest+ties+and+obligations+that+a+man+can+be+under%E2%80%9D.+For+many+the+Engagement+to+the+Commonwealth+was+impossible+to+take+because+it+overrode+their+prior+obligation+to+the+monarchy+%28King+Charles+I+and+his+heirs%29.+The+Presbyterian+Richard+Baxter+held+that+he+%E2%80%9Ccould+not+judge+it+seemly+for+him+that+believed+there+is+a+God+to+play+fast+and+loose+with+a+dreadful+oath%E2%80%9D.+%28Reliquiae+Baxterianae%2C+London%2C+1696%2C+p.+54%29+In+contrast%2C+Ascham+argued+that+all+oaths+involved+tacit+conditions%2C+of+which+the+ability+of+the+government+to+protect+the+people+was+the+main+one.+A+government+that+could+not+protect+its+people+lost+the+right+to+their+allegiance.+Ascham%E2%80%99s+1648+Discourse+was+to+be+republished%2C+anonymously%2C+following+the+ousting+of+King+James+II+%5Bin+1688%2F9%5D.+Then+the+question+of+the+legality+of+the+oath+of+allegiance+to+King+William+and+Queen+Mary+%5Bin+the+Glorious+Revolution%5D+had+come+to+the+fore.+It+did+not%2C+however%2C+generate+any+discussion.+By+then+the+leading+theorist+in+the+field+was+Thomas+Hobbes%2C+whose+De+Corpore+Politico%2C+De+Cive+%28first+edition%29%2C+and+Leviathan%2C+had+systematized+a+coherent+and+secular+defense+of+the+contract+as+between+ruler+and+ruled.%E2%80%9D%0A%0A%E2%80%94+Antony+Ascham%2C+A+Discourse%2C+wherein+is+Examined+what+is+Particularly+Lawful+during+the+Confusions+%26+Revolutions+of+Government%3A+or%2C+How+far+a+Man+may+Conform+to+the+Powers+%26+Commands+of+Those+who+Hold+Kingdoms+Divided+by+Wars%E2%80%A6+%28London%2C+1648%29+%7C+Ascham+%28c.+1614%E2%80%931650%29+was+a+was+a+reformed%2C+puritan%2C+British+academic%2C+political+theorist%2C+Parliamentarian+and+diplomat.+According+to+Anthony+Wood%2C+Ascham%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1aa6ad08b7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1aa6ad08b7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-jurisprudence/#:~:text=closed%20with%20the%20Presbyterian%20in%20the,contract%20as%20between%20ruler%20and%20ruled&amp;text=closed%20with%20the%20Presbyterian%20in%20the%20beginning%20of&amp;text=of%20the%20contract%20as%20between%20ruler%20and%20ruled" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>9. It seems to threaten a snare when inquiry about the duty of the time is pursued without respect to the present case and circumstances thereof. For thus a snare may wait in a thing at other times indifferent, the neglect whereof under some special circumstances may be a quitting their duty; and the doing also, or yielding to something in another case warrantable, at sometimes may fall under a moral prohibition. As this, when a thing in itself indifferent, circa sacra et cultum Dei [around sacred things and the worship of God], is pressed by the magistrate as necessary by virtue of his sole command, and to the subjecting the godly in things wherein they are not subject, and to the prejudice of an other jurisdiction; can there be an inquiry about this in the general, without a particular application to the complex case? It may be said a snare is then on the entry when that consideration of the prophet is not much regarded in the present question, ‘Is this a time for such a thing?’ For the disciples to refresh themselves with sleep was a piece of innocent duty; but that they could not watch this one hour with their Master in his sufferings, must needs vary the case, for it was in so far a deserting Him.</p></blockquote>

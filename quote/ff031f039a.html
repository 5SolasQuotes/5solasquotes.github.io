<main class="wrap"><figure class="quote" id="q-ff031f039a" data-kw="">
<blockquote><p>DEFEND THE LORD’S DAY. – Lift up a calm, undaunted testimony against all the profanations of the Lord’s day. Use all your influence, whether as a statesman, a magistrate, a master, a father, or a friend, both publicly and privately, to defend the entire Lord’s day. This duty is laid upon you in the Fourth Commandment.

Never see the Sabbath broken without reproving the breaker of it. Even worldly men, with all their pride and contempt for us, cannot endure to be convicted of Sabbath-breaking. Always remember God and the Bible are on your side, and that you will soon see these men cursing their own sin and folly when too late.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-murray-m-cheyne.html">Robert Murray M’Cheyne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>I Love the Lord’s Day</cite>, (1841) in Andrew A. Bonar (ed.), Memoir and Remains of Robert Murray McCheyne, Minister of St. Peter’s Free Church, Dundee (Edinburgh: Oliphant Anderson &amp; Ferrier, 1892), p. 599.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>2. It [the form of sound words] is our godly forefathers bequest which they have conveyed to us their posterity; should not our care be alike to transmit it to ours? Ps. 78:3-4.

3. The martyrs have sealed it with their blood, which we shall prove guilty of through our unfaithfulness, as they are accounted to tread underfoot the Son of God, and to account his blood an unholy thing who desert his truth, and despited the spirit of his grace, Heb. 10:29.

4. It will be the best part of our children’s inheritance: as the Law was Jacob’s, Dt. 33:4. Look to it therefore, that at our last reckoning our forefathers be not ashamed of us, and our posterity at the Resurrection do no not rise up, and, I say not, call us blessed, as Prov. 31:28, but curse us for betraying God’s truth, and our trust, and their and our own souls altogether.

5. And remember from this word [Greek] hold fast, that it is not the catching at what we have not, but only the holding fast what through God’s mercy we yet have; and therefore as Christ says to the Church of Philadelphia, ‘Hold fast what thou hast, let no man take away thy crown.&#x27;</p></blockquote>

<blockquote><p>V. 3. But I] a new precept or renewed by the apostle, concerning common civility for habit [wearing of garments] namely that women in public assemblies of the church should be covered, and men should have their heads uncovered by reason that in those places and times, the covered head was sign of subjection and an uncovered head contrary wise of liberty; and command wherefore that they might keep in the church that degree amongst sexes which God had established, they were to observe such signs and marks thereof as were used by the common consent of nations. See Gen. 20:16 and 24:65… … V. 10. To have power] as who should say to go forth in public in a modest and civil manner for this necessity of women’s covering the head took place but only out of doors, and not within doors. And if they went abroad without a vail they were reputed as debauched women, like run away servants or soldiers that have not their master’s or captain’s pass…</p></blockquote>

<blockquote><p>‘Ye shall not do’ (says Moses) ‘after all things, which we do here this day, every man, all that is right in his own eyes.’ [Dt. 12:8]… And the speech of Moses seems to mean the true service of God, which was not yet perfected, neither could be in their travels, as it was after in Canaan, vv. 10-11. Not that they sacrificed after their fancy (says the Geneva notes) but that God would be served more purely in the land of Canaan. Junius upon this place notes: ‘Etsi oblationum lex una semper fuit ab initi• praescripta a Deo, non potuit tamen usque adeo in ambulatoriis Israelitarum castris observari, ant summo jure ab illis exigi, prout ostendit; Antithesis, verse 11; vide Num, 28:6.’ The [Romanist] Douay divines, on the place, give this observation, ‘In the desert they could not observe the ceremonies of the Law, but coming to rest, they were bound to keep all one set form of holy rites.’ The conclusion from this text is that God is pleased to dispense with his people in his own prescribed worship, until, if He has appointed, determined, or appropriated a certain form, time and place, they have opportunity to serve Him at that time, in that place, and after that form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam</cite>, … (London: R.B., 1642), ch. 1, section 4, p. 51</span></figcaption>

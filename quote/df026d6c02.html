<main class="wrap"><figure class="quote" id="q-df026d6c02" data-kw="">
<blockquote><p>There is no created holiness sure, stable, and perfect in itself: The glorious angels which are, and ever shall be saints in Heaven, and the saints in Heaven who are like angels, stand not in that holy and happy estate by their own sufficiency, but by the decree and grace of God. Those angels which fell at first were holy, and they who now stand, might have fallen notwithstanding their created holiness, if God had not superadded confirming grace which establishes them forever. Yet this is not all, that the angels are imperfect because they might fall if not supported, there is somewhat more in it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job</cite>, … (London: 1650), sermon on Job 15:15, pp. 62-63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-753214a097" data-kw="against perpetual guardian angel">
<blockquote><p>Is a particular angel assigned as a perpetual guardian to each believer? We deny. From Acts 12:15, where mention is made of Peter’s angel, it can be collected that a certain angel was then present with Peter, but not that a particular and perpetual guardian was given to him. For he is said “to have come upon him”; as when “the physician and servant of the king” is alluded to, not a particular one is understood, but indefinitely he who performs that office (which many can perform successively).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a> › <a href="../topics/angels-and-demons/good-angels/guardian-angels.html">Guardian angels</a></span></div>
<div class="actions"><button class="copy" data-copy="“Is a particular angel assigned as a perpetual guardian to each believer? We deny. From Acts 12:15, where mention is made of Peter’s angel, it can be collected that a certain angel was then present with Peter, but not that a particular and perpetual guardian was given to him. For he is said “to have come upon him”; as when “the physician and servant of the king” is alluded to, not a particular one is understood, but indefinitely he who performs that office (which many can perform successively).”

— Francis Turretin, Institutes of Elenctic Theology, 7.8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIs%20a%20particular%20angel%20assigned%20as%20a%20perpetual%20guardian%20to%20each%20believer%3F%20We%20deny.%20From%20Acts%2012%3A15%2C%20where%20mention%20is%20made%20of%20Peter%E2%80%99s%20angel%2C%20it%20can%20be%20collected%20that%20a%20certain%20angel%20was%20then%20present%20with%20Peter%2C%20but%20not%20that%20a%20particular%20and%20perpetual%20guardian%20was%20given%20to%20him.%20For%20he%20is%20said%20%E2%80%9Cto%20have%20come%20upon%20him%E2%80%9D%3B%20as%20when%20%E2%80%9Cthe%20physician%20and%20servant%20of%20the%20king%E2%80%9D%20is%20alluded%20to%2C%20not%20a%20particular%20one%20is%20understood%2C%20but%20indefinitely%20he%20who%20performs%20that%20office%20%28which%20many%20can%20perform%20successively%29.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%207.8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F753214a097.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/753214a097.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-42dff1c787" data-kw="">
<blockquote><p>4…it seems meet to be determined that all creatures may be represented by images: yea the very angels themselves, I mean not in respect of their spiritual nature, but in such sort as they have exhibited themselves to be seen of men. Wherefore the godly men, which either be dead or yet living, kings, stars, plants, stones, earth, sea, and such like may be represented by pictures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places</cite>, II.2.26, … (London: Henrie Denham et al., 1583), pt. 2, ch. 5. ‘The Second Precept, which concerns Images, their Beginning, Antiquity &amp; Cause’, p. 335</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>
<div class="actions"><button class="copy" data-copy="“4…it seems meet to be determined that all creatures may be represented by images: yea the very angels themselves, I mean not in respect of their spiritual nature, but in such sort as they have exhibited themselves to be seen of men. Wherefore the godly men, which either be dead or yet living, kings, stars, plants, stones, earth, sea, and such like may be represented by pictures.”

— Peter Martyr Vermigli, The Common Places… (London: Henrie Denham et al., 1583), pt. 2, ch. 5. ‘The Second Precept, which concerns Images, their Beginning, Antiquity &amp; Cause’, p. 335">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4%E2%80%A6it+seems+meet+to+be+determined+that+all+creatures+may+be+represented+by+images%3A+yea+the+very+angels+themselves%2C+I+mean+not+in+respect+of+their+spiritual+nature%2C+but+in+such+sort+as+they+have+exhibited+themselves+to+be+seen+of+men.+Wherefore+the+godly+men%2C+which+either+be+dead+or+yet+living%2C+kings%2C+stars%2C+plants%2C+stones%2C+earth%2C+sea%2C+and+such+like+may+be+represented+by+pictures.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+The+Common+Places%E2%80%A6+%28London%3A+Henrie+Denham+et+al.%2C+1583%29%2C+pt.+2%2C+ch.+5.+%E2%80%98The+Second+Precept%2C+which+concerns+Images%2C+their+Beginning%2C+Antiquity+%26+Cause%E2%80%99%2C+p.+335&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F42dff1c787.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/42dff1c787.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-angels/#:~:text=it%20seems%20meet%20to%20be%20determined,like%20may%20be%20represented%20by%20pictures&amp;text=it%20seems%20meet%20to%20be%20determined%20that%20all&amp;text=and%20such%20like%20may%20be%20represented%20by%20pictures" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cdea257cab" data-kw="">
<blockquote><p>XL. Our [Reformed] theologians also inquire whether angels are part of the Church. Tilenus, Polanus and others who want the Church to be taken broadly enough to include even the angels affirm this. However, the illustrious Amyraldus, in his Theses on the Parts of the Church, denies it along with many others. I think briefly that there is great communion between angels and pious and faithful men, and that Christ’s death reconciled angels to men and closely united them, making angels protectors and guardians of the faithful and promoting their salvation. But pious men form a certain society among themselves to which angels do not belong. The name ‘Church’ in Scripture is only attributed to the society of men and never includes angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church, p. 429 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>
<div class="actions"><button class="copy" data-copy="“XL. Our [Reformed] theologians also inquire whether angels are part of the Church. Tilenus, Polanus and others who want the Church to be taken broadly enough to include even the angels affirm this. However, the illustrious Amyraldus, in his Theses on the Parts of the Church, denies it along with many others. I think briefly that there is great communion between angels and pious and faithful men, and that Christ’s death reconciled angels to men and closely united them, making angels protectors and guardians of the faithful and promoting their salvation. But pious men form a certain society among themselves to which angels do not belong. The name ‘Church’ in Scripture is only attributed to the society of men and never includes angels.”

— Louis Le Blanc, Theological Theses published at Various Times in the Academy of Sedan, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church, p. 429 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXL.+Our+%5BReformed%5D+theologians+also+inquire+whether+angels+are+part+of+the+Church.+Tilenus%2C+Polanus+and+others+who+want+the+Church+to+be+taken+broadly+enough+to+include+even+the+angels+affirm+this.+However%2C+the+illustrious+Amyraldus%2C+in+his+Theses+on+the+Parts+of+the+Church%2C+denies+it+along+with+many+others.+I+think+briefly+that+there+is+great+communion+between+angels+and+pious+and+faithful+men%2C+and+that+Christ%E2%80%99s+death+reconciled+angels+to+men+and+closely+united+them%2C+making+angels+protectors+and+guardians+of+the+faithful+and+promoting+their+salvation.+But+pious+men+form+a+certain+society+among+themselves+to+which+angels+do+not+belong.+The+name+%E2%80%98Church%E2%80%99+in+Scripture+is+only+attributed+to+the+society+of+men+and+never+includes+angels.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+published+at+Various+Times+in+the+Academy+of+Sedan%2C+vol.+2+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+Nature+%26+Definition+of+the+Church%2C+p.+429+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcdea257cab.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cdea257cab.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-angels/#:~:text=XL.%20Our%20%5BReformed%5D%20theologians%20also%20inquire,of%20men%20and%20never%20includes%20angels&amp;text=XL.%20Our%20%5BReformed%5D%20theologians%20also%20inquire%20whether%20angels&amp;text=the%20society%20of%20men%20and%20never%20includes%20angels" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9d211e2e14" data-kw="">
<blockquote><p>But because sculpture and painting are gifts of God, I seek a pure and legitimate use of each… We believe it wrong that God should be represented by a visible appearance, because He Himself has forbidden it [Ex. 20:4] and it cannot be done without some defacing of his glory… Therefore it remains that only those things are to be sculptured or painted which the eyes are capable of seeing… Within this class some are histories and events, some are images and forms of bodies without any depicting of past events. The former have some use in teaching or admonition; as for the latter, I do not see what they can afford other than pleasure. And yet it is clear that almost all the images that until now have stood in churches were of this [latter] sort. From this, one may judge that these images had been called forth not out of judgment or selection but of foolish and thoughtless craving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, bk. 1, ch. 11, sect. 12 (Battles)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b696011b19" data-kw="">
<blockquote><p>Secondly, as necessary fruits of our election, for we are elected to that end that we should be holy, Eph. 1:4, as necessary fruits of faith, without which it is judged to be dead, James 2:26, as unseparable consequents of our redemption and justification, Luk. 1:74. And as they are necessary consequents of our justification, so they are necessary forerunners of salvation, by which we are fitted for God’s Kingdom, because no unclean thing can enter into the Kingdom of heaven, Apoc. 21:27, and finally so necessary is a godly life that without it no man shall see God, Heb. 12:14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification</cite>, (London, 1633), Book 7, ‘Concerning Good Works’, ch. 1, Answer IX, p. 438</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

<blockquote><p>2. We are mere patients in the causes of blessedness; but in respect of conditions we are not so: for as we said of faith, we may also say of good works: God enables to them, but man works them, and walks in the way of them to blessedness: not that our works are causes, but conditions without which blessedness is not attained. See Mt. 25:35. 3. This assertion [previously objected] bewrays great ignorance of the proper and present use of sanctification, and the duties of it; which they conceive as legally urged to help the believer in his title and right to the blessed inheritance purchased in heaven: whereas only Christ’s righteousness and merits give right and title unto heaven; but yet the grace of sanctification gives us an aptitude and fitness unto it: for, ‘without holiness none shall see God,’ Heb. 12:14, and, no unclean thing shall enter into the gates of that City. (Rev. 21:27) Yea it is proceeding in sanctification to the measure and stature of Christ that fits us to the vision and fruition of the glorious presence of God, and for the full possession of that heavenly inheritance.</p></blockquote>

</figure><figure class="quote" id="q-c2859fa1c5" data-kw="">
<blockquote><p>But take Sanctification for holy walking in the strength of the grace of justification, and grace inherent in us; so we say, Justification and Sanctification ought not to be separated, but both concur to make us saints; the one as the cause, the other as the unseparable effect… for so Antinomians make Sanctification nothing but a poor shadow, like an ivy bush, that is no cause of wine, but a mere sign to declare and shew in this, there is wine [Lutherans have often historically preferred the same language].</p></blockquote>

<blockquote><p>3. Good works are necessary as a consequent that follows from its antecedent, not as an effect that follows from its cause. The Holy Spirit teaches this everywhere, because He denies that eternal life is attained by means of our good works. At the same time, He also teaches that it is impossible to see God without holiness, Heb. 12,14. 4. Eternal life will be given to those who are performing good works, but it is not given unto them because of their good works. This is evident from Mt 25,35, where it is said: ‘For I was hungry and you gave me food’ etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. van Asselt, Bell, Brink, Ferwerda – Scholastic Discourse: Johannes Maccovius (1588–1644) on Theological and Philosophical Distinctions and Rules (Apeldoorn) Ch. 16, ‘On Good Works’, p. 136</span></figcaption>

</figure><figure class="quote" id="q-d93e854d06" data-kw="">
<blockquote><p>First therefore take notice what we mean by good works. We take not good works strictly, for the works of charity or liberality; nor for any external actions of religion, which may be done where the heart is not cleansed; much less for the Popish good works of supererogation: but for the graces of God’s Spirit in us, and the actions flowing from them: For, usually, with the Papists and Popish persons, good works are commonly called those superstitious and supererogant works, which God never commanded: or, if God has commanded them, they mean them as external and sensible; such as coming to church and receiving of sacraments; not internal and spiritual faith, and a contrite spirit, which are the soul of all duties: and if these be not there, the outward duties are like clothes upon a dead man, that cannot warm him, because there is no life within. Therefore much is required even to the essence of a godly work, though it be not perfect in degrees: As: 1. It must be commanded by God. 2. It must be wrought in us by the Spirit of God. All the unregenerate man’s actions, his prayers, and services are sins. 3. It must flow from an inward principle of grace, or a supernatural being in the soul, whereby a man is a new creature. 4. The end must be God’s glory. That which the most refined man can do is but a glow-worm, not a star: So that then only is the work good, when, being answerable to the rule, it’s from God, and through God, and to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or a Vindication of the Moral Law &amp; the Covenants</cite>, … (London: Young, 1647), Lecture 4, p. 39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

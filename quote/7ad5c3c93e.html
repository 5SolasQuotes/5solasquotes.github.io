<main class="wrap"><figure class="quote" id="q-7ad5c3c93e" data-kw="">
<blockquote><p>Who will not understand that they themselves (namely, men) were created rational not so much to live ungrateful as to seek by groping such a great benefactor, etc., especially since to this very end they have within conscience sitting as if before a tribunal in His name and threatening just things, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1 Latin | “11th Problem: Whether the most excellent, most expeditious, most sufficient and only rule of proving the deity against atheists and among men, whoever they may at last be, provided that they are not devoid of judgment and a sane mind, is from the revelations made in the Old and New Testaments. | I respond: | And thus, after the writers of natural theology, the antagonists of the atheists, philosophical booklets and the writers of common places, he [the Remonstrant] discourses through the heaven, moon, air, etc., and at last concludes:, pp. 70-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ebdb026542" data-kw="">
<blockquote><p>But if besides the testimonies of conscience which appear in very many, although they cannot appear in individuals, whence there is no need to dispute about the conscience of individuals–if, I say, besides these we also want to seek other testimonies, by which God is never destitute, and through which He can be found by groping, soon they will occur so infinitely that he who does not apprehend Him from any of them will have degenerated from man into a beast, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1 Latin | “11th Problem: Whether the most excellent, most expeditious, most sufficient and only rule of proving the deity against atheists and among men, whoever they may at last be, provided that they are not devoid of judgment and a sane mind, is from the revelations made in the Old and New Testaments. | I respond: | And later, p. 188:, pp. 70-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><figure class="quote" id="q-d0aee5950c" data-kw="">
<blockquote><p>Another reason can be drawn from the words of Aristotle. For in 2 Metaphysics 1, 5, he shows that those things which excel as true excel as beings, and in 4 Metaphysics 3, 4, 27-28, he shows that there is something supremely true because we see that of two false things one is falser than the other, from which it follows that one is also truer than the other. Now this is by its approximation to that which is simply and supremely true. Therefore, we may further conclude that there is something that is supremely being. And this we call God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1, ch. 13, ‘Arguments in Proof of God’s Existence’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

<blockquote><p>[God] Must be infinitely perfect. Since man knows he is an imperfect being, he must suppose the perfections he wants [lacks] are seated in some other being, which has limited him, and upon which he depends. Whatsover we conceive of excellency or perfection must be in God; for we can conceive no perfection but what God has given us a power to conceive. And He that gave us power to conceive a transcendent perfection above whatsoever we saw or heard of, has much more in Himself, or else He could not give us such a conception.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><figure class="quote" id="q-dbc2bfaf22" data-kw="">
<blockquote><p>In support, however, of this kind of truth [i.e. of things of faith which cannot be known by reason alone], certain probable arguments must be adduced for the practice and help of the faithful, but not for the conviction of our opponents, because the very insufficiency of these arguments would rather confirm them in their error if they thought that we assented to the truth of faith on account of such weak reasonings.</p></blockquote>

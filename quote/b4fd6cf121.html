<main class="wrap"><figure class="quote" id="q-b4fd6cf121" data-kw="">
<blockquote><p>May faith be properly called a condition The question has been keenly agitated between Calvinists, whether faith itself should be spoken of as a condition of the covenant. One party has denied it, because they supposed that the language which represented man as performing a condition of his own salvation would make an inlet for human merit. But it is most manifest that there is a sense in which faith is the condition, in all such passages as Jn. 3:16; Acts 8:37; Jn. 11:26; Mk. 16:16. No human wit can evade the fact, that here God proposes to man a something for him to do, which, if done, will secure redemption; if neglected, will ensure damnation—and that something is in one sense a condition. But of what kind? Paul everywhere contrasts the condition of works, and the condition of faith. This contrast will be sufficiently established, and all danger of human merits being intruded will be obviated, if it be observed that faith is only the appointed instrument for receiving free grace purchased by our Surety. It owes its organic virtue as such, to God’s mere appointment, not to the virtue of its own nature. In the Covenant of Works, the fulfilment of the condition on man’s part earned the result, justification by its proper moral merit. In the Covenant of Grace, the condition has no moral merit to earn the promised grace, being merely an act of receptivity. In the Covenant of Works, man was required to fulfil the condition in his own strength. In the Covenant of Grace, strength is given to him to believe, from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-l-dabney.html">R. L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus &amp; Notes of the Course of Systematic &amp; Polemic Theology, 2nd ed. (St. Louis: Presbyterian Publishing Company, 1878)</cite>, pp. 438–39</span></figcaption>

<blockquote><p>CXIII. Then, it seems somewhat uncertain when they [some Reformed theologians] distinguish between the act that predisposes one to justification and the act they say is formally justifying. According to the Reformed perspective, faith does not justify as a sort of form through which we are justified but rather as an instrument grasping Christ’s merit, as many say, or as a condition of the covenant of grace, which God counts as righteousness for Christ’s sake, as others prefer to say. These views, upon closer examination, converge to the same point. No one would say faith is a physical instrument of our justification; it can only intervene as a moral instrument. But faith can’t be a moral instrument of justification unless in the sense that God has promised forgiveness of sins to believers, which cannot be attained without the intervention of a living and effective faith. This is essentially the same as being a condition of the covenant of grace, wherein God offers grace and glory to believers and repentants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses put forth at Various Times at the Academy of Sedan, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683), On Justifying Faith, pt. 1, pp. 165-66 Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France.</cite></span></figcaption>

</figure><figure class="quote" id="q-3722156804" data-kw="">
<blockquote><p>4. Therefore, if we look merely to the Law, the result must be despondency, confusion, and despair, seeing that by it we are all cursed and condemned, while we are kept far away from the blessedness which it holds forth to its observers. Is the Lord, then, you will ask, only sporting with us? Is it not the next thing to mockery, to hold out the hope of happiness, to invite and exhort us to it, to declare that it is set before us, while all the while the entrance to it is precluded and quite shut up? I answer, although the promises, insofar as they are conditional, depend on a perfect obedience of the Law, which is nowhere to be found, they have not, however, been given in vain. For when we have learned that the promises would be fruitless and unavailing, did not God accept us of his free goodness, without any view to our works, and when, having so learned, we, by faith, embrace the goodness thus offered in the gospel, the promises, with all their annexed conditions, are fully accomplished. For God, while bestowing all things upon us freely, crowns his goodness by not disdaining our imperfect obedience; forgiving its deficiencies, accepting it as if it were complete, and so bestowing upon us the full amount of what the Law has promised. But as this point will be more fully discussed in treating of justification by faith, we shall not follow it further at present.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845) Note Calvin speaking of repentance as a “condition” for the forgiveness of sins in vol. 2, bk. 3, ch. 3, sect. 20, p. 174.</cite>, vol. 1, bk. 2, ch. 7, sect. 4, p. 410</span></figcaption>

<blockquote><p>VIII. Third, the object of the justifying action:… (2) men (1 Tim. 2:5), not just any, but: … (d) called to receive the Redeemer and the conditions of redemption (Rom. 8:30; 1 Pt. 2:9–10); (e) regenerated and made alive (Eph. 2:5), illuminated in mind (Eph. 1:17–19), renewed in heart or will (Ezek. 36:26), so that they are able to submit to calling, and receive the Redeemer offered to them, and the terms of redemption; (f) converted (Jer. 31:18–19), so that through the power received in regeneration, they by faith actually receive God and the Mediator (Phil. 3:12), and turn themselves from their sins to righteousness (Jer. 31:19); (g) united with Christ, so that they possess, in none other than Christ, a righteousness not their own, but Christ’s, that which is through faith (Phil. 3:9; 1 Cor. 1:30; Acts 4:12). From these things can at the same time be perceived the order and procedure of God whereby he is accustomed to provide the justification of the miserable sinner. IX… whereby he calls the elect to receive the Redeemer given to them (2 Tim. 1:9), whereby he grants faith to them, by means of which they receive him (Phil. 1:29) and are united with him (Phil. 3:9), the same grace, I say, whereby he reckons and pronounces them righteous in Christ.</p></blockquote>

<blockquote><p>From all these absurdities [of the sacrament of penance] the doctrine which we deliver is completely free. For absolution is conditional, allowing the sinner to trust that God is propitious to Him, provided he sincerely seek expiation in the sacrifice of Christ, and accept of the grace offered to him. Thus, he cannot err who, in the capacity of a herald, promulgates what has been dictated to him from the Word of God. The sinner, again, can receive a clear and sure absolution when, in regard to embracing the grace of Christ, the simple condition annexed is in terms of the general rule of our Master Himself—a rule impiously spurned by the Papacy—’According to your faith be it unto you,’ (Mt. 9:29).</p></blockquote>

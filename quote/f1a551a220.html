<main class="wrap"><figure class="quote" id="q-f1a551a220" data-kw="">
<blockquote><p>1. That sanctification and inherent righteousness goes before our justification and imputed righteousness: but with a distinction of a double justification. 1. In Foro Divino, in Gods sight; and this goes before all our sanctification: for even whilst the elect are unconverted, they are then actually justified and freed from all sin by the death of Christ: and God so esteems of them as free, and having accepted of that satisfaction, is actually reconciled to them. By this justification we are freed from the guilt of our sins, and because that is done away, God in due time proceeds to give us the grace of sanctification (Col. 1:13), to free us from sins corruption still inherent in our persons. 2. In Foro Conscientiae, in our own sense, which is but the revelation and certain declaration of God’s former secret act of accepting Christ’s righteousness to our justification. The manifestation of which to our hearts and consciences is the only ground of all our peace and comfort: and it follows our sanctification, upon and after the infusion of saving faith, the only instrument of this our justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ = A Plea for Grace, more especially the grace of faith, or certain lectures… wherein… the main sinews of Arminius’s doctrine are cut asunder (d. 1623; London: 1627), The Nature &amp; Properties of Grace &amp; Faith</cite>, pp. 21-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/application-of-redemption-in-general/eternal-justification-error.html">Eternal Justification (Error)</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-59d7662a11" data-kw="">
<blockquote><p>I. All those whom God hath predestinated unto life, and those only, he is pleased, in his appointed and accepted time, effectually to call,[a] by his word and Spirit,[b] out of that state of sin and death in which they are by nature, to grace and salvation by Jesus Christ;[c] enlightening their minds spiritually and savingly to understand the things of God;[d] taking away their heart of stone, and giving unto them an heart of flesh;[e] renewing their wills, and, by his almighty power determining them to that which is good;[f] and effectually drawing them to Jesus Christ;[g] yet so as they come most freely, being made willing by his grace.[h] [a] Rom. 8:30. Rom. 11:7. Eph. 1:10,11. [b] 2 Thess. 2:13,14. 2 Cor. 3:3,6. [c] Rom. 8:2. Eph. 2:1-5. 2 Tim. 1:9,10. [d] Acts 26:18. 1 Cor. 2:10,12. Eph. 1:17,18. [e] Ezek. 36:26. [f] Ezek. 11:19. Phil. 2:13. Deut. 30:6. Ezek. 36:27. [g] Eph. 1:19. John 6:44,45. [h] Cant. 1:4. Ps. 110:3. John 6:37. Rom. 6:16-18.</p></blockquote>

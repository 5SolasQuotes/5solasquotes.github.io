<main class="wrap"><figure class="quote" id="q-463aeda844" data-kw="">
<blockquote><p>‘God be merciful unto us, and bless us; and cause His face to shine upon us. That Thy way may be known upon earth, Thy saving health among all nations.’ Psalm Ixvii. 1, 2

The royal Psalmist, in the spirit of inspiration, personating the Church of the redeemed in every age, and more especially under its last and most perfect dispensation, here offers up a sublime prayer for its inward prosperity, and outward universal extension. All is in the order of nature and of grace. Knowing full well that he who has not obtained mercy from the Lord, cannot be a fit bearer of it to others, — that he who has obtained no blessings himself, can dispense none,—that he who enjoys no light, can communicate none, — he first of all, with marked and beautiful propriety, begins with the supplication of personal and individual blessings: — ‘God be merciful unto us,’ forgiving and pardoning all our sins: ‘and bless us,’ conferring every gift and every grace really needful for time and eternity: ‘and lift up the light of thy countenance upon us,’ cheering us with the smile of reconciliation and love, and causing the Sun of Righteousness to arise on our darkened souls with healing in his beams.

But does the Psalmist stop here? Does he for a moment intend that he and his fellow-worshippers, as representatives of the visible Church of the living God, should absorb all the mercy, all the blessing, and all the light of Jehovah’s countenance? Oh no! Having thus fervently prayed for evangelical blessings to descend upon himself, and every member of the Church, he immediately superadds, in the true evangelistic or missionary spirit, ‘That thy way,’ or, as it is given in our metrical version, ‘That so thy way may be known upon earth, thy saving health among all nations.’

How significant the connection here established between the obtainment and the distribution of evangelical favours! ‘God be merciful unto us, and bless us.’ — Why? only that we ourselves may be pardoned and sanctified, and thereby attain to true happiness? No. There is another grand end in view, to the accomplishment of which our being blessed is but a means. ‘God be merciful unto us, and bless us, that so thy way may be known on earth,’ — that so — that thus — that in this way — that by our instrumentality — that by our being blessed, and having the light of thy countenance shining upon us, — ‘thy way’ — thy way of justification through the atoning righteousness of the Redeemer, — thy way of sanctification by his Holy Spirit, — ‘may be made known on earth, and thy saving health among all nations.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-duff.html">Alexander Duff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Missions. The Chief End of the Christian Church</cite>, (New edn, Edinburgh: Andrew Elliot, 1877), pp 7-10.</span></figcaption>

<blockquote><p>Let the most bitter-spirited antagonist ingenuously say, ‘Is not the whole Book of Psalms (so often avowed, cited, and used by Christ) Sepher-Tehillim, a Book of Praises, composed for the Churches use unto the end of time [in contrast to adding instrumentation]?’ or think you that this so excellent a part of Scripture was written only to inform us what the saints of God did before us, but not what we also must do by their example [of playing instruments in worship]? As for the abuse of music, we abominate it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon Delivered</cite>, (London, 1663), p. 15. This sermon was given shortly after the Restoration and Great Ejection of 1662, in order to defend in Reading’s church, the cathedral church in Canterbury, that instruments were lawful in public worship, contra the dissenting puritans. Cathedral churches usually had more ornate music than parish churches.</span></figcaption>

<blockquote><p>What is there, sir, concerning Christ’s kingdom that is not celebrated in the Psalms in the language of fulfilment? I say that even when the mystery of God shall have been finished, and both the fulness of Israel and the fulness of the Gentiles shall have been brought in, the Church may celebrate her millennial glory in the language of fulfilment from the Psalms of David.

“He mindful of his grace and truth To Israel’s house hath been; And the salvation of our God All ends of the earth have seen.”

All the ends of the earth that have seen the salvation of our God, know the Psalms of David. The Psalms are the grand catholic hymnal, and the singing of them provides for Christian union and for perfect catholicity.</p></blockquote>

<blockquote><p>Until the Civil War the various Presbyterian bodies used psalms predominantly, singing hymns only now and then, especially in informal gatherings. Their songbook, Psalms and Hymns, had a clearly defined psalter section. After the Civil War the use of hymns increased greatly. In the Presbyterian Hymnal published in 1874 by the northern branch of the church, psalms were mixed in with hymns. The 1901 Psalms and Hymns of the southern church followed suit.</p></blockquote>

<blockquote><p>The 1859 Revival in Ulster led to uninspired hymns being brought into the worship of the Presbyterian Church in Ireland (PCI), though this was not officially sanctioned. As a Reformed Presbyterian (Covenanter) minister, the Revd Josias A. Chancellor of Bready sought to defend the biblical and confessional position. In so doing, he employed the following argument for exclusive psalmody using the basic hermeneutic of covenant theology (i.e. continuity with the Old Testament, except for abrogation in the New Testament):

[W]hen the administration of religion was changed, and carnal ordinances vanished away, we can detect no indication of change in the service of song. Baptism at once took the place of circumcision, the Passover was displaced by the Lord’s Supper, the first day of the week was observed instead of the seventh, sacrifices gradually ceased, and at length the Temple was destroyed, but there is no hint of any alteration being needed in the matter of praise, nor was there the slightest cessation of its observance. On the contrary, Christ and his Apostles continued to sing the Psalms, just as they had been sung before, and the Christian Church was commanded to keep up the exercise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-a-chancellor.html">J. A. Chancellor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lay-preaching and hymn-singing unwarranted in the Church: in reply to the Rev. F. J. Porter and Dr. Marcus Dill</cite>, (2nd edn, Londonderry, 1860), p. 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“The 1859 Revival in Ulster led to uninspired hymns being brought into the worship of the Presbyterian Church in Ireland (PCI), though this was not officially sanctioned. As a Reformed Presbyterian (Covenanter) minister, the Revd Josias A. Chancellor of Bready sought to defend the biblical and confessional position. In so doing, he employed the following argument for exclusive psalmody using the basic hermeneutic of covenant theology (i.e. continuity with the Old Testament, except for abrogation in the New Testament):

[W]hen the administration of religion was changed, and carnal ordinances vanished away, we can detect no indication of change in the service of song. Baptism at once took the place of circumcision, the Passover was displaced by the Lord’s Supper, the first day of the week was observed instead of the seventh, sacrifices gradually ceased, and at length the Temple was destroyed, but there is no hint of any alteration being needed in the matter of praise, nor was there the slightest cessation of its observance. On the contrary, Christ and his Apostles continued to sing the Psalms, just as they had been sung before, and the Christian Church was commanded to keep up the exercise.”

— J. A. Chancellor, Lay-preaching and hymn-singing unwarranted in the Church: in reply to the Rev. F. J. Porter and Dr. Marcus Dill, (2nd edn, Londonderry, 1860), p. 22.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+1859+Revival+in+Ulster+led+to+uninspired+hymns+being+brought+into+the+worship+of+the+Presbyterian+Church+in+Ireland+%28PCI%29%2C+though+this+was+not+officially+sanctioned.+As+a+Reformed+Presbyterian+%28Covenanter%29+minister%2C+the+Revd+Josias+A.+Chancellor+of+Bready+sought+to+defend+the+biblical+and+confessional+position.+In+so+doing%2C+he+employed+the+following+argument+for+exclusive+psalmody+using+the+basic+hermeneutic+of+covenant+theology+%28i.e.+continuity+with+the+Old+Testament%2C+except+for+abrogation+in+the+New+Testament%29%3A%0A%0A%5BW%5Dhen+the+administration+of+religion+was+changed%2C+and+carnal+ordinances+vanished+away%2C+we+can+detect+no+indication+of+change+in+the+service+of+song.+Baptism+at+once+took+the+place+of+circumcision%2C+the+Passover+was+displaced+by+the+Lord%E2%80%99s+Supper%2C+the+first+day+of+the+week+was+observed+instead+of+the+seventh%2C+sacrifices+gradually+ceased%2C+and+at+length+the+Temple+was+destroyed%2C+but+there+is+no+hint+of+any+alteration+being+needed+in+the+matter+of+praise%2C+nor+was+there+the+slightest+cessation+of+its+observance.+On+the+contrary%2C+Christ+and+his+Apostles+continued+to+sing+the+Psalms%2C+just+as+they+had+been+sung+before%2C+and+the+Christian+Church+was+commanded+to+keep+up+the+exercise.%E2%80%9D%0A%0A%E2%80%94+J.+A.+Chancellor%2C+Lay-preaching+and+hymn-singing+unwarranted+in+the+Church%3A+in+reply+to+the+Rev.+F.+J.+Porter+and+Dr.+Marcus+Dill%2C+%282nd+edn%2C+Londonderry%2C+1860%29%2C+p.+22.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb8c2732f0a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b8c2732f0a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2011/11/11/josias-chan

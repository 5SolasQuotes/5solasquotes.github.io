<main class="wrap"><figure class="quote" id="q-496cc23915" data-kw="">
<blockquote><p>Thesis 12… If any work be done for any worldly gain, profit or livelihood, to acquire and purchase the things of this life by (which is the principal end of week-day labor, Eph. 4:28; 1 Thess. 4:12), this is a servile work, all one with what the commandment calls ‘thy work’. Hence buying, selling, sowing, reaping, which are done for worldly gain, are unlawful on this day, being therefore servile works… [Buying and selling not done for worldly gain would not then be a servile work or prohibited, if this might not be done before or after the Sabbath, per the following section.] hence also such works as are done only for the preservation of the creatures… to keep fire in the iron mills, to sit at stern and guide the ship, and a thousand such like actions (being not done properly for worldly gain) are not unlawful; God Himself not ceasing from works of preservation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-shepard.html">Thomas Shepard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sanctification of the Sabbath in The Works of Thomas Shepard… (Boston, 1853), vol. 3, Theses Sabbaticae</cite>, p. 257</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eb0567b629" data-kw="">
<blockquote><p>And yet so far only to exercise it [the body on the Lord’s Day] as not to tire and weary it, if urgent occasion do not require, lest wearisomeness require some such recreation thereof as is nor [not] meet. … Whence it follows that all bodily recreations that do not further us to divine worship, are unlawful on the Lord’s Day: Because they serve only to refresh the body after labor; which is restrained therefrom; otherwise I say, then they shall make us fitter to serve God, when we have any liberty to labor upon case of necessity, though we may use that liberty to wearisomeness, yet this is to be relieued specially with spiritual recreation.</p></blockquote>

</figure><figure class="quote" id="q-4c3302b976" data-kw="">
<blockquote><p>When these things were finished, ‘the evening and the morning,’ Moses tells us, ‘were the first day.’ By ‘the evening’ here we understand not the beginning of the day according to the calculation which the Jews make during their festival seasons, but the close of the preceding day, and by the morning the beginning of the following day. Therefore Moses says ‘and the evening was,’ i.e., the darkness came on: just as he who labors during the day rests in the evening and on the following morning resumes his toils. Thus terminated the first day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-venema.html">Herman Venema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Translation of Hermann Venema’s inedited Institutes of Theology tr. Alexander W. Brown (d. 1787; Edinburgh: T&amp;T Clark, 1850), ch. 19, Creation</cite>, p. 344</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-2aa17737f1" data-kw="">
<blockquote><p>And it came to pass, as He went into the house of one of the chief Pharisees to eat bread on the sabbath day, that they watched Him… 7 And he put forth a parable to those which were bidden, when he marked how they chose out the chief rooms; saying unto them. 8 When thou art bidden of any man to a wedding, sit not down in the highest room; lest a more honourable man than thou be bidden of him… 12 Then said he also to him that bade him, When thou makest a dinner or a supper, call not thy friends, nor thy brethren, neither thy kinsmen, nor thy rich neighbours; lest they also bid thee again, and a recompence be made thee. 13 But when thou makest a feast, call the poor, the maimed, the lame, the blind… 15 And when one of them that sat at meat with him heard these things, he said unto him, Blessed is he that shall eat bread in the kingdom of God. 16 Then said he unto him, A certain man made a great supper, and bade many: 17 And sent his servant at supper time to say to them that were bidden, Come; for all things are now ready… 23 And the lord said unto the servant, Go out into the highways and hedges, and compel them to come in, that my house may be filled. 24 For I say unto you, That none of those men which were bidden shall taste of my supper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/new-testament.html">New Testament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lk. 14:1, 7-8, 12-13, 15-17, 23-24</cite></span></figcaption>

 Online</a></div>
</figure><figure class="quote" id="q-c487e9d890" data-kw="">
<blockquote><p>…if the work be necessarily required to the performance of the service of God, servile or not, it must be done. As circumcision on the eighth day, if it fell upon the Sabbath, it was to be done, Jn. 7:22. And the priests on the Sabbath killed the sacrifice and were blameless, Mt. 12:5. And in this respect the minister on the Sabbath is allowed to go to preach, as Christ did upon the Sabbath, Mt. 12, and the people are to go to hear. An example whereof we have in the Shunamite, that went ordinarily upon the Sabbath and new moon to the prophet: For when she demanded leave of her husband to go to the prophet, ‘Why wilt thou go’ (says he) ‘seeing it is neither Sabbath nor new moone’: intimating thereby that upon those times she went to hear him. And in this regard was the Sabbath day’s journey allowed, Acts 1:12. And therefore whosoever shall break the rest of the Sabbath in this respect is blameless. For the Sabbath was made for man, that he might keep it holy unto the Lord. Now, if it may so fall that the rest itself should any way be a let to the keeping of it holy, then the rest itself is to be broken: and they that so doe are blameless. For the end of the law in this respect is to be regarded and not the letter. For the Sabbath was made for man, that is, for the good of man; and not man for the Sabbath, that is for the rest. And this is the meaning of that place, Mk. 2:27, ‘The Sabbath was made for man, and not man for the Sabbath.’ … The conclusion then of this point is this: That no kind of ordinary or servile work may be done upon the Sabbath; neither in the house, nor in the city, nor in the fields, nor upon the seas, be they never so small, or never so meet, or never so glorious in show, except either God command it extraordinarily, or that the work tend directly to God’s worship: or be of necessity either for the preservation of life, or health, or goods; in which respects God has given us allowance upon the Sabbath to work, and not otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-widley.html">George Widley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath… (London, 1604), bk. 2, ch. 2, pp. 91-92, 97 Widley (b. 1566 or 1567) was an English minister in Portsmouth, England.</cite></span></figcaption>

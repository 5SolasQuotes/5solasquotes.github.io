<main class="wrap"><figure class="quote" id="q-0685cc3d93" data-kw="">
<blockquote><p>There is an old story about an oracle of the sibyl concerning Athens – that two banes would be its ruin, namely deceit and the stupidity of its leaders. However, if we consider the everyday life of men and the destruction of realms, the sibyl was prophesying not only for Athens but for all cities and empires.

In the past, Germany excelled both in the greatness of minds and in the truth, honesty and faith of its counsels. Nowadays people contend with ruses, righteous intentions are made sport of, and the ancient desire for military glory and courage are extinct. Therefore you can see that there is no help in such public danger, not only in Germany, but also in the rest of Europe.

When I think about this, I am distressed in my mind for the Church and for our studies, both of which are particularly threatened with devastation and ruin by the savagery of the Turks [Islam]. [1] Although dangerous hardship is imminent, as there are many signs not only in the stars, but also in the morals of men, I nevertheless sustain myself by the hope that God will care for the Church, and that the Son of God will defend our assemblies, as Daniel foretold.

Therefore, young men, these our studies are not to be cast away in desperation of rewards or of salvation. On the contrary, they are to be kindled even more enthusiastically, so that they may be preserved even in the midst of enemies, if that is what destiny brings. And because these our assemblies are part of the Church, every time we gather together, every time we think of our studies, let pious prayers be added, and let us pray to God, the Father of our Saviour Jesus Christ, that He may protect the Church and honest studies, and save and guide us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Astronomy and Geography (1536) in Orations on Philosophy and Education</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cc5a3c85f2" data-kw="">
<blockquote><p>For the Papists, they are not tolerated in Holland; The Jews are not only tolerated, but have the public exercise of their religion and their synagogues, viz. at Amsterdam. … It is a question propounded by Helvicus, An Judaei à Magistratu Christiano tolerandi, et quomodo tractandi? Whether the Jews be to be tolerated by the Christian magistrate, and how they are to be handled? (System Controvers. Theolog. quae Christianis cum Judaeis intercedunt, Elench. Jud. 8 et ult. Profecto excusari Magistratus Christianus non potest, si impune eorum blasphemias horrendas in Christum, et S.S. Trinitatem, totamque religionem Christianam, diutiùs oculo connivente toleret. [Certainly, the Christian magistrate cannot excuse himself if he should tolerate, with his eye winking, their horrible blasphemies against Christ, the most holy Trinity, and the whole Christian religion, with impunity, for a longer time.”] Idem, ibid. Amongst Gregory’s Epistles, there is one De Judaeis non persequendis [That the Jews are not to be persecuted].) He says it is a perplex[ed] question by reason of the different judgments. He propounds: First, diverse arguments of those which hold they are altogether to be cast out of a Christian commonwealth by reason of those horrible blasphemies which daily, both in their ordinary prayers and in their speeches they belch out against Christ, the Virgin Mary, our Faith, and all Christians in general, and for other reasons which he there alleges. Secondly, He urges other arguments to prove that the Jews are not to be cast out, but tolerated under the Christian magistrate, because by that means many of them may be converted by continual converse with the Christians, and the Scripture seems evidently to confirm that, Hos. 3:4; Zeph. 3:7; Lk. 21:24; Rom. 11:25-26, and because they may be serviceable to them against the pagans and for other reasons. He himself goes the middle way and lays down his opinion in certain propositions: First, It is better for Jews to live amongst Christians than under Turks or infidels. Secondly, The blasphemies of Jews are not to be tolerated, but to be prohibited and most severely punished by Christians. Thirdly, the Jews are to be esteemed among Christians as the servants of servants, that is so to be handled that they are exiles and cast off by God Himself. They are not to have any public office. They are not to practice that unjust usury for which they are so infamous amongst Christians. They are to have also (said he) some outward mark in their garments, by which they may be distinguished from others, and [are] to be forced to hear sermons. Many other cautions does he give in the receiving of them. As for the toleration of the Jews, whosoever they be that suffer the exercise of their religion with the blasphemies they commonly use against Christ, make themselves guilty of all their wickedness, which the Lord keep this land from, as well as from the abomination of the Mass. The Pope can tolerate the blasphemy of the Jews and the filthiness of all the courtesans and stews, and take a yearly rent of them for it, and for no respect will allow the exercise of our most holy religion either in his own dominions or wheresoever he may prevail against us. Traverse Answer to a Popish Treatise written to the Lords of the Council.</p></blockquote>

<blockquote><p>3. A magistrate may compel a heathen nation to the negative reverence of Christ in a indirect way, and that with the sword, though he cannot compel to the positive worshipping of Him: if a Christian prince subdue a pagan nation, he cannot force them with the sword to a positive receiving of the doctrine of the Gospel, but if it be a nation expressly blaspheming Christ, as the nation of the Jews now do, he may compel them to an abstinence from a professed blaspheming of Christ, because he is to use the sword against blasphemy.

4. The weapons of the Church as the Church are not carnal, but spiritual and mighty through God.</p></blockquote>

<blockquote><p>To stir up every one to help forward this glorious work of the Jews’ conversion; they were sometimes the chief, and the first born; though now their dignity is gone, and they are as prisoners in the pit; help we to restore them to their former liberty, lift them out of the pit into which they are fallen; If it were but our enemies beast, we were bound to help it out, how much more these that have been the people of God, and have such promises made unto them?

What shall we do to help forward their calling and conversion?

Take away (as much as in us lies) the stumbling block, which hinders their coming in; and these blocks are two; First, The one is the Idolatry of Christian Churches, especially that of Rome, whiles we do anything to uphold these Idolatries, we doe put the stumbling block before them, to hinder them; but take away these stones and blocks which they stumble at, and then their way will be more easy and plain. Secondly, The other is the carnalness and licentiousness of the lives of Christians, this is a great stumbling block unto them; remove this from before them, let them see a spirit of grace shining upon us, and appearing in our lives: and then we shall make plain the way of the Lord for them to return to Sion, see Esay 57.14.

Intreat the Lord for them, that he would visit them in due time, be we their remembrancers before the Lord; they have long lain in the dungeon, as Esa. 42.22. and been made a prey of, and there hath been none to say, restore, let us therefore speak unto God in their behalf, and say, Lord restore thy ancient people, bring them back to the fellowship of thy Church; take to you the words of Micah, Chap. 7.14. Feed thy people with thy rod, and the flock of thine inheritance in the midst of Carmel; let them feed in Bashan and Gilead, as in old time; commend their estate unto God, and the rather should we do this, Because

1. They prayed for us when we were no people, that we might be the people of God, Psal. 67.1, 2. When the salvation of God was revealed to them, they prayed that it might be revealed unto us; We have a little sister (said they) Cant. 8.8. They took thought for us, we being then that little sister, and so let us do for them.

2. It is from them that the means of salvation is come to us, the Law is called their Law, Joh. 10.34. It was given as an inheritance to the children of Israel, Deut. 33.4. And the spiritual things of the Gospel, are called their spiritual things, Rom. 15.27. And thence is that in Esa. 2.3. The Law shall go forth of Sion, and the word of the Lord from Jerusalem: yea, and of them came Christ concerning the flesh, Rom. 9. All the means of grace and salvation, are theirs first, and from them they come unto us; and thence it is that Christ himself tells us, That salvation is of the Jews, Joh. 4.22. We owe them this therefore, as a requital unto them.

3. Consider a further good that shall come unto ourselves by their calling unto Christ, there shall be an increase of blessing coming to ourselves. Great light shall be manifested, and knowledge shall increase, Esa. 24. ult. The light of the Sun, and of the Moon shall be darkened, by the light which shall come from that Church, the light of the Jewish Church which was but as the light of the Moon, and the light of the Gentile Churches, which is as the Sun, shall both be dim in comparison of the light which shall be in that Church, when the glory of the Lord is risen upon them. See Esa. 60.1.2. which speaks of the estate of the Jewish Church after their calling, as appears by that which goes before, Chap. 59. end. Many of those dark Prophecies, which now lie hid in obscurity, shall then be brought to light; the accomplishment of them will then give us the interpretation.

4. Admit we neither had received benefit from them hitherto, nor could expect any further blessing hereafter, yet consider the glory which shall then come to Christ by their coming in, the glory of his kingdom shall be enlarged, Jerusalem shall be a throne of glory to him, Jer. 3.17. then shall the Lord be glorified in them, all the house of Israel shall glory in the Lord, Esa. 45.25. and shall draw others of the Gentiles unto them.

5. If there were neither good to ourselves, nor glory to Christ by their calling, yet even pity and compassion should move us; consider who they are, even the children of Abraham our father, and Sarah our mother; they are our brethren, and our flesh; and how should it pity us to see the children of our father in the dungeon, and prison-pit? Oh pray for them, that the blessing of Abraham their father may come upon them.</p></blockquote>

<blockquote><p>It is reported, as some write, that up to a hundred thousand men and women of both sexes migrated to the Turks in those times. Moreover, it is handed down to memory that the Turkish Emperor was accustomed to say that he marveled at the stupidity of Christian kings, in that they preferred to expel such a great multitude—whom, if they did not wish to kill, they could nevertheless have retained in the place of slaves to perform useful and suitable services—rather than retain them for their own profit, according to the Horatian precept: When you can sell a captive, do not kill him; he will serve usefully.</p></blockquote>

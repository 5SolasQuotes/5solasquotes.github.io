<main class="wrap"><figure class="quote" id="q-a1116b007b" data-kw="">
<blockquote><p>It concerns not our Church alone, but all Christianity, that all to whom the Lord has entrusted any charge in his Church should agree in true concord; we must therefore purposefully and carefully cherish association and friendship with all ministers of Christ… As for me, as far as in me lies, I shall always labor to this end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in John T. McNeill, ch. 1. “The Ecumenical Idea &amp; Efforts to Realize it, 1517-1618” in eds. Ruth Rouse &amp; Stephen C. Neill, A History of the Ecumenical Movement: 1517-1948 (Philadelphia, 1967), p. 49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-8f8b9a4f73" data-kw="">
<blockquote><p>England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.</p></blockquote>

</figure><figure class="quote" id="q-5c87d81f26" data-kw="">
<blockquote><p>The catholic or universal visible Church is the assembly of all those which make profession of the Gospel of Jesus Christ throughout the whole world, distinguished (as we have said) into many particular Churches, all which do make but one body. Of all these particular, as members and parts of one and the self-same body, some are pure, other some are impure, some more, and some less sound, and some at this day are sick even unto death… Those that are of the purer and sounder Churches, we call them sound and true Churches, consenting to the true doctrine, which is the name, that for the most part, the ancient fathers have given them. The others we call the erring, heretical or schismatical Churches, according as they err, either in faith or in charity, against the square and right rule of Christ, or against the rule of his Church, either in the one or in the other, notwithstanding every one in his degree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philippe de Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter</cite>, [in controversy with Romanism] (London: Barker, 1579), ch. 2, n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-17f9b362bf" data-kw="">
<blockquote><p>12. When we say that the pure ministry of the Word and pure celebration of the sacraments is a fit pledge and earnest, so that we may safely recognise a church in every society in which both exist, our meaning is that we are never to discard it so long as these remain, though it may otherwise teem with numerous faults. Nay, even in the administration of Word and sacraments defects may creep in which ought not to alienate us from Its communion. For all the heads of true doctrine are not in the same position. Some are so necessary to be known, that all must hold them to be fixed and undoubted as the proper essentials of religion: for instance, that God is one, that Christ is God, and the Son of God, that our salvation depends on the mercy of God, and the like. Others, again, which are the subject of controversy among the churches, do not destroy the unity of the faith; for why should it be regarded as a ground of dissension between churches, if one, without any spirit of contention or perverseness in dogmatising, hold that the soul on quitting the body flies to heaven, and another, without venturing to speak positively as to the abode, holds it for certain that it lives with the Lord? The words of the apostle are, “Let us therefore, as many as be perfect, be thus minded: and if in anything ye be otherwise minded, God shall reveal even this unto you,” (Phil. 3:15) Does he not sufficiently intimate that a difference of opinion as to these matters which are not absolutely necessary, ought not to be a ground of dissension among Christians? The best thing, indeed, is to be perfectly agreed, but seeing there is no man who is not involved in some mist of ignorance, we must either have no church at all, or pardon delusion in those things of which one may be ignorant, without violating the substance of religion and forfeiting salvation. Here, however, I have no wish to patronise even the minutest errors, as if I thought it right to foster them by flattery or connivance; what I say is, that we are not on account of every minute difference to abandon a church, provided it retain sound and unimpaired that doctrine in which the safety of piety consists, and keep the use of the sacraments instituted by the Lord. Meanwhile, if we strive to reform what is offensive, we act in the discharge of duty. To this effect are the words of Paul, “If anything be revealed to another that sits by, let the first hold his peace.” (1 Cor. 14:30) From this it is evident that to each member of the Church, according to his measure of grace, the study of public edification has been assigned, provided it be done decently and in order. In other words, we must neither renounce the communion of the Church, nor, continuing in it, disturb peace and discipline when duly arranged.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, tr. Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 3, bk. 4, ch. 1, §12, pp. 23-25</span></figcaption>

ve+no+church+at+all%2C+or+pardon+delusion+in+those+things+of+which+one+may+be+ignorant%2C+without+violating+the+substance+of+religion+and+forfeiting+salvation.+Here%2C+however%2C+I+have+no+wish+to+patronise+even+the+minutest+errors%2C+as+if+I+thought+it+right+to+foster+them+by+flattery+or+connivance%3B+what+I+say+is%2C+that+we+are+not+on+account+of+every+minute+difference+to+abandon+a+church%2C+provided+it+retain+sound+and+unimpaired+that+doctrine+in+which+the+safety+of+piety+consists%2C+and+keep+the+use+of+the+sacraments+instituted+by+the+Lord.+Meanwhile%2C+if+we+strive+to+reform+what+is+offensive%2C+we+act+in+the+discharge+of+duty.+To+this+effect+are+the+words+of+Paul%2C+%E2%80%9CIf+anything+be+revealed+to+another+that+sits+by%2C+let+the+first+hold+his+peace.%E2%80%9D+%281+Cor.+14%3A30%29+From+this+it+is+evident+that+to+each+member+of+the+Church%2C+according+to+his+measure+of+grace%2C+the+study+of+public+edification+has+been+assigned%2C+provided+it+be+done+decently+and+in+order.+In+other+words%2C+we+must+neither+renounce+the+communion+of+the+Church%2C+nor%2C+continuing+in+it%2C+disturb+peace+and+discipline+when+duly+arranged.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes%2C+tr.+Beveridge+%281559%3B+Edinburgh%3A+Calvin+Translation+Society%2C+1845%29%2C+vol.+3%2C+bk.+4%2C+ch.+1%2C+%C2%A712%2C+pp.+23-25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F17f9b362bf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/17f9b362bf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=12.%20When%20we%20say%20that%20the,peace%20and%20discipline%20when%20duly%20arranged&amp;text=12.%20When%20we%20say%20that%20the%20pure%20ministry&amp;text=it%2C%20disturb%20peace%20and%20discipline%20when%20duly%20arranged" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

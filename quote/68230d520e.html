<main class="wrap"><figure class="quote" id="q-68230d520e" data-kw="">
<blockquote><p>And now, coming down to the time of the giving of the law, we find the Sabbath here, in this Fourth Commandment, “enshrined,” in the often-quoted words of Dr. [Thomas] Chalmers, “among the eternal sanctities of piety, and truth, and justice.” It stands associated with duties which are clearly and confessedly of permanent moral obligation, and no intimation is given that the requirement is only temporary. Is this fourth precept, then, to be regarded as an exception to the general principle, — as nothing more than a positive enactment, having no foundation in the nature of man as a moral being, and admitting, therefore, of being repealed at the will of the Lawgiver?

Surely the duties of worshipping God, cultivating holiness, preparing for the rest of heaven, are duties of a moral nature, and can there be anything more directly and properly moral than the setting apart of a certain portion of time for giving special attention to these duties? It is founded in man’s moral constitution. And what if the very proportion of time, which He who knows our frame has appointed for the purpose of rest — a seventh, rather than a sixth or an eighth part — should be, as eminent physiologists have told us, exactly the proportion that is requisite to restore the balance of the circulation, so as to secure a long life? Then the Fourth Commandment would have nothing positive in it at all; even the very proportion of time which God has fixed is moral, if such an arrangement be founded in the nature of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-symington.html">William Symington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath; The Grounds of its Obligation, and its Proper Place in Relation to Christian Life and Duty in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-f3bb12e975" data-kw="">
<blockquote><p>God’s ordination or appointment gives rules, measures, and ends, unto all sacred offices and employments. Whoever undertakes any thing in religion or divine worship without it, besides it, beyond it, is a transgressor, and therein worshippeth God in vain. He whom God doth not ordain in his service, is an intruder; and that which he doth not appoint is a usurpation. Nor will he accept of any duties, but what he himself hath made so. …

Many in all ages have been prone to indulge unto their own imaginations and inventions, in the disposal of divine worship. And this bitter root hath sprung up into all the superstition and idolatry that the earth is filled withal at this day. From these two poisoned springs hath proceeded that woful apostasy from Christ and evangelical worship which the world groans under.</p></blockquote>

<blockquote><p>[Samuel Rutherford]

But I know this ye hold: to maintain festival days, so long as ye do it for mere order, and for no religious mark ye can put upon the day.

[Thomas Sydserff]

And I think ye can hardly say anything against that.

[Samuel Rutherford]

This I would say against it, that then ye may bring into the church religious circumcision, the feast of Tabernacles, the Passover, the whole Jewish days, and esteemed as arbitrary and indifferent and no ways necessary.

[Thomas Sydserff]

What fault were that if our church should appoint a feast after the harvest for thanksgiving to God for the fruits of the ground, answerable to the Jewish feast?

[Samuel Rutherford]

This fault, in my weak judgment, it were Judaism and we might have an new temple, an new ark, new sacrifices and shedding of blood, after Christ by his death hath removed all bloody sacrifices. If this be added, they are indifferent and not necessary. I pray you, would this distinction keep the Galatians from being entangled with the old yoke of Jewish bondage, if they brought in circumcision, and holy days, with an new opinion and laid aside all typical and Jewish opinion?</p></blockquote>

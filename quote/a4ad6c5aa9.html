<main class="wrap"><figure class="quote" id="q-a4ad6c5aa9" data-kw="">
<blockquote><p>God cannot deal with them whom you call the world of mankind, according to the Covenant of Grace: For if he should, he should save them all; as I prove thus. If whatsoever God requires by this covenant on man’s part, God undertakes to perform on his part, then it is impossible but that all must be saved with whom he means to deal according to this covenant.

But whatsoever by this covenant God requires on man’s part, God himself undertakes to perform on his part, as I prove thus. First, in general, God undertakes in this covenant, to be our Lord and our God, to sanctify us. Therefore, he undertakes to give us faith and repentance. Secondly, in special, and first, doth God require at our hands, that we should love him with all our hearts, and with all our souls? God undertakes to perform this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), p. 181.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9f4eeb7fe6" data-kw="noah">
<blockquote><p>The Remonstrants in the declaration of their opinion about this set forth their opinion thus: “Christ by the merit of his death thus far reconciled God, the Father, to the whole human race, that the Father on account of that merit, without injury to his own justice and truth, could and willed to enter into and sanction a new covenant of grace with sinners and men exposed to damnation” (cf. Acta Synodi Nationalis … Dordrechti (1620), Pt. I, pp. 115–16, on Article 2, “Concerning the Death of Christ”). Now this new covenant, they maintain, was so made with the whole human race that no nation and no individual ought to be said to be excluded from it. “The nations living under the Old Testament, although the covenant was not revealed to them in the same manner as to the Jews, ought not forthwith to be considered as having been absolutely excluded from the covenant, who in some way at least are called that they may seek God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12</span></figcaption>

</figure><figure class="quote" id="q-acc30bbf0b" data-kw="">
<blockquote><p>I find that the covenant of God is of two sorts. One is general, an other is special and everlasting. The general covenant is that which he hade with his whole frame of the earth and all that dwelleth therein, as well beasts as men, with the day also and the night, winter and summer, cold and heat, seed time and harvest …

The special and everlasting covenant, is the same which he hath vouchsafed to make with his elect and believing.</p></blockquote>

<blockquote><p>Particularly noteworthy are his treatments of the Noahic and Mosaic covenants as integral to the overarching covenant of grace.” – Ryan McGraw . . The History of the Development of the Doctrine of the Covenant of Grace Whole of Church History eds. Waters, Reid &amp; Muether – pt. 2, chs. 14-20 in Covenant Theology: Biblical, Theological &amp; Historical Perspectives Pre (Crossway, 2020) ToC . In the Early Church Duncan, J. Ligon – The Covenant Idea in Ante-Nicene Theology PhD diss. (Edinburgh, 1995) Abstract: “This thesis argues that the covenant idea was more significant in the writings of particular ante-Nicene theologians than has generally been admitted in patristic research or general surveys of the history of the covenant idea in the Christian tradition… This investigation reveals that the covenant idea functions in several arenas of early Christian thought. It is employed (1) to stress moral obligations incumbent upon Christians; (2) to show God’s grace in including the Gentiles in the Abrahamic blessings; (3) to deny the reception of these promises to the Israel of the flesh, that is, Israel considered merely as an ethnic entity; (4) to demonstrate continuity in the divine economy; and (5) to explain discontinuity in the divine economy. In reviewing the role of early Christian covenant thought in these areas, this thesis argues that (1) the pre-Nicene theologians usually take OT covenant passages (not NT passages) as the starting point in their applications of the covenant concept to Christian living; (2) the early Christian use of the covenant idea evidences that they understood the covenant to be both unilateral and bilateral, promissory and obligatory, to bring divine blessings and entail human obedience; (3) these writings also show that, from the very earliest times, Christian authors (following OT and NT examples) have employed the covenant concept as a key structural idea in their presentations of redemptive history; (4) contrary to the suggestions of previous studies, there is no evidence of a gap in the usage of the covenant idea after the era of the NT writings; (5) the covenant idea was closely linked to the early Christian self-understanding as the people of God; (6) the covenant idea is not monolithic in the thought of the authors surveyed. It is employed with differing emphases and takes on varying shades of meaning in their respective writings… This study is significant for at least these following reasons: (1) It confirms current research on the Jewish matrix of early Christianity, from a vantage-point not yet exploited. (2) It reviews in greater detail the early Christian covenant thought which is now being acknowledged to have been influential on the sixteenth-century Reformers (such as Bullinger and Calvin). (3) As the first extensive patristic survey of the covenant idea, it fills a significant lacuna in the history of ideas…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-g-myers.html">Stephen G. Myers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God to Us: Covenant Theology in Scripture</cite>, (RHB, 2021) 368, pp. ToC</span></figcaption>

s Online</a></div>

<blockquote><p>The condition of the Covenant of Grace is partly faith, partly evangelical obedience or holiness of life proceeding from faith in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctions of Theology</cite>, ch. 17, p. 73 trans. Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 409</span></figcaption>

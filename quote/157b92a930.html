<main class="wrap"><figure class="quote" id="q-157b92a930" data-kw="">
<blockquote><p>…every action takes its species from its object; while human action, which is called moral, takes its species from the object, in relation to the principle of human actions, which is the reason. Wherefore if the object of an action includes something in accord with the order of reason, it will be a good action according to its species; for instance, to give alms to a person in want. On the other hand, if it includes something repugnant to the order of reason, it will be an evil act according to its species; for instance, to steal, which is to appropriate what belongs to another. But it may happen that the object of an action does not include something pertaining to the order of reason; for instance, to pick up a straw from the ground, to walk in the fields, and the like: and such actions are indifferent according to their species.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pt. 2, pt. 1, question 18, ‘Of the Good &amp; Evil of Human Acts in General’ in Summa | 8. ‘Whether any action may be indifferent in its species?’ [Yes]</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-fb9b120c8b" data-kw="">
<blockquote><p>XII. But as it is possible, nay, frequently happens, that, in some countries, neither bread nor wine are used, as in America and other parts of the world, where instead of bread they have a food prepared of pulse, or herbs, or of the fruits or even the bark of trees; and instead of wine their drink is made of honey or sugar, or other aromatics, or even the juice of the coco tree: It is justly queried, whether in those countries, they are wholly to abstain from the Lord’s supper, or whether, instead of bread and wine, it may be lawful to use that food in the supper which answers the purposes of bread and wine, and is adapted for strengthening the body and cheering the heart. Indeed, we think that no rash innovations should be made in the use of the sacraments: but then necessity has no law. And it seems very hard, should anyone take upon him to order that the natives and the foreigners in those spacious countries of the world should be deprived of the Lord’s supper, and their Christianity maimed without the sacramental food. Especially as the principal thing in the analogy is retained when that food and drink is made use of, by which the body may be properly nourished and the heart made glad.</p></blockquote>

</figure><figure class="quote" id="q-8a9f82966d" data-kw="">
<blockquote><p>Now those first ceremonial observations [of the Early Church with evangelical feasts] are guilty of opening that gate for all the human presumptions to enter into God’s house which pressed in after them: which gate could never be shut from that day to this. 2. Those very feasts made a composition or mixture of human institutions with divine, and therefore did not preserve simplicity. They also were from their first rise not only equalled unto, but also extolled above the Lord’s Day. Easter brought in a superstitious Lent to attend upon it, made baptism wait for her moon: and conformed our Lord’s Supper unto the Jewish Passover in unleavened bread, etc. [3.] It was the first apple of contention among Christians, the first weapon wherewith the Bishop of Rome played his prises [prices?] against other Churches, and after slew so many Britons with by Austin the monk. Holy-days in honor of Christ invited unto them saints’ holy days, etc. 4. It is presumtion to make men’s inventions as guiltless of evil consequences as God’s holy ordinances. They are active efficacious occasions given of evil: these [ordinances of God] are only passive occasions taken.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, (Amsterdam: Thorp, 1633), ch. 1, section 17, pp. 84-85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

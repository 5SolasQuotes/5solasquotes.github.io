<blockquote><p>Furthermore, one ought to know that the Arminians have fabricated a third category in the divine knowledge; they call this knowledge middle or conditioned knowledge according to which God knows a certain event He has never decreed. But this is absurd. Because nothing happens what God did not decree, Thr 3,37 [Lam. 3:37].</p></blockquote>

<blockquote><p>Wisdom is God understanding all things intelligible by his essence, 1 Tim. 1:17; Acts 15:18; 1 Jn. 3:20. God comprehending his own essence sees all things, because all possibilities, futuritions and beings, that is, all things that might have been, shall be or actually be, are eminently contained in the divine essence. Whence, by the way it may appear that the divine essence as willing the futurition of things, is that increated idea of all things: which God comprehending, understands the creature better in Himself than it is to be understood in itself. God seeing Himself, sees all things, without exemption of any; always, without intermission; perfectly, without defect: at once, without succession. He is all eye, yet without an eye: all memory, yet without a memory. God understands all things by his essence; angels are thought to understand by an infused habit of the species or images of things concreated with their nature. Men understand by the species or images of things abstracted and received from their objects. Men understand by way of syllogistical discourse, viz. by reasoning; that is, by deducing and gathering conclusions from principles by several acts of their understanding: and by compounding and dividing: that is, by laying the subject and predicate together, or by taking them asunder: and thereby collecting what may be said, or not said truly concerning such a subject. Those truths which men, by reason of the weakness of their understanding, apprehend not without discourse and by compounding and dividing (Thomas, pt. 1, quest. 58, art. 3-4; Polanus, Syntagma, bk. 5, ch. 11): Angels by reason of the quickness and strength of their understanding apprehend readily and as it were at first sight. Whence albeit they understand syllogistical discourse, composition and division, yet (at least compared with men) they may be said not to understand by discourse, nor by composition and division, but intuitively and as it were at first sight.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London, 1654), ch. 1, Of the Divine Essence, pp. 16-17</span></figcaption>

</figure><figure class="quote" id="q-1ef7d39e09" data-kw="">
<blockquote><p>Are there ideas? It is affirmed. Whether by necessity there are posited ideas in God? It is affirmed. Whether they are in God, or rather outside God? The prior is affirmed. Whether they are things themselves produced by God, so far by the divine intellect, is objected, that is, whether they have the rule of an object, in which, as it were, they are things known in the imagination by a creature? It is denied. Whether they are the effective causes of things, and indeed are first things and principles simply in their genus? It is affirmed. Whether every knowing or cognition of God indicates an idea? It is denied. Whether ideas are rightly divided into speculative and practical? It is denied. Whether ideas pertain to the speculative or rather to practical knowledge? The latter is affirmed. Whether the distinction of ideas into act and potential rightly explained is possible? It is affirmed. Whether all ideas in God are one and really the same with God? It is affirmed. Whether they are really the same amongst themselves or are really and intrinsically one idea? Affirm with a distinction. Whether ideas in God and in themselves are able and ought to be understood or investigated by us? It is denied. Whether ideas which are in the divine mind, through the first thing respect, so far, the singular nature, or the nature of the species? The latter is affirmed. Whether ideas are all which are known by God? It is denied. Whether evil may maintain an idea in God? It is denied with a distinction. [The reason is because evil is not a thing, or the form, species or genus of a thing, but a deficiency therefrom.] Whether impossibilities have ideas in God? It is denied. Whether prime matter [matter without form] has an idea in God? It is affirmed. Whether in God may be the idea of things which neither are, nor were, nor will be? It is affirmed. Whether accidents have an idea in God? It is distinguished. Whether singulars have an idea in God? It is affirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix: ‘Of Ideas in God’ in Syllabus of Theological Problems</cite>, (Utrecht, 1643), pt. 1, section 1, tract 2, I. ‘Of God’, 2nd Kind, (1) Intellect or Knowledge [Scientia] of God Abbr.</span></figcaption>

<blockquote><p>The doctrine of middle knowledge, however, represents contingent future events as contingent and free also in relation to God. This is with reference not only to God’s predestination but also his foreknowledge, for just as in Origen, things do not happen because God knows them, but God foreknows them because they are going to happen. Hence, the sequence is not necessary knowledge, the knowledge of vision, the decree to create (etc.); instead, it is necessary knowledge, middle knowledge, decree to create (etc.), and the knowledge of vision. God does not derive his knowledge of the free actions of human beings from his own being, his own decrees, but from the will of creatures. God, accordingly, becomes dependent on the world, derives knowledge from the world that he did not have and could not obtain from himself, and hence, in his knowledge, ceases to be one, simple, and independent – that is, God. Conversely, the creature in large part becomes independent vis-a-vis God. It did indeed at one time receive “being” (esse) and “being able” (posse) from God but now it has the “volition” (velle) completely in its own hand. It sovereignly makes it own decisions and either accomplishes something or does not accomplish something apart from any preceding divine decree. Something can therefore come into being quite apart from God’s will. The creature is now creator, autonomous, sovereign; the entire history of the world is taken out of God’s controlling hands and placed into human hands. First, humans decide; then God responds with a plan that corresponds to that decision.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>
<div class="actions"><button class="copy" data-copy="“The doctrine of middle knowledge, however, represents contingent future events as contingent and free also in relation to God. This is with reference not only to God’s predestination but also his foreknowledge, for just as in Origen, things do not happen because God knows them, but God foreknows them because they are going to happen. Hence, the sequence is not necessary knowledge, the knowledge of vision, the decree to create (etc.); instead, it is necessary knowledge, middle knowledge, decree to create (etc.), and the knowledge of vision. God does not derive his knowledge of the free actions of human beings from his own being, his own decrees, but from the will of creatures. God, accordingly, becomes dependent on the world, derives knowledge from the world that he did not have and could not obtain from himself, and hence, in his knowledge, ceases to be one, simple, and independent – that is, God. Conversely, the creature in large part becomes independent vis-a-vis God. It did indeed at one time receive “being” (esse) and “being able” (posse) from God but now it has the “volition” (velle) completely in its own hand. It sovereignly makes it own decisions and either accomplishes something or does not accomplish something apart from any preceding divine decree. Something can therefore come into being quite apart from God’s will. The creature is now creator, autonomous, sovereign; the entire history of the world is taken out of God’s controlling hands and placed into human hands. First, humans decide; then God responds with a plan that corresponds to that decision.”

— Herman Bavinck, Reformed Dogmatics">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+doctrine+of+middle+knowledge%2C+however%2C+represents+contingent+future+events+as+contingent+and+free+also+in+relation+to+God.+This+is+with+reference+not+only+to+God%E2%80%99s+predestination+but+also+his+foreknowledge%2C+for+just+as+in+Origen%2C+things+do+not+happen+because+God+knows+them%2C+but+God+foreknows+them+because+they+are+going+to+happen.+Hence%2C+the+sequence+is+not+necessary+knowledge%2C+the+knowledge+of+vision%2C+the+decree+to+create+%28etc.%29%3B+instead%2C+it+is+necessary+knowledge%2C+middle+knowledge%2C+decree+to+create+%28etc.%29%2C+and+the+knowledge+of+vision.+God+does+not+derive+his+knowledge+of+the+free+actions+of+human+beings+from+his+own+being%2C+his+own+decrees%2C+but+from+the+will+of+creatures.+God%2C+accordingly%2C+becomes+dependent+on+the+world%2C+derives+knowledge+from+the+world+that+he+did+not+have+and+could+not+obtain+from+himself%2C+and+hence%2C+in+his+knowledge%2C+ceases+to+be+one%2C+simple%2C+and+independent+%E2%80%93+that+is%2C+God.+Conversely%2C+the+creature+in+large+part+becomes+independent+vis-a-vis+God.+It+did+indeed+at+one+time+receive+%E2%80%9Cbeing%E2%80%9D+%28esse%29+and+%E2%80%9Cbeing+able%E2%80%9D+%28posse%29+from+God+but+now+it+has+the+%E2%80%9Cvolition%E2%80%9D+%28velle%29+completely+in+its+own+hand.+It+sovereignly+makes+it+own+decisions+and+either+accomplishes+something+or+does+not+accomplish+something+apart+from+any+preceding+divine+decree.+Something+can+therefore+come+into+being+quite+apart+from+God%E2%80%99s+will.+The+creature+is+now+creator%2C+autonomous%2C+sovereign%3B+the+entire+history+of+the+world+is+taken+out+of+God%E2%80%99s+controlling+hands+and+placed+into+human+hands.+First%2C+humans+decide%3B+then+God+responds+with+a+plan+that+corresponds+to+that+decision.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0afca7c940.html&amp;vi

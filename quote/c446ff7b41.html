<blockquote><p>1… And this nature is conveyed unto us by generation; conveyed (I say) as corrupt, not as sinfull: and so corrupt as flesh and bloud can be, before a reasonable soul be united to it. So that we being in Adam, secundum causam seminalem, &amp; propagandi virtutem [according to a seminal cause and power of propagating] our first father transmitted after his fall some corruption unto all his children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-kellet.html">Edward Kellet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Miscellanies of Divinity, divided into Three Books, wherein is Explained at Large the Estate of the Soul in her Origination, Separation, Particular Judgement</cite>, … (Cambridge, 1635), bk. 1, ch. 6 Kellet (1583-1641) was a doctor of divinity and a calvinistic, Anglican, canon in the cathedral church at Exeter., p. 90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-e22f02a183" data-kw="">
<blockquote><p>Question 80, Abortion of a Woman from a Brawl Between Two Men. …Well, the fact that the author [of Exodus] did not want the unborn childbirth to belong to the homicide proves that he thought that it was not man that is carried in the mother’s womb. Here the problem of the soul is usually posed, that is, if what is not formed cannot be said to be animated, and therefore, that it would not be a homicide, since it cannot be affirmed that a being that had not yet had soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Questions on Exodus, on Ex., 21:22</span></figcaption>

</figure><figure class="quote" id="q-7f7ce76c33" data-kw="">
<blockquote><p>In terms of justifying the word ‘control,’ I want to explain the importance of avoiding passivity. Dominion involves stewardship, study, exploration, managing, planning, rationing, apportioning, starting work, resting from work, categorizing, improving, and using this creation to God’s glory. Man was not to be passive in relationship to his environment, his family, his time, future, or any other aspect of creation. Indeed, to passively allow creation to order itself is the opposite of the dominion mandate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’</cite>, (2017)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“In terms of justifying the word ‘control,’ I want to explain the importance of avoiding passivity. Dominion involves stewardship, study, exploration, managing, planning, rationing, apportioning, starting work, resting from work, categorizing, improving, and using this creation to God’s glory. Man was not to be passive in relationship to his environment, his family, his time, future, or any other aspect of creation. Indeed, to passively allow creation to order itself is the opposite of the dominion mandate.”

— Phillip Kayser, ‘Conception Control: Avoiding Antinomianism &amp; Legalism’ (2017)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+terms+of+justifying+the+word+%E2%80%98control%2C%E2%80%99+I+want+to+explain+the+importance+of+avoiding+passivity.+Dominion+involves+stewardship%2C+study%2C+exploration%2C+managing%2C+planning%2C+rationing%2C+apportioning%2C+starting+work%2C+resting+from+work%2C+categorizing%2C+improving%2C+and+using+this+creation+to+God%E2%80%99s+glory.+Man+was+not+to+be+passive+in+relationship+to+his+environment%2C+his+family%2C+his+time%2C+future%2C+or+any+other+aspect+of+creation.+Indeed%2C+to+passively+allow+creation+to+order+itself+is+the+opposite+of+the+dominion+mandate.%E2%80%9D%0A%0A%E2%80%94+Phillip+Kayser%2C+%E2%80%98Conception+Control%3A+Avoiding+Antinomianism+%26+Legalism%E2%80%99+%282017%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7f7ce76c33.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7f7ce76c33.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-birth-control/#:~:text=In%20terms%20of%20justifying%20the%20word,the%20opposite%20of%20the%20dominion%20mandate&amp;text=In%20terms%20of%20justifying%20the%20word%20%E2%80%98control%2C%E2%80%99%20I&amp;text=itself%20is%20the%20opposite%20of%20the%20dominion%20mandate" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8d9a53e58c" data-kw="">
<blockquote><p>Concerning the original of the soul, diverse men have diversly thought… There are three opinions touching this question: The first of those who affirm the traduction of the soul by generation, some of which so affirm because they judged it a corporeal substance, as did Tertullian. Others because they believed that one spirit might as easily proceed from another, as one fire or light be kindled by another: as Apollinarius, Nemesi•…, and diverse in the Western Churches, as St. Jerome witnesses. The second, of those who deny the natural traduction, and say that the soul is •…ion infused into bodies, organized and predisposed to receive them; of which opinion among the ancients were St. Jerome, Hilary, Ambrose, Lactantius, Theodoret, Aeneas Gaz•…us, and of the modern writers, the major part. The third is of those who do haesitare, stick between both, and dare affirme nothing certain on either side, which is the moderation of St. Augustine and Gregory the great, who affirm that this is a question incomprehensible, and unsolvable in this life. Now the only reason which caused St. Austin herein to hesitate, seems to have been the difficulty of traducing original sin from the parents to the children. For says he (writing unto St. Jerome touching the creation of the soul), ‘If this opinion do not oppugne that most fundamental faith of original sin, let it then be mine; but if it do oppugne it, let it not be thine.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Passions &amp; Faculties of the Soul of Man</cite>, (London, 1640), ch. 32, pp. 391-92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

<main class="wrap"><figure class="quote" id="q-1a44850229" data-kw="">
<blockquote><p>Question: Can any man be justified before he does actually believe? Answer: If we take justification in the first, most proper and principal sense, as it is the act of God alone, communicating Christ’s righteousness and satisfaction to his elect, when He does first unite them to Christ by his Spirit, and make Christ theirs with all his treasures: then it must be granted that men may be and are justified, before and without any express act of believing. As for example: elect infants which die in their infancy, when they are regenerated and united to Christ by his Spirit, they have communion of his righteousness and are justified and made righteous, and all their sins are abolished and blotted out; and yet they do not actually believe, nor perform any explicit and express act of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Key of Saving Knowledge, Opening out of the Holy Scriptures the Right Way &amp; Straight Passage to Eternal Life</cite>, … (London: Badger, 1641), pp. 79-82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fc723ab2ff" data-kw="">
<blockquote><p>But as gospel-faith is not that reflex act of the soul in a man whereby it is persuaded that Christ is his, but a direct act of taking and receiving Christ to be ours, so a gospel-repentance is not that mainly whereby we are humbled because we receive God’s love to us in pardoning, but principally in that loathing of ourselves to obtain pardon. It is therefore great ignorance in that author, in his treatise of Gospel Repentance, when p. 58, he calls repentance that goes before this faith, viz. that my sins are pardoned, a dead work; as if the faith that justifies, and without which it is impossible to please God, were the believing that my sins are pardoned; whereas the Scripture makes it to be the receiving of Christ and laying hold on Him. And seeing that the object must in order of nature be before the act that is employed about it, it follows infallibly that I must have justification before I can believe I have it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, (London: Miller, 1651), Lecture 30, on Lk. 7:47, p. 268</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-e4fedbc9a0" data-kw="">
<blockquote><p>It will be said by such a believer that my change of view was too rationalistic, too cerebral, too bloodless, too focused on a theoretical knowledge of the God of the philosophers rather than a personal response to the God of Abraham, Isaac, and Jacob. But the dichotomy is a false one, and the implied conception of the relationship between faith and reason not only foolish but heterodox. As to the heterodoxy and foolishness of fideism, and the correct understanding of the relationship of faith and reason, I have addressed that set of issues elsewhere. As to the ‘heart versus head’ stuff, it seems to me to rest on an erroneous bifurcation of human nature. Man is a unity, his rationality and animality, intellect and passions, theoretical and moral lives all ultimately oriented toward the same end… …that does not mean that the will does not have a role to play. But that is true wherever reason leads us to a conclusion we might not like, not merely in matters of religion. And once you have allowed yourself to see the truth that reason leads you to, what reason apprehends is (given the convertibility of the transcendentals) as good and beautiful as it is real. If you find yourself intellectually convinced that there is a divine Uncaused Cause who sustains the world and you in being at every instant, and don’t find this conclusion extremely strange and moving, something that leads you to a kind of reverence, then I dare say you haven’t understood it. Of course, there are those whose heads and hearts are so out of sync that they cannot follow both at the same time. But we shouldn’t mistake this pathology for an insight into human nature.</p></blockquote>

— Bob LaForge, Contemplating the Almighty, p. 122">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPride+wants+to+earn+divine+acceptance%3B+humility+simply+believes+it.%E2%80%9D%0A%0A%E2%80%94+Bob+LaForge%2C+Contemplating+the+Almighty%2C+p.+122&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa67bc9d8e2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a67bc9d8e2.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-c52c042edb" data-kw="">
<blockquote><p>Some would suppose our union to Christ, and consequently, by virtue of that, our justification by Christ, to be before actual faith, even in adult persons, and consequently without it; they insist upon a priority in nature and time, and build positions upon that distinction that will not hold… They who hold justification before faith are afraid lest they should be betrayed into a justification by works, if they should hold otherwise; and therefore choose rather to plead for a justification before faith, and without faith, lest they should seem to be justified by anything in and from themselves; but how contrary is this to Scripture, ‘He that believeth not, is condemned’? (Jn. 3:18) But he that believes not, is justified, is nowhere written in my Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cole.html">Thomas Cole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Regeneration, Faith &amp; Repentance</cite>, ... (London: Cockerill, 1692), Discourse of Regeneration, ch. 4, ‘Manner of Regeneration’, p. 92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

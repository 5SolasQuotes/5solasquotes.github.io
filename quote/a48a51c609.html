<blockquote><p>[Johann H.] Alsted assumes, with Aquinas, that ‘grace does not destroy nature, but perfects it’ and that ‘grace is not contrary to nature.’ (Muller, PRRD 1.303) . Natural vs. Positive Law Thomas: “The general principles of the natural law cannot be applied to all men in the same way on account of the great variety of human affairs: and hence arises the diversity of positive laws among various people.</p></blockquote>

<blockquote><p>We come now to the principle of substance. It is thus formulated: ‘That which exists as the subject of existence is substance, and is distinct form its accidents or modes.’ Thus in everyday speech we call gold or silver a substance. This principle is derived from the principle of identity, because that which exists as subject of existence is one and the same beneath all its multiple phenomena, permanent or successive. The idea of substance is thus seen to be a mere determination of the idea of being. Inversely, being is now conceived explicitly as substantial. Hence the conclusion: The principle of substance is simply a determination of the principle of identity: accidents then find their raison d’etre in the substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (n.p., 1946), ch. 4, ‘Intelligible Being &amp; First Principles’, p. 25</span></figcaption>

<blockquote><p>5. If all mixed perfections are reducible to a plurality of pure perfections existing in limited degree, and if an infinite being possesses all pure perfections, the consequent is that God in some way possesses every positive perfection that is found or can be found in creatures, and indeed possesses it in unlimited degree. Accordingly God seems to differ from creatures by something positive not possessed by creatures. Creatures, by contrast, do not seem, in the ultimate analysis, to differ from God by any positive perfection precisely but rather because they lack some perfection that God has. This notion is also expressed in the theory of participation, according to which creatures are finite or imperfect likenesses of God insofar as any perfection possessed by them is found in God either formally or virtually or eminently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pp. 80-81</span></figcaption>

</figure><figure class="quote" id="q-81609f3c8d" data-kw="">
<blockquote><p>Controversy – Is God able not only to deprive an innocent creature of life but also to condemn them to the eternal tortures of hell? We deny against certain Scholastics. Arguments 1. All the ways of God should be mercy and truth to those who keep covenant (Ps. 25:10). 2. Anyone approaching God should believe that He will reward their obedience with a reward not condemn them (Heb. 11:6). 3. In an innocent creature there can be no consciousness of guilt or the just judgment of God, which is the meaning of punishment. 4. No glory to God could arise from this but rather the dishonor of a tyrannical lord. 5. The righteousness of God demands that He acquit the holy, but it does not permit him to condemn someone who has not merited it (Ps. 18:26-27, Gen. 18:25, Ps. 7:11). Objections 1. He can reduce the innocent to nothing. Reply. Then he only takes away what He gave, but punishment would be to do injury to someone while existing. 2. He acts this way with Christ. Reply. He was our surety, who took our debts on Himself. 3. God can impute to us the sin of Adam. Reply. That is imputed to be ours which is truly ours just as the children of slaves are slaves and the sons of citizens are citizens and are reputed to be such. 4. We are permitted to kill innocent creatures. Reply. 1. Not rational ones. 2. Irrational ones (bruta) for our use (2 Pet. 2:12). 3. It is one thing to kill, another to give to the living the highest punishment according to one’s pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary</cite>, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’, pp. 84-85, 112-13, 121-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-00fdb6afba" data-kw="">
<blockquote><p>We call principles those things which are known per se by the light of nature, which are known immediately, and which are unmoved or immutable, such that from them at last definite knowledge arises. From these principles the faculty of reason deduces fixed processes, like rivulets from springs. It compares the principles of nature with the truth of reality or separates them from one another. It joins causes with effects and from these forms conclusions. It decides which things are common and which unique. Finally, it so orders everything that it acquires knowledge of all those things which the reason of a person can trace down and follow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on True Theology</cite>, trans. David Noe (1592?; RHB, 2014), ch. 10, ‘Natural Theology’, p. 146</span></figcaption>

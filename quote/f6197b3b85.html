<main class="wrap"><figure class="quote" id="q-f6197b3b85" data-kw="">
<blockquote><p>If CHRIST had not been our Rock, there had been no Dwelling in him, he would not have keeped Wind and Weather off us: Therefore the Divine Nature was a Pillar on which the Human Nature did hang, and this is the Cause why CHRIST-man leans to the Divine Nature, as his Warrant in all that he does. For if ye will consider in this Work, there is Three Bargains, or Covenants to speak so.

First, GOD and Man bargained together, ye shall believe, that’s your Part. I shall give you Life Eternal, that’s my Part says GOD. Now Man dare not promise this of himself without CHRIST’s Bond to Relieve him, that is to Enable him throw his Grace to believe.

Secondly, GOD Bargains with his Son, Isaiah 53. 10. Son, if Thou shall lay down Thy Life, Thou shall see Thy Seed, and Prolong Thy Days, and have many fair Children, Psalms 2. Ye shall have the Heathen to Serve You. Heb. 1. I will be Your Father, and Ye shall be My Son. CHRIST is content, but he cannot do this alone; he must borrow Flesh and Blood from Man, and in it Suffer.

Thirdly, The Man CHRIST Bargains with the Divine Nature. The Human Nature says, I Love Man, and I will Die for him: The Divine Nature says, now I shall hold Thee up under Thy Sufferings, and Thou shall overcome Death. The Man Christ without the Back-bond (to speak so) durst not for Ten Thousand Worlds have ventured to Yoke in the Fields with the Justice of GOD, and Death, and Hell, and Sin, and the Devil, except he had the Divine Nature in a Personal Union to bear him up under his Sufferings: Therefore CHRIST when he looks upon his Sufferings, looks also upon his Warrant, Isaiah 56. I gave My Back to the Smiters, and My Checks to them that pulled off the Hair. These be the Words of the Man CHRIST.

Now because it might have been said a Man will Suffer all that his alone; But here he looks to his Warrant, Verse 7. and says, I have my Warrant with Me, The LORD GOD will help Me, I shall not be confounded. I have GODs Warrant who is united to Me in a Personal Union to bear Me up. Even Sick-like CHRIST goes down to the Grave, Psalms 16. 10. Thou wilt not leave My Soul in Hell, (or the Grave,) neither wilt Thou suffer Thy Holy One to see Corruption.

As if Christ would say, I am sure LORD Thou will be as Good as Thy Word, and make Good Thy Bargain, and will Warrant Me against Death: See then how it goes; The Man Christ takes Man by the Hand to bring him out from under GOD’s Wrath. So Beloved, Be Glad in such a Saviour, come all into the Rock, for God, Christ, and Man, all these Three are linked together as in a Chain, and Christ in the middle link of the Chain.</p></blockquote>

<blockquote><p>‘Tis for a Soul to sit down satisfied with what God is, as all, and so it lies in a full and ample satisfaction, in, and with the Divine presence and fulness: ‘Tis for a Soul to take up, in, and with the blessed God, as his only and all-sufficient Portion and happiness for ever. God, my Beloved, is an All-sufficient God, he asserts his own All-sufficiency, Gen. 17.1. I am God all-sufficient, (says he to Abraham) q. d. I am infinitely sufficient for my self, and I am infinitely sufficient for thee and all my People, to make the one and the other happy for ever. God is an inexhaustible Fountain of Light, Life, Love, Blessedness, Perfection and Glory; there is all good in God, and he that has God has all. To him that overcometh will I give to inherit all things: And how so? I will be his God, Rev. 21.7. He has all good, all happiness in him, and in him we may find all as in its Fountain-fulness and purity.

Now the Soul, seeing God to be such a God, and withal looking upon him as his God in Covenant, sits down satisfied with him alone, saying, I have enough, I have all, and so is at Rest in him, whether he has much or little, any thing or nothing of this world’s good; whether the streams run high or low with him, yet here is a Fountain of infinite sweetness and blessedness, and he drinks there, and satisfies himself there; he sees the Fountain is so full, that he needs not the streams to make him happy, and accordingly sits down satisfied therewith, and is at Rest: Thus David’s Soul was at Rest in God, Ps l. 16.5, 6. the Lord is the portion of mine Inheritance, and of my Cup: Well, and what then? Why he sits down at Rest in him, the lines (says he) are fallen to me in pleasant places yea, I have a goodly heritage; I have enough, enough for delight, and enough for satisfaction; I have as much as my Soul can wish or desire; so Psal. 17.15. As for me, I will behold thy Face in Righteousness, I shall be satisfied, when I awake, with thy likeness; in the verse immediately preceding he had spoken of some whose portion and happiness is in this World; well, and pray David where and in what is your Portion, your happiness?

My Portion is in God, and my Happiness is in God, (says he) in the sight of God, and in the likeness of God; let others take up their Rest, Portion and Happiness where and in what they will, God is my Rest, my Portion, my Happiness, my All for ever: as for me I will behold, &amp;c. Again, the Lord lives, (says he) and blessed be my Rock, Psal. 18.46. q. d. such and such Comforts are dead and gone, they are not, (as Jacob spake of his sons) well, but however God lives still, I have a living God, and he is a living Happiness, and that’s enough. So 2 Sam. 23.5. Although my House be not so with God, yet he hath made with me an everlasting Covenant, ordered in all things, and sure, and this is all my Salvation, and all my desire, q. d. God is my God by Covenant, and here is my happiness, even all that my Soul can wish, and accordingly he is at Rest in his God: And Psal. 73.25, 26. Whom have I in heaven but thee? and there is none upon Earth that I desire in comparison of thee: my heart and my flesh faileth, but God is the Rock of my heart, and my Portion for ever.

How dark soever things looked with him, yet he, looking to his God, was satisfied and at Rest in him, and with him, as infinitely enough for him. The Prophet Habakkuk resolved upon the same course, Hab. 3.17, 18. Although the Fig-tree shall not blossom, neither shall Fruit be in the Vines; the labour of the Olive shall fail, &amp;c. yet will I rejoice in the Lord, I will joy in the God of my Salvation: He supposes the worst that could come, and yet still resolves to be at Rest in God, and that God alone shall be enough for him, when all other things fail.

Thus the holy Soul sits down satisfied with God alone, setting God, and an interest in God, over and against all his Wants, Losses, Burthens, Difficulties, Temptations, as one infinitely able to relieve and satisfy him under all; his language to God is, Lord, let others take the Word, and the good things thereof, give me thy Self, and I have enough; run out to broken Cisterns who will, let me have a free recourse unto the Fountain, and I am satisfied; ’tis true, the Tide of Creature-comforts runs low with me, and on the other hand, the Waves and Surges of Affliction rise high; but God is all-sufficient, and I have enough in him; he sees a little of that glorious Fullness, Sweetness and Blessedness that is in God, and hereupon sings an holy Requiem unto himself, saying, Soul take thine ease, thou hast Goods, Light, Life, Love, Blessedness, Salvation enough laid up for thee for many days, yea for the days of Eternity, take thine ease, sit down satisfied in and with thy God alone; had’st thou ten thousand Worlds, without him thou had’st nothing, but in him thou hast all, Rest thou therefore in him. Thus you see what ’tis for a Soul to be at Rest in God, and when he may be said to be at Rest in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-pearse.html">Edward Pearse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true rest: or, The soul’s rest in God. Opened and improved, from Psal. 116.7</cite>, in A beam of divine glory, or, The unchangeableness of God opened, vindicated, and improved: whereunto is added, The soul’s rest in God. By Edward Pearse. To which is prefixed the author’s last letter, written in the time of his sickness to some peculiar friends (London: Jonathan Robinson, 1674), pp 161-64.</span></figcaption>

Thus the holy Soul sits down satisfied with God alone, setting God, and an interest in God, over and against all his Wants, Losses, Burthens, Difficulties, Temptations, as one infinitely able to relieve and satisfy him under all; his language to God is, Lord, let others take the Word, and the good things thereof, give me thy Self, and I have enough; run out to broken Cisterns who will, let me have a free recourse unto the Fountain, and I am satisfied; ’tis true, the Tide of Creature-comforts runs low with me, and on the other hand, the Waves and Surges of Affliction rise high; but God is all-sufficient, and I have enough in him; he sees a little of that glorious Fullness, Sweetness and Blessedness that is in God, and hereupon sings an holy Requiem unto himself, saying, Soul take thine ease, thou hast Goods, Light, Life, Love, Blessedness, Salvation enough laid up for thee for many days, yea for the days of Eternity, take thine ease, sit down satisfied in and with thy God alone; had’st thou ten thousand Worlds, without him thou had’st nothing, but in him thou hast all, Rest thou therefore in him. Thus you see what ’tis for a Soul to be at Rest in God, and when he may be said to be at Rest in him.”

— Edward Pearse, The true rest: or, The soul’s rest in God. Opened and improved, from Psal. 116.7, in A beam of divine glory, or, The unchangeableness of God opened, vindicated, and improved: whereunto is added, The soul’s rest in God. By Edward Pearse. To which is prefixed the author’s last letter, written in the time of his sickness to some peculiar friends (London: Jonathan Robinson, 1674), pp 161-64.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98Tis+for+a+Soul+to+sit+down+satisfied+with+what+God+is%2C+as+all%2C+and+so+it+lies+in+a+full+and+ample+satisfaction%2C+in%2C+and+with+the+Divine+presence+and+fulness%3A+%E2%80%98Tis+for+a+Soul+to+take+up%2C+in%2C+and+with+the+blessed+God%2C+as+his+only+and+all-sufficient+Portion+and+happiness+for+ever.+God%2C+my+Beloved%2C+is+an+All-sufficient+God%2C+he+asserts+his+own+All-sufficiency%2C+Gen.+17.1.+I+am+God+all-sufficient%2C+%28says+he+to+Abraham%29+q.+d.+I+am+infinitely+sufficient+for+my+self%2C+and+I+am+infinitely+sufficient+for+thee+and+all+my+People%2C+to+make+the+one+and+the+other+happy+for+ever.+God+is+an+inexhaustible+Fountain+of+Light%2C+Life%2C+Love%2C+Blessedness%2C+Perfection+and+Glory%3B+there+is+all+good+in+God%2C+and+he+that+has+God+has+all.+To+him+that+overcometh+will+I+give+to+inherit+all+things%3A+And+how+so%3F+I+will+be+his+God%2C+Rev.+21.7.+He+has+all+good%2C+all+happiness+in+him%2C+and+in+him+we+may+find+all+as+in+its+Fountain-fulness+and+purity.%0A%0ANow+the+Soul%2C+seeing+God+to+be+such+a+God%2C+and+withal+looking+upon+him+as+his+God+in+Covenant%2C+sits+down+satisfied+with+him+alone%2C+saying%2C+I+have+enough%2C+I+have+all%2C+and+so+is+at+Rest+in+him%2C+whether+he+has+much+or+little%2C+any+thing+or+nothing+of+this+world%E2%80%99s+good%3B+whether+the+streams+run+high+or+low+with+him%2C+yet+here+is+a+Fountain+of+infinite+sweetness+and+blessedness%2C+and+he+drinks+there%2C+and+satisfies+himself+there%3B+he+sees+the+Fountain+is+so+full%2C+that+he+needs+not+the+streams+to+make+him+happy%2C+and+accordingly+sits+down+satisfied+therewith%2C+and+is+at+Rest%3A+Thus+David%E2%80%99s+Soul+was+at+Rest+in+God%2C+Ps+l.+16.5%2C+6.+the+Lord+is+the+portion+of+mine+Inheritance%2C+and+of+my+Cup%3A+Well%2C+and+what+then%3F+Why+he+sits+down+at+Rest+in+him%2C+the+lines+%28says+he%29+are+fallen+to+me+in+pleasant+places+yea%2C+I+have+a+goodly+heritage%3B+I+have+enough%2C+enough+for+delight%2C+and+enough+for+satisfaction%3B+I+have+as+much+as+my+Soul+can+wish+or+desire%3B+so+Psal.+17.15.+As+for+me%2C+I+will+behold+thy+Face+in+Righteousness%2C+I+shall+be+satisfied%2C+when+I+awake%2C+with+thy+likeness%3B+in+the+verse+immediately+preceding+he+had+spoken+of+some+whose+portion+and+happiness+is+in+this+World%3B+well%2C+and+pray+David+where+and+in+what+is+your+Portion%2C+your+happiness%3F%0A%0AMy+Portion+is+in+God%2C+and+my+Happiness+is+in+God%2C+%28says+he%29+in+the+sight+of+God%2C+and+in+the+likeness+of+God%3B+let+others+take+up+their+Rest%2C+Portion+and+Happiness+where+and+in+what+they+will%2C+God+is+my+Rest%2C+my+Portion%2C+my+Happiness%2C+my+All+for+ever%3A+as+for+me+I+will+behold%2C+%26c.+Again%2C+the+Lord+lives%2C+%28says+he%29+and+blessed+be+my+Rock%2C+Psal.+18.46.+q.+d.+such+and+such+Comforts+are+dead+and+gone%2C+they+are+not%2C+%28as+Jacob+spake+of+his+sons%29+well%2C+but+however+God+lives+still%2C+I+have+a+living+God%2C+and+he+is+a+living+Happiness%2C+and+that%E2%80%99s+enough.+So+2+Sam.+23.5.+Although+my+House+be+not+so+with+God%2C+yet+he+hath+made+with+me+an+everlasting+Covenant%2C+ordered+in+all+things%2C+and+sure%2C+and+this+is+all+my+Salvation%2C+and+all+my+desire%2C+q.+d.+God+is+my+God+by+Covenant%2C+and+here+is+my+happiness%2C+even+all+that+my+Soul+can+wish%2C+and+accordingly+he+is+at+Rest+in+his+God%3A+And+Psal.+73.25%2C+26.+Whom+have+I+in+heaven+but+thee%3F+and+there+is+none+upon+Earth+that+I+desire+in+comparison+of+thee%3A+my+heart+and+my+flesh+faileth%2C+but+God+is+the+Rock+of+my+heart%2C+and+my+Portion+for+ever.%0A%0AHow+dark+soever+things+looked+with+him%2C+yet+he%2C+looking+to+his+God%2C+was+satisfied+and+at+Rest+in+him%2C+and+with+him%2C+as+infinitely+enough+for+him.+The+Prophet+Habakkuk+resolved+upon+the+same+course%2C+Hab.+3.17%2C+18.+Although+the+Fig-tree+shall+not+blossom%2C+neither+shall+Fruit+be+in+the+Vines%3B+the+labour+of+the+Olive+shall+fail%2C+%26c.+yet+will+I+rejoice+in+the+Lord%2C+I+will+joy+in+the+God+of+my+Salvation%3A+He+supposes+the+worst+that+could+come%2C+and+yet+still+resolves+to+be+at+Rest+in+God%2C+and+that+God+alone+shall+be+enough+for+him%2C+when+all+other+things+fail.%0A%0AThus+the+holy+Soul+sits+down+satisfied+with+God+alone%2C+setting+God%2C+and+an+interest+in+God%2C+over+and+against+all+his+Wants%2C+Losses%2C+Burthens%2C+Difficulties%2C+Temptations%2C+as+one+infinitely+able+to+relieve+and+satisfy+him+under+all%3B+his+language+to+God+is%2C+Lord%2C+let+others+take+the+Word%2C+and+the+good+things+thereof%2C+give+me+thy+Self%2C+and+I+have+enough%3B+run+out+to+broken+Cisterns+who+will%2C+let+me+have+a+free+recourse+unto+the+Fountain%2C+and+I+am+satisfied%3B+%E2%80%99tis+true%2C+the+Tide+of+Creature-comforts+runs+low+with+me%2C+and+on+the+other+hand%2C+the+Waves+and+Surges+of+Affliction+rise+high%3B+but+God+is+all-sufficient%2C+and+I+have+enough+in+him%3B+he+sees+a+little+of+that+glorious+Fullness%2C+Sweetness+and+Blessedness+that+is+in+God%2C+and+hereupon+sings+an+holy+Requiem+unto+himself%2C+saying%2C+Soul+take+thine+ease%2C+thou+hast+Goods%2C+Light%2C+Life%2C+Love%2C+Blessedness%2C+Salvation+enough+laid+up+for+thee+for+many+days%2C+yea+for+the+days+of+Eternity%2C+take+thine+ease%2C+sit+down+satisfied+in+and+with+thy+God+alone%3B+had%E2%80%99st+thou+ten+thousand+Worlds%2C+without+him+thou+had%E2%80%99st+nothing%2C+but+in+him+thou+hast+all%2C+Rest+thou+therefore+in+him.+Thus+you+see+what+%E2%80%99tis+for+a+Soul+to+be+at+Rest+in+God%2C+and+when+he+may+be+said+to+be+at+Rest+in+him.%E2%80%9D%0A%0A%E2%80%94+Edward+Pearse%2C+The+true+rest%3A+or%2C+The+soul%E2%80%99s+rest+in

<main class="wrap"><figure class="quote" id="q-22f2cd884e" data-kw="">
<blockquote><p>Neither the ends of the earth nor the kingdoms of this age are of any use to me. It is better for me to die for Jesus Christ than to rule over the ends of the earth. Him I seek, who died on our behalf; him I long for, who rose again for our sake. The pains of birth are upon me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ignatius-of-antioch.html">Ignatius of Antioch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistle to the Romans</cite>, 6.1 (c. 110–117)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d9efed039d" data-kw="debt enmity crime satisfaction">
<blockquote><p>First, sin, which renders us guilty and hated of God and binds us over as debtors to punishment, may be viewed under a threefold relation either as a debt, which we are bound to pay to divine justice, in which sense the law is called “a handwriting”; or as enmity, inasmuch as it makes us enemies to God and God to us; or as a crime, on account of which we are exposed to condemnation and death. Corresponding to these, satisfaction ought to be a payment of debt, a reconciliation with God, and a propitiatory covering of the crime.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.10.6</span></figcaption>

</figure><figure class="quote" id="q-656fe32bd6" data-kw="">
<blockquote><p>Concerning the story and benefit of our Lord’s resurrection… directing our course as it were by the loadstar of scripture we pronounce by virtue and authority thereof that so precious and inestimable a benefit belongs unto all the faithful, and to them alone; and we exclude the wicked and unbelievers, as long as they remain such, from having any interest therein… The answer hereunto is twofold, either of which is true and sound. First, as often as the Gospel extends the fruit of Christ’s merits and benefits unto all, it must be understood (as says Saint Ambrose) of the whole number of the faithful and elect. For this is the usual and common voice found everywhere throughout the whole course of the gospel… Howbeit there is another answer no less true, wherewith we may satisfy the most contentious wranglers; that Christ died for all men absolutely and without exception to wit, if you respect the sufficiency of the merit, and the price which He paid. It is out of all doubt and controversy that the death of the Son of God is of such weight and worth that it may serve to purge and cleanse the sins not of one world only, but thousands of worlds; if at least all men would apprehend by faith this salve of sin. But the question concerns the efficacy and participation itself of the fruits which we mainly deny to be common to the believing, and unbelieving, or to be generally promised or given in the〈…〉; and we hold it no sound doctrine to 〈…〉 in this respect Christ died alike for all ???? and reprobate… For what slander is there, if this be none. When we distinguish the worth of the merue from the efficacy and participating of the benefits, and restrain according to Scripture and the judgement of the soundest Fathers this participation to the whole number of the faithful alone gathered from amongst the Jews and Gentiles; do we then deny that Christ died for all?… They [opponents] run on still, and say He died for all and every of these not only in respect of the sufficiency of his sacrifice and satisfaction, but also in regard of the efficacy of the same. What means this new device I pray? That forsooth Christ by his death and bloodshedding has truly and effectually delivered from death, purged from sin, sanctified, reconciled unto God, and restored unto his grace and favor by his death and bloodshedding all and every single man, yea even those who are not saved, but have been ever since Caine, etc. are at this day, and shall be hereafter damned… they neither perished, nay perish, nor shall perish, for their sins (whereas they are washed away by the blood of Christ Jesus) but for unbelief alone.</p></blockquote>

0alone&amp;text=Concerning%20the%20story%20and%20benefit%20of%20our%20Lord%E2%80%99s&amp;text=blood%20of%20Christ%20Jesus%29%20but%20for%20unbelief%20alone" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d7af0bea8a" data-kw="">
<blockquote><p>Here Owen appears to waver. On the one hand he allows that punishments may vary provided that the end of satisfying justice is met. On the other hand he seems to make an exception of the atonement, arguing or rather implying that there could not be another mode of satisfaction for sin than atonement by the God-man, the surety who has substituted himself in the room of sinners. Yet he seems to allow the possibility (though one that we are not in a position to know about) that the manner, time etc. of punishment belongs entirely to God, whose counsel we do not know. Which raises the question of why, if punishments in general, in respect of their nature and circumstances, are in the hand of God, why the punishment for sin may not similarly be. And if it may similarly be, even if we have not a clue about what an alternative mode of punishment may be in this case, then the atonement by Christ is not necessary in even the restricted sense that Owen has argued for earlier.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-helm.html">Paul Helm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analysis 13 – Owen’s Option’</cite>, (2008) 17 paragrpahs at Helm’s Deep</span></figcaption>

</figure><figure class="quote" id="q-2382ecf531" data-kw="">
<blockquote><p>For the transgression of my people was he stricken” (lsa. 53:8). “Thou shalt call his name JESUS: for he shall save his people from their sins” (Matt. 1:21). “The Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many” (Matt. 20:28). “The good Shepherd giveth his life for the sheep” (John’ 10:11). “Christ also loved the church and gave himself for it” (Eph. 5: 25). “Who gave himself for us, that he might redeem us from all iniquity, and purify unto himself a peculiar people” (Titus 2: 14). “To make propitiation for the sins of the people” (Heb. 2: 17). Here are seven passages which gave a clear and simple answer to our question, and their testimony, both singly and collectively, declare plainly that the death of Christ was not an atonement for sin abstractedly, nor a mere expression of Divine displeasure against iniquity, nor an indefinite satisfaction of Divine justice, but instead, a ransom-price paid for the eternal redemption of a certain number of sinners, and a plenary satisfaction for their particular sins. It is the glory of redemption that it does not merely render God placable and man pardonable, but that it has reconciled sinners to God, put away their sins, and forever perfected His set-apart ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Gospel of John</cite>, (Zondervan, 1962), 2.219-22 This is early Pink, at his worst. HT: David Ponter | Whenever the Holy Scriptures speak of the sufficiency of redemption, they always place it in the certain efficacy of redemption. The atonement of Christ is sufficient because it is absolutely efficacious, and because it effects the salvation of all for whom it was made. Its sufficiency lies not in affording man a possibility of salvation, but in accomplishing their salvation with invincible power. Hence the Word of God never represents the sufficiency of the atonement as wider than the design of the atonement. How different is the salvation of God from the ideas now popularly entertained of it! “As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein is no water” (Zech. 9:11). Christ, by his death paid the ransom, and made sin’s captives his own. He has a legal right to all of the persons for whom He paid that ransom price, and therefore with God’s own right arm they are brought forth. For whom did Christ die?</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“For the transgression of my people was he stricken” (lsa. 53:8). “Thou shalt call his name JESUS: for he shall save his people from their sins” (Matt. 1:21). “The Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many” (Matt. 20:28). “The good Shepherd giveth his life for the sheep” (John’ 10:11). “Christ also loved the church and gave himself for it” (Eph. 5: 25). “Who gave himself for us, that he might redeem us from all iniquity, and purify unto himself a peculiar people” (Titus 2: 14). “To make propitiation for the sins of the people” (Heb. 2: 17). Here are seven passages which gave a clear and simple answer to our question, and their testimony, both singly and collectively, declare plainly that the death of Christ was not an atonement for sin abstractedly, nor a mere expression of Divine displeasure against iniquity, nor an indefinite satisfaction of Divine justice, but instead, a ransom-price paid for the eternal redemption of a certain number of sinners, and a plenary satisfaction for their particular sins. It is the glory of redemption that it does not merely render God placable and man pardonable, but that it has reconciled sinners to God, put away their sins, and forever perfected His set-apart ones.”

<main class="wrap"><figure class="quote" id="q-722c3c783d" data-kw="">
<blockquote><p>Dr. Girardeau has defended the old usage of our church with a moral courage, loyalty to truth, clearness of reasoning and wealth of learning which should make every true Presbyterian proud of him, whether he adopts his conclusions or not. The framework of his arguments is this: it begins with that vital truth which no Presbyterian can discard without a square desertion of our principles. The man who contests this first premise had better set out at once for Rome: God is to be worshipped only in the ways appointed in his word. Every act of public cultus not positively enjoined by him is thereby forbidden. Christ and his apostles ordained the musical worship of the New Dispensation without any sort of musical instrument, enjoining only the singing with the voice of psalms, hymns, and spiritual songs. Hence such instruments are excluded from Christian worship. Such has been the creed of all churches, and in all ages, except of the Popish communion after it had reached the nadir of its corruption at the end of the thirteenth century, and of its prelatic imitators.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Review of Girardeau on Musical Instruments</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-ea9285199b" data-kw="">

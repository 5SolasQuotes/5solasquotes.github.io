</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-484a5b2321" data-kw="">
<blockquote><p>We distinguish of admission: It is either negative or positive; negative, is nothing else but a non-hinderance; and though there be no eldership, the minister may not hinder those whom he has no power, I mean no lawful authority to hinder. Now the minister singly by himself has no authority to hinder, keep back, or cast out scandalous persons: for so the power of jurisdiction would be seated in him alone. But now secondly, there is an admission that is positive, judicial, and implies a previous forensical examination by the eldership, as of the parties admitted, so sometimes of witnesses, and authoritative declaration of fitness: And this is to be only in collegio presbyteriali, in the college of presbyters, and properly as they are in court, but not seperatim [separated], and out of court. Now I conceive that this juridical and authoritative admission is not of absolute necessity unto administration of the Lord’s Supper. By baptism the baptized are admitted or entered into the Church-visible, 1 Cor. 12:13, ‘By one Spirit we are all baptized into one body.’ See Rutherford in his Due Right of Presbyteries, [pt. 1, ch. 9, section 9, point 7] p. 254[-55]. Now in some cases the Lord’s Supper may be administered unto those of years that are baptized without any new authoritative judicial admission of the eldership. First, this may be gathered from Acts 2:41-42. Those three thousand souls whose baptism is mentioned, verse 41, have their receiving of the Lord’s Supper recorded, verse 42, and there is not a word of any juridical admission of them by the eldership coming between their baptism and their receiving of the Lord’s Supper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want of Church-Government</cite>, … (London, 1650), p. 28 Jeanes was an English presbyterian.</span></figcaption>

</figure><figure class="quote" id="q-d4defa13d0" data-kw="">
<blockquote><p>Profession of Christianity is every man’s Church-title. No man is to prove the sincerity of his own profession; nor may the Church require such proof at his hands; For how can a man prove to another the sincerity of his own heart? But the fuller testimony he gives of it, the better it is: And therefore none should refuse to make his own profession, as fully credible to the church as he is able; nor is the church to be blamed for enquiring after the fullest credibility, so be it they do it but ad melius esse [to the better existence], and not ad esse [to the existence of it]; not laying his title upon it, nor refusing him for want [lack] of it. But every profession as such is credible in some degree, which is not disproved. Because men are, under God, the only competent judges of their own hearts: and the belief of one another is the ground of human converse: And it is an injury to any man to account him a liar, without sufficient proof. He that will disprove a man’s profession must prove first that he does not tolerably understand what he says; secondly, or that he speaks not seriously, but in jest; or not voluntarily, but in hypocrisy by constraint, or for some by end: Thirdly, or that he contradicts his own words by some more credible words or deeds. And if you never yet thus disproved men’s profession of Christianity before the pastors of the church and yet cry out against the pastors for admitting them, you are not true reformers, but disorderly mutineers and peevish censurers in the Church of Christ. Christ’s orders and men’s right, and all church-justice, must not be trodden down and sacrificed to your humor and arbitrary way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 16, pp. 112-13</span></figcaption>

</figure><figure class="quote" id="q-f72e0777f9" data-kw="">
<blockquote><p>For as a Relation unto a particular visible Church walking according to the Order and Rule of the Gospel, is the Duty of every Believer to give himself up unto; as that which is a means appointed and sanctified to the furtherance of his Edification and Salvation; so where it cannot be obtained through invincible outward Impediments, or is omitted through ignorance of Duty, or is on just Causes refused where opportunities make a tender of it; or where the being and benefit of it is lost through the Apostasie of those Churches whereunto any persons did belong, the utter want of it, and that alwayes, is not such as necessarily infers the eternal loss of their Souls who suffer under it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious</cite>, … (London, 1672), ch. 3, pp. 83-84</span></figcaption>

<main class="wrap"><figure class="quote" id="q-92725e41e9" data-kw="">
<blockquote><p>We are personally separated from the Established Churches of the country, although as Christians and patriots we cannot cease to feel an interest in them, and although we still hold, I hope, and I am glad to observe from both the motions, that we avow our holding the principle of the right and duty of the State to maintain an ecclesiastical establishment of the truth.

Let me, moreover, state at the outset the precise difference, as it appears to me, between the two motions which are to be submitted to the House. Both the motions, as I have intimated already, seem to indicate that we still resolve to maintain the principle of an ecclesiastical establishment, as hitherto forming part of the testimony of our Church. We also are unanimously of opinion, as appears from the motions, that we should deprecate the endowment of Popery as the greatest public calamity that could befall the country. (Hear, hear.)

We are totally opposed to indiscriminate endowments of truth and falsehood, and the difference between the two motions—although it is a very wide difference after all—is this, that in the one motion a decided opinion is given upon the present state of matters and the political questions involved—an opinion, as I think, unwise and inconsistent with our principles; while in the other motion principles are stated, but an attempt is made to prevent our Church from assuming a mere party and political aspect by giving any unwise opinion as to the practical application of our principles, to the very difficult circumstances in which Ireland is placed, beyond this, that the Government is bound to support the truth of God in that land.

It is maintained on the other side that there is no alternative on the part of the Government, but either to support all bodies or to support none; and it is inferred that since it is better to support none than to support all, we ought to give it forth as our opinion, that this is the alternative which the statesmen of our country should at present adopt. Now, this is plausible but fallacious, for, in the first place, I do not admit that we are driven to any such alternative as this of supporting all or supporting none—(hear, hear)—I do not think we are entitled to tell statesmen that that is the alternative to which they are driven, or ever can be driven. (Hear, hear.)

For my part I cannot see that, as men interpreting the Word of God, we are ever entitled to say to statesmen that they are put, or can be put, into a position in which they have merely to choose between two evils, the promotion of truth and falsehood alike, or an entire abstinence from any support of the cause of Christ. There is surely always a third alternative, viz., to do what is right.

And then, in the second place, I do not believe, in opposition to loud assertions to the contrary, that the measures which are in progress and which we are called upon to support, have in the slightest degree the tendency to advance Protestantism. On the contrary, I think I shall prove that they have a direct tendency to promote Popery, and that if we shall throw ourselves into the revolutionary stream which seems now to be running so strongly, we shall to all appearance simply be aiding in the restoration of the influence of a system which was so successfully resisted and overturned by our ancestors at the Reformation, and at the Revolution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Proposed Disestablishment of Protestantism in Ireland. In its bearing upon the Religion and Liberties of the Empire</cite>, (Edinburgh: James Nichol, 1868), pp 5-7.</span></figcaption>

<blockquote><p>Although the question of whether or not the penalty for restitution was of perpetual obligation was debated among the early Reformed, the Puritan William Ames argued that the Mosaic Law against theft remains valid – even though it is not repeated in the New Testament:

That is less which is objected, that the Law of Moses concerning the punishment of theft, is no where found to be repeated, and confirmed in the new Testament, and therefore that it was merely political and judicial. For they themselves grant, which are of the contrary opinion those Laws of Moses to be universal and perpetual, which have a universal and perpetual cause and reason, and not a particular belonging to the Jews; and they can bring no special reason, but it is a ridiculous one of the kindred, and affinity of the Israelites among themselves: which reason can take no place in strangers, who notwithstanding were not punished capitally for a simple theft; and if that reason did avail against the capital punishment of thieves among the Israelites, it would have availed also against the capital punishment of other faults.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the power and cases thereof</cite>, (London, 1643), pp 263-4.</span></figcaption>

<blockquote><p>God can serve Himself of nothing, yea, that there are not created, locusts, caterpillars more numerous than that all the fruits of the earth can be food to them, preach the glory of the Lord’s goodness to man, and what are never to be, no less than all things that have futurition [come into being], or shall come to pass either absolutely or conditionally, are under the positive decree of God, else we should not owe thanks to the Lord for many evils that never fall out, that the Lord turns away violent death, violence of men and wild beasts, and many possible mischiefs, contrair to Deut. 28:11-12; Lev. 26:6; Ps. 34:20; Ps. 91:5-8. And all these beings or no-beings owe themselves to God to hold forth the glory of goodness, wisdom, mercy, justice, etc. suppone [suppose] there had never been sin: Far more now, who wants matter of meditation, or can write a book of all the pains, achings, convulsions, pests, diseases that the Lord decreed to hold off? so that every bone, joint, lith [limb], hair, member, should write a Psalm Book of praises, Ps. 35:10, ‘All my bones shall say, Lord, ‘Who is like unto thee?”</p></blockquote>

<blockquote><p>It is an indispensable duty to forgive; we are not bound to trust an enemy, but we are bound to forgive him… It is with going to law as it is with going to war; when the just rights of a nation are invaded, it is lawful to go to war; so when a man’s estate is trespassed upon by another, he may go to law to recover it. But the law must be used in the last place; when no entreaties or arbitrations will prevail, then the chancery must decide it. Yet this is no revenge, it is not so much to injure another, as to right one’s self, which may be, and yet we may live in charity.</p></blockquote>

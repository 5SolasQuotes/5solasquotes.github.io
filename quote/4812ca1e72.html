<main class="wrap"><figure class="quote" id="q-4812ca1e72" data-kw="">
<blockquote><p>But it is obvious that it is repugnant, not only to the laws of pious emperors, but also to the law of God and of nature and to every law of nations, that children who are in the power of their parents do or attempt anything of great moment outside the knowledge and will of the parents, much less emancipate themselves completely from the power of their parents and withdraw themselves from their control, as occurs in matrimony.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Reign of Christ in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (1550; 1557; Philadelphia: Westminster Press, 1969), bk. 2, ch. 18, ‘Marriages should not be held valid which are contracted without the consent of those who have power over the ones who make the contract, or without suitable advisors’</cite>, p. 320</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>
<div class="actions"><button class="copy" data-copy="“But it is obvious that it is repugnant, not only to the laws of pious emperors, but also to the law of God and of nature and to every law of nations, that children who are in the power of their parents do or attempt anything of great moment outside the knowledge and will of the parents, much less emancipate themselves completely from the power of their parents and withdraw themselves from their control, as occurs in matrimony.”

— Martin Bucer, On the Reign of Christ in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (1550; 1557; Philadelphia: Westminster Press, 1969), bk. 2, ch. 18, ‘Marriages should not be held valid which are contracted without the consent of those who have power over the ones who make the contract, or without suitable advisors’, p. 320">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+it+is+obvious+that+it+is+repugnant%2C+not+only+to+the+laws+of+pious+emperors%2C+but+also+to+the+law+of+God+and+of+nature+and+to+every+law+of+nations%2C+that+children+who+are+in+the+power+of+their+parents+do+or+attempt+anything+of+great+moment+outside+the+knowledge+and+will+of+the+parents%2C+much+less+emancipate+themselves+completely+from+the+power+of+their+parents+and+withdraw+themselves+from+their+control%2C+as+occurs+in+matrimony.%E2%80%9D%0A%0A%E2%80%94+Martin+Bucer%2C+On+the+Reign+of+Christ+in+Melanchthon+%26+Bucer%2C+ed.+Wilhelm+Pauck+%281550%3B+1557%3B+Philadelphia%3A+Westminster+Press%2C+1969%29%2C+bk.+2%2C+ch.+18%2C+%E2%80%98Marriages+should+not+be+held+valid+which+are+contracted+without+the+consent+of+those+who+have+power+over+the+ones+who+make+the+contract%2C+or+without+suitable+advisors%E2%80%99%2C+p.+320&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4812ca1e72.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4812ca1e72.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/family/quotes-on-the-authority-of-fathers-in-giving-away-their-daughters-in-marriage/#:~:text=But%20it%20is%20obvious%20that%20it,their%20control%2C%20as%20occurs%20in%20matrimony&amp;text=But%20it%20is%20obvious%20that%20it%20is%20repugnant&amp;text=themselves%20from%20their%20control%2C%20as%20occurs%20in%20matrimony" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e387a2a2b1" data-kw="">
<blockquote><p>O but we are covetous and soul-thirsty after our own will in the matter of soul-manifestations; either I see little here, or we idol comforts, and would gladly have a Christ of created grace, rather than Christ, or his grace; and when we are thirsting for Christ, it is his comforts, the rings, jewels, bracelets of the Bridegroom, we sick after, rather than Himself; its not an unmixed, nor a poor marriage-love, to marry the riches and possessions, and not the person,</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing All Men to Himself (1647)</cite>, p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-537c63a515" data-kw="">
<blockquote><p>The very ground of this assertion of master [Robert] Bellarmine’s [a Romanist], is that he thinks not the copulation of married folk to be of the substance of matrimony. And this he proves by some testimonies out of the fathers in that fifth chapter. But yet himself will not [have] that this his saying should be so understood as if that he said that the use of marriage is not any way of the substance of marriage. For afterwards he says that this their sacrament may have two respects. As it is made, and as it is continued. As it [is] made, that is, (if I be not deceived) as the mutual consent of parties joines them together by their promises, the consent expressed by such words, is the matter and form of their sacrament. And thus must we understand that common rule in their law, that consent makes marriages. And thus do the fathers understand that which they say concerning the substance of marriage to consist in the mutual consent: partly, because after such consent given, the parties are not free to change the choice which they have made: and partly because that even by God’s law, if parties after such consent given, should carnally know another, it was death for them so to do: which could not be, but because this their consent is after a sort the marriage itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-bunny.html">Francis Bunny</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth &amp; Falsehood: Or a Comparison between the Truth now taught in England &amp; the Doctrine of the Romish Church… (London: Sims, 1595), ch. 19, ‘Of Matrimony, that it is not a Sacrament &amp; that it is Lawful for all’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>
<div class="actions"><button class="copy" data-copy="“The very ground of this assertion of master [Robert] Bellarmine’s [a Romanist], is that he thinks not the copulation of married folk to be of the substance of matrimony. And this he proves by some testimonies out of the fathers in that fifth chapter. But yet himself will not [have] that this his saying should be so understood as if that he said that the use of marriage is not any way of the substance of marriage. For afterwards he says that this their sacrament may have two respects. As it is made, and as it is continued. As it [is] made, that is, (if I be not deceived) as the mutual consent of parties joines them together by their promises, the consent expressed by such words, is the matter and form of their sacrament. And thus must we understand that common rule in their law, that consent makes marriages. And thus do the fathers understand that which they say concerning the substance of marriage to consist in the mutual consent: partly, because after such consent given, the parties are not free to change the choice which they have made: and partly because that even by God’s law, if parties after such consent given, should carnally know another, it was death for them so to do: which could not be, but because this their consent is after a sort the marriage itself.”

quotes.github.io%2Fquote%2F537c63a515.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/537c63a515.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/family/marriage/#:~:text=The%20very%20ground%20of%20this%20assertion,after%20a%20sort%20the%20marriage%20itself&amp;text=The%20very%20ground%20of%20this%20assertion%20of%20master&amp;text=consent%20is%20after%20a%20sort%20the%20marriage%20itself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c7d77a0489" data-kw="">
<blockquote><p>That power is given by the Presbyteries’ act of ordination, by order of nature, before the people’s formal act of election: As the husband who in a lapidaries shop chooses a gold ring for his wife, and puts it on her finger, presupposes it was a gold ring before his choosing thereof, neither does his choosing thereof make it a gold ring, but only makes it his wife’s gold ring by application to her: Just so, peoples election appropriates such a man who is already a pastor to such a charge, but does not make the pastor a pastor, but chooses him only to be their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea (1642), ch. 17</cite>, p. 267</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-d438eb661d" data-kw="">
<blockquote><p>…for as the woman is independent in regard of intrinsic power of consenting or dissenting in point of marriage, the parents’ directive power of extrinsic commanding, as the judicious [congregationalist] Prefacers say… How are [ecclesiastical] leaders and overseers [according to congregationalism,] in the same managing of censures, equal in power, and not above those whom they lead and oversee, yea, to whom they are to yield obedience, as Mr. Hooker cites to that purpose the place Heb. 13:17? Are parents equal in power who do command the virgin, whose it is to consent to the marriage?</p></blockquote>

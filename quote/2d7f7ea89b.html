<main class="wrap"><figure class="quote" id="q-2d7f7ea89b" data-kw="">
<blockquote><p>We have been almost afraid to speak of the Scottish covenanters, and the tales of their sufferings which once hallowed the converse of Presbyterian firesides, and contributed to nurture the piety of the young, are now almost unknown to their ungrateful descendants. The caricatures of a [Sir Walter] Scott have tended to make their memory contemptible in the estimation of fashionable prejudice and ignorance; and the general consent with which Presbyterians have suffered the green damp moss to obliterate their names from their mouldering monuments, has tended to deepen the unfavourable impression so agreeably and facetiously imparted.

The noble “Vindication” of Dr. [Thomas] M’Crie is perhaps little known in the circle where its influence is most required. It is interesting, however, to think that still the fine arts may be made available to rescue the names of the “Worthies” of the Covenant from the reproach with which they have been so unjustly burdened. The general circulation among the ranks of taste and fashion, of the beautiful engravings of Harvey’s paintings of the ‘Covenanter’s Baptism,’ the ‘Preaching,’ and the ‘Battle of Drumclog,’ cannot fail to awaken an interest of tenderness and of sympathy, which will at least mitigate the severity of the judgment which an ill- informed and prejudiced posterity has passed upon, them. That sect of Presbyterians alone which continues to bear their name, has maintained a uniform advocacy of their character and regard for their names, while they have been honoured to bear no small share of their reproach.

The late commemorations in Edinburgh, Glasgow, and Derry, celebrating Scotland’s deliverance from the yoke of prelacy, have given no unequivocal signs of a reviving sympathy with the spirit, and admiration of the deeds of the Scottish Covenanters. They have demonstrated that the old spirit of witness-bearing is ready to stand forth the same stalwart form as when it bore the renowned standard of “Christ’s Crown and Covenant” in the day of battle and of blood. Laud and Sharpe, the relentless persecutors of our noble fathers, have found biographers in our own day, who have masked them as saints and martyrs, for exhibition before a generation who have been suffered to remain in ignorance of their real characters. Let us not continue longer an unjust neglect of the memory of the righteous, while it is daringly attempted to transfer the fair fame which is theirs, to their betrayers and murderers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-wallace.html">Henry Wallace</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introductory Essay in Presbyterianism Defended, and the Arguments of Modern of Prelacy Examined and Refuted, in Four Discourses, by Ministers of the Synod of Ulster</cite></span></figcaption>

<blockquote><p>Here [London] you may likewise see a Reverend Assembly of grave and learned Divines, who daily wait upon the Angel in the Mount, to receive from him the lively Oracles, and the pattern of God’s house, to present unto you. All these are of our own Nation; and with them you may see the Honourable, reverend, and learned Commissioners of the Church of Scotland; and in them behold the wisdom and affection of their whole Church and Nation, willing to live and die with us.

All these you may behold in one view; and which is more, you may behold them all of one heart, and one mind, after so many plots and conspiracies to divide them one from another, and thereby to ruin them all: And which is yet more, you may see them all met together this day on purpose, both to praise God for this union, and to rejoice in it, and to hold it out to all the world, and thereby to testify, that as one man they will live and die together in this common cause of God, of our Lord Jesus Christ, his Church, and these three kingdoms. O beloved! how beautiful is the face of this Assembly?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-marshall.html">Stephen Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sacred Panegyrick, or A Sermon of Thanksgiving, Preached to the two Houses of Parliament</cite>, (London: Stephen Bowtell, 1644), pp 2-3.</span></figcaption>

</figure><figure class="quote" id="q-55acd10433" data-kw="">
<blockquote><p>I will not say but sometimes it may be meet to discover the least error, and it may be by circumstances so aggreged that it may be needful judicially to take notice of it, as when it’s involved with offence and ready to breed schism or scandal, or in such like cases (in which respect there are some things mentioned in the decree, Acts 15, which are not very material in themselves, as the eating of things strangled) yet, we say, it is not simply and always necessary for ministers to press at the convincing of all who maintain something different from truth, or which is supposed to be so by them, if it be of things extra-fundamental, or, which have not direct or palpable influence upon the violating of faith, or corrupting of manners, much less to censure for the maintaining of it. For, it is not of such that these epistles speak: and we see, Rom. 14, and in the epistles to the Corinthians, in the debate about meats and eating of things sacrificed to idols, and such like, wherein though there was still a right side and a wrong, yet does he rather press the forbearing of these debates, than the dipping into them, not astricting men always to follow this or that, providing it be done without breach of unity and charity. Hence it is that although there be somethings he will give no forbearance unto, but authoritatively and ministerially he decides in them, yet in the same epistles there is something amongst the saints that he seeks rather to heal, and to obtain mutual forbearance in, than peremptorily to decide. See Rom. 14:1; Cor. 8:2-3, etc.; Phil. 2:3. … …there may be somethings truly errors that may and should be forborne [tolerated] in themselves, yet their consequents ought not to be forborne, and this also may be at one time, and in one Church more necessary to be adverted to than in another, because consequents of schism, faction, division, etc. may sometimes follow on the meanest [the least] errors. And seeing these are always enemies to edification, even when they arise from the least ground, they are never absolutely to be foreborne; for to say, I am of Paul, and I am of Apollos, and for one to think such a man a better preacher than another, seems to be no great matter; yet when it begins to rent [tear] them, and to make factions in Corinth, it is not to be forborne, but to be reproved: And in the former difference of meats, the apostle condemns always the offence and schism that followed on it, although he did not peremptorily decide anything as to men’s practices, or censure for the opinion itself… Thus the differences and errors concerning Church-government by bishops, and in the Congregational way, may, we conceive, in themselves be forborne in persons where they are not vented to the shaking and drawing away of others; but if pressed in practice, to the renting of a Church, and preferred or equalled to the true government that is established by the Word, in that case they are not to be foreborn, because then truth is to be vindicated, and obstructions to edification in the renting or distracting of a Church to be removed, and at one time more than at another, as such an offence does waken a schism, and disturb order and union in one Church or at one time more than another: hence we see, Acts 15, some things are put in that decree in reference to that time, only for preventing of schism and scandal…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on Scandal</cite>, (1659), ch. 8, ‘When Some Errors are to be Foreborn’, pp. 202-3 &amp; 205-206</span></figcaption>

d10433.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/55acd10433.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-fundamental-secondary-tertiary-teachings-of-christianity/#:~:text=I%20will%20not%20say%20but%20sometimes,for%20preventing%20of%20schism%20and%20scandal&amp;text=I%20will%20not%20say%20but%20sometimes%20it%20may&amp;text=time%2C%20only%20for%20preventing%20of%20schism%20and%20scandal" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I am fully assured that God does not, and therefore that men ought not to, require any more of any man than this, to believe the Scripture to be God’s Word, and to endeavor to find the true sense of it, and to live according to it.</p></blockquote>

<blockquote><p>Schism is either a rash or an unjust separation upon the account of religion. It is with schism, as with error: a light error continued in with obstinacy becomes heresy. So there is a schism which may not be called unjust, but only rash, being grounded on a light cause; but if pertinacy be added, when the levity of the cause does appear, it becomes truly, and [Greek] an eminent schism. This rash schism may be known, either (à priori) from its previous cause, for no man being compelled to it (if we will speak the truth), it proceeds from self-love, therefore also hatred follows upon it. Nor would any rash schism be made if we had charity, which is the most perfect bond and is not easily provoked, and thinks no evil. It is therefore a manifest note of hatred, which hatred may arise either from an offence really given or only taken; as when a man is grieved that another is preferred before him. Again, a schism is made rashly either by the chief authors upon a light occasion, as if when an ulcer does appear upon any member, the surgeon should presently think of cutting off that member without applying other means, or expecting what nature may do. But we may suppose that the schism be made upon the occasion of heresy, and then the separation may be thought to be just and not rash. To which I answer: That as judges, who in too great passion do condemn a malefactor that is really guilty, may be unjust, because they are acted rather by a certain ferity of mind than by the love of justice: so that separation, which proceeds from hatred, though it may have just causes, yet is unjust. Again, the rashness of separation appears, à posteriori, when it is made on a light occasion, that is, where there is not a great and intolerable persecution, nor heresie, nor idolatry. For, first, if the persecution be tolerable, that is, if it do not concern our lives or things necessary thereunto, we may not catch at an opportunity of departing: for as they that delight in a civil war, though they have the better cause, and just occasions, yet because they are glad of such occasions, they are murderers and enemies of their country. 2ly, separation is rash if the error in the Church from which he departs be neither heresie, nor superstition: for if the error be tolerable, as a superstitious rite may be, we may not separate; as a sick man is not to be forsaken unless his disease be deadly and contagious, and then not without grief. Lastly, separation is rash when it is made because of corruption of manners, to which purpose our Savior said, ‘They sit in Moses’s chair, therefore do whatever they say unto you.’ [Mt. 23:1-3] This is the meaning of our Savior: Wherever the purity of doctrine does remain, there God has a Church, though overspread with many scandals. Now an unjust Schism is that, which is made where there is no persecution or heresy, no error, superstition, or idolatry, none, or but few scandals; such was the schism of the Donatists. And this is the greatest degree of schism: and it is either negative, which is a bare departure only, without gathering of new congregations; or positive, when another Church is erected, which does separately use ecclesiastical laws, and the administration of the Word of God and sacraments, which the Scripture calls setting up of altar against altar [2 Kn. 16:10-16; Hos. 8:11; 10:1-2]; for, though a peaceable departure from the Church may be lawful and just, yet if new associations be entred into, it is unjust; for this cannot be done unless there be real hatred between brethren, contrary to Christianity; for the end of the commandment is charity. It must therefore be considered again and again whether the cause of this separation be of so great moment as that the glory of God and salvation depends upon it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Schism, p. 322 in The Character of a Separatist, or Sensuality the ground of Separation… (London, 1677), Picture &amp; Character of a Separatist, pp. 23-25 Cameron (c. 1579 – 1625) was a Scottish theologian, professor and formalist.</span></figcaption>

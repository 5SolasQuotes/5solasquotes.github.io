</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5caa5bb914" data-kw="">
<blockquote><p>There are some general obscure threatenings annexed to the prohibitions in the Law of Nature; that is, Nature may discern that God will punish the breakers of his Law, but how, or with what degree of punishment it cannot discern: Also it may collect that God will be favorable and gracious to the obedient: but it neither knows truly the conditions, nor the nature or greatness of the reward, nor God’s engagement thereto. Therefore as it is in Nature, it is a mere Law; and not properly a Covenant. Yea to Adam in his perfection, the form of the Covenant [of Works] was known by superadded revelation, and not written naturally in his heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification</cite>, … (Hague, 1655), thesis 3, pp. 9-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works/nature-of-the-covenant.html">Nature of the Covenant</a></span></div>

</figure><figure class="quote" id="q-efc3c1fb98" data-kw="">
<blockquote><p>For you [a Romanist] say that that privation which Adam contracted by sinning, we, by being born, although it is a sin, is yet not our sin nor proper to us, unless because what Adam did when he sinned, we also did, the apostle saying, “In him all have sinned.” [Rom. 5:12] And this also I acknowledge. For his will was ours; and therefore his transgression is ours, because he is not considered as one man, but as the root of the human race, in whom we were all included by virtue [in potency or in power], as Augustine says, “we were all that one man” (De pecc. merit. &amp; remiss., bk. 1, ch. 10). But now original sin does not consist only in the deformity which the fault of Adam brought forth, but it also comprehends the act of that sin itself, if we did the same as Adam did, if we truly sinned with Adam, and what he willed, we willed. Original sin will therefore not be so involuntary as you think, so that it is therefore the least of all sins because it has the least of that which is voluntary. For if Adam’s will was ours, as much as Adam willed, so much are we also to be thought to have willed. But Adam sinned knowingly and willingly; we therefore in him, and by that his will, both have sinned and willed to sin. But unless you admit imputation here (a word from which you abhor and carefully guard yourself), you will fall into the greatest absurdity, and you will fight with yourself, you who a little before said that the sin which entered into the world, and by which we are all made sinners, is not the actual sin of Adam, but a certain iniquity contracted from it and transmitted into us. Now you attribute to us the same will of sinning which was in Adam; otherwise, you affirm, this privation left in nature by sin could not make us sinners. Therefore, we are not only bound by a habitual iniquity, but we have sinned with an actual will in Adam; and this will is primarily to be considered in original sin, without which we could neither be nor be held as sinners. What you [Bellarmine] interpose concerning a pact or precept pertains nothing to the matter; for whether Adam received this justice on this law and condition, that he should either preserve or lose it for himself and his own, or whether no such convention intervened between God and Adam, since he was the parent and origin of the nature and of the human race, it was necessary that in him we either stand or fall. Although, that God threatened him with death if he should move his hand to the forbidden tree, from this it sufficiently appears that he had been forewarned of the danger into which he would cast himself headlong if he should sin, of which nothing was to be feared if he should remain in his duty. And hither is wont to be brought what we read in the prophet: “But they like Adam have transgressed the covenant” (Hos. 6:7). Nor is it to be thought that Adam was ignorant either of the reward, if he should not sin, or of the punishment, if he should dare to sin. Unless this had been foretold to him, he would have had some excuse, although not a sufficient one; now, having been taught before of the event, since he did not have faith nor take care for himself, he is to be thought to have deservedly fallen into this calamity. Although, however, there had been no word on this matter, yet what unhappiness he willingly brings upon himself, God has justly inflicted upon all his posterity. But in what way? Because His will is the norm of right and of justice. You will never otherwise understand it to have been just that we are all born miserable on account of the temerity, or infidelity, or ambition, or whatever fault of the first man. For that you say his will was ours, and we willed in him, I confess to be true, but the reason for this truth is none other than the will of the creator. For what cause will you bring [on your view] why all children do not in the same way atone for the faults of their parents? You will say that Adam is to be considered as the seed and principle of nature, and his sin was the sin of nature itself; the sins of others are personal; therefore his is transfused with nature, not those of others. I hear, and I do not object. But why Adam by sinning destroyed not only his person but nature, when other men harm their own persons but do not make nature worse, assign a cause, if you can, other than the most just will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin</cite>, … (d. 1595; Legat, 1600), bk. 1, ch. 7, pp. 25-26 trans. AI Latin</span></figcaption>

<blockquote><p>But, whether that covenant [of works] was also entered into with the second Adam is more difficult to determine. Certainly from one perspective, as a creature and as man, it seems that He cannot be exempted from the moral government of God, nor otherwise could He as a man have merited anything for Himself. From another perspective, if He were in Adam under the covenant of nature, then it would seem that in and with Adam who sinned, He violated that same covenant, which is beyond absurd. Therefore it seems most safe to state: although as a rational creature He cannot be exempted from moral government with respect to his natural duties, yet He could have been withdrawn by God from the same moral governance in the positive duties, such as the commandment not to eat of the forbidden fruit (upon the transgression of which the sin of the human race hangs). Thus that this moral government was brought upon Him just as upon the rest of Adam’s posterity, according to the intention of God, we do not believe, because: (1) He had been designated by the eternal decree to be the second Adam (1 Peter 1:20; Rom. 5:12ff.), and it is unfitting that the second Adam should have been included with the first Adam in the same covenant, indeed included in him. I need not add that: (2) none were included except those that were to exist from the order of second causes; but the Savior, before sin, was not to exist from the order of second causes. Nor also: (3) can one for whom it is absolutely repugnant to sin be considered to have sinned in another, since it is entirely impossible for the God-man to become a sinner.</p></blockquote>

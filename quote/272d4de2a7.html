<blockquote><p>But we teach that Faith, Works, and Perseverance are posterior to Election; that this is the cause, root, fountain, whence all grace in us does flow; that our Election hath no Antecedent cause, condition, or good quality on our part, but flows merely from God’s good pleasure, and mercy looking upon us, lying in our blood, corrupted with original sin, and in that case choosing us of his free mercy to be members of his Son, to whom he will give grace and glory, though others as good and nothing worse than we are permitted to lie still in the mass of corruption for the glory of his mercy to us and justice towards them, without any ground of gloriation to the one, or complaint to the other, as if any wrong were done them, when they are past by.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scotch Antidote Against the English Infection of Arminianism</cite>, (London: Samuel Gellibrand, 1652), pp 24-26.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election.html">Election</a></span></div>

<blockquote><p>II. Both you and I hold, and must hold, that God decrees to damn all that shall be damned. But it is false that we hold that He does it without any respect to foreseen sin. (Vasquez on Thomas, pt. 1, quest. 23, art. 3, p. 709, Conclusio (quod Deus aliquos reprobat) est de fide constat enim ex scriptura multos a Deo reprobari [The conclusion (that God reprobates some) is of the Faith, for it is evident from Scripture that many are reprobated by God.”]. See Ruiz, On Predestination, tract. 2 through the whole) For:

      1. He foresees this sin as the only meritorious cause of their damnation; what He does in time, that is it which He decreed to do from eternity: But in time He damns no man but for sin; therefore from eternity He decreed to damn no man but for sin: For sin, I say, as the cause of damnation, which Dr. Twisse does frequently profess.

      2. And though this sin can be no proper efficient cause of God’s volition or decree, yet it is a presupposed necessary qualification in the object, as foreseen in the mind of God, and so, as aforesaid, is an objective cause as foreseen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, p. 9</span></figcaption>

<blockquote><p>If you say that though such righteousness in Saul was no moving cause to God to give him saving grace: in like manner I say that no sin in Pharaoh was a moving cause in God to deny him saving grace: For if it were, then either by necessity of nature, or by the constitution of God. Not by necessity of nature; for undoubtedly God could have pardoned this sin of his, and changed his heart, as well as he pardoned the sins of Manassah, the sins of the Jews in crucifying the Son of God, Acts 2, the sins of Saul in persecuting God’s saints; and changed all their hearts. Nor by any constitution of God; for show me if you can any such constitution of God. And if you would but explicate wherein the hardening of Pharaoh did consist, I presume it would clearly appear that the mere pleasure of God’s will is the cause of it; like as it is the mere pleasure of God that He does not harden others in like manner… … All confess that God is not the cause of hardness of heart in any man, but man being born in hardness of heart, Eze. 36:31[?]. God is said to harden, not infundendo malitiam, sed non infundendo gratiam [not by infusing malice, but by not infusing grace]: By leaving him thereunto, whereby it comes to pass that naturally it is increased, especially in case a man be moved to courses contrary to his corrupt humors, whether by God’s Word, or by his works, and God does not by grace correct those corrupt humors which are so contrariant to good motions; good motions, I mean such as have their course only in the way of instruction and persuasion; In this case, thus to move and to deny grace is to harden. But when God does forbear thus to move, and gives men over to follow the swing of their own lusts, this I confess is to harden in greater measure, and properly a punishment. But this was not the manner of Pharaohs hardening. For long after the ninth chapter of Exodus we read how God continued to admonish Pharaoh by his servant Moses to let his people go; neither ceased He this discipline till the ten plagues or nine of them at the least were fulfilled. And like as to shew mercy is not to move only to obedience, but effectually to work men to obedience, so the hardening of man in opposition thereunto, consists not in not moving unto obedience, but rather in not working unto obedience, although they be moved thereunto both in the way of instruction and exhortation. As for the punishing of sin with sin in the hardening of the creature, let us understand ourselves aright, and not confound ourselves when we need not. Is it a sober speech to say that God punishes his denial of grace with denial of grace? or that God punishes the sins of the heathen with the denial of that grace, which they never enjoyed? But as for the punishing of sin with sin, this is a large field of God’s providence, consisting in diverse kinds, and it is no way fit to consider them without distinction. God made the unnaturalness of Senacherib’s sons a scourge to chastise Senacherib’s unnaturalness towards God; one mans sinful act to be the punishment of another’s. Here is one kind utterly distinct from that you treat of. Again, some say (and I think justly) and Augustine acknowledges it, that every man’s sin may be a just punishment unto him in respect of a former, as Rom. 1:25. When men for their idolatry were given over to vile affections, to defile themselves in abominable manner, it is said that herein they received in themselves, such recompence of their error as was meet. So 2 Thess. 2:10-11, because men received not the truth of God with love, God is said to send them strong delusions that they should believe lies. …For to punish is either to inflict evil, which formerly they suffered not, or to withdraw some good which formerly they enjoyed… we see hereby apparently how God can punish sin with sin in this kind, not by denial of grace which they never enjoyed, but by denying some outward means of grace which formerly they enjoyed. And withal it appears that this is nothing to our present purpose, who treat of obduration as it consists in or is joined with the denial of saving grace, in proper opposition to the showing of mercy or affording saving grace… I say also that God’s punishing consists in denying, or not maintaining some kind of grace, or rather not so much to be called grace as a natural restraint, not from sin in general (for that cannot be but by saving grace), but from some sins in special, which are foul in the judgment of a natural man’s conscience; such as are those unnatural defilements the apostle speaks of, Rom. 1. Now God in a natural manner restrains men from such excess, either for fear of shame of the world or by reason of some natural detriment that may arise thereby, or by the ministry of his angels restraining the temptations of Satan in this kind; And it is found by experience that Nemo repente fit turpissimus, but they grow to extremes by degrees, and the longer a man lives, the worse he grows, if grace correct not the course of corrupt nature, according to that saying, Nemo senex metuit Jovem. Now if God shall forbear this restraint, and give them over to the power of Satan, they shall be exposed to the commission of such abominable things, and therein they shall receive in themselves a just recompence of their former errors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, (London: J.D., 1646), 4th Doubt, pp. 189-94</span></figcaption>

rbear+thus+to+move%2C+and+gives+men+over+to+follow+the+swing+of+their+own+lusts%2C+this+I+confess+is+to+harden+in+greater+measure%2C+and+properly+a+punishment.+But+this+was+not+the+manner+of+Pharaohs+hardening.+For+long+after+the+ninth+chapter+of+Exodus+we+read+how+God+continued+to+admonish+Pharaoh+by+his+servant+Moses+to+let+his+people+go%3B+neither+ceased+He+this+discipline+till+the+ten+plagues+or+nine+of+them+at+the+least+were+fulfilled.+And+like+as+to+shew+mercy+is+not+to+move+only+to+obedience%2C+but+effectually+to+work+men+to+obedience%2C+so+the+hardening+of+man+in+opposition+thereunto%2C+consists+not+in+not+moving+unto+obedience%2C+but+rather+in+not+working+unto+obedience%2C+although+they+be+moved+thereunto+both+in+the+way+of+instruction+and+exhortation.+As+for+the+punishing+of+sin+with+sin+in+the+hardening+of+the+creature%2C+let+us+understand+ourselves+aright%2C+and+not+confound+ourselves+when+we+need+not.+Is+it+a+sober+speech+to+say+that+God+punishes+his+denial+of+grace+with+denial+of+grace%3F+or+that+God+punishes+the+sins+of+the+heathen+with+the+denial+of+that+grace%2C+which+they+never+enjoyed%3F+But+as+for+the+punishing+of+sin+with+sin%2C+this+is+a+large+field+of+God%E2%80%99s+providence%2C+consisting+in+diverse+kinds%2C+and+it+is+no+way+fit+to+consider+them+without+distinction.+God+made+the+unnaturalness+of+Senacherib%E2%80%99s+sons+a+scourge+to+chastise+Senacherib%E2%80%99s+unnaturalness+towards+God%3B+one+mans+sinful+act+to+be+the+punishment+of+another%E2%80%99s.+Here+is+one+kind+utterly+distinct+from+that+you+treat+of.+Again%2C+some+say+%28and+I+think+justly%29+and+Augustine+acknowledges+it%2C+that+every+man%E2%80%99s+sin+may+be+a+just+punishment+unto+him+in+respect+of+a+former%2C+as+Rom.+1%3A25.+When+men+for+their+idolatry+were+given+over+to+vile+affections%2C+to+defile+themselves+in+abominable+manner%2C+it+is+said+that+herein+they+received+in+themselves%2C+such+recompence+of+their+error+as+was+meet.+So+2+Thess.+2%3A10-11%2C+because+men+received+not+the+truth+of+God+with+love%2C+God+is+said+to+send+them+strong+delusions+that+they+should+believe+lies.+%E2%80%A6For+to+punish+is+either+to+inflict+evil%2C+which+formerly+they+suffered+not%2C+or+to+withdraw+some+good+which+formerly+they+enjoyed%E2%80%A6+we+see+hereby+apparently+how+God+can+punish+sin+with+sin+in+this+kind%2C+not+by+denial+of+grace+which+they+never+enjoyed%2C+but+by+denying+some+outward+means+of+grace+which+formerly+they+enjoyed.+And+withal+it+appears+that+this+is+nothing+to+our+present+purpose%2C+who+treat+of+obduration+as+it+consists+in+or+is+joined+with+the+denial+of+saving+grace%2C+in+proper+opposition+to+the+showing+of+mercy+or+affording+saving+grace%E2%80%A6+I+say+also+that+God%E2%80%99s+punishing+consists+in+denying%2C+or+not+maintaining+some+kind+of+grace%2C+or+rather+not+so+much+to+be+called+grace+as+a+natural+restraint%2C+not+from+sin+in+general+%28for+that+cannot+be+but+by+saving+grace%29%2C+but+from+some+sins+in+special%2C+which+are+foul+in+the+judgment+of+a+natural+man%E2%80%99s+conscience%3B+such+as+are+those+unnatural+defilements+the+apostle+speaks+of%2C+Rom.+1.+Now+God+in+a+natural+manner+restrains+men+from+such+excess%2C+either+for+fear+of+shame+of+the+world+or+by+reason+of+some+natural+detriment+that+may+arise+thereby%2C+or+by+the+ministry+of+his+angels+restraining+the+temptations+of+Satan+in+this+kind%3B+And+it+is+found+by+experience+that+Nemo+repente+fit+turpissimus%2C+but+they+grow+to+extremes+by+degrees%2C+and+the+longer+a+man+lives%2C+the+worse+he+grows%2C+if+grace+correct+not+the+course+of+corrupt+nature%2C+according+to+that+saying%2C+Nemo+senex+metuit+Jovem.+Now+if+God+shall+forbear+this+restraint%2C+and+give+them+over+to+the+power+of+Satan%2C+they+shall+be+exposed+to+the+commission+of+such+abominable+things%2C+and+therein+they+shall+receive+in+themselves+a+just+recompence+of+their+former+errors.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+A+Treatise+of+Mr.+Cotton%E2%80%99s+clearing+certain+doubts+concerning+Predestination+together+with+an+Examination+thereof%2C+%28London%3A+J.D.%2C+1646%29%2C+4th+Doubt%2C+pp.+189-94&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F266d855363.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/266d855363.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-decrees-of-god#:~:text=If%20you%20say%20that%20though%20such,just%20recompence%20of%20their%20former%20errors&amp;text=If%20you%20say%20that%20though%20such%20righteousness%20in&amp;text=themselves%20a%20just%20recompence%20of%20their%20former%20errors" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c9e0c178a3" data-kw="">
<blockquote><p>In election, believers were from all eternity given to Jesus Christ. As believers were chosen from all eternity, so Christ was from eternity chosen and appointed to be their redeemer, and he undertook the work of redeeming them. But there was a covenant about it between the Father and Son. Christ, as we have already observed, loved them. This is the account he gives of himself, how it was with him before the world, and one thing is that then he rejoiced in the habitable parts of God’s earth and his delights were with the sons of men [Proverbs 8:31].

And when he undertook for them, he knew what success he should have. God promised him a certain number, and he had their names, as it were, written in a book; and therefore the book of life is called the Lamb’s book; Revelation 21:27, “but they that are written in the Lamb’s book of life.” And he bears their names upon his heart, as the high priest of old did the names of the tribes of the children of Israel on his breastplate [Exodus 28:29].

Christ often calls the elect those that God had given him; John 17:2, “As thou hast given him power over all flesh, that he should give eternal life to as many as thou hast given him”; and again, in John 17:9, “I pray not for the world, but for them which thou hast given me”; John 17:11, “Keep through thy name those whom thou hast given me.</p></blockquote>

</figure><figure class="quote" id="q-327c36d75d" data-kw="">
<blockquote><p>Thesis 3. Many, being scrupulous, have erred with the term “predestination,” arguing it denotes election alone and is spoken just about good things—this despite the fact the Holy Spirit used the same term in speaking about evil things (Acts 4:23). This is because predestination of a thing is the determination of it to its end. But these people deny this is the sort of end that is the destruction of the reprobate (seeing that such is an evil thing) and further that the term “predestination” is applied wrongly to them. Answer. Though we concede it is indeed an evil thing with respect to those reprobate, still, with respect to God reprobating, which is their final destruction or end, he without doubt intends the declaration of his righteousness and power (Prov. 16:4; Rom. 9:17, 21–22). …

Thesis 8. The means tending to this end are effectual calling, justification, and sanctification, and the opposite for the reprobate: the privation of effectual grace, continuation in the state of condemnation, and just blinding and hardening, all which presuppose the Fall and condition of sin. We will deal with all this further in what follows.

Thesis 9. So, our adversaries charge us falsely that we establish predestination absolute in every way, because we say it is only absolute with respect to the impelling cause existing in man, or a cause differing from God’s good pleasure. This is because, if it were some impulsive cause that moved God toward this or that thing about to be done, thus God would be the cause who depends with respect to that cause by which he is moved. This is absurd. Furthermore, predestination is not absolutized from the end and means (as is clear in the preceding thoughts), because God, absolutely wise, wills nothing without an end. So he decreed to render sinners saved, so that he might manifest his grace in them with respect to his mercy, but to condemn the reprobate, so that he might manifest his glory in them under the concept of his justice. Nothing is without means. Thus, he decreed to save the faithful, but through and on account of Christ; and he decreed to condemn the reprobate, but on account of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Theological Disputation De Divina Hominum Praedestinatione</cite>, (1643), with Johannes Maccovius Presiding and Johannes Fridericus Herbst Responding’, trans. R. M. Hurd in Mid-America Journal of Theology, no. 30 (2019), pp 89, 90.</span></figcaption>

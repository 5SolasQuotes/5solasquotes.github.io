<main class="wrap"><figure class="quote" id="q-a88169a2f4" data-kw="">
<blockquote><p>…external adoration is due two ways:

1. When we approach God in immediate acts of worship, as prayer, and praises.

2. When it pleases God in an extraordinary manner to appear in his glory; the due season then for external signs of inward homage and reverence is when we perform these immediate acts of worship in our assemblies, or if God shall please, to give glorious signs of his extraordinary presence, as he did to Moses when the Bush was burning but not consumed, or as the Lord appeared, after Solomon had made an end of praying, when the fire came down from Heaven and the glory of the Lord filled the house; then all the Children of Israel, beholding the fire and glory of the Lord, bowed themselves and worshipped; whensoever the Lord does thus appear, external adoration is due.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-craghead.html">Robert Craghead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to a Late Book entitled, A Discourse concerning the Inventions of Men in the Worship of God, by William, Lord Bishop of Derry</cite>, ... (Edinburgh: Anderson, 1694), ch. 4, ‘Of Bodily Worship’, section 2, p. 96 Craghead (1633–1711) was a presbyterian minister, born in Scotland, who ministered in Ireland.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-99848ae32d" data-kw="">
<blockquote><p>The phrase that follows, “before my face,” makes the offense more heinous because God is provoked to jealousy as often as we substitute our own inventions in place of him. This is like a shameless woman who brings in an adulterer before her husband’s very eyes only to vex his mind the more.… Therefore, when God by his present power and grace testified that he kept watch over the people whom he had chosen, he warned them—to keep them even more from the crime of rebellion—that they could introduce no new gods without his witnessing and observing their sacrilege.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.8.16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/first-table-commandments-1-4.html">First Table (Commandments 1-4)</a> › <a href="../topics/the-law-of-god/first-table-commandments-1-4/first-commandment.html">First commandment</a></span><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-0629595fba" data-kw="">
<blockquote><p>Q. Is it unlawful to make an image of the Trinity, or of any Person in the Godhead? It is utterly unlawful, and a great dishonor to figure the incorruptible God by the shape of a base and corruptible man or bird, or other creature. Dt. 4:15-18; Rom. 1:23; Acts 17:24, 29; Isa. 40:15, 18-19; Hab. 2:8. It abuses our understandings: the party thinks there is some good in an image, else he would not make it; and that’s a lie: He lies that shows me a toad and says it is the picture of an angel; so, etc. All the pictures of Christ in the flesh, as that on Christ on the cross and resurrection are lies, false in their representations and false in the conceit of any good by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-lyford.html">William Lyford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Principle[s] of Faith &amp; Good Conscience Digested into a Catechetical Form</cite>, … (Oxford: Hall, 1665), ch. 30, pp. 132-33</span></figcaption>

</figure><figure class="quote" id="q-214740dbc7" data-kw="">
<blockquote><p>…we must conclude that the florilegium of the Council of 815 does not advance beyond the iconoclastic theology of the earlier period… its authors made no original contributions, and merely re-used materials or repeated arguments current among the iconoclasts of 754. The most that can be said is that the iconoclasts of 815 added 12 (or 28) patristic references to the florilegium of 754, none of which, however, can be regarded as constituting an innovation or substantial addition to the iconoclastic armory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/milton-v-anastos.html">Milton V. Anastos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Ethical Theory of Images Formulated by the Iconoclasts in 754 &amp; 815’ in Dumbarton Oaks Papers</cite>, vol. 8 (1954), pp. 153-60, p. 159</span></figcaption>

</figure><figure class="quote" id="q-4ee3a8211b" data-kw="">
<blockquote><p>…the everlasting and precise observation of this favorable precept [2nd Commandment] in the ancient, purely Christian Church… They observed the rule with the Cherubim, too; it was exactly as if they had not been put in the temple, even outside the gaze of all the Priests, and they were put forth as types of the Majesty of the Messiah who rules over the angels themselves, the truth of which we now maintain. [Note that numerous reformed theologians (such as Owen below), in accord with many in the Christian Church before them, irrespective of possibly a more direct figuring of Israel under Egyptian persecution, taught that the burning bush was a type of the majesty of the Messiah (the true Israel) who would join the divine nature to his human nature in his Person (who spoke both as the angel of the Lord, and God, out of the bush), and not be consumed. Beza’s and the Reformed’s caution is here evident.] But the other images, like the lions and the bulls, pertain in no way to this matter, (r) since they were like decorations of holy vases, lacking any danger of idolatry, and besides this, constructed in this way by the express word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586</cite>, (Concordia Publishing House, 2017), ch. 4, p. 462</span></figcaption>

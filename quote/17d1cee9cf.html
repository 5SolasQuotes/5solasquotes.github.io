<main class="wrap"><figure class="quote" id="q-17d1cee9cf" data-kw="actual">
<blockquote><p>Second, involuntary may be taken in two ways: either positively or negatively. The former is the same as unwilling which is such by a positive nolition. In this sense, we grant that no sin can be involuntary. The latter is what is done (the act of will ceasing) when the will ought to have acted (which is said to be such by a negative nolition). In this sense, every sin is not necessarily voluntary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/actual-sin.html">Actual Sin</a> › <a href="../topics/sin/actual-sin/omission-and-commission.html">Omission and commission</a></span><span class="t"><a href="../topics/sin/actual-sin.html">Actual Sin</a> › <a href="../topics/sin/actual-sin/sins-of-thought-word-and-deed.html">Sins of thought, word and deed</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4bfa275b68" data-kw="splendid vices">
<blockquote><p>That sin is rightly called the punishment of sin is proved: (1) Scripture expressly establishes this—the incest of Absalom is put forward as a punishment of David sent by God: “Thus saith the Lord, Behold, I will raise up evil against thee out of thine own house, and I will take thy wives before thine eyes, and give them unto thy neighbor, and he shall lie with thy wives in the sight of this sun. For thou didst it secretly: but I will do this thing before all Israel, and before the sun” (2 S. 12:11, 12). Nor can it be objected that “there was nothing penal here, only a bare permission and that the incest itself was not punishment formally.” We answer that the punishment of David ought to be a public disgrace and loss inflicted upon him before the sun and all Israel, and it was a pollution of David’s bed. Now the divine permission was neither formally a detriment to David, nor made publicly before the sun, but secretly in the impure heart of Absalom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.15</span></figcaption>

</figure><figure class="quote" id="q-a84fb7eb54" data-kw="">
<blockquote><p>We must here observe, that not only are corrupt and disordered inclinations sins, but the thinking of evil, in as far as it is connected with an inclination and propensity to pursue it, or with a desire to practice it, is sin.</p></blockquote>

</figure><figure class="quote" id="q-6c7ba3e091" data-kw="">

</figure><figure class="quote" id="q-b5c7e4cb15" data-kw="">

<blockquote><p>§37. It seems to me that mystical signs stated by man in God’s public worship, directly to work grace on his soul from God, and that as instituted, and also to oblige man to God again, are unlawfully brought into the Church.</p></blockquote>

<blockquote><p>§27. Though all these things are left to human determination, and so are indifferent in themselves, before; yet may they become accidentally necessary or unlawful. And though man must determine of them, yet not as he list, without a rule: but by those sufficient general directions which God has given in Scripture, and the end and nature of the work. And to cross these directions is a sin in him that does determine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship (London: R.W., 1659), 5th Disputation, ch. 2</cite>, p. 407</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-c3e59fbef6" data-kw="">
<blockquote><p>All these upon my own knowledge were the true causes why so great a number of those persons who were counted most religious, fell in with the parliament in England; insomuch that the generality of the stricter diligent sort of preachers joined with them, though not in meddling with arms, yet in judgment, and in flying to their garrisons; and almost all those afterwards called presbyterians were before conformists: Very few of all that learned and pious synod at Westminster were nonconformists before, and yet were for the parliament, supposing that the interest of religion lay on that side. Yet did they still keep up an honorable esteem of all that they thought religious on the other side, such as Bishop Davenant, Bishop Hall, Bishop Morton, Archbishop Ussher, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reliquiæ Baxterianæ: or, Mr. Richard Baxter’s Narrative of the most Memorable Passages of his Life &amp; Times (London: Parkhurst, 1696), bk. 1, pt. 1</cite>, p. 33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-e7983f8bfd" data-kw="">
<blockquote><p>Besides, there were in the first churches continued for a while certain extraordinary gifts, that had their effects visibly on the outward senses of men, and tended not immediately unto the edification of the church in their faith, but unto the conviction of others, and vindication of the authority of them by whom the gospel was preached and propagated. Such was that gift of healing the sick, which being an especial effect of the Holy-Ghost for the advantage of the Church in those days, in some places it was accompanied by anointing with oil; but this being no universal practice, and used only in the exercise of a gift extraordinary, whose use and being are long since ceased, it never was appointed nor intended to be of continuance in the Church, which is not tied by the Lord Christ to the empty signs and shadows of things whose substance is not enjoyed: besides, no spiritual grace of the Covenant was ever intimated, sealed, or exhibited by that usage of anointing with oil. The first mention of it is, Mark 6:13 where its practice is reckoned among the effects of that extraordinary power which the Lord Christ committed unto his twelve disciples on their first sending out, and is referred unto the same series of miracles which they wrought in pursuit, and by virtue thereof, they cast out many devils, and anointed with oil many that were sick, and healed them. And by what is there recorded, the subsequent mention of it, James 5:14 is to be regulated, but now unto a real evangelical institution of worship, it is required: (1.) That it be a command of Christ manifested by his Word, or example proposed unto our imitation, Mt. 28:20. (2.) That it be given and enjoined unto the whole Church with the limitation of its administration expressed in the Word, 1 Cor. 11:25. (3.) That unto the due performance of it, Gospel grace be required in them that attend unto it. (4.) That it teach, or represent, or seal, or improve some grace of the Covenant, and have a promise of acceptation annexed unto it, and whatever is thus appointed, the Church is indispensably to continue in the observation of, unto the end of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Short Catechism on Worship: Dr. Owen’s Instruction in the Worship of God, by Way of Question and Answer; with an Explication and Confirmation of those Answers’, Question #13 1667 For the fuller context, see Owen above on the holy kiss, which section immediately precedes this section.</cite></span></figcaption>

</figure><figure class="quote" id="q-729868d934" data-kw="">
<blockquote><p>And to be precise, [Christ instituted the sacrament] ‘after washing their feet,’ as many [sources] say. For when the meal was begun (John 13:2), He rose from the table (verse 4) and washed the feet of his disciples, as was the customary practice of eastern peoples (Luke 7:44). He did so in order that by this exemplary action He might show them the way to humility and love, and testify his favor towards those who are his–that He is certainly the one who cleanses his people from their uncleanness (John 13:8-10, 14). And He did so in order to teach them by means of a comparison (and not a sacrament) with what frame of mind they ought to approach these sacred things. Even so the western church has, elsewhere and sometimes not without abuse, adopted the practice as a sacrament. … Nor do the following facts have any force of being required or observed: that the supper was given to them… after their feet had been washed… (some [things] of which were observed for some time in the early church).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-thysius.html">Antonius Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Synopsis of Purer Theology... (1625; Brill), vol. 3, Disputation 45, ‘On the Lord’s Supper’, pp. 183-85 &amp; 187</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<main class="wrap"><figure class="quote" id="q-fe6b745c4a" data-kw="">
<blockquote><p>Concl. 4. Every true Believer manageth a successful War, and is sure of Conquest. My meaning is not that every Christian hath a certainty of persuasion that he shall prevail, or overcome; for many an one is ready to say sometimes that he shall one day fall by the hand of this or that Saul: but there is a certainty of the thing in itself. I speak of the certainty of the object, or the truth of this Proposition [Every Believer shall certainly conquer the Enemies of his Soul] not of the certainty of the Subject, the certioration of the Believer, or his persuasion and assurance that he shall be victorious at last. A Believer shall certainly win the day and conquer all Opposers, whatever his unbelieving heart may at any time suggest to the contrary. Hence Paul speaks of it as a thing done: we do more then overcome. This may be made out thus:

1. A Believer in this life gets many signal Victories. He is not able indeed utterly to drive out the Canaanites, they will abide in his Land (Heart, I mean) and be rebelling and vexing him frequently: but the Lord gives him many remarkable victories over them. There are some memorable days and happy times wherein the People of God come out of the Field victorious, and triumph over their spiritual Enemies. They set their feet in the neck of their Lusts, and lay their Corruptions bleeding at their feet, and do so resist Satan as to rout him and put him to flight.

2. If he be for a time overcome, yet he recovers himself at last and gets the Day. He may be overcome, and carried Captive (as the Apostle intimates Rom. 7. 23.) he may be remarkably worsted in some particular conflicts, and taken Prisoner: but he cannot be detained always a Prisoner, all the power and policy of his Adversaries cannot hold him, he will make an escape from them sooner or later, and obtain rescue and deliverance. If he be foiled, and laid on his back for a time; yet it is not long before he recovers himself, and gets up again by godly sorrow, Humiliation and Repentance, and renew; the Combat, and is too hard for his Enemies. If he be routed, he rallies again, and never leaves fighting, till he carries the day, and go out of the Field a Conqueror.

3. His Enemies lose Ground by all their partial Conquests of Him. A Child of God gets Good by his Foils and Falls, yea, gets Ground insensibly of his Corruptions and other Enemies thereby. His Enemies by winning the Day, lose it; and by Conquering, are conquered. Every victory that Sin and Satan obtain, makes a gracious Heart more humble, more sensible of his own weakness, and absolute need of the strength of Christ, more watchful against Sin and Temptation, more Cautious for time to come of admitting Parleys and Compliances with his Adversaries, and so turn (through the over-ruling Hand of Grace) to the singular Advantage of a Christian in many respects. Lay these things together, and it will be manifest that a Believer manages a very successful war, and is sure at last of an absolute Conquest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/urian-oakes.html">Urian Oakes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The unconquerable, all-conquering, &amp; more-then-conquering soldier, or, The successful war which a believer wageth with the enemies of his soul as also, the absolute and unparalleled victory that he obtains finally over them through the love of God in Jesus Christ: as it was discussed in a sermon pre</cite>, (Cambridge MA: Samuel Green, 1674), pp 14-15.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5bfa5838d8" data-kw="">
<blockquote><p>Briefly (in deed) and in very few words is it said by the Apostle, Let a man examine himself: but in that brevity, and in those few words, he effectually comprehendeth the whole office and duty of every such an one, as doth earnestly desire to be reconciled, and to be at one with God; yea, therein he summarily setteth down, and compendiously prescribeth all and whatsoever is needful or expedient, for each true Christian to do &amp; perform.

For, to examine a man’s own self, is nothing else, than for him thoroughly to try, narrowly to search, and diligently to prove, who and what manner of person he is; &amp; in what case he inwardly feeleth his own conscience. To the same effect, purpose and meaning doth the Apostle in an other place say, Let every man prove his own works: And again, Prove your selves whether ye be in the faith: examine your selves.

He therefore is to be understood, rightly, duly, and truly to examine himself, which diligently and carefully searcheth out, trieth, groapeth, &amp; inwardly rippeth up every corner of his conscience, and so narrowly fifteth both his works, actions and faith, that he leaveth nothing in his whole man, either outwardly or inwardly, whereof he maketh not a true and perfect presentment unto his Conscience, and (as it were) strictly enditeth and judicially arraigneth at the Bar, as before a most severe Judge.

And look how necessary it is for every one that hath sinned, (and by sinning disfranchised and banished himself from the kingdom of heaven) to bend his whole care and study, how to come into favour again with God, king of the same heavenly kingdom: so necessary is it, that before he go about the same, he diligently try and examine himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-hyperius.html">Andreas Hyperius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true trial and examination of a man’s own self wherein every faithful Christian, by looking into his conscience, may most plainly behold his spiritual deformity by nature, described, his actual rebellion by disobedience detected, his promise breach at baptism, by ordinary transgression apparentl</cite>, trans. Thomas Newton (London: John Windet, 1587), pp 1-3.</span></figcaption>

<blockquote><p>We know so much of divine truth, my reader, as we have in a measure a personal experience of it in our souls. The mere speculatist and notionalist in religion is as unsatisfactory and unprofitable as the mere theorist and declaimer in science. For all practical purposes both are but ciphers. The character and the degree of our spiritual knowledge begins and terminates in our knowledge of Christ. Christ is the test of its reality, the measure of its depth, and the source of its growth. If you are advancing in an experimental, sanctifying acquaintance with the Lord Jesus, you are advancing in that knowledge which Paul thus estimates: “I count all things but loss for the excellency of the knowledge of Christ Jesus, my Lord.”

Dear reader, let the chief object of your study be to know the Lord Jesus. It may be in the region of your sinfulness, emptiness, weakness, and foolishness that you learn Him — nevertheless, however humiliating the school, slow the progress, and limited the attainment, count every fresh step you make in a personal acquaintance with the Lord Jesus as a nobler triumph, and as bringing you into the possession of more real wealth than were the whole chests of human knowledge and science mastered, and its untold treasures poured at your feet.

When adversity comes — when death approaches — when eternity unveils — oh! — how indescribably valuable, how inconceivably precious will then be one faith’s touch, one faith’s glimpse of a crucified and risen Saviour! All other attainments then vanish, and the only knowledge that abides, soothes, and comforts, is a heartfelt acquaintance with the sublimest fact of the Gospel, that “Christ Jesus came into the world to save sinners.” Oh! Whatever other studies may engage your thoughts, forget not, as you value your eternal destiny, to study the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Go and Tell Jesus</cite>, (75th edn, New York: A. D. F. Randolph &amp; Co., 1869), pp 8-10.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/spiritual-duties.html">Spiritual Duties</a></span></div>
<div class="actions"><button class="copy" data-copy="“We know so much of divine truth, my reader, as we have in a measure a personal experience of it in our souls. The mere speculatist and notionalist in religion is as unsatisfactory and unprofitable as the mere theorist and declaimer in science. For all practical purposes both are but ciphers. The character and the degree of our spiritual knowledge begins and terminates in our knowledge of Christ. Christ is the test of its reality, the measure of its depth, and the source of its growth. If you are advancing in an experimental, sanctifying acquaintance with the Lord Jesus, you are advancing in that knowledge which Paul thus estimates: “I count all things but loss for the excellency of the knowledge of Christ Jesus, my Lord.”

Dear reader, let the chief object of your study be to know the Lord Jesus. It may be in the region of your sinfulness, emptiness, weakness, and foolishness that you learn Him — nevertheless, however humiliating the school, slow the progress, and limited the attainment, count every fresh step you make in a personal acquaintance with the Lord Jesus as a nobler triumph, and as bringing you into the possession of more real wealth than were the whole chests of human knowledge and science mastered, and its untold treasures poured at your feet.

When adversity comes — when death approaches — when eternity unveils — oh! — how indescribably valuable, how inconceivably precious will then be one faith’s touch, one faith’s glimpse of a crucified and risen Saviour! All other attainments then vanish, and the only knowledge that abides, soothes, and comforts, is a heartfelt acquaintance with the sublimest fact of the Gospel, that “Christ Jesus came into the world to save sinners.” Oh! Whatever other studies may engage your thoughts, forget not, as you value your eternal destiny, to study the Lord Jesus Christ.”

— Octavius Winslow, Go and Tell Jesus, (75th edn, New York: A. D. F. Randolph &amp; Co., 1869), pp 8-10.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+know+so+much+of+divine+truth%2C+my+reader%2C+as+we+have+in+a+measure+a+personal+experience+of+it+in+our+souls.+The+mere+speculatist+and+notionalist+in+religion+is+as+unsatisfactory+and+unprofitable+as+the+mere+theorist+and+declaimer+in+science.+For+all+practical+purposes+both+are+but+ciphers.+The+character+and+the+degree+of+our+spiritual+knowledge+begins+and+terminates+in+our+knowledge+of+Christ.+Christ+is+the+test+of+its+reality%2C+the+measure+of+its+depth%2C+and+the+source+of+its+growth.+If+you+are+advancing+in+an+experimental%2C+sanctifying+acquaintance+with+the+Lord+Jesus%2C+you+are+advancing+in+that+knowledge+which+Paul+thus+estimates%3A+%E2%80%9CI+count+all+things+but+loss+for+the+excellency+of+the+knowledge+of+Christ+Jesus%2C+my+Lord.%E2%80%9D%0A%0ADear+reader%2C+let+the+chief+object+of+your+study+be+to+know+the+Lord+Jesus.+It+may+be+in+the+region+of+your+sinfulness%2C+emptiness%2C+weakness%2C+and+foolishness+that+you+learn+Him+%E2%80%94+nevertheless%2C+however+humiliating+the+school%2C+slow+the+progress%2C+and+limited+the+attainment%2C+count+every+fresh+step+you+make+in+a+personal+acquaintance+with+the+Lord+Jesus+as+a+nobler+triumph%2C+and+as+bringing+you+into+the+possession+of+more+real+wealth+than+were+the+whole+chests+of+human+knowledge+and+science+mastered%2C+and+its+untold+treasures+poured+at+your+feet.%0A%0AWhen+adversity+comes+%E2%80%94+when+death+approaches+%E2%80%94+when+eternity+unveils+%E2%80%94+oh%21+%E2%80%94+how+indescribably+valuable%2C+how+inconceivably+precious+will+then+be+one+faith%E2%80%99s+touch%2C+one+faith%E2%80%99s+glimpse+of+a+crucified+and+risen+Saviour%21+All+other+attainments+then+vanish%2C+and+the+only+knowledge+that+abides%2C+soothes%2C+and+comforts%2C+is+a+heartfelt+acquaintance+with+the+sublimest+fact+of+the+Gospel%2C+that+%E2%80%9CChrist+Jesus+came+into+the+world+to+save+sinners.%E2%80%9D+Oh%21+Whatever+other+studies+may+engage+your+thoughts%2C+forget+not%2C+as+you+value+your+eternal+destiny%2C+to+study+the+Lord+Jesus+Christ.%E2%80%9D%0A%0A%E2%80%94+Octavius+Winslow%2C+Go+and+Tell+Jesus%2C+%2875th+edn%2C+New+York%3A+A.+D.+F.+Randolph+%26+Co.%2C+1869%29%2C+pp+8-10.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3b863572e3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3b863572e3.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/12/31/octavius-winslow-on-the-need-for-an-experimental-knowledge-of-christ/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>O wretched Man! where shall I begin to describe thine endless misery, who art condemned as soon as conceived; and adjudged to eternal death, before thou wast born to a temporal life? A beginning indeed, I find, but no end of thy miseries. For when Adam and Eve, being created after God’s own image, and placed in Paradise, that they and their posterity might live in a blessed state of life immortal, having dominion over all earthly creatures, and only restrained from the fruit of one tree, as a sign of their subjection to the almighty Creator; though God forbade them this one small thing, under the penalty of eternal death; yet they believed the devil’s word before the word of God, making God, as much as in them lay, a liar.

And so being unthankful for all the benefits which God bestowed on them, they became malcontent with their present state, as if God had dealt enviously or niggardly with them; and believed that the devil would make them partakers of far more glorious things than ever God had bestowed upon them; and in their pride they fell into high-treason against the Most High; and disdaining to be God’s subjects, they affected blasphemously to be gods themselves, equals to God. Hence, till they repented (losing God’s image) they became like the devil; and so all their posterity, as a traitorous brood (whilst they remain impenitent, like thee) are subject in this life to all cursed miseries, and, in the life to come, to the everlasting fire prepared for the devil and his angels.</p></blockquote>

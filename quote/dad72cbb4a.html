<blockquote><p>The great death had appeared in Zurich… It was proving ‘the scourge of God’; the terror of Europe, and where could he be safer from it than amid the spray of the Jamina? But the unselfish pastor thought chiefly of his flock. He must hasten home, likely as he was to be the victim of the plague. If Chateaubriand [in western France] had known of this and thousands of similar cases, he would have given a better turn to his eloquent period than to say, ‘The Protestant pastor abandons the necessitous on the bed of death, and never risks his life in the midst of the pestilence.’ Zwingli found his house deserted by all the young men who had lived and studied with him, except his youngest brother Andrew, who had waited for his return. He sent Andrew immediately to Wildhaus, that he might escape ‘the death’. With heroic courage he went from house to house, devoting himself entirely to the victims of the frightful scourge. Everyday he proclaimed the messages and consolations of Christ to the sick arid the dying. In the pulpit he so preached that he raised the hearts of the terrified congregation with the invitations of Jesus to the heavy-laden and the promises treasured up in the Word of life. His faithful parishioners trembled for their pastor, as they saw him moving about among the shafts of death and bearing to them the cup of salvation. His devotion was talked of by friends at a distance. Two thousand five hundred people were swept away in a short time, and they were alarmed for him. Conrad Brunner of Wesen, soon to die of the plague, wrote to him from Basle, saying, ‘Do your duty, but at the same time remember to take care of your own life.’ The caution came too late: Zwingli was attacked by ‘the great death’. Switzerland seemed about to lose her mightiest preacher, Zurich her patriotic Reformer, his flock their best earthly friend. Dr. Hedio of Basel was thinking sadly of the possible result of ‘the murderous disease; for who would not grieve if the saviour of his country, if the trumpet of the gospel, if the courageous herald of the truth should be stricken down in the prime of life, high in hope and in the midst of his usefulness.’ The thoughts of Zwingli were turned inward; his eyes upward to heaven. His meditations and prayers were afterward recorded in poetry, whose rhythm and quaintness D’Aubigne has preserved in his version: Lo! at the door I hear death’s knock! Shield me, O Lord, My strength and rock. Thy hand once nailed Upon the tree, Jesus, uplift, And shelter me. Willest thou then, Death conquer me, In my own noon-day? So let it be! Oh! may I die, Since I am thine: Thy home is made For faith like mine. … Day and night were prayers ascending to God from the distressed believers for their pastor’s recovery… But the Lord heard the prayers of his people, the plague forsook its victim… Zwingli went into his pulpit still feeble and scarcely able to preach. ‘The plague has so weakened my memory and intellect,’ he wrote to Myconius, ‘that in preaching I sometimes altogether lose the thread of my discourse. All my members are oppressed with a languor that I cannot describe.’ This was not all; his salary was so small that he was under a burden of embarrassments. He could not support himself and his two assistants. Gifts might have poured in, but he would not accept them… The Lord had led his servant nearer to himself that he might have the privileges of a son. D’Aubigne says: ‘This pestilence of 1519, which committed such frightful ravages in the north of Switzerland, was, in the hands of God, a powerful means of converting many souls. But on no one did it exercise so powerful an influence as on Zwingli. The gospel, which had hitherto been too much regarded by him as a mere doctrine, now became a great reality. He arose from the darkness of the sepulchre with a new heart. His zeal became more active, his life more holy, his preaching more free, more Christian, more powerful. This was the epoch of Zwingli’s complete emancipation; henceforward he consecrated himself entirely to God. But the Reformation of Switzerland received a new life at the same time as the Reformer. The scourge, the great death, as it swept over these mountains and descended into the valleys, gave a holier character to the movement that was taking place. The Reformation, as well as Zwingli, was baptized in the waters of affliction and of grace, and came forth purer and more vigorous. It was a memorable day in the counsels of God for the regeneration of this people.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/after-plagues.html">William M. Blackburn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ulrich Zwingli: the Patriotic Reformer. A History</cite>, (Philadelphia: Presbyterian Board of Publication), pp. 95-100</span></figcaption>

<blockquote><p>Who is one of you.] Lastly then, the Apostle wishes also by this consideration to render Onesimus more acceptable to the Colossians, because he was sprung from Colosse, that is to say, of their people and a countryman. For although this does not make much for the praise of this man, yet it conduces something to inflame the Colossians with the love of him: for what is a person’s own and is peculiar to him, is wont to be more loved by every one.

Observations.

1. It is proper to treat them with peculiar affection, to whom we are more near and bound in any peculiar respect; for example, if they should be of the same blood, affinity, or country with us, or of the same society.

2. That affection, therefore, is vicious, which in many begets contempt, or at least, a neglect of their own, namely, because they are of our kin. For as in things, so also in persons; the things which are produced at home are nearest to dis-esteem, but all distant and foreign things are extolled with wonderful encomiums. Christ himself experienced this folly of his own countrymen, and seriously complained of it, Matt. xiii. 57, A prophet is not without honour, save in his own country and in his own house. And thus much of the person extolled, and of his commendation. …

Who is one of you.] That is, your fellow-citizen, born and educated among you, and finally given and devoted to your advantage. This especially conduces to conciliate love for him. For all love (as the Schools express it) is founded in some communication or participation of the same thing: therefore, they who are participants of the same country and city, are united together as by a certain closer bond of love. For as their native soil is used to be dear to all, so it renders all things which spring from it even more dear to the wise and sober.

Corollaries.

1. They are deservedly to be blamed as vain and void of natural affection, who despise their own kindred and all their home concerns, being in the mean time addicted beyond what is just and good, to things and persons foreign to the house.

2. They who by a participation of country and city, or any like cause, are united with us, all other things corresponding, ought to be more dear than strangers. Hence says the Apostle, 1 Tim. v. 8, If any provide not for his own, and especially for those of his own house, he hath denied the faith, and is worse than an infidel.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Who is one of you.] Lastly then, the Apostle wishes also by this consideration to render Onesimus more acceptable to the Colossians, because he was sprung from Colosse, that is to say, of their people and a countryman. For although this does not make much for the praise of this man, yet it conduces something to inflame the Colossians with the love of him: for what is a person’s own and is peculiar to him, is wont to be more loved by every one.

Observations.

1. It is proper to treat them with peculiar affection, to whom we are more near and bound in any peculiar respect; for example, if they should be of the same blood, affinity, or country with us, or of the same society.

2. That affection, therefore, is vicious, which in many begets contempt, or at least, a neglect of their own, namely, because they are of our kin. For as in things, so also in persons; the things which are produced at home are nearest to dis-esteem, but all distant and foreign things are extolled with wonderful encomiums. Christ himself experienced this folly of his own countrymen, and seriously complained of it, Matt. xiii. 57, A prophet is not without honour, save in his own country and in his own house. And thus much of the person extolled, and of his commendation. …

Who is one of you.] That is, your fellow-citizen, born and educated among you, and finally given and devoted to your advantage. This especially conduces to conciliate love for him. For all love (as the Schools express it) is founded in some communication or participation of the same thing: therefore, they who are participants of the same country and city, are united together as by a certain closer bond of love. For as their native soil is used to be dear to all, so it renders all things which spring from it even more dear to the wise and sober.

Corollaries.

1. They are deservedly to be blamed as vain and void of natural affection, who despise their own kindred and all their home concerns, being in the mean time addicted beyond what is just and good, to things and persons foreign to the house.

2. They who by a participation of country and city, or any like cause, are united with us, all other things corresponding, ought to be more dear than strangers. Hence says the Apostle, 1 Tim. v. 8, If any provide not for his own, and especially for those of his own house, he hath denied the faith, and is worse than an infidel.”

<blockquote><p>For they [the Independents] hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-eb0567b629" data-kw="">
<blockquote><p>And yet so far only to exercise it [the body on the Lord’s Day] as not to tire and weary it, if urgent occasion do not require, lest wearisomeness require some such recreation thereof as is nor [not] meet. … Whence it follows that all bodily recreations that do not further us to divine worship, are unlawful on the Lord’s Day: Because they serve only to refresh the body after labor; which is restrained therefrom; otherwise I say, then they shall make us fitter to serve God, when we have any liberty to labor upon case of necessity, though we may use that liberty to wearisomeness, yet this is to be relieued specially with spiritual recreation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cooper.html">Thomas Cooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wilie Beguile Ye, or The Worldling’s Gain… (London, 1621), Conclusion to the Reader, pp. 53-54 Cooper (1569/70 – 1626 or later) was an English puritan; works.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9a2de9f5f9" data-kw="">
<blockquote><p>The word ‘recreation’ is equivocal. Indeed there is a recreation which is mercy, (viz.) the necessary refreshment of the body, as eating, drinking, resting itself, especially to those who have wearied themselves with labor; yea, to some sickly bodies, some ordinary, moderate and inoffensive recreations may be allowed, as a learned man observes. But there is a recreation which we call sports and pastimes, when there is no necessity; and to allow this is no work of mercy; and if it be a mercy to the body, it is severity to the soul…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-wells.html">John Wells</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practical Sabbatarian… (London, 1668) Wells was an English puritan. | ch. 4, ‘That Needless Recreations are Unlawful on the Sabbath’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-375ecdb9c1" data-kw="">
<blockquote><p>6. Works of comliness, tending to honest or decent walking… By all which believers have allowance: 1. for piety, 2. for charity, 3. for what is needful for their beasts, 4. what is needful and convenient, or comely for themselves; and more is not necessary: In these the Lord has not straightned them, neither has He pinched and pinned them up to absolute necessity, but has left them to walk by Christian prudence (yet so as they may not exceed) for the disciples possibly might have endured that hunger, and not plucked the ears of corn, or beasts may live a day without water, and not be much the worse, or some sort of victuals may be provided to be set beside men on the Sabbath needing no dressing or preparing; yea, a man may live on little or nothing for one day: but the Lord has thought good not to straighten them, so as to make his day and worship a weariness and burden unto them, seeing He has made the Sabbath for man, to be refreshing to him, and not man for the Sabbath; nor will he have their consciences to be fettered with inextricable scruples: He leaveth it to men on other days how much to eat and drink by a Christian prudence (yet allows them not to exceed even on these) so here there is some latitude left to conscientious reason to walk by; for some may do something at one time, and not at another, yea, one man may take more pains in upholding his body than is called for from another who is stronger, so that it’s impossible to set particular rules which will agree to all, but [that] men would look: 1. to their end, 2. to their need, 3. to what may conveniently attain the end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law Unsealed: or a Practical Exposition of the Ten Commandments... (Glasgow, 1676), 4th Commandment</cite>, p. 171</span></figcaption>

</figure><figure class="quote" id="q-afe51e93d3" data-kw="">
<blockquote><p>A second sort of works allowed to be done on the Lord’s day: are bodily works and labors which are so necessary for the fitting and enabling of Christians to sanctify that day… And because men cannot be so cheerful in the service of God, nor so heartily rejoice before Him, not with strength and delight spend the whole day in Sabbath duties, without warm and wholesome food, and plentiful refreshing of their weak bodies, therefore the dressing, boiling, baking and roasting of meat is lawful on the Lord’s day, so far as it more helps than hinders holy duties and the service of God. This is manifest by the words of the law, Ex. 12:16, where the Lord forbidding all manner of work on his holy Sabbaths, excepts labor and work about that which people were to eat, and which was necessary for the upholding of an holy moderate feasting on those days. This was practised by the Pharisees and by our Savior and his apostles who on the Sabbath day came to a feast to the house of a chief Pharisee, Lk. 14:1-2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath… (Amsterdam, 1638), ch. 21 Westminster divine</cite>, p. 152</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

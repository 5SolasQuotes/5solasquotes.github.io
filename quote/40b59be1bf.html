<main class="wrap"><figure class="quote" id="q-40b59be1bf" data-kw="">
<blockquote><p>A third limitation: the forementioned rule has not place, when by the forbearance of our indifferencies, at which some wicked men are scandalized, there is incurred as great, if not a greater scandal, then that by their use: as when they are hereby confirmed, and hardened in their error, and sin; and others are hereby drawn into the like: prudenter advertendum est (says Bernard) scandalum scandalo non emendari, qualis emendatio 〈◊〉, si ut aliis scandalum tollas, alios scandalizas.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Part of The Mixture of Scholastical Divinity</cite>, (Oxford, 1660), on 1 Tim. 5:22, “Abstain from all, etc.”, p. 102</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

<blockquote><p>Thus have I evinced a main point, namely, that when scandal is known to follow upon anything, if it be not necessary, there is no respect whatsoever which can justify it.</p></blockquote>

</figure><figure class="quote" id="q-fa1d17a117" data-kw="">
<blockquote><p>Let us then bring our hearts to holy resolutions, and set ourselves upon that which is good, and against that which is evil in ourselves or others, according to our callings, upon this encouragement, that Christ’s grace and power shall go along with us. What had become of that great work of reformation of religion in the latter-spring of the gospel, if men had not been armed with invincible courage… that the cause was Christ’s, and that He would not be wanting to his own cause. Luther igenuously confessed that he carried matters often inconsiderately, and with mixture of passion. But upon acknowledgement, God took not advantage of his errors, but the cause being God’s, and his aims being holy, to promote the truth, and being a man mighty in prayer, and strong in faith, God by him kindled that fire which all the world shall never be able to quench.</p></blockquote>

<blockquote><p>…for the truth is, even sins (if we speak accurately) are not scandalous actum secundo [in the following exercise of the act], in regard of our corruption: our sins may sad[den] the [righteous] angels, but they are not properly scandalous to [righteous] angels [because they do not tempt them to sin, though it may perhaps tempt devils to sin further]…</p></blockquote>

</figure><figure class="quote" id="q-184206b48c" data-kw="">
<blockquote><p>I believe indeed that these men do auoid offenses, to wit, offenses of the world, that they would not be any offense unto tyrants and antichrists… But these be not the offenses which Christ taught to be avoided when He says of the scribes and Pharisees, ‘Let them alone, they are blind, and leaders of the blind.’ What offenses then be dissallowed?… Yea, and the weaker brethren newly conuerted unto the Gospel… But we ought (say they) to bear with the weak ones, and sometimes to frame ourselues unto them… Wherefore somewhat must be done for their weakeness’s sake: as Paul in his epistle to the Romans faithfully gave advise. We grant that somewhat must be consented to for their sakes that be so weak: howbeit… Yea, we must not always bear with the weak ones in those indifferent things, except in the meantime, while they may be the better and more perfectly taught. But when they once understand the thing, and yet nevertheless stick fast in their opinion, their weakeness is not to be nourished. Moreover, we must not so much bear with them, as by our example we should hurt others and also many members of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places</cite>, (), bk. 2, ch. 4, sect. 32-33, p. 321</span></figcaption>

<main class="wrap"><figure class="quote" id="q-48f335cd21" data-kw="">
<blockquote><p>It’s not uncommon to hear some people appeal to James 2:24 in order to argue that God saves people by faith plus works. In particular, some argue against the doctrine of justification by faith alone by appealing to this verse. They tend to pit Paul, who writes that we are justified by faith and not works, against James, who apparently writes that we are justified by faith plus works. This raises the question, who is right? What are we to believe? Are Paul and James actually at odds with each other? No, they are not. …Simply put, although they are using the same verb, justification (in Greek it is also the same verb, dikaioō), they are using it differently. Paul is using it in its legal declarative sense, but James is using it in an evidential sense. They are complementing each other, not opposing each other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rowlands.html">Daniel Rowlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Works in the Book of James—‘Fruits and Evidences of a True and Lively Faith,’” Beautiful Christian Life, September 9</cite>, 2020.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<blockquote><p>Justification takes place once for all. It is not repeated, neither is it a process; it is complete at once and for all time. There is no more or less in justification; man is either fully justified, or he is not justified at all. In distinction from it sanctification is a continuous process, which is never completed in this life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Grand Rapids, MI: Wm. B. Eerdmans Publishing Co., 1938), 513–14.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-1a44850229" data-kw="">
<blockquote><p>Question: Can any man be justified before he does actually believe? Answer: If we take justification in the first, most proper and principal sense, as it is the act of God alone, communicating Christ’s righteousness and satisfaction to his elect, when He does first unite them to Christ by his Spirit, and make Christ theirs with all his treasures: then it must be granted that men may be and are justified, before and without any express act of believing. As for example: elect infants which die in their infancy, when they are regenerated and united to Christ by his Spirit, they have communion of his righteousness and are justified and made righteous, and all their sins are abolished and blotted out; and yet they do not actually believe, nor perform any explicit and express act of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Key of Saving Knowledge, Opening out of the Holy Scriptures the Right Way &amp; Straight Passage to Eternal Life</cite>, … (London: Badger, 1641), pp. 79-82</span></figcaption>

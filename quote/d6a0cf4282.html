<main class="wrap"><figure class="quote" id="q-d6a0cf4282" data-kw="">
<blockquote><p>The old despotic Stuarts were tolerable adepts in the art of kingcraft, and knew well what they were doing when they backed with their authority The Book of Sports. The merry, unthinking serfs who, early in the reign of Charles I., danced on Sabbaths round the Maypole, were afterwards the ready tools of despotism, and fought that England might be enslaved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pastoral Letter on the Observance of the Sabbath (1855) in Miscellanies of Rev. Thomas E. Peck</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9aec2c78b0" data-kw="">
<blockquote><p>[Col. 2] verse. 17, What should we do with the shadow, when we have the body? another, verse 20, Why should we be subject to human ordinances, since through Christ we are dead to them, and have nothing ado with them?… …whereas it might bee thought, that the apostle does not condemn all holy-days, because both he permits others to observe days, Rom. 14:5, and he himself also did observe one of the Jewish feasts, Acts 18:21. It is easily answered that our holy-days have no warrant from these places… …that which the apostle either said or did hereanent, is to be expounded and understood of bearing with the weak Jews, whom he permitted to esteeme one day above another, and for whose cause he did in his own practice, thus far apply himself to their infirmity at [???] time, when they could not possibly be as yet fully and throughly instructed concerning Christian liberty and the abrogation of the Ceremonial Law, because the Gospel was as yet not fully propagated: and when the Mosaical rites were like a dead man not yet buried, as Augustine’s simile runs. So that all this can make nothing for holy-days after the full promulgation of the Gospel, and after that the Jewish ceremonies are not only dead, but also buried, and so deadly to be used by us. Hence it is, that the apostle will not bear with the observation days in Christian Churches, who have known God as he speaks.</p></blockquote>

<blockquote><p>Our Savior also had a law for the strict observation of the Sabbath day, yet when it came in competition with greater, such as those that concerned the propagation of the Gospel, and the necessary refreshment of his disciples, who had attended Him from place to place, to the neglect of their bodily sustenance, he urges it not, but justifies them in the nonobservance of it. Nay, he did not only make that law to give place to the preaching of the Gospel and the necessary refreshment of his Disciples, but the helping of an ox or an ass out of the ditch.</p></blockquote>

</figure><figure class="quote" id="q-50e9332d21" data-kw="">
<blockquote><p>My partaking in any divine worship which is holy and good for the matter, and allowable or passable for the mode in the main, does not involve me in the blame of some sinful defects therein, to which I consent not, and which I cannot redress.

2. I do not acquiesce in this form of worship only, nor do I by my example induce others so to do, seeing in other congregations I both dispense and attend upon the Word and prayer in another form, and judge it necessary for me so to do.

3. It is to me indubitable that this form is so far profitable and edifying, as that merely for the defects found therein, there is no cause of renouncing it or the communion of the Churches for its sake, especially while other prayer and the preaching of the Word is not there by excluded. … I would give no occasion to any of disowning or reproaching a form of divine worship which is sound in the substance thereof, and accepted of God from the sincere, though it be less perfect in diverse material points and less convenient for the mode.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity</cite>, ... (London: 1683), The Nonconformists Plea for Lay-Communion with the Church of England, pp. 6-7, 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-1e28bc30b0" data-kw="">
<blockquote><p>Alas! Sirs, you may make a shift to pass through this world unsuspected; many Moralists, yea, Christians, may subscribe their Names to your Testimonial, and give you the Right Hand of fellowship in this world, when you must be set at the Left in the next: Things will not then be carried as they are now. Deal faithfully with God and your own Souls; see you have the Root of the Matter, the Life of Grace: you may herd amongst the Sheep now, and be found amongst Goats at last.

A King will give his Subjects liberty to travel into another King’s Dominions, reserving their Loyalty to their own King: Papists in Queen Elizabeth’s days, being commanded to go to Church, or be punished, sent to the Pope for a Resolution of this Case of Conscience: His Answer was, They might comply; but Fili, da mihi cor, My Son, give me thy Heart: Thus the Devil will give you leave to read, pray, hear, receive, attend on Ordinances; but as long as he hath you fast by the Heart-strings, you are still his Slaves, none of God’s Servants: for the Soul is the Man: As a man thinketh in his Heart, so is he, Prov. 23.7.

As a man’s Principles are stated, so he receives his denomination, a good or a bad, a Jew, or an Heathen; a Saint or a Bruit. If you have a Beast’s Heart in the shape of a Man, God will esteem you no better than a Beast. And it’s an usual Saying, It is better be a Beast, than be like a Beast. It is the Saying of a Learned Man. Some make the Image of the Living God hewn out of the Stock of a dead Tree: But the New Creature is not such a lifeless thing as many imagine: It is the Spirit of power, of love, and of a sound mind, 2 Tim. 17.

This Text, (saith a good Divine) doth express the three parts of God’s Image in the New Creature … certainly this vital Principle hath strong and vigorous motions God-wards, and against Sin; It’s an holy Spark, working upwards to God, and forwards straight for Heaven: Most Professors are mistaken in this great Work; though Ministers are oft calling on you Sinners to look about you, we tell you, there’s a Cheat in the case, Satan is busy to lay his Brats in God’s Bed.

Counterfeit Coin is common; our Warnings now will be thought of, these frequent Summons will ring in your Ears, our Sermons will have a Repetition in this, or in another world: Conscience will gall you, and you cannot plead Ignorance, or say, [non putâram] I thought not of such a day. How often do we tell you of the danger of dying in your old state, and of that Sulphurous Lake, that thousands are scolded in that once lived as securely as you now do, and they are in an hopeless, helpless Eternity; and how can you tell but this may be the last day? the last warning or overture of Grace, the last knock at your Door? God may say, Away, be gone out of my sight, take him, Devil, I will no more be troubled with such a Miscreant.

But if after all this, you be senseless, and lie still while you are nailed in your Coffin, you are dead, twice dead; and this Security is a confutation of that Principle, that Adam and his Posterity by the Fall, is not dead, but sleepeth, or only in a swound and languor, but life is in him: No, no, this sad Stupor or Spiritual Lethargy, shews it’s not an excitation of a principle, but an infusion of new Life: all our shouting, and rubbing, and pricking, will not recover Sinners; we must leave them to a creating Power, and to him that can raise the Dead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-heywood.html">Oliver Heywood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A new creature: or, A short discourse, opening the nature, properties, and necessity of the great work of the new creation upon the souls of men. Being some plain discourses on Galatians vi. 15</cite>, (London: Tho. Parkhurst, 1695), iii-v.</span></figcaption>

— Oliver Heywood, A new creature: or, A short discourse, opening the nature, properties, and necessity of the great work of the new creation upon the souls of men. Being some plain discourses on Galatians vi. 15, (London: Tho. Parkhurst, 1695), iii-v.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlas%21+Sirs%2C+you+may+make+a+shift+to+pass+through+this+world+unsuspected%3B+many+Moralists%2C+yea%2C+Christians%2C+may+subscribe+their+Names+to+your+Testimonial%2C+and+give+you+the+Right+Hand+of+fellowship+in+this+world%2C+when+you+must+be+set+at+the+Left+in+the+next%3A+Things+will+not+then+be+carried+as+they+are+now.+Deal+faithfully+with+God+and+your+own+Souls%3B+see+you+have+the+Root+of+the+Matter%2C+the+Life+of+Grace%3A+you+may+herd+amongst+the+Sheep+now%2C+and+be+found+amongst+Goats+at+last.%0A%0AA+King+will+give+his+Subjects+liberty+to+travel+into+another+King%E2%80%99s+Dominions%2C+reserving+their+Loyalty+to+their+own+King%3A+Papists+in+Queen+Elizabeth%E2%80%99s+days%2C+being+commanded+to+go+to+Church%2C+or+be+punished%2C+sent+to+the+Pope+for+a+Resolution+of+this+Case+of+Conscience%3A+His+Answer+was%2C+They+might+comply%3B+but+Fili%2C+da+mihi+cor%2C+My+Son%2C+give+me+thy+Heart%3A+Thus+the+Devil+will+give+you+leave+to+read%2C+pray%2C+hear%2C+receive%2C+attend+on+Ordinances%3B+but+as+long+as+he+hath+you+fast+by+the+Heart-strings%2C+you+are+still+his+Slaves%2C+none+of+God%E2%80%99s+Servants%3A+for+the+Soul+is+the+Man%3A+As+a+man+thinketh+in+his+Heart%2C+so+is+he%2C+Prov.+23.7.%0A%0AAs+a+man%E2%80%99s+Principles+are+stated%2C+so+he+receives+his+denomination%2C+a+good+or+a+bad%2C+a+Jew%2C+or+an+Heathen%3B+a+Saint+or+a+Bruit.+If+you+have+a+Beast%E2%80%99s+Heart+in+the+shape+of+a+Man%2C+God+will+esteem+you+no+better+than+a+Beast.+And+it%E2%80%99s+an+usual+Saying%2C+It+is+better+be+a+Beast%2C+than+be+like+a+Beast.+It+is+the+Saying+of+a+Learned+Man.+Some+make+the+Image+of+the+Living+God+hewn+out+of+the+Stock+of+a+dead+Tree%3A+But+the+New+Creat

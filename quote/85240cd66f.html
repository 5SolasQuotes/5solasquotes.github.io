<main class="wrap"><figure class="quote" id="q-85240cd66f" data-kw="">
<blockquote><p>But there are churches which also, to a large extent, take worldly expediency as their rule; for in some churches, almost any person will be taken into membership, if he can but pay his way. Members of Secret Societies – such as Freemasons, Orangemen, Good Templars, &amp;c. – are quite welcome, although the whole spirit of the Bible is in direct antagonism to all Secret Societies.

The fundamental principle of that popular order, Freemasons, is in flat opposition to the law of love, as laid down by Christ in the New Testament. Freemasons love and do good to Freemasons; but Christ teaches that we should love and do good to all men. The good Samaritan was good and kind to the man who fell among thieves, although the man was not a Freemason; and neither the man nor the Samaritan knew anything at all about grips, signs, or secret pass-words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the church, and terms of communion: together with the terms of communion of the Reformed Presbyterian Church in Ireland. To which is appended the Cameronian Dream</cite>, (Belfast, 1879), p. 15.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-3a56eab2b9" data-kw="">
<blockquote><p>…the controversy of our ceremonies; the sparkles of which difference have grown unto great flames in this our [Anglican] Church. Where the fault is, as God knows, so the day will try and God will one day judge. But difference of apprehensions has brought forth difference of judgments, and difference of judgments has brought forth difference of practice and disagreement in affection. The difference of practice has moved [civil / Church] Authority to silence and suppress refusers of conformity: The disagreement in affection, has moved the ministers deprived to speak evil of persons in authority and of conformers: Whereby in the event, the course of the Gospel is interrupted, and [the course] of Popery enlarged; the friends of Sion are grieved, the enemies reioiced, the Devil gratified, and God not pleased. The Church is rent with schism, the truth scandalized by dissention, and the ministers undone by loss of living, and the unity of brethren living in the same house, professing the same Faith, and rejoicing in the same hope, is pulled in pieces: And this [is] like[ly] to continue God knows how long; but all men know: the longer the worse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘To the Reader’ no page number</span></figcaption>

<blockquote><p>Sir Robert Hamilton remained the central figure in the United Societies until his death in 1701, even though there is no record that he was ever ordained to any office. The Societies then remained without a designated leader, or any ministerial oversight, until 1706 when John Macmillan, a deposed minister from the Church of Scotland, was called as their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/justin-stodghill.html">Justin Stodghill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Alexander Shields’ Response to Sir Robert Hamilton in 1690” Scottish Reformation Society Historical Journal 7</cite>, (2017), pp. 73-103</span></figcaption>

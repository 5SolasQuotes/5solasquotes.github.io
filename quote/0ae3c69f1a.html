<blockquote><p>The Lord’s Supper is justly considered as peculiarly solemn. All the ordinances of God are holy, as they have a holy God for their author, are to be observed in a holy manner, and are appointed means of promoting holiness. Yet an ordinance may be said to be more solemn in respect of the more sensible manifestation which God makes therein of his glory, in respect of the peculiarly awful warning which He gives against a rash and inconsiderate manner of intermeddling with it, in respect of the variety of holy exercises which concur in the right observation of it, and, lastly, in respect of the more full and public representation of the communion which the people of God have with his whole Church. That the Lord’s Supper has a greater solemnity in these respects than some other ordinances, seems to have been hitherto the sense of the whole New Testament Church. This is expressed by the judicious Mr. Durham, in the first of his communion sermons [The Unsearchable Riches of Christ (1685), A Preparation Sermon, pp. 4-5], where, speaking of the words of institution, he says: ‘Every circumstance speaks out a solemnity in this ordinance, as the night in which it was instituted, the same night in which He was betrayed, and his jealousy of and threatening for the abuse of this ordinance. The Lord’s Supper seems dignified with an eminence above all other gospel ordinances: 1st, in reference to what it exhibits. They all set forth love, but this sets forth love in an eminent degree, for it sets forth the Lord’s death, wherein the most eminent degree of his love shines. It sets forth the great masterpiece of his love, his actual dying. 2ndly, in respect of the excellent benefits communicated in it. It is true there is no other thing, on the matter, communicated in it, than in the Word and baptism; yet if ye look to the words, ‘Take, eat, this is my body’, they hold forth Christ Jesus not so much giving any particular gift, as actually conferring Himself in his death and suffering. 3rdly, in respect of the manner in which our Lord Jesus makes over Himself: For there is herein not only a most clear view of the slain Savior, and of covenanting with God, but also a clear glance of heaven upon earth, Jesus Christ and his people mixing (so to speak) and being familiar together; He condescending not only to keep company with them, but to be their food and refreshment, and giving not only the Word to their faith, but Himself (as it were) to their sense! Insofar as the mean, whereby He communicates Himself, is more sensible; it is by his Spirit that the mean is made effectual. There is not only a fixedness of faith on our part, but a sort of divineness in the ordinance itself, as it were, to the very senses of the believer. ‘I say unto you,’ says our Lord, ‘I will not drink henceforth of the fruit of the vine, until the day when I shall drink it new with you in my Father’s kingdom,’ where He seems to point out, that in this ordinance, He has a more special way of keeping communion with his people, bearing a resemblance to that which He will have with them in Heaven.’ That there is a peculliar solemnity in the partaking of the Lord’s Supper, appears from the concurrence of duties requisite to the right performance of it. ‘If it be a great and difficult work,’ adds the same eminent divine: ‘to carry rightly on an ordinary Sabbath, or in prayer, or in meditation, how difficult must communicating be, in which we ought to have all these joined together/’ If all religious duties were equally solemn, then they would all alike require preparation. An ejaculatory prayer, for example, would require another duty to prepare for it; and that duty would require another, and so on without end. The Old Testament Church had more solemn days, such as that on which the children of Israel stood before the Lord in Horeb. And there were to be such days under the New Testament dispensation also. Hence, in the vision, which we have in the latter part of the prophecy of Ezekiel, and which judicious interpreters allow to be an emblematical representation of the New Testament Church, we have an account of the observation of such solemnities as the Passover and the Feast of Tabernacles, Eze. 45:21,25. And surely sacramental occasions may be said to be such times. A person that duly consideres these things, will not be easily persuaded, that there ought to be no more solemnity in the breaking of the sacramental bread, than in asking a blessing at our ordinary meals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-anderson.html">John Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of Humiliation Days Before &amp; Thanksgiving Days After the Administration of the Lord’s Supper’</cite>, pp. 302-305 in Vindiciae Cantus Dominici… (Philadelphia, 1800)</span></figcaption>

<blockquote><p>…Hosea, ch. 6:6, where a general reason is intimated, that a ceremony of the Levitical Law must not hinder a necessary duty of the moral law. Therefore his conversing with them for their edification was not unlawful nor uncomely, for all rituals must give way to morals… these words are brought not only to vindicate this fact of Christ, but secretly to tax the Pharisaical hypocrisy of those who place religion in rituals more than morals.</p></blockquote>

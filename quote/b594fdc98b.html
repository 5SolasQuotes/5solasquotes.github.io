<main class="wrap"><figure class="quote" id="q-b594fdc98b" data-kw="">
<blockquote><p>Before there was a written word, the Triune God spake unto men through revelations, visions, dreams and audible voices; but now that the complete word is written, these have ceased; God and Christ now speak only through the given Word, which being impressed by the Holy Spirit upon the heart, is powerful unto the salvation of the elect.

We must not become carried away with the enthusiasts and despise the Word, as alas! many do; but the Word, the written Word must be precious unto us; thereby we must walk, thereby alone proving all things, taking heed thereto as unto a light that shineth in a dark place; all experiences which are not through, agreeable to, and in unison with the Word, are but suggestions of the devil, pure imaginations and idle fancies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-comrie.html">Alexander Comrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ABC of Faith</cite>, trans. J. Marcus Banfield (1746; Ossett: Zoar Publications, 1978), pp 118-19.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2607b37625" data-kw="">
<blockquote><p>Having observed that the word of God is the test which discriminates between his true worship and that which is false and vitiated, we thence readily infer that the whole form of divine worship in general use in the present day is nothing but mere corruption. For men pay no regard to what God has commanded, or to what he approves, in order that they may serve him in a becoming manner, but assume to themselves a license of devising modes of worship, and afterwards, obtruding them upon him as a substitute for obedience.

If in what I say I seem to exaggerate, let an examination be made of all the acts by which the generality suppose that they worship God. I dare scarcely accept a tenth part as not the random offspring of their own brain. What more would we? God rejects, condemns, abominates all fictitious worship, and employs his Word as a bridle to keep us in unqualified obedience.

When shaking off this yoke, we wander after our own fictions, and offer to him a worship, the work of human rashness; how much soever it may delight ourselves, in his sight it is vain trifling, nay, vileness and pollution. The advocates of human traditions paint them in fair and gaudy colours; and Paul certainly admits that they carry with them a show of wisdom; but as God values obedience more than all sacrifices, it ought to be sufficient for the rejection of any mode of worship, that it is not sanctioned by the command of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Reforming the Church, Presented to the Imperial Diet at Spires, A.D. 1544, in the name of all who want Christ to Reign</cite>, (1544) in Tracts and Letters relating to the Reformation, trans and ed. Henry Beveridge, (7 vols, Edinburgh: Calvin Translation Society, 1844), 1: 132-33.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>We have another example of reverence given to such rulers, even in things that were done by them wrongfully. For Jeremiah, being for a time suspended from coming into the Temple, being at liberty, would not (lest, as it seems, he should make a tumult) enter the Temple; and therefore (having written that which he had to say) sent Baruch to read his sermon in the Temple.</p></blockquote>

</figure><figure class="quote" id="q-488e797d7c" data-kw="">
<blockquote><p>The more natural and simple the wine is, the more pure it is; mixtures do but adulterate it. The more simple the worship of God is — I speak of gospel simplicity and order — the more pure it is; human inventions and mixtures may abase it, they cannot adorn it. God’s altar under the law must be of earth; ‘If thou lift up a tool upon it, thou hast polluted it,’ Exod. xx. 24, 25. Men are apt to think, that by lifting up tools on God’s altar they polish it, but God himself saith they pollute it.

When the church was in her infancy, she was dressed in the swaddling clothes of ceremonies; but since she is grown up, God hath provided her other attire. To the Jews, the Sun of righteousness was behind, and therefore the shadow of those ceremonies was before. They were in force and power; but to us Gentiles the Sun of righteousness is before, and therefore the shadow of ceremonies is behind. When Christ came, those shadows seemed to say, as the angels to Jacob, ‘Let us go, for the day breaketh,’ Gen. xxxii. 26; at the death of Christ the veil of the temple was rent in twain from the top to the bottom, to acquaint us that the Jewish ceremonies must then vanish, Mat. xxvii. 51.

Reader, I would not be mistaken; I do not advise thee against that order and decency which is commanded in the worship of God, nor against active obedience to authority in things that are circumstantial, or not directly nor consequentially forbidden in Scripture, but I would counsel thee to beware, lest, like the dog in the fable, whilst thou art snapping at any shadow, thou dost not lose the substance; and withal I must tell thee, that as when the shadows grow long, it is a sign the sun is declining, so when those shadows, those even indifferent things increase, usually the substance, the light of holiness, decreaseth.

When corn runs out into straw and chaff, those that feed on it may well be thin and lean; but when it runs into ear and kernel, thou mayest expect such as eat of it to be fat and well-favoured: when religion runs into formalities and ceremonies, her followers can never be thriving spiritually — they may starve, for all the gaudy flowers wherewith the several dishes on her table are decked and set forth; it is the power of godliness alone, which, like wholesome and substantial food, will distribute nourishment and strength to the inner man.

I expect nourishment from bread, not from straw or stones, because God hath annexed his blessing to the former, not to the latter. I look for spiritual strength from divine institutions, not from human inventions, because God’s promise is made to word-worship, not to will-worship. One would think the sparks of that fire wherewith Aaron’s sons were consumed should fly in the faces of men, and make them afraid to offer up to the Lord what he commanded them not, Lev. x. 1, 2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling</cite>, (1661-65) in The Works of George Swinnock, M.A. (5 vols, Edinburgh: James Nichol, 1868), 1: 81-82.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>The church historian Eusebius declared himself in the strongest manner against images of Christ in a letter to the empress Constantia (the widow of Licinius and sister of Constantine), who had asked him for such an image. Christ, says he, has laid aside His earthly servant-form, and Paul exhorts us to cleave no longer to the sensible; and the transcendent glory of His heavenly body cannot be conceived nor represented by man; besides, the second commandment forbids the making to ourselves any likeness of anything in heaven or in earth. He had taken away from a lady an image of Christ and of Paul, lest it should seem as if Christians, like the idolaters, carried their God about in images.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-816c143814" data-kw="">
<blockquote><p>But the problem is that many people today do not read books with a desire to learn, whatever they may be about, but rather seek to find something to attack. And if they are able to quibble over a single word, it acts as a stumbling block that prevents them from benefiting in any way at all. Then ignoring all the good in the book, they pride themselves in a way that causes their downfall. Even worse, the most ignorant are the most outspoken and critical. Others are so finicky that a single detail can put them right off, so much so that a single sentence that is not to their taste turns them away from the book as a whole, even though it may contain a great deal that they would be well advised to dwell upon.

It is no doubt a trick of the devil to turn them aside and stop them from receiving sound doctrine presented them. So those who would reap any profit from this book should cultivate a teachable spirit, putting aside anything that is an obstacle to progress, so that they might advance on the straight path that leads towards the pure truth of God, the only thing we are called to hold to, using those human means to help us reach that goal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preface to the French translation of Philip Melancthon, Loci Communes (1546), trans. Alison Wells, ed. Paul Wells, available from: https://uniocc.com/archive/download_article/107</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-e9f016fc63" data-kw="">
<blockquote><p>As for the vails wherewith the apostle would have women covered while as they were praying (that is in their hearts following the public and common prayer) or prophesying (that is singing, 1 Sam. 10:10; 1 Chron. 25:1), they are worthy to be covered with shame as with a garment, who allege this example for sacred significant ceremonies of human institution. This covering was a moral sign for that comely and orderly distinction of men and women, which civil decency required in all their meetings: wherefore that distinction of habits [garments], which they used for decency and comeliness in their common behavior and conversation, the apostle will have them, for the same decency and comeliness, still to retain in their holy assemblies. And further the apostle shows that it is also a natural sign, and that nature itself teaches it: therefore he urges it both by the inferiority or subjection of the woman, verses 3, 8, 9 (for covering was then a sign of subjection), and by the long hair which nature gives to a woman, verse 15, where he would have the artificial covering to be fashioned in imitation of the natural. What need we [argue] any more? Let us see nature’s institution or the apostles’ recommendation for the controverted [English-Popish] ceremonies (as we have seen them for women’s vails) and we yield the argument.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | 3rd Part, ‘Against the Lawfulness of the Ceremonies’ | ch. 5, ‘The 5th Argument… taken from the mystical &amp; significant nature of them’, pp. 90-91</span></figcaption>

</figure><figure class="quote" id="q-6bf0d74b86" data-kw="">
<blockquote><p>In an article on the Sabbath Alliance, the Free Church Magazine, edited by William M. Hetherington, warned that Sabbath-desecration would lead to the oppression of the working classes as they would no longer be guaranteed a day’s rest from their labours. This extract is therefore useful for reminding us that the first and second tables of the law cannot really be separated. Those who force their employees to work on the Lord’s Day are not loving their neighbours, and so their Sabbath-breaking is not only a sin against God but also a sin against their fellow-man:

We are delighted to hear that there is an active-movement began amongst the working classes on the subject. They have, of course, the most manifest interest in the protection of the Lord’s-day. It secures to them, by divine and human right, fifty-two whole days of rest out of the three hundred and sixty-five. Take these away from them, and they are reduced to the position of the veriest slaves, nay, to a position more degraded than that of any slaves in the world, and that without one farthing of compensation; for it is clear that they would get precisely the same wages for working six. But if the present course is unresisted, all labouring people will soon lose their Sabbaths. Railway officials are first employed, and already they feel the intolerable hardship. But why not also masons and labourers (as had already been the case in some parts of England), if the contractor has a piece of work to finish? The post-office officials at present work on Sabbath; but why not the bakers, as in London? Why not the carpenters? Why not the millers, as at Canonmills? In a word, there is no point to halt at, if the authority of the divine law is disregarded, and nothing will do but a determined combination to put down all public forms of Sabbath desecration. We rejoice, therefore, to find the working people taking up the question, and we shall be happy to record, from time to time, and to promote in every way, the success of this noble enterprise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/free-church-magazine.html">Free Church Magazine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Sabbath Alliance’ in Free Church Magazine</cite>, iv, no. 47 (Nov. 1847), pp 337-8.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-80cf1e0a6c" data-kw="">
<blockquote><p>The presbyter is the same as the bishop, and before parties had been raised up in religion by the provocations of Satan, the churches were governed by the Senate of the presbyters. But as each one sought to appropriate to himself those whom he had baptized, instead of leading them to Christ, it was appointed that one of the presbyters, elected by his colleagues, should be set over all the others, and have chief supervision over the general well-being of the community. . . Without doubt it is the duty of the presbyters to bear in mind that by the discipline of the Church they are subordinated to him who has been given them as their head, but it is fitting that the bishops, on their side, do not forget that if they are set over the presbyters, it is the result of tradition, and not by the fact of a particular institution by the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Titus</cite>, 1:7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-58da2d3e5c" data-kw="">
<blockquote><p>Furthermore, our theologians believe that churches should be free to send and delegate to councils even private individuals, provided they are pious, learned, and knowledgeable in ecclesiastical matters, and these, in such a case, can give their vote on proposed matters in common with the pastors and elders. This is also taught and believed by Whitaker in Controversy 3, On Councils, question 3, the illustrious Moses Amyraut in his Theses on Councils, part 2, Wendelin in Christian Theology, book 1, chapter 28, thesis 31, Bucanus in place 43, number 23, and Tilenus in Disputations on Councils, 1, and many others. Hence, it is evident what the status of this controversy with the modern Pontiffs is, namely, whether only bishops have a decisive vote in councils, which the Pontiffs affirm, or whether the same right belongs to any delegates of the churches, whether they are pastors or from other governors of the Church, or even otherwise private individuals, which our theologians teach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, 2. ‘Who are to be called to councils, and of what kind of persons they should consist’ in Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), Posthumous Works, 4. Controversies on Councils, pp. 1029-31 Latin, p. 1,031</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/the-ruling-of-the-church#:~:text=Furthermore%2C%20our%20theologians%20believe%20that%20churches,private%20individuals%2C%20which%20our%20theologians%20teach&amp;text=Furthermore%2C%20our%20theologians%20believe%20that%20churches%20should%20be&amp;text=even%20otherwise%20private%20individuals%2C%20which%20our%20theologians%20teach" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-74c6e5c787" data-kw="">
<blockquote><p>2. I grant the whole, and yet nothing is concluded against us. For the power of the keys is not given to the catholic presbytery as to the first subject, to be a mean of edification in an ordinary and constant way; but only in an extraordinary and occasional way, in those things which concern the power of jurisdiction belonging to the whole catholic Church. By ‘extraordinary’ here, I mean not that which is against a particular law of God, and cannot be done without a divine dispensation of providence, but by ‘extraordinary’ I mean that which is raro contingens, and does not oft fall out; as almost it never falls out that the universal Church has need to excommunicate a national Church, for all and every one of a national Church do never fall away from the faith. Yet a remote power for excommunication is in the catholic visible Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644) | pt. 1, p. 299</span></figcaption>

<blockquote><p>Baillie’s Letters made clear his aversion to the re-established episcopate [of 1661]: he condemned the restored bishop both in admonitory correspondence to nobles and directly to the new Glaswegian metropolitan, Andrew Fairfoul. Whilst Baillie did not quietly acquiesce to the restoration church settlement, his decision to accept the office of principal of Glasgow University suggests that he had decided to privilege public order over the pursuit of presbyterian reforms at all costs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-campbell.html">Alexander Campbell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Episcopacy in the Mind of Robert Baillie</cite>, 1637-1662’ The Scottish Historical Review, vol. 93, no. 236, pt. 1 (April 2014), pp. 29-55, p. 47</span></figcaption>

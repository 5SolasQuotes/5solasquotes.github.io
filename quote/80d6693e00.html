<main class="wrap"><figure class="quote" id="q-80d6693e00" data-kw="">
<blockquote><p>These views of the anti-scriptural character of patronage, and its incompatibility with the government which Christ has instituted in his Church, will in some measure be confirmed and established when we consider that Christ calls his Church a Kingdom, as in that passage in which he declares in answer to Pilate “My kingdom is not of this world.” There can be no doubt from the circumstance in which this statement was made, that by his kingdom Christ meant his Church upon the earth, and that not merely in their individual capacity, but as associated together, and formed into a society regulated by distinct laws. This name which he gives to his Church presupposes that it is entirely free and independent in its government.

That is not a kingdom in any proper sense of the term whose laws are prescribed by those who do not belong to it, or whose officers are nominated by a foreign power. When this is the case, it loses the character of a kingdom, and becomes a province or colony of some more extensive and powerful empire. Now, we could desire no better proof of the anti-scriptural nature of patronage, than is derived from the name which Christ here bestows upon his Church. Patronage may accord with the views of those who regard the Church as a mere engine of state policy, and its Ministers as a kind of moral police, for training the populace to habits of order and good citizenship; but it is utterly irreconcilable with the idea that the Church is a kingdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Scriptural Argument Against Patronage</cite>, (Edinburgh: John Johnstone, 1842), p. 19.</span></figcaption>

<blockquote><p>III. …acts of divine worship are twofold, some which do not differ from the worship itself (to wit, from piety and holiness, in which worship essentially consists); others ordinated to worship as helps or instruments to perform that worship suitably and declare it abroad. The former kind of acts can be instituted and commanded of God alone, who is the sole chief and legislator, who has dominion over the conscience; nor does any right belong to the church of adding, taking away or changing anything. The latter, again, are either necessary and so also instituted by God, at least as to being (to on)–for example that assemblies should be held, the word preached, the sacraments administered; others are contingent and free as to quality (to poion), the reason of which depends upon the honesty and fitness of particular churches (to wit, that assemblies should be held in this or that time and place and the sacraments administered). The former, as being necessary, depend upon God alone and the church has no control or power over them; the latter God has thus far left to the will of the church as means and indifferent, so that a regard be always paid to divine truth., Christian simplicity and public edification. … XIX. The object of this directive power is not the doctrine itself of faith and worship (which rests upon the Word of God alone), but other things concerning which the express Word of God is not given, which are either merely indifferent and free or ambiguous and doubtful, concerning which God has delivered nothing certain in particular, such as was the case about which the apostle speaks in 1 Cor. 7:10,12, or which refer to the mode of external worship, or the determination of the circumstances, without which the precepts of the first table and the public exercises of piety in ecclesiastical assemblies scarcely and not even scarcely can be rightly observed and performed. Here pertain the time, place, form and rule of prayers, addresses, of the administration of the sacraments, fasts, alms-giving: all of which ought to be established and exercised not with confusion, but rightly and decently (euschemonos) for the edification of the church. Since these in themselves are indifferent and do not directly touch the mystery of our salvation, they do not of themselves bind the conscience, nor yet are they so fixed and immovable that they may not be reformed and changed where the use of the church shall demand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 3, pp. 286 &amp; 290 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church</span></figcaption>

<blockquote><p>There are a great many young men merchants who come from your parts, soberly (I believe) educated &amp; brought up at home, who, when they arrive here, are mere rakes, stop or stand at no sin or vice almost that falls in their way, swearing whoring Sabbath breaking drunkenness are as common vices, with a great many of them, as if they thought there was no evil in the commission of any of these; and as to their countenance of ministers that are of the principles of the church of Scotland, they are so far from it that they carry as if they were ashamed of their mother Church her principles &amp; ways, whatever is the religion of their pot &amp; lascivious companions that is theirs.

So that really a great many of them (yet are some, though very few, exceptions) are a perfect scandal to all religion &amp; a disgrace to that part of the world from whence they come, from which other &amp; better things had been here expected; I am sure if the parents &amp; principals of some of them knew their carriage &amp; behaviour in these parts it would be matter of very great sorrow &amp; grief to them. I propose this not out of any disregard I have to them, I am sure it is out of love to their souls.

I am glad to see my countrymen in these parts, neither do I speak so because of any particular affront or incivility received. I never met with any such, from any of them, but on the contrary, with very much civility &amp; respect, But I propose it, that some method might be fallen upon whereby this dreadful &amp; offensive grievance might be rectified. Query whether or not their parents &amp; employers could not oblige them to bring certificates of their inoffensive behaviour during their abode in these parts from ministers here to their own ministers &amp;c. at home.</p></blockquote>

ry+whether+or+not+their+parents+%26+employers+could+not+oblige+them+to+bring+certificates+of+their+inoffensive+behaviour+during+their+abode+in+these+parts+from+ministers+here+to+their+own+ministers+%26c.+at+home.%E2%80%9D%0A%0A%E2%80%94+James+Anderson%2C+Letter+to+Principal+John+Sterling%2C+Newcastle+upon+Delaware%2C+August+1716+in+Charles+Augustus+Briggs%2C+American+Presbyterianism%3A+Its+Origin+and+Early+History%2C+Together+with+an+Appendix+of+Letters+and+Documents+of+which+have+been+Recently+Discovered+%28New+York%3A+Charles+Scribner%E2%80%99s+Sons%2C+1885%29%2C+lxxii-iii.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f49634363.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6f49634363.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/12/26/james-anderson-on-the-godlessness-of-scottish-presbyterian-migrants-to-america/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

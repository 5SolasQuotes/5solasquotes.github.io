<main class="wrap"><figure class="quote" id="q-3515a30cb9" data-kw="">
<blockquote><p>The Effectual Concurse of the first Cause with the second, is an external transient influence of God, upon the creature in time, exactly answering to the Decree of God before time: moving upon, co-working with, and assisting of the second cause to its operations. It is the clearer understood by considering on God’s part the Decree, which is an immanent and eternal act abiding in God; and his efficiency, which is an external and passing act put forth upon the creature in time.

For the better understanding of the Concurse, Co-operation, and Co-working of the first cause, so far as it concerneth man (which also is respectively applicable to other Subjects) there are considerable two acts in respect of God, viz. an immanent and transient act: and two acts in respect of the soul; viz. a first, and a second act. The immanent, and as it were indwelling Act in God, is his Decree: eternal, increated, and before time. The transient Act of God’s Efficiency, is a created, external, passing Act of the Spirit of God upon the soul in time touching man. The first act, is an active Principle, or inherent Habit in the soul. The operation is the second act, proceeding from that Habit.

The Concurse of the first cause, is unto the active principle in the second cause; as the first mover is unto the inferior Orbes: as an impulse, thrust, or put on, is unto a round body, of it self propense to rowl: as the Nurses lifting the child up the stairs, is unto the child inclined to go up; or as the leading power, put forth of him that goeth before, is to him that is inclined to follow after: as the Midwife is unto the deliverance of her that is in travail; as the wind is unto a vessel under sail, and ready upon the motion of the stream to launch forth: as light is to an open eye, yet in the dark.

The Necessity of the concurrence of the first cause with the second in the operations thereof, appears thus. All creatures depend upon God in respect of their Being, Conservation, and Operation: For in him we live, and move, and have our being, Acts 17.28. We have our being, there is our dependence in respect of our Creation; we live, there is our dependence in respect of our Conservation; we move, there is our dependence in respect of our Operation. Creatures depend no less upon God in respect of operations, then in respect of their beings; because the operations of things in both instants, viz. both of being and of operation, are equally beings of participation.

2. From the perfection of the first Cause; such is the nature of the first Cause being God, and the nature of the second cause being a creature, as that thence necessarily followeth the amplitude of Perfection in the first Cause, and a universal and subordinate dependence in the second cause in respect of its efficiency. In this regard Plato called the second causes the instruments of the first Cause; which though in some respect it holdeth not, because instruments (properly so called) have no proper efficiency; yet so far it is a truth, as that every creature universally dependeth more upon God, then any creature upon its fellow-creature.

3. It implieth a contradiction, that the creature should be able to act without dependency upon the Creator. 1. Because the agent being a creature is depending, therefore its power to act is depending; the power of acting holds proportion with the agent. 2. Because the action proceeding from this agent, is a being by participation: it is impossible for the creature to have other then a depending being.

4. As the conserving influence of God is unto the conservation of the creature, so is the assisting influence of God unto the operation of the creature: If God doth but merely cease his conserving influence, the creature ceaseth to be; if God ceaseth his assisting influence, the creature ceaseth to act. The insensible cessation of the influence of the first Cause, without any further violence, or hurt done, puts a period to the being, or stoppeth the operation of the second cause, respectively.</p></blockquote>

<blockquote><p>For that determination of God toward concurring with the secondary cause does not arise from a necessity imposed immediately by the action of the secondary cause, but from the reason of providence, by which the universal first cause must concur with the particular secondary causes. And this is clear from the fact that he concurs in this way with all causes, even the necessary ones, for the common reason of providence. But in the mode of concurring, he exhibits necessary concurrence to natural and necessary causes, and contingent concurrence to contingent and free ones.</p></blockquote>

<blockquote><p>…the opposing position of the Thomists about the physically predetermining quality, as they call it… I agree with them in the matter and differ only in the mode; and because a quality of this kind understood in that way is not found in Saint Thomas; and because through the artifice of adversaries it was introduced into the Thomist school — with them caring less about it because they thought it made no difference to be determined in this or that mode, and afterward quarreling about the act of it, as Zumel admits, in whose writings I found it written; and because, the error being now recognized, that quality is commonly rejected and another kind of determination is received. Concerning which we perhaps agree with them… First I observe that this prior impressed physical quality is altogether rejected by Scotus, as we will show below… That predetermining quality physically is altogether required [according to Thomists] in the free cause in first act for operating, and without it the will cannot be determined to second act; and given it, the will consequently acts and operates with certainty and determination — for it is given for that purpose, so that it may operate. But from this it follows that those in whom it is not impressed cannot operate;</p></blockquote>

</figure><figure class="quote" id="q-fcfddb7a0b" data-kw="Author of sin Permission">
<blockquote><p>God doth not infuse the lust, or excite it, though he doth present the object about which the lust is exercised. God delivered up Christ to the Jews, he presented him to them, but never commanded them to crucify him, nor infused that malice into them, nor quickened it; but he, seeing such a frame, withdrew his restraining grace, and left them to the conduct of their own vitiated wills. … God created the grape, and filled the vine with a sprightliness, but he doth never infuse a drunken frame into a man, or excite it. … In short, though it be by God&#x27;s permission that we can do evil, yet it is not by his inspiration that we will to do evil; that is wholly from ourselves.</p></blockquote>

</figure><figure class="quote" id="q-7826d6ff7b" data-kw="Author of sin Temptation">
<blockquote><p>For understanding this point, how the providence of God reacheth to and is concerned in sinful actions, we are to consider, that God neither puts evil into the hearts of men, nor stirs them up to it: for, says the apostle, Jam. 1:13. &#x27;God cannot be tempted with evil; neither tempteth he any man.&#x27; And therefore he is not the author of sin.</p></blockquote>

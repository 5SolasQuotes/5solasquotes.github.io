<main class="wrap"><figure class="quote" id="q-c2f37f43ab" data-kw="">
<blockquote><p>…I finde this rule [in an epistle of Augustine], that: ‘it is lawful or not lawful to believe or not to believe other witnesses or testimonies besides that of the Scriptures, so far as you see they bear or do not bear weight to make us give more credit to a thing.’ Which being granted, the fact of the Church cannot so confirm this or that to be right and well as that it should be madness to deny it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship… (Amsterdam: Thorp, 1633), ch. 1, section 17</cite>, p. 86</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3098484179" data-kw="">
<blockquote><p>II. The question is not whether faith… is a full and perfect knowledge of mysteries, both as to the reason (to dioti) and the fact (to hoti), so that we ought to believe nothing which we do not clearly and distinctly perceive. For as most gospel mysteries in the greatest degree escape the grasp of the reason, they can never be clearly and distinctly perceived by us as to the wherefore (to dioti) or the how (to pos) or their nature and mode, but only as to the fact because they are truly thus revealed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>15th Topic, 9th Question, ‘Is faith assent without knowledge and can it be defined better by ignorance than by knowledge? We deny against the Romanists.’ in Institutes (P&amp;R), vol. 2</cite>, pp. 564-5</span></figcaption>

</figure><figure class="quote" id="q-4bc6601082" data-kw="">
<blockquote><p>But magistrates as magistrates hold forth in their law-abstinence from those same sins of adultery, incest, murder… 2. Not under the pain of eternal wrath and condemnation, before the Judge of [the] quick and [the] dead: Magistrates as magistrates have neither calling, office, place nor power to threaten or inflict eternal punishment; if magistrates do persuade the equity of abstinence from adultery, incest, murder in their statutes or acts of parliament from the Word of God, from the sixth and seventh command[ments] of the Decalogue, from the Judgment and eternal punishment that follows these sins, they so persuade not as magistrates [from their office per se], but as divines and as godly and Christian men; Yet my sense is not that the magistrate can lawfully command obedience in matters of religion not understood or known by the subjects: that were to exact blind obedience; but my meaning is that the magistrate as the magistrate holds not forth his commandments to teach and inform the conscience, as pastors do, but he presupposes that his mandates are known to be agreeable to the Word of God, and proposes them to the subjects to be obeyed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646)</cite>, p. 550</span></figcaption>

</figure><figure class="quote" id="q-f84e20c164" data-kw="">
<blockquote><p>We are not our own; therefore, neither is our own reason or will to rule our acts and counsels… let us not make it our end to seek what may be agreeable to our carnal nature… we are God’s; let us therefore live and die to Him (Rom. 14:8); We are God’s; therefore, let his wisdom and will preside over all our actions. We are God’s; to Him, then, as the only legitimate end, let every part of our life be directed. O how great the proficiency of him, who taught that he is not his own, has withdrawn the dominion and government of himself from his own reason that he may give them to God. For as the surest source of destruction to men is to obey themselves, so the only haven of safety is to have no other will, no other wisdom, than to follow the Lord wherever He leads. Let this, then, be the first step, to abandon ourselves, and devote the whole energy of our minds to the service of God. By service, I mean not only that which consists in verbal obedience, but that by which the mind, divested of its own carnal feelings, implicitly obeys the call of the Spirit of God. This transformation (which Paul calls the renewing of the mind, Rom. 12:2; Eph. 4:23) though it is the first entrance to life, was unknown to all the philosophers. They give the government of man to reason alone, thinking that she alone is to be listened to; in short, they assign to her the sole direction of the conduct. But Christian philosophy bids her give place and yield complete submission to the Holy Spirit, so that the man himself no longer lives, but Christ lives and reigns in him (Gal. 2:20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes</cite>, bk. 3, ch. 7, section 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

</figure><figure class="quote" id="q-4a2f105d7d" data-kw="">
<blockquote><p>Moreover, as we may not use any indifferent thing at our own pleasure; so neither may the Church at her will and pleasure command the use of it: but as our practice, so the Church’s injunction must be determined and squared according to the former [three] rules [of using indifferent things (1) to the glory of God, (2)according to the law of charity and (3) purity of conscience]. And if any man think, that in the use of things indifferent he may be led and ruled by the Church’s determination without examining any further, let him understand that the Church’s determination is but a subordinate rule, or a rule ruled by higher rules. … He [Dr. Forbes] has been speaking of the rules which God’s Word gives us concerning the use of things indifferent, and all of them he comprehends under this rule, that we should hear the Church and obey them who are set over us, as if God’s rules were subordinate to men’s rules and not theirs to his. We say not that every man may use things indifferent suo arbitratu [according to his judgment]: but we say withal that neither may the Church command the use of things indifferent, suo arbitratu. Both, she in commanding and we in obeying, must be guided by the rules of Scripture. They who are set over us in the Church have no power given them of Christ which is not for edifying, Eph. 4:12. The council of the apostles and elders at Jerusalem (which is a lively pattern of a lawful synod to the world’s end) professed they would lay no other burden upon the disciples except such things as the law of charity made necessary for shunning of scandal: and so that which they decreed had force and strength to bind, a Charitate propter Scandalum [from charity due to scandal], says Sanctius. But suo arbitratu [by their (mere) judgment] they enjoined nothing. It appears by this place (says [Thomas] Cartwright) that there may be no abridgment of liberty simply decreed, but in regard of circumstance, according to the rule of edification. And if the Church’s decrees and canons be not according to the rules of the Word, yet forasmuch as everyone of us shall give account of himself and his own deed, we must look that whatsoever the Church decree, yet our practice in the use or omission of a thing indifferent, be according to the foresaid rules. We may not for the commandment of men transgress the rule of piety by doing anything which is not for God’s glory and ordered according to his will; neither ought any of us to obey men, except for the Lord’s sake and as the servants of Christ, doing the will of God; which teaches us the manner how we ought to obey men, namely, propter Christum et sicut Christus praecipit [for Christ, as Christ commands]. For if we should know no more but the will of man for that which we do, then we should be the servants of men, not the servants of Christ. Neither yet may we for any human ordinance break the rule of charity: but whatsoever either would weaken or not edify our brother, be it never so lawful, never so profitable to ourselves, never so powerfully by earthly authority enjoined, Christians, who are not born unto themselves, but unto Christ, unto his Church and unto the fellow members, must not dare to meddle with it. Nor lastly may we obey men so as to break the Law of Purity, and perform any action with a doubtful conscience, that is, whereof either the Word has not, or we out of it have no warrant: in which case tender consciences must be tendered, rather than be racked by authority: for be the things in themselves never so lawful, etc., they are utterly unlawful to me without such information. Whereas therefore some say that in the use of matters indifferent, the laws of those who are set over us ought to rule us; we still answer that our practice may not be ruled by any law of man except it be according to the rules of the Word; whereof one is this: Tantum oportere esse obedientiae studium in Christianis, ut nihil agant, quod non existiment vel potius certi sint placere Deo (Calvin on Rom. 14:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies... ([Leiden] 1637), pt. 4, ch. 3</cite>, pp. 10-11</span></figcaption>

rding to the rule of edification. And if the Church’s decrees and canons be not according to the rules of the Word, yet forasmuch as everyone of us shall give account of himself and his own deed, we must look that whatsoever the Church decree, yet our practice in the use or omission of a thing indifferent, be according to the foresaid rules. We may not for the commandment of men transgress the rule of piety by doing anything which is not for God’s glory and ordered according to his will; neither ought any of us to obey men, except for the Lord’s sake and as the servants of Christ, doing the will of God; which teaches us the manner how we ought to obey men, namely, propter Christum et sicut Christus praecipit [for Christ, as Christ commands]. For if we should know no more but the will of man for that which we do, then we should be the servants of men, not the servants of Christ. Neither yet may we for any human ordinance break the rule of charity: but whatsoever either would weaken or not edify our brother, be it never so lawful, never so profitable to ourselves, never so powerfully by earthly authority enjoined, Christians, who are not born unto themselves, but unto Christ, unto his Church and unto the fellow members, must not dare to meddle with it. Nor lastly may we obey men so as to break the Law of Purity, and perform any action with a doubtful conscience, that is, whereof either the Word has not, or we out of it have no warrant: in which case tender consciences must be tendered, rather than be racked by authority: for be the things in themselves never so lawful, etc., they are utterly unlawful to me without such information. Whereas therefore some say that in the use of matters indifferent, the laws of those who are set over us ought to rule us; we still answer that our practice may not be ruled by any law of man except it be according to the rules of the Word; whereof one is this: Tantum oportere esse obedientiae studium in Christianis, ut nihil agant, quod non existiment vel potius certi sint placere Deo (Calvin on Rom. 14:5).”

— George Gillespie, A Dispute Against the English-Popish Ceremonies... ([Leiden] 1637), pt. 4, ch. 3, pp. 10-11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMoreover%2C+as+we+may+not+use+any+indifferent+thing+at+our+own+pleasure%3B+so+neither+may+the+Church+at+her+will+and+pleasure+command+the+use+of+it%3A+but+as+our+practice%2C+so+the+Church%E2%80%99s+injunction+must+be+determined+and+squared+according+to+the+former+%5Bthree%5D+rules+%5Bof+using+indifferent+things+%281%29+to+the+glory+of+God%2C+%282%29according+to+the+law+of+charity+and+%283%29+purity+of+conscience%5D.+And+if+any+man+think%2C+that+in+the+use+of+things+indifferent+he+may+be+led+and+ruled+by+the+Church%E2%80%99s+determination+without+examining+any+further%2C+let+him+understand+that+the+Church%E2%80%99s+determination+is+but+a+subordinate+rule%2C+or+a+rule+ruled+by+higher+rules.+%E2%80%A6+He+%5BDr.+Forbes%5D+has+been+speaking+of+the+rules+which+God%E2%80%99s+Word+gives+us+concerning+the+use+of+things+indifferent%2C+and+all+of+them+he+comprehends+under+this+rule%2C+that+we+should+hear+the+Church+and+obey+them+who+are+set+over+us%2C+as+if+God%E2%80%99s+rules+were+subordinate+to+men%E2%80%99s+rules+and+not+theirs+to+his.+We+say+not+that+every+man+may+use+things+indifferent+suo+arbitratu+%5Baccording+to+his+judgment%5D%3A+but+we+say+withal+that+neither+may+the+Church+command+the+use+of+things+indifferent%2C+suo+arbitratu.+Both%2C+she+in+commanding+and+we+in+obeying%2C+must+be+guided+by+the+rules+of+Scripture.+They+who+are+set+over+us+in+the+Church+have+no+power+given+them+of+Christ+which+is+not+for+edifying%2C+Eph.+4%3A12.+The+council+of+the+apostles+and+elders+at+Jerusalem+%28which+is+a+lively+pattern+of+a+lawful+synod+to+the+world%E2%80%99s+end%29+professed+they+would+lay+no+other+burden+upon+the+disciples+except+such+things+as+the+law+of+charity+made+necessary+for+shunning+of+scandal%3A+and+so+that+which+they+decreed+had+force+and+strength+to+bind%2C+a+Charitate+propter+Scandalum+%5Bfrom+charity+due+to+scandal%5D%2C+says+Sanctius.+But+suo+arbitratu+%5Bby+their+%28mere%29+judgment%5D+they+enjoined+nothing.+It+appears+by+this+place+%28says+%5BThomas%5D+Cartwright%29+that+there+may+be+no+abridgment+of+liberty+simply+decreed%2C+but+in+regard+of+circumstance%2C+according+to+the+rule+of+edification.+And+if+the+Church%E2%80%99s+decrees+and+canons+be+not+according+to+the+rules+of+the+Word%2C+yet+forasmuch+as+everyone+of+us+shall+give+account+of+himself+and+his+own+deed%2C+we+must+look+that+whatsoever+the+Church+decree%2C+yet+our+practice+in+the+use+or+omission+of+a+thing+indifferent%2C+be+according+to+the+foresaid+rules.+We+may+not+for+the+commandment+of+men+transgress+the+rule+of+piety+by+doing+anything+which+is+not+for+God%E2%80%99s+glory+and+ordered+according+to+his+will%3B+neither+ought+any+of+us+to+obey+men%2C+except+for+the+Lord%E2%80%99s+sake+and+as+the+servants+of+Christ%2C+doing+the+will+of+God%3B+which+teaches+us+the+manner+how+we+ought+to+obey+men%2C+namely%2C+propter+Christum+et+sicut+Christus+praecipit+%5Bfor+Christ%2C+as+Christ+commands%5D.+For+if+we+should+know+no+more+but+the+will+of+man+for+that+which+we+do%2C+then+we+should+be+the+servants+of+men%2C+not+the+servants+of+Christ.+Neither+yet+may+we+for+any+human+ordinance+break+the+rule+of+charity%3A+but+whatsoever+either+would+weaken+or+not+edify+our+brother%2C+be+it+never+so+lawful%2C+never+so+profitable+to+ourselves%2C+never+so+powerfully+by+earthly+authority+enjoined%2C+Christians%2C+who+are+not+born+unto+themselves%2C+but+unto+Christ%2C+unto+his+Church+and+unto+the+fellow+members%2C+must+not+dare+to+meddle+with+it.+Nor+lastly+may+we+obey+men+so+as+to+break+the+Law+of+Purity%2C+and+perform+any+action+with+a+doubtful+conscience%2C+that+is%2C+whereof+either+the+Word+has+not%2C+or+we+out+of+it+have+no+warrant%3A+in+which+case+tender+consciences+must+be+tendered%2C+rather+than+be+racked+by+authority%3A+for+be+the+things+in+themselves+never+so+lawful%2C+etc.%2C+they+are+utterly+unlawful+to+me+without+such+information.+Whereas+therefore+some+say+that+in+the+use+of+matters+indifferent%2C+the+laws+of+those+who+are+set+over+us+ought+to+rule+us%3B+we+still+answer+that+our+practice+may+not+be+ruled+by+any+law+of+man+except+it+be+according+to+the+rules+of+the+Word%3B+whereof+one+is+this%3A+Tantum+oportere+esse+obedientiae+studium+in+Christianis%2C+ut+nihil+agant%2C+quod+non+existiment+vel+potius+certi+sint+placere+Deo+%28Calvin+on+Rom.+14%3A5%29.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+Dispute+Against+the+English-Popish+Ceremonies...+%28%5BLeiden%5D+1637%29%2C+pt.+4%2C+ch.+3%2C+pp.+10-11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4a2f105d7d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4a2f105d7d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=Moreover%2C%20as%20we%20may%20not%20use,placere%20Deo%20%28Calvin%20on%20Rom.%2014%3A5%29." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

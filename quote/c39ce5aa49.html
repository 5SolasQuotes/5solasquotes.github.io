<blockquote><p>But the Romish Antichrist, to deface this great benefit of Christ, hath taught that his sacrifice upon the cross is not sufficient hereunto, without another sacrifice devised by him … to supply Christ’s imperfection. … O heinous blasphemy and most detestable injury against Christ! O wicked abomination in the temple of God! O pride intolerable of Antichrist, and most manifest token of the son of perdition, extolling himself above God, and with Lucifer exalting his seat and power above the throne of God! For he that taketh upon him to supply that thing, which he pretendeth to be unperfect in Christ, must needs make himself above Christ, and so very Antichrist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cranmer.html">Thomas Cranmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of the True and Catholic Doctrine of the Sacrament of the Body and Blood of Our Saviour Christ</cite>, (1550; London, 1907), xxii-xxiii.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9c4e7d2a61" data-kw="">
<blockquote><p>Nor let it be objected; That Infants then are not to be denied the Lord’s Supper, but are to be received to his table, seeing Christ is the thing signified in that Sacrament, as in Baptism.

The difference (as all may see) is wide: In this Sacrament Infants are passive, and so capable of this honour, to be taken in; In the other we are active, and Infants for that reason are incapable: They are not in capacity to perform so much as that which is outwardly sacramental: They cannot, according to the Institution take and eat, much less can they do it in remembrance of Christ: The very phrase (circumcised, baptised) is enough to difference from eating with bitter herbs, &amp;c. as at the Passover, from communicating as at the Lord’s table, Infants are fit subjects for the one, men of growth are only fit subjects for the other:

One to press on this objection furnisheth us with a similitude, Suppose (saith he) a King for some special service wherein the honour of himself and safety of his kingdom is much concerned, should by Commission ordain or command a Sheriff upon pain of death, to raise for his service ten thousand men, the most able in his County; and this Sheriff, finding the said number of children about six months old, should present them to the King at the very instant of battle, as though he had thereby performed the Kings command: Would this be taken for a sufficient performance of his duty?

But suppose that the King should appoint all his free-born subjects to be enrolled, and a list taken of their Names, who in time might act in their places for his honour, and enjoy Immunities as his subjects, might not Infants then go in the number? So it is here, Baptism is the initiating ordinance, The subjects of Heaven are here enrolled, their names may therefore be taken as subjects, though they cannot yet act as soldiers: They are here intitled to all the Immunities of this kingdom, yet orderly as they shall be of capacity and fitness to make use of them.

But their want of faith is challenged as an impediment to Baptism: When the Eunuch desired Baptism, we know the answer that he had: If thou believest with all thine heart thou maist: And Calvinists denying actual faith to be found in Infants, their Adversaries the Lutherans come in with their argument ad hominem, making against us (say they) though not against the thing it self: Every Sacrament without faith in him that uses it is a vain Ceremony; But the Baptism of Infants is a Sacrament without the faith of him that useth it. A speech directed to a man of years and without any title to the Covenant (other then his actual faith did confer upon him) is ill applied to Infants within Covenant that otherwise have title to it.

This exception carries equal strength against Infants circumcision: There is no more faith in the Infants of Jews then there is in the Infants of Christians; And faith is no less necessary in the circumcised then in the baptized: There was an equal necessity of the ingrediency of faith in every one in that age, as in this; yea in the ages more ancient then that of circumcision, as appears by the Apostles argument, Heb. 11.6.

Their capacity to receive the sign, answers their capacity to receive the thing signified, they are passive in the receiving of Christ and any interest in him: and so also they are, (and circumcised Infants were) in taking the sign. And so the Lutheran proposition being understood of any thing wherein we are active is a truth, but applied to Infants uncapable of action in the Sacrament where they are only passive, it is to be denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-blake.html">Thomas Blake</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The birth-privilege, or, Covenant-holiness of believers and their issue in the time of the Gospel together with the right of infants to baptism</cite>, (London: Tho. Underhill, 1644), pp 18-19.</span></figcaption>

</figure><figure class="quote" id="q-fab9f384ed" data-kw="">
<blockquote><p>Traditionally the sacrament had been open to all not actually excommunicated or under other kirk censures. Increasingly during the 1640s it appears (though the process has not been traced in detail) that some ministers put more and more emphasis on stringent qualifications necessary for admission. Tests of religious knowledge, repentance for sins and political loyalties were introduced. Thus adherence to the national covenant and the solemn league and covenant became necessary for admission.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-stevenson.html">David Stevenson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Revolution and counter-revolution 1644-1651</cite>, (1979; rev. edn, Edinburgh, 2003), p. 192.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-0aad91c5a6" data-kw="">
<blockquote><p>For the manner of their [Independents’] celebration, they who have seen it profess it to be in a very dead and comfortless way: it is not as in New England, once in the month, but as at Amsterdam, once every Lord’s Day, which makes the action much less solemn than in any other of the Reformed Churches, and in this too much like the daily masses of the Church of Rome. They have no preparation of their flock before: they are so happy as to have all their members prepared always sufficiently for the Lord’s Table, from their first entrance into their Church to their dying day; for all this time there is no catechizing among them; this exercise is below their condition and altogether needless in any of their congregations. They will have no sermon in the week before, nor so much as any warning [fore-notice] of the Communion. This practice of New England, to give warning the Sabbath before, is disliked now at London: nor must there be any sermon of thanksgiving after that sacrament: They use not so much as a little application of the doctrine in the sermon before it to that occasion. When they come to the action, there is no more but one little discourse and one short prayer of the minister; all the time of the participation, there is nothing in the congregation but a dumb silence: no reading, no exhortation, no psalms; their people need no such means to furnish them in their sacramental meditations;</p></blockquote>

— Robert Baillie, A Dissuasive from the Errors of the Time, (1645), ch. 6, p. 121">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+the+manner+of+their+%5BIndependents%E2%80%99%5D+celebration%2C+they+who+have+seen+it+profess+it+to+be+in+a+very+dead+and+comfortless+way%3A+it+is+not+as+in+New+England%2C+once+in+the+month%2C+but+as+at+Amsterdam%2C+once+every+Lord%E2%80%99s+Day%2C+which+makes+the+action+much+less+solemn+than+in+any+other+of+the+Reformed+Churches%2C+and+in+this+too+much+like+the+daily+masses+of+the+Church+of+Rome.+They+have+no+preparation+of+their+flock+before%3A+they+are+so+happy+as+to+have+all+their+members+prepared+always+sufficiently+for+the+Lord%E2%80%99s+Table%2C+from+their+first+entrance+into+their+Church+to+their+dying+day%3B+for+all+this+time+there+is+no+catechizing+among+them%3B+this+exercise+is+below+their+condition+and+altogether+needless+in+any+of+their+congregations.+They+will+have+no+sermon+in+the+week+before%2C+nor+so+much+as+any+warning+%5Bfore-notice%5D+of+the+Communion.+This+practice+of+New+England%2C+to+give+warning+the+Sabbath+before%2C+is+disliked+now+at+London%3A+nor+must+there+be+any+sermon+of+thanksgiving+after+that+sacrament%3A+They+use+not+so+much+as+a+little+application+of+the+doctrine+in+the+sermon+before+it+to+that+occasion.+When+they+come+to+the+action%2C+there+is+no+more+but+one+little+discourse+and+one+short+prayer+of+the+minister%3B+all+the+time+of+the+participation%2C+there+is+nothing+in+the+congregation+but+a+dumb+silence%3A+no+reading%2C+no+exhortation%2C+no+psalms%3B+their+people+need+no+such+means+to+furnish+them+in+their+sacramental+meditations%3B%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+A+Dissuasive+from+the+Errors+of+the+Time%2C+%281645%29%2C+ch.+6%2C+p.+121&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0aad91c5a6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0aad91c5a6.html">Permalink</a><a class="src" href="https://refo <blockquote><p>Now concerning the outward form and manner of admitting Professors unto the holy Communion, and distinguishing them from those that are without; we find nothing distinctly enjoined in the Word, or extant in the practice of the Apostles: Therefore that which may concern this matter, is conceived to be left free unto the discretion of the Eldership, as they shall think it most fit, for the edification and capacity of those with whom they have to do.

And herein the customs of the Reformed churches, in respect of circumstantials, are found to be different; yet, in the main, their agreement is this—

1. That every one who for the first time is to be admitted unto the Holy communion, is to be examined in respect of his knowledge and conversation; although from his infancy he hath been born, baptized, and bred in the Congregation.

2. If he come from abroad; having years of discretion and judgement fit to examine himself, it is expected he should have a testimonial of his former life and conversation, and of his diligence in attending the Ordinances in the place where he hath lived. And being found knowing in the fundamental truths of Christianity, he is desired

First, to declare that his purpose is to live and die in the communion of the Reformed churches.

Secondly, to promise, that if he should conceive any scruples of the Doctrine that is taught in the Reformed churches, he shall not conceal his doubts, and fall away from the Fellowship into which he is received; but make the same known unto his Teachers, to receive satisfaction therein.

Thirdly, to oblige himself to use all careful diligence to honour and adorn his profession with his life and conversation, and to avoid all occasion of scandal.

Fourthly and lastly, to promise to submit himself unto the Rules of Church-discipline, according to the Word; and to respect those that are set over him in the Lord.

All which he is engaged to do by word of mouth, and by giving his hand unto the Eldership.

In some places, this admission of Members is left to the Pastor, to be performed in private; yet so, as the reception of the party must be notified unto, and ratified by the Eldership. In some places, all is done before the whole Eldership. In some places also, the names of those that are admitted, are published unto the whole Congregation from the Pulpit.</p></blockquote>

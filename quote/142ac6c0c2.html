<main class="wrap"><figure class="quote" id="q-142ac6c0c2" data-kw="">
<blockquote><p>As for your selves, Honourable Sirs! We have all cause to bless God for the worthy Acts already done by you, and for your further intentions of most excellent good to our Church and Kingdom; Ripen these intentions (we pray you) into Actions, That our Church may be glorious, and our State safe; and both flourishing and stable: good actions are excellent, though evil men oppose them nor shall they be therefore, the less successful: remember that Christ hath conquered all the world, and a world conquered by Christ shall never be able to conquer truth.

I have one request which I earnestly present to your selves and the House of Lords, It is only this, Hasten (what you can) England’s Reformation, and Ireland’s preservation: In these the good and Almighty God unite, strengthen, protect, and prosper you All, To whose everlasting arms, you and all your pious endeavours are commended …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>England’s Preservation or, A Sermon Discovering the only way to prevent Destroying Judgements: Preached to the Honourable House of Commons at their last Solemn Fast, being on May, 25, 1642</cite>, (London: Samuel Gellibrand, 1642), epistle dedicatory.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

I have one request which I earnestly present to your selves and the House of Lords, It is only this, Hasten (what you can) England’s Reformation, and Ireland’s preservation: In these the good and Almighty God unite, strengthen, protect, and prosper you All, To whose everlasting arms, you and all your pious endeavours are commended …”

</figure><figure class="quote" id="q-3caee1b681" data-kw="">
<blockquote><p>And do further statute and ordain, that no person be admitted, or continued for hereafter, to be a minister or preacher within this Church, unless that he… do also subscribe the Confession of faith, ratified in the foresaid 5th Act of the second Session of this Parliament, declaring the same to be the confession of his faith, and that he owns the doctrine therein contained to be the true doctrine which he will constantly adhere to: As likewise, that he owns and acknowledges Presbyterian Church government, as settled by the foresaid fifth act of the second session of this parliament, to be the only government of this Church, and that he will submit thereto, and concur therewith, and never endeavour, directly or indirectly, the prejudice or subversion thereof…</p></blockquote>

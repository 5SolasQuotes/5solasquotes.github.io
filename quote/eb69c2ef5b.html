<main class="wrap"><figure class="quote" id="q-eb69c2ef5b" data-kw="">
<blockquote><p>Representations of God, Angels, and Saints.; Copes, Surplisses, Roods, etc.; Organs. The Lords and Commons assembled in Parliament, the better to accomplish the blessed Reformation so happily begun, and to remove all offences and things illegal in the worship of God, do Ordain, That all Representations of any of the Persons of the Trinity, or of any Angel or Saint, in or about any Cathedral, Collegiate or Parish Church, or Chapel, or in any open place within this Kingdom, shall be taken away, defaced, and utterly demolished; And that no such shall hereafter be set up, And that the Chancel-ground of every such Church or Chapel, raised for any altar, or Communion Table to stand upon, shall be laid down and leveled; And that no copes, surplisses, superstitious vestments, roods, or roodlons, holy-water fonts, shall be, or be any more used in any Church or Chapel within this realm; And that no cross, crucifix, picture, or representation of any of the Persons of the Trinity, or of any angel or saint shall be, or continue upon any plate, or other thing used, or to be used in or about the worship of God; And that all organs, and the frames or cases wherein they stand in all Churches or Chapels aforesaid, shall be taken away, and utterly defaced, and none other hereafter set up in their places; and that all copes, surplisses, superstitious vestments, roods, and fonts aforesaid, be likewise utterly defaced; whereunto all persons within this Kingdom, whom it may concern, are hereby required at their peril to yield due obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english-parliament.html">English Parliament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘An Ordinance for the Further Demolishing of Monuments of Idolatry &amp; Superstition’</cite></span></figcaption>

<blockquote><p>why does Moses in this place [Dt. 33:16] set Him in the bush? It is because God had there showed Himself unto Him… God considers how it is for our benefit to have some familiarity with Him: and thereupon He yields to our rudeness, and takes upon Him as it were a new shape, howbeit not which is contrary (as I said afore), but to the intent that we should not be scared, nor take occasion to shrink from Him. Now then, He allures us gently, and therewithal He stops to us and makes Himself as it were mean [lowly] unto us…. But we see how He showed Himself to the fathers of old-time under certain shapes. As for example when He talked with Jacob in Bethel, it was because Jacob needed such confirmation (Gen. 28:13)… …as if he should say, ‘…he appeared to me in the bush, and there I knew his majesty…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, The Sermons of… Calvin upon the Fifth Book of Moses… (London: Middleton, 1583), Sermon 196, pp. 1215-16</span></figcaption>

<main class="wrap"><figure class="quote" id="q-3767a9a094" data-kw="">
<blockquote><p>…there were no oblations [in the OT, such as free-will offerings] left wholly to the pleasure of men, for though the particulars were not, nor could not be determined by a distinct rule in general, yet they were determined by the circumstances, as our divines are wont to answer the Papists about their vows, counsels, superarrogations: ‘Not by a general law, but by concurrence of circumstances.’ So Dt. 16:10, Moses shows that the freest offerings were to be according as God had blessed them, from whence it follows it had been sin for any Israelite whom God had plentifully blessed to offer a pair of pigeons instead of a bullock, or two, upon his own mere pleasure:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, (Amsterdam: Thorp, 1633), Manuduction, ch. 12, section 2, pp. 152-53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-de76fe8313" data-kw="">
<blockquote><p>Neverthelesse, if any man think the sentence of the bshop and the presbytery given forth against him to be unjust, he ought to have liberty of recourse to the synod and there to be heard, according as it was decreed by the Fourth Council of Carthage, Canon 66. But oftimes the matter is of such difficulty or importance, that the bishop and the presbytery may not giveout an peremptory sentence of suspension or deprivation (Fenner, Theol., bk. 7, ch. 7, p. 153), till the matter be brought to the synod of the province (Hemming, Enchir., class. 3, ch. 11, pp. 390-91), where according to the ancient order the matter is to be handled, not by the censure of one bishop, but by the judgement of the whole clergy gathered together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 8, Digression 4, p. 194</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-31cea46497" data-kw="">
<blockquote><p>The universal moral law either impressed by God upon the mind of all people or immediately discerned by the reason in its encounter with the order of nature. The natural law was therefore available even to those pagans who did not have the advantage of the Sinaitic revelation and the lex Mosaica [Law of Moses], with the result that they were left without excuse in their sins, convicted by conscientia [conscience]. The scholastics argue the identity of the lex naturalis [Natural Law] with the lex Mosaica or lex moralis [Moral Law] quod substantiam, according to substance, and distinguish them quod formam, according to form. The lex naturalis is inward, written on the heart and therefore obscure, whereas the lex Mosaica is revealed externally and written on tablets and thus of greater clarity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Greek and Latin Theological Terms 1st</cite>, ed. (Baker, 1985), pp. 174-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-5cf76b6a5f" data-kw="">
<blockquote><p>V. …the conscience has no one between itself and God by whom it may be known and judged. As it is known to God alone, so can it be judged by Him alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, p. 287 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-3acdf84736" data-kw="">
<blockquote><p>The second note whereby we may discern a judicial law to be moral for his equity, is this: If it follow necessarily and immediately from the light, principles and conclusions of nature. For example, Dt. 22:5, ‘The man shall not put on the things that appertain to the woman, nor the woman the things that appertain to the man.’ This law is more than judicial: for it is a rule of common honesty: practiced in those countries, by the light of nature, where the written law was never known…. This I speak… to show how far judicial laws have morality in them and stand in force.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary or Exposition, upon the Five First Chapters of the Epistle to the Galatians</cite>, (Cambridge, 1604), p. 234</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

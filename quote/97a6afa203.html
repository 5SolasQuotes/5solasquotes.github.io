</figure><figure class="quote" id="q-586625ff3c" data-kw="">
<blockquote><p>4. It being the custom then to cover the faces of those that were put to any great shame, a man that shall vail his head and face does thereby take reproach unto himself. … 5. …As custom makes it a shame to her to be shaven, so also to be unvailed. (Note, that this was a changeable custom, and is contrary now with us). …

13. The signification of being uncovered, being by custom a note [of] superiority, judge in yourselves whether such be decent for a woman at the church’s prayers. …

14. And when common custom has made the wearing of hair at length the note of the female sex, does not nature itself tell you, that it is a shame for a man to be so like a woman? (when God forbids us so much as to be clothed as women, to confound the sexes, which must needs be visibly distinguished). …

15. But use tells us that for women to let their hair grow out at length is a signification of modesty, as a kind of covering, and so is decent to them. …

16. But if any will contentiously dispute against what I say, though I would make no greater a matter of such things than the nature of them requires, let this answer suffice to resolve sober minds: The custom of all the Churches is against women’s being uncovered, as an unseemly thing; and you should not easily be different from all the Churches in a matter which depends on the signification of an action, which use and common opinion must interpret. We that must be as concordant as we can, must not affect dissimilitude.</p></blockquote>

<blockquote><p>…Tertullian wanted all females veiled from the time of puberty (1.1; 16.3). Some virgins, to the contrary, were attending the church gatherings unveiled, and some married women made only a token covering of the head (17.1, 4). Both sides, it seems, assumed that married women would be veiled in public. It is not clear whether Tertullian, who was under the influence of the Montanist movement on the basis of a revelation by the Paraclete (1.7) is an innovator or is trying to restore a practice being neglected or abandoned. His description of varied hairstyles (On the Apparel of Women 2.7) indicates not many women were in fact veiled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/everett-ferguson.html">Everett Ferguson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of Veils &amp; Virgins: Greek, Roman, Jewish &amp; Early Christian Practice’ Restoration Quarterly</cite>, 56, no. 4 (2014), pp. 223-43, p. 223</span></figcaption>

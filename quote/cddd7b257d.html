<main class="wrap"><figure class="quote" id="q-cddd7b257d" data-kw="">
<blockquote><p>§63. As for the Common Prayer itself, I never rejected it because it was a form, nor thought it simply unlawful because it was such a form, but have made use of it and would do again in the like case. But I must needs say: 1. That the shredding it into such abundance of small parcels seems to me very inconvenient. It seems too light and ludicrous to toss sentences so formally between the priest and clerk, and to make such a multitude of prayers consisting but of a sentence, or two at most: And it seems to be tautology and vain repetition to repeat over the same word so oft: and a taking of God’s name in vain, or too unreverently, to begin with his titles and attributes, and end with his name again, and the merits or sake of Christ, and this at almost every sentence: as if we had done with Him and were taking our leave, and had forgot somewhat that called us to begin again: and thus we begin and end, and begin and end again, it may be twenty times together. 2. But the enforcing imposition of these prayers is most to be condemned, of which I have spoken in the former disputation. But for my part, I censure none that use them, nor take them to be therefore men of another religion or worship: It is but a modal difference in the same worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship (London: R.W., 1659), 5th Disputation, ch. 2</cite>, pp. 421-22</span></figcaption>

</figure><figure class="quote" id="q-b03d8f1c66" data-kw="">
<blockquote><p>The demand was of the same man, who formerly did lawfully preach in a public assembly, if he should [now] obtain a license from the Lord bishop of the diocesse, without any unlawful condition for to continue in that his course [of public preaching], whether that leave or licence given does pollute the actions, seeing a man may ask leave of the great Turk to preach the gospel within his dominions? His [John Robinson’s] answer is that the very obtaining and receiving of such a license is unlawful, because it is a real acknowledgement that such a bishop has a lawful power to grant it. Which [in my judgment] is neither so nor so, for: 1. The asking and receiving of leave or license (which are both one) does not always imply an acknowledgement of his lawful authority from whom it is sought. If any man of violence shall usurp a power to himself, of permitting or hindering the lawful and good offices that pertain unto honest men, so that without his licence a man could not buy or sell, or teach any science or trade of life; if an honest man whom these duties concern, should in that case take a licence from that usurper (though he were no better then a strong theif) no reasonable man will say that in so doing he did acknowledge such usurped power lawful. The rulers of Jewish synagoges had no lawful power over the apostles of Christ in any part of their ministery, neither would Paul ever acknowledge so much: yet he and Barnabas accepted of such license or leave from them sometime as they did usually grant unto those that acknowledged themselves lawfully subject to their authority. See an example, Acts 13:15. Mr. Robinson himself has granted in the first demand that a man may preach by leave in a parochial assembly: which leave must be given by the parochial minister and church-wardens, whose authority he holds one with the bishops. If therefore leave or license (whether in word or writing, that is all one) may be lawfully taken from them, without acknowledging any authority lawful which is unlawful, why not from the bishop? 2. There is some authority in the bishops derived from the king which may be acknowledged lawful. Such is this of giving license, liberty and civil authority for men to do good. The civil magistrate may do it himself, or appoint others to do it, 2 Chron. 17:7. The abuse of this authority does not make it unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr. [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615)</cite>, pp. 6-7</span></figcaption>

<blockquote><p>Q What is the main scope of the Second Commandment? A. The Second Commandement enjoyns all that worship of God which is by divine institution and ordinance, Mt. 28:20; Dt. 12:32. Q What are some of the particulars? A. The public and solemn preaching and hearing of his word, and prayer, celebration of sacraments, Church fellowship, election and ordaining of ministers and their whole ministration, with the due observation of Church discipline.</p></blockquote>

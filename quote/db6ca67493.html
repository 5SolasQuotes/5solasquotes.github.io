<main class="wrap"><figure class="quote" id="q-db6ca67493" data-kw="">
<blockquote><p>The necessity for His death is brought out with an unusual illustration in Hebrews 9, that of a man’s last will and testament. When a man makes a will, it is necessary for his death to occur before the terms of the will become operative. As long as he lives, nothing happens. Now the Greek word διαθήκη, which the writer employs for ‘will’, is used in the Greek Old Testament to translate the Hebrew word בְּרִית, meaning ‘covenant’. It is unmistakably the usual Greek word for a ‘will’. But there is an air of finality about a will. You cannot dicker with a testator. You accept what he leaves you on the conditions he lays down, or you reject it. You have no other line of action.

The one-sidedness of this process seems to have appealed to those who translated the Old Testament into Greek as a better way of characterizing the covenants God makes with men than συνθήκη, the usual word for ‘agreement’. This word might be taken as suggesting a relative equality, an ability on man’s side to make conditions. This is totally false. Man accepts the covenant on God’s terms or he rejects it. He has no other option. Thus the word in Greek at large means a will, and in the Old Testament it means a covenant.

In Hebrews 9:16f. it seems that the writer is playing on the double meaning of the word. Jesus establishes the new διαθήκη, or ‘covenant’, and His death is necessary to establish it, just as necessary as is the death of any testator to establish his διαθήκη, his ‘will’. No διαθήκη is of force without a death. The line of reasoning is perhaps one that we would not have employed. But we are dealing with a first-century writing, not one from the twentieth century. And the point the writer is making is that the death of Christ is an absolute necessity. A ‘will’ is completely inoperative until the testator dies. And Christ’s new ‘covenant’ is likewise inoperative until the death of Christ. Without that the whole Christian system would be impossible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leon-morris.html">Leon Morris</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cross in the New Testament</cite>, (Grand Rapids MI; Eerdmans, 1965), pp 278-79.</span></figcaption>

</figure><figure class="quote" id="q-f1605b870d" data-kw="">
<blockquote><p>I. On the recovery of fallen believers.

1. I begin by remarking that true believers, as well as others, are liable to fall into sin. This is implied in all the warnings which the Scriptures give on this head. “Let him that thinketh he standeth take heed lest he fall.” “Take heed, brethren, lest there be in any of you an evil heart of unbelief.” “Let us labour — lest any man fall after the same example of unbelief.” It is also evident from Scripture example, of which that of Peter is instead of a thousand.

As some professors of religion may fall totally and irrecoverably from Christ, after very high and specious attainments, so genuine Christians may fall very foully, and, for a time, may remain in a desperate like condition. The promises and provisions of the covenant of grace secure all those who are vitally united to Christ from total and final apostasy, but there is no arrangement made securing that they shall not sin, and by their sin grievously dishonour God, wound their own consciences, lay a stumbling-block before others, and subject themselves to severe chastisement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Recovered Disciple in Sermons</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>Question: But why is God pleased to promise to give unto his people in Covenant spiritual blessings as well as temporal? … …Spiritual blessings are necessary for them in relation unto that eternal life… Heb. 12:13… Lo, here is a necessity of holiness and regeneration for salvation, and they are congruous, and fitting us for salvation, or eternal life… It is meet to enjoy grace before we come to enjoy glory; it is meet to have a conformity to Christ on his cross before we come to have a conformity to Christ in his crown, etc.</p></blockquote>

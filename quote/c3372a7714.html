<blockquote><p>The great offence, which makes us look like grim persecutors in Moderate eyes, is our offer of the ministrations of the Free Church to all the inhabitants of the land. They have got our temporalities — our churches, our schools, our manses, our gardens, our glebes, and our salaries — and their sufferings consist in the circumstance that they have not yet got our people — are not likely to get them — and that the poorer classes of our countrymen are generally espousing our cause, and accepting our services.

This is the head and front of our offending. They are persecuted, because the Free Church ministers, wicked set that they are, won’t agree to be banished from the kingdom — or, at all events, won’t surrender their offices as well as their livings — or refrain from preaching the gospel wherever there are persons that are willing to hear them. They are persecuted, because, having left the old places of worship in their hands, we are trying to build new ones for ourselves, and for those who adhere to us!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-gray.html">Andrew Gray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Persecution. The Lairds, the Lawyers, and the Moderate Clergy, against the Free Church of Scotland: Being the Substance of a Speech Delivered before the Free Presbytery of Perth, on Wednesday, 30th August, 1843</cite>, (Perth: W. Belford, 1843), p. 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

<blockquote><p>She [Wisdom] is studious of ecclesiastical peace: to that end she knows how to distinguish between substantials and ceremonials; nor dares she rent Christ’s seameless coat because the fringe is not every way complete. Between fundamentals and circumstantials, matters Fidei Catholicae, et scientiae theologicae [of the catholic Faith and between theological wisdom], necessary to be believed, and problematically disputed, allowing a latitude of opinion in some things, to those who hold the foundation; in a word, she abhors, as to injure the truth of Christ by error, so to disturb the peace of the Church by schism.</p></blockquote>

</figure><figure class="quote" id="q-d67e8ccc5c" data-kw="">
<blockquote><p>By ‘unity’ we mean the concurrence of men’s judgments, affections and actions about the same thing in one and the same way, and for the same end. By ‘forbearance’ we mean the refraining from uncharitable and unkindly affections and behaviors towards another in some things, although there be some difference between us and him in judgement and in the way of acting about these things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Moderator</cite>, (London: Bellamy, 1652), ch. 3, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

— Joseph Caryl, The Moderator, (London: Bellamy, 1652), ch. 3, p. 24">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+%E2%80%98unity%E2%80%99+we+mean+the+concurrence+of+men%E2%80%99s+judgments%2C+affections+and+actions+about+the+same+thing+in+one+and+the+same+way%2C+and+for+the+same+end.+By+%E2%80%98forbearance%E2%80%99+we+mean+the+refraining+from+uncharitable+and+unkindly+affections+and+behaviors+towards+another+in+some+things%2C+although+there+be+some+difference+between+us+and+him+in+judgement+and+in+the+way+of+acting+about+these+things.%E2%80%9D%0A%0A%E2%80%94+Joseph+Caryl%2C+The+Moderator%2C+%28London%3A+Bellamy%2C+1652%29%2C+ch.+3%2C+p.+24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd67e8ccc5c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d67e8ccc5c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/unity-of-the-church/#:~:text=By%20%E2%80%98unity%E2%80%99%20we%20mean%20the%20concurrence,way%20of%20acting%20about%20these%20things&amp;text=By%20%E2%80%98unity%E2%80%99%20we%20mean%20the%20concurrence%20of%20men%E2%80%99s&amp;text=in%20the%20way%20of%20acting%20about%20these%20things" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7c6a49f814" data-kw="">
<blockquote><p>6. I have perused over all the Articles or Decrees of the Synod of Dort, and unfeignedly honor them, as containing sound and moderate doctrine, and heartily lament that some late divines have to the great detriment of the Church and truth, forsaken the moderate way of that Synod, and laid the weight of the Anti-Arminian cause so much upon higher points not owned by them. And there is nothing that I have observed in it all that my judgment does contradict, if I be allowed these few expositions following: Where it is said, article 1, sect. 12, De hac aeterna electione, electi suo tempore variis licet gradibus, et dispari mensura, certiores redduntur, non arcana, etc. [“The elect in due time, though in various degrees and in different measures, attain the assurance of this their eternal and unchangeable election, etc.”], I understand it as showing only what way the elect do attain assurance, who more or less do attain it, and not as affirming that all the elect do more or less attain a certainty of their election. For as I think that doctrine uncomfortable to many poor Christians, so I think it cannot he proved of all the elect.

2. In the 3rd Article, sect. 12, it’s plain by the annexed words that persuasionem moralem [“by moral suasion”] they mean external suasion, and do not determine whether the name of suasion be agreeable or not to the internal work of the Spirit, which for my part I am certain is beyond my reach to know and, I am confident, [is] beyond the reach of all men on earth, even those that most pretend to know it. But that this grace of the Spirit is necessary to sanctify both the understanding and will, and that it is an act of omnipotency, and infallibly effectual (commonly called ‘irresistible’) on all the elect, I am ready against all Pelagians to defend.

3. Where it is said, sect. 15, that, Qui illam non accipit, is aut haec spiritualia omnino non curat, et in suo sibi placet: aut securus se habere inaniter gloriatur, quod non habet [‘Whoever is not made partaker thereof, is either altogether regardless of these spiritual gifts and satisfied with his own condition, or is in no apprehension of danger and vainly boasts the possession of that which he has not’]: I understand it as spoken of the ordinary sort of graceless unregenerate men, and not of all; for I doubt not but it’s possible for a wicked man to know that he is wicked, and be afraid of Hell, yea, and to despair. I am loth to think desparation is a mark of grace, and that none are graceless but the secure and confident.

4. In the 5th Article, sections 9-10, where it is said that believers may be, and are certain of their perseverance, according to the measure of their faith, I understand that word, ‘are certain pro mensura fidei’:

1. As supposing the certainty of their sincerity; for a man must be certain that he has grace, before he can be certain to persevere in it.

2. As supposing a certain understanding of the truth of the doctrine that all true believers shall infallibly persevere: for none can be certain to persevere merely as a believer, that is not first certain that all believers shall persevere.

3. I suppose therefore that this is not spoken of all believers, but of some, for:

1. All are not certain that they are sincere.

2. All are not certain that the doctrine of infallible perseverance is true; for to conclude that all the Lutheran Churches that deny this, and all the Arminians and Anabaptists that deny it, and all the ancient fathers and Churches that denied it, besides Musculus and others of our own, were certainly graceless and unbelievers, were not only inconsistent with the faith and charity, but with the reason of a Christian; and [this is] no less than an inhumane charge.

5. Where it is said, sect. 11, that God per Spiritum Sanctum perseverantiae certudinem in iisdem rursus excitat [‘by the Holy Spirit again inspires them with the comfortable assurance of persevering’], I understand it as true of some, but not of all; for I dare not pronounce damnation on all that die unassured of their sincerity, much less on all that are unassured of perseverance.

6. To the 13th section, I doubt not but the meaning is that certainty of perseverance does not of itself, and of its own nature beget carelessness or negligence; and so I believe it’s true. Nay, I think that love and gratitude are ordained to be the master ruling graces in the Kingdom of Christ (under faith); and that fear is but to supply the defects of our yet-imperfect love. And therefore the more any man loves, the more he will obey: and the more he is assured of God’s love, the greater advantage he has to love Him again. But yet I doubt not, but the remnants of our corruption, by the strength of temptation, may make assurance an occasion, or accidental cause of negligence and actual sin: which I suppose this section does not deny. These are all the limiting expositions which I desire liberty to make use of, and with which I do, as is aforesaid, profess my consent to the Canons or Decrees of the Synod of Dort. And how far any of these are from favoring Arminianism, they that will see, need not to be ignorant. Yea, in the very article of perseverance, which some were pleased to quarrel with me about, I subscribe to the Synod: Yea, in the article of the extent of redemption, wherein I am most suspected and accused (and was fain to use a limiting exposition in my consent to our Assembly’s Confession of Faith) I do subscribe to the Synod of Dort, without any exception, limitation or exposition of any word as doubtful and obscure. I do also freely consent to the rejections, with the liberty of three or four the like explications, which I will not mention, lest I seem quarelsome, or be further tedious, because they are about smaller matters than those I have mentioned, and no way touching the quick of the controverted articles, and I am persuaded that my sense of them is the same with the Synod’s. And because it is, this Synod [was] purposely called against Arminianism, that is the best discovery what is to be accounted Arminian or Anti-Arminian doctrine, as I think, by consenting to it: I do clear myself from that calumny with all men of conscience and reason that know it, so I shall think that those who go as much on the other hand, and differ from the Synod one way, as much as the Arminians did the other way, remain censurable as well as they, till somebody shall convince me that there is but one extreme, in this case, and that a man may hold what he will without danger, so he be but sure it go far enough from Arminianism. A man that holds to the moderation of the Synod of Dort, need not say that Christ did not die or satisfy for all men, nor need he trouble himself with presumptuous determinations about many mysteries in the decrees of God, which many volumes are guilty of; Nor does he need to aver the necessity of immediate, physical, efficient predetermination by God (as the First Cause) of every second cause natural and free, as without which they cannot act: Nor need he say, that God so predetermines to the act which is sin, and not to the sinfulness of the act: Nor need he subscribe to all that Dr. [William] Twisse or Mr. [Samuel] Rutherford, or such like, have written on these points. Nay, as this Synod, so our own [Westminster] Assembly gave an example of modesty in these points, to them that will follow it, not only silencing many things which others make the pillars of Anti-Arminianism, but expressing that the will is endued by God with that natural liberty, that is neither forced, nor by any absolute necessity of nature determined to do good or evil, and therefore they never tell you that God as the First Cause must of natural necessity determine man’s will by physical, immediate premotion, before it can act either good or evil: But they reserve the honor of determining man’s will to special grace, renewing the will, and by almighty power determining it to that which is good, ch. 10, sect. 1 and ch. 9, sect. 1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Confession of his Faith</cite>, (London: R.W., 1655)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

by consenting to it: I do clear myself from that calumny with all men of conscience and reason that know it, so I shall think that those who go as much on the other hand, and differ from the Synod one way, as much as the Arminians did the other way, remain censurable as well as they, till somebody shall convince me that there is but one extreme, in this case, and that a man may hold what he will without danger, so he be but sure it go far enough from Arminianism. A man that holds to the moderation of the Synod of Dort, need not say that Christ did not die or satisfy for all men, nor need he trouble himself with presumptuous determinations about many mysteries in the decrees of God, which many volumes are guilty of; Nor does he need to aver the necessity of immediate, physical, efficient predetermination by God (as the First Cause) of every second cause natural and free, as without which they cannot act: Nor need he say, that God so predetermines to the act which is sin, and not to the sinfulness of the act: Nor need he subscribe to all that Dr. [William] Twisse or Mr. [Samuel] Rutherford, or such like, have written on these points. Nay, as this Synod, so our own [Westminster] Assembly gave an example of modesty in these points, to them that will follow it, not only silencing many things which others make the pillars of Anti-Arminianism, but expressing that the will is endued by God with that natural liberty, that is neither forced, nor by any absolute necessity of nature determined to do good or evil, and therefore they never tell you that God as the First Cause must of natural necessity determine man’s will by physical, immediate premotion, before it can act either good or evil: But they reserve the honor of determining man’s will to special grace, renewing the will, and by almighty power determining it to that which is good, ch. 10, sect. 1 and ch. 9, sect. 1.”

— Richard Baxter, Richard Baxter’s Confession of his Faith, (London: R.W., 1655)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C6.+I+have+perused+over+all+the+Articles+or+Decrees+of+the+Synod+of+Dort%2C+and+unfeignedly+honor+them%2C+as+containing+sound+and+moderate+doctrine%2C+and+heartily+lament+that+some+late+divines+have+to+the+great+detriment+of+the+Church+and+truth%2C+forsaken+the+moderate+way+of+that+Synod%2C+and+laid+the+weight+of+the+Anti-Arminian+cause+so+much+upon+higher+points+not+owned+by+them.+And+there+is+nothing+that+I+have+observed+in+it+all+that+my+judgment+does+contradict%2C+if+I+be+allowed+these+few+expositions+following%3A+Where+it+is+said%2C+article+1%2C+sect.+12%2C+De+hac+aeterna+electione%2C+electi+suo+tempore+variis+licet+gradibus%2C+et+dispari+mensura%2C+certiores+redduntur%2C+non+arcana%2C+etc.+%5B%E2%80%9CThe+elect+in+due+time%2C+though+in+various+degrees+and+in+different+measures%2C+attain+the+assurance+of+this+their+eternal+and+unchangeable+election%2C+etc.%E2%80%9D%5D%2C+I+understand+it+as+showing+only+what+way+the+elect+do+attain+assurance%2C+who+more+or+less+do+attain+it%2C+and+not+as+affirming+that+all+the+elect+do+more+or+less+attain+a+certainty+of+their+election.+For+as+I+think+that+doctrine+uncomfortable+to+many+poor+Christians%2C+so+I+think+it+cannot+he+proved+of+all+the+elect.%0A%0A2.+In+the+3rd+Article%2C+sect.+12%2C+it%E2%80%99s+plain+by+the+annexed+words+that+persuasionem+moralem+%5B%E2%80%9Cby+moral+suasion%E2%80%9D%5D+they+mean+external+suasion%2C+and+do+not+determine+whether+the+name+of+suasion+be+agreeable+or+not+to+the+internal+work+of+the+Spirit%2C+which+for+my+part+I+am+certain+is+beyond+my+reach+to+know+and%2C+I+am+confident%2C+%5Bis%5D+beyond+the+reach+of+all+men+on+earth%2C+even+those+that+most+pretend+to+know+it.+But+that+this+grace+of+the+Spirit+is+necessary+to+sanctify+both+the+understanding+and+will%2C+and+that+it+is+an+act+of+omnipotency%2C+and+infallibly+effectual+%28commonly+called+%E2%80%98irresistible%E2%80%99%29+on+all+the+elect%2C+I+am+ready+against+all+Pelagians+to+defend.%0A%0A3.+Where+it+is+said%2C+sect.+15%2C+that%2C+Qui+illam+non+accipit%2C+is+aut+haec+spiritualia+omnino+non+curat%2C+et+in+suo+sibi+placet%3A+aut+securus+se+habere+inaniter+gloriatur%2C+quod+non+habet+%5B%E2%80%98Whoever+is+not+made+partaker+thereof%2C+is+either+altogether+regardless+of+these+spiritual+gifts+and+satisfied+with+his+own+condition%2C+or+is+in+no+apprehension+of+danger+and+vainly+boasts+the+possession+of+that+which+he+has+not%E2%80%99%5D%3A+I+understand+it+as+spoken+of+the+ordinary+sort+of+graceless+unregenerate+men%2C+and+not+of+all%3B+for+I+doubt+not+but+it%E2%80%99s+possible+for+a+wicked+man+to+know+that+he+is+wicked%2C+and+be+afraid+of+Hell%2C+yea%2C+and+to+despair.+I+am+loth+to+think+desparation+is+a+mark+of+grace%2C+and+that+none+are+graceless+but+the+secure+and+confident.%0A%0A4.+In+the+5th+Article%2C+sections+9-10%2C+where+it+is+said+that+believers+may+be%2C+and+are+certain+of+their+perseverance%2C+according+to+the+measure+of+their+faith%2C+I+understand+that+word%2C+%E2%80%98are+certain+pro+mensura+fidei%E2%80%99%3A%0A%0A1.+As+supposing+the+certainty+of+their+sincerity%3B+for+a+man+must+be+certain+that+he+has+grace%2C+before+he+can+be+certain+to+persevere+in+it.%0A%0A2.+As+supposing+a+certain+understanding+of+the+truth+of+the+doctrine+that+all+true+believers+shall+infallibly+persevere%3A+for+none+can+be+certain+to+persevere+merely+as+a+believer%2C+that+is+not+first+certain+that+all+believers+shall+persevere.%0A%0A3.+I+suppose+therefore+that+this+is+not+spoken+of+all+believers%2C+but+of+some%2C+for%3A%0A%0A1.+All+are+not+certain+that+they+are+sincere.%0A%0A2.+All+are+not+certain+that+the+doctrine+of+infallible+perseverance+is+true%3B+for+to+conclude+that+all+the+Lutheran+Churches+that+deny+this%2C+and+all+the+Arminians+and+Anabaptists+that+deny+it%2C+and+all+the+ancient+fathers+and+Churches+that+denied+it%2C+besides+Musculus+and+others+of+our+own%2C+were+certainly+graceless+and+unbelievers%2C+were+not+only+inconsistent+with+the+faith+and+charity%2C+but+with+the+reason+of+a+Christian%3B+and+%5Bthis+is%5D+no+less+than+an+inhumane+charge.%0A%0A5.+Where+it+is+said%2C+sect.+11%2C+that+God+per+Spiritum+Sanctum+perseverantiae+certudinem+in+iisdem+rursus+excitat+%5B%E2%80%98by+the+Holy+Spirit+again+inspires+them+with+the+comfortable+assurance+of+persevering%E2%80%99%5D%2C+I+understand+it+as+true+of+some%2C+but+not+of+all%3B+for+I+dare+not+pronounce+damnation+on+all+that+die+unassured+of+their+sincerity%2C+much+less+on+all+that+are+unassured+of+perseverance.%0A%0A6.+To+the+13th+section%2C+I+doubt+not+but+the+meaning+is+that+certainty+of+perseverance+does+not+of+itself%2C+and+of+its+own+nature+beget+carelessness+or+negligence%3B+and+so+I+believe+it%E2%80%99s+true.+Nay%2C+I+think+that+love+and+gratitude+are+ordained+to+be+the+master+ruling+graces+in+the+Kingdom+of+Christ+%28under+faith%29%3B+and+that+fear+is+but+to+supply+the+defects+of+our+yet-imperfect+love.+And+therefore+the+more+any+man+loves%2C+the+more+he+will+obey%3A+and+the+more+he+is+assured+of+God%E2%80%99s+love%2C+the+greater+advantage+he+has+to+love+Him+again.+But+yet+I+doubt+not%2C+but+the+remnants+of+our+corruption%2C+by+the+strength+of+temptation%2C+may+make+assurance+an+occasion%2C+or+accidental+cause+of+negligence+and+actual+sin%3A+which+I+suppose+this+section+does+not+deny.+These+are+all+the+limiting+expositions+which+I+desire+liberty+to+make+use+of%2C+and+with+which+I+do%2C+as+is+aforesaid%2C+profess+my+consent+to+the+Canons+or+Decrees+of+the+Synod+of+Dort.+And+how+far+any+of+these+are+from+favoring+Arminianism%2C+they+that+will+see%2C+need+not+to+be+ignorant.+Yea%2C+in+the+very+article+of+perseverance%2C+which+some+were+pleased+to+quarrel+with+me+about%2C+I+subscribe+to+the+Synod%3A+Yea%2C+in+the+article+of+the+extent+of+redemption%2C+wherein+I+am+most+suspected+and+accused+%28and+was+fain+to+use+a+limiting+exposition+in+my+consent+to+our+Assembly%E2%80%99s+Confession+of+Faith%29+I+do+subscribe+to+the+Synod+of+Dort%2C+without+any+exception%2C+limitation+or+exposition+of+any+word+as+doubtful+and+obscure.+I+do+also+freely+consent+to+the+rejections%2C+with+the+liberty+of+three+or+four+the+like+explications%2C+which+I+will+not+mention%2C+lest+I+seem+quarelsome%2C+or+be+further+tedious%2C+because+they+are+about+smaller+matters+than+those+I+have+mentioned%2C+and+no+way+touching+the+quick+of+the+controverted+articles%2C+and+I+am+persuaded+that+my+sense+of+them+is+the+same+with+the+Synod%E2%80%99s.+And+because+it+is%2C+this+Synod+%5Bwas%5D+purposely+called+against+Arminianism%2C+that+is+the+best+discovery+what+is+to+be+accounted+Arminian+or+Anti-Arminian+doctrine%2C+as+I+think%2C+by+consenting+to+it%3A+I+do+clear+myself+from+that+calumny+with+all+men+of+conscience+and+reason+that+know+it%2C+so+I+shall+think+that+those+who+go+as+much+on+the+other+hand%2C+and+differ+from+the+Synod+one+way%2C+as+much+as+the+Arminians+did+the+other+way%2C+remain+censurable+as+well+as+they%2C+till+somebody+shall+convince+me+that+there+is+but+one+extreme%2C+in+this+case%2C+and+that+a+man+may+hold+what+he+will+without+danger%2C+so+he+be+but+sure+it+go+far+enough+from+Arminianism.+A+man+that+holds+to+the+moderation+of+the+Synod+of+Dort%2C+need+not+say+that+Christ+did+not+die+or+satisfy+for+all+men%2C+nor+need+he+trouble+himself+with+presumptuous+determinations+about+many+mysteries+in+the+decrees+of+God%2C+which+many+volumes+are+guilty+of%3B+Nor+does+he+need+to+aver+the+necessity+of+immediate%2C+physical%2C+efficient+predetermination+by+God+%28as+the+First+Cause%29+of+every+second+cause+natural+and+free%2C+as+without+which+they+cannot+act%3A+Nor+need+he+say%2C+that+God+so+predetermines+to+the+act+which+is+sin%2C+and+not+to+the+sinfulness+of+the+act%3A+Nor+need+he+subscribe+to+all+that+Dr.+%5BWilliam%5D+Twisse+or+Mr.+%5BSamuel%5D+Rutherford%2C+or+such+like%2C+have+written+on+these+points.+Nay%2C+as+this+Synod%2C+so+our+own+%5BWestminster%5D+Assembly+gave+an+example+of+modesty+in+these+points%2C+to+them+that+will+follow+it%2C+not+only+silencing+many+things+which+others+make+the+pillars+of+Anti-Arminianism%2C+but+expressing+that+the+will+is+endued+by+God+with+that+natural+liberty%2C+that+is+neither+forced%2C+nor+by+any+absolute+necessity+of+nature+determined+to+do+good+or+evil%2C+and+therefore+they+never+tell+you+that+God+as+the+First+Cause+must+of+natural+necessity+determine+man%E2%80%99s+will+by+physical%2C+immediate+premotion%2C+before+it+can+act+either+good+or+evil%3A+But+they+reserve+the+honor+of+determining+man%E2%80%99s+will+to+special+grace%2C+renewing+the+will%2C+and+by+almighty+power+determining+it+to+that+which+is+good%2C+ch.+10%2C+sect.+1+and+ch.+9%2C+sect.+1.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Richard+Baxter%E2%80%99s+Confession+of+his+Faith%2C+%28London%3A+R.W.%2C+1655%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7c6a49f814.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7c6a49f814.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=6.%20I%20have%20perused%20over%20all,1%20and%20ch.%209%2C%20sect.%201&amp;text=6.%20I%20have%20perused%20over%20all%20the%20Articles&amp;text=10%2C%20sect.%201%20and%20ch.%209%2C%20sect.%201" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But these physical hardships were not the chief battle in which Paul was engaged. Far more trying was the battle that he fought against the enemies in his own camp. Everywhere his rear was threatened by an all-engulfing paganism or by a perverted Judaism that has missed the real purpose of the Old Testament law. Read the Epistles with care, and you see Paul always in conflict. At one time he fights paganism in life, the notion that all kinds of conduct are lawful to the Christian man, a philosophy that makes Christian liberty a mere aid to pagan license. At another time, he fights paganism in thought, the sublimation of the Christian doctrine of the resurrection of the body into the pagan doctrine of the immortality of the soul. At still another time, he fights the effort of human pride to substitute man’s merit as the means of salvation for divine grace; he fights the subtle propaganda of the Judaizers with its misleading appeal to the Word of God. Everywhere we see the great apostle in conflict for the preservation of the church. It is as though a mighty flood were seeking to engulf the church’s life; dam the break at one point in the levee, and another break appears somewhere else. Everywhere paganism was seeping through; not for one moment did Paul have peace; always he was called upon to fight. Fortunately, he was a true fighter; and by God’s grace he not only fought, but he won. At first sight indeed he might have seemed to have lost. The lofty doctrine of divine grace, the center and core of the gospel that Paul preached, did not always dominate the mind and heart of the subsequent church. The Christianity of the Apostolic Fathers, of the Apologists, of Irenæus, is very different from the Christianity of Paul. The church meant to be faithful to the apostle; but the pure doctrine of the Cross runs counter to the natural man, and not always, even in the church, was it fully understood. Read the Epistle to the Romans first, and then read Irenæus, and you are conscious of a mighty decline. No longer does the gospel stand out sharp and clear; there is a large admixture of human error; and it might seem as though Christian freedom, after all, were to be entangled in the meshes of a new law. But even Irenæus is very different from the Judaizers; something had been gained even in his day : and God had greater things than Irenæus in store for the church. The Epistles which Paul struck forth in conflict with the opponents in his own day remained in the New Testament as a personal source of life for the people of God. Augustine on the basis of the Epistles, set forth the Pauline doctrine of sin and grace; and then, after centuries of compromise with the natural man, the Reformation rediscovered the great liberating Pauline doctrine of justification by faith. So it has always been with Paul. Just when he seems to be defeated, his greatest triumphs, by God’s grace, are in store. …God grant that you—students in the seminary—may be fighters, too! Probably you have your battles even now; you have to contend against sins gross or sins refined; you have to contend against the sin of slothfulness and inertia; you have, many of you, I know very well, a mighty battle on your hands against doubt and despair. Do not think it strange if you fall thus into divers temptations. The Christian life is a warfare after all. John Bunyan rightly set it forth under the allegory of a Holy War; and when he set it forth, in his greater book, under the figure of a pilgrimage, the pilgrimage, too, was full of battles. There are, indeed, places of refreshment on the Christian way; the House Beautiful was provided by the King at the top of the Hill Difficulty, for the entertainment of pilgrims, and from the Delectable Mountains could sometimes be discerned the shining towers of the City of God. But just after the descent from the House Beautiful, there was the battle with Apollyon and the Valley of Humiliation, and later came the Valley of the Shadow of Death. No, the Christian faces a mighty conflict in this world. Pray God that in that conflict you may be true men; good soldiers of Jesus Christ, not willing to compromise with your great enemy, not easily cast down, and seeking ever the renewing of your strength in the Word and sacraments and prayer!</p></blockquote>

e Romans first, and then read Irenæus, and you are conscious of a mighty decline. No longer does the gospel stand out sharp and clear; there is a large admixture of human error; and it might seem as though Christian freedom, after all, were to be entangled in the meshes of a new law. But even Irenæus is very different from the Judaizers; something had been gained even in his day : and God had greater things than Irenæus in store for the church. The Epistles which Paul struck forth in conflict with the opponents in his own day remained in the New Testament as a personal source of life for the people of God. Augustine on the basis of the Epistles, set forth the Pauline doctrine of sin and grace; and then, after centuries of compromise with the natural man, the Reformation rediscovered the great liberating Pauline doctrine of justification by faith. So it has always been with Paul. Just when he seems to be defeated, his greatest triumphs, by God’s grace, are in store. …God grant that you—students in the seminary—may be fighters, too! Probably you have your battles even now; you have to contend against sins gross or sins refined; you have to contend against the sin of slothfulness and inertia; you have, many of you, I know very well, a mighty battle on your hands against doubt and despair. Do not think it strange if you fall thus into divers temptations. The Christian life is a warfare after all. John Bunyan rightly set it forth under the allegory of a Holy War; and when he set it forth, in his greater book, under the figure of a pilgrimage, the pilgrimage, too, was full of battles. There are, indeed, places of refreshment on the Christian way; the House Beautiful was provided by the King at the top of the Hill Difficulty, for the entertainment of pilgrims, and from the Delectable Mountains could sometimes be discerned the shining towers of the City of God. But just after the descent from the House Beautiful, there was the battle with Apollyon and the Valley of Humiliation, and later came the Valley of the Shadow of Death. No, the Christian faces a mighty conflict in this world. Pray God that in that conflict you may be true men; good soldiers of Jesus Christ, not willing to compromise with your great enemy, not easily cast down, and seeking ever the renewing of your strength in the Word and sacraments and prayer!”

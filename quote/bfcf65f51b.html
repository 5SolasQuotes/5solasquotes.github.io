<main class="wrap"><figure class="quote" id="q-bfcf65f51b" data-kw="">
<blockquote><p>[Henry B.] Smith asserted that this historical understanding of the Confession was uniformly acknowledged by the New School. He added: ‘Among honest and candid men, there is really no doubt or question as to what subscription implies. Any candidate, before any of our presbyteries, who should say that he received the Confession ‘as containing the essential principles of Christianity and no more,’ would be unhesitatingly rejected by them.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-donald-fortson-iii.html">S. Donald Fortson III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘New School Calvinism &amp; the Presbyterian Creed’ in The Journal of Presbyterian History</cite>, (1997-), vol. 82, no. 4 (Winter 2004), pp. 221-43, p. 236</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“[Henry B.] Smith asserted that this historical understanding of the Confession was uniformly acknowledged by the New School. He added: ‘Among honest and candid men, there is really no doubt or question as to what subscription implies. Any candidate, before any of our presbyteries, who should say that he received the Confession ‘as containing the essential principles of Christianity and no more,’ would be unhesitatingly rejected by them.&#x27;”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a0bd82f214" data-kw="">
<blockquote><p>But, after all, the best security for sound doctrine is in ‘the force of truth.’ The Bible has maintained its hold on the world, virtually, without subscription to its contents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-p-stanley.html">Arthur P. Stanley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Letter to the Lord Bishop of London on the State of Subscription</cite>, (Oxford: Henry &amp; Parker, 1863), p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“But, after all, the best security for sound doctrine is in ‘the force of truth.’ The Bible has maintained its hold on the world, virtually, without subscription to its contents.”

</figure><figure class="quote" id="q-d1fae8e9d1" data-kw="">
<blockquote><p>First, it is avowed by some that they have not subscribed simply, but with protestations and exceptions, though they be not recorded, which (say they) is not their fault… Others would justify themselves because (as they say) it is not affirmed by their subscription that all things in the Books of Common prayer and of ordaining bishops, priests, and deacons, be agreeable to the Word of God, but [it is] only said that those books contain nothing contrary to the Word of God… A third sort of subscribers would… that of two evils the less is to be chosen: And therefore some things are to be tolerated, rather than the Church should lose the benefit of their ministry… As is evident by these words of the preamble: That the Churches of the Queen’s Majesty’s dominions may be served with pastors of sound religion, Be it enacted, etc. Again, the statute requires subscriprion to the [39] Articles of Religion, and not to all, but such as only concern the confession of the true Christian faith, and the doctrine of the sacraments. Yea that the exception of some articles might be more manifest (and for no other cause) is this word ‘only’ inserted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bradshaw.html">William Bradshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of Subscription</cite>, … (1599), no page numbers</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-7150fa0a38" data-kw="">
<blockquote><p>Thirdly, the doctrine it self (short, but exceeding effectual) of the Lord Jesus and his office, as we shall hear hereafter. Fourthly, after the doctrine, he comes to the exhortation, exhorting the Colossians to constancy and perseverance in the faith and doctrine of Jesus Christ. … for the office of every Evangelist was to water where the apostles before had planted, and to build where they had laid the foundation of the true doctrine of Jesus Christ the Savior.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the Epistle of Paul to the Colossians</cite>, … (d. 1599; London, 1603), 1st Lecture, on Col., 1:1-6</span></figcaption>

</figure><figure class="quote" id="q-8c17769ad8" data-kw="">
<blockquote><p>2…. Now, in order that true religion may shine upon us, we ought to hold that it must take its beginning from heavenly doctrine and that no one can get even the slightest taste of right and sound doctrine unless he be a pupil of Scripture. Hence, there also emerges the beginning of true understanding when we reverently embrace what it pleases God there to witness of Himself… 3… Then we may perceive how necessary was such written proof of the heavenly doctrine…</p></blockquote>

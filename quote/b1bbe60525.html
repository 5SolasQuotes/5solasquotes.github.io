<blockquote><p>Paul is accustomed to speaking in this way, denoting by the word ‘justification’ first of course the remission of sins, yet at the same time always indicating in addition that imparting of righteousness which God proceeds to work in us by the Spirit, the same Spirit by whom he grants us assurance of the pardon of our sins and of his goodwill towards us, and whom he has established as the seal” ([Lugioyo] 52).</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7d996b190a" data-kw="">
<blockquote><p>The incarnation of Christ was once done and is not to be done again; but remission of sin is so done as that it is continually to be done for us, and the ultimate complete effect of it will then only be when sin shall be quite taken away, so that a total and full remission will be only at the Day of Judgment, as appears, Acts 3:19, ‘That your sins may be blotted out, when the times of refreshing shall come:’ Not but that every sin here forgiven is fully and perfectly forgiven, but because we renew sin daily, therefore there is need of a daily pardon: Away therefore with all such opinions as shall either plead such an inherent righteousness in the Pelagian way, or such an imputed righteousness in the Antinomian way that will overthrow this petition [in the Lord’s prayer] for forgiveness of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification, Lecture 14.4</cite></span></figcaption>

</figure><figure class="quote" id="q-db3512187e" data-kw="">
<blockquote><p>To speak of complete, perfect justification of the law before God, such as that which angels have and men who are saved will have in eternity, is to speak of justification as conformity with God, which is as much to say, with God’s law; for God is thus as He gives Himself to be known in the law. This perfect justification in eternity means God Himself is in the saved [seligen]. As St. Paul says, “God will be all in all” [cf. 1 Cor. 15:28; 12:6; Col. 3:11], that is, God Himself is in the saved, and makes them like Himself, so that they are entirely pure, without sin. As John says, ‘We will be like Him’ [1 Jn. 3:2]. St. Paul speaks about this complete and perfect justification in Gal. 5:5, ‘For through the Spirit, by faith, we wait for the hope of righteousness.’ Although in this mortal life believers have a spark, the gospel nevertheless preaches to us the justification of Christ, of the Mediator between God and us, and says that the Mediator’s entire obedience, from his Incarnation until the Resurrection, is the true justification which is pleasing to God, and is the merit for us. God forgives us our sins, and accepted us, in that He imputes righteousness to us for the sake of the Son, although we are still weak and sinful. We must, however, accept this imputed righteousness with faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Melanchthon on Christian Doctrine, Loci Communes, 1555 trans. Clyde L. Manschreck (NY: Oxford Univ. Press, 1965), Locus 13, Of the Word</cite>, p. 161</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-a6e7e6bf5f" data-kw="">
<blockquote><p>the word ‘justify’ has two meanings, the first signifies to absolve anyone from crimes… and to pronounce him just, and is opposed to the word ‘to condemn;’ and this signification is altogether forensic. The other meaning of the word is, that a man is made just from being unjust, as also to be sanctified is, to be made holy from being profane; in which signication the apostle has said, ‘And such were some of you, etc. [1 Cor. 6:11]’, i.e. you have been made, from being unclean, clean, holy from being profane, just from being unjust, by the Holy Ghost, on account of Christ, in whom you believe. To which meaning relates that passage also, which we read in the Revelation, ‘He that is just, let him be justified still more,’ i.e. let him become in truth, from being just, still more just, viz., in the same way as from being unjust, he had been made just. And the Fathers and especially S. Augustine, have interpreted the word in this sense… These are two certain meanings of this word ‘to justify’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>vol. 6, thesis 13, p. 81 [or 84?] in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4</cite>, p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-cb9a80134c" data-kw="">
<blockquote><p>3. Actually, in himself is man said to be justified, when he has the possession of it: But this actual justification has its degrees of progression. The beginning thereof is laid in our first union and incorporation into Christ: The consummation of it is not till the Judge at the latter day has solemnly pronounced the sentence of final absolution, and so set us in full possession of entire remission. Between both these there is a progressive work of justification, by the constant actings of the Spirit applying the blood of Christ, by the hand of faith, to the quiet and comfort of the soul. The first you may term initial justification, the latter perfective, and this between I would call progressive, it is the fruit of the first and the preludial assurance of the latter: This is wrought and sealed in the second sacrament [the Supper], as the former is in the first sacrament [baptism]: and both these branches of sacramental justification are to us the pre-assurance of that complemental and perfective justification; The sentence whereof puts an end to all fears, changing our faith and hope into fruition and full possession; even the first of these acts is not transacted without the seed and spirit of faith, much less the successive agitations, and progress of the work. Thus every way faith is considered as equal with, yea as foregoing the work of justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-bedford.html">Thomas Bedford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Examination of the Chief Points of Antinomianism… (London: Field, 1647), ch. 3, ‘A Brief Answer to the Arguments of H. D. by him brought to prove Justification before Faith, i.e. before the act of Believing’, pp. 32-33 Bedford and Ambrose were sharing some notes one way or the other.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“3. Actually, in himself is man said to be justified, when he has the possession of it: But this actual justification has its degrees of progression. The beginning thereof is laid in our first union and incorporation into Christ: The consummation of it is not till the Judge at the latter day has solemnly pronounced the sentence of final absolution, and so set us in full possession of entire remission. Between both these there is a progressive work of justification, by the constant actings of the Spirit applying the blood of Christ, by the hand of faith, to the quiet and comfort of the soul. The first you may term initial justification, the latter perfective, and this between I would call progressive, it is the fruit of the first and the preludial assurance of the latter: This is wrought and sealed in the second sacrament [the Supper], as the former is in the first sacrament [baptism]: and both these branches of sacramental justification are to us the pre-assurance of that complemental and perfective justification; The sentence whereof puts an end to all fears, changing our faith and hope into fruition and full possession; even the first of these acts is not transacted without the seed and spirit of faith, much less the successive agitations, and progress of the work. Thus every way faith is considered as equal with, yea as foregoing the work of justification.”

— Thomas Bedford, An Examination of the Chief Points of Antinomianism… (London: Field, 1647), ch. 3, ‘A Brief Answer to the Arguments of H. D. by him brought to prove Justification before Faith, i.e. before the act of Believing’, pp. 32-33 Bedford and Ambrose were sharing some notes one way or the other.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+Actually%2C+in+himself+is+man+said+to+be+justified%2C+when+he+has+the+possession+of+it%3A+But+this+actual+justification+has+its+degrees+of+progression.+The+beginning+thereof+is+laid+in+our+first+union+and+incorporation+into+Christ%3A+The+consummation+of+it+is+not+till+the+Judge+at+the+latter+day+has+solemnly+pronounced+the+sentence+of+final+absolution%2C+and+so+set+us+in+full+possession+of+entire+remission.+Between+both+these+there+is+a+progressive+work+of+justification%2C+by+the+constant+actings+of+the+Spirit+applying+the+blood+of+Christ%2C+by+the+hand+of+faith%2C+to+the+quiet+and+comfort+of+the+soul.+The+first+you+may+term+initial+justification%2C+the+latter+perfective%2C+and+this+between+I+would+call+progressive%2C+it+is+the+fruit+of+the+first+and+the+preludial+assurance+of+the+latter%3A+This+is+wrought+and+sealed+in+the+second+sacrament+%5Bthe+Supper%5D%2C+as+the+former+is+in+the+first+sacrament+%5Bbaptism%5D%3A+and+both+these+branches+of+sacramental+justification+are+to+us+the+pre-assurance+of+that+complemental+and+perfective+justification%3B+The+sentence+whereof+puts+an+end+to+all+fears%2C+changing+our+faith+and+hope+into+fruition+and+full+possession%3B+even+the+first+of+these+acts+is+not+transacted+without+the+seed+and+spirit+of+faith%2C+much+less+the+successive+agitations%2C+and+progress+of+the+work.+Thus+every+way+faith+is+considered+as+equal+with%2C+yea+as+foregoing+the+work+of+justification.%E2%80%9D%0A%0A%E2%80%94+Thomas+Bedford%2C+An+Examination+of+the+Chief+Points+of+Antinomianism%E2%80%A6+%28London%3A+Field%2C+1647%29%2C+ch.+3%2C+%E2%80%98A+Brief+Answer+to+the+Arguments+of+H.+D.+by+him+brought+to+prove+Justification+before+Faith%2C+i.e.+before+the+act+of+Believing%E2%80%99%2C+pp.+32-33+Bedford+and+Ambrose+were+sharing+some+notes+one+way+or+the+other.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb9a80134c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb9a80134c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=3.%20Actually%2C%20in%20himself%20is%20man,as%20foregoing%20the%20work%20of%20justification." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

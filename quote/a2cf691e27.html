</figure><figure class="quote" id="q-8161c95a42" data-kw="">
<blockquote><p>Lawyer: But why go you to the parish-churches when you might have better? Minister: 1. All non-conformists preach not better than many of them; yea, the liturgy is better words of prayer than some weak or faulty non-conformists often use. 2. A brown loaf and a white one both may be better than a white one alone; I found both best; and I knew it sin to renounce communion with any Church for weakness because they are not as good as others. 3. That is best at one time and place that is not so at another; praying in itself is better than working, and eating, sleeping. And yet in their proper time your servant’s working and your eating and sleeping is better than praying at that time. One that is a son, a servant, a wife who is commanded by the master of the family to hear a tolerable parish-minister may then find it better than disorderly and disobediently to hear an abler man; that may by variety of conditions be one man’s duty which is another’s sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), ch. 58, ‘Whether Communion with so Faulty a Church be Lawful’, pp. 232-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

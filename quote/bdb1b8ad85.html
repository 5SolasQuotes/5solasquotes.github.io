<main class="wrap"><figure class="quote" id="q-bdb1b8ad85" data-kw="">
<blockquote><p>Latin songs, as well as organs (first introduced into the churches by Pope Vitellianus about 665) are for the most part abolished in the churches of this land. Not that use of the Latin language or of music is rejected of itself and the youth are rightly allowed these in their place, as in the schools and at home in their houses. But it is more profitable and more edifying when in the public assemblies, the prayer, singing, and the whole of the service of worship is performed in a known and intelligible language so that the common man is able to retain something from it, and to say Amen. And this has the apostle Paul commanded the Corinthians in their assemblies (1 Cor. 14), who otherwise highly extols tongues and the variety of languages. So also the superfluous and unbeneficial costs expended on organs are much better directed to other necessary causes in the maintenance of churches and schools.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-nassau-confession.html">The Nassau Confession</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(1578) in James T. Dennison Jr</cite>, ed. Reformed Confessions of the 16th and 17th Centuries in English Translation: 1523–1693, vol. 3 (Grand Rapids, MI: Reformation Heritage Books, 2008–14), 515.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f70124e0d4" data-kw="">
<blockquote><p>There were also supernatural unimitable representations, though not of the divine nature, yet of the divine presence, as the burning bush and the appearances on Mount Sinai. Divine worship directed to such images or representations as to a mediate object, is idolatry. The ark and the cherubims, and the temple, were not made the object of worship. A learned man writes that incurvation in way of religion towards any symbolical presence, as to an object, is flat idolatry; if it be in worship of saints, angels, and demons, it is double idolatry; if in the worship of the true God, single [idolatry]. I suppose it is one thing to make somewhat (as for instance, the ark of the Covenant, and the mercy-seat, and the temple) an object of our consideration in the worship of God, as instructing and exciting therein; and another thing to make it the object of worship itself. And the said author says that to direct our adoration towards a supernatural and unimitable transplendency of the divine presence, is not idolatry. I suppose he means that the burning bush which Moses saw, and the visible glories on the Mount, were only media cultus, not objects thereof, the presence of God shining through the same as a bright medium.</p></blockquote>

</figure><figure class="quote" id="q-915e624165" data-kw="">
<blockquote><p>Things inconvenient even in matters of religion may be commanded in some cases (Circumcision was a burden, Acts 15:10, and these burdens called ‘necessary things,’ v. 28, and they were said to do well if they observe them, v. 29.): as when it is to redeem a far worse inconvenience. For of two evils of punishments, the magistrate may take the less, as well as any other private man. And if that subjects, to prevent worse inconveniences, may use inconvenient ceremonies, then may the magistrate, to preuent worse inconveniences, command inconvenient ceremonies. If the apostles may use the inconvenient Jewish ceremonies, then the apostles may enjoin for a time the use of inconvenient ceremonies: as they did make ordinances about things which yet they called burdens, Acts 15.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter</cite>, pp. 586-98 on 1 Pet. 2:13 in A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter... (London, 1623), pp. 590-91</span></figcaption>

</figure><figure class="quote" id="q-8d6d420903" data-kw="">
<blockquote><p>In worship, their paintings, crossings, crucifixes, bowings, cringings, altars, tapers, wafers, organs, anthems, litany, rails, images, copes, vestments,—what were they but Roman varnish, an Italian dress for our devotion, to draw on conformity with that enemy of the Lord Jesus? In doctrine, the divinity of Episcopacy, auricular confession, free-will, predestination on faith, yea, works foreseen, “limbus patrum,” justification by works, falling from grace, authority of a church, which none knew what it was, canonical obedience, holiness of churches, and the like innumerable,—what were they but helps to Sancta Clara, to make all our articles of religion speak good Roman Catholic? How did their old father of Rome refresh his spirit, to see such chariots as those provided to bring England again unto him! This closing with Popery was the sting in the errors of those days, which cause pining, if not death, in the episcopal pot.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon I: A Vision of unchangeable, free mercy, in sending the means of grace to undeserving sinners, in The Works of John Owen</cite>, (Carlisle: The Banner of Truth Trust, repr. 2009), 8:28.</span></figcaption>

<blockquote><p>II. Answerable to a servant’s obeisance must be his whole behavior before his master, seasoned and ordered with such modesty and humility, as may manifest an honorable respect to his master: as … 2. By uncovering their heads in their master’s presence: this in our days, and in the parts of the world where we dwell, is in the male kind a sign and token of subjection.</p></blockquote>

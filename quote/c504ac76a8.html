<main class="wrap"><figure class="quote" id="q-c504ac76a8" data-kw="">
<blockquote><p>[Margin note:] Schism and actual gathering of churches out of churches cannot be tolerated. 3. Such opinions and practice as make an evident schism in a Church and set up two distinct Churches of different forms of government, and pretending to different institutions of Christ, of which the one must by the nature of their principles labor the destruction of the other, cannot be tolerated, etc. for each pretending their fellow Churches to be of man, and so of the devil, though they should both make one true invisible Church, agreeing in all fundamentals and many other truths, yet sure the whole should be a kingdom divided against itself, and this destroys peace and unity. And if Paul could not endure the divisions of one and the same Church of Corinth, though they pretended not to be different Churches, for those that said they were of Paul professed they could not be disciples of Peter, but he sharply rebuked them as carnal men and such as divided Christ, and by consequence must say Paul was crucified for them and was their redeemer, and so, if obstinately they had proceeded in that separation, Paul would have gone on to higher censures of the Church: far more could he not endure gathering of true Churches out of true Churches, which is the professed practice of Independents: And yet both sides pretending the spirit of discerning could say, ‘The Spirit testifies to my soul that Paul is the only called preacher,’ and the other, ‘Nay but to my discerning, Cephas or Peter is the only man that I can hear or follow.’ And a third, ‘Nay, not any on earth, nor any ministry will I acknowledge but Jesus Christ, whom the heavens must contain till the last day is my only, only preacher.’ Now if a Jezabel come in and say no ministry is to be heard but Christ and turn away all from hearing the Word, and not suffer Sergius Paulus or any other to hear Paul or any godly minister, sure Jezabel should be a perverter of the right ways of the Lord and so not suffered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, ... (London: 1649), ch. 7, ‘What Opinions’, pp. 98-99</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-17d93318c3" data-kw="">
<blockquote><p>But tell me now your opinion of another matter, and that is concerning liberty of conscience, and toleration of heretics and sectaries, for which there are so many books written of late… This question about the toleration of those whose way is different from the common rule which shall be established, must be both stated and resolved, cum grano salis [with a grain of salt]. We must remember to distinguish persons from corporations or Churches, and both these from errors. Again, to distinguish persons, whether godly and gracious, or loose and libertine, whether moderate and peaceable, or factious and turbulent; whether such as have deserved well of the public, or such as have done either no service or a disservice. To distinguish corporation, whether the question be of such only as have a present existence, or of all who shall join to such a way afterward. To distinguish errors, whether practical or doctrinal only, whether fundamental, or circa-fundamental, or neither of the two. To distinguish toleration, whether absolute, or hypothetical and conditional, whether anywhere, or in some few certain places only, whether indefinite and general, or limited and bounded, and if bounded, how far and how much: Whether such toleration as may stand with the Solemn League and Covenant, or such as is inconsistent therewith; whether such as is profitable for the public peace, or such as is apparently destructive thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Late Dialogue Betwixt a Civilian &amp; a Divine Concerning the Present Condition of the Church of England</cite>, … (London, 1644), pp. 30-31</span></figcaption>

</figure><figure class="quote" id="q-096963ca8c" data-kw="">
<blockquote><p>In this context researchers differentiate the colloquies on inaugurating reform in the early years of the Reformation (which were to prepare for the secular government’s decision to introduce new teaching and ecclesiastical practice or to legitimize such a decision) from the later religious dialogues that ideally aimed at a convergence of two religious parties. Contemporaries hardly noticed this difference… Despite all the parallels with the medieval process of disputation, sixteenth-century religious colloquies differed from the academic model at essential points… The representatives of the Reformation decisively rejected the syllogism of Scholasticism as a relevant structure for argumentation for determining theological truth and untruth. A hermeneutic based upon and drawn from Holy Scripture was to govern the establishing of the truth, not arguments based on major and minor premises.</p></blockquote>

</figure><figure class="quote" id="q-d67e8ccc5c" data-kw="">
<blockquote><p>By ‘unity’ we mean the concurrence of men’s judgments, affections and actions about the same thing in one and the same way, and for the same end. By ‘forbearance’ we mean the refraining from uncharitable and unkindly affections and behaviors towards another in some things, although there be some difference between us and him in judgement and in the way of acting about these things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Moderator</cite>, (London: Bellamy, 1652), ch. 3, p. 24</span></figcaption>

<div class="actions"><button class="copy" data-copy="“By ‘unity’ we mean the concurrence of men’s judgments, affections and actions about the same thing in one and the same way, and for the same end. By ‘forbearance’ we mean the refraining from uncharitable and unkindly affections and behaviors towards another in some things, although there be some difference between us and him in judgement and in the way of acting about these things.”

<main class="wrap"><figure class="quote" id="q-8328ff6a8d" data-kw="">
<blockquote><p>He marries her to Himself in righteousness, compassion, faithfulness and love: He puts a robe about her and a ring upon her hand, a tyre upon her head, shoes upon her feet: furnishes her with all his treasure: kills the fat calf, makes her a royal feast…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rogers.html">Daniel Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matrimonial Honour</cite>, (1642), pp. 322-23</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a5f5cc9242" data-kw="">
<blockquote><p>…to return to our main subject, that of matrimony, we see what kind of treaty there was about it, Gen. 34:6, 12, what the contract, Gen. 24:50-51, 57-58, what the solemnizing of it, Gen. 24:67, were in those early days. We read not of any formality in joining of man and woman. Mutual consent made marriage. ‘Wilt thou go with this man?’ And she said, ‘I will go.’ Then when she was come to his house, he took her, and she became his wife.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Authority, Style &amp; Perfection of the Books of the Old &amp; New-Testament with a Continued Illustration of Several Difficult Texts of Scripture throughout the Whole Work</cite>, … (London: Wilkin, 1693), Of the Excellency &amp; Perfection of the Holy Scriptures, ch. 5, p. 227</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-0a69afd8a0" data-kw="">
<blockquote><p>The man comes from China acknowledging God in all his ways, as Abraham left his country, Gen. 12; if he be an idolater, they should not lodge him, 2 Jn. 10; he comes not as indifferent to be married to this or this church, or to none at all, as a man sins not if he marry none at all, 1 Cor. 7, but if he be a professor that joins to no church, he lives scandalously; therefore the adequate cause of membership, or to this membership, is not mutual consent, as in marriage…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, Book 3, ch. 1, p. 283</span></figcaption>

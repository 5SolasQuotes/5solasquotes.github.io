<main class="wrap"><figure class="quote" id="q-62c04b20e0" data-kw="">
<blockquote><p>‘Thou wilt say then unto me: why doth he yet complain? For who can resist his will?’… And forasmuch as not all which hear the Gospel are inwardly with efficacy moved of God, thereof it comes that Paul says to the Corinthians, that it is to some the savor of life to life, and to other some the savor of death to death. This is a plain and simple conciliation of that contrariety which appears to be in the will of God. And because that in these vocations and promises seems to be expressed some will of God which yet takes not effect, certain divines have not unskillfully said that there is one will of the sign, or of the antecedent: another will of efficacy, or of the consequent. For it oftentimes happens, that God either threatens or promises a thing, which yet shall not come to pass. And yet does not God therefore lie, or deceive. For He pronounces those things, either as nature was then ordered, or as through ill deserts it might come to pass, unless some change were had in the mean time. So was Ezekiel told that he should die: because that disease whereof he was sick was by nature deadly. Wherefore the prophet in those threats pronounced, God’s will of the sign: that is, so much as could be known by the force of nature. But the changing came of the will of God which is of efficacy, which they call the consequent. Nineveh also for the grievous sins thereof was worthy to be destroyed. Wherefore Jonah showed unto them the antecedent will of God, which they call the will of the sign: Wherefore when God calls Pharaoh or any other reprobate, by that vocation or outward promise we understand the antecedent will, or the will of the sign, but that other hidden will, which they call the will of efficacy, or the consequent, we understand not. Wherefore God cannot deny Himself, neither does He in these wills strive against Himself. But by his doctrine and promises being in differently and generally set forth, He stirs up the minds of the ministers of the Church, cheerfully to preach the word and that unto all men: which thing doubtless they would not do, if He had made them assured of his hidden will. For if they knew that they had to deal with men reprobate, they would utterly be discouraged, and give over.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most Learned &amp; Fruitful Commentaries</cite>, … upon… Romans... (London: Daye, 1568), ch. 9, pp. 269-70</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f529867863" data-kw="">
<blockquote><p>X. We may sometimes interchange the eudokian [good-purpose of decree] for the euarestia [good-pleasure or complacency of the revealed will], when it is spoken of those things with which God is pleased because there is in them some quality or condition which agrees with the nature of God and therefore conciliates his favor…

XI. Eurestia contradistinguished from eudokian in this connection means nothing else than the mere complacency by which God approves anything as just and holy and delights in it (and besides wills to prescribe it to the creature as his most just duty). Hence it does not properly include any decree or volition in God, but implies only the agreement of the thing with the nature of God (according to which He cannot but love what is agreeable to his holiness)… … XX. The will of sign which is set forth as extrinsic ought to correspond with some internal will in God that it may not be false and deceptive; but that internal will is not the decree concerning the gift of salvation to this or that one, but the decree concerning the command of faith and promise of salvation if the man does believe (which is founded both upon the connection established by God between faith and salvation and the internal disposition of God by which, as He loves Himself, He cannot but love his image wherever He sees it shining and is so much pleased with the faith and repentance of the creature as to grant it salvation).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 1 | 3rd Topic, ‘The Will of God’, 15th Question, ‘May the will be properly distinguished into the will of decree and of precept, good purpose (eudokias) and good pleasure (euarestias), signified, secret and revealed? We affirm., pp. 222, 224</span></figcaption>

<blockquote><p>A second question is, How far the Law can draw a sinner to Christ? Antinomians tell us of a legal drawing and conversion, and of an evangelic drawing; the legal drawing they say is ours [that of the reformed]; the latter theirs. Assertion 1. The difference between the letter of the Law and the Gospel is not in the manner of working, for the letter of either Law or Gospel is alike ineffectual and fruitless to draw any to Christ. Christ preached the Gospel to hard-hearted Pharisees; it moved them not. Moses preached the Law and the curses thereof to the stiffnecked Jews and they were as little humbled. Sounds and syllables of ten hells, of twenty heavens and Gospels, without the Spirit’s working, are alike fruitless. And we grant the Law is a sleepy keeper of a captive sinner; he may either steal away from his keeper or if he be awed with his keeper, he is not kept from any spiritual, internal breach of the Law, nor moved thereby to sincere and spiritual walking. But the difference between Law and Gospel is not in the internal manner of working, but in two other things:

1. In the matter contained in Law and Gospel: because nature is refractory to violence and the Law can do nothing but curse sinners; therefore it can draw no man to Christ. The Gospel again contains sweet and glorious promises of giving a new heart to the elect, of admitting to the Prince of peace laden and broken-hearted mourners in Zion and in conferring on them a free imputed righteousness; and this is in itself a taking-way, but without the Gospel-spirit [it is] utterly ineffectual.

2. To the Gospel there is a Spirit added, which works as God does with an omnipotent pull; and this Spirit does also use the Law to prepare and humble; though this be by a higher power than goes along with the Law as the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London: 1647), pp. 272-318</span></figcaption>

+than+goes+along+with+the+Law+as+the+Law.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself%2C+%E2%80%A6+%28London%3A+1647%29%2C+pp.+272-318&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fafa1392f2c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/afa1392f2c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=A%20second%20question%20is%2C%20How%20far,with%20the%20Law%20as%20the%20Law&amp;text=A%20second%20question%20is%2C%20How%20far%20the%20Law&amp;text=goes%20along%20with%20the%20Law%20as%20the%20Law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>In vain [it is] to participate of those mysteries of our salvation, the body and blood of our Lord, till first by self-examination we have cast out the venom of our sinful doings by repentance and steadfast purposes of amendment. In a word, it is our sins unrepented that make void and ineffectual all the blessed means of grace and of the Spirit; by those it is we quench the Spirit, we grieve the Spirit, we resist the Spirit, we provoke the Spirit (1 Thess. 5:19; Eph. 4:30), and poison the blessed nature of life; so that all the conveyances of the Spirit are barren and unfruitful whilst they reflect upon hardened and impenitent hearts.</p></blockquote>

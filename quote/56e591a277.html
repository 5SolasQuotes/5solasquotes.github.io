<main class="wrap"><figure class="quote" id="q-56e591a277" data-kw="">
<blockquote><p>A second general attribution of the Lord’s Supper, from whence it is endeavored [by opponents] to conclude to the sinfulness of giving it, in any case, unto such as are known by the minister to be unworthy receivers [though they have not been convicted by the Session of elders], is, its being a seal of the Covenant of Grace, the righteousnesse of faith. For hence think some, it follows that administration of the Lord’s Supper unto known scandalous and wicked persons, is a practical and visible lie, a confirmation of an untruth, because it seals the Covenant and promises to those who have visibly no share in them. For answer: The Lord’s Supper may be said to be a seal of the Covenant, or promise of grace, either absolutely, or conditionally. The truth of the Covenant and promises in themselves, our obligation to gratitude and obedience, are sealed absolutely by the Lord’s Supper; but interest in the Covenant and promises of grace, the Lord’s Supper seals unto those that partake thereof, but conditionally, so they believe: Unto wicked men the promises are as propounded, so sealed but conditionally. Sacramenta (says [William] Ames) non sunt testimonia completa et absoluta nisi credentibus. They are (says Rutherford) seals unto the wicked, not in actu secundo [by the following act of exercised power], but only in actu primo [in their first act of being, apart from that being exercised]. See Mr. [Stephen] Marshall in his Defence of Infant Baptism Against Tombs, [1646,] pp. 117-8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want of Church-Government… (London, 1650), p. 60 Jeanes was an English presbyterian.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-80f4c94ea9" data-kw="">
<blockquote><p>First ‘private’ signifies that which is done privily in a clanculary [clandestine] manner by stealth, without authority contrary to God’s Word by Jesuits, seminary priests, schismatical teachers, and the like; in which sort, if any of our [antagonist] brethren mean, they prove nothing against us, for our [Anglican] Church generally condemns such conventicles, whether of heretics, or schismatics. Secondly, private baptism signifies in the meaning of the [Prayer] Book, that which is administered by a lawful minister at home, where the child is born, a competent number being assembled, the child being weak, the church or chapel far distant, the season of the year oversharp, the way very inconvenient, all which, or the like occasions, are matters of circumstance; the lawfulness of baptism is no way frustrated, nor made void, nor against God’s Word, nor a private action. For as one well notes, ‘Sacraments though they be in private places administered, yet are public actions.’ ([Andrew Willet] Synopsis Papismi, p. 490)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cotton.html">William Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 10, ‘Private Communion’ in Answer to the Reasons for Refusal of Subscription in Reasons for Refusal of Subscription to the Book of Common Prayer under the hands of certain Ministers of Devon and Cornwall... as they were exhibited by them to the Right Reverend Father in God William Coton… with an Answer... (London, 1605), p. 194 Cotton was an Anglican bishop.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-ae377637cb" data-kw="">
<blockquote><p>Neither can ye also of this matter, or of any my words gather that any part that remains after the receiving of the sacrament should be worshipped. For whatsoever strength the outward signs in the sacraments have, they have it of the Holy Ghost, of the Lord’s words, and of his institution and ordinance. Which things do no longer remain than while the use and receiving of the sacrament does continue. And the promise of God is applied to this sacrament whiles we eat and drink the sacrament. Wherefore that opinion and doctrine of reserving the sacrament was not catholic, nor universally used or received in the Christian congregations… We do not deny but that the leavings of the sacrament were sometimes reserved and kept: but it was done without any worshipping of it, and without any superstitious points of reverence. The leavings of this sacrament were delivered to children and to women to be carried to sick folk, as it is plain in the history of Eusebius and in Jerome, one of the doctors of the Church. And I would somewhat stagger to say the receiving of such leavings being done privately out of the holy company, and without the order and manner of receiving the communion instituted of Christ, was a right, a full and a perfect receiving of the communion or of the sacrament, which receiving of the sacrament among the sick folks I could yet nevertheless grant unto, so that the same do repeat the holy words of Christ and so ye some honest Christians do there among themselves put in use the ordinance of Christ in this behalf. For except more persons than one alone do receive the communion together: the due order and course of receiving this sacrament is not observed and kept. Christ’s words were to more than one, in this sort: Accipe, edite et bibite: that is to say, ‘Take ye, eat ye, and drink ye.’ There is bread broken into sundry pieces, which thing means that it should be dealed about and distributed to more than one. And they speak many things in their canon of the old mass, which unless a number do receive it together, are stark false and very lies. And besides this, it is called of learned men, coena, a supper, communio, a communion, and synaxis, a gathering or coming together: which names do nothing agree with a private action or doing of one person alone by himself. Neither do we in any place read in old writers of any private masses where one alone might receive the sacrament without the company of others. Honorius, bishop of Rome, was the first that made a decree that the sacrament of eucharistia should be reserved and kept and decreed further, that honor and reverence should be done to it, when it was carried abroad any whither. That if this thing had been done of others before his days, it had not belonged unto him to make a decree of any such thing. And to speak in a brief sum, we affirm and hold (as we have before said) that this sacrament has not his full strength and virtue and efficacy but whiles it is in doing and in executing, and whiles it is in receiving: which thing you see also to be done in all the other sacraments [such as the brazen serpent].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse or Treatise… concerning the Sacrament of the Lord’s Supper (London, 1550)</cite>, p. lxxi</span></figcaption>

ext=Neither%20can%20ye%20also%20of%20this,sacraments%20%5Bsuch%20as%20the%20brazen%20serpent&amp;text=Neither%20can%20ye%20also%20of%20this%20matter%2C%20or&amp;text=the%20other%20sacraments%20%5Bsuch%20as%20the%20brazen%20serpent" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>In what place is (the H. Supper) to be administered? In public assembly, not to individuals privately or to those ill in bed at home or about to die without the congregation of the faithful and their participation. Communication should be ecclesiastical and public, not an idion deipnon [a private supper]. And the Supper is a symbol of the communion of saints…</p></blockquote>

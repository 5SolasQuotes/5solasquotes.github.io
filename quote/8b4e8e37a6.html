<blockquote><p>16. For God so loved the world. Christ opens up the first cause, and, as it were, the source of our salvation, and he does so, that no doubt may remain; for our minds cannot find calm repose, until we arrive at the unmerited love of God. As the whole matter of our salvation must not be sought any where else than in Christ, so we must see whence Christ came to us, and why he was offered to be our Saviour. Both points are distinctly stated to us: namely, that faith in Christ brings life to all, and that Christ brought life, because the Heavenly Father loves the human race, and wishes that they should not perish. And this order ought to be carefully observed; for such is the wicked ambition which belongs to our nature, that when the question relates to the origin of our salvation, we quickly form diabolical imaginations about our own merits. Accordingly, we imagine that God is reconciled to us, because he has reckoned us worthy that he should look upon us. But Scripture everywhere extols his pure and unmingled mercy, which sets aside all merits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on John</cite>, vol. 1 (Bellingham, WA: Logos Bible Software, 2010), 122–123.</span></figcaption>

<blockquote><p>Nay more than this, we deny not but in some sense this reward may be said to proceed of justice. For howsoever originally and in itself we hold it comes from God’s free bounty and mercy, who might have required the work of us without all promise of reward (for, as I said, we are his creatures and owe our being unto Him), yet in regard He has covenanted with us, and tied Himself by his Word and promise to confer such a reward, the reward now in a sort proves to be an act of justice, namely of justitia promissi [justice of promise] on God’s part, not of merit on ours: even as in forgiving our sins (which in itself all men know to be an act of mercy) He is said to be ‘faithful and just’, 1 Jn. 1:9, namely in the faithful performance of his promise; for promise (we know) once made, among honest men is accounted a due debt. But this argues no more any worthiness of equality in the work toward the obtaining of the reward than if a promise of a kingdom were made to one if he should take up a straw, it would follow thence that the lifting up of a straw were a labor or a work worth a kingdom; howsoever, he that should so promise were bound to give it. Thus was Moses careful to put the children of Israel in mind touching the land of Canaan (Dt. 9:5, which was a type of our eternal habitation in Heaven), that it was a land of promise, and not of merit, which God gave them to possess, not for their righteousness, or for their upright heart, but that He might perform the word which He swore unto their fathers, Abraham, Isaac, and Jacob. Whereupon the Levites, in the Book of Nehemiah, say in their prayer to God: ‘Thou madest a covenant with Abraham, to give to his seed the land of the Canaanites, and hast performed thy words, because Thou art just,’ (Neh. 9:8) that is, true and faithful in keeping thy promise. Now because the Lord has made a like promise of the crown of life to them that love Him, St. Paul sticks not in like manner to attribute this also to God’s justice; ‘Henceforth’ (says he, 2 Tim. 4:8) ‘is laid up for me a crown of righteousness, which the Lord the righteous Judge shall give me at that day; and not to me only, but to all them that love his appearing.’ Upon which St. Bernard most sweetly, as he is wont: Est ergo quam Paulus expectat corona iustitiae; sed iustitiae Dei, non suae: iustum quippe est, ut reddat quod debet; debet autem quod pollicitus est. ‘There is therefore a crown of righteousness which Paul looks for; but it is of God’s righteousness, not his own: it being a righteous thing with God to give what he owes; now he owes what he has engaged himself to by promise.’ Lastly, for the word ‘merit’, it is not the name we so much scruple at, as the thing now-a-days to be understood thereby: otherwise we confess the name might be admitted, if taken in the large and more general sense, for any work having relation to a reward to follow it, or whereby a reward is quocunque modo [in whatever way] obtained; in a word, as the correlate indifferent either to merces gratiae or iustitiae, ‘the reward of grace or of justice’. For thus the Fathers used it; and so might we have done still, if some of us had not grown too proud, and mistaken it. Since we think it better and safer to disuse it, even as physicians are wont to prescribe their patients recovered of some desperate disease, not to use any more [of] that meat or diet which they find to have caused it.</p></blockquote>

</figure><figure class="quote" id="q-d8aa891617" data-kw="">
<blockquote><p>Therefore the Papists err grievously when they confuse works taken generally with merits, and as soon as they hear of a pious work being commanded, immediately understand merit and a work spoken of in a legal sense. Likewise, when they hear that a reward is promised, they again understand it juridically and legally, as in some contract of hiring and payment; whereas reward is commonly called whatever we obtain after preceding labor and difficulties, whose fear might have deterred us from a good purpose, and which are compensated by the sweetness of the good that follows. Such are not only: (1) the rendering of a good to which a preceding work corresponds in equal worth (that is, merit of condignity)… … (3) Likewise, the execution of a promise made under a condition—not only of gratefully accepting and not despising the gift (for no donation is so free and pure as not to include this condition), but also of a certain work, besides acceptance and gratitude, required in addition—which therefore is in some sense meritorious, although there is perhaps no equality or commutation between the work and the promised reward; as if a father promises a jewel to his son who takes bitter medicine, or a prince promises a prize to a subject engaged in an exercise or contest beneficial to him. In this case, the donation is not purely free, since the thing does not begin to be owed as soon as the promise is accepted, but only when the condition is fulfilled; nor is it properly merit of condignity, since the worker benefits himself rather than giving something to another for which he ought to receive an equal price. Hence again it effects nothing properly by its own virtue or dignity, but only from the liberality, magnificence, and mercy of the giver, or of one interceding with him. Yet it is a certain merit improperly so called, which they call merit by covenant. Something of this kind, with respect to good works in the children of God, to whom God has promised rewards, is admitted by the Apology of the Augsburg Confession [written by Philip Melanchthon] in response to the argument—although others, on account of the ambiguity and great abuse of the term “merit,” not without reason reject it altogether. [4] Another [kind of merit] is what they call merit of congruity [or proportion], which either seems not to signify merit at all, or involves a contradiction, etc.</p></blockquote>

— Conrad Bergius, Praexi Cathol. Divin. Canon., Dissertation 7, pp. 963-64 as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 364, trans. ChatGPT-5 Bergius (1544-1592) was a German reformed theologian.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore+the+Papists+err+grievously+when+they+confuse+works+taken+generally+with+merits%2C+and+as+soon+as+they+hear+of+a+pious+work+being+commanded%2C+immediately+understand+merit+and+a+work+spoken+of+in+a+legal+sense.+Likewise%2C+when+they+hear+that+a+reward+is+promised%2C+they+again+understand+it+juridically+and+legally%2C+as+in+some+contract+of+hiring+and+payment%3B+whereas+reward+is+commonly+called+whatever+we+obtain+after+preceding+labor+and+difficulties%2C+whose+fear+might+have+deterred+us+from+a+good+purpose%2C+and+which+are+compensated+by+the+sweetness+of+the+good+that+follows.+Such+are+not+only%3A+%281%29+the+rendering+of+a+good+to+which+a+preceding+work+corresponds+in+equal+worth+%28that+is%2C+merit+of+condignity%29%E2%80%A6+%E2%80%A6+%283%29+Likewise%2C+the+execution+of+a+promise+made+under+a+condition%E2%80%94not+only+of+gratefully+accepting+and+not+despising+the+gift+%28for+no+donation+is+so+free+and+pure+as+not+to+include+this+condition%29%2C+but+also+of+a+certain+work%2C+besides+acceptance+and+gratitude%2C+required+in+addition%E2%80%94which+therefore+is+in+some+sense+meritorious%2C+although+there+is+perhaps+no+equality+or+commutation+between+the+work+and+the+promised+reward%3B+as+if+a+father+promises+a+jewel+to+his+son+who+takes+bitter+medicine%2C+or+a+prince+promises+a+prize+to+a+subject+engaged+in+an+exercise+or+contest+beneficial+to+him.+In+this+case%2C+the+donation+is+not+purely+free%2C+since+the+thing+does+not+begin+to+be+owed+as+soon+as+the+promise+is+accepted%2C+but+only+when+the+condition+is+fulfilled%3B+nor+is+it+properly+merit+of+condignity%2C+since+the+worker+benefits+himself+rather+than+giving+something+to+another+for+which+he+ought+to+receive+an+equal+price.+Hence+again+it+effects+nothing+properly+by+its+own+virtue+or+dignity%2C+but+only+from+the+liberality%2C+magnificence%2C+and+mercy+of+the+giver%2C+or+of+one+interceding+with+him.+Yet+it+is+a+certain+merit+improperly+so+called%2C+which+they+call+merit+by+covenant.+Something+of+this+kind%2C+with+respect+to+good+works+in+the+children+of+God%2C+to+whom+God+has+promised+rewards%2C+is+admitted+by+the+Apology+of+the+Augsburg+Confession+%5Bwritten+by+Philip+Melanchthon%5D+in+response+to+the+argument%E2%80%94although+others%2C+on+account+of+the+ambiguity+and+great+abuse+of+the+term+%E2%80%9Cmerit%2C%E2%80%9D+not+without+reason+reject+it+altogether.+%5B4%5D+Another+%5Bkind+of+merit%5D+is+what+they+call+merit+of+congruity+%5Bor+proportion%5D%2C+which+either+seems+not+to+signify+merit+at+all%2C+or+involves+a+contradiction%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Conrad+Bergius%2C+Praexi+Cathol.+Divin.+Canon.%2C+Dissertation+7%2C+pp.+963-64+as+the+Latin+is+in+Richard+Baxter%2C+Richard+Baxter%E2%80%99s+Confession+of+his+Faith%E2%80%A6+%28London%3A+1655%29%2C+ch.+10%2C+sect.+3%2C+p.+364%2C+trans.+ChatGPT-5+Bergius+%281544-1592%29+was+a+German+reformed+theologian.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd8aa891617.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d8aa891617.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-judgment/bible-verses-on-rewards-in-heaven/#:~:text=Therefore%20the%20Papists%20err%20grievously%20when,all%2C%20or%20involves%20a%20contradiction%2C%20etc&amp;text=Therefore%20the%20Papists%20err%20grievously%20when%20they%20confuse&amp;text=merit%20at%20all%2C%20or%20involves%20a%20contradiction%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-552f034c8c" data-kw="">
<blockquote><p>The term &quot;merit&quot; refers in general to the recompense owed by a community or a society for the action of one of its members, experienced either as beneficial or harmful, deserving reward or punishment. Merit is relative to the virtue of justice, in conformity with the principle of equality which governs it. … With regard to God, there is no strict right to any merit on the part of man. Between God and us there is an immeasurable inequality, for we have received everything from him, our Creator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §§2006–2007</span></figcaption>

</figure><figure class="quote" id="q-db6e52eb0d" data-kw="">
<blockquote><p>The question also arises, whether it was strictly speaking through his passion and death that Christ merited this glory for his human nature. And whereas we really do not wish to enter into a dispute with those who make this claim,† since Christ certainly did obtain it for us by the worthiness of what He merited, yet we are of the opinion that the opposite point of view, which is shared by many Reformed writers, rests upon arguments that are stronger. The chief one of these is that the glory was owed to Christ by the right of his hypostatic union, and as the Son’s, and as the Son’s rightful inheritance (Ps. 2:7-8; Heb. 1:2). And so, by the consensus of all theologians, that hypostatic union does not follow upon any merit, nor the things which necessarily and by God’s decree followed it–which is why the apostle Paul also uses the word [karisasthai] ‘to bestow as gift’ in this context (Phil. 2:9 [‘and given Him’]).</p></blockquote>

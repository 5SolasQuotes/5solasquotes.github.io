<main class="wrap"><figure class="quote" id="q-eeee457770" data-kw="">
<blockquote><p>Thus have I shown you the nature of the promise of the covenant of works, and the life therein made over conditionally to man. If we consider the life Adam could have expected from God, in a course of obedience, though there had been no covenant, we say, Adam performing obedience, according to the natural law written in his heart, would have had a prosperous life and being, while he had a being; this Adam might conclude from the good and bountiful nature of God. But still it would have been consistent with the nature of God, to have withdrawn his supporting hand from man, so as he might have ceased to be any more. And this would have been but taking away freely what ho gave freely, being under no obligation to continue it; for even Adam’s innocent works could not have properly merited at God’s hand, Rom. xi. 35, “Who hath first given to him, and it shall be recompensed unto him again?” They could have only merited improperly, by virtue of compact, not by the intrinsic worth of the thing. Here,

[1.] The continuation of life to Adam, even while he continued obedient, was entirely due to the covenant God was pleased to make with him. And here was grace even in the covenant of works, that God was pleased by promise to secure the continuance of man’s being, while he continued obedient.

[2.] The right that Adam could have pled to eternal life in heaven, by virtue of his obedience, was entirely founded on the covenant. If God had not revealed to him the promise of it, he could not have known that he should have had it, nor could he have demanded it. The natural law had no such promise. And here was more grace in the covenant of works. And therefore it is no wonder, that though men overturn the gospel-doctrine of free grace, yet they will not take with it. The Pharisees of old, Luke xviii. 11, and the Papists to this day, own free grace in their profession; and what wonder, since innocent Adam, pleading life upon his works, could not have denied but he was debtor to free grace? But here lies the matter; they pat in their own works, their repentance, holiness, and obedience, (turning faith into a work, that it may go in with the rest), between free grace and them, making themselves but debtors to it at second hand for life and salvation.

And if one shall tell sinners, Here you are to do or work nothing for life and salvation, but only receive the free grace gift of life and salvation from Christ by faith, and be debtors at first hand; though withal we tell them, that repentance, holiness, obedience, and good works, are the inseparable attendants of faith; they cry out, Error, Antinomianism, Licentious doctrine! Yet it is the doctrine of the gospel, Tit. iii. 5; Eph. ii. 8. And it is not the doctrine of the gospel, nor does the apostle say, “By grace ye are saved, through works;” for so would Adam have been saved according to the covenant of works, being debtor to free grace at the second hand, which the proud Pharisee was content to be. It is true, Adam’s obedience was perfect, ours is not; but buying is buying still, though one buy ten times below the worth, as well as when he buys at the full value.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Works, from the Sacred Records</cite>, (1772) in The Whole Works of the Late Reverend Thomas Boston of Ettrick, ed. Samuel McMillan (12 vols, Aberdeen: George and Robert King, 1852), 11: 206-07.</span></figcaption>

</figure><figure class="quote" id="q-f56fe54d25" data-kw="">
<blockquote><p>There is still another area in which the Reformed view of the law is influenced by the idea of the covenant. Even after the fall, the law retains something of its covenantal form. The law was not included in the federal relationship without having been affected by it. Even today the call of the law sounds in our ears: such a life I would give you, if only you could fulfil me! God could have wholly eradicated that relation and have taken away the last traces of it from our minds, after the covenant of works was broken. However, He kept its memory alive in us. He has repeated that promise hypothetically and consequently has held up before us constantly the ideal of eternal life to be obtained by keeping the law, a lost ideal though it be. Thus the essential content of the concept of covenant has been kept in our consciousness. When the work of the Spirit by means of the law and the gospel leads to true conversion, in this conversion the longing for this lost ideal of the covenant appears as an essential part. From the above we can also explain why the older theologians did not always clearly distinguish between the covenant of works and the Sinaitic covenant. At Sinai it was not the “bare” law that was given, but a reflection of the covenant of works revived, as it were, in the interests of the covenant of grace continued at Sinai</p></blockquote>

<blockquote><p>1. I shall confirm this great truth, and evince the being of such a covenant. It is altogether denied by the Arminians that there was any such covenant, and amongst ourselves by Professor Simson, that it was a proper covenant. The weight of this matter lies here, that if the covenant made with Adam was not a proper covenant, he could not be a proper representing head; and if he was not, then there cannot be a proper imputation of Adam’s sin unto his posterity. None could ever dream, but there must be a manifest difference betwixt covenants between God and man, and those between men and men. There is no manner of equality betwixt God and man; God could require all duty of men without any covenant; yea, they have nothing but what is from him, and so owe it to him. But those things do not hinder, that, upon God’s condescending to enter into a covenant with man, there may be a proper covenant betwixt them. Though all similitudes here must halt; yet let us suppose a father to propose to his son, that if he will obey his orders, and especially in one point give him punctual obedience, for instance, labour his vineyard, he will give him a certain sum of money; and the son having nothing to labour it with, the father furnishes him with all things necessary thereto; the son accepts of this proposal. Can any man say that there is not a proper bargain, or covenant, in this case betwixt the father and his son, although the son was tied by the bond of nature to obey his father’s commands in all this antecedently to the bargain, and though he has nothing to labour it with, but what he has from the father? Let him perform his father’s orders now according to the covenant, and he can challenge the sum as a debt, which he could not do before. For proof this, consider, 1. Here is a concurrence of all that is necessary to constitute a true and proper covenant of works. The parties contracting, God and man; God requiring obedience as the condition of life; a penalty fixed in case of breaking; and man acquiescing in the proposal. The force of this cannot be evaded, by comparing it with the consent of subjects to the laws of an absolute prince. For such a law proposed by a prince, promising a reward upon obedience to it, is indeed the proposing of a covenant, the which the subject consenting to for himself and his, and taking on him to obey, does indeed enter into a covenant with the prince, and having obeyed the law may claim the reward by virtue of paction. And so the covenant of works is ordinarily in scripture called “the law,” being in its own nature a pactional law.

2. It is expressly called a covenant in scripture, Gal. 4:2, “For these are the two covenants, the one from the Mount Sinai,” &amp;c. This covenant from Mount Sinai was the covenant of works as being opposed to the covenant of grace, namely, the law of the ten commandments, with promise and sanction, as before expressed. At Sinai it was renewed indeed, but that was not its first appearance in the world. For there being but two ways of life to be found in scripture, one by works, the other by grace; the latter hath no place, but where the first is rendered ineffectual; therefore the covenant of works was before the covenant of grace in the world; yet the covenant of grace was promulgated quickly after Adam’s fall; therefore the covenant of works behoved to have been made with him before. And how can one imagine a covenant of works set before poor impotent sinners, if there had not been such a covenant with man in his state of integrity? Hos. 6:7, “But as for them; like Adam, they have transgressed the covenant.” Our translators set the word Adam on the margin. But in Job 31:33, they translate the very same word, “as Adam.” This word occurs but three times in scripture, and still in the same sense. Job 31:33, “If I covered my transgressions, as Adam,” Psalm 82:7, “But ye shall die like Adam.” Compare ver. 6, “I have said, Ye are gods; and all of you are children of the Most High;” compared with Luke 3:38, “Adam, which was the son of God.” And also here, Hos. 6:7. While Adam’s hiding his sin, and his death are made an example, how natural is it that his transgression, that led the way to all, be made so too? This is the proper and literal sense of the words; it is so read by several, and is certainly the meaning of it.

3. We find a law of works opposed to the law of faith, Rom. 3:27. “Where is boasting then? It is excluded. By what law? of works? Nay; but by the law of faith.” This law of works is the covenant of works, requiring works, or obedience, as the condition pleadable for life; for otherwise the law as a rule of life requires works too. Again, it is a law that does not exclude boasting, which is the very nature of the covenant of works, that makes the reward to be of debt. And further, the law of faith is the covenant of grace; therefore the law of works is the covenant of works. So Rom. 6:14, “Ye are not under the law, but under grace.” And this was the way of life without question, which was given to Adam at first.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“1. I shall confirm this great truth, and evince the being of such a covenant. It is altogether denied by the Arminians that there was any such covenant, and amongst ourselves by Professor Simson, that it was a proper covenant. The weight of this matter lies here, that if the covenant made with Adam was not a proper covenant, he could not be a proper representing head; and if he was not, then there cannot be a proper imputation of Adam’s sin unto his posterity. None could ever dream, but there must be a manifest difference betwixt covenants between God and man, and those between men and men. There is no manner of equality betwixt God and man; God could require all duty of men without any covenant; yea, they have nothing but what is from him, and so owe it to him. But those things do not hinder, that, upon God’s condescending to enter into a covenant with man, there may be a proper covenant betwixt them. Though all similitudes here must halt; yet let us suppose a father to propose to his son, that if he will obey his orders, and especially in one point give him punctual obedience, for instance, labour his vineyard, he will give him a certain sum of money; and the son having nothing to labour it with, the father furnishes him with all things necessary thereto; the son accepts of this proposal. Can any man say that there is not a proper bargain, or covenant, in this case betwixt the father and his son, although the son was tied by the bond of nature to obey his father’s commands in all this antecedently to the bargain, and though he has nothing to labour it with, but what he has from the father? Let him perform his father’s orders now according to the covenant, and he can challenge the sum as a debt, which he could not do before. For proof this, consider, 1. Here is a concurrence of all that is necessary to constitute a true and proper covenant of works. The parties contracting, God and man; God requiring obedience as the condition of life; a penalty fixed in case of breaking; and man acquiescing in the proposal. The force of this cannot be evaded, by comparing it with the consent of subjects to the laws of an absolute prince. For such a law proposed by a prince, promising a reward upon obedience to it, is indeed the proposing of a covenant, the which the subject consenting to for himself and his, and taking on him to obey, does indeed enter into a covenant with the prince, and having obeyed the law may claim the reward by virtue of paction. And so the covenant of works is ordinarily in scripture called “the law,” being in its own nature a pactional law.

2. It is expressly called a covenant in scripture, Gal. 4:2, “For these are the two covenants, the one from the Mount Sinai,” &amp;c. This covenant from Mount Sinai was the covenant of works as being opposed to the covenant of grace, namely, the law of the ten commandments, with promise and sanction, as before expressed. At Sinai it was renewed indeed, but that was not its first appearance in the world. For there being but two ways of life to be found in scripture, one by works, the other by grace; the latter hath no place, but where the first is rendered ineffectual; therefore the covenant of works was before the covenant of grace in the world; yet the covenant of grace was promulgated quickly after Adam’s fall; therefore the covenant of works behoved to have been made with him before. And how can one imagine a covenant of works set before poor impotent sinners, if there had not been such a covenant with man in his state of integrity? Hos. 6:7, “But as for them; like Adam, they have transgressed the covenant.” Our translators set the word Adam on the margin. But in Job 31:33, they translate the very same word, “as Adam.” This word occurs but three times in scripture, and still in the same sense. Job 31:33, “If I covered my transgressions, as Adam,” Psalm 82:7, “But ye shall die like Adam.” Compare ver. 6, “I have said, Ye are gods; and all of you are children of the Most High;” compared with Luke 3:38, “Adam, which was the son of God.” And also here, Hos. 6:7. While Adam’s hiding his sin, and his death are made an example, how natural is it that his transgression, that led the way to all, be made so too? This is the proper and literal sense of the words; it is so read by several, and is certainly the meaning of it.

3. We find a law of works opposed to the law of faith, Rom. 3:27. “Where is boasting then? It is excluded. By what law? of works? Nay; but by the law of faith.” This law of works is the covenant of works, requiring works, or obedience, as the condition pleadable for life; for otherwise the law as a rule of life requires works too. Again, it is a law that does not exclude boasting, which is the very nature of the covenant of works, that makes the reward to be of debt. And further, the law of faith is the covenant of grace; therefore the law of works is the covenant of works. So Rom. 6:14, “Ye are not under the law, but under grace.” And this was the way of life without question, which was given to Adam at first.”

— Thomas Boston, The Whole Works of Thomas Boston: Discourses on Prayer, ed. Samuel M‘Millan (Aberdeen: George and Robert King, 1852), 11.180–82.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+I+shall+confirm+this+great+truth%2C+and+evince+the+being+of+such+a+covenant.+It+is+altogether+denied+by+the+Arminians+that+there+was+any+such+covenant%2C+and+amongst+ourselves+by+Professor+Simson%2C+that+it+was+a+proper+covenant.+The+weight+of+this+matter+lies+here%2C+that+if+the+covenant+made+with+Adam+was+not+a+proper+covenant%2C+he+could+not+be+a+proper+representing+head%3B+and+if+he+was+not%2C+then+there+cannot+be+a+proper+imputation+of+Adam%E2%80%99s+sin+unto+his+posterity.+None+could+ever+dream%2C+but+there+must+be+a+manifest+difference+betwixt+covenants+between+God+and+man%2C+and+those+between+men+and+men.+There+is+no+manner+of+equality+betwixt+God+and+man%3B+God+could+require+all+duty+of+men+without+any+covenant%3B+yea%2C+they+have+nothing+but+what+is+from+him%2C+and+so+owe+it+to+him.+But+those+things+do+not+hinder%2C+that%2C+upon+God%E2%80%99s+condescending+to+enter+into+a+covenant+with+man%2C+there+may+be+a+proper+covenant+betwixt+them.+Though+all+similitudes+here+must+halt%3B+yet+let+us+suppose+a+father+to+propose+to+his+son%2C+that+if+he+will+obey+his+orders%2C+and+especially+in+one+point+give+him+punctual+obedience%2C+for+instance%2C+labour+his+vineyard%2C+he+will+give+him+a+certain+sum+of+money%3B+and+the+son+having+nothing+to+labour+it+with%2C+the+father+furnishes+him+with+all+things+necessary+thereto%3B+the+son+accepts+of+this+proposal.+Can+any+man+say+that+there+is+not+a+proper+bargain%2C+or+covenant%2C+in+this+case+betwixt+the+father+and+his+son%2C+although+the+son+was+tied+by+the+bond+of+nature+to+obey+his+father%E2%80%99s+commands+in+all+this+antecedently+to+the+bargain%2C+and+though+he+has+nothing+to+labour+it+with%2C+but+what+he+has+from+the+father%3F+Let+him+perform+his+father%E2%80%99s+orders+now+according+to+the+covenant%2C+and+he+can+challenge+the+sum+as+a+debt%2C+which+he+could+not+do+before.+For+proof+this%2C+consider%2C+1.+Here+is+a+concurrence+of+all+that+is+necessary+to+constitute+a+true+and+proper+covenant+of+works.+The+parties+contracting%2C+God+and+man%3B+God+requiring+obedience+as+the+condition+of+life%3B+a+penalty+fixed+in+case+of+breaking%3B+and+man+acquiescing+in+the+proposal.+The+force+of+this+cannot+be+evaded%2C+by+comparing+it+with+the+consent+of+subjects+to+the+laws+of+an+absolute+prince.+For+such+a+law+proposed+by+a+prince%2C+promising+a+reward+upon+obedience+to+it%2C+is+indeed+the+proposing+of+a+covenant%2C+the+which+the+subject+consenting+to+for+himself+and+his%2C+and+taking+on+him+to+obey%2C+does+indeed+enter+into+a+covenant+with+the+prince%2C+and+having+obeyed+the+law+may+claim+the+reward+by+virtue+of+paction.+And+so+the+covenant+of+works+is+ordinarily+in+scripture+called+%E2%80%9Cthe+law%2C%E2%80%9D+being+in+its+own+nature+a+pactional+law.+2.+It+is+expressly+called+a+covenant+in+scripture%2C+Gal.+4%3A2%2C+%E2%80%9CFor+these+are+the+two+covenants%2C+the+one+from+the+Mount+Sinai%2C%E2%80%9D+%26c.+This+covenant+from+Mount+Sinai+was+the+covenant+of+works+as+being+opposed+to+the+covenant+of+grace%2C+namely%2C+the+law+of+the+ten+commandments%2C+with+promise+and+sanction%2C+as+before+expressed.+At+Sinai+it+was+renewed+indeed%2C+but+that+was+not+its+first+appearance+in+the+world.+For+there+being+but+two+ways+of+life+to+be+found+in+scripture%2C+one+by+works%2C+the+other+by+grace%3B+the+latter+hath+no+place%2C+but+where+the+first+is+rendered+ineffectual%3B+therefore+the+covenant+of+works+was+before+the+covenant+of+grace+in+the+world%3B+yet+the+covenant+of+grace+was+promulgated+quickly+after+Adam%E2%80%99s+fall%3B+therefore+the+covenant+of+works+behoved+to+have+been+made+with+him+before.+And+how+can+one+imagine+a+covenant+of+works+set+before+poor+impotent+sinners%2C+if+there+had+not+been+such+a+covenant+with+man+in+his+state+of+integrity%3F+Hos.+6%3A7%2C+%E2%80%9CBut+as+for+them%3B+like+Adam%2C+they+have+transgressed+the+covenant.%E2%80%9D+Our+translators+set+the+word+Adam+on+the+margin.+But+in+Job+31%3A33%2C+they+translate+the+very+same+word%2C+%E2%80%9Cas+Adam.%E2%80%9D+This+word+occurs+but+three+times+in+scripture%2C+and+still+in+the+same+sense.+Job+31%3A33%2C+%E2%80%9CIf+I+covered+my+transgressions%2C+as+Adam%2C%E2%80%9D+Psalm+82%3A7%2C+%E2%80%9CBut+ye+shall+die+like+Adam.%E2%80%9D+Compare+ver.+6%2C+%E2%80%9CI+have+said%2C+Ye+are+gods%3B+and+all+of+you+are+children+of+the+Most+High%3B%E2%80%9D+compared+with+Luke+3%3A38%2C+%E2%80%9CAdam%2C+which+was+the+son+of+God.%E2%80%9D+And+also+here%2C+Hos.+6%3A7.+While+Adam%E2%80%99s+hiding+his+sin%2C+and+his+death+are+made+an+example%2C+how+natural+is+it+that+his+transgression%2C+that+led+the+way+to+all%2C+be+made+so+too%3F+This+is+the+proper+and+literal+sense+of+the+words%3B+it+is+so+read+by+several%2C+and+is+certainly+the+meaning+of+it.+3.+We+find+a+law+of+works+opposed+to+the+law+of+faith%2C+Rom.+3%3A27.+%E2%80%9CWhere+is+boasting+then%3F+It+is+excluded.+By+what+law%3F+of+works%3F+Nay%3B+but+by+the+law+of+faith.%E2%80%9D+This+law+of+works+is+the+covenant+of+works%2C+requiring+works%2C+or+obedience%2C+as+the+condition+pleadable+for+life%3B+for+otherwise+the+law+as+a+rule+of+life+requires+works+too.+Again%2C+it+is+a+law+that+does+not+exclude+boasting%2C+which+is+the+very+nature+of+the+covenant+of+works%2C+that+makes+the+reward+to+be+of+debt.+And+further%2C+the+law+of+faith+is+the+covenant+of+grace%3B+therefore+the+law+of+works+is+the+covenant+of+works.+So+Rom.+6%3A14%2C+%E2%80%9CYe+are+not+under+the+law%2C+but+under+grace.%E2%80%9D+And+this+was+the+way+of+life+without+question%2C+which+was+given+to+Adam+at+first.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Whole+Works+of+Thomas+Boston%3A+Discourses+on+Prayer%2C+ed.+Samuel+M%E2%80%98Millan+%28Aberdeen%3A+George+and+Robert+King%2C+1852%29%2C+11.180%E2%80%9382.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7457ef94db.html&amp;vi <blockquote><p>Canon 8: Moreover that promise connected to the Covenant of Works was not a continuation only of earthly life and happiness but the possession especially of eternal and celestial life, a life namely, of both body and soul in heaven, if indeed man ran the’ course of perfect obedience, with unspeakable joy in communion with God. For not only did the Tree of Life prefigure this very thing unto Adam, but the power of the law, which, being fulfilled by Christ, who went under it in our place, awards to us nothing other than celestial life in Christ who kept the same righteousness of the law. The power of the law also threatens man with both temporal and eternal death. Canon 9: Wherefore we can not agree with the opinion of those who deny that a reward of heavenly bliss was offered to Adam on condition of obedience to God. We also do not admit that the promise of the Covenant of Works was any thing more than a promise of perpetual life abounding in every kind of good that can be suited to the body and soul of man in a state of perfect nature, and the enjoyment thereof in an earthly Paradise. For this also is contrary to the sound sense of the Divine Word, and weakens the power of the law considered in itself.</p></blockquote>

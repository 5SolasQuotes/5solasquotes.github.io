<main class="wrap"><figure class="quote" id="q-3b8c6bd220" data-kw="">
<blockquote><p>But why does Paul say that the Galatians are “turning back to the weak and beggarly elements,” that is, to the Law, when they never had the Law, since they were Gentiles (even though, as we shall say later, he writes this also to Jews)? Or why does he not rather speak this way: “Once, when you did not know God, you were in bondage to beings that by nature are no gods. But now that you know God, why do you forsake the true God and turn back again to the worship of idols?” Is defecting from the promise to the Law and from faith to works the same for Paul as serving gods that by nature are no gods? I reply: Whoever falls from the doctrine of justification is ignorant of God and is an idolater. Therefore it is all the same whether he then returns to the Law or to the worship of idols; it is all the same whether he is called a monk or a Turk or a Jew or an Anabaptist. For once this doctrine is undermined, nothing more remains but sheer error, hypocrisy, wickedness, and idolatry, regardless of how great the sanctity that appears on the outside.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 395–96.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

oopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0ea9c90737" data-kw="">
<blockquote><p>There are four set periods of justification: First, in God’s purpose, which reaches as far as the eternal transactions between God and Christ, such as were set down in the Lamb’s book. Secondly, when Christ did in the name and stead of sinners perform that which was the matter of their justification, but in neither of these periods was the soul translated out of the state of nature into the state of grace. Thirdly, actually, at that moment when we come to own Christ as a Saviour by believing. Fourthly, when the Spirit which translates the soul out of the state of nature into the state of grace, makes it known to the soul. Others say there are five (as it were) periods or degrees of justification:

1. When the Lord passes a sentence of absolution on men at their first conversion, immediately upon their union with Christ, Acts 13:38-39.

2. He that is justified falls into daily transgressions, therefore there must be a daily imputation and application of the death of Christ, Jn. 13:10.

3. There is a high act of justification after great and eminent falls, though there be not an intercission, yet there is a sequestration, such cannot then plead their right. (A leper could not make use of his house, though he had a right to it.) David’s sin of adultery and murder made a great breach upon his justification, therefore he prays God, Ps. 51, to purge him with hyssop, to apply anew the blood of Christ.

4. There follows a certification, a sentence passed in the soul concerning man’s estate, 1 Jn. 5:9; Rom. 8:33.

5. Justification is never perfected till the Day of Judgment, Acts 3:19, then sentence is passed in open court before men and angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6. Of Justification, p. 515</span></figcaption>

</figure><figure class="quote" id="q-5ba43f5615" data-kw="">
<blockquote><p>I answer, not only in the beginning of our conversion, but also in the continuance and final accomplishment thereof. For here Paul desires in the day of judgment to stand before God only by the justice of faith without his own justice of the law. And Paul brings in Abraham (as I have noted before) in the very midst of godly conversation and holy obedience to be justified without any works by his faith in the Messiah [Rom. 4:2–3]. And Paul avouches three things of faith: (1) by it ‘we have access’ to the grace of God; (2) by it we ‘stand in the same grace’; (3) by it ‘we rejoice under the hope of glory’ [Rom. 5:2]. Thus then, we see there is only one way of justification, namely that we are justified and accepted of God to life eternal through grace alone by faith alone for Christ alone in the beginning, middle, and end of our conversion. And here is plainly discovered the error of the Church of Rome. It makes a double justification: the first [is] whereby the sinner is made of an evil man a just man, and this (they say) is by faith alone; [and] the second is whereby a man of a just man is made more just, and this (they say) is by faith and works together. But [they speak] falsely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, 9:65–66.</span></figcaption>

oks Online</a></div>

<blockquote><p>23. This orthodox doctrine of the justification of sinful man before God having been asserted from the Word of God, the following errors are overthrown: …

2. Of the Pontificals:

1. Who interpret justification as justification [i.e., a making just] rather than justihabition [i.e., a holding just]; who press inherent righteousness and assail imputed righteousness as putative; who confound the righteousness of the cause and of the person, the legal and the evangelical, and weave a patchwork from both; and who thereby divide the business of justification between God and man, grace and free will. Who partition justification into a First and a Second: to the former they build up preparations and merits of congruity; to the latter they lay as foundation merits of condignity.

2. Who confound justifying faith with other species of faith; who deny that fiducial apprehension of Christ; who maintain it to be separable from charity, not only actual but also habitual; who contend that faith justifies only initially and incipiently, but good works completively.

3. Who deny either the perfection, or the stability, or the sense of justification in the justified, and heap up entire cartloads of errors in this place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

2. Who confound justifying faith with other species of faith; who deny that fiducial apprehension of Christ; who maintain it to be separable from charity, not only actual but also habitual; who contend that faith justifies only initially and incipiently, but good works completively.

3. Who deny either the perfection, or the stability, or the sense of justification in the justified, and heap up entire cartloads of errors in this place.”

<main class="wrap"><figure class="quote" id="q-0bc0a6edd5" data-kw="">
<blockquote><p>Therefore the afflicted conscience has no remedy against despair and eternal death except to take hold of the promise of grace offered in Christ, that is, this righteousness of faith, this passive or Christian righteousness, which says with confidence: “I do not seek active righteousness. I ought to have and perform it; but I declare that even if I did have it and perform it, I cannot trust in it or stand up before the judgment of God on the basis of it. Thus I put myself beyond all active righteousness, all righteousness of my own or of the divine Law, and I embrace only that passive righteousness which is the righteousness of grace, mercy, and the forgiveness of sins.” In other words, this is the righteousness of Christ and of the Holy Spirit, which we do not perform but receive, which we do not have but accept, when God the Father grants it to us through Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann (Concordia Publishing House, 1999), 5–6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>
<div class="actions"><button class="copy" data-copy="“Therefore the afflicted conscience has no remedy against despair and eternal death except to take hold of the promise of grace offered in Christ, that is, this righteousness of faith, this passive or Christian righteousness, which says with confidence: “I do not seek active righteousness. I ought to have and perform it; but I declare that even if I did have it and perform it, I cannot trust in it or stand up before the judgment of God on the basis of it. Thus I put myself beyond all active righteousness, all righteousness of my own or of the divine Law, and I embrace only that passive righteousness which is the righteousness of grace, mercy, and the forgiveness of sins.” In other words, this is the righteousness of Christ and of the Holy Spirit, which we do not perform but receive, which we do not have but accept, when God the Father grants it to us through Jesus Christ.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5b1aa6c82d" data-kw="">
<blockquote><p>Mather enumerates and condemns all forms of commercial dishonesty and business corruption—including the kidnapping of Africans into slavery. He also gives us a sense of the accommodations of the old theocracy (20 years after the Glorious Revolution and 18 years after the witchcraft crisis) with the new horizons of the eighteenth century, telling the Assembly: ‘In two or three too memorable days of temptation that have been upon us, there have been errors committed. You are always ready to declare unto all the world that you disapprove those errors. You are willing to inform all mankind with your declaration that no man may be persecuted because he is conscientiously not of the same religious opinions with those that are uppermost. And that persons are not to be judged confederates with evil spirits merely because the evil spirits do make possessed people cry out upon them.’ Finally, and as expected, he applies the lesson to the place of America in the grand drama of redemption, holding out the hope that the churches of New England will play the leading role…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cotton-mather.html">Cotton Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theopolis Americana, an Essay on the Golden Street of the Holy City: publishing a Testimony Against the Corruptions of the Market-Place. With some good hopes of better things to be yet seen in the American world. In a sermon, to the General Assembly of the Massachusett-Province in New-England</cite>, Theopolis Americana, an Essay on the Golden Street of the Holy City: publishing a Testimony Against the Corruptions of the Market-Place. With some good hopes of better things to be yet seen in the American world. In a sermon, to the General Assembly of the Massachusett-Province in New-England (Boston, 1710) UNL on Rev., 21:21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-6013b2a7fb" data-kw="">
<blockquote><p>Unless I am refuted and convicted by testimonies of the Scriptures or by clear arguments (since I believe neither the Pope nor the Councils alone; it being evident that they have often erred and contradicted themselves), I am conquered by the Holy Scriptures quoted by me, and my conscience is bound in the word of God: I can not and will not recant any thing, since it is unsafe and dangerous to do any thing against the conscience. … Here I stand. [I can not do otherwise.] God help me! Amen.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f8bd697434" data-kw="">
<blockquote><p>For the benefit of Christian love and concord may make it best for certain seasons to join even in defective modes of worship, as Christ did in the synagogues [such as with forms of prayer] and Temple in his time. Though the least defective must be chosen when no such accidental reasons sway the other way. And perhaps some nonconformists’ own administrations may be as defective as the Liturgy… 6. They [nonconfomrits] prefer their own manner of worshipping God as better than the [Anglican] Liturgy in their opinion, and therefore to be chosen when they may choose; but they account it not the only acceptable worship, but are present with you in spirit, desiring a part in the prayers of all true Christians in the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacrilegious Desertion of the Holy Ministry Rebuked &amp; Tolerated Preaching of the Gospel Vindicated</cite>, (1672), ch. 2, pp. 16-17</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c8418870d" data-kw="">
<blockquote><p>I own… the worship there performed… as in the preaching of the Word, and prayer before and after sermon, to be in the main sound and good for the substance or matter thereof… Though I judge their form of worship to be in many respects less perfect than is to be desired; yet I have found my heart spiritually affected and raised towards God therein… the lawfulness of partaking in that worship, it being sound for the substance in the main, and the mode thereof being laudable in diverse forms and orders, and passable in the most, though in some offensive, inconvenient, or less perfect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity</cite>, ... (London: 1683), The Nonconformists Plea for Lay-Communion with the Church of England, pp. 5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-e8c1086815" data-kw="">
<blockquote><p>24. The religion that keeps possession of the parish churches¹ will be the national religion: Mourn therefore before God that ever any men professing godliness should either labor to get all sound Protestants to desert the parish churches or that any such have been against the restoring of nonconformists by that called a ‘comprehension’, which was but the withdrawing of such impositions as these very men thought sinful, and all this, lest it should diminish the number and strength of the private churches. By this we see what we are doing against ourselves, if God save us not.</p></blockquote>

<blockquote><p>[In the Early and Medieval Churches, they taught] To pray towards the East, and that for this cause and signification, because we seek to Paradise, our old and ancient country, and [this] is commended and apostolical, [according to] Basil, Of the Holy Spirit, ch. 27. … The temples [church buildings] were erected to stand East and West, the altars of the Church stood Eastward and some toward the West; Socrates, Ecclesiastical History, bk. 5, ch. 22.</p></blockquote>

</figure><figure class="quote" id="q-30672bf3d8" data-kw="">
<blockquote><p>Because it may be thought expedient that these things for a time be borne withal; for it may perhaps produce this effect, that these contentions may be avoided, by the which contentions there is great peril, lest greater and far more important benefits be hindered; and lest the minds of men be at the first beginning turned from the Gospel, as we see it come to pass; Martyr. ibid., fol. 1085 [p. 119]. Because, if the parity of doctrine and of faith do remain entire, the pastors may openly teach and press unto their flocks such doctrine as may serve to take away offenses arising by the use of these ceremonies; Beza, Epist. 12, fol. 99. … Because if some things in their nature indifferent be imposed it is not meet too eagerly to contend about such matters; especially when as we see those magistrates by whom the light of the Gospel is much furthered in England, and by whose authority it may much more be furthered, to oppose themselves against us; Peter Martyr, ibid., fol. 1085 [p. 120], to Hooper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘Reformed Practices’, pp. 165-68</span></figcaption>

<main class="wrap"><figure class="quote" id="q-61f86d9005" data-kw="">
<blockquote><p>All parties, while exercising their own right of private judgment, ought to regard the decisions of the ordinary and only competent authorities in the matter with a certain measure of respect and deference— at least to this extent, that if they do resolve to condemn and disobey the decisions, they ought to be very sure that these decisions are opposed to the mind and will of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, vol. 1, ch. 2 (The Council of Jerusalem)</span></figcaption>

</figure><figure class="quote" id="q-a10d709e66" data-kw="">
<blockquote><p>Upon scriptural and Protestant principles, every man has the right of private judgment, —i.e., he is entitled to interpret the word of God for himself upon his own responsibility, for the regulation of his own opinions and conduct, for the execution of his own functions and the discharge of his own duties, whatever these may be; and Christ has conferred upon no class of men any power that interferes with the exercise of this right.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, vol. 1, ch. 2 (The Council of Jerusalem)</span></figcaption>

</figure><figure class="quote" id="q-1c5719e6b4" data-kw="Private spirit">
<blockquote><p>I answer, first, that we do not send any one who is in doubt on any matter to his private spirit, neglecting all means of finding truth, as the Jesuit falsely objects to us; but to scripture itself, and the Holy Spirit speaking publicly in the scripture, who, we say, ought to be heard, and by whose authority we maintain that all controversies should be decided: which also was the very thing done in this council.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 5</span></figcaption>

<div class="actions"><button class="copy" data-copy="“I answer, first, that we do not send any one who is in doubt on any matter to his private spirit, neglecting all means of finding truth, as the Jesuit falsely objects to us; but to scripture itself, and the Holy Spirit speaking publicly in the scripture, who, we say, ought to be heard, and by whose authority we maintain that all controversies should be decided: which also was the very thing done in this council.”

</figure><figure class="quote" id="q-91f1d74d37" data-kw="">
<blockquote><p>For when some have taken up a private interpretation of any place of Scripture, if, before they have thoroughly imbibed and vented it, they do not submit their conception, although they seem to be greatly satisfied in it and full of it, unto the authority of the Scripture in the declaration of its own mind in other places, there is but small hope of their recovery. And this is that pride which is the source and original of heresy, -- namely, when men will prefer their seemingly wise and rational conceptions of the sense of particular places before the analogy of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 8</span></figcaption>

<blockquote><p>Omitting many other passages that might be cited from the New Testament, in favour of capital punishment, I shall notice only two. “But we know that the law is good, if a man use it lawfully.” 1 Tim. i. 8. The law to which the apostle refers, is evidently what we call the judicial law; for it was not made for a righteous man, but for the lawless and disobedient. But this is not true of either the moral or ceremonial law, for they were made for righteous men: the Lord Jesus Christ obeyed them both. Now when we call a law good, we mean that the penalty is just. When the law of England hung people for stealing we called it a bad law, because the penalty was too severe; we call the law which hangs men for murder a good law, because the penalty is exactly proportioned to the crime. We see, then, that those laws which our modern illuminati call bloody laws, Paul calls good laws. In Hebrews ii. 2, it is said, “If the word spoken by angels* was steadfast, and every transgression and disobedience received a just recompense of reward.” The penalty inflicted on criminals by the Mosaic law, is called a just recompense of reward: it was neither too light, nor too severe – just such as infinite wisdom and goodness saw fit to appoint.

* Angels, (Messengers,) including Moses and the prophets.</p></blockquote>

<blockquote><p>For in the Old Testament there are many rules, directions and examples, as a pillar of fire to guide the Churches now by (as that Rom. 15:4 shows) namely those examples and rules of moral and common equity, else the Church of God should loose now many a good ground, for many practices… Now if you [Independents] will use the Old Testament in some examples and commands, as you do (though here you forget to mention it), then grounds out of the Old Testament (in matters not ceremonial and judicial proper to the Jews’ policy, nation and times) but in things of moral and common equity will justify other practices…</p></blockquote>

<blockquote><p>Now then, so many ways and no more as a thing may be known to come from God with an intention to oblige all perpetually, a thing may be said to be of an unalterable divine right; and those can be no more than these two: either by the Law of Nature, or by some positive Law of God. Nothing else can bind universally and perpetually but one of these two, or by virtue of them, as shall be made appear. I begin with the Law of Nature. The Law of Nature binds indispensably, as it depends not upon any arbitrary constitutions, but is founded upon the intrinsical nature of good and evil in the things themselves, antecedently to any positive declaration of God’s will. So that till the nature of good and evil be changed, that Law is unalterable as to its obligation. When I say the Law of Nature is indispensable, my meaning is, that in those things which immediately flow from that Law by way of precept, as the three first Commands of the Moral Law, no man can by any positive law be exempted from his obligation to do them, neither by any abrogation of the laws themselves, nor by derogation from them, nor interpretation of them, nor change in the object, matter, or circumstance whatsoever it be. Now although the formal reason of man’s obedience to the precepts of this Law be the conformity which the things commanded have to the divine nature and goodness, yet I conceive the efficient cause of man’s obligation to these things is to be fetched from the will, command and pleasure of God: Not as it is taken for an arbitrary positive will, but as it is executive of divine purposes, and as it engraves such a Law upon the hearts of men. For notwithstanding man’s reason, considered in itself, be the chiefest instrument of discovery what are these necessary duties of human nature (in which sense Aristotle defines a natural law to be that which [Greek] has everywhere the same force and strength (Ethics, bk. 5, ch. 10), i.e. as Andronicus Rhodius very well interprets it, [Greek], among all that have the free use of their reason and faculties), yet I say it is not bare reason which binds men to the doing of those things commanded in that Law, but as it is expressive of an eternal Law, and deduces its obligation from thence. And so this Law, if we respect the rise, extent and immutability of it, may be called deservedly the Law of Nature (V. Selden, De jure Nat. apud▪ Ebrae, bk. 1, ch. 7-8); but if we look at the emanation, efflux and original of it, it is a divine Law, and so it is called by Molina, Alphonsus à Castr••, and others (Mol., De Just et Jur., p. 1, Disputation 3; Alphons., De leg. pur▪, bk. 2, ch. 14). For the sanction of this Law of Nature, as well as others, depends upon the will of God, and therefore the obligation must come from Him, it being in the power of no other to punish for the breach of a law, but those who had the legislative power to cause the obligation to it. It appears then from hence that whatever by just consequence can be deduced from the preceptive Law of Nature, is of divine right, because from the very nature of that Law (it being indispensable), it appears that God had an intent to oblige all persons in the world by it.</p></blockquote>

<blockquote><p>§29 The Decalogue has been prescribed for all people to the extent that it agrees with and explains the common law of nature for all peoples. It has also been renewed and confirmed by Christ our king. Jerome Zanchius says that this is the common judgement of theologians (De Redemptione, I, 10, 1 [actually thesis 1 of the second section (“De legibus humanis“) of Chapter 10].)… §30 Proper law (lex propia) is the law that is drawn up and established by the magistrate on the basis of common law (lex communis) and according to the nature, utility, condition, and other special circumstances of his country. It indicates the peculiar way, means, and manner by which this natural equity among men can be upheld, observed, and cultivated in any given commonwealth. Therefore, proper law (jus proprium) is nothing other than the practice of this common natural law (jus naturale) as adapted to a particular polity. It indicates how individual citizens of a given commonwealth are able to seek and attain this natural equity. Whence it is called the servant and handmaiden of common law (jus commune), and a teacher leading us to the observance of common law. §31 Proper law is established for two principal reasons, as Zanchius says [De Redemptione, I, 11, 1]. The first reason is that not all men have sufficient natural capacity that they are able to draw from these general principles of common law the particular conclusions and laws suitable to the nature and condition of an activity and its circumstances. The second reason is that natural law is not so completely written on the hearts of men that it is sufficiently efficacious in restraining men from evil and impelling them to good… In this sense, it is said that “law is set forth not for the just, but the unjust.” (1 Tim. 1:9) §32 There are two parts of this [proper] law. The first is its agreement with common law, and the second is its difference, as Francis Junius observes (De Politicae Mosis Observatione) and the jurists teach (In commentaries on the Digest I, 1, 4)… Its agreement (convenientia) with common law is in those matters common to each law, namely, in the starting point from which analogical deductions are made, in the subject under consideration, and in the purpose… The purpose of each [common and proper law] is justice and piety, or sanctity, and the same equity and common good in human society. Its difference (discrepantia) from common law arises from the fact that, in accommodation to particular and special circumstances, it departs somewhat from common law, adding or subtracting something from it. Proper law differs for two reasons, each of which provides a necessity for adding or subtracting something from common law. And so mutability, or the possibility and necessity of just changes, is introduced… Since the nature and condition of these circumstances may be diverse, inconstant, and changeable, it is not possible for proper law to acknowledge one and the same disposition of common law for everything and in everything, as Junius and Zanchius, together with the jurists, say. Therefore, this law is rightly said to be mutable or subject to change with respect to circumstances and its consequent difference from common law. But it is altogether immutable with respect to its agreement with common law. So the jurists assert together with Junius, Zanchius, Martyr, and Bucer. Thus common or moral law concludes from its principles that evildoers ought to be punished, but proposes nothing concerning the punishment. Proper law determines specifically that adulterers, murderers, and the like are to be punished by death, unless the punishment should be mitigated because of further circumstances. Various punishments, for example, exist in the Mosaic Law for these crimes… For this reason, the moral precepts of the Decalogue, having no certain, special, and fixed punishment attached to them, are general. The forensic and political law then makes specific determinations, which it relates to the circumstances of any act. §34 This proper law is one thing among the Jews, another among the Romans, another among the Germans today, and still another among other peoples… §35 Jewish proper law is twofold. It is in part ceremonial, and in part forensic or judicial… §37 The forensic [judicial] law was the means by which the Jews were informed and instructed to observe and obey both Tables, or the common law, for the cultivation of human society among them in their polity, according to the circumstances of things, persons, place, and time… §40 It should be observed that often one and the same law of the Jews could be said in varying respects to be moral (or common), ceremonial, and forensic, and to this extent mixed. What is moral in such a law is perpetual; what is judicial can be changed by the change of circumstances… … Ch. 22, §3 From these things it follows that the magistrate is obligated in the administration of the commonwealth to the proper law of Moses so far as moral equity or common law are expressed therein. This is to say, he is required to conform to everything therein that is in harmony with common law. But he is by no means required to conform in those things in which the proper law of Moses, in order to be accommodated to the polity of the Jews, differs from common law. §4 For if the magistrate should establish as absolutely necessary these proper Jewish laws, which by their nature are either changeable or obsolete, he would destroy christian liberty, which has been given for edification to him and to others, and would entangle himself and others in the yoke of slavery. Thereby he would make a necessity of something free, and impede consciences by a grievous and dangerous snare. He would obtrude mortal laws, which were promulgated in former times only for the Jewish people and are by their nature subject to change for a variety of reasons, as if they were immortal. And unless proper laws are changed with the changing circumstances because of which they broadly exist, they become wicked and attain neither to the equity of the Second Table of the Decalogue nor the piety of the First. Thus they cease to contain the common foundation of right reason. Accordingly, the magistrate who makes the proper law of Moses compulsory in his commonwealth sins grievously. For those particular circumstances and considerations because of which the Jewish proper law was promulgated should bear no weight in his commonwealth…</p></blockquote>

t%2C+but+the+unjust.%E2%80%9D+%281+Tim.+1%3A9%29+%C2%A732+There+are+two+parts+of+this+%5Bproper%5D+law.+The+first+is+its+agreement+with+common+law%2C+and+the+second+is+its+difference%2C+as+Francis+Junius+observes+%28De+Politicae+Mosis+Observatione%29+and+the+jurists+teach+%28In+commentaries+on+the+Digest+I%2C+1%2C+4%29%E2%80%A6+Its+agreement+%28convenientia%29+with+common+law+is+in+those+matters+common+to+each+law%2C+namely%2C+in+the+starting+point+from+which+analogical+deductions+are+made%2C+in+the+subject+under+consideration%2C+and+in+the+purpose%E2%80%A6+The+purpose+of+each+%5Bcommon+and+proper+law%5D+is+justice+and+piety%2C+or+sanctity%2C+and+the+same+equity+and+common+good+in+human+society.+Its+difference+%28discrepantia%29+from+common+law+arises+from+the+fact+that%2C+in+accommodation+to+particular+and+special+circumstances%2C+it+departs+somewhat+from+common+law%2C+adding+or+subtracting+something+from+it.+Proper+law+differs+for+two+reasons%2C+each+of+which+provides+a+necessity+for+adding+or+subtracting+something+from+common+law.+And+so+mutability%2C+or+the+possibility+and+necessity+of+just+changes%2C+is+introduced%E2%80%A6+Since+the+nature+and+condition+of+these+circumstances+may+be+diverse%2C+inconstant%2C+and+changeable%2C+it+is+not+possible+for+proper+law+to+acknowledge+one+and+the+same+disposition+of+common+law+for+everything+and+in+everything%2C+as+Junius+and+Zanchius%2C+together+with+the+jurists%2C+say.+Therefore%2C+this+law+is+rightly+said+to+be+mutable+or+subject+to+change+with+respect+to+circumstances+and+its+consequent+difference+from+common+law.+But+it+is+altogether+immutable+with+respect+to+its+agreement+with+common+law.+So+the+jurists+assert+together+with+Junius%2C+Zanchius%2C+Martyr%2C+and+Bucer.+Thus+common+or+moral+law+concludes+from+its+principles+that+evildoers+ought+to+be+punished%2C+but+proposes+nothing+concerning+the+punishment.+Proper+law+determines+specifically+that+adulterers%2C+murderers%2C+and+the+like+are+to+be+punished+by+death%2C+un <blockquote><p>Again, in the next place, take also this general observation, That although the Judicial and Ceremonial Laws were given at the same time with the Moral Law, yet there is a difference between them. And this is to be taken notice of, lest any should think, what will this discourse make for the honor of the Moral Law, more than the other laws? It’s true, these three kinds of laws agree in the common efficient cause, which was God; and in the minister, or mediator, which was Moses; in the subject, which was the people of Israel; and all and every one of them; as also in the common effects, of binding and obliging them to obedience, and to punish the bold offenders against them. But herein the Moral Law is preeminent:

1. In that it is a foundation of the other laws, and they are reducible to it.

2. This was to abide always, not the other.

3. This was immediately written by God, and commanded to be kept in the Ark, which the other were not.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d7dc85d686" data-kw="">
<blockquote><p>In case the queen should invite me to any ecclesiastical office, such, I mean, as the government of a church, can I accept such appointment with a safe conscience, seeing that these things appear to me a sufficient excuse for non-compliance? 1. Because, through the want of church discipline, the bishop, or pastor, is unable properly to discharge his office.

2. Because there are so many civil burdens imposed upon the bishop, or pastor; those, for instance, of first fruits, as we call them, that is to say, the receipts of the first year, besides tenths; in addition to which, at least in the case of bishops, so much expense must always be incurred for their equipages, retainers, and attendance at court: so that, as you well know, a very small portion of their revenue is left for the discharge of the necessary duties of a bishop, namely, for the support of learned men, the relief of the poor, and other occasions of making his ministry more acceptable.

3. I am now writing with reference to the bishops more especially; and such is the degeneracy from the primitive institution, as regards their election, (for there is required neither the consent of the clergy, nor of the people;) such too is the vanity, not to say the unseemliness of their superstitious dresses, that I scarcely think it endurable, even if we are to act in all things according to the law of expediency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-sampson.html">Thomas Sampson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Peter Martyr Vermigli, 17 December [1558] in The Zurich Letters, or The Correspondence of Several English Bishops and others, with some of the Heletian Reformers, during the Reign of Queen Elizabeth. Chiefly from the Archives of Zurich, ed. Hastings Robinson, Works of the Fathers and Early</cite></span></figcaption>

</figure><figure class="quote" id="q-039d0d1ff8" data-kw="">
<blockquote><p>But all Church-power and authority is bounded by the Word of God, and is for edification only; And therefore all the subjection that is due thereunto, is in the Lord only; and when we are thus subject, the power and authority is sufficiently acknowledged and preserved. But, say our [Resolutioner] Brethren, without this [absolute, necessary, passive] submission [to erroneous Church decisions] which they plead for, our established judicatories would be nothing but consultative meetings. But this we also deny, because what is resolved and determined by Kirk-judicatories in a right way, does not only bind by virtue of the intrinsic lawfulness thereof, it being for matter God’s Word, and by virtue of the reverence that is due to the gifts and endowments of brethren and friends counselling right things, which is all that can be attributed to a consultative meeting, but also by virtue of a positive law of God, by which He has commanded us to hear the Church, and those that sit in Moses’ chair, and to be subject in the Lord to Church-Governors, to whom He has given a ministerial and official authority and power to assemble in His Name in the respective courts appointed by Himself for governing His House according to the rule of His Word; And therefore as they have authority or a superiority of jurisdiction, which no consultative meeting has; So whosoever resists their power, when put forth to edification, and not to destruction, does not only sin by despising that Word of God which is the matter of their decree, and by despising the gifts and graces of their brethren that are exercised in holding forth light unto them, but does also sin by resisting the ordinance of God: a Kirk-judicatory modeled according to the pattern showed in the mount, and clothed with authority from Jesus Christ, and proceeding according to the Law and to the Testimony, to which they ought to be subject, God having commanded us so to do.</p></blockquote>

<blockquote><p>2. There be two necessities of things, one natural, and first in that regard; another religious, and in that regard secondary. The former necessity does always stand, except God remove it by some posterior commandment. It’s necessary that Adam and Eve eat of all things that God created for eating. God (I grant) may remove this necessity in some, and command either Adam to fast for a time, or not to eat of the tree of Knowledge. So say I, warning by Bells [signaling that divine service is starting soon, though Romanists previously used them unto superstition] has a physical necessity, the use of the temples [church-buildings] in worshipping has the like necessity, so have gold and silver a necessity, God only, either by a commandment or by an exigence of providence that stands to us (as in the case of a scandal), for a command can remove the physical necessity and inhibit Israel to use such and such gold as has been in use in the heathen idols, and may forbid to perform an act of obedience to an affirmative command in the case of scandal, as he may forbid Paul to take wages for preaching the Gospel, though Paul have some natural necessity of taking wages. But the Church, without a higher warrant from God, has no power to restrain us in the necessary use that God has given us.</p></blockquote>

<blockquote><p>2. To preach publicly as ordinary messengers, I say ‘ordinary’ because of our expectants of the ministry, who preach by the call of the Church for a time, as the sons of the prophets, while they be ordained pastors [in the time that they are in the process of being or becoming ordained]. To preach, I say, ‘publicly’, is a formal act of pastors who are sent, Rom. 10.</p></blockquote>

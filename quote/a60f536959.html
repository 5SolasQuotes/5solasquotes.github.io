<blockquote><p>4. For whom He offered it, for us, the elect, that is, for sinners. This sacrifice was effectively offered for the salvation of the elect alone, although it is sufficient for the redemption of the whole world.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-87e64bbc95" data-kw="">
<blockquote><p>An intention or a conscious goal is that which an agent aims to accomplish and the means are that which is used for attaining the intention. When the agent acts according to its nature, then the end of the action and the end of the agent is one and the same. But when the means are not fitted for the intentional end, then a distinction must be inferred between the end of the action and the end of the agent; between the intention and the intender. Now, the doctrine of divine simplicity implies that in God intention and Intender—act and Agent—cannot be other than one and the same. In humans intention and intender—acts and agents—may not be one and the same. In God the means for attaining the salvation of the elect are not, indeed cannot, be disproportionate to that end. There cannot be conditions—conditional redemption—to God. For according to the doctrine of divine simplicity, each thing is related to God, but God is not (reciprocally) related to anything. Yet, universalism anthropomorphically pictures God as using means that are not proportionate to the end and assumes that there is one intention in some salvific act and another intention in some other salvific act. Particularism upholds the doctrine of simplicity and consistently maintains the otherness of God in intending to save humans in Christ. Every salvific action of God is particular in intention, since in God intention and Intender cannot be other than one and the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sebastian-rehnman.html">Sebastian Rehnman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Particular Defence of Particularism’ Ref in Journal of Reformed Theology, vol. 6, issue 1 (2012)</cite>, pp. 24–34</span></figcaption>

<blockquote><p>A Christian [according to the Westminster Confession of Faith] may take up the lawful calling of a magistrate, in contrast to Anabaptism. A magistrate must not exercise his rule in sacred things, in contrast to Erastianism. An infidel magistrate still possesses legal authority, in contrast with Romanism. Although Anabaptism, Erastianism, and Romanism are quite divergent systems, the three share one underlying assumption in their views of the relationship of the State to Christianity–they all teach that lawful civil power is, in some way or another, derived from Jesus Christ as Mediator. Anabaptists denied that non-Christian government is ordained of God. As Robert Baillie relates, they considered the saints to be those who were ‘joined to their Churches and received their Anabaptisme; all the rest of them were wicked and to be cut off.’ Erastians asserted, in the words of Thomas Coleman, ‘that God hath given all magistracy to Christ to be managed under him, for him.’ Romanists made magistrates servants to the papacy. Samuel Rutherford wrote, ‘Stapleton, Bellarmine, and Papists will have them [princes] to be brutish servants, to execute whatsoever the Pope and Councils shall decree, good or bad, without examination.’ All three systems differ as to the application of this principle and the place where ultimate jurisdiction is to be vested–Anabaptists placing it in the Conscience, Erastians in the King, and Romanists in the Pope–but they agree on the principle itself, that Jesus Christ as Mediator is the foundation of civil power. In opposing these three errors, the Westminster divines, with the exception of the Erastian representatives, rejected the view that the civil magistrate derives his authority from Christ as Mediator. Rather, it is from God as the Creator and Supreme Ruler that magistrates receive power… … In contrast to the teaching of the Confession and its framers, theonomy rejects the nature-grace distinction and teaches that the civil magistrate is subservient to Christ as Mediator. Greg Bahnsen claims that ‘A nature/grace dichotomy in the area of civil government is totally alien to the scriptural outlook’ (Theonomy in Christian Ethics, 433). It is taught that ‘the Lord’s Messiah has absolute, firm, and autocratic authority over all the magistrates of the nations; they are guided, directed, and chastised by Him’ (362). The apostle Paul is alleged to have ‘subordinated the authority of Caesar to that of King Jesus’ and ‘by his teaching of the Kingship of Christ Paul was opposing the decrees of autocratic Caesar’ (395).¹ ¹ The Westminster Annotations take the opposite view, and judge the allegation made against Paul and Silas [in Acts 17:7] to be nothing less than a false aspersion cast upon them by the Jews. It also comments, ‘Paul and Silas endeavored to advance the spiritual kingdom of Christ, without any injury to the Roman Empire… the ancient Christians were no disturbers of States.’ ‘Annotations on the Acts of the Apostle’s,’ in The Second Volume of Annotations, on Acts 17:7. Finally it is maintained [by Bahnsen], ‘The only ultimate King in civil government is Christ, and all rulers of the nations derive their authority from Him; hence all magistrates are subject to Christ’s word, even Christ’s confirmation of every bit of the law (Matt 17f.)… National leaders have no exemption from the law of God just as they have no escape from the universal Lordship of Christ’ (429). The civil magistrate, according to this [theonomic] view of it, is a ‘Christocracy’ (432). This means that ‘state leaders are just as obligated to follow Christ’s direction as the church elders are required to obey the Head of the Church’ (433).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-winzer.html">Matthew Winzer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Westminster Assembly and the Judicial Law’ in Confessional Presbyterian, vol. 5 (2009)</cite>, pp. 74, 76-77</span></figcaption>

<blockquote><p>As for that collaterality which is objected, I answer, the civil and ecclesiastical power, if we speak properly, are not collateral. 1. They have no footing upon the same ground: there may be many subject to the magistrate, who are no church members, and so not under the spiritual power; and where the same persons are subject to both the powers, there is no more collaterality, in this case, nay, not so much, as is betwixt the power of a father in one man, and the power of a master in another man, when both powers are exercised upon the same man who is both a son and a servant. 2. Powers that are collateral, are of the same eminency and altitude, of the same kind and nature; but the civil power is a dominion and lordship; the ecclesiastical power is ministerial, not lordly. 3. Collateral powers do mutually and alike exercise authority over each other respectively. But, though the magistrate may exercise much authority in things ecclesiastical [circa sacra], church officers can exercise no authority in things civil. The magistrate’s authority is ecclesiastical objective, though not formaliter: but the church officer’s authority is not civil so much as objective, not being exercised about either civil, criminal, or capital cases. 4. Collateral powers are subordinate to, and derived from the supreme and original power, like two branches growing out of the same stock, two streams flowing from the same fountain, two lines drawn from the same center, two arms under the same head; but the power of the magistrate is subordinate unto, and depends upon the dominion of God the Creator of all: the power of church officers depends upon the dominion of Christ, the Mediator and King of the church.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“As for that collaterality which is objected, I answer, the civil and ecclesiastical power, if we speak properly, are not collateral. 1. They have no footing upon the same ground: there may be many subject to the magistrate, who are no church members, and so not under the spiritual power; and where the same persons are subject to both the powers, there is no more collaterality, in this case, nay, not so much, as is betwixt the power of a father in one man, and the power of a master in another man, when both powers are exercised upon the same man who is both a son and a servant. 2. Powers that are collateral, are of the same eminency and altitude, of the same kind and nature; but the civil power is a dominion and lordship; the ecclesiastical power is ministerial, not lordly. 3. Collateral powers do mutually and alike exercise authority over each other respectively. But, though the magistrate may exercise much authority in things ecclesiastical [circa sacra], church officers can exercise no authority in things civil. The magistrate’s authority is ecclesiastical objective, though not formaliter: but the church officer’s authority is not civil so much as objective, not being exercised about either civil, criminal, or capital cases. 4. Collateral powers are subordinate to, and derived from the supreme and original power, like two branches growing out of the same stock, two streams flowing from the same fountain, two lines drawn from the same center, two arms under the same head; but the power of the magistrate is subordinate unto, and depends upon the dominion of God the Creator of all: the power of church officers depends upon the dominion of Christ, the Mediator and King of the church.”

— George Gillespie, Aaron’s Rod Blossoming (1646) | Part 2, ch. 8, p. 120">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+for+that+collaterality+which+is+objected%2C+I+answer%2C+the+civil+and+ecclesiastical+power%2C+if+we+speak+properly%2C+are+not+collateral.+1.+They+have+no+footing+upon+the+same+ground%3A+there+may+be+many+subject+to+the+magistrate%2C+who+are+no+church+members%2C+and+so+not+under+the+spiritual+power%3B+and+where+the+same+persons+are+subject+to+both+the+powers%2C+there+is+no+more+collaterality%2C+in+this+case%2C+nay%2C+not+so+much%2C+as+is+betwixt+the+power+of+a+father+in+one+man%2C+and+the+power+of+a+master+in+another+man%2C+when+both+powers+are+exercised+upon+the+same+man+who+is+both+a+son+and+a+servant.+2.+Powers+that+are+collateral%2C+are+of+the+same+eminency+and+altitude%2C+of+the+same+kind+and+nature%3B+but+the+civil+power+is+a+dominion+and+lordship%3B+the+ecclesiastical+power+is+ministerial%2C+not+lordly.+3.+Collateral+powers+do+mutually+and+alike+exercise+authority+over+each+other+respectively.+But%2C+though+the+magistrate+may+exercise+much+authority+in+things+ecclesiastical+%5Bcirca+sacra%5D%2C+church+officers+can+exercise+no+authority+in+things+civil.+The+magistrate%E2%80%99s+authority+is+ecclesiastical+objective%2C+though+not+formaliter%3A+but+the+church+officer%E2%80%99s+authority+is+not+civil+so+much+as+objective%2C+not+being+exercised+about+either+civil%2C+criminal%2C+or+capital+cases.+4.+Collateral+powers+are+subordinate+to%2C+and+derived+from+the+supreme+and+original+power%2C+like+two+branches+growing+out+of+the+same+stock%2C+two+streams+flowing+from+the+same+fountain%2C+two+lines+drawn+from+the+same+center%2C+two+arms+under+the+same+head%3B+but+the+power+of+the+magistrate+is+subordinate+unto%2C+and+depends+upon+the+dominion+of+God+the+Creator+of+all%3A+the+power+of+church+officers+depends+upon+the+dominion+of+Christ%2C+the+Mediator+and+King+of+the+church.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+Aa

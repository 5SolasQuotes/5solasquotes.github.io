<main class="wrap"><figure class="quote" id="q-02553cb0e8" data-kw="">
<blockquote><p>Still, since God’s image has not been so completely erased in the soul of man by the stain of earthly affections, as to have left remaining there not even the merest lineaments of it whence it might be justly said that man, even in the ungodliness of his life, does, or appreciates, some things contained in the law; if this is what is meant by the statement that “the Gentiles, which have not the law” (that is, the law of God), “do by nature the things contained in the law,” and that men of this character “are a law to themselves,” and “show the work of the law written in their hearts,” — that is to say, what was impressed on their hearts when they were created in the image of God has not been wholly blotted out:— even in this view of the subject, that wide difference will not be disturbed, which separates the new covenant from the old, and which lies in the fact that by the new covenant the law of God is written in the hearts of believers, whereas in the old it was inscribed on tables of stone.

For this writing in the heart is effected by renovation, although it had not been completely blotted out by the old nature. For just as that image of God is renewed in the mind of believers by the new testament, which impiety had not quite abolished (for there had remained undoubtedly that which the soul of man cannot be except it be rational), so also the law of God, which had not been wholly blotted out there by unrighteousness, is certainly written thereon, renewed by grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Spirit and the Letter</cite>, (412), 48 in Nicene and Post-Nicene Fathers 1, 5: 103.</span></figcaption>

<blockquote><p>The intellect is that power by which we are able to entertain concepts, to affirm the truth or falsity of propositions, and to assess the cogency of arguments… Traditionally, the act of entertaining a concept is known as simple apprehension; the act of affirming or denying the truth of a proposition is known as judgment; and the act of inferring a proposition from other propositions is known as reasoning. Simple apprehension, judgment, and reasoning are the intellect’s basic operations. Being rational or capable of thought is essentially a matter of having the capacity for these operations of the intellect.</p></blockquote>

</figure><figure class="quote" id="q-0df8960d35" data-kw="">
<blockquote><p>God created Man in His own Image in respect of Life and Immortality. God made Adam a living Soul that can never die, a natural Image of HIM who only hath Immortality. And God covenanted with Adam that tho’ his Body was corruptible in it self, yet He would preserve it in Health, Ease and Strength, and it should never see Death in case he never sinned. God gave him therefore the Tree of Life to eat of, a Sign Pledge and Means of Immortality to his Body, and of the Continuance of Happiness to him in Soul and Body all his Days on Earth; and I doubt not it was also a Seal and Assurance to him of a Translation to a better World, a better Paradise in due Time.

Man could not but begin to be because he was a Creature; no more could the Angels of Heaven. God only is Eternal, from Everlasting to Everlasting, without Beginning or End. Spirits that can never cease to be, yet once were not. By God were the Invisible Thrones and Dominions above created, and so likewise the Spirits in Flesh. Both were made for an everlasting Existence and Duration. The Word of God’s Power upholds them in Being, whether in a holy and happy State, or in their sinful and miserable Condition.

This Immortality simply considered is a signal Likeness of the Everlasting Father upon his Offspring. Angels are in this Image of God upon them for ever and ever: Their Being, Glory, Blessedness, Joys are sure of an everlasting Duration. And Souls that are here sanctified in Jesus Christ are sure of going to Him at Death, and of Blessedness in his Likeness for Evermore. This Life and Immortality is bro’t to Light by the Gospel, and we are begotten to the lively Hope of it by the Resurrection of Jesus Christ from the dead. The Promise which GOD hath promised is this Eternal Life, in Soul and Body united, unto all them that by patient Continuance in well doing, seek after it.

And this shows us the Original State of Man; to what Life and Happiness he was designed and prepared in his Creation, in Conformity to the Life and Blessedness of his MAKER, even for an everlasting seeing serving and Enjoyment of Him. This therefore was an eminent Part of the Divine Image and Likeness on our First Parents, in the Day when they received their Being. They knew themselves made for Immortality, and that their present happy Circumstances could never cease, but might increase for ever and ever, and be changed for better and better, higher and high: to Everlasting. Death therefore was set before them to deter them from Sin; Death bodily and spiritual; not a Period to their Existence but to their Happiness; which alone is to be called Life; for to exist in Misery, in any great Degree of it, is Death rather than Life, and a reasonable Creature would chuse Strangling, rather than such an Existence. —

We read therefore of the Soul in a State of Misery, that it shall never see Life; and the second Death has power over it. The Curse comes on that Soul in the very Letter of it, In dying thou shalt die. The miserable Spirits in Hell are for ever dying, and yet never die; never see an End of their Misery; their Worm dieth not, and the Fire is not quenched. Here is the Loss of the Image of God to the uttermost. For God lives in the Perfection of Bliss, in ineffable inconceivable Blessedness, for ever and ever: And so do Angels and glorified Spirits in His Likeness and Favour: They have an Eternity of Happiness before them: But sinning Angels, and impenitent damned Souls, are in everlasting Chains of Darkness, reserved to unquenchable Fire and everlasting Burnings. The Image of Immortality upon them is an everlasting Curse! the Reverse of that Living Happy Soul which God at first made us.

Indeed there is no Image of God’s Self-Existence, his necessary Existence, his Independent Essence, his proper Eternity and Unchangeableness, in the immortal Nature of Angels or Men, or in the happy Immortality of holy Spirits. God is the High and lofty ONE that inhabiteth Eternity; having Life in Himself. Only the Eternal Word and Spirit who are One with the Father, are also the Brightness and express Image of his Eternal Glory. Yet every immortal Spirit is an Image of the Vital Being from Whom it came; in Whom alone is the Origin of Life, and the Life is the Light of Men and Angels: i. e. the Living God is the Spring and Fountain of it; as the Psalmist sings, “For with Thee is the Fountain of Life. When Man recovers his first and proper Immortality, as the Righteous shall do at the Resurrection, then the Image of God will be perfectly restored in him, never to be lost again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-colman.html">Benjamin Colman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dissertation on the image of God wherein man was created</cite>, (Boston: S. Kneeland and T. Green, 1736), pp 21-23.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

that+Living+Happy+Soul+which+God+at+first+made+us.%0A%0AIndeed+there+is+no+Image+of+God%E2%80%99s+Self-Existence%2C+his+necessary+Existence%2C+his+Independent+Essence%2C+his+proper+Eternity+and+Unchangeableness%2C+in+the+immortal+Nature+of+Angels+or+Men%2C+or+in+the+happy+Immortality+of+holy+Spirits.+God+is+the+High+and+lofty+ONE+that+inhabiteth+Eternity%3B+having+Life+in+Himself.+Only+the+Eternal+Word+and+Spirit+who+are+One+with+the+Father%2C+are+also+the+Brightness+and+express+Image+of+his+Eternal+Glory.+Yet+every+immortal+Spirit+is+an+Image+of+the+Vital+Being+from+Whom+it+came%3B+in+Whom+alone+is+the+Origin+of+Life%2C+and+the+Life+is+the+Light+of+Men+and+Angels%3A+i.+e.+the+Living+God+is+the+Spring+and+Fountain+of+it%3B+as+the+Psalmist+sings%2C+%E2%80%9CFor+with+Thee+is+the+Fountain+of+Life.+When+Man+recovers+his+first+and+proper+Immortality%2C+as+the+Righteous+shall+do+at+the+Resurrection%2C+then+the+Image+of+God+will+be+perfectly+restored+in+him%2C+never+to+be+lost+again.%E2%80%9D%0A%0A%E2%80%94+Benjamin+Colman%2C+A+dissertation+on+the+image+of+God+wherein+man+was+created%2C+%28Boston%3A+S.+Kneeland+and+T.+Green%2C+1736%29%2C+pp+21-23.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0df8960d35.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0df8960d35.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/22/benjamin-colman-on-the-image-of-god-5/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-6b2cfa0ec6" data-kw="">
<blockquote><p>III… Although this concept cannot be conveniently defined, since it is not a single entity by its nature but rather an aggregate of various diverse natures, and therefore defies categorization according to logical principles, it can be most conveniently described as the conformity of man, according to his measure, to the supreme perfection of God. As D. Ames presents it in Medulla Theologiae (Book 1, Chapter 8, Sections 9 and 68), it is helpful to analyze this further. It is called conformity because an image, as such, is a kind of likeness expressed from another; therefore, it must be described through similarity and conformity, not identity… The subject of this image, both directly and indirectly, is man. Here we note two points: first, that man can be considered in his fourfold state: as whole in creation, fallen in corruption, restored in regeneration, and glorified in glorification. For each of these states, a different aspect of the image is attributed to him by the Holy Scriptures in various ways… Secondly, we must note, following Genesis 1:26-28, that women are by no means excluded from this image… Furthermore, the phrase “according to his measure” is not without significance, for although this conformity is in itself most perfect, it varies according to the capacity of its subjects (since it applies differently to angels than to humans). Consequently, this image was also implanted in humans according to their measure—that is, perfectly (for nothing imperfect comes from God), yet in a way divinely adjusted to their capacity, as they were not endowed with supreme perfection. Lastly, the phrase “to the supreme perfection of God” alludes to the genuine archetype and original exemplar to which man, as a secondary type and copy, is said to conform. The reason for this conformity is explained in the prolegomena. I will add only this: that this communication should in no way be conceived as formal but only effective, by way of effect… IV… Therefore, we examine the parts or the substance from which it (as previously mentioned, it is composed of multiple elements) consists, in three aspects: first, those concerning the body; second, those concerning the soul, which are further divided into 1) essence, 2) faculties, and 3) habits; and third, those concerning the whole composite… although various parts constituting this image are enumerated here, it should be understood that not all contribute equally—some antecedently and presuppositionally, others formally and primarily, and still others consequentially and sequentially.</p></blockquote>

<blockquote><p>V… In conclusion, the image of God in the first man was fittingly analogous to a son reflecting his father, especially in that which the father considers his most distinguishing feature—the face. Similarly, man was to reflect what God Himself deems most important: His holiness (Leviticus 19:2, Hebrews 11:10), which God is frequently said to swear by.</p></blockquote>

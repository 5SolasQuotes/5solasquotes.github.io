</figure><figure class="quote" id="q-962c79f34d" data-kw="">
<blockquote><p>I see some religious, and well affected women carried away with Erroneous opinions concerning this point; whose tender consciences have been abused by the mis-interpretations of some ignorants to be drawn to hold that this covering must be absolute; and total, and perpetual, so as if any hair at all be seen, it is a violation of this charge and their duty; to which purpose they urge that verse 15 as a full commentary upon this text, that the hair was given the woman for a covering; and upon this ground they are apt to censure them who take liberty to expose any of their hair, though never so moderately to others view… That I may therefore lay some grounds of this my just determination, know first that in the use of garments and these outward appendances of the body there is much latitude and variety according to the several guises of nations, and degrees of persons: there are countries the extremity of whose cold climate is such that it is no boot to bid both sexes be covered, yea muffled up, for their own safety; there are others so scorching that will hardly admit of any covering either for head or body; there are some whose hair is so large, that is able to hide them, there are others whose curled heads are alike short in both sexes, and give no advantage to the covering of either: he that made these differences of climates and people has not thought fit to confine them to one universal rule, only contenting himself with a general prescription of decency which in all countries must be regulated according to the custom or convenience of the place. For certainly these sacred ceremonies must follow the rule of the civil, for that which is held a token of subjection to our princes and other superiors, in all countries is so used in the service of the King above all gods: the Turks and all Mahumetans therefore not uncovering their heads to their Bashaes, or their Grand Lord; keep their heads covered in their devotions: and only by bowing or prostration testify their humble subjection to God. The French Divines preach with their hats on, ours uncovered; both pretend good reason; and custom for these contrary fashions; neither are either of them to be censured as faulty, and exorbitant: and with us we hold the head uncovered if the hat be off, though the cap be on: others make no difference if there be ought at all on the head.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shaking of the Olive Tree, the Remaining Works of that incomparable prelate Joseph Hall</cite>, … (London, 1660), The Women’s Vail, or a Discourse concerning the Necessity or Expedience of the Close-Covering of the Heads of Women… Occasioned by an offence unjustly taken at a Modest Dress, pp. 241-42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-c3d5b94713" data-kw="">
<blockquote><p>‘Doth not even nature itself teach you’. By nature is either meant, the law and light of nature, reason in man, common sense, or rather custom, which is second nature; and which, in this case, must be restrained to the Greeks and Jews; for though among the Grecians the men cut their hair, and did not suffer it to grow long, as also did the Jews, yet there were many nations who did not (Alex., ab. Alex. Genial. Dier., bk. 5, ch. 18. Servius in Virgil, Aeneid, bk. 10. prope finem), even at that time, observe such a rule or custom; but as the Jews and Greeks were the persons chiefly, if not solely, known to the Corinthians, the apostle signifies that the usages of these people might direct and inform them in this matter:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Whole Bible, on 1 Cor. 11</cite>, v. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

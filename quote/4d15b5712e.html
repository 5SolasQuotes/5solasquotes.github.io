<main class="wrap"><figure class="quote" id="q-4d15b5712e" data-kw="">
<blockquote><p>6. Whatever sad differences be oft amongst these [Christians], which both their darkness of mind and contrariety of natural dispositions may influence, yet does not still that blessed unity of the Spirit stand fixed and sure, by which the whole race of the saints are united in a new and spiritual nature in these sweet and sensible communications of the Spirit, and do all meet in one blessed center, yea so near an intercourse of souls and sympathy does result thence (however the sad prevalence of corruption may for some time darken the same) as no union and concord like this is in all the societies of the earth, and may be such a witness to the truth of Christianity, as to silence even the greatest atheist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-robert-fleming.html">Robert Fleming Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church Wounded &amp; Rent by a Spirit of Division</cite>, (1681), §4, p. 30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8c90bef990" data-kw="">
<blockquote><p>V. To make this clear, it must be observed that for the Reformed to seek peace and unity with other Protestants, it suffices if, after weighing and accurately judging everything according to God’s word, it appears that the remaining controversies between them are not such as to undermine the foundations of the Christian religion and true piety toward God. Thus, they can tolerate each other and recognize each other as brothers in Christ.

VI. This was the basis of the concord established a few years ago at Kassel between the theologians of Marburg and Rinteln. After both sides clearly and distinctly explained their doctrines and views to each other, and saw to what extent they agreed and what real differences remained, it was mutually acknowledged in good faith that what remained was not so significant as to prevent them from maintaining Christian and religious communion. Thus, they agreed on mutual tolerance and decided not to attack or insult each other but to maintain their own views until God revealed the truth to all while still communicating when the occasion arose, which has since been the practice.

VII. This was also the principle by which Paul attempted to reconcile believers of his time who contended among themselves over the observance of legal rites. He wanted those better instructed in Christian liberty, who had learned from the gospel that Mosaic ceremonies were abolished by Christ, to tolerate and bear with those still scrupulous about this matter and thought themselves bound to keep Mosaic ceremonies. He instructed them to admit such weak-in-faith individuals to their communion and not trouble their consciences by urging them to renounce their beliefs. This is reflected in Paul’s words to the Romans, “Accept the one whose faith is weak, without quarreling over disputable matters” (Romans 14:1), and to the Philippians, “If on some point you think differently, that too God will make clear to you. Only let us live up to what we have already attained” (Philippians 3:15-16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether from the proposed Reformed and Lutheran union, union with the Roman Church follows’ in Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), pp. 950-57 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-f8269055c4" data-kw="">
<blockquote><p>Yet with these heretics and schismatics [the Donatists], our Jacobites, Brownists and Barrowsts symbolize; for, as the Donatists refused communion with the catholic Church in regard of some scandals they observed in it, so do these separate from the true Church of England in regard of some abuses, and, as they term them, popish corruptions in it. As they excluded all from hope of salvation who were not of their pure precise sect, so these go not much behind them in their uncharitable censures of all those who are not of their fraternity…</p></blockquote>

</figure><figure class="quote" id="q-2258402bd8" data-kw="">
<blockquote><p>The divisions among Protestant Churches are to be deplored so much the more because the points they differ in are inconsiderable and might easily be composed if men had but peaceable tempers and were resolved to lay aside interest and carnal respects, and punctilios of honor and credit, etc. for they all agree in fundamentals, all are satisfied that the Church of Rome has notoriously deviated from the simplicity of the Gospel; and the matters in difference, are things in which salvation is not concerned. And upon that account their labours deserve great commendations, who heretofore and very lately have endeavored to reconcile the Protestant Churches into a perfect union: A blessed work. Blessed are the peacemakers, that endeavor to make peace among the jarring members of Christ’s Body; and though they may fail of success, yet they shall not lose their reward. In the meanwhile those who widen or heighten these differences, and incite the respective parties to hatred, and wrath, and animosities one against another, to be sure are no children of the God of peace, and had need at least before they die make public satisfaction for the dreadful effects their heats and passions do produce.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-horneck.html">Anthony Horneck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Blessed Advantages of Peace &amp; Peacemakers In a Sermon preached at the Savoy in London upon the Fifth of St. Matthew</cite>, verse 9, ‘Blessed are the Peace-makers…’ (London: Aylmer, 1697), pp. 33-34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

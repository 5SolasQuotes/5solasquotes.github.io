<main class="wrap"><figure class="quote" id="q-a03a02f258" data-kw="">
<blockquote><p>I confess their Common-Prayer is my burden, by reason of its defects and disorder, and the rudeness of the ministerial method. I stand convinced it ought to be altered; yea, abolished… yet I must confess I find in it no matter to which (on a charitable interpretation) a sober serious Christian may not say, nay, can deny his ‘Amen’. And though I distaste the ministerial method, I cannot disown in it the essential form of prayer, (viz.) A calling upon God in the Name of Christ… nor do I see on what ground I can deny, or refuse my ‘Amen’ to what is prayed for… because they are rudely and unfittingly expressed, whilst the irregularity of that common order is no bar to God’s acceptance of my more regular ‘Amen’ thereunto given.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church</cite>, … in a Letter, written July 20, 1661… (1662), p. 25 Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c8418870d" data-kw="">
<blockquote><p>I own… the worship there performed… as in the preaching of the Word, and prayer before and after sermon, to be in the main sound and good for the substance or matter thereof… Though I judge their form of worship to be in many respects less perfect than is to be desired; yet I have found my heart spiritually affected and raised towards God therein… the lawfulness of partaking in that worship, it being sound for the substance in the main, and the mode thereof being laudable in diverse forms and orders, and passable in the most, though in some offensive, inconvenient, or less perfect.</p></blockquote>

<blockquote><p>[Job 15:15] ‘For God finds not steadfastness in his saints (that is to say in his angels), neither are the heavens clean in his sight:’… For first and foremost they [men] had need to be cleaner and purer than the angels, and they had need to surmount the brightness of the sun and the stars, seeing that the heavens themselves are infected before God, if comparison should be made between them and Him… But there is another higher righteousness in God, which surmounts all creatures, insomuch as no angel is able to satisfy it. And no wonder at all: for what comparison is there between an infinite thing and a thing that has bounds? Behold, although the angels have great glory in them: yet are they but creatures. And what is God? He is an infinite thing, insomuch that when we think upon Him, we ought to be ravished into astonishment. So then let us not think it strange, that God’s righteousness should be so high that when all creatures come to that point, all that is to be found in them shall be nothing at all, but they shall deserve to be utterly wiped out… And so far are we unable to stand upright that the very angels of heaven are confounded there. And why? Because the very heavens themselves are not clean. For whereas God has created the sun to give light to the world, and given some brightness to the stars also: it follows not therefore that they have a divine perfection. We must remember what has been said afore: namely that all the creatures that God made do keep still some marks of his grace. But if a man would compare that which is in the creatures with that which is in God: he shall find that the one is all and the other is nothing. Thus ye see how the heavens are not clean, that is to say, that there is always some imperfection in the creatures, so as they have not the power to stand before God, as in respect of the infinite glory that is in Him.</p></blockquote>

</figure><figure class="quote" id="q-01615fa0d0" data-kw="">
<blockquote><p>…it is a great consideration also: I know that Jesus Christ has given his people light in matters of this nature by degrees. Thousands of good souls that have been bred up and born in our assemblies, and enjoy the ordinances of God, and have done it comfortably, cannot suddenly take in other principles, you must wait upon Christ to do it. In this case, men are not to be wrought off by falsehoods [in exaggerations and extreme speaking and positions], God has no need of them. No, rather till men do take in light, you should give them all that is comfortable in the condition they are in; we should acknowledge every good thing in every man, in every church, in every thing, and that is a way to work upon men, and to prevail with them; as it is Philemon, verse 6: ‘That the communication of thy faith may become effectual by the acknowledgment of every good thing, which is in you in Christ Jesus.’ It is that which builds men up, by acknowledgment of every good thing that is in them.</p></blockquote>

<blockquote><p>§66… There is a second thing unlawful also, and that is the misdetermining of those same modes and circumstances which he is authorized to determine. For he is (as is said) to do it by God’s General Rule. Here therefore we must thus conclude:

1. That every misordering of such great affairs is the sin of them that do it.

2. But yet that the subject is not exempted from obedience by every such mistake of the governor: but by some, he is. §67. If the mischoosing of such circumstances by Church-governors be but an inconvenience and do not destroy the ordinance itself, or frustrate the ends of it, we are to obey: 1. For he is the judge in his own work, and not we: 2. the thing is not sinful, though inconvenient.

3. Obedience is commanded to our lawful governors… §68. But if a governor so misdetermine but a mode or circumstance as will overthrow the substance and ends of the worship, I would not obey, except some greater evil were likely to follow my not obeying at that particular season than the frustrating of the duty itself would come to. As for example: If a governor make a new sacrament, I will not obey, because his command is null and the thing [is] simply evil. If he miscommand a circumstance of time or place, or gesture, I will consider the consequents. If he command the solemn assemblies to be held a mile or two or three from the people, I will obey him, if it be but as far as I can go without frustrating the work itself. But if he command us all to go ten miles or twenty miles to worship, I would obey for some time to avoid a greater evil, but ordinarily I would no more obey than if he forbade all Christian assemblies, for it comes all to one. So if he command the assemblies to be at break of day or after sun-setting, I would obey. But if he command that we assemble only at midnight, what should I do then? The thing is not simply unlawful: He does but misdo his own work. And therefore for some times I would obey, if it were necessary to avoid a greater evil. But if he make it the ordinary case, I would not obey: because it destroys the worship itself in a manner, as if he simply forbade it, and this he has no power to do. An inconvenient gesture I would use in obedience and to avoid a greater evil: But I would not obey him that would command me to stand on my head always in hearing. An unhandsome vesture I would use in obedience to a lawful governor and to avoid a greater evil: But not so ridiculous a vesture as would set all the people on laughing so as to frustrate the work that we assemble for. §69. In all such cases where governors act not as usurpers in a matter that they have no authority in, but only misdo their own work, it much concerns the subjects to foresee what’s likely to be the consequents of their obeying or disobeying, and accordingly to do that which tends most to the ends of the work: still holding to this rule, that we must obey in all things lawful. §70. And when we do obey in a case of miscommanding, it is not a doing evil that good may come of it, as some do misconceive: But it is only a submitting to that which is ill commanded, but not evil in him that does submit. It is the determiner that is the cause of the inconvenience, and not the obeyer. Nor is it inconvenient for me to obey, though it be worse perhaps to him that commands. While he sins in commanding, he may make it my duty to obey.</p></blockquote>

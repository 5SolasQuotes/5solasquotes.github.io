<main class="wrap"><figure class="quote" id="q-cbe38a60ce" data-kw="">
<blockquote><p>I gave account of their express words [that of the Quakers], ‘We are against all your David’s praises and prophecies in meter’, contrary to Eph. 5:19; Col. 3:16 and other Scriptures. R.F. makes me this return, ‘Singing of psalms, and hymns and spiritual songs, we are not against, but own; but your poetry we deny.’ Response: He might as well say, your translation of them into English meter we deny: but if psalms, hymns and spiritual songs be owned, they are either David’s, and other of saints’ penning, and the Spirit’s inditing [composing] in the Scripture, or of their [the Quakers’] own composing. If they own none but of their own composing, they reject David’s, and what was left for our use in Scripture… And what better poetry than that in the Scripture? which is translated and ordered as suiteth best to our own mother tongue, for singing, and teaching others to sing David’s words and praises, with David’s spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-stalham.html">John Stalham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reviler Rebuked</cite>, (London, 1657), 15th Head, ‘Concerning Singing’, Section 42, p. 205. Stalham (d. 1677) was a reformed puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“I gave account of their express words [that of the Quakers], ‘We are against all your David’s praises and prophecies in meter’, contrary to Eph. 5:19; Col. 3:16 and other Scriptures. R.F. makes me this return, ‘Singing of psalms, and hymns and spiritual songs, we are not against, but own; but your poetry we deny.’ Response: He might as well say, your translation of them into English meter we deny: but if psalms, hymns and spiritual songs be owned, they are either David’s, and other of saints’ penning, and the Spirit’s inditing [composing] in the Scripture, or of their [the Quakers’] own composing. If they own none but of their own composing, they reject David’s, and what was left for our use in Scripture… And what better poetry than that in the Scripture? which is translated and ordered as suiteth best to our own mother tongue, for singing, and teaching others to sing David’s words and praises, with David’s spirit.”

— John Stalham, The Reviler Rebuked: or, A Re-Enforcement of the charge against the Quakers: so called for their contradictions to the Scriptures of God, and to their own scriblings (London, 1657), 15th Head, ‘Concerning Singing’, Section 42, p. 205. Stalham (d. 1677) was a reformed puritan.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+gave+account+of+their+express+words+%5Bthat+of+the+Quakers%5D%2C+%E2%80%98We+are+against+all+your+David%E2%80%99s+praises+and+prophecies+in+meter%E2%80%99%2C+contrary+to+Eph.+5%3A19%3B+Col.+3%3A16+and+other+Scriptures.+R.F.+makes+me+this+return%2C+%E2%80%98Singing+of+psalms%2C+and+hymns+and+spiritual+songs%2C+we+are+not+against%2C+but+own%3B+but+your+poetry+we+deny.%E2%80%99+Response%3A+He+might+as+well+say%2C+your+translation+of+them+into+English+meter+we+deny%3A+but+if+psalms%2C+hymns+and+spiritual+songs+be+owned%2C+they+are+either+David%E2%80%99s%2C+and+other+of+saints%E2%80%99+penning%2C+and+the+Spirit%E2%80%99s+inditing+%5Bcomposing%5D+in+the+Scripture%2C+or+of+their+%5Bthe+Quakers%E2%80%99%5D+own+composing.+If+they+own+none+but+of+their+own+composing%2C+they+reject+David%E2%80%99s%2C+and+what+was+left+for+our+use+in+Scripture%E2%80%A6+And+what+better+poetry+than+that+in+the+Scripture%3F+which+is+translated+and+ordered+as+suiteth+best+to+our+own+mother+tongue%2C+for+singing%2C+and+teaching+others+to+sing+David%E2%80%99s+words+and+praises%2C+with+David%E2%80%99s+spirit.%E2%80%9D%0A%0A%E2%80%94+John+Stalham%2C+The+Reviler+Rebuked%3A+or%2C+A+Re-Enforcement+of+the+charge+against+the+Quakers%3A+so+called+for+their+contradictions+to+the+Scriptures+of+God%2C+and+to+their+own+scriblings+%28London%2C+1657%29%2C+15th+Head%2C+%E2%80%98Concerning+Singing%E2%80%99%2C+Section+42%2C+p.+205.+Stalham+%28d.+1677%29+was+a+reformed+puritan.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcbe38a60ce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cbe38a60ce.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=I%20gave%20account%20of%20their%20express,words%20and%20praises%2C%20with%20David%E2%80%99s%20spirit&amp;text=I%20gave%20account%20of%20their%20express%20words%20%5Bthat&amp;text=sing%20David%E2%80%99s%20words%20and%20praises%2C%20with%20David%E2%80%99s%20spirit" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-70334928a3" data-kw="">
<blockquote><p>‘Dost thou wish’, he [the apostle] says, ‘to be cheerful, dost thou wish to employ the day? I give thee spiritual drink;’ for drunkenness even cuts off the articulate sound of our tongue; it makes us lisp and stammer, and distorts the eyes, and the whole frame together. Learn to sing psalms, and thou shalt see the delightfulness of the employment. For they who sing psalms are filled with the Holy Spirit, as they who sing satanic songs are filled with an unclean spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on the Epistle to the Ephesians in A Library of Fathers of the Holy Catholic Church</cite>, … Trans. members of the English Church (Oxford, 1845), Sermon 19, vv. 18-21, p. 302</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-9e7bfcd23f" data-kw="">
<blockquote><p>I. First then, as to the Praises of God. The Scriptures both of the Old and New Testaments require the use of the Psalms in offering up praises to God. We find in the Old Testament (2 Chron. 29:30) [that] Hezekiah the King and the princes commanded the Levites to sing praises to the Lord with the words of David, and of Asaph, and they sang with gladness. This Command of Hezekiah proceeded from God, and was approved by Him. The same way of praising God continued in the Jewish Church till our Saviour’s time: And after that, we have yet a more positive command for the use of them by the apostle, Eph. 5:19, ‘Speaking to your selves in psalms, and hymns, and spiritual songs.’ And Col. 3:16, ‘Let the words of Christ dwell in you richly in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs; singing and making melody with grace in your hearts to the Lord.’ I think there is no room to doubt, but by the psalms, etc. in these places, is meant the Book of Psalms, which the Holy Ghost has left for this purpose to the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-king.html">William King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Inventions of men</cite>, (Dublin, 1694), Ch. 1, ‘Of Praises’, Section 1, ‘What the Holy Scriptures prescribe concerning them’, pp. 6-7. King (1650-1729) was an Anglican divine in the Church of Ireland and was the archbishop of Dublin.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“I. First then, as to the Praises of God. The Scriptures both of the Old and New Testaments require the use of the Psalms in offering up praises to God. We find in the Old Testament (2 Chron. 29:30) [that] Hezekiah the King and the princes commanded the Levites to sing praises to the Lord with the words of David, and of Asaph, and they sang with gladness. This Command of Hezekiah proceeded from God, and was approved by Him. The same way of praising God continued in the Jewish Church till our Saviour’s time: And after that, we have yet a more positive command for the use of them by the apostle, Eph. 5:19, ‘Speaking to your selves in psalms, and hymns, and spiritual songs.’ And Col. 3:16, ‘Let the words of Christ dwell in you richly in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs; singing and making melody with grace in your hearts to the Lord.’ I think there is no room to doubt, but by the psalms, etc. in these places, is meant the Book of Psalms, which the Holy Ghost has left for this purpose to the Church.”

" rel="noopener">Share on X</a><a class="perma" href="../quote/9e7bfcd23f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=I.%20First%20then%2C%20as%20to%20the,for%20this%20purpose%20to%20the%20Church&amp;text=I.%20First%20then%2C%20as%20to%20the%20Praises%20of&amp;text=has%20left%20for%20this%20purpose%20to%20the%20Church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b579acfb7d" data-kw="">
<blockquote><p>‘God is to be worshipped in Spirit and in Truth’; no worshipping can be more true, or more spiritual than the Psalter said with a pure mind and a hearty devotion. For David was God’s instrument to the Church, teaching and admonishing us (as our duty is to each other) in psalms and hymns, and spiritual songs, and the Spirit of Truth was the Grand Dictator of what David wrote; so that we may confidently use this devotion as the Church of God ever did, making her addresses to God most frequently by the Psalms:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalter of David with Titles and Collects according to the matter of each Psalm</cite>, (London, 1647) ‘The Preface’, no page number. Taylor (1613–1667) was a conformed cleric in the Church of England who advocated for very liturgical worship. The Preface is very good, at length, with regard to the psalms. Some of the references to ‘hymns’ refer to the psalms themselves. Taylor held to predominant psalmody.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“‘God is to be worshipped in Spirit and in Truth’; no worshipping can be more true, or more spiritual than the Psalter said with a pure mind and a hearty devotion. For David was God’s instrument to the Church, teaching and admonishing us (as our duty is to each other) in psalms and hymns, and spiritual songs, and the Spirit of Truth was the Grand Dictator of what David wrote; so that we may confidently use this devotion as the Church of God ever did, making her addresses to God most frequently by the Psalms:”

</figure><figure class="quote" id="q-6a8daa9d23" data-kw="">
<blockquote><p>We knew that these psalms, and hymns and spiritual songs, though in other languages (and consequently so in other poetical measures) were inspired by the Holy-Ghost, to holy men of old for the edification and comfort of the Church and people of God in all ensuing ages to the end of the world. And for these holy ends we have with special care &amp; diligence translated them into such meters as are most usual and suitable for such holy poems, in our own language, having a special eye to the gravity of the phrase of sacred writ and sweetness of the verse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-dunster.html">Henry Dunster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms Hymns and Spiritual Songs of the Old and New Testament, faithfully translated into English metre</cite>, ([Cambridge, Mass.], 1651), ‘To the Godly Reader’, no page number. This 3rd edition of the Bay Psalm Book psalter has the 150 psalms and other inspired Bible songs in it (the original Bay Psalm Book did not have the other Bible-Songs). On the title page is 2 Tim. 3:16-17; Col. 3:16; Eph. 5:18-19; James 5:13. This same psalter and preface were reprinted in Boston in 1698 with Cotton Mather’s name on it.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“We knew that these psalms, and hymns and spiritual songs, though in other languages (and consequently so in other poetical measures) were inspired by the Holy-Ghost, to holy men of old for the edification and comfort of the Church and people of God in all ensuing ages to the end of the world. And for these holy ends we have with special care &amp; diligence translated them into such meters as are most usual and suitable for such holy poems, in our own language, having a special eye to the gravity of the phrase of sacred writ and sweetness of the verse.”

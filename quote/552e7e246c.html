<main class="wrap"><figure class="quote" id="q-552e7e246c" data-kw="">
<blockquote><p>IX. The process and succession of acts which dispose to the production of the first actual faith nearly holds itself as that of the human fetus, which, although the rational soul infused is specific, by which the vegetative and sensitive are contained (in the same way as the binary is in the ternary and the triangle in the quadrangle), yet man first lives the life of a plant, then of an animal, then of a man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

<blockquote><p>In response to an appeal from the Original Secession Synod seeking unity between itself and the Free Church of Scotland, in 1852 the General Assembly of the latter body passed an Act concerning the need to continue to prosecute the principles advocated in the covenants of the seventeenth-century:

In regard to the events and transactions of the First and Second Reformations, to which the Synod refer in their Representation and Appeal, the General Assembly agree with their brethren in owning the special grace of God vouchsafed to our fathers on these critical occasions; when the Lord was pleased to order his Providence in a manner specially calling for faithfulness, zeal, and union; and when He enabled the church and nation to make high attainments, and disposed them to enter into solemn vows and engagements for the advancement of His cause, and the overthrow of all that was opposed to it within these realms.

The General Assembly agree also in confessing and lamenting the defection from these attainments, and the breach of these public promises and engagements. And they fully and unreservedly acknowledge the obligation to prosecute the ends of the Covenants, in the Reformations which these Covenants were designed to advance and perpetuate; and in particular, to oppose Popery in all its forms, and Popish institutions, influences, and tendencies, wherever they may be found; and to aim at a Scriptural union and uniformity, in doctrine, worship, and discipline, among the Churches of these lands; in the use of all competent means, suitable to present circumstances, and consistent with the Word of God and the functions and spirit of a Church of Christ. The General Assembly appoint the Representation and Appeal, referred to in this Act, to be recorded as craved, and to be inserted along with this Act in the printed Acts of the General Assembly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/general-assembly-of-the-free-church-of-scotland.html">General Assembly of the Free Church of Scotland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Act anent the Representation and Appeal of the Synod of United Original Seceders. Edinburgh, 1 June 1852, Sess. 21’ in Acts of the General Assembly of the Free Church of Scotland, 1848-1852</cite>, (Edinburgh: John Greig, 1852), pp 418-19 (emphasis added).</span></figcaption>

<blockquote><p>Sir Robert Hamilton remained the central figure in the United Societies until his death in 1701, even though there is no record that he was ever ordained to any office. The Societies then remained without a designated leader, or any ministerial oversight, until 1706 when John Macmillan, a deposed minister from the Church of Scotland, was called as their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/justin-stodghill.html">Justin Stodghill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Alexander Shields’ Response to Sir Robert Hamilton in 1690” Scottish Reformation Society Historical Journal 7</cite>, (2017), pp. 73-103</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>LIII… 2… without holiness none shall see God, Heb. 12:14… It is not then easy to think of a greater hurt than to forbid men such means, without which experience assures us that few comparatively are thus enlightened and renewed to God, and with which more comparatively are renewed. To say that God can bless to us an ignorant heartless, carnal teacher, is no answer while experience certifies us that comparatively He does not do it…

3. For who knows where to bound his obedience to such silencers as aforesaid… if 1,000 or 2,000 or 3,000 parishes must choose the apparent hazard of their souls and refuse such helps as experience certifies us they greatly need, in obedience to man, why must not the rest of the parishes do so also? May I give away the needful helps to my salvation because others have them, as if their salvation might satisfy me instead of my own? … LX… He is not the physician whom we can trust that does not cure men… … LXII. If the people, conscious of their great necessity of pastoral oversight and help, and of Christ’s command to use it, do live in a parish or country where they cannot have it from those that the magistrate allows, either because they cannot perform it for them or because they will not: it is no schism for such to seek and use it from worthy, though prohibited men. We before spake of the schisms of teachers, and now [we will speak] of hearers… In several cases the people may possibly be [unfortunately] deprived of this [pastoral oversight]…

1. When public pastors are at so great a distance from them as that such pastors cannot come to them, nor they and their families go so far without such inconvenience and trouble as will frustrate the end of their endeavors: As in France where the Protestants must go twenty miles or ten to a church, which the weak, children and aged cannot do, nor the rest of the family without such cost and pains, and loss of time as will deprive them of the benefit…

2. Where parishes are so great that the allowed pastors cannot preach to half or a fourth or tenth part of the people, and cannot visit half the sick, and baptize, and administer the Lord’s Supper as is necessary, and have not time if the ignorant and doubting, and troubled persons should come to them for counsel, resolution or comfort…

3. Where the allowed pastors are so slothful or proud that they will not condescend to these offices of personal help to many thousands, especially of the poor.

4. Where they are young raw men, or ignorant of such matters, unable to counsel people as their necessities require, in order to their salvation…

5. Where they are so profane and malignant that if poor people come to them with cases of conscience, or for counsel what they must do to be saved, they will but deride them as scrupulous and precise, and make them believe that to be solicitous about salvation and afraid of sinning, and seriously godly, is but to be hypocrites, melancholy or mad…

6. When they are heretical and not to be trusted in point of faith.

7. And when they are so factious and schismatical as that their preaching and conference tends to render other good Christians odious, and stir up men to hate, persecute or separate from them, and so to destroy true love and concord. In any of these cases when the people or part of them are deprived of those pastoral helps which their necessity requires, and God commands, they may seek it where they can best have it. LXIII. In all these cases it is an unsatisfactory answer to tell them that religion is kept up in the land and that other persons or parishes have what they want, or that order and obedience must be preferred to their supply, or that God can save them without a pastor, etc. For so God can save the heathen world without the Gospel preached if He please: And so you might persuade the poor to famish rather than [go] against law to beg, because if thousands of them die of famine, yet other people are supplied and have plenty: Or you might tell men that they must use no physician, though they die for it, if they have no tolerable one allowed them by the magistrate, because others have physicians… What if the parish priest could baptize but one of many (or not all)? Must the rest be content to be unbaptized? If not, why must they be content without all public preaching and worshipping of God, and the Lord’s Supper, and personal helps of pastors which they need? LXIV. Yet here we must declare:

1. That in such necessity people must, caeteris paribus [‘other things being equal’], first seek their supply in that way that is most for peace and most for public good, and least scandalous or dividing, and that is most agreable to the ruler’s will and honour.

2. That for some short season in which his soul is not apparently hazarded, as also in the tolerable loss of some measures of pastoral help, a man must submit his own personal advantage to public interest and may hope that God will make it up. As also when it tends to his probable greater advantage afterward by putting by some present storm: But not statedly, to be without Christ’s instituted ordinances and helps. For example, parish order is desireable and is the ruler’s will: If therefore supply can be had in a neighbor parish for them that want [lack] it in their own, and by an allowed minister rather than a disallowed, it should be chosen, unless the disparity be so great as to weigh down the contrary inconveniences. And if for a time any be constrained to another way, they should do it but as an extraordinary necessity for the present time till they can be supplied in the allowed parochial way; and avoid as much as possibly they can all ways, though lawful, that encourage true schisms.

3. And we must profess that if any preachers or people shall out of self conceitedness pretend necessity when there is none, their pretence is no justification of their disorder or disobedience. Magistrates may regulate us in the circumstances of those duties which the Law of Nature or the Gospel [in an established Christian nation] do command: But if on such pretence of regulating circumstances, they will violate or contradict either the Law of Nature or the Gospel, and destroy the duty itself or its end, we are not bound in such cases to obey them, but must pariently suffer. … LXVI…

4. Cyprian’s conclusion before mentioned is known, inviting the people to forsake a bad pastor, Plebs maximam habet potestatem [‘The people have the greatest power’], etc. And he convinces the people that if they forsake not such they are guilty. … LXVII… God will have mercy rather than sacrifice [Hos. 6:6], and prefers men’s salvation to ceremony or Church laws.</p></blockquote>

ble+as+will+frustrate+the+end+of+their+endeavors%3A+As+in+France+where+the+Protestants+must+go+twenty+miles+or+ten+to+a+church%2C+which+the+weak%2C+children+and+aged+cannot+do%2C+nor+the+rest+of+the+family+without+such+cost+and+pains%2C+and+loss+of+time+as+will+deprive+them+of+the+benefit%E2%80%A6%0A%0A2.+Where+parishes+are+so+great+that+the+allowed+pastors+cannot+preach+to+half+or+a+fourth+or+tenth+part+of+the+people%2C+and+cannot+visit+half+the+sick%2C+and+baptize%2C+and+administer+the+Lord%E2%80%99s+Supper+as+is+necessary%2C+and+have+not+time+if+the+ignorant+and+doubting%2C+and+troubled+persons+should+come+to+them+for+counsel%2C+resolution+or+comfort%E2%80%A6%0A%0A3.+Where+the+allowed+pastors+are+so+slothful+or+proud+that+they+will+not+condescend+to+these+offices+of+personal+help+to+many+thousands%2C+especially+of+the+poor.%0A%0A4.+Where+they+are+young+raw+men%2C+or+ignorant+of+such+matters%2C+unable+to+counsel+people+as+their+necessities+require%2C+in+order+to+their+salvation%E2%80%A6%0A%0A5.+Where+they+are+so+profane+and+malignant+that+if+poor+people+come+to+them+with+cases+of+conscience%2C+or+for+counsel+what+they+must+do+to+be+saved%2C+they+will+but+deride+them+as+scrupulous+and+precise%2C+and+make+them+believe+that+to+be+solicitous+about+salvation+and+afraid+of+sinning%2C+and+seriously+godly%2C+is+but+to+be+hypocrites%2C+melancholy+or+mad%E2%80%A6%0A%0A6.+When+they+are+heretical+and+not+to+be+trusted+in+point+of+faith.%0A%0A7.+And+when+they+are+so+factious+and+schismatical+as+that+their+preaching+and+conference+tends+to+render+other+good+Christians+odious%2C+and+stir+up+men+to+hate%2C+persecute+or+separate+from+them%2C+and+so+to+destroy+true+love+and+concord.+In+any+of+these+cases+when+the+people+or+part+of+them+are+deprived+of+those+pastoral+helps+which+their+necessity+requires%2C+and+God+commands%2C+they+may+seek+it+where+they+can+best+have+it.+LXIII.+In+all+these+cases+it+is+an+unsatisfactory+answer+to+tell+them+that+religion+is+kept+up+in+the+land+and+that+other+persons+or+parishes+have+what+they+want%2C+or+that+order+and+obedience+must+be+preferred+to+their+supply%2C+or+that+God+can+save+them+without+a+pastor%2C+etc.+For+so+God+can+save+the+heathen+world+without+the+Gospel+preached+if+He+please%3A+And+so+you+might+persuade+the+poor+to+famish+rather+than+%5Bgo%5D+against+law+to+beg%2C+because+if+thousands+of+them+die+of+famine%2C+yet+other+people+are+supplied+and+have+plenty%3A+Or+you+might+tell+men+that+they+must+use+no+physician%2C+though+they+die+for+it%2C+if+they+have+no+tolerable+one+allowed+them+by+the+magistrate%2C+because+others+have+physicians%E2%80%A6+What+if+the+parish+priest+could+baptize+but+one+of+many+%28or+not+all%29%3F+Must+the+rest+be+content+to+be+unbaptized%3F+If+not%2C+why+must+they+be+content+without+all+public+preaching+and+worshipping+of+God%2C+and+the+Lord%E2%80%99s+Supper%2C+and+personal+helps+of+pastors+which+they+need%3F+LXIV.+Yet+here+we+must+declare%3A%0A%0A1.+That+in+such+necessity+people+must%2C+caeteris+paribus+%5B%E2%80%98other+things+being+equal%E2%80%99%5D%2C+first+seek+their+supply+in+that+way+that+is+most+for+peace+and+most+for+public+good%2C+and+least+scandalous+or+dividing%2C+and+that+is+most+agreable+to+the+ruler%E2%80%99s+will+and+honour.%0A%0A2.+That+for+some+short+season+in+which+his+soul+is+not+apparently+hazarded%2C+as+also+in+the+tolerable+loss+of+some+measures+of+pastoral+help%2C+a+man+must+submit+his+own+personal+advantage+to+public+interest+and+may+hope+that+God+will+make+it+up.+As+also+when+it+tends+to+his+probable+greater+advantage+afterward+by+putting+by+some+present+storm%3A+But+not+statedly%2C+to+be+without+Christ%E2%80%99s+instituted+ordinances+and+helps.+For+example%2C+parish+order+is+desireable+and+is+the+ruler%E2%80%99s+will%3A+If+therefore+supply+can+be+had+in+a+neighbor+parish+for+them+that+want+%5Black%5D+it+in+their+own%2C+and+by+an+allowed+minister+rather+than+a+disallowed%2C+it+should+be+chosen%2C+unless+the+disparity+be+so+great+as+to+weigh+down+the+contrary+inconveniences.+And+if+for+a+time+any+be+constrained+to+another+way%2C+they+should+do+it+but+as+an+extraordinary+necessity+for+the+present+time+till+they+can+be+supplied+in+the+allowed+parochial+way%3B+and+avoid+as+much+as+possibly+they+can+all+ways%2C+though+lawful%2C+that+encourage+true+schisms.%0A%0A3.+And+we+must+profess+that+if+any+preachers+or+people+shall+out+of+self+conceitedness+pretend+necessity+when+there+is+none%2C+their+pretence+is+no+justification+of+their+disorder+or+disobedience.+Magistrates+may+regulate+us+in+the+circumstances+of+those+duties+which+the+Law+of+Nature+or+the+Gospel+%5Bin+an+established+Christian+nation%5D+do+command%3A+But+if+on+such+pretence+of+regulating+circumstances%2C+they+will+violate+or+contradict+either+the+Law+of+Nature+or+the+Gospel%2C+and+destroy+the+duty+itself+or+its+end%2C+we+are+not+bound+in+such+cases+to+obey+them%2C+but+must+pariently+suffer.+%E2%80%A6+LXVI%E2%80%A6%0A%0A4.+Cyprian%E2%80%99s+conclusion+before+mentioned+is+known%2C+inviting+the+people+to+forsake+a+bad+pastor%2C+Plebs+maximam+habet+potestatem+%5B%E2%80%98The+people+have+the+greatest+power%E2%80%99%5D%2C+etc.+And+he+convinces+the+people+that+if+they+forsake+not+such+they+are+guilty.+%E2%80%A6+LXVII%E2%80%A6+God+will+have+mercy+rather+than+sacrifice+%5BHos.+6%3A6%5D%2C+and+prefers+men%E2%80%99s+salvation+to+ceremony+or+Church+laws.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Nonconformists%E2%80%99+Plea+for+Peace%2C+%E2%80%A6+%28London%2C+1679%29%2C+sect.+6%2C+pp.+88-112&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F441699c653.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/441699c653.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separatism/#:~:text=without%20holiness%20none%20shall%20see%20God,salvation%20to%20ceremony%20or%20Church%20laws&amp;text=without%20holiness%20none%20shall%20see%20God%2C%20Heb.%2012%3A14&amp;text=prefers%20men%E2%80%99s%20salvation%20to%20ceremony%20or%20Church%20laws" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e7baccd699" data-kw="">
<blockquote><p>Although some think that they can claim a historical link with the Second Reformation Church of Scotland without acknowledging the covenants of the seventeenth-century, this supposition is a-historical. This is because in 1640 the General Assembly of the Scottish Kirk made it an ex-communicable offence not to adhere to the National Covenant (which, incidentally, proves that the early Covenanters believed in close communion/confessional membership):

The Assembly ordains, that such as have subscribed the Covenant and speaks against the same, if he be a Minister, shall be deprived: And if he continue so, being deprived, shall be excommunicate: And if he be any other man, shall be dealt with as perjured, and satisfy publikely [sic] for his perjury.</p></blockquote>

" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-9cdd80b30f" data-kw="">
<blockquote><p>No sooner was it known that the [Scottish, civil] convention of estates [at Dundee] was to meet in March, 1689 [during the Glorious Revolution], than the Covenanters of the west resolved on repairing in a body to Edinburgh, to aid in protecting the meeting from the apprehended attack of the Jacobites [those for the previous king, James II]. Their assistance was far from being unnecessary… The sudden rising of Dundee having led to measures for the defence of the country, those of the Covenanters known by the name of Cameronians, chiefly in the neighbourhood of Douglas, raised a regiment of eight hundred men, without beat of drum or expense of levy, under the command of the Earl of Angus… Such was the origin of the Cameronian regiment… Discussions ensued, of a kind similar to those which had divided the counsels of the Covenanters at Bothwell. It was keenly debated among them whether it was not a “sinful association” to enlist under the same banner with other regiments, composed of those who had been malignants and abettors of tyranny, or who had not cleared themselves from the scandal of unlawful engagements. Owing to their pertinacity in these unreasonable scruples [longtime covenanter] Colonel Cleland, on whom the command of the regiment was devolved, very nearly lost temper, and he refused to accede to their demands, as subversive of all military discipline. But the matter was finally compromised by their agreeing on a brief general declaration, drawn up by Sir Patrick Hume of Polwart, and explained by Mr. Alexander Shields… It was to the effect that they “appeared in his majesty’s service in defence of the nation, recovery and preservation of the Protestant religion, and, in particular, the work of reformation in Scotland, in opposition to Popery, Prelacy, and arbitrary power, in all its branches and steps, until the government of church and state be brought back to their lustre and integrity, established in the best and purest times.</p></blockquote>

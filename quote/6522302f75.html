<main class="wrap"><figure class="quote" id="q-6522302f75" data-kw="">
<blockquote><p>93. Next it may be granted that the matter may be put under a further examination, yet upon condition, that when it is come to the revision of the former sentence, regard may be had of the weaker which are found willing to be taught, though they doubt; but that unto the wicked and contentious tempters, which do mainly strive to oppress our liberty which we have in Christ, and to bring us into bondage, we do not for a moment give place by subjecting ourselves; for what else seek they or wait for, than that under the pretense of a revising and of new debate, they cast in lets and impediments ever and anone, and that by cunning lyings in wait they may betray the liberty of the Church, and in process of time may by open violence more forceably break in upon it, or at least constrain the ministers of the Church to weave Penelope’s web, which they can never bring to an end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 111 Propositions</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-31fa497d99" data-kw="Councils contradict councils">
<blockquote><p>Nor is there any ground for whispering to me, that when councils are at variance, one or other of them is not a lawful council. For how shall we ascertain this? Just, if I mistake not, by judging from Scripture that the decrees are not orthodox. For this alone is the sure law of discrimination.</p></blockquote>

</figure><figure class="quote" id="q-b7435080a5" data-kw="">
<blockquote><p>The believer is bound to obey the rulers of the church only as long as they obey God and preach his pure and entire Word. But when they forsake the truth and rise up against God, the supreme ruler, he would be a rebel against God who would follow them. An inferior order is to be retained while the superior is unviolated; but where it is treated of the supreme power and of salvation, he would be injurious to God and to himself and his neighbor who should follow the erring and not withdraw from them.</p></blockquote>

</figure><figure class="quote" id="q-445466e81c" data-kw="">
<blockquote><p>2. As concerning actions of Church-policy that cannot be warranted by the light of nature, and yet have intrinsical conveniency and aptitude to edify and decently to accommodate the worship of God. I conceive these may be done, but not because the Church so commands, as if their commandment were the formal reason of our obedience, but because partly the light of the Law of reason, partly scripture does warrant them… … Question. But does not the Church determine things that of themselves are indifferent, as whether [the] sermon should begin at nine of clock or ten in the morning; and after the Church has past a determination for the diet of ten a clock, the indifferency of either nine or ten is removed and the practice, without any warrant of Scripture, [is] restricted to one, for order and peace sake; and why may not the like be done in positives of Church-government? Answer. The truth is [that] the Church by her will puts no determination on the time, but only ministerially declares that which God’s providence accommodating itself to the season, climate, the conveniency of the congregation as they lie in distance from the place of meeting, has determined already…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646) | Intro, section 5, ‘Moral Obedience Resolved Ultimately in Scripture’, pp. 80-82</span></figcaption>

</figure><figure class="quote" id="q-a9ddcc0e66" data-kw="">
<blockquote><p>Say that the decision of the synod be agreeable to the Word: the Lord lays on the coaction [coercion] to all, to believe and accordingly profess the truth, and that by a synod, as Christ says, ‘he that heareth you heareth Me’: so the coaction, such as it is, must come principally from God, instrumentally from the synod; but it flows from both by accident [that is, it does not occur necessarily], and through men’s abuse, who receive not the truth in love, but for fear of shame, lest they should by the godly go for perverters of souls, Acts 15, that they do hypocritically profess what they ought sincerely to believe and profess; may we not say many men of corrupt minds believed circumcision to be necessary, and yet for fear of the apostles’ censure that they should be judged troublers of souls, liars and false teachers, as they are judged to be, Acts 15:24, would dissemble?… For there be but two ways of working on the mind to drive men to be of another opinion, one by fear either of shame, reproach or censures civil or ecclesiastical, another by mere teaching and instructing.</p></blockquote>

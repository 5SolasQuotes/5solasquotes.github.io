<main class="wrap"><figure class="quote" id="q-9d56faea0f" data-kw="">
<blockquote><p>Lastly, the question may be asked touching the daughter of a man given in marriage, the husband commandeth one thing, and the father another, whether of these is to be obeyed, the husband, or the father? I answer, the husband. For, as she must obey her husband before the father, so she is to love the husband better also, and God commandeth the man to leave father and mother and to cleave to his wife (Gen. 2:24), which is also a commandment unto the woman to leave parents, and to cleave to her husband, for they twain shall be one flesh, Mt. 19:5; Eph. 5:31; 1 Cor. 6:16: Therefore in this [latter] case the will of the husband is to be preferred before the will of the father. For as it is in the two great lights which God hath set in the firmament, the lesser evermore giveth place to the greater, and when the sun shineth, the light of the moon fadeth and vanisheth away: so when the greater authority of the husband commeth in place, the lesser power and authority of the father ceaseth. Besides, his giving of her in marriage to the husband is a giving away of his own right over her, as well as over that portion of goods which he bestoweth with her: so that now his authority is abridged, nay clean abolished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Numbers</cite>, (London, 1618), p. 1166</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-08ae58b6b6" data-kw="">
<blockquote><p>Those who search for other reasons [besides adultery for divorce] ought justly to be set at nought, because they choose to be wise above the heavenly Teacher. They† say that leprosy is a proper ground for divorce, because the contagion of the disease affects not only the husband, but likewise the children. For my own part, while I advise a religious man not to touch a woman afflicted with leprosy, I do not pronounce him to be at liberty to divorce her. If it be objected, that they who cannot live unmarried need a remedy, that they may not be burned, I answer, that what is sought in opposition to the Word of God is not a remedy. I add too, that if they give themselves up to be guided by the Lord, they will never want [lack] continence, for they follow what He has prescribed. One man shall contract such a dislike of his wife, that he cannot endure to keep company with her: will polygamy cure this evil? Another man’s wife shall fall into palsy or apoplexy, or be afflicted with some other incurable disease, shall the husband reject her under the pretense of incontinency? We know, on the contrary, that none of those who walk in their ways are ever left destitute of the assistance of the Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 19, v. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>There is no necessity that the reserve [of withholding of certain powers] be expressed in the covenant between king and people [as the Erastian, divine-right of kings advocates maintained], more than in contract of marriage between a husband and a wife, [that] beside her jointure, you should set down this clause in the contract, that if the husband attempt to kill the wife, or the wife the husband, in that case it shall be lawful to either of them to part companies.</p></blockquote>

<blockquote><p>§23. 15. In civil actions that are religious only finally, and by participation, and not any acts of special worship, it is lawful to use symbolical rites that are in their kind near of kin to sacraments in their kind, and may be called ‘civil sacraments’, such as: the sealing and delivery of indentures, or other covenant writings: and the delivery of possession of a house by a key, and of the temple by a book and bell-rope, and of land by a twig and turf; and of civil government by a crown, or scepter, or sword, etc. And such is the use of a ring in marriage. … §43. 3. And for the ring in marriage, I see no reason to scruple the lawfulness of it: For though the Papists make a sacrament of marriage, yet we have no reason to take it for any ordinance of divine worship anymore than the solemnizing of a contract between a prince and people. All things are sanctified and pure to the pure: but that does not confound the two Tables [of the Ten Commandments], nor makes all things to be parts of worship that are sanctified. The coronation of a king is sanctified as well as marriage, and is as much a sacrament as marriage, and the ceremonies of it might as well be scrupled: especially when God does seem to go before them by the example of anointing, as if He would confine them to that ceremony, which yet was none of his intent, nor is it much scrupled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, p. 406 &amp; 411</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

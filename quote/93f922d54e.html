<main class="wrap"><figure class="quote" id="q-93f922d54e" data-kw="">
<blockquote><p>3. Behold the extent of his willingness to receive sinners. The sinner sometimes says, ‘I am willing to receive Christ, but He is not willing to receive me.’ But what says the text? ‘Behold I stand at the door and knock.’ Does not this imply his readiness and willingness to come in? Nor is this all—He calls, ‘Open unto Me—open unto Me.’ Nor is this all—He says, ‘if any man hear my voice and open the door, I will come in.’ He positively declares that He is willing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/asahel-nettleton.html">Asahel Nettleton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Remains of the Late Rev. Asahel Nettleton</cite>, ed. B. Tyler (Hartford: Robins &amp; Smith, 1845), Sermon 25, ‘Christ Standing at the Door’, pp. 300-302</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ea84f799e" data-kw="">
<blockquote><p>…I only now advise every one who is kept from believing by this, that he knows not whether he be contained under the pardon or no, not to look to God’s secret will, but to attend to God’s revealed will in his Word, wherein it is expressly said that God would have no man to perish, but would have all men come to repentance [2 Pet. 3:9]; and so oft. That He desires not the death of a sinner [Eze. 18:23,32], that hereby he may be moved to seek and hope for that mercy, which God is so willing to bestow upon him, if the fault be not in his own self, as it was in the unbelieving Jews in Jerusalem, of whom our Savior complained, saying, ‘How often would I have gathered thy Children, as the Hen gathereth her Chickens under her wings, and ye would not?’ [Mt. 23:37] A further manifestation of this willingness in God to save sinners, may be seen in his gracious invitation of the unworthiest to come to the wedding of his Son [Mt. 22:2-3]: yea, more by his beseeching sinners to be reconciled to Him [2 Cor. 5:20]: and by the many and weighty arguments He uses to persuade men to believe, by the great rewards, earthly and spiritual, temporal and eternal, which all believers shall enjoy; and by the fearful woes which shall fall on all unbelievers, both in this life, and that to come, as plentifully is to be seen throughout the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-culverwell.html">Ezekiel Culverwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Faith</cite>, (1648), pp. 184-86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-f476704f37" data-kw="">
<blockquote><p>‘His strange work;’ the execution of his judgment against Israel, which He calls his strange work, to intimate either: … 2. That this work of bringing total and irrecoverable destruction upon Israel was contrary to the benignity of his own nature, and to the usual way of dealing with his people, whom He used and delighted to protect, and spare, and bless; and whom, even when He is angry with them, and punishes them, He handles more gently than He does other persons, in judgment remembering mercy to them, as was noted, Isa. 27:7-8; see also Isa. 26:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, on Isaiah 28, verse 21</span></figcaption>

</figure><figure class="quote" id="q-1609803b37" data-kw="">
<blockquote><p>Further, The inclination of thy heart towards fruitless and unprofitable creatures does fore-preach to thee the inclination of the heart of God towards thee in the Judgment: If thou hast either cow or any other beast that is now unprofitable to thee, though thou mayst suffer them for some time to be with thee, as God suffers sinners in the world, yet all this while thy heart is not with them, but thou wilt take thy time to clear thy hands of them. Why, just so shall thy judgment be as God says, ‘Though Moses and Samuel stood before Me,’ that is, to pray Me to spare this people, ‘yet my heart could not be towards them; therefore cast them out of my sight and let them go forth.’ Jer. 15:1; Eze. 14:13-14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Resurrection of the Dead, and Eternal Judgment</cite>, ... (London: Smith, 1665), p. 119</span></figcaption>

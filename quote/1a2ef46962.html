<main class="wrap"><figure class="quote" id="q-1a2ef46962" data-kw="">
<blockquote><p>[S]he brought forth without sin, without shame, without pain and without injury, just as she had conceived without sin. The curse of Eve did not come on her, where God said: “In pain thou shalt bring forth children,” Gen. 3:16; otherwise it was with her in every particular as with every woman who gives birth to a child.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/luther.html">Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon for Christmas Eve; Luke 2:1-14, tr. Geo. H. Trabert, 24 Dec. 1521; in v. 1 of Sermons of Martin Luther, The Church Postils; ed. John Nicholas Lenker, 8 vols. (Minneapolis: Lutherans of All Lands, 1904-1906)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>
<div class="actions"><button class="copy" data-copy="“[S]he brought forth without sin, without shame, without pain and without injury, just as she had conceived without sin. The curse of Eve did not come on her, where God said: “In pain thou shalt bring forth children,” Gen. 3:16; otherwise it was with her in every particular as with every woman who gives birth to a child.”

— Luther, Sermon for Christmas Eve; Luke 2:1-14, tr. Geo. H. Trabert, 24 Dec. 1521; in v. 1 of Sermons of Martin Luther, The Church Postils; ed. John Nicholas Lenker, 8 vols. (Minneapolis: Lutherans of All Lands, 1904-1906)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BS%5Dhe+brought+forth+without+sin%2C+without+shame%2C+without+pain+and+without+injury%2C+just+as+she+had+conceived+without+sin.+The+curse+of+Eve+did+not+come+on+her%2C+where+God+said%3A+%E2%80%9CIn+pain+thou+shalt+bring+forth+children%2C%E2%80%9D+Gen.+3%3A16%3B+otherwise+it+was+with+her+in+every+particular+as+with+every+woman+who+gives+birth+to+a+child.%E2%80%9D%0A%0A%E2%80%94+Luther%2C+Sermon+for+Christmas+Eve%3B+Luke+2%3A1-14%2C+tr.+Geo.+H.+Trabert%2C+24+Dec.+1521%3B+in+v.+1+of+Sermons+of+Martin+Luther%2C+The+Church+Postils%3B+ed.+John+Nicholas+Lenker%2C+8+vols.+%28Minneapolis%3A+Lutherans+of+All+Lands%2C+1904-1906%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1a2ef46962.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1a2ef46962.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-perpetual-virginity-of-mary/#:~:text=S%5Dhe%20brought%20forth%20without%20sin%2C%20without,who%20gives%20birth%20to%20a%20child&amp;text=S%5Dhe%20brought%20forth%20without%20sin%2C%20without%20shame%2C%20without&amp;text=every%20woman%20who%20gives%20birth%20to%20a%20child" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eab23cb342" data-kw="">
<blockquote><p>According to His humanity, He, Christ, our Savior, was the real and natural fruit of Mary’s virginal womb (of which Elizabeth, filled with the Holy Spirit, said to her in Luke 1:42: “Blessed is the fruit of your womb!”). This was without the co-operation of a man, and she remained a virgin after that. Everything else that a mother imparts to a child was imparted by Mary, the mother of God’s eternal Son. Even the milk He sucked had no other source than the breasts of this holy and pure mother.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on John, chs. 1-4 (1539) in ed. Jaroslav Pelikan, Luther’s Works (St. Louis: Concordia Pub. House, 1955)</cite>, 22:23-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>
<div class="actions"><button class="copy" data-copy="“According to His humanity, He, Christ, our Savior, was the real and natural fruit of Mary’s virginal womb (of which Elizabeth, filled with the Holy Spirit, said to her in Luke 1:42: “Blessed is the fruit of your womb!”). This was without the co-operation of a man, and she remained a virgin after that. Everything else that a mother imparts to a child was imparted by Mary, the mother of God’s eternal Son. Even the milk He sucked had no other source than the breasts of this holy and pure mother.”

— Martin Luther, Sermons on John, chs. 1-4 (1539) in ed. Jaroslav Pelikan, Luther’s Works (St. Louis: Concordia Pub. House, 1955), 22:23-24">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAccording+to+His+humanity%2C+He%2C+Christ%2C+our+Savior%2C+was+the+real+and+natural+fruit+of+Mary%E2%80%99s+virginal+womb+%28of+which+Elizabeth%2C+filled+with+the+Holy+Spirit%2C+said+to+her+in+Luke+1%3A42%3A+%E2%80%9CBlessed+is+the+fruit+of+your+womb%21%E2%80%9D%29.+This+was+without+the+co-operation+of+a+man%2C+and+she+remained+a+virgin+after+that.+Everything+else+that+a+mother+imparts+to+a+child+was+imparted+by+Mary%2C+the+mother+of+God%E2%80%99s+eternal+Son.+Even+the+milk+He+sucked+had+no+other+source+than+the+breasts+of+this+holy+and+pure+mother.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Sermons+on+John%2C+chs.+1-4+%281539%29+in+ed.+Jaroslav+Pelikan%2C+Luther%E2%80%99s+Works+%28St.+Louis%3A+Concordia+Pub.+House%2C+1955%29%2C+22%3A23-24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feab23cb342.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eab23cb342.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-perpetual-virginity-of-mary/#:~:text=According%20to%20His%20humanity%2C%20He%2C%20Christ,of%20this%20holy%20and%20pure%20mother&amp;text=According%20to%20His%20humanity%2C%20He%2C%20Christ%2C%20our%20Savior&amp;text=the%20breasts%20of%20this%20holy%20and%20pure%20mother" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8eccf00dfb" data-kw="">
<blockquote><p>The only clear instance they [Romanists] seem to give is touching the perpetual virginity of Mary, which they say cannot be proved by scripture, and yet is necessary to be believed. But they should know, that this is no point of Christian faith. That she was a virgin before, in and after the birth of Christ, we are bound to believe as an article of our faith, and so much is delivered in Scripture and in the Apostles Creed: but that she continued so ever after, is a seemly truth, delivered unto us by the Church of God, fitting the sanctity of the blessed Virgin and the honor due to so sanctified a vessel of Christ’s incarnation, as her body was: and so is de pietate [of piety], but not de necessitate fidei [of the necessity of faith], as the [Medieval] Schoolmen use[d] to speak. Neither was Helvidius condemned of heresy for the denial hereof, but because pertinaciously he urged the denial of it upon misconstruction of scripture, as if the denial of it had been a matter of faith. Touching this allegation of our adversaries concerning Mary’s perpetual virginity, we must know, that howsoever they pretend to hold it only by tradition, yet the Fathers that defend it against Helvidius, endeavor to prove it by the Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-field.html">Richard Field</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Church, Five Books… (Oxford, 1628), bk. 4, ch. 20, ‘Of the supposed imperfection of Scriptures, and the supply of Traditions’, p. 376. Field (1561-1616) was the next major Anglican apologist after Richard Hooker, and was no friend of the puritans.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-b48112252c" data-kw="Mary Queen of Heaven Mediator">
<blockquote><p>In brief, there is scarcely one title given to Jesus Christ, nor one which prophesies of Him, which they do not attribute to her, calling her Queen of Heaven, Porter of Paradise, their life, their sweetness, treasurer of grace, the refuge and advocate of sinners—thus dishonoring Him and also making the poor people understand that they honor her contrary to the whole Word of God and the writings of the most ancient teachers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, 1560, Point 7, §4: The Papists Abolish the True Intercession of Jesus Christ</span></figcaption>

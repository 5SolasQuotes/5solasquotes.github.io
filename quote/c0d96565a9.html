<main class="wrap"><figure class="quote" id="q-c0d96565a9" data-kw="">
<blockquote><p>…and it is most true, no man by the instinct of Nature gives consent to penal Laws as penal, for Nature does not teach a man, nor incline his spirit to yield that his life shall be taken away by the sword and his blood shed, except in this remote ground: a man has a disposition that a vein be cut by the physician, or a member of his body cut off, rather than the whole body and life perish by some contagious disease; but here reason in cold blood, not a natural disposition is the nearest prevalent cause and disposer of the business [in making such a penal law].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-a9b3ec02df" data-kw="">
<blockquote><p>4. Distinguish between the Moral, and Ceremonial, and Judicial Law: [1.] The first concerns manners, and the right ordering of a godly conversation; and because these things are of perpetual equity and rectitude, the obligation of this Law as to that is perpetual; and therefore in the expounding of it, these two terms, Moral, and of Perpetual Authority, are all one, and to be taken so. 2. The Judical Law is for regulating outward society, and for government, and does generally (excepting what was peculiar to the people of Israel) agree with the Moral Law; this as given to them is not perpetual, their policy being at an end. 3. The Ceremonial Law is in ceremonies, types, and shadows, pointing at a Savior to come; this is also abrogate[d], the substance being come; but there is this difference, that the Judicial Law is but mortua, ‘dead’; and may, where ’tis thought fit, with the foregoing caution, be used under the New Testament; but the Ceremonial Law is mortifera, ‘deadly’, and cannot without falling from grace, Gal. 5:2,4, be revived.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law Unsealed: or a Practical Exposition of the Ten Commandments</cite>, (1676), Preface, pp. 4-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>In short, our Reformers [of the Scottish Church, specifically John Knox, c. 1560] maintained: That the doctrine of defensive arms was necessary: that passive obedience or non-resistance was sinful when people had means for resistance (Knox, History, pp. 389, 396, Append. p. 25, 107, Passim.) That Daniel and his fellows did not resist by the sword because God had not given them the power and the means (Ibid., p. 317) That the primitive Christians assisted their preachers, even against the rulers and magistrates, and suppressed idolatry wheresoever God gave them force (Ibid., p. 393). (d) They maintained that the Judicial Laws of Moses (though not adopted into the Christian system) in many considerable instances continued still obligatory; particularly that the laws punishing adultery, murder, idolatry with death, were binding; that in obedience to these laws, that sentence was to be executed not only on subjects, but on sovereigns (Ibid., pp. 391-393; Passim.) That whosoever executes God’s Law, on such criminals, is not only innocent, but in his duty…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sage.html">John Sage</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fundamental Charter of Presbytery, as it has been lately Established in the Kingdom of Scotland</cite>, p. 337</span></figcaption>

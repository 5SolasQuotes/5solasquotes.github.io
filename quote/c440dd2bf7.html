<main class="wrap"><figure class="quote" id="q-c440dd2bf7" data-kw="">
<blockquote><p>In our justification in this life by faith, Christ is considered as our propitiation and advocate, as he who has made atonement for sin, and brought in everlasting righteousness; but at the last day, and in the last judgment, he is considered only as the judge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7143ae7aa4" data-kw="">
<blockquote><p>A very few words will also free our inquiry from any concernment in that which is called sentential justification, at the day of judgement; for of what nature soever it be, the person concerning whom that sentence is pronounced was, — (1.) Actually and completely justified before God in this world; (2.) Made partaker of all the benefits of that justification, even unto a blessed resurrection in glory: “It is raised in glory,” 1 Cor. xv. 43. (3.) The souls of the most will long before have enjoyed a blessed rest with God, absolutely discharged and acquitted from all their labours and all their sins; there remains nothing but an actual admission of the whole person into eternal glory. Wherefore this judgement can be no more but declaratory, unto the glory of God, and the everlasting refreshment of them that have believed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 6</span></figcaption>

</figure><figure class="quote" id="q-284b4e42df" data-kw="">
<blockquote><p>If the justification of believers is ultimately based on a future justification by works, then believers can never be assured that they are definitively and irrevocably right with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cornelis-p-venema.html">Cornelis P. Venema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tabletalk</cite>, (as posted by @Ligonier)</span></figcaption>

</figure><figure class="quote" id="q-7d87be8070" data-kw="">
<blockquote><p>This proposition, — that God pardons men their sins, gives them the adoption of children, with a right unto the heavenly inheritance, according to their works, — is not only foreign to the gospel, but contradictory unto it, and destructive of it, as contrary unto all express testimonies of the Scripture, both in the Old Testament and the New, where these things are spoken of; but that God judges all men, and renders unto all men, at the last judgment, according unto their works, is true, and affirmed in the Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 6</span></figcaption>

<div class="actions"><button class="copy" data-copy="“This proposition, — that God pardons men their sins, gives them the adoption of children, with a right unto the heavenly inheritance, according to their works, — is not only foreign to the gospel, but contradictory unto it, and destructive of it, as contrary unto all express testimonies of the Scripture, both in the Old Testament and the New, where these things are spoken of; but that God judges all men, and renders unto all men, at the last judgment, according unto their works, is true, and affirmed in the Scripture.”

— John Owen, The Doctrine of Justification by Faith, ch. 6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis%20proposition%2C%20%E2%80%94%20that%20God%20pardons%20men%20their%20sins%2C%20gives%20them%20the%20adoption%20of%20children%2C%20with%20a%20right%20unto%20the%20heavenly%20inheritance%2C%20according%20to%20their%20works%2C%20%E2%80%94%20is%20not%20only%20foreign%20to%20the%20gospel%2C%20but%20contradictory%20unto%20it%2C%20and%20destructive%20of%20it%2C%20as%20contrary%20unto%20all%20express%20testimonies%20of%20the%20Scripture%2C%20both%20in%20the%20Old%20Testament%20and%20the%20New%2C%20where%20these%20things%20are%20spoken%20of%3B%20but%20that%20God%20judges%20all%20men%2C%20and%20renders%20unto%20all%20men%2C%20at%20the%20last%20judgment%2C%20according%20unto%20their%20works%2C%20is%20true%2C%20and%20affirmed%20in%20the%20Scripture.%E2%80%9D%0A%0A%E2%80%94%20John%20Owen%2C%20The%20Doctrine%20of%20Justification%20by%20Faith%2C%20ch.%206&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7d87be8070.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7d87be8070.html">Permalink</a><a class="src" href="https://ccel.org/ccel/owen/just/just.x.html" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-8872bfd394" data-kw="">
<blockquote><p>Although pardon of sin be compleated at that great day, yet this is not to be understood, as if Gods pardon of any sin were imperfect, and something of sinne did still remain to be done away. No, those expressions of forgivenes of sin in the Scripture, denote such a full and plenary pardon, that a sin cannot be more remitted then it is. But because we commit new sinnes daily, and so need pardon daily, Therefore it is that we are not compleatly pardoned till then. As also because the perfect pardon we have here, shall then solemnly and publikely be declared to all the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification</cite>, London, 1651, Lecture 29, pp. 258–259</span></figcaption>

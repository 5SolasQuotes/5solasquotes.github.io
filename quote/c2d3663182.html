<main class="wrap"><figure class="quote" id="q-c2d3663182" data-kw="">
<blockquote><p>I now come to that which you yourself also acknowledge, that all human inventions are not at once to be condemned. For it was clearly a human invention that we communicate [in the Lord’s Supper] in the morning, rather than after dinner: and it was a human invention that the prices of things that were sold in the primitive Church were laid at the apostles’ feet… I pass over that they who defend these things will be able to put forward some honest and just meaning not alien from the Scripture… But, if by this there is given occasion of error to the weak, let them be advised to regard these things as indifferent; let them be taught by sermons, not to judge the worship of God as placed in these things… Neither do I think that tyranny is instantly brought in if any indifferent thing be appointed to be done in the Church and be constantly performed by many. At this day we so administer the Eucharist in the morning time, that after dinner we will not have the communion in the sacred assembly [In the New Testament the Eucharist was always administered in the evening]. But who will say, that this, which we all do with the like will and consent is tyrannical? To myself truly, as I have now often mentioned, it would be more agreeable that we should only do what Christ did and delivered to his apostles. But, if any indifferent things have been added, I would not now sharply strive on this account; especially when we see that they by whom the light of the Gospel has been greatly promoted in England, and can be yet more promoted, oppose themselves to us. I acknowledge indeed with you that ‘whatsoever is not of faith is sin.’ (Rom. 14:23). But what the apostle wrote to Titus seems, above all things, to promote our having a quiet conscience in our actions: ‘Unto the pure all things are pure;” and to Timothy, “Every creature of God is good.” But it is not necessarily required that we should show express mention in holy Scripture of the particular things which we use: this is enough to know by faith, on the whole— that indifferent things cannot defile those who live with a pure and sincere mind and conscience… but I yet thought that the use of these differences was not in itself or its own nature ungodly or of fatal consequence, provided other things which are prescribed to us by the Word of God remain sound.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gorham, Gleanings of a few scattered ears during the period of the Reformation in England (London, 1857), Letter 53, ‘Martyr to Bishop [John] Hooper’, Nov. 4, 1550</cite>, pp. 189-90, 92, 94-96</span></figcaption>

<blockquote><p>42nd Question, How Moses was contented with Aaron’s Answer. 1. He did not absolutely approve of his reason, as though he had done it intuita divino, by divine direction, as Cajetan: for Moses was better acquainted with God’s mind than Aaron, and there was a direct commandment, which should not have been omitted. 2. But Moses rather in human commiseration bears with Aaron’s infirmity: 1. because he saw him forced by a kind of necessity… 2. and afflication was not to be added to affliction, Osiander: and Moses found it to be of less fault than he supposed, Calvin: he did it not willingly, but of human frailty and of perplexity through grief, and therefore was to be pitied. 3. And it may be Moses deferred his further admonishing of Aaron till another time because he saw now he was in grief…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Leviticum, that is, A Sixfold Commentary upon the Third Book of Moses, called Leviticus… (London, 1631), on Lev. 10</cite>, pp. 197-98</span></figcaption>

</figure><figure class="quote" id="q-d4fd6b8c0f" data-kw="">
<blockquote><p>The scribes and Pharisees in the days of our Savior said but did not; laid heavy burdens on the people, which themselves would not touch with one of their fingers… yet the Lord Himself, who reproved them, heard them and charged his disciples to hear them, because they sat in Moses’s seat. Let it be observed and remembered: the authority may, but the quality of the minister does not add to or abstract from the entity or efficacy of God’s ordinances; he may preach to my salvation who is himself a castaway.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church… in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland.</cite>, p. 16</span></figcaption>

</figure><figure class="quote" id="q-749f5e1772" data-kw="">
<blockquote><p>Remember that whatever duty you seem obliged to perform, the obligation still supposes that it is not naturally impossible to you, and therefore you are bound to do it as well as you can. And when other men’s force or your natural disability hinders you from doing it as you would, you are not therefore disobliged from doing it at all: but the total omission is worse than the defective performance of it, as the defective performance is worse than doing it more perfectly.ª And in such a case the defects which are utterly involuntary are none of yours imputatively at all, but his that hinders you (unless as some other sin might cause that). ª See Mr. [Joseph] Truman’s book of Natural and Moral Impotency. As if I were in a country where I could have liberty to read and pray, but not to preach, or to preach only once a month and no more: It is my duty to do so much as I can do, as being much better than nothing, and not to forbear all because I cannot do all. Objection: But you must forbear no part of your duty. Answer: True, but nothing is my duty which is naturally impossible for me to do. Either I can do it, or I cannot: If I can, I must (supposing it a duty in all other respects); but if I cannot, I am not bound to it. … Direction 14. Remember that no material duty is formally a duty at all times: that which is a duty in its season is no duty out of season. Affirmative precepts bind not to all times (except only to habits [inward dispositions] or the secret intention of our ultimate end, so far as is sufficient to animate and actuate the means while we are waking and have the use of reason.. Praying and preaching, that are very great duties, may be so unseasonably performed as to be sins: If forbearing a prayer or sermon or sacrament one day or month be rationally like to procure your help or liberty to do it afterward, when that once or few times doing it were like to hinder you from doing it anymore, it would be your duty then to forbear it for that time (unless in some extraordinary case): For even for the life of an ox or an ass, and for mercy to men’s bodies, the rest and holy work of a Sabbath might be interrupted: much more for the souls of many. Again I warn you, as you must not pretend the interest of the end against a peremptory absolute command of God, so must you not easily conclude a command to be absolute and peremptory to that which certainly contradicts the end: nor easily take that for a duty which certainly is no means to that good which is the end of duty or which is against it. Though yet no seeming aptitude as a means must make that seem a duty which the prohibition of God has made a sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory... (London: White, 1673), pt. 3, ch. 2, sect. 24, direction 13</cite>, pp. 685-86</span></figcaption>

— Richard Baxter, A Christian Directory... (London: White, 1673), pt. 3, ch. 2, sect. 24, direction 13, pp. 685-86">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CRemember+that+whatever+duty+you+seem+obliged+to+perform%2C+the+obligation+still+supposes+that+it+is+not+naturally+impossible+to+you%2C+and+therefore+you+are+bound+to+do+it+as+well+as+you+can.+And+when+other+men%E2%80%99s+force+or+your+natural+disability+hinders+you+from+doing+it+as+you+would%2C+you+are+not+therefore+disobliged+from+doing+it+at+all%3A+but+the+total+omission+is+worse+than+the+defective+performance+of+it%2C+as+the+defective+performance+is+worse+than+doing+it+more+perfectly.%C2%AA+And+in+such+a+case+the+defects+which+are+utterly+involuntary+are+none+of+yours+imputatively+at+all%2C+but+his+that+hinders+you+%28unless+as+some+other+sin+might+cause+that%29.+%C2%AA+See+Mr.+%5BJoseph%5D+Truman%E2%80%99s+book+of+Natural+and+Moral+Impotency.+As+if+I+were+in+a+country+where+I+could+have+liberty+to+read+and+pray%2C+but+not+to+preach%2C+or+to+preach+only+once+a+month+and+no+more%3A+It+is+my+duty+to+do+so+much+as+I+can+do%2C+as+being+much+better+than+nothing%2C+and+not+to+forbear+all+because+I+cannot+do+all.+Objection%3A+But+you+must+forbear+no+part+of+your+duty.+Answer%3A+True%2C+but+nothing+is+my+duty+which+is+naturally+impossible+for+me+to+do.+Either+I+can+do+it%2C+or+I+cannot%3A+If+I+can%2C+I+must+%28supposing+it+a+duty+in+all+other+respects%29%3B+but+if+I+cannot%2C+I+am+not+bound+to+it.+%E2%80%A6+Direction+14.+Remember+that+no+material+duty+is+formally+a+duty+at+all+times%3A+that+which+is+a+duty+in+its+season+is+no+duty+out+of+season.+Affirmative+precepts+bind+not+to+all+times+%28except+only+to+habits+%5Binward+dispositions%5D+or+the+secret+intention+of+our+ultimate+end%2C+so+far+as+is+sufficient+to+animate+and+actuate+the+means+while+we+are+waking+and+have+the+use+of+reason..+Praying+and+preaching%2C+that+are+very+great+duties%2C+may+be+so+unseasonably+performed+as+to+be+sins%3A+If+forbearing+a+prayer+or+sermon+or+sacrament+one+day+or+month+be+rationally+like+to+procure+your+help+or+liberty+to+do+it+afterward%2C+when+that+once+or+few+times+doing+it+were+like+to+hinder+you+from+doing+it+anymore%2C+it+would+be+your+duty+then+to+forbear+it+for+that+time+%28unless+in+some+extraordinary+case%29%3A+For+even+for+the+life+of+an+ox+or+an+ass%2C+and+for+mercy+to+men%E2%80%99s+bodies%2C+the+rest+and+holy+work+of+a+Sabbath+might+be+interrupted%3A+much+more+for+the+souls+of+many.+Again+I+warn+you%2C+as+you+must+not+pretend+the+interest+of+the+end+against+a+peremptory+absolute+command+of+God%2C+so+must+you+not+easily+conclude+a+command+to+be+absolute+and+peremptory+to+that+which+certainly+contradicts+the+end%3A+nor+easily+take+that+for+a+duty+which+certainly+is+no+means+to+that+good+which+is+the+end+of+duty+or+which+is+against+it.+Though+yet+no+seeming+aptitude+as+a+means+must+make+that+seem+a+duty+which+the+prohibition+of+God+has+made+a+sin.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory...+%28London%3A+White%2C+1673%29%2C+pt.+3%2C+ch.+2%2C+sect.+24%2C+direction+13%2C+pp.+685-86&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F749f5e1772.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/749f5e1772.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Remember%20that%20whatever%20duty%20you%20seem,of%20God%20has%20made%20a%20sin&amp;text=Remember%20that%20whatever%20duty%20you%20seem%20obliged%20to&amp;text=the%20prohibition%20of%20God%20has%20made%20a%20sin" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

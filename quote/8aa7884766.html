<main class="wrap"><figure class="quote" id="q-8aa7884766" data-kw="">
<blockquote><p>There is a twofold ministerial power: 1. Potestas ordinis, which consists merely in preaching the Word and administring the sacraments. 2. Jurisdictionis, whereby they govern in the Church, by binding the impenitent and losing the penitent.¹ ¹ …’Discipline’ is used sometimes largely, so as it extends to all rule and order, appointed or left for the right managing of the things of God, or strictly for the censures of the Church. So there may be a true Church without discipline. The Helvetians and those of Switzerland have no suspension [from the Table or Church] at all, but what offences other Churches suspend for the civil magistrate punishes other way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, ... (London: A.M., 1654), bk. 6, ch. 3, ‘Of Ecclesiastical Jurisdiction &amp; Government’</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3586497a7a" data-kw="">
<blockquote><p>…there is a twofold necessity; one absolute, the other conditional. Absolute, that is, when one thing is so necessarily required to another, as that it cannot be without it. Secondly, there is a necessity that is not absolute, but conditional; that is, when one thing is so necessary to another as that it cannot well be without it: of this latter sort, the necessity of this government in the Church of God is: for the Church may be without it in some kind of being, but it cannot have her well-being except this concur.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church</cite>, … (London, 1631), Lecture 14 Randall (1570–1622) was an English puritan who held that the particular form of Church government is not by divine-right., p. 235</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><figure class="quote" id="q-73a9ff7cc5" data-kw="invisible church">
<blockquote><p>That the statement of this most vexed question may be rightly exhibited, the origin of the controversy must be inquired into. The Romanists suppose that the church was called invisible by us in order to satisfy the question asked of us by them—where our church was before Luther. Since we could not show that our church was perpetually visible in the world, we excogitated this distinction—that the visible church is one thing, the invisible another. But they interpret our opinion falsely. For even if our church had been as large and conspicuous formerly as it is now, still we would say that the catholic church is nonetheless invisible. Is the true church rightly said to be invisible? We affirm against the Romanists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.7.1</span></figcaption>

</figure><figure class="quote" id="q-5eb1da003c" data-kw="">
<blockquote><p>III. …the church can be regarded either as to its external or its internal state. The external answers to the external call by the Word, upon which depends the external form of the church, placed in a profession of faith or an external and sensible communion of the same sacred things… The question [Turretin addresses] is not whether the reprobate belong to the external state (which we do not deny)…</p></blockquote>

<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>

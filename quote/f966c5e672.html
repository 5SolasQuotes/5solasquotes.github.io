<blockquote><p>Secondly, Those who have not as yet received Christ to dwell in them are to be moved, as they desire Heaven’s glory hereafter and the comfortable hopes of it here upon earth, to give entertainment unto Jesus Chist. Zacchaeus upon a hint given of Christ’s willingness to come into his house, comes down out of the sycamore tree quickly, and receives him joyfully (Lk. 19:4). Now do you with seriousness consider with what 1. importunity, 2. patience, 3. and promises the Lord Jesus calls upon you for entertainment. ‘Behold, I stand at the door and knock, if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ (Rev. 3:20)</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13bbb190bd" data-kw="">
<blockquote><p>20. ‘Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ 20. I have my time of offering mercy, and desiring you to entertain it: And if any man hear and obey this call, I will come in by my Spirit, and take habitual possession of him, and have spiritual communion with him, and he with Me. Note: Though it be not without the grace of Christ that we open to him when He knocks, and receive his offered special grace, yet, in this, He lays so much on man as to make our opening, that is, our accepting-faith, the condition of his entering for a fixed habitation by habitual love and holiness. On which account divines used to say that faith and repentance, wrought first in conversion, are the conditions or qualifications for consequent justification and sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Paraphrase on the New Testament with Notes, Doctrinal &amp; Practical</cite>, ... (1685), on Rev. 3, verse 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“20. ‘Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ 20. I have my time of offering mercy, and desiring you to entertain it: And if any man hear and obey this call, I will come in by my Spirit, and take habitual possession of him, and have spiritual communion with him, and he with Me. Note: Though it be not without the grace of Christ that we open to him when He knocks, and receive his offered special grace, yet, in this, He lays so much on man as to make our opening, that is, our accepting-faith, the condition of his entering for a fixed habitation by habitual love and holiness. On which account divines used to say that faith and repentance, wrought first in conversion, are the conditions or qualifications for consequent justification and sanctification.”

</figure><figure class="quote" id="q-a541e35fe4" data-kw="">
<blockquote><p>Therefore it’s his voice or word that not only calls, but knocks, implying some force it had upon her: By voice is understood the Word, as Chap. 2:8,10, yet, as backed with the Spirit and power, and as commended thereby to the conscience, 1 Cor. 2:4, and convincingly demonstrated to be the very voice of Christ; yet, so as rods inward and outward, and other means may have their own place, being made use of by Him, yet still according to the word. His great end [purpose] for which he knocks, is in that word open; which, as it implies her case, that her heart was in a great measure shut upon Him, and that by some carnal indisposition He was kept out of it, and was not made welcome; So it requires the removing of all that stopped his way, and the casting open of the heart by faith to receive his Word, and by love to receive Himself… … This opening then, imports the removing of every thing that marred fellowship with Christ, and the doing of every thing that might dispose for enjoying of it, as awaking, rising, etc. all which follows in the 4th verse, and while He commands to open, He calls for the entertaining of fellowship with Him, which now is by her drowsiness interrupted: Which two parts of the verse put together, hold forth, 1. That Christ’s own Bride may shut the door on him, and so make a sad separation betwixt him and her. 2. Christ’s word is the great and ordinary external mean, whereby he knocks at men’s hearts, and which he makes use of for begetting faith in them. 3. That in a believers secure condition, there will be sometimes more than ordinary convictions, stirrings and motions by the Word. 4. That the Word of God, backed with power, will reach the securest heart and affect it. 5. That believers will discern Christ’s voice and call, when their condition is very low. 6. It will be refreshful to them to have Him knocking; she looks on it as a kindly thing, even to have his knock bearing-in convictions, challenges, or somewhat else on her; though it please not her flesh, yet in as far as she is renewed, it will be the voice of her Beloved to her. 7. Christ has a way of following his own, even when they are become secure; and sometimes then, will make his call, challenges or convictions pursue more hotly and pressingly than at other times. 8. When Christ knocks and presses hardest, it’s for our own good, and it’s a token of love in Him to do so; for, there is nothing more deplorable, than when He says to one under indisposition, and in an evil case, ‘Let him alone.’ 9. When Christ calls by his Word, it is then our duty to open to him, and to receive him; and this can no more be slighted without sin, than prayer, mortification and other commanded duties; can be neglected or slighted without sin. 10. Christ may call very pressingly, and his Word may have some work on the conscience and affections of hearers, and they be some-way affected with it, and yet the Word be rejected, and the heart not made open to Christ; as here she sleeps still notwithstanding; and the following verse confirms it. 11. There are some operations of the Spirit, which though they be more than a common work on the generality of hearers, yet are not saving, and may be, and often are, even by believers frustrated for a time, and by others for ever; for, this knocking gets a refusal, verse 3. So deceiving, beguiling and dangerous are common motions to rest on, when the finger of gracious Omnipotency is not applied, as verse 4. 12. Christ’s design when He knocks fastest, is friendly, and yet it sometimes says things are not right: This is the end of all his knocking and speaking to a people, and then it is plainest when He speaks most powerfully.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Song of Solomon</cite>, 5:2, “I sleep, but my heart waketh: it is the voice of my beloved that knocketh, saying, Open to me, my sister, my love, my dove, my undefiled: for my head is filled with dew, and my locks with the drops of the night.”</span></figcaption>

<blockquote><p>By the name of ‘door‘ [in Rev. 3:20], he means man’s heart. That does the Lord knock at by the preaching of his Word, crying out and bearing witness of the force and effectualness of it to our spirit. And the same preaching is never fruitless. For the godly receive comfort by it, and the ungodly are condemned by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kaspar-megander.html">Kaspar Megander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Augustine Marlorate, A Catholic Exposition upon the Revelation of St. John (1574), ch. 3, pp. 69-70 Megander (1495–1545) was a Swiss reformer who assisted Zwingli.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“By the name of ‘door‘ [in Rev. 3:20], he means man’s heart. That does the Lord knock at by the preaching of his Word, crying out and bearing witness of the force and effectualness of it to our spirit. And the same preaching is never fruitless. For the godly receive comfort by it, and the ungodly are condemned by it.”

<blockquote><p>3. The wooings of Christ to gain your hearts: Consider Him bowing the heavens and coming down, and laying aside his robes of majesty, and putting on your filthy garments: Consider Him going about from place to place, on no other errand, but to gain your hearts and win your souls: And, whoever spake such effectual words as Christ spake when He was upon the earth? Who ever gave such precious jewels to a bride, as Christ gave to his spouse? Who ever put on such apparel as Christ did, when He wooed his Church?… Ah! poor Sinners, see your Jesus hanging on the cross, dropping out his last blood, breathing out his last breath, stretching out his dying arms to encircle sinners; and come, Oh come and throw yourselves into his bleeding arms! Away with all prejudicate opinions! Who shall say Christ is not willing to save him, and not blaspheme eternal love? Speak truth: Corrupt hearts speak truth; say not Christ is unwilling, but you are unwilling; ‘I would, but ye would not.’ [Mt. 23:37] 4. The weepings of Christ if He cannot prevail. Thus we find Him in the Gospel expressing Himself, not only in words, but in tears. And when He was come near Jerusalem, He beheld the city, and wept over it, Lk. 19:41… What? Christ to weep for you, over you? Methinks, if you had hearts of stone, it should melt your hearts.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-058361cce0" data-kw="passive first moment">
<blockquote><p>Rather the question concerns the first moment when he is converted and receives new life by regeneration. We contend that he is merely passive in this, as a receiving subject and not as an acting principle. Again, the question is not whether man is able to convert himself without grace. Rather the question is whether he is able to cooperate with that exciting grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.5.2–3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/god-alone.html">God Alone</a> › <a href="../topics/regeneration/god-alone/man-passive-in-regeneration.html">Man passive in regeneration</a></span><span class="t"><a href="../topics/regeneration/god-alone.html">God Alone</a> › <a href="../topics/regeneration/god-alone/monergism.html">Monergism</a></span><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a> › <a href="../topics/regeneration/nature-of-regeneration/new-birth.html">New birth</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2504f5db98" data-kw="new heart Spirit">
<blockquote><p>Hence while he suggests pious thoughts to man (2 Cor. 3:5), he causes man also to consider his own way (Prov. 16:9; Hag. 1:5); while he gives a new heart and puts a new spirit within us, he makes us also to walk in his commandments (Ezk. 36:27); while he works in us both to will and to do, he sees to it that we ourselves also work out our own salvation with fear and trembling (Phil. 2:12, 13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.4</span></figcaption>

</figure><figure class="quote" id="q-0985b8d1c9" data-kw="">
<blockquote><p>As God raised Christ from the dead and set him at his own right hand in heavenly places; so you, that were dead in sins, hath he quickened and raised you up together in him. This analogy is the very thing he would have them understand. They had undergone a great change; they had been brought to life; they had been raised from the dead by the same almighty power which wrought in Christ. There was as great a difference between their present and their former condition, as between Christ in the tomb and Christ at the right hand of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Epistle to the Ephesians</cite>, on 1:19–20</span></figcaption>

</figure><figure class="quote" id="q-f4e6a838b4" data-kw="">
<blockquote><p>The heart in Scripture is that which thinks, feels, wills, and acts. It is the soul; the self. A new heart is, therefore, a new self, a new man. It implies a change of the whole character. It is a new nature. Out of the heart proceed all conscious, voluntary, moral exercises. A change of heart, therefore, is a change which precedes these exercises and determines their character. A new heart is to a man what goodness is to the tree in the parable of our Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, pt. 3, ch. 15, “Regeneration,” “A New Heart”</span></figcaption>

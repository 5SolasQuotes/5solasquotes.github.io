<blockquote><p>DR BEGG ON THE MINISTRY

The Rev Dr Begg presided at the induction on Wednesday of the Rev Dr Tho[ma]s Smith to the Chair of Evangelistic Theology in the New College, Edinburgh, and, in the course of an address on the subject of theological teaching, took occasion to ask, why were the professed ministers of Christ respected in this country?

He replied that it was because, from the days of Knox, a large number of them were cordially respected still; even when men had little regard for their principles. But let the professed ministers of Christ assume a largely different character – let them become mere spiritual showmen and players upon the ecclesiastical stage, entering upon their office by perjury, and making their whole official lives a living lie – and they should soon see a mighty change.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Witness</cite>, 22 October 1880.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-546bb150af" data-kw="">
<blockquote><p>Presbyterians, while repudiating the principle which has been so much abused by Papists, and even by prelatists, of the authority of the church to decree rites and ceremonies, do not run into the opposite extreme, as some have done, of throwing aside all regard to the light of nature and Christian prudence in regulating some circumstances concerning the worship of God and the government of the church, which are common to human actions and societies, and which a regard to decency and order, to general comfort and convenience, may require to be regulated.

The principles of Presbyterians upon this subject have been much misunderstood and misrepresented, and have been assailed from two opposite sides. The defenders of rites and ceremonies, and of the church’s authority to decree them, have endeavoured to pour contempt upon the principles of Presbyterians in this matter, by representing them as seeking an express warrant in the word for every circumstance connected in any way with the government and worship of the church, and allowing nothing whatever to be regulated by the light of nature and Christian prudence.

The second book of [Richard] Hooker’s Ecclesiastical Polity is entirely directed against this erroneous and exaggerated view of the Presbyterian principle; and though Thomas Cartwright, against whom chiefly the Ecclesiastical Polity was written, and who is there usually designated as “T. C.,” may have laid himself open to Hooker’s attack by some rash and unqualified statements upon this point, yet I am persuaded that, upon the whole, Hooker did not represent with perfect fairness the sentiments of his opponents upon this subject; and at any rate it is manifest that the great general principle, with the limitation and modification contained in the clause of the [Westminster] Confession we are at present considering, and introduced no doubt for this very purpose, escapes entirely from the range of Hooker’s argument.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture XL, pp 494-95.</span></figcaption>

<blockquote><p>XXI… Rulers have authority to command that which is good, though not in a faulty manner; and when we cannot do the good without the faulty manner, it is their fault and not ours: e.g. If an inconvenient time, place, text, tune, etc. be chosen, the union and concord which is held by agreeing in those modes is necessary: He that will not join in them cannot join in the worship. So that we obey the ruler or guide as a determiner of the means of concord, which is necessary, and not sub ratione erroris [under the rule of the error], [we do not obey and perform the action formally] as misdetermining, though [we do the action] in that which is [materially] misdetermined…º And it’s to us a lawful circumstance, because [it is] necessary to concord and [is] commanded, though mistakingly. XXII. We [nonconformists] never held it unlawful to join with a Church or minister that has some faults, both personal and in their acts of worship, as if all that joined were guilty of all the faults there committed: No not though we knew before hand that some false doctrine would be uttered or fault committed: Else we must separate from all the world, and all [people must separate] from us. … XXIV. We never judged needless affected singularity a duty, but judge it best in lawful things for concord’s sake to conform to the custom of the Churches where we live or come.</p></blockquote>

</figure><figure class="quote" id="q-27d1b45792" data-kw="">
<blockquote><p>Reform your own lives and conversations; for how reasonable is it that you who make laws that others do not swear, you your selves should not? how fit is it that you who bind others to the keeping of the Sabbath, you your selves should sanctify it? And this again did undo Jehu, that although he pulled down Baal, yet he did not reform himself from Jeroboam’s sins: lege historiam ne fias historia, read the history of Jehu, lest thou thy self be made such an history to others.

Oh therefore let it be true of thee, that since thou hast been labouring in this public Reformation, thou hast been more holy, thou hast been more pure: Thou that hast endeavoured to make way for Christ in the Church and State, hast much more made way for him in thy own family: What will it profit to have holy Ordinances, holy Worship, if we our selves still remain unholy?</p></blockquote>

<blockquote><p>(3) [‘Regeneration’ as taken] Most Strictly: For the Grace proper only to those who attain salvation in the work itself, and therefore for the donation of habitual faith, by which we apprehend the blood of Christ, our hearts are purified from dead works to serve the Living God. Heb. 9:14, i.e., by which our intellect, so evil from our youth, Gen. 8, is illuminated to know Christ, John 17:3, ‘And this is eternal Life.’ etc. Our will, so perverse, is so corrected that it rests in Christ alone. Ps. 73:25. Phil. 3 from v. 7 to v. 12 inclusive: ‘What things were gain to me, those I counted loss for Christ.’ Also v. 12, ‘Apprehended by Christ, that I may apprehend.’ In one Word: By which a man who before was plainly dead, is perfectly brought from spiritual death into spiritual life, Eph. 2:1, ‘And you He made alive, who were dead in trespasses and sins.’ Also vv. 5 &amp; 6. To this regeneration we [Grebenitz et al.] attribute, with the excellent Mr. President [Samuel Strimesius], operating grace. It is otherwise called conversion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/elias-grebenitz.html">Elias Grebenitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Treatise on Regeneration in Three Disputations</cite>, [&amp; on Conversion &amp; Preparation]’ trans. AI (Becman, 1671), Disputation 1, ‘On Regeneration in General’, p. 7 Grebenitz (1627-1689) was a German reformed professor of logic, metaphysics and theology at Frankfurt.</span></figcaption>

0e68b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7f4e0e68b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=3%29%20%5B%E2%80%98Regeneration%E2%80%99%20as%20taken%5D%20Most%20Strictly,grace.%20It%20is%20otherwise%20called%20conversion&amp;text=3%29%20%5B%E2%80%98Regeneration%E2%80%99%20as%20taken%5D%20Most%20Strictly%3A%20For%20the&amp;text=Strimesius%5D%2C%20operating%20grace.%20It%20is%20otherwise%20called%20conversion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9dbf374903" data-kw="">
<blockquote><p>‘Born again’. Being turned unto God by true faith and repentance: A metaphorical term. We are born again four ways:

1. Sacramentally, by Baptism.

2. Spiritually, by the Word.

3. Corporally, in the Resurrection.

4. Eternally, in our Glorification. Question: But why is our repentance likened to a new birth? Answer: [1] To distinguish true repentance, from that which is false and fained: for it imports five differences. …

2. That in true repentance there is a total change in the whole nature of man: He has grace in every part; a new mind and a new heart, a new memory, and a new conscience, a new language, and a new carriage both to God and man: for birth is the producing of all essential parts of man.

3. That in true repentance there is the pain of contrition, a broken spirit, the throws and pains of travail, there is true godly sorrow and grief in the birth of grace.

4. That there is in true repentance a daily hunger and thirst after the sincere milk of the Word, 1 Pet. 2:2.

5. That in the things of God’s Kingdom there is new life, and sense, and feeling, and motion. Secondly, to show the privilege of the penitent: for it signifies he gets more by his new birth than any child in nature can do by pleading his birthright: For if in repentance we be born unto God, then it shows:

1. That we have received power to be the sons of God, Jn. 1:2.

2. That with our adoption we enjoy the privileges of sons.

1. The favor of God, as a father.

2. The care of God to maintain us, Mt. 6:33.

3. The pardon of God in saving us from condemnation, Rom. 8:1.

4. The portion of God, even the inheritance which God gives as a Father, which is spoken of Rom. 8:17; Gal. 4:7. The use should be twofold: 1. That wee try ourselves carefully in the businesse of our repentance by the former signes:* 1.2 and secondly, that we comfort ourselves in the privileges of our new birth, rejoicing in our portion, and the favor of our heavenly Father. And thus of the reason of the phrase. Concerning the new birth, here we have occasion to consider of two things: 1. That it is needful often to be remembered of the doctrine of regeneration: the apostle having spoken of it before, falls upon it here again.</p></blockquote>

<blockquote><p>…so this [spiritual] life is begun by a union between us and Christ: He lives in us by his Spirit, and we live in Him by faith, Gal. 2:20. The Spirit is the principle of life, and faith is the means to receive it; and therefore we are said, Rom. 6:5, to be planted into the likeness of Christ’s resurrection. Planting notes a union, as a bud that is put into a stock; it becomes one with the stock, and bears fruit by virtue of the life of the stock. We no sooner are planted into Christ, but we feel the power of his life, and virtue of his resurrection; He begins to live in us, and we in him, as the graft in the stock, and as the stock in the graft.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ebc99aad94" data-kw="">
<blockquote><p>If any one saith, that the justice received is not preserved and also increased before God through good works; but that the said works are merely the fruits and signs of Justification obtained, but not a cause of the increase thereof; let him be anathema.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/council-of-trent.html">Council of Trent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Decree on Justification</cite>, sess. 6, can. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a1be15d456" data-kw="">
<blockquote><p>That such grace cannot be obtained either ex condigno or ex congruo by the merits of works done by the powers of free will alone, we taught against the Pelagians in Book 5 of De Gratia et Libero Arbitrio. Again, that the same grace cannot be obtained ex condigno, but only ex congruo, by the merits of works proceeding from faith and the special help of God, we taught in Book 1 of De Justificatione, chapter 21. … Finally, that a just man can merit ex condigno an increase of righteousness, the Council of Trent teaches, Session 6, canon 32.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.21 (translated from the Latin)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><figure class="quote" id="q-fb00224ded" data-kw="">
<blockquote><p>No one can merit the initial grace which is at the origin of conversion. Moved by the Holy Spirit, we can merit for ourselves and for others all the graces needed to attain eternal life, as well as necessary temporal goods.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §2027</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>
<div class="actions"><button class="copy" data-copy="“No one can merit the initial grace which is at the origin of conversion. Moved by the Holy Spirit, we can merit for ourselves and for others all the graces needed to attain eternal life, as well as necessary temporal goods.”

</figure><figure class="quote" id="q-fd1c7f51b5" data-kw="">
<blockquote><p>According to the view of the Scotists and the Nominalists, the reason for the meritoriousness of good works lies exclusively in God’s free acceptance so that God could have accepted as merit and rewarded with everlasting life merely naturally good works. According to the better-founded Thomistic view, the ground of the meritoriousness lies also in the intrinsic value of good works performed in the state of grace. The state of grace effects an inner equivalence (meritum de condigno) between the good actions and the eternal reward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-ott.html">Ludwig Ott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fundamentals of Catholic Dogma</cite>, bk. 4, pt. 1, sec. 2, §24, 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-condignity.html">Merit of condignity (de condigno)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>
<div class="actions"><button class="copy" data-copy="“According to the view of the Scotists and the Nominalists, the reason for the meritoriousness of good works lies exclusively in God’s free acceptance so that God could have accepted as merit and rewarded with everlasting life merely naturally good works. According to the better-founded Thomistic view, the ground of the meritoriousness lies also in the intrinsic value of good works performed in the state of grace. The state of grace effects an inner equivalence (meritum de condigno) between the good actions and the eternal reward.”

— Ludwig Ott, Fundamentals of Catholic Dogma, bk. 4, pt. 1, sec. 2, §24, 3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAccording%20to%20the%20view%20of%20the%20Scotists%20and%20the%20Nominalists%2C%20the%20reason%20for%20the%20meritoriousness%20of%20good%20works%20lies%20exclusively%20in%20God%E2%80%99s%20free%20acceptance%20so%20that%20God%20could%20have%20accepted%20as%20merit%20and%20rewarded%20with%20everlasting%20life%20merely%20naturally%20good%20works.%20According%20to%20the%20better-founded%20Thomistic%20view%2C%20the%20ground%20of%20the%20meritoriousness%20lies%20also%20in%20the%20intrinsic%20value%20of%20good%20works%20performed%20in%20the%20state%20of%20grace.%20The%20state%20of%20grace%20effects%20an%20inner%20equivalence%20%28meritum%20de%20condigno%29%20between%20the%20good%20actions%20and%20the%20eternal%20reward.%E2%80%9D%0A%0A%E2%80%94%20Ludwig%20Ott%2C%20Fundamentals%20of%20Catholic%20Dogma%2C%20bk.%204%2C%20pt.%201%2C%20sec.%202%2C%20%C2%A724%2C%203&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffd1c7f51b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fd1c7f51b5.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-5444a34f69" data-kw="">
<blockquote><p>So then, we do good works, but not for merit— for what would we merit? Rather, we are indebted to God for the good works we do, and not God to us, since God “is at work in [us], enabling [us] both to will and to work for his good pleasure” (Phil. 2:13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belgic Confession</cite>, Art. 24</span></figcaption>

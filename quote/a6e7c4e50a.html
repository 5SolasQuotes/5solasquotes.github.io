<main class="wrap"><figure class="quote" id="q-a6e7c4e50a" data-kw="">
<blockquote><p>By this method (as I have before observed) the dishonesty of those men is sufficiently rebuked, who censure Moses for not speaking with greater exactness. For as it became a theologian, he had respect to us rather than to the stars. Nor, in truth, was he ignorant of the fact, that the moon had not sufficient brightness to enlighten the earth, unless it borrowed from the sun; but he deemed it enough to declare what we all may plainly perceive, that the moon is a dispenser of light to us. That it is, as the astronomers assert, an opaque body, I allow to be true, while I deny it to be a dark body. For, first, since it is placed above the element of fire, it must of necessity be a fiery body.† Hence it follows, that it is also luminous; but seeing that it has not light sufficient to penetrate to us, it borrows what is wanting from the sun.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 1:15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><figure class="quote" id="q-1c5719e6b4" data-kw="Private spirit">
<blockquote><p>I answer, first, that we do not send any one who is in doubt on any matter to his private spirit, neglecting all means of finding truth, as the Jesuit falsely objects to us; but to scripture itself, and the Holy Spirit speaking publicly in the scripture, who, we say, ought to be heard, and by whose authority we maintain that all controversies should be decided: which also was the very thing done in this council.</p></blockquote>

</figure><figure class="quote" id="q-63559a9ac2" data-kw="Scripture interprets Scripture">
<blockquote><p>Whatever, then, the papists talk so vauntingly of fathers and of councils, yet it is to their ecclesiastical prince, that is to the pope, that all controversies are finally referred, and with that prince and supreme interpreter rests the whole meaning of scripture and the right of adjudicating upon it. But we do not acknowledge that prince, whom Christ never constituted; and we say that the scripture itself publicly set forth and propounded is its own interpreter.</p></blockquote>

</figure><figure class="quote" id="q-727be13c5c" data-kw="">

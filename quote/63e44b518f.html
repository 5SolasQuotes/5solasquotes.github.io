<blockquote><p>Verse 12: Friend, how camest? etc.: Not wretch, rebel, reprobate. Hard reproofs administered in soft language break the bones.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eae6011327" data-kw="">
<blockquote><p>There is no part of religion which Satan does not endeavor to destroy under pretense of promoting it: and his way is to overgo Christ and his apostles, and to seem more zealous than ever they were, and to mend their work by doing it better or doing more… Satan has always two ways to destroy both truth and duty: The first is by direct opposing it; But when that will not do, the next is by overdoing and pretending to defend it… If he cannot destroy faith by open infidelity, he will try to make men believe too much, by making the objects of their own belief and calling that a particular faith, and altering God’s Word and casting away the reasons and evidences of faith, to show the strength and nobleness of their faith, which needs no such helps as these; till by over-doing they have raised their edifice in the air and rejected their foundations, and put out their eyes in honor of the sun, and of their physician, lest either of them should be accused as insufficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 57</cite>, pp. 270-71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-dcd0422f7c" data-kw="">
<blockquote><p>I may say as Augustine did, though a good conscience be sufficient for myself, yet a good name is necessary for others; a good name is as precious ointment, yet there will not be wanting many flying reports to corrupt it; many are the obloquies and reproaches which by the sons of slander are cast upon me, they would fain have my name to be buried and rot above ground, before my friends can bury my body under it, yet herein is my comfort: there will be a resurrection of names as well as of bodies at the Last Day; I am assured that God will not only wipe off all tears from mine eyes, but all reproaches from my name also; I am, as says the apostle, counted a deceiver, yet true; as an apostate, yet firm to my first principles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Necessary Vindication of the Principles &amp; Practices of me, Christopher Love, since my trial before, and condemnation by the High Court of Justice (London, 1651)</cite>, p. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-2c66a74a9d" data-kw="">
<blockquote><p>Now in this object of our love, proximus, our neighbour, there are two things to be 〈◊〉: 1. That we must beware we take not the sin of our neighbor, for our neighbour; for that which has interposed itself, and indeed is not de 〈◊〉, is sin, and 〈◊〉 proximus, a sinner. It is sure that, Omnis peccator, quatenus peccator, odio habendus est, ‘every sinner, as he is a sinner, is to be hated;’ and omnis 〈◊〉, quatenus 〈◊〉, diligendus, ‘every man as he is a man is to be beloved.’ Therefore, Sic homines diligendi, ut non errores diligamus, diligendi quia facti sunt, non quia fecerunt; ‘We are to love men so, as not to love their errors, and so to love them that are made, as that we love not that they do;’ so to love that which God made them, as not to love what by sin they made themselves. The reason is, because we have all one 〈◊〉, or end: we do therefore love one another, because we [Christians] shall be partakers of the same sovereign good of eternal happiness; and sin being a hindrance or obstacle to that end, how can we love that which hinders from that whereto we tend? He that loves iniquity, hates his own soul. And so we may say, he that loves the sin of his brother, hates his soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pattern of Catechistical Doctrine at Large; or a Learned &amp; Pious Exposition of the 10 Commandments (d. 1626; 1675), 5th Commandment</cite>, p. 315 ff.</span></figcaption>

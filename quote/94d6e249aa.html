<main class="wrap"><figure class="quote" id="q-94d6e249aa" data-kw="">
<blockquote><p>§45. Concerning infants who die without baptism, in what place or state they are and will be, various opinions are fostered. We think it is not to be doubted that the infants of Christians are comprehended in the covenant of God and pertain to the Church. Wherefore the apostle in 1 Cor. 7:14 declares infants born of only one Christian parent to be holy, with a federal or ecclesiastical sanctity, since in the civil forum the infants of citizens pertain to the republic, and are capable and partakers of the rights of the republic, and are heirs of their paternal goods, and therefore can be saved, even if they are snatched away before receiving baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Sin &amp; its Distinctions’ (Frankfurt: Schwartz, 1712), ch. 2, ‘On Original Sin’, pp. 16-17 Holtzfus was a German reformed theologian, and a hypothetical universalist respecting the atonement.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9372f182a4" data-kw="">
<blockquote><p>By what reasons are they [Anabaptists] confuted? (1) Because, to covenanted ones (of which number the infants of believers are no less than their parents; Acts 2:38-39; Acts 3:25; Rom. 11:16; Gen. 17:7,22) that seal of the covenant, of which they are capable, is not to be denied; Gen. 17:7,10-11. … (8) Because, the Apostle says that the infants but of one believing parent are holy, 1 Cor. 7:14, that is, are comprehended in the outward Covenant of God, and have access to the signs, and seals of God’s grace as well as they are that are born of both believing parents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth’s Victory Over Error (Edinburgh, 1684), ch. 28, ‘Of Baptism’, Question 3</cite>, pp. 179-180</span></figcaption>

</figure><figure class="quote" id="q-57b8921a84" data-kw="">
<blockquote><p>Observation 3. It was the way of God from the beginning to take children of covenanters into the same covenant with their parents. So He dealt with this people in the establishment of the first covenant, and He has made no alteration herein in the establishment of the second.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Epistle to the Hebrews new ed. in 4 vols. (London: Tegg, 1840), vol. 4, on Heb. 9:18-22</cite>, p. 153</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“Observation 3. It was the way of God from the beginning to take children of covenanters into the same covenant with their parents. So He dealt with this people in the establishment of the first covenant, and He has made no alteration herein in the establishment of the second.”

— John Owen, Exposition of the Epistle to the Hebrews new ed. in 4 vols. (London: Tegg, 1840), vol. 4, on Heb. 9:18-22, p. 153">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObservation+3.+It+was+the+way+of+God+from+the+beginning+to+take+children+of+covenanters+into+the+same+covenant+with+their+parents.+So+He+dealt+with+this+people+in+the+establishment+of+the+first+covenant%2C+and+He+has+made+no+alteration+herein+in+the+establishment+of+the+second.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Exposition+of+the+Epistle+to+the+Hebrews+new+ed.+in+4+vols.+%28London%3A+Tegg%2C+1840%29%2C+vol.+4%2C+on+Heb.+9%3A18-22%2C+p.+153&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F57b8921a84.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/57b8921a84.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=Observation%203.%20It%20was%20the%20way,in%20the%20establishment%20of%20the%20second&amp;text=Observation%203.%20It%20was%20the%20way%20of%20God&amp;text=alteration%20herein%20in%20the%20establishment%20of%20the%20second" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9e6ca3df15" data-kw="">
<blockquote><p>From all this it follows clearly, that the children of Christian parents are Church-members; and, being Church-members, they have a right to Baptism, which is appointed by Christ to be the standing ordinance for solemn admission into the visible Church. So that, when they are in our Catechism said to be made members of Christ in their Baptism, the meaning only is, that now they are owned and publicly acknowledged to be such, by their solemn admission into the society of Christians. They are Christians nati; born Christians, by the covenant; Christianity is their birthright, and their native privilege.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Infants are members of the Church of Christ; and, therefore, to be baptized.’, pp. 303-304 in The Doctrine of the Two Sacraments in Works, vol. 2 ed. Quick (Philadelphia, 1874)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“From all this it follows clearly, that the children of Christian parents are Church-members; and, being Church-members, they have a right to Baptism, which is appointed by Christ to be the standing ordinance for solemn admission into the visible Church. So that, when they are in our Catechism said to be made members of Christ in their Baptism, the meaning only is, that now they are owned and publicly acknowledged to be such, by their solemn admission into the society of Christians. They are Christians nati; born Christians, by the covenant; Christianity is their birthright, and their native privilege.”

</figure><figure class="quote" id="q-d546e837e5" data-kw="">
<blockquote><p>Nor yet do [they, the apostles] make their being of a household simply the ground of their being baptized; for I confess there may be diverse in and of a houshold, that in some case, that is, of positive refusing to stoop to the Gospel, may not be baptized; as an unbelieving wife, servant, or child grown, they are by persuasion to be won in, or else let alone, this springing from the foresaid ground of not forcing ordinances upon men: But I make the grounds of their baptism: the tenor of the commission that bids them [ministers to] disciple all the gentiles, and of the gospel holding forth grace to all, one and other, no man being common or unclean in that respect in God’s account, but as they render themselves so by their willing rejections of the grace tendered to them, with their being under the tuition of those that profess faith, and subjection to the doctrine of Christ, and the non-resistance found in them, and the duty lying upon parents to bring them up in the nurture and admonition of the Lord. Whence it is to be noted, that it’s said of the jailor, he and all his, not all his ‘houshold’, but all ‘his’ were baptized; possibly some in the house might not be in his [to] dispose, but so many as were his were baptized. If any man say, its an act of force to disciple an infant; I say no, of no more force to baptize them to Christ, than to lay them in their cradles or carry them in their arms; they have no will nor reluctancy against it, ye may do with them what ye will: whence they are a pattern of right entring the Kingdom: ‘He that receives not the Kingdom of God as a little child,’ etc. They receive it as God and his people order them into it, and in it. And for their discipling by instruction, they usually, if well educated, drink it in, and submit to it better than others, as to the outward profession at least, as was before said. And I find not that baptism was ever denied to any that would submit themselves to learn the Christian profession… …who yet when they [infants] came to years of understanding, owning what was in infancy done to them, were never therefore reputed members of the Church or proselytes by compulsion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-horn.html">John Horn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>…A Consideration of Infant Baptism, wherein the grounds of it are laid down… and many things of Mr Tombes [a Baptist] about it… Answered… (London, 1654), pp. 38-9 Horn (1614-1676) was an English minister.</cite></span></figcaption>

eceives+not+the+Kingdom+of+God+as+a+little+child%2C%E2%80%99+etc.+They+receive+it+as+God+and+his+people+order+them+into+it%2C+and+in+it.+And+for+their+discipling+by+instruction%2C+they+usually%2C+if+well+educated%2C+drink+it+in%2C+and+submit+to+it+better+than+others%2C+as+to+the+outward+profession+at+least%2C+as+was+before+said.+And+I+find+not+that+baptism+was+ever+denied+to+any+that+would+submit+themselves+to+learn+the+Christian+profession%E2%80%A6+%E2%80%A6who+yet+when+they+%5Binfants%5D+came+to+years+of+understanding%2C+owning+what+was+in+infancy+done+to+them%2C+were+never+therefore+reputed+members+of+the+Church+or+proselytes+by+compulsion.%E2%80%9D%0A%0A%E2%80%94+John+Horn%2C+%E2%80%A6A+Consideration+of+Infant+Baptism%2C+wherein+the+grounds+of+it+are+laid+down%E2%80%A6+and+many+things+of+Mr+Tombes+%5Ba+Baptist%5D+about+it%E2%80%A6+Answered%E2%80%A6+%28London%2C+1654%29%2C+pp.+38-9+Horn+%281614-1676%29+was+an+English+minister.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd546e837e5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d546e837e5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=Nor%20yet%20do%20%5Bthey%2C%20the%20apostles,the%20Church%20or%20proselytes%20by%20compulsion&amp;text=Nor%20yet%20do%20%5Bthey%2C%20the%20apostles%5D%20make%20their&amp;text=members%20of%20the%20Church%20or%20proselytes%20by%20compulsion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

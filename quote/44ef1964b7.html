<blockquote><p>Some people are concerned that the existence of textual variants or passages which are difficult to translate undermines our confidence in the word of God. As James Ussher demonstrates below, such fears are groundless and contrary to common sense. The quote below pretty much sums up my own position:

How can the certain understanding of the Scriptures be taken out of the Original Tongues; considering the difference of Reading, which is in divers Copies both of Hebrew and Greek; as also the difficulty of some Words and Phrases upon which the best Translators cannot agree?

Although in the Hebrew Copies there hath been observed by the Masorites some very few differences of Words, by similitude of Letters and Points; and by the Learned in the Greek Tongue there are like diversities of Reading noted in the Greek Text of the New Testament, which came by fault of the Writers: yet in most by circumstance of the place and conference of other places, the true reading may be discerned. And albeit in all it cannot, nor the Translator in all places determine the true interpretation; yet this diversity or difficulty can make no difference or uncertainty in the sum and substance of Christian Religion; because the Ten Commandments, and the principal Texts of Scripture on which the Articles of our Faith are grounded, the Sacraments instituted, the Form of Prayer taught, (which contain the sum and substance of Christian Religion) are without such diversity of Reading, or difficulty of Translating so plainly set down, and so precisely translated by consent of Learned Men in the Tongues, that no Man can make any doubt of them, or pick any quarrel against them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A body of divinity: or, the sum and substance of Christian religion</cite>, ed. Michael Nevarr (1648; Herndon VA, 2007), p. 20.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>And as evil is to be controlled by Law, so that which is good is also by Law to be procured. God hath made us many ways rich. For what we have, freely at his hands we have it. But he himself is become very poor: in so much that, for want of relief, he is forced to beg; and, for want of lodging and meat, he lieth and dieth in our streets. This great ingratitude God cannot but revenge.

Oh what shame is this to a Christian common wealth, in a reformed country? Obstinate Jews would never shew themselves so unthankful. Their ancient Law forbidding beggars is even to this day most straitly kept amongst them. Laws in this behalf have been provided: but as they wanted perfection, so have they in manner in no point or any where had execution.

Serve God in truth, provide that Christ crave not. Such as will not feed him here: he will never feed in his kingdom. Thus have I, point by point, let you see disorders and wants in the common wealth. Ye have authority by Law to reform them. Consider dutifully of it, and serve God truly as ye ought, always remembering the saying of the Prophet Esay, Woe be to them that make wicked Laws.</p></blockquote>

<blockquote><p>You also wrote me concerning some supposed image of Christ, which image you wished me to send you. Now what kind of thing is this that you call the image of Christ? I do not know what impelled you to request that an image of Our Saviour should be delineated. What sort of image of Christ are you seeking? Is it the true and unalterable one which bears His essential characteristics, or the one which He took up for our sake when He assumed the form of a servant? . . . Granted, He has two forms, even I do not think that your request has to do with His divine form. . . . Surely then, you are seeking His image as a servant, that of the flesh which He put on for our sake. But that, too, we have been taught, was mingled with the glory of His divinity so that the mortal part was swallowed up by Life. Indeed, it is not surprising that after His ascent to heaven He should have appeared as such, when, while He—the God, Logos—was yet living among men, He changed the form of the servant, and indicating in advance to a chosen band of His disciples the aspect of His Kingdom, He showed on the mount that nature which surpasses the human one—when His face shone like the sun and His garments like light. Who, then, would be able to represent by means of dead colors and inanimate delineations (skiagraphiai) the glistening, flashing radiance of such dignity and glory, when even His superhuman disciples could not bear to behold Him in this guise and fell on their faces, thus admitting that they could not withstand the sight? If, therefore, His incarnate form possessed such power at the time, altered as it was by the divinity dwelling within Him, what need I say of the time when He put off mortality and washed off corruption, when He changed the form of the servant into the glory of the Lord God. . . ? … How can one paint an image of so wondrous and unattainable a form—if the term ‘form’ is at all applicable to the divine and spiritual essence—unless, like the unbelieving pagans, one is to represent things that bear no possible resemblance to anything. . . ? For they, too, make such idols when they wish to mould the likeness of what they consider to be a god or, as they might say, one of the heroes or anything else of the kind, yet are unable even to approach a resemblance, and so delineate and represent some strange human shapes. Surely, even you will agree that such practices are not lawful for us. But if you mean to ask of me the image, not of His form transformed into that of God, but that of the mortal flesh before its transformation, can it be that you have forgotten that passage in which God lays down the law that no likeness should be made either of what is in heaven or what is in the earth beneath? Have you ever heard anything of the kind either yourself in church or from another person? Are not such things banished and excluded from churches all over the world, and is it not common knowledge that such practices are not permitted to us alone? Once— I do not know how—a woman brought me in her hands a picture of two men in the guise of philosophers and let fall the statement that they were Paul and the Saviour—I have no means of saying where she had had this from or learned such a thing. With the view that neither she nor others might be given offence, I took it away from her and kept it in my house, as I thought it improper that such things ever be exhibited to others, lest we appear, like idol worshippers, to carry our God around in an image. I note that Paul instructs all of us not to cling any more to things of the flesh; for, he says, though we have known Christ after the flesh, yet now henceforth know we Him no more. It is said that Simon the sorcerer is worshipped by godless heretics painted in lifeless material. I have also seen myself the man who bears the name of madness57 [painted] on an image and escorted by Manichees. To us, however, such things are forbidden. For in confessing the Lord God, Our Saviour, we make ready to see Him as God, and we ourselves cleanse our hearts that we may see Him after we have been cleansed. . .</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/eusebius-of-caesarea.html">Eusebius of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Art of the Byzantine Empire 312-1453</cite>, (1972, rep. 1986),p. 16-18. Source: Patrologia Graeca 20, 1545 f.</span></figcaption>

<blockquote><p>I next refer to the Spirit’s work in connection with Christ’s priestly oblation: “Who, through the eternal Spirit, offered Himself without spot to God” (Heb. 9.14). The expression: “the eternal Spirit,” can only mean the Holy Spirit according to the usual acceptation of the term — not the divine nature of Christ, as too many expositors have understood it. The meaning is, that the Son of God, moved and animated by the Holy Ghost, offered Himself without spot as an atoning sacrifice.

The Spirit rendered Him an unspotted sacrifice. The Spirit discovered to Him the inflexible claims of God as well as inflamed Him with such love to man and zeal for God as prompted Him to go forward in spite of every hindrance, pain, and difficulty, to effect the world’s redemption, and thus fitted Him as man for His work The Holy Spirit, in a word, filled His mind with the unflagging ardour, zeal, and love which led Him to complete the sacrifice.

To explain the text as if it described the divine nature as priest and the human nature as the sacrifice, is inadmissible. The WHOLE PERSON is priest and victim; for all done by either nature belongs to the Person: HE offered HIMSELF, says the apostle.

In this view of the matter, it would be a mere tautology — if the eternal Spirit is interpreted of the divine nature — to say He offered Himself through the divine nature. It would on that principle be but a repetition of the same thing. If we take it, however, as intimating the action of the Holy Spirit, it will vividly represent the holy fire by which the sacrifices were consumed. One does not find, except on this interpretation, anything in the sacrifice of Christ that could be adduced as the antitype of the holy fire employed in the sacrifice.

Nor are the objections to the view which we have propounded of any weight. When it is objected that the Holy Spirit was not the Priest who offered the sacrifice, the obvious answer is that Christ as Priest offered Himself a sacrifice possessed of infinite value and excellence in consideration of His divine Person, and of the additional fact that it was unspotted and offered through the Holy Spirit. Because the Spirit was in Him as a Spirit of faith and zeal and love — the Redeemer took upon Him with the utmost alacrity all that was to be performed and endured for man’s redemption.

The Holy Spirit, which framed the Redeemer’s mind as well as body, perpetually rested upon Him during all His earthly sojourn, imparting to Him the full consciousness of His Sonship in the highest sense, and prompting Him to execute the mediatorial work imposed on Him (Isa. 42.1-4). That our Saviour was also raised from the dead by the Holy Ghost, is clearly taught by Peter, when he affirms that He was put to death in the flesh, but quickened by the Spirit (1 Pet. 3.18).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-654fb70b25" data-kw="">
<blockquote><p>Hence, we are free insofar as we have been renewed. Insofar as we are flesh and age, we are under the law; although what is left of the old, is condoned in believers for the same of their faith. In a word, as far as we believe, we are free; and as far as we show diffidence, we are under the law… For here we have just begun our justification and have not entirely completed it. Thus Paul forthwith orders us to be changed by the renewing of our minds.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bdfa54a8fa" data-kw="">
<blockquote><p>The apostle signifies the same thing by different words when he says, ‘Ye are washed, ye are sanctified, ye are justified:’ he has said, ‘ye are washed,’ on account of holy baptism; ‘ye are sanctified,’ on account of the Holy Ghost; but ‘ye are justified,’ on account of justifying faith, etc.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-0ea9c90737" data-kw="">
<blockquote><p>There are four set periods of justification: First, in God’s purpose, which reaches as far as the eternal transactions between God and Christ, such as were set down in the Lamb’s book. Secondly, when Christ did in the name and stead of sinners perform that which was the matter of their justification, but in neither of these periods was the soul translated out of the state of nature into the state of grace. Thirdly, actually, at that moment when we come to own Christ as a Saviour by believing. Fourthly, when the Spirit which translates the soul out of the state of nature into the state of grace, makes it known to the soul. Others say there are five (as it were) periods or degrees of justification: 1. When the Lord passes a sentence of absolution on men at their first conversion, immediately upon their union with Christ, Acts 13:38-39. 2. He that is justified falls into daily transgressions, therefore there must be a daily imputation and application of the death of Christ, Jn. 13:10. 3. There is a high act of justification after great and eminent falls, though there be not an intercission, yet there is a sequestration, such cannot then plead their right. (A leper could not make use of his house, though he had a right to it.) David’s sin of adultery and murder made a great breach upon his justification, therefore he prays God, Ps. 51, to purge him with hyssop, to apply anew the blood of Christ. 4. There follows a certification, a sentence passed in the soul concerning man’s estate, 1 Jn. 5:9; Rom. 8:33. 5. Justification is never perfected till the Day of Judgment, Acts 3:19, then sentence is passed in open court before men and angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6. Of Justification, p. 515</span></figcaption>

</figure><figure class="quote" id="q-dc9dff461e" data-kw="">
<blockquote><p>The Discourse of Albertus Pighius… shall be once again repeated, both for its Worth and Truth…: ‘…God therefore does justify us by his free grace or goodness wherewith he embraces us in Christ Jesus, when he clothes us with his innocency and righteousness as we are ingrafted into Him; for as that alone is true and perfect which only can endure in the sight of God, so that alone ought to be presented and pleaded for us before the divine tribunal, as the advocate of, or plea in our cause; resting hereon, we here obtain the daily pardon of sin; with whose purity being covered, our filth and the uncleanness of our imperfections are not imputed unto us, but are covered as if they were buried, that they may not come into the Jugdment of God; until the old man being destroyed and slain in us, divine Goodness receives us into peace with the second Adam.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, … (London: Boulter, 1677)</span></figcaption>

<blockquote><p>XXII… Fourth, it is asked whether good works are prerequisite for justification. … (5) Indeed, there are not lacking among recent theologians those who teach a justification of the justified that happens with works going before it, whereby the one justified justifies himself from hypocrisy, which depends upon an inherent holiness, albeit imperfect, yet sincere. … (7) Protestants in common, in agreement with Augustine, think that good works do not precede the one to be justified, but follow the one who is justified, yet with the differences of stages observed…</p></blockquote>

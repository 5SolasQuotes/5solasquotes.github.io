<main class="wrap"><figure class="quote" id="q-3340ac5daa" data-kw="">
<blockquote><p>The rule of building the house of God, and of the reformation of religion is the same and perpetual; the commandment of God, and not the commandment of man, one or more, whether they be civil or ecclesiastical persons. It is their part to provide according to their places and callings, to command and direct that the commandment of God be obeyed. This King commands not that his will be done, but what God has commanded. Neither King nor Parliament can command otherwise. Civil powers have great authority, not only in things civil, but in matters of religion, and they sin against God if they use not the authority which God has put in their hands for the good of religion.[1] To them belongs inspection and watching over, not only Ecclesiasticos [church people], but Ecclesiastica [church things]. Ecclesiastical persons are subject to civil authority no less than others, and in respect of things ecclesiastical or matters of religion, Eusebius brings in Constantine the great, Vos Episcopi in Ecclesia, ego extra Ecclesiam seu templum Episcopus a eo constitutus sum,[2] not that any mortal man whether Pope or Prince, can be properly head of the church, or vicegerent unto Christ the Mediator in his special and economical kingdom of grace. For princes are vicegerents to God, and to his Son Jesus Christ as he is God, in his universal kingdom of providence; and this watching and inspection of princes and magistrates, is objective Ecclesiastica, but formaliter civilis, it is about matters of religion in a civil manner, and in a way suitable to the nature and quality of their place and power.[3]

The faithful custody and preservation of religion, is a part of their office. For they are not only keepers of the second, but of the first table of the law. To them appertains the vindication and defence against contempt, corruption, and abuses. Religion also expects from them the civil sanction, that the worship of God and the wholesome constitutions of the church about religion, be confirmed and settled by their laws. Coaction also is theirs, for they by their power are to constrain their subjects to the duties of religion, and to coerce and stop them that they do nothing to the contrary.[4] They may also call civil assemblies of the church, when the case of religion does require, preside as civil presidents, and examine church constitutions, not only as they are Christians for satisfying their own souls, but as magistrates for the good of the people. And when there is a necessity of reformation of religion, and the ministry and churchmen, like the sands of the seashore are covered with a deluge of defection and corruptions, they are by their authority to endeavour a reformation. And yet in all this exercise of their power, they are to do nothing but according to the commandment of God. So David, Jehoshaphat, Hezekiah, Josiah, and other good and religious princes have done. But when Jeroboam puts his own commandment in place of the commandment of God, when Ahaz sets up the altar of Damascus beside or in place of God’s altar, when the Kings of Judah and Israel did worship God, or did command the people to worship God, otherwise than God had commanded, wrath was upon the kingdom of the king and his sons.

Alexander Henderson, ‘A sermon preached to the Honourable House of Commons at their late Solemn Fast, Wednesday, December 27, 1643’ in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament by the Scottish Commissioners to the Westminster Assembly of divines 1643-1645 (Dallas, 2011), pp 88-9.

[1] According to Henderson, the civil magistrate has “great” (not absolute, but great nonetheless) authority not only in civil and social matters, but even concerning matters of religion. This is not consistent with an ideological commitment to small government philosophy, which considers a civil government with great power to be (at best) a judgment from God.

[2] “You were made Bishops in the Church, I was made Bishop outside the Church or temple, by God.</p></blockquote>

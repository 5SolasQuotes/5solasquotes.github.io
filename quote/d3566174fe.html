<blockquote><p>15. What are the duties of the officers of the State with regard to the Church?

The state is a divine institution, and the officers thereof are God’s ministers, Rom. xiii. 1-4, Christ the Mediator is, as a revealed fact, “Ruler among the Nations,” King of kings, and Lord of lords. Rev. xix. 16; Matt, xxviii. 18; Phil. ii. 9-11; Eph. i. 17-23, and the Sacred Scriptures are an infallible rule of faith and practice to all men under all conditions.

It follows therefore — 1st. That every nation should explicitly acknowledge the Christ of God to be the Supreme Governor, and his revealed will the supreme fundamental law of the land, to the general principles of which all special legislation should be conformed. 2d. That all civil officers should make the glory of God their end, and his revealed will their guide. 3d. That, while no distinction should be made between the various Christian denominations, and perfect liberty of conscience and worship be allowed to all men, nevertheless the Christian magistrate should seek to promote piety as well as civil order (“Conf Faith,” ch. 23, § 2).

This they are to do, not by assuming ecclesiastical functions, nor by attempting to patronize or control the church, but by their personal example, by giving impartial protection to church property and facility to church work, by the enactment and enforcement of laws conceived in the true spirit of the Gospel, and especially in maintaining inviolate the Christian Sabbath, and Christian marriage, and in providing for Christian instruction in the public schools.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, (2nd edn, New York: Robert Carter and Brothers, 1879), p. 434.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>Hence that is a fiduciary power, or a power of trust, wherein the thing put in trust is not either his own proper heritage or gift, so as he may dispose of it as he pleases, as men dispose of their goods or heritage. But the king may not dispose of men as men, as he pleases; nor of laws as he pleases; nor of governing men, killing or keeping alive, punishing and rewarding, as he pleases… But tbe law is not the king’s own, but given to him in trust.</p></blockquote>

<blockquote><p>9. [Maxwell’s accusation of presbyterians is false:] That the king must submit his sceptre to the presbytery. The king’s sceptre is his royal office, which is not subject to any judicature, no more than any lawful ordinance of Christ; but if the king, as a man, blaspheme God, murder the innocent, advance belly-gods (such as our prelates for the most part were) above the Lord’s inheritance, the ministers of Christ are to say, ‘The king troubles Israel, and they have the keys to open and shut heaven to, and upon the king, if he can offend.’ … 21. It is false that presbyteries usurp both swords because they censure sins which the civil magistrate should censure and punish. Elijah might be said then to mix himself with the civil business of the kingdom, because he prophesied against idolaters’ killing of the Lord’s prophets; which crime the civil magistrate was to punish. But the truth is, the assembly of Glasgow, 1637, condemned the prelates because they, being pastors, would be also lords of parliament, of session, of secret council, of exchequer, judges, barons, and in their lawless high commission, would fine, imprison, and use the sword. … 29. It is a lie that our General Assembly may repeal [civil] laws, command and expect performance of the king, or then excommunicate, subject to them, force and compel king, judges and all, to submit to them. They may not force the conscience of the poorest beggar, nor is any Assembly infallible, nor can it lay bounds upon the souls of judges, which they are to obey with blind obedience — their power is ministerial, subordinate to Christ’s law; and what civil laws parliaments make against God’s Word, they may authoritatively declare them to be unlawful, as though the emperor (Acts 15) had commanded fornication and eating of blood. Might not the Assembly forbid these in the synod?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), pp. xxii-xxiii</span></figcaption>

</figure><figure class="quote" id="q-edb3caa851" data-kw="">
<blockquote><p>They [Papists] do not only say… that one born in an heretical country may deny his country, but that by heresy a man, nay, a king, is deprived of all his jurisdiction, whether natural, civil or politic… One of their own bishops says, “As soon as a Christian king becomes heretical, forthwith the people are freed from subjection.” A cardinal says, “As long as the prince continues excommunicated (as he must do ever, if he be not a Romanist, for the Pope excommunicates ipso facto all heretics) the subject is freed from the oath of subjection,” but by whom? By the Pope, says a Jesuit, who upon just cause has power to absolve from oaths both himself, (as Gregory the 12th did when he sware that if he were chosen Pope he would give it over) and all others. If he be personally excommunicated, then, says their lawyer, subjects are freed from their allegiance and all his heretical assistants are to be rooted out, and their land to be exposed to be possessed of (strangers) Catholics. Nay, says another lawyer, if he be not excommunicated, yet if his heresy be publicly known, there needs no pronunciation of the sentence of excommunication, so that (says the Jesuit) subjects may lawfully deny him obediencer? How so? For the evidence of the crime, (says their whole school, and make it a matter of certainty and faith) does infer a sentence of condemnations because (as the more common opinion does define it) there must we understand the Pope’s will to have him excommunicated, whom upon the knowledge of his fault he would excommunicate. Nay, suppose that a Protestant prince have a just quarrel: yet, no war can be lawfully denounced or waged by the Queen (being excommunicated by name) though otherwise in itself it were most just: because her power is unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, ch. 49, ‘Concerning Magistrates’, ‘What are the Assertions of Papists in this Point?’, p. 901-902</span></figcaption>

<blockquote><p>All the question is concerning the imperated [commanded] acts and these external, that is not touching opinions and acts of the mind, but that which is visible and audible in these opinions, to wit, the speaking, professed holding of them, publishing, teaching, printing, and known external persuading of others to be of our mind. So that the question will come to this, whether the Magistrate’s sword be to regulate our words that concerns our neighbor, as that we lie not, we forswear not, to the hurt of the life and credit of our neighbor, that we slander not, rail upon no man, far less against the prince and ruler of the people, but whether the words we utter or publish of God though never such blasphemies, and lies, because they come from the conscience (as is truths or words we speak for or against our neighbor did not flow from a conscience either good or ill) be above or beyond all swords or coercive power of men. It is clear the question must be thus stated, for all the laws of the Old Testament (which we hold in their moral equity to be perpetual) that are touching blasphemies, heresies, solicitation to worship false gods and the breach of which the godly magistrate was to punish, command or forbid only such things as may be proved by two or three witnesses, and which husband and wife are not to conceal, and from which all Israel must abstain for fear of the like punishment, Dt. 13:8-11; 17:5-6; Lev. 20:1-5. But opinions in the mind, acts of the understanding, can never be proved by witnesses and such as neither Magistrate nor Church can censure.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e41cf7d0f8" data-kw="">
<blockquote><p>There is no grace, no duty, for the substance of them, nor for the manner of their performance, that are required either by the Law or the gospel, but they [justified persons] are obliged unto them. Where they are omitted, we acknowledge that the guilt of sin is contracted, and that attended with such aggravations, as some will not own or allow to be confessed unto God Himself. Hence in particular the faith and grace of believers, do constantly and deeply exercise themselves in godly sorrow, repentance, humiliation for sin, and confession of it before God, upon their apprehensions of its guilt. And these duties are so far necessary unto the continuation of our justification as that a justified estate cannot consist with the sins and vices that are opposite unto them. So the apostle affirms, that if we live after the flesh, we shall die, Rom. 8:13. He that does not carefully avoid falling into the fire or water, or other things immediately destructive of life natural, cannot live. But these are not the things whereon life does depend. Nor have the best of our duties any other respect unto the continuation of our justification, but only as in them we are preserved from those things which are contrary unto it, and destructive of it. If this be that which is intended in this position, the continuation of our justification depends on our own obedience and good works, or that our own obedience and good works are the condition of the continuation of our justification, namely that God does indispensably require good works and obedience in all that are justified, so that a justified estate is inconsistent with the neglect of them, it is readily granted, and I shall never contend with any about the way whereby they choose to express the conceptions of their minds. … All other works and duties of obedience do accompany faith in the continuation of our justified estate, as necessary effects and fruits of it, but not as causes, means, or conditions whereon that effect is suspended. It is patient waiting by faith that brings in the full accomplishment of the promises, Heb. 6:12, 16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, … (London: Boulter, 1677), pp. 207-11</span></figcaption>

oks Online</a></div>
</figure><figure class="quote" id="q-0ea9c90737" data-kw="">
<blockquote><p>There are four set periods of justification: First, in God’s purpose, which reaches as far as the eternal transactions between God and Christ, such as were set down in the Lamb’s book. Secondly, when Christ did in the name and stead of sinners perform that which was the matter of their justification, but in neither of these periods was the soul translated out of the state of nature into the state of grace. Thirdly, actually, at that moment when we come to own Christ as a Saviour by believing. Fourthly, when the Spirit which translates the soul out of the state of nature into the state of grace, makes it known to the soul. Others say there are five (as it were) periods or degrees of justification: 1. When the Lord passes a sentence of absolution on men at their first conversion, immediately upon their union with Christ, Acts 13:38-39. 2. He that is justified falls into daily transgressions, therefore there must be a daily imputation and application of the death of Christ, Jn. 13:10. 3. There is a high act of justification after great and eminent falls, though there be not an intercission, yet there is a sequestration, such cannot then plead their right. (A leper could not make use of his house, though he had a right to it.) David’s sin of adultery and murder made a great breach upon his justification, therefore he prays God, Ps. 51, to purge him with hyssop, to apply anew the blood of Christ. 4. There follows a certification, a sentence passed in the soul concerning man’s estate, 1 Jn. 5:9; Rom. 8:33. 5. Justification is never perfected till the Day of Judgment, Acts 3:19, then sentence is passed in open court before men and angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6. Of Justification, p. 515</span></figcaption>

</figure><figure class="quote" id="q-3b1cfb93cb" data-kw="">
<blockquote><p>Secondly, justification does connote a state and established condition of a man, and therefore is not frequently iterated, although it be continued. A man is not justified many times in a day, though sins be pardoned often in a day. It is true, God does continue to justify those that believe in Him, and if He should cease to do so, they would immediately fall into misery and guilt; but yet God does not renew or revive our justification, as if there were an interruption or intermission of it. That justification does denote an estate is plain by comparing it with all the other privileges God vouchsafes his people: regeneration and vocation denote a state the person is put into, so does glorification. As therefore sanctification is one thing, and those auxiliary actings of God’s grace are another thing, so that though we may say such a man has new quickening grace every day, yet we cannot say he has a new regeneration; so it is here: though we may say that every day the believer, begging the pardon of his daily infirmities, has a new pardon, yet he has not a new justification, because this denominates the state of a man. Neither can it be said that pardon of this sin or that sin puts a man into the state of God’s favor absolutely, but quoad hoc [so far as this]; the pardon of this or that sin does not make that universal righteousness of the person whereby he stands acquitted from all. It is true, some learned men call this daily remission of sin justificatio particularis [a particular justification]; but we are now treating of that universal justification whereby the person of a believer stands acquitted and disobliged from the guilt of all his sins he has committed. And great is the comfort of a Christian in that his justification is a state of favor with God; for hence flow many other inestimable benefits and advantages, which the believer is to study out and improve.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, … (London: Underhill, 1654), pt. 2, | sermon 27, ‘That the whole nature of justification is not comprehended in remission and forgiveness of sin’, p. 268</span></figcaption>

+from+the+guilt+of+all+his+sins+he+has+committed.+And+great+is+the+comfort+of+a+Christian+in+that+his+justification+is+a+state+of+favor+with+God%3B+for+hence+flow+many+other+inestimable+benefits+and+advantages%2C+which+the+believer+is+to+study+out+and+improve.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+True+Doctrine+of+Justification%E2%80%A6+%28London%3A+Underhill%2C+1654%29%2C+pt.+2%2C+%7C+sermon+27%2C+%E2%80%98That+the+whole+nature+of+justification+is+not+comprehended+in+remission+and+forgiveness+of+sin%E2%80%99%2C+p.+268&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3b1cfb93cb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3b1cfb93cb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=Secondly%2C%20justification%20does%20connote%20a%20state,is%20to%20study%20out%20and%20improve&amp;text=Secondly%2C%20justification%20does%20connote%20a%20state%20and%20established&amp;text=the%20believer%20is%20to%20study%20out%20and%20improve" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Proposition 3: Many of our learned [Romish] adversaries destroy that which is principal and most essential in remission of sinnes, to wit, condonation. Vasques the Jesuit says [denying condonation]… The said author confirms his opinion by these two arguments especially: … Argument 2: If a condonation be admitted for the merit of Christ, then the merit of Christ imputed is the formal cause of that condonation: and granting this, the justification of a sinner must have two forms: one of remission of sins; the other of inward cleansing and sanctification. But this is contrary to the Trident Council affirming that justification has but one form. (Bellarmine, On Justification, bk. 2, ch. 2; Concil of Trent, sess. 6, ch. 7) And it differs very little from the doctrine of the Protestants. For in the principal, it is one with it, to wit, in that it holds that a justified person does next and immediatly receive the remission of sins for the merit of Christ imputed. And the smaller difference between the sides, to wit, whether inherent justice may be admitted a part of justification, might be qualified by some such modification as Vega propounds to Calvin (For the Council of Trent, bk. 15, ch. 5), saying, ‘If at all times when one is iustified, he is also sanctified, what offence is it to allow one common word (namely ‘justification’ [citing Beza on Tit. 3:7 &amp; Rom. 8:30]) to express and contain both these parts?’ I am not ignorant that many other Papists admit condonation; but Vasquez charges that opinion with having affinity with ours, and affirms and proves that it is repugnant to the Trident Councel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-white.html">Francis White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Faith &amp; Way to the Church Explaned &amp; Justified in Answer to a Popish Treatise</cite>, ... (London: Field, 1617), pt. 1, ch. 1, Observation 1, ‘Touching remission of sins in justification’, pp. 18-19 White (c. 1564 – 1638) was an Anglican bishop.</span></figcaption>

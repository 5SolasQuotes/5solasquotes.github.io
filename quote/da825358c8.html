<main class="wrap"><figure class="quote" id="q-da825358c8" data-kw="">
<blockquote><p>The Sabbath came out of Christ’s hands, we see then, not despoiled of any of its authority or robbed of any of its glory, but rather enhanced in both authority and glory. Like the other commandments it was cleansed of all that was local or temporary in the modes in which it had hitherto been commended to God’s people in their isolation as a nation, and stood forth in its universal ethical content. Among the changes in its external form which it thus underwent was a change in the day of its observance. No injury was thus done the Sabbath as it was commended to the Jews; rather a new greatness was brought to it. Our Lord, too, following the example of his Father, when he had finished the work which it had been given him to do, rested on the Sabbath—in the peace of his grave. But he had work yet to do, and, when the first day of the new week, which was the first day of a new era, the era of salvation, dawned, he rose from the Sabbath rest of the grave, and made all things new. As C. F. Keil beautifully puts it; “Christ is Lord of the Sabbath, and after the completion of his work, he also rested on the Sabbath. But he rose again on the Sabbath; and through his resurrection, which is the pledge to the world of the fruit of his redeeming work, he made this day the Lord’s Day for his Church, to be observed by it till the Captain of its salvation shall return, and having finished the judgment upon all his foes to the very last, shall lead it to the rest of that eternal Sabbath which God prepared for the whole creation through his own resting after the completion of the heaven and the earth.” Christ took the Sabbath into the grave with him and brought the Lord’s Day out of the grave with him on the resurrection morn.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Foundations Of The Sabbath In the Word of God”</cite>, An address delivered at the Fourteenth International Lord’s Day Congress held in Oakland, California, July 27-August 1, 1915, published in Sunday the World’s Rest Day. 1916, pp.63-81, and in The Free Presbyterian Magazine. Glasgow, 1918, pp. 316</span></figcaption>

<blockquote><p>§40. And 1. If the surplice be imposed by the magistrate (as it was), who is a lawful governor, and that directly but as a decent habit for a minister in God’s service, I think he needlessly strained his power and sinfully made an engine to divide the Church by making such a needless law, and laying the peace of the Church upon it; But yet he meddled with nothing but was within the reach of his power in the general. Some decent habit is necessary; either the magistrate or the minister himself, or the associated pastors must determine what. I think neither magistrate nor synod should do anymore than hinder undecency: But yet if they do more, and tie all to one habit (and suppose it were an undecent habit), yet this is but an imprudent use of power. It is a thing within the magistrate’s reach; he does not an alien work, but his own work amiss: and therefore the thing in itself being lawful, I would obey him and use that garment, if I could not be dispensed with. Yea, though secondarily the whiteness be to signify purity, and so it be made a teaching sign, yet would I obey: For secondarily we may lawfully and piously make teaching signs of our food and raiment, and everything we see. But if the magistrate had said that the primary reason or use of the surplice was to be an instituted sacramental sign, to work grace on my soul and engage me to God, then I durst not have used it, though secondarily it had been commanded as a decent garment. New sacraments I durst not use, though a secondary use were lawful.</p></blockquote>

<blockquote><p>…the minister who is to preach is to… to call upon the Lord to this effect: ‘To acknowledge our great sinfulness, First, by reason of original sin, which… doth defile our best actions… And, with confidence of his mercy to his whole church, and the acceptance of our persons, through the merits and mediation of our High Priest, the Lord Jesus, to profess that it is the desire of our souls to have fellowship with God in the reverend and conscionable use of his holy ordinances; and, to that purpose, to pray earnestly for his grace and effectual assistance to the sanctification of his holy sabbath, the Lord’s day, in all the duties thereof, publick and private, both to ourselves, and to all other congregations of his people, according to the riches and excellency of the gospel, this day celebrated and enjoyed. And because we have been unprofitable hearers in times past, and now cannot of ourselves receive, as we should, the deep things of God, the mysteries of Jesus Christ, which require a spiritual discerning; to pray, that the Lord, who teacheth to profit, would graciously please to pour out the Spirit of grace, together with the outward means thereof, causing us to attain such a measure of the excellency of the knowledge of Christ Jesus our Lord…&#x27;</p></blockquote>

<blockquote><p>There is now no national membership in the Church of Christ, limited to one hereditary family or favored race; but in the fellowship of one faith and one spirit, all, of whatever tribe or tongue or nation, are one with Christ, and one with each other… Earthly and outward causes of separation are overborne and controlled by this higher principle of unity. Separation in race or tongue is no separation to be accounted of among the followers of Christ, who are joined together in that one Spirit. Distance on the earth is no distance to be regarded between those who are partakers together of the same Holy Ghost. Local churches or societies, divided in place and outward worship, become merged in the oneness of a higher fellowship. Separated in the outward act of worship, they are joined in the communion of the same Spirit. The assemblies of Christians in every quarter of the globe, who worship God in sincerity and truth, are one in such a sense as their distance from one another admits of; and they must all be regarded as branches of the universal Church of Christ throughout the world, the great community of believers, separated by distance and kindred and tongue, who cannot meet together in the body, but who really meet together in the Spirit. The invisible Church of Christ on earth is local, but it is also catholic.</p></blockquote>

— James Bannerman, The Church of Christ... (Edinburgh: T&amp;T Clark), vol. 1, pt. 1, ‘Nature of the Church’, ch. 4, ‘The Church in its Twofold Character as Catholic &amp; Local’, pp. 43-44">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+now+no+national+membership+in+the+Church+of+Christ%2C+limited+to+one+hereditary+family+or+favored+race%3B+but+in+the+fellowship+of+one+faith+and+one+spirit%2C+all%2C+of+whatever+tribe+or+tongue+or+nation%2C+are+one+with+Christ%2C+and+one+with+each+other%E2%80%A6+Earthly+and+outward+causes+of+separation+are+overborne+and+controlled+by+this+higher+principle+of+unity.+Separation+in+race+or+tongue+is+no+separation+to+be+accounted+of+among+the+followers+of+Christ%2C+who+are+joined+together+in+that+one+Spirit.+Distance+on+the+earth+is+no+distance+to+be+regarded+between+those+who+are+partakers+together+of+the+same+Holy+Ghost.+Local+churches+or+societies%2C+divided+in+place+and+outward+worship%2C+become+merged+in+the+oneness+of+a+higher+fellowship.+Separated+in+the+outward+act+of+worship%2C+they+are+joined+in+the+communion+of+the+same+Spirit.+The+assemblies+of+Christians+in+every+quarter+of+the+globe%2C+who+worship+God+in+sincerity+and+truth%2C+are+one+in+such+a+sense+as+their+distance+from+one+another+admits+of%3B+and+they+must+all+be+regarded+as+branches+of+the+universal+Church+of+Christ+throughout+the+world%2C+the+great+community+of+believers%2C+separated+by+distance+and+kindred+and+tongue%2C+who+cannot+meet+together+in+the+body%2C+but+who+really+meet+together+in+the+Spirit.+The+invisible+Church+of+Christ+on+earth+is+local%2C+but+it+is+also+catholic.%E2%80%9D%0A%0A%E2%80%94+James+Bannerman%2C+The+Church+of+Christ...+%28Edinburgh%3A+T%26T+Clark%29%2C+vol.+1%2C+pt.+1%2C+%E2%80%98Nature+of+the+Church%E2%80%99%2C+ch.+4%2C+%E2%80%98The+Church+in+its+Twofold+Character+as+Catholic+%26+Local%E2%80%99%2C+pp.+43-44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F60e1f0859c.html&amp;via=5Solas" target="_ <blockquote><p>That which I first meet withal directly unto this purpose is, part 2, p. 157, the forbearance of communion with the Church of England in its parochial assemblies (that is in the way and manner before described) he opposes with two arguments. The first respects those who allow occasional communion with parochial churches but will not comply with them in that which is constant and absolute. For he says, if the first be lawful, the latter is necessary from the commands we have to preserve the peace and unity of the Church. And the not doing it, he says, is one of the provoking sins of the non-conformists; but whether it be a sin or no is sub Judice [under judgment]; that it is provoking unto some is sufficiently evident. I shall not make this any part of my contest… And it will be hard to prove that on a concession of the lawfulness of communion in some acts of divine worship, it will be necessary for men to oblige themselves unto total constant communion, with a renunciation and condemnation of all other ways and means of joint edification. It may also be lawful to do a thing with some respects and limitations, at some times, which it, may not be lawful to do absolutely and always. It may be necessary from outward circumstances to do that sometimes which is lawful in itself, though not necessary from itself; it can never be necessary to do that which is unlawful. Of the first sort they esteem occasional communion, and the other of the latter. Some time is spent [by the opponent] in taking off an exception unto this inference from the practise of our Saviour, who had occasional communion with the Jews in the Temple and ynagogues, which he proves to have been constant and perpetual, and not occasional only, and that He prescribed the same practise unto his disciples. But I think this labour might have been spared. For there is nothing more clear and certain than that our Lord Jesus Christ did join with the Jews in the observance of God’s institutions among them, on the one hand; and on the other, that he never joined with them in the observance of their own traditions and Pharasaical impositions, but warned all his disciples to avoid them and refuse them [Mt. 15], whose example we desire to follow; for concerning all such observances in the Church, he pronounced that sentence, ‘Every plant that my Heavenly Father has not planted shall be rooted up.&#x27;</p></blockquote>

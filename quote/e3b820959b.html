<main class="wrap"><figure class="quote" id="q-e3b820959b" data-kw="">
<blockquote><p>1.2.1 We are all, by nature, void of all strength and ability to perform acceptably that holiness and righteousness which the law requires, and are dead in trespasses and sins, and children of wrath, by the sin of our first father, Adam, as the Scripture witnesses (Rom. 5:12, 15, 18, 19; Eph. 2: 1-3; Rom. 8:7, 8). This doctrine of original sin, which Protestants generally profess, is a firm basis and groundwork to the assertion now to be proved, and to many other assertions in this whole discourse. If we believe it to be true, we cannot rationally encourage ourselves to attempt a holy practice, until we are acquainted with some powerful and effectual means to enable us to do it. While man continued upright, in the image of God, as he was at first created (Eccles. 7:29; Gen. 1:27), he could do the will of God sincerely, as soon as he knew it; but, when he was fallen, he was quickly afraid, because of his nakedness; but could not help it at all, until God discovered to him the means of restoration (Gen. 3:10, 15). Say to a strong healthy servant, ‘Go’, and he goes; ‘Come’, and he comes; ‘Do this’, and he does it; but a bedridden servant must know first how he may be enabled. No doubt the fallen angels knew the necessity of holiness, and trembled at the guilt of their sin; but they knew of no means for them to attain to holiness effectually, and so continue still in their wickedness. It was in vain for Samson to say, ‘I will go out as at other times before, and shake myself,’ when he had sinned away his strength (Judg. 16:20). Men show themselves strangely forgetful, or hypocritical, in professing original sin their prayers, catechisms and confessions of faith, and yet urging on themselves and others the practice of the law, without the consideration of any strengthening, enlivening means – as if there were no want of ability, but only of activity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Mystery of Sanctification (1692)</cite></span></figcaption>

</figure><figure class="quote" id="q-125c99f4f5" data-kw="">
<blockquote><p>The gospel method of sanctification, as well as of justification, lies so far out of the ken of natural reason, that if all the rationalists in the world, philosophers and divines, had consulted together…” Thomas Boston, Preface to The Marrow of Modern Divinity, to lay down a plan for repairing the lost image of God in man, they had never hit upon that which the divine wisdom has pitched upon, viz: that sinners should be sanctified in Jesus Christ (1 Cor 1:2), by faith in him (Acts 26:18); nay, being laid before them, they would have rejected it with disdain, as foolishness (1 Cor 1:23).</p></blockquote>

</figure><figure class="quote" id="q-0b2ac2e5f1" data-kw="">
<blockquote><p>…in a man regenerate, there are two contrary qualities inherent in every faculty: 1. Grace, in a rectified holy inclination to goodness, infused into it. 2. Corruption in a vitious quality disposing it to evil. These two qualities abide in the regenerate, and oppose one another… let us proceed to declare what is a regenerate man’s resistance that he makes against the working of grace in hindering the performance of any good work: which you shall perceive by these two conclusions: 1. A man regenerate so far forth as he is Spiritual, never resists the work of grace, but is constantly most willing and forward to the performance of all holy actions. … 2. That a man regenerate, so far forth as he is carnal, does always resist the work of grace, being unwilling and backward to perform any holy action. … To conclude this point, there is in every regenerate man a possibility or power of resistence always remaining so long as any corruption abides in him, which will perpetually make some opposition more or less in the performance of every good work. But for the prevailing act of resistency whereby such good works might be quite hindered, we affirm that by the power of assisting grace effectually aiding the regenerate faculties, that act is taken away. The flesh may strive, but the Spirit does overcome… a victory indeed certain in regard of the event, but with some uncertainty in the combat, wherein Israel is sometime put unto the worst. For you are to note that albeit in the general as touching those main and principal acts of beleeving, repenting, persevering in obedience, etc. grace does work so effectually with man’s regenerate will that corruption cannot hinder it in the exercise of those acts: nevertheless, in many particular actions after his first conversion in the continued practice of sanctification, he may obey the enticings of his corrupt concupiscence, against the motions of the Spirit of grace. For many times in sundry particulars of Christian practice God is pleased to deny that effectual assistance which at other times He affords, and then He leaves us unto our own strength, for experiment to try what is in us, for humiliation in discovery of our weakness unto us, for exercise of Christian watchfulness in making diligent use of all gracious helps, and the like good purposes. … But these desertions are not perpetual: corruption may for a time let [prevent] the exercise of some particular graces, but in all and always it shall never hinder: God who has given unto a regenerate man a power to believe by the changing of his will through the infusion of a constant inclination to all spiritual good, will also cause the act of believing infallibly to ensue, by the assistance of cooperating grace, so powerfully strengthening the regenerate will, and so effectually restraining the rebellious motions of corruption that the will shall not choose but do that which above all things in the world it most desires to do, namely, believe and obey the Gospel.</p></blockquote>

p;text=to%20do%2C%20namely%2C%20believe%20and%20obey%20the%20Gospel" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f12b10fe99" data-kw="">
<blockquote><p>There is no imagination wherewith man is besotted, more foolish, none so pernicious, as this, — that persons not purified, not sanctified, not made holy in their life, should afterwards be taken into that state of blessedness which consists in the enjoyment of God. Neither can such persons enjoy God, nor would God be a reward to them. — Holiness indeed is perfected in heaven: but the beginning of it is invariably confined to this world.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

<blockquote><p>Firstly, when we reflect upon God with whom man has to do, He is the just Judge of all the earth, the thrice-holy God, standing with the unregenerate sinner in the relationship of the covenant of works; in the which all His attributes and perfections are armed against the sinner, and His sword is unsheathed to do away with him; his tears and sighs, reformation of life and seeking of God, can in no way suffice Him; His justice must be satisfied before He can show friendship with the sinner; but neither angels nor men can satisfy it; it is Immanuel alone who has done it, but none has a part in Him without faith. Hence God being just, men cannot please Him without faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-comrie.html">Alexander Comrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ABC of Faith</cite>, trans. J. Marcus Banfield (1746; Ossett: Zoar Publications, 1978), xviii.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-09d701cb0b" data-kw="">
<blockquote><p>See hence the errors of those who imagine that it was a covenant of works which God entered into with Israel at Mount Sinai. Indeed, if the promise had followed after the commandments of the law; and if God had said, Keep these commandments, and, upon your so doing, I will be the Lord your God; in this, case it had been a pure covenant of works: whether perfect or sincere obedience had been the condition, it is all one; still the reward would have been in a way of pactional debt as in the first covenant.

But, as you heard the order of the covenant of works, or the connection betwixt the precept and promise, as it was laid in that covenant, it is now inverted: for now God first promises, in a way of sovereign grace, to be the Lord our God and Redeemer, which is the substance and sum of the new covenant; and having made such a grant of grace, to be received by faith, without, or before any works of obedience can be performed by us, be immediately subjoins the law of nature in ten words, showing us what is good, and what the Lord our God requires of us, not as a condition of his own gracious grant, but as a testimony of our love and gratitude to him, who promises, of his free and sovereign grace, to be the Lord our God.

So that, I say, it was God’s covenant of grace that was promulgated at Mount Sinai, and the law was added to it because of transgression, and graffed upon it as a rule of obedience. And whatever covenants or engagements to duty we read of, whether national or personal, still they went upon the foundation of grace laid in God’s covenant of grace; and in so far as Israel, or any else, go off from this foundation in their engagements to duty, in so far they pervert the design of the promise and law annexed to it, and turn back to a covenant of works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treasure of Gospel-Grace Digged out of Mount Sinai, or, The Sinner s Claim of Right Cleared from God’s Covenant with Israel at Sinai. A Sermon Preached on a Sacramental Occasion at Kinglassie’ in The Whole Works of Ebenezer Erskine</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-762b7e58fd" data-kw="">
<blockquote><p>We can never state our thoughts aright in this matter, unless we have a clear apprehension of, and satisfaction in, the introduction of grace by Jesus Christ into the whole of our relation unto God, with its respect unto all parts of our obedience. There was no such thing, nothing of that nature or kind, in the first constitution of that relation and obedience by the law of our creation. We were made in a state of immediate relation unto God in our own persons, as our creator, preserver, and rewarder. There was no mystery of grace in the covenant of works. No more was required unto the consummation of that state but what was given us in our creation, enabling us unto rewardable obedience. “Do this, and live,” was the sole rule of our relation unto God. There was nothing in religion originally of that which the gospel celebrates under the name of the grace, kindness, and love of God, whence all our favourable relation unto God doth now proceed, and whereinto it is resolved; nothing of the interposition of a mediator with respect unto our righteousness before God, and acceptance with him;—which is at present the life and soul of religion, the substance of the gospel, and the centre of all the truths revealed in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 5 (Edinburgh: T&amp;T Clark, n.d.), 44–45.</span></figcaption>

</figure><figure class="quote" id="q-24f775c1d2" data-kw="">
<blockquote><p>In a day when the covenant of works is being attacked by Federal Visionists and others who, while generally orthodox, have allowed their biblicism to get the better of them, we can find encouragement in the words of John Paul:

The covenant of works is a doctrine which has stood the test of examination during a series of centuries: the friction of opposition has only tended to brighten its evidence: its advocates are daily increasing, and the myriads of those virulent pamphlets published against it, have, like Jonah’s gourd, “sprung up in a night and perished in a night.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-paul.html">John Paul</a></span><span class="wk"><span class="lbl">Work:</span> <cite>reeds and confessions defended, in a series of letters addressed to the author of “The battle of the two dialogues”</cite>, (Belfast, 1819) in Stewart Bates (ed.), Works of the late Rev. John Paul, D.D., of Carrickfergus. With a memoir and introduction by the editor (Belfast, 1855), p. 352.</span></figcaption>

</figure><figure class="quote" id="q-7879149db4" data-kw="">
<blockquote><p>Vers. 14. Blotting out the hand-writing of Ordinances that was against us, which was contrary to us, and took it out of the way, nailing it to his Cross.

Argum. 9. In which also he explains how Christ obtained remission of sins for us, viz. by taking away the hand-writing, in this sense. The Covenant of works is an hand-writing, established partly in threatnings, partly in appointed positive Ceremonials (excluding the Gentiles from the Church) was against us, and contrary to us. But Christ hath blotted out this hand-writing, taking it out of the way, and nailing it to his Cross: Therefore you must not look back to the legal Covenant or ceremonial appointments in them, to seek for any thing, neither must ye depart in the least from the death of Christ (by which ye are delivered from that hand-writing.)

He compares this Covenant of works, with its appurtenances, to an hand-writing, by which any one binds himself for the paying of a debt; for whosoever are convicted of sin by the light of nature, are also by the force of the Covenant of Works, obnoxious to wrath, and as often as we are convinced of sin, so often also by nature we confirm the punishment of sin, or the condition of the legal Covenant, by the judgement of our consciences against our selves, as by an hand-writing: The conscience of every one performs this much more, which hath received the written Law, and daily bears the punishment of the Law, for the breaking of it.

But chiefly all justiciaries are compelled to subscribe to this hand-writing, who acknowledge no righteousness besides inherent, or that which is by works: Of which number were those that Judaized, and observers of Ceremonies, who adhered to this Covenant, seeking Righteousness by works, and the appointed Ceremonies: For by how much they did endeavour by this means more manifestly to establish their own Righteousness, by so much the more openly they did derive the punishment of the Law broken, by the force of the Covenant, upon themselves: For no man enters a Covenant, but he also admits all the conditions of the Covenant.

The hand-writing is said to be in Ordinances, or rather subscribed to Ordinances, so far as they took upon them those commands, or Legal Ordinances, that they might be perfected in themselves, they did withal oblige themselves to bear the punishment of the breach of those commands.

He calls it the hand-writing against us, or contrary to us, partly because it separated the Jews from the Gentiles, and the Gentiles from the Jews; Partly because it was a yoke, which neither they nor their Fathers could bear; Partly because as often as they did any work of the Law, either moral or ceremonial to be justified thereby, so often by the imperfection of their work, and the profession of their imperfection in the use of the Levitical Ceremonies, they did argue themselves guilty, or rather did acknowledge themselves guilty of death.

As for example, when they offered Sacrifices, and did repeat them, they not only acknowledged themselves sinners against the Moral Law, but did also really confess that their frequent Sacrifices could not purge their consciences from sin, and so the hand-writing of the Covenant of works was always contrary to them: But Christ hath blotted out this hand-writing, and took it out of the way, nailing it to his Cross, insomuch as he for the sake of them that were his, hath paid for the redeemed the penalty due upon the hand-writing by the death of his Cross, and hath completed and abolished the positive Ordinances concerning those vanishing Ceremonies, by the real Sacrifice of his own body once offered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), pp 139-40.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Vers. 14. Blotting out the hand-writing of Ordinances that was against us, which was contrary to us, and took it out of the way, nailing it to his Cross.

Argum. 9. In which also he explains how Christ obtained remission of sins for us, viz. by taking away the hand-writing, in this sense. The Covenant of works is an hand-writing, established partly in threatnings, partly in appointed positive Ceremonials (excluding the Gentiles from the Church) was against us, and contrary to us. But Christ hath blotted out this hand-writing, taking it out of the way, and nailing it to his Cross: Therefore you must not look back to the legal Covenant or ceremonial appointments in them, to seek for any thing, neither must ye depart in the least from the death of Christ (by which ye are delivered from that hand-writing.)

He compares this Covenant of works, with its appurtenances, to an hand-writing, by which any one binds himself for the paying of a debt; for whosoever are convicted of sin by the light of nature, are also by the force of the Covenant of Works, obnoxious to wrath, and as often as we are convinced of sin, so often also by nature we confirm the punishment of sin, or the condition of the legal Covenant, by the judgement of our consciences against our selves, as by an hand-writing: The conscience of every one performs this much more, which hath received the written Law, and daily bears the punishment of the Law, for the breaking of it.

But chiefly all justiciaries are compelled to subscribe to this hand-writing, who acknowledge no righteousness besides inherent, or that which is by works: Of which number were those that Judaized, and observers of Ceremonies, who adhered to this Covenant, seeking Righteousness by works, and the appointed Ceremonies: For by how much they did endeavour by this means more manifestly to establish their own Righteousness, by so much the more openly they did derive the punishment of the Law broken, by the force of the Covenant, upon themselves: For no man enters a Covenant, but he also admits all the conditions of the Covenant.

The hand-writing is said to be in Ordinances, or rather subscribed to Ordinances, so far as they took upon them those commands, or Legal Ordinances, that they might be perfected in themselves, they did withal oblige themselves to bear the punishment of the breach of those commands.

He calls it the hand-writing against us, or contrary to us, partly because it separated the Jews from the Gentiles, and the Gentiles from the Jews; Partly because it was a yoke, which neither they nor their Fathers could bear; Partly because as often as they did any work of the Law, either moral or ceremonial to be justified thereby, so often by the imperfection of their work, and the profession of their imperfection in the use of the Levitical Ceremonies, they did argue themselves guilty, or rather did acknowledge themselves guilty of death.

As for example, when they offered Sacrifices, and did repeat them, they not only acknowledged themselves sinners against the Moral Law, but did also really confess that their frequent Sacrifices could not purge their consciences from sin, and so the hand-writing of the Covenant of works was always contrary to them: But Christ hath blotted out this hand-writing, and took it out of the way, nailing it to his Cross, insomuch as he for the sake of them that were his, hath paid for the redeemed the penalty due upon the hand-writing by the death of his Cross, and hath completed and abolished the positive Ordinances concerning those vanishing Ceremonies, by the real Sacrifice of his own body once offered.”

— David Dickson, An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened, (London: Francis Eglesfield, 1659), pp 139-40.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVers.+14.+Blotting+out+the+hand-writing+of+Ordinances+that+was+against+us%2C+which+was+contrary+to+us%2C+and+took+it+out+of+the+way%2C+nailing+it+to+his+Cross.%0A%0AArgum.+9.+In+which+also+he+explains+how+Christ+obtained+remission+of+sins+for+us%2C+viz.+by+taking+away+the+hand-writing%2C+in+this+sense.+The+Covenant+of+works+is+an+hand-writing%2C+established+partly+in+threatnings%2C+partly+in+appointed+positive+Ceremonials+%28excluding+the+Gentiles+from+the+Church%29+was+against+us%2C+and+contrary+to+us.+But+Christ+hath+blotted+out+this+hand-writing%2C+taking+it+out+of+the+way%2C+and+nailing+it+to+his+Cross%3A+Therefore+you+must+not+look+back+to+the+legal+Covenant+or+ceremonial+appointments+in+them%2C+to+seek+for+any+thing%2C+neither+must+ye+depart+in+the+least+from+the+death+of+Christ+%28by+which+ye+are+delivered+from+that+hand-writing.%29%0A%0AHe+compares+this+Covenant+of+works%2C+with+its+appurtenances%2C+to+an+hand-writing%2C+by+which+any+one+binds+himself+for+the+paying+of+a+debt%3B+for+whosoever+are+convicted+of+sin+by+the+light+of+nature%2C+are+also+by+the+force+of+the+Covenant+of+Works%2C+obnoxious+to+wrath%2C+and+as+often+as+we+are+convinced+of+sin%2C+so+often+also+by+nature+we+confirm+the+punishment+of+sin%2C+or+the+condition+of+the+legal+Covenant%2C+by+the+judgement+of+our+consciences+against+our+selves%2C+as+by+an+hand-writing%3A+The+conscience+of+every+one+performs+this+much+more%2C+which+hath+received+the+written+Law%2C+and+daily+bears+the+punishment+of+the+Law%2C+for+the+breaking+of+it.%0A%0ABut+chiefly+all+justiciaries+are+compelled+to+subscribe+to+this+hand-writing%2C+who+acknowledge+no+righteousness+besides+inherent%2C+or+that+which+is+by+works%3A+Of+which+number+were+those+that+Judaized%2C+and+observers+of+Ceremonies%2C+who+adhered+to+this+Covenant%2C+seeking+Righteousness+by+works%2C+and+the+appointed+Ceremonies%3A+For+by+how+much+they+did+endeavour+by+this+means+more+manifestly+to+establish+their+own+Righteousness%2C+by+so+much+the+more+openly+they+did+derive+the+punishment+of+the+Law+broken%2C+by+the+force+of+the+Covenant%2C+upon+themselves%3A+For+no+man+enters+a+Covenant%2C+but+he+also+admits+all+the+conditions+of+the+Covenant.%0A%0AThe+hand-writing+is+said+to+be+in+Ordinances%2C+or+rather+subscribed+to+Ordinances%2C+so+far+as+they+took+upon+them+those+commands%2C+or+Legal+Ordinances%2C+that+they+might+be+perfected+in+themselves%2C+they+did+withal+oblige+themselves+to+bear+the+punishment+of+the+breach+of+those+commands.%0A%0AHe+calls+it+the+hand-writing+against+us%2C+or+contrary+to+us%2C+partly+because+it+separated+the+Jews+from+the+Gentiles%2C+and+the+Gentiles+from+the+Jews%3B+Partly+because+it+was+a+yoke%2C+which+neither+they+nor+their+Fathers+could+bear%3B+Partly+because+as+often+as+they+did+any+work+of+the+Law%2C+either+moral+or+ceremonial+to+be+justified+thereby%2C+so+often+by+the+imperfection+of+their+work%2C+and+the+profession+of+their+imperfection+in+the+use+of+the+Levitical+Ceremonies%2C+they+did+argue+themselves+guilty%2C+or+rather+did+acknowledge+themselves+guilty+of+death.%0A%0AAs+for+example%2C+when+they+offered+Sacrifices%2C+and+did+repeat+them%2C+they+not+only+acknowledged+themselves+sinners+against+the+Moral+Law%2C+but+did+also+really+confess+that+their+frequent+Sacrifices+could+not+purge+their+consciences+from+sin%2C+and+so+the+hand-writing+of+the+Covenant+of+works+was+always+contrary+to+them%3A+But+Christ+hath+blotted+out+this+hand-writing%2C+and+took+it+out+of+the+way%2C+nailing+it+to+his+Cross%2C+insomuch+as+he+for+the+sake+of+them+that+were+his%2C+hath+paid+for+the+redeemed+the+penalty+due+upon+the+hand-writing+by+the+death+of+his+Cross%2C+and+hath+completed+and+abolished+the+positive+Ordinances+concerning+those+vanishing+Ceremonies%2C+by+the+real+Sacrifice+of+his+own+body+once+offered.%E2%80%9D%0A%0A%E2%80%94+David+Dickson%2C+An+exposition+of+all+St.+Paul%E2%80%99s+epistles+together+with+an+explanation+of+those+other+epistles+of+the+apostles+St.+James%2C+Peter%2C+John+%26+Jude%3A+wherein+the+sense+of+every+chapter+and+verse+is+analytically+unfolded+and+the+text+enlightened%2C+%28London%3A+Francis+Eglesfield%2C+1659%29%2C+pp+139-40.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7879149db4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7879149db4.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/06/04/david-dickson-on-christ-blotting-out-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-54aff0dda8" data-kw="">
<blockquote><p>[Margin Note:] Evangelists are now ceased as well as apostles. 2. Synods from Acts 15 and Acts 13 may lend men, authorized with pastoral power, to heathens to spread the Gospel; and private men as no pastors, but as private men, are intruders [though] authorized by Mr. Hooker, for they have no promise, such as pastors have by Mt. 28:19-20; Mk. 16:15-17; Jer. 1:6,17-18, to plant Churches among the heathens; nor is there a warrant to say that evangelists are ordinary officers left by Christ to plant Churches. If Hooker have any ground from Eusebius or Scripture for evangelists now, or in Trajan’s time, he must show that they have the gift of tongues: for how could evangelists be fellow-helpers to preach the Gospel to the Churches planted by the apostles if they were not an extraordinary office only? See those divines in the margin, and my learned and dear brother, Mr. George Gillespie, Miscellaneous Questions, ch. 7. If the Church should send any to the heathen any way rip[…] for the Gospel, these could be no other than ordinary pastors to them. [Margin Note:] Tilen, Syntagma, disputation 19, thesis 38, Apostolorum vice, ubi res poscebat, fungebantur. Professors of Leiden, Synopsis of Pure Theology, disputation [??], thesis 17, p. 605; [William] Bucanus, in loc., Common place 42, question 45; Calvin, Commentary on Eph. 4, Apostolis proximi erant Evangelistae, et munus affine habebant. Bullinger, ibid., In plebe potissimum e […]udienda; Zanchi, Commentary on the same, Apostolorum Comites—non immediate mi […]—sed assumebantur. Dr. Robert Boyd from Trocherig, Commentary on Eph. 4, p. 493, Apostolorum Comites modo huc, modo illuc missi, modo re vocati ab Apostolis, extraordinarii.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (1658), p. 472</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/evangelism.html">Evangelism</a></span></div>

<blockquote><p>Thirdly, the Reformed Churches may send pastors to the Indians, for that which Acosta says of Jesuits we may with better reason say it of ourselves: That pastors are as soldiers, and some soldiers are to keep order and remain in a certain place; others run up and down in all places; So some are affixed to a congregation, to feed them; others may be sent to those people who have not heard of the Gospel, which sending is ordinary and lawful in respect of pastors sending and the pastors who are sent, because in pastors, even after the apostles be dead, there remains a general pastoral care for all the Churches of Christ. Thus sending is not ordinary, but extraordinary in respect of those to whom the pastors are sent; yet is it a pastoral sending [as opposed to this being absent in congregationalism in such a case].</p></blockquote>

</figure><figure class="quote" id="q-2954cf3d83" data-kw="">
<blockquote><p>Christ preached the Gospel to those that He knew sinned against the Holy Ghost, to the Pharisees who persecuted Christ to death and others, Mt. 12:31-34; Jn. 15:22-25; Jn. 7:28-29; Jn. 12:35-38; Jn. 10:31-32; Jn. 11:47-48… the word is a converting ordinance out of question, and preached to heathen and to the non-converted, though they refuse to embrace and believe the Gospel, and refuse to entertain the preachers of it: as is clear, Acts 19:22-25; Tit. 1:10-13; 2 Tim. 3:25-27. The texts that Master Prynne alledges, that the Gospel should not be preached to heathen who refuse to embrace and believe the Gospel, to wit, Mt. 10:14-15; Lk. 9:5; Acts 13:46, are to no purpose, for Mt. 10; Lk. 9, is but a temporary commandment, given for a time, that the disciples should depart from those houses of Judea (there is nothing of the heathen; but by the contrary the apostles are forbidden to go to Samaritans or gentiles at all, Mt. 10:5-6 [which was unique to those circumstances]) who would not receive the peace of God in the Gospel, which precept the apostles in the story of the Acts did not observe, but preached the Gospel to many heathen who refused to embrace and believe the Gospel: As Acts 16 and 17, and 19:2. The place Acts 13:15 is meant of the blaspheming Jews, to whom Paul preached long after they persecuted and stoned the prophets, and had killed the Lord of life, Acts▪2 and 4, and 8, and 9; Mt. 23:37-38. 3. Those places, are to better color of purpose brought by Arminians and Socinians to prove that the Gospel is preached to people for their good entertainment thereof, and denied to others for their unworthiness, and because they will not welcome it; So the Arminians in the conference at Hague, pp. 87-89, God sends the Gospel not according to his absolute will, sed ob alias causas in homine latent•s, for secret causes in man. Arminius, Against Perkins, p. 199, ‘The will of God in sending the Gospel has causes in the will of man according to that,’ habenti dabitur: So Corvinus, Ad Wallachros, p. 44. Socinus, Commentary on 1 Jn. 4, p. 307 says the same: and Mr. Prynne is pleased in the same sense to cite them, I conceive imprudently, for I believe that Reverend and learned man does hate those impious sects, the enemies of the grace of God; but truly if this be a rule to pastors to spread the Gospel, that they are to offer and give the pearl of the preached Gospel to those that willingly receive it and harbour the preachers, and presently to depart and preach no more the Word of the Kingdom to those who refuse it, as the places Mt. 10:14 and Lk. 9:5 carry that sense, because they are heathens who refuse to embrace and believe the Gospel, and harbor the preachers, as (the worthy divine says) conceiving that to be a casting of pearls to dogs and swine; I see not how the preachers and spreaders of the Gospel to the heathen are to believe that God out of mere grace and the good pleasure of his will, without respect to good or bad deserving, sends the Gospel to some and denies it to others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), ch. 23, pp. 516-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/evangelism.html">Evangelism</a></span></div>

e will of man according to that,’ habenti dabitur: So Corvinus, Ad Wallachros, p. 44. Socinus, Commentary on 1 Jn. 4, p. 307 says the same: and Mr. Prynne is pleased in the same sense to cite them, I conceive imprudently, for I believe that Reverend and learned man does hate those impious sects, the enemies of the grace of God; but truly if this be a rule to pastors to spread the Gospel, that they are to offer and give the pearl of the preached Gospel to those that willingly receive it and harbour the preachers, and presently to depart and preach no more the Word of the Kingdom to those who refuse it, as the places Mt. 10:14 and Lk. 9:5 carry that sense, because they are heathens who refuse to embrace and believe the Gospel, and harbor the preachers, as (the worthy divine says) conceiving that to be a casting of pearls to dogs and swine; I see not how the preachers and spreaders of the Gospel to the heathen are to believe that God out of mere grace and the good pleasure of his will, without respect to good or bad deserving, sends the Gospel to some and denies it to others.”

— Samuel Rutherford, The Divine Right of Church Government (London, 1646), ch. 23, pp. 516-18">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CChrist+preached+the+Gospel+to+those+that+He+knew+sinned+against+the+Holy+Ghost%2C+to+the+Pharisees+who+persecuted+Christ+to+death+and+others%2C+Mt.+12%3A31-34%3B+Jn.+15%3A22-25%3B+Jn.+7%3A28-29%3B+Jn.+12%3A35-38%3B+Jn.+10%3A31-32%3B+Jn.+11%3A47-48%E2%80%A6+the+word+is+a+converting+ordinance+out+of+question%2C+and+preached+to+heathen+and+to+the+non-converted%2C+though+they+refuse+to+embrace+and+believe+the+Gospel%2C+and+refuse+to+entertain+the+preachers+of+it%3A+as+is+clear%2C+Acts+19%3A22-25%3B+Tit.+1%3A10-13%3B+2+Tim.+3%3A25-27.+The+texts+that+Master+Prynne+alledges%2C+that+the+Gospel+should+not+be+preached+to+heathen+who+refuse+to+embrace+and+believe+the+Gospel%2C+to+wit%2C+Mt.+10%3A14-15%3B+Lk.+9%3A5%3B+Acts+13%3A46%2C+are+to+no+purpose%2C+for+Mt.+10%3B+Lk.+9%2C+is+but+a+temporary+commandment%2C+given+for+a+time%2C+that+the+disciples+should+depart+from+those+houses+of+Judea+%28there+is+nothing+of+the+heathen%3B+but+by+the+contrary+the+apostles+are+forbidden+to+go+to+Samaritans+or+gentiles+at+all%2C+Mt.+10%3A5-6+%5Bwhich+was+unique+to+those+circumstances%5D%29+who+would+not+receive+the+peace+of+God+in+the+Gospel%2C+which+precept+the+apostles+in+the+story+of+the+Acts+did+not+observe%2C+but+preached+the+Gospel+to+many+heathen+who+refused+to+embrace+and+believe+the+Gospel%3A+As+Acts+16+and+17%2C+and+19%3A2.+The+place+Acts+13%3A15+is+meant+of+the+blaspheming+Jews%2C+to+whom+Paul+preached+long+after+they+persecuted+and+stoned+the+prophets%2C+and+had+killed+the+Lord+of+life%2C+Acts%E2%96%AA2+and+4%2C+and+8%2C+and+9%3B+Mt.+23%3A37-38.+3.+Those+places%2C+are+to+better+color+of+purpose+brought+by+Arminians+and+Socinians+to+prove+that+the+Gospel+is+preached+to+people+for+their+good+entertainment+thereof%2C+and+denied+to+others+for+their+unworthiness%2C+and+because+they+will+not+welcome+it%3B+So+the+Arminians+in+the+conference+at+Hague%2C+pp.+87-89%2C+God+sends+the+Gospel+not+according+to+his+absolute+will%2C+sed+ob+alias+causas+in+homine+latent%E2%80%A2s%2C+for+secret+causes+in+man.+Arminius%2C+Against+Perkins%2C+p.+199%2C+%E2%80%98The+will+of+God+in+sending+the+Gospel+has+causes+in+the+will+of+man+according+to+that%2C%E2%80%99+habenti+dabitur%3A+So+Corvinus%2C+Ad+Wallachros%2C+p.+44.+Socinus%2C+Commentary+on+1+Jn.+4%2C+p.+307+says+the+same%3A+and+Mr.+Prynne+is+pleased+in+the+same+sense+to+cite+them%2C+I+conceive+imprudently%2C+for+I+believe+that+Reverend+and+learned+man+does+hate+those+impious+sects%2C+the+enemies+of+the+grace+of+God%3B+but+truly+if+this+be+a+rule+to+pastors+to+spread+the+Gospel%2C+that+they+are+to+offer+and+give+the+pearl+of+the+preached+Gospel+to+those+that+willingly+receive+it+and+harbour+the+preachers%2C+and+presently+to+depart+and+preach+no+more+the+Word+of+the+Kingdom+to+those+who+refuse+it%2C+as+the+places+Mt.+10%3A14+and+Lk.+9%3A5+carry+that+sense%2C+because+they+are+heathens+who+refuse+to+embrace+and+believe+the+Gospel%2C+and+harbor+the+preachers%2C+as+%28the+worthy+divine+says%29+conceiving+that+to+be+a+casting+of+pearls+to+dogs+and+swine%3B+I+see+not+how+the+preachers+and+spreaders+of+the+Gospel+to+the+heathen+are+to+believe+that+God+out+of+mere+grace+and+the+good+pleasure+of+his+will%2C+without+respect+to+good+or+bad+deserving%2C+sends+the+Gospel+to+some+and+denies+it+to+others.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government+%28London%2C+1646%29%2C+ch.+23%2C+pp.+516-18&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2954cf3d83.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2954cf3d83.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/evangelism#:~:text=Christ%20preached%20the%20Gospel%20to%20those,some%20and%20denies%20it%20to%20others&amp;text=Christ%20preached%20the%20Gospel%20to%20those%20that%20He&amp;text=Gospel%

<main class="wrap"><figure class="quote" id="q-1f569c2b03" data-kw="">
<blockquote><p>Transubstantiation (or the change of the substance of Bread and Wine) in the Supper of the Lord, cannot be proved by holy Writ; but is repugnant to the plain words of Scripture, overthroweth the nature of a Sacrament, and hath given occasion to many superstitions. The Body of Christ is given, taken, and eaten, in the Supper, only after an heavenly and spiritual manner. And the mean whereby the Body of Christ is received and eaten in the Supper is Faith. The Sacrament of the Lord&#x27;s Supper was not by Christ&#x27;s ordinance reserved, carried about, lifted up, or worshipped.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-england.html">Church of England</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Thirty-Nine Articles</cite>, 1563, Art. 28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/transubstantiation.html">Transubstantiation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0286a9a64d" data-kw="">
<blockquote><p>While the grace of God generally operates mediately, it is not inherent in the means as a divine deposit, but accompanies the use of these. This must be maintained in opposition to the Roman Catholics, the High Church Anglicans, and the Lutherans, who proceed on the assumption that the means of grace always operate in virtue of an inherent power, though their operation may be made ineffective by the condition or attitude of the recipient. Protestants, on the other hand, teach that the sacraments are not absolutely necessary unto salvation, but are obligatory in view of the divine precept.… That they are not absolutely necessary unto salvation, follows… from the fact that Scripture mentions only faith as the instrumental condition of salvation… and from the fact that the sacraments do not originate faith but presuppose it, and are administered where faith is assumed, Acts 2:41; 16:14,15,30,33; I Cor. 11:23-32; and from the fact that many were actually saved without the use of the sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, Means of Grace; Necessity of the Sacraments</span></figcaption>

</figure><figure class="quote" id="q-485a9633bd" data-kw="">
<blockquote><p>Do the sacraments of the New Testament work grace so physically that they effect and contain it ex opere operato, whether faith and devotion are present or not? Or are they rather efficacious signs and seals of grace? The former we deny; the latter we affirm against the Romanists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Topic 19, Q. 8, §§ 1–6</span></figcaption>

</figure><figure class="quote" id="q-8a64591cf5" data-kw="">
<blockquote><p>Third, their idolatry exceeds the idolatry of the heathen, in that they worship a breaden god, or Christ in and under the forms of bread and wine. And if Christ according to His humanity be absent from the earth, as I have proved, the popish host is as abominable an idol as ever was.</p></blockquote>

</figure><figure class="quote" id="q-6d5df55eca" data-kw="">
<blockquote><p>We justly blame the bishops of Rome, who, without the word of God, without the authority of the holy fathers, without any example of antiquity, after a new guise, do not only set before the people the sacramental bread to be worshipped as God, but do also carry about the same upon an ambling horse, whithersoever themselves journey, as in old times the Persians&#x27; fire, and the relics of the goddess Isis, were solemnly carried about in procession: and have brought the Sacraments of Christ to be used now as a stage play and a solemn sight: to the end, that men&#x27;s eyes should be fed with nothing else but with mad gazings and foolish gauds, in the self-same matter, wherein the death of Christ ought diligently to be beaten into our hearts, and wherein also the mysteries of our redemption ought with all holiness and reverence to be executed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b4bfd4974e" data-kw="">
<blockquote><p>I believe that God never expects us to feel no suffering or pain when it pleases Him to visit us with affliction. There are great mistakes upon this point. Submission to God’s will is perfectly compatible with intense and keen suffering under the chastisements of that will. Troubles in fact not felt, are no troubles at all. To feel trouble deeply, and yet submit to it patiently is that which is required of a Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bishop J. C. Ryle’s Autobiography: The Early Years</cite>, ed. Andrew Atherstone (Edinburgh: Banner of Truth, 2017), pp 94-95.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0763bb4a45" data-kw="">
<blockquote><p>In the next place, labour for patience; but such as must be ruled by reason, and not blockish. To this end consider, first, whence the sickness is. It is from God who is powerful. [Consider] that we shall get nothing by striving or murmuring; that we cannot resist him so but he will have his will fulfilled upon us; and therefore let us humble ourselves under the mighty hand of God.

Then also, consider it comes from God, who is thy Father, and therefore loveth thee. What then though the cup be bitter? Shall I not drink of the cup which my father giveth me to drink of? Know also, that all the circumstances of thy sickness are ordered by him, the degree and time are limited by him, he knows what is needful and fitting, he is Lord of life and death, resign thyself therefore to him; and then hath God his end he looks for, viz., that his children should cast themselves on his mercy.

In the next place, remember that thou deservest much worse, and that he shews thee favour in this gentle correction. Remember what Christ hath done for thee, what he hath suffered, what he hath delivered thee from, and what these things are in comparison of those that thou justly deservest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Providence of God</cite>, (1639) in Alexander B. Grossart (ed.), The Works of Richard Sibbes (1862-64; 7 vols, Edinburgh: Banner of Truth, 1977), 5: 44.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

n-patience-in-affliction/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-4e020f04d7" data-kw="">
<blockquote><p>It cannot be concluded that sufferings are not for God, because those who profess themselves to be the people of God are the instruments of them; or that it is not the cross of Christ which is borne, because it is laid on by those who profess Christ. Abel is called the protomartyr, the first sufferer for God; and he suffered by the hand of one who worshipped the same God, with the same kind of worship: both Abel and his persecutor offered sacrifice. Isaac suffered by Ishmael, Gal. iv. 29; yet Ishmael was Abraham’s son, and by him circumcised, and so admitted to the church and its privileges.

Who were those that persecuted the prophets of old, but they who professed themselves to be the peculiar people, and true worshippers of the true God? Jerusalem, the chosen city, killed the prophets, and stoned God’s messengers, Mat. xxiii. 37. Amongst this people, though there was no other people that owned the true God in the world, some persecutors were found in every generation. Even when they utterly disclaimed this, as thinking themselves far enough from being persecutors, yet then are they charged with this guilt by Christ himself, ver. 30, 31. Christ himself suffered by those who took themselves peculiarly to be the people of God. And since the profession of Christ became general, ordinarily a man’s enemies are those of his own house. The bitterest persecutors are those of the same profession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Taking up the Cross in The Practical Works of David Clarkson, B.D., Fellow and Tutor of Clare Hall, Cambridge</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><figure class="quote" id="q-bda3c051e8" data-kw="">
<blockquote><p>A Christian of uncommon excellence to human view sometimes experiences a great affliction, while one of less devoutness, apparently, is only slightly afflicted, or perhaps not at all. This difference is not caused by the degree of demerit in each instance, but by what the Divine eye sees to be required in each case in order to the best development of character.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, (Edinburgh: T &amp; T Clark, 1889), 2: 417.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

— William G.T. Shedd, Dogmatic Theology, (Edinburgh: T &amp; T Clark, 1889), 2: 417.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+Christian+of+uncommon+excellence+to+human+view+sometimes+experiences+a+great+affliction%2C+while+one+of+less+devoutness%2C+apparently%2C+is+only+slightly+afflicted%2C+or+perhaps+not+at+all.+This+difference+is+not+caused+by+the+degree+of+demerit+in+each+instance%2C+but+by+what+the+Divine+eye+sees+to+be+required+in+each+case+in+order+to+the+best+development+of+character.%E2%80%9D%0A%0A%E2%80%94+William+G.T.+Shedd%2C+Dogmatic+Theology%2C+%28Edinburgh%3A+T+%26+T+Clark%2C+1889%29%2C+2%3A+417.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbda3c051e8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bda3c051e8.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/02/10/w-g-t-shedd-on-affliction-and-christian-character/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-7be8fd49ca" data-kw="">
<blockquote><p>It cannot be concluded, they do not suffer for Christ, who have some sin mixed with that which is made the cause of their sufferings, if it be the cause of God indeed, for the substance of it, and they sincere in it for the main. When the people of God are ready to offer up themselves, and what they have for him, he will not reject such a sacrifice for every blemish. Christ had something against the church of Ephesus, something to charge her with as matter of provocation, even when he is speaking of her sufferings, Rev. ii. 4. And yet he owns her as one that had suffered and laboured for his name’s sake, verse 3.

Nor can this be concluded, because of some miscarriage under their sufferings. David, while he was persecuted by Saul, miscarried divers ways, as you may see 1 Sam. xxi. 2, 12, 13, and elsewhere; yet this did not hinder him from being a sufferer for righteousness.

As the Lord has provided a way, that what his people do for him may be accepted as done for him, though there be too many sinful mixtures therein, so he has provided an expedient, that what they suffer for him may be accepted as suffered for him, though there be many flaws therein, both for matter and manner. The Lord Jesus, the advocate of and sacrifice for his people, is effectual for both. When they apply themselves to him, in the exercise of faith and repentance, through his mediation, that which is therein evil shall not be remembered, that which is good therein will be accepted, Rom. xii. 1. How acceptable, see Eph. i. 6, 7.

Licinius, as you may read, Eusebius De vita Constantini, makes an edict, that whosoever did relieve the imprisoned and distressed Christians should suffer the same things that were inflicted upon them. Now, suppose some, out of love to Christ and his afflicted members, should have ventured (as many did indeed) to have relieved them, and yet should have done it too sparingly, or too fearfully, or with some selfish reflections, and should, according to the edict, have suffered for relieving them, here had been some sin mixed with the cause of their sufferings. And yet in this case, since their cause was good, and the cause of Christ, for the substance of it, who would deny but they suffered for Christ?

Or suppose one should suffer because he would not leave praying (which was Daniel’s case, Dan. 6), and yet in his prayer should have some mixture of unbelief, and lukewarmness, and other distempers, which the best cannot always escape, here would be some sin mixed with the cause of sufferings; yet who would deny but that, suffering for doing his duty, he is a sufferer for God?

To proceed a little further: suppose some godly Lutherans should suffer for those great truths of the gospel, which they maintain against the papists, and together with them should suffer for consubstantiation, which indeed is an error, here would be a sin mixed with the cause of their suffering; yet I suppose their laying down their lives for those other great truths of Christ, notwithstanding this sinful mixture, would be accounted a suffering for Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Taking up the Cross in The Practical Works of David Clarkson, B.D., Fellow and Tutor of Clare Hall, Cambridge</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

— David Clarkson, Of Taking up the Cross in The Practical Works of David Clarkson, B.D., Fellow and Tutor of Clare Hall, Cambridge">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+cannot+be+concluded%2C+they+do+not+suffer+for+Christ%2C+who+have+some+sin+mixed+with+that+which+is+made+the+cause+of+their+sufferings%2C+if+it+be+the+cause+of+God+indeed%2C+for+the+substance+of+it%2C+and+they+sincere+in+it+for+the+main.+When+the+people+of+God+are+ready+to+offer+up+themselves%2C+and+what+they+have+for+him%2C+he+will+not+reject+such+a+sacrifice+for+every+blemish.+Christ+had+something+against+the+church+of+Ephesus%2C+something+to+charge+her+with+as+matter+of+provocation%2C+even+when+he+is+speaking+of+her+sufferings%2C+Rev.+ii.+4.+And+yet+he+owns+her+as+one+that+had+suffered+and+laboured+for+his+name%E2%80%99s+sake%2C+verse+3.%0A%0ANor+can+this+be+concluded%2C+because+of+some+miscarriage+under+their+sufferings.+David%2C+while+he+was+persecuted+by+Saul%2C+miscarried+divers+ways%2C+as+you+may+see+1+Sam.+xxi.+2%2C+12%2C+13%2C+and+elsewhere%3B+yet+this+did+not+hinder+him+from+being+a+sufferer+for+righteousness.%0A%0AAs+the+Lord+has+provided+a+way%2C+that+what+his+people+do+for+him+may+be+accepted+as+done+for+him%2C+though+there+be+too+many+sinful+mixtures+therein%2C+so+he+has+provided+an+expedient%2C+that+what+they+suffer+for+him+may+be+accepted+as+suffered+for+him%2C+though+there+be+many+flaws+therein%2C+both+for+matter+and+manner.+The+Lord+Jesus%2C+the+advocate+of+and+sacrifice+for+his+people%2C+is+effectual+for+both.+When+they+apply+themselves+to+him%2C+in+the+exercise+of+faith+and+repentance%2C+through+his+mediation%2C+that+which+is+therein+evil+shall+not+be+remembered%2C+that+which+is+good+therein+will+be+accepted%2C+Rom.+xii.+1.+How+acceptable%2C+see+Eph.+i.+6%2C+7.%0A%0ALicinius%2C+as+you+may+read%2C+Eusebius+De+vita+Constantini%2C+makes+an+edict%2C+that+whosoever+did+relieve+the+imprisoned+and+distressed+Christians+should+suffer+the+same+things+that+were+inflicted+upon+them.+Now%2C+suppose+some%2C+out+of+love+to+Christ+and+his+afflicted+members%2C+should+have+ventured+%28as+many+did+indeed%29+to+have+relieved+them%2C+and+yet+should+have+done+it+too+sparingly%2C+or+too+fearfully%2C+or+with+some+selfish+reflections%2C+and+should%2C+according+to+the+edict%2C+have+suffered+for+relieving+them%2C+here+had+been+some+sin+mixed+with+the+cause+of+their+sufferings.+And+yet+in+this+case%2C+since+their+cause+was+good%2C+and+the+cause+of+Christ%2C+for+the+substance+of+it%2C+who+would+deny+but+they+suffered+for+Christ%3F%0A%0AOr+suppose+one+should+suffer+because+he+would+not+leave+praying+%28which+was+Daniel%E2%80%99s+case%2C+Dan.+6%29%2C+and+yet+in+his+prayer+should+have+some+mixture+of+unbelief%2C+and+lukewarmness%2C+and+other+distempers%2C+which+the+best+cannot+always+escape%2C+here+would+be+some+sin+mixed+with+the+cause+of+sufferings%3B+yet+who+would+deny+but+that%2C+suffering+for+doing+his+duty%2C+he+is+a+sufferer+for+God%3F%0A%0ATo+proceed+a+little+further%3A+suppose+some+godly+Lutherans+should+suffer+for+those+great+truths+of+the+gospel%2C+which+they+maintain+against+the+papists%2C+and+together+with+them+should+suffer+for+consubstantiation%2C+which+indeed+is+an+error%2C+here+would+be+a+sin+mixed+with+the+cause+of+their+suffering%3B+yet+I+suppose+their+laying+down+their+lives+for+those+other+great+truths+of+Christ%2C+notwithstanding+this+sinful+mixture%2C+would+be+accounted+a+suffering+for+Christ.%E2%80%9D%0A%0A%E2%80%94+David+Clarkson%2C+Of+Taking+up+the+Cross+in+The+Practical+Works+of+David+Clarkson%2C+B.D.%2C+Fellow+and+Tutor+of+Clare+Hall%2C+Cambridge&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7be8fd49ca.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7be8fd49ca.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/02/20/david-clarkson-on-those-who-suffer-for-christ-even-when-sin-is-mixed-with-their-sufferings/" rel

<blockquote><p>The third difference which the Schoolmen make, and which only the Papists do hold, is, that the Old Testament did only promise eternal blessings, and the eternal inheritance, and did foreshew them in Types, as in the blood of Sacrifices, Christ’s Blood, in the promised Land, the inheritance of Heaven, and such like: but it did not give them till CHRIST the Testator was dead. But the New Testament doth promise, and also give and exhibit the things promised. This difference is very false and impious, and is easily confuted by the former Doctrine, and by the whole Scriptures. For that which only promiseth, and giveth not, is not a Testament, it is never in force, neither ratified at all; for being in force by the Testator’s Death, it must needs give as well as promise. If the Testator’s Death never come between, then it is no Testament. But the Old is a Testament, and was in force, and did give, and doth give Grace, as well as promise it.

This the whole Scriptures shew; for the Legacies promised and given in Christ’s Will, are Himself, with all his benefits which doe accompany him.

First, his Conception and Birth, most holy without spot, to sanctify our conception in sin, and our unclean birth.

Secondly, His perfect righteousness of life, to make believers righteous.

Thirdly, His Death and Sufferings, to ransom them from eternal death, and Hell, by satisfying for their sins.

Fourthly, His Spirit, with all saving Graces, as Faith, and such like, by which they come to have Communion with him of his Son-ship, inheritance, righteousness, and right to all blessings, Temporal, and Spiritual.

Now though Christ was only promised in the Old Testament, that he should come, and obey, and suffer for man’s redemption; but was not actually exhibited, nor did obey and suffer till the days of the New Testament: yet his Manhood, Birth, Obedience, and Death, were then as effectual to save the faithful, as now they are; And in that respect he is called the Lamb slain from the beginning of the world. Also by the Words of promise in the Old Testament, Christ communicated &amp; gave his Spirit to Adam, Noah, Abraham, David, and all the faithful in the Old Testament, which Spirit wrought in them Faith and perfect Communion with Christ, of his person so far, as to make them sons and heirs of God, of his Death for remission of their sins; of his righteousness for their justification, and of all saving Graces needful to Salvation.

This appears by Enoch’s translation into glory, that he might not see death, and by Elijah’s taking up into Heaven, by virtue of Christ’s Resurrection and Ascension, who is the first fruits from the beginning: Also by that which is said of Abraham, that he by believing came to be counted righteous: And by that which David saith to himself, That God is his portion, Psal. 16. and with him he had all things to make him blessed. Therefore this difference is a blasphemous and wicked fiction, excluding the Church of the Old Testament from Heaven, and all fruition of Christ’s benefits, and from all saving graces, as Regeneration, Remission of sins, Justification, and Redemption, which are the blessings promised and given in the Old Testament.</p></blockquote>

<blockquote><p>I also adduced another passage in which Isaiah exclaims: “‘Hear My words, and your soul shall live; and I will make an everlasting covenant with you, even the sure mercies of David. Behold, I have given Him for a witness to the people: nations which know not Thee shall call on Thee; peoples who know not Thee shall escape to Thee, because of thy God, the Holy One of Israel; for He has glorified Thee.’ This same law you have despised, and His new holy covenant you have slighted; and now you neither receive it, nor repent of your evil deeds. ‘For your ears are closed, your eyes are blinded, and the heart is hardened,’ Jeremiah has cried; yet not even then do you listen. The Lawgiver is present, yet you do not see Him; to the poor the Gospel is preached, the blind see, yet you do not understand. You have now need of a second circumcision, though you glory greatly in the flesh. The new law requires you to keep perpetual sabbath, and you, because you are idle for one day, suppose you are pious, not discerning why this has been commanded you: and if you eat unleavened bread, you say the will of God has been fulfilled. The Lord our God does not take pleasure in such observances: if there is any perjured person or a thief among you, let him cease to be so; if any adulterer, let him repent; then he has kept the sweet and true sabbaths of God. If any one has impure hands, let him wash and be pure.</p></blockquote>

<blockquote><p>Touching the subject or persons to whom it is appropriate, faith is the proper and peculiar gift of God’s elect, which only [alone] distinguishes them from the rest of the world; for all other graces, be they never so bright, or shining, are common with the reprobate; but faith, with the fruits thereof, is proper to the godly. Whereupon, (Tit. 1:1) it is called, The “faith of God’s elect”: for only they, and of them all and every one, are in their time, by virtue of God’s covenant, brought to believe (John 6:37). “Every one that the Father gives me, comes to me.” Else, in what better case are we now, then when the covenant of works did hold us, seeing it is as impossible of our selves, and by our own strength, to repent, and believe the gospel, (which is the condition of the covenant of grace) as it was to fulfill the law? Wherefore we must understand, that God, to speak properly, does not require the same, as a mutual re-stipulation of our part, as it was in the former covenant, where nothing is imposed which man’s nature could not wield: but here it is rather a declaration of his pleasure, what he would have us do, and whereunto he will enable us: not a condition to endanger the covenant, but an assurance that he will give us strength to keep it. So as the whole covenant properly and in truth rises of his part, and lies upon him: like his other covenant (brought to confirm this) with the sun and moon, and stars, whom (otherwise unable of themselves) he makes to run their course. But howsoever, all come from his only grace and virtue, yet to us that are not stocks and stones, but endued with a reasonable soul, understanding, will, and other faculties, this covenant is wont to be expressed, sometimes by words conditional, sometimes in commanding wise; that the greatness of the peril, and the difficulty of the precept might make us to bestir ourselves, to use with care and conscience the mean that he appoints, for the attaining of that precious gift, and to work together with God, when we are once wrought upon by his Spirit. And herein lies one other main difference between the law and the gospel, or the covenant of works, and this covenant of grace: The law only commands obedience, but gives no power to obey; and therefore is called, “the dead letter,” “written with ink,” and “in tables of stone,” ready indeed to be read and seen, but having no life in it to change the heart, which remains as stony as before. The Gospel not only commands, but gives faith and newness of life; and is therefore said to be written in our hearts, and called The ministration of the Spirit, because it gives the Spirit of Christ, and righteousness through him. The law therefore, pronouncing nothing but judgement and condemnation against us, as that which commands things impossible, by reason of our weakness, terrifies and amazes the conscience: In which respect it is called, “the ministry of death and condemnation.” Contrariwise, the gospel bringing glad tidings of peace and reconciliation, quiets and appeases the conscience (Rom. 5:1) “Being justified by faith, we have peace with God, through Jesus Christ our Lord.” Both parts of this difference are found (Rom. 10:5, 6, 7, 8). For Moses thus describes the righteousness which is of the law, that the man which does these things, shall live thereby. But the righteousness which is of faith, speaks on this wise, “Say not in your heart, ‘who shall ascend into heaven?’ That is to bring Christ from above. Or, ‘Who shall descend into the deep?’ That is, to bring Christ again from the dead. But what says it? The word is near you, even in your mouth and in your heart. This is the Word of Faith which we preach.</p></blockquote>

 the attaining of that precious gift, and to work together with God, when we are once wrought upon by his Spirit. And herein lies one other main difference between the law and the gospel, or the covenant of works, and this covenant of grace: The law only commands obedience, but gives no power to obey; and therefore is called, “the dead letter,” “written with ink,” and “in tables of stone,” ready indeed to be read and seen, but having no life in it to change the heart, which remains as stony as before. The Gospel not only commands, but gives faith and newness of life; and is therefore said to be written in our hearts, and called The ministration of the Spirit, because it gives the Spirit of Christ, and righteousness through him. The law therefore, pronouncing nothing but judgement and condemnation against us, as that which commands things impossible, by reason of our weakness, terrifies and amazes the conscience: In which respect it is called, “the ministry of death and condemnation.” Contrariwise, the gospel bringing glad tidings of peace and reconciliation, quiets and appeases the conscience (Rom. 5:1) “Being justified by faith, we have peace with God, through Jesus Christ our Lord.” Both parts of this difference are found (Rom. 10:5, 6, 7, 8). For Moses thus describes the righteousness which is of the law, that the man which does these things, shall live thereby. But the righteousness which is of faith, speaks on this wise, “Say not in your heart, ‘who shall ascend into heaven?’ That is to bring Christ from above. Or, ‘Who shall descend into the deep?’ That is, to bring Christ again from the dead. But what says it? The word is near you, even in your mouth and in your heart. This is the Word of Faith which we preach.”

<blockquote><p>2. God’s common providence towards mankind teaches us that God is inclined to mercy and is willing to be reconciled, that he is not implacable… By these things, it plainly appears that God hasn’t utterly forsaken the world of mankind as to any favor or merciful regards. This was the witness which God gave all mankind, and even the heathen, that had direct revelation of his disposition to a reconciliation. Acts 14:16–17, ‘Who in times past suffered all nations to walk in their own ways. Nevertheless He left not Himself without witness, in that He did good, and gave us rain from heaven, and fruitful seasons, filling our hearts with food and gladness.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-c333ab4adf" data-kw="">
<blockquote><p>This may be a sad meditation to us, to stand and look back to our former estate, and compare it with that into which we are fallen. That image we spoke of, is defaced and blotted out, which was the glory of the creation; and now there is nothing so monstrous, so deformed in the world as man. The corruption of the best things is always worst; the ruins of the most noble creature are most ruinous; the spot of the soul most abominable.

We are nothing but a mass of darkness, ignorance, error, inordinate lust; nothing but confusion, disorder, and distempers in the soul, and in the conversation of men; and, in sum, that blessed bond of friendship with God broken, discord and enmity entered upon our side and separated us from God, and so we can expect nothing from that first covenant but the curse and wrath threatened. “By one man’s disobedience” sin entered upon all, ‘and death by sin;’ because in that agreement Adam was a common person representing us, and thus are all men once subject to God’s judgment, and come short of the glory of God, fallen from life into a state of death, and, for any thing that could be expected, irrecoverably.

But it hath pleased the Lord, in his infinite mercy, to make a better covenant in Christ his Son, that, what was impossible to the law, by reason of our weakness and wickedness, his Son, sent in the flesh, condemned for sin, might accomplish, Rom. 8.3. There is some comfort yet after this; that covenant was not the last, and that sentence was not irrevocable. He makes a new transaction, lays the iniquity of his elect upon Christ, and puts the curse upon his shoulders which was due to them. Justice cannot admit the abrogation of the law, but mercy pleads for a temperament of it. And thus the Lord dispenses with personal satisfaction, which in rigour he might have craved; and finds out a ransom, admits another satisfaction in their name.

And in the name of that Cautioner and Redeemer is salvation preached upon better terms: Believe and thou shalt be saved, Rom. 10.9. Thou lost and undone sinner, whoever thou art, that findest thyself guilty before God, and that thou canst not stand in judgment by the former covenant,—thou who hast no personal righteousness, and trustest in none,—come here, embrace the righteousness of thy Cautioner,—receive him, and rest on him, and thou shalt be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism</cite>, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 234-35.</span></figcaption>

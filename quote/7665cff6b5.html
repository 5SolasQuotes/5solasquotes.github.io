<main class="wrap"><figure class="quote" id="q-7665cff6b5" data-kw="">
<blockquote><p>We say, furthermore, that these Reformed Churches do not dissent in the fundamentals of faith. For although they may dissent in some chapters of Doctrine, we nevertheless deny any dissension in the fundamentals of faith… We are not saying here that they do not dissent in rites and ceremonies, for not every such dissension, either by its own nature severs, or ought to sever, the union of the Reformed Churches, especially since none of the Reformed Churches retains rites that are repugnant to the Gospel or introduced with an opinion of worship… Augustine, in Epistle 86, wrote no less skillfully than holily: “Let the garment of the Church be so varied by different observances that it is not torn apart by adverse contentions.”… Furthermore, it should also be added that we do not say that the Reformed Churches do not likewise dissent in the external mode of administering ecclesiastical polity or discipline… Nevertheless, we also contend that, this discrepancy being admitted, there is still no dissension in the fundamentals of faith. Indeed, such diversity in external polity can and ought to be tolerated without injury to or rupture of fraternal unity, especially since all the reformed Churches retain those things which are absolutely necessary, namely, the pure preaching of the Word of God, the due administration of the Sacraments, the ordination of pastors by public authority, and finally, the censure of morals. It is not on account of a difference in external form in these matters, where there is consensus in the fundamentals of faith, that the Reformed Churches should fight among themselves and reject all external ecclesiastical union. … The Foundation of Faith denotes… The primary object of faith, which is Christ the Savior… An epitome of this doctrine of the prophets and apostles [Eph. 2:20], containing in itself the sum of the Law and the Gospel, can be and is accustomed to be most conveniently reduced to four heads. So Augustine in the Enchiridion. 1. The Apostles’ Creed. 2. The Decalogue. 3. The Lord’s Prayer. 4. The doctrine of the sacraments. … But neither do we say they dissent in the very many secondary and tertiary articles, which since they are sufficiently proposed to, revealed to, and understood by all the Reformed Churches, are asserted with unanimous consent by them against the old heresies of the Marcionites, Manichaeans, Arians, Eunomians, Nestorians, Eutychians, and Monothelites, and against the new heresies of the Romanists. In a very few secondary articles not sufficiently proposed to all, or certainly not well enough weighed by them, and in some tertiary ones whose clear deduction from the primary is still hidden from some Churches, let there be dissent… Yet that does not impede the harmony of faith (ὁμονοίαν πίστεως) nor does it, or should it, break the ecclesiastical unity of the said Churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Reformed Churches do not Dissent in the Fundamentals of Faith’ in Theological Determinations in Works of Samuel Ward</cite>, … ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 144-53, pp. 145-49</span></figcaption>

</figure><figure class="quote" id="q-536663c18e" data-kw="">
<blockquote><p>The Lutherans on the contrary, by defect, decline fraternal fellowship with the Reformed, who by no means differ from them in the foundation. The Reformed pursue a middle way: (1) they reject the Socinians’ Samaritanism, that is, fraternal fellowship with those who err in the foundation, and render it useless to us (1 Cor. 3:12 with Rom. 10:3–4; Gal. 5:4), being adduced: (1)… (c) by reasons, because the fellowship of the mystical body rests upon the unity of the fundamental faith (Eph. 4:4–5). (2) With churches that err concerning the foundation, that is, which teach such things whereby, through necessary consequence, the foundation is made to fail, they do not want to rashly break church fellowship, unless perhaps they exclude us (1 Cor. 3:12; Eph. 4:4–5; Col. 2:19), after the example of Paul, who due to errors of this sort, by no means separated from the churches of Corinth, Galatia, and Colossae.</p></blockquote>

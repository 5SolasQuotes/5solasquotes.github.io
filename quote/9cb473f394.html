<main class="wrap"><figure class="quote" id="q-9cb473f394" data-kw="">
<blockquote><p>…especially seeing his Majesty shall ever find that he has none more loyal and true subjects, who will more gladly employ and bestow their lives, lands, houses, holds, goods, gear, rents, revenues, places, privileges, means, moities and all, in his Highness’s service and mantainance of his royal crown; and moreover, have so deeply conceived a strong and full persuasion of his Majesty’s princely virtues, and much renowned propension to piety, and equity, that they will urge their consciences, by all good and lawful means, to assent unto every thing which he enjoins, as right and convenient; and when the just aversation [aversion] of conscience upon evident reasons is invincible, will notwithstanding be more willing to all other duties of subjection, and more averse from the least show of contempt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 1, pp. 12-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-2f912cd634" data-kw="">
<blockquote><p>3… Yet I intend not to handle the case of invasion, to show in what cases only an invasion of another nation in a hostile manner is lawful: I am from all my books, that I cannot consult with casuists in that point… Had God given me life, I intended a large Treatise concerning the Usurpation of the Government of England, and the unlawfulness of the invasion of Scotland [by Cromwell]; but my collections being lost and taken away, they must die with me; I hope more able hands will write against the invasion, though they cannot fight against the invaders.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Necessary Vindication of the Principles &amp; Practices of me, Christopher Love, since my trial before, and condemnation by the High Court of Justice</cite>, (London, 1651), p. 29</span></figcaption>

</figure><figure class="quote" id="q-5f89c9779a" data-kw="">
<blockquote><p>The two Demurrers…: ‘Except[ion] against this our present obedience, because the present power is yet new: neither is there a total cessation of all hopes of recovery.’ Philosophers hold that the definition of a man belongs to an infant as well as to one of many years, because after the organization of the parts, he is informed with the same principle of life and reason as a grown man is; and having the same form, is the same thing. Even so the present power has possessed all the parts of this kingdom, gives them life in the administration of public justice and protection, which are the soul of a State, and the power which preceded this, what did it infuse more vital than this? And now that that is taken away, if this other did not presently enter into its place, the commonwealth were dead and each man were left in his naturals to subsist of himself and to cast how he could in such a state of war, defend himself from all the rest of the world, every man in this State having an equal right to everything.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bounds &amp; Bonds of Public Obedience, or, A Vindication of our Lawful Submission to the Present Government, or to a Government Supposed Unlawful, but Commanding Lawful Things, Likewise how such an Obedience is Consistent with our Solemn League &amp; Covenant</cite>, … (London, 1649) This was mor than likely written by Ascham despite it being attributed to Rouse., p. 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

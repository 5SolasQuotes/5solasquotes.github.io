<blockquote><p>Thirdly, there is no light of truth to be found anywhere else able to guide unto faith and salvation, than in the true Church of God… As no light was to be found in all Egypt, but in the land of Goshen and among the Israelites only: so no saving doctrine that gives light to the eyes of the mind is to be found out of the Church; they that are [not] in this state, live in palpable darkeness… as John teaches, ‘We know that we are of God, and the whole world lyeth in wickedness.’… Therefore to be out of the Church, is to be in the state of damnation, yea to be in the very dungeon of Hell, and the kingdom of darkeness, and to be under the power of Satan, the prince of darkness; as there was no salvation out of the Church. Let every man therefore seek and endeavor with all care to join himself to the true Church of God, and to be a member of the body of Christ, that so we may attain to the light of knowledge, and the light of the eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Fourth book of Moses, called Numbers... (London: Iaggard, 1618), ch. 8</cite>, p. 465</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e696627f2a" data-kw="communion join church">
<blockquote><p>For since salvation cannot be obtained except in communion with the true church and many glory in this sacred name who are destitute of its truth, it is of great value to know its true marks that we may be able to distinguish the true fold of Christ from the dens of thieves and dens of robbers. Also that thus we may know what that assembly is to which it is necessary that we should join ourselves that we may obtain salvation.</p></blockquote>

<blockquote><p>The Cardinal is continually urging this proposition, that there is no salvation out of the Church; And that he has not God for his Father that has not the Church for his mother. It imports then to know in what sense, and how far that proposition is true. I say then, that if by the word ‘Church’, you understand the Church or Assembly of the elect, or predestinated unto salvation, it is clear and questionless that out of the Church so understood there is no salvation: For whosoever is none of the elect, is of necessity a reprobate. If by the ‘Church’, you understand some particular Church, as the Greek, the Roman, the English, it is certain that out of such a Church a man may be saved. For example, if the Roman Church were as pure in the faith as it is corrupt, yet a faithful man could be saved in any other particular Church of the like purity. But if by the ‘Church’, one understands the whole body of those that profess themselves to be Christians, or the whole body of the orthodox Churches united in communion; it is certain that out of the communion of the Church taken in that sense a man may be saved. For if one were unjustly excommunicated from that Church, and should die during that excommunication, he should not be therefore excluded from salvation. For God is not subject to men’s vices, nor obliged to comply with the unjust passions of pastors handling the keys unrighteously, or abusing them ignorantly. Such a man having the Church for his step-mother, shall nevertheless have God for his Father. It may also happen that a pagan or a Jew being prisoner, or living in a country where there is no Christians, will come by reading, or conference, or inspiration from God, to acknowledge the truth of Christian religion, and make a resolution to profess it at the next opportunity, and as soon as he shall have his freedom: if death prevent such a man before he can openly join with the communion of the Church, I make no doubt but that he may be saved, believing in Jesus Christ, though he never did aggregate himself to the communion of the Church. For our Savior’s words can never be false, ‘Whosoever believeth in Jesus Christ, hath eternal life,’ Jn. 6. The thief crucified with Jesus, and converted when he was near death, was a pagan before, or of no religion; we cannot tell that ever he was a member of the visible Church, yet he was saved. In this sense then that proposition may be true, That out of the visible Church there is no salvation. Who so by profaneness or error in the foundation of the faith does separate himself from the communion of the universal visible Church, and renounces the communion of the faithful, to live according to his fancy, and to be no more a member of the Church, that man cannot be saved. Of such men the apostle Jude speaks, verses 18-19, where he calls those mockers and sensual men that separate themselves; And the apostle to the Hebrews, ch. 10, v. 25, forbids us to forsake the assembling of ourselves together. In this sense Cyprian in his book of the Unity of the Church, says, ‘He hath not God for his Father, that has not the Church for his Mother.’ For he speaks of schismatics, who out of pride despise the communion of the orthodox Church, and are authors of disension and division in the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery, Opposed to the Antiquity of True Christianity… (London: White, 1662), ch. 7, How this Proposition must be understood: That out of the Church there is no Salvation</cite>, p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/necessity-of-the-church.html">Necessity of the Church</a></span></div>

</figure><figure class="quote" id="q-bf4c3b0d77" data-kw="">
<blockquote><p>The seconde rule is, that there is no salvation out of the Church, and that therefore every one which is to be saved must become a member and a citizen of the catholic and apostolic Church: and such as remain forever out of the same perish eternally. Therefore St. John says, ‘They went out of us, they were not of us, for if they had been of us,’ they would have remained with us: but this comes to pass that it might appear that they are not all of us.’ And again, that such as be holy are in the city of God, but without, that is, forth of the Church are dogs, enchanters,whoremongers, adulterers, etc. And the ark out of which all perished, figured the Church, out of which all are condemned. And for this cause St. Luke says that ‘the Lord added to the Church from day to day such as should be saved.’ [Acts 2] And the reason hereof is plain: for without Christ there is no salvation, but out of the militant Church there is no Christ nor faith in Christ: and therefore no salvation. Again, forth of the militant Church there are no means of salvation, no preaching of the word, no invocation of God’s name, no sacraments, and therefore no salvation. For this cause every man must be admonished evermore to join himself to some particular Church† being a sound member of the catholic Church. † [A “particular Church”, as seen by many quotes on this webpage, often referred in that era to some national or regional Church, such as that of England, Germany, Constantinople, etc., not necessarily a local church, especially when the Anglican Church in that era (which Perkins was a part of) often did not have local sessions of elders with local church membership in any proper sense.] The third rule is that the Church which here we believe is only one, as Christ Himself speaks, ‘My dove is alone, and my undefiled is the only daughter of her mother.’ [Song 6:8] And as there is only one God and one Redeemer, one faith, one baptism and one way of salvation by Christ only, so there is but one Church alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles... (Cambridge: Legatt, 1595), An Exposition of the Creed</cite>, pp. 486-87</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The seconde rule is, that there is no salvation out of the Church, and that therefore every one which is to be saved must become a member and a citizen of the catholic and apostolic Church: and such as remain forever out of the same perish eternally. Therefore St. John says, ‘They went out of us, they were not of us, for if they had been of us,’ they would have remained with us: but this comes to pass that it might appear that they are not all of us.’ And again, that such as be holy are in the city of God, but without, that is, forth of the Church are dogs, enchanters,whoremongers, adulterers, etc. And the ark out of which all perished, figured the Church, out of which all are condemned. And for this cause St. Luke says that ‘the Lord added to the Church from day to day such as should be saved.’ [Acts 2] And the reason hereof is plain: for without Christ there is no salvation, but out of the militant Church there is no Christ nor faith in Christ: and therefore no salvation. Again, forth of the militant Church there are no means of salvation, no preaching of the word, no invocation of God’s name, no sacraments, and therefore no salvation. For this cause every man must be admonished evermore to join himself to some particular Church† being a sound member of the catholic Church. † [A “particular Church”, as seen by many quotes on this webpage, often referred in that era to some national or regional Church, such as that of England, Germany, Constantinople, etc., not necessarily a local church, especially when the Anglican Church in that era (which Perkins was a part of) often did not have local sessions of elders with local church membership in any proper sense.] The third rule is that the Church which here we believe is only one, as Christ Himself speaks, ‘My dove is alone, and my undefiled is the only daughter of her mother.’ [Song 6:8] And as there is only one God and one Redeemer, one faith, one baptism and one way of salvation by Christ only, so there is but one Church alone.”

<blockquote><p>3. We must know that there is no salvation out of this Church; such as never become members of it, must eternally perish: they that are true members, shall be saved. If they had been of us, they would have continued with us: but they went out from us, that it might be manifest they were not of us. Without are dogs and scorners, etc. All out of the ark perished in the waters. ‘The Lord added to the Church daily such as should bee saved.’ First, because there is no means of salvation out of it; no word to teach, no sacraments to confirm. And especially because out of the Church there is no Christ, and out of Christ no salvation. Who have not the Church their mother, cannot have God their Father… ‘The general assembly’ [Heb. 12:23]: this is the property of the Church; ‘General’. It is catholic in three respects; of Time, of Persons, of Place… Thus we see the property of this Church, catholic or general. It is one, but not tied to one time, nor one place, nor one person: it is catholic to all times, to all places, to all persons… …I desire to express two things: one for distinction, the other for instruction. First for distinction betwixt this Generall assembly and particular churches: then for instruction, to show who be true members of this catholic Church. 1. The main difference between them consists in this: that the catholic Church is always invisible, the members thereof only known to God: particular churches are sometimes invisible, and lying hid; other times manifest in the open profession of Christ’s name.</p></blockquote>

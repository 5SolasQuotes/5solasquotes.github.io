<blockquote><p>To our reverend brethren Mr. Alexander Henderson and Mr. David Dickson. That your answers, reverend and dear brethren, have not in any degree satisfied us, we impute it not to your weakness, whom we know to be able men, and much exercised in the matters debated betwixt us: but we impute it to the weakness of your cause, and to that inability which is in all men, as well as in you, to bear out against the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aberdeen-professors.html">Aberdeen Professors</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Duplyes of the Ministers &amp; Professors of Aberdeen to the Second Answers of some Reverend Brethren concerning the Late [National] Covenant [of 1638], ‘To our Brethren’, p. 73 appended to General Demands concerning the Late Covenant... (Edinburgh: Robert Young, 1638; repr. Aberdeen: John Forbes, 1663)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1f1a3318c8" data-kw="">
<blockquote><p>§1. Question 1: Must I always do as I would be done by? Or has this rule any exceptions? Answer: The rule intends no more but that your just self-denial and love to others be duly exercised in your dealings with all. And: 1. It supposes that your own will or desires be honest and just, and that God’s Law be their rule. For a sinful will may not be made the rule of your own actions or of other men’s. He that would have another make him drunk, may not therefore make another drunk: And he that would abuse another man’s wife, may not therefore desire that another man would lust after or abuse his wife. He that would not be instructed, reproved or reformed, may not therefore forbear the instructing or reproving others. And he that would kill himself, may not therefore kill another. But he that would have no hurt done to himself injuriously should do none to others: And he that would have others do him good, should be as willing to do good to them. 2. It supposes that the matter be to be varied according to your various conditions. A parent that justly desires his child to obey him, is not bound therefore to obey his child; nor the prince to obey his subjects; nor the master to do all the work for his servants, which he would have his servants do for him. But you must deal by another as you would (regularly) have them deal by you, if you were in their case, and they in yours. And on these terms it is a rule of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Directory (London, 1673), pt. 4, ch. 19, title 2</cite>, p. 114</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-70b462bc5a" data-kw="">
<blockquote><p>Q. What if by the wrong a man does me, I observe such infirmity, yea and iniquity to be in him, as by experience I find him to be a far other man than at first I supposed him to be, ought I notwithstanding to make such account of him as I did before? A. We must put difference betwixt a wrong done upon such an occasion as may afterwards be avoided, and that which is done upon an evil disposition, which remaining in a man, may be a means to make him continue to do more and more wrongs. The wrong of the former must be so forgiven, as the wrong doer be so accepted as if he had done no wrong at all. As for the latter, we are to try if he may be brought to sight of his evil disposition, and to repentance for the same. If he be, then ought we to esteem him as if he never had done us any hurt. But if obstinately he persist in that evil disposition, and be like, on all occasions, again and again to wrong us, though we do, as we ought, fully forgive all the wrongs done, and neither take any present revenge, nor keep them in mind and memory for any future revenge, yet may we in our judgment esteem him to be such an one as we find him to be. (Woe to them that call evil good: that put light for darkness, and sweet for bitter.) For example, if I find one of whom I have had a very good account, and thereupon used him very familiarly, to have no command of his tongue, but on all occasions to be ready to blab out, and blaze abroad whatsoever he sees or hears, if therein he have wronged me, I may forbear to use him so familiarly as I did before, and take heed what secrets I communicate to him, though I fully forgive the wrong that is past. Or if I have accounted one to be an entire friend to me, but by experience find him to be hollow-hearted, and maliciously minded against me, I ought wisely and warily to avoid his society, and to take heed of the snares which he lays for me. (For which we have the pattern of David, and Christ) yet so to pass by the wrongs done as if none had been done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to go to God: or an Explanation of the Perfect Pattern of Prayer, the Lord’s Prayer (London, 1626), §148. ‘Of a full forgiving one another,’</cite>, pp. 186-87</span></figcaption>

</figure><figure class="quote" id="q-8dc4bf9297" data-kw="">
<blockquote><p>But the words of Luke give rise to another question; for Christ does not order us to grant forgiveness, till the offender turn to us and give evidence of repentance. I reply, there are two ways in which offenses are forgiven. If a man shall do me an injury, and I, laying aside the desire of revenge, do not cease to love him, but even repay kindness in place of injury, though I entertain an unfavorable opinion of him, as he deserves, still I am said to forgive him. For when God commands us to wish well to our enemies, He does not therefore demand that we approve in them what He condemns, but only desires that our minds shall be purified from all hatred. In this kind of pardon, so far are we from having any right to wait till he who has offended shall return of his own accord to be reconciled to us, that we ought to love those who deliberately provoke us, who spurn reconciliation, and add to the load of former offenses. A second kind of forgiving is, when we receive a brother into favor, so as to think favorably respecting him, and to be convinced that the remembrance of his offense is blotted out in the sight of God. And this is what I have formerly remarked, that in this passage Christ does not speak only of injuries which have been done to us, but of every kind of offenses; for he desires that, by our compassion, we shall raise up those who have fallen. This doctrine is very necessary, because naturally almost all of us are peevish beyond measure; and Satan, under the pretense of severity, drives us to cruel rigor, so that wretched men, to whom pardon is refused, are swallowed up by grief and despair. But here another question arises. As soon as a man by words makes profession of repentance, are we bound to believe him? Were this done, we must of necessity go willingly and knowingly into mistake; for where will be discretion, if any man may freely impose on us, even to the hundredth offense? I answer, first, the discourse relates here to daily faults, in which every man, even the best, needs forgiveness. Since, then, amidst such infirmity of the flesh, our road is so slippery, and snares and attacks so numerous what will be the consequence if, at the second or third fall, the hope of forgiveness is cut off? We must add, secondly, that Christ does not deprive believers of the exercise of judgment, so as to yield a foolish readiness of belief to every slight expression, but only desires us to be so candid and merciful, as to stretch out the hand to offenders, provided there be evidence that they are sincerely dissatisfied with their sins. For repentance is a sacred thing, and therefore needs careful examination; but as soon as the offender gives probable evidence of conversion, Christ desires that he shall be admitted to reconciliation, lest, on being repulsed, he lose courage and fall back. Thirdly, It must be observed that, when any man, through his light and unsteady behavior, has exposed himself to suspicion, we may grant pardon when he asks it, and yet may do so in such a manner as to watch over his conduct for the future, that our forbearance and meekness, which proceed from the Spirit of Christ, may not become the subject of his ridicule. For we must observe the design of our Lord himself, that we ought, by our gentleness, to assist those who have fallen to rise again. And certainly we ought to imitate the goodness of our heavenly Father, who meets sinners at a distance to invite them to salvation. Besides, as repentance is a wonderful work of the Spirit, and is the creation of the new man, if we despise it, we offer an insult to God himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Mt. ch. 18, verse 21</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>
<div class="actions"><button class="copy" data-copy="“But the words of Luke give rise to another question; for Christ does not order us to grant forgiveness, till the offender turn to us and give evidence of repentance. I reply, there are two ways in which offenses are forgiven. If a man shall do me an injury, and I, laying aside the desire of revenge, do not cease to love him, but even repay kindness in place of injury, though I entertain an unfavorable opinion of him, as he deserves, still I am said to forgive him. For when God commands us to wish well to our enemies, He does not therefore demand that we approve in them what He condemns, but only desires that our minds shall be purified from all hatred. In this kind of pardon, so far are we from having any right to wait till he who has offended shall return of his own accord to be reconciled to us, that we ought to love those who deliberately provoke us, who spurn reconciliation, and add to the load of former offenses. A second kind of forgiving is, when we receive a brother into favor, so as to think favorably respecting him, and to be convinced that the remembrance of his offense is blotted out in the sight of God. And this is what I have formerly remarked, that in this passage Christ does not speak only of injuries which have been done to us, but of every kind of offenses; for he desires that, by our compassion, we shall raise up those who have fallen. This doctrine is very necessary, because naturally almost all of us are peevish beyond measure; and Satan, under the pretense of severity, drives us to cruel rigor, so that wretched men, to whom pardon is refused, are swallowed up by grief and despair. But here another question arises. As soon as a man by words makes profession of repentance, are we bound to believe him? Were this done, we must of necessity go willingly and knowingly into mistake; for where will be discretion, if any man may freely impose on us, even to the hundredth offense? I answer, first, the discourse relates here to daily faults, in which every man, even the best, needs forgiveness. Since, then, amidst such infirmity of the flesh, our road is so slippery, and snares and attacks so numerous what will be the consequence if, at the second or third fall, the hope of forgiveness is cut off? We must add, secondly, that Christ does not deprive believers of the exercise of judgment, so as to yield a foolish readiness of belief to every slight expression, but only desires us to be so candid and merciful, as to stretch out the hand to offenders, provided there be evidence that they are sincerely dissatisfied with their sins. For repentance is a sacred thing, and therefore needs careful examination; but as soon as the offender gives probable evidence of conversion, Christ desires that he shall be admitted to reconciliation, lest, on being repulsed, he lose courage and fall back. Thirdly, It must be observed that, when any man, through his light and unsteady behavior, has exposed himself to suspicion, we may grant pardon when he asks it, and yet may do so in such a manner as to watch over his conduct for the future, that our forbearance and meekness, which proceed from the Spirit of Christ, may not become the subject of his ridicule. For we must observe the design of our Lord himself, that we ought, by our gentleness, to assist those who have fallen to rise again. And certainly we ought to imitate the goodness of our heavenly Father, who meets sinners at a distance to invite them to salvation. Besides, as repentance is a wonderful work of the Spirit, and is the creation of the new man, if we despise it, we offer an insult to God himself.”

— John Calvin, Commentary on Mt. ch. 18, verse 21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+the+words+of+Luke+give+rise+to+another+question%3B+for+Christ+does+not+order+us+to+grant+forgiveness%2C+till+the+offender+turn+to+us+and+give+evidence+of+repentance.+I+reply%2C+there+are+two+ways+in+which+offenses+are+forgiven.+If+a+man+shall+do+me+an+injury%2C+and+I%2C+laying+aside+the+desire+of+revenge%2C+do+not+cease+to+love+him%2C+but+even+repay+kindness+in+place+of+injury%2C+though+I+entertain+an+unfavorable+opinion+of+him%2C+as+he+deserves%2C+still+I+am+said+to+forgive+him.+For+when+God+commands+us+to+wish+well+to+our+enemies%2C+He+does+not+therefore+demand+that+we+approve+in+them+what+He+condemns%2C+but+only+desires+that+our+minds+shall+be+purified+from+all+hatred.+In+this+kind+of+pardon%2C+so+far+are+we+from+having+any+right+to+wait+till+he+who+has+offended+shall+return+of+his+own+accord+to+be+reconciled+to+us%2C+that+we+ought+to+love+those+who+deliberately+provoke+us%2C+who+spurn+reconciliation%2C+and+add+to+the+load+of+former+offenses.+A+second+kind+of+forgiving+is%2C+when+we+receive+a+brother+into+favor%2C+so+as+to+think+favorably+respecting+him%2C+and+to+be+convinced+that+the+remembrance+of+his+offense+is+blotted+out+in+the+sight+of+God.+And+this+is+what+I+have+formerly+remarked%2C+that+in+this+passage+Christ+does+not+speak+only+of+injuries+which+have+been+done+to+us%2C+but+of+every+kind+of+offenses%3B+for+he+desires+that%2C+by+our+compassion%2C+we+shall+raise+up+those+who+have+fallen.+This+doctrine+is+very+necessary%2C+because+naturally+almost+all+of+us+are+peevish+beyond+measure%3B+and+Satan%2C+under+the+pretense+of+severity%2C+drives+us+to+cruel+rigor%2C+so+that+wretched+men%2C+to+whom+pardon+is+refused%2C+are+swallowed+up+by+grief+and+despair.+But+here+another+question+arises.+As+soon+as+a+man+by+words+makes+profession+of+repentance%2C+are+we+bound+to+believe+him%3F+Were+this+done%2C+we+must+of+necessity+go+willingly+and+knowingly+into+mistake%3B+for+where+will+be+discretion%2C+if+any+man+may+freely+impose+on+us%2C+even+to+the+hundredth+offense%3F+I+answer%2C+first%2C+the+discourse+relates+here+to+daily+faults%2C+in+which+every+man%2C+even+the+best%2C+needs+forgiveness.+Since%2C+then%2C+amidst+such+infirmity+of+the+flesh%2C+our+road+is+so+slippery%2C+and+snares+and+attacks+so+numerous+what+will+be+the+consequence+if%2C+at+the+second+or+third+fall%2C+the+hope+of+forgiveness+is+cut+off%3F+We+must+add%2C+secondly%2C+that+Christ+does+not+deprive+believers+of+the+exercise+of+judgment%2C+so+as+to+yield+a+foolish+readiness+of+belief+to+every+slight+expression%2C+but+only+desires+us+to+be+so+candid+and+merciful%2C+as+to+stretch+out+the+hand+to+offenders%2C+provided+there+be+evidence+that+they+are+sincerely+dissatisfied+with+their+sins.+For+repentance+is+a+sacred+thing%2C+and+therefore+needs+careful+examination%3B+but+as+soon+as+the+offender+gives+probable+evidence+of+conversion%2C+Christ+desires+that+he+shall+be+admitted+to+reconciliation%2C+lest%2C+on+being+repulsed%2C+he+lose+courage+and+fall+back.+Thirdly%2C+It+must+be+observed+that%2C+when+any+man%2C+through+his+light+and+unsteady+behavior%2C+has+exposed+himself+to+suspicion%2C+we+may+grant+pardon+when+he+asks+it%2C+and+yet+may+do+so+in+such+a+manner+as+to+watch+over+his+conduct+for+the+future%2C+that+our+forbearance+and+meekness%2C+which+proceed+from+the+Spirit+of+Christ%2C+may+not+become+the+subject+of+his+ridicule.+For+we+must+observe+the+design+of+our+Lord+himself%2C+that+we+ought%2C+by+our+gentleness%2C+to+assist+those+who+have+fallen+to+rise+again.+And+certainly+we+ought+to+imitate+the+goodness+of+our+heavenly+Father%2C+who+meets+sinners+at+a+distance+to+invite+them+to+salvation.+Besides%2C+as+repentance+is+a+wonderful+work+of+the+Spirit%2C+and+is+the+creation+of+the+new+man%2C+if+we+despise+it%2C+we+offer+an+insult+to+God+himself.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+Mt.+ch.+18%2C+verse+21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8dc4bf9297.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8dc4bf9297.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-forgiveness/#:~:text=But%20the%20words%20of%20Luke%20give,offer%20an%20insult%20to%20God%20himself&amp;text=But%20the%20words%20of%20Luke%20give%20rise%20to&amp;text=it%2C%20we%20offer%20an%20insult%20to%20God%20himself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-2814b3d5d3" data-kw="">
<blockquote><p>Objection: 1 Tim. 2:6, ‘Who gave Himself a ransom for all;’ Therefore, all men are redeemed by Christ. Answered:… Solution 4: Yet if they would force [this] to all singularly, then the ransom is for all quatenus ad dignitatem et sufficientiam [so far as the dignity and sufficiency]; not to all quatenus ad efficientiam [as to efficiency].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bowels of Tender Mercy Sealed</cite>, ... (London: Motershed, 1661), pt. 1, ch. 7, The Covenant of Grace considered in Relation to Christ the Mediator, sect. 8, Whether Jesus Christ as Mediator died for all and every man?, p. 305</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“Objection: 1 Tim. 2:6, ‘Who gave Himself a ransom for all;’ Therefore, all men are redeemed by Christ. Answered:… Solution 4: Yet if they would force [this] to all singularly, then the ransom is for all quatenus ad dignitatem et sufficientiam [so far as the dignity and sufficiency]; not to all quatenus ad efficientiam [as to efficiency].”

— Obadiah Sedgwick, The Bowels of Tender Mercy Sealed in the Everlasting Covenant... (London: Motershed, 1661), pt. 1, ch. 7, The Covenant of Grace considered in Relation to Christ the Mediator, sect. 8, Whether Jesus Christ as Mediator died for all and every man?, p. 305">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObjection%3A+1+Tim.+2%3A6%2C+%E2%80%98Who+gave+Himself+a+ransom+for+all%3B%E2%80%99+Therefore%2C+all+men+are+redeemed+by+Christ.+Answered%3A%E2%80%A6+Solution+4%3A+Yet+if+they+would+force+%5Bthis%5D+to+all+singularly%2C+then+the+ransom+is+for+all+quatenus+ad+dignitatem+et+sufficientiam+%5Bso+far+as+the+dignity+and+sufficiency%5D%3B+not+to+all+quatenus+ad+efficientiam+%5Bas+to+efficiency%5D.%E2%80%9D%0A%0A%E2%80%94+Obadiah+Sedgwick%2C+The+Bowels+of+Tender+Mercy+Sealed+in+the+Everlasting+Covenant...+%28London%3A+Motershed%2C+1661%29%2C+pt.+1%2C+ch.+7%2C+The+Covenant+of+Grace+considered+in+Relation+to+Christ+the+Mediator%2C+sect.+8%2C+Whether+Jesus+Christ+as+Mediator+died+for+all+and+every+man%3F%2C+p.+305&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2814b3d5d3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2814b3d5d3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=Objection%3A%201%20Tim.%202%3A6%2C%20%E2%80%98Who%20gave,quatenus%20ad%20efficientiam%20%5Bas%20to%20efficiency&amp;text=Objection%3A%201%20Tim.%202%3A6%2C%20%E2%80%98Who%20gave%20Himself%20a&amp;text=to%20all%20quatenus%20ad%20efficientiam%20%5Bas%20to%20efficiency" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-799cf93f69" data-kw="">
<blockquote><p>If He had made intercession and sacrifice for reprobates too, then clearly, their sins having been paid for by the sacrifice of the Son of God, the justice of God would not allow Him to require a debt already paid by the Son, nor would the justice of God be able to punish them with eternal death for their sins inasmuch as satisfaction has been made by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De substantia foederis gratuiti inter deum et electos</cite>, (Geneva, 1585), pp. 67-72 as translated in G. Michael Thomas, The Extent of the Atonement… (Paternoster/Wipf &amp; Stock, 1997), p. 114</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“If He had made intercession and sacrifice for reprobates too, then clearly, their sins having been paid for by the sacrifice of the Son of God, the justice of God would not allow Him to require a debt already paid by the Son, nor would the justice of God be able to punish them with eternal death for their sins inasmuch as satisfaction has been made by Him.”

</figure><figure class="quote" id="q-d54ad601ac" data-kw="">
<blockquote><p>I. We believe that Christ our Redeemer did truly die in the flesh for our sins, and that with one oblation, He has forever consecrated those who are sanctified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Article 2, ‘Of Christ’s Death &amp; Merit’ in Aphorisms of the Orthodox Doctrine of the Reformed Churches in Zachary Ursinus, The Sum of Christian Religion… (London: Young, 1645), pp. 694-98</span></figcaption>

</figure><figure class="quote" id="q-52c14a01f6" data-kw="">
<blockquote><p>Whether Christ actually expiated and satisfied for our sins? It is affirmed contra the Socinians. Whether such an expiation was necessary? It is affirmed contra the Socinians. Whether it was a full and total expiation? It is affirmed. Whether it is able to be said Christ according to each nature was a sacrifice and victim? It is denied. Whether his oblation of Himself was properly a victim? It is affirmed. Whether therefore passions ought not to be referred to the sacrifice and victim? It is affirmed. Whether the whole passive obedience of Christ is able to be called a victim and sacrifice? It is denied with a distinction. Whether that dignity, by which the death of Christ redounds dignity and efficacy, so it is a ransom (lutron), is able to be called part of the victim? It is distinguished. Whether the divine nature was the altar, or indeed the sign of the cross was? The former is affirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, (Utrecht, 1643), pt. 1, section 2 Abbr. | tract 2 | Of the First Part, or of the Act: The Sacrifice of the Priestly Office, even the Full Satisfaction &amp; Expiation</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether Christ actually expiated and satisfied for our sins? It is affirmed contra the Socinians. Whether such an expiation was necessary? It is affirmed contra the Socinians. Whether it was a full and total expiation? It is affirmed. Whether it is able to be said Christ according to each nature was a sacrifice and victim? It is denied. Whether his oblation of Himself was properly a victim? It is affirmed. Whether therefore passions ought not to be referred to the sacrifice and victim? It is affirmed. Whether the whole passive obedience of Christ is able to be called a victim and sacrifice? It is denied with a distinction. Whether that dignity, by which the death of Christ redounds dignity and efficacy, so it is a ransom (lutron), is able to be called part of the victim? It is distinguished. Whether the divine nature was the altar, or indeed the sign of the cross was? The former is affirmed.”

— Gisbertus Voetius, Syllabus of Theological Problems (Utrecht, 1643), pt. 1, section 2 Abbr. | tract 2 | Of the First Part, or of the Act: The Sacrifice of the Priestly Office, even the Full Satisfaction &amp; Expiation">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhether+Christ+actually+expiated+and+satisfied+for+our+sins%3F+It+is+affirmed+contra+the+Socinians.+Whether+such+an+expiation+was+necessary%3F+It+is+affirmed+contra+the+Socinians.+Whether+it+was+a+full+and+total+expiation%3F+It+is+affirmed.+Whether+it+is+able+to+be+said+Christ+according+to+each+nature+was+a+sacrifice+and+victim%3F+It+is+denied.+Whether+his+oblation+of+Himself+was+properly+a+victim%3F+It+is+affirmed.+Whether+therefore+passions+ought+not+to+be+referred+to+the+sacrifice+and+victim%3F+It+is+affirmed.+Whether+the+whole+passive+obedience+of+Christ+is+able+to+be+called+a+victim+and+sacrifice%3F+It+is+denied+with+a+distinction.+Whether+that+dignity%2C+by+which+the+death+of+Christ+redounds+dignity+and+efficacy%2C+so+it+is+a+ransom+%28lutron%29%2C+is+able+to+be+called+part+of+the+victim%3F+It+is+distinguished.+Whether+the+divine+nature+was+the+altar%2C+or+indeed+the+sign+of+the+cross+was%3F+The+former+is+affirmed.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Syllabus+of+Theological+Problems+%28Utrecht%2C+1643%29%2C+pt.+1%2C+section+2+Abbr.+%7C+tract+2+%7C+Of+the+First+Part%2C+or+of+the+Act%3A+The+Sacrifice+of+the+Priestly+Office%2C+even+the+Full+Satisfaction+%26+Expiation&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F52c14a01f6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/52c14a01f6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/atonement#:~:text=Whether%20Christ%20actually%20expiated%20and%20satisfied,cross%20was%3F%20The%20former%20is%20affirmed&amp;text=Whether%20Christ%20actually%20expiated%20and%20satisfied%20for%20our&amp;text=of%20the%20cross%20was%3F%20The%20former%2

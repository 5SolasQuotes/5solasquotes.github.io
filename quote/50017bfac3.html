<blockquote><p>…namely, forasmuch as the uncovering of the head was then a sign of power and dominion, as on the contrary now at this day those that have power over others will keep their heads covered, and they that are under others will uncover their heads before them. But in all these things, we must always have the respect to the use of divers times and countries, and what is honorable and edifying therein, 1 Cor. 14:40, Phil. 4:8.</p></blockquote>

<blockquote><p>34. In all Reformed Churches men use[d] to enter into the places of public worship with their hats off [is the claim, in accordance with the Anglican practice that the puritans rejected]. In France the women that are persons of quality unmask themselves. And the devoutest sort both of men and women use[d] to kneel, and make a short prayer for God’s blessing on the service they come to perform, before they sit down; Yet the [Westminster] Directory (though it pretends conformity with them) prohibits these very things, which are likewise used upon the same occasions. 35. In some places all the people stand bare as long as they are in the Church, as in Hungary and Transylvania, where the Prince himself uses to be uncovered. In others they stand bare only during the service, as at Geneva, where they are covered only at sermon. In Poland and Lithuania they sing, and both read and hear the Scripture standing, and they beat their breast at the end of their prayers. Everywhere they use to kneel at prayer [especially in the 1500’s]; and if all do not kneel when they may conveniently, it is scandalous. It was ordered by the last National Assembly of the Reformed Churches of France held at Loudun, that all should be bare-headed whilst the office of baptism is read. Which was not so much a new constitution as the renewing of an old one as may be seen in their Discipline, which will have those censured that shall not uncover themselves when sacraments are celebrated. And although there is too much irreverence in the said Churches both at the administration of sacraments and at all other holy duties performed in the congregation, it is well known that it is against the mind of the ministers, who very often use to reprehend the people for this abuse, and exhort them to behave themselves more reverently in the house of God. By which we may guess what judgement they would make of those of the presbyterian congregations, who never kneel [they rather generally stood at prayer in the 1600’s], and never uncover their heads, or only a little the top or one side of them at prayer… And because this outward reverence is so slighted and almost laughed at by some, though great pretenders to reformation, I think it not amiss to transcribe here at length the very words of the Discipline established in the French Reformed Churches, by which may be seen how much they value it (ch. 10, article 1): ‘That irreverence shall be mended which is seen in many when they are present at Common Prayer in the Church, or at their private prayer in the family, not to uncover their head and not to bend their knees; a thing which is contrary to piety, gives suspicion of pride, and may offend the godly. Wherefore the ministers shall be warned, as likewise the elders and heads of families, to watch carefully, that during the said prayers every one, without exception or acception of persons, do by these outward signs stifie the humility of their hearts, and of that inward homage which they yield unto God.’ 36. In the Churches of Lithuania and Polonia, where they have their hats on at sermon, they always put them off at the name of Jesus; and the women, if they be sitting, bow down their head; if they they stand, they make a curtsy. The Reformed Church of Bremen [Germany] do the like. And the same reverence was used at the naming of that holy name by a great many, though not by all, nor always, before the wars in the Palatinate [Germany], and no doubt but they do so still.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-durel.html">John Durel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Government &amp; Public Worship of God in the Reformed Churches Beyond the Seas, wherein is showed their Conformity &amp; Agreement with the Church of England, as it is Established by the Act of Uniformity… (London, 1662), Introduction, pp. 32-34 Durel (1625–1683) was an Anglican, Erastian, clergyman and academic, here seeking to support the Anglican practices.</cite></span></figcaption>

<blockquote><p>The theologian Tertullian (c.160-c.230 CE) was a prominent voice in early western Christianity, writing extensively about women… The thesis contextualizes Tertullian’s beliefs and offers specific examples of both incidences where elements of his thought may be traced, directly and indirectly, to contemporary non-Christian ideas, and places where that thought is in dialogue with or explicitly rejecting those ideas. The research here suggests that Tertullian was both influenced by Roman, non-Christian intellectual culture and explicitly rejected aspects thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mary-fellman.html">Mary Fellman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Social Context Of Tertullian’s ‘On The Veiling Of Virgins” MA thesis (Cornell Univ., 2009) 55</cite>, pp. no pictures</span></figcaption>

<blockquote><p>This thesis argues that in 1 Corinthians 11:2-16 Paul asserts most centrally that women should wear head coverings while praying and prophesying in the Corinthian Christian assembly. I examine the honor and shame value system of the Greco-Roman world, both generally and in specific reference to head adornment, since head coverings and hairstyles were connected to honor and status. Then I look at Paul’s treatment of honor and shame throughout 1 Corinthians, which denounces the worldly value system of status seeking in favor of the value system of the cross. Paul’s stance leads him to subject cultural norms to gospel values…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/april-m-hoelke.html">April M. Hoelke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposed Heads &amp; Exposed Motives: Coverings as a Means to Unity at Corinth MA thesis (Gardner-Webb Univ., 2014) 125 pp.</cite></span></figcaption>

<blockquote><p>1. …The apostle tells us there must be nudatio capitis, our heads must be uncovered. The wearing of a cap, pileo donari, among the Romans, was peculiar to free men only, and an hieroglyphic of honor, for once if a man cepisset pileum, he was free, and when he laid aside his cap, he was said deponere magnificentiam, to lay aside his honor and privilege whereby he was distinguished from a servant. So then, as servants are to be uncovered in their master’s service, so are we to be in God’s: and therefore Saint Paul (in the place before cited) tells us that it is a shame for a man to have his head covered at that time. … But in this point corruption is crept into our Church. Instead of humbling ourselves by prostration and kneeling, we are pleased to sit at our ease, and that in a proud manner: instead of the depositio magnificentiae, et nudatio capitis, kneeling and uncovering our heads, we sit, and with our heads covered too; this is not to enquire, at least not to imitate, the days of old… This sedentary prayer and proud fashion of covering the head cannot be warranted by any text in Scripture.</p></blockquote>

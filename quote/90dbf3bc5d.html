<main class="wrap"><figure class="quote" id="q-90dbf3bc5d" data-kw="">
<blockquote><p>It is asked: Whether because God indeclinably determines the will to one thing, He therefore overturns liberty? The Remonstrants affirm. We deny. 1. Because God infinitely wise and omnipotent does not overturn the nature of second causes, except in the case of the miraculous transmutation of substances; as when He converted water into wine and the staff of Moses into a serpent. But conversion is not such a miraculous transmutation of substances; But of qualities of the same substance remaining in its nature. 2. Because God so moves the free will that it most freely moves itself to the same thing to which it is premoved by God. 3. Because if certain created infallibilizing motives infallibly bend the will, with liberty remaining unharmed, much more can the Creator of wills Himself accomplish this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI by Onku (1639-1642; 1668), ch. 11, On the Mode of Conversion, pp. 303-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f124048d8b" data-kw="">
<blockquote><p>…the opposing position of the Thomists about the physically predetermining quality, as they call it… I agree with them in the matter and differ only in the mode; and because a quality of this kind understood in that way is not found in Saint Thomas; and because through the artifice of adversaries it was introduced into the Thomist school — with them caring less about it because they thought it made no difference to be determined in this or that mode, and afterward quarreling about the act of it, as Zumel admits, in whose writings I found it written; and because, the error being now recognized, that quality is commonly rejected and another kind of determination is received. Concerning which we perhaps agree with them… First I observe that this prior impressed physical quality is altogether rejected by Scotus, as we will show below… That predetermining quality physically is altogether required [according to Thomists] in the free cause in first act for operating, and without it the will cannot be determined to second act; and given it, the will consequently acts and operates with certainty and determination — for it is given for that purpose, so that it may operate. But from this it follows that those in whom it is not impressed cannot operate;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Contra Physical Predetermination, p. 386</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

<blockquote><p>7. Because the opponents deny predetermining grace to good acts, and subject habitual grace to the nod and motion of the created will, so that the will by nature influences the good work prior to divine grace. Hence, if God is moved to give grace on account of previous dispositions, then conversion will begin from the endeavor, influence and natural motion of free will. But on the contrary, God begins the good work in us, Phil. 1:6. Neither man, nor angel, first gives something to God, Rom. 11:33-34.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI by Onku (1639-1642; 1668), ch. 7, State of Fallen Man, p. 222</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-a1b86c2501" data-kw="">
<blockquote><p>Since, therefore, it is clear from what has been said that our will is effectively moved and determined by God as the first cause, the first mover, and therefore is preceded and predetermined by Him, it remains to be explained how this effective motion and determination, or rather divine pre-motion and predetermination, is consistent with the freedom of our will. For it does not seem that what is effectively moved and determined in one direction by a prior cause can be free to do otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan</cite>, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, pp. 339-42 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan. | XXII. And these points are consistent with what is read in Estius in the above-cited passage, where he expounds the same doctrine and brings many confirmations to it. He concludes thus and objects to the freedom of human will:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

<blockquote><p>[Scotus:] ‘God does not operate for that operation except with the will freely acting and determining itself to operate; then God operates with it. Yet there the first liberty and dominion is not in it but in the divine will, which has no cause operating with it for its own act; yet as much liberty as can be in a creature is there.&#x27;</p></blockquote>

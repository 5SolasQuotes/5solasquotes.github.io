<main class="wrap"><figure class="quote" id="q-cdf2b964bf" data-kw="decretive preceptive">
<blockquote><p>Although the will in God is only one and most simple, yet because it is occupied differently about various objects, it may be apprehended as manifold. The first and principal distinction is that of the decretive and preceptive will. The former means that which God wills to do or permit himself; the latter what he wills that we should do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.15.1–2</span></figcaption>

</figure><figure class="quote" id="q-0ab19fbbf2" data-kw="unity one God">
<blockquote><p>Is God one? We affirm against the heathen and Tritheists. God is so one affirmatively as to indivision that he is also one as to the exclusion of others. The question concerns the essential numerical unity: whether God is one numerically as to essence. We defend this against the polytheism of the heathen and the error of the Tritheists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.3.2–3</span></figcaption>

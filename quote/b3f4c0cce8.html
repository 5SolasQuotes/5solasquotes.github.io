<blockquote><p>Neo. And what is the duty of magistrates towards their subjects?

Evan. Why, the Lord in this commandment doth require, that magistrates be careful to establish good laws in their kingdoms, and good orders among their subjects, (2 Kings 18:4, Rom. 12:17); and that they be careful to see them duly and impartially executed, (Jer. 38:4,6, Rom. 13:3,4); and that they be careful to provide for the peace, safety, quietness, and outward welfare of their subjects, (Rom. 13:4, 1 Tim. 2:2), and not to oppress them with taxations and grievances, (1 Kings 12:14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), 7: 423.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c4154c0d8a" data-kw="">
<blockquote><p>Even now, at this very moment, we are not selves having and using bodies. We are bodies—we are rational, sentient, organic bodies. Modern thought has rejected this truth. But the fact remains that the human person is a certain, special kind of body… Human biological processes are not possessions and instruments of the person; they are parts of the life of the person… The human soul, which is the person’s intellectual principle, is united to the body as form. As form of the body, the soul is not merely a moving principle of the body. Nor is the soul an agent of which the body is instrument. Rather, the soul is an intrinsic principle of the human person. The soul makes the person be the body he or she is. Nor is there any other form which makes the body be body than the soul by which the person has the capacities of intellect and free choice. Each person has his or her own soul; substantial unity excludes many individuals having the same soul. Since the soul and the body are not distinct entities, no link is needed to unite soul and body. The human soul, as formal part of the body, makes the entire human body be a person; the entire soul is present in every part of the body. All of these points are explained by St. Thomas in a compact, synthetic treatise (S. t., I, qu. 78)… Classical modern philosophy substitued a radical dualism for the substantial unity of man. In Descartes, man is a thinking subject—cogito ergo sum—and the body is consigned to the objective world. In Hume, man is a momentarily unified consciousness—personal identity is continuity by memory over time—and the body is merely one set for phenomena among others… If the person really is not his body, then the destruction of the life of the body is not directly and in itself an attack on a value intrinsic to the human person… If the person really is not his or her own body, then the use of the sexual organs in a manner which does not respect their proper biological teleology is not directly and in itself the perversion of a good of the human person… A manufactured individual will be a person; he or she will deserve our respect as one sharing in personal dignity… But such an individual also will be a product. The producer is on a different level, inescapably superior, from the level of the product. The producer always can say to his product: “I produced you, I can destroy you; I am lord of your life, I am lord of your death”. If human beings are to share in the same personal dignity, they must be begotten, not made. Only in being begotten does an offspring share the same nature and the same personal dignity as his or her parents.</p></blockquote>

</figure><figure class="quote" id="q-58495253f9" data-kw="">
<blockquote><p>Neither are Kings and Princes blameless in this case of Famine, who though their charge be to provide for the good of the people, yet they utterly neglect them, rather impoverishing their subjects, yea, even in the dearest years, burthening them with taxes and subsidies: the Court is costly, and will be gallant: horses, hounds, hawks, harlots, jesters, must be maintained, who wrings for it? the poor subject, who must rather be undone, then the Court should want: from whence followeth this inconvenience, that the people being thus exhausted, and drunk up by these sucking subsidies and exactions, many of them become desperate, and utterly neglect their family at home, and setting the Hare’s head to the Goose gibbets, and all that they have at a mumme [sic] chance, will rather loosely misspend it themselves, then thus to be made sponges, and that which they have to be squeezed from them by crushing Courtiers.</p></blockquote>

</figure><figure class="quote" id="q-c6852c840c" data-kw="">
<blockquote><p>The truth is, the times were very sad, and nothing but lamentation and bemoanings heard in the streets. Those that had wealth retired into the country, but those that were needy were, if not taken away by death, almost starved, and so consequently ready to mutiny against their superiors for relief. All the gates of colleges and halls were constantly kept shut day and night, a few persons being left in them to keep possession. The shops of the town were closed, none but the attendants on the sick or the collectors for them were to be seen stirring abroad, the churches were seldom or never open for divine service.</p></blockquote>

<blockquote><p>First, consider they are great things that you trust them with, whom you chose to sit in the great Senate of the Nation; you trust them with your purse, and I am sure most of you account that something, whatever you think of other things; you will know him well, to whom you will give the Key of your chest, where your money lies. You trust them with your liberties and lives, and those your purses have paid soundly for; yea, with your Religion, without which the other are not worth the taking up.

In one word, with all that is dear to you as English men, as Christians, you put that power into their hands, which if they be not the more faithful, they may turn like a cannon upon your own breasts, and so you most truly become felo de se, guilty of your own miseries; and let me tell you, those sorrows have a peculiar bitterness in them above all other, which are not imposed on us, but chosen by us.

Better an enemy should come in and turn us by force of arms, out of possession of these, then we send those that shall vote us out of them, partly because of the little pity we shall deserve, or can reasonably expect from others, when they shall see the rod with which we are whip’t was of our own gathering; as also because of the inward guilt which will add a further stinging consideration then all this to our sorrows, and deprive us of those comforts which the conscience of doing our duty would help us to, in the greatest calamities that otherwise could befall us. He that is accessory to the burning down of his house, by the negligence of a drunken person, whom he trusted to watch and keep it, hath more reason to be troubled, then he that hath it consumed by a fire from heaven, or some other inevitable Providence.

O Sirs, there are less matters then these, in which you would be very choice and curious; if you were to chose a Nurse for your child, you would look for one of a healthful constitution and good disposition, you would weigh and taste her milk whether good or no; You are now to choose Nurses for three Nations, so Magistrates are called in Scripture, Nursing Fathers and Mothers; You are to choose these in a time of these Nations languishing, as the only means under God, (so thought by the best Physicians among us,) to recover the consumptive state of this great body; and will you send any to such a place and work, before you know what milk they have given in their private capacities in the Country?

If you were to choose a Shield, should it be one that would let the arrow come through it, to pierce you to the heart? Magistrates are the Shields of the earth. You value the life of the Nation little, that will put a Shield into its hand you have not well tried; I am sure, David threw away Armour, though it were a Kings, because he had not tried it; in a word, if you were but to choose a Shepherd, or a Herdsman, any should not serve your turn. Pharaoh a King thought it not beneath his care, though in so low a business, Gen. 47.6. If thou knowest any man, saith he to Joseph, of activity amongst thy brethren, make them rulers over my cattle; you are to choose such, as are not to go before beasts, but to lead in and out the Lord’s people and flock.</p></blockquote>

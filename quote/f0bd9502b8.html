<main class="wrap"><figure class="quote" id="q-f0bd9502b8" data-kw="">
<blockquote><p>‘Behold, I stand at the door and knock, If any man will open…’ (Rev. 3:20). Alas, we cannot open the door, it is so locked and barred and bolted that it is impossible for us to open it. True, it is so, but yet there is a way to open, and that is to be opening when God would help us to open. When God offers to help you to open the door, then set upon opening the door, and whatever the bolts, bars and locks are, you shall be sure to have it open. Ah, but when does God offer to help us to open it? Then when His Spirit knocks, when in the motions of it He solicits us to open, then God offers His help to help us to open. Take that time and then set on the work and the door shall be opened. But if that time is neglected we may strive to open but cannot open, because then that power is gone that would have helped us to open. See Eccl. 9:12, ‘For man also knoweth not his time.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-dyke.html">Jeremiah Dyke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of Quenching &amp; Not Quenching of the Spirit’ (d. 1620; 1640; RBO, 2018)</cite>, p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3845f27f7c" data-kw="">
<blockquote><p>‘Behold, I stand at the door’ of your heart and ‘knock: Open to Me, my sister, my love, my undefiled; for my head is filled with the dew, and my locks with the drops of the night.’… ‘When He waits to be gracious, and exalts Himself to show mercy.’ why tire out his patience till He ‘shut up all his tender mercies in his wrath?’ ‘Is it a small thing for you to weary men,’ weary parents, and ministers? ‘But will ye weary my God also?‘</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Addresses to Children Concerning Salvation (Torwood Press, 2013) | “An Address to the Young Readers of this Catechism” (1781)</cite>, p. 31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-aadbe6f3cc" data-kw="">
<blockquote><p>Then Christianity, its chief residence, its royal-sent, is in the spirit of a man, and so He is one after the spirit. ‘Be ye renewed in the spirit of your minds,’ Eph. 4:23. As it is of a high descent, so it must have the highest and most honorable lodging in all the creation, that is, the spirit of a man, without this there is no room else fit for it, and suitable to it, in this lower world; ‘My son give me thine heart,’ says wisdom, Prov. 23:26. It cares for nothing besides, if it get not the heart, the inmost cabinet of the imperial city of this isle of man, for ‘out of it are the issues of life,’ that flow into all the members. Do not think that grace will lodge one night in your outward man, that you can put on Christianity upon your countenance or conversation without; except you admit it into your souls, it can have no suitable entertainment there alone, it’s of a spiritual nature, and it must have a spirit to abide in. Everything is best preserved and entertained by things suitable to its nature; such do incorporate together, and inbosom one with another, whereas things keep a greater distance with things different in nature; a flame will die out among cold stones, without oily matter. This heavenly fire that is descended into the world can have nothing earthly to feed upon; it must die out except it get into the immortal spirit, and then furnish (to speak so) perpetual nourishment to it, till at length all the spirit be set on flame and changed, as it were, into that heavenly substance, to mount up above from whence it came. Do not think, my beloved, to superinduce true religion upon your outside, and within to be as rotten sepulchers: You must either open your hearts to Christ or else He will not abide with you; such a noble guest will not stay in the suburbs of the city if you take Him not into the palace; and truly the palace of our hearts is too unworthy for such a worthy guest, it has been so defiled by sin; how vile is it? but if you would let him enter, He would wash it and cleanse it for Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Sanctuary… (d. 1653; Edinburgh: Swintown, 1670) | sermon 16, on Rom. 8:4-5</cite>, p. 124</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-e6f519a99b" data-kw="">
<blockquote><p>…and therefore because they missed of the time, their misery was great on them… there is a time for a man to come in and take the offer that Christ makes, a time when He is kind and gentle, and ready to receive us; if we know not this time, and so overslip it, our misery will be great upon us. Now then it is very requisite to know and find out this time, because if we choose God’s time, God will join with us in the work, and so it will be done with ease… Now if you will open when Christ knocks at the door, hearken to the motions of the Spirit, and blow them and nourish them, and it will be done with much ease; but if you miss this time, your misery is great; you may desire, and cry, and pray, and never the better, Eccl. 9:12. For a man also knows not his time…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-preston.html">John Preston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Saints’ Infirmities, Delivered in Several Sermons... (London: Okes, 1636), 2nd Sermon, on Mt. 12:18-20</cite>, pp. 132-36</span></figcaption>

<blockquote><p>3. The wooings of Christ to gain your hearts: Consider Him bowing the heavens and coming down, and laying aside his robes of majesty, and putting on your filthy garments: Consider Him going about from place to place, on no other errand, but to gain your hearts and win your souls: And, whoever spake such effectual words as Christ spake when He was upon the earth? Who ever gave such precious jewels to a bride, as Christ gave to his spouse? Who ever put on such apparel as Christ did, when He wooed his Church?… Ah! poor Sinners, see your Jesus hanging on the cross, dropping out his last blood, breathing out his last breath, stretching out his dying arms to encircle sinners; and come, Oh come and throw yourselves into his bleeding arms! Away with all prejudicate opinions! Who shall say Christ is not willing to save him, and not blaspheme eternal love? Speak truth: Corrupt hearts speak truth; say not Christ is unwilling, but you are unwilling; ‘I would, but ye would not.’ [Mt. 23:37] 4. The weepings of Christ if He cannot prevail. Thus we find Him in the Gospel expressing Himself, not only in words, but in tears. And when He was come near Jerusalem, He beheld the city, and wept over it, Lk. 19:41… What? Christ to weep for you, over you? Methinks, if you had hearts of stone, it should melt your hearts.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“3. The wooings of Christ to gain your hearts: Consider Him bowing the heavens and coming down, and laying aside his robes of majesty, and putting on your filthy garments: Consider Him going about from place to place, on no other errand, but to gain your hearts and win your souls: And, whoever spake such effectual words as Christ spake when He was upon the earth? Who ever gave such precious jewels to a bride, as Christ gave to his spouse? Who ever put on such apparel as Christ did, when He wooed his Church?… Ah! poor Sinners, see your Jesus hanging on the cross, dropping out his last blood, breathing out his last breath, stretching out his dying arms to encircle sinners; and come, Oh come and throw yourselves into his bleeding arms! Away with all prejudicate opinions! Who shall say Christ is not willing to save him, and not blaspheme eternal love? Speak truth: Corrupt hearts speak truth; say not Christ is unwilling, but you are unwilling; ‘I would, but ye would not.’ [Mt. 23:37] 4. The weepings of Christ if He cannot prevail. Thus we find Him in the Gospel expressing Himself, not only in words, but in tears. And when He was come near Jerusalem, He beheld the city, and wept over it, Lk. 19:41… What? Christ to weep for you, over you? Methinks, if you had hearts of stone, it should melt your hearts.”

— Isaac Ambrose, Looking Unto Jesus… (d. 1664; Edinburgh: Ormiston, 1723), pp. 246–47">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+The+wooings+of+Christ+to+gain+your+hearts%3A+Consider+Him+bowing+the+heavens+and+coming+down%2C+and+laying+aside+his+robes+of+majesty%2C+and+putting+on+your+filthy+garments%3A+Consider+Him+going+about+from+place+to+place%2C+on+no+other+errand%2C+but+to+gain+your+hearts+and+win+your+souls%3A+And%2C+whoever+spake+such+effectual+words+as+Christ+spake+when+He+was+upon+the+earth%3F+Who+ever+gave+such+precious+jewels+to+a+bride%2C+as+Christ+gave+to+his+spouse%3F+Who+ever+put+on+such+apparel+as+Christ+did%2C+when+He+wooed+his+Church%3F%E2%80%A6+Ah%21+poor+Sinners%2C+see+your+Jesus+hanging+on+the+cross%2C+dropping+out+his+last+blood%2C+breathing+out+his+last+breath%2C+stretching+out+his+dying+arms+to+encircle+sinners%3B+and+come%2C+Oh+come+and+throw+yourselves+into+his+bleeding+arms%21+Away+with+all+prejudicate+opinions%21+Who+shall+say+Christ+is+not+willing+to+save+him%2C+and+not+blaspheme+eternal+love%3F+Speak+truth%3A+Corrupt+hearts+speak+truth%3B+say+not+Christ+is+unwilling%2C+but+you+are+unwilling%3B+%E2%80%98I+would%2C+but+ye+would+not.%E2%80%99+%5BMt.+23%3A37%5D+4.+The+weepings+of+Christ+if+He+cannot+prevail.+Thus+we+find+Him+in+the+Gospel+expressing+Himself%2C+not+only+in+words%2C+but+in+tears.+And+when+He+was+come+near+Jerusalem%2C+He+beheld+the+city%2C+and+wept+over+it%2C+Lk.+19%3A41%E2%80%A6+What%3F+Christ+to+weep+for+you%2C+over+you%3F+Methinks%2C+if+you+had+hearts+of+stone%2C+it+should+melt+your+hearts.%E2%80%9D%0A%0A%E2%80%94+Isaac+Ambrose%2C+Looking+Unto+Jesus%E2%80%A6+%28d.+1664%3B+Edinburgh%3A+Ormiston%2C+1723%29%2C+pp.+246%E2%80%9347&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Facf626ff03.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/acf626ff03.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-in

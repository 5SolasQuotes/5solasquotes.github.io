<blockquote><p>That he ceased to be God when he became man, he did not, and could not. There was no cessation of the Godhead, in the stooping to the manhood. The human did not become Divine, nor did the Divine become human. There was no coalescing, no blending together of these two extremes of being. Mysteriously, closely, and indissolubly one, they yet were separate and distinct, the peculiar properties of each unaffected and unchanged by its union with the other. This constituted one of the essential wonders in the “great mystery of godliness, God manifest in the flesh.”

The deity of Christ was incapable of change, else deity it could not be. It was incapable, too, of any sympathy or participation in the humiliation and suffering through which the humanity passed. Upholding and strengthening the manhood, it yet remained free from all the pains which it endured. Towering far above the storms which swept over the human soul of Christ — above the sea of suffering and blood through which he waded — above the infirmities, weaknesses, and tears which pressed upon the “incarnate mystery,” the Godhead of Jesus rose untouched, unaffected, and unmoved. The shock which convulsed to its centre his human frame, agitated not for an instant, his essential deity. Here all was calm, serene, and tranquil. The dark clouds which gathered around his inferior nature threw not a shadow athwart the sun of his superior nature.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f9a43e0148" data-kw="">
<blockquote><p>Of the knowledge of Christ, there be two parts, the first concerning his person, the second concerning his office. The person of Christ, is one, because Christ is one. Of the knowledge of Christ’s person, there be two parts: the first concerning the natures in the person of Christ, the other concerning his state.

There are two natures in the person of Christ, the divine, and the human nature. Therefore Jesus Christ is true God, and true man in one person. Rom. 1.3.4. and 9.5. 1. John. 4.2. 1. Timot. 3.16. Coloss. 2.9. Heb. 2.14.16. John. 1.1.

Thus far concerning the natures in the person of Christ: now concerning his state.

The state of Christ’s person is two fold: his humiliation, or exaltation. Phil. 2.7.8.9. Luke. 24.26. The humiliation of Christ is that state of his, in which he did abase himself below all creatures. Phil. 2.7.

Of his humiliation there are two parts? his incarnation, and obedience. The incarnation of Christ, is part of the humiliation of the son of God, when taking the human nature, he was manifested in the flesh. John. 1.14. 1. Tim. 3.16. The parts of the incarnation of Christ, are both his conception by the holy spirit, and the personal union of his two natures, and also his birth. The conception of Christ by the holy spirit, is the forming of the human nature of Christ, of the flesh and blood of the virgin Mary, by the miraculous working of the holy spirit. Mat. 1.18.20. Luke. 1.31.35.

The personal union of the two natures in Christ, is such a coupling of them as they might be one person. 1. Tim. 3.16. Coloss. 2.9. Gal. 4.4. Heb. 2.16. In this personal union, both the distinction of the two natures is to be considered, and also the effects of the union. In the personal union, the natures remain distinct, and not confused, whether we respect their essence, or the properties, or operations. Rom. 1.3.4. and 9.5. 1. Tim. 9.16. Heb. 9.14. 1. Pet. 3.18. and 4.1.

As therefore in that one person of Christ there be two natures: so there is a double mind, or understanding a double will, working, wisdom, strength, power, virtue, and so forth. The one heavenly and not created: the other human, and created. Luke. 2.52. Mar. 11.13. and 13.32. 1. John. 2.1.17. John. 2.25. and 6.64. and 5.20. Heb. 1.9. John. 1.33. and 4.6. Heb. 1.3. John. 2.19. and 10.18.

And each of the natures retaineth and keepeth his own essential properties, neither doth it communicate them, to the other nature, and that for two causes: the first is, least the natures should be mingled and confounded: the other, that there might forever remain a difference between the natures. Luke. 24.39. For he that confoundeth the properties, confoundeth the natures: and he that taketh away the properties, taketh away the natures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The substance of Christian religion soundly set forth in two books, by definitions and partitions, framed according to the rules of a natural method, by Amandus Polanus professor of divinity. The first book concerneth faith. The second concerneth good works. The principal points whereof are containe</cite>, trans. Elijahu Wilcocks (London: John Oxenbridge, 1595), pp 64-66.</span></figcaption>

<blockquote><p>Nothing can be plainer than that the Scriptures do teach that Christ is truly God, that He is truly man, and that He is one person. They assert of Him whatever may be said of God, and everything that can be said of a sinless man. They enter into no explanations. They assume it as a certain fact that Christ is God and man in one person, just as they assume that a man is a soul and body in one person.</p></blockquote>

</figure><figure class="quote" id="q-1f15f34314" data-kw="">
<blockquote><p>The eternal Father willed and proposed, that his eternal Son, for accomplishing his design of mercy towards sinners of mankind, should, in the fulness of time, assume their nature, and so become man. He from eternity saw, that “sacrifice and offering,” could not answer the exigence; that the debt was too great to be discharged so easily; and, that the redemption of souls was too precious, to be either purchased, or conferred, by a person of less than infinite dignity.

Therefore, having, in his infinite sovereignty, purposed, that the glory of his attribute of mercy, should, in the salvation of lost sinners of mankind, be illustriously displayed; he proposed, that the human nature should, in the fulness of time, be united to the Divine nature, in the person of the adorable Son. He willed and proposed, that the eternal Word should be made flesh; that he should take to himself, a true body, and a reasonable soul; not—as a person, distinct from his own Divine person, but—only as a nature, assumed unto a subsistence in his person.

To this gracious proposal, the only begotten Son, the second person of the eternal Trinity, having as yet, no nearer relation to man, than that of his Creator and sovereign Lord, did with infinite readiness consent. He said to his eternal Father, ‘Sacrifice and offering thou wouldst not, but a body hast thou prepared me:— Then said I, Lo, I come (in the volume of the book it is written of me) to do thy will, O God.” The eternal Word, consented to be made flesh, that all flesh might not perish. He agreed to become man, that he might be as really the Son of man, and one of the family of Adam; as he was already the Son of God, and one of the family of Heaven. This, in Him, was an instance of astonishing condescension.

By his consenting to assume, as well as by his act of assuming, the human nature, he made himself of no reputation. He assumed it, with all its sinless infirmities; in a state of servile subjection to the law as a covenant, under the meanest appearance, the heaviest load of imputed sin, and all the infinite weight of the curse of the law. The highest Monarch’s consenting, to lay aside his royal robes, to clothe himself with rags, and to become the most abject of the sons of men; is not once to be compared to this. Nay, the highest angel’s consenting to become a worm, is not once to be named, in comparison of the eternal Son, the equal of the Father, consenting to become man: for, while the distance, between the nature of angels, and that of worms of the dust, is but finite; the distance, between the nature of the only begotten of the Father, and that of man, is infinite.</p></blockquote>

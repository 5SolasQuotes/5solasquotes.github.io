<main class="wrap"><figure class="quote" id="q-8a312a8286" data-kw="">
<blockquote><p>Some infer from this passage that men were content with herbs and fruits until the deluge, and that it was even unlawful for them to eat flesh. And this seems the more probable, because God confines, in some way, the food of mankind within certain limits. Then after the deluge [Gen. 9], He expressly grants them the use of flesh. These reasons, however are not sufficiently strong: for it may be adduced on the opposite side, that the first men offered sacrifices from their flocks [Gen. 4]. This, moreover, is the law of sacrificing rightly, not to offer unto God anything except what He has granted to our use. Lastly men were clothed in skins [Gen. 3:21]; therefore it was lawful for them to kill animals. For these reasons, I think it will be better for us to assert nothing concerning this matter. Let it suffice for us, that herbs and the fruits of trees were given them as their common food; yet it is not to be doubted that this was abundantly sufficient for their highest gratification. For they judge prudently who maintain that the earth was so marred by the deluge, that we retain scarcely a moderate portion of the original benediction. Even immediately after the fall of man, it had already begun to bring forth degenerate and noxious fruits, but at the deluge, the change became still greater. Yet, however this may be, God certainly did not intend that man should be slenderly and sparingly sustained; but rather, by these words, He promises a liberal abundance, which should leave nothing wanting to a sweet and pleasant life. For Moses relates how beneficent the Lord had been to them, in bestowing on them all things which they could desire, that their ingratitude might have the less excuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 1, verse 28</span></figcaption>

olasquotes.github.io%2Fquote%2F8a312a8286.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8a312a8286.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-mans-original-state-in-righteousness/#:~:text=Some%20infer%20from%20this%20passage%20that,ingratitude%20might%20have%20the%20less%20excuse&amp;text=Some%20infer%20from%20this%20passage%20that%20men%20were&amp;text=that%20their%20ingratitude%20might%20have%20the%20less%20excuse" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-7cba05f842" data-kw="">
<blockquote><p>As has been expressed, this article’s considerations have been put forth with the intention of describing reality and ethical living, which we do everyday, more accurately and fully, not to open up a pandora’s box or skepticism. Indeed, very precise and somewhat complex principles and argumentation (perhaps dizzying) has been used, but that has only been to confirm common sense (or upright practical reason) from subtle, but very significant and potent, practical error, for people’s health. Flee all sophistry¹ (Isa. 5:20-21; Mt. 22:18; Col. 2:8) and simplistic ignorance (Ps. 19:7; Prov. 1:22; 8:5), both which are unworthy of your intelligence and hinder the fruit of God’s truth. † See ‘Which Philosophy Should be Used?’ at ‘Philosophy’ (RBO). ¹ See ‘On Sophistry’ at ‘On the Use of Reason in Theology’ (RBO). Be assured in all this in what is presented here there is no slippery slope. The weight of nature, and that which is above nature, in conjunction with it, will and ought to bear determinative ethical weight in situations according to the natures, context and proportions of that which is involved. God’s Law requires this (Lev. 19:15; Job 34:10-12; Ps. 28:4; 99:4; Prov. 2:9; Jer. 32:19; Mic. 6:8; Zech. 7:9; Mt. 16:27; 23:23; 26:60-61; Mk. 14:61-64; 15:31; Lk. 23:39; Jn. 7:24; 19:12, 17-22).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture: a Response to</cite>, [Edward] Feser’ (RBO, 2025) | Summary Conclusions, Philosophy Descriptive of Reality†</span></figcaption>

<blockquote><p>Human acts are the acts of the will directed by reason. They are either elicited, that is, produced by the will itself, or commanded, that is, produced by some other faculty under the influence of the will. Elicited acts are concerned either with the end or with the means. Three acts are concerned with the end: a) simple velleity, not yet efficacious; b) efficacious intention of the end; c) joy in the end attained. Two acts are concerned with means: a) consent, which accepts means; b) choice of a determined set of means. Each of these five acts of the will is preceded by a directive act of the intellect. Simple velleity, by the knowledge of the good in question; intention, by a judgment that this end should be attained; consent, by counsel; choice, by the last practical judgment which terminates deliberation. After voluntary choice there follows, in the intellect, the act called imperium, which directs the execution of the means chosen, ascending from lower means to those higher and nearer to the end to be obtained, in order inverse to that of intention, which descends from the desired end to the means which come first in execution. After the intellect’s imperium there follows in the will the act called active use, which sets the other faculties to work. These acts of the other faculties, called passive use, are, properly speaking, commanded acts of the will. And the will’s last act is that of joy in the possession of the end obtained. The end, which was first in the order of intention, is the last in the order of execution. … By the term ‘interior’ act St. Thomas often means an act which does not arise from a previous act, the first act, for example, of willing an end. By opposition, then, ‘exterior act’ often means not only the act of the corporeal members, but also an act of the will itself, if this act arises from a preceding act, as when, for example, we will the means because we already will the end. Here we must remark, further, that a human act, voluntary and free, is not necessarily preceded, if we speak precisely, by a discursive deliberation, but may be the fruit of a special inspiration, superior to human deliberation. But, even here, the act is free… because the will consents to follow the inspiration. Here lies the difference between the virtue of prudence, which presupposes discursive deliberation, and the gifts which make man prompt and docile to the inspirations of the Holy Ghost. These latter acts, free but not in the proper sense deliberate [deliberative], are the fruit, as we shall see later, not of co-operating grace, but of operating grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (St. Louis: Herder, 1950), ch. 46, ‘Human Acts’, pp. 278-80 Lagrange was a Neo-Thomist.</span></figcaption>

t%2C+the+first+act%2C+for+example%2C+of+willing+an+end.+By+opposition%2C+then%2C+%E2%80%98exterior+act%E2%80%99+often+means+not+only+the+act+of+the+corporeal+members%2C+but+also+an+act+of+the+will+itself%2C+if+this+act+arises+from+a+preceding+act%2C+as+when%2C+for+example%2C+we+will+the+means+because+we+already+will+the+end.+Here+we+must+remark%2C+further%2C+that+a+human+act%2C+voluntary+and+free%2C+is+not+necessarily+preceded%2C+if+we+speak+precisely%2C+by+a+discursive+deliberation%2C+but+may+be+the+fruit+of+a+special+inspiration%2C+superior+to+human+deliberation.+But%2C+even+here%2C+the+act+is+free%E2%80%A6+because+the+will+consents+to+follow+the+inspiration.+Here+lies+the+difference+between+the+virtue+of+prudence%2C+which+presupposes+discursive+deliberation%2C+and+the+gifts+which+make+man+prompt+and+docile+to+the+inspirations+of+the+Holy+Ghost.+These+latter+acts%2C+free+but+not+in+the+proper+sense+deliberate+%5Bdeliberative%5D%2C+are+the+fruit%2C+as+we+shall+see+later%2C+not+of+co-operating+grace%2C+but+of+operating+grace.%E2%80%9D%0A%0A%E2%80%94+Reginald+Garrigou-Lagrange%2C+Reality%3A+a+Synthesis+of+Thomistic+Thought+%28St.+Louis%3A+Herder%2C+1950%29%2C+ch.+46%2C+%E2%80%98Human+Acts%E2%80%99%2C+pp.+278-80+Lagrange+was+a+Neo-Thomist.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6faf9d6c2b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6faf9d6c2b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-human-soul/#:~:text=Human%20acts%20are%20the%20acts%20of,co%2Doperating%20grace%2C%20but%20of%20operating%20grace&amp;text=Human%20acts%20are%20the%20acts%20of%20the%20will&amp;text=not%20of%20co%2Doperating%20grace%2C%20but%20of%20operating%20grace" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…note that while the behavior of non-human animals is not deterministic, neither is it random or arbitrary. It is perfectly intelligible given their causal powers together with the powers of the things they interact with. Yet non-human animals do not have wills, much less free will… Aquinas’s answer is that the will is a power of the kind of thing whose activity arises from within it in a certain way–specifically, by way of having knowledge of the kind of which a rational substance alone is capable (Summa theologiae I-II.6.1-2). To act voluntarily is to know what you are doing in the way that human beings do.</p></blockquote>

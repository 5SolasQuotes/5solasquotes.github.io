<main class="wrap"><figure class="quote" id="q-301897e599" data-kw="">
<blockquote><p>For such a man shows his profligacy in everything so that everyone readily recognizes the life of the profligate and the life of the pure man by what is valued in each one’s household. In the house of the one there are frescoes on the wall which by their artful pictures inflame the sensual passions. These things bring out the nature of the illness, and through the eye passion pours in upon the soul from the dishonorable things which are seen. But in the house of the prudent man there is every precaution and foresight to keep the eye pure from sensual spectacles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-nyssen.html">Gregory of Nyssa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Life of Moses</cite>, trans. and eds. Abraham J. Malherbe and Everett Ferguson, The Classics of Western Spirituality (c. 390; New York: Paulist Press, 1978), Book 2.71, p. 70.</span></figcaption>

<blockquote><p>‘Whether to the King.’ It may be questioned, whom the apostle means by the word King? Such as understand the epistle to be written to the Jews, may perhaps conceive that the kings that ruled by deputation in Judea should be meant, such as were Herod and Agrippa. But in as much as the Jews were scattered through the provinces, and those provincial Jews were most in quiet: and in as much as for the reasons afore given, it is likely that the epistle was written to all Christians, both Jews and Gentiles; therefore by the King he meant Caesar.</p></blockquote>

<blockquote><p>Let your affection, then, be drawn out by us more and more as we nearly say to you what Ruth said to Naomi. We came here to become the same body with you. And as your God is our God, your people will from now on also be our people, your laws will be our laws, and your interests our interests. Where you live we will live; where you die we will die and we will be buried in your tombs. Love us, then, as your brothers and your countrymen, and kindly look down on our weaknesses. We were born in a climate that doesn’t give to everyone the wise, discreet and restrained temperament that yours gives to you. Put up with us, for as it is proper that we should conform ourselves as much as is possible to your prudence, we also hope that you in fairness will not hold against us all of our weaknesses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-claude.html">Jean Claude</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon on Ecclesiastes 7:14: Delivered during a Fast Day at The Hague, the Netherlands, on November 21, 1681 , trans. Charles K. Telfer in Mid-American Journal of Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-879df695cb" data-kw="">
<blockquote><p>Therefore seeing no king or governor is exempted from the laws, hand, and power of God, but that he ought to fear and tremble at it, we may proceed to the other part of the question: that is, whether kings, princes, and other governors ought to be obedient and subject to the positive laws of their country. To discuss this question, the right way and mean is as in all other things, to resort to the fountains and roots, and not to depend on the rulers and branches. For as if men should admit, that the church of Rome were the catholic church, and the pope the head of it, and God’s only vicar in earth, and not seek further how he cometh by that authority: than could no man say, but that all his doings (were they never so wicked) should seem just: so if men should build upon the authority that kings and princes usurp over their subjects, and not seek from whens they have their authority, nor whether that which they use, be just, there could be nothing produced to let their cruel tyranny. But forasmuch as we see from whence all politic power and authority cometh, that is, from God: and why it was ordained, that is, to maintain justice: we ought (if we will judge rightly) by God’s word examine to try this mater.

Saint Paul treating who should do obedience, and to whom obedience should be done, saith: Let every soul be subject to the powers that rule, for there is no power but of God. There are that would have this word, Soul, taken for man, not as he consisteth of soul and body both together, but only of the flesh: and that so by the word … should be understanding only a worldly man, that is, a lay man or temporal man (as we term it) and not a spiritual man and a minister of the church. Where upon Antichrist, the bishop of Rome seeking for subjects to be under his kingdom, hath taken for his subjects the clergy with tag and rag that to them belongeth: and hath made laws, that they should be his subjects, obedient to him and not to the political power and authority, where unto he leaveth for subjects only the temporality.

But in scripture this word (Soul) is taken for every kind of man, as may appear when it saith, that all the souls (that is, man and woman) that were in the ark with Noe, were eight. And that all the souls of the house of Jacob, which came in to Egypt were lxx. In which numbers it cannot be denied, but that there were as holy and as spiritual persons, as any are or were in the kingdom of the bishop of Rome. And Chrysostom (a priest) expounding this text (Let every soul be subject to the higher powers) sayeth: yea if thou be an apostle, an evangelist, a prophet, or what so ever thou art: for this subjection destroyeth not religion. So that it can not be denied, but by this word (Soul) is comprehended, every person, and none excepted.

Now touching this word (Power) some would have it interpreted for all those persons that execute justice, be he Kaiser, king, mayor, Sheriff, constable, horseholder, or never so low: and some would have it to be interpreted only of kings and chiefest officers. But it is here to be taken for the ministry and authority, that all officers of justice do execute: and so it may appear by Christ’s own words, where he saith: The kings of the nations rule over them, and those that exercise the authority or power, be called gracious Benefactors, or well doers. For as all men and women that seem to live together in the holy ordinance of Matrimony, be not man and wife, for it may be, that the man hath an other wife living or the wife other an husband, or that they came not together for the love of God only, and to avoid sin, but for sensuality, and to get riches, and so the ordinance it self is one thing, and the persons, that is, the man and woman an other: even so is the politic power or authority being the ordinance and good gift of God, one thing, and the person that executeth the same (be he king or Kaiser) an other thing. The ordinance being godly, the man may be equal and not of God, nor come thereto by God, as the Prophet Osee saith: They have made them a king, and not through me: a prince, and not through my counsel and will,

Neither is that power and authority which kings, princes, and other ministers of justice exercise, only called a power: but also the authority that parents have over their children, and masters over their servants, is also called a power: and neither be the parents nor masters the power it self, but they be ministers and executors of the power, being given unto them by God: Which also S. Paul in an other place plainly sheweth, saying to Titus: Warn them to be subject to the principalities and powers. Which some interpret, princes and powers, to make a distinction between the minister and the Ministry. And it followeth: to obey the officers, so that always the difference may be perceived. So than if by this word (Soul) is meant every person spiritual and temporal, man and woman: and by this word (power) the authority that kings and princes execute, than can not kings and princes, but be contained under this general word (Soul) as well as others.

And they being but executors of God’s laws, and men’s just ordinances, be also not exempted from them, but be bounden to be subject and obedient unto them. For good and just laws of man be God’s power and ordinances, and they are but ministers of the laws, and not the laws self. And if they were exempt from the laws, and so it were lawful for them to do what them lusteth, their authority being of God, it might be said, that God allowed their tyranny robbery of their subjects, killing them without law, and so God the author of evil: which were a great blasphemy. Justiniā the emperor well considered, when he made this saying to be put into the body of the Laws.

It is a worthy saying (saith he) for the Majesty of him that is in authority, to confess that the prince is subject to the laws, the authority of the prince do the so much depend on the authority of the laws. And certainly it is more honour than the honour of the empire, to submit the principality unto the laws. For in deed laws be made, that the wilful self will of men should not rule, but that they should have a line to lead them, as they might not go out of the way of justice: and that (if any would say, they did them wrong) they might allege the law for their warrant and authority.

It is also a principle of all laws grounded on the law of nature, that every man should use himself and be obedient to that law, that he will others be bounden unto. For otherwise he taketh away that equality (for there is no difference between the head and foot, concerning the use and benefit of the laws) whereby common wealths be maintained and kept up. What equality (I beseech you) should there be, where the subject should do to his ruler all the ruler would: and the ruler to the subject, that the ruler lusted?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ponet.html">John Ponet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A short treatise of politick power and of the true obedience which subjects owe to kings and other civil governors, with an exhortation to all true natural English men</cite>, (Strasbourg: The heirs of W. Köpfel, 1556), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

— John Ponet, A short treatise of politick power and of the true obedience which subjects owe to kings and other civil governors, with an exhortation to all true natural English men, (Strasbourg: The heirs of W. Köpfel, 1556), unpaginated.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore+seeing+no+king+or+governor+is+exempted+from+the+laws%2C+hand%2C+and+power+of+God%2C+but+that+he+ought+to+fear+and+tremble+at+it%2C+we+may+proceed+to+the+other+part+of+the+question%3A+that+is%2C+whether+kings%2C+princes%2C+and+other+governors+ought+to+be+obedient+and+subject+to+the+positive+laws+of+their+country.+To+discuss+this+question%2C+the+right+way+and+mean+is+as+in+all+other+things%2C+to+resort+to+the+fountains+and+roots%2C+and+not+to+depend+on+the+rulers+and+branches.+For+as+if+men+should+admit%2C+that+the+church+of+Rome+were+the+catholic+church%2C+and+the+pope+the+head+of+it%2C+and+God%E2%80%99s+only+vicar+in+earth%2C+and+not+seek+further+how+he+cometh+by+that+authority%3A+than+could+no+man+say%2C+but+that+all+his+doings+%28were+they+never+so+wicked%29+should+seem+just%3A+so+if+men+should+build+upon+the+authority+that+kings+and+princes+usurp+over+their+subjects%2C+and+not+seek+from+whens+they+have+their+authority%2C+nor+whether+that+which+they+use%2C+be+just%2C+there+could+be+nothing+produced+to+let+their+cruel+tyranny.+But+forasmuch+as+we+see+from+whence+all+politic+power+and+authority+cometh%2C+that+is%2C+from+God%3A+and+why+it+was+ordained%2C+that+is%2C+to+maintain+justice%3A+we+ought+%28if+we+will+judge+rightly%29+by+God%E2%80%99s+word+examine+to+try+this+mater.%0A%0ASaint+Paul+treating+who+should+do+obedience%2C+and+to+whom+obedience+should+be+done%2C+saith%3A+Let+every+soul+be+subject+to+the+powers+that+rule%2C+for+there+is+no+power+but+of+God.+There+are+that+would+have+this+word%2C+Soul%2C+taken+for+man%2C+not+as+he+consisteth+of+soul+and+body+both+together%2C+but+only+of+the+flesh%3A+and+that+so+by+the+word+%E2%80%A6+should+be+understanding+only+a+worldly+man%2C+that+is%2C+a+lay+man+or+temporal+man+%28as+we+term+it%29+and+not+a+spiritual+man+and+a+minister+of+the+church.+Where+upon+Antichrist%2C+the+bishop+of+Rome+seeking+for+subjects+to+be+under+his+kingdom%2C+hath+taken+for+his+subjects+the+clergy+with+tag+and+rag+that+to+them+belongeth%3A+and+hath+made+laws%2C+that+they+should+be+his+subjects%2C+obedient+to+him+and+not+to+the+political+power+and+authority%2C+where+unto+he+leaveth+for+subjects+only+the+temporality.%0A%0ABut+in+scripture+this+word+%28Soul%29+is+taken+for+every+kind+of+man%2C+as+may+appear+when+it+saith%2C+that+all+the+souls+%28that+is%2C+man+and+woman%29+that+were+in+the+ark+with+Noe%2C+were+eight.+And+that+all+the+souls+of+the+house+of+Jacob%2C+which+came+in+to+Egypt+were+lxx.+In+which+numbers+it+cannot+be+denied%2C+but+that+there+were+as+holy+and+as+spiritual+persons%2C+as+any+are+or+were+in+the+kingdom+of+the+bishop+of+Rome.+And+Chrysostom+%28a+priest%29+expounding+this+text+%28Let+every+soul+be+subject+to+the+higher+powers%29+sayeth%3A+yea+if+thou+be+an+apostle%2C+an+evangelist%2C+a+prophet%2C+or+what+so+ever+thou+art%3A+for+this+subjection+destroyeth+not+religion.+So+that+it+can+not+be+denied%2C+but+by+this+word+%28Soul%29+is+comprehended%2C+every+person%2C+and+none+excepted.%0A%0ANow+touching+this+word+%28Power%29+some+would+have+it+interpreted+for+all+those+persons+that+execute+justice%2C+be+he+Kaiser%2C+king%2C+mayor%2C+Sheriff%2C+constable%2C+horseholder%2C+or+never+so+low%3A+and+some+would+have+it+to+be+interpreted+only+of+kings+and+chiefest+officers.+But+it+is+here+to+be+taken+for+the+ministry+and+authority%2C+that+all+officers+of+justice+do+execute%3A+and+so+it+may+appear+by+Christ%E2%80%99s+own+words%2C+where+he+saith%3A+The+kings+of+the+nations+rule+over+them%2C+and+those+that+exercise+the+authority+or+power%2C+be+called+gracious+Benefactors%2C+or+well+doers.+For+as+all+men+and+women+that+seem+to+live+together+in+the+holy+ordinance+of+Matrimony%2C+be+not+man+and+wife%2C+for+it+may+be%2C+that+the+man+hath+an+other+wife+living+or+the+wife+other+an+husband%2C+or+that+they+came+not+together+for+the+love+of+God+only%2C+and+to+avoid+sin%2C+but+for+sensuality%2C+and+to+get+riches%2C+and+so+the+ordinance+it+self+is+one+thing%2C+and+the+persons%2C+that+is%2C+the+man+and+woman+an+other%3A+even+so+is+the+politic+power+or+authority+being+the+ordinance+and+good+gift+of+God%2C+one+thing%2C+and+the+person+that+executeth+the+same+%28be+he+king+or+Kaiser%29+an+other+thing.+The+ordinance+being+godly%2C+the+man+may+be+equal+and+not+of+God%2C+nor+come+thereto+by+God%2C+as+the+Prophet+Osee+saith%3A+They+have+made+them+a+king%2C+and+not+through+me%3A+a+prince%2C+and+not+through+my+counsel+and+will%2C%0A%0ANeither+is+that+power+and+authority+which+kings%2C+princes%2C+and+other+ministers+of+justice+exercise%2C+only+called+a+power%3A+but+also+the+authority+that+parents+have+over+their+children%2C+and+masters+over+their+servants%2C+is+also+called+a+power%3A+and+neither+be+the+parents+nor+masters+the+power+it+self%2C+but+they+be+ministers+and+executors+of+the+power%2C+being+given+unto+them+by+God%3A+Which+also+S.+Paul+in+an+other+place+plainly+sheweth%2C+saying+to+Titus%3A+Warn+them+to+be+subject+to+the+principalities+and+powers.+Which+some+interpret%2C+princes+and+powers%2C+to+make+a+distinction+between+the+minister+and+the+Ministry.+And+it+followeth%3A+to+obey+the+officers%2C+so+that+always+the+difference+may+be+perceived.+So+than+if+by+this+word+%28Soul%29+is+meant+every+person+spiritual+and+temporal%2C+man+and+woman%3A+and+by+this+word+%28power%29+the+authority+that+kings+and+princes+execute%2C+than+can+not+kings+and+princes%2C+but+be+contained+under+this+general+word+%28Soul%29+as+well+as+others.%0A%0AAnd+they+being+but+executors+of+God%E2%80%99s+laws%2C+and+men%E2%80%99s+just+ordinances%2C+be+also+not+exempted+from+them%2C+but+be+bounden+to+be+subject+and+obedient+unto+them.+For+good+and+just+laws+of+man+be+God%E2%80%99s+power+and+ordinances%2C+and+they+are+but+ministers+of+the+laws%2C+and+not+the+laws+self.+And+if+they+were+exempt+from+the+laws%2C+and+so+it+were+lawful+for+them+to+do+what+them+lusteth%2C+their+authority+being+of+God%2C+it+might+be+said%2C+that+God+allowed+their+tyranny+robbery+of+their+subjects%2C+killing+them+without+law%2C+and+so+God+the+author+of+evil%3A+which+were+a+great+blasphemy.+Justinia%CC%84+the+emperor+well+considered%2C+when+he+made+this+saying+to+be+put+into+the+body+of+the+Laws.%0A%0AIt+is+a+worthy+saying+%28saith+he%29+for+the+Majesty+of+him+that+is+in+authority%2C+to+confess+that+the+prince+is+subject+to+the+laws%2C+the+authority+of+the+prince+do+the+so+much+depend+on+the+authority+of+the+laws.+And+certainly+it+is+more+honour+than+the+honour+of+the+empire%2C+to+submit+the+principality+unto+the+laws.+For+in+deed+laws+be+made%2C+that+the+wilful+self+will+of+men+should+not+rule%2C+but+that+they+should+have+a+line+to+lead+them%2C+as+they+might+not+go+out+of+the+way+of+justice%3A+and+that+%28if+any+would+say%2C+they+did+them+wrong%29+they+might+allege+the+law+for+their+warrant+and+authority.%0A%0AIt+is+also+a+principle+of+all+laws+grounded+on+the+law+of+nature%2C+that+every+man+should+use+himself+and+be+obedient+to+that+law%2C+that+he+will+others+be+bounden+unto.+For+otherwise+he+taketh+away+that+equality+%28for+there+is+no+difference+between+the+head+and+foot%2C+concerning+the+use+and+benefit+of+the+laws%29+whereby+common+wealths+be+maintained+and+kept+up.+What+equality+%28I+beseech+you%29+should+there+be%2C+where+the+subject+should+do+to+his+ruler+all+the+ruler+would%3A+and+the+ruler+to+the+subject%2C+that+the+ruler+lusted%3F%E2%80%9D%0A%0A%E2%80%94+John+Ponet%2C+A+short+treatise+of+politick+power+and+of+the+true+obedience+which+subjects+owe+to+kings+and+other+civil+governors%2C+with+an+exhortation+to+all+true+natural+English+men%2C+%28Strasbourg%3A+The+heirs+of+W.+Ko%CC%88pfel%2C+1556%29%2C+unpaginated.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F879df695cb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/879df695cb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/05/22/john-ponet-the-magistrate-is-subject-to-the-positive-laws-of-the-country/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>And when having attained their ungodly desires (whether ambitious kings by bringing any country into their subjection, or disloyal subjects by their rebellious rising against their natural sovereigns), they have established any of the same degenerate forms of government among their people, the authority, either so unjustly gotten, or wrung by force from the true and lawful possessor, being always God’s authority (and therefore receiving no impeachment by the wickedness of those that have it), is ever (when any such alterations are thoroughly settled) to be reverenced and obeyed, and the people of all sorts (as well of the clergy as of the laity) are to be subject unto it, not only for wrath, but also for conscience sake.</p></blockquote>

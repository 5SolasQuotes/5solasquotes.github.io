<main class="wrap"><figure class="quote" id="q-eab22231a6" data-kw="">
<blockquote><p>The protesters [against mandated subscription] were led by Jonathan Dickinson (1688–1747)… Dickinson shows that he is well acquatined with the debates elsewhere [such as in Ireland]… Notably Dickinson sees it [presbyterianism] not as divinely mandated, but the best of many imperfect options. While acknowledging the usefulness of confessions…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-068e7925f0" data-kw="">
<blockquote><p>The language here employed [in the Scottish subscription formula in 1694 &amp; 1711] is cautious and temperate, and is thus well suited to the circumstances of a solemn profession to be made by a numerous body of men, who might not all see their way to concur in stronger and more specific phraseology. Besides, it is to be observed that the profession respects not merely the fundamentals or essentials of Presbyterianism in the abstract, which alone can be reasonably maintained to have the clear and positive sanction of apostolic practice; but ‘the Presbyterian government and discipline of this church,’ including the detailed development of the essential principles of Presbyterianism as exhibited in the actual constitution and arrangements of our church, and of all this in the concrete, or taken complexly, nothing higher or stronger could with propriety be affirmed, than that it is founded upon the word of God, and agreeable thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, vol. 1, p. 76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-98f1528e12" data-kw="">
<blockquote><p>It has been claimed that confessions were originally a statement of faith but were modified by the Roman Catholic Church into statements of what is to be confessed. “We believe” (Nicea) became “we teach that this is to be confessed” (Chalcedon) and finally “whoever does not believe… is condemned” (Athanasian Creed). With the adoption of anti-heretical creeds, binding to such creeds by means of subscription was also introduced. According to Schaff, the signing of the Creed adopted by the Council of Nicea (AD 325) is “the first instance of such signing of a document in the Christian Church.” Also worth mentioning is the seventh canon of the council of Laodicea (AD 364) which states that heretics are “to have thoroughly learned the symbols of faith.” In 1273 or 1274 the deputies sent from the Eastern Church to the Council of Lyons II were obliged to subscribe the unchanged NiceneConstantinopolitan Creed. It would thus seem that the custom of subscribing credal formulas is as old as the oldest extant credal formula adopted by an ecumenical council. It would be wrong, however, to assume that subscription as a custom was identical in both the Western and Eastern Churches. In the Western Church it was commonly practised. However, though the Eastern or Orthodox Church considers the decisions of the seven ecumenical councils to have credal authority, it does not have a tradition of confessions and subscription like that found in the Catholic and Protestant traditions. An authority on Orthodoxy states it as follows: ‘At a true Ecumenical Council the bishops recognize what the truth is and proclaim it; this proclamation is then verified by the assent of the whole Christian people, an assent which is not, as a rule, expressed formally and explicitly, but lived.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roelf-christiaan-janssen.html">Roelf Christiaan Janssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Credal Period’ in By this our Subscription: Confessional Subscription in the Dutch Reformed Tradition since 1816 PhD diss</cite>, (Theologische Universiteit, Gereformeerde Kerken, 2009), pp. 16-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-d21fb44e30" data-kw="">
<blockquote><p>We must for the honor of all those of either persuasion, with whom we have confered, declare that the professions and desires of all for the advancement of piety and true godliness are the same, their professions of zeal for the peace of the Church the same, of affection and duty to us the same; they all approve episcopacy;¹ they all approve a set form of liturgy; and they all disapprove and dislike the sin of sacrilege, and the alienation of the revenue of the Church. And if upon these excellent foundations, in submission to which there is such an harmony of affections, any superstructure should be raised to the shaking of these foundations, and to the contracting and lessening of the blessed gift of charity, which is a vital part of Christian religion, we shall think ourself very unfortunate, and even suspect that we are defective in that administration of government with which God has entrusted us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Interest of England in the Matter of Religion, pt. 2</cite>, Nor will any defect in the State Ecclesiastical ensue upon the removal of these matters in controversy: for the points of doctrine, worship and discipline acknowledged by both parties are a sufficient and ample foundation for the edification and peace of the Church to rest upon; for which we cannot have a fuller testimony than what is given by his Majesty in his aforesaid declaration:</span></figcaption>

</figure><figure class="quote" id="q-1e615a3ebe" data-kw="">
<blockquote><p>And all students in divinity are most expressly enjoined, upon pain of being declared unworthy of ever serving in the sacred ministry, to raise any stirs or debates about unnecessary questions, as concerning the order of God’s decrees, of universal grace by the preaching of nature, which may lead and bring men unto salvation, points only propounded and advanced by pure curiosity, and for the exercise of men’s wits. And all examiners of our proposans in order to the ministry, shall proceed in that business with very much charity, exacting from them nothing but what is demanded by the canons of our discipline; and provided they give that satisfaction which is requisite, by signing the Confession of Faith, the Liturgy of our Churches, and the Canons of Alez, Charenton, and Alenson, and this present act, they shall be approved and admitted.</p></blockquote>

<blockquote><p>V. Will worship, when God is worshiped with a naked and bare good intention, not warranted by the word of God. (Colossians 2:23) “Which things have indeed a shew o wisdom in will worship, and humility, and neglecting of the body; not in any honour to the satisfying of the flesh.” (1 Samuel 13:9–10) “And Saul said, bring hither a burnt offering to me, and peace offerings. And he offered the burnt offering. And it came to pass, that as soon as he had made an end offering the burnt offering, behold Samuel came.” and verse 13,”And Samuel said to Saul, Thou hast done foolishly: thou has not kept the commandment of the LORD thy God, which he commanded thee.” Hitherto we may add popish superstitions in sacrifices, meats, holydays, apparel, temporary and beadridden prayers, indulgences, austere life, whipping, ceremonies, gestures, gate, conversation, pilgrimage, building of altars, pictures, Churches, and all other of that rabble. To these may be added consort in music in divine service, feeding the ears, not edifying the mind. (1 Corinthians 14:15) “What is it then? I will pray with the spirit, and I will pray with the understanding also: I will sing with the spirit and I will sing with the understanding also..” Justin Martyr in his book of Christian Questions and Answers 107, It is not the custom of the Churches, to sing their meters with any such kind of instruments, etc. but their manner is to use plain song.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chaine, or The Description of Theologie Containing the Order of the Causes of Salvation and Damnation</cite>, …2nd edition (Cambridge, 1597; repr. Puritan Reprints, 2010), 69.</span></figcaption>

</figure><figure class="quote" id="q-43153d271d" data-kw="">
<blockquote><p>The argument of this paper is that Byzantine Iconoclasm was a response to the rise of Islam. This is an old-fashioned point of view. First advanced by the Byzantines themselves, the theory of Saracen influence was accepted by older scholarship on the subject, and long remained academically respectable. In the last generation, however, it has fallen out of favour. Contemporary literature on the subject, though far from agreed in other respects, is virtually unanimous that, whatever may have been the causes of Iconoclasm, Islam was not among them… the assumption that the Byzantines paid attention to what the successful Arabs believed is now deemed unproven, unnecessary or even incredible. Yet the case for Islam seems so effortless that the determination to exclude it must strike the outsider as an almost wilful exercise of professional scepticism… it is considerably simpler to assume that it was the role of Islam to make epidemic what had hitherto been merely endemic [in Christianity]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patricia-crone.html">Patricia Crone</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 3, ‘Islam, Judeo Christianity &amp; Byzantine Iconoclasm’ in From Kavad to al-Ghazali: Religion, Law &amp; Political Thought in the Near East c. 600 – c. 1100 Pre (Ashgate, 2005), pp. 59-96, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<blockquote><p>8th Practice. In some parish-churches where the sectaries are put in, they have put down all singing of psalms… and will not suffer the parishes to enjoy any singing of psalms; and in other places, they begin to put down all prayer in the public assemblies, and to say there must be only discoursing and preaching; and in places where they cannot prevail to shut out singing of psalms, they in a contemptuous manner clap on their hats in the time of singing of psalms, and having been pulled off, put them on again; yea in prayer also many of them keep on hats.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First &amp; Second Part of Gangræna, or a Catalogue &amp; Discovery of Many of the Errors, Heresies, Blasphemies &amp; Pernicious Practices of the Sectaries of this Time, Vented &amp; Acted in England in these Four Last Years</cite>, … (London, 1646), Catalogue, ‘Some Passages in the Prayers of the Sectaries’, pp. 56-57. See also the Third Part, New &amp; Further Discovery, ‘A Passage sent in a letter dated June 16, 1646…’, p. 96</span></figcaption>

<blockquote><p>He [Owen] intimates that it is not in our power to close with some and not withal. This is his first error. Though man give us no such power, God does: as it is in my power to believe all that one speaks truly and well, and not that which he speaks amiss. I am not bound to own all that any preacher or priest shall say in the church. God put it in the disciples’ power to beware of the leaven of the Pharisees [Mt. 16:6], and yet to hear them [Mt. 23:1-3]. Proving all things [1 Thess. 5:21] is not approving all things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), p. 25</span></figcaption>

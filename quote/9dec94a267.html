<main class="wrap"><figure class="quote" id="q-9dec94a267" data-kw="">
<blockquote><p>The charge and duty of Ministers is chiefly to preach the Gospel, and to announce and teach the Word of God to their people. They are therefore to be exhorted to forbear, and abstain from all manner of teaching that is either strange, or unfit, and not convenient or meet for edification, and to apply and conform themselves to the simplicity and ordinary stile of the Spirit of God, being most careful to bring and insert nothing into their preachings or Sermons that may cause the least prejudice to the honour &amp; authority of the holy Scripture; never preaching without taking for the Subject of their whole discourse a Text out of the holy Scripture, which they are to follow usually and punctually, exposing thereof as much as they shall be able, abstaining from all unnecessary amplifications, from all long, extravagant and not occasioned digressions, from a heap and number of common places and passages of the Scripture that are not needful, and from a vain recital or narration of divers, several fruit less expositions: not often, but very temperately and advisedly alleging the writings of the ancient Doctors; and less yet of prophane Authors and Histories: not handling their doctrine in a Scholastical manner, nor with mingling and mincing in of languages: In a word, they are to shun all that may serve for, or give the least suspicion or shew of ostentation. All which things that they may the better be observed, all Consistories, Colloquies, or Assemblies, and Synods, are to be very careful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ecclesiastical discipline of the reformed churches in France, or, The order whereby they are governed. Faithfully transcribed into English out of a French copy (London: Nicholas Bourne, 1642), 1.11, pp 4-5.</cite></span></figcaption>

<blockquote><p>The foregoing opinion [that the knowledge of God is self-evident] arose from their being accustomed from the beginning to hear and call upon the name of God. Now custom, especially if it dates from our childhood, acquires the force of nature, from which it happens that the mind holds those things with which it was imbued from childhood as firmly as though they were self-evident.</p></blockquote>

</figure><figure class="quote" id="q-6bb519db25" data-kw="">
<blockquote><p>The presbyterians deny not but private men may preach in some cases. None that fear God do desire any to bury their talent, nor would hinder men from doing the work of God. But they would have bona bene [good things done well], God’s work done in God’s order. On these conditions we [congregationalists of Baxter’s stripe] allow private men to preach.

1. If they do it but ex charitate [out of charity], and pretend not to the ministerial office.

2. And if they do it occasionally, and not as men separated to that work as their calling (for then they become ministers indeed while they disclaim it in name).

3. If they do it not needlessly, to a proud ostentation of their parts, but only when abler men, or ministers, are not to be had or else [are] on some urgent weighty cause.

4. If they make not themselves the judges of their own fitness, but expect the approbation of the judicious, faithful, concordant ministers that know them.

5. If they undertake no more than they can perform, and suppose not themselves fitter than they are, and so run not beyond their knowledge, nor dishonor not the work of God.

6. If they thrust not themselves into any church to preach without a call, nor ordinarily without the pastor’s consent.

7. If they do it not unseasonably when by offending they are likely to do more hurt than good.

8. If in the manner, season and continuance they submit to the guidance of the pastors of the Church (if it be more than ordinary teaching, and not such as every able master of a family may there do). With these cautions we grant that private men may preach; many episcopal divines grant it: and the presbyterians ordinarily permit it in their expectants that are trained up for the ministry… And, says Dr. Fulke, Demetrius himself does seem to allow that when no bishop was present, a layman might preach: Eusebius, Ecclesiastical History, bk. 6, ch. 19 [sect. 15-18]. But that every proud unworthy man and every seducing heretick should preach, yea and thrust himself into other men’s charges, or that any should preach besides the forementioned rules, this we deny, and take it for a dangerous usurpation. But are we not agreed [with the presbyterians] in this? Hear and judge: Mr. [John] Cotton so downright denies ordinary private men to prophesy, interpreting 1 Cor. 14:31 of extraordinarily gifted prophets (of which see his Keys, pp. 20-21) that Mr. [Thomas] Goodwin and Mr. [Philip] Nye thought meet to signify some dissent, ‘Preface’, p. 6. And yet they grant, that this must be performed by private men:

1. Only occasionally, not in an ordinary course.

2. By men of such abilities as are fit for office.

3. And not assuming this of themselves, but judged such by those that have the power, and so allowed and designed to it. And, 4. So as their doctrine be subjected (for the judging of it) in an especial manner to the teaching elders of that church. And I think that this is enough to signify that here we shall have no cause of a breach with them [presbyterians]. Mr. [John] Norton speaks to the same purpose, pp. 123-25, and joins with Mr. Cotton in denying prophesy to private men and expounding 1 Cor. 14 of extraordinarily gifted prophets only: In this therefore doctrinally we agree [with the presbyterians].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Concord</cite>, … (1655 / 1667; London: 1691), ch. 10, difference 8, pp. 38-39</span></figcaption>

<blockquote><p>As to the apostle’s determination to know, or preach, nothing else, than the doctrine of a crucified Saviour, it may be remarked, that judging of what he delivered orally, by what we find in his writings, he certainly did not confine himself to the dry and incessant reiteration of the truths we have detailed. On the contrary, we find him expressly affirming, that he had not shunned to declare the whole counsel of God; and there is actually apparent in his writings, a whole system of theological truth, and of evangelical ethicks, extensively taught and powerfully inculcated.

But that all this is perfectly consistent with what we have given as the import of the text, may be shown by an illustration, taken from the words of our Saviour himself. He told the Jews, that on two commandments, relating to the great principle of love—love to God and love to man—hang all the law and the prophets. In like manner, we affirm, that although the apostle declared many truths, taught many doctrines, and urged many duties, he still knew nothing hut Jesus Christ and him crucified, because every thing was made by him to hang upon, the cross.

The truths which we have recited, were so much and so often insisted on, that they formed a large and the most prominent part of his system, and thus gave to it its distinctive character and appellation. All his teaching, moreover, whatever was the subject or the occasion, savoured strongly of the cross; it always had a manifest consistency, and generally a plain connexion, with the doctrine of Christ crucified — From this doctrine it was often immediately derived; frequently it was little else than the ramification, or carrying out, of this doctrine, into its proper consequences; and not seldom, the teaching and illustration of some related truth, serving to give it clearness and effect.

In a word, the doctrine of Christ crucified, was the sun of the apostle’s theological system, which imparted lustre to every other truth, directed its course, and kept it to its proper orbit — The sun which threw off its beams of heavenly radiance in all directions, to warm, and cheer, and animate those who were already spiritually alive, and to waken into life, those who were yet slumbering in the frost and death of sin; which gave vitality and productive energy to every evangelical principle and precept; and to which every ray of truth might be traced back, as to its proper source; and to whose full orbed splendour every Christian eye was often directed, to catch some glimpses of a glory too intense for a full and steady vision, till mortality should be swallowed up of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ashbel-green.html">Ashbel Green</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ crucified, the characteristick of Apostolick preaching: a sermon delivered in the First Presbyterian Church of Philadelphia, at the opening of the General Assembly of the Presbyterian Church in the United States, May 19, 1825</cite>, (Philadelphia: Clark &amp; Raser, 1825), pp 8-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>
<div class="actions"><button class="copy" data-copy="“As to the apostle’s determination to know, or preach, nothing else, than the doctrine of a crucified Saviour, it may be remarked, that judging of what he delivered orally, by what we find in his writings, he certainly did not confine himself to the dry and incessant reiteration of the truths we have detailed. On the contrary, we find him expressly affirming, that he had not shunned to declare the whole counsel of God; and there is actually apparent in his writings, a whole system of theological truth, and of evangelical ethicks, extensively taught and powerfully inculcated.

But that all this is perfectly consistent with what we have given as the import of the text, may be shown by an illustration, taken from the words of our Saviour himself. He told the Jews, that on two commandments, relating to the great principle of love—love to God and love to man—hang all the law and the prophets. In like manner, we affirm, that although the apostle declared many truths, taught many doctrines, and urged many duties, he still knew nothing hut Jesus Christ and him crucified, because every thing was made by him to hang upon, the cross.

The truths which we have recited, were so much and so often insisted on, that they formed a large and the most prominent part of his system, and thus gave to it its distinctive character and appellation. All his teaching, moreover, whatever was the subject or the occasion, savoured strongly of the cross; it always had a manifest consistency, and generally a plain connexion, with the doctrine of Christ crucified — From this doctrine it was often immediately derived; frequently it was little else than the ramification, or carrying out, of this doctrine, into its proper consequences; and not seldom, the teaching and illustration of some related truth, serving to give it clearness and effect.

In a word, the doctrine of Christ crucified, was the sun of the apostle’s theological system, which imparted lustre to every other truth, directed its course, and kept it to its proper orbit — The sun which threw off its beams of heavenly radiance in all directions, to warm, and cheer, and animate those who were already spiritually alive, and to waken into life, those who were yet slumbering in the frost and death of sin; which gave vitality and productive energy to every evangelical principle and precept; and to which every ray of truth might be traced back, as to its proper source; and to whose full orbed splendour every Christian eye was often directed, to catch some glimpses of a glory too intense for a full and steady vision, till mortality should be swallowed up of life.”

— Ashbel Green, Christ crucified, the characteristick of Apostolick preaching: a sermon delivered in the First Presbyterian Church of Philadelphia, at the opening of the General Assembly of the Presbyterian Church in the United States, May 19, 1825, (Philadelphia: Clark &amp; Raser, 1825), pp 8-9.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+to+the+apostle%E2%80%99s+determination+to+know%2C+or+preach%2C+nothing+else%2C+than+the+doctrine+of+a+crucified+Saviour%2C+it+may+be+remarked%2C+that+judging+of+what+he+delivered+orally%2C+by+what+we+find+in+his+writings%2C+he+certainly+did+not+confine+himself+to+the+dry+and+incessant+reiteration+of+the+truths+we+have+detailed.+On+the+contrary%2C+we+find+him+expressly+affirming%2C+that+he+had+not+shunned+to+declare+the+whole+counsel+of+God%3B+and+there+is+actually+apparent+in+his+writings%2C+a+whole+system+of+theological+truth%2C+and+of+evangelical+ethicks%2C+extensively+taught+and+powerfully+inculcated.%0A%0ABut+that+all+this+is+perfectly+consistent+with+what+we+have+given+as+the+import+of+the+text%2C+may+be+shown+by+an+illustration%2C+taken+from+the+words+of+our+Saviour+himself.+He+told+the+Jews%2C+that+on+two+commandments%2C+relating+to+the+great+principle+of+love%E2%80%94love+to+God+and+love+to+man%E2%80%94hang+all+the+law+and+the+prophets.+In+like+manner%2C+we+affirm%2C+that+although+the+apostle+declared+many+truths%2C+taught+many+doctrines%2C+and+urged+many+duties%2C+he+still+knew+nothing+hut+Jesus+Christ+and+him+crucified%2C+because+every+thing+was+made+by+him+to+hang+upon%2C+the+cross.%0A%0AThe+truths+which+we+have+recited%2C+were+so+much+and+so+often+insisted+on%2C+that+they+formed+a+large+and+the+most+prominent+part+of+his+system%2C+and+thus+gave+to+it+its+distinctive+character+and+appellation.+All+his+teaching%2C+moreover%2C+whatever+was+the+subject+or+the+occasion%2C+savoured+strongly+of+the+cross%3B+it+always+had+a+manifest+consistency%2C+and+generally+a+plain+connexion%2C+with+the+doctrine+of+Christ+crucified+%E2%80%94+From+this+doctrine+it+was+often+immediately+derived%3B+frequently+it+was+little+else+than+the+ramification%2C+or+carrying+out%2C+of+this+doctrine%2C+into+its+proper+consequences%3B+and+not+seldom%2C+the+teaching+and+illustration+of+some+related+truth%2C+serving+to+give+it+clearness+and+effect.%0A%0AIn+a+word%2C+the+doctrine+of+Christ+crucified%2C+was+the+sun+of+the+apostle%E2%80%99s+theological+system%2C+which+imparted+lustre+to+every+other+truth%2C+directed+its+course%2C+and+kept+it+to+its+proper+orbit+%E2%80%94+The+sun+which+threw+off+its+beams+of+heavenly+radiance+in+all+directions%2C+to+warm%2C+and+cheer%2C+and+animate+those+who+were+already+spiritually+alive%2C+and+to+waken+into+life%2C+those+who+were+yet+slumbering+in+the+frost+and+death+of+sin%3B+which+gave+vitality+and+productive+energy+to+every+evangelical+principle+and+precept%3B+and+to+which+every+ray+of+truth+might+be+traced+back%2C+as+to+its+proper+source%3B+and+to+whose+full+orbed+splendour+every+Christian+eye+was+often+directed%2C+to+catch+some+glimpses+of+a+glory+too+intense+for+a+full+and+steady+vision%2C+till+mortality+should+be+swallowed+up+of+life.%E2%80%9D%0A%0A%E2%80%94+Ashbel+Green%2C+Christ+crucified%2C+the+characteristick+of+Apostolick+preaching%3A+a+sermon+delivered+in+the+First+Presbyterian+Church+of+Philadelphia%2C+at+the+opening+of+the+General+Assembly+of+the+Presbyterian+Church+in+the+United+States%2C+May+19%2C+1825%2C+%28Philadelphia%3A+Clark+%26+Raser%2C+1825%29%2C+pp+8-9.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff78274ae11.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f78274ae11.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/06/08/ashbel-green-preaching-christ-crucified-is-not-salvation-only-christianity/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Another leading characteristic of our Saviour’s preaching was its directness. It is possible that pulpit discourse should fail in this point, even when in some good degree spiritual and simple. We mean by directness, such a manner of exhibiting truth, as makes the audience feel that they themselves are concerned in it.

It is quite possible so to present human depravity, that even the attentive hearer shall hardly be reminded that he is depraved; so to insist on penitence, that he shall hardly once think of it as a duty which he should perform. You may so speak of “the sinner,” or of “sinners,” that you shall scarcely be suspected of the slightest reference to the persons present.

And though your teaching be orthodox, and your announcements of coming wrath distinct and emphatic, every heart before you may be as quiet as if your discourse had related to the dwellers in some other planet. It was eminently otherwise with Christ. He always made his hearers feel, not only that his speech was to them, but that they were interested in the truths he uttered. He not only declared to Nicodemus the general doctrine of the new birth, but he said also, “Ye must be born again.” “Art thou a master of Israel, and knowest not these things?”

To one who was curious to learn whether few or many would be saved, he said, “Strive to enter in at the strait gate;” thus reminding him that it should be his main object to secure his own salvation. In addressing the Scribes and Pharisees, his application of truth was often most pungent and terrible. “Wo unto you, Scribes and Pharisees, hypocrites! for ye shut up the kingdom of heaven against men; for ye neither go in yourselves, neither suffer ye them that are entering to go in.” “Wo unto you, Scribes and Pharisees, hypocrites! for ye are like unto whited sepulchres, which indeed appear beautiful outward, but are within full of dead men’s bones, and of all uncleanness.” As on a certain occasion he was uttering reproofs like these, one of the lawyers said to him, “Master, thus saying thou reproachest us also.”

But so far from retracting or qualifying what he had uttered, our Lord promptly replied, “Wo unto you, also, ye lawyers?” It is said, in a certain place, that “when the chief priests and Pharisees heard his parables, they perceived that he spake of them.” He so shaped his discourse on a particular occasion, that “they which heard it, being convicted by their own conscience, went out one by one, beginning at the eldest, even unto the last.” And the testimony of the wo man of Samaria was, “Come, see a man which told me all the things that ever I did.”

In all this he exhibited great fearlessness. For he knew full well it would give offence to many, and provoke, at times, the most violent opposition. And such, doubtless, to some extent, will be the result of a similar strain of preaching at the present day. It will be unhesitatingly adopted, however, by the wise and faithful minister. He can hope, otherwise, for but little success. A general statement of truth—a statement of it as relating to the world at large—the deceitful and self-flattering heart will be likely to disregard. It is only as “thou art the man,” rings in the perishing sinner’s ear, that preaching does its perfect work.</p></blockquote>

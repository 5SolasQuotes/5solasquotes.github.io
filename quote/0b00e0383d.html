<main class="wrap"><figure class="quote" id="q-0b00e0383d" data-kw="">
<blockquote><p>And this is one of the Effects which your Transubstantiation operates, destroying the most convincing Arguments you can offer the Infidels, and giving them an infallible means to defend themselves, and right to maintain, That if these Proofs be good, Transubstantiation is not a part of the Christian Religion; or if Transubstantiation be a part of the Christian Religion, these Proofs he of no validity.

It’s certain, if they be Men endued with sense, they will lay hold of the first of these Propositions. In effect it’s apparent, That Mr. Huet‘s Proof, are valid, and good in themselves; whereas ’tis not certain, That Transubstantiation is one of the Doctrines which Christianity teaches, not to say that it ought to be taken for granted, that it is not one of them.

It is so strange and offensive, and so little agrees with the whole Body of revealed Truths; either in general, or particular, that a Man needs only the use of his Senses, free from all prejudices, to perceive, That this comes not from the same Spring, and that the Author of Christianity is a very different Person from the Author of Transubstantiation.

Such Infidels then, that are discerning Men, will separate what’s offered to them jointly. They will embrace Christianity, and reject Transubstantiation: They will receive this Holy Religion, as coming from the Spirit of God, and put from them your Doctrine as a human Invention.

However ’tis not long of you, That they cast not themselves into the other aforementioned extremity: I mean, the persuading themselves that the Proofs of the Christian Religion be invalid. Yet you are for persuading them, not only That Transubstantiation is one of the Doctrines which the Gospel teaches, but moreover one of its principal ones; one of the most essential Points of Christian Religion, and that which can be least spared.

And consequently, if these Infidels be simple enough to believe this, and after such an Error have any reason left, they will only make use of it to persuade themselves, That that Religion which teaches such an incredible Doctrine, could not have been revealed by the Spirit of Truth; and that the Proofs which were made use of to establish the Divinity of it, are of no validity.</p></blockquote>

<blockquote><p>Jesus, which is taken up into heaven There are two members in this one sentence. The first is, that Christ was taken up into heaven, that they may not henceforth foolishly desire to have him any longer conversant with them upon earth. The other is straightway added as a consolation concerning his second coming. Out of these two jointly, and also severally, is gathered a firm, stable, and strong argument, to refute the Papists, and all other which imagine that Christ is really present in the signs of bread and wine. For when it is said that Christ is taken up into heaven; here is plainly noted the distance of place.

I grant that this word heaven is interpreted divers ways, sometimes for the air, sometimes for the whole connection of the spheres, sometimes for the glorious kingdom of God, where the majesty of God hath his [its] proper scat, howsoever it doth fill the whole world. After which sort Paul doth place Christ above all heavens, (Ephesians 1:22,) because he is above all the world, and hath the chiefest room in that place of blessed immortality, because he is more excellent than all the angels, (Ephesians 4:15.) But this is no let why he may not be absent from us bodily, and that by this word heavens, there may not be signified a separation from the world. Let them cavil as much as they will, it is evident that the heaven whereinto Christ was received is opposite to the frame of the world; therefore it doth necessarily follow, that if he be in heaven, he is without [beyond] the world.

But, first, we must mark what the purpose of the angels was, for thereby we shall more perfectly know what the words mean. The angels’ intent was to call back the apostles from desiring the carnal presence of Christ. For this purpose was it that they said that he should not come again until he came to judge the world. And to this end serveth the assigning of the time, that they might not look for him in vain before that same time. Who seeth not that in these words is manifestly showed that he was bodily absent out of the world? Who seeth not that we are forbidden to desire to have him upon the earth?

But, they think they escape safe with that crafty answer, when as they say that then he shall come visibly; but he cometh now invisibly daily. But we are not here to dispute of his form; only the apostles are taught that Christ must abide in heaven until such time as he appear at the latter day. For the desiring of his corporeal presence is here condemned as absurd and perverse. The Papists deny that he is present in the sacrament carnally, while that his glorious body is present with us after a supernatural sort, and by a miracle; but we may well enough reject their inventions concerning his glorious body, as childish and frivolous toys. They feign unto themselves a miracle not confirmed with any testimony of Scripture.

The body of Christ was then glorious, when as he was conversant with his disciples after his resurrection. This was done by the extraordinary and secret power of God; yet, notwithstanding, the angels do forbid to desire him afterward after that sort, and they say that he shall not come unto men in that sort (before the latter day.) Therefore, according to their commandment, let us not go about to pull him out of the heavens with our own inventions; neither let us think that we call handle him with our hands, or perceive him with our other senses, more than we can see him with our eyes. I speak always of his body. For in that they say it is infinite, as it is all absurd dream, so is it safely to be rejected.

Nevertheless, I willingly confess that Christ is ascended that he may fulfill [fill] all things; but I say that he is spread abroad everywhere by the power of his Spirit, not by the substance of his flesh. I grant, furthermore, that he is present With us both in his word and in the sacraments. Neither is it to be doubted, but that all those which do with faith receive the signs of his flesh and blood, are made truly partakers of his flesh and blood.

But this partaking doth nothing agree with the dotings of the Papists; for they feign that Christ is present in such sort upon the altar as Numa Pompilius did call down his Jupiter Elicitus, or as those witches did fetch down the moon from heaven with their enchantments. But Christ, by reaching us the bread in his Supper, doth will us to lift up our hearts into heaven, that we may have life by his flesh and blood. So that we do not eat his flesh grossly, that we may live thereby, but he poureth into us, by the secret power of his Spirit, his force and strength.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids MI: Baker, 1993), 18a: 51-53.</span></figcaption>

<blockquote><p>For if we duly consider what profit we have gained by the breaking of his sacred body, and the shedding of his blood, we shall clearly perceive that these properties of bread and wine, agreeably to this analogy, most appropriately represent it when they are communicated to us.</p></blockquote>

<blockquote><p>6. OBJECT. “To make adherence to these covenants, and an unlimited approbation of every tenet and act of the reformers, in entering into and maintaining them, necessary to admission to church privileges, renders your terms of communion very complex and unwieldy. And as many of the documents are now involved in obscurity, through the lapse of time, and the inaccuracy of records, a considerable part must be believed implicitly, and rested upon the fallible testimony of men.”

PERHAPS it may be admitted, that our terms of church communion could well enough bear some simplification, and amendment. We never believed them to be perfect. – With respect to an unlimited approbation of our venerable reformers, this we never require. We would wish to be followers of them as far as they were followers of Christ. We would call no man master, with regard to the articles of our faith. To the law and to the testimony of God, we would look for the sanction of all our religious principles, and approve of our ancestors, only as far as their conduct was agreeable to that unerring rule.

We adhere to our present religious system, not because it was adopted by our ancestors, but because we believe it to be agreeable to the word of God, and consequently ought to be adopted by all nations, wherever the scriptures have been revealed. We admire their faithfulness and valiant contendings, and hold ourselves bound to go and do likewise – As to the charge of implicit faith, it will, I trust, appear unfounded. Some knowledge of the history of any society, is necessary previous to a junction with it. Upon the man who would connect himself with any particular society of men, independently of this knowledge, the charge of implicit faith may justly devolve. This is necessary to form an accurate view of the ground on which the society stands. Particular parts of its history may be so interwoven with its constitution and laws, that the knowledge of the former is necessary to appreciate the value of the latter. With these, it is the business of every one, who intends connecting himself with the society, to be acquainted. Just so in our church admissions. We do not make anything a term of communion, but what is founded on the word of God. And when we find a man totally ignorant of our ecclesiastical history, we consider him unqualified to be an accurate judge of our church standing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-b-wylie.html">Samuel B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The obligation of covenants. A discourse</cite>, (Glasgow, 1803), pp 37-8.</span></figcaption>

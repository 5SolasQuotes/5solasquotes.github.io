<main class="wrap"><figure class="quote" id="q-2d5754804c" data-kw="">
<blockquote><p>For the divine mercy does not justify dead stocks, that is those doing nothing; nor horses and mules, that is, rebellious and untractable sinners, obstinately cleaving to their own lusts; but men, and those too full of compunction and contrition, and following the leadings of the Word and the Divine Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith</cite>, These inward works he specifies as (1) mourning over sin, (2) hoping in the Mediator, (3) to resolve on a new life, (4) “and other such like things.” Yet the first three of these things are simply the definition of repentance and the fourth can be understood of things that flow out of repentance in a particular person’s experience and life in an appropriate, saving response to the call of the Gospel. Davenant gives as a reason:, ch. 15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

gs%20of%20the%20Word%20and%20the%20Divine%20Spirit" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c3e7b5faa7" data-kw="">
<blockquote><p>4. For to your first demand, ‘Is this free grace?’ I shall crave leave to return you a counter-demand: Suppose a king be content at the suit either of the parties themselves or some friend of theirs, to grant his gracious pardon to a company of notorious rebels that had risen against him, set up some base desperate rogue in his room, done him all the despight and mischeif they were able to do; and being apprehended, arraigned and condemned to such death as by their wicked demerits they had most justly deserved, upon condition that they aknowledge their offence and their sorrow for it, with purpose and promise of living loyally for time to come; whether you would deem this to be free grace, or no? …refer it to any indifferent reader whatsoever to determine, whether he were not a most ungracious wretch, that having his pardon on such terms granted and signed him, should in regard of those conditions, deny it to be of free grace: and whether they do not blaspheme God’s free-grace that deny it to be free grace, if it be propounded on terms of belief, repentance and amendement of life. Sir, whatsoever you say of us, take heed how you tell Christ that He does not freely save you if He will not save you unless you believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Shadows without Substance</cite>, Shadows without Substance, or Pretended New Lights: together with the impieties and blasphemies that lurk under them, further discovered and drawn forth into the light: in way of rejoinder unto Mr. John Saltmarsh’s Reply entitled Shadows Flying Away… (London: Bostock, 1646), p. 48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>
<div class="actions"><button class="copy" data-copy="“4. For to your first demand, ‘Is this free grace?’ I shall crave leave to return you a counter-demand: Suppose a king be content at the suit either of the parties themselves or some friend of theirs, to grant his gracious pardon to a company of notorious rebels that had risen against him, set up some base desperate rogue in his room, done him all the despight and mischeif they were able to do; and being apprehended, arraigned and condemned to such death as by their wicked demerits they had most justly deserved, upon condition that they aknowledge their offence and their sorrow for it, with purpose and promise of living loyally for time to come; whether you would deem this to be free grace, or no? …refer it to any indifferent reader whatsoever to determine, whether he were not a most ungracious wretch, that having his pardon on such terms granted and signed him, should in regard of those conditions, deny it to be of free grace: and whether they do not blaspheme God’s free-grace that deny it to be free grace, if it be propounded on terms of belief, repentance and amendement of life. Sir, whatsoever you say of us, take heed how you tell Christ that He does not freely save you if He will not save you unless you believe.”

<blockquote><p>Metanoia-inchoate is anterior to faith, completed posterior. Thus metanoia considered according to the act of contrition is anterior to faith, according to the act of conversion, posterior. And so in a diverse respect metanoia is and is not anterior to faith, without contradiction.</p></blockquote>

<blockquote><p>In the earlier years of this blog, we advocated the traditional Reformed Presbyterian (RP) doctrine of political dissent. Further study has convinced us that this view, as far as it pertains to Britain, is at odds with the original Covenanter and Westminster doctrine of civil magistracy. Thomas Boston – who was a Covenanter, but not an RP – helpfully pointed out that the early RP position actually contradicted the original intent of the National Covenant of 1638 and the Solemn League and Covenant of 1643. We realise that modern RPs have modified this position somewhat, yet Boston’s comments are still worthy of consideration:

I find, that at the first taking of the covenant, they swear to maintain the King’s authority: as also, when, with additions, it was renewed in the year 1638, they swear to stand to the defence of his majesty’s person and authority. How agrees our dissenters’ principle, rejecting the authority of the Queen, with this part of the covenant? O, say they, “she is not a covenanted Queen, and therefore cannot be Queen of a covenanted land.”

Strange prejudices! Was not Scotland a covenanted land long ere the Solemn League and Covenant was heard tell of? Was not king Charles I. King of a covenanted land at that time when the covenant was renewed, and his authority sworn to be defended? But was he a covenanted king? Did he own their covenant? No, no; upon the contrary; he obliged some of their nobles at London to abjure it, declared the covenanters rebels, and brought down an army against them to force them from it. See Apologetical Relation, page 53.

As for the Solemn League and Covenant, we find them guilty the same way. It binds us expressly against schism, as well as Prelacy, superstition, and heresy. And that they are guilty of schism has been proven before. It also bound to the maintaining of the king’s authority, it being far from the mind of the covenanters to cast off the authority of the magistrate, though it was entered into without the king’s consent. Was it ever the mind of the covenanters that they would own no king, but one that had taken this covenant? I am sure the Parliament of Scotland thought not so, when in the year 1649 they proclaimed and declared to all the world, That Charles II was king of Great Britain, etc., their sovereign lord and king; and this was a full year before he took the covenant: for which see the Apologetical Relation, pp. 64, 65.

Nor did the General Assembly 1649 think so, when in their letter to the King’s Majesty (to be found amongst the printed Acts of the Assembly, in their last session), before he was come home, or had taken the Covenant, they call him “Most gracious Sovereign,” and subscribe the letter thus, “Your Majesty’s most loyal subjects, and humble servants, the Ministers and Elders convened in this national Assembly of the Kirk of Scotland:” While, in the mean time they tell him in the same letter, “That he had settled a peace with the Irish Papists, the murderers of so many thousands of his Protestant subjects, and granted to them (contrary to the standing laws of his royal progenitors) a full liberty of their abominable idolatry; which, say they, cannot be otherwise judged, but a giving of your royal power to the Beast;” and they exhort him to lay aside the service-book.

And several other things may be there found, that may make men blush to talk of their agreeing with the Church of Scotland in her principles in these times, and yet rejecting the authority of the present Queen. And, which is most lamentable, even those worthies that laid down their lives for the covenants, whose testimonies are recorded in Naphtali, having owned the King’s authority, and prayed for him on the scaffolds, must by this new doctrine be reputed to die as fools, who understood not the covenants they were laying down their precious lives for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Evil and Danger of Schism. A Sermon, by the late Learned and Pious Mr. Thomas Boston, Minister of the Gospel at Etterick</cite>, (1708; 3rd edn, Oxnam, 1756), pp 22-24.</span></figcaption>

<blockquote><p>There are several cases in which separation from the Church of England is sinful, as:

1. If any separate as the Papists do, because they are against sound doctrine or any good that is in the Church.

2. If any renounce communion with all the parish-churches under the name of the Church of England.

3. If any renounce communion with the Church of England as it is a Christian kingdom, headed by one Christian protestant king.

4. If they renounce communion with the Church of England as it is called one from the association or concord of its pastors or Church governors.

5. If any renounce communion with faulty bishops or worship, or discipline, simply and absolutely, and not only secundum quid [according to what; that is in a qualified manner], and so forsake the good that is in them for the sake of the evil. In a word, 1. all that separate for a wrong cause, 2. or further than they separate from Christ, or than Christ would have them separate, do sin. 2. But they that renounce any corruption as such, and the Church no further than secundum quid [according to that], as it is faulty, do well: For we must so renounce the faults of all Churches and Christians in the world (and our own first), but not the Churches and Christians for any tolerable faults, so that we commit no sin ourselves, which they impose as the condition of their communion.</p></blockquote>

<blockquote><p>And when the diet of the General Assembly came, having first done what they could for incapacitating all Brethren of differing judgment from these Resolutions, to sit in the Assembly, by citing them to the Assembly as guilty persons… did also make acts appointing and ordaining censures against all persons in this Church, whether Ministers or professors [professing Christians], that did not acknowledge the authority, and submit to the acts and constitutions of that Assembly concerning those Resolutions, and barring all such expectants [those training for the ministry] from entrance to the Ministry as should not acknowledge that authority, and submit to those constitutions; And in their Assembly of the next year at Edinburgh, do provide and ordain presbyteries to take special care, that upon the calling of any expectant to a particular charge of the ministry, before they admit him to his trials, they require him under his hand to pass from the Protestations and Declinators against this and the preceding General Assembly, if he has been accessory to the same; and to promise and give assurance that he shall abstain from holding up debates and controversies about matters of differences in this Kirk since the Assembly, 1650, in preaching, writing, or otherwise; upon the performance whereof, the presbytery shall proceed to his trials; If not, in that case the presbytery shall forbear to proceed, until the next General Assembly; leaving liberty to the presbytery or congregation for planting of the place otherwise: …By these proceedings and practices, the most unjust and irregular that we have known in this Church since we did begin to look at reformation in the year 1638, and which were indeed the great cause of the distempers and distractions that have since followed, malignant and disaffected men in congregations and presbyteries have got up the head, and having the advantage of the acts already mentioned, they do make a bar thereof to shut the door against the calling of able and godly men to the work of the Ministry, who cannot bring their consciences in bondage to these things;… …though yet the protesting Brethren have been tender even of these things [of order in due process], and have made conscience as to do nothing evil and sinful in itself, so to do nothing from contempt or disrespect to the least point of order; yea, they have been careful to keep within the bounds, warranted and allowed unto them of God; And, if it be fit to compare, we may truly say, that for all the noise our Brethren make against them, for the violation of order, and taking irregular courses, they have been more careful than themselves have been, and that they have more just and weighty grievance against them, even upon this accompt [account], than they have against the protesting Brethren:</p></blockquote>

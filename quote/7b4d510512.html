<main class="wrap"><figure class="quote" id="q-7b4d510512" data-kw="">
<blockquote><p>In Holland their ministers are maintained out of a public treasury, which the political magistrate takes care of. The first reforming ministers in that province, and in Zeland desired that it might be so; in which Voetius (Eccle. 1, book, 4, p. 804 &amp; 823) says they had Calvin’s advice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/increase-mather.html">Increase Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse Concerning the Maintenance due to those that Preach the Gospel</cite>, (1706) Mather was a New England, congregationalist puritan minister., p. 58</span></figcaption>

<blockquote><p>But seeing, as I proved, there ought to be a communion between all particular churches, not only in profession of the same faith, but also in the same specifical, and where it is possible, numerical worship, the refusing to hold this union and communion, in doctrine or worship, has the nature, and well deserves the name, of schism.</p></blockquote>

</figure><figure class="quote" id="q-411f6d6d8e" data-kw="">
<blockquote><p>This thesis is an examination of the eucharistic doctrine of ten Scottish theological writers in the tradition of Scottish Episcopacy… The argument of this thesis is that all of the writers, rejecting the Tridentine, Lutheran, Bezan-Calvinist, and Zwinglian definitions of the Eucharist, maintained a material sacrifice in the Eucharist, which is an offering to God the Father of bread and wine as the propitiatory memorial of Christ’s death on the Cross, commanded by Christ Himself at the Last Supper. The sacrifice is propitiatory because it is the means of representing the one sacrifice of Christ on the cross to God the Father, thereby pleading the benefits of the cross for the communicants. The bread and wine do not change substance, but become effectively the body and blood of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wallace-d-kornahrens.html">Wallace D. Kornahrens</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eucharistic Doctrine in Scottish Episcopacy</cite>, 1620-1875 Download (2008) PhD thesis 300 pp. | Abstract:</span></figcaption>

<blockquote><p>XV…

1. As the holy blessing, whose formula is found in Numbers 6, is an invocation of God, from whom all good things are desired for those who receive the blessing, so too is the Christian salutation a prayer, a form of invocation, through which, by faith and charity, we earnestly pray for the best things for others.

2. It is also a support for fellowship and an indication of charity.

3. And it should be done especially for the Holy Church, devout families, and individual believers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians</cite>, (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-7e7409ed15" data-kw="">
<blockquote><p>It is a question, the threatening standing, Gen. 2:17, how the active righteousness of Christ can be a cause meriting to us life and satisfying the Law when there is no [legal] suffering [by the saint] for the breach of the Law, which expressly required death in the sinner: Not to say that it seems too near to make Christ’s dying needless if his active holiness do the business; Nay we cannot so teach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, (1655), pt. 2, ch. 1; p. 230</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is a question, the threatening standing, Gen. 2:17, how the active righteousness of Christ can be a cause meriting to us life and satisfying the Law when there is no [legal] suffering [by the saint] for the breach of the Law, which expressly required death in the sinner: Not to say that it seems too near to make Christ’s dying needless if his active holiness do the business; Nay we cannot so teach.”

— Samuel Rutherford, The Covenant of Life Opened (1655), pt. 2, ch. 1; p. 230">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+a+question%2C+the+threatening+standing%2C+Gen.+2%3A17%2C+how+the+active+righteousness+of+Christ+can+be+a+cause+meriting+to+us+life+and+satisfying+the+Law+when+there+is+no+%5Blegal%5D+suffering+%5Bby+the+saint%5D+for+the+breach+of+the+Law%2C+which+expressly+required+death+in+the+sinner%3A+Not+to+say+that+it+seems+too+near+to+make+Christ%E2%80%99s+dying+needless+if+his+active+holiness+do+the+business%3B+Nay+we+cannot+so+teach.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Covenant+of+Life+Opened+%281655%29%2C+pt.+2%2C+ch.+1%3B+p.+230&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7e7409ed15.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7e7409ed15.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=It%20is%20a%20question%2C%20the%20threatening,business%3B%20Nay%20we%20cannot%20so%20teach&amp;text=It%20is%20a%20question%2C%20the%20threatening%20standing%2C%20Gen&amp;text=do%20the%20business%3B%20Nay%20we%20cannot%20so%20teach" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-766b45942f" data-kw="">
<blockquote><p>From the imputation of righteousness, a meritorious claim upon life and the reward of life itself equally follow. For just as the sentence of sin’s remission has regard to three things—sin, liability to punishment, and punishment itself—so the sentence of justification has regard to three things—Christ’s righteousness or satisfaction, that merit which belongs to Christ’s righteousness or satisfaction (for his satisfaction is meritorious of eternal life), and life itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’</cite>, tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 107-8 Rollock (c. 1555-1599) was a Scottish minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“From the imputation of righteousness, a meritorious claim upon life and the reward of life itself equally follow. For just as the sentence of sin’s remission has regard to three things—sin, liability to punishment, and punishment itself—so the sentence of justification has regard to three things—Christ’s righteousness or satisfaction, that merit which belongs to Christ’s righteousness or satisfaction (for his satisfaction is meritorious of eternal life), and life itself.”

— Robert Rollock, ‘Treatise on Justification’ tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 107-8 Rollock (c. 1555-1599) was a Scottish minister.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrom+the+imputation+of+righteousness%2C+a+meritorious+claim+upon+life+and+the+reward+of+life+itself+equally+follow.+For+just+as+the+sentence+of+sin%E2%80%99s+remission+has+regard+to+three+things%E2%80%94sin%2C+liability+to+punishment%2C+and+punishment+itself%E2%80%94so+the+sentence+of+justification+has+regard+to+three+things%E2%80%94Christ%E2%80%99s+righteousness+or+satisfaction%2C+that+merit+which+belongs+to+Christ%E2%80%99s+righteousness+or+satisfaction+%28for+his+satisfaction+is+meritorious+of+eternal+life%29%2C+and+life+itself.%E2%80%9D%0A%0A%E2%80%94+Robert+Rollock%2C+%E2%80%98Treatise+on+Justification%E2%80%99+tr.+Aaron+Denlinger+%26+Noah+Phillips+MAJT+27+%282016%29%2C+1.4.2.+%E2%80%98The+Imputation+of+Righteousness%E2%80%99%2C+pp.+107-8+Rollock+%28c.+1555-1599%29+was+a+Scottish+minister.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F766b45942f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/766b45942f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=From%20the%20imputation%20of%20righteousness%2C%20a,of%20eternal%20life%29%2C%20and%20life%20itself&amp;text=From%20the%20imputation%20of%20righteousness%2C%20a%20meritorious%20claim&amp;text=is%20meritorious%20of%20eternal%20life%29%2C%20and%20life%20itself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a56619ff23" data-kw="">
<blockquote><p>For 2. I add, it is by the satisfaction of Christ the Redeemer, wherein are contained both the matter and form of the justification of a sinner. The matter is Christ’s satisfaction, his obedience in his life, in his death; in fulfilling the law, and in suffering for our not fulfilling it; and the merit of all manifested in his resurrection and glorious ascension. The form is the imputing of that obedience whereby the righteousness of Christ does now become the believer’s as truly and really by imputation as it was Christ’s own in action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Titus</cite>, (Cambridge: Greene, 1612), on chapter 3, v. 7, p. 666 Taylor (1576-1632) was partially conforming English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“For 2. I add, it is by the satisfaction of Christ the Redeemer, wherein are contained both the matter and form of the justification of a sinner. The matter is Christ’s satisfaction, his obedience in his life, in his death; in fulfilling the law, and in suffering for our not fulfilling it; and the merit of all manifested in his resurrection and glorious ascension. The form is the imputing of that obedience whereby the righteousness of Christ does now become the believer’s as truly and really by imputation as it was Christ’s own in action.”

— Thomas Taylor, A Commentary upon the Epistle of St. Paul written to Titus… (Cambridge: Greene, 1612), on chapter 3, v. 7, p. 666 Taylor (1576-1632) was partially conforming English puritan.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+2.+I+add%2C+it+is+by+the+satisfaction+of+Christ+the+Redeemer%2C+wherein+are+contained+both+the+matter+and+form+of+the+justification+of+a+sinner.+The+matter+is+Christ%E2%80%99s+satisfaction%2C+his+obedience+in+his+life%2C+in+his+death%3B+in+fulfilling+the+law%2C+and+in+suffering+for+our+not+fulfilling+it%3B+and+the+merit+of+all+manifested+in+his+resurrection+and+glorious+ascension.+The+form+is+the+imputing+of+that+obedience+whereby+the+righteousness+of+Christ+does+now+become+the+believer%E2%80%99s+as+truly+and+really+by+imputation+as+it+was+Christ%E2%80%99s+own+in+action.%E2%80%9D%0A%0A%E2%80%94+Thomas+Taylor%2C+A+Commentary+upon+the+Epistle+of+St.+Paul+written+to+Titus%E2%80%A6+%28Cambridge%3A+Greene%2C+1612%29%2C+on+chapter+3%2C+v.+7%2C+p.+666+Taylor+%281576-1632%29+was+partially+conforming+English+puritan.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa56619ff23.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a56619ff23.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=For%202.%20I%20add%2C%20it%20is,it%20was%20Christ%E2%80%99s%20own%20in%20action&amp;text=For%202.%20I%20add%2C%20it%20is%20by%20the&amp;text=imputation%20as%20it%20was%20Christ%E2%80%99s%20own%20in%20action" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-644ed1a1be" data-kw="">
<blockquote><p>12. Cyril of Alexandria upon the Gospel of John, bk. 11, ch. 25: ‘As by the offense of the first man, as in the first fruits of our race, we have been sentenced to death; so by the obedience and righteousness of Christ, inasmuch as He subjected Himself to the Law, although He was the author of the Law, the blessing and quickening which is by the Spirit has reached to our whole nature.’ …And he extends this righteousness of Christ not to the satisfaction only, but to the fulfilling of the law: which, we must observe is opposed to the opinions of the Jesuits and others, who maintain that the passive obedience of Christ is imputed to us, not his active obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Justification: or The Disputatio de justitia habituali et actuali</cite>, …, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), ch. 29, pp. 260-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-345b4817ae" data-kw="">
<blockquote><p>2. In accepting us as righteous in Christ, who died for our sins to reconcile us unto God; and therefore sometimes he is said to be made righteousness to us, 1 Cor. 1:30, and we are said to be made the righteousness of God in Him, 2 Cor. 5:21, that is, we have the effect of his sufferings, as if we had suffered in person; for they were undergone in our stead and for our sakes, and the fruit of it given to us by God Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton in two parts: the first containing 27 Sermons on the Twenty-Fifth chapter of St. Matthew</cite>, … (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33, p. 333</span></figcaption>

<main class="wrap"><figure class="quote" id="q-95fd72c726" data-kw="">
<blockquote><p>It is not able to be said that Christ does not in any way pertain to reprobates. Christ pertains to them even (1) by right [jure] in the offer of the Gospel, (2) by the sufficiency of the death of Christ, (3) by the right of sharing in a common nature, (4) by right of the common, first transgression being expiated by Christ, (5) by right of the New Covenant being preached to the reprobate out of the grace of Christ, (6) by right of the charge of God inciting so that reprobates receive Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rutherford’s Examination of Arminianism: the Tables of Contents with Excerpts from Every Chapter</cite>, tr. Charles Johnson &amp; Travis Fentiman (1639-1642; 1668; 2019), ch. 9, ‘Of Universal Redemption’, ‘Whether Reprobates are required to believe in Christ, He not having died for them?’, pp. 94-95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is not able to be said that Christ does not in any way pertain to reprobates. Christ pertains to them even (1) by right [jure] in the offer of the Gospel, (2) by the sufficiency of the death of Christ, (3) by the right of sharing in a common nature, (4) by right of the common, first transgression being expiated by Christ, (5) by right of the New Covenant being preached to the reprobate out of the grace of Christ, (6) by right of the charge of God inciting so that reprobates receive Christ.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ccf4f8f6d0" data-kw="">
<blockquote><p>IV. The efficient cause of the Resurrection in common is the whole Holy Trinity; but singularly, Christ the Lord. Christ is its efficient cause in three ways: I. As God. II. As Judge of the World. III. As Mediator. In the first two ways he is the efficient cause of the resurrection of the reprobate as well as of the elect; in the third way he is the cause of the Resurrection of the faithful by merit, efficacy and beginning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 34 (the resurrection), canon 4</span></figcaption>

<blockquote><p>We grant that Christ’s death is sufficient to save many thousand worlds: we grant again it is every way most effectual in itself: but that it is effectual in, or unto the person of every man, that we deny.</p></blockquote>

</figure><figure class="quote" id="q-49d6c0837b" data-kw="">
<blockquote><p>II. Among the ancients, it appears that the universality of redemption was contended for by the Pelagians and Semipelagians. Hence Prosper [of Aquitaine, c. 390 – c. 455 AD] (concerning the remains of the Pelagian heresy) says, ‘This is their definition and profession that Christ died for the whole human race and that no one is excluded from the redemption effected by his blood’ (Letter to Augustine 6 [ACW 32:43; PL 33.1005]). And among the damnable errors which they boasted of having found in Augustine was this also: ‘The Savior was not crucified for the redemption of the whole world.’ Faustus (Rhegiensis) [a semi-pelagian prelate, d. c. 485 A.D.] says, ‘They wander far from the path of piety who say that the Savior did not die for all’ (De Gratia Dei et Libero Arbitrio 1.4 [PL 58.789])</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 14th Topic, ‘The Mediatorial Office of Christ’, Question 14, p. 455</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-f94b0cc77a" data-kw="">
<blockquote><p>To all these we may add that the Lord in commanding reprobates to rest on Christ for salvation, though no salvation be purchased for them, deals sincerely and candidly with them: for first He commands them to believe no intention in God to save them by the death of his Son, nor says He any such thing to them, but only commands them to rely on Christ as an all-sufficient Saviour.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8976fb3c62" data-kw="">
<blockquote><p>Therefore all hypocrites and idolaters try to do the works that properly pertain to the Deity and belong completely and solely to Christ. They do not actually say with their mouths: “I am God; I am Christ.” Yet in fact they arrogate to themselves the divinity of Christ and His function. In fact, then, they do say: “I am Christ. I am the Savior—not only my own but for others as well.” Thus the monks have taught, and they have persuaded the whole world of this, that they are able to justify not only themselves with their hypocritical sanctity but also others to whom they communicate it, even though it is the proper function of Christ alone to justify the sinner. Thus the pope, by extending his divinity over the whole world, has denied and completely suppressed the work of Christ and His divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 258–259.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-960975c5ef" data-kw="">
<blockquote><p>Since Paul knew that justification of faith is a refuge for those who lack righteousness of their own [cf. Romans chapter 5], he boldly infers that all who are justified by faith are excluded from works righteousness. But since it is certain that this is common to all believers, from this fact Paul with equal assurance determines that no one is justified by works [cf. Romans 3:20]—on the contrary, that men are justified without any help from our works. But it is one thing to discuss what value works have of themselves, another, to weigh in what place they are to be held after faith righteousness has been established. If we are to determine a price for works according to their worth, we say that they are unworthy to come before God’s sight; that man, accordingly, has no works in which to glory before God; that hence, stripped of all help from works, he is justified by faith alone. But we define justification as follows: the sinner, received into communion with Christ, is reconciled to God by his grace, while, cleansed by Christ’s blood, he obtains forgiveness of sins, and clothed with Christ’s righteousness as if it were his own, he stands confident before the heavenly judgment seat. After forgiveness of sins is set forth, the good works that now follow are appraised otherwise than on their own merit. For everything imperfect in them is covered by Christ’s perfection, every blemish or spot is cleansed away by his purity in order not to be brought in question at the divine judgment. Therefore, after the guilt of all transgressions that hinder man from bringing forth anything pleasing to God has been blotted out, and after the fault of imperfection, which habitually defiles even good works, is buried, the good works done by believers are accounted righteous, or, what is the same thing, are reckoned as righteousness [Romans 4:22].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.17.8 (Battles edn)</span></figcaption>

</figure><figure class="quote" id="q-7742e8c36a" data-kw="">
<blockquote><p>Nothing but the merit of Christ can be our righteousness in the sight of God, either as a whole, or a part only. We are justified only by believing, and receiving the righteousness of another, and not by our own works, or merit.</p></blockquote>

</figure><figure class="quote" id="q-70d3190d07" data-kw="">
<blockquote><p>XVII. (2) The adjudication of eternal life, with respect to its right (Rom. 6:22; Jn. 3:16), for when the guilt of eternal death is taken away through absolution, the right of eternal life cannot but follow it. So that from this, it is perceived with no trouble that there is not a real distinction between absolution from eternal death and adjudication of eternal life. For just as there is also not a real difference between satisfaction and merit, such that absolution must be sought in only satisfaction and the right to eternal life in only merit, and then the former, that is, satisfaction, in only passive righteousness, and the latter in only active. For the dikaioma on account of which we are justified, as it includes without division both forms of the righteousness of Christ, so also it provides without division the cause on account of which also we are freed from the guilt of sin, and receive the right to every good, just as we taught elsewhere explicitly (1.5.18 §XIV; §XI, above).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-cd8eefc134" data-kw="">
<blockquote><p>The whole tenor of Scripture warrants us in representing the redemption of lost sinners, through the atoning sacrifice of Jesus Christ, as the greatest of all God’s works—the brightest and most glorious display of his perfections—the very end for which this world itself was made.

When in the beginning the heavens and the earth were created, the Eternal Word, the second person of the glorious Trinity, went forth in the might and majesty of the Godhead, and said, “Let there be light, and there was light.” The Word of his power was sufficient to rear the universe in all its grandeur.

But when sinners were to be redeemed—when the darkness in which sin had involved the moral world was to be dispelled—when the disorder which had been wrought in the fairest and loveliest portion of God’s works, even the never-dying souls of creatures originally formed in his own image, was to be rectified—and when the spiritual world, which was in ruins, was to be raised again to order and beauty, the same Eternal Word went forth—not in the exercise of mere power—but in the likeness of sinful flesh, and tabernacled for a season among sinful men; and though men might have beheld, and some did behold his glory, “the glory as of the only begotten of the Father, full of grace and truth;” yet, before this new creation could be accomplished, he behoved to “humble himself, and become obedient unto death, even the death of the cross.”

And if, then, at the creation of the material universe, “the morning stars sang together, and all the sons of God shouted for joy,” equally abundant must have been their joy, and still more profound their admiration, when they beheld the same glorious Being, the almighty Creator of all things, assuming the likeness, and placing himself in the room, of his fallen and ruined creatures, that he might redeem and restore them. He travailed, indeed, in the greatness of his strength; but he travailed in pain, and agony, and blood, bearing the sins of his people in his own body on the tree, and pouring out his soul an offering for sin.

And so the Scriptures represent the mediatorial work of Christ as it appears in the eyes of the higher orders of God’s intelligent creatures; for while a multitude of the heavenly host announced the birth of Christ with songs of praise to God, saying, “Glory to God in the highest, and on earth peace, good-will towards men;” we are also assured, that in the great salvation wrought out by the obedience and death of the Lord Jesus Christ, there is a mystery “into which the angels desire to look;” and that “now unto the principalities and powers in heavenly places is known by the Church the manifold wisdom of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-gordon.html">Robert Gordon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sanctification of the Sabbath: A Discourse in Christian Miscellany</cite></span></figcaption>

</figure><figure class="quote" id="q-ac26449f03" data-kw="six days creation">
<blockquote><p>Creation may be viewed either in general with regard to the production of the whole universe, or in particular with regard to the production of its various parts in the six days of creation. In the latter, their creation is first set forth, then their distinction and lastly their adornment. In all these, God demonstrates his power splendidly in the production of all things (great as well as small) ex nihilo by his word alone; his wisdom, in their variety, order and use; his goodness, in the communication of himself (by which he made all things very good).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-6c7ba3e091" data-kw="" data-pol="rome">
<blockquote><p>He, then, who admits not that all the desires of the flesh are sins, and that that disease of concupiscence, which they call a stimulus, is a fountain of sin, must of necessity deny that the transgression of the law is sin.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-92eff3184b" data-kw="">
<blockquote><p>But although these writers are to be blamed, inasmuch as forsaking the form of sound words they introduce vain janglings, yet, in reality, they seem to be sounder than those who, taking their name from Luther rather than from Christ, speak of the Word and sacraments in such a way as to make them essential to the bestowal of grace and justification, rejecting, indeed, nominally, the opus operatum, yet attributing no less efficacy to the external ceremony than those who regard the sacraments as the true causes of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis purioris theologiae</cite>, § XLIII.28. Quoted in Herman Witsius, On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), p. 173.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>
<div class="actions"><button class="copy" data-copy="“But although these writers are to be blamed, inasmuch as forsaking the form of sound words they introduce vain janglings, yet, in reality, they seem to be sounder than those who, taking their name from Luther rather than from Christ, speak of the Word and sacraments in such a way as to make them essential to the bestowal of grace and justification, rejecting, indeed, nominally, the opus operatum, yet attributing no less efficacy to the external ceremony than those who regard the sacraments as the true causes of grace.”

</figure><figure class="quote" id="q-ecd50798a7" data-kw="">
<blockquote><p>3. We do not in the least doubt to affirm that some of these are empty quibbles, and that in most of them the disagreement arises, not from a real dissent of the Churches themselves, but partly from the preposterous zeal of certain ministers indulging too much in their own affections and genius, partly from not observing the pattern (ὑποτυπώσιν) of sound words, partly from not correctly understanding the mutual opinions of the dissenting parties, partly from a different mode of explaining, when there is consent in the thing explained. So that it is probable, if the matters themselves are more diligently weighed by pious, learned, candid, and moderate men of both parties, either in a synod or otherwise in friendly conference, a not insignificant, nay, a very great hope (with divine favor) may rightly be conceived, that these controversies will be settled, and a perfect concord in matters of faith may be entered into.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Determinations, ‘The Reformed Churches do not Dissent</cite>, pp. 149-53 in Theological Determinations, ‘The Reformed Churches do not Dissent in the Fundamentals of the Faith’ in Works of Samuel Ward… ed. Seth Ward (d. 1643; Gallibrand, 1658), p. 150</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

<main class="wrap"><figure class="quote" id="q-edb31f6d27" data-kw="">
<blockquote><p>Observe that the particular day of the week on which the Sabbath is to be kept, although fixed for revealed reasons by the will of God at the creation, never was, or could be, of the essence of the institution itself. The command to observe the Sabbath is essentially as moral and immutable as the commands to abstain from stealing, killing or adultery.

It has, like them, its ground in the universal and permanent constitution and relations of human nature. It was designed to meet the physical, moral, spiritual and social wants of men; to afford a suitable time for the public moral and religious instruction of the people and the public and private worship of God; and to afford a suitable period of rest from the wear and tear of secular labour.

It is therefore of the very essence of the institution that a certain proper proportion of time, regularly recurring and observed in common by the community of Christian people and of Christian nations, should be appointed and its observance rendered obligatory by divine authority. These essential elements are found unchanged under both dispensations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander-hodge.html">Archibald Alexander Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Day Changed and the Sabbath Preserved</cite>, (n.p., 1877), pp 3-4.</span></figcaption>

<blockquote><p>Now, even at this very time, when we are seeking and searching to find out the misdeeds on account of which God punishes us, and in what we have offended, you allege against us, that we have changed the divine service, and the order of the Church, which had been so well established and observed in this town. This is not any new reproach, for it was made against Jeremiah in his time, as he relates in the forty-fourth chapter. It is, that the hypocrites complain, that since they had left off the adoration of the Queen of Heaven, they had had nothing but famine, war, and all poverty. Lactantius also, an ancient doctor of the Church, and St. Augustine, demonstrate that in their time all the afflictions which had happened in the world were imputed to the Evangel, because it had brought about the abolition of the Pagan superstitions, which were thought to be service to God. You will reply, that it was not all alike; we hold that it was. What then is to be done? We must ascertain what is the truth upon the point, in order to pronounce a sound and correct opinion. Well, then, besides that our consciences speak peace to us before God as touching that, the thing itself can clearly answer for us before men. For no one has hitherto shewn us that we had changed anything which was commanded of God, nor that we had introduced any novelty against his person, nor that we had declined from the truth to lay hold on some evil doctrine. On the contrary, it is notorious that we have reformed our Church according to the pure doctrine of God, which is the rule to apply and to keep up a healthy state. It is true, that it is rather an odious thing to alter what has been hitherto received. But the order which our Lord has once delivered to us ought to be for ever inviolable. Thus, when it has been forsaken for a season, it ought to be renewed and set up again, even should heaven and earth commingle. There is no antiquity, no custom which can be set up or pleaded in prejudice of this doctrine, that the government of the Church established by the authority of God should be perpetual even to the end of the world, since he has willed and determined that it should be so. The reasons which have made us change are more than sufficiently urgent. The first point in Christianity is the true adoration of God. Now, we have come to know, that the form of adoration which we have been in the habit of observing was false and perverted, and, moreover, that it was not in the spirit of truth, (John 4,) but in external ceremonies, and even in superstitious practices. It is certain that then we did not adore God alone, but wood and stones instead of him, the pictures, the reliquaries of the dead, and things of a like kind. To the adoration of God is conjoined the rule of worshipping him aright. And in what manner is it that he is invoked throughout the Papacy, except with doubt and distrust, inasmuch as they know nothing about the office of Jesus Christ as our Advocate and Intercessor, by whom we obtain our requests? (Rom. 8; 1 Tim. 2; 1 John 2; Heb. 4) Besides, what are the public prayers but murmurs and ululations, vain repetitions without understanding? Thirdly, how many blasphemies are there in it, in so far as the power of the sole Mediator is attributed to saints and saintesses, to obtain grace in their name and by their merits? After the invocation follows the service, as if we were instructed to serve God by the vain traditions of men. On the contrary, he wills and requires that we take for our rule his will alone throughout. (Deut. 12; 1 Kings 15) As concerning the confidence and firm persuasion of our salvation, which is like, as it were, the foundation of all, instead of relying on his pure mercy, in order to have our consciences at rest, and give to him the glory which appertains to him, we were taught, like the rest of the world, to put our trust partly in ourselves, and partly in other creatures. There is no need, however, to rehearse all the rest, for there would be no end of that. For, in short, it has come to this, that the grace of Jesus Christ was, as it were, buried out of sight to us. When we have understood so much, and that it has been clearly proven to us, that all that was abomination in the sight of God, what could we have done? Were we to withstand God, and to resist his truth? Had it merely been a matter of Church order, if it had been at all bearable, we might have been content to remain, but it was such a Babel of confusion and disorder, that there remained no other remedy but that of an entire renovation. What shall we say of the Sacraments, the observance and use of which had been altogether perverted from the ordinance of Jesus Christ our Lord? How many silly baptismal ceremonies had been sought out and invented by men, without the authority of God! And what is worse, the true and pure institution of our Lord was, as it were, abolished by such frivolous patchwork. In short, they set a greater value upon the anointing chrism than the water, and at present it seems to be a settled point with you, that our baptism is null, because we have only retained what the Lord has commanded, and what the Apostles have observed and held fast in practice. As for the holy Supper, it has been much more profaned. Our Lord has left us that as a pledge, on purpose that (we might be) certain that our souls are nourished from his body and from his blood, to make us partakers of all his benefits, and peculiarly so of his death and passion. In order that we may do this, we ought to distribute it according to the terms of his commandment, namely, in declaring the worth and efficacy of the mystery. On the contrary, they have converted it into a sacrifice, to make reconciliation anew with God by man’s work, and not for the living only, but also for the dead. The priest, to make what he considers a due use of the sacrament, separates himself from the Church. The whole is done and spoken in an unknown language, after the manner of enchanters with their charms. When Easter comes, again they only give to the people the half of the sacrament, depriving them of the cup, against the express command of the Master. To consent to such sacrilege as that, is not even to be thought of. And yet, nevertheless, they reproach us with having let down and abased this holy sacrament. But the thing speaks for itself, that we have restored it in complete integrity, where it had been corrupted and polluted in so many ways. St. Paul, wishing to correct an abuse which had grown up among the Corinthians in reference to this sacrament, sends them back to the first institution of the ordinance by the Lord himself, as to an inviolable statute. (1 Cor. 11) What could we do, then, to correct the infinite abuses with which it had been contaminated, except to follow that same rule? Let them shew us, if they can, if there be anything in the manner of our worship which is not conformable to the institution of our Lord, to the usage of the Apostles, and we are ready to amend our fault. But when they accuse us without either rhyme or reason, that will not in the least disturb or excite us, so as to make us renounce the true and settled institution. Wherefore, that which you impute to us as a fault, we hold and take to be a work of God, the best which we had been able to attain to. Yet nevertheless, we do not deny that we have come very far short in many respects, for which our Lord has good right to punish us, but it is in regard that our life does not correspond with his holy doctrine of which we make a profession.</p></blockquote>

ion+of+our+salvation%2C+which+is+like%2C+as+it+were%2C+the+foundation+of+all%2C+instead+of+relying+on+his+pure+mercy%2C+in+order+to+have+our+consciences+at+rest%2C+and+give+to+him+the+glory+which+appertains+to+him%2C+we+were+taught%2C+like+the+rest+of+the+world%2C+to+put+our+trust+partly+in+ourselves%2C+and+partly+in+other+creatures.+There+is+no+need%2C+however%2C+to+rehearse+all+the+rest%2C+for+there+would+be+no+end+of+that.+For%2C+in+short%2C+it+has+come+to+this%2C+that+the+grace+of+Jesus+Christ+was%2C+as+it+were%2C+buried+out+of+sight+to+us.+When+we+have+understood+so+much%2C+and+that+it+has+been+clearly+proven+to+us%2C+that+all+that+was+abomination+in+the+sight+of+God%2C+what+could+we+have+done%3F+Were+we+to+withstand+God%2C+and+to+resist+his+truth%3F+Had+it+merely+been+a+matter+of+Church+order%2C+if+it+had+been+at+all+bearable%2C+we+might+have+been+content+to+remain%2C+but+it+was+such+a+Babel+of+confusion+and+disorder%2C+that+there+remained+no+other+remedy+but+that+of+an+entire+renovation.+What+shall+we+say+of+the+Sacraments%2C+the+observance+and+use+of+which+had+been+altogether+perverted+from+the+ordinance+of+Jesus+Christ+our+Lord%3F+How+many+silly+baptismal+ceremonies+had+been+sought+out+and+invented+by+men%2C+without+the+authority+of+God%21+And+what+is+worse%2C+the+true+and+pure+institution+of+our+Lord+was%2C+as+it+were%2C+abolished+by+such+frivolous+patchwork.+In+short%2C+they+set+a+greater+value+upon+the+anointing+chrism+than+the+water%2C+and+at+present+it+seems+to+be+a+settled+point+with+you%2C+that+our+baptism+is+null%2C+because+we+have+only+retained+what+the+Lord+has+commanded%2C+and+what+the+Apostles+have+observed+and+held+fast+in+practice.+As+for+the+holy+Supper%2C+it+has+been+much+more+profaned.+Our+Lord+has+left+us+that+as+a+pledge%2C+on+purpose+that+%28we+might+be%29+certain+that+our+souls+are+nourished+from+his+body+and+from+his+blood%2C+to+make+us+partakers+of+all+his+benefits%2C+and+peculiarly+so+of+his+death+and+passion.+In+order+that+we+may+do+this%2C+we+ought+to+distribute+it+according+to+the+terms+of+his+commandment%2C+namely%2C+in+declaring+the+worth+and+efficacy+of+the+mystery.+On+the+contrary%2C+they+have+converted+it+into+a+sacrifice%2C+to+make+reconciliation+anew+with+God+by+man%E2%80%99s+work%2C+and+not+for+the+living+only%2C+but+also+for+the+dead.+The+priest%2C+to+make+what+he+considers+a+due+use+of+the+sacrament%2C+separates+himself+from+the+Church.+The+whole+is+done+and+spoken+in+an+unknown+language%2C+after+the+manner+of+enchanters+with+their+charms.+When+Easter+comes%2C+again+they+only+give+to+the+people+the+half+of+the+sacrament%2C+depriving+them+of+the+cup%2C+against+the+express+command+of+the+Master.+To+consent+to+such+sacrilege+as+that%2C+is+not+even+to+be+thought+of.+And+yet%2C+nevertheless%2C+they+reproach+us+with+having+let+down+and+abased+this+holy+sacrament.+But+the+thing+speaks+for+itself%2C+that+we+have+restored+it+in+complete+integrity%2C+where+it+had+been+corrupted+and+polluted+in+so+many+ways.+St.+Paul%2C+wishing+to+correct+an+abuse+which+had+grown+up+among+the+Corinthians+in+reference+to+this+sacrament%2C+sends+them+back+to+the+first+institution+of+the+ordinance+by+the+Lord+himself%2C+as+to+an+inviolable+statute.+%281+Cor.+11%29+What+could+we+do%2C+then%2C+to+correct+the+infinite+abuses+with+which+it+had+been+contaminated%2C+except+to+follow+that+same+rule%3F+Let+them+shew+us%2C+if+they+can%2C+if+there+be+anything+in+the+manner+of+our+worship+which+is+not+conformable+to+the+institution+of+our+Lord%2C+to+the+usage+of+the+Apostles%2C+and+we+are+ready+to+amend+our+fault.+But+when+they+accuse+us+without+either+rhyme+or+reason%2C+that+will+not+in+the+least+disturb+or+excite+us%2C+so+as+to+make+us+renounce+the+true+and+settled+institution.+Wherefore%2C+that+which+you+impute+to+us+as+a+fault%2C+we+hold+and+take+to+be+a+work+of+God%2C+the+best+which+we+had+been+able+to+attain+to.+Yet+nevertheless%2C+we+do+not+deny+that+we+have+come+very+far+short+in+many+respects%2C+for+which+our+Lord+has+good+right+to+punish+us%2C+but+it+is+in+regard+that+our+life+does+not+correspond+with+his+holy+doctrine+of+which+we+make+a+profession.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+%E2%80%9CTo+Monsieur+Le+Cur%C3%A9+de+Cernex%E2%80%9D+1543%29+in+Letters+of+John+Calvin%2C+ed.+Jules+Bonnet+%28repr.+Bellingham%2C+WA%3A+Logos+Bible+Software%2C+2009%29%2C+1.367%E2%80%9370.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8c3d3fff46.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8c3d3fff46.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/05/calvin-the-rule-of-worship-necessitated-the-reformation/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

</figure><figure class="quote" id="q-a84fbec54d" data-kw="">
<blockquote><p>The advice of the Committee is that the Synod accede to the overture of Classic Grand Rapids East, that is a) ‘To amend Article 69 of our Church Order….so that a synodically approved collection of hymns may be added which may be used in our public worship and regular services; b)’To take the required steps to procure such a collection of hymns which may be used in our divine worship.’ As reasons for this advice the Committee adduces that which Classic Grand Rapids East has submitted to the Synod, and which is re-affirmed by Classis Hackensack. In addition to the material brought by these Classes your Committee would call the attention of the Synod to the following matters: 1. There is a need for definite action. Our people are using hymns. Our churches in some localities sing hymns in song services held immediately before the public worship. The demand for hymns has gained great momentum. Your committee feels that Synod should exercised a guiding hand before this demand can no longer be controlled….. …Not to encourage hymns would cause increasing discontent among our people.</p></blockquote>

</figure><figure class="quote" id="q-5948798c27" data-kw="">
<blockquote><p>First, if we tender up to God all that we have. Though we be never so poor and mean, yet if God has the strength of our souls, God accepts it. For we are to know that God does not stand in need of what we have, or of what we do; but that we might show our respect to Him: Therefore if we give all that we have, God accepts it. As a child, if it puts forth all its strength that it has to do a business which the father bids him, whether the business be done or no, the father looks upon it and accepts it as suitable to the child’s strength; and it shows the respect that the child has to his father. And as it is storied of an emperor that when a poor man had nothing to offer him but a little water that he had taken up with his hand, he having nothing else, the emperor accepts of it. So that’s that which God looks for, that the creature should lift Him above all. If therefore when thou comest to worship God, God has more of thy heart then ever any creature in the world had, God accepts of that, and that you must look unto; Can you say so, when you go to worship God: Lord it is true there is much weakness in my spirit, but Thou that knowest all things knowest that thou hast more of my heart than ever any creature in the world had. This is suitable to God: God will account this (in the Covenant of Grace) to be a present suitable to Himself. As in the Law, when they offered to the building of the Temple, every one could not offer gold and silver and precious stones, but some came and offered badgers-skins, and some women did spin and offered coats-hair to the building of the Temple, and so God accepted of that being the most they could do.

2. In the second place, when we do not only offer unto God the most we can, but when we add to this the grief of our souls that we can do no more, when the soul shall strive to the uttermost it can, and when it has done all, says, ‘I am an unprofitable servant; Oh that I could do more!’ This is suitable to God.

3. Thirdly, the people of God though they be weak, yet the weakest servant of God is able to offer up to God somewhat that is suitable to the infinite majesty of God, upon this third ground, because that there is a kind of impression of God’s infiniteness in those services that a gracious heart does tender unto God, and therefore [it is] suitable unto God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship</cite>, ... (London: 1647) | Sermon 4, on Lev. 10:3, “I will be sanctified in them that come nigh Me.”, pp. 63-64</span></figcaption>

2. In the second place, when we do not only offer unto God the most we can, but when we add to this the grief of our souls that we can do no more, when the soul shall strive to the uttermost it can, and when it has done all, says, ‘I am an unprofitable servant; Oh that I could do more!’ This is suitable to God.

3. Thirdly, the people of God though they be weak, yet the weakest servant of God is able to offer up to God somewhat that is suitable to the infinite majesty of God, upon this third ground, because that there is a kind of impression of God’s infiniteness in those services that a gracious heart does tender unto God, and therefore [it is] suitable unto God.”

<main class="wrap"><figure class="quote" id="q-1a2f3820bb" data-kw="">
<blockquote><p>Moreover, the dignity of the sacred writings greatly arouses minds keen for the highest goods. For if the other esteemed arts are much sought after, how desirable is that which no one can praise enough? And if you compare the one with the others, you will be convinced that the others are profane and untrustworthy, but only [the Scripture itself] is most holy and incomparably fruitful.

For only Scripture itself exposes all the errors of all the ages, disproves and refutes them. It alone teaches the highest virtue free from any hypocritical disguise. It alone brings firm hope of blessedness and of life, true and eternal. It alone makes known the hidden treasures of divinity. The other sciences, however, are not to be despised. They are ancillary to Scripture, if they fall upon good minds. Even so, they never arrive at the point where they fly so high [i.e., as Scripture], bring forth such results, or shine with such a rosy brightness.

Now since in the other sciences nothing succeeds well without hard work, and the disciplines are mastered only after much effort by one who has been attracted either by a bit of glory or to profit an estate, what then would we not bear or do, how would we not burn the midnight oil which we had saved so that we might pursue those things which are most holy, most honourable and blessed beyond all measure?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-oecolampadius.html">Johann Oecolampadius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of Genesis</cite>, trans. Mickey Mattox, Reformation Texts with Translation, no. 13 (1531; Milwaukee WI: Marquette University Press, 2013), pp 39-41.</span></figcaption>

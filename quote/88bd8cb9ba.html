<main class="wrap"><figure class="quote" id="q-88bd8cb9ba" data-kw="">
<blockquote><p>The chief objects of this compassion are persons who have none to give them relief, as widows and orphans; but, in general, it comprehends all oppressed with misery, whether the poor, prisoners, the sick, the afflicted, &amp;c.

We have many motives or incentives to this affection of mercy.

1. We have the express and oft repeated command of God: Luke vi. 36, Be ye merciful: Rom. xii. 15, Weep with them that weep; and 1 Pet. iii. 8, Be ye kindly affectioned, &amp;c. Whence Gregory Nazianzen says, Orat. 16, If thou hast nothing, give but a tear; for pity is a great solace to the afflicted.

2. We have, besides, the examples of the prophets, of Christ, and the Apostles, and, lastly, of all good men: Jer. ix. 1; Matt. ix. 36; Luke xix. 41; 2 Cor. xi 29. Hence that saying of the Poet, The good are tear-abounding men.

3. We have, lastly, the conformity of nature, and the possibility of suffering similar things. For nothing is more agreeable to nature, than to be touched with the evils and misfortunes of those who are partakers of the same nature with us. This the Apostle points out, Heb. ii. 17, where he says of Christ, that it behoved him to be made like his brethren that he might be a merciful and faithful High priest. The possibility of suffering similar evils, when seriously considered, forces mercy from any man that is not destitute of feeling: For what has happened to some one may happen to any one; which even Aristotle acknowledges, Rhet.2. cap. 18.

Hence we conclude,

1. The apathy (απαθεια) of the Stoics must be exploded by a Christian; as not agreeing either with our natural condition or our supernatural regeneration. Prosper, De vit. contempl. 30, 31, well remarks, We are not in fault for having affections, but for making a bad use of them.

2. Bowels of mercy are found in every regenerate person: he is therefore moved at the very first view of another’s misery.

3. They who, ere they can be excited to mercy, must have much solicitation, bewailing, and clamour from the afflicted, can lay claim to little or nothing of the spiritual man: they who are not moved by these, have nothing human in them.</p></blockquote>

<blockquote><p>LIII… 2… without holiness none shall see God, Heb. 12:14… It is not then easy to think of a greater hurt than to forbid men such means, without which experience assures us that few comparatively are thus enlightened and renewed to God, and with which more comparatively are renewed. To say that God can bless to us an ignorant heartless, carnal teacher, is no answer while experience certifies us that comparatively He does not do it…

3. For who knows where to bound his obedience to such silencers as aforesaid… if 1,000 or 2,000 or 3,000 parishes must choose the apparent hazard of their souls and refuse such helps as experience certifies us they greatly need, in obedience to man, why must not the rest of the parishes do so also? May I give away the needful helps to my salvation because others have them, as if their salvation might satisfy me instead of my own? … LX… He is not the physician whom we can trust that does not cure men… … LXII. If the people, conscious of their great necessity of pastoral oversight and help, and of Christ’s command to use it, do live in a parish or country where they cannot have it from those that the magistrate allows, either because they cannot perform it for them or because they will not: it is no schism for such to seek and use it from worthy, though prohibited men. We before spake of the schisms of teachers, and now [we will speak] of hearers… In several cases the people may possibly be [unfortunately] deprived of this [pastoral oversight]…

1. When public pastors are at so great a distance from them as that such pastors cannot come to them, nor they and their families go so far without such inconvenience and trouble as will frustrate the end of their endeavors: As in France where the Protestants must go twenty miles or ten to a church, which the weak, children and aged cannot do, nor the rest of the family without such cost and pains, and loss of time as will deprive them of the benefit…

2. Where parishes are so great that the allowed pastors cannot preach to half or a fourth or tenth part of the people, and cannot visit half the sick, and baptize, and administer the Lord’s Supper as is necessary, and have not time if the ignorant and doubting, and troubled persons should come to them for counsel, resolution or comfort…

3. Where the allowed pastors are so slothful or proud that they will not condescend to these offices of personal help to many thousands, especially of the poor.

4. Where they are young raw men, or ignorant of such matters, unable to counsel people as their necessities require, in order to their salvation…

5. Where they are so profane and malignant that if poor people come to them with cases of conscience, or for counsel what they must do to be saved, they will but deride them as scrupulous and precise, and make them believe that to be solicitous about salvation and afraid of sinning, and seriously godly, is but to be hypocrites, melancholy or mad…

6. When they are heretical and not to be trusted in point of faith.

7. And when they are so factious and schismatical as that their preaching and conference tends to render other good Christians odious, and stir up men to hate, persecute or separate from them, and so to destroy true love and concord. In any of these cases when the people or part of them are deprived of those pastoral helps which their necessity requires, and God commands, they may seek it where they can best have it. LXIII. In all these cases it is an unsatisfactory answer to tell them that religion is kept up in the land and that other persons or parishes have what they want, or that order and obedience must be preferred to their supply, or that God can save them without a pastor, etc. For so God can save the heathen world without the Gospel preached if He please: And so you might persuade the poor to famish rather than [go] against law to beg, because if thousands of them die of famine, yet other people are supplied and have plenty: Or you might tell men that they must use no physician, though they die for it, if they have no tolerable one allowed them by the magistrate, because others have physicians… What if the parish priest could baptize but one of many (or not all)? Must the rest be content to be unbaptized? If not, why must they be content without all public preaching and worshipping of God, and the Lord’s Supper, and personal helps of pastors which they need? LXIV. Yet here we must declare:

1. That in such necessity people must, caeteris paribus [‘other things being equal’], first seek their supply in that way that is most for peace and most for public good, and least scandalous or dividing, and that is most agreable to the ruler’s will and honour.

2. That for some short season in which his soul is not apparently hazarded, as also in the tolerable loss of some measures of pastoral help, a man must submit his own personal advantage to public interest and may hope that God will make it up. As also when it tends to his probable greater advantage afterward by putting by some present storm: But not statedly, to be without Christ’s instituted ordinances and helps. For example, parish order is desireable and is the ruler’s will: If therefore supply can be had in a neighbor parish for them that want [lack] it in their own, and by an allowed minister rather than a disallowed, it should be chosen, unless the disparity be so great as to weigh down the contrary inconveniences. And if for a time any be constrained to another way, they should do it but as an extraordinary necessity for the present time till they can be supplied in the allowed parochial way; and avoid as much as possibly they can all ways, though lawful, that encourage true schisms.

3. And we must profess that if any preachers or people shall out of self conceitedness pretend necessity when there is none, their pretence is no justification of their disorder or disobedience. Magistrates may regulate us in the circumstances of those duties which the Law of Nature or the Gospel [in an established Christian nation] do command: But if on such pretence of regulating circumstances, they will violate or contradict either the Law of Nature or the Gospel, and destroy the duty itself or its end, we are not bound in such cases to obey them, but must pariently suffer. … LXVI…

4. Cyprian’s conclusion before mentioned is known, inviting the people to forsake a bad pastor, Plebs maximam habet potestatem [‘The people have the greatest power’], etc. And he convinces the people that if they forsake not such they are guilty. … LXVII… God will have mercy rather than sacrifice [Hos. 6:6], and prefers men’s salvation to ceremony or Church laws.</p></blockquote>

ble+as+will+frustrate+the+end+of+their+endeavors%3A+As+in+France+where+the+Protestants+must+go+twenty+miles+or+ten+to+a+church%2C+which+the+weak%2C+children+and+aged+cannot+do%2C+nor+the+rest+of+the+family+without+such+cost+and+pains%2C+and+loss+of+time+as+will+deprive+them+of+the+benefit%E2%80%A6%0A%0A2.+Where+parishes+are+so+great+that+the+allowed+pastors+cannot+preach+to+half+or+a+fourth+or+tenth+part+of+the+people%2C+and+cannot+visit+half+the+sick%2C+and+baptize%2C+and+administer+the+Lord%E2%80%99s+Supper+as+is+necessary%2C+and+have+not+time+if+the+ignorant+and+doubting%2C+and+troubled+persons+should+come+to+them+for+counsel%2C+resolution+or+comfort%E2%80%A6%0A%0A3.+Where+the+allowed+pastors+are+so+slothful+or+proud+that+they+will+not+condescend+to+these+offices+of+personal+help+to+many+thousands%2C+especially+of+the+poor.%0A%0A4.+Where+they+are+young+raw+men%2C+or+ignorant+of+such+matters%2C+unable+to+counsel+people+as+their+necessities+require%2C+in+order+to+their+salvation%E2%80%A6%0A%0A5.+Where+they+are+so+profane+and+malignant+that+if+poor+people+come+to+them+with+cases+of+conscience%2C+or+for+counsel+what+they+must+do+to+be+saved%2C+they+will+but+deride+them+as+scrupulous+and+precise%2C+and+make+them+believe+that+to+be+solicitous+about+salvation+and+afraid+of+sinning%2C+and+seriously+godly%2C+is+but+to+be+hypocrites%2C+melancholy+or+mad%E2%80%A6%0A%0A6.+When+they+are+heretical+and+not+to+be+trusted+in+point+of+faith.%0A%0A7.+And+when+they+are+so+factious+and+schismatical+as+that+their+preaching+and+conference+tends+to+render+other+good+Christians+odious%2C+and+stir+up+men+to+hate%2C+persecute+or+separate+from+them%2C+and+so+to+destroy+true+love+and+concord.+In+any+of+these+cases+when+the+people+or+part+of+them+are+deprived+of+those+pastoral+helps+which+their+necessity+requires%2C+and+God+commands%2C+they+may+seek+it+where+they+can+best+have+it.+LXIII.+In+all+these+cases+it+is+an+unsatisfactory+answer+to+tell+them+that+religion+is+kept+up+in+the+land+and+that+other+persons+or+parishes+have+what+they+want%2C+or+that+order+and+obedience+must+be+preferred+to+their+supply%2C+or+that+God+can+save+them+without+a+pastor%2C+etc.+For+so+God+can+save+the+heathen+world+without+the+Gospel+preached+if+He+please%3A+And+so+you+might+persuade+the+poor+to+famish+rather+than+%5Bgo%5D+against+law+to+beg%2C+because+if+thousands+of+them+die+of+famine%2C+yet+other+people+are+supplied+and+have+plenty%3A+Or+you+might+tell+men+that+they+must+use+no+physician%2C+though+they+die+for+it%2C+if+they+have+no+tolerable+one+allowed+them+by+the+magistrate%2C+because+others+have+physicians%E2%80%A6+What+if+the+parish+priest+could+baptize+but+one+of+many+%28or+not+all%29%3F+Must+the+rest+be+content+to+be+unbaptized%3F+If+not%2C+why+must+they+be+content+without+all+public+preaching+and+worshipping+of+God%2C+and+the+Lord%E2%80%99s+Supper%2C+and+personal+helps+of+pastors+which+they+need%3F+LXIV.+Yet+here+we+must+declare%3A%0A%0A1.+That+in+such+necessity+people+must%2C+caeteris+paribus+%5B%E2%80%98other+things+being+equal%E2%80%99%5D%2C+first+seek+their+supply+in+that+way+that+is+most+for+peace+and+most+for+public+good%2C+and+least+scandalous+or+dividing%2C+and+that+is+most+agreable+to+the+ruler%E2%80%99s+will+and+honour.%0A%0A2.+That+for+some+short+season+in+which+his+soul+is+not+apparently+hazarded%2C+as+also+in+the+tolerable+loss+of+some+measures+of+pastoral+help%2C+a+man+must+submit+his+own+personal+advantage+to+public+interest+and+may+hope+that+God+will+make+it+up.+As+also+when+it+tends+to+his+probable+greater+advantage+afterward+by+putting+by+some+present+storm%3A+But+not+statedly%2C+to+be+without+Christ%E2%80%99s+instituted+ordinances+and+helps.+For+example%2C+parish+order+is+desireable+and+is+the+ruler%E2%80%99s+will%3A+If+therefore+supply+can+be+had+in+a+neighbor+parish+for+them+that+want+%5Black%5D+it+in+their+own%2C+and+by+an+allowed+minister+rather+than+a+disallowed%2C+it+should+be+chosen%2C+unless+the+disparity+be+so+great+as+to+weigh+down+the+contrary+inconveniences.+And+if+for+a+time+any+be+constrained+to+another+way%2C+they+should+do+it+but+as+an+extraordinary+necessity+for+the+present+time+till+they+can+be+supplied+in+the+allowed+parochial+way%3B+and+avoid+as+much+as+possibly+they+can+all+ways%2C+though+lawful%2C+that+encourage+true+schisms.%0A%0A3.+And+we+must+profess+that+if+any+preachers+or+people+shall+out+of+self+conceitedness+pretend+necessity+when+there+is+none%2C+their+pretence+is+no+justification+of+their+disorder+or+disobedience.+Magistrates+may+regulate+us+in+the+circumstances+of+those+duties+which+the+Law+of+Nature+or+the+Gospel+%5Bin+an+established+Christian+nation%5D+do+command%3A+But+if+on+such+pretence+of+regulating+circumstances%2C+they+will+violate+or+contradict+either+the+Law+of+Nature+or+the+Gospel%2C+and+destroy+the+duty+itself+or+its+end%2C+we+are+not+bound+in+such+cases+to+obey+them%2C+but+must+pariently+suffer.+%E2%80%A6+LXVI%E2%80%A6%0A%0A4.+Cyprian%E2%80%99s+conclusion+before+mentioned+is+known%2C+inviting+the+people+to+forsake+a+bad+pastor%2C+Plebs+maximam+habet+potestatem+%5B%E2%80%98The+people+have+the+greatest+power%E2%80%99%5D%2C+etc.+And+he+convinces+the+people+that+if+they+forsake+not+such+they+are+guilty.+%E2%80%A6+LXVII%E2%80%A6+God+will+have+mercy+rather+than+sacrifice+%5BHos.+6%3A6%5D%2C+and+prefers+men%E2%80%99s+salvation+to+ceremony+or+Church+laws.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Nonconformists%E2%80%99+Plea+for+Peace%2C+%E2%80%A6+%28London%2C+1679%29%2C+sect.+6%2C+pp.+88-112&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F441699c653.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/441699c653.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separatism/#:~:text=without%20holiness%20none%20shall%20see%20God,salvation%20to%20ceremony%20or%20Church%20laws&amp;text=without%20holiness%20none%20shall%20see%20God%2C%20Heb.%2012%3A14&amp;text=prefers%20men%E2%80%99s%20salvation%20to%20ceremony%20or%20Church%20laws" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>WE cannot justly pretend to the Glory of Angels, unless we imitate their Purity. To follow the pleasures of the Flesh, hunt after its Allurements, and cherish its filthy Delusions, is to walk in the Path of Damnation.

CAN we be convinced of these Truths, without being in love with Chastity; without avoiding all dangerous occasions, as enticing Company and guilty Sloth, and without arming our selves against the Flesh, by Fasting and Mortification?

LET us make a Covenant with our Eyes, that they never open a Door to any unclean Thoughts; and if at any time they break this Covenant, let our Heart, being animated by the Cross of JESUS, stifle all those Thoughts in their Birth, which might lead us to Sin.</p></blockquote>

<blockquote><p>Since, then, you say that the additional name “Christ” or “Anointed” implies that He came with the command of the Father to establish a royal priesthood, explain first what the kingdom of Christ is. A. A kingdom is a kind of rule over a people in which one person serves as the head and is exceptionally gifted with wisdom, counsel, and strength, so that his subjects benefit from his wisdom and other gifts and live happily and peacefully under such a head. This helps us to understand what the Kingdom of Christ is: it is a kind of rule over the people of God in which there is one head, namely, Christ the Lord, who is gifted far beyond all angels and people with wisdom, counsel, might, and all other gifts. This head, Christ, rules His subjects even in this life in such a way that He produces eternal salvation in the hearts of all the elect through the preaching of His holy gospel and the power of His Spirit. He does this by incorporating them into Himself by faith and the testimony of holy baptism, by graciously not imputing their sins to them, by daily purifying them from sin, by living in them and ruling their hearts with His Holy Spirit, and by using as means to that end the preaching of the holy gospel, the administration of the holy sacraments, and Christian discipline. This is in order that in this life they might live happily in the Lord, have peace with God, and at last in eternity live and reign with their King. This is the Kingdom of Christ that begins in this life and will increase in the heart of every believer (John 15; Matt. 25; Mark 1). 49 Q. What benefit and comfort do believers receive from this doctrine of the kingdom of Christ, of which the additional name “Christ” is a reminder? A. Those who believe and trust in Christ and are baptized into His name know that in this life they are in the Kingdom of Christ and not in the Kingdom or dominion of the Devil. They have been redeemed from the power of the Devil. They have been redeemed from the power of the Devil and inserted into the Kingdom of Christ [Col. 1:13], and they are united with Christ their King in such a way that they are members of His body. Many people fret when they are not sure who their lord is, Christ or the Evil One, or whether they might now be under one lord but soon under another. On the other hand, there is great joy and benefit when a person is certain that whoever believes in Christ from the heart (which is the internal anointing of the Holy Spirit) and bears the physical sign of the covenant, holy baptism, is under Christ the King and is translated out of the kingdom of darkness into the Kingdom of Christ. As Paul says in Colossians 1[:13, 14], “He has delivered us from the power of darkness and has translated us into the kingdom of the Son of His love, in whom we have redemption through His blood, namely, the forgiveness of sins.” Indeed, in such a heart the Kingdom of God has already begun; such a heart has the Kingdom within, as Christ says, “The Kingdom of God is within you” [Luke 17:21]. The first benefit that each and every citizen of this kingdom receives is righteousness, peace, and joy in the Holy Spirit (Rom. 14[:17]). These gifts are received, even in this life, by all who place their trust in this King, Christ, and are baptized into Him. For the King promised them in John 8[:36], “You shall be free indeed, if the Son makes you free.” Also John 14[:27]: “Peace I leave with you. My peace I give to you; not as the world gives do I give to you.” John 14[:16, 17]: “I will pray the Father, and he will give you another Comforter, that He may abide with you forever, the Spirit of truth.” John 16[:33]: “In me you should have peace.” To be sure, Christ rules not for His own benefit but for ours. For from eternity He shared a common honor and glory with the Father and the Holy Spirit. Thus we should take comfort from what is stated in Revelation 5[:10]: “You have made us kings and priests to our God.</p></blockquote>

<blockquote><p>What are we to understand by an ABLE AND FAITHFUL MINISTRY? It is a ministry, at once qualified and disposed to perform, with enlightened and unwearied assiduity, all the duties, whether of instruction, of defence, or of discipline, which belong to ambassadors of Christ, to pastors and rulers in his church. This general character implies Piety, Talents, Learning, and Diligence, 1. The first requisite to form a faithful and able minister, is Piety. By this I mean, that he be a regenerated man; that he have a living faith in that Saviour whom he preaches to others; that the love of Christ habitually constrain him; that he have himself walked in those paths of humility, self-denial, and holy communion with God, through our Lord Jesus Christ, in which it is the business of his life to endeavour to lead his fellow-men.

I shall not now speak of the necessity of piety, to a minister’s personal salvation; nor of its inestimable importance to his personal comfort. I shall not dwell on the irksomeness, nay, the intolerable drudgery, of labouring in a vocation in which the heart does not go along; nor on the painful misgivings which must ever attend preaching an unknown Saviour, and recommending untasted hopes and joys. Neither shall I attempt to describe, tremendous and overwhelming as it is, the aggravated doom of that man, who, from the heights of this sacred office, shall sink into the abyss of the damned; who, after having preached to others, shall himself become a cast-away. But my object is, to show the importance, and the necessity, of this best of all attainments, in order to qualify any man for discharging the duties of the ministerial office. It is to show, that, without piety, he cannot be an able minister. He cannot be a workman, that needeth not to be ashamed, rightly dividing the word of truth, and giving to each his portion in due season.

How can a man who knows only the theory of religion, undertake to be a practical guide in spiritual things? How can he adapt his instructions to all the varieties of Christian experience? How can he direct the awakened, the inquiring, the tempted, and the doubting? How can he feed the sheep and the lambs of Christ? How can he sympathize with mourners in Zion? How can he comfort others with those consolations wherewith he himself has never been comforted of God? He cannot possibly perform, as he ought, any of these duties, and yet they are the most precious and interesting parts of the ministerial work. However gigantic his intellectual powers; however deep, and various, and accurate his learning, he is not able, in relation to any of these points, to teach others, seeing he is not taught himself. If he make the attempt, it will be the blind leading the blind; and of this, unerring wisdom has told us the consequence.

It were rash, indeed, and unwarranted, to say, that a man who knows nothing of the power of godliness, may not be employed, by a sovereign God, as the means of saving benefit to others. God undoubtedly may, and probably sometimes does, “by way of miracle, raise a man to life by the bones of a dead prophet.” He may, and, there is reason to believe sometimes does, “honour his own word so far as to make it effectual to salvation, even when it falls from unhallowed lips.” The ministry even of Judas Iscariot was, probably, not without its benefit to the church of Christ. But such a result is not, in ordinary cases, and certainly not in any considerable degree, to be expected. When unsanctified ministers are introduced into the church, we may generally expect them to prove, not only an offence to God, but also a curse to his people. Piety, orthodoxy, practical holiness, and all the spiritual glories of the household of faith, will commonly be found to decline in proportion to the number and influence of these enemies in disguise.

And here I cannot help bearing testimony against what appears to me a dangerous mistake; which, though it may not be common, yet sometimes occurs among parents and guardians of the more serious class. I mean the mistake of destining young persons to the Gospel Ministry, from a very early period of life, before they can be supposed, from any enlightened view of the subject, to concur in the choice themselves; and before they give any satisfactory evidence of vital piety. Brethren, I venerate the parent who desires, and daily prays, that it may please God to prepare and dispose his child, to serve him in the ministry of reconciliation.

Nay, I think that parent worthy of the thanks of every friend to religion, who solemnly devotes his child, even from the earliest period of life, to the service of the church, and avowedly conducts every part of his education with a view to this great object; provided the original consecration, and every subsequent arrangement, be made on the condition, carefully and frequently expressed, as well as implied, that God shall be pleased to sanction and accept the offering, by imparting his grace, and giving a heart to love, and desire the sacred work. But there is a wide difference between this, and resolving that a particular son shall be a minister, in the same manner, and on the same principles, as another is devoted to the medical profession, or to the bar, as a respectable employment in life; without recognizing vital piety, and the deliberate choice of the ministry, from religious motives, as indispensable qualifications. This kind of destination to the sacred office, is as dangerous as it is unwarranted.

Let the Christian parent, however solemnly he may have devoted his child to the work of the ministry, and however fondly he may have anticipated his entrance on that blessed work; if he find, at the proper age for deciding the question, no comfortable evidence of a heart regenerated, and governed by the spirit of grace; let him deliberately advise;—though his heart be wrung with anguish by the sacrifice;—let him deliberately advise the choice of another profession. When young men begin to enter the gospel ministry, because they were early destined to the office; because it is a respectable profession; or because they wish to gratify parents and friends; rather than because they love the office, and its work, and have reason to hope that God has been pleased to call them by his grace, and repeal his Son in them; we may consider the ministry as in a fair way to be made, in fact, a secular employment, and the church a prostituted theatre for the schemes and ambition of worldly men.</p></blockquote>

or+to+the+bar%2C+as+a+respectable+employment+in+life%3B+without+recognizing+vital+piety%2C+and+the+deliberate+choice+of+the+ministry%2C+from+religious+motives%2C+as+indispensable+qualifications.+This+kind+of+destination+to+the+sacred+office%2C+is+as+dangerous+as+it+is+unwarranted.%0A%0ALet+the+Christian+parent%2C+however+solemnly+he+may+have+devoted+his+child+to+the+work+of+the+ministry%2C+and+however+fondly+he+may+have+anticipated+his+entrance+on+that+blessed+work%3B+if+he+find%2C+at+the+proper+age+for+deciding+the+question%2C+no+comfortable+evidence+of+a+heart+regenerated%2C+and+governed+by+the+spirit+of+grace%3B+let+him+deliberately+advise%3B%E2%80%94though+his+heart+be+wrung+with+anguish+by+the+sacrifice%3B%E2%80%94let+him+deliberately+advise+the+choice+of+another+profession.+When+young+men+begin+to+enter+the+gospel+ministry%2C+because+they+were+early+destined+to+the+office%3B+because+it+is+a+respectable+profession%3B+or+because+they+wish+to+gratify+parents+and+friends%3B+rather+than+because+they+love+the+office%2C+and+its+work%2C+and+have+reason+to+hope+that+God+has+been+pleased+to+call+them+by+his+grace%2C+and+repeal+his+Son+in+them%3B+we+may+consider+the+ministry+as+in+a+fair+way+to+be+made%2C+in+fact%2C+a+secular+employment%2C+and+the+church+a+prostituted+theatre+for+the+schemes+and+ambition+of+worldly+men.%E2%80%9D%0A%0A%E2%80%94+Samuel+Miller%2C+The+Duty+of+the+Church+to+Take+Measures+for+Providing+An+Able+and+Faithful+Ministry%3A+A+Sermon%2C+Delivered+at+Princeton%2C+August+12%2C+1812%2C+at+the+Inauguration+of+the+Rev.+Archibald+Alexander%2C+D.D.+As+Professor+of+Didactic+and+Polemic+Theology%2C+in+the+Theological+Seminary+of+the+Presbyterian+Church%2C+%28New+York%3A+Whiting+and+Watson%2C+1812%29%2C+pp+12-17.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7209cb08e2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7209cb08e2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/11/01/samuel-miller-on-the-need-for-a-converted-ministry/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>By this reckoning, you will tell me, death is a thing to be wished for: and to pass from so much evil, to so much good, a man should (it seemeth) cast away his life. Surely, I fear not, that for any good we expect, we will hasten one step the faster: though the spirit aspire, [t]he body (it draws with it) withdraws it ever sufficiently towards the earth. Yet is it not that I conclude. We must seek to mortify our flesh in us, and to cast the World out of us: but to cast our selves out of the world is in no sort permitted us.

The Christian ought willingly to depart out of this life, but not cowardly to run away. The Christian is ordained by GOD to fight therein: and cannot leave his place without incurring reproach and infamy. But if it please the grand Captain to recall him, let him take the retreat in good part, and with good will obey it. For he is not borne for himself, but for God: of whom he holds his life at farm, as his tenant at will, to yield him the profits. It is in the Land-lord to take it from him, not in him to surrender it, when a conceit takes him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philippe de Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A discourse of life and death</cite>, trans. Countess of Pembroke (1590; London: Mathew Lownes, 1608), unpaginated.</span></figcaption>

<blockquote><p>§19. Question 12. If another man deceive me into a promise or covenant against my good, am I bound to perform it when I have discovered the deceit? Answer: Yes, 1. in case that the law of the land or other reasons for the public good require it; 2. Or in case that you were faulty by negligence, heedlessness, or otherwise guilty of your own deceit, in any considerable and avoidable degree. Otherwise, in that measure that he deceived you, and in those respects you are not obliged. §20. Question 13. If the contracting parties do neither of them understand the other, is it a covenant: or if it be, whose sense must carry it? Answer: If they understand not each other in the essentials of the contract, it is no contract, in point of conscience: except where the laws, for the public safety, do annex the obligation to the bare external act. But if they understand not one another in some circumstances, and be equally culpable or innocent, they must come to a new agreement in those particulars: But if one party only be guilty of the misunderstanding, he must bear the loss if the other insist on it. … §22. Question 15. If I say I will give such or such a one this or that, am I bound thereby to do it? Answer: It is one thing to express your present mind and resolution without giving away the liberty of changing it: And it’s another thing to intend the obliging of yourself to do the thing mentioned, and that obligation is either intended to man or to God only; and that is either in point of rendition and use, or in point of veracity, or the performance of that moral duty of speaking truth. If you meant no more in saying, ‘I will do it,’ or ‘I will give it,’ but that this is your present will and purpose and resolution, yea, though it add the confident persuasion that your will shall not change, yet this no further obliges you than you are obliged to continue in that will: And a man’s confident resolutions may lawfully be changed upon sufficient cause. But if you intended to alienate the title to another, or to give him present right, or to oblige yourself for the future to him by that promise; or to oblige yourself to God to do it by way of peremptory assertion, as one that will be guilty of a lie if you perform it not; or if you dedicate the thing to God by those words as a vow, then you are obliged to do accordingly (supposing nothing else to prohibit it).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London, 1673) | pt. 4, ch. 19, title 2, p. 117</span></figcaption>

</figure><figure class="quote" id="q-5481a13ede" data-kw="fifth commandment parents">
<blockquote><p>Among others in relation to the fifth precept, this question concerning the honoring of parents is agitated between us and the papists. In many ways, the latter weaken this precept, maintaining that children, against the consent of their parents, may not only contract marriage, but even adopt a monastic life. May children withdraw themselves from the power of their parents and marry without their consent? We deny against the papists.</p></blockquote>

</figure><figure class="quote" id="q-2bb428b658" data-kw="">
<blockquote><p>Now because lots may say to cards what Naomi said to Boaz, ‘They are near unto us, and of our affinity,’ something also of the use of them. It were no great harm if there were no other cards used than those of clothiers about wool and of mariners in the ship. But as for cards to play with, let us not wholly condemn them, lest lacing our consciences too straight we make them to grow awry on the wrong side. Such recreations are lawful if we use them as Jonathan tasted the honey, putting forth the end of his rod he touched a little of it, and his eyes were cleared. But let us take heed of a surfeit into which those do fall who either play out of covetousness, or for more than their estates can bear, or constantly and continually; all their meat is sauce, all the days in their almanac play-days, though few holy-days. The Creation lasted but a week, but these men’s recreations all the days of their lives; such using of lawful exercises is altogether unlawful.</p></blockquote>

oks Online</a></div>

<blockquote><p>80. But since, as Augustine says, it is the same to say for God is my witness and I swear by God, the Apostle seems to be acting against the Lord’s command: I say to you, do not swear at all (Matt 5:34); above all, my brethren, do not swear (Jas 5:12).

However, as Augustine also says, the meaning of Sacred Scripture is gathered from the actions of the saints. For it is the same Spirit who inspired the Sacred Scriptures: men moved by the Holy Spirit spoke from God (2 Pet 1:21) and who moves holy men to act: all who are led by the Spirit are sons of God (Rom 8:14).

Consequently, if Paul is found to swear, it shows that the Lord’s word and that of the apostle James are not to be understood as indicating that an oath is absolutely unlawful, but that men should strive as far as possible not to use oaths as though they were something good and desirable of their very nature. And this on account of the danger involved in frequent swearing, namely, the possibility of perjury due to a slip of the tongue. …</p></blockquote>

However, as Augustine also says, the meaning of Sacred Scripture is gathered from the actions of the saints. For it is the same Spirit who inspired the Sacred Scriptures: men moved by the Holy Spirit spoke from God (2 Pet 1:21) and who moves holy men to act: all who are led by the Spirit are sons of God (Rom 8:14).

Consequently, if Paul is found to swear, it shows that the Lord’s word and that of the apostle James are not to be understood as indicating that an oath is absolutely unlawful, but that men should strive as far as possible not to use oaths as though they were something good and desirable of their very nature. And this on account of the danger involved in frequent swearing, namely, the possibility of perjury due to a slip of the tongue. …”

<main class="wrap"><figure class="quote" id="q-e8118efa58" data-kw="">
<blockquote><p>Divine decrees are of two kinds: one efficacious and absolute, the other inefficacious and conditional. The latter is concerned with the thing to be realized taken in itself, abstracting from all actual circumstance. Thus, for example, God wills the salvation of all men. But, in fact, God permits final impenitence in a sinner (e.g. Judas) as manifestation of infinite justice. Efficacious decrees on the contrary are concerned with the thing to be realized taken with all its concrete circumstances of place and time. Hence these decrees are immutable and infallible. (Ia, q. 19, a. 6 [Whether the Will of God is always fulfilled?], ad 1)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought (Herder Book Co., 1950) | pt. 5, Redemptive Incarnation, ch. 32, “Introduction”</cite>, pp. 204-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b14151e551" data-kw="">
<blockquote><p>Question: Seeing God purposed to destroy them, and did it not, is not his will alterable and inefficacious? Answer: The counsels, purposes, decrees of God are unalterable and do take place, Ps. 33:11; Isa. 14:27; 43:13; 46:10; Mal. 3:6; Heb. 6:17. For that said and done here, it’s more humano [by a human custom]: God saw cause-sufficient to move Him to their destruction, but seeing what evil was like to come about, He would not destroy them; had the Lord decreed it before the world, it must have taken place, no change or alteration could have been.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-greenhill.html">William Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition continued upon the 20th-29th chapters of the prophet Ezekiel... (London: Chapman, 1658), on ch. 20, v. 8</cite>, p. 43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-3a779fe462" data-kw="">
<blockquote><p>Do you contemplate, O man, the most immaculate Lord, hanging on the cross: and do you dare, O impudent and unhappy man, to spend your whole time of your life on earth in delights and laughter? Do you not know, O miserable and impudent one, that He who was crucified for you as Lord will demand an account from you for all these negligences and contempts? Now indeed, while you hear this, you neglect it, you laugh in delights; and free from all care, you see yourself as free: but that terrible day will surely come, the day of vengeance, and you will mourn without end and cry out because of your pains in the eternal fire: and there will be absolutely no one there to answer and to have mercy on your soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/diego-ruiz.html">Diego Ruiz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries &amp; Disputations on the First Part of St. Thomas, on the Will of God &amp; his Proper Acts (Lugduni: Prost, 1630), Disp. 20, sect. 6 tr. AI by The Faith Received | 8. I prove the minor premise of the primary reason, and I explain more and confirm the whole preceding discourse. For at least the most excellent and most universal [will] of human salvation is established to be willed by God formally, as means in order to salvation not only of the predestined, but also of all other men, for: | 13. Ephraem Syrus, in his entire sermon on the passion of the Savior, teaches that it was offered for all sinners. Particularly noteworthy are those words towards the end:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-40416f46d3" data-kw="">
<blockquote><p>It happens, however, sometimes that God moves a man to some good, yet does not perfect him, so that such preparation precedes grace. But sometimes He moves him immediately and perfectly to good, and the man receives grace suddenly: according to that of John 6: ‘Everyone who has heard from the Father and has learned, comes to me.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-baptiste-gonet.html">Jean Baptiste Gonet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shield of Thomistic Theology, 5 vols. 10th ed. (1667; Antwerp: Pitteri, 1744), vol. 1, tract 4, On the Will of God &amp; his Providence, disp. 4, Antecedent &amp; Consequent Will of God tr. AI by The Faith Received | These are the principal arguments of this Recent author, by which he thinks he clearly demonstrates that there is no sufficient aid in the state of fallen nature, distinct from efficacious, prepared by the antecedent will of God. These, however, can be easily diluted from the principles of Thomistic doctrine well understood. Whence To the first I answer first, that St. Thomas clearly admitted and acknowledged that grace which the Thomists call sufficient, although he did not call it by that name. For 1-2, q. 11, art. 2, ad 1, he says thus:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>Question 13: Whether God wills Himself as the end, and creatures as means? Distinguished. Answer: As the ultimate end He always wills Himself, Prov. 16:4. Creatures, and their actions, He sometimes wills as means in respect of others, sometimes as ends; but those ends are always subordinated, in respect of God, who is the universal and ultimate end of all things, Rom. 11, last verse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5 (Utrecht, 1669) tr. AI by Roman Prestarri Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

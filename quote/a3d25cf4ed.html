</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a6a670da33" data-kw="Affliction Comfort Love">
<blockquote><p>What a comfort it is to believe this doctrine. If we are poor, or sick, or bereaved, or defamed, how delightful it is to know that it is the Lord, and not man; the Lord and not Satan; a friend and not an enemy; a most tender father and not a capricious master—who thus ordains. David was wise when he said, &quot;Let me fall into the hand of the Lord, and not into the hand of man.&quot; Luther said, &quot;Smite, Lord, for you love me.&quot; Every child of God may say as much.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-s-plumer.html">William S. Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jehovah-Jireh: A Treatise on Providence</cite>, ch. “Practical Remarks on the Nature of God’s Providence”</span></figcaption>

</figure><figure class="quote" id="q-940c6385f9" data-kw="Affliction Wisdom">
<blockquote><p>It is the discipline of wisdom. He who administers it is the &quot;God only wise.&quot; What deep wisdom then must there be in all His dealings! He knows exactly what we need and how to supply it. He knows what evils are to be found in us, and how these may be best removed. His training is no random work. It is carried on with exquisite skill. The time and the way and the instrument are all according to the perfect wisdom of God. The fittest time is chosen, just the very moment when discipline is called for, and when it would be most profitable. The surest, most direct, and at the same time gentlest method is devised. The instrument which will be surest yet safest, most effectual yet least painful, is brought into operation. For all is wisdom in the discipline of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Night of Weeping</cite>, ch. IV, “The Family Discipline,”</span></figcaption>

</figure><figure class="quote" id="q-e2cf359f99" data-kw="Affliction Submission">
<blockquote><p>How kind is God in wisely and mercifully deciding so many things for us! The man who fears God and loves his little daughter, would esteem it a greater affliction to be called on to say when his child should be sick—than he now finds it to nurse her through weeks of disease, close her eyes in death, and then carry her to the grave. God very mercifully bears the heaviest part of all our trials, by marking out our course for us. God is governor. We are servants. To us belong obedience, submission, acquiescence. It is not ours to guide, to decide what is best, to rule the world, to shape the course of events.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-s-plumer.html">William S. Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jehovah-Jireh: A Treatise on Providence</cite>, ch. “The Mysteries of God’s Providence”</span></figcaption>

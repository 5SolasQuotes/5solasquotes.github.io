<main class="wrap"><figure class="quote" id="q-689831c468" data-kw="">
<blockquote><p>Where was your Religion before Luther? To this the answer will be very short and easy… I say then, that our religion, as to the rules and principles of it, was before Luther, where it has been ever since, in the Scriptures: And as to the profession of it, it has been owned and maintained by the faithful in all ages, namely, such as have been kept by the power of God through faith unto salvation, against whom the gates of hell and Rome have not been able to prevail. The Protestant Religion we contend for is nothing else but Christianity uncorrupted, which was in its greatest purity before ever the Pope was heard of in the World. And Popery, that we oppose, is Christianity adulterated, or rather paganism Christianized, which was in the cradle when the mystery of iniquity began to work, and grew up to be the Man of Sin, when Popes had gulled the world into so much slavery as to endure their trampling upon princes. And this truth, as it appears in great measure from the Fathers and historians of the Church, and from all antiquity, that has had the good fortune to escape the Expurgatory Index [of Romanism]; so it is more especially, and most evidently manifest from the Scriptures…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short &amp; Plain Answer to Two Questions I. Where was your Religion Before Luther? II. How Know you the Scriuptures to be the Word of God? By a Protestant</cite>, (London, 1682), pp. 1-2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-939396c332" data-kw="Infallibility of the church">
<blockquote><p>When they deny that the Church can err, their end and meaning are to this effect: Since the Church is governed by the Spirit of God, she can walk safely without the word; in whatever direction she moves, she cannot think or speak anything but the truth, and hence, if she determines anything without or beside the word of God, it must be regarded in no other light than if it were a divine oracle. If we grant the first point--viz. that the Church cannot err in things necessary to salvation--our meaning is, that she cannot err, because she has altogether discarded her own wisdom, and submits to the teaching of the Holy Spirit through the word of God. Here then is the difference. They place the authority of the Church without the word of God; we annex it to the word, and allow it not to be separated from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.13</span></figcaption>

</figure><figure class="quote" id="q-3e7b99112f" data-kw="">
<blockquote><p>Scholars have often depicted English Protestant Marriage Doctrine as nearly monolithic in its praise of marriage over celibacy as well as the liberty of all Christians to marry, but the literature actually reveals considerable tension. There was a heightened emphasis on celibacy as an inherently superior state among the spiritual sects and even among conforming churchmen who advocated the vita angelica [angelic life]. However, even though most English Protestants quickly rejected such claims, they still had to square their vigorous support of marriage with the expediency that celibacy afforded for serving God and promoting one’s spiritual welfare. The pragmatic advantages of celibacy could not simply be dismissed since they had clear scriptural support. Furthermore, despite rejecting the bifurcation of Scripture into universal commands and evangelical counsels, English Protestants struggled to develop a new moral system that answered whether Christians were obligated to forsake their liberty to marry if celibacy was more expedient. Both Jesus and Paul had counseled Christians to remain single if they were able. English Protestants navigated around Scripture’s commendation of celibacy by limiting its application to those with the gift of chastity and periods of persecution. They also asserted that Scripture merely counseled or advised celibacy, rather than commanding it. Yet both solutions depended on tenuous assumptions. The first assumption was hermeneutical and depended on the conviction that Scripture’s teaching on marriage in Genesis 1-2 was normative while Paul’s was an exception for certain occasions. The second assumption was that Christians were not obligated to choose the state of life in which they could best devote themselves to God. If either of the two assumptions were challenged, as they already had been with Whately, and especially Ames, then the decision to marry or remain single would be approached much differently; it would no longer concern the Christian’s liberty to choose what was “good” but the Christian’s obligation to choose what was “best.” As it so happened, Baxter explicitly claimed to have been influenced by both Whately and Ames.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/seth-d-osborne.html">Seth D. Osborne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed &amp; Celibate Pastor Richard Baxter’s Argument for Clerical Celibacy PhD diss</cite>, (Southern Baptist Theological Seminary, 2018) 445 pp., p. 108</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

</figure><figure class="quote" id="q-48d95ae109" data-kw="Marks of the church Rome">
<blockquote><p>The Lord recognises nothing as his own, save when his word is heard and religiously observed. … If that temple which seemed consecrated for the perpetual habitation of God, could be abandoned by God and become profane, the Romanists have no ground to pretend that God is so bound to persons or places, and fixed to external observances, that he must remain with those who have only the name and semblance of a Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.3</span></figcaption>

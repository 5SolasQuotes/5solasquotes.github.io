<main class="wrap"><figure class="quote" id="q-d9efed039d" data-kw="debt enmity crime satisfaction">
<blockquote><p>First, sin, which renders us guilty and hated of God and binds us over as debtors to punishment, may be viewed under a threefold relation either as a debt, which we are bound to pay to divine justice, in which sense the law is called “a handwriting”; or as enmity, inasmuch as it makes us enemies to God and God to us; or as a crime, on account of which we are exposed to condemnation and death. Corresponding to these, satisfaction ought to be a payment of debt, a reconciliation with God, and a propitiatory covering of the crime.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.10.6</span></figcaption>

</figure><figure class="quote" id="q-1d54e976df" data-kw="against Socinian denial">
<blockquote><p>Concerning the necessity of a satisfaction, there are three principal opinions of theologians. The first of those simply denying it (as the Socinians, who not only deny that Christ made a real satisfaction, but that there was any need of it). The satisfaction here discussed is taken strictly for the payment of a debt, with which is paid what another owes and with which he satisfies the creditor or judge who requires the debt or punishment. Was it necessary for Christ to make satisfaction to divine justice for us? We affirm against the Socinians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.10.3–4</span></figcaption>

</figure><figure class="quote" id="q-685533d1c4" data-kw="necessity satisfaction debt">
<blockquote><p>The satisfaction here discussed is not taken widely for a simple and indiscriminate reparation of injury (as when one purges and excuses himself to him who has suffered injury). Rather it is taken strictly for the payment of a debt, with which is paid what another owes and with which he satisfies the creditor or judge who requires the debt or punishment. Was it necessary for Christ to make satisfaction to divine justice for us? We affirm against the Socinians.</p></blockquote>

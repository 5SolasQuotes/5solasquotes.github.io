<blockquote><p>On the one hand, it was stated that grace only serves to restore human willpower for good and to put humans themselves to work. Good works, in that case, were definitely necessary for salvation, whether by a necessity of merit (Rome) or by a necessity of causality and effectiveness (Remonstrants). And from the antinomian side it was said objectively that the righteousness and holiness of Christ remained completely external to a person, not only in justification but also in sanctification, so that repentance, conversion, prayer for forgiveness, and good works were totally unnecessary, bore a legalistic character, and failed to do justice to the perfect sacrifice of Christ. Lutherans tried to avoid both extremes and conducted a long-lasting and vehement debate on the appropriateness or inappropriateness of the proposition ‘Good works are necessary to salvation.’… The Reformed were more moderate in their judgment, regarded the Lutheran debate as a dispute over words, and could not see the big difference between the rejected formula ‘Good works are necessary to salvation’ and another that some Lutherans (like Quenstedt and Buddeus) had approved: ‘It is impossible to be saved without good works.’ They had no objection to calling good works necessary to salvation provided this did not imply a ‘necessity of causality or merit or effectiveness’ but implied a necessity of presence of the means and ways to obtain eternal salvation. Voetius even believed that in a sense good works can be called ‘the cause of eternal life,’ that is, not a ‘meritorious’ but a ‘preparatory’ and ‘dispositional’ cause. (G. Voetius, Select Disputations, vol 5, 675 ff.) Speaking along these lines, they undoubtedly had Scripture on their side… . Good Works Sanctification manifests itself in good works, which according to the Heidelberg Catechism arise from the principle of a true faith, conform to the law of God, and are done for his glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, (Baker, 2008), vol. 4, Part 1, ch. 4, ‘Passive and Active Sanctification’, pp. 254-256 Some footnotes have been omitted.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ac017145c5" data-kw="">
<blockquote><p>What is to be observed in the sayings of the Scriptures wherein justification, salvation and life eternal is ascribed to works?

1. Legal sentences are to be understood of perfect good works, such as none can be found in no creature; But evangelical sentences do always include faith in our works. And we must understand that by faith in the first place, justification is received, and acceptation to life eternal: afterward in the second place and by consequence, works are accepted as the fruits of faith, and life eternal is promised to these for Christ’s sake.

2. In such sayings, there are not brought forth arguments from the cause [as to] why the person is made partaker of eternal life, but it is showed from the effects or the adjuncts what person is partaker of remission of sins and life eternal (so Lk. 7:47). Christ plainly proves in way of resolution by this argument that the woman’s sins were pardoned because she loved much. But two diverse questions are at no hand to be confounded. The one to whom life eternal is given, the other for what cause it is given. To them that do well and meditate in the law of God, is happiness and life eternal promised, but yet it is given freely for Christ’s sake.

3. In this question we must remember to observe a rule of the Rabbins concerning the Holy Scriptures. In every place wherein thou lightest on an objection for an heretics, thou findest a medicine in the side thereof. So the scripture, wheresoever it ascribes eternal life to works as a reward, calls it an inheritance.

4. When as diverse effects do depend alike of one and the self same cause, the consequence from one effect avails to another because of their common dependence, as Lk. 7:47, the consequence from love avails (to prove) the remission of sins: because each of them depends on faith.

5. Where there is a subject there is his propriety, and on the contrary where there is a propriety there is his subject. So where there is faith there be works, and where there be good works there is faith.

6. Seeing good works do spring from faith, whatsoever is attributed to them, must needs be ascribed to the root (i.e. faith, whence they spring).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (London, 1606), ch. 32, ‘Of Good Works’, p. 376-77</span></figcaption>

</figure><figure class="quote" id="q-d7f9c695a0" data-kw="">
<blockquote><p>And if you please further to infer that, because perseverance in sin of infidelity and impenitency, as they are the meritorious causes of damnation so they are the meritorious causes of the decree of damnation also: I think I may with as good reason take liberty to infer from the former, that seeing faith and repentance, yea and good works also are the disposing causes of salvation, therefore they are to be accounted the disposing causes of the decree of salvation, that is of our election also: And so your opinion shall appear at full and to life in his proper colors, not an hair’s breadth different, either from the Arminian heresy of late, or from the Pelagian heresy of old.</p></blockquote>

<blockquote><p>Since we have been delivered from our misery by grace alone through Christ, without any merit of our own, why must we yet do good works? Because Christ, having redeemed us by his blood, also renews us by his Holy Spirit to be his image, so that with our whole life we may show ourselves thankful to God for his benefits, and he may be praised by us. Further, that we ourselves may be assured of our faith by its fruits, and that by our godly walk of life we may win our neighbours for Christ.</p></blockquote>

</figure><figure class="quote" id="q-f19f85dc6a" data-kw="">
<blockquote><p>It is asked whether a reward is promised to works as signs of faith. We judge that those say too much who think it is promised to works as a meritorious cause; nor do we think they say enough who suppose the promise is made only to them as signs of faith. For there are many passages of Scripture by which it is plainly established that our works, in the matter of salvation, are regarded as a cause without which not, or as a preceding condition, which has the reward of eternal life inseparably connected with it (Mt. 25:34; Rev. 7:14, etc.).</p></blockquote>

<blockquote><p>So at this day, the public weal does sometime promise rewards unto such as can best handle their weapons, to the intent their citizens may be the better exercised. Howbeit, there must be heed taken, that the kinds of plays be not hurtful and pernicious, and that therein be no danger of killing, maiming, or miserable tearing them, which either exercise themselves or be present, or be assembled to behold. And this kind of games is forbidden Ad legem Aquiliam, in the law, Nam ludus, and in the decrees De tormentis. Those things which of their owne nature be not evil, but are evil oftentimes through that which ensues ought to be forbidden.</p></blockquote>

<blockquote><p>5. A peaceable spirit must have a high esteem of peace, and be zealous for it, and industrious to obtain it. Only against ungodliness and unpeaceableness must he be unpeaceable. Many have a good wish and a good word for peace, as hypocrites have for godliness, but this will not serve the turn. He that is not for us is against us, and he that gathers not with us, and he that gathers not with us, scatters abroad. The wicked and unpeaceable are zealous and industrious against peace; and those that are for peace are cold and indifferent for the greater part; and the zealous and industrious are so few that their voices cannot be heard in the contentious crowd. The unpeaceable are commonly the loudest and are actuated by a fervent zeal, which nature agrees with and Satan cherishes and excites: such will even as the Quakers, go up and down from one assembly to another, and in the market-places and other places of concourse, revile and rail, and reproach the ministry, and speak as earnestly as if they were the agents of Christ. And others are busy in secret, that will not incur the disgrace of such visible impiety. And when the enemies of unity and peace are many, and hot and loud, and the friends of unity and peace are either few or cold and dull and silent, what’s like to be the issue, but even the mischiefs which we feel? Forsooth, some dare not be fervent for peace, lest they be censured for their fervor to be unpeaceable: These show how much they love the praise of men and stick yet in the power of self. There’s need of zeal for peace, as well as for other parts of holiness. All the resistance that the enemies of Hell and earth can make, will be made against it: And will it be carried on against all by sleepy wishes and sitting still? I am sure this agrees not with the precepts of the Spirit. ‘Follow peace with all men,’ Heb. 12:14. If it be possible, as much as in you lies, live peaceably with all men, Rom. 12:18. It’s a sorry surgeon, or physician that will think it enough to wish well to their patient: the House of God will be neither built, nor repaired without zeal and industry and patience in the work. If men’s hearts were set upon the Church’s peace, and they did but feel the disjoiting of her members, the breaking of her bones, and the smart of her wounds, as sensibly as they feel the like in their own bodies; and if ministers and other Christians were as sensible of the evil of divisions as they are of drunkenness, and whoredom, and such other sins, and if we were all awakened to quench the flames of the Church, as earnestly as we would do the fire in our houses, and would preach for peace and pray for peace, and plead and labor and suffer for peace, then some good might be done on it, against the rage and multitude of dividers. … 8. Another hindrance of unity and peace is a carnal zeal in matters of religion, which is frequently mistaken for the true zeal of the saints. When men are confident that their opinions are the truth, and overvalue them as to the necessity (because they are their own, though they observe not the reason), they presently think they must be hot against all the gainsayers of their opinions; and herein they place the most, or at least too much, of their religion. There’s not one of many that has this zeal but thinks it is of God and is part of their holiness, when as it is often from the Devil and the flesh, even when the doctrine is true which they contend for. You may know it from true zeal by these following marks: 1. It is more for controversies and speculations than for practical holiness. 2. It is selfish and kindled by an overvaluing their own conceits or ways. 3. It is private and would promote a lower truth to the loss of a greater, or a doubtful point, to the loss of undoubted truth; or a single truth, to the loss or hindrance of the body of common truth; and it is hotter for a party than for the catholic Church, and will promote the interest of an opinion or purity to the wrong of the common interest of the Church. 4. It is blind and carries men to sinful means, as resisting authority, order or ordinances, or the like. 5. It is unmerciful and unpeaceable, and little sensible of the case of others or smart of the divided Church. Many are calling for fire from Heaven for the cause of Christ, that little know what spirit they are of, Lk. 9:55. O how true is this of many that think they excel in knowledge or zeal and are but defending the truth against erroneous adversaries. But ‘who is the wise man and endued with knowledge among you? let him show out of a good conversation, his works with meekness of wisdom: But if you have bitter envying and strife in your hearts, glory not, and lie not against the truth: This wisdom descends not from above, but is earthly, sensual, devilish: For where envying and strife is, there is confusion, and every evil work: But the wisdom that is from above, is first pure, then peaceable, gentle, and easy to be entreated, full of mercy and good fruits, without partiality, without hypocrisy; And the fruit of righteousness is sown in peace of them that make peace.’ Jam. 3:13 to the end. But of this I have formerly spoken at large in many sermons on these words of James. Dividing zeal is a grievous distracter of the Church’s peace.</p></blockquote>

<blockquote><p>Beauty is a mode of being, through which the being is understood to please. The academics do not distinguish beauty from good. They err…</p></blockquote>

<blockquote><p>Further, if people are thus unjustly charged, it may be some comfort to consider the best of Christ’s servants have been thus accused, as appears from what the apostle says, 2 Cor. 1:17-18, when it seems such as turned his enemies in that Church had charged him with lightness and changeableness in his doctrine and principles, as well as in his purposes, where, for his own vindication, he is obliged to use a sort of solemn oath, saying, ‘But as God is true, our word,’ or preaching, ‘toward you was not yea and nay.’ And Durham on Scandal (p. 176) instances this as one of the ways whereby the Devil carries on division in the Church, viz. by making people charge ministers with ‘lightness’ and ‘changeableness,’ as if they were of one mind this year and of another the next. As formerly I endeavored to contribute my mite in opposing what I judged amiss in the Church of Scotland, so, through grace, I hope to continue and cannot see a shadow of reason to imagine but it is as acceptable to God, and much more acceptable to Him to oppose what may be amiss in her conduct, in a way of Church-communion, as in a separate state, ‘Separation’ (as the Protesters say) ‘being highly impedimental to reformation.’ (Rep. to Ass., 1652) I know every Christian, and ministers of the Gospel, in a special manner, ought to be very cautious, guarding against giving offense to any of Christ’s little ones, but if they will take offense at doing what is plain present duty, though they are to be pitied and used tenderly, yet they are not to be regarded so as to omit duty for fear they take offense. When the great apostle of the gentiles opposed Peter, and other saints, who pretending greater strictness, did separate from the gentile converts, he knew his conduct in that would offend many who were dear unto the Lord; yet he regarded not their offense, but ‘withstood Peter to the face, because he was to be blamed.’ (Gal. 2:11-14) Our Lord Jesus knew his healing and curing diseased persons on the Sabbath would occasion such as watched him (Mk. 3:2) to take offense; He also knew his familiar converse with publicans and sinners would be stumbling and offensive to sundry; yet he would not forbear it. Sometimes we are called to deny ourselves as to our ease, conveniency, pleasure and satisfaction rather than occasion the offending of such as causelessly take offense, but, according to our Lord’s example, commanded present duty is to be done, let never so many stumble or be offended. Hence [Matthew] Henry says (on Mk. 2:16), ‘Those are too tender of their own good name who, to preserve it with some nice people, will decline a good work; Christ would not do so.’ And tender Christians, who may be ready to take offense, ought to consider what danger there is in being ‘righteous over much.’ If the prophetess Miriam, or Aaron, the saint of God, speak against Moses, his Lord will resent it, asking ‘Wherefore were ye not afraid to speak against my servant Moses?’ (Num. 12:8) Now, for doing what, in my opinion, is plain present duty in this case, viz. the opposing what I take to be sinful schism, though I should further suffer in my reputation from some, yet ’tis some satisfaction to think in this I’m far from being singular; for here I suffer with a cloud of faithful witnesses, as…</p></blockquote>

<blockquote><p>But the words of Luke give rise to another question; for Christ does not order us to grant forgiveness, till the offender turn to us and give evidence of repentance. I reply, there are two ways in which offenses are forgiven. If a man shall do me an injury, and I, laying aside the desire of revenge, do not cease to love him, but even repay kindness in place of injury, though I entertain an unfavorable opinion of him, as he deserves, still I am said to forgive him. For when God commands us to wish well to our enemies, He does not therefore demand that we approve in them what He condemns, but only desires that our minds shall be purified from all hatred. In this kind of pardon, so far are we from having any right to wait till he who has offended shall return of his own accord to be reconciled to us, that we ought to love those who deliberately provoke us, who spurn reconciliation, and add to the load of former offenses. A second kind of forgiving is, when we receive a brother into favor, so as to think favorably respecting him, and to be convinced that the remembrance of his offense is blotted out in the sight of God. And this is what I have formerly remarked, that in this passage Christ does not speak only of injuries which have been done to us, but of every kind of offenses; for he desires that, by our compassion, we shall raise up those who have fallen. This doctrine is very necessary, because naturally almost all of us are peevish beyond measure; and Satan, under the pretense of severity, drives us to cruel rigor, so that wretched men, to whom pardon is refused, are swallowed up by grief and despair. But here another question arises. As soon as a man by words makes profession of repentance, are we bound to believe him? Were this done, we must of necessity go willingly and knowingly into mistake; for where will be discretion, if any man may freely impose on us, even to the hundredth offense? I answer, first, the discourse relates here to daily faults, in which every man, even the best, needs forgiveness. Since, then, amidst such infirmity of the flesh, our road is so slippery, and snares and attacks so numerous what will be the consequence if, at the second or third fall, the hope of forgiveness is cut off? We must add, secondly, that Christ does not deprive believers of the exercise of judgment, so as to yield a foolish readiness of belief to every slight expression, but only desires us to be so candid and merciful, as to stretch out the hand to offenders, provided there be evidence that they are sincerely dissatisfied with their sins. For repentance is a sacred thing, and therefore needs careful examination; but as soon as the offender gives probable evidence of conversion, Christ desires that he shall be admitted to reconciliation, lest, on being repulsed, he lose courage and fall back. Thirdly, It must be observed that, when any man, through his light and unsteady behavior, has exposed himself to suspicion, we may grant pardon when he asks it, and yet may do so in such a manner as to watch over his conduct for the future, that our forbearance and meekness, which proceed from the Spirit of Christ, may not become the subject of his ridicule. For we must observe the design of our Lord himself, that we ought, by our gentleness, to assist those who have fallen to rise again. And certainly we ought to imitate the goodness of our heavenly Father, who meets sinners at a distance to invite them to salvation. Besides, as repentance is a wonderful work of the Spirit, and is the creation of the new man, if we despise it, we offer an insult to God himself.</p></blockquote>

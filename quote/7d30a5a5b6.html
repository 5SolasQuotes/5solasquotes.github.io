<blockquote><p>XXXIII. And the thing speaks for itself, For, as there is a covenant between the Father and the Son; “when thou shalt make his soul (if the soul of the Son shall devote himself) an offering for sin,” Is. 53:10, upon performing the condition, the Son acquired a right to the reward, and so has a merit according to the covenant. Nay, as it is not the obedience of a mere man, but of Christ, God-man, an infinite person, it is also of an infinite value, consequently bears the justest proportion to the greatest corresponding glory; and thus far it is a merit of condignity, as it is called; such as no mere creature is capable to acquiring.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite>, trans. William Crookshank, vol. 1 (London: T. Tegg &amp; Son, 1837), vol. 1. 162 (2.3.33).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d25d2c5fd9" data-kw="">
<blockquote><p>But, whether that covenant [of works] was also entered into with the second Adam is more difficult to determine. Certainly from one perspective, as a creature and as man, it seems that He cannot be exempted from the moral government of God, nor otherwise could He as a man have merited anything for Himself. From another perspective, if He were in Adam under the covenant of nature, then it would seem that in and with Adam who sinned, He violated that same covenant, which is beyond absurd. Therefore it seems most safe to state: although as a rational creature He cannot be exempted from moral government with respect to his natural duties, yet He could have been withdrawn by God from the same moral governance in the positive duties, such as the commandment not to eat of the forbidden fruit (upon the transgression of which the sin of the human race hangs). Thus that this moral government was brought upon Him just as upon the rest of Adam’s posterity, according to the intention of God, we do not believe, because: (1) He had been designated by the eternal decree to be the second Adam (1 Peter 1:20; Rom. 5:12ff.), and it is unfitting that the second Adam should have been included with the first Adam in the same covenant, indeed included in him. I need not add that: (2) none were included except those that were to exist from the order of second causes; but the Savior, before sin, was not to exist from the order of second causes. Nor also: (3) can one for whom it is absolutely repugnant to sin be considered to have sinned in another, since it is entirely impossible for the God-man to become a sinner.</p></blockquote>

<blockquote><p>Before Adam’s fall it was not necessary for him to have Christ, because he was righteous and without sin, just as the angels have no need of Christ. If Adam had not fallen, it would not have been necessary for Christ to become our Redeemer. …The argument is true that eternal life is in the given to him who keeps the law without Christ, because whoever keeps the law is righteous. Adam would have entered into the kingdom of heaven without Christ, if he had not fallen. …The conclusion is that Adam alone kept the commandments of God before the Fall, but after the Fall and no one has truly been found who has fulfilled the law</p></blockquote>

<blockquote><p>CHAP. XVI. Of the Covenant of Works. Righteousness thus set forth in his several parts and branches, has of God’s free goodness a reward belonging to it, (whereupon the same called the Law, or covenant of works;) as contrariwise a punishment in his Justice to those that sin against it: both more or less, as the righteousness or sin abounds. The reward is blessedness, which is the having of all things that make the creature happy, and stands in the fruition of God’s love, or, from thence coming, a conjunction and communion with him. Conjunction is the enjoying of his personal presence. Communion is a participation (in some sort) of his blessedness both kingdom power and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dudley-fenner.html">Dudley Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sacred Doctrine of Divinitie</cite>, (London, 1599, repr. 1613), 9. [Spelling modernized]</span></figcaption>

</figure><figure class="quote" id="q-7457ef94db" data-kw="">
<blockquote><p>1. I shall confirm this great truth, and evince the being of such a covenant. It is altogether denied by the Arminians that there was any such covenant, and amongst ourselves by Professor Simson, that it was a proper covenant. The weight of this matter lies here, that if the covenant made with Adam was not a proper covenant, he could not be a proper representing head; and if he was not, then there cannot be a proper imputation of Adam’s sin unto his posterity. None could ever dream, but there must be a manifest difference betwixt covenants between God and man, and those between men and men. There is no manner of equality betwixt God and man; God could require all duty of men without any covenant; yea, they have nothing but what is from him, and so owe it to him. But those things do not hinder, that, upon God’s condescending to enter into a covenant with man, there may be a proper covenant betwixt them. Though all similitudes here must halt; yet let us suppose a father to propose to his son, that if he will obey his orders, and especially in one point give him punctual obedience, for instance, labour his vineyard, he will give him a certain sum of money; and the son having nothing to labour it with, the father furnishes him with all things necessary thereto; the son accepts of this proposal. Can any man say that there is not a proper bargain, or covenant, in this case betwixt the father and his son, although the son was tied by the bond of nature to obey his father’s commands in all this antecedently to the bargain, and though he has nothing to labour it with, but what he has from the father? Let him perform his father’s orders now according to the covenant, and he can challenge the sum as a debt, which he could not do before. For proof this, consider, 1. Here is a concurrence of all that is necessary to constitute a true and proper covenant of works. The parties contracting, God and man; God requiring obedience as the condition of life; a penalty fixed in case of breaking; and man acquiescing in the proposal. The force of this cannot be evaded, by comparing it with the consent of subjects to the laws of an absolute prince. For such a law proposed by a prince, promising a reward upon obedience to it, is indeed the proposing of a covenant, the which the subject consenting to for himself and his, and taking on him to obey, does indeed enter into a covenant with the prince, and having obeyed the law may claim the reward by virtue of paction. And so the covenant of works is ordinarily in scripture called “the law,” being in its own nature a pactional law.

2. It is expressly called a covenant in scripture, Gal. 4:2, “For these are the two covenants, the one from the Mount Sinai,” &amp;c. This covenant from Mount Sinai was the covenant of works as being opposed to the covenant of grace, namely, the law of the ten commandments, with promise and sanction, as before expressed. At Sinai it was renewed indeed, but that was not its first appearance in the world. For there being but two ways of life to be found in scripture, one by works, the other by grace; the latter hath no place, but where the first is rendered ineffectual; therefore the covenant of works was before the covenant of grace in the world; yet the covenant of grace was promulgated quickly after Adam’s fall; therefore the covenant of works behoved to have been made with him before. And how can one imagine a covenant of works set before poor impotent sinners, if there had not been such a covenant with man in his state of integrity? Hos. 6:7, “But as for them; like Adam, they have transgressed the covenant.” Our translators set the word Adam on the margin. But in Job 31:33, they translate the very same word, “as Adam.” This word occurs but three times in scripture, and still in the same sense. Job 31:33, “If I covered my transgressions, as Adam,” Psalm 82:7, “But ye shall die like Adam.” Compare ver. 6, “I have said, Ye are gods; and all of you are children of the Most High;” compared with Luke 3:38, “Adam, which was the son of God.” And also here, Hos. 6:7. While Adam’s hiding his sin, and his death are made an example, how natural is it that his transgression, that led the way to all, be made so too? This is the proper and literal sense of the words; it is so read by several, and is certainly the meaning of it.

3. We find a law of works opposed to the law of faith, Rom. 3:27. “Where is boasting then? It is excluded. By what law? of works? Nay; but by the law of faith.” This law of works is the covenant of works, requiring works, or obedience, as the condition pleadable for life; for otherwise the law as a rule of life requires works too. Again, it is a law that does not exclude boasting, which is the very nature of the covenant of works, that makes the reward to be of debt. And further, the law of faith is the covenant of grace; therefore the law of works is the covenant of works. So Rom. 6:14, “Ye are not under the law, but under grace.” And this was the way of life without question, which was given to Adam at first.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. I shall confirm this great truth, and evince the being of such a covenant. It is altogether denied by the Arminians that there was any such covenant, and amongst ourselves by Professor Simson, that it was a proper covenant. The weight of this matter lies here, that if the covenant made with Adam was not a proper covenant, he could not be a proper representing head; and if he was not, then there cannot be a proper imputation of Adam’s sin unto his posterity. None could ever dream, but there must be a manifest difference betwixt covenants between God and man, and those between men and men. There is no manner of equality betwixt God and man; God could require all duty of men without any covenant; yea, they have nothing but what is from him, and so owe it to him. But those things do not hinder, that, upon God’s condescending to enter into a covenant with man, there may be a proper covenant betwixt them. Though all similitudes here must halt; yet let us suppose a father to propose to his son, that if he will obey his orders, and especially in one point give him punctual obedience, for instance, labour his vineyard, he will give him a certain sum of money; and the son having nothing to labour it with, the father furnishes him with all things necessary thereto; the son accepts of this proposal. Can any man say that there is not a proper bargain, or covenant, in this case betwixt the father and his son, although the son was tied by the bond of nature to obey his father’s commands in all this antecedently to the bargain, and though he has nothing to labour it with, but what he has from the father? Let him perform his father’s orders now according to the covenant, and he can challenge the sum as a debt, which he could not do before. For proof this, consider, 1. Here is a concurrence of all that is necessary to constitute a true and proper covenant of works. The parties contracting, God and man; God requiring obedience as the condition of life; a penalty fixed in case of breaking; and man acquiescing in the proposal. The force of this cannot be evaded, by comparing it with the consent of subjects to the laws of an absolute prince. For such a law proposed by a prince, promising a reward upon obedience to it, is indeed the proposing of a covenant, the which the subject consenting to for himself and his, and taking on him to obey, does indeed enter into a covenant with the prince, and having obeyed the law may claim the reward by virtue of paction. And so the covenant of works is ordinarily in scripture called “the law,” being in its own nature a pactional law.

2. It is expressly called a covenant in scripture, Gal. 4:2, “For these are the two covenants, the one from the Mount Sinai,” &amp;c. This covenant from Mount Sinai was the covenant of works as being opposed to the covenant of grace, namely, the law of the ten commandments, with promise and sanction, as before expressed. At Sinai it was renewed indeed, but that was not its first appearance in the world. For there being but two ways of life to be found in scripture, one by works, the other by grace; the latter hath no place, but where the first is rendered ineffectual; therefore the covenant of works was before the covenant of grace in the world; yet the covenant of grace was promulgated quickly after Adam’s fall; therefore the covenant of works behoved to have been made with him before. And how can one imagine a covenant of works set before poor impotent sinners, if there had not been such a covenant with man in his state of integrity? Hos. 6:7, “But as for them; like Adam, they have transgressed the covenant.” Our translators set the word Adam on the margin. But in Job 31:33, they translate the very same word, “as Adam.” This word occurs but three times in scripture, and still in the same sense. Job 31:33, “If I covered my transgressions, as Adam,” Psalm 82:7, “But ye shall die like Adam.” Compare ver. 6, “I have said, Ye are gods; and all of you are children of the Most High;” compared with Luke 3:38, “Adam, which was the son of God.” And also here, Hos. 6:7. While Adam’s hiding his sin, and his death are made an example, how natural is it that his transgression, that led the way to all, be made so too? This is the proper and literal sense of the words; it is so read by several, and is certainly the meaning of it.

3. We find a law of works opposed to the law of faith, Rom. 3:27. “Where is boasting then? It is excluded. By what law? of works? Nay; but by the law of faith.” This law of works is the covenant of works, requiring works, or obedience, as the condition pleadable for life; for otherwise the law as a rule of life requires works too. Again, it is a law that does not exclude boasting, which is the very nature of the covenant of works, that makes the reward to be of debt. And further, the law of faith is the covenant of grace; therefore the law of works is the covenant of works. So Rom. 6:14, “Ye are not under the law, but under grace.” And this was the way of life without question, which was given to Adam at first.”

— Thomas Boston, The Whole Works of Thomas Boston: Discourses on Prayer, ed. Samuel M‘Millan (Aberdeen: George and Robert King, 1852), 11.180–82.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+I+shall+confirm+this+great+truth%2C+and+evince+the+being+of+such+a+covenant.+It+is+altogether+denied+by+the+Arminians+that+there+was+any+such+covenant%2C+and+amongst+ourselves+by+Professor+Simson%2C+that+it+was+a+proper+covenant.+The+weight+of+this+matter+lies+here%2C+that+if+the+covenant+made+with+Adam+was+not+a+proper+covenant%2C+he+could+not+be+a+proper+representing+head%3B+and+if+he+was+not%2C+then+there+cannot+be+a+proper+imputation+of+Adam%E2%80%99s+sin+unto+his+posterity.+None+could+ever+dream%2C+but+there+must+be+a+manifest+difference+betwixt+covenants+between+God+and+man%2C+and+those+between+men+and+men.+There+is+no+manner+of+equality+betwixt+God+and+man%3B+God+could+require+all+duty+of+men+without+any+covenant%3B+yea%2C+they+have+nothing+but+what+is+from+him%2C+and+so+owe+it+to+him.+But+those+things+do+not+hinder%2C+that%2C+upon+God%E2%80%99s+condescending+to+enter+into+a+covenant+with+man%2C+there+may+be+a+proper+covenant+betwixt+them.+Though+all+similitudes+here+must+halt%3B+yet+let+us+suppose+a+father+to+propose+to+his+son%2C+that+if+he+will+obey+his+orders%2C+and+especially+in+one+point+give+him+punctual+obedience%2C+for+instance%2C+labour+his+vineyard%2C+he+will+give+him+a+certain+sum+of+money%3B+and+the+son+having+nothing+to+labour+it+with%2C+the+father+furnishes+him+with+all+things+necessary+thereto%3B+the+son+accepts+of+this+proposal.+Can+any+man+say+that+there+is+not+a+proper+bargain%2C+or+covenant%2C+in+this+case+betwixt+the+father+and+his+son%2C+although+the+son+was+tied+by+the+bond+of+nature+to+obey+his+father%E2%80%99s+commands+in+all+this+antecedently+to+the+bargain%2C+and+though+he+has+nothing+to+labour+it+with%2C+but+what+he+has+from+the+father%3F+Let+him+perform+his+father%E2%80%99s+orders+now+according+to+the+covenant%2C+and+he+can+challenge+the+sum+as+a+debt%2C+which+he+could+not+do+before.+For+proof+this%2C+consider%2C+1.+Here+is+a+concurrence+of+all+that+is+necessary+to+constitute+a+true+and+proper+covenant+of+works.+The+parties+contracting%2C+God+and+man%3B+God+requiring+obedience+as+the+condition+of+life%3B+a+penalty+fixed+in+case+of+breaking%3B+and+man+acquiescing+in+the+proposal.+The+force+of+this+cannot+be+evaded%2C+by+comparing+it+with+the+consent+of+subjects+to+the+laws+of+an+absolute+prince.+For+such+a+law+proposed+by+a+prince%2C+promising+a+reward+upon+obedience+to+it%2C+is+indeed+the+proposing+of+a+covenant%2C+the+which+the+subject+consenting+to+for+himself+and+his%2C+and+taking+on+him+to+obey%2C+does+indeed+enter+into+a+covenant+with+the+prince%2C+and+having+obeyed+the+law+may+claim+the+reward+by+virtue+of+paction.+And+so+the+covenant+of+works+is+ordinarily+in+scripture+called+%E2%80%9Cthe+law%2C%E2%80%9D+being+in+its+own+nature+a+pactional+law.+2.+It+is+expressly+called+a+covenant+in+scripture%2C+Gal.+4%3A2%2C+%E2%80%9CFor+these+are+the+two+covenants%2C+the+one+from+the+Mount+Sinai%2C%E2%80%9D+%26c.+This+covenant+from+Mount+Sinai+was+the+covenant+of+works+as+being+opposed+to+the+covenant+of+grace%2C+namely%2C+the+law+of+the+ten+commandments%2C+with+promise+and+sanction%2C+as+before+expressed.+At+Sinai+it+was+renewed+indeed%2C+but+that+was+not+its+first+appearance+in+the+world.+For+there+being+but+two+ways+of+life+to+be+found+in+scripture%2C+one+by+works%2C+the+other+by+grace%3B+the+latter+hath+no+place%2C+but+where+the+first+is+rendered+ineffectual%3B+therefore+the+covenant+of+works+was+before+the+covenant+of+grace+in+the+world%3B+yet+the+covenant+of+grace+was+promulgated+quickly+after+Adam%E2%80%99s+fall%3B+therefore+the+covenant+of+works+behoved+to+have+been+made+with+him+before.+And+how+can+one+imagine+a+covenant+of+works+set+before+poor+impotent+sinners%2C+if+there+had+not+been+such+a+covenant+with+man+in+his+state+of+integrity%3F+Hos.+6%3A7%2C+%E2%80%9CBut+as+for+them%3B+like+Adam%2C+they+have+transgressed+the+covenant.%E2%80%9D+Our+translators+set+the+word+Adam+on+the+margin.+But+in+Job+31%3A33%2C+they+translate+the+very+same+word%2C+%E2%80%9Cas+Adam.%E2%80%9D+This+word+occurs+but+three+times+in+scripture%2C+and+still+in+the+same+sense.+Job+31%3A33%2C+%E2%80%9CIf+I+covered+my+transgressions%2C+as+Adam%2C%E2%80%9D+Psalm+82%3A7%2C+%E2%80%9CBut+ye+shall+die+like+Adam.%E2%80%9D+Compare+ver.+6%2C+%E2%80%9CI+have+said%2C+Ye+are+gods%3B+and+all+of+you+are+children+of+the+Most+High%3B%E2%80%9D+compared+with+Luke+3%3A38%2C+%E2%80%9CAdam%2C+which+was+the+son+of+God.%E2%80%9D+And+also+here%2C+Hos.+6%3A7.+While+Adam%E2%80%99s+hiding+his+sin%2C+and+his+death+are+made+an+example%2C+how+natural+is+it+that+his+transgression%2C+that+led+the+way+to+all%2C+be+made+so+too%3F+This+is+the+proper+and+literal+sense+of+the+words%3B+it+is+so+read+by+several%2C+and+is+certainly+the+meaning+of+it.+3.+We+find+a+law+of+works+opposed+to+the+law+of+faith%2C+Rom.+3%3A27.+%E2%80%9CWhere+is+boasting+then%3F+It+is+excluded.+By+what+law%3F+of+works%3F+Nay%3B+but+by+the+law+of+faith.%E2%80%9D+This+law+of+works+is+the+covenant+of+works%2C+requiring+works%2C+or+obedience%2C+as+the+condition+pleadable+for+life%3B+for+otherwise+the+law+as+a+rule+of+life+requires+works+too.+Again%2C+it+is+a+law+that+does+not+exclude+boasting%2C+which+is+the+very+nature+of+the+covenant+of+works%2C+that+makes+the+reward+to+be+of+debt.+And+further%2C+the+law+of+faith+is+the+covenant+of+grace%3B+therefore+the+law+of+works+is+the+covenant+of+works.+So+Rom.+6%3A14%2C+%E2%80%9CYe+are+not+under+the+law%2C+but+under+grace.%E2%80%9D+And+this+was+the+way+of+life+without+question%2C+which+was+given+to+Adam+at+first.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Whole+Works+of+Thomas+Boston%3A+Discourses+on+Prayer%2C+ed.+Samuel+M%E2%80%98Millan+%28Aberdeen%3A+George+and+Robert+King%2C+1852%29%2C+11.180%E2%80%9382.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7457ef94db.html&amp;vi

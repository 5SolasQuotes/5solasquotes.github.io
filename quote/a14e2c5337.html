<main class="wrap"><figure class="quote" id="q-a14e2c5337" data-kw="">
<blockquote><p>Concerning the distinction or difference of days, we say that it is a beastly superstition to esteem one day more holy than another, or to think that abstaining from work were a thing of itself that pleases God. Notwithstanding among the seven days we observe and keep one, according to the commandment of God, for to bestow it to hear the Word of God in the congregation, and principally to dedicate and give ourselves to learn and understand our duties towards God, and towards our neighbors. Thus we spend the Sunday. And concerning other festival days, we have put away as many as is possible for us: knowing the abuse that has come thereby, and the little need that Christendom has of them. Yet nevertheless, because there be certain days dedicated to the mysteries of our redemption, we use the Christian liberty, and have respect to that which either may hurt, or serve to the edification of the Church, according to the circumstance of time, place, and persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief &amp; Pithy Sum of the Christian Faith made in Form of a Confession</cite>, (London, 1562), ch. 5, 39. Of marriage, of fasting and of the difference of days and meats, pp. 119-20</span></figcaption>

<blockquote><p>The Religion, Doctrine and Discipline received, believed and defended by the Church of Scotland, and namely the public ministration of Baptism, and the Lord’s Supper, sitting at the table in the act of receiving the bread and wine of that Sacrament, the observation of the Lord’s Day, and the examination of children, for the first time at the ninth year of their age, for the second at the twelfth, for the third at the fourteenth, excluding and abhorring private baptism, private communion, kneeling in the act of receiving the Supper, holy days, or feast of Christmas, Passion, Resurrection, Ascension and sending down of the Holy Ghost: were brought in at the reformation of religion [in 1560], and enjoyed ever since in manner and form as follows. After due trial and advertisement taken of the heads in general and particular above written, the whole church was of one heart and judgment concerning the same…</p></blockquote>

<blockquote><p>Tilen sets out the expediency of holy-days for imprinting in the minds of people the sense and knowledge of the benefits of redemption. Answer: 1. There is no mean so good for this purpose as catechizing and preaching, out of season and in season. 2. What could he say unto them who have attained his end without his mean? I find people better instructed and made more sensible of those benefits where the feasts are not kept, than where they are. 3. Think they their people sufficiently instructed in the grounds of religion when they hear of the nativity, passion, etc. What course will they take for instructing them in other principles of faith? Why do they not keep one way, and institute a holy-day for every particular head of catechism? But Bishop Lindsey thinks yet to let us see a greater expediency for observing holy-days. Certainely says he, nothing is so powerful to abolish profaneness and to root out superstition of men’s hearts, as the exercise of divine worship in preaching, praying and thanksgiving, chiefly then when the superstitious conceits of merit and necessity are most pregnant in the heads of people, as doubtless they are when the set times of solemnities return; for then it is meet to lance the oposterne when it is ripe. Answer: This is a very bad cure and is not only to heal the wound of the people slightly [Jer. 6:14], but to make it the more inveterate and festered. I might object that little or nothing is preached or spoken by him and his companions at the revolution of those festivities against the superstitious keeping of them; but though they should speake as much as can be against this superstition, their lancing being in word only, and not in deed, the recidivation will prove worse than the disease. The best lancing of the oposterne were not to observe them at all, or to preach against them, which are tried to work this effect more powerfully than the bishop’s cure has done: for all know, that there is none so free of this superstition as those who observe not the holy-days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 2, ‘Against those of our Opposites who plead for the Ceremonies as things Expedient’, pp. 13-14</span></figcaption>

</figure><figure class="quote" id="q-fb44c0729d" data-kw="">
<blockquote><p>This one thing, however, we can scarcely refrain from mentioning, with regard to what is written in the 24th chapter of the aforesaid [Second Helvetic] Confession [of 1566] concerning the ‘festival of our Lord’s nativity, circumcision, passion, resurrection, ascension, and sending of the Holy Ghost upon his disciples,’ that these festivals at the present time obtain no place among us; for we dare not religiously celebrate any other feast-day than what the divine oracles have prescribed. Everything else, as we have said, we teach, approve, and most willingly embrace [in the Second Helvetic Confession].</p></blockquote>

<blockquote><p>Concerning ceremonial festivals of man’s making, our practice cannot be objected, because we observe none. We take occasion of hearing and praying upon any day when occasion is offered. We say (with [Rudolph] Hospinian [d. 1626], [in Latin] Of Christian Festivals, ch. 2 [1611/74]) ‘Not the day, but the Word of God… puts us in mind of the nativity, resurrection and ascension of Christ.&#x27;</p></blockquote>

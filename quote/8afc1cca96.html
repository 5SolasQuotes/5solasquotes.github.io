<blockquote><p>I choose to make the obligation which we are under of obeying civil laws, and the commands of our governors, to depend on the will of God, because the other foundations on which it is wont to be built do not appear of sufficient strength and solidity.</p></blockquote>

</figure><figure class="quote" id="q-82acf8b81b" data-kw="">
<blockquote><p>Christ has not made pastors under-kings to create any laws morally obliging the conscience to obedience in the court of God, which God has not made to their hand; if the king and synods only declare and propound, by a power of jurisdiction, that which God in the Law of Nature or the written Word has commanded; they are not the Law-makers, nor creators of that morality in the Law, which lays bonds on the conscience; yea, they have no organical, nor inferior influence in creating that morality, God only by an immediate act as the only immediate king, made the morality, and if king, parliaments and synods be under kings and under Law-givers, they must have an under-action, and a ministerial, subservient, active influence under Christ in creating as second causes, that which is the formal reason, and essence of all laws binding the conscience, and that is the morality that obliges the soul to eternal wrath, though king, parliament, pastors or synods should never command such a moral thing: Now to propound, or declare, that God’s will is to be done in such an act, or synodical directory or canon, and to command it to be observed under civil and ecclesiastical pain, is not to make a law, it is indeed to act authoritatively under Christ as King: but it makes them neither kings, nor Law-givers, no more than heralds are little kings, or inferior law-givers, and parliaments, because in the name and authority of king and parliament they promulgate the laws of king and parliament: The heralds are mere servants, and do indeed represent king and parliament, and therefore to wrong them, in the promulgation of laws, is to wrong king and parliament; but the heralds had no action, no hand at all in making the laws; they may be made when all the heralds are sleeping, and so by no propriety of speech can heralds be called mediate kings, under-Lawgivers, just so here, as touching the morality of all human laws, whether civil or ecclesiastical, God Himself immediately, yea, from eternity by an act of his free-pleasure made that without advice of men or angels; for who instructed Him? Neither Moses, nor prophet, nor apostle; yea, all here are meri precones, only heralds; Yet are not all these heralds, who declare the morality of laws, [for] equals may declare them charitative[ly], by way of charity to equals; but these only are to be obeyed as heralds of laws, whom God has placed in authority, as kings, parliaments, synods, the Church, masters, fathers, captains; And it follows no ways that we disclaim the authority of all these because we will not enthrone them in the chair of the Supreme and only Lawgiver, and head of the Church; they are not under-Law-givers and little kings to create laws, the morality of which binds the conscience (for this God only can do); therefore, there be no parliaments, no kings, no rulers that have authority over men, it is a most unjust consequence; for all our divines, against Papists, deny that human laws, as human, do bind the conscience; but they deny not, but assert the power of jurisdiction in kings, parliaments, synods, pastors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), pp. 25-26</span></figcaption>

n+all+the+heralds+are+sleeping%2C+and+so+by+no+propriety+of+speech+can+heralds+be+called+mediate+kings%2C+under-Lawgivers%2C+just+so+here%2C+as+touching+the+morality+of+all+human+laws%2C+whether+civil+or+ecclesiastical%2C+God+Himself+immediately%2C+yea%2C+from+eternity+by+an+act+of+his+free-pleasure+made+that+without+advice+of+men+or+angels%3B+for+who+instructed+Him%3F+Neither+Moses%2C+nor+prophet%2C+nor+apostle%3B+yea%2C+all+here+are+meri+precones%2C+only+heralds%3B+Yet+are+not+all+these+heralds%2C+who+declare+the+morality+of+laws%2C+%5Bfor%5D+equals+may+declare+them+charitative%5Bly%5D%2C+by+way+of+charity+to+equals%3B+but+these+only+are+to+be+obeyed+as+heralds+of+laws%2C+whom+God+has+placed+in+authority%2C+as+kings%2C+parliaments%2C+synods%2C+the+Church%2C+masters%2C+fathers%2C+captains%3B+And+it+follows+no+ways+that+we+disclaim+the+authority+of+all+these+because+we+will+not+enthrone+them+in+the+chair+of+the+Supreme+and+only+Lawgiver%2C+and+head+of+the+Church%3B+they+are+not+under-Law-givers+and+little+kings+to+create+laws%2C+the+morality+of+which+binds+the+conscience+%28for+this+God+only+can+do%29%3B+therefore%2C+there+be+no+parliaments%2C+no+kings%2C+no+rulers+that+have+authority+over+men%2C+it+is+a+most+unjust+consequence%3B+for+all+our+divines%2C+against+Papists%2C+deny+that+human+laws%2C+as+human%2C+do+bind+the+conscience%3B+but+they+deny+not%2C+but+assert+the+power+of+jurisdiction+in+kings%2C+parliaments%2C+synods%2C+pastors.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%281646%29%2C+pp.+25-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F82acf8b81b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/82acf8b81b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-human-laws-bind-the-conscience-how-they-do-not/#:~:text=Christ%20has%20not%20made%20pastors%20under%2Dkings,jurisdiction%20in%20kings%2C%20parliaments%2C%20synods%2C%20pas <blockquote><p>That is, the General Assembly decided that appeals cannot lie except in judicial cases. It is really a matter of importance. It would be a hard case if a party, suffering under a grievous wrong, should be turned away from the bar of our highest judicatory, merely on the ground that he had mistaken the nature of his remedy… We have had a superior judicatory in our Church for more than a hundred and twenty years. During about seventy years of this period, our discipline was conducted according to the Westminster Directory. In 1789 our present constitution went into operation; which was submitted to an extensive revision and alteration, as to matters of detail, in 1821. Under these several systems, appeals and complaints were allowed, without hindrance or contradiction, from any kind of decision in an inferior judicatory by a person who felt himself aggrieved, until 1834. Then, for the first time in our history, as far as we know, the idea was started that appeals and complaints could be made only in cases strictly judicial. …That this novel doctrine was not at that time the doctrine of the synod, which the Rev. gentleman defended, is plain… Though the synod was thus free from this new doctrine in May 1834, it grew in such sudden favour, that when that body met the following autumn, they decided not merely that appeals and com- plaints could not lie except in judicial cases, but even that protests were in the same predicament. This is an instructive illustration of the fact that the wisest and best men sometimes allow themselves to be run away with by a plausible idea, though contrary to all their own previous professions and practice. This, however, was a mere temporary delusion. The members of that synod who had signed or allowed protests in all kinds of cases before, still continued to sign or allow them, with equal freedom, their own decision to the contrary notwithstanding… We found its very authors and advocates disregarding it the very next year; acting as though no such doctrine had ever been broached. If they practically abandoned it as untenable… The Synod of Philadelphia extended the [new] doctrine to appeals, complaints and protests. Thus putting minorities completely under the feet of majorities, not allowing them even the right of recording their dissent with the reasons for it… …There is a good deal of confusion and error often occasioned by the mere designation of our ecclesiastical bodies as courts or judicatories. They are so called Avhen not sitting in judicial capacity… Our courts are bodies sui generis [of their kind]; they include within themselves legislative, executive and judicial powers. Yet this division is in a great measure arbitrary. These several powers are but different modes of exercising the general governing authority in the Church; and it is often very difficult to say whether a particular act should be placed under the one or the other of these heads… An appeal supposes an aggrieved party, but he may appeal from any kind of decision which directly affects himself. A complaint supposes some kind of impropriety in the act complained of, but it may be entered against any kind of act alleged to be improper. So that any kind of decision may be regularly brought up in each of the several ways specified above. That this is the true meaning of this article, might be inferred with certainty from the fact that it has always been so understood and acted upon; and that it is almost a literal transcript of the Scottish rule on the same subject, which has always been interpreted and applied in the same way… In the first place, these technical terms are to be understood, not according to their use in civil courts, but according to our own ecclesiastical usage. Our bodies are called courts; their decisions are called judgments; the matters brought before them are called cases. Are we to infer from this, as has been done by the New School lawyers and brethren, that they have nothing but judicial powers… In the second place, our rules were drawn up with special reference to that class of cases which is of most frequent occurrence, and hence the language employed is adapted to such cases… In the third place it is a fallacy running through this argument that there can be no judicial investigation of anything but a judicial act… There is, therefore, no foundation in our constitution for this new doctrine. Every letter of the rules may be, and has been fully complied with in a multitude of cases, where the decision appealed from was merely an executive act… We shall proceed to show that this new doctrine, especially if applied to complaints as well as appeals (and we have seen that the two cannot in this matter be consistently separated), is subversive of the fundamental principles of Presbyterianism, and inconsistent with the uniform practice of the Church… This doctrine is at variance also with the undeviating practice of our own and all other Presbyterian Churches. This of itself is a fatal objection to any new doctrine. The fact that we have been going on in accordance with the usage of all other Presbyterian bodies, for a hundred and twenty years, interpreting and administering our constitution in a certain way, is answer enough… The words of our book have the sense which they were intended to bear; and they were intended to bear the sense in which its authors and administrators have ever understood and applied them… That the practice of our Church has been uniform on this subject, is admitted… There is not then, upon our Minutes, a single case of an appeal or complaint, which was rejected on the ground that it did not refer to a judicial sentence. We have been going on for a hundred and twenty years entertaining such appeals without any one dreaming of their being irregular… If after all this a new and opposite doctrine is to be introduced, there never can be any stability or security with regard to any principle of Presbyterian Church government… Nothing short of a plain and intelligible denial of the right to complain of oppressive and unconstitutional acts; or to appeal from unrighteous decisions, though they may not be judicial, will induce Presbyterians to forego a privilege which they have enjoyed from the very foundation of their Church… If it is to be applied to appeals, we see not how any one can fail to apply it to complaints and references, and if so applied, all must acknowledge that our system of government would be completely overturned. The right of appeal is already restricted within very harrow limits. It is not the privilege of any member of the court. It belongs exclusively to an aggrieved party; to those whose character or interests are immediately concerned in the decision. And to all such it is a right guaranteed by the constitution and by the undeviating practice of the Church.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-72c588861e" data-kw="">
<blockquote><p>The chief practical argument in favour of Universalism is, doubtless, the sinful callousness of Christians towards this tremendous destiny of their sinful fellow-creatures. Can we contemplate the exposure of our friends, neighbours, and children to a fate so terrible [as hell], and feel so little sensibility, and make efforts so few and weak for their deliverance! And yet, we profess to have faith! How can our unbelieving friends be made to credit the sincerity of our convictions? Here, doubtless, is the best argument of Satan for their scepticism. And the best refutation of this heresy is the exhibition by God’s people of a holy, humble, yet burning zeal to pluck men as brands from the burning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-l-dabney.html">R. L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus and Notes of the Course of Systematic and Polemic Theology Taught in Union Theological Seminary, Virginia</cite>, (2nd edn, St Louis MO: Presbyterian Publishing Company, 1878), pp 861-62.</span></figcaption>

</figure><figure class="quote" id="q-f665082f5d" data-kw="">
<blockquote><p>Man is endowed with reason, and the human reason cannot rest satisfied with a mere collection of separate truths, but wants to see them in their mutual relationship, in order that it may have a clearer understanding of them… There seems to be a lurking fear that the more we systematize the truth, the farther we wander from the presentation of it that is found in the Word of God. But there is no danger of this, if the system is not based on the fundamental principles of some erring philosophy, but on the abiding principles of Scripture itself. God certainly sees the truth as a whole, and it is the duty of theologian to think the truths of God after Him. There should be a constant endeavor to see the truth as God sees it, even though it is perfectly evident that the ideal is beyond the grasp of man in his present condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introduction to Systematic Theology</cite>, (Grand Rapids: Baker, 1979), 15.</span></figcaption>

</figure><figure class="quote" id="q-a18a02d690" data-kw="">
<blockquote><p>1. The question concerning the parts of the church. Do reprobates also belong to it? II. First it is inquired whether besides those called elect, reprobates and infidels also (whether secret or open) are to be considered as true members of the church. Bellarmine with others pretends this is so (“De Ecclesia Militante,” 3.2, 7, 9 Opera [1857], 2:74–75, 81–83, 85–89 and the following) when he teaches that in the definition of the church, pagans, heretics, the excommunicated and schismatics are excepted: “All others are included, even if they are reprobates, wicked and impious” because, as he immediately adds, “that a person may be said to be absolutely a part of the true church, of which the Scriptures speak, we do not think there is required any internal virtue, but only an external, especially a communion of faith and of the sacraments, which is perceived by the sense itself.” The design is that no other church may be acknowledged except that of which the Roman bishop is head. And because they clearly saw (if they restrict it to the elect and believers) the pope might possibly not belong to it, therefore they wished to extend it even to the reprobate, provided they were embraced under the one visible head. Hence in the Council of Constance, this proposition of John Hus was condemned as heretical: “The holy universal church is the universality of the predestinated” (Mansi 27:754). The importance of the controversy is such that on its decision depend all the others which are agitated concerning the church between us and the Romanists. Hence we must treat it the more accurately.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 18.3.2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

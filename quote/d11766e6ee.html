<main class="wrap"><figure class="quote" id="q-d11766e6ee" data-kw="duty join true church">
<blockquote><p>For since salvation cannot be obtained except in communion with the true church and many glory in this sacred name who are destitute of its truth, it is of great value to know its true marks that we may be able to distinguish the true fold of Christ from the dens of thieves.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0334c1e215" data-kw="warning means not final loss">
<blockquote><p>It is one thing to be delivered to Satan with the feaster for eternal torment; another to be delivered with the incestuous Corinthian for the destruction of the flesh that the Spirit may be saved in the day of the Lord (1 Cor. 5:5). The believer can be delivered up in the latter, not in the former way. Excommunication does not simply exclude the fallen from the kingdom of heaven, but with this condition—unless they repent. Hence the excommunicated does not cease in secret to be a member of Christ, although as to external discipline for a time he may be cut off from the external body of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.16.40</span></figcaption>

</figure><figure class="quote" id="q-3e453359e8" data-kw="">
<blockquote><p>Wherefore we suffer not ourselves, in controversies about religion, or matters of faith, to be pressed with the bare testimonies of Fathers, or Decrees of Councils; much less with received customs, or with the multitude of men being of one judgment, or with prescription of long time. Therefore, in controversies of religion, or matters of faith, we cannot admit any other judge than God himself, pronouncing by the holy Scriptures, what is true, what is false, what is to be followed, or what to be avoided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 2</span></figcaption>

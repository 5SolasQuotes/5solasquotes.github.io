<main class="wrap"><figure class="quote" id="q-ea3a1566e5" data-kw="">
<blockquote><p>In this sense God as Creator, as revealed in the light of nature, has established civil government among men from the beginning, and among all peoples and nations, of all ages and generations. But in the development of the plan of redemption the God-man as mediatorial King has assumed the government of the universe. Matt. xxviii. 18; Phil. ii. 9–11; Eph. i. 17–23.

As the universe constitutes one physical and moral system, it was necessary that his headship as Mediator should extend to the whole and to every department thereof, in order that all things should work together for good to his people and for his glory, that all his enemies should be subdued and finally judged and punished, and that all creatures should worship him, as his Father had determined. Rom. viii. 28; 1 Cor. xv. 25; Heb. x. 13; i. 6; Rev. v. 9–13.

Hence the present providential Governor of the physical universe and “Ruler among the nations” is Jesus of Nazareth, the King of the Jews, to whose will all laws should be conformed, and whom all nations and all rulers of men should acknowledge and serve. “He hath on his vesture and on his thigh a name written, KING OF KINGS, AND LORD OF LORDS. Rev. xix. 16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander-hodge.html">Archibald Alexander Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, ed. William H. Goold (British edn, London: T. Nelson and Sons, 1870), pp 294-95.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a834883b73" data-kw="">
<blockquote><p>One Instance more of his mis-alledging and perverting of testimonies. In the close he cites a passage of Mr. Case his Sermon August 22. 1645. “He (Christ) is King of Nations and King of Saints. As King of Nations he has a temporal Kingdom and Government over the world, etc. and the rule and regiment of this Kingdom he has committed to Monarchies, etc. Here is Erastianism, (says Mr. Coleman p. 38.) a step higher then ever I or Erastus himself went. And I desire to know of Mr. Gillespie, if he will own this as good divinity.” Yes Sir I own it for very good divinity, for my Reverend Brother Mr. Case, says not that Christ as Mediator is King of Nations, and has a temporal Kingdom in the world, and has committed rule and regiment to Monarchies or other lawful Magistrates, (which is the point that you and Mr. Hussey contend for, being a great Heterodoxy in Divinity) but he says of the Son of God, that he is King of Nations, and has committed Rule to Monarchies, which I own with all my heart. The distinction of the twofold Kingdom of Christ, a universal Kingdom, whereby he reigns over all things as God: and a special economical Kingdom, whereby he is King to the Church only, and rules and governs it, is that which being rightly understood, overturns, overturns, overturns the Erastian principles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Male Audis</cite>, …. (London, 1646), 55.. [Spelling modernized].</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

og</a></div>
</figure><figure class="quote" id="q-f178dee403" data-kw="">
<blockquote><p>The real alternative placed before the country is that the Government shall become absolutely neutral, and assuredly you never are entitled on scriptural grounds to put that alternative to statesmen, or to any men.

You may put the alternative, no doubt, of giving money to one class or more class; for the mode of countenancing religion may vary with circumstances, but you never lawfully can put the alternative to nations or individuals, of being entirely neutral and indifferent in regard to the cause of Christ; for “he that is not with Christ is against Him.”

Every man is bound to support the cause of Christ, and to oppose that of antichrist. All statesmen are bound to support the cause of Christ, and we must tell them so. No doubt, there may be different forms in which that duty may be discharged, but the duty itself is unalterable and universal. (Hear, hear.) There cannot therefore be lawfully any such alternative as is alleged. It may be, and I believe it is, a more aggravated sin to endow all than to endow none, but to be indifferent to the cause of Christ or to oppose it are always sins. …

But I say, Suppose you get the matter your own way, and that all these endowments of Protestantism in Ireland are overthrown, how is the Government then to support the truth in Ireland? Suppose you disendow Protestantism in Ireland, what of disestablishing it? Does that mean anything else than simply disowning it practically? (Hear, hear.) And when this is done — and done not because Protestantism is untrue, but because it is in a minority — does it not imply that the Government is to become utterly indifferent in regard to religion? I just ask the question. In these circumstances, how is your Establishment principle, or any defensible form of an Establishment principle, to be carried out in Ireland by the Government of this country? …

Well, I would just ask these gentlemen. If you sweep away the Established Church and the Presbyterian Church [in Ireland], as far as the Government is concerned — if you publicly disown both, and the truth which they maintain — if you treat Protestant truth and Popish falsehood as if they were precisely alike, how are those principles to be developed and manifested in regard to Ireland? (Hear, hear.)

This is a very important practical question, and I think, if clearly answered, it would go farther to make us understand what the principles of our friends are than anything else that has occurred. In the absence of any information of that sort, it seems to me that what they and some amongst us are prepared to maintain is this, that the Government are under an obligation to support neither truth nor falsehood, but to be entirely neutral in regard to these in so far as Ireland is concerned. This is a thoroughly indefensible position, and yet this is your ground, as far as I can understand it; and if this be not your ground, I am very anxious that some one should rise up and clearly explain what your doctrine, and that of your allies, is; for there is an immense amount of ambiguity in the statements that are made on the subject. If this be the ground that is taken, I maintain that it is utterly untenable ground, and in a Christian Church, monstrous.

We are no doubt bound to protest to the uttermost against indiscriminate endowments; and I, for my part, would go the length of saying that it is more impious to endow all than to endow none, and that the greatest calamity that could befall the country is the support of Popery by the Government in Ireland, I repudiate such a result in every shape and form. But, on the other hand, I do not see — I have not been able to see — that the Government of this country, especially looking at it as the Government of the United Kingdom, a Protestant kingdom, of which Ireland is merely a part, are entitled to speak of having no alternative but to endow Popery, or to be neutral, or that we, as a Christian Church, are entitled to tell them that any such alternative is presented to them. Will any man take his Bible, and show me out of that Bible, that there is any such principle in the Word of God, before we go an inch farther in that direction? (Hear, hear.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Proposed Disestablishment of Protestantism in Ireland. In its bearing upon the Religion and Liberties of the Empire</cite>, (Edinburgh: James Nichol, 1868), pp 7, 8, 9.</span></figcaption>

<blockquote><p>What the period of embryonism is, and what the beginning of animation, neither Hippocrates, nor Galen, nor Aristotle know; but He knows who knows all things. For the precise definition of that matter is endured neither by the diversity of the seed itself from time to time, nor by the different disposition of the uterus or of the whole mother.</p></blockquote>

<blockquote><p>Thirdly, it is cleared in this discourse that those who have gotten to be powers (though by force) yet ought to give justice to those whose government they have undertaken. And again, that the people may lawfully demand it. But is it possible that one or a few persons in supreme power can distribute justice to a whole nation without subordinate agents? So that to say, ‘None may lawfully act under the supreme power in distributing of justice, and government,’ were to say upon the matter that he should give no justice, and that the people should have no justice at all. And then how absurd is it to teach that the people may lawfully seek justice of him which they cannot receive? and that he is bound to give justice, but none are allowed by whom he may give it? Fourthly, this doctrine of not acting is the very doctrine of levelling. For when no man may act to give justice, may not every man take freely from his neighbor what he list, and so level the rich with the poor? unless this make it unlikely, because worse than levelling, that those who have most force will have most; yea some all, and others nothing; and so to avoid acting under a supposed tyrannical government unto justice and order; there shall be tyrants in every place or parish, who shall act to disorder and oppression, and no property, justice, nor government at all left amongst us. And surely I think David out of his love to Israel would not have wished such an estate to Israel under Absalom, had he the whole in possession and himself no force on foot to recover it; nor would he have desired such an unsettlement to procure his settlement. And hence arises that which they call an interpretative consent of the people; because it is understood and supposed that every rational man does consent, that there should be order, property and right given to every member of a commonwealth under a tyrant, rather than all to be under confusion oppression, robberies and murders. Fifthly, how could Ezra and Nehemiah justify their acting under the Persian monarch, who had no right to the crown of Judah either by blood or just conquest (Ezra 7:25)? Yet Ezra was authorized by him to set magistrates, fine and imprison and put to death (Ezra 10:7-8); And he exercises authority, in making the people of Israel to swear and to enter into a covenant, and in sending forth a proclamation to all the children of the captivity, that they should gather themselves together to Jerusalem; And that whosoever would not come within three days, all his substance should be forfeited. Nehemiah also acts as governor, and rebukes the nobles and rulers and sets a great assembly against them because of their usury. He also called the priests and took an oath to perform the promise of leaving that usury (Neh. 5. •. etc.). He acknowledges also that he was governor there about twelve years, and he gave his brother Hanani and Hanaiah ruler of the palace charge over Jerusalem (Neh. 7:2). So he did both act himself and others acted under him. We find also that at that time there were rulers of the people that dwelt at Jerusalem, and Nehemiah contended with the rulers and nobles, made treasurers, commanded the gates to be shut before the Sabbath, threatened to lay hands on the merchants that lay at the gates, smote certain of the Jews and plucked off their hair because having married wives of Ashdod, their children spake half in the language of Ashdod (Neh. 13). Sixthly, let us hear what before these times and before our case was in being hath been taught in point of acting; and upon what grounds it has been approved. An author eminently learned and skillful in the doctrine of lawgiving says thus: ‘No man may punish or condemn another even with a just punishment, except he have public power, which a tyrant cannot give. But in this there must be a consideration or subdistinction. For in rigor this is true as to the tyrant’s part; yet it so happens that the commonwealth because it cannot resist him, does tolerate him, and suffers itself to be governed by him; and does tacitly consent, and will that justice be administered by him, for the reason already touched, because it is a less evil to be governed by him, than altogether to want just coaction and direction; and then it shall not be a sin to obey even in the things aforesaid, because the consent of the commonwealth does supply the defect of the tyrant’s power.’ (Suarez, De Leg., bk. 3, ch. 10) Another thus: ‘That his sentences are valid, is proved. Because his sentences, and just commands although they have not force from a tyrannical power, yet they have it from elsewhere. First, and inchoatively from the law of nature, which such a state of things being supposed, does dictate that obedience must be given for the common good, otherwise all will be full of thefts and robberies. Secondly, and completely from the commonwealth; and that either because while that state endures, it gives authority to him by a tacit consent, while it will’s that he administer justice, and use his usurped office in a due manner, or rather because it does tacitly approve his commands, and acts being agreeable to the laws and common good, and will’s that his just sentences, whereby the suites of the people are decided, and the guilty are punished, shall be valid and bind the subjects; for except they were valid and did bind, no man would obey, but only in show but every man would secretly do the contrary with a great inconvenience to the commonwealth. Now the commonwealth may give this force to the sentences, and acts of a tyrant, because it is superior to all single persons, though it be oppressed with tyranny, and may account the just sentence of a tyrant as its own.’ (Lessius, De Justitia &amp; Jure, bk. 2, ch. 25, Dubitat. 9) Thou wilt ask whether a tyrant do sin the sin of murder, and be bound to restitution, if he put to death guilty persons, or deprive them of their goods according to law? I answer negatively; because the commonwealth does tacitly give him authority hereunto, while it does consent and desire that this should be done by him. Thus is the authority of acting in this case grounded upon a tacit or implied consent, which consent is the very dictate of nature or common reason, because it is better to have some justice than none at all, some coercive power and government than that all be left to disorder, violence and confusion.</p></blockquote>

rstood+and+supposed+that+every+rational+man+does+consent%2C+that+there+should+be+order%2C+property+and+right+given+to+every+member+of+a+commonwealth+under+a+tyrant%2C+rather+than+all+to+be+under+confusion+oppression%2C+robberies+and+murders.+Fifthly%2C+how+could+Ezra+and+Nehemiah+justify+their+acting+under+the+Persian+monarch%2C+who+had+no+right+to+the+crown+of+Judah+either+by+blood+or+just+conquest+%28Ezra+7%3A25%29%3F+Yet+Ezra+was+authorized+by+him+to+set+magistrates%2C+fine+and+imprison+and+put+to+death+%28Ezra+10%3A7-8%29%3B+And+he+exercises+authority%2C+in+making+the+people+of+Israel+to+swear+and+to+enter+into+a+covenant%2C+and+in+sending+forth+a+proclamation+to+all+the+children+of+the+captivity%2C+that+they+should+gather+themselves+together+to+Jerusalem%3B+And+that+whosoever+would+not+come+within+three+days%2C+all+his+substance+should+be+forfeited.+Nehemiah+also+acts+as+governor%2C+and+rebukes+the+nobles+and+rulers+and+sets+a+great+assembly+against+them+because+of+their+usury.+He+also+called+the+priests+and+took+an+oath+to+perform+the+promise+of+leaving+that+usury+%28Neh.+5.+%E2%80%A2.+etc.%29.+He+acknowledges+also+that+he+was+governor+there+about+twelve+years%2C+and+he+gave+his+brother+Hanani+and+Hanaiah+ruler+of+the+palace+charge+over+Jerusalem+%28Neh.+7%3A2%29.+So+he+did+both+act+himself+and+others+acted+under+him.+We+find+also+that+at+that+time+there+were+rulers+of+the+people+that+dwelt+at+Jerusalem%2C+and+Nehemiah+contended+with+the+rulers+and+nobles%2C+made+treasurers%2C+commanded+the+gates+to+be+shut+before+the+Sabbath%2C+threatened+to+lay+hands+on+the+merchants+that+lay+at+the+gates%2C+smote+certain+of+the+Jews+and+plucked+off+their+hair+because+having+married+wives+of+Ashdod%2C+their+children+spake+half+in+the+language+of+Ashdod+%28Neh.+13%29.+Sixthly%2C+let+us+hear+what+before+these+times+and+before+our+case+was+in+being+hath+been+taught+in+point+of+acting%3B+and+upon+what+grounds+it+has+been+approved.+An+author+eminently+learned+and+skillful+in+the+doctrine+of+lawgiving+says+thus%3A+%E2%80%98No+man+may+punish+or+condemn+another+even+with+a+just+punishment%2C+except+he+have+public+power%2C+which+a+tyrant+cannot+give.+But+in+this+there+must+be+a+consideration+or+subdistinction.+For+in+rigor+this+is+true+as+to+the+tyrant%E2%80%99s+part%3B+yet+it+so+happens+that+the+commonwealth+because+it+cannot+resist+him%2C+does+tolerate+him%2C+and+suffers+itself+to+be+governed+by+him%3B+and+does+tacitly+consent%2C+and+will+that+justice+be+administered+by+him%2C+for+the+reason+already+touched%2C+because+it+is+a+less+evil+to+be+governed+by+him%2C+than+altogether+to+want+just+coaction+and+direction%3B+and+then+it+shall+not+be+a+sin+to+obey+even+in+the+things+aforesaid%2C+because+the+consent+of+the+commonwealth+does+supply+the+defect+of+the+tyrant%E2%80%99s+power.%E2%80%99+%28Suarez%2C+De+Leg.%2C+bk.+3%2C+ch.+10%29+Another+thus%3A+%E2%80%98That+his+sentences+are+valid%2C+is+proved.+Because+his+sentences%2C+and+just+commands+although+they+have+not+force+from+a+tyrannical+power%2C+yet+they+have+it+from+elsewhere.+First%2C+and+inchoatively+from+the+law+of+nature%2C+which+such+a+state+of+things+being+supposed%2C+does+dictate+that+obedience+must+be+given+for+the+common+good%2C+otherwise+all+will+be+full+of+thefts+and+robberies.+Secondly%2C+and+completely+from+the+commonwealth%3B+and+that+either+because+while+that+state+endures%2C+it+gives+authority+to+him+by+a+tacit+consent%2C+while+it+will%E2%80%99s+that+he+administer+justice%2C+and+use+his+usurped+office+in+a+due+manner%2C+or+rather+because+it+does+tacitly+approve+his+commands%2C+and+acts+being+agreeable+to+the+laws+and+common+good%2C+and+will%E2%80%99s+that+his+just+sentences%2C+whereby+the+suites+of+the+people+are+decided%2C+and+the+guilty+are+punished%2C+shall+be+valid+and+bind+the+subjects%3B+for+except+they+were+valid+and+did+bind%2C+no+man+would+obey%2C+but+only+in+show+but+every+man+would+secretly+do+the+contrary+with+a+great+inconvenience+to+the+commonwealth.+Now+the+commonwealth+may+give+this+force+to+the+sentences%2C+and+acts+of+a+tyrant%2C+because+it+is+superior+to+all+single+persons%2C+though+it+be+oppressed+with+tyranny%2C+and+may+account+the+just+sentence+of+a+tyrant+as+its+own.%E2%80%99+%28Lessius%2C+De+Justitia+%26+Jure%2C+bk.+2%2C+ch.+25%2C+Dubitat.+9%29+Thou+wilt+ask+whether+a+tyrant+do+sin+the+sin+of+murder%2C+and+be+bound+to+restitution%2C+if+he+put+to+death+guilty+persons%2C+or+deprive+them+of+their+goods+according+to+law%3F+I+answer+negatively%3B+because+the+commonwealth+does+tacitly+give+him+authority+hereunto%2C+while+it+does+consent+and+desire+that+this+should+be+done+by+him.+Thus+is+the+authority+of+acting+in+this+case+grounded+upon+a+tacit+or+implied+consent%2C+which+consent+is+the+very+dictate+of+nature+or+common+reason%2C+because+it+is+better+to+have+some+justice+than+none+at+all%2C+some+coercive+power+and+government+than+that+all+be+left+to+disorder%2C+violence+and+confusion.%E2%80%9D%0A%0A%E2%80%94+Francis+Rous%2C+The+Lawfulness+of+Obeying+the+Present+Government%2C+%E2%80%A6+%28London%2C+1649%29%2C+pp.+16-19+Rouse+was+a+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8a06baff06.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8a06baff06.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=Thirdly%2C%20it%20is%20cleared%20in%20this,left%20to%20disorder%2C%20violence%20and%20confusion&amp;text=Thirdly%2C%20it%20is%20cleared%20in%20this%20discourse%20that&amp;text=all%20be%20left%20to%20disorder%2C%20violence%20and%20confusion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

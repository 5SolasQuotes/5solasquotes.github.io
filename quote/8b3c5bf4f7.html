<main class="wrap"><figure class="quote" id="q-8b3c5bf4f7" data-kw="">
<blockquote><p>Christ alone gives us promises of eternal life in the state of sin. Yet in the state of nature, Adam might have had them by his own obedience, according to God’s pact.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R Publishing, 1992–97, 8.6.12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“Christ alone gives us promises of eternal life in the state of sin. Yet in the state of nature, Adam might have had them by his own obedience, according to God’s pact.”

— Francis Turretin, Institutes of Elenctic Theology (P&amp;R Publishing, 1992–97, 8.6.12 (HT: Jim Lincoln)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CChrist+alone+gives+us+promises+of+eternal+life+in+the+state+of+sin.+Yet+in+the+state+of+nature%2C+Adam+might+have+had+them+by+his+own+obedience%2C+according+to+God%E2%80%99s+pact.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology+%28P%26R+Publishing%2C+1992%E2%80%9397%2C+8.6.12+%28HT%3A+Jim+Lincoln%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8b3c5bf4f7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8b3c5bf4f7.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/12/turretin-adam-might-have-had-it-by-his-own-obedience/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3a095e93a3" data-kw="">
<blockquote><p>We, on the other hand, teach and comfort an afflicted sinner this way: “Brother, it is impossible for you to become so righteous in this life that your body is as clear and spotless as the sun. You still have spots and wrinkles (Eph 5:27), and yet you are holy.” But you say: “How can I be holy when I have sin and am aware of it?” “That you feel and acknowledge sin—this is good. Thank God, and do not despair. It is one step toward health when a sick man admits and confesses his disease.” “But how will I be liberated from sin?” “Run to Christ, the Physician, who heals the contrite of heart and saves sinners. Believe in Him. If you believe, you are righteous, because you attribute to God the glory of being almighty, merciful, truthful, etc. You justify and praise God. In short, you attribute divinity and everything to Him. And the sin that still remains in you is not imputed but is forgiven for the sake of Christ, in whom you believe and who is perfectly righteous in a formal sense. His righteousness is yours; your sin is His.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 233.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“We, on the other hand, teach and comfort an afflicted sinner this way: “Brother, it is impossible for you to become so righteous in this life that your body is as clear and spotless as the sun. You still have spots and wrinkles (Eph 5:27), and yet you are holy.” But you say: “How can I be holy when I have sin and am aware of it?” “That you feel and acknowledge sin—this is good. Thank God, and do not despair. It is one step toward health when a sick man admits and confesses his disease.” “But how will I be liberated from sin?” “Run to Christ, the Physician, who heals the contrite of heart and saves sinners. Believe in Him. If you believe, you are righteous, because you attribute to God the glory of being almighty, merciful, truthful, etc. You justify and praise God. In short, you attribute divinity and everything to Him. And the sin that still remains in you is not imputed but is forgiven for the sake of Christ, in whom you believe and who is perfectly righteous in a formal sense. His righteousness is yours; your sin is His.”

— Martin Luther, Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 233. (HT: Tony Phelps)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe%2C+on+the+other+hand%2C+teach+and+comfort+an+afflicted+sinner+this+way%3A+%E2%80%9CBrother%2C+it+is+impossible+for+you+to+become+so+righteous+in+this+life+that+your+body+is+as+clear+and+spotless+as+the+sun.+You+still+have+spots+and+wrinkles+%28Eph+5%3A27%29%2C+and+yet+you+are+holy.%E2%80%9D+But+you+say%3A+%E2%80%9CHow+can+I+be+holy+when+I+have+sin+and+am+aware+of+it%3F%E2%80%9D+%E2%80%9CThat+you+feel+and+acknowledge+sin%E2%80%94this+is+good.+Thank+God%2C+and+do+not+despair.+It+is+one+step+toward+health+when+a+sick+man+admits+and+confesses+his+disease.%E2%80%9D+%E2%80%9CBut+how+will+I+be+liberated+from+sin%3F%E2%80%9D+%E2%80%9CRun+to+Christ%2C+the+Physician%2C+who+heals+the+contrite+of+heart+and+saves+sinners.+Believe+in+Him.+If+you+believe%2C+you+are+righteous%2C+because+you+attribute+to+God+the+glory+of+being+almighty%2C+merciful%2C+truthful%2C+etc.+You+justify+and+praise+God.+In+short%2C+you+attribute+divinity+and+everything+to+Him.+And+the+sin+that+still+remains+in+you+is+not+imputed+but+is+forgiven+for+the+sake+of+Christ%2C+in+whom+you+believe+and+who+is+perfectly+righteous+in+a+formal+sense.+His+righteousness+is+yours%3B+your+sin+is+His.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Luther%E2%80%99s+Works%2C+Vol.+26%3A+Lectures+on+Galatians%2C+1535%2C+Chapters+1-4%2C+ed.+Jaroslav+Jan+Pelikan%2C+Hilton+C.+Oswald%2C+and+Helmut+T.+Lehmann%2C+vol.+26+%28Saint+Louis%3A+Concordia+Publishing+House%2C+1999%29%2C+233.+%28HT%3A+Tony+Phelps%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3a095e93a3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3a095e93a3.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/08/luther-christ-the-physician/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-644ed1a1be" data-kw="">
<blockquote><p>12. Cyril of Alexandria upon the Gospel of John, bk. 11, ch. 25: ‘As by the offense of the first man, as in the first fruits of our race, we have been sentenced to death; so by the obedience and righteousness of Christ, inasmuch as He subjected Himself to the Law, although He was the author of the Law, the blessing and quickening which is by the Spirit has reached to our whole nature.’ …And he extends this righteousness of Christ not to the satisfaction only, but to the fulfilling of the law: which, we must observe is opposed to the opinions of the Jesuits and others, who maintain that the passive obedience of Christ is imputed to us, not his active obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Justification: or The Disputatio de justitia habituali et actuali</cite>, …, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), ch. 29, pp. 260-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“12. Cyril of Alexandria upon the Gospel of John, bk. 11, ch. 25: ‘As by the offense of the first man, as in the first fruits of our race, we have been sentenced to death; so by the obedience and righteousness of Christ, inasmuch as He subjected Himself to the Law, although He was the author of the Law, the blessing and quickening which is by the Spirit has reached to our whole nature.’ …And he extends this righteousness of Christ not to the satisfaction only, but to the fulfilling of the law: which, we must observe is opposed to the opinions of the Jesuits and others, who maintain that the passive obedience of Christ is imputed to us, not his active obedience.”

— John Davenant, A Treatise on Justification: or The Disputatio de justitia habituali et actuali…, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), ch. 29, pp. 260-61">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C12.+Cyril+of+Alexandria+upon+the+Gospel+of+John%2C+bk.+11%2C+ch.+25%3A+%E2%80%98As+by+the+offense+of+the+first+man%2C+as+in+the+first+fruits+of+our+race%2C+we+have+been+sentenced+to+death%3B+so+by+the+obedience+and+righteousness+of+Christ%2C+inasmuch+as+He+subjected+Himself+to+the+Law%2C+although+He+was+the+author+of+the+Law%2C+the+blessing+and+quickening+which+is+by+the+Spirit+has+reached+to+our+whole+nature.%E2%80%99+%E2%80%A6And+he+extends+this+righteousness+of+Christ+not+to+the+satisfaction+only%2C+but+to+the+fulfilling+of+the+law%3A+which%2C+we+must+observe+is+opposed+to+the+opinions+of+the+Jesuits+and+others%2C+who+maintain+that+the+passive+obedience+of+Christ+is+imputed+to+us%2C+not+his+active+obedience.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+A+Treatise+on+Justification%3A+or+The+Disputatio+de+justitia+habituali+et+actuali%E2%80%A6%2C+vol.+1+trans.+Josiah+Allport+%28d.+1641%3B+London%3A+Hamilton%2C+1844%2F1846%29%2C+ch.+29%2C+pp.+260-61&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F644ed1a1be.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/644ed1a1be.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=12.%20Cyril%20of%20Alexandria%20upon%20the,to%20us%2C%20not%20his%20active%20obedience&amp;text=12.%20Cyril%20of%20Alexandria%20upon%20the%20Gospel%20of&amp;text=is%20imputed%20to%20us%2C%20not%20his%20active%20obedience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e83ff2c72e" data-kw="">
<blockquote><p>Although hypocrites and other unregenerate men may vainly deceive themselves with false hopes and carnal presumptions of being in the favor of God, and estate of salvation (which hope of theirs shall perish): yet such as truly believe in the Lord Jesus, and love him in sincerity, endeavoring to walk in all good conscience before him, may, in this life, be certainly assured that they are in the state of grace, and may rejoice in the hope of the glory of God, which hope shall never make them ashamed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 18.1</span></figcaption>

</figure><figure class="quote" id="q-84000ed0ed" data-kw="">
<blockquote><p>Although the law as a rule of duty to believers requires perfect obedience from them, yet it admits of God’s accepting their sincere obedience performed in faith, though it is imperfect. It admits of His accepting this obedience not indeed as any part of their justifying righteousness, not as the foundation of His acceptance of their persons as righteous, but as the fruit and evidence of their being vitally united to His beloved Son as Jehovah their Righteousness, and of their being already accepted in Him (Eph. 1:6; Heb. 13:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 34–35.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<main class="wrap"><figure class="quote" id="q-c4ea5640c1" data-kw="">
<blockquote><p>‘reasonable service’: Or, worship. That is, a spiritual service, so called in opposition to the carnal rites of the ceremonial law; and he calls it a ‘reasonable service’ because it consists not in the outward offering up of unreasonable beasts, as in the Old Testament: but in the offering up of ourselves, who are men endued with reason. The like exhortation we have, Heb. 13:15; 1 Pet. 2:5. Or, agreeable to the rules of true reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english-annotations.html">English Annotations</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon All the Books of the Old &amp; New Testament (London: Legatt, 1645), | on Rom. 12, verse 1</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9c0a7ab7f1" data-kw="">
<blockquote><p>And besides, all such as enjoy the means of grace, and yet have not felt this visitation of God, should be much allured to the care of attending upon the means, and be made desirous to receive the grace of God, and that effectually: it should much move them that God has now sent them the means, and keeps his public visitation; and that God stands not upon desert, nor does He make exception of them, but offers his grace unto all, and desires not the death of any sinner, yea beseeches them to be reconciled [see 2 Cor. 5:20]; and to that end has committed the Word of reconciliation to his servants, with express commandment that they should be instant, and with all patience instruct men, and call upon them, and persuade them to save their souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary Upon the Three First Chapters of the First Epistle General of St. Peter (1637)</cite>, p. 420</span></figcaption>

<blockquote><p>Thesis 4. The materials are all external and sensible things which we commonly term ceremonies. Of which kind in the Old Testament were sacrifices, sacraments, various feast days and other rites. In the New, likewise, sacraments, feast days, divinely instituted, etc.</p></blockquote>

</figure><figure class="quote" id="q-5732573c18" data-kw="">
<blockquote><p>10. The true and the lawful inward service of God is especially contained in the First Commandment, which is nothing else but the worshipping of the true God according unto the prescript of his Law. 11. The end of the First Commandement is that God among his people will bear rule ouer all, and wholly enjoy his authority. And to the end that this may come to pass, He commands all impiety, and all false opinions concerning God to be far from us: and in like sort, He enjoins Himself to be worshipped and adored of us in the true practice of godliness. 12. Furthermore, although that the duties which we owe unto God be innumerable, yet they may be not unproperly referred unto four heads: The first is the inward acknowledging, whereunto is joined as an addition, the spiritual obedience of the conscience: the second is an assured trust: the thrid is, invocation, or prayer. The fourth and last, is thanksgiving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Propositions &amp; Principles of Divinity (London: 1591), ch. 29</cite>, pp. 67-68</span></figcaption>

<blockquote><p>6. The effects of this first [divine] work are these: (1) A hearty welcoming of Christ Jesus into the soul; they do not take up with comfort on this side [of] Christ; Men’s troubles are known by their satisfaction… But if we see the necessity of a Savior, receive Him into our hearts and believe in Him with all our hearts, desire and delight and all is carried after Christ, and after the refreshings of his grace and are satisfied with none but Christ, and our hearts pant for Him, as the hart pants after the water brooks, you ought to bless God that He has left the impression of the effect, though He has not left the impression of the way; Ps. 42:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>One Hundred &amp; Ninety Sermons on the Hundred &amp; Nineteenth Psalm… (d. 1677; London: T.P., 1681), sermon 98</cite>, p. 605</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-67b703ed0b" data-kw="">
<blockquote><p>Christ makes the feast, Lk. 15:23, and the angels make the music, verse 7. But if men will not receive the tenders of grace, Christ grieves, Mk. 3:5. He is like a judge that passes the sentence with tears in his eyes, Lk. 19:42, ‘And when He came nigh the city, He wept.’ ‘Ah sinners, I come to save you, but you put away salvation from you (Acts 13). I come with healing under my wings, but you bolt out your Physician; I would have you but open your hearts to receive Me, and I will open Heaven to receive you, but you will rather stay with your sins and die, than come to Me and live, Ps. 81:11, ‘Israel would none of me.’ Well sinners, I will weep at your funerals.’ Oh how lovely is Christ in his disposition! He comes with his supplying oil to pour into sinners’ wounds; He would fain break their hearts with his mercies, He labors to overcome their evil with his good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saint’s Delight (London: T.R., 1657), “Christ’s Loveliness”</cite>, pp. 353-54</span></figcaption>

</figure><figure class="quote" id="q-c3ac55e150" data-kw="">
<blockquote><p>7th Doctrine: That Jesus Christ will not refuse to come in to the soul of the vilest sinner, when once it is made heartily willing to open to Him. ‘If any man open, I will come in to him.’ [Rev. 3:20] It is not unworthiness, but unwillingness that bars any man from Christ: thousands have missed of Christ by their unwillingness, but Christ never put off one soul upon account of its unworthiness; Christ is not the sale, but the gift of God; you come not to make a bargain, but to receive a free gift: Faith is a marriage with Christ, wherein nothing but your hearty consent is expected; so runs the strain of the whole Scriptures, Isa. 55:1, ‘Ho, every one that thirsteth, come ye to the waters…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>England’s Duty under the Present Gospel Liberty from Rev. 3, verse 20: wherein is opened the admirable condescension and patience of Christ in waiting upon trifling and obstinate sinners… (London: Wotton, 1689), sermon 7, doctrine 7</cite>, p. 231</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

 Books Online</a></div>
</figure><figure class="quote" id="q-819f2324f3" data-kw="">
<blockquote><p>Lastly, justifying faith is such a faith whereby we embrace, entertain, receive, admit Christ, not into our houses, but into our hearts; and whereby conseqently we are united unto Christ, so as that He is said to be in us, and we in Him. ‘To as many as received Him,’ says He, ‘He gave this priviledge to become the sons of God, even to those that beleive in his name.’ Where to ‘receive Him,’ is to give Him entertainment, not so much in their houses, which Matthew, Zacheus, and others of them also did, as in their hearts: according to that of the apostle, ‘that Christ may dwell in your hearts by faith,’ Eph. 3:17. Whence it is that they that are in the faith, are said to have Christ in them. ‘Examine yourselves,’ says the apostle, ‘whether ye be in the Faith: do you not know that Christ is in you?’ 2 Cor. 13:5, thereby implying that if they be in the faith, then Christ is in them… we cannot with any good ground rely on Him or trust Him for the discharge of us from the guilt of our sins, unless we be content to receive, and do willingly embrace Him, on such terms as God offers Him, and as He offers Himself unto us, and on no other terms than these is He offered unto any. But a man may believe that Christ is the Savior of the world, yea that he cannot be saved but by Christ, and yet for all that may refuse to receive Him and yield himself up unto Him, because he mislikes the conditions on which He is tendered unto Him, or delay to do it at present, in hope that he may timely enough do it hereafter. As when a company of rebels are up in arms against their leige lord, and a proclamation of pardon and impunity is published by him unto all such of them as will lay down their arms, put themselves upon his mercy, acknowledge their offence and by solemn oath engage themselves to due allegiance and constant obedience for the future; albeit that they all know him to be their lawful sovereign, and believe that he will be as good as his word to all that so accept of it, nor know which way to escape, but that first or last they shal be surprised, if they do stand out, and have execution done upon them; yet there may be diverse among them that will choose rather to persist in their rebellious courses, or refuse at least to yield themselves up to him and to accept of his gracious offer, either out of a stoutness of stomach and a stifness of self-will, or out of an extreme malice and inveterate hatred against the person of their prince, or out of a strong affection to some adverse party, or out of a fond conceit that they may keep for some good space of time out of the way, undiscovered and unsurprised, or that when they perceive themselves near to be attached, they may then by a tender of themselves attain the benefit of the offer, there being no limitation of time mentioned in it. In the same manner: although a man do beleive that Jesus is the Savior of mankind, and that there is no way for him to attain salvation but by Christ, yet for all that may he refuse to receive Christ for his Lord and Savior or to accept of salvation by Christ, because he mislikes the conditions upon and under which Christ and salvation by Christ is offered and tendred unto him, and without which it cannot be had. But what are those terms, that are so necessarily reqired, and with so much difficulty received? Why these are: ‘If any man will come after me, says our Savior, [Greek], let him utterly deny himself,’ Mt. 16:24… he must not be his own man anymore, but he must in resolution at least be Christ’s alone, wholly at his command, will and disposal… This word or saying, that Christ came to save sinners, it is a sure saying, such as we may write and rest upon it, we may with good ground afford credit unto it, yea and it is withal a very acceptable saying, a saying worthy of all acceptance, 1 Tim. 1:15, and indeed who would not accept of such a gracious offer? would not willingly and gladly entertain such tidings, the glad tidings of salvation, and of salvation not temporal, but eternal? See Isa. 52:7; Nah. 1:15; Rom. 10:15, yea but what is the reason then that this so acceptable message finds so little acceptance in the world, that so few do accept of it? that when this Savior came unto his own, He found so sorry welcome among them, his own refused to receive Him? Jn. 1:11. It is not in the thing offered; that no damned wretch in Hell would refuse to accept; but it is in the terms whereupon the offer is made and tendred, which mans corrupt nature will in no wise condescend unto… The stoutness, or hautiness of the flesh, of man’s carnal heart or mind (and there is an emphasis also in the word ‘flesh’, which of itself has an intimation of infirmity and weakness, Gen. 6:3; Heb. 5:7, yea sometime of a pliable and yeilding disposition, apt to receive any but slight impression, Eze. 36:26; 2 Cor. 3:3, that such a sorry peice of flesh as man’s heart is, should be so stiff, and so stubborn) is enmity against God; not averse to him, but enmity itself against him; stands out in such defiance against Him, and whatsoever He wills and enjoins, that it neither does submit itself, nor can be subjected unto his law…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote Against Error Concerning Justification… (d.1654; London: Brome, 1670)</cite>, pp. 50-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

nity+is+published+by+him+unto+all+such+of+them+as+will+lay+down+their+arms%2C+put+themselves+upon+his+mercy%2C+acknowledge+their+offence+and+by+solemn+oath+engage+themselves+to+due+allegiance+and+constant+obedience+for+the+future%3B+albeit+that+they+all+know+him+to+be+their+lawful+sovereign%2C+and+believe+that+he+will+be+as+good+as+his+word+to+all+that+so+accept+of+it%2C+nor+know+which+way+to+escape%2C+but+that+first+or+last+they+shal+be+surprised%2C+if+they+do+stand+out%2C+and+have+execution+done+upon+them%3B+yet+there+may+be+diverse+among+them+that+will+choose+rather+to+persist+in+their+rebellious+courses%2C+or+refuse+at+least+to+yield+themselves+up+to+him+and+to+accept+of+his+gracious+offer%2C+either+out+of+a+stoutness+of+stomach+and+a+stifness+of+self-will%2C+or+out+of+an+extreme+malice+and+inveterate+hatred+against+the+person+of+their+prince%2C+or+out+of+a+strong+affection+to+some+adverse+party%2C+or+out+of+a+fond+conceit+that+they+may+keep+for+some+good+space+of+time+out+of+the+way%2C+undiscovered+and+unsurprised%2C+or+that+when+they+perceive+themselves+near+to+be+attached%2C+they+may+then+by+a+tender+of+themselves+attain+the+benefit+of+the+offer%2C+there+being+no+limitation+of+time+mentioned+in+it.+In+the+same+manner%3A+although+a+man+do+beleive+that+Jesus+is+the+Savior+of+mankind%2C+and+that+there+is+no+way+for+him+to+attain+salvation+but+by+Christ%2C+yet+for+all+that+may+he+refuse+to+receive+Christ+for+his+Lord+and+Savior+or+to+accept+of+salvation+by+Christ%2C+because+he+mislikes+the+conditions+upon+and+under+which+Christ+and+salvation+by+Christ+is+offered+and+tendred+unto+him%2C+and+without+which+it+cannot+be+had.+But+what+are+those+terms%2C+that+are+so+necessarily+reqired%2C+and+with+so+much+difficulty+received%3F+Why+these+are%3A+%E2%80%98If+any+man+will+come+after+me%2C+says+our+Savior%2C+%5BGreek%5D%2C+let+him+utterly+deny+himself%2C%E2%80%99+Mt.+16%3A24%E2%80%A6+he+must+not+be+his+own+man+anymore%2C+but+he+must+in+resolution+at+least+be+Christ%E2%80%99s+alone%2C+wholly+at+his+command%2C+will+and+disposal%E2%80%A6+This+word+or+saying%2C+that+Christ+came+to+save+sinners%2C+it+is+a+sure+saying%2C+such+as+we+may+write+and+rest+upon+it%2C+we+may+with+good+ground+afford+credit+unto+it%2C+yea+and+it+is+withal+a+very+acceptable+saying%2C+a+saying+worthy+of+all+acceptance%2C+1+Tim.+1%3A15%2C+and+indeed+who+would+not+accept+of+such+a+gracious+offer%3F+would+not+willingly+and+gladly+entertain+such+tidings%2C+the+glad+tidings+of+salvation%2C+and+of+salvation+not+temporal%2C+but+eternal%3F+See+Isa.+52%3A7%3B+Nah.+1%3A15%3B+Rom.+10%3A15%2C+yea+but+what+is+the+reason+then+that+this+so+acceptable+message+finds+so+little+acceptance+in+the+world%2C+that+so+few+do+accept+of+it%3F+that+when+this+Savior+came+unto+his+own%2C+He+found+so+sorry+welcome+among+them%2C+his+own+refused+to+receive+Him%3F+Jn.+1%3A11.+It+is+not+in+the+thing+offered%3B+that+no+damned+wretch+in+Hell+would+refuse+to+accept%3B+but+it+is+in+the+terms+whereupon+the+offer+is+made+and+tendred%2C+which+mans+corrupt+nature+will+in+no+wise+condescend+unto%E2%80%A6+The+stoutness%2C+or+hautiness+of+the+flesh%2C+of+man%E2%80%99s+carnal+heart+or+mind+%28and+there+is+an+emphasis+also+in+the+word+%E2%80%98flesh%E2%80%99%2C+which+of+itself+has+an+intimation+of+infirmity+and+weakness%2C+Gen.+6%3A3%3B+Heb.+5%3A7%2C+yea+sometime+of+a+pliable+and+yeilding+disposition%2C+apt+to+receive+any+but+slight+impression%2C+Eze.+36%3A26%3B+2+Cor.+3%3A3%2C+that+such+a+sorry+peice+of+flesh+as+man%E2%80%99s+heart+is%2C+should+be+so+stiff%2C+and+so+stubborn%29+is+enmity+against+God%3B+not+averse+to+him%2C+but+enmity+itself+against+him%3B+stands+out+in+such+defiance+against+Him%2C+and+whatsoever+He+wills+and+enjoins%2C+that+it+neither+does+submit+itself%2C+nor+can+be+subjected+unto+his+law%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Thomas+Gataker%2C+An+Antidote+Against+Error+Concerning+Justification%E2%80%A6+%28d.1654%3B+London%3A+Brome%2C+1670%29%2C+pp.+50-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2 <blockquote><p>The second thing I shall say to persuade your heart to take Christ, freely promised and offered onto you, shall be this— will ye consider that there is willingness in the heart of Christ to take you. I shall give you these six things that speak out Christ’s willingness to receive you: 1st, Does He not command you to come and receive Him?… 2dly, He does regret and deeply resent it that they will not come. I think Christ never wept so bitterly as on that day when He wept over Jerusalem, that they would not embrace Him. Luke 19:42— If thou hadst known, even thou, at least, in this thy day, the things that belong unto thy peace; and John 5:40, Ye will not come unto Me that ye may have life. O what think ye can be the rise of this, that Christ should sorrow, because ye will not give up your hearts unto Him? Does He increase his gain when ye give Him your hearts? No, certainly; but He cannot endure the madness in you that ye should forsake your only gain. 3dly, Would you do Christ a joyful turn and make his heart glad?—embrace Him: this is clear, Luke 15:5, that when He finds the sheep that is going astray, He returns rejoicing. 4thly, I shall say more unto you—would ye make all the persons of the blessed Trinity to rejoice? Would ye make all the angels of heaven to sing? Would ye make all the saints that are round about the throne to exult for joy? Then give your hearts up to Christ and close with Him in the covenant of promise, according to that word, Cant. 6, last verse, ‘Return, return, O Shunamite. Return, return, that we may look upon thee.’ Four times that command is repeated, ‘return:’ and the great argument with which He backs it is, that all the persons of the Trinity may rejoice, ‘that we may look upon thee.’ 5thly, Consider how He has condescended to give Himself at a very low rate… Yea, 6thly, does not this speak an admirable willingness to have you? He is to give you that look… Lastly, That speaks Christ’s willingness to receive and take you, that He does not take the first refusal. O Christians that are now in Christ! if Christ had taken a hundred refusals from you, ye should never have been in heaven; but He waits for an answer, and does not take us at our first word; according to that word, Song 5:2, ‘I am wet (says He) with the drops of the morning, and my locks with the dew of the night.’ He was long knocking at her heart, and staid a long time there patiently, suffering all the injuries He could meet with. And I would only pose you:—Think ye that if one of the richest of you were suiting a very poor woman, and she refused you so many times, would your proud heart submit to take her? And yet how oftentimes has the precious heart of Christ submitted to so many affronts and refusals that we have given Him? I think, if it were possible, Christians would wink when first they behold Christ upon the day of their espousals.</p></blockquote>

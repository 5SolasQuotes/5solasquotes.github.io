<blockquote><p>So that I cannot but call upon, and encourage all much, that tender their own weal, to fall on with more boldness and eagerness, upon the reading of the holy Scriptures, seeing now it is so infallibly proved by this man of a thousand, that it is the very Word of God that’s reached to them in that Translation, that they have before them in the tongue, wherein they were born. We of this Nation have great cause to bless God, for that learned Prince [King James I], that caused our last and best Translation: which hath gained an high Testimony, from a learned Writer of a foreign Country: when he calls it the most accurate Translation of the English.

Honour we then the reading of the Word of God, 1. In the public Congregation, Deut. 31. 11. Ezra 8. 2, 3. Act. 15. 21. that is attended with the greatest blessing, Ezra 8. 14, 16. Nehem. 13. 1, 3. 2. In our private houses, 2 Reg. 22. 10. Jer. 36. 12. 15, 16. 3. In our proper Closets, or where we can have our opportunities. See Acts 8. 30. Apoc. 1. 3.

Read so as we read all, Josh. 8. 34, 35. though it be never so difficult, ’tis given by inspiration, and ’tis profitable. The very Craggs and Rocks have their physical he bs. We are fed by the clear, and tried by the obscure. There’s an immanent, whereas not a transient power to edify. Something is a going when we little think it: If it be but to humble us, that we cannot see the reason of the setting those hard names together; The wisdom of God is there, though man cannot fathom it; Besides, it keeps our hearts in order; and gives us cause of thanks, when we meet with other things that be more facile, in things that be most essential. And read in order; young Beginners, may take the New Testament first, (as being the easier,) and the Old after it. The Books be writ in Order, (Luke 1. 3.) Let them be read in Order. Work goes on best, when men take it as ’tis before them. He that reads confusedly, will come to little.

He that takes the Bible as it lies, will get most good by it. See Neh. 8. 13, 14. Reade every day, Josh. 1. 8. all the days of our lives, Deut. 17. 19. Psal. 119. 96. Alphonsus King of Arragon, read the Bible over fourteen times, with some Comments upon it. Read in thine own book; the King was to write him out a Copy of the Law for his own peculiar use, Deut. 17. 18. Theodesius the second had writ out the New Testament with his own hand. Men shoot best in their own Bows: work best with their own Tools. David did best with his own Scrip, and Sling.

The side of the leaf is remembered, when the chapter and verse cannot be thought on. Reade with the greatest reverence, for it is the Word of God, See, Neh. 8. 3. 5, 6. with the best understanding, Mat. 24. 15. with sincerest affection; bringing our selves to the Bible, not the Bible to us. A Veil is upon them, that comes with prejudice, 2 Cor. 3. 14. and read with hearty prayer unto God, that he will open our eyes, Psal. 119. 18. and sanctify our hearts, Psal. 119. 36. and order our steps, Psal. 119. 133. It will be else as a book sealed up to us. See Isa. 29. 11, 12.

The result of all is this. We must so read, and so hear besides, that there may be both an holy faith, and an holy life too. Nor this alone, not that by its own self: What God hath set together, let not us put asunder. ‘Twill but little avail a man to be sound in his opinion, if he be loose in his conversation; without holiness there is no seeing God, Heb. 12. 14. Nor will strictness of Life be much advantageous, where there be rotten principles. He was utterly unclean (in the Law) that had the Leprosy in his head: and (under the Gospel) men of corrupt minds, have but a sad character for all their form of godliness. See 2 Tim. 3. 5, 8, 13.

Swenckfeldius was a man of plausible behaviour; and so was Rotman too, for a while. ‘Tis no mean stroke to be given over to strong delusion. 2 Thes. 2. 11, 12. Nor was it a light thing, which they received as a recompense of their error, and yet it was but meet too, Rom. 1. 27. See then, that our faith be most holy, Jude 20. and that our lives be according 2 Pet. 3. 12. in all holy conversations and godliness: How shall we hold up our faces, before God, before men, in all cases, conditions; and appear without spot in the day of Christ Jesus?

Give attendance to reading. ‘Tis too little thought on, even of some well-minded people. The Bible is the Book of Books; a full Store-house. There be Rules for all sorts of persons, young and old, Tit. 2. 2, 3. rich and poor; in all manner of conditions, prosperous and adverse; in all cases, whatsoever we shall be put upon; The exactest Rules too, to keep a man so far from usury, that he shall not be as an usurer, Exod. 22. 25. And those that will be for his greatest glory too, Deut. 4. 6, 7, 8. even in the eyes of common men.

Here we shall meet with that that will enlighten our eyes, Psal. 119. 130. Dan. 9. 2. humble our hearts, Deut. 17. 20. kill our sins, Psal. 119. 9. enable us against Satan, and all his temptations, 1 John 2. 14. Matth. 4. 4, 7, 10. strengthen our faith, Rom. 10. 8. Though we have much ado to believe what we read sometimes; yet reading will master it. Antonius Musa complained to Luther, he had much ado his own self to believe, what he preached to others; Luther was glad there was any as bad as himself, but the Word helped them, and it will help us. Here we shall have that, that will over-awe our hearts, Psal. 119. 161. that will increase our patience and our comfort, Rom. 15. 4. Here we shall have that, that will help in life, Prov. 16. 22. 23. and support in death, Luke 2. 29.

And read we shall, again and again too. If 1. We be so truly taken up with God: we shall then look upon the Scriptures as upon his love-letters, Hos. 8. 12. 2. If we so truly taste the sweet that’s there. See 1 Pet. 2. 2, 3. If we taste we shall desire. 3. If we be so much advantaged by the use of the other Ordinances. See Acts 8. 30. when he had been at Jerusalem. So Acts 17. 11. 4.

If we be so far above the world, as it doth become us. Martha was cumbered and could not hear, no more then we can read when we be so cluttered; but Mary sat down at Christ’s feet, Luke 10. 41, 42. 5. If we be so willing to order our steps, to be so exact in our doings; then we shall see to that word that’s a light and a lamp, Psal. 119. 105. See 2 Reg. 22. 16. and 23. 2, 25. 6. If our hearts be so well be sprinkled with the blood of Christ; See Heb. 9. 19. and Exod. 24. 7. 7. If we be so humbled under the sense of that body of death we have about us; See how it was with Josiah, 2 Chron. 34. 23, 30. when his heart was touched with the wickedness of the time. He read, and so shall we when we have a sense of the sin that is in us.</p></blockquote>

what+he+preached+to+others%3B+Luther+was+glad+there+was+any+as+bad+as+himself%2C+but+the+Word+helped+them%2C+and+it+will+help+us.+Here+we+shall+have+that%2C+that+will+over-awe+our+hearts%2C+Psal.+119.+161.+that+will+increase+our+patience+and+our+comfort%2C+Rom.+15.+4.+Here+we+shall+have+that%2C+that+will+help+in+life%2C+Prov.+16.+22.+23.+and+support+in+death%2C+Luke+2.+29.%0A%0AAnd+read+we+shall%2C+again+and+again+too.+If+1.+We+be+so+truly+taken+up+with+God%3A+we+shall+then+look+upon+the+Scriptures+as+upon+his+love-letters%2C+Hos.+8.+12.+2.+If+we+so+truly+taste+the+sweet+that%E2%80%99s+there.+See+1+Pet.+2.+2%2C+3.+If+we+taste+we+shall+desire.+3.+If+we+be+so+much+advantaged+by+the+use+of+the+other+Ordinances.+See+Acts+8.+30.+when+he+had+been+at+Jerusalem.+So+Acts+17.+11.+4.%0A%0AIf+we+be+so+far+above+the+world%2C+as+it+doth+become+us.+Martha+was+cumbered+and+could+not+hear%2C+no+more+then+we+can+read+when+we+be+so+cluttered%3B+but+Mary+sat+down+at+Christ%E2%80%99s+feet%2C+Luke+10.+41%2C+42.+5.+If+we+be+so+willing+to+order+our+steps%2C+to+be+so+exact+in+our+doings%3B+then+we+shall+see+to+that+word+that%E2%80%99s+a+light+and+a+lamp%2C+Psal.+119.+105.+See+2+Reg.+22.+16.+and+23.+2%2C+25.+6.+If+our+hearts+be+so+well+be+sprinkled+with+the+blood+of+Christ%3B+See+Heb.+9.+19.+and+Exod.+24.+7.+7.+If+we+be+so+humbled+under+the+sense+of+that+body+of+death+we+have+about+us%3B+See+how+it+was+with+Josiah%2C+2+Chron.+34.+23%2C+30.+when+his+heart+was+touched+with+the+wickedness+of+the+time.+He+read%2C+and+so+shall+we+when+we+have+a+sense+of+the+sin+that+is+in+us.%E2%80%9D%0A%0A%E2%80%94+Valentine+Marshall%2C+Preface+to+Richard+Capel%2C+Capel%E2%80%99s+remains+being+an+useful+appendix+to+his+excellent+Treatise+of+tentations%2C+concerning+the+translations+of+the+Holy+Scriptures%3A+left+written+with+his+own+hand.+By+that+incomparably+learned+and+judicious+divine%2C+Mr.+Richard+Capel%2C+sometimes+fellow+of+Magdalen-College+i&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9139e72487.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9139e72487.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/02/14/valentine-marshall-on-reading-scripture/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The Church of Rome makes four senses of the Scriptures, the literal, allegorical, tropological and anagogical, as in this her example: Melchizedek offered bread and wine. The literal sense is that the King of Salem with meat which he brought, refreshed the soldiers of Abraham being tired with travel. The allegorical is that the priest does offer up Christian ye Mass. The tropological is therefore something is to be given to the poor. The Anagogical is that Christ in like manner being in heaven, shall be the bread of life to the faithful. But this her device of the fourfold meaning of the Scripture must be exploded and rejected. There is one only sense, and the same is the Literal. An allegory is only a certain manner of uttering the same sense. The Anagoge and Tropology are ways whereby the sense may be applied.</p></blockquote>

</figure><figure class="quote" id="q-af55f6747f" data-kw="">
<blockquote><p>The Protestant principle of the right of private judgment does certainly not imply, as Papists commonly represent it, that men have a right to form any opinions they please, or that they are at liberty to gratify their own caprice and mere inclination in adopting their religious profession.

There is nothing whatever in the Protestant principle upon this point, which is in the least inconsistent with the maintenance of these great truths, that men are responsible to God for all the opinions they form on religious subjects, that they incur guilt by the adoption of erroneous opinions, that therefore they are bound to conduct all their inquiries into divine things under a deep sense of their being responsible, not only for the application of the right means to reach the truth, but for actually reaching a right result, and that they are bound to employ all suitable means to attain a clear and certain knowledge of the truth, with perfect impartiality, with unwearied diligence, and unshrinking perseverance.

All these positions are true in themselves, and of great practical importance. They are perfectly consistent with the Protestant principle of the right of private judgment, and they have been maintained by all true Protestants, and indeed, by all but infidel or semi-infidel rationalists. It is chiefly by insinuating, that the Protestant principle of the right of private judgment involves or produces a denial of these great truths, that Papists contrive to excite a prejudice against it, as if it were something very much akin to, or rather identical with, the infidel notion, that men are not responsible for their opinions, but may adopt any opinions upon religious subjects they please, without guilt and without danger.

Now, not only does the Protestant principle afford no countenance to the infidel one, but, on the contrary, there is no ground on which men’s responsibility for the soundness of their opinions can be so firmly based, or so clearly brought out, as in connection with the Protestant principle of the right of private judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principles of the Reformation not the cause of Sects and Heresies in J. A. Wylie (ed.), Ter-Centenary of the Scottish Reformation, as Commemorated at Edinburgh, August 1860</cite></span></figcaption>

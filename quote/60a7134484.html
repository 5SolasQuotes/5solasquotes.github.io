</figure><figure class="quote" id="q-6962706faa" data-kw="">
<blockquote><p>5. Whereas ye [David Dickson and Alexander Henderson] alledge, that if some members of this Kirk had not cared more kindly in this time of common danger than others have done, the whole body had been ere now dangerously, if not desperately, diseased. We answer that we most heartily wish, any disease of this Church, to be timeously prevented and cured. But withal we wish this to bee done without a rupture, and such a dangerous division: chiefly seeing our Church is not infected with any such errors, nor is in such dangers as may give just occasion of so fearful a division: which in itself is a sore disease, and from which in holy Scripture we are often and very earnestly dehorted. Dionysius Bishop of Alexandria, in his Epistle to Novatus, recorded by Eusebius, Histories, bk. 6, ch. 45, worthily says: ‘You ought rather to have suffered anything whatsoever for avoiding of cutting asunder the Kirk of God: and martyrdom for keeping the Kirk from schism is no less glorious than which is suffered for not committing idolatry. And in my opinion also it is greater: for in suffering martyrdom for not committing idolatry, a man suffers for one, even for his own soul; but here a man suffers martyrdom for the whole Kirk.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-aberdeen-doctors.html">Scottish Aberdeen Doctors</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Duplies of the Ministers &amp; Professors of Aberdeen to Second Answers of some Reverend Brethren, concerning the Late [National] Covenant (Aberdeen: Raban, 1638)</cite>, p. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-e76b9d6b8a" data-kw="">
<blockquote><p>Here it is particularly to be observed that this [Church] discipline exercises such a degree of severity as is always connected with a spirit of kindness… it can easily be judged thence how far to proceed and where severity ought to cease… otherwise rigor exceeds the proper bound. Hence the immoderate austerity of the ancients cannot be approved, which was both contrary to the prescription of God and was exposed to great dangers… Therefore that spiritual sword is not to be unsheathed for a trivial cause (as is the case everywhere among the Anabaptists), but all things are to be first tried and only by degrees ought we to resort to extreme measures…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes (P&amp;R), vol. 3, 18th Topic, ‘The Church’, 32nd Question, ‘Ecclesiastical Discipline and Excommunication’, section IV</cite>, p. 294</span></figcaption>

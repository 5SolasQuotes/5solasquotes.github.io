<main class="wrap"><figure class="quote" id="q-17474ea69d" data-kw="">
<blockquote><p>What evidence for the truth of the Holy Scriptures arises from this harmony of the whole? Ans. (1.) Truth is but one; error is manifold. The truth must harmonize; error cannot. And truth, as the character of the whole Scriptures, and coming from God, the infallible Source of truth, can alone account for this. (2.) All other systems and theories of doctrines and morals differ, in different ages, by increasing light, or by change of taste or fancies. If divine truth were not from God, the infallible source, it also would have varied in different ages.

(3.) The sacred writers were of very different ages of the world—under very different circumstances—and of very different natural talents, tastes, and acquirements; all which produce discord in human theories, but they produced none in the doctrines, or narratives, or morals of the Bible. (4.) Although the early ages of the world were necessarily less intelligent, of less experience, and less opportunity of enlarged and correct views, yet the first writers are fully sustained by the latter. Now, nothing but Infinite Wisdom, as the source of Bible revelation, can account for this. Therefore, the writings of the early ages were communications from God, and not the discoveries of human wisdom; and the latter also were from the same God, to sustain and approve the first writers.

(5.) The chief subject of Bible doctrine was wholly above nature’s light, and even contrary to human conception and taste, in many points, and yet all the sacred penmen agree fully, from first to last, on those points on which human minds, when left to themselves, cannot agree; and they pursued the same great ends, and maintained the same means of attaining these. Nothing can account for this but inspiration by the same Spirit of infinite and eternal wisdom.

(6.) No other book in the world was ever produced as the Bible, or produced under so many disadvantages for attaining unity, if it had been the production of man, composed piece by piece, by many different men, through a period of about 2,000 years of writers, and 4,000 of inspired communications. Nothing, therefore, but its coming from the same divine Author, can account for this. (7.) The doctrines which the sacred writers deliver have been, and are evidently against the opinions, the feelings, inclinations, propensities, and practice of mankind; and nothing but their origin from God could account for the agreement of all the divine writers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/abraham-anderson.html">Abraham Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Theology</cite>, (Philadelphia PA: Wm. S. Young, 1857), pp 45-46.</span></figcaption>

</figure><figure class="quote" id="q-565d55bcc7" data-kw="">
<blockquote><p>FAITH, as it stands described and recommended in the Bible, is a firm and assured confidence in God, founded in the belief of the testimony he has given us in the history of the Bible; where we have his true character, instructed by sensible documents, his works and ways with men; particularly in the provision he has made, and the comprehensive promise and grant he hath given, of eternal life. This is rendered credible by the perfection, the faithfulness, and power, of the promiser; but especially by the pledge he has given of his wonderful grace and love to man in Jesus Christ, who is the foundation and surety of the promise.

This security is recommended, as a good ground of confidence, by the Spirit and power of God, and all the fullness of life being lodged in his hand; and as they appear to have been lodged there for this very purpose, that he might convey the promised blessing, spirit and life to us, this finishes the assurance. Hence it is obvious, that faith, or trust and confidence in God, must begin at Jesus Christ, the fare, and the only sure, foundation on which it can stand. And where faith in Christ is, there naturally and necessarily our faith and hope in God follow upon it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-riccaltoun.html">Robert Riccaltoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Essays on Several of the Doctrines of Revelation</cite>, in The Works of the Late Reverend Mr Robert Riccaltoun, Minister of the Gospel at Hobkirk (3 vols, Edinburgh: A. Murray &amp; J. Cochran, 1771-72), 1: 170-71.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>Let’s examine whether we are a people in Covenant with God. I know special care has been taken that these Nations should not be God’s people in Covenant; Men are afraid of an Association, but it will do them no harm if God be not the bond of it, and his honour, and interest the great end of it: But this we may assure our selves, that if we send away our God we may as wisely disband our Forces, and lay up our Ships; we must be God’s vineyard if we expect his special protection. Isa. 27. 2, 3. In that day sing ye unto her, A vineyard of red wine: I the Lord do keep it; I will water it every moment; left any hurt it, I will keep it night and day: That is, I will neither slumber nor sleep.</p></blockquote>

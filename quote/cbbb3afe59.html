<main class="wrap"><figure class="quote" id="q-cbbb3afe59" data-kw="">
<blockquote><p>Now the general satisfaction of Christ, which was the first act of his priestly office, prepares the way for God’s mercy, by making the sins of all mankind pardonable, the interposition of any bar from God’s justice notwithstanding, and so puts the sons of men only in a possibility of being justified, a thing denied to the nature of fallen angels, which the Son was not pleased to assume; but the special application of this satisfaction vouchsafed by Christ unto those persons only whom his Father has given Him out of the world, which is an appendant, or appertains to the second act of his priesthood, viz. his intercession, produces this potentia in actum, that is, procures an actual discharge from God’s anger; and makes justification, which before was a part of our possibility, to be a part of our present possession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher… 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘An Answer of the Archbishop of Armagh to some Exceptions taken against his aforesaid Letter’, pp. 562-71</cite>, p. 569</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

on" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-20247a2682" data-kw="">
<blockquote><p>What language, then, could affirm more explicitly than that here employed, that the atonement of Christ is specific and limited — that it is neither universal nor indefinite, but restricted to the elect, who shall be saved from wrath through him. The sacrifice of Christ derived infinite value from the dignity of his person; it must, therefore, have been intrinsically sufficient to expiate the sins of the whole human race had it been so intended; but, in the designation of the Father, and in the intention of Christ himself, it was limited to a definite number, who shall ultimately obtain salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sebastian-rehnman.html">Sebastian Rehnman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Particular Defence of Particularism’ Journal of Reformed Theology, vol. 6, issue 1 (Jan., 2012), pp. 24-34 Ref | Abstract: “This paper defends the received account—that the Westminster Assembly maintained that all salvific actions of God are particular in intention—against a revisionist argument that it allowed that some salvific actions of God may be universal in intention.”</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-45df795f4a" data-kw="">
<blockquote><p>[Amyrauldianism] is not… an acceptable form of Calvinism, or even a tenable form of Calvinism. For one thing, it is a logically inconsistent form of Calvinism and therefore an unstable form of Calvinism… …it is impossible to contend that God intends the gift of his Son for all men alike and equally and at the same time intends that it shall not actually save all but only a select body which He Himself provides for it. The schematization of the order of decrees presented by the Amyraldians, in a word, necessarily implies a chronological relation of precedence and subsequence among the decrees, the assumption of which abolishes God, and this can be escaped only by altering the nature of the atonement. And therefore the nature of the atonement is altered by them, and Christianity is wounded at its very heart… A conditional substitution being an absurdity, because the condition is no condition to God, if you grant him even so much as the poor attribute of foreknowledge, they necessarily turn away from a substitutive atonement altogether…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/b-b-warfield.html">B. B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Plan of Salvation (USA: Simpson Publishing Company, rep. 1989)</cite>, pp. 96-97</span></figcaption>

</figure><figure class="quote" id="q-a225b91a4d" data-kw="">
<blockquote><p>For the finding out of this middle course… the former [satisfaction of Christ] was once done for all, the other [application thereof] is still in doing: the former brings with it sufficiency, abundant to discharge the whole debt; the other adds to it efficacy. The satisfaction of Christ only makes the sins of mankind fit for pardon, which without it could not well be; the injury done to God’s majesty being so great, that it could not stand with his honour to put it up without amends made. The particular application makes the sins of those to whom that mercy is vouchsafed to be actually pardoned… Hence, we infer against the first extremity, that by the virtue of this blessed oblation, God is made placable unto our nature (which He never will be unto the angelical nature offending) but not actually appeased with any, until He has received his Son, and put on the Lord Jesus. As also against the latter extremity, that all men may be truly said to have interest in the merits of Christ, as in a common, though all do not enjoy the benefit thereof, because they have no will to take it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher… 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘Of the True Intent &amp; Extent of Christ’s Death &amp; Satisfaction upon the Cross’ (1617), pp. 552-60</cite>, pp. 554-55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-bd89f9854c" data-kw="">
<blockquote><p>This proves, therefore — (1.) That Christ did not die simply to make the salvation of those for whom he died possible — i.e., to remove legal obstructions to their salvation — but that he died with the design and effect of actually securing their salvation and of endowing them gratuitously with an inalienable title to heaven. (2.) It proves, in the second place, that the vicarious sufferings of Christ must have been, in design and effect, personal and definite as to their object. Salvation must be applied to all those for whom it was purchased. Since not the possibility or opportunity for reconciliation, but actual reconciliation itself was purchased: since not only reconciliation, but a title to an eternal inheritance was purchased, it follows (a.) That “to all those for whom Christ hath purchased redemption, he doth certainly and effectually apply and communicate the same.” Conf. Faith, ch. 8 § 8. And (b.) That he who never receives the inheritance, and to whom the purchased grace is never applied, is not one of the persons for whom it was purchased.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>
<div class="actions"><button class="copy" data-copy="“This proves, therefore — (1.) That Christ did not die simply to make the salvation of those for whom he died possible — i.e., to remove legal obstructions to their salvation — but that he died with the design and effect of actually securing their salvation and of endowing them gratuitously with an inalienable title to heaven. (2.) It proves, in the second place, that the vicarious sufferings of Christ must have been, in design and effect, personal and definite as to their object. Salvation must be applied to all those for whom it was purchased. Since not the possibility or opportunity for reconciliation, but actual reconciliation itself was purchased: since not only reconciliation, but a title to an eternal inheritance was purchased, it follows (a.) That “to all those for whom Christ hath purchased redemption, he doth certainly and effectually apply and communicate the same.” Conf. Faith, ch. 8 § 8. And (b.) That he who never receives the inheritance, and to whom the purchased grace is never applied, is not one of the persons for whom it was purchased.”

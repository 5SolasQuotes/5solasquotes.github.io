<main class="wrap"><figure class="quote" id="q-fa7c31e8f3" data-kw="">
<blockquote><p>It would also seem well to observe that sensible things, from which human reason derives the source of its knowledge, retain a certain trace of likeness to God, but so imperfect that it proves altogether inadequate to manifest the substance itself of God. For effects resemble their causes according to their own mode, since like action proceeds from like agent; and yet the effect does not always reach to a perfect likeness to the agent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles, bk. 1</cite>, ch. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><figure class="quote" id="q-2744cc85f0" data-kw="">
<blockquote><p>Bullinger (1504-1575), a Swiss reformer, was the successor of Heidrich Zwingli. He was one of the most influential of the earlier reformers… He was educated in the via antiqua [old way], learning from such greats as Aquinas and Scotus. In what follows, I provide quotes from Bullinger on the following subjects: Faith, Nature, Natural Reason, Natural Theology, and Natural Law. The quotes are accompanied only by short comments to help situate them or better understand them.” – Haines ‘John Calvin’s View of Natural Theology’ Abstract: “I will, therefore, consider Calvin’s claims about man’s natural knowledge of God under five headings: (1) What Calvin means by “knowledge of God”, (2) The possibility of knowledge of God, (3) The sources of man’s knowledge of God, (4) The content of this knowledge, and (5) the what man does with this knowledge (or, the effect of this knowledge on man).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-joseph-white.html">Thomas Joseph White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wisdom in the Face of Modernity: A Study in Thomistic Natural Theology (Ave Maria, FL: Sapienta Press, 2009) 340 pp. ToC | ‘Heinrich Bullinger on Natural Reason, Theology &amp; Law’</cite></span></figcaption>

281504%2D1575%29%2C%20a%20Swiss%20reformer%2C%20was%20the%20successor&amp;text=or%2C%20the%20effect%20of%20this%20knowledge%20on%20man" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-740f6cf934" data-kw="">
<blockquote><p>But man is capable of knowing God from such creatures in three ways, as Denis says in The Divine Names. He knows him, first of all, through causality. For since these creatures are subject to change and decay, it is necessary to trace them back to some unchangeable and unfailing principle. In this way, it can be known that God exists. Second, he can be known by the way of excellence. For all things are not traced back to the first principle as to a proper and univocal cause, as when man produces man, but to a common and exceeding cause. From this it is known that God is above all things. Third, he can be known by the way of negation. For if God is a cause exceeding his effects, nothing in creatures can belong to him, just as a heavenly body is not properly called heavy or light or hot or cold. And in this way, we say that God is unchangeable and infinite; and we use other negative expressions to describe him. Men had such knowledge through the light of reason bestowed on them: ‘many say: O, that we might see some good! Lift up the light of your countenance upon us, O Lord’ (Ps 4:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Romans, ch. 1, bk. 6, sect. 115</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><figure class="quote" id="q-b89b78d223" data-kw="">
<blockquote><p>The Law of Nature cannot direct us unto a supernatural end, as is acknowledged not only by our divines (Junius, De Politia Mosaica, ch. 1; Paraeus, Commentary on Rom. 1:19), but by Aquinas also (1a, 2a, q. 91, article 4). It only teaches us to seek and to do bonum, velut finem naturae, ‘such a good as is an end proportioned to Nature’ (Junius). All those precepts of the Law of Nature which we have spoken of, could never lead men to a supernatural good (Junius). It is only the Divine Law, revealed from God, which informs the minds of men with such notions as are supra naturam [above nature], and which may guide them ad finem supernaturalem [to a supernatural end].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies... (1637), pt. 3, ch. 9, ‘That the Lawfulness of the Ceremonies Cannot be Warranted by the Law of Nature’</cite>, p. 200</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

<blockquote><p>Although a native-born Scot, John Cameron (1579-1625) was a noted theologian among the French Huguenots. The English Puritan, Samuel Bolton published Cameron’s Certain Theses on covenant theology as an appendix to his famous book The True Bounds of Christian Freedom:

I Thesis

Covenant in Scripture, doth sometimes signify the absolute Promise of God without any restipulation; as what that Covenant which God made with Noah presently after the Flood, freely promising never to destroy the world again by water; of this kind is that Covenant, in which God promiseth to give unto his Elect, faith and perseverance: to which promise there cannot be conceived any condition to be annexed, which is not comprehended in the promise it self.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Theses, or, Positions Concerning the Three-Fold Covenant of God with Man</cite>, in Samuel Bolton, The True Bounds of Christian Freedom (London, 1656), p. 353.</span></figcaption>

<blockquote><p>[The Gospel] serves, likewise, the highly important purpose of discovering to sinners their warrant to trust in Christ Jesus for complete salvation. In the blessed gospel, Christ, and God in Christ, are freely offered to sinful men, and men are graciously invited as sinners to receive the offer and to entrust the whole affair of their salvation to Christ and to God in Him (Isa. 55:1–4; John 6:32). By the gospel, they are informed that the Lord Jesus offers Himself with all the inestimable blessings of the everlasting covenant to them and that He graciously invites and urges them as sinners to accept Him as their all-sufficient Savior “and to place the confidence of their hearts in Him for salvation from sin and wrath. Were they to not know that a divine warrant is thereby afforded them to receive and trust in the Savior for their salvation, it would be as great presumption in any of them as it would be in a fallen angel to attempt trusting that He would save him. But by the declarations, offers, calls, and promises of the word of grace, an ample warrant is afforded them as sinners of mankind to trust in the divine Savior and so to take possession of His great salvation. And it is by the gospel, accompanied by the illuminating grace of the Holy Spirit, that their warrant is revealed, that their full right of access to the compassionate Savior is disclosed to them, and that He manifests Himself to be so near them as to be within their reach (Rom. 10:6–8). Oh, how great is the importance and utility of the gracious offers and invitations of the blessed gospel to convinced and despondent sinners! By these, under the illuminating influences of the adorable Spirit, they see that it is lawful and warrantable for them to come as sinners and to entrust, with humble and strong confidence, the eternal salvation of their souls to the Lord Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 108–9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-645ce6a9aa" data-kw="">
<blockquote><p>But the Lord is not slack, or, delays not. He checks extreme and unreasonable haste by another reason, that is, that the Lord defers his coming that he might invite all mankind to repentance. For our minds are always prurient, and a doubt often creeps in, why he does not come sooner. But when we hear that the Lord, in delaying, shews a concern for our salvation, and that he defers the time because he has a care for us, there is no reason why we should any longer complain of tardiness. He is tardy who allows an occasion to pass by through slothfulness: there is nothing like this in God, who in the best manner regulates time to promote our salvation. And as to the duration of the whole world, we must think exactly the same as of the life of every individual; for God by prolonging time to each, sustains him that he may repent. In the like manner he does not hasten the end of the world, in order to give to all time to repent.

This is a very necessary admonition, so that we may learn to employ time aright, as we shall otherwise suffer a just punishment for our idleness.

Not willing that any should perish. So wonderful is his love towards mankind, that he would have them all to be saved, and is of his own self prepared to bestow salvation on the lost. But the order is to be noticed, that God is ready to receive all to repentance, so that none may perish; for in these words the way and manner of obtaining salvation is pointed out. Every one of us, therefore, who is desirous of salvation, must learn to enter in by this way.

But it may be asked, If God wishes none to perish, why is it that so many do perish? To this my answer is, that no mention is here made of the hidden purpose of God, according to which the reprobate are doomed to their own ruin, but only of his will as made known to us in the gospel. For God there stretches forth his hand without a difference to all, but lays hold only of those, to lead them to himself, whom he has chosen before the foundation of the world.

But as the verb χωρὢσαι is often taken passively by the Greeks, no less suitable to this passage is the verb which I have put in the margin, that God would have all, who had been before wandering and scattered, to be gathered or come together to repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the catholic epistles</cite>, trans. and ed. John Owen (1551; n.p., 1855) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, 419-20.</span></figcaption>

<blockquote><p>I answer that, The will is a rational appetite. Now every appetite is only of something good. The reason of this is that the appetite is nothing else than an inclination of a person desirous of a thing towards that thing. Now every inclination is to something like and suitable to the thing inclined. Since, therefore, everything, inasmuch as it is being and substance, is a good, it must needs be that every inclination is to something good. And hence it is that the Philosopher says (Ethic. i, 1) that the good is that which all desire. But it must be noted that, since every inclination results from a form, the natural appetite results from a form existing in the nature of things: while the sensitive appetite, as also the intellective or rational appetite, which we call the will, follows from an apprehended form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 of 2 | quest. 8, art. 1, Whether the will is of good only?</span></figcaption>

<blockquote><p>Obj 4. Faith is a condition (though not of it self, yet) of salvation, &amp; that in the Elect themselves: therefore the Application of salvation seems not to be free in respect of the Elect.

Ans. A Condition, is either a Condition properly so called, (i. e. an antecedent Condition,) Or a Condition improperly so called: i. e. a consequent Condition. A Condition (properly so called) is a Law, or Observation, annexed to a business; the performance whereof lyeth upon the Covenant; and accordingly the business becometh valid, or null. Such a condition was Works in the first Covenant. If Faith were such a condition, there would soon be an end of the Covenant of grace: yea, the Covenant of grace, were indeed no Covenant of grace.

A Condition improperly (so called, or a Consequent Condition) is such a condition, whose performance by the Covenantee, is absolutely undertaken for; and irresistibly wrought by the Covenantor, and not left in suspense upon the Covenantee, to be performed by his own strength. Faith is a consequent condition, not an antecedent condition. So as this Proposition, I will give Eternal life unto the Elect, if they do believe: is aequivolent unto this, I will out of my absolute will give unto the Elect Eternal life, because I will out of my absolute will give unto the Elect to believe. The Condition of Faith depends not upon the Will of the Elect; either to be, or not to be; but upon the absolute and gracious Will of God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-588c25032e" data-kw="">
<blockquote><p>The Galatians were truly regenerated, and had received Christ into their hearts: yet their graces were so choked and quenched, that He was as it were without fashion or form: so that the apostle did as it were travail again until Christ was fashioned anew in them (Gal. 4:19). David also upon the committing of his sin was brought unto that case, that he prayed God to create in him a new spirit (Ps. 51). What, was the Spirit quite gone? No, for by and by after he prays that God would not take his Holy Spirit from him: but the graces thereof were wonderfully decayed, and therefore he desires that they might be renewed. But that none may abuse this doctrine, let us consider what punishments do follow upon the quenching of the Spirit in this sort.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Seven Godly &amp; Fruitful Sermons</cite>, … (London: Kyngston, 1614), ‘Of extinguishing the graces of the Spirit’, pp. 202-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4f4d498e05" data-kw="">
<blockquote><p>‘Alas, this business is beyond my strength, I cannot change mine own heart; though there are encouragements and helps, I know not which way to go, nor how to plead them.’ Well, but is the Spirit of God able to quicken thee, and to teach thee, and to enable thee? He stands especially engaged, ’tis his immediate work to prevail upon the heart. Go to the Spirit, and beg of Him, that He would lead thee to the Father, and to Christ, that thou mayst have fellowship with the Father and the Son. ‘Alas, I cannot go unto the Spirit, I have so long resisted Him, so often grieved Him, with what face can I go? I am unworthy of his guidance.’ Well, but Jesus Christ stands engaged; and never speak of merit that day thou speakest of Christ. Go to Christ, and beg that He would send his Spirit into thy heart. Jesus Christ is thy Kinsman, he knows how to pity thee; and the Spirit of Grace is at his dispose. Oh then go to Christ. ‘Alas, I cannot go to Christ, I have no ability to go, nor so much as a will to move towards Him. I cannot go to Christ.’ Well, but the Father is engaged to draw thee, though thou canst not go; a man may be drawn, which has no natural willingness of his own. The Father stands engaged to change the will, and absolute promises are theirs that lay claim to them (provided they do not overthrow their own claim). Go therefore and tell the Father thy case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-annesley.html">Samuel Annesley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Communion with God, in Two Sermons</cite>, … (London: Tyler, 1655), sermon 2, pp. 41-42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-d16b64007b" data-kw="">
<blockquote><p>The second way He presses it, verse 20, is, by a most instant and importunate pursuing of His offer, with a protestation of his being there, and of his making the same. This is done four ways; 1. By showing His work and posture, I stand at the door and knock. Hearts are naturally as castles shut and guarded by the Devil against Christ: When He comes with His ordinances, He does thereby, as it were, lay a siege at them, and by His word knock at the doors thereof to gain their consent; and the more pungently he presses by His ordinances, He is said to knock the more: And in this respect, Song 5:2, His voice is said to knock at the believer’s door in their sleepy condition. Here these two things are imported: 1. Christ’s continuing to deal with His Church, and to wait upon her in His ordinances, notwithstanding of her many former refusals. Thus, He is said to stand at the door: Whereby is holden forth their ingratitude to him, in keeping of Him out, and His patience that still waits on. 2. In this, by the other word, is imported His growing more instant in His dealing with them: Therefore He is said to knock. And indeed if the former sharp threatening and charge, and the sweet free offer be considered, it may well be said that now His knocks are doubled. 2. The second way He presses in this verse, is, by making His offer particular, as it were, bringing it to every man’s door, If any man hear My voice, and open the door, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, 3:20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

online.com/let-jesus-come-into-your-heart/#:~:text=The%20second%20way%20He%20presses%20it,voice%2C%20and%20open%20the%20door%2C%20etc&amp;text=The%20second%20way%20He%20presses%20it%2C%20verse%2020&amp;text=hear%20My%20voice%2C%20and%20open%20the%20door%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c3ac55e150" data-kw="">
<blockquote><p>7th Doctrine: That Jesus Christ will not refuse to come in to the soul of the vilest sinner, when once it is made heartily willing to open to Him. ‘If any man open, I will come in to him.’ [Rev. 3:20] It is not unworthiness, but unwillingness that bars any man from Christ: thousands have missed of Christ by their unwillingness, but Christ never put off one soul upon account of its unworthiness; Christ is not the sale, but the gift of God; you come not to make a bargain, but to receive a free gift: Faith is a marriage with Christ, wherein nothing but your hearty consent is expected; so runs the strain of the whole Scriptures, Isa. 55:1, ‘Ho, every one that thirsteth, come ye to the waters…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>England’s Duty under the Present Gospel Liberty from Rev. 3</cite>, verse 20: wherein is opened the admirable condescension and patience of Christ in waiting upon trifling and obstinate sinners… (London: Wotton, 1689), sermon 7, doctrine 7, p. 231</span></figcaption>

</figure><figure class="quote" id="q-e00db6e50c" data-kw="">
<blockquote><p>6. But here is sad news to such who slight this salvation and refuse Jesus Christ: great will their condemnation be: The men of Nineveh shall rise up in judgment with this generation and condemn it, because they repented at the preaching of Jonah; and behold a greater than Jonah is here. The greatness of this Savior who preaches the Gospel to you and is come to save you will aggravate your condemnation. What was Jonah to Jesus Christ?… O know you, sinners, this day, that Jesus Christ, this glorious King, and Prince of the kings of the earth, this mighty Savior is come to your doors: ‘Behold, I stand at the door and knock’: Will you not open the door, nor cry to Him to help you to open to Him, to enable you to believe in Him? What do you say, shall the Son of God stand at your doors, and you not so much as ask, ‘Who is there? Who is at my door?’ Shall Christ be kept out of your hearts, and stand at your doors, whilst sin commands the chiefest room and has absolute power over you, and rules in you? How will you be able to look this blessed Savior in the face another day? Is He come through a sea of blood to offer his love to you, and to espouse you unto Himself forever, and will not you be persuaded to break your league with the old lovers, who will at last stab you at the very heart, and betray your souls into the hands of divine wrath? Nay, they have done it already: What are your lovers but your lusts… And to deliver you from them, and from that wrath which is due to you for them (I mean, for your sins) is Christ come, and this great Savior is offered to you.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“6. But here is sad news to such who slight this salvation and refuse Jesus Christ: great will their condemnation be: The men of Nineveh shall rise up in judgment with this generation and condemn it, because they repented at the preaching of Jonah; and behold a greater than Jonah is here. The greatness of this Savior who preaches the Gospel to you and is come to save you will aggravate your condemnation. What was Jonah to Jesus Christ?… O know you, sinners, this day, that Jesus Christ, this glorious King, and Prince of the kings of the earth, this mighty Savior is come to your doors: ‘Behold, I stand at the door and knock’: Will you not open the door, nor cry to Him to help you to open to Him, to enable you to believe in Him? What do you say, shall the Son of God stand at your doors, and you not so much as ask, ‘Who is there? Who is at my door?’ Shall Christ be kept out of your hearts, and stand at your doors, whilst sin commands the chiefest room and has absolute power over you, and rules in you? How will you be able to look this blessed Savior in the face another day? Is He come through a sea of blood to offer his love to you, and to espouse you unto Himself forever, and will not you be persuaded to break your league with the old lovers, who will at last stab you at the very heart, and betray your souls into the hands of divine wrath? Nay, they have done it already: What are your lovers but your lusts… And to deliver you from them, and from that wrath which is due to you for them (I mean, for your sins) is Christ come, and this great Savior is offered to you.”

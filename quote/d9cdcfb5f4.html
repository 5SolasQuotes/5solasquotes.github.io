<main class="wrap"><figure class="quote" id="q-d9cdcfb5f4" data-kw="">
<blockquote><p>Thirdly, the Scripture intimates this difference between ministry and magistracy, that the work of the ministry and the administrations thereof are performed in the name of Jesus Christ, as Mediator and King of the Church: the work of the magistracy not so… Now let our opposites show (if they can) where they find in Scripture that the Christian magistrate is to rule in the name of Christ, to judge in the name of Christ, to make laws in the name of Christ, to make war or peace in the name of Christ, to punish evil-doers with the temporal sword in the name of Christ. Of the ministry I did show that in the name of the Lord Jesus Christ we do assemble ourselves together, Mt. 18:20, in his name do we preach, Lk. 24:47; Acts 4:17-18; 5:28,44; 9:27, in his name do we baptize, Acts 2:38, 8:16; 19:5, in his name do we excommunicate, 1 Cor. 5:5… … A minister of Christ does both preach and baptize in the name of Christ, as Mediator, that is, vice Christi [in the place of Christ], in Christ’s stead, and having authority for that effect from Christ, as Mediator; for Christ, as Mediator, gave us our comission to preach and baptize… So that to preach and baptize epi to onomati Iesou Christou (which we find both of preaching, Lk. 24:47, and of baptizing, Acts 2:38) comprehends a formal commission, power and auhority, given and derived from Christ. … The ministers of Christ do act in the name of Christ, that is, in the name, authority, room and place of Christ: We are ambassadors for Christ, and we preach in Christ’s stead, 2 Cor. 5:20. This… makes good my argument. Why did he [Mr. Hussey, an Erastian] not show us the like concerning magistracy? I suppose he would, if he could…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming (1646), bk. 2, ch. 7</cite>, pp. 109-112</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-17d7cab950" data-kw="">
<blockquote><p>Our English [partially conforming] authors below will make the case for, under necessity, material cooperation with bishops, taking the oath of canonical obedience and yielding to civil patrons in the presentation of ministers to congregations (or patronage). Note that conferring with a bishop and getting the consent and recognition of a civil officer to one’s ministry¹ are not inherently sinful actions. To give further perspective to this, and what is to come, it will be proven in the next section that Church government (albeit of divine law) is not moral law, but is secondary. ¹ Note that having the recognition and approval of the civil government, though it ought to be secondary and consequential rather than primary and immediate, is involved in the Biblical doctrine of circa sacra and of itself is a good thing. On the proper order see Fentiman, Circa Sacra, pp. 49–51. [The book written by Scottish indulged ministers, associated with John] Bairdie poses the question: “Whether it be altogether heterogeneous and incompetent, as well as it may be inconvenient, for the ruler to make civil laws and constitutions about the circumstances, order, and exercise of matters of religion, without the previous cognizance and pre-determination of the Church thereupon, and that even in the most broken and ruined state of the Church when there is no governing-Church existent that can be owned.” Balm from Gilead, pp. 76–77. The answer, at least in the abstract, must be that such an exercise of civil power, however inconvenient and defective in some cases, is not always incompetent and invalid in itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction”, “Imposed Erastianism &amp; Episcopacy” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 106</span></figcaption>

</figure><figure class="quote" id="q-e23ee680bb" data-kw="">
<blockquote><p>So may we say, can any man forbid bread and wine, that these should not receive the Lord’s Supper, which have received the Holy Ghost; and have in some degree all spiritual qualifications requisite in communicants. They have the word of promise, which is the greater; who can inhibit the sign which is the less? They are Mr. Geree his words for the baptism of infants. They are faederati, therefore they must be signati. It is Mr. Marshal’s argument upon the same subject; and mutatis mutandis applyable to our purpose. Perhaps you will say, you would willingly give believers their right, but prophane and scandalous persons will also intrude [into the Supper] who have no right: What if they do? If you have no power or authority from Christ to keep them back by yourself; If you have used the utmost of your power to erect an eldership in the congregation; if you have used your power of order to the utmost for keeping them back by exhortation, if you mourn for their intrusion, wherein are you to be blamed? Because they do wrong, will you do no right? And shall the saints be debarred their dues, because these wretches without your allowance, sieze upon what is undue, that unto which they have no right?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want of Church-Government… (London, 1650) Jeanes was an English presbyterian.</cite>, pp. 35-36</span></figcaption>

ght&amp;text=So%20may%20we%20say%2C%20can%20any%20man%20forbid&amp;text=undue%2C%20that%20unto%20which%20they%20have%20no%20right" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c1164c614a" data-kw="">
<blockquote><p>It is obvious that the Puritans, who obtained the charter of the Massachusetts Bay Company from Charles I and came to New England in 1630, were not Separatists. They, though being non-conformists, considered themselves as loyal members of the Church of England. Secession or separation from the national church, for them, was a sin of schism. Nevertheless, in less than seven years, Puritans in the mother country began to hear that their brethren in New England actually followed the ways of the Separatists. Accordingly, in 1637, a formal and written communication was made, in which Puritans in England put forward “Nine Propositions,” to which their “Reverend and beloved Brethren” in the New World replied in 1639. This early debate was compiled by Simeon Ash and William Rathband and, four years later, published with John Ball’s ‘Reply’, under the title ‘A Letter of Many Ministers in Old England’… The main purpose of these propositions was to find whether or not the New England brethren actually adopted the methods of the Separatists which they once denounced before they left England… Many ministers in Old England… were surprised at the rumor about their brethren’s sudden turn to Separatism. Particularly, they were frightened when they received a report that the above nine propositions were practiced by New Englander ‘as the only Church way, wherein the Lord is to be worshipped.’ Of course, this report seemed to be exaggerated. Thus, John Cotton, representing “the Elders of the Churches in New England,” provided an answer to this letter in which he assured them that New England Congregational churches had nothing to do with “the ways of rigid separation.”… Cotton’s above answer was sent to England in 1639 and Ball’s comments and reply were finished by 1640. For some reason, however, their works were not published until 1643.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of the New-Church Way in New-England &amp; in Old… Sent Over to the New England Ministers, 1637, as a Reply to an Answer of Theirs in Justification of the Said Positions… IA (1640 &amp; 1643 / 1644) 90 pp.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“It is obvious that the Puritans, who obtained the charter of the Massachusetts Bay Company from Charles I and came to New England in 1630, were not Separatists. They, though being non-conformists, considered themselves as loyal members of the Church of England. Secession or separation from the national church, for them, was a sin of schism. Nevertheless, in less than seven years, Puritans in the mother country began to hear that their brethren in New England actually followed the ways of the Separatists. Accordingly, in 1637, a formal and written communication was made, in which Puritans in England put forward “Nine Propositions,” to which their “Reverend and beloved Brethren” in the New World replied in 1639. This early debate was compiled by Simeon Ash and William Rathband and, four years later, published with John Ball’s ‘Reply’, under the title ‘A Letter of Many Ministers in Old England’… The main purpose of these propositions was to find whether or not the New England brethren actually adopted the methods of the Separatists which they once denounced before they left England… Many ministers in Old England… were surprised at the rumor about their brethren’s sudden turn to Separatism. Particularly, they were frightened when they received a report that the above nine propositions were practiced by New Englander ‘as the only Church way, wherein the Lord is to be worshipped.’ Of course, this report seemed to be exaggerated. Thus, John Cotton, representing “the Elders of the Churches in New England,” provided an answer to this letter in which he assured them that New England Congregational churches had nothing to do with “the ways of rigid separation.”… Cotton’s above answer was sent to England in 1639 and Ball’s comments and reply were finished by 1640. For some reason, however, their works were not published until 1643.”

— John Ball, A Trial of the New-Church Way in New-England &amp; in Old… Sent Over to the New England Ministers, 1637, as a Reply to an Answer of Theirs in Justification of the Said Positions… IA (1640 &amp; 1643 / 1644) 90 pp.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+obvious+that+the+Puritans%2C+who+obtained+the+charter+of+the+Massachusetts+Bay+Company+from+Charles+I+and+came+to+New+England+in+1630%2C+were+not+Separatists.+They%2C+though+being+non-conformists%2C+considered+themselves+as+loyal+members+of+the+Church+of+England.+Secession+or+separation+from+the+national+church%2C+for+them%2C+was+a+sin+of+schism.+Nevertheless%2C+in+less+than+seven+years%2C+Puritans+in+the+mother+country+began+to+hear+that+their+brethren+in+New+England+actually+followed+the+ways+of+the+Separatists.+Accordingly%2C+in+1637%2C+a+formal+and+written+communication+was+made%2C+in+which+Puritans+in+England+put+forward+%E2%80%9CNine+Propositions%2C%E2%80%9D+to+which+their+%E2%80%9CReverend+and+beloved+Brethren%E2%80%9D+in+the+New+World+replied+in+1639.+This+early+debate+was+compiled+by+Simeon+Ash+and+William+Rathband+and%2C+four+years+later%2C+published+with+John+Ball%E2%80%99s+%E2%80%98Reply%E2%80%99%2C+under+the+title+%E2%80%98A+Letter+of+Many+Ministers+in+Old+England%E2%80%99%E2%80%A6+The+main+purpose+of+these+propositions+was+to+find+whether+or+not+the+New+England+brethren+actually+adopted+the+methods+of+the+Separatists+which+they+once+denounced+before+they+left+England%E2%80%A6+Many+ministers+in+Old+England%E2%80%A6+were+surprised+at+the+rumor+about+their+brethren%E2%80%99s+sudden+turn+to+Separatism.+Particularly%2C+they+were+frightened+when+they+received+a+report+that+the+above+nine+propositions+were+practiced+by+New+Englander+%E2%80%98as+the+only+Church+way%2C+wherein+the+Lord+is+to+be+worshipped.%E2%80%99+Of+course%2C+this+report+seemed+to+be+exaggerated.+Thus%2C+John+Cotton%2C+representing+%E2%80%9Cthe+Elders+of+the+Churches+in+New+England%2C%E2%80%9D+provided+an+answer+to+this+letter+in+which+he+assured+them+that+New+England+Congregational+churches+had+nothing+to+do+with+%E2%80%9Cthe+ways+of+rigid+separation.%E2%80%9D%E2%80%A6+Cotton%E2%80%99s+above+answer+was+sent+to+England+in+1639+and+Ball%E2%80%99s+comments+and+reply+were+finished+by+1640.+For+some+reason%2C+however%2C+their+works+were+not+published+until+1643.%E2%80%9D%0A%0A%E2%80%94+John+Ball%2C+A+Trial+of+the+New-Church+Way+in+New-England+%26+in+Old%E2%80%A6+Sent+Over+to+the+New+England+Ministers%2C+1637%2C+as+a+Reply+to+an+Answer+of+Theirs+in+Justification+of+the+Said+Positions%E2%80%A6+IA+%281640+%26+1643+%2F+1644%29+90+pp.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc1164c614a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c1164c614a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/congregationalism-and-independency/#:~:text=It%20is%20obvious%20that%20the%20Puritans,works%20were%20not%20published%20until%201643&amp;text=It%20is%20obvious%20that%20the%20Puritans%2C%20who%20obtained&amp;text=however%2C%20their%20works%20were%20not%20published%20until%201643" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>They [Brownists] except against our ministers because they receive their ordination from bishops. To which I answer: We have our ordination from Christ by bishops and clergymen; and for this kind of ordination by bishops and presbyters we have the universal consent of the primitive Church; by St. Paul, Timothy, and Titus were ordained. And this has been the practice of all the Christian Churches of the universe until the time that Anabaptists crept into the world. But they will allege that we have been ordained by Antichristian bishops, and therefore they conclude every action done by our ministers to be Antichristian. To which I answer: Why is not the ordination that our forefathers had from Antichristian bishops as effectual as the baptism that was administered by them to our forefathers? Did ever any Reformed Church rebaptize them that were baptized by them? And why should our ministers be reordained more than rebaptized? Indeed our ministers being ordained by bishops and that by Protestant bishops, such as Cranmer, Latimer and Ridley, who were holy martyrs, who renounced all superstition; what exceptions can be taken against them? Neither can they find any shelter under that noted text, ‘neglect not the gift that is in thee by the imposition of the hands of the presbytery,’ which learned Mr. [John] Calvin expounds not of the men, but of the office, following herein Jerome, Anselm, Haimo, Lyra, referring it to the gift given him and to the bishops and presbyters, which has been the practice of the Church of England and all Christian Churches in the world until the Anabaptists. To conclude, let the Brownists confess our bishops to be but Christians, which they cannot deny, and the ordination of our ministers will be lawful by their own rules: for if the ordination of their ministers by plebeian artificers be lawful, how much more is the ordination of our ministers by bishops and learned ministers, qualified with learning and wisdom and set apart to do the same?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ephraim-pagitt.html">Ephraim Pagitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heresiography, or a Description of the Heretics &amp; Sectaries of these Latter Times (London: Wilson, 1645), ‘Of the Brownists’, 15. ‘Except against our Ordination’</cite>, p. 60</span></figcaption>

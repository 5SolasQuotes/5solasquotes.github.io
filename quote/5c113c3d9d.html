<blockquote><p>In a condition so awful, but, blessed be the God of their fathers, not absolutely exclusive of hope, Christians behold the present Jewish people; and, therefore, their bowels of compassion are moved towards them. That they possess some knowledge of Divine truth we deny not. This view of things, however, while it excites our wonder, increases our concern. We are grieved to see an unhappy people sinning against so much admitted light; and our indignation is roused, not merely against the subjects of this error and rebellion, but against the infernal deceiver, the author of delusion, the sacrilegious perverter of the truth, and of the right ways of the Lord.

At the sight of sacred truth abused, and of immortal souls deceived and led captive, our souls are set on fire; we feel the rising enmity which the original promise announces; and, while no hope is entertained for the author of evil, we wish to alarm and rescue his deluded captives, by putting energy into the truths they acknowledge, and by disjoining these truths from the uncongenial mass of error wherewith they have been loaded and contaminated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-love.html">John Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity and Modern Judaism Discriminate; or, A View of the Leading Differences of Sentiment between Christians and Jews: A Sermon, Delivered at Bury Street Meeting House, for the Instruction of the Jews in Sermons Preached on Public Occasions: With Fifteen Addresses to the People of Otaheite, a</cite></span></figcaption>

<blockquote><p>THAT a General Conversion of the Israelitish Nation, is according to the Scriptures to be expected in the latter Ages of the World, is nothing but what Christians in all Ages have believed. So the Ancients (Fathers as they are called) who lived towards the Primitive Times. So the Schoolmen in the dark Days of Popery.

So the chief Reformers in this and the last Century, all which I have elsewhere made to appear, and therefore shall not again mention the Names of those great Authors, whether ancient or modern, which have declared their Judgment, and given their Testimony to what we assert as a glorious Truth.</p></blockquote>

</figure><figure class="quote" id="q-22064021bf" data-kw="">
<blockquote><p>One of the unclean spirits like frogs, we are told, proceeded out of the mouth of the “FALSE PROPHET.” By the False Prophet of the Revelation may we not understand, Mahomet, the arch deceiver of the Eastern world, who commenced his career in the fore part of the seventh century, on the assumption of being the Great and only Prophet of God, superior to Jesus Christ himself. By the spirit like a frog, “proceeding out of his mouth,” may we not understand the great delusive system of Mahometanism, which was devised, and matured by Mahomet, until, by the power of the sword, a vast proportion of the Eastern world was brought into subjection to an established religion, in opposition to the kingdom of our Lord Jesus Christ, and which was calculated to bear down like the force of a mighty torrent, against every thing that would tend to favour Christianity.

On this hypothesis, Mahometanism with all its false pretensions, and destructive delusions which have prevailed for more than a thousand years, deluging the Eastern nations with a food of errors, may be considered as one of the spirits like frogs, which belong to the combination of the spirits of devils working miracles, and going to the kings of the earth, to gather the nations in battle at the great day of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lebbus-armstrong.html">Lebbus Armstrong</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to be a Work of Darkness, Repugnant to the Christian Religion; and Inimical to a Republican Government (4th edn, New York: J. A. Lewis, 1831), p. 18.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/jews-and-muslims.html">Jews and Muslims</a></span></div>

64021bf.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/05/01/lebbus-armstrong-on-islam/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-18fd5445ae" data-kw="">
<blockquote><p>Must so many efforts be used to force from us [French protestants] that French heart that God and birth has given us? What have we done to merit so many misfortunes and such severe punishments? We are hunted, we are drove up and down as if we were the plagues of the Republic; We are treated as the enemies of the Christian name. In places where the Jews are tolerated, they have all manner of liberty, they exercise arts and merchandise; they are physicians, they are consulted, the health and life of Christians is put into their hands: And as for us, as if we were infected, we are forbidden to approach children that come into the world, we are banished from the bars and faculties, we are removed from the king’s person, we are banished from societies, our charges are taken from us, we are forbidden the use of all means that might secure us from being famished; we are abandoned to the hatred of the people, we are deprived of that precious liberty that we had purchased by so many services; our children are taken from us, who are a part of ourselves; we are made to lead a languishing life, in lowness, in poverty, and often in dark prisons. Formerly, when declarations were made against us, they were at most contented with registering them in the rolls. They are at present fixed up, they are cried about the streets as if they were gazettes, to inspire the people with a spirit of fury against us. And they have been so successful that in the great cities of France we expect to have our throats cut, one time or another, by a popular sedition; so that we are very near the Inquisition. Can it be said that there is liberty of conscience in a kingdom where the people are banished, lose their honor, and their goods are confiscated for religion’s sake? There needs nothing more than fire; and that terrible tribunal of the Inquisition, which France has been hitherto so much afraid of, will be established there. Are we Turks, are we infidels? We believe in Jesus Christ, we believe him the eternal Son of God, we invoke him solely; and we have no idols. We have a sovereign respect for the sacred Scriptures, we believe there is a Heaven and a Hell, the maxims of our morality are of so great a purity, that they dare not contradict them. We have a respect for kings, we are good subjects, good citizens, faithful in commerce: Let us be tried according to law, and it will appear if we have been engaged in any conspiracy against the State, and if we have any ways failed in our duty. Thanks be to God, nothing can stagger our fidelity, and the stock of love we have for our prince is not to be drained: if it depended on our enemies, we should be enemies of the State we make a part of; they design to push us on to crimes, that the king may have a just occasion of ruining us; but they have hitherto missed their aim, and are like to do so still; the king may see it, whilst that they so successfully turn the effects of his goodness from us, there is not one of us but who is ready to lose his life for his sake; we are Frenchmen as well as we are Reformed Christians; we would shed to the very last drop of the blood of our veins to serve our king, and for the preserving our religion, even to death.</p></blockquote>

infidels? We believe in Jesus Christ, we believe him the eternal Son of God, we invoke him solely; and we have no idols. We have a sovereign respect for the sacred Scriptures, we believe there is a Heaven and a Hell, the maxims of our morality are of so great a purity, that they dare not contradict them. We have a respect for kings, we are good subjects, good citizens, faithful in commerce: Let us be tried according to law, and it will appear if we have been engaged in any conspiracy against the State, and if we have any ways failed in our duty. Thanks be to God, nothing can stagger our fidelity, and the stock of love we have for our prince is not to be drained: if it depended on our enemies, we should be enemies of the State we make a part of; they design to push us on to crimes, that the king may have a just occasion of ruining us; but they have hitherto missed their aim, and are like to do so still; the king may see it, whilst that they so successfully turn the effects of his goodness from us, there is not one of us but who is ready to lose his life for his sake; we are Frenchmen as well as we are Reformed Christians; we would shed to the very last drop of the blood of our veins to serve our king, and for the preserving our religion, even to death.”

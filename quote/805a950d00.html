<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, on Gal. 2, p. 43</span></figcaption>

<div class="actions"><button class="copy" data-copy="“If the Pope would concede that God alone by His grace through Christ justifies sinners, we would carry him in our arms, we would kiss his feet. But since we cannot obtain this concession, we will give in to nobody, not to all the angels in heaven, not to Peter, not to Paul, not to a hundred emperors, not to a thousand popes”

— Martin Luther, Commentary on Galatians, on Gal. 2, p. 43">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+the+Pope+would+concede+that+God+alone+by+His+grace+through+Christ+justifies+sinners%2C+we+would+carry+him+in+our+arms%2C+we+would+kiss+his+feet.+But+since+we+cannot+obtain+this+concession%2C+we+will+give+in+to+nobody%2C+not+to+all+the+angels+in+heaven%2C+not+to+Peter%2C+not+to+Paul%2C+not+to+a+hundred+emperors%2C+not+to+a+thousand+popes%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Commentary+on+Galatians%2C+on+Gal.+2%2C+p.+43&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdc860b657c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dc860b657c.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-b2dd3d4865" data-kw="">
<blockquote><p>Therefore, having been persuaded that the Pope is the Antichrist, and since truly it is clear from the words of Scripture that this be so, we must conclude that our secession from his communion is consummately necessary and that it is quite impossible that there be a reconciliation between us, if things so remain as they are.</p></blockquote>

</figure><figure class="quote" id="q-3691a951d9" data-kw="">
<blockquote><p>They usurp the divinity and office of Christ. The effect is the same as if they said, &quot;I am Christ; I am a Savior. I save myself and others.&quot; This is the impression the monks give out. The Pope is the Antichrist, because he is against Christ, because he takes liberties with the things of God, because he lords it over the temple of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, p. 94</span></figcaption>

— Martin Luther, Commentary on Galatians, p. 94">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+usurp+the+divinity+and+office+of+Christ.+The+effect+is+the+same+as+if+they+said%2C+%22I+am+Christ%3B+I+am+a+Savior.+I+save+myself+and+others.%22+This+is+the+impression+the+monks+give+out.+The+Pope+is+the+Antichrist%2C+because+he+is+against+Christ%2C+because+he+takes+liberties+with+the+things+of+God%2C+because+he+lords+it+over+the+temple+of+God.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Commentary+on+Galatians%2C+p.+94&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3691a951d9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3691a951d9.html">Permalink</a><span class="src none">No free online copy linked</span></div>

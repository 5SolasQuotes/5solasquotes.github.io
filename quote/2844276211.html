<blockquote><p>§. 8. Direction 8. Yea, ordinarily avoid much talk, or disputes, or business with angry men, as far as you can without avoiding your duty: and avoid all other occasions and temptations to the sin: A man that is in danger of a fever, must avoid that which kindles it. Come not among the infected, if you fear the plague. Stand not in the sun, if you are too hot already. Keep as far as you can from that which most provokes you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), p. 343</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f02898842e" data-kw="">
<blockquote><p>Sept, 17, 1585 Lyttis of the deacons [servants] elected. Henry Nesbet and William Nesbet, bailies, Nicoll Uddert, Dean of Guild, James Ros, Thesaurer [Treasurer], William Littill, Androw Sclater, George Smyth, Tailor [Jailor?], of the Council, and Jhonn Stevinsoun, deykin [deacon/servant?] of the weavers, remembering that since the beginning of this present pestilence they have remained within this burgh constantly, sustained the burdening of the offices laid upon them unto this hour, with the loss and death for the most part of diverse of their children, servants, and family, and not without the extreme danger of their own lives, most eminently known unto all men, the rest of their brethren of the council and deykins [deacons/servants], which were no less astricted, oblist [obliged], and sworn to assist and take care of this commonwealth, having deserted their places and forsaken their offices, contrary to their oaths and allegiance made and given, and yet continuing has not repaired to this burgh at this most necessary time, approached and appointed to convene and surrogate others in their room, whereby the whole estate of this burgh is appearing to fall in confusion; Therefore…</p></blockquote>

<blockquote><p>91. For the national synod ought to declare, and that with [the] greatest reverence, to the Magistrate the grounds of their sentence, and the reasons of their proceedings when he demands or enquires into the same, and desires to be satisfied: but if the Magistrate nevertheless do dissent, or cannot by contrary reasons (which may be brought, if he please) move the synod to alter their judgement, yet may he require and procure that the matter be again debated and canvassed in another national synod…</p></blockquote>

</figure><figure class="quote" id="q-c53cd5ae4b" data-kw="">
<blockquote><p>On his return home on the 31st he found that the mysterious and awful visitation of the cholera — which he always anticipated would, in its alarming and desolating course, visit Inverness — had broken out. The first decided cases appeared on the 21st. On the Sabbath following, the 2nd September, he improved the visitation by preaching in the forenoon from Ps. 106:29, “Thus they provoked Him to anger with their inventions; and the plague brake in among them.” In the afternoon, from Joel 2:14, “Who knoweth if He will return and repent, and leave a blessing behind Him, even a meat offering and a drink offering unto the Lord your God” — subjects peculiarly appropriate. On the first appearance of this awful disease, and during its progress, the feelings excited in the minds of the inhabitants, and depicted in their countenances, none could adequately describe but those who were eye-witnesses. The common sympathies of our nature with those in affliction, and the ties and tender affections of friendship seemed, in some cases, to be totally cut asunder, — all seemed to be absorbed with their own individual cases. Several families fled to the country. Though rather timid and sensitive as to visiting the sick, in cases of contagious fevers, he deemed it his duty to remain at his post, publicly and privately exhorting his people to improve the visitation. Prayer meetings were frequent in various quarters of the town, each night, in places and by persons of whom it could not be said that ” prayers were wont to be made.” He united with them, entering in some measure into the spirit as well as unto the letter of the noble and patriotic resolution of Nehemiah, “should such a man as I flee?” as will be seen in the following extract of a letter which communicated to the writer [the biographer] his unlooked-for and much-lamented death [after attending Lord’s Day worship and the Tuesday evening prayer meeting]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-findlater.html">Robert Findlater</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoir of the Rev. Robert Findlater</cite>, ... (Glasgow ), p. 307. Findlater was a Church of Scotland minister in Inverness.</span></figcaption>

<blockquote><p>[G]amblers not only work their undoing, they also drag to ruin multitudes of others over whom they have influence, or with whom they are connected. How many families have been thus destroyed! How many parents and wives have, by their children and husbands becoming gamblers had all their fond hopes blighted, and been brought with shame and sorrow to the grave! How many children, that might have been respectable, and lived in comfort in the world, have inherited from their parents, ruined by gambling, a name of infamy, and an inheritance of poverty and wretchedness!

Gamblers that have tempted and ruined others, or that have inflicted such injuries upon those tender relations, that naturally looked to them for protection, support, and comfort, should be regarded as less men than demons in human shape; and only the retributions of the judgment-seat, and of a lost eternity, can adequately declare the magnitude of their crimes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Races: The Evils Connected with Horse-Racing and the Steeple-Chase and their Demoralizing Effects</cite>, (1853) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D, Knockbracken (4 vols, Edinburgh: Andrew Elliot, 1876), 4: 382.</span></figcaption>

<blockquote><p>O Cyaraxe, tò te genos Epainô, kai tén paida, kai dôra; boulomai de, ephê sun tê toû patros gnómê, kai tes metros tanta sunainesai,” (Xenoph., Cyrop., book 8) which is englished in this manner: “Uncle Cyaraxis, I commend the stock and the maid, and the portion; howbeit” (saith he) “by the counsel of my father and mother I will assent unto you:” as if he had said, without their advice I can do nothing. All histories, philosophers and poets in a manner, are full of the practice of this duty (Terent in phormion). And no marvel, for this is agreeable to the common principle in nature, “Whatsoeuer ye would that other men should do unto you, do ye even so to them,” Mt. 7:12. Sampson saw a maid in Timnah that liked him well, notwithstanding he spake not one word to her, but came back to his parents, and desired them to make the marriage for him. They were the first whom he acquainted with his purpose: not as in our days, wherein commonly the parents are the last. Judg. 14:2, “Get her to me, for she pleaseth me well.</p></blockquote>

<blockquote><p>Now there are two sorts of men especially, who may help, and who ought to help to swallow up and suppress the present flood of heresies and blasphemies.

1. You (Right Honourable!) and the rest who are Christian Magistrates. It was but the scornful speech of Tiberius, that the gods alone must remedy the injuries offered unto them: O no! you are custodes utriusque tabulae: you are designed to be Nursing Fathers: you have received the sword to be a terror to the devil. Pious and learned Amesius [William Ames], speaking to that question, Whether Heretiques are to be punished by the Civil Magistrate? Answers thus, Magistratus locus &amp; officiū postulat ut reprimat improbos turbatores gladio, vel potestate publica &amp; externa si opus fuerit: [“The position and duty of the magistrate demands that he repress shameless disturbers with the sword, or by public external power if there is need.”]

It is his place and duty to repress them, and restrain them, if they be noxious and turbulent: yea, and he adds more then every one will be patient to hear: namely, that if also they be manifestly blasphemous and pertinacious, they may be cut off supplicio capitali: according to that in Levit. 24. 15, 16. But I will not fall upon the discussion of that at this time: all that I would humbly suggest unto you, is this, That you may help against this dangerous flood 9. ways.

1. By a peremptory abhorring, and crushing of that flood-begetting maxim, viz. a Catholic liberty and toleration of all opinions: There was a Religion (as one once spake before you) omnium Deorum, of all God’s amongst the old Romans: and there is a Religion omnium Sanctorū, of all Saints now amongst the Papists: and if the Serpent could but wriggle in a Religion omnium opinionum, of all opinions amongst the English, he needs to desire no more: If men can step from one Religion to all, they will soon fall from all Religion to none.

2. By a public declaration against all heresies and blasphemies, known to be spoken and printed; When Ostorodius and Vaidovius started out their Socinian Heterodoxies in the Low-Countries, the States General packed away those seducers with exile, and publicly condemned and committed their pestiferous books to the fire.

3. By making some standing Laws against such opinions, which can be proved to be heretical and blasphemous; Serviunt reges terrae Christo (saith one) etiam leges ferendo pro Christo.

4. By setting up your Church-Discipline with full power, that so it may reach these heresies and blasphemies, which (if any sins) then they do plainly fall within the Verge of it: If the discipline were fully and generally established, you should not have an heresy or blasphemy, or any erroneous opinion creeping out in any part of the Kingdom, but there would be a timely discovery of it, and likewise a spiritual remedy to recovering persons, and to prevent their further spreading.

5. By encouraging and heartening the godly, orthodox painful Ministers of the Gospel, in their assertings and vindicatings of the truths of Christ: and in their oppugning of wicked, dangerous and damnable opinions: Not suffering (therefore) to be snubbed, abused, reviled, scorned, slandered, disturbed, hazarded, because they do oppose the adversaries of truth, and those Serpents which do cast out floods amongst us: why should the Shepherd be discouraged, because he keeps off Wolves from the sheep? or any man bee checked, because he would quench the flying fire?

6. By using your prudent Authority, in a timely causing to be sent forth faithful and able Ministers, such as are thoroughly tried, and well approved to be sound in the faith, and skilful to convince gain-sayers and seducers; The more you help truth, and the servants of truth, the more help do you therein contribute against errors, and the enemies of truth: No better help against darkness, then light.

7. By a tender and watchful eye unto the Universities, one of which is lately fallen into your possession: take care it may not fall into the possession of any seducers: you have heard (I doubt not) of a late Disputation in Oxford; where some body undertook to maintain (besides in private) divers strange and dangerous opinions in public; I humbly entreat you to take care, that the Serpent gets not in his body, before there be any planted to bruise his head: Truth by right is the first-born, and should first inherit: do not put the truth to play an after game with error; Other Garrisons, if lost, may easily be reduced: but that which is surprised fast by error, is not so easily recovered.

8. By enjoining a solemn day of Humiliation through all the Land, for the dishonours redounding to God, and Christ, and the Truth, by the present errors, heresies, blasphemies; You did so lately for the floods of rain which endangered the Corn: O that it might seem good unto you so to do, for the flood of errors which endanger souls! This humble request I presume to leave with your pious zeal and prudence.

9. By using your Coercive power with such methods and proportions [sic] the real safety of truth and souls doth require, and the repression of dangerous errors doth need: So managing the distributions thereof, that under the notion of restraining heresy, you by no means injure real sanctity, nor yet under the pretence of sanctity, you do not favour the growth of heresy: O what an happy people are they, amongst whom errors are losing, and truths are graining! where piety thrives, and wickedness blasts! where all who are good can join against all that is evil, and in lesser things, whereas yet they cannot (through weakness) clasp opinions; yet (for the truth and peace’s sake) can clasp hearts and hands to promote God’s glory, and the common salvation of souls!</p></blockquote>

— Obadiah Sedgwick, The nature and danger of heresies: opened in a sermon before the Honourable House of Commons, January 27. 1646. at Margaret’s Westminster, being the day of their solemn monthly fast, (London: Samuel Gellibrand, 1647), pp 36-40.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+there+are+two+sorts+of+men+especially%2C+who+may+help%2C+and+who+ought+to+help+to+swallow+up+and+suppress+the+present+flood+of+heresies+and+blasphemies.%0A%0A1.+You+%28Right+Honourable%21%29+and+the+rest+who+are+Christian+Magistrates.+It+was+but+the+scornful+speech+of+Tiberius%2C+that+the+gods+alone+must+remedy+the+injuries+offered+unto+them%3A+O+no%21+you+are+custodes+utriusque+tabulae%3A+you+are+designed+to+be+Nursing+Fathers%3A+you+have+received+the+sword+to+be+a+terror+to+the+devil.+Pious+and+learned+Amesius+%5BWilliam+Ames%5D%2C+speaking+to+that+question%2C+Whether+Heretiques+are+to+be+punished+by+the+Civil+Magistrate%3F+Answers+thus%2C+Magistratus+locus+%26+officiu%CC%84+postulat+ut+reprimat+improbos+turbatores+gladio%2C+vel+potestate+publica+%26+externa+si+opus+fuerit%3A+%5B%E2%80%9CThe+position+and+duty+of+the+magistrate+demands+that+he+repress+shameless+disturbers+with+the+sword%2C+or+by+public+external+power+if+there+is+need.%E2%80%9D%5D%0A%0AIt+is+his+place+and+duty+to+repress+them%2C+and+restrain+them%2C+if+they+be+noxious+and+turbulent%3A+yea%2C+and+he+adds+more+then+every+one+will+be+patient+to+hear%3A+namely%2C+that+if+also+they+be+manifestly+blasphemous+and+pertinacious%2C+they+may+be+cut+off+supplicio+capitali%3A+according+to+that+in+Levit.+24.+15%2C+16.+But+I+will+not+fall+upon+the+discussion+of+that+at+this+time%3A+all+that+I+would+humbly+suggest+unto+you%2C+is+this%2C+That+you+may+help+against+this+dangerous+flood+9.+ways.%0A%0A1.+By+a+peremptory+abhorring%2C+and+crushing+of+that+flood-begetting+maxim%2C+viz.+a+Catholic+liberty+and+toleration+of+all+opinions%3A+There+was+a+Religion+%28as+one+once+spake+before+you%29+omnium+Deorum%2C+of+all+God%E2%80%99s+amongst+the+old+Romans%3A+and+there+is+a+Religion+omnium+Sanctoru%CC%84%2C+of+all+Saints+now+amongst+the+Papists%3A+and+if+the+Serpent+could+but+wriggle+in+a+Religion+omnium+opinionum%2C+of+all+opinions+amongst+the+English%2C+he+needs+to+desire+no+more%3A+If+men+can+step+from+one+Religion+to+all%2C+they+will+soon+fall+from+all+Religion+to+none.%0A%0A2.+By+a+public+declaration+against+all+heresies+and+blasphemies%2C+known+to+be+spoken+and+printed%3B+When+Ostorodius+and+Vaidovius+started+out+their+Socinian+Heterodoxies+in+the+Low-Countries%2C+the+States+General+packed+away+those+seducers+with+exile%2C+and+publicly+condemned+and+committed+their+pestiferous+books+to+the+fire.%0A%0A3.+By+making+some+standing+Laws+against+such+opinions%2C+which+can+be+proved+to+be+heretical+and+blasphemous%3B+Serviunt+reges+terrae+Christo+%28saith+one%29+etiam+leges+ferendo+pro+Christo.%0A%0A4.+By+setting+up+your+Church-Discipline+with+full+power%2C+that+so+it+may+reach+these+heresies+and+blasphemies%2C+which+%28if+any+sins%29+then+they+do+plainly+fall+within+the+Verge+of+it%3A+If+the+discipline+were+fully+and+generally+established%2C+you+should+not+have+an+heresy+or+blasphemy%2C+or+any+erroneous+opinion+creeping+out+in+any+part+of+the+Kingdom%2C+but+there+would+be+a+timely+discovery+of+it%2C+and+likewise+a+spiritual+remedy+to+recovering+persons%2C+and+to+prevent+their+further+spreading.%0A%0A5.+By+encouraging+and+heartening+the+godly%2C+orthodox+painful+Ministers+of+the+Gospel%2C+in+their+assertings+and+vindicatings+of+the+truths+of+Christ%3A+and+in+their+oppugning+of+wicked%2C+dangerous+and+damnable+opinions%3A+Not+suffering+%28therefore%29+to+be+snubbed%2C+abused%2C+reviled%2C+scorned%2C+slandered%2C+disturbed%2C+hazarded%2C+because+they+do+oppose+the+adversaries+of+truth%2C+and+those+Serpents+which+do+cast+out+floods+amongst+us%3A+why+should+the+Shepherd+be+discouraged%2C+because+he+keeps+off+Wolves+from+the+sheep%3F+or+any+man+bee+checked%2C+because+he+would+quench+the+flying+fire%3F%0A%0A6.+By+using+your+prudent+Authority%2C+in+a+timely+causing+to+be+sent+forth+faithful+and+able+Ministers%2C+such+as+are+thoroughly+tried%2C+and+well+approved+to+be+sound+in+the+faith%2C+and+skilful+to+convince+gain-sayers+and+seducers%3B+The+more+you+help+truth%2C+and+the+servants+of+truth%2C+the+more+help+do+you+therein+contribute+against+errors%2C+and+the+enemies+of+truth%3A+No+better+help+against+darkness%2C+then+light.%0A%0A7.+By+a+tender+and+watchful+eye+unto+the+Universities%2C+one+of+which+is+lately+fallen+into+your+possession%3A+take+care+it+may+not+fall+into+the+possession+of+any+seducers%3A+you+have+heard+%28I+doubt+not%29+of+a+late+Disputation+in+Oxford%3B+where+some+body+undertook+to+maintain+%28besides+in+private%29+divers+strange+and+dangerous+opinions+in+public%3B+I+humbly+entreat+you+to+take+care%2C+that+the+Serpent+gets+not+in+his+body%2C+before+there+be+any+planted+to+bruise+his+head%3A+Truth+by+right+is+the+first-born%2C+and+should+first+inherit%3A+do+not+put+the+truth+to+play+an+after+game+with+error%3B+Other+Garrisons%2C+if+lost%2C+may+easily+be+reduced%3A+but+that+which+is+surprised+fast+by+error%2C+is+not+so+easily+recovered.%0A%0A8.+By+enjoining+a+solemn+day+of+Humiliation+through+all+the+Land%2C+for+the+dishonours+redounding+to+God%2C+and+Christ%2C+and+the+Truth%2C+by+the+present+errors%2C+heresies%2C+blasphemies%3B+You+did+so+lately+for+the+floods+of+rain+which+endangered+the+Corn%3A+O+that+it+might+seem+good+unto+you+so+to+do%2C+for+the+flood+of+errors+which+endanger+souls%21+This+humble+request+I+presume+to+leave+with+your+pious+zeal+and+prudence.%0A%0A9.+By+using+your+Coercive+power+with+such+methods+and+proportions+%5Bsic%5D+the+real+safety+of+truth+and+souls+doth+require%2C+and+the+repression+of+dangerous+errors+doth+need%3A+So+managing+the+distributions+thereof%2C+that+under+the+notion+of+restraining+heresy%2C+you+by+no+means+injure+real+sanctity%2C+nor+yet+under+the+pretence+of+sanctity%2C+you+do+not+favour+the+growth+of+heresy%3A+O+what+an+happy+people+are+they%2C+amongst+whom+errors+are+losing%2C+and+truths+are+graining%21+where+piety+thrives%2C+and+wickedness+blasts%21+where+all+who+are+good+can+join+against+all+that+is+evil%2C+and+in+lesser+things%2C+whereas+yet+they+cannot+%28through+weakness%29+clasp+opinions%3B+yet+%28for+the+truth+and+peace%E2%80%99s+sake%29+can+clasp+hearts+and+hands+to+promote+God%E2%80%99s+glory%2C+and+the+common+salvation+of+souls%21%E2%80%9D%0A%0A%E2%80%94+Obadiah+Sedgwick%2C+The+nature+and+danger+of+heresies%3A+opened+in+a+sermon+before+the+Honourable+House+of+Commons%2C+January+27.+1646.+at+Margaret%E2%80%99s+Westminster%2C+being+the+day+of+their+solemn+monthly+fast%2C+%28London%3A+Samuel+Gellibrand%2C+1647%29%2C+pp+36-40.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd61b67bec2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d61b67bec2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/11/15/obadiah-sedgwick-on-the-magistrates-duty-to-uphold-both-tables-of-the-law/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><figure class="quote" id="q-c4e8300ca3" data-kw="">
<blockquote><p>Absolute censorship of the Nazi data does not seem proper, especially when the secrets of saving lives may lie solely in its contents… When the value of the Nazi data is of great value to humanity, then the morally appropriate policy would be to utilize the data, while explicitly condemning the atrocities… To further justify its use, the scientific validity of the experiment must be clear; there must be no other alternative source from which to gain that information, and the capacity to save lives must be evident. …it must not be included as ordinary scientific research, just to be cited and placed in a medical journal… citation of the data must contain a thorough expose’ of exactly what tortures and atrocities were committed for that experiment… [and it] must be accompanied with the author’s condemnation of the data… as medical evil, never to be repeated.</p></blockquote>

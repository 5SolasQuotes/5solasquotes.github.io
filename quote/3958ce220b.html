<main class="wrap"><figure class="quote" id="q-3958ce220b" data-kw="">
<blockquote><p>The sabbath was made for man, and not man for the sabbath: Therefore the Son of man is Lord also of the sabbath” (Mark 2:27, 28). … In this affirmation, contrary to much glib but wanton appeal to it, there is not the least hint that the Sabbath law was about to be abrogated. What Jesus was combatting on this occasion was the travesties of application by which the Jews had made void the law of God. Jesus’ unsparing condemnation of those artificialities that had turned a beneficent institution into an instrument of tyranny no more argues the abrogation of the institution itself, than does His condemnation of the traditions by which the Jews had made void the fifth commandment argue for the abrogation of the fifth (Cf. Mark 7:8-13). If His condemnation and correction of the tradition by which the Jews of His day had made void the Word of God in the fifth commandment in no way relieves but rather reinforces the divine obligation of this commandment itself, so His statement with reference to the Sabbath quoted above furnishes no support for the abrogation of the fourth commandment. But let us examine Mark 2:27,28 more closely.

“The sabbath was made for man.” Of course, when it is said that it was made, there is but one meaning, namely, that God made it. It is not a device of human expediency or utility. It is a divine creation. It is God’s day. The reasonable inference is that this is an allusion to the primeval institution as recorded in Genesis 2:2, 3. We know that the Sabbath institution existed prior to the promulgation of it at Sinai. So the making of it referred to by our Lord cannot reasonably refer simply to the giving of the law at Sinai. And since we must go back to something that antedates Sinai, what is there that more naturally or perfectly suits the allusion than that referred to in Genesis 2:2, 3?

It was “made for man.” Perhaps the fact that Jesus says it was made for man and not simply for Israel has sometimes been unduly pressed to establish the universality of the Sabbath law. But recoil from exaggeration must not be allowed to obscure the real force of what is meant. The Sabbath, after all, was made for man, and in that word man there inheres a reference to what man’s very nature as man and man’s highest need as man require. When we bear in mind that the point of time referred to in the making of the Sabbath antedates all ethnical distinction, we are constrained to find in this simple statement confirmation of the universality of the obligation and blessing of the Sabbath institution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fourth Commandment According to the Westminster Standards in The Calvin Forum</cite></span></figcaption>

<blockquote><p>The sanctification of the Sabbath, since it is moral and perpetual and is turned into the Lord’s Day in the Christian church, is twofold, privative and positive or ascetic. It is privative, consisting in cessation from labours of ordinary vocation, that we may be freer to worship God. It is positive or ascetic, consisting in the solemn public and private worship of God, which is exercised at a stated time in the congregation of the church and at home. It cannot be gathered very pure other than from the moral worship of the Sabbath day, which sort, having been secluded even in the Old Testament, was typical compared with the worship of God in the New Testament.</p></blockquote>

<blockquote><p>Yea the fallible church may determine infallible points. This is a principle that Libertines proceed upon, that men who are not infallible may err, and therefore can hold forth to others no infallible truth, which is most false, for prophets and apostles, Nathan, Samuel, David, Peter, being deserted of the immediately inspiring Spirit, did err, as well as the Church and pastors now deserted of the ordinary Spirit can and do err. For ‘all men’, prophets and apostles, ‘are liars’, Rom. 3, yet they may and do carry infallible truth to others; a blind man may hold a candle to others.

3. By this reason [of the Libertines] pastors can preach nothing certain in fundamentals [which is absurd], though faith come by hearing and faith is of a certain and determinate fixed truth of God, more permanent than heaven or earth; Why? because by this reason pastors in preaching fundamentals are not infallible.

4. Nor is this a good reason: It is believed the Church may err in synods, ergo [therefore], it does err and determines nothing that is infallible and certain in synods; no more than this is a good consequence: David may sin in praying, ergo, he does sin in praying: a potentia ad actum non valet consequentia [a consequence from potential to an act is not valid].</p></blockquote>

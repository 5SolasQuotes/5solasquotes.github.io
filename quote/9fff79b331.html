<blockquote><p>The Father, according to his eternal covenant with the Son as last Adam, sent him, in order that he might bear their griefs, and carry their sorrows; and so might, at the infinite expense of his unparalleled anguish, agony, and death, purchase for them, the comfort which they, in the first Adam, had forfeited.

He sent his only, his dear Son, to endure the pains of eternal death for them, that they might enjoy, in union with Him, the comfort of eternal life; … The Father hath also exalted him, in the human nature, to universal dominion; on purpose that, he might dispense the comfort of salvation, to all who should believe in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Spiritual Comfort</cite>, (2nd edn, Edinburgh: J. Ogle, 1814), p. 48.</span></figcaption>

<blockquote><p>XXXIII. And the thing speaks for itself, For, as there is a covenant between the Father and the Son; “when thou shalt make his soul (if the soul of the Son shall devote himself) an offering for sin,” Is. 53:10, upon performing the condition, the Son acquired a right to the reward, and so has a merit according to the covenant. Nay, as it is not the obedience of a mere man, but of Christ, God-man, an infinite person, it is also of an infinite value, consequently bears the justest proportion to the greatest corresponding glory; and thus far it is a merit of condignity, as it is called; such as no mere creature is capable to acquiring.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man</cite>, trans. William Crookshank, vol. 1 (London: T. Tegg &amp; Son, 1837), vol. 1. 162 (2.3.33).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

<blockquote><p>1. This covenant, called “the old covenant,” was never intended to be of itself the absolute rule and law of life and salvation unto the church, but was made with a particular design, and with respect unto particular ends. This the apostle proves undeniably in this epistle, especially in the chapter foregoing, and those two that follow. Hence it follows that it could abrogate or disannul nothing which God at any time before had given as a general rule unto the church. For that which is particular cannot abrogate any thing that was general, and before it; as that which is general doth abrogate all antecedent particulars, as the new covenant doth abrogate the old. And this we must consider in both the instances belonging hereunto. For,— (1.) God had before given the covenant of works, or perfect obedience, unto all mankind, in the law of creation. But this covenant at Sinai did not abrogate or disannul that covenant, nor any way fulfil it. And the reason is, because it was never intended to come in the place or room thereof, as a covenant, containing an entire rule of all the faith and obedience of the whole church. God did not intend in it to abrogate the covenant of works, and to substitute this in the place thereof; yea, in sundry things it re-enforced, established, and confirmed that covenant. For,— [1.] It revived, declared, and expressed all the commands of that covenant in the decalogue; for that is nothing but a divine summary of the law written in the heart of man at his creation. And herein the dreadful manner of its delivery or promulgation, with its writing in tables of stone, is also to be considered; for in them the nature of that first covenant, with its inexorableness as unto perfect obedience, was represented. And because none could answer its demands, or comply with it therein, it was called “the ministration of death,” causing fear and bondage, 2 Cor. 3:7. [2.] It revived the sanction of the first covenant, in the curse or sentence of death which it denounced against all transgressors. Death was the penalty of the transgression of the first covenant: “In the day that thou eatest, thou shalt die the death.” And this sentence was revived and represented anew in the curse wherewith this covenant was ratified, “Cursed be he that confirmeth not all the words of this law to do them,” Deut. 27:26; Gal. 3:10. For the design of God in it was to bind a sense of that curse on the consciences of men, until He came by whom it was taken away, as the apostle declares, Gal. 3:19. [3.] It revived the promise of that covenant,—that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Rom. 10:5; as he doth, Lev. 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 23.77–78.</span></figcaption>

eral, and the writings of the most eminent Reformed Divines…” – On the Apostles’ Creed, Note XII, p. 386 Wilson, David – Palæmon’s Creed Reviewed &amp; Examined: wherein Several Gross &amp; Dangerous Errors, Advanced by the Author of the Letters on Theron &amp; Aspasio, are Detected &amp; Refuted; &amp; the Protestant Doctrine Concerning the Covenant of Works &amp; the Covenant of Grace, Conviction of Sin, Regeneration, Faith, Justification, Inherent Grace, etc., Vindicated from the Cavils and Exceptions of that Author, and shown to be entirely conformable to the Apostolic Doctrine concerning the several points afore-mentioned, vol. 1, 2 (London, 1762) Wikipedia: “Theron and Aspasio, or a series of Letters upon the most important and interesting Subjects [by James Hervey, 1724-58, an Anglican clergyman], which appeared in 1755, and was equally well received, called forth some adverse criticism even from Calvinists, on account of tendencies which were considered to lead to antinomianism, and was strongly objected to by Wesley in his Preservative against unsettled Notions in Religion. Besides carrying into England the theological disputes to which the Marrow of Modern Divinity had given rise in Scotland (the Marrow Controversy), it also led to what is known as the Sandemanian controversy as to the nature of saving faith.</p></blockquote>

<blockquote><p>§124. XII. Man, therefore, by the very fact that he was made according to God’s image, has been constituted as in a covenant with God. I call this covenant or pact a firm agreement in mutual obligation because God bound Adam by oath unto loving and seeking him as his God, that is being examined also in an ardent attachment to God together with obedience throughout the examination period, performed to God’s eternal glory in him who will be revealed in beatific life. And in turn he offered to Adam the assurance of what must be expected for standing in uprightness and rectitude, and for observing the law of examination, and from him, as his God, for striving after that revelation of God’s glory in himself, and the blessing in the multiplication of his posterity with God’s image. This is already clearly evident from what has been said.

§125. XIII. In this pact, heavenly life is considered as the reward that must be reckoned according to what is owed. This is usually called merit. But what the nature of this merit would be must be considered. It is not condign. Man is able to pay nothing to God, God accepts nothing from his hands, it is not profitable or beautiful according to man’s work. Man owes everything to God. See Luke 17:10. It, therefore, remains that merit is by the covenant.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b3812d646d" data-kw="">
<blockquote><p>As I ever abhorred division and faction in the Church, as that which tends to its utter ruin if the Lord prevent it not;” he adds (and here I join with him), “I would, in the bowels of my Lord and Master, if such a feckless one as I may presume to persuade and exhort both ministers and professors: ‘If therre by any consolation in Christ, if any comfort in love, if any fellowship of the Spirit, if any bowels and mercies, that ye be like-minded, having the same love, being of one accord, of one mind. In lowliness of mind let each esteem other better than themselves.’ (Phil. 2:2-3)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e76b9d6b8a" data-kw="">
<blockquote><p>Here it is particularly to be observed that this [Church] discipline exercises such a degree of severity as is always connected with a spirit of kindness… it can easily be judged thence how far to proceed and where severity ought to cease… otherwise rigor exceeds the proper bound. Hence the immoderate austerity of the ancients cannot be approved, which was both contrary to the prescription of God and was exposed to great dangers… Therefore that spiritual sword is not to be unsheathed for a trivial cause (as is the case everywhere among the Anabaptists), but all things are to be first tried and only by degrees ought we to resort to extreme measures…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 18th Topic, ‘The Church’, 32nd Question, ‘Ecclesiastical Discipline and Excommunication’, section IV, p. 294</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-f9c9c7ceee" data-kw="">
<blockquote><p>A separation, when not upon clear and just ground, is a greater sin before God, and more wounding to the heart of Christ, than either murder or adultery, etc. And whoever shall be found to plead for this, I dare affirm he blows that fire with his breath, which Christ would quench with his blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-b2ae994528" data-kw="">
<blockquote><p>And shall we now set up a Church-tyranny, the mere will and abitriment, yea, the unjust sentences of Church-judicatories for laws, and require absolute submission thereunto, not only of private and single persons, but of all inferior judicatories, not allowing the congregational-eldership once to whisper against what is resolved by the presbytery, or the presbytery against what is resolved by the synod, or the synod against what is resolved by the General Assembly. If then the superior judicatories will tyrannize, what remedy is there? or if they become corrupt, how shall the ruin of religion, or the persecution and oppression of these who desire to keep faith and a good conscience, be avoided? Have the Ministers and saints and courts of Jesus Christ received religion and His ordinances upon these terms, that if a superior Court will have it so, they shall all crouch down as asses under the burden, and let them, without gainsaying (they being now cudgeled into silence by a sentence of suspension from the sacrament, or deposition or excommunication) ruin Church, and Ministers, and ordinances, and professors, and all the precious interests of Jesus Christ; And shall we say that such a submission is required in this case, as though they ought to do nothing but weep and pray in secret? How great tyranny is this, and how remedy-less a way to ruin?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them</cite>, … (1658), pp. 113-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

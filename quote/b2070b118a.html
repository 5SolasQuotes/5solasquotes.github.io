<blockquote><p>I will set down a catalogue of inventions of men used for religious ends, and uses without any commandment of God, and that both before the Law, and under the Law, and under the Gospel. The apostle Paul used… The women’s coverings, 1 Cor. 11. The Love-feasts: The holy kiss.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter</cite>, … (London, 1623), on v. 13, pp. 588-90 &amp; 594 Byfield was an Anglican minister that had practical, puritan characteristics, but here takes an Anglican view on ceremonies.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“I will set down a catalogue of inventions of men used for religious ends, and uses without any commandment of God, and that both before the Law, and under the Law, and under the Gospel. The apostle Paul used… The women’s coverings, 1 Cor. 11. The Love-feasts: The holy kiss.”

— Nicholas Byfield, A Commentary: or, Sermons upon the Second Chapter of the First Epistle of Saint Peter… (London, 1623), on v. 13, pp. 588-90 &amp; 594 Byfield was an Anglican minister that had practical, puritan characteristics, but here takes an Anglican view on ceremonies.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+will+set+down+a+catalogue+of+inventions+of+men+used+for+religious+ends%2C+and+uses+without+any+commandment+of+God%2C+and+that+both+before+the+Law%2C+and+under+the+Law%2C+and+under+the+Gospel.+The+apostle+Paul+used%E2%80%A6+The+women%E2%80%99s+coverings%2C+1+Cor.+11.+The+Love-feasts%3A+The+holy+kiss.%E2%80%9D%0A%0A%E2%80%94+Nicholas+Byfield%2C+A+Commentary%3A+or%2C+Sermons+upon+the+Second+Chapter+of+the+First+Epistle+of+Saint+Peter%E2%80%A6+%28London%2C+1623%29%2C+on+v.+13%2C+pp.+588-90+%26+594+Byfield+was+an+Anglican+minister+that+had+practical%2C+puritan+characteristics%2C+but+here+takes+an+Anglican+view+on+ceremonies.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb2070b118a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b2070b118a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=I%20will%20set%20down%20a%20catalogue,11.%20The%20Love%2Dfeasts%3A%20The%20holy%20kiss&amp;text=I%20will%20set%20down%20a%20catalogue%20of%20inventions&amp;text=1%20Cor.%2011.%20The%20Love%2Dfeasts%3A%20The%20holy%20kiss" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-af173113bb" data-kw="">
<blockquote><p>1. The text [1 Cor. 11:16] gives him [Anglican bishop Andrewes] no ground for this doctrine… that the custom of the Church should be enough to us in matters of ceremony… for the custom of the Church there spoken of is not concerning a point of circumstance, but concerning a very substantial and necessary point, namely, not to be contentious: neither does the apostle urge those orders of the men’s praying uncovered and the women’s praying veiled from this ground, because so was the Church’s custom (as the bishop would have it), but only he is warning the Corinthians not to be contentious about those matters, because the churches have no such custom as to be contentious. So is the place expounded by Chrysostom, Ambrose, Calvin, Martyr, Bullinger, Marlorat, Beza, Fulke, Cartwright, Pareus… And for this exposition it makes that the apostle in the preceding part of the chapter has given sufficient reasons for that order of covering or veiling the women: wherefore if any would contend about the matter, he tells them they must contend with themselves, for they (nor the churches of God) would not contend with them: they had no such custom. … 2. The custom of the Church is not enough to pitch on, and it is found oftentimes expedient to change a custom of the Church. Basil the Great does flatly refuse to admit the authority of custom: Consuetudo sine veritate [Custom without truth], says Cyprian, vetustas erroris est [is an old thing erring]. Frustra enim qui ratione vincuntur, says Augustine, consuetudinem nobis objiciunt, quasi consuetudo major sit veritate, etc. Nullus pudor est ad meliora transire, says Ambrose to the Emperour Valentinian: Quaelibet consuetudo [Any custom], says Gratian, veritati est postponenda [ought to be put after the truth]. And again: Corrigendum est quod illicite admittitur, aut a praedecessoribus admissum invenitur. A politic writer admonishes, retinere antiqua [retain that which is ancient], only with this caution: Si proba [if it is proved]. Calvin (speaking against human ceremonies) says: Si objiciatur, etc. ‘If’, says he, ‘antiquity be objected (albeit they who are too much addicted to custom and to received fashions, do boldly use this buckler to defend all their corruptions), the refutation is easy: For the ancients also themselves with heavy complaints have abundantly testified that they did not approve of anything which was devised by the will of men.’ In the end of the epistle he alleges this testimony of Cyprian: ‘If Christ alone be to be heard, then we ought not to give heed what any man before us has thought fit to be done, but what Christ (who is before all) has done, for we must not follow the custom of man, but the truth of God.’ What can be more plain than that antiquity cannot be a confirmation to error, nor custom a prejudice to truth?… 3. …If then it be enough to pitch upon custom, why ought not those customs to have been commended and continued? But if they were commendably changed, then ought we not to follow blindly the bare custom of the Church, but examine the equity of the same, and demand grounds of reason for it. St. Paul (says Dr. Fulke) does give reasons for that order of covering women’s heads: By whose example the preachers are likewise to endeavor to satisfy by reason both men and women, that humbly desire their resolution for quiet of their conscience, and not to beat them down with the club of custom only. 4. Whereas the custom of some churches is alleged for the ceremonies, we have objected the custom of other churches against them: Neither shall ever our opposites prove them to be the customs of the Church universal. … 6. If it were so that we ought to pitch upon the Churches custom, yet (that I may speak with Mr. [Richard] Hooker) the law of common indulgence permits us to think of our own customs as half a thought better than the customs of others. But why was there such a change made in the discipline, policy and orders of the Church of Scotland, which were agreeable to the Word of God, confirmed and ratified by general assemblies and parliaments, used and enjoyed with so great peace and purity? Our custom should have holden the ceremonies out of Scotland, hold them in elsewhere as it may.</p></blockquote>

<blockquote><p>Sixthly, He tells us page 32, That in all Reformed Churches men used to enter into the place of public worship with their hats off, which is as great an untruth, as ever dropped from writers’ pen, unless it be understood of places of public worship, whilst public worship is actually performed in them, and if it may be so understood, then the Presbyterians would hugely approve of it. By the [Westminster] Directory it was enjoined that, all enter the assembly not irreverently, but in a grave and seemly manner: gravity and seemliness do include putting off the hat, which yet would be a ridiculous action, if a man should use it, as too many now a days do as oft as they go through the Church, though none be met for worship, and though they themselves intended no worship: nor does the Directory any where condemn the manner which Mr. Durell tells us has obtained among the French Ladies, viz. to unmask themselves when they come into the temple; provided they do not unmask themselves out of a vain or wanton design; if they should do so, they know by whom they are condemned. [I but says Mr. Durell, the devoutest sort both of men and women, use[d] to kneel and make a prayer for God’s blessing, before they sit down, and this the [Westminster] Directory prohibits.] Had he said that the devouter sort use a short prayer when they took no seats, and came to perform no service to God; then he had said something to excuse the actings of some among us. The peoples making a secret prayer before they sit down in their seats, is not forbidden by the Directory, unto all, or unto any, but these who come into the Church the public worship being begun, and whether it be more meet for such to betake themselves to their private devotions, or to join with the Assembly in that ordinance that is in hand, let the learned judge for they are wise. Seventhly, All might have been spared that is brought, page 33, Of people’s standing bare in time of divine service, and at the administration of sacraments: In the very Church of Scotland all are uncovered at the administration of the sacraments; here in England men had left off to put on their hats in time of sermon (which Mr. Durell seems to distinguish from Service) had Mr. Calamy and others been hearkened to. Eighthly, Above all, what need we be told, page 22, that Calvin wore a gown and a cap: Were not presbyterians accustomed so to do in the universities? Those sent down by the two Houses to Cambridge, did all of them preach in the University Church in their gowns, and in their hoods;</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Sixthly, He tells us page 32, That in all Reformed Churches men used to enter into the place of public worship with their hats off, which is as great an untruth, as ever dropped from writers’ pen, unless it be understood of places of public worship, whilst public worship is actually performed in them, and if it may be so understood, then the Presbyterians would hugely approve of it. By the [Westminster] Directory it was enjoined that, all enter the assembly not irreverently, but in a grave and seemly manner: gravity and seemliness do include putting off the hat, which yet would be a ridiculous action, if a man should use it, as too many now a days do as oft as they go through the Church, though none be met for worship, and though they themselves intended no worship: nor does the Directory any where condemn the manner which Mr. Durell tells us has obtained among the French Ladies, viz. to unmask themselves when they come into the temple; provided they do not unmask themselves out of a vain or wanton design; if they should do so, they know by whom they are condemned. [I but says Mr. Durell, the devoutest sort both of men and women, use[d] to kneel and make a prayer for God’s blessing, before they sit down, and this the [Westminster] Directory prohibits.] Had he said that the devouter sort use a short prayer when they took no seats, and came to perform no service to God; then he had said something to excuse the actings of some among us. The peoples making a secret prayer before they sit down in their seats, is not forbidden by the Directory, unto all, or unto any, but these who come into the Church the public worship being begun, and whether it be more meet for such to betake themselves to their private devotions, or to join with the Assembly in that ordinance that is in hand, let the learned judge for they are wise. Seventhly, All might have been spared that is brought, page 33, Of people’s standing bare in time of — Henry Hickman, Bonasus vapulans [A Bull being Whipped], or, Some Castigations given to Mr. John Durell for Fouling Himself &amp; Others in his English &amp; Latin Book by a Country Scholar (London, 1672) Hickman (bap.1629-1692) was an English puritan who was ejected in 1662., pp. 55-57">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSixthly%2C+He+tells+us+page+32%2C+That+in+all+Reformed+Churches+men+used+to+enter+into+the+place+of+public+worship+with+their+hats+off%2C+which+is+as+great+an+untruth%2C+as+ever+dropped+from+writers%E2%80%99+pen%2C+unless+it+be+understood+of+places+of+public+worship%2C+whilst+public+worship+is+actually+performed+in+them%2C+and+if+it+may+be+so+understood%2C+then+the+Presbyterians+would+hugely+approve+of+it.+By+the+%5BWestminster%5D+Directory+it+was+enjoined+that%2C+all+enter+the+assembly+not+irreverently%2C+but+in+a+grave+and+seemly+manner%3A+gravity+and+seemliness+do+include+putting+off+the+hat%2C+which+yet+would+be+a+ridiculous+action%2C+if+a+man+should+use+it%2C+as+too+many+now+a+days+do+as+oft+as+they+go+through+the+Church%2C+though+none+be+met+for+worship%2C+and+though+they+themselves+intended+no+worship%3A+nor+does+the+Directory+any+where+condemn+the+manner+which+Mr.+Durell+tells+us+has+obtained+among+the+French+Ladies%2C+viz.+to+unmask+themselves+when+they+come+into+the+temple%3B+provided+they+do+not+unmask+themselves+out+of+a+vain+or+wanton+design%3B+if+they+should+do+so%2C+they+know+by+whom+they+are+condemned.+%5BI+but+says+Mr.+Durell%2C+the+devoutest+sort+both+of+men+and+women%2C+use%5Bd%5D+to+kneel+and+make+a+prayer+for+God%E2%80%99s+blessing%2C+before+they+sit+down%2C+and+this+the+%5BWestminster%5D+Directory+prohibits.%5D+Had+he+said+that+the+devouter+sort+use+a+short+prayer+when+they+took+no+seats%2C+and+came+to+perform+no+service+to+God%3B+then+he+had+said+something+to+excuse+the+actings+of+some+among+us.+The+peoples+making+a+secret+prayer+before+they+sit+down+in+their+seats%2C+is+not+forbidden+by+the+Directory%2C+unto+all%2C+or+unto+any%2C+but+these+who+come+into+the+Church+the+public+worship+being+begun%2C+and+whether+it+be+more+meet+for+such+to+betake+themselves+to+their+private+devotions%2C+or+to+join+with+the+Assembly+in+that+ordinance+that+is+in+hand%2C+let+the+learned+judge+for+they+are+wise.+Seventhly%2C+All+might+have+been+spared+that+is+brought%2C+page+33%2C+Of+people%E2%80%99s+standing+bare+in+time+of+divine+service%2C+and+at+the+administration+of+sacraments%3A+In+the+very+Church+of+Scotland+all+are+uncovered+at+the+administration+of+the+sacraments%3B+here+in+England+men+had+left+off+to+put+on+their+hats+in+time+of+sermon+%28which+Mr.+Durell+seems+to+distinguish+from+Service%29+had+Mr.+Calamy+and+others+been+hearkened+to.+Eighthly%2C+Above+all%2C+what+need+we+be+told%2C+page+22%2C+that+Calvin+wore+a+gown+and+a+cap%3A+Were+not+presbyterians+accustomed+so+to+do+in+the+universities%3F+Those+sent+down+by+the+two+Houses+to+Cambridge%2C+did+all+of+them+preach+in+the+University+Church+in+their+gowns%2C+and+in+their+hoods%3B%E2%80%9D%0A%0A%E2%80%94+Henry+Hickman%2C+Bonasus+vapulans+%5BA+Bull+being+Whipped%5D%2C+or%2C+Some+Castigations+given+to+Mr.+John+Durell+for+Fouling+Himself+%26+Others+in+his+English+%26+Latin+Book+by+a+Country+Scholar+%28London%2C+1672%29+Hickman+%28bap.1629-1692%29+was+an+English+puritan+who+was+ejected+in+1662.%2C+pp.+55-57&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2c2f68e531.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2c2f68e531.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=Sixthly%2C%20He%20tells%20us%20page%2032,their%20gowns%2C%20and%20in%20their%20hoods&amp;text=Sixthly%2C%20He%20tells%20us%20page%2032%2C%20That%20in&amp;text=Church%20in%20their%20gowns%2C%20and%20in%20their%20hoods" rel="noopener" target="_blank">Read it online · Reformed Books Online <blockquote><p>2. To behave ourselves as those that do expect this help, not tempting God, not grieving the angels; We should take heed how we carry ourselves in regard of this honorable attendance; our sins and vanity offends them, as it does God… Angels are pure and holy creatures that still abode in the truth; pride, lust, and vanity is very offensive to them, especially impurities and undecencies in God’s worship, about which they have a special attendance; therefore the apostle bids the women to cover their heads because of the angels, 1 Cor. 11:10, their fashion being to come into the congregation with loose dishevelled locks, he minds them of the presence of the angels: We may use a like argument to women to cover their naked breasts, now their immodesty is grown so impudent as to out-face the ordinances of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary, or an Exposition with Notes on the Epistle of Jude</cite>, … (London, 1658), verse 9, Question &amp; Answer 4, pp. 371-2</span></figcaption>

</figure><figure class="quote" id="q-135600374f" data-kw="">
<blockquote><p>6. …Some [apostolic traditions] are concerning the rites and the good order of the Church; as that touching the blood of things that were strangled, the covering of women’s heads, that men should not be covered in the time of prayer, and such like. 7. Those things, which are concerning the substance of doctrine [e.g. Lord’s Supper], are to be perpetually observed in the Church: but as for the things which appertain to outward rites, they in consideration of diverse circumstances, as of time, place and person, may be changed: yet so, as regard be always had (which must be generally observed in all indifferent things) unto that which makes most for the glory of God and the edification of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/swiss-reformed.html">Theodore Beza &amp; Anthony Faius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Propositions &amp; Principles of Divinity Propounded &amp; Defended in the University of Geneva</cite>, (Edinburgh, 1591), pp. 251-2</span></figcaption>

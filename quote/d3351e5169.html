</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c726bebc9" data-kw="">
<blockquote><p>“There are others, who, rejecting that first absolute decree, and rightly so, make the conditional decree so common to all men that they assert that the counsel of God the Father in delivering the Son to death and of the Son in undergoing the same, and their intention and scope, was to acquire, impetrate and merit for all and every sinful man by that most precious death and passion, that, if they repent, when they are capable of doctrine and believe in Christ, they might be able to be reconciled with God and receive the remission of sins. They deny, however, that actual reconciliation with God or the remission of sins or eternal life was actually acquired or impetrated for those who remain in impenitence. 11. Since these deny that Christ died equally for the impious and the pious, and affirm that only the pious may glory in the satisfaction of Christ, because the principal fruit and efficacy of the satisfaction comes to them, they agree in sense with all other Orthodox on that point, even if they differ in their mode of speaking; especially since they acknowledge a certain special decree, according to which He died specially for the elect alone, by which they are brought not only to the common, but also to the singular benefits, namely the grace of regeneration and of efficacious calling, of justification and of glorification; and to the merit of Christ’s death they assign the true and efficacious communion, bestowal and application of saving grace, and the donation of faith itself, by which the application is made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, (d. 1651), vol. 2, Thirteen Disputations on the Just &amp; Gracious Dispensation of God concerning the Salvation of the Human Race, Disputation 6, Theses 9-11 in Barthold Holtzfus, Theological Treatise on Predestination, Election &amp; Reprobation of Men 3rd ed. tr. by AI by Nosferatu (Leiden, 1705), p. 121 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>
<div class="actions"><button class="copy" data-copy="““There are others, who, rejecting that first absolute decree, and rightly so, make the conditional decree so common to all men that they assert that the counsel of God the Father in delivering the Son to death and of the Son in undergoing the same, and their intention and scope, was to acquire, impetrate and merit for all and every sinful man by that most precious death and passion, that, if they repent, when they are capable of doctrine and believe in Christ, they might be able to be reconciled with God and receive the remission of sins. They deny, however, that actual reconciliation with God or the remission of sins or eternal life was actually acquired or impetrated for those who remain in impenitence. 11. Since these deny that Christ died equally for the impious and the pious, and affirm that only the pious may glory in the satisfaction of Christ, because the principal fruit and efficacy of the satisfaction comes to them, they agree in sense with all other Orthodox on that point, even if they differ in their mode of speaking; especially since they acknowledge a certain special decree, according to which He died specially for the elect alone, by which they are brought not only to the common, but also to the singular benefits, namely the grace of regeneration and of efficacious calling, of justification and of glorification; and to the merit of Christ’s death they assign the true and efficacious communion, bestowal and application of saving grace, and the donation of faith itself, by which the application is made.”

</figure><figure class="quote" id="q-d33ddd19d4" data-kw="">
<blockquote><p>Amyraut, however, builds on Calvin’s argument and, indeed, claims to be interpreting and clarifying it by arguing two mercies and two wills in God where Calvin did not; in fact where Calvin had specifically stated that the will of God is one and simple, albeit with distinctions that can be observed in its revelation. Where Calvin resolved the issue of the universal call and particular election by simply declaring a resolution in the fact that, as promised, the repentant are saved, Amyraut indicated a double divine intentionality… Even if Amyraut had added, as he would do at the Synod of Alençon, that his language of two decrees was by rational distinction and intended “without any succession of Thought, or Order of Priority and Posteriority” in God, his exegesis still would differ from Calvin’s in its postulation of two divine mercies and two intentions. The exegesis of the particular text, therefore, does not fully support those who appeal to it in order to interpret Amyraut as a precise follower of Calvin… Amyraut offered his own conclusion, modifying and supplementing Calvin’s argument with a concept of two wills in God—a scholastic distinction not found in Calvin’s reading of the text and related, probably, to Amyraut’s own training under John Cameron.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Tale of Two Wills: Calvin &amp; Amyraut on Ezekiel 18:23’ in Calvin Theological Journal 44</cite>, (2009): 211-25, p. 224</span></figcaption>

rc" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=Amyraut%2C%20however%2C%20builds%20on%20Calvin%E2%80%99s%20argument,Amyraut%E2%80%99s%20own%20training%20under%20John%20Cameron&amp;text=Amyraut%2C%20however%2C%20builds%20on%20Calvin%E2%80%99s%20argument%20and%2C%20indeed&amp;text=probably%2C%20to%20Amyraut%E2%80%99s%20own%20training%20under%20John%20Cameron" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9e67fe5e0e" data-kw="">
<blockquote><p>Now when God says expressly (as if He would make it impossible for any mortal to misconceive Him) that Christ is the Savior, the propitiation, the taster of death, not only for all men, but for every man, not only for the world, but for the whole world, and to prove He speaks of an intention to save them all without exception (if by the wickedness of their wills they do not frustrate his intention, as the greater part of men do, by not accepting his offer and not performing the conditions on which his offer is made), He professes He is not willing that any should perish, but [on the contrary] that all should come to repentance, 2 Pet. 3:9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-pierce.html">Thomas Pierce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Philanthropy</cite>, ... (London: Royston, 1657), ch. 3, pp. 86-87</span></figcaption>

</figure><figure class="quote" id="q-65c6534128" data-kw="">
<blockquote><p>The doctrine of hypothetical universalism acted as a corrosive factor in the French Reformed Church. Tolerated at first because it was felt that an outright condemnation would lead to schism, it slowly undermined respect for the confessional standards and disrupted internal unity and cohesion… it did provide a bridge toward Arminianism and perhaps toward the Semi-Pelagian tendencies of the Church of Rome. The advantages that Amyraut had envisioned failed to materialize, and the dangers against which his opponents had warned did in fact eventuate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roger-r-nicole.html">Roger R. Nicole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Standing Forth: Collected Writings of Roger Nicole</cite>, (Mentor, 2018), p. 326</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

<blockquote><p>3. This goodness is communicative. [There is] None so communicatively good as God. As the notion of God includes goodness, so the notion of goodness includes diffusiveness; without goodness He would cease to be a Deity, and without diffusiveness He would cease to be Good. The being good is necessary to the being God: For goodness is nothing else in the notion of it, but a strong inclination to do good; either to find or make an object wherein to exercise itself according to the propension of its own nature; and it is an inclination of communicating itself not for its own interest, but the good of the object it pitches upon. Thus God is good by nature and his nature is not without activity; He acts conveniently to his own nature. Ps. 119:68, ‘Thou art good and dost good.’ And nothing accrues to Him by the communications of Himself to others, since his blessedness was as great before the frame of any creature as ever it was since the erecting of the world; so that the goodness of Christ Himself increases not the luster of his happiness: Ps. 16:2, ‘My goodness extends not to Thee.’ He is not of a niggardly and envious nature; He is too rich to have any cause to envy, and too good to have any will to envy: He is as liberal as he is rich, according to the capacity of the object about which his goodness is exercised. The divine goodness being the supreme goodness, is goodness in the highest degree of activity; Not an idle, enclosed, pent up goodness, as a spring shut up or a fountain sealed, bubbling up within itself, but bubbling out of itself. A fountain of gardens to water every part of his creation; He is an ointment poured forth (Cant. 1:5). Nothing spreads itself more than oil and takes up a larger space, wheresoever it drops. It may be no less said of the goodness of God, as it is of the fulness of Christ, Eph. 1:23, ‘He fills all in all‘: He fills rational creatures with understanding, sensitive nature with vigor and motion, the whole world with beauty and sweetness. Every taste, every touch of a creature is a taste and touch of divine goodness. Divine goodness offers itself in one spark in this creature, in another spark in the other creature, and altogether make up a goodness inconceivable by any creature. The whole mass and extracted spirit of it is infinitely short of the goodness of the divine nature, imperfect shadows of that goodness which is in Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, … (d. 1680; London: Newman, 1682), Goodness of God, p. 588</span></figcaption>

<blockquote><p>longanimitas: longsuffering; the patient bearing of an offense, particularly over a long period of time; thus, the willingness of God to endure the offense of sin rather than immediately annihilate the world in its wickedness. The longanimitas Dei is the affection of the divine will according to which God wills to await repentance and to allow millennia to elapse, for the sake of mankind, between the fall and the final judgment. Longanimitas is virtually synonymous with patientia, indicating the height of patience.</p></blockquote>

</figure><figure class="quote" id="q-0480249b8d" data-kw="">
<blockquote><p>I was standing on the 10th of December, 1846, at the end of my Father’s house, and meditating on that precious word that has brought peace to countless weary ones: ‘God so loved the world, that He gave his only begotten Son, that whosoever believeth in Him, should not perish, but have eternal life’ (John 3:16). I saw the proof of his love in the giving of his Son Jesus. I saw that ‘whosoever’ meant anybody and everybody, and therefore me, even me. I saw the result of believing—that I would not perish, but have everlasting life. I was enabled to take God at his word. I saw no one, but Jesus only, all in all in redemption. My burden fell from my back, and I was saved. Yes, saved!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/duncan-matheson.html">Duncan Matheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Life and Labors of Duncan Matheson: The Scotttish Evangelist, by John MacPherson</cite>, (Kilmarnock: Ritchie, n.d.), p. 26, as quoted by Ian Murray, The Cross: the Pulpit of God’s Love, n.d., p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>‘The Lord is well pleased.’… This passage is interpreted in various ways. Some render it, “The Lord has so willed it;” others, “He is merciful;” but, for my own part, I have translated it, “The Lord is willing,” that is, disposed and inclined to deliver his people, and that for the purpose of magnifying his Law and extolling his righteousness. Thus God assigns the reason why He is ready to aid those who are unworthy, that He wishes to spread his glory in their salvation, that in this manner his righteousness may be illustriously displayed, and that his Law may prevail and flourish. As to the heavy calamities that have come on the Jews, the reason is, that of their own accord they have resolved to be blind, and to bring afflictions on themselves, instead of obeying God; for otherwise the Lord would have wished to enrich and exalt them…. Others render it, “For his righteous one,” and refer it to Christ; but they mistake the meaning of the word צדקו, (tzidko) and unquestionably He speaks of righteousness, and means that the Lord would willingly have displayed the magnificence of his promises: and would have given proofs of his righteousness in preserving his people, if they had not shown themselves to be ungrateful and unworthy. Some think that the Lord here offers an excuse for Himself, because, when the people whom He had adopted were exposed to so many evils, it appeared as if his truth were shaken, and that the prophet intended to meet this calumny, for they were seized and became a prey, not because the Lord delights in their miseries, but because He prefers his righteousness to everything else. For my own part, I explain it simply to mean, “The Lord, for the sake of doing honor to his Law, was inclined to do good to his people, in order that his glory and righteousness might shine forth in it; but his people showed themselves to be unworthy of so great a favor; and, therefore, by their own obduracy they made their wounds incurable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah</cite>, 42, verse 21, “The Lord is well pleased for his righteousness’ sake; he will magnify the law, and make it honourable.”</span></figcaption>

rs+his+righteousness+to+everything+else.+For+my+own+part%2C+I+explain+it+simply+to+mean%2C+%E2%80%9CThe+Lord%2C+for+the+sake+of+doing+honor+to+his+Law%2C+was+inclined+to+do+good+to+his+people%2C+in+order+that+his+glory+and+righteousness+might+shine+forth+in+it%3B+but+his+people+showed+themselves+to+be+unworthy+of+so+great+a+favor%3B+and%2C+therefore%2C+by+their+own+obduracy+they+made+their+wounds+incurable.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+Isaiah+42%2C+verse+21%2C+%E2%80%9CThe+Lord+is+well+pleased+for+his+righteousness%E2%80%99+sake%3B+he+will+magnify+the+law%2C+and+make+it+honourable.%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1fa2e2b5f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1fa2e2b5f2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=The%20Lord%20is%20well%20pleased,obduracy%20they%20made%20their%20wounds%20incurable&amp;text=The%20Lord%20is%20well%20pleased&amp;text=their%20own%20obduracy%20they%20made%20their%20wounds%20incurable" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>3. I reply: In us can be distinguished a double act of will, namely to will and to will-not, and each is a positive act; and if they be about the same object, they are contrary acts – which also are expressed by different words, which are ‘to love’ and ‘to hate’. 4. And both [of these] in us can be distinguished, so that to will is distinguished into efficacious and remiss: so that ‘efficacious willing’ is called that whereby to the will is not only the being of what is willed pleasing but, if it can at once put what is willed into being, it at once does; so too ‘efficacious willing-not’ is called that whereby not only does he who wills-not impede something but, if he can, he altogether destroys it. ‘Remiss will’ is that by which a willed thing so pleases that yet the will does not put it into being, although it can put it into being; ‘remiss willing-not’ is that whereby the thing willed-not thus displeases that it [the will] not prevent it from being, although it could. 5. In us, therefore, weak [or remiss] willing-not – properly speaking – seems to be the permission of something bad that I know: for I am not said to permit that about which I know nothing, or that which is so done by another that it pleases me – but that which I know is wrongly done by another but do not prevent, this I permit. 6. A sign of efficacious willing, if it be done immediately by the will, is fulfilment; if through another, it is precept; and of weak [remiss] willing in us, perhaps counsel is a sign, or persuasion or warning. And a sign of weak [remiss] willing-not is permission or dissuasion; and a sign of efficacious willing-not is prohibition. 7. But this distinction could be posited in God, so that as one act of his is willing and willing-not (and this without contrariety or dissimilarity in the act in itself), so over certain objects of his willed would be put ‘efficacious willing’, and similarly his willing-not over certain objects: willed-not ‘efficacious’, and over certain, not [efficaciously, or remissly]. And then could God’s willing-not be called weak with respect to those objects which he so wills-not that he wills-not to prohibit them; and this willing-not of God can be called his permission – and so the act in God, insofar as it passes over the object, thus disposes itself to the divine will. 8. But if this [n. 7] does not please (to the extent the willing-not of anything posited in being would seem to be with some sadness and with some imperfection of the volition and will), then it can be said that permission outwardly, or the sign, is that an effect be, which [sign] however is against the divine precept – and this is the permission that is a sign of the divine will; but to this does not correspond anything in the divine will save the not-willing to prohibit something being done, or the not willing-not, which is a negation of a divine positive act and consequently is not a positive [act]. 9. And that he is called ‘willing to allow’, this can be meant, not that he has a direct willing about what he permits, but a reflex act; for he offers to his will that this man will sin or is sinning, and first his will does not have a ‘to will’ about this man (for he cannot will him to have sin); secondly he can understand his will not to be willing this, and then he can will his will ‘not to will this’, – and so he is called willing to allow and to allow willingly; willing to permit and to permit willingly. Just as on the other side, with Judas presented to him: first God has a not willing him glory, and not first a willing-not (according to the final position in Ord. I, d. 41, n. 45); and he can then secondly reflect on this negation of act and will it – and so willing (or willingly) he does not choose Judas going to sin finally and a willing-not of glory, but a non-willing of glory.</p></blockquote>

ing-not+is+permission+or+dissuasion%3B+and+a+sign+of+efficacious+willing-not+is+prohibition.+7.+But+this+distinction+could+be+posited+in+God%2C+so+that+as+one+act+of+his+is+willing+and+willing-not+%28and+this+without+contrariety+or+dissimilarity+in+the+act+in+itself%29%2C+so+over+certain+objects+of+his+willed+would+be+put+%E2%80%98efficacious+willing%E2%80%99%2C+and+similarly+his+willing-not+over+certain+objects%3A+willed-not+%E2%80%98efficacious%E2%80%99%2C+and+over+certain%2C+not+%5Befficaciously%2C+or+remissly%5D.+And+then+could+God%E2%80%99s+willing-not+be+called+weak+with+respect+to+those+objects+which+he+so+wills-not+that+he+wills-not+to+prohibit+them%3B+and+this+willing-not+of+God+can+be+called+his+permission+%E2%80%93+and+so+the+act+in+God%2C+insofar+as+it+passes+over+the+object%2C+thus+disposes+itself+to+the+divine+will.+8.+But+if+this+%5Bn.+7%5D+does+not+please+%28to+the+extent+the+willing-not+of+anything+posited+in+being+would+seem+to+be+with+some+sadness+and+with+some+imperfection+of+the+volition+and+will%29%2C+then+it+can+be+said+that+permission+outwardly%2C+or+the+sign%2C+is+that+an+effect+be%2C+which+%5Bsign%5D+however+is+against+the+divine+precept+%E2%80%93+and+this+is+the+permission+that+is+a+sign+of+the+divine+will%3B+but+to+this+does+not+correspond+anything+in+the+divine+will+save+the+not-willing+to+prohibit+something+being+done%2C+or+the+not+willing-not%2C+which+is+a+negation+of+a+divine+positive+act+and+consequently+is+not+a+positive+%5Bact%5D.+9.+And+that+he+is+called+%E2%80%98willing+to+allow%E2%80%99%2C+this+can+be+meant%2C+not+that+he+has+a+direct+willing+about+what+he+permits%2C+but+a+reflex+act%3B+for+he+offers+to+his+will+that+this+man+will+sin+or+is+sinning%2C+and+first+his+will+does+not+have+a+%E2%80%98to+will%E2%80%99+about+this+man+%28for+he+cannot+will+him+to+have+sin%29%3B+secondly+he+can+understand+his+will+not+to+be+willing+this%2C+and+then+he+can+will+his+will+%E2%80%98not+to+will+this%E2%80%99%2C+%E2%80%93+and+so+he+is+called+willing+to+allow+and+to+allow+willingly%3B+willing+to+permit+and+to+permit+willingly.+Just+as+on+the+other+side%2C+with+Judas+presented+to+him%3A+first+God+has+a+not+willing+him+glory%2C+and+not+first+a+willing-not+%28according+to+the+final+position+in+Ord.+I%2C+d.+41%2C+n.+45%29%3B+and+he+can+then+secondly+reflect+on+this+negation+of+act+and+will+it+%E2%80%93+and+so+willing+%28or+willingly%29+he+does+not+choose+Judas+going+to+sin+finally+and+a+willing-not+of+glory%2C+but+a+non-willing+of+glory.%E2%80%9D%0A%0A%E2%80%94+John+Duns+Scotus%2C+Ordinatio%2C+tr.+Peter+Simpson+%282013+%2F+2023%29%2C+bk.+1%2C+dist.+26-48%2C+47.+Whether+divine+permission+is+some+act+of+the+divine+will%3F%2C+pp.+198-99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F917c1a7623.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/917c1a7623.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/how-did-the-first-human-sin-happen/#:~:text=3.%20I%20reply%3A%20In%20us%20can,glory%2C%20but%20a%20non%2Dwilling%20of%20glory&amp;text=3.%20I%20reply%3A%20In%20us%20can%20be%20distinguished&amp;text=willing%2Dnot%20of%20glory%2C%20but%20a%20non%2Dwilling%20of%20glory" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>There is no need of such an Interpreter; for things necessary to Salvation are so clearly set down in Scripture, that they need no Interpretation. Must we have an Interpreter to know that God hath created the World, that we must love God with all our heart, that the Son of God is dead for us? Now, I say, that all the Points necessary to Salvation are to be found in Scripture, in terms as clear as these.

The Interpretations used by the Pastors of our Churches, are taken from the Scripture itself, so they are not the Interpreters; it is God that expounds himself. For Example; When they expound these words, This is my Body; they take the Interpretation from Jesus Christ himself, who saith, that it is a Commemoration of him, and from three Evangelists, who say with one accord, that Jesus Christ hath given Bread to his Disciples; and from the words of Christ, that he drunk the Fruit of the Vine, we expound his other words, this is my Blood. We expound also these words of Christ, This is my Body, from St. Paul’s words, who (1 Cor. 11.) saith four times, that we eat Bread in the Lord’s Supper, and that we break Bread. Certainly, that Apostle giveth a clear Exposition of Christ’s words, This is my Body, and this is my Blood, saying, (1 Cor. 10.16.) The Cup of Blessing which we bless, is it not the Communion of the Blood of Christ? The Bread which we break, is it not the Communion of the Body of Christ?

We allege also those Texts that say, that Jesus Christ is no more in this World; that the Heaven doth contain him; that Christ is like unto us in all things, sin only excepted; and that by consequent he hath not a Body dispersed in a Million of several places at once, and enclosed whole in every Crum of the Host, and in every Drop of the Chalice.

Likewise, when Jesus saith, Do this in remembrance of me; We expound not these words as the Council of Trent doth, which puts this Sense upon them, I do constitute you to be Priests, to sacrifice my Body really under the species of Bread and Wine but we bring the Interpretation which St. Paul addeth (1 Cor. 11.26.) For as often as you eat this Bread and drink this Cup, ye do shew the Lord’s Death.

Consider also, that there is great Difference between a Judgment of Authority, and a Judgment of Discretion. With this last we judge of Meats by the Taste, without giving Laws to any. And it is so, that not only Pastors but also every one of the People, may and doth judge of the true Doctrine. And it is so that St. Paul will have the Corinthians to judge of his Doctrine (1 Cor. 10.15.) I speak as to wise men, judge ye what I say.</p></blockquote>

<blockquote><p>In the eighth century, Carolingian theologians at the Abbey of Corbie [France], Paschasius Radbertus (ca. 790-ca. 860) and Ratramnus (d. ca. 868) each wrote treatises on the Lord’s Supper. Both were titled ‘On the Body and Blood of the Lord’. They first debated what is ‘true’ and what is a ‘figure’ in the Lord’s Supper. Radbertus argued that the sign becomes the thing signified. In response, Ratramnus argued that if the sign becomes the thing signified, then we have no sacrament since Christ is received by faith, not sight; we would have no need of faith. If we have no faith, we have no Christ and no salvation. In the early sixteenth century, that debate was renewed by the Reformed and Lutheran theologians, with Lutherans republishing Radbertus and the Reformed, Ratramnus.” – ‘Foreward’, p. ix in Theodore Beza, A Clear &amp; Simple Treatise on the Lord’s Supper (RHB, 2016) Some other 9th century theologians who denied that Christ’s body and blood were materially eaten in the Eucharist during the Carolingian Eucharistic Controversy were: Gottschalk of Orbais, Alcuin of York &amp; Florus Magister. The same men were involved in a controversy over predestination. Generally speaking, the Carolingian theologians had a high view of predestination and took a spiritual view of the Lord’s Supper. Ratramnus took the central role in the Eucharistic controversy; Gottschalk took the central role in the predestinarian controversy. . . Post-Reformation Anthology of Heppe, Heinrich – ch. 26, ‘The Lord’s Supper’ in Reformed Dogmatics ed. Ernst Bizer, tr. G.T. Thomson (1861; Wipf &amp; Stock, 2007), pp. 627-57 Heppe (1820–1879) was a German reformed theologian. . . 1500’s Works Melanchthon, Philip ch. 27. ‘On Participation in the Table of the Lord’ in The Loci Communes of Philip Melanchthon… tr. Charles L. Hill (1521; Boston: Meador Publishing, 1944), pp. 258-60 Though Melanchthon (1497–1560) was a Lutheran, this work of his was the first ‘systematic theology’ of the Reformation, and, as it was very influential on reformed systematic theologies following shortly thereafter. Article 10, Of the Holy Supper in The Apology of the Augsburg Confession tr: F. Bente &amp; W. H. T. Dau (1531) ch. 22. ‘Of the Supper of Christ the Lord’ in Melanchthon on Christian Doctrine, Loci Communes, 1555 tr. Clyde L. Manschreck (1555; NY: Oxford Univ. Press, 1965), pp. 217-23 Zwingli, Ulrich – ‘The Eucharist’ in Commentary on True &amp; False Religion eds. Jackson &amp; Heller (1525; Labyrinth Press, 1981), pp. 198-253 Bucer, Martin – ‘On the Eucharist, and first the defense of Mr. Luther, then of those [the Reformed] whom the adversary makes out to be Berengarians’ in A Defense against the Catholic Principle… tr. Michael McFadden (Strasbourg, Rihel, 1536), pp. 41-62 Calvin, John ch. 29. ‘The Supper of the Lord’ in Instruction in Faith (1537) tr. Paul T. Fuhrman (Philadelphia: Westminster Press, 1949), pp. 70-72 Short Treatise on the Lord’s Supper (1541) in Tracts 2.163-198 Martin Klauber: “Joachim Westphal (1510-1574) represented the so-called true or Gnesio-Lutheran movement that attempted to preserve the purity of Luther’s thought against the alleged compromises of the Philippists, those who followed the lead of Philip Melancthon. As the superintendent of the state church in Hamburg, Westphal was well positioned to enter the fray of theological disputes… For the Gnesio-Lutherans the issue of Christ’s physical presence in the Lord’s Supper was of paramount importance. The formula borrowed from Luther was that the body and blood of Christ are truly and substantially present ‘in, with and under’ the consecrated elements. Those who partake, believers and unbelievers alike, receive the true body and blood of Christ Himself… This so called [sacramental] union is often referred to as ‘consubstantiation’, although Luther did not use the term… Calvin[‘s]… view [was] that although Christ is not present physically in the bread and in the wine, He is present spiritually. The sacrament would not, therefore, be an empty sign. Calvin followed Augustine closely… If, as the Lutherans believed, Christ is physically present… both believers and unbelievers who participate in the Eucharist partake of the body and blood of Christ… Calvin argued, by contrast, that only believers truly partake of the body and blood of the Lord. He posited this position in the Institutes as well as in his Petit traicte de la saincte cene (1541).” – ‘Introduction’ in Beza, Clear &amp; Simple Treatise on the Lord’s Supper A Treatise on the Sacraments of Baptism &amp; the Lord’s Supper (Edinburgh, 1837) 190 pp. no ToC 12. ‘Of the Lord’s Supper’ in Institutes of the Christian Religion: 1541 French Edition tr. Elsie A. McKee (1541; Eerdmans, 2009), pp. 546-84 ‘On [2] Excommunication, [3-4]Separation, the Lord’s Supper &amp; [5] Pastors’ in A Short Instruction for to Arm All Good Christian People against the Pestiferous Errors of the Common Sect of Anabaptists (London: Daye, 1549), no page numbers ‘Mutual Consent in Regard to the Sacraments Between the Ministers of the Church of Zurich &amp; John Calvin’ (1554) in Tracts 2:199-244 Defense of the Sound &amp; Orthodox Doctrine of the Sacraments (1555) Klauber: “Seizing on the publication of the Consensus [Tigurinus of Zurich and Geneva, 1549], Westphal began to criticize it publicly, which initiated the so-called second sacramental war between the Lutherans and the Reformed… Westphal initially composed three treatises [in 1552, 1553 &amp; 1555] critical of the Consensus… Westphal spared no words in his attack on his ‘godless’ opponents and their ‘satanic blasphemies.’… Calvin did not become aware of Westphal’s criticism until 1554, when Bullinger brought it to his attention. He was otherwise occupied with a host of issues including the Servetus affair, but he told Bullinger that he would respond. He did so in 1555, although he believed that Westphal’s Farrago was a ‘light-weight book’ and not worthy of a personal response… But Calvin decided to take the matter upon himself in his Defense of the Sound and Orthodox Doctrine of the Sacraments… and the literary war was on… He did not mention Westphal by name, hoping for peace with the Lutherans, especially since he had garnered Melanchthon’s support.” – Ibid. ‘Second Defense of the Sacraments in Answer to the Calumnies of Joachim Westphal’ (1556) in Tracts 2:245-345 Klauber: “Westphal responded [to Calvin’s Defense of the Sound and Orthodox Doctrine of the Sacraments, 1555] with his Just Defense Against the False Accusations of a Certain Sacramentarian… Calvin responded in 1556 with his Second Defense… This work was much more vituperative and personal than the first, and Calvin denied that he had made the sacrament an empty sign, saying that he was in agreement with the [Lutheran] Augsburg Confession [Article X, 1530]. Although he asserted his admiration of Zwingli, Calvin made it clear that there were significant distinctions between their views of Christ’s presence in the Lord’s Supper.” – Ibid. Last Admonition to Joachim Westphal (1557) in Tracts 2:346 Klauber: “Westphal in turn responded [to Calvin’s Second Defense…] in 1557 with his Confession of Faith on the Sacrament of the Eucharist… Calvin then answered in 1557 with The Last Admonition of John Calvin to Joachim Westphal Who if He Heeds It Not Must Henceforth Be Treated in the Way Which Paul Prescribed for Obstinate Heretics… Any real attempt at accord was lost when Calvin accused Westphal of stupidity and impudence. It would have to be left to Calvin’s colleagues, such as Beza, to attempt to repair the rupture. In true form Westphal responded in 1558 with two works, including his Defense of the Lord’s Supper against the Errors and Calumnies of John Calvin. This is a lengthy volume covering a host of topics including infant baptism, private absolution, and festival days, but the Eucharist figures by far the most prominently…</p></blockquote>

— Ratramnus, The Book of Bertram the Priest, pp. | Dr. R. Scott Clark:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+the+eighth+century%2C+Carolingian+theologians+at+the+Abbey+of+Corbie+%5BFrance%5D%2C+Paschasius+Radbertus+%28ca.+790-ca.+860%29+and+Ratramnus+%28d.+ca.+868%29+each+wrote+treatises+on+the+Lord%E2%80%99s+Supper.+Both+were+titled+%E2%80%98On+the+Body+and+Blood+of+the+Lord%E2%80%99.+They+first+debated+what+is+%E2%80%98true%E2%80%99+and+what+is+a+%E2%80%98figure%E2%80%99+in+the+Lord%E2%80%99s+Supper.+Radbertus+argued+that+the+sign+becomes+the+thing+signified.+In+response%2C+Ratramnus+argued+that+if+the+sign+becomes+the+thing+signified%2C+then+we+have+no+sacrament+since+Christ+is+received+by+faith%2C+not+sight%3B+we+would+have+no+need+of+faith.+If+we+have+no+faith%2C+we+have+no+Christ+and+no+salvation.+In+the+early+sixteenth+century%2C+that+debate+was+renewed+by+the+Reformed+and+Lutheran+theologians%2C+with+Lutherans+republishing+Radbertus+and+the+Reformed%2C+Ratramnus.%E2%80%9D+%E2%80%93+%E2%80%98Foreward%E2%80%99%2C+p.+ix+in+Theodore+Beza%2C+A+Clear+%26+Simple+Treatise+on+the+Lord%E2%80%99s+Supper+%28RHB%2C+2016%29+Some+other+9th+century+theologians+who+denied+that+Christ%E2%80%99s+body+and+blood+were+materially+eaten+in+the+Eucharist+during+the+Carolingian+Eucharistic+Controversy+were%3A+Gottschalk+of+Orbais%2C+Alcuin+of+York+%26+Florus+Magister.+The+same+men+were+involved+in+a+controversy+over+predestination.+Generally+speaking%2C+the+Carolingian+theologians+had+a+high+view+of+predestination+and+took+a+spiritual+view+of+the+Lord%E2%80%99s+Supper.+Ratramnus+took+the+central+role+in+the+Eucharistic+controversy%3B+Gottschalk+took+the+central+role+in+the+predestinarian+controversy.+.+.+Post-Reformation+Anthology+of+Heppe%2C+Heinrich+%E2%80%93+ch.+26%2C+%E2%80%98The+Lord%E2%80%99s+Supper%E2%80%99+in+Reformed+Dogmatics+ed.+Ernst+Bizer%2C+tr.+G.T.+Thomson+%281861%3B+Wipf+%26+Stock%2C+2007%29%2C+pp.+627-57+Heppe+%281820%E2%80%931879%29+was+a+German+reformed+theologian.+.+.+1500%E2%80%99s+Works+Melanchthon%2C+Philip+ch.+27.+%E2%80%98On+Participation+in+the+Table+of+the+Lord%E2%80%99+in+The+Loci+Communes+of+Philip+Melanchthon%E2%80%A6+tr.+Charles+L.+Hill+%281521%3B+Boston%3A+Meador+Publishing%2C+1944%29%2C+pp.+258-60+Though+Melanchthon+%281497%E2%80%931560%29+was+a+Lutheran%2C+this+work+of+his+was+the+first+%E2%80%98systematic+theology%E2%80%99+of+the+Reformation%2C+and%2C+as+it+was+very+influential+on+reformed+systematic+theologies+following+shortly+thereafter.+Article+10%2C+Of+the+Holy+Supper+in+The+Apology+of+the+Augsburg+Confession+tr%3A+F.+Bente+%26+W.+H.+T.+Dau+%281531%29+ch.+22.+%E2%80%98Of+the+Supper+of+Christ+the+Lord%E2%80%99+in+Melanchthon+on+Christian+Doctrine%2C+Loci+Communes%2C+1555+tr.+Clyde+L.+Manschreck+%281555%3B+NY%3A+Oxford+Univ.+Press%2C+1965%29%2C+pp.+217-23+Zwingli%2C+Ulrich+%E2%80%93+%E2%80%98The+Eucharist%E2%80%99+in+Commentary+on+True+%26+False+Religion+eds.+Jackson+%26+Heller+%281525%3B+Labyrinth+Press%2C+1981%29%2C+pp.+198-253+Bucer%2C+Martin+%E2%80%93+%E2%80%98On+the+Eucharist%2C+and+first+the+defense+of+Mr.+Luther%2C+then+of+those+%5Bthe+Reformed%5D+whom+the+adversary+makes+out+to+be+Berengarians%E2%80%99+in+A+Defense+against+the+Catholic+Principle%E2%80%A6+tr.+Michael+McFadden+%28Strasbourg%2C+Rihel%2C+1536%29%2C+pp.+41-62+Calvin%2C+John+ch.+29.+%E2%80%98The+Supper+of+the+Lord%E2%80%99+in+Instruction+in+Faith+%281537%29+tr.+Paul+T.+Fuhrman+%28Philadelphia%3A+Westminster+Press%2C+1949%29%2C+pp.+70-72+Short+Treatise+on+the+Lord%E2%80%99s+Supper+%281541%29+in+Tracts+2.163-198+Martin+Klauber%3A+%E2%80%9CJoachim+Westphal+%281510-1574%29+represented+the+so-called+true+or+Gnesio-Lutheran+movement+that+attempted+to+preserve+the+purity+of+Luther%E2%80%99s+thought+against+the+alleged+compromises+of+the+Philippists%2C+those+who+followed+the+lead+of+Philip+Melancthon.+As+the+superintendent+of+the+state+church+in+Hamburg%2C+Westphal+was+well+positioned+to+enter+the+fray+of+theological+disputes%E2%80%A6+For+the+Gnesio-Lutherans+the+issue+of+Christ%E2%80%99s+physical+presence+in+the+Lord%E2%80%99s+Supper+was+of+paramount+importance.+The+formula+borrowed+from+Luther+was+that+the+body+and+blood+of+Christ+are+truly+and+substantially+present+%E2%80%98in%2C+with+and+under%E2%80%99+the+consecrated+elements.+Those+who+partake%2C+believers+and+unbelievers+alike%2C+receive+the+true+body+and+blood+of+Christ+Himself%E2%80%A6+This+so+called+%5Bsacramental%5D+union+is+often+referred+to+as+%E2%80%98consubstantiation%E2%80%99%2C+although+Luther+did+not+use+the+term%E2%80%A6+Calvin%5B%E2%80%98s%5D%E2%80%A6+view+%5Bwas%5D+that+although+Christ+is+not+present+physically+in+the+bread+and+in+the+wine%2C+He+is+present+spiritually.+The+sacrament+would+not%2C+therefore%2C+be+an+empty+sign.+Calvin+followed+Augustine+closely%E2%80%A6+If%2C+as+the+Lutherans+believed%2C+Christ+is+physically+present%E2%80%A6+both+believers+and+unbelievers+who+participate+in+the+Eucharist+partake+of+the+body+and+blood+of+Christ%E2%80%A6+Calvin+argued%2C+by+contrast%2C+that+only+believers+truly+partake+of+the+body+and+blood+of+the+Lord.+He+posited+this+position+in+the+Institutes+as+well+as+in+his+Petit+traicte+de+la+saincte+cene+%281541%29.%E2%80%9D+%E2%80%93+%E2%80%98Introduction%E2%80%99+in+Beza%2C+Clear+%26+Simple+Treatise+on+the+Lord%E2%80%99s+Supper+A+Treatise+on+the+Sacraments+of+Baptism+%26+the+Lord%E2%80%99s+Supper+%28Edinburgh%2C+1837%29+190+pp.+no+ToC+12.+%E2%80%98Of+the+Lord%E2%80%99s+Supper%E2%80%99+in+Institutes+of+the+Christian+Religion%3A+1541+French+Edition+tr.+Elsie+A.+McKee+%281541%3B+Eerdmans%2C+2009%29%2C+pp.+546-84+%E2%80%98On+%5B2%5D+Excommunication%2C+%5B3-4%5DSeparation%2C+the+Lord%E2%80%99s+Supper+%26+%5B5%5D+Pastors%E2%80%99+in+A+Short+Instruction+for+to+Arm+All+Good+Christian+People+against+the+Pestiferous+Errors+of+the+Common+Sect+of+Anabaptists+%28London%3A+Daye%2C+1549%29%2C+no+page+numbers+%E2%80%98Mutual+Consent+in+Regard+to+the+Sacraments+Between+the+Ministers+of+the+Church+of+Zurich+%26+John+Calvin%E2%80%99+%281554%29+in+Tracts+2%3A199-244+Defense+of+the+Sound+%26+Orthodox+Doctrine+of+the+Sacraments+%281555%29+Klauber%3A+%E2%80%9CSeizing+on+the+publication+of+the+Consensus+%5BTigurinus+of+Zurich+and+Geneva%2C+1549%5D%2C+Westphal+began+to+criticize+it+publicly%2C+which+initiated+the+so-called+second+sacramental+war+between+the+Lutherans+and+the+Reformed%E2%80%A6+Westphal+initially+composed+three+treatises+%5Bin+1552%2C+1553+%26+1555%5D+critical+of+the+Consensus%E2%80%A6+Westphal+spared+no+words+in+his+attack+on+his+%E2%80%98godless%E2%80%99+opponents+and+their+%E2%80%98satanic+blasphemies.%E2%80%99%E2%80%A6+Calvin+did+not+become+aware+of+Westphal%E2%80%99s+criticism+until+1554%2C+when+Bullinger+brought+it+to+his+attention.+He+was+otherwise+occupied+with+a+host+of+issues+including+the+Servetus+affair%2C+but+he+told+Bullinger+that+he+would+respond.+He+did+so+in+1555%2C+although+he+believed+that+Westphal%E2%80%99s+Farrago+was+a+%E2%80%98light-weight+book%E2%80%99+and+not+worthy+of+a+personal+response%E2%80%A6+But+Calvin+decided+to+take+the+matter+upon+himself+in+his+Defense+of+the+Sound+and+Orthodox+Doctrine+of+the+Sacraments%E2%80%A6+and+the+literary+war+was+on%E2%80%A6+He+did+not+mention+Westphal+by+name%2C+hoping+for+peace+with+the+Lutherans%2C+especially+since+he+had+garnered+Melanchthon%E2%80%99s+support.%E2%80%9D+%E2%80%93+Ibid.+%E2%80%98Second+Defense+of+the+Sacraments+in+Answer+to+the+Calumnies+of+Joachim+Westphal%E2%80%99+%281556%29+in+Tracts+2%3A245-345+Klauber%3A+%E2%80%9CWestphal+responded+%5Bto+Calvin%E2%80%99s+Defense+of+the+Sound+and+Orthodox+Doctrine+of+the+Sacraments%2C+1555%5D+with+his+Just+Defense+Against+the+False+Accusations+of+a+Certain+Sacramentarian%E2%80%A6+Calvin+responded+in+1556+with+his+Second+Defense%E2%80%A6+This+work+was+much+more+vituperative+and+personal+than+the+first%2C+and+Calvin+denied+that+he+had+made+the+sacrament+an+empty+sign%2C+saying+that+he+was+in+agreement+with+the+%5BLutheran%5D+Augsburg+Confession+%5BArticle+X%2C+1530%5D.+Although+he+asserted+his+admiration+of+Zwingli%2C+Calvin+made+it+clear+that+there+were+significant+distinctions+between+their+views+of+Christ%E2%80%99s+presence+in+the+Lord%E2%80%99s+Supper.%E2%80%9D+%E2%80%93+Ibid.+Last+Admonition+to+Joachim+Westphal+%281557%29+in+Tracts+2%3A346+Klauber%3A+%E2%80%9CWestphal+in+turn+responded+%5Bto+Calvin%E2%80%99s+Second+Defense%E2%80%A6%5D+in+1557+with+his+Confession+of+Faith+on+the+Sacrament+of+the+Eucharist%E2%80%A6+Calvin+then+answered+in+1557+with+The+Last+Admonition+of+John+Calvin+to+Joachim+Westphal+Who+if+He+Heeds+It+Not+Must+Henceforth+Be+Treated+in+the+Way+Which+Paul+Prescribed+for+Obstinate+Heretics%E2%80%A6+Any+real+attempt+at+accord+was+lost+when+Calvin+accused+Westphal+of+stupidity+and+impudence.+It+would+have+to+be+left+to+Calvin%E2%80%99s+colleagues%2C+such+as+Beza%2C+to+attempt+to+repair+the+rupture.+In+true+form+Westphal+responded+in+1558+with+two+works%2C+including+his+Defense+of+the+Lord%E2%80%99s+Supper+against+the+Errors+and+Calumnies+of+John+Calvin.+This+is+a+lengthy+volume+covering+a+host+of+topics+including+infant+baptism%2C+private+absolution%2C+and+festival+days%2C+but+the+Eucharist+figures+by+far+the+most+prominently%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Ratramnus%2C+The+Book+of+Bertram+the+Priest%2C+pp.+%7C+Dr.+R.+Scott+Clark%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa633cd4f23.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a633cd4f23.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-lords-supper#:~:text=In%20the%20eighth%20century%2C%20Carolingian%20theologians,figures%20by%20far%20the%20most%20prominently&amp;text=In%20the%20eighth%20century%2C%20Carolingian%20theologians%20at%20the&amp;text=the%20Eucharist%20figures%20by%20far%20the%20most%20prominently" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Now besides the sacred signs of God’s own institution, we know that natural signs have also place in divine worship; thus kneeling in time of prayer signifies the submission of our hearts and minds, the lifting up of our eyes and hands signifies the elevation of our affections, the renting of the garments signified the renting of the heart by sorrow, standing with a religious respect to that which is before us, signifies veneration or reverence, sitting at table signifies familiarity and fellowship. ‘For which of you,’ says our Master, ‘having a servant plowing or feeding cattle, will say unto him by and by, when he is come from the field, go and sit down to meat.’ [Lk. 17:7] All these signs have their significations from nature. And if it be said that howbeit sitting at our common-tables be a sign natural, to signify familiarity amongst us, yet nature has not given such a signification to sitting at the Lord’s Table, I answer that sitting is a natural sign of familiarity at what table soever it be used. At the heavenly table in the Kingdome of Glory familiarly is expressed and signified by sitting, Mt. 8:11, ‘Many shall come from the east and west, and shall sit down with Abraham, etc.’ Much more then at the spiritual table in the Kingdom of Grace. The difference betwixt other common tables and the Lord’s Table can infer no more but that with great humility we ought to addresse ourselves unto it: yet still we are to make use of our familiarity with Christ ut tanquam in eodem toro accumbentes, as says Chrysostom. Wherefore we do not there so look to Christ in his princely throne and glorious majesty, exalted far above all principalities and powers, as to forget that He is our loving and kind banqueter, who has admitted us to that familiar fellowship with Him, which is signified by our sitting at his table.</p></blockquote>

nd+banqueter%2C+who+has+admitted+us+to+that+familiar+fellowship+with+Him%2C+which+is+signified+by+our+sitting+at+his+table.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies%2C+%281637%29%2C+pt.+3%2C+ch.+5%2C+pp.+85-86&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7dc555aaa8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7dc555aaa8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/sitting-at-the-table#:~:text=Now%20besides%20the%20sacred%20signs%20of,by%20our%20sitting%20at%20his%20table&amp;text=Now%20besides%20the%20sacred%20signs%20of%20God%E2%80%99s%20own&amp;text=is%20signified%20by%20our%20sitting%20at%20his%20table" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-37a8691e4e" data-kw="">
<blockquote><p>We see here, nor see only, but even taste and touch, how gracious the Lord is, in that he is pleased even to unrobe his graces of their natural lustre, to overshadow his promises; and, as it were, to obscure his glory, that they might be made proportioned to our dull and earthly senses; to lock up so rich mysteries, as lie hidden in the sacraments, in a bason of water, or a morsel of bread.

When he was invisible, by reason of that infinite distance between the divine nature and ours, he made himself to be seen in the flesh: and now that his very flesh is to us again invisible, by reason of that vast distance between his place and ours, he hath made even it, in a mystical sense, to be seen and tasted in the sacrament.

Oh then, since God doth thus far humble himself and his graces, even unto our senses, let not us, by an odious ingratitude, humble them yet lower, even under our feet. Let us not trample on the blood of the covenant, by taking it into a noisome sink, into a dirty and earthy heart. He that eats Christ in the sacrament with a foul mouth, and receives him into an uncleansed and sinful soul, doth all one as if he should sop the bread he eats, in dirt, or lay up his richest treasures in a sink.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), iii, 10-11.</span></figcaption>

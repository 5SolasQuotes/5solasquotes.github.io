<main class="wrap"><figure class="quote" id="q-fb783741df" data-kw="">
<blockquote><p>Whether sanctification or regeneration precedes justification, or the contrary? It is distinguished.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-96f1f477b9" data-kw="">
<blockquote><p>38. One act of faith is direct toward its object, another reflexive toward itself. Also the first act of faith is to believe, the second to work through charity and by means of it. 39. This latter act is the instrument of our sanctification, which is mortification of the old man according to all parts and faculties that are in us, and vivification of the new according to the same. But that is not perfect in the way, but such it will be in the goal, nor is it given here consqummated, but only begun. 40. Sanctification is succeeded by glorification…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/spanheim-sr-friedrich.html">Spanheim, Sr., Friedrich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), ‘Miscellaneous Theological Disputation’, trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

— Spanheim, Sr., Friedrich, Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), ‘Miscellaneous Theological Disputation’, trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C38.+One+act+of+faith+is+direct+toward+its+object%2C+another+reflexive+toward+itself.+Also+the+first+act+of+faith+is+to+believe%2C+the+second+to+work+through+charity+and+by+means+of+it.+39.+This+latter+act+is+the+instrument+of+our+sanctification%2C+which+is+mortification+of+the+old+man+according+to+all+parts+and+faculties+that+are+in+us%2C+and+vivification+of+the+new+according+to+the+same.+But+that+is+not+perfect+in+the+way%2C+but+such+it+will+be+in+the+goal%2C+nor+is+it+given+here+consqummated%2C+but+only+begun.+40.+Sanctification+is+succeeded+by+glorification%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Spanheim%2C+Sr.%2C+Friedrich%2C+Disputationum+Theologicarum+Miscellaneorum+Pars+Prima+%28d.+1649%3B+Geneva%3A+Chou%C3%ABt%2C+1652%29%2C+%E2%80%98Miscellaneous+Theological+Disputation%E2%80%99%2C+trans.+AI+by+Roman+Prestarri+at+Confessionally+Reformed+Theology+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F96f1f477b9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/96f1f477b9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/faith#:~:text=38.%20One%20act%20of%20faith%20is,40.%20Sanctification%20is%20succeeded%20by%20glorification&amp;text=38.%20One%20act%20of%20faith%20is%20direct%20toward&amp;text=only%20begun.%2040.%20Sanctification%20is%20succeeded%20by%20glorification" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-06fa1177e8" data-kw="">
<blockquote><p>Effects arisen and dependent from faith considered organically are: … IV. Sanctification strictly so called, or the excitation and study of new holiness in the inner and outer man, 2 Cor. 7:1. To which pertains the practice of repentance and faith and a purged conscience… Now the proper character of this new practice of holiness is perfection or integrity, which consists in this: … 5. That they are perfect with perfection of the greater parts, namely, the inner and outer—that is, that they worship God not hypocritically but sincerely. 6. That moreover they are perfect with perfection of the lesser parts—that is, they live according to all the commandments of God as to the ordinary and composed course of life, so that they know no commandment of God or set before themselves any which they have resolved to transgress knowingly and willingly, Phil. 1:1 [This should be a different reference]; Rom. 7:15–16. 7. That they also in their own manner attain some perfection of degrees: namely, by desire, affection, purpose, study, and endeavor—yet not by effect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>
<div class="actions"><button class="copy" data-copy="“Effects arisen and dependent from faith considered organically are: … IV. Sanctification strictly so called, or the excitation and study of new holiness in the inner and outer man, 2 Cor. 7:1. To which pertains the practice of repentance and faith and a purged conscience… Now the proper character of this new practice of holiness is perfection or integrity, which consists in this: … 5. That they are perfect with perfection of the greater parts, namely, the inner and outer—that is, that they worship God not hypocritically but sincerely. 6. That moreover they are perfect with perfection of the lesser parts—that is, they live according to all the commandments of God as to the ordinary and composed course of life, so that they know no commandment of God or set before themselves any which they have resolved to transgress knowingly and willingly, Phil. 1:1 [This should be a different reference]; Rom. 7:15–16. 7. That they also in their own manner attain some perfection of degrees: namely, by desire, affection, purpose, study, and endeavor—yet not by effect.”

pendent%20from%20faith,study%2C%20and%20endeavor%E2%80%94yet%20not%20by%20effect&amp;text=Effects%20arisen%20and%20dependent%20from%20faith%20considered%20organically&amp;text=affection%2C%20purpose%2C%20study%2C%20and%20endeavor%E2%80%94yet%20not%20by%20effect" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d0d214f616" data-kw="">
<blockquote><p>Synonyms [of regeneration] more properly signifying are: I. Sanctification, because it produces holiness, that is, conformity of man with the law, Jn. 17:17, 19; 1 Cor. 1:2; Eph. 5:26. It is also called sanctification of the Spirit, 2 Thess. 2:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-cc531a15f1" data-kw="">

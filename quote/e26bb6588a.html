<main class="wrap"><figure class="quote" id="q-e26bb6588a" data-kw="">
<blockquote><p>It is known that there are people in Africa who even unto this day do make traffic of their own Children, and do sell them for Slaves, never expecting to see them again; It is the great Mart they make, and Nations, at a great distance, do resort unto it. We shall find it manifest in the tenth of Genesis both by the names and the description of those places where the sons of Noah did after the Deluge make their first plantations, hat these Barbarians who did sell their Children to be perpetual vassals were descended from Cham, nay even from Canaan of whom it was prophesied, that he should be the Servant of the Servants of his Brothers[.]

It is wonderful indeed that this malediction having constantly continued through the Traverse of so many Ages, should so unhappily descend even to our days, and to fulfil this malediction that this unnatural people should deprive themselves of that which ought to be most precious to them, selling their Children, their own bowels, to labour in the bowels of the Earth, and to live in a slavery worse than death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-d-espagne.html">Jean D’Espagne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The joyful convert: represented in a short but elegant sermon preached at the baptizing of a Turk, who renouncing the law of Mahomet, and having given abundant satisfaction for the reasons and soundness of his conversion, was baptized in the French Church May 2. 1658. the Marquis of Montpouillian, a</cite>, (London: I. Leach, 1658), pp 2-3.</span></figcaption>

a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e26bb6588a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/09/28/jean-despagne-on-africans-enslaving-their-children/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><figure class="quote" id="q-9cdcbe8cb2" data-kw="">
<blockquote><p>Now all this being unquestionably true of the Jewish Sanhedrin: if we should suppose, that they had no supreme Sanhedrin but that which had the power of civil Magistracy, then I ask where is that Christian State, which was, or is, or ought to be molded according to this pattern. Must ministers have vote in parliament? Must they be civil lawyers? Must all criminal and capital judgments be according to the Judicial Law of Moses, and none otherwise? Must there be no civil punishment, without previous admonition of the offender? Must Parliaments sit, as it were in the Temple of God, and interpret Scripture, which sense is true, and which false, and determine controversies of faith and cases of conscience, and judge of all false doctrines? Yet all this must be if there be a parallel made with the Jewish Sanhedrin. I know some divines hold, that the Judicial Law of Moses, so far as concerns the punishments of sins against the moral Law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, etc. ought to be a rule to the Christian Magistrate. and for my part, I wish more respect were had to it, and that it were more consulted with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Please enjoy Aaron’s Rod</cite>, (reprint, Sprinkle) p. 2. Gillespie is arguing against an Erastian:</span></figcaption>

%20being%20unquestionably%20true%20of%20the&amp;text=it%2C%20and%20that%20it%20were%20more%20consulted%20with" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-896bf0dbf5" data-kw="">
<blockquote><p>There is no community but is major [has authority] in this, that it can appoint its own tutors; and though it cannot be without all rulers [due to the inclinations of nature], yet it may well be without this or that prince and ruler, and, therefore, may resume its power, which it gave conditionally to the ruler for its own safety and good; and in so far as this condition is violated, and power turned to the destruction of the commonwealth, it is to be esteemed as not given; and though the people be not a politic judge in their own cause, yet in case of manifest oppression, nature can teach them to oppose defensive violence against offensive. A community in its politic body is also above any ruler, and may judge what is manifestly destructive to itself.</p></blockquote>

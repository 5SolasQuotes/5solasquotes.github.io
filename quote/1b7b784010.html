<main class="wrap"><figure class="quote" id="q-1b7b784010" data-kw="">
<blockquote><p>For rulers are not a terror to good works, but to evil. Do you want to be unafraid of the authority? Do what is good, and you will have praise from the same. (Romans 13:3)

The rewards for well-doing are, in the apostle’s language, expressed by the term “praise,” to signify benignant regards, careful protection, sure defence, and advancement in comfort and happiness; and this, after the example of that divine providence to which humble and faithful servants of God look up with trust and confidence, enjoying a constant peace, and resting in the assurance of the ever-watchful care of their great Master.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-craig.html">Robert Craig</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theocracy or the principles of the Jewish religion and polity adapted to all nations and times</cite>, (Edinburgh, 1848), pp 279-80.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c81f8ffed3" data-kw="">
<blockquote><p>Upon perusal of Mr. Ascham’s book you left with me, I find not myself in my understanding thereby convinced of the necessity or lawfulness of conforming unto, or complying with an unjust prevailing power further than I was before persuaded. It might be lawful or necessary so to do: viz. as I paying taxes and submitting to some other things (in themselves not unlawful) by 〈1 page missing〉 3. Without any explicit or implicit acknowledgment of the justice and legality of their power: I may submit to the [Greek] (to the force), but not acknowledge the [Greek] (the authority), or by any [of] my voluntary act give strength, assistance or countenance thereunto.

4. Without any prejudice unto the claim of the oppressed party that has a right, title; or casting myself into an incapacity of lending him my due and bounden assistance, if in time to come it may be useful to him towards the recovery of his right.

5. Where I may reasonably and bona fide [with good faith] presume the oppressed power (to whom my obedience is justly due), if he perfectly knew the present condition I am in together with the exigence and necessity of the present case and all of circumstances thereof, would give his willing consent to such my conformity and compliance. So that upon the whole matter and in short, I conceive I may so far submit unto the impositions or comply with the persons of a prevailing usurped power unjustly commanding things not in themselves unlawful, or make use of their power to protect one from other’s injuries, as I may submit unto, comply with or make use of a highway thief or robber when I am fallen into his hands and lie at his mercy. As for Mr. Ascham ‘s discourse, though it be handsomely framed, yet all the strength of it (to my seeming) lie’s upon two principles, which (if he would speak out) would be in plain English these:

1. That self-preservation is the first and chiefest obligation in the world, to which all other bonds and relations (at least between man and man) must give place.

2. That no oath, at least no imposed oath, at what terms soever expressed, binds the taker further than he intended to bind himself thereby; and, it is presumed, that no man intended to bind himself to the prejudice of his own safety. [These are] Two dangerous and desperate principles which evidently tend: 1. to the taking away of all Christian fortitude and suffering in a righteous cause; 2. to the encouraging of daring and ambitious spirits to attempt continual innovations, with this confidence, that if they can by any ways (how unjust soever) possess themselves of the supreme power, they ought to be submitted unto; 3. to the obstructing unto the oppressed party all possible ways and means, without a miracle, of ever recovering that just right of which he shall have been unjustly dispossessed; and (to omit further instancing) 4. to the bringing in of atheism with the contempt of God and all religion, whilst every man, by making his own preservation the measure of all his duties and actions, makes himself thereby his own idol.</p></blockquote>

<blockquote><p>Of the forensic laws of Moses, those are perpetual which are of common right, or which have something moral. However, those have been abrogated which are of particular right, that is, such laws as were specially for the Mosaic constitution, and which have something ceremonial attached.</p></blockquote>

<blockquote><p>Conclusion III. We hold that the Church of God has power to prescribe ordinances rules, or traditions touching time and place of God’s worship and touching order and comeliness to be used in the same; and in this regard, Paul, 1 Cor. 11:2, commends the Church of Corinth for keeping his traditions, and Acts 15, the Council at Jerusalem decreed that the Churches of the Gentiles should abstain from blood and from things strangled. This decree is termed a tradition and it was in force among them so long as the offence of the Jews remained. And this kind of traditions, whether made by general Councils or particular Synods, we have care to maintain and observe; these caveats being remembered: first that they prescribe nothing childish or absurd to be done; secondly that they be not imposed as any parts of God’s worship; thirdly, that they be severed from superstition or opinion of merit; lastly that the Church of God be not burdened with the multitude of them. And thus much we hold touching traditions.</p></blockquote>

<blockquote><p>It was formerly stated, that one in which a divine right or the warrant for any duty is established, is by approved examples in scripture. The word of God contains examples to persons in every character and station of life. In particular, it exhibits examples of godly magistrates. But where do we read, in all the book of God, of approved magistrates who confined themselves, in their official capacity, to civil matters, and the secular interests of mankind, and who did not employ their authority for the advancement of religion? We have a large account of the conduct of Moses and Joshua, David and Solomon, Asa and Jehoshaphat, Hezekiah and Josiah. Who will deny that their actions are recorded as an example to rulers? But they are commended chiefly for the warm zeal and activity, which they displayed in their station, in settling or reforming religion, providing for the instruction of their subjects, and the due administration of divine ordinances. No magistrate, who consults the Bible, will ever imagine that religious matters are excluded from his province. This notion must have been imbibed from some very different source.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On church establishments. Extracts from Statement of the difference between the profession of the Reformed Church of Scotland, as adopted by Seceders; and the profession contained in the New Testimony and other acts, as adopted by the General Associate Synod; particularly on the power of civil magis</cite>, (Glasgow, 1832), p. 17.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>
<div class="actions"><button class="copy" data-copy="“It was formerly stated, that one in which a divine right or the warrant for any duty is established, is by approved examples in scripture. The word of God contains examples to persons in every character and station of life. In particular, it exhibits examples of godly magistrates. But where do we read, in all the book of God, of approved magistrates who confined themselves, in their official capacity, to civil matters, and the secular interests of mankind, and who did not employ their authority for the advancement of religion? We have a large account of the conduct of Moses and Joshua, David and Solomon, Asa and Jehoshaphat, Hezekiah and Josiah. Who will deny that their actions are recorded as an example to rulers? But they are commended chiefly for the warm zeal and activity, which they displayed in their station, in settling or reforming religion, providing for the instruction of their subjects, and the due administration of divine ordinances. No magistrate, who consults the Bible, will ever imagine that religious matters are excluded from his province. This notion must have been imbibed from some very different source.”

— Thomas M’Crie, On church establishments. Extracts from Statement of the difference between the profession of the Reformed Church of Scotland, as adopted by Seceders; and the profession contained in the New Testimony and other acts, as adopted by the General Associate Synod; particularly on the power of civil magis, (Glasgow, 1832), p. 17.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+was+formerly+stated%2C+that+one+in+which+a+divine+right+or+the+warrant+for+any+duty+is+established%2C+is+by+approved+examples+in+scripture.+The+word+of+God+contains+examples+to+persons+in+every+character+and+station+of+life.+In+particular%2C+it+exhibits+examples+of+godly+magistrates.+But+where+do+we+read%2C+in+all+the+book+of+God%2C+of+approved+magistrates+who+confined+themselves%2C+in+their+official+capacity%2C+to+civil+matters%2C+and+the+secular+interests+of+mankind%2C+and+who+did+not+employ+their+authority+for+the+advancement+of+religion%3F+We+have+a+large+account+of+the+conduct+of+Moses+and+Joshua%2C+David+and+Solomon%2C+Asa+and+Jehoshaphat%2C+Hezekiah+and+Josiah.+Who+will+deny+that+their+actions+are+recorded+as+an+example+to+rulers%3F+But+they+are+commended+chiefly+for+the+warm+zeal+and+activity%2C+which+they+displayed+in+their+station%2C+in+settling+or+reforming+religion%2C+providing+for+the+instruction+of+their+subjects%2C+and+the+due+administration+of+divine+ordinances.+No+magistrate%2C+who+consults+the+Bible%2C+will+ever+imagine+that+religious+matters+are+excluded+from+his+province.+This+notion+must+have+been+imbibed+from+some+very+different+source.%E2%80%9D%0A%0A%E2%80%94+Thomas+M%E2%80%99Crie%2C+On+church+establishments.+Extracts+from+Statement+of+the+difference+between+the+profession+of+the+Reformed+Church+of+Scotland%2C+as+adopted+by+Seceders%3B+and+the+profession+contained+in+the+New+Testimony+and+other+acts%2C+as+adopted+by+the+General+Associate+Synod%3B+particularly+on+the+power+of+civil+magis%2C+%28Glasgow%2C+1832%29%2C+p.+17.&amp;url

<blockquote><p>Recently, we published John Davenant’s reply to false aspersions of Arminianism made against his fellow delegate to the Synod of Dort, Joseph Hall. In this post, we publish the letter from Hall that gave occasion to Davenant’s reply. This letter discusses the question of whether Rome is a false church simpliciter and the accusations of Arminianism wrongly made against Hall (in a subsequent post we will publish Davenant’s reply to the first of these points):

MY Lord, I send you this little Pamphlet for your censure; It is not credible how strangely I have been traduced every where, for that, which I conceive to be the common opinion of reformed Divines, yea of reasonable men; that is, for affirming the true being and visibility of the Roman Church; You see how clearly I have endeavoured to explicate this harmless position; yet I perceive some tough misunderstandings will not be satisfied; Your Lordship hath with great reputation spent many years in the Divinity-Chair of the famous University of Cambridge.

Let me therefore beseech you, whose Learning, and sincerity is so thoroughly approved in God’s Church, that you would freely (how shortly so ever) express your self in this point; and, if you find that I have deviated, but one hair-breadth from the Truth, correct me; If not, free me by your just sentence: What need I entreat you to pity those, whose desires of faithful offices to the Church of God are unthankfully repaid with suspicion, and slander; whose may not this case be? I had thought I had sufficiently in all my writings, and in this very last Book of mine (whence this quarrel is picked) showed my fervent zeal for Gods truth against that Antichristian faction of Rome, and yet I doubt not but your own ears can witness what I have suffered.

Yea as if this calumny were not enough, there want not those whose secret whisperings cast upon me the foul aspersions of another Sect [Arminians], whose name is as much hated, as little understood, My Lord, you know I had a place with you (though unworthy) in that famous Synod of DORT, where (howsoever sickness bereaved me of the hours of a conclusive subscription) yet, your Lordship heard me, with equal vehemency to the rest, swaying down the unreasonableness of that way: I am still the same man, and shall live and die in the suffrage of that Reverend Synod; and doe confidently avow, that those other opposed opinions [of the Arminians] cannot stand with the Doctrine of the Church of England.

But if for the composing of the differences at home (which your Lordship knows to be far different from Netherlandish) there could have been tendered any such fair propositions of accordance, as might be no prejudice to Gods truth, I should have thought it an holy, and happy project, wherein, if it be not a fault to have wished a safe peace, I am innocent. God so love me as I do the tranquillity and happiness of his Church; yet can I not so over-affect it that I would sacrifice one dram of Truth to it; To that good God do I appeal as the witness of my sincere heart to his whole Truth, and no less then ever zealous detestation of all Popery, &amp; Pelagianism. Your Lordship will be pleased to pardon this importunity, and to vouchsafe your speedy answer, to

Your much devoted and faithful Brother, JOS. EXON.</p></blockquote>

<blockquote><p>…a man may be a schismatic, forsaking communion with a true Church, and yet not be an heretic, in as much as he may rightly believe all the articles of the Faith. … Other divisions there are which are with separation, when men shall withdraw themselves from fellowship and communion with a true Church, so breaking themselves off from the body. And this (says our judicious [William] Ames)¹ by way of special appropriation, deserves most rightly to be called by the name of ‘schism’: in as much as heresy in this division is perfected and brought to a head, as also most clearly manifested, and declared, viz. in refusing of due Church-communion. ¹ Quia autem haec scissio maxime perficitur et apparet in debita communione Ecclesiastica recusanda, idcirco illa separatio per appropriationem singularium recte vocatur Schisma [But because this division is chiefly brought about and becomes evident in the refusing of due ecclesiastical communion, therefore that separation, by the appropriating of things to oneself, is rightly called ‘schism’]. Ames, Cases of Conscience on Schism Which refusal may be either partial, or total. Partial, in some particular acts and exercises, wherein a man cannot (or at least conceives he cannot) communicate without sin. Total, a rejecting, and renouncing of all religious communion. This latter all divines look upon as a schism, and that most properly so called. Which (again) may be either from the Church, or from a Church. From the Church catholic, the whole Church. That was properly Donatism (the direct error of the Seekers at this day): Or from a particular Church; and that is properly Separatism.</p></blockquote>

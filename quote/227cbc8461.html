<main class="wrap"><figure class="quote" id="q-227cbc8461" data-kw="">
<blockquote><p>The giving of alms for the support of the suffering, the poor, and the neglected has become an increasingly important liturgical concern [in ‘twentieth-century American Protestantism’]. This is expressed by the fact that the collection of alms is made during the service of worship rather than before it or after it. This was not the older practice; there has always been a certain hesitancy about collecting alms during worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hughes-oliphant-old.html">Hughes Oliphant Old</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hughes Old, Themes &amp; Variations</cite>, pp. 109-10, as cited in Terry Johnson, Leading in Worship, p. 35, fn. #12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-630b9d1cd4" data-kw="">
<blockquote><p>[Error:] To cry down the very being and use of these external ordinances as being but forms, and the spiritual frame of the heart is made all in all. Thus there are blasphemous heretics that cry down the sacraments, the ministry, yea, the Scripture itself, yea Christ Himself, as being but forms, and we ought to have communion with God immediately. But it is elsewhere to be showed that Christ has appointed an external form of communion in his Church, which consists in reading, and preaching of the Word, administration and receiving of sacraments, prayer, and Church-government and censures, with a ministry from Him, all which are of a perpetual institution for the substantials of them, and to cry down these forms which God has appointed as means to beget and increase grace, which are in the gracious use of them a solemn acknowledging and owning of God, is a Beelzebub error as I may so say and a false doctrine in the first magnitude: we are therefore to sail between these extremes neither resting upon externals in religion, as enough without Christ and regeneration, or on the contrary abolishing and neglecting the use of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652), section 3, sermon 19, p. 105</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>Therefore, a true and worthy esteem of God and other acts manifesting esteem constitute, as it were, the first matter of religion. Every honest, human act making for the honor and glory of God may be the matter or material object of religion. It is one and the same act which as submission to commandment is called obedience and as honor to God is called religion and worship.</p></blockquote>

</figure><figure class="quote" id="q-fe5f29ba12" data-kw="">
<blockquote><p>We complain that the whole doctrine of godliness is adulterated by impious dogmas; that the whole worship of God is vitiated by foul and disgraceful superstitions; that the pure institution of the sacraments has been supplanted by horrible sacrilege; that their use has been converted into a profane trafficking; that poor souls, which ought to have been ruled by the doctrine of Christ, are oppressed by cruel bondage; that nothing is seen in the Christian Church that is not deformed and debased; that the grace of Christ not only lies half-buried, but is partly torn to pieces, partly altogether extinguished.</p></blockquote>

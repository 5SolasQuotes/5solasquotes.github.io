<blockquote><p>Controversy – Did man before the Fall have the promises of a blessed life and the glory of heaven? We affirm against the Socinians and Anabaptists. Arguments:

1. The covenant of God, “Do this and live,” only had a place before the Fall and in the case of Christ, but it means, “you will live forever” (Gal. 3:12, 21).

2. The death denounced to man includes eternal death under the dominion of the devil, as we may conclude from Gen. 3:13 and 1 Cor. 15:22; therefore, the promised life was eternal life.

3. The law has only been weakened through sin so that it cannot save (salvare) (Rom. 8:3); therefore, before sin it was able to save (salvare).

4. He had the tree of life, and the thing that it signified was eternal life (Rev. 2:7).</p></blockquote>

<blockquote><p>There are some general obscure threatenings annexed to the prohibitions in the Law of Nature; that is, Nature may discern that God will punish the breakers of his Law, but how, or with what degree of punishment it cannot discern: Also it may collect that God will be favorable and gracious to the obedient: but it neither knows truly the conditions, nor the nature or greatness of the reward, nor God’s engagement thereto. Therefore as it is in Nature, it is a mere Law; and not properly a Covenant. Yea to Adam in his perfection, the form of the Covenant [of Works] was known by superadded revelation, and not written naturally in his heart.</p></blockquote>

<blockquote><p>From that which has been said two things may be gathered:

1. How the Covenant made with Adam, called by some divines the Covenant of Nature, agrees and differs from the Covenant of Grace. They agree in a general consideration of: [1] The author, which is God only wise, most holy, our supreme and absolute sovereign.

2. The matter of the covenant, which is a commandment and promise of reward.

3. The persons contracting or covenanting, which are God and man.

4. The subject not differenced by special respects, for the Law was given and [the] Gospel [was] revealed to man.

5. The form of administration, because to both covenants is annexed a restipulation.

6. The end, viz. the blessedness of man, and the glory of God manifested in his wisdom, bounty and goodness.

7. As Adam in the state of Innocency was made able to fulfill the Covenant made with him: so is the Covenant of Grace written in the hearts of them that are heirs of the promise in Christ. They differ:

1. In the special consideration of the author, cause and foundation of the Covenants. God gave his Law to Adam as bountiful and gracious to his creature entire and perfect, but in strict justice requiring obedience, promising a reward and denouncing punishment. But the Covenant of Grace he made as a loving Father in Jesus Christ, of his mere grace promising to receive them into favor, that sincerely and unfeignedly turn unto Him. The creation of man and integrity of human nature is the foundation of the former Covenant: but the redemption of man by Christ is the foundation of the Covenant of Grace.

2. In the form of sanction. In the Covenant of Nature there is no mediator: but the Covenant of Grace is made in Christ, in whom God has made us accepted. The Covenant of Nature was not promised before it was promulgated: but the Covenant of Grace was first promised, and long after promulgated and established or ratified in the blood of his Son.

3. In the special matter of the Covenants, and that both in respect of the promise and stipulation. For the Covenant of Nature promised life, but not righteousness: but in the Covenant of Grace God promises to tread Satan under the feet, and to write his Law in the hearts of them that are heirs of salvation. That Covenant promises life to them that perfectly obey, but not remission or forgiveness of any, even the least iniquity. But this promises forgiveness of sins and life eternal to the penitent sinner believing in Christ, and embracing the free promise of mercy. In that, life eternal is promised as the reward of justice: in this, life and glory as the reward of free and rich grace and mercy. To him that works, the wages is of debt; but to him that believes the reward is of grace. In that God as a Creator does exact his right of man pure: but in this as a loving Father He does offer Himself to the sinner smitten with the conscience of his sin. In that, life eternal and most blessed is promised, but only animal, to be enjoyed in Paradise, or continuance in that good estate wherein he was set at first of the rich bounty of God: but in the other, translation out of ignominy and death into eternal happiness and glory in Heaven. In the Covenant of Nature perfect obedience is exacted, so that if there be but the least failing in any jot or tittle, and that but once, a man can never be justified thereby, nor can the breach be made up by any repentance: but in the Covenant of Grace obedience is required, repentance admitted, and sincerity accepted. If a man sin and go astray, if he return unfeignedly, he shall be received into favor. In the Covenant of Nature obedience and works were commanded as the cause of life and justification: in the Covenant of Grace, faith is required as the instrumental cause of remission and salvation, obedience as the qualification of the party justified, and the way leading to everlasting blessedness. The object of obedience in the Covenant of Nature was God: in the Covenant of Grace, God in Christ.

4. They differ in the special consideration of the subject. The first Covenant was given to man pure, perfect, entire and sound, able to do what God required: but the Covenant following was made with man a sinner, miserable and by nature the child of wrath. And so that was a Covenant of friendship, this of firm reconciliation.

5. In the special and peculiar respect of the end. For the former Covenant was made for the praise of God’s wisdom, goodness, bounty and justice. But the Covenant of Grace was made to declare and set forth the riches of God’s grace and mercy. In it the wisdom, goodness, power and justice of God is more illustrious than in the former: and the mercy, long-suffering and rich grace of God is greatly magnified, which did not appear or shine forth at all in the former.

6. And in their effects and properties. For not the Covenant of Nature, but of Grace does exclude boasting. By the Covenant of Nature Adam was not advanced above the condition of an honorable servant. In the Covenant of Grace, man by nature the child of wrath is made the child of God by grace and adoption. The Covenant of Nature was neither the last nor everlasting, but being first made way for a better, and being broken was antiquated or disannulled to our singular comfort: but the Covenant of Grace shall continue firm and immovable forevermore.</p></blockquote>

nant+of+Nature+was+not+promised+before+it+was+promulgated%3A+but+the+Covenant+of+Grace+was+first+promised%2C+and+long+after+promulgated+and+established+or+ratified+in+the+blood+of+his+Son.+3.+In+the+special+matter+of+the+Covenants%2C+and+that+both+in+respect+of+the+promise+and+stipulation.+For+the+Covenant+of+Nature+promised+life%2C+but+not+righteousness%3A+but+in+the+Covenant+of+Grace+God+promises+to+tread+Satan+under+the+feet%2C+and+to+write+his+Law+in+the+hearts+of+them+that+are+heirs+of+salvation.+That+Covenant+promises+life+to+them+that+perfectly+obey%2C+but+not+remission+or+forgiveness+of+any%2C+even+the+least+iniquity.+But+this+promises+forgiveness+of+sins+and+life+eternal+to+the+penitent+sinner+believing+in+Christ%2C+and+embracing+the+free+promise+of+mercy.+In+that%2C+life+eternal+is+promised+as+the+reward+of+justice%3A+in+this%2C+life+and+glory+as+the+reward+of+free+and+rich+grace+and+mercy.+To+him+that+works%2C+the+wages+is+of+debt%3B+but+to+him+that+believes+the+reward+is+of+grace.+In+that+God+as+a+Creator+does+exact+his+right+of+man+pure%3A+but+in+this+as+a+loving+Father+He+does+offer+Himself+to+the+sinner+smitten+with+the+conscience+of+his+sin.+In+that%2C+life+eternal+and+most+blessed+is+promised%2C+but+only+animal%2C+to+be+enjoyed+in+Paradise%2C+or+continuance+in+that+good+estate+wherein+he+was+set+at+first+of+the+rich+bounty+of+God%3A+but+in+the+other%2C+translation+out+of+ignominy+and+death+into+eternal+happiness+and+glory+in+Heaven.+In+the+Covenant+of+Nature+perfect+obedience+is+exacted%2C+so+that+if+there+be+but+the+least+failing+in+any+jot+or+tittle%2C+and+that+but+once%2C+a+man+can+never+be+justified+thereby%2C+nor+can+the+breach+be+made+up+by+any+repentance%3A+but+in+the+Covenant+of+Grace+obedience+is+required%2C+repentance+admitted%2C+and+sincerity+accepted.+If+a+man+sin+and+go+astray%2C+if+he+return+unfeignedly%2C+he+shall+be+received+into+favor.+In+the+Covenant+of+Nature+obedience+and+works+were+commanded+as+the+cause+of+life+and+justification%3A+in+the+Covenant+of+Grace%2C+faith+is+required+as+the+instrumental+cause+of+remission+and+salvation%2C+obedience+as+the+qualification+of+the+party+justified%2C+and+the+way+leading+to+everlasting+blessedness.+The+object+of+obedience+in+the+Covenant+of+Nature+was+God%3A+in+the+Covenant+of+Grace%2C+God+in+Christ.+4.+They+differ+in+the+special+consideration+of+the+subject.+The+first+Covenant+was+given+to+man+pure%2C+perfect%2C+entire+and+sound%2C+able+to+do+what+God+required%3A+but+the+Covenant+following+was+made+with+man+a+sinner%2C+miserable+and+by+nature+the+child+of+wrath.+And+so+that+was+a+Covenant+of+friendship%2C+this+of+firm+reconciliation.+5.+In+the+special+and+peculiar+respect+of+the+end.+For+the+former+Covenant+was+made+for+the+praise+of+God%E2%80%99s+wisdom%2C+goodness%2C+bounty+and+justice.+But+the+Covenant+of+Grace+was+made+to+declare+and+set+forth+the+riches+of+God%E2%80%99s+grace+and+mercy.+In+it+the+wisdom%2C+goodness%2C+power+and+justice+of+God+is+more+illustrious+than+in+the+former%3A+and+the+mercy%2C+long-suffering+and+rich+grace+of+God+is+greatly+magnified%2C+which+did+not+appear+or+shine+forth+at+all+in+the+former.+6.+And+in+their+effects+and+properties.+For+not+the+Covenant+of+Nature%2C+but+of+Grace+does+exclude+boasting.+By+the+Covenant+of+Nature+Adam+was+not+advanced+above+the+condition+of+an+honorable+servant.+In+the+Covenant+of+Grace%2C+man+by+nature+the+child+of+wrath+is+made+the+child+of+God+by+grace+and+adoption.+The+Covenant+of+Nature+was+neither+the+last+nor+everlasting%2C+but+being+first+made+way+for+a+better%2C+and+being+broken+was+antiquated+or+disannulled+to+our+singular+comfort%3A+but+the+Covenant+of+Grace+shall+continue+firm+and+immovable+forevermore.%E2%80%9D%0A%0A%E2%80%94+John+Ball%2C+A+Treatise+of+the+Covenant+of+Grace%2C+%E2%80%A6+%28London%3A+1645%29%2C+ch.+3%2C+%E2%80%98Of+the+Covenant+of+Grace+in+General%E2%80%99%2C+pp.+24-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F46b0f1e685.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/46b0f1e685.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-covenant-of-works/#:~:text=From%20that%20which%20has%20been%20said,shall%20continue%20firm%20and%20immovable%20forevermore&amp;text=From%20that%20which%20has%20been%20said%20two%20things&amp;text=of%20Grace%20shall%20continue%20firm%20and%20immovable%20forevermore" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-41092742c7" data-kw="">
<blockquote><p>Therefore the nature of the human race, generated from the flesh of the one transgressor, if it is self-sufficient for fulfilling the law and for perfecting righteousness, ought to be sure of its reward, that is, of everlasting life, even if in any nation or at any former time faith in the blood of Christ was unknown to it. For God is not so unjust as to defraud righteous persons of the reward of righteousness… Man’s nature, indeed, was created at first faultless and without any sin; but that nature of man in which every one is born from Adam, now wants the Physician, because it is not sound. … This grace, however, of Christ, without which neither infants nor adults can be saved, is not rendered for any merits, but is given gratis, on account of which it is also called grace. ‘Being justified,’ says the apostle, ‘freely through His blood.&#x27;</p></blockquote>

<blockquote><p>Canon 8: Moreover that promise connected to the Covenant of Works was not a continuation only of earthly life and happiness but the possession especially of eternal and celestial life, a life namely, of both body and soul in heaven, if indeed man ran the’ course of perfect obedience, with unspeakable joy in communion with God. For not only did the Tree of Life prefigure this very thing unto Adam, but the power of the law, which, being fulfilled by Christ, who went under it in our place, awards to us nothing other than celestial life in Christ who kept the same righteousness of the law. The power of the law also threatens man with both temporal and eternal death. Canon 9: Wherefore we can not agree with the opinion of those who deny that a reward of heavenly bliss was offered to Adam on condition of obedience to God. We also do not admit that the promise of the Covenant of Works was any thing more than a promise of perpetual life abounding in every kind of good that can be suited to the body and soul of man in a state of perfect nature, and the enjoyment thereof in an earthly Paradise. For this also is contrary to the sound sense of the Divine Word, and weakens the power of the law considered in itself.</p></blockquote>

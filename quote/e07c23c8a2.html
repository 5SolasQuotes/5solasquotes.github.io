<main class="wrap"><figure class="quote" id="q-e07c23c8a2" data-kw="">
<blockquote><p>In the first covenant, though life was freely promised, yet it was immediately annexed to perfect obedience, as a consequent reward of it,—it was firstly promised unto complete righteousness of men’s persons. But in the second covenant, firstly and principally life, eternal grace and glory, is promised to Jesus Christ and his seed, antecedent to any condition or qualification upon their part.

And then again, all the promises that run in way of condition, as “he that believeth shall not perish,” &amp;c.—”if ye walk after the Spirit ye shall live;” these are all the consequent fruits of that absolute gracious disposition and resignation of grace and life to them whom Christ hath chosen; and so their believing, and walking, and obeying, cometh in principally as parts of the grace promised, and as witnesses and evidences, and confirmations of that life which is already begun, and will not see an end.

Besides that, by virtue of these absolute promises made to the seed of Christ, and Christ’s complete performance of all conditions in their name, the promises of life are made to faith principally, which hath this peculiar virtue, to carry forth the soul to another’s righteousness and sufficiency, and to bottom it upon another; and in the next place, to holy walking, though mixed with many infirmities, which promise in the first covenant was only annexed to perfect and absolute obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Sanctuary: Being Sermons on the Eighth Chapter of the Epistle to the Romans</cite>, (1670) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 2: 130-31.</span></figcaption>

</figure><figure class="quote" id="q-e7c8b824ff" data-kw="">
<blockquote><p>These fruits, when they are brought forth, God approveth of, accepteth, and further blesseth them that bear them; which is the last thing in the words. Some think there is no use of these fruits, unless they are meritorious of grace and glory. But God’s acceptation of them here is called his benediction, his blessing of them that bring them forth. Now a blessing cannot be merited; it is an act of bounty and authority, and hath the nature of a free gift, that cannot be deserved. What doth a field merit of him by whom it is watered and tilled, when it bringeth forth herbs meet for his use? they are all but the fruits of his own labour, cost, and pains. The field is only the subject that he hath wrought upon, and it is his own. All the fruits of our obedience are but the effects of his grace in us. We are a subject that he hath graciously been pleased to work upon. Only he is pleased, in a way of infinite condescension, to own in us what is his own, and to pardon what is ours. Wherefore the blessing of God on fruit-bearing believers consists in three things:—[1.] His approbation and gracious acceptance of them. So it is said that “he had respect unto Abel and to his offering,” Gen. 4:4. He graciously accepted both of his person and of his sacrifice, owning and approving of him, when Cain and his were rejected. So “he smelled a savour of rest” from the sacrifice of Noah, Gen. 8:21. And to testify his being well pleased therewith, he thence took occasion to renew and establish his covenant with him and his seed. [2.] It is by increasing their fruitfulness. “Every branch” in the vine “that beareth fruit, he purgeth it, that it may bring forth more fruit,” John 15:2. He “multiplieth the seed that is sown,” and “increaseth the fruits of their righteousness,” 2 Cor. 9:10. This is the constant way of God in his covenant-dealings with thriving, fruitful Christians; he so blesseth them as that their graces and fruits shall more and more abound, so as that they shall be flourishing even in old age, and bring forth more fruit unto the end. [3.] He blesseth them in the preparation he hath made for to give them an everlasting reward. A reward it is, indeed, of grace and bounty, but it is still a reward, “a recompence of reward.” For although it be no way merited or deserved, and although there be no proportion between our works, duties, or fruits, and it, yet, because they shall be owned in it, shall not be lost nor forgotten, and God therein testifies his acceptance of them, it is their reward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, vol. 22, Works of John Owen (Edinburgh: Johnstone and Hunter, 1855), 113–14.</span></figcaption>

</figure><figure class="quote" id="q-7b606e38e1" data-kw="">
<blockquote><p>Evangelicals are falsely accused by Bellarmine as denying that good works are necessary. For although good works are to be denied as causes of salvation, yet the same are not to be denied as necessary to demonstrating living faith, by which we are saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Period 1</cite>, Disputation 38, ‘Of the Necessity of Good Works &amp; of Christian Liberty’, Thesis 1 in A Collection of Three Whole Periods of Private Disputations Against Bellarmine (Basil, 1613), pp. 101-108, p. 101</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

<blockquote><p>But the consequent conditions are added to the antecedent, as following from them: which indeed are mutual between the parties, but oblige the one only so that the other is bound to do no more on their account: As if one having given or sold a plot of ground, should assign an annuity to be laid out upon the poor. Now conditions of that kind, when not performed, usually disannul the contract: and yet they do not constitute it. Nay, there would be no annuity, except the sale were already full and complete.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-chamier.html">Daniel Chamier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Book 15, ‘Of the Necessity of Works’, 5 chapters in Panstratiae Catholicae (Geneva, 1626), vol. 3, place 3, question 3, pp. 509-22 as tr. Herman Witsius, Animadversions, p. 150</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But the consequent conditions are added to the antecedent, as following from them: which indeed are mutual between the parties, but oblige the one only so that the other is bound to do no more on their account: As if one having given or sold a plot of ground, should assign an annuity to be laid out upon the poor. Now conditions of that kind, when not performed, usually disannul the contract: and yet they do not constitute it. Nay, there would be no annuity, except the sale were already full and complete.”

— Daniel Chamier, Other citations (work not named), Book 15, ‘Of the Necessity of Works’, 5 chapters in Panstratiae Catholicae (Geneva, 1626), vol. 3, place 3, question 3, pp. 509-22 as tr. Herman Witsius, Animadversions, p. 150">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+the+consequent+conditions+are+added+to+the+antecedent%2C+as+following+from+them%3A+which+indeed+are+mutual+between+the+parties%2C+but+oblige+the+one+only+so+that+the+other+is+bound+to+do+no+more+on+their+account%3A+As+if+one+having+given+or+sold+a+plot+of+ground%2C+should+assign+an+annuity+to+be+laid+out+upon+the+poor.+Now+conditions+of+that+kind%2C+when+not+performed%2C+usually+disannul+the+contract%3A+and+yet+they+do+not+constitute+it.+Nay%2C+there+would+be+no+annuity%2C+except+the+sale+were+already+full+and+complete.%E2%80%9D%0A%0A%E2%80%94+Daniel+Chamier%2C+Other+citations+%28work+not+named%29%2C+Book+15%2C+%E2%80%98Of+the+Necessity+of+Works%E2%80%99%2C+5+chapters+in+Panstratiae+Catholicae+%28Geneva%2C+1626%29%2C+vol.+3%2C+place+3%2C+question+3%2C+pp.+509-22+as+tr.+Herman+Witsius%2C+Animadversions%2C+p.+150&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F67b406b6a2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/67b406b6a2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=But%20the%20consequent%20conditions%20are%20added,sale%20were%20already%20full%20and%20complete&amp;text=But%20the%20consequent%20conditions%20are%20added%20to%20the&amp;text=except%20the%20sale%20were%20already%20full%20and%20complete" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-4d7398975f" data-kw="celibacy">
<blockquote><p>20]; the suffering of injuries [Mt. 5:39]; chastity or even celibacy, if the gift of continence is possessed and it is required for any reason [1 Cor. 9:5]; voluntary poverty for the sake of Christ and the gospel [Lk. 14:33; Mt. 16:24]); or they have been invented by men without the authority of the word and rest upon no other ground than that of voluntary worship (as regular obedience, which is repugnant to the liberty in which Christ has established us [Gal. 5:1] and according to which we ought no longer to be made the servants of men [1 Cor. 7:23]; perpetual continence, because Christ testifies that this is not a gift belonging to every one [Mt. 19:11] and by the apostle he commands, “If they cannot contain, let them marry: for it is better to marry than to burn” [1 Cor. 7:9]; voluntary poverty, such as is recommended by the papists, because no one without a special call or necessity</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c236909604" data-kw="monastic">
<blockquote><p>there are three principal ones upon which they build up the monastic life, continence, obedience and poverty. To these the three vows imposed upon monks correspond: of perpetual continence, regular obedience and voluntary poverty. Of the orthodox. II. On the other hand, the orthodox do not deny that there are certain indifferent works left to each one’s own will in the Scriptures, and with respect to which counsels may be given in the word of God, not improperly distinguished from the precepts necessarily to be obeyed: such as Paul’s counsel concerning a virgin’s marrying or not marrying (1 Cor. 7:26, 36); concerning the use of wine with regard to Timothy (1 Tim. 5:23*). Still they are of such a nature that they are not of themselves pleasing to God and when neglected, deserve no punishment; nor when observed, any reward. But they deny that there are any such counsels about moral thing</p></blockquote>

</figure><figure class="quote" id="q-da795d9398" data-kw="">
<blockquote><p>From all this it appears that the Romanists worship images in the same way that the heathen of old did, and pagans of our own day still do. They &quot;bow down to them and serve them.&quot; They pay them all the external homage which they render to the persons they are intended to represent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, p. 1946</span></figcaption>

</figure><figure class="quote" id="q-48f84ab3d4" data-kw="">
<blockquote><p>Do we not see with our eyes that in the Roman Church the people is denied the Communion of the cup? Do we not see pictures of the Trinity, and the people bowing the knee before images? Do we not hear public service and prayers in an unknown tongue? And if these things be formally prohibited in the holy Scripture, are they not unto us sensible marks of a false and erroneous Church?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery</cite>, ch. 28</span></figcaption>

— Pierre Du Moulin, The Novelty of Popery, ch. 28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDo+we+not+see+with+our+eyes+that+in+the+Roman+Church+the+people+is+denied+the+Communion+of+the+cup%3F+Do+we+not+see+pictures+of+the+Trinity%2C+and+the+people+bowing+the+knee+before+images%3F+Do+we+not+hear+public+service+and+prayers+in+an+unknown+tongue%3F+And+if+these+things+be+formally+prohibited+in+the+holy+Scripture%2C+are+they+not+unto+us+sensible+marks+of+a+false+and+erroneous+Church%3F%E2%80%9D%0A%0A%E2%80%94+Pierre+Du+Moulin%2C+The+Novelty+of+Popery%2C+ch.+28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F48f84ab3d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/48f84ab3d4.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-1adee36587" data-kw="">
<blockquote><p>Again, their idolatry is manifest, in that they worship God in, at, or before images; having no commandment so to do, but the contrary. They allege that they use and worship images only in a remembrance of God. But this is all one as if an unchaste wife should receive many lovers into her house in the absence of her husband and, being reproved, should answer that they were the friends of her husband and that she kept them only in remembrance of him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic</cite>, p. 197</span></figcaption>

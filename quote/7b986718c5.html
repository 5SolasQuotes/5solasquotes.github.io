<main class="wrap"><figure class="quote" id="q-7b986718c5" data-kw="">
<blockquote><p>The point of the Trinity it is a speculative point, and it tends to practice. First, to be a foundation of our worship, that we worship one God in three persons. And then it tends to shew the unity among Christians, that God will work among Christians at length, that they shall be all one in some sort, as the Father, Son, and Holy Ghost are one: which, though it be a point of high and deep speculation, yet it tends to practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Art of Contentment</cite>, (London, 1637) in Alexander B. Grossart (ed.), The Works of Richard Sibbes (1862-64; 7 vols, Edinburgh: Banner of Truth, 1977), v, 183.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b5fa971209" data-kw="">
<blockquote><p>How many ways is the name of God taken in the Scriptures?

Two ways: properly for the substance, essence, and nature: and improperly. Now it is taken properly, or for the essence, when it is taken without the distinction of any one of the persons, as Joh. 4.24. God is a spirit, where God is taken for the whole essence of the Deity, as is also the name Jehovah.

Or else, personally, when there is joined unto the name of God the name of the person: as God the Father, God the Son, God the holy Ghost. Or when the Father is opposed to the Son, who is very God, and the second Person in the Trinity, as Rom. 7.25. I thank God by Jesus Christ. So Rom. 8.3 the Father is called God, the word Father being used personally, because the Person sending is opposed to the Person sent.

Improperly, when it is attributed to Angels or men: and truly, either in regard of their office, or else in respect of the revealing of the will of God, and of their reverence: falsely, either by error; or else by usurpation and custom, as 1. Cor. 8.5. or else by worshipping them. 2. Cor. 4.4. Phil. 3.19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guillaume-bucanus.html">Guillaume Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian religion framed out of God’s word, and the writings of the best divines, methodically handled by questions and answers, fit for all such as desire to know, or practise the will of God</cite>, trans. Robert Hill (London: George Snowdon and Leonell Snowdon, 1606), p. 5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-e47aa5d60f" data-kw="">
<blockquote><p>We say that the Godhead is absolutely of itself. And hence also we hold that the Son, regarded as God, and without reference to person, is also of himself; though we also say that, regarded as Son, he is of the Father. Thus his essence is without beginning, while his person has its beginning in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.25</span></figcaption>

</figure><figure class="quote" id="q-82dcf6a70a" data-kw="Spirit personality agent">
<blockquote><p>He is an intelligent, voluntary, divine agent; he knoweth, he worketh as he will: which things, if, in their frequent repetition, they are not sufficient to evince an intelligent agent, a personal subsistence, that hath being, life, and will, we must confess that the Scripture was written on purpose to lead us into mistakes and misapprehensions of what we are, under penalty of eternal ruin, rightly to apprehend and believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Declaration and Vindication of the Doctrine of the Trinity</cite>, Of the Holy Ghost</span></figcaption>

<blockquote><p>VII. The efficient cause of justification is God, considered both οὐσιωδῶς [ousiōdōs, essentially] and ὑπαρκτικῶς [hyparktikōs, subsistentially/personally]. Essentially, with respect to the whole complex — which, as a work ad extra [external work], is common to the three Persons of the Holy Trinity as to the ἀποτέλεσμα [apotelasma, effect] itself, yet remains distinct both in order and in mode of operation. Subsistentially, with respect to the parts of the complex: and thus to the Father is attributed the διακριτικός [diakritikos, distinguishing/decisive] act of justification, Rom. III.25; VIII.33; to the Son, the merit of justification, Isa. LIII.11; Matt. IX.6; and to the Holy Spirit, its application, 1 Cor. VI.11.</p></blockquote>

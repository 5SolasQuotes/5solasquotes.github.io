<main class="wrap"><figure class="quote" id="q-aed3423aa7" data-kw="">
<blockquote><p>It is true that the Lord occasionally manifested his presence by certain signs, so that He was said to be seen face to face; but all the signs He ever employed were in apt accordance with the scheme of doctrine, and, at the same time, gave plain intimation of his incomprehensible essence. For the cloud, and smoke, and flame, though they were symbols of heavenly glory (Dt. 4:11), curbed men’s minds as with a bridle, that they might not attempt to penetrate farther… The Holy Spirit appeared under the form of a dove, but as it instantly vanished, who does not see that in this symbol of a moment, the faithful were admonished to regard the Spirit as invisible, to be contented with his power and grace, and not call for any external figure? God sometimes appeared in the form of a man, but this was in anticipation of the future revelation in Christ, and, therefore, did not give the Jews the least pretext for setting up a symbol of Deity under the human form. The mercy-seat, also (Ex. 25:17-18, 21) where, under the Law, God exhibited the presence of his power, was so framed as to intimate that God is best seen when the mind rises in admiration above itself: the cherubim with outstretched wings shaded, and the veil covered it, while the remoteness of the place was in itself a sufficient concealment. It is therefore mere infatuation to attempt to defend images of God and the saints by the example of the cherubim. For what, pray, did these figures mean, if not that images are unfit to represent the mysteries of God, since they were so formed as to cover the mercy-seat with their wings, thereby concealing the view of God, not only from the eye, but from every human sense, and curbing presumption?… Moreover, all men of sound judgment acknowledge that the cherubim in question belonged to the old tutelage of the law. It is absurd, therefore, to bring them forward as an example for our age. For that period of puerility, if I may so express it, to which such rudiments were adapted, has passed away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 1, bk. 1, ch. 11, section 3, pp. 122-23</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a14e2c7a2f" data-kw="">
<blockquote><p>…will I join a most godly ancient bishop, whose Greek epistle being sent to John, bishop of Jerusalem, Jerome did translate into Latin; his name is Epiphanius. The words of the epistle are these: ‘…Wherein we do learn all these godly lessons: First, that no place ought to be given in the church of Christ to those things that are against the authority of the holy Scriptures. Secondly, that to give place in the church of Christ unto images, it is against the authority of the holy Scriptures, that is, of that law, which says: Thou shalt not make to thyself any graven image. Thirdly that not only graven and molten images, and such as be set up on high, upon or over the altars, but also the painted images ought to be cast out of the churches. Fourthly that the image of Christ Himself ought in no wise to stand in the church, because that of all other it is most perilous and breeds the greatest idolatry. Fifthly that the images ought to be caste out of the church of Christ, not only by sedulity and diligence of doctrine, but also by very fact and deed. Sixthly, that they ought not coldly, but with a fervent and earnest zeal of the true religion be put done, defaced, and broken all to pieces, as we do see this holy man of God Epiphanius to have rent and torn in pieces the vail that had the image of Christ painted, which he did being moved with the zeal of God. Seventhly, that it is the part and duty of bishops, to see that images be not set up in the church of Christ. Last of all, that it is a mere scrupulosity and superstition, unseemly for the church and the faithful people of God to have images.’ Here may we see that this godly ancient bishop did much differ in judgment from those fond persons that think it to be a profitable thing for the people of God to have images standing in the churches. Let them weigh these things that have always the fathers in their mouths, and so let them learn that it is more honesty for us to be called iconoclastae, that is, image breakers, than to be called iconoplastae, that is, image makers, and that we do approach nearer to the example of the old ancient church than they do, although they brag and boast themselves to be catholic and apostolic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-veron.html">John Veron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Strong Battery against the Idolatrous Invocation of the Dead Saints, and Against the having or setting up of Images in the House of Prayer or in any other place where there is any peril of iIolatry</cite>, … (London: Sutton, 1562), pp. 92-93</span></figcaption>

</figure><figure class="quote" id="q-48f84ab3d4" data-kw="">
<blockquote><p>Do we not see with our eyes that in the Roman Church the people is denied the Communion of the cup? Do we not see pictures of the Trinity, and the people bowing the knee before images? Do we not hear public service and prayers in an unknown tongue? And if these things be formally prohibited in the holy Scripture, are they not unto us sensible marks of a false and erroneous Church?</p></blockquote>

</figure><figure class="quote" id="q-d9eb87081e" data-kw="">
<blockquote><p>For our hope is placed in the true cross of our Lord Jesus Christ, not in an image. For this reason I confess that I whole-heartedly detest the image of the crucifix. It is the image of the cruelty of the Jews against Christ, and so I cannot bear it. Hezekiah is praised for destroying the bronze serpent to which divine worship was being offered (2 Kings 10 [18:4]), and so I think they should be praised also who do away with the image of the crucifix as well, for the purpose of guarding against the same idolatry, and eliminate them from all temples and sacred places.</p></blockquote>

<blockquote><p>All confidence reposed in creatures … is evidently opposed to a correct knowledge of God, since he who places his trust in creatures makes for himself many gods. Hence God expressly condemns in his word all those who repose their confidence either in men, or in power and riches, or in any created object. Avarice, or covetousness, is included in this vice, and condemned.… Idolatry … There are two forms or species of idolatry. One is, when another beside the true God is professedly worshiped, or, when that is worshiped for God which is no God.… The other form of idolatry is when we do not professedly worship another God, but err in the kind of worship we render unto him.… Those who worship God otherwise than he will be worshipped, imagine another God, one differently affected from what the true God is; and in this way they do not worship God, but a figment of their own brain.</p></blockquote>

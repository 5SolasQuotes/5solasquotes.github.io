<main class="wrap"><figure class="quote" id="q-387b04aac2" data-kw="">
<blockquote><p>To give a concise and accurate opinion of these Aphorisms, is no easy task. This difficulty arises from the great number of separate propositions, which are neither always consistent with truth nor with one another. As a book, it abounds in moral and metaphysical distinctions, and yet its definitions are frequently both inaccurate and obscure. It contains a large portion of truth, mixed and interwoven with no small portion of error. When he thus expresses himself about our participation of Christ’s righteousness, every true Christian is prepared to go along with him : “That God, the Father, doth accept the sufferings and mediation of his Son, as a full satisfaction to his violated law, and as a valuable consideration, upon which he will wholly forgive and acquit the offenders themselves, receive them again into favour, and give them the addition also of a more excellent happiness, so they will but receive his Son upon the terms expressed in the Gospel.” But when he comes to explain ” the terms of the Gospel,” and the manner in which men submit to them, we meet with much that is incautious. To a good deal of the objectionable language of his theses, he indeed gives a harmless interpretation in the accompanying explanation, or in some subsequent proposition renders it entirely nugatory. But still there remains much which is calculated to mislead. He speaks about the Gospel being ” new law, the conditions of which are easier than those of the old;” of “faith as the righteousness of a Christian.” He defines this faith as “the condition of the new covenant,” and includes in it the whole of religion. He represents the death of Christ as not “affecting any sins against the Gospel;” speaks of “works” as “part of the condition on which Christ’s righteousness becomes ours,” and maintains that ” we are justified by sincere obedience.” To this language, no man who understands aright the gratuitous justification which is through faith in the blood of Christ, will ever subscribe. These were some of the expressions or sentiments which involved Baxter in most of the doctrinal altercations that occupied so large a portion of his future life, and on account of which his name has been placed at the head of a peculiar creed. While he explained, modified, and retracted, many things in this first, and perhaps most objectionable of his works, he adhered to the substance of its sentiments to the last.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-orme.html">William Orme</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Life and Times of Richard Baxter</cite>, 2 vols. (James Duncan, 1830), 2.41–42.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0302ebf39b" data-kw="">
<blockquote><p>When we say, ‘Faith alone does justify,’ we do not mean fidem solitariam, that faith which is alone; neither do we in construction join sola with fides the subject, but with justification the predicate, meaning that true faith though it be not alone, yet it does justify alone, even as the eye, though in respect of being it is not alone, yet in respect of seeing, unto which no other member does concur with it, it being the only instrument of that faculty, it is truly said to see alone, so faith though in respect of the being thereof it is not alone, yet in respect of justifying, unto which act no other grace does concur with it, it being the only instrument of apprehending and receiving Christ, is truly said to justify alone. When we say by faith only, this opposes all other graces of the same order, but not the merits of Christ or the efficacy of God’s grace; the apostle, Rom. 4, makes it all one to prove a man justified by grace, Christ and by faith. It is to be considered as alone in the act of justification, but not in the subject justified; therefore that is a reproach cast on Protestants to call them Solifidians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), bk. 7, ch. 10, ‘Whether Faith Alone does Justify?’, pp. 528-29</span></figcaption>

</figure><figure class="quote" id="q-45d25bffc7" data-kw="">
<blockquote><p>What is the work of the Holy Ghost with respect unto the objective evidence which we have concerning the Scripture, that it is the word of God, which is the formal reason of our faith, and whereinto it is resolved?… … These things being supposed , we do affirm, That it is the authority and truth of God, as manifesting themselves in the supernatural revelation made in the Scripture [emphasis added], that our faith arises from and is resolved into. … As the issue of this whole discourse, it is affirmed that our faith is built on and resolved into the Scripture itself, which carries with it its own evidence of being a divine revelation; and therefore doth that faith ultimately rest on the truth and authority of God alone, and not on any human testimony, such as is that of the church, nor on any rational arguments or motive that are absolutely fallible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, bk. 6, pt. 1, The Reason of Faith; or, an Answer unto that inquiry, ‘Wherefore we believe the Scripture to be the Word of God;’ with the causes and nature of that faith wherewith we do so: wherein the grounds whereon the Holy Scripture is believed to be the Word of God with faith divine and supernatural are declared and vindicated in Pneumatologia: or, A Discourse concerning the Holy Spirit, Continued in Works, vol. 4, pp. 1-115 | See especially Ch. 5, ‘Divine Revelation itself the only foundation and reason of faith’, p. 69 ff., pp. 69, 72, 81</span></figcaption>

<blockquote><p>The doctrine of justification, which now follows, is one of the chief articles of our faith, not only because it treats of those things which are fundamental, but also because it is most frequently called in question by heretics. The controversies between the church and heretics have respect principally to two points: the one is concerning God, and the other concerning the justification of man in the sight of God. And such is the importance of these doctrines that if either one of them be overthrown, the other parts of our faith easily fall to pieces. Hence it becomes necessary for us, to fortify and establish ourselves, especially in these doctrines, against all the assaults of heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Orthodox Doctrine of the Explication of the Catechism, on Q. 7</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“The doctrine of justification, which now follows, is one of the chief articles of our faith, not only because it treats of those things which are fundamental, but also because it is most frequently called in question by heretics. The controversies between the church and heretics have respect principally to two points: the one is concerning God, and the other concerning the justification of man in the sight of God. And such is the importance of these doctrines that if either one of them be overthrown, the other parts of our faith easily fall to pieces. Hence it becomes necessary for us, to fortify and establish ourselves, especially in these doctrines, against all the assaults of heretics.”

<main class="wrap"><figure class="quote" id="q-82f5cf4384" data-kw="permission">
<blockquote><p>Although that mutability indicates the possibility of the fall and is the cause sine qua non (or the antecedent of the fall), still it cannot be considered its cause proper and of itself. This is so not only because it was a condition created together with innocent man by God (which was also in the elect angels before their confirmation without any defect), but also because it is indeed the negation of some good. It is not the privation of a good due to the creature, but undeserved and so did not take away any perfection required in a state of nature. So we must accurately distinguish here between the mutability itself (which is a condition suitable to the creature) and the act of that mutability (by which man inclined to a change). The former denotes a power which could be inclined to evil, but was not yet inclined; the latter, however, designates the actual inclination to evil itself (condemned by the law of God) and the fountain of all sin. The free will of man the true cause of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-fall/causes-of-the-fall.html">Causes of the Fall</a> › <a href="../topics/the-fall/causes-of-the-fall/permission-of-the-fall.html">Permission of the fall</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-360e80a51b" data-kw="Author of sin The Fall Permission">
<blockquote><p>To make God the author of sin is such foul blasphemy, that it can never enter any Christian man’s mind without a shudder. It is indeed true that God had made man mutably good, had infallibly foreseen his sin, had foreordained the permission of the sin and given man no doubt sufficient strength to shun sin, but inoperable without His influx; that meanwhile He had inflowed into man’s faculties for natural actions by not inflowing into the moral entity of such actions. … But it is not less true, that God neither is nor could in any way become the author of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants</cite>, 1.8.28 (as quoted in Heinrich Heppe, Reformed Dogmatics)</span></figcaption>

</figure><figure class="quote" id="q-f9412b24db" data-kw="Original Sin The Fall Author of sin">

</figure><figure class="quote" id="q-561ca6a8d8" data-kw="Author of sin The Fall Satan Temptation">
<blockquote><p>Not unto God; he is not the author of sin, nor tempts unto it; nor is he tempted by it: nor to Satan, only as an instrument, enticing and deceiving; but to themselves, to their own will, it was their own act and deed.</p></blockquote>

</figure><figure class="quote" id="q-70bf458f2a" data-kw="apostasy">
<blockquote><p>The first sin of man (from which the others flow as from a fountain) is the voluntary apostasy of the first man from God, his Creator. In eating of the tree of the knowledge of good and evil, he transgressed not only this special interdict, but also in it the whole law of nature engraved upon his heart. It is certain that we must not regard that fall as any particular sin, such as theft or adultery, but as a general apostasy and defection from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.6.1-3</span></figcaption>

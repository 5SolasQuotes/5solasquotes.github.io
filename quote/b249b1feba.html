<blockquote><p>…so our sectaries are great Innovators as changeable as the moon, bringing into their churches new opinions daily, new practices, taking away the old used in all Reformed Churches, and substituting new; taking away of singing of psalms and pleading for hymns of their own making; bringing in anointing with oil, bringing in their laying on of hands to give the Holy Ghost, with several other strange ways and practices…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-120724e25c" data-kw="">
<blockquote><p>Question 6. Whether absolute and unlimited power of royalty be a ray and beam of divine majesty immediately derived from God? Answer. Not at all. Such a creature is not in the world of God’s creation. Royalists and flatterers of kings are parents to this prodigious birth. There is no shadow of power to do ill in God. An absolute power is essentially a power to do without or above law, and a power to do ill, to destroy; and so it cannot come from God as a moral power by institution, though it come from God by a flux of permissive providence; but so things unlawful and sinful come from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644), p. 228</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-86e0d15ddc" data-kw="">
<blockquote><p>In natural things, it is to be noted that the whole fulness of perfection due to a thing, is not from the mere substantial form that gives it its species since a thing derives much from supervening accidents, as man does from shape, color and the like; and if any one of these accidents be out of due proportion, evil is the result. So it is with action. For the plenitude of its goodness does not consist wholly in its species, but also in certain additions which accrue to it by reason of certain accidents: and such are its due circumstances. Wherefore if something be wanting that is requisite as a due circumstance the action will be evil. … Circumstances are outside an action inasmuch as they are not part of its essence; but they are in an action as accidents thereof… Every accident is not accidentally in its subject, for some are proper accidents; and of these every art takes notice. And thus it is that the circumstances of actions are considered in the doctrine of morals… Since good and being are convertible, according as being is predicated of substance and of accident, so is good predicated of a thing both in respect of its essential being, and in respect of its accidental being; and this, both in natural things and in moral actions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pt. 2, pt. 1, question 18, ‘Of the Good &amp; Evil of Human Acts in General’ in Summa | 3. ‘Whether man’s action may be good or evil from a circumstance?’ [Yes]</span></figcaption>

<blockquote><p>§6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all or most Churches, and so on the catholic Church, yet it properly respected neighbour Churches, either, which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered; acquainting one another with their affairs, so far as it was of any advantage: admitting the members of other Churches to communion with them, on occasion, refusing communion with such members of other Churches as were by them excommunicated. And this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shunned by them who so joined in another Church, or denied to such sojourners if they desired it: or, when one Church showed rage, fury and bitterness against another because of what they differed about [though it was non-fundamental].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 10 Rule was a Scottish, divine-right presbyterian., pp. 251-52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

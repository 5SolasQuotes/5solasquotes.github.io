</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0bc8c102ca" data-kw="">
<blockquote><p>I propound it to you, whether some of you have not held out some other public worship than the reformed Churches hold, namely hymns and anointing the sick members of the Church with oil; as also, whether a little before your coming over into England, some members of the Church of Arnheim [Netherlands], did not propound the holy kiss, or the kiss of love, to be practiced by church-members; Nay whether by some persons in that Church, was it not begun to be used and practiced; And in this enumeration of the parts of public worship, I desire to know why you put in “etc.” and what is meant by “etc.” for that implies more parts than you enumerate. And we know, etc. is a dangerous and suspicious phrase ever since the late [Anglican] Canons and Oath, for under that “etc.” may be meant prophesying and hymns, and anointing with oil, and the kiss of love, and many other parts which the reformed Churches practice not, and so your public worship may be made up of many other parts than the worship of all other reformed Churches, and that there is great cause to speak thus, and doubt, appears, because I know not, nor cannot reckon up any other part of public worship used every Lord’s Day in the reformed Churches than the particulars mentioned by you without an etc. and therefore what you mean by under “etc.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644), pp. 60-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“I propound it to you, whether some of you have not held out some other public worship than the reformed Churches hold, namely hymns and anointing the sick members of the Church with oil; as also, whether a little before your coming over into England, some members of the Church of Arnheim [Netherlands], did not propound the holy kiss, or the kiss of love, to be practiced by church-members; Nay whether by some persons in that Church, was it not begun to be used and practiced; And in this enumeration of the parts of public worship, I desire to know why you put in “etc.” and what is meant by “etc.” for that implies more parts than you enumerate. And we know, etc. is a dangerous and suspicious phrase ever since the late [Anglican] Canons and Oath, for under that “etc.” may be meant prophesying and hymns, and anointing with oil, and the kiss of love, and many other parts which the reformed Churches practice not, and so your public worship may be made up of many other parts than the worship of all other reformed Churches, and that there is great cause to speak thus, and doubt, appears, because I know not, nor cannot reckon up any other part of public worship used every Lord’s Day in the reformed Churches than the particulars mentioned by you without an etc. and therefore what you mean by under “etc.””

uote%2F0bc8c102ca.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0bc8c102ca.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-holy-kiss-foot-washing-anointing-with-oil/#:~:text=I%20propound%20it%20to%20you%2C%20whether,what%20you%20mean%20by%20under%20%E2%80%9Cetc&amp;text=I%20propound%20it%20to%20you%2C%20whether%20some%20of&amp;text=and%20therefore%20what%20you%20mean%20by%20under%20%E2%80%9Cetc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1e7198fc15" data-kw="">
<blockquote><p>First of all, I hold that it is proper for the ceremonies in the church to be absolutely as few and as pure as possible. For besides the fact that we must now worship the Lord in Spirit and truth, even plain experience, that teacher of fools, ought to warn us not to imitate the example of those who–while setting no limit on their ceremonies–do not increase the worship of God, but completely undermine it. And so we determined that we should take thought how to do away with ceremonies rather than establishing them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Simple Treatise on the Lord’s Supper</cite>, (RHB, 2016), p. 143</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-65efbc49b5" data-kw="">
<blockquote><p>As for the veils wherewith the apostle would have women covered whileas they were praying (that is in their hearts following the public and common prayer) or prophesying (that is singing, 1 Sam. 10:10; 1 Chron. 25:1) they are worthy to be covered with shame as with a garment, who allege this example for sacred significant ceremonies of human institution. This covering was a moral sign, for that comely and orderly distinction of men and women which civil decency required in all their meetings: wherefore, that distinction of habits [garments], which they used for decency and comliness in their common behavior and conversation, the apostle will have them, for the same decency and comeliness still to retain in their holy assemblies. And further the apostle shows, that it is also a natural sign, and that nature itself teaches it: therefore he urges it both by the inferiority or subjection of the woman vv. 3. 8-9 (For covering was then a sign of subjection) and by the long hair which nature gives to a woman v. 15. Where he would have the artificial covering, to be fashioned in imitation of the natural. What need we anymore? Let us see nature’s institution, or the apostles’ recommendation for the controverted ceremonies (as we have seen them for women’s veils) and we yield the argument. Last of all, the sign of imposition of hands, helps not the cause of our Opposites, because it the example of Christ, and the apostles, and their disciples, which our ceremonies have not: yet we think not imposition of hands to be any sacred or mystical sign, but only a moral, for designation of a person: let them who think more highly or honorably of it, look to their warrants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies, pt. 3</cite>, ch. 5, pp. 90-91</span></figcaption>

</figure><figure class="quote" id="q-5aa04506f5" data-kw="">
<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), pp. 11-13</span></figcaption>

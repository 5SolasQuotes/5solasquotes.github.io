<blockquote><p>How can a man be just with God? The answer given to this question decides the character of our religion and, if practically adopted, our future destiny. To give a wrong answer is to mistake the way to heaven. It is to err where error is fatal, because it cannot be corrected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Justification, the Law, and the Righteousness of Christ</cite>, I.A, “Introduction”</span></figcaption>

</figure><figure class="quote" id="q-8b720f9b69" data-kw="">
<blockquote><p>I hope hereafter I may (after Chamier and Maccovius) affirm that faith in Christ essentially contains love to Christ, and that love to Christ justifies, as faith does, without the terrible charge of asserting an almost Socinian faith and justification.</p></blockquote>

</figure><figure class="quote" id="q-6a81fbefaf" data-kw="">
<blockquote><p>Is a believer’s justification complete at once; are all his sins, past, present and to come, on his first believing, pardoned? Justification, as has already been shown, changes a person’s state; and a believer’s state being changed, all his legal condemnation is at that time taken from off his person: union with Christ exempts from the same. “There is therefore now no condemnation to them that are in Christ Jesus” Rom. 8:1. Here is the high privilege of those in Christ asserted, namely, exemption from God’s condemnation; and the Holy Ghost here tells us, “There is therefore now no condemnation,” not the least condemnation remains to them “in Christ,” but their sins are freely remitted, “for his name’s sake, and all that believe are justified from all things” Acts 13:39. Here is a most complete absolution from all sins, for all those that believe in the Lord Christ. Thus Col. 1:13, “Having forgiven you all trespasses.” God does not, in the justification of his people, forgive some sins only, and leave others standing on the score. “Who forgiveth all thine iniquities,” Ps. 103:3. And not only so, but Christ covers the believer with the robe of righteousness, Isa. 61:10. For no sooner does a man truly believe in Christ, but his righteousness is imputed to him, and in and by that righteousness, he stands righteous before God, as well at the first as at the last; that righteousness of Christ by which we are justified, whether first or last, being most perfect: therefore the righteousness of justification cannot be increased, neither does our justification before God admit degrees, either in one and the same person, or yet in diverse men.—Downame on Justification, page 7. But God only forgives the sins that are past? Rom. 3:25. I answer, This looks to the sins of the saints, that were committed before Christ’s coming in the flesh, and holds forth God’s indulgence in pardoning of them, on the account of Christ’s engagement, though the price of their redemption was not actually laid down. To the same thing does the Holy Ghost speak, “And for this cause He is the Mediator of the new testament, that by means of death, for the redemption of the transgressions that were under the first testament,” Heb. 9:15. Here is that most excellent sacrifice, that looked as high as Adam, being the Lamb slain from the foundation of the world, from whence all the Old Testament saints had both full and free remission of all sin: and this I take to be the true meaning of this scripture. And though sin cannot properly be said to be actually forgiven, before it be committed, yet when the elect are, by the Holy Ghost, united to Christ, their persons are completely justified, and Christ having fulness of pardoning grace in his hands, their justification is continued and maintained by his intercession in heaven, 1 John 2:1. And thus the saints’ justification is, and continues to be, one constant and complete act of free grace, never to be reversed again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of Justification by Faith, Opened &amp; Applied from Rom. 3:24-25</cite>, …’ in Works (London: Tegg, 1845), vol. 5, pp. 382-89</span></figcaption>

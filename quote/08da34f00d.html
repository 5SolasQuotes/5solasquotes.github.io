<main class="wrap"><figure class="quote" id="q-08da34f00d" data-kw="">
<blockquote><p>Eleventhly, [it is superstition] that he that is a member of one church may not communicate with any other but by the consent of the pastor and people of that one. Twelfthly, that he that is a member of a church may not remove his relation to another church (when his occasions and personal benefit require it and the public good of many is not hurt by it) without the consent of the pastor and people of that church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 58, p. 290</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3f44fc0ca5" data-kw="">
<blockquote><p>As your baptism makes you members of the universal Church, in order of nature before you are members of a particular church, so your relation to the universal Church is more noble, more necessary and more durable than your relation to any particular church. It is more noble, because the society is more noble. The whole is more excellent than a little part: It is more necessary because you cannot be saved and be Christians without being members of the universal Church: But you may be Christians and be saved without being a member of any stated particular church. It is more durable because you can never separate from the universal Church or cease to be a member of it without being separated from Christ: but diverse occasions may warrant your removal from a particular church. Live not therefore in those narrow and dangerous principles as if your congregation or your party were all the Church of Christ, or as if you had no Christian relation to any other ministers or people, nor owed any duty to them as members of the same Body. But remember that all Christians, persons and congregations are but the members of the Kingdom of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 18, ‘Understand well the necessity of your Communion with all the Universal Church, and wherein it consists, and how far to be preferred before your Communion with any particular Church’, pp. 115-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

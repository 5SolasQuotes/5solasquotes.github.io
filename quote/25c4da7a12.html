<main class="wrap"><figure class="quote" id="q-25c4da7a12" data-kw="">
<blockquote><p>Of the philanthropic schemes of our day, few are more deserving of the friendly regard and cordial support of Christians of every name, than the “Society for the Prevention of Cruelty to Animals.” Toiling in a field which has been long neglected, and which scarcely attracted even the notice of other labourers, pleading for creatures that could not themselves utter the language of complaint, nor appeal to Christian sympathy in articulate words, and encountering the prejudices and rude opposition of those who can hardly be brought to consider themselves responsible for the treatment of animals which are their property, they have nobly pursued their self-denying course; and with a vigilance ever wakeful, and penetrating everywhere, they have detected and exposed cases of cruelty and neglect which had for a long time been permitted to pass unheeded.

With heroic determination they have brought offenders to justice, and engaged legislators and public authorities in what must ever be regarded as a beautiful exemplification of their high functions. The provisions they have made for alleviating the sufferings of the lower animals, and promoting their comfort, are characterized by singular wisdom; and, what we regard as the chief praise and highest achievement of this excellent association, their exertions have powerfully tended to diffuse humane sentiments and feelings.

Cruel masters and drivers of horses have been exposed to the indignant reprobation of the community, and have been taught that it is not less their own interest than an obligation to law and justice, to treat with kindness the animals under their care; while the principle which the society everywhere inculcates, that the inferior animals are entitled to protection and kind treatment, has served to extend humane views and refined feelings throughout every department of society. This brief digression may be forgiven, because the labours of these excellent men tend to promote objects similar to those which this essay aims to advance, and because of what they have already achieved in the cause of Christian philanthropy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Races: The Evils Connected with Horse-Racing and the Steeple-Chase and their Demoralizing Effects</cite>, (1853) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D, Knockbracken (4 vols, Edinburgh: Andrew Elliot, 1876), 4: 371.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>In preface to taking up some of [John Brown of] Wamphray’s arguments, he in general mistakenly infers, as did most opposed to the [Scottish, civil] indulgence (and those of a similar mindset today), that if there are deficiencies or evils in the indulgence (or any such enactment), then it is sinful to accept those deficiencies and evils. However, ‘evil’ is an ambiguous term and may stand for miserable or moral evils. One may morally choose to undergo and suffer certain miserable (though not moral) evils in necessity, other alternatives not being available, likely, reasonable or best. Choosing to eat expired food rather than starve is not wrong, though starving would be. That one must have the best or none at all, is against the greater good; miserable evils often contain a significant degree of good, and we ought not to choose the worst.</p></blockquote>

</figure><figure class="quote" id="q-8c060526c1" data-kw="">
<blockquote><p>It is lawful for all sorts of people to marry, who are able with judgment to give their consent. Yet it is the duty of Christians to marry only in the Lord. And therefore such as profess the true reformed religion should not marry with infidels, papists, or other idolaters: neither should such as are godly be unequally yoked, by marrying with such as are notoriously wicked in their life, or maintain damnable heresies. (Westminster Confession 24.3)

The minutes of the Westminster Assembly give us an interesting glimpse into how this section of the Confession was eventually formulated:

Report was made from the committee of that committed about marriage. …

The Assembly debated the Report of that committed about marriage, and upon debate it was

Resolved upon the Q: The former proposition about consent of parents be waved.

Resolved upon the Q: that mention be made concerning papists and other Idolators.

Resolved upon the Q: that some others besides papists and other Idolators be mentioned.

Resolved upon the Q: such as profess the true Reformed Religion ought not to marry with papists, Infid[e]ls and other Idolators.

Resolved upon the Q: nor ought such as are godly to be unequally yoaked with such as are notoriously wicked in their life.

Resolved upon the Q: ther[e] shall be a further addition.

Resolved upon the Q: These words shall be added, ‘or maintain damnable Heresies’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-minutes-and-papers-of-the-westminster-assembly-1643-1652.html">The Minutes and Papers of the Westminster Assembly 1643-1652</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ed. Chad VanDixhoorn</cite>, (5 vols, Oxford: Oxford University Press, 2012), Session 683, 4 August 1646, 4: 226.</span></figcaption>

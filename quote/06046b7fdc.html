<blockquote><p>[T]here is not forgiveness but where there is repentance. Therefore look upon all those doctrines, as false and dangerous, which make justification to be before it. Not that we do with Papists make any merit, or causality in repentance, or that we limit it to such a measure and quantity of repentance, nor as if we made it the condition of the Covenant of Grace; but only the way, without which (not the cause for which) remission of sins is not obtained, neither can there be any instance given of men forgiven, without this repentance; and the same likewise is affirmed of faith, though faith is in another notion then repentance, this being the instrument to apply and receive it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), p. 23.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d2ab67faba" data-kw="">
<blockquote><p>Preaching at the opening of Fisherwich Presbyterian meeting-house, Belfast in 1827, Thomas Chalmers explained the connection between justification and sanctification. A contemporary report of the sermon gives us the following account of Dr Chalmers’s sermon:

He then came to the practical application of his subject, – that holiness of life, according to the Christian dispensation, was indispensable to eternal happiness. […] Sanctification is a renewal of the inward man, arising from the operation of the Holy Spirit producing a conviction of past error, and a determination for future amendment of life – for, said he, (with a warmth of manner which we have seldom witnessed,) though we are justified by faith alone, we are not justified by that faith which is alone. […] “THERE IS A WORLD OF THEOLOGY IN THAT SENTENCE – ‘We are justified by faith alone, but not by that faith which is alone.&#x27;” After a moment’s pause, he described the heaven of the Christian, as a heaven of uprightness – a heaven in which the state of a man’s soul, in a moral sense, arising from sanctification by faith, would be more conducive to celestial enjoyment that the place itself – an enjoyment arising from the pure worship of God, and the pleasure of holding converse with the saints, sanctified by faith in Christ. As well, he exclaimed, in a strain of intense eloquence, to which we feel inadequate to do justice, – as well might you offer a heaven of beauty to a blind man, or a heaven of melody to a deaf man, or a heaven of philosophy to a man void of understanding, as a heaven of holiness to a man unsanctified by faith. The place of that heaven is in the heart of man, regenerated by the conviction of the necessity of a virtuous course in this life, to the enjoyment of felicity in that to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Guardian and Constitutional Advocate</cite>, 28 Sep. 1827</span></figcaption>

</figure><figure class="quote" id="q-8f093ce78a" data-kw="">
<blockquote><p>…this is not to be conceived in the way of some transient actions that pass away and leave not so much as a relative change. No, for when God does justify us at first, we are upon our believing put into a state and a fixed condition of peace with God. Thus the Scripture speaks of it as a state, like that of sanctification and glorification; so that while we are sleeping we are justified, because put into that estate, although we do not then actually believe. The first act therefore of faith receiving Christ, in whom we are justified, is like the putting of one into a state of marriage, or of magistracy: Though the first act pass away, yet the relative change it has made continues always; We are not justified by the habit of faith, but by the act, and yet after the first act we stand justified, though we are not all the day long actually believing. Its true, many learned divines say justification is a continued action, and it may be granted in this sense, that God does daily justify believers, even as He constantly preserves them in their natural being; but it is not true in this sense, as if we were put into a new state of justification every day. This is not only to make a first and a second justification, but a thousand justifications; remission of sins and imputation of Christ’s righteousness are reiterated; but justification besides these does connote a fixed estate of the justified person, which is but once, and the Mediator of the Covenant of grace does so firmly uphold this privilege, that there shall never be any total intercission of it, neither do ever any plenarily apostatize from this wonderful favor, that once received it.</p></blockquote>

<blockquote><p>Question: Can any man be justified before he does actually believe? Answer: If we take justification [1] in the first, most proper and principal sense, as it is the act of God alone, communicating Christ’s righteousness and satisfaction to his elect, when He does first unite them to Christ by his Spirit, and make Christ theirs with all his treasures: then it must be granted that men may be and are justified, before and without any express act of believing. As for example: elect infants which die in their infancy, when they are regenerated and united to Christ by his Spirit, they have communion of his righteousness and are justified and made righteous, and all their sins are abolished and blotted out; and yet they do not actually believe, nor perform any explicit and express act of faith. Also they who are not effectually called to the state of grace and to communion with Christ till they come to years of discretion, though they have the gift of faith immediately at the same time infused into them: yet Christ’s righteousness is in order of nature communicated to them, and they are made righteous by it before God, before they do actually believe, or can truly believe that Christ is made to them righteousness, or can by believing possess and enjoy his righteousness for justification. As a child may be born, or made an heir to lands, honor and riches, and may have a true right and interest in them, and be lord of all, before he has wit [understanding] to know his own estate, or discretion to possess actually and use them: so men may be justified by Christ’s righteousness made theirs, in the first instant of their regeneration and spiritual union with Christ, before they do actually believe, and sensibly possess and enjoy Christ and his obedience for justification. [2] But if we take justification in a secondary sense, as it is an act wherein the elect themselves do cooperate and work together with God, by receiving and applying to themselves particularly the gift of righteousness freely given unto them, and by possessing and enjoying it; then must actual believing go before it as the instrumental cause, by which God justifies them in their own sense and feeling, and upon which He does esteem and account them righteous in the intercourse between Him and them, and gives them his warrant to esteem themselves justified with Him. [3] But if we take justification in a judiciary sense, as it is used in courts of justice and judgment, for proving, declaring, and pronouncing men righteous: then not only faith and actual believing, but also repentance, amendment of life, and all holy Christian duties, and good works of piety, mercy, and charity must necessarily go before as evidences, testimonies, and proofs by which men must be justified, that is, judged, declared, and pronounced righteous. First, in the court of their own conscience, so often as sin and Satan stand up against them to accuse them. Secondly, in the common judgment of men. Thirdly, in the general judgment at the last day. Of [1] the first [“most proper”] justification, the apostle speaks, Rom. 5:19, where he says that by the obedience of Christ many are made righteous, and Rom. 8:4 and 2 Cor. 5:21. Of [2] the second [of enjoying it] he speaks, Rom. 3:28, and 4:3, and Gal. 3:8, where he says we are justified by faith without works or deeds of the law. Of [3] the third [“in a judiciary sense”] Saint James speaks, where he says that Abraham was justified by works, James 2:21; and Job 13:18, where he says, “Behold now I have ordered my cause, I know that I shall be justified”; and this St. Paul calls ‘justification of life’, Rom. 5:18, because it is an adjudging of men to eternal life, according to the evidence of their works, as our Savior shows, Mt. 24:35.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“Question: Can any man be justified before he does actually believe? Answer: If we take justification [1] in the first, most proper and principal sense, as it is the act of God alone, communicating Christ’s righteousness and satisfaction to his elect, when He does first unite them to Christ by his Spirit, and make Christ theirs with all his treasures: then it must be granted that men may be and are justified, before and without any express act of believing. As for example: elect infants which die in their infancy, when they are regenerated and united to Christ by his Spirit, they have communion of his righteousness and are justified and made righteous, and all their sins are abolished and blotted out; and yet they do not actually believe, nor perform any explicit and express act of faith. Also they who are not effectually called to the state of grace and to communion with Christ till they come to years of discretion, though they have the gift of faith immediately at the same time infused into them: yet Christ’s righteousness is in order of nature communicated to them, and they are made righteous by it before God, before they do actually believe, or can truly believe that Christ is made to them righteousness, or can by believing possess and enjoy his righteousness for justification. As a child may be born, or made an heir to lands, honor and riches, and may have a true right and interest in them, and be lord of all, before he has wit [understanding] to know his own estate, or discretion to possess actually and use them: so men may be justified by Christ’s righteousness made theirs, in the first instant of their regeneration and spiritual union with Christ, before they do actually believe, and sensibly possess and enjoy Christ and his obedience for justification. [2] But if we take justification in a secondary sense, as it is an act wherein the elect themselves do cooperate and work together with God, by receiving and applying to themselves particularly the gift of righteousness freely given unto them, and by possessing and enjoying it; then must actual believing go before it as the instrumental cause, by which God justifies them in their own sense and feeling, and upon which He does esteem and account them righteous in the intercourse between Him and them, and gives them his warrant to esteem themselves justified with Him. [3] But if we take justification in a judiciary sense, as it is used in courts of justice and judgment, for proving, declaring, and pronouncing men righteous: then not only faith and actual believing, but also repentance, amendment of life, and all holy Christian duties, and good works of piety, mercy, and charity must necessarily go before as evidences, testimonies, and proofs by which men must be justified, that is, judged, declared, and pronounced righteous. First, in the court of their own conscience, so often as sin and Satan stand up against them to accuse them. Secondly, in the common judgment of men. Thirdly, in the general judgment at the last day. Of [1] the first [“most proper”] justification, the apostle speaks, Rom. 5:19, where he says that by the obedience of Christ many are made righteous, and Rom. 8:4 and 2 Cor. 5:21. Of [2] the second [of enjoying it] he speaks, Rom. 3:28, and 4:3, and Gal. 3:8, where he says we are justified by faith without works or deeds of the law. Of [3] the third [“in a judiciary sense”] Saint James speaks, where he says that Abraham was justified by works, James 2:21; and Job 13:18, where he says, “Behold now I have ordered my cause, I know that I shall be justified”; and this St. Paul calls ‘justification of life’, Rom. 5:18, because it is an adjudging of men to eternal life, according to the evidence of their works, as our Savior shows, Mt. 24:35.”

— George Walker, The Key of Saving Knowledge, Opening out of the Holy Scriptures the Right Way &amp; Straight Passage to Eternal Life, … (London: Badger, 1641), pp. 79-82">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQuestion%3A+Can+any+man+be+justified+before+he+does+actually+believe%3F+Answer%3A+If+we+take+justification+%5B1%5D+in+the+first%2C+most+proper+and+principal+sense%2C+as+it+is+the+act+of+God+alone%2C+communicating+Christ%E2%80%99s+righteousness+and+satisfaction+to+his+elect%2C+when+He+does+first+unite+them+to+Christ+by+his+Spirit%2C+and+make+Christ+theirs+with+all+his+treasures%3A+then+it+must+be+granted+that+men+may+be+and+are+justified%2C+before+and+without+any+express+act+of+believing.+As+for+example%3A+elect+infants+which+die+in+their+infancy%2C+when+they+are+regenerated+and+united+to+Christ+by+his+Spirit%2C+they+have+communion+of+his+righteousness+and+are+justified+and+made+righteous%2C+and+all+their+sins+are+abolished+and+blotted+out%3B+and+yet+they+do+not+actually+believe%2C+nor+perform+any+explicit+and+express+act+of+faith.+Also+they+who+are+not+effectually+called+to+the+state+of+grace+and+to+communion+with+Christ+till+they+come+to+years+of+discretion%2C+though+they+have+the+gift+of+faith+immediately+at+the+same+time+infused+into+them%3A+yet+Christ%E2%80%99s+righteousness+is+in+order+of+nature+communicated+to+them%2C+and+they+are+made+righteous+by+it+before+God%2C+before+they+do+actually+believe%2C+or+can+truly+believe+that+Christ+is+made+to+them+righteousness%2C+or+can+by+believing+possess+and+enjoy+his+righteousness+for+justification.+As+a+child+may+be+born%2C+or+made+an+heir+to+lands%2C+honor+and+riches%2C+and+may+have+a+true+right+and+interest+in+them%2C+and+be+lord+of+all%2C+before+he+has+wit+%5Bunderstanding%5D+to+know+his+own+estate%2C+or+discretion+to+possess+actually+and+use+them%3A+so+men+may+be+justified+by+Christ%E2%80%99s+righteousness+made+theirs%2C+in+the+first+instant+of+their+regeneration+and+spiritual+union+with+Christ%2C+before+they+do+actually+believe%2C+and+sensibly+possess+and+enjoy+Christ+and+his+obedience+for+justification.+%5B2%5D+But+if+we+take+justification+in+a+secondary+sense%2C+as+it+is+an+act+wherein+the+elect+themselves+do+cooperate+and+work+together+with+God%2C+by+receiving+and+applying+to+themselves+particularly+the+gift+of+righteousness+freely+given+unto+them%2C+and+by+possessing+and+enjoying+it%3B+then+must+actual+believing+go+before+it+as+the+instrumental+cause%2C+by+which+God+justifies+them+in+their+own+sense+and+feeling%2C+and+upon+which+He+does+esteem+and+account+them+righteous+in+the+intercourse+between+Him+and+them%2C+and+gives+them+his+warrant+to+esteem+themselves+justified+with+Him.+%5B3%5D+But+if+we+take+justification+in+a+judiciary+sense%2C+as+it+is+used+in+courts+of+justice+and+judgment%2C+for+proving%2C+declaring%2C+and+pronouncing+men+righteous%3A+then+not+only+faith+and+actual+believing%2C+but+also+repentance%2C+amendment+of+life%2C+and+all+holy+Christian+duties%2C+and+good+works+of+piety%2C+mercy%2C+and+charity+must+necessarily+go+before+as+evidences%2C+testimonies%2C+and+proofs+by+which+men+must+be+justified%2C+that+is%2C+judged%2C+declared%2C+and+pronounced+righteous.+First%2C+in+the+court+of+their+own+conscience%2C+so+often+as+sin+and+Satan+stand+up+against+them+to+accuse+them.+Secondly%2C+in+the+common+judgment+of+men.+Thirdly%2C+in+the+general+judgment+at+the+last+day.+Of+%5B1%5D+the+first+%5B%E2%80%9Cmost+proper%E2%80%9D%5D+justification%2C+the+apostle+speaks%2C+Rom.+5%3A19%2C+where+he+says+that+by+the+obedience+of+Christ+many+are+made+righteous%2C+and+Rom.+8%3A4+and+2+Cor.+5%3A21.+Of+%5B2%5D+the+second+%5Bof+enjoying+it%5D+he+speaks%2C+Rom.+3%3A28%2C+and+4%3A3%2C+and+Gal.+3%3A8%2C+where+he+says+we+are+justified+by+faith+without+works+or+deeds+of+the+law.+Of+%5B3%5D+the+third+%5B%E2%80%9Cin+a+judiciary+sense%E2%80%9D%5D+Saint+James+speaks%2C+where+he+says+that+Abraham+was+justified+by+works%2C+James+2%3A21%3B+and+Job+13%3A18%2C+where+he+says%2C+%E2%80%9CBehold+now+I+have+ordered+my+cause%2C+I+know+that+I+shall+be+justified%E2%80%9D%3B+and+this+St.+Paul+calls+%E2%80%98justification+of+life%E2%80%99%2C+Rom.+5%3A18%2C+because+it+is+an+adjudging+of+men+to+eternal+life%2C+according+to+the+evidence+of+their+works%2C+as+our+Savior+shows%2C+Mt.+24%3A35.%E2%80%9D%0A%0A%E2%80%94+George+Walker%2C+The+Key+of+Saving+Knowledge%2C+Opening+out+of+the+Holy+Scriptures+the+Right+Way+%26+Straight+Passage+to+Eternal+Life%2C+%E2%80%A6+%28London%3A+Badger%2C+1641%29%2C+pp.+79-82&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffcb71814de.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fcb71814de.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=Question%3A%20Can%20any%20man%20be%20justified,as%20our%20Savior%20shows%2C%20Mt.%2024%3A35&amp;text=Question%3A%20Can%20any%20man%20be%20justified%20before%20he&amp;text=their%20works%2C%20as%20our%20Savior%20shows%2C%20Mt.%2024%3A35" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

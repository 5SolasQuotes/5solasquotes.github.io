<main class="wrap"><figure class="quote" id="q-a11a0e697c" data-kw="">
<blockquote><p>The infinite God cannot be fully known by any of His creatures, but that there is a knowledge of Him within the reach of His creatures of mankind, is apparent from the very constitution of their nature, as well as from the relation in which they stand to Him.

That knowledge reveals to them His spirituality and His glory, as well as His providential care, that “they may seek Him, if haply they may feel after Him and find Him, though He is not far from every one of us.”

This view of the divine nature is furnished by observation of the works of God, and is also the dictate of our own consciousness, which tells us that we are not self-made and selfsustained, but that we are the children of a divine Father and the subjects of His supreme rule.

The Atheist denies the truth that there is a God; and the Pantheist affirms that there is nothing else but God. Both of these errors are renounced by enlightened reason. It refuses to be blind to the great fact of the divine existence. It also rejects the notion that this God is merely an infinite substance — a vague immensity. There is one living and true God, but in Him all being is not absorbed. He is in all; but everything is not God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-macewan.html">Alexander MacEwan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Revelation Embodied in Scripture Supernatural, as Contradistinguished from the Productions of merely Human Thought and Genius in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

quotes.github.io%2Fquote%2Fa11a0e697c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a11a0e697c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/19/alexander-macewan-on-the-natural-knowledge-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>[T]he Heathen Nations had lost the knowledge of the way of Salvation: something in Religion was handed down to them by tradition: and something particularly that had a reference unto Jesus Christ; especially Sacrifices: but the knowledge of the respect they had to him was quite worn out among them, and the light of nature is utterly deficient in this particular: that light is sufficient to discover to us that God is provoked with us, that knowledge flows from our understanding of the nature of God, and the experience which we have of our own sinfulness:

[B]ut the way of reconciliation does exceed the discovery of reason, the light of nature does not teach us that there is any way of reconciliation; much less does it teach us what it is: the light of nature may discover to us that many pretended ways of acceptance are delusions; for it is contrary unto reason to imagine that God will take up with such things: but to determine what is the way, is clearly beyond the most raised understanding of man without divine revelation, upon a supposition that there was a possibility of any other way of acceptance for sinners besides this by Jesus Christ (and I know no ground from Scripture to say that God was confined to this way; that he was necessitated if he would save sinful man, to take this course in order to his Salvation). It will unavoidably follow that the light of nature will leave man short of this knowledge: how can the light of nature reach the free determination of the Will of God?

[B]ut besides this the knowledge of the way of our acceptance with God through Christ does necessarily suppose the knowledge of those two great mysteries; that of the holy Trinity, and that of the Incarnation of the Son God, which do utterly surpass all the dictates of the light of nature: Flesh and blood reveals not those things, but the Father that is in Heaven, Mat. 16.17. hence the Gentiles were utterly mistaken as to this way of reconciliation; and as Paul speaks, became vain in their imaginations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/solomon-stoddard.html">Solomon Stoddard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The safety of appearing at the day of judgement, in the righteousness of Christ: opened and applied</cite>, (Boston MA: Samuel Phillips, 1687), pp 2-3.</span></figcaption>

</figure><figure class="quote" id="q-3adc09ff17" data-kw="">
<blockquote><p>Classical metaphysics attains knowledge of God’s nature by means of an interpretation, mostly taken from the Christian Neo-Platonist Pseudo-Dionysius the Areopagite (c. late fifth century) known as the via triplex or three-fold way. This entails (1) the way of causality (via causalitatis), (2) the way of remotion or negation (via remotionis), and (3) the way of eminence (via eminentiae).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dennis-bonnette.html">Dennis Bonnette</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“How God’s Nature Is Known: The Three-Fold Way”</cite>, (2018)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

<blockquote><p>It [theology] is called doctrine, not to separate it from understanding, knowledge, wisdom, art or prudence–for these go with every exact discipline, and most of all with theology–but to mark it as a discipline which derives not from nature and human inquiry like others, but from divine revelation and appointment. Isa. 51:4, ‘Doctrine shall go forth from Me;’ Mt. 21:25, ‘From heaven… Why then did you not believe him?’; Jn. 9:29, ‘We know that God has spoken to Moses;’ Gal. 1:11-12, ‘The gospel… is not according to man. For I neither received it from man, nor was I taught it, but it came through a revelation;’ Jn. 6:45.

3. The principles of other arts, since they are inborn in us, can be developed through sense perception, observation, experience and induction, and so brought to perfection. But the basic principles of theology, though they be advanced by study and industry, are not in us by nature. Matt. 16:17, ‘Flesh and blood has not revealed this to you.’

4. Every art has its rules to which the work of the person practicing it corresponds. Since living is the noblest work of all, there cannot be any more proper study than the art of living well.

5. Since the highest kind of life for a human being is that which approaches most closely the living and life-giving God, the nature of theological life is living to God. … 8. Although it is within the compass of this life to live both happily and well, euzoia, living well, is more excellent than eudaimonia, living happily. What chiefly and finally ought to be striven for is not happiness which has to do with our own pleasure, but goodness which looks to God’s glory… …

10. Now since this life so willed is truly and properly our most important practice, it is self-evident that theology is not a speculative discipline but a practical one–not only in the common respect that all disciplines have eupraxia, good practice, as their end, but in a special and peculiar manner compared with all others.

11. Nor is there anything in theology which does not refer to the final end or to the means related to that end–all of which refer directly to practice.

12. This practice of life is so perfectly reflected in theology that there is no precept of universal truth relevant to living well in domestic economy, morality, political life or law-making which does not rightly pertain to theology.

13. Theology, therefore, is to us the ultimate and noblest of all exact teaching arts. It is a guide and master plan for our hightest end, sent in a special manner from God, treating of divine things, tending towards God, and leading man to God. It may therefore not incorrectly be called theozoia, a living to God, theourgia, a working towards God, as well as theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, trans. John D. Eusden (1623; Baker, 1997), ch. 1, ‘The Definition or Nature of Theology’, p. 77</span></figcaption>

n+pleasure%2C+but+goodness+which+looks+to+God%E2%80%99s+glory%E2%80%A6+%E2%80%A6+10.+Now+since+this+life+so+willed+is+truly+and+properly+our+most+important+practice%2C+it+is+self-evident+that+theology+is+not+a+speculative+discipline+but+a+practical+one%E2%80%93not+only+in+the+common+respect+that+all+disciplines+have+eupraxia%2C+good+practice%2C+as+their+end%2C+but+in+a+special+and+peculiar+manner+compared+with+all+others.+11.+Nor+is+there+anything+in+theology+which+does+not+refer+to+the+final+end+or+to+the+means+related+to+that+end%E2%80%93all+of+which+refer+directly+to+practice.+12.+This+practice+of+life+is+so+perfectly+reflected+in+theology+that+there+is+no+precept+of+universal+truth+relevant+to+living+well+in+domestic+economy%2C+morality%2C+political+life+or+law-making+which+does+not+rightly+pertain+to+theology.+13.+Theology%2C+therefore%2C+is+to+us+the+ultimate+and+noblest+of+all+exact+teaching+arts.+It+is+a+guide+and+master+plan+for+our+hightest+end%2C+sent+in+a+special+manner+from+God%2C+treating+of+divine+things%2C+tending+towards+God%2C+and+leading+man+to+God.+It+may+therefore+not+incorrectly+be+called+theozoia%2C+a+living+to+God%2C+theourgia%2C+a+working+towards+God%2C+as+well+as+theology.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+The+Marrow+of+Theology+3rd%2C+trans.+John+D.+Eusden+%281623%3B+Baker%2C+1997%29%2C+ch.+1%2C+%E2%80%98The+Definition+or+Nature+of+Theology%E2%80%99%2C+p.+77&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffd689867fb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fd689867fb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-light-of-nature/#:~:text=It%20%5Btheology%5D%20is%20called%20doctrine%2C%20not,towards%20God%2C%20as%20well%20as%20theology&amp;text=It%20%5Btheology%5D%20is%20called%20doctrine%2C%20not%20to%20separate&amp;text=a%20working%20towards%20God%2C%20as%20well%20as%20theology" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But man is capable of knowing God from such creatures in three ways, as Denis says in The Divine Names. He knows him, first of all, through causality. For since these creatures are subject to change and decay, it is necessary to trace them back to some unchangeable and unfailing principle. In this way, it can be known that God exists. Second, he can be known by the way of excellence. For all things are not traced back to the first principle as to a proper and univocal cause, as when man produces man, but to a common and exceeding cause. From this it is known that God is above all things. Third, he can be known by the way of negation. For if God is a cause exceeding his effects, nothing in creatures can belong to him, just as a heavenly body is not properly called heavy or light or hot or cold. And in this way, we say that God is unchangeable and infinite; and we use other negative expressions to describe him. Men had such knowledge through the light of reason bestowed on them: ‘many say: O, that we might see some good! Lift up the light of your countenance upon us, O Lord’ (Ps 4:6).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-74f307474f" data-kw="spiritual death">
<blockquote><p>This sin cannot be said to consist simply in final impenitency (as Augustine held) because all reprobates die in it, who nevertheless cannot be said to sin against the Holy Spirit. Much less can it be made to consist of six species (as many papists maintain): presumption, desperation, resistance to recognized truth, hatred of fraternal grace, obstinacy and impenitency. Scripture makes this sin of one species, nor ought either the parts of any sin or the degrees and dispositions to it to be changed into species of it. In what it does consist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/total-depravity.html">Total Depravity</a> › <a href="../topics/sin/total-depravity/spiritual-death.html">Spiritual death</a></span><span class="t"><a href="../topics/sin/total-depravity.html">Total Depravity</a> › <a href="../topics/sin/total-depravity/natural-mans-virtues.html">Natural man&#x27;s virtues</a></span></div>

</figure><figure class="quote" id="q-19ea18ba90" data-kw="Original Sin The Fall Depravity">
<blockquote><p>We believe that through the disobedience of Adam original sin is extended to all mankind; which is a corruption of the whole nature and a hereditary disease, … and which produces in man all sorts of sin, being in him as a root thereof, and, therefore, is so vile and abominable in the sight of God that it is sufficient to condemn all mankind. … Not that they should rest securely in sin, but that a sense of this corruption should make believers often to sigh, desiring to be delivered from this body of death.</p></blockquote>

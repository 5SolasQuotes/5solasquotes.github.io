<main class="wrap"><figure class="quote" id="q-5b21e4c107" data-kw="">
<blockquote><p>Inability deals with the fact that our own depravity is humanly irremediable. Man is totally unable to change his character or act in a way that is different from it. Definition Negatively, it is not: 1. Metaphysical; it is not due to the loss or absence of any component element of our being, nor to any incompatibility between the component elements in our being, nor to any limitation belonging to our being as creatures. 2. It did not belong to man originally. We must distinguish between what man is unable to be, become, or do because of his finitude, and the moral inability arising from sin. In his original state man had plenary ability to fullfil all of God’s demands. To maintain otherwise would mean that sin was a necessity of the condition in which he was created. For all failure to meet the full demands of God is sin. 3. Inability does not mean the loss of natural liberty. This refers to free agency, namely, that man exercises volition according to his character. Inability presupposes liberty. 4. Inability does not deny the possibility of Justitia civilis, that is natural and social virtue. Positively, inability means that in sin man is not only indisposed and made opposite to all good but that he is totally unable to be otherwise. It is inability to discern, love, or choose the things that are well pleasing to God. He cannot know them because they are spiritually discerned; he cannot love them because his mind is enmity against God; he cannot choose them because those in the flesh cannot please God. It is the [in Greek] ou dunatai (cannot) of the natural man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collected Writings of John Murray</cite>, vol. 2, ch. 9, ‘Inability’, p. 83</span></figcaption>

</figure><figure class="quote" id="q-fe31d700a8" data-kw="">
<blockquote><p>First therefore they say, If so be we are not able to do any thing towards our salvation, this is to turn men into stocks and stones, or beasts, and so [there is] no difference between them and us. But we say, Although those similitudes the Scripture holds forth do prove our inability for that which is good, yet they must not be made alike in all things. It’s true, to convert men, is to make children unto Abraham out of stones; yet we must not think that is therefore an universal likeness between men and stones: For first, consider this vast dissimilitude; In stones and beasts there is no passive capacity of grace, but in man there is. We say, there is a power for grace in a man’s nature; and the Papists say, there is a power: only they say it’s an active power, though remote; we say, only a passive. There is a power to be converted to God, which is not in stones or beasts: they say, there is a power to convert or turn to God; here is a great difference. Besides, we may consider these degrees in the creatures: 1. There is an inclination to such an act, as in the fire to burn. 2. A spontaneous inclination to some acts accompanied with sense, and sensible apprehensions, as in beasts. 3. A willing inclination accompanied with reason or judgment, and this is in man: Now, because man is thus affected, therefore God in converting, though He does it by a potent work, yet by arguments, which we never use to horses, or brute beasts: and although man has lost that rectitude in his will and mind, yet he has not lost the faculties themselves; therefore though he be theologically dead, yet he is ethically alive, being to be wrought upon by arguments. Hence is that saying, ‘To will is of nature, to will well of grace; to will ill of corrupt nature.’ Hence we may grant those objections, that if a man had not this free-will (if you do not extend it to good things) there could be no conversion or obedience; for grace does not destroy, but perfect nature.</p></blockquote>

<blockquote><p>69… Therefore, I hold a middle way, that both the will and the object concur for causing an act of willing, so that the act of willing is from the will and from the object known, as from effective cause… 70… Therefore I say that with the will, in idea of effective cause, the intellect, actually understanding the object, concurs for causing the act of willing, as briefly thus: ‘nature in act, understanding the object, and free,’ is cause of willing and refusing; and in this consists free choice, whether in us or in angels.</p></blockquote>

<blockquote><p>And the change which is absolutely necessary, is a change which God alone can effect. It is by his drawing men that they are induced to come to Christ. By the “drawing” of the Father we are to understand, as is evident form the following verse, the influence of the Holy Spirit, and the cogency of divine truth, understood and believed. It is by being made to hear and learn of the Father, that men are drawn to Christ. It is because men do not understand and believe the truth, that they cannot come to the Savior, and depraved men never will understand and believe that truth, till the Spirit so fix their minds on its meaning and evidence, that they cannot help understanding and believing it, and when men understand and believe the truth, coming to the Savior follows as a matter of course—they can no longer help coming to Him; and when any man, whomsoever he be, Jew or Gentile, however guilty and depraved, drawn by the Father, by his word and Spirit, comes to the Son, our Savior declares that the final salvation of that person is secure. He is one of those who are given to him of the Father, and he shall not be lost, nothing of him shall be lost. He shall be ‘raised up at the last day.’ It is plain from this passage [John 6:44], that the inability of coming to Christ, under which men labor, is not physical, but moral. It does not originate at all in a want [lack] of those intellectual and active faculties which are necessary to come to Christ, but entirely in an indisposition arising out of willful ignorance, and the love of sin, and of the world. It is like the inability of Joseph’s brethren to speak peaceably to him [Gen. 37:4]. If men cannot come to Christ, it is just because they will not come to Him. They who under the gospel dispensation ‘are untaught of God,’ are so, because they refuse to learn of Him. The appropriate means of removing this kind of inability, is the statement of the truth and its evidence. This is all men can do. Divine influence is necessary, absolutely necessary, to fix the mind on the truth and its evidence, so as to produce faith, and the native consequences of that faith; and that influence never was, never will be, refused to him who honestly desires it. What would men have more? Would they have men left to themselves? Then all must perish. Would they have God to compel men to salvation? This would be to do violence to man’s nature, God’s work! Would they have men saved as they are—in sin? This were to require an impossibility, and to do violence at once to the constitution of man, and the nature of God, to disgrace the Divine character, and overturn the Divine throne. The sum of the whole matter is, no man perishes under the gospel dispensation, but in consequence of his own willful obstinacy: no man is saved, but in consequence of a divine influence originating in free sovereign mercy. Man is his own destroyer, God is man’s only Savior. If we perish, our damnation is entirely of ourselves. If we are saved, our salvation is entirely of God.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And the change which is absolutely necessary, is a change which God alone can effect. It is by his drawing men that they are induced to come to Christ. By the “drawing” of the Father we are to understand, as is evident form the following verse, the influence of the Holy Spirit, and the cogency of divine truth, understood and believed. It is by being made to hear and learn of the Father, that men are drawn to Christ. It is because men do not understand and believe the truth, that they cannot come to the Savior, and depraved men never will understand and believe that truth, till the Spirit so fix their minds on its meaning and evidence, that they cannot help understanding and believing it, and when men understand and believe the truth, coming to the Savior follows as a matter of course—they can no longer help coming to Him; and when any man, whomsoever he be, Jew or Gentile, however guilty and depraved, drawn by the Father, by his word and Spirit, comes to the Son, our Savior declares that the final salvation of that person is secure. He is one of those who are given to him of the Father, and he shall not be lost, nothing of him shall be lost. He shall be ‘raised up at the last day.’ It is plain from this passage [John 6:44], that the inability of coming to Christ, under which men labor, is not physical, but moral. It does not originate at all in a want [lack] of those intellectual and active faculties which are necessary to come to Christ, but entirely in an indisposition arising out of willful ignorance, and the love of sin, and of the world. It is like the inability of Joseph’s brethren to speak peaceably to him [Gen. 37:4]. If men cannot come to Christ, it is just because they will not come to Him. They who under the gospel dispensation ‘are untaught of God,’ are so, because they refuse to learn of Him. The appropriate means of removing this kind of inability, is the statement of the truth and its evidence. This is all men can do. Divine influence is necessary, absolutely necessary, to fix the mind on the truth and its evidence, so as to produce faith, and the native consequences of that faith; and that influence never was, never will be, refused to him who honestly desires it. What would men have more? Would they have men left to themselves? Then all must perish. Would they have God to compel men to salvation? This would be to do violence to man’s nature, God’s work! Would they have men saved as they are—in sin? This were to require an impossibility, and to do violence at once to the constitution of man, and the nature of God, to disgrace the Divine character, and overturn the Divine throne. The sum of the whole matter is, no man perishes under the gospel dispensation, but in consequence of his own willful obstinacy: no man is saved, but in consequence of a divine influence originating in free sovereign mercy. Man is his own destroyer, God is man’s only Savior. If we perish, our damnation is entirely of ourselves. If we are saved, our salvation is entirely of God.”

— John Brown of Edinburgh, Discourses &amp; Sayings of our Lord (1852; Banner of Truth, 1990), vol. 1, pp. 459-60">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+the+change+which+is+absolutely+necessary%2C+is+a+change+which+God+alone+can+effect.+It+is+by+his+drawing+men+that+they+are+induced+to+come+to+Christ.+By+the+%E2%80%9Cdrawing%E2%80%9D+of+the+Father+we+are+to+understand%2C+as+is+evident+form+the+following+verse%2C+the+influence+of+the+Holy+Spirit%2C+and+the+cogency+of+divine+truth%2C+understood+and+believed.+It+is+by+being+made+to+hear+and+learn+of+the+Father%2C+that+men+are+drawn+to+Christ.+It+is+because+men+do+not+understand+and+believe+the+truth%2C+that+they+cannot+come+to+the+Savior%2C+and+depraved+men+never+will+understand+and+believe+that+truth%2C+till+the+Spirit+so+fix+their+minds+on+its+meaning+and+evidence%2C+that+they+cannot+help+understanding+and+believing+it%2C+and+when+men+understand+and+believe+the+truth%2C+coming+to+the+Savior+follows+as+a+matter+of+course%E2%80%94they+can+no+longer+help+coming+to+Him%3B+and+when+any+man%2C+whomsoever+he+be%2C+Jew+or+Gentile%2C+however+guilty+and+depraved%2C+drawn+by+the+Father%2C+by+his+word+and+Spirit%2C+comes+to+the+Son%2C+our+Savior+declares+that+the+final+salvation+of+that+person+is+secure.+He+is+one+of+those+who+are+given+to+him+of+the+Father%2C+and+he+shall+not+be+lost%2C+nothing+of+him+shall+be+lost.+He+shall+be+%E2%80%98raised+up+at+the+last+day.%E2%80%99+It+is+plain+from+this+passage+%5BJohn+6%3A44%5D%2C+that+the+inability+of+coming+to+Christ%2C+under+which+men+labor%2C+is+not+physical%2C+but+moral.+It+does+not+originate+at+all+in+a+want+%5Black%5D+of+those+intellectual+and+active+faculties+which+are+necessary+to+come+to+Christ%2C+but+entirely+in+an+indisposition+arising+out+of+willful+ignorance%2C+and+the+love+of+sin%2C+and+of+the+world.+It+is+like+the+inability+of+Joseph%E2%80%99s+brethren+to+speak+peaceably+to+him+%5BGen.+37%3A4%5D.+If+men+cannot+come+to+Christ%2C+i

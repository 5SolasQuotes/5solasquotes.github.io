<blockquote><p>Now ye shall hear how grievously God hath been offended with his people, for that they passed so little upon his holy temple, and foully either despised or abused the same. Which thing may plainly appear by the notable plagues and punishments which God hath laid upon his people, especially in this, that he stirred up their adversaries horribly to beat down, and utterly to destroy, his holy temple with a perpetual desolation.

Alas, how many churches, countries, and kingdoms of Christian people have of late years been plucked down, overrun, and left waste, with grievous and intolerable tyranny and cruelty of the enemy of our Lord Christ, the great Turk, who hath so universally scourged the Christians, that never the like was heard or read of! Above thirty years past the great Turk had overrun, conquered, and brought into his dominion and subjection twenty Christian kingdoms, turning away the people from the faith of Christ, poisoning them with the devilish religion of wicked Mahomet, and either destroying their churches utterly, or filthily abusing them with their wicked and detestable errors.

And now this great Turk, this bitter and sharp scourge of God’s vengeance, is even at hand in this part of Christendom, in Europe, at the borders of Italy, at the borders of Germany, greedily gaping to devour us, to overrun our country, to destroy our churches also, unless we repent our sinful life, and resort more diligently to the church to honour God, to learn his blessed will, and to fulfil the same.</p></blockquote>

<blockquote><p>Thirdly, it is asked whether the Jews are to be compelled to pay field tithes or the other things that Christians living in houses or dwelling in lands which are within the boundaries of some church are accustomed to pay. It seems that: a. For the Church must by no means be defrauded of its right; but it would be defrauded if Jews were to retain lands and not pay tithes; therefore they are to be compelled to payment. b. Furthermore, it was commanded in the Law of Moses that the sons of Israel should pay tithes to the Levites; similarly it is said in Mal. 3:10: Bring every tithe into my storehouse; and in 2 Chron. 31:5, where it is said that they were offering to God tithes of everything. Since, therefore, Jews are bound to the payment of tithes and are exempt from no privilege, since they are of worse condition and ought to be, by reason of sin, than they were in the time of the Law, they will now be bound to the payment of tithes. c. And if perhaps they should say that they would be bound to render them to their own Levites, against this it is that the Levitical priesthood yielded to the priesthood of Christ Himself, as is had in Heb. 7:12: The priesthood having been transferred, it is necessary that a transfer of the Law also be made. Likewise in Daniel: When the Holy of holies has come. Therefore, Christ having come, your anointing ought to cease; the royal and priestly anointing ought to cease; therefore the payment of tithes was to be made to the priests of the New Law. d. Furthermore, tithes are rendered to God from lands in memory of the benefit of the annual multiplication of fruits; but lands are bounded according to the distinction of churches; therefore by reason of fields or lands tithes are to be paid by all who possess them; therefore Jews, if they possess lands, are bound to pay tithes to the churches. On the contrary:

1. Jews have nothing except from usury in most cases; but from usuries the Church ought to receive nothing; therefore, as it seems, neither ought it to receive anything from lands that have been bought with usuries.

2. Again, Sirach 34:21 says: The oblation of one sacrificing from injustice is defiled; and again: He who offers from the substance of the poor is as one who sacrifices a son in the sight of the father. The Most High does not approve the gifts of the unjust. Since, therefore, these men have nothing except the gifts of the unjust, they ought not to be accepted by the Church, which receives in place of the Most High. [Solution]: To this it must be said that some tithes are predial and some are personal. Predial tithes, however, and whatever churches were wont to receive on account of fields, the churches can ask even from Jews by reason of the fields possessed by them, as is had in the Extra, De decimis, De terris, where it is said that Jews are to be compelled to pay tithes from the lands which they cultivate or to renounce the possessions altogether, lest perhaps the churches be able to be defrauded of their right on that account. Likewise it is had in the Extra, De usuris, Quanto, where it is said that Jews are to be compelled to make satisfaction to the churches for tithes and due oblations, which they are accustomed to receive from Christians from houses and other possessions, so that the churches may be preserved unharmed. Not that anything is to be received from usuries or from things acquired unlawfully, or that oblations are to be received in the church from the Jews themselves, but from things lawfully acquired by them by reason of the houses which they inhabit, lest the church be harmed excessively, if nevertheless the decency of the church in this matter is preserved. But if it should be contrary to decency and the church were not harmed excessively, one should refrain, to avoid scandal. [To the objections]:

1. And by this the contrary objection can be solved, because from usuries, insofar as they are such, the Church cannot ask tithes or oblations. And although lands may have been bought from usuries, nevertheless the Church can ask tithes, because the one who sold could sell only what he had by right, while the thing itself passes with its burden.

2. To the second, however, it must be said that, although oblations or gifts are not acceptable to God, insofar as they are offered by the unjust, nevertheless those things which are owed are acceptable, by reason of the fact that they are owed, if they are paid; whence in one respect they are acceptable, in another respect they are not acceptable; yet the action itself, which proceeds from a perverse will, is not acceptable. But when something is offered from theft or usury, it is not acceptable, because it is not offered from what is one’s own; but its restitution, insofar as it is such, would be acceptable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-of-hales.html">Alexander of Hales</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sum of Universal Theology</cite>, (Paris, 1230-1245), pt. 2 of 2, inq. 3, tract 8, sect. 1, quest. 1, title 2 | member 2, ch. 3, ‘Whether Jews are to be compelled to pay tithes?’</span></figcaption>

<blockquote><p>If I shall speak something of the Mahometish religion, I think the truth of the Christian religion will appear so much the more; for when black and white are laid together, the white carrieth the greater estimation and glory with it. And beside, Mahomet himself testifieth of Christ to be a great prophet of God, and a great worker of miracles; and that the same Jesus Christ was born of the virgin Mary, that he lived without sin among men, that he was a prophet, and more than a prophet, and that he ascended into the heavens. And therefore he reproveth the Jews, for that they would not believe him to be born of a virgin. But, on the other side, because he would not have Christ to bear credit above him, he disliked that he should be called or reputed the Son of God. But beside, the testimony of all the former prophets of the world, both Jews and Gentiles, as is afore shewed, do all teach that he should be the Son of God.

Suidas doth moreover confute this false prophet, who reporteth in his History that the Pharisees at Jerusalem called a council to find out the father of Jesus; they enjoined certain women to search his mother; the women affirmed they found her a virgin; then was it recorded in the famous register book of the temple, Jesus the Son of God, and of Mary the virgin. This proveth, not only that the mother of Jesus was a virgin (which Mahomet truly held), but also that Jesus was the Son of God, which Mahomet alloweth not. And indeed Mahomet’s religion is a patched religion, mixed partly with Judaism, partly with Gentilism, partly with Papism, partly with Christianism, being subtilely contrived for the erecting of the same, and to bring followers after him, whereof shall be spoken more hereafter.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“If I shall speak something of the Mahometish religion, I think the truth of the Christian religion will appear so much the more; for when black and white are laid together, the white carrieth the greater estimation and glory with it. And beside, Mahomet himself testifieth of Christ to be a great prophet of God, and a great worker of miracles; and that the same Jesus Christ was born of the virgin Mary, that he lived without sin among men, that he was a prophet, and more than a prophet, and that he ascended into the heavens. And therefore he reproveth the Jews, for that they would not believe him to be born of a virgin. But, on the other side, because he would not have Christ to bear credit above him, he disliked that he should be called or reputed the Son of God. But beside, the testimony of all the former prophets of the world, both Jews and Gentiles, as is afore shewed, do all teach that he should be the Son of God.

Suidas doth moreover confute this false prophet, who reporteth in his History that the Pharisees at Jerusalem called a council to find out the father of Jesus; they enjoined certain women to search his mother; the women affirmed they found her a virgin; then was it recorded in the famous register book of the temple, Jesus the Son of God, and of Mary the virgin. This proveth, not only that the mother of Jesus was a virgin (which Mahomet truly held), but also that Jesus was the Son of God, which Mahomet alloweth not. And indeed Mahomet’s religion is a patched religion, mixed partly with Judaism, partly with Gentilism, partly with Papism, partly with Christianism, being subtilely contrived for the erecting of the same, and to bring followers after him, whereof shall be spoken more hereafter.”

— Henry Smith, God’s Arrow Against Atheism and Irreligion, (1593) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2: 404-05.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+I+shall+speak+something+of+the+Mahometish+religion%2C+I+think+the+truth+of+the+Christian+religion+will+appear+so+much+the+more%3B+for+when+black+and+white+are+laid+together%2C+the+white+carrieth+the+greater+estimation+and+glory+with+it.+And+beside%2C+Mahomet+himself+testifieth+of+Christ+to+be+a+great+prophet+of+God%2C+and+a+great+worker+of+miracles%3B+and+that+the+same+Jesus+Christ+was+born+of+the+virgin+Mary%2C+that+he+lived+without+sin+among+men%2C+that+he+was+a+prophet%2C+and+more+than+a+prophet%2C+and+that+he+ascended+into+the+heavens.+And+therefore+he+reproveth+the+Jews%2C+for+that+they+would+not+believe+him+to+be+born+of+a+virgin.+But%2C+on+the+other+side%2C+because+he+would+not+have+Christ+to+bear+credit+above+him%2C+he+disliked+that+he+should+be+called+or+reputed+the+Son+of+God.+But+beside%2C+the+testimony+of+all+the+former+prophets+of+the+world%2C+both+Jews+and+Gentiles%2C+as+is+afore+shewed%2C+do+all+teach+that+he+should+be+the+Son+of+God.%0A%0ASuidas+doth+moreover+confute+this+false+prophet%2C+who+reporteth+in+his+History+that+the+Pharisees+at+Jerusalem+called+a+council+to+find+out+the+father+of+Jesus%3B+they+enjoined+certain+women+to+search+his+mother%3B+the+women+affirmed+they+found+her+a+virgin%3B+then+was+it+recorded+in+the+famous+register+book+of+the+temple%2C+Jesus+the+Son+of+God%2C+and+of+Mary+the+virgin.+This+proveth%2C+not+only+that+the+mother+of+Jesus+was+a+virgin+%28which+Mahomet+truly+held%29%2C+but+also+that+Jesus+was+the+Son+of+God%2C+which+Mahomet+alloweth+not.+And+indeed+Mahomet%E2%80%99s+religion+is+a+patched+religion%2C+mixed+partly+with+Judaism%2C+partly+with+Gentilism%2C+partly+with+Papism%2C+partly+with+Christianism%2C+being+subtilely+contrived+for+the+erecting+of+the+same%2C+and+to+bring+followers+after+him%2C+whereof+shall+be+spoken+more+hereafter.%E2%80%9D%0A%0A%E2%80%94+Henry+Smith%2C+God%E2%80%99s+Arrow+Against+Atheism+and+Irreligion%2C+%281593%29+in+The+Works+of+Henry+Smith%3B+Including+Sermons%2C+Treatises%2C+Prayers%2C+and+Poems%2C+ed.+Thomas+Fuller+%282+vols%2C+Edinburgh%3A+James+Nichol%2C+1866%29%2C+2%3A+404-05.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fae492c950e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ae492c950e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/08/18/henry-smith-on-islams-denial-of-the-son-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>This opinion is the way to Arminian liberty of conscience, that men in a Christian commonwealth may be of any religion, and the magistrate is to behold men as an indifferent spectator, not caring what religion they be of, whether they be Papists, Jews, Pagans, Anabaptists, Socinians, Macedonians, etc. which should infer that the magistrate were no nurse-father of the true Church, nor yet a preserver of religion, if men might be of any religion…</p></blockquote>

</figure><figure class="quote" id="q-3720e0934f" data-kw="">
<blockquote><p>I piously and gladly believe the perpetual virginity of Mary unto death (hear, impostor); yet this pertains nothing to our mystery of salvation. It suffices for us to believe what is, and is narrated by the evangelists, that our Savior was conceived by the Holy Spirit and born of the Virgin Mary.” ‘Preface’ to the New Testament to the most illustrious Prince of Condé, etc. If one who speaks thus dared to thrust his most unclean snout into Mary’s virginity, what shall I say of the great Basil, who in the homily on the Nativity of the Lord says, whether after the mystery of the incarnation the Virgin bore children or not, παρὰ ταῦτα δὲ οὐδὲν δοξάζομεν πᾶσι, it in no wise injures the business of piety. For so long as it was necessary to serve the dispensation, virginity was necessary. “But what afterwards followed,” he says, “σιωπῇ παραδοτέον τοῖς λόγῳ οὐ μυστήρια καταλείψομεν [we shall leave in silence to those who speak the mysteries which cannot be expressed in words], nor is it necessary to inquire anxiously into what pertains to the nature of this mystery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Works</cite>, vol. 3, Jesuita Vapulans, or the Castigation of the Notes of Sylvester Petrasancta Loyola’s Sectary, On the Letter of Peter Molinaeus to Balzac (1535), ch. 15 tr. AI by The Faith Received | The Jews did not so highly esteem virginity that we should therefore exterminate it; and therein you lie, as you are wont. We praise chaste virginity, but compel no one thereto who would rather marry than fall into the peril of incontinence. You accuse Beza that he dared to thrust his most unclean snout into the very virginity of Mary the mother of God, and to call into doubt whether, after childbirth, the Virgin persevered [in virginity]. You keep to the old way, that is, you calumniate. The words of Beza which you cite in the margin of the preface are these:</span></figcaption>

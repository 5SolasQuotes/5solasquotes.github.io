<blockquote><p>34. Though we must prefer better before worse, that worse may be best to us at that time and place when we cannot have better without more hurt than benefit to the public or ourselves. Among many ministers, weak and strong, all cannot hear the best, nor must renounce the weaker. To live under the countenance of government under an honest¹ minister of mean parts in peace and concord, though he use the liturgy, is more to the common advantage of religion and to the profit of most particular souls than to hear an abler man with the distraction of disturbers² and to be fined and lie in prison on no better a cause.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-06015b364f" data-kw="">
<blockquote><p>The Church may be corrupted many ways, in doctrine, ordinances, worship, etc. And there are degrees of this corruption; the doctrine in some remote points, the worship in some rituals of man’s invention or custom. How many Churches do we find thus corrupted, and yet no separation of Christ from the Jewish Church, nor any commandment to the godly of Corinth, etc. to separate. I must in such a case avoid the corruption, hold the communion—But if corruptions invade the fundamentals, the foundation of doctrine is destroyed, the worship is become idolatrous; and what is above all, if the Church impose such laws of her communion as there is a necessity of doing or approving things unlawful, in that case, ‘Come out of Babylon.’ The Churches of Protestants so separated from Rome.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Sacrament, p. 239 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

rch%20may%20be%20corrupted%20many%20ways%2C%20in&amp;text=The%20Churches%20of%20Protestants%20so%20separated%20from%20Rome" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-50e9332d21" data-kw="">
<blockquote><p>My partaking in any divine worship which is holy and good for the matter, and allowable or passable for the mode in the main, does not involve me in the blame of some sinful defects therein, to which I consent not, and which I cannot redress.

2. I do not acquiesce in this form of worship only, nor do I by my example induce others so to do, seeing in other congregations I both dispense and attend upon the Word and prayer in another form, and judge it necessary for me so to do.

3. It is to me indubitable that this form is so far profitable and edifying, as that merely for the defects found therein, there is no cause of renouncing it or the communion of the Churches for its sake, especially while other prayer and the preaching of the Word is not there by excluded. … I would give no occasion to any of disowning or reproaching a form of divine worship which is sound in the substance thereof, and accepted of God from the sincere, though it be less perfect in diverse material points and less convenient for the mode.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity</cite>, ... (London: 1683), The Nonconformists Plea for Lay-Communion with the Church of England, pp. 6-7, 10</span></figcaption>

<blockquote><p>Section 5. Note that things not determined of God [for public worship] and left to the determination of men must be such as are necessary in genere, and not things idle and superfluous. A superior may not institute a superfluous thing that is not simply evil, though sometimes the inferior may lawfully obey therein; or to speak more properly, [the inferior may] lawfully do the thing to avoid inconvenience, or to testify respect to the superior, though in that particular he has no lawful power to command. Note also, that of things necessary in genere, the superior may not lawfully determine for such species, as, though not simply evil, may have a tendency to evil or be evil in the consequence, when he may determine that which will not be evil in the consequence. Yet the inferior may obey, or rather observe the thing commanded, when the evil consequence of non-observance will be greater than the evil consequence of observance. Section 6. If superiors command that which is above their sphere to command [for public worship], namely, things not necessary in genere [by its kind], yet if they be not simply evil, subjects may¹ do those things, unless they be evil in their consequence to a higher degree than the not doing of them would be.² In this case it is not formal obedience,³ but they are done for the end’s sake and to avoid evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship… in The Remains of the Reverend &amp; Learned Mr. John Corbet… (London: Thomas Parkhurst, 1684), pt. 3 Corbet (d. 1680) was an English, congregationalist puritan.</span></figcaption>

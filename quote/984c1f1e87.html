<blockquote><p>That either in Scotland, or anywhere else in the world, the hair of any person is commanded to be cut by any Church judicatory, for disgrace and punishment, is (as I take it) but a foolish fable.</p></blockquote>

</figure><figure class="quote" id="q-9932df8e09" data-kw="">
<blockquote><p>I am taught by the… passage to give no unnecessary outrage to the customs, whether of my age or neighborhood — such customs as, however ephemeral or however local, cannot be violated without a moral hardihood and defiance on the part of the transgressor, and without scandalizing the observers of the offensive exhibition. To estimate the force of this remark, let us but think of how much and what evil would be implied and wrought if the men of our day were to commence the practice of sitting in Church with their hats on, and the women with their bonnets off. Our existing habit, which is a second nature, would cause us to feel that it were a shameful thing in the reckless few who dared such an innovation, and so as to warrant the interference of the Church authorities on the subject. There is enough of analogy between the hats and the long hair to make the apostle’s earnestness on the subject of that liberty which he here reproves to be not altogether unintelligible:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1 Cor. 11 in Sabbath Scripture Readings, p. 232</span></figcaption>

</figure><figure class="quote" id="q-27d84b2ac8" data-kw="">
<blockquote><p>This article analyses the recodification of the covering of women from the Reformation to the Enlightenment, discussing and juxtaposing rich visual material, normative regulations and court cases… Early modern costume books demonstrate the potential of the veil to map locally specific cultural differences manifested in dress. Veiled women could stand for propriety, yet veils might also be read as a sign of lust, disorder and seduction. Case studies of Reformation Basel and Zürich develop these broader findings in detail. They show not only that the veil provided a screen onto which could be projected strangeness and danger, but also how in practice it marked women as respectable or dishonourable, rich or poor, married or unwed. Furthermore, it was read as an index of morality and gained much attention in a fashion policy critical of luxury. The veil was thus central to an identity politics preoccupied with social ordering, moral standards, and also fashion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/susanna-burghartz.html">Susanna Burghartz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Covered Women? Veiling in Early Modern Europe’ Pre Abstract in History Workshop Journal, no. 80</cite>, (Autumn, 2015), pp. 1-32 with numerous pictures</span></figcaption>

%20social%20ordering%2C%20moral%20standards%2C%20and%20also%20fashion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ecf7db324f" data-kw="">
<blockquote><p>At this day the Mahometans (or Turks) speak to their superiors covered, and so are covered also in their religious performances. The custom with us in these western parts is quite otherwise; the uncovering of the head is a sign or token of subjection: hence ministers pray and preach with their heads uncovered, to denote their subjection to God and Christ: but yet this custom is not uniform, for in France the Reformed ministers preach with their heads covered; as they pray uncovered, to express their reverence and subjection to God, so they preach covered, as representing Christ, the great Teacher, from whom they derive, and whom they represent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, v. 4</span></figcaption>

<main class="wrap"><figure class="quote" id="q-ef2014537d" data-kw="">
<blockquote><p>And so the kingly power in general as given for the good of all human societies in general, is from God the Creator for the good of all societies whither heathen or Christian. So Nebuchadnezzar, Darius, Nero, and Julian were essentially kings, and yet had not their kingly power immediately from the Mediator Christ, except in this general sense that the kingly power is a lawful ordinance of God warranted by the Word of God and Testament of our Testator Jesus Christ, because these are essentially kings and lawful magistrates who either never heard of Christ, nor any thing of God; but only that He is Creator of the world, or then who persecute and hate the name of Jesus Christ… Now Formalists, denying such to be lawful kings, as either know not Christ, or believe not in Him, join hands with Papists, and make way for Anabaptistical anarchy, that a persecuting or an unbelieving king is no king, not to be obeyed, but to be turned out of his throne: And to this meaning, Calvin, Viret and Cartwright teach that the kingly power flows immediately from God the Creator, not from God in the Mediator Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea... (1642), ch. 19</cite>, p. 295</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7468f88d0b" data-kw="">
<blockquote><p>But what then is the part of the Prince after that the Church has given judgement? Surely, whensoever need is, he ought by the private judgement of Christian discretion to try and examine whether this [ecclesiastical] discipline be rightly executed or not. If he find the execution thereof to be unreproveable and that yet the sinner goes on in his contumacy, then by his civil power he ought further to punish him in his person, or wordly estate, that he may either reform or repress such a one as has not been terrified by the Church’s censures (Calvin, Book of Epistles, col. 169; Gratian., Caus. 11, q. 1, ch. 20). But if after trial, he understand that the sentence given forth is unjust and erroneous, either through the ignorance or the malice of the ecclesiastical and regular judges, then he ought to interpone his authority, and cause a due proceeding [in ecclesiastical courts], for in such extraordinary cases of the failing of ecclesiastical persons, Princes may do much in things and causes Spiritual which ordinarily they cannot.</p></blockquote>

</figure><figure class="quote" id="q-bb1b33fbe2" data-kw="">
<blockquote><p>The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27).¹ ¹ See ‘On the Ethics of Paying Specific Taxes designated to a Corrupt Purpose or Imposed by a Usurped Authority or Usurper’ and ‘On the Ethics of Paying the Scottish Cess Near &amp; During the Killing Times’ at ‘On Paying Taxes’ (RBO). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged [Scottish ministers] censured the indulged with?² Did Jesus compromise his authority or the exercise of his ministry? ² Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Editor’s Extended Introduction, p. 151 in English Puritans, A Refutation of the Errors of Separatists (1604; 1644; RBO, 2025)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-9cdcbe8cb2" data-kw="">
<blockquote><p>Now all this being unquestionably true of the Jewish Sanhedrin: if we should suppose, that they had no supreme Sanhedrin but that which had the power of civil Magistracy, then I ask where is that Christian State, which was, or is, or ought to be molded according to this pattern. Must ministers have vote in parliament? Must they be civil lawyers? Must all criminal and capital judgments be according to the Judicial Law of Moses, and none otherwise? Must there be no civil punishment, without previous admonition of the offender? Must Parliaments sit, as it were in the Temple of God, and interpret Scripture, which sense is true, and which false, and determine controversies of faith and cases of conscience, and judge of all false doctrines? Yet all this must be if there be a parallel made with the Jewish Sanhedrin. I know some divines hold, that the Judicial Law of Moses, so far as concerns the punishments of sins against the moral Law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, etc. ought to be a rule to the Christian Magistrate. and for my part, I wish more respect were had to it, and that it were more consulted with.</p></blockquote>

nk">Read it online · Reformed Books Online</a></div>

<blockquote><p>…the pope… can excommunicate a ruler and thereby dissolve all obligations his subjects have to support and obey him, thus overthrowing governments at will. Thomas [of Aquinas] wrote: …if someone commits the sin of unbelief he can be deprived of his right to rule by judicial sentence, just as for other failings… Therefore, as soon as someone falls under a sentence of excommunication for apostasy from the faith, his subjects are ipso facto absolved from his rule and from the oath of fealty by which they were bound to him. (Summa Theologiae, ii-ii, Question 12, in Basic Writings of Thomas Aquinas, Anton C. Pegis, editor. New York: Random House, 1945.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robbins.html">John Robbins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Megalomania (Trinity Foundation, 1995)</cite>, pp. 130-31</span></figcaption>

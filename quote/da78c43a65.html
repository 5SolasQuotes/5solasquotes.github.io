<main class="wrap"><figure class="quote" id="q-da78c43a65" data-kw="">
<blockquote><p>Let us bear in mind that every child of God is under high and holy discipline, and that true grace is certain to be tried and sifted. If Jesus learned obedience by the things he suffered, though he were a Son, good cause there is that we too should be sifted. Remember that the Lord tried Israel for forty years, to prove what was in their hearts; and if he cross our will, it is to try our faith and patience — if heresy come into deceive if it were possible the very elect, it is to make manifest them that are approved. Let us labour that, whether present or absent, we may be accepted of him, and count it all joy to meet the trials which strengthen faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord s Jealousy Against Backsliders Consistent with His Unchanging Love’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry.html">Church Government and the Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-39255d67dc" data-kw="">
<blockquote><p>However, we think that no proper lawmaking (nomothetiken) power was given to the church by which she can make laws directly and by themselves binding the conscience; but only an ordaining power (diataktiken), which can form constitutions and canons for the preservation of peace and good order (eutaxias), which on this account do not bind the conscience by themselves and directly, but only indirectly in case of scandal; that these are… only an order by ministers; not of the essentials of Christ’s kingdom, but only of the external accidents and things indifferent; nor are they good per se, but only on account of circumstances and their relation (schesin) to the end. … IV. (2) …[Moral] Laws bind the conscience per se and directly, and a violation of them incurs guilt; but constitutions bind the conscience only indirectly, and a violation of them incurs guilt; but constitutions bind the conscience only indirectly and mediately in case of scandal and contempt. Hence the guilt arising from their violation is not properly on account of the violation of the constitution, but on account of the neglect of the authority which God ordained, and on account of the scandal given. … XX. Again, in the transgression of them [church constitutions] there can be no sin except indirectly (i.e., not on account of the usurpation of the thing itself [as in homicide, fornication, etc., previously mentioned], but on account of another thing [if it is from contempt of lawful authority], for because obedience is commanded by God, there is sin in a neglect of it, if with a neglect of brotherly edification, or if from impiety and license. However, if all these are absent, there will be no sin in a transgression of them… nor is the authority of the one commanding to be so much regarded as the cause of the command.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, p. 285-6, 290-1 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><figure class="quote" id="q-4f0125f611" data-kw="">
<blockquote><p>All I mean to infer from what I have said is, that though councils, otherwise pious and holy, were governed by the Holy Spirit, he yet allowed them to share the lot of humanity, lest we should confide too much in men.</p></blockquote>

</figure><figure class="quote" id="q-84003b4470" data-kw="">
<blockquote><p>Besides, do not our divines require that the Church’s canons, even in matters of rite, be ‘profitable to the edification of the Church’ (Polanus, Syntagma, bk. 7, ch. 17); and that the observation of the same, must carry before it a manifest utility (Calvin, Institutes, bk. 4, ch. 10, §32); that in rites and ceremonies the Church has no power to destruction, but only to edification? (Chemnitz, Examination, part 2, p. 121)… Do they not teach that no idle ceremony, which serves not unto edifying, is to be suffered in the Church (Paraeus, on 1 Cor. 14:26; John Calvin, Epistolarum &amp; Responsorum, col. 478); and that godly bretheren are not holden to subject themselves unto such things as they perceive neither to be right nor profitable? (Calvin, on 1 Cor. 10:23; Taylor on Titus 1:15, p. 295) That whatsoever either would scandalize our brother, or not be profitable to him for his edification, Christians for no respect must dare to meddle with it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (Edinburgh, 1637) | pt. 2, ch. 1, p. 8</span></figcaption>

<blockquote><p>The power of order alone shall make the difference betwixt the pastor and the ruling elder; for by the power of order, the pastor does preach the Word, minister the sacraments, pray in public, bless the congregation, celebrate marriage, which the ruling elder cannot.</p></blockquote>

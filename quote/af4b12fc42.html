<main class="wrap"><figure class="quote" id="q-af4b12fc42" data-kw="">
<blockquote><p>…creation is instantaneous, unpreceded by a process of becoming… St. Thomas excels in explaining this distinction, just now noted, between passive potency and active potency. Real passive potency is not simple possibility. Simple possibility is prerequired and suffices for creation ex nihilo. But it does not suffice as prerequisite for motion, change, mutation. Mutation presupposes a real subject, determinable, transformable, mutable, whereas creation is the production of the entire created being, without any presupposed real potency. Now, since active potency, active power, must be greater in proportion to its passive correlative, it follows that when passive potency is reduced to zero, the active potency must be infinite. In other words, the most universal of effects, the being of all [created] things, cannot be produced except by the most universal of all causes, that is, by the Supreme Being. (Summa, pt. 1, q. 45, art. 1, 2, 5; pt. 3, q. 75, art. 8)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: A Synthesis of Thomistic Thought (n.p., 1946), ch. 5, ‘Act &amp; Potency’, pp. 29-30 Lagrange is a Romanist, neo-Thomist theologian.</cite></span></figcaption>

<blockquote><p>All creatures and created beings compared with God, the first being of Himself subsisting, and the infinite God may be denied, to be beings comparatively: And so our created self is nothing, to wit, nothing in dignity, or excellency beside God, or nothing in the kind of a being that essentially is of itself: as God is in genere entis per essentiam, yet man is a being in the kind of being by participation, in genere entis per participationem; man comared with God, is a poor, worthless, sorry, little-nothing, a weeping, melting, evanishing cipher… So the Scripture says, ‘Man at his best state is altogether vanity.’ Ps. 39:5, ‘Behold, thou hast made my days as a handbreadth, and mine age is nothing before thee: verily every man at his best state is altogether vanity.’ Isa. 40:17, ‘All nations before Him are nothing, and less than nothing, and vanity.’ Yet a heathen may say and think and demonstrate by reason that self and man, and all the world are less in incomparison of the infinite God than nothing to all things, a drop of water to the sea, the shadow to the body, a peny-torch to the light of ten thousand millions of suns in one;</p></blockquote>

<blockquote><p>VII. II. An adjunct of the world is its goodness and perfection, by which the world is conformable to the divine will, and consists of all its parts. It is therefore perfect, not simply and absolutely, in which sense only God is good and perfect, Mk. 1018; but in a certain respect and in its own kind, because nothing is wanting in it which belongs to the world from the intention of the Creator. Gen. 1:31, “all things that God had made were very good.” Ps. 104:24 “how magnificent are your works, O Lord, you have made all things in wisdom: the earth is full of your possessions.” 1 Tim. 4:4, “Every creature of God is good.” cf. Ps. 8. And this is shown both by the order of the parts of the world, and by their varieties and integrity: which David praises in the whole of Ps. 104. Those things which seem viler and more imperfect are only such separately from the whole and comparatively, since they too were wisely and well made, and contribute to the perfection of the universe. To that which is wont to be asked: Whether God could have made the world more perfect; it must be said: The species of beings could indeed have been made accidentally more perfect, because their qualities and endowments can be increased, and they admit of more and less; yet they could not have been made essentially more perfect, their essences remaining safe and unchanged, because species are like numbers, to which if a unit is added or subtracted, the numbers are changed. If, therefore, God were to add an essential perfection to a certain species, that species would be changed, and would not remain such a species. Meanwhile, God could have produced other species, more perfect than those which He actually produced; since the power of God is infinite, and not exhausted by the production of the creatures actually existing in the world. It can also be said that God can make something better, not adverbially, because He made all things in the best way, but adjectivally, because He can make good things better and increase their accidental goodness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’ (Frankfurt: Steppinus, 1706), ch. 2, On Creation</cite>, p. 20 trans. AI Latin</span></figcaption>

</figure><figure class="quote" id="q-633c5168f2" data-kw="">
<blockquote><p>Change, as we saw in chapter 1, is the actualization of potential. We have also seen that God is pure actuality, devoid of potentiality. Now, if He has no potential that needs to be, or indeed could be, actualized, then He cannot change. He is therefore immutable or changeless. To be sure, it might seem that He changes insofar as He creates the world. For doesn’t this involve a transition from God’s not creating it to his creating it? But as I have just argued, God’s being Creator of the world is a Cambridge property rather than a real property, and his becoming the world’s Creator is thus a mere Cambridge change. Just as, in our example, Socrates’ becoming shorter than Plato [when Plato grew taller] involved a real change only in Plato and not in Socrates, so too does God’s becoming Creator of the world involve a real change only in the world’s status, not in God. To say that God is immutable is to say that there is no real change in Him, though there may of course be Cambridge changes. … It might be objected that in creating the world, God acts, and that acting always involves a change in the one acting and not merely in the thing He acts upon… However, while it is true that the things of our experience happen to undergo changes themselves in the course of acting upon other things, it simply does not follow that absolutely anything that acts must necessarily undergo change itself as it does so. To draw such an inference would be to commit what is called a fallacy of accident. Such a fallacy would be committed, for example, if one were to conclude from the premise that every college professor who has ever lived has been under nine feet tall to the conclusion that any possible college professor must be under nine feet tall… As Brian Davies points out in responding to this sort of objection, what is essential to acting is the bringing about of an effect in another thing, rather than undergoing change oneself as one does so. For example, what is essential to teaching is that one causes someone else to learn, and not that one does so by lecturing, specifically, or by writing books, or what have you. Similarly, what is essential to creating is simply that God causes the world to exist. There is nothing in this that requires that it be done by virtue of the Creator’s undergoing change Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God (Ignatius Press, 2017), ‘The Divine Attributes’, ‘Immutability’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>
<div class="actions"><button class="copy" data-copy="“Change, as we saw in chapter 1, is the actualization of potential. We have also seen that God is pure actuality, devoid of potentiality. Now, if He has no potential that needs to be, or indeed could be, actualized, then He cannot change. He is therefore immutable or changeless. To be sure, it might seem that He changes insofar as He creates the world. For doesn’t this involve a transition from God’s not creating it to his creating it? But as I have just argued, God’s being Creator of the world is a Cambridge property rather than a real property, and his becoming the world’s Creator is thus a mere Cambridge change. Just as, in our example, Socrates’ becoming shorter than Plato [when Plato grew taller] involved a real change only in Plato and not in Socrates, so too does God’s becoming Creator of the world involve a real change only in the world’s status, not in God. To say that God is immutable is to say that there is no real change in Him, though there may of course be Cambridge changes. … It might be objected that in creating the world, God acts, and that acting always involves a change in the one acting and not merely in the thing He acts upon… However, while it is true that the things of our experience happen to undergo changes themselves in the course of acting upon other things, it simply does not follow that absolutely anything that acts must necessarily undergo change itself as it does so. To draw such an inference would be to commit what is called a fallacy of accident. Such a fallacy would be committed, for example, if one were to conclude from the premise that every college professor who has ever lived has been under nine feet tall to the conclusion that any possible college professor must be under nine feet tall… As Brian Davies points out in responding to this sort of objection, what is essential to acting is the bringing about of an effect in another thing, rather than undergoing change oneself as one does so. For example, what is essential to teaching is that one causes someone else to learn, and not that one does so by lecturing, specifically, or by writing books, or what have you. Similarly, what is essential to creating is simply that God causes the world to exist. There is nothing in this that requires that it be done by virtue of the Creator’s undergoing change Himself.”

— Edward Feser, Five Proofs of the Existence of God (Ignatius Press, 2017), ‘The Divine Attributes’, ‘Immutability’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CChange%2C+as+we+saw+in+chapter+1%2C+is+the+actualization+of+potential.+We+have+also+seen+that+God+is+pure+actuality%2C+devoid+of+potentiality.+Now%2C+if+He+has+no+potential+that+needs+to+be%2C+or+indeed+could+be%2C+actualized%2C+then+He+cannot+change.+He+is+therefore+immutable+or+changeless.+To+be+sure%2C+it+might+seem+that+He+changes+insofar+as+He+creates+the+world.+For+doesn%E2%80%99t+this+involve+a+transition+from+God%E2%80%99s+not+creating+it+to+his+creating+it%3F+But+as+I+have+just+argued%2C+God%E2%80%99s+being+Creator+of+the+world+is+a+Cambridge+property+rather+than+a+real+property%2C+and+his+becoming+the+world%E2%80%99s+Creator+is+thus+a+mere+Cambridge+change.+Just+as%2C+in+our+example%2C+Socrates%E2%80%99+becoming+shorter+than+Plato+%5Bwhen+Plato+grew+taller%5D+involved+a+real+change+only+in+Plato+and+not+in+Socrates%2C+so+too+does+God%E2%80%99s+becoming+Creator+of+the+world+involve+a+real+change+only+in+the+world%E2%80%99s+status%2C+not+in+God.+To+say+that+God+is+immutable+is+to+say+that+there+is+no+real+change+in+Him%2C+though+there+may+of+course+be+Cambridge+changes.+%E2%80%A6+It+might+be+objected+that+in+creating+the+world%2C+God+acts%2C+and+that+acting+always+involves+a+change+in+the+one+acting+and+not+merely+in+the+thing+He+acts+upon%E2%80%A6+However%2C+while+it+is+true+that+the+things+of+our+experience+happen+to+undergo+changes+themselves+in+the+course+of+acting+upon+other+things%2C+it+simply+does+not+follow+that+absolutely+anything+that+acts+must+necessarily+undergo+change+itself+as+it+does+so.+To+draw+such+an+inference+would+be+to+commit+what+is+called+a+fallacy+of+accident.+Such+a+fallacy+would+be+committed%2C+for+example%2C+if+one+were+to+conclude+from+the+premise+that+every+college+professor+who+has+ever+lived+has+been+under+nine+feet+tall+to+the+conclusion+that+any+possible+college+professor+must+be+under+nine+feet+tall%E2%80%A6+As+Brian+Davies+points+out+in+responding+to+this+sort+of+objection%2C+what+is+essential+to+acting+is+the+bringing+about+of+an+effect+in+another+thing%2C+rather+than+undergoing+change+oneself+as+one+does+so.+For+example%2C+what+is+essential+to+teaching+is+that+one+causes+someone+else+to+learn%2C+and+not+that+one+does+so+by+lecturing%2C+specifically%2C+or+by+writing+books%2C+or+what+have+you.+Similarly%2C+what+is+essential+to+creating+is+simply+that+God+causes+the+world+to+exist.+There+is+nothing+in+this+that+requires+that+it+be+done+by+virtue+of+the+Creator%E2%80%99s+undergoing+change+Himself.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+Five+Proofs+of+the+Existence+of+God+%28Ignatius+Press%2C+2017%29%2C+%E2%80%98The+Divine+Attributes%E2%80%99%2C+%E2%80%98Immutability%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F633c5168f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/633c5168f2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/creation#:~:text=Change%2C%20as%20we%20saw%20in%20chapter,of%20the%20Creator%E2%80%99s%20undergoing%20change%20Himself." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-615059786d" data-kw="">
<blockquote><p>There is, brethren, one God, the knowledge of whom we gain from the Holy Scriptures, and from no other source. For just as a man if he wishes to be skilled in the wisdom of this world will find himself unable to get at it in any other way than by mastering the dogmas of philosophers, so all of us who wish to practice piety will be unable to learn its practice from any quarter than the oracles of God. Whatever things then the Holy Scriptures declare, at these let us look; and whatsoever things they teach these let us learn.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hippolytus-of-rome.html">Hippolytus of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Heresies</cite>, 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a></span></div>

</figure><figure class="quote" id="q-7761f3b35c" data-kw="">
<blockquote><p>Our SECOND REASON is this: The scriptures were delivered to us that we might possess a rule of faith. Consequently, the scripture is sufficient, and therefore the scripture is perfect. For if it be a rule, it is a perfect rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Question VI, on the perfection of Scripture</span></figcaption>

</figure><figure class="quote" id="q-d8c754bfe5" data-kw="">
<blockquote><p>We receive and embrace all the canonical Scriptures, both of the Old and New Testament, giving thanks to our God, who hath raised up unto us that light which we might ever have before our eyes, lest either by the subtlety of man, or by the snares of the devil, we should be carried away to errors and lies. Also that these be the heavenly voices, whereby God hath opened unto us His will: and that only in them man&#x27;s heart can have settled rest; that in them be abundantly and fully comprehended all things, whatsoever be needful for our salvation, as Origen, Augustine, Chrysostom, and Cyrillus have taught: that they be the very might and strength of God to attain to salvation: that they be the foundations of the Prophets and Apostles, whereupon is built the Church of God: that they be the very sure and infallible rule, whereby may be tried, whether the Church do stagger, or err, and whereunto all ecclesiastical doctrine ought to be called to account: and that against these Scriptures neither law, nor ordinance, nor any custom ought to be heard: no, though Paul his own self, or an angel from heaven, should come and teach the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>

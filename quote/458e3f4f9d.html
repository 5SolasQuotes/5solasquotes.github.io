<main class="wrap"><figure class="quote" id="q-458e3f4f9d" data-kw="">
<blockquote><p>It is from eternity, part of the decree of election, although its awareness is given to the faithful at a certain time. In contrast, regeneration happens in time, starting with the first sparks of faith and the initial movements of repentance.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6ef0405c03" data-kw="">
<blockquote><p>From all these absurdities [of the sacrament of penance] the doctrine which we deliver is completely free. For absolution is conditional, allowing the sinner to trust that God is propitious to Him, provided he sincerely seek expiation in the sacrifice of Christ, and accept of the grace offered to him. Thus, he cannot err who, in the capacity of a herald, promulgates what has been dictated to him from the Word of God. The sinner, again, can receive a clear and sure absolution when, in regard to embracing the grace of Christ, the simple condition annexed is in terms of the general rule of our Master Himself—a rule impiously spurned by the Papacy—’According to your faith be it unto you,’ (Mt. 9:29).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845) Note Calvin speaking of repentance as a “condition” for the forgiveness of sins in vol. 2, bk. 3, ch. 3, sect. 20, p. 174., vol. 2, bk. 3, ch. 4, sect. 22, p. 212</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“From all these absurdities [of the sacrament of penance] the doctrine which we deliver is completely free. For absolution is conditional, allowing the sinner to trust that God is propitious to Him, provided he sincerely seek expiation in the sacrifice of Christ, and accept of the grace offered to him. Thus, he cannot err who, in the capacity of a herald, promulgates what has been dictated to him from the Word of God. The sinner, again, can receive a clear and sure absolution when, in regard to embracing the grace of Christ, the simple condition annexed is in terms of the general rule of our Master Himself—a rule impiously spurned by the Papacy—’According to your faith be it unto you,’ (Mt. 9:29).”

</figure><figure class="quote" id="q-a270ed495d" data-kw="">

</figure><figure class="quote" id="q-835360d60a" data-kw="">
<blockquote><p>We attribute justification to neither faith otherwise than as an instrument, nor to good works otherwise than as witnesses of true faith. Instead, we attribute the righteousness of Christ alone as the material cause, and imputation as the formal cause.</p></blockquote>

</figure><figure class="quote" id="q-e1dff2ee29" data-kw="">

<main class="wrap"><figure class="quote" id="q-5466316c74" data-kw="">
<blockquote><p>Mary’s virginity did not flow from a vow, whether on the parents’ part or on her own. With many other fairy tales contrary to the practice of the gens and the nature of wedlock she entered upon, this is a fiction of the Papists, using Lk. 1:34 (‘How shall this be, seeing I know not a man?’) for empty weaving of words, which, whether we translate them in the past with a frequent change of tense, or in the present or even, with reference to Isaiah’s prophecy, in the future, establish not a prayer but only a particular fact. Nor does Christian faith demand that Mary’s virginity be extended perpetually beyond the nativity of Jesus, as the Papists will again have it on the pretext of a vow and the of the excellency of virginity and of the passage Eze. 44:2 dealt with allegorically with this in view… But so far we agree with them against the Helvidians and the Antidico-Marianites, that we believe it more probable that Joseph abstained from conjugal contact with Mary even after the nativity of Jesus, because he sensed a gracious miracle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-marck.html">Johannes Marck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium Theologiae Christianae</cite>, … (Groningen, 1690), XVIII, section 11 as quoted by Heinrich Heppe, Reformed Dogmatics ed. Ernst Bizer (1950; Wipf &amp; Stock, 2007), ch. 17, section 10, pp. 422-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>
<div class="actions"><button class="copy" data-copy="“Mary’s virginity did not flow from a vow, whether on the parents’ part or on her own. With many other fairy tales contrary to the practice of the gens and the nature of wedlock she entered upon, this is a fiction of the Papists, using Lk. 1:34 (‘How shall this be, seeing I know not a man?’) for empty weaving of words, which, whether we translate them in the past with a frequent change of tense, or in the present or even, with reference to Isaiah’s prophecy, in the future, establish not a prayer but only a particular fact. Nor does Christian faith demand that Mary’s virginity be extended perpetually beyond the nativity of Jesus, as the Papists will again have it on the pretext of a vow and the of the excellency of virginity and of the passage Eze. 44:2 dealt with allegorically with this in view… But so far we agree with them against the Helvidians and the Antidico-Marianites, that we believe it more probable that Joseph abstained from conjugal contact with Mary even after the nativity of Jesus, because he sensed a gracious miracle.”

y%E2%80%99s%20virginity%20did%20not%20flow%20from,because%20he%20sensed%20a%20gracious%20miracle&amp;text=Mary%E2%80%99s%20virginity%20did%20not%20flow%20from%20a%20vow&amp;text=of%20Jesus%2C%20because%20he%20sensed%20a%20gracious%20miracle" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0b346e138f" data-kw="">
<blockquote><p>Objection 1. Yet our [Romanist] adversaries quarrel against this most rich and plentiful treasure of the holy Scriptures, alleging that we receive many things by tradition which are not in Scriptures, and yet we believe them; as Mary’s perpetual virginity and the baptism of infants? We make not Mary’s perpetual virginity any matter of religion, but a likely opinion so far as it can be maintained; that it were an unseemly and unfitting thing for a sinful man to use to the act of generation the vessel which was chosen and consecrated by the holy Ghost to so high an use as was the bringing forth of the Savior of the world; it has warrant from the apostle’s charge, Phil. 4:8, of doing whatsoever is honest, whatsoever is of good report, whatsoever is praise-worthy, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity: Or, the Sum and Substance of Christian Religion, Eighth Edition</cite>, ... (1645), ‘A Large Explication of the Body of Christian Religion’, p. 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-fa4cbd8681" data-kw="">
<blockquote><p>He turns, in September 1522, to a lyrical defense of the perpetual virginity of the mother of Christ… To deny that Mary remained ‘inviolata’ before, during and after the birth of her Son, was to doubt the omnipotence of God… and it was right and profitable [according to Zwingli] to repeat the angelic greeting – not prayer – ‘Hail Mary’… God esteemed Mary above all creatures, including the saints and angels – it was her purity, innocence and invincible faith that mankind must follow. Prayer, however, must be… to God alone… . p. 395 ‘Fidei expositio,’ [An Exposition of the Faith, 1536] the last pamphlet from his pen [d. 1531]… There is a special insistence upon the perpetual virginity of Mary….</p></blockquote>

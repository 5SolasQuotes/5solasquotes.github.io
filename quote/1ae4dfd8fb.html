<main class="wrap"><figure class="quote" id="q-1ae4dfd8fb" data-kw="">
<blockquote><p>I beg you, tell us whether according to your [Lutheran] ubiquity [of the human nature], if I understand with my mind and not my body and I hunger with my body and not my mind, do I therefore hunger or understand only verbally? Similarly when we say that Christ truly and suffered and died insofar as He was a man, you cannot rightly construe this as if He suffered and died only verbally… …although I deny that the Word of God really suffered and died, still I do not claim that the passion and death did not involve it at all, for the Word was present at the passion and death, as has been said, because of the hypostatic union, although in a quiescent way. It was not affected by any suffering or by a new quality. Hence it is not empty words that the Son of God suffered and died since that nature and flesh which He made his own and to which He was present by a union of Person, really and truly suffered and died. But I would never say, as you are used to asserting, that the Word [logon] Himself really and truly both suffered and died.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dialogue on the Two Natures in Christ</cite>, ed. &amp; trans. John Donnelly in The Peter Martyr Library, vol. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

<blockquote><p>[Eckhardi says:] This we accept of infants, who are so in the covenant due to the faith of the parents, that they are justified by the faith of the parents. …I respond 1. not all infants of pious parents are received in the Covenant of God: so it was said of Ishmael which was the son of Abraham; and of Esau which was the son of Isaac. 2. Of the impious, or such as the Turks and other heathens, and their infants passing away in infancy, they all are certainly condemned, as is evident from 1 Cor. 7:14, indeed they are such as are unclean. If, however, it is understood that the impious are in the Covenant as far as the external society, I say even that God may not only look to this, but to the grandfather and the grandfather’s grandfather, so that it may be indeed such children frequently are in the Covenant with God, and the Covenant has been taken hold of for them by previous parents. …but where they are already adolescents, they having their own faith, then this faith [of others] is the more not necessary for them.</p></blockquote>

</figure><figure class="quote" id="q-8038d62c7e" data-kw="">
<blockquote><p>Thus today, at least some who are called Lutherans stand against ubiquity; against it is whatever remains of Christians in the whole world, including Easterners, Greeks, pontificians, and Calvinists. It is not without reason that a man of great judgment, M. Anton. de Dominis [d. 1624], wrote in his seventh book, ch. 11, n. 5, ‘The ubiquity of Christ’s body is even more absurd and impossible than transubstantiation; every good theologian will always reject it. To assert it is not the work of a good philosopher or a good theologian.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-calixt.html">George Calixt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>sect. 35-46 in Judgment on Theological Controversies agitated between the Lutherans &amp; Reformed, and on the mutual brotherhood and tolerance of parties because of consensus in the fundamentals</cite>, tr. by AI by WesternCatholike (1650; Leiden, 1652), pp. 13-17 Latin, p. 17</span></figcaption>

</figure><figure class="quote" id="q-7677c611c5" data-kw="">
<blockquote><p>Even now, however, the proper apple of discord was only the doctrine of the Supper. The party of Flacius was of one mind on the question of predestination with those who subsequently were denominated the ‘Reformed’; and the Flacians employed predestination as a weapon to fight against the Melanchthonians, who long maintained themselves in the electorate of Saxony [which was dominated by the strict Lutherans]. Nor till a later time, during the strife about Crypto-Calvinism, did this electorate succeed in detaching itself from the moderate party in the empire. In a word, about the time of the origin of the Formula of Concord between 1570-1580, there were only two different parties; the one consisting of people who would let themselves be reasoned with on the doctrine of the Supper; and the other of such as would hear no reason on the subject. Those who were weary of the vexatious strifes, as Hesse, Anhalt and other States of the empire, joined the party led by the inhabitants of the [reformed] Palatinate, and, finally, did not accept the Formula of Concord [1570/1580]. The others shut themselves off, and formed a body that took for its shibboleth the unaltered Confession of Augsburg. It was after the Formula of Concord that the evangelicals [in Germany] clearly separated into two churches; that is, one part went its own ways and abandoned the other, which then, by rejecting the Formula of Concord but retaining the Confession of Augsburg, was gradually consolidated in the empire into churches which for the first time testified by a great historical act at Dort that they belonged to the Reformed Church, that meanwhile had arisen outside of Germany.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edouard-bohl.html">Edouard Bohl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Separation of the Lutheran Church from the Reformed in the Sixteenth Century” in Presbyterian &amp; Reformed Review</cite>, vol. 5, no. 19 (July, 1894), pp. 415-33, p. 423</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Even now, however, the proper apple of discord was only the doctrine of the Supper. The party of Flacius was of one mind on the question of predestination with those who subsequently were denominated the ‘Reformed’; and the Flacians employed predestination as a weapon to fight against the Melanchthonians, who long maintained themselves in the electorate of Saxony [which was dominated by the strict Lutherans]. Nor till a later time, during the strife about Crypto-Calvinism, did this electorate succeed in detaching itself from the moderate party in the empire. In a word, about the time of the origin of the Formula of Concord between 1570-1580, there were only two different parties; the one consisting of people who would let themselves be reasoned with on the doctrine of the Supper; and the other of such as would hear no reason on the subject. Those who were weary of the vexatious strifes, as Hesse, Anhalt and other States of the empire, joined the party led by the inhabitants of the [reformed] Palatinate, and, finally, did not accept the Formula of Concord [1570/1580]. The others shut themselves off, and formed a body that took for its shibboleth the unaltered Confession of Augsburg. It was after the Formula of Concord that the evangelicals [in Germany] clearly separated into two churches; that is, one part went its own ways and abandoned the other, which then, by rejecting the Formula of Concord but retaining the Confession of Augsburg, was gradually consolidated in the empire into churches which for the first time testified by a great historical act at Dort that they belonged to the Reformed Church, that meanwhile had arisen outside of Germany.”

<main class="wrap"><figure class="quote" id="q-50c5c02faf" data-kw="">
<blockquote><p>That the [Anglican] Ceremonies are a great hinderance to edification appears, first, in that they obscure the substance of religion and weaken the life of godliness by outward glory and splendor, which draws away the minds of people so after it that they forget the substance of the service which they are about… departing from the apostolical and most ancient simplicity, and for adding ceremonies unto ceremonies in a worldly splendor and spectability, whereas the worship of God ought to be pure and simple… Secondly, the Ceremonies are impediments to the inward and spiritual worship, because they are fleshly and external…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pt. 2, ch. 4, ‘That the Ceremonies are Inexpedient Because they Hinder Edification’ in The English-Popish Ceremonies... (1637), pp. 19-22, pp. 19-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-886a61bd3d" data-kw="">
<blockquote><p>38. The instruments of producing this faith are the Word and sacraments, not by reason of inherent virtue, but by reason of adhering blessing, and that from God’s ordination. Whence both the use of the Word and Sacraments is to be employed, yet to be circumscribed, and neither is to be attributed to the instruments what belongs to Him who acts through instruments, nor is God to be bound to them, but man only, nor is the same latitude to be judged of our duty and of grace. 39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-078a1af5af" data-kw="">
<blockquote><p>Now albeit Nature (as was said) teach all men that there is a eternal and mighty God, who should be worshipped and honored by them. Yet it descends not unto such particular precepts as can have any show of making ought for significant ceremonies Omnibus enim innatum est et in animo quasi insculptum, esse deos: but yet quales sint, says Cicero, varium est. And as Nature has not taught men to know the Nature and the attributes of the Godhead, together with the sacred Trinity of persons in the same: so neither has it taught what sort or manner of worship should be given unto God, Lex naturalis rerum communium est, and does only inform us with those common notions called [Greek]. Concerning the worship of God, it speaks only de genere, not de specie. Wherefore there can be no inference from that worship which the Law of Nature requires, either of any distinct kind of worship, or of any ceremony in that kind. No more than it follows, Si est animal, est Asinus [‘If it is an animal, it is a donkey’]; for à genere ad speciem non valet consequentia affirmando.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 9, p. 202</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-5bda63cb70" data-kw="">

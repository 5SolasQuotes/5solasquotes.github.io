<blockquote><p>Vers. 13. Let no man say when he is tempted, I am tempted of God: for God cannot be tempted with evil, neither tempteth he any man.

Admon. 2. Touching a right judgement of inward temptations, lest any one violate the sanctity of God, even in their thoughts, as if God solicited any one to sin, which is a familiar thing with the Sons of Adam, to cast the blame upon God, as the Author. There are eight Arguments of the Admonition or Dehortation, all which prove that temptations to evil are not to be ascribed to God.

For God] Argum. 1. God cannot be solicited or moved to sin: Therefore neither can he solicit any other to sin, and consequently temptation to sin is not to be ascribed to God.

Vers. 14. But every man is tempted, when he is drawn away of his own last, and enticed.

Argum. 2. Every man’s proper lust is the true cause of temptation: Therefore it is not to be ascribed to God. He proves the Antecedent, by unfolding the method of temptation to sin in its five degrees. For, first, Man is drawn by his depraved lust from the true good, that he may not rest quiet in it: Furthermore, he is enticed by a false appearance of good, to follow that which is evil.

Vers. 15. Then when lust hath conceived, it bringeth forth sin: and sin when it is finished, bringeth forth death.

Thirdly, He conceives in his will and heart the purpose of sinning actually. Fourthly, He actually sins. And fifthly, Sin committed, by its desert bringeth forth as it were, and procureth death. And so original wickedness bringeth forth actual sin, and by degrees carries it on to further increase.

Vers. 16. Do not err, my beloved Brethren.

Argum. 3. Ye will mistake, and hold a false and blasphemous opinion, if ye ascribe the cause of your impulse to sin unto God.

Vers. 17. Every good gift, and every perfect gift is from above, and cometh down from the Father of lights, with whom is no variableness, neither shadow of turning.

Argum. 4. God is the fountain and author of all good, (which is in us, or that which is given to us, either in the state of nature or grace) and of good only; Because from him descends all good, and every gift which any ways conduces to our perfection: Therefore we must not say that God is the cause of evil or sin in us.

Of lights] Argum. 5. God is the Father of lights, knowledge, and understanding, holiness, and happiness: Therefore he is not the Father of darkness or sin.

With] God is immutable in his nature, without all variableness, either to worse or better: From all eternity always, so like himself in all things, that there is no foundation of changeableness of himself from himself, nor the least shadow of motion or turning in him: Therefore it is impossible that God should be the author of sin.

Vers. 18. Of his own will begat he us with the Word of Truth, that we should be a kind of first-fruits of his creatures.

Argum. 7. God moved by his will alone, hath regenerated and converted us by the Word of the Gospel, from the state of sin, to the image of his holiness: Therefore; &amp;c.

That we should be] Argum. 8. The end of our regeneration is intended by God, that we be holy, and wholly consecrated, (as the first-fruits under the Law) to his glory: Therefore we ought not to admit any blasphemous thoughts concerning him, as if we were moved by him to evil or sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 279.</span></figcaption>

<blockquote><p>God does all things in all things (Eph. 1:23). For this reason, all things are said to be from him, through him, and to him (Rom. 11:36), and the Saviour says that the Father is working, and he is working (John 5:17).

Nor is anything more evident to all than this, because he is the first cause of all things, without whom there could not be any action in the world: for if the first cause does not act, then how would a second cause act? I need not add that it is undoubtedly more perfect to act than not to act, and for this reason it cannot but be suitable for the most perfect one.</p></blockquote>

<blockquote><p>Objection 1: It seems that God does not exist; because if one of two contraries be infinite, the other would be altogether destroyed. But the word ‘God’ means that He is infinite goodness. If, therefore, God existed, there would be no evil discoverable; but there is evil in the world. Therefore God does not exist. … Reply to Objection 1: As Augustine says (Enchiridion, xi): Since God is the highest good, He would not allow any evil to exist in His works, unless His omnipotence and goodness were such as to bring good even out of evil. This is part of the infinite goodness of God, that He should allow evil to exist, and out of it produce good.</p></blockquote>

</figure><figure class="quote" id="q-86e8b1fd52" data-kw="Permission Author of sin Holiness The Fall">
<blockquote><p>The almighty power, unsearchable wisdom, and infinite goodness of God, so far manifest themselves in His providence, that His determinate counsel extends itself even to the first fall, and all other sinful actions both of angels and men (Rom. 11:32–34; 2 Sam. 24:1; 1 Chron. 21:1); and that not by a bare permission, which also He most wisely and powerfully bounds, and otherwise orders and governs (2 Kings 19:28; Ps. 76:10), in a manifold dispensation to His most holy ends (Gen. 50:20; Isa. 10:6–7, 12); yet so, as the sinfulness of their acts proceeds only from the creatures, and not from God, who, being most holy and righteous, neither is nor can be the author or approver of sin (Ps. 50:21; 1 John 2:16).</p></blockquote>

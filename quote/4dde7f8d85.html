<blockquote><p>5. In what sense is this inability absolute, and in what sense natural, and in what sense moral? … 4th. It is not natural in another sense, because it does not result in the least from any constitutional deficiency in human nature as it now exists as to its rational and moral faculties of soul. 5th. This inability is purely moral, because while every responsible man possess all moral as well as intellectual faculties requisite for right action, the moral state of his faculties is such that right action is impossible. Its essence is in the inability of the soul to know, love, or choose spiritual good, and its ground exists in that moral corruption of soul whereby it is blind, insensible, and totally averse to all that is spiritually good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, 1860, expanded 1879, reprinted 1979, Zondervan, pp. 340-41.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9a82b885b5" data-kw="">
<blockquote><p>When God (Deut. 17) forbids them [Israel] to choose a stranger [as king], He presupposes they may choose a stranger; for God’s law now given to man in the state of sin, presupposes he has corruption of nature to do contrary to God’s law. Now if God did hold forth that their setting a king over them was but the people’s approving the man whom God shall both constitute and design to be king, then he [John Maxwell] should presuppose that God was to design a stranger to be the lawful king of Israel, and the people should be interdicted to approve and consent that the man should be king whom God should choose; for it was impossible that the people should make a stranger king (God is the only immediate king-creator), the people should only approve and consent that a stranger should be king; yet, upon supposition that God first constituted and designed the stranger king, it was not in the people’s power that the king should be a brother rather than a stranger, for if the people have no power to make a king, but do only approve him or consent to him, when he is both made and designed of God to be king, it is not in their power that he be either brother or stranger, and so God commands what is simply impossible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 17</span></figcaption>

<blockquote><p>§XXIII. The opposite of liberty is necessity; yet not just any. Not: (1) the Necessity of Servitude, which is the state of man after the Lapse, in which man is subject to the yoke of sin and the misery flowing from it; whence the will of men has become a servant of sin, from Jn. 8:34; 2 Pet. 2:19; Rom. 7:14, without the destruction of natural liberty, which a servant exercises just as freely in things pertaining to his own sphere as a master does in those that pertain to his sphere; since, notwithstanding the servitude of sin, free will has remained immune from the necessity of this or that crime, and is free in animal, economic, civil, and moral matters of the natural order. … Nor (3) the Necessity of Dependence on God in becoming and being, and in operating; as that which is common to all creatures, not only the irrational, but also the rational; since, this dependence being saved, the mode of dependence is and remains various or diverse for the variety of creatures and agents: for intellectual creatures and free agents do not depend on God in the manner of stupid brutes, much less in the manner of statues or of turning metal plates, but as intellectual and free agents, which, being endowed with an internal active principle, exercise and determine their own acts under divine providence and grace, and are thence capable of a gratuitous reward or a just punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, trans. AI by Nosferatu (Frankfurt: Zeitler, 1707) Latin Holtzfus was a German reformed divine., ch. 1, p. 17</span></figcaption>

</figure><figure class="quote" id="q-d3fe61928f" data-kw="">
<blockquote><p>He [Jesus] plainly states that mankind, unchanged by divine influence, labor under such an indisposition to embrace his Gospel, and the blessings which it at once reveals and conveys, as amounts to a moral incapacity,—an indisposition which nothing short of divine influence can remove: ‘No man can come to Me, except the Father, which has sent Me, draw him;’ and with equal plainness He states that this influence, while absolutely necessary, is also fully competent to produce the desired effect,—‘All that the Father has given Me shall come to Me.’</p></blockquote>

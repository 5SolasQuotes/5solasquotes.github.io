<main class="wrap"><figure class="quote" id="q-84de3e55fc" data-kw="">
<blockquote><p>For this I affirm (and would that I could not, for such just causes, affirm it): that white does not more oppose black than Papism opposes Christianity; which I have now resolved to prove in a few words. Nor do I here dispute about their crimes and most abandoned morals, but I aim at the very throat of the cause, namely their doctrine, than which I affirm that nothing more impure or corrupt can even be feigned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, ch. 7, art. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a> › <a href="../topics/the-church/true-and-false-church/is-rome-a-true-church.html">Is Rome a true church?</a></span><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>
<div class="actions"><button class="copy" data-copy="“For this I affirm (and would that I could not, for such just causes, affirm it): that white does not more oppose black than Papism opposes Christianity; which I have now resolved to prove in a few words. Nor do I here dispute about their crimes and most abandoned morals, but I aim at the very throat of the cause, namely their doctrine, than which I affirm that nothing more impure or corrupt can even be feigned.”

— Theodore Beza, The Christian Faith, ch. 7, art. 1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+this+I+affirm+%28and+would+that+I+could+not%2C+for+such+just+causes%2C+affirm+it%29%3A+that+white+does+not+more+oppose+black+than+Papism+opposes+Christianity%3B+which+I+have+now+resolved+to+prove+in+a+few+words.+Nor+do+I+here+dispute+about+their+crimes+and+most+abandoned+morals%2C+but+I+aim+at+the+very+throat+of+the+cause%2C+namely+their+doctrine%2C+than+which+I+affirm+that+nothing+more+impure+or+corrupt+can+even+be+feigned.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+The+Christian+Faith%2C+ch.+7%2C+art.+1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F84de3e55fc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/84de3e55fc.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5bc9204dd7" data-kw="">
<blockquote><p>Bellarmine says that this inordinate concupiscence is not properly sin. What then? Shall we say it is improperly called sin, even though in the very principles of nature it chains and restrains man like a ferocious beast? Is this credible? Let Bellarmine believe such absurdities—we do not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Determinationes</cite>, Q. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/sin-and-free-will.html">Rome: Sin and Free Will</a> › <a href="../topics/rome/sin-and-free-will/concupiscence.html">Concupiscence</a></span><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a> › <a href="../topics/sin/concupiscence/concupiscence-is-truly-sin.html">Concupiscence is truly sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“Bellarmine says that this inordinate concupiscence is not properly sin. What then? Shall we say it is improperly called sin, even though in the very principles of nature it chains and restrains man like a ferocious beast? Is this credible? Let Bellarmine believe such absurdities—we do not.”

— John Davenant, Determinationes, Q. 16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBellarmine+says+that+this+inordinate+concupiscence+is+not+properly+sin.+What+then%3F+Shall+we+say+it+is+improperly+called+sin%2C+even+though+in+the+very+principles+of+nature+it+chains+and+restrains+man+like+a+ferocious+beast%3F+Is+this+credible%3F+Let+Bellarmine+believe+such+absurdities%E2%80%94we+do+not.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+Determinationes%2C+Q.+16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5bc9204dd7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5bc9204dd7.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-6c7ba3e091" data-kw="">

</figure><figure class="quote" id="q-240289f8c2" data-kw="">
<blockquote><p>Lust in the bud; that is, the first risings of lust, even before the consent of the will to them; the first openings of particular lusts, sometimes not regarded nor noticed, and so neither approved nor disapproved; and sometimes checked in their very rising, Rom. 7:15.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Lust in the bud; that is, the first risings of lust, even before the consent of the will to them; the first openings of particular lusts, sometimes not regarded nor noticed, and so neither approved nor disapproved; and sometimes checked in their very rising, Rom. 7:15.”

</figure><figure class="quote" id="q-376e0c9c24" data-kw="">
<blockquote><p>These, whatsoever the Papists say to the contrary, as soon as ever they do but begin to heave and stir in our breasts, are truly sins; and do, in their measure, pollute and defile the soul: for the soul of man is like a clear mirror, upon which if you only breathe, you sully it, and leave a dimness upon it; so, truly, the very first breathings of an evil thought and desire in our souls, do sully their beauty, and dim their lustre, and render the image of God less conspicuous in them than it was before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, The Tenth Commandment</span></figcaption>

<main class="wrap"><figure class="quote" id="q-ba4e7c6078" data-kw="">
<blockquote><p>accommodation occurs specifically in the use of human words and concepts for the communication of the law and gospel, but it in no way implies the loss of truth or the lessening of Scriptural authority. The accommodation or condescension refers to the manner or mode of revelation, the gift of the wisdom of infinite God in finite form, not to the quality of the revelation or to the matter revealed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD (2003) 1.262</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><figure class="quote" id="q-ef55d607ed" data-kw="">
<blockquote><p>Accordingly, Rivet rejected the medieval quadriga [four-fold interpretation] and argued that the source of all theological conclusions was the literal sense of the text ([Isagogue] chap. 14[:1; C.f. 15:20]). At the same time, he recognized that the literal sense of Holy Scripture included various figures and types; yet allegories, tropes, and anagogy he understood as false readings when they were imposed on the text rather than being identified as integral to it.</p></blockquote>

</figure><figure class="quote" id="q-788f2fe55a" data-kw="Papal infallibility">
<blockquote><p>Thirdly, if Christ asked this for all the Roman pontiffs, that they should be exempt from error, then he did not obtain what he asked. For it is certain that many Roman pontiffs have erred, even when teaching ex cathedra, that is, determining controversies; as Alphonsus asserts, Contra Hæres. Lib. I. c. 4, where he affirms that the pope not only may err, but even be a heretic. The same is written and held by other papists also. Then who, I pray you, will be the supreme judge of the church, when the supreme pontiff hath fallen into heresy? Is he a fit person to be the supreme judge in religion, and one in whose judgment we should acquiesce, who may be, and is a heretic, as the very papists themselves confess? Surely, never. The supreme judge of all controversies must be such a one as can neither err nor prove a heretic: and such is Christ himself, that true High Priest, and the sacred scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 5</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d425f499d2" data-kw="">
<blockquote><p>Let zeal be accompanied with meekness, that you may be free from passion and prejudice; and let meekness be backed with zeal, that you may be free of lukewarmness and indifference. Let meekness be extended toward all persons, and zeal against all sins; and if you would not lose your ground, be positive against sin in the first proposal and motion thereof; you will not get it shifted by, and yourselves kept free though there may be an unwillingness unto it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Honourable Societies of Strangers at Lewarden, in Friesland, 18 February 1686 in Thomas Houston (ed.), Spiritual Support and Consolation in Difficult Times: The Letters of the Rev. James Renwick (1865) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D. (4 vols, Edinburgh</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7483adceaf" data-kw="">
<blockquote><p>As we expect our Lord shortly to come, and to put down the blasphemous usurpers who have arrogated his prerogatives, and oppressed his faithful subjects, we should everywhere loudly and boldly proclaim, as did the remnant of Scotland’s martyred children, “Let King Jesus reign.” We should seek to bring the King back; and claim that not only in his Church, his blood-bought inheritance, but throughout the nations, and in every department of the State, He should be acknowledged as supreme – his sceptre submitted to, and his laws obeyed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The judgment of the papacy: and the reign of righteousness</cite>, (1851) in Works doctrinal and practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh, 1876), i, 359.</span></figcaption>

</figure><figure class="quote" id="q-3466756948" data-kw="">
<blockquote><p>Something must be done, for the country North and South has gone mad in its craze for gold, and to gain its selfish end it is willing to sacrifice principle, the Negro, the Bible yea, God himself—I speak it with awe and reverence. But God is our refuge. That is if we honour and serve Him. Are we as a people doing it?

I exceedingly fear and quake for the generations of Negroes which are coming up. It is very evident that God is not in their thoughts. If God be against us who can be for us? Let us arouse if possible our people to a realizing sense of the impending danger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-anderson.html">Matthew Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Francis J. Grimké, 21 June 1903 in The Works of Francis J. Grimké, ed. Carter G. Woodson (4 vols, Washington D.C.: The Associated Publishers, Inc., 1942), 4: 79.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-850b8d8bb4" data-kw="">
<blockquote><p>Against the public disturbers of the peace of Europe, you protect, not so much yourself, as your people, by armies, fleets and confederacies, and, which renders you most of all formidable to your enemies, by your innate prudence and magnanimity.

And did not words, equal to your merit, fail me, as it gives me singular pleasure to speak of it, your piety above all things ought to be celebrated, whereby you readily and with justice, ascribe all the honour and success you are favoured with, to the goodness of the supreme Being, and are ready, gratefully to lay down your sceptre at the feet of him who, encircled with the rain-bow, sits on his heavenly throne: while you govern with no other view, but that Jehovah may reign, and Jesus rule throughout all your dominions: whose empire you promote and enlarge, not as others do, in support of their superstition and cruelty, by imprisonment, exile and stripes, and every engine of torture, the gibbet and fire; not by depopulating countries, not by the terror and dreadful blasphemies of Dragoons, but by meekness, and by the demonstration of the truth to every conscience; and by what is most of all prevalent, your own example; never offering any violence to the consciences of those who differ in religious sentiments from yourself.

But, in fine, what language can set off, as it ought to be, that sacred solicitude you discovered at your very accession to the throne? That your subjects, laying aside their disputes about some points of Christian worship and ecclesiastical government, might unite with the most desirable harmony of minds, in brotherly fellowship, and uniformity of prayers and praises to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dedication.html">Dedication</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to William III in Herman Witsius, The Economy of the Covenants Between God and Man: Comprehending a Complete Body of Divinity, trans. William Crookshank (1677; 2 vols, London, 1822), i, p. 13.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

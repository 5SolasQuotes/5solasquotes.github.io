<main class="wrap"><figure class="quote" id="q-822319ecb7" data-kw="">
<blockquote><p>The most magnificent glorious worldling that ever trod upon earthly mould, richly crowned with all the ornaments and excellencies of nature, art, policy, preferment, or what heart can wish besides, yet without the life of grace to animate an ennoble them, he were to the eye of heavenly wisdom but as a rotten carcass stuck over with flowers, magnified dross, gilded rottenness, golden damnation!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bolton.html">Robert Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>General Directions for a Comfortable Walking with God</cite>, (1626; Ligonier PA: Soli Deo Gloria, 1991), xi.</span></figcaption>

<blockquote><p>For what kind of candour is it that quotes an epistle which scarcely one of the monkish herd would acknowledge to be genuine? Those who have read this silly production know that it speaks only of Lent, and chrism, and tapers, and fast and festival days, which began to creep in under the influence of superstition and ignorance long after the days of Ignatius.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin: Theological Treatises</cite>, The Clear Explanation of Sound Doctrine Concerning the True Partaking of the Flesh and Blood of Christ in the Holy Supper in J. K. S. Reid ed., Calvin: Theological Treatises (Westminster John Knox Press, 1954), 293.</span></figcaption>

</figure><figure class="quote" id="q-8f9c173098" data-kw="">
<blockquote><p>The knowledge of our religion and of the truth of things is independently manifest rather than in need of human teachers, for almost day by day it asserts itself by facts, and manifests itself brighter than the sun by the doctrine of Christ. Still, as you nevertheless desire to hear about it, Macarius, come let us as we may be able set forth a few points of the faith of Christ: able though you are to find it out from the divine oracles, but yet generously desiring to hear from others as well.

For although the sacred and inspired Scriptures are sufficient to declare the truth,—while there are other works of our blessed teachers compiled for this purpose, if he meet with which a man will gain some knowledge of the interpretation of the Scriptures, and be able to learn what he wishes to know,—still, as we have not at present in our hands the compositions of our teachers, we must communicate in writing to you what we learned from them,—the faith, namely, of Christ the Saviour; lest any should hold cheap the doctrine taught among us, or think faith in Christ unreasonable.

For this is what the Gentiles traduce and scoff at, and laugh loudly at us, insisting on the one fact of the Cross of Christ; and it is just here that one must pity their want of sense, because when they traduce the Cross of Christ they do not see that its power has filled all the world, and that by it the effects of the knowledge of God are made manifest to all.

For they would not have scoffed at such a fact, had they, too, been men who genuinely gave heed to His divine Nature. On the contrary, they in their turn would have recognised this man as Saviour of the world, and that the Cross has been not a disaster, but a healing of Creation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/athanasius-of-alexandria.html">Athanasius of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against the Heathen</cite>, (c. 335), 1.1-4 in Nicene and Post-Nicene Fathers 2, 4: 4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

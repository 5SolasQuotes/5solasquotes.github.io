<blockquote><p>The union personalis in Christ was made adiairetos, indivisibly, in respect of place, so that the human nature is nowhere unsupported by the Logos, the Logos nowhere fails to support the human nature, nor is it outside the Logos or the Logos apart from it: akoristos, inseparably in respect of time, because this union is never dissolved but is perpetual, which was also seen in the death and burial…</p></blockquote>

</figure><figure class="quote" id="q-913e6be71c" data-kw="">
<blockquote><p>We have seen that our Lord formerly contended with the fear of death; but as He now fights face to face with temptation, such an attack is called the beginning of grief and sorrow… Thus, though God had already tried his Son by certain preparatory exercises, He now wounds Him more sharply by a nearer prospect of death, and strikes his mind with a terror to which He had not been accustomed. But as it appears to be inconsistent with the divine glory of Christ, that he was seized with trembling and sadness, many commentators have labored with toil and anxiety to find some way of evading the difficulty. But their labor has been ill-judged and of no use; for if we are ashamed that Christ should experience fear and sorrow, our redemption will perish and be lost. Ambrose justly says: ‘I not only do not think that there is any need of excuse, but there is no instance in which I admire more his kindness and his majesty; for he would not have done so much for me, if he had not taken upon him my feelings. He grieved for me, who had no cause of grief for himself; and, laying aside the delights of the eternal Godhead, he experiences the affliction of my weakness. I boldly call it sorrow, because I preach the cross. For he took upon him not the appearance, but the reality, of incarnation. It was therefore necessary that he should experience grief, that he might overcome sorrow, and not shut it out; for the praise of fortitude is not bestowed on those who are rather stupefied than pained by wounds.’ Thus far Ambrose. Certainly those who imagine that the Son of God was exempt from human passions do not truly and sincerely acknowledge him to be a man. And when it is even said that the divine power of Christ rested and was concealed for a time, that by his sufferings He might discharge all that belonged to the Redeemer, this was so far from being absurd, that in no other way could the mystery of our salvation have been accomplished. For Cyril has properly said: ‘…For the same reason that the Word of God is God, (Jn. 1:1) and is naturally life itself, (Jn. 11:25) nobody doubts that he had no dread of death; but, having been made flesh (Jn. 1:14) He allows the flesh to feel what belongs to it, and, therefore, being truly a man, He trembles at death, when it is now at the door… You see how human nature, even in Christ Himself, has the sufferings and fears which belong to it, but that the Word, who is united to it, raises it to a fortitude which is worthy of God.’… Still the weakness which Christ took upon Himself must be distinguished from ours, for there is a great difference. In us there is no affection unaccompanied by sin, because they all exceed due bounds and proper restraint; but when Christ was distressed by grief and fear, He did not rise against God, but continued to be regulated by the true rule of moderation. We need not wonder that, since He was innocent, and pure from every stain, the affections which flowed from Him were pure and stainless; but that nothing proceeds from the corrupt nature of men which is not impure and filthy. Let us, therefore, attend to this distinction, that Christ, amidst fear and sadness, was weak without any taint of sin; but that all our affections are sinful, because they rise to an extravagant height. …And whence came to Him both sorrow and anxiety and fear, except because He felt in death something sadder and more horrible than the separation of the soul and body? And certainly He underwent death, not merely that He might move from earth to heaven, but rather that He might take on Himself the curse to which we were liable, and deliver us from it. His horror was not, then, at death simpliciter, as a passage out of the world, but because He had before his eyes the dreadful tribunal of God, and the Judge Himself armed with inconceivable vengeance; it was our sins, the burden of which He had assumed, that pressed Him down with their enormous mass. It is, then, not at all strange if the dreadful abyss of destruction tormented Him grievously with fear and anguish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 26, v. 37</span></figcaption>

<blockquote><p>Keckermann 323f.: (2) ‘Of the seed and blood of the Virgin Mary was formed Christ’s flesh, the Holy Spirit adding quickening force to this material. Of course the seed and blood of the Virgin Mary also possessed their own vital and animal spirits, as other men’s seed usually has. But these were by no means sufficient for the plastic or formative force of the foetus in question. And so the Holy Spirit’s extraordinary shadowing and quickening were added: whence also it is said to have been conceived of the Holy Spirit, a phrase and manner of speaking which is human and metaphorical, not strictly appropriate.–(3) Thus Christ’s incarnation was at once ordinary and extraordinary: ordinary as regards the material supplied by the Virgin Mary, extraordinary as regards the formative force added to this material…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics rev. Ernst Bizer</cite>, ed. Ernst Bizer (1950; Wipf &amp; Stock, 2007), ch. 17 | section 12, p. 425</span></figcaption>

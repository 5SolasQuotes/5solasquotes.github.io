<main class="wrap"><figure class="quote" id="q-584b7f205d" data-kw="See of Peter Vicar of Christ">
<blockquote><p>To fix down Christ and the Holy Spirit and the Church to a particular spot, so that every one who presides in it, should he be a devil, must still be deemed vicegerent of Christ, and the head of the Church, because that spot was formerly the See of Peter, is not only impious and insulting to Christ, but absurd and contrary to common sense. … The see which they occupy, therefore, no more makes them the vicars of Christ, than it makes an idol to become God, when it is placed in the temple of God (2 Thess. 2:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.29</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-09308723bf" data-kw="">
<blockquote><p>No sooner is such a word spoken but immediately the wicked bestial lives, the ignorance, atheisms, and horrid ends of many of them, present themselves to the thoughts of men, and a tremor comes over their hearts to hear men open their mouths with such blasphemies as to affirm that the Lord Christ did as much manifest his divinity and power in such beasts as in his own person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions on Fiat Lux</cite>, ch. 21</span></figcaption>

</figure><figure class="quote" id="q-386ba41121" data-kw="">
<blockquote><p>Doth he succeed him in his personal qualifications, which were of such extraordinary advantage unto the church of God in his days, — his faith, love, holiness, light, and knowledge? You will not say so. Many of your popes, by your own confession, have been ignorant and stupid; many of them flagitiously wicked, to say no more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Animadversions on Fiat Lux</cite>, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-63d112067c" data-kw="Succession of doctrine">
<blockquote><p>Succession is necessary in the church, but of doctrine and of the common and pastoral office; but not of place, or of persons and of the extraordinary apostolic office. Pastors in the first way succeed the apostles, but no one could have succeeded them in the latter way. … There are officers who must perpetually accompany the church, as pastors and teachers. Others, who were appointed to found it (such as apostles and evangelists), ought to remain only for a time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.19.16</span></figcaption>

</figure><figure class="quote" id="q-dd5daca24a" data-kw="">
<blockquote><p>Shall we recognise the Apostolic See where we see nothing but horrible apostasy? Shall he be the vicar of Christ who, by his furious efforts in persecuting the Gospel, plainly declares himself to be Antichrist? Shall he be the successor of Peter who goes about with fire and sword demolishing everything that Peter built? Shall he be the Head of the Church who, after dissevering the Church from Christ, her only true Head, tears and lacerates her members? Rome, indeed, was once the mother of all the churches, but since she began to be the seat of Antichrist she ceased to be what she was.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.24</span></figcaption>

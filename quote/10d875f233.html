<main class="wrap"><figure class="quote" id="q-10d875f233" data-kw="">
<blockquote><p>If Paul is not referring to the wives of elders and deacons, and is not referring to women deacons in the same office as men deacons, then… The most logical and natural alternative would be to regard ‘women’ as referring to the servant-widow class that assists the deacons by ministering to the needs of women. [Hendricksen:] ‘… he regards these women as the deacons’ assistants in helping the poor and needy, etc. These are women who render auxiliary service, performing ministries for which women are better adapted…’… The interpretation of 1 Timothy 3:11 as referring to ‘women’ who assist the deacons who belong to the order of widows described in 1 Timothy 5:9ff. is also exegetically superior to the ‘women in the same office’ view when the broader contextual matters are considered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-schwertley.html">Brian Schwertley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>II. ‘The Biblical Evidence’, pp. 57-62 in A Historical &amp; Biblical Examination of Women Deacons</cite>, pp. 60-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-e6d28ea5c4" data-kw="">
<blockquote><p>Independents themselves, though they hold [that] the substantials of Church government and order ought to be the same in our times that they were in the apostles’, yet they do not in all circumstantials nor accidentals judge [that that] discipline now binds; and I suppose if Hagiomastix had thus reasoned against their Independent government and order, that if that tied us in these days, then we are bound to all circumstances and accessories, as to the number of seven deacons, etc. as to widows just of such an age, etc. or else the office of deacons and widows are ceased in the Church, they would have laughed at him for his folly, and yet this is the way of the man’s reasoning against the command of God, Deut. 13:17, the command itself must be wholly abrogated, or else all accessories and formalities accompanying it Christians are tied unto… Love, humility, hospitality, are graces and moral duties commanded under the Gospel, and yet all these with many others of the like kind that I could instance in, had in the apostles’ days, those primitive times, some accessories and appendixes, ways of manifestations of them which are now ceased, as the feasts of love, the kiss of love, washing the saints’ feet, etc. in which humility, brotherly love, kindness to strangers were expressed, as proper and peculiar to that condition the Church was then in, and the customs of those countries, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Casting Down of the Last &amp; Strongest Hold of Satan, or a Treatise Against Toleration &amp; Pretended Liberty of Conscience… (London, 1647), 17th thesis</cite>, p. 76</span></figcaption>

</figure><figure class="quote" id="q-0b42a848a4" data-kw="">
<blockquote><p>As for the maintenance and the continuance of the office of ruling elders, we love not unnecessary multiplication of questions, let every Church do herein what they find most convenient. The manner of our Church in these things is such as best befits the condition of the same, and such as cannot be in reason condemned; Neither is a stipend, nor continuance in the function till death, essential to the ministry of the Church, but separable from the same. The Levites of old served not at all times, but by course, and when they were 50 years old, they were wholly liberat[ed], from the burden and labor (though not from the attendance) of the Levitical service; and ministers may still upon the Church’s permission, for lawful reasons and urgent necessities, be absent a whole year, and longer too, from their particular charges. The apostles, when they were first sent through Judea, took no stipend, Mt. 10:8-9. Neither did Paul take any at Corinth, 1 Cor. 9:18. The ministers among the Waldenses work with their hands for their maintenance. The old patriarchs were priests and preachers to their families, and maintained themselves by the work of their hands, feeding of flocks, tilling the ground, etc. These things I do not mention as rules, to be followed by us, but to show, that the intermission of the exercise of the ministry, the want of maintainance and laboring with the hands, are not altogether repugnant, nor inconsistent with the nature of the vocation of the ministers of the Word, but in some cases hic &amp; nunc [here and now], may be most approveable in them: much more in ruling elders. The revenues of our Church are so small that they cannot spare stipends to ruling elders, which makes them willing to serve without stipends; and lest they should be overburdened with this their service, though they be chosen and called to be ruling elders as long as they live, at least till they merit to be deposed, yet our book of policy [Second Book of Discipline] allows them that ease of intermission and serving by course which was allowed to the Levites of old in the Temple. The double honor which the apostle commands to give unto elders that rule well, 1 Tim. 5:17, needs not to be expounded of maintenance and obedience; for by double honor we may either simply understand much honor, or by way of comparison double honor in respect of the widows, whom he had before commanded to honor, 1 Tim. 5:3, as Calvin expounds the place. Both these interpretations does Oecumenius give upon the same place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of Scotland… (Edinburgh, 1641), pt, 1</cite>, ch. 14, pp. 104-6</span></figcaption>

</figure><figure class="quote" id="q-649cda56e7" data-kw="">
<blockquote><p>Augustine says with us, we are in mercy ‘to rebuke what we cannot amend, and to bear it patiently.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea… (London, 1642)</cite>, ch. 10, p. 149</span></figcaption>

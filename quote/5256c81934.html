<main class="wrap"><figure class="quote" id="q-5256c81934" data-kw="">
<blockquote><p>Hooper declined a nomination to this bishopric [the See of Gloucester, which was against civil law without a significant and just reason], specifying as a reason his inability to wear the vestments required by the existing Ordinal [a book of church order]. The Privy Council were at first prepared to waive his scruples, but the bishops (notable [Thomas] Cranmer and Nicholas Ridley). conscious that a question of principle and policy was involved in Hooper’s nonconformity, declined to proceed with his consecration. In the deadlock which ensued Hooper wrote a defence of his position, which is printed here from an incomplete manuscript (the only copy known to have survived) to which Ridley replied in a letter to the Privy Council (cf. Writings of [John] Bradford, Letters, Treatises, Parker Society pp. 373-395). … Hooper’s resistance to the official policy on this matter resulted in the extraordinary situation of his being committed to the Fleet prison, from which he was only released when he wrote a letter of submission to Cranmer on February 15, 1551. the letter (printed in G.C. Gorham’s Reformation Gleanings [pp. 233-5], 1857) shows that Hooper did not recant his principles… but that the strength of the opposition from other Protestants led him to doubt the wisdom of continuing his particular stand against vestments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hooper.html">John Hooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Regulative Principle &amp; Things Indifferent’</cite>, (1550) in ed. Iain Murray, The Reformation of the Church: a Collection of Reformed &amp; Puritan Documents on Church Issues</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/vestments-and-dress.html">Vestments and Dress</a></span></div>

34.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5256c81934.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-black-genevan-gowns/#:~:text=Hooper%20declined%20a%20nomination%20to%20this,continuing%20his%20particular%20stand%20against%20vestments&amp;text=Hooper%20declined%20a%20nomination%20to%20this%20bishopric%20%5Bthe&amp;text=wisdom%20of%20continuing%20his%20particular%20stand%20against%20vestments" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3ca928498c" data-kw="">
<blockquote><p>The church and its supreme governor demanded obedience in all things indifferent. Nonconformists (and it was in this context that the word ‘nonconformist’ first entered the English religious vocabulary) complained that to enforce the use of these things on reluctant consciences was to deprive them of their indifference. The doctrine of ‘Christian liberty’ which came to the fore in these circumstances, was arguably the taproot of that species of Christian conviction known ever since as Puritanism. It was not equivalent to individualistic license, but rather to a conviction that the edification of the church, composed of ‘lively stones’, required the emancipation of conscience from all human ordinances and its total subjection to the word of God… … In 1566 Archbishop Matthew Parker, in consultation with his suffragans and prompted by the queen, published some ‘Advertisements,’ a call to strict conformity… The resultant crisis rocked both the universities of Oxford and Cambridge and came to its head in London, toward Easter 1566. Thirty-seven ministers, much of the preaching ministry in London, at first refused to conform and were suspended; of these a few, the hardest of the hard core, were eventually deprived of their livings… …the Vestiarian Controversy introduced a lasting fault line into the Elizabethan church. The more drastic presbyterianism of the 1570’s might never have come about if it had not been for the episcopal ‘persecution’ of those who cast off the surplice in the 1560’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-collinson.html">Patrick Collinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Vestiarian Controversy’ in Oxford Encyclopedia of the Reformation</cite>, (1996), vol. 4, pp. 231-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/vestments-and-dress.html">Vestments and Dress</a></span></div>

</figure><figure class="quote" id="q-b75d1598ae" data-kw="">
<blockquote><p>To this add, in that the ancient bishops in the celebration of the Lord’s Supper did put on another garment than that they usually did wear, appertains nothing to the alteration of the Lord’s Supper: For Christ commanded not that we should celebrate his Supper with our usual garments, as He did, but only that we should do that which He did Himself. The like may be affirmed of sundry other things, as well in baptism as in the Supper of the Lord. The sum of all is this: Such things as are added, but yet as matters indifferent, for order, for decency and to edification, such matters do not change the substance of the sacraments, and therefore alter not the worship. But such things as are taken from the institution of Christ, or else are added as necessary, and appertaining to the substance, those things do corrupt the institution of the Lord, and so do establish another kind of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Redemption, ch. 19, fol. 447, as quoted in John Sprint, Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1618), ‘Reformed Practices’, ‘Practice’, pp. 177-79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/vestments-and-dress.html">Vestments and Dress</a></span></div>

<main class="wrap"><figure class="quote" id="q-4ca0e1084c" data-kw="">
<blockquote><p>III. Although the resurrection of the dead surpasses nature and man&#x27;s corrupt reason, yet it is neither against nature nor against right reason. For right reason teaches both that the dead can be raised and that they are to be raised. The former is concluded from the omnipotence of God, the latter from his justice. For as it is just that certain sins should be punished after this life, so it is also just that what was the partner of the sins should be the partner of the penalties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 34 (the resurrection), canon 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection/resurrection-of-the-body.html">Resurrection of the Body</a> › <a href="../topics/resurrection/resurrection-of-the-body/resurrection-of-the-just-and-unjust.html">Resurrection of the just and unjust</a></span><span class="t"><a href="../topics/judgment-and-the-final-state/hell.html">Hell</a> › <a href="../topics/judgment-and-the-final-state/hell/nature-of-the-punishment.html">Nature of the punishment</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-39e34c7d9b" data-kw="">
<blockquote><p>This notion, as if the justification, righteousness, and life spoken of in Rom. v. implied the resurrection of damnation, is not only without ground from Scripture, but contrary to reason. For those are there spoken of as great benefits, by the grace and free gift of God: but this is the contrary, in the highest degree possible; the most consummate calamity. To obviate this, our author supposes the resurrection of all to be a great benefit in itself, though turned into a calamity by the sin and folly of obstinate sinners, who abuse God&#x27;s goodness. But the far greater part of mankind, since Adam, have never had opportunity to abuse this goodness, it having never been made known to them. Men cannot abuse a kindness, which they never had either in possession, promise, offer, or some intimation: but a resurrection is made known only by divine revelation which few comparatively have enjoyed. So that as to such wicked men as die in lands of darkness, if their resurrection comes at all by Christ, it comes from him, and to them, only is a curse, and not a blessing; for it never comes to them at all by any conveyance, grant, promise, or offer, or any thing by which they can claim it, or know any thing of it, till it comes as an infinite calamity, past all remedy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Christian Doctrine of Original Sin Defended</cite>, pt. 2, ch. 4, sec. 1 (on Rom. 5:12–21)</span></figcaption>

</figure><figure class="quote" id="q-399eaf4d68" data-kw="">
<blockquote><p>Obj. 1. The resurrection of Christ, according to what has been said, can neither be an argument in favor of the resurrection of the wicked, nor the cause of it, inasmuch as they are not members of Christ. Therefore the wicked will not rise. Ans. The wicked will not rise on account of the resurrection of Christ, but for other causes, viz: on account of the just judgment of God, for which they will be raised from the dead, that they may be eternally punished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 45 (benefits of Christ&#x27;s resurrection)</span></figcaption>

</figure><figure class="quote" id="q-654e99d971" data-kw="">
<blockquote><p>When the change above described has been accomplished, when once the resurrection has taken place, then, according to the language of Scripture, death shall be completely conquered. Not only shall those over whom he had triumphed, and whom he had so long detained in the prison of the grave, be delivered from his power, but there shall be no more death. … The victory over death is to be complete and final.</p></blockquote>

</figure><figure class="quote" id="q-9fe71f9563" data-kw="last things necessity">
<blockquote><p>The necessity and utility of this discussion are of the very highest. There is no precaution against sin and incentive to good works more efficacious than this meditation which impresses upon our minds: a contempt for the world and all earthly things; a desire for heaven and heavenly goods; hatred of sin and desire of holiness; a reverence and fear of the deity, before whom we must stand; an alleviation and solace for all troubles, which are shortly to come to an end.</p></blockquote>

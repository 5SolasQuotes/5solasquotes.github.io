<blockquote><p>Section 4, ‘On the imperfections which an inefficacious will and a will suspended from a condition seem to display: objections are dissolved.’ .

1. Certain arguments of the contrary opinion have been solved elsewhere, or will have to be solved below; for certain arguments are directed immediately to proving that the divine will totally precedes our wills, so that in no way does it wait for them. But these have been solved elsewhere. Other arguments, however, contend immediately and directly that the application of God to concur with free choice would be confused, blind, and fortuitous, if it were to depend on a condition, provided that free choice should will. Nevertheless we shall show this inference to be null below in disputation 45 and the following.

2. But the following objections seem to be proper to the present undertaking. The first is: Inefficacy of will is an imperfection; therefore no will of God is inefficacious. It is confirmed, because the desire of a thing not to be obtained by its nature is apt to sadden and afflict the one desiring. It is answered: Inefficacy is an imperfection when it proceeds from impotence of the will. But when the will could, if it willed, effectively obtain any object whatsoever, and yet does not will to obtain it effectively, but only to desire it ineffectively; then rather it is a perfection of the will, and a dominion over itself and over its power. It is confirmed, since to will not to produce other worlds is not an imperfection, but rather a perfection; therefore likewise to will not to produce effectively free actions, but only to supply to them a sufficient concurrence, will not be an imperfection. To the confirmation it is answered: if the desired thing is not obtained on account of a defect of power, or if the desired thing increases in some way the happiness of the desiring will; then not to obtain that thing can of itself sadden and afflict. But to God neither is there lacking power to obtain, nor is the happiness of God increased in anyway by the obtaining of the desired thing.

3. The second objection is, that: A conditional volition is proper to a will which cannot obtain that good without the condition appended: just as a conditional will of retaining wares in a storm [on the sea] is proper to a will which cannot avoid shipwreck unless a jettison of the wares be made. It is confirmed, because that will of the merchant would effectively preserve the wares, if he could without danger, or inconvenience, and difficulty. But God, without danger, inconvenience, and difficulty, could have saved all men, if He willed. Therefore neither by a conditional will does He will their salvation.

4. It is answered: By denying the first antecedent. For although the will be omnipotent, and can without an appended condition obtain such a good, nonetheless most wisely and most powerfully it uses a conditioned volition, when another greater good, incompatible, is loved by an efficacious volition, which depends on the aforesaid condition. But the [proposed] greater good is a better administration of the universe, and a more illustrious manifestation of divine justice together with mercy requires that the salvation of all be loved, as much as regards God, efficaciously; nor does it allow that, by the antecedent will of God, impediments of salvation be decreed and procured; yet at the same time it requires that many men be so left to their own choice that they be permitted, if they will, to resist the aforesaid will of God. Since therefore this greater good efficaciously willed by God implies a contradiction with the salvation of those same men efficaciously willed, for that reason God most wisely and most powerfully appends a condition to His will, depending upon the choice of men. For this volition satisfies the natural propensity and benevolence, which He professes toward men, even the reprobate, without dissimulation. It is confirmed: By the example of the human will of Christ the Lord, to whom there was not lacking the power of avoiding death, according to that of Mt. 26: “Do you think that I cannot ask my Father, and He will provide for Me now more than twelve legions of angels?” and Jn. 10: “I lay down my life, that I may take it again. No one takes it from Me; but I lay it down of Myself.</p></blockquote>

<blockquote><p>38. Hence the will of God is the first cause of things. Rev. 4:11, ‘By thy will they are, and were created.’ But the will of God, as it wills to work outwardly, does not presuppose the goodness of the object, but by willing does make the object. James 1:18, ‘Because He would, He begat us.’ Rom. 9:18, ‘He hath mercy on whom He will.’

39. Therefore there is no cause properly so called to be given of God’s will.

40. Hence it is rightly said that God does will one thing to exist for another: but not that that one thing is a proper cause whereby the will of God is inwardly moved to appoint that other thing. So God would that the sun and stars should exist, for the generation, conservation and corruption of things below: yet the sun and stars are not a cause why God would that those things should be generated, conserved and corrupted. And so it is in all things out of God, which indeed among themselves are causes and effects, even as they depend upon the divine will, but there is no cause of God’s will out of itself.

41. Also the willing of one thing in God is not properly a cause effecting that He will another thing in Himself, because the efficiency of a cause upon an effect, and dependance of the effect upon a cause, cannot be in the will of God, which is God Himself, truly and simply willing all things together and at once, with one only act; yet it is true that the Schoolmen say that a passive attingency of the divine will in respect of one thing is a cause of a passive attingency in respect of another: and so in this sense it is truly and piously said that God wills some one thing because He wills another.

42. Therefore although He wills many things which will not follow but upon some antecedent act of the creature, yet the very act of willing in God does not properly depend as a consequent thing upon the act of the creature. Neither is it lawful under the appellation of an ‘antecedent will’ to give unto God that imperfect will which is called velleitas, a ‘woulding’ in the schools. For it does not agree to an omniscient, omnipotent and infinitely, blessed Nature.

43. Wherefore that opinion which determines that God does will something antecedently to the act of the creature, which same thing afterwards He wills not towards them, but wills another thing, is not to be admitted: because it makes the will of God mutable and depending upon the act of the creature, so that as often as the act of the creature is changed, so often also it is changed.

44. By that opinion also, that form of speech prescribed in the Word of God wherein we commit ourselves and all ours to God, as ‘I will do this or that if God will,’ [Jm. 4:15] should not be used in all things, but [rather, it is by that opinion] turned contrarily, ‘God will do this or that, if man will.’

45. This will determines of all things, greatest, least, contingent, necessary, free, without exception…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity Drawn out of the Holy Scriptures, and the Interpreters thereof, and brought into Method</cite>, ... (d. 1633; London: Griffin, 1642), bk. 1, ch. 7, Of the Decree &amp; Counsel of God, pp. 32-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“38. Hence the will of God is the first cause of things. Rev. 4:11, ‘By thy will they are, and were created.’ But the will of God, as it wills to work outwardly, does not presuppose the goodness of the object, but by willing does make the object. James 1:18, ‘Because He would, He begat us.’ Rom. 9:18, ‘He hath mercy on whom He will.’

39. Therefore there is no cause properly so called to be given of God’s will.

40. Hence it is rightly said that God does will one thing to exist for another: but not that that one thing is a proper cause whereby the will of God is inwardly moved to appoint that other thing. So God would that the sun and stars should exist, for the generation, conservation and corruption of things below: yet the sun and stars are not a cause why God would that those things should be generated, conserved and corrupted. And so it is in all things out of God, which indeed among themselves are causes and effects, even as they depend upon the divine will, but there is no cause of God’s will out of itself.

41. Also the willing of one thing in God is not properly a cause effecting that He will another thing in Himself, because the efficiency of a cause upon an effect, and dependance of the effect upon a cause, cannot be in the will of God, which is God Himself, truly and simply willing all things together and at once, with one only act; yet it is true that the Schoolmen say that a passive attingency of the divine will in respect of one thing is a cause of a passive attingency in respect of another: and so in this sense it is truly and piously said that God wills some one thing because He wills another.

42. Therefore although He wills many things which will not follow but upon some antecedent act of the creature, yet the very act of willing in God does not properly depend as a consequent thing upon the act of the creature. Neither is it lawful under the appellation of an ‘antecedent will’ to give unto God that imperfect will which is called velleitas, a ‘woulding’ in the schools. For it does not agree to an omniscient, omnipotent and infinitely, blessed Nature.

43. Wherefore that opinion which determines that God does will something antecedently to the act of the creature, which same thing afterwards He wills not towards them, but wills another thing, is not to be admitted: because it makes the will of God mutable and depending upon the act of the creature, so that as often as the act of the creature is changed, so often also it is changed.

44. By that opinion also, that form of speech prescribed in the Word of God wherein we commit ourselves and all ours to God, as ‘I will do this or that if God will,’ [Jm. 4:15] should not be used in all things, but [rather, it is by that opinion] turned contrarily, ‘God will do this or that, if man will.’

45. This will determines of all things, greatest, least, contingent, necessary, free, without exception…”

— William Ames, The Marrow of Sacred Divinity Drawn out of the Holy Scriptures, and the Interpreters thereof, and brought into Method, ... (d. 1633; London: Griffin, 1642), bk. 1, ch. 7, Of the Decree &amp; Counsel of God, pp. 32-33">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C38.+Hence+the+will+of+God+is+the+first+cause+of+things.+Rev.+4%3A11%2C+%E2%80%98By+thy+will+they+are%2C+and+were+created.%E2%80%99+But+the+will+of+God%2C+as+it+wills+to+work+outwardly%2C+does+not+presuppose+the+goodness+of+the+object%2C+but+by+willing+does+make+the+object.+James+1%3A18%2C+%E2%80%98Because+He+would%2C+He+begat+us.%E2%80%99+Rom.+9%3A18%2C+%E2%80%98He+hath+mercy+on+whom+He+will.%E2%80%99+39.+Therefore+there+is+no+cause+properly+so+called+to+be+given+of+God%E2%80%99s+will.+40.+Hence+it+is+rightly+said+that+God+does+will+one+thing+to+exist+for+another%3A+but+not+that+that+one+thing+is+a+proper+cause+whereby+the+will+of+God+is+inwardly+moved+to+appoint+that+other+thing.+So+God+would+that+the+sun+and+stars+should+exist%2C+for+the+generation%2C+conservation+and+corruption+of+things+below%3A+yet+the+sun+and+stars+are+not+a+cause+why+God+would+that+those+things+should+be+generated%2C+conserved+and+corrupted.+And+so+it+is+in+all+things+out+of+God%2C+which+indeed+among+themselves+are+causes+and+effects%2C+even+as+they+depend+upon+the+divine+will%2C+but+there+is+no+cause+of+God%E2%80%99s+will+out+of+itself.+41.+Also+the+willing+of+one+thing+in+God+is+not+properly+a+cause+effecting+that+He+will+another+thing+in+Himself%2C+because+the+efficiency+of+a+cause+upon+an+effect%2C+and+dependance+of+the+effect+upon+a+cause%2C+cannot+be+in+the+will+of+God%2C+which+is+God+Himself%2C+truly+and+simply+willing+all+things+together+and+at+once%2C+with+one+only+act%3B+yet+it+is+true+that+the+Schoolmen+say+that+a+passive+attingency+of+the+divine+will+in+respect+of+one+thing+is+a+cause+of+a+passive+attingency+in+respect+of+another%3A+and+so+in+this+sense+it+is+truly+and+piously <blockquote><p>First, ‘God’ (say they [Arminians]), ‘considering all mankind as fallen from that grace and favor in Adam where they were created, and excluded utterly from the attainment of salvation by virtue of the covenant of works which was at the first made with him, yet by his infinite goodness was inclined to desire the happiness of them all and every one, that they might be delivered from misery and be brought unto Himself, which inclination of his they call his universal love and antecedent will, whereby He would desirously have them all to be saved, out of which love He sends Christ.’ [Owen:] That God has any natural or necessary inclination by his goodness or any other property to do good to us or any of his creatures, we do deny: everything that concerns us is an act of his free will and good pleasure, and not a natural necessary act of his Deity, as shall be declared. Secondly, the ascribing an antecedent conditional will unto God, whose fulfilling and accomplishment should depend on any free contingent act or work of ours, is injurious to his wisdom, power and sovereignty, and cannot well be excused from blasphemy, and is contrary to Rom. 9:19, ‘Who hath resisted his will? I say.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Salus electorum, sanguis Jesu, or the Death of Death in the Death of Christ</cite>, … (London: W.W., 1648), bk. 2, ch. 4, pp. 91-92</span></figcaption>

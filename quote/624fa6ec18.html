<blockquote><p>The atheist says that if God exists, He would, being all-powerful and all-good, prevent the suffering we see around us; yet suffering persists; therefore God does not exist… there is much that could be said.² But Aquinas, as he so often does, gets to the nub of the matter. The first premise of the atheist’s argument is simply false, or at least unjustifiable — that is to say, there is no reason whatever to think that an all-powerful and all-good God would prevent the suffering we see around us — for it is ‘part of the infinite goodness of God, that He should allow evil to exist, and out of it to produce good.’² ¹ See Brian Davies, The Reality of God and the Problem of Evil (Continuum, 2006) for an excellent recent full length treatment. ² Summa Theologiae, I, q. 2, a. 3, ad 1… If God can bring out of the evils that we actually experience a good that is far greater than what would have existed without them, then of course He would allow those evils. But God is infinite in power, knowledge, and all the rest — Pure Actuality, Being Itself, Goodness Itself, and so forth, as we have seen — and, since human beings have immortal souls, so that our lives in the here-and-now are but a trivial blink of the eye compared to the eternity we are to enter, there is no limit to the good result that might be made in the next life out of even the worst evils we suffer in this one. For even the worst evils we suffer are finite. Therefore there is every reason to think that God can and will bring out of the sufferings of this life a good that so overshadows them that this life will be seen in retrospect to have been worth it. …Suppose your child is trying to learn how to play the violin. This will require much practice, and thus a sacrifice of time that could be spent playing. It will also require hours of frustration and boredom, some pain and discomfort… and possibly humiliation when at recitals and the like he makes serious mistakes… He may often want to give it up, and keeping him from doing so may require not only encouragement but also occasional punishments for failures to practice every day. On bad days he might almost hate you for what you’re putting him through. But eventually he becomes very good indeed, and the frustration he once felt disappears entirely. He might even forget about it almost completely, and if he is a normal, sane human being he certainly will never hold it against you or think the suffering he once thought was unbearable is even worth thinking about now. Indeed, if anything, his accomplishment will have the value for him that it does precisely because he had to suffer for it. In hindsight, he might well say that he wouldn’t have had it any other way. Of course, I am not claiming that the relatively minor suffering in question is comparable to the death of a child, or bone cancer, or Auschwitz. But then, neither could the relatively minor joy of being a great violinist compare to the beatific vision. Indeed, even the greatest horror we can imagine in this life pales in insignificance before the beatific vision. To quote St. Paul once again, “the sufferings of this present time are not worth comparing with the glory that is to be revealed to us.” (Rom. 8:18, RSV)… Reason itself, as I have argued, shows us that there is a First Cause who is Being Itself, Goodness Itself, all-powerful, allknowing, and all the rest, and it also shows us that we have immortal souls. Hence reason tells us that there is a God who created us for a destiny beyond this life and who is fully capable of guaranteeing that the good we attain in the next life outweighs the evil we suffer in this one to such an extent that the latter, however awful from our present point of view, will come to seem “not worth comparing” to the former, and indeed if anything will even be seen to have been worth having gone through from the point of view of eternity. And therefore, reason itself tells us that there is simply no reason to believe that even the worst possible sufferings of this life constitute any evidence whatsoever against the existence of God. Nevertheless, since we are finite beings, it can be very hard to keep this in mind when faced with severe suffering. The arguments of philosophers and theologians, however logically impeccable, seem cruelly abstract and cold when compared to the agony of the parents of a raped and murdered child. But then, reason is abstract and cold. Atheists are always telling us how we need soberly to follow it where it leads us, even if it were to break our hearts by telling us that there is no hope for cosmic justice, no hope for seeing lost loved ones ever again, no hope for a life beyond this one… Thomas Aquinas reassures us that in fact no matter how bad things get in this life, reason assures us that God can set it right… In any event, it is precisely because of the abstraction and coldness of reason that a kind of faith is needed where evil is concerned… faith in God in the face of evil is nothing less than the will to follow reason’s lead when emotion might incline us to doubt… Yet reason says that that pain is part of an overall plan which we cannot yet fathom, but one in which God can bring out of that pain a good compared to which it will pale in insignificance. Hence reason tells us: have faith in God. We will not always be able to understand what that plan is, or how this or that particular instance of suffering fits into it. We have some general clues here and there — for instance, the fact that certain goods, like patience, forgiveness, and self-sacrifice, cannot be had without certain evils. But we don’t know the details. And yet, why should we expect to know them? If there is a God of the sort the arguments I’ve described point to, and if the soul’s ultimate destiny surpasses the cares of this life in the way its immortality implies, then these matters are so far beyond our ordinary experience that it would be extremely surprising if we could fully understand them…</p></blockquote>

<blockquote><p>But if by ‘the Author of Sin’, is meant the Permitter, or not a Hinderer of Sin; and at the same time, a Disposer of the State of Events, in such a manner, for wise, holy and most excellent ends and purposes, that sin, if it be permitted or not hindered, will most certainly and infallibly follow: I say, if this be all that is meant, by being the Author of Sin, I don’t deny that God is the Author of Sin… And I don’t deny, that God’s being thus the Author of Sin, follows from what I have laid down…</p></blockquote>

<blockquote><p>26. ‘Evil’ is an ambiguous term. It may stand for miserable evils or moral evils. One may morally choose to undergo and suffer certain miserable evils in necessity, other alternatives not being available, likely or reasonable. Electing to eat expired food rather than starve is not wrong. One ought never to do moral evil, though it be lesser in respect to another (1 Cor. 15:34; WLC 99.5).</p></blockquote>

</figure><figure class="quote" id="q-b4af681b72" data-kw="Author of sin">
<blockquote><p>The influences of divine providence concur with every action, be it what it may, as an action, since all live, and move, and have their being in God; every action, as an action, is from God; but the obliquity, irregularity, and sinfulness of the action, is from the creature: wherefore God is not the author of any sin.</p></blockquote>

</figure><figure class="quote" id="q-9d7b8126b5" data-kw="">
<blockquote><p>Things inconvenient, even in matters of religion, may be commanded in some cases: as when it is to redeem a far worse inconvenience. For of two evils of punishments [cf. 2 Sam. 24:10–17], the magistrate may take the less, as well as any other private man. And if that subjects, to prevent worse inconveniences, may use inconvenient ceremonies, then may the magistrate, to prevent worse inconveniences, command inconvenient ceremonies. If the apostles may use the inconvenient Jewish ceremonies, then the apostles may enjoin for a time the use of inconvenient ceremonies: as they did make ordinances about things which yet they called “burdens,” Acts 15 [v. 28]. And Moses may make an ordinance about the use of a bill of divorcement which yet was a grievous inconvenience to redeem a worse inconvenience. But if magistrates do appoint inconvenient things and burden the Church with them, when there would be no great inconvenience to the Church if such things were not, then such magistrates must give their account to Christ for so doing; but yet the people are bound to obey still, because we cannot be freed from our subjection laid upon us by God except it appear to us that they command not only an inconvenience, but a sin, as all sound divines confess.</p></blockquote>

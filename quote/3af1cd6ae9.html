<main class="wrap"><figure class="quote" id="q-3af1cd6ae9" data-kw="">
<blockquote><p>It has secured great advantages for the evangelization of Scotland. The Free Church has the best of the Ministers, and the mass of the people. It has also the goodwill of the other evangelical communions, and in co-operation with them, the field of Scotland is now before it.

Clerical etiquette, and ecclesiastical trammels, and civil interdicts, will not now restrain its Ministers. Broad Scotland is their parish, and the last verses of Matthew’s Gospel their commission; and we trust that many people who have long sat in darkness will now see a great light.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-hamilton.html">James Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Egypt. To which is Appended the Original Protest, read at the General Assembly in May 1843 (Montreal: John C. Becket, 1844), p. 18.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d4b5970fc2" data-kw="">
<blockquote><p>3. Those duties which are required of all those who publicly preach the Word of God in the Name of Christ are not required of all those Christians that are gifted: as that there lies on them the pastoral charge of souls, of which they are to give an account to God, Heb. 13:17, that they ought to give themselves wholly to the reading and studying of the Scriptures, 2 Tim. 4:15-16, that they may not apply themselves to the things of this world, 2 Tim. 2:4, that in the Name of Christ as his Ambassadors they entreat men to be reconciled to God, 2 Cor. 5. 20, that they are to distribute to all and every one in the house of God their portion of food in due season, Mt. 24:46, that they are authoritatively in the Name of Christ to remit and retain sins, Jn. 20:21. Now all these things are not enjoined on all Christians who have received the gifts of the Spirit.

4. Hence also the privileges and promises which are made to pastors, who preach the Word in the Name of God, are not given to all believers who are endued with the gifts of the Spirit; as, that they are worthy of double honor, 1 Tim. 5:17, that God will by a peculiar and singular assistance of his Spirit be present with them, Mt. 28:20; Lk. 21:14-15. And so a prophet’s recompence and reward is distinguished from the reward of a righteous man, Mt. 10:42. Therefore that labor, duty, and burden, to which these promises are made, is not imposed on all the righteous that are endued with gifts of the Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated</cite>, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 79-80</span></figcaption>

<blockquote><p>XXXIX. We are so far from desiring to draw people from the parish churches into conventicles [separate assemblies], that we would keep up the honor of them to the utmost of our power, as knowing how greatly the countenance and maintenance of Rulers conduceth to the furtherance of religion… XL. We are not for preaching when we are forbidden, where there is not a real and evident need of our labors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (London, 1689), ch. 2, pp. 15-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/evangelism.html">Evangelism</a></span></div>

</figure><figure class="quote" id="q-091e61afe4" data-kw="">
<blockquote><p>Our judgement is that none may publicly in the church assembly of the faithful preach the Word of God in the Name of Christ and of God, but he who is sent by a divine calling for that work; as the Protestants demonstrate against the Socinians and Anabaptists from Rom. 10:14-15; Heb. 5:4-5; Acts 13:1-2 &amp; 14:22; Tit. 1:5; 2 Tim. 2:2, and other places and arguments; and from the examples of all those, who either in an extraordinary or ordinary manner were sent to preach the Word. Which mission, or sending, consists not only in conferring gifts, whereby an ability, [Greek], is given by God; but in conferring a power, whereby is given an authority, [Latin], to preach the Word of God; which authority is oft-times not conferred on those, on whom yet God bestows gifts and ability. For it is by the Word of God denied to women, in whose lips is the Law of God, Prov. 31:26, and a fitness to teach the yonger women, Tit. 2:3-4. It is certain from the Word of God that God enjoins all believers to exhort, comfort, reprove, and edify one another, Heb. 3:13; 1 Thess. 4:18 &amp; 5:14, but it is from the common duty of charity, and the law of nature that they are thus bound: and therefore the Word which they declare to their neighbours does not by the authority of any special office bind to obedience those that hear it, but by virtue of the subject or matter contained in that Word. But the Church’s ministers declare the Word of God as Christ’s ambassadors, with authority of special office, and power to bind and loose, 1 Cor. 4:1-2; 2 Cor. 5:20; Jn. 20:21-22. There is therefore a many-fold difference between the charitative admonitions of private Christians and the authoritative preaching of God’s ministers. For:

1. The admonitions of ordinary Christians are to our neighbor privately, and as joined to us by the bond of charity and the law of nature: The ministers of churchs do publicly preach the Word of God with pastoral charge of souls, and God’s authority, to the Church, as a Church, over which God has made them watchmen and overseers.

2. The ministers’ authoritative preaching the Word has joined with it the ecclesiastical power of binding and loosing sinners, remitting and retaining sins, Mt. 16:18-19; Jn. 20:21-22, which authority is not affixed to the charitative admonitions of private Christians.

3. There is not so absolute and strict an obligation on private Christians for that brotherly correction which is performed by them, as the obligation on the pastors of the Church of God for their office of preaching, who may not involve themselves in the affairs of this world, to the end that they may wholly attend upon the office of preaching, 2 Tim. 2. 4. and who are in a special manner to give an account of the salvation of their hearers committed to them, Heb. 13:17; Eze. 3:18 &amp; 33:18, which do not concern private Christians in the exercise of charitative admonition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated</cite>, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 75-77</span></figcaption>

tween+the+charitative+admonitions+of+private+Christians+and+the+authoritative+preaching+of+God%E2%80%99s+ministers.+For%3A%0A%0A1.+The+admonitions+of+ordinary+Christians+are+to+our+neighbor+privately%2C+and+as+joined+to+us+by+the+bond+of+charity+and+the+law+of+nature%3A+The+ministers+of+churchs+do+publicly+preach+the+Word+of+God+with+pastoral+charge+of+souls%2C+and+God%E2%80%99s+authority%2C+to+the+Church%2C+as+a+Church%2C+over+which+God+has+made+them+watchmen+and+overseers.%0A%0A2.+The+ministers%E2%80%99+authoritative+preaching+the+Word+has+joined+with+it+the+ecclesiastical+power+of+binding+and+loosing+sinners%2C+remitting+and+retaining+sins%2C+Mt.+16%3A18-19%3B+Jn.+20%3A21-22%2C+which+authority+is+not+affixed+to+the+charitative+admonitions+of+private+Christians.%0A%0A3.+There+is+not+so+absolute+and+strict+an+obligation+on+private+Christians+for+that+brotherly+correction+which+is+performed+by+them%2C+as+the+obligation+on+the+pastors+of+the+Church+of+God+for+their+office+of+preaching%2C+who+may+not+involve+themselves+in+the+affairs+of+this+world%2C+to+the+end+that+they+may+wholly+attend+upon+the+office+of+preaching%2C+2+Tim.+2.+4.+and+who+are+in+a+special+manner+to+give+an+account+of+the+salvation+of+their+hearers+committed+to+them%2C+Heb.+13%3A17%3B+Eze.+3%3A18+%26+33%3A18%2C+which+do+not+concern+private+Christians+in+the+exercise+of+charitative+admonition.%E2%80%9D%0A%0A%E2%80%94+Wilhelm+Apollonius%2C+A+Consideration+of+Certain+Controversies+at+this+Time+Agitated%2C+%28London%3A+G.M.%2C+1645%29%2C+ch.+5%2C+%E2%80%98Of+the+Ecclesiastical+Ministry%2C+and+the+Exercise+thereof%E2%80%99%2C+pp.+75-77&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F091e61afe4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/091e61afe4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/evangelism#:~:text=Our%20judgement%20is%20that%20none%20may,in%20the%20exercise%20of%20charitative%20admonition&amp;text=Our%20judgement%20is%20that%20none%20may%20publicly%20in&amp;text=private%20Christians%20in%20the%20exercise%20of%20charitative%20admonition" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4th Distinction. There is a call to an habitual and ordinary prophesying; here is required not only a calling by gifts, but also a collation of authority to the office, either immediately by God, or mediately by the Church, and there is a call to some particular or occasional acts of exhorting, as the martyrs and Stephen [Acts 7] are called to give confession of their faith, and a king in battle, to exhort his army, or a prince his subjects to piety, and to this latter there is no other call required but the place and profession of the exhorter, though he bee not by office a pastor. … 6th Distinction. Gifted Christians may occasionally admonish, warn, rebuke and exhort one another: 1. privately; 2. without any pastoral care of souls as they are a Church, but only as they occasionally converse with them; 3. ex communi officio charitatis [out of the common office and charity], by the Law of nature, charity tying one member to help another;

4. Not authoritatively by special office; but all authority here is from the Word occasionally spoken. The pastor is to preach, 1. publicly; 2. to the Church as the Church. 3. with a pastoral obligation to all alike, whether he converse daily with them or not. 4. not only by the tie of common charity, but by a virtue of a special office.

5. With authority both objective from the Word and official from his charge. 6. and is obliged to separate himself for this charge allanerly [singly, especially or wholly], as a watchman who must give an account in a special manner to Jesus Christ.</p></blockquote>

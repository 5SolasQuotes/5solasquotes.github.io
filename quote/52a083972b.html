<blockquote><p>3. The next thing we exhort you to do, is to make choice for your own souls. That is Moses makes of it: Deut. 30:19, ‘Therefore choose life, that both thou and thy seed may live.’ Hearing, believing, considering, are all in order to choice; and without choice, and a determined, fixed, bent of the heart, you will never walk evenly in heaven’s ways. Determine not only that you must, but you will, walk in the way which God has set forth for you. God’s ways must be chosen: Ps. 119:30, ‘I have chosen the way of truth;’ and verse 173, ‘I have chosen your precepts;’ Josh. 24:15, ‘If it seem evil to you to serve the Lord, choose you this day whom you will serve.’ Not as if it were indifferent, but to set an edge upon their appetite. There is much strength in the bond, when a man binds himself freely, and makes the more inexcusable if he does not observe it. All will choose life before death, but they are out in the means; they do not choose good before evil, the good of holiness before the evil of sin. Every man desires some good. It is as natural for the reasonable creature to desire to be happy, as it is for the fire to bring us to that happiness that we desire. They would be happy, but they choose means quite contrary to happiness. Oh, then, choose the ways of God; let life be your motive, and holiness your choice. This is the way to live forever, to avoid hell beneath. As soon as we come to years of discretion, we should make our choice to go on in the ways of life. To this we are obliged by the most weighty reasons, urged by the enforcements of the word, and by the sad and numerous examples of young people, who make an ill choice in the beginning, and go on, and are hardened therein, and perish forever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Seventeenth Sermon’, on Deut. 30:15, in The Works of Thomas Manton, vol. 2</cite>, p. 369</span></figcaption>

<blockquote><p>…but as for that which no hypocrite or unsound professor can attain to, a broken, hungry, self-deined heart, that Christ and his grace might enter and dwell there, oh, how harsh is it?… what shall they look for that despise the grace of the Gospel, and that offer which God has honored by so many miracles, and such abundance of sermons, and the powerful ministry of so many preachers? Beware of refusing such salvation, as being a more spiritual wickedness than any moral offense. Thirdly, its reproof to all cavillers that descant upon this free, plain and simple-hearted offer of God. Being urged to receive it, they answer so they would if they knew themselves elected. But (say they) we are afraid God means it us not. If we be chosen, we are sure to be called to believe it: if not, none of their preachers can give it us. It must be God (say they) and not man that must work our hearts and draw us. But, oh vain jangler, tell me, has not God revealed his will in his offer? Dost thou know his secrets? Is not his offer ingenuous? Say not in thine heart, ‘Who shall go up to Heaven or descend, etc? Lo, the Word is in thy mouth, it is neare thee.’ (Dt. 29:19) If Jeremiah in the dungeon had told Ebedmelech [Jer. 38] he knew not whether he meant to help him out or no, and so have refused to come out, had he not justly been left there still? So, when the Lord lets down the ladder of his offer, into thy dungeon, casts thee his cords and rags to put under thy armholes, that He may draw thee out, dost thou cavil and say, ‘Lord, I know not whether thou meanst me well or no; perhaps Thou wilt pull me out a little way, and then let me fall back again; perhaps I am not elected!’ Is not this a woeful dishonor to the simplicity of the offer? Was he ever tied at all to offer it? and dost thou distrust his ingenuous meaning in it? Thy blood be upon thy own head, in that thou choosest rather to smite the Lord to thy own destruction than to set thy foot in his ladder and put on his cords, that thou mightst come out! The way for thee is first to step upward that thou mayst come to the top than to leap to the top at first, to break thy neck backward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rogers.html">Daniel Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Catechism... (London: Norton, 1632), pt. 2, 4th Article</cite>, pp. 182-83</span></figcaption>

</figure><figure class="quote" id="q-2ec24cdd2c" data-kw="">
<blockquote><p>Others (Immanuel Tremellius &amp; Thomas Wilcox) interpret this of the doors of our heart, according to that Apoc. 3:20, ‘Behold I stand at the doors and knock, if any man hear my voice and open the door, I will come in unto him, etc.’ In the Gospel’s history we find that Christ had a fourfold entertainment among men. Some received Him into house, not into heart, as Simon the Pharisee (Lk. 7:44), who gave Him no kiss, nor water to his feet: some into heart, but not into house, as the faithful centurion, esteeming himself unworthy that Christ (Mt. 8:8) shouId come under his roof: some neither into soul nor heart, as the graceIess Gergesites, Mt. 8:54; some both into house and heart, as Lazarus (Jn. 11:11, 15), Mary (Lk. 10:38), Martha. Now that Christ may dwell in our hearts by faith (Eph. 3:17), and that our bodies may be temples of his Holy Spirit (1 Cor. 6:19); we must as our prophet exhorts here, ‘lift up our souls,’ that is, in the words of St. Paul, Col. 3:2, our affections must be set on things which are above, and not on things which are on earth, if we desire to lift up our heart unto Christ’s verity, we may not lift it up unto the world’s vanity (Augustine in location), that is, we must not fasten our love too much upon the things of this life, but on those pleasures at God’s right hand, which are evermore… O Lord, which art the God of my salvation (Ps. 18:47), I lift my heart to Thee (Ps. 25:1), desirous to seek Thee, both in the right ubi, ‘where’ Thou mayst be found, and in the right quando, ‘while’ Thou mayst be found: Open my dull ears and hard heart, that thy Son my Savior may come in and dwell with me: Grant me grace that I may still hear while He calls, open while He knocks, and hold Him also when I have Him, that I may both ascend thine hill, and stand in thine holy place, that I may not only sojourn in thy tabernacle, but also rest and dwell upon the mountain of thine holiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-boys.html">John Boys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Dominical [Lordly] Epistles &amp; Gospels used in our English Liturgy... (d. 1625; 1638) | Ascension Day Evening Prayer, Psalm 24</cite>, p. 912</span></figcaption>

ndo%2C+%E2%80%98while%E2%80%99+Thou+mayst+be+found%3A+Open+my+dull+ears+and+hard+heart%2C+that+thy+Son+my+Savior+may+come+in+and+dwell+with+me%3A+Grant+me+grace+that+I+may+still+hear+while+He+calls%2C+open+while+He+knocks%2C+and+hold+Him+also+when+I+have+Him%2C+that+I+may+both+ascend+thine+hill%2C+and+stand+in+thine+holy+place%2C+that+I+may+not+only+sojourn+in+thy+tabernacle%2C+but+also+rest+and+dwell+upon+the+mountain+of+thine+holiness.%E2%80%9D%0A%0A%E2%80%94+John+Boys%2C+Exposition+of+the+Dominical+%5BLordly%5D+Epistles+%26+Gospels+used+in+our+English+Liturgy...+%28d.+1625%3B+1638%29+%7C+Ascension+Day+Evening+Prayer%2C+Psalm+24%2C+p.+912&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ec24cdd2c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2ec24cdd2c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=Others%20%28Immanuel%20Tremellius%20%26%20Thomas%20Wilcox%29,upon%20the%20mountain%20of%20thine%20holiness." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0c54be44c6" data-kw="">
<blockquote><p>2… Look yonder on the amiable Jesus Christ (for a marriage between whom and thy precious soul I am now wooing). Do but observe his condescending willingness to be united to thee: That great Ahasuerus courts his own captive Esther. The Potter makes suit to his own clay, woos thee, though He wants [needs] thee not; is infinitely happy without thee, yet is not, cannot be satisfied but with thee. Heark how He commands, entreats, begs thee to be reconciled, 2 Cor. 5:20; Swears and pawns his life upon it, that He desires not thy death, Eze. 33:11; seals his oath with his blood; and if after all this thou art fond of thine own damnation and hadst rather be at an agreement with Hell, than with Him; see how the brinish tears trickle down his cheeks, Lk. 19:41-42. He weeps for thee, that dost not, wilt not weep for thyself: Nay, after all this obdurate obstinacy, is resolved still to wait, that He may be gracious, Isa. 30:18. Stands yet and knocks, though his head be wet with rain, and his locks with the dew of the night; fain He would have thee open the door, that He may be come in and sup with thee, and thou with Him, Rev. 3:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-lye.html">Thomas Lye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Morning Exercise Methodized (London: E.M., 1660), Sermon 18</cite>, p. 397</span></figcaption>

<blockquote><p>By the name of ‘door‘ [in Rev. 3:20], he means man’s heart. That does the Lord knock at by the preaching of his Word, crying out and bearing witness of the force and effectualness of it to our spirit. And the same preaching is never fruitless. For the godly receive comfort by it, and the ungodly are condemned by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kaspar-megander.html">Kaspar Megander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in Augustine Marlorate, A Catholic Exposition upon the Revelation of St. John (1574), ch. 3, pp. 69-70 Megander (1495–1545) was a Swiss reformer who assisted Zwingli.</cite></span></figcaption>

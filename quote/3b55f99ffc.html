<blockquote><p>IT is a question not easily determined whether the Church of Christ suffer more by brethren, her mother’s sons Edom within, or by strangers, Babel without her walls: It is undeniable that thousands of godly people are carried away to Familism, Antinomianism and love to follow strangers because people are floods and seas, and teachers sit upon the waters as fair or stormy and rough winds[.]

I have been long silent, but when I did see not long ago privileges of state, if in a feather violated must be judged bloody and unexpiable by sacrifice, or any way else, and heresies, fundamental blasphemies, foul inventions of men, are thought to be zealous errors, godly phancies, things of the mind not to be spoken against, except M. Tho[mas]. Edwards, or any other who out of zealot to God, cry against the New alter, would be charged to sin against the Holy Ghost, therefore I dare not but give a Testimony for the truth.

Silence may be a washing of the hands with Pilate, saying, I am innocent of the blood of lost souls, but it washeth away the guilt with waters of ink and blood. And except my heart deceive me, give me leave to borrow an expression of Job, If I lift up my hand, or a bloody pen against the truly godly, or have a pick at holiness, Let mine arm fall from my shoulder blade, and mine arm be broken from the bone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brotherly and free epistle to the patrons and friends of pretended Liberty of Conscience in A survey of the spiritual antichrist</cite></span></figcaption>

<blockquote><p>I answer that [if] the true Church was only at Jerusalem radically [during the time Israel was divided in the O.T.], as you [the Separatist John Robinson] say, [then it] would import that the 10 Tribes revolting from David’s house ceased to be a Church, which is false: [1.] Israel, though all the land were in Covenant with God, had circumcision and the Passover, and so were a true visible Church, even when they did meet in their synagogues. The altar, sacrifices, Temple, are not the essentials of a visible Church; they were a Church and did pray toward the Temple even in Babylon, and were to profess the true God before the heathen, Jer. 10:11. 2. There be typical reasons to hinder men why they cannot be capable of the priesthood [1 Kings 12:31], that did not exclude them from Church-state; but this hinders not but if the seals administered by a minister be true seals, then is the minister thereof catenus, insofar, a true minister.</p></blockquote>

<blockquote><p>Schism is either a rash or an unjust separation upon the account of religion. It is with schism, as with error: a light error continued in with obstinacy becomes heresy. So there is a schism which may not be called unjust, but only rash, being grounded on a light cause; but if pertinacy be added, when the levity of the cause does appear, it becomes truly, and [Greek] an eminent schism. This rash schism may be known, either (à priori) from its previous cause, for no man being compelled to it (if we will speak the truth), it proceeds from self-love, therefore also hatred follows upon it. Nor would any rash schism be made if we had charity, which is the most perfect bond and is not easily provoked, and thinks no evil. It is therefore a manifest note of hatred, which hatred may arise either from an offence really given or only taken; as when a man is grieved that another is preferred before him. Again, a schism is made rashly either by the chief authors upon a light occasion, as if when an ulcer does appear upon any member, the surgeon should presently think of cutting off that member without applying other means, or expecting what nature may do. But we may suppose that the schism be made upon the occasion of heresy, and then the separation may be thought to be just and not rash. To which I answer: That as judges, who in too great passion do condemn a malefactor that is really guilty, may be unjust, because they are acted rather by a certain ferity of mind than by the love of justice: so that separation, which proceeds from hatred, though it may have just causes, yet is unjust. Again, the rashness of separation appears, à posteriori, when it is made on a light occasion, that is, where there is not a great and intolerable persecution, nor heresie, nor idolatry. For, first, if the persecution be tolerable, that is, if it do not concern our lives or things necessary thereunto, we may not catch at an opportunity of departing: for as they that delight in a civil war, though they have the better cause, and just occasions, yet because they are glad of such occasions, they are murderers and enemies of their country. 2ly, separation is rash if the error in the Church from which he departs be neither heresie, nor superstition: for if the error be tolerable, as a superstitious rite may be, we may not separate; as a sick man is not to be forsaken unless his disease be deadly and contagious, and then not without grief. Lastly, separation is rash when it is made because of corruption of manners, to which purpose our Savior said, ‘They sit in Moses’s chair, therefore do whatever they say unto you.’ [Mt. 23:1-3] This is the meaning of our Savior: Wherever the purity of doctrine does remain, there God has a Church, though overspread with many scandals. Now an unjust Schism is that, which is made where there is no persecution or heresy, no error, superstition, or idolatry, none, or but few scandals; such was the schism of the Donatists. And this is the greatest degree of schism: and it is either negative, which is a bare departure only, without gathering of new congregations; or positive, when another Church is erected, which does separately use ecclesiastical laws, and the administration of the Word of God and sacraments, which the Scripture calls setting up of altar against altar [2 Kn. 16:10-16; Hos. 8:11; 10:1-2]; for, though a peaceable departure from the Church may be lawful and just, yet if new associations be entred into, it is unjust; for this cannot be done unless there be real hatred between brethren, contrary to Christianity; for the end of the commandment is charity. It must therefore be considered again and again whether the cause of this separation be of so great moment as that the glory of God and salvation depends upon it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Schism, p. 322 in The Character of a Separatist, or Sensuality the ground of Separation… (London, 1677), Picture &amp; Character of a Separatist, pp. 23-25 Cameron (c. 1579 – 1625) was a Scottish theologian, professor and formalist.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Schism is either a rash or an unjust separation upon the account of religion. It is with schism, as with error: a light error continued in with obstinacy becomes heresy. So there is a schism which may not be called unjust, but only rash, being grounded on a light cause; but if pertinacy be added, when the levity of the cause does appear, it becomes truly, and [Greek] an eminent schism. This rash schism may be known, either (à priori) from its previous cause, for no man being compelled to it (if we will speak the truth), it proceeds from self-love, therefore also hatred follows upon it. Nor would any rash schism be made if we had charity, which is the most perfect bond and is not easily provoked, and thinks no evil. It is therefore a manifest note of hatred, which hatred may arise either from an offence really given or only taken; as when a man is grieved that another is preferred before him. Again, a schism is made rashly either by the chief authors upon a light occasion, as if when an ulcer does appear upon any member, the surgeon should presently think of cutting off that member without applying other means, or expecting what nature may do. But we may suppose that the schism be made upon the occasion of heresy, and then the separation may be thought to be just and not rash. To which I answer: That as judges, who in too great passion do condemn a malefactor that is really guilty, may be unjust, because they are acted rather by a certain ferity of mind than by the love of justice: so that separation, which proceeds from hatred, though it may have just causes, yet is unjust. Again, the rashness of separation appears, à posteriori, when it is made on a light occasion, that is, where there is not a great and intolerable persecution, nor heresie, nor idolatry. For, first, if the persecution be tolerable, that is, if it do not concern our lives or things necessary thereunto, we may not catch at an opportunity of departing: for as they that delight in a civil war, though they have the better cause, and just occasions, yet because they are glad of such occasions, they are murderers and enemies of their country. 2ly, separation is rash if the error in the Church from which he departs be neither heresie, nor superstition: for if the error be tolerable, as a superstitious rite may be, we may not separate; as a sick man is not to be forsaken unless his disease be deadly and contagious, and then not without grief. Lastly, separation is rash when it is made because of corruption of manners, to which purpose our Savior said, ‘They sit in Moses’s chair, therefore do whatever they say unto you.’ [Mt. 23:1-3] This is the meaning of our Savior: Wherever the purity of doctrine does remain, there God has a Church, though overspread with many scandals. Now an unjust Schism is that, which is made where there is no persecution or heresy, no error, superstition, or idolatry, none, or but few scandals; such was the schism of the Donatists. And this is the greatest degree of schism: and it is either negative, which is a bare departure only, without gathering of new congregations; or positive, when another Church is erected, which does separately use ecclesiastical laws, and the administration of the Word of God and sacraments, which the Scripture calls setting up of altar against altar [2 Kn. 16:10-16; Hos. 8:11; 10:1-2]; for, though a peaceable departure from the Church may be lawful and just, yet if new associations be entred into, it is unjust; for this cannot be done unless there be real hatred between brethren, contrary to Christianity; for the end of the commandment is charity. It must therefore be considered again and again whether the cause of this separation be of so great moment as that the glory of God and salvation depends upon it.”

— John Cameron, Other citations (work not named), On Schism, p. 322 in The Character of a Separatist, or Sensuality the ground of Separation… (London, 1677), Picture &amp; Character of a Separatist, pp. 23-25 Cameron (c. 1579 – 1625) was a Scottish theologian, professor and formalist.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSchism+is+either+a+rash+or+an+unjust+separation+upon+the+account+of+religion.+It+is+with+schism%2C+as+with+error%3A+a+light+error+continued+in+with+obstinacy+becomes+heresy.+So+there+is+a+schism+which+may+not+be+called+unjust%2C+but+only+rash%2C+being+grounded+on+a+light+cause%3B+but+if+pertinacy+be+added%2C+when+the+levity+of+the+cause+does+appear%2C+it+becomes+truly%2C+and+%5BGreek%5D+an+eminent+schism.+This+rash+schism+may+be+known%2C+either+%28%C3%A0+priori%29+from+its+previous+cause%2C+for+no+man+being+compelled+to+it+%28if+we+will+speak+the+truth%29%2C+it+proceeds+from+self-love%2C+therefore+also+hatred+follows+upon+it.+Nor+would+any+rash+schism+be+made+if+we+had+charity%2C+which+is+the+most+perfect+bond+and+is+not+easily+provoked%2C+and+thinks+no+evil.+It+is+therefore+a+manifest+note+of+hatred%2C+which+hatred+may+arise+either+from+an+offence+really+given+or+only+taken%3B+as+when+a+man+is+grieved+that+another+is+preferred+before+him.+Again%2C+a+schism+is+made+rashly+either+by+the+chief+authors+upon+a+light+occasion%2C+as+if+when+an+ulcer+does+appear+upon+any+member%2C+the+surgeon+should+presently+think+of+cutting+off+that+member+without+applying+other+means%2C+or+expecting+what+nature+may+do.+But+we+may+suppose+that+the+schism+be+made+upon+the+occasion+of+heresy%2C+and+then+the+separation+may+be+thought+to+be+just+and+not+rash.+To+which+I+answer%3A+That+as+judges%2C+who+in+too+great+passion+do+condemn+a+malefactor+that+is+really+guilty%2C+may+be+unjust%2C+because+they+are+acted+rather+by+a+certain+ferity+of+mind+than+by+the+love+of+justice%3A+so+that+separation%2C+which+proceeds+from+hatred%2C+though+it+may+have+just+causes%2C+yet+is+unjust.+Again%2C+the+rashness+of+separation+appears%2C+%C3%A0+posteriori%2C+when+it+is+made+on+a+light+occasion%2C+that+is%2C+where+there+is+not+a+great+and+intolerable+persecution%2C+nor+heresie%2C+nor+idolatry.+For%2C+first%2C+if+the+persecution+be+tolerable%2C+that+is%2C+if+it+do+not+concern+our+lives+or+things+necessary+thereunto%2C+we+may+not+catch+at+an+opportunity+of+departing%3A+for+as+they+that+delight+in+a+civil+war%2C+though+they+have+the+better+cause%2C+and+just+occasions%2C+yet+because+they+are+glad+of+such+occasions%2C+they+are+murderers+and+enemies+of+their+country.+2ly%2C+separation+is+rash+if+the+error+in+the+Church+from+which+he+departs+be+neither+heresie%2C+nor+superstition%3A+for+if+the+error+be+tolerable%2C+as+a+superstitious+rite+may+be%2C+we+may+not+separate%3B+as+a+sick+man+is+not+to+be+forsaken+unless+his+disease+be+deadly+and+contagious%2C+and+then+not+without+grief.+Lastly%2C+separation+is+rash+when+it+is+made+because+of+corruption+of+manners%2C+to+which+purpose+our+Savior+said%2C+%E2%80%98They+sit+in+Moses%E2%80%99s+chair%2C+therefore+do+whatever+they+say+unto+you.%E2%80%99+%5BMt.+23%3A1-3%5D+This+is+the+meaning+of+our+Savior%3A+Wherever+the+purity+of+doctrine+does+remain%2C+there+God+has+a+Church%2C+though+overspread+with+many+scandals.+Now+an+unjust+Schism+is+that%2C+which+is+made+where+there+is+no+persecution+or+heresy%2C+no+error%2C+superstition%2C+or+idolatry%2C+none%2C+or+but+few+scandals%3B+such+was+the+schism+of+the+Donatists.+And+this+is+the+greatest+degree+of+schism%3A+and+it+is+either+negative%2C+which+is+a+bare+departure+only%2C+without+gathering+of+new+congregations%3B+or+positive%2C+when+another+Church+is+erected%2C+which+does+separately+use+ecclesiastical+laws%2C+and+the+administration+of+the+Word+of+God+and+sacraments%2C+which+the+Scripture+calls+setting+up+of+altar+against+altar+%5B2+Kn.+16%3A10-16%3B+Hos.+8%3A11%3B+10%3A1-2%5D%3B+for%2C+though+a+peaceable+departure+from+the+Church+may+be+lawful+and+just%2C+yet+if+new+associations+be+entred+into%2C+it+is+unjust%3B+for+this+cannot+be+done+unless+there+be+real+hatred+between+brethren%2C+contrary+to+Christianity%3B+for+the+end+of+the+commandment+is+charity.+It+must+therefore+be+considered+again+and+again+whether+the+cause+of+this+separation+be+of+so+great+moment+as+that+the+glory+of+God+and+salvation+depends+upon+it.%E2%80%9D%0A%0A%E2%80%94+John+Cameron%2C+Other+citations+%28work+not+named%29%2C+On+Schism%2C+p.+322+in+The+Character+of+a+Separatist%2C+or+Sensuality+the+ground+of+Separation%E2%80%A6+%28London%2C+1677%29%2C+Picture+%26+Character+of+a+Separatist%2C+pp.+23-25+Cameron+%28c.+1579+%E2%80%93+1625%29+was+a+Scottish+theologian%2C+professor+and+formalist.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fee9c9791a5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ee9c9791a5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separatism/#:~:text=Schism%20is%20either%20a%20rash%20or,God%20and%20salvation%20depends%20upon%20it&amp;text=Schism%20is%20either%20a%20rash%20or%20an%20unjust&amp;text=glory%20of%20God%20and%20salvation%20depends%20upon%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

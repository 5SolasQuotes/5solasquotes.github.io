</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-df0586260e" data-kw="" data-pol="">
<blockquote><p>This very thing cannot be conceived, how something by way of an internal habit could be the cause of sin and not be sin. An internal cause inclining to act well is good.</p></blockquote>

<div class="meta"><a class="tag" href="../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../topics/fall-and-sin/nature-of-sin.html">Nature of Sin</a></div>

</figure><figure class="quote" id="q-8cc42432c9" data-kw="" data-pol="rome">
<blockquote><p>Those who maintain that concupiscence is not sin, are wont to found on the passage of James, &quot;Then, when lust has conceived, it bringeth forth sin,&quot; (James 1:15). But this is easily refuted: for unless we understand him as speaking only of wicked works or actual sins, even a wicked inclination will not be accounted sin. But from his calling crimes and wicked deeds the fruits of lust, and also giving them the name of sins, it does not follow that the lust itself is not an evil, and in the sight of God deserving of condemnation.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.3.13</figcaption>
<div class="meta"><a class="tag" href="../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../topics/fall-and-sin/nature-of-sin.html">Nature of Sin</a><a class="tag" href="../topics/polemics/rome.html">Rome (General)</a></div>

</figure><figure class="quote" id="q-31ad792516" data-kw="" data-pol="">
<blockquote><p>The Reformed on the contrary state that all concupiscence, which certainly inclines toward evil, is sin, insofar as (1) all such concupiscence is against the law (Rom. 7:7) and thus is lawlessness, in which sin fully consists (1 John 3:4).</p></blockquote>
<figcaption>— <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a>, <cite>Theoretical-Practical Theology</cite>, 4.2.28</figcaption>

<main class="wrap"><figure class="quote" id="q-a04ecba4ce" data-kw="">
<blockquote><p>They [the Masoretes] together with the Sopherim themselves gave the most diligent attention to accurate preservation of the Hebrew Scriptures that has ever been devoted to any ancient literature, secular or religious, in the history of human civilization. So conscientious were they in their stewardship of the holy text that they did not even venture to make the most obvious corrections, so far as the consonants were concerned, but left their Vorlage [the version of the text they received] exactly as it was handed down to them. Archer concludes quoting W. F. Albright: “We may rest assured that the consonantal text of the Hebrew Bible, though not in- fallible, has been preserved with an accuracy perhaps unparalleled in any other Near Eastern literature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gleason-archer.html">Gleason Archer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of Old Testament Introduction rev. ed. (Moody, 1974) | ch. 3, ‘The Hebrew Manuscripts &amp; the Early Versions’, pp. 37-54</cite>, p. 65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/inerrancy-and-infallibility.html">Inerrancy and Infallibility</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e708455301" data-kw="">
<blockquote><p>Truly, this must not be tolerated in the church, that in place of the things which the Holy Spirit wrote in the Hebrew and Greek sources something should be foisted onto us as authentic which has been badly rendered by the translator or altered or mutilated and added by copyists, and that in such a way that one may not reject them even after he has examined the sources.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part I, Topic on the Holy Scripture, Sec. VII</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/vulgate.html">Vulgate</a></span><span class="t"><a href="../topics/holy-scripture/inerrancy-and-infallibility.html">Inerrancy and Infallibility</a> › <a href="../topics/holy-scripture/inerrancy-and-infallibility/the-vulgate.html">The Vulgate</a></span><span class="t"><a href="../topics/holy-scripture/inerrancy-and-infallibility.html">Inerrancy and Infallibility</a> › <a href="../topics/holy-scripture/inerrancy-and-infallibility/authenticity-of-the-hebrew-and-greek.html">Authenticity of the Hebrew and Greek</a></span></div>

— Martin Chemnitz, Examination of the Council of Trent, Part I, Topic on the Holy Scripture, Sec. VII">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTruly%2C%20this%20must%20not%20be%20tolerated%20in%20the%20church%2C%20that%20in%20place%20of%20the%20things%20which%20the%20Holy%20Spirit%20wrote%20in%20the%20Hebrew%20and%20Greek%20sources%20something%20should%20be%20foisted%20onto%20us%20as%20authentic%20which%20has%20been%20badly%20rendered%20by%20the%20translator%20or%20altered%20or%20mutilated%20and%20added%20by%20copyists%2C%20and%20that%20in%20such%20a%20way%20that%20one%20may%20not%20reject%20them%20even%20after%20he%20has%20examined%20the%20sources.%E2%80%9D%0A%0A%E2%80%94%20Martin%20Chemnitz%2C%20Examination%20of%20the%20Council%20of%20Trent%2C%20Part%20I%2C%20Topic%20on%20the%20Holy%20Scripture%2C%20Sec.%20VII&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe708455301.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e708455301.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-f06f0da33b" data-kw="hebrew greek">
<blockquote><p>The following arguments prove that the sources have not been corrupted. (1) The providence of God which could not permit books which it willed to be written by inspiration (theopneustois) for the salvation of men (and to continue unto the end of the world that they might draw from them waters of salvation) to become so corrupted as to render them unfit for this purpose. And since new revelations are not to be expected (after God has recorded in the Scriptures his entire will concerning the doctrine of salvation), what can be more derogatory to God (who has promised his constant presence with the church) than to assert that he has permitted the books containing this doctrine to become so corrupt that they cannot serve as a canon of faith? (2) The fidelity of the Christian church and unceasing labor in preserving the manuscripts; for since Christians have always labored with great zeal to keep this sacred deposit uncorrupted, it is not credible that they would either corrupt it themselves or suffer it to be corrupted by others. (3) The religion of the Jews who have bestowed upon the sacred manuscripts great care and labor amounting even to superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.10</span></figcaption>

</figure><figure class="quote" id="q-180a0bc941" data-kw="">
<blockquote><p>It would be tedious now to enumerate, what great additions and omissions the Septuagint has made, and all the passages which in church-copies are marked with daggers and asterisks. The Jews generally laugh when they hear our version of this passage of Isaiah, ‘Blessed is he that has seed in Zion and servants in Jerusalem.’ In Amos also after a description of self-indulgence Amos 6:4-6 there come these words: ‘They have thought of these things as halting and not likely to fly,’ a very rhetorical sentence quite worthy of Tully. But how shall we deal with the Hebrew originals in which these passages and others like them are omitted, passages so numerous that to reproduce them all would require books without number? The number of the omissions is shown alike by the asterisks mentioned above and by my own version when compared by a careful reader with the old translation. Yet the Septuagint has rightly kept its place in the churches, either because it is the first of all the versions in time, made before the coming of Christ, or else because it has been used by the apostles (only however in places where it does not disagree with the Hebrew).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 57, ‘To Pammachius on the Best Method of Translating’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/inerrancy-and-infallibility.html">Inerrancy and Infallibility</a></span></div>

target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-281f1ebbf1" data-kw="">
<blockquote><p>From this discrepancy between the Hebrew [Jews’] books [i.e. the Septuagint] and our own arises the well-known question as to the age of Methuselah; for it is computed that he lived for fourteen years after the deluge, though Scripture relates that of all who were then upon the earth only the eight souls in the ark escaped destruction by the flood, and of these Methuselah was not one… …that they may not cast a slight on the trustworthiness of versions which the Church has received into a position of high authority, and because they believe that the Jewish manuscripts rather than our own are in error. For they do not admit that this is a mistake of the [Septuagint] translators, but maintain that there is a falsified statement in the original, from which, through the Greek, the Scripture has been translated into our own tongue. They say that it is not credible that the seventy translators, who simultaneously and unanimously produced one rendering, could have erred, or, in a case in which no interest of theirs was involved, could have falsified their translation; but that the Jews, envying us our translation of their Law and Prophets, have made alterations in their texts so as to undermine the authority of ours. This opinion or suspicion let each man adopt according to his own judgment. Certain it is that Methuselah did not survive the flood, but died in the very year it occurred, if the numbers given in the Hebrew manuscripts are true. My own opinion regarding the seventy translators I will, with God’s help, state more carefully in its own place, when I have come down (following the order which this work requires) to that period in which their translation was executed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>City of God, bk. 15, ch. 11</cite></span></figcaption>

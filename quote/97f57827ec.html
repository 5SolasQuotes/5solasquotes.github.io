<main class="wrap"><figure class="quote" id="q-97f57827ec" data-kw="">
<blockquote><p>Beware also of spending your time and spirits in debates and vain janglings one with another, to be temptations one to another, raising your own and others passions and corruptions instead of holy conference that might minister grace to the hearers. Mind well the apostle’s caveats in 1 Tim. 1:4-7; 5:13; 6:3-5; 2 Tim. 2:16-17; 1 Thess. 4:11. Is it not observable that the greatest sticklers in differences, the greatest disputers and contenders are usually the most distempered and barren hearted? like the mountains of Gilboa, high and hot indeed, but dry and unfruitful; warm, but withered; the unkindly, foolish, heat of division and debate, eating out the life, sap and native heat of real religion, which evanishes then into airy notions and litigious strivings, whereof no edification comes. O let not religion fly up from your hearts to your heads and evaporate into airy foams and forms and turn vapid and insipid. Be sure by questions and disputes as well the power of religion is enervated as the majesty of it infringed. The many disputes about religion commonly overthrows the practice of it, which consists not in discourses, but in doing. It is easy for a formal, moth-eaten Christian to hold up in the one, while he cannot bear up in the other, as Seneca observed anent moral virtue, Omnes disputare malunt, quam vivere, more prone are people to debate about the things of God, than to practice what is uncontroverted. If heaven could be obtained, and God pleased with jangling and debates, a profane sophister should sooner have the one and do the other than a holy Christian who knows that it is not talking of, but walking in the ways of God’s commandments that is most acceptable in his sight. But to say no more, listen to the apostle’s oracle in 1 Cor. 11:16, ‘If any man seem to be contentious, we have no such custom, nor the Churches of God.’ Love perverse disputings who will (which ever corrupts the mind), flee ye them as death, 1 Tim. 6:5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland</cite>, (1674; London, 1681), pp. 165-66</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e10e4d6844" data-kw="">
<blockquote><p>The judicious and great divine Calvin does upon this account exceedingly aggrege the divisions amongst some English in Frankfort [over the Anglican ceremonies], who… did even there contend for matters of little moment. This (says he, Epistle 200) was exceeding intempestive, or untimeous, and exceeding offensive to the Church of Christ, and unbecoming their case: And although he utterly disapproved these ceremonies, as unbecoming the Church of Christ, yet does he (Epistle 206) press moderation on both sides, using these words… ‘As I did exhort these who were not of one mind with you to stretch themselves with all possible moderation, so it did displease me that there was upon the other hand by you nothing ceded or remitted.’</p></blockquote>

</figure><figure class="quote" id="q-5c8d5afc64" data-kw="">
<blockquote><p>The voluntary and unnecessary dividing and separation from a true Church is schismatical. When we put bounds and partitions between it and ourselves, we sin (say some) as did these seducers here taxed by Jude. If the Church be not heretical or idolatrous, or do not by excommunication, persecution, etc. thrust us out of its communion; if it be such an one as Christ the head has communion with, we the members ought not by separation to rend and divide the body. To separate from congregations where the word of truth and Gospel of salvation are held forth in an ordinary way (1 Tim. 3:15), as the proclamations of princes are held forth upon pillars to which they are affixed; where the light of the truth is set up as upon a candlestick to guide passengers to heaven. (Rev. 1:13) To separate from them to whom belong the covenants, and where the sacraments, the seals of the Covenant, and for substance rightly dispensed, where Christ walks in the midst of his golden candlesticks, and discovers his presence in his ordinances, whereby they are made effectual to the conversion and edification of souls, in an ordinary way; where the members are saints by a professed subjection to Christ and his Gospel, and haply have promised this explicitly and openly; where there are sundry who in the judgment of charity may be conceived to have the work of grace really wrought in their hearts by walking in some measure answerable to their profession: I say to separate from these, as those with whom Church communion is not to be held and maintaind, is unwarrantable and schismatical.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude</cite>, (London: Maxey, 1654), on vv. 17-19, pp. 589-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-f3cf654479" data-kw="">
<blockquote><p>The ignorance of fundamentals condemns, which is to be understood [in] two ways: 1. The ignorance of fundamentals such as are supernatural fundamentals, condemns all within the visible church as a sin, but it does not formally condemn those who are [outside] the visible church (John 15:22). It only makes those who are without the church incurable, but does not formally condemn them, as medicine not known, and so not refused, makes sick men incurable, as a loss, but does not kill them as a sin. 2. Superstructures, which by consequence arise from fundamentals, are fundamental by consequence, and secondarily, as the second rank of stones that are immediately laid upon the foundation, are a foundation in respect of the higher parts of the wall, and therefore are materially fundamental. And the ignorance of these virtually condemns, and the denying of such, by consequence, is a denying of the foundation.</p></blockquote>

<blockquote><p>Yet (which we Protestants confess) all errors in doctrine do not give a man a just and sufficient cause to make a division from those that hold them. For the apostle commands us to receive him that is weak in the Faith, Rom. 14:1, and not to trouble him with disputes, and to afford him ourselves for an example in bearing gently with those who are not of our mind in everything. ‘Let us all who are perfect,’ says he, ‘be of the same mind; and if any of you think otherwise, God shall reveal even this unto him.’ Phil. 3:15. ‘Tis evident that this weaknesse in faith and this diversity in opinon whereof St. Paul speaks are errors, but such as he would have us bear with. Yet since he elsewhere pronounceth anathema against those that preach any other Gospel than that which he preached, we must of necessity conclude that there are two sorts of errors in religion: The one such, as a man may bear with without dividing from them who hold them; and the other such, for which he is bound to avoid their communion: and this difference depends upon the nature of errors themselves. For as the truths which we are to believe are not all of equal importance, some being esteemed fundamental and so absolutely requisite, that a man cannot come to the kingdom of Heaven if he be ignorant of them; others being profitable, yet not so necessary but that a man may without the knowledge of them serve God and enjoy salvation, so it is with errors: Some are pernicious and no way consistent with a true piety; others are less hurtful and do not necessarily draw in men to perdition. St. Paul does clearly enough discover to us this distinction, 1 Cor. 3:13, 15, where, after he had said that ‘none could lay any other foundation but that which he had laid,’ to wit, Jesus Christ, he adds that ‘they who builded upon this foundation wood, hay, stubble, should have loss in their work when it comes to be tried; nevertheless they should be saved, yet so as by fire;’ that is to say, with difficulty, their person only, or that wherein their chief good consisted, escaping a burning, an evident sign that there be errors which do not deprive the authors thereof of salvation, much less exclude such from happiness as believe them after them, and take them up (when they are dead or gone) merely upon their trust and credit. And to conclude, who does not see plainly that there be errors which utterly overthrow the foundations of Christianity, engaging us unavoidably in such things as are inconsistent with salvation? and that there be others which do not so? As for example: If one should think that he were bound to worship the sun (for seeing the sun is a creature, and those who worship creatures have no portion in the kingdom of Heaven), ’tis evident that he who has such an opinion cannot attain eternal happiness. And ’tis so with all other errors which overthrow any of the first, necessary, and fundamental articles of Christian religion. But the errour of those who believed of old that the Church shall continue a thousand years (or some long time) with Jesus Christ upon earth after the resurrection, is no way repugnant to piety towards God or charity towards our neighbor, nor does it directly overthrow any of the foundations of the Gospel, though it be in my opinion contrary to diverse passages of St. Paul and scarce consonant to the nature of Christ’s Kingdom. A man would scarce believe how necessary it is to mark this difference among the errors of men in matters of religion for preventing that vain scrupulosity and importunate pensiveness which many melancholy spirits are troubled with, who condemn all errors alike, and thunder out one and the same anathema against whatever differs (though never so little) from their apprehensions: yet for keeping them from falling on the other side, into the indifferency of profane persons who conform to any thing and swallow a camel as well as a gnat. Indeed the true pious person will endeavor to keep himself from all error; and will purge his neighbor too, as well as himself, so far as he is able. For any deviation from truth, though it may be a light and small error, yet ’tis an error (that is to say an ignorance, and contradiction to the truth) and by consequence an evil. But a man must be very diligent and circumspect in observing this distinction among errors and acknowledge that one is much more dangerous than another, and he should more or less abhor them all, according as he shall judge them to be more or less dangerous.</p></blockquote>

<blockquote><p>XLIII. Perseverance in true faith is a gift that is supremely necessary, so that, strengthened with all power according to the glorious might of God, we may overcome all afflictions, persecutions, and even temptations of the flesh, the world, and Satan, with all patience and gentleness, and with joy. XLIV. And this perseverance is not from us, but is graciously communicated to us by the power of God; therefore, Paul asks for it from God [in Col. 1:3-5]. No one can remain steadfast in the faith of Christ unless they are graciously strengthened by God, with the power of God aiding our weakness and granting patience. XLV. However, patience should by no means be forcibly extracted from those who are unwilling, but rather it should arise from a joyful and cheerful spirit, so that in trials the joy of the spirit may surpass the pain of the flesh. XLVI. From this, we conclude: 1. No faithful person can stand by their own virtue alone. 2. The steadfastness of faith amidst various temptations is a special gift from God, to be obtained through constant prayers. 3. Since the steadfastness of faith is strengthened by the glorious might of God, truly faithful and reborn individuals can never completely lose their faith.</p></blockquote>

</figure><figure class="quote" id="q-bc5b6209af" data-kw="">
<blockquote><p>This article will address the claim that Thomas Aquinas held to an Augustinian doctrine of predestination essentially compatible with that of the Reformed Churches, showing in what ways Thomas’s doctrine is compatible with the doctrine of the Reformed Churches and important ways in which it differs… Thomas did teach the perseverance of the elect, but not perseverance of the saints. What we mean by this is that he taught that all the elect will persevere, but that not only the elect, but many besides, are called to faith and given real conversion and grace, and eventually fall away. Their state in this life differs nothing from the elect. In keeping with this, one may not know in this life whether they are elect or reprobate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-johnson.html">Charles Johnson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Thomas &amp; TULIP’</cite>, (2020) 20 paragraphs at Reformed Theology Delatinized</span></figcaption>

<blockquote><p>Controversy VIII: Can justifying faith be lost? Thesis: Although the elect frequently fall into grave sins and thus lose faith in its act, time, and part, they are not completely abandoned by God, nor do they totally and finally lose faith and the other gifts of the Holy Spirit in terms of the root and habit, even if they may lose them in terms of quantity. [Romanist] Antithesis: Justifying faith and justice not only can be totally and finally lost but are sometimes indeed lost. Confirmation of the Thesis: 1. Scripture teaches that Christ’s sheep cannot perish (John 10) and that nothing can separate them from the love of God (Romans 8). 2. Faith is our victory by which we overcome the world (1 John 5). 3. God does not abandon the work of His hands (Psalm 138), nor does He tempt His own beyond their strength, but provides a happy escape (1 Corinthians 10). [Romanist] Confirmation of the Antithesis: 1. “The righteous can turn from their justice” (Ezekiel 18). 2. Some fall temporarily (Luke 8), and the charity of many will grow cold (Matthew 24). Many fall from the grace of God (Galatians 5). Many also depart from the faith (1 Timothy 4 and 6). 3. Some branches in Christ do not bear fruit and are thrown into the fire (John 15). 4. The apostle says he subdues his body to avoid being disqualified (1 Corinthians 9). 5. Some, after tasting the grace of God, fall back (Hebrews 6). 6. Some, like dogs, return to their own vomit (2 Peter 2). 7. Examples of fallen angels, the first parents, Saul, David, Solomon, Peter, etc., who fell into grave sins, show that some lost all final justice. 8. The nature of faith or justice is not such that it cannot be lost. Experience shows that many fall from faith every day. Many, though baptized and justified in baptism, fall. [The Reformed] Censure: 1. It does not concern here the living root of justice but the external appearance, so that the name “justice” refers to our senses, not to God’s hidden judgment. Moreover, the hypothesis is not correctly turned into a categorical. 2. Faith here means the doctrine and profession of faith, not the heart’s trust. The charity of hypocrites, which seems like fire, cools in winter, that is, in calamities. 3. It concerns hypocrites who, for some time, are branches in their own opinion and that of others. 4. Paul speaks of pious concern, not of a final event. 5. 6. It concerns hypocrites who, on the one hand, taste the grace of God, insofar as they receive various gifts of the Holy Spirit, on the other hand, seem truly to be elect. 7. Examples of fallen angels and Saul are irrelevant and unequal; the others are false. 8. Perseverance is attributed not to the merit of faith but to God’s mercy in Christ. Hence it is said: “Faith is immovable because of the Father’s election, the Son’s satisfaction, and the Holy Spirit’s seal.” Moreover, many hypocrites fall from faith. Finally, it is false to say that baptism justifies by the act itself. In short, in this controversy, the fallacy of “secundum quid ad simpliciter” is commonly used, that is, what is true in a certain sense is considered true absolutely; this is the fallacy of arguing from appearance to essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>

+sins%2C+show+that+some+lost+all+final+justice.+8.+The+nature+of+faith+or+justice+is+not+such+that+it+cannot+be+lost.+Experience+shows+that+many+fall+from+faith+every+day.+Many%2C+though+baptized+and+justified+in+baptism%2C+fall.+%5BThe+Reformed%5D+Censure%3A+1.+It+does+not+concern+here+the+living+root+of+justice+but+the+external+appearance%2C+so+that+the+name+%E2%80%9Cjustice%E2%80%9D+refers+to+our+senses%2C+not+to+God%E2%80%99s+hidden+judgment.+Moreover%2C+the+hypothesis+is+not+correctly+turned+into+a+categorical.+2.+Faith+here+means+the+doctrine+and+profession+of+faith%2C+not+the+heart%E2%80%99s+trust.+The+charity+of+hypocrites%2C+which+seems+like+fire%2C+cools+in+winter%2C+that+is%2C+in+calamities.+3.+It+concerns+hypocrites+who%2C+for+some+time%2C+are+branches+in+their+own+opinion+and+that+of+others.+4.+Paul+speaks+of+pious+concern%2C+not+of+a+final+event.+5.+6.+It+concerns+hypocrites+who%2C+on+the+one+hand%2C+taste+the+grace+of+God%2C+insofar+as+they+receive+various+gifts+of+the+Holy+Spirit%2C+on+the+other+hand%2C+seem+truly+to+be+elect.+7.+Examples+of+fallen+angels+and+Saul+are+irrelevant+and+unequal%3B+the+others+are+false.+8.+Perseverance+is+attributed+not+to+the+merit+of+faith+but+to+God%E2%80%99s+mercy+in+Christ.+Hence+it+is+said%3A+%E2%80%9CFaith+is+immovable+because+of+the+Father%E2%80%99s+election%2C+the+Son%E2%80%99s+satisfaction%2C+and+the+Holy+Spirit%E2%80%99s+seal.%E2%80%9D+Moreover%2C+many+hypocrites+fall+from+faith.+Finally%2C+it+is+false+to+say+that+baptism+justifies+by+the+act+itself.+In+short%2C+in+this+controversy%2C+the+fallacy+of+%E2%80%9Csecundum+quid+ad+simpliciter%E2%80%9D+is+commonly+used%2C+that+is%2C+what+is+true+in+a+certain+sense+is+considered+true+absolutely%3B+this+is+the+fallacy+of+arguing+from+appearance+to+essence.%E2%80%9D%0A%0A%E2%80%94+Johann+H.+Alsted%2C+%E2%80%98On+Justification+%26+Good+Works+in+General%E2%80%99+in+Theologia+polemica%2C+exhibens+praecipuas+huius+aeui+in+religionis+negotio+controuersias+sex+in+partes+tributa+studio+%28d.+1638%29+at+Nosferatu%E2%80%99s+Substack+%282024%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa8de02d751.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a8de02d751.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/perseverance-of-the-saints#:~:text=Controversy%20VIII%3A%20Can%20justifying%20faith%20be,of%20arguing%20from%20appearance%20to%20essence&amp;text=Controversy%20VIII%3A%20Can%20justifying%20faith%20be%20lost%3F%20Thesis&amp;text=the%20fallacy%20of%20arguing%20from%20appearance%20to%20essence" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8541de0ac1" data-kw="perseverance against Remonstrants">
<blockquote><p>The question concerning perseverance is agitated by us with the old and new Pelagians and Semipelagians, who agree in opposing and denying it. Such are the Romanists, Socinians, Anabaptists and Remonstrants, who, on this point (as in the others concerning grace), depart from the orthodox doctrine and were condemned by the Synod of Dort in Article 5.</p></blockquote>

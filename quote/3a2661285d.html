<main class="wrap"><figure class="quote" id="q-3a2661285d" data-kw="">
<blockquote><p>VIII. But this person of the Deity alone, which is called the Word, did so assume unto itself the nature of man, that both these natures from the time of conception and after do inseparably remain one person, and the mass of the human nature is carried and supported by the deity.</p></blockquote>

</figure><figure class="quote" id="q-a469aee8d1" data-kw="Faith">
<blockquote><p>It is a REAL union. Such is our weakness in our present state, so much are we sunk in sin, that in our mind, we are prone to suspect spiritual realities to be only a fiction. But nothing is more real than what is spiritual: as approaching nearest to the nature of him who is the fountain of all reality, namely, God himself. We do not see with our eyes the union between our own soul and body; neither can we represent it to ourselves truly, by imagination, as we do sensible things: yet the reality of it is not to be doubted. Faith is no fancy—but &quot;the substance of things hoped for,&quot; Heb. 11:1. Neither is the union thereby made between Christ and believers imaginary—but most real: &quot;For we are members of his body, of his flesh, and of his bones,&quot; Eph. 5:30.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” general observations (2)</span></figcaption>

<blockquote><p>…He calls by the effectual word of the Gospel, sometime earlier and somtime later, at what time He lists, and graffs them into Christ, in whom He justifies them, sanctifies them, and finally rewards them with eternal life.</p></blockquote>

</figure><figure class="quote" id="q-42d71c9918" data-kw="">
<blockquote><p>There can be no safety, no holiness, and no happiness to those who are out of Christ. No safety, because all such are under the condemnation of the law, verses 1-3; no holiness, because only such as are united to Christ have the Spirit of Christ, verse 9; and no happiness, because “to be carnally minded is death,” verse 6. Hence those who are in Christ, should be very humble, seeing they are nothing, and he is everything; very grateful, and very holy. And those who are out of Christ, should at once go to him, that they may attain safety, holiness, and happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, rev. ed., 1886, ch. 8, Remarks</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

<blockquote><p>It is not in the adorer’s power that kneeling should be a sign of lesse worship, as referred to the image, and of greater, as referred to God; for the same material kissing and religious rostration which would immediatly be conveyed to Christ if He were in person present in the image and elements, is done to the image and elements; and religious kissing and religious kneeling signifies internal divine submission of heart to God, as the First Author of all and the last end, not by man’s will, but by divine institution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), Ch. 1; p. 166</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-510fd3b37d" data-kw="">
<blockquote><p>IV. The Nonconformists are not of one mind about receiving the Lord’s Supper kneeling. Many judge it lawful, though neither necessary nor most eligible were they free; some judge it also most eligible: and some judge it, as things stand, unlawful. Their reasons are: [Those who think it unlawful:] 1. In doubtful cases duty lies on the surest side. But this to them is a doubtful case on one side, and to imitate Christ’s institution by such sitting as men use to do at meat is certainly lawful. 2. Because they think this kneeling violates the reasons of the Second Commandment, being used where, by whole countries of Papists round about us and many among us, it signifies bread-worship or idolatry by the same action at the same season used. For they suppose that the Second Commandment forbids images as being external, corporal, idolatry and symbolizing scandalously with idolators, though the mind intend the worshiping of the true God alone. And such they think this kneeling is, and that it encourages the Papists (as is instanced in a story in the Life of Bishop Hall). 3. Because they think that the tradition and custom of the catholic Church and the canons of the greatest general councils, not repealed by any other (as Nicea 1, can. 20 &amp; Can. Trull. etc.) are of stronger obligation than the canons of our convocation. And those canons, customs and tradition prohibit all adoration by genuflection on any Lord’s Day in the year and on any weekday else between Easter and Whitsuntide; and this custom continued 1,000 years as the tradition of the universal Church and was never repealed, but charged by degrees by contrary practice. They that think not that they are bound by these canons or customs at all, yet think that they are enough to nullify a contrary canon of a lower power; or, ad hominem, may excuse them. Yea the Constitutions called the Apostles seem to command all the people to receive the sacrament standing and to go for it, bk. 2, ch. 57. Having prescribed the order of worship (that after the old Scriptures read, they sing a psalm and then read the Acts and Epistles and the Gospels, and then that the presbyters one by one exhort the people first and the bishop last (for in those time every Church that had an altar had a bishop) he concludes: ‘Postea vero fiat sacrificium, cuncto populo Stante et silent•o precant•, et oblatione facta, quisque ordo sco• sim corpus Domini et preciosum sanguinem sumat, accedentes ordine cum pudore et reverentia ut ad corpus Regis. I•em mulieres operto capite, ut ordiaem earum decet, acc dant.’ That is: ‘After let the sacrifice be made, all the people standing and praying in silence: And the oblation being made, let every order apart take the body of Christ and his precious blood: Coming to it in order with modesty and reverence as to the body of the King. And let the women approach with covered heads as becomes their order.’ For such reasons as these set together, some nonconformists (lay and clergy) take this kneeling (while Papists about us by the same gesture adore the bread) to be unlawful, who yet profess as great reverence to Christ and the eucharist as any others. But other nonconformists say that they can answer all these arguments, but that they truly render the scruples of the dissenters tolerable, and the persons unmeet to be therefore excommunicated. 2. By the [Anglican] canon and rubric, no one of these dissenters must be admitted to the holy communion, Canon 27 says: ‘No minister when he celebrates the communion shall wittingly administer the same to any but to such as kneel, under pain of suspension.’ And the ministers covenant to use no form of administering the sacraments but according to the Liturgy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), section 8, pp. 150-52 Baxter’s actual opinion, it appears, was that doing such was lawful; see a section below.</span></figcaption>

</figure><figure class="quote" id="q-3ffcc16b4a" data-kw="">
<blockquote><p>Where they have read that the people bowed before the altar of God, I know not. Bishop Lindsey indeed would prove from 2 Chron. 6:12-13 and Mic. 6:6 that the people bowed before the altar and the offering. But the first of those places speaks nothing of kneeling before the altar, but only of kneeling before the congregation, that is, in sight of the congregation. And if Solomon had then kneeled before the altar, yet the altar had been but occasionally and accidentally before him in his adoration, for to what end and use could he have purposely set the altar before him whiles he was kneeling and praying? The place of Micah cannot prove that God’s people did kneel before the offerings at all (for it speaks only of bowing before God) far less that they kneeled before them in the very act of offering, and that with their minds and senses fixed upon them, as we kneel [speaking of Gillespie’s opponents] in the very act of receiving the sacrament, and at that instant when our minds and senses are fastened upon the signs, that we may discern the things signified by them, for the exercising of our hearts in a thankful meditation upon the Lord’s death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 3, ch. 4, p. 69</span></figcaption>

<blockquote><p>Wherefore they are called upon to declare their joy and gladness by ‘clapping their hands’; which is a gesture expressive of exultation and joy; see Psalm 98:8, Nahum 3:19. It was used at the unction and coronation of a king, 2 Kings 11:12; and so very proper to be used on occasion of the Messiah being made or declared Lord and Christ, as he was at his ascension, Acts 2:36.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 47, verse 1</span></figcaption>

<main class="wrap"><figure class="quote" id="q-6e89666afa" data-kw="">
<blockquote><p>To God indeed the grand object of knowledge, the great source of obligation, the bestower of all happiness, the author of every good and perfect gift, your attention already has been or should have been directed in the study of his works, and especially in the study of man, the noblest of his works. God’s works should be all studied with a reference to him who created and sustains them.

The things that are made should be ever contemplated as having been made and regulated for the purpose of making known the invisible things of God, even his eternal power and Godhead; and moral philosophy, when taught as it should be, unfolds all that can be known of God, and of man’s relation to him, from the light of nature and the works of creation and providence, and especially from man’s mental constitution, in order to settle aright the nature, ground, and requirements of duty, in so far as these can be known and ascertained without an immediate and supernatural revelation.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8c7592e0f8" data-kw="">
<blockquote><p>Theology in general is teaching or a word about divine things. In this sense, the old Greek writers called those who taught a word about divine things theologians. And since there can be a word about God or divine things from either nature or revelation, the former comes as natural theology and the latter as revealed theology.

Natural theology is a word about God from nature, taught by the dictation of reason alone. For “what can be known about God is manifest in them, for God has manifested it to them. For since the creation of the world His invisible attributes are seen, having been observed in what has been made, His eternal power and divinity”—not unto the end that they may be saved through such knowledge, but “so that they are inexcusable” (Rom. 1:19–20).

Revealed theology is teaching about God, reconciling man, the sinner, to Himself in Christ, and in the same right knowledge and godly worship, revealing it through His word for the salvation of man, the sinner, and the glory of God. For “this is eternal life, that they may know You, the only true God, and the one whom You have sent, Jesus Christ” (John 17:3). “We speak out of sincerity, as from God, before the face of God in Christ” (2 Cor. 2:17).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, trans. Casey Carmichael, Classic Reformed Theology, vol. 4 (1697; Grand Rapids MI: Reformation Heritage Books, 2019), I.I-III, Kindle Locations 562-572.</span></figcaption>

2e0f8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8c7592e0f8.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/06/29/johann-heinrich-heidegger-on-theology-natural-and-revealed/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-b42d51e283" data-kw="">
<blockquote><p>While Thomas Aquinas strongly resisted the blasphemous notion that God had the power to do things contrary to his nature (such as sin and lie), he did not adhere to the other erroneous view that divine omnipotence was restricted to what God actually does:

[I]f we consider his power absolutely, he can do other things besides those that are subject to his providence or operation: but he cannot do what has been eternally contained in the order to his providence, because he is unchangeable. Through failing to observe this distinction some have fallen into various errors. Some in an endeavour to extend to things themselves the unchangeableness of the divine order, said that all things must of necessity be as they are; so much so, that some declared that God is unable to do except what he does. Against this we have the words Matth. 26:53: Cannot I ask my Father, and he will give me presently more than twelve legions of angels?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, trans. English Dominican Fathers (c. 1265; London, 1924), 3.98.</span></figcaption>

<blockquote><p>his [Descartes’] warning… that the main questions about God and the soul’s distinction from the body are among those that should be demonstrated by philosophy rather than theology (Descartes, Meditations on First Philosophy in The Philosophical Writings of Descartes, vol. 2, tr. John Cottingham, et al., Cambridge Univ. Press, 1984, p. 3)… In the branch of philosophy called first philosophy or metaphysics, he accomplished little, only explaining and defending two questions about God’s existence and the soul’s distinction from the body. For apart from those questions belonging to pneumatics and natural theology, he was so caught up in explaining them and defending them against objections that he revealed too clearly his weakness in understanding and judging metaphysical formalities and abstractions. I will not even [describe] how he went about proposing such lofty and difficult philosophical ideas in a methodical, precise, clear, and evident way, or how he dealt with similar things and hypotheses taken or assumed without proof, or the non-principles on which he built his own ideas. Finally, there are the contradictions, confusions, and evasions he typically resorted to when attacked by opponents, like a man who has fallen into water grasping at anything.</p></blockquote>

<blockquote><p>In summary, then, the thrust of the Fifth Way [of Aquinas] is this: (1) Irreducible teleology is immanent to the natural order; (2) But such teleology is unintelligible unless there is an intellect outside the natural order; so (3) There is an intellect outside the natural order. The argument differs from [William] Paley [early-1700’s] style design arguments and the arguments of ID [Intelligent Design] theorists in ways other than those already mentioned. For example, since the entities comprising the natural world have the final causes they have as long as they exist, the intellect in question has to exist as long as the natural world itself does, so as continually to direct things to their ends. The deistic notion that God might have “designed” the world and then left it to run independently is ruled out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, ch. 2, ‘Teleology: a Shopper’s Guide’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 28-49, p. 47</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In summary, then, the thrust of the Fifth Way [of Aquinas] is this: (1) Irreducible teleology is immanent to the natural order; (2) But such teleology is unintelligible unless there is an intellect outside the natural order; so (3) There is an intellect outside the natural order. The argument differs from [William] Paley [early-1700’s] style design arguments and the arguments of ID [Intelligent Design] theorists in ways other than those already mentioned. For example, since the entities comprising the natural world have the final causes they have as long as they exist, the intellect in question has to exist as long as the natural world itself does, so as continually to direct things to their ends. The deistic notion that God might have “designed” the world and then left it to run independently is ruled out.”

— Edward Feser, Neo-Scholastic Essays, ch. 2, ‘Teleology: a Shopper’s Guide’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 28-49, p. 47">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+summary%2C+then%2C+the+thrust+of+the+Fifth+Way+%5Bof+Aquinas%5D+is+this%3A+%281%29+Irreducible+teleology+is+immanent+to+the+natural+order%3B+%282%29+But+such+teleology+is+unintelligible+unless+there+is+an+intellect+outside+the+natural+order%3B+so+%283%29+There+is+an+intellect+outside+the+natural+order.+The+argument+differs+from+%5BWilliam%5D+Paley+%5Bearly-1700%E2%80%99s%5D+style+design+arguments+and+the+arguments+of+ID+%5BIntelligent+Design%5D+theorists+in+ways+other+than+those+already+mentioned.+For+example%2C+since+the+entities+comprising+the+natural+world+have+the+final+causes+they+have+as+long+as+they+exist%2C+the+intellect+in+question+has+to+exist+as+long+as+the+natural+world+itself+does%2C+so+as+continually+to+direct+things+to+their+ends.+The+deistic+notion+that+God+might+have+%E2%80%9Cdesigned%E2%80%9D+the+world+and+then+left+it+to+run+independently+is+ruled+out.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+Neo-Scholastic+Essays%2C+ch.+2%2C+%E2%80%98Teleology%3A+a+Shopper%E2%80%99s+Guide%E2%80%99+in+Neo-Scholastic+Essays+%28South+Bend%2C+IN%3A+St.+Augustine%E2%80%99s+Press%2C+2015%29%2C+pp.+28-49%2C+p.+47&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff5c6b28c66.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f5c6b28c66.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-particular-metaphysical-issues/#:~:text=In%20summary%2C%20then%2C%20the%20thrust%20of,to%20run%20independently%20is%20ruled%20out&amp;text=In%20summary%2C%20then%2C%20the%20thrust%20of%20the%20Fifth&amp;text=left%20it%20to%20run%20independently%20is%20ruled%20out" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

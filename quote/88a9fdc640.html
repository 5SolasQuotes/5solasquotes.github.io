<main class="wrap"><figure class="quote" id="q-88a9fdc640" data-kw="">
<blockquote><p>Another thing philoophy can tell us is that if a resurrection were to occur, only God could bring it about. That, in any event, was Aquinas’s view (Cf. Summa Theologiae, Supplement, 75.3). Natural material causes can no more reunite soul and body than they could generate a soul in the first place. Nor could even an angelic intellect reunite a soul and its body, since angels can only manipulate natural causes, even if they can do so more powerfully than we can (Cf. Summa Theologiae I.65.3-4 and I.105.1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature Ref (Editiones Scholastica, 2024), pt. 4, ch. 11</cite>, p. 520</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection/resurrection-of-the-body.html">Resurrection of the Body</a></span></div>

<blockquote><p>The resurrection of souls pertains to merit, which is the effect of justification; but the resurrection of bodies is ordained for punishment or reward, which are the effects of Him who judges. Now it belongs to Christ, not to justify all men, but to judge them: and therefore He raises up all as to their bodies, but not as to their souls.</p></blockquote>

</figure><figure class="quote" id="q-bf5c30a0dc" data-kw="same body identity">
<blockquote><p>Are the same bodies numerically which have died to be raised again? We affirm against the Socinians. It is not inquired whether they will be the same bodies as to qualities and conditions. For we confess that they will undergo a great change so as to be no longer animal, corruptible, weak, miserable and mortal, but spiritual, incorruptible, strong, glorious and immortal. But concerning numerical identity of substance—whether the same flesh which was dissolved by death will rise again—this we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.2.1–2</span></figcaption>

</figure><figure class="quote" id="q-9fe71f9563" data-kw="last things necessity">
<blockquote><p>The necessity and utility of this discussion are of the very highest. There is no precaution against sin and incentive to good works more efficacious than this meditation which impresses upon our minds: a contempt for the world and all earthly things; a desire for heaven and heavenly goods; hatred of sin and desire of holiness; a reverence and fear of the deity, before whom we must stand; an alleviation and solace for all troubles, which are shortly to come to an end.</p></blockquote>

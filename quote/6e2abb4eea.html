<blockquote><p>Nom. And do any of our godly and modern writers agree with you on this point? Evan. Yes, indeed. Polanus says, “The covenant of works is that in which God promiseth everlasting life unto a man that in all respects performeth perfect obedience to the law of works, adding thereunto threatenings of eternal death if he shall not perform perfect obedience thereto. God made this covenant in the beginning with the first man Adam, whilst he was in the first estate of integrity: the same covenant God did repeat and make again by Moses with the people of Israel.” And Dr. Preston, on the New Covenant, (p. 317.) says, “The covenant of works runs in these terms, “Do this and thou shalt live, and I will be thy God.” This was the covenant which was made with Adam, and the covenant that is expressed by Moses in the moral law.” And Mr. Pemble (Vind. Fid. p. 152.) says, “By the covenant of works we understand what we call in one word, “the law,” namely, that means of bringing man to salvation, which is by perfect obedience unto the will of God. Hereof there are also two several administrations: the first is with Adam before his fall, when immortality and happiness was promised to man, and confirmed by an external symbol of the tree of life, upon condition that he continued obedient to God, as well in all other things, as in that particular commandment of not eating of the tree of knowledge of good and evil. The second administration of this covenant was the renewing thereof with the Israelites at Mount Sinai: where, after the light of nature began to grow darker and corruption had in time worn out the characters of religion and virtue first graven in man’s heart,u God revived the law by a compendious and full declaration of all duties required of man towards God or his neighbour, expressed in the decalogue; according to the tenor of which law God entered into covenant with the Israelites, promising to be their God in bestowing upon them all blessings of life and happiness, upon condition that they would be his people, obeying all things that he had commanded; which condition they accepted of, promising an absolute obedience, (Exod. 19:8.) “All things which the Lord hath said we will do;” and also submitting themselves to all punishment in case they disobeyed, saying ‘Amen’ to the curse of the law, ‘cursed is every one that confirmeth not all the words of the law; and all the people shall say Amen.’ ” And Mr. Walker on the covenant, (p. 128.) says, that “the first part of the covenant, which God made with Israel at Horeb, was nothing else but a renewing of the old covenant of worksv which God made with Adam in paradise.” And it is generally laid down by our divines, that we are by Christ delivered from the law as it is a covenant.w BOSTON’S NOTES u.That is, had worn them out, in the same measure and degree as the light of nature was darkened; but neither the one nor the other was ever fully done, Rom. 2:14, 15. w. But not as it is a rule of life, which is the other member of that distinction.</p></blockquote>

</figure><figure class="quote" id="q-f600721bf9" data-kw="">
<blockquote><p>The exceeding great bitterness of the continued and increasing sad distractions amongst the people of God to the hindrance of their edification in faith and a godly life with charity and peace amongst themselves should put all the ministers of Christ to most serious thoughts in considering how far they may under the present dispensations of God, without sin, accommodate in following unquestionable duties with and under the established government of the Church. And although as to a cordial allowance of the present change they cannot yet attain, something remaining, whether of scruple or affection, which makes it unpleasing, and their concurrence with it, to lie heavy upon their spirits, yet if there be found no manifest transgression in concurring under the same, in matters of unquestionable duty, they would wisely put difference between gravamen spiritus [heaviness of spirit] and ligamen conscientiae [a tie of conscience]: something in the will that renders them averse, and [differenced from] the prevailing clear light of a well-informed conscience (to which, how uneasy it is to attain in this point of controversy, they can tell who have truly tried it) binding them up from concurrence, as a thing in itself unlawful. Men who walk in the fear of God and are zealous of His honor had need to be very jealous of their own zeal, that it carry them not to the rejecting of a real duty, which (to their apprehension) sits too near a sin… It is their duty to advert, lest, at this time too great animosity contribute to the laying of the foundation of a woeful division to be entailed to the generations to come, the evil whereof will preponder all the good that any one form of Church-government can, of itself, produce, viz. the dishonor of God, the weakening of the cause of the true protestant religion against the common adversaries thereof, the destroying of true charity and love amongst the people of God, the hinderance of their profiting under the several ministries they live under, and the creating continual confusions and distractions in the commonwealth (the ordinary fruit of schism in the Church) as too lamentable experience (whereof we carry the sad marks to this day) has taught us. 1. That there may and ought to be a brotherly accommodation and concurrence in matters of practice which are undoubted duty (albeit brethren be of different judgments anent the constitution of meetings or capacity of persons that act in these duties), grave and learned men have put it out of question. It is well known that in the [Westminster] Assembly of Divines at London, accommodation was mainly labored for (and far carried on) between presbyterians and independents, that they might concur in common actings for regulating the Church, with a reserve of liberty of their own several principles… Also, several of the most eminent presbyterians in England, as Mr. [Richard] Vines, Mr. [Richard] Baxter and others, accounting of un-preaching [ruling] elders, as of a human device (as now the office of a bishop is accounted of by many brethren), yet, not being able to attain to the exercise of presbyterial government without the intermixture of these; yea, of them, double the number to preaching presbyters in each meeting (which gave them an overswaying power in the government), notwithstanding they did concur with them in matters of unquestionable duty. Is it not also well known that amongst ourselves in this [Scottish] Church, [Resolutioner] brethren did ordinarily concur in synods and presbyteries, in doing their duties with these [the Protesters] whom they charged with a sinful schism? (a thing as much against the [Solemn League and] Covenant [1643], as that which is now pretended for withdrawing from the meetings of synods and presbyteries)… it is affirmed that they homologate with the tenet and practice of Separatism, denying the lawfulness of concurrence in a lawful necessary duty because of the personal sin of fellow-actors in it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-honyman.html">Andrew Honyman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Seasonable Case of Submission to the Church-Government as now Re-established by Law, briefly stated and determined by a Lover of the Peace of this Church &amp; Kingdom</cite>, (Edinburgh: Tyler, 1662) 45 pp.</span></figcaption>

C+in+doing+their+duties+with+these+%5Bthe+Protesters%5D+whom+they+charged+with+a+sinful+schism%3F+%28a+thing+as+much+against+the+%5BSolemn+League+and%5D+Covenant+%5B1643%5D%2C+as+that+which+is+now+pretended+for+withdrawing+from+the+meetings+of+synods+and+presbyteries%29%E2%80%A6+it+is+affirmed+that+they+homologate+with+the+tenet+and+practice+of+Separatism%2C+denying+the+lawfulness+of+concurrence+in+a+lawful+necessary+duty+because+of+the+personal+sin+of+fellow-actors+in+it%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Andrew+Honyman%2C+The+Seasonable+Case+of+Submission+to+the+Church-Government+as+now+Re-established+by+Law%2C+briefly+stated+and+determined+by+a+Lover+of+the+Peace+of+this+Church+%26+Kingdom+%28Edinburgh%3A+Tyler%2C+1662%29+45+pp.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff600721bf9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f600721bf9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/prelacy#:~:text=The%20exceeding%20great%20bitterness%20of%20the,personal%20sin%20of%20fellow%2Dactors%20in%20it&amp;text=The%20exceeding%20great%20bitterness%20of%20the%20continued%20and&amp;text=of%20the%20personal%20sin%20of%20fellow%2Dactors%20in%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I find her Majesty’s [Queen Elizabeth I’s] proceedings to have been grounded upon two principles. The one, that consciences are not to be forced, but to be won and reduced by force of truth, with the aid of time, and use of all good means of instruction and persuasion. The other, that causes of consciences when they exceed their bounds, and grow to be matter of faction, loose their nature, and that soveriegn princes ought distinctly to punish their practices and contempt, though colored with the pretence of conscience and religion. According to these principles, her majesty at her coming to the crown, utterly disliking the tyranny of Rome, which had used by terror and rigor to settle commandments of men’s faiths and consciences. Though as a princess of great wisdom and magnanimity, she suffered but the exercise of one religion; yet her proceedings towards the Papists, was with great lenity: expecting the good effects which time might work in them… her Majesty not liking to make windows into men’s hearts and secret thoughts, except the abundance of them did overflow into overt and express acts or affirmations, tempered her law so… and that… the humors of most Papists were altered, and that they were no more Papists in conscience, and of softness, but Papists in faction: Then were there new laws made for the punishment of such as should submit themselves to such reconcilements, or renunciation of obedience… For the other party, which have been offensive to the State, though in another degree, which named themselves Reformers, and we commonly call ‘Puritans,’ this has been the proceeding towards them: A great while, when they inveighed against such abuses in the Church as pluralities [of benefices], non-residence [of ministers] and the like, their zeal was not condemned, only their violence was sometime censured. When they refused the use of some ceremonies and rites, as superstitious, they were tolerated with much connivancy and gentleness; yea, when they called in question the superiority of bishops, and pretended to a democracy into the Church [many were congregationalists]; yet their propositions were here considered, and by contrary writings debated and discussed. Yet all this while, it was perceived that their course was dangerous and very popular: as because Papistry was odious, therefore it was ever in their mouths that they sought to purge the Church from the relics of Papistry; a thing acceptable to the people, who love ever to run from one extreme to another. Because multitude of rogues and poverty was an eye-sore, and a dislike to every man; therefore they put into the people’s head that if discipline were planted, there should be no vagabonds nor beggars, a thing very plausible: and in like manner they promised the people many of the impossible wonders of their discipline; besides, they opened to the people a way to government by their consistory and presbytery [through ruling elders]; a thing, though in consequence no less prejudicial to the liberties of private men, than to the sovereignty of princes; yet in first show very popular. Nevertheless this, except it were in some few that entered into extreme contempt, was born with, because they pretended in dutiful manner to make propositions, and to leave it to the providence of God, and the authority of the magistrate. But now of later years, when there issued from them that affirmed the consent of the magistrate was not to be attended; when under pretense of a confession, to avoid slander and imputations, they combined themselves by classes and subscriptions, when they descended into that vile and base means of defacing the government of the Church, by ridiculous pasquils [works of satire], when they begun to make many subjects in doubt to take oaths, which is one of the fundamental parts of justice in this land, and in all places; when they began both to vaunt of their strength and number of their partisans and followers, and to use cominations [threatenings] that their cause would prevail, through uproar and violence, then it appeared to be no more zeal, no more conscience, but mere faction and division: and therefore though the State were compelled to hold somewhat a harder hand to retrain them than before, yet was it with as great moderation, as the peace of the State or Church could permit. And therefore, sir, to conclude, consider uprightly of these matters, and you shall see her Majesty is no more a temporizer in religion: It is not the success abroad, nor the change of servants here at home, can alter her; only as the things themselves alter, she applied her religious wisdom to methods correspondent unto them; still retaining the two rules before mentioned, in dealing tenderly with consciences, and yet in discovering faction from conscience, and softness from singularity.</p></blockquote>

<blockquote><p>Since there are various species of union—some in evil, others in good and the truth—that unity only is to be proved which rests upon the truth. Hence unity is to be estimated by faith, not faith by unity. And thus the truth of doctrine, on which all true and saving union is founded, must first be known before the church can be evident.</p></blockquote>

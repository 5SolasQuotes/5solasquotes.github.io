<main class="wrap"><figure class="quote" id="q-c23f226acb" data-kw="">
<blockquote><p>For neither does any of us set himself up as a bishop of bishops, nor by tyrannical terror does any compel his colleague to the necessity of obedience; since every bishop, according to the allowance of his liberty and power, has his own proper right of judgment, and can no more be judged by another than he himself can judge another. But let us all wait for the judgment of our Lord Jesus Christ, who is the only one that has the power both of preferring us in the government of His Church, and of judging us in our conduct there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cyprian-of-carthage.html">Cyprian of Carthage</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Seventh Council of Carthage (256)</cite>, opening address</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-584b7f205d" data-kw="See of Peter Vicar of Christ">
<blockquote><p>To fix down Christ and the Holy Spirit and the Church to a particular spot, so that every one who presides in it, should he be a devil, must still be deemed vicegerent of Christ, and the head of the Church, because that spot was formerly the See of Peter, is not only impious and insulting to Christ, but absurd and contrary to common sense. … The see which they occupy, therefore, no more makes them the vicars of Christ, than it makes an idol to become God, when it is placed in the temple of God (2 Thess. 2:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/the-popes-claims.html">The Pope&#x27;s claims</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/apostolic-succession.html">Apostolic succession</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span></div>

</figure><figure class="quote" id="q-dd5daca24a" data-kw="">
<blockquote><p>Shall we recognise the Apostolic See where we see nothing but horrible apostasy? Shall he be the vicar of Christ who, by his furious efforts in persecuting the Gospel, plainly declares himself to be Antichrist? Shall he be the successor of Peter who goes about with fire and sword demolishing everything that Peter built? Shall he be the Head of the Church who, after dissevering the Church from Christ, her only true Head, tears and lacerates her members? Rome, indeed, was once the mother of all the churches, but since she began to be the seat of Antichrist she ceased to be what she was.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/the-popes-claims.html">The Pope&#x27;s claims</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/apostolic-succession.html">Apostolic succession</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span></div>

</figure><figure class="quote" id="q-475301f5c2" data-kw="">
<blockquote><p>If the question brought before the Vatican Council had been of a purely spiritual nature, had the bishops been only required to affirm such a doctrine as the Assumption of the Virgin Mary—that is to say, to assert a historical fact without a particle of evidence—I do not think many would have rebelled. It was because the doctrine of the Pope&#x27;s personal Infallibility had bearings on the practical business of this world; because its assertion was supposed to be intended for the preservation or recovery of the Pope&#x27;s temporal sovereignty; because the claim would enable him to interfere with more effect on questions of toleration, civil liberty, marriage, and education, that so much difficulty was made about conceding it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture VI</span></figcaption>

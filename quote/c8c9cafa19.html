<blockquote><p>Let me exhort you to a conscionable use of Ordinances. Be more frequent in hearing, in praying, in receiving, &amp;c.— I might say something to this last, viz. Receiving, The Apostle tells us, 1 Cor. 11.26. As often as we eat this bread, we shew forth the Lord’s death; it implies a frequent use of the Ordinance, more then once or twice a year, or once a quarter. Indeed the opportunities might be more frequent, if it were not for the coldness and deadness of our hearts.

In the Primitive times of the Church, while the blood of Christ was warm, they had the Sacrament every day; we have an uncontradicted authority, that they had it every Lord’s day. And as men grew colder, so the distances grew greater. Sure, were it not for the coldness and deadness of our hearts, it might almost be our daily bread; at least we might enjoy a more frequent use of this Ordinance then we do: but as the Apostle saith, as oft as you have opportunity do good: so as oft as you have the opportunity, take the occasions to meet God in his Ordinances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The guard of the tree of life, or, A sacramental discourse shewing a Christians privilege in approaching to God in ordinances, duty in his sacramental approaches, danger if he do not sanctify God in them</cite>, (London: A. Kemble, 1644), pp 19-21.</span></figcaption>

<blockquote><p>Vers. 23. For I have received of the Lord that which also I delivered unto you, that the Lord Jesus, the same night in which he was betrayed, took bread,

24. And when he had given thanks, he brake it, and said, Take, eat, this is my body which is broken for you: this do in remembrance of me.

That he may correct these errors; First he sets down the institution of the Sacrament, to vers. 27. and then he exhorts them to, and teaches them the lawful use of this Sacrament, to the end. As for the institution of the Supper, he shews that the Lord Jesus being about to suffer, by way of Testament, set his seal to the Covenant of Grace, which by his mediation he entered into between God and the Church: Whereby the glorious memory of his death might be celebrated in the world, till his second coming, and might be delivered to the faithful, and being delivered, it might judicially confirm a right to his person, and the benefits of his sufferings, and a living virtue flowing from his death, resurrection, and exaltation, to the sanctification and salvation of Believers, and that by the symbols of this holy Banquet, and holy Communion with God, and amongst themselves.

To which end Christ sitting at Table with his Disciples, after the eating of the Paschal Lamb; First, Took Bread, and sanctified it by giving of thanks, brake, and gave it to his Disciples, commanding them to take and eat; further, he declared the Bread received and eaten, to be his body represented after a Sacramental manner, that it being given for our Redemption, and after a judicial manner, applied to us; and lastly, he commanded that his Disciples, or all the faithful should imitate this his action in the Church, in remembrance of him, who had paid the price of Redemption by the sufferings of his body.

Vers. 25. After the same manner also he took the Cup, when he had supped, saying, This Cup is the New Testament in my blood: this do you, as oft as ye drink it, in remembrance of me.

That which concerns the other part of the Supper follows: In the same Supper, (viz. after the Paschal Supper) when the Bread was distributed, Christ took the Cup with Wine, sanctified by the giving of thanks, gave it to the Disciples to drink; further concerning the Cup he declared, That it being taken and drunk, was that new Covenant of Grace, between God and the Church, established Sacramentally by his blood, i. e. As it is ratified on God’s part that gives, so it is confirmed on the believers part that receives, and judicially applied and sealed: Lastly, He commanded that his Disciples should frequently imitate him in this action, in remembrance of him, who had paid the price of Redemption for the Church by the shedding of his blood.

Vers. 26. For as often as ye eat this Bread, and drink this Cup, ye do shew the Lord’s death till he come.

And that we might acknowledge, that of two Elements, Bread and Wine, one Supper (frequently to be celebrated in the Church) ought to be made; the Apostle would have perpetuated in the Church, a public commemoration of our Lord’s death, by the often reiteration of this Sacrament, and that because Christ would not be present in his body with the Church, before the last judgement, by this Sacrament he would that the memorial of the Churches redemption, by his death, might be preserved and celebrated, until he come out of Heaven in the last day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), pp 58-59.</span></figcaption>

<blockquote><p>[T]here be those that will not come to the Sacrament of the Lord’s Supper, (I speak what I know) because they say it is a sacred thing; and if they come there, they must enter into a solemn Covenant with God, which they know they cannot keep, and therefore they forbear to come:

I commend the reverent esteem which these people have of that sacred Institution; but I cannot but mourn for this, that they are afraid to tie themselves to God: Doth David desire and beg of God, To knit his heart unto him, Psal. 86.11. And doth Saint James say, Draw near unto God, and he will draw near unto you, and do these fear being tied too close to God? Again, I cannot but mourn to see the Devil transformed into an Angel of light in this matter; I confess a man that comes to God’s Table ought seriously to bethink himself what he goes about; but yet let me advise you, not to run into one sin, under a pretence of avoiding another: for what knowest thou, but if thou come prepared, that in thy receiving those sacred mysteries, God may give thee strength to do all that thou promisest.</p></blockquote>

<blockquote><p>For though Christ the Lord at the last supper instituted and delivered to the Apostles this venerable sacrament under the forms of bread and wine, yet that institution and administration do signify that all the faithful are by an enactment of the Lord to receive under both forms (Chapter 1) It declares furthermore, that in the dispensation of the sacraments…the Church may, according to circumstances, times and places, determine or change whatever she may judge most expedient for the benefit of those receiving them or for the veneration of the sacraments; and this power has always been hers” (Chapter 2). …Wherefore from the beginning of the Christian religion the use of both forms has not been infrequent, yet since that custom has already very widely changed, holy mother Church, cognizant of her authority in the administration of the sacraments, has induced by just and weighty reasons, approved this custom of communicating under either species and has decreed that it be considered the law, which may not be repudiated for changed at pleasure with the authority of the Church. (Chapter 2) …If anyone says that each and all the faithful of Christ are by a precept of God or by the necessity of salvation bound to receive both species of the most holy sacrament of the Eucharist, let him be anathema (Canon 1).</p></blockquote>

</figure><figure class="quote" id="q-c0ff43cb81" data-kw="">
<blockquote><p>There is no need of such an Interpreter; for things necessary to Salvation are so clearly set down in Scripture, that they need no Interpretation. Must we have an Interpreter to know that God hath created the World, that we must love God with all our heart, that the Son of God is dead for us? Now, I say, that all the Points necessary to Salvation are to be found in Scripture, in terms as clear as these.

The Interpretations used by the Pastors of our Churches, are taken from the Scripture itself, so they are not the Interpreters; it is God that expounds himself. For Example; When they expound these words, This is my Body; they take the Interpretation from Jesus Christ himself, who saith, that it is a Commemoration of him, and from three Evangelists, who say with one accord, that Jesus Christ hath given Bread to his Disciples; and from the words of Christ, that he drunk the Fruit of the Vine, we expound his other words, this is my Blood. We expound also these words of Christ, This is my Body, from St. Paul’s words, who (1 Cor. 11.) saith four times, that we eat Bread in the Lord’s Supper, and that we break Bread. Certainly, that Apostle giveth a clear Exposition of Christ’s words, This is my Body, and this is my Blood, saying, (1 Cor. 10.16.) The Cup of Blessing which we bless, is it not the Communion of the Blood of Christ? The Bread which we break, is it not the Communion of the Body of Christ?

We allege also those Texts that say, that Jesus Christ is no more in this World; that the Heaven doth contain him; that Christ is like unto us in all things, sin only excepted; and that by consequent he hath not a Body dispersed in a Million of several places at once, and enclosed whole in every Crum of the Host, and in every Drop of the Chalice.

Likewise, when Jesus saith, Do this in remembrance of me; We expound not these words as the Council of Trent doth, which puts this Sense upon them, I do constitute you to be Priests, to sacrifice my Body really under the species of Bread and Wine but we bring the Interpretation which St. Paul addeth (1 Cor. 11.26.) For as often as you eat this Bread and drink this Cup, ye do shew the Lord’s Death.

Consider also, that there is great Difference between a Judgment of Authority, and a Judgment of Discretion. With this last we judge of Meats by the Taste, without giving Laws to any. And it is so, that not only Pastors but also every one of the People, may and doth judge of the true Doctrine. And it is so that St. Paul will have the Corinthians to judge of his Doctrine (1 Cor. 10.15.) I speak as to wise men, judge ye what I say.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A short view of the chief points in controversy between the reformed churches and the Church of Rome. In two letters to the Duke of Bouillon, upon his turning papist</cite>, trans. Peter Du Moulin (London: Benjamin Tooke, 1680), pp 26-28.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-c89fc9a1c8" data-kw="">
<blockquote><p>The complete whole of our race shall have been perfected from the first man to the last — some having at once in this life been cleansed from evil, others having afterwards in the necessary periods been healed by the Fire.” (On the Soul and the Resurrection, NPNF2 5:859-866)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/river-devereux.html">River Devereux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A History of Alternative Views of Hell in the Church of England’ (2025) | The second key figure in this century to openly espouse universalism was Bishop Thomas Newton, who was the Dean of St Paul’s Cathedral in London, and the Bishop of Bristol from 1761 until his death. In a collection of his works, which was published in 1782 and reprinted five years later, the final work is ‘A Dissertation on the Final State and Condition of Men.’ In this dissertation, Bishop Newton taught that while both sinful humans and angels will go to hell, all will eventually repent and be saved. Newton argued for this on the basis of the Scriptural texts already cited and the teachings of fathers like Gregory of Nyssa, who explicitly taught universalism, saying that eventually:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/hell.html">Hell</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2d36567035" data-kw="">
<blockquote><p>VII… Now, there are three principal opinions of the theologians. Some think, that Christ by His soul properly descended into hell, that is, the place of the damned: either so that He might there undergo hellish sufferings, or so that He might inaugurate His triumph over defeated death. We repudiate this opinion… IX. Others say, that by the descent of Christ into hell nothing else is signified than the grave… X. Most of the Orthodox, by the descent of Christ into hell, understand His infernal anguish and sufferings, which Christ felt in His soul. In this opinion we also acquiesce.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Parts of Christ’s Office, pt. 2 in Christian Theology 3rd ed. (1634)</cite></span></figcaption>

</figure><figure class="quote" id="q-b5888ac32b" data-kw="">
<blockquote><p>Thomas Burnet… was… an influential thinker with many friends in high places, which is how he became the Chaplain to King William III and Clerk of the Closet. Burnet wrote ‘A Treatise Concerning the State of Departed Souls,’ where he argued for universal reconciliation and strongly repudiated the traditional view of eternal damnation… Burnet’s Treatise was published posthumously in 1720… Burnet did not deny that there would be a judgment for those who reject Christ or fail to repent of their sins, but he did not believe this judgment would last forever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/river-devereux.html">River Devereux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A History of Alternative Views of Hell in the Church of England’ (2025)</cite></span></figcaption>

<blockquote><p>7. Works done by unregenerate men, although, for the matter of them, they may be things which God commands, and of good use both to themselves and others;[y] yet, because they proceed not from a heart purified by faith;[z] nor are done in a right manner, according to the word;[a] nor to a right end, the glory of God;[b] they are therefore sinful, and cannot please God, or make a man meet to receive grace from God.[c] And yet their neglect of them is more sinful, and displeasing unto God.[d] [y] 2 Kings 10:30,31. 1 Kings 21:27,29. Phil. 1:15,16,18. [z] Gen. 4:5 with Heb. 11:4. Heb. 11:6. [a] 1 Cor. 13:3. Isa. 1:12. [b] Matt. 6:2,5,16. [c] Hag. 2:14. Tit. 1:15. Amos 5:21,22. Hosea 1:4. Rom. 9:16. Tit. 3:5. [d] Ps. 14:4. Ps. 36:3. Job 21:14,15. Matt. 25:41-43,45. Matt. 23:23.</p></blockquote>

<blockquote><p>III. Although the resurrection of the dead surpasses nature and man&#x27;s corrupt reason, yet it is neither against nature nor against right reason. For right reason teaches both that the dead can be raised and that they are to be raised. The former is concluded from the omnipotence of God, the latter from his justice. For as it is just that certain sins should be punished after this life, so it is also just that what was the partner of the sins should be the partner of the penalties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 34 (the resurrection), canon 3</span></figcaption>

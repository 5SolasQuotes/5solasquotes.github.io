<main class="wrap"><figure class="quote" id="q-44327ec6c7" data-kw="" data-pol="">
<blockquote><p>Has it never occurred to you that the pope, cardinals, bishops, monks, and that the whole synagogue of Satan are trouble-makers? The truth is, they are worse than false apostles. The files [sic] apostles taught that in addition to faith in Christ the works of the Law of God were necessary unto salvation. But the papists omit faith altogether and teach self-devised traditions and works that are not commanded of God, indeed are contrary to the Word of God, and for these traditions they demand preferred attention and obedience.</p></blockquote>
<figcaption>— <a href="../authors/martin-luther.html">Martin Luther</a>, <cite>Commentary on Galatians</cite>, p. 22</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-papacy.html">Rome: The Papacy</a><a class="tag" href="../topics/church/nature-and-marks.html">Nature &amp; Marks</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-669e01d933" data-kw="" data-pol="">
<blockquote><p>Your see, however, which is called the Court of Rome, and which neither you nor any man can deny to be more corrupt than any Babylon or Sodom, and quite, as I believe, of a lost, desperate, and hopeless impiety, this I have verily abominated, and have felt indignant that the people of Christ should be cheated under your name and the pretext of the Church of Rome; and so I have resisted, and will resist, as long as the spirit of faith shall live in me.</p></blockquote>
<figcaption>— <a href="../authors/martin-luther.html">Martin Luther</a>, <cite>Letter to Pope Leo X</cite>, p. 2</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-papacy.html">Rome: The Papacy</a><a class="tag" href="../topics/church/nature-and-marks.html">Nature &amp; Marks</a></div>

</figure><figure class="quote" id="q-b2dd3d4865" data-kw="" data-pol="">
<blockquote><p>Therefore, having been persuaded that the Pope is the Antichrist, and since truly it is clear from the words of Scripture that this be so, we must conclude that our secession from his communion is consummately necessary and that it is quite impossible that there be a reconciliation between us, if things so remain as they are.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 60</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-papacy.html">Rome: The Papacy</a><a class="tag" href="../topics/church/nature-and-marks.html">Nature &amp; Marks</a></div>

</figure><figure class="quote" id="q-bffd5fb0a7" data-kw="" data-pol="">
<blockquote><p>Thus, when the Pope usurps the triple office of Christ, he destroys Christ’s gospel by his own traditions, also destroying Christ’s redemption by his own indulgences, purgatory, masses, and rewards; all this while verbally professing Jesus to be the Christ. Notwithstanding his profession, he must be regarded as having denied Christ, together with the Father, by his very deeds and works.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 58</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-papacy.html">Rome: The Papacy</a><a class="tag" href="../topics/person-of-christ/prophet-priest-king.html">Prophet, Priest &amp; King</a></div>

</figure><figure class="quote" id="q-dd5daca24a" data-kw="" data-pol="">
<blockquote><p>Shall we recognise the Apostolic See where we see nothing but horrible apostasy? Shall he be the vicar of Christ who, by his furious efforts in persecuting the Gospel, plainly declares himself to be Antichrist? Shall he be the successor of Peter who goes about with fire and sword demolishing everything that Peter built? Shall he be the Head of the Church who, after dissevering the Church from Christ, her only true Head, tears and lacerates her members? Rome, indeed, was once the mother of all the churches, but since she began to be the seat of Antichrist she ceased to be what she was.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 4.7.24</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-papacy.html">Rome: The Papacy</a><a class="tag" href="../topics/church/nature-and-marks.html">Nature &amp; Marks</a></div>

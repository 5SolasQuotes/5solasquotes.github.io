<main class="wrap"><figure class="quote" id="q-a8a675fa03" data-kw="">
<blockquote><p>First for the word Testament, it doth signify the last Will of a man which he makes before his death, and leaves behind him either in word or writing, testified by seals and witnesses; By virtue of which Will he doth dispose his lands and possessions which he hath purchased, and all his goods which he hath gathered in his life time, and doth bequeath them as he himself will, and to whom he thinks fit, either freely or with condition, to have and hold them after his death, and not before; This is the true and proper meaning of the Word, and thus it is used by the Apostle, Hebr. 9. 16. And because the Apostle there calls the Covenant Christ’s Testament, and also elsewhere in his Epistles wheresoever he doth speak of the Old and New Covenant, that is, of the Covenant of the Law and of the Gospel, doth use the Greek word διαθήκη, even the same which there he useth for the last Will and Testament of a Testator, whereupon it comes to passe, that the Books of the Law and the Prophets, before Christ, and the Covenant in them are called the New Testament, and that very fitly in some respect, I mean in respect of Christ the Mediator.

For the truth is, that the Covenant of Grace more obscurely revealed to the Fathers in the writings of the Law and Prophets, and more plainly in the Gospel and writings of the Apostles, was never in force, neither could be ratified but by the death of Christ. It was before his coming sealed by his Blood in Types and Figures; and at his Death in his Flesh it was fully sealed and ratified by his very Blood it self actually, and indeed shed for our sins, and in this respect it may be fitly called the Testament. Because as a Testament is not in force till the Testator be dead, and where a Testament is, there the death of the Testator must come between to ratify it; So it is with the Covenant of Grace, and the promises therein made unto us.

Christ hath performed and purchased all things necessary for us, &amp; doth freely give to us himself, his righteousness, and all his treasures, as a man gives his Lands and Goods in his last Will, but they cannot be of force to bring us to heaven, till his death come between as a satisfaction for sin also; It is as necessary that Justice should be satisfied for sin by his Death, as righteousness of life performed, and salvation purchased by him for us. Secondly, as a man doth seal his Testament when he seeth or imagineth that his death is at hand; So Christ at his last Supper, by instituting the Sacrament of his Body and Blood, and by the outward Signs and Seales therein contained, did seal to his Church the Covenant of Grace.

Thus in respect of CHRIST the Mediator, God and Man, the Covenant of Grace, and the writings, Old and New, wherein it is contained, are called Testaments. But in respect of God the Father, and in respect of God, considered simply, or as the Maker of the Covenant with man, and the party between whom and man the Covenant is made; the Covenant and the Writing, Old and New, wherein it is comprehended, can in no case be called a Testament, because a Testament is of no force without the Testator’s death. But God the Father never died, nor can die, neither God simply considered, nor God the Maker of the Covenant with Man, and the other party in it which is opposed to Man. Only Christ died as he was Mediator, God and Man, and as he was made a partner with Man, and stood on his side in the Covenant, and as he is the Testator, and free giver of his Word in the Old and New Testament, and of his graces and gifts therein promised; so they are called Testaments, and in no other respect at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The manifold wisdom of God In the divers dispensation of grace by Jesus Christ, In the Old New Testament. In the covenant of faith. In the covenant of works. Their agreement and difference</cite>, (London: John Bartlet, 1641), pp 11-15.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4b32f9cbd8" data-kw="">
<blockquote><p>Nowadays, it is a little understood fact that the orthodox Covenanter position is that most of the penal sanctions of the Old Testament are part of the moral law, and thus forever bind all people (Westminster Confession 19:5). Those who appeal to Westminster Confession 19:4 in an attempt to prove that such laws have expired have seriously misunderstood what the Confession is referring to. As Samuel B. Wylie explains below, there is a section of the judicial laws that were unique to Israel; these laws have expired so as not to bind us any further than there general equity may require. However, other judicial laws do not fall under this category but are simply conceived as being part of natural/moral law:

Whatsoever the law of God commands to be punished, ought to be punished with the penalties therein made and provided; but God has commanded gross heretics, blasphemers, and idolaters, to be punished with certain specified penalties. Therefore, such ought to be punished. These commands could not belong to the ceremonial law, for then they would have flowed entirely from the arbitrary will of God, and been mere signs between him and Israel. Who would dare to think so of gross heresy, &amp;c.? Neither could they belong to that part of the judicial law which respected the Jews peculiarly. Who would dare to say that none but the Jews were, or are, under obligation to worship God in purity, or abstain from blaspheming his nature and dignity? They must, therefore, belong to the moral law, and flow from the moral nature of Jehovah, who has declared he will not give his glory to another, nor his praise to graven images.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), p. 66.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-d06d978e9d" data-kw="">
<blockquote><p>It revived the promise of that covenant, —that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Romans 10:5; as he doth, Leviticus 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 94</span></figcaption>

</figure><figure class="quote" id="q-698e135415" data-kw="Lord&#x27;s day resurrection">
<blockquote><p>The Lord’s day (kyriakē hēmera) in Christian usage is applied to the first day of the week, appointed for the public worship of God in memory of Christ’s resurrection. Now it is so called not so much with regard to the efficient (as if it was formally instituted by Christ himself, as the Lord’s Prayer and the Lord’s Supper are designated by the apostle, 1 Cor. 10:21). As will be seen afterwards, no argument can be given for such institution. With regard to the end, it was instituted in memory of the resurrection of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.14.1</span></figcaption>

<blockquote><p>Do you see how he makes this the distinction between law and gospel: that the former attributes righteousness to works, the latter bestows free righteousness apart from the help of works? This is an important passage, and one that can extricate us from many difficulties if we understand that righteousness which is given us through the gospel has been freed of all conditions of the law. (Calvin commenting on Romans 10:9)</p></blockquote>

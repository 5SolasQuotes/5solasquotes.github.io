<blockquote><p>Yet though this capacity should never be actuated, as if persons, both capable, should after marriage live together and it should be known or acknowledged that all their lives they did abstain, yet were the marriage ***, as to the conjugal rights on either part.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/viscount-of-stair-james-dalrymple.html">James Dalrymple</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Title 4, ‘Conjugal Obligations’ in The Institutions of the Law of Scotland Deduced from its Originals</cite>, … (Edinburgh: Anderson, 1681), pp. 28-44 | Dalrymple places the essence of contracting marriage in mutual consent, though with some qualifications, such as retarded or insane persons, etc. may not be able to give sufficient consent to the lifelong institution, and the impotent cannot marry. Yet he says:, p. 32</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e49b6da69f" data-kw="">
<blockquote><p>Monogamy is a distinctive aspect of the Christian tradition. Polygamy existed in most ancient societies, but Christian authorities opposed the practice, in part to distinguish monogamous Christianity from other faiths. By the early modern period, polygamy was rare in Christian Europe, and it had gained a negative reputation because of its association with sexual excess and lust. During the Reformation, however, certain individuals, including Luther himself, condoned polygamy, and Lutheran doctrine was compatible with plural marriage in some ways. After an ill-fated attempt [by Anabaptists] to establish a polygamous community at Munster, however, it became much more difficult to support polygamy, as the practice was further tainted by association with religious radicalism and lustful, degenerate behavior. During the English Revolution, the downfall of censorship and the tumultuous political climate allowed some English authors to write in support of plural marriage, using both practical and religious arguments. Yet, the majority of authors condemned the practice. Plural marriage continued to be associated with pagan and barbaric culture, and accusations of polygamy were used to undermine and discredit one’s enemies. In the literature of travel and colonisation, accusations of polygamy were used to demean and vilify peoples such as Jews and Turks. The existence of polygamy in Europe’s colonies helped Christian Europeans to maintain a sense of superiority over the pagan, barbaric indigenous inhabitants and helped to establish a shared European and Christian identity. In the writings of the Reformation and the Revolution, along with the literature of travel and colonisation, polygamy became a boundary marker between Christians and non-Christians, Catholics and Protestants, radicals and non-radicals, civilised countries and barbaric countries, and England and its colonies. Polygamy’s function as a boundary marker, more than any theological reasons, was the reason why plural marriage did not gain significant support in early modern England.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lisa-loughead.html">Lisa Loughead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perception of Polygamy in Early Modern England MA thesis</cite>, (Nova Scotia: Dalhousie University, 2008) 150 pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>In Latin children are called pignora, that is pledges, as if I should say, a pledge of the husbands love to the wife, and a pledge of the wife’s love toward the husband: for there is nothing which does so knit love between the man and the wife, as the fruit of the womb… If a woman have many defects (as Leah had) yet this is the mends which she makes her husband to bring him children, which is the right wedding ring that seals and makes up as it were the marriage.</p></blockquote>

<blockquote><p>…who denies that the magistrate may command the husband and wife to do a duty to each other, the father not to provoke the son, the son not to disobey the father… the master and servant, the captaine and soldier to do a duty each, one to another? And there is a proper right and liberty, and power [in these relations] immediately given by God, without the king or magistrate’s interposing of their authority: to all these, the king’s authority makes not the man a father, nor the son subject to the father, nor the servant to the master, nor the soldier to the commander. God immediately made those powers, and God in the Law of Nature has given a power to the father over the son without the magistrate; yea, though there had never been a magistrate in the world… …now it no more follows that all fathers are equal to the magistrate, all masters, all captains to the king… for fathers, masters, captains, husbands have immediately from God in the Law of Nature a supreme, a high and independent authority… without any intervention of the will or authority of king or any earthly magistrate, and without any subordination as they are such to the prince. … 3. If the magistrate should usurp over husbands, and masters and fathers, their jus maritale, herile, paterum [right of marriage, being an heir, or a father], and spoil them of husband-power, and masterly and fatherly power, as our adversaries counsel the magistrate to take the spiritual right and power of the keys of the Kingdome of God from the Church and pastors, the former should complain, as do the latter.</p></blockquote>

<blockquote><p>Epiphanius writes (Heresies, 61), ‘There were a sect, a branch of the old Cathari [12th-14th centuries, southern Europe], or Puritans, (as he says) which called themselves Apostolici, propter exactum disciplinae studium, etc., for an extraordinary desire they had above other men to have discipline and all things to the exact pattern of the apostles’ days;’ which is itself an imagination. For, it were cacozelia, an apish imitation, to retain all in use then, seeing diverse things even then were but temporaria. For beside their canon in matters of knowledge (Gal. 6:16), they had their dogmata or decreta, not of equal importance; as was that of eating ‘things strangled, and blood’ (Acts 15:20), which no man now thinks himself bound to abstain from. And besides their epitaxes, commandments in matter of practice (1 Cor. 7:10), they had their diataxes, injunctions, not of equal regard with the former. Such were their agapae, love-feasts after the sacrament (Jude 12): and their celebrating the sacrament after supper (1 Cor. 11:20-12) [in the evening, as the word in Greek for ‘supper’, δεῖπνον, in the Lord’s ‘Supper’, intimates]; which no Church at this day does imitate. Therefore, to press all that was in that time is an imagination. And, as to press all so of these things that remain, to press all alike, or think an equal necessity of them, which was a parcel of the imagination of the Donatists. For, some things the apostles peremptorily commanded (1 Cor. 7:10); Some things they had no commandment for, but only gave counsel (1 Cor. 7:25); Some things they commanded and taught (1 Tim. 4:11); somethings they taught and exhorted (1 Tim. 6:2); whereof each was to be esteemed in his own value and worthiness; Neither to dispense with the commandment, nor to make a matter of necessity of the counsel. Both which have not a little harmed the Church. Lastly, to these matters of counsel, which for the most part are things indifferent, they also fall upon two imaginations. 1. Some say: omnia mihi licent [‘all is lawful to me’] (1 Cor. 10:23), and so [if] it be not condemned as unlawful, make no bones of it, which tends to all profaneness. [2.] Others say, ‘Touch not, taste not, handle not’ (Col. 2:21), which speak of things indifferent as merely unlawful, which imagination ends in superstition. A mean [middle] way would be holden between them both, that neither ‘a snare be cast’ (1 Cor. 7:35) on men’s consciences by turning non expedit [not expedient] into non licet [not permitted], nor our ‘liberty’ in Christ (Gal. 5:13) [to] be made an occasion to the flesh by casting non expedit out of doors. For the Spirit of Christ is the spirit of ingenuity, which will freely submit itself to that which is expedient, even in things of their own nature lawful. The not observing whereof, with good heed and discretion, has in old time filled the world with many a superstitious imagination and in our days has healed the imagination and superstition and hypocrisy with another of riot and licentious liberty as bad as the former, yea a great deal worse.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Epiphanius writes (Heresies, 61), ‘There were a sect, a branch of the old Cathari [12th-14th centuries, southern Europe], or Puritans, (as he says) which called themselves Apostolici, propter exactum disciplinae studium, etc., for an extraordinary desire they had above other men to have discipline and all things to the exact pattern of the apostles’ days;’ which is itself an imagination. For, it were cacozelia, an apish imitation, to retain all in use then, seeing diverse things even then were but temporaria. For beside their canon in matters of knowledge (Gal. 6:16), they had their dogmata or decreta, not of equal importance; as was that of eating ‘things strangled, and blood’ (Acts 15:20), which no man now thinks himself bound to abstain from. And besides their epitaxes, commandments in matter of practice (1 Cor. 7:10), they had their diataxes, injunctions, not of equal regard with the former. Such were their agapae, love-feasts after the sacrament (Jude 12): and their celebrating the sacrament after supper (1 Cor. 11:20-12) [in the evening, as the word in Greek for ‘supper’, δεῖπνον, in the Lord’s ‘Supper’, intimates]; which no Church at this day does imitate. Therefore, to press all that was in that time is an imagination. And, as to press all so of these things that remain, to press all alike, or think an equal necessity of them, which was a parcel of the imagination of the Donatists. For, some things the apostles peremptorily commanded (1 Cor. 7:10); Some things they had no commandment for, but only gave counsel (1 Cor. 7:25); Some things they commanded and taught (1 Tim. 4:11); somethings they taught and exhorted (1 Tim. 6:2); whereof each was to be esteemed in his own value and worthiness; Neither to dispense with the commandment, nor to make a matter of necessity of the counsel. Both which have not a little harmed the Church. Lastly, to these matters of counsel, which for the most part are things indifferent, they also fall upon two imaginations. 1. Some say: omnia mihi licent [‘all is lawful to me’] (1 Cor. 10:23), and so [if] it be not condemned as unlawful, make no bones of it, which tends to all profaneness. [2.] Others say, ‘Touch not, taste not, handle not’ (Col. 2:21), which speak of things indifferent as merely unlawful, which imagination ends in superstition. A mean [middle] way would be holden between them both, that neither ‘a snare be cast’ (1 Cor. 7:35) on men’s consciences by turning non expedit [not expedient] into non licet [not permitted], nor our ‘liberty’ in Christ (Gal. 5:13) [to] be made an occasion to the flesh by casting non expedit out of doors. For the Spirit of Christ is the spirit of ingenuity, which will freely submit itself to that which is expedient, even in things of their own nature lawful. The not observing whereof, with good heed and discretion, has in old time filled the world with many a superstitious imagination and in our days has healed the imagination and superstition and hypocrisy with another of riot and licentious liberty as bad as the former, yea a great deal worse.”

— Lancelot Andrewes, 96 Sermons, One of the Sermons upon the 2nd Commandment, on Acts 2:42, pp. 29-30 Andrewes was a reformed Anglican.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEpiphanius+writes+%28Heresies%2C+61%29%2C+%E2%80%98There+were+a+sect%2C+a+branch+of+the+old+Cathari+%5B12th-14th+centuries%2C+southern+Europe%5D%2C+or+Puritans%2C+%28as+he+says%29+which+called+themselves+Apostolici%2C+propter+exactum+disciplinae+studium%2C+etc.%2C+for+an+extraordinary+desire+they+had+above+other+men+to+have+discipline+and+all+things+to+the+exact+pattern+of+the+apostles%E2%80%99+days%3B%E2%80%99+which+is+itself+an+imagination.+For%2C+it+were+cacozelia%2C+an+apish+imitation%2C+to+retain+all+in+use+then%2C+seeing+diverse+things+even+then+were+but+temporaria.+For+beside+their+canon+in+matters+of+knowledge+%28Gal.+6%3A16%29%2C+they+had+their+dogmata+or+decreta%2C+not+of+equal+importance%3B+as+was+that+of+eating+%E2%80%98things+strangled%2C+and+blood%E2%80%99+%28Acts+15%3A20%29%2C+which+no+man+now+thinks+himself+bound+to+abstain+from.+And+besides+their+epitaxes%2C+commandments+in+matter+of+practice+%281+Cor.+7%3A10%29%2C+they+had+their+diataxes%2C+injunctions%2C+not+of+equal+regard+with+the+former.+Such+were+their+agapae%2C+love-feasts+after+the+sacrament+%28Jude+12%29%3A+and+their+celebrating+the+sacrament+after+supper+%281+Cor.+11%3A20-12%29+%5Bin+the+evening%2C+as+the+word+in+Greek+for+%E2%80%98supper%E2%80%99%2C+%CE%B4%CE%B5%E1%BF%96%CF%80%CE%BD%CE%BF%CE%BD%2C+in+the+Lord%E2%80%99s+%E2%80%98Supper%E2%80%99%2C+intimates%5D%3B+which+no+Church+at+this+day+does+imitate.+Therefore%2C+to+press+all+that+was+in+that+time+is+an+imagination.+And%2C+as+to+press+all+so+of+these+things+that+remain%2C+to+press+all+alike%2C+or+think+an+equal+necessity+of+them%2C+which+was+a+parcel+of+the+imagination+of+the+Donatists.+For%2C+some+things+the+apostles+peremptorily+commanded+%281+Cor.+7%3A10%29%3B+Some+things+they+had+no+commandment+for%2C+but+only+gave+counsel+%281+Cor.+7%3A25%29%3B+Some+things+they+commanded+and+taught+%281+Tim.+4%3A11%29%3B+somethings+they+taught+and+exhorted+%281+Tim.+6%3A2%29%3B+whereof+each+was+to+be+esteemed+in+his+own+value+and+worthiness%3B+Neither+to+dispense+with+the+commandment%2C+nor+to+make+a+matter+of+necessity+of+the+counsel.+Both+which+have+not+a+little+harmed+the+Church.+Lastly%2C+to+these+matters+of+counsel%2C+which+for+the+most+part+are+things+indifferent%2C+they+also+fall+upon+two+imaginations.+1.+Some+say%3A+omnia+mihi+licent+%5B%E2%80%98all+is+lawful+to+me%E2%80%99%5D+%281+Cor.+10%3A23%29%2C+and+so+%5Bif%5D+it+be+not+condemned+as+unlawful%2C+make+no+bones+of+it%2C+which+tends+to+all+profaneness.+%5B2.%5D+Others+say%2C+%E2%80%98Touch+not%2C+taste+not%2C+handle+not%E2%80%99+%28Col.+2%3A21%29%2C+which+speak+of+things+indifferent+as+merely+unlawful%2C+which+imagination+ends+in+superstition.+A+mean+%5Bmiddle%5D+way+would+be+holden+between+them+both%2C+that+neither+%E2%80%98a+snare+be+cast%E2%80%99+%281+Cor.+7%3A35%29+on+men%E2%80%99s+consciences+by+turning+non+expedit+%5Bnot+expedient%5D+into+non+licet+%5Bnot+permitted%5D%2C+nor+our+%E2%80%98liberty%E2%80%99+in+Christ+%28Gal.+5%3A13%29+%5Bto%5D+be+made+an+occasion+to+the+flesh+by+casting+non+expedit+out+of+doors.+For+the+Spirit+of+Christ+is+the+spirit+of+ingenuity%2C+which+will+freely+submit+itself+to+that+which+is+expedient%2C+even+in+things+of+their+own+nature+lawful.+The+not+observing+whereof%2C+with+good+heed+and+discretion%2C+has+in+old+time+filled+the+world+with+many+a+superstitious+imagination+and+in+our+days+has+healed+the+imagination+and+superstition+and+hypocrisy+with+another+of+riot+and+licentious+liberty+as+bad+as+the+former%2C+yea+a+great+deal+worse.%E2%80%9D%0A%0A%E2%80%94+Lancelot+Andrewes%2C+96+Sermons%2C+One+of+the+Sermons+upon+the+2nd+Commandment%2C+on+Acts+2%3A42%2C+pp.+29-30+Andrewes+was+a+reformed+Anglican.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F19a576ab2e.html&amp;via=5Solas" target="_blank" rel="noo

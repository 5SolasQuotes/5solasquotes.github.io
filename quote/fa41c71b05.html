</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a2708ddae5" data-kw="">
<blockquote><p>My experience after two decades both at the local level and institutional level is this: for Southern Baptists image is everything. There is nothing and no one they will not sacrifice on the altar of their image. But it’s not just a commitment; it’s embedded in the culture itself. When image is everything, a culture of fear follows, so that anyone who does not match up with that image is considered a threat. As we’ve seen in the last couple of years, the SBC has been plagued with covering up sin to protect its image. But this occurs at the local church level as well. When there is sin in the leadership, the impulse is to cover it up to protect the image rather than being transparent with the church. Southern Baptist pastors often tell their congregations, “Just trust us,” and “Don’t gossip,” which results in a church incapable of acting when they suspect sin in the leadership. Moreover, they have little recourse to an external ecclesiastical authority to hold the leadership accountable… I can no longer go along with Southern Baptists who pride themselves on a type of independence that locks out effective external accountability. Nor can I continue ignoring the spiritual abuse that so many have suffered as a consequence. In short, when image is everything, the cross is eclipsed. Ironically, this does not image the humility of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-barrett.html">Matthew Barrett</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘I am leaving the SBC and becoming Anglican’</cite>, (2025) at Anselm House</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

lts/#:~:text=My%20experience%20after%20two%20decades%20both,not%20image%20the%20humility%20of%20Christ&amp;text=My%20experience%20after%20two%20decades%20both%20at%20the&amp;text=this%20does%20not%20image%20the%20humility%20of%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-6201f5bc82" data-kw="">
<blockquote><p>It is an untruth which Raphael de la Torres [a Dominican Romanist], with other schoolmen say, that with the same religion by which we honor holy men, we honor God; upon this reason, because holiness in them is a participation of the divine nature, therefore God must be the intrinsical end, and formal reason for which we honor the saints. [1.] For holiness in saints is a participation of the divine nature; but it is a temporary and a created participation, it is not the same very holiness that is in God; but the created effect thereof: and so the love I bear to any creature, because there is somewhat of God in every creature; and the love to our neighbor, commanded in the Second Table of the Law, should be the love of God, commanded in the First Table of the Law. 2. When I bow to the gray-haired, and to the king, I then do an act of obedience to the Fifth Commandment: No man can say that when I bow to the king or to a holy man, that I am then bowing to the God of heaven and Worshipping God: No acts terminated upon saints living or dead are acts of worshipping God; yea, reverencing of the ordinances of God, as the delighting in or trembling at the Word, are not properly acts of adoring God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Introduction, section 6, pp. 83-84</span></figcaption>

<blockquote><p>Much less can he [a magistrate] on pretence of parish-order tie me to an ignorant, drunken, malignant, or an inexperienced sapless [religious] teacher, that is to my soul as a silly emperic [a medical practitioner who relies solely on observation and experiment] to my health. Scripture and the world’s experience tell how much God morally gives his light and grace according to the aptitude of means: Habitus infusi se habent ad modum acquisitorum [infused habits hold themselves unto the way of those things having been acquired], is common in the schools. Twenty sinners are usually sooner brought to repentance under skilful, fit teachers than under one unskilful or ungodly man. And no man has power from God to damn my soul or forbid me the needful means of my salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Answer to Dr. Edward Stillingfleet’s Charge of Separation</cite>, … (London: 1680), ‘A Reply to Dr. Stillingfleet’s Letter’, p. 16</span></figcaption>

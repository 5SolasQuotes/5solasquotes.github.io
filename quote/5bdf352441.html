<main class="wrap"><figure class="quote" id="q-5bdf352441" data-kw="">
<blockquote><p>Therefore, See that ye come unto Jesus Christ by Faith without delay, and Receive him as your only All-sufficient Saviour, that is able to save you to the uttermost; Accepting him upon his own terms of denying your selves, taking up your Cross daily, and following him. So Jesus Christ will be unto you, Wisdom, to guide you in the way to Heaven; Righteousness, to wash away all your Sins by his blood, and justify you freely by his spotless Righteousness imputed unto you; Sanctification, to furnish you sufficiently with all treasures of Grace out of his fullness of Grace; and Redemption, to deliver you from all your bondage under Sin, Satan, the curse of the Law, the Wrath to come, and all your Spiritual Enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Tree of Life, or, The Natural Man Directed unto Christ (London, 1673), epistolary exhortation.</cite></span></figcaption>

<blockquote><p>§VIII. The external means are the Word (James 1:18, “Of his own will begat he us with the word of truth.” v. 21, “receive with meekness the engrafted word, which is able to save your souls.” 1 Pet. 1:23, “Being born again… by the word of God, which liveth.” Lk. 8:15; Gal. 3:2) and the sacraments (Jn. 3:5; Tit. 3:5; Gal. 3:27; Rom. 6:4; Lk. 22:20). The internal is faith (Gal. 5:6), hence in Acts 15:9, hearts are said to be purified by faith.</p></blockquote>

</figure><figure class="quote" id="q-5fc4ed81cf" data-kw="">
<blockquote><p>Q. 26. Does sanctification occur in the conscious level of the life of believers or below that level in depth? It occurs below the level of conscious life and works out of the regnerate root of the soul on its dispositions and inclincations to sanctify them. Q. 27. Is sanctification a mediate or immediate work? As it takes place below the consciousness, it is primarily an immediate work. That, however, does not take away form the fact that in its manifestation it is tied by God to the use of certain means.</p></blockquote>

<blockquote><p>Q. 2. On the Way that we Know God Positively we can say, following the lead of Scotus (Oxon. 1 d. 3 part one q.1) that our knowledge of God is: 1) Positive and not merely negative, because a purely negative knowledge is no knowledge. 2) Quidditative or essential and not merely knowledge of his existence or attributes, for in understanding existence or property we must pre-understand some quasi-subject in which we understand that quasi-property to be present in; therefore we do not merely understand whether God is but to some extent and imperfectly what God is. 3) Not merely in a concept analogous to the concept of a creature which, concept is altogether other than the one said of a creature, but in some concept univocal to God and creatures. This is plain directly from experience and indirectly follows once innatism, illuminationism, and ontologism have been rejected (see below). 4) Proper, but through concepts composed of common concepts. We can attain to many concepts proper to God that do not belong to creatures, for example, supreme being, infinite good, pure act, supreme legislator, etc. But concepts of this sort are not proper notions from proper notions but from transcendental notions, as first, supreme, being, good, which are predicated in common of God and creatures. 5) Notions abstracted from creatures, for as Scotus says, “All metaphysical investigation of God proceeds as follows: a) by considering the formal idea of something, and b) by taking away from that formal idea the imperfection that it has in creatures, and c) by keeping that formal idea and attributing to it altogether supreme perfection, and by thus attributing it to God” (Oxon. ibid.). Note the triple way, namely of affirmation, of negation, and of eminence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958) Wolter was a Scotus scholar and writes from that perspective., p. 87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

<blockquote><p>38. One act of faith is direct toward its object, another reflexive toward itself. Also the first act of faith is to believe, the second to work through charity and by means of it.

39. This latter act is the instrument of our sanctification, which is mortification of the old man according to all parts and faculties that are in us, and vivification of the new according to the same. But that is not perfect in the way, but such it will be in the goal, nor is it given here consqummated, but only begun.

40. Sanctification is succeeded by glorification…</p></blockquote>

<blockquote><p>There is one only God in three persons, the Father, Son and Holy Ghost: who is infinite in being, power, wisdom and goodness: the Creator of all things, our most absolute Lord, most righteous Governor and most gracious Father. (Rev. 4:8 &amp; 15:3; Ex. 34:6-7; Eze. 18:4; Ps. 47:7 &amp; 119:68 &amp; 145:9)</p></blockquote>

</figure><figure class="quote" id="q-95ac26add9" data-kw="">
<blockquote><p>1. The wicked, God’s adversaries, are in some way his own; and that ownness works patience. The Lord is a piece of a Father to them also. For He is: A common Father by office to all; A special Father by adoption to saints; A singular Father by nature to Christ. A Prince, besides his particular relation to his children, is Pater patriae [a father of fathers], Pater familias [a father of the family], and is good to all, though with a difference: So here. 2. Though Christ has purchased a peculiar people to Himself, to the purpose of salvation, yet others taste of this his goodness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-harris.html">Robert Harris</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon preached to the honorable House of Commons assembled in Parliament, at a public fast, May 25</cite>, 1642 (London: for John Bartlet, 1642), p. 32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/fatherhood-of-god.html">Fatherhood of God</a></span></div>

</figure><figure class="quote" id="q-f56ed18439" data-kw="">
<blockquote><p>IV. [The use of the doctrine of creation] Unto Παράκλησιν [Paraklēsin, Consolation]: Let us trust, however, in the help of God in whatever case, because both He can help us, as He who by a word fashioned the soul, Gen. 1, and He wills to help, because He is paternally affected toward man, inasmuch as concerning all things, not only for necessity but also for delight, He provided even before he existed. Let us retain this confidence concerning Him, however much the means of helping may not be present, Gen. 2:5-6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/fatherhood-of-god.html">Fatherhood of God</a></span></div>

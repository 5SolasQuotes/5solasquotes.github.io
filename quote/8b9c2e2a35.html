<main class="wrap"><figure class="quote" id="q-8b9c2e2a35" data-kw="">
<blockquote><p>There is great need of faithfulness and prudence, in defending the truths of Christ, against the errors of the times. Our faithfulness indeed will oblige us to do it; but prudence must direct us how to do it.

The establishment of our people in the truth, is one special end of the institution of the ministry, Eph. iv. 11. But without the assistance of both these graces, that end is never like to be attained. A faithful minister dares not be silent, where the souls of his people are concerned; yet all his endeavours to secure them, will be to little purpose, if prudence be wanting in the management of that design.

Prudence must both time our contentions, and regulate the manner of them. It will never suffer us to appear too soon, nor too late: Not too soon, because errors are sometimes best cured by neglect, and in a little time grow weary of themselves; not too late, lest they get head, and be past retrieve: Hasty contenders, like young faulconers, let fly the hawk with her hood on. Upon the other side, if friendship, or relation to seducers, stop our mouths too long, we may in a few days be entertained by them, (as Thyestes was by his brother Atreus) with the limbs of our own (spiritual) children.

Prudence will not suffer our pulpits to ring with invectives against seducers, till the more private and gentle methods have been tried in vain; and then neither prudence nor faithfulness will admit of longer delay.

But yet when they both advise us to engage, prudence must regulate the manner of the contention, and commands us to urge hard arguments, with mild and soft language.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Character of a Complete Evangelical Pastor Drawn by Christ</cite>, in The Works of John Flavel (6 vols, London, 1820), 6: 576-77.</span></figcaption>

<blockquote><p>Imperfect and unsatisfactory as this survey necessarily is, it is enough to prove not only that the Scriptures teach the divinity of Christ, but that Christianity as a religion consists in the love, worship, and service of the Lord Jesus, whose creatures we are, and to whom we belong by the still dearer relation of those whom He hath purchased with his own precious blood.</p></blockquote>

</figure><figure class="quote" id="q-4ae08d984d" data-kw="">
<blockquote><p>A perfect being’s love seems to be a pure perfection; therefore it belongs to God and indeed in supreme degree. The proof of the antecedent is: a) if love of this sort were not a pure perfection formally, it could be reduced to one or other pure perfections that were not formally love. But I do not see how such love could be reduced to something that was formally love. b) To love seems to be better than not to love; therefore love seems to be a pure perfection, because it is better than what is incompatible with it (namely not to love). The proof of the antecedent here is: a distinction must be drawn between love of friendship (benevolence) and love of concupiscence. The former is love of an object for its own sake, that is, because of the object’s intrinsic perfection, and this love does not seem to involve imperfection in the lover. Love of concupiscence is love of an object and not for the object’s sake finally but because the object perfects the lover or is a good for the lover. But this love does involve imperfection because the object is wanted precisely because it perfects a lover that is in itself capable of perfection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pt. 3, pp. 100-101 Wolter was a Scotus scholar.</span></figcaption>

<blockquote><p>If Christ be, by the gift of the Father, King of nations, then are nations, then are nations bound by the highest obligations to acknowledge him as their Lord. If nations have been given to Jesus Christ to be ruled by him, then are they bound to assent to the gift, and surrender themselves to him as voluntary subjects. To refuse, is to rebel against the express command, Ps. ii. 12, “kiss ye the Son.” It dishonours the Father; for it is a refusal to serve him in that way in which he has commanded service to be rendered. It dishonours the Son; for it is a rejecting of his just authority. Such conduct involves in it a stubborn refusal to repent and turn from sin (for there is no “repentance toward God” without “faith toward Jesus Christ;”) excludes a nation from any interest in the Covenant protection and favour of God; and subjects it to the infliction of the threatenings denounced against impenitent nations. The wrath of the Lord Jesus Christ will be kindled, and he will inevitably cause that nation to “perish from the way.” He will vindicate his own righteous claims.

Nor can the threatening be evaded by an acknowledgment, however sincere, of allegiance to an absolute God. “No man,” says Christ himself, “cometh to the Father but by me.” Any attempt to honour the Father, while the Son is neglected, is an abomination in his sight. However lightly men may esteem the royal prerogatives of the Messiah, they are not held of little value by him “by whom actions are weighed.” Nothing short of an open acknowledgment of Jesus Christ will meet his claims. This must be rendered under pain of God Almighty’s sore displeasure. “The kingdoms of this world must become” not only “kingdoms of our Lord,” but also “of his Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-m-willson.html">J. M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bible magistracy: or Christ’s dominion over the nations: with an examination of the civil institutions of the</cite>, United States (Philadelphia, 1842), pp 46-7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>But the words of Luke give rise to another question; for Christ does not order us to grant forgiveness, till the offender turn to us and give evidence of repentance. I reply, there are two ways in which offenses are forgiven. If a man shall do me an injury, and I, laying aside the desire of revenge, do not cease to love him, but even repay kindness in place of injury, though I entertain an unfavorable opinion of him, as he deserves, still I am said to forgive him. For when God commands us to wish well to our enemies, He does not therefore demand that we approve in them what He condemns, but only desires that our minds shall be purified from all hatred. In this kind of pardon, so far are we from having any right to wait till he who has offended shall return of his own accord to be reconciled to us, that we ought to love those who deliberately provoke us, who spurn reconciliation, and add to the load of former offenses. A second kind of forgiving is, when we receive a brother into favor, so as to think favorably respecting him, and to be convinced that the remembrance of his offense is blotted out in the sight of God. And this is what I have formerly remarked, that in this passage Christ does not speak only of injuries which have been done to us, but of every kind of offenses; for he desires that, by our compassion, we shall raise up those who have fallen. This doctrine is very necessary, because naturally almost all of us are peevish beyond measure; and Satan, under the pretense of severity, drives us to cruel rigor, so that wretched men, to whom pardon is refused, are swallowed up by grief and despair. But here another question arises. As soon as a man by words makes profession of repentance, are we bound to believe him? Were this done, we must of necessity go willingly and knowingly into mistake; for where will be discretion, if any man may freely impose on us, even to the hundredth offense? I answer, first, the discourse relates here to daily faults, in which every man, even the best, needs forgiveness. Since, then, amidst such infirmity of the flesh, our road is so slippery, and snares and attacks so numerous what will be the consequence if, at the second or third fall, the hope of forgiveness is cut off? We must add, secondly, that Christ does not deprive believers of the exercise of judgment, so as to yield a foolish readiness of belief to every slight expression, but only desires us to be so candid and merciful, as to stretch out the hand to offenders, provided there be evidence that they are sincerely dissatisfied with their sins. For repentance is a sacred thing, and therefore needs careful examination; but as soon as the offender gives probable evidence of conversion, Christ desires that he shall be admitted to reconciliation, lest, on being repulsed, he lose courage and fall back. Thirdly, It must be observed that, when any man, through his light and unsteady behavior, has exposed himself to suspicion, we may grant pardon when he asks it, and yet may do so in such a manner as to watch over his conduct for the future, that our forbearance and meekness, which proceed from the Spirit of Christ, may not become the subject of his ridicule. For we must observe the design of our Lord himself, that we ought, by our gentleness, to assist those who have fallen to rise again. And certainly we ought to imitate the goodness of our heavenly Father, who meets sinners at a distance to invite them to salvation. Besides, as repentance is a wonderful work of the Spirit, and is the creation of the new man, if we despise it, we offer an insult to God himself.</p></blockquote>

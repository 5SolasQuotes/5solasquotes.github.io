<blockquote><p>where there is nothing like a party or equality, but the division is in the same one Church betwixt a greater and smaller number, and the greater will not be induced to remove their determination; It is no way sinful to the lesser to join with them notwithstanding thereof they having their own freedom and liberty cautioned, as was formerly said; Yea, this seems not unexpedient that they should do for the good of the Church.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8ac99ed5c7" data-kw="">
<blockquote><p>And secondly, whereas they allege that we let the wicked continue in our Church without separation, whereas we should cut them off when we find them to be hypocrites. I answer: We doe separate, as much as in us lies, for we labor to have them separated from us, and also we labor to separate ourselves from them. First, we labor their separation from us, desiring their removal, bewailing their wickedness, and our condition that live in Mesech and Kedar, and reproving them for their sins; and if that will not serve, complaining against them to those that are in authority, that they may bee excommunicated, and withal we are instant with God by prayer to stir up the hearts of such as are in authority to execute his ordinances upon them: we do what we can to separate them from us, and it comes sometime to pass, that many are so separated from us; but if they should not, that indeed were the Churches sin, and a foul sin too; yet it destroyes not the true being of our Church. Secondly, if we cannot get them separated from us, yet we separate ourselves from them, and that is the separation that the Scripture so much beats upon in private persons, as we are more conscionable, so we doe more separate from them, from their wills, affections and courses; yea, we must separate as much as conveniently we may from their persons, at least from their sins, which for our parts we are persuaded to be the chief separation that the Scripture intends. Yea, but this is a secret separation, say they, under hand, not openly known. Nay, this is a notorious and known separation: For first, it is ingenuously professed on our part, to the moving of their after-hatred and despite against us; we disclaiming them that are lewd, swearing and profane wretches, and that openly, not caring who know it; and likewise it is known on their part, they upbraiding us therefore very reproachfully, with the names of Puritans, Precisions, holy Brethren, and such like, because we will not accompany with them; if this be not an holy and a plain separation, what is?… Yea, but say they, ye should separate from them in the assemblies, from the Word and the sacraments? I answer: Rather the wicked should separate from us in these things: where the assembly and business are naught in themselves, as at playhouses and such like, there the good must separate: but where the assembly and business is good in itself, there the bad must separate; and the reason is good, for it is none of theirs, and the good must tarry and be present, for it is their own right; and it is sin to refuse God’s ordinances for the pollution of others, 1 Sam. 2:17, 24… yet our holiness being true in us, and openly professed and practiced, it shall be enough to make us a true visible Church, yea, and an holy congregation in God’s acceptation, and in the charitable estimation of our brethren.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church</cite>, … (London: Kyngston, 1631). Randall (1570–1622) was an English puritan. | pt. 1, Lecture 12; pp. 208-9</span></figcaption>

<blockquote><p>6. Whatever sad differences be oft amongst these [Christians], which both their darkness of mind and contrariety of natural dispositions may influence, yet does not still that blessed unity of the Spirit stand fixed and sure, by which the whole race of the saints are united in a new and spiritual nature in these sweet and sensible communications of the Spirit, and do all meet in one blessed center, yea so near an intercourse of souls and sympathy does result thence (however the sad prevalence of corruption may for some time darken the same) as no union and concord like this is in all the societies of the earth, and may be such a witness to the truth of Christianity, as to silence even the greatest atheist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-robert-fleming.html">Robert Fleming Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church Wounded &amp; Rent by a Spirit of Division</cite>, (1681), §4, p. 30</span></figcaption>

</figure><figure class="quote" id="q-fe32c49e52" data-kw="">
<blockquote><p>You [congregationalists] acknowledge the Churches under episcopal government in England, and under presbyterial in France, Holland and Scotland for true Churches and their ministry for a true ministry. But here I desire, with many others, to know what you understand by true Churches, and a true ministry: whether a metaphysical, logical, or a moral verity? If you understand that they be true Churches veritate metaphysica entis et transcendentalis [by the metaphysical and transcendental truth of being], such as Du Plessis and many of our divines grant unto the Romish Church, viz. that she is a true Church (as a pocky [covered with pock marks, i.e. sick] whore is a true woman), howsoever her flesh be so consumed with corruption that she cannot live, but must die of it, and that none can touch her without danger of being infected with her sickness; for she is a harlot and a whore, howsoever clothed with scarlet: we thank you for your favor; you hold us in the same category with Rome. If you hold us a true Church veritate logica [by logical truth], and morally, for a pure Church, wherefore desire you a toleration? Wherefore will ye not join with us and communicate as brethren with us? But you add a little after the middle part of this section, that you both did and would hold a communion with all those Churches, as with the Churches of Christ. But what communion is this you hold with these, rather than with Papists, Brownists, Anabaptists in England and the Lutherans? If ye say in doctrine, that union is not external, since: [1.] You testify it not by your external communion in the sacraments with us, for you will not admit all those to your communion that we admit to ours.

2. Neither will those [congregationalists] of New England, whom you cry up and extol so highly, admit those of our Church to their communion, or to be members of their Churches, unless of late they have changed their opinion and you and they temporize in conforming your opinions to the times and commensurate them to political aims for toleration.

3. Neither know we whether they will communicate with us; at least their writings and letters from New England, which heretofore we have seen, testify no such thing; so that in this you dissent from them, unless they within this year dissent from themselves. … But howsoever you pretend this real profession of communion with us, yet you overthrow it by your restriction afterwards, viz. to such as you know to be godly that came to visit you in your exile, but you will not admit all the members of our Churches, but such as you only judge, not we, to be members of our Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/adam-steuart.html">Adam Steuart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Some Observations &amp; Annotations upon the Apologetical Narration</cite>, [of the Congregationalists of the Westminster Assembly], humbly submitted to the Honorable Houses of Parliament... (London: Meredith, 1643), ‘Annotations upon’ Steuart (1591–1654) was a Scottish presbyterian and professor of philosophy., pp. 17-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

— Adam Steuart, Some Observations &amp; Annotations upon the Apologetical Narration, [of the Congregationalists of the Westminster Assembly], humbly submitted to the Honorable Houses of Parliament... (London: Meredith, 1643), ‘Annotations upon’ Steuart (1591–1654) was a Scottish presbyterian and professor of philosophy., pp. 17-18">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYou+%5Bcongregationalists%5D+acknowledge+the+Churches+under+episcopal+government+in+England%2C+and+under+presbyterial+in+France%2C+Holland+and+Scotland+for+true+Churches+and+their+ministry+for+a+true+ministry.+But+here+I+desire%2C+with+many+others%2C+to+know+what+you+understand+by+true+Churches%2C+and+a+true+ministry%3A+whether+a+metaphysical%2C+logical%2C+or+a+moral+verity%3F+If+you+understand+that+they+be+true+Churches+veritate+metaphysica+entis+et+transcendentalis+%5Bby+the+metaphysical+and+transcendental+truth+of+being%5D%2C+such+as+Du+Plessis+and+many+of+our+divines+grant+unto+the+Romish+Church%2C+viz.+that+she+is+a+true+Church+%28as+a+pocky+%5Bcovered+with+pock+marks%2C+i.e.+sick%5D+whore+is+a+true+woman%29%2C+howsoever+her+flesh+be+so+consumed+with+corruption+that+she+cannot+live%2C+but+must+die+of+it%2C+and+that+none+can+touch+her+without+danger+of+being+infected+with+her+sickness%3B+for+she+is+a+harlot+and+a+whore%2C+howsoever+clothed+with+scarlet%3A+we+thank+you+for+your+favor%3B+you+hold+us+in+the+same+category+with+Rome.+If+you+hold+us+a+true+Church+veritate+logica+%5Bby+logical+truth%5D%2C+and+morally%2C+for+a+pure+Church%2C+wherefore+desire+you+a+toleration%3F+Wherefore+will+ye+not+join+with+us+and+communicate+as+brethren+with+us%3F+But+you+add+a+little+after+the+middle+part+of+this+section%2C+that+you+both+did+and+would+hold+a+communion+with+all+those+Churches%2C+as+with+the+Churches+of+Christ.+But+what+communion+is+this+you+hold+with+these%2C+rather+than+with+Papists%2C+Brownists%2C+Anabaptists+in+England+and+the+Lutherans%3F+If+ye+say+in+doctrine%2C+that+union+is+not+external%2C+since%3A+%5B1.%5D+You+testify+it+not+by+your+external+communion+in+the+sacraments+with+us%2C+for+you+will+not+admit+all+those+to+your+communion+that+we+admit+to+ours.+2.+Neither+will+those+%5Bcongregationalists%5D+of+New+England%2C+whom+you+cry+up+and+extol+so+highly%2C+admit+those+of+our+Church+to+their+communion%2C+or+to+be+members+of+their+Churches%2C+unless+of+late+they+have+changed+their+opinion+and+you+and+they+temporize+in+conforming+your+opinions+to+the+times+and+commensurate+them+to+political+aims+for+toleration.+3.+Neither+know+we+whether+they+will+communicate+with+us%3B+at+least+their+writings+and+letters+from+New+England%2C+which+heretofore+we+have+seen%2C+testify+no+such+thing%3B+so+that+in+this+you+dissent+from+them%2C+unless+they+within+this+year+dissent+from+themselves.+%E2%80%A6+But+howsoever+you+pretend+this+real+profession+of+communion+with+us%2C+yet+you+overthrow+it+by+your+restriction+afterwards%2C+viz.+to+such+as+you+know+to+be+godly+that+came+to+visit+you+in+your+exile%2C+but+you+will+not+admit+all+the+members+of+our+Churches%2C+but+such+as+you+only+judge%2C+not+we%2C+to+be+members+of+our+Church.%E2%80%9D%0A%0A%E2%80%94+Adam+Steuart%2C+Some+Observations+%26+Annotations+upon+the+Apologetical+Narration%2C+%5Bof+the+Congregationalists+of+the+Westminster+Assembly%5D%2C+humbly+submitted+to+the+Honorable+Houses+of+Parliament...+%28London%3A+Meredith%2C+1643%29%2C+%E2%80%98Annotations+upon%E2%80%99+Steuart+%281591%E2%80%931654%29+was+a+Scottish+presbyterian+and+professor+of+philosophy.%2C+pp.+17-18&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffe32c49e52.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fe32c49e52.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=You%20%5Bcongregationalists%5D%20acknowledge%20the%20Churches%20under,to%20be%20members%20of%20our%20Church&amp;text=You%20%5Bcongregationalists%5D%20acknowledge%20the%20Churches%20under%20episcopal%20government&amp;text=not%20we%2C%20to%20be%20members%20of%20our%20Church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Observation 4. Our Savior does not command his disciples to separate from commmunion with the Pharisees, and oblige them not hear their doctrine; but only to beware of the errors that they mix with their doctrine. We may, and ought to hold communion with a Church, though erroneous in doctrine, if not fundamentally erroneous. Separation from a Church is not justifiable upon any other ground than that which makes a separation betwixt God and that Church: Which is either the apostasy of that Church into gross idolatry; or in point of doctrine, into damnable heresy.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5163b6d15d" data-kw="">
<blockquote><p>The Christian school is to be favored for two reasons. In the first place, it is important for American liberty; in the second place, it is important for the propagation of the Christian religion. These two reasons are not equally important; indeed, the latter includes the former as it includes every other legitimate human interest. But I want to speak of these two reasons in turn. In the first place, then, the Christian school is important for the maintenance of American liberty. We are witnessing in our day a world-wide attack upon the fundamental principles of civil and religious freedom. In some countries, such as Italy, the attack has been blatant and unashamed; Mussolini despises democracy and does not mind saying so. A similar despotism now prevails in Germany; and in Russia freedom is being crushed out by what is perhaps the most complete and systematic tyranny that the world has every seen. …Another line of attack upon liberty has appeared in the advocacy of a Federal department of education. Repeatedly this vicious proposal has been introduced in Congress. It has been consistently favored by that powerful organization, the National Education Association. Now without being familiar with the internal workings of that Association I venture to doubt whether its unfortunate political activities really represent in any adequate way the rank and file of its members or the rank and file of the public-school teachers of this country. When I appeared at a joint hearing before the Senate Committee on Education and Labor and the House Committee on Education in 1926, Mr. Lowrey of the House Committee asked me how it was that the resolution favoring the Federal department of education was passed unanimously by the National Education Association although he had discovered that many members of that Association were saying that they were opposed to it. Neither Mr. Lowrey nor I seemed to be able to give any very good explanation of this fact. At any rate, I desire to pay the warmest possible tribute to many thousands of conscientious men and women who are teachers in the public schools in this country. I do not believe that in the entire government aspect of education these teachers have any really effective representation. …Thoughtful people, even many who are not Christians, have become impressed with the shortcomings of our secularized schools. We have provided technical education, which may make the youth of our country better able to make use of the advances of natural science; but natural science, with its command over the physical world, is not all that there is in human life. There are also the moral interests of mankind; and without cultivation of these moral interests a technically trained man is only given more power to do harm. By this purely secular, non-moral and non-religious, training we produce not a real human being but a horrible Frankenstein, and we are beginning to shrink back from the product of our own hands. The educational experts, in their conduct of their state-controlled schools, are trying to repair this defect and in doing so are seeking the cooperation of Christian people. I want to show you — and I do not think I shall have much difficulty in showing this particular audience — why such cooperation cannot be given. …So I am opposed to the reading of the Bible in public schools. As for any presentation of general principles of what is called “religion,” supposed to be exemplified in various positive religions, including Christianity, it is quite unnecessary for me to say in this company that such presentation is opposed to the Christian religion at its very heart. The relation between the Christian way of salvation and other ways is not a relation between the adequate and the inadequate or between the perfect and the imperfect, but it is a relation between the true and the false. The minute a professing Christian admits that he can find neutral ground with non-Christians in the study of “religion” in general, he has given up the battle, and has really, if he knows what he is doing, made common cause with that syncretism which is today, as it was in the first century of our era, the deadliest enemy of the Christian Faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Necessity of the Christian School”</cite>, 1933</span></figcaption>

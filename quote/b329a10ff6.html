<main class="wrap"><figure class="quote" id="q-b329a10ff6" data-kw="">
<blockquote><p>Justification therefore is properly a free judicial action of God, whereby He iudges the elect in themselves subject to the accusation and malediction of the Law, to be just by faith, through Christ by imputation of his righteousness, unto the praise of the glory of his grace, and their own salvation. That this definition might be rightly understood, it is needful that the causes, which are orderly noted in the same, be two ways considered, according as justification is taken, either actively, in respect of God, who justifies, or passively in respect of man, who is justified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity</cite>, ch. 9, ‘Of Man’s Justification before God’ in A Brief Institution of the Common Places of Sacred Divinity… (London: Francis Burton, 1610), pp. 222-76 The causes are succinctly stated on pp. 227-38, and then defended afterwards.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf516bf9b6" data-kw="">
<blockquote><p>In the text [of Rom. 3:23-26] we have the eight following things: 1. The persons justified – (i) Sinners; (ii) Such sinners of all sorts that shall believe, whether Jews or Gentiles. 2. The justifier, or efficient cause – God. 3. The impulsive cause – grace. 4. The means effecting, or material cause – the redemption of Christ. 5. The formal cause – the remission of sins. 6. The instrumental cause – faith. 7. The time of declaring – the present time. 8. The end – that God may appear just.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of Justification Open &amp; Applied’, on Rom. 3:23-26 appended to The Gospel Mystery of Sanctification</cite>, … (London: Parkhurst, 1692) 31 pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-b49c3cf9d4" data-kw="">
<blockquote><p>“It is God that justifieth;” and, therefore, the continuation of our justification is his act also. And this, on his part, depends on the immutability of his counsel; the unchangeableness of the everlasting covenant, which is “ordered in all things, and sure;” the faithfulness of his promises; the efficacy of his grace; his complacency in the propitiation of Christ; with the power of his intercession, and the irrevocable grant of the Holy Ghost unto them that do believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-7959f57f7c" data-kw="">
<blockquote><p>Justification is an act. It is not a work, or a series of acts. It is not progressive. The weakest believer and the strongest saint are alike equally justified. Justification admits no degrees. A man is either wholly justified or wholly condemned in the sight of God.</p></blockquote>

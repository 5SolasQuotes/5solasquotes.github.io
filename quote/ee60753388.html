<main class="wrap"><figure class="quote" id="q-ee60753388" data-kw="">
<blockquote><p>Righteousness, which is commonly called ‘Original’, is part of this image, and consists in that rectitude of human nature by which the affections obeyed the will, the will obeyed reason, and reason obeyed God. Since this was implanted in the first man in creation itself, Gen. 1:26-27, 31; 2:25; Eph. 4:24, it is rightly called ‘natural’. Through this man had free will unto good, but mutably. For when God did not preserve him, he could by a fallacious appearance of the object defect unto evil, as the event taught a little later.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c71f52f95" data-kw="">

<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-95e695dad7" data-kw="">
<blockquote><p>§II. In the State of Innocence, man was disposed to the good and to its practice, yet was indeterminate and indifferent to both, with Calvin as author, Institutes, bk. 1, ch. 15, §8, also bk. 2, ch. 3, §10; Spanheim, Syntagma Disputationum, pt. 1, p. 738, th. 7; Maresius, Systema Theologicum, locus 8, th. 50; Lud. Crocius, Syntagma Theologiae, bk. 3, ch. 37, §6; and therefore he was immune from the necessity and servitude of sin and misery; not however from the necessity of dependence [on God]; nor from the necessity of obligation to commit good and omit evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on the Free Will of Man’</cite>, trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), ch. 2, p. 20</span></figcaption>

</figure><figure class="quote" id="q-41388c7879" data-kw="">
<blockquote><p>Man truly begets man, although the soul is created by God, not because he only bestows him a body, nor because he prepares the body for receiving the soul… but because from the man who begets comes the very action by which the rational soul is substantially united to the body, and begins to inform, inhabit, and fill the whole material of the body. Thus in our opinion, the begetting of man is located in that action by which, through prolific virtue, the soul is joined by an essential bond to the body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baron.html">Robert Baron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Exercise, on the Origin of the Soul &amp; the Propagation of Sin</cite>, [Traductionem] of Souls &amp; the Propagation of Sin are Confuted in Philosophy Serving Theology, that is, a Pius &amp; Sober Explication of Philosophical Questions Occurring Occassionally in Theological Disputations (Oxford, 1641) ToC, p. 84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Man truly begets man, although the soul is created by God, not because he only bestows him a body, nor because he prepares the body for receiving the soul… but because from the man who begets comes the very action by which the rational soul is substantially united to the body, and begins to inform, inhabit, and fill the whole material of the body. Thus in our opinion, the begetting of man is located in that action by which, through prolific virtue, the soul is joined by an essential bond to the body.”

— Robert Baron, The Second Exercise, on the Origin of the Soul &amp; the Propagation of Sin, in which the Common View is Explained &amp; Defended, &amp; All the Ways in which Others Explain the Passing Down [Traductionem] of Souls &amp; the Propagation of Sin are Confuted in Philosophy Serving Theology, that is, a Pius &amp; Sober Explication of Philosophical Questions Occurring Occassionally in Theological Disputations (Oxford, 1641) ToC, p. 84">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMan+truly+begets+man%2C+although+the+soul+is+created+by+God%2C+not+because+he+only+bestows+him+a+body%2C+nor+because+he+prepares+the+body+for+receiving+the+soul%E2%80%A6+but+because+from+the+man+who+begets+comes+the+very+action+by+which+the+rational+soul+is+substantially+united+to+the+body%2C+and+begins+to+inform%2C+inhabit%2C+and+fill+the+whole+material+of+the+body.+Thus+in+our+opinion%2C+the+begetting+of+man+is+located+in+that+action+by+which%2C+through+prolific+virtue%2C+the+soul+is+joined+by+an+essential+bond+to+the+body.%E2%80%9D%0A%0A%E2%80%94+Robert+Baron%2C+The+Second+Exercise%2C+on+the+Origin+of+the+Soul+%26+the+Propagation+of+Sin%2C+in+which+the+Common+View+is+Explained+%26+Defended%2C+%26+All+the+Ways+in+which+Others+Explain+the+Passing+Down+%5BTraductionem%5D+of+Souls+%26+the+Propagation+of+Sin+are+Confuted+in+Philosophy+Serving+Theology%2C+that+is%2C+a+Pius+%26+Sober+Explication+of+Philosophical+Questions+Occurring+Occassionally+in+Theological+Disputations+%28Oxford%2C+1641%29+ToC%2C+p.+84&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F41388c7879.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/41388c7879.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-traducianism-creationism/#:~:text=Man%20truly%20begets%20man%2C%20although%20the,an%20essential%20bond%20to%20the%20body&amp;text=Man%20truly%20begets%20man%2C%20although%20the%20soul%20is&amp;text=joined%

</figure><figure class="quote" id="q-ee3d9f351c" data-kw="">
<blockquote><p>In the second place, to supply the defendant his penury, the Rejoynder brings abundance of instances, out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy. But these we absolutely deny to be human inventions. The Rejoinder knew this: and therefore by prevention, replies: to say these are not human inventions, because they partly spring out of natural light, is as much as to say, they are not, because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross, and surplice; the cornered-cap, and tippet; the bishops’ rochet, and coap; with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willful invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time, lay aside right natural invention, and judgement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (1633), p. 495</span></figcaption>

</figure><figure class="quote" id="q-4cb8cffe8a" data-kw="">
<blockquote><p>This argument proves that veneration is not due to the images, as to books of the Trinity, because that the veneration of the image is an honoring of God, there must be a union betwixt the images and God or Christ, betwixt the tree and Christ [in the case of a crucifix]. 1. There is no union-lawful that can be a warrant of honoring anything but a union warranted of God, [to give false examples] betwixt crossing in the air and dedication to Christ’s service, betwixt surplice and pastoral sanctity; There is no union, nor is there a personal union betwixt Christ and the image: Nor 2. a union of parts, as betwixt the shoulders and the head. Nor 3. is there a divine relative union, as betwixt the mean or the end, the servant or the lord: for as John White says well [a puritan, d. 1648], and the Scripture proves, all union betwixt God and the means of worship, which are to be reverenced as means of worship in relation to God, is by divine institution (Mt. 10:14, 42; 2 Cor. 8:4; Gal. 4:14; Acts 10:34; Ps. 119:97, 159, 147, 82, 103, 111, 113, 114, 120, 127, 128, 140, 143, 167, 174); now certainly if by divine ordination there had been a union betwixt the image and God, then had it been lawful to lay the image in the heart, to say: ‘How love I thy image? The painted pictures and wooden portraits of Christ, the wood of the cross are my delight’, ‘I hope in the wood,’ ‘I have taken images for my heritage, they are sweeter to me, nor the honey or the honey comb,’ ‘How pleasant are the wooden feet of these dead and senseless ambassadors of Christ, who bring to my soul news of God, or of my Redeemer Jesus.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Ch. 1, Question 5, Section 3; p. 189</span></figcaption>

</figure><figure class="quote" id="q-c88cb40796" data-kw="">
<blockquote><p>6. Our prayers unto God should be joined with submissiveness of spirit, self-denial and hopeful dependance on God: for so much does the gesture of lifting up of the hands in prayer of its own nature signify, and therefore here the gesture is put for the prayer, which should be joined with such an inward disposition; ‘Let the lifting up of my hands be as evening sacrifice.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the Last Fifty Psalms from Ps. 100 to the End</cite>, (London, 1654), on Ps. 141, verse 2</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d43476860a" data-kw="">
<blockquote><p>All the acts necessary for war-making are, in an eminent manner, ascribed to God, as (1) The Lord fights for his own people. (2) The Lord scattered the enemies. (3) The Lord slew Og, king of Bashan. (4) The battle is the Lord’s. (5) The victory [is] the Lord’s; therefore Israel never fought a battle. So Deut. 32[:10], The Lord alone led his people — the Lord led them in the wilderness — their bow and their sword gave them not the land. God wrought all their works for them (Isa. 26:12), therefore Moses led them not; therefore the people went not on their own legs through the wilderness; therefore the people never shot an arrow, never drew a sword. It follows not. God did all these as the first, eminent, principal and efficacious pre-determinator of the creature (though this Arminian and popish prelate [John Maxwell] mind not so to honour God).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 18</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-58a3697fb1" data-kw="">
<blockquote><p>[Thomas:] ‘God is the first cause moving both natural causes and voluntary causes; and just as by moving natural causes He does not take away the fact that their acts are natural, so by moving voluntary causes He does not take away the fact that their actions are voluntary, but rather brings this about in them — for He operates in each according to its property.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Thomas’s Position, pp. 425-26</span></figcaption>

</figure><figure class="quote" id="q-9b496daf9c" data-kw="Author of sin">
<blockquote><p>Every action, as such, is undoubtedly good, it being an actual exertion of those operative powers given us by God for that very end; God therefore may be the Author of all actions (as He undoubtedly is), and yet not be the Author of evil. … Suppose a boy, who knows not how to write, has his hand guided by his master and nevertheless makes false letters, quite unlike the copy set him, though his preceptor, who guides his hand, is the cause of his writing at all, yet his own ignorance and unskilfulness are the cause of his writing so badly. Just so, God is the supreme Author of our action, abstractedly taken, but our own vitiosity is the cause of our acting amiss.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Absolute Predestination</cite>, tr. Augustus Toplady, on the omnipotence of God</span></figcaption>

</figure><figure class="quote" id="q-90dbf3bc5d" data-kw="">
<blockquote><p>It is asked: Whether because God indeclinably determines the will to one thing, He therefore overturns liberty? The Remonstrants affirm. We deny. 1. Because God infinitely wise and omnipotent does not overturn the nature of second causes, except in the case of the miraculous transmutation of substances; as when He converted water into wine and the staff of Moses into a serpent. But conversion is not such a miraculous transmutation of substances; But of qualities of the same substance remaining in its nature. 2. Because God so moves the free will that it most freely moves itself to the same thing to which it is premoved by God. 3. Because if certain created infallibilizing motives infallibly bend the will, with liberty remaining unharmed, much more can the Creator of wills Himself accomplish this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI by Onku (1639-1642; 1668), ch. 11, On the Mode of Conversion, pp. 303-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-aee029b880" data-kw="Author of sin Free Will">
<blockquote><p>He who uses as an instrument a man freely failing, to effect what is good, is not the author of the failure. … The wicked, while they sin, are not properly instruments of God moved, that is to say, without an internal principle of motion, but metaphorically, moved in such a way that they freely move themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bellarmine Disarmed</cite>, on the Cause of Sin, ch. 2</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b967e823a2" data-kw="">
<blockquote><p>§4. So if a pastor call the assembly at an inconvenient hour, or to an inconvenient place, though it be his sin to do so, yet is it their duty to obey. If in the manner of prayer he (tolerably) miscarry, they may not therefore refuse to join with him. If of two translations of Scripture, or two versions of the Psalms, he use the worser (so it be tolerable), they must obey. §5. Yet if the miscarriage be so great in the ordering even of these circumstances, or in the manner of duties, as shall overthrow the duty itself, and be inconsistent with the ends, or bring greater evils upon the Church than our refusing to obey the pastors (in those cases) can do; then (as I have before showed) we are not bound to follow him in such a case: But otherwise we are. §6… If none shall obey a magistrate or pastor in the works of their own office, as long as they think he did them not the best way, all government then would be presently overthrown, and obedience denied… §7. And the things in which the pastor is now supposed to err, are not of themselves unlawful, but only by such an accident, as being overweighed by another accident, shall cease to make them unlawful. For instance: If the pastor appoint a more imperfect version of the Psalms to be sung in the Church (as is commonly done in England), the obeying of him in the use of this will not bring so much hurt to the Church as the disobeying on that account would do: For besides the sin of disobedience itself, the Church would be in a confusion if they forsake his conduct that preserves the union; and some will be for this and some for that, and so the worship itself will be overthrown. But if the pastor would command a version so corrupt as would overthrow the duty itself, or be as bad as non-performance, the Church is then to seek redress and not obey him. So if he command a time inconvenient, but tolerable (as to meet at sun rising or sun setting) it were better [to] obey than dissolve the Church (if we cannot be otherwise relieved). But if he appoint a time that’s intolerably unfit (as at midnight), I would not obey (except in such necessity as leaves [public worship] to that time or none)… §9. If I be bound to obey a governor if he set me to pick straws, or to hunt a feather, it follows not that he may lawfully command it. I have heard many pleading for ceremonies say that if the magistrate commanded them, and would not otherwise permit them to preach the Gospel, they would preach in a fool’s coat and a fool’s cap with a feather rather than forbear. But I do not think that any of them would justify that ruler that would make such a law that no man should preach or celebrate the sacraments but in a fool’s coat and cap: such might expect to be judged by Christ, as the scorners of Him and his ordinances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London, 1659) | ch. 12, ‘It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded’, pp. 461-63</span></figcaption>

</figure><figure class="quote" id="q-1c585422d6" data-kw="">
<blockquote><p>Some are so proceeded against for not observing of holy days, some for not kneeling at the sacrament of the Lord’s Supper, some for not using the sign of the cross in baptism; and what would become of ministers that should neglect or omit to wear the surplice in sacred administrations is easy to conjecture. But these things are all of them unwritten and unscriptural. Great and many indeed have been the disputes of learned men to prove that although they have no divine institution, nor yet example of apostolical or primitive practise, yet that they may be lawfully used for decency and order in the worship of God. Whether they have evinced what they aimed at is as yet undetermined… they are all granted to be arbitrary inventions of men… For what men think meet to do themselves in the matters of the house of God and his worship, it may be measured and accepted with Him according to their light and design. But for what they impose on others… they ought to have his warrant and authority for.</p></blockquote>

<blockquote><p>…although the name of ‘priests’ belong not to the true ministers of the Gospel, because it has been generally in our language given to the popish sacrificers: and although there be sundry circumstances and ceremonies appointed by the law to be used at their ordination, which I cannot justify, and many of those good orders [are] neglected which the Scripture prescribes in this case: Yet is that office which the laws of our land call the office of the ‘priesthood,’ the very same in substance with the pastor’s office described in the Word: and the manner of outward calling unto that office which the Law allows is the very same in substance with that which is set down in the Word.</p></blockquote>

— Arthur Hildersham, A Treatise of the Ministry of the Church of England, wherein is handled this Question: Whether it be to be separated from, or joined unto. Which is discussed in Two Letters, the one [for joining] written for it [by Hildersham], the other against it [by Francis Johnson] (Low Countries, 1595), section 6, p. 79">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6although+the+name+of+%E2%80%98priests%E2%80%99+belong+not+to+the+true+ministers+of+the+Gospel%2C+because+it+has+been+generally+in+our+language+given+to+the+popish+sacrificers%3A+and+although+there+be+sundry+circumstances+and+ceremonies+appointed+by+the+law+to+be+used+at+their+ordination%2C+which+I+cannot+justify%2C+and+many+of+those+good+orders+%5Bare%5D+neglected+which+the+Scripture+prescribes+in+this+case%3A+Yet+is+that+office+which+the+laws+of+our+land+call+the+office+of+the+%E2%80%98priesthood%2C%E2%80%99+the+very+same+in+substance+with+the+pastor%E2%80%99s+office+described+in+the+Word%3A+and+the+manner+of+outward+calling+unto+that+office+which+the+Law+allows+is+the+very+same+in+substance+with+that+which+is+set+down+in+the+Word.%E2%80%9D%0A%0A%E2%80%94+Arthur+Hildersham%2C+A+Treatise+of+the+Ministry+of+the+Church+of+England%2C+wherein+is+handled+this+Question%3A+Whether+it+be+to+be+separated+from%2C+or+joined+unto.+Which+is+discussed+in+Two+Letters%2C+the+one+%5Bfor+joining%5D+written+for+it+%5Bby+Hildersham%5D%2C+the+other+against+it+%5Bby+Francis+Johnson%5D+%28Low+Countries%2C+1595%29%2C+section+6%2C+p.+79&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9c640a9d24.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9c640a9d24.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=although%20the%20name%20of%20%E2%80%98priests%E2%80%99%20belong,is%20set%20down%20in%20the%20Word&amp;text=although%20the%20name%20of%20%E2%80%98priests%E2%80%99%20belong%2

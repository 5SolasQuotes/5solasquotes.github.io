</figure><figure class="quote" id="q-bb1b33fbe2" data-kw="">
<blockquote><p>The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27).¹ ¹ See ‘On the Ethics of Paying Specific Taxes designated to a Corrupt Purpose or Imposed by a Usurped Authority or Usurper’ and ‘On the Ethics of Paying the Scottish Cess Near &amp; During the Killing Times’ at ‘On Paying Taxes’ (RBO). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged [Scottish ministers] censured the indulged with?² Did Jesus compromise his authority or the exercise of his ministry? ² Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, p. 151 in English Puritans, A Refutation of the Errors of Separatists (1604; 1644; RBO, 2025)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-15dd484b94" data-kw="">
<blockquote><p>54. That the Pope can forbid subjects to keep the oath of fidelity to Christian kings, if they be such as acknowledge not the Roman sea.

55. That the Pope can absolve subjects from the oath of fidelity.

56. That the Pope has power to depose princes.

57. That the subjects of such princes are bound to obey such a sentence, if it be published.

58. That if grave and learned men (such as the Jesuits especially are) shall judge any prince to be a tyrant, it is lawful for their subjects to overthrow them, and if they want [lack] power, to poison them.

59. That the subjects of the most Christian kings, whom they call Lutherans and Sacramentarians, are free from all bonds, and that they may lawfully destroy their kings.

60. That ’tis not lawful for Christians to tolerate a king that is an infidel or a heretic endeavoring to draw men to his sect, but they are bound to depose him.

61. That the ancient Christians did not depose such because they wanted [lacked] power.

62. That the Pope may give the kingdoms and principalities, and lordships of all those whom he judges heretics unto his Roman Catholics, or may adjudge them to those that can lay hold of them.

63. That ’tis not only lawful, but meritorious to kill princes that are excommunicated by the Pope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As quoted in, Richard Baxter, The Safe Religion, or, Three Disputations for the Reformed Catholic Religion against Popery</cite>, (1657), Appendix, ‘A Translation of Bishop Downame’s Catalogue of Popish Errors, Book 3, De Antichristo, ch. 7′, section 21, ‘Of the Law’, p. 543</span></figcaption>

</figure><figure class="quote" id="q-e18ee878f1" data-kw="">
<blockquote><p>…the pope… can excommunicate a ruler and thereby dissolve all obligations his subjects have to support and obey him, thus overthrowing governments at will. Thomas [of Aquinas] wrote: …if someone commits the sin of unbelief he can be deprived of his right to rule by judicial sentence, just as for other failings… Therefore, as soon as someone falls under a sentence of excommunication for apostasy from the faith, his subjects are ipso facto absolved from his rule and from the oath of fealty by which they were bound to him. (Summa Theologiae, ii-ii, Question 12, in Basic Writings of Thomas Aquinas, Anton C. Pegis, editor. New York: Random House, 1945.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robbins.html">John Robbins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Megalomania</cite>, (Trinity Foundation, 1995), pp. 130-31</span></figcaption>

<main class="wrap"><figure class="quote" id="q-355b1f3f17" data-kw="">
<blockquote><p>The earliest discussions upon this subject, in the seventeenth century, were connected with the rise and progress of the Arminian controversy in Holland, and arose out o the interference of the civil authorities in the theological disputes which the views of Arminius and his followers produced –so much so, that it has been said that this might be regarded as a sixth point or article in the Arminian controversy. The Arminians generally adopted Erastian views… The cause of this was partly, no doubt, because they found that, during the earlier stages of the controversy, previous to the calling of the Synod of Dort, the civil authorities generally favored them, and were disposed to promote their views… But their leaning to Erastianism had a deeper foundation than this, in the general character and tendency of their doctrinal views, especially in their latitudinarianism, which implied or produced a want of an adequate sense of responsibility connected with the discovery and the maintenance of all God’s truth; and thus tended to dispose them towards an allowance or toleration of the interference of a foreign and incompetent authority in the decision of religious controversies, and in the regulation of ecclesiastical affairs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-5fd50f4490" data-kw="">
<blockquote><p>But how does this oath, or the act of parliament requiring ministers to take this oath, make ministers dependent on the magistrate in the exercise of their ministry, when the oath only contains the duty of a subject, and speaks nothing either of the ministry or exercise of the ministry? ‘Yea, but the act enjoining it, makes it an essential requisite to a minister of this national Church.’ Answer: There is no such metaphysical term in the act as essential, but only that ministers of this national Church shall take it. The Church is considered not simply as a Church, but as national, having national and legal privileges, which they are deprived of that refuse this oath. It does not say he shall not be a minister if he take it not, but he shall not have the countenance and protection of civil authority, he shall not enjoy his benefice, shall not have allowance form the magistrate for, and encouragement in the exercise of his ministry. He shall not enjoy the peaceable public exercise of his ministry. And what wonder that the magistrate will not countenance them as ministers who will not bind themselves to him as subjects? that he will not let them preach to his subjects if he can hinder them, who will not promise and swear when required that they will not preach treason and rebellion against him, when they should teach them subjection and obedience to Christ? that he will not let them teach others what they call their duty to God who will not do their duty to their sovereign, but separate these things which God has conjoined, ‘Fear God, honor the king’? See more of this in the Seasonable Admonition and Exhortation of the Commission of the General Assembly, anno 1698, which you have neither obeyed neither yet given a reason of your disobedience; and in a Treatise against Separation, by Mr. Alexander Shields, one of your teachers, to whom you became his enemy, because he told you the truth… …But [the magistrate] shows by this act whom he will countenance and protect in the exercise of the ministry, to whom he will give or allow the stipends and legal maintenance to encourage them in the exercise of the ministry, whom he will suffer to pass and repass, and exercise their ministry without hazard or molestation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gavin-hamilton.html">Gavin Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Just Reflections upon a Pamphlet entitled, A Modest Reply to a Letter from a Friend to Mr. John M’millan</cite>, ([Edinburgh] 1712) Hamilton was a Church of Scotland minister., p. 35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-a299d3c350" data-kw="">
<blockquote><p>Conclusion 1: This civil coercive power is not only unnecessary, but unlawful to be exercised in the planting of the Church, and bringing men to the faith of Christ. Churches are not to be planted by weapons, but by doctrines (Lactantius, Institutes, bk. 5, ch. 20); not by the power of the sword, but by the efficacy of the Word; not by carnal weapons, but by spiritual means. The commission that Christ gave his apostles for the spreading and planting of the Gospel was only this, ‘Go and teach all nations, baptizing them in the name of the Father, and of the Son and of the Holy Ghost,’ Mt. 28:19-20, the like, in Mk. 16:15. And Christ tells us his kingdom is not of this world, for then his servants would fight for him, Jn. 18:36, but that was not the way to plant or advance his kingdom. Christ has no need of such carnal weapons for the planting of his Church, or the settling Him in his kingdom: the apostles had a warfare to fight, but the weapons of their warfare were not carnal, but spiritual, and yet strong to pull down the strongest holds of sin and Satan, and to bring every thought in obedience to Christ, 2 Cor. 10:3-4. They had a sword to wield, but that sword was no other but the Word of God, the sword of the Spirit, Eph. 6:17; Rev. 19:15. Here were armies to subdue even nations to Christ, but these were armies of teachers, not of soldiers, as the Psalmist alludes, Ps. 68:11. External force is not the way of Christ for the spreading his Gospel, and planting of his kingdom: It is true here, Religio suaderi potest, cogi non potest, ‘Men may be persuaded into a religion, but they can never be compelled.’ All externall acts of power are not able to beget internal acts of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, (London: Miller, 1646), p. 326</span></figcaption>

— Samuel Bolton, Arraignment of Error (London: Miller, 1646), p. 326">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConclusion+1%3A+This+civil+coercive+power+is+not+only+unnecessary%2C+but+unlawful+to+be+exercised+in+the+planting+of+the+Church%2C+and+bringing+men+to+the+faith+of+Christ.+Churches+are+not+to+be+planted+by+weapons%2C+but+by+doctrines+%28Lactantius%2C+Institutes%2C+bk.+5%2C+ch.+20%29%3B+not+by+the+power+of+the+sword%2C+but+by+the+efficacy+of+the+Word%3B+not+by+carnal+weapons%2C+but+by+spiritual+means.+The+commission+that+Christ+gave+his+apostles+for+the+spreading+and+planting+of+the+Gospel+was+only+this%2C+%E2%80%98Go+and+teach+all+nations%2C+baptizing+them+in+the+name+of+the+Father%2C+and+of+the+Son+and+of+the+Holy+Ghost%2C%E2%80%99+Mt.+28%3A19-20%2C+the+like%2C+in+Mk.+16%3A15.+And+Christ+tells+us+his+kingdom+is+not+of+this+world%2C+for+then+his+servants+would+fight+for+him%2C+Jn.+18%3A36%2C+but+that+was+not+the+way+to+plant+or+advance+his+kingdom.+Christ+has+no+need+of+such+carnal+weapons+for+the+planting+of+his+Church%2C+or+the+settling+Him+in+his+kingdom%3A+the+apostles+had+a+warfare+to+fight%2C+but+the+weapons+of+their+warfare+were+not+carnal%2C+but+spiritual%2C+and+yet+strong+to+pull+down+the+strongest+holds+of+sin+and+Satan%2C+and+to+bring+every+thought+in+obedience+to+Christ%2C+2+Cor.+10%3A3-4.+They+had+a+sword+to+wield%2C+but+that+sword+was+no+other+but+the+Word+of+God%2C+the+sword+of+the+Spirit%2C+Eph.+6%3A17%3B+Rev.+19%3A15.+Here+were+armies+to+subdue+even+nations+to+Christ%2C+but+these+were+armies+of+teachers%2C+not+of+soldiers%2C+as+the+Psalmist+alludes%2C+Ps.+68%3A11.+External+force+is+not+the+way+of+Christ+for+the+spreading+his+Gospel%2C+and+planting+of+his+kingdom%3A+It+is+true+here%2C+Religio+suaderi+potest%2C+cogi+non+potest%2C+%E2%80%98Men+may+be+persuaded+into+a+religion%2C+but+they+can+never+be+compelled.%E2%80%99+All+externall+acts+of+power+are+not+able+to+beget+internal+acts+of+faith.%E2%80%9D%0A%0A%E

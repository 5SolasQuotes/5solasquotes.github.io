<main class="wrap"><figure class="quote" id="q-8c060526c1" data-kw="">
<blockquote><p>It is lawful for all sorts of people to marry, who are able with judgment to give their consent. Yet it is the duty of Christians to marry only in the Lord. And therefore such as profess the true reformed religion should not marry with infidels, papists, or other idolaters: neither should such as are godly be unequally yoked, by marrying with such as are notoriously wicked in their life, or maintain damnable heresies. (Westminster Confession 24.3)

The minutes of the Westminster Assembly give us an interesting glimpse into how this section of the Confession was eventually formulated:

Report was made from the committee of that committed about marriage. …

The Assembly debated the Report of that committed about marriage, and upon debate it was

Resolved upon the Q: The former proposition about consent of parents be waved.

Resolved upon the Q: that mention be made concerning papists and other Idolators.

Resolved upon the Q: that some others besides papists and other Idolators be mentioned.

Resolved upon the Q: such as profess the true Reformed Religion ought not to marry with papists, Infid[e]ls and other Idolators.

Resolved upon the Q: nor ought such as are godly to be unequally yoaked with such as are notoriously wicked in their life.

Resolved upon the Q: ther[e] shall be a further addition.

Resolved upon the Q: These words shall be added, ‘or maintain damnable Heresies’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-minutes-and-papers-of-the-westminster-assembly-1643-1652.html">The Minutes and Papers of the Westminster Assembly 1643-1652</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ed. Chad VanDixhoorn</cite>, (5 vols, Oxford: Oxford University Press, 2012), Session 683, 4 August 1646, 4: 226.</span></figcaption>

asquotes.github.io%2Fquote%2F8c060526c1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8c060526c1.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/08/08/the-minutes-of-the-westminster-assembly-and-marriage/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The laws then which the Church in proper speech is said to make, are decrees concerning outward order and comeliness in the administration of the Word and sacraments, in the meetings of the congregation, etc. and such laws made according to the general rules of God’s Word (which require that all things be done to edification, in comeliness, for the avoiding of offence) are necessary to be observed, and the Word of God binds all men to them so far forth as the keeping of them maintains decent order, and prevents open offence. Yet if a law concerning some external rite or thing indifferent, be at some time upon some occasion omitted no offence given, not contempt showed to ecclesiastical authority, there is no breach made in the conscience: and that appears by the example before handled. The apostles guided by the Holy Ghost made a decree for the avoiding of offence necessary to be observed, namely that the Gentiles should abstain from strangled [animals] and blood and idolythites, and yet Paul out of the case of scandal and contempt, permits the Corinthians to do otherwise, 1 Cor. 8 &amp; 9, which he would not have done, if to do otherwise out of the case of scandal and contempt had been sin</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience</cite>, (1596), pp. 67-68</span></figcaption>

</figure><figure class="quote" id="q-537c63a515" data-kw="">
<blockquote><p>The very ground of this assertion of master [Robert] Bellarmine’s [a Romanist], is that he thinks not the copulation of married folk to be of the substance of matrimony. And this he proves by some testimonies out of the fathers in that fifth chapter. But yet himself will not [have] that this his saying should be so understood as if that he said that the use of marriage is not any way of the substance of marriage. For afterwards he says that this their sacrament may have two respects. As it is made, and as it is continued. As it [is] made, that is, (if I be not deceived) as the mutual consent of parties joines them together by their promises, the consent expressed by such words, is the matter and form of their sacrament. And thus must we understand that common rule in their law, that consent makes marriages. And thus do the fathers understand that which they say concerning the substance of marriage to consist in the mutual consent: partly, because after such consent given, the parties are not free to change the choice which they have made: and partly because that even by God’s law, if parties after such consent given, should carnally know another, it was death for them so to do: which could not be, but because this their consent is after a sort the marriage itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-bunny.html">Francis Bunny</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth &amp; Falsehood</cite>, … (London: Sims, 1595), ch. 19, ‘Of Matrimony, that it is not a Sacrament &amp; that it is Lawful for all’</span></figcaption>

</figure><figure class="quote" id="q-46f0d722fe" data-kw="">
<blockquote><p>Doubtless then, we may in a generality safely conclude that it is altogether unlawful for a child to sleight his parents consent in the choice of his marriage; There may be some particular cases incident wherein perhaps this may without sin or blame be forborn; as when: The child either by general permission, or former elocation shall be out of the parents’ disposing, or where the parent is defective in his intellectuals, or where the child lives in remotis, out of the compass of intelligence; or where the parent being averse from the true religion denies his consent to match with any but those of his own strain; or shall upon other by-occasions willfully stand upon so unreasonable terms that neither friends nor authority can overrule him; But where these or the like preponderating exceptions do not intervene, the child cannot without sin balk the parents’ consent to his choice in marriage.</p></blockquote>

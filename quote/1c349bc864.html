<main class="wrap"><figure class="quote" id="q-1c349bc864" data-kw="">
<blockquote><p>1. There is a subjection in respect of natural being, as the effect to the cause; so, though Adam had never sinned, this morality of the Fifth Command should have stood in vigor, that the son by nature, without any positive law, should have been subject to the father, because from him he has his being, as from a second cause. But I doubt if the relation of a father, as a father, does necessarily infer a royal or kingly authority of the father over the son; or by nature’s law, that the father has a power of life and death over, or above, his children, and the reasons I give are: (1) Because power of life and death is by a positive law, presupposing sin and the fall of man [Gen. 9:5-6]; and if Adam, standing in innocency, could lawfully kill his son, though the son should be a malefactor, without any positive law of God, I much doubt [Gen. 4:14-15]. (2) I judge that the power royal, and the fatherly power of a father over his children, shall be found to be different; and the one is founded on the law of nature, the other, to wit, royal power, on a mere positive law. 2. The degree or order of subjection natural is a subjection in respect of gifts or age. So Aristotle (1 polit., chp. 3) says, “that some are by nature servants.” His meaning is good — that some gifts of nature, as wisdom natural, or aptitude to govern, has made some men of gold, fitter to command, and some of iron and clay, fitter to be servants and slaves… It is possible Plato had a good meaning (Dialogue 3, Of Laws) who made six orders here. “1. That fathers command their sons; 2. The noble the ignoble; 3. The elder the younger; 4. The masters the servants; 5. The stronger the weaker; 6. The wise the ignorant.” Aquinas (22, q. 57, article 3), Driedo (de libert. Christ, bk. 1, p. 8), following Aristotle (polit. bk. 7, ch. 14) hold, though man had never sinned there should have been a sort of dominion of the more gifted and wiser above the less wise and weaker; not antecedent from nature properly, but consequent, for the utility and good of the weaker, in so far as it is good for the weaker to be guided by the stronger, which cannot be denied to have some ground in nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843) | question 13</cite>, p. 50 rt col</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-031e75f6c4" data-kw="">
<blockquote><p>I conceive kings are conceived to have a threefold supreme power: 1. Strictly absolute to do what they please, their will being simply a law. This is tyrannical. Some kings have it, de facto, ex consuetudine [by custom], but by a divine law none have it… 2. There is another power limited to God’s law, the due proper right of kings. (Dt. 17:18-20) 3. There is, a potestas intermedia, a middle power, not so vast as that which is absolute and tyrannical, which yet is some way human. This I take what jurists call jus regium, lex regia, jura regalia regis; Cicero, jura majestatis; Livius, jura imperii, and these royal privileges are such common and high dignities as no one particular magistrate can have [inherently, or to himself alone], seeing they are common to all the kingdom… so the magazine and armory for the safety of the kingdom is in the king’s hand. The king has the like of these privileges, because he is the common, supreme, public officer and minister of God for the good of all the kingdom; and, amongst these royal privileges, I reckon that power that is given to the king, when he is made king, to do many things without warrant of the letter of the law, without the express consent of his council, which he cannot always carry about with him, as the law says. The king shall not raise armies without consent of the parliament; but if an army of Irish, or Danes, or Spaniards, should suddenly land in Scotland, he has a power, without a formally-convened parliament, to command them all to rise in arms against these invaders and defend themselves — this power no inferior magistrate has as he is, but [only] such a magistrate [as the king]. And in many such exigencies, when the necessity of justice or grace requires an ex-temporal [out of the moment] exposition of laws, pro re nata, ‘for present necessary execution’, some say only the emperor, — others, all kings have these pleasures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843), Question 39, ‘Whether or No any Prerogative at All Above the Law be Due to the King, or if Jura Magestatis [the Rights of Majesty] be any Such Prerogative Royal?’</cite>, p. 193</span></figcaption>

<blockquote><p>For the subject of royal power, we affirm, the first and ultimate, and native subject of all power is the community, as reasonable men naturally inclining to a society; but the ethical and political subject, or the legal and positive receptacle of this power is various, according to the various constitutions of the policy. In Scotland and England, it is the three estates of parliament; in other nations, some other judges or peers of the land.</p></blockquote>

<blockquote><p>It is agreed on by all real Christians that man being made an intelligent, free agent, not under bruitish necessitating determination by objects, is governed by God by the moral way of law; that is by the signification of his Ruler’s will, making his duty, and not by mere natural or forcible motion: And it is agreed that God Himself is his only absolute Universal Ruler, and his laws given in nature and by revelation are the only universal laws, which no human power can abrogate or dispense with: And that kings and magistrates are his ministers for men’s good, and have no power but from Him, and none against Him or his laws; and that it is not man but God, by whom we must all be judged to everlasting reward or punishment: And therefore that all men must obey God before men, and must not fear them that can but kill the body, but Him who is able to cast both soul and body into Hell.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It is agreed on by all real Christians that man being made an intelligent, free agent, not under bruitish necessitating determination by objects, is governed by God by the moral way of law; that is by the signification of his Ruler’s will, making his duty, and not by mere natural or forcible motion: And it is agreed that God Himself is his only absolute Universal Ruler, and his laws given in nature and by revelation are the only universal laws, which no human power can abrogate or dispense with: And that kings and magistrates are his ministers for men’s good, and have no power but from Him, and none against Him or his laws; and that it is not man but God, by whom we must all be judged to everlasting reward or punishment: And therefore that all men must obey God before men, and must not fear them that can but kill the body, but Him who is able to cast both soul and body into Hell.”

— Richard Baxter, The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (London: Parkhurst, 1689), Preface">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+agreed+on+by+all+real+Christians+that+man+being+made+an+intelligent%2C+free+agent%2C+not+under+bruitish+necessitating+determination+by+objects%2C+is+governed+by+God+by+the+moral+way+of+law%3B+that+is+by+the+signification+of+his+Ruler%E2%80%99s+will%2C+making+his+duty%2C+and+not+by+mere+natural+or+forcible+motion%3A+And+it+is+agreed+that+God+Himself+is+his+only+absolute+Universal+Ruler%2C+and+his+laws+given+in+nature+and+by+revelation+are+the+only+universal+laws%2C+which+no+human+power+can+abrogate+or+dispense+with%3A+And+that+kings+and+magistrates+are+his+ministers+for+men%E2%80%99s+good%2C+and+have+no+power+but+from+Him%2C+and+none+against+Him+or+his+laws%3B+and+that+it+is+not+man+but+God%2C+by+whom+we+must+all+be+judged+to+everlasting+reward+or+punishment%3A+And+therefore+that+all+men+must+obey+God+before+men%2C+and+must+not+fear+them+that+can+but+kill+the+body%2C+but+Him+who+is+able+to+cast+both+soul+and+body+into+Hell.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+English+Nonconformity+as+under+King+Charles+II+%26+King+James+II+Truly+Stated+%26+Argued+%28London%3A+Parkhurst%2C+1689%29%2C+Preface&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8c322100d5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8c322100d5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/civil-government/#:~:text=It%20is%20agreed%20on%20by%20all,both%20soul%20and%20body%20into%20Hell&amp;text=It%20is%20agreed%20on%20by%20all%20real%20Christians&amp;text=to%20cast%20both%20soul%20and%20body%20into%20Hell" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d2242bf998" data-kw="">
<blockquote><p>The presbyterial government has no such liberty nor arbitrariness as civil or military government has, there being in all civil or temporal affairs a great deal of latitude left to those who manage the same, so that they command nor act against the Word of God. But presbyterial government is tied up to the rules of Scripture in all such particulars as are properly spiritual and proper to the church, though, in other particulars, occasional circumstances of times, places, accommodations and the like, the same light of nature and reason guides both church and state; yet in things properly spiritual and ecclesiastical, there is not near so much latitude left to the presbytery, as there is in civil affairs to the magistrate.</p></blockquote>

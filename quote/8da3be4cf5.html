<main class="wrap"><figure class="quote" id="q-8da3be4cf5" data-kw="">
<blockquote><p>And from hence let us be instructed, upon what sad terms every child of the devil is damned, and such especially as live in places where the Lord Jesus Christ is preached; they will be damned for not receiving Christ, for not opening the door of their hearts, and stretching out their hearts in the desires and pantings after Christ, for not closing with an offered Christ and promise; your damnation will not be (sirs) for not meriting Christ; No, God never required that at your hands. God never required you should earn Him, He requires nothing but that you should receive Him, that you should be willing, and your hearts should be open to let in the Lord Jesus Christ, and that you should hunger and thirst after Him, and close with Him, not pay a penny, only take, and that freely. … Sinners, your damnation is of yourselves: if you will be saved you may. Heaven goes a begging this day, whosoever will let him drink of the water of life freely; it may be some of you have been great sinners, some of you old corrupted sinners: yet if you will, I say, if you will, you may be the Sons of God, heirs, joint heirs with the Lord Jesus Christ. You that are children of wrath, if you will, you may be heirs of grace. Behold Christ stands at the door and knocks: this day He knocks once more; He cries, ‘whosoever will’… Remember (sirs) Jerusalem might have been gathered, even as a hen gathers her chickens under her wings, but she would not; if you will not, Christ has washed his hands of your blood: your damnation is of yourselves. And ah! think, (poor creatures) think what bad terms these are to be damned upon: what a gnawing upon your conscience in Hell another day will it be to think, If I would I might have been saved; Heaven and glory might have been mine if I would, but now I am tormented, and shall be so forever, because I would not have the Lord Jesus Christ; this makes damnation the heavier, to think, there is no more required but only to open the door to receive the Lord Jesus Christ. … Behold! He stands at the door and knocks: He is willing, He is willing, He stands at the door: thy opening is after his knocking; He knocks this day, He calls to thee (Ah Lord! Break open the door that will not open!) thou are prevented with love, He stands at the door, and knocks before thou canst have the least thought of opening; Hark (sinner!) hear Him knocking; ‘Turn, turn, why will ye die O house of Israel?’ Hear Him calling, drunkard, vain person, swearer, Sabbath breaker, turn, open the doors of your hearts.</p></blockquote>

<blockquote><p>Secondly, Those who have not as yet received Christ to dwell in them are to be moved, as they desire Heaven’s glory hereafter and the comfortable hopes of it here upon earth, to give entertainment unto Jesus Chist. Zacchaeus upon a hint given of Christ’s willingness to come into his house, comes down out of the sycamore tree quickly, and receives him joyfully (Lk. 19:4). Now do you with seriousness consider with what 1. importunity, 2. patience, 3. and promises the Lord Jesus calls upon you for entertainment. ‘Behold, I stand at the door and knock, if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ (Rev. 3:20)</p></blockquote>

<blockquote><p>Christ makes the feast, Lk. 15:23, and the angels make the music, verse 7. But if men will not receive the tenders of grace, Christ grieves, Mk. 3:5. He is like a judge that passes the sentence with tears in his eyes, Lk. 19:42, ‘And when He came nigh the city, He wept.’ ‘Ah sinners, I come to save you, but you put away salvation from you (Acts 13). I come with healing under my wings, but you bolt out your Physician; I would have you but open your hearts to receive Me, and I will open Heaven to receive you, but you will rather stay with your sins and die, than come to Me and live, Ps. 81:11, ‘Israel would none of me.’ Well sinners, I will weep at your funerals.’ Oh how lovely is Christ in his disposition! He comes with his supplying oil to pour into sinners’ wounds; He would fain break their hearts with his mercies, He labors to overcome their evil with his good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saint’s Delight</cite>, (London: T.R., 1657), “Christ’s Loveliness”, pp. 353-54</span></figcaption>

</figure><figure class="quote" id="q-6d8c6769f4" data-kw="">
<blockquote><p>Yet it is a good observation of [an]other [Aquinas and Rupertus], that John [the Baptist] is not crier, but the voice of the crier: for it is Christ who cries in preachers; He speaks by the mouth of all his holy prophets: He cries, ‘O ye foolish, how long will ye love foolishness?’ He cries, ‘Repent for the kingdom of God is at hand.’ He cries, ‘Come unto Me all ye that are wearied and laden, and I will refresh you.’ To day then if ye will hear his voice, harden not your hearts, but suffer the words of exhortation and doctrine: be moved at his cry, lest He despise your call. As He says in the first of the Proverbs (v. 23): Because I have called, and ye have refused, I have stretched out mine hand, and none would regard: therefore they shall call upon Me, but I will not answer: they shall seek Me early, but they shall not find Me. Think on this all ye that forget God, ye that suffer Christ to stand and knock, and cry at the door of your hearts, and yet you will not let Him in.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-boys.html">John Boys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Dominical</cite>, [Lordly] Epistles &amp; Gospels used in our English Liturgy... (d. 1625; 1638) | 4th Sunday in Advent, p. 109</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Yet it is a good observation of [an]other [Aquinas and Rupertus], that John [the Baptist] is not crier, but the voice of the crier: for it is Christ who cries in preachers; He speaks by the mouth of all his holy prophets: He cries, ‘O ye foolish, how long will ye love foolishness?’ He cries, ‘Repent for the kingdom of God is at hand.’ He cries, ‘Come unto Me all ye that are wearied and laden, and I will refresh you.’ To day then if ye will hear his voice, harden not your hearts, but suffer the words of exhortation and doctrine: be moved at his cry, lest He despise your call. As He says in the first of the Proverbs (v. 23): Because I have called, and ye have refused, I have stretched out mine hand, and none would regard: therefore they shall call upon Me, but I will not answer: they shall seek Me early, but they shall not find Me. Think on this all ye that forget God, ye that suffer Christ to stand and knock, and cry at the door of your hearts, and yet you will not let Him in.”

%20in" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>9. There must be a satisfaction with the terms of the gospel, and the heart must actually close with Christ, as He is offered in the gospel. The heart must open to Him, and take Him in, Rev. 3:20. The soul must embrace and receive Him, John 1:12. The man must take Him, as his Lord and Master King, Priest and Prophet; must give up himself to Him as his Leader and Commander, and resolve to follow Him in all things, and thus close a bargain with Him. … 8. That, as to them, all Christ’s entreaties, motives, allurements, patience and long suffering, his standing at the door and knocking, till his locks be wet with the dew, etc., are in vain: yea, they are contemptuously rejected, despised, slighted, and undervalued.</p></blockquote>

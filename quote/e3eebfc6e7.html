<main class="wrap"><figure class="quote" id="q-e3eebfc6e7" data-kw="">
<blockquote><p>He mentions also as another qualification, that he shunned the wicked in such a manner as not on that account to forsake the congregation of God, or withdraw himself from the company of those with whom he was commanded by divine appointment to associate. Many err in this way grievously; imagining when they see the evil mingled with the good, that they will be infected with pollution, unless they immediately withdraw themselves from the whole congregation. This preciseness drove the Donatists of old, and prior to them the Cathari and the Novatians, into mischievous schisms.

In our own times, too, the Anabaptists, from a similar conceit, have separated themselves from the sacred assemblies, because they reckoned them not so free from all defilement as could have been wished. Moreover, the Donatists made themselves a laughing-stock in a certain process, by tenaciously clinging to mere words. When an assembly was held to settle dissensions, and they were invited by the president of the meeting, with a view to do honour to them, to take a seat, they replied, they would stand, because it was not lawful to “sit with the wicked.” Why then, wittily replied Augustine, did your conscience permit you to come in amongst us? for the one is written as well as the other, I will not go in to the wicked, neither will I sit with the ungodly.

David, therefore, prudently moderates his zeal, and while separating himself from the ungodly, ceases not to frequent the temple, as the divine commandment and the order prescribed in the law required. When he denominates them the assembly of the ungodly, we may unquestionably conclude, that their number was not few; nay, it is probable that they flaunted about at that time, as if they alone were exalted above the people of God, and were lords over them: yet this did not prevent David from coming as usual to the sacrifices.

Public care, indeed, is to be used that the Church be not defiled by such wickedness, and every man ought privately to endeavour, in his own place, that his remissness and forbearance do not cherish the disorders which these vices occasion. Although, however, this strictness should not be exercised with that care which is necessary, there is nothing in this to hinder any of the faithful from piously and holily remaining in the fellowship of the Church. It is to be observed, in the meantime, that what retained David, was his communion with God and with sacred things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of Psalms</cite>, (1557), trans. James Anderson in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 4b: 442-43.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-badc6b380d" data-kw="">
<blockquote><p>Take heed of pretending to greater purity and strictness about Church communion and administrations than the Word of God commends, or the examples of Christ and the apostles and the primitive Church do commend; nor be so extremely rigid as not to bear with things that they have tolerated. It is an observable rule laid down by wise and eminent divines that too much strictness and severity often does injury the Church more than profit it; it’s the way to overturn churches, not to reform them; especially this severity is unbecoming private Christians, who having no authority, yet complain such persons and such things are defilements: they must separate from them, they must not touch the unclean thing: such should take heed that they be not ‘righteous over-much,’ and not dare to be wise above what is written, lest their too much affected purity and misguided zeal hurt more the Church of Christ, and their own souls than the corruptions they so much complain of. Calvin adv. Anab., Art. 2. ‘Cum sub specie studii perfectionis imperfectionem nulam tollerare possumus; tune Diabolum nos tumefacere superbia, et hypocrisi seducere moneamur.&#x27;</p></blockquote>

<blockquote><p>Mr. Robert Hamilton [1650–1701] was a gentleman of good family, being brother to Sir William Hamilton of Preston, to whose title and estates he would have succeeded, on his death, at the [Glorious] Revolution [1689], if he had not refused to own, or rather had not openly disowned, the authority of [King] William and Mary [of Orange]. He appears to have been a pious man and of good intentions, but of narrow views, severe in his temper, and altogether unqualified, by want of military talents and experience, for the command which he assumed, or which was conferred on him by the small body which proved successful in the skirmish at Drumclog [1679]. He is charged, and apparently not without reason, with having been active in pushing [Donald] Cargill, [Richard] Cameron, and some other ministers, to those extremes which produced a breach between them and their brethren, with whom they had until of late acted in concert. This dissension was a main cause of the failure of the present attempt to redress national grievances. Hamilton and his party acted on the principle, that it was unlawful to associate, for vindicating their civil and religious rights, with any but those with whom they could join in church-communion; or, which amounts to the same thing, that it behoved them to introduce into the state of their quarrel, as appearing in arms, a condemnation of every thing in relation to the public interests of religion which was sinful or unscriptural;¹ a principle which, while it involved them in that very confounding of civil and ecclesiastical matters against which they inveighed so loudly under the name of Erastianism, tended to rivet the chains of servitude on themselves and the nation. ¹ [See ‘Not All Truths must be Preached in All Circumstances’ at ‘Pastors’ (RBO)] Into this error they appear to have been betrayed partly by mistaken notions of the controversy which had formerly arisen respecting the Public Resolutions [in the late-1640’s and early-1650’s].² What the more honest party at that period opposed was, the admitting to places of power and trust of such as had shown by their previous conduct that they were enemies to the reformation introduced into church and state, and would use the power intrusted to them to overturn it. ² [See ‘The Scottish Resolutioner-Protester Controversy, 1650’s’ (RBO)] This could not be said of those who had accepted of or acquiesced in the Indulgence,³ and still less of those whom Hamilton’s friends wrangled with so fiercely, who protested solemnly that they disapproved of the Indulgence, and whose former conduct vouched for the sincerity of their protestations. ³ [See the ‘Intro’ at ‘Defenses of Scottish Covenanting &amp; the Indulgence &amp; Occasional Hearing Controversies, 1661-1688’ (RBO)] Another remark is suggested by the facts here referred to. If ministers of the gospel would preserve their usefulness and respectability, they must guard their independence on the side of the people as well as of civil rulers. Provided they become “the servants of men,” it matters not much whether their masters wear a crown or a bonnet; and if, instead of going before the people to point out to them the path of duty, and checking them when they are ready to run into extremes, they wait to receive directions from them, and suffer themselves to be borne along by the popular stream, the consequences cannot fail to be fatal to both. Firm and tenacious of his purpose, the servant of the Lord, while gentle to all, ought to hold on the even tenor of his way, unmoved equally by the frown of the tyrant, the cry of the multitude, and the dictates of forward individuals, good and well-meaning men it may be, but who ” cannot see afar off,” and just need the more to be led that they think themselves capable of being leaders. An opposite conduct on the part of two or three ministers tended to foster those extravagant opinions and practices adopted by some presbyterians at this period, which discredited the cause for which they appeared, and which their best friends, though they may excuse, will not be able to defend, and should not seek to vindicate.</p></blockquote>

s at this period, which discredited the cause for which they appeared, and which their best friends, though they may excuse, will not be able to defend, and should not seek to vindicate.”

— Thomas M’Crie Sr., Memoirs of Mr. William Veitch, and George Brysson, Written by Themselves, ed. Thomas M’Crie (Edinburgh: William Blackwood, 1825), “Biographical Notices of James Ure of Shargarton”, pp. 452-54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMr.+Robert+Hamilton+%5B1650%E2%80%931701%5D+was+a+gentleman+of+good+family%2C+being+brother+to+Sir+William+Hamilton+of+Preston%2C+to+whose+title+and+estates+he+would+have+succeeded%2C+on+his+death%2C+at+the+%5BGlorious%5D+Revolution+%5B1689%5D%2C+if+he+had+not+refused+to+own%2C+or+rather+had+not+openly+disowned%2C+the+authority+of+%5BKing%5D+William+and+Mary+%5Bof+Orange%5D.+He+appears+to+have+been+a+pious+man+and+of+good+intentions%2C+but+of+narrow+views%2C+severe+in+his+temper%2C+and+altogether+unqualified%2C+by+want+of+military+talents+and+experience%2C+for+the+command+which+he+assumed%2C+or+which+was+conferred+on+him+by+the+small+body+which+proved+successful+in+the+skirmish+at+Drumclog+%5B1679%5D.+He+is+charged%2C+and+apparently+not+without+reason%2C+with+having+been+active+in+pushing+%5BDonald%5D+Cargill%2C+%5BRichard%5D+Cameron%2C+and+some+other+ministers%2C+to+those+extremes+which+produced+a+breach+between+them+and+their+brethren%2C+with+whom+they+had+until+of+late+acted+in+concert.+This+dissension+was+a+main+cause+of+the+failure+of+the+present+attempt+to+redress+national+grievances.+Hamilton+and+his+party+acted+on+the+principle%2C+that+it+was+unlawful+to+associate%2C+for+vindicating+their+civil+and+religious+rights%2C+with+any+but+those+with+whom+they+could+join+in+church-communion%3B+or%2C+which+amounts+to+the+same+thing%2C+that+it+behoved+them+to+introduce+into+the+state+of+their+quarrel%2C+as+appearing+in+arms%2C+a+condemnation+of+every+thing+in+relation+to+the+public+interests+of+religion+which+was+sinful+or+unscriptural%3B%C2%B9+a+principle+which%2C+while+it+involved+them+in+that+very+confounding+of+civil+and+ecclesiastical+matters+against+which+they+inveighed+so+loudly+under+the+name+of+Erastianism%2C+tended+to+rivet+the+chains+of+servitude+on+themselves+and+the+nation.+%C2%B9+%5BSee+%E2%80%98Not+All+Truths+must+be+Preached+in+All+Circumstances%E2%80%99+at+%E2%80%98Pastors%E2%80%99+%28RBO%29%5D+Into+this+error+they+appear+to+have+been+betrayed+partly+by+mistaken+notions+of+the+controversy+which+had+formerly+arisen+respecting+the+Public+Resolutions+%5Bin+the+late-1640%E2%80%99s+and+early-1650%E2%80%99s%5D.%C2%B2+What+the+more+honest+party+at+that+period+opposed+was%2C+the+admitting+to+places+of+power+and+trust+of+such+as+had+shown+by+their+previous+conduct+that+they+were+enemies+to+the+reformation+introduced+into+church+and+state%2C+and+would+use+the+power+intrusted+to+them+to+overturn+it.+%C2%B2+%5BSee+%E2%80%98The+Scottish+Resolutioner-Protester+Controversy%2C+1650%E2%80%99s%E2%80%99+%28RBO%29%5D+This+could+not+be+said+of+those+who+had+accepted+of+or+acquiesced+in+the+Indulgence%2C%C2%B3+and+still+less+of+those+whom+Hamilton%E2%80%99s+friends+wrangled+with+so+fiercely%2C+who+protested+solemnly+that+they+disapproved+of+the+Indulgence%2C+and+whose+former+conduct+vouched+for+the+sincerity+of+their+protestations.+%C2%B3+%5BSee+the+%E2%80%98Intro%E2%80%99+at+%E2%80%98Defenses+of+Scottish+Covenanting+%26+the+Indulgence+%26+Occasional+Hearing+Controversies%2C+1661-1688%E2%80%99+%28RBO%29%5D+Another+remark+is+suggested+by+the+facts+here+referred+to.+If+ministers+of+the+gospel+would+preserve+their+usefulness+and+respectability%2C+they+must+guard+their+independence+on+the+side+of+the+people+as+well+as+of+civil+rulers.+Provided+they+become+%E2%80%9Cthe+servants+of+men%2C%E2%80%9D+it+matters+not+much+whether+their+masters+wear+a+crown+or+a+bonnet%3B+and+if%2C+instead+of+going+before+the+people+to+point+out+to+them+the+path+of+duty%2C+and+checking+them+when+they+are+ready+to+run+into+extremes%2C+they+wait+to+receive+directions+from+them%2C+and+suffer+themselves+to+be+borne+along+by+the+popular+stream%2C+the+consequences+cannot+fail+to+be+fatal+to+both.+Firm+and+tenacious+of+his+purpose%2C+the+servant+of+the+Lord%2C+while+gentle+to+all%2C+ought+to+hold+on+the+even+tenor+of+his+way%2C+unmoved+equally+by+the+frown+of+the+tyrant%2C+the+cry+of+the+multitude%2C+and+the+dictates+of+forward+individuals%2C+good+and+well-meaning+men+it+may+be%2C+but+who+%E2%80%9D+cannot+see+afar+off%2C%E2%80%9D+and+just+need+the+more+to+be+led+that+they+think+themselves+capable+of+being+leaders.+An+opposite+conduct+on+the+part+of+two+or+three+ministers+tended+to+foster+those+extravagant+opinions+and+practices+adopted+by+some+presbyterians+at+this+period%2C+which+discredited+the+cause+for+which+they+appeared%2C+and+which+their+best+friends%2C+though+they+may+excuse%2C+will+not+be+able+to+defend%2C+and+should+not+seek+to+vindicate.%E2%80%9D%0A%0A%E2%80%94+Thomas+M%E2%80%99Crie+Sr.%2C+Memoirs+of+Mr.+William+Veitch%2C+and+George+Brysson%2C+Written+by+Themselves%2C+ed.+Thomas+M%E2%80%99Crie+%28Edinburgh%3A+William+Blackwood%2C+1825%29%2C+%E2%80%9CBiographical+Notices+of+James+Ure+of+Shargarton%E2%80%9D%2C+pp.+452-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F32fce1c9ef.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/32fce1c9ef.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=Mr.%20Robert%20Hamilton%20%5B1650%E2%80%931701%5D%20was%20a,and%20should%20not%20seek%20to%20vindicate&amp;text=Mr.%20Robert%20Hamilton%20%5B1650%E2%80%931701%5D%20was%20a%20gentleman%20of&amp;text=to%20defend%2C%20and%20should%20not%20seek%20to%20vindicate" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

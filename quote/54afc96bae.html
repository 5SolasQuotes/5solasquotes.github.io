<blockquote><p>The Lord our God is but one God. In which Indivisible Unity notwithstanding, we adore the Father, as being altogether of himself;[1] we glorify that Consubstantial Word which is the Son; we bless and magnify that Co-essential Spirit eternally proceeding from both, which is the Holy Ghost. Seeing therefore the Father is of none, the Son is of the Father, and the Spirit is of both, they are by these their several Properties really distinguishable each from other. For the Substance of God, with this property to be of none, doth make the Person of the Father; the very self-same Substance in number with this property to be of the Father, maketh the Person of the Son; the same Substance having added unto it, the property of proceeding from the other two, maketh the Person of the Holy Ghost. So that in every Person, there is implied both the Substance of God, which is one; and also, that property which causeth the same Person really and truly to differ from the other two.

Every Person hath his own subsistence, which no other besides hath, although there be others besides that are of the same Substance. As no man but Peter can be the person which Peter is, yet Paul hath the self-same Nature which Peter hath. Again, Angels have every of them the Nature of pure and Invisible Spirits, but every Angel, is not that Angel which appeared in a Dream to Joseph. Now when God became Man, lest we should err in applying this to the Person of the Father, or of the Spirit, St. Peter’s confession unto Christ was, Thou art the Son of the Living God; and St. John’s Exposition thereof was made plain, That it is the Word which was made Flesh. The Father, and the Holy Ghost (saith Damascen [John of Damascus]) have no Communion with the Incarnation of the Word, otherwise then only by approbation and assent.

Notwithstanding, for as much as the Word and Deity are one Subject, we must beware we exclude not the Nature of God from Incarnation, and so make the Son of God incarnate, not to be very God. For undoubtedly, even the Nature of God it self, in the only Person of the Son, is incarnate, and hath taken to it self Flesh. Wherefore, Incarnation may neither be granted to any Person, but only One, nor yet denied to that Nature which is common unto all Three. Concerning the cause of which incomprehensible Mystery, for as much as it seemeth a thing unconsonant, That the World should honour any other as the Saviour, but him whom it honoureth as the Creator of the World, and in the Wisdom of God, it hath not been thought convenient to admit any way of saving man, but by man himself, though nothing should be spoken of the Love and Mercy of God towards Man; which this way are become such a Spectacle, as neither Men nor Angels can behold without a kind of Heavenly astonishment, we may hereby perceive there is cause sufficient, why Divine Nature should assume Human, that so God might be in Christ, reconciling to himself the World.

And if some cause be likewise required, why rather to this end and purpose the Son, then either the Father, or the Holy Ghost, should be made man, Could we which are born the children of wrath, be adopted the Sons of God, through Grace, any other then by the Natural Son of God, being Mediator between God and us? It became therefore him, by whom all things are to be the Way of Salvation to all, that the Institution and Restitution of the World might be both wrought by one hand. The World’s Salvation was without the Incarnation of the Son of God, a thing impossible; not simply impossible, but impossible, it being presupposed, That the Will of God, was no otherwise to have it saved, then by the Death of his own Son.

Wherefore taking to himself our Flesh, and by his Incarnation, making it his own Flesh, he had now of his own, although from us, what to offer unto God for us. And as Christ took Manhood, that by it he might be capable of death, whereunto he humbled himself; so because Manhood is the proper subject of compassion and feeling pity, which maketh the Sceptre of Christ’s Regency even in the Kingdom of Heaven be amiable; he which without our Nature could not on Earth suffer for the sins of the World, doth now also by means thereof, both make intercession to God for sinners, and exercise dominion over all men with a true, a natural, and a sensible touch of Mercy.</p></blockquote>

<blockquote><p>Arminians may talk of the power of their own will, as they have a mind, to convert themselves; the Scriptures of truth inform us, that the power of a whole Trinity is employed in the work of a sinner’s conversion. The power of the Father is put forth in it, as Christ declares, John vi. 44, “No man can come to me, except the Father which hath sent me draw him.” The power of the eternal Son is exerted, John xii. 32, “And I, if I be lifted up from the earth, will draw all men unto me.”

The power of the Father and the Son is exerted by the Holy Ghost, the third Person of the Trinity. Hence, Tit. iii. 5, we are said to be “saved by the washing of regeneration, and the renewing of the Holy Ghost.” So that Arminians, who talk of the power of their own will to convert, believe, to repent, &amp;c., they invade the prerogative of a whole Trinity, and contradict the record or of him that runneth, but of God that sheweth mercy;” and that “it is God which worketh in us, both to will and to do, of his own good pleasure.” So that it is a divine power.</p></blockquote>

<blockquote><p>Which action of God [i.e. Creation], since it is voluntary, Rev. 4:11, is not proper to one person, but common to three, Gen. 1:26; Ps. 33:6; and therefore is attributed to the Father, Acts 4:24, to the Son, Jn. 1:3 &amp; 10, Col. 1:16; Heb. 1:2 &amp; 10, and to the Holy Spirit, Job 26:13; Ps. 95:5 with Heb. 3:7 &amp; 9, yet with a preserved order of acting: but more frequently to the Father, by a certain excellence; not indeed of nature or action, but of personal order: because the Father is the first person in order, from whom the other two have the origin of their person from eternity; and therefore creation, and similar divine actions, are usually referred to the Father as to the first person.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Which action of God [i.e. Creation], since it is voluntary, Rev. 4:11, is not proper to one person, but common to three, Gen. 1:26; Ps. 33:6; and therefore is attributed to the Father, Acts 4:24, to the Son, Jn. 1:3 &amp; 10, Col. 1:16; Heb. 1:2 &amp; 10, and to the Holy Spirit, Job 26:13; Ps. 95:5 with Heb. 3:7 &amp; 9, yet with a preserved order of acting: but more frequently to the Father, by a certain excellence; not indeed of nature or action, but of personal order: because the Father is the first person in order, from whom the other two have the origin of their person from eternity; and therefore creation, and similar divine actions, are usually referred to the Father as to the first person.”

</figure><figure class="quote" id="q-67d7d97470" data-kw="">
<blockquote><p>It is the special office of the Spirit to convince the world of sin; to reveal Christ, to regenerate the soul, to lead men to the exercise of faith and repentance; to dwell in those whom He thus renews, as a principle of a new and divine life. By this indwelling of the Spirit, believers are united to Christ, and to one another, so that they form one body. This is the foundation of the communion of saints, making them one in faith, one in love, one in their inward life, and one in their hopes and final destiny.</p></blockquote>

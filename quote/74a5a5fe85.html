<blockquote><p>The recognition of this matter is twofold, one true and certain, by divine revelation given to the Prophets, as often was done in the beginning of the Apostolic Church, as it is evident from Acts; 1 Cor. 12; 1 Tim. 1:20; 2 Tim. 4:14, 15; the other likely and uncertain, through human experience, by a diligent observation of the words and deeds of the impious against Christ (Gomar), when the desperate impiety of some most clearly appears, etc. (Calvin), as formerly it was judged that the Emperor Julian† had sinned, etc. (Gomar). † The Emperor Julian reigned from 361 to 363. Although trained up in the Christian religion, he apostatized from the faith, and endeavored, if unsuccessfully, to restore Rome to its ancient paganism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Synopsis of Interpreters, both Critical &amp; Otherwise, of the Sacred Scripture in The Exegetical Labors of the Reverend Matthew Poole</cite>, vol. 79, 1, 2, and 3 John, Jude (VA: Master Poole Publishing, 2013), on 1 Jn. 5:16, pp. 173-74</span></figcaption>

l="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3c8c15e343" data-kw="wages curse">
<blockquote><p>The reasons are: (1) “The wages of sin is death” (Rom. 6:23) and “the soul that sinneth, it shall die” (Ezk. 18:20). These deal not with any sin in particular, but with sin in general. Thus either venial sin is not sin or it deserves death and so is not venial. Second, the terrible formula of the law proves this: “Cursed be he that confirmeth not all the words of this law to do them” (Dt. 27:26; Gal. 3:10). If every deviation from the law deserves a curse and every sin is illegality, no sin can be granted (even the smallest) which does not bring upon it the curse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.4.7-8</span></figcaption>

</figure><figure class="quote" id="q-bc42a56fe4" data-kw="">
<blockquote><p>John: Verse 16, If a man see his brother sin a sin that is not unto death (that is, which may be pardoned), let him ask (pardon in his behalf) and he shall give him life for them that sin not unto death: There is a sin unto death (after which, necessarily damnation follows, as the sin against the Holy Ghost): I say not that thou shouldest pray for it. Church: But is not every sin, a sin to death? John: 17. All unrighteousness is sin (and therefore deserves death), but there is a sin not unto death (namely that which is pardoned in Christ).</p></blockquote>

</figure><figure class="quote" id="q-ca7db8ecf7" data-kw="">
<blockquote><p>But here arises a doubt: Are we not to pray for wicked men, yea, the impenitent, the persecutors of the Church, contemners of the Word? I answer: 1. Yea, partly because we know not the secret purposes of God’s grace. Christ in the light of his divinity, knew the elect and the reprobate, but we know not, therefore we are to pray for them that persecute, Mt. 5:44. Paul once breathed out threatenings against the Church; Christ received gifts for the rebellious; partly because many wicked men are considerable in their station, therefore, at least, we pray for temporal blessings for them, though we have little hopes that ever they shall be gained to the knowledge of the truth. Thus we are to pray for wicked rulers, for the conservation of human society, they may serve as a thorn hedge about a garden of roses. Thus it is said, Ezra 6:10, that in the Temple they should pray for the life of the king and of his sons, meaning the King of Babylon, Darius, at least for temporal favors. 2. We have not such encouragement to pray for them as for the saints: For the saints we pray out of the unity of the Spirit, for wicked men, out of common charity: for the saints we pray out of a delight in their graces; for wicked men, out of a loose possible hope. Heb. 13:18, ‘Pray for us, for we trust that we have a good conscience in all things, willing to live honestly.’ These should have the greatest share of our prayers; we have the more encouragements and hopes of them, which should be an engagement to us to pray for them. 3. Conditionally we may pray against the obstinate and them that sin of malicious wickedness. There are many imprecations in Ps. 109 which are not to serve our private revenge, but by us to be conceived conditionally: Those curses are uttered against Judas in a prophetical spirit, and therefore not to be drawn into example, to justify any heats of revenge and private passion. 1 Jn. 5:16: ‘If any man see his brother sin a sin which is not unto death, he shall ask, and he shall give him life for them that sin not unto death. There is a sin unto death; I do not say that he shall pray for it.’ It is a tempting of God to intercede for that sin, seeing He has declared his will; the irremissible sin, is that sin, though it be hard to be found out. Therefore it is good to keep to the conditional form when a man, after the profession of religion, falls to an utter revolt and deadly hatred of it: it is a shrewd presumption they have committed that sin. 4. We feel sometimes a restraint upon our prayers. God by oracle forbade the prophet to pray for the people; Jer. 7:16: ‘Therefore pray not thou for this people, neither lift up cry nor prayer for them, neither make intercession to Me, for I will not hear thee.’ When He was resolved to put his wrath in execution, He would not have his people’s prayers lost; and still the same Spirit that stirs up to prayer searches out the deep counsels of God. So that there is a kind of prophetical light in prayers; God [at times] suspends the servency and actual assistance, by which we are carried on at other times. I would not justify every private passionate conceit, but yet we must look upon the Spirit of God as the interpreter of God’s counsel, and that He will not stir up prayers to no purpose. Yea, sometimes we feel that after much striving, we have no heart to pray for them, which is a very great mark of God’s displeasure upon any person, when God’s people, yea, even after much struggling with themselves, have no heart to pray for him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton in two parts: the first containing 27 Sermons on the Twenty-Fifth chapter of St. Matthew</cite>, … (d. 1677; London: Astwood, 1684), Sermons on John 17, Sermon 12, on Jn. 17:9, p. 106-7</span></figcaption>

e+our+private+revenge%2C+but+by+us+to+be+conceived+conditionally%3A+Those+curses+are+uttered+against+Judas+in+a+prophetical+spirit%2C+and+therefore+not+to+be+drawn+into+example%2C+to+justify+any+heats+of+revenge+and+private+passion.+1+Jn.+5%3A16%3A+%E2%80%98If+any+man+see+his+brother+sin+a+sin+which+is+not+unto+death%2C+he+shall+ask%2C+and+he+shall+give+him+life+for+them+that+sin+not+unto+death.+There+is+a+sin+unto+death%3B+I+do+not+say+that+he+shall+pray+for+it.%E2%80%99+It+is+a+tempting+of+God+to+intercede+for+that+sin%2C+seeing+He+has+declared+his+will%3B+the+irremissible+sin%2C+is+that+sin%2C+though+it+be+hard+to+be+found+out.+Therefore+it+is+good+to+keep+to+the+conditional+form+when+a+man%2C+after+the+profession+of+religion%2C+falls+to+an+utter+revolt+and+deadly+hatred+of+it%3A+it+is+a+shrewd+presumption+they+have+committed+that+sin.+4.+We+feel+sometimes+a+restraint+upon+our+prayers.+God+by+oracle+forbade+the+prophet+to+pray+for+the+people%3B+Jer.+7%3A16%3A+%E2%80%98Therefore+pray+not+thou+for+this+people%2C+neither+lift+up+cry+nor+prayer+for+them%2C+neither+make+intercession+to+Me%2C+for+I+will+not+hear+thee.%E2%80%99+When+He+was+resolved+to+put+his+wrath+in+execution%2C+He+would+not+have+his+people%E2%80%99s+prayers+lost%3B+and+still+the+same+Spirit+that+stirs+up+to+prayer+searches+out+the+deep+counsels+of+God.+So+that+there+is+a+kind+of+prophetical+light+in+prayers%3B+God+%5Bat+times%5D+suspends+the+servency+and+actual+assistance%2C+by+which+we+are+carried+on+at+other+times.+I+would+not+justify+every+private+passionate+conceit%2C+but+yet+we+must+look+upon+the+Spirit+of+God+as+the+interpreter+of+God%E2%80%99s+counsel%2C+and+that+He+will+not+stir+up+prayers+to+no+purpose.+Yea%2C+sometimes+we+feel+that+after+much+striving%2C+we+have+no+heart+to+pray+for+them%2C+which+is+a+very+great+mark+of+God%E2%80%99s+displeasure+upon+any+person%2C+when+God%E2%80%99s+people%2C+yea%2C+even+after+much+struggling+with+themselves%2C+have+no+heart+to+pray+for+him.%E2%80%9D%0A%0A% <blockquote><p>‘There is a sin unto death;’ which is not only deserving of death, as every other sin is, but which certainly and inevitably issues in death in all that commit it, without exception; and that is the sin against the Holy Ghost, which is neither forgiven in this world nor in that to come, and therefore must be unto death; it is a sinning wilfully, not in a practical, but doctrinal way, after a man has received the knowledge of the truth; it is a wilful denial of the truth of the Gospel, particularly that peace, pardon, righteousness, eternal life, and salvation, are by Jesus Christ, contrary to the light of his mind, and this joined with malice and obstinacy; so that there is no more or other sacrifice for such a sin; there is nothing but a fearful looking for of wrath and fury to fall on such opposers of the way of life; and as the presumptuous sinners under Moses’s law died without mercy, so must these despiteful ones under the Gospel; see Mt. 12:31. Some think there is an allusion to one of the kinds of excommunication among the Jews, called “shammatha”, the etymology of which, according to some Jewish writers, is שם מיתה, “there is death”. ‘I do not say that he shall pray for it;’ the apostle does not expressly forbid to pray for the forgiveness of this sin, yet what he says amounts unto it; he gives no encouragement to it, or any hopes of succeeding, but rather the reverse; and indeed where this sin is known, or can be known, it is not to be prayed for, because it is irremissible; but as it is a most difficult point to know when a man has sinned it, the apostle expresses himself with great caution.</p></blockquote>

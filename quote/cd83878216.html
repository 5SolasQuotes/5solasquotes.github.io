<blockquote><p>The Essence of God absolutely considered, is that one pure and mere act, by which God is God. Because through weakness of our understanding we cannot apprehend it in any measure by one act, it hath pleased God to give unto himself many Names and Attributes, by the help of which we may the better conceive thereof. …

The divine Attributes are certain essential Properties, which God is pleased in Scripture to ascribe or attribute unto himself; they are also called the Perfections of God, or divine Predications, or Titles. They are not distinguished from the Essence really, but notionally; that is, they are not distinguished at all in God, but only to us-ward, according to our manner of conceiving.

All the Attributes in God are one and the same Perfection. It is better said of God that he is his Attributes, then that he hath Attributes: The Attributes are not distinguished in God, but in our manner of understanding, who being unable to comprehend that mere act at once, do conceive thereof after the manner of many acts. …

The sum is: The Attributes, as was said before, are not distinguished in God, that is, from the divine Essence, or one from another really, but only notionally, or virtually in our conception, and in their objects, in respect of the various effects thereupon: For every and all the Attributes are the divine Essence it self; according to that received Proposition, Whatsoever is in God, is God: And this is the reason why some well describe the Attributes from the Essence of God: which manner of description, besides many useful notions clearly intimated thereby, doth in the describing of the Relative Attributes, principle and fortify the understanding against that perilous Tenet of Arminianism, concerning the Decree passing upon good or bad foreseen, with the evil consequences following thereupon. …

Negative Attributes are such as remove from God all imperfection: by these we help our understanding in our meditation of God, by way of Negation. The more principal of them are in number five, viz. Simplicity, Eternity, Immensity, Immutability, Infiniteness: to which, or some of which, any other of like nature may conveniently be referred.

Simplicity is God, one mere and perfect act without all composition. God calleth his Name, I am, Exod. 3.14. that is, mere Essence, wherein is nothing past, nor to come. Because spirits are immixt in respect of bodies, to shew that he is not compounded, he saith he is a Spirit, John. 4.24. When we say that God is a mere and perfect Act, the meaning is, that God is a Cause without any Cause, a Being that is not from any Being; not compounded of an Act, by which he is; and Possibility, by which he might not have been, or may not be: of whom it never could nor can be said, that any thing was to be in him, which was not; or cannot be, that is.

That God is a pure and simple Act without all composition, is evident, Because of his Perfection; all composition supposeth imperfection, because he is the first Being. Were there any composition in God, it would follow there were first and second in God: Something in God that were not first, or that there were more first Beings.

Because God is a Being of absolute necessity: Composition implieth either that there must be more Beings of absolute necessity, or that there is something in God that may not be. Composition supposeth Succession, i. e. something past or to come in God; contrary to his Name, I am. Nay it supposeth that not-being is not repugnant to the Nature of God: Where there is Composition, there may be Dissolution; Dissolution is the way to not-being.</p></blockquote>

<blockquote><p>Immutability is God without any alteration in respect of being, will or any accidents, Ps. 102:27-28; Mal. 3:6; Jam. 1:17, ‘With whom is no variableness, nor shadow of turning.’ Objection: God might have willed or not willed the being of the creature, else He were not free. He that may both will and not will is mutable. The sum is: The liberty and immutability of God seem not to consist together. Answer: That immutability and liberty consist together is evident from the nature of God, who wills his own being freely. (see Smising, [Tract on the One God] tract 2, disp. 3, quest. 1, num. 23) If He were subject to co-action and mutability, He were not God. If by reason of our weakness we are less able so distinctly to discern the liberty of God as concerning the creature in the act of God willing, yet it is clearly to be seen in the object willed, viz. the creature: because nothing is more manifest than that there is no necessary connection between the being of God and the being thereof. God had been the same, perfect and blessed forever, though the creature had never been. Objection 2: God’s will in his decree and his will in the command are often contrary one unto another; therefore He is not immutable. Answer: No such thing. The decree determines what shall be; the command shows what ought to be. God’s willing the futurition of the betraying of Christ by Judas, and yet willing it to be Judas’s duty not to betray Christ, have not the least appearance of two wills in God. Objection 3: God sometime[s] promises and performs not: threatens and executes not; therefore He may seem not to be immutable. Answer: Such promises and threatnings are to be understood conditionally, not absolutely. See Jer. 18:7, 10. Objection 4: God in Scripture is often said to repent; He that repents is not immutable. Answer: Such speeches, though spoken after the manner of men for the help of our understanding, yet are to be understood as becomes the nature of God. God is therefore said to repent because He does as men do when they repent, that is, He changes his deeds: yet without any change of his will. Nay, those changes of his deeds are the executions of his unchangeable will.</p></blockquote>

<blockquote><p>But God being a pure Spirit, without any mixture of body or matter, is never weary in his thoughts, purposes, and designs, neither doth he discourse after the manner of men, drawing a conclusion from the Premises, neither doth he think of one thing, and then of another, for there is not in him (I mean in his wisdom and intelligence, no more then in the Eternity of his duration) neither first nor second prius &amp; posterius, but all these thoughts, designs, counsels, and resolutions, are in him but one single and pure act, by which he sees, knows, understands, wills, and ordereth all things; his most pure, and perfect simplicity (which agreeth with so excellent and infinite a Nature) requireth that, and it implies a contradiction, that there should be in his Essence any variableness, or shadow of turning[.]

[W]e do conceive the Essence of God, his virtues, and properties, his wisdom, power, understanding, his will, that is to say, his Counsels, and designs, as by so many images, forms, and distinct conceptions, because that being corporeal, and finite, and he a Spirit, altogether infinite, we cannot see, nor comprehend what God is in himself, but we know well nevertheless, that Gods perfection, and simplicity doth not admit of so many things wholly different one from another; neither doth it imply that they be in his Essence formaliter (as the Schoolmen say) but eminenter, &amp; causaliter, as we hold that the Sun is not in his substance and Essence hot as the fire is, but only as he is the cause of heat every where.

It is then a very low thought of God, to imagine, that he labours in thinking, or designing any thing, or that he wearies himself in acting, and from thence, that he grows melancholy, and sad, and that this troubles his repose, and content, and in some manner abates from his felicity.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But God being a pure Spirit, without any mixture of body or matter, is never weary in his thoughts, purposes, and designs, neither doth he discourse after the manner of men, drawing a conclusion from the Premises, neither doth he think of one thing, and then of another, for there is not in him (I mean in his wisdom and intelligence, no more then in the Eternity of his duration) neither first nor second prius &amp; posterius, but all these thoughts, designs, counsels, and resolutions, are in him but one single and pure act, by which he sees, knows, understands, wills, and ordereth all things; his most pure, and perfect simplicity (which agreeth with so excellent and infinite a Nature) requireth that, and it implies a contradiction, that there should be in his Essence any variableness, or shadow of turning[.]

[W]e do conceive the Essence of God, his virtues, and properties, his wisdom, power, understanding, his will, that is to say, his Counsels, and designs, as by so many images, forms, and distinct conceptions, because that being corporeal, and finite, and he a Spirit, altogether infinite, we cannot see, nor comprehend what God is in himself, but we know well nevertheless, that Gods perfection, and simplicity doth not admit of so many things wholly different one from another; neither doth it imply that they be in his Essence formaliter (as the Schoolmen say) but eminenter, &amp; causaliter, as we hold that the Sun is not in his substance and Essence hot as the fire is, but only as he is the cause of heat every where.

It is then a very low thought of God, to imagine, that he labours in thinking, or designing any thing, or that he wearies himself in acting, and from thence, that he grows melancholy, and sad, and that this troubles his repose, and content, and in some manner abates from his felicity.”

— Louis Cappel, The hinge of faith and religion: or, a proof of the deity against atheists and profane persons, by reason, and the testimony of Holy Scripture: the divinity of which is demonstrated, trans. Philip Marinel (London: Thomas Dring, 1660), pp 69-71.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+God+being+a+pure+Spirit%2C+without+any+mixture+of+body+or+matter%2C+is+never+weary+in+his+thoughts%2C+purposes%2C+and+designs%2C+neither+doth+he+discourse+after+the+manner+of+men%2C+drawing+a+conclusion+from+the+Premises%2C+neither+doth+he+think+of+one+thing%2C+and+then+of+another%2C+for+there+is+not+in+him+%28I+mean+in+his+wisdom+and+intelligence%2C+no+more+then+in+the+Eternity+of+his+duration%29+neither+first+nor+second+prius+%26+posterius%2C+but+all+these+thoughts%2C+designs%2C+counsels%2C+and+resolutions%2C+are+in+him+but+one+single+and+pure+act%2C+by+which+he+sees%2C+knows%2C+understands%2C+wills%2C+and+ordereth+all+things%3B+his+most+pure%2C+and+perfect+simplicity+%28which+agreeth+with+so+excellent+and+infinite+a+Nature%29+requireth+that%2C+and+it+implies+a+contradiction%2C+that+there+should+be+in+his+Essence+any+variableness%2C+or+shadow+of+turning%5B.%5D%0A%0A%5BW%5De+do+conceive+the+Essence+of+God%2C+his+virtues%2C+and+properties%2C+his+wisdom%2C+power%2C+understanding%2C+his+will%2C+that+is+to+say%2C+his+Counsels%2C+and+designs%2C+as+by+so+many+images%2C+forms%2C+and+distinct+conceptions%2C+because+that+being+corporeal%2C+and+finite%2C+and+he+a+Spirit%2C+altogether+infinite%2C+we+cannot+see%2C+nor+comprehend+what+God+is+in+himself%2C+but+we+know+well+nevertheless%2C+that+Gods+perfection%2C+and+simplicity+doth+not+admit+of+so+many+things+wholly+different+one+from+another%3B+neither+doth+it+imply+that+they+be+in+his+Essence+formaliter+%28as+the+Schoolmen+say%29+but+eminenter%2C+%26+causaliter%2C+as+we+hold+that+the+Sun+is+not+in+his+substance+and+Essence+hot+as+the+fire+is%2C+but+only+as+he+is+the+cause+of+heat+every+where.%0A%0AIt+is+then+a+very+low+thought+of+God%2C+to+imagine%2C+that+he+labours+in+thinking%2C+or+designing+any+thing%2C+or+that+he+wearies+himself+in+acting%2C+and+from+thence%2C+that+he+grows+melancholy%2C+and+sad%2C+and+that+this+troubles+his+repose%2C+and+content%2C+and+in+some+manner+abates+from+his+felicity.%E2%80%9D%0A%0A%E2%80%94+Louis+Cappel%2C+The+hinge+of+faith+and+religion%3A+or%2C+a+proof+of+the+deity+against+atheists+and+profane+persons%2C+by+reason%2C+and+the+testimony+of+Holy+Scripture%3A+the+divinity+of+which+is+demonstrated%2C+trans.+Philip+Marinel+%28London%3A+Thomas+Dring%2C+1660%29%2C+pp+69-71.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa7869b2939.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a7869b2939.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/01/17/louis-cappel-on-gods-knowledge-as-a-pure-act/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-2218b9f05f" data-kw="">
<blockquote><p>I answer that, Power is twofold—namely, passive, which exists not at all in God; and active, which we must assign to Him in the highest degree. For it is manifest that everything, according as it is in act and is perfect, is the active principle of something: whereas everything is passive according as it is deficient and imperfect. Now it was shown above (I:3:2; I:4:1 and I:4:2), that God is pure act, simply and in all ways perfect, nor in Him does any imperfection find place. Whence it most fittingly belongs to Him to be an active principle, and in no way whatsoever to be passive. On the other hand, the notion of active principle is consistent with active power. For active power is the principle of acting upon something else; whereas passive power is the principle of being acted upon by something else, as the Philosopher says (Metaph. v, 17). It remains, therefore, that in God there is active power in the highest degree. Reply to Objection 1. Active power is not contrary to act, but is founded upon it, for everything acts according as it is actual: but passive power is contrary to act; for a thing is passive according as it is potential. Whence this potentiality is not in God, but only active power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, Question 25, ‘The Power of God’ | Article 1</span></figcaption>

<blockquote><p>II. It is not queried whether passive power (which is the principle of suffering from another) may be granted in God. Since this cannot be supposed without imperfection and change, it is evident that it should be removed far from him. Nor if the generation of the Son or the spiration of the Spirit is expressed in passive terms, does it immediately follow that there is in God passive power (since this denotes a mere relation [schesin] to the persons generating and spirating). But we treat only of the active power, the principle of acting on another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Topic 3, Q. 21, ‘The Power of God, p. 245</span></figcaption>

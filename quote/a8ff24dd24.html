<main class="wrap"><figure class="quote" id="q-a8ff24dd24" data-kw="">
<blockquote><p>The third opinion is, that the Magistrate may and ought to exercise his coercive power, in suppressing and punishing Heretics and Sectaries, less or more, according as the nature and degree of the error, schism, obstinacy, and danger of seducing others, doth require. This as it was the judgement of the orthodox Ancients, (vide Optati opera, edit. Albaspin. pag. 204. 215.) so it is followed by our soundest Protestant Writers; most largely by Beza against Bellius and Monfortius, in a peculiar Treatise De Haereticis à Magistratu puniendis. And though Gerhard, Brochmand, and other Lutheran Writers, make a controversy where they need not, alledging that the Calvinists (so nicknamed) hold as the Papists do, that all Heretics without distinction are to be put to death:

The truth is, they themselves say as much as either Calvin or Beza, or any other whom they take for adversaries in this Question, that is, that Heretics are to be punished by mulcts, imprisonments, banishments, and if they be gross idolaters or blasphemers, and seducers of others, then to be put to death. What is it else that Calvin teacheth, when he distinguisheth three kinds of errors: some to be tolerated with a spirit of meekness, and such as ought not to separate betwixt brethren: others not to be tolerated, but to be suppressed with a certain degree of severity: a third sort so abominable and pestiferous, that they are to be cut off by the highest punishments?

And lest it be thought that this is but the opinion of some few, that the magistrate ought thus by a strong hand, and by civil punishments suppress Heretics and Sectaries: let it be observed what is held forth and professed concerning this business, by the Reformed Churches in their public Confessions of Faith. In the latter Confession of Helvetia, cap. 30. it is said that the magistrate ought to root out lies and all superstition, with all impiety and idolatry. And after; Let him suppress stubborn Heretics.

In the French Confession, art. 39. Therefore he hath also delivered the sword into the hands of the Magistrates, to wit, that offences may be repressed, not only those which are committed against the second Table, but also against the first. In the Belgic Confession, art. 36. Therefore hath he armed the Magistrate with the sword for punishing them that do evil, and for defending such as doe well. Moreover it is their duty not only to be careful and watchful for the preservation of the civil government, but also to defend the holy Ministry, and to abolish and overthrow all Idolatry, and counterfeit worship of God.

Beza de haeret, à magistr. puniend, tells us in the beginning, that the Ministers of Helvetia had declared themselves to be of the same judgement, in a book published of that Argument. And toward the end he citeth the Saxon Confession, Luther, Melancthon, Brentius, Bucerus, Wolfangus Capito, and Bullinger. The Synod of Dort, Ses. 138. in their sentence against the Remonstrants doth not only interdict them of all their Ecclesiastical and Academical functions, but also beseech the States General by the secular power further to suppress and restrain them.</p></blockquote>

<blockquote><p>I respond [to an Arminian]: Be it so, that the precept “Repent and believe the Gospel” binds all and every man; be it so, that that precept is proclaimable to all men by the will of God; yet since in fact it is not announced to all, and that by a special dispensation of God, such are excused by invincible ignorance, so that they do not exercise supernatural acts concerning supernatural objects. For invincible ignorance on this part rightly excuses. For positive precepts do not bind those to whom they are not promulgated. And therefore, such a one, as he can have no knowledge of any obligation, so he can be conscious to himself of no prevarication. (See Puteanus on pt. 1 of 2, q. 90, art. 4, concl. 1). 2… But for something to be imputed to a man as a fault, it must in some way be avoidable, voluntary, and known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Negative Infidelity</cite>, [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 55-56</span></figcaption>

<blockquote><p>From this it follows, that subjects are no farther bound to obey the magistrate because of conscience, than in as far as he himself presides and enjoins with a good conscience, and on the authority of the Word of God: and besides, it is worthy of observation, that the wrath of the magistrate, unless directed against the disobedient, refusing to do their duty according to the injunction of Jehovah, is neither just, nor lawful, nor to be feared by his subjects, but Christians, in the Christian warfare, must pass through the midst of it to victory in Christ, by the power of the Spirit of God; as we see in the case of Daniel, who rose to victory through the lions’ den, with his three friends, who esteemed the wrath of the king as nothing in comparison with their duty to God, although the disobedient were threatened with a fiery furnace, the heat of which had been increased seven times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-ferme.html">Charles Ferme</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Logical Analysis of Romans</cite>, (†1617) on Rom. 13:5, p. 293. Ferme (1565-1617) was a reformed Scottish divine.</span></figcaption>

<blockquote><p>…if I drew not up a fair contract of marriage betwixt you and Christ, if I went not with offers betwixt the bridegroom and you, and your conscience did bear you witness, your mouths confessed that there were many fair trysts and meetings drawn on betwixt Christ and you at communion-feasts and other occasions; there were bracelets, jewels, rings, and love-letters sent to you by the Bridegroom, it was told you what a fair dowry you should have and what a house your husband and ye should dwell in, and what was the bridegroom’s excellency, sweetness, might, power. The eternity, and glory of his Kingdom, the exceeding deepness of his love, who sought his black wife through pain, fires, shame, death and the grave; and swimmed the salt sea for her, undergoing the curse of the law, and then was made a curse for you, and you then consented and said, ‘Even so I take Him’.</p></blockquote>

<blockquote><p>Lastly, let subjects pay tribute to their magistrates; yea, let them, if necessity so require, not to stick to bestow their bodies and lives for the preservation of their magistrate and country, as I have already taught you in the fifth commandment. The Lord in the gospel doth simply say, “Give to God that which belongeth to God, and to Caesar that which belongeth to Caesar.” They therefore are worthily blamed, that pinch, grudge at, or defraud the magistrate of any part of his tribute. Taxes and tributes are due to the magistrate, as the hire of his labour, and as it were the sinews of public tranquillity and commonweal. For “who goeth to warfare of his own proper cast?” [1 Cor. 9:7] Every man liveth by that labour wherein he is occupied. The prince taketh pains in governing the commonweal, and preserving it in peace; he neglecteth his own private and household business, whereby he should live, and provide things necessary for himself and his family, by looking and attending on his country’s affairs: it were against reason, therefore, but that he should be fed and maintained upon the public treasure and cost of his country.

It is requisite, also, that kingdoms and commonweals be sufficiently furnished with money and substance to help in distress, either of war, famine, fire, and other miseries; or else to the setting up again of men fallen into poverty, or putting away of greater calamities. I say nothing now touching the keeping in reparation of common buildings, as the city-walls, bulwarks, trenches, ditches, gates, bridges, highways, wells, conduits, judgment-halls, and market-places, with many more of the same sort. There are also certain common persons, as serjeants, watchmen, and such like, which are to be nourished and maintained of the common cost and treasury; and, unless that money be still at hand and in readiness, there can no kingdom nor any commonweal stand long in assurance. They, therefore, that grudge to pay tribute deny the hire of the magistrate’s labour, and go to the next way to work to subvert the commonweal, and to bring it to nought. The men that in the commonweal’s affairs (as some of custom be) are negligent and careless, sin not against any one lord, but against the whole commonweal: and, therefore thou mayest see that such slothful workmen are seldom times enriched with the good blessings of God.</p></blockquote>

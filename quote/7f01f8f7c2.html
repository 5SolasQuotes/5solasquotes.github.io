<main class="wrap"><figure class="quote" id="q-7f01f8f7c2" data-kw="">
<blockquote><p>Physician: Whether being with the sick, he have especially &amp; before all things exhorted them to have a firm, and undoubting faith in God, without whom no medicine is available and wholesome.

Whether for recovery of his bodily health he have advised and prescribed to his patient any things that be hurtful and dangerous to the health of his soul, as all those things are, that be not warranted by the word of God, but directly against the remedies which the Lord hath ordained.

As when they prescribe unto them superstitious observances, peevish calculations and childish mawmetries [sic], &amp;c. Also when they bear their patient in hand or make him to think that some certain Saints have power to send &amp; also to take away this or that disease: as though God were not the only governor of all things did not depend on him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-hyperius.html">Andreas Hyperius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true trial and examination of a man’s own self wherein every faithful Christian, by looking into his conscience, may most plainly behold his spiritual deformity by nature, described, his actual rebellion by disobedience detected, his promise breach at baptism, by ordinary transgression apparentl</cite>, trans. Thomas Newton (London: John Windet, 1587), pp 40-41.</span></figcaption>

<blockquote><p>If further inquiring into the characteristics of the aionion, still keeping its formal aspect rather than its substantial content in view, the first feature obtruding itself is that of the imperishableness, including the unchangeableness, of the things pertaining to it. Paul declares, almost after the manner of an axiomatic truth: “the things which are seen are temporal; but the things which are not seen are eternal,” 2 Cor. 4:17. At first this reads like a differentiating appraisal of the visible and the invisible, something reminding of the antithesis between the two worlds of the ideal and the sense-things with Plato. A closer examination of the words in their context will soon convince that this exegesis would convey only part of the meaning, and for the other part produce a wrong perspective. The emphasis does not rest on the seen versus the unseen, but on the fact that the former, under the present circumstances happens to consist of perishable things, whereas the other under the same circumstances possesses the nature of the eternal, of what from its very nature cannot perish, because it carries the principle of eternity in itself. A permissable paraphrase would be: the things that in this lower, preliminary, state engage our interest are transitory and corruptible; the things which in the present dispensation the believer cannot yet lay hold of by vision are the eternal, incorruptible realities. It goes without saying, that the distinction thus interpreted partakes not of the nature of a cool, disinterested diagnosis of metaphysical difference; there is a degree of pathos in the declaration, occurring s it does in a highly emotional context. Paul is conscious of σκοπευν “looking at,” that is contemplating with interest the makeup of the invisible world. Only,this mode of contemplation is with the Apostle not induced by the invisibleness of the things in question; in the abstract he practices no cult of the invisible as partaking per se of a superior complexion; that would be a Hellenic thought; but he has learned to recognize in the things unseen to the present aion the enduring things of the world to come, a world already in principle present, the contemplation of which can consequently render solace and support in the affliction of the moment. That thus and thus only the stress is rightly divided will be perceived from the closely following word: “for we pilgrimage through a land of faith, not of sight,” 2 Cor. 5:7. Here the unseen things of th either passage are precisely the things of future sight, deriving their spreme value from this prospective visibleness, whilst the walking through a region of faith is felt precisely as a matter of relative lack of importance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Pauline Eschatology</cite>, 191–92.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

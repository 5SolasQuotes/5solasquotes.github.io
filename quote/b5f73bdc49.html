<main class="wrap"><figure class="quote" id="q-b5f73bdc49" data-kw="">
<blockquote><p>That which is the sum of religion, sincerity, and a correspondency between profession and practice, is confirmed by reason, and much strengthened by nature itself; so that religion, reason, and nature, conspire in one, to hold out the beauty and comeliness of sincerity, and to put a note and character of infamy and deformity upon all hypocrisy and deceit, especially in the matters of religion.

There is nothing so contrary to religion, as a false appearance, a shew of that which is not: for religion is a most entire and equable thing, like itself, harmonious in all parts of it, the same within and without, in expression and action, all correspondent together. Now, to mar this harmony, and to make it up of unequal, dissimilar parts, and to make one part give the lie to the other, the course of a man’s life, in ignorance, negligence, and sin, proclaiming contrary to the profession of Christianity: this is to make religion a monstrous thing, to deny the nature of it, and in our imaginations to contrive an impossible union of inconsistent things.

It is a creature made up of contradictions, which can have no subsistence in the truth, but only in the fancies of deluded souls; one professing Christianity, and so by consequence fellowship with the original light, the Sun of Righteousness, and yet darkness of ignorance possessing the mind, and the heart carried away in the ways of the lusts of ignorance, and walking in that darkness.

This is a monster in Christianity, one so far misshapen, that the very outward form and visage of it doth not remain. But I told you, reason confirms this; for what more suitable to the very natural frame and constitution of a reasonable being, than that the outward man should be the image and expression of the inward, and that they should answer one another, as face answers face in the water; that the tongue should be the interpreter of the mind, and the actions of a man’s life the interpreter of his tongue ?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fellowship with God, or Twenty-Eight Sermons on the First and Second Chapters of the First Epistle of John</cite>, (1671) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 2: 258-60.</span></figcaption>

</figure><figure class="quote" id="q-026632dec8" data-kw="">
<blockquote><p>Have due respect to every truth which God has revealed in his word. — Divine truths are one consistent whole; none of which can be spared without disfiguring the beauty and symmetry of the whole system, and injuring our own souls and the souls of others, by withholding from them a truth which they need for their spiritual improvement and comfort.

It is a great mistake to suppose one part of the Bible to be legal, and another evangelical, as if the divine oracles contradicted themselves, — far from it; they make one complete, united, and consistent system. Every truth beautifully fills its own place. Transpose it, and it becomes useless, yea, a pernicious error. Omit it, and a vacancy is left which nothing else can supply.

If divine truths seem to us to militate against each other, the fault is in the medium through which we view them; and because we view them through a false medium, they appear contradictions to us, but are not so in themselves. We, as sinners, want them all; they were intended for our relief as such: and united together as a complete whole, they are a suitable and adequate remedy for all our miseries.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-charles.html">Thomas Charles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preface to the Rev. Mr. Oliver s Hymn Book’ in Edward Morgan (ed.), Essays, Letters, and Interesting Papers of the Late Rev. Thomas Charles, A.B. Bala, Merionethshire</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-1135cadf87" data-kw="">
<blockquote><p>Not but that a Christian ought prudentially to clear himself from slanders. When the apostle Paul was charged to be mad he vindicated himself. ‘I am not mad, most noble Festus’ (Acts 26:25). Though a Christian’s retorts must not be vulnerating [wounding], they may be vindicating. Though he may not scandalise another, yet he may apologise for himself.

There must be Christian prudence, as well as Christian meekness. It is not mildness but weakness to part with our integrity (Job 27:6). To be silent when we are slanderously traduced, is to make ourselves appear guilty. We must so affect meekness as not to lose the honour of innocence. It is lawful to be our own defenders. The fault lies only in this when we retort injuries with reproachful terms, which is to pay a man back in the devil’s coin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beatitudes: An Exposition of Matthew 5:1-12</cite>, (1660; Edinburgh: Banner of Truth, 1971), p. 110.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<main class="wrap"><figure class="quote" id="q-afcb3af2fb" data-kw="">
<blockquote><p>Moreover, who can deny ye there is much &amp; great virtue in David’s Harp… Again must not David’s songs be of great excellency, seeing that ye Son of God came down from the glorious throne of his heavenly Father to accomplish and fulfill them? Doth not Paul also say, ‘Be ye filled with the Spirit, speaking among yourselves in Psalms, Hymns, &amp; spiritual songs, singing and making melody in your hearts to ye Lord, ever giving thanks for all things in the name of our Lord Jesus Christ?’ Certes [assuredly] the psalmody of David may well be called ye treasure house of the holy Scripture. For it contain the whatsoever is necessary for a christian to know: There is nothing in the law, no thing in the Prophets, nothing in ye preaching of Christ and of his apostles, yt this noble minstrel, King &amp; Prophet doth not decantate and sing with most goodly &amp; manifest words. He singeth all the works and wonderous miracles of God from the beginning of the world, until the redemption of mankind by Christ. He singeth Christ’s incarnation, preaching, working of miracles, passion, death, resurrection, ascension, glory, the blessing of all nations, the conversion of the Gentiles with all other mysteries that pertain to our health… To be short, he singeth whatsoever is expedient for a Christian’s knowledge. So that even this one book alone of David’s songs had been sufficient truly to instruct a man in the righteousness of God… O the wonderful and marvelous strength of David’s harp. O the great and exceeding virtue of David’s songs… Would God that all men of honor would nourish such minstrels in their houses, as David’s, and that might sing unto them both at dinner and supper, yea and at all other times these most sweet and delectable songs of David… Would God also that all fathers and mothers, all masters and mastresses, would bring up their children and servants in the singing of these most godly songs.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-43d87fcc7d" data-kw="">
<blockquote><p>I should be too tedious if I should stand to reckon up the manifold mercies that God hath bestowed on this our land, beyond all the world besides, our peace, and plenty, with the Gospel of Christ, our many, and great deliverances… God hath delivered us from the Spanish invasion, and the Gun-powder treason, and hath placed us in a wealthy land. ‘Be ye therefore filled with the Spirit’ (saith our prophet David) ‘speaking to yourselves in Psalms, and Hymns, and spiritual songs’: and here I might speak of the godly care of our Church, which hath ordained singing of Psalms, both before, and after sermon, and indeed are very fitting to be sung in order, for the better stirring up of our affections. And here I have a just cause to task them of the Separation, who will not admit of any set form of prayer, for that (as they say) is cursing of the Spirit; but why then should we have a set form of singing? For my part it shall ever have my allowance and I think that these their ex tempore prayers sounds as harshly in the ears of heaven, as diverse Psalms sung together in several tunes would in ours.</p></blockquote>

</figure><figure class="quote" id="q-ada1c8474e" data-kw="">
<blockquote><p>The matter is here three ways to be considered: First, in the ground, foundation, or authority of the Psalms we use, viz. they must be the word of Christ, that is contained in the Scriptures. Secondly in the kinds of Psalms, there are many sort of Psalms in Scripture. The Psalms of Moses, David, Solomon, and other prophets: but all are here referred to three heads; they are either Psalms, specially so called, or hymns, or songs. Great ado there is among interpreters to find a difference in these: some would have Psalms to be the songs of men, and Hymns of angels: some think they differ, especially in the manner of music. Some are sung by voice, some played upon instruments; but the plausiblest opinion is not to distinguish them by the persons that use them, or by the kind of music, but by the matter, and so they say Psalms contain exhortation to manners or holy life. Hymns contain praises to God in the commemoration of his benefits. Songs contain doctrine of the chief good, or man’s eternal felicity. But I think there needs not any curious distinction: it may suffice us that there is variety of Psalms in Scripture and God allows us the use of every kind. Thirdly, the property of the Psalms, they are Spiritual, both because they are indited by the spirit, and because they make us more spiritual in the due use of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Epistle to the Colossians (London, 1615), commentary on ch. 3, v. 16</cite>, p. 101</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>3. Mr. [Richard] Bernard, himself in this book makes prayer one thing, and the blessing pronounced upon the people, when they departed, another thing: as he also makes singing of psalms a third distinct thing from them both: as there is cause he should. For first, the apostle writing to the Corinthians of the diverse gifts, and administrations in the Church, speaketh thus: ‘I will pray with the spirit, but I will pray with the understanding also: I will sing with the spirit, but I will sing with the understanding also.’ Answerable unto which is that in James [5:13], ‘Is any among you afflicted? let him pray; is any merry? let him sing’: both the one, and other apostle making singing, and praying distinct exercises. And unto this, that whereas in praying we are to speak only unto God, it is otherwise in singing, where we are taught to ‘speak unto ourselves in psalms, and to teach, and admonish ourselves in psalms, and hymns, and spiritual songs.’ What greater difference? In prayers we speak only to God: in psalms to ourselves mutually, or one to another. Neither had Mr. Giffard any advantage in the words following, where we are taught to sing with a grace in our hearts to the Lord: for by singing with a grace is meant such singing as ministereth grace unto the hearers, contrary to that corrupt, or rotten communication, Eph. 4:29. And in this, as in all other things, we must propound the glory, and honor of God unto ourselves. 3. There are very many both of David’s, and others psalms, wherein there is no title of prayer: but they are merely to be sung for doctrine, instruction, and meditation, as Ps. 1:2, and many more. The Ministers write (pp. 192-3), that the most Psalms that David made were sung not only as meditations and doctrines, for the instructions of the Church, but as prayers to God: because they are said to be sung unto the Lord: for which purpose they instance in one only, which is Ps. 66:2-3. Well, not to fall to reckoning with them (wherein they and I should not agree: for I would except against their picked instance: Ps. 66:2-3, which all men may see was not sung for prayer, nor unto the Lord, as they mean, but for instruction, and provocation of the Church to praise God) if they consider it, they should have proved, not that some, but that all psalms are prayers; otherwise they may not be confounded and made one ordinance, as by them they are. But to come to that which is specially to be observed: even those psalms, whose matter is prayer, are not prayers: neither is the singing of them, the outward ordinance and exercise of praying. And this is the very state of the controversy. Which that it may be understood the better, it must be considered that the very same matter of prayer may be used diversely, and so formed into diverse external ordinances. It may be read, preached, heard, written, sung, or prayed. Now who is so simple as to say hereupon that reading, preaching, hearing, writing, singing, praying, are all one? If a man read David’s prayer, that the Lord would turn the counsel of Ahitophel into foolishness: or either read, or sing the 6th Psalm, where in his prayer he professeth that he causeth his bed every night to swim, and waters his couch with tears: or psalm 42, that he remembers God from the land of Jordan, etc. doth that man therefore pray to God, that he would turn into foolishness the counsel of Ahithophel? or doth he profess that he waters his couch with tears every night and remembers God from the land of Jordan? or is it not evident he reads, and sings those prayers only for instruction of himself and others? And so we read in the inscription of the last named psalm that it was committed to the sons of Korah (not to pray it, which they could not do without folly) but for instruction. And as truly may it be said, that the reading of Noah’s curse, or Shimei’s, is cursing (Gen. 9:25; 2 Sam. 16:5), as that the reading, or singing (for singing is but a reading in tune) of David’s prayers, is praying. But it will here be asked, is it not then lawful for a man in the singing of David’s psalms (consisting of prayer) to lift up his heart, and to have it affected accordingly, as he can apply the matter in them to his present state and occasions? Yes, certainly, it is both lawful and godly: but withal it must be remembered that the question here is not about the inward affection of the heart, but about the outward ordinance: and 2. that a man may so lift up his heart and have the affection of prayer and thanksgiving in preaching, hearing, writing, reading: and yet not perform the outward exercise and outward ordinance of prayer, of which our question is. Lastly, in psalms there is of necessity required a certain known form of words, that two or more may sing together: according to the nature of the ordinance, wherein many joining vocally, do make a concert or harmony. But who will say there is such simple necessity of a set form of words for prayer? wherein one is to utter a voice according to the suggestions of the spirit in his heart, and the rest to consent by silence, with saying ‘Amen’. By which it appeareth how unadvisedly these ministers and others, do thus again and again urge set forms of psalms to prove set forms of prayer.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“3. Mr. [Richard] Bernard, himself in this book makes prayer one thing, and the blessing pronounced upon the people, when they departed, another thing: as he also makes singing of psalms a third distinct thing from them both: as there is cause he should. For first, the apostle writing to the Corinthians of the diverse gifts, and administrations in the Church, speaketh thus: ‘I will pray with the spirit, but I will pray with the understanding also: I will sing with the spirit, but I will sing with the understanding also.’ Answerable unto which is that in James [5:13], ‘Is any among you afflicted? let him pray; is any merry? let him sing’: both the one, and other apostle making singing, and praying distinct exercises. And unto this, that whereas in praying we are to speak only unto God, it is otherwise in singing, where we are taught to ‘speak unto ourselves in psalms, and to teach, and admonish ourselves in psalms, and hymns, and spiritual songs.’ What greater difference? In prayers we speak only to God: in psalms to ourselves mutually, or one to another. Neither had Mr. Giffard any advantage in the words following, where we are taught to sing with a grace in our hearts to the Lord: for by singing with a grace is meant such singing as ministereth grace unto the hearers, contrary to that corrupt, or rotten communication, Eph. 4:29. And in this, as in all other things, we must propound the glory, and honor of God unto ourselves. 3. There are very many both of David’s, and others psalms, wherein there is no title of prayer: but they are merely to be sung for doctrine, instruction, and meditation, as Ps. 1:2, and many more. The Ministers write (pp. 192-3), that the most Psalms that David made were sung not only as meditations and doctrines, for the instructions of the Church, but as prayers to God: because they are said to be sung unto the Lord: for which purpose they instance in one only, which is Ps. 66:2-3. Well, not to fall to reckoning with them (wherein they and I should not agree: for I would except against their picked instance: Ps. 66:2-3, which all men may see was not sung for prayer, nor unto the Lord, as they mean, but for instruction, and provocation of the Church to praise God) if they consider it, they should have proved, not that some, but that all psalms are prayers; otherwise they may not be confounded and made one ordinance, as by them they are. But to come to that which is specially to be observed: even those psalms, whose matter is prayer, are not prayers: neither is the singing of them, the outward ordinance and exercise of praying. And this is the very state of the controversy. Which that it may be understood the better, it must be considered that the very same matter of prayer may be used diversely, and so formed into diverse external ordinances. It may be read, preached, heard, written, sung, or prayed. Now who is so simple as to say hereupon that reading, preaching, hearing, writing, singing, praying, are all one? If a man read David’s prayer, that the Lord would turn the counsel of Ahitophel into foolishness: or either read, or sing the 6th Psalm, where in his prayer he professeth that he causeth his bed every night to swim, and waters his couch with tears: or psalm 42, that he remembers God from the land of Jordan, etc. doth that man therefore pray to God, that he would turn into foolishness the counsel of Ahithophel? or doth he profess that he waters his couch with tears every night and remembers God from the land of Jordan? or is it not evident he reads, and sings those prayers only for instruction of himself and others? And so we read in the inscription of the last named psalm that it was committed to the sons of Korah (not to pray it, which they could not do without folly) but for instruction. And as truly may it be said, that the reading of Noah’s curse, or Shimei’s, is cursing (Gen. 9:25; 2 Sam. 16:5), as that the reading, or singing (for singing

<blockquote><p>8. The object of God’s will to create man was nothing, in the sense that we now take an object in, that is, for the materia circa quam [matter around which]. But if you will call the intended effect the object, then the object of God’s will here (and in the rest) is the thing willed. But if you will needs presume to seek one higher in the mind of God (man knows by reception and so has ideas, but God can be no recipient), you must say that it was man as conceived fit to be, as well as possible. For we can think no otherwise of the divine conceptions and volitions but as we are led by the analogy of human acts. And so we must say that: 1. God’s power makes it possible for all things to be. 2. Next God knows them possible. 3. He knows what is convenient or fit to be made to his unsearchable ends. 4. He wills that they shall be, and man among the rest, and so on.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination</cite>, p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>Now you are to meditate how God brought forth all his works in the space of six days, before He finished them; He did not create the world all at once, but took time for the creation of it, to teach us to take special time duly and orderly to consider and meditate on the works of God: if He that could have made the Heavens and the earth, the sun, moon and stars, and all creatures, in a moment; yet it pleased Him to take time for the creating of them; this should teach us to select some space of time for the meditation of them: We must not think it enough to look upon them at one view, but to pass from part to part, from one creature to another, and in every creature to admire the workmanship, power, wisdom and goodness of the Creator, as we are taught, Ps. 92:4-5… which psalm as the title tells us, was a meditation penned for the Sabbath day: therefore I say, God would spend six days about the creation of the world, whereas He might have done it in an instant, and in a moment of time, to the end that we might the better meditate upon it from point to point, for which purpose He presently ordained the Sabbath… The eternal power and Godhead is seen by the things that are made; but most of us have great cause to be ashamed, that we have spent so little time in meditating on the works of God; yea who can truly say he has spent so much time in meditating on God’s works as God spent in making them? How few are there that have set apart so much time ever since they were born, as (if it were all laid together) will make up six days one entire week? What a shame is it for man whom God made on purpose to view his works, and by them to glorify Him, not to spend so much time in meditating upon them as God spent in making of them;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gearing.html">William Gearing</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mount of Holy Meditation: or a Treatise… (London: Tyton, 1662), ch. 8</cite>, pp. 54-56</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Three First Chapters of the First Book of Moses called Genesis… (d. 1648; London, 1656), on 1:1, sect. 3</cite>, p. 7</span></figcaption>

</figure><figure class="quote" id="q-9f06d33a7f" data-kw="">
<blockquote><p>How long is it since God did create the world? Four thousand years before the birth of our Saviour Christ, and so about 5614 years before this time. Why is the order of the years of the world so carefully set down in the Scripture? 1. To convince all heathen that either thought that the world was without beginning, or that it began millions of years before it did. 2. To give light to all sacred histories of the Bible… … How long was God creating the world? Six days and six nights. Why was He creating so long, seeing He could have perfected all the creatures at once and in a moment? First, to show the variety, distinction and excellency of his several creatures. Secondly, to teach us the better to understand their workmanship, even as a man which will teach a child in the frame of a letter will first teach him one line of the letter, and not the whole letter together. Thirdly, to admonish us that we are bound to bestow more time in discerning and knowing them than we do. Fourthly, that we might also by his example finish our work in six days. Fifthly, that we might observe, that many of the creatures were made before those which are ordinarily their causes, and thereby learn, that the Lord is not bound to any creature, or to any means: thus the sun was not created before the fourth day, and yet days which now are caused by the rising of the sun were before that; so trees and plants were created the third day, but the sun, moon and stars, by which they are now nourished and made to grow, were not created till after the third day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity... (1645), A Large Explication of the Body of Christian Religion</cite>, pp. 96-97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

quote%2F9f06d33a7f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9f06d33a7f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/creation/on-westminsters-in-the-space-of-six-days/#:~:text=How%20long%20is%20it%20since%20God,created%20till%20after%20the%20third%20day." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ac26449f03" data-kw="six days creation">
<blockquote><p>Creation may be viewed either in general with regard to the production of the whole universe, or in particular with regard to the production of its various parts in the six days of creation. In the latter, their creation is first set forth, then their distinction and lastly their adornment. In all these, God demonstrates his power splendidly in the production of all things (great as well as small) ex nihilo by his word alone; his wisdom, in their variety, order and use; his goodness, in the communication of himself (by which he made all things very good).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 5.1</span></figcaption>

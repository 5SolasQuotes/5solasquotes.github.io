<main class="wrap"><figure class="quote" id="q-6bd547e403" data-kw="">
<blockquote><p>And have this in your eye in all religious exercises, that by them you may be made more serious; and that the impressions of other holy exercises may be the deeper, and take the faster hold, let me advise young people that are sober-minded, to come betimes to the ordinance of the Lord’s supper. Let me press it upon them, not only as a duty they owe to Christ, but as that which will be of great advantage to themselves to strengthen their resolutions, with purpose of heart to cleave to the Lord.

Those who keep off from it, it is either because they know they are not sober-minded, or because they are not determined to continue so; but none of you will own either of those reasons. Delay not therefore by that most sacred solemn bond, to join your selves to the Lord in a perpetual covenant, never to be forgotten.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sober-Mindedness Pressed upon Young People, in a Discourse on Titus II.6</cite>, (1712) in The Complete Works of the Rev. Matthew Henry; Being a Collection of all his Treatises, Sermons, and Tracts, as Published by Himself: And a Memoir of his Life (2 vols, Edinburgh: A. Fullarton and Co., 1853), 1: 82.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-10c1d13cb1" data-kw="">
<blockquote><p>[S]eek him in the word and sacraments, where he discovers himself familiarly … And how familiarly by the sacrament, by common bread and common wine, sanctified to do great matters above nature, to strengthen faith. He cometh to us through our faces, into our souls in the sacrament … He comes by familiar things, and by a familiar manner of conveying, as if he should name every one, ‘I come to thee, and give thee my body.’ Think with ourselves, Now Christ cometh to me; when the minister reacheth the bread and comes to me, think of heavenly bread, and of the gift of Christ to me by the means.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Heavenly Conference</cite>, (1654; Edinburgh: Banner of Truth, 2015), pp 21-22.</span></figcaption>

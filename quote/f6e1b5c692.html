<main class="wrap"><figure class="quote" id="q-f6e1b5c692" data-kw="">
<blockquote><p>[The Galatians] joined the works of the law with Christ and his grace in the cause of their justification and salvation. Here it must be observed that they which make a union of grace and works in the cause of justification are separated from the grace of God. Grace admits no partner or fellow. Grace must be freely given every way, or it is no way grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, vol. 2: Commentary on Galatians, ed. Paul M. Smalley (Grand Rapids: Reformation Heritage Books, 2015), 29. (Emphasis added. HT: Chad Vegas)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-70d3190d07" data-kw="">
<blockquote><p>XVII. (2) The adjudication of eternal life, with respect to its right (Rom. 6:22; Jn. 3:16), for when the guilt of eternal death is taken away through absolution, the right of eternal life cannot but follow it. So that from this, it is perceived with no trouble that there is not a real distinction between absolution from eternal death and adjudication of eternal life. For just as there is also not a real difference between satisfaction and merit, such that absolution must be sought in only satisfaction and the right to eternal life in only merit, and then the former, that is, satisfaction, in only passive righteousness, and the latter in only active. For the dikaioma on account of which we are justified, as it includes without division both forms of the righteousness of Christ, so also it provides without division the cause on account of which also we are freed from the guilt of sin, and receive the right to every good, just as we taught elsewhere explicitly (1.5.18 §XIV; §XI, above).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 5, ch. 6, the Justification of those to be Redeemed</span></figcaption>

opener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ff91dfbf90" data-kw="">
<blockquote><p>[Ludwig] Lucius [d. 1642] a learned [Swiss reformed] writer says, ‘Justification is therefore attributed to resurrection [Rom. 4:25], because it was the complete and ultimate act of Christ’s active obedience;’ and from hence infers, ‘That remission of sin is attributed to his passive, and justification to his active obedience.’ … That the whole nature of justification is not comprehended in remission and forgivenesse of sins. To clear this, consider first, that there are different opinions, not only between the [Reformed] Orthodox and their adversaries, but also amongst the Orthodox themselves in this great privilege of remission of sins; [1.] For some make justification in the whole nature of it to lie in forgiveness of sins. Thus Piscator and Wotton with all diligence set themselves to assert this, and many others, who deny the imputation of Christ’s active obedience to the believer; I say ‘many’, for some, though they deny the imputation of Christ’s active obedience, yet grant justification to be more than remission, herein forsaking Piscator. (Mr Gataker, Animadversions on Luke) Bellarmine would charge this upon Calvin as his different opinion from other Protestants, but it may be easily cleared that Calvin does, by placing our justification in remission of sin, only oppose inherent renovation against the Papists, not the imputed righteousness of Christ; witness his exposition on this text [Rom. 4:25], beside other places. Indeed Vorstius while orthodox does say (Antibellarmine, ‘On Justification’), If we place justification only in remission of sins, we may the more easily answer all the Popish objections, neither shall we then be so obnoxious to their malignant calumnies. 2. Others they make remission of sin not to be any part, much less the whole of justification, but the effect and result of it. Thus for the satisfaction of Christ, we being accounted just before God, thereby we come to have remission of sins. There are learned men [that] go this way (Bradshaw, Gataker). 3. The Popish writers, they make remission of sin a concomitant of our justification, which they place in our internal renovation. Lastly, There are those who make remission of sins an integral part of our justification; for they say, The whole nature of justification consists in these two parts, remission of sin and imputation of righteousness; which indeed of these has the priority is disputed, but that is not much material. And surely if we regard the expressions of the Scripture, this seems to have most truth in it; and with these later, I joyn myself. Neither may it seem such an absurd thing to place justification in two particulars, as if the form of it ought necessarily to be single, for we are not to speak of justification as natural forms which consist in indivisibili [indivisible things], but we are to look upon it as a favor and priviledge of God, which He vouchsafes to his children, and to the integral constituting whereof there may be as many ingredients as God shall put in; neither are imputation of righteousness and remission of sins so disparate but that they may well concur to one thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, … (London: Underhill, 1654), pt. 2, sect. 4, sermon 27, ‘That the whole nature of justification is not comprehended in remission and forgiveness of sin’, pp. 264-65</span></figcaption>

<blockquote><p>If there is any head of Christian doctrine about which it is absolutely necessary to agree to obtain eternal life, it is that in which it is taught not only concerning the righteousness which is required of us before the judgment-seat of God, but also about the sure way of obtaining it, by the pure, unadulterated Word of God. Therefore, we owe great thanks to the Most High God, because in our times that jewel, so deeply buried in the extraordinary cunning of Satan and the sophists, I have dug up again, and it could not be brought back into the bright light even now without very great difficulties. And it has most uniformly wanted to be acknowledged in the greatest consensus of all the restored churches and asserted against all the attempts of the adversaries. But they make the faith of all theologians in this matter, that to which we owe the Christianity asserted by the tyranny of the Antichrist. The opinion in this head [of doctrine] is held in harmony, held publicly so many times not only in Germany, but also in Switzerland, and confirmed elsewhere in gatherings, and finally, clearly expressed in the published confessions of all nations. It could therefore rightly appear astonishing that several people dwelling in the very heart of the church are blind in such clear light, that not only do they not rejoice at the sight of it, but they also do not allow others to rejoice with peaceful consciences, if the Holy Spirit Himself long ago and the perpetual history of the church had not taught us about the false prophets to come, even at the last time. Such men appeared who had set out from the very school of Dr. Luther and of the great Philip Melanchthon, just as Cerinthus and Hebrion once did from the very company of the apostles. Wicelius, Staphylus, Osiander, Islebius, men whose memory must be contested, went out from us, since they were not from us. Such also is that anonymous man, a certain follower or perhaps a leader himself. Whichever of these he may be, there is blindness in these matters and audacity in asserting his allurements. I hope that all the learned and godly will come to know this from this response of ours.</p></blockquote>

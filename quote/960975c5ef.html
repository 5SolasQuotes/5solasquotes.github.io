<main class="wrap"><figure class="quote" id="q-960975c5ef" data-kw="">
<blockquote><p>Since Paul knew that justification of faith is a refuge for those who lack righteousness of their own [cf. Romans chapter 5], he boldly infers that all who are justified by faith are excluded from works righteousness. But since it is certain that this is common to all believers, from this fact Paul with equal assurance determines that no one is justified by works [cf. Romans 3:20]—on the contrary, that men are justified without any help from our works. But it is one thing to discuss what value works have of themselves, another, to weigh in what place they are to be held after faith righteousness has been established. If we are to determine a price for works according to their worth, we say that they are unworthy to come before God’s sight; that man, accordingly, has no works in which to glory before God; that hence, stripped of all help from works, he is justified by faith alone. But we define justification as follows: the sinner, received into communion with Christ, is reconciled to God by his grace, while, cleansed by Christ’s blood, he obtains forgiveness of sins, and clothed with Christ’s righteousness as if it were his own, he stands confident before the heavenly judgment seat. After forgiveness of sins is set forth, the good works that now follow are appraised otherwise than on their own merit. For everything imperfect in them is covered by Christ’s perfection, every blemish or spot is cleansed away by his purity in order not to be brought in question at the divine judgment. Therefore, after the guilt of all transgressions that hinder man from bringing forth anything pleasing to God has been blotted out, and after the fault of imperfection, which habitually defiles even good works, is buried, the good works done by believers are accounted righteous, or, what is the same thing, are reckoned as righteousness [Romans 4:22].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.17.8 (Battles edn)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c847866ae" data-kw="">
<blockquote><p>3. In the promises. The law promises life to those who are righteous in themselves, or on the condition of righteousness, and perfect obedience. “He that doeth them, shall live in them.” “If thou wilt enter into life, keep the commandments.” (Lev. 18:5. Matt. 19:17.) The gospel, on the other hand, promises life to those who are justified by faith in Christ, or on the condition of the righteousness of Christ, applied unto us by faith. The law and gospel are, however, not opposed to each other in these respects: for although the law requires us to keep the commandments if we would enter into life, yet it does not exclude us from life if another perform these things for us. It does indeed propose a way of satisfaction, which is through ourselves, but it does not forbid the other, as has been shown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. G. W. Williard (Cincinnati, OH: Elm Street Printing Company, 1888), 104–05.</span></figcaption>

<blockquote><p>18. That imputation of the righteousness of Christ is neither fictitious, nor ideal, nor absurd; nor does it overthrow the δικαιοκρισία [dikaiokrisia, righteous judgment] of God, nor does it clash with human reason or practice. Nay, it is established by the Pontificals themselves through the trafficking of papal indulgences and the market of satisfactions and pardons, where the λογισμός [logismos, reckoning/imputation] and communication of another’s righteousness — albeit fictitious — is manifestly taught. It is no wonder, however, that the imputation of the righteousness of Christ is denied and opposed in this matter by those who neither know nor feel the union of ourselves with Christ and the power and efficacy thereof, and who prefer the means of salvation to be profitable to themselves [as independent workers] rather than gratuitous.</p></blockquote>

<blockquote><p>XXVII. Regarding the acts of faith, many Reformed theologians usually distinguish three acts or parts of justifying faith. The first is knowledge by which we recognize and understand the Word of God, at least in terms of what is necessary for salvation. The second is assent that we give to all that has been revealed to us in the Word of God. The third is confidence by which the believer specifically applies the general promise of the word to themselves. This is the teaching of Ursinus and Pareus in the Catechetical Explanations, question 21; of Wendelinus in Christian Theology, book 2, chapter 24, Thesis 13, 14, &amp; 15; of Tilenus in a disputation on justifying faith, Thesis 20; and also of Trelcatius in the above-cited location. … XLVI. Moreover, many doctors of the Reformed school, as we saw above, count confidence among the acts of faith; but they want it to be the proper formal and specific act of faith, and its primary part. Yet, others seem to be of a different opinion; they teach that confidence is indeed an outcome and effect of faith, but not an act of faith properly said. This is among others the opinion of Garrissoles, a professor at Montauban Academy while he was alive. ‘If you ask whether faith is not confidence,’ he says: ‘I respond that confidence indeed adheres to faith with an indissoluble bond, yet, if we speak properly, it is not faith, but an effect, springing necessarily as it were from faith.’ (in the Explanation of the Catechism of Christian Religion, on the eighteenth section.) XLV. Beza held the same opinion, writing about Paul’s words in Eph. 3, where it says, ‘In whom we have boldness and access with confidence by the faith of him,’ deducing that confidence differs from faith as an effect from its cause. ‘From this passage,’ he says: ‘it is clearly apparent that confidence differs from faith as an effect from a cause, and therefore it is mistakenly substituted for faith by some, even though these two always coexist.’ Peter du Moulin also teaches the same in his Second Disputation on Justification and Justifying Faith, thesis 19 and subsequent. ‘We consider,’ he says, ‘faith and confidence to be different, and the latter to be the inseparable fruit and effect of the former.’ To which Anthony Faius adds, in Theses Disputed in Geneva, thesis 20: ‘The liberty through which access to God is easy, and the confidence through which we cry Abba Father, are effects of faith.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“XXVII. Regarding the acts of faith, many Reformed theologians usually distinguish three acts or parts of justifying faith. The first is knowledge by which we recognize and understand the Word of God, at least in terms of what is necessary for salvation. The second is assent that we give to all that has been revealed to us in the Word of God. The third is confidence by which the believer specifically applies the general promise of the word to themselves. This is the teaching of Ursinus and Pareus in the Catechetical Explanations, question 21; of Wendelinus in Christian Theology, book 2, chapter 24, Thesis 13, 14, &amp; 15; of Tilenus in a disputation on justifying faith, Thesis 20; and also of Trelcatius in the above-cited location. … XLVI. Moreover, many doctors of the Reformed school, as we saw above, count confidence among the acts of faith; but they want it to be the proper formal and specific act of faith, and its primary part. Yet, others seem to be of a different opinion; they teach that confidence is indeed an outcome and effect of faith, but not an act of faith properly said. This is among others the opinion of Garrissoles, a professor at Montauban Academy while he was alive. ‘If you ask whether faith is not confidence,’ he says: ‘I respond that confidence indeed adheres to faith with an indissoluble bond, yet, if we speak properly, it is not faith, but an effect, springing necessarily as it were from faith.’ (in the Explanation of the Catechism of Christian Religion, on the eighteenth section.) XLV. Beza held the same opinion, writing about Paul’s words in Eph. 3, where it says, ‘In whom we have boldness and access with confidence by the faith of him,’ deducing that confidence differs from faith as an effect from its cause. ‘From this passage,’ he says: ‘it is clearly apparent that confidence differs from faith as an effect from a cause, and therefore it is mistakenly substituted for faith by some, even though these two always coexist.’ Peter du Moulin also teaches the same in his Second Disputation on Justification and Justifying Faith, thesis 19 and subsequent. ‘We consider,’ he says, ‘faith and confidence to be different, and the latter to be the inseparable fruit and effect of the former.’ To which Anthony Faius adds, in Theses Disputed in Geneva, thesis 20: ‘The liberty through which access to God is easy, and the confidence through which we cry Abba Father, are effects of faith.&#x27;”

— Louis Le Blanc, Theological Theses put forth at Various Times at the Academy of Sedan, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXVII.+Regarding+the+acts+of+faith%2C+many+Reformed+theologians+usually+distinguish+three+acts+or+parts+of+justifying+faith.+The+first+is+knowledge+by+which+we+recognize+and+understand+the+Word+of+God%2C+at+least+in+terms+of+what+is+necessary+for+salvation.+The+second+is+assent+that+we+give+to+all+that+has+been+revealed+to+us+in+the+Word+of+God.+The+third+is+confidence+by+which+the+believer+specifically+applies+the+general+promise+of+the+word+to+themselves.+This+is+the+teaching+of+Ursinus+and+Pareus+in+the+Catechetical+Explanations%2C+question+21%3B+of+Wendelinus+in+Christian+Theology%2C+book+2%2C+chapter+24%2C+Thesis+13%2C+14%2C+%26+15%3B+of+Tilenus+in+a+disputation+on+justifying+faith%2C+Thesis+20%3B+and+also+of+Trelcatius+in+the+above-cited+location.+%E2%80%A6+XLVI.+Moreover%2C+many+doctors+of+the+Reformed+school%2C+as+we+saw+above%2C+count+confidence+among+the+acts+of+faith%3B+but+they+want+it+to+be+the+proper+formal+and+specific+act+of+faith%2C+and+its+primary+part.+Yet%2C+others+seem+to+be+of+a+different+opinion%3B+they+teach+that+confidence+is+indeed+an+outcome+and+effect+of+faith%2C+but+not+an+act+of+faith+properly+said.+This+is+among+others+the+opinion+of+Garrissoles%2C+a+professor+at+Montauban+Academy+while+he+was+alive.+%E2%80%98If+you+ask+whether+faith+is+not+confidence%2C%E2%80%99+he+says%3A+%E2%80%98I+respond+that+confidence+indeed+adheres+to+faith+with+an+indissoluble+bond%2C+yet%2C+if+we+speak+properly%2C+it+is+not+faith%2C+but+an+effect%2C+springing+necessarily+as+it+were+from+faith.%E2%80%99+%28in+the+Explanation+of+the+Catechism+of+Christian+Religion%2C+on+the+eighteenth+sec

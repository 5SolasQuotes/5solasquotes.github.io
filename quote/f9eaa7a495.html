<main class="wrap"><figure class="quote" id="q-f9eaa7a495" data-kw="">
<blockquote><p>Grace is not born in us. … Even the children of saints are born in sin. Grace doth not run in the blood. Inherent holiness is not propagated, which yet doth not impede the propagation of federal holiness. Though the seed of believers are born polluted it doth not therefore follow that they are not born privileged. David who acknowledgeth the corruption his mother bore him in (Ps. 51:5) yet pleads the privilege his mother bore him to (Ps. 116:16, the son of thy handmaiden; so Ps. 86:16). Though a wise man do not beget a wise man, yet a freeman begets a freeman. I was born free, saith Paul.

We are all born diseased and impotent, but being born of believers we are born by the pool-side, not always under the internal but always under the external administration of the covenant. Israel as the seed of Abraham were transgressors from the womb, but as the seed of Abraham, to them pertained the adoption (Rom. 9:4). Those who will not admit this blessing of Abraham to come upon the Gentiles must expunge it out of their Bibles (Gal. 3:7, 14; Acts 2:39).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the Covenant of Grace</cite>, ed. Allan Harman (1692; Fearn: Christian Focus, 2002), pp 139-40.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-db6ca67493" data-kw="">
<blockquote><p>The necessity for His death is brought out with an unusual illustration in Hebrews 9, that of a man’s last will and testament. When a man makes a will, it is necessary for his death to occur before the terms of the will become operative. As long as he lives, nothing happens. Now the Greek word διαθήκη, which the writer employs for ‘will’, is used in the Greek Old Testament to translate the Hebrew word בְּרִית, meaning ‘covenant’. It is unmistakably the usual Greek word for a ‘will’. But there is an air of finality about a will. You cannot dicker with a testator. You accept what he leaves you on the conditions he lays down, or you reject it. You have no other line of action.

The one-sidedness of this process seems to have appealed to those who translated the Old Testament into Greek as a better way of characterizing the covenants God makes with men than συνθήκη, the usual word for ‘agreement’. This word might be taken as suggesting a relative equality, an ability on man’s side to make conditions. This is totally false. Man accepts the covenant on God’s terms or he rejects it. He has no other option. Thus the word in Greek at large means a will, and in the Old Testament it means a covenant.

In Hebrews 9:16f. it seems that the writer is playing on the double meaning of the word. Jesus establishes the new διαθήκη, or ‘covenant’, and His death is necessary to establish it, just as necessary as is the death of any testator to establish his διαθήκη, his ‘will’. No διαθήκη is of force without a death. The line of reasoning is perhaps one that we would not have employed. But we are dealing with a first-century writing, not one from the twentieth century. And the point the writer is making is that the death of Christ is an absolute necessity. A ‘will’ is completely inoperative until the testator dies. And Christ’s new ‘covenant’ is likewise inoperative until the death of Christ. Without that the whole Christian system would be impossible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leon-morris.html">Leon Morris</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cross in the New Testament</cite>, (Grand Rapids MI; Eerdmans, 1965), pp 278-79.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-a23157ae34" data-kw="">
<blockquote><p>Secondly, Consider we the Law as in the administration of it to Moses, and so to the people of the Jews: The administration of the Law to them it was under another notion, it was to bring them to Christ, and that they might come to see their inability of keeping of that Covenant, and come to understand Christ so much the more, and to be driven unto Christ by having the Law presented to them, God did never intend by giving of the Law to the people of the Jews that it should be a Covenant of eternal life to them; indeed there was this in the administration of it somewhat different from us, some special Covenant about their living in Canaan, and about mercies in that promised Land, beyond that that we have in the Law, as we find in the new Testament, they (I say) had this annexed to it.

The Law that was first given unto Adam and written in his heart, afterwards even obliterated, then it was transcribed by the same hand in tables of stone and given unto them chiefly to shew them their misery, and their need of Christ; to be a preparation for Christ’s coming into the world; and with this one addition beyond what we have in the new Testament, that there was a temporal Covenant annexed unto it, that concerned their living prosperously in the Land of Canaan, (&amp; so far we are delivered even from the Law as it was given by Moses, that is, from the connexion of the Covenant that was added unto the delivering of the Law) concerning their happy and comfortable condition in the Land of Canaan upon the keeping of their Law; but now (how ever it was) certainly that Conversation that becomes the Gospel should be beyond what could be even from godly men in the time of the Law.

As first, The Law to them it was given under low Promises, their promises were but very low that were under the Law: It’s true, they had somewhat of the Gospel that we have, but extreme darkly, and very little that they knew of it, but the chief Ministration of God towards them was then in a legal way, and that had but low promises, as their living in Canaan; you shall find generally al the promises that are annexed to the Law even by Moses, it is but, that they shall prolong their days in the Land the Lord their God shall give them, That they should be blest in their basket and store: their Promises were under Heaven-Promises, Promises of this life only; and therefore it could raise them but to a very low degree of holiness.

Secondly, Their Ordinances were but poor and mean, and beggarly in comparison of our; for so the Gospel calls them, Col. 2. They were but beggarly rudiments, which stood only in meats and drinks, and divers washings, and carnal Ordinances imposed on them until the time of reformation. Heb. 9. 10. They had an earthly Tabernacle, a worldly Sanctuary, Heb. 9. 1. &amp;c.

Thirdly, The burden of them under the Law was very great, they were under a heavy yoke &amp; burden that did bow them down: A man that is under a heavy burden it makes him stoop &amp; bend in the back, he cannot stand so upright nor fast as others that have no such weight upon them. Fourthly, The administration of the Law was with Thunder and Lightning very terrible, It made even Moses quake and tremble, (as the Author to the Hebrews speaks.)

Fifthly, Their spirits were very servile under the Law, they were subject to bondage even all their days; God so ordered things as to carry on his people even in a very servile way, they were but mean servants then, hewers of wood and drawers of water.

But now under the Gospel, First, our Promises are far better, and our Covenant better, in Heb. 8. 6. there the Apostle compares their Condition and ours, Who serve (saith he) unto the example and shadow of heavenly things, There was but the shadow of heavenly things; the Gospel hath the Heavenly things themselves, and they are but the shadow, for so you have it in Heb. 10. 1. For the Law having a shadow of good things to come, and not the very image of the things: They had but a shadow of good things to come, and not the very image it self. As Moses was admonished of God, when he was about to make the Tabernacle, For see (saith he) that thou make all things according to the pattern shewed to thee in the Mount.

And then in Heb. 8. 6. But now hath he obtained a more excellent Ministry, [that’s Christ] By how much also he is the Mediator of a better Covenant, which was established upon better promises: A better Covenant, and stablished upon better promises, or a better Testament: Their promises I say were but low and mean; and our promises are high and precious, and we have a better Covenant, a Covenant not of living in the Land of Canaan, but of Heaven, of which that Canaan was but a Type, and therefore our Conversations should rise higher in holiness according as our Covenant and Promises are better than theirs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel-conversation: wherein is shewed, I. How the conversation of believers must be above what could be by the light of nature. II. Beyond those that lived under the law. III. And suitable to what truths the Gospel holds forth</cite>, (London: Peter Cole, 1650), pp 47-49.</span></figcaption>

%29+certainly+that+Conversation+that+becomes+the+Gospel+should+be+beyond+what+could+be+even+from+godly+men+in+the+time+of+the+Law.%0A%0AAs+first%2C+The+Law+to+them+it+was+given+under+low+Promises%2C+their+promises+were+but+very+low+that+were+under+the+Law%3A+It%E2%80%99s+true%2C+they+had+somewhat+of+the+Gospel+that+we+have%2C+but+extreme+darkly%2C+and+very+little+that+they+knew+of+it%2C+but+the+chief+Ministration+of+God+towards+them+was+then+in+a+legal+way%2C+and+that+had+but+low+promises%2C+as+their+living+in+Canaan%3B+you+shall+find+generally+al+the+promises+that+are+annexed+to+the+Law+even+by+Moses%2C+it+is+but%2C+that+they+shall+prolong+their+days+in+the+Land+the+Lord+their+God+shall+give+them%2C+That+they+should+be+blest+in+their+basket+and+store%3A+their+Promises+were+under+Heaven-Promises%2C+Promises+of+this+life+only%3B+and+therefore+it+could+raise+them+but+to+a+very+low+degree+of+holiness.%0A%0ASecondly%2C+Their+Ordinances+were+but+poor+and+mean%2C+and+beggarly+in+comparison+of+our%3B+for+so+the+Gospel+calls+them%2C+Col.+2.+They+were+but+beggarly+rudiments%2C+which+stood+only+in+meats+and+drinks%2C+and+divers+washings%2C+and+carnal+Ordinances+imposed+on+them+until+the+time+of+reformation.+Heb.+9.+10.+They+had+an+earthly+Tabernacle%2C+a+worldly+Sanctuary%2C+Heb.+9.+1.+%26c.%0A%0AThirdly%2C+The+burden+of+them+under+the+Law+was+very+great%2C+they+were+under+a+heavy+yoke+%26+burden+that+did+bow+them+down%3A+A+man+that+is+under+a+heavy+burden+it+makes+him+stoop+%26+bend+in+the+back%2C+he+cannot+stand+so+upright+nor+fast+as+others+that+have+no+such+weight+upon+them.+Fourthly%2C+The+administration+of+the+Law+was+with+Thunder+and+Lightning+very+terrible%2C+It+made+even+Moses+quake+and+tremble%2C+%28as+the+Author+to+the+Hebrews+speaks.%29%0A%0AFifthly%2C+Their+spirits+were+very+servile+under+the+Law%2C+they+were+subject+to+bondage+even+all+their+days%3B+God+so+ordered+things+as+to+carry+on+his+people+even+in+a+very+servile+way%2C+they+were+but+mean+servants+then%2C+hewers+of+wood+and+drawers+of+water.%0A%0ABut+now+under+the+Gospel%2C+First%2C+our+Promises+are+far+better%2C+and+our+Covenant+better%2C+in+Heb.+8.+6.+there+the+Apostle+compares+their+Condition+and+ours%2C+Who+serve+%28saith+he%29+unto+the+example+and+shadow+of+heavenly+things%2C+There+was+but+the+shadow+of+heavenly+things%3B+the+Gospel+hath+the+Heavenly+things+themselves%2C+and+they+are+but+the+shadow%2C+for+so+you+have+it+in+Heb.+10.+1.+For+the+Law+having+a+shadow+of+good+things+to+come%2C+and+not+the+very+image+of+the+things%3A+They+had+but+a+shadow+of+good+things+to+come%2C+and+not+the+very+image+it+self.+As+Moses+was+admonished+of+God%2C+when+he+was+about+to+make+the+Tabernacle%2C+For+see+%28saith+he%29+that+thou+make+all+things+according+to+the+pattern+shewed+to+thee+in+the+Mount.%0A%0AAnd+then+in+Heb.+8.+6.+But+now+hath+he+obtained+a+more+excellent+Ministry%2C+%5Bthat%E2%80%99s+Christ%5D+By+how+much+also+he+is+the+Mediator+of+a+better+Covenant%2C+which+was+established+upon+better+promises%3A+A+better+Covenant%2C+and+stablished+upon+better+promises%2C+or+a+better+Testament%3A+Their+promises+I+say+were+but+low+and+mean%3B+and+our+promises+are+high+and+precious%2C+and+we+have+a+better+Covenant%2C+a+Covenant+not+of+living+in+the+Land+of+Canaan%2C+but+of+Heaven%2C+of+which+that+Canaan+was+but+a+Type%2C+and+therefore+our+Conversations+should+rise+higher+in+holiness+according+as+our+Covenant+and+Promises+are+better+than+theirs.%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+Gospel-conversation%3A+wherein+is+shewed%2C+I.+How+the+conversation+of+believers+must+be+above+what+could+be+by+the+light+of+nature.+II.+Beyond+those+that+lived+under+the+law.+III.+And+suitable+to+what+truths+the+Gospel+holds+forth%2C+%28London%3A+Peter+Cole%2C+1650%29%2C+pp+47-49.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa23157ae34.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a23157ae34.html">Permalink</a><a class="src" href="http <blockquote><p>Third, because every agent acts by its form; hence the manner in which it has its form is the manner in which it is an agent. Therefore whatever is primarily and essentially an agent must be primarily and essentially form. Now God is the first agent, since He is the first efficient cause. He is therefore of His essence a form; and not composed of matter and form.</p></blockquote>

<blockquote><p>Q. 32 Why is this covenant also called a testament?

A. First, because the term testament began to be used in the church instead of the term covenant.

Second, because just as a testament is not valid without the death of the testator, so also this covenant could not be valid without the death of Christ.

Q. 33 What is the difference between the Old and the New Testament?

A. It is the same testament or covenant of God with all the elect from the first promise given in Paradise, concerning the seed of the woman who would crush the head of the serpent, to the end of the world.

But they are called Old and New Testaments because some of the circumstances and signs of the covenant were changed.

First, in the Old they believed in the Christ who was still to come; in the New we believe in the Christ who has been revealed.

Second, the Old contained the promise of the preservation of the nation of Israel until the time of Christ; in the New we have only the general promise of the preservation of the church under various governments.

Third, the Old had levitical ceremonies, for which, having been abolished in the New, Christ instituted baptism and the Lord’s supper.

Fourth, the Old was more obscure; the New is clearer.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c93c333fae" data-kw="Hardening|Satan|Justice" data-pol="">
<blockquote><p>God is said to blind and to harden men not only negatively (by not enlightening and softening) and privatively (by withdrawing his grace whatever it may have been after men have abused it) and permissively (by not hindering), but also positively. Not by bringing in blindness or hardness (which is natural to man), but both objectively by presenting external objects to them which although ordained to another direction by their own nature, yet he knows will be drawn in a different way by their vice; and judicially by smiting them internally with blindness (the light which they abused being taken away or extinguished); and by loosening the reins to their lusts and delivering them up and enslaving them to Satan.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 6.7.28</figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c93619138f" data-kw="Hardening|Justice|Satan" data-pol="">
<blockquote><p>As for those wicked and ungodly men whom God, as a righteous judge, for former sins, doth blind and harden; from them He not only withholdeth his grace, whereby they might have been enlightened in their understandings, and wrought upon in their hearts; but sometimes also withdraweth the gifts which they had, and exposeth them to such objects as their corruption makes occasions of sin; and withal, gives them over to their own lusts, the temptations of the world, and the power of Satan.</p></blockquote>
<figcaption>— <a href="../authors/westminster-assembly.html">Westminster Assembly</a>, <cite>Westminster Confession of Faith</cite>, 5.6</figcaption>

</figure><figure class="quote" id="q-400669531f" data-kw="Hardening|Justice|Reprobation" data-pol="">
<blockquote><p>Thus, God is said to harden a wicked man because of his demerits when, being provoked by that man’s impiety, He takes occasion to withdraw granted grace and to do certain things through which He knows that this man will grow worse.</p></blockquote>
<figcaption>— <a href="../authors/john-davenant.html">John Davenant</a>, <cite>On Predestination and Reprobation</cite>, ch. 8</figcaption>

</figure><figure class="quote" id="q-14ba01d57f" data-kw="Hardening|Justice" data-pol="">
<blockquote><p>God certainly does not in either case effect or infuse blindness or hardness into the sinner (cf. James 1:13–14), yet neither does he only not take away blindness and hardness, by not circumcising the heart (Jer. 6:10, 26; Acts 7:51), or by not conferring spiritual light to the mind, or softness and malleability to the heart (Matt. 13:14–15; Isa. 6:9–10), but in addition: (1) on account of preceding sins, in a just and holy way, he takes away or diminishes the remnants of wisdom and moral goodness that a sinner has, and also augments and aggravates his original blindness and hardness.</p></blockquote>
<figcaption>— <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a>, <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §20</figcaption>

</figure><figure class="quote" id="q-dda3160a8c" data-kw="Hardening|Free Will|Justice" data-pol="">
<blockquote><p>For in those people God did not make the common sins but found them there, as we have noted before. And although God, in his just but to us hidden judgment, does abandon and harden them more and more (Romans 9:18), yet it is they who by their own free choice first become hardened (Romans 11:7) and abandon the benefits of general providence; they abuse God’s longsuffering, as Paul testifies in Romans 1:18, 26, and 28.</p></blockquote>
<figcaption>— <a href="../authors/antonius-walaeus.html">Antonius Walaeus</a>, <cite>Synopsis of a Purer Theology (Leiden Synopsis)</cite>, Disp. 24, On Divine Predestination</figcaption>

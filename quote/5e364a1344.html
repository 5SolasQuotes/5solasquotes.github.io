<blockquote><p>2. Such a Baptism that is valid, as touching the substance of the seal, as is in Rome: such a Church according to the metaphysic entity and being of a Church, is Rome a Ministerial Church, teaching necessary fundamentals, though darkening and contradicting all; but it is not morally a true Church, but leprous and unclean. See what Junius, Whitaker, Calvin and Rivetus say hereupon…</p></blockquote>

</figure><figure class="quote" id="q-8c90bef990" data-kw="">
<blockquote><p>V. To make this clear, it must be observed that for the Reformed to seek peace and unity with other Protestants, it suffices if, after weighing and accurately judging everything according to God’s word, it appears that the remaining controversies between them are not such as to undermine the foundations of the Christian religion and true piety toward God. Thus, they can tolerate each other and recognize each other as brothers in Christ.

VI. This was the basis of the concord established a few years ago at Kassel between the theologians of Marburg and Rinteln. After both sides clearly and distinctly explained their doctrines and views to each other, and saw to what extent they agreed and what real differences remained, it was mutually acknowledged in good faith that what remained was not so significant as to prevent them from maintaining Christian and religious communion. Thus, they agreed on mutual tolerance and decided not to attack or insult each other but to maintain their own views until God revealed the truth to all while still communicating when the occasion arose, which has since been the practice.

VII. This was also the principle by which Paul attempted to reconcile believers of his time who contended among themselves over the observance of legal rites. He wanted those better instructed in Christian liberty, who had learned from the gospel that Mosaic ceremonies were abolished by Christ, to tolerate and bear with those still scrupulous about this matter and thought themselves bound to keep Mosaic ceremonies. He instructed them to admit such weak-in-faith individuals to their communion and not trouble their consciences by urging them to renounce their beliefs. This is reflected in Paul’s words to the Romans, “Accept the one whose faith is weak, without quarreling over disputable matters” (Romans 14:1), and to the Philippians, “If on some point you think differently, that too God will make clear to you. Only let us live up to what we have already attained” (Philippians 3:15-16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether from the proposed Reformed and Lutheran union, union with the Roman Church follows’ in Theological Theses Published at Various Times</cite>, ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), pp. 950-57 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-25f7b99c98" data-kw="">
<blockquote><p>Must you defy your mother, because you see your brethren fighting? Their dissension is her grief: Must she lose some sons, because some others quarrel? Do not so wrong yourself in afflicting her. Will you love Christ the less because his coat is divided? Yea, let me boldly say, The hem is torn a little, the garment is whole; or rather it is fretted a little, not torn; or rather the fringe, not the hem. Behold, here is one Christ, one Creed, one Baptism, one heaven, one way to it; in sum, one religion, one foundation, and (take away the tumultuous spirits of some rigorous Lutherans) one heart. Our differences are those of Paul and Barnabas, not those of Peter and Magus: if they be some, it is well they are no more; if many, that they are not capital. Show me that Church that has not complained of distraction; yea that family, yea that fraternity, yea that man that always agrees with himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistles, the Second Volume</cite>, (London: 1608) | 3rd Decade, Epistle 5. To Mr. W.L… our dissensions are no sufficient ground of his suspension…, pp. 55-65</span></figcaption>

="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2ac0a9a91f" data-kw="">
<blockquote><p>…whatsoever a man holds, though his conscience be never so much taken with it, yet if it cannot stand with the power of godliness, but destroys it, if this man be in a Christian society after all means used to reduce him, if he still perseveres in it, he is, notwithstanding his conscience, to be cast out of the society of the saints; This is not a little matter, if a man has any conscience in him, it cannot but be a dreadful thing to him: If poison be got into a glass, and you cannot wash it out, the poison and glass too is to be thrown into the sink: Such a man as this is, with the conscience that he has, is to be thrown upon the dunghill. If a man by his wickedness cuts himself off from the mystical body of Christ, the Church may cut him off from his visible, he has forfeited his Church-priviledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, to the Lovers of Truth and Peace. Heart-Divisions Opened</cite>, … (London: Robert Davvlman, 1653), ch. 6, p. 34</span></figcaption>

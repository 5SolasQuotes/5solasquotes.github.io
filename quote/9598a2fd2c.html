<main class="wrap"><figure class="quote" id="q-9598a2fd2c" data-kw="">
<blockquote><p>I now approach death, heartily satisfied with our excellent Westminster Confession of Faith, Catechisms, and Form of church-government,—and cordially adhering to these Covenants, by which our fathers solemnly bound themselves and their posterity to profess the doctrines and practise the duties therein contained.

I look upon the Secession as indeed the cause of God, but sadly mismanaged and dishonoured by myself and others. Alas! for that pride, passion, selfishness, and unconcern for the glory of Christ, and spiritual edification of souls, which has so often prevailed!—Alas! for our want of due meekness, gentleness, holy zeal, self-denial, hearty grief for sin, compassion to souls in immediate connection with us, or left in the established church, which became distinguished witnesses for Christ. Alas! that we did not chiefly strive to pray better, preach better, and live better than our neighbours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Address to Students of Divinity in John Brown and Ebenezer Brown (eds), Select Remains of the Rev. John Brown, Late Minister of the Gospel at Haddington</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c02becb5ea" data-kw="">
<blockquote><p>It is a very mean apology for them, to tell the world, that the grievance of patronage (that is, the civil law, establishing patronages) has led them to counteract the laws of the only Lord and Lawgiver of Zion. If our author had dealt faithfully with his brethren, and according to the great zeal that he professes, he ought plainly to have told, they ought ‘rather to suffer than sin.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>

</figure><figure class="quote" id="q-7fc339e327" data-kw="">
<blockquote><p>In 1857 the minister of Londonderry Reformed Presbyterian Church, the Revd Robert Nevin, visited the American Covenanter Synod. The letter below informs us of the reaction of the Americans to his visit and their interest in Roman Catholic mission and covenant renewal:

To the Moderator and the members of the Reformed Presbyterian Synod of Ireland.

Dear brethren,

[…] Your brother, Rev. R. Nevin, whose intention of visiting our land you mention, is present with us at our synodical meeting. It gives us great pleasure to say that we have been comforted by his appearing among us. In an address, which at our request he kindly delivered, he gave such and encouraging account of your estate – of the success of your various schemes for adorning the interests of the covenanted cause, especially your mission among the Roman Catholic population and of the fruits of your renewal of the covenants, as made our hearts glad. To us in our trials and difficulties, his words were cheering, and in fact that his kind and seasonable counsel was suited to animate us with a firmer purpose to go forward with the solemn work to which we had assigned the first two days of our meeting. […]

Samuel Sterrit, Mod

John G. Boyd, Clerk</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-sterrit.html">Samuel Sterrit</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Irish Synod, 23 June 1857 (Reformed Presbyterian Historical Library, Knockbracken, American correspondence, no. 19).</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

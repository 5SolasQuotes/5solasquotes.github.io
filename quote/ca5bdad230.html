<main class="wrap"><figure class="quote" id="q-ca5bdad230" data-kw="">
<blockquote><p>We must therefore know, it is not every seperation from that which is called a Church that is a note of an Antichristian spirit, but it must be known whether that were the true Church; now this Church St. John speaks of was the true Church, for it was from such whose sins were forgiven; now if it be not a true Church that they break from, it is no sign of Antichrist: 2 Chron. 11:16, such as set their hearts to seek the Lord, separated themselves from those that followed Jeroboam, and came to Jerusalem; so the apostles were fain to seperate from the Church of the Jews which persecuted Christ, and them, and so constituted a Church by themselves, a Christian Church; so then it is not a seperation from a false Church, but a true, that is a sign of an Antichristian spirit. … Use 2. It may teach us what to judge of the Separatists, or Brownists, are they of Antichrist? Surely their practise is blame-worthy: 1. Because they seperate, where Christ keeps fellowship, Rev. 1:18; and that He walks with us, we argue, because He is still pleased to dispense to us the Word of Life, and edifies many souls thereby, and therefore surely Christ has fellowship, and shall man be more pure than his Maker? where Christ vouchsafes fellowship, shall man renounce it? If they be converted, where had they their conversion? 2. Have not many of God’s servants heretofore kept company with Churches as corrupt as ours are? Did not Peter and John keep company with them and shall they be more pure and curious? 3. Christ commands: ‘If thy brother offends admonish him; if he hear thee not, take two or three more; if he hear not them, then tell it to the Church, and if he hear not the Church, let him be to thee as an heathen, or publican;’ (Mt. 18:17) but if the church hear not thy complaint, He does not say let the church be as an heathen, or publican;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary, or an Exposition with Observations, Reasons, and uses upon the First Epistle General of John (London: Parkhurst, 1658), on 1 Jn. 2:19</cite>, pp. 155-56</span></figcaption>

<blockquote><p>…union has the advantage over division, because: It is a commanded mean tending to edification, which division is not. 2. Division has no less nor fewer inconveniencies following it, nor [is] less destructive to the Church than union in the case supposed; yea, schism is one of the greatest hurts that can come to an orthodox Church, it being next to heresy in doctrine; and therefore no particular evil can be laid in the balance with it. 3. The ills of division are most inevitable, for the ills that follow union, through God’s blessing, may be prevented; it is not impossible, but in the way of division it is, because itself is out of God’s way.</p></blockquote>

</figure><figure class="quote" id="q-891dbcdb70" data-kw="">
<blockquote><p>XI. (4) Disagreements are a prejudice under whichthe evangelical churches labor. But they cannot hinder them from retaining the name of [a] true church, because they agree as to the foundation. And if any differences exist (which God wished to permit in order to prove our faith), they are about articles less necessary, in which there can be a disagreement without touching the essence of saving religion: as the apostolic churches formerly had their differences and stains, as is evident from the Acts of the Apostles and the Pauline epistles; nor were the eastern and western churches, the Latin and the Greek, the African and Italian churches free from them, which did not on that account cease to be true churches. Again, the contentions and differences of the evangelicals are far less than those which are agitated among the Romanists, who, as was seen before, frequently charge each other with heresy. Nor do we notice here the more rigid judgments of some of those who take their name from the great Luther, who, carried away by sinister prejudices, are accustomed to attack us. For however harshly they may have treated us, we do not cease to honor them with brotherly affection. And if, their prejudices and private affections being laid aside, they would seriously examine the thing itself by the law of love, truth and Christian prudence, they would not be so much averse to a pious syncretism and reconciliation with us, or at least a mutual toleration, to which not a few of the more moderate among them are not indisposed.</p></blockquote>

<blockquote><p>The learned and renowned [reformed] professors of Leiden answer [that] the end of synods is not by any means, good or bad, to remove controversies, but to bury them by the power of the Word. 2. Only external peace separated from truth should not be intended [by synods regarding controversies], but [external peace should be] conjoined with truth and peace of conscience.</p></blockquote>

<blockquote><p>22. The heretic is not to be confused with the schismatic: nor is every schismatic to be counted among the number of heretics. For although heretics often become schismatics, and conversely schismatics often become heretics, nevertheless the heretic and the schismatic differ. For first, heretics, corrupting the sincerity of faith with false doctrines, do not always separate themselves from the Church: but schismatics, sometimes even retaining the purity of faith without the stain of heresy, break the bond of brotherly society out of ambition for honor or some function in which they do not want another to be preferred over them, or out of hatred and impatience of divine order and ecclesiastical discipline, or under the pretext of scandals which are committed everywhere. 23. Heretics properly strike against the truth of the doctrines of faith, as heretics: but schismatics against charity, as schismatics: 24. Those who at the same time stumble in the truth of faith and charity, and obstinately defending the error of faith separate themselves from the Church of God, they are at the same time heretics and schismatics. 25. Very often it happens in practice that some orthodox individuals think differently from others, without strife or schism: as Jerome and Augustine. 26. Schismatics either separate themselves entirely from the Church, or in part also from this or that Church in the name of particular offenses.</p></blockquote>

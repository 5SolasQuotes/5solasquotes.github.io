</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-23f7665f4c" data-kw="">
<blockquote><p>But thus they [medieval scholastics] expound themselves, that God works, decrees and wills the deformity that is found in the sins of commission, not by his antecedent will, whereby He works things out of his own liking, but by his consequent and conditional will, whereby presupposing the purpose of suffering his creature to avert and turn from Him, He still intends to move, impel and carry them forward, though being by their own fault out of the way, He carries them thither whither they should not go: first, say they, by substraction of grace, upon the withdrawing whereof He saw the creature would turn from Him, He purposed to suffer the sin of aversion or omission to enter: secondly, this purpose being presupposed, and foreseeing that which would follow upon it in his consequent and conditional will, He positively decreed the other, which is of commission. Man by creation was made to seek an infinite good, and love it infinitely; which if he omit to seek in God, then must he needs commit the contrary and seek it in himself: for so God decreed that man not continuing to adhere unto Him, should fall into self-love, pride and all evils of that kind. All this might be borne withal, save only they make deformity of the essence of an action, which cannot be borne withal…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-yates.html">John Yates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Arraignment of Hypocrites with an Enlargement concerning God’s Decree in Ordering Sin... (Cambridge, 1615), pt. 3, Reasons Objected to make God the Author of Sin</cite>, p. 76</span></figcaption>

<blockquote><p>The third point comes now to be considered, namely the harmony or consent of both wills. For the words are, ‘I would, ye would not.’ [Mt. 23:37] Here it may justly be demanded whether there be a harmony or consent between God’s will and man’s will, and how it stands with this text. I answer, there is an excellent harmony: and generally it stands in this, that God’s will has a sovereign lordship over the will of man, and man’s will stands subject to it absolutely, and simply depends upon it. And by this means, where man has a will, God has an antecedent will;† and where man’s will has any stroke or action, there God’s will formerly had his stroke and action. † [Given the context and below, it is likely Perkins means God’s will of decree is antecedent to man’s will, involving the predetermination of man’s will. Perkins below criticizes Damascene’s sense of the term antecedent will.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Free Grace &amp; Man’s Free Will (Cambridge, 1601)</cite>, pp. 133-34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>3. Above, indeed, we proved that there is not in God a conditioned will properly so called, although rewards and punishments are proposed to us conditionally: For these differ as much as heaven from earth. Eternal life is conditional, but the sacred oracles do not know of a will of God to give eternal life that is conditional. For there was in God a will by which these things were concatenated, the establishment of Saul’s kingdom and the obedience of Saul, just as the vision of miracles and the conversion of the Tyrians are concatenated, as I mentioned above. Would the establishment of the kingdom have followed the obedience of Saul in this sense, but God had both decreed and long before predicted through the patriarch Jacob, Gen. 49:10, that royal power would be with the tribe of Judah, and that Shiloh, that is, Christ, would arise from him? What? Would that promise have been false if Saul had obeyed? What kind of dreams are these? Corvinus will say (in the cited location), if God had established the kingdom for Saul on the condition that he obeyed, then He would have wished to establish it. ‘For if’ (he says) ‘God had done that, the condition being posited, He surely wished to do it before the condition was fulfilled, under that law, if it were fulfilled.’ A conditional will includes two things (Alvarez, disp. 22, ad fig. 8): 1. Formally and expressly, an affection of simple complacency. 2. Eminently and implicitly, [there is] an efficacious and absolute will, which indeed does not actually exist, but nevertheless would exist if the condition were fulfilled; but insofar as it is turned into an absolute [will] through the fulfillment of the condition, it is called conditional. Response: 1. There is no consequence [in the argument]. If God had established Saul’s kingdom on the hypothesis of obedience, Corvinus, according to his custom, fraudulently assumes this, but does not prove it. Would that he had brought forward an argument! For this alone follows: ‘Therefore He would have willed and decreed to establish it, if He had established it,’ which is most true and by us in no way denied. But because God sends a Savior if men are sinners, it in no way follows: ‘Therefore He decreed to send a Savior on the hypothesis that men are sinners.’ For God’s eternal decree in no way depends upon a temporal condition to be fulfilled by men, for otherwise it would not be eternal. 2. If God had established Saul’s kingdom, He would have decreed to establish it; if He had decreed to establish it, He would also have decreed to work obedience in Saul by efficacious grace, just as He provided this in David. Therefore, from the condition having been fulfilled, there would have followed the temporal and external act of God, but in no way from the same would there have followed the eternal and immanent act. What? Would it be in the power of the creature that there should be eternal acts and eternal volitions in God? Then it would be in the power of the creature that God’s will should exist, and consequently that God Himself should exist; for God’s volitions are the same as God Himself. 3. He says that the conditional will comprises an affection of simple complacency, that is, an absolute volition. Does God therefore absolutely love and will eternal life for Judas, and also conditionally will eternal life for Judas? But these are contradictory. For if God [wills] salvation of the Jew simply, then He would also effect that (Alvarez, disp. 22, ad fig. 8); and therefore he still begs the question. 4. He says that a conditional will eminently contains the absolute will of God, which is not in act, yet would be if the condition were fulfilled, but he foreknows from eternity that the condition will never be fulfilled. How, therefore, does a conditional will, either eminently or formally, contain such an efficacious will, which God both foreknows and decrees will never be? This is a dream. 5. Is not the condition to be fulfilled such a thing upon which the absolute will of God depends? The Arminians deny this, for they do not wish for the first cause to be suspended from the second. 6. “According as it is turned into the absolute,” he says, “it is called conditional.” But truly, change the word “turned” into the word “changed,” and then the eternal conditional will of God is changed into an absolute one. Is the will of God so mutable? But how is the natural desire of God turned into an absolute decree, and then the same will of God will be both natural and free, that is, free and not free? If God has now ceased to will the salvation of the believing elect by an antecedent will, and now absolutely wills them to be saved because they believe, then an end is given to the eternal desire of God. But truly, since He desires the salvation of the elect because He is good toward His creatures, if that desire has now vanished as having been changed into an absolute will, He ceases to be good toward believers. 7. This absolute will, once the condition has been fulfilled, either follows necessarily or contingently. If necessarily, then the efficacious decree of God concerning the salvation of believers is not free, but follows necessarily, by a necessity of nature, from the act of man; and yet Arminius himself concedes that election is a free decree. But if it follows contingently, or freely, from the decree, then God decreed to decree, He willed to will absolutely the salvation of believers. How absurd it is that He should first decree to decree, before He decrees! But this is to posit a progression to infinity. (Alvarez, disp. 22, ad fig. 8)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apologetic Exercitations (Amsterdam: Laurentius, 1636), Exercise 2, ch. 4, ‘On the Antecedent &amp; Consequent Will of God’, pp. 323-63 tr. AI by The Faith Received Latin</cite></span></figcaption>

<blockquote><p>The voluntas signi vel praecepti, the will of the sign or precept, is the voluntas revelata, or revealed will, of God and the voluntas moralis, or moral will, according to which God reveals in signs and precepts his plan for mankind both in the law and in the gospel. Here, again, the Lutherans and Reformed differ insofar as the former [the Lutherans] deny [though the Reformed affirm] the contrast between a universally offered salvation revealed in the voluntas signi [the will of sign, or revealed will] and a secret elective will in the voluntas beneplaciti. … Finally, the Protestant scholastics argue a series of distinctions in the voluntas signi vel praecepti. The voluntas signi vel praecepti is, first, synonymous with voluntas revelata and voluntas moralis. As such, several of the Lutheran orthodox argue that the voluntas signi is not truly the will of God but an effect of his will or a subsidiary willing resting on the voluntas antecedens and, formally, on the voluntas consequens. In other words, it is an effect or object of the divine will that provides a sign of what is willed in and by God.</p></blockquote>

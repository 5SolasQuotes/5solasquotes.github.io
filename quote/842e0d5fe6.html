<blockquote><p>However the will depends on God, and whatever God works in it, it always retains the liberty which we said consists in immunity from the threefold necessity of coercion, determination by matter, and determination by sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan</cite>, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, pp. 347-49 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan. | LIII. He then reconciles this dependence of the will on the first cause with its liberty after a few intervening points:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-94813ced0a" data-kw="">
<blockquote><p>It would be to be wished that this contestation had not gone out of the schools of the Roman Communion, where it [the teaching of divine premotion] took birth. But by a misfortune that one could not deplore enough, it has passed even into ours, although with some difference. In effect in the Roman Church there is no one who has not taken sides on this, while in ours few writers have paid attention to this dispute, of which the matter is in effect quite metaphysical. When one reads the works of most of our theologians one has much difficulty perceiving that they have even heard speaking of it. The others [of the Reformed], to whom this contestation has not been unknown, have divided themselves on this. Most have declared themselves for premotion. This is what have done among the supralapsarians Piscator, Maccovius, Voet, Twisse, Rutherford and others, and among the infralapsarians Rivet, Maresius, Turrettin, etc. Several have said things quite opposed to this sentiment, like Junius, Pareus, the theologians of England deputies to the Synod of Dort, H. Alting, P. Ferri, M. Amyraut, M. Morus, etc. Some have explained themselves more clearly, and have positively rejected this dogma, like four of our philosophers, Gockenius, Rutgersius, Jacchæus and Burgersdijk. Some even have refuted it amply and solidly, like Robert Baron, Strangius, Baxter, Heidegger and M. Holsius. That alone makes it clear that it is more or less the same with the Roman Church as with ours, at least in this regard, that in one and in the other premotion has adversaries and partisans, from which one can conclude what is the injustice of the reproaches that the missionaries make to us on this in such an insulting manner. For finally if it is wrong for us to suffer the Predeterminants in our communion, by what right do the Pope and his councils suffer them in theirs?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-la-placette.html">Jean La Placette</a></span><span class="wk"><span class="lbl">Work:</span> <cite>La Placette vs. Naude on Premotion, Concurrence &amp; Decrees</cite>, trans. from French by AI (Amsterdam: 1707 ff.), pp. 265-66 La Placette (1639-1718) was a French reformed minister who was against divine premotion.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-78f1af44c6" data-kw="">
<blockquote><p>First: how God is not a cause when He permits. For if God were to give his efficacious grace to the will, it would not sin. I respond that this doubt is common to all and looks elsewhere. Briefly, however, I say that for us, who hold every sin to be an effect of reprobation [this is hard language which the Reformed often spoke against]… the response is at hand: namely, that God is not bound to exhibit efficacious grace, since through original sin its privation has been incurred [the Reformed agree with this]; and therefore the permission is just. [The Reformed generally disagree:] He does give sufficient grace, with which man can and without which he cannot avoid sin. And in that permission God foresees that the man will sin, as we have often taught with Scotus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Difference with the Reformed, p. 422</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

e-secondary-causation-occasionalism/#:~:text=First%3A%20how%20God%20is%20not%20a,we%20have%20often%20taught%20with%20Scotus&amp;text=First%3A%20how%20God%20is%20not%20a%20cause%20when&amp;text=sin%2C%20as%20we%20have%20often%20taught%20with%20Scotus" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-90dbf3bc5d" data-kw="">
<blockquote><p>It is asked: Whether because God indeclinably determines the will to one thing, He therefore overturns liberty? The Remonstrants affirm. We deny.

1. Because God infinitely wise and omnipotent does not overturn the nature of second causes, except in the case of the miraculous transmutation of substances; as when He converted water into wine and the staff of Moses into a serpent. But conversion is not such a miraculous transmutation of substances; But of qualities of the same substance remaining in its nature.

2. Because God so moves the free will that it most freely moves itself to the same thing to which it is premoved by God.

3. Because if certain created infallibilizing motives infallibly bend the will, with liberty remaining unharmed, much more can the Creator of wills Himself accomplish this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI by Onku (1639-1642; 1668), ch. 11, On the Mode of Conversion, pp. 303-4</span></figcaption>

</figure><figure class="quote" id="q-4e185def0a" data-kw="">
<blockquote><p>…the Thomists, with whom — with one exception — we Scotists who wish to be true disciples of Scotus agree. Therefore all the schools agree that Durand’s [pure free will] opinion is absurd, and they posit that God concurs immediately with the effects of his creatures — both necessary and free — through one and the same action. They likewise assert concordantly the subordination and dependence of created causes upon God, and they do not deny that God concurs in the material element — that is, the physical entity of the sinful act — without concurring in the formal element of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Agreements, p. 373</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…the Thomists, with whom — with one exception — we Scotists who wish to be true disciples of Scotus agree. Therefore all the schools agree that Durand’s [pure free will] opinion is absurd, and they posit that God concurs immediately with the effects of his creatures — both necessary and free — through one and the same action. They likewise assert concordantly the subordination and dependence of created causes upon God, and they do not deny that God concurs in the material element — that is, the physical entity of the sinful act — without concurring in the formal element of sin.”

— Francisco Macedo, Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Agreements, p. 373">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+Thomists%2C+with+whom+%E2%80%94+with+one+exception+%E2%80%94+we+Scotists+who+wish+to+be+true+disciples+of+Scotus+agree.+Therefore+all+the+schools+agree+that+Durand%E2%80%99s+%5Bpure+free+will%5D+opinion+is+absurd%2C+and+they+posit+that+God+concurs+immediately+with+the+effects+of+his+creatures+%E2%80%94+both+necessary+and+free+%E2%80%94+through+one+and+the+same+action.+They+likewise+assert+concordantly+the+subordination+and+dependence+of+created+causes+upon+God%2C+and+they+do+not+deny+that+God+concurs+in+the+material+element+%E2%80%94+that+is%2C+the+physical+entity+of+the+sinful+act+%E2%80%94+without+concurring+in+the+formal+element+of+sin.%E2%80%9D%0A%0A%E2%80%94+Francisco+Macedo%2C+Collations+of+the+Teachings+of+St.+Thomas+%26+Scotus%2C+with+the+Differences+between+the+Two%3A+with+the+Texts+of+Both+Faithfully+Presented%2C+and+the+Sentences+Subtly+Examined%2C+with+the+Commentaries+of+the+Interpreters%E2%80%A6+vol.+2+tr.+AI+by+Vertias+%28Padua%3A+Frambotti%2C+1671%29%2C+%2C+bk.+2%2C+Collation+9%2C+pp.+361-429+%7C+Agreements%2C+p.+373&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4e185def0a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4e185def0a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=the%20Thomists%2C%20with%20whom%20%E2%80%94%20with,in%20the%20formal%20element%20of%20sin&amp;text=the%20Thomists%2C%20with%20whom%20%E2%80%94%20with%20one%20exception&amp;text=without%20concurring%20in%20the%20fo

<main class="wrap"><figure class="quote" id="q-d8b998a9fa" data-kw="">
<blockquote><p>An arbitrary power in any, whether in prince or prelates, is intolerable. Now to cast our domination in one and to take it in in another, is not to put away the evil of our doings, but to barter and exchange one sin with another, and mockingly to expiate the obligation of one Arrear[?] to God by contracting new debt. Again, how glorious is it, that Shields of the Earth lay all their royalty and power level with the dust before him that sits on the Throne, and to make their highness but a scaffold to heighten the Throne of the Son of God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646) | To the Reader</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-9aec2c78b0" data-kw="">
<blockquote><p>[Col. 2] verse. 17, What should we do with the shadow, when we have the body? another, verse 20, Why should we be subject to human ordinances, since through Christ we are dead to them, and have nothing ado with them?… …whereas it might bee thought, that the apostle does not condemn all holy-days, because both he permits others to observe days, Rom. 14:5, and he himself also did observe one of the Jewish feasts, Acts 18:21. It is easily answered that our holy-days have no warrant from these places… …that which the apostle either said or did hereanent, is to be expounded and understood of bearing with the weak Jews, whom he permitted to esteeme one day above another, and for whose cause he did in his own practice, thus far apply himself to their infirmity at [???] time, when they could not possibly be as yet fully and throughly instructed concerning Christian liberty and the abrogation of the Ceremonial Law, because the Gospel was as yet not fully propagated: and when the Mosaical rites were like a dead man not yet buried, as Augustine’s simile runs. So that all this can make nothing for holy-days after the full promulgation of the Gospel, and after that the Jewish ceremonies are not only dead, but also buried, and so deadly to be used by us. Hence it is, that the apostle will not bear with the observation days in Christian Churches, who have known God as he speaks.</p></blockquote>

aec2c78b0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9aec2c78b0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-ceremonial-law/#:~:text=%5BCol.%202%5D%20verse.%2017%2C%20What%20should,have%20known%20God%20as%20he%20speaks." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Though these [circumstances of worship] also, when they have a religious respect put on them, are made essential, and come under the things our Saviour here refers to [Mat. 15:9]. But a thing may then be said to be made a part of worship, when it hath such an holiness put upon it, as to be reputed a medium of our communion with God. And this is not to be judged of by what men say of it, but by the necessary consequence of the usage of it.</p></blockquote>

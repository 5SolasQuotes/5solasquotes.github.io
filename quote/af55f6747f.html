<blockquote><p>The Protestant principle of the right of private judgment does certainly not imply, as Papists commonly represent it, that men have a right to form any opinions they please, or that they are at liberty to gratify their own caprice and mere inclination in adopting their religious profession.

There is nothing whatever in the Protestant principle upon this point, which is in the least inconsistent with the maintenance of these great truths, that men are responsible to God for all the opinions they form on religious subjects, that they incur guilt by the adoption of erroneous opinions, that therefore they are bound to conduct all their inquiries into divine things under a deep sense of their being responsible, not only for the application of the right means to reach the truth, but for actually reaching a right result, and that they are bound to employ all suitable means to attain a clear and certain knowledge of the truth, with perfect impartiality, with unwearied diligence, and unshrinking perseverance.

All these positions are true in themselves, and of great practical importance. They are perfectly consistent with the Protestant principle of the right of private judgment, and they have been maintained by all true Protestants, and indeed, by all but infidel or semi-infidel rationalists. It is chiefly by insinuating, that the Protestant principle of the right of private judgment involves or produces a denial of these great truths, that Papists contrive to excite a prejudice against it, as if it were something very much akin to, or rather identical with, the infidel notion, that men are not responsible for their opinions, but may adopt any opinions upon religious subjects they please, without guilt and without danger.

Now, not only does the Protestant principle afford no countenance to the infidel one, but, on the contrary, there is no ground on which men’s responsibility for the soundness of their opinions can be so firmly based, or so clearly brought out, as in connection with the Protestant principle of the right of private judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principles of the Reformation not the cause of Sects and Heresies in J. A. Wylie (ed.), Ter-Centenary of the Scottish Reformation, as Commemorated at Edinburgh, August 1860</cite></span></figcaption>

<blockquote><p>And as the Church of the Jews did preserve the Hebrew Original of the Old Testament safe and sure, so I doubt not but the same hand of the providence of God, hath and doth preserve the Greek Original of the New Testament.

And for that it is not possible that the Originals should serve the turn of all, or immediately of any, but of such as have the knowledge of those tongues, (who are but a poor few in respect of all the world over) wherefore I take it for granted that the line of God’s providence hath, and doth, and will carry the matter, in having translations of several languages so entire, as to be a sufficient rule to ground their faith: else God in his providence must needs be wanting in providing necessaries for his Church.

Nor do I think that there was, or ever shall be a Church of Christ, or a Church of Christians in the belly of Antichrist, but have had translations sufficient to rest their souls on. I doubt not but the vulgar, for all its faults hath sufficient for the saving of some souls.

Besides among the Papists they have Pagnine allowed by two Popes, which runs as pure as any Translation in the world; and Arias Montanus a translation without exception. Senensi much commends Jacobus de Voragine a Papist, Arch-Bishop of Genoa his translation into the Italian, and Senensis could well tell, having great skill in the Originals.

To me it is much, that Senensis (so sharp a Papist as he is) should in print, and that since the Council of Trent, so highly commend a translation of the Bible into the Italian tongue. And Leo the tenth, Bishop of Rome, did just before Luther’s days, print a recommendation of Erasmus’s translation of the New Testament into Latin. So that I look on it as a special providence of God, that there were translations, and those exact too in the heart of Popery: And if so, then he will not suffer the visible Church to be without a sufficient translation, as a sufficient rule. …

Well then, as God committed the Hebrew Text of the Old Testament to the Jews, and did and doth move their hearts to keep it untainted to this day:

So I dare lay it on the same God, that he in his providence is so with the Church of the Gentiles, that they have and do preserve the Greek Text uncorrupt, and clear: As for some scapes by Transcribers, that comes to no more, then to censure a book to be corrupt, because of some scapes in the printing, and ’tis certain, that what mistake is in one print, is correct in another.</p></blockquote>

<blockquote><p>We must not confound inspiration and providence – either by reducing the inspiration by which the Scriptures were given to the level of providential guidance of the writers, or by raising the providence by which they have been preserved to the level of inspiration. The Confession intends the distinction to be taken at its full value: one was an immediate and the other a mediate activity of God. And the product correspond to the difference: one produced the plenarily inspired Bible, every word of which is the Word of God; the other produced the safe transmission of that Word, but not without signs of human fallibility here and there in the several copies.

We thus have brought before us by the Confession, in turn, the original autograph of Scripture, produced by the immediate inspiration of God; the preservation of this autographic text in a multitude of copies whose production is presided over by God’s singular care and providence; and the ordinary Bibles in the hands of the people, each of which conveys divine truth to the reader with competent adequacy for all the needs of the Christian life.

And the Presbyterian doctrine of the Bible, therefore, embraces these three points: (1) the plenary inspiration of the Bible as God gave it, by which it is made the Word of God, trustworthy in every one of its affirmations; (2) the safe preservation of the Bible as God gave it, so as to be accessible to men, in the use of the ordinary means of securing a trustworthy text; and (3) the adequate transmission of the saving truth in every and any honest translation, so that the Word of God is accessible to all at all times for all ordinary purposes. The hearty acceptance of all three of these propositions is necessary, if we would range ourselves alongside of the Westminster Confession.</p></blockquote>

We thus have brought before us by the Confession, in turn, the original autograph of Scripture, produced by the immediate inspiration of God; the preservation of this autographic text in a multitude of copies whose production is presided over by God’s singular care and providence; and the ordinary Bibles in the hands of the people, each of which conveys divine truth to the reader with competent adequacy for all the needs of the Christian life.

And the Presbyterian doctrine of the Bible, therefore, embraces these three points: (1) the plenary inspiration of the Bible as God gave it, by which it is made the Word of God, trustworthy in every one of its affirmations; (2) the safe preservation of the Bible as God gave it, so as to be accessible to men, in the use of the ordinary means of securing a trustworthy text; and (3) the adequate transmission of the saving truth in every and any honest translation, so that the Word of God is accessible to all at all times for all ordinary purposes. The hearty acceptance of all three of these propositions is necessary, if we would range ourselves alongside of the Westminster Confession.”

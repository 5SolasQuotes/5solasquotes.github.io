<main class="wrap"><figure class="quote" id="q-7f92c736eb" data-kw="indwelling sin">
<blockquote><p>The reasons are: (1) Scripture describes that sin not only privatively (sterētikōs) and by way of negation (Rom. 3:23; 7:18; 1 Cor. 2:14; Eph. 4:18), but also positively (thetikōs) and by way of affirmation, when it calls it “flesh,” “concupiscence,” “the law of the members,” “indwelling sin,” “body of death,” “old man,” etc. (Jn. 3:6; Rom. 7:18, 20, 23, 24; Eph. 4:22). IX. (2) In act and subjectively, it inheres in man and continually excites evil desires in him. In fact, it passes over to posterity by generation, which cannot be said of mere want or privation. X. (3) Men are not only destitute of righteousness, but also full of unrighteousness; incapable of good, but also inclined to evil; turned away from God, as the immutable and eternal good, but also turned toward the creature and inclined to every vice. Disease and a bad disposition of body (producing pain) do not bespeak a mere privation of health, but also a disorder (dyskrasian) of the temperament and humors. As leprosy is not only the privation of pure blood, but also a corruption of it, so sin (which is compared to a disease) is not only the privation of rectitude, but also positive corruption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/indwelling-corruption.html">Indwelling Corruption</a> › <a href="../topics/trials-the-cross-and-comfort/indwelling-corruption/power-of-remaining-sin.html">Power of remaining sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dac24ced2c" data-kw="Affliction">
<blockquote><p>The truth is, the crook in the lot is the great engine of Providence for making men appear in their true colours, discovering both their ill and their good. And if the grace of God is in them, it will bring it out, and cause it to display itself. It so puts the Christian to his shifts, that however it makes him stagger for awhile, yet it will at length evidence both the reality and the strength of grace in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crook in the Lot</cite>, Doct. I, head III (why God makes a crook)</span></figcaption>

</figure><figure class="quote" id="q-710a173bd5" data-kw="Affliction Comfort">
<blockquote><p>All who are disposed to betake themselves to God, under the crook in their lot may take comfort in this, let them know that there is no crook in their lot but they may be made straight; for God made it, surely then He can mend it. He himself can make straight what He has made crooked, though none other can.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crook in the Lot</cite>, Doct. I, Use 2 (consolation)</span></figcaption>

</figure><figure class="quote" id="q-940c6385f9" data-kw="Affliction Wisdom">
<blockquote><p>It is the discipline of wisdom. He who administers it is the &quot;God only wise.&quot; What deep wisdom then must there be in all His dealings! He knows exactly what we need and how to supply it. He knows what evils are to be found in us, and how these may be best removed. His training is no random work. It is carried on with exquisite skill. The time and the way and the instrument are all according to the perfect wisdom of God. The fittest time is chosen, just the very moment when discipline is called for, and when it would be most profitable. The surest, most direct, and at the same time gentlest method is devised. The instrument which will be surest yet safest, most effectual yet least painful, is brought into operation. For all is wisdom in the discipline of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Night of Weeping</cite>, ch. IV, “The Family Discipline,”</span></figcaption>

</figure><figure class="quote" id="q-9306f26ff2" data-kw="Affliction Comfort">
<blockquote><p>As all good things, so all bad things are ordered by providence for the good of the church. That which in its own nature is an injury, by God&#x27;s ordering puts on the nature of a mercy; and what is poison in itself, by the almighty art becomes a sovereign medicine. Are God&#x27;s dispensations in their own nature destructive? That wise physician knows how to make poisons work the effect of purges. Are they sharp? It is to humble and purge the church. As shadows serve to set out the pictures, so the darkest passages of providence are made by God to commend the beauty of those glorious things he works for his church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on 2 Chron. 16:9, Doct. 2 (all providences for the good of the church)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4bcdd61ad8" data-kw="">
<blockquote><p>affectio: affection; viz. passion or desire, a disposition toward someone or something; synonymous with passio and affectus. Specifically, the affectio animi, or affection of soul, that is the faculty of desire. [While the above is speaking of affections in general, that is for living creatures, and God does not have passions, yet note the Reformed Orthodox teaching that affections are attributed to God improperly: ‘On the Affections of God’.] affectus voluntatis Dei: affections of the will of God; viz., those divine attributes which, according to the strict faculty psychology held by the Protestant scholastics, appear as dispositions or conditions of the divine will; i.e., amor or love, benevolentia or goodness of will, clementia or clemency, gratia or grace, ira or wrath, longanimitas or longsuffering, misericordia or mercy, odium or hate, and patientia or patience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms</cite>, ed. (Baker, 1985), p. 29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>yes: Baxter holds that Christ died for all men; but I cannot say that I am quite at one with what some of our friends have written on the subject of the atonement. I do not, for example, entirely agree with what Mr. Haldane says on that subject. I think that the word world, as applied in Scripture to the sacrifice of Christ, has been unnecessarily restricted; the common way of explaining it is that it simply includes Gentiles as well as Jews. [John 3:16] I do not like that explanation, and I think that there is one text that puts that interpretation entirely aside. The text to which I allude is, that “God commandeth all men, everywhere to repent. [Acts 17:30]”</p></blockquote>

<blockquote><p>1. The first ground is the Lord’s disposition and nature of mercy and placableness towards a poor sinner, which gives him footing for his hope abundantly in any particular case, as: (1.) From his Name and attributes, whereby He has made Himself known to his people. God proclaims his Name to Moses to be ‘the Lord, the Lord God, the powerful, the mighty Jehovah’ (Ex. 34 [vv. 6-7]), which ministers comfort when annexed to his manifestation of Himself in this way of mercy. ‘Merciful,’ inclined to pity the sin and misery of his people, ready to relieve them in their distress and not only just to require the due service and punish the defaults; ‘Gracious,’ of an affable condescending descending nature, not standing upon the distance that He is in as a great King above all his creatures; He may be petitioned, sought unto and prevailed with by his poor suitors. ‘Long-suffering,’ that is, not hasty to use severity with the worst of sinners, usually taking all other ways first with them, willing that all men should repent and come to the knowledge of the truth (1 Tim. 2:4): Trying many that repent not with much goodness to draw them to it. Enduring with much patience the very vessels of wrath before He brings destruction on them (Rom. 9:22). In all cases He forgives iniquity, transgression and sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-newcome.html">Henry Newcome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Hope</cite>, ... (London: E.C., 1660 [1659]), ch. 4, pp. 25-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>[Ex. 20:5] ‘And showing mercy unto thousands of them that love Me and keep my commandments.’ God’s justice reaches unto the third and fourth generation, but his mercy to the thousand[th] generation; and hence we may gather that God inclines more to mercy than to justice, and therefore when He punishes He is said, facere opus non suum, Isa. 28:21, that He may do his strange work, that is to punish.</p></blockquote>

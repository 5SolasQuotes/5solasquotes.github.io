<main class="wrap"><figure class="quote" id="q-014bb13130" data-kw="">
<blockquote><p>Listen to Christ Himself say that He is both in heaven and on earth: ‘No one has ascended into heaven except him who has descended from heaven: the Son of Man who is in heaven.’ Notice that the Lord Himself said He is both in heaven and on earth. We confess, dearly beloved, that Christ the Lord is head of the Church; if this is true, He is in heaven with regard to the head, but on earth as far as the body is concerned.

Moreover, when the blessed Apostle Paul was persecuting the Church, Christ exclaimed from heaven: ‘Saul, Saul, why dost thou persecute me?’ He did not say: Why do you persecute my servants? Nor did He say: Why do you persecute my members? But He said: ‘Why dost thou persecute me?’ Now the tongue cries out if the foot is stepped on: You stepped on me, even though the tongue cannot be stepped on at all; through the harmony of charity the head cries out for all the members.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caesarius-of-arles.html">Caesarius of Arles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons: Volume II</cite>, (81-186), trans. Mary Magdeleine Mueller, The Fathers of the Church: A New Translation, vol. 47 (Washington D.C.: The Catholic University of America Press, 1964), 87.3, p. 31.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-1e615a3ebe" data-kw="">
<blockquote><p>And all students in divinity are most expressly enjoined, upon pain of being declared unworthy of ever serving in the sacred ministry, to raise any stirs or debates about unnecessary questions, as concerning the order of God’s decrees, of universal grace by the preaching of nature, which may lead and bring men unto salvation, points only propounded and advanced by pure curiosity, and for the exercise of men’s wits. And all examiners of our proposans in order to the ministry, shall proceed in that business with very much charity, exacting from them nothing but what is demanded by the canons of our discipline; and provided they give that satisfaction which is requisite, by signing the Confession of Faith, the Liturgy of our Churches, and the Canons of Alez, Charenton, and Alenson, and this present act, they shall be approved and admitted.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-84d29d3b3e" data-kw="">
<blockquote><p>20. Behold, I stand ever ready knocking at the door of your conscience: whoso yields unto mine admonitions and opens his heart and mind by penitence and remorse, I will certainly dwell in him and will communicate all things with him, and he with Me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-napier.html">John Napier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Discovery of the Whole Revelation of St. John</cite>, … (1593), 2nd Treatise, ch. 3, p. 95 Napier (1550-1617) was reformed, and was the mathematician who discovered logarithms.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

<blockquote><p>3. Behold I stand at the door of thy heart as one ready to help thy weakness. (2 Thess. 2; Ps. 106) And I knock at the portal of thy conscience as one that would gladly comfort thee, I send forth my heavenly Word to succour thee, lighten thee, raise thee up and save thee.

4. If any man with a glad heart will hear my voice, or the true preaching of my Word (Jn. 10; Mk. 16; Gal. [?]; Lk. [?]) and open the door of his faith, thankfully to receive it, I will come in unto him, enduing with all spiritual delights, as righteousness, peace, love and joy in the Holy Ghost.

5. Yea to him shall I make manifest as to my friend the hidden mysteries of the Scripture (Jn. 15; Lk. 14; Mt. 8; [?] Cor. 2) and secret counsels of my Father. And he shall finally sup with Me and I with him in the eternal habitacle of God, where no heart can esteem what He has prepared for them that love Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bale.html">John Bale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Image of both Churches after the most wonderful and heavenly Revelation of St. John</cite>, ... (d. 1563), ch. 3, p. 50 Bale was an Anglican reformer.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-904eca776e" data-kw="">
<blockquote><p>(2) God has been importunate in entreaties of us. God offers not only truce, but a peace, and has been most active in urging a reconciliation. Can He manifest his willingness in clearer methods, than that of sending his Son to reconcile the world to Himself? Can He evidence more sincerity than by his repeated and reiterated pressing of our souls to the acceptance of Him? God knocks at our hearts, and we are deaf to Him; He thunders in our ears, and we regard Him not; He waits upon us for our acceptance of his love, and we grow more mad against Him; He beseeches us, and we ungratefully and proudly reject Him; He opens his bosom, and we turn our backs; He offers us his pearls, and we tread them under our feet; He would give us angels’ bread, and we feed on husks with swine. The wisdom of God shines upon us, and we account it foolishness. The infinite kindness of God courts us, and we refuse it, as if it were the greatest cruelty. Christ calls and begs, and we will not hear Him either commanding or entreating…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Stephen Charnock</cite>, 5 vols. (d. 1680; Edinburgh: Banner of Truth, 1997), vol. 5, “Man’s Enmity to God,”, p. 521</span></figcaption>

<blockquote><p>…and therefore because they missed of the time, their misery was great on them… there is a time for a man to come in and take the offer that Christ makes, a time when He is kind and gentle, and ready to receive us; if we know not this time, and so overslip it, our misery will be great upon us. Now then it is very requisite to know and find out this time, because if we choose God’s time, God will join with us in the work, and so it will be done with ease… Now if you will open when Christ knocks at the door, hearken to the motions of the Spirit, and blow them and nourish them, and it will be done with much ease; but if you miss this time, your misery is great; you may desire, and cry, and pray, and never the better, Eccl. 9:12. For a man also knows not his time…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-preston.html">John Preston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Saints’ Infirmities, Delivered in Several Sermons</cite>, ... (London: Okes, 1636), 2nd Sermon, on Mt. 12:18-20, pp. 132-36</span></figcaption>

<blockquote><p>‘That knocketh.’ moving my heart by secret inspirations, to give full admittance and entrance to his grace and virtues, Rev. 3:20. ‘Open to me.’ receive Me in thine heart, by a lively act of faith, for it is mine only place of refuge and abode upon earth, out of which I find nothing but annoyance and displeasure in the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-diodati.html">John Diodati</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pious Annotations upon the Holy Bible</cite>, (London: T.B., 1643), on Song 5, verse 2, p. 201</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-19b35ae52e" data-kw="">
<blockquote><p>Fecundity: “increase and multiply.” These words can have: (1) an imperative sense, in which way the ancient Hebrews wanted there to be here a universal precept, placed upon all people, of contracting marriage, which they call ונמה פיריה מצות” ,the commandment of fruitfulness and multiplication,” because one who does not confirm this commandment has no part, they say, in the age to come. But in this way the commandment would fall even upon brute beasts, since the same thing is said of them in verse 22; in this way also there would be a commandment to have dominion over the fish, “have dominion over the fish of the sea,” and so forth. (2) A concessive sense, just as in Genesis 2:16 and Deuteronomy 14:11, 20. Finally, (3) a promissory sense, so that the imperative stands in place of the future, “increase” in place of “you will increase,” and so forth, such that he is promising fertility, power, and appetite to beget what is similar to them; hence this is said only of fecund things, but not of light, stars, plants, and so forth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 9, Exegetical Part, p. 252</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-4c212e3221" data-kw="">
<blockquote><p>By this term [‘prophets’ in this passage] he means (in my opinion) not those who were endowed with the gift of prophesying, but those who were endowed with a peculiar gift, not merely for interpreting Scripture, but also for applying it wisely for present use. My reason for thinking so is this, that he prefers prophecy to all other gifts, on the ground of its yielding more edification — a commendation that would not be applicable to the predicting of future events. Farther, when he describes the office of prophet, or at least treats of what he ought principally to do, he says that he must devote himself to consolation, exhortation, and doctrine. Now these are things that are distinct from prophesyings. Let us, then, by ‘prophets’ in this passage understand, first of all, eminent interpreters of Scripture, and farther, persons who are endowed with no common wisdom and dexterity in taking a right view of the present necessity of the Church, that they may speak suitably to it, and in this way be, in a manner, ambassadors to communicate the divine will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 12, verse 28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

<blockquote><p>7. Yet we say, that as God by gifts may furnish some in a more than ordinary way; so may He, and uses He to thrust them out in a mixed way to the exercise of these for the edification of His Church, and make the seal of his call extraordinarily ratify his sending of them, that is, as He may furnish men partly by means, and especially by his blessing extraordinarily accompanying them, so may He send them out partly in a mediate way by men’s opening of the door, partly by his more than ordinary thrusting of them out, making up so what was defective in the mediate call by some extraordinary concurrences of impulse and gifts within, of circumstances of providence without, and of efficacy upon, and acception of it amongst others, whereby it cometh to be ratified. This the Lord fulfilled at the entry of the Reformation, raising up men comparatively extraordinarily furnished and commissionated for his work, yet still ministers of the same Gospel, and walking according to the common rule with others in their ministerial charge. This is not ordinarily to be imitated, but where the like cases, call, and circumstances concur…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 10, ‘Concerning Prophesying’ in A Commentary upon the Book of the Revelation… (Edinburgh, 1658), pp. 469-72</span></figcaption>

</figure><figure class="quote" id="q-3163c0e2b3" data-kw="">
<blockquote><p>I have hesitated till the present time, not through lack of ability to refute the falsehood or bear testimony for the truth, but from fear and apprehension that I might seem to some to be making additions to the doctrines or precepts of the Gospel of the New Testament, which it is impossible for one who has chosen to live according to the Gospel, either to increase or to diminish. But being recently in Ancyra in Galatia, I found the church there greatly agitated by this novelty, not prophecy, as they call it, but rather false prophecy, as will be shown. Therefore, to the best of our ability, with the Lord’s help, we disputed in the church many days concerning these and other matters separately brought forward by them, so that the church rejoiced and was strengthened in the truth, and those of the opposite side were for the time confounded, and the adversaries were grieved… Their opposition and their recent heresy which has separated them from the Church arose on the following account… a recent convert, Montanus [fl. 157-172] by name… And he became beside himself, and being suddenly in a sort of frenzy and ecstasy, he raved, and began to babble and utter strange things, prophesying in a manner contrary to the constant custom of the Church handed down by tradition from the beginning. Some of those who heard his spurious utterances at that time were indignant, and they rebuked him as one that was possessed, and that was under the control of a demon, and was led by a deceitful spirit, and was distracting the multitude; and they forbade him to talk, remembering the distinction drawn by the Lord and his warning to guard watchfully against the coming of false prophets… For the faithful in Asia met often in many places throughout Asia to consider this matter, and examined the novel utterances and pronounced them profane, and rejected the heresy, and thus these persons were expelled from the Church and debarred from communion. Since, therefore, they called us slayers of the prophets because we did not receive their loquacious prophets, who, they say, are those that the Lord promised to send to the people…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/eusebius-of-caesarea.html">Eusebius of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 339) | Church History, bk. 5, ch. 16, sections 3-4, 7-8, 10-12 in NPNF2 1:231-32. The following is from an account of an unnamed 2nd century observer.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-8675a0787f" data-kw="">
<blockquote><p>I say, therefore, that the Lord Jesus Christ himself, as the ordinance of God, in his work of mediation for the recovery and salvation of lost sinners, and as unto that end proposed in the promise of the gospel, is the adequate, proper object of justifying faith, or of saving faith in its work and duty with respect unto our justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 1</span></figcaption>

<main class="wrap"><figure class="quote" id="q-7971a2e1c6" data-kw="">
<blockquote><p>…Christ… so zealously threw out of the temple those who were selling and buying, and overturned the tables of the money changers; even though they could not be adorned with any images, they could nevertheless have some decorative ornament.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a6eef9a0dc" data-kw="">
<blockquote><p>In fact let us learn how greatly our nature inclines toward idolatry.… That saying of Horace still stands: once the gods of fools are born of fear. Or rather, as Scripture teaches, once the true knowledge of God has been blotted out by sin, the mind of man becomes a perpetual forge of idols.… Man will be compelled to confess that he is a transient being, and that those whose images he worships were once mortals like himself; yet he transfers divinity to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.11.8–9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span><span class="t"><a href="../topics/the-law-of-god/first-table-commandments-1-4.html">First Table (Commandments 1-4)</a> › <a href="../topics/the-law-of-god/first-table-commandments-1-4/first-commandment.html">First commandment</a></span></div>

</figure><figure class="quote" id="q-75c3465029" data-kw="">
<blockquote><p>That Council, because it supports idolatry, the Papists deem holy and lawful. Hence, according to their axiom, it cannot have erred in the exposition of Scripture. But if such interpreters of sacred things are to be listened to, (it is abominable to say they are,) the religion of the Egyptians will be preferable to the Christian.</p></blockquote>

</figure><figure class="quote" id="q-2cfa4393d8" data-kw="Mary Queen of Heaven Satan Grace">
<blockquote><p>Hence we see how widely the Papists differ from her, who idly adorn her with their empty devices, and reckon almost as nothing the benefits which she received from God. They heap up an abundance of magnificent and very presumptuous titles, such as, &quot;Queen of Heaven, Star of Salvation, Gate of Life, Sweetness, Hope, and Salvation.&quot; Nay more, to such a pitch of insolence and fury have they been hurried by Satan, that they give her authority over Christ; for this is their pretty song, &quot;Beseech the Father, Order the Son.&quot; None of these modes of expression, it is evident, proceeded from the Lord. All are disclaimed by the holy virgin in a single word, when she makes her whole glory to consist in acts of the divine kindness. If it was her duty to praise the name of God alone, who had done to her wonderful things, no room is left for the pretended titles, which come from another quarter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 1:48-49</span></figcaption>

</figure><figure class="quote" id="q-a7c1e66dfa" data-kw="">
<blockquote><p>The papists and Lutherans do not have anything to argue for their images, except what we recently rejected in §IX, namely, that God quite often appeared in the Old Testament under certain forms, even human ones. The reply is easy: He never appeared for the purpose that He might be portrayed; indeed, that is what, throughout Scripture, he has forbidden as strictly as possible…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, trans. Todd Rester &amp; Michael Spangler (RHB) | section 11, vol. 1, bk. 2, ch. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2e40be86f2" data-kw="">
<blockquote><p>3. I easily acknowledge that grace gives such a power as is commonly called Moral, distinct from the natural faculties, as our corrupt estate contains an opposite impotency. But this is but an applying of the terms [‘can’] and [‘cannot’] [‘power’] and [‘impotency’] to dispositions and undisposedness, to habits and their privations.

4. A new heart and spirit, I easily confess necessary. But those words do commonly signify in Scripture, only new inclinations, dispositions, qualifications. It is a new heart, though only the old faculties and substance. I hope you will not follow Illyricus.¹ ¹ [Matthias Illyricus (1520–1575), a Lutheran reformer. Wiki says, “Affirming the natural inability of man, he adopted a position on sin as not being an accident of human nature, but involved in its substance, since The Fall of Man.”]

5. Where you say that [without faith a man can no more receive Christ, nor do ought towards it, than a dead man can walk or speak.], I Reply 1. That proves not faith to be equivalent to a potentia vel facultas [power or capacity], any otherwise than that it is of as absolute necessity, but not that it is of the same nature. If you show an illiterate man a Greek or Hebrew book, he can no more read in it then a dead man, that is, both are truly in sensu composito [in a combined sense] impossible: But yet it is but a habit that is wanting to one, and a power or faculty natural, to the other. And so it may truly be said that a sinner cannot do well that has accustomed to do evil, no more than a leopard can change his spots, or a blackmoore [a black person] his skin. Yet if you mean that such are equally distant from actual change as a dead man, it is but a dead comparison. A dead man wants both natural faculties, and an inclination or moral power. An unbeliever wants but one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reduction of a Digressor</cite>, (1654), p. 131</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>XXIII. The mode by which God acts in efficacious vocation having now been explained, it remains for us to see how man conducts himself toward it. Here, there can be a twofold notion of man, as he is considered either in the first act of conversion or in the second act. Considered in the former, he behaves purely passively toward the efficacy of his vocation, contributing nothing as such, only receiving what is impressed upon him from elsewhere. XXIV. In the second act, however, there is some operation of man, and here he also performs his parts, so that he himself acts, believes, and wills rightly; yet in such a way that he perfects all these things in the virtue of the Holy Spirit as the principal mover. He indeed moves himself, but as one who has been moved, and thus he receives all good inclinations from Him, by which he is active (Phil. 2:12-13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the Efficacious Vocation of the Sinner to Salvation</cite>, trans. AI (Leiden: Marcus, 1620), p. 5</span></figcaption>

<blockquote><p>God has implanted two accounts [rationes] in the first matter, namely, causal or obediential principles whereby all things are naturally apt to obey God, such that whatever might please him would come to be from them. He has also implanted seedlike principles—that is, active principles whereby natural effects are brought about; and he is sometimes said to act contrary to these in the miracles that he performs. But properly speaking, even then he does not act contrary to them, but alongside them, or above them. He acts above them when he brings about an effect to which nature can in no way reach, like the form of glory for the glorified bodies. He acts alongside them when he produces without the service of natural causes an effect that nature can bring about, like when in John 2 he converts water into wine. But he does not act contrary to them, since he does not make it that an active natural cause, while remaining the same in species, has a different essential effect, such as that a fire, while remaining a fire, might cool something, just as it cannot simultaneously be the same thing and different. But he can indeed destroy one nature and make another, remove one form from matter and induce another; for in this way fire acts contrary to the nature of air when it corrupts it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, bk. 1, dist. 42, Power of God, quest. 2, art. 2, ‘Whether God can do things that by nature are impossible’, reply to obj. 4</span></figcaption>

<blockquote><p>Be it so that God rewards the right use of natural things with an increase of natural goods, but not with the collation of supernatural ones. For this would be “to cross over into another kind” (metabainein eis to allo genos). For it is as if someone said that God promised good health to one who makes good use of honors. It is certain that the natural does not have an order of causality to the supernatural, because they are distant by a whole kind; nor can the seed of nature ever rise into the fruit of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Negative Infidelity</cite>, [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658), p. 57</span></figcaption>

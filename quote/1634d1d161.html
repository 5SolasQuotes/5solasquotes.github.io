</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-97f57827ec" data-kw="">
<blockquote><p>Beware also of spending your time and spirits in debates and vain janglings one with another, to be temptations one to another, raising your own and others passions and corruptions instead of holy conference that might minister grace to the hearers. Mind well the apostle’s caveats in 1 Tim. 1:4-7; 5:13; 6:3-5; 2 Tim. 2:16-17; 1 Thess. 4:11. Is it not observable that the greatest sticklers in differences, the greatest disputers and contenders are usually the most distempered and barren hearted? like the mountains of Gilboa, high and hot indeed, but dry and unfruitful; warm, but withered; the unkindly, foolish, heat of division and debate, eating out the life, sap and native heat of real religion, which evanishes then into airy notions and litigious strivings, whereof no edification comes. O let not religion fly up from your hearts to your heads and evaporate into airy foams and forms and turn vapid and insipid. Be sure by questions and disputes as well the power of religion is enervated as the majesty of it infringed. The many disputes about religion commonly overthrows the practice of it, which consists not in discourses, but in doing. It is easy for a formal, moth-eaten Christian to hold up in the one, while he cannot bear up in the other, as Seneca observed anent moral virtue, Omnes disputare malunt, quam vivere, more prone are people to debate about the things of God, than to practice what is uncontroverted. If heaven could be obtained, and God pleased with jangling and debates, a profane sophister should sooner have the one and do the other than a holy Christian who knows that it is not talking of, but walking in the ways of God’s commandments that is most acceptable in his sight. But to say no more, listen to the apostle’s oracle in 1 Cor. 11:16, ‘If any man seem to be contentious, we have no such custom, nor the Churches of God.’ Love perverse disputings who will (which ever corrupts the mind), flee ye them as death, 1 Tim. 6:5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland</cite>, (1674; London, 1681), pp. 165-66</span></figcaption>

</figure><figure class="quote" id="q-bee4d8906f" data-kw="">
<blockquote><p>Those, though otherwise never so godly, that separate from true Churches, like Novatus and Lucifer, for a stricter course of discipline; like Donatus for some bad ones in the Church, as they supposed; like Andius for some lesser corruptions and abuses, they be schismatics. This is the judgment of ancient Churches, for which see at large, Mornay, On the Church, p. 35. But our late Separatists do divide themselves from us upon like grounds: for a more strict discipline with Novatus and Lucifer; for that good and bad are mixed together, with Donatus; and from lesser corruptions among us with Andius. Therefore are these also schismatics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Plain Evidences the Church of England is Apostolical, the Separation Schismatical</cite>, ... (London: 1610) | 2nd Likelihood, p. 48</span></figcaption>

</figure><figure class="quote" id="q-712ea4b3b6" data-kw="">
<blockquote><p>Thesis 1… Therefore, I was on the point of bidding farewell to this subject, casting away my pen, and choosing another equal to my powers and more suitable, had not the authority of those who hold the helm of my studies constrained me and prescribed this subject for me to bring, as it were, under the hammer. Wherefore, to prove my obedience to them, I shall approach the matter itself with God (σύν θεῷ). Thesis 2. Lest, however, our disputation be forced to wander and err, I will do that which I think ought to be done at the beginning, middle, and end of all disputations: that first, what it is that is being disputed should be defined; then, the common affections should be subjected to the definition; and finally, a division into parts and species should follow. And so our disputation on original sin will present: 1. its Definition, 2. its common Affections, 3. its Distribution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christoph-luthard.html">Christoph Luthard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on Original Sin</cite>, (Bern: Fabricius, 1637), p. 2 Lüthardt (1590-1663) was a Swiss reformed professor of philosophy and theology at Bern.</span></figcaption>

<blockquote><p>The most significant attempts to overcome religious division between the old church and those desiring reformation were those colloquies that the emperor called at the level of the Holy Roman Empire of the German Nation. They took place in a twenty-year period beginning in 1540. Thereafter this type of imperial colloquy faded because the Religious Peace of Augsburg (1555) guaranteed adherents of the Augsburg Confession legal protection within the boundaries of their own territories. This essentially rendered further Catholic-Evangelical colloquies superfluous.</p></blockquote>

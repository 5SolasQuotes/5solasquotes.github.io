<main class="wrap"><figure class="quote" id="q-a1e3d1d1e6" data-kw="">
<blockquote><p>Such is the view given by our Lord on the law of the Sabbath, speaking as from the ground of law, and doing the part merely of a correct expounder of its meaning; but a thought is introduced and variously expressed, as from His own higher elevation, in harmony with the spiritual aspect of the subject He had presented, and pointing to still further developments of it. The Temple, He had said, has claims of service, which it was no proper desecration of the Sabbath, but the reverse, to satisfy; and ‘a greater than the Temple was there.’ ‘The Temple yields to Christ, the Sabbath yields to the Temple, therefore the Sabbath yields to Christ’ – so the sentiment is syllogistically expressed by Bengel; but yields, it must be observed, in both cases alike, only for the performance of works not antagonistic, but homogeneous, to its nature.

Or, as it is again put, ‘The Son of Man is Lord of the Sabbath.’ Made, as the Sabbath was, for man, there necessarily belongs to man, within certain limits, a regulating power in respect to its observance, so as to render it more effectually subservient to its proper ends. But this power is supremely resident in Him, who is the Son of Man, in whom Humanity attains to its true ideal of goodness, whose will is in all things coincident with the will of God, and who, like the Father, works even while He rests. He is Lord of the Sabbath, and, as such, has a right to order everything concerning it, so as to make it, in the fullest sense, a day of blessing for man – a right, therefore, if He should see fit, to transfer its observance from the last day of the week to the first, that it might be associated with the consummation of His redemptive work, and to make it, in accordance with the impulsive life and energy thereby brought in, more than in the past, a day of active and hallowed employment for the good of men.

So much was certainly implied in the claim of our Lord in reference to the Sabbath; but as regards the existence of such a day, its stated place in the ever-recurring weekly cycle, which in its origin was coeval with the beginning of the world, which as a law was inscribed among the fundamental precepts of the Decalogue, which renders it on the one side a memorial of the paradise that has been lost, and on the other a pledge of the paradise to be restored — in this respect nothing of a reactionary nature fell from our Lord, nor was any principle advanced which can justly be said to point in such a direction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-fairbairn.html">Patrick Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Revelation of Law in Scripture: Considered with respect both to its own Nature, and to its Relative Place in Successive Dispensations. The Third Series of the ‘Cunningham Lectures’</cite>, (Edinburgh: T. &amp; T. Clark, 1869), pp 237-39.</span></figcaption>

</figure><figure class="quote" id="q-780de041a6" data-kw="">
<blockquote><p>But these outward shadows and ceremonies had their time and place long ago, and were not instituted to the end they should continue irrevocable, but for a season, to represent as it were a superficial view unto us of more excellent things. Even as the kingly Throne of David, and all that politique government of the Israelites did prefigure nothing else unto us, but the everlasting kingdom of Christ, and were as certain principles, wherewith the minds of the beholders might be raised up to a more deep consideration of far high mysteries: in so much that the very same, which was but figured in king David, we plainly perceive to have been expressly discovered in the king of the new Jerusalem, which is the Church of Christ. The same which was prefigured in Abel, in Noah, in Abraham, Melchisedech, Joseph, Moses, Aaron, Joshua, Sampson, David, Elias, Jonas, Jesus the great Priest, in the Paschall Lamb, in the brazen Serpent, in the Rock, in Manna, in the feast of Pentecost: briefly whatsoever exercises were practised in shadows, types &amp; figures, we do unfeignedly acknowledge to have met, concurred, &amp; been accomplished in one body.

And this body truly is Christ Jesus, who is also the end &amp; consummation of al the whole Law. In like manner the sacrifices and ceremonies, trimmings and deckings of the old Law, contained in them selves no sound nor permanent matter, but were shadows and forerunners of more excellent graces. For what is he so purblind in this our age, that knoweth not, that God doth not dwell in Temples made by men’s hands? that consciences are not cleansed from sins with the blood of goats &amp; of bulls? But these bloody offerings obtained a certain resemblance only of the true purging of sins. What doth the commandment of the prophet imply, when in your Passover he charged a lamb of a year old, clean &amp; undefiled to be slain by families &amp; tribes? Can your senses be so blockish to think, that so great &amp; effectual operation lurketh in the blood of beasts, as may avail to deliver you from cruel thraldom, &amp; translate you to the land of promise flowing with milk &amp; honey, if there were no cornel of deeper mystery enclosed within the outward shell of the letter?</p></blockquote>

<blockquote><p>3. Much less must we prefer them [animals] before men: We must not be cruel to men pretending to show mercy to the brute creatures. The life of a beast must go still to save or preserve the life of a man. I cannot but condemn the Turks, who set birds at liberty out of their cages, redeeming with money these captives, and yet make no conscience of chaining Christians to their galleys; as also the hypocrisy [of those] that cheat amongst the Romanists, whose clergy are forbid to hunt beasts, and yet some made Lords Inquisitors on purpose to hunt down, tear and devour the harmless sheep and lambs of Christ. Surely the good, the great, and the chief Shepherd of the flock and the Bishop of our souls will count them but little thanks for their so doing when He shall come to hold his general Visitation and to judge the world. These things notwithstanding, I dare not condemn those (if necessitated to save and defend their own lives) which in the civil wars of France cut off their horse-legs and so made themselves a breast-work of their bodies. Nor dare I judge king David for houghing his enemies’ horses, thereby to make them unserviceable for the wars, 2 Sam. 8:4. Let’s not be superstitiously afraid to use these creatures, either for food, physic or service, no nor for our honest delight and recreation. See your charter for so doing, if not implicitly given to Adam, yet expressly to Noah; and again renewed, Acts 10, under the Gospel, in the vision and voice to Peter, ‘Arise Peter, kill, and eat.’ And though ’tis said the disciples of the Nazarites may be known by their abstinence from the flesh of all living creatures, yet our Lord Jesus Christ of Nazareth, and He that in substance though not in vow and ceremony was the true Nazarite, gave his disciples no such commandment. Those who refuse altogether to eat the flesh of living creatures, when duly killed, deserve the name of Pythagoreans, followers of Pythagoras the philosopher, rather than to be called Christians or disciples of Christ our Saviour. So then, use these creatures we may, we must, without scruple for our meat; yea and we may use these creatures for our work, to plow and harrow the ground, and to carry our corn into the barn, and for any other necessary use. And although many condemn those persons who promote the generation of mules [which are a mix of species], so does Maimonides in his More Nev. p. 3, ch. 4 and our own writers on Gen. 36:24, yet we may use them lawfully; for we find them brought to Solomon, 1 Kings 10:25; 2 Chron. 9:24, and amongst the Israelites at their return from captivity, Ezra 2:66 and Neh. 7:68. And we nowhere find that ever they were commanded to put these away, though monsters in nature, as they were to put away their outlandish wives.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“3. Much less must we prefer them [animals] before men: We must not be cruel to men pretending to show mercy to the brute creatures. The life of a beast must go still to save or preserve the life of a man. I cannot but condemn the Turks, who set birds at liberty out of their cages, redeeming with money these captives, and yet make no conscience of chaining Christians to their galleys; as also the hypocrisy [of those] that cheat amongst the Romanists, whose clergy are forbid to hunt beasts, and yet some made Lords Inquisitors on purpose to hunt down, tear and devour the harmless sheep and lambs of Christ. Surely the good, the great, and the chief Shepherd of the flock and the Bishop of our souls will count them but little thanks for their so doing when He shall come to hold his general Visitation and to judge the world. These things notwithstanding, I dare not condemn those (if necessitated to save and defend their own lives) which in the civil wars of France cut off their horse-legs and so made themselves a breast-work of their bodies. Nor dare I judge king David for houghing his enemies’ horses, thereby to make them unserviceable for the wars, 2 Sam. 8:4. Let’s not be superstitiously afraid to use these creatures, either for food, physic or service, no nor for our honest delight and recreation. See your charter for so doing, if not implicitly given to Adam, yet expressly to Noah; and again renewed, Acts 10, under the Gospel, in the vision and voice to Peter, ‘Arise Peter, kill, and eat.’ And though ’tis said the disciples of the Nazarites may be known by their abstinence from the flesh of all living creatures, yet our Lord Jesus Christ of Nazareth, and He that in substance though not in vow and ceremony was the true Nazarite, gave his disciples no such commandment. Those who refuse altogether to eat the flesh of living creatures, when duly killed, deserve the name of Pythagoreans, followers of Pythagoras the philosopher, rather than to be called Christians or disciples of Christ our Saviour. So then, use these creatures we may, we must, without scruple for our meat; yea and we may use these creatures for our work, to plow and harrow the ground, and to carry our corn into the barn, and for any other necessary use. And although many condemn those persons who promote the generation of mules [which are a mix of species], so does Maimonides in his More Nev. p. 3, ch. 4 and our own writers on Gen. 36:24, yet we may use them lawfully; for we find them brought to Solomon, 1 Kings 10:25; 2 Chron. 9:24, and amongst the Israelites at their return from captivity, Ezra 2:66 and Neh. 7:68. And we nowhere find that ever they were commanded to put these away, though monsters in nature, as they were to put away their outlandish wives.”

— Thomas Hodges, The Creature’s Goodness, as they came out of God’s Hands, &amp; the good man’s mercy to the brute creatures, which God has put under his feet in Two Sermons, (London, 1675), sermon 2, pp. 40-41">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+Much+less+must+we+prefer+them+%5Banimals%5D+before+men%3A+We+must+not+be+cruel+to+men+pretending+to+show+mercy+to+the+brute+creatures.+The+life+of+a+beast+must+go+still+to+save+or+preserve+the+life+of+a+man.+I+cannot+but+condemn+the+Turks%2C+who+set+birds+at+liberty+out+of+their+cages%2C+redeeming+with+money+these+captives%2C+and+yet+make+no+conscience+of+chaining+Christians+to+their+galleys%3B+as+also+the+hypocrisy+%5Bof+those%5D+that+cheat+amongst+the+Romanists%2C+whose+clergy+are+forbid+to+hunt+beasts%2C+and+yet+some+made+Lords+Inquisitors+on+purpose+to+hunt+down%2C+tear+and+devour+the+harmless+sheep+and+lambs+of+Christ.+Surely+the+good%2C+the+great%2C+and+the+chief+Shepherd+of+the+flock+and+the+Bishop+of+our+souls+will+count+them+but+little+thanks+for+their+so+doing+when+He+shall+come+to+hold+his+general+Visitation+and+to+judge+the+world.+These+things+notwithstanding%2C+I+dare+not+condemn+those+%28if+necessitated+to+save+and+defend+their+own+lives%29+which+in+the+civil+wars+of+France+cut+off+their+horse-legs+and+so+made+themselves+a+breast-work+of+their+bodies.+Nor+dare+I+judge+king+David+for+houghing+his+enemies%E2%80%99+horses%2C+thereby+to+make+them+unserviceable+for+the+wars%2C+2+Sam.+8%3A4.+Let%E2%80%99s+not+be+superstitiously+afraid+to+use+these+creatures%2C+either+for+food%2C+physic+or+service%2C+no+nor+for+our+honest+delight+and+recreation.+See+your+charter+for+so+doing%2C+if+not+implicitly+given+to+Adam%2C+yet+expressly+to+Noah%3B+and+again+renewed%2C+Acts+10%2C+under+the+Gospel%2C+in+the+vision+and+voice+to+Peter%2C+%E2%80%98Arise+Peter%2C+kill%2C+and+eat.%E2%80%99+And+though+%E2%80%99tis+said+the+disciples+of+the+Nazarites+may+be+known+by+their+abstinence+from+the+flesh+of+all+living+creatures%2C+yet+our+Lord+Jesus+Christ+of+Nazareth%2C+and+He+that+in+substance+though+not+in+vow+and+ceremony+was+the+true+Nazarite%2C+gave+his+disciples+no+such+commandment.+Those+who+refuse+altogether+to+eat+the+flesh+of+living+creatures%2C+when+duly+killed%2C+deserve+the+name+of+Pythagoreans%2C+followers+of+Pythagoras+the+philosopher%2C+rather+than+to+be+called+Christians+or+disciples+of+Christ+our+Saviour.+So+then%2C+use+these+creatures+we+may%2C+we+must%2C+without+scruple+for+our+meat%3B+yea+and+we+may+use+these+creatures+for+our+work%2C+to+plow+and+harrow+the+ground%2C+and+to+carry+our+corn+into+the+barn%2C+and+for+any+other+necessary+use.+And+although+many+condemn+those+persons+who+promote+the+generation+of+mules+%5Bwhich+are+a+mix+of+species%5D%2C+so+does+Maimonides+in+his+More+Nev.+p.+3%2C+ch.+4+and+our+own+writers+on+Gen.+36%3A24%2C+yet+we+may+use+them+lawfully%3B+for+we+find+them+brought+to+Solomon%2C+1+Kings+10%3A25%3B+2+Chron.+9%3A24%2C+and+amongst+the+Israelites+at+their+return+from+captivity%2C+Ezra+2%3A66+and+Neh.+7%3A68.+And+we+nowhere+find+that+ever+they+were+commanded+to+put+these+away%2C+though+monsters+in+nature%2C+as+they+were+to+put+away+their+outlandish+wives.%E2%80%9D%0A%0A%E2%80%94+Thomas+Hodges%2C+The+Creature%E2%80%99s+Goodness%2C+as+they+came+out+of+God%E2%80%99s+Hands%2C+%26+the+good+man%E2%80%99s+mercy+to+the+brute+creatures%2C+which+God+has+put+under+his+feet+in+Two+Sermons%2C+%28London%2C+1675%29%2C+sermon+2%2C+pp.+40-41&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8c1dedb343.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8c1dedb343.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-things-indifferent-adiaphora/#:~:text=3.%20Much%20less%20must%20we%20prefer,to%20put%20away%20their%20outlandish%20wives&amp;text=3.%20Much%20less%20must%20we%20prefer%20them%20%5Banimals&amp;text=they%20were%20to%20put%20away%20their%20outlandish%20wives" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>‘Let people praise thee, Lord; Let people all thee praise: Oh let the nations be glad, And sing for joy always. Then shall the earth yield her increase, God, our God, bless us shall; God shall us bless, and of the earth, The ends shall fear Him all.’

Here the two grand characteristics of the true Church of God,—the evangelical, and evangelistic or missionary,—are written as in a sunbeam:—the evangelical, in the possession of all needful gifts and graces out of the plenitude of the Spirit’s fulness: the evangelistic, in the instant and perpetual propension which that possession ought to generate and feed, instrumentally to dispense these blessings among all nations. As if to confound lukewarm and misjudging professors throughout all generations, these characteristics are represented by the Spirit of inspiration itself, as essential to the very existence and well-being of the Church, and in their very nature inseparable.

The prayer of the Church, as dictated by the Divine Spirit, is directed to the obtainment of blessings, not as an end, merely terminating in herself, but as a means towards the promotion and attainment of an ulterior end of the sublimest description,—the enlightenment and conversion of all nations! Hence it follows, that when a Church ceases to be evangelistic, it must cease to be evangelical; and when it ceases to be evangelical, it must cease to exist as a true Church of God, however primitive or apostolic it may be in its outward form and constitution!</p></blockquote>

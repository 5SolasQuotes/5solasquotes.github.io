<main class="wrap"><figure class="quote" id="q-bca035c0ae" data-kw="">
<blockquote><p>To effect this union [with Christ], the Holy Spirit uses a double instrument, the preaching of the Word and the administration of the sacraments. When we say that the Holy Spirit uses an external minister as instrument, we mean this: both in the preaching of the Word and in the use of the sacraments, there are two ministers, who have distinct offices. The external minister administers the vocal word, and the sacred signs which are external, earthly and fallible. But the internal minister, who is the Holy Spirit, freely works internally, while by his secret virtue he effects in the hearts of whomsoever he will their union with Christ through one faith. This union is a thing internal, heavenly and indestructible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin: Theological Treatises</cite>, J. K. S. Reid, Calvin: Theological Treatises (Louisville, KY; London: Westminster John Knox Press, 1954), 172–73.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ.html">Union with Christ</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-58c1fdd9d1" data-kw="">
<blockquote><p>Whether Christ is one or two? The prior is affirmed. … Whether Christ is able to be called a composite? It is denied. Whether a whole? It is distinguished. … Whether there are two beings [esse] in Christ, or a twofold existence and individualness? It is affirmed with a distinction. Whether a twofold life? It is affirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Subtitle II, ‘Of the Consequences &amp; Effects of the Union’, ‘Of Christ the Theanthropos’ in Tract 2, ‘Of the Person, Offices &amp; States of Christ the Mediator’ in A Syllabus of Theological Problems</cite>, … (Utrecht, 1643) n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether Christ is one or two? The prior is affirmed. … Whether Christ is able to be called a composite? It is denied. Whether a whole? It is distinguished. … Whether there are two beings [esse] in Christ, or a twofold existence and individualness? It is affirmed with a distinction. Whether a twofold life? It is affirmed.”

— Gisbertus Voetius, Subtitle II, ‘Of the Consequences &amp; Effects of the Union’, ‘Of Christ the Theanthropos’ in Tract 2, ‘Of the Person, Offices &amp; States of Christ the Mediator’ in A Syllabus of Theological Problems… (Utrecht, 1643) n.p.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhether+Christ+is+one+or+two%3F+The+prior+is+affirmed.+%E2%80%A6+Whether+Christ+is+able+to+be+called+a+composite%3F+It+is+denied.+Whether+a+whole%3F+It+is+distinguished.+%E2%80%A6+Whether+there+are+two+beings+%5Besse%5D+in+Christ%2C+or+a+twofold+existence+and+individualness%3F+It+is+affirmed+with+a+distinction.+Whether+a+twofold+life%3F+It+is+affirmed.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Subtitle+II%2C+%E2%80%98Of+the+Consequences+%26+Effects+of+the+Union%E2%80%99%2C+%E2%80%98Of+Christ+the+Theanthropos%E2%80%99+in+Tract+2%2C+%E2%80%98Of+the+Person%2C+Offices+%26+States+of+Christ+the+Mediator%E2%80%99+in+A+Syllabus+of+Theological+Problems%E2%80%A6+%28Utrecht%2C+1643%29+n.p.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F58c1fdd9d1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/58c1fdd9d1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-grace-of-union-the-logos-assuming-flesh/#:~:text=Whether%20Christ%20is%20one%20or%20two,a%20twofold%20life%3F%20It%20is%20affirmed&amp;text=Whether%20Christ%20is%20one%20or%20two%3F%20The%20prior&amp;text=distinction.%20Whether%20a%20twofold%20life%3F%20It%20is%20affirmed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8ffaeccd41" data-kw="">
<blockquote><p>1st. The highest and closest union is between those things that are actuated by one spirit dwelling and moving in them… 2dly. Things at the greatest distance, and between which there is no physical continuity, may be acted by the same spirit, providing he be immense and infinite… 3dly. ‘Tis Christ as mediator that believers are united to… 4. The Holy Ghost did in a singular manner operate upon and reside in the human nature of Christ… 5thly. The Holy Ghost is the immediate renewer and sanctifier of the elect… 6thly. ‘Tis from, by, and through Jesus Christ as mediator that the Spirit, whether it be with respect to his Immediate seisure of us and dwelling in us, or with reference to any of his saving operations, is given to and bestowed upon us… 7ly. Through the communication of the Spirit from Christ to us, and immediately upon his taking the possession of us, the nature of Christ, the seed of God, and a vital living principle comes to be formed in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-ferguson.html">Robert Ferguson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 3, ‘Of the Union of Believers with Christ’ Outline in The Interest of Reason in Religion… &amp; the Nature of the Union Betwixt Christ &amp; Believers; (with Reflections on Several Late Writings, especially Mr. Sherlock’s Discourse…)… (London, 1675), pp. 421-665, pp. 656-661:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>
<div class="actions"><button class="copy" data-copy="“1st. The highest and closest union is between those things that are actuated by one spirit dwelling and moving in them… 2dly. Things at the greatest distance, and between which there is no physical continuity, may be acted by the same spirit, providing he be immense and infinite… 3dly. ‘Tis Christ as mediator that believers are united to… 4. The Holy Ghost did in a singular manner operate upon and reside in the human nature of Christ… 5thly. The Holy Ghost is the immediate renewer and sanctifier of the elect… 6thly. ‘Tis from, by, and through Jesus Christ as mediator that the Spirit, whether it be with respect to his Immediate seisure of us and dwelling in us, or with reference to any of his saving operations, is given to and bestowed upon us… 7ly. Through the communication of the Spirit from Christ to us, and immediately upon his taking the possession of us, the nature of Christ, the seed of God, and a vital living principle comes to be formed in us.”

— Robert Ferguson, ch. 3, ‘Of the Union of Believers with Christ’ Outline in The Interest of Reason in Religion… &amp; the Nature of the Union Betwixt Christ &amp; Believers; (with Reflections on Several Late Writings, especially Mr. Sherlock’s Discourse…)… (London, 1675), pp. 421-665, pp. 656-661:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1st.+The+highest+and+closest+union+is+between+those+things+that+are+actuated+by+one+spirit+dwelling+and+moving+in+them%E2%80%A6+2dly.+Things+at+the+greatest+distance%2C+and+between+which+there+is+no+physical+continuity%2C+may+be+acted+by+the+same+spirit%2C+providing+he+be+immense+and+infinite%E2%80%A6+3dly.+%E2%80%98Tis+Christ+as+mediator+that+believers+are+united+to%E2%80%A6+4.+The+Holy+Ghost+did+in+a+singular+manner+operate+upon+and+reside+in+the+human+nature+of+Christ%E2%80%A6+5thly.+The+Holy+Ghost+is+the+immediate+renewer+and+sanctifier+of+the+elect%E2%80%A6+6thly.+%E2%80%98Tis+from%2C+by%2C+and+through+Jesus+Christ+as+mediator+that+the+Spirit%2C+whether+it+be+with+respect+to+his+Immediate+seisure+of+us+and+dwelling+in+us%2C+or+with+reference+to+any+of+his+saving+operations%2C+is+given+to+and+bestowed+upon+us%E2%80%A6+7ly.+Through+the+communication+of+the+Spirit+from+Christ+to+us%2C+and+immediately+upon+his+taking+the+possession+of+us%2C+the+nature+of+Christ%2C+the+seed+of+God%2C+and+a+vital+living+principle+comes+to+be+formed+in+us.%E2%80%9D%0A%0A%E2%80%94+Robert+Ferguson%2C+ch.+3%2C+%E2%80%98Of+the+Union+of+Believers+with+Christ%E2%80%99+Outline+in+The+Interest+of+Reason+in+Religion%E2%80%A6+%26+the+Nature+of+the+Union+Betwixt+Christ+%26+Believers%3B+%28with+Reflections+on+Several+Late+Writings%2C+especially+Mr.+Sherlock%E2%80%99s+Discourse%E2%80%A6%29%E2%80%A6+%28London%2C+1675%29%2C+pp.+421-665%2C+pp.+656-661%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8ffaeccd41.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8ffaeccd41.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/union-with-christ#:~:text=1st.%20The%20highest%20and%20closest%20union,comes%20to%20be%20formed%20in%20us&amp;text=1st.%20The%20highest%20and%20closest%20union%20is%20between&amp;text=living%20principle%20comes%20to%20be%20formed%20in%20us" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0985b8d1c9" data-kw="">
<blockquote><p>As God raised Christ from the dead and set him at his own right hand in heavenly places; so you, that were dead in sins, hath he quickened and raised you up together in him. This analogy is the very thing he would have them understand. They had undergone a great change; they had been brought to life; they had been raised from the dead by the same almighty power which wrought in Christ. There was as great a difference between their present and their former condition, as between Christ in the tomb and Christ at the right hand of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, on 1:19–20</span></figcaption>

</figure><figure class="quote" id="q-a8c10b0015" data-kw="">
<blockquote><p>By so doing we by no means establish as the formal cause of our justification that essential righteousness of Christ, which is itself His deity, or the supreme purity and holiness of His humanity, or His sufferings absolutely considered, which ceased together with His earthly life. But we say that the merit of His sufferings (παθημάτων) is the material cause of our justification, which is substituted in place of our guilt, inborn corruption, and all our sins that flow forth from that sewer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defense of Justification Through The Righteousness of Christ Alone Freely Imputed, Obtained by Living Faith in R. Scott Clark and Casey Carmichael, eds., Justification By Faith Alone</cite>, reply to the Anonymous Man’s Third Argument</span></figcaption>

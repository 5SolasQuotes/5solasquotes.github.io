</figure><figure class="quote" id="q-4f6dc2e3c8" data-kw="">
<blockquote><p>It is called by Luther “the article of a standing and a falling church” (Articulus stantis, et cadentis Ecclesiae). By other Christians, it is termed the characteristic and basis of Christianity—not without reason—the principal rampart of the Christian religion.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It is called by Luther “the article of a standing and a falling church” (Articulus stantis, et cadentis Ecclesiae). By other Christians, it is termed the characteristic and basis of Christianity—not without reason—the principal rampart of the Christian religion.”

— Francis Turretin, Institutes of Elenctic Theology, Topic 16, Q. 1, § 1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+called+by+Luther+%E2%80%9Cthe+article+of+a+standing+and+a+falling+church%E2%80%9D+%28Articulus+stantis%2C+et+cadentis+Ecclesiae%29.+By+other+Christians%2C+it+is+termed+the+characteristic+and+basis+of+Christianity%E2%80%94not+without+reason%E2%80%94the+principal+rampart+of+the+Christian+religion.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+Topic+16%2C+Q.+1%2C+%C2%A7+1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4f6dc2e3c8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4f6dc2e3c8.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-a8d5e74bd6" data-kw="">
<blockquote><p>However, our inherent righteousness, which is begun in the renewal through the Holy Spirit, is not such on account of the adhering imperfection and impurity of the flesh. Therefore a different righteousness is necessary, by which, when it enters in and intercedes, we may be justified before God to life eternal. This indeed is the satisfaction and obedience, that is, the righteousness of Christ, the Mediator, which is offered through the ministry of the Word and of the sacraments, is apprehended by faith, and is imputed by God to the believers, so that we can interpose it between the judgment of God and our sins, so that we are protected under it as under a shield from the divine wrath which we have deserved, so that “covered by it we may now boldly and securely stand before the divine tribunal and thus be pronounced righteous to life eternal.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part 1, Topic on Justification</span></figcaption>

<blockquote><p>Before we go further we must take it as clear, that by Scriptures, Christ and his Apostles do mean the Word of God written. Our enquiry is, What written word?

Not the Original Copy, for that was in the Ark, and there only, and not to be seen of every body, if of any body, but the high Priest: and I know nothing but those Tables perished with the Temple. Nor can it be, that when he did call upon them to search the Scriptures he did send them to the Ark, which then was not. I doubt not but he meant by the Scriptures, the writings of Moses &amp; the Prophets.

Now who can think that Christ and his Apostles did turn over the Church and people of God to the Scriptures written by Moses and the Prophets own hands? those were not then extant, nor when extant to be seen of every body. What then? when he bade them search the Scriptures, he must needs mean some transcribed Copies, or some Translations For Copies in the Hebrew, I doubt me whether the common people did then understand the Hebrew, and amongst the Bereans, who did search the Scriptures, I think it past question, that there were many ordinary people, and perhaps Coblers or Taylors, or such, as Dr J. Rainolds seems to judge

If this be granted that those who were commanded to search the Scriptures, and commended for searching the Scriptures, did not, could not search the Original Hebrew, what shall we think then? No other can be imagined but some Translations, which they did understand, Syriac, Chaldee, but chiefly the Greek Translation, which the most, if not all, understood.

But you will say, the Translators were subject to mistake, and err, or worse, being no Prophets; and if they did understand the Hebrew, yet sith they could not come by the first Original Copy, they must needs have recourse to some transcribed Copies. Whether the Church were to repair to Translations, or to transcribed Copies, all comes to one, sith neither Transcribers nor Translators were Prophets. Very good men let them be, yet men they were, and subject to error.

May I speak my Opinion, I think when Christ said search the Scriptures, he meant the Scriptures translated into Greek, and by Scriptures, the Apostles meant the Greek Translation, which tongue, if not in Christ’s time, yet in the Apostles times in a manner all did understand. Wherefore when the Apostle saith (is given by inspiration, and is profitable) he means it is profitable to be read, or heard read in the Greek Translation.

And the rather am I of this mind, because Scholars do know that the New Testament doth cite the places out of the Old Testament according to the Greek Translation, and most an end are very punctual in it. However, whither we look on Translations, or Transcription, sith the first Table written by God himself was lost with the Temple, and the Original Greek Copy of the Translation of the Old Testament was, the Learned think, (and I think they think well in it) burned by Julius Caesar’s Army, when they fired Alexandria, and the famous Library there.

The Ephesians were built on the Prophets and Apostles; the Apostles they had with them, but the Prophets were dead and gone; Malachi was the last; the Apostles they might consult with and they had their writings, but for the writings of the Prophets, the Ephesians being Gentiles (I take it for granted) understood not the Hebrew, at least the body of them, but being Grecians, they might and did understand the Greek translation, which I doubt not was purer then, then it is now: yet then being but a translation, and the Original it self but carried up and down in transcribed Copies, it is consented unto by all parties, that the Translators and Transcribers might err, being not Prophets, nor endued with that infallible spirit in translating, or transcribing, as Moses and the Prophets were in their Original writings.

The tentation lies on this side, how the Ephesians then, and much more sith there are no Prophets, no Apostles, no nor any infallible spirits in the Church, how can we build on the foundation of the Prophets and Apostles now, sith the Scriptures in their translated Copies are not free from all possible corruptions, in the Copies we have either by transcribers or translators.

Besides, many are unlearned, and cannot read a Letter. For these last, though they cannot read, yet they can hear it read to them. Do not we see many blind men in Schools come to great learning by hearing others read Philosophy, and Divinity, and the body of other Arts &amp; Sciences to them? &amp; so it is with the Scriptures, they cannot read them, but they can hear them read &amp; preached by others.

Dr. Jackson in his first book of his Commentaries on the Creed, and Mr. John Goodwin in a set and large Treatise to justify the authority of the Scriptures, have shewed much learning, and taken great pains in this Argument. But like two Elephants, they both swim so deep, that the benefit and comfort of it can reach but to a few, we must fight lower and in a briefer way (least we wear the Reader and charge the Printer) and set down the brief of the matter in it, so that common people, and men of ordinary brains, (who are most subject to Tentation) may find a way to spell out the right of this, how faith can be had, and the soul built on the foundation of the Prophets and Apostles, sith this foundation was in their Writings, and their Writings are under no other notion to any, but either the Original transcribed or translated.</p></blockquote>

<blockquote><p>Augustine reminds us that divine omnipotence does not mean that God can do what is contradictory or at odds with his perfection:

He cannot will and not will at the same time. For justice cannot wish to do what is unjust; wisdom cannot wish what is foolish; truth cannot wish what is false. Whence we are reminded that the omnipotent God cannot do not only what the Apostle states: ‘He cannot disown himself,’ but many other things as well. Behold, I say this and I do not dare to say it in accordance with His truth, because I do not dare to deny that the omnipotent God cannot die, cannot be changed, cannot be deceived, cannot become wretched, cannot be overcome. Far be it that the Omnipotent One should be able to do these things and other things of this sort. And for that very reason not only does truth show that He is omnipotent because he cannot do these things, but truth also concludes that he who can do such things is not omnipotent.</p></blockquote>

— Augustine of Hippo, Sermons on the Liturgical Seasons, trans. Mary Sarah Muldowney in The Fathers of the Church, 38: 134 (Sermon 214).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAugustine+reminds+us+that+divine+omnipotence+does+not+mean+that+God+can+do+what+is+contradictory+or+at+odds+with+his+perfection%3A%0A%0AHe+cannot+will+and+not+will+at+the+same+time.+For+justice+cannot+wish+to+do+what+is+unjust%3B+wisdom+cannot+wish+what+is+foolish%3B+truth+cannot+wish+what+is+false.+Whence+we+are+reminded+that+the+omnipotent+God+cannot+do+not+only+what+the+Apostle+states%3A+%E2%80%98He+cannot+disown+himself%2C%E2%80%99+but+many+other+things+as+well.+Behold%2C+I+say+this+and+I+do+not+dare+to+say+it+in+accordance+with+His+truth%2C+because+I+do+not+dare+to+deny+that+the+omnipotent+God+cannot+die%2C+cannot+be+changed%2C+cannot+be+deceived%2C+cannot+become+wretched%2C+cannot+be+overcome.+Far+be+it+that+the+Omnipotent+One+should+be+able+to+do+these+things+and+other+things+of+this+sort.+And+for+that+very+reason+not+only+does+truth+show+that+He+is+omnipotent+because+he+cannot+do+these+things%2C+but+truth+also+concludes+that+he+who+can+do+such+things+is+not+omnipotent.%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+Sermons+on+the+Liturgical+Seasons%2C+trans.+Mary+Sarah+Muldowney+in+The+Fathers+of+the+Church%2C+38%3A+134+%28Sermon+214%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F83733c712e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/83733c712e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/10/03/augustine-divine-omnipotence-is-not-absolute-lawless-power/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-63c4a4c1f1" data-kw="">
<blockquote><p>The oldest of the Conclusions, so far as is known, is that to Psalm 148 [only], which is found in the 1575 edition by Bassandyne, at the very end of the volume… Though the introduction of these compositions is involved in obscurity, it cannot be supposed that they were forced into the Psalm Book against the wishes of the church authorities… It is more conceivable that they were inserted quietly, on the printer’s own responsibility or that of other private parties; and their disappearance from most of the subsequent editions lends countenance to this conjecture. Even those for common metre are wanting in so important an edition of 1615. Very possibly those who had Episcopal leanings had most to do with their first introduction; but the absence of any trace of controversy on the subject warrants the inference that other parties acquiesced, so far at least as to make the use of them a matter of forebearance. It may also be inferred from the state of the psalm books that they were used only to a partial extent till after 1615.</p></blockquote>

nclusions%2C%20so,a%20partial%20extent%20till%20after%201615&amp;text=The%20oldest%20of%20the%20Conclusions%2C%20so%20far%20as&amp;text=only%20to%20a%20partial%20extent%20till%20after%201615" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…whereas your surplice is arbitrarily institute[d], and imposed to signify innocency, without either real foundation or sufficient warrant, wherein, whether you do more usurp against God’s prerogative to appoint sacred and mysterious signs, and that simplicity, in which he has set forth his Gospel, or be more grossly mistaken in the event and fruit of your application, is a great question? I grant that necessity or decency have introduced many things circumstantial that are rational, and consequently upon some real antecedent ground expressive of their use and end: as grave apparel in pastors, a becoming covering of pulpits, tables in sacred use, regulation of time, postures, gestures and the like, without which worship cannot be performed; But to ascribe a liberty to the Church of appointing ceremonies, having for reason of their signification, the will of the instituter, and their use only in the representation, is so manifest an impingement upon Divine authority and the sacraments thereby ordained, and has already produced such a mass of superstitious superfluity in the Romish-Church, that I much admire to find a serious person pleading for such fopperies…</p></blockquote>

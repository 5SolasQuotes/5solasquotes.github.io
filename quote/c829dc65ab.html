<main class="wrap"><figure class="quote" id="q-c829dc65ab" data-kw="">
<blockquote><p>All, therefore, are outside of the [Christian] dispensation, who, under pretext of knowledge, understand that Jesus was one, and Christ another, and the Only-begotten another, from whom again is the Word, and that the Saviour is another, whom these disciples of error allege to be a production of those who were made Æons in a state of degeneracy. Such men are to outward appearance sheep; for they appear to be like us, by what they say in public, repeating the same words as we do; but inwardly they are wolves.

Their doctrine is homicidal, conjuring up, as it does, a number of gods, and simulating many Fathers, but lowering and dividing the Son of God in many ways. These are they against whom the Lord has cautioned us beforehand; and His disciple, in his Epistle already mentioned, commands us to avoid them, when he says: “For many deceivers are entered into the world, who confess not that Jesus Christ is come in the flesh. This is a deceiver and an antichrist. Take heed to them, that ye lose not what ye have wrought.” And again does he say in the Epistle: “Many false prophets are gone out into the world. Hereby know ye the Spirit of God: Every spirit that confesseth that Jesus Christ is come in the flesh is of God; and every spirit which separates Jesus Christ is not of God, but is of antichrist.”

These words agree with what was said in the Gospel, that “the Word was made flesh, and dwelt among us.” Wherefore he again exclaims in his Epistle, “Every one that believeth that Jesus is the Christ, has been born of God;” knowing Jesus Christ to be one and the same, to whom the gates of heaven were opened, because of His taking upon Him flesh: who shall also come in the same flesh in which He suffered, revealing the glory of the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/irenaeus-of-lyons.html">Irenaeus of Lyons</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Heresies</cite>, (c. 175-85), 3.16.8 in Ante-Nicene Fathers, 1: 443.</span></figcaption>

</figure><figure class="quote" id="q-cfe85b8da3" data-kw="">
<blockquote><p>Therefore, whether they seem to abide within [the Church], or are openly outside [of it], whatsoever is flesh is flesh, and what is chaff is chaff, whether they persevere in remaining in their barrenness on the threshing-floor, or, when temptation befalls them, are carried out as it were by the blast of some wind. And even that man is always severed from the unity of the Church which is without spot or wrinkle, who associates with the congregation of the saints in carnal obstinacy. Yet we ought to despair of no man, whether he be one who shows himself to be of this nature within the pale of the Church, or whether he more openly opposes it from without. But the spiritual, or those who are steadily advancing with pious exertion towards this end, do not stray without the pale [of salvation]; since even when, by some perversity or necessity among men, they seem to be driven forth, they are more approved than if they had remained within [the Church], since they are in no degree roused to contend against the Church, but remain rooted in the strongest foundation of Christian charity on the solid rock of unity. For hereunto belongs what is said in the sacrifice of Abraham: “But the birds divided he not.” [Gen. 15]</p></blockquote>

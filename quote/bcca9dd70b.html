<blockquote><p>24… It is right that he who, in adult age, is admitted to the fellowship of a covenant by one from whom he had hitherto been alienated, should previously learn its conditions; but it is not so with the infant born to him. He, according to the terms of the promise, is included in the promise by hereditary right from his mother’s womb. Or, to state the matter more briefly and more clearly. If the children of believers, without the help of understanding, are partakers of the covenant, there is no reason why they should be denied the sign, because they are unable to swear to its stipulations… But the child descended from unbelieving parents is deemed an alien to the covenant until he is united to God by faith. Hence, it is not strange that the sign is withheld when the thing signified would be vain and fallacious. In that view, Paul says that the gentiles, so long as they were plunged in idolatry, were strangers to the covenant (Eph. 2:11). The whole matter may, if I mistake not, be thus briefly and clearly expounded: Those who, in adult age, embrace the faith of Christ, having hitherto been aliens from the covenant, are not to receive the sign of baptism without previous faith and repentance. These alone can give them access to the fellowship of the covenant, whereas children, deriving their origin from Christians, as they are immediately on their birth received by God as heirs of the covenant, are also to be admitted to baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 3, bk. 4; ch. 16, pp. 373-74</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-58623a42cd" data-kw="">
<blockquote><p>All this while we have treated of the complex notion of faith; or at least, as it is that first general grace whereby we are inserted into Christ, and justified by it together with its blessed retinue of subordinate evangelical graces, which are reduced to these three, Faith, Hope and Charity: where faith stands by itself, and is a peculiar grace of itself, and has in this acceptation a more than common prerogative attributed unto it in order to our justification, or the bringing us to Christ, and partaking of Christ. For that is it whereby we are only properly justified; and all graces serve for no other end here, than to adapt us for the benefit of justification through Christ, and for Christ’s sake alone.</p></blockquote>

<blockquote><p>It still continues equally true, upon the Protestant as upon the Romish doctrine of justification, that God requires of us faith and repentance, and requires them of us as indispensably necessary to our escaping His wrath and curse due to us for our sins, though not as exerting any causality or efficiency in procuring or obtaining for us pardon and acceptance, except instrumentally in the case of faith;</p></blockquote>

</figure><figure class="quote" id="q-72e0afa985" data-kw="">
<blockquote><p>…take notice of this distinction, as a foundation, viz. that there is in Scripture a twofold repentance or humiliation of the soul for sin: The one antecedent and going before pardon, and this the Scripture requires as a necessary condition, without which forgiveness of sin cannot be obtained: of this repentance the Scripture for the most part speaks, Eze. 18:18, 30; Mt. 3.2; Mk. 6.12; Lk. 13:3; Acts 3:19; and generally in most places of Scripture. In the second place there is an humiliation of heart and brokenness of soul for sin, arising from the apprehension of God’s love in pardoning, whereby we grieve that we should deal so unkindly with so good and gracious a God: this, though more rarely, yet is sometimes spoken of in Scripture, as first in this woman, who out of the apprehension of God’s love in pardoning so much to her did pour out her soul in all ways of thankfulness. After this manner also was David’s repentance, Ps. 51; for he was thus deeply affected after Nathan had told him his sin was taken away; although it does appear by the psalm also that he had not as yet that sense of pardon which did quiet his conscience. This kind of affection was also in Paul, 1 Tim. 1:12–16; 1 Cor. 15:8–9, in which places the apostle, remembering his former sins, confesses them, and acknowledges thereby his unworthiness of all that grace and favour he had received; so that the apostle does not there humble himself that he may obtain mercy, but because he had obtained mercy. The most eminent instance of this kind of sorrow and shame is Eze. 16:62–63, where God promises to establish his covenant with them, and then mark the event of this: ‘That thou mayest remember and be confounded, and never open thy mouth more because of thy shame, when I am pacified toward thee.’ So then both these kinds of humiliations are to be owned and practiced; and therefore it is a false and dangerous error to acknowledge no other kind of repentance than the latter [former]. The Papists will not acknowledge this latter humiliation at all, because they deny all faith and assurance that a believer may have of his sins in particular. And others say that there is only this latter; and therefore the forementioned author, in his treatise of Gospel Repentance, makes this only gospel-repentance. But as gospel-faith is not that reflex act of the soul in a man whereby it is persuaded that Christ is his, but a direct act of taking and receiving Christ to be ours, so a gospel-repentance is not that mainly whereby we are humbled because we receive God’s love to us in pardoning, but principally in that loathing of ourselves to obtain pardon. It is therefore great ignorance in that author, in his treatise of Gospel Repentance, when p. 58, he calls repentance that goes before this faith, viz. that my sins are pardoned, a dead work; as if the faith that justifies, and without which it is impossible to please God, were the believing that my sins are pardoned; whereas the Scripture makes it to be the receiving of Christ and laying hold on Him. And seeing that the object must in order of nature be before the act that is employed about it, it follows infallibly that I must have justification before I can believe I have it. Repentance therefore may be thought to go before a twofold act of faith: first, that whereby Christ is laid hold upon and made ours, and so the repentance that precedes this may be called legal and slavish. Or secondly, before a persuasion that my sins are pardoned; and before this act of faith repentance must necessarily go, because the covenant of grace dispenses pardon only to such.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, (London: Miller, 1651), Lecture 30, on Lk. 7:47, pp. 267-68</span></figcaption>

ance than the latter [former]. The Papists will not acknowledge this latter humiliation at all, because they deny all faith and assurance that a believer may have of his sins in particular. And others say that there is only this latter; and therefore the forementioned author, in his treatise of Gospel Repentance, makes this only gospel-repentance. But as gospel-faith is not that reflex act of the soul in a man whereby it is persuaded that Christ is his, but a direct act of taking and receiving Christ to be ours, so a gospel-repentance is not that mainly whereby we are humbled because we receive God’s love to us in pardoning, but principally in that loathing of ourselves to obtain pardon. It is therefore great ignorance in that author, in his treatise of Gospel Repentance, when p. 58, he calls repentance that goes before this faith, viz. that my sins are pardoned, a dead work; as if the faith that justifies, and without which it is impossible to please God, were the believing that my sins are pardoned; whereas the Scripture makes it to be the receiving of Christ and laying hold on Him. And seeing that the object must in order of nature be before the act that is employed about it, it follows infallibly that I must have justification before I can believe I have it. Repentance therefore may be thought to go before a twofold act of faith: first, that whereby Christ is laid hold upon and made ours, and so the repentance that precedes this may be called legal and slavish. Or secondly, before a persuasion that my sins are pardoned; and before this act of faith repentance must necessarily go, because the covenant of grace dispenses pardon only to such.”

62%E2%80%9363%2C+where+God+promises+to+establish+his+covenant+with+them%2C+and+then+mark+the+event+of+this%3A+%E2%80%98That+thou+mayest+remember+and+be+confounded%2C+and+never+open+thy+mouth+more+because+of+thy+shame%2C+when+I+am+pacified+toward+thee.%E2%80%99+So+then+both+these+kinds+of+humiliations+are+to+be+owned+and+practiced%3B+and+therefore+it+is+a+false+and+dangerous+error+to+acknowledge+no+other+kind+of+repentance+than+the+latter+%5Bformer%5D.+The+Papists+will+not+acknowledge+this+latter+humiliation+at+all%2C+because+they+deny+all+faith+and+assurance+that+a+believer+may+have+of+his+sins+in+particular.+And+others+say+that+there+is+only+this+latter%3B+and+therefore+the+forementioned+author%2C+in+his+treatise+of+Gospel+Repentance%2C+makes+this+only+gospel-repentance.+But+as+gospel-faith+is+not+that+reflex+act+of+the+soul+in+a+man+whereby+it+is+persuaded+that+Christ+is+his%2C+but+a+direct+act+of+taking+and+receiving+Christ+to+be+ours%2C+so+a+gospel-repentance+is+not+that+mainly+whereby+we+are+humbled+because+we+receive+God%E2%80%99s+love+to+us+in+pardoning%2C+but+principally+in+that+loathing+of+ourselves+to+obtain+pardon.+It+is+therefore+great+ignorance+in+that+author%2C+in+his+treatise+of+Gospel+Repentance%2C+when+p.+58%2C+he+calls+repentance+that+goes+before+this+faith%2C+viz.+that+my+sins+are+pardoned%2C+a+dead+work%3B+as+if+the+faith+that+justifies%2C+and+without+which+it+is+impossible+to+please+God%2C+were+the+believing+that+my+sins+are+pardoned%3B+whereas+the+Scripture+makes+it+to+be+the+receiving+of+Christ+and+laying+hold+on+Him.+And+seeing+that+the+object+must+in+order+of+nature+be+before+the+act+that+is+employed+about+it%2C+it+follows+infallibly+that+I+must+have+justification+before+I+can+believe+I+have+it.+Repentance+therefore+may+be+thought+to+go+before+a+twofold+act+of+faith%3A+first%2C+that+whereby+Christ+is+laid+hold+upon+and+made+ours%2C+and+so+the+repentance+that+precedes+this+may+be+called+legal+and+slavish.+Or+secondly%2C+before+a+persuasion+that+my+sins+are+pardoned%3B+and+before+this+act+of+faith+repentance+must+necessarily+go%2C+because+the+covenant+of+grace+dispenses+pardon+only+to+such.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+True+Doctrine+of+Justification+Asserted+%26+Vindicated%2C+from+the+Errours+of+Papists%2C+Arminians%2C+Socinians+%26+more+especially+Antinomians+in+30+Lectures+%28London%3A+Miller%2C+1651%29%2C+Lecture+30%2C+on+Lk.+7%3A47%2C+pp.+267-68&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F72e0afa985.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/72e0afa985.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relation-of-repentance-to-saving-faith-justification/#:~:text=take%20notice%20of%20this%20distinction%2C%20as,grace%20dispenses%20pardon%20only%20to%20such&amp;text=take%20notice%20of%20this%20distinction%2C%20as%20a%20foundation&amp;text=covenant%20of%20grace%20dispenses%20pardon%20only%20to%20such" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

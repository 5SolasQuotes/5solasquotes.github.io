<main class="wrap"><figure class="quote" id="q-53c9f4d5e4" data-kw="">
<blockquote><p>Doubtless, friend, the Sabbaths of the holy are the suburbs of heaven. In heaven there is no buying, no selling, no ploughing, no sowing, nothing but worshipping God, communion with him, fruition of him, and delight in him. There remains a rest for the people of God. There they rest from their labours.

If thou on a Lord’s-day turnest thy back upon the world, and goest up into the mount, conversing with, and rejoicing in the blessed God, what dost thou less than begin thine eternal Sabbath here? Such a Lord’s-day can be no less than heaven in a looking glass, representing truly, though darkly, thy future eternal happiness. There is no perfume so sweet to a pilgrim as his own smoke.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling</cite>, (1661-65) in The Works of George Swinnock, M.A. (5 vols, Edinburgh: James Nichol, 1868), 1: 241.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0803bf8bd7" data-kw="">
<blockquote><p>The decisive argument for the perpetual obligation of the sabbath is the fourth commandment. The ten commandments, as being of a moral nature, and therefore always binding, were promulgated in a very different manner from the other institutions of Moses. They were first uttered in a voice of thunder, from the midst of the fire on Sinai, and were then inscribed by the finger of God on two tables of hewn stone.

Now, it is admitted, that all the other precepts of the Decalogue are moral; and would it not be an unaccountable thing that a ceremonial, temporary commandment should be inserted in the midst of these moral precepts? This is the law which Christ says he came not to destroy, but to fulfil. None of these commandments have been abrogated; and therefore the fourth, as well as the others remains in fall force. And it is remarkable that the prophets, in denouncing the sins of the people, always mention the violation of the sabbath in the same catalogue with the transgression of moral precepts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Compend of Bible Truth</cite>, (Philadelphia: Presbyterian Board of Publication, 1846), pp 185-86.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-4c214d30fa" data-kw="">
<blockquote><p>If any thing be altered or added which is not commanded of God, being not essential, but accidental, and not as necessary, but as indifferent, appertaining to decency, or to order, or to edification, we cannot hence conclude that anything is altered of the appointed worship, or that there is another worship erected. As for example, Christ performed his Supper at night. The apostles were wont to perform it also in the morning, and the Church followed afterwards this time. Should a man hereupon say that anything is derogated from the Supper of the Lord? Surely no, because Christ commanded not the same to be celebrated in the night, as Himself observed it, but only ‘hoc facite,‘ that we should do that (for the matter or substance) which He did, but not at that time wherein He did it. Also to that the primitive Church (as appears in Justin Martyr) did mingle water with the wine in the Lord’s Supper; it is not a sufficient ground to say they altered or changed the institution of the Lord’s Supper, and that for two reasons: One, because it may be that the wine which Christ Jesus gave to his disciples was mingled with water, seeing the apostles do not report the contrary and it is probable that the primitive Church might receive this from the apostles. Another reason is because the primitive Church did not add water as a matter altogether necessary, and so as appertaining to the substance of the Lords Supper, but only to signify a mystery. But if any did commend it as necessary, they did undoubtedly deprave the Lord’s Supper. But they much more, who used only water in the Lord’s Supper, as the Aquarii did, against whom Cyprian did write: for it is evident, that Christ our Sauior used wine, and commanded that we also should do the like. To this add, in that the ancient bishops in the celebration of the Lord’s Supper did put on another garment than that they usually did wear, appertains nothing to the alteration of the Lord’s Supper: For Christ commanded not that we should celebrate his Supper with our usual garments, as He did, but only that we should do that which He did Himself. The like may be affirmed of sundry other things, as well in baptism as in the Supper of the Lord. The sum of all is this: Such things as are added, but yet as matters indifferent, for order, for decency and to edification, such matters do not change the substance of the sacraments, and therefore alter not the worship. But such things as are taken from the institution of Christ, or else are added as necessary, and appertaining to the substance, those things do corrupt the institution of the Lord, and so do establish another kind of worship. To this kind of addition appertain the places of forbidding to add to God’s Word, Dt. 4:1-2. Note that which he there says, ‘Ye shall not add to the Word which I command you,’ the Word of the Lord is necessary, it ties the conscience, and delivers the substance of the worship, and has nothing adiaphoral or indifferent therein: wherefore to add unto the Word is to ordain or appoint in God’s worship some thing as necessary, and as appertaining to the essence or worship of God, and which does so bind men’s consciences, even as the Word of God itself; wherefore he adds not unto the Word of God, which by the consent of the Church ordains anything, not as necessary, but as indifferent, and free for order only, or for decency, and unto edification, not binding the conscience of any by such an ordinance.</p></blockquote>

<blockquote><p>The Mohammedan imposture is, in some respects, the most remarkable of all false religions. The specious simplicity of its essential doctrines, and its perfect freedom from idolatry, distinguish it forever from the gross mythology of classical and oriental paganism. But besides these characteristics, it displays a third, more interesting still. We mean the peculiar relation which it bears to Christianity. Whether it happened from a happy accident or a sagacious policy, we think it clear that Islam owes a vast proportion of its vast success, to the fact that Mohammed built upon another man’s foundation. Assuming the correctness of the common doctrine that the impostor was a brilliant genius, though a worthless libertine, and that his book is the offspring, not of insane stupidity, but of consummate artifice, there certainly is ground for admiration in the apparent union of simplicity and efficacy in the whole design.

The single idea of admitting freely the divine legation of the Hebrew seers, and exhibiting himself as the topstone of the edifice, the Last Great Prophet, and the Paraclete of Christ, has certainly the aspect of a master stroke of policy. Besides conciliating multitudes of Jews and soi-disant Christians, at the very first, this circumstance has aided the imposture not a little ever since. It relieves the Moslem doctors from the dire necessity of waging war against both law and gospel. Whatever can be cited from the Greek and Hebrew Scriptures, without disparaging Mohammed, they admit as readily as any Jew or Christian. Whatever, on the contrary, is hostile to his doctrines or pretensions, or at all at variance with the statements of the Koran, is disposed of, not by an absolute rejection of the Bible, but by a resort to the convenient supposition of corruption in the text. It is not the policy of Islam to array itself against the Jewish and the Christian dispensations, as an original and independent system; but to assume the same position in relation to the Gospel, which the Gospel seems to hold in relation to the Law—or, in other words, to make itself the grand denouement of that grand scheme, of which the Old and New Testaments were only the preparatory stages.

Indeed, if we were fully satisfied that the Rasool Allah [the apostle of God] had any plan at all, we should be disposed to account for it in this way. He was acquainted with three forms of religion, Judaism, Christianity, and Paganism. Disgusted with the latter, he was led, we may suppose, to make some inquiries into the points of difference, between the Jews and Christians. This he could not do, without discovering their singular relation to each other the Christians acknowledging the Scriptures of the Jews, but adding others to them, and regarding Jesus Christ as the Messiah—the Jews on the other hand rejecting the New Testament, and bitterly denying the Messiahship of Christ. This fact might very readily suggest the project of a new dispensation—a third one to the Christian, and a second to the Jew. The impostor would thus be furnished with an argument ad hominem to stop the mouths of both.

To the Jews he could say, Did not Moses tell your fathers that a prophet should rise up in the latter days, greater than all before him? I am he. Do you doubt it? Here is a revelation just received from Gabriel. Do not all your sacred books predict the coming of a great deliverer, a conqueror, a king? I am he. In a few months you shall see me at the head of a thousand tribes going forth to the conquest of the world. If this was the ground really taken at first, how striking must have been the seeming confirmation of these bold pretensions, when Mohammed and his successors had in fact subjected, not Arabia only, but Greece, Persia, Syria, and Egypt.

To the objection of the Christians, that the line of prophets was long since completed, he could answer, Did not Jesus come to abrogate or modify the law, when its provisions were no longer suited to the state of things? Even so come I, to supersede the Gospel—not to discredit, but to render it unnecessary, by a more extensive and authoritative doctrine. So far from being antichrist (as some no doubt objected) I am the very Comforter whom Jesus promised.

That such sophistry might easily have undermined the faith of renegadoes [sic] and half-pagan Christians, is certainly conceivable. Whether this was in fact the course adopted in the infancy of Islam, will admit a doubt. Be that as it may, it is certain, that the impostor considered it expedient to incorporate the leading facts of sacred history into his revelation, so far as they were known to him. That his knowledge of the subject was imperfect, need not excite our wonder. The sources which probably supplied his information, could scarcely be expected to emit a purer stream than that which irrigates the pages of the Perspicuous Book.</p></blockquote>

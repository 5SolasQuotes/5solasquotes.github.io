<main class="wrap"><figure class="quote" id="q-644ed1a1be" data-kw="">
<blockquote><p>12. Cyril of Alexandria upon the Gospel of John, bk. 11, ch. 25: ‘As by the offense of the first man, as in the first fruits of our race, we have been sentenced to death; so by the obedience and righteousness of Christ, inasmuch as He subjected Himself to the Law, although He was the author of the Law, the blessing and quickening which is by the Spirit has reached to our whole nature.’ …And he extends this righteousness of Christ not to the satisfaction only, but to the fulfilling of the law: which, we must observe is opposed to the opinions of the Jesuits and others, who maintain that the passive obedience of Christ is imputed to us, not his active obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Justification: or The Disputatio de justitia habituali et actuali</cite>, …, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), ch. 29, pp. 260-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“12. Cyril of Alexandria upon the Gospel of John, bk. 11, ch. 25: ‘As by the offense of the first man, as in the first fruits of our race, we have been sentenced to death; so by the obedience and righteousness of Christ, inasmuch as He subjected Himself to the Law, although He was the author of the Law, the blessing and quickening which is by the Spirit has reached to our whole nature.’ …And he extends this righteousness of Christ not to the satisfaction only, but to the fulfilling of the law: which, we must observe is opposed to the opinions of the Jesuits and others, who maintain that the passive obedience of Christ is imputed to us, not his active obedience.”

— John Davenant, A Treatise on Justification: or The Disputatio de justitia habituali et actuali…, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), ch. 29, pp. 260-61">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C12.+Cyril+of+Alexandria+upon+the+Gospel+of+John%2C+bk.+11%2C+ch.+25%3A+%E2%80%98As+by+the+offense+of+the+first+man%2C+as+in+the+first+fruits+of+our+race%2C+we+have+been+sentenced+to+death%3B+so+by+the+obedience+and+righteousness+of+Christ%2C+inasmuch+as+He+subjected+Himself+to+the+Law%2C+although+He+was+the+author+of+the+Law%2C+the+blessing+and+quickening+which+is+by+the+Spirit+has+reached+to+our+whole+nature.%E2%80%99+%E2%80%A6And+he+extends+this+righteousness+of+Christ+not+to+the+satisfaction+only%2C+but+to+the+fulfilling+of+the+law%3A+which%2C+we+must+observe+is+opposed+to+the+opinions+of+the+Jesuits+and+others%2C+who+maintain+that+the+passive+obedience+of+Christ+is+imputed+to+us%2C+not+his+active+obedience.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+A+Treatise+on+Justification%3A+or+The+Disputatio+de+justitia+habituali+et+actuali%E2%80%A6%2C+vol.+1+trans.+Josiah+Allport+%28d.+1641%3B+London%3A+Hamilton%2C+1844%2F1846%29%2C+ch.+29%2C+pp.+260-61&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F644ed1a1be.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/644ed1a1be.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=12.%20Cyril%20of%20Alexandria%20upon%20the,to%20us%2C%20not%20his%20active%20obedience&amp;text=12.%20Cyril%20of%20Alexandria%20upon%20the%20Gospel%20of&amp;text=is%20imputed%20to%20us%2C%20not%20his%20active%20obedience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-33f46f1243" data-kw="">
<blockquote><p>5. Because the righteousness of Christ is imputed to us, indeed, because Christ died for us, i.e., in our place and stead, as sponsor and surety, He was made a curse for us, and sustained in Himself the malediction and penalty of the violated Law due to us. From which necessarily flowed from Christ to us surety-righteousness, or such as a sponsor renders for debtors. But this is imputed righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI by Onku (1639-1642; 1668), ch. 12, Justification of a Sinner, p. 315</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“5. Because the righteousness of Christ is imputed to us, indeed, because Christ died for us, i.e., in our place and stead, as sponsor and surety, He was made a curse for us, and sustained in Himself the malediction and penalty of the violated Law due to us. From which necessarily flowed from Christ to us surety-righteousness, or such as a sponsor renders for debtors. But this is imputed righteousness.”

</figure><figure class="quote" id="q-64a61720fe" data-kw="">
<blockquote><p>Although indeed we have shown that, by the punishment of Christ, God was satisfied, yet we would not deny that the power of satisfaction was also in the acting of Christ…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugo-grotius.html">Hugo Grotius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Defence of the Catholic Faith on the Satisfaction of Christ against Socinus</cite>, (1617) as in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatio… (Oxford: Parker, 1850), vol. 1, bk. 2, ch. 2, p. 109</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-a8587284b2" data-kw="">
<blockquote><p>Here he indicates the end for which God, in the flesh of his Son, condemned our sin—namely, that the righteousness (or justification) of the Law might be fulfilled in us; that is, that we might be justified, being endowed with that righteousness which the Law requires of us. For the Law requires of us either perfect obedience or punishment. But we have not rendered perfect obedience; yet we have paid the penalty in Christ, for he paid it on our behalf. Therefore we have satisfied the Law in Christ; and consequently the Law cannot condemn us, but is bound to justify us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Rom. 8:4, “That the righteousness of the law might be fulfilled in us, who walk not after the flesh, but after the Spirit.”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“Here he indicates the end for which God, in the flesh of his Son, condemned our sin—namely, that the righteousness (or justification) of the Law might be fulfilled in us; that is, that we might be justified, being endowed with that righteousness which the Law requires of us. For the Law requires of us either perfect obedience or punishment. But we have not rendered perfect obedience; yet we have paid the penalty in Christ, for he paid it on our behalf. Therefore we have satisfied the Law in Christ; and consequently the Law cannot condemn us, but is bound to justify us.”

</figure><figure class="quote" id="q-766b45942f" data-kw="">
<blockquote><p>From the imputation of righteousness, a meritorious claim upon life and the reward of life itself equally follow. For just as the sentence of sin’s remission has regard to three things—sin, liability to punishment, and punishment itself—so the sentence of justification has regard to three things—Christ’s righteousness or satisfaction, that merit which belongs to Christ’s righteousness or satisfaction (for his satisfaction is meritorious of eternal life), and life itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’</cite>, tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 107-8 Rollock (c. 1555-1599) was a Scottish minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“From the imputation of righteousness, a meritorious claim upon life and the reward of life itself equally follow. For just as the sentence of sin’s remission has regard to three things—sin, liability to punishment, and punishment itself—so the sentence of justification has regard to three things—Christ’s righteousness or satisfaction, that merit which belongs to Christ’s righteousness or satisfaction (for his satisfaction is meritorious of eternal life), and life itself.”

— Robert Rollock, ‘Treatise on Justification’ tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 107-8 Rollock (c. 1555-1599) was a Scottish minister.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrom+the+imputation+of+righteousness%2C+a+meritorious+claim+upon+life+and+the+reward+of+life+itself+equally+follow.+For+just+as+the+sentence+of+sin%E2%80%99s+remission+has+regard+to+three+things%E2%80%94sin%2C+liability+to+punishment%2C+and+punishment+itself%E2%80%94so+the+sentence+of+justification+has+regard+to+three+things%E2%80%94Christ%E2%80%99s+righteousness+or+satisfaction%2C+that+merit+which+belongs+to+Christ%E2%80%99s+righteousness+or+satisfaction+%28for+his+satisfaction+is+meritorious+of+eternal+life%29%2C+and+life+itself.%E2%80%9D%0A%0A%E2%80%94+Robert+Rollock%2C+%E2%80%98Treatise+on+Justification%E2%80%99+tr.+Aaron+Denlinger+%26+Noah+Phillips+MAJT+27+%282016%29%2C+1.4.2.+%E2%80%98The+Imputation+of+Righteousness%E2%80%99%2C+pp.+107-8+Rollock+%28c.+1555-1599%29+was+a+Scottish+minister.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F766b45942f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/766b45942f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=From%20the%20imputation%20of%20righteousness%2C%20a,of%20eternal%20life%29%2C%20and%20life%20itself&amp;text=From%20the%20imputation%20of%20righteousness%2C%20a%20meritorious%20claim&amp;text=is%20meritorious%20of%20eternal%20life%29%2C%20and%20life%20itself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

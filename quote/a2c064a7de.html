<main class="wrap"><figure class="quote" id="q-a2c064a7de" data-kw="reprobation damnation for sin">
<blockquote><p>Reprobation is … the eternal, unchangeable and most free purpose of God by which he decreed not to pity some certain men lying in exactly equal corruption and guilt with others, but to damn eternally those left in sin (on account of it) in order to demonstrate his glorious justice, liberty and power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.14.1</span></figcaption>

<blockquote><p>Yes, there is even in ourselves sin and corruption enough, so that there is no need that God should infuse into us either a new or greater measure of wickedness. Therefore, when God is said in the Scripture to harden (Ex. 7:13), to blind (John 12:40) and to deliver us up into a reprobate sense (Rom. 1:28), it is to be understood that God does it by just judgment, as a just judge and avenger.</p></blockquote>

</figure><figure class="quote" id="q-b550c528f6" data-kw="God not depend on man">

</figure><figure class="quote" id="q-14ba01d57f" data-kw="Hardening Justice">
<blockquote><p>God certainly does not in either case effect or infuse blindness or hardness into the sinner (cf. James 1:13–14), yet neither does he only not take away blindness and hardness, by not circumcising the heart (Jer. 6:10, 26; Acts 7:51), or by not conferring spiritual light to the mind, or softness and malleability to the heart (Matt. 13:14–15; Isa. 6:9–10), but in addition: (1) on account of preceding sins, in a just and holy way, he takes away or diminishes the remnants of wisdom and moral goodness that a sinner has, and also augments and aggravates his original blindness and hardness.</p></blockquote>

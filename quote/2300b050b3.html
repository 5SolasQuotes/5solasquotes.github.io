<main class="wrap"><figure class="quote" id="q-2300b050b3" data-kw="">
<blockquote><p>Adam Gib made the following, less than irenic, observations on the ‘Breach’ in the Reformed Presbytery of Scotland in 1753 over the doctrine taught in the second part of the early Covenanter, James Fraser of Brea’s book A Treatise on Justifying Faith (1749; there is some debate over whether or not Fraser was the author), which taught that Christ’s atonement secured not only the redemption of the elect, but gospel wrath for the reprobate. Two Reformed Presbyterian ministers, James Hall and Hugh Innes, supported this position and withdrew to form a dissentient Reformed Presbytery of Edinburgh, which only died out in 1817.[1] Although Gib was an Antiburgher Seceder, he still felt the need to comment on the dispute among the Reformed Presbyterians:

These who have first made an open appearance under the banner of what is called Brae’s scheme, are a couple of novices who (with a pair of sham-elders) arrogated the name of The Reformed Presbytery; and though there has been too much of Arminianism in church-judicatures before, yet they are the first Arminian judicature, wholly constituted on such a footing, that has ever yet appeared in this island: nor is it to be reckoned among the smallest provocations in this day of blasphemy, that any should have pretended to constitute themselves, in the name of Christ, just for displaying a banner against the glory of his effectual redemption and mediation.

It is true, they set up as the only men for celebrating the Mediator’s glory, but how is it that they do so? Why, by venting another doctrine about his mediatory kingdom, which leaves him nothing but as Mediator! And when some worms on his footstool, have thus attacked his God-head, they will make amends by complimenting him with a Socinian kind of glory, which they forged in the year 1753! However, in the righteous judgment of God, that mock-presbytery was dissolved, very soon after they had taken up their Arminian stand; one of the two being left to put a sad bite upon his brother, and the poor people who had chosen him for one of their guides, by turning suddenly so catholic, that he almost got over the length of Roman-catholic at one leap.

These Gentlemen, then, upon a breach from their brethren for that very purpose, have retailed the new mode of Arminianism in a pamphlet which they published about fifteen months ago, under the mimic form of a judicial deed, viz. The true State of the Difference between the Reformed Presbytery and some Brethren who lately deserted them (as they pretend, though themselves were the deserting minority) &amp;c. In this performance they generally side themselves with, and recommend the whole scheme of the late book ascribed to Mr. Fraser; though, in setting it forth, they are quite mute about the particular horrors thereof, which have been mentioned.

But, as a new-set-up tradesman readily falls on some new turn of the business, for gaining a character; so they improve a little upon their author, by adding one piece of novelty, which lies in representing our Lord’s death as clothed with a twofold, a general and special appointment; though, indeed, this new device turns out to nothing more than their author’s doctrine of a common and special redemption.

Adam Gib, ‘Preface’ (1755) to John Owen, Salus Electorum, Sanguis Jesu: or, The Death of Death in the Death of Christ (1647; 3rd edn, Falkirk: T. Johnston, 1799), pp 8-9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nigel-m-de-s-cameron.html">Nigel M. de S. Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Scottish Church History &amp; Theology</cite>, (Edinburgh: T&amp;T Clark, 1993), pp 335, 699.</span></figcaption>

<blockquote><p>Frans Pieter van Stam, whose comprehensive historical study of the Amyraut controversy leans heavily in favour of the Amyraldians…” – Martyn J. McGeown, ‘A Critical Examination…’ . French Articles Saigey, Charles Edmond – ‘Moise Amyraut, Life &amp; Writings’ (Strasbourg, 1849) 50 pp. Sabatier, Andrew – ‘A Historical Study on the Hypothetical Universalism of Moise Amyraut’ (Toulouse, 1867) 45 pp. . . Medieval Hypothetical Universalist Writings Thomas Aquinas Commentary on 1 Tim. 2:4-6 62… And he proves that it is acceptable, when he says, who wills that all men be saved: not willing that anyone should perish (2 Pet 3:9). But something contrary to this is found in the Psalms: he has done all things whatsoever he would (Ps 113:11). Therefore, he saves everyone. But if you say that he does not, because man does not will it, then it seems that the omnipotent is frustrated by a will that is not omnipotent. The answer is that willing refers sometimes to the will of his good pleasure and sometimes to the signified will. By his signified will he wills to save all, because he offers to all the precepts, counsels and remedies required for salvation. As to the will of his good pleasure, this is explained in four ways: First, in the mode of a causal utterance, as when God is said to make something because he makes others do it: the Spirit asks for the saints (Rom 8:26), i.e., he causes them to ask. In this way God wills this, because he makes his saints will that all men be saved. This type of willing should be found in the saints, because they do not know who are predestined and who are not. Second, when it is applied to a limited number, i.e., to all who are saved, because no one is saved except through his will; just as in one school the teacher teaches all the boys of this city, because no one is taught by anyone but he. In a third way, when it is applied to the species of each individual but not to the individual of each species, i.e., no species of men are excepted from salvation; because formerly it was offered to the Jews only, but now to all men. Fourth, according to [John] Damascene, so that it is understood to be about his antecedent will, and not the consequent. For in God’s will, although there are no prior things and subsequent things, his will is nevertheless described as antecedent and consequent. Likewise, according to the order of things willed, according to which the will can be considered in two ways: namely, in general or absolutely, and according to certain circumstances, and in particular. Here the absolute and general consideration is considered prior to the particular and relative consideration. Then the absolute will is, as it were, antecedent, and the will of anything in particular is, as it were, consequent. For example, a merchant who absolutely wills to save all his goods, and this by his antecedent will; but if he considers the safety factor, he does not will all his goods to be saved, through comparison to others, namely, when the sinking of his ship follows the saving of all his goods. And this will is consequent. Similarly, in God’s case, the salvation of all men considered in itself has a reckoning so that is might be desirable; which is what the apostle means here: therefore, he is speaking of his antecedent will. But if the good of justice is considered, and that sins be punished, thus he does not want; And this is his consequent will. And he adds, ‘and come to the knowledge of the truth,’ because salvation depends on knowing the truth: ‘you shall know the truth, and the truth shall make you free’ (Jn. 8:32). 63… He says, therefore: it is obvious that God wills all men to be saved, because for all men there is one God who saves: is he the God of the Jews only? Is he not also of the gentiles? Yes, of the gentiles also: for there is one God who justifies circumcision by faith and uncircumcision through faith (Rom 3:29). 64. Then he gives the reason taken from the side of Christ as man, at and one mediator of God and men, the man Christ Jesus. First, he proves his intent; second, he proposes a sign, at who gave himself. He says, therefore: one mediator of God and men, the man Christ Jesus, and not of some men only, but of all; and this would not be true, unless he willed all men to be saved. And it can be said that Christ is a mediator who is like each of the extremes, namely, God and man, inasmuch as he is God and inasmuch as he is man; because a mediator should have something common to both extremes: and these are man and God. …but Christ is a medium which joins, because he is just and mortal, and by his death joins us to the God of justice: he is the propitiation for our sins (1 Jn. 2:2); for some in an efficacious way, but for all in a sufficient way: because the price of his blood is sufficient for the salvation of all, but because of obstacles it does not take effect in any but the elect.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Frans Pieter van Stam, whose comprehensive historical study of the Amyraut controversy leans heavily in favour of the Amyraldians…” – Martyn J. McGeown, ‘A Critical Examination…’ . French Articles Saigey, Charles Edmond – ‘Moise Amyraut, Life &amp; Writings’ (Strasbourg, 1849) 50 pp. Sabatier, Andrew – ‘A Historical Study on the Hypothetical Universalism of Moise Amyraut’ (Toulouse, 1867) 45 pp. . . Medieval Hypothetical Universalist Writings Thomas Aquinas Commentary on 1 Tim. 2:4-6 62… And he proves that it is acceptable, when he says, who wills that all men be saved: not willing that anyone should perish (2 Pet 3:9). But something contrary to this is found in the Psalms: he has done all things whatsoever he would (Ps 113:11). Therefore, he saves everyone. But if you say that he does not, because man does not will it, then it seems that the omnipotent is frustrated by a will that is not omnipotent. The answer is that willing refers sometimes to the will of his good pleasure and sometimes to the signified will. By his signified will he wills to save all, because he offers to all the precepts, counsels and remedies required for salvation. As to the will of his good pleasure, this is explained in four ways: First, in the mode of a causal utterance, as when God is said to make something because he makes others do it: the Spirit asks for the saints (Rom 8:26), i.e., he causes them to ask. In this way God wills this, because he makes his saints will that all men be saved. This type of willing should be found in the saints, because they do not know who are predestined and who are not. Second, when it is applied to a limited number, i.e., to all who are saved, because no one is saved except through his will; just as in one school the teacher teaches all the boys of this city, because no one is taught by anyone but he. In a third way, when it is applied to the species of each individual but not to the individual of each species, i.e., no species of men are excepted from salvation; because formerly it was offered to the Jews only, but now to all men. Fourth, according to [John] Damascene, so that it is understood to be about his antecedent will, and not the consequent. For in God’s will, although there are no prior things and subsequent things, his will is nevertheless described as antecedent and consequent. Likewise, according to the order of things willed, according to which the will can be considered in two ways: namely, in general or absolutely, and according to certain circumstances, and in particular. Here the absolute and general consideration is considered prior to the particular and relative consideration. Then the absolute will is, as it were, antecedent, and the will of anything in particular is, as it were, consequent. For example, a merchant who absolutely wills to save all his goods, and this by his antecedent will; but if he considers the safety factor, he does not will all his goods to be saved, through comparison to others, namely, when the sinking of his ship follows the saving of all his goods. And this will is consequent. Similarly, in God’s case, the salvation of all men considered in itself has a reckoning so that is might be desirable; which is what the apostle means here: therefore, he is speaking of his antecedent will. But if the good of justice is considered, and that sins be punished, thus he does not want; And this is his consequent will. And he adds, ‘and come to the knowledge of the truth,’ because salvation depends on knowing the truth: ‘you shall know the truth, and the truth shall make you free’ (Jn. 8:32). 63… He says, therefore: it is obvious that God wills all men to be saved, because for all men there is one God who saves: is he the God of the Jews only? Is he not also of the gentiles? Yes, of the gentiles also: for there is one God who justifies circumcision by faith and uncircumcision through faith (Rom 3:29). 64. Then he gives the reason taken from the side of Christ as man, at and one mediator of God and men, the man Christ Jesus. First, he proves his intent; second, he proposes a sign, at who gave himself. He says, therefore: one mediator of God and men, the man Christ Jesus, and not of some men only, but of all; and this would not be true, unless he willed all men to be saved. And it can be said that Christ is a mediator who is like each of the extremes, namely, God and man, inasmuch as he is God and inasmuch as he is man; because a mediator should have something common to both extremes: and these are man and God. …but Christ is a medium which joins, because he is just and mortal, and by his death joins us to the God of justice: he is the propitiation for our sins (1 Jn. 2:2); for some in an efficacious way, but for all in a sufficient way: because the price of his blood is sufficient for the salvation of all, but because of obstacles it does not take effect in any but the elect.”

— F.P. van Stam, The Controversy over the Theology of Saumur, 1635-1650. Disrupting Debates among the Huguenots in Complicated Circumstances (Amsterdam: APA-Holland Univ. Press, 1988)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrans+Pieter+van+Stam%2C+whose+comprehensive+historical+study+of+the+Amyraut+controversy+leans+heavily+in+favour+of+the+Amyraldians%E2%80%A6%E2%80%9D+%E2%80%93+Martyn+J.+McGeown%2C+%E2%80%98A+Critical+Examination%E2%80%A6%E2%80%99+.+French+Articles+Saigey%2C+Charles+Edmond+%E2%80%93+%E2%80%98Moise+Amyraut%2C+Life+%26+Writings%E2%80%99+%28Strasbourg%2C+1849%29+50+pp.+Sabatier%2C+Andrew+%E2%80%93+%E2%80%98A+Historical+Study+on+the+Hypothetical+Universalism+of+Moise+Amyraut%E2%80%99+%28Toulouse%2C+1867%29+45+pp.+.+.+Medieval+Hypothetical+Universalist+Writings+Thomas+Aquinas+Commentary+on+1+Tim.+2%3A4-6+62%E2%80%A6+And+he+proves+that+it+is+acceptable%2C+when+he+says%2C+who+wills+that+all+men+be+saved%3A+not+willing+that+anyone+should+perish+%282+Pet+3%3A9%29.+But+something+contrary+to+this+is+found+in+the+Psalms%3A+he+has+done+all+things+whatsoever+he+would+%28Ps+113%3A11%29.+Therefore%2C+he+saves+everyone.+But+if+you+say+that+he+does+not%2C+because+man+does+not+will+it%2C+then+it+seems+that+the+omnipotent+is+frustrated+by+a+will+that+is+not+omnipotent.+The+answer+is+that+willing+refers+sometimes+to+the+will+of+his+good+pleasure+and+sometimes+to+the+signified+will.+By+his+signified+will+he+wills+to+save+all%2C+because+he+offers+to+all+the+precepts%2C+counsels+and+remedies+required+for+salvation.+As+to+the+will+of+his+good+pleasure%2C+this+is+explained+in+four+ways%3A+First%2C+in+the+mode+of+a+causal+utterance%2C+as+when+God+is+said+to+make+something+because+he+makes+others+do+it%3A+the+Spirit+asks+for+the+saints+%28Rom+8%3A26%29%2C+i.e.%2C+he+causes+them+to+ask.+In+this+way+God+wills+this%2C+because+he+makes+his+saints+will+that+all+men+be+saved.+This+type+of+willing+should+be+found+in+the+saints%2C+because+they+do+not+know+who+are+predestined+and+who+are+not.+Second%2C+when+it+is+applied+to+a+limited+number%2C+i.e.%2C+to+all+who+are+saved%2C+because+no+one+is+saved+except+through+his+will%3B+just+as+in+one+school+the+teacher+teaches+all+the+boys+of+this+city%2C+because+no+one+is+taught+by+anyone+but+he.+In+a+third+way%2C+when+it+is+applied+to+the+species+of+each+individual+but+not+to+the+individual+of+each+species%2C+i.e.%2C+no+species+of+men+are+excepted+from+salvation%3B+because+formerly+it+was+offered+to+the+Jews+only%2C+but+now+to+all+men.+Fourth%2C+according+to+%5BJohn%5D+Damascene%2C+so+that+it+is+understood+to+be+about+his+antecedent+will%2C+and+not+the+consequent.+For+in+God%E2%80%99s+will%2C+although+there+are+no+prior+things+and+subsequent+things%2C+his+will+is+nevertheless+described+as+antecedent+and+consequent.+Likewise%2C+according+to+the+order+of+things+willed%2C+according+to+which+the+will+can+be+considered+in+two+ways%3A+namely%2C+in+general+or+absolutely%2C+and+according+to+certain+circumstances%2C+and+in+particular.+Here+the+absolute+and+general+consideration+is+considered+prior+to+the+particular+and+relative+consideration.+Then+the+absolute+will+is%2C+as+it+were%2C+antecedent%2C+and+the+will+of+anything+in+particular+is%2C+as+it+were%2C+consequent.+For+example%2C+a+merchant+who+absolutely+wills+to+save+all+his+goods%2C+and+this+by+his+antecedent+will%3B+but+if+he+considers+the+safety+factor%2C+he+does+not+will+all+his+goods+to+be+saved%2C+through+comparison+to+others%2C+namely%2C+when+the+sinking+of+his+ship+follows+the+saving+of+all+his+goods.+And+this+will+is+consequent.+Similarly%2C+in+God%E2%80%99s+case%2C+the+salvation+of+all+men+considered+in+itself+has+a+reckoning+so+that+is+might+be+desirable%3B+which+is+what+the+apostle+means+here%3A+therefore%2C+he+is+speaking+of+his+antecedent+will.+But+if+the+good+of+justice+is+considered%2C+and+that+sins+be+punished%2C+thus+he+does+not+want%3B+And+this+is+his+consequent+will.+And+he+adds%2C+%E2%80%98and+come+to+the+knowledge+of+the+truth%2C%E2%80%99+because+salvation+depends+on+knowing+the+truth%3A+%E2%80%98you+shall+know+the+truth%2C+and+the+truth+shall+make+you+free%E2%80%99+%28Jn.+8%3A32%29.+63%E2%80%A6+He+says%2C+therefore%3A+it+is+obvious+that+God+wills+all+men+to+be+saved%2C+because+for+all+men+there+is+one+God+who+saves%3A+is+he+the+God+of+the+Jews+only%3F+Is+he+not+also+of+the+gentiles%3F+Yes%2C+of+the+gentiles+also%3A+for+there+is+one+God+who+justifies+circumcision+by+faith+and+uncircumcision+through+faith+%28Rom+3%3A29%29.+64.+Then+he+gives+the+reason+taken+from+the+side+of+Christ+as+man%2C+at+and+one+mediator+of+God+and+men%2C+the+man+Christ+Jesus.+First%2C+he+proves+his+intent%3B+second%2C+he+proposes+a+sign%2C+at+who+gave+himself.+He+says%2C+therefore%3A+one+mediator+of+God+and+men%2C+the+man+Christ+Jesus%2C+and+not+of+some+men+only%2C+but+of+all%3B+and+this+would+not+be+true%2C+unless+he+willed+all+men+to+be+saved.+And+it+can+be+said+that+Christ+is+a+mediator+who+is+like+each+of+the+extremes%2C+namely%2C+God+and+man%2C+inasmuch+as+he+is+God+and+inasmuch+as+he+is+man%3B+because+a+mediator+should+have+something+common+to+both+extremes%3A+and+these+are+man+and+God.+%E2%80%A6but+Christ+is+a+medium+which+joins%2C+because+he+is+just+and+mortal%2C+and+by+his+death+joins+us+to+the+God+of+justice%3A+he+is+the+propitiation+for+our+sins+%281+Jn.+2%3A2%29%3B+for+some+in+an+efficacious+way%2C+but+for+all+in+a+sufficient+way%3A+because+the+price+of+his+blood+is+sufficient+for+the+salvation+of+all%2C+but+because+of+obstacles+it+does+not+take+effect+in+any+but+the+elect.%E2%80%9D%0A%0A%E2%80%94+F.P.+van+Stam%2C+The+Controversy+over+the+Theology+of+Saumur%2C+1635-1650.+Disrupting+Debates+among+the+Huguenots+in+Complicated+Circumstances+%28Amsterdam%3A+APA-Holland+Univ.+Press%2C+1988%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb4ed9f2be3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b4ed9f2be3.html">Permalink <blockquote><p>In fact it seems much more accurate to say that Amyraut was the real Reformed “scholastic,” and “Reformed Thomas Aquinas,” the balancer, the synthesizer, the creator of new categories, and structures. And Reformed orthodoxy, with its insistence on limited redemption, was actually a primitive throwback to the rigorous and markedly non-rationalistic particularism of Augustine and Gottschalk. Under whatever label, John Calvin, as a limited redemptionist, belongs historically with Augustine, Gottschalk, Bucer, Beza and Reformed orthodoxy–not with Amyraut.</p></blockquote>

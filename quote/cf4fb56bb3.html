<main class="wrap"><figure class="quote" id="q-cf4fb56bb3" data-kw="">
<blockquote><p>God is unchangeable in his Covenant and Promise, his Covenant and Promise with his People in Christ: God hath made a Covenant with his People in Christ, a Covenant of Peace, a Covenant of Grace, a Covenant of Love; a Covenant founded upon Grace, a Covenant full of Grace, a Covenant wholly made up of Grace and Love, from first to last, therefore called Grace, in the Abstract, Rom. 6.14. a Full Covenant, a Rich Covenant, a Precious Covenant, a Covenant made up of Rich, yea exceeding rich and precious Promises, and filled with exceeding rich and precious Treasures, precious Grace, precious Peace, precious Pardon, precious Righteousness, precious Salvation; with a precious God, a precious Christ, a precious Spirit, a precious Heaven and Blessedness for ever:

Now in this Covenant, and in all the precious Promises of it, is God the Lord unchangeable: hence you have it so often called an Everlasting Covenant, I will establish my Covenant between me and thee (says God to Abraham) for an Everlasting Covenant, to be a God unto thee, and to thy Seed after thee, Gen. 17.7 Again, I will make an Everlasting Covenant with them, (speaking of his people) and I will not turn away from them to do them good, Jer. 32.40. and as an Everlasting Covenant, so an Everlasting and Sure Covenant; God hath made with me an Everlasting Covenant (says David) well-ordered in all things, and sure, 2 Sam. 23.5. and again, Come and I will make with you an Everlasting Covenant, even the Sure Mercies of David, Isa. 55.3. Hence also ’tis called a Covenant of Salt, Num. 18.19. that is, a firm, a durable, an unchangeable Covenant.

Many other ways does God set forth the immutability of his Covenant, and that for the encouragement of our Faith and Comfort: how sweet is that Word, and what a rest may it be to Faith? Isa. 54.9, 10. This is as the Waters of Noah unto me; for as I have sworn that the waters of Noah should no more go over the Earth, so have I sworn, that I will no more be wroth with thee, nor rebuke thee: For the Mountains shall depart, and the Hills be removed, but my kindness shall not depart from thee, neither shall the Covenant of my Peace be removed, saith the Lord, that hath mercy on thee.

Pray observe, God had in the two foregoing verses promised his Church and People, that, though for a small moment he had forsaken them, yet with great Mercies he would gather them; and that though in a little wrath he had hid his face from them for a moment, yet with Everlasting kindness he would have mercy on them, and here in these two verses, he gives them a double ground of the assurance hereof; the one taken from his Oath, and the unchangeableness thereof, ver. 9. the other from his Covenant, and the unchangeableness thereof, ver. 10. For the Mountains shall depart, &amp;c. as if he should say, The Mountains and Hills may sooner be removed than my Covenant; yea, the time will come when these shall be removed, but the time will never come that my Covenant shall fail or be removed.

But what if his People sin, what then? Why then, he will correct and chastise them for their sin, but his Covenant he will keep firm and inviolable for ever notwithstanding; For this you have a full and an express Text, Psal. 89.30, 31, 32, 33, 34. If his Children forsake my Law, and walk not in my Judgments; if they break my Statutes, and keep not my Commandments; then will I visit their Transgressions with a Rod, and their Iniquities with stripes. Nevertheless (O gracious nevertheless!) my loving-kindness will I not take from him, nor suffer my faithfulness to fail; my Covenant will I not break, &amp;c.

We sin, and break; and break, and sin, and God chastises us, it may be, for our sin, but yet still his Covenant remains firm and unchangeable. So 2 Tim. 2.13. If we believe not, yet he abideth faithful, he cannot deny himself: Oh, I have an unbelieving heart, and I shall, I fear, forfeit all; although thou hast an unbelieving heart, yet God remains faithful. Thus God is unchangeable in his Covenant; Alas! his Covenant is built upon unchangeable Love, and sealed with unchangeable Blood, and cannot therefore but be unchangeable: and as the Covenant, so all the Promises of the Covenant are sure and unchangeable, they are all, yea, and Amen, in Christ, 2 Cor. 1.20. that is, they are all sure, firm, unchangeable Promises, Promises that will certainly be made good:

Men promise many times and change, but God promises and changes not; and this some conceive to be held forth in that Name of his, I am, Exod. 3.14. I am, that I am, or, I am what I was; or, I will be what I was; that is, as one expounds it, I will be in my Performances, what I was in my Promises: God makes good all his promises to a tittle: he that is Truth it self, and Faithfulness it self, cannot lie, cannot fail. ‘Tis a sweet saying I have read in Austin, They are thy Promises, O Lord, and who need fear being deceived when Truth it self promises?

Oh, we need not fear, we need not question, for God is true, God is faithful; Oh, how sweet are the thoughts of an unchangeable Covenant; God has laid himself under bonds to his People, when he was infinitely free in himself; and under bonds to do great things for them, to pardon their iniquities, transgressions and sins, to give them a new heart, and a new Spirit, to pour out his Spirit upon them; to cause them to walk in his Statutes and Judgements to do them; to write his Laws in their Hearts and put them into their inward parts; to cleanse them from all their filthiness and idols; to put his fear into their hearts that they shall never depart from him; and (which is all in one) to be a God unto them, and that they shall be his People; that is, he has laid himself under bonds, to be to them, and to do for them, what a God can be to, and do for them; and he is firm and unchangeable in all, and all shall assuredly have its accomplishment in its season.

Oh, how sweet is this? this was David’s death-bed Cordial, 2 Sam. 23.5. Although my House be not so with God, yet he hath made with me an Everlasting Covenant; and this is all my Salvation and all my Desire; and indeed well it might, for what could David or any desire more than is contained in God’s Covenant, which has Heaven and Earth, God and the Creature, Time and Eternity, all in it? Oh, study this Covenant of God, and the unchangeableness of it, and you will find it an unchangeable Spring of Comfort to you. God himself found fault with the first Covenant, ’tis said, and why? Why, because it made no provision for his People against sin; but you will be able to find no fault with this Covenant, this being well-ordered in all things, and sure; as in the place last quoted you have it.</p></blockquote>

<blockquote><p>Ministers do, indeed, offer Christ to all, upon condition of believing, being commanded to preach the gospel to every creature, and not knowing who are reprobates; but that Christ himself (knowing that the son of perdition was now lost, that the Scripture might be fulfilled, John xvii. 12) would, in the sacrament (which is more applicative than the word, and particulariseth the promises to the receivers), so to speak, as that, in any sense, those words might be applied to Judas, that even for him, his body was broken and his blood shed; and that, thereupon, the seals should be given him, to me is not at all credible, and I prove the negative by four arguments (though I might give many more):

1. If Christ did, in reference to Judas, mean conditionally that his body was broken, and his blood shed for him, if he would believe (as Mr Prynne holds), then he meant conditionally to save the son of perdition, whom he knew infallibly to be lost, and that he should be certainly damned and go to hell, and that, in eating the sacrament, he would certainly eat and drink judgment to himself (all which Mr Prynne himself, p. 26, saith Christ infallibly knew). But who dare think or say so of Jesus Christ. …

2. If Christ would not pray for Judas, but for his elect apostles only, and such as should believe through the word of the gospel, then he meant not so much as conditionally to give his body and blood for Judas (for if he meant any good to Judas, so much as conditionally, he would not have excluded him from having any part at all in his prayers to God). But Christ doth exclude Judas from his prayer, John xvii., not only as one of the reprobate world, ver. 9, but even by name, ver. 12, giving him over for lost, and one that was not to be prayed for.

3. Love and hatred in God, and in his Son Jesus Christ, being eternal and unchangeable (for actus Dei immanentes sunt cetemi), it followeth that if there was such a decree of God, or any such meaning or intention in Christ, as to give his body and blood for Judas, whom he knew infallibly to be lost, and since that same conditional meaning or intention could not be without a conditional love of God and of Christ to Judas and his salvation, this love doth still continue in God, and in Christ, to save Judas now in hell, upon condition of his believing, which every Christian I think will abominate.

4. That conditional love and conditional intention or meaning, could not have place in the Son of God. For as Spanhemius [Friedrich Spanhem] doth rightly argue in his learned exercitations, de Gratia Universali, p. 746, it doth not become either the wisdom or goodness of God to will and intend a thing upon such a condition as neither is nor can be. And p. 829, he saith, that this conditional destination or intention cannot be conceived, as being incident only to such as do neither foreknow nor direct and order the event, and in whose hand it is not to give the faculty and will of performing the thing, which cannot without impiety be thought or said of God.</p></blockquote>

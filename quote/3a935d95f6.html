<blockquote><p>RHEMI. [ 1. Desert.] As John the Baptist, so our Saviour by going into the desert and there living in contemplation even among brute beasts, and subject to the assaults of the Devil for our sins, gives a warrant and example to such holy men as have lived in wilderness for penance and contemplation, called Eremites. CARTW. 1. [1. Desert] We have learned that every action of Christ is our instruction, but that every action of his is our imitation (which must be proved to maintain this conclusion) is a strange voice which our ears were never acquainted with: the untruth whereof (as in many other cases) is manifest in this. And first of all, in the working cause, which was the holy Ghost, that led him into the Desert; whereby his immediate and extraordinary sending into the wilderness is signified by the power of his own Spirit rapt in the body to the Desert. And as his calling was this way extraordinary: so the means to prove this extraordinary calling was suitable. For it appears as Elias was often time, and Philip once taken up by the Angel of the Lord, or otherwise taken up, and miraculously transported: so also was our Saviour Christ. This is first noted in the composition of the word, which signifying either to bring again, or else to carry up: the former signification not framing with the place, the latter must be received, and so it is used of S. Paul. Secondly, this is confirmed by the word which S. Mark uses, that notes a powerable and sudden transport of his person into the wilderness. Thirdly, this is evident by his return from the wilderness, which S. Luke affirmed to have been in the power and virtue of the same Spirit, wherewith he had been anointed and carried up into the Wilderness, and therefore not in the common natural power of a man. Lastly, the Evangelist seems to have left some mark hereof in that he closes up this story of his carriage and re-carriage to and fro the Wilderness, whereof when your Eremites are utterly destitute; and that (unless you be marvelously impudent) by your own confession: the Eremites can have no other guide of their voluntary leaping into the Wilderness then the spirit of Satan, contrary to that Spirit which led our Saviour Christ thither. Secondly, of the end of his going, partly to testify his Divine Glory in abstinence from meat the space of forty days, which hath no place in your Eremites: partly to be tempted of the Devil, which ought to have as little place in them, if they knew the meaning of the last petition in the Lords prayer: for our Saviour Christ herein sought the fittest place of temptation, as the Stories of the possessed by devils do declare, whom the devils to greater terror and horror; drove into the solitary and fearful places: Unless therefore the Jesuits dare say that we may lay our selves open, yea seek the occasion of most dangerous temptation, it is evident that this example of our Saviour Christ, seals no warrant of an Eremetical life. Where the folly of the Jesuits is yet more manifestly decried, for having no ground here but of Christs example, yet have they clean altered the end of their Eremites flight into the Wilderness: assigning it to be penance, whereof they have no shadow in his example of going thither, yet were it meet that they should profess their penance among men, rather then among beasts, that they might have the same witnesses of their repentance, whom they had beholders of their fall. Again, if the warrant of Eremetical life be fetched from this example. it must of necessity be shut up within the space of forty days, and as many nights, after which time our Saviour returning from his temptations, lived the rest of his life in the common society of men. Further, if both John which lived in great austerity of life, and our Saviour Christ who lived in a more liberal sort, after the accustomed manner of men, be examples of Eremetical life; it follows that the Eremites may at their choice, either live austerely by the example of John, or in great freedom of meats and drinks by the example of our Saviour Christ; contrary to your doctrine of Eremetical life, And here you put me in remembrance of the notable injury you do to our Saviour Christ, who making him an Eremite, make John Baptist his Prince, whose shoe-latchets notwithstanding he was not worthy to loose. Verily these fables were not well put together: wherein if you would salve the matter, by expounding Prince for the first Eremite, you have barred your selves from this answer, with a double bar: First, in that otherwhere you make Elias an Eremite, who was before John: Secondly, in that you cannot bear the Princedom sometime of the Fathers ascribed to Peter over the Apostles, to be interpreted, the first either in time, or in order, but will needs have it first in dignity: which interpretation if you will so stiffly stand unto, then have you made a fair hand, which by the same construction lift up John above our Saviour Christ? that is to say, the servant above his Master. We see not therefore; but you must fetch the warrant of your Eremetical profession from the tempter himself, who is a greater haunter of the Wildernesses then either of those personages which you have yet named. And although there be no ground of your Eremetical profession, yet there is a law of leprosy, which casting both you and your Eremites out of Cities and Towns, will make you field-men, least the infection of your manifold hypocrisy and superstition should spread it self among God’s people.</p></blockquote>

<blockquote><p>DEARLY Beloved in God, after you have heard so eagerly the Gospel and the teachings of the holy Apostles, now for the fourth year, teachings which Almighty God has been merciful enough to publish to you through my weak efforts, the majority of you, thank God, have been greatly fired with the love of God and of your neighbour. You have also begun faithfully to embrace and to take unto yourselves the teachings of the Gospel and the liberty which they give, so that after you have tried and tasted the sweetness of the heavenly bread by which man lives, no other food has since been able to please you. And, as when the children of Israel were led out of Egypt, at first impatient and unaccustomed to the hard journey, they sometimes in vexation wished themselves back in Egypt, with the food left there, such as garlic, onions, leeks, and flesh-pots, they still entirely forgot such complaints when they had come into the promised land and had tasted its luscious fruits: thus also some among us leapt and jumped unseemly at the first spurring—as still some do now, who like a horse neither are able nor ought to rid themselves of the spur of the Gospel;—still, in time they have become so tractable and so accustomed to the salt and good fruit of the Gospel, which they find abundantly in it, that they not only avoid the former darkness, labour, food, and yoke of Egypt, but also are vexed with all brothers, that is, Christians, wherever they do not venture to make free use of Christian liberty. And in order to show this, some have issued German poems, some have entered into friendly talks and discussions in public rooms and at gatherings; some now at last during this fast—and it was their opinion that no one else could be offended by it—at home, and when they were together, have eaten meat, eggs, cheese, and other food hitherto unused in fasts. But this opinion of theirs was wrong; for some were offended, and that, too, from simple good intentions; and others, not from love of God or of his commands (as far as I can judge), but that they might reject that which teaches and warns common men, and they might not agree with their opinions, acted as though they were injured and offended, in order that they might increase the discord. The third part of the hypocrites of a false spirit did the same, and secretly excited the civil authorities, saying that such things neither should nor would be allowed, that it would destroy the fasts, just as though they never could fast, if the poor labourer, at this time of spring, having to bear most heavily the burden and heat of the day, ate such food for the support of his body and on account of his work. Indeed, all these have so troubled the matter and made it worse, that the honourable Council of our city was obliged to attend to the matter. And when the previously mentioned evangelically instructed people found that they were likely to be punished, it was their purpose to protect themselves by means of the Scriptures, which, however, not one of the Council had been wise enough to understand, so that he could accept or reject them. What should I do, as one to whom the care of souls and the Gospel have been entrusted, except search the Scriptures, particularly again, and bring them as a light into this darkness of error, so that no one, from ignorance or lack of recognition, injuring or attacking another come into great regret, especially since those who eat are not triflers or clowns, but honest folk and of good conscience? Wherefore, it would stand very evil with me, that I, as a careless shepherd and one only for the sake of selfish gain, should treat the sheep entrusted to my care, so that I did not strengthen the weak and protect the strong. I have therefore made a sermon about the choice or difference of food, in which sermon nothing but the Holy Gospels and the teachings of the Apostles have been used, which greatly delighted the majority and emancipated them. But those, whose mind and conscience is defiled, as Paul says [Titus, 1:15], it only made mad. But since I have used only the above-mentioned Scriptures, and since those people cry out none the less unfairly, so loud that their cries are heard elsewhere, and since they that hear are vexed on account of their simplicity and ignorance of the matter, it seems to me to be necessary to explain the thing from the Scriptures, so that every one depending on the Divine Scriptures may maintain himself against the enemies of the Scriptures.</p></blockquote>

ated them. But those, whose mind and conscience is defiled, as Paul says [Titus, 1:15], it only made mad. But since I have used only the above-mentioned Scriptures, and since those people cry out none the less unfairly, so loud that their cries are heard elsewhere, and since they that hear are vexed on account of their simplicity and ignorance of the matter, it seems to me to be necessary to explain the thing from the Scriptures, so that every one depending on the Divine Scriptures may maintain himself against the enemies of the Scriptures.”

— Huldrych Zwingli, The Latin Works and The Correspondence of Huldreich Zwingli: Together with Selections from His German Works, ed. Samuel Macauley Jackson, trans. Henry Preble, Walter Lichtenstein, and Lawrence A. McLouth, vol. 1 (New York; London: G. P. Putnam’s Sons; Knickerbocker Press, 1912), 71–73.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDEARLY+Beloved+in+God%2C+after+you+have+heard+so+eagerly+the+Gospel+and+the+teachings+of+the+holy+Apostles%2C+now+for+the+fourth+year%2C+teachings+which+Almighty+God+has+been+merciful+enough+to+publish+to+you+through+my+weak+efforts%2C+the+majority+of+you%2C+thank+God%2C+have+been+greatly+fired+with+the+love+of+God+and+of+your+neighbour.+You+have+also+begun+faithfully+to+embrace+and+to+take+unto+yourselves+the+teachings+of+the+Gospel+and+the+liberty+which+they+give%2C+so+that+after+you+have+tried+and+tasted+the+sweetness+of+the+heavenly+bread+by+which+man+lives%2C+no+other+food+has+since+been+able+to+please+you.+And%2C+as+when+the+children+of+Israel+were+led+out+of+Egypt%2C+at+first+impatient+and+unaccustomed+to+the+hard+journey%2C+they+sometimes+in+vexation+wished+themselves+back+in+Egypt%2C+with+the+food+left+there%2C+such+as+garlic%2C+onions%2C+leeks%2C+and+flesh-pots%2C+they+still+entirely+forgot+such+complaints+when+they+had+come+into+the+promised+land+and+had+tasted+its+luscious+fruits%3A+thus+also+some+among+us+leapt+and+jumped+unseemly+at+the+first+spurring%E2%80%94as+still+some+do+now%2C+who+like+a+horse+neither+are+able+nor+ought+to+rid+themselves+of+the+spur+of+the+Gospel%3B%E2%80%94still%2C+in+time+they+have+become+so+tractable+and+so+accustomed+to+the+salt+and+good+fruit+of+the+Gospel%2C+which+they+find+abundantly+in+it%2C+that+they+not+only+avoid+the+former+darkness%2C+labour%2C+food%2C+and+yoke+of+Egypt%2C+but+also+are+vexed+with+all+brothers%2C+that+is%2C+Christians%2C+wherever+they+do+not+venture+to+make+free+use+of+Christian+liberty.+And+in+order+to+show+this%2C+some+have+issued+German+poems%2C+some+have+entered+into+friendly+talks+and+discussions+in+public+rooms+and+at+gatherings%3B+some+now+at+last+during+this+fast%E2%80%94and+it+was+their+opinion+that+no+one+else+could+be+offended+by+it%E2%80%94at+home%2C+and+when+they+were+together%2C+have+eaten+meat%2C+eggs%2C+cheese%2C+and+other+food+hitherto+unused+in+fasts.+But+this+opinion+of+theirs+was+wrong%3B+for+some+were+offended%2C+and+that%2C+too%2C+from+simple+good+intentions%3B+and+others%2C+not+from+love+of+God+or+of+his+commands+%28as+far+as+I+can+judge%29%2C+but+that+they+might+reject+that+which+teaches+and+warns+common+men%2C+and+they+might+not+agree+with+their+opinions%2C+acted+as+though+they+were+injured+and+offended%2C+in+order+that+they+might+increase+the+discord.+The+third+part+of+the+hypocrites+of+a+false+spirit+did+the+same%2C+and+secretly+excited+the+civil+authorities%2C+saying+that+such+things+neither+should+nor+would+be+allowed%2C+that+it+would+destroy+the+fasts%2C+just+as+though+they+never+could+fast%2C+if+the+poor+labourer%2C+at+this+time+of+spring%2C+having+to+bear+most+heavily+the+burden+and+heat+of+the+day%2C+ate+such+food+for+the+support+of+his+body+and+on+account+of+his+work.+Indeed%2C+all+these+have+so+troubled+the+matter+and+made+it+worse%2C+that+the+honourable+Council+of+our+city+was+obliged+to+attend+to+the+matter.+And+when+the+previously+mentioned+evangelically+instructed+people+found+that+they+were+likely+to+be+punished%2C+it+was+their+purpose+to+protect+themselves+by+means+of+the+Scriptures%2C+which%2C+however%2C+not+one+of+the+Council+had+been+wise+enough+to+understand%2C+so+that+he+could+accept+or+reject+them.+What+should+I+do%2C+as+one+to+whom+the+care+of+souls+and+the+Gospel+have+been+entrusted%2C+except+search+the+Scriptures%2C+particularly+again%2C+and+bring+them+as+a+light+into+this+darkness+of+error%2C+so+that+no+one%2C+from+ignorance+or+lack+of+recognition%2C+injuring+or+attacking+another+come+into+great+regret%2C+especially+since+those+who+eat+are+not+triflers+or+clowns%2C+but+honest+folk+and+of+good+conscience%3F+Wherefore%2C+it+would+stand+very+evil+with+me%2C+that+I%2C+as+a+careless+shepherd+and+one+only+for+the+sake+of+selfish+gain%2C+should+treat+the+sheep+entrusted+to+my+care%2C+so+that+I+did+not+strengthen+the+weak+and+protect+the+strong.+I+have+therefore+made+a+sermon+about+the+choice+or+difference+of+food%2C+in+which+sermon+nothing+but+the+Holy+Gospels+and+the+teachings+of+the+Apostles+have+been+used%2C+which+greatly+delighted+the+majority+and+emancipated+them.+But+those%2C+whose+mind+and+conscience+is+defiled%2C+as+Paul+says+%5BTitus%2C+1%3A15%5D%2C+it+only+made+mad.+But+since+I+have+used+only+the+above-mentioned+Scriptures%2C+and+since+those+people+cry+out+none+the+less+unfairly%2C+so+loud+that+their+cries+are+heard+elsewhere%2C+and+since+they+that+hear+are+vexed+on+account+of+their+simplicity+and+ignorance+of+the+matter%2C+it+seems+to+me+to+be+necessary+to+explain+the+thing+from+the+Scriptures%2C+so+that+every+one+depending+on+the+Divine+Scriptures+may+maintain+himself+against+the+enemies+of+the+Scriptures.%E2%80%9D%0A%0A%E2%80%94+Huldrych+Zwingli%2C+The+Latin+Works+and+The+Correspondence+of+Huldreich+Zwingli%3A+Together+with+Selections+from+His+German+Works%2C+ed.+Samuel+Macauley+Jackson%2C+trans.+Henry+Preble%2C+Walter+Lichtenstein%2C+and+Lawrence+A.+McLouth%2C+vol.+1+%28New+York%3B+London%3A+G.+P.+Putnam%E2%80%99s+Sons%3B+Knickerbocker+Press%2C+1912%29%2C+71%E2%80%9373.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F104f30070e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/104f30070e.html">Permalink</a><a class="src" href="https://heidelblog.net/2018/02/zwingli-on-rejecting-lent-and-protecting-christian-liberty-from-man-made-obligations/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-450eeb8c78" data-kw="">
<blockquote><p>For what kind of candour is it that quotes an epistle which scarcely one of the monkish herd would acknowledge to be genuine? Those who have read this silly production know that it speaks only of Lent, and chrism, and tapers, and fast and festival days, which began to creep in under the influence of superstition and ignorance long after the days of Ignatius.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin: Theological Treatises</cite>, The Clear Explanation of Sound Doctrine Concerning the True Partaking of the Flesh and Blood of Christ in the Holy Supper in J. K. S. Reid ed., Calvin: Theological Treatises (Westminster John Knox Press, 1954), 293.</span></figcaption>

</figure><figure class="quote" id="q-0ca535bb87" data-kw="">
<blockquote><p>It deserves our attention that Christ says that he gave an example; for we are not at liberty to take all his actions, without reserve, as subjects of imitation. The Papists boast that, by Christ’s example, they observe the forty days’ fast, or Lent. But we ought first to see whether or not he intended to lay down his fast as an example, that the disciples might conform to it as a rule. We read nothing of this sort, and, therefore, the imitation of it is not less wicked than if they attempted to fly to heaven. Besides, when they ought to have followed Christ, they were not imitators, but apes. Every year they have a fashion of washing some people’s feet, as if it were a farce which they were playing on the stage; and so, when they have performed this idle and unmeaning ceremony, they think that they have fully discharged their duty, and reckon themselves at liberty to despise their brethren during the rest of the year. But—what is far worse—after having washed the feet of twelve men, they subject every member of Christ to cruel torture, and thus spit in Christ’s face. This display of buffoonery, therefore, is nothing else than a shameful mockery of Christ. At all events, Christ does not here enjoin an annual ceremony, but bids us be ready, throughout our whole life, to wash the feet of our brethren and neighbours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on John</cite>, trans. William Pringle, vol. 2 (Logos Bible Software, 2010), 61–62.</span></figcaption>

</figure><figure class="quote" id="q-19f44e6044" data-kw="">
<blockquote><p>Some make a mockery of the holy things of God. One part of the year they will be holy; a rotten, foolish affection of people that are popish. In Lent they will use a little austerity, oh! they will please God wondrously! but before and after they are devils incarnate. So they make that part of the year as a good parenthesis, in an unlearned and unwitty speech. A good parenthesis is unseemly in a wicked speech, and a good piece is unseemly in a ragged garment; so their lives that make a good show then (and there are few that do so, they are scarce among us; men are such atheists that there is not outward reformation, but if there be), if they give themselves leave to be civil, and to respect holy things a little time, afterward they return to their looseness again. Doth this patching out of a holy life please God? No, no! ‘I have sworn, and I will perform it, that I will keep thy righteous statutes,’ saith David, Ps. 119:106. And St Paul, ‘I have resolved to be so to the end;’ I will be myself still. So where grace is, there is a resolution against all sin for the time to come. If you entertain not this resolution, to walk ‘in holiness and righteousness all the days of your life,’ Luke 1:75, acknowledge no benefit by Christ’s redemption, and come not near the holy things of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Complete Works of Richard Sibbes</cite>, vol. 3 (Edinburgh; London; Dublin: James Nichol; James Nisbet and Co.; W. Robertson, 1862), 313.</span></figcaption>

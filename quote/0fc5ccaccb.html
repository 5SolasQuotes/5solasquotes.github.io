<main class="wrap"><figure class="quote" id="q-0fc5ccaccb" data-kw="">
<blockquote><p>Though doctrinal errors are gradually creeping in among us, yet there is no national or Church deed done or enacted by us hitherto which carry us off from these standards; they have still the authority they ever had, and which any Church can give;</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d400a62bf4" data-kw="">
<blockquote><p>The first step towards what might be called the re-organisation of the [United] Societies appears to have been taken by Robert Hamilton, who had been on the Continent from 1679 to 1688, and who had constituted himself the leader in opposition to the movements proposed by the ‘ministers and majority of the people’ during the two years after the [Glorious] Revolution [of 1689]. All who did not approve his views were guilty of ‘gross defections.’ …when the first General Meeting was held after the issue of this paper [in 1691], it was found that there were tares among the wheat. “When gathered and searching into one another’s judgement as to the state of the testimony,” says the writer of the Informatory Vindication [of 1691(?)], ‘We found ourselves to be but a mix’d company,” and consequently, before anything was done, they had to ‘purge their meetings from all such as had sinfully joined with the courses of the times and were defending the same.’… How many were removed at the ‘purging’ is also unknown, but they must have formed a considerable proportion of the body… The Societies seem to have done very little without causing controversy in their own ranks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mcmillan.html">William McMillan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Covenanters after the Revolution of 1688’ (Scottish Church History Society, 1950)</cite>, pp. 144-45</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>And though they were brought before the judicatories of this Church, and likewise though the teacher of them owned and maintained them in his defences at their bar, yet the General Assembly, in the year 1717, dismissed the process without any censure inflictedupon the said teacher, yea, without any particular express testimony against the above gross and dangerous errors.</p></blockquote>

</figure><figure class="quote" id="q-44c82e3ab4" data-kw="">
<blockquote><p>First, then, we shall take into consideration the bounds of the power of particular [local] elderships, and how the same may be said to be independent, and how not… The first distinction is, between things which are proper and peculiar to one congregation, and things which are common to many: the former pertains to the particular eldership, the latter to the common eldership. Whence it comes that, in Scotland, the cases of ordination, suspension, deposition and excommunication, are determined in the greater presbyteries, because it does not concern one congregation alone, but many, who be taken into the common presbytery, and who be put out of the same; neither does the excommunication of a sinner concern only one congregation, but the neighboring congregations also, among whom, as it is to be commonly supposed, the sinner does often haunt and converse. Cyprian [A.D. 200-258], speaking of the admission of some who had fallen, and who had no recommendation from the martyrs [witnesses] to be received again, refers the matter to a common meeting, and his reason is, because it was a common cause, ‘and did not concern a few, nor one church only,’ see Book 2, Epistle 14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, p. 43.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>The Church of Scotland neither at, nor since the Revolution has supplicated the civil powers for having the Act Rescissory, and other acts condemning our covenants rescinded; and ancient laws, approving and enjoining them to be taken by all, restored, though under the ashes of that Act Rescissory our covenants were left buried.</p></blockquote>

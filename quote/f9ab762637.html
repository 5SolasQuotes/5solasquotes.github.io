<main class="wrap"><figure class="quote" id="q-f9ab762637" data-kw="">
<blockquote><p>6. For the ground and warrant of Christ’s willingness to save and draw sinners, do but consider: 1. The words of the text, ‘I will draw all men to Me;’ it is as if He would say, ‘I will baulk no nation, nor any man upon a national respect;’ the first covenant to the Jews suffered a mighty exception: What is God, the God of the Jews only? Have all the nations of the earth done with their part of heaven and salvation, but only the narrow trinket and bit of the earth in poor little Judea? This made the Gospel despised and liable to sad and heavy calumnies. Christ must have narrow bowels, and must be ebb, short, and thin in free grace if the matter be so. Nay but, Christ has mercy for all men: ‘I will draw all men,’ that is, multitudes of Jews and gentiles: for that Christ draws all and every one without exception, and that by his death, is against Scripture and experience; but He has an ‘all’ that he draws: Tit. 2:11, ‘The grace of God has appeared to all men [Greek]; what grace? the teaching grace of God that teaches us to wait for the blessed hope and the appearance of the glory and of our Savior Jesus Christ: sure, this must bee the preached Gospel; now the Gospel by Scripture experience, [and by] consent of Arminians, never appeared, in the least sound, to all and every son of Adam; then Christ must have another ‘all,’ a fair and numerous multitude whom He saves and draws, and this says He, had a good will to save all, and that his elect ones believe… 2. Christ is willing to take away all heart-exceptions of unbelief from men, as… Eze. 33, The people slandered the Lord, He delighted so to have the people pine away in their iniquities, that He would punish them for no fault, but the children’s teeth should be set on edge for the sins of the father and the grapes that they eat not themselves. The Lord answers that calumny, Eze. 18, ‘And here, as I live, I delight not so (so as you slanderously, and blasphemously say) in the death of a sinner, by my life, I desire you may repent and live, nor have I pleasure to punish innocent men, for no sin at all.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London: J.D., 1647), pt. 3, pp. 445-47</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-25871be9fa" data-kw="">
<blockquote><p>The goodness of God is his inclination to deal well and bountifully with his creatures. (Cocceius, Sum, p. 50) ‘Tis that whereby He wills there should be something besides Himself for his own glory. God is good in Himself and to Himself, i.e. highly amiable to Himself; and therefore some define it a perfection of God, whereby He loves Himself and his own excellency; but as it stands in relation to his creatures, ’tis that perfection of God whereby He delights in his works and is beneficial to them. God is the highest goodness, because He does not act for his own profit, but for his creatures’ welfare and the manifestation of his own goodness. He sends out his beams without receiving any addition to Himself or substantial advantage from his creatures. ‘Tis from this perfection that He loves whatsoever is good, and that is whatsoever He has made, for ‘every creature of God is good.‘ (1 Tim. 4:4) Every creature has some communications from Him, which cannot be without some affection to them; Every creature has a footstep of divine goodness upon it; God therefore loves that goodness in the creature, else He would not love Himself. (Cajetan, in pt. 2 of 2, quest. 34, art. 3) God hates no creature, no not the devils and damned as creatures; He is not an enemy to them as they are the works of his hands: He is properly an enemy that does simply and absolutely wish evil to another; but God does not absolutely wish evil to the damned; that justice that He inflicts upon them, the deserved punishment of their sin, is part of his goodness (as shall afterward be shown).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, … (d. 1680; London: Newman, 1682), Goodness of God, pp. 584-85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-c8942359ec" data-kw="">
<blockquote><p>It is admitted that God’s love to man is in one sense universal. He bears good-will towards them, as the work of his hands; but it does not follow thence that He must do all that he could do for their salvation… As to God’s willingness that all should turn and live, as God’s will has been observed sometimes expresses what He approves, and sometimes what He purposes. God wills, approves and desires a sinner’s turning unto Him. It is that which, through the whole Bible, is required of him; and whosoever thus returns shall live. I may add, God is willing to receive and forgive every sinner that returns to Him through Jesus Christ. He desires not the death of a sinner, but rather that he would repent and live. But He has not purposed the salvation of every sinner, or to incline his heart to embrace the salvation exhibited in the gospel. In this sense, the salvation of some is neither desired nor designed: if it were, it would be effected; for “his counsel shall stand, and He will do all his pleasure.”–“Whatsoever his soul desires, even that he does,” Isa. 46:10; Job 23:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-fuller.html">Andrew Fuller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Reality and Efficacy of Divine Grace”</cite>, (1815) in The Complete Works of Andrew Fuller (Harrisonburg, Virginia: Sprinkle Publications, 1988), 2:554</span></figcaption>

</figure><figure class="quote" id="q-57c27cb19d" data-kw="">
<blockquote><p>We see that God is (as ye would say) wayward towards us; we see that He does not only bereave us of his blessings, but is also angry with us; and to be short, we perceive in Him nothing but all manner of rigor. And what is the cause hereof? Verily that we shut the gate against his goodness and will not suffer Him to use (as ye would say) his natural disposition. Lo here [is] a thing that should make us the better to acknowledge our faults and not to accuse God of any excessive cruelty when He deals not with us after our liking. For it is certain that He will take pleasure in doing us good, but on the other side let us consider also that He must in likewise delight to do us evil. And why so? Verily because that He is just. Indeed, if we did suffer God to use his own inclination towards us, He would bestow infinite benefits upon us and we living in this world should be as in Paradise. But because of our sins, we must live here like wretched wanderers; we must languish in many miseries, we must dwell in continual fear and in doubt and we must groan in great unrest: it must be even so. And wherefore? Because God is just. This is the very pleasure that is spoken of in this text, according whereunto it is said that God will rejoice and be glad when He has punished the wicked and maintained his majesty against them, for that they have despised Him and set Him at nought. Nevertheless, it is likewise true that He says by his prophet Isaiah [1:24] that He does it unwillingly. ‘Alas’ (says He) ‘must I needs revenge Me of mine enemies?’ God cries there ‘Alas,’ as if He were in sorrow and anguish for it. ‘I must’ (says He) ‘take comfort in avenging Me of mine enemies.’ Those whom He terms his enemies are the children whom He had adopted, and which boasted themselves to be his people. And how does He comfort Himself in them? Even by giving them over and by driving them away. But in the meanwhile He shows that it is against his will when He must so beat men down with main strokes, howbeit that He can none otherwise do. Yet notwithstanding, in very deed God is able to tame the hearts of men without any great violence: for (as we have said) He is not subject to our passions. But hereby we be to consider how his intent is to declare that our unreformable naughtiness is the cause why He is faine to pursue us after such manner as is spoken of here and that He is faine to take pleasure in doing us harm, wherein the order of nature is after a sort quite altered and changed: but all is through our own fault and we ourselves are to blame for it, and it is not for us to seek any other reason thereof than our own sin which has kindled his vengeance to the uttermost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, The Sermons of Mr. John Calvin upon the Fifth Book of Moses called Deuteronomy... (London: Middleton, 1583), Sermon 162, the 10th upon the 28th Chapter, p. 1,005 on Dt. 28:63, “And it shall come to pass, that like as the Lord thy God rejoiced over thee to do thee good, and to multiply thee: even so will the Lord rejoice over you to destroy you, and to bring you to nought…”</span></figcaption>

<div class="actions"><button class="copy" data-copy="“We see that God is (as ye would say) wayward towards us; we see that He does not only bereave us of his blessings, but is also angry with us; and to be short, we perceive in Him nothing but all manner of rigor. And what is the cause hereof? Verily that we shut the gate against his goodness and will not suffer Him to use (as ye would say) his natural disposition. Lo here [is] a thing that should make us the better to acknowledge our faults and not to accuse God of any excessive cruelty when He deals not with us after our liking. For it is certain that He will take pleasure in doing us good, but on the other side let us consider also that He must in likewise delight to do us evil. And why so? Verily because that He is just. Indeed, if we did suffer God to use his own inclination towards us, He would bestow infinite benefits upon us and we living in this world should be as in Paradise. But because of our sins, we must live here like wretched wanderers; we must languish in many miseries, we must dwell in continual fear and in doubt and we must groan in great unrest: it must be even so. And wherefore? Because God is just. This is the very pleasure that is spoken of in this text, according whereunto it is said that God will rejoice and be glad when He has punished the wicked and maintained his majesty against them, for that they have despised Him and set Him at nought. Nevertheless, it is likewise true that He says by his prophet Isaiah [1:24] that He does it unwillingly. ‘Alas’ (says He) ‘must I needs revenge Me of mine enemies?’ God cries there ‘Alas,’ as if He were in sorrow and anguish for it. ‘I must’ (says He) ‘take comfort in avenging Me of mine enemies.’ Those whom He terms his enemies are the children whom He had adopted, and which boasted themselves to be his people. And how does He comfort Himself in them? Even by giving them over and by driving them away. But in the meanwhile He shows that it is against his will when He must so beat men down with main strokes, howbeit that He can none otherwise do. Yet notwithstanding, in very deed God is able to tame the hearts of men without any great violence: for (as we have said) He is not subject to our passions. But hereby we be to consider how his intent is to declare that our unreformable naughtiness is the cause why He is faine to pursue us after such manner as is spoken of here and that He is faine to take pleasure in doing us harm, wherein the order of nature is after a sort quite altered and changed: but all is through our own fault and we ourselves are to blame for it, and it is not for us to seek any other reason thereof than our own sin which has kindled his vengeance to the uttermost.”

— John Calvin, The Sermons of Mr. John Calvin upon the Fifth Book of Moses called Deuteronomy... (London: Middleton, 1583), Sermon 162, the 10th upon the 28th Chapter, p. 1,005 on Dt. 28:63, “And it shall come to pass, that like as the Lord thy God rejoiced over thee to do thee good, and to multiply thee: even so will the Lord rejoice over you to destroy you, and to bring you to nought…”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+see+that+God+is+%28as+ye+would+say%29+wayward+towards+us%3B+we+see+that+He+does+not+only+bereave+us+of+his+blessings%2C+but+is+also+angry+with+us%3B+and+to+be+short%2C+we+perceive+in+Him+nothing+but+all+manner+of+rigor.+And+what+is+the+cause+hereof%3F+Verily+that+we+shut+the+gate+against+his+goodness+and+will+not+suffer+Him+to+use+%28as+ye+would+say%29+his+natural+disposition.+Lo+here+%5Bis%5D+a+thing+that+should+make+us+the+better+to+acknowledge+our+faults+and+not+to+accuse+God+of+any+excessive+cruelty+when+He+deals+not+with+us+after+our+liking.+For+it+is+certain+that+He+will+take+pleasure+in+doing+us+good%2C+but+on+the+other+side+let+us+consider+also+that+He+must+in+likewise+delight+to+do+us+evil.+And+why+so%3F+Verily+because+that+He+is+just.+Indeed%2C+if+we+did+suffer+God+to+use+his+own+inclination+towards+us%2C+He+would+bestow+infinite+benefits+upon+us+and+we+living+in+this+world+should+be+as+in+Paradise.+But+because+of+our+sins%2C+we+must+live+here+like+wretched+wanderers%3B+we+must+languish+in+many+miseries%2C+we+must+dwell+in+continual+fear+and+in+doubt+and+we+must+groan+in+great+unrest%3A+it+must+be+even+so.+And+wherefore%3F+Because+God+is+just.+This+is+the+very+pleasure+that+is+spoken+of+in+this+text%2C+according+whereunto+it+is+said+that+God+will+rejoice+and+be+glad+when+He+has+punished+the+wicked+and+maintained+his+majesty+against+them%2C+for+that+they+have+despised+Him+and+set+Him+at+nought.+Nevertheless%2C+it+is+likewise+true+that+He+says+by+his+prophet+Isaiah+%5B1%3A24%5D+that+He+does+it+un f="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=We%20see%20that%20God%20is%20%28as,kindled%20his%20vengeance%20to%20the%20uttermost&amp;text=We%20see%20that%20God%20is%20%28as%20ye%20would&amp;text=which%20has%20kindled%20his%20vengeance%20to%20the%20uttermost" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But when expressions that import anger, or grief, are used [Gen. 6:6; Jud. 10:16; Ps. 78:40; 95:10; etc.], even concerning God Himself, we must sever in our conception everything of imperfection and ascribe everything of real perfection. We are not to think such expressions signify nothing, that they have no meaning, or that nothing at all is to be attributed to Him under them. Nor are we, again, to think they signify the same thing with what we find in ourselves and are wont to express by those names. In the divine nature, there may be real, and yet most serene complacency and displacency, viz. that are unaccompanied with the least commotion, and import nothing of imperfection, but perfection rather, as it is a perfection to apprehend things suitably to what in themselves they are… But we must take heed, lest, under the pretense that we cannot ascribe everything to God that such expressions seem to import, we therefore ascribe nothing. We ascribe nothing, if we do not ascribe to Him a real unwillingness that men should sin on, and perish; and consequently, a real willingness that they should turn to Him, and live; which so many plain texts assert. And therefore it is unavoidably imposed upon us to believe that God is truly unwilling of some things, which He does not think fit to interpose his omnipotency to hinder; and is truly willing of some things which He does not put forth his omnipotency to effect…</p></blockquote>

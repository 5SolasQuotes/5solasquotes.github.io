<main class="wrap"><figure class="quote" id="q-db40499671" data-kw="">
<blockquote><p>If so be the Ceremonial Law, as given by Moses, had still obliged Christians, though there could be no obligation from the matter, had it not been revoked and abolished; then the Moral Law given by Moses must still oblige, though it did not bind in respect of the matter, unless we can shew where it is repealed.

For the further clearing of this, you may consider, that this was the great Question, which did so much trouble the Church in her infancy, Whether Gentiles converted were bound to keep up the Ceremonial Law? Whether they were bound to circumcise, and to use all those legal purification? Now how are these Questions decided, but thus? That they were but the shadows, and Christ the fullness was come, and therefore they were to cease.

And thus for the Judicial Laws, because they were given to them as a politick body, that polity ceasing, which was the principal, the accessory falls with it; so that the Ceremonial Law, in the judgment of all, had still bound Christians, were there not special revocations of these commands, and were there not reasons for their expiration from the very nature of them. Now no such thing can be affirmed by the Moral Law; for the matter of that is perpetual, and there are no places of Scripture that do abrogate it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis: or, a vindication of the moral law and the covenants, from the errors of the papists, Arminians, Socinians, and more especially, Antinomians. In XXX lectures, preached at Laurence-Jury,</cite>, London (2nd edn, London: Thomas Underhill, 1647), p. 168.</span></figcaption>

ral knowledge of man, God, and the universe is necessary for biblical interpretation, and is a key element in a well-rounded solution to the protestant problem.</p></blockquote>

<blockquote><p>4. He [Parker] makes a distinction betwixt the case of appellation and the case de nulla administratione mala praesumpta. Though the particular eldership has proceeded aright, though it consist of able and sufficient men, and though it be in re propria [in a proper thing], yet if one think himself wronged, and so appeal, then is it made obnoxious to a higher consistory, for says Parker, as the Council of Sardis ordains, audience must not be denied to him who entreats for it. So says Zepperus, speaking of the same purpose: ‘cuivis integrum quoque sit ad superiores gradus provocare, si in inferioris gradus sententia aut decreto aliquid desideret.’ (de Pol. Eccl., bk. 3, ch. 2)</p></blockquote>

<blockquote><p>To open this, consider, That there is a twofold original fountain of Righteousness towards man:

1. There is the immediate command and word of God, and that is called Jus Divinum, Divine Righteousness.

2. There is the Law and Command of Nature, and that is Jus Humanum, An humane Righteousness, or Right: And this is either general, the first and immediate principles of nature, such as the apostle speaks of, Rom. 1, concerning the gentiles, that they had ‘a Law written in their hearts,’ [sic] verse 7 [2:14-15], about just and unjust things, and their consciences accusing or excusing, upon the omission or commission of such things, or else they are more remote and particular dictates, such as the good and wholesome laws of all lawgivers, in respective nations. So what is righteous and just between man and man, is to be determined by the laws of that land where they live: Indeed, if any lawgivers (as some heathenish have) commanded or allowed anything that is against the Law of God, or the universal dictates of right reason; such commands are not worthy the name of laws, they are rather unjust decrees, and so do not bind: But otherwise, the laws of a land determine what is righteous and just between man and man: for although it be God’s command, that a man should not steal, yet they are human laws that give the bounds and proprieties of estates to men: So that we Christians, and the Jews, do something differ about the rules of righteousness and equity; for God was the immediate Lawgiver unto that people: Moses as a messenger from God, received from God’s mouth the Judicial Law, which he delivered to them; so that the Judicial Law appointed by God Himself, was the statute-law of that realm: Their Laws were not human, as all the laws of kingdoms and states are since Christ’s coming, but they were Divine: Their laws about a thief, a murderer, the buyer and the seller, were all Divine laws, because immediately commanded by God, though the matter was merely human. Now its greatly disputed how far these Judicial Laws commanding judgement and justice between man and man, do bind us Christians; and whether all lawgivers and statesmen, are not bound to bring in those Judicial Laws? For who can determine what is righteousness and equity better then God, a righteous and wise God? It’s not pertinent to wade into this excellent question at this time: Though some in this point are very rigid, to make all obligatory, that are not expressly repealed by Christ; and some again are very remiss and lax; yet all conclude that the Moral Equity and Reason that was in every Judicial Law, does bind Christians as well as Jews; and with that we shall conclude this particular, whatsoever law God made about justice, restitution or punishment to the Jews, the equity and reason of that law, does still bind us, though not the particular manner. As for the New Testament, Christ’s Kingdoms was not temporal, or of this world; and therefore He only commands righteousness in the general, and commands that excellent maxim, which an heathen emperor did so much admire, saying, he received it from Christians, ‘What ye would have men do to you, do ye to them, for this is the Law and the Prophets,’ Mt. 7:12… Christ therefore He has only given us general rules of righteousness, and for the particulars, He does command Christians to obey and submit to the wholesome laws of that place where they are; as Rom. 13, ‘Pay tribute to whom tribute, custom to whom custom:’ And this the Scripture does often press, that none might think that the freedom they had by Christ did take them off from human obligations and relations: This was a great temptation, they thought because they were Christians, and made free by Christ, that this also did take them off from obedience to civil magistrates, and from the laws they lived under: No, the Scripture is diligent to teach this, That Christianity and the Gospel does not abolish political and civil government, but rather greatly advances it as an institution of God, pressing obedience thereunto for conscience sake.</p></blockquote>

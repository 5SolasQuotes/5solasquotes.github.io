<main class="wrap"><figure class="quote" id="q-2f0051a23a" data-kw="">
<blockquote><p>John the Baptist was an occasional conformist to the Jewish Church: He went to Jerusalem to worship thrice a year at the solemn feasts, according to the Law [Dt. 16:16]; but at other times he held separate assemblies¹ in the wilderness of Judea at Jordan [Mk. 1:5], and at Aenon [Jn. 3:23], where he taught and baptized… ¹ [For a summary in English Church history after the Reformation of presbyterians and puritans who at times held separate assemblies from the established Anglican Church, yet still held communion with her, see James Owen, Moderation Still a Virtue, 1704, pp. 42-44.] Our Lord Jesus Christ, the Author of our holy religion, was also an occasional conformist. We find Him sometimes in the Temple and synagogues; at other times preaching in private houses, on mountains and in the wilderness, etc… He preached in separate congregations, was a dissenter from the imposed ceremonies and traditions of the elders, and vindicated his disciples in their non-conformity to them, telling his censorious accusers that they ‘taught for doctrine the commandments of men.’ (Mt. 15:1-9; Mk. 7:1-8) The apostles of our Lord Jesus, in imitation of their Master, were occasional conformists. One, while we find them in the Temple at public worship and teaching there (Acts 3:1; 4:1); another [time] while in a private meeting, or conventicle, as some would call it. St. Luke says, ‘They continued daily with one accord in the Temple’, and ‘broke bread from house to house.’ (Acts 2:46) St. Paul, the apostle of the gentiles, was eminent for occasional conformity. He exhorts the Christians to assert their freedom from the law of ceremonies (Gal. 5:1), lives himself after the manner of the gentiles (Gal. 2:14), and by consequence, in fellowship with them, yet occasionally purified himself in the Temple, according to the Law of Moses. (Acts 21:26) He was a dissenter from the ceremonies of the Law, and yet submits to them to avoid offense [Acts 16:3; 18:21]. He statedly communicated with the gentile Churches, but holds occasional communion with the national Jewish Church. He judged occasional communion lawful, but did not therefore conclude constant communion a duty, nay, it had been sinful to him and all other Christians; for then they must have separated from the fellowship of the Gospel [Acts 15:7-19; Gal. 2:9-21], and renounced Christianity… From this different constitutions of the Jewish [in Acts 15:21] and Gentile Churches, it follows: 1. That there was no exact uniformity in the Churches planted by the apostles. Nor did they make any laws of uniformity in lesser matters, as the condition of Christian communion; but left the believers to follow their different sentiments, and to approve themselves to God therein. Some were free to eat all things, others eat herbs, rather than forbidden flesh, or clean flesh dressed after the manner of the gentiles, some observed days, others not. (Rom. 14:2, 5) Here is a manifest difference in practice, and the rule or canon which the apostle gives about it, is not a rule of uniformity, but of charity, not to despise or judge one another. (Rom. 14:3)</p></blockquote>

<blockquote><p>And that David might not think this motion of building God an house displeasing unto Him, although he was not permitted so to do, it is said, 1 King: 8:18, ‘Whereas it was in thy mind to build Me an house, thou didst well,’ which is here omitted, the Lord approved it expressly as a pious intention in David. And lastly because he bent his mind to the building of an house for God, the Lord promises to requite him with the like, and to build him an house, as it is said He did for the midwives of Egypt, He built them houses…</p></blockquote>

</figure><figure class="quote" id="q-20727f9d68" data-kw="">
<blockquote><p>For although, as I said, I little approve it, yet I see that sometimes in these indifferent matters some things, although they be grievous and burdensome, are to be born so long as it is not permitted by law to deviate from them; lest, if we contend for them more bitterly than we ought, this may be a hindrance to the advancement of the Gospel, and those things which are in their nature indifferent may, by our vehement contention, be represented as ungodly. Now these things, unless I am deceived, bring with them two most heavy inconveniences. For, if we should first suffer the Gospel both to be spread abroad and to take deep root, men would perhaps be better and more easily persuaded to remove these outward appurtenances. While any one is sick, and is by little and little amending, he takes it very ill that certain slight and trifling things, as well in food as in drink, should be removed from him. But the same person, having recovered his health, rejects those things of his own accord as disagreeable and of little use. If England were first well and diligently instructed and confirmed in the most necessary heads of religion, she would not, in my opinion, at length take it in ill part that these things, however superfluous, should be removed. But at this time, since a change is being introduced in necessary points of religion, and that with so great difficulty, if we should also speak of those things as ungodly which are indifferent, the minds of almost all men would be so turned away from us, that they would no longer show themselves to be attentive and patient hearers of sound doctrine and necessary sermons… Do not however gather from hence that I think a minister of the Gospel should never strive to assert the truth of the Scriptures and of doctrines. This I do not affirm: [those] who daily come forward, both in public and private disputations, in the most weighty controversies for religion. But this I say, that these things which are of less moment ought not to be a hindrance through our contention… Further, if we proceed to oppose these indifferent things as destructive and ungodly, we condemn very many Churches that are not alien from the Gospel, and we too bitterly reprove innumerable Churches which are of old distinguished as most worthy of praise. I do not forget that the authority of Churches, whether present or past, ought not to be of such force, that by them the truth of God’s Word should be overborne: for that ought to remain unshaken and unmoved… But I contend that on account of things indifferent, this ought by no means to come to pass that churches should be condemned, or that we should speak unfavourably of them…</p></blockquote>

ot+however+gather+from+hence+that+I+think+a+minister+of+the+Gospel+should+never+strive+to+assert+the+truth+of+the+Scriptures+and+of+doctrines.+This+I+do+not+affirm%3A+%5Bthose%5D+who+daily+come+forward%2C+both+in+public+and+private+disputations%2C+in+the+most+weighty+controversies+for+religion.+But+this+I+say%2C+that+these+things+which+are+of+less+moment+ought+not+to+be+a+hindrance+through+our+contention%E2%80%A6+Further%2C+if+we+proceed+to+oppose+these+indifferent+things+as+destructive+and+ungodly%2C+we+condemn+very+many+Churches+that+are+not+alien+from+the+Gospel%2C+and+we+too+bitterly+reprove+innumerable+Churches+which+are+of+old+distinguished+as+most+worthy+of+praise.+I+do+not+forget+that+the+authority+of+Churches%2C+whether+present+or+past%2C+ought+not+to+be+of+such+force%2C+that+by+them+the+truth+of+God%E2%80%99s+Word+should+be+overborne%3A+for+that+ought+to+remain+unshaken+and+unmoved%E2%80%A6+But+I+contend+that+on+account+of+things+indifferent%2C+this+ought+by+no+means+to+come+to+pass+that+churches+should+be+condemned%2C+or+that+we+should+speak+unfavourably+of+them%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+Gorham%2C+Gleanings+of+a+few+scattered+ears+during+the+period+of+the+Reformation+in+England+%28London%2C+1857%29%2C+Letter+53%2C+%E2%80%98Martyr+to+Bishop+%5BJohn%5D+Hooper%E2%80%99%2C+Nov.+4%2C+1550%2C+pp.+189-90%2C+92%2C+94-96&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F20727f9d68.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/20727f9d68.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=For%20although%2C%20as%20I%20said%2C%20I,we%20should%20speak%20unfavourably%20of%20them&amp;text=For%20although%2C%20as%20I%20said%2C%20I%20little%20approve&amp;text=or%20that%20we%20should%20speak%20unfavourably%20of%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2ae1b34237" data-kw="">
<blockquote><p>In like manner is Rahab commended as one that by reason of her faith and works perished not with them which obeyed not, when she had received the spies peaceably. Yet if we look into the story, we shall easily discern a great deal of infirmity in that very work of love and mercy, by which she got the testimony of such a notable faith: for she bewrayed much unbelief in making a lie to preserve the spies in safety… So the angel (as is recorded in the Gospel) rebuked those good and faithful women, for that they sought the living among the dead: yet… He is risen again, as He foretold you that He would: yet herein does your uprightness appear, that you hold out still in the love and profession of Christ, even now, when He is in such disgrace and dislike… Thus we may perceive how favourable the Lord is towards his children that offend not upon set purpose and presumptuously: but through Satan’s instigation or through human frailty… This makes for the confutation of their error: 1. That think they have no calling to come to the sacrament because they see more and greater faults in themselves than they can espie, or then, indeed, there are in many other Christians… They find so much hypocrisy, so much pride, so much vain-glory and self-love… that they… begin to fear that God will in no sort accept of them, if they should come unto the table of his Son… and therefore [these things] should by no means keep them from the holy sacrament… Further, [2.] those that by reason of their infirmities will forgoe that ordinance do greatly dishonor God and lay an hard imputation upon Him, as who should say that He were such an extreme and rigorous Judge as will accept of none but of those that have attained to a great measure of perfection. Besides, [3.]… they have a calling to partake of the sacrament, as appears in this text… all such as prepared their whole hearts (that is, did their best endeauour with a true and sincere heart) to seek the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper</cite>, (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20 | (London, 1610), 4th Sermon, pp. 125-28</span></figcaption>

<blockquote><p>…the minister… is to begin with prayer: ‘In all reverence and humility acknowledging the incomprehensible greatness and majesty of the Lord, (in whose presence they do then in a special manner appear) and their own vileness and unworthiness to approach so near Him, with their utter inability of themselves to so great a work; and humbly beseeching Him for pardon, assistance, and acceptance, in the whole service then to be performed; and for a blessing on that particular portion of his word then to be read: And all in the name and mediation of the Lord Jesus Christ.&#x27;</p></blockquote>

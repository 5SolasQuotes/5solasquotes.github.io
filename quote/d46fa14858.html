<main class="wrap"><figure class="quote" id="q-d46fa14858" data-kw="">
<blockquote><p>XV. Furthermore, although God by his concurrence, doth give his influence into human actions, sustaining the agent, and directing the actions, setting bounds to them, ordering the events, and drawing good out of evil; yet must it not therefore be thought that God doth instigate to evil actions, or to have forced Eve to the eating of the forbidden tree. To the clearing of which assertion, we say that God doth not only work by the creature, but also work with the creature; both God and the creature are concurrent causes to one ἀποτελέσμα, to the bringing forth of one effect; and these two taken together, are the total cause of any action; which creature, if it doth work voluntary, may be his concurrence pollute the action wherein there is the concurrence of God, and determinate it to evil: By this means the whole fault doth remain with the creature.

For God effectually infusing into the creature, doth not take away from it the free contribution of its own power. If man sinneth any thing in an human action, the concurrence of God is natural: whatsoever was natural in the eating of the forbidden Apple was from God; whatsoever was moral and straying from the path of justice, was from man. As God doth give to a lame living creature the power of going, yet is not his lameness from God; so though God doth give to man the faculty of willing, and doth sustain the natural motion of the will and the act of willing; yet if any evil come which doth defile that act, it must not be said to be from God: Man is the effector of sin, God the permitter. That act in which there is deformity, is naturally good, in as much as it is from God: but morally evil, in as much as it is from man. The action in which the sin is, is one thing, the deformity of the action in which formally the sin is, is another thing. To the action it self God doth concur with man, but not to the sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 3.15, pp 13-14.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7b8d5182a4" data-kw="">
<blockquote><p>It becomes us, as Christ’s example goes before us, to submit in the hardest and most bloody providences, to the straight and holy will of God:

1. Christ presses He has no will divided from God’s will; He lays down his glory, his heaven, his life, his fruition of the sweet influence of an highest vision, love, presence, feeling of God in a personal union at the feet of God, that the Lord may carve and cut and dispose of Him and his blood as He thought good.

2. All the difficulty in us, in whom dwells a body of sin is to answer the objections that flesh and blood has against a sad providence, which I will labor to do, and then give some rules for direction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, pp. 141-58 of Christ Dying &amp; Drawing Sinners to Himself (London: 1647) Including answering 9 objections and giving 13 rules, p. 141</span></figcaption>

</figure><figure class="quote" id="q-9b496daf9c" data-kw="Author of sin">
<blockquote><p>Every action, as such, is undoubtedly good, it being an actual exertion of those operative powers given us by God for that very end; God therefore may be the Author of all actions (as He undoubtedly is), and yet not be the Author of evil. … Suppose a boy, who knows not how to write, has his hand guided by his master and nevertheless makes false letters, quite unlike the copy set him, though his preceptor, who guides his hand, is the cause of his writing at all, yet his own ignorance and unskilfulness are the cause of his writing so badly. Just so, God is the supreme Author of our action, abstractedly taken, but our own vitiosity is the cause of our acting amiss.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Absolute Predestination</cite>, tr. Augustus Toplady, on the omnipotence of God</span></figcaption>

</figure><figure class="quote" id="q-4b8c25085e" data-kw="Author of sin">
<blockquote><p>Although God by his providence governs even sins, yet he is not the cause or author of sin: because he takes no delight in sin, but rather abhors it; nor does he himself sin, or can he sin; likewise because he neither commands nor persuades sin; nor does he pour malice into those who sin, nor compel them to sin; and moreover he directs all things to a good end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Christian Doctrine</cite>, Locus 6, aph. 3</span></figcaption>

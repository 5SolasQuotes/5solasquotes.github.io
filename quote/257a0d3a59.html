<main class="wrap"><figure class="quote" id="q-257a0d3a59" data-kw="">
<blockquote><p>Answer: This [argument of Rutherford’s Independent opponent] speaks against glebes [contracted lands] of ministers, but the New Testament speaks not of manses or houses, or of moneys for ministers; yet a wage we know is due, Matt 10:10; 1 Cor. 9:8-10; Gal. 6:6, and the Levites were not to be distracted from the most necessary work of the Tabernacle and service of God more than ministers, yet they had lands and towns assigned of God to them; though the less distractous the wages be, the better and the more convenient they are, 2 Tim. 2:3-5. As for the tithes, we think quotta decimarum, or a sufficient maintenance of tithes or what else may conduce for food and raiment, of divine right, Matt 10:16; 1 Cor. 9:8-9, tithes formally as tithes are not necessary, so [as long as] the ministers be provided and a stipend be allowed to them, not as an alms but as a debt, Luke 10:7. But the stinting [frugal restricting] of maintenance for ministers the author [Rutherford’s opponent] condemns, because when Constantine gave large rents to the Church, it proved the bane of the Church. But I answer, stinting makes not this, but excess, for mountains of rents may be stinted no less than mole-hills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Due Right of Presbyteries (1644), 2nd Part, pp. 465-66 Scottish commissioner to the Westminster Assembly</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-64accecdb3" data-kw="">
<blockquote><p>That all the members of the catholic Church are united in this profession [of the Christian faith] is very true; but this is not all, they are bound to more than this, viz. to the exercise of the same specifical ordinances, to subjection to the same discipline, as also to love to one another, and where it is possible, to the celebrating together of the same numerical worship. And in any of these, to make any differences, is a breach of that union, that ought to be among the members of the catholic visible Church. … For when Christ has instituted that every church meeting together, and every member of the catholic Church, should exercise the same specifical ordinances, is not this a Church union, or union of Churches? And let it then be considered, that if every member of the Church catholic may be a member of any or every particular church, where providence may cast him (being rightly qualified thereunto), having right first to the same specifical ordinances as a member of the catholic, and then to the same numerical ordinances, where he comes and finds them (as some of his own way [that is congregationalism] do grant, and cannot well be denied), then the denial of such a person to join in those numerical ordinances [such as congregationalists practice] is a breach of that union and love which ought to be between the members of the catholic Church…</p></blockquote>

</figure><figure class="quote" id="q-38be200369" data-kw="">
<blockquote><p>VI. Participation in Prayer How is the congregation to pray together in public worship?… The congregation prays by ‘one mouth speaking for all,’ by an elder leading the people to the throne of grace… What should the worshipper do while the solitary voice is praying aloud? He may allow his mind to pray the same thing silently. He may say in his heart following each petition, ‘Yes, Lord, that is my prayer as well,’ or add his own brief petitions which are suggested by the petitions being offered. And at the conclusion of the prayer he should join audibly in saying the ‘Amen’ as has been the practice of God’s people in both the Old Covenant and the New (Neh. 9:6; 1 Cor. 14:16). Jerome said that the ‘Amen’ following the prayers of the fourth century church was like a clap of thunder! This practice is much to be preferred over the common custom of interrupting or punctuating the prayers by audible ‘Amens’ (or grunts or groans or other such expressions such as, ‘Yes, Lord,’ or ‘Thank you, Jesus!’). Better to nod the head in silent agreement than to distract other worshippers or the one praying or to subject yourself to the temptation of attempting to appear more spiritual than others on the basis of the number or loudness of the audible responses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-schneider-iii.html">Michael Schneider III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Chapter 13, ‘Prayer Regulated by God’s Word’ in Worship in the Presence of God, ed. David Lachman &amp; Frank Smith (Greenville Seminary Press, 1992)</cite>, pp. 240-1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

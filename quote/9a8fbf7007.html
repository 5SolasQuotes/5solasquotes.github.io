<main class="wrap"><figure class="quote" id="q-9a8fbf7007" data-kw="">
<blockquote><p>Yet it is not so much my object to be favoured with your countenance in my personal labours, as humbly to entreat, and by the sacred name of Christ to implore, not only that, through your kindness, all orthodox books may again be welcomed and freely circulated in England, but that your chief care may be directed to promote religion, which has fallen into shameful neglect.

And if this is justly demanded from all kings of the earth by the Only-begotten Son of God, by a still more sacred tie does he hold you bound, most noble Queen, to perform this duty; for when even you, though a king’s daughters were not exempted from that dreadful storm which fell with severity on the heads of all the godly, by the wonderful manner in which he brought you out safe, though not unmoved by the fear of danger, he has laid you under obligation to devote yourself and all your exertions to his service.

So far are you from having any reason to be ashamed of this deliverance that God has given you large and abundant grounds of boasting, by confirming you to the image of his Son, on whom the Prophet Isaiah bestows this among other commendations, that from prison and judgment (Isaiah 53:8) he was raised to the loftiest height of heavenly dominion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume First</cite>, trans. William Pringle (Geneva, 1550) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), vii, pp xvi-vii.</span></figcaption>

<blockquote><p>If these other things of policy be necessary, necessitate precepti [by the necessity of precept], in regard that Jesus Christ has commanded them to be observed, why then are some things alterable which Christ has commanded to be observed, some things unalterable? Cross and surplice, which prelates say have been in the Church these twelve hundred years, are in themselves as positive, and have as small affinity with the civil laws, customs and manners of nations (except they mean sinful customs) as sacramental eating and drinking. And the like may be said of all the alterable ceremonies sometimes in use, in England, and now in force amongst Papists.</p></blockquote>

</figure><figure class="quote" id="q-f5e0bdb179" data-kw="">
<blockquote><p>In a letter to the Belfast News-Letter in support of the non-intrusionists in the established Church of Scotland, the Revd James Morgan argued that Christ’s headship over the church and the right of members to choose their ministers were the central principles at stake in the Ten Years’ conflict:

The fundamental principle for which the Church of Scotland now contends is theologically termed the Headship of Christ over the Church, but I prefer to express it in the words of Christ himself, when, after his resurrection, he said to his disciples – “all power is given unto me in heaven and in earth.” I do not see how any language could be employed more expressive of universal and sovereign dominion.

But it is not the broad principle with which we are at present concerned so much as particular exercise of the power which it claims; and our enquiry is, how has Christ been pleased to exercise his supreme authority in directing the appointment of the Ministers and officers of his Church? His mind upon this subject must be learned from his Word, and when we act in conformity with it, we honour and acknowledge his Headships. Nor is there any obscurity in his Word upon this subject.

We have a plain record of the manner in which the first disciples proceeded, under the guidance of their Great Head, and their conduct is designed to be our example. One of the first public duties in which they engaged after his ascension was the election of an apostle in the room of Judas, and that election was made by the united concurrence of the remaining Apostles &amp; the whole company of the Disciples, as will be obvious to the impartial reader of the first chapter in the Acts of the Apostles. Shortly after it became necessary to appoint the order of Deacons, and in their election also the concurrence and choice of the Disciples were sought by the Apostles themselves. A principle is thus clearly obtained, that in the appointment of Church officers the council and co-operation and approval of the members of the Church are essential. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-morgan.html">James Morgan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belfast News-Letter</cite>, 18 March 1842.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

<blockquote><p>49 Q. What reasons may be given of the Lord’s days beginning in the morning?

A. Other days then begin.

That they do so with us, is evident by the account of our hours. For midnight ended, we begin with one a clock: then the first hour of the day beginneth. And it appears to be so among the Jews: for when Aaron proclaimed (Exod. 32. 5, 6.) To morrow shall be a feast to the Lord, They rose up early on the morrow. I deny not but that sundry of the Jewish feasts began in the evening: as the Passover (Exod. 12.6.) But it cannot be proved that their weekly Sabbaths so began. There were special reasons for the beginning of those feasts in the evening, which did then begin. As for the supposed beginnings of the first days gathered out of this phrase, (the evening and the morning were the first day) they cannot be necessarily concluded to be at evening. For the evening and the morning there importeth the moment of the evening and morning parting one from another, and the return to the same period: which moment is rather at the beginning of the morning then of evening. The evening useth to be referred to the end of the day, and the morning to the beginning, as Exod. 29. 38, 39. I. Sam. 17. 16. and 30.12. Joh. 20.19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s sanctification</cite>, (London, 1641), p. 25.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>As for those who allege some conveniency in the ceremonies, they say more than can abide the proof of reason, which the induction [enumeration] of some particulars shall demonstrate. Dr. [Thomas] Morton (Particular Defense, ch. 1, sect. 1 [1618]) alleges for the surplice that the difference of outward garments cannot but be held convenient for the distinguishing of ministers from laics [laity] in the discharge of their function. Answer: This conveniency is as well seen to without the surplice. If a man having a black gown upon him be seen exercising the function of a minister, it is very strange if any man think it not sufficiently distinguished from laics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (Naphtali Press, 1993) | Part 2, Ch. 2, p. 73</span></figcaption>

<main class="wrap"><figure class="quote" id="q-c59794d9a4" data-kw="">
<blockquote><p>And this promise must be gratuitous; for a conditional promise, which throws us back upon our works, promises life only in so far as we find it existing in ourselves. Therefore, if we would not have faith to waver and tremble, we must support it with the promise of salvation, which is offered by the Lord spontaneously and freely, from a regard to our misery rather than our worth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.2.29</span></figcaption>

</figure><figure class="quote" id="q-159631b248" data-kw="">
<blockquote><p>Faith consists not in ignorance, but in knowledge--knowledge not of God merely, but of the divine will. We do not obtain salvation either because we are prepared to embrace every dictate of the Church as true, or leave to the Church the province of inquiring and determining; but when we recognize God as a propitious Father through the reconciliation made by Christ, and Christ as given to us for righteousness, sanctification, and life.</p></blockquote>

</figure><figure class="quote" id="q-3283612a44" data-kw="">
<blockquote><p>The efficient cause of justifying faith is the Holy Ghost. … The subject of this faith is the will and heart of man. Justifying or saving faith differs, therefore, from the other kinds of faith, because it alone is that assured confidence by which we apply unto ourselves the merit of Christ, which is done when we firmly believe that the righteousness of Christ is granted and imputed unto us, so that we are accounted just in the sight of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 21</span></figcaption>

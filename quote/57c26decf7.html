<blockquote><p>Accordingly, when the Turk now rises up haughtily against us, because he has already vanquished so great a multitude of Christians, we need not be alarmed on that account, as if the power of God were diminished, and as if he had not strength to deliver us. But we ought to consider in how many ways the inhabitants of Greece and of Asia provoked his anger, by the prevalence of every kind of base and shocking licentiousness in those countries, and by the dreadful superstitions and wickedness which abounded.

On this account very severe chastisement was needed for restraining the crimes of those who made a false profession of the name of God. Hence came the prosperity of the Turk, and hence was it followed by a shockingly ruinous condition throughout the whole of the east. Yet we see him insolently raising his crest, laughing at our religion, and applauding his own in a strange manner; but still more does he applaud himself, and “sacrifice to his net,” (Habakkuk 1:16,) as we have already said of other infidels.

We ought, therefore, to direct our minds towards the judgments of God, that we may not think that the Turk acquired such extensive dominion by his own strength. But the Lord allowed him greater freedom, for the purpose of punishing the ungodliness and wickedness of men, and will at length restrain his insolence at the proper time. Now, although prosperity is a token of the blessing of God, yet we must not begin with it if we wish to form right views of God himself, as Mahometans and Papists infer from the victories which they have gained, that God is in some respects subject to their control. But when we have known the true God, blessings are added in the proper order to testify his grace and power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Third</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), viii, 99-100.</span></figcaption>

<blockquote><p>But this is most certain, that there are yet better things to come then have been since the first calling of the Gentiles. Among other better things to come, the recalling of the Jews is most clearly and plentifully fore told by the Prophets. Many apply sundry prophecies that tend that way, to the delivery of the Jews from the Babylonish Captivity; and others, to the spiritual Israel, consisting of Gentiles.

But assuredly such prophecies as fore-tell the re-uniting of Judah and Ephraim together, have especial reference to the fore-said recalling of the Jews: as that Parable, whereof this our Prophet maketh mention, about joining two sticks, on the one whereof was written, For Judah, and for the children of Israel his companions: and on the other, For Joseph the stick of Ephraim, and for all the house of Israel his companions. That Parable the Prophet thus applieth, I will make them one Nation, and one King shall be King to them all, &amp;c.

But if any shall question this and other prophecies of the ancient Prophets. The Apostle Paul hath so expressly fore-told a recalling of the Jews, and thereupon, a bringing in a fullness of the Gentiles, as no question can be made thereof: and he doth after such a manner express these, as apparently declareth a future glory of the Christian Church. Some particular expressions of his in the 11. to the Romans, are these.

1.Vers. 11. Having propounded this Question concerning the Jews, Have they stumbled, that they should fall? (namely, totally and finally, never to be raised again.) He gives this answer, God forbid. Whereby he implieth, that assuredly they shall be raised again, that is, they shall be made a visible Church of Christ, and submit themselves to his ordinances.

2. Vers. 12. This supposition, If the fall of them be riches of the world, and the diminishing of them the riches of the Gentiles: how much more their fullness? By their fullness, he meaneth their bringing them in to the Church of Christ, consisting of Gentiles, and thereby making that Church full, when both Gentiles and Jews shall be joined together.

3. Vers. 15. This Question (What shall the receiving of them be but life from the dead?) doth take it for grant, that they shall be received, and taken into the Church of Christ; and that this restoration of theirs will be as a new glorious resurrection.

4. Vers. 23. It is said, They also shall be graffed in; namely, into the body of the Christian Church; and a proof thereof is taken from God’s omnipotency, For God is able to graff them in again.

5. Vers. 24. This emphatical Interrogation, How much more shall these, which be the natural branches, he graffed into their own Olive-tree? doth put it out of all question, that the Jews shall again be brought to be of the true Church, which is the Olive-tree here intended.

6. Vers. 25. This restrictive particle, In part (blindness in part is happened unto Israel) doth import, that they shall not be finally blinded, but that at length they shall come to have their eyes so opened, as they shall know and believe in Jesus Christ. This is further manifested by expressing the period of this limitation, thus, Until the fullness of the Gentiles be come in.

7. Verse 26. This general phrase; All Israel shall be saved, sheweth, that there is a time to come, when not only two or three, or a few Jews here and there thorowout the Christian Church (as have been in all ages thereof) but the whole Nation shall be called.

8. Vers. 31. This phrase, Through your mercy they also may obtain mercy; sheweth, that God purposely suffered them sometime to abide in unbelief, that when they should be brought to believe, this grace and honour might appear to arise from God’s mere mercy and free grace. The words following in the next verse doe shew as much: They are these, For God hath concluded them all in unbelief, that he might have mercy upon all.

Thus we see that there is a calling of the Jews to come, and that their calling shall be as a resurrection from the dead, as an incision of many more branches into a glorious tree, that it shall be an universal, conspicuous calling of a whole Nation, wherein the freeness and largeness of God’s grace and mercy shall be evidently manifested. At which time there shall be also such a number of Gentiles brought in, as may well be called the fullness of the Gentiles, vers. 25. This certainly shall be a most glorious condition of the Christian Church, and this is yet to come: therefore God will yet doe better things for us. In expectation whereof we may comfort our selves, though for a while thick clouds of troubles doe over-spread the face of the Church, and somewhat eclipse the glorious brightness thereof.</p></blockquote>

<blockquote><p>Thirdly, it is asked whether the Jews are to be compelled to pay field tithes or the other things that Christians living in houses or dwelling in lands which are within the boundaries of some church are accustomed to pay. It seems that: a. For the Church must by no means be defrauded of its right; but it would be defrauded if Jews were to retain lands and not pay tithes; therefore they are to be compelled to payment. b. Furthermore, it was commanded in the Law of Moses that the sons of Israel should pay tithes to the Levites; similarly it is said in Mal. 3:10: Bring every tithe into my storehouse; and in 2 Chron. 31:5, where it is said that they were offering to God tithes of everything. Since, therefore, Jews are bound to the payment of tithes and are exempt from no privilege, since they are of worse condition and ought to be, by reason of sin, than they were in the time of the Law, they will now be bound to the payment of tithes. c. And if perhaps they should say that they would be bound to render them to their own Levites, against this it is that the Levitical priesthood yielded to the priesthood of Christ Himself, as is had in Heb. 7:12: The priesthood having been transferred, it is necessary that a transfer of the Law also be made. Likewise in Daniel: When the Holy of holies has come. Therefore, Christ having come, your anointing ought to cease; the royal and priestly anointing ought to cease; therefore the payment of tithes was to be made to the priests of the New Law. d. Furthermore, tithes are rendered to God from lands in memory of the benefit of the annual multiplication of fruits; but lands are bounded according to the distinction of churches; therefore by reason of fields or lands tithes are to be paid by all who possess them; therefore Jews, if they possess lands, are bound to pay tithes to the churches. On the contrary:

1. Jews have nothing except from usury in most cases; but from usuries the Church ought to receive nothing; therefore, as it seems, neither ought it to receive anything from lands that have been bought with usuries.

2. Again, Sirach 34:21 says: The oblation of one sacrificing from injustice is defiled; and again: He who offers from the substance of the poor is as one who sacrifices a son in the sight of the father. The Most High does not approve the gifts of the unjust. Since, therefore, these men have nothing except the gifts of the unjust, they ought not to be accepted by the Church, which receives in place of the Most High. [Solution]: To this it must be said that some tithes are predial and some are personal. Predial tithes, however, and whatever churches were wont to receive on account of fields, the churches can ask even from Jews by reason of the fields possessed by them, as is had in the Extra, De decimis, De terris, where it is said that Jews are to be compelled to pay tithes from the lands which they cultivate or to renounce the possessions altogether, lest perhaps the churches be able to be defrauded of their right on that account. Likewise it is had in the Extra, De usuris, Quanto, where it is said that Jews are to be compelled to make satisfaction to the churches for tithes and due oblations, which they are accustomed to receive from Christians from houses and other possessions, so that the churches may be preserved unharmed. Not that anything is to be received from usuries or from things acquired unlawfully, or that oblations are to be received in the church from the Jews themselves, but from things lawfully acquired by them by reason of the houses which they inhabit, lest the church be harmed excessively, if nevertheless the decency of the church in this matter is preserved. But if it should be contrary to decency and the church were not harmed excessively, one should refrain, to avoid scandal. [To the objections]:

1. And by this the contrary objection can be solved, because from usuries, insofar as they are such, the Church cannot ask tithes or oblations. And although lands may have been bought from usuries, nevertheless the Church can ask tithes, because the one who sold could sell only what he had by right, while the thing itself passes with its burden.

2. To the second, however, it must be said that, although oblations or gifts are not acceptable to God, insofar as they are offered by the unjust, nevertheless those things which are owed are acceptable, by reason of the fact that they are owed, if they are paid; whence in one respect they are acceptable, in another respect they are not acceptable; yet the action itself, which proceeds from a perverse will, is not acceptable. But when something is offered from theft or usury, it is not acceptable, because it is not offered from what is one’s own; but its restitution, insofar as it is such, would be acceptable.</p></blockquote>

<blockquote><p>Question 8, Is it lawful to tolerate the synagogues of the Jews, in which they blaspheme the name of Jesus? Although there is no lack of rescripts of civil and canon law by which synagogues are permitted to the Jews, and it is granted that they should neither be killed, nor violated, nor hindered in their festivals (L. nullus, et L. die, Sabbathi, C. de Judæis, l.6; C. de paganis; see also the sanction of Theodoric, King of the Romans, in Goldast. Regis, apud Goldast., vol. 3 and of Emperor Conrad IV, vol. 2, Constit. Emper.) Yet it cannot be permitted with a safe conscience that they freely blaspheme the Lord Jesus in their synagogues and curse Him, or that they seduce Christians, nor are marriages to be entered into with them unless the hope of conversion to the Christian faith shines forth, nor are negotiations or autonomy to be granted to them on Sundays and other Christian festivals, but rather they are to be treated as exiles and servants and marked with a certain sign of a harmful sect: Ἀναγκἀνῷ [sp.? “Compel”]. Liberty is to be permitted to those passing over to the Christians, and the way opened to them, with laws established for hearing evangelical sermons, and for attending instruction from the writings of the New Testament by those who are exceptionally skilled in the Hebrew language and the original text. Nor do those rescripts abolish such laws, provided that coercion of faith, which is hostile to conscience, is absent, since Lk. 14:23, ἀναγκασοὺς [compel] is prescribed for the ministry, not as civilly coercive, but morally persuasive. Let there be , however, a sincere intention of leading miserable men to the faith of Christ, and let those means by which we might win them over be piously employed, such as friendly admonitions and gentle persuasions (with harshness removed), and above all clear arguments and illustrious proofs from Scripture that conquer the mind: which God blesses, as the examples of many thousands converted to the Christian Faith from the 5th to the 15th century testify. See Jerome of the Holy Faith, Book Against the Jews, and the preface of the same; Beda, qv. 30, on 1 Kings; Council. Toletan. ch. 57 etc. Although indeed by the right of political superiority no one can be forced to the Faith, as Thomas teaches, pt. 2 of 2, q. 10, art. 8, yet that Jews cannot be compelled to hear the faith is Ἀναγκάζον [constraining], because this is purely extrinsic, and a παιδαγωγός [guide]: but that [faith] embraces an intrinsic act tending toward the intellect itself and the will.</p></blockquote>

<blockquote><p>[T]here are some stupid preachers among us Germans (as I am sorry to hear) who are making the people believe that we ought not and must not fight against the Turks. Some are even so foolish as to say that it is not proper for Christians to bear the temporal sword or to be rulers. Furthermore, some actually want the Turk to come and rule because they think our German people are wild and uncivilized – indeed, that they are half-devil and half-man. …

Moreover, I hear it said that in Germany there are those who desire the coming of the Turk and his government because they would rather be under him than under the emperor or princes. It would be hard to fight against the Turk with such people.</p></blockquote>

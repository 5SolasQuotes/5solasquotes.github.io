<blockquote><p>The covenant of redemption and the covenant of grace, are not two distinct covenants, but one and the same covenant. I know that many divines do express themselves otherwise in this matter; and that upon very different views, some of which are no ways injurious to the doctrine of free grace. But this I take to be Scripture truth, and a native consequent of the account given of the covenant of grace in our Larger Catechism, to wit, “That the covenant of grace was made with Christ as the second Adam, and in him with all the elect as his seed:” Gal. iii. 16. “Now to Abraham and his seed were the promises made. lie saith not, And to seeds, as of many; but as of one, And to thy seed, which is Christ,” Rom. v. 15, to the end. Isa. liii. 10, 11, “When thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the Lord shall prosper in his hand. He shall see of the travail of his soul, and shall be satisfied,” &amp;c.

So the covenant of redemption and the covenant of grace are but two names of one and the same second covenant, under different considerations. By a covenant of redemption is meant a bargain of buying and selling: and such a covenant it was to Christ only; for as much as he alone engaged to pay the price of our redemption, 1 Pet. i. 18, 19. By a covenant of grace, is meant a bargain whereby all is to be had freely: and such a covenant it is to us only, to whom the whole of it is of free grace; God himself having provided the ransom, and thereupon made over life and salvation to us, by free promise, without respect to any work of ours, as the ground of our right thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Grace, from the Sacred Records</cite>, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 396-97.</span></figcaption>

<blockquote><p>Secondly, he [Peter] calleth to their remembrance the vocation of the Jews, and promise of God, alleging the covenant or testament of God, made in the time past with Abraham. You (sayeth he) are the children of the covenant, which God made with your fathers, saying to Abraham: Euen in thy seed shall all the kindreds of the earth be blessed. He seemeth by an Hebrew phrase to call them the children of the Testament, to whom the Testament belonged, and which were Heirs written in the Testament of God. For so we read they are called the children of wrath, or death, whom God in his wrath appointeth to death.

Peter seemeth to make two arguments. The first is of a thing before denounced or shewed, saying: God in the Testament which he made with your fathers hath written you for heirs also. Ergo, the salvation contained in the Testament of God, belongeth as well to you as to the fathers. The Antecedent needed no great proof, with those who knew the promise of God well enough: I will be thy God, and the God of thy seed after thee. Then alleging the sum and effect of the Testament, he proveth by an argument a comparatis, that is, of things compared or laid together, that they cannot be excluded from the promises.

For thus God testified to their father Abraham, that in his seed all the Nations of the earth should be blessed. And if the Testament of God extended to foreign Nations, who I pray you will deny that it appertaineth to them that be born of the stock of Abraham? Yet let us always remember that Peter speaketh these things conditionally, and that salvation is promised to them which (by the faith that was in Abraham) take hold of Christ, lest we attribute unto carnal generation, that which dependeth upon the mere grace of God, and his free election, as Paule at large proveth to the Romans, the ix. Chapter.

By this place may the madness of the Anabaptists be confuted, which will not admit the children born of the faithful into the society and fellowship of Christ’s Church, yet none of us deny but that salvation standeth in God’s election, and not in carnally generation. In the meane while where as God in his Testament hath long since included the children of the faithful: it may seem great rashness to deny them the communion of the Testament and Church of God.

Shall we think the conditions of the new Testament more hard and grievous for our children, than the old were, when by Circumcision the eighth day they were taken into the fellowship of the people of God? Or shall the authority of Christ be of no force with us, which attributeth faith to little children, and affirmeth that the kingdom of heaven pertaineth to them? Or what shall we say to Paule, which speaking of unlike marriages, feareth not to call those children holy, which have but one parent only, be it father or mother that is a Christian? Let us therefore avoid the heady audacity of our judgement, and constantly keep the articles of God’s covenant, where it is manifest, that salvation is promised even to very children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An hundred, threescore and fifteen Homilies or Sermons, upon the Acts of the Apostles, written by Saint Luke</cite>, trans. John Bridges (London: Henry Denham, 1572), pp 185-86.</span></figcaption>

<blockquote><p>3. The third thing is the goodness of God in his government…. his goodness hovers over the whole frame… to conduct them to those ends which might illustrate his wisdom and goodness to his creatures. His goodness does no less incline Him to provide for them than to frame them. ‘Tis the natural inclination of man to love what is purely the birth of his own strength or skill. He is fond of preserving his own inventions, as well as laborious in inventing them. ‘Tis the glory of a man to preserve them as well as to produce them. God loves everything which He has made, which love could not be without a continued diffusiveness to them, suitable to the end for which He made them.</p></blockquote>

<blockquote><p>IV. This double covenant is proposed to us in Scripture: of nature and of grace; of works and of faith; legal and evangelical. The foundation of this distinction rests both on the different relation (σχέσει) of God contracting (who can be considered now as Creator and Lord, then as Redeemer and Father) and on the diverse condition of man (who may be viewed either as a perfect or as a fallen creature); also on the diverse mode of obtaining life and happiness (either by proper obedience or by another’s imputed); finally on the diverse duties prescribed to man (to wit, works or faith). For in the former, God as Creator demands perfect obedience from innocent man with the promise of life and eternal happiness; but in the latter, God as Father promises salvation in Christ to the fallen man under the condition of faith. The former rests upon the work of man; the latter upon the grace of God alone. The former upon a just Creator; the latter upon a merciful Redeemer. The former was made with innocent man without a mediator; the latter was made with fallen man by the intervention of a mediator.</p></blockquote>

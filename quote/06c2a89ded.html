<blockquote><p>…the law, which was in itself holy, just, and good, through sin became in some sort contrary, or subcontrary, to us, in that it did serve to convict, and terrify with the curse for our default, Rom. 7:5,9, aggravating all by its ceremonies, and shutting the gate of God’s house against the Gentiles, of whose number the Colossians were, strangers from the covenants of promise, Eph. 2:12; yet this obligation was abrogated and annulled by the death of Christ…</p></blockquote>

</figure><figure class="quote" id="q-39eac37d0e" data-kw="">
<blockquote><p>That he [Paul] did not propose this his practice [of not receiving money from the Christians in Ephesus in Acts 20:33-35] as a precept or precedent law or rule to all ministers, for he had not power to deprive them of what God had given them (Lev. 27:32; Mt. 10:10; Lk. 11:42; Prov. 3:9,10; Mal. 3:9,10). Tithes were paid by Abraham to Melchisedeck long before the Levitical Law: So that there must be a moral equity in this reciprocal duty both before the Law, under the Law, and after the Law under the Gospel. And though Paul did thus in a juncture and case of necessity because of their present poverty (had they been able, more shame would it have been to them to let him labor) and because false teachers were watching all advantages against him, yet does he himself often assert his own privilege (1 Cor. 9:14; Gal. 6:6) and Christ’s words (he urges) might be collected out of Lk. 6:38 and 16:9, etc. yea, the very terms might be spoken by Christ, for all He spake is not writ (Jn. 20:30).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-ness.html">Christopher Ness</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete History &amp; Mystery of the Old &amp; New Testament, Logically Discussed &amp; Theologically Improved</cite>, (1696), p. 457 Ness was an English, Independent puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-8227d2ef9f" data-kw="">
<blockquote><p>To join to the public confession some notable promise which may raise sinners to the hope of pardon and reconciliation, there is none among us who does not acknowledge it to be most useful. And indeed from the beginning I wished to introduce this practice; but when certain persons feared that offence might arise from the novelty, I was too ready to yield. Thus the matter was let go. Yet now it would not be seasonable to make any change in this respect; because, before the confession has been finished, a great part of the people begin to rise. Hence we the more earnestly desire, while it is still in your power, that your people be accustomed to both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Question of some Ecclesiastical Rites’</cite>, (1561) in Opera, vol. 10, pt. 1, Consilia, col. 213</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

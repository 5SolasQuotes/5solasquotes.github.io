<main class="wrap"><figure class="quote" id="q-fa950a99bd" data-kw="Vernacular">
<blockquote><p>But because these original tongues are not known to all the people of God, who have a right unto, and interest in the Scriptures, and are commanded in the fear of God to read, and search them, therefore they are to be translated into the vulgar language of every nation unto which they come, that the Word of God dwelling plentifully in all, they may worship Him in an acceptable manner, and through patience and comfort of the Scriptures may have hope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 1.8</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 4, ch. 4</span></figcaption>

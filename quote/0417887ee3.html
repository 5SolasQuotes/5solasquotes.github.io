<main class="wrap"><figure class="quote" id="q-0417887ee3" data-kw="">
<blockquote><p>…portrait busts and statues. These often show the hair in great detail, including faithfully reproduced small plaits and curls, and yet they very rarely show any hairpins. One of the few statues to show a pin is a Trajanic bust with a single pin across the back of a plaited bun; another three examples also show a single pin each…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexandra-t-croom.html">Alexandra T. Croom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Hairstyles &amp; Hats’ &amp; ‘Hairnets &amp; Coverings’ in Roman Clothing &amp; Fashion Pre</cite>, (Stroud: Tempus, 2000), pp. 139-55, p. 140</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0bb30d911a" data-kw="">
<blockquote><p>Sundry religious ordinances are appointed in the New Testament: that there should be every Lord’s Day a collection for the poor: that the man being after a more excellent manner the image of God should pray bare-headed, not being ashamed to show his head, but having a kind of headship over the woman; and the woman should cover her head, when she prays… no Christian Church can consist without some external rites and ceremonies, which if they be not repugnant to the Word of God, are to be observed by us, as these ordinances of religion were by the Jews. …In these indifferent things which in their own nature are neither good, nor evil, we must not contend, breaking the peace and unity of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jones.html">William Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Philemon and Hebrews</cite>, (London, 1635), on Heb. 9:1, pp. 327-28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-f6d80689e0" data-kw="">
<blockquote><p>Uncovering of the head: Though this last be not adoration, but a national sign of reverence, and is not every where adoration; yet Abulensis says, the Jews did pray and sacrifice with covered heads: So says Virgil, and Lod. Vives: Therefore the Corinthians had this from the Grecians as a civil sign of gravity, which should not be banished from God’s worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), ch. 1, p. 144</span></figcaption>

</figure><figure class="quote" id="q-21e9bea9a2" data-kw="">
<blockquote><p>…an external ecclesiastical reformation and several canons [implemented by the apostles] concerning the reformation of external abuses and scandals in the Church: as for instance, that the churches should abstain from blood and things strangled; that two or three at most should prophesy in the Church at one meeting; that the men should pray with their heads uncovered, the women covered; that young widows should be no longer admitted to serve the Church in attending the sick [1 Tim. 5] and that such widows must be at least 60 years old, and the like.</p></blockquote>

</figure><figure class="quote" id="q-5cded7c21e" data-kw="">
<blockquote><p>Ver. 2. And keep the ordinances ] Gr. the traditions or doctrines by word of mouth. These are, 1. Dogmatic, concerning faith and practice, 2 Thess. 2:15 ; 2 Thess. 2:1-17 . Ritual; and these again are, 1. Perpetual, as that of the manner of administering the two sacraments. 2. Temporary, as that of abstaining from certain meats, Acts 15:28-29 . And those other pertaining to the observing of external order and decency in Church assemblies. And of these the apostle here speaketh. (Sclater) … Ver. 4. Dishonoureth his head] As they accounted it then and there. In other places it is otherwise. The French preach covered. The Turks neither kneel nor uncover the head at public prayer, as holding those postures unmanly. Several countries have their several customs. Basiliades, duke of Muscovy, showed himself a tyrant in nailing an ambassador’s hat to his head, for not uncovering it before him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-trapp.html">John Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, ch. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

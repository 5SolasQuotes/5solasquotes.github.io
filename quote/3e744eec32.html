<main class="wrap"><figure class="quote" id="q-3e744eec32" data-kw="">
<blockquote><p>Thus did our Lord Jesus honour and hallow the first day of the week by giving the Sanctifier and the Comforter thereon. So did he shed Him forth in his miraculous Gifts and in his saving Graces, abundantly on that day. He poured out the Blessing from on high, and blessed the Day, to be an holy Sabbath unto Himself; and unto us, the day for our “seeking and receiving spiritual blessings. Such Actions (says One) do as fully declare and express the mind and will of Heaven as any words could do — Especially if we find (as we do) in the sacred Writings, that the Apostles and primitive Christians did thenceforth observe the first day of the week for their religious Assemblies, and for the Administration of the special Ordinances of Christ thereon.

And this we do expressly read, that they did come together on the first day of the week to break bread, and that Paul preached to them. Act. 20.7. They were wont to come together to hear and to receive the Sacrament of the Lord’s Supper, on that day. It is spoken of as their usual practice, and they were “under the infallible Direction of the Holy Ghost in Actions of this nature and importance. So that their Example and practice herein must amount to a Law and Institution to the Christian Church; interpreting to us the mind and giving us the will of Christ in this matter. And to borrow the words of a late Writer,

As Moses was faithful in settling the matters of the Jewish worship and of the Tabernacle, being authorised by God and guided by him in the doing it; so the Apostles were to settle the Orders of the Gospel Church, and were faithful to Him who appointed them — Moreover you know, how that the Apostle Paul directed the Church of Corinth, and the Churches of Galatia, to have their Collections for the Saints on the first day of the week; So (says he) I have given order, and so do ye: Upon the first day of the week let every one lay by him in store, as God has prospered him. 1 Cor. 16.1, 2. — Some have observed, and the remark is of great weight,

That the first day of the week is the only day spoken of thro’ the New Testament, as a day religiously observed; but that this day is several times over so spoken of. A day sacred in the Apostles’ times for Holy fellowship and communion, for breaking of bread and for prayers, and for works of piety and charity; for the public testimony of their faith in Christ and love to all his Saints.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-colman.html">Benjamin Colman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The doctrine and law of the Holy Sabbath: in the order wherein it lies through the Scriptures of the Old and New Testament. In two sermons, preached at the lecture in Boston, October 15. and December 10. 1724</cite>, (Boston: Thomas Hancock, 1725), pp 27-30.</span></figcaption>

<blockquote><p>That it repeals the decision of the Synod of 1926 regarding choir~singing, and declare that there shall be no singing in our public services except by the congregation as a whole, on the ground: a) That there is no place for such singing according to our Reformed conception of public worship. Since God meets and fellowships with His Church in public worship, every element must be either an act of God (through the Minister) having the congregation as its object or an act of the congregation (directly or through the minister) having God as its object. Anthem-singing by a choir or a soloist is neither. It is in reality a usurpation of the privilege and duty of the whole congregation to sing praise to God; b) It conflicts with Article 69 of the Church Order which permits the singing of only a few hymns specifically mentioned; c) It conflicts with the basic principle of Article 69 of the Church Order, namely, that the Church as a whole. through the Synod, shall determine what shall be sung in our churches…. Respectfully. Your Committee. W. HEYNS. H. J. KUIPER. L. TRAP. D. ZWIER. J. V AN LONKHUYZEN W. STUART Y. P. DE JONG</p></blockquote>

<blockquote><p>There is no end of books, and yet we seem to need more every day. There was such a darkness brought in by the fall, as will not thoroughly be dispelled till we come to heaven; where the sun shineth without either cloud or night. For the present, all should contribute their help according to the rate and measure of their abilities. Some can only hold up a candle, others a torch; but all are useful.

The press is an excellent means to scatter knowledge, were it not so often abused. All complain there is enough written, and think that now there should be a stop. Indeed, it were well if in this scribbling age there were some restraint. Useless pamphlets are grown almost as great a mischief as the erroneous and profane. Yet ’tis not good to shut the door upon industry and diligence. There is yet room left to discover more, above all that hath been said, of the wisdom of God and the riches of his grace in the gospel; yea, more of the stratagems of Satan and the deceitfulness of man’s heart.

Means need to be increased every day to weaken sin and strengthen trust, and quicken us to holiness. Fundamentals are the same in all ages, but the constant necessities of the church and private Christians, will continually enforce a further explication. As the arts and slights of besieging and battering increase, so doth skill in the foundation. If we have no other benefit by the multitude of books that are written, we shall have this benefit: an opportunity to observe the various workings of the same Spirit about the same truths, and indeed the speculation is neither idle nor unfruitful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Reader in Richard Sibbes, A Learned Commentary or Exposition upon the First Chapter of the Second Epistle of S. Paul to the Corinthians</cite></span></figcaption>

</figure><figure class="quote" id="q-8c419ca35a" data-kw="">
<blockquote><p>In our days we see that because there hath been much crying out against holy days, some also will not stick to cry out against the Sabbath. Well, if a papist in all other general points of doctrine should be truly converted unto Christ, and for want of instruction doubteth of the Sabbath, we are in love to deal with him, and for a season to support his weakness. How be it we must remember that the weak must not always be born with, as appeareth by the Apostle’s words chap 15:2. Let every man please his neighbour in that, that is good to edification.

So long then as the error is of weakness, and that it is but an infirmity in the man, from which by the knowledge of the truth he would be rid and be delivered, he must be born with. But if it proceed of illusion, obstinacy, and of a prefract [sic] judgment as deceived by the devil, then he must not be borne with, no not even now a days: nay, if we be herein faulty, the error is not so tolerable in us, as it was in them, in that they wanted the old and New Testament, both which are so abundantly opened unto us. But if one truly repenting him of his sins, and faithfully believing in Christ, shall through ignorance be afraid of the Sabbath, as of a servile ceremony, he is so far to be borne with, as he desireth to come to the truth, and if he come once to be obstinate, he is no longer to be borne with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Sabbath in The Works of Richard Greenham – Volume Two</cite></span></figcaption>

— Richard Greenham, A Treatise of the Sabbath in The Works of Richard Greenham – Volume Two">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+our+days+we+see+that+because+there+hath+been+much+crying+out+against+holy+days%2C+some+also+will+not+stick+to+cry+out+against+the+Sabbath.+Well%2C+if+a+papist+in+all+other+general+points+of+doctrine+should+be+truly+converted+unto+Christ%2C+and+for+want+of+instruction+doubteth+of+the+Sabbath%2C+we+are+in+love+to+deal+with+him%2C+and+for+a+season+to+support+his+weakness.+How+be+it+we+must+remember+that+the+weak+must+not+always+be+born+with%2C+as+appeareth+by+the+Apostle%E2%80%99s+words+chap+15%3A2.+Let+every+man+please+his+neighbour+in+that%2C+that+is+good+to+edification.%0A%0ASo+long+then+as+the+error+is+of+weakness%2C+and+that+it+is+but+an+infirmity+in+the+man%2C+from+which+by+the+knowledge+of+the+truth+he+would+be+rid+and+be+delivered%2C+he+must+be+born+with.+But+if+it+proceed+of+illusion%2C+obstinacy%2C+and+of+a+prefract+%5Bsic%5D+judgment+as+deceived+by+the+devil%2C+then+he+must+not+be+borne+with%2C+no+not+even+now+a+days%3A+nay%2C+if+we+be+herein+faulty%2C+the+error+is+not+so+tolerable+in+us%2C+as+it+was+in+them%2C+in+that+they+wanted+the+old+and+New+Testament%2C+both+which+are+so+abundantly+opened+unto+us.+But+if+one+truly+repenting+him+of+his+sins%2C+and+faithfully+believing+in+Christ%2C+shall+through+ignorance+be+afraid+of+the+Sabbath%2C+as+of+a+servile+ceremony%2C+he+is+so+far+to+be+borne+with%2C+as+he+desireth+to+come+to+the+truth%2C+and+if+he+come+once+to+be+obstinate%2C+he+is+no+longer+to+be+borne+with.%E2%80%9D%0A%0A%E2%80%94+Richard+Greenham%2C+A+Treatise+of+the+Sabbath+in+The+Works+of+Richard+Greenham+%E2%80%93+Volume+Two&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8c419ca35a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8c419ca35a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/04/07

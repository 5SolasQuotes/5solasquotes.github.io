<main class="wrap"><figure class="quote" id="q-ce0092075d" data-kw="">
<blockquote><p>Objection. In the same way as Abraham was justified, so also are we justified, as children of Abraham. But Abraham was not justified by faith alone, but also by works, as the apostle James testifies (Jm. 2:21). Response. A person is said to be justified either before himself and in his conscience, or before God. Abraham was not justified before himself and in his conscience by faith alone, but also by works—I grant it. He was not justified by faith alone before God—I deny it. I explain: a godly person sometimes doubts whether he is among those who are justified; that is, he acknowledges indeed that he must be justified by true faith, but doubts whether his faith is true. This, however, he discovers and recognizes from the warmth of faith, namely charity. James does not treat of that justification which is before the tribunal of God, but of that by which we are justified in our own conscience, when our righteousness is made evident to us. Therefore, we are justified—that is, our righteousness is made manifest to us—not only by faith but also by good works, insofar as they are evidences of sincere faith; but we are not thus justified before God, who regards faith alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works… (d. 1625; Geneva: Chovet, 1658), Arguments Proposed in Disputation against the Preceding Theses, with Solutions, To Corollary V</cite>, pp. 364-65, trans. ChatGPT-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span><span class="t"><a href="../topics/judgment-and-the-final-state/the-last-judgment.html">The Last Judgment</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6a3cb9e0fc" data-kw="">
<blockquote><p>Paul and James do not contradict one another; Paul shows what is that which justifies, and James shows what kind of faith justifies, viz. a lively effectual faith. James shows that faith justifies quae viva [in the manner of it living], Paul shows that it does not justify qua viva [as it is living], which is a great difference though the Remonstrants [Arminians] scoff at such a nicety: who would give a lemmon-paring for the difference?</p></blockquote>

</figure><figure class="quote" id="q-9def8be007" data-kw="">
<blockquote><p>To be justified means more than to be declared “not guilty.” It actually means to be declared righteous before God. It means God has imputed or charged the guilt of our sin to His Son, Jesus Christ, and has imputed or credited Christ’s righteousness to us.</p></blockquote>

</figure><figure class="quote" id="q-eb39e57352" data-kw="">
<blockquote><p>But (says [John] Cameron) thus ‘to believe’ will be ‘to will’, and so faith must be confounded with love. Answer: The love of complacency is one thing, and the love of benevolence another. Love of complacency is required in faith to its object. Hence [Martin] Chemnitius on Melanchthon’s Common Places, Of Justification, p. 660, says, ‘Faith is such a knowledge in the mind to which follows assent in the will and a motion of the heart apprehending and applying to itself with desire and affiance that object which is manifested to be good, so that it rests in it.</p></blockquote>

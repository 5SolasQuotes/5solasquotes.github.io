<blockquote><p>[A]s men take knowledge of those sins which domineer most in them, so they must forsake and leave them, yea though they be as dear unto them as Shechinah’s wife was unto him. And tell me not that this is difficult, but hearken to what our Saviour Christ saith, If thy right hand offend thee cut it off, for it is better to enter maimed into heaven, then having two hands to be cast into hell fire. And what dost thou telling me that they be profitable sins? is not Godliness the best, nay the only gain? and what dost thou tell me of thy sweet sin of licentiousness? I tell thee, Momentaneum quod delectat, aeternum quod cruciat, it is a momentary pleasure, and unless thou forsake it, will bring thee into eternal torments, to the utter ruin of thy soul &amp; body.

And say not to me as Naaman to Elisha, God be merciful to me in this or that sin; for as one leak is enough to sink a ship, so one sin will damn a soul; and thou art far from mercy, if thou preferrest a profitable or pleasurable sin to thy God. I will come home to thee in a familiar resemblance; if thou shouldest harbour a Rebel in thy house, and when the King sent unto thee upon pain of death to deliver him, thou shouldest refuse to do it, couldst thou expect any favour, though he were never so near or dear unto thee? even so, thy sins be Rebels against the King of heaven, no such Rebels against his Majesty as they; if now at his command thou wilt not renounce them, and cast them from thee, how canst thou hope for mercy? there remains nothing for thee, but a fearful expectation of wrath and vengeance to light upon thee: Away then with the bond-woman and her son, away with this Jonah, for which the whole ship fares the worse: though thy sins be as dear unto thee as thy right eye, yet cast them from thee, because they displease God: do not love thy sin, and hate thy soul, if thou dost, what then wilt thou do in the end thereof?</p></blockquote>

<blockquote><p>Upon mature deliberation we did perceive that the wise and holy providence of God… has… disabled that [former] way of government and all that depends thereon, from affording any protection and preservation to any of the inhabitants of this land; and has enabled another form of government to afford it; Wherefore we did conclude from the light of nature, from the judgement of the learned, from the practice of Christians in former ages, from our own principles and from our former engagements that it was the will of God we should quietly and peaceably set ourselves in our places and callings to live under this government and to submit to it in such things as are imposed upon or required of us [such as the oath of Engagement] by the powers which are in actual possession, being things in themselves lawful and necessary, or expedient to the preservation of ourselves and others… Fourthly, because we clearly conceive that there is no difference at all between the submission which the authors of the Proposals themselves rightly acknowledge to be due to the powers which are in actual possession and that which is required by the subscription to this Engagement: for seeing the express words of the Engagement give no ground to interpret the act of subscription beyond that which is a clear and known duty: therefore we think it not (as to our consciences) warrantable to interpret it otherwise; but we rather think it contrary to a known duty to make of a thing in itself lawful and necessary at this time, any scrupulous interpretation beyond what the words import; or to suspend obedience from a duty upon the conjecture of something which may be thought undutiful, when that which is to our conscience a known duty is apparent: Upon which ground we declare that we trouble not ourselves, nor do we think it lawful to stagger others in their thoughts with the inferences which the proposers make upon the subscription of the Engagement with reference to these queries [of theirs]: As how far it does imply an approbation of the manner of the present establishment, whether as effected by a full and free authority yea or no? whether yea or no, it does imply an active concurrence and a ratifying consent of the people thereunto further than what has been already acknowledged to be due to the powers in actual possession by all that are in subjection under them and depend upon their protection? and whether yea or no, and how far it fastens an obligation to act to the strengthening and promoting of the government which is at present or may be hereafter established by the advantage of possible power? We say that to trouble our own or other men’s weaker consciences with these or such like doubtful conjectures to color the suspension of our own, or occasion the aversion of other men’s affections from yielding obedience to a clear and confessed duty, is not only preposterous and contrary to the aim of healing breaches, and of advancing a public good in this time of distraction, but inconsistent (as to our reason) with the obvious meaning of the words which are to be subscribed and disagreeing (as to our affections) with the charity due no less to superiors than to other men, which is not to think evil when good may be thought of them. And lastly, it is opposite (as to our spirits) unto that wisdom which is from above (the rule of our walking) teaching us to have pure and peaceable thoughts in all our actings, to perform duties in godly simplicity and without worldly wisdom, to be gentle and easily intreated, to do good works without partial scrupulosity and without hypocrisy. And upon these principles of true wisdom (which we humbly conceive are not laid to heart by our brethren in the third paragraph of their Proposals) we professedly wave all those scruples and the stumbling-blocks which they have laid to themselves and wherewith they have puzzled others, upon this clear account: that whenever the consideration of these things, which are said to be implied in the subscription (which we see not) shall come before us, to be circumstantially considered for the edification of others, or the clearing of our own way, we then shall be most ready to declare our sense therein, according to known principles and the circumstances, which God shall offer…</p></blockquote>

<blockquote><p>We are aware, that many are strongly prepossessed against the Reformation cause, on account of the doctrine of the Reformers, respecting the Magistrate’s authority relative to religious matters, and its application in carrying on that work; as if both that doctrine, and its application to practical purposes, were inconsistent with the freedom, spirituality, and independence of the kingdom of Christ. Our limits will not admit of our entering at large upon the subject, but it must not be entirely overlooked, since intimately connected with the defence, both of the Westminster Confession, and the conduct of our Reformers.

In entering upon the question, we would call the attention of our readers to the following preliminary remarks. First, When the compilers of the Westminster Confession speak of the authority of the Magistrate about the Church, he is not to be understood in his individual capacity, but as at the head of the administration of the nation over which he presides. The power pleaded for, is the power of the nation, as exercised by the Magistrate. Nor does the expression, “the Magistrate,” in the Confession, and the writings of divines on this subject, mean exclusively the person at the head of the executive government, such as the king, but it is a general name for all possessing civil authority, in their respective places, legislative or executive.

Secondly, The Confession assigns to the Magistrate no power over the Church, or in things sacred. The power assigned to him, is not a lordly supremacy over the Church. The Confession expressly asserts the sole headship of Christ over the Church, his spiritual kingdom: chap. 25, sect. 6, “There is no other head of the Church, but the Lord Jesus Christ.” Neither is it a ministerial authority in the Church. He must not interfere with her internal government: chap. 30, sect. 1, “The Lord Jesus, as King and Head of his Church, hath therein appointed a government in the hand of Church officers, distinct from the Civil Magistrate.” Sect. 2, “To these officers, the keys of the kingdom of heaven are committed.”

He must not, as a Magistrate, sustain himself a public judge of true or false religion, or dictate to his subjects in matters purely religious: chap. 31, sect. 3, “It belongeth to Synods, and Councils, ministerially to determine matters of faith, and cases of conscience, to set down rules for the better ordering of the public worship of God, and government of the Church,” &amp;c. “Moreover, he must not take upon himself the administration of any of her ordinances of worship.” Chap. 23, sect. 3, “The Civil Magistrate must not assume to himself the administration of the word and sacraments, or the power of the keys of the kingdom of heaven.”

Now, since the authority of the Magistrate is thus limited by the compilers of the Confession themselves, the power they assign to him cannot be a power over the Church, or in things sacred. It must therefore be, simply, a right to employ the influence of his station about the Church, for promoting her interests. But it is the duty of every man to exert the influence of his station in life for that end; and if God has made it his duty, he must also have given him a right to discharge that duty. Why then deny to civil rulers the right of casting the influence of their station into the scale of religion?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-stevenson.html">George Stevenson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plea for the Covenanted Reformation in Britain and Ireland</cite>, (3rd edn, Edinburgh: W. P. Kennedy, 1844), pp 8-10.</span></figcaption>

<blockquote><p>That it is possible that the sadness, sorrow, mid grief of those particular saints that thou hast thine eye upon may arise from the natural temper and constitution of their bodies. Many saints are often cast into a melancholy mould; for though grace changes the disposition of the soul, yet it alters not the constitution of the body.

Now there is no greater enemy to holy joy and gladness than melancholy, for this pestilent humour will raise such strange passions and imaginations, it will raise such groundless griefs, and fears, and frights, and such senseless surmises and jealousies, as will easily damp a Christian’s joy, and mightily vex, perplex, trouble, and turmoil, daunt, and discourage a Christian’s spirit.

A melancholy constitution is Satan’s anvil, upon which he forms many black, dark, and dismal temptations, which do exceedingly tend to the keeping down of divine consolation from rising high in the soul. This black, dark, dusky humour disturbs both soul and body; it tempts Satan to tempt the soul, and it unables the soul to resist the temptation; yea, it prepares the soul to hearken to the temptation, and to close and fall in with the temptation, as the experiences of all melancholy Christians can testify.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14</cite>, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 260.</span></figcaption>

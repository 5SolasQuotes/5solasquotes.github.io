<blockquote><p>56. Doubt: How should I know when to begin and conclude the Lord’s day? Resolution: It it a great question among divines: For mine own part (with submission) I think it begins at the dawning of the day, when Christ arose: I know it is said (Gen. 1) ‘The evening and the morning’ and not ‘The morning and the evening;’ nor dare I say it is an Histero proteron, for the often inculcating of it seems to point at some mystery: But this I say, that though it be granted that the natural day and particularly the Sabbath, containing four and twenty hours, had its revolution from evening to evening, yet nothing hinders why the Christian Sabbath may not be from morning to morning; for seeing the Lord’s Day is kept in memory of Christ’s resurrection, why should it not as well begin at the hour and minute, as be celebrated on the day that he rose from the dead?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/adam-martindale.html">Adam Martindale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divinity-Knots Unloosed</cite>, … (London, 1649), ch. 12, pp. 53-54 Martindale (1623-1686) was an English presbyterian minister who had taken the Solemn League &amp; Covenant.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

ank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c841efac0c" data-kw="">
<blockquote><p>Therefore we shall learn out of this Scripture what things may lawfully be done of us without the breach of the commandment of rest. First of all such bodily labors are permitted, as do immediately and directly concern the worship of God, and without the which He cannot be served of us according to his Word: For this cause it was permitted unto the priests, nay they were commanded to slay beasts, and to prepare them for sacrifices, and offer them up according to the law, about the which they took so much the more pains upon that day than upon any other [day] of the week by how much the sacrifices were increased: for besides the daily sacrifices, morning and evening, there was a special sacrifice for the Sabbath, and all this being commanded in the law, our Savior Christ says [that] they in doing of it were blameless; therefore, whereas He says that the priests in the Temple break the Sabbath, He does not mean that they did so indeed: (For He affirms that they are blameless), but speaking according to the meaning of the Pharisees, who would condemn the fact of his disciples in gathering the ears of corn to satisfy their hunger, says, if every bodily labor be a breach of the Sabbath, then the priests in the temple brake it, but they are blameless in so doing; therefore they brake it not. Thus we do grant that men may travail [put forth work] to the places of Gods worship, where the public assemblies and meetings of the Church be, because otherwise they cannot join with them in the communion of the Word, sacraments and prayer, and though they be far distant in situation of dwelling from the common place of meeting, yet it is permitted unto them to travail by land, or by water, on horseback, or on foot thereunto; nay they are commanded to do it, and they may not under the color of a long journey tarry at home idly taking their ease. For even as the slaying of beasts is merely in its own nature a worldly and bodily labor, yet the temple which was sanctified did change the nature of it, and made it holy: so to travail and to ride, or go to and fro upon the Sabbath is altogether painful, and laborsome to the body, but to take this pains, to preach or to hear the word, makes it an holy work, and is warranted by the Scripture: as in this very place [Mt. 12:1-9], we see how our Savior Christ and his disciples travail from town to town to preach the Gospel, and take such pains that they are hungry and faint in the way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath Plainly Laid forth</cite>, … (London, 1595), pt. 1, pp. 104-5</span></figcaption>

</figure><figure class="quote" id="q-eb8403ab6d" data-kw="">
<blockquote><p>Some works, albeit they be not works of piety, yet are lawful, in so far us they are necessary means of, and have a tendency unto works of piety: So were they allowed a Sabbath day’s journey to go to their solemn meetings and worship, and the pains that men take in needful apparelling and refreshing of their bodies, and going to the public places of worship are no violation of the Sabbath, if they be done with a Sabbath day’s heart.</p></blockquote>

<blockquote><p>2. Refreshments helpful to nature, so far as to refresh it, that it may have a supply of spirits to go on cheerfully in the duties of holy worship are lawful and useful. Τo macerate the body with abstinences on this day is required of none; and to turn it into a fast or to fast upon it is generally condemned by the ancients. Wherefore, to forbear provision of necessary food for families on this day is Mosaic; and the enforcement of the particular precepts about not kindling fire in our houses on this day, baking and preparing the food of it the day before, cannot be insisted on without a reintroduction of the seventh day precisely, to whose observance they were annexed, and thereby of the law and spirit of the old covenant. Provided always that these refreshments be:

1. Seasonable for the time of them, and not when public duties require our attendance on them. 2nd. Accompanied with a singular regard to the rules of temperance; as:

1. That there be no appearance of evil.

2. That nature be not charged with any kind of excess, so far as [to make one] to be hindered rather than assisted in the duties of the day.

3. That they be accompanied with gravity, and sobriety, and purity of conversation. Now, whereas these things are in the substance of them required of us in the whole course of our lives, as we intend to please God, and to come to the enjoyment of him, none ought to think an especial regard unto them on this day to be a bondage, or troublesome unto them.</p></blockquote>

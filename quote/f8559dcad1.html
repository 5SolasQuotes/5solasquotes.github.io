<blockquote><p>Our divines from Scripture make three degrees of excommunication: 1. A debarring from the Lord’s Supper, Mt. 5:24, but it is not indeed a delivering to Satan or excommunication: this is called the lesser excommunication. 2. A delivering to Satan, the greater excommunication, 1 Cor. 5:3-4, of this we speak here especially. 3. Maranatha in the Syriac, is an utter cursing till Christ’s Second Coming.</p></blockquote>

</figure><figure class="quote" id="q-8a69526e11" data-kw="">
<blockquote><p>That this covenant is not dissolved without the consent of this Church. Distinguish here direct dissolution from indirect, or that which consequently accompanies something else. The former is when someone decides to migrate elsewhere of his own accord; cessation of actual and explicit communion with and in that particular Church follows migration. Here, a free person is subject to the judgment of no Church; nor do the Bin and Luc. 12, D. 14, 14, which pertain directly to the Church. Unless someone extends ecclesiastical unity and power with the Pontificals to all secular matters, in order, as they say, to spiritual matters. … Furthermore, another departure is different from renunciation and separation or division, from exchange: just as one moves from one room to another in the same house, or from house to house in the same city. The former is directly subordinated to the judgment and authority of the Church; the latter is not at all. For he does not depart from Christ and ecclesiastical communion who migrates from one church to another. But he does depart who through migration forsakes all external communion of the Church or even passes over to sects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’, pp. 62-63 (PDF p. 67)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

20dissolved,or%20even%20passes%20over%20to%20sects&amp;text=That%20this%20covenant%20is%20not%20dissolved%20without%20the&amp;text=the%20Church%20or%20even%20passes%20over%20to%20sects" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-49bacb0323" data-kw="">
<blockquote><p>Hence, by the way, a word of that necessary and judicious question moved by Calvin, Mt. 18:18, ‘What ye bind on earth,’ etc. Since the Church tolerateth many hypocrites and absolveth and looseth many who do but counterfeit and fancy repentance, shall we say that such are loosed and pardoned in heaven? Some say [that] by ‘heaven’ here is meant the visible Church; and they distinguish between sin and scandal: and therefore that by ‘binding and loosing’, here is meant, not forgiveness or justification, or absolution from the guilt of sin in Heaven, or in the Court of God, or condemnation for that sin, but only deliverance from scandal and the removing of scandal and admitting of the man into the visible Church as a member: suppose his repentance be but hypocritical, yet when the Church proceedeth impartially according to the Rule of Christ, the sentence is ratified by God, and the man is loosed from the scandal, though not from the sin; the sin is yet bound before God, because he hath not really repented; otherwise the Church, who knows not heart-actings and who really repent, who not, though proceeding right according to the rule of Christ, should not have the promise of ratifying in Heaven what they do on earth, fulfilled to them; which cannot be said. But taking it for a good observation that Calvin hath here, that Mt. 16, Christ speaketh of binding and loosing concional, by the Word preached; but here, Mt. 18, he speaketh especially of binding and loosing juridical in the court of the Church, by excommunication or absolution from that sentence. In the former consideration the question is easy. No pastor in preaching Gospel-promises or threatnings can bind, but conditionally: If the party do not believe and repent, the man’s sin is bound in Heaven; if he do believe and repent, his sin is loosed in heaven. As to the other [Mt. 18], we find in the Word no such signification of binding and loosing in regard of scandal, but they are ever spoken of in regard of sin and the guilt thereof. And therefore: 1. Calvin saith well that the speech of Christ is directed to no other than to those who duly and sincerely do reconcile themselves with the Church; and the Lord being willing to comfort trembling consciences, is not setting down a rule for comforting of hypocrites: But by the contrary, because hypocrites s[b?]oldly provoke to the Tribunal of God, when for gross scandals they are justly cast out; our Savior saith, The sentence of excommunication is ratified in Heaven. The Scripture-rule is for such as obey, and for those who fulfill the condition, non de obliquis [not for those who are crosswise]. As to the doubt that the Church often absolves such who really repent not, how then can the hypocrite be loosed in Heaven, when the Lord knows he does but fancy repentance? Answer: Two things here are to be distinguished: 1. The Church’s proceeding in the external Court as relating to them, if they impartially, according to the rule of Christ, proceed and be not sudden in re-admitting, but see [that] the incestuous man near swallowed up (though one man’s measure of visible repentance be not the rule to all) before they confirm their love to him, and forgive him, 2 Cor. 2. Suppose his repentance be but counterfeit, or not saving and real, as was that of Ahab, yet are they to receive him, and admit him to the ordinances, and the Lord ratifies what they do in Heaven. As: 1. The Lord ratifies Philip’s baptizing of Magus; and the Lord approves the servants inviting to the marriage-supper the man that wanted the wedding-garment: for what the Lord commands, that He must approve and ratify in Heaven. 2. What in charitable judgments is praise-worthy, that God also must ratify in Heaven; yea, it is praise-worthy in the disciples, when they heard Christ say, ‘One of you twelve hath a Devil, one of you shall betray the Son of Man;’ every one suspected and feared himself; none of the eleven suspected Judas, but gave him charity. 3. Without this God should not approve the gathering of Churches, nor the casting of the draw-net in the sea, nor the sowing of seed upon all sort of grounds, the way side, the thorny, the rocky, the good ground, that the chosen, who are yet in the state of nature, may be brought in and effectually called. But in receiving in excommunicates, the Church would not be sudden. In the ancient Church, sacrificers to Idols were six years before they were received; they that defiled themselves with beasts, were debarred from the sacrament thirty years; adulterers, seven; women who made away their births, ten years; such as uncompelled denied the faith, twelve years. What other years Burchardus and Gratianus have, may be seen. Something for edification sure there was here. 2. There is another thing here, which concerneth the conscience of him who is to be received, and when the Church-Court applies the sentence to the conscience for his personal pardon, sure whatever satisfaction the people have for removing of the scandal, the sentence of absolution so relating to him, is concional, not properly juridical; and conditional, not absolute; and therefore is to be pronounced by the mouth of the Church, the Pastor, thus: ‘Be it unto thee according to thy faith and repentance;’ and except the man really repent, his sin is not loosed in Heaven. So then, the Churches loosing from the scandal is conditional, upon a seen condition of outward repentance morally sincere to the Churches apprehension, but they simply and absolutely make him a citizen of the Church and admit him to ordinances according to the command of Christ, both in private and public Church offences (If thy brother who offended, repent, forgive him), but his loosing from the sin or guilt in heaven, is ever conditional and never absolutely to be pronounced by the Pastor, the mouth of the Church, who cannot certainly know the condition. Hence: 1. The scandal is loosed in earth and heaven; the Church impartially following the rule of Christ sometime when the sin remains and is bound in heaven. 2. The Church may say the man is absolutely freed from the scandal, so as the Church sins not in receiving him in, if they follow the rule; but he sins, and the scandal is bound in coming in, if he repent not: and also as to the guilt, he is freed from the sin only conditionally, for the condition of removal of the scandal is seen, and visible: but the condition of the loosing from sin is invisible. 3. Sometime the man is both loosed from the scandal and from the sin, and every way loosed in heaven and earth, when he both really and visibly repents. 4. The Church should go as near in readmitting a fallen sinner, and loosing him on earth as they can discern the Lord’s loosing in Heaven: the Corinthians seem to exceed in this, 2 Cor. 2:7, so that contrariwise, ye ought rather to forgive him. 5. There is more of real saintship required, to receive in again one who hath been once a member and hath fallen, and was cast out, than to admit a member newly come from paganism: 1. The larger the means of salvation have been, the greater guiltiness, as the scandal of a Christian is greater than the sin and scandal of a Sodomite, Mt. 10:15; Mt. 11:22; Mt. 12:41-42. And therefore the repentance of the one must be more signal and larger than the repentance of the other. 2. There is not such a measure of marriage-love required of a virgin before she be married, as after she hath been married, and born children to the husband; nor can any say there is so much knowledge required in a new entrant that knows not the first elements of philosophy, as in one who hath studied seven years. Hence 6, it is utterly false that as visible saintship and real repentance, as far as can be, is required of one excommunicate, before he can be received in again; so real visible saintship, as far as can be seen, must be required in members before they be first admitted. But I desire our [congregationalist] Brethren, if they judge the first receiving into the Church a loosing from sin and scandal, as readmission is, they will teach it me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … wherein the way of the Churches of New England is now Re-examined (London, 1658), Book 1, ch. 14, pp. 148-51</span></figcaption>

— Samuel Rutherford, A Survey of the Survey of that Sum of Church-Discipline penned by Mr. Thomas Hooker… wherein the way of the Churches of New England is now Re-examined (London, 1658), Book 1, ch. 14, pp. 148-51">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence%2C+by+the+way%2C+a+word+of+that+necessary+and+judicious+question+moved+by+Calvin%2C+Mt.+18%3A18%2C+%E2%80%98What+ye+bind+on+earth%2C%E2%80%99+etc.+Since+the+Church+tolerateth+many+hypocrites+and+absolveth+and+looseth+many+who+do+but+counterfeit+and+fancy+repentance%2C+shall+we+say+that+such+are+loosed+and+pardoned+in+heaven%3F+Some+say+%5Bthat%5D+by+%E2%80%98heaven%E2%80%99+here+is+meant+the+visible+Church%3B+and+they+distinguish+between+sin+and+scandal%3A+and+therefore+that+by+%E2%80%98binding+and+loosing%E2%80%99%2C+here+is+meant%2C+not+forgiveness+or+justification%2C+or+absolution+from+the+guilt+of+sin+in+Heaven%2C+or+in+the+Court+of+God%2C+or+condemnation+for+that+sin%2C+but+only+deliverance+from+scandal+and+the+removing+of+scandal+and+admitting+of+the+man+into+the+visible+Church+as+a+member%3A+suppose+his+repentance+be+but+hypocritical%2C+yet+when+the+Church+proceedeth+impartially+according+to+the+Rule+of+Christ%2C+the+sentence+is+ratified+by+God%2C+and+the+man+is+loosed+from+the+scandal%2C+though+not+from+the+sin%3B+the+sin+is+yet+bound+before+God%2C+because+he+hath+not+really+repented%3B+otherwise+the+Church%2C+who+knows+not+heart-actings+and+who+really+repent%2C+who+not%2C+though+proceeding+right+according+to+the+rule+of+Christ%2C+should+not+have+the+promise+of+ratifying+in+Heaven+what+they+do+on+earth%2C+fulfilled+to+them%3B+which+cannot+be+said.+But+taking+it+for+a+good+observation+that+Calvin+hath+here%2C+that+Mt.+16%2C+Christ+speaketh+of+binding+and+loosing+concional%2C+by+the+Word+preached%3B+but+here%2C+Mt.+18%2C+he+speaketh+especially+of+binding+and+loosing+juridical+in+the+court+of+the+Church%2C+by+excommunication+or+absolution+from+that+sentence.+In+the+former+consideration+the+question+is+easy.+No+pastor+in+preaching+Gospel-promises+or+threatnings+can+bind%2C+but+conditionally%3A+If+the+party+do+not+believe+and+repent%2C+the+man%E2%80%99s+sin+is+bound+in+Heaven%3B+if+he+do+believe+and+repent%2C+his+sin+is+loosed+in+heaven.+As+to+the+other+%5BMt.+18%5D%2C+we+find+in+the+Word+no+such+signification+of+binding+and+loosing+in+regard+of+scandal%2C+but+they+are+ever+spoken+of+in+regard+of+sin+and+the+guilt+thereof.+And+therefore%3A+1.+Calvin+saith+well+that+the+speech+of+Christ+is+directed+to+no+other+than+to+those+who+duly+and+sincerely+do+reconcile+themselves+with+the+Church%3B+and+the+Lord+being+willing+to+comfort+trembling+consciences%2C+is+not+setting+down+a+rule+for+comforting+of+hypocrites%3A+But+by+the+contrary%2C+because+hypocrites+s%5Bb%3F%5Doldly+provoke+to+the+Tribunal+of+God%2C+when+for+gross+scandals+they+are+justly+cast+out%3B+our+Savior+saith%2C+The+sentence+of+excommunication+is+ratified+in+Heaven.+The+Scripture-rule+is+for+such+as+obey%2C+and+for+those+who+fulfill+the+condition%2C+non+de+obliquis+%5Bnot+for+those+who+are+crosswise%5D.+As+to+the+doubt+that+the+Church+often+absolves+such+who+really+repent+not%2C+how+then+can+the+hypocrite+be+loosed+in+Heaven%2C+when+the+Lord+knows+he+does+but+fancy+repentance%3F+Answer%3A+Two+things+here+are+to+be+distinguished%3A+1.+The+Church%E2%80%99s+proceeding+in+the+external+Court+as+relating+to+them%2C+if+they+impartially%2C+according+to+the+rule+of+Christ%2C+proceed+and+be+not+sudden+in+re-admitting%2C+but+see+%5Bthat%5D+the+incestuous+man+near+swallowed+up+%28though+one+man%E2%80%99s+measure+of+visible+repentance+be+not+the+rule+to+all%29+before+they+confirm+their+love+to+him%2C+and+forgive+him%2C+2+Cor.+2.+Suppose+his+repentance+be+but+counterfeit%2C+or+not+saving+and+real%2C+as+was+that+of+Ahab%2C+yet+are+they+to+receive+him%2C+and+admit+him+to+the+ordinances%2C+and+the+Lord+ratifies+what+they+do+in+Heaven.+As%3A+1.+The+Lord+ratifies+Philip%E2%80%99s+baptizing+of+Magus%3B+and+the+Lord+approves+the+servants+inviting+to+the+marriage-supper+the+man+that+wanted+the+wedding-garment%3A+for+what+the+Lord+commands%2C+that+He+must+approve+and+ratify+in+Heaven.+2.+What+in+charitable+judgments+is+praise-worthy%2C+that+God+also+must+ratify+in+Heaven%3B+yea%2C+it+is+praise-worthy+in+the+disciples%2C+when+they+heard+Christ+say%2C+%E2%80%98One+of+you+twelve+hath+a+Devil%2C+one+of+you+shall+betray+the+Son+of+Man%3B%E2%80%99+every+one+suspected+and+feared+himself%3B+none+of+the+eleven+suspected+Judas%2C+but+gave+him+charity.+3.+Without+this+God+should+not+approve+the+gathering+of+Churches%2C+nor+the+casting+of+the+draw-net+in+the+sea%2C+nor+the+sowing+of+seed+upon+all+sort+of+grounds%2C+the+way+side%2C+the+thorny%2C+the+rocky%2C+the+good+ground%2C+that+the+chosen%2C+who+are+yet+in+the+state+of+nature%2C+may+be+brought+in+and+effectually+called.+But+in+receiving+in+excommunicates%2C+the+Church+would+not+be+sudden.+In+the+ancient+Church%2C+sacrificers+to+Idols+were+six+years+before+they+were+received%3B+they+that+defiled+themselves+with+beasts%2C+were+debarred+from+the+sacrament+thirty+years%3B+adulterers%2C+seven%3B+women+who+made+away+their+births%2C+ten+years%3B+such+as+uncompelled+denied+the+faith%2C+twelve+years.+What+other+years+Burchardus+and+Gratianus+have%2C+may+be+seen.+Something+for+edification+sure+there+was+here.+2.+There+is+another+thing+here%2C+which+concerneth+the+conscience+of+him+who+is+to+be+received%2C+and+when+the+Church-Court+applies+the+sentence+to+the+conscience+for+his+personal+pardon%2C+sure+whatever+satisfaction+the+people+have+for+removing+of+the+scandal%2C+the+sentence+of+absolution+so+relating+to+him%2C+is+concional%2C+not+properly+juridical%3B+and+conditional%2C+not+absolute%3B+and+therefore+is+to+be+pronounced+by+the+mouth+of+the+Church%2C+the+Pastor%2C+thus%3A+%E2%80%98Be+it+unto+thee+according+to+thy+faith+and+repentance%3B%E2%80%99+and+except+the+man+really+repent%2C+his+sin+is+not+loosed+in+Heaven.+So+then%2C+the+Churches+loosing+from+the+scandal+is+conditional%2C+upon+a+seen+condition+of+outward+repentance+morally+sincere+to+the+Churches+apprehension%2C+but+they+simply+and+absolutely+make+him+a+citizen+of+the+Church+and+admit+him+to+ordinances+according+to+the+command+of+Christ%2C+both+in+private+and+public+Church+offences+%28If+thy+brother+who+offended%2C+repent%2C+forgive+him%29%2C+but+his+loosing+from+the+sin+or+guilt+in+heaven%2C+is+ever+conditional+and+never+absolutely+to+be+pronounced+by+the+Pastor%2C+the+mouth+of+the+Church%2C+who+cannot+certainly+know+the+condition.+Hence%3A+1.+The+scandal+is+loosed+in+earth+and+heaven%3B+the+Church+impartially+following+the+rule+of+Christ+sometime+when+the+sin+remains+and+is+bound+in+heaven.+2.+The+Church+may+say+the+man+is+absolutely+freed+from+the+scandal%2C+so+as+the+Church+sins+not+in+receiving+him+in%2C+if+they+follow+the+rule%3B+but+he+sins%2C+and+the+scandal+is+bound+in+coming+in%2C+if+he+repent+not%3A+and+also+as+to+the+guilt%2C+he+is+freed+from+the+sin+only+conditionally%2C+for+the+condition+of+removal+of+the+scandal+is+seen%2C+and+visible%3A+but+the+condition+of+the+loosing+from+sin+is+invisible.+3.+Sometime+the+man+is+both+loosed+from+the+scandal+and+from+the+sin%2C+and+every+way+loosed+in+heaven+and+earth%2C+when+he+both+really+and+visibly+repents.+4.+The+Church+should+go+as+near+in+readmitting+a+fallen+sinner%2C+and+loosing+him+on+earth+as+they+can+discern+the+Lord%E2%80%99s+loosing+in+Heaven%3A+the+Corinthians+seem+to+exceed+in+this%2C+2+Cor.+2%3A7%2C+so+that+contrariwise%2C+ye+ought+rather+to+forgive+him.+5.+There+is+more+of+real+saintship+required%2C+to+receive+in+again+one+who+hath+been+once+a+member+and+hath+fallen%2C+and+was+cast+out%2C+than+to+admit+a+member+newly+come+from+paganism%3A+1.+The+larger+the+means+of+salvation+have+been%2C+the+greater+guiltiness%2C+as+the+scandal+of+a+Christian+is+greater+than+the+sin+and+scandal+of+a+Sodomite%2C+Mt.+10%3A15%3B+Mt.+11%3A22%3B+Mt.+12%3A41-42.+And+therefore+the+repentance+of+the+one+must+be+more+signal+and+larger+than+the+repentance+of+the+other.+2.+There+is+not+such+a+measure+of+marriage-love+required+of+a+virgin+before+she+be+married%2C+as+after+she+hath+been+married%2C+and+born+children+to+the+husband%3B+nor+can+any+say+there+is+so+much+knowledge+required+in+a+new+entrant+that+knows+not+the+first+elements+of+philosophy%2C+as+in+one+who+hath+studied+seven+years.+Hence+6%2C+it+is+utterly+false+that+as+visible+saintship+and+real+repentance%2C+as+far+as+can+be%2C+is+required+of+one+excommunicate%2C+before+he+can+be+received+in+again%3B+so+real+visible+saintship%2C+as+far+as+can+be+seen%2C+must+be+required+in+members+before+they+be+first+admitted.+But+I+desire+our+%5Bcongregationalist%5D+Brethren%2C+if+they+judge+the+first+receiving+into+the+Church+a+loosing+from+sin+and+scandal%2C+as+readmission+is%2C+they+will+teach+it+me.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Survey+of+that+Sum+of+Church-Discipline+penned+by+Mr.+Thomas+Hooker%E2%80%A6+wherein+the+way+of+the+Churches+of+New+England+is+now+Re-examined+%28London%2C+1658%29%2C+Book+1%2C+ch.+14%2C+pp.+148-51&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F49bacb0323.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/49bacb0323.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-excommunication/#:~:text=Hence%2C%20by%20the%20way%2C%20a%20word,is%2C%20they%20will%20teach%20it%20me&amp;text=Hence%2C%20by%20the%20way%2C%20a%20word%20of%20that&amp;text=as%20readmission%20is%2C%20they%20will%20teach%20it%20me" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2nd Conclusion: Excommunicated persons though they be debarred from the Lord’s Supper and delivered to Satan, and [are] to be accompted [accounted] as heathen and publicans, yet are they not altogether and every way cut off from the visible Church. 2 Thess. 3:14, ‘If any obey not our word by letter, mark such an one, [in Greek,] with the note of excommunication (says Beza), and have no fellowship with him that he may be ashamed; that is, as Calvin well expounds, exclude him out of the company of the faithful and excommunicate him. So also Bullinger, Marlorat and Jodocus Vullichius; v. 15, ‘Yet accompt him not as an enemy, but admonish him as a brother.’ I know Mr. [John] Robinson [a New England, Independent, separatist] denies this place to be understood of any excommunicated person, but he wills the Thessalonians not to countenance, but to show their dislike of idle persons; and his reasons are: 1. Because if Christ bids accompt the excommunicated person as an heathen and a publican, would Paul thereafter accompt him as a brother? 2. Idolaters and heretics are to be excommunicated, and will you have such a brotherhood, as [a] brother-idolater? But I answer: 1. We read not in the New Testament where Christ or his apostles bid break off Christian fellowship with any, but there is excommunication signified. If these words [in Greek], ‘have no fellowship with him, that he may be ashamed,’ signify not to forbear fellowship with him as a cast-out person, but only to show their dislike of the sin, that he may see it and be ashamed, as Robinson says, there is no more punishment to be inflicted on a contumacious person who will not obey the apostle’s words than is inflicted for any sin to which contumacy is not added; for we are to show our dislike of any sin, even the seen infirmities of our brethren. For Augustine says, peccatum tuum est, quic quid tibi non displicet, ‘every sin in another is thine, against which thou showest not thy dislike.’ 2. The Law of nature does enforce (Lev. 19:17) that we should generally rebuke our brethren, and so show our dislike for any sin. 3. ‘Be not mixed in fellowship with such a man,’ is a public abstinence from communion with him, else it does not shame him. For every shown dislike, or not-communion with another in his sin, is not that which will put public shame on him that he may repent, as is intimated here. 2. Christ bids not accompt him a publican, but [in Greek] is a note of similitude. Simile qua simile non est idem. ‘Every thing like is not the same.’ So that he may well be accompted as an heathen, not being altogether an heathen, and yet a brother, whose salvation and gaining you must intend. Nor is it altogether against the comparison of Christ and that gentle waiting on perverse idolaters and excommunicate[d] persons to admonish them as brethren. Seeing it becomes us to be merciful as our heavenly Father is, 2 Tim. 2:24-25; Mt. 5:45. And we must forgive our offending brethren seventy seven times, Mt. 18:22. And therefore though he were twice excommunicated, he is to be dealt with as a brother. And an idolatrous brother is no worse than a Samaritan neighbor or friend. 2. If excommunication be a medicine of the Church toward a sick son, the end whereof is salvation, ‘that the spirit may be saved in the Lord’s Day,’ 1 Cor. 5:5, ‘that he may learn not to blaspheme,’ 1 Tim. 1:12. ‘That be may be gained,’ Mt. 18:15. Therefore, he is not altogether cut off from the Church; for delivering to Satan is medicinal, not vindictive, as the great excommunication is which is called Anathema Maranatha, which we cannot use but against such as have sinned the sin against the Holy Ghost, and is hardly discerned; and I would think, such an one as Julian the Apostate should be debarred from the communion of the Word preached. But these who are ordinarily excommunicated for contumacy and particular faults, and not for universal apostasy, are not altogether excluded from all brotherhood of the Church. 3. If the excommunicate[d] person be excluded from all privileges of Church-fellowship, then also is he excluded from hearing the Word as a sick patient under Church-medicine [and yet greater-excommunicated persons were allowed the hearing of the preached Word in the Church of Scotland]; for it is a pastoral, and so to our [Independent] Brethren a Church-act, that the Shepherd strengthen the diseased, heal that which is sick, bind up that which is broken, bring again that which is driven away, seek that which is lost, Eze. 34. 4. And [it is a pastoral act to] feed the flock with knowledge, as a pastor according to God’s heart and a bishop, Jer. 3:15; Acts 20:28; 1 Pet. 5:2; Jer. 23:1-4; Jer. 50:7; Isa. 56:10; Zech. 11:9-12. It is a pastoral act to preach with all authority, reprove, rebuke, exhort with all long suffering and doctrine, 2 Tim. 4:2. 5. He should as a pastor teach sound doctrine, exhort, convince the gainsayers, and silence heretics, Tit. 1:9. But seeing the excommunicated person is not excluded from hearing the Word, and the pastor has a pastoral care of his soul and is to intend that his spirit may be saved in the day of the Lord, 1 Cor. 5:5, he cannot be utterly cut off from all Church-fellowship. Also this [Independent] Author says that Church-members are to be admonished, and if we do it not, we hate them in our heart, Lev. 19:17; and if we warn not an Achan, his sin is the sin of all Israel. Now if an excommunicated brother remain one whom we are to gain, and whose salvation we are to intend, if he be an ordinary co-worshipper in hearing, the object of pastoral and brotherly teaching and admonishing, he cannot be wholly excluded from all Church-fellowship. And this also proves that these be members of the visible Church in some degree of Church-worship who yet are debarred from the seal of the Covenant. And it cannot be said that the excommunicated person ought not to rebuke his brother and not hate him in his heart, as Lev. 19:17. Penal excommunication looses not from the Law of nature. But our [Independent] brethren make rebuking and mutual exhorting one of another Church duties of watchfulness; then is the excommunicated in some degree of Church-membership. Nor can our brethren here reply with good reason: Indians and Turks may hear the Word as well as the excommunicated person; and therefore hearing of the word is no note of Church communion. I answer: [1.] The Turk and Indian must hear the Word, but at the by, and not professedly; but the excommunicated person by the tie of his Covenant made in baptism, and that relation he has to the Church under whose cure he is for the saving of his spirit, and to that Gospel which he professes, is obliged to the Church-communion of public-hearing [of] the Word; yea, and according to his oath given, to be subject to the ministry of such a man whom he chose for his pastor, to give obedience to him in the Lord, however in that one particular for which he is cast out he has failed against all the foresaid obligations. 2. The Church, as a visible Church, exercises no medicinal acts upon Turks or heathen persons, and does not repute them as heathen, but does repute them to be heathen. Nor have the pastors any pastoral charge of Turks and heathens except [that] they would desire to be baptized and profess the faith. But the Church as the Church exercises medicinal acts of shunning Christian fellowship with the excommunicated, and that with a continuated intention even when he is excommunicated, that his spirit may be saved in the day of God; and the pastor has a pastoral, and so a ministerial care and obligation of pastoral teaching, admonishing and persuading him to return to God. 4. Neither do we mean with Suarez and other schoolmen that excommunication does not so cut off a member as it removes not that baptismal character, or that passive power to receive the sacraments, or that the prayers of the Church are not offered of direct intention for the inwardly humbled and repenting excommunicated person while the sentence of absolution be pronounced by the Church, as Soto, Adrianus and Alanus think, because, forsooth, Innocentius III says [that] the excommunicated person, though repenting and doing what he can to be reconciled to the Church, yet without absolution from the censure, he is mortuus ecclesiastice, ‘dead ecclesiastically’, and so in Heaven also. Though Navar, Turrecremata, Richard [and] Anton. think the penitent, excommunicated person is included in the general desires of the Church in their prayers because it is not the intention of the Church to exclude a true and living member of Christ’s body from a communion-spiritual with Christ. But our meaning is that the excommunicated person is deprived of actual fellowship with Christ in the seals of the Covenant, as the Council of Arausican, A gremio sanctae matris Ecclesiae et consortio totius Christianitatis eliminamus. His sin is bound in Heaven, yet so as the salvation of his spirit is intended by the Church; see for this Augustine. We understand not a baptismal character, except regeneration and remission of sins, which cannot be taken away by excommunication, and therefore a moral claim to the holy things of God, and that for that time and state is rather removed, than any internal right to Christ. Therefore some say, in this he loses rather possessionem quam jus, ‘possession than right’. As a nobleman, for some offence, of three dwelling houses that he has, is confined to one of the three, so as he may not remove from that one; yet does he not lose right to the other two. … 5. All our divines, standing for the certainty of the perseverance of the regenerated, answer Papists and Arminians alleging for the apostasy of the saints, the example of the regenerated who may be excommunicated, that excommunication does never evince [prove] that the person excommunicated is out of the state of grace, but only that he has fallen into a scandalous external fact, which deserves that he should be delivered to Satan; and that one may be a member of the visible Church and converted to God, who is excommunicated. Lastly… But the believer is edified thereby [by excommunication], for he is delivered to Satan for the destruction of the flesh, that the spirit may be saved in the day of the Lord… It were an inconvenience [contradiction] to deliver a [true] member of Christ to Satan morally, as 1 Cor. 6:15. This is [would be] a sinful deliverance, when one is given over to Satan, that Satan may work in him as in his work-house and as in a child of disobedience, Eph. 2:2; a converted soul cannot thus be delivered to Satan; and this [former conception] we abhor to write no less than Robinson [who had opposed it as an objection]. But to deliver to Satan penally, as to a penal torturer who works sorrow and fear in the conscience for sin, to humble the offender, and to save his spirit in the day of Christ, is neither horror by word nor by writ, but [rather it is] the Word of God, 1 Cor. 5:5. … …and Field, ‘Excommunication does not wholly’ (saith he) ‘cut off men from the visible Church;’ and his reason is good, because they may and often do retain, first, the profession of pure truth; secondly, the character of baptism; thirdly, they profess obedience to their pastors; fourthly, they will not join to any other communion. And therefore to say with our [Independent] Author, we dare not, to wit: ‘That though the seed of faith may remain in the excommunicated person; yet to the society of the faithful joined in a particular visible Church, they are not knit, but wholly cut off from their communion. Also, he is delivered unto Satan, and therefore wholly cut off from the communion of the Church; and so from the seals, he and his seed, as heathen and heathen’s seed are.’ …So we are to condemn these who are more rigorous toward such as are excommunicated than Christ is: for Christ keeps them as sick children within his visible Church and uses Satan as the physician’s servant, who [the physician] boils herbs and dresses drugs for them, while he [the servant], by God’s permission, torments his spirit with the conscience of sin. As when a child is sick (says worthy Cartwright) the father calls a college of physicians to consult about medicine to be given to the child. So is the contumacious person under the medicine of excommunication administered by the Church-presbytery. Now this we cannot say of heathen and publicans. And therefore Augustine says excellently, excommunicated persons non esse ethnicos, sed tanquam ethnicos; ‘are not heathen, but esteemed as heathen,’ (ch. 6) and Chrysostom says the same in sense. Yea, I gather this necessary distinction out of the Fathers, as Chrysostom, Theophylactus, Hilarius, that they are not members of the visible Church actu pleno, in a full act, because they want external communion with the Church, yet actu imperfecto, imperfectly they are members. A second distinction I collect from Ireneus, Gregorius, Hieronim., Optatus, Augustine, that they are exclusi ab ecclesia quoad communionem, non ab ecclesia ipsa. ‘They are excluded from the visible communion of the Church, rather than from the Church.’ A third distinction may be drawn from Eugenius, Chrysostom, Gregory Nazianzen, while they call baptism, januam spiritualem, and lavacrum animae, the door of our entry to the Church (for which cause papists, though fondly, place their font at the Church-door) as the lavator of the soul. So as excommunicated persons are within the door of the visible Church, though not admitted to the King’s table. 4. The schoolmen do allow to the excommunicated persons, jus, non consortium; ‘[a] right, but not fellowship.’ 5. Turrecremaeta, Vega., Soto, Canus, insinuat distinctionem inter partes et membra Ecclesiae visibilis, because of some external communion that they have, as teeth are parts of the body in a new born infant, but they are not members; but they deny them to be members because they are cut off. 6. Suarez excellently, privantur quoad communicationemcum aliis membris, non quoad esse membri. ‘They are deprived according to the act of communion with other members, not as if they ceased to be members;’ as a member which cannot receive nourishment is yet still a member. Our divines from Scripture make three degrees of excommunication: 1. A debarring from the Lord’s Supper, Mt. 5:24, but it is not indeed a delivering to Satan or excommunication: this is called the lesser excommunication. 2. A delivering to Satan, the greater excommunication, 1 Cor. 5:3-4, of this we speak here especially. 3. Maranatha in the Syriac an is utter cursing till Christ’s second coming.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2nd Conclusion: Excommunicated persons though they be debarred from the Lord’s Supper and delivered to Satan, and [are] to be accompted [accounted] as heathen and publicans, yet are they not altogether and every way cut off from the visible Church. 2 Thess. 3:14, ‘If any obey not our word by letter, mark such an one, [in Greek,] with the note of excommunication (says Beza), and have no fellowship with him that he may be ashamed; that is, as Calvin well expounds, exclude him out of the company of the faithful and excommunicate him. So also Bullinger, Marlorat and Jodocus Vullichius; v. 15, ‘Yet accompt him not as an enemy, but admonish him as a brother.’ I know Mr. [John] Robinson [a New England, Independent, separatist] denies this place to be understood of any excommunicated person, but he wills the Thessalonians not to countenance, but to show their dislike of idle persons; and his reasons are: 1. Because if Christ bids accompt the excommunicated person as an heathen and a publican, would Paul thereafter accompt him as a brother? 2. Idolaters and heretics are to be excommunicated, and will you have such a brotherhood, as [a] brother-idolater? But I answer: 1. We read not in the New Testament where Christ or his apostles bid break off Christian fellowship with any, but there is excommunication signified. If these words [in Greek], ‘have no fellowship with him, that he may be ashamed,’ signify not to forbear fellowship with him as a cast-out person, but only to show their dislike of the sin, that he may see it and be ashamed, as Robinson says, there is no more punishment to be inflicted on a contumacious person who will not obey the apostle’s words than is inflicted for any sin to which contumacy is not added; for we are to show our dislike of any sin, even the seen infirmities of our brethren. For Augustine says, peccatum tuum est, quic quid tibi non displicet, ‘every sin in another is thine, against which thou showest not thy dislike.’ 2. The Law of nature does enforce (Lev. 19:17) that we should generally rebuke our brethren, and so show our dislike for any sin. 3. ‘Be not mixed in fellowship with such a man,’ is a public abstinence from communion with him, else it does not shame him. For every shown dislike, or not-communion with another in his sin, is not that which will put public shame on him that he may repent, as is intimated here. 2. Christ bids not accompt him a publican, but [in Greek] is a note of similitude. Simile qua simile non est idem. ‘Every thing like is not the same.’ So that he may well be accompted as an heathen, not being altogether an heathen, and yet a brother, whose salvation and gaining you must intend. Nor is it altogether against the comparison of Christ and that gentle waiting on perverse idolaters and excommunicate[d] persons to admonish them as brethren. Seeing it becomes us to be merciful as our heavenly Father is, 2 Tim. 2:24-25; Mt. 5:45. And we must forgive our offending brethren seventy seven times, Mt. 18:22. And therefore though he were twice excommunicated, he is to be dealt with as a brother. And an idolatrous brother is no worse than a Samaritan neighbor or friend. 2. If excommunication be a medicine of the Church toward a sick son, the end whereof is salvation, ‘that the spirit may be saved in the Lord’s Day,’ 1 Cor. 5:5, ‘that he may learn not to blaspheme,’ 1 Tim. 1:12. ‘That be may be gained,’ Mt. 18:15. Therefore, he is not altogether cut off from the Church; for delivering to Satan is medicinal, not vindictive, as the great excommunication is which is called Anathema Maranatha, which we cannot use but against such as have sinned the sin against the Holy Ghost, and is hardly discerned; and I would think, such an one as Julian the Apostate should be debarred from the communion of the Word preached. But these who are ordinarily excommunicated for contumacy and particular faults, and not for universal apostasy, are not altogether excluded from all brotherhood of the Church. 3. If the excommunicate[d] person be excluded from all privileges of Church-fellowship, then also is he excluded from hearing the Word as a sick patient under Church-medicine [and yet greater-excommunicated persons were allowed the hearing of the preached Word in the Church of Scotland]; for it is a pastoral, and so to our [Independent] Brethren a Church-act, that the Shepherd strengthen the diseased, heal that which is sick, bind up that which is broken, bring again that which is driven away, seek that which is lost, Eze. 34. 4. And [it is a pastoral act to] feed the flock with knowledge, as a pastor according to God’s heart and a bishop, Jer. 3:15; Acts 20:28; 1 Pet. 5:2; Jer. 23:1-4; Jer. 50:7; Isa. 56:10; Zech. 11:9-12. It is a pastoral act to preach with all authority, reprove, rebuke, exhort with all long suffering and doctrine, 2 Tim. 4:2. 5. He should as a pastor teach sound doctrine, exhort, convince the gainsayers, and silence heretics, Tit. 1:9. But seeing the excommunicated person is not excluded from hearing the Word, and the pastor has a pastoral care of his soul and is to intend that his spirit may be saved in the day of the Lord, 1 Cor. 5:5, he cannot be utterly cut off from all Church-fellowship. Also this [Independent] Author says that Church-members are to be admonished, and if we do it not, we hate them in our heart, Lev. 19:17; and if we warn not an Achan, his sin is the sin of all Israel. Now if an excommunicated brother remain one whom we are to gain, and whose salvation we are to intend, if he be an ordinary co-worshipper in hearing, the object of pastoral and brotherly teaching and admonishing, he cannot be wholly excluded from all Church-fellowship. And this also proves that these be members of the visible Church in some degree of Church-worship who yet are debarred from the seal of the Covenant. And it cannot be said that the excommunicated person ought not to rebuke his brother and not hate him in his heart, as Lev. 19:17. Penal excommunication looses not from the Law of nature. But our [Independent] brethren make rebuking and mutual exhorting one of another Church duties of watchfulness; then is the excommunicated in some degree of Church-membership. Nor can our brethren here reply with good reason: Indians and Turks may hear the Word as well as the excommunicated person; and therefore hearing of the word is no note of Church communion. I answer: [1.] The Turk and Indian must hear the Word, but at the by, and not professedly; but the excommunicated person by the tie of his Covenant made in baptism, and that relation he has to the Church under whose cure he is for the saving of his spirit, and to that Gospel which he professes, is obliged to the Church-communion of public-hearing [of] the Word; yea, and according to his oath given, to be subject to the ministry of such a man whom he chose for his pastor, to give obedience to him in the Lord, however in that one particular for which he is cast out he has failed against all the foresaid obligations. 2. The Church, as a visible Church, exercises no medicinal acts upon Turks or heathen persons, and does not repute them as heathen, but does repute them to be heathen. Nor have the pastors any pastoral charge of Turks and heathens except [that] they would desire to be baptized and profess the faith. But the Church as the Church exercises medicinal acts of shunning Christian fellowship with the excommunicated, and that with a continuated intention even when he is excommunicated, that his spirit may be saved in the day of God; and the pastor has a pastoral, and so a ministerial care and obligation of pastoral teaching, admonishing and persuading him to return to God. 4. Neither do we mean with Suarez and other schoolmen that excommunication does not so cut off a member as it removes not that baptismal character, or that passive power to receive the sacraments, or that the prayers of the Church are not offered of 0%99s+words+than+is+inflicted+for+any+sin+to+which+contumacy+is+not+added%3B+for+we+are+to+show+our+dislike+of+any+sin%2C+even+the+seen+infirmities+of+our+brethren.+For+Augustine+says%2C+peccatum+tuum+est%2C+quic+quid+tibi+non+displicet%2C+%E2%80%98every+sin+in+another+is+thine%2C+against+which+thou+showest+not+thy+dislike.%E2%80%99+2.+The+Law+of+nature+does+enforce+%28Lev.+19%3A17%29+that+we+should+generally+rebuke+our+brethren%2C+and+so+show+our+dislike+for+any+sin.+3.+%E2%80%98Be+not+mixed+in+fellowship+with+such+a+man%2C%E2%80%99+is+a+public+abstinence+from+communion+with+him%2C+else+it+does+not+shame+him.+For+every+shown+dislike%2C+or+not-communion+with+another+in+his+sin%2C+is+not+that+which+will+put+public+shame+on+him+that+he+may+repent%2C+as+is+intimated+here.+2.+Christ+bids+not+accompt+him+a+publican%2C+but+%5Bin+Greek%5D+is+a+note+of+similitude.+Simile+qua+simile+non+est+idem.+%E2%80%98Every+thing+like+is+not+the+same.%E2%80%99+So+that+he+may+well+be+accompted+as+an+heathen%2C+not+being+altogether+an+heathen%2C+and+yet+a+brother%2C+whose+salvation+and+gaining+you+must+intend.+Nor+is+it+altogether+against+the+comparison+of+Christ+and+that+gentle+waiting+on+perverse+idolaters+and+excommunicate%5Bd%5D+persons+to+admonish+them+as+brethren.+Seeing+it+becomes+us+to+be+merciful+as+our+heavenly+Father+is%2C+2+Tim.+2%3A24-25%3B+Mt.+5%3A45.+And+we+must+forgive+our+offending+brethren+seventy+seven+times%2C+Mt.+18%3A22.+And+therefore+though+he+were+twice+excommunicated%2C+he+is+to+be+dealt+with+as+a+brother.+And+an+idolatrous+brother+is+no+worse+than+a+Samaritan+neighbor+or+friend.+2.+If+excommunication+be+a+medicine+of+the+Church+toward+a+sick+son%2C+the+end+whereof+is+salvation%2C+%E2%80%98that+the+spirit+may+be+saved+in+the+Lord%E2%80%99s+Day%2C%E2%80%99+1+Cor.+5%3A5%2C+%E2%80%98that+he+may+learn+not+to+blaspheme%2C%E2%80%99+1+Tim.+1%3A12.+%E2%80%98That+be+may+be+gained%2C%E2%80%99+Mt.+18%3A15.+Therefore%2C+he+is+not+altogether+cut+off+from+the+Church%3B+for+delivering+to+Satan+is+medicinal%2C+not+vindictive%2C+as+the+great+excommunication+is+which+is+called+Anathema+Maranatha%2C+which+we+cannot+use+but+against+such+as+have+sinned+the+sin+against+the+Holy+Ghost%2C+and+is+hardly+discerned%3B+and+I+would+think%2C+such+an+one+as+Julian+the+Apostate+should+be+debarred+from+the+communion+of+the+Word+preached.+But+these+who+are+ordinarily+excommunicated+for+contumacy+and+particular+faults%2C+and+not+for+universal+apostasy%2C+are+not+altogether+excluded+from+all+brotherhood+of+the+Church.+3.+If+the+excommunicate%5Bd%5D+person+be+excluded+from+all+privileges+of+Church-fellowship%2C+then+also+is+he+excluded+from+hearing+the+Word+as+a+sick+patient+under+Church-medicine+%5Band+yet+greater-excommunicated+persons+were+allowed+the+hearing+of+the+preached+Word+in+the+Church+of+Scotland%5D%3B+for+it+is+a+pastoral%2C+and+so+to+our+%5BIndependent%5D+Brethren+a+Church-act%2C+that+the+Shepherd+strengthen+the+diseased%2C+heal+that+which+is+sick%2C+bind+up+that+which+is+broken%2C+bring+again+that+which+is+driven+away%2C+seek+that+which+is+lost%2C+Eze.+34.+4.+And+%5Bit+is+a+pastoral+act+to%5D+feed+the+flock+with+knowledge%2C+as+a+pastor+according+to+God%E2%80%99s+heart+and+a+bishop%2C+Jer.+3%3A15%3B+Acts+20%3A28%3B+1+Pet.+5%3A2%3B+Jer.+23%3A1-4%3B+Jer.+50%3A7%3B+Isa.+56%3A10%3B+Zech.+11%3A9-12.+It+is+a+pastoral+act+to+preach+with+all+authority%2C+reprove%2C+rebuke%2C+exhort+with+all+long+suffering+and+doctrine%2C+2+Tim.+4%3A2.+5.+He+should+as+a+pastor+teach+sound+doctrine%2C+exhort%2C+convince+the+gainsayers%2C+and+silence+heretics%2C+Tit.+1%3A9.+But+seeing+the+excommunicated+person+is+not+excluded+from+hearing+the+Word%2C+and+the+pastor+has+a+pastoral+care+of+his+soul+and+is+to+intend+that+his+spirit+may+be+saved+in+the+day+of+the+Lord%2C+1+Cor.+5%3A5%2C+he+cannot+be+utterly+cut+off+from+all+Church-fellowship.+Also+this+%5BIndependent%5D+Author+says+that+Church-members+are+to+be+admonished%2C+and+if+we+do+it+not%2C+we+hate+them+in+our+heart%2C+Lev.+19%3A17%3B+and+if+we+warn+not+an+Achan%2C+his+sin+is+the+sin+of+all+Israel.+Now+if+an+excommunicated+brother+remain+one+whom+we+are+to+gain%2C+and+whose+salvation+we+are+to+intend%2C+if+he+be+an+ordinary+co-worshipper+in+hearing%2C+the+object+of+pastoral+and+brotherly+teaching+and+admonishing%2C+he+cannot+be+wholly+excluded+from+all+Church-fellowship.+And+this+also+proves+that+these+be+members+of+the+visible+Church+in+some+degree+of+Church-worship+who+yet+are+debarred+from+the+seal+of+the+Covenant.+And+it+cannot+be+said+that+the+excommunicated+person+ought+not+to+rebuke+his+brother+and+not+hate+him+in+his+heart%2C+as+Lev.+19%3A17.+Penal+excommunication+looses+not+from+the+Law+of+nature.+But+our+%5BIndependent%5D+brethren+make+rebuking+and+mutual+exhorting+one+of+another+Church+duties+of+watchfulness%3B+then+is+the+excommunicated+in+some+degree+of+Church-membership.+Nor+can+our+brethren+here+reply+with+good+reason%3A+Indians+and+Turks+may+hear+the+Word+as+well+as+the+excommunicated+person%3B+and+therefore+hearing+of+the+word+is+no+note+of+Church+communion.+I+answer%3A+%5B1.%5D+The+Turk+and+Indian+must+hear+the+Word%2C+but+at+the+by%2C+and+not+professedly%3B+but+the+excommunicated+person+by+the+tie+of+his+Covenant+made+in+baptism%2C+and+that+relation+he+has+to+the+Church+under+whose+cure+he+is+for+the+saving+of+his+spirit%2C+and+to+that+Gospel+which+he+professes%2C+is+obliged+to+the+Church-communion+of+public-hearing+%5Bof%5D+the+Word%3B+yea%2C+and+according+to+his+oath+given%2C+to+be+subject+to+the+ministry+of+such+a+man+whom+he+chose+for+his+pastor%2C+to+give+obedience+to+him+in+the+Lord%2C+however+in+that+one+particular+for+which+he+is+cast+out+he+has+failed+against+all+the+foresaid+obligations.+2.+The+Church%2C+as+a+visible+Church%2C+exercises+no+medicinal+acts+upon+Turks+or+heathen+persons%2C+and+does+not+repute+them+as+heathen%2C+but+does+repute+them+to+be+heathen.+Nor+have+the+pastors+any+pastoral+charge+of+Turks+and+heathens+except+%5Bthat%5D+they+would+desire+to+be+baptized+and+profess+the+faith.+But+the+Church+as+the+Church+exercises+medicinal+acts+of+shunning+Christian+fellowship+with+the+excommunicated%2C+and+that+with+a+continuated+intention+even+when+he+is+excommunicated%2C+that+his+spirit+may+be+saved+in+the+day+of+God%3B+and+the+pastor+has+a+pastoral%2C+and+so+a+ministerial+care+and+obligation+of+pastoral+teaching%2C+admonishing+and+persuading+him+to+return+to+God.+4.+Neither+do+we+mean+with+Suarez+and+other+schoolmen+that+excommunication+does+not+so+cut+off+a+member+as+it+removes+not+that+baptismal+character%2C+or+that+passive+power+to+receive+the+sacraments%2C+or+that+the+prayers+of+the+Church+are+not+offered+of+direct+intention+for+the+inwardly+humbled+and+repenting+excommunicated+person+while+the+sentence+of+absolution+be+pronounced+by+the+Church%2C+as+Soto%2C+Adrianus+and+Alanus+think%2C+because%2C+forsooth%2C+Innocentius+III+says+%5Bthat%5D+the+excommunicated+person%2C+though+repenting+and+doing+what+he+can+to+be+reconciled+to+the+Church%2C+yet+without+absolution+from+the+censure%2C+he+is+mortuus+ecclesiastice%2C+%E2%80%98dead+ecclesiastically%E2%80%99%2C+and+so+in+Heaven+also.+Though+Navar%2C+Turrecremata%2C+Richard+%5Band%5D+Anton.+think+the+penitent%2C+excommunicated+person+is+included+in+the+general+desires+of+the+Church+in+their+prayers+because+it+is+not+the+intention+of+the+Church+to+exclude+a+true+and+living+member+of+Christ%E2%80%99s+body+from+a+communion-spiritual+with+Christ.+But+our+meaning+is+that+the+excommunicated+person+is+deprived+of+actual+fellowship+with+Christ+in+the+seals+of+the+Covenant%2C+as+the+Council+of+Arausican%2C+A+gremio+sanctae+matris+Ecclesiae+et+consortio+totius+Christianitatis+eliminamus.+His+sin+is+bound+in+Heaven%2C+yet+so+as+the+salvation+of+his+spirit+is+intended+by+the+Church%3B+see+for+this+Augustine.+We+understand+not+a+baptismal+character%2C+except+regeneration+and+remission+of+sins%2C+which+cannot+be+taken+away+by+excommunication%2C+and+therefore+a+moral+claim+to+the+holy+things+of+God%2C+and+that+for+that+time+and+state+is+rather+removed%2C+than+any+internal+right+to+Christ.+Therefore+some+say%2C+in+this+he+loses+rather+possessionem+quam+jus%2C+%E2%80%98possession+than+right%E2%80%99.+As+a+nobleman%2C+for+some+offence%2C+of+three+dwelling+houses+that+he+has%2C+is+confined+to+one+of+the+three%2C+so+as+he+may+not+remove+from+that+one%3B+yet+does+he+not+lose+right+to+the+other+two.+%E2%80%A6+5.+All+our+divines%2C+standing+for+the+certainty+of+the+perseverance+of+the+regenerated%2C+answer+Papists+and+Arminians+alleging+for+the+apostasy+of+the+saints%2C+the+example+of+the+regenerated+who+may+be+excommunicated%2C+that+excommunication+does+never+evince+%5Bprove%5D+that+the+person+excommunicated+is+out+of+the+state+of+grace%2C+but+only+that+he+has+fallen+into+a+scandalous+external+fact%2C+which+deserves+that+he+should+be+delivered+to+Satan%3B+and+that+one+may+be+a+member+of+the+visible+Church+and+converted+to+God%2C+who+is+excommunicated.+Lastly%E2%80%A6+But+the+believer+is+edified+thereby+%5Bby+excommunication%5D%2C+for+he+is+delivered+to+Satan+for+the+destruction+of+the+flesh%2C+that+the+spirit+may+be+saved+in+the+day+of+the+Lord%E2%80%A6+It+were+an+inconvenience+%5Bcontradiction%5D+to+deliver+a+%5Btrue%5D+member+of+Christ+to+Satan+morally%2C+as+1+Cor.+6%3A15.+This+is+%5Bwould+be%5D+a+sinful+deliverance%2C+when+one+is+given+over+to+Satan%2C+that+Satan+may+work+in+him+as+in+his+work-house+and+as+in+a+child+of+disobedience%2C+Eph.+2%3A2%3B+a+converted+soul+cannot+thus+be+delivered+to+Satan%3B+and+this+%5Bformer+conception%5D+we+abhor+to+write+no+less+than+Robinson+%5Bwho+had+opposed+it+as+an+objection%5D.+But+to+deliver+to+Satan+penally%2C+as+to+a+penal+torturer+who+works+sorrow+and+fear+in+the+conscience+for+sin%2C+to+humble+the+offender%2C+and+to+save+his+spirit+in+the+day+of+Christ%2C+is+neither+horror+by+word+nor+by+writ%2C+but+%5Brather+it+is%5D+the+Word+of+God%2C+1+Cor.+5%3A5.+%E2%80%A6+%E2%80%A6and+Field%2C+%E2%80%98Excommunication+does+not+wholly%E2%80%99+%28saith+he%29+%E2%80%98cut+off+men+from+the+visible+Church%3B%E2%80%99+and+his+reason+is+good%2C+because+they+may+and+often+do+retain%2C+first%2C+the+profession+of+pure+truth%3B+secondly%2C+the+character+of+baptism%3B+thirdly%2C+they+profess+obedience+to+their+pastors%3B+fourthly%2C+they+will+not+join+to+any+other+communion.+And+therefore+to+say+with+our+%5BIndependent%5D+Author%2C+we+dare+not%2C+to+wit%3A+%E2%80%98That+though+the+seed+of+faith+may+remain+in+the+excommunicated+person%3B+yet+to+the+society+of+the+faithful+joined+in+a+particular+visible+Church%2C+they+are+not+knit%2C+but+wholly+cut+off+from+their+communion.+Also%2C+he+is+delivered+unto+Satan%2C+and+therefore+wholly+cut+off+from+the+communion+of+the+Church%3B+and+so+from+the+seals%2C+he+and+his+seed%2C+as+heathen+and+heathen%E2%80%99s+seed+are.%E2%80%99+%E2%80%A6So+we+are+to+condemn+these+who+are+more+rigorous+toward+such+as+are+excommunicated+than+Christ+is%3A+for+Christ+keeps+them+as+sick+children+within+his+visible+Church+and+uses+Satan+as+the+physician%E2%80%99s+servant%2C+who+%5Bthe+physician%5D+boils+herbs+and+dresses+drugs+for+them%2C+while+he+%5Bthe+servant%5D%2C+by+God%E2%80%99s+permission%2C+torments+his+spirit+with+the+conscience+of+sin.+As+when+a+child+is+sick+%28says+worthy+Cartwright%29+the+father+calls+a+college+of+physicians+to+consult+about+medicine+to+be+given+to+the+child.+So+is+the+contumacious+person+under+the+medicine+of+excommunication+administered+by+the+Church-presbytery.+Now+this+we+cannot+say+of+heathen+and+publicans.+And+therefore+Augustine+says+excellently%2C+excommunicated+persons+non+esse+ethnicos%2C+sed+tanquam+ethnicos%3B+%E2%80%98are+not+heathen%2C+but+esteemed+as+heathen%2C%E2%80%99+%28ch.+6%29+and+Chrysostom+says+the+same+in+sense.+Yea%2C+I+gather+this+necessary+distinction+out+of+the+Fathers%2C+as+Chrysostom%2C+Theophylactus%2C+Hilarius%2C+that+they+are+not+members+of+the+visible+Church+actu+pleno%2C+in+a+full+act%2C+because+they+want+external+communion+with+the+Church%2C+yet+actu+imperfecto%2C+imperfectly+they+are+members.+A+second+distinction+I+collect+from+Ireneus%2C+Gregorius%2C+Hieronim.%2C+Optatus%2C+Augustine%2C+that+they+are+exclusi+ab+ecclesia+quoad+communionem%2C+non+ab+ecclesia+ipsa.+%E2%80%98They+are+excluded+from+the+visible+communion+of+the+Church%2C+rather+than+from+the+Church.%E2%80%99+A+third+distinction+may+be+drawn+from+Eugenius%2C+Chrysostom%2C+Gregory+Nazianzen%2C+while+they+call+baptism%2C+januam+spiritualem%2C+and+lavacrum+animae%2C+the+door+of+our+entry+to+the+Church+%28for+which+cause+papists%2C+though+fondly%2C+place+their+font+at+the+Church-door%29+as+the+lavator+of+the+soul.+So+as+excommunicated+persons+are+within+the+door+of+the+visible+Church%2C+though+not+admitted+to+the+King%E2%80%99s+table.+4.+The+schoolmen+do+allow+to+the+excommunicated+persons%2C+jus%2C+non+consortium%3B+%E2%80%98%5Ba%5D+right%2C+but+not+fellowship.%E2%80%99+5.+Turrecremaeta%2C+Vega.%2C+Soto%2C+Canus%2C+insinuat+distinctionem+inter+partes+et+membra+Ecclesiae+visibilis%2C+because+of+some+external+communion+that+they+have%2C+as+teeth+are+parts+of+the+body+in+a+new+born+infant%2C+but+they+are+not+members%3B+but+they+deny+them+to+be+members+because+they+are+cut+off.+6.+Suarez+excellently%2C+privantur+quoad+communicationemcum+aliis+membris%2C+non+quoad+esse+membri.+%E2%80%98They+are+deprived+according+to+the+act+of+communion+with+other+members%2C+not+as+if+they+ceased+to+be+members%3B%E2%80%99+as+a+member+which+cannot+receive+nourishment+is+yet+still+a+member.+Our+divines+from+Scripture+make+three+degrees+of+excommunication%3A+1.+A+debarring+from+the+Lord%E2%80%99s+Supper%2C+Mt.+5%3A24%2C+but+it+is+not+indeed+a+delivering+to+Satan+or+excommunication%3A+this+is+called+the+lesser+excommunication.+2.+A+delivering+to+Satan%2C+the+greater+excommunication%2C+1+Cor.+5%3A3-4%2C+of+this+we+speak+here+especially.+3.+Maranatha+in+the+Syriac+an+is+utter+cursing+till+Christ%E2%80%99s+second+coming.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries%E2%80%A6+%281644%29+%7C+pt.+1%2C+ch.+9%2C+section+9%2C+pp.+272-283&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F85ab1eda9d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/85ab1eda9d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-excommunication/#:~:text=2nd%20Conclusion%3A%20Excommunicated%20persons%20though%20they,utter%20cursing%20till%20Christ%E2%80%99s%20second%20coming&amp;text=2nd%20Conclusion%3A%20Excommunicated%20persons%20though%20they%20be%20debarred&amp;text=an%20is%20utter%20cursing%20till%20Christ%E2%80%99s%20second%20coming" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-8bccd18031" data-kw="">
<blockquote><p>And here it is to be observed that as preaching of the Word is an essential note of the visible Church, and agreeing to the visible Church as necessary ad esse simpliciter [to its essence simply], to the very being of a visible Church… and meeting in one place for Word and sacraments is but accidental for a ministerial Church…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-abbe9fdc5b" data-kw="">
<blockquote><p>First, in that they [the Anglican ministers of Old England, arguing for set, stinted forms of prayer, as in the English Prayer Book] do confound, and make all one ordinance, Blessings, Psalms, and Prayers. … And first, it is evident, that, howsoever some kind of blessing, and prayer be all one, and so may be confounded, yet that solemn kind of blessing spoken of Num. 6, and which the patriarchs, and priests did use in their places, was clean of an other nature: In prayer the minister stands in place of the people and in their name offers up petitions and thanksgiving to God: But in blessing, the minister stands in the place of God, and in his name pronounceth a blessing, or mercy, upon the people. 2. Whereas this duty of prayer may be performed by one equal to another, by an inferior to a superior, yea by a man to himself: that other of blessing is always from the greater to the lesser: and therefore the apostle to the Hebrews, to show that the Preisthood of Melchisedek was more excellent than that of Levi, proves it by this, that Melchisedec blessed Abraham; taking this for granted without all contradiction, that the less is blessed of the greater. 3. Mr. Bernard himself in this book makes prayer one thing, and the blessing pronounced upon the people when they departed another thing: as he also makes singing of psalms a third distinct thing from them both: as there is cause he should.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Justification of Separation from the Church of England Against Mr. Richard Bernard his Invective, entitled, The Separatists Schism (Amsterdam, 1610)</cite>, pp. 466-67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-15e6da6b8b" data-kw="">
<blockquote><p>Thirteenthly, [it is superstition] that it is simply unlawful to use a form of prayer or to read a prayer on a book. Fourteenthly, that if a school-master impose a form upon a scholar, or a parent on a child, it makes it become unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1 | Direction 58</cite>, p. 290</span></figcaption>

</figure><figure class="quote" id="q-904755a747" data-kw="">
<blockquote><p>Objection 17: But the particulars of your [Westminster] Directory of worship are not in Scripture, how then can the magistrate punish for not following the Directory? Answer: That there should be prayers, preaching, reading, praising of God, sacraments in the public worship, is evident by the Scripture, but for the ordering of these worships secundum prius &amp; posterius [according to what is first and that which follows] the words of prayer (so they be according to the pattern of sound doctrine) the Preface of the Directory is clear, that no man is therein to be compelled, though to transgress the Holy Ghost’s express order in the celebration of the Lord’s Supper and to break bread and eat first, and that before any of the words of institution be mentioned, or any blessing of the elements, must be a manifest breach of the directory of Jesus Christ which sure holds forth to us a twofold ordering of acts of worship, one divine, which we must peremptorily follow, another prudential and human in circumstances which concern both the worship of God and civil assemblies, as time, place, persons, etc. and in the latter we are no further to be commanded in point of uniformity than the general rules of the Word lead us; and compulsion, where God has no compelling commandment going before in an exact uniformity, we utterly disclaim, nor can men, or Church, or all the assemblies on earth make laws in matters of God’s worship where the Supreme Lawgiver has made none, and the Preface of the Directory is so clear in this that we trust we shall quickly agree with the godly and sound in judgment in this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (London, 1649)</cite>, pp. 372-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

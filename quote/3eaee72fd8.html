<main class="wrap"><figure class="quote" id="q-3eaee72fd8" data-kw="">
<blockquote><p>All the Reformed exclude from free choice a natural necessity, by which man is by his own nature determined to the thing he wills, as for example the sun, to shine, but nevertheless they admit the necessity: of dependence upon God, as the first cause; of infallibility, from the eternal decree; of predetermination, from governing providence; of slavery, from sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3 | section 30, p. 539, bk. 4, ch. 4, ‘The Penalty &amp; State of Sin’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-278e690c48" data-kw="">
<blockquote><p>7. Is original corruption seated only in the lower part of our soul?… The papists, especially the Jesuits, so that they might hold that the higher part of the soul, as they say, in which is the free choice, was unwounded by corruption, and also so that they might obtain that concupiscence is not sin, and accordingly, that notwithstanding concupiscence, a person can be perfect in this life, state that original corruption is only in the lower part of the soul, that is, in sensuality, in concupiscence, in the rebellion of the lower forces. And of the Reformed with their reasons The Reformed on the contrary refer original corruption not only to the lower faculties of the soul, but also to the higher faculties, and indeed more so to the higher than to the lower. … (1) the apostle expressly refers corruption to the mind in 1 Timothy 6:5, “the mind of corrupt men,” and in Colossians 2:18, “puffed up by the mind of his flesh.</p></blockquote>

<blockquote><p>…we must deal with four preliminary issues: first, whether there is contingency in things; second, given that there is, we need to determine the first cause of contingency; third, we must show how the primary basis of contingency can be found in God; and fourth, we need to clarify certain propositions that arise in this discussion.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-9a82b885b5" data-kw="">
<blockquote><p>When God (Deut. 17) forbids them [Israel] to choose a stranger [as king], He presupposes they may choose a stranger; for God’s law now given to man in the state of sin, presupposes he has corruption of nature to do contrary to God’s law. Now if God did hold forth that their setting a king over them was but the people’s approving the man whom God shall both constitute and design to be king, then he [John Maxwell] should presuppose that God was to design a stranger to be the lawful king of Israel, and the people should be interdicted to approve and consent that the man should be king whom God should choose; for it was impossible that the people should make a stranger king (God is the only immediate king-creator), the people should only approve and consent that a stranger should be king; yet, upon supposition that God first constituted and designed the stranger king, it was not in the people’s power that the king should be a brother rather than a stranger, for if the people have no power to make a king, but do only approve him or consent to him, when he is both made and designed of God to be king, it is not in their power that he be either brother or stranger, and so God commands what is simply impossible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 17</span></figcaption>

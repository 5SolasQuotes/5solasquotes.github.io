<blockquote><p>Behold! He stands at the door and knocks: He is willing, He is willing, He stands at the door: thy opening is after his knocking; He knocks this day, He calls to thee (Ah Lord! Break open the door that will not open!) thou are prevented with love, He stands at the door, and knocks before thou canst have the least thought of opening; Hark (sinner!) hear Him knocking; ‘Turn, turn, why will ye die O house of Israel?’</p></blockquote>

<blockquote><p>Thesis XII: The impulsive efficient [cause], that is, that because of which we have been chosen, is the benevolent disposition of the will of God, or the εὐδοκία, or good pleasure, of the divine will. Explanation: I. It is a question among us, the Lutherans, and the Papists: What moved or impelled God (it is permitted to us to make use of these words, which rather agree with the decrees of men, and are accommodated to our capacity: for properly speaking no impulsive cause of the divine will is granted, as we saw above) to decree to grant eternal life to certain men? We respond: That God was moved by no other thing to determine eternal life for certain ones, than by the benevolent disposition of His will, or His own good pleasure. There are principally two foundations of our opinion: (1.) Because the Scripture names this alone as the cause of election. Ephesians 1:5, He predestinated us, whom He would adopt as Sons through Jesus Christ unto Himself, according to the benevolent disposition of His own will…</p></blockquote>

<blockquote><p>(Verse. 31) ‘He forsakes not forever.’… Moreover, this is most sure, that the nature of God is such as that He delights not in our afflictions, being Himself naturally good, gentle, slow to anger and of great compassion. Thus we see how God is described unto us throughout the whole volume of the scripture, namely, in the 34th chapter of Exodus, insomuch that whenas Isaiah in his 28th chapter says He punishes and afflicts us, it seems rather that He deals like a stranger, and not like Himself. And namely, in the midst of all our afflictions, He makes his singular goodness always appear in the moderating of our punishments, turning them all to our benefit and welfare. And according hereunto, most notably wrote Saint Augustine in his epistles to Felix and Rusticus, saying, What is it that our good God will not mercifully do unto man? And how can it be but that He will show him all the favor He can, considering that all the tribulations which He sends are more benefits…</p></blockquote>

<blockquote><p>The affections are, therefore [after quoting Venema and Ames], either inward and inalterable dispositions of the divine will or figurative attributions based on ad extra manifestations. Furthermore, what makes the attribution of an affection to God figurative or metaphorical is its apparent variation, temporality, or alterability. Significantly, this figurative or metaphorical understanding of some of the divine affections as inward, permanent dispositions and others as ad extra manifestations of permanent dispositions in no way lessened the Reformed interest in the topic–nor did it in any way undermine the discussion of the divine affections in the works of popular piety written during the era of orthodoxy. It is even possible to argue the opposite, that the Reformed orthodox reading of the biblical language of divine affections as not indicating alterations of the divine essence but, nonetheless, as descriptive of genuine patterns of relationship between God and his creation, enhanced the interest of theologians, pastors, and authors of treatises of popular piety in the divine affections… …Nor, indeed, has the basic doctrinal assumption shifted: like the Reformers, the orthodox assume that God has affectiones that characterize his relationship to the world and that some analogy can be drawn between these ‘divine affections’ and the affections that belong to human willing–with the major qualification that, unlike human affections, the divine affections do not indicate essential change in God and that they are permanent rather than transient dispositions. Because of the difficulties inherent in the term ‘affection,’ some of the Reformed prefer to speak of the divine ‘virtues.’ (Thus, Leigh, Treatise, II.x (pp. 78-79); Mastricht, Theoretico-practica theologia, II.xv.18-19.) The question of the ‘affections’ (affectiones or adfectiones) and ‘passions’ (passiones) of the divine will arises rather naturally as a result of the definition and discussion of the voluntas Dei, granting the context of traditional, Christian Aristotelianism and scholastic faculty psychology within which Protestant discussions of mind and will took place, both in the time of the Reformation and afterward. (See Muller, Unaccommodated Calvin, pp. 159-173; and idem, God, Creation, and Providence, pp. 143-149, 167-169, 191-207.) The terminology is itself interesting: the language of affections and passions is typically a language indicating the changeableness of a living being, specifically of the soul, in its sentiments or dispositions. Strictly, an affection or passion is an acquired quality. (Francois Bremondy, “Affection,” in Encyclopedie philosophique universelle, II/1, p. 49.) An affection is usually favorable or positive, whereas a passion is usually negative. Thus, an affection is a disposition of nature or an inclination of will toward an object and, as such, it can indicate either a transient disposition (in contrast to a habitus) that is caused by an external object or a permanent disposition or virtue. (Cf. Heidanus, Corpus theol., II (p. 172); Venema, Inst. theol., viii (p. 180).) It is the latter sense of the term, as a permanent disposition or virtue, that the orthodox accept. A passion, most strictly, is a form of suffering and would not have the connotation of a permanent disposition and certainly not of a disposition positively directed toward an object. Passions, moreover, indicate a declension from an original or natural condition that is at variance with the fundamental inclination of the individual–and, therefore, a loss of power or self-control. (Venema, Inst. theol., viii (p. 181).) A virtue is, quite simply, a moral perfection–in the case of God, the perfection of his understanding and/or will.¹ ¹ (Ames, Marrow, I.iv.63; note that this understanding of affections and passions reflects the standard categories of predication, in which action and passion denote respectively, the act of a subject and the subject being acted upon: thus, the point of the theological argument is that God act[s] but is not acted upon.)</p></blockquote>

%99+%28Thus%2C+Leigh%2C+Treatise%2C+II.x+%28pp.+78-79%29%3B+Mastricht%2C+Theoretico-practica+theologia%2C+II.xv.18-19.%29+The+question+of+the+%E2%80%98affections%E2%80%99+%28affectiones+or+adfectiones%29+and+%E2%80%98passions%E2%80%99+%28passiones%29+of+the+divine+will+arises+rather+naturally+as+a+result+of+the+definition+and+discussion+of+the+voluntas+Dei%2C+granting+the+context+of+traditional%2C+Christian+Aristotelianism+and+scholastic+faculty+psychology+within+which+Protestant+discussions+of+mind+and+will+took+place%2C+both+in+the+time+of+the+Reformation+and+afterward.+%28See+Muller%2C+Unaccommodated+Calvin%2C+pp.+159-173%3B+and+idem%2C+God%2C+Creation%2C+and+Providence%2C+pp.+143-149%2C+167-169%2C+191-207.%29+The+terminology+is+itself+interesting%3A+the+language+of+affections+and+passions+is+typically+a+language+indicating+the+changeableness+of+a+living+being%2C+specifically+of+the+soul%2C+in+its+sentiments+or+dispositions.+Strictly%2C+an+affection+or+passion+is+an+acquired+quality.+%28Francois+Bremondy%2C+%E2%80%9CAffection%2C%E2%80%9D+in+Encyclopedie+philosophique+universelle%2C+II%2F1%2C+p.+49.%29+An+affection+is+usually+favorable+or+positive%2C+whereas+a+passion+is+usually+negative.+Thus%2C+an+affection+is+a+disposition+of+nature+or+an+inclination+of+will+toward+an+object+and%2C+as+such%2C+it+can+indicate+either+a+transient+disposition+%28in+contrast+to+a+habitus%29+that+is+caused+by+an+external+object+or+a+permanent+disposition+or+virtue.+%28Cf.+Heidanus%2C+Corpus+theol.%2C+II+%28p.+172%29%3B+Venema%2C+Inst.+theol.%2C+viii+%28p.+180%29.%29+It+is+the+latter+sense+of+the+term%2C+as+a+permanent+disposition+or+virtue%2C+that+the+orthodox+accept.+A+passion%2C+most+strictly%2C+is+a+form+of+suffering+and+would+not+have+the+connotation+of+a+permanent+disposition+and+certainly+not+of+a+disposition+positively+directed+toward+an+object.+Passions%2C+moreover%2C+indicate+a+declension+from+an+original+or+natural+condition+that+is+at+variance+with+the+fundamental+inclination+of+the+individual%E2%80%93and%2C+therefore%2C+a+loss+of+power+or+self-control.+%28Venema%2C+Inst.+theol.%2C+viii+%28p.+181%29.%29+A+virtue+is%2C+quite+simply%2C+a+moral+perfection%E2%80%93in+the+case+of+God%2C+the+perfection+of+his+understanding+and%2For+will.%C2%B9+%C2%B9+%28Ames%2C+Marrow%2C+I.iv.63%3B+note+that+this+understanding+of+affections+and+passions+reflects+the+standard+categories+of+predication%2C+in+which+action+and+passion+denote+respectively%2C+the+act+of+a+subject+and+the+subject+being+acted+upon%3A+thus%2C+the+point+of+the+theological+argument+is+that+God+act%5Bs%5D+but+is+not+acted+upon.%29%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+Post-Reformation+Reformed+Dogmatics+%28Baker+Academic%2C+2003%29%2C+vol.+3%2C+pp.+552-53&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7375df7539.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7375df7539.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=The%20affections%20are%2C%20therefore%20%5Bafter%20quoting,act%5Bs%5D%20but%20is%20not%20acted%20upon&amp;text=The%20affections%20are%2C%20therefore%20%5Bafter%20quoting%20Venema%20and&amp;text=that%20God%20act%5Bs%5D%20but%20is%20not%20acted%20upon" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I answer that, The will is a rational appetite. Now every appetite is only of something good. The reason of this is that the appetite is nothing else than an inclination of a person desirous of a thing towards that thing. Now every inclination is to something like and suitable to the thing inclined. Since, therefore, everything, inasmuch as it is being and substance, is a good, it must needs be that every inclination is to something good. And hence it is that the Philosopher says (Ethic. i, 1) that the good is that which all desire. But it must be noted that, since every inclination results from a form, the natural appetite results from a form existing in the nature of things: while the sensitive appetite, as also the intellective or rational appetite, which we call the will, follows from an apprehended form.</p></blockquote>

<blockquote><p>Kafka trap”¹ was coined in 2010 off the book of Franz Kafka, The Trial (1925). The main character is accused of something never specified through the whole book and his every defense and refusal to acknowledge guilt is turned on him to be proof of guilt. He is determined guilty in advance and then, by their power over him, the prosecutors work backwards from their conclusion, seeking out any evidence that will support and confirm it. You being continually accused of being immoral diverts persons from seeing that what the leadership is doing is immoral. ¹ See Life Lessons, ‘Kafka trap’ in ‘7 Linguistic Tricks People Use to Deceive &amp; Manipulate You’ (n.d.); Argumentative Penguin, ‘Verbal Prison: How To Spot &amp; Escape The Kafka Trap’ (2021); L.T. Wright, ‘What Is a Kafka Trap &amp; How Does It Work?’ (2021); Stephen T. Kirschner, ‘How to Refute Popular Talking Points &amp; Avoid Kafka Traps, Part 1’ (2020). It’s the elders’ meeting (in closed session) that you have been called to (no witnesses but them): They direct it; you are put on the stand (about that see the section on Pressure). They will ask you questions (you can only speak to that specific question), and then opportunity will be given for them to comment afterwards before you are seen out the door. The interview has been limited to the (subjective) “manner” of what you have done, not your action’s content, substance or reasons (ignore that your manner may be informed and justified by your action’s substance). Their charge is asserted and unfalsifiable, you are already discredited, the arguments are circular, centering back on you, you’re guilty until proven innocent, they’re searching you for information to confirm and you are being detained, with connections cut off, and silenced while intimidated, harrassed and condemned. You answer their questions and they gaslight it, using (and blowing up) the information against you; they won’t let you go into the circumstances (they know the truth would condemn them; they are covering it up) but interrupt, cut you off and talk over you with raised voice (law applies to you, not them). Being so emotionally frazzled it’s hard to answer their questions (most of which assume your guilt) and they often won’t let you answer the very questions they ask. They raise suspicions against you (without letting you speak to them); they ask for your motives and impute motives to you. They are literally waiting for you to slip up in what you say, so that it will be on record and they will have brought out the underlying principle of the whole situation (they will say to others) which you will have to repent for, with the whole of it, or face progressive discipline (involving public censure). They aggress with body language (pointing, turning their back, re-facing you, throwing their hands in the air) and react in opposite manners (e.g. being stern and chuckling; if you see asymmetrical facial expressions, they despise you; you are in danger). If you defend yourself they act as martyrs, as if you attacked them, with wide open body language (acting). They appeal to anything and everything against you (even other people’s choices) and repeatedly, point-blank condemn you (this is supposed to persuade you?). When you try to ask honest, humble questions, they are ignored. If you state things, they are not shy to directly contradict you (the purpose is not to reason, but for show) without giving you opportunity to respond. Instead of giving reasons (if they gave any you could contest them) they act utterly astonished, gaping, that you broke the unwritten rule. “What were you thinking?!” “Why didn’t you come to us first?!” (they never prove the necessity of this). You are left thinking, “I didn’t know that was wrong or I had to come to you first (per natural law and Scripture).” If you defend yourself, even with the Bible (if they finally let you), you are proud,¹ selfish, self-righteous, arrogant and are blame-shifting. ¹ Rutherford: “Pride and contempt are only seen to God: Prelates have no place to punish heart-acts; they are to prove by two witnesses the malice, and pride, and contempt of authority; but this is invisible to men’s eyes.” Divine Right, Intro to Doctrine of Scandal, p. 655 They don’t have to cite specific evidence because “Everyone knows it,” “The problem is you,” you won’t take responsibility for your sin, do you think you’re greater than they, “What about us? You knew that would reflect on us” (they just gave away their real motivation, as most people do if you listen closely). “Must I not do what is right before the Lord, even when it may reflect on my friends?” [Silence, redirecting the interrogation.] You are told forcefully and repeatedly, “You should be silent and listen to your elders.” You remain silent without responding, and the verbal abuse continues. Any slip of facial expression or body posture and you are condemned for not listening as the hour and a half goes by, or you are being “disrespectful to a Gospel minister.” They reroute the “conversation,” endlessly, till they are repeating the same thing over and over and then find this grounds for calling time. Is the moderator (with the obvious conflict of interest) doing his job? Why not? What was the point of all that? To extract from you a confession for the purpose of scapegoating, clearing themselves, to shame you, discredit you (lest anyone follow you in this cause) and reduce you into conformity. It was a non-repeatable step in the process, before the next one. Your being warned and not being cooperative is on file. The only way to stop the social, psychological, verbal and spiritual abuse from your spiritual authorities is to admit you’re guilty, repent, surrender to them and conform to the unwritten rules. Repentance is hard because you have to find some way what you did was wrong. But it will be easier next time. If your elders are keen on experimental religion, they will be looking for (judging) the fruits of your repentance, expressed over time to their satisfaction. If you give in to this, your wife at home should rebuke you. The official record only says they intended to have a friendly interview with you, and made a sufficient inquest. You can be sure they selectively recorded everything else (official notes were being taken the whole time), but that is not available to you or others, or at best may be requested (and denied or otherwise limited at their dictation) through them. But this is presbyterianism, you can appeal, right? No: they never issued a determination; there’s nothing to appeal: it was an interview. You could petition the higher court (possibly made up of largely the same people) regarding their demeanor towards you, if you don’t mind spending months or the next year doing it, but they are quite adept at the ecclesiastical machine and have many ways to turn this down with unwritten traditions, or they may simply witness against you. How will they rule and who will people believe, you or them? The Kafka trap hinges on: power posturing, shaming, learned powerlessness (see the Intro), the united front, implicit faith in the authorities, group-psychology, social pressure (being done by your friends), politeness, your trusting of them, emotions, manipulation, confusion (1 Cor. 14:33), self-preservation (the strongest inclination), equity rescuing (Intro), a predetermined end (which you are not aware of), there being no power of neutral appeal and the ability to cover it up. The best way to counteract the Kafka trap is not to step foot into it or allow yourself to be in a position where you could be put into one. If you must enter it, bring a recorder of some sort and look up your laws about such. Remember, God sees and records everything. If you find yourself in a Kafka trap: – Keep your composure as best as possible (they will use even this against you), knowing it will eventually be over and you will then have better opportunity to assess and plan as time goes on. Take a long term approach. Don’t be provoked and don’t make a mistake. – You’re not going to win by defending yourself or reasoning with them. They make the rules, play referee and are the umpires. It will likely be better in the long run to be mostly silent and take the unfair abuse for the higher good (which does not imply your consent). Though your silence will be used against you (contary to natural, Biblical and civil law), it looks more outwardly in conformity to their desires and the alternative is worse. – Your immediate goal is to get through the meeting. Do not be provoked; remember to breathe, slowly. – What to do in the meeting: The temptation is to use objective language (conveying truth), but subjective language is harder (for them) to argue with and will be of stronger force to anyone who actually reads the official notes. The presence of the note-taker can be your friend (though the moderator may likely be of no help: he’s in on it). Say things like the following (even though it will still be used against you: they will gaff at it: “You say this, when you…!”): – I feel like I’m being interrupted and cut off. – I feel like what I say is being used against me. – I feel intimidated, like I am being condemned. – I don’t know why there is so much pressure. – I don’t feel comfortable answering from the way you asked. – Why are you pointing at me and elders have their arms crossed? – Can I give my reasons from the Bible? (You might have to ask this many times) If you are given the opportunity for any last words, say: “I feel like I have not been allowed to speak freely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Reformed Books Online</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cults and Spiritual Legalism</cite>, The Kafka Trap</span></figcaption>

y will be looking for (judging) the fruits of your repentance, expressed over time to their satisfaction. If you give in to this, your wife at home should rebuke you. The official record only says they intended to have a friendly interview with you, and made a sufficient inquest. You can be sure they selectively recorded everything else (official notes were being taken the whole time), but that is not available to you or others, or at best may be requested (and denied or otherwise limited at their dictation) through them. But this is presbyterianism, you can appeal, right? No: they never issued a determination; there’s nothing to appeal: it was an interview. You could petition the higher court (possibly made up of largely the same people) regarding their demeanor towards you, if you don’t mind spending months or the next year doing it, but they are quite adept at the ecclesiastical machine and have many ways to turn this down with unwritten traditions, or they may simply witness against you. How will they rule and who will people believe, you or them? The Kafka trap hinges on: power posturing, shaming, learned powerlessness (see the Intro), the united front, implicit faith in the authorities, group-psychology, social pressure (being done by your friends), politeness, your trusting of them, emotions, manipulation, confusion (1 Cor. 14:33), self-preservation (the strongest inclination), equity rescuing (Intro), a predetermined end (which you are not aware of), there being no power of neutral appeal and the ability to cover it up. The best way to counteract the Kafka trap is not to step foot into it or allow yourself to be in a position where you could be put into one. If you must enter it, bring a recorder of some sort and look up your laws about such. Remember, God sees and records everything. If you find yourself in a Kafka trap: – Keep your composure as best as possible (they will use even this against you), knowing it will eventually be over and you will then have better opportunity to assess and plan as time goes on. Take a long term approach. Don’t be provoked and don’t make a mistake. – You’re not going to win by defending yourself or reasoning with them. They make the rules, play referee and are the umpires. It will likely be better in the long run to be mostly silent and take the unfair abuse for the higher good (which does not imply your consent). Though your silence will be used against you (contary to natural, Biblical and civil law), it looks more outwardly in conformity to their desires and the alternative is worse. – Your immediate goal is to get through the meeting. Do not be provoked; remember to breathe, slowly. – What to do in the meeting: The temptation is to use objective language (conveying truth), but subjective language is harder (for them) to argue with and will be of stronger force to anyone who actually reads the official notes. The presence of the note-taker can be your friend (though the moderator may likely be of no help: he’s in on it). Say things like the following (even though it will still be used against you: they will gaff at it: “You say this, when you…!”): – I feel like I’m being interrupted and cut off. – I feel like what I say is being used against me. – I feel intimidated, like I am being condemned. – I don’t know why there is so much pressure. – I don’t feel comfortable answering from the way you asked. – Why are you pointing at me and elders have their arms crossed? – Can I give my reasons from the Bible? (You might have to ask this many times) If you are given the opportunity for any last words, say: “I feel like I have not been allowed to speak freely.”

— Cultic Characteristics, The Kafka Trap">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CKafka+trap%E2%80%9D%C2%B9+was+coined+in+2010+off+the+book+of+Franz+Kafka%2C+The+Trial+%281925%29.+The+main+character+is+accused+of+something+never+specified+through+the+whole+book+and+his+every+defense+and+refusal+to+acknowledge+guilt+is+turned+on+him+to+be+proof+of+guilt.+He+is+determined+guilty+in+advance+and+then%2C+by+their+power+over+him%2C+the+prosecutors+work+backwards+from+their+conclusion%2C+seeking+out+any+evidence+that+will+support+and+confirm+it.+You+being+continually+accused+of+being+immoral+diverts+persons+from+seeing+that+what+the+leadership+is+doing+is+immoral.+%C2%B9+See+Life+Lessons%2C+%E2%80%98Kafka+trap%E2%80%99+in+%E2%80%987+Linguistic+Tricks+People+Use+to+Deceive+%26+Manipulate+You%E2%80%99+%28n.d.%29%3B+Argumentative+Penguin%2C+%E2%80%98Verbal+Prison%3A+How+To+Spot+%26+Escape+The+Kafka+Trap%E2%80%99+%282021%29%3B+L.T.+Wright%2C+%E2%80%98What+Is+a+Kafka+Trap+%26+How+Does+It+Work%3F%E2%80%99+%282021%29%3B+Stephen+T.+Kirschner%2C+%E2%80%98How+to+Refute+Popular+Talking+Points+%26+Avoid+Kafka+Traps%2C+Part+1%E2%80%99+%282020%29.+It%E2%80%99s+the+elders%E2%80%99+meeting+%28in+closed+session%29+that+you+have+been+called+to+%28no+witnesses+but+them%29%3A+They+direct+it%3B+you+are+put+on+the+stand+%28about+that+see+the+section+on+Pressure%29.+They+will+ask+you+questions+%28you+can+only+speak+to+that+specific+question%29%2C+and+then+opportunity+will+be+given+for+them+to+comment+afterwards+before+you+are+seen+out+the+door.+The+interview+has+been+limited+to+the+%28subjective%29+%E2%80%9Cmanner%E2%80%9D+of+what+you+have+done%2C+not+your+action%E2%80%99s+content%2C+substance+or+reasons+%28ignore+that+your+manner+may+be+informed+and+justified+by+your+action%E2%80%99s+substance%29.+Their+charge+is+asserted+and+unfalsifiable%2C+you+are+already+discredited%2C+the+arguments+are+circular%2C+centering+back+on+you%2C+you%E2%80%99re+guilty+until+proven+innocent%2C+they%E2%80%99re+searching+you+for+information+to+confirm+and+you+are+being+detained%2C+with+connections+cut+off%2C+and+silenced+while+intimidated%2C+harrassed+and+condemned.+You+answer+their+questions+and+they+gaslight+it%2C+using+%28and+blowing+up%29+the+information+against+you%3B+they+won%E2%80%99t+let+you+go+into+the+circumstances+%28they+know+the+truth+would+condemn+them%3B+they+are+covering+it+up%29+but+interrupt%2C+cut+you+off+and+talk+over+you+with+raised+voice+%28law+applies+to+you%2C+not+them%29.+Being+so+emotionally+frazzled+it%E2%80%99s+hard+to+answer+their+questions+%28most+of+which+assume+your+guilt%29+and+they+often+won%E2%80%99t+let+you+answer+the+very+questions+they+ask.+They+raise+suspicions+against+you+%28without+letting+you+speak+to+them%29%3B+they+ask+for+your+motives+and+impute+motives+to+you.+They+are+literally+waiting+for+you+to+slip+up+in+what+you+say%2C+so+that+it+will+be+on+record+and+they+will+have+brought+out+the+underlying+principle+of+the+whole+situation+%28they+will+say+to+others%29+which+you+will+have+to+repent+for%2C+with+the+whole+of+it%2C+or+face+progressive+discipline+%28involving+public+censure%29.+They+aggress+with+body+language+%28pointing%2C+turning+their+back%2C+re-facing+you%2C+throwing+their+hands+in+the+air%29+and+react+in+opposite+manners+%28e.g.+being+stern+and+chuckling%3B+if+you+see+asymmetrical+facial+expressions%2C+they+despise+you%3B+you+are+in+danger%29.+If+you+defend+yourself+they+act+as+martyrs%2C+as+if+you+attacked+them%2C+with+wide+open+body+language+%28acting%29.+They+appeal+to+anything+and+everything+against+you+%28even+other+people%E2%80%99s+choices%29+and+repeatedly%2C+point-blank+condemn+you+%28this+is+supposed+to+persuade+you%3F%29.+When+you+try+to+ask+honest%2C+humble+questions%2C+they+are+ignored.+If+you+state+things%2C+they+are+not+shy+to+directly+contradict+you+%28the+purpose+is+not+to+reason%2C+but+for+show%29+without+giving+you+opportunity+to+respond.+Instead+of+giving+reasons+%28if+they+gave+any+you+could+contest+them%29+they+act+utterly+astonished%2C+gaping%2C+that+you+broke+the+unwritten+rule.+%E2%80%9CWhat+were+you+thinking%3F%21%E2%80%9D+%E2%80%9CWhy+didn%E2%80%99t+you+come+to+us+first%3F%21%E2%80%9D+%28they+never+prove+the+necessity+of+this%29.+You+are+left+thinking%2C+%E2%80%9CI+didn%E2%80%99t+know+that+was+wrong+or+I+had+to+come+to+you+first+%28per+natural+law+and+Scripture%29.%E2%80%9D+If+you+defend+yourself%2C+even+with+the+Bible+%28if+they+finally+let+you%29%2C+you+are+proud%2C%C2%B9+selfish%2C+self-righteous%2C+arrogant+and+are+blame-shifting.+%C2%B9+Rutherford%3A+%E2%80%9CPride+and+contempt+are+only+seen+to+God%3A+Prelates+have+no+place+to+punish+heart-acts%3B+they+are+to+prove+by+two+witnesses+the+malice%2C+and+pride%2C+and+contempt+of+authority%3B+but+this+is+invisible+to+men%E2%80%99s+eyes.%E2%80%9D+Divine+Right%2C+Intro+to+Doctrine+of+Scandal%2C+p.+655+They+don%E2%80%99t+have+to+cite+specific+evidence+because+%E2%80%9CEveryone+knows+it%2C%E2%80%9D+%E2%80%9CThe+problem+is+you%2C%E2%80%9D+you+won%E2%80%99t+take+responsibility+for+your+sin%2C+do+you+think+you%E2%80%99re+greater+than+they%2C+%E2%80%9CWhat+about+us%3F+You+knew+that+would+reflect+on+us%E2%80%9D+%28they+just+gave+away+their+real+motivation%2C+as+most+people+do+if+you+listen+closely%29.+%E2%80%9CMust+I+not+do+what+is+right+before+the+Lord%2C+even+when+it+may+reflect+on+my+friends%3F%E2%80%9D+%5BSilence%2C+redirecting+the+interrogation.%5D+You+are+told+forcefully+and+repeatedly%2C+%E2%80%9CYou+should+be+silent+and+listen+to+your+elders.%E2%80%9D+You+remain+silent+without+responding%2C+and+the+verbal+abuse+continues.+Any+slip+of+facial+expression+or+body+posture+and+you+are+condemned+for+not+listening+as+the+hour+and+a+half+goes+by%2C+or+you+are+being+%E2%80%9Cdisrespectful+to+a+Gospel+minister.%E2%80%9D+They+reroute+the+%E2%80%9Cconversation%2C%E2%80%9D+endlessly%2C+till+they+are+repeating+the+same+thing+over+and+over+and+then+find+this+grounds+for+calling+time.+Is+the+moderator+%28with+the+obvious+conflict+of+interest%29+doing+his+job%3F+Why+not%3F+What+was+the+point+of+all+that%3F+To+extract+from+you+a+confession+for+the+purpose+of+scapegoating%2C+clearing+themselves%2C+to+shame+you%2C+discredit+you+%28lest+anyone+follow+you+in+this+cause%29+and+reduce+you+into+conformity.+It+was+a+non-repeatable+step+in+the+process%2C+before+the+next+one.+Your+being+warned+and+not+being+cooperative+is+on+file.+The+only+way+to+stop+the+social%2C+psychological%2C+verbal+and+spiritual+abuse+from+your+spiritual+authorities+is+to+admit+you%E2%80%99re+guilty%2C+repent%2C+surrender+to+them+and+conform+to+the+unwritten+rules.+Repentance+is+hard+because+you+have+to+find+some+way+what+you+did+was+wrong.+But+it+will+be+easier+next+time.+If+your+elders+are+keen+on+experimental+religion%2C+they+will+be+looking+for+%28judging%29+the+fruits+of+your+repentance%2C+expressed+over+time+to+their+satisfaction.+If+you+give+in+to+this%2C+your+wife+at+home+should+rebuke+you.+The+official+record+only+says+they+intended+to+have+a+friendly+interview+with+you%2C+and+made+a+sufficient+inquest.+You+can+be+sure+they+selectively+recorded+everything+else+%28official+notes+were+being+taken+the+whole+time%29%2C+but+that+is+not+available+to+you+or+others%2C+or+at+best+may+be+requested+%28and+denied+or+otherwise+limited+at+their+dictation%29+through+them.+But+this+is+presbyterianism%2C+you+can+appeal%2C+right%3F+No%3A+they+never+issued+a+determination%3B+there%E2%80%99s+nothing+to+appeal%3A+it+was+an+interview.+You+could+petition+the+higher+court+%28possibly+made+up+of+largely+the+same+people%29+regarding+their+demeanor+towards+you%2C+if+you+don%E2%80%99t+mind+spending+months+or+the+next+year+doing+it%2C+but+they+are+quite+adept+at+the+ecclesiastical+machine+and+have+many+ways+to+turn+this+down+with+unwritten+traditions%2C+or+they+may+simply+witness+against+you.+How+will+they+rule+and+who+will+people+believe%2C+you+or+them%3F+The+Kafka+trap+hinges+on%3A+power+posturing%2C+shaming%2C+learned+powerlessness+%28see+the+Intro%29%2C+the+united+front%2C+implicit+faith+in+the+authorities%2C+group-psychology%2C+social+pressure+%28being+done+by+your+friends%29%2C+politeness%2C+your+trusting+of+them%2C+emotions%2C+manipulation%2C+confusion+%281+Cor.+14%3A33%29%2C+self-preservation+%28the+strongest+inclination%29%2C+equity+rescuing+%28Intro%29%2C+a+predetermined+end+%28which+you+are+not+aware+of%29%2C+there+being+no+power+of+neutral+appeal+and+the+ability+to+cover+it+up.+The+best+way+to+counteract+the+Kafka+trap+is+not+to+step+foot+into+it+or+allow+yourself+to+be+in+a+position+where+you+could+be+put+into+one.+If+you+must+enter+it%2C+bring+a+recorder+of+some+sort+and+look+up+your+laws+about+such.+Remember%2C+God+sees+and+records+everything.+If+you+find+yourself+in+a+Kafka+trap%3A+%E2%80%93+Keep+your+composure+as+best+as+possible+%28they+will+use+even+this+against+you%29%2C+knowing+it+will+eventually+be+over+and+you+will+then+have+better+opportunity+to+assess+and+plan+as+time+goes+on.+Take+a+long+term+approach.+Don%E2%80%99t+be+provoked+and+don%E2%80%99t+make+a+mistake.+%E2%80%93+You%E2%80%99re+not+going+to+win+by+defending+yourself+or+reasoning+with+them.+They+make+the+rules%2C+play+referee+and+are+the+umpires.+It+will+likely+be+better+in+the+long+run+to+be+mostly+silent+and+take+the+unfair+abuse+for+the+higher+good+%28which+does+not+imply+your+consent%29.+Though+your+silence+will+be+used+against+you+%28contary+to+natural%2C+Biblical+and+civil+law%29%2C+it+looks+more+outwardly+in+conformity+to+their+desires+and+the+alternative+is+worse.+%E2%80%93+Your+immediate+goal+is+to+get+through+the+meeting.+Do+not+be+provoked%3B+remember+to+breathe%2C+slowly.+%E2%80%93+What+to+do+in+the+meeting%3A+The+temptation+is+to+use+objective+language+%28conveying+truth%29%2C+but+subjective+language+is+harder+%28for+them%29+to+argue+with+and+will+be+of+stronger+force+to+anyone+who+actually+reads+the+official+notes.+The+presence+of+the+note-taker+can+be+your+friend+%28though+the+moderator+may+likely+be+of+no+help%3A+he%E2%80%99s+in+on+it%29.+Say+things+like+the+following+%28even+though+it+will+still+be+used+against+you%3A+they+will+gaff+at+it%3A+%E2%80%9CYou+say+this%2C+when+you%E2%80%A6%21%E2%80%9D%29%3A+%E2%80%93+I+feel+like+I%E2%80%99m+being+interrupted+and+cut+off.+%E2%80%93+I+feel+like+what+I+say+is+being+used+against+me.+%E2%80%93+I+feel+intimidated%2C+like+I+am+being+condemned.+%E2%80%93+I+don%E2%80%99t+know+why+there+is+so+much+pressure.+%E2%80%93+I+don%E2%80%99t+feel+comfortable+answering+from+the+way+you+asked.+%E2%80%93+Why+are+you+pointing+at+me+and+elders+have+their+arms+crossed%3F+%E2%80%93+Can+I+give+my+reasons+from+the+Bible%3F+%28You+might+have+to+ask+this+many+times%29+If+you+are+given+the+opportunity+for+any+last+words%2C+say%3A+%E2%80%9CI+feel+like+I+have+not+been+allowed+to+speak+freely.%E2%80%9D%0A%0A%E2%80%94+Cultic+Characteristics%2C+The+Kafka+Trap&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3aff170d0e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3aff170d0e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cults/#:~:text=Kafka%20trap%E2%80%9D%C2%B9%20was%20coined%20in%202010,not%20been%20allowed%20to%20speak%20freely&amp;text=Kafka%20trap%E2%80%9D%C2%B9%20was%20coined%20in%202010%20off%20the&amp;text=I%20have%20not%20been%20allowed%20to%20speak%20freely" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

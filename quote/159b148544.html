<main class="wrap"><figure class="quote" id="q-159b148544" data-kw="">
<blockquote><p>True saving faith does not consist in assenting to the promises of the gospel, but it consists in a heartfelt trust to be brought to salvation by Christ—this on the basis of His free offer and the promises made to those who trust in Him. We therefore immediately establish that faith is not seated in the intellect, but in the will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, vol. 2, ch. 32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a></span><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a> › <a href="../topics/faith/nature-of-saving-faith/knowledge-assent-trust-fiducia.html">Knowledge, assent, trust (fiducia)</a></span></div>

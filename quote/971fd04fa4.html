<main class="wrap"><figure class="quote" id="q-971fd04fa4" data-kw="">
<blockquote><p>if heretics wanted only the merits of Christ to be imputed to us, because they are given to us, and we can offer them to God the Father for our sins, since Christ undertakes the burden of satisfying for us, and not reconciling us to God the Father, their opinion would be correct.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘On Imputed Righteousness’, pp. 259-61 Latin | XXXIII. Indeed, not even our way of speaking is dared to be simply condemned by the Roman School of Theology, for they concede that it can be said in a sound sense that the righteousness of Christ is imputed to us and becomes ours. Indeed, that sound sense according to which they interpret that expression is the very one that we intend. This is clearly evident from Bellarmine, bk. 2, On Justification, ch. 7, §4: “Fourth, it is refuted. For,” he says</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“if heretics wanted only the merits of Christ to be imputed to us, because they are given to us, and we can offer them to God the Father for our sins, since Christ undertakes the burden of satisfying for us, and not reconciling us to God the Father, their opinion would be correct.”

— Louis Le Blanc, Theological Theses published at Various Times in the Academy of Sedan, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘On Imputed Righteousness’, pp. 259-61 Latin | XXXIII. Indeed, not even our way of speaking is dared to be simply condemned by the Roman School of Theology, for they concede that it can be said in a sound sense that the righteousness of Christ is imputed to us and becomes ours. Indeed, that sound sense according to which they interpret that expression is the very one that we intend. This is clearly evident from Bellarmine, bk. 2, On Justification, ch. 7, §4: “Fourth, it is refuted. For,” he says">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9Cif+heretics+wanted+only+the+merits+of+Christ+to+be+imputed+to+us%2C+because+they+are+given+to+us%2C+and+we+can+offer+them+to+God+the+Father+for+our+sins%2C+since+Christ+undertakes+the+burden+of+satisfying+for+us%2C+and+not+reconciling+us+to+God+the+Father%2C+their+opinion+would+be+correct.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+published+at+Various+Times+in+the+Academy+of+Sedan%2C+vol.+2+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+%E2%80%98On+Imputed+Righteousness%E2%80%99%2C+pp.+259-61+Latin+%7C+XXXIII.+Indeed%2C+not+even+our+way+of+speaking+is+dared+to+be+simply+condemned+by+the+Roman+School+of+Theology%2C+for+they+concede+that+it+can+be+said+in+a+sound+sense+that+the+righteousness+of+Christ+is+imputed+to+us+and+becomes+ours.+Indeed%2C+that+sound+sense+according+to+which+they+interpret+that+expression+is+the+very+one+that+we+intend.+This+is+clearly+evident+from+Bellarmine%2C+bk.+2%2C+On+Justification%2C+ch.+7%2C+%C2%A74%3A+%E2%80%9CFourth%2C+it+is+refuted.+For%2C%E2%80%9D+he+says&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F971fd04fa4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/971fd04fa4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=if%20heretics%20wanted%20only%20the%20merits,Father%2C%20their%20opinion%20would%20be%20correct&amp;text=if%20heretics%20wanted%20only%20the%20merits%20of%20Christ&amp;text=God%20the%20Father%2C%20their%20opinion%20would%20be%20correct" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-941ab42d00" data-kw="">
<blockquote><p>Mr. Wotton in his papers which he dispersed in this city, and which he acknowledged to be his own when I [Walker] brought them to his face before Mr. Gataker and eight other grave ministers, does deny the imputation of the whole obedience of Christ, to the Law of God; both active and passive, both jointly and severally. He affirms that there is no end or use whatsoever of the imputation of Christ his righteousness for justification. He renounces the law in whole and part, performed by ourselves, or any other in our stead for our justification… he sets up faith, even the act of believing for righteousness, affirms that it is said to be imputed in a proper sense without a trope, and serves for all purposes in our justification under the Gospel, as perfect righteousness of works performed to the whole law did for man’s justification in the first covenant. He denies the punishment of our sins in Christ, and the satisfaction which in Him our head &amp; surety was made to God’s justice for purchase of our pardon… These and such like speeches I condemned for Socinian heresy and blasphemy, as Beza, Paraeus and Lubertus had done before me, and for this Mr. Gataker did deride me, when I gave in my charge against Mr. Wotton 27 years ago, and now [Gataker] blames it in me as falsehood and dishonesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A True Relation of the Chief Passages Between Mr. Anthony Wotton &amp; Mr. George Walker in the Years 1611-1615, Written by George Walker for the Vindicating of Himself from Some Imputations Laid on Him by Mr. Thomas Gataker in his Defense of Mr. Wotton (1642) 36 pp.</cite>, pp. 1-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-b329a10ff6" data-kw="">
<blockquote><p>Justification therefore is properly a free judicial action of God, whereby He iudges the elect in themselves subject to the accusation and malediction of the Law, to be just by faith, through Christ by imputation of his righteousness, unto the praise of the glory of his grace, and their own salvation. That this definition might be rightly understood, it is needful that the causes, which are orderly noted in the same, be two ways considered, according as justification is taken, either actively, in respect of God, who justifies, or passively in respect of man, who is justified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 9, ‘Of Man’s Justification before God’ in A Brief Institution of the Common Places of Sacred Divinity… (London: Francis Burton, 1610), pp. 222-76 The causes are succinctly stated on pp. 227-38, and then defended afterwards.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

<main class="wrap"><figure class="quote" id="q-37debbfd3e" data-kw="">
<blockquote><p>The Pharises were rigid separatists and quarrelled with Christ because He would not separate, but was a friend to publicans and sinners, Lk. 15:27-28. They pretend they abhor a mixed company, and yet they revile and fly from real saints. They are all for gathering churches out of churches, which is the very way to destroy churches. How do we destroy houses but by pulling one stone and one piece from another?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical &amp; Polemical Commentary, or, Exposition upon the Third &amp; Fourth Chapters of the Latter Epistle of Saint Paul to Timothy</cite>, section 18, ‘They Separate Themselves from the True Churches of Christ’ in ch. 7, ‘Of the Peculiar Manner &amp; Form of Speech used by the Quintinists (i.e. a pack of Libertines then living)’ in A Practical &amp; Polemical Commentary, or, Exposition upon the Third &amp; Fourth Chapters of the Latter Epistle of Saint Paul to Timothy… (London, 1658), on 2 Tim. 3:8, pp. 166-67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>We therefore disallow all such things as are repugnant to this foresaid doctrine, confirmed by the scriptures, and chiefly these special points: .. 3. That the church does so consist of the elect and of true saints that in it should be contained no hypocrites, and that in the Scriptures they should never be comprehended under the Church’s name. … 7. So to bind the church to certain places and persons, as to say there only with them is the church. 8. Not to acknowledge those for Christ’s churches, which, although they hold the grounds of faith, yet in ceremonies or in some part of doctrine do not altogether jump with us. 9. To make a separation from the churches upon any error or for the ill life of some men. 10. …and contrariwise, that those are not true churches which, although they keep fast the true doctrine, right sacraments and pure discipline, yet cannot show a continuance and succession of bishops never broken.</p></blockquote>

</figure><figure class="quote" id="q-f5ed4238e4" data-kw="">
<blockquote><p>It is one thing to deny total communion, and another to separate but secundum quid for some act or part; And that is either a great and necessary part or some small or indifferent thing or ceremony. It is one thing to separate locally by bodily absence, and another mentally by schismatical principles. It is one thing to separate from a church as accusing it to be no church of Christ, and another to separate from it only as a true Church, but so corrupted as not to be communicated with. It’s one thing to judge its communion absolutely unlawful, and another only to forsake it for a better which is preferred: It’s one thing to depart willfully, and another to be unwillingly cast out. It’s one thing to depart rashly and in haste, and another to depart after due patience, when reformation appears hopeless. It is one thing to remove upon religious reasons, and another upon civil or domestical, or corporal [reasons].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), sect. 6, pp. 38-39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-7a9ddca60c" data-kw="">

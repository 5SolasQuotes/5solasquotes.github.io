<main class="wrap"><figure class="quote" id="q-b26f83fb13" data-kw="">
<blockquote><p>Consent I. They [Romanists] grant that in justification sin is pardoned by the merits of Christ, and that none can be justified without remission of sins: and that is well. II. They grant that the righteousness whereby a man is made righteous before God, comes from Christ, and from Christ alone. III. The most learned among them say that Christ’s satisfaction, and the merit of his death is imputed to every sinner that does believe, for his satisfaction before God: and hitherto we agree. The very point of difference is this: We hold that the satisfaction made by Christ in his death, and obedience to the Law, is imputed to us and becomes our righteousness. They say, it is our satisfaction and not our righteousness whereby we stand righteous before God: because it is inherent in the person of Christ as in a subject. Now the answer of the Papist to the former question is on this manner: The thing (says he) that makes us righteous before God, and causes us to be accepted to life everlasting, is remission of sins and the habit of inward righteousness, or charity with the fruits thereof. We condescend and grant that the habit of righteousness, which we call sanctification, is an excellent gift of God, and has his reward of God; and is the matter of our justification before man: because it serves to declare us to be reconciled to God, and to be justified; yet we deny it to be the thing, which makes us of sinners to become righteous or just before God. And this is the first point of our disagreement in the matter of justification: which must be marked; because if there were no more points of difference between us, this one alone were sufficient to keep us from uniting of our religions: for hereby the Church of Rome does raze the very foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, ... ([Cambridge] 1598), ch. 4, ‘The Justification of a Sinner’, pp. 926-27</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f635f317d4" data-kw="">
<blockquote><p>Justification goes beyond forgiveness. Not only are we forgiven because of Christ, but God also declares us righteous because of Christ. God requires two things of us: punishment for our sins and perfection in our lives. Our sins must be punished, and our lives must be righteous. But we cannot bear our own punishment (Ps. 49:7-8), and we cannot provide our own righteousness. “None is righteous; no, not one” (Rom. 3:10). Therefore, God, out of His immeasurable love for us, provided His own Son to do both. Christ bears our punishment, and Christ performs our righteousness. And when we receive Christ (John 1:12), all of His punishment and all of His righteousness is counted as ours (Rom. 4:4-6; 5:1, 19; 8:1; 10:4; 2 Cor. 5:21; Phil. 3:8-9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-piper.html">John Piper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This Momentary Marriage</cite>, p. 46</span></figcaption>

</figure><figure class="quote" id="q-41fa5bb1e6" data-kw="">
<blockquote><p>How can a man be just with God? The answer given to this question decides the character of our religion and, if practically adopted, our future destiny. To give a wrong answer is to mistake the way to heaven. It is to err where error is fatal, because it cannot be corrected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Justification, the Law, and the Righteousness of Christ</cite>, I.A, “Introduction”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“How can a man be just with God? The answer given to this question decides the character of our religion and, if practically adopted, our future destiny. To give a wrong answer is to mistake the way to heaven. It is to err where error is fatal, because it cannot be corrected.”

— Charles Hodge, Justification, the Law, and the Righteousness of Christ, I.A, “Introduction”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHow+can+a+man+be+just+with+God%3F+The+answer+given+to+this+question+decides+the+character+of+our+religion+and%2C+if+practically+adopted%2C+our+future+destiny.+To+give+a+wrong+answer+is+to+mistake+the+way+to+heaven.+It+is+to+err+where+error+is+fatal%2C+because+it+cannot+be+corrected.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Justification%2C+the+Law%2C+and+the+Righteousness+of+Christ%2C+I.A%2C+%E2%80%9CIntroduction%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F41fa5bb1e6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/41fa5bb1e6.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-ec8337d7c9" data-kw="">
<blockquote><p>We further say that good works justify us in St. James’s sense, Jm. 2:14. There is a double justification: 1. A justification of a man from sin in the sight of God. 2. Of a Christian from hypocrisy in the sight of both God and man; the first way a man is justified only by the blood of Christ; the second way by good works; for we must know a man’s conscience has two burdens. 1. My sins are great and liable to damnation; how shall I be acquit of that? From this our own works cannot justify us; it is done only by the blood of Christ. 2. I: But the blood of Christ cleanses only true Christians that are in Christ and have true grace; but you are an hypocrite; how shall I now be quit from the imputation of hypocrisy? In that I am justified by my works, let it appear to myself and others that I have lived in all uprightness, 2 Cor. 1:12; so that justification from hypocrisy before God and man is from the witness of my upright and unblameable life, so that I am justified from a double accusation: from the one by one way, from the other by another way. I am a sinner, that I cannot deny; my best works are sinful; therefore from that I am justified only by the blood of Christ. But Christ’s blood belongs not to you; you are an hypocrite; now how shall I know the sincerity of faith but from the fruits, which is an holy and righteous life, so that if I walk so, I justify myself from that imputation. How does Hezekiah help himself when God spake bitter things? ‘Remember how I have walked before Thee with an upright heart,’ 2 Jn. 3; Isa. 53:11. How do I know that I know Him? Why if I keep his commandments; therefore we say that an holy life is an evident sign of our fellowship with God: it glorifies God; it stops slanders and brings on others; and besides all this, a godly life will justify us from hypocrisy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary, or an Exposition with Observations, Reasons, and uses upon the First Epistle General of John</cite>, … upon the First Epistle General of John (d. 1652; London: 1658), on 1 Jn. 1:7, “Doctrine: To walk in the light is a certain mark of true fellowship with God”, p. 31</span></figcaption>

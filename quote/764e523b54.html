<main class="wrap"><figure class="quote" id="q-764e523b54" data-kw="">
<blockquote><p>It is one thing to speak of the merit of the person, another of the merit of the work; and again, one thing to speak of eternal life as it is an inheritance, another as it is a reward, wages, a prize. For from the fact that someone is a son of God by grace, he merits ex condigno the inheritance of eternal life without any other pact, but by the merit of the person, not by the merit of the work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.17 (translated from the Latin)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9713d497d0" data-kw="">
<blockquote><p>Nor ought it to be doubted that condign merit can vary in these three ways. For if some work were much inferior to the reward promised by agreement—as if the lord of a vineyard hired laborers and promised as wages, not a denarius a day, but a hundred gold pieces—such merit would be ex condigno by reason of the pact, not by reason of the work. Conversely, if the work were really equal to the reward, or perhaps even greater, but no agreement had intervened, then if such merit ought to be called ex condigno, it would have to be called ex condigno by reason of the work, not by reason of the pact. … Finally, if a pact both intervenes and the work is truly equal to the reward, as when laborers are hired for the vineyard for a denarius a day according to the Gospel, that merit will be ex condigno by reason of the work and by reason of the pact.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.17 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-14a3722262" data-kw="">
<blockquote><p>Filial adoption, in making us partakers by grace in the divine nature, can bestow true merit on us as a result of God&#x27;s gratuitous justice. This is our right by grace, the full right of love, making us &quot;co-heirs&quot; with Christ and worthy of obtaining &quot;the promised inheritance of eternal life.&quot; The merits of our good works are gifts of the divine goodness.</p></blockquote>

</figure><figure class="quote" id="q-1d5aa59359" data-kw="">
<blockquote><p>There remains the last question, whether God rewards good works out of mere liberality beyond what is condign. For the common opinion of theologians constantly affirms this.</p></blockquote>

</figure><figure class="quote" id="q-d2a7d4c853" data-kw="">
<blockquote><p>For, whereas Jesus Christ Himself continually infuses his virtue into the said justified,-as the head into the members, and the vine into the branches,-and this virtue always precedes and accompanies and follows their good works, which without it could not in any wise be pleasing and meritorious before God,-we must believe that nothing further is wanting to the justified, to prevent their being accounted to have, by those very works which have been done in God, fully satisfied the divine law according to the state of this life, and to have truly merited eternal life, to be obtained also in its (due) time, if so be, however, that they depart in grace.</p></blockquote>

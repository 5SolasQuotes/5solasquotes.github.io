<main class="wrap"><figure class="quote" id="q-f9fd7f9d25" data-kw="">
<blockquote><p>For the increasing also of your Inward Peace, Spiritual Joy and Comfort, Give all diligence to make your Calling and Election sure; Examining your selves frequently and seriously, whether Jesus Christ be in you yea or no. But how shall this be done? By comparing your Hearts, Lives and Experiences with the written Word of God, through the assistance and guidance of Gods Holy Spirit. For, to this End the Word of God was written to us, and the Spirit of God is given to us, that we may know the things that are freely given to us of God, and that we may know that we have eternal life.</p></blockquote>

</figure><figure class="quote" id="q-dc4f17be06" data-kw="">
<blockquote><p>Of our present righteousness, notwithstanding sin remain in our mortal bodies, are we assured by the faithful witness of Jesus Christ, John the Apostle, saying, “If we confess our sins, faithful and just is God to remit and forgive our sins.” Mark the words of the apostle; if we confess our sins, God must forgive them, because be is faithful and just.

To confession of sins are these things requisite: first, we must acknowledge the sin; and it is to be noted that sometimes God’s very elect, albeit they have sinned most heinously, do not acknowledge sin, and therefore cannot at all times confess the same; for sin is not known until such time as the veil be taken from the conscience of the offender, that he may see and behold the filthiness of sin, what punishment by God’s just judgments is due for the same, and then (which is the second thing requisite to confession) begins the hatred of sin, and of ourselves for contemning of God and of his holy law, — whereof last springs that which we call hope of mercy, which is nothing else than you sob from a troubled heart, confounded and ashamed for sin, thirsting for remission and God’s free mercy, whereupon of necessity must follow this conclusion, God has remitted and freely forgiven the sin; and why? for “he is faithful and just,” saith the apostle.

Comfortable and marvellous reasons! First, God is faithful, therefore be must forgive sin. A comfortable consequent upon a most sure ground! for God’s fidelity can no more fail, than can himself. Then let this argument be gathered for our comfort; it pertaineth to the faithful to keep promise: but God is faithful, therefore he must keep promise. That God has promised remission of sins to such as be repentant, I need not now to quote the places. But let this summation of the promises be made:— God promises remission of sins to all that confess the same; but I confess my sins; for I see the filthiness thereof, and how justly God may condemn me for my iniquities. I sob and I lament that I cannot be quit and rid of sin. I desire to live a more perfect life. These are infallible signs, seals, and tokens that God has remitted the sin; for God is faithful that hath so promised, and can no more deceive than he can cease to be God.

But what reason is this — God is just, therefore he must forgive sin? A wondrous argument and reason, indeed! for the flesh and natural man can understand nothing but the contrary; for thus it must reason: — The justice of God is offended by my sins, so God must needs have a satisfaction and require a punishment. If we understand of whom God requires satisfaction, whether of us or of the hands of his only Son, and whose punishment is able to recompensate for our sins, then shall we have great cause to rejoice, remembering that God is a just God; for it pertaineth to the just man to stand content when he bath received his due. But God has received already, at the hands of his only Son, all that is due for our sins; and so cannot his justice require nor crave any more of us either satisfaction or recompensation for our sins.

Consider, mother, the sure pillars and foundation of our salvation to be God’s faithfulness and justice. He that is faithful has promised free remission to all penitent sinners, and He that is just has received already a full satisfaction for the sins of all those that embrace Christ Jesus as the only Saviour of the world. What remains, then, to us to be done? Nothing but to acknowledge our misery and wretchedness, which no flesh can do so unfeignedly as they that daily feel the weight of sin. And other cause have we none of despair, albeit the devil rage ever so cruelly, and albeit the flesh be ever so frail, daily and hourly lusting against God’s holy commandments, yea, striving against the same.

This is not the time of righteousness before our own eyes; we look for that which is promised — the kingdom everlasting, prepared for us from the beginning, whereof we are made heirs by God’s appointment, receiving legitimation thereto by Christ’s death, to whom we shall be gathered, when afterwards we shall never depart, — which to remember is my singular comfort, but thereof now I cannot write. My commendations to all to whom they are due. I commit you to the protection of the Omnipotent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Knox s Letters to his Friends. Letter First. To his Mother-in-Law, Mrs Bowes, 23 June 1553’, Christian Miscellany</cite></span></figcaption>

</figure><figure class="quote" id="q-2e1639a41a" data-kw="">
<blockquote><p>Closely connected with this excellence of the Confession of Faith is its astonishing precision of thought and language. The whole mental training of the eminent divines of that period led to this result. They were accustomed to cast every argument into the syllogistic form, and to adjust all its terms with the utmost care and accuracy. Every one who has studied the propositions of the Confession must have remarked their extreme precision; but, without peculiar attention, he may not perceive the astonishing care which these divines must have bestowed on this part of their great work. This may be best shown by an instance. Let us select one from chapter iii., “On God’s Eternal Decree,” sections 3 and 4: “By the decree of God, for the manifestation of his glory, some men and angels are predestinated unto everlasting life, and others foreordained to everlasting death. These angels and men thus predestinated and foreordained,” &amp;c.

The expressions to which we wish to draw the reader’s attention are the words predestinated and foreordained, A hasty or superficial reader might perceive no difference between these words. But, if so, why are they both used? for there is no instance or mere tautological repetition in the concise language of the Confession. But, further, let it be well remarked that the word “predestinated” is used only in connection with “everlasting life,” and the word “foreordained” with ” everlasting death.” And when the compound form of the proposition is assumed, both terms are used to represent each its respective member in the general affirmation. Why is this the case? Because the Westminster Divines did not understand the meaning of the terms predestination and foreordination to be identical, and therefore never used these words as synonymous.

By predestination they meant a positive decree determining to confer everlasting life; and this they regarded as the basis of the whole doctrines of free grace, arising from nothing in man, but having for its divine origin the character and sovereignty of God. By foreordination, on the other hand, they meant a decree of order, or arrangement, determining that the guilty should he condemned to everlasting death; and this they regarded as the basis of judicial procedure, according to which God “ordains men to dishonour and wrath for their sin,” and having respect to man’s own character and conduct.

Let it be further remarked, that while, according to this view, the term predestination could never with propriety be applied to the lost, the term foreordination might be applied to the saved, since they also are the subjects, in one sense, of judicial procedure. Accordingly there is no instance in the Confession of Faith where the term predestination is applied to the lost, though there are several instances where the term foreordination, or a kindred term, is applied to the saved. And let this also be marked, that the term reprobation, which is so liable to be misunderstood and applied in an offensive sense to the doctrine of predestination, is not even once used in the Confession of Faith and the Larger and Shorter Catechisms.

Later writers on that doctrine have indeed employed that word, as older writers had done, and had thereby furnished occasion to the opponents of the doctrine to misrepresent it; but the Westminster Divines cautiously avoided the use of an offensive term, carefully selected such words as were best fitted to convey their meaning, and in every instance used them with the most strict and definite precision. Many other examples might be given of the remarkable accuracy of thought and language which forms a distinguished characteristic of the Confession of Faith; but we must content ourselves with suggesting the line of investigation, leaving it to every reader to prosecute it for himself.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Closely connected with this excellence of the Confession of Faith is its astonishing precision of thought and language. The whole mental training of the eminent divines of that period led to this result. They were accustomed to cast every argument into the syllogistic form, and to adjust all its terms with the utmost care and accuracy. Every one who has studied the propositions of the Confession must have remarked their extreme precision; but, without peculiar attention, he may not perceive the astonishing care which these divines must have bestowed on this part of their great work. This may be best shown by an instance. Let us select one from chapter iii., “On God’s Eternal Decree,” sections 3 and 4: “By the decree of God, for the manifestation of his glory, some men and angels are predestinated unto everlasting life, and others foreordained to everlasting death. These angels and men thus predestinated and foreordained,” &amp;c.

The expressions to which we wish to draw the reader’s attention are the words predestinated and foreordained, A hasty or superficial reader might perceive no difference between these words. But, if so, why are they both used? for there is no instance or mere tautological repetition in the concise language of the Confession. But, further, let it be well remarked that the word “predestinated” is used only in connection with “everlasting life,” and the word “foreordained” with ” everlasting death.” And when the compound form of the proposition is assumed, both terms are used to represent each its respective member in the general affirmation. Why is this the case? Because the Westminster Divines did not understand the meaning of the terms predestination and foreordination to be identical, and therefore never used these words as synonymous.

By predestination they meant a positive decree determining to confer everlasting life; and this they regarded as the basis of the whole doctrines of free grace, arising from nothing in man, but having for its divine origin the character and sovereignty of God. By foreordination, on the other hand, they meant a decree of order, or arrangement, determining that the guilty should he condemned to everlasting death; and this they regarded as the basis of judicial procedure, according to which God “ordains men to dishonour and wrath for their sin,” and having respect to man’s own character and conduct.

Let it be further remarked, that while, according to this view, the term predestination could never with propriety be applied to the lost, the term foreordination might be applied to the saved, since they also are the subjects, in one sense, of judicial procedure. Accordingly there is no instance in the Confession of Faith where the term predestination is applied to the lost, though there are several instances where the term foreordination, or a kindred term, is applied to the saved. And let this also be marked, that the term reprobation, which is so liable to be misunderstood and applied in an offensive sense to the doctrine of predestination, is not even once used in the Confession of Faith and the Larger and Shorter Catechisms.

Later writers on that doctrine have indeed employed that word, as older writers had done, and had thereby furnished occasion to the opponents of the doctrine to misrepresent it; but the Westminster Divines cautiously avoided the use of an offensive term, carefully selected such words as were best fitted to convey their meaning, and in every instance used them with the most strict and definite precision. Many other examples might be given of the remarkable accuracy of thought and language which forms a distinguished characteristic of the Confession of Faith; but we must content ourselves with suggesting the line of investigation, leaving it to every reader to prosecute it for himself.”

— William Hetherington, Introductory Essay in Robert Shaw, An Exposition of the Confession of Faith of the Westminster Assembly of Divines">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CClosely+connected+with+this+excellence+of+the+Confession+of+Faith+is+its+astonishing+precision+of+thought+and+language.+The+whole+mental+training+of+the+eminent+divines+of+that+period+led+to+this+result.+They+were+accustomed+to+cast+every+argument+into+the+syllogistic+form%2C+and+to+adjust+all+its+terms+with+the+utmost+care+and+accuracy.+Every+one+who+has+studied+the+propositions+of+the+Confession+must+have+remarked+their+extreme+precision%3B+but%2C+without+peculiar+attention%2C+he+may+not+perceive+the+astonishing+care+which+these+divines+must+have+bestowed+on+this+part+of+their+great+work.+This+may+be+best+shown+by+an+instance.+Let+us+select+one+from+chapter+iii.%2C+%E2%80%9COn+God%E2%80%99s+Eternal+Decree%2C%E2%80%9D+sections+3+and+4%3A+%E2%80%9CBy+the+decree+of+God%2C+for+the+manifestation+of+his+glory%2C+some+men+and+angels+are+predestinated+unto+everlasting+life%2C+and+others+foreordained+to+everlasting+death.+These+angels+and+men+thus+predestinated+and+foreordained%2C%E2%80%9D+%26c.%0A%0AThe+expressions+to+which+we+wish+to+draw+the+reader%E2%80%99s+attention+are+the+words+predestinated+and+foreordained%2C+A+hasty+or+superficial+reader+might+perceive+no+difference+between+these+words.+But%2C+if+so%2C+why+are+they+both+used%3F+for+there+is+no+instance+or+mere+tautological+repetition+in+the+concise+language+of+the+Confession.+But%2C+further%2C+let+it+be+well+remarked+that+the+word+%E2%80%9Cpredestinated%E2%80%9D+is+used+only+in+connection+with+%E2%80%9Ceverlasting+life%2C%E2%80%9D+and+the+word+%E2%80%9Cforeordained%E2%80%9D+with+%E2%80%9D+everlasting+death.%E2%80%9D+And+when+the+compound+form+of+the+proposition+is+assumed%2C+both+terms+are+used+to+represent+each+its+respective+member+in+the+general+affirmation.+Why+is+this+the+case%3F+Because+the+West <blockquote><p>In the following extract, John Knox explains that the civil magistrate is to rule according to scripture alone. Libertarian Theologians and the advocates of Two-Kingdoms establishmentarianism agree that the role of the state is determined by the word of God. They differ, however, when it comes to determining precisely what the role of the state is. Upon first reading, we might be tempted to think that Knox’s argument supports Libertarian Theology; for this reason, footnotes have been added to elucidate Knox’s meaning:

St Paul in few words declareth the end wherefore the sword is committed to the powers, saying, it is ‘to the punishment of the the wicked doers, and to the praise of such as do well’ (Rom. 13). Of which words it is evident, that the sword of God is not committed to the hand of man, to use as it pleaseth him; but only, to punish vice, maintain virtue,[1] that men may live in such society as before God is acceptable. And this is the very and only cause why God hath appointed powers in this earth. For such is the furious rage of man’s corrupt nature, that unless severe punishment were appointed, and put in execution upon malefactors, better it were that man should live among brute and wild beasts, than among men. But at present, I dare not enter into the description of this common-place, for so should I not satisfy the text, which by God’s grace I purpose to absolve [open up]. This only by the way I would, that such as are placed in authority, should consider, whether they reign and rule by God, so that God ruleth them; or, if they rule without, besides, and against God; of whom our prophet here doth complain.

If any lust to take trial of this point, it is not hard; for Moses in the election of judges, and of a king, describeth not only what persons shall be chosen to that honour, but doth also give to him that is elected and chosen, the rule, by the which he shall try himself whether God reign in him or not; saying, ‘When he shall sit upon the throne of his kingdom, he shall write to himself an exemplar of this law in a book, but the priests the Levites: it shall be with him, and he shall read therein all the days of his life, that he may learn to fear the Lord his God, and to keep all the words of this law, and these statutes, that he may do them; that his heart be not lifted up above his brethren, and that he turn not from the commandment, to the right hand, or to the left (Deut. 17). The same is repeated to Joshua, in his inauguration to the government of the people, by God himself, saying, ‘Let not the book of this law depart from thy mouth, but mediate in it day and night, that thou mayest keep and do all that which is written in it. For then shall thy way be prosperous, and thou shalt do prudently’ (Josh. 1).[2]

The first thing then that God craveth of him that is called to the honour of a king, is, the knowledge of his will revealed in his Word: the second, is an upright and willing mind to put in execution such things as God commandeth in his law, without declining either to the right hand or to the left.

Kings then have not absolute power to do in their regiment what pleaseth them; but their power is limited by God’s Word. So that if they strike where God commandeth not, they are but murderers; and if, they spare, where God commandeth to strike, they and their throne are criminal, and guilty of the wickedness that aboundeth upon the face of the earth for lack of punishment. Oh, if kings and princes would consider what account shall be craved of them, as well of their ignorance and misknowledge of God’s will, as for the neglecting of their office!</p></blockquote>

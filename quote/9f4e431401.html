<blockquote><p>And in all deceivableness of unrighteousness, among them that perish, because they received not the love of the truth, that they might be saved (2 Thessalonians 2:10 Geneva Bible)

Let us not think Popery a light thing, which the Lord so peremptorily threateneth. Surely it is no little mercy that we are freed from it. Therefore we should be thankful for the light we have, and improve it well while we have it, and hold it fast. What hope soever we may have of men living in former times, and foreign countries, where they know no better, but after such express warnings, what hope can we have of English papists, considering the time, when Rome is not grown better but worse, and what was common opinion is now made an article of faith, and when the truth is taught and so clearly manifested; so that for any, by their own voluntary choice, to run into Popery, is a plain defection from Christ to Antichrist, and wilfully to drink that poison which will be the bane and ruin of their souls!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome</cite>, (1679) in The complete works of Thomas Manton, D.D. (22 vols, London, 1871), iii, 79.</span></figcaption>

<blockquote><p>”28. So great is the peace and comfort of many parishes where the public ministers and all the religious people live together in love and amity that it loudly tells us how much better that is than to study to render each other odious, or vile and excommunicable. …

37. To hold that any congregations are such whose worship is faulty, but such as God forgives and accepts, but that it is unlawful for us to join with them, lest it make us guilty of their sin, this (though it should be erroneous, and uncharitable and sinful) yet is not to excommunicate that congregation as no Church or no Christians. But to say of any congregation that they want [lack] anything essential to Christianity or to make them capable to be loved as Christians, or that their worship of God is idolatry, or so bad as that God accepts it not, the evil of it being greater than the good (as poison in our food), and on this reason to declare that no good Christian should communicate with them, this is to excommunicate such [a] congregation, as far as one Church may excommunicate another, which is but by such renouncing their communion.² ² [An equivalent example of this is in 1 Kings 13:1-10.]

38. There is no history that I have seen or heard that tells us of any Churches on earth that for many hundred years together did worship God without a liturgy as faulty as ours: To make them all idolaters, and such whose worship God cursed and accepted not, is to make them no true Churches… and if Christ had no Church, He was no Head and King of it, and so no Christ.</p></blockquote>

<blockquote><p>‘Sing to the Lord, O ye his saints.’ Not if someone utters the words of the psalm with his mouth, does that one sing to the Lord; but, all who send up the psalmody from a clean heart, and who are holy, maintaining righteousness toward God, these are able to sing to God, harmoniously guided by the spiritual rhythms.

How many stand there, coming from fornication? How many from theft? How many concealing in their hearts deceit? How many lying? They think they are singing, although, in truth they are not singing. For, the Scripture invites the saint to the singing of psalms. ‘A bad tree cannot bear good fruit.’ nor a bad heart utter words of life. Therefore, ‘make the tree good and its fruits good.’ Cleanse your hearts, in order that you may bear fruit in the spirit and may be able, after becoming saints, to sing psalms intelligently to the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-basil.html">Basil of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily 14 on Psalm 29</cite>, 3 in Saint Basil’s Exegetic Homilies, trans. Agnes Clare Way in The Fathers of the Church: A New Translation, Volume 46 (Washington DC, 1963), pp 217-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>[Margin Note:] The uncovering of the head not like kneeling We uncover our heads, say they, when we receive the elements, why may we not also kneel? I answer: First, the uncovering of the head is a gesture of reverence only, and that only among some nations, but not of adoration. The Jews, Turks and Mahometans pray with their heads covered. The Grecians and Romans of old, howbeit they walked in public with uncovered heads, except in rain, great heat or mourning, yet in the service of their gods, they had their heads covered. The Europeans this day uncover their heads when they are praying. Kneeling is a gesture of adoration among all nations, either in civil or religious use. Augustine says: ‘Honorat emnis qui adorat, no autem adorat omnes quid onorat;’ ‘Every one that does adore, does honor, but not every one that honors, adores.’ Contra Serm. Arian., ch. 23 I will not kneel to every one to whom I uncover my head civilly. Everyone that stands with his head uncovered in presence of the king is not adoring, as he is who is presenting his petition to the king upon his knee in their sight. A provincial synod holden at London (anno 1603) ordained the head to be uncovered when their service is read in the Church, yet I think they would not have enjoined kneeling. We [the Scots] hear the canonical scripture read [in the administration of the Lord’s Supper] with uncovered heads, but yet we kneel not. The words of Christ, which He uttered at the institution are still and often uttered; that same voice sounds through all the tables of the world; his actions, which were divine and holy, are reiterat[ed]. In Gratian’s decree (De consecrat. dist. 1, ch. 68) we have a superstitious direction of Pope Anastasius, that when the Gospel is read in the Church, those that are present shall not sit, but stand, venerabiliter curvi, bowing reverently, hearken and adore. Wherefore more at the hearing of the Gospel than the [reading of the] Epistle[s], which is also Evangelical? Yet you see, howbeit that standing with bowing be more than to have the head uncovered, it was but veneration. And, whereas he says, Et fideliter adorent, the gloss has, id est venerentur, because the word ‘adoring’ is taken there in a large sense, as ye may see [in] sundry places above cited, not for that which is in a strict sense called adoration. Adoration in strict sense is kneeling or prostration. Whereas Matthew says, ch. 8, of the leprous man, that he worshipped Christ, or adored Christ, as the Latin translation has according to the original, Mk. 1:40, He kneeled down to Him, and Luke 5:12, that he fell in his face. Suchlike, where it is said of the Cananitish woman, Mt. 15:25, that she worshipped, or adored Him: et adoravit eum, Mk. 7:25, it is said that she fell at his feet. The Greek word [Greek], signifies to fall down like a dog o••whelp at the feet of another, as our Lord. Further, our heads are not other way uncovered in the act of receiving than in the rest of the time of the celebration when we are not near the elements. And thirdly, the uncovering of our head is compatible with the variety of actions in time of celebration: praying, singing, the words of the institution, and chapters read, but adoration directed, as they pretend to God, cannot be without presenting our petitions and thanks to God, which requires a several part of the action by itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Re-examination of the Five Articles enacted at Perth, anno 1618</cite>, … (1636), Of the Communicants’ gesture in the act of receiving, eating and drinking’, 4th Part, ch. 5, ‘Kneeling in the act of receiving the sacramental elements of the supper is idolatry’, pp. 104-6</span></figcaption>

<div class="actions"><button class="copy" data-copy="“[Margin Note:] The uncovering of the head not like kneeling We uncover our heads, say they, when we receive the elements, why may we not also kneel? I answer: First, the uncovering of the head is a gesture of reverence only, and that only among some nations, but not of adoration. The Jews, Turks and Mahometans pray with their heads covered. The Grecians and Romans of old, howbeit they walked in public with uncovered heads, except in rain, great heat or mourning, yet in the service of their gods, they had their heads covered. The Europeans this day uncover their heads when they are praying. Kneeling is a gesture of adoration among all nations, either in civil or religious use. Augustine says: ‘Honorat emnis qui adorat, no autem adorat omnes quid onorat;’ ‘Every one that does adore, does honor, but not every one that honors, adores.’ Contra Serm. Arian., ch. 23 I will not kneel to every one to whom I uncover my head civilly. Everyone that stands with his head uncovered in presence of the king is not adoring, as he is who is presenting his petition to the king upon his knee in their sight. A provincial synod holden at London (anno 1603) ordained the head to be uncovered when their service is read in the Church, yet I think they would not have enjoined kneeling. We [the Scots] hear the canonical scripture read [in the administration of the Lord’s Supper] with uncovered heads, but yet we kneel not. The words of Christ, which He uttered at the institution are still and often uttered; that same voice sounds through all the tables of the world; his actions, which were divine and holy, are reiterat[ed]. In Gratian’s decree (De consecrat. dist. 1, ch. 68) we have a superstitious direction of Pope Anastasius, that when the Gospel is read in the Church, those that are present shall not sit, but stand, venerabiliter curvi, bowing reverently, hearken and adore. Wherefore more at the hearing of the Gospel than the [reading of the] Epistle[s], which is also Evangelical? Yet you see, howbeit that standing with bowing be more than to have the head uncovered, it was but veneration. And, whereas he says, Et fideliter adorent, the gloss has, id est venerentur, because the word ‘adoring’ is taken there in a large sense, as ye may see [in] sundry places above cited, not for that which is in a strict sense called adoration. Adoration in strict sense is kneeling or prostration. Whereas Matthew says, ch. 8, of the leprous man, that he worshipped Christ, or adored Christ, as the Latin translation has according to the original, Mk. 1:40, He kneeled down to Him, and Luke 5:12, that he fell in his face. Suchlike, where it is said of the Cananitish woman, Mt. 15:25, that she worshipped, or adored Him: et adoravit eum, Mk. 7:25, it is said that she fell at his feet. The Greek word [Greek], signifies to fall down like a dog o••whelp at the feet of another, as our Lord. Further, our heads are not other way uncovered in the act of receiving than in the rest of the time of the celebration when we are not near the elements. And thirdly, the uncovering of our head is compatible with the variety of actions in time of celebration: praying, singing, the words of the institution, and chapters read, but adoration directed, as they pretend to God, cannot be without presenting our petitions and thanks to God, which requires a several part of the action by itself.”

— David Calderwood, A Re-examination of the Five Articles enacted at Perth, anno 1618, … (1636), Of the Communicants’ gesture in the act of receiving, eating and drinking’, 4th Part, ch. 5, ‘Kneeling in the act of receiving the sacramental elements of the supper is idolatry’, pp. 104-6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BMargin+Note%3A%5D+The+uncovering+of+the+head+not+like+kneeling+We+uncover+our+heads%2C+say+they%2C+when+we+receive+the+elements%2C+why+may+we+not+also+kneel%3F+I+answer%3A+First%2C+the+uncovering+of+the+head+is+a+gesture+of+reverence+only%2C+and+that+only+among+some+nations%2C+but+not+of+adoration.+The+Jews%2C+Turks+and+Mahometans+pray+with+their+heads+covered.+The+Grecians+and+Romans+of+old%2C+howbeit+they+walked+in+public+with+uncovered+heads%2C+except+in+rain%2C+great+heat+or+mourning%2C+yet+in+the+service+of+their+gods%2C+they+had+their+heads+covered.+The+Europeans+this+day+uncover+their+heads+when+they+are+praying.+Kneeling+is+a+gesture+of+adoration+among+all+nations%2C+either+in+civil+or+religious+use.+Augustine+says%3A+%E2%80%98Honorat+emnis+qui+adorat%2C+no+autem+adorat+omnes+quid+onorat%3B%E2%80%99+%E2%80%98Every+one+that+does+adore%2C+does+honor%2C+but+not+every+one+that+honors%2C+adores.%E2%80%99+Contra+Serm.+Arian.%2C+ch.+23+I+will+not+kneel+to+every+one+to+whom+I+uncover+my+head+civilly.+Everyone+that+stands+with+his+head+uncovered+in+presence+of+the+king+is+not+adoring%2C+as+he+is+who+is+presenting+his+petition+to+the+king+upon+his+knee+in+their+sight.+A+provincial+synod+holden+at+London+%28anno+1603%29+ordained+the+head+to+be+uncovered+when+their+service+is+read+in+the+Church%2C+yet+I+think+they+would+not+have+enjoined+kneeling.+We+%5Bthe+Scots%5D+hear+the+canonical+scripture+read+%5Bin+the+administration+of+the+Lord%E2%80%99s+Supper%5D+with+uncovered+heads%2C+but+yet+we+kneel+not.+The+words+of+Christ%2C+which+He+uttered+at+the+institution+are+still+and+often+uttered%3B+that+same+voice+sounds+through+all+the+tables+of+the+world%3B+his+actions%2C+which+were+divine+and+holy%2C+are+reiterat%5Bed%5D.+In+Gratian%E2%80%99s+decree+%28De+consecrat.+dist.+1%2C+ch.+68%29+we+have+a+superstitious+direction+of+Pope+Anastasius%2C+that+when+the+Gospel+is+read+in+the+Church%2C+those+that+are+present+shall+not+sit%2C+but+stand%2C+venerabiliter+curvi%2C+bowing+reverently%2C+hearken+and+adore.+Wherefore+more+at+the+hearing+of+the+Gospel+than+the+%5Breading+of+the%5D+Epistle%5Bs%5D%2C+which+is+also+Evangelical%3F+Yet+you+see%2C+howbeit+that+standing+with+bowing+be+more+than+to+have+the+head+uncovered%2C+it+was+but+veneration.+And%2C+whereas+he+says%2C+Et+fideliter+adorent%2C+the+gloss+has%2C+id+est+venerentur%2C+because+the+word+%E2%80%98adoring%E2%80%99+is+taken+there+in+a+large+sense%2C+as+ye+may+see+%5Bin%5D+sundry+places+above+cited%2C+not+for+that+which+is+in+a+strict+sense+called+adoration.+Adoration+in+strict+sense+is+kneeling+or+prostration.+Whereas+Matthew+says%2C+ch.+8%2C+of+the+leprous+man%2C+that+he+worshipped+Christ%2C+or+adored+Christ%2C+as+the+Latin+translation+has+according+to+the+original%2C+Mk.+1%3A40%2C+He+kneeled+down+to+Him%2C+and+Luke+5%3A12%2C+that+he+fell+in+his+face.+Suchlike%2C+where+it+is+said+of+the+Cananitish+woman%2C+Mt.+15%3A25%2C+that+she+worshipped%2C+or+adored+Him%3A+et+adoravit+eum%2C+Mk.+7%3A25%2C+it+is+said+that+she+fell+at+his+feet.+The+Greek+word+%5BGreek%5D%2C+signifies+to+fall+down+like+a+dog+o%E2%80%A2%E2%80%A2whelp+at+the+feet+of+another%2C+as+our+Lord.+Further%2C+our+heads+are+not+other+way+uncovered+in+the+act+of+receiving+than+in+the+rest+of+the+time+of+the+celebration+when+we+are+not+near+the+elements.+And+thirdly%2C+the+uncovering+of+our+head+is+compatible+with+the+variety+of+actions+in+time+of+celebration%3A+praying%2C+singing%2C+the+words+of+the+institution%2C+and+chapters+read%2C+but+adoration+directed%2C+as+they+pretend+to+God%2C+cannot+be+without+presenting+our+petitions+and+thanks+to+God%2C+which+requires+a+several+part+of+the+action+by+itself.%E2%80%9D%0A%0A%E2%80%94+David+Calderwood%2C+A+Re-examination+of+the+Five+Articles+enacted+at+Perth%2C+anno+1618%2C+%E2%80%A6+%281636%29%2C+Of+the+Communicants%E2%80%99+gesture+in+the+act+of+receiving%2C+eating+and+drinking%E2%80%99%2C+4th+Part%2C+ch.+5%2C+%E2%80%98Kneeling+in+the+act+of+receiving+the+sacramental+elements+of+the+supper+is+idolatry%E2%80%99%2C+pp.+104-6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdd014bbafa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dd014bbafa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-post-reformation-scottish-church-on-head-coverings-in-public-worship/#:~:text=Margin%20Note%3A%5D%20The%20uncovering%20of%20the,part%20of%20the%20action%20by%20itself&amp;text=Margin%20Note%3A%5D%20The%20uncovering%20of%20the%20head%20not&amp;text=a%20several%20part%20of%20the%20action%20by%20itself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>43. There are, however, exceptions. First, all those works are permitted which are part of honorable conduct. At all times we ought to live and act honestly and decently, and especially on the day dedicated to divine worship. All things which look simply to this are clearly allowed. Second, those things are permitted which are imposed upon us by special necessity, Matt. 12:11. We should eliminate all those things which men make or pretend to make necessary. But there are still those which in the providence of God are unexpected, necessary, and unavoidable, e.g., when a necessity allowed by the Scripture is present as a sufficient cause for doing ordinary work. Third, all work is permitted which directly affects the worship and glory of God, Matt. 12:5; John 5:8,9. For such work which of its own nature is servile passes into the nature of a holy work and is not properly our work but God’s.</p></blockquote>

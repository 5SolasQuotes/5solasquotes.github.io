<main class="wrap"><figure class="quote" id="q-65c6534128" data-kw="">
<blockquote><p>The doctrine of hypothetical universalism acted as a corrosive factor in the French Reformed Church. Tolerated at first because it was felt that an outright condemnation would lead to schism, it slowly undermined respect for the confessional standards and disrupted internal unity and cohesion… it did provide a bridge toward Arminianism and perhaps toward the Semi-Pelagian tendencies of the Church of Rome. The advantages that Amyraut had envisioned failed to materialize, and the dangers against which his opponents had warned did in fact eventuate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roger-nicole.html">Roger Nicole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Standing Forth: Collected Writings of Roger Nicole (Mentor, 2018)</cite>, p. 326</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-ad2f535dcd" data-kw="">
<blockquote><p>Now for the clearing of the truth of this, when we say Christ died for us, the meaning is that Christ died for our benefit. Now these benefits which Christ procured unto us by his death, it may be they are of different conditions, whereof some are ordained to be conferred only conditionally, and some absolutely. And therefore it is fit we should consider them apart. As for example it is without question (I suppose) that Christ died to procure pardon of sin and salvation of soul, but how absolutely, whether men believe or no? Nothing less, but only conditionally, to wit, that for Christ’s sake their sins shall be pardoned and their souls saved, provided they do believe in Him. Now I willingly confess that Christ died for all in respect of procuring these benefits, to wit conditionally, upon the condition of their faith, in such sort that if all and every one should believe in Christ, all and every one should obtain the pardon of their sins and salvation of their souls for Christ’s sake. And I presume that no Arminian on the other side will affirm that Christ in such sort died for all and every one that all and every one should have their sins pardoned and their souls saved for Christ’s sake, whether they believe or no. What cause then is there of any difference between us on this point, thus explicated. Yet hereby it is manifest that the benefit of remission of sins and salvation of souls for Christ’s sake, shall in the end redound to none but such as believe, as this Author seems to acknowledge. But come we to faith itself and regeneration, are these benefits redounding unto us by the merits of Christ, yea or no?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Synod of Dort &amp; Arles Reduced to the Practice… (Amsterdam, 1631), 3rd Part | 1st Section</cite>, pp. 143-44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-e1cdea8129" data-kw="">
<blockquote><p>Also, it should be pointed out again that the doctrinal difference between the Saumur theologians and Turretin do not involve any of the fundamental tenets of the Reformed faith. Turretin himself mentions this fact in a letter to Jean Claude which we shall consider later in this thesis. As we have seen various times in this chapter, Turretin refers to the Salmurians as fellow Reformed pastors and theologians, and the Salmurians certainly view themselves as being within the Reformed tradition. In fact, Amyraut goes to great lengths in attempting to prove that the orthodox Reformed theologians are in agreement with him. Thus, even though this controversy was a serious and lengthy one, nevertheless it was entirely an internal dispute within the Reformed churches concerning non-fundamental matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/donald-davis-grohman.html">Donald Davis Grohman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Genevan Reactions to the Saumur Doctrines of Hypothetical Universalism: 1635-1685 Th.D. diss. (Knox College in cooperation with Toronto School of Theology, 1971)</cite>, p. 120</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

<blockquote><p>They [believers] see all the perfections of God meeting and kissing each other most sweetly in Christ as the Surety, made perfect through suffering in the way of lost sinners’ salvation, so that mercy and truth here meet together, and righteousness and peace have kissed each other; this is most worthy of all adoration, that since the habitation of Jehovah’s throne is justice, satisfied by the execution of judgment upon the Substitute, now mercy and truth go out from His presence unto the sinner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-comrie.html">Alexander Comrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ABC of Faith</cite>, trans. J. Marcus Banfield (1746; Ossett: Zoar Publications, 1978), p. 106.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e2e17d4f76" data-kw="">
<blockquote><p>The divine attributes are certain essential properties, which God is pleased in Scripture to ascribe or attribute unto Himself; they are also called the perfections of God, or divine predications or titles. They are not distinguished from the essence really, but notionally; that is, they are not distinguished at all in God, but only to us-ward, according to our manner of conceiving. All the attributes in God are one and the same perfection. It is better said of God that He is his attributes than that He has attributes: The attributes are not distinguished in God, but in our manner of understanding, who, being unable to comprehend that mere act at once, do conceive thereof after the manner of many acts. (Est inadequatus conceptus sed non falsus [It is an inadequate concept, but not false]. See Weems, Of the Image of God in Man, ch. 13) The sun, when it is perpendicular, had it an eye, would behold all that at once which we, by reason of the inadequateness and unproportionableness of our sight, are necessitated to view by parts. In God all things are one and the same, according to the nature of God; though out of God [they appear] many and diverse, according to their own proper and created nature. The same heat in the sun produces diverse effects according to the various disposition of the objects: hardness in clay, softness in wax, life in insects and plants, etc. The same lines are one in the center, but distinguished and multiplied in the circumference. Water that is the same in the sea, out of the sea is variously and diversely qualified: sweet, bitter, sulfureous, etc. The matter in the liver is the same but the four humors of blood, choller, melancholy and phlegm that proceed from thence are very diverse. The soul which is one and the same produces very differing effects, as appears in the operations of the understanding, will, and affections. The sum is: The attributes, as was said before, are not distinguished in God, that is, from the divine essence or one from another really, but only notionally or virtually in our conception and in their objects in respect of the various effects thereupon: For every and all the attributes are the divine essence itself, according to that received proposition, ‘Whatsoever is in God, is God.’ (Fenner, Theol., bk. 1, ch. 3; Alsted, Theol., sect. 3, locus 2; Zanchi, Of the Nature of God, bk. 2, ch. 5, quest. 2) And this is the reason why some well describe the attributes from the essence of God: which manner of description, besides many useful notions clearly intimated thereby, does in the describing of the relative attributes, principle and fortify the understanding against that perilous tenet of Arminianism concerning the decree passing upon good or bad foreseen, with the evil consequences following thereupon. The divine attributes, though they can neither exactly be numbered or distributed, yet for our better understanding we may consider of them as Negative, Relative, Positive. … That God is a pure and simple act without all composition, is evident, because of his perfection; all composition supposes imperfection, because He is the first Being. Were there any composition in God, it would follow there were first and second in God: Something in God that were not first, or that there were more first Beings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 3-5</span></figcaption>

" href="../quote/e2e17d4f76.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-divine-simplicity/#:~:text=The%20divine%20attributes%20are%20certain%20essential,that%20there%20were%20more%20first%20Beings&amp;text=The%20divine%20attributes%20are%20certain%20essential%20properties%2C%20which&amp;text=first%2C%20or%20that%20there%20were%20more%20first%20Beings" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We say nothing different from that which Scripture says.—But in a Divine nature, as such, when once we have believed in it, we can recognize no distinctions suggested either by the Scripture teaching or by our own common sense; distinctions, that is, that would divide that Divine and transcendent nature within itself by any degrees of intensity and remission, so as to be altered from itself by being more or less.

Because we firmly believe that it is simple, uniform, incomposite, because we see in it no complicity or composition of dissimilars, therefore it is that, when once our minds have grasped the idea of Deity, we accept by the implication of that very name the perfection in it of every conceivable thing that befits the Deity. Deity, in fact, exhibits perfection in every line in which the good can be found. If it fails and comes short of perfection in any single point, in that point the conception of Deity will be impaired, so that it cannot, therein, be or be called Deity at all; for how could we apply that word to a thing that is imperfect and deficient, and requiring an addition external to itself? …

So Deity, as long as it possesses perfection throughout all the properties that devotion may attach to it, by virtue of this perfection in everything good does not belie its name; but if any one of those things that contribute to this idea of perfection is subtracted from it, the name of Deity is falsified in that particular, and does not apply to the subject any longer. It is equally impossible to apply to a dry substance the name of water, to that whose quality is a state of coolness the name of fire, to stiff and hard things the name of air, and to call that thing Divine which does not at once imply the idea of perfection; or rather the impossibility is greater in this last case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-nyssen.html">Gregory of Nyssa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Holy Spirit. Against the Followers of Macedonius</cite>, (c. 380) in Nicene and Post-Nicene Fathers 2, 5: 316.</span></figcaption>

<blockquote><p>10. What all the more rigid Protestants affirm for certain, that God, though not in time, yet in the order of nature, first justifies the sinner, or forgives his sins, and afterwards makes him just, or sanctifies him, let them look well to it, I pray, lest perchance they too audaciously and rashly define the order of the divine actions, which has not been manifestly revealed in the Scriptures. In the [Romanist] schools themselves there has been no small contention on this subject, nor is it yet decided: ‘Whether the infusion of grace,’ says [Thomas] Stapleton (Of Justification, bk. 5, ch. 8, sect. Rursum), ‘precedes the forgiveness of sins in the order of nature, as St. Thomas lays down… or whether the contrary be true, as others most strenuously maintain, is rather a scholastic question than one now-a-days controverted, and is one on which neither formerly nor now has the Church defined anything on either side.’ The moderation of Theodore Beza in this matter, in other respects sufficiently rigid, is much to be approved of. He thus writes (Demonstrations against Flacius Illyricus and his Apology, sect. 22, Rursum quaero, tome 2, p. 218 (or p. 171)): ‘If you take justification in a general sense, as it is sometimes used by the apostle, sanctification will not be an effect, but a part or species of it; but if merely for the gift of imputed justice, or the gratuitous forgiveness of sins, than sanctification will be another gift, which always follows that first gift, since whoever is justified gratis in Christ is also sanctified by His Spirit… Nor need we here contend much which of the two precedes in order, since in one and the same moment Christ… justifies us, and by his Spirit begins to sanctify us.’ and (p. 237, sect. 23, Praeterea quum (or p. 185)): ‘When I had said what is quite true, that, provided it is allowed that we must first of all be made partakers of Christ Himself, that in Him we may be justified and sanctified, we need not labor much to find which of these two precedes in order. lIllyricus brings forward against me Calvin, who says (Antidote to the Council of Trent, sess. 6, sect. Neque tamen interea, tome 8, p. 241) that, ‘as soon as any one is justified, renewal also necessarily follows.’ But Calvin here refuting the decisions of the Council of Trent, by which justification is confounded with the gift of sanctification, is not disputing about the order or series of these two, but of their connection; and therefore says, that ‘if anyone is justified renewal also follows, i.e., that it is necessarily concluded that, if any one be justified, he may also be said to be sanctified. But, I pray you, if I say, ‘If anyone lives, it follows that he is endowed with a soul,’ will it be rightly concluded from thence that I make the being endowed with a soul something posterior to life?’ and (p. 238 (or p. 186) around the end, sect. Ego vero inhabitationem) ‘I say that we are simultaneously justified and renewed in Christ, united and applied to us by faith; and I think that we need not trouble ourselves in anyway to determine whether this one or that precedes in order, since we never receive the one without the other, etc.’ Would that this moderation were religiously followed, not only by the more rigid Protestants, but also by very many other theologians of both parties, who now-a-days excite so many and so great disturbanees in the Church about the mode and order of the divine operations.</p></blockquote>

<blockquote><p>But here again it is objected, that all the corruptions of the Church are not to be corrected by such harsh remedies — that they are not to be cut in to the quick — that not even is medicine to be applied to all, but some are to be treated gently, and others submitted to, if they cannot without difficulty be removed.

I answer, that we are not so unacquainted with ordinary life as not to know that the Church always has been, and always will be, liable to some defects which the pious are indeed bound to disapprove, but which are to be borne rather than be made a cause of fierce contention.

But our adversaries are unjust when they accuse us of being excessively morose, as if we had brought the Church into trouble on account of small and trivial errors. For to their other misrepresentations they add this one also, of endeavouring, by every artifice in their power, to extenuate the importance of the things which we have made the subject of controversy; the object being to make it seem that we have been hurried on by a love of quarrelling, and not that we were drawn into it by a just cause. This they do, not in ignorance, but with cunning design, namely, because they know that there is nothing more odious than the rash haste which they impute to us.

And yet they, at the same time, betray their own impiety in speaking so contemptuously of matters of the greatest moment. And is it indeed so, that when we complain that the worship of God was profaned — that His honour was utterly impaired — that the doctrine of salvation was entangled with numerous destructive errors — that the virtue of Christ’s death was suppressed — and that, in short, all things sacred were sacrilegiously polluted; is it indeed so, that we are to be derided and charged with the folly of disturbing ourselves and the whole world besides, to no purpose, with disputes about insignificant questions?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0d368330bf" data-kw="">
<blockquote><p>In the churches, we know that there were many ἐπισκοποι (Acts 20:17, 28; Phil. 1:1), and this work of overseeing was specifically charged to the πρεσβυτεροι (Acts 20:17, 28; 1 Tim. 3:1–7; 5:17; Titus 1:5, 7; 1 Pet. 5:1–3). In line with this, Peter also calls himself an elder (πρεσβυτερος, 1 Pet. 5:1). Of a special institution of the episcopate alongside the presbyterate, accordingly, the New Testament knows nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 4, §502</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a> › <a href="../topics/church-government-and-the-ministry/offices/bishop-and-presbyter.html">Bishop and presbyter</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a> › <a href="../topics/church-government-and-the-ministry/forms-of-government/episcopal-presbyterian-congregational.html">Episcopal, presbyterian, congregational</a></span></div>

</figure><figure class="quote" id="q-c9aad96bec" data-kw="">
<blockquote><p>2. By ‘ministry’, called [Greek]… thereby generally are understood such offices as concerned the discipline of the Church: specially conversant about the body and temporal things, either to relieve their poverty, which was the office of deacons in the distribution of alms, or to cherish them in sickness, which was the charge of widows, whose office St. Paul describes, 1 Tim. 5, or to watch over their manners, which belonged unto the spiritual governors. … 6. ‘He that shows mercy’. 1. Some do understand this generally of all Christians, that they should give chearfully: as Chrysostom will have it the same with that precept, 2 Cor. 9:7, ‘he that soweth sparingly, shall reap sparingly:’ Theodoret, Haymo: but the apostle here speaks of the special offices of the Church. … 5. But their opinion is rather here to be approved which in the first place take the office of deacons to be described, such as were elected by the apostles, Acts 6, and here the office of such, as were assigned to have a care of strangers, exiles, the sick, such were the widows, whom St. Paul would not have chosen under 60 years, 1 Tim. 5. Thus Calvin, Beza, Martyr, Gualter, Faius, Pareus, with others. Now this showing of mercy: …3. such special works of mercy then are here understood, which belonged to the curing and attending upon the sick, aged, impotent, strangers, exiles, orphans, Pareus. 4. ‘with chearefulnes of heart’, gentleness in words, pleasantness of countenance: for all those are signified by hilarity or cheerfulness, Tolet: so Chrysostom… 3. again, such as were employed in these services, as old men and widows, are naturally given to morosity, and therefore they have need of this precept to dispose themselves to cheerfulness, Pareus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla, that is, a Six-fold Commentary upon the Most Divine Epistle of the Holy Apostle, St. Paul to the Romans</cite>, … (Cambridge, 1611), Biblical Exegesis, ch. 12, 3. ‘The Questions &amp; Doubts Discussed’, 16th Question, ‘Of these several offices here rehearsed by the apostle in particular’, pp. 546 &amp; 548-9 on Rom., 12:7-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a26186edb9" data-kw="assume human nature">
<blockquote><p>Did the Son of God assume human nature into the unity of his person? We affirm against the Socinians. As in the Trinity, the unity of essence does not hinder the persons from being distinct from each other and their properties and operations from being incommunicable, so the union of natures in the person of Christ does not hinder the natures and their properties from remaining distinct and unconfounded.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.6.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a> › <a href="../topics/the-person-of-christ/union-of-the-two-natures/hypostatic-union.html">Hypostatic union</a></span><span class="t"><a href="../topics/the-person-of-christ/true-humanity.html">True Humanity</a> › <a href="../topics/the-person-of-christ/true-humanity/body-and-soul.html">Body and soul</a></span><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a> › <a href="../topics/the-person-of-christ/union-of-the-two-natures/one-person-two-natures.html">One person, two natures</a></span></div>
<div class="actions"><button class="copy" data-copy="“Did the Son of God assume human nature into the unity of his person? We affirm against the Socinians. As in the Trinity, the unity of essence does not hinder the persons from being distinct from each other and their properties and operations from being incommunicable, so the union of natures in the person of Christ does not hinder the natures and their properties from remaining distinct and unconfounded.”

— Francis Turretin, Institutes of Elenctic Theology, 13.6.1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDid%20the%20Son%20of%20God%20assume%20human%20nature%20into%20the%20unity%20of%20his%20person%3F%20We%20affirm%20against%20the%20Socinians.%20As%20in%20the%20Trinity%2C%20the%20unity%20of%20essence%20does%20not%20hinder%20the%20persons%20from%20being%20distinct%20from%20each%20other%20and%20their%20properties%20and%20operations%20from%20being%20incommunicable%2C%20so%20the%20union%20of%20natures%20in%20the%20person%20of%20Christ%20does%20not%20hinder%20the%20natures%20and%20their%20properties%20from%20remaining%20distinct%20and%20unconfounded.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2013.6.1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa26186edb9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a26186edb9.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-03c94e9d27" data-kw="">
<blockquote><p>It is likely that Boethius (480-524) inaugurates, in Latin Christian theology, the consideration of personhood as such… a person is an individual substance of a rational nature… This chapter situates Boethius in relation to significant Christian theologians before and after him… In contemporary philosophy, there is a lot of attention paid to the rationality condition for personhood. But if we look at the text in which Boethius defines a person, we do not find any precise criteria for it… The intrusion of personhood into contemporary applied ethics with a focus on detailed and disputed criteria for rationality as a condition for personhood seems to be a modern development. From a Patristic and Medieval Christian theology point of view, trying to find just the right detailed criteria for rationality in order to define personhood is a wild goose chase… The chapter consists of six sections… 1. Origen of Alexandria and the Cappadocians: Basil of Caesarea and Gregory of Nyssa 2. Miaphysites: Severus of Antioch, John Philoponus, and Peter of Callinicum 3. Boethius and Rusticus the Deacon: Rationality, Subsistence, and the Invention of Personhood 4. Neo-Chalcedonians (II): Leontius of Byzantium and John of Damascus 5. Scholastic Neo-Chalcedonians (I): Gilbert of Poitiers, Richard of St. Victor,William of Auxerre, Alexander of Hales, Bonaventure, Thomas Aquinas, andWilliam of Ware 6. Scholastic Neo-Chalcedonians (II): Henry of Ghent, John Duns Scotus, andWilliam of Ockham</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scott-m-williams.html">Scott M. Williams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Person’ in Patristic &amp; Medieval Christian Theology’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is likely that Boethius (480-524) inaugurates, in Latin Christian theology, the consideration of personhood as such… a person is an individual substance of a rational nature… This chapter situates Boethius in relation to significant Christian theologians before and after him… In contemporary philosophy, there is a lot of attention paid to the rationality condition for personhood. But if we look at the text in which Boethius defines a person, we do not find any precise criteria for it… The intrusion of personhood into contemporary applied ethics with a focus on detailed and disputed criteria for rationality as a condition for personhood seems to be a modern development. From a Patristic and Medieval Christian theology point of view, trying to find just the right detailed criteria for rationality in order to define personhood is a wild goose chase… The chapter consists of six sections… 1. Origen of Alexandria and the Cappadocians: Basil of Caesarea and Gregory of Nyssa 2. Miaphysites: Severus of Antioch, John Philoponus, and Peter of Callinicum 3. Boethius and Rusticus the Deacon: Rationality, Subsistence, and the Invention of Personhood 4. Neo-Chalcedonians (II): Leontius of Byzantium and John of Damascus 5. Scholastic Neo-Chalcedonians (I): Gilbert of Poitiers, Richard of St. Victor,William of Auxerre, Alexander of Hales, Bonaventure, Thomas Aquinas, andWilliam of Ware 6. Scholastic Neo-Chalcedonians (II): Henry of Ghent, John Duns Scotus, andWilliam of Ockham”

</figure><figure class="quote" id="q-9116331511" data-kw="">
<blockquote><p>Position 6. Grace is not educed or extracted out of the potency of any created nature. Grace is born in heaven and came from the inmost of the heart of Christ; it has neither seed nor parent on earth; therefore the Lord challenges it as his own, 2 Cor. 12.9, ‘The Lord said unto me, My grace is sufficient for thee.’ 2 Tim. 2:1, ‘The grace that is in Christ Jesus.’ 1 Cor. 15:10, ‘The grace of God.’ 2 Cor. 13:14, ‘The grace of the Lord Jesus Christ.’ Gal. 1:15, ‘He called me by his grace.’ If we could engage the grace of God, or prevent it [come before it], then should grace be our birth; but grace is not essential to angels. It’s a doubt if any creature can be capable by nature of any possibility-natural not to sin; it is much to know the just owner of grace who begot it? It came out of the eternal womb and bowels of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, p. 239</span></figcaption>

</figure><figure class="quote" id="q-411959d55f" data-kw="">
<blockquote><p>3. Nor does it hinder [the legitimacy of the atonement] that Christ, as subject to the divine law, also owed obedience, which seems to destroy all merit (Socinus ibid. ch. 5 and Praelections, ch. 18, §4). For he did not owe it by that title of justice by which he now offered it, namely for sins. And what else is merit with respect to God than if a rational person offers those formal acts which are in the pact? as Adam and the fallen angels would have merited salvation if they had rendered the obedience that was in the pact. Why therefore will we detract praise of merit from Christ, who most exactly satisfied the divine demands?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’ tr. by AI by Onku (Utrecht, 1650) Latin</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-8113be8b58" data-kw="">
<blockquote><p>The Covenant of Redemption is two ways considered: 1. As transacted in time between Jehovah and Christ, in his actual discharge of his office of King, Priest and Prophet; 2. As it is an eternal transaction and compact between Jehovah and the second Person the Son of God, who gave personal consent that He should be the Undertaker, and no other. And these three acts are considerable in the Persons in this latter consideration: 1. designation of one; 2. decree and destination; 3. delectation in the work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pt. 2, ch. 7, pp. 302-7 of The Covenant of Life Opened (Edinburgh, 1655)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/application-of-redemption-in-general/order-of-salvation.html">Order of Salvation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-59d7662a11" data-kw="">
<blockquote><p>I. All those whom God hath predestinated unto life, and those only, he is pleased, in his appointed and accepted time, effectually to call,[a] by his word and Spirit,[b] out of that state of sin and death in which they are by nature, to grace and salvation by Jesus Christ;[c] enlightening their minds spiritually and savingly to understand the things of God;[d] taking away their heart of stone, and giving unto them an heart of flesh;[e] renewing their wills, and, by his almighty power determining them to that which is good;[f] and effectually drawing them to Jesus Christ;[g] yet so as they come most freely, being made willing by his grace.[h] [a] Rom. 8:30. Rom. 11:7. Eph. 1:10,11. [b] 2 Thess. 2:13,14. 2 Cor. 3:3,6. [c] Rom. 8:2. Eph. 2:1-5. 2 Tim. 1:9,10. [d] Acts 26:18. 1 Cor. 2:10,12. Eph. 1:17,18. [e] Ezek. 36:26. [f] Ezek. 11:19. Phil. 2:13. Deut. 30:6. Ezek. 36:27. [g] Eph. 1:19. John 6:44,45. [h] Cant. 1:4. Ps. 110:3. John 6:37. Rom. 6:16-18.</p></blockquote>

</figure><figure class="quote" id="q-45d4a14433" data-kw="">
<blockquote><p>24. Applicatory works of grace are either external or internal. 25. External ones are both calling through the Word, partly of Law, partly of gospel, and the sealing of those called through sacraments. 26. Calling through Law is prior, and that partly imperative of obedience, partly declarative of sanction, both promissory and comminatory. … 29. Calling through nature to God the Creator is broader; calling through the Word to God the redeemer is stricter. 30. Universal calling to salvation neither was, nor is, nor will be. 31. That hope of special mercy is shown in nature, or that this is the instrument of gospel-calling, is false, nor can this be said without nature being established as a herald of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-friedrich-spanheim.html">Sr. Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), ‘Miscellaneous Theological Disputation’, trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</cite></span></figcaption>

</figure><figure class="quote" id="q-36d9630f15" data-kw="">
<blockquote><p>Q. 63. What are the special privileges of the visible church? A. The visible church hath the privilege of being under God’s special care and government;[y] of being protected and preserved in all ages, notwithstanding the opposition of all enemies;[x] and of enjoying the communion of saints, the ordinary means of salvation,[a] and offers of grace by Christ to all the members of it in the ministry of the gospel, testifying, that whosoever believes in him shall be saved,[b] and excluding none that will come unto him.[c]</p></blockquote>

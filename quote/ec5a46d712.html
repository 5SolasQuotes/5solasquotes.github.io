<main class="wrap"><figure class="quote" id="q-ec5a46d712" data-kw="">
<blockquote><p>Faith looks to Jesus Christ, the Son of God, given into death for the sins of the whole world. To turn one&#x27;s eyes away from Jesus means to turn them to the Law. True faith lays hold of Christ and leans on Him alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, on 2:4, p. 39</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cb098ede78" data-kw="">
<blockquote><p>True faith is not only a sure knowledge, whereby I hold for truth all that God has revealed to us in His Word (James 1:6), but also a hearty trust (Rom. 4:16–18; Rom. 5:1), which the Holy Ghost (2 Cor. 4:13; Phil. 1:19, 29) works in me by the Gospel (Rom. 1:16; 10:17), that not only to others, but to me also, forgiveness of sins, everlasting righteousness, and salvation are freely given by God (Heb. 11:1–2; Rom. 1:17), merely of grace, only for the sake of Christ’s merits (Eph. 2:7–9; Rom. 3:24–25; Gal. 2:16; Acts 10:43).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q. 21</span></figcaption>

</figure><figure class="quote" id="q-1cf054deb8" data-kw="knowledge assent trust fiducia acts of faith">
<blockquote><p>As to the acts, they are explained by theologians in different ways—some making more, others fewer. Some make only one, namely assent or persuasion. Others acknowledge only two—knowledge and assent. Others add a third (to wit, trust). Others a fourth also (to wit, confidence or the acquiescence of the will). These different opinions do not so much change the nature of faith as unfold it in different ways. And hence it is that some place faith equally in the intellect and the will; others only in the intellect formally and in the will only energetically or effectively and consequently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.8.1b</span></figcaption>

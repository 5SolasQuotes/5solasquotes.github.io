<main class="wrap"><figure class="quote" id="q-2e40be86f2" data-kw="">
<blockquote><p>3. I easily acknowledge that grace gives such a power as is commonly called Moral, distinct from the natural faculties, as our corrupt estate contains an opposite impotency. But this is but an applying of the terms [‘can’] and [‘cannot’] [‘power’] and [‘impotency’] to dispositions and undisposedness, to habits and their privations. 4. A new heart and spirit, I easily confess necessary. But those words do commonly signify in Scripture, only new inclinations, dispositions, qualifications. It is a new heart, though only the old faculties and substance. I hope you will not follow Illyricus.¹ ¹ [Matthias Illyricus (1520–1575), a Lutheran reformer. Wiki says, “Affirming the natural inability of man, he adopted a position on sin as not being an accident of human nature, but involved in its substance, since The Fall of Man.”] 5. Where you say that [without faith a man can no more receive Christ, nor do ought towards it, than a dead man can walk or speak.], I Reply 1. That proves not faith to be equivalent to a potentia vel facultas [power or capacity], any otherwise than that it is of as absolute necessity, but not that it is of the same nature. If you show an illiterate man a Greek or Hebrew book, he can no more read in it then a dead man, that is, both are truly in sensu composito [in a combined sense] impossible: But yet it is but a habit that is wanting to one, and a power or faculty natural, to the other. And so it may truly be said that a sinner cannot do well that has accustomed to do evil, no more than a leopard can change his spots, or a blackmoore [a black person] his skin. Yet if you mean that such are equally distant from actual change as a dead man, it is but a dead comparison. A dead man wants both natural faculties, and an inclination or moral power. An unbeliever wants but one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reduction of a Digressor</cite>, (1654), p. 131</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-636552f25c" data-kw="">
<blockquote><p>They say natural or physical necessity takes away liberty, but moral necessity does not; at the same time, they explain moral necessity so as to make it truly physical or natural.</p></blockquote>

</figure><figure class="quote" id="q-6428ca8b93" data-kw="">
<blockquote><p>As for all other sins which we call actual, they are, as I said, natural only, and not supernatural; and therefore no man wants [lacks] liberty, as to do them, so to abstain from them; Only he wants a moral and spiritual liberty to abstain from them in a gracious manner, according to that of Aquinas (Summa, pt. 1, q. 23, art. 7, to the 3rd): Licet aliquis non possit gratiam adipisci qui reprobatur a Deo, tamen quod in hoc peccatum vel illud labatur, ex ejus libero arbitrio contingit. Though a man who is reprobated of God cannot obtain grace, yet that he falls into this or that sin, it comes to pass of his own free will. It is true also even in God’s providence concerning acts natural, there is a great mystery. For as God foretold David that his neighbor should lie with his wives (2 Sam. 12:11-12); and though he sinned secretly, yet the Lord would do this openly. So he foretold that upon that altar which Jeroboam erected, a child that should be born of the house of David, Josiah by name, should burn the prophets’ bones. And that Cyrus also should build him a city and let go his captives. (1 Kn. 13:2; Isa. 45:13; Ezra 1; 2 Kn. 23:16; 2 Sam. 16:22) Yet who doubts but that Cyrus did freely deliver the Jews out of Babylon? and Josiah did as freely burn the prophets’ bones upon the altar in Bethel, as ever they did [any] action in their lives? So Absalom did as freely defile his father’s concubines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath, or an answer unto a book entitled, God’s Love unto Mankind</cite>, … (d. 1646; Oxford, 1653), bk. 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions, sect. 7, p. 101</span></figcaption>

</figure><figure class="quote" id="q-e052571c14" data-kw="">
<blockquote><p>I answer that immortality indicates a certain potential to live forever and not die. But this potential is not found in human nature on the side of the body, except imperfectly, as if by obediential potency alone, since everlasting life cannot be had through the principles of nature. Rather, the completion of this potency comes from a divine gift gratuitously conferred. And so, immortality can be considered in two ways: either with regard to incomplete natural potency, and in this way, there is one and the same immortality just as there is one and the same nature; or with regard to the gift of grace, which is like the formal element completing the aforementioned potency. And in this way, we find a difference between the two immortalities and impassibilities, since the first was through the grace of innocence whereas the final will be through the gift of glory. For in the first state the soul’s dominance over the body was such that nothing in the body could happen that would be adverse to the soul. But in the last state the dominance will be greater, inasmuch as the properties of the soul will in a certain way overflow into the body such that the body will be rendered agile, bright, and spiritual, as well as impassible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 19, Immortality in the Original State of Man, quest. 1, art. 5, Whether the immoratlity of Adam was the same as the immortality of the resurrected, I answer that, bk. 2</span></figcaption>

</figure><figure class="quote" id="q-fd151550ce" data-kw="">
<blockquote><p>Consider the laptop computer on which you might be reading this. There is an obvious sense in which it is complete all by itself, with its operating system, other software installed in the factory, built-in Wi-Fi capability, and so on. Yet it has the capacity to have added to it all sorts of new software and accessories… Since software and accessories of the latter sort were not even in view when the computer was designed, they cannot be said to be ends for which the computer was made. All the same, they are ends that might be added to it, because it does at least have the inherent capacity to have such ends added to it. This is analogous to the notion of an “obediential potency,” and it indicates the sense in which there is indeed a middle ground of just the sort Hart claims is impossible. In what Thomists call a state of “pure nature,” human beings would not have the beatific vision as an end to which they are directed, any more than a computer is oriented toward running some application that did not even exist when it was manufactured. But just as a computer does nevertheless have a capacity to have such applications added to it, so too are human beings made in such a way that an orientation toward the beatific vision might be imparted to them.</p></blockquote>

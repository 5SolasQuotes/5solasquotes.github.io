<blockquote><p>As concerning children, we cannot bind all to the same measure of age. For there are some in whom spiritual knowledge, study and zeal for piety, and grave and well-ordered morals supply the defect of years. Yet it is not in the least to be approved that each and all alike, after the age of fourteen, initiated with the sacrament of confirmation (according to the Papists)… are received to communion.</p></blockquote>

<blockquote><p>XXIII. But with regard to the place of regeneration there is greater difficulty. On this part of the subject, I find four distinct opinions among theologians. Some think that regeneration takes place at different periods of time—it may be before, it may be at, or it may be after baptism. Others place it uniformly before baptism. Others teach that infants are baptized unto future regeneration, being incapable of it at the time. Indeed, many contend that God usually confers regeneration upon infants in the very act and moment of baptism. Let us look at the arguments of each class, and subject them to an impartial examination. XXIV. That in the dispensation of his saving grace God is restricted to no particular period of time will be admitted by every person who entertains a becoming reverence for his supreme and almighty dominion. The sole question is: What he may have prescribed to himself in the exercise of his unlimited freedom, or may have revealed in his Word, or made manifest by experience?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Efficacy &amp; Utility of Baptism</cite>, (Utrecht, 1693) in MJT 17 (2006), pp. 121-90, Includes an introduction by Mark Beach. Originally an appendix in William Marshall, Popery in The Full Corn, the Ear &amp; the Blade; or, The Doctrine of Baptism in the Popish, Episcopalian &amp; Congregational Churches; with a Defence of the Calvinistic or Presbyterian View (Edinburgh: Paton and Ritchie, 1852), p. 142</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

— Herman Witsius, ‘On the Efficacy &amp; Utility of Baptism in the Case of Elect Infants whose Parents are Under the Covenant’ (Utrecht, 1693) in MJT 17 (2006), pp. 121-90, Includes an introduction by Mark Beach. Originally an appendix in William Marshall, Popery in The Full Corn, the Ear &amp; the Blade; or, The Doctrine of Baptism in the Popish, Episcopalian &amp; Congregational Churches; with a Defence of the Calvinistic or Presbyterian View (Edinburgh: Paton and Ritchie, 1852), p. 142">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXIII.+But+with+regard+to+the+place+of+regeneration+there+is+greater+difficulty.+On+this+part+of+the+subject%2C+I+find+four+distinct+opinions+among+theologians.+Some+think+that+regeneration+takes+place+at+different+periods+of+time%E2%80%94it+may+be+before%2C+it+may+be+at%2C+or+it+may+be+after+baptism.+Others+place+it+uniformly+before+baptism.+Others+teach+that+infants+are+baptized+unto+future+regeneration%2C+being+incapable+of+it+at+the+time.+Indeed%2C+many+contend+that+God+usually+confers+regeneration+upon+infants+in+the+very+act+and+moment+of+baptism.+Let+us+look+at+the+arguments+of+each+class%2C+and+subject+them+to+an+impartial+examination.+XXIV.+That+in+the+dispensation+of+his+saving+grace+God+is+restricted+to+no+particular+period+of+time+will+be+admitted+by+every+person+who+entertains+a+becoming+reverence+for+his+supreme+and+almighty+dominion.+The+sole+question+is%3A+What+he+may+have+prescribed+to+himself+in+the+exercise+of+his+unlimited+freedom%2C+or+may+have+revealed+in+his+Word%2C+or+made+manifest+by+experience%3F%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+%E2%80%98On+the+Efficacy+%26+Utility+of+Baptism+in+the+Case+of+Elect+Infants+whose+Parents+are+Under+the+Covenant%E2%80%99+%28Utrecht%2C+1693%29+in+MJT+17+%282006%29%2C+pp.+121-90%2C+Includes+an+introduction+by+Mark+Beach.+Originally+an+appendix+in+William+Marshall%2C+Popery+in+The+Full+Corn%2C+the+Ear+%26+the+Blade%3B+or%2C+The+Doctrine+of+Baptis <blockquote><p>The Law of Nature dictates that all who are admitted into this [Chuch] Society, must consent to be governed by the laws and rules of that society, according to its constitution. For none can be looked upon as a member of a society, but such a one as submits to the rules and laws of the society, as constituted at the time of his entrance into it. That all civil societies are founded upon voluntary consent and agreement of parties, and do depend upon contracts and covenants made between them, is evident to any that consider that men are not bound by the Law of Nature to associate themselves with any but whom they shall judge fit; that dominion and propriety was introduced by free consent of men: and so there must be laws and bonds fit, agreement made, and submission acknowledged to those laws, else men might plead their natural right and freedom still, which would be destructive to the very nature of these societies. When men then did first part with their natural Liberties, two things were necessary in the most express terms to be declared: First, a free and voluntary consent to part with so much of their natural rights as was not consistent with the well-being of the society; Secondly, a free submission to all laws, which should be agreed upon at their entrance into society, or afterwards as they see cause. But when societies were already entered, and children born under them, no such express consent was required in them, being bound by virtue of the protection they find from authority to submit to it, and an implicit consent is supposed in all such as are born under that authority. But for their more full understanding of this obligation of theirs, and to lay the greater tie of obedience upon them, when they come to understanding, it has been conceived very requisite by most states to have an explicit declaration of their consent, either by some formal oath of allegiance, or some other way sufficiently expressing their fidelity, in standing to the covenants long since supposed to be made. To apply this now to the Church. … Our Savior has determined how this consent should be expressed, viz. by receiving baptism from those who have the power to dispense it: which is the federal rite whereby our consent is expressed to own all the laws and submit to them, whereby this society is governed: Which at the first entering of men into this society of the Church was requisite to be done by the express and explicit consent of the parties themselves, being of sufficient capacity to declare it, but the Covenant being once entered into by themselves, not only in their own name, but in the name of their posterity (a thing implied in all covenants wherein benefits do redound to posterity, that the obligation should reach them to; but more particular in this, it having been always the tenor of God’s Covenants with men, to enter the seed as well as the persons themselves, as to outward privileges, Dt. 29:15; Acts 2:38), an implicit consent as to the children in Covenant is sufficient to enter them upon the privileges of it by baptism, although withal it be highly rational for their better understanding the engagement they entered into, that when they come to age, they should explicitly declare their own voluntary consent to submit to the laws of Christ, and to conform their lives to the profession of Christianity… …but in religious societies [in contrast to natural societies], though the act of consent be free, yet there is an antecedent obligation upon men, binding them to this voluntary consent… It is granted, Church-power does suppose consent, but then all Christians are under an obligation from the nature of Christianity to express this consent, and to submit to all censures legally inflicted. … …yet I no ways deny the lawfulness or expediency, in many cases, of having a personal profession from all baptized in infancy when they come to age (which we may, if we please, call Confirmation) and the necessity of desiring admission, in order to participation of all ordinances: which desire of admission, does necessarily imply men’s consenting to the laws of that society, and walking according to the duties of it; and so they are consequentially and virtually, though not expressly and formally, bound to all the duties required from them in that relation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-stillingfleet.html">Edward Stillingfleet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, a Weapon-Salve for the Church’s Wounds</cite>, ch. 7 in Irenicum, a Weapon-Salve for the Church’s Wounds, or the Divine Right of Particular Forms of Church-Government Discussed &amp; Examined... (London: Mortlock, 1662), pt. 1, pp. 132-40</span></figcaption>

<blockquote><p>6. [The Independents hold] ‘That none but confederates by the explicit Church-Covenant have right to Ordinances’: which is to keep out many precious souls from communion with their fellow-members, and their children from baptism, and to make them no better than infidels.</p></blockquote>

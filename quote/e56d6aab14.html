<blockquote><p>James Dick, who, at the time of writing, was the minister of Trinity Street Reformed Presbyterian Church in north Belfast, wrote the following about what he considered to be the spurious theology of those leading evangelistic campaigns. While we could criticise Dick for not being mindful of the hypothetical universalism that was held by many Reformed divines in the era of confessional formulation (although such an opinion was held alongside the Canons of Dort’s assertion of a definite atonement for the sins of the elect), he was probably correct to conclude that the later use of universalistic terminology in relation to the atonement had more to do with the influence of Wesleyan Arminianism:

Leaders in the “work” may profess to believe in Calvinistic doctrine, but their evangelism is to all intents and purposes Arminian. Of course a main theme of evangelism, whether true or false, is the death of Christ. The “evangelistic” teaching of this time preaches Christ’s death for all men, universal atonement, atonement for every human being in all time the world over, atonement for every man alike, for Judas as for John. But this is so obviously atonement that does not atone. The most noted evangelists of the time tell an audience, Christ died for you. So they say, also, to an individual sinner in that audience. Take this doctrine away from them and they have nothing left to preach.

The doctrine of universal atonement is essential to the “success” of such evangelists, because of their peculiar doctrine of faith. They gravely tell sinners that they have only to believe that Christ died for them in particular in order to be saved. They tell them, moreover, that God has done already all that He can do for every man, and that He cannot proceed a step further with the work of salvation till the sinner proceeds. The will tell sinners, God cannot save you except you believe. What is this all but appealing to the sinner complete himself, by a faith that is quite in his own power, the incomplete and otherwise unfinishable work of God?

Modern “evangelism” may profess to believe that the Holy Spirit’s special grace is needed to make the sinner believe. But the “Evangelists” do not teach this. They prefer to make the sinner plainly that he is dead in trespasses and sins and can make no spiritual movement whatever of himself would hinder “success.” Conversions can be secured only by leaving sinners under the false impressions as to their own power to believe.

A false evangelism considers it imprudent to put any doctrine of spiritual inability before sinners, lest they should be offended and go away. To avoid such a contingency as this it assures them that if they believe they will thereby be born again, and so teaches them to put their first dependence on themselves. It does not teach them that they must be born again by the Almighty Spirit of God before they believe, which is the teaching of Scripture, and which directs men to place all their dependence upon God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Evangelism: With Criticism of some Prevalent Errors</cite>, (Belfast, 1898), pp 11-13.</span></figcaption>

<blockquote><p>4th Distinction. There is a call to an habitual and ordinary prophesying; here is required not only a calling by gifts, but also a collation of authority to the office, either immediately by God, or mediately by the Church, and there is a call to some particular or occasional acts of exhorting, as the martyrs and Stephen [Acts 7] are called to give confession of their faith, and a king in battle, to exhort his army, or a prince his subjects to piety, and to this latter there is no other call required but the place and profession of the exhorter, though he bee not by office a pastor. … 6th Distinction. Gifted Christians may occasionally admonish, warn, rebuke and exhort one another: 1. privately; 2. without any pastoral care of souls as they are a Church, but only as they occasionally converse with them; 3. ex communi officio charitatis [out of the common office and charity], by the Law of nature, charity tying one member to help another;

4. Not authoritatively by special office; but all authority here is from the Word occasionally spoken. The pastor is to preach, 1. publicly; 2. to the Church as the Church. 3. with a pastoral obligation to all alike, whether he converse daily with them or not. 4. not only by the tie of common charity, but by a virtue of a special office.

5. With authority both objective from the Word and official from his charge. 6. and is obliged to separate himself for this charge allanerly [singly, especially or wholly], as a watchman who must give an account in a special manner to Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 2, p. 272</span></figcaption>

<blockquote><p>…let us note that God will have every of us nowadays for his own part to do his endeavor to multiply the church… And when God vouchsafeth us his grace to win any man, and to bring him into his flock, then are we as spiritual fathers… Now albeit that all have not that office of preaching the Word of God, yet a private person being a member of the Church, may beget spiritual children unto God, if he have occasion and ability to win a poor soul and to enlighten him with the faith of the gospel. Let us then bestow our pains to this end, knowing that if the carnal marriage was so precious under the law in the sight of God: Surely the mean whereby we be made members of our Lord Jesus Christ, is a thing now far dearer and of greater estimation with Him. And therefore let every man employ himself that way to the uttermost of his poor. For here is no forcing of us to marry against our wills, but of the winning of wives unto our Lord Jesus Christ, that by the multiplying of the Church, we may always be the more firmly linked unto Him. Seeing then that our condition is more gentle and sweet than that which was under the law, we ought to be stirred up so much the more to the discharging of that duty, and we shall have so much the less excuse if we be careless and negligent therein.</p></blockquote>

<blockquote><p>[Margin Note:] Evangelists are now ceased as well as apostles. 2. Synods from Acts 15 and Acts 13 may lend men, authorized with pastoral power, to heathens to spread the Gospel; and private men as no pastors, but as private men, are intruders [though] authorized by Mr. Hooker, for they have no promise, such as pastors have by Mt. 28:19-20; Mk. 16:15-17; Jer. 1:6,17-18, to plant Churches among the heathens; nor is there a warrant to say that evangelists are ordinary officers left by Christ to plant Churches. If Hooker have any ground from Eusebius or Scripture for evangelists now, or in Trajan’s time, he must show that they have the gift of tongues: for how could evangelists be fellow-helpers to preach the Gospel to the Churches planted by the apostles if they were not an extraordinary office only? See those divines in the margin, and my learned and dear brother, Mr. George Gillespie, Miscellaneous Questions, ch. 7. If the Church should send any to the heathen any way rip[…] for the Gospel, these could be no other than ordinary pastors to them. [Margin Note:] Tilen, Syntagma, disputation 19, thesis 38, Apostolorum vice, ubi res poscebat, fungebantur. Professors of Leiden, Synopsis of Pure Theology, disputation [??], thesis 17, p. 605; [William] Bucanus, in loc., Common place 42, question 45; Calvin, Commentary on Eph. 4, Apostolis proximi erant Evangelistae, et munus affine habebant. Bullinger, ibid., In plebe potissimum e […]udienda; Zanchi, Commentary on the same, Apostolorum Comites—non immediate mi […]—sed assumebantur. Dr. Robert Boyd from Trocherig, Commentary on Eph. 4, p. 493, Apostolorum Comites modo huc, modo illuc missi, modo re vocati ab Apostolis, extraordinarii.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[Margin Note:] Evangelists are now ceased as well as apostles. 2. Synods from Acts 15 and Acts 13 may lend men, authorized with pastoral power, to heathens to spread the Gospel; and private men as no pastors, but as private men, are intruders [though] authorized by Mr. Hooker, for they have no promise, such as pastors have by Mt. 28:19-20; Mk. 16:15-17; Jer. 1:6,17-18, to plant Churches among the heathens; nor is there a warrant to say that evangelists are ordinary officers left by Christ to plant Churches. If Hooker have any ground from Eusebius or Scripture for evangelists now, or in Trajan’s time, he must show that they have the gift of tongues: for how could evangelists be fellow-helpers to preach the Gospel to the Churches planted by the apostles if they were not an extraordinary office only? See those divines in the margin, and my learned and dear brother, Mr. George Gillespie, Miscellaneous Questions, ch. 7. If the Church should send any to the heathen any way rip[…] for the Gospel, these could be no other than ordinary pastors to them. [Margin Note:] Tilen, Syntagma, disputation 19, thesis 38, Apostolorum vice, ubi res poscebat, fungebantur. Professors of Leiden, Synopsis of Pure Theology, disputation [??], thesis 17, p. 605; [William] Bucanus, in loc., Common place 42, question 45; Calvin, Commentary on Eph. 4, Apostolis proximi erant Evangelistae, et munus affine habebant. Bullinger, ibid., In plebe potissimum e […]udienda; Zanchi, Commentary on the same, Apostolorum Comites—non immediate mi […]—sed assumebantur. Dr. Robert Boyd from Trocherig, Commentary on Eph. 4, p. 493, Apostolorum Comites modo huc, modo illuc missi, modo re vocati ab Apostolis, extraordinarii.”

<blockquote><p>Thirdly, the Reformed Churches may send pastors to the Indians, for that which Acosta says of Jesuits we may with better reason say it of ourselves: That pastors are as soldiers, and some soldiers are to keep order and remain in a certain place; others run up and down in all places; So some are affixed to a congregation, to feed them; others may be sent to those people who have not heard of the Gospel, which sending is ordinary and lawful in respect of pastors sending and the pastors who are sent, because in pastors, even after the apostles be dead, there remains a general pastoral care for all the Churches of Christ. Thus sending is not ordinary, but extraordinary in respect of those to whom the pastors are sent; yet is it a pastoral sending [as opposed to this being absent in congregationalism in such a case].</p></blockquote>

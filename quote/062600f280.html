<main class="wrap"><figure class="quote" id="q-062600f280" data-kw="">
<blockquote><p>The Giant Goliath so affrighted the whole host of Israel, by the vast bulk of his body, the weight and large dimensions of his spear and armour, with his defying and bragging words, that none of all that Army durst encounter him. Only David a Shepherd by profession, in stature low, in years young, the least of all his brethren, and of meanest account among the people, took the boldness to enter the lists with that uncircumcised Philistine.

So I a spiritual shepherd by profession, the least of the Tribe of Levi, little in my own eyes, and of small account in the world, observing how all the host of learned men in this Land look upon, but adventure not to buckle with Mr. Hobbs his Leviathan, Nec quis quam ex agmine tanto au det adire viurm, manibusve inducere caestus. I say, being animated by some lovers of the truth, have this Summer set aside for a while my other studies, to peruse this book, and to detect some of his chief Tenets, which though erroneous and dangerous, are swallowed down by some young Sciolists without nauseating; which to me is an argument of great distemper in the minds and affections of men, who with the Israelites loathing the Manna of true Philosophy and Divinity, covet after the Quails of new errors, or rather old in a new guise, which in the end will poison them.

Me thinks I see Religion and learning, Divinity and true Philosophy, devotion and piety, for which this Island hath been glorious for many generations, saying as the voice that the Christians heard in Jerusalem immediately before the destruction thereof, Migremus hinc. These are the Palladia, and as it were the Tutelar gods, by which this British Empire hath so long stood, which if they forsake us, what are we else but a prey to our enemies: God grant we may not complain of their departure, as Aenaeas did of his Trojan gods, Excessere omnes aditis, arisque relictis Dii quibus imperium hoc steterat.

For do we not see how Atheism strives to justly out Religion, how ignorance is crawling up into the chair of learning; how piety is affronted by profaneness; and devotion by irreverence; how divinity is assaulted by heretical opinions; and solid Philosophy by dreams and fanatical whimsies. I doubt not but I shall be blamed by some for encountering this Champion of Malmsbury, as David was for venturing upon that Champion of Gath; but I will answer them in David’s words. 1 Sam. 17. 29. What have I now done, is there not a cause? Goliath defied the whole host of Israel, and Mr. Hobbs defieth the whole host of learned men; esteeming his Leviathan as formidable and unconquerable, as that in Job 41. 16. of whose Majesty the mighty are afraid, and for fear they faint in themselves; but this Leviathan is not so; For a Hook may be cast into his nose, and his jaws may be pierced with an angle, Job 40. 21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Leviathan drawn out with a hook, or, Animadversions upon Mr. Hobbs his Leviathan. Together with some observations upon Sir Walter Raleigh’s History of the World</cite>, (London: Richard Royston, 1653), epistle dedicatory.</span></figcaption>

<blockquote><p>Dr. [Thomas] Jackson [d. 1640] in his Original of Unbelief [1625], pp. 334-35, very aptly to this purpose notes that some expressions may sometime be used, and observed well, which to use ordinarily (much more to institute) would be ridiculous or impious. As Jacob did unblameablely kiss his son Joseph’s coat, yet to have hanged it about his bed or table that it might receive such salutations evening and morning or at every meal time, might have countenanced many branches of superstition: once and use it not, may be discretion of those things whose continual use degenerates into abuse.</p></blockquote>

<blockquote><p>His worship must be spiritual, in Heb. 9. 1. Then verily the first Covenant had also Ordinances of Divine Service, and a worldly Sanctuary. Mark, in the time of the Law it was but a worldly Sanctuary in comparison of what is now in the times of the Gospel; those ways of worship though they were once appointed by God, Christ the King of His Church in the new Testament would not have His homage tendered up by these ways of worship, they were too worldly for Him[.]

[T]hen surely to have the inventions of men in the worship of Christ, in the new Testament especially, it is too worldly for Christ: No it must be Divine and Spiritual, he that worships, must worship in spirit and in truth: all that worship and homage we tender up to Jesus Christ, we must look to have it spiritual and not worldly; and so the Ordinances, though they have something external, as the Sacraments, yet if we stick to the outward part, we do not worship Christ as our King in a right way; but we must be spiritual in all, look upon the spiritual part in all Ordinances, or else (I say) we do not tender up that homage to Christ that is due to Him, as the King of His Church.</p></blockquote>

<blockquote><p>To make such images and representations to be used in divine worship, is not simply evil, as appears by the brazen serpent, a temporary ordinance for an occasion in the wilderness; and by the cherubims on the mercy-seat, a stated ordinance for the Mosaical dispensation. There were also supernatural unimitable representations, though not of the divine nature, yet of the divine presence, as the burning bush and the appearances on Mount Sinai. Divine worship directed to such images or representations as to a mediate object, is idolatry. The ark and the cherubims, and the temple, were not made the object of worship. A learned man writes that incurvation in way of religion towards any symbolical presence, as to an object, is flat idolatry; if it be in worship of saints, angels, and demons, it is double idolatry; if in the worship of the true God, single [idolatry]. I suppose it is one thing to make somewhat (as for instance, the ark of the Covenant, and the mercy-seat, and the temple) an object of our consideration in the worship of God, as instructing and exciting therein; and another thing to make it the object of worship itself. And the said author says that to direct our adoration towards a supernatural and unimitable transplendency of the divine presence, is not idolatry. I suppose he means that the burning bush which Moses saw, and the visible glories on the Mount, were only media cultus, not objects thereof, the presence of God shining through the same as a bright medium.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship, 2nd Part in The Remains of… John Corbet… (London: Parkhurst, 1684) | section 18, p. 205</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“To make such images and representations to be used in divine worship, is not simply evil, as appears by the brazen serpent, a temporary ordinance for an occasion in the wilderness; and by the cherubims on the mercy-seat, a stated ordinance for the Mosaical dispensation. There were also supernatural unimitable representations, though not of the divine nature, yet of the divine presence, as the burning bush and the appearances on Mount Sinai. Divine worship directed to such images or representations as to a mediate object, is idolatry. The ark and the cherubims, and the temple, were not made the object of worship. A learned man writes that incurvation in way of religion towards any symbolical presence, as to an object, is flat idolatry; if it be in worship of saints, angels, and demons, it is double idolatry; if in the worship of the true God, single [idolatry]. I suppose it is one thing to make somewhat (as for instance, the ark of the Covenant, and the mercy-seat, and the temple) an object of our consideration in the worship of God, as instructing and exciting therein; and another thing to make it the object of worship itself. And the said author says that to direct our adoration towards a supernatural and unimitable transplendency of the divine presence, is not idolatry. I suppose he means that the burning bush which Moses saw, and the visible glories on the Mount, were only media cultus, not objects thereof, the presence of God shining through the same as a bright medium.”

— John Corbet, The Remains of, Of Divine Worship, 2nd Part in The Remains of… John Corbet… (London: Parkhurst, 1684) | section 18, p. 205">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTo+make+such+images+and+representations+to+be+used+in+divine+worship%2C+is+not+simply+evil%2C+as+appears+by+the+brazen+serpent%2C+a+temporary+ordinance+for+an+occasion+in+the+wilderness%3B+and+by+the+cherubims+on+the+mercy-seat%2C+a+stated+ordinance+for+the+Mosaical+dispensation.+There+were+also+supernatural+unimitable+representations%2C+though+not+of+the+divine+nature%2C+yet+of+the+divine+presence%2C+as+the+burning+bush+and+the+appearances+on+Mount+Sinai.+Divine+worship+directed+to+such+images+or+representations+as+to+a+mediate+object%2C+is+idolatry.+The+ark+and+the+cherubims%2C+and+the+temple%2C+were+not+made+the+object+of+worship.+A+learned+man+writes+that+incurvation+in+way+of+religion+towards+any+symbolical+presence%2C+as+to+an+object%2C+is+flat+idolatry%3B+if+it+be+in+worship+of+saints%2C+angels%2C+and+demons%2C+it+is+double+idolatry%3B+if+in+the+worship+of+the+true+God%2C+single+%5Bidolatry%5D.+I+suppose+it+is+one+thing+to+make+somewhat+%28as+for+instance%2C+the+ark+of+the+Covenant%2C+and+the+mercy-seat%2C+and+the+temple%29+an+object+of+our+consideration+in+the+worship+of+God%2C+as+instructing+and+exciting+therein%3B+and+another+thing+to+make+it+the+object+of+worship+itself.+And+the+said+author+says+that+to+direct+our+adoration+towards+a+supernatural+and+unimitable+transplendency+of+the+divine+presence%2C+is+not+idolatry.+I+suppose+he+means+that+the+burning+bush+which+Moses+saw%2C+and+the+visible+glories+on+the+Mount%2C+were+only+media+cultus%2C+not+objects+thereof%2C+the+presence+of+God+shining+through+the+same+as+a+bright+medium.%E2%80%9D%0A%0A%E2%80%94+John+Corbet%2C+The+Remains+of%2C+Of+Divine+Worship%2C+2nd+Part+in+The+Remains+of%E2%80%A6+John+Corbet%E2%80%A6+%28London%3A+Parkhurst%2C+1684%29+%7C+section+18%2C+p.+205&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fda10e894b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/da10e894b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=To%20make%20such%20images%20and%20representations,the%20same%20as%20a%20bright%20medium&amp;text=To%20make%20such%20images%20and%20representations%20to%20be&amp;text=shining%20through%20the%20same%20as%20a%20bright%20medium" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2ae1b34237" data-kw="">
<blockquote><p>In like manner is Rahab commended as one that by reason of her faith and works perished not with them which obeyed not, when she had received the spies peaceably. Yet if we look into the story, we shall easily discern a great deal of infirmity in that very work of love and mercy, by which she got the testimony of such a notable faith: for she bewrayed much unbelief in making a lie to preserve the spies in safety… So the angel (as is recorded in the Gospel) rebuked those good and faithful women, for that they sought the living among the dead: yet… He is risen again, as He foretold you that He would: yet herein does your uprightness appear, that you hold out still in the love and profession of Christ, even now, when He is in such disgrace and dislike… Thus we may perceive how favourable the Lord is towards his children that offend not upon set purpose and presumptuously: but through Satan’s instigation or through human frailty… This makes for the confutation of their error: 1. That think they have no calling to come to the sacrament because they see more and greater faults in themselves than they can espie, or then, indeed, there are in many other Christians… They find so much hypocrisy, so much pride, so much vain-glory and self-love… that they… begin to fear that God will in no sort accept of them, if they should come unto the table of his Son… and therefore [these things] should by no means keep them from the holy sacrament… Further, [2.] those that by reason of their infirmities will forgoe that ordinance do greatly dishonor God and lay an hard imputation upon Him, as who should say that He were such an extreme and rigorous Judge as will accept of none but of those that have attained to a great measure of perfection. Besides, [3.]… they have a calling to partake of the sacrament, as appears in this text… all such as prepared their whole hearts (that is, did their best endeauour with a true and sincere heart) to seek the Lord.</p></blockquote>

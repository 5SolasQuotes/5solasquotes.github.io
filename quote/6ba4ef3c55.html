<blockquote><p>3. Ordination is an act of authority and supreme jurisdiction conjoined with fasting, praying, and laying on of the hands of the elders; but public praying and dedicating the pastor to Christ’s service with imposition of hands is given to pastors, Acts 6:6; 1 Tim. 4:14; Acts 13:1-3, but never to the multitude of believers…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3a7d9dbe59" data-kw="">
<blockquote><p>2. Because when the Church is overgone with heresy and apostasy, our reformers, in the exercise of their ministry, were not to keep a certain flock as in a constitute[d] Church, and suppose they had no calling but eminent gifts, they were to spread the Gospel to nations, as Luther did; And suppose the people should resist them, as in many places they did; yet God called them, and they were not to expect election from people: So [men of] Cyprus and Cyrenus preached, Acts 11 and 18, and we read of no vocation that they had from either people or apostle. So Origen preached to a people in a certain town where there was not one Christian, and afterwards he was chosen their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea (1642)</cite>, pp. 126-7</span></figcaption>

</figure><figure class="quote" id="q-f423a7e4c7" data-kw="">
<blockquote><p>7. A calling to the ministry is either such as wants the essentials, as gifts in any messenger, and the Churches’ consent, or these who occupy the room of the Church, the Church consenting, such a minister is to be reputed for no minister. Or. 2. An entry to a calling, or a calling, where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas who entered by favor and money, and contrary to the Law was High-Priest but for a year: yet was a true High-Priest, and prophesied as the High-Priest. 8. If the Church approve by silence, or countenance the ministry of a man who opened the Church door to himself, by a silver key, having given the prelate a bud, the ordinance of God is conferred upon him and his calling ceases not to be God’s calling because of the sins of the instruments both taking and giving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 1, p. 165 | pt. 2</cite>, p. 228</span></figcaption>

</figure><figure class="quote" id="q-0a3828f49a" data-kw="">
<blockquote><p>III. Second, this special call is either internal or external. The former is that by which the heart itself is excited by God to consecrate itself to the work of the ministry (of which Paul speaks in 1 Tim. 3:1). This is rather a disposition of mind to receive the call than a call properly so called. By it, a man is conscious before God that he is impelled to undertake this office not by ambition or avarice or any other carnal affection, but from a sincere love of God and a desire to build up the church. The latter, however, is that by which a man thus disposedis expressly called to exercise the office.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology, tr. George M. Giger, ed. James Dennison Jr. (1679–1685; P&amp;R, 1994), vol. 3, 18th Topic, 23. ‘Of how many kinds is the call to the ministry and is an ordinary call always necessary? We distinguish.’</cite>, p. 215</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<main class="wrap"><figure class="quote" id="q-600c62f446" data-kw="">
<blockquote><p>…he shall never prove that swearing by the name of God was a ceremonial thing, being a part of natural worship, taught by the Law of Nature, Gen. 21:23; Josh. 2:12; 2 Chron. 36:21, and is several times put for the whole moral worship, Isa. 19:18 &amp; 45:23; Ps. 63:11. And where, I pray, and when, was this ceremonial precept (if it be such) first given?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-60d85811e7" data-kw="">
<blockquote><p>And, fine linnen is the righteousness of the saints, Rev. 19; Therefore, a surplice is good. And, Mt. 16, ‘Take up your cross’: Therefore, the crossing in baptism is lawful. Enough of this. But so the worship of the Devil is lawful and Aaron’s golden calf is lawful, for I can find a major proposition for them in Scripture, of which you have a faith both negative and positive [because both can be derived from Scripture in this general way];</p></blockquote>

</figure><figure class="quote" id="q-86b4e8dccd" data-kw="">
<blockquote><p>2. There are many parts of God’s worship which are not essential, yet such as will not suffer any addition of the Church. For proof whereof, I demand, were all the ceremonies commanded to be used in the legal sacraments and sacrifices, essential parts of those worships? No man will say so. Yet the synagogue was tied to observe those (and no other than those) ceremonies which the Word prescribed. When Israel was again to keep the Passover, it was said; In the fourteenth day of this month at even, ye shall keep it in his appointed season: according to all the rites of it and according to all the ceremonies of it, shall ye keep it. And again: ‘According to all that the Lord commanded Moses, so did the Children of Israel.’ Ritibus et ceremoniis divinitus institutis, non licuit homini suo arbitrio aliquid adijcere aut detrahere, says Peter Martyr. 3. If those accidentary parts of worship which are commanded in the Word be both necessary to be used necessitatè praecepti [by the necessity of precept], and likewise sufficient means fully adequate and proportioned to that end, for which God has destinated such parts of his worship as are not essential (which must be granted by everyone who will not accuse the Scripture of some defect and imperfection: then it follows that other accidentary parts of worship which the Church adds thereto are but superfluous and superstitious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 3, ch. 7</cite>, pp. 120-21</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dae7932649" data-kw="Tradition Unwritten traditions">
<blockquote><p>If they were guided by the Spirit of truth unto all truth when they published their writings, what prevented them from embracing a full knowledge of the Gospel, and consigning it therein? … Every child knows that in the writings of the apostles, which these men represent as mutilated and incomplete, is contained the result of that revelation which the Lord then promised to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.14</span></figcaption>

</figure><figure class="quote" id="q-ff2a372682" data-kw="">
<blockquote><p>For it is certain that many Roman pontiffs have erred, even when teaching ex cathedra, that is, determining controversies … Then who, I pray you, will be the supreme judge of the church, when the supreme pontiff hath fallen into heresy? Is he a fit person to be the supreme judge in religion, and one in whose judgment we should acquiesce, who may be, and is a heretic, as the very papists themselves confess? Surely, never. The supreme judge of all controversies must be such a one as can neither err nor prove a heretic: and such is Christ himself, that true High Priest, and the sacred scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, q. 5, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-25d85261d2" data-kw="Infallible rule">
<blockquote><p>Although infallibility is not given by God to the church, it cannot on this account be said that God was wanting in things necessary to her, because it is not necessary to have a supreme and infallible tribunal among men upon whose decrees and responses our faith should be suspended, since it is sufficient for her to have an infallible rule of faith and practice in the Scriptures, which as long as she observes, she will not wander from the right track.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.32</span></figcaption>

</figure><figure class="quote" id="q-1057e41071" data-kw="">
<blockquote><p>All things which are necessary to salvation are contained in the Scriptures, and also all those things which are necessarily required to the instruction and edification of the Church. … Hence the Scripture is not a partial, but a perfect rule of Faith, and manners: neither is here any thing that is constantly and every where necessary to be observed in the Church of God, which depends either upon any tradition, or upon any authority whatsoever and is not contained in the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, Book I, ch. XXXIV, theses 15–16</span></figcaption>

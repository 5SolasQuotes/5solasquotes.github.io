<main class="wrap"><figure class="quote" id="q-6f6824abdd" data-kw="">
<blockquote><p>In calling him LORD, he regards him as the God of the covenant; not so much of a covenant of works; for believers are in truth not under the law, but under grace. Yea, as a God in the covenant of works, there is nothing to excite or attract unto confession, nor unto hope of forgiveness, for all the Lord’s virtues are armed against the sinner, so that He can keep no company with the workers of iniquity. But rather, a covenant of grace, which on account of its firmness and lasting immutability is called good, a covenant of salt, and the sure mercies of David. Herein God Himself, laying aside His wrath, letting mercy and peace go before His face, reveals the sceptre of mercy to sinful rebels, and assures all those who flee unto His mercy in the Mediator, of forgiveness of all sins.</p></blockquote>

<blockquote><p>1. Of God’s Covenant of Works, with the First Adam, and his natural seed before the fall. APHORISM I. GOD was pleased to enter into covenant with the first Adam, before his fall. Under the term, Adam, Scripture sometimes comprehends both sexes, both Adam and his wife. And if any shall contend that God entered into covenant with both Adam and we at once, as the complete root of mankind, I shall not much gainsay: and yet this will not so easily be proved, nor know I any inconvenience that would follow, should it be denied, the woman coming of Adam as well as any of his posterity. Nor am I ignorant that some are of opinion, that Adam received the covenant alone, and was to teach it, and did teach it to his wife, which opinion hath the more weight, because when God forbids the Eating of the tree of knowledge under pain of death, (wherein the promise of life contrariwise is implied,) he speaks only in the singular number, viz. to Adam only. But how may it be evidenced, That God entered into covenant with the first Adam, even into a Covenant of Works, before the Fall? Answ. Though it be not positively and plainly said in Scripture, that God gave Adam a Covenant of Works, before his fall: and though the characters and footsteps of this covenant are not so expressly discovered in Holy Writ, as of some others; yet notwithstanding, upon sundry Scripture-grounds and considerations, it may be evinced sufficiently. As, From the Inscription of the Covenant of Works in Adam’s heart. Before the Fall God wrote the Covenant of Works, viz. The Substance of the Moral Law, perfectly in Adam’s heart; and in so doing, entered into Covenant with him. Here are three thing in this Position to be cleared; viz. That the Moral Law is the Covenant of Works. That this Moral Law was perfectly written in Adams heart before the Fall. That God in Writing the Moral Law in his heart, entered into Covenant of Works with him.

1. That the Moral Law (abstractly and precisely in its self considered, without the additionals, viz. the preface, ceremonial law, &amp;c. jointly promulgated with it in Horeb) is the Covenant of Works is manifest; (1) Because, the Moral Law (by which is the knowledge of sin, and which works wrath) is styled by the Apostle “The Law of works,” and is set in opposition to “The Law of Faith.” Now this Law of Works, and Law of Faith, amount in effect to as much as the Covenant of works, and Covenant of Faith. (2) Because Righteousness and life were at first by the Moral Law, and should have been so still, had not the Law become unable to give Righteousness and life, in that it was weak through the flesh, man through Sin being unable to keep it. Now the Law, requiring obedience, and promising life upon that condition, must needs be a covenant, and that a Covenant of Works: Works being the proper Condition of it.

2. That this Moral Law for Substance was perfectly written in Adams heart before the Fall, is certain; (1) Because, Man was made in God’s image upright, and perfect. And consequently was thoroughly furnished with all accomplishments of upright and perfect Humane nature: and particularly with the Moral Law, that Law of Nature; The substance whereof was engraved both in his mind, by natural light, knowing it; and in his will, by natural integrity conforming unto it. (2) Because, The Work of the Law remains imperfectly written in some dim characters in the very hearts of pagans and heathens since the fall; They doing by nature the things contained in the Law, and being a Law unto themselves, without the Law of God written. Whence we may strongly conclude that much more before the fall the Moral Law was perfectly written in Adam’s heart, there being in him no sin to deface it in the least degree.

3. That, God, in writing the Moral Law in Adam’s heart, entered into Covenant of Works with him. viz. by real impressions upon his heart: though not by verbal expressions to the ear. For by this Law written in Adam’s heart, he had laid before him, what obedience was required and assented to on Adam’s part: And what recompense should be performed on God’s part. And this was at least an implicit, if not an explicit, covenanting. 2. From God’s express prescription of a positive Law unto Adam in his innocent State. God’s positive Law is laid down in these words, “And the LORD God commanded the man, saying, of every Tree of the Garden you may freely eat: But of the Tree of the Knowledge of good and evil, you shall not eat of it; for in the day that you eat thereof thou shall surely die.” Here are parties covenanting, and agreeing upon terms, viz. God and Adam: Here are also terms agreed upon and matters covenanted reciprocally by these parties; Adam on his part was to be obedient to God, in forbearing to Eat of the Tree of Knowledge only: God on his part, for present, permits Adam to eat of all other Trees of the Garden; And for future (in his explicit threatening of death in case of disobedience,) implicitly promises life in case of obedience herein. Now where there are parties covenanting and agreeing upon terms: And terms mutually agreed upon by those parties, as here; there’s the substance of an express covenant, though it be not formally and in express words called a covenant.</p></blockquote>

<blockquote><p>VII. Second, a law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life (by which it was sealed) and from the threatening of death (which by reason of contraries had the implied promise of life and from the various passages of Scripture which express more clearly the nature and sanction of the law, as Lev. 18:5—“If a man do these, he shall live in them,” cf. Dt. 27:26; Ezk. 20:11; Mt. 19:17; Gal. 3:12)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“VII. Second, a law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life (by which it was sealed) and from the threatening of death (which by reason of contraries had the implied promise of life and from the various passages of Scripture which express more clearly the nature and sanction of the law, as Lev. 18:5—“If a man do these, he shall live in them,” cf. Dt. 27:26; Ezk. 20:11; Mt. 19:17; Gal. 3:12)”

— Francis Turretin, Institutes of Elenctic Theology, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.3.7 [pp. 575–76].">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVII.+Second%2C+a+law+was+imposed+upon+Adam%2C+which+necessarily+implies+a+federal+agreement+and+contract.+For+he+who+receives+it%2C+binds+himself+officially+to+obedience+under+the+punishment+denounced+through+the+same%3B+he+who+gives+it+%28for+the+very+reason+that+he+exacts+obedience%29+is+bound+to+furnish+indemnity+and+security+to+the+one+obeying.+Although+Moses+sets+forth+only+one+part+of+that+federal+sanction+%28referring+to+punishment%2C+Gen.+2%3A17%29%2C+still+he+proves+that+the+former+concerning+the+promise+should+not+be+excluded%2C+both+from+the+sacrament+of+the+tree+of+life+%28by+which+it+was+sealed%29+and+from+the+threatening+of+death+%28which+by+reason+of+contraries+had+the+implied+promise+of+life+and+from+the+various+passages+of+Scripture+which+express+more+clearly+the+nature+and+sanction+of+the+law%2C+as+Lev.+18%3A5%E2%80%94%E2%80%9CIf+a+man+do+these%2C+he+shall+live+in+them%2C%E2%80%9D+cf.+Dt.+27%3A26%3B+Ezk.+20%3A11%3B+Mt.+19%3A17%3B+Gal.+3%3A12%29%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+1+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+8.3.7+%5Bpp.+575%E2%80%9376%5D.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F83baa068be.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/83baa068be.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/09/turretin-leviticus-185-is-clear-proof-of-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-ba8dc872aa" data-kw="">
<blockquote><p>In the natural path of everlasting life the first beginning is that ability of doing good, which God in the day of man’s creation endued him with; from hence obedience unto the will of his Creator, absolute righteousness and integrity in all his actions; and last of all the justice of God rewarding the worthiness of his deserts with the crown of eternal glory. Had Adam continued in his first estate, this had been the way of life unto him and all his posterity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Polity: Selections</cite>, ed. Arthur Pollard (Manchester: Fyfield Books, 1990), p. 79.</span></figcaption>

</figure><figure class="quote" id="q-f6da9df3e6" data-kw="">
<blockquote><p>For the merits of Christ’s obedience to the covenant of works he hath freed his people from the guilt of their disobedience to that covenant of works he was made under the Law to redeem them that are under the Law, Gal. 4:4, 5. now the obedience of Christ to the covenant of works was two-fold; First, his active obedience to that covenant who did perform it without any spot of sin, he saith of his obedience to his Father, I do always those things that please him, John 8:29. he finished the work that his Father gave him to do, John 17:4. and saith his Father, this is my beloved son in whom I am well pleased, Mat. 3:15. thus hath the perfect obedience of Jesus Christ satisfied for all the disobedience of his people to the covenant of works.

Secondly, The other part of Christ’s obedience was passive, he suffered the penalty due unto us for our disobedience to that covenant, though he were a son, yet learned he obedience by the things which he suffered, and being made perfect he became the author of salvation to all them that obey him, Heb. 5:8,9; 2:10. it behoved Christ to suffer and to rise from the dead the third day, Luke 24:26, 46. Christ hath once suffered for sins, the Just for the unjust, that he might bring us to God, I Pet. 3:18. he that knew no sin, neither was guile found in his mouth, who when he suffered he threatened not, but committed himself to him that judgeth righteously, I Pet. 2:25. he alone trod the winepress of his Father’s wrath, and there was none with him, Isa. 63:3. he cried out the pains of hell gat hold of him, and he cried out, My God, my God, why hast thou forsaken me, now the dignity of his person being both God and Man in one Christ, his humanity suffering but a short time made his obedience so meritorious, to free us from that guilt and penalty that is due unto us for our breach of that covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-calamy.html">Edmund Calamy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two solemn covenants made between God and man: viz. the covenant of works and the covenant of grace</cite>, (London: Thomas Banks, 1647), p. 5.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-155e914340" data-kw="">
<blockquote><p>We acknowledge, then, that as soon as any one is justified, renewal also necessarily follows: and there is no dispute as to whether or not Christ sanctifies all whom he justifies. It were to rend the gospel, and divide Christ himself, to attempt to separate the righteousness which we obtain by faith from repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session 6, p. 86</span></figcaption>

</figure><figure class="quote" id="q-120097347c" data-kw="">
<blockquote><p>The state of the case is really this, — that the faithful are never reconciled to God without the gift of regeneration; nay, we are for this end justified, — that we may afterwards serve God in holiness of life. Christ indeed does not cleanse us by his blood, nor render God propitious to us by his expiation, in any other way than by making us partakers of his Spirit, who renews us to a holy life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistle to the Romans</cite>, Romans 6:2</span></figcaption>

</figure><figure class="quote" id="q-eceb6fae86" data-kw="">
<blockquote><p>For, in the whole of this discussion, the noun righteousness and the verb to justify, are extended by Osiander to two parts; to be justified being not only to be reconciled to God by a free pardon, but also to be made just; and righteousness being not a free imputation, but the holiness and integrity which the divine essence dwelling in us inspires.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.6</span></figcaption>

<div class="actions"><button class="copy" data-copy="“For, in the whole of this discussion, the noun righteousness and the verb to justify, are extended by Osiander to two parts; to be justified being not only to be reconciled to God by a free pardon, but also to be made just; and righteousness being not a free imputation, but the holiness and integrity which the divine essence dwelling in us inspires.”

— John Calvin, Institutes of the Christian Religion, 3.11.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor%2C+in+the+whole+of+this+discussion%2C+the+noun+righteousness+and+the+verb+to+justify%2C+are+extended+by+Osiander+to+two+parts%3B+to+be+justified+being+not+only+to+be+reconciled+to+God+by+a+free+pardon%2C+but+also+to+be+made+just%3B+and+righteousness+being+not+a+free+imputation%2C+but+the+holiness+and+integrity+which+the+divine+essence+dwelling+in+us+inspires.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.11.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feceb6fae86.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eceb6fae86.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-b01fcdf19a" data-kw="">
<blockquote><p>It is indeed true, that we are justified in Christ through the mercy of God alone; but it is equally true and certain, that all who are justified are called by the Lord, that they may live worthy of their vocation. Let then the faithful learn to embrace him, not only for justification, but also for sanctification, as he has been given to us for both these purposes, lest they rend him asunder by their mutilated faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistle to the Romans</cite>, Romans 8:13</span></figcaption>

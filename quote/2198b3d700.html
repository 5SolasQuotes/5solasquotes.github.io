<blockquote><p>We the people of the State of Rhode Island and Providence Plantations, grateful to Almighty God for the civil and religious liberty which He has so long permitted us to enjoy, and looking to Him for a blessing upon our endeavors to secure and to transmit the same unimpaired to succeeding generations, do ordain and establish this constitution of government.</p></blockquote>

<blockquote><p>…it appears to me that no objection can be made to admitting into the consistory officers of justice and chiefs of police, provided they sit in it in the capacity of magistrates. But always let there be a due distinction observed between the two functions and conditions. To exclude persons that belong to the civil government from all superintendence in the spiritual administration, seems to me contrary to reason. What is essential is that when fitting persons shall have been elected to such an office, there should be no blending of their functions, nor the power of the sword confounded with what ought to be carefully kept distinct from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters, #620</cite>, (1562)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>I conclude with one word: Although the Church may enjoin it on its children, not to maintain free intercourse with any private person who has been cast out of the Church, yet it cannot command subjects to revolt from their Sovereigns when excommunicated; because they are bound to continue rendering the obedience due to them by law natural, civil and divine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Determinations</cite>, Question 4, ‘There is No Temporal Power Over Kings in Order to their Spiritual Benefit’ in The Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridge trans. Josiah Allport (1634; 1846) bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2, p. 240</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

— John Davenant, Question 4, ‘There is No Temporal Power Over Kings in Order to their Spiritual Benefit’ in The Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridge trans. Josiah Allport (1634; 1846) bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2, p. 240">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+conclude+with+one+word%3A+Although+the+Church+may+enjoin+it+on+its+children%2C+not+to+maintain+free+intercourse+with+any+private+person+who+has+been+cast+out+of+the+Church%2C+yet+it+cannot+command+subjects+to+revolt+from+their+Sovereigns+when+excommunicated%3B+because+they+are+bound+to+continue+rendering+the+obedience+due+to+them+by+law+natural%2C+civil+and+divine.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+Question+4%2C+%E2%80%98There+is+No+Temporal+Power+Over+Kings+in+Order+to+their+Spiritual+Benefit%E2%80%99+in+The+Determinations%2C+or+Resolutions+of+Certain+Theological+Questions%2C+Publicly+Discussed+in+the+University+of+Cambridge+trans.+Josiah+Allport+%281634%3B+1846%29+bound+at+the+end+of+John+Davenant%2C+A+Treatise+on+Justification%2C+or+the+Disputatio+de+Justitia...+trans.+Josiah+Allport+%281631%3B+London%2C+1846%29%2C+vol.+2%2C+p.+240&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F305b649448.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/305b649448.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/difference-of-religion-does-not-make-void-the-magistrates-authority/#:~:text=I%20conclude%20with%20one%20word%3A%20Although,by%20law%20natural%2C%20civil%20and%20divine&amp;text=I%20conclude%20with%20one%20word%3A%20Although%20the%20Church&amp;text=to%20them%20by%20law%20natural%2C%20civil%20and%20divine" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bc4bcb1741" data-kw="">
<blockquote><p>…let them persuade us that there are many beings by whose deity and providence all things are governed; let them show how the origins and beginnings of their sacred rites and gods were handed down to mortals; let them explain what is their source and principle; let them set forth what reward there is in their worship, and what punishment awaits neglect; why they wish to be worshipped by men; what the piety of men contributes to them, if they are blessed: and let them confirm all these things not by their own assertion (for the authority of a mortal man is of no weight), but by some divine testimonies, as we do. There is no occasion for violence and injury, for religion cannot be imposed by force; the matter must be carried on by words rather than by blows, that the will may be affected. Let them unsheath the weapon of their intellect; if their system is true, let it be asserted. We are prepared to hear, if they teach; while they are silent, we certainly pay no credit to them, as we do not yield to them even in their rage. Let them imitate us in setting forth the system of the whole matter: for we do not entice, as they say; but we teach, we prove, we show. And thus no one is detained by us against his will, for he is unserviceable to God who is destitute of faith and devotedness; and yet no one departs from us, since the truth itself detains him. Let them teach in this manner, if they have any confidence in the truth; let them speak, let them give utterance; let them venture, I say, to discuss with us something of this nature; and then assuredly their error and folly will be ridiculed by the old women, whom they despise, and by our boys. For, since they are especially clever, they know from books the race of the gods, and their exploits, and commands, and deaths, and tombs; they may also know that the rites themselves, in which they have been initiated, had their origin either in human actions, or in casualties, or in deaths. It is the part of incredible madness to imagine that they are gods, whom they cannot deny to have been mortal; or if they should be so shameless as to deny it, their own writings, and those of their own people, will refute them; in short, the very beginnings of the sacred rites will convict them. They may know, therefore, even from this very thing, how great a difference there is between truth and falsehood; for they themselves with all their eloquence are unable to persuade, whereas the unskilled and the uneducated are able, because the matter itself and the truth speaks. Why then do they rage, so that while they wish to lessen their folly, they increase it? Torture and piety are widely different; nor is it possible for truth to be united with violence, or justice with cruelty. But with good reason they do not venture to teach anything concerning divine things, lest they should both be derided by our people and be deserted by their own. For the common people for the most part, if they ascertain that these mysteries were instituted in memory of the dead, will condemn them, and seek for some truer object of worship. ‘Hence rites of mystic awe’ were instituted by crafty men, that the people may not know what they worship. But since we are acquainted with their systems, why do they either not believe us who are acquainted with both, or envy us because we have preferred truth to falsehood? But, they say, the public rites of religion must be defended. Oh with what an honorable inclination the wretched men go astray! For they are aware that there is nothing among men more excellent than religion, and that this ought to be defended with the whole of our power; but as they are deceived in the matter of religion itself, so also are they in the manner of its defense. For religion is to be defended, not by putting to death, but by dying; not by cruelty, but by patient endurance; not by guilt, but by good faith: for the former belong to evils, but the latter to goods; and it is necessary for that which is good to have place in religion, and not that which is evil. For if you wish to defend religion by bloodshed, and by tortures, and by guilt, it will no longer be defended, but will be polluted and profaned. For nothing is so much a matter of free-will as religion; in which, if the mind of the worshipper is disinclined to it, religion is at once taken away, and ceases to exist. The right method therefore is that you defend religion by patient endurance or by death; in which the preservation of the faith is both pleasing to God Himself and adds authority to religion. For if he who in this earthly warfare preserves his faith to his king in some illustrious action, if he shall continue to live, because more beloved and acceptable, and if he shall fall, obtains the highest glory, because he has undergone death for his leader; how much more is faith to be kept towards God, the Ruler of all, who is able to pay the reward of virtue, not only to the living, but also to the dead! Therefore the worship of God, since it belongs to heavenly warfare, requires the greatest devotedness and fidelity. For how will God either love the worshipper, if He Himself is not loved by him, or grant to the petitioner whatever he shall ask, when he draws near to offer his prayer without sincerity or reverence? But these men, when they come to offer sacrifice, present to their gods nothing from within, nothing of their own — no uprightness of mind, no reverence or fear. Therefore, when the worthless sacrifices are completed, they leave their religion altogether in the temple, and with the temple, as they had found it; and neither bring with them anything of it, nor take anything back. Hence it is that religious observances of this kind are neither able to make men good, nor to be firm and unchangeable. And thus men are easily led away from them, because nothing is learned in them relating to the life, nothing relating to wisdom, nothing to faith. For what is the religion of those gods? What is its power? What its discipline? What its origin? What its principle? What its foundation? What its substance? What is its tendency? Or what does it promise, so that it may be faithfully preserved and boldly defended by man? I see nothing else in it than a rite pertaining to the fingers only. But our religion is on this account firm and solid, and unchangeable, because it teaches justice, because it is always with us, because it has its existence altogether in the soul of the worshipper, because it has the mind itself for a sacrifice. In that religion nothing else is required but the blood of animals, and the smoke of incense, and the senseless pouring out of libations; but in this of ours, a good mind, a pure breast, an innocent life: those rites are frequented by unchaste adulteresses without any discrimination, by impudent procuresses, by filthy harlots; they are frequented by gladiators, robbers, thieves, and sorcerers, who pray for nothing else but that they may commit crimes with impunity. For what can the robber ask when he sacrifices, or the gladiator, but that they may slay? What the poisoner, but that he may escape notice? What the harlot, but that she may sin to the uttermost? What the adulteress, but either the death of her husband, or that her unchastity may be concealed? What the procuress, but that she may deprive many of their property? What the thief, but that he may commit more peculations? But in our religion there is no place even for a slight and ordinary offense; and if any one shall come to a sacrifice without a sound conscience, he hears what threats God denounces against him: that God, I say, who sees the secret places of the heart, who is always hostile to sins, who requires justice, who demands fidelity. What place is there here for an evil mind or for an evil prayer? But those unhappy men neither understand from their own crimes how evil it is to worship, since, defiled by all crimes, they come to offer prayer; and they imagine that they offer a pious sacrifice if they wash their skin; as though any streams could wash away, or any seas purify, the lusts which are shut up within their breast. How much better it is rather to cleanse the mind, which is defiled by evil desires, and to drive away all vices by the one laver of virtue and faith! For he who shall do this, although he bears a body which is defiled and sordid, is pure enough.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lactantius.html">Lactantius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Institutes</cite>, bk. 5, ch. 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

— Lactantius, The Divine Institutes, bk. 5, ch. 20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6let+them+persuade+us+that+there+are+many+beings+by+whose+deity+and+providence+all+things+are+governed%3B+let+them+show+how+the+origins+and+beginnings+of+their+sacred+rites+and+gods+were+handed+down+to+mortals%3B+let+them+explain+what+is+their+source+and+principle%3B+let+them+set+forth+what+reward+there+is+in+their+worship%2C+and+what+punishment+awaits+neglect%3B+why+they+wish+to+be+worshipped+by+men%3B+what+the+piety+of+men+contributes+to+them%2C+if+they+are+blessed%3A+and+let+them+confirm+all+these+things+not+by+their+own+assertion+%28for+the+authority+of+a+mortal+man+is+of+no+weight%29%2C+but+by+some+divine+testimonies%2C+as+we+do.+There+is+no+occasion+for+violence+and+injury%2C+for+religion+cannot+be+imposed+by+force%3B+the+matter+must+be+carried+on+by+words+rather+than+by+blows%2C+that+the+will+may+be+affected.+Let+them+unsheath+the+weapon+of+their+intellect%3B+if+their+system+is+true%2C+let+it+be+asserted.+We+are+prepared+to+hear%2C+if+they+teach%3B+while+they+are+silent%2C+we+certainly+pay+no+credit+to+them%2C+as+we+do+not+yield+to+them+even+in+their+rage.+Let+them+imitate+us+in+setting+forth+the+system+of+the+whole+matter%3A+for+we+do+not+entice%2C+as+they+say%3B+but+we+teach%2C+we+prove%2C+we+show.+And+thus+no+one+is+detained+by+us+against+his+will%2C+for+he+is+unserviceable+to+God+who+is+destitute+of+faith+and+devotedness%3B+and+yet+no+one+departs+from+us%2C+since+the+truth+itself+detains+him.+Let+them+teach+in+this+manner%2C+if+they+have+any+confidence+in+the+truth%3B+let+them+speak%2C+let+them+give+utterance%3B+let+them+venture%2C+I+say%2C+to+discuss+with+us+something+of+this+nature%3B+and+then+assuredly+their+error+and+folly+will+be+ridiculed+by+the+old+women%2C+whom+they+despise%2C+and+by+our+boys.+For%2C+since+they+are+especially+clever%2C+they+know+from+books+the+race+of+the+gods%2C+and+their+exploits%2C+and+commands%2C+and+deaths%2C+and+tombs%3B+they+may+also+know+that+the+rites+themselves%2C+in+which+they+have+been+initiated%2C+had+their+origin+either+in+human+actions%2C+or+in+casualties%2C+or+in+deaths.+It+is+the+part+of+incredible+madness+to+imagine+that+they+are+gods%2C+whom+they+cannot+deny+to+have+been+mortal%3B+or+if+they+should+be+so+shameless+as+to+deny+it%2C+their+own+writings%2C+and+those+of+their+own+people%2C+will+refute+them%3B+in+short%2C+the+very+beginnings+of+the+sacred+rites+will+convict+them.+They+may+know%2C+therefore%2C+even+from+this+very+thing%2C+how+great+a+difference+there+is+between+truth+and+falsehood%3B+for+they+themselves+with+all+their+eloquence+are+unable+to+persuade%2C+whereas+the+unskilled+and+the+uneducated+are+able%2C+because+the+matter+itself+and+the+truth+speaks.+Why+then+do+they+rage%2C+so+that+while+they+wish+to+lessen+their+folly%2C+they+increase+it%3F+Torture+and+piety+are+widely+different%3B+nor+is+it+possible+for+truth+to+be+united+with+violence%2C+or+justice+with+cruelty.+But+with+good+reason+they+do+not+venture+to+teach+anything+concerning+divine+things%2C+lest+they+should+both+be+derided+by+our+people+and+be+deserted+by+their+own.+For+the+common+people+for+the+most+part%2C+if+they+ascertain+that+these+mysteries+were+instituted+in+memory+of+the+dead%2C+will+condemn+them%2C+and+seek+for+some+truer+object+of+worship.+%E2%80%98Hence+rites+of+mystic+awe%E2%80%99+were+instituted+by+crafty+men%2C+that+the+people+may+not+know+what+they+worship.+But+since+we+are+acquainted+with+their+systems%2C+why+do+they+either+not+believe+us+who+are+acquainted+with+both%2C+or+envy+us+because+we+have+preferred+truth+to+falsehood%3F+But%2C+they+say%2C+the+public+rites+of+religion+must+be+defended.+Oh+with+what+an+honorable+inclination+the+wretched+men+go+astray%21+For+they+are+aware+that+there+is+nothing+among+men+more+excellent+than+religion%2C+and+that+this+ought+to+be+defended+with+the+whole+of+our+power%3B+but+as+they+are+deceived+in+the+matter+of+religion+itself%2C+so+also+are+they+in+the+manner+of+its+defense.+For+religion+is+to+be+defended%2C+not+by+putting+to+death%2C+but+by+dying%3B+not+by+cruelty%2C+but+by+patient+endurance%3B+not+by+guilt%2C+but+by+good+faith%3A+for+the+former+belong+to+evils%2C+but+the+latter+to+goods%3B+and+it+is+necessary+for+that+which+is+good+to+have+place+in+religion%2C+and+not+that+which+is+evil.+For+if+you+wish+to+defend+religion+by+bloodshed%2C+and+by+tortures%2C+and+by+guilt%2C+it+will+no+longer+be+defended%2C+but+will+be+polluted+and+profaned.+For+nothing+is+so+much+a+matter+of+free-will+as+religion%3B+in+which%2C+if+the+mind+of+the+worshipper+is+disinclined+to+it%2C+religion+is+at+once+taken+away%2C+and+ceases+to+exist.+The+right+method+therefore+is+that+you+defend+religion+by+patient+endurance+or+by+death%3B+in+which+the+preservation+of+the+faith+is+both+pleasing+to+God+Himself+and+adds+authority+to+religion.+For+if+he+who+in+this+earthly+warfare+preserves+his+faith+to+his+king+in+some+illustrious+action%2C+if+he+shall+continue+to+live%2C+because+more+beloved+and+acceptable%2C+and+if+he+shall+fall%2C+obtains+the+highest+glory%2C+because+he+has+undergone+death+for+his+leader%3B+how+much+more+is+faith+to+be+kept+towards+God%2C+the+Ruler+of+all%2C+who+is+able+to+pay+the+reward+of+virtue%2C+not+only+to+the+living%2C+but+also+to+the+dead%21+Therefore+the+worship+of+God%2C+since+it+belongs+to+heavenly+warfare%2C+requires+the+greatest+devotedness+and+fidelity.+For+how+will+God+either+love+the+worshipper%2C+if+He+Himself+is+not+loved+by+him%2C+or+grant+to+the+petitioner+whatever+he+shall+ask%2C+when+he+draws+near+to+offer+his+prayer+without+sincerity+or+reverence%3F+But+these+men%2C+when+they+come+to+offer+sacrifice%2C+present+to+their+gods+nothing+from+within%2C+nothing+of+their+own+%E2%80%94+no+uprightness+of+mind%2C+no+reverence+or+fear.+Therefore%2C+when+the+worthless+sacrifices+are+completed%2C+they+leave+their+religion+altogether+in+the+temple%2C+and+with+the+temple%2C+as+they+had+found+it%3B+and+neither+bring+with+them+anything+of+it%2C+nor+take+anything+back.+Hence+it+is+that+religious+observances+of+this+kind+are+neither+able+to+make+men+good%2C+nor+to+be+firm+and+unchangeable.+And+thus+men+are+easily+led+away+from+them%2C+because+nothing+is+learned+in+them+relating+to+the+life%2C+nothing+relating+to+wisdom%2C+nothing+to+faith.+For+what+is+the+religion+of+those+gods%3F+What+is+its+power%3F+What+its+discipline%3F+What+its+origin%3F+What+its+principle%3F+What+its+foundation%3F+What+its+substance%3F+What+is+its+tendency%3F+Or+what+does+it+promise%2C+so+that+it+may+be+faithfully+preserved+and+boldly+defended+by+man%3F+I+see+nothing+else+in+it+than+a+rite+pertaining+to+the+fingers+only.+But+our+religion+is+on+this+account+firm+and+solid%2C+and+unchangeable%2C+because+it+teaches+justice%2C+because+it+is+always+with+us%2C+because+it+has+its+existence+altogether+in+the+soul+of+the+worshipper%2C+because+it+has+the+mind+itself+for+a+sacrifice.+In+that+religion+nothing+else+is+required+but+the+blood+of+animals%2C+and+the+smoke+of+incense%2C+and+the+senseless+pouring+out+of+libations%3B+but+in+this+of+ours%2C+a+good+mind%2C+a+pure+breast%2C+an+innocent+life%3A+those+rites+are+frequented+by+unchaste+adulteresses+without+any+discrimination%2C+by+impudent+procuresses%2C+by+filthy+harlots%3B+they+are+frequented+by+gladiators%2C+robbers%2C+thieves%2C+and+sorcerers%2C+who+pray+for+nothing+else+but+that+they+may+commit+crimes+with+impunity.+For+what+can+the+robber+ask+when+he+sacrifices%2C+or+the+gladiator%2C+but+that+they+may+slay%3F+What+the+poisoner%2C+but+that+he+may+escape+notice%3F+What+the+harlot%2C+but+that+she+may+sin+to+the+uttermost%3F+What+the+adulteress%2C+but+either+the+death+of+her+husband%2C+or+that+her+unchastity+may+be+concealed%3F+What+the+procuress%2C+but+that+she+may+deprive+many+of+their+property%3F+What+the+thief%2C+but+that+he+may+commit+more+peculations%3F+But+in+our+religion+there+is+no+place+even+for+a+slight+and+ordinary+offense%3B+and+if+any+one+shall+come+to+a+sacrifice+without+a+sound+conscience%2C+he+hears+what+threats+God+denounces+against+him%3A+that+God%2C+I+say%2C+who+sees+the+secret+places+of+the+heart%2C+who+is+always+hostile+to+sins%2C+who+requires+justice%2C+who+demands+fidelity.+What+place+is+there+here+for+an+evil+mind+or+for+an+evil+prayer%3F+But+those+unhappy+men+neither+understand+from+their+own+crimes+how+evil+it+is+to+worship%2C+since%2C+defiled+by+all+crimes%2C+they+come+to+offer+prayer%3B+and+they+imagine+that+they+offer+a+pious+sacrifice+if+they+wash+their+skin%3B+as+though+any+streams+could+wash+away%2C+or+any+seas+purify%2C+the+lusts+which+are+shut+up+within+their+breast.+How+much+better+it+is+rather+to+cleanse+the+mind%2C+which+is+defiled+by+evil+desires%2C+and+to+drive+away+all+vices+by+the+one+laver+of+virtue+and+faith%21+For+he+who+shall+do+this%2C+although+he+bears+a+body+which+is+defiled+and+sordid%2C+is+pure+enough.%E2%80%9D%0A%0A%E2%80%94+Lactantius%2C+The+Divine+Institutes%2C+bk.+5%2C+ch.+20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbc4bcb1741.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bc4bcb1741.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-civil-magistrates-authority-around-spiritual-things-circa-sacra/#:~:text=let%20them%20persuade%20us%20that%20there,defiled%20and%20sordid%2C%20is%20pure%20enough&amp;text=let%20them%20persuade%20us%20that%20there%20are%20many&amp;text=which%20is%20defiled%20and%20sordid%2C%20is%20pure%20enough" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>What was used in the days of Henry VIII and Edward VI appears by the book of acts and monuments and statutes in their days, to wit, the rejecting the Pope’s jurisdiction, appointing visitors, judging and deposing some bishops, commands to take down images, causing divine service to be in the English tongue, the Bible in the English tongue to be in churches, with many other things of the like kind. The promise to defend them is ‘to our power’ whether by opposing the bringers in of a foreign power, especially the Pope’s or by aiding the king in the right use of this authority, neither is the power granted which may not be lawfully used or exercised, nor is the abuse of it required to be defended.</p></blockquote>

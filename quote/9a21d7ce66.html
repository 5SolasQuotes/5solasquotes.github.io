<main class="wrap"><figure class="quote" id="q-9a21d7ce66" data-kw="">
<blockquote><p>The covenant of grace partakes both of a testament and of a covenant. Hence it is not improperly called “a covenant by a testament,” “a testamentary covenant” and a “federal testament.” It is a covenant because after the manner of a covenant there was an agreement between parties and conditions were laid down on both sides, both on the part of God and on the part of man, and there was a mediator to reconcile the discordant parties. But it is also a “testament” (1) because it is a covenant in which an inheritance is promised (which necessarily demands the antecedent death of the testator, since he only then is reckoned an heir who obtains the goods by an intervention of the will of the disposer). Since therefore the covenant (diathēkē) is a promise (epangelia) of this kind (in virtue of which the inheritance is discerned), it must necessarily be testamentary. On this account, the apostle adds, “For where a diathēkē is [to wit, by which an inheritance is promised, i.e., a testament], there must also of necessity be the death of the testator.” (2) Because for our advantage only was this covenant made, as in a testament the advantage not of the testator but of the heirs is regarded; nor is God reconciled concerning mutual benefits, but concerning his own alone. (3) Because although conditions are set forth on both sides, they are entrusted for execution to the virtue and fidelity of only one party (namely, of God). Hence it is founded upon the mere grace of God and upon no disposition and merit of man (as will be fully proved in the proper place).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 12.1.3.</span></figcaption>

<blockquote><p>appetitus: appetite, desire; specifically, the appetitive faculty or capacity of a being, which seeks out or inclines toward a good. In all spiritual beings, including God, the exercise of will implies appetite. By extension, the propensities of inanimate objects, and even of matter, can be described as appetite… Scholastic theology and philosophy focus in particular upon the appetites of finite spiritual beings, which by nature seek out their own good. Since the fall has caused a deprivation and distortion of desire, a distinction must be made between appetitus rectus, right desire, and appetitus perversus or inordinatus, perverse or inordinate desire. It is characteristic of the desire of sinful beings that it misidentifies the good, particularly ultimate good, and perversely, or inordinately, desires finite things as ends in themselves (see frui). Thus appetitus perversus and appetitus inordinatus (q.v.) are synonyms for sin (peccatum, q.v.). Appetite can be distinguished further into natural appetite (appetitus naturalis), rational or voluntary appetite (appetitus rationalis sive voluntarius), and animal or sensual or sensitive appetite (appetitus animalis sive sensualis; appetitus sensitivus). Natural appetite is simply the nature of any existent thing to be what it is and to perform its proper acts or operations; e.g., human beings have a natural appetite for breathing! The rational or voluntary appetite, also called appetitus intellectualis, intellectual appetite, is the will (voluntas, q.v.). Whereas it is the intellect (intellectus, q.v.) that perceives and knows objects, it is the will that chooses. Since choice belongs to the will, the will must be exercised in the choice of even purely intellectual objects—thus appetitus intellectualis. In addition, since the will and the intellect are not really distinct, but only formally or rationally distinct (see distinctio), the appetitive function of will is also rational (rationalis). Thus the will desires the goodness, truth, and justice known by the intellect… The appetitus animalis sive sensualis or appetitus sensitivus is thus emotion or passion (affectus, passio), and it may be described in terms of the six concupiscible (concupiscibilis, q.v.) passions: love and hate, joy and sadness, desire and aversion; and of the five irascible (irascibilis, q.v.) passions: courage and fear, hope, despair, and anger. This appetite, because of its relation to the body, is usually described as being situated “below” the will in the hierarchy of human faculties.</p></blockquote>

</figure><figure class="quote" id="q-5c50f1c820" data-kw="">
<blockquote><p>The gospel after the fall was revealed in the form of a free and absolute promise of a Savior with salvation in Him to lost sinners of mankind. It was then promised that the seed of the woman would bruise the head of the serpent (Gen. 3:15). The gospel was preached to Abraham also under the form of an absolutely free promise: in thee and in thy seed shall all the nations of the earth be blessed (see Gen. 12:3; 22:18; Gal. 3:8). In the gospel, salvation from sin, from the curse of the law, and from the wrath of God, as well as restoration to fellowship with God, conformity to Him, and the eternal enjoyment of Him are graciously promised in Christ to all who cordially believe in Him. The Lord promises in His gospel that He will give His Holy Spirit to elect sinners to quicken their dead souls; to enlighten their dark minds; to enable them to believe in Jesus; to repent of their sins after a godly sort; to love, obey, and enjoy Him now; and to attain the perfect fruition of Him forevermore. In the gospel, as preached under the Old Testament, were promises of the coming of Messiah in human nature; and in the same gospel, as preached under the New, are promises of the coming of the Spirit, or of Christ’s coming in a greater measure of spiritual influences. These promises are, in the gospel, presented or offered to sinners in common and are made and performed to such sinners as believe.</p></blockquote>

<blockquote><p>f. It is both conditional and unconditional. The question is repeatedly asked, whether the covenant is conditional or unconditional. This is a question that cannot be answered without careful discrimination, for the answer will depend on the point of view from which the covenant is considered. On the one hand the covenant is unconditional. There is in the covenant of grace no condition that can be considered as meritorious. The sinner is exhorted to repent and believe, but his faith and repentance do not in any way merit the blessings of the covenant. This must be maintained in opposition to both the Roman Catholic and the Arminian position. Neither is it conditional in the sense that man is expected to perform in his own strength what the covenant requires of him. In placing him before the demands of the covenant, we must always remind him of the fact that he can obtain the necessary strength for the performance of his duty only from God. In a sense it may be said that God Himself fulfills the condition in the elect. That which may be regarded as a condition in the covenant, is for those who are chosen unto everlasting life also a promise, and therefore a gift of God. Finally, the covenant is not conditional in the sense that the reception of every separate blessing of the covenant is dependent on a condition. We may say that faith is the conditio sine qua non of justification, but the reception of faith itself in regeneration is not dependent on any condition, but only on the operation of the grace of God in Christ. On the other hand the covenant may be called conditional. There is a sense in which the covenant is conditional. If we consider the basis of the covenant, it is clearly conditional on the suretyship of Jesus Christ. In order to introduce the covenant of grace, Christ had to, and actually did, meet the conditions originally laid down in the covenant of works, by His active and passive obedience. Again, it may be said that the covenant is conditional as far as the first conscious entrance into the covenant as a real communion of life is concerned. This entrance is contingent on faith, a faith, however, which is itself a gift of God. When we speak of faith as a condition here, we naturally refer to faith as a spiritual activity of the mind. It is only through faith that we can obtain a conscious enjoyment of the blessings of the covenant. Our experimental knowledge of the covenant life is entirely dependent on the exercise of faith. He who does not live a life of faith is, as far as his consciousness is concerned, practically outside of the covenant. If in our purview we include not only the beginning, but also the gradual unfolding and completion of the covenant life, we may regard sanctification as a condition in addition to faith. Both are conditions, however, within the covenant. Reformed Churches have often objected to the use of the word “condition” in connection with the covenant of grace. This was largely due to a reaction against Arminianism, which employed the word “condition” in an un-Scriptural sense, and therefore to a failure to discriminate properly [Cf. Dick, Theol. Lect. XLVIII]. Bearing in mind what was said in the preceding, it would seem to be perfectly proper to speak of a condition in connection with the covenant of grace, for (1) the Bible clearly indicates that the entrance upon the covenant life is conditioned on faith, John 3:16, 36; Acts 8:37 (not found in some MSS.); Rom. 10:9; (2) Scripture often threatens covenant children, but these threatenings apply exactly to those who ignore the condition, that is, who refuse to walk in the way of the covenant; and (3) if there were no condition, God only would be bound by the covenant, and there would be no “bond of the covenant” for man (but cf. Ezek. 20:37); and thus the covenant of grace would lose its character as a covenant, for there are two parts in all covenants.</p></blockquote>

<blockquote><p>There is in God a universal or common love by which he is inclined to do good to every creature, and so then also to man (Ps. 36:6; 1 Tim. 4:10), by external and common benefits (Ps. 17:14), and there is also a special, saving love by which he dispenses the benefits that accompany salvation, which have an unbreakable connection with salvation (Heb. 6:9).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1cf524a599" data-kw="">
<blockquote><p>There are his rights of conscience, and more especially the right of judging for himself what is his duty and what his sin in reference to God, and of determining for himself what he shall believe as God’s truth, and what reject as man’s doctrine and commandment. There are the rights of his soul, and more especially the right to that salvation which his soul requires, and which is freely given him of God.

These are rights intimately spiritual nature, which are dearer and better to him than property or life; and these rights the Church of Rome, in the exercise of its ecclesiastical power, has rudely trampled on, or violently taken away. And the history of that Church tells on its every page, and in characters never to be effaced, that the spiritual power committed to it “for edification” has been turned “ to the destruction” of the body of Christ.

First, Popery has turned the power of the Church to the purposes of destruction, by violently taking away or rudely disregarding the rights of man, viewed as a rational and intellectual being. The right of every man to think and to judge for himself, and on his own responsibility, as a rational creature, Popery has taken away from its victims; and above all, the right to know God directly and immediately, by what God has made known of Himself, the Church of Rome has denied, and by its ecclesiastical power interdicted to its slaves.

Itself blind, and the leader of the blind, who have trusted it, the Church of Rome has “taken away the key of knowledge,” lest men should exercise their right to know God, and see for themselves His revealed will. It has sealed up the Bible as a perilous book, and forbidden men to receive it, except through the interpretation and teaching of the Church; thus standing between men and the knowledge of God in the way that God has given that knowledge in His own word.

It is the first right of every human being, as a rational and intellectual creature, to understand God; because this was the very end for which he was made, and for which he lives. It was the distinctive purpose of his creation; and it is not only to degrade him from his place in creation, but to destroy his very character as a rational creature, to take from him by violence and wrong the right he has to know God in the way in which God has made Himself to be known. A power so employed as to rob man by force or fraud of this right, and to substitute the teaching of a fellow-creature for the Word of God addressed to his understanding, is a power exercised not for edification, but destruction.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c56e7c541" data-kw="">
<blockquote><p>Now there was brought forth in Scotland, anno 1610, a certain amphibian brood, sprung out of the stem of Neronian tyranny and in manners like to his nearest kinsman, the Spanish Inquisition. It is armed with a transcendent power and called by the dreadful name of the High Commission. Among other things, it arrogates to itself the power of deposing ministers. But how unjustly, thus it appears:

1. If those commissioners have any power at all to depose ministers, they have it from the king whose commissioners they are. But from him they have it not. Therefore they have none at all. The proposition is most certain: For they sit not in that commission to judge in their own name, nor by their own authority quum nihil exerceat delegatus nomine proprio, as Panormitan says (apud Forb. Iren, bk. 2, ch. 11, p. 177), but by virtue only of the commission and delegation which they have of the king. Yea, bishops themselves exerce not any jurisdiction in the High Commission as bishops, but only as the king’s commissioners, as Dr. Downame aknowledges (Defens., bk. 1, p. 8). The assumption is grounded upon this reason: The king has not power to depose ministers. Therefore he cannot give this power to others. For Nemo potest plus juris transferre in alium quam sibi competere dignoscatur (Boniface, 8, De Regul. Juris Reg., 79). The king may sometimes inflict such a civil punishment upon ministers, whereupon secondarily and accidentally will follow their falling away from their ecclesiastical office and function, (in which sense it is said that Solomon deposed Abiathar, as we heard before), but to depose them directly and formally (which the High Commission usurps to do), he has no power, and that because this deposition is an act of ecclesiastical jurisdiction: Whereas the power of Ecclesiastical jurisdiction does no more agree to the king than the power of ecclesiastical order: his power is civil and temporal, not spiritual and ecclesiastical. Dr. Field also confesses that none may judicially degrade or put anyone lawfully admitted from his degree and order but the spiritual guides of the Church alone (Of the Church, bk. 5, ch. 53, p. 682).

2. The deposing of ministers pertains to classical presbyteries, or (if the matter be doubtful and difficille) to synods, as has been showed. And who then can give the High Commission such authority as to take this power from them, and to assume it unto itself. These Commissioners profess that they have authority to discharge other ecclesiastical judicatories within the kingdom from meddling with the judging of anything which they shall think impertinent for them, and which they shall think good to judge and decide by themselves in their commission. Which, if it be so, then (when it pleases them) they may make other ecclesiastical judicatories to be altogether useless and of no effect in the Church.

3. In this commission, ecclesiastical and temporal men are joined together, and both armed with the same power. Therefore it is not right nor regular, nor in any wise allowable. For even as when a minister has offended in a civil matter, his fault is to be judged by civil judges according to the civil laws, and by no other: so when he offends in an ecclesiastical matter, his fault is to be judged only by ecclesiastical persons according to ecclesiastical laws: and in such a case Justinian forbids civil men to be joined with ecclesiastical men in judgment (Novell., 83, ch. 1). They are ecclesiastical things or causes which are handled and examined by the High Commission in the process of deposing ministers: and a shame it is to ecclesiastical men if they can, without the help and joining of temporal men, judge and decide things of this quality.

4. As in the matters to be judged, so in the censures and punishments to be inflicted; ecclesiastical and civil men have in this Commission alike power and authority: for ecclesiastical men therein have power of fining, confining, warding, etc. common to them with the temporal men: and again, the temporal men have power of excommunication, suspension, deprivation, etc. common to them with the ecclesiastical men. For they all sit there as the king’s commissioners, and so nomine [by name] they exerce this jurisdiction: which Commission being alike discharged by them all, it is manifest that both temporal men take hold of the keys and ecclesiastical men take hold of the civil sword. And this monstruous confusion and mixture gives sufficient demonstration that such a form of judgement is not from the God of order.</p></blockquote>

l+men%2C+judge+and+decide+things+of+this+quality.+4.+As+in+the+matters+to+be+judged%2C+so+in+the+censures+and+punishments+to+be+inflicted%3B+ecclesiastical+and+civil+men+have+in+this+Commission+alike+power+and+authority%3A+for+ecclesiastical+men+therein+have+power+of+fining%2C+confining%2C+warding%2C+etc.+common+to+them+with+the+temporal+men%3A+and+again%2C+the+temporal+men+have+power+of+excommunication%2C+suspension%2C+deprivation%2C+etc.+common+to+them+with+the+ecclesiastical+men.+For+they+all+sit+there+as+the+king%E2%80%99s+commissioners%2C+and+so+nomine+%5Bby+name%5D+they+exerce+this+jurisdiction%3A+which+Commission+being+alike+discharged+by+them+all%2C+it+is+manifest+that+both+temporal+men+take+hold+of+the+keys+and+ecclesiastical+men+take+hold+of+the+civil+sword.+And+this+monstruous+confusion+and+mixture+gives+sufficient+demonstration+that+such+a+form+of+judgement+is+not+from+the+God+of+order.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies%2C+%281637%29%2C+pt.+3%2C+bk.+8%2C+Digression+4%2C+pp.+195-97&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6c56e7c541.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6c56e7c541.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/civil-government/#:~:text=Now%20there%20was%20brought%20forth%20in,not%20from%20the%20God%20of%20order&amp;text=Now%20there%20was%20brought%20forth%20in%20Scotland%2C%20anno&amp;text=judgement%20is%20not%20from%20the%20God%20of%20order" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Every once in a while it is said that the present world war is a war of democracy against state totalitarianism. No doubt that assertion contains a considerable element of truth, but it should not be taken without several grains of salt. The fact that totalitarian Russia is fighting on the side of the allies may well give pause. So may the expressed conviction of many thoughtful Americans that for some years already there has been in evidence in the government of our own land a totalitarian trend.

And it goes without saying that the desire, however foolish, on the part of the citizens of one country to live under a totalitarian regime is no good reason for another nation to issue a declaration of war. The undersigned prefers to think of the present conflict as a war, by nations which themselves have transgressed God’s law in many ways, on wanton international aggression, flagrant international lawlessness, brazen international piracy, blatant international nihilism. Even that conception is not without its difficulties and, no doubt, suffers from oversimplification, but it does seem to name the chief factor in a highly complex situation.</p></blockquote>

</figure><figure class="quote" id="q-3eb2342fa4" data-kw="">
<blockquote><p>The king receives royal power with the states to make good laws, and power by his royalty to execute those laws, and this power the community has devolved in the hands of the king and states of parliament; but the community keeps to themselves a power to resist tyranny, and to coerce it, and eatenus, ‘in so far’ is Saul subject, that David is not to compear before him, nor to lay down Goliah’s sword, nor disband his army of defence, though the king should command him so to do.</p></blockquote>

<blockquote><p>And when having attained their ungodly desires (whether ambitious kings by bringing any country into their subjection, or disloyal subjects by their rebellious rising against their natural sovereigns), they have established any of the same degenerate forms of government among their people, the authority, either so unjustly gotten, or wrung by force from the true and lawful possessor, being always God’s authority (and therefore receiving no impeachment by the wickedness of those that have it), is ever (when any such alterations are thoroughly settled) to be reverenced and obeyed, and the people of all sorts (as well of the clergy as of the laity) are to be subject unto it, not only for wrath, but also for conscience sake.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f819638ef1" data-kw="">
<blockquote><p>I. God as the supreme Lord has true right over the actions of all men, both internal and external, that they may serve his glory and obedience be rendered to him in all things (Luke 17:10), which obedience moreover he as ruler has commanded and sanctioned under the gravest threats (Gen 2:17, Deut 27:26). When man violates this right and denies this obedience to God, he commits two things: 1) he does not acknowledge the lordship of his master over himself, 2) he despises him, even by disdaining his laws before his sight, who pays heed to all the ways of men. Hence this wickedness is so great that none greater can be given; by it man turns away from the infinite good, and consequently merits for himself the privation of the highest good; whence he has been handed over by his Lord, whose obedience he refused, into servitude to the Devil and his servants, that he may be tormented by them in [God’s] name and experience the gravity of the lordship he despised (Jude 5-6). … III. Hence if any are vindicated from this servitude (as it is certain that all the elect have been and will be vindicated), it is necessary that this acknowledgment, that is, the restitution of honor, be exhibited to the supreme Lord and Ruler injured and offended by our disobedience, and that his laws and exactions be satisfied…. … VI. But Christ, offering himself to God (our Lord whose captives we were, by Thesis 1) as a sacrifice and victim (of the same character as the Old Testament victims) as a fragrant aroma (Eph 5:2, Heb 8:3, 9:14; cf. Gen 8:21, Lev 1), separated us from servitude to the Devil, etc. Therefore [he redeemed us]. Socinus (Praelections, ch. 9) and Volkelius (ibid.) declaim here in a rather diluted rhetorical way, hence the price had to be paid to the Devil – as if the λύτρον [ransom] were owed to the punishment or its executioner, and not to the one in whose name it is commanded and inflicted! When someone is freed from the gallows by the intervention of a payment, is it brought to the gallows or the executioner? or rather to the one who holds the right of majesty? We see here that it is not impossible to demonstrate to whom this price was paid, as Volkelius thinks (lib. 3, cap. 18). For the passages alleged teach that Christ offered himself to God as a victim for us. Christ, therefore, is such a redeemer who freed us by the intervention of a price (Acts 20:28, 1 Pet 1:18-19), which price indeed agrees in the formality of price with what is used in exchanges, like gold, silver, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’</cite>, tr. Onku with AI (Utrecht, 1650) Latin</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-24eb9791c0" data-kw="">

</figure><figure class="quote" id="q-67cb1ff92e" data-kw="">
<blockquote><p>For this properly means to die for another: to liberate another from death by one’s own death, that he may live. Thus David in his lamentation exclaims: “My son Absalom: who shall give me to die for thee?” meaning, would that by my death I could redeem thy life, or liberate thee from death (2 Sam. 18:33). In the same way Christ is said to have” died for us when we were enemies” and “ungodly”: that is, to have liberated us, being enemies and ungodly, from death by his own death (Rom. 5:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Oration on the Synod of Dort &amp; the Remonstrants’ Articles’</cite>, Article 2, ‘Concerning the Death of Christ for All’ in ‘Oration on the Synod of Dort &amp; the Remonstrants’ Articles’ trans. AI (1619; Monergism, 2026), pp. 24-27, p. 25</span></figcaption>

</figure><figure class="quote" id="q-b5af0f9625" data-kw="">
<blockquote><p>It is true that Calvin has intimated more than once his con- viction, that the position laid down by some of the schoolmen, viz. that Christ died ” sufficienter pro omnibus, efficaciter pro electis,” is sound and orthodox in some sense. But then he has never, so far as we remember or have seen proved, explained precisely in what sense he held it, and there is a sense in which the advocates of particular redemption can consistently admit and adopt it.† † When the subject of the extent of the atonement came to be more fully and exactly discussed, orthodox Calvinists generally objected to adopt this scholastic position, on the ground that it seemed to imply an ascription to Christ of a, purpose or intention of dying in some sense for all men. For this reason they usually declined to adopt it as it stood, or they proposed to alter it into this form, — Christ’s death was sufficient for all, efficacious for the elect. By this change in the position, the question was made to turn, not on what Christ did, but on what His death was; and thus the appearance of ascribing to Him personally a purpose or intention of dying, in some sense, for all men, was removed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-ponter.html">David Ponter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Classic “Sufficient for all, Efficient for the elect” and its Revision’ at Calvin &amp; Calvinism The webmaster is a hypothetical universalist</cite>, This historical development of the interpretation of the Lombardian formula is partially confirmed by William Cunningham, The Reformers &amp; the Theology of the Reformation (Edinburgh: T&amp;T Clark, 1866), Essay 7, ‘Calvin &amp; Beza’, p. 397:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is true that Calvin has intimated more than once his con- viction, that the position laid down by some of the schoolmen, viz. that Christ died ” sufficienter pro omnibus, efficaciter pro electis,” is sound and orthodox in some sense. But then he has never, so far as we remember or have seen proved, explained precisely in what sense he held it, and there is a sense in which the advocates of particular redemption can consistently admit and adopt it.† † When the subject of the extent of the atonement came to be more fully and exactly discussed, orthodox Calvinists generally objected to adopt this scholastic position, on the ground that it seemed to imply an ascription to Christ of a, purpose or intention of dying in some sense for all men. For this reason they usually declined to adopt it as it stood, or they proposed to alter it into this form, — Christ’s death was sufficient for all, efficacious for the elect. By this change in the position, the question was made to turn, not on what Christ did, but on what His death was; and thus the appearance of ascribing to Him personally a purpose or intention of dying, in some sense, for all men, was removed.”

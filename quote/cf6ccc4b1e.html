<blockquote><p>For those who accepted the Scotist argument ex convenientia that the Word would have become incarnate even had Adam not sinned, such as Ruiz, Muniesa, Aranda, Campoverde, Viva, Ulloa, and Quadros… For those who denied the Scotist argument, such as Amico, Arriaga, Albertini, Granado, and Quirós…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1195304235" data-kw="">
<blockquote><p>Theodoret does rightly and truly tell us that even the common people are hardly accustomed to speak any otherwise [about Christ’s person and his natures]: for if Peter speak, who would not rather say that Peter speaks, than say that Peter’s body or tongue speaks? and yet notwithstanding, neither does Peter’s mind, nor his foot nor any other member speak, but his tongue or mouth. But because these things have even personally grown up (as it were) together [in the Logos’s assumption of human nature], and are come into one subsistence or being, that is truly in the concrete attributed to, and spoken of the whole, which if it were uttered of the parts of the whole considered severally and by themselves, should be falsely spoken. What more? By reason of this personal union [between a person and his nature], though now it be dissolved through death, Peter shall be said to have died and sat [buried] at Rome, whose soul yet notwithstanding, neither is dead, neither anywhere placed upon the earth. So when I say [that] the eternal Son of God died, I consider and mean Him as He is whole-Christ, although I denominate Him after one of his natures, to wit, his mortal or human nature. So again I say [that] this man forgives sins, and yet not as He is man of Himself (for it belongs only to God to forgive sins), but because He is God and man in one person together.</p></blockquote>

</figure><figure class="quote" id="q-0973bc981b" data-kw="">
<blockquote><p>‘This hour’. Among all the hours that Christ had, this was the saddest: 1. Christ saw that his life in this hour would be taken from Him; it was convenient that Christ, who was a man, like us in all things except sin, should not be a stock in dying; but have actual pain and sense in the losing of his life, for Christ had as much nature, though no corruption, as any man; and life is a sweet inheritance, it’s nature’s excellent free-hold, and no man is willingly, and without one sigh or tear cast out of this free-hold, and Christ’s nature was not brass or iron. Sorrow and sadness found a kindly lodging in Him. . Sorrow Bible Verse Mt. 26:37-38 “And he took with Him Peter and the two sons of Zebedee, and began to be sorrowful and very heavy. Then saith He unto them, ‘My soul is exceeding sorrowful, even unto death…&#x27;</p></blockquote>

<blockquote><p>His profound feeling of dependence on God, for example, is illustrated in every conceivable way, not least strikingly in the constant habit of prayer which the Evangelists ascribe to him. But we are never directly told that he felt this dependence on God or “feared God”, or felt the emotions “of reverence and awe in the divine presence…¹ The narrative brings Jesus before us as acting under the impulse of all the religious emotions; but it does not stop to comment upon the emotions themselves. ¹ Cf. Heb. v. 7: “having been heard for his godly fear ([Greek] Eulabeia)”, i.e. for his reverent and submissive awe,” that religious fear of God and anxiety not to offend Him which manifests itself in voluntary and humble submission to his will” (Delitzsch in loc.). Davidson in loc: “The clause throws emphasis on the Son’s reverent submission.” Humanitarian writers debate whether “fear” of God is to be attributed to Jesus. Wellhausen (Israel, und jud. Geschichte, p. 383, expanded in Skizzen und Vorarbeiten, i. 1884, p. 98) represents him as passing his life in fear of the judge of all: “He feels the reality of God dominating life, he breathes in the fear of the Judge who demands account of every idle word and has power to destroy body and soul in hell.” Similarly Bousset (Jesus, 1904, pp. 54, 99, E. T. pp. 112, 203) speaks of him as learning by his own experience” that God is terrible (furchtbar) and that an awful darkness and dread encircles him even for those who stand nearest to him,” and as “sharing to the bottom of his soul” “the fear of that almighty God who has power to damn body and soul together,” which he “has stamped upon the hearts of his disciples with such marvellous energy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/b-b-warfield.html">B. B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Emotional Life of our Lord’ (1912)</cite>, pp. 80-81</span></figcaption>

<blockquote><p>3. Nor does it hinder [the legitimacy of the atonement] that Christ, as subject to the divine law, also owed obedience, which seems to destroy all merit (Socinus ibid. ch. 5 and Praelections, ch. 18, §4). For he did not owe it by that title of justice by which he now offered it, namely for sins. And what else is merit with respect to God than if a rational person offers those formal acts which are in the pact? as Adam and the fallen angels would have merited salvation if they had rendered the obedience that was in the pact. Why therefore will we detract praise of merit from Christ, who most exactly satisfied the divine demands?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’ tr. by AI by Onku (Utrecht, 1650) Latin</cite></span></figcaption>

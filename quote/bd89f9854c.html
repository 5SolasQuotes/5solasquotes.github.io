<main class="wrap"><figure class="quote" id="q-bd89f9854c" data-kw="">
<blockquote><p>This proves, therefore — (1.) That Christ did not die simply to make the salvation of those for whom he died possible — i.e., to remove legal obstructions to their salvation — but that he died with the design and effect of actually securing their salvation and of endowing them gratuitously with an inalienable title to heaven. (2.) It proves, in the second place, that the vicarious sufferings of Christ must have been, in design and effect, personal and definite as to their object. Salvation must be applied to all those for whom it was purchased. Since not the possibility or opportunity for reconciliation, but actual reconciliation itself was purchased: since not only reconciliation, but a title to an eternal inheritance was purchased, it follows (a.) That “to all those for whom Christ hath purchased redemption, he doth certainly and effectually apply and communicate the same.” Conf. Faith, ch. 8 § 8. And (b.) That he who never receives the inheritance, and to whom the purchased grace is never applied, is not one of the persons for whom it was purchased.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Confession of Faith, p. 151, commenting on WCF 8.5, “purchased not only reconciliation, but an everlasting inheritance in the kingdom of heaven, for all those whom the Father hath given unto him:”</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-a225b91a4d" data-kw="">
<blockquote><p>For the finding out of this middle course… the former [satisfaction of Christ] was once done for all, the other [application thereof] is still in doing: the former brings with it sufficiency, abundant to discharge the whole debt; the other adds to it efficacy. The satisfaction of Christ only makes the sins of mankind fit for pardon, which without it could not well be; the injury done to God’s majesty being so great, that it could not stand with his honour to put it up without amends made. The particular application makes the sins of those to whom that mercy is vouchsafed to be actually pardoned… Hence, we infer against the first extremity, that by the virtue of this blessed oblation, God is made placable unto our nature (which He never will be unto the angelical nature offending) but not actually appeased with any, until He has received his Son, and put on the Lord Jesus. As also against the latter extremity, that all men may be truly said to have interest in the merits of Christ, as in a common, though all do not enjoy the benefit thereof, because they have no will to take it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher… 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘Of the True Intent &amp; Extent of Christ’s Death &amp; Satisfaction upon the Cross’ (1617), pp. 552-60</cite>, pp. 554-55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>
<div class="actions"><button class="copy" data-copy="“For the finding out of this middle course… the former [satisfaction of Christ] was once done for all, the other [application thereof] is still in doing: the former brings with it sufficiency, abundant to discharge the whole debt; the other adds to it efficacy. The satisfaction of Christ only makes the sins of mankind fit for pardon, which without it could not well be; the injury done to God’s majesty being so great, that it could not stand with his honour to put it up without amends made. The particular application makes the sins of those to whom that mercy is vouchsafed to be actually pardoned… Hence, we infer against the first extremity, that by the virtue of this blessed oblation, God is made placable unto our nature (which He never will be unto the angelical nature offending) but not actually appeased with any, until He has received his Son, and put on the Lord Jesus. As also against the latter extremity, that all men may be truly said to have interest in the merits of Christ, as in a common, though all do not enjoy the benefit thereof, because they have no will to take it.”

— James Ussher, The Whole Works of the Most Rev. James Ussher… 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘Of the True Intent &amp; Extent of Christ’s Death &amp; Satisfaction upon the Cross’ (1617), pp. 552-60, pp. 554-55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+the+finding+out+of+this+middle+course%E2%80%A6+the+former+%5Bsatisfaction+of+Christ%5D+was+once+done+for+all%2C+the+other+%5Bapplication+thereof%5D+is+still+in+doing%3A+the+former+brings+with+it+sufficiency%2C+abundant+to+discharge+the+whole+debt%3B+the+other+adds+to+it+efficacy.+The+satisfaction+of+Christ+only+makes+the+sins+of+mankind+fit+for+pardon%2C+which+without+it+could+not+well+be%3B+the+injury+done+to+God%E2%80%99s+majesty+being+so+great%2C+that+it+could+not+stand+with+his+honour+to+put+it+up+without+amends+made.+The+particular+application+makes+the+sins+of+those+to+whom+that+mercy+is+vouchsafed+to+be+actually+pardoned%E2%80%A6+Hence%2C+we+infer+against+the+first+extremity%2C+that+by+the+virtue+of+this+blessed+oblation%2C+God+is+made+placable+unto+our+nature+%28which+He+never+will+be+unto+the+angelical+nature+offending%29+but+not+actually+appeased+with+any%2C+until+He+has+received+his+Son%2C+and+put+on+the+Lord+Jesus.+As+also+against+the+latter+extremity%2C+that+all+men+may+be+truly+said+to+have+interest+in+the+merits+of+Christ%2C+as+in+a+common%2C+though+all+do+not+enjoy+the+benefit+thereof%2C+because+they+have+no+will+to+take+it.%E2%80%9D%0A%0A%E2%80%94+James+Ussher%2C+The+Whole+Works+of+the+Most+Rev.+James+Ussher%E2%80%A6+17+vols.+%28Dublin%3A+Hodges+%26+Smith%2C+1864%29%2C+vol.+12+%7C+%E2%80%98Of+the+True+Intent+%26+Extent+of+Christ%E2%80%99s+Death+%26+Satisfaction+upon+the+Cross%E2%80%99+%281617%29%2C+pp.+552-60%2C+pp.+554-55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa225b91a4d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a225b91a4d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=For%20the%20finding%20out%20of%20this,have%20no%20will%20to%20take%20it&amp;text=For%20the%20finding%20out%20of%20this%20middle%20course&amp;text=because%20they%20have%20no%20will%20to%20take%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8f1e9dcb57" data-kw="">
<blockquote><p>Concerning the story and benefit of our Lord’s Resurrection… so precious and inestimable a benefit belongs unto all the faithful, and to them alone; and we exclude the wicked and unbelievers, as long as they remain such, from having any interest therein… Now the wicked being utterly void and destitute of faith which justifies, how should they, I pray you, partake in any of these blessings… who belong not unto Christ, neither are heirs of the kingdom, who neither have title nor right in Christ Jesus, nor to Christ Jesus (as the lawyers use to speak), how should Christ appertain unto them? How should the benefits be extended unto them? Nay rather all these are by the mouth of the Son of God Himself far removed and debarred these treasures, and are adjudged unto eternal malediction and everlasting death… Yea but, say you, Christ died for the sins of all. Therefore He rose again for the justification of all. The answer hereunto is twofold… First, as often as the Gospel extends the fruit of Christ’s merits and benefits unto all, it must be understood (as says Saint Ambrose) of the whole number of the faithful and elect. For this is the usual and common voice found everywhere throughout the whole course of the gospel… Christ therefore is thus said to be dead for all: that is, for all the faithful and elect; for whom alone He also prayed, and in whom alone He finds the end and fruit of his death. But to extend the benefits of Christ’s death unto infidels and reprobates, for whom He never prayed, whom He never knew, or took for his own, and on whom the wrath of God abides forever; what else is this but against his express commandment to give holy things unto dogs… Howbeit there is an other answer no less true, wherewith we may satisfy the most contentious wranglers; that Christ died for all men absolutely and without exception to wit, if you respect the sufficiency of the merit and the price which He paid. It is out of all doubt and controversy that the death of the Son of God is of such weight and worth that it may serve to purge and cleanse the sins not of one world only, but thousands of worlds; if at least all men would apprehend by faith this salve of sin. But the question concerns the efficacy and participation itself of the fruits which we mainly deny to be common to the believing, and unbelieving… and we hold it no sound doctrine to 〈…〉 in this respect Christ died alike for all 〈…〉 and reprobate. But here some men… spew out on us their stinking 〈…〉 open mouth, taking it grievously, that 〈…〉not those heavenly treasures and jewels equally to the godly, and ungodly; to the faithful, and unfaithful; to the elect and reprobate; to Christ’s members and the Devil’s vassals; to the sheep and to the swine. They make loud outcries on us for denying that Christ died for all… And first the holy Scripture itself teaches us plainly this kind of distinction, and forces us thereunto. For you shall find it in Scripture sometimes absolutely spoken that Christ tasted of death for all men: that He gave Himself a ransom for all men: that he is the reconciliation for the sins of the whole world… These places carry some show of contrariety, were it not that the former are understood by us of the sufficiency of satisfaction, and the latter [about Christ laying down his life for the sheep] of the efficacy and working virtue thereof. Furthermore other places occur which seem to impart unto the wicked the benefit of redemption; as when Peter says that they deny even the Lord which has bought them… all which the Scripture elsewhere enforces us to interpret either of the vain glorying of hypocrites of their redemption and sanctification: or else to understand them no otherwise than of the extent and sufficiency of Christ’s satisfaction: whereas it simply excludes the unfaithful and unrepentant from the benefit of redemption… lastly that Christ never knew them, much less redeemed them. … What comfort can there be more contemptible than that thou art redeemed by Christ’s death, reduced into amity and friendship with Him; whereas many thousands of those, which have been in like sort restored, notwithstanding perish everlastingly. … Christ died and prayed for all that believe. But I believe. Therefore He prayed, and died for me. Now they are cold comforters who teach afflicted consciences to reason on this manner: Christ died for all men. But I am a man. Therefore Christ died for me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Preface of an Oration… To whom the Benefit of the Death &amp; Resurrection of Christ appertains, and how Christ Died for all Men’ in A Collection of Certain Learned Discourses… (d. 1583; Oxford: Barnes, 1600)</cite>, pp. 132-52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

n there be more contemptible than that thou art redeemed by Christ’s death, reduced into amity and friendship with Him; whereas many thousands of those, which have been in like sort restored, notwithstanding perish everlastingly. … Christ died and prayed for all that believe. But I believe. Therefore He prayed, and died for me. Now they are cold comforters who teach afflicted consciences to reason on this manner: Christ died for all men. But I am a man. Therefore Christ died for me.”

— Zacharias Ursinus, ‘A Preface of an Oration… To whom the Benefit of the Death &amp; Resurrection of Christ appertains, and how Christ Died for all Men’ in A Collection of Certain Learned Discourses… (d. 1583; Oxford: Barnes, 1600), pp. 132-52">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConcerning+the+story+and+benefit+of+our+Lord%E2%80%99s+Resurrection%E2%80%A6+so+precious+and+inestimable+a+benefit+belongs+unto+all+the+faithful%2C+and+to+them+alone%3B+and+we+exclude+the+wicked+and+unbelievers%2C+as+long+as+they+remain+such%2C+from+having+any+interest+therein%E2%80%A6+Now+the+wicked+being+utterly+void+and+destitute+of+faith+which+justifies%2C+how+should+they%2C+I+pray+you%2C+partake+in+any+of+these+blessings%E2%80%A6+who+belong+not+unto+Christ%2C+neither+are+heirs+of+the+kingdom%2C+who+neither+have+title+nor+right+in+Christ+Jesus%2C+nor+to+Christ+Jesus+%28as+the+lawyers+use+to+speak%29%2C+how+should+Christ+appertain+unto+them%3F+How+should+the+benefits+be+extended+unto+them%3F+Nay+rather+all+these+are+by+the+mouth+of+the+Son+of+God+Himself+far+removed+and+debarred+these+treasures%2C+and+are+adjudged+unto+eternal+malediction+and+everlasting+death%E2%80%A6+Yea+but%2C+say+you%2C+Christ+died+for+the+sins+of+all.+Therefore+He+rose+again+for+the+justification+of+all.+The+answer+hereunto+is+twofold%E2%80%A6+First%2C+as+often+as+the+Gospel+extends+the+fruit+of+Christ%E2%80%99s+merits+and+benefits+unto+all%2C+it+must+be+understood+%28as+says+Saint+Ambrose%29+of+the+whole+number+of+the+faithful+and+elect.+For+this+is+the+usual+and+common+voice+found+everywhere+throughout+the+whole+course+of+the+gospel%E2%80%A6+Christ+therefore+is+thus+said+to+be+dead+for+all%3A+that+is%2C+for+all+the+faithful+and+elect%3B+for+whom+alone+He+also+prayed%2C+and+in+whom+alone+He+finds+the+end+and+fruit+of+his+death.+But+to+extend+the+benefits+of+Christ%E2%80%99s+death+unto+infidels+and+reprobates%2C+for+whom+He+never+prayed%2C+whom+He+never+knew%2C+or+took+for+his+own%2C+and+on+whom+the+wrath+of+God+abides+forever%3B+what+else+is+this+but+against+his+express+commandment+to+give+holy+things+unto+dogs%E2%80%A6+Howbeit+there+is+an+other+answer+no+less+true%2C+wherewith+we+may+satisfy+the+most+contentious+wranglers%3B+that+Christ+died+for+all+men+absolutely+and+without+exception+to+wit%2C+if+you+respect+the+sufficiency+of+the+merit+and+the+price+which+He+paid.+It+is+out+of+all+doubt+and+controversy+that+the+death+of+the+Son+of+God+is+of+such+weight+and+worth+that+it+may+serve+to+purge+and+cleanse+the+sins+not+of+one+world+only%2C+but+thousands+of+worlds%3B+if+at+least+all+men+would+apprehend+by+faith+this+salve+of+sin.+But+the+question+concerns+the+efficacy+and+participation+itself+of+the+fruits+which+we+mainly+deny+to+be+common+to+the+believing%2C+and+unbelieving%E2%80%A6+and+we+hold+it+no+sound+doctrine+to+%E3%80%88%E2%80%A6%E3%80%89+in+this+respect+Christ+died+alike+for+all+%E3%80%88%E2%80%A6%E3%80%89+and+reprobate.+But+here+some+men%E2%80%A6+spew+out+on+us+their+stinking+%E3%80%88%E2%80%A6%E3%80%89+open+mouth%2C+taking+it+grievously%2C+that+%E3%80%88%E2%80%A6%E3%80%89not+those+heavenly+treasures+and+jewels+equally+to+the+godly%2C+and+ungodly%3B+to+the+faithful%2C+and+unfaithful%3B+to+the+elect+and+reprobate%3B+to+Christ%E2%80%99s+members+and+the+Devil%E2%80%99s+vassals%3B+to+the+sheep+and+to+the+swine.+They+make+loud+outcries+on+us+for+denying+that+Christ+died+for+all%E2%80%A6+And+first+the+holy+Scripture+itself+teaches+us+plainly+this+kind+of+distinction%2C+and+forces+us+thereunto.+For+you+shall+find+it+in+Scripture+sometimes+absolutely+spoken+that+Christ+tasted+of+death+for+all+men%3A+that+He+gave+Himself+a+ransom+for+all+men%3A+that+he+is+the+reconciliation+for+the+sins+of+the+whole+world%E2%80%A6+These+places+carry+some+show+of+contrariety%2C+were+it+not+that+the+former+are+understood+by+us+of+the+sufficiency+of+satisfaction%2C+and+the+latter+%5Babout+Christ+laying+down+his+life+for+the+sheep%5D+of+the+efficacy+and+working+virtue+thereof.+Furthermore+other+places+occur+which+seem+to+impart+unto+the+wicked+the+benefit+of+redemption%3B+as+when+Peter+says+that+they+deny+even+the+Lord+which+has+bought+them%E2%80%A6+all+which+the+Scripture+elsewhere+enforces+us+to+interpret+either+of+the+vain+glorying+of+hypocrites+of+their+redemption+and+sanctification%3A+or+else+to+understand+them+no+otherwise+than+of+the+extent+and+sufficiency+of+Christ%E2%80%99s+satisfaction%3A+whereas+it+simply+excludes+the+unfaithful+and+unrepentant+from+the+benefit+of+redemption%E2%80%A6+lastly+that+Christ+never+knew+them%2C+much+less+redeemed+them.+%E2%80%A6+What+comfort+can+there+be+more+contemptible+than+that+thou+art+redeemed+by+Christ%E2%80%99s+death%2C+reduced+into+amity+and+friendship+with+Him%3B+whereas+many+thousands+of+those%2C+which+have+been+in+like+sort+restored%2C+notwithstanding+perish+everlastingly.+%E2%80%A6+Christ+died+and+prayed+for+all+that+believe.+But+I+believe.+Therefore+He+prayed%2C+and+died+for+me.+Now+they+are+cold+comforters+who+teach+afflicted+consciences+to+reason+on+this+manner%3A+Christ+died+for+all+men.+But+I+am+a+man.+Therefore+Christ+died+for+me.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+%E2%80%98A+Preface+of+an+Oration%E2%80%A6+To+whom+the+Benefit+of+the+Death+%26+Resurrection+of+Christ+appertains%2C+and+how+Christ+Died+for+all+Men%E2%80%99+in+A+Collection+of+Certain+Learned+Discourses%E2%80%A6+%28d.+1583%3B+Oxford%3A+Barnes%2C+1600%29%2C+pp.+132-52&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8f1e9dcb57.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8f1e9dcb57.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=Concerning%20the%20story%20and%20benefit%20of,man.%20Therefore%20Christ%20died%20for%20me&amp;text=Concerning%20the%20story%20and%20benefit%20of%20our%20Lord%E2%80%99s&amp;text=am%20a%20man.%20Therefore%20Christ%20died%20for%20me" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…the Westminster Assembly consistently maintains particularism. I deny that the universalists at Westminster ‘were able to restrain the final codification sufficiently for there to be some significant ambiguity at crucial places’ (148). I do not deny that the issue of particularism versus universalism was debated at Westminster nor that contemporary universalists claimed their teaching compatible and remained active at the synod. But the mere presence of a plurality of views in session does not imply a plurality of views in confession. Clearly, the final formulation should interpret (the outcome of) the earlier discussion and not the earlier discussion the final formulation. Although WCF could be ambiguous or alternatively rendered on this subject (as on some other ones), it is actually precise and clear about the strictly particular divine intention.” – Rehnman . Quotes 1800’s Robert Shaw Exposition of the Westminster Confession, pp. 112-113, commenting on WCF 8.8, “To all those for whom Christ hath purchased redemption, he doth certainly and effectually apply and communicate the same:</p></blockquote>

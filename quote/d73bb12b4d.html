<main class="wrap"><figure class="quote" id="q-d73bb12b4d" data-kw="">
<blockquote><p>One difference between Libertarian Theology (American Theonomy) and Reformed political theology (Scottish Theonomy) is that the former thinks that the magistrate should not suppress acts of gross immorality, unless it can be proved that the state has been commanded to punish that particular sin (that is why they often conclude that adultery should be punished, but pornography should not be). The Westminster divines, however, would have viewed Libertarian Theology as a system calculated to call down God’s wrath. They recognised that God’s natural-moral law is binding upon society; hence the Kuyperian-inspired attempt to limit the magistrate to punishing a very select range of vices would have been considered contrary to their world-view. In the petition to the Houses of Parliament cited below, we clearly see that they believed the civil ruler was to suppress all public vice lest the wrath of God fall upon the nation:

To the Right honourable the Lords assembled in Parliament.

The humble Message &amp; peticion of the Assembly of Divines.

The Assembly of Divines, in all humility &amp; in discharge of their duty to God &amp; to this Honourable House, do inform your Lordships of the sad Compl[ain]ts brought unto them from many Godly &amp; Reverend Divines in &amp; about London, touching the dayly increase &amp; growth of all manner of outrageous and intollerable abominations, such as are drunkennes, swearing, uncleanenes, &amp; other crying sins in very many places of this Kingdome, for want of Godly and zealous Magistrates to represse the same, which cannot but highly provoke the Lord to more wrath against this Kingdome in this Day of his wrath already broken out upon his people, and render fruitlesse all your pious endeavours for Reformation &amp; the Weale of the Kingdome, unless it bee effectually &amp; speedily cured.

The Assembly therefore humbly prayeth that according to your great wisdome and zeale for the Publique, there may bee a speedy appointing &amp; setling of some able godly prudent Magistrates that may reside in all places of the Kingdome, where your wisdome shall find it necessary, to give a speedy stopp to those high provocacions of Almighty God &amp; the most dangerous supplanters of all our hopes of Good from the Parliament or the Assembly. […]</p></blockquote>

<blockquote><p>XXVII. Self-interest, self-Government and family-government are all antecedent to publick government, which rules them for the common good, but has no authority to destroy them: No king or prelate can bind a man to do that which would damn his soul, nor to omit that which is needful to his salvation: All power is for edification: They are God’s ministers for God. XXVIII. As it belongs to self-government to choose our own diet, and clothes, and wives, and physicians, (though we may be restrained from doing public hurt on such pretences); And it belong to family government to educate our own children, and choose their tutors, callings, wives, etc. so it more nearly belongs to self-government to choose the most safe and profitable means of our own salvation, which no man may forbid us; and to avoid that which is pernicious or hurtful; and to family-government to do the like for our children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes</cite>, … (London: 1684), ch. 4, p. 26</span></figcaption>

</figure><figure class="quote" id="q-33c24143a8" data-kw="">
<blockquote><p>But here it is requisite, that we make a difference betwixt the office which is the good ordinance of God, and the evil person that doth not rightly execute that good office. If therefore in the magistrate evil be found, and not the good for which he was ordained, that cometh of other causes, and the fault thereof is the men of persons, which neglect God and corrupt the ordinance of God, and not in God, nor in his ordinance: for either the evil prince, seduced by the devil, corrupteth the ways of God, and by his own fault and naughtiness transgresseth God’s ordinance, so far, that he doth worthily deserve the name of devilish power, and not divine authority[.]

[W]e have an example of this in the magistrate of Jerusalem. For although he was able to refer the beginning of his power by degrees to Moses, and so to God himself who ordained it — yet, because he arrests the Saviour in the garden and binds him, it is said to his servants, “Ye are come out as it were to a thief with swords and staves; when I was with you daily in the temple, ye stretched not forth your hands against me. But this is even your hour, and the power of darkness.” Lo, here he calleth the ordinary magistrate the power of the devil, when he abuseth his power. What could be more evidently spoken? But here ye must mark, that the reproach was in the person, and not in the office.

Likewise also the Roman empire was ordained by God, as by the visions of Daniel it is clearly evident: and yet, when Nero, not without God’s ordinance, bare the sway in the empire, whatsoever he did as king and emperor, contrary to the office of a good king, that did he not of God, but of the devil: for whereas he hung up and beheaded the apostles of Christ, moving a bloody persecution against the church, that sprang not from elsewhere than from the devil, the father of murder. So then, verily, we ought not at any time to defend the tyrannical power, and say that it is of God: for tyranny is not a divine, but a devilish, kind of government; and tyrants themselves are properly the servants of the devil, and not of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly and Learned Sermons divided into the Five Decades containing the Chief and Principal Points of Christian Religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids MI: Reformation Heritage Books, 2004), 1: 314-15.</span></figcaption>

pire%2C+whatsoever+he+did+as+king+and+emperor%2C+contrary+to+the+office+of+a+good+king%2C+that+did+he+not+of+God%2C+but+of+the+devil%3A+for+whereas+he+hung+up+and+beheaded+the+apostles+of+Christ%2C+moving+a+bloody+persecution+against+the+church%2C+that+sprang+not+from+elsewhere+than+from+the+devil%2C+the+father+of+murder.+So+then%2C+verily%2C+we+ought+not+at+any+time+to+defend+the+tyrannical+power%2C+and+say+that+it+is+of+God%3A+for+tyranny+is+not+a+divine%2C+but+a+devilish%2C+kind+of+government%3B+and+tyrants+themselves+are+properly+the+servants+of+the+devil%2C+and+not+of+God.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+Fifty+Godly+and+Learned+Sermons+divided+into+the+Five+Decades+containing+the+Chief+and+Principal+Points+of+Christian+Religion%2C+ed.+Thomas+Harding+%281849-52+Parker+edn%3B+4+vols%2C+Grand+Rapids+MI%3A+Reformation+Heritage+Books%2C+2004%29%2C+1%3A+314-15.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F33c24143a8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/33c24143a8.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/10/10/henry-bullinger-nero-was-ordained-of-the-devil/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-93bcfc0f7e" data-kw="">
<blockquote><p>And so judgement-like is [men’s] withdrawing [from God], and smells so of vengeance, that God plagues withdrawing with withdrawing: Hos. 5:4, ‘They will not frame their doings to turn unto their God.’ And what is the issue of that? ‘They shall go with their flocks and herds to seek the Lord, but they shall not find Him; for He hath withdrawn Himself from them.’ Prov. 1:24, ‘I called, and ye refused;’ Verse 26, then this must follow, verse 28 (as also Jn. 8:21, the like is) ‘they shall call upon Me, but I will not answer.’ Use 6. It’s a terrible plague of God, which we would eschew as hell, to wit, provoking of God by such sins as may procure that God should in his judgement mar the lock of the heart, the will, that the door should neither shut nor open; and cast poison into the soul, so as angels and men, heaven and earth cannot help or cure it: Christ is good at opening hearts, and drawing sinners; and He is as good at judicial closing of hearts: If He but put his finger in the eye, and snap in pieces the optic nerves, all the world cannot restore sight, or open the heart. He that is nearest to be drawn to Christ, and yet never drawn, is deepest in hell: An evangelic-fire of God’s fury is worse than a Sinai-fire, though it burn up to mid-heaven:

1. Sinning against the light of nature and the known will of God, as idolatry and the principles of your own religion, true and known to be so, brings delivering up to judicial blindness, Rom. 1:21.

2. If ye put your finger in nature’s eye, and blow out that candle, God will give you up to vile affections, Rom. 1:24 and a reprobate mind, vv. 26-28. Some blow out the candle of nature, and God blows out the sun of the Gospel, that it is to them like sack-cloth of hair, and a moon like blood.

3. Resisting of the call of God, brings on the plague of hardness of heart; Pro. 1:24-27; Acts 28:23-27; Jn. 8:21.</p></blockquote>

<blockquote><p>34. The Will of God is the other faculty of the life of God, or the act that follows, by which God knows Himself and wills and approves of all good things as they agree unto the nature and order of his mind, the contraries He necessarily disapproves, which will is called approving; and out of which things He is able to do, some He freely wills, chooses and decrees by a foregoing wisdom, and does, which is the effecting will;…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-thysius.html">Antonius Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thesis 34 in The Sixth of the Theological Disputations in On the Nature of God &amp; the Divine Attributes</cite>, (d. 1640; Leiden, 1620) This disputation is also in the Synopsis of Pure Theology as disputation 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-bb47c23da1" data-kw="">
<blockquote><p>First, ‘God’ (say they [Arminians]), ‘considering all mankind as fallen from that grace and favor in Adam where they were created, and excluded utterly from the attainment of salvation by virtue of the covenant of works which was at the first made with him, yet by his infinite goodness was inclined to desire the happiness of them all and every one, that they might be delivered from misery and be brought unto Himself, which inclination of his they call his universal love and antecedent will, whereby He would desirously have them all to be saved, out of which love He sends Christ.’ [Owen:] That God has any natural or necessary inclination by his goodness or any other property to do good to us or any of his creatures, we do deny: everything that concerns us is an act of his free will and good pleasure, and not a natural necessary act of his Deity, as shall be declared. Secondly, the ascribing an antecedent conditional will unto God, whose fulfilling and accomplishment should depend on any free contingent act or work of ours, is injurious to his wisdom, power and sovereignty, and cannot well be excused from blasphemy, and is contrary to Rom. 9:19, ‘Who hath resisted his will? I say.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Salus electorum, sanguis Jesu</cite>, … (London: W.W., 1648), bk. 2, ch. 4, pp. 91-92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

=First%2C%20%E2%80%98God%E2%80%99%20%28say%20they%20%5BArminians%5D%29%2C%20%E2%80%98considering,hath%20resisted%20his%20will%3F%20I%20say&amp;text=First%2C%20%E2%80%98God%E2%80%99%20%28say%20they%20%5BArminians%5D%29%2C%20%E2%80%98considering%20all%20mankind&amp;text=9%3A19%2C%20%E2%80%98Who%20hath%20resisted%20his%20will%3F%20I%20say" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-906ec32c7c" data-kw="">
<blockquote><p>This comes in here as a token of God’s displeasure at those who married strange wives; He threatens to withdraw from them his Spirit, whom they had grieved by such marriages, contrary to their convictions: fleshly lusts are often punished with spiritual judgments, the sorest of all judgments. Or as another occasion of the great wickedness of the old world; the Spirit of the Lord, being provoked by their resistance of his motions, ceased to strive with them, and then all religion was soon lost among them. This He warns them of before, that they might not further vex his Holy Spirit, but by their prayers might stay Him with them. Observe in this verse, I. God’s resolution not always to strive with man by his Spirit. The Spirit then strove by Noah’s preaching (1 Pt. 3:19–20) and by inward checks, but it was in vain with the most of men; therefore, says God, He shall not always strive. Note, 1. The blessed Spirit strives with sinners, by the convictions and admonitions of conscience, to turn them from sin to God. If the Spirit be resisted, quenched, and striven against, though He strive long, he will not strive always, Hos. 4:17. Those are ripening apace for ruin whom the Spirit of grace has left off striving with. II. The reason of this resolution: For that he also is flesh, that is, incurably corrupt, and carnal, and sensual, so that it is labor lost to strive with him. Can the Ethiopian change his skin? He also, that is, All, one as well as another, they have all sunk into the mire of flesh. Note, 1. It is the corrupt nature, and the inclination of the soul towards the flesh, that oppose the Spirit’s strivings and render them ineffectual. When a sinner has long adhered to that interest, and sided with the flesh against the Spirit, the Spirit justly withdraws his agency, and strives no more. None lose the Spirit’s strivings but those that have first forfeited them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 6:3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

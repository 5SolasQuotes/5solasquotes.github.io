<main class="wrap"><figure class="quote" id="q-144d96d337" data-kw="">
<blockquote><p>The whole place shows it was God: but He is called an angel, that we might know that He which was seen, was not God the Father (for whose angel should the Father be) but the only begotten Son of God, which is the Angel of the great Counsel, which said to his holy apostles, ‘All things which I have heard of my Father, I have declared unto you.’ And even as He gave Him the name of an angel, not meaning thereby to note any other minister or messenger, but to show the Person of the only begotten Son: so again he sets forth both his nature and power, saying He said: ‘I AM THAT I AM,’ and ‘I the God of Abraham, the God of Isaac, the God of Jacob’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodoret.html">Theodoret of Cyrus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted in Gervase Babington, Comfortable Notes upon the books of Exodus &amp; Leviticus</cite>, ... (London: Chard, 1604), ch. 3, p. 32 Theodoret (c. 393–c. 458/466)</span></figcaption>

</figure><figure class="quote" id="q-35279583c3" data-kw="">
<blockquote><p>The primitive Church also of Christ his apostles had no images, either of Christ himself or of other saints set up in their places of public prayer, nor in their Churches. The deed of Epiphanius is very well known which he committed at Anablacha in Syria. It is written in Greek in an epistle to John Bishop of Jerusalem, and translated into Latin by St. Jerome: He rent the vail that hung in the temple [church building], bearing in it the image of Christ or some other saint, testifying therewithal that it is against Christian religion for the picture of a man, to hang in the Church of God. Saint Augustine in Catalogo haerese [Greek] makes mention of one Marcella a follower of Carpocrates his sect, which worshipped the images of Jesu, Paul Homer and Pythagoras, with falling down prostrate before them and offering incense unto them…. Furthermore, for Christ our Lord and very God, though he have taken on him the nature of us men, yet that notwithstanding, there ought no image to be erected. For he did not become man to that intent. But he drew up his humanity into heaven, and therewithal gave us a charge, that so often as we pray, we shoulde lift up the eyes of our minds and bodies into heaven above. Moreover, being once ascended, he sent his Spirit instead of himself, unto the Church wherin he has a spiritual kingdom, and needs not any bodily or corruptible things. For he commanded that if we would bestow any thing on him or for his sake, we should bestow it on the poor, and not on his picture or image. And now, since without all controuersy, our Christ is the very true God, and that the very true God does forbid to hallow to him any likeness of man, that is, to represent God in the shape of a man, it follows consequently that to Christ no image is to be dedicated, because he is the true and very God and life everlasting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly &amp; Learned Sermons divided into Five Decades</cite>, … (1549; London: 1577), 2nd Decade, 2nd Sermon, Of God’s Law, and of the Two First Commandments of the First Table, pp. 121-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-09ade8ee7b" data-kw="">
<blockquote><p>The Reformed, however openly they embrace the fact that it is lawul to have a concept of God, and even more, that it is most necessary–unless we want to be atheists!–nevertheless say that a concept of God under the form of a man, or of any corporeal entity at all, is altogether unlawful, because: (1) the Savior in John 4:24 commands us to have a concept of God that agrees with the nature of God, that defines God as a Spirit, and that therefore leads to the result that God is worshipped and adored in spirit, that is, spiritually, without any such forms, and in truth, meaning in thoughts that are true and that agree with the concept… Balduin [a Lutheran] objects: (1) that since whenever we have a concept of God, and we therefore conceive a certain image of God… I respond, Balduin presupposes that having a concept and conceiving an image are synonymous, when in fact they are worlds apart. For under what likeness or image will you conceive of a spirit as it exists in itself?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, trans. Rester &amp; Spangler (RHB, 2019), vol. 2, bk. 2, ch. 6, ‘The Spirituality &amp; Simplicity of God’ | section 12, ‘Is it permitted, while praying, to put God before us under the form of a man? [No]’, pp. 137-38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

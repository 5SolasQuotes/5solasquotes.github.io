<main class="wrap"><figure class="quote" id="q-ccc85ca8f2" data-kw="">
<blockquote><p>Now consider we in the next place what manner of preaching our Savior Christ’s was, that collating the Gospel by this man [the Antinomian Saltmarsh] described, with the Gospel that Christ preached, we may see how well they sort and suit the one with the other. ‘I came,’ says our Savior, ‘to call sinners to repentance’ (Mt 3:13): and, ‘Unlesse ye repent, ye shall all perish,’ (Lk. 13:3, 5) and, ‘Verily, I say unto you, Unless ye be converted and become like children, ye shall not enter into the Kingdom of Heaven,’ (Mt. 18:3) and, ‘If a man will come after Me, let him deny himself, and take up his cross and follow Me.’ (Mt. 16:23) And, ‘If any man come to Me, and hate not his father and mother, and wife and children, and brethren and sisters, yea, and his own life also, he cannot be my disciple.’ (Lk. 14:26) And, ‘Whosoever he be of you that forsakes not all that he hath, he cannot be my disciple.’ (Lk. 14:33) Here is no such short work as Mr. Saltmarsh makes of it. Here are conditions, you see, required; and those not of faith alone, but of repentance and humiliation, and self-denial, and conversion, and renouncing of all, in disposition and purpose at least.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mistake or Misconstruction Removed</cite>, (Whereby little difference is pretended to have been acknowledged between the Antinomians &amp; us)… (London: Clifton, 1646), pp. 9-10 Note, according to Westminster, “purposing and endeavoring to walk with him in all the ways of his commandments” is part of the definition of repentance; WCF 15.2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

<blockquote><p>Q. But is justifying faith solitary without all attendants? A. No, justifying faith has two daughters that inseparably attend her.

1. Repentance: Here sinful man retracts and undoes his faults, acknowledges his transgressions, rents his heart weeps, smites upon his breast, and cries ‘What have I done?’ laments after the Lord and abhors himself in dust and ashes: He executes the Law upon himself; and since God excuses him from the punishment, he accuses himself of the guilt, and condemns himself to the shame of his sin; and hereby the sinner honors the equity of the threatening by his tears, acknowledging that his blood was due.

2. Newness of life: Here the sinner acknowledges perfect obedience to be still his duty, which honors the equity of God’s commandments. (Rom. 16:26)</p></blockquote>

</figure><figure class="quote" id="q-00de4c06dd" data-kw="">
<blockquote><p>And what needs it also that we should speak of the power of prayer, by which we, with the publican, and all other pious persons, do humbly beg from God pardon of our sins, in order to obtain the same, having been so taught by our Savior Himself, ‘Forgive us our sins,’ or of that of other previous acts–since the matter is clearer than the noon-day sun. Nor does this interfere with our being justified gratis, as the Scripture teaches, for in these we put nothing at all of merit, any more than in faith itself… Amandus Polanus, a writer rigid in other respects, yet compelled by the force of truth, lays down this thesis, as the universal opinion of all Protestants, and very agreeable to the teaching of the Fathers. ‘By repentance, confession, prayers, and tears, proceeding from faith, we obtain forgiveness of sins, but we do not, properly speaking, merit it; and therefore we obtain forgiveness of sins, not by the merit of our penitence and prayer, but by the mercy and benignity of God.’ (Catholic Symphony, ch. 27, On the Remission of Sins, p. 951 ff., thesis 2) Which thesis, after a sufficiently sound elucidation, he confirms by some very clear testimonies of the Fathers, to which we could add numberless others, were not the thing itself most clear and certain. Would that all Protestants constantly professed this opinion, thus enunciated by Polanus: for there would remain scarce any matter for controversy regarding this article among the more right-thinking of both sides.</p></blockquote>

<blockquote><p>…repentance is taken sometimes largely and sometimes strictly: By this distinction it may easily appear how sorrow goes before repentance and how repentance goes before faith. Indeed, for the latter is the great controversy, but some reconcile it thus: Repentance has two parts, the aversion of the soul from sin, and the conversion of the soul to God; the latter part of it is only an effect of faith, the former part of it, viz. the turning of the soul from sin is also an effect, but not only an effect, for it is begun before faith, though it be not ended till our life end. Some object that God works repentance and faith together: But we dispute not how God works them, but how the soul acts them; not which is in the soul first, but which appears out of the soul first: neither is it any new thing in philosophy to say those causes which produce an effect, though they be in time together, yet are mutually before one another in order of nature, in diverse respects to their several causalities. Thus a man must have repentance before he have saving and justifying faith; and yet a man must have faith before the work of repentance be perfect in the soul. As we maintain repentance to be a precedent work, so we deny it not to be a subsequent effect: Sorrow is before the birth too, as the apostle intimates, 2 Cor. 7:10, ‘Godly sorrow works repentance,’ that is, sorrow prepares a man for repentance, it goes afore it and prepares for it. And now it is that God’s spirit begins to renew his heart…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…repentance is taken sometimes largely and sometimes strictly: By this distinction it may easily appear how sorrow goes before repentance and how repentance goes before faith. Indeed, for the latter is the great controversy, but some reconcile it thus: Repentance has two parts, the aversion of the soul from sin, and the conversion of the soul to God; the latter part of it is only an effect of faith, the former part of it, viz. the turning of the soul from sin is also an effect, but not only an effect, for it is begun before faith, though it be not ended till our life end. Some object that God works repentance and faith together: But we dispute not how God works them, but how the soul acts them; not which is in the soul first, but which appears out of the soul first: neither is it any new thing in philosophy to say those causes which produce an effect, though they be in time together, yet are mutually before one another in order of nature, in diverse respects to their several causalities. Thus a man must have repentance before he have saving and justifying faith; and yet a man must have faith before the work of repentance be perfect in the soul. As we maintain repentance to be a precedent work, so we deny it not to be a subsequent effect: Sorrow is before the birth too, as the apostle intimates, 2 Cor. 7:10, ‘Godly sorrow works repentance,’ that is, sorrow prepares a man for repentance, it goes afore it and prepares for it. And now it is that God’s spirit begins to renew his heart…”

— Isaac Ambrose, pp. 29-30 of ‘The New Birth’ in Prima the First Things... (London, 1650)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6repentance+is+taken+sometimes+largely+and+sometimes+strictly%3A+By+this+distinction+it+may+easily+appear+how+sorrow+goes+before+repentance+and+how+repentance+goes+before+faith.+Indeed%2C+for+the+latter+is+the+great+controversy%2C+but+some+reconcile+it+thus%3A+Repentance+has+two+parts%2C+the+aversion+of+the+soul+from+sin%2C+and+the+conversion+of+the+soul+to+God%3B+the+latter+part+of+it+is+only+an+effect+of+faith%2C+the+former+part+of+it%2C+viz.+the+turning+of+the+soul+from+sin+is+also+an+effect%2C+but+not+only+an+effect%2C+for+it+is+begun+before+faith%2C+though+it+be+not+ended+till+our+life+end.+Some+object+that+God+works+repentance+and+faith+together%3A+But+we+dispute+not+how+God+works+them%2C+but+how+the+soul+acts+them%3B+not+which+is+in+the+soul+first%2C+but+which+appears+out+of+the+soul+first%3A+neither+is+it+any+new+thing+in+philosophy+to+say+those+causes+which+produce+an+effect%2C+though+they+be+in+time+together%2C+yet+are+mutually+before+one+another+in+order+of+nature%2C+in+diverse+respects+to+their+several+causalities.+Thus+a+man+must+have+repentance+before+he+have+saving+and+justifying+faith%3B+and+yet+a+man+must+have+faith+before+the+work+of+repentance+be+perfect+in+the+soul.+As+we+maintain+repentance+to+be+a+precedent+work%2C+so+we+deny+it+not+to+be+a+subsequent+effect%3A+Sorrow+is+before+the+birth+too%2C+as+the+apostle+intimates%2C+2+Cor.+7%3A10%2C+%E2%80%98Godly+sorrow+works+repentance%2C%E2%80%99+that+is%2C+sorrow+prepares+a+man+for+repentance%2C+it+goes+afore+it+and+prepares+for+it.+And+now+it+is+that+God%E2%80%99s+spirit+begins+to+renew+his+heart%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Isaac+Ambrose%2C+pp.+29-30+of+%E2%80%98The+New+Birth%E2%80%99+in+Prima+the+First+Things...+%28London%2C+1650%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1292c4462a.html&amp;via=5Solas" targ

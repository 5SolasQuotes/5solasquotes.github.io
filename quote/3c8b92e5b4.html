<main class="wrap"><figure class="quote" id="q-3c8b92e5b4" data-kw="">
<blockquote><p>Elders help the pastors in governing, but labor not in the Word and doctrine, 1 Tim 5:17, and yet visit the sick, oversee the ways and manners of the people, and so rule with diligence, Rom. 12:8; 1 Cor. 12:28, and judge with pastors and doctors, Matt 18:18-20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland… (London, 1642) | ch. 20, Whether or not the government of the Church of Scotland can be proved by God’s Word to be lawful? | 11th Article, Elders and Deacons</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>
<div class="actions"><button class="copy" data-copy="“Elders help the pastors in governing, but labor not in the Word and doctrine, 1 Tim 5:17, and yet visit the sick, oversee the ways and manners of the people, and so rule with diligence, Rom. 12:8; 1 Cor. 12:28, and judge with pastors and doctors, Matt 18:18-20.”

— Samuel Rutherford, A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland… (London, 1642) | ch. 20, Whether or not the government of the Church of Scotland can be proved by God’s Word to be lawful? | 11th Article, Elders and Deacons">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CElders+help+the+pastors+in+governing%2C+but+labor+not+in+the+Word+and+doctrine%2C+1+Tim+5%3A17%2C+and+yet+visit+the+sick%2C+oversee+the+ways+and+manners+of+the+people%2C+and+so+rule+with+diligence%2C+Rom.+12%3A8%3B+1+Cor.+12%3A28%2C+and+judge+with+pastors+and+doctors%2C+Matt+18%3A18-20.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Peaceable+%26+Temperate+Plea+for+Paul%E2%80%99s+Presbytery+in+Scotland%E2%80%A6+%28London%2C+1642%29+%7C+ch.+20%2C+Whether+or+not+the+government+of+the+Church+of+Scotland+can+be+proved+by+God%E2%80%99s+Word+to+be+lawful%3F+%7C+11th+Article%2C+Elders+and+Deacons&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3c8b92e5b4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3c8b92e5b4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/ruling-elders#:~:text=Elders%20help%20the%20pastors%20in%20governing%2C,with%20pastors%20and%20doctors%2C%20Matt%2018%3A18%2D20." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5708a3112a" data-kw="">
<blockquote><p>VIII. Once a month we have a meeting of the magistrates, ministers, deacons and above twenty persons chosen annually by the church, as their trustees or deputies: Here the offenders must be accused, and heard, and dealt with before the case be opened in the church. And any that are justly offended with any member, may have church-justice: the magistrates’ presence being only ad melius esse [to the better well-being] and the chosen trustees or deputies being no ecclesiastical officers, nor pretending to divine institution as such: but only the fittest of the people chosen to do those things which belong to the people (who cannot all so frequently meet) and having no authoritative ruling votes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief, 2, our consent to the Gospel Covenant, 3, the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660), The Order &amp; Discipline of this Church, agreeable to the Word of God</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>
<div class="actions"><button class="copy" data-copy="“VIII. Once a month we have a meeting of the magistrates, ministers, deacons and above twenty persons chosen annually by the church, as their trustees or deputies: Here the offenders must be accused, and heard, and dealt with before the case be opened in the church. And any that are justly offended with any member, may have church-justice: the magistrates’ presence being only ad melius esse [to the better well-being] and the chosen trustees or deputies being no ecclesiastical officers, nor pretending to divine institution as such: but only the fittest of the people chosen to do those things which belong to the people (who cannot all so frequently meet) and having no authoritative ruling votes.”

— Richard Baxter, The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief, 2, our consent to the Gospel Covenant, 3, the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660), The Order &amp; Discipline of this Church, agreeable to the Word of God">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVIII.+Once+a+month+we+have+a+meeting+of+the+magistrates%2C+ministers%2C+deacons+and+above+twenty+persons+chosen+annually+by+the+church%2C+as+their+trustees+or+deputies%3A+Here+the+offenders+must+be+accused%2C+and+heard%2C+and+dealt+with+before+the+case+be+opened+in+the+church.+And+any+that+are+justly+offended+with+any+member%2C+may+have+church-justice%3A+the+magistrates%E2%80%99+presence+being+only+ad+melius+esse+%5Bto+the+better+well-being%5D+and+the+chosen+trustees+or+deputies+being+no+ecclesiastical+officers%2C+nor+pretending+to+divine+institution+as+such%3A+but+only+the+fittest+of+the+people+chosen+to+do+those+things+which+belong+to+the+people+%28who+cannot+all+so+frequently+meet%29+and+having+no+authoritative+ruling+votes.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Christian+Religion+expressed%3A+I%2C+briefly+in+the+Ancient+Creeds%2C+the+Ten+Commandments+%26+the+Lord%E2%80%99s+Prayer%2C+and%2C+II%2C+more+largely+in+a+Profession+taken+out+of+the+Holy+Scriptures%2C+containing+1%2C+the+articles+of+the+Christian+Belief%2C+2%2C+our+consent+to+the+Gospel+Covenant%2C+3%2C+the+Sum+of+Christian+Duty+according+to+the+primitive+simplicity%2C+purity%2C+and+practice%2C+fitted+to+the+right+instruction+of+the+ignorant%2C+the+promoting+of+holiness%2C+and+the+charitable+concord+of+all+true+believers%E2%80%A6+%28London%3A+1660%29%2C+The+Order+%26+Discipline+of+this+Church%2C+agreeable+to+the+Word+of+God&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5708a3112a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5708a3112a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-office-of-widows-the-churchs-ministry-to-the-needy/#:~:text=VIII.%20Once%20a%20month%20we%20have,and%20having%20no%20authoritative%20ruling%20votes." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-15925668ab" data-kw="">
<blockquote><p>And if St. Paul in the choice of the widow to attend upon the sick of the church, which was the lowest office in the church, requires not only such a one as is at the time of the choice honest and holy, but such a one as has led her whole life in all good works and with commendation, how much more is that to be observed in the minister or bishop of the church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reply to an Answer made of Mr. Doctor Whitgift Against the [Presbyterian] Admonition to the Parliament (1573) | ‘To the next section beginning in the 38th page,’</cite>, p. 41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-e56a7aed84" data-kw="">
<blockquote><p>Bavinck… says, the church ‘cannot do without women in this work.’ This includes things like Sunday school, care for the poor and the sick, care for the elderly, the support of pregnant women, and more. He doesn’t think these activities need to be directly under the oversight of the church as an institution, but the church does have the calling to promote this kind of work where women use their gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wes-bredenhof.html">Wes Bredenhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Herman Bavinck on Women in the Church’ (2021)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

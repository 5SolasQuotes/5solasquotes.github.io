<main class="wrap"><figure class="quote" id="q-ce7f8b2d32" data-kw="">
<blockquote><p>The great work demanding the attention of the churches is the evangelization of this nation. The greatest hindrance to the world’s evangelization is the attitude of indifference of the churches at home. If the Christian community was thoroughly Christianized, it would be an easy task to get money and workers to carry the gospel to all the world.

How thoroughly unchristian are our so-called Christian communities! How seemingly powerless is our organized Christianity! How little the church affects the community in comparison to what it should do! Instead of predominating the community with religious ideals, it is permeated with worldly policies that show the overwhelming influence of secular life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-madison-alexander.html">William Madison Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Old Evangelism in Union Seminary Magazine</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/evangelism.html">Evangelism</a></span></div>

<blockquote><p>It has secured great advantages for the evangelization of Scotland. The Free Church has the best of the Ministers, and the mass of the people. It has also the goodwill of the other evangelical communions, and in co-operation with them, the field of Scotland is now before it.

Clerical etiquette, and ecclesiastical trammels, and civil interdicts, will not now restrain its Ministers. Broad Scotland is their parish, and the last verses of Matthew’s Gospel their commission; and we trust that many people who have long sat in darkness will now see a great light.</p></blockquote>

</figure><figure class="quote" id="q-26f1ea2082" data-kw="">
<blockquote><p>It is true, they [the Independents] object that the apostles, Mt. 18, were commanded to preach to all nations, but pastors are not so now, but are commanded to feed the flock over which God has appointed them, Acts 20:28; but it is as true [that] the apostles were commanded to preach to all nations, in opposition to the charge that the prophets of old were to speak to the people of Israel only, and the apostles, Mt. 10, [were] forbidden to preach to the Samaritans and gentiles; and it is as true that God’s Spirit limited the apostles to preach to Macedonia, not to Bithynia; Now because this particular direction for places is wanting in the Church, it is certain that a man is yet a pastor in office in relation to as many as God’s hand of providence shall send him unto, though he be chosen by a people to feed ordinarily one determinate flock, and though he be not an extraordinary and immediately inspired planter of Churches, or the first planter, as were the apostles, yet is he a pastor in relation to all. And if this be not said: 1. It were simply unlawful for pastors now to plant churches and spread the Gospel to those nations who have not heard it, because all pastors now are ordinary [according to congregationalists], and none are immediately inspired apostles: but it is certain what the apostles did by an extraordinary gift, as such immediately called pastors, it is unlawful for ordinary pastors to attempt to do, as to attempt to speak with tongues, and to plant Churches by speaking with tongues and confirming it with miracles is unlawful. Papists, as Bellarmine, Suarez, Acosta, ascribe this to the Pope and his apostles. Our divines answer that the apostles that way have no successors; But what the apostles did by an ordinary pastoral gift, as to preach the Word, administrate the Sacraments, to erect and plant Churches by ordinary gifts, where the pastors can speak to the Churches by an ordinary gift in their own language, they are obliged both within and without the congregation, to preach as pastors, because where God gives gifts pastoral to pastors, he commands them to exercise these gifts, else they dig their Lord’s talent in the earth: but God gives to pastors pastoral gifts to preach to others than their own congregation, and to administrate the seals to them also, and to plant churches. Therefore, it is presumed that the Church does give authority and an external ministerial calling to the exercise of these gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 2, pp. 207-8</span></figcaption>

</figure><figure class="quote" id="q-091e61afe4" data-kw="">
<blockquote><p>Our judgement is that none may publicly in the church assembly of the faithful preach the Word of God in the Name of Christ and of God, but he who is sent by a divine calling for that work; as the Protestants demonstrate against the Socinians and Anabaptists from Rom. 10:14-15; Heb. 5:4-5; Acts 13:1-2 &amp; 14:22; Tit. 1:5; 2 Tim. 2:2, and other places and arguments; and from the examples of all those, who either in an extraordinary or ordinary manner were sent to preach the Word. Which mission, or sending, consists not only in conferring gifts, whereby an ability, [Greek], is given by God; but in conferring a power, whereby is given an authority, [Latin], to preach the Word of God; which authority is oft-times not conferred on those, on whom yet God bestows gifts and ability. For it is by the Word of God denied to women, in whose lips is the Law of God, Prov. 31:26, and a fitness to teach the yonger women, Tit. 2:3-4. It is certain from the Word of God that God enjoins all believers to exhort, comfort, reprove, and edify one another, Heb. 3:13; 1 Thess. 4:18 &amp; 5:14, but it is from the common duty of charity, and the law of nature that they are thus bound: and therefore the Word which they declare to their neighbours does not by the authority of any special office bind to obedience those that hear it, but by virtue of the subject or matter contained in that Word. But the Church’s ministers declare the Word of God as Christ’s ambassadors, with authority of special office, and power to bind and loose, 1 Cor. 4:1-2; 2 Cor. 5:20; Jn. 20:21-22. There is therefore a many-fold difference between the charitative admonitions of private Christians and the authoritative preaching of God’s ministers. For:

1. The admonitions of ordinary Christians are to our neighbor privately, and as joined to us by the bond of charity and the law of nature: The ministers of churchs do publicly preach the Word of God with pastoral charge of souls, and God’s authority, to the Church, as a Church, over which God has made them watchmen and overseers.

2. The ministers’ authoritative preaching the Word has joined with it the ecclesiastical power of binding and loosing sinners, remitting and retaining sins, Mt. 16:18-19; Jn. 20:21-22, which authority is not affixed to the charitative admonitions of private Christians.

3. There is not so absolute and strict an obligation on private Christians for that brotherly correction which is performed by them, as the obligation on the pastors of the Church of God for their office of preaching, who may not involve themselves in the affairs of this world, to the end that they may wholly attend upon the office of preaching, 2 Tim. 2. 4. and who are in a special manner to give an account of the salvation of their hearers committed to them, Heb. 13:17; Eze. 3:18 &amp; 33:18, which do not concern private Christians in the exercise of charitative admonition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated</cite>, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 75-77</span></figcaption>

tween+the+charitative+admonitions+of+private+Christians+and+the+authoritative+preaching+of+God%E2%80%99s+ministers.+For%3A%0A%0A1.+The+admonitions+of+ordinary+Christians+are+to+our+neighbor+privately%2C+and+as+joined+to+us+by+the+bond+of+charity+and+the+law+of+nature%3A+The+ministers+of+churchs+do+publicly+preach+the+Word+of+God+with+pastoral+charge+of+souls%2C+and+God%E2%80%99s+authority%2C+to+the+Church%2C+as+a+Church%2C+over+which+God+has+made+them+watchmen+and+overseers.%0A%0A2.+The+ministers%E2%80%99+authoritative+preaching+the+Word+has+joined+with+it+the+ecclesiastical+power+of+binding+and+loosing+sinners%2C+remitting+and+retaining+sins%2C+Mt.+16%3A18-19%3B+Jn.+20%3A21-22%2C+which+authority+is+not+affixed+to+the+charitative+admonitions+of+private+Christians.%0A%0A3.+There+is+not+so+absolute+and+strict+an+obligation+on+private+Christians+for+that+brotherly+correction+which+is+performed+by+them%2C+as+the+obligation+on+the+pastors+of+the+Church+of+God+for+their+office+of+preaching%2C+who+may+not+involve+themselves+in+the+affairs+of+this+world%2C+to+the+end+that+they+may+wholly+attend+upon+the+office+of+preaching%2C+2+Tim.+2.+4.+and+who+are+in+a+special+manner+to+give+an+account+of+the+salvation+of+their+hearers+committed+to+them%2C+Heb.+13%3A17%3B+Eze.+3%3A18+%26+33%3A18%2C+which+do+not+concern+private+Christians+in+the+exercise+of+charitative+admonition.%E2%80%9D%0A%0A%E2%80%94+Wilhelm+Apollonius%2C+A+Consideration+of+Certain+Controversies+at+this+Time+Agitated%2C+%28London%3A+G.M.%2C+1645%29%2C+ch.+5%2C+%E2%80%98Of+the+Ecclesiastical+Ministry%2C+and+the+Exercise+thereof%E2%80%99%2C+pp.+75-77&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F091e61afe4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/091e61afe4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/evangelism#:~:text=Our%20judgement%20is%20that%20none%20may,in%20the%20exercise%20of%20charitative%20admonition&amp;text=O <blockquote><p>The design of Christ was not like Mahomet’s, to get himself an earthly kingdom and numerous followers merely to cry up his name: and therefore He will not indulge men in their sin, nor abate or alter the conditions of his Covenant to win disciples: He will have his ministers deal plainly with all to whom they preach, and let them know that without self-denial and forsaking all (in estimation and resolution) and a willing exchange of earth for heaven, they cannot be his true disciples: Nor without a professed consent to thus much, they cannot be his visible professed disciples. But all that will not repent must perish. And therefore in their baptism they must profess a renunciation of all competitors.</p></blockquote>

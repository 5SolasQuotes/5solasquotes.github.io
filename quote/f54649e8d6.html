<main class="wrap"><figure class="quote" id="q-f54649e8d6" data-kw="">
<blockquote><p>([Margin Note:] What sort of influences we are to seek from God) But this is also a tempting of God: 1. We are not to pray for influences-physical simply and absolutely for all uses and ends to work miracles, to remove mountains, but especially we are to pray for more influences and such as are suitable to our ordinary duties: Ps. 119:36, ‘Incline my heart’ (but he suits not of God every bowing of the heart abstracted from the Word) ‘incline my heart unto thy testimonies and not to covetousness.’ Verse 133, ‘Order my heart in thy steps; let not any iniquity have dominion over me.’ 2. David seeks not every sort of quickening influences, but Ps. 119:25, ‘Quicken Thou me according to thy Word.’ Verse 40, ‘Quicken me in thy righteousness.’ Verse 88, ‘Quicken me after thy loving kindness.’ Verse 149, ‘O Lord, quicken me according to thy judgement.’ Verse 156 and 116, ‘Uphold me according to thy word, that I may live.’ Quakers and Familists seek after the furious wild-fire of hell, skaddings and flamings of a spirit abstracted from the Word…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Influences of the Life of Grace</cite>, (London, 1659), p. 94</span></figcaption>

rd" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-00fb97cdc5" data-kw="">
<blockquote><p>15. Now rests it to see whether it be lawful for godly men to desire miracles of God… I say when men are in this perplexity, the will being ready bent, yea very desirous to obey the commandment of God, godly men cannot be accused either of tempting of God or of rashness if so be they desire to be confirmed by some sign. For whosoever in those cases desires such things as God has been accustomed to offer, he does not amiss. No man is ignorant but that to Ahaz was offered a sign to the intent he might be assured of the promises offered him by Isaiah; wherefore to desire those things which God Himself sometime gives and freely offers, ought not to be forbidden as unlawful, wherof there is no want of examples. … For these things [in Mk. 16:17-18] are not absolutely and without exception, but in some respect the tokens of faith belonging to that primitive Church until the gospel were made more manifest. For miracles were as trumpets and open criers wherby the gospel was commended. For even as the Law of Moses procured to itself credit, through the manifold miracles showed upon Mount Sinai and in the wilderness, which afterward ceased when they were come to the land of promise: so in like manner, miracles are now also taken away, seeing the gospel is spread throughout the world. And therefore the promise which Christ would have to be written in the gospel of Mark, belonged not to all times; whereof it is not our part either to complain or find any fault; because that we hear that the Holy Ghost distributes to every one as He will, who nevertheless, for great considerations Him moving, does not impart to all men gifts and graces alike. For if they should happen to all alike, they would soon grow out of estimation, whereas God has determined to make store of them. Moreover, He would that charity should grow and increase, which is then exercised when one man does help another, which thing would not have taken place if all men had been endued with like gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether it be lawful for the godly to desire miracles, and why there be none in this our age’ in ch. 9. ‘Of Miracles, &amp; the Definition &amp; Difference of Them’ in The Common Places</cite>, … (London: Henrie Denham et al., 1583), pt. 1, ch. 9. ‘Of Miracles, &amp; the Definition &amp; Difference of Them’, pp. 69-72, pp. 69, 71-72</span></figcaption>

</figure><figure class="quote" id="q-6c904d3d89" data-kw="">
<blockquote><p>We prefer public prayers made by the congregation in the church before private prayers, not because of the place, but in respect of the congregation, whose prayers jointly altogether are more fervent and effectual than the prayer of one man… Argument 1. The promise of our Savior is general, ‘Wheresoever two or three are gathered together, I am in the midst amongst them,’ Mt. 18:20.</p></blockquote>

</figure><figure class="quote" id="q-7ccd6764ee" data-kw="">
<blockquote><p>We do not reject the commemoration or honorable mention of the dead saints, nor an annual thanksgiving for those who have departed in the faith of Christ: besides we have acknowledged that we may pray for a blessed resurrection, for a public absolution in the day of judgment and the perfect happiness of deceased believers, without any superstition. Hence that solemn prayer in our English [Anglican] Church, when the dead are conveyed to the tomb: ‘Almighty God… beseeching Thee, that it may please Thee of thy gracious goodness shortly to accomplish… that we, with all those who are departed in the true faith of thy holy name, may have our perfect consummation and bliss, both in body and soul, in they eternal and everlasting glory, etc.&#x27;</p></blockquote>

<blockquote><p>Oh, all you who know and delight in this King, observe all this. Let it wound your heart; let your soul bleed; and for sorrow let your eyes cry rivers of tears by reason of the fact that this glorious King of His Church is thus despised and scorned. Pray continually for Him (Ps. 72:15) and to Him, that He would reveal Himself to His Church as King before the eyes of the entire world. ‘Give ear, O Shepherd of Israel, Thou that leadest Joseph like a flock; Thou that dwellest between the cherubims, shine forth. Before Ephraim and Benjamin and Manasseh stir up thy strength, and come and save us’ (Ps. 80:1-2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, vol. 1, ch. 21, ‘The Kingly Office of Jesus Christ’, p. 568</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d9fde00f14" data-kw="">
<blockquote><p>In its entirety, Solitude Improved is considerably longer than any other Puritan works on meditation; this is largely due to Ranew’s blending of a more verbose style of writing common to sermons with an inclusiveness of topics common to manuals. Because of the length, inclusiveness, and accessible style of Ranew’s work, this book is an excellent place to begin a study of Puritan meditative theology and practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-ranew.html">Nathanael Ranew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Solitude Improved by Divine Meditation</cite></span></figcaption>

</figure><figure class="quote" id="q-3c2a030736" data-kw="">
<blockquote><p>Were there no more in praying but a communion with God, how sweet is it? When Christ prays, the ‘fashion of his countenance is changed,’ Lk. 9:29. There is a heaven in the bosom of prayer, though there were never a granting of the suit; sure there is a sin in making heaven a hire and in making duty a relative thing, a horse for a journey, a ship for a voyage to fetch home gold, where as there is heaven in praising God before the Throne, such as is both work and wages, and so in spiritual duties here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened… (1655)</cite>, p. 71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/nature-and-necessity-of-prayer.html">Nature and Necessity of Prayer</a></span></div>

</figure><figure class="quote" id="q-92fe329262" data-kw="">
<blockquote><p>The prayer for the blessed resurrection of bodies is a form of charity toward the dead, through which we wish for them and ask God that their bodies may rise to eternal life on the last day. This does not contradict faith: Because it is commanded by Christ: When He instructs us to pray that the kingdom of our Father in heaven may come, He refers not only to the kingdom of grace but also to the kingdom of glory, which will not come without the resurrection of bodies. Therefore, when we pray, “Thy kingdom come,” we are also praying for the future resurrection of the dead… Because we have the promise of the resurrection of the flesh to eternal life. Whatever is promised to us and to others, even to the deceased in Christ’s faith, it is right to pray for its fulfillment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System of Theology (Hanau, 1609; 1615), vol. 2, bk. 10, ‘Moral Virtues’ Latin | 15. ‘On the Prayer [voto] for the Blessed Resurrection of Bodies’</cite>, p. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/nature-and-necessity-of-prayer.html">Nature and Necessity of Prayer</a></span></div>
<div class="actions"><button class="copy" data-copy="“The prayer for the blessed resurrection of bodies is a form of charity toward the dead, through which we wish for them and ask God that their bodies may rise to eternal life on the last day. This does not contradict faith: Because it is commanded by Christ: When He instructs us to pray that the kingdom of our Father in heaven may come, He refers not only to the kingdom of grace but also to the kingdom of glory, which will not come without the resurrection of bodies. Therefore, when we pray, “Thy kingdom come,” we are also praying for the future resurrection of the dead… Because we have the promise of the resurrection of the flesh to eternal life. Whatever is promised to us and to others, even to the deceased in Christ’s faith, it is right to pray for its fulfillment.”

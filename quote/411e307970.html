<main class="wrap"><figure class="quote" id="q-411e307970" data-kw="">
<blockquote><p>Doubtless, no opinion that does not thwart the fundamentals of religion should make a separation, and destroy our love and charity; and that, because we have only probable arguments for our opinions, but we have an express command for our love; one excellent property of which, is, that it ‘Bears all things, suffers long, and is kind:’ And indeed, if we do but consider the long suffering of God towards us, how much he bears with us every day, we have all the reason in the world to make that excellent character and property ours, and as much as may be, to bear with one another, to support, and not devour the weak; to strengthen, and not confound the feeble knees; to raise up, and not to trample upon those that are down; and by this means we may do more good, than by all the violence we can use, since a gentle persuasion accompanied with kindness, will reach farther than the strongest argument urged with hatred and ill nature. Christianity should appear with all the ornaments of a meek and quiet spirit, and show a love mixed with sorrow, towards those that are strangers or enemies to it; and this will make them esteem the love that’s showed them, the persons that show it, and praise the religion that moves them to it, and sooner than anything else, persuade them to be of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-jekyll.html">Thomas Jekyll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Peace &amp; Love Recommended &amp; Persuaded in Two Sermons… (London: 1675), 1st Sermon, p. 14 Jekyll (1646–1698) was an Anglican conforming minister.</cite></span></figcaption>

<blockquote><p>That as union is ever a duty, so we conceive if men interessed will do their duty, there can be no division amongst orthodox divines or ministers but it is possible also to compose it, and union is a thing attainable. For: 1. We are not speaking of composing divisions that are stated upon the fundamental things; [2.] nor are we speaking of removing all differences, as if all men were to be one in judgment in every point of truth; there may be difference where there is no division, as has been said. Nor, 3. when we speak of men’s doing their duty, do we mean a full up-coming of everything in knowledge and practice…</p></blockquote>

</figure><figure class="quote" id="q-6a2af103e9" data-kw="">
<blockquote><p>Calvin never for a moment ceased to view the Church in its totality and, as Karl Holl has noted, his ecumenicity took root in the Churches organized under his influence, resulting in a strong feeling of unity and an active intercourse between them. In conflicts within Calvinism, national difference has never played a part. In this ecumenical consciousness he sought, in fact, a ‘syncretism’ (a word employed in his Catechism) among Protestants. Calvin never drew the bounds of communion in terms of assent to one confession of faith… He sought to lay the foundation of a Europe-wide communion, with a doctrinal basis clearly but not narrowly defined. He hoped to obtain this by mutual deliberation and conciliar action. Had his aims been achieved, Protestantism would have taken the outlines of a Church ecumenical and conciliar, autonomous vis-a-vis the State though protected by it. The design of Calvin has the grandeur of a world-embracing Christian order… The three Protestantisms [Reformed, Zwinglian and Luthern] had become two [as the Zwinglian and Reformed merged], and Calvin never lost hope that the two would become one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Calvin | John T. McNeill, ch. 1. “The Ecumenical Idea &amp; Efforts to Realize it, 1517-1618” in eds. Ruth Rouse &amp; Stephen C. Neill, A History of the Ecumenical Movement: 1517-1948 (Philadelphia, 1967)</cite>, p. 52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-fb014038e0" data-kw="">
<blockquote><p>I shall recommend to you Mr. [William] Perkins’ Exposition of this [Scripture] testimony (on Jude 19), comparing it with his comment to the same effect on the first chapter of the Epistle to the Galatians, the 2nd verse, and his doctrinal observation is this (I shall only abbreviate that descant he has enlarged): It is a great sin for a man to separate himself from the assembly of God’s people, Heb. 10:25. It is our duty to keep unity, Eph. 4:3. Upon this occasion he starts this question: Whether if there be errors in the Church, we may separate ourselves? His judicious resolution is this: Errors are either practical in manners or doctrinal in tenets. For vicious manners we may not separate; Lot did it not. The Jews might not do it from the scribes and Pharisees, because they sat in Moses’s chair. Though we may not separate from such corrupt persons in the public assemblies, yet we may in private conversation, 1 Cor. 5:11. If the Church err in doctrine, it is to be considered whether the error be in a point substantial, fundamental or not? if in a point substantial, fundamental, whether upon infirmity, or obstinacy? if of frailty, we may not separate, as in Corinth and Galatia. If a Church err in the foundation openly, obstinately, a separation may be made, 1 Tim. 4:5 (yet the error being in some, not in all, it remains a Church, as Corinth did). If the error be in smaller points, not fundamental, we may not separate: They which build upon the foundation of hay and stubble of erroneous opinon, may be saved, 1 Cor. 3:25. Mr. Perkins concludes that no man can separate from the Church of England with a good conscience, since it teaches, obeys, believes the doctrine of the prophets and apostles. In the most justifiable cause of separation he requires examination, conviction, censure (or condemnation). To separate without examination is not piety, but frenzy. No man can judge aright of that (says the Philosopher, Aristotle, bk. 1, Ethics) whereof he is ignorant. No man can well determine, what he does not well discuss. Qui ad pauca respicit de facili pronunciat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-thomas.html">William Thomas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Church of England, in Point of Separation from it (London: Leach, 1679), pp. 80-82 Thomas (d. 1689) was a Welsh Anglican bishop.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“I shall recommend to you Mr. [William] Perkins’ Exposition of this [Scripture] testimony (on Jude 19), comparing it with his comment to the same effect on the first chapter of the Epistle to the Galatians, the 2nd verse, and his doctrinal observation is this (I shall only abbreviate that descant he has enlarged): It is a great sin for a man to separate himself from the assembly of God’s people, Heb. 10:25. It is our duty to keep unity, Eph. 4:3. Upon this occasion he starts this question: Whether if there be errors in the Church, we may separate ourselves? His judicious resolution is this: Errors are either practical in manners or doctrinal in tenets. For vicious manners we may not separate; Lot did it not. The Jews might not do it from the scribes and Pharisees, because they sat in Moses’s chair. Though we may not separate from such corrupt persons in the public assemblies, yet we may in private conversation, 1 Cor. 5:11. If the Church err in doctrine, it is to be considered whether the error be in a point substantial, fundamental or not? if in a point substantial, fundamental, whether upon infirmity, or obstinacy? if of frailty, we may not separate, as in Corinth and Galatia. If a Church err in the foundation openly, obstinately, a separation may be made, 1 Tim. 4:5 (yet the error being in some, not in all, it remains a Church, as Corinth did). If the error be in smaller points, not fundamental, we may not separate: They which build upon the foundation of hay and stubble of erroneous opinon, may be saved, 1 Cor. 3:25. Mr. Perkins concludes that no man can separate from the Church of England with a good conscience, since it teaches, obeys, believes the doctrine of the prophets and apostles. In the most justifiable cause of separation he requires examination, conviction, censure (or condemnation). To separate without examination is not piety, but frenzy. No man can judge aright of that (says the Philosopher, Aristotle, bk. 1, Ethics) whereof he is ignorant. No man can well determine, what he does not well discuss. Qui ad pauca respicit de facili pronunciat.”

— William Thomas, An Apology for the Church of England, in Point of Separation from it (London: Leach, 1679), pp. 80-82 Thomas (d. 1689) was a Welsh Anglican bishop.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+shall+recommend+to+you+Mr.+%5BWilliam%5D+Perkins%E2%80%99+Exposition+of+this+%5BScripture%5D+testimony+%28on+Jude+19%29%2C+comparing+it+with+his+comment+to+the+same+effect+on+the+first+chapter+of+the+Epistle+to+the+Galatians%2C+the+2nd+verse%2C+and+his+doctrinal+observation+is+this+%28I+shall+only+abbreviate+that+descant+he+has+enlarged%29%3A+It+is+a+great+sin+for+a+man+to+separate+himself+from+the+assembly+of+God%E2%80%99s+people%2C+Heb.+10%3A25.+It+is+our+duty+to+keep+unity%2C+Eph.+4%3A3.+Upon+this+occasion+he+starts+this+question%3A+Whether+if+there+be+errors+in+the+Church%2C+we+may+separate+ourselves%3F+His+judicious+resolution+is+this%3A+Errors+are+either+practical+in+manners+or+doctrinal+in+tenets.+For+vicious+manners+we+may+not+separate%3B+Lot+did+it+not.+The+Jews+might+not+do+it+from+the+scribes+and+Pharisees%2C+because+they+sat+in+Moses%E2%80%99s+chair.+Though+we+may+not+separate+from+such+corrupt+persons+in+the+public+assemblies%2C+yet+we+may+in+private+conversation%2C+1+Cor.+5%3A11.+If+the+Church+err+in+doctrine%2C+it+is+to+be+considered+whether+the+error+be+in+a+point+substantial%2C+fundamental+or+not%3F+if+in+a+point+substantial%2C+fundamental%2C+whether+upon+infirmity%2C+or+obstinacy%3F+if+of+frailty%2C+we+may+not+separate%2C+as+in+Corinth+and+Galatia.+If+a+Church+err+in+the+foundation+openly%2C+obstinately%2C+a+separation+may+be+made%2C+1+Tim.+4%3A5+%28yet+the+error+being+in+some%2C+not+in+all%2C+it+remains+a+Church%2C+as+Corinth+did%29.+If+the+error+be+in+smaller+points%2C+not+fundamental%2C+we+may+not+separate%3A+They+which+build+upon+the+foundation+of+hay+and+stubble+of+erroneous+opinon%2C+may+be+saved%2C+1+Cor.+3%3A25.+Mr.+Perkins+concludes+that+no+man+can+separate+from+the+Church+of+England+with+a+good+con

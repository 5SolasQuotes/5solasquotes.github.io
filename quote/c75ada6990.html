<blockquote><p>The schools of divinity, which of late were a pleasant Lebanon for timber to my buildings, are become dens of ignorance and impiety, sinks of schism and sedition for my subversion. The sons of the Prophets are made enemies to prophesy; instead of convictions of heresy, hearing nothing almost, but the censures of sincerity: in place of the harmony of Christ’s Evangel denude with dated contentions about Antichristian geniculation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The speech of the Kirk of Scotland to her beloved children</cite>, (Amsterdam, 1620), pp 47-48.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f7d239ae2c" data-kw="">
<blockquote><p>It is the Confession to which all ranks in these lands are bound to adhere as a part of their Covenanted uniformity. This Confession was framed in carrying into effect one principal object of the Solemn League, which was to bring the Churches in the three kingdoms to the nearest possible uniformity, in doctrine, worship, discipline, and government. Moreover, it was actually received, and solemnly recognized by the parties concerned in that federal deed, as their doctrinal standard of uniformity, to which they were bound to adhere by the oath of God. To abandon this Confession, therefore, in principle at least, so long as it cannot be shown to be unscriptural, would be to incur the charge of covenant violation.

We do not insist that the design of that League would be defeated by a mere change of statement, if the principles in the Westminster Confession were retained, provided the change of statement had that concurrence of all the Churches in Britain and Ireland, which gave their sanction to that Confession. But till this is obtained, the safest way to preserve the public faith inviolate, is to adhere to it not only in the spirit, but also in the letter of it. …

It is a Confession to which the Churches in Britain and Ireland are not only bound to adhere by solemn covenant, but it is also the basis on which there is a great probability that they will unite, when the Lord brings again Zion. Though the greater part of these Churches have never fully redeemed the pledge given by them in the Solemn League, to cleave to the Westminster Standards, as standards of uniformity to the three nations; it does not free any of them from their solemn engagements. The friends of these standards are still bound to hold them fast, and to display them as a banner to the generation, in order to remind them of their first love, and of their first works.

Nor are they left without hope that the great object of the Westminster Confession, as a standard of uniformity, will ultimately be gained. However far even the Presbyterian Churches in Britain and Ireland may have departed in administration from that Confession, it is still recognised by them in some form or other, as an explanatory standard. It seems therefore to be reserved in the providence of God as a central point, in which all the scattered sections of the Church in these lands will meet, when times of refreshing shall come from the presence of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-stevenson.html">George Stevenson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plea for the Covenanted Reformation in Britain and Ireland</cite>, (3rd edn, Edinburgh: W. P. Kennedy, 1844), p. 95.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-5265bb184b" data-kw="">
<blockquote><p>3rd Conclusion. A visible profession of the truth and doctrine of godliness is that which essentially constitutes a visible church, and every member of the visible church; Only our [Independent] Brethren and we differ much about the nature of this profession which is required in members added to the Church. Our Brethren will have none members of the visible Church, but such as are satisfactory to the consciences of all the visible church, and give evidences so clear, as the judgement of discerning men can attain unto, that they are truly regenerated. We again do teach that the scandalously wicked are to be cast out of the Church by excommunication, and these of approved piety are undoubtedly members of the visible Church, so these of the middle sort are to be acknowledged members of the Church, though the Church have not a positive certainty of the judgement of charity that they are regenerated, so they be known: 1. to be baptized, 2. that they be free of gross scandals, 3. and profess that they be willing hearers of the doctrine of the Gospel. Such a profession as gives evidences to the positive certainty of the judgment of charity, of sound conversion, is not required to make and constitute a true, visible-Church.</p></blockquote>

<blockquote><p>Paphnutius the Confessor, when he observed Maximus, a godly and orthodox man, as Ruffinus reports, through too much simplicity, sit in the synod of Tyre, composed of such as were of the Arian side, the said Paphnutius went boldly in to the midst of the synod and said, ‘Te non patiar sedere, etc.’, i.e. O Maximus, I will not suffer thee to sit in a synod of malignants, nor to enter amongst the workers of iniquity.</p></blockquote>

<blockquote><p>Uniformity was their goal. But it is evident from the way in which they achieved it that the spirit of their Calvinism was inclusive rather than exclusive. Unity in the church of God, they believed, required a sufficiently clear statement of the truth to exclude manifestly false teaching, and a sufficiently broad expression of its nuances to avoid excluding those who were in heart and head truly orthodox, whatever differences might remain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sinclair-ferguson.html">Sinclair Ferguson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assembly of Theonomists? The Teaching of the Westminster Divines on the Law of God in William S. Barker and W. Robert Godfrey (eds), Theonomy: A Reformed Critique</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

<blockquote><p>§2. The fourth position we draw from the same rule [of following the example of Christ] is, that it is not indifferent for a minister to omit the breaking of the bread at the Lord’s table after the consecration and in the distribution of it, because he ought to follow the example of Christ, who, after He had blessed the bread, and when He was distributing it to them who were at table, brake it, breaking into pieces in his hands the bread he had taken,¹ but had it not carved in small pieces before it was brought to the table. Hence, G. J. Vossius² does rightly condemn those who, though they break the bread in multas minutias [into many small pieces], yet they break it not in actu sacramentali [in the sacramental act]. Such a breaking as this (he says well) is not mystica [related to mystery], but coquinaria [related to cooking]. 1. Paræus in 1 Cor. 11:24. manibus comminuendo panem acceptum in partes. [Cf. Ad Corinthios priorem (1609), col. 743.] 2. De Symb. Cœnæ Dom., disp. 2, thes. 5. [Cf. Theses Theologicæ et Historicæ, 1658 ed., p. 275.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English Popish Ceremonies (1637; Naphtali Press, 2013)</cite>, pp. 192–193</span></figcaption>

" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-98af2d2317" data-kw="">
<blockquote><p>In regard to the external form of the ordinance, whether or not believers are to take into their hands and divide among themselves, or each is to eat what is given to him; whether they are to return the cup to the deacon or hand it to their neighbor; whether the bread is to be leavened or unleavened, and the wine to be red or white, is of no consequence. These things are indifferent, and left free to the Church, though it is certain that it was the custom of the ancient Church for all to receive into their hand. And Christ said, “Take this, and divide it among yourselves” (Luk_12:17). History relates that leavened and ordinary bread was used before the time of Alexander the Bishop of Rome, who was the first that was delighted with unleavened bread: for what reason I see not, unless it was to draw the wondering eyes of the populace by the novelty of the spectacle, more than to train them in sound religion. I appeal to all who have the least zeal for piety, whether they do not evidently perceive both how much more brightly the glory of God is here displayed and how much more abundant spiritual consolation is felt by believers than in these frigid and histrionic [exaggerated dramatic behavior designed to attract attention] follies, which have no other use than to impose on the gazing populace. They call it restraining the people by religion, when, stupid and infatuated, they are drawn hither and thither by superstition. Should any one choose to defend such inventions by antiquity, I am not unaware how ancient is the use of Christ and exorcism in baptism, and how, not long after the age of the apostles, the Supper was tainted with adulteration; such, indeed, is the forwardness of human confidence, which cannot restrain itself, but is always sporting and wantoning in the mysteries of God. But let us remember that God sets so much value on obedience to his word, that, by it, He would have us to judge his angels and the whole world. All this mass of ceremonies being abandoned, the sacrament might be celebrated in the most becoming manner…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Institutes of the Christian Religion, vol. 2, Ed. John McNeill, Tr. Ford Battles (Philadelphia: The Westminster Press, 1960) 1420-1422, this quote was compiled by Peter Allison.</cite></span></figcaption>

</figure><figure class="quote" id="q-faa49b0340" data-kw="">
<blockquote><p>By reason, therefore, of this laver of repentance and knowledge of God, which has been ordained on account of the transgression of God’s people, as Isaiah cries, we have believed, and testify that that very baptism which he announced is alone able to purify those who have repented; and this is the water of life. But the cisterns which you have dug for yourselves are broken and profitless to you. For what is the use of that baptism which cleanses the flesh and body alone? Baptize the soul from wrath and from covetousness, from envy, and from hatred; and, lo! the body is pure. For this is the symbolic significance of unleavened bread, that you do not commit the old deeds of wicked leaven. But you have understood all things in a carnal sense, and you suppose it to be piety if you do such things, while your souls are filled with deceit, and, in short, with every wickedness. Accordingly, also, after the seven days of eating unleavened bread, God commanded them to mingle new leaven, that is, the performance of other works, and not the imitation of the old and evil works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/justin-martyr.html">Justin Martyr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dialogue with Trypho the Jew | Ch. 14, Righteousness is Not Placed in Jewish Rites, but in the Conversion of the Heart Given in Baptism by Christ.</cite></span></figcaption>

<blockquote><p>1. In all three Gospels what Jesus gave the disciples is [in Greek] “artos,” meaning simply “bread.” It is striking that He is not said to have given them “azumos” or “azuma” which are the proper words for unleavened bread, AND which are clearly available since they are used in each of the Gospels in the context to refer to the Passover. In other words, the use of “artos” by Matthew, Mark and Luke to tell us what Jesus gave the disciples makes the fact that this may have been unleavened bread of NO importance. At the same time we also must recognize that because the Scripture NOWHERE calls it “unleavened bread,” we cannot at all be sure that it was (throughout the NT “artos” is used for common or leavened bread). We simply may not base our teaching on the silence of Scripture because then we are really basing our teaching on a human conjecture. So, the fundamental argument, “Jesus used unleavened bread, therefore we should too,” is in fundamental error. This should close the case, but there is more. 2. To use unleavened bread in the Lord’s Supper is to commemorate the wrong thing. The purpose of unleavened bread in the Passover is to commemorate the haste with which Israel left Egypt; there was not even enough time to put yeast into the bread dough. In the Lord’s Supper we are NOT commemorating the Exodus from Egypt where unleavened bread makes sense. In the Lord’s Supper we are commemorating the sacrifice of Christ for our sins. In the Supper the bread is broken to recall Christ’s suffering and death, the breaking of His body. Other things could be said, but there is nothing in unleavening the bread of the Supper that would commemorate anything in the death of Christ that is taught in Scripture (unless we really let our imaginations run loose here – and then we are back to conjecture). 3. Thus using unleavened bread in the Supper is an unwarranted return to Old Testament shadows (commemorating the Passover instead of Christ’s death) and therefore ought to be resisted. The historic Reformed characterization of the Mass as a return to OT shadows of pictorial ceremonialism is common and fits here. 4. “The kingdom of heaven is not food and drink, but righteousness and joy and peace in the Holy Spirit” (Romans 10). This teaches us that an emphasis on a detail of food is not characteristic of the New Testament, quite in contrast with the Old. Thus the insistence on unleavened bread in the Supper is more typical of an OT ceremony than an NT one. Ah, you say, this also applies to the wine. Indeed it does. None, I hope, would claim that those who use grape juice are celebrating something else than the Lord’s Supper. Nevertheless there is a positive argument to use wine in Christ’s words found in all three Gospels, “I will not eat of this fruit of the vine from now on, until I eat it new with you in the Kingdom of God.” The proper understanding of this “fruit of the vine” is wine. So we drink wine, looking forward to the heavenly supper in Christ’s presence where He will drink it with us. 5. Another old Reformed argument is that if Christ used unleavened bread, He was using the bread at hand in the Passover not out of symbolism but out of convenience. He did not go out of the way to obtain leavened bread. In the same way, runs the argument, we too should use our common bread (which IS leavened) and not go out of our way to obtain something special. This argument stands alongside one that says that in order to preserve the meaning of the Supper that we are nourished spiritually by Christ’s body, we should use the bread that we ordinarily use to nourish our bodies, and that would, of course, be leavened bread. These are theological arguments, not directly biblical, but I do think that they do carry the analogy of Scripture, especially in light of the very biblical fact that the kingdom of God is NOT details of food, as we noted above. 6. 1 Cor. 5:8 is not talking about WHAT we eat, but HOW we eat the Lord’s supper. It speaks of unleavened people, not about going back to replaying the Passover with its use of unleavened bread. The unleavened bread in the Passover reflects the haste with which Israel left Egypt, without time to even put yeast into their bread. The Lord’s supper reflects not on a hasty exit from Egypt, but on the death of Christ for our sins, which makes HIM “our passover.” The bread represents the body of Christ in the Lord’s Supper, unleavening the bread in the Supper has no significance with respect to Christ’s sacrifice. Thus using unleavened bread would, as mentioned above, be going back to the OT Passover as though we were still celebrating the Exodus from Egypt in the Supper, rather than Christ’s sacrifice for our sins. 7. In the rest of the New Testament the Lord’s Supper is often called “breaking bread,” the same language that is used for ordinary meals (Acts 2:42 for example is most likely speaking of fellowship in a meal rather than the Lord’s Supper because in the immediate context they “ate their bread from house to house.”) In any case, the word “artos” is used for what is broken. There is never a description of the Supper in the NT in which that which is broken or eaten is called anything but “artos.” This argues quite strongly against requiring unleavened bread in the Supper because “artos” in a general use would simply mean ordinary bread.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. In all three Gospels what Jesus gave the disciples is [in Greek] “artos,” meaning simply “bread.” It is striking that He is not said to have given them “azumos” or “azuma” which are the proper words for unleavened bread, AND which are clearly available since they are used in each of the Gospels in the context to refer to the Passover. In other words, the use of “artos” by Matthew, Mark and Luke to tell us what Jesus gave the disciples makes the fact that this may have been unleavened bread of NO importance. At the same time we also must recognize that because the Scripture NOWHERE calls it “unleavened bread,” we cannot at all be sure that it was (throughout the NT “artos” is used for common or leavened bread). We simply may not base our teaching on the silence of Scripture because then we are really basing our teaching on a human conjecture. So, the fundamental argument, “Jesus used unleavened bread, therefore we should too,” is in fundamental error. This should close the case, but there is more. 2. To use unleavened bread in the Lord’s Supper is to commemorate the wrong thing. The purpose of unleavened bread in the Passover is to commemorate the haste with which Israel left Egypt; there was not even enough time to put yeast into the bread dough. In the Lord’s Supper we are NOT commemorating the Exodus from Egypt where unleavened bread makes sense. In the Lord’s Supper we are commemorating the sacrifice of Christ for our sins. In the Supper the bread is broken to recall Christ’s suffering and death, the breaking of His body. Other things could be said, but there is nothing in unleavening the bread of the Supper that would commemorate anything in the death of Christ that is taught in Scripture (unless we really let our imaginations run loose here – and then we are back to conjecture). 3. Thus using unleavened bread in the Supper is an unwarranted return to Old Testament shadows (commemorating the Passover instead of Christ’s death) and therefore ought to be resisted. The historic Reformed characterization of the Mass as a return to OT shadows of pictorial ceremonialism is common and fits here. 4. “The kingdom of heaven is not food and drink, but righteousness and joy and peace in the Holy Spirit” (Romans 10). This teaches us that an emphasis on a detail of food is not characteristic of the New Testament, quite in contrast with the Old. Thus the insistence on unleavened bread in the Supper is more typical of an OT ceremony than an NT one. Ah, you say, this also applies to the wine. Indeed it does. None, I hope, would claim that those who use grape juice are celebrating something else than the Lord’s Supper. Nevertheless there is a positive argument to use wine in Christ’s words found in all three Gospels, “I will not eat of this fruit of the vine from now on, until I eat it new with you in the Kingdom of God.” The proper understanding of this “fruit of the vine” is wine. So we drink wine, looking forward to the heavenly supper in Christ’s presence where He will drink it with us. 5. Another old Reformed argument is that if Christ used unleavened bread, He was using the bread at hand in the Passover not out of symbolism but out of convenience. He did not go out of the way to obtain leavened bread. In the same way, runs the argument, we too should use our common bread (which IS leavened) and not go out of our way to obtain something special. This argument stands alongside one that says that in order to preserve the meaning of the Supper that we are nourished spiritually by Christ’s body, we should use the bread that we ordinarily use to nourish our bodies, and that would, of course, be leavened bread. These are theological arguments, not directly biblical, but I do think that they do carry the analogy of Scripture, especially in light of the very biblical fact that the kingdom of God is NOT details of food, as we noted above. 6. 1 Cor. 5:8 is not talking about WHAT we eat, but HOW we eat the Lord’s supper. It speaks of unleavened people, not about going back to replaying the Passover with its use of unleavened bread. The unleavened bread in the Passover reflects the haste with which Israel left Egypt, without time to even put yeast into their bread. The Lord’s supper reflects not on a hasty exit from Egypt, but on the death of Christ for our sins, which makes HIM “our passover.” The bread represents the body of Christ in the Lord’s Supper, unleavening the bread in the Supper has no significance with respect to Christ’s sacrifice. Thus using unleavened bread would, as mentioned above, be going back to the OT Passover as though we were still celebrating the Exodus from Egypt in the Supper, rather than Christ’s sacrifice for our sins. 7. In the rest of the New Testament the Lord’s Supper is often called “breaking bread,” the same language that is used for ordinary meals (Acts 2:42 for example is most likely speaking of fellowship in a meal rather than the Lord’s Supper because in the immediate context they “ate their bread from house to house.”) In any case, the word “artos” is used for what is broken. There is never a description of the Supper in the NT in which that which is broken or eaten is called anything but “artos.” This argues quite strongly against requiring unleavened bread in the Supper because “artos” in a general use would simply mean ordinary bread.”

— Robert Grossman, See here for a bio. This quote was compiled by Andy Webb">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+In+all+three+Gospels+what+Jesus+gave+the+disciples+is+%5Bin+Greek%5D+%E2%80%9Cartos%2C%E2%80%9D+meaning+simply+%E2%80%9Cbread.%E2%80%9D+It+is+striking+that+He+is+not+said+to+have+given+them+%E2%80%9Cazumos%E2%80%9D+or+%E2%80%9Cazuma%E2%80%9D+which+are+the+proper+words+for+unleavened+bread%2C+AND+which+are+clearly+available+since+they+are+used+in+each+of+the+Gospels+in+the+context+to+refer+to+the+Passover.+In+other+words%2C+the+use+of+%E2%80%9Cartos%E2%80%9D+by+Matthew%2C+Mark+and+Luke+to+tell+us+what+Jesus+gave+the+disciples+makes+the+fact+that+this+may+have+been+unleavened+bread+of+NO+importance.+At+the+same+time+we+also+must+recognize+that+because+the+Scripture+NOWHERE+calls+it+%E2%80%9Cunleavened+bread%2C%E2%80%9D+we+cannot+at+all+be+sure+that+it+was+%28throughout+the+NT+%E2%80%9Cartos%E2%80%9D+is+used+for+common+or+leavened+bread%29.+We+simply+may+not+base+our+teaching+on+the+silence+of+Scripture+because+then+we+are+really+basing+our+teaching+on+a+human+conjecture.+So%2C+the+fundamental+argument%2C+%E2%80%9CJesus+used+unleavened+bread%2C+therefore+we+should+too%2C%E2%80%9D+is+in+fundamental+error.+This+should+close+the+case%2C+but+there+is+more.+2.+To+use+unleavened+bread+in+the+Lord%E2%80%99s+Supper+is+to+commemorate+the+wrong+thing.+The+purpose+of+unleavened+bread+in+the+Passover+is+to+commemorate+the+haste+with+which+Israel+left+Egypt%3B+there+was+not+even+enough+time+to+put+yeast+into+the+bread+dough.+In+the+Lord%E2%80%99s+Supper+we+are+NOT+commemorating+the+Exodus+from+Egypt+where+unleavened+bread+makes+sense.+In+the+Lord%E2%80%99s+Supper+we+are+commemorating+the+sacrifice+of+Christ+for+our+sins.+In+the+Supper+the+bread+is+broken+to+recall+Christ%E2%80%99s+suffering+and+death%2C+the+breaking+of+His+body.+Other+things+could+be+said%2C+but+there+is+nothing+in+unleavening+the+bread+of+the+Supper+that+would+commemorate+anything+in+the+death+of+Christ+that+is+taught+in+Scripture+%28unless+we+really+let+our+imaginations+run+loose+here+%E2%80%93+and+then+we+are+back+to+conjecture%29.+3.+Thus+using+unleavened+bread+in+the+Supper+is+an+unwarranted+return+to+Old+Testament+shadows+%28commemorating+the+Passover+instead+of+Christ%E2%80%99s+death%29+and+therefore+ought+to+be+resisted.+The+historic+Reformed+characterization+of+the+Mass+as+a+return+to+OT+shadows+of+pictorial+ceremonialism+is+common+and+fits+here.+4.+%E2%80%9CThe+kingdom+of+heaven+is+not+food+and+drink%2C+but+righteousness+and+joy+and+peace+in+the+Holy+Spirit%E2%80%9D+%28Romans+10%29.+This+teaches+us+that+an+emphasis+on+a+detail+of+food+is+not+characteristic+of+the+New+Testament%2C+quite+in+contrast+with+the+Old.+Thus+the+insistence+on+unleavened+bread+in+the+Supper+is+more+typical+of+an+OT+ceremony+than+an+NT+one.+Ah%2C+you+say%2C+this+also+applies+to+the+wine.+Indeed+it+does.+None%2C+I+hope%2C+would+claim+that+those+who+use+grape+juice+are+celebrating+something+else+than+the+Lord%E2%80%99s+Supper.+Nevertheless+there+is+a+positive+argument+to+use+wine+in+Christ%E2%80%99s+words+found+in+all+three+Gospels%2C+%E2%80%9CI+will+not+eat+of+this+fruit+of+the+vine+from+now+on%2C+until+I+eat+it+new+with+you+in+the+Kingdom+of+God.%E2%80%9D+The+proper+understanding+of+this+%E2%80%9Cfruit+of+the+vine%E2%80%9D+is+wine.+So+we+drink+wine%2C+looking+forward+to+the+heavenly+supper+in+Christ%E2%80%99s+presence+where+He+will+drink+it+with+us.+5.+Another+old+Reformed+argument+is+that+if+Christ+used+unleavened+bread%2C+He+was+using+the+bread+at+hand+in+the+Passover+not+out+of+symbolism+but+out+of+convenience.+He+did+not+go+out+of+the+way+to+obtain+leavened+bread.+In+the+same+way%2C+runs+the+argument%2C+we+too+should+use+our+common+bread+%28which+IS+leavened%29+and+not+go+out+of+our+way+to+obtain+something+special.+This+argument+stands+alongside+one+that+says+that+in+order+to+preserve+the+meaning+of+the+Supper+that+we+are+nourished+spiritually+by+Christ%E2%80%99s+body%2C+we+should+use+the+bread+that+we+ordinarily+use+to+nourish+our+bodies%2C+and+that+would%2C+of+course%2C+be+leavened+bread.+These+are+theological+arguments%2C+not+directly+biblical%2C+but+I+do+think+that+they+do+carry+the+analogy+of+Scripture%2C+especially+in+light+of+the+very+biblical+fact+that+the+kingdom+of+God+is+NOT+details+of+food%2C+as+we+noted+above.+6.+1+Cor.+5%3A8+is+not+talking+about+WHAT+we+eat%2C+but+HOW+we+eat+the+Lord%E2%80%99s+supper.+It+speaks+of+unleavened+people%2C+not+about+going+back+to+replaying+the+Passover+with+its+use+of+unleavened+bread.+The+unleavened+bread+in+the+Passover+reflects+the+haste+with+which+Israel+left+Egypt%2C+without+time+to+even+put+yeast+into+their+bread.+The+Lord%E2%80%99s+supper+reflects+not+on+a+hasty+exit+from+Egypt%2C+but+on+the+death+of+Christ+for+our+sins%2C+which+makes+HIM+%E2%80%9Cour+passover.%E2%80%9D+The+bread+represents+the+body+of+Christ+in+the+Lord%E2%80%99s+Supper%2C+unleavening+the+bread+in+the+Supper+has+no+significance+with+respect+to+Christ%E2%80%99s+sacrifice.+Thus+using+unleavened+bread+would%2C+as+mentioned+above%2C+be+going+back+to+the+OT+Passover+as+though+we+were+still+celebrating+the+Exodus+from+Egypt+in+the+Supper%2C+rather+than+Christ%E2%80%99s+sacrifice+for+our+sins.+7.+In+the+rest+of+the+New+Testament+the+Lord%E2%80%99s+Supper+is+often+called+%E2%80%9Cbreaking+bread%2C%E2%80%9D+the+same+language+that+is+used+for+ordinary+meals+%28Acts+2%3A42+for+example+is+most+likely+speaking+of+fellowship+in+a+meal+rather+than+the+Lord%E2%80%99s+Supper+because+in+the+immediate+context+they+%E2%80%9Cate+their+bread+from+house+to+house.%E2%80%9D%29+In+any+case%2C+the+word+%E2%80%9Cartos%E2%80%9D+is+used+for+what+is+broken.+There+is+never+a+description+of+the+Supper+in+the+NT+in+which+that+which+is+broken+or+eaten+is+called+anything+but+%E2%80%9Cartos.%E2%80%9D+This+argues+quite+strongly+against+requiring+unleavened+bread+in+the+Supper+because+%E2%80%9Cartos%E2%80%9D+in+a+general+use+would+simply+mean+ordinary+bread.%E2%80%9D%0A%0A%E2%80%94+Robert+Grossman%2C+See+here+for+a+bio.+This+quote+was+compiled+by+Andy+Webb&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe063738240.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e063738240.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/the-administration-of-the-lords-supper/quotes-on-common-bread-in-the-lords-supper/#:~:text=1.%20In%20all%20three%20Gospels%20what,use%20would%20simply%20mean%20ordinary%20bread." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The other sacrament of the New Testament is the holy Supper, in which, by the distribution and reception of broken bread and poured-out wine, is declared and sealed to believers the communion of the body of Christ broken for them on the cross and of his blood shed for them unto eternal life. The more illustrious and of greater moment to the consolation of believers this mystery of the Christian religion is, with so much the greater violence has Satan always endeavored to obscure and corrupt it in order to deprive the church of this inestimable treasure. Hence it has happened that in no part of religion have such prolix and animated disputations been raised up, so that at length the Romanists seem to have constituted the sum of theology in this article, nor is there anything in theology or philosophy which they have not brought to bear upon this and compelled to serve their purpose. Various names by which it is usually expressed: (1) the Lord’s Supper (1 Cor. 11:20).</p></blockquote>

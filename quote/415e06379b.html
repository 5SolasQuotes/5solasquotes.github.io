</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-689831c468" data-kw="">
<blockquote><p>Where was your Religion before Luther? To this the answer will be very short and easy… I say then, that our religion, as to the rules and principles of it, was before Luther, where it has been ever since, in the Scriptures: And as to the profession of it, it has been owned and maintained by the faithful in all ages, namely, such as have been kept by the power of God through faith unto salvation, against whom the gates of hell and Rome have not been able to prevail. The Protestant Religion we contend for is nothing else but Christianity uncorrupted, which was in its greatest purity before ever the Pope was heard of in the World. And Popery, that we oppose, is Christianity adulterated, or rather paganism Christianized, which was in the cradle when the mystery of iniquity began to work, and grew up to be the Man of Sin, when Popes had gulled the world into so much slavery as to endure their trampling upon princes. And this truth, as it appears in great measure from the Fathers and historians of the Church, and from all antiquity, that has had the good fortune to escape the Expurgatory Index [of Romanism]; so it is more especially, and most evidently manifest from the Scriptures…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short &amp; Plain Answer to Two Questions I. Where was your Religion Before Luther? II. How Know you the Scriuptures to be the Word of God? By a Protestant</cite>, (London, 1682), pp. 1-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

</figure><figure class="quote" id="q-3b016a99c9" data-kw="">
<blockquote><p>The sum of the whole discussion amounts to this: [1] that celibacy is better than marriage, because it has more liberty, so that persons can serve God with greater freedom; but at the same time, that [2] no necessity ought to be imposed, so as to make it unlawful for individuals to marry, if they think proper; and farther, that [3] marriage itself is a remedy appointed by God for our infirmity, which all ought to use that are not endowed with the gift of continency. Every person of sound judgment will join with me in acknowledging and confessing, that the whole of Paul’s doctrine on this point is comprehended in these three articles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 7, v. 38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

</figure><figure class="quote" id="q-6469a26301" data-kw="">
<blockquote><p>Position 3. The monkish conceit of the excellency of a contemplative life separated from all obligation to duties of the Second Table, above the practical life, has been the first seed of wicked Familism: the authors of both these books called Theologia Germanica and The Bright Star being professed Papists, though Mr. Randall extol both as pieces of rare price and doctrines suiting only for the perfect… Position 4. There is a twofold fulness of loveliness in Christ; one attainable in this life, the other reserved for the life to come. The full and highest pitch of the drawing loveliness of Christ, I think excludes all ordinances, Scripture, sacraments, and means we now use. Because old monks and late Familists make no heaven but in this life only (as if a monks’ coul were the very crown of eternal glory) and say the Resurrection is past; as their fathers Hymeneus and Phyletus said, and doubt of the immortality of the soul; therefore they, that they may be true to their own principles, must say that there be a number of perfect men that are above and higher than Law, duties, ordinances, teaching of men, ministry, because these are for the unperfect and unregenerate (and the monks and Familists are not such, but do already enjoy God in a fruition of glory). But the Scripture says that means, ordinances, are ever in use in this life and only excluded from the life to come, 1 Cor. 13:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), pp. 349-52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

<main class="wrap"><figure class="quote" id="q-63d7fca270" data-kw="">
<blockquote><p>23. This orthodox doctrine of the justification of sinful man before God having been asserted from the Word of God, the following errors are overthrown: … 2. Of the Pontificals: 1. Who interpret justification as justification [i.e., a making just] rather than justihabition [i.e., a holding just]; who press inherent righteousness and assail imputed righteousness as putative; who confound the righteousness of the cause and of the person, the legal and the evangelical, and weave a patchwork from both; and who thereby divide the business of justification between God and man, grace and free will. Who partition justification into a First and a Second: to the former they build up preparations and merits of congruity; to the latter they lay as foundation merits of condignity. 2. Who confound justifying faith with other species of faith; who deny that fiducial apprehension of Christ; who maintain it to be separable from charity, not only actual but also habitual; who contend that faith justifies only initially and incipiently, but good works completively. 3. Who deny either the perfection, or the stability, or the sense of justification in the justified, and heap up entire cartloads of errors in this place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-c881c89bb4" data-kw="">
<blockquote><p>XXIII. This Orthodox doctrine of the justification of sinful man before God having been asserted from the Word of God, the following errors are overthrown: … III. Of the Socinians: 1. Who overthrow justification through and on account of Christ the Mediator and His λύτρον [lutron, ransom]; who admit no redemption and satisfaction of Christ except a metaphorical one. 2. Who contend that Christ is our Saviour only on account of His prophetic and kingly office — inasmuch as He vindicated this title to Himself only by announcing salvation, confirming it, and communicating it, but not by meriting it. These and other portentous errors of this sort are both contrary to sacred Scripture and to the salutary doctrine of justification drawn and derived therefrom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</cite></span></figcaption>

d Books Online</a></div>

</figure><figure class="quote" id="q-941ab42d00" data-kw="">
<blockquote><p>Mr. Wotton in his papers which he dispersed in this city, and which he acknowledged to be his own when I [Walker] brought them to his face before Mr. Gataker and eight other grave ministers, does deny the imputation of the whole obedience of Christ, to the Law of God; both active and passive, both jointly and severally. He affirms that there is no end or use whatsoever of the imputation of Christ his righteousness for justification. He renounces the law in whole and part, performed by ourselves, or any other in our stead for our justification… he sets up faith, even the act of believing for righteousness, affirms that it is said to be imputed in a proper sense without a trope, and serves for all purposes in our justification under the Gospel, as perfect righteousness of works performed to the whole law did for man’s justification in the first covenant. He denies the punishment of our sins in Christ, and the satisfaction which in Him our head &amp; surety was made to God’s justice for purchase of our pardon… These and such like speeches I condemned for Socinian heresy and blasphemy, as Beza, Paraeus and Lubertus had done before me, and for this Mr. Gataker did deride me, when I gave in my charge against Mr. Wotton 27 years ago, and now [Gataker] blames it in me as falsehood and dishonesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A True Relation of the Chief Passages Between Mr. Anthony Wotton &amp; Mr. George Walker in the Years 1611-1615, Written by George Walker for the Vindicating of Himself from Some Imputations Laid on Him by Mr. Thomas Gataker in his Defense of Mr. Wotton (1642) 36 pp.</cite>, pp. 1-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

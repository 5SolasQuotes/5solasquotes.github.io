</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0892c62019" data-kw="">
<blockquote><p>This can be no other in general but that which we call “the covenant of grace.” And it is so called in opposition unto that of “works,” which was made with us in Adam; for these two, grace and works, do divide the ways of our relation unto God, being diametrically opposite, and every way inconsistent, Romans 11:6. Of this covenant the Lord Christ was the mediator from the foundation of the world, namely, from the giving of the first promise, Revelation 13:8; for it was given on his interposition, and all the benefits of it depended on his future actual mediation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 77</span></figcaption>

</figure><figure class="quote" id="q-2526a0690d" data-kw="">
<blockquote><p>And although the covenant of grace be stable and effectual unto all who are really partakers of it, yet as unto its external administration, and our entering into it by a visible profession, it may be broken, unto the temporal and eternal ruin of persons and whole churches.</p></blockquote>

</figure><figure class="quote" id="q-4ce0cb580a" data-kw="new cov">
<blockquote><p>The new covenant is also taken in a twofold manner either broadly, inasmuch as it stands for the covenant of grace in general made with sinners, which existed under the Old Testament as well before Christ appeared as under the New after he had been manifested; or strictly, for the covenant of grace promulgated after the manifestation of Christ in the flesh, which should continue to the end of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.8.5</span></figcaption>

</figure><figure class="quote" id="q-d06d978e9d" data-kw="">
<blockquote><p>It revived the promise of that covenant, —that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Romans 10:5; as he doth, Leviticus 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 94</span></figcaption>

</figure><figure class="quote" id="q-993c3a2447" data-kw="">
<blockquote><p>I was a hearty Revolutioner, and a great adorer of God’s goodness to these lands in sending that great man, King William, to overthrow our enemies and redeem us from slavery. Yet the aforesaid nine grievances [on pp. 232-33] stuck close with me, and stumbled me greatly; whereupon I had thoughts to go off the country. But alas, alas! before that project was ripe, I met with some, who otherwise were good men, but they had stated a separation from church and state, after the Revolution, because of the aforesaid nine grievances, to which they added many more. I at least was overcome with their arguments, joined with them, in the inadvertent simplicity of my heart, and being influenced with a zeal not altogether according to knowlege, I continued embarked in communion with them for some time, which laid a foundation for a train of many after trials to me; for I quickly found that I was out of the frying-pan into the heart of the fire: for, though Isaw great reason for these grievances on the government side, yet, amongst the dissenters, I found many grievances, some of which were intolerable unto me…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-44c82e3ab4" data-kw="">
<blockquote><p>First, then, we shall take into consideration the bounds of the power of particular [local] elderships, and how the same may be said to be independent, and how not… The first distinction is, between things which are proper and peculiar to one congregation, and things which are common to many: the former pertains to the particular eldership, the latter to the common eldership. Whence it comes that, in Scotland, the cases of ordination, suspension, deposition and excommunication, are determined in the greater presbyteries, because it does not concern one congregation alone, but many, who be taken into the common presbytery, and who be put out of the same; neither does the excommunication of a sinner concern only one congregation, but the neighboring congregations also, among whom, as it is to be commonly supposed, the sinner does often haunt and converse. Cyprian [A.D. 200-258], speaking of the admission of some who had fallen, and who had no recommendation from the martyrs [witnesses] to be received again, refers the matter to a common meeting, and his reason is, because it was a common cause, ‘and did not concern a few, nor one church only,’ see Book 2, Epistle 14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, p. 43.</span></figcaption>

</figure><figure class="quote" id="q-acd534d569" data-kw="">
<blockquote><p>For some went a great length in compliance with the defections of these times [1662-1688]; others durst not comply… ministers and people were obliged to withdraw from these courses which they were convinced in their conscience to be sinful… But this was without any design ever to own these things to be sufficient grounds of separation in a constitute Church, or when with personal safety application could be made to settled Church judicatories who were not under the tyrannical influence of enemies to the work of God… Also there are many alive to this day who know when the Informatory Vindication [1687] was to be printed, that it was sent to Holland to be showed to some of us who were then abroad; and that we declared we could never own the grounds of separation laid down therein to justify a separation from a settled Church in a peaceable state [such as after 1690]… and for this cause it is often added as a qualification to the grounds of withdrawing that they were to be understood ‘in the case of such differences and so circumstantiate[d].’ Informatory Vindication, page 67, ‘In this broken and declining sate of the Church,’ ibid., page 73, 76, 78, 80, 82, 84, 86, 87, 88. To which also the worthy martyr Mr. James Renwick, minister of the Gospel, assented.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-shields.html">Alexander Shields</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Enquiry into Church-Communion, or a Treatise against Separation from the Revolution Settlement of this National Church, as it was settled anno 1689 and 1690</cite>, ed. (1706; Edinburgh: William Gray, 1747) 154 pp. no ToC, pp. v-vi</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

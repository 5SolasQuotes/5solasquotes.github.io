<main class="wrap"><figure class="quote" id="q-84ded9faba" data-kw="">
<blockquote><p>We say, therefore, that temptation which proceeds from an external principle, if it finds nothing in us which inclines to evil or delights in it, cannot have the nature of sin. Thus the Devil could tempt Christ, and present various objects to his eyes and imagination, but he had no power in him, who lacked all vicious inclination. The case is different with our inclination and internal movements, which when the Devil moves, indeed even if they are not moved by the Devil, are nevertheless sins, as we have proved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Catholic Opposite the Papist Catholic</cite>, (1630), Question 14, ‘On Concupiscence, or the remnants of original sin in the regenerated man’, p. 13 trans. AI</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-states-of-christ/state-of-humiliation.html">State of Humiliation</a></span><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c790b4fdb0" data-kw="">
<blockquote><p>…any one who is willing… will easily perceive how… Mark has inserted this notice of the third hour, so that every one may there be led to bethink himself of an hour at which the Jews really crucified the Lord, although they sought to transfer the burden of the crime to the Romans… Thus, lest any one should leave the Jews out of account, and make the conception of so great a crime lie against those soldiers, Mark gives us here the statement, ‘And it was the third hour, and they crucified Him,’ his object being to have those Jews rather discovered to be the real crucifiers, who will be found by the careful investigator in a position making it quite possible for them to have cried out for the Lord’s crucifixion [before Pilate, Mk. 15:13-14] at the third hour, while he [the investigator] observes [via the Gospel of John] that what was done by the soldiers took place at the sixth hour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Book 3, Ch. 13, ‘Of the Hour of the Lord’s Passion…’ in The Harmony of the Gospels, pp. 416-429 in The Works of Aurelius Augustine, Bishop of Hippo, a New Translation, ed. Marcus Dods, vol. 7 (Edinburgh, 1873) | While not everything in Augustine’s treatment is satisfactory, yet one of the concluding views he offers is substantially the same as that view taken on this webpage. In section 49 Augustine states:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-states-of-christ/state-of-humiliation.html">State of Humiliation</a></span></div>

</figure><figure class="quote" id="q-0076ce0f8b" data-kw="sufferings soul wrath">
<blockquote><p>As the suffering of Christ is the principal part of the ransom paid for us by him and the special foundation of our confidence and consolation, it should also be the primary object of our faith and the theme of meditation, that with Paul we may count all things for loss but the knowledge of the crucified Jesus. Did Christ suffer only corporeal punishments for us in the body or in the soul, but only as to its lower and sensitive part? Or did he in truth also bear the spiritual and infernal punishments of sin themselves (in the superior as well as in the inferior part) properly in himself and from a sense of God’s wrath? We deny the former and affirm the latter against the papists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.14.1</span></figcaption>

</figure><figure class="quote" id="q-9bef223640" data-kw="">
<blockquote><p>A person so great, so high, so glorious, as this Jesus Christ was, should have love for us, that passes knowledge. It is common for equals to love, and for superiors to be beloved; but for the King of princes, for the Son of God, for Jesus Christ to love man thus: this is amazing, and that so much the more, for that man the object of this love, is so low, so mean, so vile, so undeserving, and so inconsiderable, as by the scriptures, everywhere he is described to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Knowledge of Christ’s Love</cite></span></figcaption>

</figure><figure class="quote" id="q-ffe185d668" data-kw="descent paradise not local hell">
<blockquote><p>Was the soul of Christ, after its separation from the body, translated to paradise immediately? Or did it descend locally to hell? The former we affirm; the latter we deny against the papists and Lutherans. The papists maintain that the soul of Christ really and by presence descended into hell and remained there just as long as his body was in the sepulchre, for the purpose of freeing the souls of the fathers of the Old Testament detained in limbo. We reject a local descent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.15.1–2</span></figcaption>

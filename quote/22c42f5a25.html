<main class="wrap"><figure class="quote" id="q-22c42f5a25" data-kw="">
<blockquote><p>All those other individuals, however, who have attempted or dared to offer a written record of the acts of the Lord or of the apostles, failed to commend themselves in their own times as men of the character which would induce the Church to yield them its confidence, and to admit their compositions to the canonical authority of the Holy Books. And this was the case not merely because they were persons who could make no rightful claim to have credit given them in their narrations, but also because in a deceitful manner they introduced into their writings certain matters which are condemned at once by the catholic and apostolic rule of faith, and by sound doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>NPNF1</cite>, The Harmony of the Gospels, bk. 1, ch. 1, p. 78, vol. 6</span></figcaption>

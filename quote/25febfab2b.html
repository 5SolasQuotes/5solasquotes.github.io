<blockquote><p>2. None of the corruptions which they falsely term, are of that high nature as to call for a personal separation, because none of them are fundamental. The least corruption that we can certainly espy, which yet is not in constitution, but in execution, we must separate from, in judgment, in affection, in practice, but to separate personally for any error not fundamental, let them teach it them to whom all errors are alike, but we may not be so dull.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two Sermons: the one A Heavenly Voice calling all God’s people out of Romish Babylon; the other An Everlasting Record of the utter ruin of Romish Amalek</cite>, (Lonodon, 1624), A Heavenly Voice, p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c657d1c5d6" data-kw="">
<blockquote><p>And concerning the bounds and limits of this forbearance, all will undeniably acknowledge that it ought not to be extended indifferently unto all persons, opinions and practises, but that these four propositions are agreeable to the truth of Christianity: … Secondly, that it is not the mind of Christ that any of his servants should profess themselves willing or obliged to bear with any person which does endeavour, and with any doctrine or practice which does tend to overthrow the faith in his name, which is delivered to the saints (Jude 3), or to destroy the life and power of godliness either in the private or publick profession of religion (Tit. 1:10-11; 2 Tim. 3:5-8; Gal. 5:7-13), or to dissolve the bonds of holy communion amongst Christian brethren (Phil. 3:2; Jud. 19; Rom. 16:17-18), or to abolish the orderly relations and obligations natural and moral, without which human societies cannot stand (1 Tim. 5:8; Mt. 15:4-6; 1 Tim. 4:3), or to put down the authority which God has set up in and over human societies for the administration of justice therein (2 Pet. 2:10; Rom. 13:1-8). … Fourthly, that in matters of greater weight, which are not merely circumstantial, but are conceived to be determined by the Word, yet so, as that it is differently understood: in this case the mind of Christ is that the rules of Christian charity and mutual edification, be inviolably observed with all long suffering and forbearance. And this course ought to be continued so long, either as there is hope to gain the advantage of loving conferences, whereby differences may be reconciled, and mistakes and scandals prevented and taken out of the way; or so long as there is cause to think that God may reveal his profitable truths to such as err not wilfully, but through weakeness of judgment and harmlessly, Phil. 3:15-16 and 2 Tim. 2:22-26.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Moderator: Endeavoring a Full Composure &amp; Quiet Settlement of those many Differences both in Doctrine &amp; Discipline, which have so long disturbed the peace and welfare of this commonwealth</cite>, … (London: Bellamy, 1652), ch. 8, pp. 57-58 Caryl was a congregationalist.</span></figcaption>

</figure><figure class="quote" id="q-9d87f1f662" data-kw="">
<blockquote><p>The student of Christian doctrine, because he strives after exactness of phrase, because he is conscious of the inadequacy of any one human formula to exhaust the truth, will be filled with sympathy for every genuine endeavour towards the embodiment of right opinion. Partial views attract and exist in virtue of the fragment of truth—be it great or small—which they include; and it is the work of the theologian to seize this no less than to detect the first spring of error. It is easier and, in one sense, it is more impressive to make a peremptory and exclusive statement, and to refuse to allow any place beside it to divergent expositions; but this show of clearness and power is dearly purchased at the cost of the ennobling conviction that the whole truth is far greater than our individual minds. He who believes that every judgement on the highest matters different from his own is simply a heresy must have a mean idea of the faith; and while the qualifications, the reserve, the lingering sympathies of the real student make him in many cases a poor controversialist, it may be said that a mere controversialist cannot be a real theologian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/b-f-westcott.html">B.F. Westcott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lessons from Work</cite>, pp. 84–85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-74e165a50d" data-kw="">
<blockquote><p>And 1st, albeit there be errors, and errors of a heinous nature among some in a Church, this is not sufficient ground of separation from that Church, nay, not though these errors should remain uncensured. For, as was noticed above, there were some in the Church of Corinth who had drunk in this gross error, “That there is no resurrection of the body;” hence the apostle asks, “How say some among you, there is no resurrection of the dead?” (1 Cor. 15:12) The interrogation plainly intimates there were some among them who denied that great and fundamental doctrine of the Christian religion; and yet this Church of Corinth was a true Church of Christ, from which it was not lawful to separate. So, in the Church of Pergamos, there were some uncensured who held the doctrine of Balaam, and the doctrine of the Nicolaitans; and yet she was a true Church of Christ, right and approven in the main. So, in the Church of Thyatira, “that wicked woman” Jezebel was tolerated without being censured, though she taught the Lord’s servants to commit heinous iniquity. So, though there should be sundry persons leavened with gross errors in the Church of Scotland at this day, this is no sufficient ground for a secession or separation from her. I own it is a sin, and I think a very heinous sin in any Church, to wink at errors, or not to censure for, and be zealous against them, especially if of a heinous nature, as are some of these wherewith some among us have been charged… … And as [John] Owen justly (Exposition, p. 174) observes, “There may be a fundamental error in a true Church for a season, where the Church errs not fundamentally,” citing for proof of this, 1 Cor. 15; 2 Tim. 2:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland, in which the Chief Things in the Testimonies of these Reverend Brethren who lately made a Secession from her are considered &amp; shown to be no Ground of Separation or Secession</cite>, An Essay on Separation: or a Vindication of the Church of Scotland, in which the Chief Things in the Testimonies of these Reverend Brethren who lately made a Secession from her are considered &amp; shown to be no Ground of Separation or Secession (1738) | ch. 3, Where some things are instanced, which, though just ground for fasting, mourning and lamentation, yet are not sufficient causes of separation from a Church of Christ</span></figcaption>

<blockquote><p>Thus we see what the visible Church is: now further concerning it, three questions are to be scanned: The first is how we may discern whether particular men and particular Churches holding errors, be found members of the catholic Church or no. For the answering of this, we must make a double distinction: one of errors, the other of persons that err. Of errors, some are destroyers of the Faith, some only weakeners of it: A destroyer is that which overturns any fundamental point of religion, which is of that nature, that if it be denied, religion itself is overturned, as the denial of the death of Christ, and the immortality of the soul, justification by works, and such like; And the sum of these fundamental points is comprised in the Creed of the Apostles and the Decalogue. A weakening error is that the holding whereof does not overturn any point in the foundation of salvation, as the error of freewill and sundry such like. This distinction is made by the Holy Ghost, who says expressly that the doctrines of repentance, and faith, and baptisms, and laying on of hands, and the resurrection, and the last Judgment, are the foundation, namely of religion: and again, that Christ is the foundation, and that other doctrines consonant to the Word are as gold and silver laid thereupon. Secondly, persons erring, are of two sorts: Some err of weakness, being carried away by others, or of simple ignorance, not yet being convicted and informed concerning the truth. Some again err of obstinacy or affected ignorance, which having been admonished and convicted, still persevere in their forged opinions. This being said, we now come to the point: If any man or Church shall hold an error of the lighter kind, he still remains a member of the Church of God, and so must be reputed of us. As when a Lutheran shall hold that images are still to be retained in the church, that there is an universal election of all men, etc.; for these and such like opinions may be maintained, the foundation of salvation unrazed. This which I say is flatly avouched by Paul. ‘If any man’ (says he): ‘build on this foundation gold, silver, precious stones, timber, hay, or stubble, his work shall be made manifest by the fire, etc. and if any man’s work burn, he shall loose, but yet he shall be safe himself.’ And therefore the hay and stubble of men’s errors that are beside the foundation, on which they are laid, do not debar them from being Christians or members of the Church. A man breaks down the windows of his house; the house stands: he breaks down the roof or the walls, the house yet stands, though deformed. He pulls up the foundation, the house itself falls and ceases to be a house. Now religion which we profess is like a house or building: and some points thereof are like windows, doors, walls, roofs, and some are the very foundation: and the former may be battered, the foundation standing. Again, if the error be directly or by necessary consequent, even in common sense against the foundation, consideration must be had whether the Church or party errs of weakness or malice: if of weakness, the party is to be esteemed as a member of the catholic Church. And thus Paul writes unto the Church of Galatia, as to a church of God, though by false teachers it had been turned away to another Gospel, and embraced the fundamental error of justification by works. But when any man or church shall hold fundamental errors in obstinacy or affected ignorance, we are not then bound to repute them any longer as churches or Christians, but as such to whom condemnation belongs, as Paul shows by the example of Jannes and Jambres. And as Jannes and Jambres, says he, withstood Moses, so do these also resist the truth, men of corrupt minds, reprobate concerning the faith. Yet withall, this caveat must euer be remembred, that we rather condemn the error than the person that errs, because God’s mercy is like a bottomless sea, whereby He works what He will and when He will in the hearts of miserable sinners. The second question is: Where at this day we may find such visible Churches as are indeed so and members of the catholic Church? And for the resolving of it, we are to go through all countries and religions in the world. And first to begin with Turks and Jews, we are not in any wise to acknowledge their assemblies for Churches, because they worship not God in Christ who is the head of the Church. As for the assemblies of Papists which have been a great part of the world, if thereby we understand companies of men holding the Pope for their head, and believing the doctrine established in the Council of Trent, in name they are called churches, but indeed they are no true or sound members of the catholic Church. For both in their doctrine and in the worship of God, they raze the very foundation of religion, which will appear by these three points: First of all they hold justification by works of grace: avouching that they are not only justified before God by the merit of Christ, but also by their own doings, which opinion flatly overturns justification by Christ… The second point is that they maintain daily, real sacrifice of the body of Christ in the Mass for the sins of the quick and dead. And this is also a fundamental heresy, for Christ’s sacrifice on the cross must either be a perfect sacrifice or no sacrifice… The third point is that they worship the images of the Trinity and of saints departed, and their breaden-god, which is as vile an abomination as ever was among the gentiles: all being directly against the true meaning of the Second Commandment, and defacing the worship of God in the very substance thereof. … As for the Churches of Germany, commonly called the Churches of the Lutherans: They are to be reputed of us as the true Churches of God. Though their Augustane Confession [1530] have not satisfied the expectation of other Reformed Churches: yet have they all the same enemies in matter of religion and do alike confess the Father, the Son, and the Holy Ghost: and of the office of the Mediator, of faith and good works, of the Word, the Church and the magistrate, are all of one judgment. They differ indeed from us in the question of the sacrament, but it is no sufficient cause to induce us to hold them as no Church: for that there is a true or real receiving of the body and blood of Christ in the Lord’s supper, we all agree; and we jointly confess that Christ is there present so far forth that He does truly feed us with his very body and blood to eternal life: and all the controversy lies in the manner of receiving; we contenting ourselves with that spiritual receiving which is by the hand of faith, they adding thereto the corporal, whereby they imagine themselves to receive Christ with the hand and mouth of the body. And though to maintain this their opinion, they be constrained to turn… Indeed the opinion of the ubiquity [everywhere-ness] of the body of Christ revives the condemned heresies of Eutyches and Nestorius, and it ouerturns by necessary consequent most of the articles of Faith: but that was private to some men, as [Johann] Brentius and others, and was not received of whole churches: and whereas the men were godly and learned, and we are uncertain with what affection, and how long they held this error, we rest ourselves in condemning it, leaving the persons to God. Again Popish transubstantiation and Lutheran consubstantiation are both against the truth of the manhood of Christ, yet with great difference: Transubstantiation is flat against an article of Faith: for if Christ’s body be made of bread, and his blood of wine (which must needs be if there be a conversion of the one into the other) then was not he conceived and born of the virgin Mary: for it cannot both be made of bakers breade and of the substance of the virgin. Againe it abolisheth the outward signe in the Lords supper, as also the analogy between the sign and the thing signified, and so overturnes the sacrament: but consubstantiation does not so, neither does it overturn the substance of any article of religion, but only a main point of philosophy; which is, that a body does occupy only one place at once. Furthermore, the Churches of Helvetia [Switzerland], and Savoy, and the free cities of France, and the Low Countries, and Scotland, are to be reverenced as the true Churches of God, as their confession makes manifest. And no less must we think of our own Churches in England and Ireland. For we hold, believe and maintain, and preach the true Faith, that is, the ancient doctrine of salvation by Christ, taught and published by the prophets and apostles, as the book of the [39] Articles of Faith agreed upon in open parliament do fully show: and withal now we are, and have been ready to testify this our faith, by venturing our lives even in the cause of religion against foreign power, and especially the Spaniard: and hereupon all the Churches in Europe give unto us the hand of fellowship. And whereas sundry among us that separate and indeed excommunicate themselves, give out that there is no Church in England, no ministers, no sacraments: their peremptory asseverations wanting sufficient ground, are but as paper-shot. They allege that our assemblies are full of grievous blots and enormities. Answer: The defects and corruptions of Churches must be distinguished: and they be either in doctrine, or manners. Again corruptions in doctrine must further be distinguished: some of them are errors indeed, but beside the foundation; and some errors directly against the foundation: and these overturn all religion, whereas the former do not. Now it cannot be showed that in our [English] Churches is taught any one error that razes the foundation, and consequently annihillates the truth of God’s Church. Indeed, there is controversy among us touching the point of ecclesiastical regiment: but mark in what manner: We all jointly agree in the substance of the regiment, confessing freely that there must be preaching of the Word, administration of the sacraments according to the institution, and the use of the power of the keys in admonitions, suspensions, excommunications: The difference between us is only touching the persons and the manner of putting this government in execution: and therfore men on both parts, though both hold not the truth in this point; yet because both hold Christ the foundation, they still remain brethren and true members of Christ. As for corruptions in manners, they make not a Church to be no Church, but a bad Church: When as the wicked scribes and Pharisees sitting in Moses’s chair taught the things which he had written, the people are commanded to hear them, and to do the things which they say, not doing the things which they do. And whereas it is said that we hold Christ in Word, and deny Him in deed; that is answered thus: denial of Christ is double: either in judgment, or in fact: Denial in judgment joined with obstinacy, makes a Christian to be no Christian; denial in fact, the judgment still remaining sound, makes not a man to be no Christian, but a bad Christian. When the Jews had crucified the Lord of life, they still remained a Church, if any upon earth: and notwithstanding this their fact, the apostles acknowledged that the covenant and promises still belonged unto them: and they never made any separation from their synagogues till such time as they had been sufficiently convicted by the apostolical ministry that Jesus Christ was the true Messiah. Thus we see where at this day we may find the true Church of God. Now I come to the third question; and that is: At what time a man may with good conscience make separation from a Church. Answer: So long as a Church makes no separation from Christ, we must make no separation from it: and when it separates from Christ, we may also separate from it; And therefore in two cases there is warrant of separation: The one is: when the worship of God is corrupt in substance. And for this we have a commandment, ‘Be not,’ says Paul: ‘unequally yoked with infidels: for what fellowship has righteousness with unrighteousness, or what communion has light with darkness, or what concord has Christ with Belial? or what part has the believer with the infidel? or what agreement has the temple of God with idols? wherefore come out from among them and separate yourselues, says the Lord.’ [Note that Paul above is only expressly speaking of the difference between believers and unbelievers, Christians and pagans.] And we have a practice of this in the Old Testament, when Jeroboam had set up idols in Israel, then the priests and Levites came to Judah and Jerusalem to serve the Lord. The second is, when the doctrine of religion is corrupt in substance: As Paul says: ‘If any man teach otherwise, and consent not to the wholesome words of our Lord Iesus Christ, and to the doctrine which is according to godliness, he is puffed up: from such separate yourselves.’ A practice of this we have in the apostle Paul, who being in Ephesus in a synagogue of the Jews, spake boldly for the space of three months, disputing and exhorting to the things which concern the Kingdom of God: but when certain men were hardened and disobeyed, speaking evil of the way God, he departed from them, and separated the disciples of Ephesus: and the like he did at Rome also. As for the corruptions that be in the manners of men that be of the Church, they are no sufficient warrant of separation, unless it be from private company, as we are admonished by the apostle Paul; and by the examples of David and Lot. By this which has been said, it appears that the practice of such as make separation from us, is very bad and schismatical, considering our Churches fail not either in the substance of doctrine, or in the substance of the true worship of God.</p></blockquote>

iment, confessing freely that there must be preaching of the Word, administration of the sacraments according to the institution, and the use of the power of the keys in admonitions, suspensions, excommunications: The difference between us is only touching the persons and the manner of putting this government in execution: and therfore men on both parts, though both hold not the truth in this point; yet because both hold Christ the foundation, they still remain brethren and true members of Christ. As for corruptions in manners, they make not a Church to be no Church, but a bad Church: When as the wicked scribes and Pharisees sitting in Moses’s chair taught the things which he had written, the people are commanded to hear them, and to do the things which they say, not doing the things which they do. And whereas it is said that we hold Christ in Word, and deny Him in deed; that is answered thus: denial of Christ is double: either in judgment, or in fact: Denial in judgment joined with obstinacy, makes a Christian to be no Christian; denial in fact, the judgment still remaining sound, makes not a man to be no Christian, but a bad Christian. When the Jews had crucified the Lord of life, they still remained a Church, if any upon earth: and notwithstanding this their fact, the apostles acknowledged that the covenant and promises still belonged unto them: and they never made any separation from their synagogues till such time as they had been sufficiently convicted by the apostolical ministry that Jesus Christ was the true Messiah. Thus we see where at this day we may find the true Church of God. Now I come to the third question; and that is: At what time a man may with good conscience make separation from a Church. Answer: So long as a Church makes no separation from Christ, we must make no separation from it: and when it separates from Christ, we may also separate from it; And therefore in two cases there is warrant of separation: The one is: when the worship of God is corrupt in substance. And for this we have a commandment, ‘Be not,’ says Paul: ‘unequally yoked with infidels: for what fellowship has righteousness with unrighteousness, or what communion has light with darkness, or what concord has Christ with Belial? or what part has the believer with the infidel? or what agreement has the temple of God with idols? wherefore come out from among them and separate yourselues, says the Lord.’ [Note that Paul above is only expressly speaking of the difference between believers and unbelievers, Christians and pagans.] And we have a practice of this in the Old Testament, when Jeroboam had set up idols in Israel, then the priests and Levites came to Judah and Jerusalem to serve the Lord. The second is, when the doctrine of religion is corrupt in substance: As Paul says: ‘If any man teach otherwise, and consent not to the wholesome words of our Lord Iesus Christ, and to the doctrine which is according to godliness, he is puffed up: from such separate yourselves.’ A practice of this we have in the apostle Paul, who being in Ephesus in a synagogue of the Jews, spake boldly for the space of three months, disputing and exhorting to the things which concern the Kingdom of God: but when certain men were hardened and disobeyed, speaking evil of the way God, he departed from them, and separated the disciples of Ephesus: and the like he did at Rome also. As for the corruptions that be in the manners of men that be of the Church, they are no sufficient warrant of separation, unless it be from private company, as we are admonished by the apostle Paul; and by the examples of David and Lot. By this which has been said, it appears that the practice of such as make separation from us, is very bad and schismatical, considering our Churches fail not either in the substance of doctrine, or in the substance of the true worship of God.”

— William Perkins, An Exposition of the Creed (1595), on the Church in A Golden Chain (Cambridge, 1600), pp. 493-98">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus+we+see+what+the+visible+Church+is%3A+now+further+concerning+it%2C+three+questions+are+to+be+scanned%3A+The+first+is+how+we+may+discern+whether+particular+men+and+particular+Churches+holding+errors%2C+be+found+members+of+the+catholic+Church+or+no.+For+the+answering+of+this%2C+we+must+make+a+double+distinction%3A+one+of+errors%2C+the+other+of+persons+that+err.+Of+errors%2C+some+are+destroyers+of+the+Faith%2C+some+only+weakeners+of+it%3A+A+destroyer+is+that+which+overturns+any+fundamental+point+of+religion%2C+which+is+of+that+nature%2C+that+if+it+be+denied%2C+religion+itself+is+overturned%2C+as+the+denial+of+the+death+of+Christ%2C+and+the+immortality+of+the+soul%2C+justification+by+works%2C+and+such+like%3B+And+the+sum+of+these+fundamental+points+is+comprised+in+the+Creed+of+the+Apostles+and+the+Decalogue.+A+weakening+error+is+that+the+holding+whereof+does+not+overturn+any+point+in+the+foundation+of+salvation%2C+as+the+error+of+freewill+and+sundry+such+like.+This+distinction+is+made+by+the+Holy+Ghost%2C+who+says+expressly+that+the+doctrines+of+repentance%2C+and+faith%2C+and+baptisms%2C+and+laying+on+of+hands%2C+and+the+resurrection%2C+and+the+last+Judgment%2C+are+the+foundation%2C+namely+of+religion%3A+and+again%2C+that+Christ+is+the+foundation%2C+and+that+other+doctrines+consonant+to+the+Word+are+as+gold+and+silver+laid+thereupon.+Secondly%2C+persons+erring%2C+are+of+two+sorts%3A+Some+err+of+weakness%2C+being+carried+away+by+others%2C+or+of+simple+ignorance%2C+not+yet+being+convicted+and+informed+concerning+the+truth.+Some+again+err+of+obstinacy+or+affected+ignorance%2C+which+having+been+admonished+and+convicted%2C+still+persevere+in+their+forged+opinions.+This+being+said%2C+we+now+come+to+the+point%3A+If+any+man+or+Church+shall+hold+an+error+of+the+lighter+kind%2C+he+still+remains+a+member+of+the+Church+of+God%2C+and+so+must+be+reputed+of+us.+As+when+a+Lutheran+shall+hold+that+images+are+still+to+be+retained+in+the+church%2C+that+there+is+an+universal+election+of+all+men%2C+etc.%3B+for+these+and+such+like+opinions+may+be+maintained%2C+the+foundation+of+salvation+unrazed.+This+which+I+say+is+flatly+avouched+by+Paul.+%E2%80%98If+any+man%E2%80%99+%28says+he%29%3A+%E2%80%98build+on+this+foundation+gold%2C+silver%2C+precious+stones%2C+timber%2C+hay%2C+or+stubble%2C+his+work+shall+be+made+manifest+by+the+fire%2C+etc.+and+if+any+man%E2%80%99s+work+burn%2C+he+shall+loose%2C+but+yet+he+shall+be+safe+himself.%E2%80%99+And+therefore+the+hay+and+stubble+of+men%E2%80%99s+errors+that+are+beside+the+foundation%2C+on+which+they+are+laid%2C+do+not+debar+them+from+being+Christians+or+members+of+the+Church.+A+man+breaks+down+the+windows+of+his+house%3B+the+house+stands%3A+he+breaks+down+the+roof+or+the+walls%2C+the+house+yet+stands%2C+though+deformed.+He+pulls+up+the+foundation%2C+the+house+itself+falls+and+ceases+to+be+a+house.+Now+religion+which+we+profess+is+like+a+house+or+building%3A+and+some+points+thereof+are+like+windows%2C+doors%2C+walls%2C+roofs%2C+and+some+are+the+very+foundation%3A+and+the+former+may+be+battered%2C+the+foundation+standing.+Again%2C+if+the+error+be+directly+or+by+necessary+consequent%2C+even+in+common+sense+against+the+foundation%2C+consideration+must+be+had+whether+the+Church+or+party+errs+of+weakness+or+malice%3A+if+of+weakness%2C+the+party+is+to+be+esteemed+as+a+member+of+the+catholic+Church.+And+thus+Paul+writes+unto+the+Church+of+Galatia%2C+as+to+a+church+of+God%2C+though+by+false+teachers+it+had+been+turned+away+to+another+Gospel%2C+and+embraced+the+fundamental+error+of+justification+by+works.+But+when+any+man+or+church+shall+hold+fundamental+errors+in+obstinacy+or+affected+ignorance%2C+we+are+not+then+bound+to+repute+them+any+longer+as+churches+or+Christians%2C+but+as+such+to+whom+condemnation+belongs%2C+as+Paul+shows+by+the+example+of+Jannes+and+Jambres.+And+as+Jannes+and+Jambres%2C+says+he%2C+withstood+Moses%2C+so+do+these+also+resist+the+truth%2C+men+of+corrupt+minds%2C+reprobate+concerning+the+faith.+Yet+withall%2C+this+caveat+must+euer+be+remembred%2C+that+we+rather+condemn+the+error+than+the+person+that+errs%2C+because+God%E2%80%99s+mercy+is+like+a+bottomless+sea%2C+whereby+He+works+what+He+will+and+when+He+will+in+the+hearts+of+miserable+sinners.+The+second+question+is%3A+Where+at+this+day+we+may+find+such+visible+Churches+as+are+indeed+so+and+members+of+the+catholic+Church%3F+And+for+the+resolving+of+it%2C+we+are+to+go+through+all+countries+and+religions+in+the+world.+And+first+to+begin+with+Turks+and+Jews%2C+we+are+not+in+any+wise+to+acknowledge+their+assemblies+for+Churches%2C+because+they+worship+not+God+in+Christ+who+is+the+head+of+the+Church.+As+for+the+assemblies+of+Papists+which+have+been+a+great+part+of+the+world%2C+if+thereby+we+understand+companies+of+men+holding+the+Pope+for+their+head%2C+and+believing+the+doctrine+established+in+the+Council+of+Trent%2C+in+name+they+are+called+churches%2C+but+indeed+they+are+no+true+or+sound+members+of+the+catholic+Church.+For+both+in+their+doctrine+and+in+the+worship+of+God%2C+they+raze+the+very+foundation+of+religion%2C+which+will+appear+by+these+three+points%3A+First+of+all+they+hold+justification+by+works+of+grace%3A+avouching+that+they+are+not+only+justified+before+God+by+the+merit+of+Christ%2C+but+also+by+their+own+doings%2C+which+opinion+flatly+overturns+justification+by+Christ%E2%80%A6+The+second+point+is+that+they+maintain+daily%2C+real+sacrifice+of+the+body+of+Christ+in+the+Mass+for+the+sins+of+the+quick+and+dead.+And+this+is+also+a+fundamental+heresy%2C+for+Christ%E2%80%99s+sacrifice+on+the+cross+must+either+be+a+perfect+sacrifice+or+no+sacrifice%E2%80%A6+The+third+point+is+that+they+worship+the+images+of+the+Trinity+and+of+saints+departed%2C+and+their+breaden-god%2C+which+is+as+vile+an+abomination+as+ever+was+among+the+gentiles%3A+all+being+directly+against+the+true+meaning+of+the+Second+Commandment%2C+and+defacing+the+worship+of+God+in+the+very+substance+thereof.+%E2%80%A6+As+for+the+Churches+of+Germany%2C+commonly+called+the+Churches+of+the+Lutherans%3A+They+are+to+be+reputed+of+us+as+the+true+Churches+of+God.+Though+their+Augustane+Confession+%5B1530%5D+have+not+satisfied+the+expectation+of+other+Reformed+Churches%3A+yet+have+they+all+the+same+enemies+in+matter+of+religion+and+do+alike+confess+the+Father%2C+the+Son%2C+and+the+Holy+Ghost%3A+and+of+the+office+of+the+Mediator%2C+of+faith+and+good+works%2C+of+the+Word%2C+the+Church+and+the+magistrate%2C+are+all+of+one+judgment.+They+differ+indeed+from+us+in+the+question+of+the+sacrament%2C+but+it+is+no+sufficient+cause+to+induce+us+to+hold+them+as+no+Church%3A+for+that+there+is+a+true+or+real+receiving+of+the+body+and+blood+of+Christ+in+the+Lord%E2%80%99s+supper%2C+we+all+agree%3B+and+we+jointly+confess+that+Christ+is+there+present+so+far+forth+that+He+does+truly+feed+us+with+his+very+body+and+blood+to+eternal+life%3A+and+all+the+controversy+lies+in+the+manner+of+receiving%3B+we+contenting+ourselves+with+that+spiritual+receiving+which+is+by+the+hand+of+faith%2C+they+adding+thereto+the+corporal%2C+whereby+they+imagine+themselves+to+receive+Christ+with+the+hand+and+mouth+of+the+body.+And+though+to+maintain+this+their+opinion%2C+they+be+constrained+to+turn%E2%80%A6+Indeed+the+opinion+of+the+ubiquity+%5Beverywhere-ness%5D+of+the+body+of+Christ+revives+the+condemned+heresies+of+Eutyches+and+Nestorius%2C+and+it+ouerturns+by+necessary+consequent+most+of+the+articles+of+Faith%3A+but+that+was+private+to+some+men%2C+as+%5BJohann%5D+Brentius+and+others%2C+and+was+not+received+of+whole+churches%3A+and+whereas+the+men+were+godly+and+learned%2C+and+we+are+uncertain+with+what+affection%2C+and+how+long+they+held+this+error%2C+we+rest+ourselves+in+condemning+it%2C+leaving+the+persons+to+God.+Again+Popish+transubstantiation+and+Lutheran+consubstantiation+are+both+against+the+truth+of+the+manhood+of+Christ%2C+yet+with+great+difference%3A+Transubstantiation+is+flat+against+an+article+of+Faith%3A+for+if+Christ%E2%80%99s+body+be+made+of+bread%2C+and+his+blood+of+wine+%28which+must+needs+be+if+there+be+a+conversion+of+the+one+into+the+other%29+then+was+not+he+conceived+and+born+of+the+virgin+Mary%3A+for+it+cannot+both+be+made+of+bakers+breade+and+of+the+substance+of+the+virgin.+Againe+it+abolisheth+the+outward+signe+in+the+Lords+supper%2C+as+also+the+analogy+between+the+sign+and+the+thing+signified%2C+and+so+overturnes+the+sacrament%3A+but+consubstantiation+does+not+so%2C+neither+does+it+overturn+the+substance+of+any+article+of+religion%2C+but+only+a+main+point+of+philosophy%3B+which+is%2C+that+a+body+does+occupy+only+one+place+at+once.+Furthermore%2C+the+Churches+of+Helvetia+%5BSwitzerland%5D%2C+and+Savoy%2C+and+the+free+cities+of+France%2C+and+the+Low+Countries%2C+and+Scotland%2C+are+to+be+reverenced+as+the+true+Churches+of+God%2C+as+their+confession+makes+manifest.+And+no+less+must+we+think+of+our+own+Churches+in+England+and+Ireland.+For+we+hold%2C+believe+and+maintain%2C+and+preach+the+true+Faith%2C+that+is%2C+the+ancient+doctrine+of+salvation+by+Christ%2C+taught+and+published+by+the+prophets+and+apostles%2C+as+the+book+of+the+%5B39%5D+Articles+of+Faith+agreed+upon+in+open+parliament+do+fully+show%3A+and+withal+now+we+are%2C+and+have+been+ready+to+testify+this+our+faith%2C+by+venturing+our+lives+even+in+the+cause+of+religion+against+foreign+power%2C+and+especially+the+Spaniard%3A+and+hereupon+all+the+Churches+in+Europe+give+unto+us+the+hand+of+fellowship.+And+whereas+sundry+among+us+that+separate+and+indeed+excommunicate+themselves%2C+give+out+that+there+is+no+Church+in+England%2C+no+ministers%2C+no+sacraments%3A+their+peremptory+asseverations+wanting+sufficient+ground%2C+are+but+as+paper-shot.+They+allege+that+our+assemblies+are+full+of+grievous+blots+and+enormities.+Answer%3A+The+defects+and+corruptions+of+Churches+must+be+distinguished%3A+and+they+be+either+in+doctrine%2C+or+manners.+Again+corruptions+in+doctrine+must+further+be+distinguished%3A+some+of+them+are+errors+indeed%2C+but+beside+the+foundation%3B+and+some+errors+directly+against+the+foundation%3A+and+these+overturn+all+religion%2C+whereas+the+former+do+not.+Now+it+cannot+be+showed+that+in+our+%5BEnglish%5D+Churches+is+taught+any+one+error+that+razes+the+foundation%2C+and+consequently+annihillates+the+truth+of+God%E2%80%99s+Church.+Indeed%2C+there+is+controversy+among+us+touching+the+point+of+ecclesiastical+regiment%3A+but+mark+in+what+manner%3A+We+all+jointly+agree+in+the+substance+of+the+regiment%2C+confessing+freely+that+there+must+be+preaching+of+the+Word%2C+administration+of+the+sacraments+according+to+the+institution%2C+and+the+use+of+the+power+of+the+keys+in+admonitions%2C+suspensions%2C+excommunications%3A+The+difference+between+us+is+only+touching+the+persons+and+the+manner+of+putting+this+government+in+execution%3A+and+therfore+men+on+both+parts%2C+though+both+hold+not+the+truth+in+this+point%3B+yet+because+both+hold+Christ+the+foundation%2C+they+still+remain+brethren+and+true+members+of+Christ.+As+for+corruptions+in+manners%2C+they+make+not+a+Church+to+be+no+Church%2C+but+a+bad+Church%3A+When+as+the+wicked+scribes+and+Pharisees+sitting+in+Moses%E2%80%99s+chair+taught+the+things+which+he+had+written%2C+the+people+are+commanded+to+hear+them%2C+and+to+do+the+things+which+they+say%2C+not+doing+the+things+which+they+do.+And+whereas+it+is+said+that+we+hold+Christ+in+Word%2C+and+deny+Him+in+deed%3B+that+is+answered+thus%3A+denial+of+Christ+is+double%3A+either+in+judgment%2C+or+in+fact%3A+Denial+in+judgment+joined+with+obstinacy%2C+makes+a+Christian+to+be+no+Christian%3B+denial+in+fact%2C+the+judgment+still+remaining+sound%2C+makes+not+a+man+to+be+no+Christian%2C+but+a+bad+Christian.+When+the+Jews+had+crucified+the+Lord+of+life%2C+they+still+remained+a+Church%2C+if+any+upon+earth%3A+and+notwithstanding+this+their+fact%2C+the+apostles+acknowledged+that+the+covenant+and+promises+still+belonged+unto+them%3A+and+they+never+made+any+separation+from+their+synagogues+till+such+time+as+they+had+been+sufficiently+convicted+by+the+apostolical+ministry+that+Jesus+Christ+was+the+true+Messiah.+Thus+we+see+where+at+this+day+we+may+find+the+true+Church+of+God.+Now+I+come+to+the+third+question%3B+and+that+is%3A+At+what+time+a+man+may+with+good+conscience+make+separation+from+a+Church.+Answer%3A+So+long+as+a+Church+makes+no+separation+from+Christ%2C+we+must+make+no+separation+from+it%3A+and+when+it+separates+from+Christ%2C+we+may+also+separate+from+it%3B+And+therefore+in+two+cases+there+is+warrant+of+separation%3A+The+one+is%3A+when+the+worship+of+God+is+corrupt+in+substance.+And+for+this+we+have+a+commandment%2C+%E2%80%98Be+not%2C%E2%80%99+says+Paul%3A+%E2%80%98unequally+yoked+with+infidels%3A+for+what+fellowship+has+righteousness+with+unrighteousness%2C+or+what+communion+has+light+with+darkness%2C+or+what+concord+has+Christ+with+Belial%3F+or+what+part+has+the+believer+with+the+infidel%3F+or+what+agreement+has+the+temple+of+God+with+idols%3F+wherefore+come+out+from+among+them+and+separate+yourselues%2C+says+the+Lord.%E2%80%99+%5BNote+that+Paul+above+is+only+expressly+speaking+of+the+difference+between+believers+and+unbelievers%2C+Christians+and+pagans.%5D+And+we+have+a+practice+of+this+in+the+Old+Testament%2C+when+Jeroboam+had+set+up+idols+in+Israel%2C+then+the+priests+and+Levites+came+to+Judah+and+Jerusalem+to+serve+the+Lord.+The+second+is%2C+when+the+doctrine+of+religion+is+corrupt+in+substance%3A+As+Paul+says%3A+%E2%80%98If+any+man+teach+otherwise%2C+and+consent+not+to+the+wholesome+words+of+our+Lord+Iesus+Christ%2C+and+to+the+doctrine+which+is+according+to+godliness%2C+he+is+puffed+up%3A+from+such+separate+yourselves.%E2%80%99+A+practice+of+this+we+have+in+the+apostle+Paul%2C+who+being+in+Ephesus+in+a+synagogue+of+the+Jews%2C+spake+boldly+for+the+space+of+three+months%2C+disputing+and+exhorting+to+the+things+which+concern+the+Kingdom+of+God%3A+but+when+certain+men+were+hardened+and+disobeyed%2C+speaking+evil+of+the+way+God%2C+he+departed+from+them%2C+and+separated+the+disciples+of+Ephesus%3A+and+the+like+he+did+at+Rome+also.+As+for+the+corruptions+that+be+in+the+manners+of+men+that+be+of+the+Church%2C+they+are+no+sufficient+warrant+of+separation%2C+unless+it+be+from+private+company%2C+as+we+are+admonished+by+the+apostle+Paul%3B+and+by+the+examples+of+David+and+Lot.+By+this+which+has+been+said%2C+it+appears+that+the+practice+of+such+as+make+separation+from+us%2C+is+very+bad+and+schismatical%2C+considering+our+Churches+fail+not+either+in+the+substance+of+doctrine%2C+or+in+the+substance+of+the+true+worship+of+God.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+An+Exposition+of+the+Creed+%281595%29%2C+on+the+Church+in+A+Golden+Chain+%28Cambridge%2C+1600%29%2C+pp.+493-98&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F66197e0d19.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/66197e0d19.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=Thus%20we%20see%20what%20the%20visible,of%20the%20true%20worship%20of%20God&amp;text=Thus%20we%20see%20what%20the%20visible%20Church%20is&amp;text=the%20substance%20of%20the%20true%20worship%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

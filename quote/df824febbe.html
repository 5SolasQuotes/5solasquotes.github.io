<blockquote><p>In some Christian circles, it is common for people to assume that an afflicted person is being punished by God for personal sin. Although God sometimes disciplines his people to promote their sanctification (Hebrews 12:11), James Ussher points out that we must be careful of such censorious thoughts. Indeed, in his discussion of the third commandment, he goes so far as to assert that such assumptions are tantamount to taking the Lord’s name in vain. Amid a list of violations of the third commandment, he writes:

Evil thoughts towards our Brethren, which are afflicted. As when we see one visited by God, either in Body, Goods, or both; we are always read to think the worse of him; viz. that God executeth these Punishments on him for his sin. When as God may do it either to exercise the Faith and Patience of the Party afflicted, as in Job; or to stir others to Compassion and Pity; or else to set forth his own Glory, as we may see verified in the Example of the blind Man in the Gospel, John 9. 2, 3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity: or, The Sum and Substance of Christian Religion</cite>, ed. Michael Nevarr (1648; Herndon VA: Solid Ground Christian Books, 2007), p. 216.</span></figcaption>

<blockquote><p>Fourthly, it may inform us, if our God be so holy and pure, then his worship also must be pure. What should a pure God do with an impure and mixed worship? He will have no plowing with an ox and an ass… Dt. 22:10-11. There is no serving Him and idols too, Josh. 24:19. He tells these idolaters, ‘Ye cannot serve the Lord, for He is an holy and a jealous God’ that can endure no co-rival in his worship. He will have all done there according to the pattern; we must set up nothing in his worship without the warrant of his Word, Mt. 28:20. Whatsoever He commands, not whatsoever men command, must we observe to do. God’s courts are courts of holiness and therefore no uncleanness must be set up there, Isa. 62:9… Fifthly, it informs us that the persons must be pure: As the worship must be pure, so must the worshippers; The God of purity must have pure servants: the fountain of holiness will have none but holy followers. It is a disgrace to an eminent holy man to have a bastard lay claim to him. Ps. 50:16, To the wicked says God, ‘What hast thou to do to declare my statutes?’ Whenever we come to worship this glorious God, we must wash our hands in innocency, Ps. 26:6, and purge our families from sin, as Jacob did his from idols before he went to Bethel, Gen. 35:1-3. The people must be sanctified and prepared before the Lord will deliver his holy Law unto them; then and not tell then does God speak, Ex. 19:14-15 compared with 20:1. He will not take a wicked man by the hand. What communion has light with darkness, purity with impurity, virtue with vice, beauty with deformity, life with death, or the chiefest good with the foulest evil? There must be always a purging of our hearts from sin before we draw nigh to God in praying, hearing, sacraments, etc. else the Lord will abhor both us and our duties, and will answer us according to our idols, Eze. 14:3-4. Under the Law, if any man came to offer a sacrifice with his uncleanness on him, he must be cut off; there must be washing and cleansing before he came; so in all our approaches to God in duty there must be not only a habitual, but also an actual fitting and preparing of ourselves for the work. Therefore when James (4:8) had commanded us to draw nigh to God, he presently adds, ‘Cleanse your hands ye sinners, and purify your hearts.’ Our hearts are not fit to serve the living God till they be purged from dead works, Heb. 9:14; God will not vouchsafe to reason with us, nor to have any communion with us, till we have first washed ourselves and made us clean; Isa. 1:16-18, ‘Then come let us reason together.’ The Lord will be worshipped in the beauty of holiness or not at all, Ps. 96:9, there is no pleasing Him without it, and none that ever had it in truth but pleased him.</p></blockquote>

<blockquote><p>I shall address my self to honest, well-meaning Householders, who make conscience of serving God with their Families. You may look on this as your privilege, as well as duty; I hope you do. David thought it a great mercy that he and his People had any thing to offer, and any hopes of entertainment: Oh what an honour is it that the King of Heaven gives you any admittance into his Presence-Chamber with your Families twice a day! to confess your sins, beg pardon, supplies of mercy; to give him the glory of his Goodness, to lay your Load on him, and get ease; I hope you will never be unwilling to it, or weary of it, God forbid you should: You are not weary of Mealtimes, if you be healthful; know and keep these appointed times of coming to God.

If you promise to meet a Person of Quality at such an hour, when the Clock strikes, you rush up, crave pardon, and tell the company, one tarries for you, you must be gone: Oh make not more bold with God than you would do with Men; and keep your hearts continually in a frame for duty: Rambling in the day indisposeth your spirits for duty at night: So act, as to think you must go to an heart-searching God before you sleep; and so pray, as if it were the last time you should approach to God with your Family in this World: Study the frame of your hearts; be not content with lip-labour: Rest not in the work done, without communion with God: Presume not upon your own goodness, you that are the holiest: Despair not because of your wickedness, or guiltiness, you that think your selves the worst of men: Remember, Manasseh prayed, and God was intreated of him, when he humbled himself greatly.

Be not discouraged because you cannot do so well as others: God despiseth not the day of small things: God hath babes in his Family, that chatter like a Crane or Swallow. A Child’s lisping is understood by an indulgent Father: And if a distempered Child stoop down, and reach us up any small thing, we take it kindly; so doth God when a sick Soul falls low in Humility, and reacheth high in Heavenly-mindedness. You cannot be always actually on your knees, or speaking with your tongues, but still maintain a praying-frame of heart.

Mr. [Richard] Greenham saith, When one asks how your Family doth, let this put you in mind to pray for them; thank God for mercies; reflect on your selves, What have I done for their welfare? how are the Souls of my Children, Servants? and lift up an Ejaculation for them: Be much in Prayer: Give your selves to Prayer: Prayer is your Physic, your Armoury, Ammunition, your Antidote against Satan, World, Flesh: This is your way of Trading with God for the richest Commodities for your selves and yours; the profit will be yours, the glory God’s.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c9f119d8c4" data-kw="">
<blockquote><p>The form of sound words” spoken of by Paul (2 Tim. 1:13) is not an external form of locution, so bound down to the words of Scripture that it would unlawful to use even a syllable or word not found in Scripture. Otherwise sermons and comments on Scripture would be all wrong. Rather it denotes that method of teaching which does not depart from the intention of Scripture and the analogy of faith, and which rejoices not in the swelling arrogance of empty eloquence, but in the religious simplicity of true wisdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of elenctic theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Phillipsburg, 1992), i, 259.</span></figcaption>

</figure><figure class="quote" id="q-4b238971e4" data-kw="">
<blockquote><p>Among the Hebrews, as indeed in most nations, particular faculties were connected with particular parts of the body; and we read of ‘bowels’ the seat of sympathy; of the ‘reins’ the seat of deep and anxious thought; and of the ‘heart’ the seat of all inward reflection.

And here we think it of some importance to call attention to the circumstance that the Scriptures do not distinguish, as we do, the heart from the head; and do not make the heart signify mere emotion, but use it to include all that passes through the mind prior to action; and we read of the ‘imaginations’ and of the ‘thoughts’ of man’s heart,—hence the absurdity of arguing that faith consists in feeling, from the fact that we are said to believe with the heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-mccosh.html">James McCosh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introduction to, The Complete Works of Stephen Charnock, B.D.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-4fb8525187" data-kw="">
<blockquote><p>In this verse Paul explains the difference between the true gospel and one that has been corrupted. The true gospel is unchanging, because it does not allow for any variation. Where there is variation, change, diminution, mixture or subtraction it ceases to be the true gospel and becomes false and corrupted. This is the reason why there are so many false religions in the world—Judaism, paganism, Islam and false Christianity. It also explains why the Christian religion, which is unique and unchanging, threatens all the others and is objected to by the entire world. …

Note the cleverness of Satan who begins by unsettling those whom he wants to deceive. First, he upsets them by calling the grace of God into question, and then he comforts them by persuading them that they will be saved if they follow the traditions of the popes and buy their indulgences. In the same way he started by upsetting the Galatians who had found peace of mind thanks to their ministers, and then he promised them peace again if they let themselves be transferred to another gospel and recognize and accept the need for circumcision and observance of the law. …

After condemning the work of the false apostles, Paul goes on to talk about their zeal and intentions. He does not say that they pervert the gospel of Christ but that they want to pervert it. They wanted to do that, but they could not achieve their desire. …

What were they doing? Were they denying the historical facts about Christ—his birth, miracles, crucifixion, death, burial, resurrection and exaltation to the right hand of the Father in heaven? Not at all! What they were saying is that unless you are circumcised and keep the law of Moses, you cannot be saved. Their intention was not to destroy Christianity but to add Judaism to it, and this was a brilliant example of how that strategy worked.

Even so, the apostle did not hesitate to say that they wanted to pervert the gospel of Christ. To add something to that gospel and make it a necessary article of faith is to pervert it, not to embellish it. The false apostles accepted the historical facts about Jesus but denied the sufficiency of the grace that he offered. The grace and power of the gospel of Christ for salvation is meant for every believer, both Jew and Greek. To add to it is to detract from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Apostoli Pauli ad Galatas et Ephesios Commentarii</cite>, (Basel, 1561). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), pp 26-27.</span></figcaption>

</figure><figure class="quote" id="q-941cd4088a" data-kw="">
<blockquote><p>To use a mean in an act of worship which God has neither by the light of nature directed, nor in his Word prescribed (no natural necessity compelling us so to do) is sinful: But for us, or any of us to whom God has given the gift of prayer, ordinarily in prayer to perform our ministerial acts by the prescribed forms of others read or recited, were for us (no natural necessity compelling) in acts of worship to use means neither of God directed by the light of nature, nor by Him in his Word prescribed; Therefore.</p></blockquote>

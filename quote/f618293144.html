<main class="wrap"><figure class="quote" id="q-f618293144" data-kw="">
<blockquote><p>That as the way to kill sin, and so to live was by circumcision into Christ in the old Testament. Colos. 2.11. insomuch that he that should wilfully neglect outward circumcision for himself or his child that might have it, should be cut off, Gen. 17. So baptizing into Christ is the way to bury sin, and so to live. v. 12. of this 2 Colos. insomuch that he that shall wilfully neglect baptism with water, the seal of regeneration who may have it: shall not enter heaven. Joh. 3.5. A soul may be saved without the use of a seal in some case, but in no case can be saved in the contempt of a seal.

I am not ignorant that some do understand this, Joh. 3.5. of the spirit only compared to water, but who doth not know that (as [Henry] Bullinger saith, Omnes penè de baptismo interpretantur) all almost interpret it of the water of baptism, Bullinger himself consenting with them, only he would not have the efficacy of the Spirit, to be transferred to the sign. And sure whiles Christ was instructing Nicodemus of regeneration, he would not be silent touching the seal of it, baptism.

Nor can we so well parallel this phrase with Matth. 3. Baptising with the holy Ghost and with fire; where only the Spirit must be meant, because there is no other baptism of fire. But there is a baptism, with water, beside baptism with the Spirit. And therefore water must signify baptism. For it were harsh to run to a metaphor without need, and to understand by water the Spirit, which in relation to the efficacy of baptism is usually called fire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-holmes.html">Nathanael Holmes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A vindication of baptizing believers infants: In some animadversions upon Mr. Tombes his Exercitations about infant baptism; as also upon his Examen, as touching the antiquities and authors by him alleged or contradicted that concern the same. Humbly submitted to the judgement of all candid Christia</cite>, (London: M. Simmons, 1646), pp 29-30.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

<blockquote><p>XVIII. The cause of infant baptism is not the actual faith of infants, of which they are no more capable than of that instruction by which the disciples of Christ are taught (Mt. 28:19). But it is both the universal command to baptize all the members of the church and the promise of the covenant made to parents and to their children equally (Acts 2:38, 39; Gen. 17*:7). The same thing must be said of the faith of covenanted infants as of their reason. Each is in them in the first act, not in the second; in the sowing, not in the harvest; in the root, not in the fruit; in the internal power of the Spirit, not in the external demonstration of work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 19.20.18 (p.419).</span></figcaption>

</figure><figure class="quote" id="q-105ec53399" data-kw="">
<blockquote><p>Every faithful Christian who has been baptized may have this benefit from baptism as long as he lives: that as by his engrafting into Christ he is one with Him and therefore sees that while Christ lives he must and will live also, so thus having perpetual union and fellowship with Christ, the believer draws strength from the vine, so that he may live the Christian life.

If Christ then has the power of renewing him – which is signified and sealed by baptism (namely, the power of Christ’s death mortifying sin and the virtue of His resurrection in raising him up to a new life) – is not baptism throughout his life, as often as he seriously considers it, a powerful means to help him forward in a Christian life?</p></blockquote>

</figure><figure class="quote" id="q-2b30abdfa1" data-kw="efficacy moral">
<blockquote><p>The opinion of the orthodox is far different. First, they admit no blotting out of sin in baptism, springing ex opere operato or from a virtue inherent in it (as was proved before when we considered the efficacy of the sacraments). Second, they say that the efficacy of baptism (taken oppositely for the element and its dispensation) is moral, as has already been set forth; but the efficacy of baptism considered compositely for the sign and thing signified is real with respect to the one receiving it, although it is not restricted to the moment of baptism. Third, they acknowledge in baptism the testification and sealing of the twofold grace promised in the gospel; both of justification (by which sin is taken away as to its guilt so that it is not imputed) and of sanctification (by which its pollution is lessened and corrected that it may no more rule in us in this life; not however that it is not absolutely or exists in us anymore). The grace of justification pardons all our sins: original, actual, past, present and future.</p></blockquote>

<blockquote><p>Q. 293 Then are infants rightly baptized since they have not yet been given faith?

A. Yes. For in adults faith and its confession are required before baptism because they cannot be included in the covenant of grace in any other way. But for infants it is enough to be sanctified by the Spirit of Christ in proportion to their age.

Q. 294 But why is it necessary that they be baptized?

A. First, because God requires that whomever he embraces in his covenant be marked with baptism. And the children of believers are and remain members of the covenant of grace if they do not exclude themselves from it by their unbelief when they get older. For God affirms that he will be their God also and Christ affirms that the kingdom of heaven is theirs. Second, because baptism replaces circumcision; therefore, since infants were circumcised in the Old Testament, and since the grace of God was not restricted by the coming of Christ but was poured out more fully, they also ought to be baptized now.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae:</cite>, Large Catechism (1561), trans. Fred H. Klooster and John Medendrop:</span></figcaption>

<blockquote><p>…it may be said of Christ whilst He was here below that in the same sense or manner wherein He bore our sicknesses, Mt. 8:17 (who yet was never personally tainted with any disease) in the same sense or manner He may be said to have born our sins, namely thus: Christ when He came to an elect child of his that was sick, whom He healed, his manner was, first by a sympathy and pity to afflict Himself with their sickness, as if it had been his own: Thus at his raising of Lazarus it is said that He groaned in spirit, etc. and so by the merit of taking the disease upon Himself, through a fellow-feeling of it, He took it off from them, being for them afflicted, as if He Himself had been sick. And this seems to be the best interpretation that I have met with of that difficult place in Mt. 8:16-17 where it is said: ‘He healed all that were sick, that it might be fulfilled which was spoken by Isaiah the prophet, saying, Himself took our infirmities, [and bare our sicknesses.]’ Now in the like way or manner unto this, of bearing our sicknesses, He might beare our sins too…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Heart of Christ in Heaven to Sinners on Earth</cite>, section 3, p. 136</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

el="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It traces the central contours of the Christological debates, from the discussion between Luther and Zwingli in the 1520s to the Colloquy of Montbeliard in 1586… Cross shows that Luther’s Christology is thoroughly Medieval, and that innovations usually associated with Luther-in particular, that Christ’s human nature comes to share in divine attributes-should be ascribed instead to his younger contemporary Johannes Brenz. The discussion is highly sensitive to the differences between the various Luther groups-followers of Brenz, and the different factions aligned in varying ways with Melanchthon-and to the differences between all of these and the Reformed theologians. By locating the Christological discussions in their immediate Medieval background, Cross also provides a comprehensive account of the continuities and discontinuities between the two eras. In these ways, it is shown that the standard interpretations of the Reformation debates on the matter are almost wholly mistaken.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cross.html">Richard Cross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Communicatio Idiomatum: Reformation Christological Debates in Changing Paradigms in Historical &amp; Systematic Theology</cite></span></figcaption>

— Anthony Burgess, The True Doctrine of Justification… (London: Underhill, 1654), pt. 2, sect. 5 | sermon 33, ‘Whether Christ while on earth did truly and properly obey the will of God’ on Rom., 5:19">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CProposition+1%3A+That+Christ+while+on+the+earth%2C+did+truly+and+properly+obey+the+will+of+God.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+True+Doctrine+of+Justification%E2%80%A6+%28London%3A+Underhill%2C+1654%29%2C+pt.+2%2C+sect.+5+%7C+sermon+33%2C+%E2%80%98Whether+Christ+while+on+earth+did+truly+and+properly+obey+the+will+of+God%E2%80%99+on+Rom.%2C+5%3A19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5086665be6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5086665be6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christ/the-human-and-divine-natures-of-christ/on-the-human-nature-of-christ/#:~:text=Proposition%201%3A%20That%20Christ%20while%20on,properly%20obey%20the%20will%20of%20God&amp;text=Proposition%201%3A%20That%20Christ%20while%20on%20the%20earth&amp;text=truly%20and%20properly%20obey%20the%20will%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d6ff100697" data-kw="">
<blockquote><p>As the soul of Christ was separated from his body for the space of three days, was the Godhead likewise separated from them both, or was the Godhead joined with the soul, and severed from the body? Neyther, says [John] Damascenus (Of the Orthodox Faith): For the Godhead remained unseparable from both, and that which the Word once took upon, Him never afterwards left. But how could it be that the divine nature should continue united to the soul which was in Paradise, and the body which was in the earth? The divine nature of the Son, because it is both infinite and present in all places, remained whole and undivided, united to both together, that is as well to the soul of Christ which was in Paradise, as to the body which lay lifeless in the earth. For seeing the nature of God is most simple, and so not to be parted or divided, God is not to be said to have one part in heaven, and another in earth, but He is whole in heaven and whole in earth, not at several times and by succession, but both together, which thing no created nature can do. Hence comes the saying of Augustine: It is proper to the whole Trinity to be whole everywhere, in spaces of places not divided. Whether was Christ being now dead, true man? He was, for although the soul and body were separated, and so it was a true death, yet by the conjunction of personal union they remained together in one third, as it were, so that our life was truly hid in Christ, yea even when He was dead. Others answer that Christ in that three days was man materially, because He was truly soul and body: but at his resurrection (they say) he was man formally, after his soul rerurned into his body. Who therefore died, and what he the the adiuncts of his death? The son of God, at the mention of whom the whole frame and nature of things in this world trembled… But when the Lord died…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, … (London, 1606), Common Place 23, ‘Of the Passion &amp; Death of Christ’, pp. 233-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

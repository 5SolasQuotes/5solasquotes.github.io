<main class="wrap"><figure class="quote" id="q-a0464e0f5f" data-kw="">
<blockquote><p>…an assumption, made explicit already in the Enneads of Plotinus [d. 270], that truth, beauty and goodness are attributes of the deity, ways in which the divine unity makes itself known to the human soul. That theological vision was edited for Christian use by St Thomas Aquinas, and embedded in the subtle and comprehensive reasoning for which that philosopher is justly famous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roger-scruton.html">Roger Scruton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beauty: a Very Short Introduction Pre</cite>, (Oxford University Press, 2011), p. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c7993e6b31" data-kw="">
<blockquote><p>Beauty and goodness in a thing are identical fundamentally; for they are based upon the same thing, namely, the form; and consequently goodness is praised as beauty. But they differ logically, for goodness properly relates to the appetite (goodness being what all things desire); and therefore it has the aspect of an end (the appetite being a kind of movement towards a thing). On the other hand, beauty relates to the cognitive faculty; for beautiful things are those which please when seen. Hence beauty consists in due proportion; for the senses delight in things duly proportioned, as in what is after their own kind—because even sense is a sort of reason, just as is every cognitive faculty. Now since knowledge is by assimilation, and similarity relates to form, beauty properly belongs to the nature of a formal cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1, q. 5, art. 4, reply to obj. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-fbaca9017f" data-kw="">
<blockquote><p>But I answer, the place 2 Cor. 2:10 is controverted, and we doubt not, but [that it is] of that same nature with the power of excommunicating, 1 Cor. 5:4. But for private forgiving, it is not the Church-forgiving here meant, because:

1. The private forgiving is a duty of charity commanded in the Law of Nature to all, even out[side] of [a] Church-state, and obliges the excommunicate[d], who, though they be cast out of the Church, are not exempted from the Law that binds all, Mt. 6:12,14-15; Mt. 5:44-45, but the Church-forgiving is an act of obedience to a positive Church-Law of Christ.

2. Private Christians are to forgive their enemies whether they repent or not, even as Christ forgave those who crucified Him, Col. 3:13; Lk. 23:34; and when the party repents not, this forgiveness is not ratified in Heaven, yet are we obliged to forgive and to commit vengeance to God; But the authoritative forgiving is a thing that the Church is not obliged unto, absolutely; nor may they, or can they forgive, except the offender repent: and if they see that he repents not, they cannot lawfully forgive; but, being in God’s room, must take vengeance on all disobedience, and their retaining of sin and forgiving is valid in Heaven, because they are in God’s place. Now any forgiving or retaining of sin but these two, together with God’s forgiving and retaining, we know not. But Peter’s forgiving his offending brother seventy times seven times, is common to all private Christians, even out[side] of [a] Church-state…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1642), pt. 1, ch. 1, section 1, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

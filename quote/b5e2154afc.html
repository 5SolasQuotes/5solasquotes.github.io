<main class="wrap"><figure class="quote" id="q-b5e2154afc" data-kw="">
<blockquote><p>rather than basing possibility and impossibility on repugnance and non-repugnance to being as such, Bradwardine based it on repugnance and non-repugnance to necessary being… while Bradwardine thought that God was the ontological source of necessity, possibility and impossibility, he did not think that God freely decided the modal status of propositions.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0fece944ba" data-kw="">
<blockquote><p>potentia absoluta: absolute power; the omnipotence of God limited only be the law of noncontradiction. According to his potentia absoluta, God can effect all possibility, constrained only by his own nature. Things which are by nature evil and either impossible or noncompossible things (like square circles) fall outside of the realm of God’s power. The term emphasizes the transcendence and omnipotence of God by setting God even above and beyond the laws he has ordained for the operation of his universe…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, (Baker, 1985), p. 231</span></figcaption>

</figure><figure class="quote" id="q-8fb05937d5" data-kw="Wisdom">
<blockquote><p>Who can trace the motions of God&#x27;s eyes in their race? &#x27;He makes the clouds his chariot,&#x27; Ps. 104:3, in his motions about the earth, and his throne is in the dark. He walks upon the wings of the wind, his providential speed makes it too quick for our understanding. His ways are mysterious, and put the reason and wisdom of men to a stand. The clearest-sighted servants of God do not see the bottom of his works, the motion of God&#x27;s eyes is too quick for ours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on 2 Chron. 16:9, Doct. 1, Prop. 2</span></figcaption>

</figure><figure class="quote" id="q-940c6385f9" data-kw="Affliction Wisdom">
<blockquote><p>It is the discipline of wisdom. He who administers it is the &quot;God only wise.&quot; What deep wisdom then must there be in all His dealings! He knows exactly what we need and how to supply it. He knows what evils are to be found in us, and how these may be best removed. His training is no random work. It is carried on with exquisite skill. The time and the way and the instrument are all according to the perfect wisdom of God. The fittest time is chosen, just the very moment when discipline is called for, and when it would be most profitable. The surest, most direct, and at the same time gentlest method is devised. The instrument which will be surest yet safest, most effectual yet least painful, is brought into operation. For all is wisdom in the discipline of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Night of Weeping</cite>, ch. IV, “The Family Discipline,”</span></figcaption>

</figure><figure class="quote" id="q-ff0bb50d01" data-kw="">
<blockquote><p>Furthermore, one ought to know that the Arminians have fabricated a third category in the divine knowledge; they call this knowledge middle or conditioned knowledge according to which God knows a certain event He has never decreed. But this is absurd. Because nothing happens what God did not decree, Thr 3,37 [Lam. 3:37].</p></blockquote>

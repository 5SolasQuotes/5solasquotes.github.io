<main class="wrap"><figure class="quote" id="q-a5f228bd85" data-kw="">
<blockquote><p>That truth is, that Christ is the King of kings, as well as the Head of the Church. He claims authority in the kingdoms of men, as well as among his own peculiar people. The Civil Magistrate, then, as the servant of Christ, has something to do with the Church. It is not merely his duty to associate himself with it as a member, and to subject himself to its discipline, but to defend and uphold it by the gifts of power and influence which have been conferred upon him. It is his duty further, to take order that all things in the Church be done according to the Word of God. …

It is not theirs to bear the ark. God hath appointed others to that office. But it is theirs, by the exercise of their constitutional functions, to prevent the ark from being touched by unhallowed hands. It is theirs to receive the testimony of Scripture, to bow themselves to its dictates, and to take order that they be obeyed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Scriptural Argument Against Patronage</cite>, (Edinburgh: John Johnstone, 1842), p. 36.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c5132bea7" data-kw="">
<blockquote><p>In times of public calamity, as a general rule we should stand in our lot, and do and suffer the Lord’s will there. We may indeed flee from pestilence, if we neglect no duty in so doing. This may sometimes be done, especially where a whole community may retire to a healthy spot. Where this cannot be done, let physicians, ministers of the Gospel, public officers and those who may be useful as nurses stand their ground, and commit their case to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-swan-plumer.html">William Swan Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 91</span></figcaption>

</figure><figure class="quote" id="q-aaf054541a" data-kw="">
<blockquote><p>To shew that this kind of Government doth not entrench upon the authority of the civil Magistrate, let the difference betwixt them be well observed, and that in these three particulars.

1. Civil Magistrates command in their own name, or in the name of a superior civil Magistrate, thus, I charge you in the name of the King. But Church-Governors, in the name of Christ.

2. Civil Magistrates require obedience to themselves, Church-Governors, to Christ.

3. Civil Magistrates press on their subjects their own Laws, as Statutes and Ordinances made by themselves. Church-Governors, the Ordinances of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The progress of divine providence, set out in a sermon preached in the Abbey Church of Westminster before the House of Peers, on the 24th of September, 1645. being the day of their monthly fast</cite>, (London: Joshua Kirton, 1645), pp 25-26.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

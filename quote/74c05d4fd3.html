<main class="wrap"><figure class="quote" id="q-74c05d4fd3" data-kw="">
<blockquote><p>For as at the bar of an earthly judge, the malefactor is brought out of prison and set before the judge, and there examined: even so in that great day shall every man without exception be brought before the Lord to be tried. But how shall this trial be made? Answer: By works, as the apostle says: ‘We must all appear before the judgment seat of Christ, that every man may receive the things which are done in his body according to that He has done, whether it be good or evil.’ (2 Cor. 5:10) And the reason is, because works are the outward signs of inward grace and godliness. And though we be justified by faith alone without works, yet may we be judged both by faith and works. For the Last Judgment does not serve to make men just that are not, but only to manifest them to be just indeed, which were just before and in this life truly justified. The consideration of this very point should move us all to repent us of our sins past and to reform ourselves throughout, and to be plentiful in all good works. And undoubtedly if we seriously think upon it, it will hold us more straightly to all good duties than if with the Papists we held justification by works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles</cite>, … (Cambridge: Legatt, 1595), p. 385</span></figcaption>

<blockquote><p>IV. The efficient cause of the Resurrection in common is the whole Holy Trinity; but singularly, Christ the Lord. Christ is its efficient cause in three ways: I. As God. II. As Judge of the World. III. As Mediator. In the first two ways he is the efficient cause of the resurrection of the reprobate as well as of the elect; in the third way he is the cause of the Resurrection of the faithful by merit, efficacy and beginning.</p></blockquote>

</figure><figure class="quote" id="q-c41807d627" data-kw="">
<blockquote><p>The resurrection of souls pertains to merit, which is the effect of justification; but the resurrection of bodies is ordained for punishment or reward, which are the effects of Him who judges. Now it belongs to Christ, not to justify all men, but to judge them: and therefore He raises up all as to their bodies, but not as to their souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, III, q. 56, a. 2, ad 3</span></figcaption>

</figure><figure class="quote" id="q-8872bfd394" data-kw="">
<blockquote><p>Although pardon of sin be compleated at that great day, yet this is not to be understood, as if Gods pardon of any sin were imperfect, and something of sinne did still remain to be done away. No, those expressions of forgivenes of sin in the Scripture, denote such a full and plenary pardon, that a sin cannot be more remitted then it is. But because we commit new sinnes daily, and so need pardon daily, Therefore it is that we are not compleatly pardoned till then. As also because the perfect pardon we have here, shall then solemnly and publikely be declared to all the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, London, 1651, Lecture 29, pp. 258–259</span></figcaption>

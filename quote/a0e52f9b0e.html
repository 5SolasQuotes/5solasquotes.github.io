<main class="wrap"><figure class="quote" id="q-a0e52f9b0e" data-kw="">
<blockquote><p>‘Yea, but’ (say they) ‘our ceremonies are typical and Jewish ceremonies, which hurt our worship.’ They mean (as I conceive) they are teaching ceremonies, not ceremonies of mere order, but significant, to put us in mind of duty. I am sorry that this should be accounted a fault. If they did not signify, how could they edify? (1 Cor. 14:26) Were they types and shadows of the mysteries of the Gospel invented by men, indeed Christ were ill-advised not to ordain them. But being only moral documents and monitors of some duties, I wonder where their guilt lies. If I had an hundred boxes in my house for my uses, and some few of them had a mark upon them to direct me where my money lay, that I might be careful of that, does this savor of want of natural wisdom? So neither does it taste of want of spiritual wisdom to set a mark upon some few ceremonies, to put me in mind of my duty to Christ. ‘What are these’ (say they) ‘but images set up to ourselves for religious use?’ What? to worship? to adore God in or by? No, but to remind us of what we ought to do. And this was the practice of the Church in all ages: Abraham put his servant’s hand under his thigh in swearing, surely to signify his subjection to him in that business about the promised seed (Gen. 24:2). Moses set up an altar when Amalek was overthrown and called it Jehovah-Nissi, to signify that the Lord was their banner (Ex. 17:15). The two tribes and a half built an altar, not to distinguish their borders, but to signify that they were God’s people and that they had all one God, to whom they and their posterity must sacrifice upon his own altar (Josh. 22:24–35). Samuel set up a stone when the Philistines were discomfited and called it Eben-Ezer, to signify that the Lord helped them (1 Sam. 7:12). When Christ the truth was come, he used human significant ceremonies, as the feast of dedication (John 10:22), sitting at the Passover—a sign of rest (Matt. 26:20)—the water pots of the Jewish purifications (John 2:6), the custom of embalming (John 19:39–40), besides other formalities of the synagogue. (Lk. 4:17-20) The Corinthians had the women’s veil in the congregation, to signify subjection (1 Cor. 11:5–6), and the kiss of peace to signify love (Rom. 16:20; 2 Pet. 2:11). Other Christians had agapae [love-feasts] at the sacrament (Jude), in the room whereof the Christians’ offertory was brought in for pious uses, to signify that love they should have one to another. So we have standing at the Belief [Apostles’ Creed], to signify that it is not a prayer and that we are ready to confess our faith; kneeling at the commandments, to signify the honor we have to that God that gave it, and that we must be ready to dart up prayer for our obedience; and kneeling at the sacrament, to signify an humble acknowledgment of God’s love for so great a benefit. And do we and all these saints before us set up images to ourselves in these ceremonies for religious use? God forbid. The practice of these saints, when the laws of God were purely taught and kept, teaches us that though we may not set up an image to worship God by or in, yet may we set up some edifying signs to put us in mind of those duties we owe to God (1 Cor. 14): The patriarchs may build altars, give their children proper names to be admonishing signs of their duties to God; and we may set all our senses on work that way. We may set up a post in a dark and dangerous passage, that when I go that way and touch it, it may signify my danger, and I may avoid it. I may set a watchman in a tower to give a sound when the enemy comes, that he may signify my enemy’s approach, and I may avoid him. I may set up a sea mark to signify a rock near, that I split not upon it. And may not we be as wise for our souls as for our bodies? God forbid. I am sure He has nowhere forbidden it. Therefore it is not against Christ. If it be not against Him, it is for Him, says our Savior (Mk. 9:40).</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9aec2c78b0" data-kw="">
<blockquote><p>[Col. 2] verse. 17, What should we do with the shadow, when we have the body? another, verse 20, Why should we be subject to human ordinances, since through Christ we are dead to them, and have nothing ado with them?… …whereas it might bee thought, that the apostle does not condemn all holy-days, because both he permits others to observe days, Rom. 14:5, and he himself also did observe one of the Jewish feasts, Acts 18:21. It is easily answered that our holy-days have no warrant from these places… …that which the apostle either said or did hereanent, is to be expounded and understood of bearing with the weak Jews, whom he permitted to esteeme one day above another, and for whose cause he did in his own practice, thus far apply himself to their infirmity at [???] time, when they could not possibly be as yet fully and throughly instructed concerning Christian liberty and the abrogation of the Ceremonial Law, because the Gospel was as yet not fully propagated: and when the Mosaical rites were like a dead man not yet buried, as Augustine’s simile runs. So that all this can make nothing for holy-days after the full promulgation of the Gospel, and after that the Jewish ceremonies are not only dead, but also buried, and so deadly to be used by us. Hence it is, that the apostle will not bear with the observation days in Christian Churches, who have known God as he speaks.</p></blockquote>

<blockquote><p>Let God be ‘praised in the dance with timbrel and harp,’ according to the usage of the Old-Testament church very early (Ex. 15:20), where we find God praised with timbrels and dances. Those who from this urge the use of [instrumental] music in religious worship must by the same rule introduce dancing, for they went together, as in David’s dancing before the ark, and Judg. 21:21. But, whereas many scriptures in the New Testament keep up singing as a gospel-ordinance, none provide for the keeping up of [instrumental] music and dancing; the gospel-canon for psalmody is to sing with the spirit and with the understanding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 149, verse 4</span></figcaption>

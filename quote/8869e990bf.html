<main class="wrap"><figure class="quote" id="q-8869e990bf" data-kw="sending economy not inequality">
<blockquote><p>The fact that the Son and the Holy Spirit are said to be sent does not detract from the equality of the persons. It is not necessary for the one who is sent to be lesser. This sending is not by command but by the dispensation of divine counsel. Similarly, when the Father is said to be greater than the Son (John 14:28), it pertains to the economy of the Mediator&#x27;s office, not to the inequality of nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XXIX</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-afb69e3e82" data-kw="Father begets Son eternal">
<blockquote><p>That the Father begets the Son, and the Son is begotten, can both be said in a sound sense: the former with respect to generation considered in itself because the works of the Trinity inwards (such as to beget and to be begotten) are eternal and unceasing. Otherwise, if personal acts had an end, they would also have a beginning, and all mutation in God could not be denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.29.7</span></figcaption>

</figure><figure class="quote" id="q-3feb3b91bf" data-kw="autotheos aseity Son">
<blockquote><p>Although the Son is from the Father, nevertheless he may be called God-of-himself (autotheos), not with respect to his person, but essence; not relatively as Son (for thus he is from the Father), but absolutely as God inasmuch as he has the divine essence existing from itself and not divided or produced from another essence (but not as having that essence from himself). So the Son is God from himself although not the Son from himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.28.40</span></figcaption>

</figure><figure class="quote" id="q-1d7c82d25b" data-kw="eternal generation order">
<blockquote><p>This generation was made without time (achronōs); not in time, but from eternity. Therefore not priority or posteriority of duration can be observed here, although there may be priority of order according to which the Son is from the Father, although not after the Father. (2) Without place (achōristōs) because the Father did not beget out of himself, but in the same essence. (3) Without any passion (apathōs) or change, either in the Father or in the Son.</p></blockquote>

</figure><figure class="quote" id="q-b0d6ffec2e" data-kw="Word Wisdom Spirit">
<blockquote><p>The Son is the Word and Wisdom of the Father, begotten from eternity and without beginning in time, and the Holy Spirit is the divine power proceeding from the Father and the Son. In this matter, we must tread cautiously and with suspended judgment. This doctrine must be approached soberly and reverently, as it surpasses human comprehension.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ca942c4320" data-kw="">
<blockquote><p>The Divine Properties are neither separable from the essence, nor from each other. This Rule overthrows the Lutheran Tenet, concerning the transfusion of the Divine properties into the Human Nature of Christ: for if this be capable of ubiquity, omniscience, omnipotency, why not also of eternity?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Abridgment of Christian Divinity</cite>, trans. Alexander Ross (3rd edn, London: Joseph Nevill, 1660), p. 16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eb27eb3ed6" data-kw="">
<blockquote><p>Till far on in the second half of the century of the Reformation there were, properly speaking, only Evangelicals or Protestants; and the names Lutherans, Zwinglians, Calvinists were by all authorities of that time entirely repudiated. (Zanchius in a letter complains of people applying to themselves such names.)… in Frankfort [Germany] those who held the views of the Swiss, by the advice of Dathen, let their children be baptized by the city clergy who held Lutheran opinions; and when Calvin in September, 1556, was called as arbitrator to Frankfort, the wine of honor was poured out to him. Moreover, the states of the empire that were inclined to the Swiss doctrine were not excluded, in the year 1555, in the compact entitled ‘the Religious Peace;’ and there was then in Germany only one Protestant Church which in that Peace received on the basis of the Augsburg Confession toleration, or rather equal authorization… The doctrine of predestination was nto then matter of dispute. (…Calvin writes in 1560 to Zerkint of Bern, that up to this year no one had taken exception to the doctrine of predestination (v. Op. Omnia, Strassburg edition, Vol. xvii, 238)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edouard-bohl.html">Edouard Bohl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Separation of the Lutheran Church from the Reformed</cite>, vol. 5, no. 19 (July, 1894), pp. 415-33, p. 416</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-f9804783ca" data-kw="">
<blockquote><p>My design is to indicate how slowly the process ran out its course, by which a Lutheran and a Reformed Church arose in Germany in the sixteenth century… These [Lutheran and Reformed] reformations are then [popularly] thought of as like two circles, which merely touch each other; or, according to others, which really intersect, and have large segments in common, but which yetnever cover exactly the same space, or were drawn from one center… It is easy to refute this false opinion…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edouard-bohl.html">Edouard Bohl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Separation of the Lutheran Church from the Reformed</cite>, vol. 5, no. 19 (July, 1894), pp. 415-33, p. 415</span></figcaption>

ntroversy%3A%20Whether%20the%20grace&amp;text=the%20following%20questions%5D%3B%20We%2C%20on%20the%20contrary%2C%20deny" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1ae4dfd8fb" data-kw="">
<blockquote><p>I beg you, tell us whether according to your [Lutheran] ubiquity [of the human nature], if I understand with my mind and not my body and I hunger with my body and not my mind, do I therefore hunger or understand only verbally? Similarly when we say that Christ truly and suffered and died insofar as He was a man, you cannot rightly construe this as if He suffered and died only verbally… …although I deny that the Word of God really suffered and died, still I do not claim that the passion and death did not involve it at all, for the Word was present at the passion and death, as has been said, because of the hypostatic union, although in a quiescent way. It was not affected by any suffering or by a new quality. Hence it is not empty words that the Son of God suffered and died since that nature and flesh which He made his own and to which He was present by a union of Person, really and truly suffered and died. But I would never say, as you are used to asserting, that the Word [logon] Himself really and truly both suffered and died.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dialogue on the Two Natures in Christ</cite>, ed. &amp; trans. John Donnelly in The Peter Martyr Library, vol. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

<main class="wrap"><figure class="quote" id="q-0803bf8bd7" data-kw="">
<blockquote><p>The decisive argument for the perpetual obligation of the sabbath is the fourth commandment. The ten commandments, as being of a moral nature, and therefore always binding, were promulgated in a very different manner from the other institutions of Moses. They were first uttered in a voice of thunder, from the midst of the fire on Sinai, and were then inscribed by the finger of God on two tables of hewn stone.

Now, it is admitted, that all the other precepts of the Decalogue are moral; and would it not be an unaccountable thing that a ceremonial, temporary commandment should be inserted in the midst of these moral precepts? This is the law which Christ says he came not to destroy, but to fulfil. None of these commandments have been abrogated; and therefore the fourth, as well as the others remains in fall force. And it is remarkable that the prophets, in denouncing the sins of the people, always mention the violation of the sabbath in the same catalogue with the transgression of moral precepts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Compend of Bible Truth</cite>, (Philadelphia: Presbyterian Board of Publication, 1846), pp 185-86.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-98ced36c4d" data-kw="">
<blockquote><p>This is to be observed in all precepts, as well ceremonial, as judicial, and moral. When two precepts of God seem one to be repugnant to an other, so as the one is a hindrance to the other, that they cannot both at one time be observed; yea rather, it is necessary that the one of them for the time being be omitted: then, that which shall be judged weightiest and greatest, must be retained. But yet in the meantime, that other, which is reckoned to be less and lighter, is not violated; because in the same there is nothing done against the will of God.

The law commandeth, that every one should have respect to the safety of his neighbour: and if one be a magistrate, that he by arms defend his city. The same law commandeth, that We must not labour on the sabbath day: the enemy besiegeth the city, and that on the sabbath day; because he knoweth that that law was laid upon the citizens. Here seemeth a contrariety of the precepts: for on the one part, safety must be maintained; and on the other part, the sabbath must be observed. The Maccabees judged it best to fight, because the safety of the common-weal seemed greater and better than the ceremony of the sabbath.

Also the law is, that we should feed the hungry: and an other law commandeth, that the shew-bread should be eaten of none, but of the priests. David came hungry unto the priest, nothing he had but the shew-bread: wherefore here cometh together two contrary precepts. The wise priest followeth and observeth that, which is the worthier; namely, to feed the hungry: he brought out the shew-bread, and helped David. There is also another law, that we must furnish the prince with armour; for he is to be holpen by his subjects: and contrariwise, it is commanded, that things consecrated unto God must not be translated unto other uses. Dauid the king’s son in law, which warred for him as his general lieutenant, was then unarmed: the priest had no weapon at hand, but the sword of Goliath. Here be two precepts, which seem contrary; the priest followeth the one, and delivereth the sword unto the magistrate: because he judged it better, to arm the magistrate, than to observe the ceremony.

Also there is a law, that the church must not be deprived of ministers, so as it should be destitute of them: and Paule hath another law, that a novice or man newly entered into religion, should not be a bishop. The church of Milan was much troubled, because it could not find a meet bishop, that as well was free from the heresy of Arius, as also that had great authority and learning given him of God: only there was Ambrose; but yet a novice, and newly come to the faith. Here are two laws met, in shew contrary one to another; but it was meet for the lesser law to give place to the greater: for Christ so taught, when by the sentence of the prophet he saith; I will have mercy, &amp; not sacrifice. Howbeit, he meaneth not, that he will not have sacrifice: but that, if two commandments meet together, whereof the one belongeth unto mercy, and the other unto sacrifice; he testifieth, that he had rather have mercy, than sacrifice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes:</cite>, The Common Places, trans. Anthony Marten (2nd edn, London, 1583), 2.3.13.</span></figcaption>

">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-d702871534" data-kw="">
<blockquote><p>1. What it is that is the formal reason of it, — that which renders him a meet object of the church’s worship, and the church’s worship to be truly divine or religious. 2. What is the principal motive prevailing with us to give him this glory and honour. For the first, it is no other but the divine nature. The natural and essential excellencies of the Deity are the formal reason and proper object of all divine worship.

We worship the Lord Christ, who is God and man. He is so in one person; and his person who is God and man is the object of that worship. But the formal reason and object of it is the divine nature in that person. Give me leave to say, God himself could not command the Lord Christ to be worshipped with divine religious adoration were he not God by nature, for the thing itself implieth a contradiction. Religious worship is nothing but an assignation of that honour which is due to divine excellencies; namely, to trust, believe, fear, obey, love, and submit unto infinite holiness, goodness, righteousness, power, in the first cause, last end, and sovereign Lord of all.

Now, to assign glory proper to divine excellencies, and which receiveth its nature from its object, where divine excellencies are not, is openly contradictory. Besides, God hath said, “I am the LORD: that is my name: and my glory will I not give to another,” Isa. xlii. 8. He that hath not the name of God, (that is, his nature,) shall not, nor can have this glory, which is to be the object of the worship mentioned. And there are scarcely more gross idolaters in the world than those who profess to worship Christ and to believe in him, in a word, to give him all the glory that is due to God, and yet deny him so to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. W. H. Goold (1674; 7 vols, Edinburgh: Johnston and Hunter, 1854), 3: 549-50.</span></figcaption>

</figure><figure class="quote" id="q-dc47510c51" data-kw="">
<blockquote><p>The sum, in general, of what this author opposeth with so much clamour is, That divine revelation is the sole rule of divine religious worship; an assertion that, in its latitude of expression, hath been acknowledged in and by all nations and people. The very heathen admitted it of old, as shall be manifested, if need require, by instances sufficient; for though they framed many gods, in their foolish, darkened imaginations, yet they thought that every one of them would be worshipped according to his own mind, direction, and prescription. So did, and I think do, Christians generally believe. Only, some have a mind to pare this generally-avowed principle, to curb it, and order it so, by distinctions and restrictions, that it may serve their turn and consist with their interest; for an opposition unto it nakedly, directly, and expressly, few have had the confidence yet to make. And the Nonconformists need not go one step farther in the expression of their judgments and principles in this matter; for who shall compel them to take their adversaries, distinctions (which have been invented and used by the most learned of them) of “substantial and accidental, proper and reductive, primitive and accessary, direct and consequential, intrinsic and circumstantial worship,” and the like, for the most part, unintelligible terms, in their application unto the state of the question? If men have a mind, let them oppose this thesis as laid down; if not, let them let it alone: and they who shall undertake the confirmation of it will no doubt carry it through the briers of those unscriptural distinctions. And that this author may be the better instructed in his future work, I shall give him a farther account of the terms of the assertion laid down.</p></blockquote>

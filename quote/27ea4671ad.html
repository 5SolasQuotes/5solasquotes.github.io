<main class="wrap"><figure class="quote" id="q-27ea4671ad" data-kw="">
<blockquote><p>Fifthly, such as are wicked and ungodly vows… And thus two evils meet together, the one whereof is to vow, the other to perform such a vow; and therefore such vows are not to be kept. This serveth to set before the eyes of many their folly, who never consider what the vow is which they have taken upon them to observe, but if they can say, I have a vow to do this or that, they grow obstinate and settled in evil, and will by no means be removed, yea and think they are bound by virtue of their vow to do it, and are discharged of all fault and offence when they have done it: whereas that which is evil to vow, is much worse to perform; and therefore they must repent of their rash vow, and not proceed to the accomplishment of it, for that were to add one transgression to another, as it were drunkenness unto thirst, and to plunge themselves into endless destruction both of soul and body. This is the case of many young men and women who have entangled themselves in such vows, by promising marriage either to other without the consent of parents; they often pretend great scruple of conscience, which cannot be tied by such evil vows, the vow was evil, and therefore the way is not to go forward, but to crave pardon of God for that evil, as here it is prescribed in this Chapter [Num. 30].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Numbers</cite>, (London, 1618), p. 1,159</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>[The first time was when the ceremonial law was obliging under the Mosaic system.] The second time was from the ascension of Christ, till about the time of the destruction of the Temple and city: in which ceremonies ceased to bind conscience and remained indifferent. Hereupon Paul circumcised Timothy: the apostles after Christs ascension, as occasion was offered were present in the temple, Acts 3:1; And the council of Jerusalem tendering the weakness of some believers, decreed that the Church for a time should abstain from strangled [animals] and blood. And there was good reason of this, because the Church of the Jews was not yet sufficiently convicted that an end was put to the ceremonial law by the death of Christ. In the third time, which was after the publishing of the Gospel, ceremonies of the Jews Church became unlawful, and so shall continue to the world’s end.</p></blockquote>

</figure><figure class="quote" id="q-11dae79043" data-kw="">
<blockquote><p>5. Children having their life and first breathings of nature from their parents, must be in a more entire relation from their father than from their prince. Subjects have not their being-natural, but their civil, politic and peaceable well-being from their prince.

6. A father is a father by generation, and giving the being of nature to children, and is a natural head and root, without the free consent and suffrages of his children, and is essentially a father to one child, as Adam was to one Cain; but a prince is a prince by the free suffrages of a community, and cannot be a king to one only, and he is the politic head of a civil corporation.

7. A father, so long as his children lives, can never leave off to be a father, though he were mad and furious — though he be the most wicked man on earth. Qui genuit filium non potest non genuisse filium, what is once past cannot, by any power, be not past; a father is a father forever. But by confession of royalists, as Barclaius, Hugo Grotius, and Arnisaeus, and others, grant, if a king sell his subjects by sea or land to other nations, if he turn a furious Nero, he may be dethroned… Learned politicians, as Bartholomeus Romulus, (Defens. part 1, n. 153, and Joannes de Anania (in c. fin. de his qui fil. occid.) teach that “the father is not obliged to reveal the conspiracy of his son against his prince; nor is he more to accuse his son, than to accuse himself, because the father loves the son better than himself,” (D. Listi quidem. Sect. Fin. quod, met. caus, et D. L. fin. c. de cura furiosi) and certainly a father had rather die in his own person, as choose to die in his son’s, in whom he affects a sort of immortality, in specie, quando non potest in individuo [in kind when not able in the individual]; but a king does not love his subjects with a natural or fatherly love thus; and if the affections differ, the power which seconds the affection, for the conservation either of being, or well-being, must also differ proportionally.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

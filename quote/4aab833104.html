<main class="wrap"><figure class="quote" id="q-4aab833104" data-kw="">
<blockquote><p>Anger, as stated above (Article 1), is properly the name of a passion. A passion of the sensitive appetite is good in so far as it is regulated by reason, whereas it is evil if it set the order of reason aside. Now the order of reason, in regard to anger, may be considered in relation to two things. First, in relation to the appetible object to which anger tends, and that is revenge. Wherefore if one desire revenge to be taken in accordance with the order of reason, the desire of anger is praiseworthy, and is called “zealous anger” [Cf. Gregory, Moral. v, 45. On the other hand, if one desire the taking of vengeance in any way whatever contrary to the order of reason, for instance if he desire the punishment of one who has not deserved it, or beyond his deserts, or again contrary to the order prescribed by law, or not for the due end, namely the maintaining of justice and the correction of defaults, then the desire of anger will be sinful, and this is called sinful anger. Secondly, the order of reason in regard to anger may be considered in relation to the mode of being angry, namely that the movement of anger should not be immoderately fierce, neither internally nor externally; and if this condition be disregarded, anger will not lack sin, even though just vengeance be desired.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, 2nd pt. of 2nd pt., question 158, ‘Anger’, article 2, ‘Whether anger is a sin’</span></figcaption>

C%20as%20stated%20above%20%28Article%201,even%20though%20just%20vengeance%20be%20desired&amp;text=Anger%2C%20as%20stated%20above%20%28Article%201%29%2C%20is%20properly&amp;text=lack%20sin%2C%20even%20though%20just%20vengeance%20be%20desired" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>First in general; It is demanded how a man should and ought to forgive an injury? Answer: In forgiveness there be four things: The first is forgiveness of revenge, that is of requiting evil for evil, either by thought word or deed. This must always be practiced. For vengeance is not ours, but the Lord’s, and great reason then that we should ever-more forgive in regard of revenge and hatred. This the apostle teaches, when he says, 1 Cor. 13:5, Love is not provoked, it never thinks, much less speaks or does, evil. The second is forgiveness of private punishment; which is, when men return punishment for injuries done in way of requital; and this must always take place with us, because as vengeance itself, so also punishment in way of revenge is God’s alone. The third is, forgiveness of judgment, when we judge an injury done to be an injury. This judgment we are not bound to forgive unto men. For we may with good conscience judge a sin and a wrong to be as they are. And yet notwithstanding, if a man make satisfaction for the wrong done, then there ought to be forgiveness, even in regard of judgement. The fourth is forgiveness of satisfaction. This we are not alway[s] bound to remit, but we may with good conscience, alway[s] require satisfaction where hurt is done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience</cite>, … (Legat: Univ. of Cambridge, 1606), bk. 3, ch. 3, question 1, ‘How may a man carry himself in respect of injuries and offences done unto him?’, pp. 492-3</span></figcaption>

1107dad.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/51c1107dad.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-forgiveness/#:~:text=First%20in%20general%3B%20It%20is%20demanded,require%20satisfaction%20where%20hurt%20is%20done&amp;text=First%20in%20general%3B%20It%20is%20demanded%20how%20a&amp;text=conscience%2C%20alway%5Bs%5D%20require%20satisfaction%20where%20hurt%20is%20done" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7520e35a4a" data-kw="">
<blockquote><p>What is desired ceases to be beautiful to the extent that it is desired. The starry heaven is unspeakably beautiful, said Schopenhauer, because it is desired by no one. Beauty delights us not because it is profitable to us. Our delight in beauty is entirely disinterested. Beauty awakens the kind of movement within our faculty of desiring that creates enjoyment in pure, disinterested, beholding, whether such beholding is physical or spiritual. Truth satisfies our understanding. The good fulfills our desires and awakens our love. Beauty provides rest and delight. Materially and objectively they are one. The true, the good, and the beautiful form one unbreakable triad. All that is, in the same measure that it is, is also true, good and beautiful. This unity can disintegrate only temporarily, in this world of disharmonies… Nonetheless, these three are materially one… The true, the good, and the beautiful differ only formally, insofar as the same thing exists in a varied relationship to the rich organization of our spirit. After all, God Himself is also the truth, the holy [good], and the glory [beautiful].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 157-66 of ch. 7, H. ‘Conscience &amp; the Idea of Beauty’ in Foundations of Psychology trans. Born, Kloosterman &amp; Bolt 2nd ed. (1897; 1921), p. 165</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

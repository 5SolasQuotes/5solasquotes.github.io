<main class="wrap"><figure class="quote" id="q-6841728b32" data-kw="">
<blockquote><p>…the similarities and differences between the conclusions reached by Scotus and Aquinas. Though Scotus became the standard reference point for discussions of intuitive versus abstractive cognition, this does not mean his account of the beatific vision fundamentally differed from Thomas’s regarding the vision of the divine essence. Both affirmed that the intelligible species could not be creaturely or a created similitude to see the divine essence, both affirmed the necessity of the supernatural agent to elevate the created intellect, and both affirmed a sense in which the beatific vision is ‘natural’ in the creature. They disagreed on how to define such a natural desire (with Aquinas claiming it is elicited and Scotus it is innate), the status of obediential potency (Aquinas distinguishing it from natural potency and Scotus conflating the two), the necessity of the light of glory, and whether what is natural should be measured merely by passive potencies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-seals.html">Zachary Seals</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Beatific Vision in the Synopsis Purioris: Its Medieval Context’ in Reformed Theological Review, vol. 82, no. 1 (April 2023)</cite>, pp. 3-12</span></figcaption>

ncies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-687b8e6168" data-kw="">
<blockquote><p>Moreover, what the orthodox fathers and the scholastics who followed their steps handed down very well was commonly known: namely that the natural gifts have been corrupted and the supernatural ones lost. So from this statement we establish that supernatural theology, which by the sin of man had been, as it were, rejected and most undeservedly spurned, retreated from here to the heavens; and natural theology, as all the other things which arise from nature, was corrupted. For how could it have remained uncorrupted in a subject that was corrupted in every part?</p></blockquote>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Calvinism &amp; the Doctrine of Philosophical Necessity’ in The Reformers &amp; the Theology of the Reformation</cite></span></figcaption>

— Richard Baxter, Catholic Theology (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, p. 11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+He+wills+to+give+power+to+free+agents%2C+to+do+or+not+do+certain+acts+in+specie%3B+and+therefore+they+can+do+more+than+He+decrees+they+shall+do.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Theology+%28London%3A+White%2C+1675%29%2C+pt.+2%2C+1st+Day%E2%80%99s+Conference%2C+about+Predestination%2C+p.+11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa6b2a14e72.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a6b2a14e72.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-reformed-freedom-of-the-will-vs-philosophical-necessity/#:~:text=But%20He%20wills%20to%20give%20power,than%20He%20decrees%20they%20shall%20do&amp;text=But%20He%20wills%20to%20give%20power%20to%20free&amp;text=do%20more%20than%20He%20decrees%20they%20shall%20do" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f57a940b0e" data-kw="">
<blockquote><p>For our purposes, what is relevant here is passive obediential potency, which [the reformed] Senguerdius defines as: ‘[That] whereby a subject can receive an act beyond its nature, that is, to which it is not ordained by nature and would not naturally receive, such as the potency obediential passive given in stones to become sons of Abraham, or in water to be turned into wine.’ The idea here is simple. There is a sense in which you and I are perfectly capable of performing miracles. By this, I do not mean that we currently possess the active and formal power to perform miracles. Nor do I mean that we can affect them by our own natural powers. I only mean that you and I are the sort of beings that have the capacity to be raised by an agent superior to ourselves to perform miracles. … In this sense, man’s ordering to the beatific vision is an end superadded to his nature. When we speak about something being “supernatural,” strictly speaking, we mean that it is above the power of all created nature. The beatific vision clearly belongs to this category, since, as Thomas argues, no created effect of God is proportionate to his essence. Therefore, the beatific vision cannot be man’s intrinsic and natural end. Nevertheless, man’s rational nature entails an obediential potency for this vision, since his intellect and will make him the sort of creature capable of enjoying it, should God will to grant it. This is not because man’s nature is proportioned to that vision by nature, but only because it is not intrinsically repugnant to it as, for instance, would be the case of a stone, which lacks even the obediential potency to enjoy the beatific vision inasmuch as it is irrational. Thus man’s nature is not ‘closed off’ to grace even though it is not naturally ordered to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brandon-corley.html">Brandon Corley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Natural End of Man’ (2026) at American Reformer</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

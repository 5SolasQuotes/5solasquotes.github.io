<blockquote><p>Objection. But do not the laws of men in authority bind the conscience? Answer. Not by themselves and primarily, but secondarily by participation, with the Law of God which does immediately and of itself bind the conscience; as water does make hot and scald sometimes, not of itself, but as it participates in the heat of fire, which immediately from the nature of it makes hot. If they command anything repugnant to God’s Word we may disobey it, and not sin: provided that our denial of obedience come from conscience of God’s will, and not from want of due subjection in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-bayne.html">Paul Bayne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Help to True Happiness, or a Brief &amp; Learned Exposition of the Main &amp; Fundamental Points of Christian Religion</cite>, (London, 1618), pt. 1, question 3, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>Finally, it is to be noted that though in some things we may and do commendably refuse obedience to the laws of those whom God has set over us, yet are we ever obliged (and accordingly intend) still to subject ourselves unto them. For to be subject, does signify (as Zanchius shows [Commentary on Eph. 5, on Subject.]) to be placed under, to be subordinate, and so to give honor and reverence to him who is above, which may well stand without obedience to every one of his laws. Yea and Dr. Field [an Anglican] also tells us, that subjection is generally and absolutely required, where obedience is not.</p></blockquote>

</figure><figure class="quote" id="q-9d63fb276b" data-kw="">
<blockquote><p>…Pilate uses all means to get Jesus loose; he uses the present occasion to that purpose; knowing the use [custom] of the Jews, he would have been glad to have had Jesus set at liberty, above all the prisoners. To speak somewhat of this custom: They had this custom, to get a prisoner set at liberty at festival times, to the honor of their feasts… but therewith they dishonored God. Is that to honor God, to break his commandment?… We know this, there is nothing wherein a prince resembles God more than in clemency; but it is a sin to let a wicked man escape, or that the emperor should let him go; for God’s law says, Dt. 19:11-13, “Thine eye shall not spare the murderer, neither look upon him with a pitiful eye.”… Some will say, has not a free prince license to give him his life, albeit the law of God says, “The murderer shall die the death?”… It is true, indeed, a prince should be loath to put out that life that God has put in, and should beware to judge rashly in capital crimes. It is no small matter to make a crime capital; but if the crime be capital and deadly, the prince has no power to hold his hand aback from execution, and to forgive. Indeed, for weighty and great considerations, a prince may mitigate [lesson] the punishment, but to say he may let the man go free, he has no power. But they will insist further, and say, Is not this on the the judicial laws that was given to the Jews–then what have we to do with it? I answer, these laws, seeing the Jews, and their commonwealth, and laws politic, are abrogate, in so far as they concerned that people, we have nothing ado with them–they are abolished; but for as much as they are grounded upon nature, and natural law, we have ado with them. As for this law, it is natural. Ye know that natural men, ethnics, who had never the law of the Jews, they executed the murderer. But yet they insist, and they will bring in the example of good kings, who forgave capital crimes committed against the very universal and natural law; and namely of David. Forgave he not Joab for slaying of Abner and Amasah? and Amnon, for committing incest? and again, forgave he not Absalom for slaying of Amnon, his brother? But I answer: We are bound to live by God’s laws, and not by examples… Indeed, there is a difference between these crimes that are capital, and the crimes that in their own nature are not capital, but by the laws of princes are made capital; for upon just considerations, the prince has power to dispense with them: as, for example, it was not deadly of the own nature to Shimei to go out of the ports of Jerusalem, but because Solomon forbade it, it became deadly. Like as it is in the hands of princes to make and to change such special laws; so it lies in his hands to forgive such a man transgressing them, upon weighty and great considerations. So, to return, these crimes that are capital by natural law, a prince has no power to remit them, albeith he were ruler of all the world; he derogates to God’s glory. And secondly, if there were no more to let us see that God has not given that power to forgive capital crimes against God’s law and nature, the judgments of God which ceased on such men and their posterity were sufficient to show it…</p></blockquote>

+nature%2C+and+natural+law%2C+we+have+ado+with+them.+As+for+this+law%2C+it+is+natural.+Ye+know+that+natural+men%2C+ethnics%2C+who+had+never+the+law+of+the+Jews%2C+they+executed+the+murderer.+But+yet+they+insist%2C+and+they+will+bring+in+the+example+of+good+kings%2C+who+forgave+capital+crimes+committed+against+the+very+universal+and+natural+law%3B+and+namely+of+David.+Forgave+he+not+Joab+for+slaying+of+Abner+and+Amasah%3F+and+Amnon%2C+for+committing+incest%3F+and+again%2C+forgave+he+not+Absalom+for+slaying+of+Amnon%2C+his+brother%3F+But+I+answer%3A+We+are+bound+to+live+by+God%E2%80%99s+laws%2C+and+not+by+examples%E2%80%A6+Indeed%2C+there+is+a+difference+between+these+crimes+that+are+capital%2C+and+the+crimes+that+in+their+own+nature+are+not+capital%2C+but+by+the+laws+of+princes+are+made+capital%3B+for+upon+just+considerations%2C+the+prince+has+power+to+dispense+with+them%3A+as%2C+for+example%2C+it+was+not+deadly+of+the+own+nature+to+Shimei+to+go+out+of+the+ports+of+Jerusalem%2C+but+because+Solomon+forbade+it%2C+it+became+deadly.+Like+as+it+is+in+the+hands+of+princes+to+make+and+to+change+such+special+laws%3B+so+it+lies+in+his+hands+to+forgive+such+a+man+transgressing+them%2C+upon+weighty+and+great+considerations.+So%2C+to+return%2C+these+crimes+that+are+capital+by+natural+law%2C+a+prince+has+no+power+to+remit+them%2C+albeith+he+were+ruler+of+all+the+world%3B+he+derogates+to+God%E2%80%99s+glory.+And+secondly%2C+if+there+were+no+more+to+let+us+see+that+God+has+not+given+that+power+to+forgive+capital+crimes+against+God%E2%80%99s+law+and+nature%2C+the+judgments+of+God+which+ceased+on+such+men+and+their+posterity+were+sufficient+to+show+it%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Robert+Rollock%2C+Select+Works%2C+vol.+2%2C+pp.+87-90+on+Mt.+27%3A16-17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9d63fb276b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9d63fb276b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-civil-law/#:~:text=Pilate%20uses%20all%20means%20to%20get,posterity%20were%20sufficient%20to%20show%20it&amp;text=Pilate%20uses%20all%20means%20to%20get%20Jesus%20loose&amp;text=and%20their%20posterity%20were%20sufficient%20to%20show%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Again, in the next place, take also this general observation, That although the Judicial and Ceremonial Laws were given at the same time with the Moral Law, yet there is a difference between them. And this is to be taken notice of, lest any should think, what will this discourse make for the honor of the Moral Law, more than the other laws? It’s true, these three kinds of laws agree in the common efficient cause, which was God; and in the minister, or mediator, which was Moses; in the subject, which was the people of Israel; and all and every one of them; as also in the common effects, of binding and obliging them to obedience, and to punish the bold offenders against them. But herein the Moral Law is preeminent: 1. In that it is a foundation of the other laws, and they are reducible to it. 2. This was to abide always, not the other. 3. This was immediately written by God, and commanded to be kept in the Ark, which the other were not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Moral Law &amp; the Covenants</cite>, (London: Young, 1647), p. 155</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Again, in the next place, take also this general observation, That although the Judicial and Ceremonial Laws were given at the same time with the Moral Law, yet there is a difference between them. And this is to be taken notice of, lest any should think, what will this discourse make for the honor of the Moral Law, more than the other laws? It’s true, these three kinds of laws agree in the common efficient cause, which was God; and in the minister, or mediator, which was Moses; in the subject, which was the people of Israel; and all and every one of them; as also in the common effects, of binding and obliging them to obedience, and to punish the bold offenders against them. But herein the Moral Law is preeminent: 1. In that it is a foundation of the other laws, and they are reducible to it. 2. This was to abide always, not the other. 3. This was immediately written by God, and commanded to be kept in the Ark, which the other were not.”

— Anthony Burgess, A Vindication of the Moral Law &amp; the Covenants (London: Young, 1647), p. 155">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAgain%2C+in+the+next+place%2C+take+also+this+general+observation%2C+That+although+the+Judicial+and+Ceremonial+Laws+were+given+at+the+same+time+with+the+Moral+Law%2C+yet+there+is+a+difference+between+them.+And+this+is+to+be+taken+notice+of%2C+lest+any+should+think%2C+what+will+this+discourse+make+for+the+honor+of+the+Moral+Law%2C+more+than+the+other+laws%3F+It%E2%80%99s+true%2C+these+three+kinds+of+laws+agree+in+the+common+efficient+cause%2C+which+was+God%3B+and+in+the+minister%2C+or+mediator%2C+which+was+Moses%3B+in+the+subject%2C+which+was+the+people+of+Israel%3B+and+all+and+every+one+of+them%3B+as+also+in+the+common+effects%2C+of+binding+and+obliging+them+to+obedience%2C+and+to+punish+the+bold+offenders+against+them.+But+herein+the+Moral+Law+is+preeminent%3A+1.+In+that+it+is+a+foundation+of+the+other+laws%2C+and+they+are+reducible+to+it.+2.+This+was+to+abide+always%2C+not+the+other.+3.+This+was+immediately+written+by+God%2C+and+commanded+to+be+kept+in+the+Ark%2C+which+the+other+were+not.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+A+Vindication+of+the+Moral+Law+%26+the+Covenants+%28London%3A+Young%2C+1647%29%2C+p.+155&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F65f336f864.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/65f336f864.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-civil-law/#:~:text=Again%2C%20in%20the%20next%20place%2C%20take,Ark%2C%20which%20the%20other%20were%20not&amp;text=Again%2C%20in%20the%20next%20place%2C%20take%20also%20this&amp;text=in%20the%20Ark%2C%20which%20the%20other%20were%20not" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

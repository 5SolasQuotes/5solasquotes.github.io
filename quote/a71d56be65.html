<main class="wrap"><figure class="quote" id="q-a71d56be65" data-kw="">
<blockquote><p>Prayer is not a smooth expression, or a well-contrived form of words; not the product of a ready memory, or of a rich invention exerting itself in the performance. These may draw a neat picture of it, but still, the life is wanting. The motion of the heart God-wards, holy and divine affection, makes prayer real, and lively, and acceptable to the Living God, to whom it is presented; the pouring out of thy heart to Him who made it, and therefore hears it, and understands what it speaks, and how it is moved and affected in calling on Him.

It is not the gilded paper and good writing of a petition, that prevails with a king, but the moving sense of it. And to that King who discerns the heart, heart-sense is the sense of all, and that which only He regards: He listens to hear what that speaks, and takes all as nothing where that is silent. All other excellence in Prayer, is but the outside and fashion of it; this is the life of it.

Though prayer, precisely taken, is only petition, yet, in its fuller and usual sense, it comprehends the venting of our humble sense of vileness and sin, in sincere confession, and the extolling and praising of the holy name of our God, His excellency and goodness, with thankful acknowledgment of received mercies. Of these sweet ingredient perfumes is the incense of Prayer composed, and by the Divine fire of love it ascends unto God, the heart and all with it; and when the hearts of the saints unite in joint prayer, the pillar of sweet smoke goes up the greater and the fuller. …

And, indeed, the sincerity and unfeignedness of prayer, makes it go up as a straight pillar, no crookedness in it, tending straight towards heaven, and bowing to no side by the way. Oh ! the single and fixed viewing of God, as it, in other ways, is the thing which makes all holy and sweet, so particularly does it in this Divine work of prayer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary Upon the First Epistle General of Saint Peter</cite>, (1693-94) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 1: 512.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-88e57b938a" data-kw="">
<blockquote><p>BEING minded, through the help of God, for mine own comfort and encouraging of others, to speak something of Death (at whose doors though I have stand a great while, yet never so near, to man’s judgement, as I do now) I think it most requisite to call &amp; cry for thy help, Oh blessed saviour Jesus Christ, which hast destroyed death by thy death, &amp; brought in place thereof, life and immortality, as by the gospel it appereath: grant to me true &amp; lively faith, wherethrough men pass from death to eternal life, that of practise and not of naked speculation, I may something write concerning death (which is dreadful out of thee &amp; in it self) to the glory of thy holy name, to mine own comfort in thee, and to the edifying of all them, to whom this writing shall come, to be read or heard. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bradford.html">John Bradford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A fruitful treatise and full of heavenly consolation against the fear of death. Whereunto are annexed certain sweet meditations of the kingdom of Christ, of life everlasting, and of the blessed state &amp; felicity of the same</cite>, (London: William Powell, 1564), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-c1e376a949" data-kw="">
<blockquote><p>Why then are the prayers of them that love and fear God so little effectual many times? The main cause is the wandering of their thoughts when they are about that holy duty. For it is no wonder that God granteth not what we ask when we think not what we ask. And it were a wonder if that Holiest of Holies, being spoken to without attention, did not resent so great a contempt which we would not use to our inferiors.

Since then the wandering of our thoughts is the cause of that great evil, what is the cause of that wandering? Indeed the prime cause is the incapacity of our low carnal nature to comprehend the infinite God; who being invisible and immaterial doth not help the mind with any image proportionate to the sense and imagination; without which it is very hard for the understanding to fix his thoughts. And that defect in our nature is made worse by this defect in our duty, that we make our addresses to God having not considered before what we are going about, what God is, and what we are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-du-moulin.html">Peter Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A week of soliloquies and prayers. With a preparation for the Holy Communion</cite>, (London: H. Moseley, 1657), epistle dedicatory.</span></figcaption>

</figure><figure class="quote" id="q-9ae95d3b37" data-kw="Mary Mediator Invocation of saints">
<blockquote><p>However, we cannot in any way acknowledge or accept what our opponents openly say, namely that Mary is to be invoked as a mediator between God and humans, or that she is our patron and advocate. We do not believe that this is either a tradition of Holy Scripture or a command from God. We believe that God, who alone grants all salvation for the present and future, is the one to be invoked alone. We believe that Christ alone [since He alone is true God and true man] is the true mediator between God and humans. We believe that He, who alone can satisfy all humans, is the patron and advocate with the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on the Blessed Virgin Mary, the Mother of Our Lord Jesus Christ</cite>, 1558</span></figcaption>

</figure><figure class="quote" id="q-67b4edeb06" data-kw="">
<blockquote><p>Almighty God and heavenly Father, You have promised to hear and answer our requests which we make to you in the name of Your beloved Son, Jesus Christ our Lord. We are further taught by Him and His apostles to gather together in His name, with the promise that He will be among us and will intercede for us before You, that we may receive and obtain all things on which we are agreed on earth. You bid us pray, first, for those whom you have set up over us, our leaders and governors. Next, for the needs of all Your people, and of all men everywhere. Therefore, trusting in Your holy truth and in Your promise, and being assembled here before You in Jesus’ name, we lovingly beseech You, our God and Father, in Your infinite mercy, freely to pardon our transgressions, and so to lift our thoughts and desires to You that we may heartily call upon You according to Your good will and pleasure. We therefore pray, heavenly Father, for all princes and lords, Your servants to whom you have committed the rule of justice. Most particularly do we pray for the rulers of this city, that you will endue them with Your Spirit, who alone is gracious and sovereign, and daily increase His gifts in them, that they, acknowledging Your Son Jesus Christ to be King of kings and Lord of lords, with full power in heaven and on earth, may seek to serve Him and exalt His reign in all their dominions, and may according to Your will, guide and govern their subjects, who are the work of Your hands and the sheep of Your pasture. And may we, Your people, here and everywhere, being kept in peace and tranquility, serve You in holiness and righteousness. And, free from the fear of our enemies, may be give You praise all our days. We pray also, true Father and Saviour, for all whom You have ordained as pastors to Your people, who have the care of souls and the administration of Your holy gospel. May You lead and direct them by Your Holy Spirit, that they may be found faithful and true ministers of Your glory, always striving to gather and bring home the erring and wayward sheep to the Lord Jesus Christ, our chief Shepherd and principal Bishop, that they might daily prosper and grow in Him in all righteousness and holiness. Grant, moreover, that all churches may be delivered from the mouths or ravening wolves and hirelings, who follow their own purposes and ambitions, and have no care fore the honour of Your holy name and the welfare of Your flock. Next we pray, most gracious God and merciful Father, for all men generally. Since you desire all men to acknowledge You as Saviour of the world, through the redemption won by our Lord Jesus Christ, may those who do not know Him, being in darkness and captive to ignorance and error– may they by the light of Your Holy Spirit and the preaching of Your gospel, be led into the way of salvation, which is to know You, the only true God, and Jesus Christ whom you have sent. May those whom You have already visited with Your grace, and enlightened by the knowledge of Your Word, grow in all goodness, enriched by Your spiritual blessing, so that together we may all worship You with heart and voice, giving honour and homage to Christ, our Master, King and Lawgiver. Likewise, O God of all comfort, we commend to You all whom You visit and chastise with cross and tribulation, whether it be through poverty or prison, sickness or exile, or affliction of body or mind. May You make known to them Your fatherly love, and assure them that their chastisement is for amendment of life. And may they with willing heart turn to You and, being converted, receive Your comfort, being delivered from every distress. Finally, O God and Father, grant also that we, who are gathered here in Jesus’ name to hear His Word, may, without dissembling or hypocrisy, acknowledge that by nature we are lost, that we deserve Your punishment, and daily heap up condemnation to ourselves by our wretched and unruly lives. Help us to see that in us there is nothing good, and that flesh and blood can never inherit Your kingdom. May be gladly and with steadfast trust submit to your Lord Jesus Christ, our only Saviour and Redeemer. And may He so live in us that, our old Adam being put to death, we may rise to a new and better life, to the praise and glory of Your name.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Almighty God and heavenly Father, You have promised to hear and answer our requests which we make to you in the name of Your beloved Son, Jesus Christ our Lord. We are further taught by Him and His apostles to gather together in His name, with the promise that He will be among us and will intercede for us before You, that we may receive and obtain all things on which we are agreed on earth. You bid us pray, first, for those whom you have set up over us, our leaders and governors. Next, for the needs of all Your people, and of all men everywhere. Therefore, trusting in Your holy truth and in Your promise, and being assembled here before You in Jesus’ name, we lovingly beseech You, our God and Father, in Your infinite mercy, freely to pardon our transgressions, and so to lift our thoughts and desires to You that we may heartily call upon You according to Your good will and pleasure. We therefore pray, heavenly Father, for all princes and lords, Your servants to whom you have committed the rule of justice. Most particularly do we pray for the rulers of this city, that you will endue them with Your Spirit, who alone is gracious and sovereign, and daily increase His gifts in them, that they, acknowledging Your Son Jesus Christ to be King of kings and Lord of lords, with full power in heaven and on earth, may seek to serve Him and exalt His reign in all their dominions, and may according to Your will, guide and govern their subjects, who are the work of Your hands and the sheep of Your pasture. And may we, Your people, here and everywhere, being kept in peace and tranquility, serve You in holiness and righteousness. And, free from the fear of our enemies, may be give You praise all our days. We pray also, true Father and Saviour, for all whom You have ordained as pastors to Your people, who have the care of souls and the administration of Your holy gospel. May You lead and direct them by Your Holy Spirit, that they may be found faithful and true ministers of Your glory, always striving to gather and bring home the erring and wayward sheep to the Lord Jesus Christ, our chief Shepherd and principal Bishop, that they might daily prosper and grow in Him in all righteousness and holiness. Grant, moreover, that all churches may be delivered from the mouths or ravening wolves and hirelings, who follow their own purposes and ambitions, and have no care fore the honour of Your holy name and the welfare of Your flock. Next we pray, most gracious God and merciful Father, for all men generally. Since you desire all men to acknowledge You as Saviour of the world, through the redemption won by our Lord Jesus Christ, may those who do not know Him, being in darkness and captive to ignorance and error– may they by the light of Your Holy Spirit and the preaching of Your gospel, be led into the way of salvation, which is to know You, the only true God, and Jesus Christ whom you have sent. May those whom You have already visited with Your grace, and enlightened by the knowledge of Your Word, grow in all goodness, enriched by Your spiritual blessing, so that together we may all worship You with heart and voice, giving honour and homage to Christ, our Master, King and Lawgiver. Likewise, O God of all comfort, we commend to You all whom You visit and chastise with cross and tribulation, whether it be through poverty or prison, sickness or exile, or affliction of body or mind. May You make known to them Your fatherly love, and assure them that their chastisement is for amendment of life. And may they with willing heart turn to You and, being converted, receive Your comfort, being delivered from every distress. Finally, O God and Father, grant also that we, who are gathered here in Jesus’ name to hear His Word, may, without dissembling or hypocrisy, acknowledge that by nature we are lost, that we deserve Your punishment, and daily heap up condemnation to ourselves by our wretched and unruly lives. Help us to see that in us there is nothing good, and that flesh and blood can never inherit Your kingdom. May be gladly and with steadfast trust submit to your Lord Jesus Christ, our only Saviour and Redeemer. And may He so live in us that, our old Adam being put to death, we may rise to a new and better life, to the praise and glory of Your name.”

<main class="wrap"><figure class="quote" id="q-1609803b37" data-kw="">
<blockquote><p>Further, The inclination of thy heart towards fruitless and unprofitable creatures does fore-preach to thee the inclination of the heart of God towards thee in the Judgment: If thou hast either cow or any other beast that is now unprofitable to thee, though thou mayst suffer them for some time to be with thee, as God suffers sinners in the world, yet all this while thy heart is not with them, but thou wilt take thy time to clear thy hands of them. Why, just so shall thy judgment be as God says, ‘Though Moses and Samuel stood before Me,’ that is, to pray Me to spare this people, ‘yet my heart could not be towards them; therefore cast them out of my sight and let them go forth.’ Jer. 15:1; Eze. 14:13-14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Resurrection of the Dead, and Eternal Judgment</cite>, ... (London: Smith, 1665), p. 119</span></figcaption>

<blockquote><p>‘For He abounds in pardoning.’ Now, because it is difficult to remove terror from trembling minds, Isaiah draws all argument from the nature of God, that He will be ready to pardon and to be reconciled. Thus the Holy Spirit dwells on this part of doctrine, because we always doubt whether or not God is willing to pardon us; for, although we entertain some thoughts of his mercy, yet we do not venture fully to believe that, it belongs to us. It is not without reason, therefore, that this clause is added, that we may not be hindered by uncertainty or doubt as to his infinite compassion toward us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah</cite>, 55:7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-30c6bb1512" data-kw="">
<blockquote><p>Thus, gratia Dei [the grace of God] is that perfection or attribute according to which God, out of a totally gracious and unmerited love, is conceived as willing to communicate himself to his creatures. (Rijssen, Summa Theol., III.xliii) Considered as affective, as ratione actus interni in Deo [a rule of the internal act in God], grace is a propensity of the divine will–while considered as effective it is the gifts of the Spirit graciously given to us by God, either the ordinary gifts of faith, hope, and love or the extraordinary gifts bestowed upon the church for its edification. (Rijssen, Summa theol., III.xliii.)</p></blockquote>

</figure><figure class="quote" id="q-cdcac0f5d7" data-kw="">
<blockquote><p>When love is attributed to God in Scripture, it does not mean a passion or an affect, for God is dispassionate [ἀπαθής], the freest, the most blissful, the most blessed, the most perfect. Nothing slavish happens to Him, nothing lowly, and finally nothing that indicates any imperfection. But God’s love denotes three completely, perfect things: eternal benevolence, actual beneficence, and actual delight in the thing loved. For he who loves something is well-disposed towards it, does it whatever good he is capable of, and delights in it. These three things are found in the love of God. Now this love is first the love of God in Himself, and then towards his creatures. For God loves Himself and above all things: the Father: the Son and the Holy Spirit; the Son: the Father and the Holy Spirit, and the Holy Spirit: the Father and the Son. God’s love for his creatures is first general and then special. That general love is the one by which He fully embraces all things created by Him, blesses them, and preserves and sustains them. In this way there is no one, no man, and no devil either, who can say that He is not loved by God. The special love is that by which alone He leads the elect to eternal life, as He acknowledges them to be his own children in Christ: this passage [Mal. 1:2] here must be understood from this special love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Analysis of the Book of the Prophet Malachi</cite>, (Basil: Waldkirch, 1597), p. 10 tr. Damianus Cathedralulus (Domke), “Reading the Book of Malachi with Polanus #2,” A Bear to be Loved: Thoughts on Zacharias Ursinus and Amandus Polanus (blog), March 18, 2023</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“When love is attributed to God in Scripture, it does not mean a passion or an affect, for God is dispassionate [ἀπαθής], the freest, the most blissful, the most blessed, the most perfect. Nothing slavish happens to Him, nothing lowly, and finally nothing that indicates any imperfection. But God’s love denotes three completely, perfect things: eternal benevolence, actual beneficence, and actual delight in the thing loved. For he who loves something is well-disposed towards it, does it whatever good he is capable of, and delights in it. These three things are found in the love of God. Now this love is first the love of God in Himself, and then towards his creatures. For God loves Himself and above all things: the Father: the Son and the Holy Spirit; the Son: the Father and the Holy Spirit, and the Holy Spirit: the Father and the Son. God’s love for his creatures is first general and then special. That general love is the one by which He fully embraces all things created by Him, blesses them, and preserves and sustains them. In this way there is no one, no man, and no devil either, who can say that He is not loved by God. The special love is that by which alone He leads the elect to eternal life, as He acknowledges them to be his own children in Christ: this passage [Mal. 1:2] here must be understood from this special love.”

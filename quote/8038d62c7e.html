<main class="wrap"><figure class="quote" id="q-8038d62c7e" data-kw="">
<blockquote><p>Thus today, at least some who are called Lutherans stand against ubiquity; against it is whatever remains of Christians in the whole world, including Easterners, Greeks, pontificians, and Calvinists. It is not without reason that a man of great judgment, M. Anton. de Dominis [d. 1624], wrote in his seventh book, ch. 11, n. 5, ‘The ubiquity of Christ’s body is even more absurd and impossible than transubstantiation; every good theologian will always reject it. To assert it is not the work of a good philosopher or a good theologian.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-calixt.html">George Calixt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>sect. 35-46 in Judgment on Theological Controversies agitated between the Lutherans &amp; Reformed, and on the mutual brotherhood and tolerance of parties because of consensus in the fundamentals</cite>, tr. by AI by WesternCatholike (1650; Leiden, 1652), pp. 13-17 Latin, p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

<blockquote><p>Paul Stein, one of Landgrave Maurice’s chaplains at Kassel, made his debut as an irenicist when he published a sermon on Lutheran-Reformed unity which he had earlier delivered before the landgrave and Duke Frederick-Ulrich of Brunswick-Luneburg. He also authored a three-volume treatise entitled Evangelical Church Unity, printed in 1622/23.</p></blockquote>

</figure><figure class="quote" id="q-24523dec6b" data-kw="">
<blockquote><p>XI… Nor do we notice here the more rigid judgments of some of those who take their name from the great Luther, who, carried away by sinister prejudices, are accustomed to attack us. For however harshly they may have treated us, we do not cease to honor them with brotherly affection. And if, their prejudices and private affections being laid aside, they would seriously examine the thing itself by the law of love, truth and Christian prudence, they would not be so much averse to a pious syncretism and reconciliation with us, or at least a mutual toleration, to which not a few of the more moderate among them are not indisposed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 18th Topic, question 15, “Are the evangelical and Reformed churches true churches of Christ?, p. 143</span></figcaption>

<main class="wrap"><figure class="quote" id="q-c734929aa3" data-kw="">
<blockquote><p>According to the Westminster Confession, ‘It pleased God the Father, Son, and Holy Ghost, for the manifestation of the glory of His eternal power, wisdom, and goodness, in the beginning, to create, or make of nothing, the world, and all things therein whether visible or invisible, in the space of six days; and all very good.’ (IV.I) Some scholars have argued that this does not require confessional adherents to believe in six-day creation, even though such a conclusion appears to go against the obvious meaning of the words. This argument does not appear to harmonise with the primary sources, moreover. William Gouge, an important member of the Westminster Assembly, argues that the seventh-day of the creation week lasted for twenty-four hours and maintains that this was also the length of the other days:

3. Q. Of how many hours doth the Sabbath day consist?

A. Of four and twenty. Gen. 2.3.

The Sabbath is called the seventh day: so as it is a seventh part of the week: therefore so many hours as make up every of the other days (which are four and twenty) must be accounted to this day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s sanctification</cite>, (London, 1641), p. 2.</span></figcaption>

<blockquote><p>Writing to Queen Elizabeth I of England, Peter Martyr reminded her that it was the duty of the civil magistrate to put the advance of Christ’s kingdom before all other things:

For it behoveth that you restore again in this place the holy Gospel of Christ, which through injury of the times and importunity of the adversaries, hath lien some years past neglected, I will not say trodden under foot. This if you shall perform, all things shall happen prosperously unto you, no less than they did unto most godly king David. For it be said unto every Christian man, that he should first seek the kingdom of God, then other things should easily be supplied, shall we not think that the same is commanded unto kings? Certes, if it be commanded all men to worship God most sincerely, kings are not exempted from the precept: nay rather the greater estate they bear amongst men, the more are they bound to that law of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An epistle to the most renowned Princess Elizabeth by the grace of God Queen of England, France and Ireland, Grace and everlasting happyness from God the Father through Jesus Christ our Saviour (1558) in W. J. T. Kirby (ed.), The Zürich connection and Tudor political theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

t-the-kingdom-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-5dfefbec93" data-kw="">
<blockquote><p>In the second half of the seventeenth century, the Viennese nobility introduced French fashion as a consumption pattern for Austrian elites. Beaver and vicuña hats, made of raw materials from Canada, Peru, West Africa, the Sudan and the Levant, were part and parcel of the new French fashion. French hats were globalized commodities appreciated throughout Europe, although the globalized nature and composition of the product remained completely invisible. This article considers Vienna as a remote area, far from the booming and, in historiography, well-explored European Atlantic ports and capitals, and investigates how Vienna participated in particular global fashion trends. Specifically, it focuses on the social and economic impact of hats as a globalized consumer good on the local Viennese market. Based on an extensive analysis of archival sources, the article sheds light on consumption patterns of elites, practices of the trade in hats, and the consequences of the globalized hat market for local craft production. The globalization of the hat market entailed the immigration of fully trained hatters. Skilled craftsmen from France and Italy introduced new processing methods in Vienna, but this did not result in the dissemination of knowledge. The continuing demand for hats in Vienna stoked a large increase in imports of finished or semi-finished hats, which in turn fostered the emergence of new branches of activity for the accoutrement and selling of these products.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/veronika-hyden-hanscho.html">Veronika Hyden-Hanscho</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Invisible Globalization: French Hats in Habsburg Vienna</cite>, 1650-1750′ Journal of European Economic History (3 / 2016), pp. 11-54</span></figcaption>

<blockquote><p>It hath been pretended, the language and manner of these psalms are not suited to the spiritual nature of our gospel-worship. That, however, may as well be urged against the reading of them, as against the singing of them:

Nay, against the reading of a great part of the Old Testament in our Christian worship. It is certain many passages in the book of Psalms, or of other scripture-songs, are expressive of the exercises of faith, repentance, love, or the like graces, which still remain of the same form as under the Old Testament.

The predictions are either accomplished, and so may be sung to the honour of GOD’S mercy and faithfulness; or, if not accomplished, may be sung in the hopes [sic], that God will accomplish them in his time. The history of what God did for his Jewish servants and church, may be sung with admiration of his love, wisdom, power, and grace therein manifested. It is further to be considered, that much of what related to David, or the Jewish church, was typical of the character and concerns of Jesus Christ and the gospel-church; and so ought to be sung with special application thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms of David, in Metre: allowed by the authority of the General Assembly of the Church of Scotland, and of the Presbyterian Churches in</cite>, America. With notes exhibiting the connexion, explaining the sense, and for directing and animating devotion (Pittsburgh, 1812), v.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Though God in mercy can distinguish between his own and ours, and does not count the whole worship to be in vain where any degree of superstition is mixed (for then most zealous persons were undone), yet the superstitious part of worship is always in vain; And all the rest is made as vain where that is the predominant and denominating part. Thus overdoing is undoing, and thus the superstitious are (materially) righteous overmuch.</p></blockquote>

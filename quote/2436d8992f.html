<main class="wrap"><figure class="quote" id="q-2436d8992f" data-kw="">
<blockquote><p>That popish device of a second justification is a satanical delusion for the Word of God does acknowledge no more but one justification at all, and that absolute and complete of itself. There is but one justice, but one satisfaction of God being offended. Therefore, there cannot be a manifold justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, 6:234.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<blockquote><p>That objection of Durandus would have force if God rendered the reward to good works out of commutative justice; but since God has decreed to give rewards to those who work well out of distributive justice, it is not necessary that we properly give him anything. For neither do those who run for the prize give anything to the king, and yet the king is bound to give the prize to him who has outstripped the rest in the race. Let it stand, therefore, that the good works of the just merit eternal life out of justice, and so ex condigno.</p></blockquote>

<blockquote><p>5. Because the righteousness of Christ is imputed to us, indeed, because Christ died for us, i.e., in our place and stead, as sponsor and surety, He was made a curse for us, and sustained in Himself the malediction and penalty of the violated Law due to us. From which necessarily flowed from Christ to us surety-righteousness, or such as a sponsor renders for debtors. But this is imputed righteousness.</p></blockquote>

</figure><figure class="quote" id="q-8188017693" data-kw="">
<blockquote><p>Article 11, ‘We are accounted righteous before God only for the Merit of our Lord and Savior Jesus Christ, and not for our own works or deservings: wherefore that we are justified by faith only, is a most wholesome doctrine, etc.’ Exposition: Though he that does righteousness is righteous, and the Scripture throughout and frequently mentions an inherent personal righteousness necessary to salvation, yet this is no universal righteousness, nor such as will justify us according to the Law of Innocency or Works; but is merely subordinate to the merit and efficacy of the sacrifice and righteousness of Christ, which only merits for us as a price, our faith being only the requisite (yet given) moral qualification for the reception of the free gift of pardon, justification and adoption, and has not the least part of the office or honor of Christ; yet are Christ’s words true, that by men’s words they shall be justified or condemned: And all men shall be judged according to their works: And James truly says that by works a man is justified, and not by faith only: Not by works of perfection or of Moses’s Law, nor any that as a price or commutation do make the reward to be of debt, and not of grace; but by a practical faith or Christianity: such acts as faith it self is, and prove our belief to be such as Christ has promised justification and salvation to; such as by justifying belief to be sincere, do justify the person against the charge of infidelity, hypocrisy, impenitence and ungodliness, Christianity is that faith which Paul opposes to works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>R. Baxter’s Sense of the Subscribed</cite>, [Anglican, 39] Articles of Religion (London: Cox, 1689), 11th Article, Of the Justification of Man, pp. 7-8</span></figcaption>

<blockquote><p>29. Furthermore, we do not say that the Gospel and the New Testament demand no condition at all, for the condition of faith and new obedience (which is everywhere impressed on us) is demanded. But God provides these conditions freely, and their imperfect quality forms no hinderance to salvation (which flows from another source), so long as they are genuine.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-826115b327" data-kw="">
<blockquote><p>…we shall premise some common and known truths concerning Church-judicatories and their decrees and sentences, as:

1. That (to express it in Calvin’s words, in the eighth chapter of the fourth book of his Institutions) whatsoever reverence or dignity is by the Spirit of God in the Scriptures given, whether to the priests, or prophets, or apostles, or their successors, all of it is given not properly to men themselves, but to the ministry, wherewith they are clothed; or (to speak more expeditely) to the Word; the ministry whereof is committed unto them, Ex. 3:4; 14:31; Deut. 17:•; Mal. 2:46; Deut. 17:10; Eze. 3:17; Jer. 23:28; Jer. 1:6; Mt. 28:19; Acts 15:10; etc.

2. That as their authority is founded upon, and wholly derived from the Word of God, so in the administration and exercise thereof, they are in all things to walk according to this rule, Isa. 8:19-20; Mal. 2:6-7; Mt. 28:19.

3. That Church-power is not a lordly and magisterial power, but a lowly and ministerial-power, not an absolute and autocratoric, but a limited and hyperetic-[below-kind-of-]power; and that Church decrees and sentences are all of them regulae regulatae, [rules being regulated] rules that are subordinated, and do not bind but in the Lord, and so far as they are conform to that first inflexible and unerring-rule, prescribed by Himself, Lk. 22:24-27; Gal. 6:16; 1 Peter 5:2-3; 1 Tim. 3:15-17; 1 Thess. 5:12; Eph. 6:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them</cite>, … (1658), p. 95-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c37ac5858" data-kw="">
<blockquote><p>What Scripture does warrant, an assembly may not discharge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>At the 1640 General Assembly of the Church of Scotland. Robert Baillie, Letters</cite>, 1.252</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>
<div class="actions"><button class="copy" data-copy="“What Scripture does warrant, an assembly may not discharge.”

— Samuel Rutherford, At the 1640 General Assembly of the Church of Scotland. Robert Baillie, Letters 1.252">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+Scripture+does+warrant%2C+an+assembly+may+not+discharge.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+At+the+1640+General+Assembly+of+the+Church+of+Scotland.+Robert+Baillie%2C+Letters+1.252&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0c37ac5858.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0c37ac5858.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-guilt-innocence-in-breaking-church-ordinances-on-contumacy/#:~:text=What%20Scripture%20does%20warrant%2C%20an%20assembly%20may%20not%20discharge" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-39ccd92681" data-kw="Councils">
<blockquote><p>The authority of councils sinks far below that of the Scriptures, nor do their decisions bind the conscience any further than they appear to be conformed to the word of God. Hence a judgment belongs to them in matters of faith; not authoritative, infallible and supreme, but subaltern and ministerial; obligatory as to the external order of ecclesiastical communion and which ought to be of great weight among all the pious, but not as to faith and conscience, except insofar as they coincide with the Scriptures, which alone can bind the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.14</span></figcaption>

</figure><figure class="quote" id="q-5bb02d34fe" data-kw="">
<blockquote><p>Calvin, Beza, yea, all our writers condemn blind obedience as brutish… …concerns his conscience, knowing that he must do it in faith as he does all his moral actions; Ergo [Therefore], the magistrate must examine what he practices in his office, according to the Word, and must not take it upon the mere authority of the Church, else his faith in these moral acts of his office should be resolved ultimately on the authority of the Church, not on the Word of God, which no doubt is Popery; for so the warrant of the magistrate’s conscience should not be, ‘Thus saith the Lord,’ but ‘Thus saith the Church in their decrees.’ … 2. It’s against Scripture and reason that… all others, should obey the decrees of the Church with a blind faith, without inquiring in the warrants and grounds of their decrees, which is as good Popery as magistrates and all men are to believe as the Church believes with an implicit faith; so ignorance shall be the mother of devotion; Whoever impute[s] this to us, who have suffered for non-conformity, and upon this ground, that synods can err… … Thus they are servants and slaves who are obliged to follow the judgment of councils absolutely, without limitation; and because they say it, whether they warrant their decrees by the Word of God or not, that is a true major proposition: But now the assumption is most false, for neither magistrates nor any other are to follow the judgment of the Church absolutely, without limitation, and because they say it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), pp. 595-9</span></figcaption>

</figure><figure class="quote" id="q-1e1630c6fb" data-kw="">
<blockquote><p>1 Cor. 6:12, ‘All things (indifferent) are lawful in themselves, but they are not expedient,’ if we be brought under the power or band of them by law. Therefore, in the means of worship, not only must we see what is lawful, but also what is profitable and conducing to the end… 1 Cor. 7:6, ‘But this I speak by permission, not of commandment.’ Therefore in things in which God has granted us liberty, to do or not to do, permission has place, not obliging necessity or penal laws. 13th Proposition. There cannot be commanding laws in things that are politicly good or evil according to the individual complexion, temperature, or gifts of singular men: [for example] to marry or not to marry, cannot be commanded, for where God looses, no power on earth can bind, v. 33. 1 Cor. 8:7, Paul condemns them in the use of their Christian liberty, ‘Howbeit there be not in every man this knowledge;’ then that rulers may make laws in things indifferent, without scandal, they must remove ignorance. 2. If there be but one person weak in knowledge (there is not in every man that knowledge), a law obliging all in things indifferent cannot be made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), Appendix, Question 1, pp. 6-7</span></figcaption>

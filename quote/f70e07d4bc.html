<main class="wrap"><figure class="quote" id="q-f70e07d4bc" data-kw="">
<blockquote><p>If, then, the Holy Spirit is truly, and not in name only, called Divine both by Scripture and by our Fathers, what ground is left for those who oppose the glory of the Spirit? He is Divine, and absolutely good, and Omnipotent, and wise, and glorious, and eternal; He is everything of this kind that can be named to raise our thoughts to the grandeur of His being. The singleness of the subject of these properties testifies that He does not possess them in a measure only, as if we could imagine that He was one thing in His very substance, but became another by the presence of the aforesaid qualities.

That condition is peculiar to those beings who have been given a composite nature; whereas the Holy Spirit is single and simple in every respect equally. This is allowed by all; the man who denies it does not exist. If, then, there is but one simple and single definition of His being, the good which He possesses is not an acquired good; but, whatever He may be besides, He is Himself Goodness, and Wisdom, and Power, and Sanctification, and Righteousness, and Everlastingness, and Imperishability, and every name that is lofty, and elevating above other names.

What, then, is the state of mind that leads these men, who do not fear the fearful sentence passed upon the blasphemy against the Holy Ghost, to maintain that such a Being does not possess glory? For they clearly put that statement forward; that we ought not to believe that He should be glorified: though I know not for what reason they judge it to be expedient not to confess the true nature of that which is essentially glorious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-nyssen.html">Gregory of Nyssa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Holy Spirit. Against the Followers of Macedonius</cite>, (c. 380) in Nicene and Post-Nicene Fathers 2, 5: 316-17.</span></figcaption>

<blockquote><p>Therefore, Scripture considers three persons in God, who are one God. The Father is indeed the source and principle of divinity, the Son is the Word and Wisdom of the Father, begotten from eternity and without beginning in time, and the Holy Spirit is the divine power proceeding from the Father and the Son.</p></blockquote>

</figure><figure class="quote" id="q-235d18e0d8" data-kw="">
<blockquote><p>20. Q. Doth the Holy Ghost proceed only from the Father?

A. No: But also from the Son, he is therefore called the Spirit of Christ. Rom. 8.9. But ye are not in the Flesh, but in the Spirit, if so be that the Spirit of God dwell in you. Now if any Man have not the Spirit of Christ, he is none of his. AND THE SPIRIT OF THE SON. Gal. 4.6. And because ye are Sons, God hath sent forth the Spirit of his Son into your Hearts, crying, Abba, Father.

21. Q. Is not the Holy Ghost, only a Power, or Attribute of God?

A. No: But an actual Person, having Understanding and Will. 1 Cor. 2.10. For the Spirit searcheth all Things, yea the deep Things of God. Chap. 12.11. But all these worketh that one and the self-same Spirit, dividing to every Man severally as he will. He also appeared at the Baptism of Christ, Matt. 3.16. And Jesus when he was baptized, went up straightway out of the Water: And lo, the Heavens were opened unto him, and be saw the SPIRIT of GOD descending like a Dove, and lighting upon him.

22. Q. Is he also a distinct Person?

A. Yes; He is expressly called, another, John 14.16, 17. And I will pray the Father, and he shall give you another Comforter that he may abide with you for ever; even the Spirit of Truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/abraham-hellenbroek.html">Abraham Hellenbroek</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Specimen of divine truths, fitted for the use of those, of various capacities, who desire to prepare themselves for a due confession of their faith, trans. Reformed Protestant Dutch Church of the City of New York</cite>, (New York: John Holt, 1765), pp 25-26.</span></figcaption>

</figure><figure class="quote" id="q-67d7d97470" data-kw="">
<blockquote><p>It is the special office of the Spirit to convince the world of sin; to reveal Christ, to regenerate the soul, to lead men to the exercise of faith and repentance; to dwell in those whom He thus renews, as a principle of a new and divine life. By this indwelling of the Spirit, believers are united to Christ, and to one another, so that they form one body. This is the foundation of the communion of saints, making them one in faith, one in love, one in their inward life, and one in their hopes and final destiny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, pt. 1, ch. 8, “The Holy Spirit”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

</figure><figure class="quote" id="q-c9ff42a636" data-kw="">
<blockquote><p>At the same time, as he works not effectually in all, but only where the Spirit, the inward teacher, illuminates the heart, he subjoins, to every one who believes. The gospel is indeed offered to all for their salvation but the power of it appears not everywhere: and that it is the savor of death to the ungodly, does not proceed from what it is, but from their own wickedness. By setting forth but one salvation he cuts off every other trust. When men withdraw themselves from this one salvation, they find in the gospel a sure proof their own ruin. Since then the gospel invites all to partake of salvation without any difference, it is rightly called the doctrine of salvation: for Christ is there offered, whose peculiar office is to save that which was lost; and those who refuse to be saved by him, shall find him a judge. But everywhere in Scripture the word salvation is simply set in opposition to the word destruction: and hence we must observe, when it is mentioned, what the subject of the discourse is. Since then the gospel delivers from ruin and the curse of endless death, its salvation is eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, 1.16.</span></figcaption>

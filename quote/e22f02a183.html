<main class="wrap"><figure class="quote" id="q-e22f02a183" data-kw="">
<blockquote><p>Question 80, Abortion of a Woman from a Brawl Between Two Men. …Well, the fact that the author [of Exodus] did not want the unborn childbirth to belong to the homicide proves that he thought that it was not man that is carried in the mother’s womb. Here the problem of the soul is usually posed, that is, if what is not formed cannot be said to be animated, and therefore, that it would not be a homicide, since it cannot be affirmed that a being that had not yet had soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Questions on Exodus, on Ex., 21:22</span></figcaption>

</figure><figure class="quote" id="q-cd6d2ebebc" data-kw="">
<blockquote><p>The same command of fruitfulness that was given to man was also given to the land (Gen. 1:11-12; Psalm 107:37; Ezek. 36:29) and was called a blessing (Deut. 7:13; Ezek. 36:19). Is failing to make the land be fruitful every year a “despising of God’s blessings” or a violation of His Dominion Command? Obviously not. The land has been fruitful for six years, and taking a year off (spacing) in no way violates the command. If spacing crops does not violate the identical command to be fruitful and multiply, I fail to see how spacing children (whether by six months, 12 months, or more) violates that command. This is using the analogy of Scripture to understand the command to be fruitful and multiply… the [Levitical] law allowed the land to rest one year in seven… If the woman ‘who has many children has become feeble’ (1 Sam. 2:5), it might be time to let her strengthen… the burden of proof is upon those who say spacing babies is a sin… is it sinful to take days off beyond the Sabbath day in our yearly schedules?… What makes giving a very productive wife some rest from child-bearing a sin? Could this not justify spacing babies by one year or more to provide for the wife’s strength and health, and/or to save up money to be able to pay for the delivery costs of the next baby? Could it not be used to postpone having a child while the wife’s health was in jeopardy? If a woman was having chemotherapy for cancer, the chemo would endanger the baby’s life. This would certainly be a good time to exercise conception control.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’</cite>, (2017)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-30b52f2456" data-kw="">
<blockquote><p>Nor is it of importance to inquire curiously at what time the soul was united to the body, the Logos (Logos) to the flesh. It is enough for us to believe that the human nature from the time it began to be never existed apart from the Logos (Logo), but was assumed by and hypostatically united to him. And if the soul could not be poured into the body unless already organized and completely formed (a point on which physicians are not agreed among themselves), it does not follow that the Logos (Logon) could not at once unite the flesh to himself, since his work could not be constrained either with the soul present or absent. Nor is it more absurd for the body of Christ (not as yet animated) to be united to the Logos (Logo), then for the same (when lifeless in the sepulcher) to remain conjoined with the same (as theologians acknowledge was done in the death of Christ).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 13th Topic, ‘Person &amp; State of Christ’, 11th Question, ‘The Conception &amp; Nativity of Christ…’, section 14, p. 343</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-59aa811627" data-kw="">
<blockquote><p>The human nature of Christ being thus formed in the womb by a creating act of the Holy Spirit, was in the instant of its conception sanctified, and filled with grace according to the measure of its receptivity… And this work of sanctification, or the original infusion of all grace into the human nature of Christ, was the immediate work of the Holy Spirit; which was necessary unto Him: for let the natural faculties of the soul, the mind, will, and affections, be created pure, innocent, undefiled,— as they cannot be otherwise immediately created of God,— yet there is not enough to enable any rational creature to live to God; much less was it all that was in Jesus Christ.</p></blockquote>

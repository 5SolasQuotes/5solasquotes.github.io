<blockquote><p>In the criminal and judicial law of the Jews, we are struck not only with the clear principle to which we have referred, but also, and even still more, with the number of offences to which is affixed the punishment of death. Among these were Sabbath-breaking (Exod. xxxv; Numb. xv. 32); idolatry, (Exod. xxxii. 27); devoting children to Moloch (Lev. xx. 2); cursing parents (Lev. xx. 9); adultery (Lev. xx. 10); incest (Lev. xx. 11); bestiality (Lev. xx. 15, 16); witchcraft (Lev. xx. 6, 27); whoredom in a priest’s daughter (Lev. xxi. 9); blasphemy (Lev. xxiv. 10-16); murder (Lev. xxiv. 17); daring presumptuous disobedience (Numb. xv. 30, 31; Deut. xvi. 12.) – an example of it in Numb. xvi., passim; killing sacrifices privately, and not in the appointed place (Lev. xvii. 4, 8, 9); eating blood (Lev. xvii. 10, 14); prophesying falsely (Deut. xiii. 5, xviii. 20); enticing to idolatry (Deut. xiii. 6-11); stubborn rebellion against a father (Deut. xxi. 18-21); not being found a virgin at marriage (Deut. xxii. 21); stealing an Israelite to sell him (Deut. xxiv. 7).

In all these cases there is an obvious violation of the most sacred and intimate bonds that bind men to God, and to each other; on which bonds all religion and morality essentially depend. The law, therefore, declared the offenders in these points worthy of death.

Such strict justice in criminal law is right on two accounts –

1. Because it is of the very essence of law to enjoin what is purely right, and absolutely to prohibit what is wrong. Hence, the divine law is characterized as holy, just, and good; not holy and good in the sense of these two attributes qualifying or modifying the other, but that it is perfectly holy, and just, and good, at the same time, and in equal degree.

2. Because in this way it hold up continually, before all men, the rule and example of perfect righteousness, both in its enactments and penalties. Who does not see that it would be most injurious were law in any way to overlook or confound right and wrong – injurious even to the very moral sense of men, and, therefore, deeply so to the order and peace of society; and that the law with its penalties ought to stand forth as the perfect model and rule of justice, to which all may look and appeal, for the determination of all questions of right and wrong? Criminal law, especially, ought to be purely and strictly just.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a299d3c350" data-kw="">
<blockquote><p>Conclusion 1: This civil coercive power is not only unnecessary, but unlawful to be exercised in the planting of the Church, and bringing men to the faith of Christ. Churches are not to be planted by weapons, but by doctrines (Lactantius, Institutes, bk. 5, ch. 20); not by the power of the sword, but by the efficacy of the Word; not by carnal weapons, but by spiritual means. The commission that Christ gave his apostles for the spreading and planting of the Gospel was only this, ‘Go and teach all nations, baptizing them in the name of the Father, and of the Son and of the Holy Ghost,’ Mt. 28:19-20, the like, in Mk. 16:15. And Christ tells us his kingdom is not of this world, for then his servants would fight for him, Jn. 18:36, but that was not the way to plant or advance his kingdom. Christ has no need of such carnal weapons for the planting of his Church, or the settling Him in his kingdom: the apostles had a warfare to fight, but the weapons of their warfare were not carnal, but spiritual, and yet strong to pull down the strongest holds of sin and Satan, and to bring every thought in obedience to Christ, 2 Cor. 10:3-4. They had a sword to wield, but that sword was no other but the Word of God, the sword of the Spirit, Eph. 6:17; Rev. 19:15. Here were armies to subdue even nations to Christ, but these were armies of teachers, not of soldiers, as the Psalmist alludes, Ps. 68:11. External force is not the way of Christ for the spreading his Gospel, and planting of his kingdom: It is true here, Religio suaderi potest, cogi non potest, ‘Men may be persuaded into a religion, but they can never be compelled.’ All externall acts of power are not able to beget internal acts of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, (London: Miller, 1646), p. 326</span></figcaption>

<blockquote><p>closed with the Presbyterian in the beginning of the rebellion, took the [Solemn League &amp;] Covenant [1643], sided with the Independents, became a great creature of the long parliament by whose authority he was made tutor to James, Duke of York [would later be King James II], and an active person against his sovereign [King Charles I]”. Ascham was murdered by royalists in Spain. Wiki: “His first published work was A Discourse… This appeared in 1648, probably in July at the height of the political uncertainty engendered by the second Civil War. The previous month the Army had shown that it wielded both political and military power and Ascham’s Discourse was widely seen as a defense of the Army as the conquering power, and as a plea for “the rank of the people” to adopt a position of political quiescence. Parliament’s ultimate victory and the establishment of the Commonwealth posed a problem for those who felt unable to accept the legality of the new government but were now being required to give it their allegiance, and also for those who regarded their oath of allegiance to King Charles I… as a solemn oath to God that could not be broken. One argument, provided by a group of political theorists variously called the Engagers, or de facto theorists, was to argue that an individual could give their obedience to the de facto government in being simply because it was in power. For many such a theory was deeply shocking since it emphasized power at the expense of authority, and subordinated allegiance to self-interest. The debate was initiated by Francis Rous who published a brief pamphlet in April 1649 [The Lawfulness of Obeying the Present Government] in which he argued that allegiance could be given to the Commonwealth even though it were acknowledged to be an illegal power. It was a radical shift in the basis of the argument that was to be followed through by theorists engaged in the debate on de facto government. In the debate that followed Ascham played a major part in developing a theory of political obligation to the de facto power. In 1649 it is possible that he was author of a short anonymous pamphlet, A Combate between Two Seconds. One for Obeying the Present Government. The Other the second part of a Demurrer undeservedly called Religious, which was published in July. This work firstly took issue with those whose arguments continued to be based on Romans 13:1–2 and in particular addressed the arguments in an anonymous work that may have been published in two parts, but that is extant only in its second part entitled The Second Part of the Religious Demurrer; and secondly bypassed the critical emphasis on Romans 13:1–2 to develop arguments based on the need to protect oneself from chaos, as originally deployed by Ascham in his 1648 Discourse. Having thus entered the pamphlet “war”, Ascham then began to expand his arguments. He was certainly the author of a longer pamphlet, The Bounds and Bonds of Publique Obedience, which appeared in August 1649; and by November he had added nine chapters to his 1648 Discourse, which now appeared under the title Of the Confusions and Revolutions of Government. This work attracted the attention of Robert Sanderson who criticized it in a short and pungent pamphlet [Resolutions of Conscience (by a learned Divine) in answer to a letter sent with Mr. Ascham’s Book, Treating, How farre it may be lawful to submit to an Usurped Power.]. Ascham’s Reply to a paper of Dr. Sanderson’s, containing a censure of Mr. A. A. his book of the Confusions and Revolution of Government, which was published on 9 January 1650, was directed as much as against Edward Gee‘s Exercitation concerning usurped powers as against Sanderson’s work. In these works Ascham’s essential argument was that in a situation in which people had to look after their own safety, they were justified in giving their allegiance to any power that was capable of protecting them, whatever the legality of its title to power. By the autumn of 1649 the debate began to center on the specific question of the Oath of Allegiance and the Engagement to the Commonwealth: Two Acts of Parliament were passed requiring people to take an Oath of Allegiance to the Commonwealth, on 11/12 October 1649, and on 2 January 1650. Conventionally oaths were regarded as “the strictest ties and obligations that a man can be under”. For many the Engagement to the Commonwealth was impossible to take because it overrode their prior obligation to the monarchy (King Charles I and his heirs). The Presbyterian Richard Baxter held that he “could not judge it seemly for him that believed there is a God to play fast and loose with a dreadful oath”. (Reliquiae Baxterianae, London, 1696, p. 54) In contrast, Ascham argued that all oaths involved tacit conditions, of which the ability of the government to protect the people was the main one. A government that could not protect its people lost the right to their allegiance. Ascham’s 1648 Discourse was to be republished, anonymously, following the ousting of King James II [in 1688/9]. Then the question of the legality of the oath of allegiance to King William and Queen Mary [in the Glorious Revolution] had come to the fore. It did not, however, generate any discussion. By then the leading theorist in the field was Thomas Hobbes, whose De Corpore Politico, De Cive (first edition), and Leviathan, had systematized a coherent and secular defense of the contract as between ruler and ruled.</p></blockquote>

 the legality of its title to power. By the autumn of 1649 the debate began to center on the specific question of the Oath of Allegiance and the Engagement to the Commonwealth: Two Acts of Parliament were passed requiring people to take an Oath of Allegiance to the Commonwealth, on 11/12 October 1649, and on 2 January 1650. Conventionally oaths were regarded as “the strictest ties and obligations that a man can be under”. For many the Engagement to the Commonwealth was impossible to take because it overrode their prior obligation to the monarchy (King Charles I and his heirs). The Presbyterian Richard Baxter held that he “could not judge it seemly for him that believed there is a God to play fast and loose with a dreadful oath”. (Reliquiae Baxterianae, London, 1696, p. 54) In contrast, Ascham argued that all oaths involved tacit conditions, of which the ability of the government to protect the people was the main one. A government that could not protect its people lost the right to their allegiance. Ascham’s 1648 Discourse was to be republished, anonymously, following the ousting of King James II [in 1688/9]. Then the question of the legality of the oath of allegiance to King William and Queen Mary [in the Glorious Revolution] had come to the fore. It did not, however, generate any discussion. By then the leading theorist in the field was Thomas Hobbes, whose De Corpore Politico, De Cive (first edition), and Leviathan, had systematized a coherent and secular defense of the contract as between ruler and ruled.”

+in+April+1649+%5BThe+Lawfulness+of+Obeying+the+Present+Government%5D+in+which+he+argued+that+allegiance+could+be+given+to+the+Commonwealth+even+though+it+were+acknowledged+to+be+an+illegal+power.+It+was+a+radical+shift+in+the+basis+of+the+argument+that+was+to+be+followed+through+by+theorists+engaged+in+the+debate+on+de+facto+government.+In+the+debate+that+followed+Ascham+played+a+major+part+in+developing+a+theory+of+political+obligation+to+the+de+facto+power.+In+1649+it+is+possible+that+he+was+author+of+a+short+anonymous+pamphlet%2C+A+Combate+between+Two+Seconds.+One+for+Obeying+the+Present+Government.+The+Other+the+second+part+of+a+Demurrer+undeservedly+called+Religious%2C+which+was+published+in+July.+This+work+firstly+took+issue+with+those+whose+arguments+continued+to+be+based+on+Romans+13%3A1%E2%80%932+and+in+particular+addressed+the+arguments+in+an+anonymous+work+that+may+have+been+published+in+two+parts%2C+but+that+is+extant+only+in+its+second+part+entitled+The+Second+Part+of+the+Religious+Demurrer%3B+and+secondly+bypassed+the+critical+emphasis+on+Romans+13%3A1%E2%80%932+to+develop+arguments+based+on+the+need+to+protect+oneself+from+chaos%2C+as+originally+deployed+by+Ascham+in+his+1648+Discourse.+Having+thus+entered+the+pamphlet+%E2%80%9Cwar%E2%80%9D%2C+Ascham+then+began+to+expand+his+arguments.+He+was+certainly+the+author+of+a+longer+pamphlet%2C+The+Bounds+and+Bonds+of+Publique+Obedience%2C+which+appeared+in+August+1649%3B+and+by+November+he+had+added+nine+chapters+to+his+1648+Discourse%2C+which+now+appeared+under+the+title+Of+the+Confusions+and+Revolutions+of+Government.+This+work+attracted+the+attention+of+Robert+Sanderson+who+criticized+it+in+a+short+and+pungent+pamphlet+%5BResolutions+of+Conscience+%28by+a+learned+Divine%29+in+answer+to+a+letter+sent+with+Mr.+Ascham%E2%80%99s+Book%2C+Treating%2C+How+farre+it+may+be+lawful+to+submit+to+an+Usurped+Power.%5D.+Ascham%E2%80%99s+Reply+to+a+paper+of+Dr.+Sanderson%E2%80%99s%2C+containing+a+censure+of+Mr.+A.+A.+his+book+of+the+Confusions+and+Revolution+of+Government%2C+which+was+published+on+9+January+1650%2C+was+directed+as+much+as+against+Edward+Gee%E2%80%98s+Exercitation+concerning+usurped+powers+as+against+Sanderson%E2%80%99s+work.+In+these+works+Ascham%E2%80%99s+essential+argument+was+that+in+a+situation+in+which+people+had+to+look+after+their+own+safety%2C+they+were+justified+in+giving+their+allegiance+to+any+power+that+was+capable+of+protecting+them%2C+whatever+the+legality+of+its+title+to+power.+By+the+autumn+of+1649+the+debate+began+to+center+on+the+specific+question+of+the+Oath+of+Allegiance+and+the+Engagement+to+the+Commonwealth%3A+Two+Acts+of+Parliament+were+passed+requiring+people+to+take+an+Oath+of+Allegiance+to+the+Commonwealth%2C+on+11%2F12+October+1649%2C+and+on+2+January+1650.+Conventionally+oaths+were+regarded+as+%E2%80%9Cthe+strictest+ties+and+obligations+that+a+man+can+be+under%E2%80%9D.+For+many+the+Engagement+to+the+Commonwealth+was+impossible+to+take+because+it+overrode+their+prior+obligation+to+the+monarchy+%28King+Charles+I+and+his+heirs%29.+The+Presbyterian+Richard+Baxter+held+that+he+%E2%80%9Ccould+not+judge+it+seemly+for+him+that+believed+there+is+a+God+to+play+fast+and+loose+with+a+dreadful+oath%E2%80%9D.+%28Reliquiae+Baxterianae%2C+London%2C+1696%2C+p.+54%29+In+contrast%2C+Ascham+argued+that+all+oaths+involved+tacit+conditions%2C+of+which+the+ability+of+the+government+to+protect+the+people+was+the+main+one.+A+government+that+could+not+protect+its+people+lost+the+right+to+their+allegiance.+Ascham%E2%80%99s+1648+Discourse+was+to+be+republished%2C+anonymously%2C+following+the+ousting+of+King+James+II+%5Bin+1688%2F9%5D.+Then+the+question+of+the+legality+of+the+oath+of+allegiance+to+King+William+and+Queen+Mary+%5Bin+the+Glorious+Revolution%5D+had+come+to+the+fore.+It+did+not%2C+however%2C+generate+any+discussion.+By+then+the+leading+theorist+in+the+field+was+Thomas+Hobbes%2C+whose+De+Corpore+Politico%2C+De+Cive+%28first+edition%29%2C+and+Leviathan%2C+had+systematized+a+coherent+and+secular+defense+of+the+contract+as+between+ruler+and+ruled.%E2%80%9D%0A%0A%E2%80%94+Anthony+Ascham%2C+A+Discourse%2C+%E2%80%A6+%28London%2C+1648%29+%7C+Ascham+%28c.+1614%E2%80%931650%29+was+a+was+a+reformed%2C+puritan%2C+British+academic%2C+political+theorist%2C+Parliamentarian+and+diplomat.+According+to+Anthony+Wood%2C+Ascham%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1aa6ad08b7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1aa6ad08b7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-jurisprudence/#:~:text=closed%20with%20the%20Presbyterian%20in%20the,contract%20as%20between%20ruler%20and%20ruled&amp;text=closed%20with%20the%20Presbyterian%20in%20the%20beginning%20of&amp;text=of%20the%20contract%20as%20between%20ruler%20and%20ruled" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…Pilate uses all means to get Jesus loose; he uses the present occasion to that purpose; knowing the use [custom] of the Jews, he would have been glad to have had Jesus set at liberty, above all the prisoners. To speak somewhat of this custom: They had this custom, to get a prisoner set at liberty at festival times, to the honor of their feasts… but therewith they dishonored God. Is that to honor God, to break his commandment?… We know this, there is nothing wherein a prince resembles God more than in clemency; but it is a sin to let a wicked man escape, or that the emperor should let him go; for God’s law says, Dt. 19:11-13, “Thine eye shall not spare the murderer, neither look upon him with a pitiful eye.”… Some will say, has not a free prince license to give him his life, albeit the law of God says, “The murderer shall die the death?”… It is true, indeed, a prince should be loath to put out that life that God has put in, and should beware to judge rashly in capital crimes. It is no small matter to make a crime capital; but if the crime be capital and deadly, the prince has no power to hold his hand aback from execution, and to forgive. Indeed, for weighty and great considerations, a prince may mitigate [lesson] the punishment, but to say he may let the man go free, he has no power. But they will insist further, and say, Is not this on the the judicial laws that was given to the Jews–then what have we to do with it? I answer, these laws, seeing the Jews, and their commonwealth, and laws politic, are abrogate, in so far as they concerned that people, we have nothing ado with them–they are abolished; but for as much as they are grounded upon nature, and natural law, we have ado with them. As for this law, it is natural. Ye know that natural men, ethnics, who had never the law of the Jews, they executed the murderer. But yet they insist, and they will bring in the example of good kings, who forgave capital crimes committed against the very universal and natural law; and namely of David. Forgave he not Joab for slaying of Abner and Amasah? and Amnon, for committing incest? and again, forgave he not Absalom for slaying of Amnon, his brother? But I answer: We are bound to live by God’s laws, and not by examples… Indeed, there is a difference between these crimes that are capital, and the crimes that in their own nature are not capital, but by the laws of princes are made capital; for upon just considerations, the prince has power to dispense with them: as, for example, it was not deadly of the own nature to Shimei to go out of the ports of Jerusalem, but because Solomon forbade it, it became deadly. Like as it is in the hands of princes to make and to change such special laws; so it lies in his hands to forgive such a man transgressing them, upon weighty and great considerations. So, to return, these crimes that are capital by natural law, a prince has no power to remit them, albeith he were ruler of all the world; he derogates to God’s glory. And secondly, if there were no more to let us see that God has not given that power to forgive capital crimes against God’s law and nature, the judgments of God which ceased on such men and their posterity were sufficient to show it…</p></blockquote>

+are+grounded+upon+nature%2C+and+natural+law%2C+we+have+ado+with+them.+As+for+this+law%2C+it+is+natural.+Ye+know+that+natural+men%2C+ethnics%2C+who+had+never+the+law+of+the+Jews%2C+they+executed+the+murderer.+But+yet+they+insist%2C+and+they+will+bring+in+the+example+of+good+kings%2C+who+forgave+capital+crimes+committed+against+the+very+universal+and+natural+law%3B+and+namely+of+David.+Forgave+he+not+Joab+for+slaying+of+Abner+and+Amasah%3F+and+Amnon%2C+for+committing+incest%3F+and+again%2C+forgave+he+not+Absalom+for+slaying+of+Amnon%2C+his+brother%3F+But+I+answer%3A+We+are+bound+to+live+by+God%E2%80%99s+laws%2C+and+not+by+examples%E2%80%A6+Indeed%2C+there+is+a+difference+between+these+crimes+that+are+capital%2C+and+the+crimes+that+in+their+own+nature+are+not+capital%2C+but+by+the+laws+of+princes+are+made+capital%3B+for+upon+just+considerations%2C+the+prince+has+power+to+dispense+with+them%3A+as%2C+for+example%2C+it+was+not+deadly+of+the+own+nature+to+Shimei+to+go+out+of+the+ports+of+Jerusalem%2C+but+because+Solomon+forbade+it%2C+it+became+deadly.+Like+as+it+is+in+the+hands+of+princes+to+make+and+to+change+such+special+laws%3B+so+it+lies+in+his+hands+to+forgive+such+a+man+transgressing+them%2C+upon+weighty+and+great+considerations.+So%2C+to+return%2C+these+crimes+that+are+capital+by+natural+law%2C+a+prince+has+no+power+to+remit+them%2C+albeith+he+were+ruler+of+all+the+world%3B+he+derogates+to+God%E2%80%99s+glory.+And+secondly%2C+if+there+were+no+more+to+let+us+see+that+God+has+not+given+that+power+to+forgive+capital+crimes+against+God%E2%80%99s+law+and+nature%2C+the+judgments+of+God+which+ceased+on+such+men+and+their+posterity+were+sufficient+to+show+it%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Robert+Rollock%2C+Select+Works+of+Robert+Rollock%2C+vol.+2%2C+pp.+87-90+on+Mt.+27%3A16-17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9d63fb276b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9d63fb276b.html">Permalink</a><a <blockquote><p>IF your cause is just—you may look with confidence to the Lord and intreat him to plead it as his own. You are all my witnesses, that this is the first time of my introducing any political subject into the pulpit. At this season however, it is not only lawful but necessary, and I willingly embrace the opportunity of declaring my opinion without any hesitation, that the cause in which America is now in arms, is the cause of justice, of liberty, and of human nature.

So far as we have hitherto proceeded, I am satisfied that the confederacy of the colonies, has not been the effect of pride, resentment, or sedition, but of a deep and general conviction, that our civil and religious liberties, and consequently in a great measure the temporal and eternal happiness of us and our posterity depended on the issue.

The knowledge of God and his truths have from the beginning of the world been chiefly, if not entirely confined to these parts of the earth, where some degree of liberty and political justice were to be seen, and great were the difficulties with which they had to struggle from the imperfection of human society, and the unjust decisions of usurped authority. There is not a single instance in history in which civil liberty was lost, and religious liberty preserved entire. If therefore we yield up our temporal property, we at the same time deliver the conscience into bondage.

YOU shall not, my brethren, hear from me in the pulpit, what you have never heard from me in conversation, I mean railing at the king personally, or even his ministers and the parliament, and people of Britain, as so many barbarous savages. Many of their actions have probably been worse than their intentions. That they should desire unlimited dominion if they can obtain or preserve it, is neither new nor wonderful.

I do not refuse submission to their unjust claims, because they are corrupt or profligate, although probably many of them are so, but because they are men, and therefore liable to all the selfish bias inseparable from human nature. I call this claim unjust of making laws to bind us in all cases whatsoever, because they are separated from us, independent of us, and have an interest in opposing us.

Would any man who could prevent it, give up his estate, person, and family, to the disposal of his neighbour, although he had liberty to chuse the wisest and the best master? Surely not. This is the true and proper hinge of the controversy between Great-Britain and America. It is however to be added, that such is their distance from us, that a wise and prudent administration of our affairs is as impossible as the claim of authority is unjust.

Such is and must be their ignorance of the state of things here, so much time must elapse before an error can be seen and remedied, and so much injustice and partiality must be expected from the arts and misrepresentation of interested persons, that for these colonies to depend wholly upon the legislature of Great-Britain, would be like many other oppressive connexions, injury to the master, and ruin to the slave.</p></blockquote>

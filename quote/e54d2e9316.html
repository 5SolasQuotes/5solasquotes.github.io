<main class="wrap"><figure class="quote" id="q-e54d2e9316" data-kw="">
<blockquote><p>First, That which faith comprehends, or at least supposes, is a knowledge of the things which are to be believed. This, in contradiction to the absurdity of the Papists, is very plain, I from the scriptures; which so speak of faith, as manifestly to give us to understand, that knowledge is included in the very idea, as well as the practice of faith, Isa. liii. 11. John xvii. 3. compared with Hab. ii. 4. John vi. 69. 2 Tim. i. 3.

II. From the very nature of faith, which, as it speaks of an assent given to a truth revealed by God, and that without any doubting, necessarily presupposes the knowledge of these two things, 1. That God has revealed something. 2. What that something is, which faith assents to as divinely revealed. For to say that a person assents to any truth, which he is ignorant of, and concerning which, he knows not whether there be any testimony extant which is worthy of credit, is absurd.

III. The presupposition of this knowledge is plain from the manner in which faith is produced in the soul; that is to say, it is done externally by the preaching and hearing of the gospel, Rom. x. 17. which reveals the thing to be believed, with demonstration of the truth to the conscience, 2 Cor. iv. 2. and it is done internally; and both these by the institution and appointment of God the Father, John vi. 45. If therefore faith is generated in the heart by an external, as well as an internal institution, it necessarily must consist in knowledge; for knowledge is the most proper and immediate effect of such institution.

IV. The presupposition of this knowledge is plain, from the consequences annexed to it, which are, confession and acknowledgment, Rom. x. 9, 10. 1 Pet. iii. 15. but these things cannot be, where there is no knowledge. Hilary saith well, that none can speak what he does not know.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Christian Faith</cite>, trans. Martin Madan (London: E. Dilly, 1761), pp 3-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith.html">Faith</a></span></div>

</figure><figure class="quote" id="q-44993ee873" data-kw="against implicit faith">
<blockquote><p>This is “implicit faith” (which they say suffices for the salvation of the laity if they believe what the church believes, although they may not know what the church believes, or what it ought to believe, or what church is to be believed). This is called “the faith of Carbonarius” because being asked what he believed, he answered, “What the church believes.” Again being asked what the church believed, he said, “What I believe.” The design of the Romanists is to keep the people in ignorance that the yoke of traditions and of all kinds of errors and superstitions may the more easily be placed upon them.</p></blockquote>

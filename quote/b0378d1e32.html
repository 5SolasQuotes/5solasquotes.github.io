<main class="wrap"><figure class="quote" id="q-b0378d1e32" data-kw="">
<blockquote><p>For in respect of the observance of the eighth day in the Jewish circumcision of the flesh, a sacrament was given beforehand in shadow and in usage; but when Christ came, it was fulfilled in truth. For because the eighth day, that is, the first day after the Sabbath, was to be that on which the Lord should rise again, and should quicken us, and give us circumcision of the spirit, the eighth day, that is, the first day after the Sabbath, and the Lord’s day, went before in the figure; which figure ceased when by and by the truth came, and spiritual circumcision was given to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cyprian-of-carthage.html">Cyprian of Carthage</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 58.4 in Ante-Nicene Fathers vol. 5.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-529d8f82c6" data-kw="">
<blockquote><p>Unless” (says Dr. [Jacob] Andreas [a Lutheran]) “regeneration be always united to baptism, and remains in such as are baptized, how should the troubled consciences of those be eased and comforted, who because they feel not in themselves any good motions of God’s Holy Spirit, find none other refuge but the Word and sacraments, especially the sacrament of baptism? Now this remedy would be of small force except it be opposed against those imaginations which the Devil casts into a troubled heart; yea, except it taught such that God is greater than our heart, who in baptism has not only offered us the adoption of sons, but hath indeed bestowed the same upon us: as it is said by Christ, ‘He that believeth and is baptized, shall be saved.’ And by Paul, ‘Ye which are baptized, have put on Christ.’ David being armed with the like comfort from his circumcision, feared not to join battle with that great giant Goliath: and if this were not so, it must needs follow that baptism were nothing else but an idle ceremony, and also the persons of the Trinity would be thought liars. Wherefore those afflicted men, when Satan assaults them, must resist him with these words: ‘Depart from me Satan, thou hast neither part nor portion in the inheritance of my soul, because I am baptized in the name of the holy Trinity, and so am truly made the son of God by adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Order which Mr. Theodore Beza used in Comforting Afflicted Consciences’ appended to William Perkins, A Golden Chain… (Cambridge, 1600)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

c6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/529d8f82c6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/baptism/#:~:text=Unless%E2%80%9D%20%28says%20Dr.%20%5BJacob%5D%20Andreas%20%5Ba,the%20son%20of%20God%20by%20adoption&amp;text=Unless%E2%80%9D%20%28says%20Dr.%20%5BJacob%5D%20Andreas%20%5Ba%20Lutheran%5D%29%20%E2%80%9Cregeneration&amp;text=truly%20made%20the%20son%20of%20God%20by%20adoption" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5323c4e91a" data-kw="">
<blockquote><p>…in favor of the baptism of infant servants, from the cessation of the Jewish Church to the times of Augustine, we can only say that Augustine speaks of it as a custom in existence; that it resulted, in his day, from the conviction that baptism came in place of circumcision, a conviction which we can trace up through the earliest fathers… …we commend the resolutions of the Synod of South Carolina… ‘1. Resolved, That it is the duty of believing masters to train up their servants, as well as their children, in the nurture and admonition of the Lord. 2. Resolved, That the principles of the Abrahamic covenant, as to the cirucmcision of servants, is till in force in reference to the infant offspring of those who stand to us in this relation; and that as baptism succeeds to circumcision, it is the duty of masters to dedicate such servants to God in the ordinance of baptism, and to do all in their power to train them up in a knowledge of the truth and in the way of salvation through Christ. 3. Resolved, That though there are great and manifest dificulties in carrying out the principles of these resolutions, these difficulties have chiefly resulted from the long continued neglect of believing masters and of the church, and that these difficulties must be gradually overcome by continued and persevering efforts.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-howe.html">George Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Article 3, ‘The Baptism of Servants’ in Southern Presbyterian Review, no. 1 (June 1847)</cite>, pp. 63-102</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

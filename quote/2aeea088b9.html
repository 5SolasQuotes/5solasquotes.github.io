</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-adc6838f25" data-kw="">
<blockquote><p>V. A confederation or stipulation is required [of laymen coming to a congregation], whereby they promise God and the Church to continue and progress in that communion of Saints… But more explicitly, those being admitted to the communion of the Church enter into that holy confederation when they respond not only to particular questions about repentance, faith, and gratitude, specifically applied to themselves, but also to those general questions which conclude the series: Do they acknowledge the doctrine of our churches to be the orthodox faith and the way of salvation? Do they promise by God’s grace to persevere in that doctrine until death? Do they promise to live holily and worthily according to that doctrine? Do they submit to ecclesiastical discipline? And this is the method of stipulation and confederation in our churches. As for the manner of confederation by oath or the subscription of a formula or instrument, it does not seem necessary. It suffices that this is done before many witnesses, but we do not consider it illicit; as we shall soon discuss in the Problems.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbert-voetius.html">Gisbert Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’, p. 19 (PDF p. 11)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-0b44dcca6e" data-kw="">
<blockquote><p>I answer, recommendatory letters can never give a Church-right to the Church-privileges of the seals of the Covenant: they do but only notify, manifest and declare the Church-right which the man had before. Therefore, either he cannot in any sort be capable of the seals of the Covenant in another congregation than his own whereof he is an inchurched member [as upon a congregationalist view], which destroys all communion of sister Churches, or if he be capable of the seals in another congregation [which be the case], he was capable and had a Church-right in himself before he received recommendatory letters: yea, these whom we recommend by letters as fit to partake of the sacraments in another congregation, we presuppose they have Church-right to the seals in another congregation-visible than in their own whereof they are members, except our testimony be false. Therefore, before our recommendatory letters, the person of approved piety was a member of all the visible Churches about, hoc ipso, and ‘by that same reason,’ that he is a member of one visible congregation: Yea Peter clearly insinuates that all who have received the Holy Ghost, are to be baptized, Acts 8:47, as Philip, Acts 8:37, and that if the Eunuch believed, he might be baptized. So that faith, to speak properly, does give us right to the seals, and to speak accurately, a visible profession of faith does not give a man right to the seals of grace, but only it does notify and declare to the Church that the man has right to the seals because he believes, and that the Church may lawfully give to him the seals, and that profession is a condition required in the right receivers of the seals in an ecclesiastical way; But faith gives the right to these seals, and because the faith of the believer goes with the believer when he goes to another visible congregation than his own, that faith gives him right to the seals in all places and in all congregations: for faith gives right to receive Christ sacramentally, not in one congregation only, but in all, and a visible profession does as a condition notify this faith and Church-right in all congregations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 2, ch. 4, section 5, pp. 195-96 Rutherford (c. 1600–1661) was a Scottish presbyterian Westminster divine.</span></figcaption>

</figure><figure class="quote" id="q-81a3867d3b" data-kw="">
<blockquote><p>11. This [church] covenant (thus distinguished from the Covenant of Grace) they hold to be that covenant which is sealed by the sacraments, and for the sealing and ratifying of which the sacraments were principally ordained of God, and therefore to be administered only to such as are first entered into this covenant, as seals thereof. Apology, p. 15, 19, 31; Answer to 9; pos. pp. 63 &amp; 66. And therefore, that such persons as (by their condition) cannot join in church covenant, nor live in church fellowship with a set society, are not bound to partake in sacraments. Apology, pp. 39 &amp; 41. See [John] Robinson, Justification, pp. 80 &amp; 110, though I do not find the Brownists so solicitously to distinguish between the church covenant and the Covenant of Grace as these our [Independent and congregationalist] brethren do.</p></blockquote>

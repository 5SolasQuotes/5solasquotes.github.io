<main class="wrap"><figure class="quote" id="q-8d10411dfb" data-kw="">
<blockquote><p>The greatest without comparison, and most admirable work which the hand of God hath brought to pass upon earth in these later Ages, is, the Reformation of Religion from Antichristian pollution and tyranny: No other could have been expected from the Prince of Darkness, but extreme opposition to this so high a prejudice to his Kingdom: Incredible is the help which this unclean spirit hath made to Antichrist his chief servant, for the upholding of his tottering Throne. How many Princes and States hath he stirred up to persecute with Fire and Sword, to the cruellest deaths, the innocent Witnesses of the Truth? How many learned Divines hath he bewitched with his Enchantments, to spend their spirits and time in maintaining by Word and Writings the grossest abominations of that Romish Idol?

But the chief Artifice whereby this crafty Serpent hath most impeded the progress of the Gospel, and kept the Triple-Crown upon the Pope’s head, is his powerful working in the midst of the Children of Light: So cunningly hath he insinuated himself into the counsels and actions not only of the Children of this world, but of the Sons of Sion themselves, that by their hands, more then any other, he hath laid in the way of Christ’s running Chariot scandals insuperable, impediments irremovable, by any human might, till the Lord from heaven put them out of the way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dissuasive from the errors of the time</cite>, (London, 1645), p. 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-f9b552319a" data-kw="">
<blockquote><p>Next to the enactment of just and wholesome laws, the due administration of them is of the highest importance to a community. This has accordingly engaged the particular attention of every people who have attained to any considerable degree of civilisation.

The most enlightened nations have separated the judicial from the legislative authority, rendered judges, in the discharge of their functions, independent of the supreme executive magistrate in the state, and adopted other precautions, with the view of keeping the channels by which justice is dispensed through all the departments of society pure and uncorrupted.

Nor is the jealousy which they manifested on this head to be censured as excessive. By the wise and impartial administration of justice a people have been reconciled to the rule of a usurper, and tyranny itself has become tolerable; whereas the neglect or perversion of justice has made them unhappy and discontented under the best form of political government.

The salutary effects of righteous judgment are not confined to the securing of individual rights, the repressing of the bad, and the protecting of the good and peaceable. Under its fostering shade every useful art and every liberal science flourish; the honour of the laws being preserved unsullied, a cheerful obedience is yielded to their authority; morality is promoted by an exhibition of the connexion which subsists between its essential principles and the temporal welfare of men; and piety is indirectly, but powerfully, strengthened by the thoughts being irresistibly raised to the fountain of all justice, and by the representation, faint indeed, but not scenic, which is given of the great assize before which all must at last appear.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of Judgment. Delivered at the opening of the Synod of Original Seceders, Edinburgh, September, 1829 in Sermons</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-a451784fb2" data-kw="">
<blockquote><p>Not only few, and uncertain, but Evil likewise are the days of the Years of my Life, may every one say, with the Patriarch Jacob. A sufficient portion of Evil for every year may well be expected, when our Lord tells us, there is a certain measure allotted for every day. Sufficient to the day is the evil of it. Not only is our Life short, but troublesome, full of vexatious Mixtures. We cannot sing a Requiem to our Souls, when one great Calamity is past; for we know not, in this Region of Changes, but another, a greater may be at hand. One Messenger of ill News may succeed and out-do another, as it was with Job. We come weeping into the World in a most helpless forlorn state; and if we escape the dangers of Infancy, and the casualties of Childhood; and after that, out-live the Snares and Follies of Youth, We are tost upon the Pikes of Time and Chance, and sadden and disquiet our selves with a thousand Griefs and Sorrows, by inevitable and unexpected occasions; though we increase the number of needless Cares and Fears, and Discontents; Till at length a sudden stroke arrests us, we fetch a groan, and die.

Who can give a Catalogue of the Afflictions and Calamities, Perplexities and Disappointments, Incumbrances, Crosses, and evil Accidents of Humane Life? By means whereof Millions are disconsolate and sad, mourn and complain, weep and sigh, and from day to day are fed with the Bread of Affliction, and the water of Adversity. Not to mention men’s fluctuating restless Thoughts of Heart, importunate Desires, baffled Projects, defeated Purposes, which suppose or bring vexation. A good share of these is not to be avoided; and yet very few can be particularly foreseen. Who could prognosticate a year ago the Mercies or the Evils, which have happened since?

Public and private, personal and relative, to the Countries, Cities, Families and Persons we are concerned for? And who can certainly foretell the Events of this ensuing Year? God hath intermixt Good and Evil in the Life of Man: He hath set Prosperity against Adversity, saith Solomon, to the end, that Man should find nothing after him. Eccles. 7.14. that he may not know what shall come next, whether a Prosperous or a Calamitous Event. What a change may be made in a year by the mere Casualty of human Events? by the treachery of Friends, or the malice of Enemies, or the more immediate Hand of God?

We know not what shall be on the Morrow, much less what a twelve Month may produce. Because whatever may be disposed to happen, from natural causes, or civil counsels, may be altered by a particular decree of Providence. Prepare me Lord! and every of those in whose Felicity I more especially take part, for all the Calamities and Sorrows, thine infinite Wisdom shall think fit to exercise us with, this following year: and by thy merciful Providence, and gracious Conduct, cause them to work for Good: Furnishing us with suitable strength and wisdom, to acquiesce in thy good Pleasure, and obey thy Will. Let me follow thee, as the Father of the Faithful, ‘tho I know not whither thou wilt lead me. Knowing the wisdom and faithfulness of my Pilot, let me therein be satisfied, though I know not particularly what course he will steer. I thank thee, O Heavenly Father! that thou hast reserved the knowledge of future Times and Seasons to thy self, and hid Events from Men; Lest by considering them Certain, we should presume in case they are Good; or should despairingly afflict our selves, by foreseeing the Evil we know, to be inevitable.

Did we certainly foreknow the Good that would befall us, we should not Trust in thee to bring it to pass, or heartily implore thy Care and Conduct. Did we foresee the Evils we shall suffer, before they overtake us, we should be overwhelmed with diffidence and Despair. Many a Mother who rejoiceth at the Birth of a Son, would mourn to foresee what a Man, what a Son he will prove. Such an increase of Knowledge would increase our Sorrow; such a Prescience would transport and discompose us, by unseasonable Joys and Sorrows, born out of Time; make us remiss in our Duty to Thee; and weaken our Dependence on thine own unerring Wisdom, Truth, and Power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-shower.html">John Shower</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Serious reflections on time and eternity with some other subjects, moral and divine. To which is prefixed an introduction concerning the first day of the year, how observed by the Jews, and may best be employed by a serious Christian</cite>, (London: Joseph Watts, 1689), pp 50-53.</span></figcaption>

— John Shower, Serious reflections on time and eternity with some other subjects, moral and divine. To which is prefixed an introduction concerning the first day of the year, how observed by the Jews, and may best be employed by a serious Christian, (London: Joseph Watts, 1689), pp 50-53.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNot+only+few%2C+and+uncertain%2C+but+Evil+likewise+are+the+days+of+the+Years+of+my+Life%2C+may+every+one+say%2C+with+the+Patriarch+Jacob.+A+sufficient+portion+of+Evil+for+every+year+may+well+be+expected%2C+when+our+Lord+tells+us%2C+there+is+a+certain+measure+allotted+for+every+day.+Sufficient+to+the+day+is+the+evil+of+it.+Not+only+is+our+Life+short%2C+but+troublesome%2C+full+of+vexatious+Mixtures.+We+cannot+sing+a+Requiem+to+our+Souls%2C+when+one+great+Calamity+is+past%3B+for+we+know+not%2C+in+this+Region+of+Changes%2C+but+another%2C+a+greater+may+be+at+hand.+One+Messenger+of+ill+News+may+succeed+and+out-do+another%2C+as+it+was+with+Job.+We+come+weeping+into+the+World+in+a+most+helpless+forlorn+state%3B+and+if+we+escape+the+dangers+of+Infancy%2C+and+the+casualties+of+Childhood%3B+and+after+that%2C+out-live+the+Snares+and+Follies+of+Youth%2C+We+are+tost+upon+the+Pikes+of+Time+and+Chance%2C+and+sadden+and+disquiet+our+selves+with+a+thousand+Griefs+and+Sorrows%2C+by+inevitable+and+unexpected+occasions%3B+though+we+increase+the+number+of+needless+Cares+and+Fears%2C+and+Discontents%3B+Till+at+length+a+sudden+stroke+arrests+us%2C+we+fetch+a+groan%2C+and+die.%0A%0AWho+can+give+a+Catalogue+of+the+Afflictions+and+Calamities%2C+Perplexities+and+Disappointments%2C+Incumbrances%2C+Crosses%2C+and+evil+Accidents+of+Humane+Life%3F+By+means+whereof+Millions+are+disconsolate+and+sad%2C+mourn+and+complain%2C+weep+and+sigh%2C+and+from+day+to+day+are+fed+with+the+Bread+of+Affliction%2C+and+the+water+of+Adversity.+Not+to+mention+men%E2%80%99s+fluctuating+restless+Thoughts+of+Heart%2C+importunate+Desires%2C+baffled+Projects%2C+

<blockquote><p>Q136 But why does He not completely sanctify us immediately?

A136 No, instead marvel at His goodness, in that He instills any little drop of regenerating grace in man. Yet why He defers the full sanctification of us into another age, there are many reasons, and chiefly two. One, because we are of little faith, and therefore, as much as is in us, we impede the inworking of the Holy Spirit.

The second, so that, as we are saved by grace alone, and not by works, he who glories, should glory only in God. For if this sanctification were complete in us, our righteousness would also be complete, or inherent in us, and then Christ would not be wholly and properly our Saviour, but only the tool and instrument for disposing us in such a way that we might justify ourselves by our own righteousness, which is plainly the foul and detestable error of the Semi-Pelagian Sophists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Little Book of Christian Questions and Responses. In which the Principal Headings of the Christian Religion are briefly set forth</cite>, trans. Kirk M. Summers, ed. Dikran Y. Hadidian (1570; Eugene OR: Pickwick Publications, 1986), p. 53.</span></figcaption>

<blockquote><p>Q. 75. What is sanctification? A. Sanctification is a work of God’s grace, whereby they whom God hath, before the foundation of the world, chosen to be holy, are in time, through the powerful operation of his Spirit[b] applying the death and resurrection of Christ unto them,[c] renewed in their whole man after the image of God;[d] having the seeds of repentance unto life, and all other saving graces, put into their hearts,[e] and those graces so stirred up, increased, and strengthened,[f] as that they more and more die unto sin, and rise unto newness of life.[g] [b] Eph. 1:4. 1 Cor. 6:11. 2 Thess. 2:13. [c] Rom. 6:4-6. [d] Eph. 4:23,24. [e] Acts 11:18. 1 John 3:9. [f] Jude 20. Heb. 6:11,12. Eph. 3:16-19. Col. 1:10,11. [g] Rom. 6:4,6,14. Gal. 5:24.</p></blockquote>

<blockquote><p>VII. The power of free choice in the regenerate is yet weak, so that we have still need of the help of God, neither can we do all that we would.

But, because our regeneration is as it were only begun and not as yet perfect, so that whereas we were before wholly flesh, now we consist partly of the Spirit and partly of the flesh, which do continually fight the one against the other, that what good things we would, them we cannot perform; but in our spirit we serve the law of God, but in our flesh the law of sin.

Therefore we believe that which we also know by experience in the regenerate, that much bondage still remaineth, much darkness in the soul and perverseness in the heart and weakness in all the faculties of mind and body, that we have still need of new help from God and new grace, whereby both our minds may be more and more enlightened and our wills made better and better, and our strength to do good more increased and perfected.

And therefore, while we remain in this flesh, our free choice is never truly and merely free, that is, never able enough of it self to avoid ill and do good, especially sith the event of all things is not in our power, but in the hand of God; and that it must needs be that all those things come to pass, not which we think, but whatsoever his hand and purpose hath decreed shall be done.</p></blockquote>

<blockquote><p>Fourthly, they [Justification and Sanctification] are both equally imputed unto us through the righteousness of Christ. Therefore says St. Paul to the Corinthians, ‘To them that are sanctified in Christ Jesus,’ (1 Cor. 1:2) and to the Hebrews, it is said we are ‘sanctified by the blood of the Covenant.’ (Heb. 10:29) So that no less are we sanctified than justified by Christ’s death and merits, and the imputation of them. But on the other side, they are distinct in some formalities, such as these may be, for first, the immediate cause of our sanctification is in holy Scripture imputed to the operation and influence of the Holy Spirit, as our Justification is more properly attributed to Christ the mediator between God and man: As appears from St. Paul’s words to the Thessalonians, ‘But we are bound to give thanks always for you brethren beloved of the Lord, because God has from the beginning chosen you to salvation, through sanctification of the Spirit, and belief of the truth.’ (2 Thess. 2:13) And St. Peter, ‘Elect according to the foreknowledge of God the Father and Sanctification of the Spirit unto obedience.’ (1 Pet. 1:2)… For not only is a sinner by the Spirit of regeneration and sanctification purged from the old leaven of sin and malice, but he becomes a new lump, and unleavened (1 Cor. 5:7); and whereas he has ‘yielded his members as instruments of unrighteousness unto sin, he does yield himself unto God,’ (Rom. 6:13) as those that are alive from the dead. And old things are done away in him, and all things become new.’ (2 Cor. 5:17) And ‘whosoever is (thus) born of God; does not commit sin, for his seed remains in him, and he cannot sin because he is born of God.’ (1 Jn. 3:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-scrivener.html">Matthew Scrivener</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Divinity</cite>, ... (London: Roycroft, 1674), pt. 1, bk. 1, ch. 17, pp. 62-63</span></figcaption>

<blockquote><p>The purposes of Deity are not lawless and arbitrary. His will is determined by the perfections of His nature. To say, therefore, that there are things which He cannot do, is simply to affirm that He cannot will them, and to say that He cannot will them, is just to assert that they are inconsistent with the perfections of His Being. In such cases, consequently, we do not limit, we only define the power of God …

It is His glory to be what He is. The possession of infinite perfections and the enjoyment within Himself of unchanging blessedness, independence and self-sufficiency, are characteristics of the Deity which render it impossible that His manifold works should spring from any other motive but the counsel of His Own will.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>
<div class="actions"><button class="copy" data-copy="“The purposes of Deity are not lawless and arbitrary. His will is determined by the perfections of His nature. To say, therefore, that there are things which He cannot do, is simply to affirm that He cannot will them, and to say that He cannot will them, is just to assert that they are inconsistent with the perfections of His Being. In such cases, consequently, we do not limit, we only define the power of God …

It is His glory to be what He is. The possession of infinite perfections and the enjoyment within Himself of unchanging blessedness, independence and self-sufficiency, are characteristics of the Deity which render it impossible that His manifold works should spring from any other motive but the counsel of His Own will.”

— James Henley Thornwell, The Necessity of the Atonement, (Columbia SC: Samuel Weir, 1845), pp 11, 28.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+purposes+of+Deity+are+not+lawless+and+arbitrary.+His+will+is+determined+by+the+perfections+of+His+nature.+To+say%2C+therefore%2C+that+there+are+things+which+He+cannot+do%2C+is+simply+to+affirm+that+He+cannot+will+them%2C+and+to+say+that+He+cannot+will+them%2C+is+just+to+assert+that+they+are+inconsistent+with+the+perfections+of+His+Being.+In+such+cases%2C+consequently%2C+we+do+not+limit%2C+we+only+define+the+power+of+God+%E2%80%A6%0A%0AIt+is+His+glory+to+be+what+He+is.+The+possession+of+infinite+perfections+and+the+enjoyment+within+Himself+of+unchanging+blessedness%2C+independence+and+self-sufficiency%2C+are+characteristics+of+the+Deity+which+render+it+impossible+that+His+manifold+works+should+spring+from+any+other+motive+but+the+counsel+of+His+Own+will.%E2%80%9D%0A%0A%E2%80%94+James+Henley+Thornwell%2C+The+Necessity+of+the+Atonement%2C+%28Columbia+SC%3A+Samuel+Weir%2C+1845%29%2C+pp+11%2C+28.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F77a37dace4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/77a37dace4.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/10/28/james-henley-thornwell-on-the-perfection-of-the-divine-will/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

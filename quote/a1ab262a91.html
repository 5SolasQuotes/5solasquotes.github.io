<main class="wrap"><figure class="quote" id="q-a1ab262a91" data-kw="">
<blockquote><p>II. However, we must premise here that God, the just Judge (dikaiokritēn), cannot pronounce anyone just and give him a right to life except on the ground of some perfect righteousness which has a necessary connection with life; but that righteousness is not of one kind. For as there are two covenants which God willed to make with men—the one legal and the other of grace—so also there is a twofold righteousness—legal and evangelical. Accordingly there is also a double justification or a double method of standing before God in judgment—legal and evangelical. The former consists in one’s own obedience or a perfect conformity with the law, which is in him who is to be justified; the latter in another’s obedience or a perfect observance of the law, which is rendered by a surety in the place of him who is to be justified—the former in us, the latter in Christ. Concerning the first, Paul says, “Not the hearers, but the doers of the law shall be justified” (Rom. 2:13); and “Moses describeth the righteousness which is of the law. That the man which doeth those things shall live by them” (Rom. 10:5). Concerning the other, he says, “The gospel is the power of God unto salvation to every one that believeth, for therein is the righteousness of God revealed from faith to faith: as it is written, The just shall live by faith” (Rom. 1:16, 17); and “Being justified freely by his grace through the redemption that is in Christ Jesus” (Rom. 3:24). Concerning both, he says, “That I may be found in Christ, not having my own righteousness, which is of the law, but that which is through the faith of Christ” (Phil. 3:9; cf. also Rom. 9:30, 31). Hence a twofold justification flows: one in the legal covenant by one’s own righteousness according to the clause, “Do this and live”; the other in the covenant of grace, by another’s righteousness (Christ’s) imputed to us and apprehended by faith according to the clause, “Believe and thou shalt be saved.” Each demands a perfect righteousness. The former requires it in the man to be justified, but the latter admits the vicarious righteousness of a surety. The former could have place in a state of innocence, if Adam had remained innocence. But because after sin it became impossible to man, we must fly to the other (i.e, the gospel), which is founded upon the righteousness of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 16.2.2. (2.637).</span></figcaption>

<blockquote><p>I. Faith taken theologically in general is the assent which we give to God speaking, when we are certainly persuaded that something is true, moved to that by Divine Authority. And by this faith is distinguished from opinion, which is a timid and uncertain assent. Likewise from knowledge, which is indeed a certain assent; but one which rests on demonstration or some evident argument, not truly on anyone’s testimony. Finally, from human faith, which acquiesces in the authority of men.

II. Therefore not every assent, even applied to those things which are contained in the Word of God, should be considered faith. For if someone certainly and firmly holds some dogma of religion, such as the creation of all things out of nothing: yet not impelled to that by divine revelation, but by some reason which seems necessary to him, to that extent he does not have faith… … XXIX. Certainly those who place faith also in the will are moved to that because they confuse trust with faith, and think trust is the principal act of faith and as it were its form. But in that they are deceived, or do not speak accurately enough. For trust is an effect of faith, not truly an act and form of faith. And if we want to speak properly, trust pertains to hope, not to faith. For it is nothing other than hope strengthened and confirmed. And certainly the apostle manifestly distinguishes trust from faith in Eph. 3:12, “In Christ,” he says, “we have boldness and access with confidence through faith in him.” Where faith is placed as the cause of trust or confidence, since we are said to have trust or confidence through faith: which would be said absurdly if trust and faith were the same thing. For this being posited, the sense of the passage would be, “Through trust we have trust”; which is nugatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Faith’, pp. 125, 131</span></figcaption>

II. Therefore not every assent, even applied to those things which are contained in the Word of God, should be considered faith. For if someone certainly and firmly holds some dogma of religion, such as the creation of all things out of nothing: yet not impelled to that by divine revelation, but by some reason which seems necessary to him, to that extent he does not have faith… … XXIX. Certainly those who place faith also in the will are moved to that because they confuse trust with faith, and think trust is the principal act of faith and as it were its form. But in that they are deceived, or do not speak accurately enough. For trust is an effect of faith, not truly an act and form of faith. And if we want to speak properly, trust pertains to hope, not to faith. For it is nothing other than hope strengthened and confirmed. And certainly the apostle manifestly distinguishes trust from faith in Eph. 3:12, “In Christ,” he says, “we have boldness and access with confidence through faith in him.” Where faith is placed as the cause of trust or confidence, since we are said to have trust or confidence through faith: which would be said absurdly if trust and faith were the same thing. For this being posited, the sense of the passage would be, “Through trust we have trust”; which is nugatory.”

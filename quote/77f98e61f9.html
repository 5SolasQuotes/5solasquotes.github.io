<blockquote><p>And once you have allowed yourself to see the truth that reason leads you to, what reason apprehends is (given the convertibility of the transcendentals) as good and beautiful as it is real.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015), ch. 9, ‘The Road from Atheism’, p. 214</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-91b1f98b9f" data-kw="">
<blockquote><p>1. The beatitude of God is the eternal condition in himself of absolute satisfaction and delight. That’s bound up with God’s fullness of glory as the Father, the Son, and the Holy Spirit. Now that’s a traditional understanding of God’s beatitude. This is not something that I’m just coming up with myself. We may not hear a lot about the attribute of God’s beatitude, but it is a tradition throughout church history.

2. The outward beauty of God is expressed and perceivable as an aesthetic quality of his glory in his work of creation, redemption, and consummation. It’s important here to call attention to the distinctive characteristic of beauty. Beauty as beauty is not desired as a means to another end. Pleasure or delight associated with beholding the beautiful is its own end.

3. That characteristic to communicate the delight as its own end is correlative to that absolute self that characterizes God’s own eternal, internal life as Father, Son, and Spirit. The uniqueness of beauty, as opposed to goodness or truth (we just talked about the transcendentals there), is that beauty evokes a delight, but you don’t use that delight to then do something more. It is its own end.

4. We talk about God’s beatitude. It is its own end. It is itself delight. He’s self-satisfied. Where I draw this all together is with a postulation that the beauty of God in his outward works as it is perceived and experienced by human beings is what most clearly can be traced to that perfection of beatitude and sense of delight that belongs to God in himself as Father, Son, and Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-king.html">Jonathan King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘How can I see the Beauty of God?</cite>, (2019) at Desiring God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-537a2f92f2" data-kw="">
<blockquote><p>This essay applies classical aesthetics to the contract doctrine of offer and acceptance. It argues that contract law can be understood, analyzed, and improved using three criteria of beauty: proportion, integrity, and clarity. Based on these criteria, this essay (1) argues that the traditional doctrine of offer and acceptance is beautiful, (2) argues that UCC [Uniform Commercial Code] §2-207 is ugly and fails to improve upon offer and acceptance, and (3) suggests improvements for UCC §2-207.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kenneth-k-ching.html">Kenneth K. Ching</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Beauty &amp; Ugliness in Offer &amp; Acceptance’ in 60 Wayne Law Review 469</cite>, (2014) 24 pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-bfa045621c" data-kw="">
<blockquote><p>It is not truth but goodness which is the ultimate object of the soul. And God who is infinite goodness itself, has revealed his truths to the world to do men good and not to hurt them. And the Devil, who is the Destroyer, so he may but do men hurt, will be content to make use even of truth to do it; though usually he only pretends truth to cover his lies: And this angel of Light has his ministers of light and righteousness, who are known by their fruits; whilst the pretenses of light and righteousness are used to Satan’s ends and not to Christ’s, to hurt and destroy and to hinder Christ’s Kingdom, and not to save and to do good: as the wolf is known by his bloody jaws, even in his sheep’s clothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 38, ‘Neglect not any truth of God, much less renounce it or deny it: for lying and contempt of sacred truth is always sinful: But yet do not take it for your duty to publish all which you judge to be truth, nor a sin to silence many lesser truths, when the Church’s peace and welfare does require it’, pp. 208-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

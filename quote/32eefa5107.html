<main class="wrap"><figure class="quote" id="q-32eefa5107" data-kw="">
<blockquote><p>God it is who draws to His Son those whom He calls; He does not compel them by force against their will, but He makes them willing from unwilling and by all sorts of ways overcomes the resistance of their unbelief. When the desire of submitting to God has been born in their hearts, those who hear Him rise up with the very will which first kept them down; they learn with the same mind which first was ignorant; they trust with the same heart which first felt diffident; they desire good with the same will which first was unwilling.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/prosper-of-aquitaine.html">Prosper of Aquitaine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Grace and Free Will, Against Cassian the Lecturer</cite>, (433), 3.1 in Defense of St. Augustine: Ancient Christian Writers, no. 32, trans. P. De Letter (Westminster MD: Newman Press, 1963), p. 77.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling.html">Effectual Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8a0b6b92ac" data-kw="">
<blockquote><p>That former grace may be called the grace of our vocation; this grace is common to all that are called, elect and reprobate. But the latter grace in our effectual calling may be called the grace of faith, appertaining only to the elect; for it is given only to those that are predestinated to life everlasting to believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Works of Robert Rollock</cite>, ed. Gunn (d. 1599; Edinburgh: Wodrow Society, 1849), vol. 1, A Treatise of God’s Effectual Calling, ch. 38, ‘Concerning the Free Grace of God’, p. 269</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-9e6d3c36ef" data-kw="">
<blockquote><p>55. Nor can it [unregenerate choice] apprehend offered grace, unless it first receives through regeneration the faculty of apprehending.

56. In receiving this faculty of apprehending grace and assenting to the promise, it conducts itself merely passively, because then the choice is only the subject in which God works, in which he imprints new qualities and inclinations (Ezk. 11:19; 36:26; Eccl. 17:14; Job 33:3-6; Jn. 1:13).

57. But in the very apprehension of grace, or the act of apprehending, it conducts itself both passively and actively; for the choice acts, but having been acted upon by the Holy Spirit (Ezk. 36:27).

58. For one thing is δύναμις, the faculty of apprehending; another is ἐνέργεια, the act of apprehending or the apprehension itself.

59. After the choice has been regenerated, it indeed wills and does good, and perseveres in it, but only insofar as God effects and confirms these things in it (Phil. 1:6, 2:13; 1 Cor. 4:7; Jn. 15:5; 1 Cor. 12:3, 1:8).</p></blockquote>

</figure><figure class="quote" id="q-aaeaead8bb" data-kw="">
<blockquote><p>…we believe that all things without exception are under divine providence: whether heavenly or sublunary, great or small, necessary and natural or free and contingent. Thus nothing in the nature of things can be granted or happen which does not depend on it. The reasons are: (1) God created all things, therefore He also takes care of all things. For if it was glorious for God to create them, it ought not to be unbecoming in Him to take care of them. Nay, as He created, He is bound to conserve and govern them continually, since He never deserts His own work, but ought to be perpetually present with it that it may not sink back into nothingness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, On Providence</span></figcaption>

</figure><figure class="quote" id="q-7567078cbd" data-kw="">
<blockquote><p>It is an absolute decree of the Divine will published in the Gospel, That whosoever repenteth, believeth, persevereth, shall be saved: From hence is derived that mixt conditionall decree, If Cain, if Judas, if any other repent and believe, they shall be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On John Davenant &amp; Aquinas | Michael Lynch, John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy (Oxford Univ. Press, 2021) | Because of God’s foreknowledge of all future actions of all human beings, as well as his absolute power to cause them to do any good which would lead to blessedness or leave them in their sin leading to destruction, all of God’s decrees are either absolute or mixed conditionals. Moreover, all decrees are either revealed or hidden. The decree regarding a person’s election is hidden; on the other hand, the decree that God will save any person that believes is revealed. Decrees that come in the form of a condition— such as “If Esau believes, he will be saved”— are not pure conditionals, as noted above, but are said to be mixed because they are grounded upon God’s absolute, effectual, and revealed will that he has bound himself to, namely, that he will save any who repent and believe. According to an eternal and inviolable divine ordination, there is an indissoluble connection between faith and salvation. Davenant explains:, pp. 151-52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

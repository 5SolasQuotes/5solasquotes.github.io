<blockquote><p>The word “remember,” in the fourth commandment, implied that there was a previous and existing knowledge of the Sabbath as a day of sacred rest. It cannot be contended that because it is not mentioned from the time of its institution up till the period of the giving of the commandments, that it did not exist; for carrying out of the argument we would be obliged to admit that, because there is no mention of sacrifices having been offered for a period of 1,500 years, no sacrifices were offered – that because there is not mention made of circumcision, from the settlement of Israel in Canaan till the circumcision of our Redeemer, the rite of circumcision was abolished; and, as well might it be said that adultery, theft, and blasphemy were not sins before the giving of the law at Mount Sinai, because they are not previously mentioned as such, as to say that there was no Sabbath, and that its violators would not be punished. Considering the limited account given of the history of the world, both before and after the flood, there are in the Sacred Volume quite as many traces of the Sabbath as, under the circumstances, might be expected.

Mr Nelson then mentioned the peculiar circumstance of Noah sending the dove out of the ark at periods of seven days, the stated periods at which the patriarchs engaged in religious worship – the injunctions as to the gathering of manna upon the seventh day of the week, and several other incidents which took place before the delivery of the law at Mount Sinai, as traces of the existence of a Sabbath of sacred rest. […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-nelson.html">Isaac Nelson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Banner of Ulster</cite>, 17 Mar. 1848</span></figcaption>

</figure><figure class="quote" id="q-7deefe806d" data-kw="">
<blockquote><p>But the subject of these remarks will be best illustrated, perhaps, by considering the reason which God has condescended to assign for the Fourth Commandment, and which shows the institution of the Sabbath to be as much a privilege as it is a law. It is in these words: “For in six days the Lord made heaven and earth, the sea, and all that in them is, and rested the seventh day: wherefore the Lord blessed the Sabbath-day, and hallowed it.” The same statement, it will be remembered, is repeatedly made elsewhere in Scripture. Thus, in the 2d chapter of Genesis, it is said, “Thus the heavens and the earth were finished, and all the host of them. And on the seventh day God ended his work which he had made ) and he rested on the seventh day from all his work which ho had made. And God blessed the seventh day, and sanctified it; because that in it he had rested from all his work which God created and made.”

And again, in the 31st chapter of Exodus: “In six days the Lord made heaven and earth, and on the seventh day he rested, and was refreshed.” It appears, then, that the original institution of the Sabbath had nothing to do with the people of Israel, or the peculiar dispensation under which they lived. No doubt, it was employed under that dispensation for wise and gracious purposes; for it is a matter of history that, in proportion as that day was sanctified, held ” to be a delight, holy of the Lord, and honourable,” in the same degree the people of Israel prospered. But all this was the application of an old ordinance.

The Sabbath was a sanctified day—a day separated and specially set apart for the service of God, even from the foundation of the world; and the ground on which it was so honoured and exalted above all days was, because that on that day “God rested from his work, and was refreshed.” During the six days on which it pleased God to exercise his creating power, we are told of every successive act of that power whereby he adorned the heavens with his glory, and filled the earth with his beneficence, that God saw it to be good; and when at last man was made in the Divine image, and invested with dominion over every creature, and the heavens and the earth were finished, and all the host of them, “God saw every thing that he had made, and behold it was very good,” and “the morning stars sang together, and all the sons of God shouted for joy.”

It was thus that, in the exercise of his adorable perfections, and in the ineffable complacency with which he contemplated the goodly fabric which, in his infinite power, wisdom, and beneficence, he had reared, God himself is represented as resting—resting in that happiness which consists in the possession of all excellence and perfection, and in the exercise of wisdom, beneficence, and power. And if even to the almighty, ever-blessed, and unchangeable God— to him of whom it is said, “the everlasting God, the Lord, the Creator of the ends of the earth, fainteth not, neither is he weary;” if even to him the Sabbath could be said, in any sense, to be a day of rest and refreshment;—what a season of holy joy and devout praise and thanksgiving must it have been to man, while yet innocent, bearing the Divine image, and finding his chief happiness in contemplating the works, adoring the perfections, and enjoying the fellowship of his Creator!

The sanctification of the Sabbath must have been made known to man—we cannot, in fact, otherwise conceive of its being sanctified at all; and we can as little doubt that he would feel himself bound to sanctify it also, by as strong an obligation as any moral law could law upon him. But, in point of fact, it is clear from the epistle to the Hebrews, that the institution of the Sabbath had an immediate reference to man even from the beginning— that it was to him not only an emblem of God’s rest, even of the infinite satisfaction and complacency with which the Creator contemplated the works of his hands, but a pledge to man also of his entering into and becoming partaker of the same rest.

It is true he forfeited all this by his violation of the covenant which had secured it to him, only on condition of perfect obedience; and had no provision been made for his recovery, the Sabbath had ceased to be to him a token of his participating in the rest of God. But, in the covenant of grace, a Church had been given to Christ to be redeemed. In virtue of the atonement which he had undertaken to make, there remained still a rest for the people of God; the Sabbath continued to be to them an emblem and a pledge of that rest; and the rest itself was still farther illustrated and prefigured under the type of Canaan, which occupied so prominent a place in the Mosaical economy.

And if such was the original design of the Sabbath—if it was the day on which the almighty Creator himself declared that he rested and was refreshed, in the contemplation of his marvellous work of creation, the exercise of a Divine beneficence—if this was made known to man while yet bearing, in unsullied purity, the Divine image of his Maker—if it was afterwards given him, even in bis fallen state, as an intimation of God’s gracious purpose of bringing him out of the disorder and debasement into which sin bad gunk him, into a state of holy and eternal rest—and if it was thus designed to be not only an authoritative command requiring men to devote a certain portion of time to the worship of God, and the commemoration of that glorious work, in the accomplishment of which the almighty Creator himself found rest—an employment of time which ought to be regarded as a blessed privilege,—if it was not only designed for all this, but also to be an emblem and a pledge of that rest which remaineth for the people of God; is it not marvellous that those for whose instruction, and consolation, and encouragement it was intended, should make it a subject of cold and heartless speculation whether the Fourth Commandment be a moral or a positive commandment, as if it were their interest to bereave themselves of a privilege in the same way as they would rid themselves of an in tolerable yoke of bondage?

There are two truths very plainly and explicitly stated in Scripture, first, “that in six days the Lord made heaven and earth, and on the seventh day he rested, and was refreshed;” and, second, that he has promised to “his people that they mall enter into his rest.” And surely there is enough in these truths to awaken the desire of finding that the Sabbath was designed to be a permanent institution—an unfailing source, from which believers may drink for the refreshment of their spirits and the revival of their hopes; and that, if they can find any scriptural ground for believing that such is the Divine will concerning the appointment of one day in seven, to be a holy day of rest for his service, they would grasp at the permission thus granted them to observe the Sabbath, and would call “it a delight, the holy of the Lord, honourable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-gordon.html">Robert Gordon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sanctification of the Sabbath: A Discourse in Christian Miscellany</cite></span></figcaption>

round+on+which+it+was+so+honoured+and+exalted+above+all+days+was%2C+because+that+on+that+day+%E2%80%9CGod+rested+from+his+work%2C+and+was+refreshed.%E2%80%9D+During+the+six+days+on+which+it+pleased+God+to+exercise+his+creating+power%2C+we+are+told+of+every+successive+act+of+that+power+whereby+he+adorned+the+heavens+with+his+glory%2C+and+filled+the+earth+with+his+beneficence%2C+that+God+saw+it+to+be+good%3B+and+when+at+last+man+was+made+in+the+Divine+image%2C+and+invested+with+dominion+over+every+creature%2C+and+the+heavens+and+the+earth+were+finished%2C+and+all+the+host+of+them%2C+%E2%80%9CGod+saw+every+thing+that+he+had+made%2C+and+behold+it+was+very+good%2C%E2%80%9D+and+%E2%80%9Cthe+morning+stars+sang+together%2C+and+all+the+sons+of+God+shouted+for+joy.%E2%80%9D%0A%0AIt+was+thus+that%2C+in+the+exercise+of+his+adorable+perfections%2C+and+in+the+ineffable+complacency+with+which+he+contemplated+the+goodly+fabric+which%2C+in+his+infinite+power%2C+wisdom%2C+and+beneficence%2C+he+had+reared%2C+God+himself+is+represented+as+resting%E2%80%94resting+in+that+happiness+which+consists+in+the+possession+of+all+excellence+and+perfection%2C+and+in+the+exercise+of+wisdom%2C+beneficence%2C+and+power.+And+if+even+to+the+almighty%2C+ever-blessed%2C+and+unchangeable+God%E2%80%94+to+him+of+whom+it+is+said%2C+%E2%80%9Cthe+everlasting+God%2C+the+Lord%2C+the+Creator+of+the+ends+of+the+earth%2C+fainteth+not%2C+neither+is+he+weary%3B%E2%80%9D+if+even+to+him+the+Sabbath+could+be+said%2C+in+any+sense%2C+to+be+a+day+of+rest+and+refreshment%3B%E2%80%94what+a+season+of+holy+joy+and+devout+praise+and+thanksgiving+must+it+have+been+to+man%2C+while+yet+innocent%2C+bearing+the+Divine+image%2C+and+finding+his+chief+happiness+in+contemplating+the+works%2C+adoring+the+perfections%2C+and+enjoying+the+fellowship+of+his+Creator%21%0A%0AThe+sanctification+of+the+Sabbath+must+have+been+made+known+to+man%E2%80%94we+cannot%2C+in+fact%2C+otherwise+conceive+of+its+being+sanctified+at+all%3B+and+we+can+as+little+doubt+that+he+would+feel+himself+bound+to+sanctify+it+also%2C+by+as+strong+an+obligation+as+any+moral+law+could+law+upon+him.+But%2C+in+point+of+fact%2C+it+is+clear+from+the+epistle+to+the+Hebrews%2C+that+the+institution+of+the+Sabbath+had+an+immediate+reference+to+man+even+from+the+beginning%E2%80%94+that+it+was+to+him+not+only+an+emblem+of+God%E2%80%99s+rest%2C+even+of+the+infinite+satisfaction+and+complacency+with+which+the+Creator+contemplated+the+works+of+his+hands%2C+but+a+pledge+to+man+also+of+his+entering+into+and+becoming+partaker+of+the+same+rest.%0A%0AIt+is+true+he+forfeited+all+this+by+his+violation+of+the+covenant+which+had+secured+it+to+him%2C+only+on+condition+of+perfect+obedience%3B+and+had+no+provision+been+made+for+his+recovery%2C+the+Sabbath+had+ceased+to+be+to+him+a+token+of+his+participating+in+the+rest+of+God.+But%2C+in+the+covenant+of+grace%2C+a+Church+had+been+given+to+Christ+to+be+redeemed.+In+virtue+of+the+atonement+which+he+had+undertaken+to+make%2C+there+remained+still+a+rest+for+the+people+of+God%3B+the+Sabbath+continued+to+be+to+them+an+emblem+and+a+pledge+of+that+rest%3B+and+the+rest+itself+was+still+farther+illustrated+and+prefigured+under+the+type+of+Canaan%2C+which+occupied+so+prominent+a+place+in+the+Mosaical+economy.%0A%0AAnd+if+such+was+the+original+design+of+the+Sabbath%E2%80%94if+it+was+the+day+on+which+the+almighty+Creator+himself+declared+that+he+rested+and+was+refreshed%2C+in+the+contemplation+of+his+marvellous+work+of+creation%2C+the+exercise+of+a+Divine+beneficence%E2%80%94if+this+was+made+known+to+man+while+yet+bearing%2C+in+unsullied+purity%2C+the+Divine+image+of+his+Maker%E2%80%94if+it+was+afterwards+given+him%2C+even+in+bis+fallen+state%2C+as+an+intimation+of+God%E2%80%99s+gracious+purpose+of+bringing+him+out+of+the+disorder+and+debasement+into+which+sin+bad+gunk+him%2C+into+a+state+of+holy+and+eternal+rest%E2%80%94and+if+it+was+thus+designed+to+be+not+only+an+authoritative+command+requiring+men+to+devote+a+certain+portion+of+time+to+the+worship+of+God%2C+and+the+commemoration+of+that+glorious+work%2C+in+the+accomplishment+of+which+the+almighty+Creator+himself+found+rest%E2%80%94an+employment+of+time+which+ought+to+be+regarded+as+a+blessed+privilege%2C%E2%80%94if+it+was+not+only+designed+for+all+this%2C+but+also+to+be+an+emblem+and+a+pledge+of+that+rest+which+remaineth+for+the+people+of+God%3B+is+it+not+marvellous+that+those+for+whose+instruction%2C+and+consolation%2C+and+encouragement+it+was+intended%2C+should+make+it+a+subject+of+cold+and+heartless+speculation+whether+the+Fourth+Commandment+be+a+moral+or+a+positive+commandment%2C+as+if+it+were+their+interest+to+bereave+themselves+of+a+privilege+in+the+same+way+as+they+would+rid+themselves+of+an+in+tolerable+yoke+of+bondage%3F%0A%0AThere+are+two+truths+very+plainly+and+explicitly+stated+in+Scripture%2C+first%2C+%E2%80%9Cthat+in+six+days+the+Lord+made+heaven+and+earth%2C+and+on+the+seventh+day+he+rested%2C+and+was+refreshed%3B%E2%80%9D+and%2C+second%2C+that+he+has+promised+to+%E2%80%9Chis+people+that+they+mall+enter+into+his+rest.%E2%80%9D+And+surely+there+is+enough+in+these+truths+to+awaken+the+desire+of+finding+that+the+Sabbath+was+designed+to+be+a+permanent+institution%E2%80%94an+unfailing+source%2C+from+which+believers+may+drink+for+the+refreshment+of+their+spirits+and+the+revival+of+their+hopes%3B+and+that%2C+if+they+can+find+any+scriptural+ground+for+believing+that+such+is+the+Divine+will+concerning+the+appointment+of+one+day+in+seven%2C+to+be+a+holy+day+of+rest+for+his+service%2C+they+would+grasp+at+the+permission+thus+granted+them+to+observe+the+Sabbath%2C+and+would+call+%E2%80%9Cit+a+delight%2C+the+holy+of+the+Lord%2C+honourable.%E2%80%9D%0A%0A%E2%80%94+Robert+Gordon%2C+The+Sanctification+of+the+Sabbath%3A+A+Discourse+in+Christian+Miscellany&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7deefe806d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7deefe806d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/08/09/robert-gordon-on-the-sabbath-in-creation-the-covenant-of-works-and-the-covenant-of-grace/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

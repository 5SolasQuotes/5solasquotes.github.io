<blockquote><p>There is no scandall taken, but (if it be known to be taken, and the thing at which it is taken be not necessary) it is also given. … 2. Giving and not granting that the scandal of them who were first offended at the ceremonies [c. 1618] was only passive, yet the using of them after scandal is known to rise out of them, must be an active scandal, because the keeping of a thing which is not necessary, after scandal rises out of it, is an active scandal, though the scandal which at first rose out of it, had been only passive…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2</cite>, ch. 9, pp. 35-36</span></figcaption>

<blockquote><p>Here I shall once for all clearly prove that a minister’s universal and total abstinence from administration of the Lord’s Supper unto that flock or Church over which God has made him an overseer is unlawful, though for the eschewing of scandal. No sinful omission of that which is commanded by an affirmative precept is lawful for the eschewing of scandal: But a minister’s total and universal abstinence from the administration of the Lord’s Supper unto that flock over which God has made him overseer, is a sinful omission of that which is commanded by an affirmative precept; therefore it is not lawful for the eschewing of scandal. The major is confirmed from that of the apostle, Rom. 3:8, ‘Their damnation is just, that say, Let us do evil that good may come:’ as also that of Aquinas [Summa] 2nd of the 2nd part, Question 43, Article 7, ‘Secundum ordinem charitatis plus debet homo suam salutem spiritualem diligere, quàm alterius.’ ‘A well-ordered charity begins ever at home, making a man chiefly to desire and endeavour the salvation of his own soul, and consequently to be more solicitous how to avoid sin in himself, than to prevent it in others;’ See Rutherford more largely touching Scandal, [Question 6,] p. 84. The minor is proved, because it is necessary for my salvation to obey affirmative precepts, though not in all differences of time. See Rutherford, [Question 2,] pp. 13-14. Praecepta affirmativa obligant, though not ad semper, yet ad aliquando. ‘Affirmative Precepts tie us to do the things they require, though not at all times, yet at some time or other.’ And therefore universally and totally to abstain from what they command, is sinfully to omit what is commanded by them. I cannot but here call to mind a reply of the renowned [reformed, Daniel] Chamier to a shift of Cajetan [a Romanist], which he brings to elude our arguments against their Communion under one kind [which excludes the cup to the laity], that are drawn from the command of the Cup. The command, says Cajetan, is but affirmative; and affirmativa praecepta, ut si obligent semper, non tamen ad semper. [Affirmative precepts, so if they oblige always, yet not unto all times.] Unto which Chamier replies very solidly and sharply. Esto (says He) sed quid tu appellas pro semper? nullumne apud te discrimen est inter non semper? &amp; nunquam? [‘Eat’, says He, but why do you say ‘for all times’? Is there not even with you a discrimination between not-always and never?] The like reply will serve unto those who go about to evade the command of the Lord’s Supper, by telling us that it is an affirmative command, and does oblige semper, but not ad semper. It does always bind, but not to always: for there is a wide difference between not always and never. Now the upshot of these men’s tenets is that if the church be not presbyterated, the command of the Lord’s Supper does never bind during such its condition. Suarez in the 3rd part of Thomas, tome 30, disputation 80, sect. 1, as also Becanus in his Summae Theol. Scholastic., part 3, Tract 2, ch. 25, part 2, question one, allege diverse reasons why all priests whatsoever are bound to say mass; if you please to make such a change in them as to put ‘ministers’ for ‘priests’, and ‘the Lord’s Supper’ for ‘mass’, you may make them orthodox, and so they will serve our turn.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want of Church-Government.. (London, 1650) Jeanes was an English presbyterian.</cite>, pp. 8-9</span></figcaption>

<blockquote><p>5th Rule: To do any good action, or lawful, or indifferent, when I probably foresee a scandal will follow, is an active scandal, for I prefer my own will to my brother’s salvation (says Antoninus, and Navarret), and therefore says Antoninus: ‘A virgin going abroad, without just necessity, where her beauty shall be a snare to young men, or to go out upon a necessary cause with a whorish attire, is an active scandal,’ her feet ‘abideth not in her house,’ says Solomon (Prov. 7). And Navarre says, ‘It is to sin mortally’ and Silvester says: ‘If the Pope’s commandment do but smell of venial [light] sin, and if by giving audience thereunto it be presumed that the state of the Church shall be troubled, or a scandal shall arise, though the commandment go out under the pain of excommunication, it is not to be obeyed.’ Vasques and Suarez say to sell, gift or dispose of any things indifferent, when we foresee they shall abuse them, is to commit the sin of active scandalizing. Yea, the form of an idol, though he never adore it, does highly scandalize, and Antoninus, Silvester, Corduba, Metina [and] the Jesuit Zanches teach that to contribute to that which we see shall induce any to sin, is to be guilty of scandalizing. And the reasons be these: 1. We are not to prefer our will to the salvation of our brother. 2. Things less necessary than our brother’s salvation, in that case, become not necessary, and so fruitless and idl. 3. Charity infers that we hinder, so far as we can, the ruin of our brother’s soul; scandal is spiritual homicide. 4. To contribute any moral help and influence to our brother’s fall and soul-ruin, is to be accessary to his sin. Hence ceremonies and things not necessary to salvation may be omitted altogether in their specialities when the practicing of them does scandalize, and so though kneeling in God’s worship cannot well be universally omitted, yet kneeling appropriate to such an act of worship may be omitted, and ought to be omitted if it scandalize; and ceremonies which scandalize universally, seeing they are not in their very kind necessary to salvation, are to be abolished. Yet I may add one caution here. To contribute help for the doing of that which of itself is necessary, which I know another, in respect of human frailty, will abuse to sin is no active scandal. So to lay hands on a qualified pastor is not sin, though I foresee through human frailty [that] he will abuse his power in some things to sin. So for an artificer to make swords, though he know some shall abuse them to murdering the innocent, is no scandalous work. I take not on me to prescribe rules for eschewing scandal in all occurrences of providence. The godly-learned can see more than I can do in this matter, where love should be wary to lay a straw in the way of any weak traveler.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 13-14 of Question 2 in An Introduction to the Doctrine of Scandal in The Divine Right of Church Government (1646)</cite></span></figcaption>

ce+to+our+brother%E2%80%99s+fall+and+soul-ruin%2C+is+to+be+accessary+to+his+sin.+Hence+ceremonies+and+things+not+necessary+to+salvation+may+be+omitted+altogether+in+their+specialities+when+the+practicing+of+them+does+scandalize%2C+and+so+though+kneeling+in+God%E2%80%99s+worship+cannot+well+be+universally+omitted%2C+yet+kneeling+appropriate+to+such+an+act+of+worship+may+be+omitted%2C+and+ought+to+be+omitted+if+it+scandalize%3B+and+ceremonies+which+scandalize+universally%2C+seeing+they+are+not+in+their+very+kind+necessary+to+salvation%2C+are+to+be+abolished.+Yet+I+may+add+one+caution+here.+To+contribute+help+for+the+doing+of+that+which+of+itself+is+necessary%2C+which+I+know+another%2C+in+respect+of+human+frailty%2C+will+abuse+to+sin+is+no+active+scandal.+So+to+lay+hands+on+a+qualified+pastor+is+not+sin%2C+though+I+foresee+through+human+frailty+%5Bthat%5D+he+will+abuse+his+power+in+some+things+to+sin.+So+for+an+artificer+to+make+swords%2C+though+he+know+some+shall+abuse+them+to+murdering+the+innocent%2C+is+no+scandalous+work.+I+take+not+on+me+to+prescribe+rules+for+eschewing+scandal+in+all+occurrences+of+providence.+The+godly-learned+can+see+more+than+I+can+do+in+this+matter%2C+where+love+should+be+wary+to+lay+a+straw+in+the+way+of+any+weak+traveler.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+pp.+13-14+of+Question+2+in+An+Introduction+to+the+Doctrine+of+Scandal+in+The+Divine+Right+of+Church+Government+%281646%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb00b9b705f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b00b9b705f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-scandal/#:~:text=5th%20Rule%3A%20To%20do%20any%20good,the%20way%20of%20any%20weak%20traveler&amp;text=5th%20Rule%3A%20To%20do%20any%20good%20action%2C%20or&amp;text=straw%20in%20the%20way%20of%20any%20weak%20traveler" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…it is further confirmed by that great scandal whereby Peter compelled the Gentiles to judaize, Gal. 2:14. ‘He constrained them,’ says Perkins (Commentary on Gal. 2:14), ‘by the authority of his example, whereby he caused them to think that the observation of the Ceremonial Law was necessary.’ It was then the quality of his action which made the scandal active, because that which he did was inductive to sin; but we are not to think that Peter had an intention to draw the Gentiles to sin. (tome 1, an. 55, n. 39)</p></blockquote>

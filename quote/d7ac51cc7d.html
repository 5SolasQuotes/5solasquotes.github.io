<blockquote><p>…the ordinary power of working them is ceased: for it was only given to the apostles in the primitive Church, as a means to confirm the doctrine of the Gospel to unbelievers, that never heard of Christ before. So Paul says, ‘Strange tongues’ (that is, the gift of speaking strange languages, without ordinary teaching) ‘are for a sign, not to them that believe, but to them that believe not,’ 1 Cor. 14:22. And for the same end were all extraordinary gifts then given. Howbeit the Papists stand stiffly in defending the continuance of these gifts.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-20c8220a8a" data-kw="">
<blockquote><p>There is no more ground for such a ministration in this life [of the Spirit without Church ordinances] than there is for no death, no crying, no sorrow, no pain in this life, Rev. 21:4, no sun, nor moon, v. 23, no unclean thing, no sin, v. 27 and no more warrant for delivering up the Kingdom, in this life, 1 Cor. 15, than for the Resurrection of the Dead, 23:37, and the blowing of the Last Trumpet, [v.] 52, and the swallowing up of death in victory, 55-57, as if all these should come to pass in this life agreeable to this, says H. Nicholas, Evangel. ch. 35. sec. 9. In which Resurrection of the Dead, God shows unto us that the time is now fulfilled, that his dead, or the dead which are fallen asleep in the Lord, rise up in this day of his judgement and appear unto us in godly glory, which shall also henceforth live in us everlastingly with Christ, and reign upon the earth, wherein the Scripture comes to be fulfilled in this present day. And Saltmarsh wills these that are as spiritual as himself and his Familists, to believe this and receive it, that is, except, we make shipwreck of faith and say the Resurrection is past in this life, as did Hymeneus and Philetus, we are all legal, literal men and void of the Spirit.

2. Saltmarsh is unwilling to contradict the truth of God, 1 Cor. 15:24, too openly, to wit, that in the end the Kingdom shall be delivered up: Now whether this be meant of Christ’s reigning no more in his Church in this life by ordidinances, or as Chrysostom does expound the place, it be the rendering up to the Father his conquished and purchased people, as it is most agreeable to Eph. 5:27, I dispute not now, but Saltmarsh says faintly, This is not only done on the whole body of Christ at the last, but also here. He dares not say this rendering up is not only at the Last Day, but also in this life; yet the apostle is clear, he thought of no rendering up of the Kingdome in this life, as Saltmarsh by this new spirit supposes, for the text is clear, v. 22-23, every man shall rise again from the dead, Christ first and then his members [Greek], ‘Then is the end when He shall deliver up the Kingdom to the Father.’ Then: [1.] there is no rendering up till the dead in Christ be raised, vv. 23-24, but the dead in Christ in their bodies (of which undoubtedly the apostle speaks, 1 Cor. 15:1-4, etc. do not rise in this life.

2. This rendering up is not till the end, then shall the end be.

3. It is when all rule and authority shall be put down, v. 27; this is not in this life.

4. It is when the last enemy shall be subdued, v. 26.

5. When God shall be all in all, v. 28. These are not in this life, therefore Saltmarsh dreams.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, ... (London, 1648) | pt. 1 | ch. 34, ‘A taste of the wild allegoric interpretations of Scripture that are in this piece of Saltmarsh, which he fathers upon the pure immediate actings of the Spirit beyond Law and Gospel’, pp. 287-88</span></figcaption>

is%20life%2C%20therefore%20Saltmarsh%20dreams&amp;text=There%20is%20no%20more%20ground%20for%20such%20a&amp;text=are%20not%20in%20this%20life%2C%20therefore%20Saltmarsh%20dreams" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4c849b76e2" data-kw="">
<blockquote><p>For these things [Mk. 16:17-20] are not absolutely and without exception, but in some respect the tokens of faith belonging to that primitive Church until the gospel were made more manifest. For miracles were as trumpets and open criers whereby the gospel was commended. For even as the law of Moses procured to itself credit, through the manifold miracles showed upon mount Sinai and in the wilderness, which afterward ceased when they were come to the land of promise: so in like manner miracles are now also taken away, seeing the gospel is spread throughout the world. And therefore the promise which Christ would have to be written in the gospel of Mark belonged not to all times; whereof it is not our part either to complain or find any fault, because that we hear that the Holy Ghost distributes to everyone as He will, who nevertheless, for great considerations Him moving, does not impart to all men gifts and graces alike. For if they should happen to all alike, they would soon grow out of estimation, whereas God has determined to make store of them. Moreover, He would that charity should grow and increase, which is then exercised when one man does help another, which thing would not have taken place if all men had been endued with like gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether it be lawful for the godly to desire miracles, and why there be none in this our age’ in ch. 9. ‘Of Miracles, &amp; the Definition &amp; Difference of Them’ in The Common Places</cite>, … (London: Henrie Denham et al., 1583), pt. 1, pp. 69-72, pp. 71-72</span></figcaption>

<blockquote><p>7. Yet we say, that as God by gifts may furnish some in a more than ordinary way; so may He, and uses He to thrust them out in a mixed way to the exercise of these for the edification of His Church, and make the seal of his call extraordinarily ratify his sending of them, that is, as He may furnish men partly by means, and especially by his blessing extraordinarily accompanying them, so may He send them out partly in a mediate way by men’s opening of the door, partly by his more than ordinary thrusting of them out, making up so what was defective in the mediate call by some extraordinary concurrences of impulse and gifts within, of circumstances of providence without, and of efficacy upon, and acception of it amongst others, whereby it cometh to be ratified. This the Lord fulfilled at the entry of the Reformation, raising up men comparatively extraordinarily furnished and commissionated for his work, yet still ministers of the same Gospel, and walking according to the common rule with others in their ministerial charge. This is not ordinarily to be imitated, but where the like cases, call, and circumstances concur…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 10, ‘Concerning Prophesying’ in A Commentary upon the Book of the Revelation… (Edinburgh, 1658), pp. 469-72</span></figcaption>

<div class="actions"><button class="copy" data-copy="“7. Yet we say, that as God by gifts may furnish some in a more than ordinary way; so may He, and uses He to thrust them out in a mixed way to the exercise of these for the edification of His Church, and make the seal of his call extraordinarily ratify his sending of them, that is, as He may furnish men partly by means, and especially by his blessing extraordinarily accompanying them, so may He send them out partly in a mediate way by men’s opening of the door, partly by his more than ordinary thrusting of them out, making up so what was defective in the mediate call by some extraordinary concurrences of impulse and gifts within, of circumstances of providence without, and of efficacy upon, and acception of it amongst others, whereby it cometh to be ratified. This the Lord fulfilled at the entry of the Reformation, raising up men comparatively extraordinarily furnished and commissionated for his work, yet still ministers of the same Gospel, and walking according to the common rule with others in their ministerial charge. This is not ordinarily to be imitated, but where the like cases, call, and circumstances concur…”

— James Durham, ch. 10, ‘Concerning Prophesying’ in A Commentary upon the Book of the Revelation… (Edinburgh, 1658), pp. 469-72">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C7.+Yet+we+say%2C+that+as+God+by+gifts+may+furnish+some+in+a+more+than+ordinary+way%3B+so+may+He%2C+and+uses+He+to+thrust+them+out+in+a+mixed+way+to+the+exercise+of+these+for+the+edification+of+His+Church%2C+and+make+the+seal+of+his+call+extraordinarily+ratify+his+sending+of+them%2C+that+is%2C+as+He+may+furnish+men+partly+by+means%2C+and+especially+by+his+blessing+extraordinarily+accompanying+them%2C+so+may+He+send+them+out+partly+in+a+mediate+way+by+men%E2%80%99s+opening+of+the+door%2C+partly+by+his+more+than+ordinary+thrusting+of+them+out%2C+making+up+so+what+was+defective+in+the+mediate+call+by+some+extraordinary+concurrences+of+impulse+and+gifts+within%2C+of+circumstances+of+providence+without%2C+and+of+efficacy+upon%2C+and+acception+of+it+amongst+others%2C+whereby+it+cometh+to+be+ratified.+This+the+Lord+fulfilled+at+the+entry+of+the+Reformation%2C+raising+up+men+comparatively+extraordinarily+furnished+and+commissionated+for+his+work%2C+yet+still+ministers+of+the+same+Gospel%2C+and+walking+according+to+the+common+rule+with+others+in+their+ministerial+charge.+This+is+not+ordinarily+to+be+imitated%2C+but+where+the+like+cases%2C+call%2C+and+circumstances+concur%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+James+Durham%2C+ch.+10%2C+%E2%80%98Concerning+Prophesying%E2%80%99+in+A+Commentary+upon+the+Book+of+the+Revelation%E2%80%A6+%28Edinburgh%2C+1658%29%2C+pp.+469-72&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F75bb75dfa8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/75bb75dfa8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/cessationism/#:~:text=7.%20Yet%20we%20say%2C%20that%20as,like%20cases%2C%20call%2C%20and%20circumstances%20concur&amp;text=7.%20Yet%20we%20say%2C%20that%20as%20God%20by&amp; <blockquote><p>Now Libertines turn all our faith in a topic and conjectural opinion, so most of them are turned sceptics and affirm that we know nothing with any certainty; yea the more supernatural and sublime that fundamentals of salvation are, the more indulgence and latitude of liberty is to be yielded to the consciences of all men, because the higher the subject is, the ranker is our propension to err, God having given a thinner and more scarce measure of knowledge in supernaturall things, that do so far transcend the sphere and orb of natural reason, than of knowledge in natural things, our minds being in their own element, and in a capacity to reach their connatural and proper object when they are among natural things knowable by the light of nature; Hence that opinion now so prevailing that all and every religion is to be tolerated, and an indulgence yielding to all in superstructures in fundamentals, though a man should deny that Christ is the Saviour of the world; therefore Saltmarsh takes on him (Sparkles of Glory as pp. 185-188) to reckon out the articles of our faith, especially concerning the first Adam’s sin, sin-original, of Christ born of the virgin Mary, made under the Law, bearing our sins, dead, buried, ascended into Heaven, siting at the right hand etc. and speaks of the highest attaintments of the protestants generally in the mystery of salvation. but speaks not one word of the general resurrection of our bodies, of Christ coming to judge all men, of a Heaven and Hell after this life, as if these were none of the highest attaintments of the protestants generally in the mystery of salvation. And Saltmarsh, as I conceive with Hymeneus and Philetus and other Libertines in the [English] army, doubt of or deny these…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-58428f44b4" data-kw="">
<blockquote><p>I so think that in the very point of generation, when the matter is disposed to that point that it is apt for the reception of the substantial form, which makes a man out of an embryo, that the souls of individual men are more probably both new and created from nothing, this being in greater harmony with the sacred letters, testimonies of the fathers and philosophers, and reasons than that one is propagated from another through being passed over or through the seed of parents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hermann-vultejus.html">Hermann Vultejus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Philosophical Perfection of Man’ (1581) in ed. Rudolph Goclenius, Psychology, i.e. Commentaries &amp; Dispuations on the Perfection &amp; Soul of Man… from some Theologians &amp; Philosophers of our Age tr. by AI by Onku (Marburg: Paul Egenolph, 1595), p. 8 Latin Vultejus (1555-1634) was a German jurist and professor at the University of Marburg.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

<blockquote><p>Philosophers hold that the definition of a man belongs to an infant as well as to one of many years, because after the organization of the parts, he is informed with the same principle of life and reason as a grown man is; and having the same form, is the same thing.</p></blockquote>

</figure><figure class="quote" id="q-b1f5f5dfda" data-kw="">
<blockquote><p>Indeed, there are almost as many Scriptures that speak of the curse of many children (Gen. 3:16; Eccl. 6:3; Is. 49:19-21; Deut. 28:18-19; Ezek. 5:7-8 [KJV]; Jer. 15:9; Job 27:13-15; Luke 23:29) as there are that speak of the blessings of having many children (Gen. 17:2,20; 22:17; 26:24; 28:3; 35:11; 48:4; Ex. 32:13; Deut. 7:14; Ps. 17:14; 113:9; 127:1-5; 128:1-6; Prov. 17:6; 1 Tim. 5:14). The fall has brought about circumstances that certainly lead to great difficulties – so great that the Scripture no longer speaks of those many children as always being a blessing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’ (2017)</cite></span></figcaption>

<blockquote><p>(2) The formation of Christ’s body, to which belongs its organization, animation and the uniting of the two, body as well as soul, with the blood. 28: Query, Was Christ’s body formed in a moment or successively? Answer: Three things occur here: (1) the preparation of the material of which Christ’s body was formed; (2) the formation of the body out of the material duly prepared; (3) the completion of the same body brought gradually by its own increments to the proper stature. As regards (1) and (3) all are agreed that they were accomplished by degrees (successive). As regards (2) theologians disagree, some urging an instantaneous formation, others a successive, with the latter of whom we agree. Because: (1) the instantaneous and miraculous formation of Christ’s complete body and its union with the soul is a fiction unsupported by Scripture; (2) in his assumption of human nature Christ is said to have been made like us, except for sin; (3) if Christ’s body was completed in a moment, it could equally have been born the same moment and the Blessed Virgin need not have suffered the inconveniences of ordinary generation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(XI, 27) as quoted in Heinrich Heppe, Reformed Dogmatics, ch. 17, Person of Christ, section 12</cite>, pp. 425-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-61ab4fa8b4" data-kw="">
<blockquote><p>I know the most received opinion is that the soul is created by God, and so becomes defiled with sin by the union of it to the body; as when a man falls into the dirt and is soiled and bedaubed, or as water clean in itself receives filth from an unclean vessell into which it is put… For my own part [his traducianism was stated before this passage on the same page] I cannot conceive either how sin should first be in the body before the soul is united to it, or how the soul should receive infection from the body.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c4200c6001" data-kw="">
<blockquote><p>It is evident that since the fall no man can be sanctified unless he has been previously justified upon some scheme. In the case of Adam, on the contrary, it was necessary he should be holy, or, what is the same thing, that he should have obeyed the law before he could be justified. His justification in the eye of the law depended on his perfect fulfilment of all its commands, both in the letter and in the spirit.

No less could have been required under the scheme of works upon which he relied for justification. And doubtless Adam was endued with strength sufficient to have enabled him to yield such an obedience, and had he remained in his integrity during the time appointed by God for his trial, he would have been pronounced legally righteous, and confirmed in holiness for eternity. But the moment he broke the law and failed to perform the conditions of the covenant into which he had entered with God, that instant it became absolutely impossible for him to be justified on the scheme under which he hitherto lived.

The order which had previously existed between justification and sanctification was completely reversed, and it became absolutely necessary for him to be justified before he could be sanctified. And since the sinner is now precisely in the same situation with Adam subsequent to the fall, the same necessity must still hold in every individual case. The impossibility of being sanctified before justification, consists in the fact that all are under the curse of God’s violated law, and consequently in a state of present condemnation. “Cursed is every one that continueth not in all things that are written in the law to do them.”

As the person and the works of the moral agent are strictly related, the one derives its complexion from the other. Now, under the first covenant, the person of the individual was accepted in consequence of the previous acceptance and justification of his works; under the last covenant, the order is directly inverted. The works of the sinner are accepted in consequence of the previous acceptance and justification of his person. Or, as has been pithily said under the covenant of works, the order was, do this and live. Under the covenant grace: live that you may do this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sanctification by Grace in George A. Blackburn (ed.), Sermons by Rev. John L. Girardeau, D.D., LL.D., Late Professor in the Theological Seminary, Columbia, S.C.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee76f0e995" data-kw="">
<blockquote><p>Now take both Laws, the Ceremonial Law and the Moral Law or the Decalog. Imagine that by the merit of congruity you have made so much progress that the Spirit has been granted to you and that you have love. Of course, all this would be a monstrosity and cannot be found anywhere in the nature of things. But imagine, I say, that, by doing what lies within you, you acquire grace, are righteous, and have the Spirit. On what basis? On the basis of the merit of congruity? Then you do not need Christ, but He has become useless to you and died to no purpose.</p></blockquote>

</figure><figure class="quote" id="q-d2ab67faba" data-kw="">
<blockquote><p>Preaching at the opening of Fisherwich Presbyterian meeting-house, Belfast in 1827, Thomas Chalmers explained the connection between justification and sanctification. A contemporary report of the sermon gives us the following account of Dr Chalmers’s sermon:

He then came to the practical application of his subject, – that holiness of life, according to the Christian dispensation, was indispensable to eternal happiness. […] Sanctification is a renewal of the inward man, arising from the operation of the Holy Spirit producing a conviction of past error, and a determination for future amendment of life – for, said he, (with a warmth of manner which we have seldom witnessed,) though we are justified by faith alone, we are not justified by that faith which is alone. […] “THERE IS A WORLD OF THEOLOGY IN THAT SENTENCE – ‘We are justified by faith alone, but not by that faith which is alone.&#x27;” After a moment’s pause, he described the heaven of the Christian, as a heaven of uprightness – a heaven in which the state of a man’s soul, in a moral sense, arising from sanctification by faith, would be more conducive to celestial enjoyment that the place itself – an enjoyment arising from the pure worship of God, and the pleasure of holding converse with the saints, sanctified by faith in Christ. As well, he exclaimed, in a strain of intense eloquence, to which we feel inadequate to do justice, – as well might you offer a heaven of beauty to a blind man, or a heaven of melody to a deaf man, or a heaven of philosophy to a man void of understanding, as a heaven of holiness to a man unsanctified by faith. The place of that heaven is in the heart of man, regenerated by the conviction of the necessity of a virtuous course in this life, to the enjoyment of felicity in that to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Guardian and Constitutional Advocate</cite>, 28 Sep. 1827</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

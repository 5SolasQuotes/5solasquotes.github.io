<blockquote><p>The Sabbath is partly a moral, and partly a positive institution. We call that a moral institution, which is founded in the relation subsisting between God and man, and discoverable by the light of nature. We call that a positive institution which is binding upon us, only because it has been enacted by some authority, to which we owe subjection.

That there should be a Sabbath, or some portion of the public time set apart for the worship of God, is a dictate of moral natural law. This appears from the following considerations. Man is a social being. He is born in society, and born for society. “It is not good for man that he be alone.” As the solitary tree of the desert is generally stunted in its size and scanty in its foliage, compared with its princely kindred of the forest, which, sheltered by one another, have braved the fury of a thousand blasts, and the rigour of a hundred seasons; so man, in a solitary state, would be altogether unlike the being he is in society; the whole powers of his nature could not be developed, and all the happiness of which he is capable could not be obtained; those affections, to which life owes much of its comfort, and all its refinement, which are the well in the heart from which flow all the streams of earthly delight, would have been in a solitary state, like a “spring shut up — a fountain sealed.” Not from accident then, but from the benevolent design of his Maker, man is a social being.

Now it is incumbent on man to devote his whole nature unto God. You are frequently told that you are responsible unto God for your wealth – that you are responsible for your official station, and your relative influence; but you should also bear in mind, that you are responsible for all the powers of your nature. “Holiness to the Lord,” should be written upon every faculty, feeling, and tendency of the mind; no exception must be made by us , for none is permitted by God, “thou shalt worship the Lord thy God, with all thy heart, and with all thy soul, and with all thy strength, and with all thy mind.”

Here then, we have two facts: man is bound to devote his nature in all the fulness and variety of its faculties unto the Lord; but man is a social being, the social principle is inborn and essential to his nature. This, therefore, should be dedicated to the Lord. Personal religion is the first duty, and personal piety is the greatest privilege we enjoy in this world; but social religion is also a duty, and social piety also a privilege, in the exercise of which, advantages may be reciprocally obtained and communicated.

That principle which leads men who are like minded, to meet for the attainment of common ends, should lead men who are religious minded to meet for the attainment of religious ends. If there are societies to promote the advancement of science, art, and agriculture; should there not also be societies to promote improvement in religion. If men unite to petition earthly legislators about their earthly interests; if they meet to present an united expression of their loyalty to the powers that be; should they not also meet and unite to express their love and loyalty to the King of Kings, and petition him about their eternal interests; in other words, it is incumbent on man to worship God as a social being.

From this principle, arises the obligation to worship God in families. It lays the foundation for the public worship of God in local churches, — it is the foundation of national churches, the first idea in which is national worship, or the national acknowledgement of God’s supremacy. This also is the foundation of a fixed Sabbath; for if it be the duty of men to worship God together, it is necessary that a portion of the public social time be set apart for this purpose. This portion of time must be fixed and known; for though an individual in worshipping God in private, may vary the time when he does so, it is necessary that the time set apart for social religion be known to the worshippers, that they may assemble with the certainty of meeting one another; and it can only be known to them by being fixed by common consent, or by some authority, whom all acknowledge.

As it is to be social worship that is offered, and the social time that is set apart; even the light of nature seems to teach, that during the period of worship, there be a general suspension of worldly business. This principle, carried to its legitimate length, reaches the circumference of the social circle, and vindicates a national Sabbath; yea, a Sabbath over all the earth, so that in the universal rest, and the adorations that are offered, there be one simultaneous expression of homage offered at the throne of the Eternal.

In the nature of things we thus see reason why some part of the social time should be set apart to the worship of God; and also, that this time should be fixed and known. How much of our time, should be set apart for this purpose;—whether the Sabbath shall be a whole day, or only part of a day at a time;—whether it shall be one day in seven, or one day in twelve, the light of nature does not teach. All that it teaches us about the subject, is summed up in two conclusions. First, that the time allotted for public worship, shall neither occur so frequently, nor be continued so long, as to deprive us of sufficient time, for performing the necessary business of life. Second, that it shall neither continue for too brief a period, nor occur so seldom that former impressions will be forgotten before it comes round. The duty to devote a seventh part of our time unto God, and the particular day on which this shall be done, arises wholly from positive appointment, and the Sabbath is thus partly a moral and partly a positive institution.</p></blockquote>

<blockquote><p>Thus far the old dispensation; the new succeeds, the administration of the covenant without the law and ceremonies after the appearance of Christ. It is called “new” not as to the substance of the covenant (which is the same in both) but: (1) as to the circumstances and mode, being manifested without a veil and the law (in which way that covenant appeared as if new or renewed), also because it sets forth Christ not to be exhibited but as exhibited, in which way it can be called new both intensively as to degree of light and extensively as to amplitude, extending itself indiscriminately to all nations; (2) as to the excellence and glory of this dispensation which far surpasses the old (2 Cor. 3:9, 10), as new is elsewhere taken for what is remarkable and superior (Rev. 5:9; Ps. 33:3); (3) as to perpetual duration, by which it happens that it is as it were always new, while those things which ought to cease are called old.</p></blockquote>

<blockquote><p>As I am not willing to thrust any man into extremes, nor to trouble men with calling those sins which God has not forbidden…

1. It is not absolutely unlawful to personate another man, nor does the Second Commandment forbid such living images in this extent…

2. To personate good men in good actions, is not simply unlawful…

3. To personate a bad man, in a bad action, is more dubious; but seems not to be in all cases unlawful…

4. I think it possible to devise and act a comedy or tragedy which should be lawful and very edifying. It might be so ordered by wise men…

5. I think I never knew or heard of a lawful stage-play, comedy or tragedy in the age that I have lived in: And that those now commonly used, are not only sins, but heinous aggravated sins, for these reasons:</p></blockquote>

0for%20these%20reasons" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-792cfe5dde" data-kw="">
<blockquote><p>What shall it profit a man, if he gain the whole world, and lose his own soul? said our Saviour, who was to lay down a ransom for it, and knew well that it would cost infinitely more than the world was worth. Yet, the most of men value their own souls at a far lower rate than the whole world, losing them for broken morsels of it: yea, many times for vain hopes that are never accomplished. And as these men make a miserable bargain, so on the contrary, they that lose the world, or any thing worldly, yea, though it were the whole, to save their souls, make a profitable loss of it.

Nature teaches men to hazard and lose all for the life of the body rather than lose it, (although it proves many times very uncomfortable by the loss of these outward things,) and yet, the most part of men pass their whole life-time without one serious thought of the excellency and importance of their souls, whose life and happiness is of a higher nature, and neither consists in, nor depends upon, any thing here below. Hence it is, that while they use the helps of this present life, and the defences of it when it is in danger, and use them with so much diligence and attention, the means of that better life of their better part, their souls, they either use not at all, or so slightly and coldly that they never find salvation in them.

You may find it some way in yourselves: the threatenings and preparations of men against you, have awakened and roused you more to think upon means of your temporal safety; but how few are sensible and afraid of the wrath of God, who, as our Saviour tells us, can kill both body and soul, and cast them into hell! You want not frequent advertisement from the word of God, so plentifully preached, that many are perishing, one part in gross ignorance of God, another in profane and licentious living, and the greatest part in a formal and lifeless profession of religion, without the power of it; and yet, where are they who lay it to heart, and bestir themselves to rescue their souls from destruction?

Certainly, whatsoever men profess, it is unbelief that is the cause of impenitence. Men are not convinced of the purity of God’s nature, nor sensible of the impurity of their own; therefore they apply not themselves in good earnest to the work of repentance, and to reformation, the liveliest part of it. Labour, then, for a more active and practical knowledge of God and Divine truths, such as may humble and renew your souls; not only that you may be delivered from outward troubles that threaten you, but much more, that you may escape the wrath to come.

And because neither the word preached, nor judgments, nor mercies that are set before you, are sufficient to quicken a dead soul, or soften a hard heart, without the effectual concurrence of the Spirit of God, let us have recour.se to the throne of grace, by humble and earnest prayer, in the name and mediation of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons</cite>, in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 93-94.</span></figcaption>

<blockquote><p>Let no one seize my statements as an excuse for saying that it is lawful for images or pictures to be venerated, since at times God and Christ seem effectively to declare themselves to us there. For we have clear instruction not to make ourselves images to worship. But regarding scriptural words and sacraments, nothing prevents our worship in hearing or receiving them, because they are instituted by the word, will and command of God, so that we may be called to divine service, which consists of worship. Nor should you gather from this that the elements of the Eucharist are to be worshipped. For whatever strength the symbols have is from the Holy Spirit, the words of the Lord and his institution, which are nothing without the use of the sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on the Sacrament of the Eucharist</cite>, (1549), trans. and ed. Joseph C. McLelland in The Peter Martyr Library: Volume 7 (Kirksville MO: Sixteenth Century Essays &amp; Studies, 2000), §51, p. 87.</span></figcaption>

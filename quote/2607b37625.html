<main class="wrap"><figure class="quote" id="q-2607b37625" data-kw="">
<blockquote><p>Having observed that the word of God is the test which discriminates between his true worship and that which is false and vitiated, we thence readily infer that the whole form of divine worship in general use in the present day is nothing but mere corruption. For men pay no regard to what God has commanded, or to what he approves, in order that they may serve him in a becoming manner, but assume to themselves a license of devising modes of worship, and afterwards, obtruding them upon him as a substitute for obedience.

If in what I say I seem to exaggerate, let an examination be made of all the acts by which the generality suppose that they worship God. I dare scarcely accept a tenth part as not the random offspring of their own brain. What more would we? God rejects, condemns, abominates all fictitious worship, and employs his Word as a bridle to keep us in unqualified obedience.

When shaking off this yoke, we wander after our own fictions, and offer to him a worship, the work of human rashness; how much soever it may delight ourselves, in his sight it is vain trifling, nay, vileness and pollution. The advocates of human traditions paint them in fair and gaudy colours; and Paul certainly admits that they carry with them a show of wisdom; but as God values obedience more than all sacrifices, it ought to be sufficient for the rejection of any mode of worship, that it is not sanctioned by the command of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Reforming the Church, Presented to the Imperial Diet at Spires, A.D. 1544, in the name of all who want Christ to Reign</cite>, (1544) in Tracts and Letters relating to the Reformation, trans and ed. Henry Beveridge, (7 vols, Edinburgh: Calvin Translation Society, 1844), 1: 132-33.</span></figcaption>

<blockquote><p>Ma. Now remaineth the last Commmandment?

Sch. Thou shalt not cover thy Neighbour’s house. Thou shalt not covet thy Neighbour’s wife, nor his servant, nor his Maid, nor his Ox, nor his Ass, nor any thing that is his.

Ma. What is more commanded here than was before?

Sch. God hath before forbidden evil doings &amp; corrupt affectations of the mind; but now he requireth of us a more precise pureness, that we suffer not any desire, be it never so light, nor any thought, be it never so small, in any wise swerving from right, once to creep into our heart. For it is meet that even in our very hearts and minds, should shine before God most perfect pureness and cleanness. For no innocency and righteousness, but that which is most perfect, can please him: whereof he hath also set before us this Law as a most perfect Rule.</p></blockquote>

</figure><figure class="quote" id="q-51e9c9e97f" data-kw="">
<blockquote><p>My I. Rule is, THAT there be instantly an enquiry into, and a revival of the laws made and enacted by the state in times of reformation, and the acts of the church in her primary assemblies, both made against all such as do speak, publish, or disseminate any doctrines or opinions, against any of the persons of the holy and blessed Trinity, or denies and disparages any part, or doctrine, of divine revelation; and these acts and laws reduced into practice, by such as are in a capacity of so doing, against all such enemies to both GOD and good men, as do, and are in the habit of publishing against GOD, and against divine revelation.

TWO things will exhibit the necessity, the expediency, and utility of such a plan being forewith set on foot. First, The approven conduct and practice of Israel, who were laid under the most positive and particular obligations, to watch most zealously against all such as would either deny the true GOD, or bring in false worship, contrary to the express nature and design of the first and second commandments. Let Deut. V. 12, 13 be read and duly considered, as an original reason why we should take good heed to ourselves on this head. – Second, Let us consult civil and ecclesiastical histories, and we will find that it has been the practice of all the countries of Europe, where true Christianity has prevailed, to make laws against atheists and deists designs to oppose GOD and his glory, or to deny divine revelation: And from such warrants and presidents as these, be induced to adopt the above rule into public use, as a barrier against the growth of infidelity. […]

Rule V. THAT every magistrate should, and every faithful minister ought, in their distinct spheres, endeavour to prevent, or will bring to deserved punishment, all persons who encourage deistical principles, as the same are destructive to both religious and civil society; and all printers who will publish, either more openly or secretly, those tenets and principles as have a manifest tendency to destroy the true foundations of faith and hope, and overturns the first principles of religious practice, and tends absolutely to reduce the final state of the Christian world, to a condition infinitely dangerous and hazardous; in as much, as all deists do reject that true revelation, which GOD himself hath confirmed with the most illustrious attestations; and refuses all the parts of that divine testimony GOD has given of his Son, as a Redeemer; and slights the authority of his laws, and the offers of his grace and mercy; and despises all his glorious promises, and sets at nought all his righteous threatenings: this brings persons and nations under dreadful guilt, where such tenets and opinions are openly encouraged.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-stavely.html">William Stavely</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An appeal to light; or, the tenets of Deists examined and disapproved; and the authority of the Holy Scriptures asserted and vindicated</cite>, (Belfast, 1796), pp 138-9, 142.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

Rule V. THAT every magistrate should, and every faithful minister ought, in their distinct spheres, endeavour to prevent, or will bring to deserved punishment, all persons who encourage deistical principles, as the same are destructive to both religious and civil society; and all printers who will publish, either more openly or secretly, those tenets and principles as have a manifest tendency to destroy the true foundations of faith and hope, and overturns the first principles of religious practice, and tends absolutely to reduce the final state of the Christian world, to a condition infinitely dangerous and hazardous; in as much, as all deists do reject that true revelation, which GOD himself hath confirmed with the most illustrious attestations; and refuses all the parts of that divine testimony GOD has given of his Son, as a Redeemer; and slights the authority of his laws, and the offers of his grace and mercy; and despises all his glorious promises, and sets at nought all his righteous threatenings: this brings persons and nations under dreadful guilt, where such tenets and opinions are openly encouraged.”

<main class="wrap"><figure class="quote" id="q-e3cc892188" data-kw="">
<blockquote><p>(Now these heretics) have themselves been sent forth by Satan, for the purpose of slandering before the Gentiles the divine name of the Church. (And the devil’s object is,) that men hearing, now after one fashion and now after another, the doctrines of those (heretics), and thinking that all of us are people of the same stamp, may turn away their ears from the preaching of the truth, or that they also, looking, (without abjuring,) upon all the tenets of those (heretics), may speak hurtfully of us. (The followers of Carpocrates) allege that the souls are transferred from body to body, so far as that they may fill up (the measure of) all their sins. When, however, not one (of these sins) is left, (the Carpocratians affirm that the soul) is then emancipated, and departs unto that God above of the world-making angels, and that in this way all souls will be saved. If, however, some (souls), during the presence of the soul in the body for one life, may by anticipation become involved in the full measure of transgressions, they, (according to these heretics,) no longer undergo metempsychosis. (Souls of this sort,) however, on paying off at once all trespasses, will, (the Carpocratians say,) be emancipated from dwelling any more in a body. Certain, likewise, of these (heretics) brand their own disciples in the back parts of the lobe of the right ear. And they make counterfeit images of Christ, alleging that these were in existence at the time (during which our Lord was on earth, and that they were fashioned) by Pilate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hippolytus-of-rome.html">Hippolytus of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Refutation of All Heresies,” in Fathers of the Third Century</cite>, ed. Alexander Roberts, James Donaldson, and A. Cleveland Coxe, trans. J. H. MacMahon, vol. 5, The Ante-Nicene Fathers (Buffalo, NY: Christian Literature Company, 1886), 114.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2ae448f943" data-kw="">
<blockquote><p>…’the way of worship not prescribed by God’ may be either when the worship is to another thing besides or with God, which alone proves idolatry… Or, ‘by another way’, is meant another ceremony or rite in which the worship of God is placed, such as was the Pharisees’ washing their hands, which may be will-worship, if to God only, but not idolatry; and so if he could prove our [Anglican] ministers guilty of this, yet should they not be proved idolaters any more than the Pharisees were, with which neither Christ nor his apostles do charge them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England against a book unjustly entitled, A Christian testimony against them that serve the image of the beast</cite>, … (London: E. Cotes, 1667) | Sect. 3. This Authors Argument as well proves himself an Idolater as the Conformist, Ch. 7; p. 216</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-a6eef9a0dc" data-kw="">
<blockquote><p>In fact let us learn how greatly our nature inclines toward idolatry.… That saying of Horace still stands: once the gods of fools are born of fear. Or rather, as Scripture teaches, once the true knowledge of God has been blotted out by sin, the mind of man becomes a perpetual forge of idols.… Man will be compelled to confess that he is a transient being, and that those whose images he worships were once mortals like himself; yet he transfers divinity to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.11.8–9</span></figcaption>

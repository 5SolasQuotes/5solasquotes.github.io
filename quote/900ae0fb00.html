<blockquote><p>XVII. The consideration of this, that magistracy is an ordinance of the only wise God, and that such as are in authority are warranted of Him, and have commission from Him, should move Christians to carry themselves under them in the exercise of their power, as loyal, dutiful subjects, whatever their persons be, tho’ heathens and strangers to Christ, and enemies to his kingdom; for He would have the Christian Romans live in subjection unto their heathen magistrates, emperors, consul or senate, upon this motive, that there is no power but of God; and the powers that be, are ordained of God [Rom. 13].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of Romans</cite>, (Edinburgh: Paterson, 1766), ch. 13, p. 505 Wamphray was an influential and leading Scottish covenanter.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>For the words themselves, ‘Honor the King’, I have already spoken at large of the duty contained herein: Know we only, that by the King here, is meant Caesar, who was a heathen emperor, one that intruded himself, ruled tyrannously, and was an idolater… … Under this honor is understood, the inward reverence in heart to be declared outwardly by obedience to all their godly commandments, cheerfulness in payments, prayer and thanksgiving, etc. Now if all this be due to a wicked King, as here, and now to be performed of us, if we had a wicked king, what then is to be done of us to such a king as God has bestowed on us?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rogers.html">John Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly and Fruitful Exposition upon all the First Epistle of Peter</cite>, (d. 1636; 1650) | On 1 Tim., 2:17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-781bb5691f" data-kw="">
<blockquote><p>…things at which offence is taken, first my petitioning for my life to the [usurped] parliament (so called)… to both which I shall give full satisfaction. About my petitioning, a double offence is taken, first at the titles of my petitions… I shall speak briefly to both, to take away any stumbling block out of the way of any. Touching the titles of my four petitions, they run in this form: ‘To the Supreme Authority, the Parliament of the Commonwealth of England’. Although I am far from going about to justify their right to this title to whom I give it, yet I shall justify the lawfulness of my practice in giving them this title which they assume to themselves, especially in a case of life [or death] as mine is: for in trivial matters I had rather lose my own right which belongs to me than give them this title which belongs not to them. The reasons which sway with me why I gave them this title (though I am not satisfied they have a right to it) are these: 1. They would not receive my petitions without giving them their assumed titles; yea to my knowledge they have rejected petitions which have not had these titles. 2. I am upon sure and clear grounds persuaded that giving to men titles they assume to themselves is not a real owning that they have a right to those titles. Titular and real are usually distinguished; by giving them the title of ‘Supreme Authority’ and ‘Parliament,’ I do acknowledge them a titular authority and a titular parliament, but by engaging [by an oath of allegiance] to them (which I have never done and I hope shall never do), I do acknowledge them a real authority and a real parliament. That I may further evince the truth of this second reason, viz. that giving of titles to men they assume to themselves, is not a real owning that they have a real right to those titles, I shall give sundry instances in Scripture to make it good: 2 Sam. 16, Hushai did call Absalom, that notorious usurper, ‘king,’ saying, ‘God save the king, God save the king,’ (an expression the people gave him), yet Hushai knew that David only was (even then) the lawful king of Israel set over him by God, and Absalom only an intruder, and made king by the tumults of the people; yea David himself did bid Hushai call Absalom (that usurper) ‘king,’ 2 Sam. 15:34, ‘Say to Absalom, ‘I will be thy servant O King.’ Yea further, David himself did call Absalom ‘king,’ 2 Sam. 15:19. David said to Hushai, ‘Return to thy place and abide with the king’ (that is with Absalom), yet he knew himself to be the lawful king and did not acknowledge that his son Absalom had any right to the kingdom, though he did give him the title of a king. So Athaliah’s usurping is called by the Spirit of God ‘reigning,’ yet the Spirit of God owns not her right to reign, but approved of the killing of her and the setting up [of] Jehoash, the true and lawful heir in her room. Yea Christ Himself called the Devil ‘the Prince of this World,’ Jn. 12:13 and 16 and 11, yet is it imaginable that Christ thought this title of right belonged to the Devil? Certainly no; Musculus on Jn. 12:31 well observes, non est ille (viz. Satan) Princeps mundi legitimus, sed per rapinam [‘He is not the legitimate prince of the world, but a robber’]. Paul called the devils ‘principalities and power,’ Eph. 6:12, yet none will be so shameless as to say that Paul thought this their rule, dominion and power of right belonged to them, but is merely usurped and intruded into. See annotations on the Bible on Eph. 6:12. 3. Titles are not always approbative, but distinctive; my meaning is that giving of titles to persons or things argues not one’s approving of a just right to those titles, but seems merely to distinguish those persons or things from others that are called by other names or titles, as I call them at Whitehall a ‘Council of State’ to distinguish them from a ‘Council of War’; I call those at Westminster the ‘Parliament of the Commonwealth,’ to distinguish them from the Lords and Commons assembled in Parliament. 4. Titles are giving to things or persons sometimes merely by allusion, not approbation, as in Scripture-phrase sin is said to ‘reign’ and the devils are said to ‘rule’, not that either the one or the other has an approved right to rule over man as a lawful prince has to rule over his subjects, but they are said to reign or rule by way of allusion to the reign of princes in their dominions. 5. Titles may be given without sin to persons or things, though of right they belong not to them, where they are generally received or mentioned by such titles by the people where I live. About names and titles much indulgence is to be given to the common usages and customs of the people; I may call things or persons by such names or titles as I know belongs not of right unto them, because they are ordinarily known and generally received by such names and titles. I could give manifold instances out of Scripture to prove this: David called Absalom ‘king’, not that he thought him so of right, but because he was commonly known and generally received by that title among the people. So Herod was called by the evangelist ‘King of the Jews’, so did the Jews generally call him by that title, yet none but that sect or sort of people called the Herodians did own it as Herod’s right to be the king of the Jews, who were so called because they pleaded for Herod to be the lawful king of the Jews, which the Pharisees and others withstood because he was not one of the Jewish nation as he ought to be, Dt. 17:15. Yet all the Jews called Herod ‘king’, though they did not acknowledge him to be their lawful king; tis manifest giving of titles are but titular acknowledgments and no more. 6. If names may without sin be given to places and things (which belong not to them), I see no reason why they may not be given to persons. There are names and titles given to many places both upon superstitious and idolatrous grounds, yet may without sin be used (I speak not of the first imposers) when those places are so called and commonly known by such names: Luke that writ the Acts of the Apostles, calls a place in Athens ‘Mars-hill’ (as it was commonly called) and this he might do without sin, though this name was originally imposed on that place in honor of Mars, yet he calls the place as it was commonly called, though called so upon an idolatrous ground, Acts 17:22. So for things also we may without sin call them by those names which others give them, though they may deal superstitiously or sinfully in the first imposition of such names. Thus Paul mentions a ship of Alexandria whose sign was Castor and Pollux, names originally imposed by the gentiles upon an idolatrous ground, yet being generally received, Paul calls the ship after this name. 7. It was a matter of absolute necessity (as to my life) for me to petition them, I being condemned to die; tis true for a trivial or ordinary occasion I should never petition them, but in an extraordinary case I might lawfully do it: David in a case of extreme necessity did eat the Show-bread, which in an ordinary case he might not do. Tis true indeed, Cato would not petition Caesar for his life, he had rather die than petition, but that I conceive was rather out of some animosity or height of spirit, or petty discontent, than out of a rectified judgment; for my part I am fully satisfied that I have not sinned in giving them their assumed titles; names and titles do not determine rights, conveniunt rebus nomina saepe suis [‘names often correspond to their things], it is true sometimes, but not always. 8. Titles men assume to themselves, or are generally given by others, may be given them by me without sin or without owning a right to those titles; this I may make appear by sundry late instances: Henry VIII [initially] had this title given him, ‘Defender of the Faith’, yet he had no right to this title, for he [at the beginning of his reign] defended only the Popish religion; he opposed the Faith rather than defended the Faith, and the true reason why the Pope gave him this title, ‘Defender of the Faith’, was because he opposed the doctrine of Luther and wrote against him [in 1521]; yet none scrupled to call him and the succeeding kings of England ‘the Defenders of the Faith’. So the king of Spain is called ‘the Catholic King’, yet he has no true right to this title, for he is not a catholic or universal monarch, yet our new State have lately sent to the king of Spain under this title, ‘The Catholic King’; so the king of France is called ‘the most Christian King’; so the Duke of Bavaria having by arms ejected the Palsgrave writes himself ‘Prince Elector Palatine of the Rhine’; so the King of Poland takes this title to himself, ‘King of Sweden’, yet has no right to that kingdom; yet none that ever I heard of scrupled to give these titles to them, considering that titles do not determine rights, and considering also that no addresses to them will be received by them unless the titles they assume to themselves be given them by those who make applications to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Necessary Vindication of the Principles &amp; Practices of me, Christopher Love, since my trial before, and condemnation by the High Court of Justice</cite>, (London, 1651), pp. 1-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

stinguish them from the Lords and Commons assembled in Parliament. 4. Titles are giving to things or persons sometimes merely by allusion, not approbation, as in Scripture-phrase sin is said to ‘reign’ and the devils are said to ‘rule’, not that either the one or the other has an approved right to rule over man as a lawful prince has to rule over his subjects, but they are said to reign or rule by way of allusion to the reign of princes in their dominions. 5. Titles may be given without sin to persons or things, though of right they belong not to them, where they are generally received or mentioned by such titles by the people where I live. About names and titles much indulgence is to be given to the common usages and customs of the people; I may call things or persons by such names or titles as I know belongs not of right unto them, because they are ordinarily known and generally received by such names and titles. I could give manifold instances out of Scripture to prove this: David called Absalom ‘king’, not that he thought him so of right, but because he was commonly known and generally received by that title among the people. So Herod was called by the evangelist ‘King of the Jews’, so did the Jews generally call him by that title, yet none but that sect or sort of people called the Herodians did own it as Herod’s right to be the king of the Jews, who were so called because they pleaded for Herod to be the lawful king of the Jews, which the Pharisees and others withstood because he was not one of the Jewish nation as he ought to be, Dt. 17:15. Yet all the Jews called Herod ‘king’, though they did not acknowledge him to be their lawful king; tis manifest giving of titles are but titular acknowledgments and no more. 6. If names may without sin be given to places and things (which belong not to them), I see no reason why they may not be given to persons. There are names and titles given to many places both upon superstitious and idolatrous grounds, yet may without sin be used (I speak not of the first imposers) when those places are so called and commonly known by such names: Luke that writ the Acts of the Apostles, calls a place in Athens ‘Mars-hill’ (as it was commonly called) and this he might do without sin, though this name was originally imposed on that place in honor of Mars, yet he calls the place as it was commonly called, though called so upon an idolatrous ground, Acts 17:22. So for things also we may without sin call them by those names which others give them, though they may deal superstitiously or sinfully in the first imposition of such names. Thus Paul mentions a ship of Alexandria whose sign was Castor and Pollux, names originally imposed by the gentiles upon an idolatrous ground, yet being generally received, Paul calls the ship after this name. 7. It was a matter of absolute necessity (as to my life) for me to petition them, I being condemned to die; tis true for a trivial or ordinary occasion I should never petition them, but in an extraordinary case I might lawfully do it: David in a case of extreme necessity did eat the Show-bread, which in an ordinary case he might not do. Tis true indeed, Cato would not petition Caesar for his life, he had rather die than petition, but that I conceive was rather out of some animosity or height of spirit, or petty discontent, than out of a rectified judgment; for my part I am fully satisfied that I have not sinned in giving them their assumed titles; names and titles do not determine rights, conveniunt rebus nomina saepe suis [‘names often correspond to their things], it is true sometimes, but not always. 8. Titles men assume to themselves, or are generally given by others, may be given them by me without sin or without owning a right to those titles; this I may make appear by sundry late instances: Henry VIII [initially] had this title given him, ‘Defender of the Faith’, yet he had no right to this title, for he [at the beginning of his reign] defended only the Popish religion; he opposed the Faith rather than defended the Faith, and the true reason why the Pope gave him this title, ‘Defender of the Faith’, was because he opposed the doctrine of Luther and wrote against him [in 1521]; yet none scrupled to call him and the succeeding kings of England ‘the Defenders of the Faith’. So the king of Spain is called ‘the Catholic King’, yet he has no true right to this title, for he is not a catholic or universal monarch, yet our new State have lately sent to the king of Spain under this title, ‘The Catholic King’; so the king of France is called ‘the most Christian King’; so the Duke of Bavaria having by arms ejected the Palsgrave writes himself ‘Prince Elector Palatine of the Rhine’; so the King of Poland takes this title to himself, ‘King of Sweden’, yet has no right to that kingdom; yet none that ever I heard of scrupled to give these titles to them, considering that titles do not determine rights, and considering also that no addresses to them will be received by them unless the titles they assume to themselves be given them by those who make applications to them.”

— Christopher Love, A Clear &amp; Necessary Vindication of the Principles &amp; Practices of me, Christopher Love, since my trial before, and condemnation by the High Court of Justice (London, 1651), pp. 1-3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6things+at+which+offence+is+taken%2C+first+my+petitioning+for+my+life+to+the+%5Busurped%5D+parliament+%28so+called%29%E2%80%A6+to+both+which+I+shall+give+full+satisfaction.+About+my+petitioning%2C+a+double+offence+is+taken%2C+first+at+the+titles+of+my+petitions%E2%80%A6+I+shall+speak+briefly+to+both%2C+to+take+away+any+stumbling+block+out+of+the+way+of+any.+Touching+the+titles+of+my+four+petitions%2C+they+run+in+this+form%3A+%E2%80%98To+the+Supreme+Authority%2C+the+Parliament+of+the+Commonwealth+of+England%E2%80%99.+Although+I+am+far+from+going+about+to+justify+their+right+to+this+title+to+whom+I+give+it%2C+yet+I+shall+justify+the+lawfulness+of+my+practice+in+giving+them+this+title+which+they+assume+to+themselves%2C+especially+in+a+case+of+life+%5Bor+death%5D+as+mine+is%3A+for+in+trivial+matters+I+had+rather+lose+my+own+right+which+belongs+to+me+than+give+them+this+title+which+belongs+not+to+them.+The+reasons+which+sway+with+me+why+I+gave+them+this+title+%28though+I+am+not+satisfied+they+have+a+right+to+it%29+are+these%3A+1.+They+would+not+receive+my+petitions+without+giving+them+their+assumed+titles%3B+yea+to+my+knowledge+they+have+rejected+petitions+which+have+not+had+these+titles.+2.+I+am+upon+sure+and+clear+grounds+persuaded+that+giving+to+men+titles+they+assume+to+themselves+is+not+a+real+owning+that+they+have+a+right+to+those+titles.+Titular+and+real+are+usually+distinguished%3B+by+giving+them+the+title+of+%E2%80%98Supreme+Authority%E2%80%99+and+%E2%80%98Parliament%2C%E2%80%99+I+do+acknowledge+them+a+titular+authority+and+a+titular+parliament%2C+but+by+engaging+%5Bby+an+oath+of+allegiance%5D+to+them+%28which+I+have+never+done+and+I+hope+shall+never+do%29%2C+I+do+acknowledge+them+a+real+authority+and+a+real+parliament.+That+I+may+further+evince+the+truth+of+this+second+reason%2C+viz.+that+giving+of+titles+to+men+they+assume+to+themselves%2C+is+not+a+real+owning+that+they+have+a+real+right+to+those+titles%2C+I+shall+give+sundry+instances+in+Scripture+to+make+it+good%3A+2+Sam.+16%2C+Hushai+did+call+Absalom%2C+that+notorious+usurper%2C+%E2%80%98king%2C%E2%80%99+saying%2C+%E2%80%98God+save+the+king%2C+God+save+the+king%2C%E2%80%99+%28an+expression+the+people+gave+him%29%2C+yet+Hushai+knew+that+David+only+was+%28even+then%29+the+lawful+king+of+Israel+set+over+him+by+God%2C+and+Absalom+only+an+intruder%2C+and+made+king+by+the+tumults+of+the+people%3B+yea+David+himself+did+bid+Hushai+call+Absalom+%28that+usurper%29+%E2%80%98king%2C%E2%80%99+2+Sam.+15%3A34%2C+%E2%80%98Say+to+Absalom%2C+%E2%80%98I+will+be+thy+servant+O+King.%E2%80%99+Yea+further%2C+David+himself+did+call+Absalom+%E2%80%98king%2C%E2%80%99+2+Sam.+15%3A19.+David+said+to+Hushai%2C+%E2%80%98Return+to+thy+place+and+abide+with+the+king%E2%80%99+%28that+is+with+Absalom%29%2C+yet+he+knew+himself+to+be+the+lawful+king+and+did+not+acknowledge+that+his+son+Absalom+had+any+right+to+the+kingdom%2C+though+he+did+give+him+the+title+of+a+king.+So+Athaliah%E2%80%99s+usurping+is+called+by+the+Spirit+of+God+%E2%80%98reigning%2C%E2%80%99+yet+the+Spirit+of+God+owns+not+her+right+to+reign%2C+but+approved+of+the+killing+of+her+and+the+setting+up+%5Bof%5D+Jehoash%2C+the+true+and+lawful+heir+in+her+room.+Yea+Christ+Himself+called+the+Devil+%E2%80%98the+Prince+of+this+World%2C%E2%80%99+Jn.+12%3A13+and+16+and+11%2C+yet+is+it+imaginable+that+Christ+thought+this+title+of+right+belonged+to+the+Devil%3F+Certainly+no%3B+Musculus+on+Jn.+12%3A31+well+observes%2C+non+est+ille+%28viz.+Satan%29+Princeps+mundi+legitimus%2C+sed+per+rapinam+%5B%E2%80%98He+is+not+the+legitimate+prince+of+the+world%2C+but+a+robber%E2%80%99%5D.+Paul+called+the+devils+%E2%80%98principalities+and+power%2C%E2%80%99+Eph.+6%3A12%2C+yet+none+will+be+so+shameless+as+to+say+that+Paul+thought+this+their+rule%2C+dominion+and+power+of+right+belonged+to+them%2C+but+is+merely+usurped+and+intruded+into.+See+annotations+on+the+Bible+on+Eph.+6%3A12.+3.+Titles+are+not+always+approbative%2C+but+distinctive%3B+my+meaning+is+that+giving+of+titles+to+persons+or+things+argues+not+one%E2%80%99s+approving+of+a+just+right+to+those+titles%2C+but+seems+merely+to+distinguish+those+persons+or+things+from+others+that+are+called+by+other+names+or+titles%2C+as+I+call+them+at+Whitehall+a+%E2%80%98Council+of+State%E2%80%99+to+distinguish+them+from+a+%E2%80%98Council+of+War%E2%80%99%3B+I+call+those+at+Westminster+the+%E2%80%98Parliament+of+the+Commonwealth%2C%E2%80%99+to+distinguish+them+from+the+Lords+and+Commons+assembled+in+Parliament.+4.+Titles+are+giving+to+things+or+persons+sometimes+merely+by+allusion%2C+not+approbation%2C+as+in+Scripture-phrase+sin+is+said+to+%E2%80%98reign%E2%80%99+and+the+devils+are+said+to+%E2%80%98rule%E2%80%99%2C+not+that+either+the+one+or+the+other+has+an+approved+right+to+rule+over+man+as+a+lawful+prince+has+to+rule+over+his+subjects%2C+but+they+are+said+to+reign+or+rule+by+way+of+allusion+to+the+reign+of+princes+in+their+dominions.+5.+Titles+may+be+given+without+sin+to+persons+or+things%2C+though+of+right+they+belong+not+to+them%2C+where+they+are+generally+received+or+mentioned+by+such+titles+by+the+people+where+I+live.+About+names+and+titles+much+indulgence+is+to+be+given+to+the+common+usages+and+customs+of+the+people%3B+I+may+call+things+or+persons+by+such+names+or+titles+as+I+know+belongs+not+of+right+unto+them%2C+because+they+are+ordinarily+known+and+generally+received+by+such+names+and+titles.+I+could+give+manifold+instances+out+of+Scripture+to+prove+this%3A+David+called+Absalom+%E2%80%98king%E2%80%99%2C+not+that+he+thought+him+so+of+right%2C+but+because+he+was+commonly+known+and+generally+received+by+that+title+among+the+people.+So+Herod+was+called+by+the+evangelist+%E2%80%98King+of+the+Jews%E2%80%99%2C+so+did+the+Jews+generally+call+him+by+that+title%2C+yet+none+but+that+sect+or+sort+of+people+called+the+Herodians+did+own+it+as+Herod%E2%80%99s+right+to+be+the+king+of+the+Jews%2C+who+were+so+called+because+they+pleaded+for+Herod+to+be+the+lawful+king+of+the+Jews%2C+which+the+Pharisees+and+others+withstood+because+he+was+not+one+of+the+Jewish+nation+as+he+ought+to+be%2C+Dt.+17%3A15.+Yet+all+the+Jews+called+Herod+%E2%80%98king%E2%80%99%2C+though+they+did+not+acknowledge+him+to+be+their+lawful+king%3B+tis+manifest+giving+of+titles+are+but+titular+acknowledgments+and+no+more.+6.+If+names+may+without+sin+be+given+to+places+and+things+%28which+belong+not+to+them%29%2C+I+see+no+reason+why+they+may+not+be+given+to+persons.+There+are+names+and+titles+given+to+many+places+both+upon+superstitious+and+idolatrous+grounds%2C+yet+may+without+sin+be+used+%28I+speak+not+of+the+first+imposers%29+when+those+places+are+so+called+and+commonly+known+by+such+names%3A+Luke+that+writ+the+Acts+of+the+Apostles%2C+calls+a+place+in+Athens+%E2%80%98Mars-hill%E2%80%99+%28as+it+was+commonly+called%29+and+this+he+might+do+without+sin%2C+though+this+name+was+originally+imposed+on+that+place+in+honor+of+Mars%2C+yet+he+calls+the+place+as+it+was+commonly+called%2C+though+called+so+upon+an+idolatrous+ground%2C+Acts+17%3A22.+So+for+things+also+we+may+without+sin+call+them+by+those+names+which+others+give+them%2C+though+they+may+deal+superstitiously+or+sinfully+in+the+first+imposition+of+such+names.+Thus+Paul+mentions+a+ship+of+Alexandria+whose+sign+was+Castor+and+Pollux%2C+names+originally+imposed+by+the+gentiles+upon+an+idolatrous+ground%2C+yet+being+generally+received%2C+Paul+calls+the+ship+after+this+name.+7.+It+was+a+matter+of+absolute+necessity+%28as+to+my+life%29+for+me+to+petition+them%2C+I+being+condemned+to+die%3B+tis+true+for+a+trivial+or+ordinary+occasion+I+should+never+petition+them%2C+but+in+an+extraordinary+case+I+might+lawfully+do+it%3A+David+in+a+case+of+extreme+necessity+did+eat+the+Show-bread%2C+which+in+an+ordinary+case+he+might+not+do.+Tis+true+indeed%2C+Cato+would+not+petition+Caesar+for+his+life%2C+he+had+rather+die+than+petition%2C+but+that+I+conceive+was+rather+out+of+some+animosity+or+height+of+spirit%2C+or+petty+discontent%2C+than+out+of+a+rectified+judgment%3B+for+my+part+I+am+fully+satisfied+that+I+have+not+sinned+in+giving+them+their+assumed+titles%3B+names+and+titles+do+not+determine+rights%2C+conveniunt+rebus+nomina+saepe+suis+%5B%E2%80%98names+often+correspond+to+their+things%5D%2C+it+is+true+sometimes%2C+but+not+always.+8.+Titles+men+assume+to+themselves%2C+or+are+generally+given+by+others%2C+may+be+given+them+by+me+without+sin+or+without+owning+a+right+to+those+titles%3B+this+I+may+make+appear+by+sundry+late+instances%3A+Henry+VIII+%5Binitially%5D+had+this+title+given+him%2C+%E2%80%98Defender+of+the+Faith%E2%80%99%2C+yet+he+had+no+right+to+this+title%2C+for+he+%5Bat+the+beginning+of+his+reign%5D+defended+only+the+Popish+religion%3B+he+opposed+the+Faith+rather+than+defended+the+Faith%2C+and+the+true+reason+why+the+Pope+gave+him+this+title%2C+%E2%80%98Defender+of+the+Faith%E2%80%99%2C+was+because+he+opposed+the+doctrine+of+Luther+and+wrote+against+him+%5Bin+1521%5D%3B+yet+none+scrupled+to+call+him+and+the+succeeding+kings+of+England+%E2%80%98the+Defenders+of+the+Faith%E2%80%99.+So+the+king+of+Spain+is+called+%E2%80%98the+Catholic+King%E2%80%99%2C+yet+he+has+no+true+right+to+this+title%2C+for+he+is+not+a+catholic+or+universal+monarch%2C+yet+our+new+State+have+lately+sent+to+the+king+of+Spain+under+this+title%2C+%E2%80%98The+Catholic+King%E2%80%99%3B+so+the+king+of+France+is+called+%E2%80%98the+most+Christian+King%E2%80%99%3B+so+the+Duke+of+Bavaria+having+by+arms+ejected+the+Palsgrave+writes+himself+%E2%80%98Prince+Elector+Palatine+of+the+Rhine%E2%80%99%3B+so+the+King+of+Poland+takes+this+title+to+himself%2C+%E2%80%98King+of+Sweden%E2%80%99%2C+yet+has+no+right+to+that+kingdom%3B+yet+none+that+ever+I+heard+of+scrupled+to+give+these+titles+to+them%2C+considering+that+titles+do+not+determine+rights%2C+and+considering+also+that+no+addresses+to+them+will+be+received+by+them+unless+the+titles+they+assume+to+themselves+be+given+them+by+those+who+make+applications+to+them.%E2%80%9D%0A%0A%E2%80%94+Christopher+Love%2C+A+Clear+%26+Necessary+Vindication+of+the+Principles+%26+Practices+of+me%2C+Christopher+Love%2C+since+my+trial+before%2C+and+condemnation+by+the+High+Court+of+Justice+%28London%2C+1651%29%2C+pp.+1-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F781bb5691f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/781bb5691f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=things%20at%20which%20offence%20is%20taken,those%20who%20make%20applications%20to%20them&amp;text=things%20at%20which%20offence%20is%20taken%2C%20first%20my&amp;text=them%20by%20those%20who%20make%20applications%20to%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

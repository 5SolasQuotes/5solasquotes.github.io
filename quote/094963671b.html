<main class="wrap"><figure class="quote" id="q-094963671b" data-kw="">
<blockquote><p>If ye think and lay it down for a principle that everything ye conceive to be evil is to be opposed and impugned to the yondmost extremity and renting, and nothing supposed amiss is to be tolerated and forborn for the good of the Gospel, for peace and unity’s sake, ye may see that abundantly confuted by Mr. Burroughs in his Irenicum, chs. 8 &amp; 9, but especially by your most grave, wise, tender and faithful Mr. Durham in his book of Scandal, pt. 3, ch. 8. Confine yourselves therefore within the just bounds of holy zeal and think it no lukewarmness to be sober; and many of your extravagancies will hereby be cut off.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead</cite>, (London: Cockerill, 1681), pp. 20-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“If ye think and lay it down for a principle that everything ye conceive to be evil is to be opposed and impugned to the yondmost extremity and renting, and nothing supposed amiss is to be tolerated and forborn for the good of the Gospel, for peace and unity’s sake, ye may see that abundantly confuted by Mr. Burroughs in his Irenicum, chs. 8 &amp; 9, but especially by your most grave, wise, tender and faithful Mr. Durham in his book of Scandal, pt. 3, ch. 8. Confine yourselves therefore within the just bounds of holy zeal and think it no lukewarmness to be sober; and many of your extravagancies will hereby be cut off.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bda0dba676" data-kw="">
<blockquote><p>If [as Thomas Hooker says,] ‘the laying on of hands be no specificating act of an office, because it is used in other performances, as in the sending of Paul and Barnabas to preach to the Gentiles, Acts 13,’ then shall water not be essential to baptism, nor drinking to the Lord’s Supper, nor blessing sacramental in that Supper, because in Levitical washings, in the feasts-sacred, in the Passover, in praying for a blessing to the Word preached, all these were used. It’s loose logic, a genere ad speciem [a genus to the species]; the question is not of laying on of hands in general, but of a certain kind and species of laying on of hands by way of prayer and designation. Mr. Rutherford knows there be diverse kinds of laying on of hands. 2. Nor do I say that the rite is essential to ordination, but of the necessity of before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658), pp. 428-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

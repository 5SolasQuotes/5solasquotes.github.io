<main class="wrap"><figure class="quote" id="q-37ffda7880" data-kw="">
<blockquote><p>There are some exercises of Religion which stand only in a form of godliness, when men draw near with their mouth and honour God with their lips, and bestow a little bodily exercise and attendance upon him, when in the mean time their hearts are far from him, running after other objects, Isaiah 29.13. Ezek. 33.31. Other duties there are which are more spiritual, and wherein the life and power of godliness doth consist. Among these, that of heavenly Meditation is one, when, (as the Apostle saith of the blessed Angels, 1 Pet. 1.12.) the heart desires to look into the mysteries of salvation.

Ever since the fall of Adam, sinful men have had the disposition of Adam, to fly away, and to hide from the presence of the Lord. Natural men are without God in the world, he is not in all their thoughts, they could be well enough content to have him cease from before them, Esay 30.11. He is every where else to be found, only shut out of the hearts of wicked men.

The heart never willingly fixeth on God, till he be the Treasure of it; for where a man’s treasure is, there will his heart be also. It cannot easily Meditate, but where it doth delight, Psalm 119.97. Love is the weight of the soul, it readily moves to the object which it loves. Mary will not away from the empty Sepulchre, where a little before her Lord had lien. Every good man is of David’s mind, Psalm 16.8. to set the Lord always before him, that he may be in his fear all the day long.

There is nothing of a more unstable and roving temper than the mind of man. Some have prescribed the study of Mathematics to fix the volatile agility thereof; but certainly the more serious, the more settled the soul is. Nothing therefore will so balance and compose it, as true holiness, which doth of all other things make it the most serious, the most willing to acquaint it self with God, that it may be at peace, Job 22.21. He is the Rest of the soul. Inquietum est cor nostrum donec requiescat in te. The more it knows of him, the more desirous it is to stay with him that it may know more. The more it tasteth of his favour, the more it longeth after his glory, as Moses did, Exod. 33.17, 18. What the Philosopher saith of all knowledge, is indeed true only of the knowledge of God and Christ, that it is quies intellectus. And therefore our Saviour calleth it eternal life, John 17.3. In which alone the soul doth Rest.

Now one excellent means of fixing the heart on God, is meditation, whereby a man calls together All that is within him to bless his name, Psalm 103.1. Meditation is the wing of the soul which carrieth the affections thereof to things above; by this, as Moses, it goeth up to the top of Pisgah to take a view of the promised land. It is as Clemens Alexandrinus saith of prayer, a conversing with God; as Chrysostom saith of faith, so may we of Meditation, It makes God, and Christ, and precepts, and promises ours, by giving us a fuller possession of them. Hereby we hold fast the things which we have learned, we awaken our faith, inflame our love, strengthen our hope, revive our desires, increase our joys in God; we furnish our hearts, and fill our mouths with materials of prayer, we loosen our affections from the world, we praeacquaint our selves with those glories which we yet but hope for, and get some knowledge of that love of Christ which passeth knowledge.

Meditation is the palate of the soul whereby we taste the goodness of God; the eye of the soul whereby we view the beauties of holiness; … whereby our spiritual senses are exercised, Acts 24.16. Heb. 5.14. it is the key to the wine-cellar, to the banqueting house, to the garden of spices, which letteth us in unto him whom our soul loveth; it is the arm whereby we embrace the promises at a distance, and bring Christ and our souls together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistle to the reader in Thomas Watson, The saint’s delight. To which is annexed a treatise of meditation</cite></span></figcaption>

<blockquote><p>A MERE speculative knowledge of Christ, and of the great doctrines of the gospel, however laboriously acquired and extensive it may be, is of small importance in itself, and quite vain and ineffectual, if it be not sanctified, and issue in experimental knowledge of Christ, and a real feeling of the beauty and excellency, and efficacy of divine truth on the heart. A man may have a competent, nay, a very extensive acquaintance with the whole doctrines of the Christian religion … yet if you have not the experimental knowledge of Christ, all your knowledge is in vain as to the salvation of your souls.</p></blockquote>

<blockquote><p>Article 13, Private Worship Our Assembly [the Church of Scotland] also commands godly conference at all occasional meetings (Act at Edinburgh Assembly, 1641), or as God’s providence shall dispose, as the word of God commands, Heb. 3:13; 1 Thess. 5:11,12; Lev. 19:17; Zech. 8:21; Mal. 3:16; Col. 3:16, providing none invade the pastor’s office to preach the word who are not called thereunto by God and his Church, Heb. 5:4,5; Rom. 10:14-15; 1 Cor. 12:28,29, and by that same warrant the grieved in conscience is to confess his sins, which troubles and presses down his soul, to either an experienced Christian or pastor, as James 5:16, but this confession is free to the grieved party, I mean free from being canonically commanded in our assemblies, and far from sacramental confession, or auricular [audible] confession to a priest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, Ch. 20, Whether or not the government of the Church of Scotland can be proved by God’s Word to be lawful?</span></figcaption>

<blockquote><p>Remember to read over these resolutions once a week.” – Edwards . 1800’s Green, Ashbel – ‘Questions &amp; Counsel for Young Converts’ 5 pp. 13 questions &amp; 6 counsels, appended to John Willison, The Young Communicant’s Companion, pp. 68-72 . . Books 1500’s Hyperius, Andreas – The True Trial &amp; Examination of a Man’s own self, wherein every faithful Christian, by looking into his conscience, may most plainly behold his spiritual deformity by nature, described, his actual rebellion by disobedience detected, his promise-breach at baptism, by ordinary transgression apparently proved, his lamentable estate through sin discovered, his wilfull obstinacy by daily disorder displayed, and lastly how by earnest repentance, and faith in Christ Jesus, he is from all the same clearely pardoned, forgiven, released and reconciled (London: John Windet, 1587) 189 pp. ToC . 1600’s Bolton, Robert – A Threefold Treatise containing the Saints’ Sure &amp; Perpetual Guide: Self-Enriching Examination, Soul-Fatting Fasting: or Meditations concerning the Word, the Sacrament of the Lords Supper &amp; Fasting (London: Purslow, 1634) 252 pp. ToC Index Wettenhall, Edward – Enter into thy Closet, or a Method &amp; Order for Private Devotion: a treatise endeavoring a plain discovery of the most spiritual and edifying course of reading, meditation and prayer; and so of self-examination, humiliation, mortification and such most necessary Christian duties, by which we sue out the pardon of our sins from Heaven and maintain an holy converse with God (London: Martyn, 1666) 312 pp. ToC Wettenhall (1636–1713) was an English bishop of the Church of Ireland. He was for submitting to the Glorious Revolution (1689), against the opposition of Jacobites, and was a moderate on concessions to Christian dissenters. In his will he affirms the church of England and Ireland to be “the purest church in the world”, though “there are divers points which might be altered for the better” in “articles, liturgy, and discipline, but especially in the conditions of clerical communion.</p></blockquote>

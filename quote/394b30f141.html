<blockquote><p>Wicked men cry out of bands and cords in religion… Away with this strictness and preciseness, it extinguishes the joy and pleasure of our lives; give us our cups instead of bibles, our profane songs instead of spiritual psalms, our sports and pastimes instead of prayers and sermons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Flavel on the Content of Singing Public Praise to God</cite>, vol. 1; vol. 4, ‘England’s Duty’, p. 557</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fe91d3a304" data-kw="">
<blockquote><p>Next you say, ‘Why may not the Christian Church compose new Hymnes, as they of Corinth did?’ And this you judge to be the more necessary because that David‘s Psalms have not such full and clear Hymns upon the great mysteries of the Christian belief: And you think the liberty which we plead for in prayer should much persuade it. ‘Tis answered, if you consider that Scripture, 1 Cor. 14, and particularly the 26th verse, you may understand that as the apostle’s business in the place is to set an order to the use of extraordinary gifts, wherein that Church abounded; so, the Psalms, doctrine, tongue, revelation, and interpretation there spoken of, appear to be inspired and afflatitious motions, which will not found you any argument: And you yourself do so plainly observe that these Psalms of the Corinthians were framed by private persons, that I marvel that your remembering of the thing to be extraordinary did not stop your translation of it by way of privilege to the Churches in our days. 2. Seeing the Lord hath provided us with a plentiful variety of Psalms and Hymns; and beside, hath allowed us as full a liberty of praising in prose, as of prayer, I think it doth fully remove all that is here by you objected, and abundantly warrant us both to abide content with God’s institutions, and refuse a superfluous mixture of humane odes with these divine Psalms, which He hath appointed, for the matter of our more solemn praises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect., p. 278</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

formist%E2%80%A6+%28%5BAmsterdam%5D%2C+1671%29%2C+The+Fifth+Dialogue+Answered.+MacWard+was+the+protege+of+Samuel+Rutherford.+He+does+not+explicitly+cite+Eph.+5%3A19+%26+Col.+3%3A16+below%2C+but+the+allusions+to+those+passages+are+obvious.+He+appears+to+allow+for+singing+Scripture+songs+in+some+respect.%2C+p.+278&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffe91d3a304.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fe91d3a304.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=Next%20you%20say%2C%20%E2%80%98Why%20may%20not,matter%20of%20our%20more%20solemn%20praises&amp;text=Next%20you%20say%2C%20%E2%80%98Why%20may%20not%20the%20Christian&amp;text=for%20the%20matter%20of%20our%20more%20solemn%20praises" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9dccb82cb1" data-kw="">
<blockquote><p>Add unto this, that whereas in praying we are to speak only unto God, it is otherwise in singing, where we are taught to ‘speak unto ourselves in psalms’, and ‘to teach, and admonish ourselves in psalms, and hymns, and spiritual songs’ (Eph. 5:19; Col. 3:16). What greater difference? In prayers we speak only to God: in psalms to our selves mutually, or one to another…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Justification of Separation from the Church of England Against Mr. Richard Bernard his Invective, entitled, The Separatists Schism</cite>, (Amsterdam, 1610), p. 467. See through p. 469 where only psalms are mentioned, and that from the book of psalms.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-9e7bfcd23f" data-kw="">
<blockquote><p>I. First then, as to the Praises of God. The Scriptures both of the Old and New Testaments require the use of the Psalms in offering up praises to God. We find in the Old Testament (2 Chron. 29:30) [that] Hezekiah the King and the princes commanded the Levites to sing praises to the Lord with the words of David, and of Asaph, and they sang with gladness. This Command of Hezekiah proceeded from God, and was approved by Him. The same way of praising God continued in the Jewish Church till our Saviour’s time: And after that, we have yet a more positive command for the use of them by the apostle, Eph. 5:19, ‘Speaking to your selves in psalms, and hymns, and spiritual songs.’ And Col. 3:16, ‘Let the words of Christ dwell in you richly in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs; singing and making melody with grace in your hearts to the Lord.’ I think there is no room to doubt, but by the psalms, etc. in these places, is meant the Book of Psalms, which the Holy Ghost has left for this purpose to the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-king.html">William King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Inventions of men</cite>, (Dublin, 1694), Ch. 1, ‘Of Praises’, Section 1, ‘What the Holy Scriptures prescribe concerning them’, pp. 6-7. King (1650-1729) was an Anglican divine in the Church of Ireland and was the archbishop of Dublin.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>The oldest of the Conclusions, so far as is known, is that to Psalm 148 [only], which is found in the 1575 edition by Bassandyne, at the very end of the volume… Though the introduction of these compositions is involved in obscurity, it cannot be supposed that they were forced into the Psalm Book against the wishes of the church authorities… It is more conceivable that they were inserted quietly, on the printer’s own responsibility or that of other private parties; and their disappearance from most of the subsequent editions lends countenance to this conjecture. Even those for common metre are wanting in so important an edition of 1615. Very possibly those who had Episcopal leanings had most to do with their first introduction; but the absence of any trace of controversy on the subject warrants the inference that other parties acquiesced, so far at least as to make the use of them a matter of forebearance. It may also be inferred from the state of the psalm books that they were used only to a partial extent till after 1615.</p></blockquote>

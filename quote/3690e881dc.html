<blockquote><p>Q. How is man by sin in the state of death?

A. By the just sentence of God, delivering him for sin, into the power both of corporal and eternal death; signified by expelling our parents out of Paradise, and debarring them of the Sacramental tree of Life.

Q. What are we to understand by corporal death?

A. The separation of the soul, and body, with all evils that attend thereon, or make way thereto, as sorrow sickness, shame, servitude, penury, &amp;c. yea even blessings are cursed, and prosperity causeth ruin.

Q. What is eternal death?

A. It is the final separation of the whole man in hell for ever, from God’s favourable presence and fellowship; together with present bondage under Satan, hellish horrors, and such like fore-runners of damnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-crooke.html">Samuel Crooke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The guide unto true blessedness. Or, A body of the doctrine of the Scriptures, directing man to the saving knowledge of God</cite>, (London: John Pindley, 1613), pp 29-30.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b760b3c8b1" data-kw="">
<blockquote><p>Recent inquiries in a neighbouring land, have proved, that education in the elements of human knowledge does not make the inhabitants more moral; nay, that crime may increase in the very same proportion with education. Nor is this result surprising. Such education does but put into men’s hands a mighty instrument, powerful almost equally for good and for evil. All depends on the use made of it, and if it be given to persons untaught how to apply it—often taught to apply it ill—what wonder is it that it is much perverted?

And without undervaluing any branch of learning, may we not now assume the incompetency of all learning, merely human, to teach those just and solemn views of God’s sovereignty and grace, which alone can make men truly wise and good? They may be taught much out of the book of nature, and yet they may not be taught to know God; and either they will not worship him at all, or they will worship him ignorantly, superstitiously. It is the word of God—the Bible, the gospel, which alone can fully declare to them that God. This, this is the book, the only book, out of which all alike, learned and ignorant, need to be taught, sitting at the feet of Jesus, and learning of him.</p></blockquote>

</figure><figure class="quote" id="q-9322c0b889" data-kw="">
<blockquote><p>First, consider they are great things that you trust them with, whom you chose to sit in the great Senate of the Nation; you trust them with your purse, and I am sure most of you account that something, whatever you think of other things; you will know him well, to whom you will give the Key of your chest, where your money lies. You trust them with your liberties and lives, and those your purses have paid soundly for; yea, with your Religion, without which the other are not worth the taking up.

In one word, with all that is dear to you as English men, as Christians, you put that power into their hands, which if they be not the more faithful, they may turn like a cannon upon your own breasts, and so you most truly become felo de se, guilty of your own miseries; and let me tell you, those sorrows have a peculiar bitterness in them above all other, which are not imposed on us, but chosen by us.

Better an enemy should come in and turn us by force of arms, out of possession of these, then we send those that shall vote us out of them, partly because of the little pity we shall deserve, or can reasonably expect from others, when they shall see the rod with which we are whip’t was of our own gathering; as also because of the inward guilt which will add a further stinging consideration then all this to our sorrows, and deprive us of those comforts which the conscience of doing our duty would help us to, in the greatest calamities that otherwise could befall us. He that is accessory to the burning down of his house, by the negligence of a drunken person, whom he trusted to watch and keep it, hath more reason to be troubled, then he that hath it consumed by a fire from heaven, or some other inevitable Providence.

O Sirs, there are less matters then these, in which you would be very choice and curious; if you were to chose a Nurse for your child, you would look for one of a healthful constitution and good disposition, you would weigh and taste her milk whether good or no; You are now to choose Nurses for three Nations, so Magistrates are called in Scripture, Nursing Fathers and Mothers; You are to choose these in a time of these Nations languishing, as the only means under God, (so thought by the best Physicians among us,) to recover the consumptive state of this great body; and will you send any to such a place and work, before you know what milk they have given in their private capacities in the Country?

If you were to choose a Shield, should it be one that would let the arrow come through it, to pierce you to the heart? Magistrates are the Shields of the earth. You value the life of the Nation little, that will put a Shield into its hand you have not well tried; I am sure, David threw away Armour, though it were a Kings, because he had not tried it; in a word, if you were but to choose a Shepherd, or a Herdsman, any should not serve your turn. Pharaoh a King thought it not beneath his care, though in so low a business, Gen. 47.6. If thou knowest any man, saith he to Joseph, of activity amongst thy brethren, make them rulers over my cattle; you are to choose such, as are not to go before beasts, but to lead in and out the Lord’s people and flock.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Magistrate’s Pourtraiture drawn from the Word, and Preached in a Sermon at Stowe-Market in Suffolk, upon August, the 20. 1656. before the Election of Parliament-men for the same County</cite>, (London: Ralph Smith, 1656), pp 23-25.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

— William Gurnall, The Magistrate’s Pourtraiture drawn from the Word, and Preached in a Sermon at Stowe-Market in Suffolk, upon August, the 20. 1656. before the Election of Parliament-men for the same County, (London: Ralph Smith, 1656), pp 23-25.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst%2C+consider+they+are+great+things+that+you+trust+them+with%2C+whom+you+chose+to+sit+in+the+great+Senate+of+the+Nation%3B+you+trust+them+with+your+purse%2C+and+I+am+sure+most+of+you+account+that+something%2C+whatever+you+think+of+other+things%3B+you+will+know+him+well%2C+to+whom+you+will+give+the+Key+of+your+chest%2C+where+your+money+lies.+You+trust+them+with+your+liberties+and+lives%2C+and+those+your+purses+have+paid+soundly+for%3B+yea%2C+with+your+Religion%2C+without+which+the+other+are+not+worth+the+taking+up.%0A%0AIn+one+word%2C+with+all+that+is+dear+to+you+as+English+men%2C+as+Christians%2C+you+put+that+power+into+their+hands%2C+which+if+they+be+not+the+more+faithful%2C+they+may+turn+like+a+cannon+upon+your+own+breasts%2C+and+so+you+most+truly+become+felo+de+se%2C+guilty+of+your+own+miseries%3B+and+let+me+tell+you%2C+those+sorrows+have+a+peculiar+bitterness+in+them+above+all+other%2C+which+are+not+imposed+on+us%2C+but+chosen+by+us.%0A%0ABetter+an+enemy+should+come+in+and+turn+us+by+force+of+arms%2C+out+of+possession+of+these%2C+then+we+send+those+that+shall+vote+us+out+of+them%2C+partly+because+of+the+little+pity+we+shall+deserve%2C+or+can+reasonably+expect+from+others%2C+when+they+shall+see+the+rod+with+which+we+are+whip%E2%80%99t+was+of+our+own+gathering%3B+as+also+because+of+the+inward+guilt+which+will+add+a+further+stinging+consideration+then+all+this+to+our+sorrows%2C+and+deprive+us+of+those+comforts+which+the+conscience+of+doing+our+duty+would+help+us+to%2C+in+the+greatest+calamities+that+otherwise+could+befall+us.+He+that+is+accessory+to+the+burning+down+of+his+house%2C+by+the+negligence+of+a+drunken+person%2C+whom+he+trusted+to+w

<main class="wrap"><figure class="quote" id="q-ff1585dc34" data-kw="">
<blockquote><p>And in this respect I am justly indignant at this so open and manifest folly of Stephen, that he who so boasts of the place of his episcopate, and contends that he holds the succession from Peter, on whom the foundations of the Church were laid, should introduce many other rocks and establish new buildings of many churches</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/firmilian-of-caesarea.html">Firmilian of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Cyprian (Cyprian, Ep. 74)</cite>, §17</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3e0ab16df0" data-kw="Seat of infallibility">
<blockquote><p>They are not yet agreed among themselves on the seat of this infallibility, nor is it known as yet with whom it ought to be—with the pope or with a council. Some claim this privilege for a council, as is done by all those who believe the pope to be fallible and who on that account wish the council to be above him (as it was decreed in the councils of Constance and Basil and is constantly believed by the French church). Others ascribe it to the pope, as those who maintain that he is superior to a council (as the Council of Trent determined and with it the canonists and Scholastics).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.19</span></figcaption>

</figure><figure class="quote" id="q-3d3581611a" data-kw="">
<blockquote><p>Daniel and Paul foretold that Antichrist would sit in the temple of God, (Dan. 9: 27; 2 Thess. 2: 4;) we regard the Roman Pontiff as the leader and standard-bearer of that wicked and abominable kingdom.</p></blockquote>

</figure><figure class="quote" id="q-475301f5c2" data-kw="">
<blockquote><p>If the question brought before the Vatican Council had been of a purely spiritual nature, had the bishops been only required to affirm such a doctrine as the Assumption of the Virgin Mary—that is to say, to assert a historical fact without a particle of evidence—I do not think many would have rebelled. It was because the doctrine of the Pope&#x27;s personal Infallibility had bearings on the practical business of this world; because its assertion was supposed to be intended for the preservation or recovery of the Pope&#x27;s temporal sovereignty; because the claim would enable him to interfere with more effect on questions of toleration, civil liberty, marriage, and education, that so much difficulty was made about conceding it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture VI</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/assumption.html">Assumption</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/temporal-power.html">Temporal power</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/infallibility.html">Infallibility</a></span></div>

</figure><figure class="quote" id="q-dd6fbda734" data-kw="">
<blockquote><p>It is not the case that there is one church at Rome and another in all the world beside. Gaul and Britain, Africa and Persia, India and the East worship one Christ and observe one rule of truth. If you ask for authority, the world outweighs its capital. Wherever there is a bishop, whether it be at Rome or at Engubium, whether it be at Constantinople or at Rhegium, whether it be at Alexandria or at Zoan, his dignity is one and his priesthood is one. Neither the command of wealth nor the lowliness of poverty makes him more a bishop or less a bishop. All alike are successors of the apostles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 146 (to Evangelus)</cite>, §1</span></figcaption>

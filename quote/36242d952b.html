<main class="wrap"><figure class="quote" id="q-36242d952b" data-kw="">
<blockquote><p>Union may also be consistent with many particular failings and defects in the exercise of government; and possibly the sparing of so corrupt officers and members, yea, the censuring of some unjustly, or the admission of some that are unfit for the ministry, and such like. These indeed are faults, but they are not such as make a Church to be no Church. And though these have sometimes been pretended to be the causes of schisms and divisions in the Church in practice, yet were they never defended to be just grounds of schisms and divisions, but were ever condemned by all councils and fathers, and cannot be in reason sustained. Sure there were such corrupt acts of all kinds among the Jews’ Church officers: Yet is it clear that Nicodemus and Joseph of Arimathea did continue to govern jointly notwithstanding thereof, who yet cannot be counted accessory to any of their deeds, because (which is a third reason) men in such cases have access, even when they are present, to discountenance such corrupt acts by not consenting thereto, and testifying against the same; yea, they may by so doing stand in the way of many wicked acts, which by dividing they cannot do, which is sufficient for their exoneration both before God and men: As we may see in the instances of Joseph and Nicodemus mentioned, who continued united in the government, kept the meetings even when sentences pass against those who will acknowledge Christ, and orders for persecuting Him and them. And yet they are declared free, because they dissented from, and testified against the same: Yea, their freedom and exoneration, by virtue of their dissent, being present, is more solemnly recorded to their honor in the Gospel, than if they had divided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-3af8ab438a" data-kw="">
<blockquote><p>If ye exclude all non-converts from the visible city of God (in which, daily, multitudes in Scotland, in all the four quarters of the land, above whatever our fathers saw, throng into Christ), shall they not be left to the lions and wild beasts of the forest, even to Jesuits, seminary-priests and other seducers? For the magistrate has no power to compel them to hear the Gospel, nor have ye any church-power over them, as ye teach; and they bring not love to the Gospel and to Christ out of the womb with them; and so they must be left to embrace what religion is most suitable to corrupt nature. Nor can it be a way approven by the Lord in Scripture to excommunicate from the visible church (which is the office-house of the free grace of Christ, and His draw-net) all the multitudes of non-converts, baptized and visibly within the Covenant of Grace which are in Great Britain and all the reformed Churches; and so to shut the gates of the Lord’s gracious calling upon all these (because they are not, in your judgment, chosen to salvation), when once you are within [salvation or the Church] yourselves. For how can the Lord call Egypt his people, and Assyria the work of his hands, and all the gentiles (who for numbers are as the flocks of Kedar, and the abundance of the sea) the kingdoms of our Lord and of His Christ, if you number infants (as many do) and all such as your charity cannot judge converts (as others do) among heathens and pagans, who have not a visible claim and interest in Christ? The candlestick is not yours, nor the House; but Christ fixes and removes the one and builds or casts down the other, according to his sovereignty. We in humility judge ourselves, though the chief of sinners, the sons of Zion and of the seed of Christ; if ye remove from us, and carry from hence the candlestick, let our Father be judge, and show us why the Lord has bidden you come out from among us. We look upon this visible church, though black and spotted, as the hospital and guest-house of sick, halt, maimed, and withered, over which Christ is Lord, Physician and Master: and we would wait upon those that are not yet in Christ, as our Lord waited upon us and you both. We, therefore, your brethren, children of one Father, cannot but with tears and exceeding sorrow of heart earnestly entreat, beseech, and obtest you, by the love of our Lord Jesus Christ, by His sufferings and precious ransom which He paid for us both, by the consolations of His Spirit, by your appearance before the dreadful tribunal of our Lord Jesus, yea, and charge you before God and the same Lord Jesus, “who shall judge the quick and the dead, at His appearing, and His kingdom,” break not the spirits and hearts of those to whom ye are dear as their own soul. Forsake not the assemblies of the people of God; let us not divide.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters of Samuel Rutherford</cite>, (Edinburgh: Anderson &amp; Ferrier, 1894), Letter 364, to brethren in Aberdeen, pp. 706-7</span></figcaption>

</figure><figure class="quote" id="q-f93f5805cc" data-kw="">
<blockquote><p>Sixteen of these [field] ministers while they condemned the Erastianism of the indulgence, and deplored the conduct of their brethren who had accepted it, were not prepared to exclude them from their ranks, or refuse aid from them in the common cause. Though they themselves could not conscientiously submit to the restrictions, or the acknowledgments implied in that insidious measure, they were disposed to make allowances for such of their brethren as had yielded under strong temptation or plausible arguments; and they argued, that whatever ecclesiastical censure their conduct might afterwards be found to deserve, to deny them in the meantime the opportunity of vindicating their rights and liberties, civil and religious, by excluding them from the army, would be no less presumptuous and unjust in principle, than it was preposterous in the present circumstances of the country. This liberal view of the subject was opposed by only two of the ministers, namely, Mr. [Donald] Cargill and Mr. [Thomas] Douglas; but these were supported by a considerable number of the lay leaders of the army, at the head of whom was Sir Robert Hamilton. Hamilton appears to have been a pious man, and of good intentions; but of narrow views, severe in his temper, and altogether unqualified by want of military talents and experience, for the command which he assumed. He is charged, and apparently not without reason, with having been active in pushing Cargill, Cameron, and some other ministers, to those extremes which produced a breach between them and their brethren, with whom they had until of late acted in concert.³ ³ M’Crie’s Mem. of Veitch, &amp;c., Notices of James Ure, p. 452. I am sorry I cannot retract the judgment here pronounced on the character of Hamilton, the correctness of which has been challenged by some, but which is borne out by the whole of his history, and refers entirely to his public management, without any reflection either on his piety, his integrity, or his courage. This party now began to maintain that the king [Charles II], by assuming an Erastian power over the Church, had forfeited all right to the civil obedience of his subjects; a principle which had never been known in the Church of Scotland before, and which was afterwards carried to a great extent by Richard Cameron and his followers, who from him were termed Cameronians.</p></blockquote>

<blockquote><p>And the man, out of Christ and under the Law, is still compelled in both active and passive obedience… And for the believer in Christ, the rigor of the Law is abated, not that the Law, as the Law, requires less of him than absolutely perfect obedience, but because in what he comes short in performing of new obedience, from a new principle, to wit, a Gospel-spirit in him, he is pardoned in Christ, and the rest is accepted for Christ’s sake, as if it were obedience. Now in this new obedience, the Spirit so oils the wheels of free-will as obedience, in its kind, is as free, connatural, delightful, being sweetened with the love of God, as if there were not an awing Law, but a sweetly alluring and heart-drawing free love, so that the believer obeys…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, ... (London: J.D., 1648), pt. 1, ch. 35, p. 317-18</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a906397c9a" data-kw="">
<blockquote><p>1. We begin with the most ancient father, Justin [Martyr]. He, in the book inscribed… an Exposition of the Faith, has these words: ‘The Son of God, as man, passed a life removed from all crime, and underwent a voluntary death; [Greek] that is, obliterating sin by a perfect and sinless conversation [conduct], and abolishing our debt by a debt that he owed not. Justin Martyr here plainly teaches, not only that the death and satisfaction of Christ are imputed to us for the blotting out of our punishment, but that his conversation itself, or active obedience, is imputed to us, for the obliteration of our sin. 2. Irenaeus, Against Heresies, bk. 5… in ch. 18: ‘The Lord has restored us to friendship by his incarnation, being made the Mediator between God and man; both propitiating the Father for us, against whom we had sinned, and making amends for our disobedience; bestowing moreover upon us that conversation [conduct] and obedience which is due to our Maker.’ …What else is this than the obedience of Christ both active and passive, made ours by imputation and bestowal?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Justification: or The Disputatio de justitia habituali et actuali</cite>, …, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), ch. 29, p. 254</span></figcaption>

<blockquote><p>God alone justifies us on account of Christ, imputing to us His righteousness, by which He satisfied the law and obeyed God even unto the death of the cross.</p></blockquote>

</figure><figure class="quote" id="q-31a784e770" data-kw="">
<blockquote><p>Whether we be justified by the passive obedience of Christ alone, or also by his active?¹ ¹ Bishop Carlton, Consens. Eccles. Cathol. contr. Trid. de Fide Justif., ch. 3; Daniel Featley in his Sacra nemesis, pp. 24, 29-30, 36-38; L’Emper. in his Theses, Article 1 and many others are for both Christ’s active and passive obedience. Etsi autem in negotio Iustificationis magno periculo erratur, prout ea de re controversia procedit inter nos et Pontificios, utrum scilicet gratiá Dei Iustificatio nobis contingat, an meritis nostris: Attamen prout inter nos &amp; Piscatorem controversia instituitur, passiváne tantum, an etiam activa Christi obedientia justificemur coram Deo, nullo prorsus erratur periculo. Utrobique enim Iustificationis causae gratiae et Christi meritis adscribuntur, non autem operibus nostris. Twisse, i• Corv. Defens. Arm. contra Tilenum Animadversio. Scriptura Christi passioni Iustificationem passim adscribit; idque eu i• locis, in quibus exprofesso argumentum istud pertractat: nulla tamen justitiae, quae in obedientia legi exhibita consistat, facti mentione vel levissima, Rom. 3:24-25 &amp; 4:24-25 &amp; 5:9-10; Gal. 3:11, 13. Gataker. Animadv. in Piscat. &amp; Lucii Scripta Adversaria, p. 2, Sect. 10. Vide plura in cjus Gomar, Disput. Elentic. de Iustif. Elench. In this controversy many learned divines of our own differ among themselves, and it does not seem to be of that importance that some others are about justification. We are justified in part by Christ’s active obedience, for by it we obtain the imputation of that perfect righteousness which gives us title to the Kingdom of Heaven. Seeing it was not possible for us to enter into life, till we had kept the commandments of God, Mt. 19:17, and we were not able to keep them ourselves, it was necessary our Surety should keep them for us, Dan. 9:24; Rom. 10:4; Rom. 3:21. (Mr. Hildersham on Ps. 51:7, Lecture 119) The Scripture seems to ascribe our redemption wholly to Christ’s bodily death, and the blood that He shed for us, Eph. 1:7; Rev. 5:9, but in these places the Holy Ghost uses a synecdoche, it puts one part of Christ’s passion for the whole: 1. Because the shedding of his blood was a sensible sign and evidence that He died for us. 2. This declared Him to be the true propitiatory sacrifice that was figured by all the sacrifices under the Law. (Idem, ibid.) Some urge this argument, By Christs active obedience imputed to them, the faithful be made perfectly righteous, what need is there then of his passive righteousness? need there anymore than to be made righteous? (See Mr. Bradshaw, Of Justification) Christ fulfilled the duty of the Law, and did undergo the penalty, that last was a satisfaction for the trespass which was as it were the forfeiture, and the fulfilling the Law was the principal, Ps. 40:4; Jer. 31:3; Gal. 4:4. Some, to avoid Christ’s active obedience, question whether Christ as man was not bound to fulfill the Law for Himself? All creatures are subject to God’s authority. Yet this detracts not from his active obedience, partly from his own free condescension, and partly because his whole person God and man obeyed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6, ‘Of Justification’, pp. 518-19</span></figcaption>

ll+we+had+kept+the+commandments+of+God%2C+Mt.+19%3A17%2C+and+we+were+not+able+to+keep+them+ourselves%2C+it+was+necessary+our+Surety+should+keep+them+for+us%2C+Dan.+9%3A24%3B+Rom.+10%3A4%3B+Rom.+3%3A21.+%28Mr.+Hildersham+on+Ps.+51%3A7%2C+Lecture+119%29+The+Scripture+seems+to+ascribe+our+redemption+wholly+to+Christ%E2%80%99s+bodily+death%2C+and+the+blood+that+He+shed+for+us%2C+Eph.+1%3A7%3B+Rev.+5%3A9%2C+but+in+these+places+the+Holy+Ghost+uses+a+synecdoche%2C+it+puts+one+part+of+Christ%E2%80%99s+passion+for+the+whole%3A+1.+Because+the+shedding+of+his+blood+was+a+sensible+sign+and+evidence+that+He+died+for+us.+2.+This+declared+Him+to+be+the+true+propitiatory+sacrifice+that+was+figured+by+all+the+sacrifices+under+the+Law.+%28Idem%2C+ibid.%29+Some+urge+this+argument%2C+By+Christs+active+obedience+imputed+to+them%2C+the+faithful+be+made+perfectly+righteous%2C+what+need+is+there+then+of+his+passive+righteousness%3F+need+there+anymore+than+to+be+made+righteous%3F+%28See+Mr.+Bradshaw%2C+Of+Justification%29+Christ+fulfilled+the+duty+of+the+Law%2C+and+did+undergo+the+penalty%2C+that+last+was+a+satisfaction+for+the+trespass+which+was+as+it+were+the+forfeiture%2C+and+the+fulfilling+the+Law+was+the+principal%2C+Ps.+40%3A4%3B+Jer.+31%3A3%3B+Gal.+4%3A4.+Some%2C+to+avoid+Christ%E2%80%99s+active+obedience%2C+question+whether+Christ+as+man+was+not+bound+to+fulfill+the+Law+for+Himself%3F+All+creatures+are+subject+to+God%E2%80%99s+authority.+Yet+this+detracts+not+from+his+active+obedience%2C+partly+from+his+own+free+condescension%2C+and+partly+because+his+whole+person+God+and+man+obeyed.%E2%80%9D%0A%0A%E2%80%94+Edward+Leigh%2C+A+System+or+Body+of+Divinity%E2%80%A6+%28London%2C+A.M.%2C+1654%29%2C+bk.+7%2C+ch.+6%2C+%E2%80%98Of+Justification%E2%80%99%2C+pp.+518-19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F31a784e770.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/31a784e770.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=Whether%20we%20be%20justified%20by%20the,whole%20person%20God%20and%20man%20obeyed&amp;text=Whether%20we%20be%20justified%20by%20the%20passive%20obedience&amp;text=because%20his%20whole%20person%20God%20and%20man%20obeyed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Crowe pays no attention at all to the historical debates,” – G.A. van den Brink . . Books 1600’s Walker, George – A Defense of the True Sense &amp; Meaning of the Words of the Holy Apostle, Rom. 4:3, 5, 9 in an Answer to Sundry Arguments Gathered from the Forenamed Scriptures by Mr. John Goodwin, together with a Reply to the Former Answer (1641) 56 pp. ToC Walker was a Westminster divine, who argues for Christ’s active righteousness being imputed in this work. Roborough, Henry – The Doctrine of Justification Cleared, by Animadversions on Mr. John Goodwin’s Animadversions Upon Mr. George Walker’s Defense of the True Sense of the Apostle, Rom. 4:3,5, etc. Together with an Examination of Both Parts of his Treatise of Justification: wherein the Imputation of Faith in a Proper Sense is Denied, &amp; the Imputation of Christ’s Righteousness, Active &amp; Passive, Affirmed, Against that Treatise (London: R.C., 1643) 221 pp. Roborough (d. 1649) was a non-voting scribe at the Westminster Assembly. John Goodwin was a prominent Arminian, though often considered a puritan. Roborough argues for Christ’s active righteousness being imputed in this work. See especially ‘Examination of Goodwin’s Conclusions’, ch. 5, ‘Wherein Scriptures are cleared, brought for the imputation of Christ’s active obedience with their true sense according to the judgment of the best expositors of the Protestant party’. Norton, John – A Discussion of that Great Point in Divinity, the Sufferings of Christ, &amp; the Question about his Righteousness-Active, Passive: &amp; the Imputation Thereof. Being an Answer to a Dialogue [of William Pynchon] entitled, The Meritorious Price of Redemption, Justification, etc. [1650], by John Norton, Teacher of the Church at Ipswich in New-England, who was Appointed to Draw up this Answer by the General Court (London, 1653) 270 pp. ToC Norton (1606-1663) was a puritan divine of England and New England. He argues for the imputation of Christ’s active obedience. Norton writes against William Pynchon (1590–1662), an influential New England settler who critiqued the puritan theology that surounded him and the nature of Christ’s satisfaction in an unique way in The Meritorious Price of Man’s Redemption… (1650; 1655). The book was burned on the Boston Common. The work argues that Christ’s obedience, rather than his punishment and suffering, was the price of atonement. Officials of the Massachusetts Bay Colony formally accused Pynchon of heresy and demanded that he retract its argument, which he did not. He moved back to England. The previously linked, later edition contains an appendix responding to Norton’s charges of heresy. . 2000’s McCormick, Micah – The Active Obedience of Jesus Christ PhD diss. (Southern Baptist Theological Seminary, 2010) 380 pp. Abstract: “Chapter 1 defines the doctrine, surveys previous literature, offers warrant for the work, and previews the argument of the work. In short, the thesis of this work is that the active obedience of Christ is a biblical doctrine. Chapter 2 presents a historical survey, tracing theologians from the early church up to the present time to see the development of the doctrine. Special attention is given to the Reformation and Post-Reformation eras, during which the doctrine received its primary development. Chapter 3 examines God’s original arrangement with Adam…. Chapter 4 examines human obedience after the Fall. Looking especially at the “do this and live” passages, this chapter argues that God requires perfect obedience from humans in order to gain eternal life. Chapter 5 traces the OT’s presentation of the need for a Messiah to come who would represent his people in perfect obedience… Chapter 6… Beginning with the Gospels and moving on to the rest of the NT, this chapter shows that Christ represented his people in perfect obedience throughout the whole course of his earthly mediation. Chapter 7 first offers a systematic formulation of the doctrine. This chapter then answers some of the major objections put to the doctrine of Christ’s active obedience, examining the views of opponents both ancient and contemporary. Chapter 8 summarizes the work…</p></blockquote>

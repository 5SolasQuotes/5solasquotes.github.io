<main class="wrap"><figure class="quote" id="q-ab803be0d5" data-kw="">
<blockquote><p>Others, like the sacramentarians, (those are justly called sacramentarians, who attribute to the sacraments what they do not contain, and by high-sounding but false and made-up promises, lead men away from simple trust in the one God to belief in the power of symbols. Therefore if any one hereafter finds “sacramentarians” in my writings, I want him to understand that class of men who attribute to symbols what belongs only to Divine Power and to the Holy Spirit, personally working in our souls, which symbols and the external word only proclaim and represent), the sacramentarians, I say, either not understanding or not wishing to understand the usage and meaning of our Lord’s words, twist this language so far as to venture to assert that the things themselves are really and materially conveyed by the sacraments by virtue of the words joined with the elements, and they defend their error by saying, “Faith is of things invisible.” “You do not see grace in baptism,” they say, “but it is certainly conveyed by virtue of the words, as soon as the clergyman has said, ‘I baptize thee in the name of the Father and of the Son and of the Holy Ghost.’ ” When you demand proof this proposition, they say: “Faith is of things invisible.” They fail to notice that baptism is not given to any one unless he first confesses that he has faith, if he is a grown person, or unless he has the promise in virtue of which he is counted a member of the Church, if he is a child. Thus this thing which the sacramentarians maintain is conveyed invisibly by the sacrament was actually conveyed before. For he who confesses faith had it before he confessed it and, therefore, before he was baptized. For confession precedes immersion. Thus the faith which was given by the light and gift of the Spirit was there before the candidate was admitted to the sacrament, or if he did not have faith, it is certainly not brought to him by baptism. For neither Judas nor Simon the sorcerer, who were without faith when they were baptized, received faith by baptism. But if an infant is to be baptized, since he cannot himself confess faith, he must have the promise which counts him within the Church. The promise is, that the Gentiles, when they have obtained the knowledge of God, and true religion, shall be just as much of the church and people of God as the Hebrews. This all the prophets heralded and Christ Himself most plainly promises. “They shall come from the east and from the west, and shall recline with the God of Abraham and Isaac and Jacob.”* And “The last shall be first,” and “The vineyard shall be given to other husbandmen,” and “There shall be one shepherd and one fold.” Since, therefore, the children of the Hebrews have always been counted with the Church with their parents, and the divine promise is sure, it is clear that the children of Christians belong to the Church of Christ just as much as their parents. This promise is not conveyed in baptism, but he to whom it has been previously given is baptized, that by a visible sign he may bear witness that he is of the number of those who through the goodness of God are called the people of God. Here surely nothing new is brought in, but that which has been previously given is recognized by a religious rite, and the name is given when the symbol and pledge have been received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Latin Works of Huldreich Zwingli</cite>, ed. William John Hinke (Philadelphia: Heidelberg Press, 1922), 2.194–95.</span></figcaption>

<blockquote><p>Thus, some would have baptism to be regeneration itself, and that there is no other evangelical regeneration but that alone, with the profession which is made thereon. Every one who is baptized is thereby regenerated. The sign and figure of grace, they would have to be the grace itself. Nothing can be invented more pernicious unto the souls of men; for all sorts of persons may be brought to a ruinous security about their spiritual condition by it, and diverted from endeavours after that real internal work, in the change of their hearts and natures, without which none shall see God. This is to put that into it which God never placed there. Some suppose it to be such a distinguishing, or rather separating ordinance, that the administration of it in such a way or at such a season, is the fundamental rule of all church fellowship and communion; whereas God never designed it unto any such end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews in the Works of John Owen</cite>, (Edinburg: The Banner of Truth Trust, 1991), 22:39.</span></figcaption>

<blockquote><p>III. Here therefore we think the question can be solved by distinguishing heretics. For there are some who corrupt the substance of baptism and omit or change the form of institution; such as were the ancient Arians, who denied a Trinity of persons in unity of essence, and the modern Socinians. Others, while they retain substantials and defend the true doctrine of the holy Trinity contained in the formula of baptism, ‘err on other heads of doctrine’; as the ancient Novatians and Donatists, and the modern Romanists and Arminians. As to the former, we judge that baptism administered by them is null, and so they are not properly to be rebaptized, but baptized, who have been baptized by such heretics, because they evidently corrupt the essential form of baptism, to which the invocation of the Trinity belongs. For this reason, the baptism of the Arians, who baptized ‘in the name of the Father, the only true God, in Jesus Christ, the Savior and a creature, and in the Holy Spirit, the servant of both’… was formerly rejected in the Nicene Council… Still a distinction must be made here again. For either the minister alone was infected with that heresy or the whole church with him. If the latter, we deny it to be true baptism. If the former (to wit, if the church thinks rightly, notwithstanding the error of the pastor, if he is a secret heretic), provided the formula of Christ be retained, we believe the baptism to be valid and that it is not necessary to rebaptize those who have been once baptized. The sacrament is the property of the church, which is administered in her name and in her faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Question 15, ‘Is Baptism Administered by Heretics Lawful? We Distinguish’ in Institutes (P&amp;R), vol. 3, 19th Topic, ‘The Sacraments’, pp. 396-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>That infants of visible Churches, born of wicked parents, being members of the Church, ought to be baptized. In these and several other particulars, we fully accord with Mr. Rutherford…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hooker.html">Thomas Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Survey of the Sum of Church-Discipline</cite>, (London, 1648), Preface, no page number. Hooker was a leading New England congregationalist.</span></figcaption>

<blockquote><p>‘It comes sometime to pass’ (says St. Augustine) ‘that the children of bond-slaves are brought to baptism by their Lord; sometime the parents being dead, the friends alive undertake that office, sometime stangers or virgins consecrated unto God, which neither have, nor can have children of their own, take up infants in the open streets, and so offer them unto baptism, whom the cruelty of unnatural parents casts out, and leaves to the adventure of uncertain pity.’ As therefore he which did the part of a neighbor, was a neighbor to that wounded man whom the parable of the Gospel describes, so they are fathers, although strangers, that bring infants to him which makes them the sons of God.</p></blockquote>

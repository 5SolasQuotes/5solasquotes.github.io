<main class="wrap"><figure class="quote" id="q-d2065f7484" data-kw="">
<blockquote><p>We must have songs not only honorable but also holy, which are to be like needles to arouse us to pray and praise God, to meditate on his works, in order to love him, fear, honor and glorify him. But what St. Augustine says is true, that no one can sing things worthy of God unless he has received them from Him. For when we have searched here and there, we will not find better songs nor ones more appropriate for this purpose than the Psalms of David, which the Holy Spirit has spoken to him and made. Therefore, when we sing them, we are certain that God has put the words in our mouth as if they themselves sang in us to exalt his glory. Consequently Chrysostom exhorts both men, women and little children to learn to sing them in order that they may be like a meditation to associate them with the company of angels (Chrysostom, In Ps. 41:1,2). Besides, we must remember what St. Paul says, that spiritual songs cannot be better sung than from the heart (Eph. 5:19; Col. 3:16). But the heart requires understanding. And in that (says St. Augustine) lies the difference between the singing of men and that of birds (Aug. Enarr. in Ps. 81, 2.1). For a Linnet, a Nightingale or a Popinjay will sing well, but it will be without understanding. But man’s proper gift is to sing, knowing what he says; after understanding must follow the heart and the affection, something that can only happen when we have the song imprinted on our memory never to cease singing it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Letter to the Reader’ in The Form of Prayers and Songs of the Church (1543)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-97557a90c5" data-kw="">
<blockquote><p>…we would not only fall down upon our faces and give him thanks, but with loud voices would we praise Him, and in the midst of the congregation would we extol his name, as David and Asaph do almost in every psalm. For doubtless whoso believeth that God loveth him, and feeleth by his faith, that he hath forgiven him all his sins, and careth for him… shall be compelled by the Spirit of God to break out into praise and thanksgiving therefore… but shall cry and call upon them, as David doth, saying: “Praise the Lord with me, and let us magnify his name together. I sought the Lord, and He heard me, yea, He delivered me out of all my fear.”… Yea, would God that our minstrels had none other thing to play upon, neither our carters and ploughmen other thing to whistle upon, save psalms, hymns, and such godly songs as David is occupied withal! And if women, sitting at their rocks [instruments used in spinning], or spinning at the wheels, had none other songs to pass their time withal, than such as Moses’ sister, Glehana’s [Elkanah’s] wife, Debora, and Mary the mother of Christ, have sung before them, they should be better occupied than with ‘hey nony nony, hey troly loly,’ and such like fantasies. If young men also that have the gift of singing, took their pleasure in such wholesome ballads as the [apocryphal] three children sing in the fire, and as Jesus the Son of Sirac doth in his last chapter, it were a token, both that they felt some spark of God’s love in their hearts, and that they also had some love unto Him; for truly, as we love, so sing we… Seeing then that, as the prophet David saith, it is so good and pleasant a thing to praise the Lord, and so expedient for us to be thankful (Ps. 147); therefore, to give our youth of England some occasion to change their foul and corrupt ballads into sweet songs and spiritual hymns of God s honor, and for their own consolation in him, I have here, good reader, set out certain comfortable songs grounded on God’s Word, and taken some out of the holy scripture, specially out of the Psalms of David, all whom would God that our musicians would learn to make their songs! and if they which are disposed to be merry, would in their mirth follow the counsel of St. Paul and St. James (Col. 3; James 5), and not to pass their time in naughty songs of fleshly love and wantonness, but with singing of psalms, and such songs as edify, and corrupt not men’s conversation. … The children of Israel in the old time, when God had delivered them from their enemies, gave thanks unto Him, and made their song of Him, as thou seest by Moses, Barak, David, and other more. Why should not we then make our songs and mirth of God, as well as they? Hath He not done as much for us as for them? Hath He not delivered us from as great troubles as them? Yes, doubtless. Why should He not then be our pastime, as well as theirs? As for such psalms as the scripture describeth (beside the great consolation that they bring into the heart of the spiritual singer) they do not only cause him to spend his time well by exercising himself in the sweet Word of God; but through such ensamples they provoke other men also unto the praise of God and virtuous living. And this is the very right use wherefore psalms should be sung; namely, to comfort a man’s heart in God, to make him thankful, and to exercise him in his Word, to encourage him in the way of godliness, and to provoke other men unto the same. By this thou mayest perceive, what spiritual edifying cometh of godly psalms and songs of God s Word; and what inconvenience foloweth the corrupt ballads of this vain world. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/miles-coverdale.html">Miles Coverdale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ghostly [Spiritual] Psalms and Spiritual Songs (1539), ‘Unto the Christian Reader’ in Remains of Myles Coverdale (Cambridge: Parker Society, 1846)</cite>, pp. 536-540</span></figcaption>

r+men+unto+the+same.+By+this+thou+mayest+perceive%2C+what+spiritual+edifying+cometh+of+godly+psalms+and+songs+of+God+s+Word%3B+and+what+inconvenience+foloweth+the+corrupt+ballads+of+this+vain+world.+%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Miles+Coverdale%2C+Ghostly+%5BSpiritual%5D+Psalms+and+Spiritual+Songs+%281539%29%2C+%E2%80%98Unto+the+Christian+Reader%E2%80%99+in+Remains+of+Myles+Coverdale+%28Cambridge%3A+Parker+Society%2C+1846%29%2C+pp.+536-540&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F97557a90c5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/97557a90c5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=we%20would%20not%20only%20fall%20down,corrupt%20ballads%20of%20this%20vain%20world&amp;text=we%20would%20not%20only%20fall%20down%20upon%20our&amp;text=foloweth%20the%20corrupt%20ballads%20of%20this%20vain%20world" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Verse 30. ‘When they had sung a hymn,’ etc. A hymn is a verse sung for the praise of God. Their opinion doth not seem to be vain who think that the apostles at that time sung a great hymn which consists of six Psalms: 113, 114, 115, 116, 117, and 118. The Hebrews certainly sing this song in the night of the Passover after the lamb is eaten. Paulus Burgensis thinks that the Apostles rehearsed this hymn, according to the custom of the Jews, after the Passover, and that this place is to be understood of that, which is very probable, for since in other things it is manifest that Christ with his apostles observed the rite of the Jews in eating the Passover, it is not unlikely that He might follow them in this also. Grotius saith, learned men think that the hymns were sung by Christ which were wont to be sung at the Passover, as the 114, and those that follow, but he seems to be of another opinion.</p></blockquote>

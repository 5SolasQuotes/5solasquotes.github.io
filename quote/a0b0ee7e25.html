<main class="wrap"><figure class="quote" id="q-a0b0ee7e25" data-kw="">
<blockquote><p>There is mercy enough in God for the pardoning of your sins be they never so great: God’s nature is of infinite and unlimited perfection; there is an infinite ocean of Grace in the heart of God: it is not possible for man to commit such sins that God should not be able to pardon them: God is of such mercy, that he can do any thing that is an act of mercy: as there is nothing too hard for the power of God, so there is nothing too hard for the mercy of God: and certainly sinners have little reason to object that God can’t find in his heart to pardon them, when he has found in his heart to provide a sufficient sacrifice for them, when he has found in his heart to offer them pardon, when he has found in his heart to pardon others as great sinners as they.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/solomon-stoddard.html">Solomon Stoddard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The safety of appearing at the day of judgement, in the righteousness of Christ: opened and applied</cite>, (Boston MA: Samuel Phillips, 1687), pp 294-95.</span></figcaption>

<blockquote><p>The covenant of grace is, properly speaking, an unconditional covenant. The conditions have been fulfilled for us by Christ, the covenant head of elect humanity (though we can refer to saving faith as a condition, but only in an improper sense). As Ralph Erskine argues:

This is the condition of the New Covenant. The Covenant of Works had only the active obedience of the first Adam for its condition; but the condition of the Covenant of Grace properly, is both the active and passive obedience of the second Adam, his doing and dying. Now, Lord, have respect to that blood that sealed the covenant; since the condition is fulfilled to thy infinite satisfaction, let the promised good be conferred upon me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith’s Plea Upon God’s Covenant: A Sermon on Psalm LXXIV. 20</cite>, (Falkirk: T. Johnston, 1821), p. 8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>Device [of Satan] (4). By suggesting to a sinner Christ’s unwillingness to save. It is true, says Satan, Christ is able to save you, but is He willing? Surely, though He is able, yet He is not willing to save such a wretch as you are, that has trampled his blood under your feet, and that has been in open rebellion against Him all thy days, etc. The remedy against this device of Satan is, briefly to consider these few things: Remedy (1). First, The great journey that He has taken, from heaven to earth, on purpose to save sinners, does strongly demonstrate his willingness to save them. Mt. 9:13, ‘I came not to call the righteous, but sinners to repentance.’ 1 Tim. 1:15, ‘This is a faithful saying, and worthy of all acceptation, that Jesus Christ came into the world to save sinners, of whom I am chief.’ Secondly, His divesting Himself of his glory in order to sinners’ salvation, speaks out his willingness to save them. He leaves his Father’s bosom, He puts off his glorious robes, and lays aside his glorious crown, and bids adieu to his glistering courtiers the angels; and all this He does, that He may accomplish sinners’ salvation. Thirdly, That sea of sin, that sea of wrath, that sea of trouble, that sea of blood that Jesus Christ waded through, that sinners might be pardoned, justified, reconciled and saved does strongly evidence his willingness to save sinners, 1 Cor. 5:19,20. Fourthly, His sending his ambassadors, early and late, to woo and entreat sinners to be reconciled to Him, does with open mouth show his readiness and willingness to save sinners. Fifthly, His complaints against such as refuse Him, and that turn their backs upon Him, and that will not be saved by Him, does strongly declare his willingness to save them: Jn. 1:11, ‘He came to his own, and his own received Him not.’ So in Jn. 5:40, ‘But ye will not come to me, that ye may have life.’ Sixthly, The joy and delight that He takes at the conversion of sinners, does demonstrate his willingness that they should be saved: Lk. 15:7, ‘I say unto you, That likewise joy shall be in heaven over one sinner that repents, more than over ninety and nine just persons that need no repentance.’ God the Father rejoices at the return of his prodigal son: Christ rejoices to see the travail of his soul: the Spirit rejoices that He has another temple to dwell in…</p></blockquote>

 of sinners, does demonstrate his willingness that they should be saved: Lk. 15:7, ‘I say unto you, That likewise joy shall be in heaven over one sinner that repents, more than over ninety and nine just persons that need no repentance.’ God the Father rejoices at the return of his prodigal son: Christ rejoices to see the travail of his soul: the Spirit rejoices that He has another temple to dwell in…”

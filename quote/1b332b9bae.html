<main class="wrap"><figure class="quote" id="q-1b332b9bae" data-kw="">
<blockquote><p>Canon VII: As all his works were known unto God from eternity, (Acts 15:18), so in time, according to his infinite power, wisdom, and goodness, he made man, the glory and end of his works, in his own image, and, therefore, upright, wise, and just. Having created man in this manner, he put him under the Covenant of Works, and in this Covenant freely promised him communion with God, favor and life, if indeed he acted in obedience to his will. Canon VIII: Moreover that promise connected to the Covenant of Works was not a continuation only of earthly life and happiness but the possession especially of eternal and celestial life, a life namely, of both body and soul in heaven, if indeed man ran the’ course of perfect obedience, with unspeakable joy in communion with God. For not only did the Tree of Life prefigure this very thing unto Adam, but the power of the law, which, being fulfilled by Christ, who went under it in our place, awards to us nothing other than celestial life in Christ who kept the same righteousness of the law. The power of the law also threatens man with both temporal and eternal death. Canon IX: Wherefore we can not agree with the opinion of those who deny that a reward of heavenly bliss was offered to Adam on condition of obedience to God. We also do not admit that the promise of the Covenant of Works was any thing more than a promise of perpetual life abounding in every kind of good that can be suited to the body and soul of man in a state of perfect nature, and the enjoyment thereof in an earthly Paradise. For this also is contrary to the sound sense of the Divine Word, and weakens the power of the law considered in itself. Canon X: God entered into the Covenant of Works not only with Adam for himself, but also, in him as the head and root with thc whole human race. Man would, by virtue of the blessing of the nature derived from Adam, inherit also the same perfection, provided he continued in it. So Adam by his sorrowful fall sinned and lost the benefits promised in the Covenant not only for himself, but also for the whole human race that would be born by the flesh. We hold, therefore, that the sin of Adam is imputed by the mysterious and just judgment of God to all his posterity. For the Apostle testifies that “in Adam all sinned, by one man’s disobedience many were made sinners” (Rom 5:12,19) and “in Adam all die” (I Cor 15:21–22). But there appears no way in which hereditary corruption could fall, as a spiritual death, upon the whole human race by the just judgment of God, unless some sin of that race preceded, incurring the penalty of that death. For God, the most supreme Judge of all the earth, punishes none but the guilty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-h-heidegger-and-francis-turretin.html">J. H. Heidegger and Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Helvetic Consensus Formula</cite>, (1675)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d4e5db7ae8" data-kw="">
<blockquote><p>As an evidence that all unregenerate persons are under the dominion of the law as a covenant of works, the natural bent of their hearts in all their views respecting the means of salvation is to the way of that covenant [of works]. They all desire to be under the law of works. All who have embraced either one or another of the false religions that are in the world agree at least in this principle: it is by doing that men are to live. Hence, when the Lord opens the eyes of a man to see that horrible gulf of sin and misery into which the first Adam plunged him, he is strongly inclined to exert himself for deliverance in the way of the covenant of works. He struggles hard to forsake his sins and to perform his duties, hoping that by his own performances he will become so righteous as to pacify the wrath of God and to procure for himself eternal life. Ah, ignorant, proud, vain attempt! This, however, he resolutely persists in doing until he is made to despair of ever being able to procure salvation for himself in the way of that covenant. Indeed, this natural bent of the depraved heart toward the way of the law as a covenant, together with deep ignorance of the high demands of the law in that form, is the source of all the self-righteousness that is in the world. To take sinners off from this to a cordial reliance only on the righteousness of the second Adam for all their title to salvation is a special part of the Holy Spirit’s work in conviction and conversion, and to do it requires a greater exertion of His almighty power than even to create a world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 41–42 (emphasis added).</span></figcaption>

<blockquote><p>OBJECTION. If any shall say, “By ‘first and old covenant’ was meant God’s covenant with Israel, and not with Adam; and so, by ‘covenant of works’ the same is meant; namely, that which the Lord made at Mount Sinai:” (Heb. 8:7–9:) ANSWER. Hereunto I answer, There is a repetition of the covenant of works with Adam in the law of Moses; as in that of the apostle to the Galatians: “The law is not of faith: but, The man that doeth” these things “shall live in them.” (Gal. 3:12.) So likewise to the Romans: “Moses describeth the righteousness which is of the law, That the man who doeth those things shall live by them.” (Rom. 10:5.) Thus it was with Adam principally and properly: therefore he was under a covenant of works, when God gave him that command in my text.</p></blockquote>

</figure><figure class="quote" id="q-354c26cd8f" data-kw="">
<blockquote><p>Because what God so severely punished must have been no light sin but a detestable crime, we must consider what species of sin (peccati) there was in Adam’s fall that kindled God’s horrible vengeance against the whole human race. To regard Adam’s sin as gluttonous intemperance (a common notion) is childish. As if the sum and head of all virtues lay in abstaining solely from one fruit, when all sorts of desirable delights abounded everywhere; and not only abundance but also magnificent variety was at hand in that blessed fruitfulness of earth! We must, therefore, look deeper. The prohibition from the tree of knowledge of good and evil was a test of obedience (obedientiae examen), that Adam, by observing it, might prove his willing submission to the command of God. The very name of the tree shows the sole purpose of the precept was to keep him content with his lot and to prevent him from becoming puffed up with cupidity. The promise (promissio), which gave him hope of eternal life as long as he should eat of the tree of life (arbore vitae), and, on the other hand, the fearful denunciation of death the moment he should taste of the tree of knowledge of good and evil, were meant to test (probandam) and exercise his faith. Hence it is not hard to deduce by what means Adam provoked God’s wrath upon himself. Indeed, Augustine speaks rightly when he declares that pride was the beginning of all evils. For if ambition had not raised man higher than was meet and right, he could have remained in his original state.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.1.4.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Because what God so severely punished must have been no light sin but a detestable crime, we must consider what species of sin (peccati) there was in Adam’s fall that kindled God’s horrible vengeance against the whole human race. To regard Adam’s sin as gluttonous intemperance (a common notion) is childish. As if the sum and head of all virtues lay in abstaining solely from one fruit, when all sorts of desirable delights abounded everywhere; and not only abundance but also magnificent variety was at hand in that blessed fruitfulness of earth! We must, therefore, look deeper. The prohibition from the tree of knowledge of good and evil was a test of obedience (obedientiae examen), that Adam, by observing it, might prove his willing submission to the command of God. The very name of the tree shows the sole purpose of the precept was to keep him content with his lot and to prevent him from becoming puffed up with cupidity. The promise (promissio), which gave him hope of eternal life as long as he should eat of the tree of life (arbore vitae), and, on the other hand, the fearful denunciation of death the moment he should taste of the tree of knowledge of good and evil, were meant to test (probandam) and exercise his faith. Hence it is not hard to deduce by what means Adam provoked God’s wrath upon himself. Indeed, Augustine speaks rightly when he declares that pride was the beginning of all evils. For if ambition had not raised man higher than was meet and right, he could have remained in his original state.”

— John Calvin, Institutes, 2.1.4.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBecause+what+God+so+severely+punished+must+have+been+no+light+sin+but+a+detestable+crime%2C+we+must+consider+what+species+of+sin+%28peccati%29+there+was+in+Adam%E2%80%99s+fall+that+kindled+God%E2%80%99s+horrible+vengeance+against+the+whole+human+race.+To+regard+Adam%E2%80%99s+sin+as+gluttonous+intemperance+%28a+common+notion%29+is+childish.+As+if+the+sum+and+head+of+all+virtues+lay+in+abstaining+solely+from+one+fruit%2C+when+all+sorts+of+desirable+delights+abounded+everywhere%3B+and+not+only+abundance+but+also+magnificent+variety+was+at+hand+in+that+blessed+fruitfulness+of+earth%21+We+must%2C+therefore%2C+look+deeper.+The+prohibition+from+the+tree+of+knowledge+of+good+and+evil+was+a+test+of+obedience+%28obedientiae+examen%29%2C+that+Adam%2C+by+observing+it%2C+might+prove+his+willing+submission+to+the+command+of+God.+The+very+name+of+the+tree+shows+the+sole+purpose+of+the+precept+was+to+keep+him+content+with+his+lot+and+to+prevent+him+from+becoming+puffed+up+with+cupidity.+The+promise+%28promissio%29%2C+which+gave+him+hope+of+eternal+life+as+long+as+he+should+eat+of+the+tree+of+life+%28arbore+vitae%29%2C+and%2C+on+the+other+hand%2C+the+fearful+denunciation+of+death+the+moment+he+should+taste+of+the+tree+of+knowledge+of+good+and+evil%2C+were+meant+to+test+%28probandam%29+and+exercise+his+faith.+Hence+it+is+not+hard+to+deduce+by+what+means+Adam+provoked+God%E2%80%99s+wrath+upon+himself.+Indeed%2C+Augustine+speaks+rightly+when+he+declares+that+pride+was+the+beginning+of+all+evils.+For+if+ambition+had+not+raised+man+higher+than+was+meet+and+right%2C+he+could+have+remained+in+his+original+state.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes%2C+2.1.4.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F354c26cd8f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/354c26cd8f.html">Permalink</a><a class="src" hre

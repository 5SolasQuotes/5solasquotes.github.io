<main class="wrap"><figure class="quote" id="q-f7df69ce10" data-kw="">
<blockquote><p>In discriminating between works that are morally good or evil, or between those which should be encouraged and those which should be suppressed, Covenanters imagine – that it is the duty of civil magistrates, or of nations acting by their rulers, to profess, establish, and support the true religion; to exert their influence and authority, that it may be received and professed by all within their dominions; to enact wise and salutary laws for its encouragement and protection; and to see that its ministers be suitably supported, and its ordinances regularly dispensed.

This is the true way, as they conceive, to make evil-doers of every description afraid, and to praise and encourage them that to do well. They consider it quite unreasonable and absurd, to prefer the temporal interests of society to the glory of God, so that the magistrate should restrain and punish gross violations of the second table of the law, as murder, adultery, robbery, theft, &amp;c.; but should allow idolatry, blasphemy, sabbath-profanation, and the like, to pass with impunity, since these latter crimes are no less detrimental to the interests of society than the former.

Is not the wrath of God revealed from heaven against all unrighteousness of men? Do not sins of the first table, no less than those of the second, bring down Divine judgments on guilty nations, and shall rulers do nothing to check the prevailing inquities, and to avert the merited vengeance of heaven? Was it commendable in Artaxerxes, a heathen prince, to promote a work of reformation at Jerusalem, and to see that the commands of God should be carefully performed, lest wrath might fall upon his dominions; and shall Christian princes do nothing in such cases? Is God less holy, his law less strict, or sin less displeasing to him now, than during the Mosaic dispensation?

Why should a Christian magistrate encourage, by indulgence, what was to be rigorously punished under the law? Has the Lord Jesus Christ destroyed the law, or become the minister of sin? Surely those who plead the typical nature of the Jewish civil institutions, and who respect the doctrine of the Westminster Standards, respecting the magistrate’s power in being a terror to evil-doers, and a praise to them that do well, are not aware of the consequences resulting from such innovations!</p></blockquote>

<blockquote><p>II. The Scriptures plainly represent magistrates’ granting of men an unrestrained freedom to profess and practice a false religion as extremely sinful and hurtful.

1. It is in the name of God to give liberty to the flesh, of which heresies and idolatry are the manifest and damning works, Gal. v. 13, 19-21, with Rom. viii. 7, 8.

2. It is not merely to pity and spare, but to encourage such as seek to draw away their subjects from God, contrary to Deut. xiii. 9-10; Eph. iv. 14; 2 Tim. iii. 4, 5; 2 Pet. ii. 1-3.

3. In so doing, magistrates, as political shepherds, not only suffer the flock of God, the King of nations, under their charge, to wander or be driven from their fold and pasture, but encourage them in it, contrary to Ezek. xxxiv. 5-8; Acts xx. 30.

4. It marks a heavy judgement of God upon, and anarchy in a Commonwealth, when every man is left without restraint, and does that which is right in his own eyes, in matters of religion, Judges xvii. 6; Zech. xi. 9, 16; 2 Chron. xx. 33; Amos iv. 4, 5.

5. In granting such liberty, magistrates are not for Christ, by whom they rule, Prov. viii. 15, 16, but against him, in encouraging and protecting doctrines and works of the devil, which he came to destroy, John viii. 44; 1 Tim. iv. 2; Rev. xvi. 13, 14, with 1 John iii. 8 and Zech. xiii. 2.

6. False religion eats out the true doctrine of Christ, and the true piety and virtue which proceed from the faith of it, which are like joints and bands to connect and establish a nation, Isa. lix, lxv; 2 Tim. ii. 16, 17; Gal. v. 10-12.

7. Heresies produce divisions, 1 Cor. xi. 18, 19, make men wanton, filthy, dreamers, despisers and revilers of magistrates, Jude 4, 8; 2 Pet. ii. 10-17. They render times perilous, and make traitors, heady, high minded, truce breakers, false accusers, fierce, without natural affection, despisers of those that are good, 2 Tim. iii:1-13. They produce envy, strife, evil surmising, and perverse disputing, 1 Tim. vi. 3, 4; Gal. v. 19. 20. They spoil Christ’s vines, Song. ii. 15.

8. False religion deprives a nation of God’s protecting hedge of favourable providence, and opens an inlet to the floods of destructive judgements, Exod. xxxii. 25; Ezek. xiii. 4, 5; xxii. 30, 31.

9. Magistrates’ indulgence of a false religion is represented as a kicking at the true religion, and an honouring of the corrupters above God, and brings a charge of the wickedness upon the tolerators of it. Hence Eli the judge of Israel is represented as kicking at God’s sacrifice, honouring his profane sons above God, and making himself fat with God’s portion of the sacrifices, because he did not effectually restrain his sons, 1 Sam. ii. 12-16, 23-25, 29; Eph. v. 7, 11; and Nehemiah contended with the rulers of Judah for suffering the worship of God to be neglected, and the Sabbath profaned, Neh. xiii. 10-18.

10. Such indulgence of false or corrupt religion is represented as tending to make men abhor the true religion, and speak evil of it, 1 Sam. ii. 17; 2 Pet. ii. 1-3.</p></blockquote>

gion+eats+out+the+true+doctrine+of+Christ%2C+and+the+true+piety+and+virtue+which+proceed+from+the+faith+of+it%2C+which+are+like+joints+and+bands+to+connect+and+establish+a+nation%2C+Isa.+lix%2C+lxv%3B+2+Tim.+ii.+16%2C+17%3B+Gal.+v.+10-12.%0A%0A7.+Heresies+produce+divisions%2C+1+Cor.+xi.+18%2C+19%2C+make+men+wanton%2C+filthy%2C+dreamers%2C+despisers+and+revilers+of+magistrates%2C+Jude+4%2C+8%3B+2+Pet.+ii.+10-17.+They+render+times+perilous%2C+and+make+traitors%2C+heady%2C+high+minded%2C+truce+breakers%2C+false+accusers%2C+fierce%2C+without+natural+affection%2C+despisers+of+those+that+are+good%2C+2+Tim.+iii%3A1-13.+They+produce+envy%2C+strife%2C+evil+surmising%2C+and+perverse+disputing%2C+1+Tim.+vi.+3%2C+4%3B+Gal.+v.+19.+20.+They+spoil+Christ%E2%80%99s+vines%2C+Song.+ii.+15.%0A%0A8.+False+religion+deprives+a+nation+of+God%E2%80%99s+protecting+hedge+of+favourable+providence%2C+and+opens+an+inlet+to+the+floods+of+destructive+judgements%2C+Exod.+xxxii.+25%3B+Ezek.+xiii.+4%2C+5%3B+xxii.+30%2C+31.%0A%0A9.+Magistrates%E2%80%99+indulgence+of+a+false+religion+is+represented+as+a+kicking+at+the+true+religion%2C+and+an+honouring+of+the+corrupters+above+God%2C+and+brings+a+charge+of+the+wickedness+upon+the+tolerators+of+it.+Hence+Eli+the+judge+of+Israel+is+represented+as+kicking+at+God%E2%80%99s+sacrifice%2C+honouring+his+profane+sons+above+God%2C+and+making+himself+fat+with+God%E2%80%99s+portion+of+the+sacrifices%2C+because+he+did+not+effectually+restrain+his+sons%2C+1+Sam.+ii.+12-16%2C+23-25%2C+29%3B+Eph.+v.+7%2C+11%3B+and+Nehemiah+contended+with+the+rulers+of+Judah+for+suffering+the+worship+of+God+to+be+neglected%2C+and+the+Sabbath+profaned%2C+Neh.+xiii.+10-18.%0A%0A10.+Such+indulgence+of+false+or+corrupt+religion+is+represented+as+tending+to+make+men+abhor+the+true+religion%2C+and+speak+evil+of+it%2C+1+Sam.+ii.+17%3B+2+Pet.+ii.+1-3.%E2%80%9D%0A%0A%E2%80%94+John+Brown%2C+The+absurdity+and+perfidy+of+all+authoritative+toleration+of+gross+heresy%2C+blasphemy%2C+idolatry%2C+popery%2C+in%2C+Britain.+In+two+letters+to+a+friend.+In+which+the+doctrine+of+the+Westminster+Confession+of+Faith+relative+to+toleration+of+a+false+religion%2C+and+the+power+of+the+civil+magistrate+about+sacred+matters%3B+and+the+nature%2C+origin%2C+ends+and+obligation+of+the+National+Covenant+and+Solemn+League+are+candidly+represented+and+defended+%281780%3B+Glasgow%2C+1803%29%2C+pp+19-21.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F34a5b9152b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/34a5b9152b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/04/02/john-brown-of-haddington-on-the-sin-of-the-civil-magistrate-tolerating-false-religion/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

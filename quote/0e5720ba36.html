<main class="wrap"><figure class="quote" id="q-0e5720ba36" data-kw="">
<blockquote><p>The ordinary officers of our Church are Pastors, to whom belongeth the word of exhortation, 1 Tim. 3:1-3; 2 Tim. 1:7,8, Doctors, who in schools expound the word of God, and convince gainsayers, Rom. 12:7,8; Eph. 4:11; 1 Cor. 12:28, Governors, or governing Elders who rule well, Rom. 12:8; 1 Cor. 12:28; 1 Tim. 5:17; Acts 15:23, and Deacons who care for the poor, Acts 6:2-4; 1 Tim. 3:8-12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (London, 1642) | Ch. 20, Whether or not the government of the Church of Scotland can be proved by God’s Word to be lawful? | Article 2, Officers of the Church</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“The ordinary officers of our Church are Pastors, to whom belongeth the word of exhortation, 1 Tim. 3:1-3; 2 Tim. 1:7,8, Doctors, who in schools expound the word of God, and convince gainsayers, Rom. 12:7,8; Eph. 4:11; 1 Cor. 12:28, Governors, or governing Elders who rule well, Rom. 12:8; 1 Cor. 12:28; 1 Tim. 5:17; Acts 15:23, and Deacons who care for the poor, Acts 6:2-4; 1 Tim. 3:8-12.”

— Samuel Rutherford, A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland (London, 1642) | Ch. 20, Whether or not the government of the Church of Scotland can be proved by God’s Word to be lawful? | Article 2, Officers of the Church">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+ordinary+officers+of+our+Church+are+Pastors%2C+to+whom+belongeth+the+word+of+exhortation%2C+1+Tim.+3%3A1-3%3B+2+Tim.+1%3A7%2C8%2C+Doctors%2C+who+in+schools+expound+the+word+of+God%2C+and+convince+gainsayers%2C+Rom.+12%3A7%2C8%3B+Eph.+4%3A11%3B+1+Cor.+12%3A28%2C+Governors%2C+or+governing+Elders+who+rule+well%2C+Rom.+12%3A8%3B+1+Cor.+12%3A28%3B+1+Tim.+5%3A17%3B+Acts+15%3A23%2C+and+Deacons+who+care+for+the+poor%2C+Acts+6%3A2-4%3B+1+Tim.+3%3A8-12.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Peaceable+%26+Temperate+Plea+for+Paul%E2%80%99s+Presbytery+in+Scotland+%28London%2C+1642%29+%7C+Ch.+20%2C+Whether+or+not+the+government+of+the+Church+of+Scotland+can+be+proved+by+God%E2%80%99s+Word+to+be+lawful%3F+%7C+Article+2%2C+Officers+of+the+Church&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0e5720ba36.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0e5720ba36.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/teachers/#:~:text=The%20ordinary%20officers%20of%20our%20Church,poor%2C%20Acts%206%3A2%2D4%3B%201%20Tim.%203%3A8%2D12&amp;text=The%20ordinary%20officers%20of%20our%20Church%20are%20Pastors&amp;text=for%20the%20poor%2C%20Acts%206%3A2%2D4%3B%201%20Tim.%203%3A8%2D12" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-0a3828f49a" data-kw="">
<blockquote><p>III. Second, this special call is either internal or external. The former is that by which the heart itself is excited by God to consecrate itself to the work of the ministry (of which Paul speaks in 1 Tim. 3:1). This is rather a disposition of mind to receive the call than a call properly so called. By it, a man is conscious before God that he is impelled to undertake this office not by ambition or avarice or any other carnal affection, but from a sincere love of God and a desire to build up the church. The latter, however, is that by which a man thus disposedis expressly called to exercise the office.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, tr. George M. Giger, ed. James Dennison Jr. (1679–1685; P&amp;R, 1994), vol. 3, 18th Topic, 23. ‘Of how many kinds is the call to the ministry and is an ordinary call always necessary? We distinguish., p. 215</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>5th Distinction: There is a formal calling of the Church, as the laying on of the hands of the elders, and a virtual and interpretative calling or tacit approbation of the Church, when learned men of eminent gifts, not in office, do write commentaries, sermons on canonical Scriptures, and tractates refuting heresies; to this the tacit approbation of the Church is required, but these have not ordinary pastoral care, nor are they the ordinary converters of souls to Christ, as the pretended prophets of Separatists are [claimed to be].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1646) | Part 2, p. 272</span></figcaption>

</figure><figure class="quote" id="q-d1a8abb219" data-kw="">
<blockquote><p>8. All prophets are either ordinary or extraordinary, as is clear in God’s Word; extraordinary now are not in the Church, and the ordinary prophets now are not gifted to preach the Word, except as Timothy, from their youth they have been trained up in the Scriptures and have learning, sciences, knowledge of the tongues, if he would be a man able to teach others, 2 Tim. 2:3; 1 Tim. 3, he must meditate, read, and give himself wholly to these things, 1 Tim. 3:15-16, and so must leave his calling contrary to the apostle his commandment, 1 Cor. 7:20-22; 1 Thess. 4:11; Eph. 4:28, but if he have a gift for public preaching, he is to separate himself for it, seeing a gift is a token of Gods separation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (London, 1644), pt. 2, ch. 5, sections 1 &amp; 2, Question 2, “Whether or not all gifted persons may preach the Word of God publicly and ordinarily, for the gathering in of souls to Christ, though they be destitute of all official authority, or Church calling to that ministry? [No]”, pp. 280-81</span></figcaption>

<main class="wrap"><figure class="quote" id="q-9f4b7ef13b" data-kw="">
<blockquote><p>We therefore reject the deifications of the Enthusiasts, the spirit and eternal uncreated Word, etc. For by these they subvert the nature of God and of man, and the operations of both. Which abominations, arising from the confusion of God with His work, of substance with accident, of the Holy Spirit with the Word, of man sanctified by God with the Sanctifier Himself and His divine holiness, we detect elsewhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 432 ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-10f0cad08d" data-kw="">
<blockquote><p>The fifth and last, is of the branch and tree into which it is engraffed; as suppose a vine-branch and an olive-tree: now as this olive-tree is but one, but has two different natures in it, and so it beareth two kinds of fruit: and yet between the tree and the branch there is a composition, not hujus ex his, but hujus ad hoc (i.e.) not of a third thing out of the two things united, but of one of the two things united or adjoyned to the other: Even so Christ is one, but He has two different natures, and in them He performs the different actions pertaining to either of them: and yet between the different natures (the divine and human nature) there is a composition, not hujus ex his but hujus ad hoc, not of a third nature arising out of these, but of the humane nature added or united to the divine, in unity of the same person: so that now we may say, as this vine is an olive-tree, and this olive-tree is a vine: or as this vine bears olives, and this olive-tree bears grapes, so the Son of man is the Son of God, and the Son of God is the Son of Man: or this Son of Man laid the foundation of the earth, and this Son of God was born of Mary, and crucified by the Jews. This similitude (I take it) is the aptest and fullest of all the other, though in some things also it does fail; for the branch has first a separate subsistence in itself, and losing it after, then it is drawn into the unity of the subsistence of that tree into which it is implanted; but it is otherwise with the human nature of Christ; it never had any subsistence of its own, until it was united to the person or subsistence of the Son of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Looking unto Jesus: a View of the Everlasting Gospel</cite>, ... (London, 1680), bk. 4, ch. 1, section 5, p. 129</span></figcaption>

</figure><figure class="quote" id="q-ec7ec52a0c" data-kw="">
<blockquote><p>A part coming to a whole does not give esse [existence] to the whole, but receives it, because it is perfected by the form of the whole. For if it remained distinct, as before, it would not receive the esse of the whole, but would either have proper esse or none. But the human nature united to the Word is not informed by the Word, but remains simply distinct. Therefore it either has no esse [denied], or [a] proper [esse of its own, affirmed].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as trans. Richard Cross, Union &amp; Communion | p. 14, from Ord. III, d. 6, q. 1, n. 26 (Vatican ed., IX, 240)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

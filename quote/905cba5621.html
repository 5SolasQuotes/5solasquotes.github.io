<main class="wrap"><figure class="quote" id="q-905cba5621" data-kw="">
<blockquote><p>‘If,’ as the Brethren affirm, ‘provocations, both of an elder and later date, are to be testified against; and if,’ as they add, ‘this is necessary for the conviction and humiliation of all ranks, necessary to maintain and preserve the truths of God, and an useful mean to transmit them to the following generations in their purity,’ then I hope I shall be excused here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e16d53b188" data-kw="">
<blockquote><p>Testimonies for the Lord are necessary, lovely and singularly useful, when according to the rule: But, when these prescribed bounds are exceeded, and our misguided zeal for a pretended respect to the Lord’s honor hurries to a taxing the commissions of his choicest ambassadors, and trampling such as are eminently beautified with Christ’s image, who can tell how far this gangrene may reach? My heart trembles at the mischiefs which any one unsound and unsafe position does lead to, especially in matters of this nature; and have often admired the judicious observe of a great man, against whom our friends, especially the more exercised, are not much, if at all, prejudiced, viz. ‘He that sheds man’s blood, by man shall his blood be shed; but whoso sheds the blood of Churches, his blood shall be shed by the Lord.’ (These are said to be the words of Mr. Shepherd.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-834e490251" data-kw="">
<blockquote><p>Hamilton seems to have felt that the tyranny of the times called for more positive action on the part of those who adhered to the [non-conforming, field-preaching] Presbyterian cause, and he is said to have tried, during the summer of 1678, to stir up some of the people in the west into an armed rising against the government [previously the battles had all been defensive]. Whether this allegation is well-founded cannot conclusively be proved… Feelings on the subject [of the Indulgence] ran high, and Cameron and Hamilton were accused of spreading dissension and disunity among the people and of causing disaffection towards ministers who did not share their radical opinions.</p></blockquote>

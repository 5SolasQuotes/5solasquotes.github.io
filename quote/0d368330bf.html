<main class="wrap"><figure class="quote" id="q-0d368330bf" data-kw="">
<blockquote><p>In the churches, we know that there were many ἐπισκοποι (Acts 20:17, 28; Phil. 1:1), and this work of overseeing was specifically charged to the πρεσβυτεροι (Acts 20:17, 28; 1 Tim. 3:1–7; 5:17; Titus 1:5, 7; 1 Pet. 5:1–3). In line with this, Peter also calls himself an elder (πρεσβυτερος, 1 Pet. 5:1). Of a special institution of the episcopate alongside the presbyterate, accordingly, the New Testament knows nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 4</cite>, §502</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a> › <a href="../topics/church-government-and-the-ministry/offices/bishop-and-presbyter.html">Bishop and presbyter</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a> › <a href="../topics/church-government-and-the-ministry/forms-of-government/episcopal-presbyterian-congregational.html">Episcopal, presbyterian, congregational</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ecc71505d" data-kw="">
<blockquote><p>Discoursing of Bishops, and having described their character, and the qualities which they ought to possess, and having passed over the order of Presbyters, he proceeds to that of Deacons. The reason of this omission was, that between Presbyters and Bishops there was no great difference. Both had undertaken the office of Teachers and Presidents in the Church, and what he has said concerning Bishops is applicable to Presbyters. For they are only superior in having the power of ordination, and seem to have no other advantage over Presbyters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on First Timothy</cite>, hom. 11 (on 1 Tim. 3:8)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a> › <a href="../topics/church-government-and-the-ministry/offices/bishop-and-presbyter.html">Bishop and presbyter</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a> › <a href="../topics/church-government-and-the-ministry/offices/elders.html">Elders</a></span></div>
<div class="actions"><button class="copy" data-copy="“Discoursing of Bishops, and having described their character, and the qualities which they ought to possess, and having passed over the order of Presbyters, he proceeds to that of Deacons. The reason of this omission was, that between Presbyters and Bishops there was no great difference. Both had undertaken the office of Teachers and Presidents in the Church, and what he has said concerning Bishops is applicable to Presbyters. For they are only superior in having the power of ordination, and seem to have no other advantage over Presbyters.”

</figure><figure class="quote" id="q-6982e00e09" data-kw="">
<blockquote><p>Because bishop and presbyter are everywhere in Scripture taken for one and the same (so that the difference is only in the name, not in the thing—bishop, with regard to his office and function; presbyter, with regard to his age and dignity), the same characters and the same functions are ascribed to both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.21.6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a> › <a href="../topics/church-government-and-the-ministry/offices/bishop-and-presbyter.html">Bishop and presbyter</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a> › <a href="../topics/church-government-and-the-ministry/forms-of-government/episcopal-presbyterian-congregational.html">Episcopal, presbyterian, congregational</a></span></div>
<div class="actions"><button class="copy" data-copy="“Because bishop and presbyter are everywhere in Scripture taken for one and the same (so that the difference is only in the name, not in the thing—bishop, with regard to his office and function; presbyter, with regard to his age and dignity), the same characters and the same functions are ascribed to both.”

— Francis Turretin, Institutes of Elenctic Theology, 18.21.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBecause%20bishop%20and%20presbyter%20are%20everywhere%20in%20Scripture%20taken%20for%20one%20and%20the%20same%20%28so%20that%20the%20difference%20is%20only%20in%20the%20name%2C%20not%20in%20the%20thing%E2%80%94bishop%2C%20with%20regard%20to%20his%20office%20and%20function%3B%20presbyter%2C%20with%20regard%20to%20his%20age%20and%20dignity%29%2C%20the%20same%20characters%20and%20the%20same%20functions%20are%20ascribed%20to%20both.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2018.21.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6982e00e09.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6982e00e09.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-c937f8d010" data-kw="">
<blockquote><p>All, therefore, to whom the office of teaching was committed, they called presbyters, and in each city these presbyters selected one of their number to whom they gave the special title of bishop, lest, as usually happens, from equality dissension should arise. The bishop, however, was not so superior in honour and dignity as to have dominion over his colleagues, but as it belongs to a president in an assembly to bring matters before them, collect their opinions, take precedence of others in consulting, advising, exhorting, guide the whole procedure by his authority, and execute what is decreed by common consent, a bishop held the same office in a meeting of presbyters. And the ancients themselves confess that this practice was introduced by human arrangement, according to the exigency of the times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.4.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a> › <a href="../topics/church-government-and-the-ministry/offices/bishop-and-presbyter.html">Bishop and presbyter</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a> › <a href="../topics/church-government-and-the-ministry/forms-of-government/episcopal-presbyterian-congregational.html">Episcopal, presbyterian, congregational</a></span></div>
<div class="actions"><button class="copy" data-copy="“All, therefore, to whom the office of teaching was committed, they called presbyters, and in each city these presbyters selected one of their number to whom they gave the special title of bishop, lest, as usually happens, from equality dissension should arise. The bishop, however, was not so superior in honour and dignity as to have dominion over his colleagues, but as it belongs to a president in an assembly to bring matters before them, collect their opinions, take precedence of others in consulting, advising, exhorting, guide the whole procedure by his authority, and execute what is decreed by common consent, a bishop held the same office in a meeting of presbyters. And the ancients themselves confess that this practice was introduced by human arrangement, according to the exigency of the times.”

</figure><figure class="quote" id="q-0952bb77b3" data-kw="">
<blockquote><p>Those, however, who are believed to be presbyters by many, but serve their own lusts, and, do not place the fear of God supreme in their hearts, but conduct themselves with contempt towards others, and are puffed up with the pride of holding the chief seat, and work evil deeds in secret, saying, No man sees us, shall be convicted by the Word, who does not judge after outward appearance (secundum gloriam), nor looks upon the countenance, but the heart</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/irenaeus-of-lyons.html">Irenaeus of Lyons</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Heresies</cite>, 4.26.3</span></figcaption>

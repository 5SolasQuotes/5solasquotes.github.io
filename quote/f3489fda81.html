<main class="wrap"><figure class="quote" id="q-f3489fda81" data-kw="">
<blockquote><p>First, in the Creation; his essence and attributes are clearly revealed, his absolute power, unerring wisdom, and infinite goodness are discovered to every capacity; therefore the apostle urges this as the most proper argument to convince the heathens, Acts 14:15, ‘That they should turn from their vanities, to the living God which made heaven and earth, and sea, and all things that are therein.’ To this they must naturally assent, as shadows represent the figure of those bodies from whence they are derived; so in the world there are such traces of the divine perfections that it is easy to infer there is a Sovereign being which is the cause of it; all the creatures and their various excellencies are as so many beams which reflect upon this Sun, or lines which direct to this Center; nay, the meanest being carries some impression of the first cause, as the image of a prince is stamped upon a penny, as well as upon greater money; the beasts will instruct, and the mute fishes teach the atheist there is a God; and though he is not discerned by the outward sight, yet the understanding will as certainly discover him as it does an invisible spirit in a living body…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in The Morning Exercise Methodized… by several Ministers of the City of London… (London: E.M. for Ralph Smith, 1660), Sermon 2, ‘God is’, p. 31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-acc274196c" data-kw="Sanctification Holy Spirit">
<blockquote><p>True sanctification is the result of the soul&#x27;s union with the holy Jesus, the first and immediate receptacle of the sanctifying Spirit; out of whose fullness, his members do, by virtue of their union with him, receive sanctifying influences. The other is the mere product of the man&#x27;s own spirit, which, whatever it has, or seems to have, of the matter of true holiness—yet does not arise from the supernatural principles, nor to the high aims and ends thereof: for, as it comes from self, so it runs out into the dead sea of self again; and lies as wide of true holiness, as nature does of grace. They who have this species of holiness, are like common boatmen, who serve themselves with their own oars: whereas the ship bound for Immanuel&#x27;s land, sails by the blowings of the divine Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” V. Benefits: Sanctification</span></figcaption>

<blockquote><p>717. This work of faith in the sinner through the power of the Holy Spirit is described with various terms and is expressed to us with various parts such as calling, regeneration, sanctification, circumcision of the heart and purification.</p></blockquote>

</figure><figure class="quote" id="q-53c3a82b63" data-kw="">
<blockquote><p>Whether the infusion of grace is required for justification? It is distinguished. Whether some movement of free choice and faith is required? It is affirmed with a distinction. … Whether the infusion of grace is by order of nature first amongst those things which are required for justification? It is distinguished. … Whether inhering righteousness is the cause of justification? It is denied. … Whether the righteousness of the justified is inhering or imputed? The latter is affirmed contra the Papists. … Whether we deny all inherent righteousness? It is denied. … Whether sanctification or regeneration precedes justification, or the contrary? It is distinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, 9. ‘Justification’, Of Justification in General in Syllabus of Theological Problems (Utrecht, 1643), pt. 1, section 2, tract 3 Abbr.</span></figcaption>

</figure><figure class="quote" id="q-172d017354" data-kw="">
<blockquote><p>8. Likewise, every Christian should learn that this grace and this regeneration have not been given to us so that we might remain idle in that stage of our renewal which we at first obtained, but so that we may grow in everything into him who is the head. Therefore, the people must be taught to devote effort to this growth which indeed happens through good works, both internal and external, which are commanded and commended by God. To these works God has, in many passages from the Gospels, clearly and manifestly promised on account of Christ a reward – good things in this life, as much for the body as for the soul (as much as seems right to divine providence) and after this life in heaven. Therefore, although the inheritance of eternal life is due to the regenerate on account of the promise, as soon as they are reborn in Christ, nevertheless God also renders a reward to good works, not according to the substance of the works, nor because they come from us, but to the extent that they are performed in faith and proceed from the Holy Spirit, who dwells in us, free choice concurring as a partial agent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/colloquy-of-regensburg.html">Colloquy of Regensburg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anthony Lane, Justification by Faith in Catholic-Protestant Dialogue. An Evangelical Assessment</cite>, tr. Anthony Lane (London: 2002), Appendix 1, p. 236 This statement was agreed by both the Reformed and Romanist sides</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

<main class="wrap"><figure class="quote" id="q-7614f4a2ac" data-kw="">
<blockquote><p>‘In the beginning, God created the heavens and the earth.’ Astonishment at the thought checks my utterance. What shall I say first? Whence shall I begin my narration? Shall I refute the vanity of the heathens? Or shall I proclaim our truth? The wise men of the Greeks wrote many works about nature, but not one account among them remained unaltered and firmly established, for the later account always overthrew the preceding one. As a consequence, there is no need for us to refute their words; they avail mutually for their own undoing.

Those, in fact, who could not recognize God, did not concede that a rational cause was the author of the creation of the universe, but they drew their successive conclusions in a manner in keeping with their initial ignorance. For this reason some had recourse to material origins, referring the beginning of the universe to the elements of the world; and others imagined that the nature of visible things consisted of atoms and indivisible particles, of molecules and interstices; indeed, that, as the indivisible particles now united with each other and now separated, there were produced generations and deteriorations; and that the stronger union of the atoms of the more durable bodies was the cause of their permanence.

Truly, it is a spider’s web that these writers weave, who suggest such weak and unsubstantial beginnings of the heavens and earth and sea. It is because they did not know how to say: ‘In the beginning, God created the heavens and the earth.’ They were deceived by the godlessness present within them into thinking that the universe was without guide and without rule, as if borne around by chance. In order that we might not suffer this error, he who described the creation of the world immediately, in the very first words, enlightened our mind with the name of God, saying: ‘In the beginning God created.’ How beautiful an arrangement! He placed first ‘the beginning’ that no one might believe that it was without a beginning. Then he added the word, ‘created’ that it might be shown that what was made required a very small part of the power of the Creator.

In fact, as the potter, although he has formed innumerable vessels by the same art, has exhausted neither his art nor his power, so also the Creator of the universe, possessing creative power not commensurate with one world, but infinitely greater, by the weight of His will alone brought the mighty creations of the visible world into existence. If, then, the world has a beginning and was created, inquire: ‘Who is He that gave it the beginning, and who is the Creator?’

Rather, lest in seeking through human reasoning you might perhaps turn aside from the truth, Moses has taught us beforehand, imprinting upon our hearts as a seal and a security, the highly honoured name of God, saying; In the beginning God created. The blessed Nature, the bounteous Goodness, the Beloved of all who are endowed with reason, the much desired Beauty, the Origin of things created, the Fount of life, the spiritual Light, the inaccessible Wisdom, He is the One who in the beginning created the heavens and the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-basil.html">Basil of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Hexaemeron</cite>, (379), 1.1 in Saint Basil’s Exegetic Homilies, trans. Agnes Clare Way in The Fathers of the Church: A New Translation, Volume 46 (Washington DC, 1963), pp 5-6.</span></figcaption>

<blockquote><p>In like sort we may imagine time before the world; for who doubts but that it was possible that time should have been sooner than it was and wh•s it is now about six thousand years since the world began; so if it had pleased God, it might have been 10 thousand. But do not you infer here hence that we do imagine infinite time preceding the world; for that is not held to be possible as finite time is.</p></blockquote>

</figure><figure class="quote" id="q-b5df3ae534" data-kw="">
<blockquote><p>Q. DId God create the world at the same instant, or in the space of six days? A. In the space of six days: First, because Moses’ narration is historical, and therefore he speaks of six distinct days. Secondly, Moses, Ex. 20 &amp; 31, urges the Jews to work six days and rest the seventh, because God created the world in six days and rested the seventh; this reason had been ridiculous if God had made the world in an instant. Thirdly, if we understand Moses in this place allegorically, then we must make this whole history an allegory. Fourthly, if the seventh day had been the first (and in it God had created the world), then how is it understood that God rested the seventh day? Fiftly, how could so many diverse kinds of creatures be created in the same instant of time? yea, then we must say that man was created and brought into Paradise and was cast asleep, and Eve was formed of his rib the same instant. Q. How then is that understood, Ecclesiasticus 18 [v. 1], ‘He that lives forever, created all things together’? A. It is to be understood of that confused mass that God created in the beginning: out of the which afterward He created the rest of the creatures in their distinct days. Q. Why did God spend so much time in making the world? A. Not because He was weak and could not make it in less time, but that we might the more seriously consider the order of the creation, distinction and replenishing of the world; and in these, the omnipotency, wisdom and goodness of God.</p></blockquote>

<blockquote><p>But that this world should be made at such a time, and at first of no pre-existent matter, and in the space of six days, and in that order one part after another, and by the Word of God as the sole efficient, and so many years ago, is far above reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-lawson.html">George Lawson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, … (London: J.S., 1662), ch. 11, p. 249</span></figcaption>

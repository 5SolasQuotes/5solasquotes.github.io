<main class="wrap"><figure class="quote" id="q-98ebf40a4f" data-kw="">
<blockquote><p>In reference to grateful love, nothing so much tends to fill the heart with this emotion as the believing realization of Christ’s redemption work—nothing so melts the heart; and no purer love to God can be imbibed. … There is no motive to a holy life so powerful and efficacious as that which is drawn from the propitiatory work of Christ, who, after meeting the demands of the law and bearing its curse, makes that same law a rule to direct our steps; and Christians learn to take it from the Mediator’s hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Atonement as Taught by Christ Himself</cite>, ch. 8, sec. 52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/love.html">Love</a> › <a href="../topics/the-christian-life/love/toward-christ.html">Toward Christ</a></span><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/sacrifice-and-propitiation.html">Sacrifice and Propitiation</a> › <a href="../topics/priestly-office-satisfaction-and-atonement/sacrifice-and-propitiation/redemption.html">Redemption</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f5854b023c" data-kw="">
<blockquote><p>God is love; Christ is God; therefore Christ is love, love naturally. Love therefore is essential to His being. He may as well cease to be, as cease to love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Knowledge of Christ’s Love</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a> › <a href="../topics/attributes-of-god/goodness-love-and-mercy/benevolence.html">Benevolence</a></span><span class="t"><a href="../topics/the-person-of-christ/deity-of-christ.html">Deity of Christ</a> › <a href="../topics/the-person-of-christ/deity-of-christ/proofs-of-his-divinity.html">Proofs of his divinity</a></span></div>
<div class="actions"><button class="copy" data-copy="“God is love; Christ is God; therefore Christ is love, love naturally. Love therefore is essential to His being. He may as well cease to be, as cease to love.”

</figure><figure class="quote" id="q-c1d6fb7e15" data-kw="">
<blockquote><p>Hence it follows, that none does, or can love like Christ: His love to man is matchless. The freeness, strength, antiquity, and immutability of it, puts a luster on it beyond all examples. Surely it was a strong love indeed, that made him lay aside his glory, to be found in fashion as a man, to become anything, though never so much below himself, for our salvation. … His love, like himself, is wonderful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fountain of Life</cite>, sermon 18, “The Necessity of Christ’s Humiliation … by Incarnation”</span></figcaption>

</figure><figure class="quote" id="q-a3dfdd8439" data-kw="">
<blockquote><p>That the eternal word, for the salvation of sinners, should come down from heaven and be made flesh, is an act of such condescension, a discovery of such love, that can never to the full be found out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Knowledge of Christ’s Love</cite></span></figcaption>

</figure><figure class="quote" id="q-85b10e50c5" data-kw="">
<blockquote><p>A soule acquainted with the Gospell, knowes that there is no Property of Christ rendred more glorious therein, than that of his patience; That he should beare with so many unkindnesses, so many causelesse breaches, so many neglects of his love, so many affronts done to his Grace, so many violations of ingagements, as he doth; it manifests his Gospell to be not only the word of his Grace, but also of his patience. He suffers also from them, in all the reproaches, they bring upon his name and wayes: and he suffers in them; for in all their Afflictions, he is afflicted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Temptation</cite>, Oxford, 1658, ch. 8, p. 145</span></figcaption>

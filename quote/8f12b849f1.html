<main class="wrap"><figure class="quote" id="q-8f12b849f1" data-kw="">
<blockquote><p>In the eternal counsel of God… this ransom was not destined for any other than those who believe… that is, those whom the Son of God makes believers.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bab3a2fca6" data-kw="">
<blockquote><p>XXIX. Therefore the end of satisfaction, to whom, or the object, is solely the elect and true believers of both the Old and New Testament. For although it could extend itself to all men with respect to the greatness, dignity, and sufficiency of the price considered in itself, nevertheless it was particularly expended for those whom the Father elected and gave to the Son, and who by God’s gift would believe in God and His Son. Whence Scripture repeatedly says that He gave Himself for His own, and for us, for the sheep, and for the Church. Mt. 20:7, 28 and 26 [i.e. Mt. 26:28]; 1 Jn. 3:16; Acts 20:28, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-thysius.html">Antonius Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On the Satisfaction of Jesus Christ’ in Synopsis of Pure Theology</cite>, (1625), trans. AI at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-7e77844b8c" data-kw="">
<blockquote><p>How could he die, if he were not a reputed sinner? Had he not first had a relation to our sin, he could not in justice have undergone our punishment. He must in the order of justice be supposed a sinner really, or by imputation; really he was not, by imputation then he was.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, 4.532</span></figcaption>

</figure><figure class="quote" id="q-df67b8b58e" data-kw="">
<blockquote><p>XXX. Liberation from this guilt and its exercise was never promised to all and every mortal, nor offered, nor conferred; and in paradise itself there was immediately distinguished the seed of the woman and of the serpent, partly in the first promise, partly in its manifestation in the house of Adam, in which God began the distinction observed through all ages. XXXI. The Liberator, and Depulsor partly of adhering guilt, partly of inhering corruption, is the one Christ Son of God, destined from eternity to all the elect and to them alone, promised from the fall, afterward prefigured by types partly personal, partly real, finally exhibited, and to the same partly applied, partly to be applied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“XXX. Liberation from this guilt and its exercise was never promised to all and every mortal, nor offered, nor conferred; and in paradise itself there was immediately distinguished the seed of the woman and of the serpent, partly in the first promise, partly in its manifestation in the house of Adam, in which God began the distinction observed through all ages. XXXI. The Liberator, and Depulsor partly of adhering guilt, partly of inhering corruption, is the one Christ Son of God, destined from eternity to all the elect and to them alone, promised from the fall, afterward prefigured by types partly personal, partly real, finally exhibited, and to the same partly applied, partly to be applied.”

— Friedrich Spanheim, ‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXX.+Liberation+from+this+guilt+and+its+exercise+was+never+promised+to+all+and+every+mortal%2C+nor+offered%2C+nor+conferred%3B+and+in+paradise+itself+there+was+immediately+distinguished+the+seed+of+the+woman+and+of+the+serpent%2C+partly+in+the+first+promise%2C+partly+in+its+manifestation+in+the+house+of+Adam%2C+in+which+God+began+the+distinction+observed+through+all+ages.+XXXI.+The+Liberator%2C+and+Depulsor+partly+of+adhering+guilt%2C+partly+of+inhering+corruption%2C+is+the+one+Christ+Son+of+God%2C+destined+from+eternity+to+all+the+elect+and+to+them+alone%2C+promised+from+the+fall%2C+afterward+prefigured+by+types+partly+personal%2C+partly+real%2C+finally+exhibited%2C+and+to+the+same+partly+applied%2C+partly+to+be+applied.%E2%80%9D%0A%0A%E2%80%94+Friedrich+Spanheim%2C+%E2%80%98Miscellaneous+Theological+Disputation+exhibiting+a+Theological+Compendium%E2%80%99+in+Disputationum+Theologicarum+Miscellaneorum+Pars+Prima+%28d.+1649%3B+Geneva%3A+Chou%C3%ABt%2C+1652%29%2C+trans.+AI+by+Roman+Prestarri+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdf67b8b58e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/df67b8b58e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/limited-atonement/#:~:text=XXX.%20Liberation%20from%20this%20guilt%20and,partly%20applied%2C%20partly%20to%20be%20applied&amp;text=XXX.%20Liberation%20from%20this%20guilt%20and%20its%20exercise&amp;text=the%20same%20partly%20applied%2C%20partly%20to%20be%20applied" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-87e64bbc95" data-kw="">
<blockquote><p>An intention or a conscious goal is that which an agent aims to accomplish and the means are that which is used for attaining the intention. When the agent acts according to its nature, then the end of the action and the end of the agent is one and the same. But when the means are not fitted for the intentional end, then a distinction must be inferred between the end of the action and the end of the agent; between the intention and the intender. Now, the doctrine of divine simplicity implies that in God intention and Intender—act and Agent—cannot be other than one and the same. In humans intention and intender—acts and agents—may not be one and the same. In God the means for attaining the salvation of the elect are not, indeed cannot, be disproportionate to that end. There cannot be conditions—conditional redemption—to God. For according to the doctrine of divine simplicity, each thing is related to God, but God is not (reciprocally) related to anything. Yet, universalism anthropomorphically pictures God as using means that are not proportionate to the end and assumes that there is one intention in some salvific act and another intention in some other salvific act. Particularism upholds the doctrine of simplicity and consistently maintains the otherness of God in intending to save humans in Christ. Every salvific action of God is particular in intention, since in God intention and Intender cannot be other than one and the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sebastian-rehnman.html">Sebastian Rehnman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Particular Defence of Particularism’ Journal of Reformed Theology</cite>, vol. 6, issue 1 (2012), pp. 24–34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

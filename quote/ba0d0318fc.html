<main class="wrap"><figure class="quote" id="q-ba0d0318fc" data-kw="">
<blockquote><p>…every pious person is bound in duty to his conscience to have privately his daily devotional exercises, still on this [Lord’s] day above others a holy convocation ought to take place (as was the custom on the Sabbath, Lev. 23:3) in which there may be leisure for devout attention to the reading and hearing of the Word (Heb. 10:25), the celebration of the sacraments (Acts 20:7), the psalms and prayer (Col. 3:16; Acts 1:14), to alms and helo to the poor (1 Cor. 16:2) and in general to all that sacred service pertaining to external and stated worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (d. 1687), vol. 2, Eleventh Topic, Question 14, ‘The Lord’s Day, p. 99</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ada1c8474e" data-kw="">
<blockquote><p>The matter is here three ways to be considered: First, in the ground, foundation, or authority of the Psalms we use, viz. they must be the word of Christ, that is contained in the Scriptures. Secondly in the kinds of Psalms, there are many sort of Psalms in Scripture. The Psalms of Moses, David, Solomon, and other prophets: but all are here referred to three heads; they are either Psalms, specially so called, or hymns, or songs. Great ado there is among interpreters to find a difference in these: some would have Psalms to be the songs of men, and Hymns of angels: some think they differ, especially in the manner of music. Some are sung by voice, some played upon instruments; but the plausiblest opinion is not to distinguish them by the persons that use them, or by the kind of music, but by the matter, and so they say Psalms contain exhortation to manners or holy life. Hymns contain praises to God in the commemoration of his benefits. Songs contain doctrine of the chief good, or man’s eternal felicity. But I think there needs not any curious distinction: it may suffice us that there is variety of Psalms in Scripture and God allows us the use of every kind. Thirdly, the property of the Psalms, they are Spiritual, both because they are indited by the spirit, and because they make us more spiritual in the due use of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition Upon the Epistle to the Colossians</cite>, (London, 1615), commentary on ch. 3, v. 16, p. 101</span></figcaption>

</figure><figure class="quote" id="q-b5fd610e77" data-kw="">
<blockquote><p>And when the Scripture assures us that it was their practice to use Psalms and Hymns, and spiritual songs, praising God and praying unto Him in the words of David… And when we all account it our duty to praise God in singing David’s Psalms, some of which, as we use them [in the psalters they had], are of a mean composure and carry expressions beneath the majesty of Scripture; others, such as concerned the Jewish Church only; why ought not the apostles, and we as necessarily, to use this form of prayer sanctified by our Savior’s own lips?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-long.html">Thomas Long</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation Concerning the Frequent Use of our Lord’s Prayer</cite>, [John] Owen concerning that subject (London, 1658), p. 42-3</span></figcaption>

</figure><figure class="quote" id="q-f81fff8cf4" data-kw="">
<blockquote><p>[The Objection of Quakers:] But our Psalms are not the same in meter, nor the same tunes which the Jews had. [Answer:] That seeing the singing of Psalms is a duty commanded, and amongst others, those of David, and has hid from us the Hebrew tunes, wherewith the Psalms of David were wont to be sung, it must needs follow that the Lord has left it to the liberty of the Church to sing them in such plain, grave tunes as may fit the solemnity of God’s worship, and that because that tunes are but circumstantial and not the substance; and the Church now in the days of the Gospel is not in her minority or young age, but in her man-age, or full grown age, as the apostle speaketh (Gal. 4:1-6), and therefore fitter to appoint circumstantial things in God’s worship than the Jews, being in their non-age.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gaskin.html">John Gaskin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Just Defence &amp; Vindication of Gospel Ministers &amp; Gospel Ordinances Against the Quakers’ many False Accusations, Slanders &amp; Reproaches. In answer to John Horwood, his Letter, &amp; E.B. his Book</cite>, … (London, 1660), pp. 86-87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

e" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>(2) His Special Mediatory Kingdom over his Church and People, Christ administreth and executeth principally by these and such like kingly actions, viz. I. In this present world. 3. By instituting his New-Covenant ordinances which are to be managed and administered by these his officers. As, Preaching the Gospel to all Nations… Public praises and singing of Psalms, etc. Jam. 5:13; Col. 3:16; Heb. 13:15; Eph. 5:18-20.</p></blockquote>

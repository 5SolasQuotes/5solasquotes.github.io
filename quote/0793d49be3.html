<main class="wrap"><figure class="quote" id="q-0793d49be3" data-kw="">
<blockquote><p>The question is whether the reading should be forbidden to anyone (which we deny). … (3) The Scriptures are the Testament of our heavenly father, and should a child be forbidden to read the will of his father? … Is it not sufficient that the reading of the Scriptures is allowed by the papists to some? For that ought not to be granted to some as a privilege which is enjoined upon all as a duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.18.3–4, 9</span></figcaption>

<blockquote><p>Biblicism is one thing &amp; sola Scriptura is another. Biblicism is rationalist &amp; irrationalist but sola Scriptura is not. If you&#x27;re not reading the Scriptures with the church and in the communion of the saints you&#x27;re not following Sola scriptura and the confessional Protestants.</p></blockquote>

— R. Scott Clark, Post on X (@Heidelblog01), Oct 27, 2023">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBiblicism+is+one+thing+%26+sola+Scriptura+is+another.+Biblicism+is+rationalist+%26+irrationalist+but+sola+Scriptura+is+not.+If+you%27re+not+reading+the+Scriptures+with+the+church+and+in+the+communion+of+the+saints+you%27re+not+following+Sola+scriptura+and+the+confessional+Protestants.%E2%80%9D%0A%0A%E2%80%94+R.+Scott+Clark%2C+Post+on+X+%28%40Heidelblog01%29%2C+Oct+27%2C+2023&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F56a4cd9a83.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/56a4cd9a83.html">Permalink</a><a class="src" href="https://x.com/Heidelblog01/status/1718039987390648590" rel="noopener" target="_blank">Read it online · X</a></div>
</figure><figure class="quote" id="q-ea02d03b91" data-kw="">
<blockquote><p>The other, then, is the external judgment; by which, we judge, to the greatest certainty, of the spirits and doctrines of all men; not for ourselves only, but for others also, and for their salvation. This judgment is peculiar to the public ministry of the Word and the external office, and especially belongs to teachers and preachers of the Word. Of this we make use, when we strengthen the weak in faith, and when we refute adversaries.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bondage of the Will</cite>, sect. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><figure class="quote" id="q-7469950696" data-kw="">
<blockquote><p>Now we determine that the supreme right, authority, and judgment of interpreting the scriptures, is lodged with the Holy Ghost and the scripture itself: for these two are not mutually repugnant. We say that the Holy Spirit is the supreme interpreter of scripture, because we must be illuminated by the Holy Spirit to be certainly persuaded of the true sense of scripture; otherwise, although we use all means, we can never attain to that full assurance which resides in the minds of the faithful. … As to external persuasion, we say that scripture itself is its own interpreter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Controversy 1, Q. 5, ch. 3 (p. 415)</span></figcaption>

</figure><figure class="quote" id="q-88c9aedd8b" data-kw="">

<main class="wrap"><figure class="quote" id="q-27fdd8bb2e" data-kw="">
<blockquote><p>Those who hold Church government to be of divine right may feel uneasy in calling it positive. Rutherford, who wrote The Book on the subject, The Divine Right of Church Government (1646), did not. One reason why Church government is positive is because it is a special arrangement that does not simply inhere in or derive from nature; rather, it has been appointed in special revelation by the will of Christ about redemption. It is also political, in the sense of binding men in society. Church government could be otherwise (if Christ had so appointed); however the specific form of it, namely classical presbyterianism, is the particular form that Christ has chosen and instituted as the Mediatorial King of the Church, his Kingdom. The form of the government binds not from the nature of it (though it is in accord with the light of nature), but from Christ’s authority alone. Church government was different in the Old Testament, and had changed, developed and progressed numerous times therein. To say that New Testament Church government is positive does not mean that there is not any continuity between it and the Church government of the Old Testament; there is. But there is also not a direct one-to-one correlation between the two either, which some persons find perplexing. On the one hand, as these positive laws of Church government are binding as they are positive (just as the Mosaic ceremonial laws were binding to the Old Testament Church as they were positive), so under the normal circumstances of the Church in the course of history, every last spiritually prescribed detail (however minute) of Biblical, classical presbyterianism is binding by the authority and honor of Christ, the Church’s Lord. However, on the other hand, it is also because the laws of Church government are positive, and as moral obligations (in necessity) override positive ones, that alterations in the regular government of the Church, grounded in natural principles, may, and should, legitimately occur in extraordinary and necessary circumstances (as the Bible and historic presbyterianism teach). Because human, Church government is positive, according to the needs and circumstances of the Church in this age, it will greatly change and fall away with the renovation of all things in the Age to Come, when no teachers will be needed, as we will be beholding God face to face, immediately (Jer. 31:33-34; 1 Cor. 15:28).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Introduction’ to On Positive Laws &amp; Ordinances, &amp; the Law of Nations</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-22e2ddb815" data-kw="">
<blockquote><p>The covenanters are often considered to have been unrelenting opponents of episcopacy. In the Glasgow Assembly of 1638, when nearly all covenanters voted to ‘remove and abjure’ episcopacy in the kirk, the Glaswegian minister Robert Baillie was the sole named dissenter. Baillie’s subsequent conformity to the covenanting regime after 1638 and his ultimate acceptance of the restored episcopate after 1661 have led historians to claim that he was pliantly obeying those in power. In order to offer an alternative explanation, this article explores the contours of Baillie’s writings on episcopacy in the periods 1637-9 and 1658-62. His views were informed by hatred of the Laudian episcopate and his belief that Scripture described a lawful form of episcopacy similar to the superintendents of the post-Reformation kirk. Whilst Baillie protested against the restored episcopate in 1661, the reasons for his subsequent submission suggest one explanation as to why many presbyterian ministers acquiesced in Charles II’s Erastian kirk settlement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-campbell.html">Alexander Campbell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Episcopacy in the Mind of Robert Baillie</cite>, 1637-1662’ The Scottish Historical Review, vol. 93, no. 236, pt. 1 (April 2014), pp. 29-55 | Abstract:</span></figcaption>

</figure><figure class="quote" id="q-2f510999af" data-kw="">
<blockquote><p>That such inconveniencie may be shunned, it is fit that when any change is to be made in the policy of a Church, not the clergy alone, but the elders also, and men of understanding among the layity, in a lawfull assembly, freely give their voices and consent thereunto. Good reason have our writers to hold against Papists, that laymen ought to have place in councils, wherein things which concern the whole Church are to be deliberated upon.</p></blockquote>

</figure><figure class="quote" id="q-73ce228bfb" data-kw="">
<blockquote><p>It is one of the greatest objections against the suppressing… of… errors and schisms, ‘O,’ say they, ‘this is a persecuting of those that are godly; this is a wound to piety, and the power of godliness.’ I do not deny but there may be, and is, true piety in many who are somewhat infected with the leaven of false doctrine, and live in some erroneous opinion… Those that are truly godly may in diverse things differ in opinion. Every error is not inconsistent with holiness, yet every error doth pro tanto [by so much], and proportionably retard, hinder, and prejudge holiness; and although the devil sow his tares among Christ’s wheat (I mean in the same persons as well as in the same church), yet who will say that a field of wheat is nothing the worse for the tares?… And this I hold as a good rule in practical divinity… so error of judgment, if continued in, doth not only hinder growing, but makes a dangerous decreasing and falling short in true piety… It is to be observed that sometimes the Scripture speaks of an error of the judgment concerning the faith as a fountain and cause of ungodliness, profaneness… 2 Tim. 2:16-19; Gal. 5:4; 2 Jn. 9; as contrariwise, there is a light and knowledge which preserves from sin and ungodliness, and leads the soul in ways of holiness and obedience, Ps. 9:10; 119:33-34; Jn. 17:17. If the knowledge of God, of his Christ, and of his Word, and will, and name and statutes, preserve us from sin, and lead us in the ways of obedience, then, by the rule of contraries, error of judgment in these things will ensnare us in sin and wickedness.</p></blockquote>

<blockquote><p>When subsequently one presbyter was chosen to preside over the rest, this was done to remedy schism and to prevent each individual from rending the church of Christ by drawing it to himself. For even at Alexandria from the time of Mark the Evangelist until the episcopates of Heraclas and Dionysius the presbyters always named as bishop one of their own number chosen by themselves and set in a more exalted position, just as an army elects a general, or as deacons appoint one of themselves whom they know to be diligent and call him archdeacon. For what function, excepting ordination, belongs to a bishop that does not also belong to a presbyter?</p></blockquote>

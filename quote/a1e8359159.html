<main class="wrap"><figure class="quote" id="q-a1e8359159" data-kw="">
<blockquote><p>In the Reformed view, both Catholic Counter-Reformation (L. Molina) and Remonstrant theology (Arminius) had modified this ‘will-based-theology’ [of Augustine and the Reformed] by their adaptation of middle knowledge (scientia media), resulting in a ‘knowledge-based-theology’ in which there is no room for real contingency (Maccovius 1641b, 103-4; Bac 2010). For Maccovius and most of seventeenth-century Reformed theologians, the main problem of the concept of middle knowledge is that it undermines the fundamental distinction between Creator and creature. Middle knowledge, used to describe a category of divine knowledge structurally or logically antecedent to God’s will, implies a necessity of the objects of divine knowledge (Maccovius 1641a, 25-26). Because middle knowledge postulates objects extra Deum [outside God] that precede his will, a logical contradiction is involved: objects outside God always presuppose the divine will. Finally. if God’s middle knowledge also contains his decree, then this would imply that it is impossible for God to choose an alternative (Maccovius 1641a, 25). Middle knowledge, then, approximates Stoic fate (fatum Stoicum), a natural or absolute necessity so inherent in the essential nature of things that even God is made dependent, like Homer’s Jupiter [who was constrained by nature] (Maccovius 1641b, 253).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/willem-van-asselt.html">Willem van Asselt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Christ, Predestination, and Covenant in Post-Reformation Reformed Theology’, 2. ‘Predestination…’, pp. 218-9 in eds. Lehner, Muller, Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-940c6385f9" data-kw="Affliction Wisdom">
<blockquote><p>It is the discipline of wisdom. He who administers it is the &quot;God only wise.&quot; What deep wisdom then must there be in all His dealings! He knows exactly what we need and how to supply it. He knows what evils are to be found in us, and how these may be best removed. His training is no random work. It is carried on with exquisite skill. The time and the way and the instrument are all according to the perfect wisdom of God. The fittest time is chosen, just the very moment when discipline is called for, and when it would be most profitable. The surest, most direct, and at the same time gentlest method is devised. The instrument which will be surest yet safest, most effectual yet least painful, is brought into operation. For all is wisdom in the discipline of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Night of Weeping</cite>, ch. IV, “The Family Discipline,”</span></figcaption>

</figure><figure class="quote" id="q-7399b051a7" data-kw="">
<blockquote><p>Of course, some Reformed teachers, e.g., Gomarus, Walaeus, Ludwig Crocius, assumed a ‘conditioned or middle knowledge’ on God’s part which was related to a ‘conditional proposition as to its object’ (as Heidegger Corp. Theol. III, 22 remarks) ‘in respect of bad actions, in which divine providence concurs not effectively but permissively and on the supposition of a conditional or permissive decree’. Alsted too (97) says that ‘there is a middle knowledge, by which He knows that if this exists that will exist.’ For the rest the distinction of a scientia media was decisively rejected by all dogmaticians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, ed. Ernst Bizer (1950; Eugene, OR: Wipf &amp; Stock, 2007), ch. 5, ‘The Attributes of God’, sect. 17</cite>, p. 79</span></figcaption>

</figure><figure class="quote" id="q-75b8794a35" data-kw="">
<blockquote><p>§CCCXXII. God, in knowing Himself, also knows whatever involves no contradiction, that is, what is possible in itself; for that is called possible which involves no contradiction. §CCCXXIII. Things are therefore possible because God represents to Himself in His intellect that they involve no contradiction; consequently, something is possible because God represents it to Himself in His intellect as such. §CCCXXIV. Hence it is evident that all possibility of things is from God, and that His intellect is the fountain or root of all possibility.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-f-stapfer.html">Johann F. Stapfer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Attributes Dependent upon the Divine Intellect [on God as the Source of Possibility]’ in Universal Institutes of Polemical Theology, vol. 1 4th ed. (1757), section 3, propositions 321-70, pp. 78-90 trans. AI at Reformed Sources Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><figure class="quote" id="q-50619c436b" data-kw="">
<blockquote><p>Then said David, O Lord God of Israel, thy servant hath certainly heard that Saul seeketh to come to Keilah, to destroy the city for my sake. Will the men of Keilah deliver me up into his hand? will Saul come down, as thy servant hath heard?… And the Lord said, He will come down. Then said David, Will the men of Keilah deliver me and my men into the hand of Saul? And the Lord said, They will deliver thee up. Then David and his men, which were about six hundred, arose and departed out of Keilah, and went whithersoever they could go. And it was told Saul that David was escaped from Keilah; and he forbare to go forth. And David abode in the wilderness in strong holds, and remained in a mountain in the wilderness of Ziph. And Saul sought him every day, but God delivered him not into his hand.</p></blockquote>

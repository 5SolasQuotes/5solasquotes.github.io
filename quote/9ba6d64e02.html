<main class="wrap"><figure class="quote" id="q-9ba6d64e02" data-kw="">
<blockquote><p>3. That God required not moral preparation in them for eating the Passover as he does in us before we eat the Lord’s Supper [as the congregationalists claimed], I conceive to be an untruth. 1. Because not to profane the holy things of God, and not to take God’s Law in their mouth and to hate to be reformed, Ps. 50:16, not to sacrifice with bloody hands, Isa. 1:11-12, etc. Ps. 50:8-10; Isa. 66:1, was moral, and did bind and oblige the Jews as they do us, and 2 Chron. 30:6, the posts are sent to gather the people to the Passover, charging them to turn to the Lord God of their fathers, not to be like their fathers; and it is clear by Hezekiah’s prayer, verses 18-19, ‘Good Lord pardon him that prepares his heart to seek the Lord God of his fathers, though he be not cleansed according to the purification of the sanctuary,’ verse 20, ‘And the Lord hearkened, and healed the people.’ Therefore, there was required a preparation of the heart for the right eating of the Passover, besides the typical and ceremonial preparation. Yea God counted the ceremonial preparation void of the moral preparation but abomination, as Isa. 66:1; Isa. 58:3-6 and Josiah’s Passover is commended from this, 2 Kings 23:22 (as Junius well observes) that none did with such care and zeal, as Josiah did prepare the priests, the people and himself for the passover, in removing all idolatry and abomination, and in renewing their covenant and resolution, verse 3, ‘to walk after the Lord and to keep his commandments with all their heart and with all their soul.’ 4. The unclean and uncircumcised in heart were no more members of the true and invisible Church of the Jews, and of Christ’s mystical body, his spouse, his royal generation, than Sodom and Gomorrah, Isa. 1:10, than the Ethiopians, Amos 9:7, than Ammon and Moah, Jer. 9:25-26, as in the New Testament, and the true invisible Church amongst them, as amongst us were kings and priests unto God, Ex. 19:5,9; Ps. 149:1, as we are, 1 Pet. 2:9-10; Rev. 1:5. 5. Amongst them no man could invade the priest’s office, or run unsent, no more than under the New Testament, Heb. 5:4; 1 Tim. 4:22, though they were to rebuke one another, Lev. 19, and they had sacrifices for sins of ignorance, Lev. 4:27… And a third step was excommunication and casting out of the synagogue after the captivity, which are the very degrees of our Church censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 2, pp. 190-91</span></figcaption>

<blockquote><p>…he takes from this ground that when two duties commanded of God do meet in one practice, so as we can not do them both, in this case we must performe the greatter duty and neglect the lesser. Now, whereas he says when two duties do meet, etc., he means not that both may be duties at once, for then a man shall be so straitened that he must needs commit a sin, in that he must needs omit one of the duties. But (as he explains himself) he calls them duties being considered apart: as to hear a sermon at the Church on the Sabbath, and to tend a sick person ready to die at home at the same time; both are duties being considered apart, but meeting together in our practice at one time, there is but one duty, because the lesser work binds not for that present.</p></blockquote>

</figure><figure class="quote" id="q-0aad91c5a6" data-kw="">
<blockquote><p>For the manner of their [Independents’] celebration, they who have seen it profess it to be in a very dead and comfortless way: it is not as in New England, once in the month, but as at Amsterdam, once every Lord’s Day, which makes the action much less solemn than in any other of the Reformed Churches, and in this too much like the daily masses of the Church of Rome. They have no preparation of their flock before: they are so happy as to have all their members prepared always sufficiently for the Lord’s Table, from their first entrance into their Church to their dying day; for all this time there is no catechizing among them; this exercise is below their condition and altogether needless in any of their congregations. They will have no sermon in the week before, nor so much as any warning [fore-notice] of the Communion. This practice of New England, to give warning the Sabbath before, is disliked now at London: nor must there be any sermon of thanksgiving after that sacrament: They use not so much as a little application of the doctrine in the sermon before it to that occasion. When they come to the action, there is no more but one little discourse and one short prayer of the minister; all the time of the participation, there is nothing in the congregation but a dumb silence: no reading, no exhortation, no psalms; their people need no such means to furnish them in their sacramental meditations;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, (1645), ch. 6, p. 121</span></figcaption>

<div class="actions"><button class="copy" data-copy="“For the manner of their [Independents’] celebration, they who have seen it profess it to be in a very dead and comfortless way: it is not as in New England, once in the month, but as at Amsterdam, once every Lord’s Day, which makes the action much less solemn than in any other of the Reformed Churches, and in this too much like the daily masses of the Church of Rome. They have no preparation of their flock before: they are so happy as to have all their members prepared always sufficiently for the Lord’s Table, from their first entrance into their Church to their dying day; for all this time there is no catechizing among them; this exercise is below their condition and altogether needless in any of their congregations. They will have no sermon in the week before, nor so much as any warning [fore-notice] of the Communion. This practice of New England, to give warning the Sabbath before, is disliked now at London: nor must there be any sermon of thanksgiving after that sacrament: They use not so much as a little application of the doctrine in the sermon before it to that occasion. When they come to the action, there is no more but one little discourse and one short prayer of the minister; all the time of the participation, there is nothing in the congregation but a dumb silence: no reading, no exhortation, no psalms; their people need no such means to furnish them in their sacramental meditations;”

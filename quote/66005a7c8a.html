<main class="wrap"><figure class="quote" id="q-66005a7c8a" data-kw="">
<blockquote><p>Edward Bagshaw, p. 18: ‘His own free-will has not the least power to receive the things of God.’ Richard Baxter: 1. What not sanctified free-will? 2. What! not a receiving obediential power? A receiving power is a passive power (as it is strictly taken). Has a free-agent less power to receive grace than a marble to receive the engraving of the workman? Does no man ever receive grace? Or do they receive what they cannot receive? Has a man no more receptive power than a block or stone? I know it’s said ‘The natural man receiveth not, etc.’, that is, understands not, believes not, and loves not in sensu composito [in a combined sense]: But its never said that, ‘Our free-will has not the least power to receive.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw… (London: Simmons, 1671), section 56</cite>, pp. 139-40</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-c638ea261e" data-kw="">
<blockquote><p>We acknowledge that free will, well understood, so pertains to the nature of man, and is so proper to it, that if it were plainly taken away, the essence of man could no more be retained than if reason, to which it pertains, were taken away.</p></blockquote>

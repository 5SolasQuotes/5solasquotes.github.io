<main class="wrap"><figure class="quote" id="q-6606e8512b" data-kw="">
<blockquote><p>17th Question: Whether for the sake of greater purity and integrity, one should move from one Church to another even without the consent of the Church being left? Answer: 1st Conclusion: If the Churches into whose communion one moves were previously gathered or constituted in greater purity and integrity of doctrine and rites, either before corruption or even after corruption, whether initiated or established, in the same place, city, field, or district, I see no reason why explicit and external communion with the Church in which one has hitherto lived cannot be desired towards better and more perfect things. Thus in Belgium, Lutherans moving from their Churches to ours are welcomed with goodwill; although our people are not unaware that Lutherans do not approve of them leaving. 2nd Conclusion: The situation is different if someone had made a separation from Lutheran Churches and ours, especially ones not yet established, before the [Lutheran] Book of Concord [1580, which was separatistic] and devised new and separate Churches: then I would not wish anyone to be the author of a division, against the common consensus and protestation of the reforming theologians (about which see Sacramentary History of Hofmann). 1. Because at that time there was a distrust of doctrine, confined to one article concerning the presence of the body in the Supper… according to the declaration of both parties in the Marburg Colloquy of 1529. 2. Because the ubiquity [of Christ’s human nature] with appendices, and conditional predestination, along with the true, final apostasy of the faithful, were not commonly accepted then [by the Lutherans], let alone elevated into the doctrines of the Church and fundamental principles. 3. Because the Lutherans themselves had not yet formally resolved their previous schism, and as if they had ejected us from their Churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’, pp. 67-68 (PDF pp. 73-74)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-15daafd0f6" data-kw="">
<blockquote><p>A circle of German Lutheran, Reformed and Union theologians began meeting under the auspices of the Evangelical Church in Germany (EKD) in 1947 to discuss their historic differences over Eucharistie doctrine. Ten years later, these discussions yielded the “Arnoldshain Theses on the Lord’s Supper” (Amholdshainer Abendmahlsthesen), which, in eight carefully crafted theses, proposed a consensus acceptable to all three traditions. They did this in part by placing greater emphasis on describing the effects of the Eucharist than on defining precisely the way in which Christ could be present in the Supper… Because the sacrament is a “means of salvation” and not an end in itself, the precise mode of Christ’s presence will always be secondary to its effect… …the Leuenberg Agreement of 1973… The outcome allowed Reformed, Lutheran, and Union churches throughout Europe and later from other parts of the world to pronounce their past mutual condemnations to be no longer applicable, declare fellowship with one another, and aim at greater institutional cooperation… Leuenberg’s conceptual content remains remarkably thin. The sections on the Eucharist, Christology and Predestination… barely touch on the theological issues themselves. In that sense, Leuenberg is less interesting for its theological content than for the power of what it declares as a speech act: it “pronounces” church fellowship and exhorts its signatories…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kenneth-g-appold.html">Kenneth G. Appold</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Lutheran-Reformed Relations: A Brief Historical</cite>, p. 60</span></figcaption>

<blockquote><p>I. Since a division arose among Protestants regarding certain key points of the Christian religion, and those who follow the Helvetic, French, and Belgic Confessions have openly separated from those who adhere more closely to the Augsburg Confession, the former, known specifically as the Reformed, have always tried to reconcile with those of the Augsburg Confession, and have attempted various ways to establish ecclesiastical peace and remove the schism between the two groups. II. Although these latter ones [the Lutherans] have often rejected the offered peace [by the Reformed] and many of them still seem very averse to it, sometimes the effort has met with success. For example, a hundred years ago at the Synod of Sandomierz, ministers who taught the Gospel of Christ according to both the Augsburg Confession and the Confession of the Waldensian Brethren and the Helvetic Churches in both Poland, Lithuania, and Samogitia came together in a common confession and were reconciled. Recently, in the Colloquium of Kassel, between the theologians of Marburg and Rinteln, a mutual communion was agreed upon despite remaining disagreements on what were considered fundamental issues. III. Furthermore, in this century, there have been among other theologians of the Augsburg Confession some highly learned and celebrated men who publicly declared in their writings their desire for such ecclesiastical peace between the two Protestant parties and outlined the means to achieve it. For instance, Matthias, Bishop of Strängnäs in Sweden, in his book “Northern Olive Branch,” and George Calixtus, professor of theology at the University of Helmstedt, in his book “Judgment on Theological Controversies between the Reformed and Lutherans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether from the proposed Reformed and Lutheran union, union with the Roman Church follows’ in Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), pp. 950-57 Latin</span></figcaption>

<blockquote><p>Truly not…. further this we say, Christ, as He is Mediator, is not to be religiously adored in worship; and that we say with Zanchi, Cameron and the Leiden professors…</p></blockquote>

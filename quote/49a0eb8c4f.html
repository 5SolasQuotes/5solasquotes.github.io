<main class="wrap"><figure class="quote" id="q-49a0eb8c4f" data-kw="">
<blockquote><p>Indeed to apply it to the true Roman Church, or the right succession in the Apostolic see, which was in the days of S. John, or in the time of the Christian Emperors, it were both folly and blasphemy: but to apply it to the Church of Rome, and counterfeit succession of Popes, it is wisdom and holiness. For Saint John Prophesies not only of the cruelty of the earthly estate of that city, but also of the false prophet and antichrist, which should usurp an ecclesiastical state and dignity in that city. The church of Rome indeed was one thing, and Babylon in Rome was another thing, while the Church of God was at Rome, and was persecuted by the heathen Emperors. But when the Emperor of Rome was Christian, one of the heads of the beast was wounded to death, as c. 13. even that sixth head, which was the persecutor in the time of Saint John: But this head was healed in Constantius the heretic Emperor, Valens, and Julian the Apostate, etc. and still the seventh head was to come, But great preparation was made for him, while the Bishop of Rome grew beyond the limits of a Christian Ministry, into foreign and heathen dominion as Socrates testifies, Bk. 7. chapter 11. in the time of the Christian Emperors, And when the mystery of iniquity wrought not so closely in that see, but the forgery of the Bishops was discovered in the African Council, unto which they obtruded a counterfeit Canon of the Council of Nicea for their primacy. And while Leo, Bishop of Rome, will not obey the decree of the general Council of Chalcedon, which gave equal privilege of dignity to the Bishop of Constantinople, which was new Rome, with those which the Church of Rome before had claimed as peculiar to her alone (sess. ultim). In the best and most Christian times of Rome therefore, when the head of the Heathen Empire was wounded to death, it was counted of the ancient Fathers to be Babylon here spoken of, because of the seventh head which is the Kingdom of Antichrist, that was looked for, to come in place of the sixth head, which was the earthly state of heathen, heretical, and persecuting emperors: Therefore not the true Church in Rome, but Rome the persecutor of the saints, first in the heathen and heretical emperors, afterward in the proud popes, and the kings subject to them, is Babylon the mother of all abominations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Confutation of the Rhemists’ Translation, Glosses and Annotations on the New Testament</cite>, (1618), 742.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6982e00e09" data-kw="">

</figure><figure class="quote" id="q-0c33103c99" data-kw="">
<blockquote><p>Second, there are means of a most indispensable kind to be employed in the way of explanation and instruction, counsel and persuasion, to secure the convictions and concurrence of the private members of the Church, in whatever act or declaration the rulers, in the exercise of their judicial, or legislative, or administrative functions, may find it necessary for them to perform or to adopt. Without the use of such means to carry the conscience and understanding of the members of the Church along with them in all that they do and declare, the office-bearers are not at liberty to use or enforce their peculiar power at all. And it is only when all such means have been employed and exhausted without effect, and when the members of the Church, so dealt with in the way of Christian persuasion and instruction, still refuse their concurrence, that it may be necessary and is lawful to use authority to strengthen the appeal, and to fall back upon the ultimate resource of all societies, — namely, the inherent right of the rulers to rule, and the no less inherent duty of the ruled to obey.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, vol. 1 (Edinburgh, 1868), pp. 241-3</span></figcaption>

ne</a></div>
</figure><figure class="quote" id="q-c937f8d010" data-kw="">
<blockquote><p>All, therefore, to whom the office of teaching was committed, they called presbyters, and in each city these presbyters selected one of their number to whom they gave the special title of bishop, lest, as usually happens, from equality dissension should arise. The bishop, however, was not so superior in honour and dignity as to have dominion over his colleagues, but as it belongs to a president in an assembly to bring matters before them, collect their opinions, take precedence of others in consulting, advising, exhorting, guide the whole procedure by his authority, and execute what is decreed by common consent, a bishop held the same office in a meeting of presbyters. And the ancients themselves confess that this practice was introduced by human arrangement, according to the exigency of the times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.4.2</span></figcaption>

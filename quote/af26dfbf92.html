<main class="wrap"><figure class="quote" id="q-af26dfbf92" data-kw="">
<blockquote><p>In adoption, which in the New Testament not only as to the thing is such as it was in the Old, but also as to mode, condition and effects because: (a) in the New Testament it is proposed as having been acquired through Christ (Jn. 1:12); (b) it is purely such without the schooling, servitude and fear, and thus not of childhood, but of adult age and of emancipation, conjoined with the highest boldness (parrēsia) and confidence (Rom. 8:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.7.46, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (P&amp;R Publishing, 1992–97), 232–33.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/fatherhood-of-god.html">Fatherhood of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eb4e57049d" data-kw="">
<blockquote><p>Doctrine 2. This providence of God extends itself to all things. This is clear in the text [Rom. 11:36]. Reason 1. It is as much extended to all in the world as a good and wise master of a family hath a care (as much as in him lieth) of all things that are done in his house. Reason 2. It is extended to every thing that was created of God. For in the same manner providence follows upon creation, as the apostle teacheth that provision doth upon procreation, and seeing to children and others in the family, 1 Tim. 5:8. For God in some sort is called the Father of all things that He created.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, transl. John Eusden, Baker, 1968, p. 166 | The Substance of Christian Religion, or, A Plain and Easy Draught of the Christian Catechism in 52 Lectures… (London, 1659), The 10th Lord’s Day, p. 75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/fatherhood-of-god.html">Fatherhood of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Doctrine 2. This providence of God extends itself to all things. This is clear in the text [Rom. 11:36]. Reason 1. It is as much extended to all in the world as a good and wise master of a family hath a care (as much as in him lieth) of all things that are done in his house. Reason 2. It is extended to every thing that was created of God. For in the same manner providence follows upon creation, as the apostle teacheth that provision doth upon procreation, and seeing to children and others in the family, 1 Tim. 5:8. For God in some sort is called the Father of all things that He created.”

</figure><figure class="quote" id="q-f56ed18439" data-kw="">
<blockquote><p>IV. [The use of the doctrine of creation] Unto Παράκλησιν [Paraklēsin, Consolation]: Let us trust, however, in the help of God in whatever case, because both He can help us, as He who by a word fashioned the soul, Gen. 1, and He wills to help, because He is paternally affected toward man, inasmuch as concerning all things, not only for necessity but also for delight, He provided even before he existed. Let us retain this confidence concerning Him, however much the means of helping may not be present, Gen. 2:5-6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-53ce5b81f1" data-kw="">
<blockquote><p>Our Father.” This title “Father” properly belongs to God, who is a Father simply by creation, giving being to all things and preserving them by His providence. Men indeed are called fathers, but that is only secondarily, because in some properties of fatherhood they resemble God. . . John Diodati 1607, Diodati was one of the six divines that wrote the canons of Dort Pious and Learned Annotations on the Holy Bible Mal. 2:10 – “Have we not all one father? hath not one God created us? why do we deal treacherously every man against his brother, by profaning the covenant of our fathers?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of Christ’s Sermon on the Mount, in The Works of William Perkins, volume 1</cite>, ed. Stephen Yuille, Reformation Heritage Books, 2014, p. 428 | On the Lord’s Prayer</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/fatherhood-of-god.html">Fatherhood of God</a></span></div>

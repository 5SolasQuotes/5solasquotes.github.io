<main class="wrap"><figure class="quote" id="q-082206d981" data-kw="">
<blockquote><p>For it is written in the law of Moses, ‘Thou shalt not muzzle the mouth of the ox that treadeth out the corn.’ Doth God take care for oxen?… Do ye not know that they which minister about holy things live of the things of the temple? and they which wait at the altar are partakers with the altar? Even so hath the Lord ordained that they which preach the gospel should live of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Start Here</a></span><span class="wk"><span class="lbl">Work:</span> <cite>At the Reformation Anabaptists, and later Quakers and many Independants, argued that, as the Levitical statutes are done away with, so no law remains to bind persons to systematic giving to the Christian ministry, and that ministers need not, and should not be paid. However, even before the Law with Moses, being yet a gentile, Abraham paid a tithe to the priest Melchizedek (Gen. 14:18-20; Heb. 7:4-9) and Jacob vowed to give a tenth unto God with all that He prospered him with (Gen. 28:20-22). If there were any question about the moral right of ministers to be paid (and the obligation for Christians to pay them), Paul argues this point from the general equity of Old Testament examples (1 Cor. 9:9:13-14):</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-ce2e126e9d" data-kw="">
<blockquote><p>The famousest divines in the Church of God, even Luther, Zwingli, Melancthon, Calvin, Perkins, Sibbes and abundance of nonconformists of greatest name in England did ordinarily use a form of prayer of their own before their sermons in the pulpit, and some of them in their families too. Now these men did it not through idleness or through temporizing, but because some of them found it best for the people to have oft the same words: and some of them found such a weakness of memory that they judged it the best improvement of their own gifts. Now besides the first composure of these prayers (which perhaps was done 20 years before) none of these men did use their own gifts, any more than if they had used a form composed by another. For the memory and utterance is the same of both. … And in some ordinances as baptism and the Lord’s Supper, etc. the same things must be daily prayed for: And he that thinks he must not frequently speak the same things, will quite corrupt the ordinance of Christ. And he that will imagine that he must have always new words will at last have new things or worse than nothing. If then it be meet to use often the same words, why may not a weak minister use the better words of others when he has none merely of his own that are so fit? Nay is it not the duty of such to do it? Every man is bound to do God’s service in the best manner that he can: ‘Cursed be the deceiver that hath a better in his flock, and bringeth that which is corrupt.’ But to utter prayers and praise to God in a full, methodical and congruous manner, and in words suitable to the majesty of the worship of God, is better (to the people and to the honor of religion) than to do it in a more confused, disorderly, broken manner, with barrenness and incongruity of speech. But this l […]st is the best that many honest ministers can do by their own gifts, when they may do it in the former better manner, by making use of the words and gifts of others. Therefore it is a duty for such men so far to use others’ gifts of inventing words before their own. And among us there is no man forbidden in the pulpit to use his own gifts to the utmost and pray without any set form of his own or other men’s. And I would at last desire any of the objectors but to name that text of Scripture which directly or indirectly commands every minister to use his gift of inventing words and method, or his gift of extemporary prayer, every time that he prays to God: Or which forbids to use the gifts of others though better than his own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1 | Direction 32</cite>, pp. 183-85</span></figcaption>

nner%2C+with+barrenness+and+incongruity+of+speech.+But+this+l+%5B%E2%80%A6%5Dst+is+the+best+that+many+honest+ministers+can+do+by+their+own+gifts%2C+when+they+may+do+it+in+the+former+better+manner%2C+by+making+use+of+the+words+and+gifts+of+others.+Therefore+it+is+a+duty+for+such+men+so+far+to+use+others%E2%80%99+gifts+of+inventing+words+before+their+own.+And+among+us+there+is+no+man+forbidden+in+the+pulpit+to+use+his+own+gifts+to+the+utmost+and+pray+without+any+set+form+of+his+own+or+other+men%E2%80%99s.+And+I+would+at+last+desire+any+of+the+objectors+but+to+name+that+text+of+Scripture+which+directly+or+indirectly+commands+every+minister+to+use+his+gift+of+inventing+words+and+method%2C+or+his+gift+of+extemporary+prayer%2C+every+time+that+he+prays+to+God%3A+Or+which+forbids+to+use+the+gifts+of+others+though+better+than+his+own.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Church+Divisions%E2%80%A6+%28London%2C+1670%29%2C+pt.+1+%7C+Direction+32%2C+pp.+183-85&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fce2e126e9d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ce2e126e9d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-use-of-forms-of-prayer/#:~:text=The%20famousest%20divines%20in%20the%20Church,others%20though%20better%20than%20his%20own&amp;text=The%20famousest%20divines%20in%20the%20Church%20of%20God&amp;text=gifts%20of%20others%20though%20better%20than%20his%20own" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

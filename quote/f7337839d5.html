<blockquote><p>Againe, if Christ be so lovely (altogether lovely) then let us labour to be in him, that so we may be lovely to God, because he is the first aimiable thing in the world, in whom we are all lovely, all our lovelinesse is in beloved Christ.</p></blockquote>
<figcaption>— <a href="../authors/richard-sibbes.html">Richard Sibbes</a>, <cite>Bowels Opened</cite>, London, 1639, Sermon 17, p. 399</figcaption>

<blockquote><p>In reference to grateful love, nothing so much tends to fill the heart with this emotion as the believing realization of Christ’s redemption work—nothing so melts the heart; and no purer love to God can be imbibed. … There is no motive to a holy life so powerful and efficacious as that which is drawn from the propitiatory work of Christ, who, after meeting the demands of the law and bearing its curse, makes that same law a rule to direct our steps; and Christians learn to take it from the Mediator’s hand.</p></blockquote>
<figcaption>— <a href="../authors/george-smeaton.html">George Smeaton</a>, <cite>The Doctrine of the Atonement as Taught by Christ Himself</cite>, ch. 8, sec. 52</figcaption>

</figure><figure class="quote" id="q-e5278482a5" data-kw="Mediator">
<blockquote><p>That the saints are nearer unto Christ than angels are, as I told you before; he is so a head to men as he is not to them. Both their union and ours with God is by Christ; now, if we be more united to Christ than they are, then we are more nearly united to God too; more nearly united to Christ we are, for he is our brother, he hath our nature, he hath more of ours, he hath done more for us; we are sons by adoption in him, he is our husband. To which of all the angels was it said that Christ is their husband? Of which of all the angels is it said that Christ is their Saviour?</p></blockquote>
<figcaption>— <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a>, <cite>An Exposition of the First Chapter of Ephesians</cite>, Works, vol. 1, Sermon X (Eph. 1:10), Obs. 3</figcaption>

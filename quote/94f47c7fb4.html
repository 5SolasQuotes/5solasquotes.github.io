<main class="wrap"><figure class="quote" id="q-94f47c7fb4" data-kw="sanctification follows justification">
<blockquote><p>As Christ was made to us of God righteousness and sanctification (1 Cor. 1:30)—not dividedly, but conjointly; not confusedly, but distinctly—so the benefit of sanctification immediately follows justification as inseparably connected with it, but yet really distinct from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.1.1</span></figcaption>

<blockquote><p>The end of Christ&#x27;s incarnation, death and resurrection was to prepare and form a holy nature and frame for us in Himself, to be communicated to us by union and fellowship with Him; and not to enable us to produce in ourselves the first original of such a holy nature by our own endeavours.</p></blockquote>

</figure><figure class="quote" id="q-45a6a3f53c" data-kw="imperfect sanctification against perfectionism">
<blockquote><p>It is well known that this is enumerated also among the many heads of the Pelagian hydra—that he contended that the believer can in this life live without sin and so can perfectly fulfill the law and be constituted in a state of sinlessness. Augustine thus describes this error: “The Pelagians go so far as to say that the life of the righteous in this world has no sin, and from these in this mortal existence the church of Christ is made up, so as to be wholly without wrinkle and without blemish, as if it was not the church of Christ, which throughout the world cries out to the Lord, Forgive us our debts.” Is sanctification so perfect in this life that believers can fulfill the law absolutely? We deny against the Romanists and Socinians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.2.1–2</span></figcaption>

</figure><figure class="quote" id="q-ea83841810" data-kw="remaining corruption">
<blockquote><p>Is sanctification so perfect in this life that believers can fulfill the law absolutely? We deny against the Romanists and Socinians. Among the questions concerning sanctification agitated between us and the ancient and modern Pelagians, are two principal ones: the first referring to its origin, the other to its perfection. It is well known that this is enumerated also among the many heads of the Pelagian hydra—that he contended that the believer can in this life live without sin.</p></blockquote>

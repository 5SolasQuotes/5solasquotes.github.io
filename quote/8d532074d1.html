<main class="wrap"><figure class="quote" id="q-8d532074d1" data-kw="">
<blockquote><p>I subscribe to that of Clement of Alexandrinia: We ought not to swear allegiance to any sect of philosophers, whether Stoics, Epicures, Platonists, or Peripatetics, but we must select and embrace whatsoever is true and faithfully delivered concerning God by any sect; and the Truth selected out of all sects is not vain philosophy, but Natural Divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Triunity of the Father, Son, and Holy Spirit</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c602e8f74" data-kw="">
<blockquote><p>Our intellect understands nothing except in virtue of the first light and truth, so every act of the intellect involved in thinking that something does not exist obtains in virtue of the first light. But it is impossible to think in virtue of the first light, that the first light or truth does not exist. Therefore, it is in no way possible to think that the first truth does not exist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, In Sententiarum 2.8.1.1.2 (d. 1274; Quaracchi 1:153)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-8578adbce8" data-kw="">
<blockquote><p>Thesis 2. Lest, however, our disputation be forced to wander and err, I will do that which I think ought to be done at the beginning, middle, and end of all disputations: that first, what it is that is being disputed should be defined; then, the common affections should be subjected to the definition; and finally, a division into parts and species should follow. And so our disputation on original sin will present: 1. its Definition, 2. its common Affections, 3. its Distribution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christoph-luthard.html">Christoph Luthard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on Original Sin</cite>, (Bern: Fabricius, 1637), p. 2 Lüthardt (1590-1663) was a Swiss reformed professor of philosophy and theology at Bern.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-3053da48e3" data-kw="">
<blockquote><p>…it must be emphasized that the Aristotelian position Ross represents (and that I am defending in this book) does not deny that, in the normal case, material processes are necessary for thought. Rather, it denies that they are sufficient for it.</p></blockquote>

</figure><figure class="quote" id="q-021583a31f" data-kw="">
<blockquote><p>Let your theologians [O Stapleton] dispute as much as they will that it is the least of all sins, and less than any venial one: what else do they reveal to all but their singular ignorance? If it is so minimal that it ought to be considered less than even any venial sin, then it cannot even be a sin, because what is less than venial is not to be placed among sins, since no sin is less than venial. Do you think Thomas felt this, when he writes that original sin is greater extensively than actual sin, but intensively less, because the actual has more of the nature of the voluntary (Thomas, in pt. 1 of 2, q. 82, art. 2)? If that reason does not deceive, they did rightly who placed it below any venial sin whatsoever, since in the slightest sin there is more of the voluntary than in the original, unless we are understood to have willed in Adam.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin</cite>, … against the three first books of Thomas Stapleton on the Whole Doctrine of Justification presently controverted (d. 1595; Legat, 1600), bk. 1, ch. 1 trans. AI Latin, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<main class="wrap"><figure class="quote" id="q-235c0b49d0" data-kw="">
<blockquote><p>I have no hesitation in affirming that since the day when the spirit of good King George III. of blessed memory, departed, the point of a Popish wedge has been introduced into our entire social system – impelled by a hidden force it has gradually, steadily, without one failure, penetrated, on, and on, and on, forcing itself into our national institutions – often imperceptibly – unless, as from time to time, we are aroused from our fatal slumbers by the crushing of some of our ancient barriers, and then we slumber again, and the operation proceeds – and when will it end? never! until it has effaced every vestige of Protestantism from our legislature, our statutes and our laws!

Compare our present constitution with that which existed when those events occurred for which we are still, with similar inconsistency, called as on this day, to give thanks! Then our houses of Parliament consisted only of men professing Protestantism – like a pure, primitive rock, of original formation the rock of truth! But now our legislative is composite, and still in a transition state: there may sit, side by side, the Jew and the Christian – the Papist, the Jesuit and the Protestant – the Unitarian, the scoffer, and the member of the Church of England – and this is the composition of the body which legislates on our laws and our religion! What can we expect from a body so constituted? What but that which we have received – the sample and the earnest of more!

A feeble barrier yet lingers around the throne itself – but how long this illiberal exclusion shall be permitted to our monarch or how soon such a legislature may invite our beloved Protestant Queen to cancel her Coronation oath, none can tell! I should think that the illustrious blood of the Protestant house of Orange would rather freeze in the veins of Victoria, than she would put her hand to such an instrument! But see how the mystery of iniquity has worked and prevailed in our state and nation! How soon it may become ascendant and dominant none can tell! And if it were so, who would guarantee the continuance of Victoria’s beneficent sway? nought can shake the Protestant throne, but the successful intrigues, and wily schemes of the “mystery of iniquity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-close.html">Francis Close</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The “Mystery of Iniquity:” Being the Substance of a Sermon Preached in the Parish Church, Cheltenham, on November 5th, 1845</cite>, (3rd edn, London: Hatchard and Son, 1845), pp 17-18.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-edb3caa851" data-kw="">
<blockquote><p>They [Papists] do not only say… that one born in an heretical country may deny his country, but that by heresy a man, nay, a king, is deprived of all his jurisdiction, whether natural, civil or politic… One of their own bishops says, “As soon as a Christian king becomes heretical, forthwith the people are freed from subjection.” A cardinal says, “As long as the prince continues excommunicated (as he must do ever, if he be not a Romanist, for the Pope excommunicates ipso facto all heretics) the subject is freed from the oath of subjection,” but by whom? By the Pope, says a Jesuit, who upon just cause has power to absolve from oaths both himself, (as Gregory the 12th did when he sware that if he were chosen Pope he would give it over) and all others. If he be personally excommunicated, then, says their lawyer, subjects are freed from their allegiance and all his heretical assistants are to be rooted out, and their land to be exposed to be possessed of (strangers) Catholics. Nay, says another lawyer, if he be not excommunicated, yet if his heresy be publicly known, there needs no pronunciation of the sentence of excommunication, so that (says the Jesuit) subjects may lawfully deny him obediencer? How so? For the evidence of the crime, (says their whole school, and make it a matter of certainty and faith) does infer a sentence of condemnations because (as the more common opinion does define it) there must we understand the Pope’s will to have him excommunicated, whom upon the knowledge of his fault he would excommunicate. Nay, suppose that a Protestant prince have a just quarrel: yet, no war can be lawfully denounced or waged by the Queen (being excommunicated by name) though otherwise in itself it were most just: because her power is unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, ch. 49, ‘Concerning Magistrates’, ‘What are the Assertions of Papists in this Point?’, p. 901-902</span></figcaption>

</figure><figure class="quote" id="q-1881f9940b" data-kw="">
<blockquote><p>It is queried whether a magistrate is authorized to impose capital punishment on the exceedingly shameful and murderers? Some Remonstrants [Arminians] deny… but others openly assert… We all affirm to authorize, and the contrary sentiments we condemn and reject as errors: 1. For Gen. 9:6, “Whoso sheds man’s blood, by man shall his blood be shed.” Ex. 21:14, “But if a man come presumptuously upon his neighbor, to slay him with guile; thou shalt take him from mine altar, that he may die.” Num. 35:31, “Moreover ye shall take no satisfaction for the life of a murderer, which is guilty of death: but he shall be surely put to death.” which is not a judicial law and temporary, but is clearly effected out of the Law of Nature, which innocent blood cannot be expiated as in the Ceremonial or Judicial Law [Dt. 21:1-9]. But it says ‘never’: Num. 35:33, “So ye shall not pollute the land wherein ye are: for blood it defileth the land: and the land cannot be cleansed of the blood that is shed therein, but by the blood of him that shed it.</p></blockquote>

<blockquote><p>5. Did you know before you wrote this, that all such as we persuade men to hear, have by oath renounced their Christian liberty? what oath is it that you mean? If you mean the Oath of Supremacy or Allegiance, unless Popery be Christian liberty, we know of none such which these renounce. And I know of no other oath, except that of canonical obedience in licitis et honestis [in things lawful and honest]. And for that:

1. I find not that the act or canons do impose it on those that come for ordination (nor am so well skilled in the law as to know by what law it is done).

2. I know that men have been ordinarily ordained without it. And to such your reason for separation is vain.

3. Mr. [William] Bradshaw and other old non-conformists were wont to say that they obeyed the diocesans and so did promise them obedience only as they are the king’s officers, deputed for the exercise of that civil or coercive power which magistrates have in causes called ecclesiastical [i.e. circa sacra]. And what liberty does that give away?

4. But suppose that you are the wiser man, and that those that are more ignorant do mistakingly think that canonical obedience and the oath (with that of Supremacy) to be their duty, and no renouncing of their Christian liberty: Is it not false doctrine to conclude that Christ never sent out any that had as great a sin as this? what none? when he sent out Judas himself, who was first a thief and after a traitor? Do you think then that Christ ever sent out liars, railers, furious Church-dividers, false accusers, etc.?

5. That indeed they are nothing else, as to the whole discharge and exercise of their office, but the servants of men, is another slander and untruth. He that is a servant of Christ, and a true pastor of a Christian Church, and a sound preacher of the Gospel, and a helper of believers’ faith, and a lover of the people’s souls, and a diligent upright laborer for men’s salvation, is something else than a servant of man (even in the discharge of their ministerial office). But such are many of the conformable ministers: Therefore prove if you can that Dr. Preston, Sibbes, Stoughton, Whittaker, Mr. Bolton, Whateley, Gataker, Fenner, and all the late [Westminster] Assembly save eight or nine at most (being all conformists) were nothing else but the servants of men, and not at all the servants of Christ. Your Father thought otherwise of Mr. Bolton, and perhaps they were both as wise as you. Prove now that Mr. [William] Gurnall, Mr. [John] Trapp, Dr. [John] Lightfoot, Dr. Walker, Mr. Langley, and many others that I can name that are worthy men in London and round about it, are nothing else but the servants of men? And will it not be as hard to prove one to be a servant of Christ who serves Satan by falsehood and malice, and calumniating Christ’s Churches and servants, as those that are thus the servants of men.</p></blockquote>

<blockquote><p>It teaches that in a Christian nation, that is, in a nation not without God, government as a servant of God is duty-bound to glorify his name and accordingly ought to (a) remove from administration and legislation anything that impedes the free influence of the gospel on the nation; (b) abstain from all direct meddling with the spiritual formation of the nation, being absolutely incompetent thereto (c) treat all denominations or religious communities, and more over all citizens, regardless of their views about things eternal, on an equal footing of equality; and (d) acknowledge in peoples conscience, provided it does not lack the presumption of respect ability, a limit to its power. Article 4 THREE SYSTEMS Ignoring Religion We have seen what government is: a servant of God. Now we come to the question: what should government do and not do to be found faithful in the service of God? Following the tenor of our Program, we answer: Government has both direct and indirect duties toward God. The direct duties are either of a negative or a positive nature. Negatively, government is bound to allow unrestricted freedom for (1) the gospel’s influence; (2) people’s spiritual formation; (3) the manner in which people choose to worship; and (4) peoples conscience. Positively, government is duty-bound to (1) maintain law and order; (2) honor the oath; and (3) dedicate one day a week to God. We are well aware that these brief indications throw into sharp relief the differences between the kind of state the liberals want to establish and the kind we antirevolutionaries aspire to. This is best seeing if you take the trouble to think for a moment about what the liberals want. Their state is a state without God; it is an atheist state.1 this does not mean that each and every liberal wants to be irreverent and disrespectful toward God. It only means that in their opinion religion belongs to the realm of the inner life and that the state as a political power must avoid as much as possible all contact with this inner life. They feel that the situation will not be ideal until the point is reached where the where in government circles no mention is ever made of God, religion, or church. Whatever traces might remain of that sort would gradually need to be eliminated. Kingship by the grace of God would have to go. So prayer for God’s guidance in the Speech from the Throne. So would a prayer for God’s blessing when tabling legislative bills. Sunday observance would have to go. Every connection with the church would have to go. So with the oath. And so on. This is true of our liberals as well as our conservatives. Not if you look at what they say, but at what their principles prescribe. Those principles leave no room for serving God. At most, as a result of inconsistency or for the sake of party interest or theory of Hobbs, they allow for God almighty to serve as “the invisible police that casts fear into the multitude.”2 The basic error of this political system is the claim that one cannot really know if there is a God, hence that nothing objective can be established in regard to religion, and that this whole feature of the inner life of human beings belongs to the subjective, personal, at most domestic and ecclesiastical domain. Modern subjectivism—the false theory that religious sentiment is a separate capacity which, like musical talent, is stronger in some than others—and in connection with that theory the false notion that we are able to ascertain what the human person thinks of God but not whether he exists or who he is—this way of thinking could not lead with logical necessity to this God-less political system. It is a system that no longer has any room for prayer in the council chambers nor for national days of prayer. It is a system which prescribes that everything that is state must, qua state, ignore the living God. A State Church In opposition to such a system, the antirevolutionary party asserts that religion is not solely subjective but in fact is first of all objective. It contains that the knowledge that there is a God and that we have to do with that living God is firmly established and must be acknowledged, independently of our feelings. It holds that this state, too, as “the moral organization of the people as a whole,” is obliged to reckon with this foundation and fountainhead of all moral life. The party bases this claim not on revelation but on natural theology—on the knowledge of God that can be gathered from what is seen of God in creation, particularly in the human person, and not least in the national organism as well. In this, it consciously follows the tradition of our Reformed theologians, who held fast to this natural theology precisely for the sake of that which falls outside the kingdom of heaven. At the same time, to add one more note, the party was completely vindicated in this view by Max Müller’s recent lecture series on religion.3 This natural knowledge of God, not the knowledge from revelation, has compelling force for every person. Certainty about the first kind of knowledge does not require what the second requires, namely, supernatural illumination. For this reason the non-Confessional government has the absolute indirect legal competence as well as the obligation to take as its official rule of conduct the first (natural) knowledge of God, but not the second (revealed) kind. This would only be possible if there were an extraordinary, supernatural organ that could decide with absolute certainty what the revealed knowledge of God demanded in a given case. Such an organ, however, is lacking. And had to be lacking, otherwise either the state would become spiritual or religion would become profane. Accordingly, any attempt to call such an organ into existence regardless, as was done by Rome, has founded miserably and corrupted state and church alike. Things of a different nature just cannot be mixed. The state is not the kingdom of God, and the kingdom of God cannot be pressed into the confines of political life. We resolutely reject every attempt at reviving a “Christian state” in this sense, just as we resolutely turn against men like Rothe whose theory lacks all boundary lines and has the church flow into the state and then the state into the kingdom of God.4 Such unsound confusion of ideas must not be tolerated. It obscures clear thinking and causes the worn-out minds to sink back into the mysteries of the “unconscious” life and unsteady “feelings.” And that must not be. We have to use our understanding, our thinking, our reason in what we do, and the laws for our thinking do not allow such a chaotic muddle. State and Church Interrelate: Each Rooted In Its Own Principle The state is intended for the present dispensation and has at most preparatory significance for the eternal household of humankind. The kingdom of God, on the other hand, derives its purpose and character from the coming dispensation and at most uses earthly things for the things eternal. This gives rise to two different sets of ideas that increasingly follow their separate ways and therefore ought not to be confused in our minds. Government is directly rooted in the natural life and Sage has no other than a natural knowledge of God. The kingdom of God is a supernatural realm wears supernatural knowledge of God shines undimmed. Thanks to its natural knowledge of God, government knows (1) that there is a God; (2) that this living God governs the fate of everything created, hence also of the state; (3) that this all governing providence desires justice and is therefore an avenger of injustice; and (4) that sin is operative among human beings, from which higher intervention alone can save. Now it is on the basis of this purely natural knowledge of God that the state comes to honor God in its public actions; to invoke God’s holy name in state documents; to respect the oath; to dedicate a day of rest to him; to proclaim national days of prayer during disasters; to practice justice even with the sword; into allow free course to the gospel. Three systems therefore: (1) There is the god-less state of the liberals, who reject both the natural and the revealed knowledge of God and whose motto is “leave God out of it.” (2) There is theocratic state of Roman Catholics and inconsistent Protestants, who base the state qua state directly on both the natural and the revealed knowledge of God and consequently make the state function as the active promoter of the kingdom of God, as for example in the middle ages and still partly in Prussia. And finally (3) there is the political and God honoring state of the Reformed or Puritan nations, who based the state directly on the natural knowledge of God and accordingly have government proceeded actively as a servant of God in the sphere of the natural knowledge of God but passively in the fear of the revealed knowledge of God. An example here is the United States of America, where on the one hand praise, proclaims days of prayer, and honors the seventh day, while on the other hand it conducts itself in a more neutral fashion vis à vis the churches and any country in Europe.5</p></blockquote>

+seeing+if+you+take+the+trouble+to+think+for+a+moment+about+what+the+liberals+want.+Their+state+is+a+state+without+God%3B+it+is+an+atheist+state.1+this+does+not+mean+that+each+and+every+liberal+wants+to+be+irreverent+and+disrespectful+toward+God.+It+only+means+that+in+their+opinion+religion+belongs+to+the+realm+of+the+inner+life+and+that+the+state+as+a+political+power+must+avoid+as+much+as+possible+all+contact+with+this+inner+life.+They+feel+that+the+situation+will+not+be+ideal+until+the+point+is+reached+where+the+where+in+government+circles+no+mention+is+ever+made+of+God%2C+religion%2C+or+church.+Whatever+traces+might+remain+of+that+sort+would+gradually+need+to+be+eliminated.+Kingship+by+the+grace+of+God+would+have+to+go.+So+prayer+for+God%E2%80%99s+guidance+in+the+Speech+from+the+Throne.+So+would+a+prayer+for+God%E2%80%99s+blessing+when+tabling+legislative+bills.+Sunday+observance+would+have+to+go.+Every+connection+with+the+church+would+have+to+go.+So+with+the+oath.+And+so+on.+This+is+true+of+our+liberals+as+well+as+our+conservatives.+Not+if+you+look+at+what+they+say%2C+but+at+what+their+principles+prescribe.+Those+principles+leave+no+room+for+serving+God.+At+most%2C+as+a+result+of+inconsistency+or+for+the+sake+of+party+interest+or+theory+of+Hobbs%2C+they+allow+for+God+almighty+to+serve+as+%E2%80%9Cthe+invisible+police+that+casts+fear+into+the+multitude.%E2%80%9D2+The+basic+error+of+this+political+system+is+the+claim+that+one+cannot+really+know+if+there+is+a+God%2C+hence+that+nothing+objective+can+be+established+in+regard+to+religion%2C+and+that+this+whole+feature+of+the+inner+life+of+human+beings+belongs+to+the+subjective%2C+personal%2C+at+most+domestic+and+ecclesiastical+domain.+Modern+subjectivism%E2%80%94the+false+theory+that+religious+sentiment+is+a+separate+capacity+which%2C+like+musical+talent%2C+is+stronger+in+some+than+others%E2%80%94and+in+connection+with+that+theory+the+false+notion+that+we+are+able+to+ascertain+what+the+human+person+thinks+of+God+but+not+whether+he+exists+or+who+he+is%E2%80%94this+way+of+thinking+could+not+lead+with+logical+necessity+to+this+God-less+political+system.+It+is+a+system+that+no+longer+has+any+room+for+prayer+in+the+council+chambers+nor+for+national+days+of+prayer.+It+is+a+system+which+prescribes+that+everything+that+is+state+must%2C+qua+state%2C+ignore+the+living+God.+A+State+Church+In+opposition+to+such+a+system%2C+the+antirevolutionary+party+asserts+that+religion+is+not+solely+subjective+but+in+fact+is+first+of+all+objective.+It+contains+that+the+knowledge+that+there+is+a+God+and+that+we+have+to+do+with+that+living+God+is+firmly+established+and+must+be+acknowledged%2C+independently+of+our+feelings.+It+holds+that+this+state%2C+too%2C+as+%E2%80%9Cthe+moral+organization+of+the+people+as+a+whole%2C%E2%80%9D+is+obliged+to+reckon+with+this+foundation+and+fountainhead+of+all+moral+life.+The+party+bases+this+claim+not+on+revelation+but+on+natural+theology%E2%80%94on+the+knowledge+of+God+that+can+be+gathered+from+what+is+seen+of+God+in+creation%2C+particularly+in+the+human+person%2C+and+not+least+in+the+national+organism+as+well.+In+this%2C+it+consciously+follows+the+tradition+of+our+Reformed+theologians%2C+who+held+fast+to+this+natural+theology+precisely+for+the+sake+of+that+which+falls+outside+the+kingdom+of+heaven.+At+the+same+time%2C+to+add+one+more+note%2C+the+party+was+completely+vindicated+in+this+view+by+Max+M%C3%BCller%E2%80%99s+recent+lecture+series+on+religion.3+This+natural+knowledge+of+God%2C+not+the+knowledge+from+revelation%2C+has+compelling+force+for+every+person.+Certainty+about+the+first+kind+of+knowledge+does+not+require+what+the+second+requires%2C+namely%2C+supernatural+illumination.+For+this+reason+the+non-Confessional+government+has+the+absolute+indirect+legal+competence+as+well+as+the+obligation+to+take+as+its+official+rule+of+conduct+the+first+%28natural%29+knowledge+of+God%2C+but+not+the+second+%28revealed%29+kind.+This+would+only+be+possible+if+there+were+an+extraordinary%2C+supernatural+organ+that+could+decide+with+absolute+certainty+what+the+revealed+knowledge+of+God+demanded+in+a+given+case.+Such+an+organ%2C+however%2C+is+lacking.+And+had+to+be+lacking%2C+otherwise+either+the+state+would+become+spiritual+or+religion+would+become+profane.+Accordingly%2C+any+attempt+to+call+such+an+organ+into+existence+regardless%2C+as+was+done+by+Rome%2C+has+founded+miserably+and+corrupted+state+and+church+alike.+Things+of+a+different+nature+just+cannot+be+mixed.+The+state+is+not+the+kingdom+of+God%2C+and+the+kingdom+of+God+cannot+be+pressed+into+the+confines+of+political+life.+We+resolutely+reject+every+attempt+at+reviving+a+%E2%80%9CChristian+state%E2%80%9D+in+this+sense%2C+just+as+we+resolutely+turn+against+men+like+Rothe+whose+theory+lacks+all+boundary+lines+and+has+the+church+flow+into+the+state+and+then+the+state+into+the+kingdom+of+God.4+Such+unsound+confusion+of+ideas+must+not+be+tolerated.+It+obscures+clear+thinking+and+causes+the+worn-out+minds+to+sink+back+into+the+mysteries+of+the+%E2%80%9Cunconscious%E2%80%9D+life+and+unsteady+%E2%80%9Cfeelings.%E2%80%9D+And+that+must+not+be.+We+have+to+use+our+understanding%2C+our+thinking%2C+our+reason+in+what+we+do%2C+and+the+laws+for+our+thinking+do+not+allow+such+a+chaotic+muddle.+State+and+Church+Interrelate%3A+Each+Rooted+In+Its+Own+Principle+The+state+is+intended+for+the+present+dispensation+and+has+at+most+preparatory+significance+for+the+eternal+household+of+humankind.+The+kingdom+of+God%2C+on+the+other+hand%2C+derives+its+purpose+and+character+from+the+coming+dispensation+and+at+most+uses+earthly+things+for+the+things+eternal.+This+gives+rise+to+two+different+sets+of+ideas+that+increasingly+follow+their+separate+ways+and+therefore+ought+not+to+be+confused+in+our+minds.+Government+is+directly+rooted+in+the+natural+life+and+Sage+has+no+other+than+a+natural+knowledge+of+God.+The+kingdom+of+God+is+a+supernatural+realm+wears+supernatural+knowledge+of+God+shines+undimmed.+Thanks+to+its+natural+knowledge+of+God%2C+government+knows+%281%29+that+there+is+a+God%3B+%282%29+that+this+living+God+governs+the+fate+of+everything+created%2C+hence+also+of+the+state%3B+%283%29+that+this+all+governing+providence+desires+justice+and+is+therefore+an+avenger+of+injustice%3B+and+%284%29+that+sin+is+operative+among+human+beings%2C+from+which+higher+intervention+alone+can+save.+Now+it+is+on+the+basis+of+this+purely+natural+knowledge+of+God+that+the+state+comes+to+honor+God+in+its+public+actions%3B+to+invoke+God%E2%80%99s+holy+name+in+state+documents%3B+to+respect+the+oath%3B+to+dedicate+a+day+of+rest+to+him%3B+to+proclaim+national+days+of+prayer+during+disasters%3B+to+practice+justice+even+with+the+sword%3B+into+allow+free+course+to+the+gospel.+Three+systems+therefore%3A+%281%29+There+is+the+god-less+state+of+the+liberals%2C+who+reject+both+the+natural+and+the+revealed+knowledge+of+God+and+whose+motto+is+%E2%80%9Cleave+God+out+of+it.%E2%80%9D+%282%29+There+is+theocratic+state+of+Roman+Catholics+and+inconsistent+Protestants%2C+who+base+the+state+qua+state+directly+on+both+the+natural+and+the+revealed+knowledge+of+God+and+consequently+make+the+state+function+as+the+active+promoter+of+the+kingdom+of+God%2C+as+for+example+in+the+middle+ages+and+still+partly+in+Prussia.+And+finally+%283%29+there+is+the+political+and+God+honoring+state+of+the+Reformed+or+Puritan+nations%2C+who+based+the+state+directly+on+the+natural+knowledge+of+God+and+accordingly+have+government+proceeded+actively+as+a+servant+of+God+in+the+sphere+of+the+natural+knowledge+of+God+but+passively+in+the+fear+of+the+revealed+knowledge+of+God.+An+example+here+is+the+United+States+of+America%2C+where+on+the+one+hand+praise%2C+proclaims+days+of+prayer%2C+and+honors+the+seventh+day%2C+while+on+the+other+hand+it+conducts+itself+in+a+more+neutral+fashion+vis+%C3%A0+vis+the+churches+and+any+country+in+Europe.5%E2%80%9D%0A%0A%E2%80%94+Abraham+Kuyper%2C+Our+Program%3A+A+Christian+Political+Manifesto%2C+trans.+and+ed.+Harry+Van+Dyke+in+Abraham+Kuyper%3A+Collected+Works+in+Political+Philosophy+%28Bellingham%2C+WA%3A+Lexham+Press%2FActon+Institute%2C+2015%29%2C+57%E2%80%9361.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feb69d36f8d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eb69d36f8d.html">Permalink</a><a class="src" href="https://heidelblog.net/2024/10/kuyper-contra-christian-nationalism/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

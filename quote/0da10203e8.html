<main class="wrap"><figure class="quote" id="q-0da10203e8" data-kw="">
<blockquote><p>To go as pirates and catch up poor negroes or people of another land, that never forfeited life or liberty, and to make them slaves, and sell them, is one of the worst kinds of thievery in the world; and such persons are to be taken for the common enemies of mankind; and they that buy them and use them as beasts, for their mere commodity, and betray, or destroy, or neglect their souls, are fitter to be called incarnate devils than Christians, though they be no Christians whom they so abuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Directory in Practical Works</cite>, (Soli Deo Gloria, 1990), 1:462</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ff3b9cf688" data-kw="">
<blockquote><p>What compelled people may do to redeem their lives, with loss of liberty, is nothing to the point… and that they may sell the liberty of their posterity, not yet born, is utterly denied as unlawful; yea, a violentated father to me is a father, and not a father, and the posterity may vindicate their own liberty given away unjustly before they were born, Qua omne regnum vi partum potest vi dissolvi.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 66 lt col bot</span></figcaption>

</figure><figure class="quote" id="q-c5c9d752b4" data-kw="">
<blockquote><p>If a people, trusting in the goodness of their prince, enslave themselves to him, and he shall after[ward] turn [a] tyrant, a rash and temerarious surrender obliges not, Et ignorantia facit factum quasi involuntarium. Ignorance makes the fact some way involuntary; for if the people had believed that a meek king would have turned a roaring lion, they should not have resigned their liberty into his hand; and, therefore, the surrender was tacitly conditional to the king as meek, or whom they believed to be meek, and not to a tyrannous lord; and, therefore, when the contract is made for the utility of the one party, the law says, their place is for after wits, that men may change their mind and resume their liberty, though, if they had given away their liberty for money, they cannot recall it; and if violence made the surrender of liberty, here is slavery; and slaves taken in war, so soon as they can escape and return to their own, they are free. (D. Sect. item, ea justit. de rerum divin. I. nihil. F. de rapt. I. 3). So the learned Ferdin. Vasquez (illust. bk. 2, ch. 82, n. 15) says, “The bird that was taken, and has escaped, is free.” Nature in a forced people, so soon as they can escape from a violent conqueror, makes them a free people; and si solo tempore (says Ferd. Vasquez, bk. 2, ch. 82, n. 6) justificatur subjectio, solo tempore facilius justificabitur liberatio.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), question 16, pp. 66-67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

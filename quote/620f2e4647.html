<main class="wrap"><figure class="quote" id="q-620f2e4647" data-kw="">
<blockquote><p>Two prominent Westminster divines remind us of the correct interpretation of the head-covering mentioned 1 Corinthians 11, namely, that it is to be understood as a custom-able sign and not as a universal principle:

Divine Apostolical Institutions, (that we may draw to our purpose) were again of two sorts:

First, variable, or temporary, which were such injunctions as were prescribed, either for some special ends, as that law for abstaining from blood, and things strangled, Acts 15.1 for avoiding offence to the Jews, or to some special nations, or persons, as agreeable to the customs of those places and times, as that of women being vailed in the Congregations, and some other the like.

Secondly, invariable and perpetual: such as concerned the whole Church: This distinction we received from that learned and Professor; His instances of the later part of it, are Imposition of hands, in the election of Ministers, and the distinction of Deacons from the Pastors; we would say, Presbyters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey-and-herbert-palmer.html">Daniel Cawdrey and Herbert Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sabbatum Redivivum: or, The Christian Sabbath vindicated</cite>, (London, 1652), second part, p. 463.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-5dfefbec93" data-kw="">
<blockquote><p>In the second half of the seventeenth century, the Viennese nobility introduced French fashion as a consumption pattern for Austrian elites. Beaver and vicuña hats, made of raw materials from Canada, Peru, West Africa, the Sudan and the Levant, were part and parcel of the new French fashion. French hats were globalized commodities appreciated throughout Europe, although the globalized nature and composition of the product remained completely invisible. This article considers Vienna as a remote area, far from the booming and, in historiography, well-explored European Atlantic ports and capitals, and investigates how Vienna participated in particular global fashion trends. Specifically, it focuses on the social and economic impact of hats as a globalized consumer good on the local Viennese market. Based on an extensive analysis of archival sources, the article sheds light on consumption patterns of elites, practices of the trade in hats, and the consequences of the globalized hat market for local craft production. The globalization of the hat market entailed the immigration of fully trained hatters. Skilled craftsmen from France and Italy introduced new processing methods in Vienna, but this did not result in the dissemination of knowledge. The continuing demand for hats in Vienna stoked a large increase in imports of finished or semi-finished hats, which in turn fostered the emergence of new branches of activity for the accoutrement and selling of these products.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/veronika-hyden-hanscho.html">Veronika Hyden-Hanscho</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Invisible Globalization: French Hats in Habsburg Vienna</cite>, 1650-1750′ Journal of European Economic History (3 / 2016), pp. 11-54</span></figcaption>

<blockquote><p>§. 9. Of the faults of servants contrary to reverence in carriage. … 2. Others, if at first coming to their master they give some salutation, yet, through too much familiarity with them, all the day after they will carry themselves fellow-like, scarce uncovering their heads in their master’s presence, not enduring to stand long before him, but either setting themselves down, or slinking away when they should be in presence… This unmannerly familiarity is commonly in such servants, as have poor and mean [low] masters: for rich and great men’s servants can be so full of curtesy, as not a word shall be spoken by their masters to them, or by them to their masters, but the knee shall be bowed withal: they can stand hour after hour before their masters, and not once put on their hat: if they be walking after their masters, their master shall not turn sooner than their hat will be off, and that so oft as he turns or speaks to them.</p></blockquote>

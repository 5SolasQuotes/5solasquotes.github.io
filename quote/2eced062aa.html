<main class="wrap"><figure class="quote" id="q-2eced062aa" data-kw="">
<blockquote><p>Thus a Christian man is righteous and a sinner at the same time, holy and profane, an enemy of God and a child of God.* None of the sophists will admit this paradox, because they do not understand the true meaning of justification. This was why they forced men to go on doing good works until they would not feel any sin at all. By this means they drove to the point of insanity many men who tried with all their might to become completely righteous in a formal sense but could not accomplish it. And innumerable persons even among the authors of this wicked dogma were driven into despair at the hour of death, which is what would have happened to me if Christ had not looked at me in mercy and liberated me from this error. We, on the other hand, teach and comfort an afflicted sinner this way: “Brother, it is impossible for you to become so righteous in this life that your body is as clear and spotless as the sun. You still have spots and wrinkles (Eph. 5:27), and yet you are holy.” But you say: “How can I be holy when I have sin and am aware of it?” “That you feel and acknowledge sin—this is good. Thank God, and do not despair. It is one step toward health when a sick man admits and confesses his disease.” “But how will I be liberated from sin?” “Run to Christ, the Physician, who heals the contrite of heart and saves sinners. Believe in Him. If you believe, you are righteous, because you attribute to God the glory of being almighty, merciful, truthful, etc. You justify and praise God. In short, you attribute divinity and everything to Him. And the sin that still remains in you is not imputed but is forgiven for the sake of Christ, in whom you believe and who is perfectly righteous in a formal sense. His righteousness is yours; your sin is His.” As I have said, therefore, any Christian is a supreme pontiff, because, first, he offers and slaughters his reason and the mind of the flesh, and, secondly, he attributes to God the glory of being righteous, truthful, patient, kind, and merciful. This is the continuous evening and morning sacrifice in the New Testament. The evening sacrifice is to kill the reason, and the morning sacrifice is to glorify God. Thus a Christian is involved, daily and perpetually, in this double sacrifice and in its practice. No one can adequately proclaim the value and the dignity of Christian sacrifice. Therefore this is a marvelous definition of Christian righteousness: it is a divine imputation or reckoning as righteousness or to righteousness, for the sake of our faith in Christ or for the sake of Christ. When the sophists hear this definition, they laugh; for they suppose that righteousness is a certain quality that is first infused into the soul and then distributed through all the members. They cannot strip off the thoughts of reason, which declares that righteousness is a right judgment and a right will. Therefore this inestimable gift excels all reason, that without any works God reckons and acknowledges as righteous the man who takes hold by faith of His Son, who was sent into the world, who was born, who suffered, and who was crucified for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 232–34.</span></figcaption>

<blockquote><p>VII. This appears more clearly when we come to the thing itself and the controversy is not carried on coldly and unfeelingly in scholastic cloud and dust (as if from a distance), but in wrestling and agony—when the conscience is placed before God and terrified by a sense of sin and of the divine justice, it seeks a way to stand in the judgment and to flee from the wrath to come. It is indeed easy in the shades of the schools to prattle much concerning the worth of inherent righteousness and of works to the justification of men; but when we come into the sight of God, it is necessary to leave such trifles because there the matter is conducted seriously and no ludicrous disputes about words (logomachia) are indulged. Hither our eyes must be altogether raised if we wish to inquire profitably concerning true righteousness; in what way we may answer the heavenly Judge, when he shall have called us to account. Truly while among men the comparison holds good; each one supposes he has what is of some worth and value. But when we rise to the heavenly tribunal and place before our eyes that supreme Judge (not such as our intellects of their own accord imagine, but as he is described to us in Scripture [namely, by whose brightness the stars are darkened; at whose strength the mountains melt; by whose anger the earth is shaken; whose justice not even the angels are equal to bear; who does not make the guilty innocent; whose vengeance when once kindled penetrates even to the lowest depths of hell]), then in an instant the vain confidence of men perishes and falls and conscience is compelled (whatever it may have proudly boasted before men concerning its own righteousness) to deprecate the judgment and to confess that it has nothing upon which it can rely before God. And so it cries out with David, “Lord, if thou marked iniquity, who can stand?”; and elsewhere, “Enter not into judgment with thy servant, because no flesh will be justified in thy sight.</p></blockquo <div class="actions"><button class="copy" data-copy="“VII. This appears more clearly when we come to the thing itself and the controversy is not carried on coldly and unfeelingly in scholastic cloud and dust (as if from a distance), but in wrestling and agony—when the conscience is placed before God and terrified by a sense of sin and of the divine justice, it seeks a way to stand in the judgment and to flee from the wrath to come. It is indeed easy in the shades of the schools to prattle much concerning the worth of inherent righteousness and of works to the justification of men; but when we come into the sight of God, it is necessary to leave such trifles because there the matter is conducted seriously and no ludicrous disputes about words (logomachia) are indulged. Hither our eyes must be altogether raised if we wish to inquire profitably concerning true righteousness; in what way we may answer the heavenly Judge, when he shall have called us to account. Truly while among men the comparison holds good; each one supposes he has what is of some worth and value. But when we rise to the heavenly tribunal and place before our eyes that supreme Judge (not such as our intellects of their own accord imagine, but as he is described to us in Scripture [namely, by whose brightness the stars are darkened; at whose strength the mountains melt; by whose anger the earth is shaken; whose justice not even the angels are equal to bear; who does not make the guilty innocent; whose vengeance when once kindled penetrates even to the lowest depths of hell]), then in an instant the vain confidence of men perishes and falls and conscience is compelled (whatever it may have proudly boasted before men concerning its own righteousness) to deprecate the judgment and to confess that it has nothing upon which it can rely before God. And so it cries out with David, “Lord, if thou marked iniquity, who can stand?”; and elsewhere, “Enter not into judgment with thy servant, because no flesh will be justified in thy sight.”

— Francis Turretin, Institutes of Elentic Theology 16.2.7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVII.+This+appears+more+clearly+when+we+come+to+the+thing+itself+and+the+controversy+is+not+carried+on+coldly+and+unfeelingly+in+scholastic+cloud+and+dust+%28as+if+from+a+distance%29%2C+but+in+wrestling+and+agony%E2%80%94when+the+conscience+is+placed+before+God+and+terrified+by+a+sense+of+sin+and+of+the+divine+justice%2C+it+seeks+a+way+to+stand+in+the+judgment+and+to+flee+from+the+wrath+to+come.+It+is+indeed+easy+in+the+shades+of+the+schools+to+prattle+much+concerning+the+worth+of+inherent+righteousness+and+of+works+to+the+justification+of+men%3B+but+when+we+come+into+the+sight+of+God%2C+it+is+necessary+to+leave+such+trifles+because+there+the+matter+is+conducted+seriously+and+no+ludicrous+disputes+about+words+%28logomachia%29+are+indulged.+Hither+our+eyes+must+be+altogether+raised+if+we+wish+to+inquire+profitably+concerning+true+righteousness%3B+in+what+way+we+may+answer+the+heavenly+Judge%2C+when+he+shall+have+called+us+to+account.+Truly+while+among+men+the+comparison+holds+good%3B+each+one+supposes+he+has+what+is+of+some+worth+and+value.+But+when+we+rise+to+the+heavenly+tribunal+and+place+before+our+eyes+that+supreme+Judge+%28not+such+as+our+intellects+of+their+own+accord+imagine%2C+but+as+he+is+described+to+us+in+Scripture+%5Bnamely%2C+by+whose+brightness+the+stars+are+darkened%3B+at+whose+strength+the+mountains+melt%3B+by+whose+anger+the+earth+is+shaken%3B+whose+justice+not+even+the+angels+are+equal+to+bear%3B+who+does+not+make+the+guilty+innocent%3B+whose+vengeance+when+once+kindled+penetrates+even+to+the+lowest+depths+of+hell%5D%29%2C+then+in+an+instant+the+vain+confidence+of+men+perishes+and+falls+and+conscience+is+compelled+%28whatever+it+may+have+proudly+boasted+before+men+concerning+its+own+righteousness%29+to+deprecate+the+judgment+and+to+confess+that+it+has+nothing+upon+which+it+can+rely+before+God.+And+so+it+cries+out+with+David%2C+%E2%80%9CLord%2C+if+thou+marked+iniquity%2C+who+can+stand%3F%E2%80%9D%3B+and+elsewhere%2C+%E2%80%9CEnter+not+into+judgment+with+thy+servant%2C+because+no+flesh+will+be+justified+in+thy+sight.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elentic+Theology+16.2.7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdb4b7b9fd4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/db4b7b9fd4.html">Permalink</a><a class="src" href="https://heidelblog.net/2019/11/turretin-talking-like-luther-on-justification/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

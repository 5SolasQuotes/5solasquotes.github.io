<main class="wrap"><figure class="quote" id="q-9c4add85b0" data-kw="">
<blockquote><p>They say, we are justified by works, as by causes thereof: we say, that we are justified by works as by signs and fruits of our justification before God, and no otherwise.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-41a65a8c0f" data-kw="">
<blockquote><p>For they again affirm that we are truly righteous, and not merely counted so. I, on the contrary, while I admit that we are never received into the favor of God without being at the same time regenerated to holiness of life, contend that it is false to say that any part of righteousness (justification) consists in quality, or in the habit which resides in us, and that we are righteous (justified) only by gratuitous acceptance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on the decree (ch. 7, the formal cause)</span></figcaption>

— John Calvin, Acts of the Council of Trent with the Antidote, Antidote to the Sixth Session, on the decree (ch. 7, the formal cause)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+they+again+affirm+that+we+are+truly+righteous%2C+and+not+merely+counted+so.+I%2C+on+the+contrary%2C+while+I+admit+that+we+are+never+received+into+the+favor+of+God+without+being+at+the+same+time+regenerated+to+holiness+of+life%2C+contend+that+it+is+false+to+say+that+any+part+of+righteousness+%28justification%29+consists+in+quality%2C+or+in+the+habit+which+resides+in+us%2C+and+that+we+are+righteous+%28justified%29+only+by+gratuitous+acceptance.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Acts+of+the+Council+of+Trent+with+the+Antidote%2C+Antidote+to+the+Sixth+Session%2C+on+the+decree+%28ch.+7%2C+the+formal+cause%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F41a65a8c0f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/41a65a8c0f.html">Permalink</a><a class="src" href="https://www.uecf.net/books/acts-trent-4/chapter18.html" rel="noopener" target="_blank">Read it online · UECF (Calvin&#x27;s Tracts)</a></div>
</figure><figure class="quote" id="q-8f4d3c1b67" data-kw="">
<blockquote><p>The thing (says he) that makes us righteous before God, and causes us to be accepted to life everlasting, is remission of sins, and the habit of inward righteousness, or charity with the fruits thereof. We condescend and grant that the habit of righteousness, which we call sanctification is an excellent gift of God … yet we deny it to be the thing, which makes us of sinners to become righteous or just before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Doctrine Touching the Justification of a Sinner</cite></span></figcaption>

</figure><figure class="quote" id="q-a8c10b0015" data-kw="">
<blockquote><p>By so doing we by no means establish as the formal cause of our justification that essential righteousness of Christ, which is itself His deity, or the supreme purity and holiness of His humanity, or His sufferings absolutely considered, which ceased together with His earthly life. But we say that the merit of His sufferings (παθημάτων) is the material cause of our justification, which is substituted in place of our guilt, inborn corruption, and all our sins that flow forth from that sewer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defense of Justification through the Righteousness of Christ Alone</cite>, reply to the Anonymous Man’s Third Argument</span></figcaption>

</figure><figure class="quote" id="q-981534aee3" data-kw="">

<main class="wrap"><figure class="quote" id="q-7cfff724f8" data-kw="">
<blockquote><p>I. As the ceremonial law was concerned with God, the political was concerned with the neighbor.

II. In those matters on which it is in harmony with the moral law and with ordinary justice, it is binding upon us.

III. In those matters which were peculiar to that law and were prescribed for the promised land or the situation of the Jewish state, it has not more force for us than the laws of foreign commonwealths.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium theologiae christianae</cite>, 14.6 in Reformed Dogmatics, trans. John W. Beardslee III (New York: Oxford University Press, 1965), 84.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f6fcaf3bc6" data-kw="">
<blockquote><p>The use of the judicial, or civil laws, was, That they might contribute to the preservation of the Mosaic polity. That they might be types of the government of the church in the kingdom of Christ, inasmuch as the princes and kings of the Jewish nation were no less, than the priests a type of Christ, the High Priest and King of the Church. These uses, together with the laws themselves, were done away with when the ceremonies of the former dispensation were fulfilled and abrogated by the coming of Christ, and the Mosaic polity overthrown by the Romans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. G. W. Williard (Cincinnati, OH: Elm Street Printing Company, 1888), 612.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-9bf5295772" data-kw="">
<blockquote><p>Answer. None of us do teach that it is against the light of nature that the adverse party be the judge; it might fall out in a general council lawfully convened, from which there is no provocation; yea and in a national council (for all councils may err) the adverse party may judge, as it was a lawful council according to a Church-constitution that condemned Christ of blasphemy, and they were also his enemies;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, pp. 456-7</span></figcaption>

</figure><figure class="quote" id="q-8328ff6a8d" data-kw="">
<blockquote><p>He marries her to Himself in righteousness, compassion, faithfulness and love: He puts a robe about her and a ring upon her hand, a tyre upon her head, shoes upon her feet: furnishes her with all his treasure: kills the fat calf, makes her a royal feast…</p></blockquote>

</figure><figure class="quote" id="q-5a4fe470af" data-kw="">
<blockquote><p>1. Thou shalt not hurt thy own body. One may be guilty of self-murder… (1.) Indirectly and occasionally, as: First, When a man thrusts himself into danger which he might prevent; as if a company of archers were shooting, and one should go and stand in the place where the arrows fly, if the arrow did kill him, he is accessory to his own death. In the law, God would have the leper shut up, to keep others from being infected. Lev. 23:4. Now, if any would be so presumptuous as to go in to the leper, and get the plague of leprosy, he might thank himself; he occasioned his own death. Secondly, A person may be in some sense guilty of his own death, by neglecting the use of means. If sick, and use no physic, if he has received a wound and will not apply balsam, he hastens his own death. God appointed Hezekiah to lay a ” lump of figs upon the boil,” Isa. 38:21. If he had not used the lump of figs, he had been the cause of his own death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity, ‘Of Sanctification’</cite>, on the 6th Commandment</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<main class="wrap"><figure class="quote" id="q-c9f03dff6b" data-kw="">
<blockquote><p>Thus also He made man with free will; and although ignorant of his future fall, yet therefore happy, because he thought it was in his own power both not to die and not to become miserable. And if he had willed by his own free will to continue in this state of uprightness and freedom from sin, assuredly without any experience of death and of unhappiness he would have received by the merit of that continuance the fulness of blessing with which the holy angels also are blessed; that is, the impossibility of falling any more, and the knowledge of this with absolute certainty. For even he himself could not be blessed although in Paradise, nay, he would not be there, where it would not become him to be miserable, if the foreknowledge of his fall had made him wretched with the dread of such a disaster.

But because he forsook God of his free will, he experienced the just judgment of God, that with his whole race, which being as yet all placed in him had sinned with him, he should be condemned. For as many of this race as are delivered by God’s grace are certainly delivered from the condemnation in which they are already held bound. Whence, even if none should be delivered, no one could justly blame the judgment of God. That, therefore, in comparison of those that perish few, but in their absolute number many, are delivered, is effected by grace, is effected freely: thanks must be given, because it is effected, so that no one may be lifted up as of his own deservings, but that every mouth may be stopped, and he that glorieth may glory in the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Rebuke and Grace</cite>, (c. 427), 28 in Nicene and Post-Nicene Fathers 1, 5: 483.</span></figcaption>

uotes.github.io%2Fquote%2Fc9f03dff6b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c9f03dff6b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/07/04/augustine-of-hippo-on-adams-potentiality-to-attain-eternal-life/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c0a8461753" data-kw="">
<blockquote><p>Firstly, when we reflect upon God with whom man has to do, He is the just Judge of all the earth, the thrice-holy God, standing with the unregenerate sinner in the relationship of the covenant of works; in the which all His attributes and perfections are armed against the sinner, and His sword is unsheathed to do away with him; his tears and sighs, reformation of life and seeking of God, can in no way suffice Him; His justice must be satisfied before He can show friendship with the sinner; but neither angels nor men can satisfy it; it is Immanuel alone who has done it, but none has a part in Him without faith. Hence God being just, men cannot please Him without faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-comrie.html">Alexander Comrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ABC of Faith</cite>, trans. J. Marcus Banfield (1746; Ossett: Zoar Publications, 1978), xviii.</span></figcaption>

</figure><figure class="quote" id="q-b72020f7f1" data-kw="eternal life">
<blockquote><p>However, the received opinion among the orthodox is that the promise given to Adam was not only of a happy life to be continued in paradise, but of a heavenly and eternal life (to which he was to be carried after the course of perfect obedience and perseverance had been run). The law of works had the promise of heavenly and eternal life; therefore also the law prescribed to Adam. In each instance, it is the same law as to substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.6.3-4</span></figcaption>

</figure><figure class="quote" id="q-84de65cf2d" data-kw="">
<blockquote><p>V. The covenant of nature is that which God the Creator made with innocent man as his creature, concerning the giving of eternal happiness and life under the conditions of perfect and personal obedience. It is called “natural,” not from natural obligation (which God does not have towards man it is also called “legal” because the condition on man’s part was the observation of the law of nature engraved within him; and of works because it depended upon works or his proper obedience.

XIV. Although man was already bound to this obedience by a natural obligation as a rational creature, necessarily subject to the dominion of God and his law, yet he was more strongly bound by a federal obligation which God so stipulated that man–by the powers received in creation–could perform it, although in order that he might actually perform it, he still needed the help of God both to actuate these faculties and powers and to preserve them from change. This help did not tend to the infusion of any new power but only to exercising the efficacy of that power which he had received. Now this did not belong properly to the covenant of nature, but always depended on the most free good pleasure (eudokia) of God; Otherwise the covenant of nature has been immutable, And man had never sinned.

XV. The sanction of the covenant attended the exaction of duty. It consisted both in the promise of reward and gain and in the threatening of punishment. The promise was of the highest happiness (of eternal life) to be passed not on earth but in heaven. The threatening was of death and whatever in scripture comes under the name of death to express punishment of all kinds (into which man by his own sin deservedly fell). XVI. However, from this pact arises the mutual obligation of the parties, differing according to their condition. With respect to man, not only was it from the pact, but absolute and simple from the nature of the thing (and on account of God, to whom man as a creature to the Creator, the beneficiary to the Benefactor, owed himself wholly and whatever he had to God and was bound to love him with his whole heart). But with respect to God, it was gratuitous, as depending upon a pact or gratuitous promise (by which God was bound not to man, but to himself and to his own goodness, fidelity and truth, Rom. 3:3; 2 Tim 2:13). Therefore there was no debt (properly so called) from which man could derive a right, but only a debt of fidelity, arising out of the promise by which God demonstrated his infallible and immutable constancy in truth. If the apostle seems to acknowledge this right or debt (Rom. 4:4), it must be understood in no other than a respective sense; not as to the proportion and condignity of the duty rendered to God by man (Rom. 8:18; Lk. 17:10), but to the pact of God and justice (i.e., the fidelity of him making it). XVII. If therefore upright man in that state had obtained this merit, it must not be understood properly and rigorously. Since man has all things from and owes all to God, he can seek from him nothing as his own by right, nor can God be a debtor to him–not by condignity of work and from its intrinsic value (because what ever that may be, it can bear no proportion to the infinite reward of life), but from the pact and the liberal promise of God (according to which man had the right of demanding the reward to which God had of his own accord bound himself) and in comparison with the covenant of grace (which rests upon the sole merit of Christ, by which he acquired for us the right to life). However, this demanded antecedently a proper and personal obedience by which he obtained both his own justification before God and life, as the stipulated reward of his labors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George Musgrave Giger (Phillipsburg: P&amp;R Publishing, 1992), Eighth topic, Q. 3, §§5, 14-17 . (vol. 1.575, 577–78).</span></figcaption>

%28into+which+man+by+his+own+sin+deservedly+fell%29.+XVI.+However%2C+from+this+pact+arises+the+mutual+obligation+of+the+parties%2C+differing+according+to+their+condition.+With+respect+to+man%2C+not+only+was+it+from+the+pact%2C+but+absolute+and+simple+from+the+nature+of+the+thing+%28and+on+account+of+God%2C+to+whom+man+as+a+creature+to+the+Creator%2C+the+beneficiary+to+the+Benefactor%2C+owed+himself+wholly+and+whatever+he+had+to+God+and+was+bound+to+love+him+with+his+whole+heart%29.+But+with+respect+to+God%2C+it+was+gratuitous%2C+as+depending+upon+a+pact+or+gratuitous+promise+%28by+which+God+was+bound+not+to+man%2C+but+to+himself+and+to+his+own+goodness%2C+fidelity+and+truth%2C+Rom.+3%3A3%3B+2+Tim+2%3A13%29.+Therefore+there+was+no+debt+%28properly+so+called%29+from+which+man+could+derive+a+right%2C+but+only+a+debt+of+fidelity%2C+arising+out+of+the+promise+by+which+God+demonstrated+his+infallible+and+immutable+constancy+in+truth.+If+the+apostle+seems+to+acknowledge+this+right+or+debt+%28Rom.+4%3A4%29%2C+it+must+be+understood+in+no+other+than+a+respective+sense%3B+not+as+to+the+proportion+and+condignity+of+the+duty+rendered+to+God+by+man+%28Rom.+8%3A18%3B+Lk.+17%3A10%29%2C+but+to+the+pact+of+God+and+justice+%28i.e.%2C+the+fidelity+of+him+making+it%29.+XVII.+If+therefore+upright+man+in+that+state+had+obtained+this+merit%2C+it+must+not+be+understood+properly+and+rigorously.+Since+man+has+all+things+from+and+owes+all+to+God%2C+he+can+seek+from+him+nothing+as+his+own+by+right%2C+nor+can+God+be+a+debtor+to+him%E2%80%93not+by+condignity+of+work+and+from+its+intrinsic+value+%28because+what+ever+that+may+be%2C+it+can+bear+no+proportion+to+the+infinite+reward+of+life%29%2C+but+from+the+pact+and+the+liberal+promise+of+God+%28according+to+which+man+had+the+right+of+demanding+the+reward+to+which+God+had+of+his+own+accord+bound+himself%29+and+in+comparison+with+the+covenant+of+grace+%28which+rests+upon+the+sole+merit+of+Christ%2C+by+which+he+acquired+for+us+the+right+to+life%29.+However%2C+this+demanded+antecedently+a+proper+and+personal+obedience+by+which+he+obtained+both+his+own+justification+before+God+and+life%2C+as+the+stipulated+reward+of+his+labors.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+trans.+George+Musgrave+Giger+%28Phillipsburg%3A+P%26R+Publishing%2C+1992%29%2C+Eighth+topic%2C+Q.+3%2C+%C2%A7%C2%A75%2C+14-17+.+%28vol.+1.575%2C+577%E2%80%9378%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F84de65cf2d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/84de65cf2d.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/04/turretin-on-merit-in-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>4 Thesis

For in the absolute Covenant [of grace], there is nothing in the creature that doth impel God either to promise, or to perform what he hath promised, or to perform what he hath promised; But in that Covenant [of works] to which a restipulation is annexed, God doth fulfil what he hath promised, because the creature hath rendered what is required; And although God hath made such a Covenant, wherein he hath promised so great things, upon condition of man’s performance, yet all this proceeds from the antecedent love of God.</p></blockquote>

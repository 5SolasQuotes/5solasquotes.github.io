<main class="wrap"><figure class="quote" id="q-a18f08e0ca" data-kw="">
<blockquote><p>I seek not to obtrude unto you any private opinion of mine own; the best learned in our profession are of this judgement, that all the corruptions of the Church of Rome, do not prove her to deny the foundation directly; if they did, they should grant her simply to be no Christian Church. But I suppose, saith one, that in the Papacy some Church remaineth, a Church crased [cracked], or, if you will, broken quite in pieces, forlorn, mishapen, yet some Church: his reason is this, Antichrist must sit in the Temple of God.

Least any man should think such sentences as these to be true, only in regard of those, whom that Church is supposed to have kept by the special providence of God, as it were in the secret corners of his bosom, free from infection, and as sound in the faith, as we trust, by his mercy, we our selves are: I permit it to your wise considerations, whether it be more likely, that as frenzy, though it self take away the use of reason, doth notwithstanding prove them reasonable creatures which have it, because none can be frantic but they: so Antichristianity being the bain, and plain overthrow of Christianity, may nevertheless argue the Church wherein Antichrist sitteth, to be Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Discourse of Justification, Works, and how the Foundation of Faith is Overthrown</cite>, (Oxford: Joseph Barnes, 1612), p. 45.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c796ddfe0" data-kw="">
<blockquote><p>It is alleged against the Church of Rome being Antichrist—say they, how can he be Antichrist that professes Christ? To that it may be answered, that he is a great deal the more Antichrist for that, for he is a [great] deal the worse for it; and the worse he is, surely the more anti-Christ, against Christ. Now certainly, those wickednesses that are professed, est[ablished] and commanded by that church are much the worse for their profession of Christ, for that professing the fundamental articles of the Christian faith. They ever deny Christ, in being so contrary to him. So that now they are much more against Christ, because they profess him, than it is possible for any of those that do not profess Christ to be; more anti-Christ than it is possible for a heathenish, Jewish, or Mahometan church to be.

To illustrate it by example: thus the filthiness of a snake or toad is much more abominable for being joined with life, which is in itself excellent, than the same filthiness and shape would be in lifeless matter. Thus again, the hatefulness of the devil is much greater for its being united with an angelical nature. So there is as much difference [between] the Church of Rome and heathens, Jews, or Mahometans, as there is between a viper or some loathsome, poisonous, crawling monster, and lifeless filthy matter of the same shape.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>hh. Antichrist in The “Miscellanies”: (Entry Nos. a-z, aa-zz, 1-500)</cite></span></figcaption>

</figure><figure class="quote" id="q-da164ea75b" data-kw="">
<blockquote><p>Qu. What reason have we to think that the Pope about that time began to be the great Antichrist.

Ans. For answer: We are to know that there are two particular characters of the Beast, as some Divines have observed out of the text, the former the cause of the later, viz. 1. Blasphemy; for he is full of names of blasphemy, Rev. 17.3. by which understand heresy and Idolatry. 2. cruelty, for he is a scarlet-coloured beast, and makes war with the Saints, ibid. &amp; ch. 13.7. But both these flow from an higher principle, which is (as I may say) proprium quarti modi, and a more convertible character of the beast, and that is his primacy or supremacy: This supremacy hath in it two things that make it up; one is a claiming of authority over the consciences of men, and so over their faith and worship; secondly the extending of this power to all Churches in all Nations.

I will not say that these two are the same thing, nor that they issue both from one and the same root; but surely this I may say, they are near a kin &amp; have their roots not far asunder, because they are generally still found in one and the self same person.

That both these meet in the grand Antichrist will appear.

First, he arrogates authority over the soul; so much I take to be intimated in those words of Daniel speaking of him, Dan. 7.25 He shall speak great words against the most high, and think to change times and laws; that he shall arrogate power to himself to change Gods laws, as in coining and altering Articles of Faith, appointing worship for God, &amp;c. high words, great words against God; so the Apostle, 2 Thes. 2.4. He as God sits in the Temple of God, shewing himself that he is God. How does he that? viz. by Lording it over the consciences of Gods people as if he were God, and thereby he deprives Christ of one of the principal Flowers of his Crown, which is to have dominion over the Faith: see more for this. Rev. 13.5 6.15, 16.

Secondly, the great Antichrist is to extend this power, at least, presumptively and intentionally where he cannot do it actually over all Kindreds, Tongues and Nations, Rev. 13.7.

It is Antichristian to claim such authority, though but over one man, or one Church; It is more Antichristian to claim such authority over many Churches, as the Hierarchical Bishop useth to do; it is yet more Antichristian to claim this authority over whole Provinces as the Hierarchical Archbishop useth to do; it is yet still more Antichristian to claim it over many Provinces &amp; Kingdoms, as the Hierarchical Patriarch useth to do; but yet all these do not amount to the grand Antichrist, why? because there may be a greater; but now he that claims such sovereignty over all the Churches of the world is the grand Antichrist indeed, for there can be no greater.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-reyner.html">William Reyner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Babylon’s ruining-earthquake and the restoration of Zion delivered in a sermon before the honourable House of Commons at Margaret’s Westminster, at their public fast, August 28, 1644</cite>, (London: Samuel Enderby, 1644), pp 33-34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

%2C+2+Thes.+2.4.+He+as+God+sits+in+the+Temple+of+God%2C+shewing+himself+that+he+is+God.+How+does+he+that%3F+viz.+by+Lording+it+over+the+consciences+of+Gods+people+as+if+he+were+God%2C+and+thereby+he+deprives+Christ+of+one+of+the+principal+Flowers+of+his+Crown%2C+which+is+to+have+dominion+over+the+Faith%3A+see+more+for+this.+Rev.+13.5+6.15%2C+16.%0A%0ASecondly%2C+the+great+Antichrist+is+to+extend+this+power%2C+at+least%2C+presumptively+and+intentionally+where+he+cannot+do+it+actually+over+all+Kindreds%2C+Tongues+and+Nations%2C+Rev.+13.7.%0A%0AIt+is+Antichristian+to+claim+such+authority%2C+though+but+over+one+man%2C+or+one+Church%3B+It+is+more+Antichristian+to+claim+such+authority+over+many+Churches%2C+as+the+Hierarchical+Bishop+useth+to+do%3B+it+is+yet+more+Antichristian+to+claim+this+authority+over+whole+Provinces+as+the+Hierarchical+Archbishop+useth+to+do%3B+it+is+yet+still+more+Antichristian+to+claim+it+over+many+Provinces+%26+Kingdoms%2C+as+the+Hierarchical+Patriarch+useth+to+do%3B+but+yet+all+these+do+not+amount+to+the+grand+Antichrist%2C+why%3F+because+there+may+be+a+greater%3B+but+now+he+that+claims+such+sovereignty+over+all+the+Churches+of+the+world+is+the+grand+Antichrist+indeed%2C+for+there+can+be+no+greater.%E2%80%9D%0A%0A%E2%80%94+William+Reyner%2C+Babylon%E2%80%99s+ruining-earthquake+and+the+restoration+of+Zion+delivered+in+a+sermon+before+the+honourable+House+of+Commons+at+Margaret%E2%80%99s+Westminster%2C+at+their+public+fast%2C+August+28%2C+1644%2C+%28London%3A+Samuel+Enderby%2C+1644%29%2C+pp+33-34.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fda164ea75b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/da164ea75b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/04/29/william-reyner-on-the-tyranny-of-the-papal-antichrist/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

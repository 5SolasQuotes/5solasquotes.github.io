<main class="wrap"><figure class="quote" id="q-a75eb106e6" data-kw="">
<blockquote><p>Sanctification, as here described, is the immediate work of God by his Spirit upon our whole nature, proceeding from the peace made for us by Jesus Christ, whereby, being changed into his likeness, we are kept entirely in peace with God, and are preserved unblamable, or in a state of gracious acceptation with him, according to the terms of the covenant, unto the end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 3 (Edinburgh: T&amp;T Clark, n.d.), 369.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c626d585fe" data-kw="">
<blockquote><p>Q. 23. Is it correct to say that the righteousness of the Mediator is imputed to us in justification and infused in sanctification? …it is not the same righteousness of Christ that occurs in its two parts. When I speak of an imputed righteousness of the Mediator, then I mean that righteousness that He obtained by means of his suffering and dying and obedience in the state of humiliation–not, however, the righteousness of life of the human nature of Christ, that is, that Christ in his human nature now possesses. The latter is not imputed to me. And, conversely, the former cannot be infused into me; it can only be reckoned to me. Really, one cannot even say that the righteousness in which Christ now lives is infused into me. This always rests on a more or less unclear mystical conception. It is not the personal righteousness of Christ that is infused into the believer, for, as an inherent quality, righteousness cannot be detached from the person. Q. 24 Is then no ‘holiness’ of Christ imputed to us? Yes; by that term, if one wishes, one can designate his active obedience, imputed to us in justification. As our [Heidelberg] Catechism states in the answer to question 60, ‘How are you righteous before God?… God grants and imputes to me the perfect satisfaction, righteousness, and holiness of Christ,’ etc. In this sense, one may thus then say that Christ is not only our sanctification but also our holiness before God.</p></blockquote>

</figure><figure class="quote" id="q-019380f2df" data-kw="">
<blockquote><p>Those who seek to be justified through the works of the Law not only fail to crucify their flesh but even increase its lusts—so far are they from being able to be justified. For the Law is the strength of sin (1 Corinthians 15:56) in that it stimulates lust and its contrary inclination even while forbidding it. But since faith in Christ loves the Law, which forbids lust, it now does the very thing the Law commands; it attacks and crucifies lust.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Day by Day</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

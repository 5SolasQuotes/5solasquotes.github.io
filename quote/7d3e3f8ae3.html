<main class="wrap"><figure class="quote" id="q-7d3e3f8ae3" data-kw="">
<blockquote><p>I had never read one Socinian, nor much of any Arminians… and I remembered two or three things in Dr. [William] Twisse (whom I most esteemed) which inclined me to moderation in the five Articles [disputed between Arminians and the Reformed]: … 2. That he reduces all the decrees to two, de fine et de mediis [of the end and of the means], as the healing way. 3. That he professes that Arminius and we and all the Schoolmen are agreed that there is no necessity consequentis laid on us by God in predestination, but only necessity consequentiae, or [a] logical [necessity] (but in election I shall here suspend)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology, Plain, Pure, Peaceable... (London: White, 1675), Preface, n.p.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dbd41de817" data-kw="">
<blockquote><p>(2) Necessity is distinguished into antecedent and consequent. The former is what arises from a necessary antecedent cause: with which posited, the effect is necessarily posited. The latter is what arises, not from the antecedent cause, but from the very positing of the effect, even if it be of a contingent and free cause. The former necessity removes contingency and liberty: the latter [necessity] leaves it intact. For, those things that happen freely and contingently, by that very fact that they are, are not able not to be: because of the evident contradiction that would otherwise be implied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-wendelin.html">Marcus Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology, Secondary Attributes of God, pt. 1</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-4941084f95" data-kw="">
<blockquote><p>Today, the doctors of the Roman Church accuse the Protestants of denying free will; where, however, it should be noted that the question is not about the state of Integrity… But when they deal with the state of sin, they attribute to Luther, Calvin and other reformers that they teach that free will was utterly extinguished and lost through the Lapse of Adam, and therefore that man after the Lapse does not have free will. But it never came into the mind of the Protestants to simply deny free will, even after the lapse, neither with respect to natural works, nor civil, nor moral works of the natural order; but they only denied the rectitude and sanity of free will, and its natural powers for spiritual good, in which matter they followed Augustine, Enchiridion, ch. 30, ‘Man, by making bad use of free will, destroyed both himself and it.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfuz.html">Barthold Holtzfuz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707)</cite>, p. 5 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-c952601d72" data-kw="">
<blockquote><p>…whereas original sin does necessarily incline him to sinful actions and courses in general; though to this kind of sin in special, or to this particular, in what kindsoever, it does not… when once God has planted in us a principle of new life, of the life of grace, by the spirit of regeneration, though all the powers thereof do incline only to that which is good, like as the powers of natural corruption incline only unto evil, yet the particular use and exercise of those is always free: Like as the particular use and exercise of the powers of our corruption is always free to the committing of this or that sin according unto emergent occasions standing in congruity to every man’s particular disposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy… (d. 1646; Oxford, 1653), bk. 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions</cite>, sect. 8, p. 103</span></figcaption>

<blockquote><p>§XVI. In the prestituted state or the State of Glory, the blessed will be free even from misery itself and from the sense or root of sin. Concerning which state Augustine in his Enchiridion, ch. 105, says: “free will will be much more free, because it will be altogether unable to serve sin.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-35beddc22d" data-kw="">
<blockquote><p>And such a hope ought especially to encourage us to repent, for we see that God is ready to receive us and seeks reconciliation with us, and is always prepared to forgive all our sins, provided we from the heart return to Him; and He seems as one unwilling to inflict punishment.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a721c77241" data-kw="">
<blockquote><p>Those invitations, when considered as calls, to perform the duties of believing and repenting, belong to the law; but when viewed as expressions of the readiness, or willingness of God, to bestow salvation on sinners, and, as affording them an additional warrant to trust in the compassionate Savior for it, they form a part of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, p. 119</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

— John Colquhoun, A Treatise on the Law &amp; Gospel, p. 119">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThose+invitations%2C+when+considered+as+calls%2C+to+perform+the+duties+of+believing+and+repenting%2C+belong+to+the+law%3B+but+when+viewed+as+expressions+of+the+readiness%2C+or+willingness+of+God%2C+to+bestow+salvation+on+sinners%2C+and%2C+as+affording+them+an+additional+warrant+to+trust+in+the+compassionate+Savior+for+it%2C+they+form+a+part+of+the+gospel.%E2%80%9D%0A%0A%E2%80%94+John+Colquhoun%2C+A+Treatise+on+the+Law+%26+Gospel%2C+p.+119&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa721c77241.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a721c77241.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=Those%20invitations%2C%20when%20considered%20as%20calls,form%20a%20part%20of%20the%20gospel&amp;text=Those%20invitations%2C%20when%20considered%20as%20calls%2C%20to%20perform&amp;text=it%2C%20they%20form%20a%20part%20of%20the%20gospel" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-93f922d54e" data-kw="">
<blockquote><p>3. Behold the extent of his willingness to receive sinners. The sinner sometimes says, ‘I am willing to receive Christ, but He is not willing to receive me.’ But what says the text? ‘Behold I stand at the door and knock.’ Does not this imply his readiness and willingness to come in? Nor is this all—He calls, ‘Open unto Me—open unto Me.’ Nor is this all—He says, ‘if any man hear my voice and open the door, I will come in.’ He positively declares that He is willing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/asahel-nettleton.html">Asahel Nettleton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Remains of the Late Rev. Asahel Nettleton</cite>, ed. B. Tyler (Hartford: Robins &amp; Smith, 1845), Sermon 25, ‘Christ Standing at the Door’, pp. 300-302</span></figcaption>

</figure><figure class="quote" id="q-00dfc149ac" data-kw="">
<blockquote><p>Mercy is especially to be attributed to God, as seen in its effect, but not as an affection of passion… To sorrow, therefore, over the misery of others belongs not to God; but it does most properly belong to Him to dispel that misery, whatever be the defect we call by that name. Now defects are not removed, except by the perfection of some kind of goodness; and the primary source of goodness is God, as shown above (Q. 6, A. 4). It must, however, be considered that to bestow perfections appertains not only to the divine goodness, but also to His justice, liberality, and mercy; yet under different aspects. The communicating of perfections, absolutely considered, appertains to goodness, as shown above (Q. 6, AA. 1, 4); in so far as perfections are given to things in proportion, the bestowal of them belongs to justice, as has been already said (A. 1); in so far as God does not bestow them for His own use, but only on account of His goodness, it belongs to liberality; in so far as perfections given to things by God expel defects, it belongs to mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 | quest. 21 | art. 3, Whether mercy can be attributed to God, I answer that</span></figcaption>

rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4ea84f799e" data-kw="">
<blockquote><p>…I only now advise every one who is kept from believing by this, that he knows not whether he be contained under the pardon or no, not to look to God’s secret will, but to attend to God’s revealed will in his Word, wherein it is expressly said that God would have no man to perish, but would have all men come to repentance [2 Pet. 3:9]; and so oft. That He desires not the death of a sinner [Eze. 18:23,32], that hereby he may be moved to seek and hope for that mercy, which God is so willing to bestow upon him, if the fault be not in his own self, as it was in the unbelieving Jews in Jerusalem, of whom our Savior complained, saying, ‘How often would I have gathered thy Children, as the Hen gathereth her Chickens under her wings, and ye would not?’ [Mt. 23:37] A further manifestation of this willingness in God to save sinners, may be seen in his gracious invitation of the unworthiest to come to the wedding of his Son [Mt. 22:2-3]: yea, more by his beseeching sinners to be reconciled to Him [2 Cor. 5:20]: and by the many and weighty arguments He uses to persuade men to believe, by the great rewards, earthly and spiritual, temporal and eternal, which all believers shall enjoy; and by the fearful woes which shall fall on all unbelievers, both in this life, and that to come, as plentifully is to be seen throughout the Scriptures.</p></blockquote>

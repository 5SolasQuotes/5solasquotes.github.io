— Samuel Rutherford, The Due Right of Presbyteries (1644), pt. 1, p. 241">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6if+Rome%E2%80%99s+baptism+be+lawful+in+its+essence%2C+so+is+Rome%E2%80%99s+ministry.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries+%281644%29%2C+pt.+1%2C+p.+241&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F39f2ddc76a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/39f2ddc76a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/is-roman-catholic-baptism-valid/#:~:text=if%20Rome%E2%80%99s%20baptism%20be%20lawful%20in%20its%20essence%2C%20so%20is%20Rome%E2%80%99s%20ministry" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9c339dc602" data-kw="">
<blockquote><p>Some choose to refer this [Acts 14:23] to laying on of hands, as if it also were altogether necessary, and under this pretense say, Our calling is null, because the Ordinaries [in the RCC] (as they call them) have not laid hands on us, or because we are not consecrated in the Church of Rome. I answer, by those canons which they boast of, the consecration is null, where there was not first a lawful choice, or which was done by one who is excommunicated: Let them show but one in all their hierarchy who is lawfully chosen, yea who is not by the very law a hundred times excommunicate[d], if they will stand to their own synods. Why should we therefore desire hands to be laid on us by them? Or by what law can they do it? But we have by the blessing of God certain marks of our calling, being (through the grace of God) adorned with the lawful testimony of our life and doctrine from our Churches, and after that by calling upon the name of God confirmed in our ministry, which God I hope will bless, and cast out both the thieves and hirelings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>on Acts 14:23, as quoted in Sidrach Simpson, Diatribe: Wherein the Judgment of the Reformed Churches &amp; Protestant Divines, is Shown Concerning Ordination, Laying on of Hands in Ordination of Ministers, &amp; Preaching by Those who are Not Ordained Ministers (London, 1647), pp. 14-15. Simpson was an Independent and Westminster divine.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a></span></div>
<div class="actions"><button class="copy" data-copy="“Some choose to refer this [Acts 14:23] to laying on of hands, as if it also were altogether necessary, and under this pretense say, Our calling is null, because the Ordinaries [in the RCC] (as they call them) have not laid hands on us, or because we are not consecrated in the Church of Rome. I answer, by those canons which they boast of, the consecration is null, where there was not first a lawful choice, or which was done by one who is excommunicated: Let them show but one in all their hierarchy who is lawfully chosen, yea who is not by the very law a hundred times excommunicate[d], if they will stand to their own synods. Why should we therefore desire hands to be laid on us by them? Or by what law can they do it? But we have by the blessing of God certain marks of our calling, being (through the grace of God) adorned with the lawful testimony of our life and doctrine from our Churches, and after that by calling upon the name of God confirmed in our ministry, which God I hope will bless, and cast out both the thieves and hirelings.”

— Theodore Beza, on Acts 14:23, as quoted in Sidrach Simpson, Diatribe: Wherein the Judgment of the Reformed Churches &amp; Protestant Divines, is Shown Concerning Ordination, Laying on of Hands in Ordination of Ministers, &amp; Preaching by Those who are Not Ordained Ministers (London, 1647), pp. 14-15. Simpson was an Independent and Westminster divine.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSome+choose+to+refer+this+%5BActs+14%3A23%5D+to+laying+on+of+hands%2C+as+if+it+also+were+altogether+necessary%2C+and+under+this+pretense+say%2C+Our+calling+is+null%2C+because+the+Ordinaries+%5Bin+the+RCC%5D+%28as+they+call+them%29+have+not+laid+hands+on+us%2C+or+because+we+are+not+consecrated+in+the+Church+of+Rome.+I+answer%2C+by+those+canons+which+they+boast+of%2C+the+consecration+is+null%2C+where+there+was+not+first+a+lawful+choice%2C+or+which+was+done+by+one+who+is+excommunicated%3A+Let+them+show+but+one+in+all+their+hierarchy+who+is+lawfully+chosen%2C+yea+who+is+not+by+the+very+law+a+hundred+times+excommunicate%5Bd%5D%2C+if+they+will+stand+to+their+own+synods.+Why+should+we+therefore+desire+hands+to+be+laid+on+us+by+them%3F+Or+by+what+law+can+they+do+it%3F+But+we+have+by+the+blessing+of+God+certain+marks+of+our+calling%2C+being+%28through+the+grace+of+God%29+adorned+with+the+lawful+testimony+of+our+life+and+doctrine+from+our+Churches%2C+and+after+that+by+calling+upon+the+name+of+God+confirmed+in+our+ministry%2C+which+God+I+hope+will+bless%2C+and+cast+out+both+the+thieves+and+hirelings.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+on+Acts+14%3A23%2C+as+quoted+in+Sidrach+Simpson%2C+Diatribe%3A+Wherein+the+Judgment+of+the+Reformed+Churches+%26+Protestant+Divines%2C+is+Shown+Concerning+Ordination%2C+Laying+on+of+Hands+in+Ordination+of+Ministers%2C+%26+Preaching+by+Those+who+are+Not+Ordained+Ministers+%28London%2C+1647%29%2C+pp.+14-15.+Simpson+was+an+Independent+and+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9c339dc602.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9c339dc602.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/is-roman-catholic-baptism-valid/#:~:text=Some%20choose%20to%20refer%20this%20%5BActs,out%20both%20the%20thieves%20and%20hirelings&amp;text=Some%20choose%20to%20refer%20this%20%5BActs%2014%3A23%5D%20to&amp;text=and%20cast%20out%20both%20the%20thieves%20and%20hirelings" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-373000dea1" data-kw="">
<blockquote><p>Hence, then, it is obvious that we do not at all deny that churches remain under his tyranny; churches, however, which by sacrilegious impiety he has profaned, by cruel domination has oppressed, by evil and deadly doctrines like poisoned potions has corrupted and almost slain; churches where Christ lies half-buried, the gospel is suppressed, piety is put to flight, and the worship of God almost abolished; where, in short, all things are in such disorder as to present the appearance of Babylon rather than the holy city of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a> › <a href="../topics/the-church/true-and-false-church/is-rome-a-true-church.html">Is Rome a true church?</a></span><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

— John Calvin, Institutes of the Christian Religion, 4.2.12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence%2C+then%2C+it+is+obvious+that+we+do+not+at+all+deny+that+churches+remain+under+his+tyranny%3B+churches%2C+however%2C+which+by+sacrilegious+impiety+he+has+profaned%2C+by+cruel+domination+has+oppressed%2C+by+evil+and+deadly+doctrines+like+poisoned+potions+has+corrupted+and+almost+slain%3B+churches+where+Christ+lies+half-buried%2C+the+gospel+is+suppressed%2C+piety+is+put+to+flight%2C+and+the+worship+of+God+almost+abolished%3B+where%2C+in+short%2C+all+things+are+in+such+disorder+as+to+present+the+appearance+of+Babylon+rather+than+the+holy+city+of+God.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+4.2.12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F373000dea1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/373000dea1.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-a391f5c7aa" data-kw="">
<blockquote><p>3rd Consideration. There is a separation from the Church in the most part, or from the Church in the least and best part. In Ahab’s time, Israel, and the Church thereof, for the most part, worshipped Baal; Elijah, Micah, Obadiah and other godly separated from the Church of Israel in the most part: Jeremiah wished to have a cottage in the wilderness (no doubt a godly wish) that he might separate from the Church all then for the most part corrupted, yet remained they a part of the visible Church and a part in the visible Church, and therefore did he not separate from the Church according to the least and best part thereof; The godly in England who refused the Popish ceremonies and Antichristian Bishops did well not to separate from the visible Church in England, and yet they separated from the mainest and worst part [in the Roman fold], which cannot be denied to be a ministerial Church. … 5th Consideration. I see not but we may separate from the Lord’s Supper where bread is adored, and from baptism where the sign of the cross is added to Christ’s ordinances, and yet are we not separated from the Church, for we professedly hear the word and visibly allow truth of the doctrine maintained by that Church which do pollute the sacraments, and we are ready to seal it with our blood, and it is an act of visible profession of a Church to suffer for the doctrine mentioned by that Church. 6. We may well hold that Ambrose says well that a Church wanting the foundation of the apostles is to be forsaken. 7. There is a forced separation through tyranny from personal communion, and a voluntary separation; David was forced to leave Israel and was cast out of the Inheritance of the Lord; the former is not our sin, and our separation from Rome has something of the former, the latter would be wisely considered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries... (1644) | pt. 2</cite>, pp. 253-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a></span></div>

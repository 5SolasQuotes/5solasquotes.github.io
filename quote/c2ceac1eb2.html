<main class="wrap"><figure class="quote" id="q-c2ceac1eb2" data-kw="">
<blockquote><p>We also seeing the standards of kings, princes and cities, we call the signs by the names of the kings, princes, and cities: for we say, ‘This is the king of France,’ ‘This is the prince of Germany, this is Tigur, this is Bern.’ So if we see the marriage ring, or the image of any prince, we call it the faith and trothe of wedlock, or man and wife, yea, and we say by the image, ‘This is the prince.’ For matrons showing their wedding ring, say, ‘this is my husband.‘</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly &amp; Learned Sermons Divided into Five Decades (1577), ‘Of Signs &amp; the Manner of Signs, of Sacramental Signs’, the Sixth Sermon</cite>, p. 990</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ffe2b06fc" data-kw="">
<blockquote><p>[The first time was when the ceremonial law was obliging under the Mosaic system.] The second time was from the ascension of Christ, till about the time of the destruction of the Temple and city: in which ceremonies ceased to bind conscience and remained indifferent. Hereupon Paul circumcised Timothy: the apostles after Christs ascension, as occasion was offered were present in the temple, Acts 3:1; And the council of Jerusalem tendering the weakness of some believers, decreed that the Church for a time should abstain from strangled [animals] and blood. And there was good reason of this, because the Church of the Jews was not yet sufficiently convicted that an end was put to the ceremonial law by the death of Christ. In the third time, which was after the publishing of the Gospel, ceremonies of the Jews Church became unlawful, and so shall continue to the world’s end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience wherein is set Down the Nature, Properties and Differences thereof: as also the way to get and keep good conscience (1596)</cite>, pp. 21-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>3. ‘Tis contrary to the example of the Apostles themselves, and condemns them as well as us, for they did not only teach and commend to the Churches that Reformation which Mr. Dell calls the mortifying or destroying of corruption and lust, or Christ dwelling and living in us, but likewise an external acclesiastical reformation, and several canons concerning the reformation of external abuses and scandals in the Church: as for instance, that the Churches should abstain from blood and things strangled; that two or three at most should prophesy in the Church at one meeting; that the men should pray with their heads uncovered, the women covered; that young widows should be no longer admitted to serve the Church in attending the sick and that such widows must be at least 60 years old, and the like.</p></blockquote>

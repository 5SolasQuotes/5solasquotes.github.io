<blockquote><p>That He doth not blame the Pharisees’ exactness in tithing mint, anise, rue, cummin, and all manner of herbs… The Levites having no inheritance: God ordained tithes for their maintenance; of which also the poor were to have a share, Lev. 27:30; Num. 18:24.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1e1e0634df" data-kw="">
<blockquote><p>Secondly, the farther that the members or Churches, either congregational, presbyterial, or national, are removed in local distance one from another, the less is the visible and external communion of rebuking, comforting, and admonishing one another; yet the power and obligation of these duties are not removed. So though the national Churches be locally distant one from another, yet their power of exercising duties… is not from thence concluded to be null. Yea, national duties upon occasion are still obligatory, and communion of men of sundry nations is clear to me, Isa. 2:3, ‘many nations shall flow unto the mountain of the Lord’s House,’ Zech. 8:23, ‘Ten men shall take hold out of all languages of the nations, they even shall take hold of the skirt of him that is a Jew, saying, we will go with you, for we have heard that God is with you.’ …the places [of Scripture] do well prove the power-lawful of performing duties, whereas the exercise of them in one place is not hic &amp; nunc, in ordinary providence, possible. And so this consequence must be weak: the whole catholic visible Churches in their principal guides cannot ordinarily and constantly meet, hic &amp; nunc, for the exercise of their power; Therefore they have no such power. For if the power be exercised in parts, which, through occurrences of providence and the corruption of men’s nature, cannot be exercised in whole at once, yet it’s not hence evinced [proven] to be a power not given of Christ for edification;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, pp. 300-301</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-27cd85be14" data-kw="">
<blockquote><p>The main body of the thesis explores the practice and experience of faith in the North East between 1560 and 1610 using three main themes. The first studies the Sabbath, the weekly fixture that was the heart of public worship and observance in the parish. Sacramental practice is the second theme with an in-depth study of the annual administration of Communion, which reinforced temporal and spiritual bonds among Kirk adherents and starkly exposed non-adherents and recusants. The final theme considers the role and position of ministers and readers in religious practice and investigates the relationship between them and their parishioners. From detailed analysis of these three themes, it is concluded that the North East as a whole was transformed into the general mould of Scottish Reformed Protestantism by 1610, but that there was a spectrum of practices and experiences of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catherine-mcmillan.html">Catherine McMillan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Keeping the Kirk: The Practice &amp; Experience of Faith in Northeast Scotland</cite>, 1560-1610 (2016) PhD dissertation, Univ. of Edinburgh This has been published in book form. | Abstract:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

ine</a></div>
</figure><figure class="quote" id="q-8e97531428" data-kw="">
<blockquote><p>This was it, which is here said to be according to the law: and that the judicial, ceremonial and moral law: 1. By the judicial law the Levites had not their portion in Canaan for their inheritance, as other tribes had: therefore in lieu thereof, by the said law they had the tenth of the rest of the people. 2. The holy services which they performed to the Lord for the people were ceremonial. Therefore the recompence given was by a like law. 3. The general equity that they who communicate unto us spiritual matters should partake of our temporals, and that they who are set apart wholly to attend God’s service should live upon that service, is moral.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, vol. 2, p. 108, section 40, ‘Of the law of paying tithes,’ on Heb. 7:5-7 Gouge (d. 1653) was an English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<blockquote><p>For the essence and lawful constitution of a church depends not on the outward circumstance of place, but on a due profession of faith, and bond of holy communion. For as [William] Ames says, ‘that same in profession does constitute a Church-visible, which in reality and its internal nature constitutes the Church-mystical, that is, faith.’ Marrow of Theology, bk. 1, ch. 32, thesis 7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/willhelm-apollonius.html">Willhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, p. 42 of ch. 3, ‘Of an Institute Visible Church’ in A Consideration of Certaine Controversies at this Time Agitated in the Kingdome of England, Concerning the Government of the Church of God (1645) Apollonius was a Dutch presbyterian, who is arguing against the English Independents.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-46949ae3c0" data-kw="">
<blockquote><p>But if God should but hold the Glass of his Law to some of your faces, to behold how loathsome you are in the Eyes of God) for so they are in God’s eye as this Glass presents them if they are not washed in the blood of Christ:) and it would be a dreadful sight to many a soul: But yet better that you saw it now while there are ways to cleanse your souls of their spots, than when you should die; for if when you should be at the point of Death, and be ready to go to the great God to Receive the sentence of your Eternal Doom; If conscience should hold the Glass of God’s Law before you, and there make you see the ugly face of your soul, spotted by sin, O! it would be a soul sinking sight unto you.

Learn you to look now into the Glass of the Law, and examine your soul by the holy Law of God, that you may see your spots there; many of you spend a great deal of time every morning in looking into the Glass, to see if all things be well in your face; Oh that you would but spend as much time in looking into the Law of God, and examining of your hearts by the word: There stands a Glass in the window, and there lies a Book on the shelf; Why may not the Law of God be as well taken, to look into your hearts, as the Glass taken to see your face in? People are little acquainted with this Glass; and therefore know not their own souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The difference between the spots of the godly and of the wicked preached by Mr. Jeremiah Burroughs at Cripple Gate</cite>, (London, 1668), pp 12-13.</span></figcaption>

</figure><figure class="quote" id="q-7456f1d0c7" data-kw="">
<blockquote><p>For our wills and affections; we should be ready to cross and bend them against all the noise of corrupt delights; to pluck out our right eye, cut off our right hand; to be crucified to the world; to be disposed of by God’s providence, cheerfully in any course, whether of passive obedience to have a mind submitting unto it, and rejoicing in it; or of active obedience to obey him, contrary to the stream and current of our natural desires; though it be to offer unto him our Isaac, our closest and choicest affection; though to shake off the child that hangeth about our neck, to stop our ear to the voice of her that bare us, to throw the wife out of our bosom, when they shall tempt us to neglect God, to spit out the sweetest sin that lies under our tongue; briefly, to take under Christ’s banners the Roman oath, to go and do where and whatsoever our great captain commanded; neither for fear of death, or dread of enemy, to forsake service, or resign weapon till death shall extort it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), iii, 58.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

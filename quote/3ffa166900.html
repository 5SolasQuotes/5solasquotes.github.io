<main class="wrap"><figure class="quote" id="q-3ffa166900" data-kw="">
<blockquote><p>2. There be two necessities of things, one natural, and first in that regard; another religious, and in that regard secondary. The former necessity does always stand, except God remove it by some posterior commandment. It’s necessary that Adam and Eve eat of all things that God created for eating. God (I grant) may remove this necessity in some, and command either Adam to fast for a time, or not to eat of the tree of Knowledge. So say I, warning by Bells [signaling that divine service is starting soon, though Romanists previously used them unto superstition] has a physical necessity, the use of the temples [church-buildings] in worshipping has the like necessity, so have gold and silver a necessity, God only, either by a commandment or by an exigence of providence that stands to us (as in the case of a scandal), for a command can remove the physical necessity and inhibit Israel to use such and such gold as has been in use in the heathen idols, and may forbid to perform an act of obedience to an affirmative command in the case of scandal, as he may forbid Paul to take wages for preaching the Gospel, though Paul have some natural necessity of taking wages. But the Church, without a higher warrant from God, has no power to restrain us in the necessary use that God has given us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), Appendix, ‘An Introduction to the Doctrine of Scandal’, p. 79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-84003b4470" data-kw="">
<blockquote><p>Besides, do not our divines require that the Church’s canons, even in matters of rite, be ‘profitable to the edification of the Church’ (Polanus, Syntagma, bk. 7, ch. 17); and that the observation of the same, must carry before it a manifest utility (Calvin, Institutes, bk. 4, ch. 10, §32); that in rites and ceremonies the Church has no power to destruction, but only to edification? (Chemnitz, Examination, part 2, p. 121)… Do they not teach that no idle ceremony, which serves not unto edifying, is to be suffered in the Church (Paraeus, on 1 Cor. 14:26; John Calvin, Epistolarum &amp; Responsorum, col. 478); and that godly bretheren are not holden to subject themselves unto such things as they perceive neither to be right nor profitable? (Calvin, on 1 Cor. 10:23; Taylor on Titus 1:15, p. 295) That whatsoever either would scandalize our brother, or not be profitable to him for his edification, Christians for no respect must dare to meddle with it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (Edinburgh, 1637) | pt. 2, ch. 1, p. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><figure class="quote" id="q-dcc315b710" data-kw="">
<blockquote><p>But may one say, if the decrees of a Synod concerning matters of faith or worship, may and ought to be examined by the sure rule of the Word of God, and only to be received when they do agree therewith; and if also the constitutions of a Synod in external circumstances do not bind, except ex aeque et bono [out of equity and good], and propter regula mandandi causas [due to commanding according to just causes]: or, as divines speak, in casu scandali &amp; contemptus [in the case of scandal and contempt], and not for the mere will or authority of a synod… as our divines maintain and prove against Papists. … Our divines, by those their tenets, mean not to open a door to disobedience and contempt of the ordinances of a synod, but only to oppugne the Popish error concerning the binding power of ecclesiastical laws, by the sole will and naked authority of the law-maker, and that Christian people ought not to seek any further reason or motive of obedience.</p></blockquote>

f%20obedience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Yea but none deserve in foro Ecclesiae, in the Church’s court to becast out, but such as either confess scandalous sins, or are contumacious, or convicted judicially of the same before witnesses, otherwayes the dearest to Christ, do legally before God deserve all to be cast out.</p></blockquote>

</figure><figure class="quote" id="q-ff2a372682" data-kw="">
<blockquote><p>For it is certain that many Roman pontiffs have erred, even when teaching ex cathedra, that is, determining controversies … Then who, I pray you, will be the supreme judge of the church, when the supreme pontiff hath fallen into heresy? Is he a fit person to be the supreme judge in religion, and one in whose judgment we should acquiesce, who may be, and is a heretic, as the very papists themselves confess? Surely, never. The supreme judge of all controversies must be such a one as can neither err nor prove a heretic: and such is Christ himself, that true High Priest, and the sacred scripture.</p></blockquote>

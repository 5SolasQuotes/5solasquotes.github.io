<main class="wrap"><figure class="quote" id="q-80072c86da" data-kw="">
<blockquote><p>For a condition does suspend that whereof it is a condition from existence, until it be accomplished… But it is not yet proved, nor ever will be, that whatever is required in them that are to be justified, is a condition whereon their justification is immediately suspended. We allow that alone to be a condition of justification which has an influence of causality thereunto, though it be but the causality of an instrument. This we ascribe unto faith alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, … (London: Boulter, 1677), p. 143</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2529fcd89b" data-kw="">
<blockquote><p>I will not stand in argument, whether faith be a part of repentance, or does by any other means depend upon it. It seems to me a notable point of folly to go about to tie matters of divinity to precepts of logic: for we learn not that of the Lord’s apostles.</p></blockquote>

</figure><figure class="quote" id="q-3127da08d0" data-kw="">
<blockquote><p>VI. (3) The question is not whether solitary faith (i.e. separated from the other virtues) justifies (which we grant could not easily be the case, since it is not even true and living faith); but whether it “alone” (sola) concurs to the act of justification (which we assert); as the eye alone sees, but not when torn out of the body. Thus the particle “alone” (sola) does not determine the subject, but the predicate (i.e., “faith only does not justify [sola fides non justificat], but “faith justifies alone” [fides justificat sola]). The coexistence of love in him who is justified is not denied; but its coefficiency or cooperation in justification is denied. (4) The question is not whether the faith “which justifies” (quae justificat) works by love (for otherwise it would not be living but dead); rather the question is rather faith “by which it justifies” (qua justificat) or in the act itself of justification, is to be considered under such a relation (schesei) (which we deny). …

XIII. It is one thing for love and works to be required in the person who is justified (which we grant); another in the act itself or causality of justification (which we deny). If works are required as concomitants of faith, they are not on that account determined to be causes of justification with faith or to do the very thing which faith does in the matter.

XIV. Although the whole force of justifying on the part of man is in faith as to the act of apprehension (so that other virtues contribute nothing to it with faith), it does not follow that faith can justify when they are absent as well as when they are present–yea, even wehn the opposite vices are present. It is one thing to justify without virtues (i.e., separated from them–which we deny); another for it to justify alone, but not separated from them. As it does not follow, the hand alone writes and the eye alone sees–therefore [it does this] as much when torn from the head and the other members as [it does when it is] in the body; the sole force of respiration is in the lungs–therefore the lungs can respire torn out from the liver and other viscera as well as when connected to them (which everyone sees to be absurd). Natural potencies are connected as to existence, but disjoined as to operation. Light and heat in the sun are most closely connected together, but still the light alone illuminates, the heat alone warms. Therefore, although the other virtues do not justify with faith, still faith cannot justify in their absences, much less the opposite vices being present. For faith cannot be true except in connection with the virtues (which if they do not contribute to justification, still contribute to the existence and life of faith, which the presence of vices would destroy). … XX. Although remission of sins is promised to repentance (because it ought to accompany faith and be in him who is justified as a certain condition requisite from him because God cannot pardon sin to an impenitent), it does not follow that it can be said to justify with faith because it contributes nothing (neither meritoriously, nor instrumentally) to the act of justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, tr. George M. Giger, ed. James Dennison Jr. (1679–1685; P&amp;R, 1994), vol. 2, 16th Topic, 8. ‘Does faith alone justify? We affirm against the Romanists., pp. 677, 680-81</span></figcaption>

</figure><figure class="quote" id="q-b2f5dcfd25" data-kw="">
<blockquote><p>There is a great difference between vocation and justification. Vocation precedes, justification follows. Justification praesupponit aliquid [presupposes something], viz. faith and repentance; Effectual Calling ponit haec, non autem praesupponit [posits this, but does not presuppose it]. (Conference between Cameron and Tilen)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6. Of Justification, p. 512</span></figcaption>

<blockquote><p>3. Likewise, it is quite clear that adults do not obtain these blessings of Christ, except by the prevenient movement of the Holy Spirit, by which their mind and will are moved to hate sin. For, as St. Augustine says, it is impossible to begin a new life if we do not repent of the former one. Likewise, in the last chapter of Luke [24:47], Christ commands that repentance and forgiveness of sin should be preached in his name. Also, John the Baptist, sent to prepare the way of the Lord, preached repentance, saying [Matt. 3:2]: ‘Repent [Poenitentiam agite], for the kingdom of heaven is drawing near.’ Next, man’s mind is moved toward God by the Holy Spirit through Christ and this movement is through faith. Through this man’s mind believes with certainty all that God has transmitted [tradita], and also with full certainty and without doubt assents to the promises made to us by God who, as stated in the psalm [144:13], is faithful in all his words. From there he acquires confidence [fiduciam] on account of God’s promise, by which he has pledged that he will remit sins freely and that he will adopt as children those who believe in Christ, those I say who repent of their former life. By this faith, he is lifted up to God by the Holy Spirit and so he receives the Holy Spirit, remission of sins, imputation of righteousness and countless other gifts.

4. So it is a reliable and sound doctrine that the sinner is justified by living and efficacious faith, for through it we are pleasing and acceptable to God on account of Christ. And living faith is what we call the movement of the Holy Spirit, by which those who truly repent of their old life are lifted up to God and truly appropriate the mercy promised in Christ, so that they now truly recognize that they have received the remission of sins and reconciliation on account of the merits of Christ, through the free [gratuita] goodness of God, and cry out to God: Abba Father’. But this happens to no one unless also at the same time love is infused [infundatur] which heals the will so that the healed will may begin to fulfil the law, just as Saint Augustine said [Of the Spirit &amp; Letter, ch. 9,15]. So living faith is that which both appropriates mercy in Christ, believing that the righteousness which is in Christ is freely imputed to it, and at the same time receives the promise of the Holy Spirit and love. Therefore the faith that truly justifies is that faith which is effectual through love [Gal. 5:6]. Nevertheless it remains true that it is by this faith that we are justified (i.e. accepted and reconciled to God) inasmuch as it appropriates the mercy and righteousness which is imputed to us on account of Christ and his merit, not on account of the worthiness or perfection of the righteousness imparted [communicatae] to us in Christ.

5. Although the one who is justified receives righteousness and through Christ also has inherent [righteousness], as the apostle says [1 Cor. 6:11]: ‘you are washed, you are sanctified, you are justified, etc.’ (which is why the holy fathers made use of [the term] ‘to be justified’ even to mean ‘to receive inherent righteousness’), nevertheless, the faithful soul depends not on this, but only on the righteousness of Christ given to us as a gift, without which there is and can be no righteousness at all. And so by faith in Christ we are justified or reckoned to be righteous, that is we are accepted through his merits and not on account of our own worthiness or works. And on account of the righteousness inherent in us we are said to be righteous, because the works which we perform are righteous, according to the saying of John [1 John 3:7]: ‘whoever who does what is right is righteous’. … 10. Now those who say that we are justified by faith alone should at the same time teach the doctrine of repentance, of the fear of God, of the judgement of God and of good works, so that all the chief points of the preaching may remain firm, as Christ said: ‘preaching repentance and the remission of sins in my name’ [Luke 24:47]. And that is to prevent this way of speaking [i.e. sola fide] from being understood other than has been previously mentioned.</p></blockquote>

<blockquote><p>Article XI Concerning Things Commanded and Not Commanded Of self law (Autonomia) or power in the conscience, Relinquished to Christ alone in the church We confess that no one ought to command in any manner that which Christ has not commanded; also, therefore, no one ought to prohibit that which he has not forbidden (For it has been written,”Hear him.” Matt. 17:5; Luke 9:35; Deut. 18:18, 19; Acts 7:37). Of the Emptiness of the Precepts of the Popes, and Expressly Auricular Confession, Lenten Fasts, and Papal Feasts For this reason we do not hold as precepts, auricular confession, Lenten fasts, feast days of the saints, and things of that kind which have sprung up from men….</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-17afcbae90" data-kw="">
<blockquote><p>21. Neither are they for stated anniversary feasts or fasts, which are sadly profaned and abused among the Romanists, for at least the superstitious unthinking vulgar make little other use of them than for rioting and raveling, sporting and gamming, and other such dissolute practices, highly unbeseeming days that pass under the character and opinion of holy-days: Yet when emergencies and dispensations of providence occur that call for public humiliation and fasting, or solemn Thanksgiving, they think it their duty to consecrate some part of their time for fasts and thanksgivings, devoutly to deprecate God’s imminent wrath, and to plead the aversion of impendent judgments due to them for their sins, or to praise God for benefits received and to beg further favors; These being such pieces of religious work which God both by his Word and providence sometimes requires. Geneva: Treatise of Fasting; Acts of the Assembly, 1645. ss: Vlt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-clark.html">James Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Presbyterial Government Described</cite>, … (Edinburgh, 1695), no page number</span></figcaption>

arget="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7241c527d9" data-kw="">
<blockquote><p>Magistrates certainly have a power to appoint public days, yea, annual days of thanksgivings, for mercies never to be forgotten. Indeed they cannot make a day holy, so as it shall be a sin against God to labor in it, or to use any pleasures (as in the case of the sabbath); but they may command the public worship of God to be performed on particular days, and men ought to attend it when with convenience they can; only they ought to take care that such days be not spent in luxury and profaneness, and that they be for signal providences, and not so multiplied, and frequently renewing, as that the service of them degenerate into mere matter of form. Whether Christ went up in order to the feast [of dedication], or because of the great concourse of people he knew would be there at that time, cannot be determined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, v. 22</span></figcaption>

</figure><figure class="quote" id="q-98e8182564" data-kw="">
<blockquote><p>Bishop Andrewes will have the feast of Easter drawn from that place 1 Cor. 5:8, where he says there is not only a warrant, but an order for the keeping of it, and he will have it out of doubt that this feast is of apostolical institution, because after the times of the apostles, when there was a contention about the manner of keeping Easter, it was agreed upon by all that it should be kept, and when the one side alleged for them St. John [for keeping it on Passover], and the other St. Peter [for keeping it on the Lord’s Day], it was acknowledged by both that the feast was apostolical. I answer, the testimony of Socrates [a church historian in the early Church] deserves more credit than the Bishop’s naked conclusion. ‘I am of opinion,’ says Socrates (bk. 5, ch. 22), ‘that as many other things crept in of custom in sundry places, so the feast of Easter to have prevailed among all people, of a certain private custom and observation.’ But whereas B. Lindsay in defense of B. Andrewes, replies that Socrates propounds this for his own opinion only, I answer that Socrates in that chapter proves his opinion from the very same ground, which B. Andrewes wrests, to prove that this Feast is Apostolical. For while as in that hot controversy about the keeping of Easter, they of the East alleged John the apostle for their author, and they of the west alleged Peter and Paul for themselves; Yet (says Socrates), there is none that can show in writing any testimony of theirs, for confirmation and proof of their custom. And hereby I do gather that the celebration of the Feast of Easter came up more of custom than by any law or canon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 6, p. 98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

</figure><figure class="quote" id="q-833306a171" data-kw="">
<blockquote><p>That they [Romanists] cry up a private, unproved, unwritten tradition of their own, as of equal authority with this safe and full rule, which is contained in this written Word of God. Their crime and fault may be considered, partly with respect to the object and matter; that these traditions are not indifferent customs, but essential points necessary to faith and christian practice. And so though a Christian be never so through and sound in his obedience to the Word of God, and true to the baptismal covenant, yet if he submits not to these unwritten traditions, he wants [lacks] some point necessary to faith and practice, and so to life eternal: which is contrary to Mark 16:16. “He that believes and is baptized, shall be saved; and he that believes not, shall be damned.” And John 17:3.” This is life eternal, to know you the only true God, and Jesus Christ whom you have sent.” Partly as to the subject, as they make their own faction to be the only keepers of these things; and that nothing is to be owned as apostolic tradition, but what is delivered as such by their authority; which is to leave the church to the tyranny and usurpation of a corrupt faction; to declare for apostolic tradition any thing which serves their end and interest, and for which no true historical evidence is produced. Now the unjust and fraudulent practices which they have used, to promote this usurpation over the churches of Christ, render them false men, most unfit to be trusted in this kind. Partly with respect to the manner, they will have these things to be received, pari reverentia et pietatis affectu, with the same reverence and pious affection with which we receive the Holy Scriptures; and so man’s post is set by God’s, and unproved traditions equaled with doctrines of faith. Their opinion is bad enough, but their practice is worse. For there they show they value these things more than the Scriptures. As superstition always abounds in its own things. Did ever any of their doctors [teachers] say the same things of traditions, which they take the boldness to say of Scripture? Did they ever call them pen and inkhorn, or parchment divinity, a nose of wax, a dumb rule, an obscure and ambiguous doctrine? These Blasphemies they vent boldly against the Scriptures: but did they ever speak these of traditions? And again, their common people are a thousand times better instructed in their traditions, than in the doctrine of salvation. They skill more of Lent, and Ember-weeks, etc. than they truly understand the doctrine of man’s misery and remedy. And call you this reverence and pious affection to the Scriptures and traditions? Partly because they would never give us a catalogue of unwritten traditions, necessary to be observed by all Christians; It may be lest they should amaze the people with the multitude of them, or else that the people may not know how many of their doctrines are destitute of Scripture proof, and so they plainly be discovered to be imposers on the belief of the Christian world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>XVIII Sermons on the Second Chapter of the 2nd Epistle to the Thessalonians</cite>, … (London, 1679), 340–42 [Spelling and punctuation modernized].</span></figcaption>

its own things. Did ever any of their doctors [teachers] say the same things of traditions, which they take the boldness to say of Scripture? Did they ever call them pen and inkhorn, or parchment divinity, a nose of wax, a dumb rule, an obscure and ambiguous doctrine? These Blasphemies they vent boldly against the Scriptures: but did they ever speak these of traditions? And again, their common people are a thousand times better instructed in their traditions, than in the doctrine of salvation. They skill more of Lent, and Ember-weeks, etc. than they truly understand the doctrine of man’s misery and remedy. And call you this reverence and pious affection to the Scriptures and traditions? Partly because they would never give us a catalogue of unwritten traditions, necessary to be observed by all Christians; It may be lest they should amaze the people with the multitude of them, or else that the people may not know how many of their doctrines are destitute of Scripture proof, and so they plainly be discovered to be imposers on the belief of the Christian world.”

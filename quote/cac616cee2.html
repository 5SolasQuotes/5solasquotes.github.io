<blockquote><p>14. Does not even nature itself, which has prompted all civilized nations to preserve an apparent distinction of the sexes, teach you, that, according to the custom of your country, it would be reckoned effeminate in a man to wear his hair in the length and form of a woman’s.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e7f5caffe6" data-kw="">
<blockquote><p>Finney provides scholarly documentation and references to ancient sources that make it difficult to discredit the thesis that some Roman men did, in fact, have the serious obligation of appearing before a deity with their heads covered… He takes exception to the works of Jerome Murphy-O’Connor, Richard Hays, and Gordon Fee, who all argued that the text is discussing long hair, not veiling.” – Massey (2018) Abstract: “A significant yet missing dimension of scholarly engagement with 1 Cor. 11:2-16 is the consideration of honour-shame and its critical importance in ancient cultures. As this section of Paul’s letter abounds in honour-shame terminology, analysis of the text within such a framework will allow a profitable exploration of the reasons why the Corinthians are changing their attire (for purposes of this paper, their headcoverings), in a way that appears to be contrary to what may be considered the Pauline norm. The argument offered here is that notions of honour come to the fore and higher-status male Corinthians are employing modes of head attire to maintain distinctions of status. At the same time, Paul insists upon female head-coverings to safeguard the honour of the community within a context of the potential presence of non-believers in a communal service of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-finney.html">Mark Finney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Honour, Head-Coverings &amp; Headship: 1 Corinthians 11.2-16 in Its Social Context’ JSNT 33 (2010)</cite>, pp. 31-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-c193d03d76" data-kw="">
<blockquote><p>I don’t believe that churches have to resurrect the custom of head coverings. Were the custom still dominant, it would be pious to respect and retain it, but a lost custom is somewhat different. When a custom is lost, the public meaning of that custom changes, and enforcing it anew can send a new and different (and, yes, mistaken) meaning… Yet 1 Corinthians 11:2–16 teaches us that godly customs in practice should be retained, and it teaches us to investigate our customs to see what message they are sending. Intelligible customs that signify male headship or the glory of godly femininity should be respected and promoted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/steven-wedgeworth.html">Steven Wedgeworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Going on a Bear Hunt: Head Coverings, Custom, &amp; Proper Decorum: Revisiting 1 Corinthians 11:2–16’ (2021) 26 paragraphs</cite></span></figcaption>

</figure><figure class="quote" id="q-521b1ca99a" data-kw="">
<blockquote><p>2. Paul’s traditions which he delivered, were either concerning matters of doctrine and faith, which are perpetual, and they be all expressed in the Scriptures, or else of ceremonies which are mutable by authority of the church, according to time, places, and persons, observing the general rules prescribed by the Apostle, that all things be done in order and comeliness, and to edification. … 16. Paul saith, the apostles and church have no such custom to be contentious. Chrysostom, homily 27, in Epistle X. Cor. for matters of external order, yet does he give reasons for that order of covering women’s heads. By whose example the preachers are likewise to endeavour to satisfy by reason both men and women, that hurnbly desire their resolution for quiet of their conscience, and not to beat them down with the club of custom only. For so the apostle does not.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-07fc90e93b" data-kw="">
<blockquote><p>God’s covenant is a bargain which God hath made with men, in which God promises to men some good, and requires of them again, that they perform those things which he commands. And that covenant is either eternal or temporal. The eternal covenant is a covenant in which God promises men eternal life. And that is twofold: the covenant of works or the covenant of grace. The covenant of works, is a bargain of God made with men concerning eternal life, to which is both a condition of perfect obedience adjoined, to be performed by man, and also a threatening of eternal death if he shall not perform perfect obedience. Gen. 2. 17. The repetition of the covenant of works is made by God, Exod. 19. 5. Deut. 5. 2. 1. King. 8. 21. Heb. 8. 9. and that chiefly for four causes. That God by all means might stir up men to perform obedience. That every mouth might be stopped, and all the world might be made subject to the condemnation of God for not performing perfect obedience. Rom. 3. 19. That he might manifest mans sin, and naughtiness. Rom. 3. 19. 20. and 7. 7. 8. 9. 10. 11. That he might thrust us forward to seek to be restored in the covenant of grace. Gal. 3. 22. and 5. 23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Substance of Christian Religion Soundly set forth in Two Books, by Definitions &amp; Partitions</cite>, trans. E. W. (London, 1595), 87–88. [Spelling modernized]</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-94da56e813" data-kw="abrogation">
<blockquote><p>When God expelled man from paradise “lest man put forth his hand, and take also of the tree of life, and eat, and live for ever” (Gen. 3:22), these words denote the cause of his ejection from paradise on account of sin (by which, as by his own fault, he had cut himself off from that life, which was the thing signified). Thus he ought no longer to have any right to its sacrament. The covenant of works being broken by man’s disobedience, its promissory and sacramental seals no longer belonged to him as a way of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.5.5</span></figcaption>

</figure><figure class="quote" id="q-7dc25ca674" data-kw="">
<blockquote><p>In Adam’s sin there was the breach of the whole law in every commandment, either directly or by consequence, for he showed evident want of love to God in believing Satan more than God. Therein he chose Satan for his god; he worshipped Satan and took God’s name in vain; he showed also evident want of brotherly love, for hereby he became a murderer not only of himself, but of all his posterity. And thus do sins concur in every wicked action, in which regard it may be said with James that “he which faileth in one commandment is guilty of all” [2:10], which must admonish us to make conscience of every sin, for we cannot live in any one but we must needs run into many other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of Christ’s Sermon on the Mount in The Works of William Perkins</cite>, (Reformation Heritage Books, 2014), 399.</span></figcaption>

</figure><figure class="quote" id="q-2ab7421dd5" data-kw="">
<blockquote><p>All natural and unregenerate men function entirely within the context of the covenant of works, and regardless of what their religious mindset may be, their singular objective is to be justified before God by their own merits and by the works of the law. Therefore, if they hear any mention made of a covenant that is purely and freely gracious in and through the crucified surety and mediator Christ Jesus, or if they are directed to anything other than this covenant of grace and to this mediator, being called upon to lay aside and fully to forsake all their own strength and righteousness, and admonished from the Holy Scriptures that they are to believe alone in Him who justifies the ungodly because they are unable to accomplish anything themselves—I say, the moment this occurs, these people are of the opinion that such a faith will render them careless, whereby sin will then necessarily have dominion over them. Natural men have always thus judged the doctrine of salvation by grace alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life &amp; Death</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (Grand Rapids: Reformation Heritage Books and Dutch Reformed Translation Society, 2016), Lord’s Day 32.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“All natural and unregenerate men function entirely within the context of the covenant of works, and regardless of what their religious mindset may be, their singular objective is to be justified before God by their own merits and by the works of the law. Therefore, if they hear any mention made of a covenant that is purely and freely gracious in and through the crucified surety and mediator Christ Jesus, or if they are directed to anything other than this covenant of grace and to this mediator, being called upon to lay aside and fully to forsake all their own strength and righteousness, and admonished from the Holy Scriptures that they are to believe alone in Him who justifies the ungodly because they are unable to accomplish anything themselves—I say, the moment this occurs, these people are of the opinion that such a faith will render them careless, whereby sin will then necessarily have dominion over them. Natural men have always thus judged the doctrine of salvation by grace alone.”

d it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-481c85850e" data-kw="">
<blockquote><p>This overview is sufficient to show how the older writings can manifest the covenant doctrine in Reformed theology. But, one might perhaps say, that only applies to the covenant of grace. These historical data cannot prove that the covenant of works belonged to the old Reformed school. This contention has been expressed repeatedly. In the second half of the seventeenth century Vlak and Bekker declared themselves against the covenant of works on the grounds that it was an invention of theologians of that period and was not encountered in the older Reformed theologians. It was supposed that Lubbertus, Makkowski, and Cloppenburg were the first to have introduced it. Just as Cocceius has occasionally been looked upon as the discoverer of the covenant concept in general, so also some wanted to maintain that the doctrine of the covenant of works had been thought up in the period immediately preceding Cocceius. If this is taken to mean that previously this doctrine had not been worked out in every detail and was not presented in all clarity as was the case later, then there is some truth to it. But whoever has the historical sense to be able to separate the mature development of a thought from its original sprouting and does not insist that a doctrine be mature at birth, will have no difficulty in recognizing the covenant of works as an old Reformed doctrine. Already with Ursinus in the Larger Catechism the question: “What does the divine law teach you?” is answered:“What kind of a covenant God entered into with man at the creation and how man behaved in the keeping of that covenant,” etc. Likewise, Olevianus speaks of the covenant of law, the covenant of nature, the covenant of creation in contradistinction to the covenant of grace. Sometimes, it is true, he means by it the promulgation of the Mosaic law, but in other places it is no less clear that the actual covenant of works has to be sought before the fall. Only in two points was this older doctrine of the covenant of works superseded by its later development.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of the Covenant in Reformed Theology’ in Redemptive History &amp; Biblical Interpretation</cite>, (De verbondsleer in de Gereformeerde theologie (Grand Rapids: “Democrat” Drukpers, 1891). This was Vos’ rectoral address at the Theological School of the Christian Reformed Church in Grand Rapids, Michigan. Trans. S. Voorwinde and W. Van Gemeren pu</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

an+behaved+in+the+keeping+of+that+covenant%2C%E2%80%9D+etc.+Likewise%2C+Olevianus+speaks+of+the+covenant+of+law%2C+the+covenant+of+nature%2C+the+covenant+of+creation+in+contradistinction+to+the+covenant+of+grace.+Sometimes%2C+it+is+true%2C+he+means+by+it+the+promulgation+of+the+Mosaic+law%2C+but+in+other+places+it+is+no+less+clear+that+the+actual+covenant+of+works+has+to+be+sought+before+the+fall.+Only+in+two+points+was+this+older+doctrine+of+the+covenant+of+works+superseded+by+its+later+development.%E2%80%9D%0A%0A%E2%80%94+Geerhardus+Vos%2C+%E2%80%9CThe+Doctrine+of+the+Covenant+in+Reformed+Theology%E2%80%9D+%28De+verbondsleer+in+de+Gereformeerde+theologie+%28Grand+Rapids%3A+%E2%80%9CDemocrat%E2%80%9D+Drukpers%2C+1891%29.+This+was+Vos%E2%80%99+rectoral+address+at+the+Theological+School+of+the+Christian+Reformed+Church+in+Grand+Rapids%2C+Michigan.+Trans.+S.+Voorwinde+and+W.+Van+Gemeren+pu&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F481c85850e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/481c85850e.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/05/vos-whoever-has-historical-sense-can-see-the-covenant-of-works-in-the-earlier-reformed-writers/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<main class="wrap"><figure class="quote" id="q-b107b86234" data-kw="">
<blockquote><p>Question 72. Is then the external baptism with water, the washing away of sin itself? Answer. Not at all, for the blood of Jesus Christ only, and the Holy Ghost, cleanse us from all sin. …So when it is said, “Baptism saves us,” is “the washing of regeneration,” and “the washing away of sin;” it is the same thing as to say, Baptism is the sign of all these things. Question 73. Why then doth the Holy Ghost call baptism “the washing of regeneration,” and “the washing away of sins?” Answer. God speaks thus not without great cause, to wit, not only thereby to teach us, that, as the filth of the body is purged away by water, so our sins are removed by the blood and Spirit of Jesus Christ; but especially that, by this divine pledge and sign, he may assure us that we are spiritually cleansed from our sins as really as we are externally washed with water.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Lord’s Day 27, Q. 72–73</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-305c2b20cb" data-kw="">
<blockquote><p>Christ does not retain both members of the first proposition in that which stands in opposition to the promise; he merely says: “He that believeth not, shall be damned.” Christ makes this distinction, because there is not the same necessity for faith and baptism to salvation. Faith is absolutely necessary to salvation, so that no one can be saved without it: for “without faith it is impossible to please God.” (Heb. 11:6.) But the sacraments are necessary when they may be observed according to divine appointment. Contempt of the sacraments under such circumstances, is inconsistent with faith. This is the reason why Christ promises salvation to those that believe and are baptized, keeping in view the distinction which is here made. Yet he does not deny salvation to those who are deprived of this sacrament. … The word extends to all; the sacraments only to such as believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, on Mark 16:16 (the necessity of baptism)</span></figcaption>

</figure><figure class="quote" id="q-5304def06a" data-kw="">
<blockquote><p>That condition is faith. It is the clearly pronounced doctrine of the Lutheran Church that baptism is altogether useless or void of any saving effect, unless the recipient be a believer. And by faith is not meant mere speculative assent, such as Simon Magus had, but true, living, and saving faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Condition on which the Efficacy of Baptism is suspended”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/efficacy.html">Baptism: Efficacy</a> › <a href="../topics/baptism/efficacy/baptismal-regeneration-vs-baptism-as-sign-and-seal.html">Baptismal regeneration vs baptism as sign and seal</a></span></div>
<div class="actions"><button class="copy" data-copy="“That condition is faith. It is the clearly pronounced doctrine of the Lutheran Church that baptism is altogether useless or void of any saving effect, unless the recipient be a believer. And by faith is not meant mere speculative assent, such as Simon Magus had, but true, living, and saving faith.”

</figure><figure class="quote" id="q-9cbaa3a91f" data-kw="">
<blockquote><p>In this matter of baptism — if I may be pardoned for saying it — I can only conclude that all the doctors have been in error from the time of the apostles. . . . All the doctors have ascribed to the water a power which it does not have and the holy apostles did not teach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Baptism</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/nature-and-institution.html">Nature and Institution</a></span></div>
<div class="actions"><button class="copy" data-copy="“In this matter of baptism — if I may be pardoned for saying it — I can only conclude that all the doctors have been in error from the time of the apostles. . . . All the doctors have ascribed to the water a power which it does not have and the holy apostles did not teach.”

— Huldrych Zwingli, Of Baptism">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+this+matter+of+baptism+%E2%80%94+if+I+may+be+pardoned+for+saying+it+%E2%80%94+I+can+only+conclude+that+all+the+doctors+have+been+in+error+from+the+time+of+the+apostles.+.+.+.+All+the+doctors+have+ascribed+to+the+water+a+power+which+it+does+not+have+and+the+holy+apostles+did+not+teach.%E2%80%9D%0A%0A%E2%80%94+Huldrych+Zwingli%2C+Of+Baptism&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9cbaa3a91f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9cbaa3a91f.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-3aa24a2f4e" data-kw="">
<blockquote><p>Baptism is a profession of faith in the Father, and the Son, and the Holy Spirit; not of a faith to be obtained through the ordinance, but of a faith already entertained. When the Eunuch applied to Philip for baptism, he said: “If thou believest with all thine heart thou mayest.” Of those who heard Peter’s sermon on the day of Pentecost it is said, “they that gladly received his word were baptized.” (Acts 2:41.) On this point, however, there can be no dispute. The only way in which Romanists and Romanizers evade this argument, is by denying that faith and repentance are the fruits of the Spirit, or of regeneration. They are in their view not gracious, but natural works, works done before regeneration; works which leave the soul in a state of perdition. But in this they contradict the express words of Christ, who says, whosoever believes shall be saved. And, in contradicting Christ, they contradict the whole Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Efficacy of Baptism”</span></figcaption>

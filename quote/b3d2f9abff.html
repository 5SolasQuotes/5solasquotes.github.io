<main class="wrap"><figure class="quote" id="q-b3d2f9abff" data-kw="">
<blockquote><p>2. That private Christians in an extraordinary case, in a Church to be erected or that is decayed and ruined, may sometimes publicly preach the Word of God for the planting a Church when there are not such as by God’s ordinary call have received from God power to preach the Word. For the positive ritual law of God gives place to the moral law of God when necessity requires it.

3. We grant also that private Christians in some special cases, and upon a particular occasion, may sometimes speak the Word of God in public by a special calling from God: as martyrs are called to a public confession of the faith. But all this does not infer that there is an exercise of prophesy constantly and ordinarily to be observed in the Church, whereby the Word should by private Christians in the Name of Christ and with all authority be publicly preached for the edification of the Church. And therefore we maintain the negative of the question proposed, and deny that there is such an exercise to be perpetually retained in the Church of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated</cite>, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 77-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“2. That private Christians in an extraordinary case, in a Church to be erected or that is decayed and ruined, may sometimes publicly preach the Word of God for the planting a Church when there are not such as by God’s ordinary call have received from God power to preach the Word. For the positive ritual law of God gives place to the moral law of God when necessity requires it.

3. We grant also that private Christians in some special cases, and upon a particular occasion, may sometimes speak the Word of God in public by a special calling from God: as martyrs are called to a public confession of the faith. But all this does not infer that there is an exercise of prophesy constantly and ordinarily to be observed in the Church, whereby the Word should by private Christians in the Name of Christ and with all authority be publicly preached for the edification of the Church. And therefore we maintain the negative of the question proposed, and deny that there is such an exercise to be perpetually retained in the Church of Christ.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-db96f3b2ec" data-kw="">

</figure><figure class="quote" id="q-fc14d922a8" data-kw="">
<blockquote><p>2. What is essential for making a minister who is extraordinarily called of God, is not ever more essential to the making of a minister ordinarily called of God, in an island where the Gospel is: if all the pastors should die, the people might choose pastors to themselves, but they could not then make pastors; God only, without the ministry of other pastors, in that case should make pastors; but it follows not hence that pastors ordinarily have not their calling to be pastors from the ordination of pastors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), pp. 266-67</span></figcaption>

</figure><figure class="quote" id="q-7bb5dc3c23" data-kw="">
<blockquote><p>Ordination appears to have been performed by apostles, by evangelists, and by a presbytery, Acts 6:6, and 14:23; Tit. 1:5; 1 Tim. 5:22, and 4:14: but never by private Christians. Could these [private Christians] ordain their pastors or other ecclesiastic officers, to what purpose did Paul leave Titus at Crete to ordain elders in every city? Or why did he write never a word about ordination to the people, in any of his epistles, but to their rulers?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters on the Constitution, Government &amp; Discipline of the Christian Church</cite>, (d. 1787), pp. 73-74</span></figcaption>

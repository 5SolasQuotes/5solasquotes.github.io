<main class="wrap"><figure class="quote" id="q-09706511d9" data-kw="">
<blockquote><p>When I lately read one saying: “That this was one principle that the Church of England went on, in the Reformation, that faith and works have the same consideration in the business of justification,” I could not but stand amazed, and conclude that either he or I had been asleep ever since we were born; or that there were two Churches of England, – one that I never knew, and another that he never knew; or else that prejudice is powerful, and makes men confident. Is that the doctrine of the Church of England, as they call it? When, where, by whom was it taught, but by Papists and Socinians, until within a very few years, in England? What place hath it in confessions, homilies, liturgies, controversy writers, or any place of repute for learning and religion in England?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Strength of Faith in Posthumous Sermons. Part II</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1abfa1fa62" data-kw="">
<blockquote><p>In Christianity, the moment we believe, God imputes Christ’s perfect performance to us as if it were our own, and adopts us into His family. In other words, God can say to us just as He once said to Christ, “You are my Son, whom I love; with you I am well pleased.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/tim-keller.html">Tim Keller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Freedom of Self-Forgetfulness</cite>, p. 40</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/formal-cause.html">Formal Cause: Imputation</a> › <a href="../topics/justification/formal-cause/imputation-of-christs-righteousness.html">Imputation of Christ’s righteousness</a></span><span class="t"><a href="../topics/adoption/nature-of-adoption.html">Nature of Adoption</a> › <a href="../topics/adoption/nature-of-adoption/sonship.html">Sonship</a></span></div>

</figure><figure class="quote" id="q-3b8c6bd220" data-kw="">
<blockquote><p>But why does Paul say that the Galatians are “turning back to the weak and beggarly elements,” that is, to the Law, when they never had the Law, since they were Gentiles (even though, as we shall say later, he writes this also to Jews)? Or why does he not rather speak this way: “Once, when you did not know God, you were in bondage to beings that by nature are no gods. But now that you know God, why do you forsake the true God and turn back again to the worship of idols?” Is defecting from the promise to the Law and from faith to works the same for Paul as serving gods that by nature are no gods? I reply: Whoever falls from the doctrine of justification is ignorant of God and is an idolater. Therefore it is all the same whether he then returns to the Law or to the worship of idols; it is all the same whether he is called a monk or a Turk or a Jew or an Anabaptist. For once this doctrine is undermined, nothing more remains but sheer error, hypocrisy, wickedness, and idolatry, regardless of how great the sanctity that appears on the outside.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 395–96.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

oopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-e3a9a32c2a" data-kw="">
<blockquote><p>The grace of sanctification immediately follows the grace of justification, and it is understood under calling, as its continuous progression, under justification, as its fruit, and under glorification, as the beginning of the same.</p></blockquote>

</figure><figure class="quote" id="q-80548af3e9" data-kw="Merit">
<blockquote><p>I ask, what need was there to introduce the word Merit, when the value of works might have been fully expressed by another term, and without offense? The quantity of offense contained in it the world shows to its great loss. It is certain that, being a high sounding term, it can only obscure the grace of God, and inspire men with pernicious pride.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.2</span></figcaption>

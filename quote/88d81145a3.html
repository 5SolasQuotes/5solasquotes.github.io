<blockquote><p>The special act of providence towards man newly created, was, God’s making a covenant of life and happiness with him. There are two covenants for life and happiness to man: and they are, the covenant of works, and the covenant of grace: Gal. iv. 24, “For these are the two covenants; the one from the mount Sinai, which gendereth to bondage, which is Agar.” The first covenant was the covenant of works. It was made in paradise, and before the fall. The parties contracting in it, were God and Adam: Gen. ii. 17, “But of the tree of the knowledge of good and evil, thou shalt not eat of it: for in the day that thou eatest thereof, thou shalt surely die.”

But Adam represented all mankind, as the parties contracted for: Gen. ii. 17, forecited. Compared with Rom. v. 12, “By one man sin entered into the world, and death by sin; and so death passed upon all men, for that all have sinned.” There was no mediator of this covenant; for as yet there was no breach, by sin, betwixt God and man. The condition of the covenant of works, was perfect obedience: Gal. iii. 12, “And the law is not of faith: but, The man that doth them, shall live in them.” And it was to be perfect, in respect of parts, degrees, and continuance: Gal. iii. 10, “For as many as are of the works of the law, are under the curse: for it is written, Cursed is every one that continueth not in all things which are written in the book of the law to do them.” Matth. xxii. 37, “Jesus said unto him, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind.” So the least failing in any part or degree of obedience, or for never so small a time, would have broken this covenant.

The law that was the rule of this obedience, was the law of the ten commands, and the law forbidding to eat of the tree of knowledge of good and evil: Gal. iii. 10, and Gen. ii. 17, forecited. That tree grew in paradise, Gen. ii. 9. There was no virtue in it to improve men in knowledge, as the devil falsely suggested, Gen. iii. 5, “For God doth know, that in the day ye eat thereof, then your eyes shall be opened: and ye shall be as gods, knowing good and evil.” Compared with John viii. 44, “Ye are of your father the devil, and the lusts of your father ye will do: he was a murderer from the beginning, and abode not in the truth, because there is no truth in him.” “When he speaketh a lie, he speaketh of his own: for he is a liar, and the father of it.” But that name was put upon this tree, to intimate, that by eating of it, man would know to his sad experience, the vast difference between good and ill: wherefore that tree with that name, was of use, to be a warning-piece to man to beware of evil. Now, Adam knew the law of the ten commands, as they were impressed on his heart in his creation: Rom. ii. 15, “Which shew the work of the law written in their hearts, their conscience also bearing witness, and their thoughts the mean while accusing, or else excusing one another.” He knew the law of the forbidden tree by revelation, Gen. ii. 17, forecited. And he had sufficient ability for the perfect obedience required, Eccl. vii. 29, ” God made man upright.”

The promise of the covenant of works, was a promise of life: Gen. ii. 17, forecited. The life promised was twofold; namely, one to be afforded him, during the course of his probationary obedience, another to be afforded him at the perfecting of it. The life to have been afforded to man during the course of his probationary obedience, was natural life continued in vigour and comfort, and spiritual life continued in favour and fellowship with God, Gen. ii. 17, forecited. This was the reward of obedience in hand. The life to have been afforded him at the perfecting of his course, was eternal life in consummate happiness: Matth. xix. 16, 17, “And behold, one came and said unto him, Good master, what good thing shall I do that I may have eternal life? And he said unto him, If thou wilt enter into life, keep the commandments.” And this was the reward of obedience in hope.

Adam, if he had continued obedient, could have claimed that life upon his obedience; yet not in the way of proper merit; because his perfect obedience was no more than what was due from him by the law of his creation, before he entered into that covenant: Luke xvii. 9, 10, “Doth he thank that servant, because he did the things that were commanded him? I trow not. So likewise ye, when ye shall have done all those things which are commanded you, say, We are unprofitable servants: we have done that which was our duty to do.” The only way he could have claimed it, was by compact, namely, in virtue of the covenant-promise made to this work.

The penalty of the covenant of works was death, Gen. ii. 17, forecited. The death threatened was also twofold; namely, one accompanying sin at its first entrance, another following after as its full reward. The death accompanying sin at its first entrance, was temporal death, in the loss of the vigour and comfort of natural life; and spiritual death, in the loss of the image of God with his favour and fellowship. And Adam died this death, according to the threatening, that very day he sinned: Gen. iii. 7, 8, 9, 10, “And the eyes of them both were opened and they knew that they were naked: and they sewed fig-leaves together, and made themselves aprons. And they heard the voice of the Lord God walking in the garden in the cool of the day: and Adam and his wife hid themselves from the presence of the Lord God, amongst the trees of the garden. And the Lord God called unto Adam, and said unto him, Where art thou? And he said, I heard thy voice in the garden: and I was afraid, because I was naked; and I hid myself.”

The death following after, as the full reward of sin, was the natural death of the body with the sting in it, and eternal death in the consummate misery of soul and body for ever: 1 Cor. xv. 55,” death where is thy sting? grave, where is thy victory?” Matth. xxv. 41, “Then shall he say also unto them on the left hand, Depart from me, ye cursed, into everlasting fire, prepared for the devil and his angels.” And this was comprehended in the express threatening of death to accompany sin; inasmuch as the one was a sure pledge of the other, natively issuing therein.</p></blockquote>

<blockquote><p>While the covenant of works is not a prominent theme in Zacharias Ursinus’s Commentary on the Heidelberg Catechism, he does make at least one important reference to it in contrast to the covenant of grace. The idea that the covenant of works is a Westminsterian novelty has no credence in history. If it were a novel teaching of the Westminster Assembly, then why did prominent continental divines such as Francis Turretin and Herman Witsius also defend it? In the following extract, Ursinus contrasts the reward for obedience under the covenant of works with the rewards for the sincere, but imperfect obedience of believers in the covenant of grace:

Obj.4. The severity of divine justice does not render good according to works which are not perfectly good. But Christ in the final judgment will render to every one, and so to the saints also, according to their works. Therefore the works of the saints are so perfect that they will in themselves stand in the judgment of God.

Ans. There are here four terms; because the major must be understood of a legal reward of works, whilst the minor must be understood of a reward that is; evangelical; or to express it differently, we may say that the justice of God does not render good according to works which are imperfect, if he judges according to the covenant of perfect obedience to the law.

But Christ, in rewarding the works of the saints, will not judge according to the covenant of perfect works, but according to the covenant of faith, or of his own righteousness imputed and applied to them by faith; and yet he will judge them according to their works as according to the evidences of their faith, from which their works have proceeded, and which they, as the fruits of this faith, declare to be in them.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“While the covenant of works is not a prominent theme in Zacharias Ursinus’s Commentary on the Heidelberg Catechism, he does make at least one important reference to it in contrast to the covenant of grace. The idea that the covenant of works is a Westminsterian novelty has no credence in history. If it were a novel teaching of the Westminster Assembly, then why did prominent continental divines such as Francis Turretin and Herman Witsius also defend it? In the following extract, Ursinus contrasts the reward for obedience under the covenant of works with the rewards for the sincere, but imperfect obedience of believers in the covenant of grace:

Obj.4. The severity of divine justice does not render good according to works which are not perfectly good. But Christ in the final judgment will render to every one, and so to the saints also, according to their works. Therefore the works of the saints are so perfect that they will in themselves stand in the judgment of God.

Ans. There are here four terms; because the major must be understood of a legal reward of works, whilst the minor must be understood of a reward that is; evangelical; or to express it differently, we may say that the justice of God does not render good according to works which are imperfect, if he judges according to the covenant of perfect obedience to the law.

But Christ, in rewarding the works of the saints, will not judge according to the covenant of perfect works, but according to the covenant of faith, or of his own righteousness imputed and applied to them by faith; and yet he will judge them according to their works as according to the evidences of their faith, from which their works have proceeded, and which they, as the fruits of this faith, declare to be in them.”

— Zacharias Ursinus, Commentary on the Heidelberg Catechism, trans. G. W. Williard (1616; 2nd American edn, Columbus, 1852), pp 609-10.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhile+the+covenant+of+works+is+not+a+prominent+theme+in+Zacharias+Ursinus%E2%80%99s+Commentary+on+the+Heidelberg+Catechism%2C+he+does+make+at+least+one+important+reference+to+it+in+contrast+to+the+covenant+of+grace.+The+idea+that+the+covenant+of+works+is+a+Westminsterian+novelty+has+no+credence+in+history.+If+it+were+a+novel+teaching+of+the+Westminster+Assembly%2C+then+why+did+prominent+continental+divines+such+as+Francis+Turretin+and+Herman+Witsius+also+defend+it%3F+In+the+following+extract%2C+Ursinus+contrasts+the+reward+for+obedience+under+the+covenant+of+works+with+the+rewards+for+the+sincere%2C+but+imperfect+obedience+of+believers+in+the+covenant+of+grace%3A%0A%0AObj.4.+The+severity+of+divine+justice+does+not+render+good+according+to+works+which+are+not+perfectly+good.+But+Christ+in+the+final+judgment+will+render+to+every+one%2C+and+so+to+the+saints+also%2C+according+to+their+works.+Therefore+the+works+of+the+saints+are+so+perfect+that+they+will+in+themselves+stand+in+the+judgment+of+God.%0A%0AAns.+There+are+here+four+terms%3B+because+the+major+must+be+understood+of+a+legal+reward+of+works%2C+whilst+the+minor+must+be+understood+of+a+reward+that+is%3B+evangelical%3B+or+to+express+it+differently%2C+we+may+say+that+the+justice+of+God+does+not+render+good+according+to+works+which+are+imperfect%2C+if+he+judges+according+to+the+covenant+of+perfect+obedience+to+the+law.%0A%0ABut+Christ%2C+in+rewarding+the+works+of+the+saints%2C+will+not+judge+according+to+the+covenant+of+perfect+works%2C+but+according+to+the+covenant+of+faith%2C+or+of+his+own+righteousness+imputed+and+applied+to+them+by+faith%3B+and+yet+he+will+judge+them+according+to+their+works+as+according+to+the+evidences+of+their+faith%2C+from+which+their+works+have+proceeded%2C+and+which+they%2C+as+the+fruits+of+this+faith%2C+declare+to+be+in+them.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Commentary+on+the+Heidelberg+Catechism%2C+trans.+G.+W.+Williard+%281616%3B+2nd+American+edn%2C+Columbus%2C+1852%29%2C+pp+609-10.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F264cd5e128.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/264cd5e128.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/08/11/zacharias-ursinus-on-the-covenant-of-works-and-the-reward-for-obedience-in-the-gracious-covenant/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-02254d7d48" data-kw="">
<blockquote><p>1. The law of Moses was, in the first place, a re-enactment of the covenant of works. A covenant is simply a promise suspended upon a condition. The covenant of works, therefore, is nothing more than the promise of life suspended on the condition of perfect obedience. The phrase is used as a concise and convenient expression of the eternal principles of justice on which God deals with rational creatures, and which underlie all dispensations, the Adamic, Abrahamic, Mosaic and Christian. Our Lord said to the lawyer who asked what he should do to inherit eternal life, “What is written in the law? How readest thou? And he answering said, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy strength, and with all thy mind; and thy neighbour as thy-self. And he said unto him, Thou hast answered right, this do and thou shalt live,” Luke 10:26–28. This is the covenant of works. It is an immutable principle that where there is no sin there is no condemnation, and where there is sin there is death. This is all that those who reject the gospel have to fall back upon. It is this principle which is rendered so prominent in the Mosaic economy as to give it its character of law. Viewed under this aspect it is the ministration of condemnation and death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, (New York: A. C. Armstrong &amp; Son, 1891), 57–58.</span></figcaption>

e-is-a-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-c1cfe68768" data-kw="">
<blockquote><p>The communion and fellowship of man with God, was first founded on a covenant of works made with Adam in paradise. If he did obey, and did not eat of the forbidden fruit, he should have life both for himself and his posterity; the which covenant, because God would not have forgotten, he afterward renewed in the delivery of the ten Commandments, requiring from man obedience to them in his own person, exactly, at all times, perpetually: promising life on the obedience, and threatening death and cursing if he continued not in everything the law required to do. But this fellowship being places in man’s own freedom, and having so weak a foundation, he lost both himself and it, so that now by the first covenant of works, Adam and all his posterity are under a curse; for we cannot fulfill the law that requireth personal obedience, perfect obedience, and exact obedience. He that ‘continueth not in all is cursed,’ Gal. iii. 10. The law then findeth us dead and killeth us. It findeth us dead before, and not only leaves us dead still, but makes us more dead.</p></blockquote>

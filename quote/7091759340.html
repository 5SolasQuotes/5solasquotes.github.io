<main class="wrap"><figure class="quote" id="q-7091759340" data-kw="">
<blockquote><p>If it be said, that final perseverance, which is so express a condition of salvation in the new covenant, is not indeed the condition of our first justification, but it is the condition of the continuation of our justification; then they yield up their grand position, that whatever is a necessary condition of the new covenant is a necessary condition of justification: for it is that which they call the first justification alone which we treat about. And that the continuation of our justification depends solely on the same causes with our justification itself, shall be afterwards declared.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-perseverance.html">Justification and Perseverance</a></span><span class="t"><a href="../topics/arminians-remonstrants/neonomianism.html">Arminians (Remonstrants): Neonomianism</a> › <a href="../topics/arminians-remonstrants/neonomianism/reply-christs-righteousness-alone.html">Reply: Christ’s righteousness alone</a></span><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a> › <a href="../topics/justification/faith-alone/sola-fide.html">Sola fide</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a52597727f" data-kw="">
<blockquote><p>For my part I cannot understand that the continuation of our justification has any other dependencies than has our justification itself. As faith alone is required unto the one, so faith alone is required unto the other, although its operations and effects in the discharge of its duty and office in justification, and the continuation of it, are diverse; nor can it otherwise be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-abb5c059c8" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>

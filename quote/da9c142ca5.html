<main class="wrap"><figure class="quote" id="q-da9c142ca5" data-kw="">
<blockquote><p>Surely it is a notable gift that we may be reckoned among the number of God’s creatures. And who doubts, but that it is well done, to give thanks unto God for it [one’s birth], and in thanksgiving to testify the joyfulness of mind by an outward token of some modest banket? The use of honest pleasures is such, as they have always godliness joined with them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Places… (London: Henrie Denham et al., 1583), pt. 2, 7. ‘The Fourth Precept: of Sanctifying the Sabbath Day’, section 6, ‘Whether it be lawful to solemnize the birthday of any man’</cite>, p. 377</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-8ed6be2948" data-kw="">
<blockquote><p>The fourth precept is about sanctifying the sabbath in holy services through hearing, reading, and meditating upon the Word of God, and through use of the sacraments. Negatively, it is about not violating the sabbath through occupational employment, marketing, physical labors, games, jokes, frolics, feasts, or the mere form of piety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-althusius.html">Johannes Althusius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Politica: an Abridged Translation trans. F. Carney (1603/1610/1614; Liberty Fund, 1995), ch. 21, § 25</cite>, p. 141</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-f5fc829787" data-kw="">
<blockquote><p>The precept of the Sabbath observance is moral in one respect, insofar as it commands man to give some time to the things of God, according to Ps. 45:11: ‘Be still and see that I am God.’ In this respect it is placed among the precepts of the decalogue: but not as to the fixing of the time, in which respect it is a ceremonial precept.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1 of 2, quest. 100, article 3, reply to Objection 2</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-cee810d883" data-kw="">
<blockquote><p>As for the refreshing of our spirits and quickening them, and thereby making us the fitter for God’s service, as in any modest exercise of the body in private according to every man’s particular disposition, to prevent drowsiness and dulness in attending to God’s Word, in praying in singing of psalms, I know none that takes any exception against it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Morality of the Fourth Commandment as still in Force to Bind Christians… (London, 1641) | The Preface of the Translator, section 8, Examination</cite>, p. 185</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

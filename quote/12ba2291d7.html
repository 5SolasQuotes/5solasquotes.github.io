<main class="wrap"><figure class="quote" id="q-12ba2291d7" data-kw="">
<blockquote><p>…you must know therefore that righteousness is no proper real being, but a modus entis, ‘the modification of a being’. The subject of it is: 1. an action, 2. or a person. An action is the primary subject, and so the disposition; and the person secondary, as being therefore righteous, because his disposition and actions are so. Righteousness is the conformity of dispositions and actions, and consequently the person to the rule prescribed. It is not a being distinct therefore from the dispositions and actions, but their just and well being. This [de]finition is only of the creatures’ righteousness. God is the Primum Iustum, and so the rule of righteousness to the creature, and has no rule but Himself for the measuring of his actions. Yet his essence is too far above us, remote and unknown to be this rule to the creature, therefore has He given us his laws, which flow from his perfection, and they are the immediate rule of our dispositions and actions and so of our righteousness. Here carefully observe, that this law has two parts: 1. The precept and prohibition prescribing and requiring duty: 2. The promise and commination [threatening] determining of the reward of obedience, and penalty of disobedience. As the precept is the principal part, and the penalty annexed but for the precept’s sake; so the primary intent of the lawgiver is the obeying of his precepts, and our suffering of the penalty is but a secondary for the attaining of the former. So is there accordingly a two-fold Righteousness or fulfilling of this law, (which is the thing I would have observed): the primary, most excellent and most proper Righteousness lies in the conformity of our actions to the precept: The secondary, less excellent righteousness) yet fitly enough so called) (see Pemble, Of Justification, p. 2) is, when though we have broke the precepts, yet we have satisfied for our breach, either by our own suffering, or some other way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification… (Hague, 1655), thesis 16</cite>, pp. 62-64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7f5dd95c2e" data-kw="">
<blockquote><p>Bellarmine: Good works are necessary not only by a necessity of presence, but also by efficiency, so Scripture, the Fathers and sane reason teaches. The Orthodox: Good works do not precede one justified, but necessarily follow one justified and precede unto salvation. They are yet ordinarily necessary by adults out of the supposition or necessity: 1. Of presence, as signs and effects of true faith. 2. Of divine command. 3. of a means, so far as they are the way of salvation, a condition and cause sine qua non [without which there is nothing]. If therefore by the term ‘efficiency’ Bellarmine does not mean some form of merit, or properly the virtue and worth of them in comparison to salvation, that saying is able to be admitted. Good works certainly work unto eternal life following, but not by meriting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-alsted.html">Henry Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Controversy 10, ‘Whether Good Works are Necessary?’ in ‘Of Justification &amp; of Good Works in General’ in pt. 4, Controversies with the Papists in Polemical Theology… in Seven Parts (Hanau, Germany, 1620)</cite>, p. 496</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

opener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9294436715" data-kw="">
<blockquote><p>Controversy V: Are good works necessary? Position of [the Romanist Robert] Bellarmine: Good works are necessary not only by necessity of presence but also of efficiency, as Scripture, the Church Fathers, and sound reason teach. Orthodox Position: Good works do not precede the justified but necessarily follow him and precede the one who will be saved. They are necessary for adults in an orderly manner, by hypothesis or necessity: 1. Of presence, as signs and effects of faith. 2. Of divine commandment. 3. Of means, for they are the way to salvation, condition, and sine qua non cause. Therefore, if Bellarmine does not understand efficiency as some merit or inherent force and dignity of good works in obtaining salvation, this phrase can be admitted. Good works contribute to attaining eternal life, but not by merit. Therefore, the apparatus of arguments reported here is useless.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alsted.html">Johann H. Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio (d. 1638) at Nosferatu’s Substack (2024)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

%20reported%20here%20is%20useless" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b3d711adc6" data-kw="">
<blockquote><p>By setting aside the contrary supposition, he proves his statement, that by grace we are saved, — that we have no remaining works by which we can merit salvation; for all the good works which we possess are the fruit of regeneration. Hence it follows, that works themselves are a part of grace.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-843185e20b" data-kw="">
<blockquote><p>…Hosea, ch. 6:6, where a general reason is intimated, that a ceremony of the Levitical Law must not hinder a necessary duty of the moral law. Therefore his conversing with them for their edification was not unlawful nor uncomely, for all rituals must give way to morals… these words are brought not only to vindicate this fact of Christ, but secretly to tax the Pharisaical hypocrisy of those who place religion in rituals more than morals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Preference of Duties: Morals Before Rituals’ on Mt. 9:13 in Works, vol. 2, Several Discourses Tending to Promote Peace and Holiness, pp. 6-22</cite>, p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>
<div class="actions"><button class="copy" data-copy="“…Hosea, ch. 6:6, where a general reason is intimated, that a ceremony of the Levitical Law must not hinder a necessary duty of the moral law. Therefore his conversing with them for their edification was not unlawful nor uncomely, for all rituals must give way to morals… these words are brought not only to vindicate this fact of Christ, but secretly to tax the Pharisaical hypocrisy of those who place religion in rituals more than morals.”

<main class="wrap"><figure class="quote" id="q-906ec32c7c" data-kw="">
<blockquote><p>This comes in here as a token of God’s displeasure at those who married strange wives; He threatens to withdraw from them his Spirit, whom they had grieved by such marriages, contrary to their convictions: fleshly lusts are often punished with spiritual judgments, the sorest of all judgments. Or as another occasion of the great wickedness of the old world; the Spirit of the Lord, being provoked by their resistance of his motions, ceased to strive with them, and then all religion was soon lost among them. This He warns them of before, that they might not further vex his Holy Spirit, but by their prayers might stay Him with them. Observe in this verse, I. God’s resolution not always to strive with man by his Spirit. The Spirit then strove by Noah’s preaching (1 Pt. 3:19–20) and by inward checks, but it was in vain with the most of men; therefore, says God, He shall not always strive. Note, 1. The blessed Spirit strives with sinners, by the convictions and admonitions of conscience, to turn them from sin to God. If the Spirit be resisted, quenched, and striven against, though He strive long, he will not strive always, Hos. 4:17. Those are ripening apace for ruin whom the Spirit of grace has left off striving with. II. The reason of this resolution: For that he also is flesh, that is, incurably corrupt, and carnal, and sensual, so that it is labor lost to strive with him. Can the Ethiopian change his skin? He also, that is, All, one as well as another, they have all sunk into the mire of flesh. Note, 1. It is the corrupt nature, and the inclination of the soul towards the flesh, that oppose the Spirit’s strivings and render them ineffectual. When a sinner has long adhered to that interest, and sided with the flesh against the Spirit, the Spirit justly withdraws his agency, and strives no more. None lose the Spirit’s strivings but those that have first forfeited them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 6:3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-05c3589b7c" data-kw="">
<blockquote><p>Secondly, there is Voluntas Signi [will of sign], a manifestation of his will, whether it be in his works, which are the fruits of his will, or his Word which is the evidence of his will, directing us to the knowledge what He would have us do. A sense tropical and figurative, yet most proper to inform us: and this is scattered into five divisions or species. First, Permissio, his permission or allowance, or privilege to things, without which they cannot be; Non fit aliquid nisi omnipotens fieri velit, vel sinendo ut fiat, vel faciendo [Nothing comes to be unless the Omnipotent wills it to come to be, either by permitting it to come to pass or by bringing it about]. (Augustine, Enchiridion) Secondly, Impletio, the perfecting or fulfilling of them. Thirdly, Consilium, his revealed decree. Fourthly, Praeceptum, his positive law; his precepts wherein He teaches and commands us to do what is acceptable in his sight. Fifthly and lastly, Prohibitio, the restraint He lays upon us, his command for the eschewing those actions which are contrary to his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-king.html">Henry King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Lord’s Prayer, delivered in certain sermons in the cathedral Church of St. Paul</cite>, (London: Haviland, 1628), ‘Thy will be done in earth as it is in heaven’, pp. 146-47 King (1592–1669) was the Bishop of Chichester, a poet and a friend of John Donne.</span></figcaption>

href="../quote/05c3589b7c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-revealed-will/#:~:text=Secondly%2C%20there%20is%20Voluntas%20Signi%20%5Bwill,which%20are%20contrary%20to%20his%20will&amp;text=Secondly%2C%20there%20is%20Voluntas%20Signi%20%5Bwill%20of%20sign&amp;text=those%20actions%20which%20are%20contrary%20to%20his%20will" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-46d54d6e63" data-kw="">
<blockquote><p>Doctrine 3. ‘Counsel of his will’. That is which his will propounded to it, [it] did freely accept. Observe hence that what God wills once, that He effectually works, see Ps. 115, ‘Our God is in heaven and does whatsoever He wills: Who has refused his will?’ so Isa. 46:10. We see in beasts that they have an appetite to that [which] they move after; in men that which they will, that they put out their power to effect; so it is in God: if He will anything, He does work it effectually. That is a frivolous distinction of an effectual and an ineffectual will in God, which stands neither with truth of Scripture, as in this place, nor with the blessedness of God, nor with the nature of things: all that showed Him, which his will accepts, He does effectually work it. [It is] Against [the] blessedness of God: for might God will a thing and not have it, He were not fully blessed, when to have every good will is more blessed than to want [lack] it. Against [the] nature of things, for everything which will and ability works, if God almighty have will to anything, the thing must needs follow. Where there is full power to work anything, applied to the working of it, the thing wrought must needs follow. Here some distinguish and say that in things which God will do, his power does work them effectually, but the things which God would have on condition from us, those his power does not work: an old Pelagian conceit. Would not God have us walk in his commandments, and has He not said that He will put his Spirit in us and make us walk in them? St. Augustine learned that God did promise to work mightily those things He requires from us. If to have the conditional will be more happy than to want it, then God who has power to work the condition in us will not want it: Not to say that this conditional will is absurdly imagined in God: He must will the having a thing on condition which He will not work, and then it is impossible, unless the creature can do something good which He will not do in him; or on condition which He will work, and then He works all He wills; or on such a condition which He sees the creature cannot perform, nor Himself will not make Him perform; and this were idle and frivolous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the First Chapter of the Epistle of Saint Paul, written to the Ephesians</cite>, … some Principal Controversies about Predestination are handled, and diverse arguments of Arminius are examined (London, 1618), on Eph. 1:11, pp. 254-55 Note Baynes’s context against Arminius.</span></figcaption>

</figure><figure class="quote" id="q-fcd6562ca2" data-kw="">
<blockquote><p>But against this it may be objected what St. Peter [and Timothy] says: that He would have all men to be saved and to come to the knowledge of his will. (2 Pet. 3 [v. 9]; 1 Tim. 2:4) And therefore either there are diverse and contrary wills in God, or it is his will that all should be saved, but yet are not, because they will not believe. I answer: That the will of God is diversely distinguished by the doctors, as [John] Damascene (The will of God is not diverse, Damascene, bk. 2, ch. 46), into an: 1. Antecedent will 2. Consequent will Lombard and the Schoolmen (bk. 1, ch. 45) into his: 1. Signified will 2. Well-pleasing will Tertullian (Lib. Exhort. ad castitatem.), into his: 1. Efficient will 2. Permissive will Whereof he calls the first voluntas pura and the other voluntas indulgentiae. St. Augustine (Enchiridion, ch. 102 &amp; 103), into his: 1. Effectual working and omnipotent will 2. Not working, or not efficient will Others into his: Absolute will Conditional will Others into his Secret will Revealed will All which, and all such like distinctions of God’s will, if they be diligently observed and well understood, do fall into the same end and do no ways prove either diverse wills to be in God or any contradiction to be in the will of God. For it is most certain that as the essence of God is most simple, without composition or division, so the will of God, which is nothing else but his eternal decree concerning all things, is one and the selfsame immutable and unresistible: in so much that the wicked, who as much as in them lies, do resist the will of God revealed and commanded unto us in his Word, yet notwithstanding, will they, nill they, they fulfill the will of God decreed in Himself from all eternity; as you may see most plainly in the example of Pilate, Herod and the wicked Jews, who in crucifying Christ, rebelled and resisted the will of God revealed in his word, yet herein they did perform the secret will of God, which before all worlds He had determined should be done, as St. Peter shows (Acts 2:23; Augustine in Enchiridion, ch. 98), Et sic in hoc ipso quod contra voluntatem Dei fecerunt, de ipsis facta est voluntas eius: And so in this very thing wherein they did against God’s will, God effected his own will. (Idem, de cor. et gratia) Et de his qui faciunt quod non vult, facit ipse, quae vult: And touching these men which do against his will, He does whatsoever He will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gryffith.html">William Gryffith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Delights of the Saints</cite>, … (London: Butter, 1622), pt. 1, pp. 11-13 Gryffith (c.1589–1672) was an Anglican bishop, opposed to the puritans.</span></figcaption>

<blockquote><p>…there is a two-fold will of God; one that is revealed in Scripture, or the Law of Nature, and that is the Moral good that God approves and enjoins to us, rather than the will of God; this the Familists call the exterior or accidental will of God, because God’s will, as his essence, should have been entire and self-sufficient, though God had never revealed any such will to men or angels, yea though He had never made the world, or men, or angel.</p></blockquote>

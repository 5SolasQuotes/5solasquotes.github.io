<blockquote><p>VII. An example is [the Lutheran] Matthias Flacius Illyricus, who, in a dispute against Victorinus Strigelius in the sixties of the last century, asserted that original sin is substantial and continued to assert it. He did not realize this implied that God, if not the author of sin as he denied, was not the Creator of all substances and things, thus implying two creators and two gods. Flacius did not understand or admit that this followed from his premises. It is unjust to say that Flacius held there were two gods, although this could be deduced from his opinions by sound consequences.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-calixt.html">George Calixt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Judgment on Theological Controversies agitated between the Lutherans &amp; Reformed, and on the mutual brotherhood and tolerance of parties because of consensus in the fundamentals</cite>, tr. by AI by WesternCatholike (1650; Leiden, 1652), pp. 4-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>

<blockquote><p>X. If I say that God, pitying mankind, who through their own crime and the devil’s deceit have fallen into sin and destruction, sent His only-begotten Son. He became man for the sake of men, suffered and died, rose again, and ascended into heaven, obtaining remission of sins and eternal life for them. This great benefit of His Son, God makes known and proclaims to men through the preaching of the Gospel. Those who acknowledge and grieve over their sins, assent to the Gospel, believe in the Son, and trust in His merit and death, are reconciled to God, obtain remission of sins, and are transferred from a state of wrath and damnation to a state of glory and salvation, in which they will remain and surely become partakers of eternal glory, if, since they have believed and been reconciled to God, they strive to observe the divine commandments, do not live according to the flesh, and, with the help of divine grace, avoid committing sins against conscience. Thus, a man will be justified in this life and glorified in the future. If, I say, we use such words, taken from common usage and easily understood by anyone, there can be no disagreement among pious and gentle Christians about the doctrine. No one of them, unless afflicted by a vile and malicious urge to contend and quibble, will question this. But if I say, this is the principal efficient cause; this is the proximate principal cause; this is instrumental on the part of God, this on the part of man; this is merely a disposition; this is the formal cause itself; this is material, this necessary per se, this according to the hypothesis, if I start speaking this way, then it may easily happen that some will misunderstand or plainly not understand me, or interpret me differently than I intend; and thus, a controversy will arise over the use and application of such terms, which is purely scholastic and should not be given such importance that it disrupts the bond of Christian love and concord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-calixt.html">George Calixt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Judgment on Theological Controversies agitated between the Lutherans &amp; Reformed, and on the mutual brotherhood and tolerance of parties because of consensus in the fundamentals</cite>, tr. by AI by WesternCatholike (1650; Leiden, 1652), pp. 5-6</span></figcaption>

</figure><figure class="quote" id="q-55f07de450" data-kw="">
<blockquote><p>If one would participatingly accommodate a measure of indecency in a civil assembly for the good in it and out of respect and submission to public order, how much more ought one to do so in charity for the Church’s public worship, as such common and legitimately applied civil principles do not need a Scripture precedent and “God is not the author of confusion, but of peace.” (1 Cor. 14:33)? Often doing something that is inconvenient and less than fully decent or in the best order, given the larger context, is more decent, orderly¹ (1 Cor. 14:40) and conducive to peace,² and less confusing, than not, especially for leaders. ¹ Such as in a person eating the distasteful and questionable food at another’s house so as to prevent offense rather than abstain. How much more in the House of God? ² Zanchi: “Wherefore many things are to be tolerated by the ministers that the peace of churches be not rent and that schisms may be avoided, so that they be not such things or doctrines which do fight with the foundation and do heave at it;” On Philippians, ch. 1, fol. 45, as trans. by Sprint, Cassander Anglicanus, ‘Reformed Practices’, p. 167. Are not peace, love and mercy weightier matters of the Law (Mt. 23:23; Mk. 12:33; Rom. 14:19; 1 Cor. 13:13)? and external ceremonial observances are to give way to moral law? (Hos. 6:6; Mk. 12:33) “But if ye had known what this meaneth, ‘I will have mercy, and not sacrifice,’ ye would not have condemned the guiltless.” (Mt. 12:7)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Extended Editor’s Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 88</span></figcaption>

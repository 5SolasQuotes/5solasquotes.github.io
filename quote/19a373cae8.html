<main class="wrap"><figure class="quote" id="q-19a373cae8" data-kw="">
<blockquote><p>Fourth, it is asked whether Christians can have a Jew or Saracen as a slave. It seems that they can: By what is said in XXIII, q. 8, Dispar, where it is said concerning Saracens, and in the Extra, De Iudaeis, where it is said that Jews were subjected by their own fault to perpetual servitude. Therefore Christians can have a pagan or Jew as a slave. This also obtains by custom in remote parts. On the contrary: 1. XXVIII, q. 1, where it is said: Whoever among those who have been baptized have not henceforth avoided the company of unbelievers, let them be given to Christians and let those men be publicly assigned to beatings. And there too: Let no cleric or layman dwell with Jews. And the apostle seems to give the reason, 1 Cor. 15:33: ‘Evil company corrupts good morals.’ [Solution]: To this it must be said that it is permitted for a Christian to have a pagan or Jew as a subject; yet he ought not to have familiarity with him, as is had in the Extra, De Iudaeis, Ad: for too great familiarity could be an occasion of drawing these men to the evil of unbelief. If, however, that man should wish to become a Christian in actuality, he ought not to be forbidden: for the inspiration of the Holy Spirit in such matters is not to be repelled. Nor by this is the service of the master taken away, but he ought to serve, or otherwise his liberation from servitude ought to be procured. To the objections: 1. However, it must be said in the contrary sense that from those authorities the subjection of servitude is not denied, but cohabitation of familiarity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-of-hales.html">Alexander of Hales</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sum of Universal Theology (Paris, 1230-1245), pt. 2 of 2, inq. 3, tract 8, sect. 1, quest. 1, title 2 | member 2 | ch. 4, ‘Whether Christians can have a Jewish or Saracen Slave?’</cite></span></figcaption>

<blockquote><p>The Jews are to be tolerated amongst Christians now, when they are out of the Covenant, as they did tolerate us gentiles when we were out of the Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sect. 6, ‘Whether the Jews are to be suffered in a Christian commonwealth or not?’ in A Treatise of the Four Degenerate Sons… (London: Cotes, 1636), 4th Degenerate Son, pp. 337-43</cite>, p. 337</span></figcaption>

</figure><figure class="quote" id="q-4f760fe242" data-kw="">
<blockquote><p>It was a saying of Martin Luther, Se propter unum Judaeum crucifixum omnibus favere Judaeis [Due to one crucified Jew, there is favor to all the Jews]. And if we love them and desire their conversion and salvation (as in Christian charity certainly we ought), then the way to effect that will not be to banish them and prohibit their habitation amongst us, so compelling them to live amongst Turks, Pagans or Papists; The images and idolatry of which last has undeniably been the greatest scandal, and Remora, which has long hindered them from being Christians. Whereas (if they be permitted to live amongst us) that stumbling-block will be taken away. 2. For the conditions of their admission, for the restrictions and limitations to be put upon them, a great deal of caution and Christian prudence is to be used, lest while we pretend their good we do mischief to ourselves. For as to deny them all liberty and commerce with us, may be an act of unchristian and indeed inhumane cruelty; So to give them too much is an act of imprudence and folly. And indeed we find some sober men (not without good reason) complain of the too much liberty they have in some Christian commonwealths. In short, what qualifications and limitations are to be put upon them, I shall not take upon me to determine, but leave that to the piety and prudence of the State. Yet (with submission) I conceive such limitations as these will be convenient, if not necessary; the rather because I find in our histories, in the imperial and canon laws, and in the old capitulars and canons of councils that such restrictions have been anciently laid upon them, as: 1. No toleration ever was, or de jure can be given them to profess or practice anything against the Law of Nature. 2. No toleration should be given them to speak anything blasphemously or impiously against Jesus Christ and the gospel: For though we may tolerate them in the profession of a bad, yet not in that blasphemy of a good, religion. 3. They never were nor should be permitted to circumcise children of Christians, or seduce any Christians to their religion: Let them profess, but not propagate their religion. 4. They were not permitted to carry any office or dignity in the Christian commonweal, though it seems that sometimes even that was permitted them. 5. They were not permitted in any suit or difference between a Jew and a Christian to draw the Christian or his Cause before a Jewish magistrate: For ’tis a ruled case in the Imperial Law, Judaeus Actor vel reus, Forum sequitur Christianum. 6. They were never permitted to make marriages with Christians, and the Glossator gives the reason of it in Law, Quia matrimonium debet esse communicatio divini &amp; humani juris. Whereas a Jew and Christian, being of different religions, cannot communicare in sacis. And this is consonant to the Law of the Gospel, which forbids us to be unequally yoked. Upon which grounds, I believe all marriages with Papists to be unlawful, that is, Fieri non debuit, ’tis unlawful to make such matches, though that factum valet, when such a match is made, the contract is valid. 7. Their frequent divorcing their wives was tolerated. For though Moses seem to suffer it, yet the emperors by express edict forbid it. 8. By the Imperial Laws polygamy and plurality of wives was not tolerated in them. 9. If any of the Jews turn Christian (by civil law) in case the Jews endeavored to reduce him, and maliciously injured him, they were to be burned for it. 10. They might repair their old synagogues, but were not tolerated (by the Roman Laws) to build new. 11. They were not tolerated to have any Christian servants, nurses, or midwives. Can. Praesenti. 1. Extra de Judaeis. Ex concilio malis conenti. 12. By the Canon Law they might not come abroad on Good Friday. 13. They were not permitted to wear Garments exactly of the Christian fashion, but were to have distinct habits [garments], that all might know them to be Jews. 14. They might not be physicians or give physick to any Christian. 15. They were not permitted to be of the Roman militia (though they were permitted to be advocates) by the rescript of Honorius and Arcadius to Romulianus P. P. 16. The Jews, being the greatest usurers in the world, and believing they may justly take the highest use they can get (even Usurae centessimae, if they could have it) of us gentiles, it is all the reason in the world they should be limited in this particular and not permitted to take more of us than the law permits us to take one of another. 17. They should be enjoined to admit of friendly collations and disputations sometimes about gospel truths, and not obstinately to reject all means of conversion and conviction, and satisfaction of those seeming reasons which keep them off from embracing the truth: For there will be little hopes (or possibility) of their conversion, if they be permitted obstinately to refuse all means of doing it. But enough (if not too much) of this, I shall only add one old law concerning the Jews made before the Conquest (above 600 years ago) and confirmed by the conquerors amongst other the good laws of Edward the Confessor, and so continued law (for ought I know) in all the kings’ reigns till the banishment of the Jews, which was anno 18 Edwardi 1. The Law is this: Sciendum quoque quod omnes Judaei, ubicunque in Regno sunt, sub tutela et defensione Regis ligea debent esse; nec quilibet eorum alicui Diviti se potest subdere, sine Regis licentia. Judaei enim, et omnia sua Regis sunt, Quod si quisquis detinuerit eos, vel Pecuniam eorum, perquirat Rex si vult, tanquam suum proprium. [It should also be known that all Jews, wherever they are in the kingdom, ought to be under the protection and defense of the king’s liege authority; nor may any one of them submit himself to any rich man without the king’s permission. For the Jews, and everything belonging to them, are the king’s. And if anyone detains them, or their money, the king may recover it if he wishes, as his own property.] I wish the chief magistrate could admit them on these terms, for so they, and all theirs (omnia sua) should be suum proprium, which possibly might supply him with money and so save taxes. And upon these terms I (and I believe everybody else) will willingly consent to their readmission.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/jews-and-muslims.html">Jews and Muslims</a></span></div>
<div class="actions"><button class="copy" data-copy="“It was a saying of Martin Luther, Se propter unum Judaeum crucifixum omnibus favere Judaeis [Due to one crucified Jew, there is favor to all the Jews]. And if we love them and desire their conversion and salvation (as in Christian charity certainly we ought), then the way to effect that will not be to banish them and prohibit their habitation amongst us, so compelling them to live amongst Turks, Pagans or Papists; The images and idolatry of which last has undeniably been the greatest scandal, and Remora, which has long hindered them from being Christians. Whereas (if they be permitted to live amongst us) that stumbling-block will be taken away. 2. For the conditions of their admission, for the restrictions and limitations to be put upon them, a great deal of caution and Christian prudence is to be used, lest while we pretend their good we do mischief to ourselves. For as to deny them all liberty and commerce with us, may be an act of unchristian and indeed inhumane cruelty; So to give them too much is an act of imprudence and folly. And indeed we find some sober men (not without good reason) complain of the too much liberty they have in some Christian commonwealths. In short, what qualifications and limitations are to be put upon them, I shall not take upon me to determine, but leave that to the piety and prudence of the State. Yet (with submission) I conceive such limitations as these will be convenient, if not necessary; the rather because I find in our histories, in the imperial and canon laws, and in the old capitulars and canons of councils that such restrictions have been anciently laid upon them, as: 1. No toleration ever was, or de jure can be given them to profess or practice anything against the Law of Nature. 2. No toleration should be given them to speak anything blasphemously or impiously against Jesus Christ and the gospel: For though we may tolerate them in the profession of a bad, yet not in that blasphemy of a good, religion. 3. They never were nor should be permitted to circumcise children of Christians, or seduce any Christians to their religion: Let them profess, but not propagate their religion. 4. They were not permitted to carry any office or dignity in the Christian commonweal, though it seems that sometimes even that was permitted them. 5. They were not permitted in any suit or difference between a Jew and a Christian to draw the Christian or his Cause before a Jewish magistrate: For ’tis a ruled case in the Imperial Law, Judaeus Actor vel reus, Forum sequitur Christianum. 6. They were never permitted to make marriages with Christians, and the Glossator gives the reason of it in Law, Quia matrimonium debet esse communicatio divini &amp; humani juris. Whereas a Jew and Christian, being of different religions, cannot communicare in sacis. And this is consonant to the Law of the Gospel, which forbids us to be unequally yoked. Upon which grounds, I believe all marriages with Papists to be unlawful, that is, Fieri non debuit, ’tis unlawful to make such matches, though that factum valet, when such a match is made, the contract is valid. 7. Their frequent divorcing their wives was tolerated. For though Moses seem to suffer it, yet the emperors by express edict forbid it. 8. By the Imperial Laws polygamy and plurality of wives was not tolerated in them. 9. If any of the Jews turn Christian (by civil law) in case the Jews endeavored to reduce him, and maliciously injured him, they were to be burned for it. 10. They might repair their old synagogues, but were not tolerated (by the Roman Laws) to build new. 11. They were not tolerated to have any Christian servants, nurses, or midwives. Can. Praesenti. 1. Extra de Judaeis. Ex concilio malis conenti. 12. By the Canon Law they might not come abroad on Good Friday. 13. They were not permitted to wear Garments exactly of the Christian fashion, but were to have distinct habits [garments], that all might know them to be Jews. 14. They might not be physicians or give physick to any Christian. 15. They were not permitted to be of the Roman militia (though they were permitted to be advocates) by the rescript of Honorius and Arcadius to Romulianus P. P. 16. The Jews, being the greatest usurers in the world, and believing they may justly take the highest use they can get (even Usurae centessimae, if they could have it) of us gentiles, it is all the reason in the world they should be limited in this particular and not permitted to take more of us than the law permits us to take one of another. 17. They should be enjoined to admit of friendly collations and disputations sometimes about gospel truths, and not obstinately to reject all means of conversion and conviction, and satisfaction of those seeming reasons which keep them off from embracing the truth: For there will be little hopes (or possibility) of their conversion, if they be permitted obstinately to refuse all means of doing it. But enough (if not too much) of this, I shall only add one old law concerning the Jews made before the Conquest (above 600 years ago) and confirmed by the conquerors amongst other the good laws of Edward the Confessor, and so continued law (for ought I know) in all the kings’ reigns till the banishment of the Jews, which was anno 18 Edwardi 1. The Law is this: Sciendum quoque quod omnes Judaei, ubicunque in Regno sunt, sub tutela et defensione Regis ligea debent esse; nec quilibet eorum alicui Diviti se potest subdere, sine Regis licentia. Judaei enim, et omnia sua Regis sunt, Quod si quisquis detinuerit eos, vel Pecuniam eorum, perquirat Rex si vult, tanquam suum proprium. [It should also be known that all Jews, wherever they are in the kingdom, ought to be under the protection and defense of the king’s liege authority; nor may any one of them submit himself to any rich man without the king’s permission. For the Jews, and everything belonging to them, are the king’s. And if anyone detains them, or their money, the king may recover it if he wishes, as his own property.] I wish the chief magistrate could admit them on these terms, for so they, and all theirs (omnia sua) should be suum proprium, which possibly might supply him with money and so save taxes. And upon these terms I (and I believe everybody else) will willingly consent to their readmission.”

— Thomas Barlow, ‘The Case of the Jews’ in Several Miscellaneous &amp; Weighty Cases of Conscience Learnedly &amp; Judiciously Resolved (d. 1691; London: 1692), pp. 3-78 For the many marginal references in the quote below, see the original., pp. 65-75">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+was+a+saying+of+Martin+Luther%2C+Se+propter+unum+Judaeum+crucifixum+omnibus+favere+Judaeis+%5BDue+to+one+crucified+Jew%2C+there+is+favor+to+all+the+Jews%5D.+And+if+we+love+them+and+desire+their+conversion+and+salvation+%28as+in+Christian+charity+certainly+we+ought%29%2C+then+the+way+to+effect+that+will+not+be+to+banish+them+and+prohibit+their+habitation+amongst+us%2C+so+compelling+them+to+live+amongst+Turks%2C+Pagans+or+Papists%3B+The+images+and+idolatry+of+which+last+has+undeniably+been+the+greatest+scandal%2C+and+Remora%2C+which+has+long+hindered+them+from+being+Christians.+Whereas+%28if+they+be+permitted+to+live+amongst+us%29+that+stumbling-block+will+be+taken+away.+2.+For+the+conditions+of+their+admission%2C+for+the+restrictions+and+limitations+to+be+put+upon+them%2C+a+great+deal+of+caution+and+Christian+prudence+is+to+be+used%2C+lest+while+we+pretend+their+good+we+do+mischief+to+ourselves.+For+as+to+deny+them+all+liberty+and+commerce+with+us%2C+may+be+an+act+of+unchristian+and+indeed+inhumane+cruelty%3B+So+to+give+them+too+much+is+an+act+of+imprudence+and+folly.+And+indeed+we+find+some+sober+men+%28not+without+good+reason%29+complain+of+the+too+much+liberty+they+have+in+some+Christian+commonwealths.+In+short%2C+what+qualifications+and+limitations+are+to+be+put+upon+them%2C+I+shall+not+take+upon+me+to+determine%2C+but+leave+that+to+the+piety+and+prudence+of+the+State.+Yet+%28with+submission%29+I+conceive+such+limitations+as+these+will+be+convenient%2C+if+not+necessary%3B+the+rather+because+I+find+in+our+histories%2C+in+the+imperial+and+canon+laws%2C+and+in+the+old+capitulars+and+canons+of+councils+that+such+restrictions+have+been+anciently+laid+upon+them%2C+as%3A+1.+No+toleration+ever+was%2C+or+de+jure+can+be+given+them+to+profess+or+practice+anything+against+the+Law+of+Nature.+2.+No+toleration+should+be+given+them+to+speak+anything+blasphemously+or+impiously+against+Jesus+Christ+and+the+gospel%3A+For+though+we+may+tolerate+them+in+the+profession+of+a+bad%2C+yet+not+in+that+blasphemy+of+a+good%2C+religion.+3.+They+never+were+nor+should+be+permitted+to+circumcise+children+of+Christians%2C+or+seduce+any+Christians+to+their+religion%3A+Let+them+profess%2C+but+not+propagate+their+religion.+4.+They+were+not+permitted+to+carry+any+office+or+dignity+in+the+Christian+commonweal%2C+though+it+seems+that+sometimes+even+that+was+permitted+them.+5.+They+were+not+permitted+in+any+suit+or+difference+between+a+Jew+and+a+Christian+to+draw+the+Christian+or+his+Cause+before+a+Jewish+magistrate%3A+For+%E2%80%99tis+a+ruled+case+in+the+Imperial+Law%2C+Judaeus+Actor+vel+reus%2C+Forum+sequitur+Christianum.+6.+They+were+never+permitted+to+make+marriages+with+Christians%2C+and+the+Glossator+gives+the+reason+of+it+in+Law%2C+Quia+matrimonium+debet+esse+communicatio+divini+%26+humani+juris.+Whereas+a+Jew+and+Christian%2C+being+of+different+religions%2C+cannot+communicare+in+sacis.+And+this+is+consonant+to+the+Law+of+the+Gospel%2C+which+forbids+us+to+be+unequally+yoked.+Upon+which+grounds%2C+I+believe+all+marriages+with+Papists+to+be+unlawful%2C+that+is%2C+Fieri+non+debuit%2C+%E2%80%99tis+unlawful+to+make+such+matches%2C+though+that+factum+valet%2C+when+such+a+match+is+made%2C+the+contract+is+valid.+7.+Their+frequent+divorcing+their+wives+was+tolerated.+For+though+Moses+seem+to+suffer+it%2C+yet+the+emperors+by+express+edict+forbid+it.+8.+By+the+Imperial+Laws+polygamy+and+plurality+of+wives+was+not+tolerated+in+them.+9.+If+any+of+the+Jews+turn+Christian+%28by+civil+law%29+in+case+the+Jews+endeavored+to+reduce+him%2C+and+maliciously+injured+him%2C+they+were+to+be+burned+for+it.+10.+They+might+repair+their+old+synagogues%2C+but+were+not+tolerated+%28by+the+Roman+Laws%29+to+build+new.+11.+They+were+not+tolerated+to+have+any+Christian+servants%2C+nurses%2C+or+midwives.+Can.+Praesenti.+1.+Extra+de+Judaeis.+Ex+concilio+malis+conenti.+12.+By+the+Canon+Law+they+might+not+come+abroad+on+Good+Friday.+13.+They+were+not+permitted+to+wear+Garments+exactly+of+the+Christian+fashion%2C+but+were+to+have+distinct+habits+%5Bgarments%5D%2C+that+all+might+know+them+to+be+Jews.+14.+They+might+not+be+physicians+or+give+physick+to+any+Christian.+15.+They+were+not+permitted+to+be+of+the+Roman+militia+%28though+they+were+permitted+to+be+advocates%29+by+the+rescript+of+Honorius+and+Arcadius+to+Romulianus+P.+P.+16.+The+Jews%2C+being+the+greatest+usurers+in+the+world%2C+and+believing+they+may+justly+take+the+highest+use+they+can+get+%28even+Usurae+centessimae%2C+if+they+could+have+it%29+of+us+gentiles%2C+it+is+all+the+reason+in+the+world+they+should+be+limited+in+this+particular+and+not+permitted+to+take+more+of+us+than+the+law+permits+us+to+take+one+of+another.+17.+They+should+be+enjoined+to+admit+of+friendly+collations+and+disputations+sometimes+about+gospel+truths%2C+and+not+obstinately+to+reject+all+means+of+conversion+and+conviction%2C+and+satisfaction+of+those+seeming+reasons+which+keep+them+off+from+embracing+the+truth%3A+For+there+will+be+little+hopes+%28or+possibility%29+of+their+conversion%2C+if+they+be+permitted+obstinately+to+refuse+all+means+of+doing+it.+But+enough+%28if+not+too+much%29+of+this%2C+I+shall+only+add+one+old+law+concerning+the+Jews+made+before+the+Conquest+%28above+600+years+ago%29+and+confirmed+by+the+conquerors+amongst+other+the+good+laws+of+Edward+the+Confessor%2C+and+so+continued+law+%28for+ought+I+know%29+in+all+the+kings%E2%80%99+reigns+till+the+banishment+of+the+Jews%2C+which+was+anno+18+Edwardi+1.+The+Law+is+this%3A+Sciendum+quoque+quod+omnes+Judaei%2C+ubicunque+in+Regno+sunt%2C+sub+tutela+et+defensione+Regis+ligea+debent+esse%3B+nec+quilibet+eorum+alicui+Diviti+se+potest+subdere%2C+sine+Regis+licentia.+Judaei+enim%2C+et+omnia+sua+Regis+sunt%2C+Quod+si+quisquis+detinuerit+eos%2C+vel+Pecuniam+eorum%2C+perquirat+Rex+si+vult%2C+tanquam+suum+proprium.+%5BIt+should+also+be+known+that+all+Jews%2C+wherever+they+are+in+the+kingdom%2C+ought+to+be+under+the+protection+and+defense+of+the+king%E2%80%99s+liege+authority%3B+nor+may+any+one+of+them+submit+himself+to+any+rich+man+without+the+king%E2%80%99s+permission.+For+the+Jews%2C+and+everything+belonging+to+them%2C+are+the+king%E2%80%99s.+And+if+anyone+detains+them%2C+or+their+money%2C+the+king+may+recover+it+if+he+wishes%2C+as+his+own+property.%5D+I+wish+the+chief+magistrate+could+admit+them+on+these+terms%2C+for+so+they%2C+and+all+theirs+%28omnia+sua%29+should+be+suum+proprium%2C+which+possibly+might+supply+him+with+money+and+so+save+taxes.+And+upon+these+terms+I+%28and+I+believe+everybody+else%29+will+willingly+consent+to+their+readmission.%E2%80%9D%0A%0A%E2%80%94+Thomas+Barlow%2C+%E2%80%98The+Case+of+the+Jews%E2%80%99+in+Several+Miscellaneous+%26+Weighty+Cases+of+Conscience+Learnedly+%26+Judiciously+Resolved+%28d.+1691%3B+London%3A+1692%29%2C+pp.+3-78+For+the+many+marginal+references+in+the+quote+below%2C+see+the+original.%2C+pp.+65-75&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4f760fe242.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4f760fe242.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=It%20was%20a%20saying%20of%20Martin,will%20willingly%20consent%20to%20their%20readmission." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

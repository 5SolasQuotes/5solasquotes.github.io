<blockquote><p>There are many promises that in gospel times magistrates shall lay out their power and exert their authority for the furtherance and preservation of the true worship of God, the profession of the faith, the worshippers and professors thereof, and therein the whole interest of Zion, Isa. i. 26, xlix. 22, 23; […] All the promises relating unto God’s providential dispensations in the world, with reference unto the interest of his church and people, do centre in this, that the rulers in and of the world shall exert and exercise their power in subserviency to the interest of Christ, which lies in his truth and his worship; which cannot be done if the power inquired after by denied, Isa. lx. 3, 11-17; Rev. xi. 15: To say, then, that the supreme magistrate, in a commonwealth of men professing the true Christian religion, ought not to exert his legislative and executive power in the defence and for the furtherance of the truth and worship of God, and for the restraint of the things that are destructive thereunto, is to say that “the promise of God is of no effect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two questions concerning the power of the supreme magistrate about religion and the worship of God, with one about tithes, proposed and resolved</cite>, (Oxford, 1659) in The works of John Owen, ed. W. H. Goold (16 vols, Edinburgh, 1967), xiii,511-12.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“There are many promises that in gospel times magistrates shall lay out their power and exert their authority for the furtherance and preservation of the true worship of God, the profession of the faith, the worshippers and professors thereof, and therein the whole interest of Zion, Isa. i. 26, xlix. 22, 23; […] All the promises relating unto God’s providential dispensations in the world, with reference unto the interest of his church and people, do centre in this, that the rulers in and of the world shall exert and exercise their power in subserviency to the interest of Christ, which lies in his truth and his worship; which cannot be done if the power inquired after by denied, Isa. lx. 3, 11-17; Rev. xi. 15: To say, then, that the supreme magistrate, in a commonwealth of men professing the true Christian religion, ought not to exert his legislative and executive power in the defence and for the furtherance of the truth and worship of God, and for the restraint of the things that are destructive thereunto, is to say that “the promise of God is of no effect.”

f="https://reformedcovenanter.wordpress.com/2011/11/01/john-owen-on-the-duty-of-the-christian-magistrate-to-promote-true-worship/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-182cbf89de" data-kw="">
<blockquote><p>And here also we consider things circumstantial, as time, place, etc. And circumstances are either merely physical, or 2. merely moral, or 3. mixed, partly moral, partly physical; [1.] Circumstances merely physical are such adjuncts of divine worship as are common and inseparable concomitants of both civil, natural, and religious or sacred actions performed by men, and as they are such, contribute no moral goodness or badness to the action or agent in the performance thereof… All these are common concomitants of civil, natural, and religious actions, for all actions performed by man of what kind soever, as natural, to eat, sleep; or civil, to declaim an oration before the people; or religious, to preach or pray, must be done… in some time, in some place… for because he preaches in time, or in place simply, the preaching is neither morally good, nor ill, better or worse… 2. Some circumstances are merely moral, for as divines distinguish time and place; in time as time, and as such a religious time, the Lord’s Sabbath, Tempus, &amp; tempus ut sic [time, and a time so thus], and place as place, or such a religious place, Locus, &amp; locus ut sic. [a place, and a place so thus]. So we may distinguish here between circumstances in common or in gross, and such and such circumstances; As time is a common adjunct of divine worship: But such a time, to wit, the Lord’s Day is both the time of worship, and worship itself [in observing it]. So there is place of worship, and there is such a religious place, [in the Old Testament,] the holy of holiest, the Temple. A habit [garment] is a mere accident of worship; the person, John or Thomas, is also an accident; but if God command such an ephod as Aaron and the priests were to wear, this is not a mere [physical] circumstance [rather it is a moral circumstance because of its religious appointment]… And therefore these circumstances, taken in common and their universal nature, are merely physical circumstances; but taken in their particular and determinate restrictions, as such circumstances, they may be merely moral circumstances, such as are the common adjunct of the time of worship, the place, and the Sabbath time and the Temple for Jewish Worship. The former [two] are circumstances merely physical, the latter [two are] merely moral;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p.</span></figcaption>

<blockquote><p>This was it, which is here said to be according to the law: and that the judicial, ceremonial and moral law:

1. By the judicial law the Levites had not their portion in Canaan for their inheritance, as other tribes had: therefore in lieu thereof, by the said law they had the tenth of the rest of the people.

2. The holy services which they performed to the Lord for the people were ceremonial. Therefore the recompence given was by a like law.

3. The general equity that they who communicate unto us spiritual matters should partake of our temporals, and that they who are set apart wholly to attend God’s service should live upon that service, is moral.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, vol. 2, p. 108, section 40, ‘Of the law of paying tithes,’ on Heb. 7:5-7 Gouge (d. 1653) was an English puritan.</span></figcaption>

<blockquote><p>Some people are concerned that the existence of textual variants or passages which are difficult to translate undermines our confidence in the word of God. As James Ussher demonstrates below, such fears are groundless and contrary to common sense. The quote below pretty much sums up my own position:

How can the certain understanding of the Scriptures be taken out of the Original Tongues; considering the difference of Reading, which is in divers Copies both of Hebrew and Greek; as also the difficulty of some Words and Phrases upon which the best Translators cannot agree?

Although in the Hebrew Copies there hath been observed by the Masorites some very few differences of Words, by similitude of Letters and Points; and by the Learned in the Greek Tongue there are like diversities of Reading noted in the Greek Text of the New Testament, which came by fault of the Writers: yet in most by circumstance of the place and conference of other places, the true reading may be discerned. And albeit in all it cannot, nor the Translator in all places determine the true interpretation; yet this diversity or difficulty can make no difference or uncertainty in the sum and substance of Christian Religion; because the Ten Commandments, and the principal Texts of Scripture on which the Articles of our Faith are grounded, the Sacraments instituted, the Form of Prayer taught, (which contain the sum and substance of Christian Religion) are without such diversity of Reading, or difficulty of Translating so plainly set down, and so precisely translated by consent of Learned Men in the Tongues, that no Man can make any doubt of them, or pick any quarrel against them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A body of divinity: or, the sum and substance of Christian religion</cite>, ed. Michael Nevarr (1648; Herndon VA, 2007), p. 20.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Further I say that the force and efficacy of this most pure holiness which is in the flesh of Christ, flows even into us by the working of the Holy Ghost in us, so as we be hallowed in ourselves, that is to say, we be segregated from the defilings of this world, and serve God both in spirit and body. Which benefit is everywhere in the Scriptures called sanctification, or holiness, regeneration, or newbirth, illumination or enlightening, the new man, the new creature, and the Spirit or Spiritualness.</p></blockquote>

<blockquote><p>19. Because of this receiving, calling is termed conversion, Acts 26:20. All who obey the call of God are completely turned from sin to grace and from the world to follow God in Christ. It is also called regeneration or the very beginning of a new life, a new creation, a new creature–and it is often described in the Scriptures, Jn. 1:13; 3:6; 1 Jn. 3:9; 1 Pet. 1:23 and 2:2…

20. As for man, receiving is either passive or active. Phil. 3:12, ‘I apprehend, because I have been apprehended.’

21. The passive receiving of Christ is the process by which a spiritual principle of grace is generated in the will of man. Eph. 2:5, ‘He has quickened.’ …

30. Repentance has the same causes and principles as faith, for they are both free gifts of God. Eph. 2:8, ‘Faith is the gift of God;’ 2 Tim. 2:25, ‘Whether God may at some time give them repentance.’ They have the same subject; both have their seat in the heart or will of man. Rom. 10:9; 1 Kn. 8:48, ‘With the heart man believes.’ ‘They shall come back with all their heart.’ They are also begotten at the same time. But, first, they have diverse objects, for faith is properly directed to Christ and through Christ to God, but repentance is directed to God Himself who has been offended by the sin. Acts 20:21, ‘Turning towards God and faith in our Lord Jesus Christ.’ Second, they have diverse ends, for faith properly seeks reconciliation with God but repentance compliance with the will of God. Rom. 3:25, ‘A reconciliation through faith in his blood;’ Acts 26:20, ‘That they should… turn to God doing works fit for repentance.’

31. Repentance, so far as it comprises the care, anxiety, and terror connected with the law, precedes faith in order of nature, as a preparing and disposing cause, and is even found in the unregenerate; but insofar as it turns man away effectively and genuinely from sin, by which God is offended, it follows faith and depends upon it as an effect upon its cause and so belongs to those who have faith. … 34. Repentance is likely to be known before faith, because a sinner cannot easily persuade himself that he is reconciled to God in Christ before he feels himself to have left those sins which separated him from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, ed. tr. John Eusden (Labyrinth Press, 1983), bk. 1, ch. 26, ‘Calling’, pp. 158-60</span></figcaption>

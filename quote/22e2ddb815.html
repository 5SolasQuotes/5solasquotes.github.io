<main class="wrap"><figure class="quote" id="q-22e2ddb815" data-kw="">
<blockquote><p>The covenanters are often considered to have been unrelenting opponents of episcopacy. In the Glasgow Assembly of 1638, when nearly all covenanters voted to ‘remove and abjure’ episcopacy in the kirk, the Glaswegian minister Robert Baillie was the sole named dissenter. Baillie’s subsequent conformity to the covenanting regime after 1638 and his ultimate acceptance of the restored episcopate after 1661 have led historians to claim that he was pliantly obeying those in power. In order to offer an alternative explanation, this article explores the contours of Baillie’s writings on episcopacy in the periods 1637-9 and 1658-62. His views were informed by hatred of the Laudian episcopate and his belief that Scripture described a lawful form of episcopacy similar to the superintendents of the post-Reformation kirk. Whilst Baillie protested against the restored episcopate in 1661, the reasons for his subsequent submission suggest one explanation as to why many presbyterian ministers acquiesced in Charles II’s Erastian kirk settlement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-campbell.html">Alexander Campbell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Episcopacy in the Mind of Robert Baillie</cite>, 1637-1662’ The Scottish Historical Review, vol. 93, no. 236, pt. 1 (April 2014), pp. 29-55 | Abstract:</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c85f60f19f" data-kw="">
<blockquote><p>And here also we consider things circumstantial, as time, place, etc. And circumstances are either merely physical [which are not regulated], or 2. merely moral [which are regulated], or 3. mixed, partly moral, partly physical [which are partly regulated]… … 3. There be some mixed circumstances [of worship], as these same physical circumstances, clothed with their own seasonable conveniences; so time for worship, and due and convenient time is required, there may be some scandalous and superstitious time for worship… a place is required for private worship, and a fit place, such as is not the market-street for private praying; the inconveniency of the circumstance may vitiate the worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), pp. 2 &amp; 4</span></figcaption>

</figure><figure class="quote" id="q-e271a9cc48" data-kw="">
<blockquote><p>The third consideration is that there is some footsteps of this identity of bishop and presbyter in the most corrupt writtings of the most impure schoolmen: which may appear in these three: 1. In that, generally, episcopacy is holden to be no distinct order from presbytery; and that presbytery, or priesthood (as they speak) is the highest order in all their hierarchy. And this is current as the doctrine of Lombardus the Master of Sentences, Hugo, Aquinas, Thomas Waldensis, and generally of all the Thomists at least. And though they seem to make bishops to be of a more eminent degree, yet by Estius and some others alleged by him, this is not thought sufficient to distinguish one office from another.</p></blockquote>

</figure><figure class="quote" id="q-2f510999af" data-kw="">
<blockquote><p>That such inconveniencie may be shunned, it is fit that when any change is to be made in the policy of a Church, not the clergy alone, but the elders also, and men of understanding among the layity, in a lawfull assembly, freely give their voices and consent thereunto. Good reason have our writers to hold against Papists, that laymen ought to have place in councils, wherein things which concern the whole Church are to be deliberated upon.</p></blockquote>

</figure><figure class="quote" id="q-a3da0233f0" data-kw="">
<blockquote><p>This I do infinitely grieve at, that many most wholesome precepts of divine Scripture are little regarded, and in the meantime all is so full of many presumption, that he is more grievously found fault with who during this octaves touches the earth with his naked foot than he that shall bury his soul in drunkenness. And after, I cannot approve them, and I think they are to be cut off wheresoever we have power. Many of these things, for fear of scandalizing many holy persons, or provoking those that are turbulent, I dare not freely disallow.</p></blockquote>

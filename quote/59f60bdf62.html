<blockquote><p>The duties required in the sixth commandment are, all careful studies, and lawful endeavours, to preserve the life of ourselves[b] and others[c]… avoiding all occasions,[f]… and practices, which tend to the unjust taking away the life of any;[h]… quietness of mind,[l] cheerfulness of spirit;[m] a sober use of meat,[n] drink,[o] physick,[p] sleep,[q] labour,[r] and recreations;[s] by charitable thoughts,[t]… peaceable,[y] mild and courteous speeches and behaviour;[z] forbearance… [b] Eph. 5:28,29. [c] 1 Kings 18:4. [f] 2 Sam. 2:22. Deut. 22:8. [h] 1 Sam. 24:12. 1 Sam. 26:9-11. Gen. 37:21,22. [l] 1 Thess. 4:11. 1 Pet. 3:3,4. Ps. 37:8-11. [m] Prov. 17:22. [n] Prov. 25:16,27. [o] 1 Tim. 5:23. [p] Isa. 38:21. [q] Ps. 127:2. [r] Eccl. 5:12. 2 Thess. 3:10,12. Prov. 16:26. [s] Eccl. 3:4. [t] 1 Sam. 19:4,5. 1 Sam. 22:13,14. [y] James 3:17. [z] 1 Pet. 3:8-11. Prov. 15:1. Judges 8:1-3.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e56ab7366e" data-kw="">
<blockquote><p>Thirdly, the practice of wisdom consists, first, in avoiding extremities, vv. 16-17. Secondly, in keeping the mean, v. 18. The extremities are excess or defect. The excess is an error on the right hand, when a man by pride abuses his wisdom, in stretching it beyond the limits and bounds of human capacity, either in defining thereby what is just, what unjust, or what is truth, what error. ‘Be not righteous overmuch.’ A man cannot be too righteous in respect of obedience to the Commandments, yet if he be so much addicted to one or some, as that he despises the rest, he bewrays hypocrisy and folly, and may well be said to be too just. For a man is not to cull out what he thinks good, thereby to justify himself, and to condemn others…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-granger.html">Thomas Granger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Familiar Exposition, or Commentary, on Ecclesiastes, wherein the World’s Vanity &amp; the True Felicity are Plainly Deciphered</cite>, (1621), ch. 7, p. 182</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/spiritual-abuse-and-cults.html">Spiritual Abuse and Cults</a></span></div>

<blockquote><p>III. And the pretense of holiness, or a blind practical zeal, and superstitious religion, both in hypocrites and many honest, ignorant people, has not a little hand in the distractions of Christ’s Church. It was the appearance of more spirituality and strictness which drew Tertullian to the Montanists, and which promoted a great part of the heresies which have torn the Churches. This bore up the cause of the Priscillianists, and of those that Bernard and Cluniacensis so much inveigh against (I suppose Manichees with some better persons mixed). This kept up the Donatists; but above all the Novatians long in great reputation: This was the strength of the Anabaptists in Germany and the Low Countries, as their adversaries confess, says G. Wicelius, Method of Concord, ch. 12, p. 42: Retinctores hac una parte duntaxat sapiunt, tenentes doctrinam Ecclesiae Catholicae [The Re-dyers are wise in this one respect only, in that they hold to the doctrine of the catholic Church], speaking of the necessity of a holy life: This is the strength of the Quakers among us now, and of almost all the separating and censorious sects: And were not so excellent a thing as godliness the motive, abundance of good people durst never have done the great evils which we have seen done in this age, to the great shame of our profession and the sad calamities of Church and State. (And if I myself have formerly in my unexperienced youth, promoted any dividing or unwarrantable ways, it was upon this and the former mistake; which I beg daily of God to discover to me to the full and beg the pardon of the miscarriages which I know and which yet I know not of.) … And if you consider these things following, you will not wonder that mistaken godliness should cause divisions: … 5. He that mistakingly thinks anything is good or bad, duty or sin, which is not so, will be zealous in pursuit of his mistake, if he be serious for God: A good principle will hasten him on in a wrong way, whatever it cost him. 6. Ignorance and timerousness cause superstition, which is a conceit that God is [thought to be] pleased by overdoing in external things, and observances and laws of their own making, and so they that make part of their own religion superstitiously (as most good people do in some things through ignorance) will censure all others as good or bad, by the measure of their own mistakes. 7. He that thus mistakingly thinks that men sin when they do not, will have a proportionable dislike of them and aversation from them: And will be ready to speak as he thinks of them and so will be guilty of calumny and calling evil good, and good evil. … 18. And the Church will always have many hypocrites, who quiet their consciences by adhering to the strictest ministers and churches, instead of a mortified, holy and heavenly heart and conversation [conduct]. 19. And lastly, persecution and hatred from others, and the due love of godly persons, tempts too many ministers to over-run their own judgments and follow the more censorious sort of persons further than they ought (at least by connivence) and to be ruled by those whom they should rule. And thus divisions are occasioned even by piety itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, ... (London: White, 1675), Preface, n.p.</span></figcaption>

<blockquote><p>…it may with more propriety be considered as a general caution and direction to moderate our zeal with prudence, lest it bring upon us unnecessary hazard, Mt. 10:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ecclesiastes, Revelation, and Daniel</cite>, (London: Mathews, 1811), on Eccl. 7:16, p. 231</span></figcaption>

<blockquote><p>That which in sobriety is righteousness often carries its name beyond the true boundary. It includes — what the heavenly Martyn dreaded in himself — ‘ talking much, and appearing to be somebody in religion.’ Details may be easily multiplied. Religion is made to consist mainly in externals. Self-conceited professors insist upon their own shibboleth, without regard to the different judgments of their brethren. Christian duties are pressed beyond their due proportion, interfering with immediate obligations, and making sins, where God has not made them. Scrupulosity in matters indifferent takes the place of the free obedience of the Gospel. In the exercise also of Christian graces there may be danger of extremes. Boldness may verge to rashness, benevolence into indiscriminate waste, candor into weakness. In all these and many other details the Scriptural line seems to be passed, and the warning is justly applied — ‘Be not righteous over-much.’ Even ‘in well-doing there may be over-doing,’ and this over-doing may inadvertently progress towards undoing. lndeed much of this is not religion, but superstition, which ‘is not the excess of godliness’ (as Abp. Whately remarks) ‘but the misdirection of it — the exhausting of it in the vanity of man’s devising.’ It is important that our religion should be reasonable, consistent, uniform — not a matter of opinion, but of the heart. Great indeed is our need, and constant should be our prayer — “let me have understanding in the way of godliness.” (Ps. 101:2) But we are warned against another extreme. Neither make thyself overmuch wise — a wholesome practical rule! Avoid all affectation or high pretensions to superior wisdom. Guard against that opinionative confidence, which seems to lay down the law, and critically finds fault with every judgment differing from our own. The apostle gives this warning with peculiar emphasis and solemnity — ‘This I say, through the grace given unto me, to every man that is among you, not to think of himself more highly than he ought to think, but to think soberly, according as God has dealt to every man the measure of faith.’ The more humble thou art, the more wary and circumspect thou wilt be; and the more wary the more safe.’</p></blockquote>

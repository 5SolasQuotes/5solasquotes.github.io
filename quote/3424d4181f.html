<blockquote><p>Learned politicians, as Bartholomeus Romulus, (Defens. part 1, n. 153, and Joannes de Anania (in c. fin. de his qui fil. occid.) teach… nor is he more to accuse his son, than to accuse himself, because the father loves the son better than himself,” (D. Listi quidem. Sect. Fin. quod, met. caus, et D. L. fin. c. de cura furiosi) and certainly a father had rather die in his own person, as choose to die in his son’s, in whom he affects a sort of immortality, in specie, quando non potest in individuo [in kind when not able in the individual]; but a king does not love his subjects with a natural or fatherly love thus; and if the affections differ, the power which seconds the affection, for the conservation either of being, or well-being, must also differ proportionally.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 63</span></figcaption>

</figure><figure class="quote" id="q-692c5a2f69" data-kw="">
<blockquote><p>Of three kinds of liberty, and how servitude is agreeable to the Law of Nature. But here it will further be demanded, whether servitude be agreeable to the Law of nature, and how it comes to pass, that the Lord suffered the Israelites being a free people, to be servants one unto another. For the deciding of this doubt, there is a threefold kind of liberty to be considered, a natural liberty, civil, and spiritual.

1. The natural liberty I call that, wherein Adam was created, being subdued to no bondage, neither spiritual of sin, nor corporal in any outward subjection to any creature: but as he had a freedom of will, and was made Lord of his affections within, that he needed not to have sinned, unless he would himself: so he had the dominion of the creatures given unto him. This original liberty of nature considered, servitude and bondage was brought in as a punishment of sin, and so is not simply, and of itself agreeable to the Law of nature.

2. But now since Adam’s fall, there is another kind of civil liberty, and civil servitude opposite unto it. Civil liberty is defined to be a natural faculty, for every man to do as himself likes. . . unless one be hindered by force or in right; for that is no true liberty for a man against right, to do what him likes . . . Now this servitude simply accords not with nature, as the Apostle says, If yet thou mayest be free, use it rather, 1 Cor. 7.21. showing that every one by nature desires liberty and freedom. But after a sort this servitude is agreeable to nature, not simply, or of itself, but as other punishments are said to be natural, as tending to the maintenance of society among men which is properly natural. And if it be objected, why since all men are fallen in Adam, and so brought into subjection, why all likewise become not servants: the answer is, that two things must be considered in this our corrupt state: the one is the Law of corruption, brought in by sin, the other the goodness of God: that although all men are subject by sin to the same bondage and corruption, yet the goodness of God qualifies that slavish condition of nature, as that some do enjoy an outward liberty and freedom: like as in the inward faculties of the soul, the Lord gives unto some more light of understanding, dexterity of wit, profoundness of judgement, and other natural gifts, than unto others.

3. The spiritual liberty is wrought in us by grace in Christ, which is from the subjection of sin, and malediction of the Law; that our conscience is no more terrified with slavish fear, but we are at peace with God: and beside, by this spiritual liberty, the faithful have restored unto them the dominion over all creatures: that though not in external possession, yet in a spiritual right, all things are theirs, whether the world, life, death, things present or things to come, 1 Cor. 3.22. and all things work to the best, to those that love God, Rom. 8.28. So these may very well stand together, external servitude, and spiritual freedom: it is possible for one to bee a freeman to God, and yet a servant in the world, and another to be a bondman to sin, and yet free in the world: for there are divers objects of these two kinds of liberty and bondage; the outward freedom respects this life and state, the free use of riches, and pleasures of this life: the spiritual and internal freedom hath set before it the salvation of the soul, the favor of God, and life eternal. Christian religion then overthrows not the diversity of degrees among men: But as Christ, though he were by his spiritual right, free from all taxes and impositions, yet lest he should offend, payed poll money, Matt. 17. so Christians, though they are made free by faith in the Son, yet for the maintenance of peace and love, and avoiding of offence, in disturbing the temporal State, they are bound as well as others, to be subject unto the powers of this world[.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Genesin &amp; Exodum: that is, A Sixfold Commentary</cite>, … (London, 1633), on Ex. 21, Question 10</span></figcaption>

<blockquote><p>Now that the prophet was ordered to offer them wine, and that they refused, a question here arises: Was their continency in this respect laudable? They seemed thus to prefer Jonadab [their forefather] to God, for they knew that Jeremiah, who offered them wine, was sent by God. But the Rechabites, no doubt, modestly excused themselves, when they said that it was not right for them to drink wine, because they had been forbidden by their father. It was not then their purpose to give more honor to their father than to God or to his prophet, but they simply answered for the sake of excusing themselves, that they had abstained from wine for three hundred years, that is, that the whole family had done so. This, then, is the solution of the question. But what the Papists do in bringing against us the Rechabites, first to support their tyrannical laws, and secondly, in order to torment miserable consciences at their pleasure, is frivolous in the extreme. As I have already said, the advice of Jonadab is not commended, as though he had rightly forbidden his sons to drink wine; but only his sons are spoken of as having reverently and humbly obeyed the command of their dead father. Then this passage gives no countenance to the Papists, as though the object of it was to bind the consciences of the faithful to their laws; for what is here spoken of is that the Rechabites proved by their obedience how base and wicked was the obduracy of the people, as they showed less reverence and honor to God than these did to a man that was dead. But the Papists, however, dwell much on another point, — that whatever has been handed down from the fathers ought to be observed; and thus they reason, “The authority of the whole Church is greater than that of a private man; now the Rechabites are commended for having followed the command of a private individual, much more then ought we to obey the laws of the Church.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Now that the prophet was ordered to offer them wine, and that they refused, a question here arises: Was their continency in this respect laudable? They seemed thus to prefer Jonadab [their forefather] to God, for they knew that Jeremiah, who offered them wine, was sent by God. But the Rechabites, no doubt, modestly excused themselves, when they said that it was not right for them to drink wine, because they had been forbidden by their father. It was not then their purpose to give more honor to their father than to God or to his prophet, but they simply answered for the sake of excusing themselves, that they had abstained from wine for three hundred years, that is, that the whole family had done so. This, then, is the solution of the question. But what the Papists do in bringing against us the Rechabites, first to support their tyrannical laws, and secondly, in order to torment miserable consciences at their pleasure, is frivolous in the extreme. As I have already said, the advice of Jonadab is not commended, as though he had rightly forbidden his sons to drink wine; but only his sons are spoken of as having reverently and humbly obeyed the command of their dead father. Then this passage gives no countenance to the Papists, as though the object of it was to bind the consciences of the faithful to their laws; for what is here spoken of is that the Rechabites proved by their obedience how base and wicked was the obduracy of the people, as they showed less reverence and honor to God than these did to a man that was dead. But the Papists, however, dwell much on another point, — that whatever has been handed down from the fathers ought to be observed; and thus they reason, “The authority of the whole Church is greater than that of a private man; now the Rechabites are commended for having followed the command of a private individual, much more then ought we to obey the laws of the Church.”

— John Calvin, Commentary on Jer. 35, v. 7, on the Rechabites">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+that+the+prophet+was+ordered+to+offer+them+wine%2C+and+that+they+refused%2C+a+question+here+arises%3A+Was+their+continency+in+this+respect+laudable%3F+They+seemed+thus+to+prefer+Jonadab+%5Btheir+forefather%5D+to+God%2C+for+they+knew+that+Jeremiah%2C+who+offered+them+wine%2C+was+sent+by+God.+But+the+Rechabites%2C+no+doubt%2C+modestly+excused+themselves%2C+when+they+said+that+it+was+not+right+for+them+to+drink+wine%2C+because+they+had+been+forbidden+by+their+father.+It+was+not+then+their+purpose+to+give+more+honor+to+their+father+than+to+God+or+to+his+prophet%2C+but+they+simply+answered+for+the+sake+of+excusing+themselves%2C+that+they+had+abstained+from+wine+for+three+hundred+years%2C+that+is%2C+that+the+whole+family+had+done+so.+This%2C+then%2C+is+the+solution+of+the+question.+But+what+the+Papists+do+in+bringing+against+us+the+Rechabites%2C+first+to+support+their+tyrannical+laws%2C+and+secondly%2C+in+order+to+torment+miserable+consciences+at+their+pleasure%2C+is+frivolous+in+the+extreme.+As+I+have+already+said%2C+the+advice+of+Jonadab+is+not+commended%2C+as+though+he+had+rightly+forbidden+his+sons+to+drink+wine%3B+but+only+his+sons+are+spoken+of+as+having+reverently+and+humbly+obeyed+the+command+of+their+dead+father.+Then+this+passage+gives+no+countenance+to+the+Papists%2C+as+though+the+object+of+it+was+to+bind+the+consciences+of+the+faithful+to+their+laws%3B+for+what+is+here+spoken+of+is+that+the+Rechabites+proved+by+their+obedience+how+base+and+wicked+was+the+obduracy+of+the+people%2C+as+they+showed+less+reverence+and+honor+to+God+than+these+did+to+a+man+that+was+dead.+But+the+Papists%2C+however%2C+dwell+much+on+another+point%2C+%E2%80%94+that+whatever+has+been+handed+down+from+the+fathers+ought+to+be+observed%3B+and+thus+they+reason%2C+%E2%80%9CThe+authority+of+the+whole+Church+is+greater+than+that+of+a+private+man%3B+now+the+Rechabites+are+commended+for+having+followed+the+command+of+a+private+individual%2C+much+more+then+ought+we+to+obey+the+laws+of+the+Church.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+Jer.+35%2C+v.+7%2C+on+the+Rechabites&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F31d5d00968.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/31d5d00968.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/alcohol#:~:text=Now%20that%20the%20prophet%20was%20ordered,obey%20the%20laws%20of%20the%20Church&amp;text=Now%20that%20the%20prophet%20was%20ordered%20to%20offer&amp;text=we%20to%20obey%20the%20laws%20of%20the%20Church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

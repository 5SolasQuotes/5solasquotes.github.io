<main class="wrap"><figure class="quote" id="q-c1d6fb7e15" data-kw="">
<blockquote><p>Hence it follows, that none does, or can love like Christ: His love to man is matchless. The freeness, strength, antiquity, and immutability of it, puts a luster on it beyond all examples. Surely it was a strong love indeed, that made him lay aside his glory, to be found in fashion as a man, to become anything, though never so much below himself, for our salvation. … His love, like himself, is wonderful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fountain of Life</cite>, sermon 18, “The Necessity of Christ’s Humiliation … by Incarnation”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/love.html">Love</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-978f8c9d05" data-kw="">
<blockquote><p>We are knit to him both by consanguinity and by affinity. The nearest affinity is marriage, and the nearest consanguinity is sister. So that there are all bonds to knit us to Christ. Whatsoever is strong in any bond, he knits us to him by it. Is there any love in an husband, a brother, a mother, a friend, in an head to the members? in anything in the world? Is there any love scattered in any relation, gather it all into one, and all that love, and a thousand times more than that, is in Christ in a more eminent manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bowels Opened</cite>, Sermon VI (Song 5:2, “My sister”)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/union-and-communion.html">Union and Communion</a> › <a href="../topics/union-with-christ/union-and-communion/communion-with-christ.html">Communion with Christ</a></span></div>

</figure><figure class="quote" id="q-bf6a5dfa54" data-kw="">
<blockquote><p>I have seen hot love, soon cold; and love that has continued to act, yet act towards the end, as the man that by running, and has run himself off his legs, pants, and can hardly run any longer: but I never saw love like the love of Christ, who as a giant, and bridegroom coming out of his chamber, and as a strong man, rejoiceth to run his race (Psa 19:5). Loving higher and higher, stronger and stronger, I mean as to the lettings out of love, for he reserveth the best wine even till the last (John 2:10).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Knowledge of Christ’s Love</cite></span></figcaption>

<blockquote><p>[The Socinian Biddle asks] Q. Doth the Scripture account Christ to be the Son of God because he was eternally begotten out of the divine essence, or for other reasons agreeing to him only as a man? Rehearse the passages to this purpose. A. Luke 1:30, 32, 34, 35; John. 10:36; Acts 13:32, 33; Rev. 1:5; Col. 1:18; Heb. 1:4, 5, 5:5; Rom. 8:29. [Owen Replies]…

1. Distinction of persons (it being an infinite substance) doth no way prove difference of essence between the Father and the Son. Where Christ, as mediator, is said to be another from the Father or God, spoken personally of the Father, it argues not in the least that he is not partaker of the same nature with him. That in one essence there can be but one person may be true where the substance is finite and limited, but hath no place in that which is infinite. …

2. Distinction and inequality in respect office in Christ doth not in the least take away equality and sameness with the Father in respect of nature and essence. A son of the same nature with his father, and therein equal to him, may in office be his inferior, his subject. … Q. 9. We are come to the head of this discourse, and of Mr B.’s design in this chapter, and, indeed, of the greatest design that he drives in religion, namely, the denial of the eternal deity of the Son of God; which not only in this place directly, but in sundry others covertly, he doth invade and oppose. His question is, “Doth the Scripture account Christ to be the Son of God because he was eternally begotten out of the divine essence, or for other reasons agreeing to him only as a man? Rehearse the passages to this purpose.” His answer is from Luke 1:31–35; John 10:36; Acts 13:32, 33; Rev. 1:5; Col. 1:18; Heb 1:4, 5, 5:5; Rom. 8:29; most of which places are expressly contrary to him in his design, as the progress of our discourse will discover. This, I say, being the head of the difference between us in this chapter, after I have rectified one mistake in Mr B.’s question, I shall state the whole matter so as to obviate farther labour and trouble about sundry other ensuing queries. For Mr B.’s question, then, we say not that the Son is begotten eternally out of the divine essence, but in it, not by an eternal act of the Divine Being, but of the person of the Father; which being premised, I shall proceed. [Owen quotes Socinians denying the eternal generation of the Son] … I insist somewhat the more on these things, that men may judge the better whether in all probability Mr B., in his “impartial search into the Scripture,” did not use the help of some of them that went before him in the discovery of the same things which he boasts himself to have found out. And this is the first reason which our catechist hath taken from his masters to communicate to his scholars [students] why Jesus Christ is called the “Son of God.” This he and they insist on exclusively to his eternal sonship, or being the Son of God in respect of his eternal generation of the substance of his Father. And these are some of those monstrous figments which, under pretence of bare adherence to the Scripture, our catechist would obtrude upon us: First, Christ is the Son of God; then, growing like God in divine qualities, he is made a God; and so becomes the Son of God. And this, if the man may be believed, is the pure doctrine of the Scripture! And if Christ be a God because he is like God, by the same reason we are all gods in Mr B[iddle]’s conceit, being all made in the image and likeness of God; which, says he, by sin we have not lost. … 1. He who is ἴδιος υἱός, the “proper son” of any, is begotten of the substance of his father. Christ is the proper Son of God, and God he called often ἴδιον Πατέρα, his “proper Father.” He is properly a father who begets another of his substance; and he is properly a son who is so begotten. … he who is properly a son is distinguished from him who is metaphorically so only; for any thing whatever is metaphorically said to be what it is said to be by a translation and likeness to that which is true. Now, if Christ be not begotten of the essence of his Father, he is only a metaphorical Son of God by way of allusion, and cannot be called the proper Son of God, being only one who hath but a similitude to a proper Son; so that it is a plain contradiction that Christ should be the proper Son of God, and yet not be begotten of his Father’s essence. … 4. He who is the Son of God, begotten of his Father by an eternal communication of his divine essence, he is the Son begotten of the essence of the Father; for these terms are the same, and of the same importance. … And this may suffice (without insisting upon what more might be added) for the demonstration of the first assertion, That Christ’s filiation ariseth from his eternal generation, or he is the Son of God upon the account of his being begotten of the essence of his Father from eternity. … 4. That which only manifests the filiation of Christ is not the cause of it. The cause of a thing is that which gives it its being. The manifestation of it is only that which declares it to be so. … To the farther confirmation of this assertion two things are to be annexed:—First, The eversion of that fancy of Episcopius before mentioned, and the rest of the Socinianizing Arminians, that Christ is called the “Son of God,” both on the account of his eternal sonship and also of those other particulars mentioned from him above. Secondly, To consider the texts of Scripture produced by Mr [Biddle] for the confirmation of his insinuation, that Christ is not called the “Son of God” because of his eternal generation of the essence of his Father. … 3. An invincible argument for the sonship of Christ, to be placed only upon the account of his eternal generation, ariseth from this very place that was produced to oppose it! He who is the Son of God because he is “one with the Father,” and God equal to him, is the Son of God upon the account of his eternal relation to the Father: but that such was the condition of Jesus Christ, himself here bears witness to the Jews, although they are ready to stone him for it; and of his not blaspheming in this assertion he convinces his adversaries by an argument a minori, [from the lesser or the minor premise; John 10] verses 34–36.</p></blockquote>

<blockquote><p>Is God most simple and free from all composition? We affirm against Socinus and Vorstius I. The Socinians agitate this controversy with us since they deny that simplicity can be attributed to God according to the Scriptures and think it should be expunged from the number of the divine attributes for no other purpose than to weaken more easily the mystery of the Trinity by establishing the composition of the divine essence (The Racovian Catechism 3.1 [1818], p. 33). Vorstius retained this error (with various others also) and introduced it into his Tractatus theologicus de Deo (1610) and in the notes to “Disputatione III: De Natura Dei” (cf. Tractatus theologicus de Deo [1610], pp. 19–28). With these the Remonstrants also agree. In their Apology, they deny that the simplicity of God is necessary to be believed or that anything occurs in Scripture relative to it, but that the whole doctrine is metaphysical whether you consider the word or the thing (“Apologia pro confessione sive declaratione … Remonstrantes,” 2 in Episcopius, Operum theologicorum [1665], Pt. II, p. 129). But the orthodox have constantly taught that the essence of God is perfectly simple and free from all composition.

II. Simple is used in two senses: either absolutely and simply; or relatively and comparatively. Absolutely is such as in every kind of being excludes composition; comparatively is such as excludes it only with respect to some. Heaven and the elements are called simple bodies with respect to mixed, but do not exclude composition from their matter and form and quantitative parts. Angels and souls are simple with respect to bodies, but not absolutely such because they always involve a composition. Here we speak of absolute and not of comparative simplicity.

III. The simplicity of God considered not morally, but physically, is his incommunicable attribute by which the divine nature is conceived by us not only as free from all composition and division, but also as incapable of composition and divisibility. Proof that God is perfectly simple.

IV. This is proved to be a property of God: (1) from his independence, because composition is of the formal reason of a being originated and dependent (since nothing can be composed by itself, but whatever is composed must necessarily be composed by another; now God is the first and independent being, recognizing no other prior to himself); (2) from his unity, because he who is absolutely one, is also absolutely simple and therefore can neither be divided nor composed; (3) from his perfection, because composition implies imperfection inasmuch as it supposes passive power, dependency and mutability; (4) from his activity, because God is a most pure act having no passive admixture and therefore rejecting all composition (because in God there is nothing which needs to be made perfect or can receive perfection from any other, but he is whatever can be and cannot be other than what he is). Whence he is usually described not only by concrete but also by abstract names—life, light, truth, etc.

V. From the removal of all species of composition (such as physical—of matter and form, since he is incorporeal); or of quantitative parts (which do not apply to God); or of subject and accident (because no accident can make the most perfect still more perfect); logical (of kind and difference because God is above every genus, nor is his a common nature capable of being restricted by difference); metaphysical act and power (since he is a pure act and incapable of change properly so called, to whom nothing new can happen or be received by him); of essence and existence (as in created things in which the nature of existence differs from that of essence, since their essence can be conceived without existence; nor does existence enter into their definition because they can be and not be, and existence with respect to them is something contingent, not necessary. For in God essence cannot be conceived without existence, and it is repugnant to conceive of God as not existing; hence philosophers call him a being by essence (i.e., which exists in virtue of its own essence) and of the nature of whose essence it is that he always exists. For this reason, God calls himself Jehovah (viz., he who is, “I am that I am” [‘hyh ‘shr ‘hyh]) to signify that being belongs to him in a far different manner than to all created things, not participatively and contingently, but necessarily, properly and independently. Finally, his simplicity is proved from nature and subsistence; for persons and essence are not related as real component extremes from which a tertium quid may arise (as in human things from the nature of man and the subsistence of Peter arises that person whom we call Peter); otherwise not a Trinity but a certain quaternity would be conceived of in God; nor do modes (such as subsistences) compose, they only modify.

VI. But as God rejects all composition in himself, so his simplicity hinders him also from being compounded with any created things so as to hold the relation of some part either of matter or form (against the opinion of the Platonists who supposed God to be the soul of the world; and of the Manicheans who held that all creatures were propagated from the essence of God). This is so both because he is altogether diverse from creatures, and because he is immutable and incorruptible (he cannot coalesce in one with any mutable and corruptible created thing). For all composition infers mutation by which a thing becomes part of a whole, which it was not before. Sources of explanation.

VII. If all things are said to be of God (Rom. 11:36), this must be understood not hylikōs (“belonging to matter”) and materially, but dēmiourgikōs (“formatively”) and efficiently. We are called the race and offspring of God (Acts 17:28), not by a participation of the same essence, but by similarity of likeness; efficiently not essentially, as also he is called the “Father of spirits” (Heb. 12:9) with reference to creation, not to composition. The Son of God is God-man (theanthrōpos) not by composition properly so-called, but by hypostatical union (by which the Word [logos] indeed assumed human nature in one hypostasis, but was not compounded with it as part with part; but stood to it in the relation of perfecter and sustainer to make perfect and sustain an essential adjunct, so that the human nature indeed did thence receive perfection, but nothing was added by it to the divine nature).

VIII. Composition is in that in which there is more than one real entity, but not where there is only more than one mode because modes only modify and characterize, but do not compose the essence. But in divine things there are one essence and three hypostases (which are modes distinguishing indeed the persons from each other, but not composing because they are not real entities concurring to the composition of some fourth thing, since they have one common essence; but they are only modifications according to which the essence is conceived to subsist in three persons).

IX. Simplicity and triplicity are so mutually opposed that they cannot subsist at the same time (but not simplicity and Trinity because they are said in different respects): simplicity in respect to essence, but Trinity in respect to persons. In this sense, nothing hinders God (who is one in essence) from being three persons.

X. The decrees of God can be regarded in two ways: either subjectively (if it is right so to speak, i.e., on the part of the internal act in itself and absolutely); or objectively, extrinsically and relatively with respect to creatures (respectively). In the former manner, they do not differ from God himself and are no other than God himself decreeing. But in the latter, they do differ because they may be conceived as many and various (not as to the thing, since God has decreed all things by one single and most simple act, but as to the objects), even as the knowledge of God is conversant with innumerable objects without detriment to his unity.

XI. The decrees of God are free, not absolutely and as to the principle, but relatively and objectively and as to the end. For there could be no external object necessarily terminating to the divine will, for God stands in need of nothing out of himself. Therefore they could be and not be. But this does not hinder them from being called necessary as to the principle and internal act because the act of intelligence and will could not be absent from God at all. He could not be God without intelligence and will. They are necessary, therefore, as to internal existence, but free as to external relation (schesin) and habit. Nor can the will of God be said to cease absolutely, but with respect to the external object on which it is terminated.

XII. The decrees of God are immanent acts of the divine will, but not properly its effect. God ought not to be called so much the cause as the principle of them. Hence there is no need that they should be posterior to God except in our order and in the manner of conceiving them.

XIII. Although the essence of God (considered simply in itself) is absolute and implies no relation to creatures, yet this does not hinder it (when considered with relative opposition to creatures and as determining itself in the manner of vital principle to the production of this or that thing out of itself) from having a certain reference (schesin) and relation to creatures. Nor can that manifold relation make composition in God, more than the relation which his omniscience and omnipotence bear to things ad extra, constituted a real difference between God and his omnipotence and omniscience.

XIV. Whatever in God is essential and absolute is God himself. Thus the absolute attributes may be identified really with the divine essence and are in it essentially, not accidentally. If they are predicated of God in the concrete, their subject is only of denomination, not of inhesion (inhaesionis). But whatever is personal and modal in God is indeed God himself in the concrete, though not in the abstract.

XV. The relative attributes do not argue composition, but distinction. The formal nature of relations is not to be in, but to be to. Nor do they superadd a new perfection to the essence, but only imply a habitude of the essence to other things. Paternity and dominion do not render him another being, but in a different manner dispose the possessor without superinducing a change in him. XVI. The personal property of the Son does not make his essence different from that of the Father, nor of a simple essence make a composed, for nothing real is added to the essence, rather it only makes the Son distinct from the Father. Distinction is not composition. XVII. The fathers often insist on this simplicity of God. “The nature of God is simple and immutable and undisturbed, nor is he himself one thing and what he is and has another thing” (Augustine, 1. 5, de Trinit. c. 1+). And after teaching that no creature is truly and perfectly simple, he adds: “Now although God may be called manifold, yet he is truly perfectly simple, for he is called great, wise, happy, and true, and whatever with propriety may be said of him. But his greatness is the same as his wisdom, for he is not great in mass, but in virtue, and his goodness is the same as his wisdom and greatness and truth” (The Trinity 6.6, 7* [FC 45:208–9; PL 42.929]). So too Athanasius: “God is not composed who composed all things that they might be; nor is he such as those things are which were made by his word; since he is a simple substance in whom there is no quality nor any shadow of change, as James testifies” (To the Bishops of Africa 8 [NPNF2, 4:493; PG 26.1043]).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Is God most simple and free from all composition? We affirm against Socinus and Vorstius I. The Socinians agitate this controversy with us since they deny that simplicity can be attributed to God according to the Scriptures and think it should be expunged from the number of the divine attributes for no other purpose than to weaken more easily the mystery of the Trinity by establishing the composition of the divine essence (The Racovian Catechism 3.1 [1818], p. 33). Vorstius retained this error (with various others also) and introduced it into his Tractatus theologicus de Deo (1610) and in the notes to “Disputatione III: De Natura Dei” (cf. Tractatus theologicus de Deo [1610], pp. 19–28). With these the Remonstrants also agree. In their Apology, they deny that the simplicity of God is necessary to be believed or that anything occurs in Scripture relative to it, but that the whole doctrine is metaphysical whether you consider the word or the thing (“Apologia pro confessione sive declaratione … Remonstrantes,” 2 in Episcopius, Operum theologicorum [1665], Pt. II, p. 129). But the orthodox have constantly taught that the essence of God is perfectly simple and free from all composition.

II. Simple is used in two senses: either absolutely and simply; or relatively and comparatively. Absolutely is such as in every kind of being excludes composition; comparatively is such as excludes it only with respect to some. Heaven and the elements are called simple bodies with respect to mixed, but do not exclude composition from their matter and form and quantitative parts. Angels and souls are simple with respect to bodies, but not absolutely such because they always involve a composition. Here we speak of absolute and not of comparative simplicity.

III. The simplicity of God considered not morally, but physically, is his incommunicable attribute by which the divine nature is conceived by us not only as free from all composition and division, but also as incapable of composition and divisibility. Proof that God is perfectly simple.

IV. This is proved to be a property of God: (1) from his independence, because composition is of the formal reason of a being originated and dependent (since nothing can be composed by itself, but whatever is composed must necessarily be composed by another; now God is the first and independent being, recognizing no other prior to himself); (2) from his unity, because he who is absolutely one, is also absolutely simple and therefore can neither be divided nor composed; (3) from his perfection, because composition implies imperfection inasmuch as it supposes passive power, dependency and mutability; (4) from his activity, because God is a most pure act having no passive admixture and therefore rejecting all composition (because in God there is nothing which needs to be made perfect or can receive perfection from any other, but he is whatever can be and cannot be other than what he is). Whence he is usually described not only by concrete but also by abstract names—life, light, truth, etc.

VIII. Composition is in that in which there is more than one real entity, but not where there is only more than one mode because modes only modify and characterize, but do not compose the essence. But in divine things there are one essence and three hypostases (which are modes distinguishing indeed the persons from each other, but not composing because they are not real entities concurring to the composition of some fourth thing, since they have one common essence; but they are only modifications according to which the essence is conceived to subsist in three persons).

IX. Simplicity and triplicity are so mutually opposed that they cannot subsist at the same time (but not simplicity and Trinity because they are said in different respects): simplicity in respect to essence, but Trinity in respect to persons. In this sense, nothing hinders God (who is one in essence) from being three persons.

X. The decrees of God can be regarded in two ways: either subjectively (if it is right so to speak, i.e., on the part of the internal act in itself and absolutely); or objectively, extrinsically and relatively with respect to creatures (respectively). In the former manner, they do not differ from God himself and are no other than God himself decreeing. But in the latter, they do differ because they may be conceived as many and various (not as to the thing, since God has decreed all things by one single and most simple act, but as to the objects), even as the knowledge of God is conversant with innumerable objects without detriment to his unity.

XI. The decrees of God are free, not absolutely and as to the principle, but relatively and objectively and as to the end. For there could be no external object necessarily terminating to the divine will, for God stands in need of nothing out of himself. Therefore they could be and not be. But this does not hinder them from being called necessary as to the principle and internal act because the act of intelligence and will could not be absent from God at all. He could not be God without intelligence and will. They are necessary, therefore, as to internal existence, but free as to external relation (schesin) and habit. Nor can the will of God be said to cease absolutely, but with respect to the external object on which it is terminated.

XII. The decrees of God are immanent acts of the divine will, but not properly its effect. God ought not to be called so much the cause as the principle of them. Hence there is no need that they should be posterior to God except in our order and in the manner of conceiving them.

%2C+but+not+absolutely+such+because+they+always+involve+a+composition.+Here+we+speak+of+absolute+and+not+of+comparative+simplicity.+III.+The+simplicity+of+God+considered+not+morally%2C+but+physically%2C+is+his+incommunicable+attribute+by+which+the+divine+nature+is+conceived+by+us+not+only+as+free+from+all+composition+and+division%2C+but+also+as+incapable+of+composition+and+divisibility.+Proof+that+God+is+perfectly+simple.+IV.+This+is+proved+to+be+a+property+of+God%3A+%281%29+from+his+independence%2C+because+composition+is+of+the+formal+reason+of+a+being+originated+and+dependent+%28since+nothing+can+be+composed+by+itself%2C+but+whatever+is+composed+must+necessarily+be+composed+by+another%3B+now+God+is+the+first+and+independent+being%2C+recognizing+no+other+prior+to+himself%29%3B+%282%29+from+his+unity%2C+because+he+who+is+absolutely+one%2C+is+also+absolutely+simple+and+therefore+can+neither+be+divided+nor+composed%3B+%283%29+from+his+perfection%2C+because+composition+implies+imperfection+inasmuch+as+it+supposes+passive+power%2C+dependency+and+mutability%3B+%284%29+from+his+activity%2C+because+God+is+a+most+pure+act+having+no+passive+admixture+and+therefore+rejecting+all+composition+%28because+in+God+there+is+nothing+which+needs+to+be+made+perfect+or+can+receive+perfection+from+any+other%2C+but+he+is+whatever+can+be+and+cannot+be+other+than+what+he+is%29.+Whence+he+is+usually+described+not+only+by+concrete+but+also+by+abstract+names%E2%80%94life%2C+light%2C+truth%2C+etc.+V.+From+the+removal+of+all+species+of+composition+%28such+as+physical%E2%80%94of+matter+and+form%2C+since+he+is+incorporeal%29%3B+or+of+quantitative+parts+%28which+do+not+apply+to+God%29%3B+or+of+subject+and+accident+%28because+no+accident+can+make+the+most+perfect+still+more+perfect%29%3B+logical+%28of+kind+and+difference+because+God+is+above+every+genus%2C+nor+is+his+a+common+nature+capable+of+being+restricted+by+difference%29%3B+metaphysical+act+and+power+%28since+he+is+a+pure+act+and+incapable+of+change+properly+so+called%2C+to+whom+nothing+new+can+happen+or+be+received+by+him%29%3B+of+essence+and+existence+%28as+in+created+things+in+which+the+nature+of+existence+differs+from+that+of+essence%2C+since+their+essence+can+be+conceived+without+existence%3B+nor+does+existence+enter+into+their+definition+because+they+can+be+and+not+be%2C+and+existence+with+respect+to+them+is+something+contingent%2C+not+necessary.+For+in+God+essence+cannot+be+conceived+without+existence%2C+and+it+is+repugnant+to+conceive+of+God+as+not+existing%3B+hence+philosophers+call+him+a+being+by+essence+%28i.e.%2C+which+exists+in+virtue+of+its+own+essence%29+and+of+the+nature+of+whose+essence+it+is+that+he+always+exists.+For+this+reason%2C+God+calls+himself+Jehovah+%28viz.%2C+he+who+is%2C+%E2%80%9CI+am+that+I+am%E2%80%9D+%5B%E2%80%98hyh+%E2%80%98shr+%E2%80%98hyh%5D%29+to+signify+that+being+belongs+to+him+in+a+far+different+manner+than+to+all+created+things%2C+not+participatively+and+contingently%2C+but+necessarily%2C+properly+and+independently.+Finally%2C+his+simplicity+is+proved+from+nature+and+subsistence%3B+for+persons+and+essence+are+not+related+as+real+component+extremes+from+which+a+tertium+quid+may+arise+%28as+in+human+things+from+the+nature+of+man+and+the+subsistence+of+Peter+arises+that+person+whom+we+call+Peter%29%3B+otherwise+not+a+Trinity+but+a+certain+quaternity+would+be+conceived+of+in+God%3B+nor+do+modes+%28such+as+subsistences%29+compose%2C+they+only+modify.+VI.+But+as+God+rejects+all+composition+in+himself%2C+so+his+simplicity+hinders+him+also+from+being+compounded+with+any+created+things+so+as+to+hold+the+relation+of+some+part+either+of+matter+or+form+%28against+the+opinion+of+the+Platonists+who+supposed+God+to+be+the+soul+of+the+world%3B+and+of+the+Manicheans+who+held+that+all+creatures+were+propagated+from+the+essence+of+God%29.+This+is+so+both+because+he+is+altogether+diverse+from+creatures%2C+and+because+he+is+immutable+and+incorruptible+%28he+cannot+coalesce+in+one+with+any+mutable+and+corruptible+created+thing%29.+For+all+composition+infers+mutation+by+which+a+thing+becomes+part+of+a+whole%2C+which+it+was+not+before.+Sources+of+explanation.+VII.+If+all+things+are+said+to+be+of+God+%28Rom.+11%3A36%29%2C+this+must+be+understood+not+hylik%C5%8Ds+%28%E2%80%9Cbelonging+to+matter%E2%80%9D%29+and+materially%2C+but+d%C4%93miourgik%C5%8Ds+%28%E2%80%9Cformatively%E2%80%9D%29+and+efficiently.+We+are+called+the+race+and+offspring+of+God+%28Acts+17%3A28%29%2C+not+by+a+participation+of+the+same+essence%2C+but+by+similarity+of+likeness%3B+efficiently+not+essentially%2C+as+also+he+is+called+the+%E2%80%9CFather+of+spirits%E2%80%9D+%28Heb.+12%3A9%29+with+reference+to+creation%2C+not+to+composition.+The+Son+of+God+is+God-man+%28theanthr%C5%8Dpos%29+not+by+composition+properly+so-called%2C+but+by+hypostatical+union+%28by+which+the+Word+%5Blogos%5D+indeed+assumed+human+nature+in+one+hypostasis%2C+but+was+not+compounded+with+it+as+part+with+part%3B+but+stood+to+it+in+the+relation+of+perfecter+and+sustainer+to+make+perfect+and+sustain+an+essential+adjunct%2C+so+that+the+human+nature+indeed+did+thence+receive+perfection%2C+but+nothing+was+added+by+it+to+the+divine+nature%29.+VIII.+Composition+is+in+that+in+which+there+is+more+than+one+real+entity%2C+but+not+where+there+is+only+more+than+one+mode+because+modes+only+modify+and+characterize%2C+but+do+not+compose+the+essence.+But+in+divine+things+there+are+one+essence+and+three+hypostases+%28which+are+modes+distinguishing+indeed+the+persons+from+each+other%2C+but+not+composing+because+they+are+not+real+entities+concurring+to+the+composition+of+some+fourth+thing%2C+since+they+have+one+common+essence%3B+but+they+are+only+modifications+according+to+which+the+essence+is+conceived+to+subsist+in+three+persons%29.+IX.+Simplicity+and+triplicity+are+so+mutually+opposed+that+they+cannot+subsist+at+the+same+time+%28but+not+simplicity+and+Trinity+because+they+are+said+in+different+respects%29%3A+simplicity+in+respect+to+essence%2C+but+Trinity+in+respect+to+persons.+In+this+sense%2C+nothing+hinders+God+%28who+is+one+in+essence%29+from+being+three+persons.+X.+The+decrees+of+God+can+be+regarded+in+two+ways%3A+either+subjectively+%28if+it+is+right+so+to+speak%2C+i.e.%2C+on+the+part+of+the+internal+act+in+itself+and+absolutely%29%3B+or+objectively%2C+extrinsically+and+relatively+with+respect+to+creatures+%28respectively%29.+In+the+former+manner%2C+they+do+not+differ+from+God+himself+and+are+no+other+than+God+himself+decreeing.+But+in+the+latter%2C+they+do+differ+because+they+may+be+conceived+as+many+and+various+%28not+as+to+the+thing%2C+since+God+has+decreed+all+things+by+one+single+and+most+simple+act%2C+but+as+to+the+objects%29%2C+even+as+the+knowledge+of+God+is+conversant+with+innumerable+objects+without+detriment+to+his+unity.+XI.+The+decrees+of+God+are+free%2C+not+absolutely+and+as+to+the+principle%2C+but+relatively+and+objectively+and+as+to+the+end.+For+there+could+be+no+external+object+necessarily+terminating+to+the+divine+will%2C+for+God+stands+in+need+of+nothing+out+of+himself.+Therefore+they+could+be+and+not+be.+But+this+does+not+hinder+them+from+being+called+necessary+as+to+the+principle+and+internal+act+because+the+act+of+intelligence+and+will+could+not+be+absent+from+God+at+all.+He+could+not+be+God+without+intelligence+and+will.+They+are+necessary%2C+therefore%2C+as+to+internal+existence%2C+but+free+as+to+external+relation+%28schesin%29+and+habit.+Nor+can+the+will+of+God+be+said+to+cease+absolutely%2C+but+with+respect+to+the+external+object+on+which+it+is+terminated.+XII.+The+decrees+of+God+are+immanent+acts+of+the+divine+will%2C+but+not+properly+its+effect.+God+ought+not+to+be+called+so+much+the+cause+as+the+principle+of+them.+Hence+there+is+no+need+that+they+should+be+posterior+to+God+except+in+our+order+and+in+the+manner+of+conceiving+them.+XIII.+Although+the+essence+of+God+%28considered+simply+in+itself%29+is+absolute+and+implies+no+relation+to+creatures%2C+yet+this+does+not+hinder+it+%28when+considered+with+relative+opposition+to+creatures+and+as+determining+itself+in+the+manner+of+vital+principle+to+the+production+of+this+or+that+thing+out+of+itself%29+from+having+a+certain+reference+%28schesin%29+and+relation+to+creatures.+Nor+can+that+manifold+relation+make+composition+in+God%2C+more+than+the+relation+which+his+omniscience+and+omnipotence+bear+to+things+ad+extra%2C+constituted+a+real+difference+between+God+and+his+omnipotence+and+omniscience.+XIV.+Whatever+in+God+is+essential+and+absolute+is+God+himself.+Thus+the+absolute+attributes+may+be+identified+really+with+the+divine+essence+and+are+in+it+essentially%2C+not+accidentally.+If+they+are+predicated+of+God+in+the+concrete%2C+their+subject+is+only+of+denomination%2C+not+of+inhesion+%28inhaesionis%29.+But+whatever+is+personal+and+modal+in+God+is+indeed+God+himself+in+the+concrete%2C+though+not+in+the+abstract.+XV.+The+relative+attributes+do+not+argue+composition%2C+but+distinction.+The+formal+nature+of+relations+is+not+to+be+in%2C+but+to+be+to.+Nor+do+they+superadd+a+new+perfection+to+the+essence%2C+but+only+imply+a+habitude+of+the+essence+to+other+things.+Paternity+and+dominion+do+not+render+him+another+being%2C+but+in+a+different+manner+dispose+the+possessor+without+superinducing+a+change+in+him.+XVI.+The+personal+property+of+the+Son+does+not+make+his+essence+different+from+that+of+the+Father%2C+nor+of+a+simple+essence+make+a+composed%2C+for+nothing+real+is+added+to+the+essence%2C+rather+it+only+makes+the+Son+distinct+from+the+Father.+Distinction+is+not+composition.+XVII.+The+fathers+often+insist+on+this+simplicity+of+God.+%E2%80%9CThe+nature+of+God+is+simple+and+immutable+and+undisturbed%2C+nor+is+he+himself+one+thing+and+what+he+is+and+has+another+thing%E2%80%9D+%28Augustine%2C+1.+5%2C+de+Trinit.+c.+1%2B%29.+And+after+teaching+that+no+creature+is+truly+and+perfectly+simple%2C+he+adds%3A+%E2%80%9CNow+although+God+may+be+called+manifold%2C+yet+he+is+truly+perfectly+simple%2C+for+he+is+called+great%2C+wise%2C+happy%2C+and+true%2C+and+whatever+with+propriety+may+be+said+of+him.+But+his+greatness+is+the+same+as+his+wisdom%2C+for+he+is+not+great+in+mass%2C+but+in+virtue%2C+and+his+goodness+is+the+same+as+his+wisdom+and+greatness+and+truth%E2%80%9D+%28The+Trinity+6.6%2C+7%2A+%5BFC+45%3A208%E2%80%939%3B+PL+42.929%5D%29.+So+too+Athanasius%3A+%E2%80%9CGod+is+not+composed+who+composed+all+things+that+they+might+be%3B+nor+is+he+such+as+those+things+are+which+were+made+by+his+word%3B+since+he+is+a+simple+substance+in+whom+there+is+no+quality+nor+any+shadow+of+change%2C+as+James+testifies%E2%80%9D+%28To+the+Bishops+of+Africa+8+%5BNPNF2%2C+4%3A493%3B+PG+26.1043%5D%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+trans.+George+Musgrave+Giger%2C+ed.+James+T.+Dennison+Jr.%2C+vol.+1+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%931997%29%2C+3.7+%5B191%E2%80%9394%5D.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3f61ce30ac.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3f61ce30ac.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/08/turretin-defended-divine-simplicity-against-the-socinians/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

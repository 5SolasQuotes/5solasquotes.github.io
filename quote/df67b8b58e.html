<blockquote><p>XXX. Liberation from this guilt and its exercise was never promised to all and every mortal, nor offered, nor conferred; and in paradise itself there was immediately distinguished the seed of the woman and of the serpent, partly in the first promise, partly in its manifestation in the house of Adam, in which God began the distinction observed through all ages. XXXI. The Liberator, and Depulsor partly of adhering guilt, partly of inhering corruption, is the one Christ Son of God, destined from eternity to all the elect and to them alone, promised from the fall, afterward prefigured by types partly personal, partly real, finally exhibited, and to the same partly applied, partly to be applied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>

<blockquote><p>Again, that these same men admit in God a certain antecedent will of the salvation of all, he himself also acknowledges. From which it follows that, with much greater right, it is admitted in Christ. Moreover, this antecedent will does not pertain only to this: that God, abstracting from the fall of man, is said to desire the salvation of all, insofar as they are men; but, generally, the antecedent will of God is directed toward that which is right, that which is just, that which is good in itself. Thus, because it is right for man to be converted, to do penance, not to despise the goodness of God, not to reject his graces, to approach the Sacraments—God is considered to will all these things by an antecedent will, although, when the individual circumstances are considered, he has not decreed to confer upon each individual efficacious graces by which they certainly arrive at salvation, without which they certainly fall away from salvation. Therefore God does not desire, by an antecedent will, the salvation of all men merely on this account, that he made all rational creatures for blessedness; but also because, since he diffuses very many graces, both external and internal, among the reprobate, which it is unjust for them to abuse, and since he wills that an entrance into his Church should likewise be open to them, he is considered, by an antecedent will, to will that all arrive at salvation, because he would will that they not remain obstinate in wickedness, and that they make good use of the helps offered to them; although, on the other hand, by a will of justice, when all the circumstances are considered, he judged it better to leave them to their wickedness, and not to grant efficacious aids, by which alone the depravity of the human heart is overcome. Hence it is evident that God wills, by an antecedent will, the salvation both of the demons and of reprobate men; nevertheless, in a very different way in the case of men than in that of demons. For since he now offers no helps of grace to demons, nor wills that an entrance into the Church, or the aid of the sacraments, be open to them, consequently neither does he will them to make good use of his grace, which he now grants none to them. But, on the contrary, since men are still on the way, he must be thought, by an antecedent will, to desire for them conversion and a sincere return to himself and a good use of his graces, from which he by no means bars them—none of which he provides toward demons. That antecedent will, moreover, often seems to have been in Christ, as when he wept over Jerusalem and lamented its coming calamities in these words: “Luke says, ‘He wept over it, saying, If you also had known, and indeed in this your day, the things which are for your peace! But now they are hidden from your eyes, because days will come upon you, and your enemies will surround you with a rampart,’ etc.</p></blockquote>

<blockquote><p>You will remember the multitude He has redeemed; not me alone, nor you alone, but “a multitude that no man can number,” which shall as far exceed the stars of heaven for number, as they exceed all mortal reckoning. Christ hath bought for Himself, some out of every kingdom, and nation, and tongue, under heaven; He hath redeemed from among men some of every rank, from the highest to the lowest; some of every colour—black and white; some of every standing in society, the best and the worst. For some of all sorts hath Jesus Christ given Himself a ransom that they might be redeemed unto Himself.</p></blockquote>

<blockquote><p>‘Christ died for all sufficiently, for the elect alone efficiently: that is, He indeed satisfied for all, but only the elect apply His satisfaction to themselves.’ Response: We have said above that the death of Christ is in itself sufficient for the redemption of all, yet destined only for the elect. But that He died sufficiently for all, and efficiently for the elect, can in no way be said: I. Because the division of efficiency and sufficiency implies a contradiction with the thing divided. For if He died for all, it follows that He willed by His death to expiate the sins of all, and to obtain their remission. For this the particle for (pro) requires, indicating the end, as does the very phrase. But if He willed to expiate, then certainly He also actually expiated. The reason is that whatever He ever willed to effect, He brought to effect; whether as the omnipotent God, or as the faithful servant of the Father, whom the Father always heard. If He actually expiated the sins of all individuals, therefore He died efficiently for all and each individual; which nevertheless this distinction denies. II. A distinction that removes theological principles is faulty. The distinction of sufficiency and efficiency removes theological principles. The reason is that it separates those things which God has joined in the covenant Jer. 31:33–34. For those whose Savior Christ is, He is their Savior both by merit and by efficacy together, not by one only. Therefore.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Logical &amp; Theological Exegesis of the Augsburg Confession</cite>, (Amsterdam: Janssonius, 1647), Syllabus of Controversies with Lutherans, Controversy 4, on Predestination, Question 3, 4. ‘Whether for All &amp; Every Person Christ Died’, p. 237 trans. AI</span></figcaption>

<div class="actions"><button class="copy" data-copy="“‘Christ died for all sufficiently, for the elect alone efficiently: that is, He indeed satisfied for all, but only the elect apply His satisfaction to themselves.’ Response: We have said above that the death of Christ is in itself sufficient for the redemption of all, yet destined only for the elect. But that He died sufficiently for all, and efficiently for the elect, can in no way be said: I. Because the division of efficiency and sufficiency implies a contradiction with the thing divided. For if He died for all, it follows that He willed by His death to expiate the sins of all, and to obtain their remission. For this the particle for (pro) requires, indicating the end, as does the very phrase. But if He willed to expiate, then certainly He also actually expiated. The reason is that whatever He ever willed to effect, He brought to effect; whether as the omnipotent God, or as the faithful servant of the Father, whom the Father always heard. If He actually expiated the sins of all individuals, therefore He died efficiently for all and each individual; which nevertheless this distinction denies. II. A distinction that removes theological principles is faulty. The distinction of sufficiency and efficiency removes theological principles. The reason is that it separates those things which God has joined in the covenant Jer. 31:33–34. For those whose Savior Christ is, He is their Savior both by merit and by efficacy together, not by one only. Therefore.”

— Henry Alting, Logical &amp; Theological Exegesis of the Augsburg Confession (Amsterdam: Janssonius, 1647), Syllabus of Controversies with Lutherans, Controversy 4, on Predestination, Question 3, 4. ‘Whether for All &amp; Every Person Christ Died’, p. 237 trans. AI">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98Christ+died+for+all+sufficiently%2C+for+the+elect+alone+efficiently%3A+that+is%2C+He+indeed+satisfied+for+all%2C+but+only+the+elect+apply+His+satisfaction+to+themselves.%E2%80%99+Response%3A+We+have+said+above+that+the+death+of+Christ+is+in+itself+sufficient+for+the+redemption+of+all%2C+yet+destined+only+for+the+elect.+But+that+He+died+sufficiently+for+all%2C+and+efficiently+for+the+elect%2C+can+in+no+way+be+said%3A+I.+Because+the+division+of+efficiency+and+sufficiency+implies+a+contradiction+with+the+thing+divided.+For+if+He+died+for+all%2C+it+follows+that+He+willed+by+His+death+to+expiate+the+sins+of+all%2C+and+to+obtain+their+remission.+For+this+the+particle+for+%28pro%29+requires%2C+indicating+the+end%2C+as+does+the+very+phrase.+But+if+He+willed+to+expiate%2C+then+certainly+He+also+actually+expiated.+The+reason+is+that+whatever+He+ever+willed+to+effect%2C+He+brought+to+effect%3B+whether+as+the+omnipotent+God%2C+or+as+the+faithful+servant+of+the+Father%2C+whom+the+Father+always+heard.+If+He+actually+expiated+the+sins+of+all+individuals%2C+therefore+He+died+efficiently+for+all+and+each+individual%3B+which+nevertheless+this+distinction+denies.+II.+A+distinction+that+removes+theological+principles+is+faulty.+The+distinction+of+sufficiency+and+efficiency+removes+theological+principles.+The+reason+is+that+it+separates+those+things+which+God+has+joined+in+the+covenant+Jer.+31%3A33%E2%80%9334.+For+those+whose+Savior+Christ+is%2C+He+is+their+Savior+both+by+merit+and+by+efficacy+together%2C+not+by+one+only.+Therefore.%E2%80%9D%0A%0A%E2%80%94+Henry+Alting%2C+Logical+%26+Theological+Exegesis+of+the+Augsburg+Confession+%28Amsterdam%3A+Janssonius%2C+1647%29%2C+Syllabus+of+Controversies+with+Lutherans%2C+Controversy+4%2C+on+Predestination%2C+Question+3%2C+4.+%E2%80%98Whether+for+All+%26+Every+Person+Christ+Died%E2%80%99%2C+p.+237+trans.+AI&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F926982d7c8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/926982d7c8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=Christ%20died%20for%20all%20sufficiently%2C%20for,together%2C%20not%20by%20one%20only.%20Therefore&amp;text=Christ%20died%20for%20all%20sufficiently%2C%20for%20the%20elect&amp;text=by%20efficacy%20together%2C%20not%20by%20one%20only.%20Therefore" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It is enough to show it to be good and acceptable to God to pray for all that He is best pleased with, and prefers the salvation of all, as He at the first made all, and since sent his Son into the world to give Himself, as a ransom for all. But how can it be thus said either, seeing that if the ransom be payed for all, all are not delivered? To this it is generally answered, that Christ’s giving of Himself to the death was a ransom sufficient to save all men, according to the signification of the word αντίλυτρον [redemption], used to set forth the ransoming of captives, when one is given to death for the delivering of another. For Christ alone was worth all the world, and his death equivalent to the dying of all men by everlasting death. When therefore He gave himself to the death for us, He suffered on his part so much as was sufficient to save all men, that neither on the part of God, nor of Christ Jesus there might be any want [lack], but the want might be altogether in themselves in such as are damned. Christ died for all [in the sense of sufficiency described above], the Gospel is preached to all, and all enjoy the holy Sacraments, which are the means of salvation; but such, as are not hereby moved to faith and repentance, shall perish not withstanding through their own default…</p></blockquote>

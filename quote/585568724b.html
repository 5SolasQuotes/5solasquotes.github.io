<main class="wrap"><figure class="quote" id="q-585568724b" data-kw="">
<blockquote><p>I have treated on these two subjects, because I know they are the tempting errours of these Times, and have the fairest glosses set on them, and have too much influence to disturb the Peace and Order of Churches:

The first [anti-paedobaptism] especially, which eats out men’s affections, and creeps at the heart like a gangrene insensibly; an opinion which hath been always ominous, and of a wonderful strange influence, accompanied with the most dangerous retinue of errors, since the first Embryo of it was brought forth; whether by a judgement of God, or from its natural and secret connexion with other principles of darkness, I will not determine; only God hath shewed some black characters on it in every Nation where it hath prevailed; though we cannot but say, many Saints are innocently under the power of it.

For the second [error, uninspired hymns], I hope when men’s hearts come in Tune, their voices will likewise: The former denies more Fundamental Principles, as the Covenant in its extent, and subjects; the freeness of Grace; the riches of its workings in the New Testament; and contracts the Gospel; leaving more Grace visible in the Legal and Old Testament dispensation, then in the New.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cuthbert-sidenham.html">Cuthbert Sidenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian, Sober &amp; Plain Exercitation on the Two Grand Practical Controversies of these Times; Infant-Baptism and Singing of Psalms</cite>, (London: Robert White, 1654), epistle dedicatory.</span></figcaption>

724b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/03/cuthbert-sidenham-anti-paedobaptism-as-a-worse-error-than-uninspired-hymns/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2b3f2cfaf8" data-kw="">
<blockquote><p>But we do exclude from baptism the children of those who clearly are strangers to the covenant, such as the children of heathens, Muslims, Jews, and of similar people… And for this reason we should leave them–like foreigners–to the judgement of God… unless they happen through lawful adoption or through the just and properly-designated status of slaves to be enrolled and taken up into the families of believers as though belonging to them.† For in this case many Reformed churches do baptize those children, because they deem that God has adopted them into the fellowship of his covenant in this manner, that is to say by the covenant of Genesis 17:12-13, which in the early church was so far beyond debate that from it Augustine on several occasions deduced a powerful argument against the Pelagians for election by grace. [On the Grace of Christ &amp; on Original Sin 2.35 in NPNF1 5.249-50] † This is a remarkable position, given the fact that the Synod of Dort had decided negatively on the issue in response to a question from East-India if it was allowed to baptize a child from pagan parents adopted into a Christian family. At the synod, the professors and the delegates from Zeeland, Friesland and Utrecht did not object to baptism, together with the majority of foreign delegates, but the delegates from Holland and Gelderland objected because human adoption does not imply divine adoption. Adopted children first had to profess faith and only then could be baptized, though as infants they could be commended to God’s gracious care by the laying-on of hands. See Acta of the Synod of Dordt, eds. Donald Sinnema, Christian Moser, and Herman Selderhuis (Gottingen: Vandenhoeck &amp; Ruprecht), 30-32.</p></blockquote>

</figure><figure class="quote" id="q-0d115b7eac" data-kw="">
<blockquote><p>The third [sort of Anabaptists, after the two from the Early Church] broached theirs in the year 1525, which was this, (3) that baptism ought to be administred to none, but such as can give a good account of their faith; and in case any have been baptized in their infancy, that they ought to be re-baptized after they come to years of discretion, before they are to be admitted to the church of Christ. … For the third sort of Anabaptists, they have sunk deeper in the former quagmire… For they not only nullify all baptism administered either by Romish priests, or orthodox Protestants, but condemn [the] baptizing of children simply, which neither the first nor the second sort of Anabaptists [in the Early Church] did; for both the Novatians and Donatists, yea, and Pelagians too, though they denied original sin, yet they all allowed and practised the baptism of infants. The author of this third and worst sect of Anabaptists, was, as some say Muncerus; as others, Balthasar Pacimontanus, against whom Zwingli wrote; as others, Carolstadius; but I subscribe to Melancthou, who lived in those times… And he affirms, as I said before, that Nicholas Stock was the first that broached Anabaptism in Germany. This Stock affirmed, that God spake to him by an angel, and revealed his will to him in dreams, promising him the place of the angel Gabriel: in this man’s school was Thomas Muncer bred…</p></blockquote>

<blockquote><p>For we ought always to be carefully on our guard that the sanctity of this mystery be not profaned, which it certainly should be if it were promiscuously administered to aliens, or if any one received it without having such sponsors as may be counted among the legitimate members of the church.</p></blockquote>

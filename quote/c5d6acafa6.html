<main class="wrap"><figure class="quote" id="q-c5d6acafa6" data-kw="">
<blockquote><p>The majority of the Reformed state that they [the angels] were created on the first day, with the empyrean heaven (Gen. 1:1 with 2:1). At least that they were created before the creation of the earth seems to be spoken of clearly enough in Job 38:7. Yet that they preexisted or could have preexisted this whole world they constantly deny, because: (1) Scripture has not even one whit of it; in fact rather, in the six days was created the whole world, with all its host (Gen. 2:1–2), through which angels are signified (Luke 2:13, 15), and also, all things which are contained in the world were created in the six days (Ex. 20:11).

(2) Before the world there was nothing except eternity, and according to the style of Scripture, to be from eternity, and to be before the foundations of the world were laid, have the same force (Ps. 90:2; Prov. 8:22; Eph. 1:4; 1 Peter 1:20; John 17:24; Acts 15:18). Reason assists here, because (3) before the beginning of time there was nothing except sheer eternity, in which there is no before and after; therefore, from the contrary hypothesis, the angels would be in eternity and eternal, and thus infinite in duration, existence, and essence, which is proper to God alone. (4) Every creature, being finite, is bounded by its own where, such that whatever is not in a where is nowhere, and thus does not exist at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology. Volume 3: The Works of God and the Fall of Man</cite>, trans. Todd M. Rester, eds Joel R. Beeke and Michael T. Spangler (1682; Grand Rapids MI: Reformation Heritage Books, 2021), Book 3.7.24.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>The judgments of God do not always follow crimes, as thunder does lightning, but sometimes the space of many ages coming between. When the sun has shined fair the space of six days upon their tabernacle, we know not what clouds the seventh may bring. And when their punishment does come, let them make their account, in the greatness of their sufferings to pay the interest of that respite which has been given them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Mr. Richard Hooker</cite>, … in Eight Books of Ecclesiastical Polity (d. 1600; London: Newcomb, 1666), A Remedy against Sorrow &amp; Fear, delivered in a Funeral Sermon, p. 546 Note Hooker’s use of the phrase here is not limited to natural days.</span></figcaption>

<blockquote><p>An act of the cognitive faculty is according as the thing known is in the knower; while an act of the appetite faculty is directed to things as they exist in themselves. But all that can have the nature of being and truth virtually exists in God, though it does not all exist in created things. Therefore God knows all truth; but does not will all good, except in so far as He wills Himself, in Whom all good virtually exists.</p></blockquote>

</figure><figure class="quote" id="q-9630dae88b" data-kw="">
<blockquote><p>A consistent evolutionist could not agree that man’s chief and highest end is to glorify and enjoy God, for he must hold that the human race has evolved from a brute ancestry by a process which originated in blind chance. Therefore he must hold that the human race cannot exist for any purpose outside of itself.

There are “theistic evolutionists” who believe that evolution was God’s method of creation, but they are not consistent, for creation concerns the origin of things, while evolution starts by assuming that things already exist and seeks to show their development to other form. The consistent evolutionist cannot believe in creation by the sheer power of God, and therefore he cannot believe that the human race exists not for itself but for God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Studies in the Larger Catechism of the Westminster Assembly in Blue Banner Faith and Life</cite></span></figcaption>

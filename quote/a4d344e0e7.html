<main class="wrap"><figure class="quote" id="q-a4d344e0e7" data-kw="">
<blockquote><p>The Scriptures of the Old and New Testament do abundantly and uncontrollably manifest themselves to be the word of the living God; so that, merely on the account of their own proposal of themselves unto us in the name and majesty of God, as such — without the contribution of help or assistance from tradition, church, or any thing else without themselves — we are obliged, upon the penalty of eternal damnation … to receive them, with that subjection of soul which is due to the word of God. … So, then, the authority of the written Word — in itself and unto us — is from itself, as the Word of God; and the eviction of that authority unto us, is by itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Divine Original of the Scriptures</cite>, Works (Goold), vol. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/divine-authority.html">Divine Authority</a> › <a href="../topics/holy-scripture/divine-authority/self-authentication.html">Self-authentication</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-da71c1ee94" data-kw="">
<blockquote><p>That the Scriptures are the supreme &quot;judge&quot; in all controversies concerning religion. The authority of the Scriptures as the ultimate rule of faith rests alone in the fact that they are the Word of God. Since all these writings are one revelation, and the only revelation of his will concerning religion given by God to men, it follows: … That they are complete as a revelation in themselves, and are not to be supplemented or explained by light drawn from any other source.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, ch. 1, §§ 9–10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/holy-scripture/divine-authority.html">Divine Authority</a></span></div>
<div class="actions"><button class="copy" data-copy="“That the Scriptures are the supreme &quot;judge&quot; in all controversies concerning religion. The authority of the Scriptures as the ultimate rule of faith rests alone in the fact that they are the Word of God. Since all these writings are one revelation, and the only revelation of his will concerning religion given by God to men, it follows: … That they are complete as a revelation in themselves, and are not to be supplemented or explained by light drawn from any other source.”

</figure><figure class="quote" id="q-ec738a4a8b" data-kw="authority">
<blockquote><p>The authority of Scripture (concerning which we here inquire) is nothing else than the right and dignity of the sacred books, on account of which they are most worthy of faith with regard to those things which they propose to be believed and of our obedience in those things which they command us to omit or to do. The divine and infallible truth of these books (which have God for their author) is the foundation because he has the highest right to bind men to faith and duty. But this truth may be either intrinsic or extrinsic. The former is the credibility (axiopistia) in itself of the word which is always equal and consistent with itself, whether it has the testimony of men or not. The latter is the estimation or judgment of men in relation to the Scriptures, which is different as the subjects are different. Of history and of rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.4.3</span></figcaption>

</figure><figure class="quote" id="q-1b112c667b" data-kw="">
<blockquote><p>Standing on the authority of Scripture, the preacher declares a truth received, not a message invented. The teaching office is not an advisory role based in religious expertise but a prophetic function whereby God speaks to His people.</p></blockquote>

</figure><figure class="quote" id="q-6c1d4a94c7" data-kw="">
<blockquote><p>Let this then be a sure axiom - that there is no word of God to which place should be given in the Church save that which is contained, first, in the Law and the Prophets; and, secondly, in the writings of the Apostles, and that the only due method of teaching in the Church is according to the prescription and rule of his word.</p></blockquote>

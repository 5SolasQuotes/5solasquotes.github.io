<main class="wrap"><figure class="quote" id="q-f48e48a021" data-kw="">
<blockquote><p>9 Q. Could you give a more definitive explanation of what the gospel is? A. The gospel, or the good news that delights the heart of the poor condemned sinner, is a revelation of the fatherly and immutable will of God, in which He promised us, who are unworthy, that all our sins have been washed away and pardoned not just for the rest of our lives but, indeed, forever. He carries out this promise by giving His Son to die for us and by raising Him. Since Christ died not in His own sin but in ours (as if He Himself had committed it) and arose out of this same sin as a mighty victor (1 Cor. 15:17), it follows that there is not a single sin of ours for which He has not paid. If even one of all those sins that Christ took upon Himself had not been paid for, He would have had to remain the tomb and could not have risen. For where there is even one sin, there is also eternal death, as God Himself says in Deuteronomy 27. Also, “The wages of sin is death” (Rom. 6[:23]). Since, therefore, Christ arises out of all our sin as a victor in our flesh (which He assumed and forever retains), this is public testimony to us that we are considered as pure and righteous in the eyes of God as Christ Jesus was when He arose from the grave (Rom. 4; 1 Cor. 15:17). Along with that, God through Christ both promises us in the gospel and then actually gives us the Holy Spirit. The Spirit turns our hearts from sin and from the kingdom of the Devil to Himself, bears witness that we are children of God, initiates in us both joy in God and eternal life here below, and brings it to completion in us up in heaven. All of this God freely offers and gives to us in the gospel, without any regard to our past, present, or future merit or piety. He applies it to us by grace through faith, so that whoever boasts, boasts in the Lord (Jer. 9[:24]; 1 Cor. 1[:31]). It can also be described more briefly: the gospel is a revelation of the fatherly and immutable will of God, in which He promises all believers (1) that their sins have been pardoned from eternity and shall be forever forgotten, and (2) that He will freely give them the Holy Spirit and eternal life, without any past, present, or future merit of ours, because of the voluntary sacrifice of this most exalted person, Christ—truly God and truly human. This sacrifice was there before the face of God from eternity, then was promised, and now has been carried out and completed, retaining forever its efficacy for our full redemption (Eph. 1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Firm Foundation: An Aid to Interpreting the Heidelberg Catechism</cite>, trans. Lyle D. Bierma, Texts and Studies in Reformation and Post-Reformation Thought (Carlisle, United Kingdom; Grand Rapids, MI: Paternoster Press; Baker Books, 1995), 8–9.</span></figcaption>

<blockquote><p>As for the last of them, which answers first in this 13th verse, he says that it is not sufficient for justification before God to have received the law, and simply to be hearers of it; but that must be observed and reduced to practice. This is incontestable truth. For the law has not been given as a matter of curiosity or contemplation as a philosophical science, but to be obeyed; and the greatest outrage against the law and the Legislator, is to hear it and not to take heed practice it. It will be in vain, therefore, for the Jew to say, I am a hearer of the law, I attend on its services, I belong to the covenant of God, who has given me his testimonies. On all these accounts, being a transgressor, as he is, he must be condemned. The presence of the article before the word law in both the clauses of this verse, which is wanting in the preceding verse, shows that the reference is to the Jews under the written law. The doers of the law shall be justified—By this we must understand an exact obedience to the law to be intended, which can defend itself against that declaration, ‘Cursed is every one that continueth not in all things which are written in the book of the law to do them.’ For it is not the same with the judgement of the law as with that of grace. The Gospel indeed requires of us a perfect obedience to its commands, yet it not only provides for believers’ pardon of the sins committed before their calling, but of those also which they afterwards commit. But the judgment of the law admits of no indulgence to those who are under it; it demands a full land perfect personal observance of all its requirements—a patient continuance in well-doing, without the least deviation, or the smallest spect of sin; and when it does not find this state of perfection, condemns the man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-haldane.html">Robert Haldane</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Epistle to the Romans. A Geneva Series Commentary</cite>, (Edinburgh: The Banner of Truth, repr. 1996), 89 (On Romans 2:13).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

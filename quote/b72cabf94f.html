<main class="wrap"><figure class="quote" id="q-b72cabf94f" data-kw="">
<blockquote><p>Let us remember, on the other hand, that while life is promised universally to all who believe in Christ, still faith is not common to all. For Christ is made known and held out to the view of all, but the elect alone are they whose eyes God opens, that they may seek him by faith. Here, too, is displayed a wonderful effect of faith; for by it we receive Christ such as he is given to us by the Father—that is, as having freed us from the condemnation of eternal death, and made us heirs of eternal life, because, by the sacrifice of his death, he has atoned for our sins, that nothing may prevent God from acknowledging us as his sons. Since, therefore, faith embraces Christ, with the efficacy of his death and the fruit of his resurrection, we need not wonder if by it we obtain likewise the life of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Gospel According to John, vol. 1 (Bellingham, WA: Logos Bible Software, 2010), 125.</cite></span></figcaption>

<blockquote><p>Whether Christ died for us, that is vicariously and in our place, and further that salvation was brought forth for us? It is affirmed against the Socinians. … Whether He is our mediator only so far as a messenger is? It is denied. Whether Christ truly reconciled us to the Father, or whether our redemption done through that indeed was only metaphorical? The former is affirmed, the latter is denied. … Whether Christ’s death is meritorious to us, or it was in truth a preparation only unto his priesthood? The former is affirmed. Whether the dogma of satisfaction and merit in the sacred pages is founded, or repugnant to right reason? The former is affirmed, the latter is denied. …</p></blockquote>

</figure><figure class="quote" id="q-bab3a2fca6" data-kw="">
<blockquote><p>XXIX. Therefore the end of satisfaction, to whom, or the object, is solely the elect and true believers of both the Old and New Testament. For although it could extend itself to all men with respect to the greatness, dignity, and sufficiency of the price considered in itself, nevertheless it was particularly expended for those whom the Father elected and gave to the Son, and who by God’s gift would believe in God and His Son. Whence Scripture repeatedly says that He gave Himself for His own, and for us, for the sheep, and for the Church. Mt. 20:7, 28 and 26 [i.e. Mt. 26:28]; 1 Jn. 3:16; Acts 20:28, etc.</p></blockquote>

</figure><figure class="quote" id="q-39e34c7d9b" data-kw="">
<blockquote><p>This notion, as if the justification, righteousness, and life spoken of in Rom. v. implied the resurrection of damnation, is not only without ground from Scripture, but contrary to reason. For those are there spoken of as great benefits, by the grace and free gift of God: but this is the contrary, in the highest degree possible; the most consummate calamity. To obviate this, our author supposes the resurrection of all to be a great benefit in itself, though turned into a calamity by the sin and folly of obstinate sinners, who abuse God&#x27;s goodness. But the far greater part of mankind, since Adam, have never had opportunity to abuse this goodness, it having never been made known to them. Men cannot abuse a kindness, which they never had either in possession, promise, offer, or some intimation: but a resurrection is made known only by divine revelation which few comparatively have enjoyed. So that as to such wicked men as die in lands of darkness, if their resurrection comes at all by Christ, it comes from him, and to them, only is a curse, and not a blessing; for it never comes to them at all by any conveyance, grant, promise, or offer, or any thing by which they can claim it, or know any thing of it, till it comes as an infinite calamity, past all remedy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Christian Doctrine of Original Sin Defended</cite>, pt. 2, ch. 4, sec. 1 (on Rom. 5:12–21)</span></figcaption>

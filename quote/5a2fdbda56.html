<blockquote><p>The partial conformist Paul, when he offered animal sacrifices, or arranged such for others (Acts 21:23–26; Num. 6:13–14) after Christ’s death, was, under a certain degree of necessity for a greater good (Acts 21:20–23), fulfilling the good in this deficient, yet lawful worship to God, without approving the deficiencies as best. Note these deficiencies in the material worship were in some ways contrary to Gospel principles (Acts 15:10, 28; Gal. 3:19, 23, 24–25; 4:1–3, 5–7, 9, 24, 30–31; 5:1, 7; Col. 2:14, 17, 20, 22; Tit. 1:14; Heb. 7:16, 27; 8:7–8, 10; 9:9–11, 28; 10:1–2, 10–11; 13:9) and the authorities would not remove them. Many may have accused Paul, knowing his convictions and what he had previously preached (Acts 21:21, albeit in a different context with a different kind of people for different formal reasons, e.g. Gal. 2–4 &amp; Col. 2:8–23), of compromising, conforming, backsliding and having temporizing motives for his own ease, avoiding suffering and of breaking the solemn, Gospel covenant. Ought not one to separate from such a scandalous Christian minister, who, for a time and in the circumstances, materially conformed at the permitted, yet restricting indulgence of the tyrannous authorities over God’s Church (as the rest of the story manifests, Acts 21:26–33)? God forbid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025), “A True Principle”</cite>, p. 49</span></figcaption>

<blockquote><p>Now for the last thing which makes things indifferent with us scandalous: we are not left without witness from the Scriptures in such cases. But that ceremonies, known to be scandalous, were notwithstanding used: for, it is manifest concerning the Jewish ceremonies that they were scandalous in the usage to the gentiles and in the omitting to the Jews, Acts 21:21-22, 27-28; Gal. 2:3, 9, 12. But that this point of scandal may be distinctly understood, diverse rules are to be considered of: First, that the angering or bare displeasing of other men is not the offense or scandal condemned in Scripture, as not only the words in the original show, but all sound divines grant. A scandal is a stumbling block that occasions a man to fall from grace in the profession of it, into sin or error. Secondly, that to give offense, by doing anything which is simply evil in itself (as David did by his adultery and murder), this is out of all question abominable. Thirdly, that the offense of aliens is to be regarded, that is, we must not do anything by which men that are not yet converted may be hardened from the liking of religion: and so, offense must not be given either to the Jews or to the Grecian, 1 Cor. 10:31. Fourthly, that when the authority of the magistrate or Church has determined concerning the use of things indifferent, we are not now left free, nor are bound to look at the scandal of particular persons; but must make conscience of it, that we offend not the Church, by working a greater hurt or loss to the Church than the particular hurt of private persons can extend unto. In such cases as this, the apostle’s rule holds: ‘If any man seem to be contentious, we have no such custom, nor the Church of God,’ 1 Cor. 11:16. And we are bound, in this text of the apostle Peter [1 Pet. 2:13] to obey the human ordinances of men in authority, from which obligation other men’s offense cannot free us. And the apostle charges us to look to it that we offend not the Church in prescribed ordinances, and that we be careful not to offend private men in free ceremonies. Fiftly, that where ceremonies are left free and indifferent and have no commandement to restrain their use or enjoin it, there are men to redeem the offense of their brethren with no other price than the loss of liberty in things indifferent. The apostle Paul says rather than [that] he will offend his brother, he will never eat flesh while he lives, 1 Cor. 10:8, 13. He does not say he will never preach the Gospel while he lives, or never receive the sacraments while he lives: a necessity lay upon him to preach the Gospel, and to yield to the use of all lawful things to get his liberty, whosoever be offended. Sixtly, that where the person that takes offense is wilfully ignorant and by all means avoids instruction and will not have the patience to be taught, such offense is not to be regarded. Thus our Savior Christ teaches confidently his doctrine of eating his flesh, though the Capernaites were offended: and some of his disciples turned apostates about it, being such persons as would not abide the exposition of his meaning, Jn. 6:52. Seventhly, the like is to be said of such persons as take offense out of envy or malice, as the man in the parable that envied Christ’s bounty (Mt. 20:15), or the Pharisees, that out of malice were offended at Christ, Mt. 15:14; 1 Pet. 2:8. Eighthly, that in things that have proved scandalous, yet we are not bound to lose our liberty till the weak brother declare his offense. Meat sacrificed to idols was offensive to many in all countries, yet the apostle’s rule is, ‘Eat and make no question unless one say, ‘This is meat sacrificed to idols,” 1 Cor. 10:25, 28.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter... (London, 1623), on 1 Pet. 2:13</cite>, pp. 595-97</span></figcaption>

<blockquote><p>4. But if we were malicious in offending at the ceremonies as things unlawful, and in urging of non-conformity as necessary, should they [the prelates] therefore contemn our being scandalized? Those that would have Titus circumcised, were they not malicious? [Gal. 2:3-5] Did they not urge circumcision as necessary? Held they it not unlawful, not to circumcise Titus? Yet did the apostle abstain, because they were to be scandalized, that is, made worse and more wicked calumniators by the circumcising of Titus, as I have showed (above, ch. 8, section 6); So that albeit we are not to care for the displeasing of men that malitiously and contumaciously urge (as necessary) abstaining from that which is lawful to be done, yet must we care for scandalizing them and making them worse: rather ere that be, we ought to abstain from the use of our liberty.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“4. But if we were malicious in offending at the ceremonies as things unlawful, and in urging of non-conformity as necessary, should they [the prelates] therefore contemn our being scandalized? Those that would have Titus circumcised, were they not malicious? [Gal. 2:3-5] Did they not urge circumcision as necessary? Held they it not unlawful, not to circumcise Titus? Yet did the apostle abstain, because they were to be scandalized, that is, made worse and more wicked calumniators by the circumcising of Titus, as I have showed (above, ch. 8, section 6); So that albeit we are not to care for the displeasing of men that malitiously and contumaciously urge (as necessary) abstaining from that which is lawful to be done, yet must we care for scandalizing them and making them worse: rather ere that be, we ought to abstain from the use of our liberty.”

</figure><figure class="quote" id="q-9f643623cd" data-kw="">
<blockquote><p>Not just Paul, but the apostles and elders at the synod in Jerusalem, bindingly (Acts 15:28; 16:4) laid some of these beggarly, burdensome ceremonies on the whole regional Church (Acts 15:23, 41; 16:4), as “it seemed good to the Holy Ghost” (Acts 15:28), yet not for the formal reason of service to that law of bondage. Rather, the circumstances made it necessary (Acts 15:28), to prevent the greater scandal of erring (Jewish) unbelievers and weak Christians (who expected the observance of such carnal and false, material ordinances), and for the spread of the Gospel amongst them. In the case of Paul, he had his reasons for keeping the ceremonies in each instance, though they are not always told to us or onlookers. But each time his necessity (Acts 16:1–5; 18:21) was less than ministerial deprivation. Sometimes it was simply to prevent unnecessary conflict.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

<blockquote><p>That to scandalize, is not merely to displease or grieve another: For many a man is displeased through his folly and vice, by that which tends to his good: and many a man is tempted (that is, scandalized) by that which pleases him… The most censorious and humorous sort of men have got a notion, that what ever offends or displeases them is scandalous! And they think that no man must do any thing which grieves or displeases them, lest he be guilty of scandal: And by this trick who ever can purchase impatiency and peevishness enough to be always displeased with the actions of others, shall rule the world. But the truth is, the ordinary way of scandalizing these men is by pleasing them. §. 4. I will give you one instance of scandal in Scripture, which may help this sort of people better to understand it. Gal. 2:10-16, Peter there gives true scandal to the Jews and Gentiles: He walked not uprightly according to the truth of the Gospel, but laid a stumbling block before the Jews and Gentiles: And this was not by displeasing the Jews, but by pleasing them… Peter knew the contrary, but for fear of them of the circumcision, lest they should be offended at him as a sinner, he withdrew and separated himself. This scandal tended to harden the Jews… and to seduce the Gentiles into a conceit… and Barnabas was carried away with the dissimulation… We scandalize them [Baxter’s opponents] and others even by pleasing them, and by avoiding that which they falsely called scandalous. And if we would not scandalize them, we must do that which is just, and not by our practice hide the sound doctrine which is contrary to their separating error. … And this [scandalizing] is done more seldom by committing open disgraceful sins and doing that which will make the doer evil spoken of: For by that means others are the more assisted against the temptation of imitating him: But scandal is most commonly found in those actions, which are under least reproach among men, or which have the most plausible appearance of good in them, when they are evil! For these are apter to deceive and overthrow another. §6. 3. And it is also apparent, that it is no sinful scandalizing to do a duty or necessary action which I have not power to forbear, though I know that another will be offended, or fall by it into sin. If God have made it my duty, even at this time, I must not disobey Him and omit my duty because another will make it an occasion of his sin. It must be either a sinful or an indifferent action that is scandal, or something that is in my own power to do or to forbear… § 7. III. …Those that are careless of the consequent of their actions, and contemn the souls of other men, and will go their own way, come of it what will, and say ‘Let other men look to themselves,’ are the commonest sort of scandalizers; and are as culpable as a servant that would leave hot water or fire when the children are like[ly] to fall into it; or that would leave straw or gunpowder near the fire, or would leave open the doors, though not of purpose to let in the thieves. §8. 2. Scandal is that which tends to another’s fall, either directly or indirectly, immediately or remotely! The former may easily be foreseen; but the latter requires a large foreseeing comparing understanding: Yet this kind of scandal also must be avoided; and wise-men that would not undo men’s souls while they think no harm, must look far before them and foresee what is like[ly] to be the consequent of their actions at the greatest distance and at many removes. 3. Scandals also are Aptitudinal or Actual: Many things are apt to tempt and occasion the ruin of another which yet never attain so bad an end, because God disappoints them: But that is no thanks to them that give the scandal.</p></blockquote>

<blockquote><p>Q. When doth this our Sabbath begin?

A. At the dawning of the day, for Christ rose in the dawning thereof; whereby is put a difference between the Jewish, and the true Christian Sabbath: for as the Jewish Sabbath began in that part of the day, in which the Creation of the world was ended, and consequently in the evening, so the celebration of the memory of Christ’s Resurrection, and therein of his Rest from his special labours, being the ground of the change of that day into this; it also (by the same proportion of reason) is to begin, when the Resurrection began, which was in the morning.

Q. Can you shew this by example?

A. Yea, Paul being at Troas, after he had preached a whole day until midnight, celebrated the Supper of the Lord the same night, which was a Sabbath day’s exercise; and therefore that night following the day, was a part of the Sabbath: for in the morning he departed, having stayed there seven days; by which it is evident, that that which was done, was upon the Lord’s day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or the whole body and substance of divinity</cite>, (London, 1616), pp 111-12.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-647983ef1f" data-kw="">
<blockquote><p>This invented or will-worship [Col. 2:23], Cultus arbitrarius, has two specious things in it, as the apostle says: 1. The first is a kind of wisdom, and carries with it a trim show thereof: when a man shall be thought so wise as that he is able to devise and invent a worship for God, especially when men consider not what God has already prescribed, whereby their rites prove contrary to what He has appointed, and so they will be wiser than God. … Although, all will-worship, [Greek], be taken in an evil sense by many, upon the vulgar exposition of that place in Col. 2:23, yet that there may be some voluntary or free worship acceptable to God, though not specially commanded, provided it be not corruptive of or contrary to any right or worship commanded by Him, but subservient or agreeable thereto, is the judgement of learned divines; For under the law they had their voluntary and free-will offerings, besides those commanded by God, and though things were more particularly prescribed in the Levitical worship than now under the Gospel, the Church being then in its childhood, and confined to one nation, and the Spirit not then so plentifully given as now since the ascension of Christ, yet even then the Church prescribed diverse things in God’s worship not specially commanded, as in fasts and festival days, as that of the dedication of the Temple, approved by Christ’s own observance, Jn. 10, and sundry other things, all which were never taxed as unlawful, unless the worship appointed by God Himself were thereby corrupted or neglected, and so the continual practice of the Christian Church has been to prescribe and order several things in God’s worship, which no peaceable and holy men ever found fault with, provided, that they were agreeable to those general rules of moral worship required by God and no ways repugnant to those rites by Him appointed, but rather subservient to them, and contained nothing either impious and forbidden, or vain and ridiculous; nor the observance of them preferred before the commandments of God, or made equal to them; but a difference observed between things of immediate divine institution and those of ecclesiastical institution: To add to God’s institution anything as from God is forbidden, Dt. 12:32, but to add something for the more decent and orderly performance of what God has appointed, and to observe the same as an ecclesiastical institution, is nowhere forbidden, but rather commanded in all those texts that require us to hear the Church [Mt. 18] and to give obedience to her; and to observe this is also to obey God, who has given his Church power to ordain such things: And that that place in Col. 2:23, condemns not all voluntary or free worship no more than it does humility and chastening, or keeping under the body which are joined therewith, but rather that it makes for it has been lately proved by judicious and learned divines; and by one in a full tract upon this subject of will-worship; for the apostle there condemning certain Jewish and Pythagorean observances about touching, tasting, etc. says, verse 23, that they had a show of wisdom, if due cautions were observed, viz. if they were freely and voluntarily undertaken, not as necessary to salvation, and without rejecting what God had made, and if they were used in humility or modesty not condemning others which used them not, and if they sought thereby only to keep under the flesh. The contrary to all which those Pythagoreans and Jews practiced. By which exposition, which I take to be the most true, it is plain that the apostle is so far from condemning all voluntary or will-worship, that he rather approves and commends it, and condemns their forbearance of meats and other things because it was not freely or voluntarily undertaken, but as a thing necessary to salvation, etc. See [Hugo] Grotius in Col. 2:23, Et votum pro pace, pp. 100-103, and [Andrew] Rivet, Apologeticus, pp. 109-10, etc. Dr. [Henry] Hammond, Of Will-Worship. See also our reverend author in his sermon on Mt. 6:16, p. 124, etc. and on 1 Cor. 11:16.</p></blockquote>

<blockquote><p>This is the commandment which is contradicted by many, and is assaulted with highly elevated shields. If many would have had it in their power, it would have long been forgotten and rejected. As is true for all other commandments, it is still read to the congregation on every sabbath day as a rule of life, in spite of all who regret this.

The words of this commandment contain: 1) a short exhortation; 2) a declaration; and 3) incentives for observance.

First of all there is a short exhortation: ― “Remember the sabbath day, to keep it holy” (Exod 20:8).

At the very outset a nota bene is placed; that is, a word of great emphasis, which ought to make a deep impression upon our hearts. ― “Remember,” that is, see to it that you do not contradict, reject, or forget this commandment. Remember it prior to the arrival of that day in order that you may order your affairs in such a manner that nothing will hinder you; prepare yourself for this day ahead of time. Be exhorted and be warned.</p></blockquote>

The words of this commandment contain: 1) a short exhortation; 2) a declaration; and 3) incentives for observance.

First of all there is a short exhortation: ― “Remember the sabbath day, to keep it holy” (Exod 20:8).

At the very outset a nota bene is placed; that is, a word of great emphasis, which ought to make a deep impression upon our hearts. ― “Remember,” that is, see to it that you do not contradict, reject, or forget this commandment. Remember it prior to the arrival of that day in order that you may order your affairs in such a manner that nothing will hinder you; prepare yourself for this day ahead of time. Be exhorted and be warned.”

<blockquote><p>Wherefore let it be set down that it is lawful for the Church to make to itself either canons or laws, or decrees, or statutes, or call them by what name thou wilt. For the Church is a company, and must be ruled by the Word of God, especially because it belongs to the salvation thereof, and to the worshiping of God. But there be other things which belong only unto outward discipline. For there is need of certain outward bonds, to the end that the fellowship of the people may be retained. So the apostle decreed that women ought to pray with the head covered, and men uncovered. And the apostles in the Acts, decreed that we should abstain from blood, from strangled, and from things dedicated unto idols. And always in councils after they had done with doctrine, they began to entreat of discipline. Finally so did all the fathers as Tertullian, Origen, Basil, Augustine and Jerome. The end of these laws must be edifying and good order. But for so much as they be not of necessity, they may be changed according to the times and places.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3eb42af139" data-kw="">
<blockquote><p>The Divine worship includes not only sacrifices and the like, which seem to be directed to God immediately, but also those things whereby His worshippers are duly prepared to worship Him: thus too in other matters, whatever is preparatory to the end comes under the science whose object is the end. Accordingly those precepts of the Law which regard the clothing and food of God’s worshippers, and other such matters, pertain to a certain preparation of the ministers, with the view of fitting them for the Divine worship: just as those who administer to a king make use of certain special observances. Consequently such are contained under the ceremonial precepts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 2, pt. 1, Question 101, ‘Of the Ceremonial Precepts in Themselves’, Article 1, ‘Whether the nature of the ceremonial precepts consists in their pertaining to the worship of God?’, Reply to Objection 1. While Aquinas’s teaching can be taken too far, as Romanists have taken it in setting apart as holy the many various instruments involved with the mass, yet there is an aspect of truth in the teaching.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ed3a9d77a" data-kw="">
<blockquote><p>As for the Love-feasts used in the primitive Church: 1. They had no religious state in divine worship, but were used only as moral signs of mutual charity. The Rhemists [Romanists] will have them called Coenas dominicas. But what-says Cartwright against them? ‘We grant that there were such feasts used in times past, but they were called by the name of [Greek] or Love-feasts, not by the name of the Lord’s Supper: neither could one without sacrilege give so holy a name to a common feast, which never had ground out of the Word, and which after for just cause was thrust out by the Word of God.’ 2. If it be thought, that they were used as sacred signs of Christian charity, because they were eaten in the Church. I answer, the eating of them in the Church is forbidden by the apostle. ‘What?’ says he, ‘have ye not houses to eat and to drink in?’ or despise ye the Church of God? Aperte vetat, says [David] Pareus: commessationes in Ecclesia, quocunque fueo pingantur. Vocabant [Greek] charitates: sed nihil minus erant. Erant schismatum fomenta. Singulae enim sectae suas instituebant. And a little after: Aliquae Ecclesiae obtemperasse videntur. Nam Iustini temporibus Romana Ecclesia [Greek] non habuit. (Commentary in that place)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3, ch. 5</cite>, p. 90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>Arguments of Peter Martyr disputing with Mr. Chadsey upon the first question: The analogy and resemblance between the sacrament and the thing signified must ever be kept in all sacraments. In the sacrament of the Lord’s body, this analogy or resemblance cannot be kept, if bread be transubstantiated: Ergo [therefore], the substance of bread must needs remain in the sacrament of the Lord’s body. The major [premise] of this argument is certain by St. Austen [Augustine] (Book on Catechizing in the Rudiments; Epistle to Dardan), where he says: Sacraments must needs bear a similitude of those things whereof they are sacraments, or else they can be no sacraments.</p></blockquote>

<blockquote><p>XIV. God has by Nature and Scripture obliged men themselves to choose and determine diverse subordinate expressions, significations, modes, circumstances, or accidents of this universal religion, which are not themselves meet for an universal, and unchangeable, obligation, but local, temporary, and mutable: Some of which every man may choose for himself, some the present pastor must choose, some the associated pastors may choose, and some the magistrate may choose. These must be added to the universal duties, so far is such addition from being sin: I have often named many particulars, as: the translation of the Scripture, which to choose: the version of the psalms in rhythm, or metre, the common use of new made hymns, the dividing the Scripture into chapter and verse; the words of sermons; their method; the particular text to be chosen; what chapters to read; at what hour to begin; how long to preach; in what words to pray, whether the same oft, or changed; whether fore-studied, or not, whether written, or unwritten: whether studied, and written by ourselves, or by others; where the place shall be, where the pulpit, [baptismal] font, table, etc. shall stand; what ornaments they shall have, linen, silk, silver vessels or otherwise? Whether we be bare-headed, or covered at prayer, sacrament, etc. Whether we shall kneel, stand, sit, or be prostrate at prayer, etc. what distinctive garments pastors shall use. By what signs of consent and obligation men vow, and swear, whether by putting the hand under the thigh, lifting it up, subscribing, laying it on the Book [Bible], kissing the Book, etc. what catechisms to use, with many more such. God has commanded men to choose such things as these by the rules of edification, love, peace, concord, order, decency, winning those without, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by [Against] Dr. Owen’s Vindicator… (London: Parkhurst, 1684), section 2</cite>, p. 11</span></figcaption>

<blockquote><p>§17. 11. He that has commanded us to express our minds in several cases about his worship (as in confession of our sins, in profession of our faith, in choosing of our pastors, in consenting to the casting out or taking in, or restoring of members, in renewing promises of obedience, and the like) has hereby made a profession necessary in general, and so has made it our duty to signify our consent in all these cases by some convenient sign: For man’s mind is not known to others but by signs. But He has not tied us absolutely to any particular sign. If a confession of faith be read, and we are called to signify our consent, or if we are called to signify our consent to be Church-members, or to be guided by our pastors, or submit to discipline; God has not tied us in such cases, whether we shall signify this consent by speaking, or by subscribing our names (Isa. 44:3-5) or by lifting up the hand, or by laying it on a Book (as in swearing) or by standing up, or such like. A sufficient signification or profession of our minds is necessary; but the special sign is left to our own, or our governor’s determination. Of which I shall speak more anon. §18. To this end, and on these terms was the sign of the cross used heretofore by Christians, and to this end they used standing in public worship every Lord’s Day (forbidding kneeling) and afterward standing up at the [saying of the Apostles’] Creed: as also adoring with their faces towards the east, etc. They used these only as significations of their own minds, instead of words; As the prophets of old were wont by other signs, as well as words to prophesy to the people… And I dare not condemn the cautelous [prudent, cautious] use of such professing signs as these: Though the tongue be the chief instrument, yet not the only instrument to express the mind; and though words be the ordinary sign, yet not the only sign. Dumb men must speak by other signs: And usually more silent signs are fitter for assemblies, to avoid disturbance: And sometimes more permanent signs (as subscription, or a stone or pillar of remembrance, as Josh. 24, etc.) are more desirable. And this is left to human prudence. §19. And therefore I durst not have reproved any of the ancient Christians that used the sign of the cross merely as a professing signal action, to show to the heathen and Jews about them that they believed in a crucified Christ, and were not ashamed of his cross. The occasional, indifferent use of this, when it is merely to this end, I durst not have condemned. Nor will I now condemn a man that, living among the enemies of a crucified Christ, shall wear a cross in his hat, or on his breast, or set it on his doors, or other convenient place, merely as a professing sign of his mind, to be but instead of so many words, q. d. [as to say] ‘I thus profess myself the servant of a crucified Christ, of whom I am not ashamed.’ Whether these things be fit or unfit, the time, place, occasion and other circumstances must show: but the lawfulness I dare not deny. … §40… I think neither magistrate nor synod should do any more than hinder undecency: But yet if they do more, and tie all to one habit [garment] (and suppose it were an undecent habit), yet this is but an imprudent use of power. It is a thing within the magistrate’s reach; He does not an alien work, but his own work amiss: and therefore the thing in itself being lawful, I would obey him and use that garment if I could not be dispensed with [it]. Yea though secondarily the whiteness be to signify purity, and so it be made a teaching sign, yet would I obey: For secondarily, we may lawfully and piously make teaching signs of our food and raiment, and everything we see. But if the magistrate had said that the primary reason or use of the surplice was to be an instituted sacramental sign, to work grace on my soul, and engage me to God, then I durst not have used it, though secondarily it had been commanded as a decent garment. New sacraments I durst not use, though a secondary use were lawful. … §57. That it [the minister making the sign of the cross in baptism] is ordained for this use, appears from the words (anon to be recited) in the use of it, and by those words prefixed before the Common Prayer Book, ‘of ceremonies; why some are abolished and some retained,’ where they say that they ‘be not dark and dumb ceremonies, but are so set forth that every man may understand what they do mean, and to what use they do serve,’ and ‘that they are such as are apt to stir up the dull mind of man, to the remembrance of his duty to God, by some notable and special signification, whereby he might be edified.’ So that this and such other (if there be more such) are appointed by their signification to teach the understanding, and stir up the dull mind of man to the remembrance of his duty to God: Which are good works, but to be done only by good means. [Baxter goes on to take exceptions to the use of the cross in baptism]</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2e5d8328ba" data-kw="">
<blockquote><p>It [magistracy] is an ordinance of men, not effectively, as if it were an invention and a dream of men; but subjectively, because exercised by man. Objectively, and [Greek, telikos], for the good of men, and for the external man’s peace and safety especially; whereas church -officers are for the spiritual good of men’s souls. And Durandus says well (Book on the Origin of Right), “Civil power according to its institution is of God, and according to its acquisition and way of use is of man.” And we may thus far call the forms of magistrates ‘a human ordinance’ [2 Pet. 2]—that some magistrates are ordained to care for men’s lives and matters criminal, of life and death, and some for men’s lands and estates; some for commodities by sea, and some by land; and are thus called magistrates according to these determinations or human ordinances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, (Edinburgh: Ogle &amp; Boyd, 1843), p. 6 (lt col top)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c0ce9a21b" data-kw="">
<blockquote><p>Certainly, a king being a sinful man, and having no restraint on his power [such as by laws, checks and balances, self-defense of the citizenry, etc.] but reason, he may think it reason to allow rebels to kill, drown, hang, torture to death a hundred thousand protestants, men, women, infants in the womb and sucking babes, as is clear in Pharaoh, Manasseh and other princes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 111</span></figcaption>

</figure><figure class="quote" id="q-cbf3704f54" data-kw="">
<blockquote><p>I lay down this maxim of divinity: Tyranny being a work of Satan, is not from God, because sin, either habitual or actual, is not from God; the power that ‘is’ [Rom. 13:1], must be from God; the magistrate as magistrate, is good, in nature of office, and the intrinsecal end of his office, Rom. 13:4, for he is the minister of God for thy good; and therefore a power ethical, politic, or moral, to oppress, is not from God, and is not a power, but a licentious deviation of a power, and is no more from God (but from sinful nature, and the old serpent) than a license to sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-4698f1b8ef" data-kw="">
<blockquote><p>And because the king being made a king leaves not off to be a reasonable creature, he must be under a law, and so his will and lust cannot be the rule of his power and dominion, but law and reason must regulate him. Now if God had given to the king a dominion over men as reasonable creatures, his power and dominion which by royalists is conceived to be above law, should be a rule to men as reasonable men, which would make men under kings no better than brute beasts, for then should subjects exercise acts of reason, not because good and honest, but because their prince commands them so to do; and if this cannot be said, none can be at the disposing of kings in politic acts liable to royal government, that way that the slave is in his actions under the dominion of his master.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 65 rt col</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-bf33b0c2d9" data-kw="">
<blockquote><p>II. Law is an ordinance of reason, instituted by him who has the care of a community, concerning good things, for the common and particular advantage of some society; teaching what is to be done and what is not, and likewise commanding or forbidding the same, and obligating the rational creature to perform those things by the threatening of punishment and the promise of reward. … XIX. From this distinction of the Mosaic law, judgment is easily made concerning the difference and agreement of these three parts [the moral, ceremonial and judicial laws], both in substance and as to their accidental abrogation. They agree: 1. in author, both principal and ministerial. 2. in general end, namely, the common good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’15th of the Theological Disputations, on the Law of God’</cite>, (Leiden: Patius, 1603), trans. AI at Confessionally Reformed Theology</span></figcaption>

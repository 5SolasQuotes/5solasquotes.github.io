<main class="wrap"><figure class="quote" id="q-84faab4528" data-kw="">
<blockquote><p>And now for you (my Reverend and much Honoured Brethren in the common work of the Ministry,) Who can but bless the Lord, for that degree of his spirit, (no doubt, it is the effect, as of your own prayers in the day of your solemn humiliation, so of many of the prayers of his people) which he hath showered down upon you! Not only do your learned debates, your exact and judicious Scripture-discussions, your Scholastical disputes, the discovery many of you have made of your exact knowledge in Antiquity, shew that God is among you, as he that hath fitted you for the work: but further your sweet amicable converse, your following of the truth in love, your differences in judgement carried on without alienation of affection, do not they all say that God is with you?

God forbid, that either the Devil, or wicked men, should break asunder that sweet bond of Amity, wherewith God hath linked you in one. Be encouraged then (dearly beloved in the Lord) from one whom God was pleased, though the unworthiest among you, yet to make his mouth to you, to go on as carried along with a Spirit of indefatigable zeal in the pursuance of the work you are called unto. Behold it is soul-work, and that of nearest concernment, that God hath put into your hands to be transacted.

Is not your work a Counter-work to that great and long plotted design, whereby Popery should have been re-advanced, God’s saving truth been suppressed, his worship substantially corrupted, and utterly destroyed? Is it not a work of the largest extent, as that which concerns all other Reformed Churches, whose happiness or misery will be involved in ours? Yea, ages to come will either blesse or curse you, as you shall follow or neglect the opportunity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-bowles.html">Oliver Bowles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Zeal for God’s house quickened: or, A sermon preached before the assembly of Lords, Commons, and Divines, at their solemn fast July 7. 1643. In the Abbey Church at Westminster. Expressing the eminency of zeal requisite in church reformers</cite>, (London: Samuel Gellibrand, 1643), epistle dedicatory.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e16d53b188" data-kw="">
<blockquote><p>Testimonies for the Lord are necessary, lovely and singularly useful, when according to the rule: But, when these prescribed bounds are exceeded, and our misguided zeal for a pretended respect to the Lord’s honor hurries to a taxing the commissions of his choicest ambassadors, and trampling such as are eminently beautified with Christ’s image, who can tell how far this gangrene may reach? My heart trembles at the mischiefs which any one unsound and unsafe position does lead to, especially in matters of this nature; and have often admired the judicious observe of a great man, against whom our friends, especially the more exercised, are not much, if at all, prejudiced, viz. ‘He that sheds man’s blood, by man shall his blood be shed; but whoso sheds the blood of Churches, his blood shall be shed by the Lord.’ (These are said to be the words of Mr. Shepherd.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

<blockquote><p>48 Q. Since, then, you say that the additional name “Christ” or “Anointed” implies that He came with the command of the Father to establish a royal priesthood, explain first what the kingdom of Christ is. A. A kingdom is a kind of rule over a people in which one person serves as the head and is exceptionally gifted with wisdom, counsel, and strength, so that his subjects benefit from his wisdom and other gifts and live happily and peacefully under such a head. This helps us to understand what the Kingdom of Christ is: it is a kind of rule over the people of God in which there is one head, namely, Christ the Lord, who is gifted far beyond all angels and people with wisdom, counsel, might, and all other gifts. This head, Christ, rules His subjects even in this life in such a way that He produces eternal salvation in the hearts of all the elect through the preaching of His holy gospel and the power of His Spirit. He does this by incorporating them into Himself by faith and the testimony of holy baptism, by graciously not imputing their sins to them, by daily purifying them from sin, by living in them and ruling their hearts with His Holy Spirit, and by using as means to that end the preaching of the holy gospel, the administration of the holy sacraments, and Christian discipline. This is in order that in this life they might live happily in the Lord, have peace with God, and at last in eternity live and reign with their King. This is the Kingdom of Christ that begins in this life and will increase in the heart of every believer (John 15; Matt. 25; Mark 1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Firm Foundation</cite>, trans. Lyle D. Bierma, Texts and Studies in Reformation and Post-Reformation Thought (Carlisle, United Kingdom; Grand Rapids, MI: Paternoster Press; Baker Books, 1995), 37.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

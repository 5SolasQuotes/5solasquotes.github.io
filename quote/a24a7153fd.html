<main class="wrap"><figure class="quote" id="q-a24a7153fd" data-kw="">
<blockquote><p>LXV. Regarding the unbaptized children of the faithful, there is a real controversy about whether they pertain to the Church. For such infants, according to the Romanists, do not pertain to the Church in any way, while our [Reformed] theologians contend that they follow the condition of their parents and are in God’s covenant and constitute part of the visible Church, at least pertaining to the external communion of the Church, as is particularly evident in the English [Westminster] Confession, ch. 25, and in Bucanus’ work on the Church, in the definition of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church, p. 435 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“LXV. Regarding the unbaptized children of the faithful, there is a real controversy about whether they pertain to the Church. For such infants, according to the Romanists, do not pertain to the Church in any way, while our [Reformed] theologians contend that they follow the condition of their parents and are in God’s covenant and constitute part of the visible Church, at least pertaining to the external communion of the Church, as is particularly evident in the English [Westminster] Confession, ch. 25, and in Bucanus’ work on the Church, in the definition of the Church.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d32d893a76" data-kw="">
<blockquote><p>This title by conquest, through the people’s after consent, may be turned into a just title, as in the case of the Jews in Caesar’s time, for which cause our Savior commanded to obey Caesar, and to pay tribute unto him… 2. Though the consent be some way over-awed [by intimidation], yet is it a sort of contract and covenant of loyal subjection made to the conqueror, and therefore sufficient to make the title just; otherwise, if the people never give their consent, the conqueror, domineering over them by violence, has no just title to the crown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, (Edinburgh: Ogle &amp; Boyd), p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-51a882480b" data-kw="">
<blockquote><p>All infants who, in the judgment of charity, are within the covenant, are to be baptized. And baptism is to be administered exactly according to this judgment of charity. And that judgment concludes all to be within the covenant, whose parents were sometime sealed with the seal of the covenant.</p></blockquote>

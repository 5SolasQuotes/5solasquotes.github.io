<main class="wrap"><figure class="quote" id="q-a8c10b0015" data-kw="">
<blockquote><p>By so doing we by no means establish as the formal cause of our justification that essential righteousness of Christ, which is itself His deity, or the supreme purity and holiness of His humanity, or His sufferings absolutely considered, which ceased together with His earthly life. But we say that the merit of His sufferings (παθημάτων) is the material cause of our justification, which is substituted in place of our guilt, inborn corruption, and all our sins that flow forth from that sewer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defense of Justification through the Righteousness of Christ Alone</cite>, reply to the Anonymous Man’s Third Argument</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/osiander.html">Osiander</a> › <a href="../topics/union-with-christ/osiander/essential-righteousness.html">Essential righteousness</a></span><span class="t"><a href="../topics/justification/formal-cause.html">Formal Cause: Imputation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bc20eafa0b" data-kw="">
<blockquote><p>That is not the essential righteousness of God, as Andreas Osiander contended … And it is not partly composed of Christ’s righteousness and partly of ours, which the sophists invent, whom Calvin refutes in the same chapter. But it is only by the righteousness of Jesus Christ, our Mediator and Savior, as the apostle Paul teaches and confirms in Romans 5:12 and following.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Free Justification of Man the Sinner before God</cite>, section on the righteousness by which we are justified</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/formal-cause.html">Formal Cause: Imputation</a></span><span class="t"><a href="../topics/union-with-christ/osiander.html">Osiander</a> › <a href="../topics/union-with-christ/osiander/essential-righteousness.html">Essential righteousness</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“That is not the essential righteousness of God, as Andreas Osiander contended … And it is not partly composed of Christ’s righteousness and partly of ours, which the sophists invent, whom Calvin refutes in the same chapter. But it is only by the righteousness of Jesus Christ, our Mediator and Savior, as the apostle Paul teaches and confirms in Romans 5:12 and following.”

— Amandus Polanus, The Free Justification of Man the Sinner before God, section on the righteousness by which we are justified">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+is+not+the+essential+righteousness+of+God%2C+as+Andreas+Osiander+contended+%E2%80%A6+And+it+is+not+partly+composed+of+Christ%E2%80%99s+righteousness+and+partly+of+ours%2C+which+the+sophists+invent%2C+whom+Calvin+refutes+in+the+same+chapter.+But+it+is+only+by+the+righteousness+of+Jesus+Christ%2C+our+Mediator+and+Savior%2C+as+the+apostle+Paul+teaches+and+confirms+in+Romans+5%3A12+and+following.%E2%80%9D%0A%0A%E2%80%94+Amandus+Polanus%2C+The+Free+Justification+of+Man+the+Sinner+before+God%2C+section+on+the+righteousness+by+which+we+are+justified&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbc20eafa0b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bc20eafa0b.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-eceb6fae86" data-kw="">
<blockquote><p>For, in the whole of this discussion, the noun righteousness and the verb to justify, are extended by Osiander to two parts; to be justified being not only to be reconciled to God by a free pardon, but also to be made just; and righteousness being not a free imputation, but the holiness and integrity which the divine essence dwelling in us inspires.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/osiander.html">Osiander</a> › <a href="../topics/union-with-christ/osiander/essential-righteousness.html">Essential righteousness</a></span><span class="t"><a href="../topics/justification/justification-and-sanctification-distinguished.html">Justification and Sanctification Distinguished</a> › <a href="../topics/justification/justification-and-sanctification-distinguished/the-confusion-of-the-two.html">The confusion of the two (Rome)</a></span></div>
<div class="actions"><button class="copy" data-copy="“For, in the whole of this discussion, the noun righteousness and the verb to justify, are extended by Osiander to two parts; to be justified being not only to be reconciled to God by a free pardon, but also to be made just; and righteousness being not a free imputation, but the holiness and integrity which the divine essence dwelling in us inspires.”

— John Calvin, Institutes of the Christian Religion, 3.11.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor%2C+in+the+whole+of+this+discussion%2C+the+noun+righteousness+and+the+verb+to+justify%2C+are+extended+by+Osiander+to+two+parts%3B+to+be+justified+being+not+only+to+be+reconciled+to+God+by+a+free+pardon%2C+but+also+to+be+made+just%3B+and+righteousness+being+not+a+free+imputation%2C+but+the+holiness+and+integrity+which+the+divine+essence+dwelling+in+us+inspires.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.11.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feceb6fae86.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eceb6fae86.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-7e72c3035e" data-kw="">
<blockquote><p>In short, every one who, by the entanglement of a twofold righteousness, prevents miserable souls from resting entirely on the mere mercy of God, mocks Christ by putting on him a crown of plaited thorns.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.12</span></figcaption>

</figure><figure class="quote" id="q-4e9b07758c" data-kw="">
<blockquote><p>Osiander&#x27;s objection as to its being inconsistent with the nature of God, falls back upon himself; for though he clothes the saints with a twofold righteousness as with a coat of skins, he is, however, forced to admit, that without forgiveness no man is pleasing to God. If this be so, let him at least admit, that with reference to what is called the proportion of imputation, those are regarded as righteous who are not so in reality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.11</span></figcaption>

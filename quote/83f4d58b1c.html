<blockquote><p>And surely whatsoever ill consequences may appear upon obeying, they appear at more distance, but confusion and destruction come in presently upon disobeying. The commonwealth is presently put unto ungovernment and confusion by inobedience, or into sedition, civil war, yea destruction, by striving against a prevalent power. Therefore as that which has the less ill consequences, not ours only, but generally all nations have given obedience to power; and both sought and received laws and government from those that have overpowered them… And whereas some speak of a time for settlement, they indeed do rather speak for a time of unsettlement; for they will have an unsettlement first, and a settlement after. And whereas like does produce its like, yet they would have an unsettlement to beget a settlement. They would have confusion, distraction, destruction to bring forth order and safety.</p></blockquote>

<blockquote><p>§13. Question 8: May I give money to a judge or justice or court-officer to hire him to do me justice or to keep him from doing me wrong or to avoid persecution? Answer: You may not, in case your cause be bad, give anything to procure injustice against another; no nor speak a word for it nor desire it: This I take as presupposed. You may not give money to procure justice when the law of the land forbids it and when it will do more hurt accidentally to others than good to you: when it will harden men in the sin of bribery and cause them to expect the like from others. But except it be when some such accidental greater hurt does make it evil, it is as lawful as to hire a thief not to kill me; when you cannot have your right by other means, you may part with a smaller matter for a greater. §14. Question 9. But if I make such a contract, may the other lawfully take it of me? Answer: No: for it is now supposed that it is unlawful on his part. §15. Question 10. But if under necessity or force I promise money to a robber or a judge or officer, am I bound to perform it when necessity is over? Answer: You have lost your own propriety by your covenant and therefore must not retain it. But he can acquire no right by his sin; and therefore some say that in point of justice you are not bound to give it him, but to give it to the magistrate for the poor. But yet prudence may tell you of other reasons a fine to give it the man himself, though justice bind you not to it: as in case that else he may be revenged and do you some greater hurt, or some greater hurt is any other way likely to be the consequent, which it is lawful by money to prevent. But many think that you are bound to deliver the money to the thief or officer himself, because it is a lawful thing to do it, though he have no just title to it; and because it was your meaning, or the signification of your words in your covenant with him. And if it were not lawful to do it, it could not be lawful to promise to do it: otherwise your promise is a lie. To this, those of the other opinion say that as a man who is discharged of his promise by him that it was made to is not to be accounted false if he perform it not, so is it as to the thief or officer in question, because he having no right, is to you as the other that has quit his right. And this answer indeed will prove that it is not strict injustice not to pay the money promised: but it will not prove that it is not a lie to make such a promise with an intent of not-performing it, or that it is not a lie to make it with an intent of performing it, and not to do it when you may. Though here a Jesuit will tell you that you may say the words of a promise with an equivocation or mental reservation, to a thief or persecuting magistrate (of which see more in the chapters of lying, vows and perjury). I am therefore of opinion that your promise must be sincerely made and according to the true intent of it, you must offer the money to the thief or officer; except in case the magistrate forbid you, or some greater reason lie against it, which you foresaw not when you made the promise. But the offender is undoubtedly obliged not to take the money. §16. The same determination holds as to all contracts and promises made to such persons who by injurious force constrained us to make them. There is on us an obligation to veracity, though none to them in point of justice, because they have no proper right; nor may they lawfully take our payment or service promised them. And in case that the public good unexpectedly cross our performance, we must not perform it: Such like is the case of conquerors, and those that upon conquest become their vassals or subjects upon unrighteous terms. But still remember, that if it be not only a covenant with man, but a vow to God, which makes him a party, the case is altered, and we remain obliged. §17. Question 11. But may I promise the thief or bribe-taker to conceal his fault? and am I obliged to the performance of such a promise? Answer: This is a promise of omitting that which else would be a duty. It is ordinarily a duty to reveal a thief and bribe-taker that he may be punished. But affirmatives bind not ad semper [to all times]: no act (especially external) is a duty at all times: therefore not this of revealing an offender’s fault. And if it be not always a duty, then it must be none when it is inconsistent with some greater benefit or duty: For when two goods come together, the greater is to be preferred. Therefore in case that you see in just probability that the concealment of the sinner will do more hurt to the commonwealth or the souls of men than the saving of your life is like to do good, you may not promise to conceal him: or if you sinfully promise it, you may not perform it. But in case that your life is likely to be a greater good than the not promising to conceal him, then such a promise is no fault; because the disclosing him is no duty. But to judge rightly of this is a matter of great difficulty. If it be less than life which you save by such a promise, it oft falls out that it is a lesser good than the detecting of the offence. §18. But it will here be said, ‘If I promise not to conceal a robber, I must conceal him nevertheless; for when he has killed me, I cannot reveal him; and I must conceal the bribe-taker, for till I have promised secrecy, I cannot prove him guilty. And he that promises to forbear a particular good action whilst he lives, does yet reserve his life for all other good works: whereas if he die, he will neither do that nor any other.’ But this case is not so easily determined: If Daniel die, he can neither pray nor do any other good on earth. And if he live, he may do much other good though he never pray: and yet he might not promise to give over praying to save his life. I conceive that we must distinguish of duties essential to the outward part of Christianity, or of constant indispensable necessity, and duties which are alterable and belong only to some persons, times and places: Also between the various consequents of omissions. And I conceive that ordinarily a man may promise for the saving of his life that he will forbear a particular alterable duty or relation: as to read such a commentary, to speak with such a minister, to be a magistrate or a minister, etc. in case we have not before bound ourselves never to give over our calling till death: and in case that the good which will follow our forbearance is likely (to a judicious person) to be greater than the evil. But no man may promise to omit such a duty as God has made necessary during life: as not to love God or fear or trust Him: not to worship Him and call upon Him and praise Him: nor to do good to men’s souls or bodies in the general: or not to preach or pray while I am a minister of Christ, or not at all to govern while you are a governor. For all these contradict some former and greater promises or duties. Nor may you omit the smallest duty to save your life at such a time when your death is likely to do more good than your life would do without that one duty. Apply this to the present case.</p></blockquote>

teous+terms.+But+still+remember%2C+that+if+it+be+not+only+a+covenant+with+man%2C+but+a+vow+to+God%2C+which+makes+him+a+party%2C+the+case+is+altered%2C+and+we+remain+obliged.+%C2%A717.+Question+11.+But+may+I+promise+the+thief+or+bribe-taker+to+conceal+his+fault%3F+and+am+I+obliged+to+the+performance+of+such+a+promise%3F+Answer%3A+This+is+a+promise+of+omitting+that+which+else+would+be+a+duty.+It+is+ordinarily+a+duty+to+reveal+a+thief+and+bribe-taker+that+he+may+be+punished.+But+affirmatives+bind+not+ad+semper+%5Bto+all+times%5D%3A+no+act+%28especially+external%29+is+a+duty+at+all+times%3A+therefore+not+this+of+revealing+an+offender%E2%80%99s+fault.+And+if+it+be+not+always+a+duty%2C+then+it+must+be+none+when+it+is+inconsistent+with+some+greater+benefit+or+duty%3A+For+when+two+goods+come+together%2C+the+greater+is+to+be+preferred.+Therefore+in+case+that+you+see+in+just+probability+that+the+concealment+of+the+sinner+will+do+more+hurt+to+the+commonwealth+or+the+souls+of+men+than+the+saving+of+your+life+is+like+to+do+good%2C+you+may+not+promise+to+conceal+him%3A+or+if+you+sinfully+promise+it%2C+you+may+not+perform+it.+But+in+case+that+your+life+is+likely+to+be+a+greater+good+than+the+not+promising+to+conceal+him%2C+then+such+a+promise+is+no+fault%3B+because+the+disclosing+him+is+no+duty.+But+to+judge+rightly+of+this+is+a+matter+of+great+difficulty.+If+it+be+less+than+life+which+you+save+by+such+a+promise%2C+it+oft+falls+out+that+it+is+a+lesser+good+than+the+detecting+of+the+offence.+%C2%A718.+But+it+will+here+be+said%2C+%E2%80%98If+I+promise+not+to+conceal+a+robber%2C+I+must+conceal+him+nevertheless%3B+for+when+he+has+killed+me%2C+I+cannot+reveal+him%3B+and+I+must+conceal+the+bribe-taker%2C+for+till+I+have+promised+secrecy%2C+I+cannot+prove+him+guilty.+And+he+that+promises+to+forbear+a+particular+good+action+whilst+he+lives%2C+does+yet+reserve+his+life+for+all+other+good+works%3A+whereas+if+he+die%2C+he+will+neither+do+that+nor+any+other.%E2%80%99+But+this+case+is+not+so+easily+determined%3A+If+Daniel+die%2C+he+can+neither+pray+nor+do+any+other+good+on+earth.+And+if+he+live%2C+he+may+do+much+other+good+though+he+never+pray%3A+and+yet+he+might+not+promise+to+give+over+praying+to+save+his+life.+I+conceive+that+we+must+distinguish+of+duties+essential+to+the+outward+part+of+Christianity%2C+or+of+constant+indispensable+necessity%2C+and+duties+which+are+alterable+and+belong+only+to+some+persons%2C+times+and+places%3A+Also+between+the+various+consequents+of+omissions.+And+I+conceive+that+ordinarily+a+man+may+promise+for+the+saving+of+his+life+that+he+will+forbear+a+particular+alterable+duty+or+relation%3A+as+to+read+such+a+commentary%2C+to+speak+with+such+a+minister%2C+to+be+a+magistrate+or+a+minister%2C+etc.+in+case+we+have+not+before+bound+ourselves+never+to+give+over+our+calling+till+death%3A+and+in+case+that+the+good+which+will+follow+our+forbearance+is+likely+%28to+a+judicious+person%29+to+be+greater+than+the+evil.+But+no+man+may+promise+to+omit+such+a+duty+as+God+has+made+necessary+during+life%3A+as+not+to+love+God+or+fear+or+trust+Him%3A+not+to+worship+Him+and+call+upon+Him+and+praise+Him%3A+nor+to+do+good+to+men%E2%80%99s+souls+or+bodies+in+the+general%3A+or+not+to+preach+or+pray+while+I+am+a+minister+of+Christ%2C+or+not+at+all+to+govern+while+you+are+a+governor.+For+all+these+contradict+some+former+and+greater+promises+or+duties.+Nor+may+you+omit+the+smallest+duty+to+save+your+life+at+such+a+time+when+your+death+is+likely+to+do+more+good+than+your+life+would+do+without+that+one+duty.+Apply+this+to+the+present+case.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Directory+%28London%2C+1673%29%2C+pt.+4%2C+ch.+19%2C+title+2%2C+p.+116-17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fca12e1cddd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ca12e1cddd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=13.%20Question%208%3A%20May%20I%20give,Apply%20this%20to%20the%20present%20case&amp;text=13.%20Question%208%3A%20May%20I%20give%20money%20to&amp;text=one%20duty.%20Apply%20this%20to%20the%20present%20case" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Upon perusal of Mr. Ascham’s book you left with me, I find not myself in my understanding thereby convinced of the necessity or lawfulness of conforming unto, or complying with an unjust prevailing power further than I was before persuaded. It might be lawful or necessary so to do: viz. as I paying taxes and submitting to some other things (in themselves not unlawful) by 〈1 page missing〉 3. Without any explicit or implicit acknowledgment of the justice and legality of their power: I may submit to the [Greek] (to the force), but not acknowledge the [Greek] (the authority), or by any [of] my voluntary act give strength, assistance or countenance thereunto.

4. Without any prejudice unto the claim of the oppressed party that has a right, title; or casting myself into an incapacity of lending him my due and bounden assistance, if in time to come it may be useful to him towards the recovery of his right.

5. Where I may reasonably and bona fide [with good faith] presume the oppressed power (to whom my obedience is justly due), if he perfectly knew the present condition I am in together with the exigence and necessity of the present case and all of circumstances thereof, would give his willing consent to such my conformity and compliance. So that upon the whole matter and in short, I conceive I may so far submit unto the impositions or comply with the persons of a prevailing usurped power unjustly commanding things not in themselves unlawful, or make use of their power to protect one from other’s injuries, as I may submit unto, comply with or make use of a highway thief or robber when I am fallen into his hands and lie at his mercy. As for Mr. Ascham ‘s discourse, though it be handsomely framed, yet all the strength of it (to my seeming) lie’s upon two principles, which (if he would speak out) would be in plain English these:

1. That self-preservation is the first and chiefest obligation in the world, to which all other bonds and relations (at least between man and man) must give place.

2. That no oath, at least no imposed oath, at what terms soever expressed, binds the taker further than he intended to bind himself thereby; and, it is presumed, that no man intended to bind himself to the prejudice of his own safety. [These are] Two dangerous and desperate principles which evidently tend: 1. to the taking away of all Christian fortitude and suffering in a righteous cause; 2. to the encouraging of daring and ambitious spirits to attempt continual innovations, with this confidence, that if they can by any ways (how unjust soever) possess themselves of the supreme power, they ought to be submitted unto; 3. to the obstructing unto the oppressed party all possible ways and means, without a miracle, of ever recovering that just right of which he shall have been unjustly dispossessed; and (to omit further instancing) 4. to the bringing in of atheism with the contempt of God and all religion, whilst every man, by making his own preservation the measure of all his duties and actions, makes himself thereby his own idol.</p></blockquote>

<blockquote><p>4. Passive obedience to wicked emperors can but be enjoined (Rom. 13) but only in the manner and upon [the] supposition that we must be subject to them and must suffer against our wills all the ill of punishment that they can inflict, we must suffer patiently, and because it is God’s permissive will that they punish us unjustly; For it is not God’s ruling and approving will (called voluntas signi [the will of sign, or his revealed will]) that they should, against the law of God and man kill us and persecute us; and therefore neither Rom. 13, nor 1 Pet. 2, nor any other place in God’s Word, any common divine, natural, national or any municipal law, commands formally obedience passive, or subjection passive, or non-resistance under the notion of passive obedience; Yea, to me, obedience-passive (if we speak of obedience, properly called, as relative essentially to a law) is a chimera, a dream, and repugnantia in adjecto; and therefore I utterly deny that resistance-passive, or subjection-passive, does formally fall under either commandment of God, affirmative or negative; Only the unlawful manner of resistance by way of revenge, or for defense of Popery and false religion, and out of impatient toleration of monarchy or any tyranny, is forbidden in God’s Word; And certainly all the words used [in] Rom. 13, as they fall under a formal commandment of God, are words of action, not of any chimerical passive obedience, as we are not to resist actively God’s ordinance, as his ordinance, (vv. 1-2), that is, to resist God actively. We are to do good works, not evil, if we would have the ruler no terror to us (v. 3). We must not do ill if we would be free of vengeance’s sword (v. 7); we are to pay tribute and to give fear and honor to the ruler, all which are evidently actions, not passive subjection; and if any passive subjection be commanded, it is not here, nor in the First Commandment commanded; but [rather it is] in the First Commandment under the hand of patience and submission under God’s hand in sufferings, or in the Third Commandment under the hand of rather dying for Christ than denying his truth before men. Hence I argue here (Rom. 13; 1 Pet. 2 ; Tit. 3) is nothing else but an exposition of the Fifth Commandment; but in the Fifth Commandment only active obedience is formally commanded, and the subordination of inferiors to superiors is ordained, and passive obedience is nowhere commanded, but only modus rei [the mode of the thing], the manner of suffering, and the occasion of the commandment; …Paul established magistracy and commands obedience in the Lord; and he is more to prove the office of the magistrate to be of God than any other thing (and to show what is his due) than to establish absoluteness in Nero to be of God; yea, to me, every word in the text speaks limitedness of princes, and cries down absoluteness: (1.) No power of God, (2.) no ordinance of God, who is a terror to evil, but a praise to good works, (3.) no minister of God for good, etc. can be a power to which we submit ourselves on earth as next unto God without controlment. That passive obedience falls formally under no commandment of God, I prove thus: All obedience liable to a divine commandment does commend morally the performer of obedience as having a will conformed to God’s moral law; and deformity betwixt the will of him who performs not obedience involves the non-obedient in wrath and guiltiness. But non-passive subjection to the sword of the judge does not morally commend him that suffers not punishment; for no man is formally a sinner against a moral law because he suffers not the ill of punishment, nor is he morally good, or to be commended, because he suffers ill of punishment, but because he does the ill of sin. And all [the] evil of punishment unjustly inflicted has God’s voluntas beneplaciti [the will of good-pleasure, or decree], the instrumental and hidden decree of God, which orders both good and ill (Eph. 1:11) for its rule and cause, and has not God’s will or approbation called, voluntas signi, for its rule: both are contrary to that will. I am sure Epiphanius (1. 1, torn. 3, heres. 40), Basil (in Ps. 32), Nazianzen Orat. (ad subd. et imperat.), Hilarary (li. ad Constant.) and Augustine all cite these words and say the same. If, then, passive subjection be not commanded, non-subjection-passive cannot be forbidden, and this text, Rom. 13 and 1 Pet. 2, cannot a whit help the bad cause of royalists. All then must be reduced to some action of resisting; arguments for passive subjection, though there were ship-fulls of them, they cannot help us.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“4. Passive obedience to wicked emperors can but be enjoined (Rom. 13) but only in the manner and upon [the] supposition that we must be subject to them and must suffer against our wills all the ill of punishment that they can inflict, we must suffer patiently, and because it is God’s permissive will that they punish us unjustly; For it is not God’s ruling and approving will (called voluntas signi [the will of sign, or his revealed will]) that they should, against the law of God and man kill us and persecute us; and therefore neither Rom. 13, nor 1 Pet. 2, nor any other place in God’s Word, any common divine, natural, national or any municipal law, commands formally obedience passive, or subjection passive, or non-resistance under the notion of passive obedience; Yea, to me, obedience-passive (if we speak of obedience, properly called, as relative essentially to a law) is a chimera, a dream, and repugnantia in adjecto; and therefore I utterly deny that resistance-passive, or subjection-passive, does formally fall under either commandment of God, affirmative or negative; Only the unlawful manner of resistance by way of revenge, or for defense of Popery and false religion, and out of impatient toleration of monarchy or any tyranny, is forbidden in God’s Word; And certainly all the words used [in] Rom. 13, as they fall under a formal commandment of God, are words of action, not of any chimerical passive obedience, as we are not to resist actively God’s ordinance, as his ordinance, (vv. 1-2), that is, to resist God actively. We are to do good works, not evil, if we would have the ruler no terror to us (v. 3). We must not do ill if we would be free of vengeance’s sword (v. 7); we are to pay tribute and to give fear and honor to the ruler, all which are evidently actions, not passive subjection; and if any passive subjection be commanded, it is not here, nor in the First Commandment commanded; but [rather it is] in the First Commandment under the hand of patience and submission under God’s hand in sufferings, or in the Third Commandment under the hand of rather dying for Christ than denying his truth before men. Hence I argue here (Rom. 13; 1 Pet. 2 ; Tit. 3) is nothing else but an exposition of the Fifth Commandment; but in the Fifth Commandment only active obedience is formally commanded, and the subordination of inferiors to superiors is ordained, and passive obedience is nowhere commanded, but only modus rei [the mode of the thing], the manner of suffering, and the occasion of the commandment; …Paul established magistracy and commands obedience in the Lord; and he is more to prove the office of the magistrate to be of God than any other thing (and to show what is his due) than to establish absoluteness in Nero to be of God; yea, to me, every word in the text speaks limitedness of princes, and cries down absoluteness: (1.) No power of God, (2.) no ordinance of God, who is a terror to evil, but a praise to good works, (3.) no minister of God for good, etc. can be a power to which we submit ourselves on earth as next unto God without controlment. That passive obedience falls formally under no commandment of God, I prove thus: All obedience liable to a divine commandment does commend morally the performer of obedience as having a will conformed to God’s moral law; and deformity betwixt the will of him who performs not obedience involves the non-obedient in wrath and guiltiness. But non-passive subjection to the sword of the judge does not morally commend him that suffers not punishment; for no man is formally a sinner against a moral law because he suffers not the ill of punishment, nor is he morally good, or to be commended, because he suffers ill of punishment, but because he does the ill of sin. And all [the] evil of punishment unjustly inflicted has God’s voluntas beneplaciti [the will of good-pleasure, or decree], the instrumental and hidden decree of God, which orders both good and ill (Eph. 1:11) for its rule and cause, and has not God’s will or approbation called, voluntas signi, for its rule: both are contrary to that will. I am sure Epiphanius (1. 1, torn. 3, heres. 40), Basil (in Ps. 32), Nazianzen Orat. (ad subd. et imperat.), Hilarary (li. ad Constant.) and Augustine all cite these words and say the same. If, then, passive subjection be not commanded, non-subjection-passive cannot be forbidden, and this text, Rom. 13 and 1 Pet. 2, cannot a whit help the bad cause of royalists. All then must be reduced to some action of resisting; arguments for passive subjection, though there were ship-fulls of them, they cannot help us.”

— Samuel Rutherford, Question 30, ‘Whether or No[t] Passive Obedience be a Mean[s] to which we are Subjected in Conscience by Virtue of a Divine Commandment…’ Summary in Lex Rex (1644), pp. 155 rt. col. – 156">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+Passive+obedience+to+wicked+emperors+can+but+be+enjoined+%28Rom.+13%29+but+only+in+the+manner+and+upon+%5Bthe%5D+supposition+that+we+must+be+subject+to+them+and+must+suffer+against+our+wills+all+the+ill+of+punishment+that+they+can+inflict%2C+we+must+suffer+patiently%2C+and+because+it+is+God%E2%80%99s+permissive+will+that+they+punish+us+unjustly%3B+For+it+is+not+God%E2%80%99s+ruling+and+approving+will+%28called+voluntas+signi+%5Bthe+will+of+sign%2C+or+his+revealed+will%5D%29+that+they+should%2C+against+the+law+of+God+and+man+kill+us+and+persecute+us%3B+and+therefore+neither+Rom.+13%2C+nor+1+Pet.+2%2C+nor+any+other+place+in+God%E2%80%99s+Word%2C+any+common+divine%2C+natural%2C+national+or+any+municipal+law%2C+commands+formally+obedience+passive%2C+or+subjection+passive%2C+or+non-resistance+under+the+notion+of+passive+obedience%3B+Yea%2C+to+me%2C+obedience-passive+%28if+we+speak+of+obedience%2C+properly+called%2C+as+relative+essentially+to+a+law%29+is+a+chimera%2C+a+dream%2C+and+repugnantia+in+adjecto%3B+and+therefore+I+utterly+deny+that+resistance-passive%2C+or+subjection-passive%2C+does+formally+fall+under+either+commandment+of+God%2C+affirmative+or+negative%3B+Only+the+unlawful+manner+of+resistance+by+way+of+revenge%2C+or+for+defense+of+Popery+and+false+religion%2C+and+out+of+impatient+toleration+of+monarchy+or+any+tyranny%2C+is+forbidden+in+God%E2%80%99s+Word%3B+And+certainly+all+the+words+used+%5Bin%5D+Rom.+13%2C+as+they+fall+under+a+formal+commandment+of+God%2C+are+words+of+action%2C+not+of+any+chimerical+passive+obedience%2C+as+we+are+not+to+resist+actively+God%E2%80%99s+ordinance%2C+as+his+ordinance%2C+%28vv.+1-2%29%2C+that+is%2C+to+resist+God+actively.+We+are+to+do+good+works%2C+not+evil%2C+if+we+would+have+the+ruler+no+terror+to+us+%28v.+3%29.+We+must+not+do+ill+if+we+would+be+free+of+vengeance%E2%80%99s+sword+%28v.+7%29%3B+we+are+to+pay+tribute+and+to+give+fear+and+honor+to+the+ruler%2C+all+which+are+evidently+actions%2C+not+passive+subjection%3B+and+if+any+passive+subjection+be+commanded%2C+it+is+not+here%2C+nor+in+the+First+Commandment+commanded%3B+but+%5Brather+it+is%5D+in+the+First+Commandment+under+the+hand+of+patience+and+submission+under+God%E2%80%99s+hand+in+sufferings%2C+or+in+the+Third+Commandment+under+the+hand+of+rather+dying+for+Christ+than+denying+his+truth+before+men.+Hence+I+argue+here+%28Rom.+13%3B+1+Pet.+2+%3B+Tit.+3%29+is+nothing+else+but+an+exposition+of+the+Fifth+Commandment%3B+but+in+the+Fifth+Commandment+only+active+obedience+is+formally+commanded%2C+and+the+subordination+of+inferiors+to+superiors+is+ordained%2C+and+passive+obedience+is+nowhere+commanded%2C+but+only+modus+rei+%5Bthe+mode+of+the+thing%5D%2C+the+manner+of+suffering%2C+and+the+occasion+of+the+commandment%3B+%E2%80%A6Paul+established+magistracy+and+commands+obedience+in+the+Lord%3B+and+he+is+more+to+prove+the+office+of+the+magistrate+to+be+of+God+than+any+other+thing+%28and+to+show+what+is+his+due%29+than+to+establish+absoluteness+in+Nero+to+be+of+God%3B+yea%2C+to+me%2C+every+word+in+the+text+speaks+limitedness+of+princes%2C+and+cries+down+absoluteness%3A+%281.%29+No+power+of+God%2C+%282.%29+no+ordinance+of+God%2C+who+is+a+terror+to+evil%2C+but+a+praise+to+good+works%2C+%283.%29+no+minister+of+God+for+good%2C+etc.+can+be+a+power+to+which+we+submit+ourselves+on+earth+as+next+unto+God+without+controlment.+That+passive+obedience+falls+formally+under+no+commandment+of+God%2C+I+prove+thus%3A+All+obedience+liable+to+a+divine+commandment+does+commend+morally+the+performer+of+obedience+as+having+a+will+conformed+to+God%E2%80%99s+moral+law%3B+and+deformity+betwixt+the+will+of+him+who+performs+not+obedience+involves+the+non-obedient+in+wrath+and+guiltiness.+But+non-passive+subjection+to+the+sword+of+the+judge+does+not+morally+commend+him+that+suffers+not+punishment%3B+for+no+man+is+formally+a+sinner+against+a+moral+law+because+he+suffers+not+the+ill+of+punishment%2C+nor+is+he+morally+good%2C+or+to+be+commended%2C+because+he+suffers+ill+of+punishment%2C+but+because+he+does+the+ill+of+sin.+And+all+%5Bthe%5D+evil+of+punishment+unjustly+inflicted+has+God%E2%80%99s+voluntas+beneplaciti+%5Bthe+will+of+good-pleasure%2C+or+decree%5D%2C+the+instrumental+and+hidden+decree+of+God%2C+which+orders+both+good+and+ill+%28Eph.+1%3A11%29+for+its+rule+and+cause%2C+and+has+not+God%E2%80%99s+will+or+approbation+called%2C+voluntas+signi%2C+for+its+rule%3A+both+are+contrary+to+that+will.+I+am+sure+Epiphanius+%281.+1%2C+torn.+3%2C+heres.+40%29%2C+Basil+%28in+Ps.+32%29%2C+Nazianzen+Orat.+%28ad+subd.+et+imperat.%29%2C+Hilarary+%28li.+ad+Constant.%29+and+Augustine+all+cite+these+words+and+say+the+same.+If%2C+then%2C+passive+subjection+be+not+commanded%2C+non-subjection-passive+cannot+be+forbidden%2C+and+this+text%2C+Rom.+13+and+1+Pet.+2%2C+cannot+a+whit+help+the+bad+cause+of+royalists.+All+then+must+be+reduced+to+some+action+of+resisting%3B+arguments+for+passive+subjection%2C+though+there+were+ship-fulls+of+them%2C+they+cannot+help+us.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Question+30%2C+%E2%80%98Whether+or+No%5Bt%5D+Passive+Obedience+be+a+Mean%5Bs%5D+to+which+we+are+Subjected+in+Conscience+by+Virtue+of+a+Divine+Commandment%E2%80%A6%E2%80%99+Summary+in+Lex+Rex+%281644%29%2C+pp.+155+rt.+col.+%E2%80%93+156&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9aa1a1740a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9aa1a1740a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-passive-obedience/#:~:text=4.%20Passive%20obedience%20to%20wicked%20emperors,of%20them%2C%20they%20cannot%20help%20us&amp;text=4.%20Passive%20obedience%20to%20wicked%20emperors%20can%20but&amp;t

<main class="wrap"><figure class="quote" id="q-d6bb455246" data-kw="">
<blockquote><p>In these commands God speaks to his Church, to his people who had long been his delight; therefore they must have been already regenerate; since, without regeneration no one can see or enter into the kingdom of God. Therefore by these commands God does not mean to bring about regeneration as it denotes the first infusion of the spiritual life, but the drawing forth of that life which is infused by regeneration into the second acts or consequent exercises (which is expressly mentioned in the passage, from whence the first of these commands is quoted) which is done in conversion, that follows upon regeneration, in which man, being drawn, runs after God; being turned, he actively converts and turns himself to God by the power of his grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Regeneration</cite>, … (New Haven, 1770), | section 25, pp. 36-37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9f7b734e4d" data-kw="">
<blockquote><p>But the truth is this, the Lord must let in an influence of some special motion and operation and leave some impression of spiritual power upon the will to enable it to act, not only to concur with the act thereof. God gives a man ability whereby he may will, does not 〈◊〉 with him by assistance and providence when He wills as one in whom we live and move. Of the first of these it’s true which many of the ancients speak, God works without us, many things in us, i.e. unto which we being in no causal ability at all, God gives us ability to do that which is pleasing and spiritual, to the obtaining whereof, we had no causal ability of our own; when the Lord Christ raised Lazarus now dead and smelling in the grave, He did not concur with the action and motion of his soul in rising out of the grave, but without any causal concurrence or help of Lazarus, He put a soul into his body, whereby He was enabled to stir and move. So it is with a soul dead in sins and tresspasses, when the mind and will have no ability for any spiritual act, not able to take off that deadness and indisposition that is there, the Lord without the will, without any causal concurrence of it, lets in ability into it for the work, and concurs with it in the work. So Paul expresses this manner of God’s work, 2 Cor. 4:6, He causes light to shine out of darkness; He gives light and being out of darkness, without the help of light, and then concurs with the light in the shining of it; God lets in an influence to the will, not only lends a concurrence to the work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hooker.html">Thomas Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Application of Redemption by the Effectual Work of the Word &amp; Spirit of Christ for the bringing home of lost sinners to God</cite>, (d. 1647; London: Cole, 1656), bk. 10, pp. 387-88</span></figcaption>

</figure><figure class="quote" id="q-bbc82a597e" data-kw="">
<blockquote><p>2dly, Regeneration does not only show the wide difference between the two states, the regenerate and unregenerate; but it comes in a different manner upon the regenerate themselves. I say a different manner; for there is no difference in the nature of the thing itself, that is the same in substance, essence, and principle in all who are regenerate: yet there are some circumstances attending regeneration sometimes, wherein one regenerate person may greatly differ from another, even in the first moment of regeneration, e.g. some may be regenerated and converted into higher degrees of grace in the first moment of their conversion, than some others (though as truly regenerate as they) may attain to all their days; all in regeneration do receive one and the same spirit of grace, but not in the same measure. Paul was converted into an eminency in grace; he was never a babe in Christ, but was born a strong man in Christ the very first moment of his conversion. God had present use of Paul; he had designed him for eminent service, which he was immediately to enter upon, and therefore God furnishes him accordingly.</p></blockquote>

</figure><figure class="quote" id="q-672d41dcda" data-kw="">
<blockquote><p>This former doctrine is of great use. In that the new birth and regeneration of a sinner is not without the motion of his own will, we are taught that we must, if we desire our own salvation, use the good means and strive against our own corruptions and endeavour earnestly by asking, seeking, knocking. It will be said that faith, repentance and the rest, are all gifts of God. I answer, there is no virtue or gift of God in us, without our wills: and in every good act, God’s grace and man’s will concur: God’s grace as the principal cause: man’s will renewed as the instrument of God. And therefore in all good things industry and labour, and invocation on our parts is required. Secondly, this doctrine ministers true comfort to all true servants of God. For, if when they use the good means of salvation, the Word, prayer, sacraments, the will lie not dead but begin to oppose itself against unbelief and other corruptions, and withal do but so much as will to believe, will to repent, will to be turned to God, they have begun to turn unto God, and God has begun to regenerate them, so be it this will in them to do the good they ought to do be in good earnest unfeigned and they withal be careful to cherish this little grain till it come to a bigger quantity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Free Grace &amp; Man’s Free Will</cite>, (Cambridge, 1601), pp. 129-30</span></figcaption>

<blockquote><p>In one word, then, by repentance I understand regeneration, the only aim of which is to form in us anew the image of God, which was sullied, and all but effaced by the transgression of Adam. So the apostle teaches when he says, ‘We all with open face beholding as in a glass the glory of the Lord, are changed into the same image from glory to glory, as by the Spirit of the Lord.’ Again, ‘Be renewed in the spirit of your mind,’ and ‘put ye on the new man, which after God is created in righteousness and true holiness.’ Again, ‘Put ye on the new man, which is renewed in knowledge after the image of him that created him.’ Accordingly, through the blessing of Christ we are renewed by that regeneration into the righteousness of God from which we had fallen through Adam, the Lord being pleased in this manner to restore the integrity of all whom He appoints to the inheritance of life. This renewal, indeed, is not accomplished in a moment, a day, or a year, but by uninterrupted, sometimes even by slow, progress God abolishes the remains of carnal corruption in his elect, cleanses them from pollution, and consecrates them as his temples, restoring all their inclinations to real purity, so that during their whole lives they may practise repentance, and know that death is the only termination to this warfare.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3. ‘Regeneration by Faith…’ in Institutes of the Christian Religion tr. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 2, bk. 3, pp. 149-82, pp. 159-60</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>
<div class="actions"><button class="copy" data-copy="“In one word, then, by repentance I understand regeneration, the only aim of which is to form in us anew the image of God, which was sullied, and all but effaced by the transgression of Adam. So the apostle teaches when he says, ‘We all with open face beholding as in a glass the glory of the Lord, are changed into the same image from glory to glory, as by the Spirit of the Lord.’ Again, ‘Be renewed in the spirit of your mind,’ and ‘put ye on the new man, which after God is created in righteousness and true holiness.’ Again, ‘Put ye on the new man, which is renewed in knowledge after the image of him that created him.’ Accordingly, through the blessing of Christ we are renewed by that regeneration into the righteousness of God from which we had fallen through Adam, the Lord being pleased in this manner to restore the integrity of all whom He appoints to the inheritance of life. This renewal, indeed, is not accomplished in a moment, a day, or a year, but by uninterrupted, sometimes even by slow, progress God abolishes the remains of carnal corruption in his elect, cleanses them from pollution, and consecrates them as his temples, restoring all their inclinations to real purity, so that during their whole lives they may practise repentance, and know that death is the only termination to this warfare.”

— John Calvin, 3. ‘Regeneration by Faith…’ in Institutes of the Christian Religion tr. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 2, bk. 3, pp. 149-82, pp. 159-60">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+one+word%2C+then%2C+by+repentance+I+understand+regeneration%2C+the+only+aim+of+which+is+to+form+in+us+anew+the+image+of+God%2C+which+was+sullied%2C+and+all+but+effaced+by+the+transgression+of+Adam.+So+the+apostle+teaches+when+he+says%2C+%E2%80%98We+all+with+open+face+beholding+as+in+a+glass+the+glory+of+the+Lord%2C+are+changed+into+the+same+image+from+glory+to+glory%2C+as+by+the+Spirit+of+the+Lord.%E2%80%99+Again%2C+%E2%80%98Be+renewed+in+the+spirit+of+your+mind%2C%E2%80%99+and+%E2%80%98put+ye+on+the+new+man%2C+which+after+God+is+created+in+righteousness+and+true+holiness.%E2%80%99+Again%2C+%E2%80%98Put+ye+on+the+new+man%2C+which+is+renewed+in+knowledge+after+the+image+of+him+that+created+him.%E2%80%99+Accordingly%2C+through+the+blessing+of+Christ+we+are+renewed+by+that+regeneration+into+the+righteousness+of+God+from+which+we+had+fallen+through+Adam%2C+the+Lord+being+pleased+in+this+manner+to+restore+the+integrity+of+all+whom+He+appoints+to+the+inheritance+of+life.+This+renewal%2C+indeed%2C+is+not+accomplished+in+a+moment%2C+a+day%2C+or+a+year%2C+but+by+uninterrupted%2C+sometimes+even+by+slow%2C+progress+God+abolishes+the+remains+of+carnal+corruption+in+his+elect%2C+cleanses+them+from+pollution%2C+and+consecrates+them+as+his+temples%2C+restoring+all+their+inclinations+to+real+purity%2C+so+that+during+their+whole+lives+they+may+practise+repentance%2C+and+know+that+death+is+the+only+termination+to+this+warfare.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+3.+%E2%80%98Regeneration+by+Faith%E2%80%A6%E2%80%99+in+Institutes+of+the+Christian+Religion+tr.+Henry+Beveridge+%281559%3B+Edinburgh%3A+Calvin+Translation+Society%2C+1845%29%2C+vol.+2%2C+bk.+3%2C+pp.+149-82%2C+pp.+159-60&amp;url=https%3A%2F%2F5solasquote

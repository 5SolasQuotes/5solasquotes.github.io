<main class="wrap"><figure class="quote" id="q-8391dbfc1d" data-kw="">
<blockquote><p>Therefore, thou alone, O Lord, art what thou art; and thou art he who thou art. For, what is one thing in the whole and another in the parts, and in which there is any mutable element, is not altogether what it is… But thou art what thou art, because, whatever thou are at any time, or in any way, thou art as a whole and forever. And thou art he who thou art, properly and simply… thou are all-sufficient to thyself, and needest none; and thou art he whom all things need for their existence and well-being.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anselm.html">Anselm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Proslogium, or ‘Discourse’ on the Existence of God ToC in St. Anselm: Proslogium; Monologium; an Appendix in behalf of the Fool by Gaunilon</cite>, … tr. Sidney N. Deane (Chicago: Open Court Publishing Co., 1903), pp. 1-34, ch. 22, pp. 27-28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6e98fe4148" data-kw="">
<blockquote><p>Another argument in support of this conclusion is adduced by Damascene (On the Orthodox Faith 1, 3) from the government of things, and the same reasoning is indicated by the Commentator in 2 Physics. It runs as follows: It is impossible for contrary and discordant things to accord in one order always or frequently except by someone’s governance, through which each and all are made to tend to a definite end. Now we see that in the world things of different natures accord in one order, not seldom and fortuitously, but always or for the most part. Therefore, it follows that there is someone by whose providence the world is governed. And this we call God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1, ch. 13, ‘Arguments in Proof of God’s Existence’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><figure class="quote" id="q-84833c67e1" data-kw="">
<blockquote><p>I answer that, The existence of God can be proved in five ways… The fourth way is taken from the gradation to be found in things. Among beings there are some more and some less good, true, noble and the like. But more and less are predicated of different things, according as they resemble in their different ways something which is the maximum, as a thing is said to be hotter according as it more nearly resembles that which is hottest; so that there is something which is truest, something best, something noblest and, consequently, something which is uttermost being; for those things that are greatest in truth are greatest in being, as it is written [by Aristotle] in Metaphysics, 2[.1]. Now the maximum in any genus is the cause of all in that genus; as fire, which is the maximum heat, is the cause of all hot things. Therefore there must also be something which is to all beings the cause of their being, goodness, and every other perfection; and this we call God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, q. 2, article 3, ‘Whether God Exists’, ‘I answer that’</span></figcaption>

</figure><figure class="quote" id="q-32ede09fa4" data-kw="atheism Psalm 14">
<blockquote><p>The fool hath said in his heart, There is no God. The psalmist first declares the corruption of the faculties of the soul: “The fool hath said in his heart.” Secondly, the streams issuing from thence, “they are corrupt”; the first in atheistical principles, the other in unworthy practices; and lays all the evil upon the neglects of God, and the atheism cherished in their hearts.</p></blockquote>

</figure><figure class="quote" id="q-dcb915623b" data-kw="">
<blockquote><p>When we say that God has communicated the knowledge of Himself to mankind by the light of nature, we are not to be understood, which was observed before, as if we could attain to that knowledge, without any pains or industry of our own, and let us conduct ourselves in whatsoever manner we please. We only designed to say that the supreme Being has so formed us and arranged his works in such a beatiful order, that if we make a proper use of our reason, and contemplate the astonishing works of Deity with due attention, we must necessarily be led to the knowledge of our Creator, and learn the duties we owe to Him. But if we will be perfectly inattentive and careless in tracing out and investigating the evidences of our divine original, we must be altogether in the dark and ignorant with repsect to them. Thus, althought God has placed the glorious luminary the sun in the firmament to enlighten mankind, those who indulge themselves in sleep, who shut their eyes, or cover them with a veil, can reap no advantage from this blessing of nature. And indeed such was the unhappiness, I should rather say, the negligence, the stupidity, the corruption of mankind, that the sentiments of the Deity deducible from the light of nature, even from the remotest ages, were obscured to an astonishing degree in almost every nation. Some few glimmerings of them remained, but nothing more. In the place of one true God the Creator of Heaven and earth, they formed to themsevles imaginary divinities incredible in number… It is said that some among them altogether denied the existence of the supreme Being, which Tully affirms was the case with respect to Diagoras, Melius and Theodorus of Cyrene.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Natural Theology</cite>, tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General, pp. 18-20</span></figcaption>

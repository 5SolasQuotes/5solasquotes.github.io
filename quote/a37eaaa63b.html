<main class="wrap"><figure class="quote" id="q-a37eaaa63b" data-kw="">
<blockquote><p>The persons of the Trinity, as co-eternal, are temporally inseparable; similarly, as metaphysically necessary they are metaphysically inseparable. By contrast, the statue and clay are clearly separable: one can exist without the other. The clay is typically made before a statue… As a result, three persons of the Trinity are more strongly united than the statue and the clay, and hence mutual parthood is not sufficient to account for this unity. This is something of a drawback for the model, as perichoresis is typically intended to function as a means of uniting the persons of the Trinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-j-cotnoir.html">A.J. Cotnoir</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Mutual Indwelling’</cite>, (n.d.) 34 pp. | Cotnoir also illustrates a way in which the statue and clay analogy does not do adequate justice to perichoresis (p. 24):</span></figcaption>

<blockquote><p>In the unity of the Godhead there be three persons, of one substance, power, and eternity: God the Father, God the Son, and God the Holy Ghost: the Father is of none, neither begotten, nor proceeding; the Son is eternally begotten of the Father; the Holy Ghost eternally proceeding from the Father and the Son.</p></blockquote>

</figure><figure class="quote" id="q-2dd84b7c30" data-kw="">
<blockquote><p>XX… For the Father is called God [in Col. 1:2] by way of distinction, not in an absolute sense, but in terms of order, because He is the first person of the Godhead who begot the Son from Himself, as the source and principle of the Deity. This is known as the simple essence of the divine unity, which cannot be conceived unless it begins from the Father. The mention of ‘our Lord Jesus Christ’ is expressly added to the Father, both for the purpose of distinction because He is the Mediator, and to refute the Arians, both the ancient and recent ones, who wrongly deduce from this passage of Paul that the name of God belongs exclusively and properly to the Father alone. It is certain that it is used relatively here because the mention of our Lord Jesus Christ is explicitly joined to the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians</cite>, (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

</figure><figure class="quote" id="q-bfcb5415d6" data-kw="">
<blockquote><p>Helpful history of key figures and moves.” – Mark Jones . On the Medieval Church Articles Muller, Richard – pt. 1, ch. 1, ‘The Doctrine of the Trinity in the Christian Tradition: the Medieval Backgroun’ ToC in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725, vol. 4, The Triunity of God 2nd ed. (Baker Books, 2003), pp. 17-59 Butner, D. Glenn – ‘For &amp; Against [Theodore] de Regnon: Trinitarianism East &amp; West’ (2015) 13 pp. Abstract: “Modern systematic theologians frequently claim that Eastern trinitarianism begins with the persons while Western trinitarianism begins with the divine essence, and fails to truly differentiate the persons. This article explores the origins of this claim in the writing of Theodore de Régnon [1831-1893], noting recent criticism of his paradigm’s applicability to the patristic era. In response to these criticisms, I argue ﬁrst for the limited validity of the de Régnon paradigm by demonstrating its applicability in the Carolingian–Photian dispute surrounding the ﬁlioque. I then argue against the deployment of the paradigm as a controlling schema in systematic theology by pointing to problems this narrative has created in the theology of Robert Jenson and John Zizioulas.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/khaled-anatolios.html">Khaled Anatolios</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Retrieving Nicaea</cite>, pp. ToC</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c3fded103" data-kw="">
<blockquote><p>Every presumptuous sin in the text [that] was cited in Moses, was a sin unto death, in the sense that the Jewish nation understood a sin unto death, viz. that brought to an immediate liableness to cutting off by divine vengeance. Now this was a sin of presumption, and despising the Word of God, as Moses explains what that presumptuous sinning is… But why does not this our apostle speak out, and say, ‘I say he should not pray for it,’ but says only, ‘I do not say that he should.’… He [John] takes care of the consciences of the people of God as well as he shows the two conditions of the sinner he speaks of. There were some that might be in a strait what to do in this case. They were commanded by their Lord and Master to pray for their enemies: these enemies of theirs were become so like their father the Devil that it might pose their consciences whether they should pray for them or no. Therefore this divine apostle uses a happy temper: that he will lay no charge on them, that are so pinched, to pray for them: nor indeed forbid those to pray for them that are more enlarged: for undoubtedly the indifferent expression of the apostle as I may call it, seems plainly to carry with it such a consideration…</p></blockquote>

<blockquote><p>[After quoting Mt. 12:31-32] For in reality there is no difference between the sin from which one is never granted truly to repent— for which no sacrifice remains, but only certain and severe vengeance, and which will never be forgiven— and that which is, and is called, ‘unto death.’ In this view not only have the greatest of our theologians gone before, but many others also, both of the ancients and of the Papists, who, however, have expressed their opinion less fully by various phrases, indeed interpreting somewhat differently the blasphemy against the Holy Spirit, and trying to distinguish this sin just as much as the one Paul [in Hebrews] describes from it.</p></blockquote>

<blockquote><p>(7.) In reference to God as the governor of the world and to his justice in the administration of his government, sins are distinguished into those which call for vengeance from God even in the present life, and into those which God in the exercise of his long-suffering bears, and which he does not punish except in the life to come. The former are so heinous in their character that He cannot extend towards them his forbearance in this world. And hence they are called clamant or crying sins because they as it were call alone for the infliction of the divine vengeance. Some of these are recorded in Scripture. The blood of Abel is represented as crying unto God from the ground, Gen. 4:10. So is th sin of Sodom and Gomorrah, Gen. 18:20-21; the oppression by the Egyptians of the children of Israel, Ex. 3:9; the covetousness of the Chaldeans, Hab. 2:11; and the fraud of those who kept back the hire of their laborers, James 5:4. Among these crying sins may be ranked also those which are committed insolently in the face of a well-known law, and which God will not forgive,Num. 15:30. To the same class belongs that sin which an apostle calls ‘a sin unto death,’ (1 Jn. 5:16). This seems to be plain from the context in which he does not desire us to pray for the forgiveness of such a sin in this life, seeing that God is wont to make a signal display of his vengeance against it even here.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“(7.) In reference to God as the governor of the world and to his justice in the administration of his government, sins are distinguished into those which call for vengeance from God even in the present life, and into those which God in the exercise of his long-suffering bears, and which he does not punish except in the life to come. The former are so heinous in their character that He cannot extend towards them his forbearance in this world. And hence they are called clamant or crying sins because they as it were call alone for the infliction of the divine vengeance. Some of these are recorded in Scripture. The blood of Abel is represented as crying unto God from the ground, Gen. 4:10. So is th sin of Sodom and Gomorrah, Gen. 18:20-21; the oppression by the Egyptians of the children of Israel, Ex. 3:9; the covetousness of the Chaldeans, Hab. 2:11; and the fraud of those who kept back the hire of their laborers, James 5:4. Among these crying sins may be ranked also those which are committed insolently in the face of a well-known law, and which God will not forgive,Num. 15:30. To the same class belongs that sin which an apostle calls ‘a sin unto death,’ (1 Jn. 5:16). This seems to be plain from the context in which he does not desire us to pray for the forgiveness of such a sin in this life, seeing that God is wont to make a signal display of his vengeance against it even here.”

— Herman Venema, Translation of Hermann Venema’s inedited Institutes of Theology tr. Alexander W. Brown (d. 1787; Edinburgh: T&amp;T Clark, 1850), ch. 30, sect. 7, p. 505">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%287.%29+In+reference+to+God+as+the+governor+of+the+world+and+to+his+justice+in+the+administration+of+his+government%2C+sins+are+distinguished+into+those+which+call+for+vengeance+from+God+even+in+the+present+life%2C+and+into+those+which+God+in+the+exercise+of+his+long-suffering+bears%2C+and+which+he+does+not+punish+except+in+the+life+to+come.+The+former+are+so+heinous+in+their+character+that+He+cannot+extend+towards+them+his+forbearance+in+this+world.+And+hence+they+are+called+clamant+or+crying+sins+because+they+as+it+were+call+alone+for+the+infliction+of+the+divine+vengeance.+Some+of+these+are+recorded+in+Scripture.+The+blood+of+Abel+is+represented+as+crying+unto+God+from+the+ground%2C+Gen.+4%3A10.+So+is+th+sin+of+Sodom+and+Gomorrah%2C+Gen.+18%3A20-21%3B+the+oppression+by+the+Egyptians+of+the+children+of+Israel%2C+Ex.+3%3A9%3B+the+covetousness+of+the+Chaldeans%2C+Hab.+2%3A11%3B+and+the+fraud+of+those+who+kept+back+the+hire+of+their+laborers%2C+James+5%3A4.+Among+these+crying+sins+may+be+ranked+also+those+which+are+committed+insolently+in+the+face+of+a+well-known+law%2C+and+which+God+will+not+forgive%2CNum.+15%3A30.+To+the+same+class+belongs+that+sin+which+an+apostle+calls+%E2%80%98a+sin+unto+death%2C%E2%80%99+%281+Jn.+5%3A16%29.+This+seems+to+be+plain+from+the+context+in+which+he+does+not+desire+us+to+pray+for+the+forgiveness+of+such+a+sin+in+this+life%2C+seeing+that+God+is+wont+to+make+a+signal+display+of+his+vengeance+against+it+even+here.%E2%80%9D%0A%0A%E2%80%94+Herman+Venema%2C+Translation+of+Hermann+Venema%E2%80%99s+inedited+Institutes+of+Theology+tr.+Alexander+W.+Brown+%28d.+1787%3B+Edinburgh%3A+T%26T+Clark%2C+1850%29%2C+ch.+30%2C+sect.+7%2C+p.+505&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc7fe390fd0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c7fe390fd0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-not-praying-for-the-one-who-has-sinned-unto-death-1-jn-516-17/#:~:text=7.%29%20In%20reference%20to%20God%20as,his%20vengeance%20against%20it%20even%20here&amp;text=7.%29%20In%20reference%20to%20God%20as%20the%20governor&amp;text=display%20of%20his%20vengeance%20against%20it%20even%20here" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-41308f88c5" data-kw="">
<blockquote><p>John does not, indeed, wish us to be rash in judging who has committed such a sin; rather, he the more inflames us to pray for all, because it is not easy to say of whom God is unwilling to forgive. But this sin is without doubt the hatred of the gospel on account of lusts, after someone has heard it, been convinced of its truth, and even rejoiced because of that hearing. John does not reproach compassion toward those who perish, but he wishes the godly finally to rest content with the judgments of God, and not to grieve and labor in vain. Yet he does not wish them to desist from praying, until that bitter root of an evil conscience—blessing itself, opposing the truth of the gospel, and attempting to drag back those who have been delivered into bondage—has manifested itself.</p></blockquote>

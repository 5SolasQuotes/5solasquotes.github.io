<main class="wrap"><figure class="quote" id="q-a1be15d456" data-kw="">
<blockquote><p>That such grace cannot be obtained either ex condigno or ex congruo by the merits of works done by the powers of free will alone, we taught against the Pelagians in Book 5 of De Gratia et Libero Arbitrio. Again, that the same grace cannot be obtained ex condigno, but only ex congruo, by the merits of works proceeding from faith and the special help of God, we taught in Book 1 of De Justificatione, chapter 21. … Finally, that a just man can merit ex condigno an increase of righteousness, the Council of Trent teaches, Session 6, canon 32.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.21 (translated from the Latin)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ee8450474" data-kw="">
<blockquote><p>If any one saith, that the good works of one that is justified are in such manner the gifts of God, as that they are not also the good merits of him that is justified; or, that the said justified, by the good works which he performs through the grace of God and the merit of Jesus Christ, whose living member he is, does not truly merit increase of grace, eternal life, and the attainment of that eternal life,-if so be, however, that he depart in grace,-and also an increase of glory; let him be anathema.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/council-of-trent.html">Council of Trent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Decree on Justification</cite>, sess. 6, can. 32</span></figcaption>

— Council of Trent, Decree on Justification, sess. 6, can. 32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf%20any%20one%20saith%2C%20that%20the%20good%20works%20of%20one%20that%20is%20justified%20are%20in%20such%20manner%20the%20gifts%20of%20God%2C%20as%20that%20they%20are%20not%20also%20the%20good%20merits%20of%20him%20that%20is%20justified%3B%20or%2C%20that%20the%20said%20justified%2C%20by%20the%20good%20works%20which%20he%20performs%20through%20the%20grace%20of%20God%20and%20the%20merit%20of%20Jesus%20Christ%2C%20whose%20living%20member%20he%20is%2C%20does%20not%20truly%20merit%20increase%20of%20grace%2C%20eternal%20life%2C%20and%20the%20attainment%20of%20that%20eternal%20life%2C-if%20so%20be%2C%20however%2C%20that%20he%20depart%20in%20grace%2C-and%20also%20an%20increase%20of%20glory%3B%20let%20him%20be%20anathema.%E2%80%9D%0A%0A%E2%80%94%20Council%20of%20Trent%2C%20Decree%20on%20Justification%2C%20sess.%206%2C%20can.%2032&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7ee8450474.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7ee8450474.html">Permalink</a><a class="src" href="https://history.hanover.edu/texts/trent/ct06.html" rel="noopener" target="_blank">Read it online · Hanover Historical Texts</a></div>
</figure><figure class="quote" id="q-1be46483e7" data-kw="">
<blockquote><p>From an ethical point of view the difference practically amounts to this that, if the reward due to condign merit be withheld, there is a violation of right and justice and the consequent obligation in conscience to make restitution, while, in the case of congruous merit, to withhold the reward involves no violation of right and no obligation to restore, it being merely an offence against what is fitting or a matter of personal discrimination (acceptio personarum). Hence the reward of congruous merit always depends in great measure on the kindness and liberality of the giver, though not purely and simply on his good will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“From an ethical point of view the difference practically amounts to this that, if the reward due to condign merit be withheld, there is a violation of right and justice and the consequent obligation in conscience to make restitution, while, in the case of congruous merit, to withhold the reward involves no violation of right and no obligation to restore, it being merely an offence against what is fitting or a matter of personal discrimination (acceptio personarum). Hence the reward of congruous merit always depends in great measure on the kindness and liberality of the giver, though not purely and simply on his good will.”

— Joseph Pohle, The Catholic Encyclopedia, s.v. “Merit” (1911)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrom%20an%20ethical%20point%20of%20view%20the%20difference%20practically%20amounts%20to%20this%20that%2C%20if%20the%20reward%20due%20to%20condign%20merit%20be%20withheld%2C%20there%20is%20a%20violation%20of%20right%20and%20justice%20and%20the%20consequent%20obligation%20in%20conscience%20to%20make%20restitution%2C%20while%2C%20in%20the%20case%20of%20congruous%20merit%2C%20to%20withhold%20the%20reward%20involves%20no%20violation%20of%20right%20and%20no%20obligation%20to%20restore%2C%20it%20being%20merely%20an%20offence%20against%20what%20is%20fitting%20or%20a%20matter%20of%20personal%20discrimination%20%28acceptio%20personarum%29.%20Hence%20the%20reward%20of%20congruous%20merit%20always%20depends%20in%20great%20measure%20on%20the%20kindness%20and%20liberality%20of%20the%20giver%2C%20though%20not%20purely%20and%20simply%20on%20his%20good%20will.%E2%80%9D%0A%0A%E2%80%94%20Joseph%20Pohle%2C%20The%20Catholic%20Encyclopedia%2C%20s.v.%20%E2%80%9CMerit%E2%80%9D%20%281911%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1be46483e7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1be46483e7.html">Permalink</a><a class="src" href="https://www.newadvent.org/cathen/10202b.htm" rel="noopener" target="_blank">Read it online · New Advent</a></div>
</figure><figure class="quote" id="q-289bf00ef4" data-kw="">
<blockquote><p>By his good works the just man may merit for himself many graces and favours, not, however, by right and justice (de condigno), but only congruously (de congruo). Most theologians incline to the opinion that the grace of final perseverance is among the objects of congruous merit, which grace, as has been shown above, is not and cannot be merited condignly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-congruity.html">Merit of congruity (de congruo)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>
<div class="actions"><button class="copy" data-copy="“By his good works the just man may merit for himself many graces and favours, not, however, by right and justice (de condigno), but only congruously (de congruo). Most theologians incline to the opinion that the grace of final perseverance is among the objects of congruous merit, which grace, as has been shown above, is not and cannot be merited condignly.”

— Joseph Pohle, The Catholic Encyclopedia, s.v. “Merit” (1911)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy%20his%20good%20works%20the%20just%20man%20may%20merit%20for%20himself%20many%20graces%20and%20favours%2C%20not%2C%20however%2C%20by%20right%20and%20justice%20%28de%20condigno%29%2C%20but%20only%20congruously%20%28de%20congruo%29.%20Most%20theologians%20incline%20to%20the%20opinion%20that%20the%20grace%20of%20final%20perseverance%20is%20among%20the%20objects%20of%20congruous%20merit%2C%20which%20grace%2C%20as%20has%20been%20shown%20above%2C%20is%20not%20and%20cannot%20be%20merited%20condignly.%E2%80%9D%0A%0A%E2%80%94%20Joseph%20Pohle%2C%20The%20Catholic%20Encyclopedia%2C%20s.v.%20%E2%80%9CMerit%E2%80%9D%20%281911%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F289bf00ef4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/289bf00ef4.html">Permalink</a><a class="src" href="https://www.newadvent.org/cathen/10202b.htm" rel="noopener" target="_blank">Read it online · New Advent</a></div>
</figure><figure class="quote" id="q-9696a1ee04" data-kw="">
<blockquote><p>Our works are meritorious from two causes: first, by virtue of the Divine motion; and thus we merit condignly; secondly, according as they proceed from free-will in so far as we do them willingly, and thus they have congruous merit, since it is congruous that when a man makes good use of his power God should by His super-excellent power work still higher things. And therefore it is clear that no one can merit condignly for another his first grace, save Christ alone. … But one may merit the first grace for another congruously; because a man in grace fulfils God&#x27;s will, and it is congruous and in harmony with friendship that God should fulfil man&#x27;s desire for the salvation of another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae</cite>, I-II, q. 114, a. 6</span></figcaption>

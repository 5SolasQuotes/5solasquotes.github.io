<blockquote><p>…the reasons of our prefixing the Preface were these:… 2. That we may not be thought to go on their grounds that take our churches for no churches before an express covenant [be made by the members], superadded to all former signs of consent; or that we may not be judged to go about the gathering of new churches where were none before; when indeed we do all this but in reformation of those that are churches already.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653) | ‘A Brief Explication of some Passages in the Profession’, p. 17</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fdd471083f" data-kw="">
<blockquote><p>I confess there might be in some towns no greater number of Christians than did meet together in one place, notwithstanding whereof the pastor or pastors and elders of that congregation, might and did manage the government of the same, and exercise jurisdiction therein. I confess also that in those cities wherein there was a greater number of Christians than could meet together into one place for the worship of God, the presbytery did consist of the pastors and elders within such a city: For it cannot be proved that there were at that time any Christian congregations in landward villages (the persecution forcing Christians to choose the shelter of cities, for which reason many are of opinion that the infidels in those days were called pagani, because they alone dwelt in pagis [districts]) and if there had been any such adjacent to cities, we must think the same should have been subject to the common presbytery, their own pastors and elders being a part thereof. Howsoever it cannot be called in question that the presbytery in the apostolic Churches was made up of as many as could conveniently meet together, for managing the ordinary matters of jurisdiction and Church-government. The pastors and elders of diverse cities could not conveniently have such ordinary meetings, especially in the time of persecution; only the pastors and elders within one city had such conveniency. And so to conclude, we do not forsake, but follow the patern, when we join together a number of pastors and elders out of the congregations in a convenient circuit, to make up a common presbytery, which has power and authority to govern those congregations; for if the presbytery which we find in those cities wherein the apostles planted churches, be a sure pattern for our classical presbyteries (as we have proved it to be)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, ... (Edinburgh: 1641), pt. 2, ch. 3, pp. 146-47</span></figcaption>

</figure><figure class="quote" id="q-98a386b464" data-kw="">
<blockquote><p>Reason 12. Those (moderate men) that are most against Church-covenantings, speak only against the necessity of them; but the lawfulness they deny not, no nor the convenience in case of liberty; no nor the necessity of the thing, but only of the circumstantials and manner of expression, and ends by some affixed. They require that the people expressly consent to the choice of their minister, and that they be examined before the sacrament of their knowledge in the fundamentals. This differs from what we propound but in circumstances. And I should think it more seasonable and convenient to be satisfied of our people’s spiritual sufficiency and capacity for Church-communion at our first reformation of a disordered Church, or in a well-ordered Church, at their first transition out of the state of imperfect, infant members, and admission into the number of adult members (and after this, to suppose their right good to communion and Church privileges, till it be on sufficient grounds disproved, excepted against or questioned by any) than to try them as only for admission to the Lord’s Supper, suffering them to live quietly in the reputation of members, [even] so [when] they will not come to the Table of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653) | ‘An Explication of some Passages in the foregoing Propositions’, p. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-10e7eb0cf1" data-kw="">
<blockquote><p>It is uncharitable, and against the Word, to teach that when a church is dissolved, by no sin and scandal-visible, but by persecution or pestilence, that the dissolved members, though both real and visible converts, have no right to the ordinances: for if the formal cause, to wit, their confederacy into one visible body, as Mr. [Thomas] Hooker [a congregationalist] says, be removed, their visible and external right is removed. The like is to be said of visible professors, and of members of another congregation, and known godly sojourners [travelers]; these Mr. Hooker [by implication] excommunicates for no scandal, visible and invisible: for impossible it is that they can meet together in one place with their own church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 1 | ch. 19, ‘Mr. [Thomas] Hooker [a congregationalist], his formal cause of a Church visible, or Church confederating, is considered’, pp. 96-104, p. 96</span></figcaption>

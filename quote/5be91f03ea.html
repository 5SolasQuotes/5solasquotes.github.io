<blockquote><p>So profound a repugnance to death and all that death meant,manifesting itself during his life, could not fail to seize upon him with peculiar intensity at the end. If the distant prospect of his sufferings was a perpetual Gethsemane to Him, the immediate imminence of them in the actual Gethsemane could not fail to bring with it that “awful and dreadful torture” which Calvin does not scruple to call the “exordium” of the pains of hell themselves. Matthew and Mark almost exhaust the resources of language to convey to us some conception of our Lord’s “agony”¹ as an early interpolator of Luke (Lk. xxii. 44) calls it, in this dreadful experience. The anguish of reluctance which constituted this “agony” is in part described by them both—they alone of the Evangelists enter into our Lord’s feelings here—by a term the primary idea of which is loathing, aversion, perhaps not unmixed with despondency.² ¹ [Greek] agonia: see G. Heine, Synonymik etc., 1898, p. 189: “Contest, quaking, agitation (and anxiety of the issue?) Lk. xxii. 44; Luther, ‘he grappled with death’, Weizsacker, ‘he struggled’, Bengel; ‘supreme grief and anguish. It properly denotes the anguish and passion of the mind, when it enters upon a conflict and arduous labor, even when there is no doubt of a good issue’.” Plummer in loc.: “Field contends that fear is the radical notion of the word. The passages in which it occurs in LXX confirm this view… It is therefore an agony of fear that is apparently to be understood.” It would be better to say consternation, appalled reluctance. ² [Greek] ademoneo: see Heine, Synonymik etc., 1898, p. 148: “pavesco, angor.” Cf. Lightfoot, on Phil. ii. 26: ” The primary idea of the word will be loathing and discontent.” “It describes the confused, restless, half-distracted state, which is produced by physical discouragement, or by mental distress, or grief, shame, disappointment, etc.” Lagrange on Mk. xviii. 33: “seized with despondency”. Thomas Goodwin (Works, v. 276): “so that we see Christ’s soul was sick and fainted,” “his heart failed him.</p></blockquote>

</figure><figure class="quote" id="q-913e6be71c" data-kw="">
<blockquote><p>We have seen that our Lord formerly contended with the fear of death; but as He now fights face to face with temptation, such an attack is called the beginning of grief and sorrow… Thus, though God had already tried his Son by certain preparatory exercises, He now wounds Him more sharply by a nearer prospect of death, and strikes his mind with a terror to which He had not been accustomed. But as it appears to be inconsistent with the divine glory of Christ, that he was seized with trembling and sadness, many commentators have labored with toil and anxiety to find some way of evading the difficulty. But their labor has been ill-judged and of no use; for if we are ashamed that Christ should experience fear and sorrow, our redemption will perish and be lost. Ambrose justly says: ‘I not only do not think that there is any need of excuse, but there is no instance in which I admire more his kindness and his majesty; for he would not have done so much for me, if he had not taken upon him my feelings. He grieved for me, who had no cause of grief for himself; and, laying aside the delights of the eternal Godhead, he experiences the affliction of my weakness. I boldly call it sorrow, because I preach the cross. For he took upon him not the appearance, but the reality, of incarnation. It was therefore necessary that he should experience grief, that he might overcome sorrow, and not shut it out; for the praise of fortitude is not bestowed on those who are rather stupefied than pained by wounds.’ Thus far Ambrose. Certainly those who imagine that the Son of God was exempt from human passions do not truly and sincerely acknowledge him to be a man. And when it is even said that the divine power of Christ rested and was concealed for a time, that by his sufferings He might discharge all that belonged to the Redeemer, this was so far from being absurd, that in no other way could the mystery of our salvation have been accomplished. For Cyril has properly said: ‘…For the same reason that the Word of God is God, (Jn. 1:1) and is naturally life itself, (Jn. 11:25) nobody doubts that he had no dread of death; but, having been made flesh (Jn. 1:14) He allows the flesh to feel what belongs to it, and, therefore, being truly a man, He trembles at death, when it is now at the door… You see how human nature, even in Christ Himself, has the sufferings and fears which belong to it, but that the Word, who is united to it, raises it to a fortitude which is worthy of God.’… Still the weakness which Christ took upon Himself must be distinguished from ours, for there is a great difference. In us there is no affection unaccompanied by sin, because they all exceed due bounds and proper restraint; but when Christ was distressed by grief and fear, He did not rise against God, but continued to be regulated by the true rule of moderation. We need not wonder that, since He was innocent, and pure from every stain, the affections which flowed from Him were pure and stainless; but that nothing proceeds from the corrupt nature of men which is not impure and filthy. Let us, therefore, attend to this distinction, that Christ, amidst fear and sadness, was weak without any taint of sin; but that all our affections are sinful, because they rise to an extravagant height. …And whence came to Him both sorrow and anxiety and fear, except because He felt in death something sadder and more horrible than the separation of the soul and body? And certainly He underwent death, not merely that He might move from earth to heaven, but rather that He might take on Himself the curse to which we were liable, and deliver us from it. His horror was not, then, at death simpliciter, as a passage out of the world, but because He had before his eyes the dreadful tribunal of God, and the Judge Himself armed with inconceivable vengeance; it was our sins, the burden of which He had assumed, that pressed Him down with their enormous mass. It is, then, not at all strange if the dreadful abyss of destruction tormented Him grievously with fear and anguish.</p></blockquote>

He+might+discharge+all+that+belonged+to+the+Redeemer%2C+this+was+so+far+from+being+absurd%2C+that+in+no+other+way+could+the+mystery+of+our+salvation+have+been+accomplished.+For+Cyril+has+properly+said%3A+%E2%80%98%E2%80%A6For+the+same+reason+that+the+Word+of+God+is+God%2C+%28Jn.+1%3A1%29+and+is+naturally+life+itself%2C+%28Jn.+11%3A25%29+nobody+doubts+that+he+had+no+dread+of+death%3B+but%2C+having+been+made+flesh+%28Jn.+1%3A14%29+He+allows+the+flesh+to+feel+what+belongs+to+it%2C+and%2C+therefore%2C+being+truly+a+man%2C+He+trembles+at+death%2C+when+it+is+now+at+the+door%E2%80%A6+You+see+how+human+nature%2C+even+in+Christ+Himself%2C+has+the+sufferings+and+fears+which+belong+to+it%2C+but+that+the+Word%2C+who+is+united+to+it%2C+raises+it+to+a+fortitude+which+is+worthy+of+God.%E2%80%99%E2%80%A6+Still+the+weakness+which+Christ+took+upon+Himself+must+be+distinguished+from+ours%2C+for+there+is+a+great+difference.+In+us+there+is+no+affection+unaccompanied+by+sin%2C+because+they+all+exceed+due+bounds+and+proper+restraint%3B+but+when+Christ+was+distressed+by+grief+and+fear%2C+He+did+not+rise+against+God%2C+but+continued+to+be+regulated+by+the+true+rule+of+moderation.+We+need+not+wonder+that%2C+since+He+was+innocent%2C+and+pure+from+every+stain%2C+the+affections+which+flowed+from+Him+were+pure+and+stainless%3B+but+that+nothing+proceeds+from+the+corrupt+nature+of+men+which+is+not+impure+and+filthy.+Let+us%2C+therefore%2C+attend+to+this+distinction%2C+that+Christ%2C+amidst+fear+and+sadness%2C+was+weak+without+any+taint+of+sin%3B+but+that+all+our+affections+are+sinful%2C+because+they+rise+to+an+extravagant+height.+%E2%80%A6And+whence+came+to+Him+both+sorrow+and+anxiety+and+fear%2C+except+because+He+felt+in+death+something+sadder+and+more+horrible+than+the+separation+of+the+soul+and+body%3F+And+certainly+He+underwent+death%2C+not+merely+that+He+might+move+from+earth+to+heaven%2C+but+rather+that+He+might+take+on+Himself+the+curse+to+which+we+were+liable%2C+and+deliver+us+from+it.+His </figure><figure class="quote" id="q-03c94e9d27" data-kw="">
<blockquote><p>It is likely that Boethius (480-524) inaugurates, in Latin Christian theology, the consideration of personhood as such… a person is an individual substance of a rational nature… This chapter situates Boethius in relation to significant Christian theologians before and after him… In contemporary philosophy, there is a lot of attention paid to the rationality condition for personhood. But if we look at the text in which Boethius defines a person, we do not find any precise criteria for it… The intrusion of personhood into contemporary applied ethics with a focus on detailed and disputed criteria for rationality as a condition for personhood seems to be a modern development. From a Patristic and Medieval Christian theology point of view, trying to find just the right detailed criteria for rationality in order to define personhood is a wild goose chase… The chapter consists of six sections… 1. Origen of Alexandria and the Cappadocians: Basil of Caesarea and Gregory of Nyssa 2. Miaphysites: Severus of Antioch, John Philoponus, and Peter of Callinicum 3. Boethius and Rusticus the Deacon: Rationality, Subsistence, and the Invention of Personhood 4. Neo-Chalcedonians (II): Leontius of Byzantium and John of Damascus 5. Scholastic Neo-Chalcedonians (I): Gilbert of Poitiers, Richard of St. Victor,William of Auxerre, Alexander of Hales, Bonaventure, Thomas Aquinas, andWilliam of Ware 6. Scholastic Neo-Chalcedonians (II): Henry of Ghent, John Duns Scotus, andWilliam of Ockham</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scott-m-williams.html">Scott M. Williams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Person’ in Patristic &amp; Medieval Christian Theology’</cite></span></figcaption>

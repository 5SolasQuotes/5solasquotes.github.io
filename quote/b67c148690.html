<main class="wrap"><figure class="quote" id="q-b67c148690" data-kw="">
<blockquote><p>For we do not see it necessary to posit, or even possible to posit, actual faith in those infants (which some conjecture, others strongly assert), unless it is solidly proved from Scripture. For that extraordinary and miraculous motion of John the Baptist, Lk. 1:44, seems to contribute nothing to this matter. Since from a miracle no consequence is valid to the ordinary force, causality, disposition, act, or effect of any thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 432 ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“For we do not see it necessary to posit, or even possible to posit, actual faith in those infants (which some conjecture, others strongly assert), unless it is solidly proved from Scripture. For that extraordinary and miraculous motion of John the Baptist, Lk. 1:44, seems to contribute nothing to this matter. Since from a miracle no consequence is valid to the ordinary force, causality, disposition, act, or effect of any thing.”

</figure><figure class="quote" id="q-9d306f79c2" data-kw="">
<blockquote><p>What Mr. [Thomas] Bedford [d. 1653] has produced for the efficacy of baptism has been answered by Mr. [Richard] Baxter in his Appendix to his Plain Scripture, etc. [1651-1656]… Dr. [Cornelius] Burges, his Treatise of Baptismal Regeneration [1629], has been freely censured by many… And therefore I deny baptism to be the remedy of original sin, or the cause of regeneration, or that Christ intended to assign the use to baptism to heal original sin, or to testify the freedom from it without actual [sin]. These things have been delivered by Augustine and taught by the Romanists and Lutherans, but by many other Protestants disclaimed and refuted; and therefore Mr. Stephens, Mr. [James?] Cranford [d. 1657], Mr. Bedford, etc. in using this argument do but symbolize with the Papists, and revive what many Protestants of best note have exploded. ([Errata, p. 341:] What Dr. [Samuel] Ward and Dr. [John] Davenant have said for regeneration and justification of infants by baptism has been accurately examined and enervated by Mr. Gataker in Latin.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anti-Pædobaptism, or, The Second Part of the Full Review of the Dispute Concerning Infant-Baptism</cite>, ... (London, 1654), pp. 220-21. Tombes was an English baptist.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>The most probable explanation [of 1 Cor. 15:29] is, that the apostle here refers to the Levitical rule of Numbers 19:14-19. Were there no resurrection, a corpse would be like any other clod; and there would be no reason for treating it as a symbol of moral defilement, or for bestowing on it so religiously the rites of sepulture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, p. 760</span></figcaption>

</figure><figure class="quote" id="q-da3711feeb" data-kw="">
<blockquote><p>V. Those parishioners that desire us to baptize their children, or to be themselves admitted to the Lord’s Supper, and are not members of this church (because they will not), we desire to come to us, some days before that so we may be satisfied of their faith and life: And if they seem true Christians, and either bring a certificate that they are members of any other church, with (which we are to hold communion, or show that it is not from ungodliness that they refuse to live under order and discipline, we shall baptize their children, and occasionally admit them to our communion. But if they are scandalous, we shall require them first to profess their serious repentance: And if they return to scandal, we shall after stay till we see their reformation (or of one of the parents in case of baptism).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Religion expressed</cite>, The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief, 2, our consent to the Gospel Covenant, 3, the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660), The Order &amp; Discipline of this Church, agreeable to the Word of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

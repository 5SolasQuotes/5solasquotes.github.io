<main class="wrap"><figure class="quote" id="q-41fc1f5fa4" data-kw="">
<blockquote><p>[After quoting Mt. 12:31-32] For in reality there is no difference between the sin from which one is never granted truly to repent— for which no sacrifice remains, but only certain and severe vengeance, and which will never be forgiven— and that which is, and is called, ‘unto death.’ In this view not only have the greatest of our theologians gone before, but many others also, both of the ancients and of the Papists, who, however, have expressed their opinion less fully by various phrases, indeed interpreting somewhat differently the blasphemy against the Holy Spirit, and trying to distinguish this sin just as much as the one Paul [in Hebrews] describes from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-marck.html">Johannes Marckius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Biblical Exercitations on 50 select places of the Old and New Testament</cite>, (Amserdam, 1707), Exercitation 50, ‘On 1 John 5:16-17’, pp. 1096-97, trans. ChatGPT-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e4e257a4d2" data-kw="">
<blockquote><p>Hence also is the difference between sin pardonable and unpardonable, whereof the one is said to be a sin which is committed against the Father and the Son, that is every transgression of God’s law, whereunto repentance belongs, and therefore that which is pardonable not by the properties of it own nature, but by the grace and mercy of him against whom it is committed; the other is said to be a sin which is committed against the Holy Ghost, and therefore is called by an excellency in Scriptures the blasphemy of the Spirit and a sin unto death. Now, for the making of this sin, three things concur: First, the denial of the truth against knowledge and conscience. Secondly, a universal backsliding from God, and not a particular sin against the first or second table of the law. Thirdly, a rebellion sprung from a hatred of the truth, conjoined with a tyrannical, sophistical, and hypocritical oppugning (or withstanding). And of these conditions, there is a mutual knitting and sequel of the one with, and after the other. Further, it is called a sin against the Holy Ghost, not in respect of the divine essence, and person of the Spirit, but in respect of his office – that is, of grace, and illumination – whereof the Holy Ghost is properly the worker (or effecter); but it is said to be unpardonable for three causes: first, because of the just judgment of God, who suffers not his Spirit, which is the Spirit of truth, to be reproved of a lie. Secondly, because of impenitency, or the hardness to repent. Thirdly, because of the truth and the dignity of redemption, purchased by Christ. For there remains no other sacrifice after men have forsaken the sacrifice of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius-jr.html">Lucas Trelcatius Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes</cite></span></figcaption>

</figure><figure class="quote" id="q-8a728eb99f" data-kw="">
<blockquote><p>And in this they [Jews] speak but the words of the Law, in Num. 15:27-28: ‘If any soul sin through ignorance, he shall bring a she-goat of the first year for a sin offering. And the priest shall make an atonement for him that sins ignorantly. But the soul that does ought presumptuously… the same has reproached the Lord: That soul shall be cut off from among his people.’ Now what is meant by ‘cutting off’?… ask the Jews to and among whom the thing was spoken, what it means in their common speech and acceptation, and they will tell you, ‘cutting off means’ [Hebrew], ‘Death by the hand of Heaven,’ death or destruction by the hand of God. Interpreting the matter to this purpose, that if a person sinned wilfully and presumptuously, there was no sin offering allowed in that case, but the party so offending fell immediately under liableness to divine vengance, to be destroyed or cut off by the hand of Heaven…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sin Unto Death, a Sermon’ on 1 Jn. 5:16</cite>, (1666) in Whole Works, ed. Pitman (1822), vol. 6, pp. 331-45, p. 1095</span></figcaption>

it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-07f85d4f9d" data-kw="">
<blockquote><p>…before [in 1 Tim. 2] there is an exhortation to pray ‘for all men,’ verse 1, which, although the Arminians make an argument that ‘all men’ is meant of all persons and not only of all sorts, both in that verse and verses 4 &amp; 6, because say they we ought to pray for all men universally pro singulis generum, and not only for all sorts; yet tis indeed an argument for the contrary. For to pray for all men without exception of any person is not commanded, but we find the contrary commanded. Jeremiah was forbidden to pray or make intercession for the obstinate, incorrigible Jews, Jer. 7:16; 11:14; 14:11. God would not have Samuel to mourn for Saul after he was rejected of the Lord, 1 Sam. 16:1, and we ought not to pray for such as sin unto death, i.e. the sin of blasphemy against the Holy Ghost, 1 Jn. 5:16. Paul is so far from praying for Alexander the coppersmith that he imprecates the vengeance of God upon him, 2 Tim. 4:14. We may not pray for the Pope who is the great Antichrist and son of perdition; neither may we pray for, but against Babylon [Romanism], especially after the people of God are out of her. We are bidden pray for our enemies, but not for the malicious incorrigible enemies of Christ. Wherefore when the apostle bids us pray for ‘all men,’ his meaning is that we should exclude no degree nor kind of men, great or small, Jew or Gentile, bound or free, etc.</p></blockquote>

<blockquote><p>The sin against the Holy Ghost indeed is distinct and something different from this sin unto death that our apostle [John] speaks of… It is true indeed that a sin in which a man continues unrepenting until his death and in which he dies, may very justly be called ‘a sin to death,’ that is, ‘a sin until his death,’ and it will prove a sin to death eternal, but that the apostle means here a particular sin, and that he estimates it not by its length but by its weight, not by how long the party continues in it, but by how grievous the sin is in itself, will appear as we go along, partly by discovery of the reason of the title he puts upon it, and partly by discovery of the very sin itself that is here intended…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“The sin against the Holy Ghost indeed is distinct and something different from this sin unto death that our apostle [John] speaks of… It is true indeed that a sin in which a man continues unrepenting until his death and in which he dies, may very justly be called ‘a sin to death,’ that is, ‘a sin until his death,’ and it will prove a sin to death eternal, but that the apostle means here a particular sin, and that he estimates it not by its length but by its weight, not by how long the party continues in it, but by how grievous the sin is in itself, will appear as we go along, partly by discovery of the reason of the title he puts upon it, and partly by discovery of the very sin itself that is here intended…”

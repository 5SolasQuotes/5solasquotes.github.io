</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e4304c57e2" data-kw="">
<blockquote><p>I know what dreadful consequences would attend a needless separation from the established Church, however I am treated by the corrupt members and ministers of it; for I judge of the state of a Church, not from the practice of its members, but its primitive and public constitution; and so long as I think the articles of the Church of England are agreeable to Scripture, I’m resolved to preach them up, without either bigotry or party-zeal; for I love all that love the Lord Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders, 1740</cite></span></figcaption>

</figure><figure class="quote" id="q-80dd9a5324" data-kw="">
<blockquote><p>We therefore disallow all such things as are repugnant to this foresaid doctrine, confirmed by the scriptures, and chiefly these special points: .. 3. That the church does so consist of the elect and of true saints that in it should be contained no hypocrites, and that in the Scriptures they should never be comprehended under the Church’s name. … 7. So to bind the church to certain places and persons, as to say there only with them is the church. 8. Not to acknowledge those for Christ’s churches, which, although they hold the grounds of faith, yet in ceremonies or in some part of doctrine do not altogether jump with us. 9. To make a separation from the churches upon any error or for the ill life of some men. 10. …and contrariwise, that those are not true churches which, although they keep fast the true doctrine, right sacraments and pure discipline, yet cannot show a continuance and succession of bishops never broken.</p></blockquote>

<blockquote><p>The truth of history, however, requires that we should state here some of the steps taken by that party of the Presbyterians usually called Society People or Cameronians. [In 1680] One Henry Hall of Haughhead, in Teviotdale, a gentleman who was intimate with Mr. [Donald] Cargill, and had suffered great persecution, was apprehended at Queensferry with a paper in his possession disowning the government, and containing some very strong and exceptionable sentiments. This paper, it appears, was merely a scroll drawn up by Hall and Cargill, and more like a manifesto for a general rising of the people, than fitted for a suffering and subdued handful. It was never sanctioned by any meeting [of the Cameronians]; but having fallen into the hands of the governors, it was held as indicating the sentiments and designs of all the Presbyterians. The Queensferry Paper, as it was called, was thenceforth quoted and used against all suspected of Presbyterianism. Shortly after this Cameron and Cargill, with some others, having broken off from the rest of the Presbyterian ministers, published [in 1680] a declaration at Sanquhar, differing a little from, but in the same strain with, the Queensferry Paper. The Sanquhar Declaration openly declared war against Charles as a tyrant and usurper. This was followed up by one of the most singular scenes, perhaps, recorded in the history of the times — the Torwood excommunication. In a meeting held at Torwood, in Stirlingshire, in September, 1680, Mr. Cargill, after divine service, pronounced, with all solemnity and formality, the highest sentence of excommunication against King Charles, the Duke of York, the Dukes of Monmouth, Lauderdale, and Rothes, General Dalziel, and the advocate, Sir George Mackenzie; in the name of the Lord Jesus Christ casting them out of the church, and delivering them up unto Satan. These proceedings, we may well believe, irritated the ruling powers more than ever; and though unshared in and unapproved of by the rest of the Presbyterian ministers, they were eagerly laid hold of as pretexts for still greater severities against the whole of them. The furnace was “heated one seven times more than it was wont to be heated.” Into the history of the persecutions which followed we cannot minutely enter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Story of the Scottish Church: from the Reformation to the Disruption (London: Blackie &amp; Son, 1875)</cite>, p. 347</span></figcaption>

</figure><figure class="quote" id="q-badc6b380d" data-kw="">
<blockquote><p>Take heed of pretending to greater purity and strictness about Church communion and administrations than the Word of God commends, or the examples of Christ and the apostles and the primitive Church do commend; nor be so extremely rigid as not to bear with things that they have tolerated. It is an observable rule laid down by wise and eminent divines that too much strictness and severity often does injury the Church more than profit it; it’s the way to overturn churches, not to reform them; especially this severity is unbecoming private Christians, who having no authority, yet complain such persons and such things are defilements: they must separate from them, they must not touch the unclean thing: such should take heed that they be not ‘righteous over-much,’ and not dare to be wise above what is written, lest their too much affected purity and misguided zeal hurt more the Church of Christ, and their own souls than the corruptions they so much complain of. Calvin adv. Anab., Art. 2. ‘Cum sub specie studii perfectionis imperfectionem nulam tollerare possumus; tune Diabolum nos tumefacere superbia, et hypocrisi seducere moneamur.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/i-c-m-a.html">I.C.M.A.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to the True Religion: or a Discourse Directing to make a wise Choice of that Religion Men venture their Salvation upon… (Edinburgh: Anderson, 1669)</cite>, pp. 87-88</span></figcaption>

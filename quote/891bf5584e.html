<main class="wrap"><figure class="quote" id="q-891bf5584e" data-kw="">
<blockquote><p>Many of us are familiar with the old saying, “If men were angels, government would not be necessary”. This is something of a half-truth, however. In his exposition of Romans 13, James McLeod Willson points out that civil government also has positive functions – such as promoting true religion:

It is not affirmed that the execution of law consists entirely in acts of a punitive character. It would be so, provided government had been established with no other view than to protect the peaceable citizen. Such a notion is most derogatory to the magistrate and the government. The civil ruler would then be no more than a policeman, and government a system of police. Government has higher functions. It is a “praise” them that do well. And, hence, it takes an interest in all that promotes a quiet, industrious and moral behaviour – it provides for the education of the people—it ought to interest itself in the maintenance of pure religious observances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-m-willson.html">J. M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Civil government: an exposition of Rom. XIII. 1-7</cite>, (Philadelphia, 1853), pp 85-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-71644a8bf2" data-kw="">
<blockquote><p>But although a king may remove an unprofitable and hurtful bishop, yet cannot a bishop (on the other side) depose a king if he have offended. (Mt. 14:4; Prelates of the Church have no authority to depose kings and princes, Lk. 13:32) John indeed reproved Herod, but he displaced him not of his kingdom. Ambrose and Innocentius excommunicated emperors, but they proceeded no further. Yea, and Christ called Herod a wolf, but He took not away his kingdom from him, and He paid tribute unto Tiberius, a most wicked prince. (Mt. 17:27) Neither was He at any time author to any man to shake off his yoke. Wherefore let Popes take heed: by what right they remove at their own pleasure kings and emperors out of their places. This did neither any of the prophets, nor the apostles, nor yet Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places</cite>, II.2.26, Book 4, ch. 13, section 12, p. 232</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-1181f8ced7" data-kw="">
<blockquote><p>It is the duly of government to provide for the moral training and culture of the community, especially of the young, by encouraging education, endowing schools and colleges, watching over their interests with parental solicitude, and taking care that the young shall be educated so as to make them good men and useful citizens. To attain this the reading of the scriptures must be made a prominent part of ordinary school education. To refuse the scriptures a place in common schools is directly to encourage and strengthen the growth of infidelity. Education can never be safely separated from Christian principle. For this reason a national provision for religion should embrace a provision for national education. The latter is an important part of the former. There is an inconsistency on the part of some who while they are friendly to a public provision for schools, are opposed to a public provision for the support of religion. The objection made against the latter may with equal propriety be made against the former, unless schools are so conducted as to have no reference to the Christian religion; and then it might be doubted whether they would he ultimately any advantage to a community.

The immediate end of civil government is the good of society; but this is most perfectly attained where the glory of God is kept in view as the ultimate end. The welfare of society can never be secured irrespective of this. The attainment of the ends of civil government require that provision should be made for Christian instruction and education. Immorality and crime will thus be most surely prevented, and to prevent is incomparably better than to punish crime. The prevalence of vice, and the general corruption of society necessarily and universally accompany mental debasement and religious ignorance. If it were the design of a government to encourage vice and ruin the happiness of a community, the object could not be gained more effectually than by discountenancing religious education and the regular ministration of divine truth from sabbath to sabbath. Let the places of Christian worship be shut, and the schools closed where the scriptures are read, and the race of infidels reared in such a state of things, would soon demonstrate the folly and wickedness of the policy pursued. Society would soon become a pandemonium. And as a national policy may tend to lessen the means of Christian instruction and education, the same ruinous effects will in part follow. The French revolution and the horrid scenes of blood which followed it, show that it is unwise and dangerous to separate religious principle from national policy. Such a course is as dangerous to the safety and stability of a government, as it is destructive of national happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), pp 289-90.</span></figcaption>

<blockquote><p>David Scott argues that the establishment principle implies state maintained education and vice-versa. If you accept the validity of one, then you must accept the validity of the other. His point about Voluntaryism being linked to free-market capitalism is interesting and it is a connection that I have made myself. It is hoped that subsequent posts of extracts from the writings of objective historians will serve to further confirm Scott’s thesis:

Those opposed to a public provision for the maintenance of religious ordinances, have generally, if not unanimously, conceded the duty of a government to provide for the education of children by the establishment of common schools. So far, there is no ground of difference. But I confess an inability to reconcile the admission of the duty of the magistrate to provide a system of common school education at the public expense, and yet bitterly oppose a similar provision for the support of religion. If the former is right, the latter cannot be wrong.

Religion and education are so intrinsically connected in principle and aim, that they cannot consistently be distinguished in regard to the obligation of the government. It is right to do both; but inconsistent to admit the obligation in the one case, and deny it in the other. The public mind is, however, evidently undergoing a change on this subject, but I fear for the worse. As far as Romanists are concerned, opposition to the common school system is well understood by intelligent Protestants. But many of the latter seem disposed to put the education of the children and youth of the community on the same footing with that of religion. In fact their aim is to bring the one, as they had done the other, under the application of the voluntary or free trade system. Their consistency is portentous to the welfare of the commonwealth! The movement is backward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The public support of religion in Reformed Presbyterian and Covenanter</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>
<div class="actions"><button class="copy" data-copy="“David Scott argues that the establishment principle implies state maintained education and vice-versa. If you accept the validity of one, then you must accept the validity of the other. His point about Voluntaryism being linked to free-market capitalism is interesting and it is a connection that I have made myself. It is hoped that subsequent posts of extracts from the writings of objective historians will serve to further confirm Scott’s thesis:

Those opposed to a public provision for the maintenance of religious ordinances, have generally, if not unanimously, conceded the duty of a government to provide for the education of children by the establishment of common schools. So far, there is no ground of difference. But I confess an inability to reconcile the admission of the duty of the magistrate to provide a system of common school education at the public expense, and yet bitterly oppose a similar provision for the support of religion. If the former is right, the latter cannot be wrong.

Religion and education are so intrinsically connected in principle and aim, that they cannot consistently be distinguished in regard to the obligation of the government. It is right to do both; but inconsistent to admit the obligation in the one case, and deny it in the other. The public mind is, however, evidently undergoing a change on this subject, but I fear for the worse. As far as Romanists are concerned, opposition to the common school system is well understood by intelligent Protestants. But many of the latter seem disposed to put the education of the children and youth of the community on the same footing with that of religion. In fact their aim is to bring the one, as they had done the other, under the application of the voluntary or free trade system. Their consistency is portentous to the welfare of the commonwealth! The movement is backward.”

— David Scott, The public support of religion in Reformed Presbyterian and Covenanter">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDavid+Scott+argues+that+the+establishment+principle+implies+state+maintained+education+and+vice-versa.+If+you+accept+the+validity+of+one%2C+then+you+must+accept+the+validity+of+the+other.+His+point+about+Voluntaryism+being+linked+to+free-market+capitalism+is+interesting+and+it+is+a+connection+that+I+have+made+myself.+It+is+hoped+that+subsequent+posts+of+extracts+from+the+writings+of+objective+historians+will+serve+to+further+confirm+Scott%E2%80%99s+thesis%3A%0A%0AThose+opposed+to+a+public+provision+for+the+maintenance+of+religious+ordinances%2C+have+generally%2C+if+not+unanimously%2C+conceded+the+duty+of+a+government+to+provide+for+the+education+of+children+by+the+establishment+of+common+schools.+So+far%2C+there+is+no+ground+of+difference.+But+I+confess+an+inability+to+reconcile+the+admission+of+the+duty+of+the+magistrate+to+provide+a+system+of+common+school+education+at+the+public+expense%2C+and+yet+bitterly+oppose+a+similar+provision+for+the+support+of+religion.+If+the+former+is+right%2C+the+latter+cannot+be+wrong.%0A%0AReligion+and+education+are+so+intrinsically+connected+in+principle+and+aim%2C+that+they+cannot+consistently+be+distinguished+in+regard+to+the+obligation+of+the+government.+It+is+right+to+do+both%3B+but+inconsistent+to+admit+the+obligation+in+the+one+case%2C+and+deny+it+in+the+other.+The+public+mind+is%2C+however%2C+evidently+undergoing+a+change+on+this+subject%2C+but+I+fear+for+the+worse.+As+far+as+Romanists+are+concerned%2C+opposition+to+the+common+school+system+is+well+understood+by+intelligent+Protestants.+But+many+of+the+latter+seem+disposed+to+put+the+education+of+the+children+and+youth+of+the+community+on+the+same+footing+with+that+of+religion.+In+fact+their+aim+is+to+bring+the+one%2C+as+they+had+done+the+other%2C+under+the+application+of+the+voluntary+or+free+trade+system.+Their+co

<main class="wrap"><figure class="quote" id="q-afc487e6b5" data-kw="">
<blockquote><p>The oral contraceptive principle has its basis in the Talmud as a potion or ‘cup of roots,’ the kos shel ikkarin. The ‘roots’ in that potion may refer to its herbal ingredients (the modern progesterone pill makes use of roots of the Mexican yam), and the mixture, in varying compositions, had many purposes… The kos shel ikkarin itself could, in a different dosage or composition, cause fertility rather than sterility, or could cure certain ailments [pointing to its hormonal nature]. An inquiry concerning the wife’s right to drink a potion that would help her become pregnant (sam l’hit-abber) was addressed to the eminent R. Solomon ben Adret of the thirteenth century.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-m-feldman.html">David M. Feldman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Birth Control in Jewish Law</cite>, (1968; Schocken Books, 1974) 315 pp. ToC, p. 235</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-58428f44b4" data-kw="">
<blockquote><p>I so think that in the very point of generation, when the matter is disposed to that point that it is apt for the reception of the substantial form, which makes a man out of an embryo, that the souls of individual men are more probably both new and created from nothing, this being in greater harmony with the sacred letters, testimonies of the fathers and philosophers, and reasons than that one is propagated from another through being passed over or through the seed of parents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hermann-vultejus.html">Hermann Vultejus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Philosophical Perfection of Man’</cite>, (1581) in ed. Rudolph Goclenius, Psychology, i.e. Commentaries &amp; Dispuations on the Perfection &amp; Soul of Man… from some Theologians &amp; Philosophers of our Age tr. by AI by Onku (Marburg: Paul Egenolph, 1595), p. 8 Latin Vultejus (1555-1634) was a German jurist and professor at the University of Marburg.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-7b3ddb0eda" data-kw="">
<blockquote><p>We, therefore, maintain that the rational soul is infused by God into the embryo, not indeed θύραθεν ἐπεισιέναι (entering from without), as Aristotle wishes in book 2 of On the Generation of Animals, chapter 3, but is formed by God in the fetus itself and the rudiment of the human body. Scripture teaches this. For in Isa. 57:16 God speaks thus: “The spirit from my face shall clothe man, and I make the souls.” And in Zech. 12:1: “Thus says the Lord, who stretches out the heavens, and lays the foundation of the earth, and forms the spirit within him.”…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Untying of Grave Questions</cite>, (Leiden: Elzevirana, 1632), Treatise 5, on Original Sin, ch. 1, ‘Whether there is original sin, in whom it exists, and whether it is removed by Baptism. Only Christ is excepted from this stain. Not even the Virgin Mary was immune from it’ trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“We, therefore, maintain that the rational soul is infused by God into the embryo, not indeed θύραθεν ἐπεισιέναι (entering from without), as Aristotle wishes in book 2 of On the Generation of Animals, chapter 3, but is formed by God in the fetus itself and the rudiment of the human body. Scripture teaches this. For in Isa. 57:16 God speaks thus: “The spirit from my face shall clothe man, and I make the souls.” And in Zech. 12:1: “Thus says the Lord, who stretches out the heavens, and lays the foundation of the earth, and forms the spirit within him.”…”

0within%20him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4fa34fcbb3" data-kw="">
<blockquote><p>III. The union of pastor and flock in relation makes that which is a form-aptitudinal (as the soul to the body) to be the form in act (as the union of soul and body)…

IV. Union is in order to communion, which is primary by the exercise of the formal powers on the matter, and secondary by the action of all the parts according to their several capacities and offices. …

VI. These several degrees of union are found in bodies natural and politic:

      1. The union of soul and body makes a man, and an embryo before it be organized.

      2. The union of the body makes it capable of the soul’s further operation.

      3. The union of the organical, chief parts (as heart, lungs, etc.) to the rest make it a true human body completed to the nutriment and action of life.

      4. That it have hands and fingers, feet and toes, and all integral parts, makes it an entire body.

      5. The due site, temperament and qualities of each part make it a sound body.

      6. Comely color, hair, action, going, speech, etc. make it a comely body.

      7. To have all parts of equal quantity and office would make it uncomely: and to have the same hair, color, etc. is unnecessary at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), ch. 4, pp. 20-21</span></figcaption>

</figure><figure class="quote" id="q-eae029983e" data-kw="">
<blockquote><p>We are commanded to look to Christ, as the dying Israelites looked up to the brazen serpent. This looking involved trusting; and looking is declared to be believing. Sinners are exhorted to flee to Christ as a refuge. The man-slayer fled to the city of refuge because he relied upon it as a place of safety. We are said to receive Christ, to rest upon Him, to lay hold of Him. All these, and other modes of expression which teach us what we are to do when we are commanded to believe, show that trust is an essential element in the act of saving faith.</p></blockquote>
<figcaption>— <a href="../authors/charles-hodge.html">Charles Hodge</a>, <cite>Systematic Theology</cite>, vol. 3, pt. 3, ch. 16, “Faith”</figcaption>
<div class="meta"><a class="tag" href="../topics/faith/faith-as-instrument.html">Faith as Instrument</a></div>

</figure><figure class="quote" id="q-bca1995867" data-kw="">
<blockquote><p>Himself he may doubt, — he may doubt his ability to save himself, — he may doubt his power to better his condition, to make himself more worthy and acceptable, but never let him doubt that Christ is all that a poor, lost, convinced sinner wants. Let him not doubt that Jesus is the Friend of sinners, the Savior of sinners, and that he was never known to cast out one who in lowliness and brokenness of heart, sought his compassionate grace.</p></blockquote>
<figcaption>— <a href="../authors/octavius-winslow.html">Octavius Winslow</a>, <cite>Personal Declension and Revival of Religion in the Soul</cite>, p. 80</figcaption>

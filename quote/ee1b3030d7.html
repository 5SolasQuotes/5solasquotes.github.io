<main class="wrap"><figure class="quote" id="q-ee1b3030d7" data-kw="">
<blockquote><p>So we take no power from God nor weaken it at all, if we say God cannot sin, he cannot suffer, he cannot bring to pass either not to be that which he is, or that those things which are done should not have been done. Because these things are partly of the defect of power and partly they imply a contradiction, and therefore are directly repugnant to the truth of God and simply impossible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, eds Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), Position 3.XVI, 2: 673.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-caae9f43b3" data-kw="">
<blockquote><p>God in his Word reveals Himself to be Jehovah Elohim, i.e. one God subsisting in three Persons. Though essence and subsistence, that is, the divine nature, and the Trinity of Persons in that nature, are the same thing, they being distinguished not as a Being and a Being, but as the manner of a Being or thing is distinguished from the Being or thing itself: yet for the help of our apprehension, God being pleased so far to condescend to our capacity (as delighting to be understood by us), we first consider of the essence, then of the subsistence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 1-2</span></figcaption>

</figure><figure class="quote" id="q-e054536f86" data-kw="">
<blockquote><p>But many testimonies of Scripture (you will say) teach that even the reprobate have known the truth. Leaving aside the Scriptures of the Old Testament: to Romans the apostle concerning the reprobates says that they hold the truth of God in unrighteousness. And to the Hebrews [6:4-6] he says that some have fallen away from the truth. And he says they taste the word of God and the powers of the world to come: but after the knowledge of the truth they willfully sin. And this is sin against the Holy Spirit: namely the opposition to the truth known, made from the heart. There are twofold cognitions of the truth (as was shown at the outset): one indeed is given and conferred by the gift of the Spirit; but yet inefficacious. For it is only on the surface of the intellect, and the ray has no root in the heart; and therefore it cannot be durable. For it is like seed which is born among rocky chinks and has no root; therefore when the sun arises it withers. Such cognition is common also to the reprobate. … Another is efficacious by the Holy Spirit, the Spirit, I say, of regeneration. For this penetrates into the heart, receives it, reforms and refashions it: there it puts down deep roots, and thrusts itself forth outward in its fruits by charity… Wherefore the Thesis remains firm: only the elect can come to the true knowledge of the truth, and at last the thing itself attains them. Thus it happens that this cognition of the truth is purely the work of the Holy Spirit, efficaciously calling and teaching. What things are demanded of us that we may come to a true and efficacious cognition of the truth? Thesis: That we be led to the cognition of the truth, besides a certain general hearing of the Word of God, we must pray that God may grant us his Spirit: who, when He excites in us the desire to seek that truth, then leads us to seek, to find, and to retain it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Nature of God... (Heidelberg: Wiener Neustadt, 1577), bk. 3 tr. AI by The Faith Received | ch. 3, quest. 3, ‘Whether in the knowledge of truth (which indeed is revealed in the sacred scriptures) our salvation is placed or not placed?’</span></figcaption>

<blockquote><p>Thine, O Lord is the greatness, and the power, and the glory, and the victory, and the majesty: for all that is in the heaven and in the earth is thine; thine is the kingdom, O Lord, and thou art exalted as head above all. Both riches and honour come of thee, and thou reignest over all; and in thine hand is power and might; and in thine hand it is to make great, and to give strength unto all… But who am I, and what is my people, that we should be able to offer so willingly after this sort? for all things come of thee, and of thine own have we given thee… O Lord our God, all this store that we have prepared to build thee an house for thine holy name cometh of thine hand, and is all thine own.</p></blockquote>

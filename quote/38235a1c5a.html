<blockquote><p>The Devil is near by to put in our heart all wickedness; he has the command of the out-works, the humors, fancy, disposition, the spies and posts that go in and out the senses[?]; we have need to lay the bands of a covenant on the eye, and if the devil be master of all the forts and sconces[?] without the walls, we are in no small danger.</p></blockquote>

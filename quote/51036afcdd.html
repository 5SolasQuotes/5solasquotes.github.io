<blockquote><p>45. Without a doubt, He has spoken this comforting word also for the fainthearted, who, though they are godly and prepared for the Last Day, are yet filled with great anxiety and [thus] hinder their desire for this coming, which is especially found at the end of the world; therefore, He calls it their redemption. For at the end of the world, when sin will so terribly hold sway, and along with sin the second part (the punishment for sin with pestilence, war, and famine) will also hold sway, it is necessary that believers have a strong confidence and comfort against both afflictions: sin and its punishment. Therefore, He uses the sweet word “redemption,” which all hearts gladly hear. What is redemption? Who would not gladly be redeemed? Who would desire to remain such a desert, both of sin and of punishment? Who would not wish an end to such misery, such danger for souls, such ruin for man—especially when Christ so sweetly allures, invites, and comforts us?

46. The godless preachers of dreams [cf. Jer. 23:25–28] should be censured; in their sermons they hide these words of Christ from the hearts of people and turn faith away from them, who want to make people godly by terrifying them, and who afterward prepare [people] for this day with their own good works and satisfaction for their sins. Here despair, fear, and terror must remain and grow—and with it, hatred, aversion, and abhorrence for the coming of the Lord—and enmity against God must be established in the heart. Meanwhile, they teach people to picture Christ as nothing but a stern judge whom they are to appease and expiate by their works, and never regard [Him] as the Redeemer, as He calls and offers Himself, of whom we are to expect in firm faith that out of pure grace He will redeem us from sin and all evil.

47. See, this is the way it always happens. When people do not preach the Gospel correctly, and only pursue hearts with commands and threats, they only drive them farther from God and only make them angry at God. They ought to terrify, but only the obstinate and hardened; but afterward, when people have become fearful and fainthearted, they are to strengthen and comfort them again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Gospel for the Second Sunday in Advent,” in Luther’s Works: Church Postil I</cite>, ed. Benjamin T. G. Mayes, James L. Langebartels, and Christopher Boyd Brown, vol. 75 (Saint Louis, MO: Concordia Publishing House, 2013), 105–06.</span></figcaption>

<blockquote><p>(2) God has been importunate in entreaties of us. God offers not only truce, but a peace, and has been most active in urging a reconciliation. Can He manifest his willingness in clearer methods, than that of sending his Son to reconcile the world to Himself? Can He evidence more sincerity than by his repeated and reiterated pressing of our souls to the acceptance of Him? God knocks at our hearts, and we are deaf to Him; He thunders in our ears, and we regard Him not; He waits upon us for our acceptance of his love, and we grow more mad against Him; He beseeches us, and we ungratefully and proudly reject Him; He opens his bosom, and we turn our backs; He offers us his pearls, and we tread them under our feet; He would give us angels’ bread, and we feed on husks with swine. The wisdom of God shines upon us, and we account it foolishness. The infinite kindness of God courts us, and we refuse it, as if it were the greatest cruelty. Christ calls and begs, and we will not hear Him either commanding or entreating…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Stephen Charnock</cite>, 5 vols. (d. 1680; Edinburgh: Banner of Truth, 1997), vol. 5, “Man’s Enmity to God,”, p. 521</span></figcaption>

<blockquote><p>20. ‘Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ 20. I have my time of offering mercy, and desiring you to entertain it: And if any man hear and obey this call, I will come in by my Spirit, and take habitual possession of him, and have spiritual communion with him, and he with Me. Note: Though it be not without the grace of Christ that we open to him when He knocks, and receive his offered special grace, yet, in this, He lays so much on man as to make our opening, that is, our accepting-faith, the condition of his entering for a fixed habitation by habitual love and holiness. On which account divines used to say that faith and repentance, wrought first in conversion, are the conditions or qualifications for consequent justification and sanctification.</p></blockquote>

</figure><figure class="quote" id="q-136a57be44" data-kw="">
<blockquote><p>Are you polluted? I offer him to you, as made unto you sanctification. Are you miserable and forlorn? I offer him to you, as made of God unto you complete redemption. Are you hard-hearted ? I offer him in that promise, I will take away the heart of stone. Are you content that he break your hard heart, according to his promise, Come then, put your hard heart in his hands. Are you a wretched backslider, that has back-slidden an hundred times, a thousand times more than an hundred? I offer him in that promise, I will heal your backslidings. Are your corruptions strong and prevalent ? I offer him in that promise, I will subdue your iniquities. Are you pleased that he do so? Are you afraid, that you revolt more and more? I offer him in that promise, I will put my Spirit within you, and cause you to walk in my statutes. I will put my fear in your heart, and you shall not depart from me. Are you afraid you were never elected? Meddle not with that secret; but according to the revealed will of God, I offer God’s chief Elect to you, in whom his soul is well pleased; and if your heart go in to the offer, and you make him your Elect too, by choosing him, then your election is sure. Are you afraid you have sinned the sin against the Holy Ghost? I tell you, that as your fear of that says you were never guilty of it, so I offer the Man that is God’s Fellow; and if you be content to have him, you shall never be guilty of it. Are you full of enmity against God? I offer him as a Saviour that can kill your enmity: Do you consent that he do so? Are you an impenitent creature, destitute of repentance? I offer him as a Prince and a Saviour, exalted to give repentance and remission of sin. Do you consent? Have you received him formerly? I offer him anew, that you may receive him again, and take a more larger armful of him than ever.</p></blockquote>

<blockquote><p>[19] Q. What is the outward theological calling? An. It is medium ad salitem [a means to salt], as the word and sacraments and the members of the visible church belong unto it. [20] Q. What is that inward theological calling? An. It is when God’s word brings [God’s word’s ring?] does not rest in our outward ears but comes into the heart and works somewhat there. [21] Q. How many ways [is] this taken? An. It is either effectual or ineffectual. [22] Q. What is the inward ineffectual calling? An. When it comes into the heart and falls as on stony ground. [23] Q. How far may this inward ineffectual calling bring us? An. To these four degrees of grace principally. 1. It may bring a man to see his own sin &amp; misery. 2ly. It may so work upon him, as it may bring him to have a desire after the thing persuaded [for?] 3ly It may bring him to some kind of degree of possession of the thing called for. 4ly It may bring him to some outward correspondence, as to reform many sins. [24] Q. Why then is it called an ineffectual calling? An. Because it does not fully persuade [the] heart to come in. … [30] Q. By what wording in scripture is our vocation expressed? An. By many expressions: as first by alluring and persuading. Hos. 2:14. 2ly by inviting and compelling. Math 22:4. 3ly by stretching out of the hand. Rom. 10:21. 4ly by beseeching, 2 Cor. 5:20. 5ly by drawing us. John 6.44. Lastly by apprehending. [31] Q. Do all these properly belong to effectual calling? An. No, the four first may be applied to ineffectual calling. … [38] Q. Whither do effectual and ineffectual calling differ in this respect or no, do not both come from God? An. They agree in this that both proceed from God, yet they differ in regard of the manner of work, for God does the work not secundum propositum [according to the purpose], but secundum obviam [according to the thing encountered]. … [55] Q. What and how many are the instrumental causes of our vocation? An. They are of two sorts either primary or secondary? [56] Q. What were the primary? An. The word. [57] Q. In what propositions was that expressed? An. James 5:11 [1:21?] suggests the word is the ordinary means whereby He calls and so by consequence the ministry of it. 2d. That it was but an instrumental cause under God and so it’s called the [sassed?] of God, the arm of god and sometime the power of God. 3ly. That as it’s but an instrumental cause so it did only belong to those which are adults, for infants may be said to be sanctified but not called. 4. That it was but a separable instrument. [58] Q. How can we say if the converting word is a separable means? An. For two reasons: Because the word may be without the Spirit. 2. Because the Spirit may be and may call some without the word. … [86] Q. Now you have spoken of the primary instruments of salvation as the word and sacraments. What are the secondary instruments? An. They are many as: 1. The mercies and favors of God common to all. Rom. 10:21 [“But to Israel he saith, All day long I have stretched forth my hands unto a disobedient and gainsaying people.”]. Bounty is one thing that may cause love so that one main instrument or means God uses to call us home which is to draw us with the thick cords of love [Hos. 11:4]. … [95] Q. Whether do effectual and ineffectual calling differ in this [Q: 94: ‘who are they whom God is thus pleased to call’]? An. Yes, for the ineffectual calling, many are called but few are chosen.</p></blockquote>

<blockquote><p>The next part of the sanctifying of this Day, is, to employ it in the Service of God, which is that whereunto the outward rest tendeth, Esay 58. 13. If thou wilt turn away thy foot from the Sabbath, from doing thine own will upon mine Holiday, and call the Sabbath delight, holy to JEHOVAH, and honour him, not doing thine own ways, &amp;c. Of this kind, are,

First, All religious and holy exercises, whereof these the Scripture noteth by name, as duties to be performed upon that Day:

First, To hear the Word preached, Acts 13. 14. 15. After the reading of the Law and the Prophets in the Synagogue on the Sabbath Day, the Ruler of the Synagogue sent unto them, saying, Ye men and Brethren, if ye have any word of exhortation for the People, say on. Acts 15. 21. MOSES of old time hath in every City those that preach him, being read in the Synagogues every Sabbath Day.

Secondly, Public Prayer. Acts 16. 13. Upon the Sabbath Day we went out of the City unto a River, where Prayer was wont to be.

Thirdly, To receive the Sacraments at the times appointed. Acts 20. 7. The first Day of the Week, when the Disciples were gathered together to break bread, PAUL preached unto them, &amp;c.

Fourthly, Collections and gathering for the Saints: 1. Cor. 16. 2. The first Day of the Week, let every one lay aside by him, treasuring up what he hath been prospered.

Fifthly, Private meditation, which was the exercise of John the Apostle, at what time he was banished into the Isle Patmos for the Word of God: Upon the Lord’s Day he was ravished in Spirit, in sweet and heavenly Meditations, Revel. 1. 10. wherein it is fit that by our selves, and in our Family we confer together, and call to mind the things that in the public Ministery we have heard, as the men of Berea did. And in this respect lest by the travailing of our beasts, men, who are necessarily to be employed about them, should be drawn from God’s Service, we are commanded, that they should also rest: for whose ease otherwise the Sabbath was not any way ordained.

Secondly, The duties of brotherly love, as distributing to the poor, according to the good hand and blessing of God upon us, visiting the sick, helping our Neighbour, his Ox, Ass, or any thing in distress, when they are done, not for our own lucre, but as works of mercy and compassion. Thus did Paul upon that day restore him, that being overcome with sleep, while Paul was preaching, the night of the Sabbath Day, fell down from the third Loft, and was taken up dead, Acts 20. 9. And hither tendeth the saying of our Saviour Christ, Mark 2. 27. The Sabbath was made for man, and not man for the Sabbath. The contrary hereof is the outward observation, without respect of inward godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Sacred Divinity Briefly &amp; Methodically Propounded: More Largely &amp; Clearly Handled and Explained</cite>, (London: William Stansby, [1625]), 1.8, pp 170-72.</span></figcaption>

<blockquote><p>Let us then drive away from our ears and minds those who say that we ought to accept the determination of our own free will and not pray God to help us not to sin. By such darkness as this even the Pharisee was not blinded; for although he erred in thinking that he needed no addition to his righteousness, and supposed himself to be saturated with abundance of it, he nevertheless gave thanks to God that he was not “like other men, unjust, extortioners, adulterers, or even as the publican; for he fasted twice in the week, he gave tithes of all that he possessed.”

He wished, indeed, for no addition to his own righteousness; but yet, by giving thanks to God, he confessed that all he had he had received from Him. Notwithstanding, he was not approved, both because he asked for no further food of righteousness, as if he were already filled, and because he arrogantly preferred himself to the publican, who was hungering and thirsting after righteousness.

What, then, is to be said of those who, whilst acknowledging that they have no righteousness, or no fulness thereof, yet imagine that it is to be had from themselves alone, not to be besought from their Creator, in whom is its store and its fountain? And yet this is not a question about prayers alone, as if the energy of our will also should not be strenuously added. God is said to be “our Helper;” but nobody can be helped who does not make some effort of his own accord.

For God does not work our salvation in us as if he were working in insensate stones, or in creatures in whom nature has placed neither reason nor will. Why, however, He helps one man, but not another; or why one man so much, and another so much; or why one man in one way, and another in another,—He reserves to Himself according to the method of His own most secret justice, and to the excellency of His power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Merits and Forgiveness of Sins. And on the Baptism of Infants</cite>, (412), 2.6 in NPNF1, 5: 46.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Moreover, who can deny ye there is much &amp; great virtue in David’s Harp… Again must not David’s songs be of great excellency, seeing that ye Son of God came down from the glorious throne of his heavenly Father to accomplish and fulfill them? Doth not Paul also say, ‘Be ye filled with the Spirit, speaking among yourselves in Psalms, Hymns, &amp; spiritual songs, singing and making melody in your hearts to ye Lord, ever giving thanks for all things in the name of our Lord Jesus Christ?’ Certes [assuredly] the psalmody of David may well be called ye treasure house of the holy Scripture. For it contain the whatsoever is necessary for a christian to know: There is nothing in the law, no thing in the Prophets, nothing in ye preaching of Christ and of his apostles, yt this noble minstrel, King &amp; Prophet doth not decantate and sing with most goodly &amp; manifest words. He singeth all the works and wonderous miracles of God from the beginning of the world, until the redemption of mankind by Christ. He singeth Christ’s incarnation, preaching, working of miracles, passion, death, resurrection, ascension, glory, the blessing of all nations, the conversion of the Gentiles with all other mysteries that pertain to our health… To be short, he singeth whatsoever is expedient for a Christian’s knowledge. So that even this one book alone of David’s songs had been sufficient truly to instruct a man in the righteousness of God… O the wonderful and marvelous strength of David’s harp. O the great and exceeding virtue of David’s songs… Would God that all men of honor would nourish such minstrels in their houses, as David’s, and that might sing unto them both at dinner and supper, yea and at all other times these most sweet and delectable songs of David… Would God also that all fathers and mothers, all masters and mastresses, would bring up their children and servants in the singing of these most godly songs.</p></blockquote>

<blockquote><p>1. Some things are necessary by divine ordination, as magistracy; ‘Whosoever resists the power,’ says the apostle, ‘resists the ordinance of God;’ and ‘the powers that be, are ordained of God,’ Rom. 13:1-2, etc. And as magistracy, so ministry is the ordinance of God, 1 Cor. 12:28, ‘And God hath set some in the Church, first Apostles, etc.’

2. Some things are necessary by divine precept; as for example, the exercise of the power of the magistrate is not only necessary by virtue of God’s instituting and ordaining magistracy, but also by the command of God, which obliges magistrates to punish vice, to execute wrath upon them who do evil, to promove, encourage and praise that which is good; to protect their subjects in well-doing, and to preserve peace. And so ministers are under a necessity of preaching the Gospel by the command of God.

3. Some things are necessary because God has made them useful and convenient for man, and has given them to man for his use; they are in their nature convenient for man, given and designed of God for the good of man; thus meat and clothing, and houses, peace and the protection of lawful authority are necessary.

4. Some things are necessary means in order to a necessary end; and these again are necessary, either simply for attaining the end, or necessary for the better or more easy and convenient attaining of the end; as a house is necessary, not simply for hearing of the Word, but for the more convenient hearing of the Word, because it shelters the minister and people from storms, winds and scorching heat, etc. Thus the protection of lawful authority is necessary for the peaceable hearing of the Word without disturbance.

5. Some things are necessary for preventing of evil; the evil either of sin, or of affliction and calamity.

6. Some things become necessary, or the more necessary to be done, because of those who urge the forbearance of them out of some erroneous principle, or for establishing of some error. And thus Mr. Rutherford shows in the forecited treatise [the Appendix on Scandal to The Divine Right of Church Government], that to forbear the eating of swine’s-flesh before a Jew, who alleges that it is a sin, or breach of the commandment of God to do so; to forbear it now when we are fully possessed in that liberty wherewith Christ has made us free, were to harden the Jew in his Judaism, and the way to bring us again under the yoke of the Ceremonial Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-vilant.html">William Vilant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Review &amp; Examination of a Book bearing the Title of The History of the Indulgence</cite>, … (London, 1681), pp. 249-50</span></figcaption>

<blockquote><p>That man being made by God, and subject to his will, and owing unto him worship and obedience, which in reason ought to be prescribed by none other than by him to whom it is to be performed; that, therefore, requisite and congruous it is, that the will of God should be made known unto his creature, in such a manner, and by such means, as that he shall not, without his own wilful neglect, mistake it: inasmuch as law is the rule of obedience, and promulgation the force of law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), 3: 147.</span></figcaption>

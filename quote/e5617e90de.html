<blockquote><p>The Scriptures deliver a twofold righteousness, by which the elect, being freely endowed, are said to be righteous and justified: One most perfect and in all points absolute: the other imperfect and begun in us, and to be perfected in another world: One, which as it depends not on our works, so can it not be perfected by our works: The other, which though it be given of grace and not for works, yet is it increased and perfected by works: One, with which we being endowed, are so justified before God that in the sight and judgment of God Himself we are reputed for altogether blameless and most just: Another, which does not only make us righteous before men, but also makes us more and more acceptable to God, and has the promise of the life that now is and that which is to come. To conclude, one without us, really placed in Christ Himself only our head, and imputed to us, and so made ours by imputation: The other really existing and inherent in ourselves.</p></blockquote>

<blockquote><p>Q. 26. Does sanctification occur in the conscious level of the life of believers or below that level in depth? It occurs below the level of conscious life and works out of the regnerate root of the soul on its dispositions and inclincations to sanctify them. Q. 27. Is sanctification a mediate or immediate work? As it takes place below the consciousness, it is primarily an immediate work. That, however, does not take away form the fact that in its manifestation it is tied by God to the use of certain means.</p></blockquote>

</figure><figure class="quote" id="q-46d07c19ed" data-kw="">
<blockquote><p>It’s a question, Whether this drawing [Jn. 12:32] be justification or sanctification? Antinomians say it’s both: But withal, both is one (say they). Answer: Position 1. Drawing is relative to running and walking, Cant. 1:4. Now this is rather in acts of sanctification and in running in the ways of God’s commandments, Ps. 119:32, than in justification, though “coming” go for an act of believing and approaching to Christ, Jn. 6:44, and so excludes not faith. Position 2. It is most unsound to affirm that justification and regeneration are all one;† for this must confound all acts flowing from justification with those that flow from regeneration, or the infused habit of sanctification. † [Margin Note:] ]Libertines falsely teach that justification and regeneration is one.

1. Justification is an indivisible act; the person is but once for all justified, by grace. But sanctification is a continued daily act.

2. Justification does not grow; the sinner is either freed from the guilt of sin and justified, or not freed; there is not a third. But in sanctification we are said to grow in grace, 2 Pet. 3:14, and advance in sanctification: nor is it ever consummate and perfect so long as we bear about a body of sin. Position 3. To repent, to mortify sin, is not to condemn all our works (as Mr. Town says) righteousness and judgment, and our best things in us, and then by faith to fly to grace; nor is it to distrust our own righteousness and embrace Christ’s in the promise.

1. Because this is faith; and the Scripture says we are justified by faith.

2. We receive Christ by faith, Jn. 1:12.

3. We receive and embrace the promise by faith, Heb. 11:11, and were persuaded of them.

4. We are to believe without staggering, Rom. 4.19.

5. We have peace of conscience through faith, Rom. 5:1.

6. By faith we have access into this grace wherein we stand, Rom. 5:2. And boldness to enter into the holy of holiest, and draw near to our High Priest, with full assurance of faith, Heb. 10:19-22. Now we are not justified by repentance and mortification; we neither receive Christ, nor embrace the promises by repentance. The apostle requires in repentance, sorrow, carefulness to eschew sin, clearing, indignation, fear, zeal, desire, revenge, 2 Cor. 7:10-11, but nowhere does the Scripture require this as an ingredient of repentance, that we have boldness and access, and full assurance: nor do Antinomians admit that by repentance we have peace or pardon, but this they ascribe to faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), pp. 271-72</span></figcaption>

<blockquote><p>…in a man regenerate, there are two contrary qualities inherent in every faculty:

1. Grace, in a rectified holy inclination to goodness, infused into it.

2. Corruption in a vitious quality disposing it to evil. These two qualities abide in the regenerate, and oppose one another… let us proceed to declare what is a regenerate man’s resistance that he makes against the working of grace in hindering the performance of any good work: which you shall perceive by these two conclusions:

1. A man regenerate so far forth as he is Spiritual, never resists the work of grace, but is constantly most willing and forward to the performance of all holy actions. …

2. That a man regenerate, so far forth as he is carnal, does always resist the work of grace, being unwilling and backward to perform any holy action. … To conclude this point, there is in every regenerate man a possibility or power of resistence always remaining so long as any corruption abides in him, which will perpetually make some opposition more or less in the performance of every good work. But for the prevailing act of resistency whereby such good works might be quite hindered, we affirm that by the power of assisting grace effectually aiding the regenerate faculties, that act is taken away. The flesh may strive, but the Spirit does overcome… a victory indeed certain in regard of the event, but with some uncertainty in the combat, wherein Israel is sometime put unto the worst. For you are to note that albeit in the general as touching those main and principal acts of beleeving, repenting, persevering in obedience, etc. grace does work so effectually with man’s regenerate will that corruption cannot hinder it in the exercise of those acts: nevertheless, in many particular actions after his first conversion in the continued practice of sanctification, he may obey the enticings of his corrupt concupiscence, against the motions of the Spirit of grace. For many times in sundry particulars of Christian practice God is pleased to deny that effectual assistance which at other times He affords, and then He leaves us unto our own strength, for experiment to try what is in us, for humiliation in discovery of our weakness unto us, for exercise of Christian watchfulness in making diligent use of all gracious helps, and the like good purposes. … But these desertions are not perpetual: corruption may for a time let [prevent] the exercise of some particular graces, but in all and always it shall never hinder: God who has given unto a regenerate man a power to believe by the changing of his will through the infusion of a constant inclination to all spiritual good, will also cause the act of believing infallibly to ensue, by the assistance of cooperating grace, so powerfully strengthening the regenerate will, and so effectually restraining the rebellious motions of corruption that the will shall not choose but do that which above all things in the world it most desires to do, namely, believe and obey the Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith</cite>, pp. 148-57 in Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith… (London: 1627), pp. 148-54</span></figcaption>

— William Pemble, Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith, pp. 148-57 in Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith… (London: 1627), pp. 148-54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6in+a+man+regenerate%2C+there+are+two+contrary+qualities+inherent+in+every+faculty%3A+1.+Grace%2C+in+a+rectified+holy+inclination+to+goodness%2C+infused+into+it.+2.+Corruption+in+a+vitious+quality+disposing+it+to+evil.+These+two+qualities+abide+in+the+regenerate%2C+and+oppose+one+another%E2%80%A6+let+us+proceed+to+declare+what+is+a+regenerate+man%E2%80%99s+resistance+that+he+makes+against+the+working+of+grace+in+hindering+the+performance+of+any+good+work%3A+which+you+shall+perceive+by+these+two+conclusions%3A+1.+A+man+regenerate+so+far+forth+as+he+is+Spiritual%2C+never+resists+the+work+of+grace%2C+but+is+constantly+most+willing+and+forward+to+the+performance+of+all+holy+actions.+%E2%80%A6+2.+That+a+man+regenerate%2C+so+far+forth+as+he+is+carnal%2C+does+always+resist+the+work+of+grace%2C+being+unwilling+and+backward+to+perform+any+holy+action.+%E2%80%A6+To+conclude+this+point%2C+there+is+in+every+regenerate+man+a+possibility+or+power+of+resistence+always+remaining+so+long+as+any+corruption+abides+in+him%2C+which+will+perpetually+make+some+opposition+more+or+less+in+the+performance+of+every+good+work.+But+for+the+prevailing+act+of+resistency+whereby+such+good+works+might+be+quite+hindered%2C+we+affirm+that+by+the+power+of+assisting+grace+effectually+aiding+the+regenerate+faculties%2C+that+act+is+taken+away.+The+flesh+may+strive%2C+but+the+Spirit+does+overcome%E2%80%A6+a+victory+indeed+certain+in+regard+of+the+event%2C+but+with+some+uncertainty+in+the+combat%2C+wherein+Israel+is+sometime+put+unto+the+worst.+For+you+are+to+note+that+albeit+in+the+general+as+touching+those+main+and+principal+acts+of+beleeving%2C+repenting%2C+persevering+in+obedience%2C+etc.+grace+does+work+so+effectually+with+man%E2%80%99s+regenerate+will+that+corruption+cannot+hinder+it+in+the+exercise+of+those+acts%3A+nevertheless%2C+in+many+particular+actions+after+his+first+conversion+in+the+continued+practice+of+sanctification%2C+he+may+obey+the+enticings+of+his+corrupt+concupiscence%2C+against+the+motions+of+the+Spirit+of+grace.+For+many+times+in+sundry+particulars+of+Christian+practice+God+is+pleased+to+deny+that+effectual+assistance+which+at+other+times+He+affords%2C+and+then+He+leaves+us+unto+our+own+strength%2C+for+experiment+to+try+what+is+in+us%2C+for+humiliation+in+discovery+of+our+weakness+unto+us%2C+for+exercise+of+Christian+watchfulness+in+making+diligent+use+of+all+gracious+helps%2C+and+the+like+good+purposes.+%E2%80%A6+But+these+desertions+are+not+perpetual%3A+corruption+may+for+a+time+let+%5Bprevent%5D+the+exercise+of+some+particular+graces%2C+but+in+all+and+always+it+shall+never+hinder%3A+God+who+has+given+unto+a+regenerate+man+a+power+to+believe+by+the+changing+of+his+will+through+the+infusion+of+a+constant+inclination+to+all+spiritual+good%2C+will+also+cause+the+act+of+believing+infallibly+to+ensue%2C+by+the+assistance+of+cooperating+grace%2C+so+powerfully+strengthening+the+regenerate+will%2C+and+so+effectually+restraining+the+rebellious+motions+of+corruption+that+the+will+shall+not+choose+but+do+that+which+above+all+things+in+the+world+it+most+desires+to+do%2C+namely%2C+believe+and+obey+the+Gospel.%E2%80%9D%0A%0A%E2%80%94+William+Pemble%2C+Vindici%C3%A6+grati%C3%A6.+%3D+A+Plea+for+Grace%2C+More+especially+the+Grace+of+Faith%2C+pp.+148-57+in+Vindici%C3%A6+grati%C3%A6.+%3D+A+Plea+for+Grace%2C+More+especially+the+Grace+of+Faith%E2%80%A6+%28London%3A+1627%29%2C+pp.+148-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0b2ac2e5f1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0b2ac2e5f1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text= <blockquote><p>21. By the knowledge of our own acts we know our powers and the nature of our own souls (though imperfectly). And by the knowledge of our souls, we know the nature of other intellectual spirits. And by the knowledge of ourselves and them, and the Scripture expressions of his attributes, we know so much of God as we can here know. And accordingly must speak of him, or be silent. For we have no higher notions than such as are thus analogical, expressing that which is in God in an inconceivable eminency and transcendency, by words which first signify that which is formally in the soul (as is said).</p></blockquote>

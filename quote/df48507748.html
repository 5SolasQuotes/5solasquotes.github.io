<blockquote><p>4. A graceless man, as [Simon] Magus [Acts 8:9-13; 18-24], hath thus far right to demand the seals, that he may say to the Church, ‘You sin in withholding the seals, and therefore I require you baptize me, as Christ hath commanded you’: but he cannot say, ‘I have right, even external, to receive Baptism, and I sin not in receiving it.’ And Mr. Hooker’s argument to prove it is naught: ‘Why’, saith he, ‘Graceless men have the command of God to challenge the seals’; Magus hath the command of God to challenge, and to receive the Lord’s Supper. [Rutherford:] A command absolute he has none: show me such a command: Magus, Judas, eat and drink at the Lord’s Supper, challenge, claim and receive Baptism; All Israel eat the Passover, be ye real believers or hypocrites, be ye self-triers, and prepared or not, be ye clean or unclean. I confess there were no better right to challenge the seals than such a command, if any such were; but if Mr. Hooker or any of his read such a command, I pray I may see and read also. But Magus has only a conditional command, which gives him no true and real right, save only conditionally, to wit, Magus, receive the seals and the Lord’s Supper. So thou believe and examine thyself: if not, thou hast no right to the seals, but eatest and drinkest thine own damnation. And because these graceless men fulfill not the condition, and believe not, Mr. Hooker’s argument is wa[…]ry; They have right from the command of God, which is the b[irth?]right: that is, they have no right at all from a conditional command, they not fulfilling the condition, but such right as robbers have to the traveler’s purse; yea, they have no command of God, but the contrary: a severe discharge, Isa. 1:13, ‘Bring no more vain oblations.’ Mt. 22:12, ‘Friend, how camest thou in hither, not having a wedding garment?’ ‘He that eateth and drinketh unworthily, eateth and drinketh damnation to himself,’ 1 Cor. 11:29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658) | ch. 18, ‘Answer to Mr. Hooker’s Arguments, that the Invisible Church is Not the First Subject of the Seals’, p. 88</span></figcaption>

<blockquote><p>Controversy 11 – Should the holy Supper for convenience be celebrated by the sick in private dwellings? We deny against the Lutherans. Arguments:

1. Christ only administered the Supper in the assembly of the disciples.

2. Paul wanted us to gather together and to wait on one another (1 Cor. 11:33).

3. The Supper seals communion of many with Christ, because all are partakers of the one bread. Objections:

1. Christ performed it in private houses. Reply: But the Church gathered there.

2. The sick need the confirmation of their faith. Reply: From the Word of God, and they can have that confirmation from a Supper they have taken previously. Controversy 12 – Should the leftover bread and wine from the holy Supper be kept in vases or containers to be solemnly carried around to the sick and for other similar uses? We deny against the Papists. Arguments:

1. The water of baptism cannot be carried around this way, for many were baptized in a river (Acts 8:38); therefore, the bread of the Supper should not be either.

2. It is only a sacrament when it is used, and it has no greater sanctity outside of that use than any other bread.

3. There is no example or institution of it in the Word of God. Objections:

1. It is the body of Christ. Reply: No. The body of Christ is not bread.

2. It is the cup of the New Testament. Reply: Insofar as it is a sign and seal of it.</p></blockquote>

<blockquote><p>Neither Word nor sacraments, nor anything on the part of the Almighty can be intended in vain, though the end of the ordinance be not obtained. I should have expected some such divinity from the pen of Arminians and Socinians who make God to intend the salvation of all and every one in both the promises of the Gospel, precepts and sacraments, and yet He falls from this end: so you may read, in Arminius, Anti-Perkins, p. 60, that God is disappointed in his end, in both Law and Gospel, and God shooting beside his mark misses the salvation of many, say the Remonstrants at the Synod of Dort, p. 216, and in their confession, ch. 7, sect. 3; and because Socinus thought it hard thus to take from God wise intentions, he did no less than blasphemously deprive Him of his omniscience: So Socians, Contra Puccium, ch. 10, and in Theological Lectures, ch. 11, made all things that are contingently to come uncertain to God: But if you speak of intentio operis, non operantis [the end of the work, not of the worker], that the Supper, in its nature, is ordained…</p></blockquote>

— Samuel Rutherford, The Divine Right of Church Government… (London, 1646), ch. 23, pp. 525-26">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNeither+Word+nor+sacraments%2C+nor+anything+on+the+part+of+the+Almighty+can+be+intended+in+vain%2C+though+the+end+of+the+ordinance+be+not+obtained.+I+should+have+expected+some+such+divinity+from+the+pen+of+Arminians+and+Socinians+who+make+God+to+intend+the+salvation+of+all+and+every+one+in+both+the+promises+of+the+Gospel%2C+precepts+and+sacraments%2C+and+yet+He+falls+from+this+end%3A+so+you+may+read%2C+in+Arminius%2C+Anti-Perkins%2C+p.+60%2C+that+God+is+disappointed+in+his+end%2C+in+both+Law+and+Gospel%2C+and+God+shooting+beside+his+mark+misses+the+salvation+of+many%2C+say+the+Remonstrants+at+the+Synod+of+Dort%2C+p.+216%2C+and+in+their+confession%2C+ch.+7%2C+sect.+3%3B+and+because+Socinus+thought+it+hard+thus+to+take+from+God+wise+intentions%2C+he+did+no+less+than+blasphemously+deprive+Him+of+his+omniscience%3A+So+Socians%2C+Contra+Puccium%2C+ch.+10%2C+and+in+Theological+Lectures%2C+ch.+11%2C+made+all+things+that+are+contingently+to+come+uncertain+to+God%3A+But+if+you+speak+of+intentio+operis%2C+non+operantis+%5Bthe+end+of+the+work%2C+not+of+the+worker%5D%2C+that+the+Supper%2C+in+its+nature%2C+is+ordained%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%28London%2C+1646%29%2C+ch.+23%2C+pp.+525-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe301663091.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e301663091.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments#:~:text=Neither%20Word%20nor%20sacraments%2C%20nor%20anything,Supper%2C%20in%20its%20nature%2C%20is%20ordained&amp;text=Neither%20Word%20nor%20sacraments%2C%20nor%20anything%20on%20the&amp;text=that%20the%20Supper%2C%20in%20its%20nature%2C%20is%20ordained" rel="no

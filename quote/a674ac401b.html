<main class="wrap"><figure class="quote" id="q-a674ac401b" data-kw="">
<blockquote><p>Nor doth it follow, as [Tobias] Crispe and Antinomians say, Faith, obedience, and repentance are not conditions, because pardon, and justification, and salvation go before them; or because by them we purchase not Christ, it only followeth, they are not such conditions as are antecedent, and purchase Christ, which we grant.

2. If a condition be taken in Law terms for a condition, qualification, or something that issueth from free will, without the determining grace of Christ, and such a condition as salvation and righteousness imputed dependeth on, in a proper way of condition; so faith is neither strictly a condition of justification, nor of righteousness, or salvation; because God of mere grace worketh, both the condition, faith and the thing conditioned; for a condition is properly a qualification, or work to be done by a party, by way of contract, league, and bargain, and done, of the parties own strength, as the one side, half, or quarter of a covenant, that obligeth the other party, to bestow a favour or reward for the performed condition, as Arminians say, and neither in this sense, do we ascribe a condition to men. …

Because Christ as surety undertaketh by promise to fulfil both our part, and his own, I will write my Law in their hearts. Christ subscribeth the covenant for me, and himself, and leadeth our trembling hand at the pen, and causeth us consent; in this notion, the Gospel is all promise, rather then a covenant, or a bargain; and there is neither limb, nor lith, nor joint of the covenant, but its all pure grace, both work and wages. Antinomians cannot say that we teach, We are redeemed, justified, saved for faith, for works.

But if a condition be taken Evangelically for a qualification wrought in us, by the grace of Christ, and without which we are not justified, nor saved; then to deny the Gospel to be a conditional covenant, is to bely the Gospel. For the whole Gospel saith, He that believeth, hath life, is freely justified; he that believeth not, is damned, and the wrath of God abideth on him. And that repentance and doing of God’s will, and new obedience, are conditions, is evident by Scripture. Nor is it a Popish way by works, to say, We seek glory, and honour, and immortality by well doing. Works are not so much conditions of justification, as Faith is; yet are they conditions required in these that shall be saved. And because Christ worketh faith in us, it proveth it is not a condition of our own working, but not that it is no Evangelike condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 2.38, pp 39-40.</span></figcaption>

<blockquote><p>26. Therefore, every true Christian who has actually returned into the grace of God, being now constituted in a state of grace, has a twofold righteousness—not acquired by his own free will or the powers of nature, but given to him by God through Christ—and both are necessary for his salvation: one imputed, the other inherent. The imputed is that which Christ has performed for him, to satisfy for all sins committed by him throughout his whole life; the inherent is that by which, through divine grace in Christ, he begins inwardly more and more to cease from sins to be committed hereafter, and strives most diligently to observe the divine law exactly. For by that imputed righteousness of Christ he is not freed from the keeping of the law, but rather bound to it more closely.</p></blockquote>

<blockquote><p>[Margin Note:] It’s false that Christ so died for us, that is, in our stead, as that in our stead He fulfilled the Law and performed all active obedience and passive by doing and dying that God can require of us. 2. Christ may be said to die for us, as if we had substituted Him in our place, in so rigid a sense as if He had been made our surety to fulfill both the preceptive and active, and also the satisfying and suffering part of the Law in our room. This may please Antinomians, but a doubt it is, if it stand with the truth: For then whatever we, yea all mortal men be (for Christ died for them all, as many teach) most wicked, yet Christ’s active and surety, and cautionary righteousness should be ours; and though we should never believe, yet Christ who fulfilled the Law, and preceptive as well as the threatening part, must have believed for all that He died for, and what need we then in our persons either [to] believe or repent? It’s true, we need not perform any active obedience, as a part of active fulfilling of that Covenant of Works, which either must have all or no obedience. If it be said that alio titulo, ‘upon another account’ of thankfulness to our ransom-payer we owe active obedience: Yet all [persons] that Christ died for, both actively and passively, must be perfectly righteous and justified, [He] having paid the most perfect active and passive obedience that the Law required, though we never believe, and Christ must have paid the active part of justifying faith for us. And why, but we should be formally justified in Him without faith also? As also, God, not we, laid our sins upon Christ, Isa. 53:6; 2 Cor. 5:21, and therefore we did commissionate and substitute Christ to die in our room.</p></blockquote>

<blockquote><p>For what is vainer than regarding someone as righteous who has not kept the law? Yet the law not only forbids that anything be done which it condemns (to which is attached a threatening with death) but also prescribes the outcome of what it enjoins (to which is attached the promise of life). Thus, whoever in Christ is judged to be ‘no sinner’ has indeed evaded death; but on the grounds of what other right would anyone demand life, other than that he has in Christ fulfilled all the righteousness of the law?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistolae theologicae: liber unus</cite>, (Geneva: Vignon, 1573), Epistle 35, to Olevianus (1560), p. 200 as trans. G.A. van den Brink, The Transfer of Sin… (Brill, 2024), p. 219 cf. Epistle 45, p. 228</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“For what is vainer than regarding someone as righteous who has not kept the law? Yet the law not only forbids that anything be done which it condemns (to which is attached a threatening with death) but also prescribes the outcome of what it enjoins (to which is attached the promise of life). Thus, whoever in Christ is judged to be ‘no sinner’ has indeed evaded death; but on the grounds of what other right would anyone demand life, other than that he has in Christ fulfilled all the righteousness of the law?”

— Theodore Beza, Epistolae theologicae: liber unus, (Geneva: Vignon, 1573), Epistle 35, to Olevianus (1560), p. 200 as trans. G.A. van den Brink, The Transfer of Sin… (Brill, 2024), p. 219 cf. Epistle 45, p. 228">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+what+is+vainer+than+regarding+someone+as+righteous+who+has+not+kept+the+law%3F+Yet+the+law+not+only+forbids+that+anything+be+done+which+it+condemns+%28to+which+is+attached+a+threatening+with+death%29+but+also+prescribes+the+outcome+of+what+it+enjoins+%28to+which+is+attached+the+promise+of+life%29.+Thus%2C+whoever+in+Christ+is+judged+to+be+%E2%80%98no+sinner%E2%80%99+has+indeed+evaded+death%3B+but+on+the+grounds+of+what+other+right+would+anyone+demand+life%2C+other+than+that+he+has+in+Christ+fulfilled+all+the+righteousness+of+the+law%3F%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+Epistolae+theologicae%3A+liber+unus%2C+%28Geneva%3A+Vignon%2C+1573%29%2C+Epistle+35%2C+to+Olevianus+%281560%29%2C+p.+200+as+trans.+G.A.+van+den+Brink%2C+The+Transfer+of+Sin%E2%80%A6+%28Brill%2C+2024%29%2C+p.+219+cf.+Epistle+45%2C+p.+228&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fed27b9bc75.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ed27b9bc75.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=For%20what%20is%20vainer%20than%20regarding,all%20the%20righteousness%20of%20the%20law&amp;text=For%20what%20is%20vainer%20than%20regarding%20someone%20as&amp;text=Christ%20fulfilled%20all%20the%20righteousness%20of%20the%20law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a8c10b0015" data-kw="">
<blockquote><p>By so doing we by no means establish as the formal cause of our justification that essential righteousness of Christ, which is itself His deity, or the supreme purity and holiness of His humanity, or His sufferings absolutely considered, which ceased together with His earthly life. But we say that the merit of His sufferings (παθημάτων) is the material cause of our justification, which is substituted in place of our guilt, inborn corruption, and all our sins that flow forth from that sewer.</p></blockquote>

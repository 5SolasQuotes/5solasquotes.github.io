<main class="wrap"><figure class="quote" id="q-87c6c5c3dc" data-kw="mediator predestination mission">
<blockquote><p>The institution of this office is resolved especially by three degrees: (1) by the predestination of Christ; (2) by his mission; (3) by his calling. The first grade is in the eternal predestination of a Mediator, by which God selected and appointed his own Son as a Mediator to reconcile the elect to himself and accomplish the work of salvation (referred to in 1 Pet. 1:20; Acts 2:23; Rev. 13:8). The second in his mission, by which, according to the eternal decree of predestination, he was sent into the world in the fulness of time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.5.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/the-mediator.html">The Mediator</a> › <a href="../topics/the-mediator-prophet-and-king/the-mediator/necessity-of-a-mediator.html">Necessity of a mediator</a></span><span class="t"><a href="../topics/election/election-in-christ.html">Election in Christ</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf239b6292" data-kw="Mary Queen of Heaven Mediator Idolatry Invocation of saints">
<blockquote><p>Yes, they transform some of them into detestable idols, making them in truth mediators of redemption, especially the virgin Mary, whom they call &quot;a Lady, a Goddess, a Queen, whom Christ her Son obeys in heaven, a mediatress: or life, hope, the medicine of the diseased.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic</cite>, An Advertisement to all Favorers of the Roman Religion</span></figcaption>

</figure><figure class="quote" id="q-cfbccf335c" data-kw="">
<blockquote><p>Therefore, we maintain that the blessed Virgin is not to be worshiped, not to be invoked as a mediator or mother of graces; we do not want to place our trust in her, offer sacrifices in her name, celebrate festivals in her honor, erect images of her, or honor her through any such cult!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Virgin Mary</cite>, p. 13</span></figcaption>

</figure><figure class="quote" id="q-b48112252c" data-kw="Mary Queen of Heaven Mediator">
<blockquote><p>In brief, there is scarcely one title given to Jesus Christ, nor one which prophesies of Him, which they do not attribute to her, calling her Queen of Heaven, Porter of Paradise, their life, their sweetness, treasurer of grace, the refuge and advocate of sinners—thus dishonoring Him and also making the poor people understand that they honor her contrary to the whole Word of God and the writings of the most ancient teachers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, 1560, Point 7, §4: The Papists Abolish the True Intercession of Jesus Christ</span></figcaption>

</figure><figure class="quote" id="q-bffd5fb0a7" data-kw="">
<blockquote><p>Thus, when the Pope usurps the triple office of Christ, he destroys Christ’s gospel by his own traditions, also destroying Christ’s redemption by his own indulgences, purgatory, masses, and rewards; all this while verbally professing Jesus to be the Christ. Notwithstanding his profession, he must be regarded as having denied Christ, together with the Father, by his very deeds and works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 58</span></figcaption>

<blockquote><p>I had almost determined to be silent concerning the Innocents, as they call them; for although I could muster something like an army of them, it might always be alleged that there is nothing in this contradictory to history, because their exact number has not been defined. Therefore, I will say nothing of their numbers. Only let it be observed, that there is not a region of the world where some of them are not said to exist. I would ask, however, in what manner, after so long an interval, their graves were discovered, more especially as they were not regarded as saints till Herod slew them. I would also ask, when were they brought hither? The only answer which can be given is, that it was five or six hundred years after their death. Any person, however ignorant and illiterate, may judge what the result will be if credit is given to such wild dreams. Moreover, even if these Innocents could have been discovered, how could such a number of their bodies have been imported into France, Germany, and Italy, so as to be distributed amongst cities so remote from each other? This imposture, therefore, I leave as clearly established. As Lawrence is included in the list of ancient martyrs, we will here assign a place to him. I do not know, indeed, that his body is in more than one place, viz., at Rome, in the church which bears his name; but there is a separate vase filled with his ashes, and likewise two jugs, the one filled with his blood, and the other with his fat. Moreover, an arm and bones are in the church which bears the name of Palisperna, and other relics in the church of St Sylvester. But were all the bones collected which are in France alone, I have no doubt that two complete bodies might be formed out of them. There also is the gridiron on which he was roasted, although Palisperna, which we have mentioned, boasts of having a fragment of it. In regard to the gridiron I could pardon them; but there are other more notable relics as to which it were unlawful to be silent, I mean the coals which are shown at the church of St Eustathius, and the towel with which an angel is said to have wiped his body. Since they have idled away their time in devising dreams of this nature to impose upon the world, let those who read this Admonition take time for due consideration, and, by so doing, consult for themselves, and guard against being so imposed upon in future. Of the same manufacture is the dalmatic, which is also shown at Rome, in the church of St Barbara. Having heard that Lawrence was a deacon, they imagined that he decked himself in a vesture similar to that which metamorphoses their deacons when they play their part in the mass. But the office of deacon in the ancient Church was a very different thing from what it now is in the Papacy. Deacons were then elected to take charge of the poor and distribute alms, not to be a kind of stage-players, and, consequently, had no need whatever of dalmatics or similar maskings. To Lawrence we will join Gervasius and Protasius, whose tomb existed at Milan in the days of Ambrose, as he himself testifies, and likewise Jerome, Augustine, and many others. Accordingly, the Milanese even now lay claim to their bodies, which are nevertheless at Brissac, in Germany, and at Besançon, in the church of St Peter, besides an endless number of fragments scattered up and down in various churches of the world. Each of them must, therefore, have had at least three or four bodies, or we must discard the bones which now falsely pass under their name. In assigning to Sebastian the office of curing the plague, their object was to bring him into high esteem, and so make him be more eagerly sought after. The consequence has been, that his one body has been multiplied into four bodies, one of which is at Rome, in the church of St Lawrence, a second at Soissons, a third at Pilignum, in Brittany, and a fourth near Narbonne, the place of his birth. He has, moreover, two heads—one at Rome, in the church of St Peter, and another at Toulouse, in the possession of the Dominicans. Both heads, however, are empty, if credit is to be given to the Franciscans of Angers, who give out that they have his brain. Nay, these Dominicans have also an arm. There is also another at Toulouse, in the church of Saturninus, another at Casede, in Auvergne, another at Brissac, in Germany, beside minute fragments which exist in various churches. When all these things have been well considered, let any one guess where the body of Sebastian really is. Not contented, however, with these, they have made relics of the arrows with which he was pierced. One of them is shown at Lambesc, in Provence, another at Poictiers, while others are scattered up and down in various places. The whole makes it plain that they had taken it for granted that they were never to be called to account for their impostures. John Calvin, Theodore Beza, and Henry Beveridge, Tracts Relating to the Reformation, vol. 1 (Edinburgh: Calvin Translation Society, 1844), 332–334.</p></blockquote>

<blockquote><p>1. What this Covenant is. You must know, that there is a double covenant, there is a covenant of works, and a covenant of grace: The covenant of works runs in these terms: “Do this and you shall live, and I will be your God.” This is the covenant that was made with Adam and the covenant that is expressed by Moses in the Moral Law, “Do this and live.” The second is the covenant of grace, and that runs in these terms: “You shall believe, you shalt take my Son for your Lord, and your Savior, and you shall likewise receive the gift of righteousness, which was wrought by him, for an absolution for your sins, for a reconciliation with me, and thereupon thou shall grow up in love and obedience towards me and then I will be your God, and you shall be my people.” This is the covenant of grace, “you shall believe, and take my Son and accept of the gift of righteousness” and “I will be your God.” The difference between them you shall find, 2 Cor. 3. where you shall see 3 differences, to reduce them to those heads, I will not trouble you with particular places, lest I stay too long upon them. The first covenant “was a ministration of the letter,” that is, in the first covenant, there was no more heard nor seen, but the naked commandment it was written in Tables of stone, and presented to them, there went with it no aptness, no disposition to keep it: they heard what the Law was, they saw what God required, but there was no more, and those that were declarers of it, were but the ministers of the Letter, and not of the Spirit. Secondly, this covenant, it brings only a servile fear, and enmity: for when a man looks upon the Author of this covenant, and he hears no more but the Law, and what it requires: he looks upon God, as a hard Master, as an enemy; again, he looks upon his Law as a hard and cruel Law, as a heavy yoke, as an unsupportable bondage, and therefore he hates it, and wishes there were no such Law; he runs from it, as a Bond slave runs from his Master, as far as it is in his power. This is that which is said, Gal 4. Hagar genders to bondage, that is, the covenant of works begets bond-men, and slaves, and not sons and freemen; and likewise that, Heb. 12:18. says the Apostle, “You are not come to Mount Sinai, to the burning of fire, to clouds, to darkness, to tempest, to the sound of a trumpet, so that Moses himself did quake and tremble.” That is, when a man looks upon this covenant of works, it causes in him a fear and enmity, that is the 2nd difference. The third is, That it is a ministration of death, as it is called, 2 Cor. 3. a ministration of death, that is, it propounds a curse to all those that do not keep it, and shews no means to avoid it: and therefore a man is affected to it, and to God the Author of it, as one is to an enemy that seeks his destruction; and therefore the ministration of it is said to be the ministration of death. The reason of this is, not because there is any ill in the Law, it is a ministration of the letter, it begets fear and enmity, it is a ministration of death: I say, this arises not from hence, that the Law of God is a cruel deadly Law: (for the Law is good) but it arises from the weakness, and the infirmity of the flesh: As for example, if you would take a potter’s vessel, and dash it against the firm Wall, the reason why the Wall is the destruction of the Vessel, is not any infirmity or weakness in the wall, for it is the excellency and virtue of the Wall to be hard, it should be so; but it is the weakness and fragility, and brittleness of the vessel, and thence comes it to be broken asunder, and so in this case, the reason why this Law or Covenant of works is a ministration of death, and of enmity, it is not because there is any imperfection in the law, it arises rather from the perfection of it, but it is from the weakness of the flesh that is not able to keep the law? it is the excellency of the aw, that it is so perfect, that a man is not able to keep it: it arises, I say, from the weakness and infirmity of the flesh, that is not able to observe this law. First, is a ministration of the Spirit, and not of the letter. Secondly, a ministration of love, not of enmity; of freedom, not of bondage; it is a ministration of righteousness, as it is there called the ministration of righteousness; for if the ministration of condemnation were glorious, much more shall the ministration of righteousness exceed in glory. Thirdly, a ministration of life and justification, and not a ministration of death and condemnation. The ground of this, and how it is thus, we shall show you, expressing to you the order how these depend, and follow one upon the other: when a man hath looked upon the covenant of works, and sees death in it, sees a strict law that he is not able to keep: then comes the covenant of grace, and shows to him a righteousness to satisfy that law that himself never wrought, shows him a way of obtaining pardon and remission for the sins that he hath committed against this law, by the death and satisfaction of another: when he sees this, he sees withal the goodness and mercy of God, giving this to him for his salvation out of his free grace and mercy: and when he sees it, the opinion, of a sinner is changed, mark; I say, his opinion, his disposition, and affection is altered, he looks not on God now as upon a hard and cruel Master, but he looks upon him now as a God exceeding full of mercy and compassion: whence this follows, that his heart melts toward the Lord, it relents, it comes to be a soft heart, that is easy and tractable, it is not haled now to the commandment, but out of an ingenuity and willingness he comes and serves the LORD, with alacrity and cheerfulness: the disposition is wrought in him, because now he sees another way, his apprehension is altered, even as a servant when it is revealed to him that he is a son, and that those hard tasks that are laid on him, are the best way to lead him to happiness, they are but rules of direction, for his own wealth, and for his own advantage, he doth them now with all willingness, the case is altered, he looks not now upon the Law of God as an enemy, or as a hard bondage, but he looks upon all the law of God as a wholesome and profitable rule of direction, that he is willing to keep for his own comfort: now, when the heart is thus softened, then the Spirit of God is sent into his heart, and writes the Law of God in his inward parts; as you shall see if you compare these two places together, Heb. 8. 8. 9. 10. “Behold, says the Lord, I will make a new covenant and this is the Testament that I will make with the house of Israel: After those days saith the Lord, I will put my laws into their minds and in their hearts will I write them; and I will be….” [the following pages are missing in the typescript].</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. What this Covenant is. You must know, that there is a double covenant, there is a covenant of works, and a covenant of grace: The covenant of works runs in these terms: “Do this and you shall live, and I will be your God.” This is the covenant that was made with Adam and the covenant that is expressed by Moses in the Moral Law, “Do this and live.” The second is the covenant of grace, and that runs in these terms: “You shall believe, you shalt take my Son for your Lord, and your Savior, and you shall likewise receive the gift of righteousness, which was wrought by him, for an absolution for your sins, for a reconciliation with me, and thereupon thou shall grow up in love and obedience towards me and then I will be your God, and you shall be my people.” This is the covenant of grace, “you shall believe, and take my Son and accept of the gift of righteousness” and “I will be your God.” The difference between them you shall find, 2 Cor. 3. where you shall see 3 differences, to reduce them to those heads, I will not trouble you with particular places, lest I stay too long upon them. The first covenant “was a ministration of the letter,” that is, in the first covenant, there was no more heard nor seen, but the naked commandment it was written in Tables of stone, and presented to them, there went with it no aptness, no disposition to keep it: they heard what the Law was, they saw what God required, but there was no more, and those that were declarers of it, were but the ministers of the Letter, and not of the Spirit. Secondly, this covenant, it brings only a servile fear, and enmity: for when a man looks upon the Author of this covenant, and he hears no more but the Law, and what it requires: he looks upon God, as a hard Master, as an enemy; again, he looks upon his Law as a hard and cruel Law, as a heavy yoke, as an unsupportable bondage, and therefore he hates it, and wishes there were no such Law; he runs from it, as a Bond slave runs from his Master, as far as it is in his power. This is that which is said, Gal 4. Hagar genders to bondage, that is, the covenant of works begets bond-men, and slaves, and not sons and freemen; and likewise that, Heb. 12:18. says the Apostle, “You are not come to Mount Sinai, to the burning of fire, to clouds, to darkness, to tempest, to the sound of a trumpet, so that Moses himself did quake and tremble.” That is, when a man looks upon this covenant of works, it causes in him a fear and enmity, that is the 2nd difference. The third is, That it is a ministration of death, as it is called, 2 Cor. 3. a ministration of death, that is, it propounds a curse to all those that do not keep it, and shews no means to avoid it: and therefore a man is affected to it, and to God the Author of it, as one is to an enemy that seeks his destruction; and therefore the ministration of it is said to be the ministration of death. The reason of this is, not because there is any ill in the Law, it is a ministration of the letter, it begets fear and enmity, it is a ministration of death: I say, this arises not from hence, that the Law of God is a cruel deadly Law: (for the Law is good) but it arises from the weakness, and the infirmity of the flesh: As for example, if you would take a potter’s vessel, and dash it against the firm Wall, the reason why the Wall is the destruction of the Vessel, is not any infirmity or weakness in the wall, for it is the excellency and virtue of the Wall to be hard, it should be so; but it is the weakness and fragility, and brittleness of the vessel, and thence comes it to be broken asunder, and so in this case, the reason why this Law or Covenant of works is a ministration of death, and of enmity, it is not because there is any imperfection in the law, it arises rather from the perfection of it, but it is from the weakness of the flesh that is not able to keep the law? it is the excellency of the aw, that it is so perfect, that a man is not able to keep it: it arises, I say, from the weakness and infirmity of the flesh, that is not able to observe this law. First, is a ministration of the Spirit, and not of the letter. Secondly, a ministration of love, not of enmity; of freedom, not of bondage; it is a ministration of righteousness, as it is there called the ministration of righteousness; for if the ministration of condemnation were glorious, much more shall the ministration of righteousness exceed in glory. Thirdly, a ministration of life and justification, and not a ministration of death and condemnation. The ground of this, and how it is thus, we shall show you, expressing to you the order how these depend, and follow one upon the other: when a man hath looked upon the covenant of works, and sees death in it, sees a strict law that he is not able to keep: then comes the covenant of grace, and shows to him a righteousness to satisfy that law that himself never wrought, shows him a way of obtaining pardon and remission for the sins that he hath committed against this law, by the death and satisfaction of another: when he sees this, he sees withal the goodness and mercy of God, giving this to him for his salvation out of his free grace and mercy: and when he sees it, the opinion, of a sinner is changed, mark; I say, his opinion, his disposition, and affection is altered, he looks not on God now as upon a hard and cruel Master, but he looks upon him now as a God exceeding full of mercy and compassion: whence this follows, that his heart melts toward the Lord, it relents, it comes to be a soft heart, that is easy and tractable, it is not haled now to the commandment, but out of an ingenuity and willingness he comes and serves the LORD, with alacrity and cheerfulness: the disposition is wrought in him, because now he sees another way, his apprehension is altered, even as a servant when it is revealed to him that he is a son, and that those hard tasks that are laid on him, are the best way to lead him to happiness, they are but rules of direction, for his own wealth, and for his own advantage, he doth them now with all willingness, the case is altered, he looks not now upon the Law of God as an enemy, or as a hard bondage, but he looks upon all the law of God as a wholesome and profitable rule of direction, that he is willing to keep for his own comfort: now, when the heart is thus softened, then the Spirit of God is sent into his heart, and writes the Law of God in his inward parts; as you shall see if you compare these two places together, Heb. 8. 8. 9. 10. “Behold, says the Lord, I will make a new covenant and this is the Testament that I will make with the house of Israel: After those days saith the Lord, I will put my laws into their minds and in their hearts will I write them; and I will be….” [the following pages are missing in the typescript].”

— John Preston, The New Covenant or The Saints Portion (London, 1639), 314–18. [spelling and punctuation modernized]">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+What+this+Covenant+is.+You+must+know%2C+that+there+is+a+double+covenant%2C+there+is+a+covenant+of+works%2C+and+a+covenant+of+grace%3A+The+covenant+of+works+runs+in+these+terms%3A+%E2%80%9CDo+this+and+you+shall+live%2C+and+I+will+be+your+God.%E2%80%9D+This+is+the+covenant+that+was+made+with+Adam+and+the+covenant+that+is+expressed+by+Moses+in+the+Moral+Law%2C+%E2%80%9CDo+this+and+live.%E2%80%9D+The+second+is+the+covenant+of+grace%2C+and+that+runs+in+these+terms%3A+%E2%80%9CYou+shall+believe%2C+you+shalt+take+my+Son+for+your+Lord%2C+and+your+Savior%2C+and+you+shall+likewise+receive+the+gift+of+righteousness%2C+which+was+wrought+by+him%2C+for+an+absolution+for+your+sins%2C+for+a+reconciliation+with+me%2C+and+thereupon+thou+shall+grow+up+in+love+and+obedience+towards+me+and+then+I+will+be+your+God%2C+and+you+shall+be+my+people.%E2%80%9D+This+is+the+covenant+of+grace%2C+%E2%80%9Cyou+shall+believe%2C+and+take+my+Son+and+accept+of+the+gift+of+righteousness%E2%80%9D+and+%E2%80%9CI+will+be+your+God.%E2%80%9D+The+difference+between+them+you+shall+find%2C+2+Cor.+3.+where+you+shall+see+3+differences%2C+to+reduce+them+to+those+heads%2C+I+will+not+trouble+you+with+particular+places%2C+lest+I+stay+too+long+upon+them.+The+first+covenant+%E2%80%9Cwas+a+ministration+of+the+letter%2C%E2%80%9D+that+is%2C+in+the+first+covenant%2C+there+was+no+more+heard+nor+seen%2C+but+the+naked+commandment+it+was+written+in+Tables+of+stone%2C+and+presented+to+them%2C+there+went+with+it+no+aptness%2C+no+disposition+to+keep+it%3A+they+heard+what+the+Law+was%2C+they+saw+what+God+required%2C+but+there+was+no+more%2C+and+those+that+were+declarers+of+it%2C+were+but+the+ministers+of+the+Letter%2C+and+not+of+the+Spirit.+Secondly%2C+this+covenant%2C+it+brings+only+a+servile+fear%2C+and+enmity%3A+for+when+a+man+looks+upon+the+Author+of+this+covenant%2C+and+he+hears+no+more+but+the+Law%2C+and+what+it+requires%3A+he+looks+upon+God%2C+as+a+hard+Master%2C+as+an+enemy%3B+again%2C+he+looks+upon+his+Law+as+a+hard+and+cruel+Law%2C+as+a+heavy+yoke%2C+as+an+unsupportable+bondage%2C+and+therefore+he+hates+it%2C+and+wishes+there+were+no+such+Law%3B+he+runs+from+it%2C+as+a+Bond+slave+runs+from+his+Master%2C+as+far+as+it+is+in+his+power.+This+is+that+which+is+said%2C+Gal+4.+Hagar+genders+to+bondage%2C+that+is%2C+the+covenant+of+works+begets+bond-men%2C+and+slaves%2C+and+not+sons+and+freemen%3B+and+likewise+that%2C+Heb.+12%3A18.+says+the+Apostle%2C+%E2%80%9CYou+are+not+come+to+Mount+Sinai%2C+to+the+burning+of+fire%2C+to+clouds%2C+to+darkness%2C+to+tempest%2C+to+the+sound+of+a+trumpet%2C+so+that+Moses+himself+did+quake+and+tremble.%E2%80%9D+That+is%2C+when+a+man+looks+upon+this+covenant+of+works%2C+it+causes+in+him+a+fear+and+enmity%2C+that+is+the+2nd+difference.+The+third+is%2C+That+it+is+a+ministration+of+death%2C+as+it+is+called%2C+2+Cor.+3.+a+ministration+of+death%2C+that+is%2C+it+propounds+a+curse+to+all+those+that+do+not+keep+it%2C+and+shews+no+means+to+avoid+it%3A+and+therefore+a+man+is+affected+to+it%2C+and+to+God+the+Author+of+it%2C+as+one+is+to+an+enemy+that+seeks+his+destruction%3B+and+therefore+the+ministration+of+it+is+said+to+be+the+ministration+of+death.+The+reason+of+this+is%2C+not+because+there+is+any+ill+in+the+Law%2C+it+is+a+ministration+of+the+letter%2C+it+begets+fear+and+enmity%2C+it+is+a+ministration+of+death%3A+I+say%2C+this+arises+not+from+hence%2C+that+the+Law+of+God+is+a+cruel+deadly+Law%3A+%28for+the+Law+is+good%29+but+it+arises+from+the+weakness%2C+and+the+infirmity+of+the+flesh%3A+As+for+example%2C+if+you+would+take+a+potter%E2%80%99s+vessel%2C+and+dash+it+against+the+firm+Wall%2C+the+reason+why+the+Wall+is+the+destruction+of+the+Vessel%2C+is+not+any+infirmity+or+weakness+in+the+wall%2C+for+it+is+the+excellency+and+virtue+of+the+Wall+to+be+hard%2C+it+should+be+so%3B+but+it+is+the+weakness+and+fragility%2C+and+brittleness+of+the+vessel%2C+and+thence+comes+it+to+be+broken+asunder%2C+and+so+in+this+case%2C+the+reason+why+this+Law+or+Covenant+of+works+is+a+ministration+of+death%2C+and+of+enmity%2C+it+is+not+because+there+is+any+imperfection+in+the+law%2C+it+arises+rather+from+the+perfection+of+it%2C+but+it+is+from+the+weakness+of+the+flesh+that+is+not+able+to+keep+the+law%3F+it+is+the+excellency+of+the+aw%2C+that+it+is+so+perfect%2C+that+a+man+is+not+able+to+keep+it%3A+it+arises%2C+I+say%2C+from+the+weakness+and+infirmity+of+the+flesh%2C+that+is+not+able+to+observe+this+law.+First%2C+is+a+ministration+of+the+Spirit%2C+and+not+of+the+letter.+Secondly%2C+a+ministration+of+love%2C+not+of+enmity%3B+of+freedom%2C+not+of+bondage%3B+it+is+a+ministration+of+righteousness%2C+as+it+is+there+called+the+ministration+of+righteousness%3B+for+if+the+ministration+of+condemnation+were+glorious%2C+much+more+shall+the+ministration+of+righteousness+exceed+in+glory.+Thirdly%2C+a+ministration+of+life+and+justification%2C+and+not+a+ministration+of+death+and+condemnation.+The+ground+of+this%2C+and+how+it+is+thus%2C+we+shall+show+you%2C+expressing+to+you+the+order+how+these+depend%2C+and+follow+one+upon+the+other%3A+when+a+man+hath+looked+upon+the+covenant+of+works%2C+and+sees+death+in+it%2C+sees+a+strict+law+that+he+is+not+able+to+keep%3A+then+comes+the+covenant+of+grace%2C+and+shows+to+him+a+righteousness+to+satisfy+that+law+that+himself+never+wrought%2C+shows+him+a+way+of+obtaining+pardon+and+remission+for+the+sins+that+he+hath+committed+against+this+law%2C+by+the+death+and+satisfaction+of+another%3A+when+he+sees+this%2C+he+sees+withal+the+goodness+and+mercy+of+God%2C+giving+this+to+him+for+his+salvation+out+of+his+free+grace+and+mercy%3A+and+when+he+sees+it%2C+the+opinion%2C+of+a+sinner+is+changed%2C+mark%3B+I+say%2C+his+opinion%2C+his+disposition%2C+and+affection+is+altered%2C+he+looks+not+on+God+now+as+upon+a+hard+and+cruel+Master%2C+but+he+looks+upon+him+now+as+a+God+exceeding+full+of+mercy+and+compassion%3A+whence+this+follows%2C+that+his+heart+melts+toward+the+Lord%2C+it+relents%2C+it+comes+to+be+a+soft+heart%2C+that+is+easy+and+tractable%2C+it+is+not+haled+now+to+the+commandment%2C+but+out+of+an+ingenuity+and+willingness+he+comes+and+serves+the+LORD%2C+with+alacrity+and+cheerfulness%3A+the+disposition+is+wrought+in+him%2C+because+now+he+sees+another+way%2C+his+apprehension+is+altered%2C+even+as+a+servant+when+it+is+revealed+to+him+that+he+is+a+son%2C+and+that+those+hard+tasks+that+are+laid+on+him%2C+are+the+best+way+to+lead+him+to+happiness%2C+they+are+but+rules+of+direction%2C+for+his+own+wealth%2C+and+for+his+own+advantage%2C+he+doth+them+now+with+all+willingness%2C+the+case+is+altered%2C+he+looks+not+now+upon+the+Law+of+God+as+an+enemy%2C+or+as+a+hard+bondage%2C+but+he+looks+upon+all+the+law+of+God+as+a+wholesome+and+profitable+rule+of+direction%2C+that+he+is+willing+to+keep+for+his+own+comfort%3A+now%2C+when+the+heart+is+thus+softened%2C+then+the+Spirit+of+God+is+sent+into+his+heart%2C+and+writes+the+Law+of+God+in+his+inward+parts%3B+as+you+shall+see+if+you+compare+these+two+places+together%2C+Heb.+8.+8.+9.+10.+%E2%80%9CBehold%2C+says+the+Lord%2C+I+will+make+a+new+covenant+and+this+is+the+Testament+that+I+will+make+with+the+house+of+Israel%3A+After+those+days+saith+the+Lord%2C+I+will+put+my+laws+into+their+minds+and+in+their+hearts+will+I+write+them%3B+and+I+will+be%E2%80%A6.%E2%80%9D+%5Bthe+following+pages+are+missing+in+the+typescript%5D.%E2%80%9D%0A%0A%E2%80%94+John+Preston%2C+The+New+Covenant+or+The+Saints+Portion+%28London%2C+1639%29%2C+314%E2%80%9318.+%5Bspelling+and+punctuation+modernized%5D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F779c3f5d94.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/779c3f5d94.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/01/preston-on-the-distinction-between-the-covenants-of-works-and-grace/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>But as touching these ceremonies in question, we are upon evident grounds persuaded in our consciences that they are both unlawful and inexpedient for our Church: and though they were lawful in themselves, yet we may answer as the oppugners of the Interim [1548] replied to those who urged yielding to the ceremonies of the same (Friedrich Balduin [a Lutheran], On Cases of Conscience, bk. 4, ch. 11, case 3), surplice, holy days, tapers [candles], etc. because of the emperor’s commandment. That the question is not about things indifferent, but about a main article of faith, namely Christian Liberty, which admits not any yoke to be imposed upon the conscience, no not in things indifferent.</p></blockquote>

<blockquote><p>3. We acknowledge different opinions between Lutherans and Calvinians; so no doubt there are different opinions among the Lutherans themselves, and the Calvinians themselves, but we utterly deny there are different religions. The Lutherans we hold to be true Churches, agreeing with us in the fundamental points of faith, and likewise in being free from idolatry; for albeit they have images in their churches, which we conceive to be a very dangerous thing, yet they do not worship them; and although they hold real presence in the sacrament, yet they do not adore it. So that albeit we think some of their opinions are contrary to the Scripture, and they think the like of some of ours, yet neither we say of their religion, nor they of ours I trow, that it is contrary to the Scripture, much less that it is condemned in Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doubting Conscience Resolved, in answer to a (pretended) perplexing question, etc. Wherein is evidently proved that the holy Scriptures (not the Pope) is the foundation whereupon the Church is built (London: 1652)</cite>, pp. 27-28</span></figcaption>

<div class="actions"><button class="copy" data-copy="“3. We acknowledge different opinions between Lutherans and Calvinians; so no doubt there are different opinions among the Lutherans themselves, and the Calvinians themselves, but we utterly deny there are different religions. The Lutherans we hold to be true Churches, agreeing with us in the fundamental points of faith, and likewise in being free from idolatry; for albeit they have images in their churches, which we conceive to be a very dangerous thing, yet they do not worship them; and although they hold real presence in the sacrament, yet they do not adore it. So that albeit we think some of their opinions are contrary to the Scripture, and they think the like of some of ours, yet neither we say of their religion, nor they of ours I trow, that it is contrary to the Scripture, much less that it is condemned in Scripture.”

<blockquote><p>As for public prayers, there are two kinds of them—the one is expressed in words only, the other with song; and this is no recent invention, for from the first origin of the church, this has been the case, as appears in history. And even St. Paul does not speak of verbal prayer alone, but also of singing. And in truth, we know by experience that song has great force and power in moving and inflaming the heart of man to invoke and praise God with more vehement and ardent zeal. It should always be seen to that the song should not be light and frivolous, but that it have weight and majesty, as saith St. Augustine; and also that there is a great difference between the music that is employed for the enjoyment of men at table, and in their houses, and the psalms which they sing in church in the presence of God and his angels. But when the form here given is rightly judged of, we hope that it will be found holy and pure; seeing that it is simply constructed for the edification of which we have spoken, as well as that the use of singing may be greatly extended. So that even in the houses and in the fields, it may be to us an incitement and an instrument or means to praise God and raise our hearts to him; and to console us in meditating on his power, goodness, wisdom, and justice, which is more necessary for us than we know how to express. For the first, it is not without cause that the Holy Spirit exhorts us so carefully, by the Holy Scripture, to rejoice ourselves in God, and that all our joy should rest there as its true end. For he knows how truly we are inclined to please ourselves in vanity. Thus while our nature draws and leads us to seek all means of foolish and vicious enjoyment—on the contrary, our Lord, to separate and draw us from the allurements of the flesh and of the world, presents to us every possible means to fill us with that spiritual joy which he commends so much to us. But amongst other things which are suitable for the recreation of men, and for yielding them pleasure, music is either the first, or one of the chief, and we must esteem it a gift of God bestowed for that end. Therefore, by so much the more, we ought to see that it is not abused, for fear of soiling and contaminating it; turning that to our condemnation which was given for our profit and good. Even were there no other consideration than this alone, it ought to move us to regulate the use of music, so as to make it subservient to all good morals, and that it should not give occasion for loosing the bridle of dissoluteness, that it should not lead to voluptuousness, nor be the instrument of immodesty and impurity. But further, there is scarcely anything in this world which can more powerfully turn or bend hither and thither the manners of men, as Plato has wisely remarked. And in fact we experimentally feel that it has a secret and incredible power over our hearts to move them one way or other. Therefore we ought to be so much the more careful to regulate it in such a manner, that it may be useful to us, and in no ways pernicious. For this reason, the ancient doctors of the church often complained that the people of their time were addicted to disgraceful and immodest songs, which, not without cause, they esteemed and called a deadly and Satanic poison for corrupting the world. But in speaking of music, I include two parts, to wit, the words, or subject and matter; secondly, the song or melody. It is true that all evil words, as saith St. Paul, corrupt good manners, but when melody is united to them, they much more powerfully pierce the heart, and enter in: just as when by a funnel wine is poured into a vessel, so poison and corruption is infused into the depth of the heart by the melody. What then is to be done? It is to have songs not only pure, but also holy, that they may be incitements to stir us up to pray to and praise God, and to meditate on his works, in order to love him, fear him, honour and glorify him. But what St. Augustine says is true, that none can sing things worthy of God but he who has received power from himself. Wherefore when we have sought all round, searching here and there, we shall find no songs better and more suitable for this end than the Psalms of David which the Holy Spirit dictated and gave to him. And therefore when we sing them, we are as certain that God has put words into our mouths as if he himself sang within us to exalt his glory. Wherefore Chrysostom exhorts all men and women and little children to accustom themselves to sing them as a means of associating themselves with the company of angels; further, we must remember what St. Paul says, that spiritual songs cannot be sung well but with the heart; but the heart requires the understanding: and in that saith St. Augustine lies the difference between the song of man and that of birds, for a linnet, a nightingale, and a jay, may sing well, but it will be without understanding. But the peculiar gift of man is to sing knowing what he says. Further, the understanding ought to accompany the heart and affections, which cannot be unless we have the song imprinted in our memory, that we may be ever singing it. This present book [the Genevan Psalter, 1543], for this cause, besides what otherwise has been said, ought to be particularly acceptable to every one who desires, without reproach, and according to God, to rejoice in seeing his own salvation, and the good of his neighbours; and thus has no need to be much recommended by me, as it carries in itself its own value and praise. Only let the world be well advised, that instead of songs partly vain and frivolous, partly foolish and dull, partly filthy and vile, and consequently wicked and hurtful, which it has heretofore used, it should accustom itself hereafter to sing these heavenly and divine songs, with good king David. Touching the music, it appeared that it should be simple in the way we have put it, to carry weight and majesty suitable to the subject, and even fit to be sung in church as has been said.</p></blockquote>

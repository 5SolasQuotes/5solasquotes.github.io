<main class="wrap"><figure class="quote" id="q-afadbdd95b" data-kw="">
<blockquote><p>The human understanding is the ear to which the Word of God speaks, and if it be but so spoken as that that ear may plainly hear it, it is enough. God is sovereign as to the manner of revealing his mind, whether he will reveal it by saying it in express terms or whether we can perceive it by laying several things that he has said together. If his mind be but revealed, it is sufficient for us if there be but sufficient means for the communication of his mind to our minds, whether we hear so many express words with our ears or see them with our eyes or see by the eye of reason and understanding the thing that he would signify to us.

Who can say that if that had been the mind of God that we should keep the first day of the week, he would have commanded it in express terms, as he did the keeping the seventh day of old? Indeed, if God had so made our faculties that we were not capable of receiving a revelation of God’s mind in any other way, then there would be some reason to say so. But God has given such understanding that we are capable of receiving a revelation when made in another manner. And if God deals with [us] agreeably to our natures and in a way proportionable to our capacities, it is enough.

And if God any way whatsoever discovers his mind in a way proportionable to our faculties, we are obliged to obedience, and God may expect our notice and observance [of] his revelation in the same manner as if he had revealed it in express terms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetuity and Change of the Sabbath</cite>, (1730-31) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), p. 224.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2bef3fc579" data-kw="">
<blockquote><p>As the authority of the Law and the priesthood is the same, Christ became not only a priest, but also a Lawgiver; so that the right of Aaron, as well as of Moses, was transferred to him. The sum of the whole is, that the ministry of Moses was no less temporary than that of Aaron; and hence both were annulled by the coming of Christ, for the one could not stand without the other. By the word Law, we understand what peculiarly belonged to Moses; for the Law contains the rule of life, and the gratuitous covenant of life; and in it we find everywhere many remarkable sentences by which we are instructed as to faith, and as to the fear of God. None of these were abolished by Christ, but only that part which regarded the ancient priesthood.

For Christ is here compared with Moses; whatever then they had in common, is not to be taken to the account, but only the things in which they differ. They in common offer God’s mercy to us, prescribe the rule of a holy and godly life, teach us the true worship of God, and exhort us to exercise faith and patience, and all the duties of godliness. But Moses was different from Christ in this respect, that while the love of the Gospel was not as yet made known, he kept the people under veils, set forth the knowledge of Christ by types and shadows, and, in short, accommodated himself to the capacity of ignorant people, and did not rise higher than to puerile elements. We must then remember, that the Law is that part of the ministration which Moses had as peculiarly his own, and different from that of Christ. That law, as it was subordinate to the ancient priesthood, was abolished when the priesthood was abolished. And Christ, being made a priest, was invested also with the authority of a legislator, that he might be the teacher and interpreter of the new covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the epistle of Paul the apostle to the Hebrews</cite>, trans. John Owen (1549; n.p. 1853) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, p. 167.</span></figcaption>

</figure><figure class="quote" id="q-18829d8add" data-kw="">
<blockquote><p>But inasmuch as the apostles, 1 Cor. xi. 1, who followed Christ, and delivered nothing but what they received from Christ, 1 Cor. xi. 23, xiv. 37, did observe this day as a Sabbath, 1 Cor. xvi. 1, 2; what can this argue but a divine institution of this day? The apostle Paul might have chosen any other day, for the people to assemble to hear the word, and receive the sacrament: but they assembled to receive the sacrament, and to hear the word, upon the first day of the week, which is our Lord’s day, Acts xx. 6, 7. Now the approved practice of the apostles, and of the church with them, recorded in Scripture, carries with it the force of a precept.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s daily walk in holy security and peace</cite>, (1627; Philadelphia, 1800), p. 86.</span></figcaption>

</figure><figure class="quote" id="q-dd7b17c97f" data-kw="">
<blockquote><p>Verse 17… ‘Why did ye not eat?’ They ought to eat this he-goat, Lev. 6:16, which, when they were not able on account of grief, they supposed was to be burned ([Cornelius] Lapide). … Verse 19… ‘How was I able to eat, etc.?’… that is to say, I was not, therefore, worthy or fit, who should eat. See Dt. 12:7; 26:14; Hos. 9:4 ([Henry] Ainsworth). Therefore, it was to be burned, as was done with the rest (Bonfrerius)… Some maintain that Aaron justifies himself (thus Lyra, Bonfrerius). This does not satisfy; for Moses blames this. It was rather a mitigation of the crime, than a just defense ([Andrew] Willet)… Verse 20: ‘And when Moses heard that, he was content’; ‘He received satisfaction’ Hebrew: ‘it was good, etc.’ Moses received the excuse as just (Menochius, Lapide, Ainsworth). For often the letter of the Law yields to necessities: 2 Chron. 30:18, etc.; Mt. 12:3, 4 (Ainsworth). [Others deny this:] Rather in human compassion he tolerates the infirmities of Aaron (Willet out of [Martin Cellarius] Borrhaus [d. 1564]). Because Aaron had recognized the defect, and because he was unwilling to add affliction to the afflicted (Lyra); and he discerned that the evil was lesser (Willet out of Calvin).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Synopsis of Interpreters, both Critical &amp; Otherwise, of the Sacred Scripture in The Exegetical Labors of the Reverend Matthew Poole</cite>, vol. 6 (VA: Master Poole Publishing, 2011), pp. 152-54</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Verse 17… ‘Why did ye not eat?’ They ought to eat this he-goat, Lev. 6:16, which, when they were not able on account of grief, they supposed was to be burned ([Cornelius] Lapide). … Verse 19… ‘How was I able to eat, etc.?’… that is to say, I was not, therefore, worthy or fit, who should eat. See Dt. 12:7; 26:14; Hos. 9:4 ([Henry] Ainsworth). Therefore, it was to be burned, as was done with the rest (Bonfrerius)… Some maintain that Aaron justifies himself (thus Lyra, Bonfrerius). This does not satisfy; for Moses blames this. It was rather a mitigation of the crime, than a just defense ([Andrew] Willet)… Verse 20: ‘And when Moses heard that, he was content’; ‘He received satisfaction’ Hebrew: ‘it was good, etc.’ Moses received the excuse as just (Menochius, Lapide, Ainsworth). For often the letter of the Law yields to necessities: 2 Chron. 30:18, etc.; Mt. 12:3, 4 (Ainsworth). [Others deny this:] Rather in human compassion he tolerates the infirmities of Aaron (Willet out of [Martin Cellarius] Borrhaus [d. 1564]). Because Aaron had recognized the defect, and because he was unwilling to add affliction to the afflicted (Lyra); and he discerned that the evil was lesser (Willet out of Calvin).”

— Matthew Poole, A Synopsis of Interpreters, both Critical &amp; Otherwise, of the Sacred Scripture in The Exegetical Labors of the Reverend Matthew Poole, vol. 6 (VA: Master Poole Publishing, 2011), pp. 152-54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVerse+17%E2%80%A6+%E2%80%98Why+did+ye+not+eat%3F%E2%80%99+They+ought+to+eat+this+he-goat%2C+Lev.+6%3A16%2C+which%2C+when+they+were+not+able+on+account+of+grief%2C+they+supposed+was+to+be+burned+%28%5BCornelius%5D+Lapide%29.+%E2%80%A6+Verse+19%E2%80%A6+%E2%80%98How+was+I+able+to+eat%2C+etc.%3F%E2%80%99%E2%80%A6+that+is+to+say%2C+I+was+not%2C+therefore%2C+worthy+or+fit%2C+who+should+eat.+See+Dt.+12%3A7%3B+26%3A14%3B+Hos.+9%3A4+%28%5BHenry%5D+Ainsworth%29.+Therefore%2C+it+was+to+be+burned%2C+as+was+done+with+the+rest+%28Bonfrerius%29%E2%80%A6+Some+maintain+that+Aaron+justifies+himself+%28thus+Lyra%2C+Bonfrerius%29.+This+does+not+satisfy%3B+for+Moses+blames+this.+It+was+rather+a+mitigation+of+the+crime%2C+than+a+just+defense+%28%5BAndrew%5D+Willet%29%E2%80%A6+Verse+20%3A+%E2%80%98And+when+Moses+heard+that%2C+he+was+content%E2%80%99%3B+%E2%80%98He+received+satisfaction%E2%80%99+Hebrew%3A+%E2%80%98it+was+good%2C+etc.%E2%80%99+Moses+received+the+excuse+as+just+%28Menochius%2C+Lapide%2C+Ainsworth%29.+For+often+the+letter+of+the+Law+yields+to+necessities%3A+2+Chron.+30%3A18%2C+etc.%3B+Mt.+12%3A3%2C+4+%28Ainsworth%29.+%5BOthers+deny+this%3A%5D+Rather+in+human+compassion+he+tolerates+the+infirmities+of+Aaron+%28Willet+out+of+%5BMartin+Cellarius%5D+Borrhaus+%5Bd.+1564%5D%29.+Because+Aaron+had+recognized+the+defect%2C+and+because+he+was+unwilling+to+add+affliction+to+the+afflicted+%28Lyra%29%3B+and+he+discerned+that+the+evil+was+lesser+%28Willet+out+of+Calvin%29.%E2%80%9D%0A%0A%E2%80%94+Matthew+Poole%2C+A+Synopsis+of+Interpreters%2C+both+Critical+%26+Otherwise%2C+of+the+Sacred+Scripture+in+The+Exegetical+Labors+of+the+Reverend+Matthew+Poole%2C+vol.+6+%28VA%3A+Master+Poole+Publishing%2C+2011%29%2C

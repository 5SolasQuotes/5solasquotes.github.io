<main class="wrap"><figure class="quote" id="q-7677c611c5" data-kw="">
<blockquote><p>Even now, however, the proper apple of discord was only the doctrine of the Supper. The party of Flacius was of one mind on the question of predestination with those who subsequently were denominated the ‘Reformed’; and the Flacians employed predestination as a weapon to fight against the Melanchthonians, who long maintained themselves in the electorate of Saxony [which was dominated by the strict Lutherans]. Nor till a later time, during the strife about Crypto-Calvinism, did this electorate succeed in detaching itself from the moderate party in the empire. In a word, about the time of the origin of the Formula of Concord between 1570-1580, there were only two different parties; the one consisting of people who would let themselves be reasoned with on the doctrine of the Supper; and the other of such as would hear no reason on the subject. Those who were weary of the vexatious strifes, as Hesse, Anhalt and other States of the empire, joined the party led by the inhabitants of the [reformed] Palatinate, and, finally, did not accept the Formula of Concord [1570/1580]. The others shut themselves off, and formed a body that took for its shibboleth the unaltered Confession of Augsburg. It was after the Formula of Concord that the evangelicals [in Germany] clearly separated into two churches; that is, one part went its own ways and abandoned the other, which then, by rejecting the Formula of Concord but retaining the Confession of Augsburg, was gradually consolidated in the empire into churches which for the first time testified by a great historical act at Dort that they belonged to the Reformed Church, that meanwhile had arisen outside of Germany.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edouard-bohl.html">Edouard Bohl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Separation of the Lutheran Church from the Reformed in the Sixteenth Century” in Presbyterian &amp; Reformed Review</cite>, vol. 5, no. 19 (July, 1894), pp. 415-33, p. 423</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f9804783ca" data-kw="">
<blockquote><p>My design is to indicate how slowly the process ran out its course, by which a Lutheran and a Reformed Church arose in Germany in the sixteenth century… These [Lutheran and Reformed] reformations are then [popularly] thought of as like two circles, which merely touch each other; or, according to others, which really intersect, and have large segments in common, but which yetnever cover exactly the same space, or were drawn from one center… It is easy to refute this false opinion…</p></blockquote>

</figure><figure class="quote" id="q-1ae4dfd8fb" data-kw="">
<blockquote><p>I beg you, tell us whether according to your [Lutheran] ubiquity [of the human nature], if I understand with my mind and not my body and I hunger with my body and not my mind, do I therefore hunger or understand only verbally? Similarly when we say that Christ truly and suffered and died insofar as He was a man, you cannot rightly construe this as if He suffered and died only verbally… …although I deny that the Word of God really suffered and died, still I do not claim that the passion and death did not involve it at all, for the Word was present at the passion and death, as has been said, because of the hypostatic union, although in a quiescent way. It was not affected by any suffering or by a new quality. Hence it is not empty words that the Son of God suffered and died since that nature and flesh which He made his own and to which He was present by a union of Person, really and truly suffered and died. But I would never say, as you are used to asserting, that the Word [logon] Himself really and truly both suffered and died.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dialogue on the Two Natures in Christ</cite>, ed. &amp; trans. John Donnelly in The Peter Martyr Library, vol. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

<blockquote><p>8. It would be good that, as a pledge of concord, after this conference, the Holy Supper should be celebrated, in which the pastors of England, France, etc., should communicate together; and that the action should be preceded by a fast—not only of the deputies, but also of the Church in which the assembly shall be convened—in order to implore the assistance of God upon so great and so important a design. … 16. As for the sacrament and the participation of the body of Jesus Christ, I judge that one may agree upon these points [with the Lutherans]: 1. That the signs or symbols are not bare signs and simple figures destitute of reality. 2. That in the Holy Supper we truly partake of the body of Jesus Christ. 3. That the bread is not transubstantiated, and does not cease to be bread after consecration. 4. Whence it follows that the sacrament ought not to be adored, and that we must lift up our hearts on high. 5. And as for the manner of partaking of the body of Jesus Christ in the Supper, we must not inquire into it scrupulously; only hold, with the apostle, saint Paul (Eph. 3), that Christ dwells in our hearts by faith [v. 17]; whence it follows that He does not dwell in those who have no faith. And if anyone remains firm in his own opinion, yet let him bear with his brethren and not condemn them violently; only, in that wherein we are agreed, let us walk together with one accord. [Phil. 3:15-16] 17. For there are two kinds of errors: some which consist only in belief, others which, besides belief, add some outward action. Of the first kind are the errors concerning the nature of Jesus Christ, concerning Predestination and concerning Free Will. Of the second are: Communion under one kind, adoration of the Host, and prayer in a tongue not understood by him that prays. The errors of this latter kind, although very often less grave than the former, yet divide minds far more sharply, and often cause schism. For if I communicate in the sacrament with one who errs concerning predestination or the nature of Jesus Christ, or who believes that the body of the Lord is everywhere—though the error be great—nevertheless it does not disturb him who communicates with him. But if I should come to communicate with one who adores the bread, or pretends to sacrifice Jesus Christ, such an action would scandalize me and drive me away for fear of participating in idolatry or in a false sacrifice. Now we have this advantage: that with the Lutheran Churches all our differences are of the first kind; and that, as to the external matters which they practice in the Church, we have no disagreement which is not easy to compose. … 19. I would wish that in this second assembly the same order be observed as in the first, and the same respect toward his Majesty of England; and that it begin with a fast and end with the celebration of the Holy Supper, in which the Lutheran pastors and ours should communicate together. 20. To proceed to execution [of the Church union proposed], that the peoples and Churches may conform themselves to what shall have been agreed upon, it is altogether necessary that the princes promise to employ their authority to the end that these names of Lutherans, Calvinists and Sacramentarians [the Reformed] be abolished, and that our Churches be called Reformed Christian Churches; that, under heavy penalties, it be forbidden to use invective preaching against brethren, or to write any books one against another; and that the catalogue of the Frankfurt [Germany] fair be no longer burdened with injurious titles, as has been customary. That the German princes, on certain agreed days, should send of their ministers to the chief churches of neighboring [Reformed] princes [in Germany], and receive theirs in turn, and communicate together in the Holy Supper on a solemn day.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“8. It would be good that, as a pledge of concord, after this conference, the Holy Supper should be celebrated, in which the pastors of England, France, etc., should communicate together; and that the action should be preceded by a fast—not only of the deputies, but also of the Church in which the assembly shall be convened—in order to implore the assistance of God upon so great and so important a design. … 16. As for the sacrament and the participation of the body of Jesus Christ, I judge that one may agree upon these points [with the Lutherans]: 1. That the signs or symbols are not bare signs and simple figures destitute of reality. 2. That in the Holy Supper we truly partake of the body of Jesus Christ. 3. That the bread is not transubstantiated, and does not cease to be bread after consecration. 4. Whence it follows that the sacrament ought not to be adored, and that we must lift up our hearts on high. 5. And as for the manner of partaking of the body of Jesus Christ in the Supper, we must not inquire into it scrupulously; only hold, with the apostle, saint Paul (Eph. 3), that Christ dwells in our hearts by faith [v. 17]; whence it follows that He does not dwell in those who have no faith. And if anyone remains firm in his own opinion, yet let him bear with his brethren and not condemn them violently; only, in that wherein we are agreed, let us walk together with one accord. [Phil. 3:15-16] 17. For there are two kinds of errors: some which consist only in belief, others which, besides belief, add some outward action. Of the first kind are the errors concerning the nature of Jesus Christ, concerning Predestination and concerning Free Will. Of the second are: Communion under one kind, adoration of the Host, and prayer in a tongue not understood by him that prays. The errors of this latter kind, although very often less grave than the former, yet divide minds far more sharply, and often cause schism. For if I communicate in the sacrament with one who errs concerning predestination or the nature of Jesus Christ, or who believes that the body of the Lord is everywhere—though the error be great—nevertheless it does not disturb him who communicates with him. But if I should come to communicate with one who adores the bread, or pretends to sacrifice Jesus Christ, such an action would scandalize me and drive me away for fear of participating in idolatry or in a false sacrifice. Now we have this advantage: that with the Lutheran Churches all our differences are of the first kind; and that, as to the external matters which they practice in the Church, we have no disagreement which is not easy to compose. … 19. I would wish that in this second assembly the same order be observed as in the first, and the same respect toward his Majesty of England; and that it begin with a fast and end with the celebration of the Holy Supper, in which the Lutheran pastors and ours should communicate together. 20. To proceed to execution [of the Church union proposed], that the peoples and Churches may conform themselves to what shall have been agreed upon, it is altogether necessary that the princes promise to employ their authority to the end that these names of Lutherans, Calvinists and Sacramentarians [the Reformed] be abolished, and that our Churches be called Reformed Christian Churches; that, under heavy penalties, it be forbidden to use invective preaching against brethren, or to write any books one against another; and that the catalogue of the Frankfurt [Germany] fair be no longer burdened with injurious titles, as has been customary. That the German princes, on certain agreed days, should send of their ministers to the chief churches of neighboring [Reformed] princes [in Germany], and receive theirs in turn, and communicate together in the Holy Supper on a solemn day.”

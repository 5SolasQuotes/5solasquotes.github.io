<main class="wrap"><figure class="quote" id="q-f79e188641" data-kw="Stoical fate necessity">
<blockquote><p>As if we introduced a fatal and Stoical necessity; as if we would extinguish all religion in the minds of men by it, to soothe them on the bed of security and profanity or hurl them into the abyss of despair; as if we made God cruel, hypocritical and the author of sin—I shudder to relate it. Now as all these things are perfectly false, they ought unquestionably to be refuted by a sober and healthy exhibition of this doctrine from the word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.6.6</span></figcaption>

</figure><figure class="quote" id="q-a923204566" data-kw="Permission Author of sin The Fall">
<blockquote><p>God acted nothing, but only ceased to act, and therefore could not be the efficient cause of man’s sin. As God is not the author of good but by willing and effecting it, so he is not the author of evil but by willing and effecting it. But he doth not positively will evil, nor effect it by any efficacy of his own. Permission is no action, nor the cause of that action which is permitted, but the will of that person who is permitted to do such an action is the cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Holiness of God</span></figcaption>

</figure><figure class="quote" id="q-858e5287fa" data-kw="Author of sin">
<blockquote><p>There is a fallacy of the accident in the minor proportion; for the actions of the wicked are sins, not (per se) in themselves, in as far as they are actions; but by an accident on account of the want of righteousness, and of the perversity of the will of the ungodly, who do not observe this so as to follow in the action the will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 27 (on providence)</span></figcaption>

</figure><figure class="quote" id="q-12a63f8296" data-kw="Author of sin Depravity">

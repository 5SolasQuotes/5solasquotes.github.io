<blockquote><p>6. It is also false and absurd which they [Separatists] say touching the authority of the classis [presbytery], that it is such ‘as does not become any except the apostles, that could not err, to have.’ But it is the less marvel that these men do speak on this manner when as they see Mr. [John] Davenport himself going before them and using a much-like-speech in his letter to the classis touching his consent required to the writing of the five ministers, namely that: ‘such a subjection is greater than may be yielded unto any council, whether of classis or synods, etc. that thereby the writings and decrees of men are made infallible, and equal with the Word of God, which is intolerable.’ But what wise man is there that sees not the strange folly and vanity of such assertions as these? Is no truth uttered or described by men in our times, whereunto the consent of men may be required, because there be now no apostles? Do not all Reformed Churches at this day require a subscription unto their confessions of faith in the several articles thereof? Do they hereby make their writings of equal authority with the Word of God, and themselves equal to the apostles that could not err? It is far from them. Neither Mr. Davenport, nor these complainants, shall ever be able to justify these slanderous complaints. Nay, if this were true, how could Mr. Davenport subscribe his name unto his own writing sent unto the classis, to show his consent unto it? Did he thereby make himself an apostle or his writing equal with the Word of God? Why may we not show our consent and subscribe to other writings of men upon persuasion of the truth so appearing unto us, as well as he subscribed to his own? They are so far from proving these assertions that they offer not to go about it; we acknowledge there is no judicatory on earth, either civil or ecclesiastical, either of consistory, classis or synod, but they are subject to error: when that error is showed by the Word of God, it ought to be corrected. This also is their practice, one synod often reforming that which has been decreed by another. Yet does not this take away their authority for the judgment and deciding of controversies. For by such reasoning they might take away all government and bring in confusion. By these and such-like injurious speeches they do exceedingly gratify many sorts of Libertines, Arians, Socinians and other heretics which do therefore so much abhor the subscriptions required in the Churches of God because they serve for detection and discovery of their errors. But as the preaching of the Word is not therefore to be condemned, because some preach error, so are not subscriptions and that consent which is required to many truths therefore to be rejected, though some do unjustly urge subscription unto errors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-paget.html">John Paget</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to the Unjust Complaints of William Best &amp; of such Other as have Subscribed Thereunto. Also an Answer to Mr. John Davenport</cite>, … (Amsterdam, 1635), pp. 88-90</span></figcaption>

<blockquote><p>… That this Commission may receive into ministerial communion such of the late conform ministers, as having qualified themselves according to law, shall apply personally to them, one by one, duly and orderly, and shall acknowledge, engage, and subscribe upon the end of the Confession of Faith, as follows, viz.: I… do sincerely own and declare, the above Confession of Faith, approven by former General Assemblies of this Church, and ratified by law in the year 1690, to be the confession of my faith; and that I own the doctrine therein contained to be the true doctrine which I will constantly adhere to; as likeways that I own and acknowledge Presbyterian Church government of this Church, now settled by law, by Kirk-Sessions, Presbyteries, Provincial Synods and General Assemblies, to be the only government of this Church, and that I will submit thereto, concur therewith, and never endeavour directly nor indirectly, the prejudice or subversion thereof… As also that the General Assembly require all Presbyteries and Synods, in their admitting or receiving any to ministerial communion, that they oblidge them to take and subscribe the same acknowledgment…</p></blockquote>

<blockquote><p>§31. p. 356, etc. Rule 23. [The opponent said:] ‘Subscription to Articles and forms of Confession in any particular Church is wholly of political consideration.’ Subscription ought to be so intended that he who has subscribed may not perceive himself taken in a snare: but yet he that subscribes must do it to those purposes and in that sense and signification of things which the supreme power intends in commanding it; that is, at least that he that subscribes do actually approve the Articles overwritten: that he does at that time believe them to be such as it’s said they are; i.e. true, if they only say they are true; useful, if they pretend to usefulness; necessary, if it be affirmed that they are necessary. For if the subscriber believes not this, he by hypocrisy serves [only] the ends of public peace and his own preferment. When Articles are established without necessity [i.e. the establishment of non-necessary articles], subscription must be required without tyranny and imperiousness. That is, it must be left to the liberty of the subject to profess or not profess that doctrine. To bring evil on men that do not believe the Article and dare not profess to believe what they do not, is injustice and oppression; it is a law of iniquity, and therefore it is not obligatory to conscience, and no human authority is sufficient for the sanction and imposition. Question: Can it be lawful for any man to subscribe what he does not believe to be true, giving his hand to public peace and keeping his conscience for God? Answer: No, if subscription signify approbation; for in that case it is hypocrisy, etc. But if subscription were no more than the office of a clerk of the signet or council, who in form of law is to sign all the acts of the council, it were different. For it is not as an account of his own opinion, but as a formality of the court: all the world looks on it as none of his personal act. But in subscription to Articles of Confession every ecclesiastic that subscribes does it for himself, lubens et ex animo subscripsi [‘I have subscribed willingly and from the heart’], is our form in the Church of England. If the intention of our superior be to require our assent, he that subscribes does profess his assent; and whatever he thinks himself, it is the intention of the imposer that qualifies the subscription. No particular Church ought with rigor to require subscriptions to Articles not evidently true and necessary to be professed: because in the division of hearts that is in the world, it is certain that some good men may dissent, and then either they shall be afflicted or tempted to hypocrisy: of either of which if ecclesiastic laws be guilty, they are not for edification: they are neither just, nor pious, and therefore oblige not. §32. pp. 358-59, ‘At least let the Articles be made with as great latitude of sense as they can and so that subscriptions be made to the form of words; let the subscribers understand them in what sense they please which the truth of God will suffer and the words can be capable of.’ This is the last remedy; but it is the worst: It has in it something of craft, but very little of ingenuity; and if it can serve the ends of peace or of external charity, or of fantastic concord [a concord of the fantasy], yet it cannot serve the ends of truth and holiness, and Christian simplicity.</p></blockquote>

<blockquote><p>… Many other moderate passages I could show in our Assembly’s Confession to some that have need to imitate them, and the Antinomians may see their doctrine subverted in their excellent definition of saving faith, in both Catechisms and in the Confession; in their determination of the natural effects of sin in whomsoever, ch. 6, sect. 6, in their determination of the necessity of repentance (as sine qua non) to remission, ch. 15:3, with more the like. And now if they have any standing rule to know a Papist or Arminian, I think I have acquit myself from their accusation; But if there be no rule of the orthodox doctrine and for rejection of error but the giddy distracted brains of Libertines that know not where to fix themselves, then I am content to bear the name of Jesuit, Papist or what these men shall please to call me. Yet let me add this, lest my seeking to satisfy the offended may draw me into guilt; Though I have voluntarily myself professed my consent to these several canons and confessions of faith, yet, for the Synod of Dort, the Confession of our Assembly; yea, or the larger Catechism, without some correction, I do hereby protest my dissent against the so imposing them to a word upon all ministers, that no man that cannot subscribe to them shall be permitted in the Church: Whether our Confession were intended for such a necessary test, I know not well; But that the Synod of Dort was, is expressed in the end. I abhor unlimited liberty of conscience, so called, that is, of divulging intolerable doctrines; and I lament also that instead of moderation, the Churches for 1,300 years [since 300 AD] have been so guilty of proud and cruel tyranny. There is singular use for a full body of theology, or a profession concluded on by such reverend assemblies, that the younger ministers may be taught by it, and the reverence of it may restrain them from rash contradicting it: And there is a necessity of exercising power in ministerial assemblies, for the actual restraint of such as shall teach things intolerably unsound: and all ministers should be there accountable for their doctrine. But before any forms be tendered us to subscribe, we must have them reduced into a narrower room, and into phrase so clearly rational or Scriptural, as no sober, studious, competent, godly divine shall scruple: Call it Socinian, or what name soever imperious faction shall put upon it, yet tender consciences will expect this, and the Churches shall never have peace in any other way, unless I be a false prophet; and the contrary course does but tend to do the same in doctrine, as the Common Prayer Book did in worship, even to ensnare the most conscientious, and work them out of the ministry by degrees, and to create us insensibly a lazy formal ministry that will take all upon trust and run to the authority of their confession instead of their Bible. I have long feared that the toleration threatened in these times for all is a judgment of God for our running into the tyrannical extreme so long; and I withal hope that He will turn this judgment to a mercy. Though I dislike too much liberty in the commonwealth more than too little (and in the Church much more such toleration is intolerable, in cases of clear duty or sin), yet I fear tyranny more than too much toleration:

1. For experience sadly tells me that tyrannical usurpation of dominion over men’s faith has distracted the Church, even beyond any visible probability of recovery; and it has been the cause of its misery for 1,300 years; but the experience of the mischiefs of toleration is nothing so great.

2. And I know that man’s nature is so prone to proud domineering, and so idolatrously inclined to have all men of their mind, and to dance after their pipe, that it will be still by assing rulers to that extreme: So that it’s easy without a spirit of prophesy to foretell that unlimited tolerations will not long be granted by anyone except a mere infidel, that having no religion himself, cares for nothing but his own politic ends; or a Julian that is contriving the extirpation of religion, and intends by the tailing of foxes to fire the field of Christ rather than by the yoking of oxen to plow and sow it. And policy will never long work that way neither, without some persecution intermixed. It’s easy to prognosticate this to him that knows what the heart of man is. So that for my part, I think the cause of God’s permission of too much looseness in these times, is to cure our former rigor and our being righteous and orthodox overmuch, by suffering men to go as much too far into the contrary extremes. Little do some men lay this to heart, who only continue exclamations (though deserved) against toleration, when it is but their own disease and what they have caused, that God is curing by this sad remedy. They should rather see their sin in this glass and be humbled.</p></blockquote>

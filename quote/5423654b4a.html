</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c3b7b7471c" data-kw="">
<blockquote><p>The kind of feelings, by which Christ was tempted, is also worthy of notice. Matthew says that he was affected by grief and sorrow (or anxiety); Luke says that he was seized with anguish; and Mark adds that he trembled. And whence came to Him both sorrow and anxiety and fear, except because He felt in death something sadder and more horrible than the separation of the soul and body? And certainly He underwent death, not merely that He might move from earth to heaven, but rather that He might take on Himself the curse to which we were liable, and deliver us from it. His horror was not, then, at death simpliciter, as a passage out of the world, but because He had before his eyes the dreadful tribunal of God, and the Judge Himself armed with inconceivable vengeance; it was our sins, the burden of which He had assumed, that pressed Him down with their enormous mass. It is, then, not at all strange if the dreadful abyss of destruction tormented Him grievously with fear and anguish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 26 | v. 37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-d97c9296fc" data-kw="">
<blockquote><p>It is written (Ps. 16:10): “Nor wilt Thou suffer Thy holy one to see corruption”: and [John the] Damascene (De Fide Orth. iii) expounds this of the corruption which comes of dissolving into elements…. …It was not fitting for Christ’s body to putrefy, or in any way be reduced to dust… Christ’s death ought not to come from weakness of nature, lest it might not be believed to be voluntary: and therefore He willed to die, not from sickness, but from suffering inflicted on Him, to which He gave Himself up willingly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologica, pt. 3, a Treatise on the Incarnation</cite>, (3) ‘Whether His body was decomposed in the tomb? [No]’ in Question 51, Of Christ’s Burial (4 Articles)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-55b3c85c6b" data-kw="">
<blockquote><p>XIII. A second rock to be avoided here is Eutychianism… who… confounded the two natures into one… one nature is neither changed nor converted by the hypostatical union into the other. Nor are the natures so confounded or mixed with each other that each of them does not retain its own properties and conditions.

XIV. The reasons are: (1) the opposition of the two natures in Christ is frequent in Scripture (Rom. 1:3; 1 Pet. 3:18; Heb. 9:14; Jn. 1:14; Phil. 2:6-7, 11); (2) two wills are ascribed to Him (‘not my will, but thine, be done,’ Lk. 22:42). Nor does it follow that there are two [persons] willing because the will belongs to the nature, while willing belongs to the person; nor is it evident that the will follows personally forthwith because in God there are three persons, but only one will. (3) Contraries are ascribed to Christ, which could not be if there were not two natures in Him (as that He would depart from the world and remain with us forever; that a child was born, who is the Father of eternity; that He suffered death and was made alive; in the form of God and in the form of a servant, etc.).

XV. Although the efficient cause of the operations of Christ is one alone, still the exciting cause is twofold–the divinity and humanity. The work upon which both exciting (egergema) causes exert their power is one, but the action (energeia) is twofold.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 2, 13th Topic, Q. 7, ‘Was the hypostatical union of the two natures of Christ such that neither the person is divided nor the natures confounded? We affirm against Nestorius &amp; Eutyches., pp. 320-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-04da18c64a" data-kw="">
<blockquote><p>Certainly from one perspective, as a creature and as man, it seems that He [Christ] cannot be exempted from the moral government of God, nor otherwise could He as a man have merited anything for Himself. From another perspective, if He were in Adam under the covenant of nature, then it would seem that in and with Adam who sinned, He violated that same covenant, which is beyond absurd. Therefore it seems most safe to state: although as a rational creature He cannot be exempted from moral government with respect to his natural duties, yet He could have been withdrawn by God from the same moral governance in the positive duties, such as the commandment not to eat of the forbidden fruit (upon the transgression of which the sin of the human race hangs).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 12, section 9, ‘Was it [the CoW] also entered into with the second Adam?’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

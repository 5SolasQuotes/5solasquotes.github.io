<main class="wrap"><figure class="quote" id="q-fd35067df4" data-kw="">
<blockquote><p>…therefore, we thoroughly approve these [eight] reasons adduced for the [geocentric] rest of the earth [after the paradigm of Tycho Brahe]; yet if anyone wishes to receive the other [heliocentric] opinion, concerning the motion of the earth and the rest of the sun, only as a mathematical hypothesis, but not as a physical truth (which also some of the authors cited above do), we will not contend odiously with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 3,’On the Works of the Six Days’, sect. 13 in ‘Theological Dissertation on Creation’ (Frankfurt: Steppinus, 1706), pp. 32-34 trans. AI Latin</cite>, p. 34</span></figcaption>

</figure><figure class="quote" id="q-babe6f6031" data-kw="">
<blockquote><p>Concerning the mode of creation, insofar as it indeed pertains to the efficient, it must be held that God did not always create—otherwise the creature would be coeternal with the creator. But He began to create at the beginning of time, as Moses speaks, Gen. 1:1, “In the beginning”; from which beginning John speaks, Jn. 1:1, from which beginning creation is called the beginning of Jehovah’s way, Prov. 8:22. And when He began, He did not pass from idleness to work, from potency to act. But the creature, which was in potency, and that only negative, was brought into act and existed in act. … I. That the creation of individual things was made in an instant, as they say, or moment of time, in respect to God the creator, because in creating He employed the omnipotent Word. … The subject creation concerned were creatures, to be produced by the power of God. The subject, however, in which, there was initially none, because, no creature existing, there existed also no place. Afterward, however, with the creature place began: common indeed to all creatures, the world; proper, however, to certain ones: heaven, water, earth, Gen. 1:1, 14, 20, 24. … II. Finitude is in place and time. In place, because all creatures, inasmuch as they are finite in essence, occupy some space, whether corporeal or spiritual, according to the condition of their nature, Gen. 1 throughout. In time, because they both began in time, Gen. 1:1, and as long as they exist, they are subject to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alting.html">Johann H. Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-b6781960e7" data-kw="">
<blockquote><p>Intellection can exist (as is plain from our own inner experience); but God, as supreme cause of everything outside himself, must have the perfection of his effects either formally or at least virtually. He does not have intellection merely virtually, because a being that is formally unknowing cannot be the sufficient reason of anything formally knowing, otherwise the effect would be more perfect than its cause; therefore he has intellection formally, which is [the] proposed conclusion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alan-b-wolter.html">Alan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958)</cite>, pp. 93-95; p. 96</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

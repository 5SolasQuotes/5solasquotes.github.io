<blockquote><p>…when the Creed speaks of the ‘Catholic church,’ meaning true saints, that serve God in truth, it speaks not ‘multitude,’ though it mean ‘universal’. But it speaks, that such are scattered up and down the world; here some in one nation, there some in another; here one in one city, there another in another. II. Therefore, ‘communion of saints’ cannot mean personal or local union, or communion: saints in one place, or in one lump, together: not a college of all saints in one place, but a communion betwixt them, as scattered here and there, all the world over. As there is a communion betwixt two friends, one in Turkey, another in England; one in New England, another in Old [England]… How would you understand that, Mt. 24:31, ‘And he shall send his angels with a great sound of a trumpet, and they shall gather together his elect from the four winds, from one end of heaven to the other.’ By the ‘angels,’ he means his messengers the ministers; by the ‘sound of a trumpet,’ he means the gospel; by the whole he means, that, after the destruction of Jerusalem, of which the speech is in the verses before,–God, by the preaching of the Gospel, would fetch in his elect among all nations, or call home the gentiles. But how gather them together? What, into any one place, or country, or city? No, but into such a communion, as we are speaking of, in the several nations or countries, where they lived: one saint in Judea, another in Assyria, another in Greece: all staying in the place where they receive the gospel, and yet all gathered together into one communion.</p></blockquote>

<blockquote><p>I. There is a communion of converse, and communion of affection… And there may be communion of affection, where there is no converse. Nay, there is, as it were, planted in morality, an affection of one excellent person to another. A valiant man loves a valiant man, though he never came near him. A scholar loves a scholar, that he has only heard of. Much more is such an affection planted in true Christianity in a heart truly religious, be he who he will, where he will; though he never saw him. As, ‘My delight is in the saints, and excellent on the earth,’ (Ps. 16:3) be they far off or near. II. There is communion in ‘common interest,’ where, it may be, there is not communion in coomon converse. Those that never saw or heard of one another to converse together, yet may have communion in common interest. Englishmen meeting beyond sea, that never saw each other before, yet will take parts, and side together, as in the common interest of being countrymen. There is a common interest in all the saints in the world, though at their never so great distance and separation, viz. glorifying God, and loving the Lord Jesus. As the apostle says, 1 Jn. 1:3, ‘Our fellowship is with the Father, and with his Son Jesus Christ.’… This is the special center, in which saints meet, be they never so far asunder. And in this sense, their ‘gathering together,’ is to be understood (of which there is so frequent mention); not into one place; but into this one circle of loving, fearing, serving God; Zeph. 3:9, ‘That they may call upon the name of the Lord, and serve Him with one consent.’ In the Hebrew it is, ‘with one shoulder;’ as if many were together shouldering up the same weight or burden: all in their places jointly putting-to their endeavor to bear up the name, glory and honor, of God: east, west, north, south, every saint joining in this great work, and meeting in this holy point. As the twelve oxen under the brazen sea, their face to the four quarters of heaven, but their bodies all meeting to bear up the weight. Now, III. They that are all of the same mind, all meet in this common interest towards God, cannot but love one another, though they know not one another. ‘My heart’ (says Deborah) ‘is towards the governors of Israel, that offered themselves willingly among the people.’ (Judges 5:9) Did she know all their faces and persons? Could she call them by their names? No, but she could not but love them, be they who they would, that put-to their hands and shoulders to that common cause. We see, how men are ready to affect any that they hear to be of their opinion, humor and mind, though they never saw them. Much more does a saint love a saint, that is partner with him in this holy work. Though he knew not where to find him, or name him; yet if he be for God, he must have his heart; and loving God, he cannot but love whosoever loves Him. IV. Accordingly they sympathize one with another; ‘Whether one member suffer, all the members suffer with it; or one member be honored, all the members rejoice with it.’ (1 Cor. 12:26)… It grieves a saint, if it be ill with any saint in the world; and he rejoices , if it go well with him. His heart is touched with his case, as with his own. As we are affected with the well or ill doing of any Englishman in any part of the world, for common interest of country’s sake. Neh. 1:4, “And it came to pass, when I heard these words, that I sat down, and wept, and mourned certain days, and fasted, and prayed before the God of heaven.’ ‘Why Nehemiah? thou are well enough; thou art in place of honor, pleasure, preferment.’–‘Oh! but it is ill with the people of God.’–And, Ps. 137:5-6, says the Psalmist, ‘If I forget thee, O Jerusalem, let my right hand forget her cunning. If I do not remember thee, let my tongue cleave to the roof of my mouth, if I prefer not Jerusalem above my chief joy:’ I can never forget Jerusalem. V. Answerably, they have one another’s prayers. There is not a saint in the world, but has the prayers of all the saints in the world. Any child of God makes it conscience to pray for every child of God on earth. One member cannot but do its best for another. ‘And as many as walk according to this rule, Peace be on them, and mercy, and upon the Israel of God.’ (Gal. 6:16) ‘Pray for thyself, Paul, and for thine own churches’–‘Nay, but every saint wherever is a member of the same body that I am of; and, therefore, I must pray for them also.’ So Eph. 6:24, ‘Grace be with all them, that love our Lord Jesus Christ in sincerity.’ I love Christ, and cannot but love and pray for all that love Him.</p></blockquote>

rned+certain+days%2C+and+fasted%2C+and+prayed+before+the+God+of+heaven.%E2%80%99+%E2%80%98Why+Nehemiah%3F+thou+are+well+enough%3B+thou+art+in+place+of+honor%2C+pleasure%2C+preferment.%E2%80%99%E2%80%93%E2%80%98Oh%21+but+it+is+ill+with+the+people+of+God.%E2%80%99%E2%80%93And%2C+Ps.+137%3A5-6%2C+says+the+Psalmist%2C+%E2%80%98If+I+forget+thee%2C+O+Jerusalem%2C+let+my+right+hand+forget+her+cunning.+If+I+do+not+remember+thee%2C+let+my+tongue+cleave+to+the+roof+of+my+mouth%2C+if+I+prefer+not+Jerusalem+above+my+chief+joy%3A%E2%80%99+I+can+never+forget+Jerusalem.+V.+Answerably%2C+they+have+one+another%E2%80%99s+prayers.+There+is+not+a+saint+in+the+world%2C+but+has+the+prayers+of+all+the+saints+in+the+world.+Any+child+of+God+makes+it+conscience+to+pray+for+every+child+of+God+on+earth.+One+member+cannot+but+do+its+best+for+another.+%E2%80%98And+as+many+as+walk+according+to+this+rule%2C+Peace+be+on+them%2C+and+mercy%2C+and+upon+the+Israel+of+God.%E2%80%99+%28Gal.+6%3A16%29+%E2%80%98Pray+for+thyself%2C+Paul%2C+and+for+thine+own+churches%E2%80%99%E2%80%93%E2%80%98Nay%2C+but+every+saint+wherever+is+a+member+of+the+same+body+that+I+am+of%3B+and%2C+therefore%2C+I+must+pray+for+them+also.%E2%80%99+So+Eph.+6%3A24%2C+%E2%80%98Grace+be+with+all+them%2C+that+love+our+Lord+Jesus+Christ+in+sincerity.%E2%80%99+I+love+Christ%2C+and+cannot+but+love+and+pray+for+all+that+love+Him.%E2%80%9D%0A%0A%E2%80%94+John+Lightfoot%2C+3.+%E2%80%98The+Communion+of+Saints%E2%80%99+in+An+Exposition+of+Three+Articles%E2%80%A6+%28d.+1675%29%2C+pp.+80-82&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe1fee7694e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e1fee7694e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-communion-of-the-saints/#:~:text=I.%20There%20is%20a%20communion%20of,pray%20for%20all%20that%20love%20Him&amp;text=I.%20There%20is%20a%20communion%20of%20converse%2C%20and&amp;text=love%20and%20pray%20for%20all%20that%20love%20Him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-56e2684dfb" data-kw="">
<blockquote><p>The union of the Church-universal is in the seven things mentioned by Paul, Eph. 4:3-6, viz. one Body, one spirit (of faith and love), one hope (of glory), one Lord, one faith (or Creed), one baptismal covenant, one God and Father of all. He that separates from this Church directly is an apostate…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), sect. 6, p. 39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

</figure><figure class="quote" id="q-c4f841cb25" data-kw="">
<blockquote><p>Now this communion consists in the following things, 1st, That having one God and one Savior, and animated by the same Spirit, they constitute one body, whose parts are indeed widely separated from each other with regard to distance of local situation, but maintained in close mutual connection by the same Spirit of Christ. 2ndly, That the souls of the blessed, although they be entirely ignorant of the particular persons of believers on earth, and of their necessities, yet by their earnest prayers unite with us in soliciting, and, so to speak, accelerating, the day of the complete redemption of the Church; whilst the saints on earth are associated with those in heaven, in spirit, affection, and desire, having their conversation in heaven. XLV. But we are chiefly to attend to the communion which believers have with each other on the earth… 1st, That intimate union, by which, how far removed soever as to place, they are mutually joined together by the Spirit; not merely as brethren, but, what we have already often inculcated, as members of one mystical body… That we recognize and celebrate the admirable power of God, which unites believers of every nation, age, condition and sex, often separated from one another by such vast intervening spaces of land and sea, of such disimilar capacities and tempers, and engaged in such diversified pursuits; and so closely conjoins them by one Spirit, that they most harmoniously concur in the same sentiments and feelings respecting God and Christ, and in the same devout prayers and praises, and discern in each other, with mutual congratulation and applause, the same effects of the same divine grace; so that, even at their first meeting, a most delightful interchange of love arises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacred Dissertations, on What Is Commonly Called the Apostles’ Creed</cite>, trans. Donald Fraser (1681; Glasgow, 1823), vol. 2, Dissertation 24, ‘On the Church &amp; the Communion of Saints…’, pp. 380-81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

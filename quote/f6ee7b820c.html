<main class="wrap"><figure class="quote" id="q-f6ee7b820c" data-kw="">
<blockquote><p>Am I suggesting that women return to wearing coverings or veils? No. We must distinguish between the fundamental principle that underlies a text and the application of that principle in a specific culture… Now, in the first century, failure to wear a covering sent a signal to the congregation that a woman was rejecting the authority of male leadership. Paul was concerned about head coverings only because of the message they sent to people in that culture… Lack of head coverings sends no message at all in our culture. Nevertheless, that does not mean that this text does not apply to our culture. The principle still stands that women should pray and prophesies will be one indication of whether she is humble and submissive. The principle enunciated here should be applied in a variety of ways given the diversity of the human situation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-schreiner.html">Thomas Schreiner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Head Coverings, Prophecies &amp; the Trinity, 1 Corinthians 11:2-16’ in eds. Piper &amp; Grudem, Recovering Biblical Manhood &amp; Womanhood: a Response to Evangelical Feminism (Crossway, 1991), pp. 124-39</cite>, p. 138</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Am I suggesting that women return to wearing coverings or veils? No. We must distinguish between the fundamental principle that underlies a text and the application of that principle in a specific culture… Now, in the first century, failure to wear a covering sent a signal to the congregation that a woman was rejecting the authority of male leadership. Paul was concerned about head coverings only because of the message they sent to people in that culture… Lack of head coverings sends no message at all in our culture. Nevertheless, that does not mean that this text does not apply to our culture. The principle still stands that women should pray and prophesies will be one indication of whether she is humble and submissive. The principle enunciated here should be applied in a variety of ways given the diversity of the human situation.”

— Thomas Schreiner, ‘Head Coverings, Prophecies &amp; the Trinity, 1 Corinthians 11:2-16’ in eds. Piper &amp; Grudem, Recovering Biblical Manhood &amp; Womanhood: a Response to Evangelical Feminism (Crossway, 1991), pp. 124-39, p. 138">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAm+I+suggesting+that+women+return+to+wearing+coverings+or+veils%3F+No.+We+must+distinguish+between+the+fundamental+principle+that+underlies+a+text+and+the+application+of+that+principle+in+a+specific+culture%E2%80%A6+Now%2C+in+the+first+century%2C+failure+to+wear+a+covering+sent+a+signal+to+the+congregation+that+a+woman+was+rejecting+the+authority+of+male+leadership.+Paul+was+concerned+about+head+coverings+only+because+of+the+message+they+sent+to+people+in+that+culture%E2%80%A6+Lack+of+head+coverings+sends+no+message+at+all+in+our+culture.+Nevertheless%2C+that+does+not+mean+that+this+text+does+not+apply+to+our+culture.+The+principle+still+stands+that+women+should+pray+and+prophesies+will+be+one+indication+of+whether+she+is+humble+and+submissive.+The+principle+enunciated+here+should+be+applied+in+a+variety+of+ways+given+the+diversity+of+the+human+situation.%E2%80%9D%0A%0A%E2%80%94+Thomas+Schreiner%2C+%E2%80%98Head+Coverings%2C+Prophecies+%26+the+Trinity%2C+1+Corinthians+11%3A2-16%E2%80%99+in+eds.+Piper+%26+Grudem%2C+Recovering+Biblical+Manhood+%26+Womanhood%3A+a+Response+to+Evangelical+Feminism+%28Crossway%2C+1991%29%2C+pp.+124-39%2C+p.+138&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff6ee7b820c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f6ee7b820c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/#:~:text=Am%20I%20suggesting%20that%20women%20return,the%20diversity%20of%20the%20human%20situation&amp;text=Am%20I%20suggesting%20that%20women%20return%20to%20wearing&amp;text=ways%20given%20the%20diversity%20of%20the%20human%20situation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-91a53fdb92" data-kw="">
<blockquote><p>…that such godly men as have been desirous of reformation, and most zealous against human inventions in the worship of God, they always intended such human inventions in the worship of God as had no warrant but the wit and will of man, not such as had warrant either from consequence of Scripture, or light of nature, or civil custom. For a woman to cover her head in time of public prayer, or prophesying, and for a man to uncover his head, the apostle warrants both from the light of nature and the custom of the churches, 1 Cor. 11:4 to 16. The kiss of love in holy assemblies was warranted, not by divine institution (for then it were a sin in us to neglect it now), but by occasion of civil custom in those nations; where, it being usual in their civil assemblies to greet one another with a kiss of love, the apostles do not disallow the use of it in holy assemblies, but only require the sincerity and holiness of the love expressed in such kisses, 1 Cor. 16:20; 1 Thess. 5:26; 1 Pet. 5:14. These apostles did not believe in this point, as you do, that God never betrusted corrupt nature, to frame anything in God’s worship to his praise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Singing of Psalms a Gospel-Ordinance… (London, 1650), ch. 10, ‘Of the Manner of Singing’</cite>, pp. 58-59</span></figcaption>

</figure><figure class="quote" id="q-8dbf26ca98" data-kw="">
<blockquote><p>Regarding the entry in the Liddell-Scott lexion, which quotes Orphic Fragments 21a [pre-4th century BC, which has textual variant] as the only evidence for the general meaning ‘source, origin,’ it would be more accurate if the entry were classified under the category ‘starting-point.’ Indeed, that would allow the entry to fit more easily under the general category in which the editors have placed it, ‘of things, extremity,’ for in this case the thing referred to is a period of time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wayne-grudem.html">Wayne Grudem</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Does Kefale (‘Head’) Mean ‘Source’ Or ‘Authority Over’ in Greek Literature?: a Survey of 2,336 Examples’ Trinity Journal, no. 6.1 (Spring 1985), pp. 38-59</cite>, p. 46</span></figcaption>

</figure><figure class="quote" id="q-3c8d63b3f4" data-kw="">

</figure><figure class="quote" id="q-3f89644db8" data-kw="">
<blockquote><p>It is partly true, that ‘the men’ were peculiar in their dress, but it is not at all true, that they adopted any kind of badge, or that they wore a uniform that distinguished them as a class. In the circle in which they moved, there were attempts made, by the careless and worldly, to follow, at a distance, the mutations of fashion in their attire. The men would not, and, merely, on that account, their dress was peculiar. It was often the case, that they wore long hair, partly, because a regard to appearances did not remind them of cutting it, and, partly, that they might discountenance the attempts at clipping and combing ‘after the fashion,’ by which many around them evidenced their conformity to the world. It is true, also, that they often appeared with a handkerchief on their heads, but so did many besides them, who met to worship under a scorching sun, and regarded it as unbecoming to have a hat or a bonnet on their heads. If their dress seemed peculiar, it was only because it was old-fashioned, even in the highlands. Its singularity was not owing to any affectation, or to an undue regard to what was external and trivial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-kennedy.html">John Kennedy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Days of the Fathers in Ross-Shire 4th ed. (Toronto: James Campbell &amp; Son, 1867)</cite>, pp. 87-88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

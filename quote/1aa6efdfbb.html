<main class="wrap"><figure class="quote" id="q-1aa6efdfbb" data-kw="Pope judge in own cause">
<blockquote><p>It is unjust that he who is the subject of the controversy should be the judge of the controversy; and I am in greater doubt of the pope’s authority than of the sense of this passage. There is need, therefore, of some other and more impartial judge. For who could say this was a legitimate interpretation;— since the pope says that infallibility is promised to him in this text, therefore he is infallible? Surely he needs some greater authority and testimony than his own word to prove that such a promise hath been made to him. Besides, the papists themselves acknowledge, that the pope may not only err, but even be a heretic, and so completely overturn this interpretation of the passage. Finally, councils, fathers, popes, are men; and scripture testifies that all men are deceitful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-75e42e09a6" data-kw="Primacy of Peter">

</figure><figure class="quote" id="q-63559a9ac2" data-kw="Scripture interprets Scripture">
<blockquote><p>Whatever, then, the papists talk so vauntingly of fathers and of councils, yet it is to their ecclesiastical prince, that is to the pope, that all controversies are finally referred, and with that prince and supreme interpreter rests the whole meaning of scripture and the right of adjudicating upon it. But we do not acknowledge that prince, whom Christ never constituted; and we say that the scripture itself publicly set forth and propounded is its own interpreter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 7</span></figcaption>

</figure><figure class="quote" id="q-f40671079e" data-kw="Councils and the pope">
<blockquote><p>Although the Levitical high priest had the right to convoke councils and to gain for them infallible authority, it does not follow that the same belongs to the Roman pontiff, because no other besides Christ succeeded the ancient high priest (Heb. 7, 8, 9). Besides, the right of extraordinary conventions was with the supreme magistrate (as we have said) and if they had any authority, that flowed entirely from the word, not from the pope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.17</span></figcaption>

</figure><figure class="quote" id="q-788f2fe55a" data-kw="Papal infallibility">
<blockquote><p>Thirdly, if Christ asked this for all the Roman pontiffs, that they should be exempt from error, then he did not obtain what he asked. For it is certain that many Roman pontiffs have erred, even when teaching ex cathedra, that is, determining controversies; as Alphonsus asserts, Contra Hæres. Lib. I. c. 4, where he affirms that the pope not only may err, but even be a heretic. The same is written and held by other papists also. Then who, I pray you, will be the supreme judge of the church, when the supreme pontiff hath fallen into heresy? Is he a fit person to be the supreme judge in religion, and one in whose judgment we should acquiesce, who may be, and is a heretic, as the very papists themselves confess? Surely, never. The supreme judge of all controversies must be such a one as can neither err nor prove a heretic: and such is Christ himself, that true High Priest, and the sacred scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 5</span></figcaption>

<main class="wrap"><figure class="quote" id="q-9e80044434" data-kw="">
<blockquote><p>And here comes in the way that general bond wherewith man is especially bound unto man, and that without taking away of humanity itself, cannot be broken; There is also another bond binding every citizen unto his country and city. But both these bonds I affirm to be natural and universal, that everyone must have regard of his estate, and calling; for some serve in public offices, either civil, or the ministry; the rest are private persons… …yet, lest in this case [of flight], any man by flattering of himself, might sin against his neighbour [in neglecting his duty towards him], it is the duty of a Christian magistrate to provide that those things which either breed or nourish the plague, so far as they may, be taken away, and that regard may be had of those that be visited with this sickness, that all be not driven to be careful for all. … But if in such calamities the magistrate do not in time provide, as much as may be, both by such lawful means as are not repugnant unto Christian charity, that the infection may be prevented, and also that the sick of the plague want [lack] nothing…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Treatise of the Plague</cite>, … (London, 1580; rep. 1665), p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8cf882607e" data-kw="">
<blockquote><p>And first concerning Church meetings, this counsel is to be given [to civil magistrates], that they come not by heaps, or by throngs, neither in, nor go out, and that they flock not by great numbers into one church, where they shall be driven to sit straightly and near together, especially in one city: whereas there are more places fit for this purpose, in the which the divine service, that is, the expounding of the word of God, and administration of the sacraments may be done. For albeit these things may peradventure seem unto some to be but small, and of little importance, yet nothing is to be omitted, which by any means may make for the turning away of the infection. And that which Cicero said, that when as we ought to do for the benefit of men, and do service to the fellowship of mankind, nothing is to be kept close, whatsoever commodity or store we have, the same especially ought to have place at this time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection</cite>, … (London, 1583), bk. 1, ch. 6, ‘Of Order to be Appointed among the Citizens, and of Leaving of Public Meetings and Assemblies,’ p. 27. Ewich was a German reformer and civil health official.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

cf882607e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=And%20first%20concerning%20Church%20meetings%2C%20this,to%20have%20place%20at%20this%20time&amp;text=And%20first%20concerning%20Church%20meetings%2C%20this%20counsel%20is&amp;text=especially%20ought%20to%20have%20place%20at%20this%20time" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-7b42ef7128" data-kw="">
<blockquote><p>For they [the Independents] hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, pp. 221-22 of ch. 18, ‘Of the Use of a Table in the Lord’s Supper. And of the Communicants their Coming to &amp; Receiving at the Table’ in A Treatise of Miscellany Questions… (1649)</span></figcaption>

</figure><figure class="quote" id="q-496823033b" data-kw="">
<blockquote><p>A multitude may be one Church, though they do not meet together into one place for the worship of God: for example, it may fall forth, that a congregation cannot meet together into one, but into diverse places, and this may continue so for some years together, either by reason of persecution, or by means of the plague, or because they have not such a large parish-Church as may contain them all, so that a part of them must meet in some other place: but a multitude cannot be one Church, unless they communicate in the same Church government, and under the same governors (by one Church I mean one Ecclesiastical Republic) even as the like union under civil government and governors maketh one corporation:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, … (Edinburgh, 1641), 2nd pt., ch. 3, p. 145. Gillespie is arguing against congregationalism.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

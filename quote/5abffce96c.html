<main class="wrap"><figure class="quote" id="q-5abffce96c" data-kw="">
<blockquote><p>…for the king and people are each of them above and below others in divers respects: the people, because they create the man king, they are so above the king, and have a virtual power to compel him to do his duty; and the king, as king, has an authoritative power above the people, because royalty is formally in him, and originally and virtually only in the people, therefore may he compel them to their duty, as we shall hear anon; and therefore there is no need of an earthly ruler higher than both, to compel both.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ee9865af2" data-kw="">
<blockquote><p>With that in mind, I contend that the best commonwealth is the one that has as its chief end, the common or public good, especially in relation to spiritual matters, the glorifying and enjoying of God forever. If this is the chief end of man, it ought to be the chief end of every institution in the world, whether government, school, family, or religious assembly… If the chief end of government is the public good, as the [Westminster] Confession says and the American founders said, especially the spiritual welfare of its subjects, then he [the magistrate] must both decide what is true religion for himself and promote it. The most obvious means is the enforcement of God’s moral law, classically understood as both tables of the Decalogue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-lynch.html">Michael Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Almost Christian Nationalist”</cite>, (2025) at American Reformer</span></figcaption>

</figure><figure class="quote" id="q-15291052f3" data-kw="">
<blockquote><p>…the Magistrate indeed forbids speaking of blasphemy and teaching of lies in the name of the Lord, but he forbids not teaching of lies, or abstinence from blaspheming, in a spiritual, but in a carnal, co-active, by force of the sword and external way, because he cannot punish the spiritual and internal ways and manner of external obedience, and therefore he cannot under pain of bodily censure command and forbid these ways of obedience; so the Magistrate forbids murder, but God, not the Magistrate, forbids murder, or commands abstinence from killing, out of mercy and love to our neighbor; for the Magistrate cannot punish heart-hatred of our neighbor, or rash anger, but insofar as it comes out to his senses, in striking, maiming, or opprobrious speeches; and these he can forbid and censure and punish. So we say [that] the Magistrate is but a piece, or a bit of an ordinance (though both lawful and necessary, Rom. 13, for our good [v. 4]) to reform the outside and to work outward reformation; and when he commands the outward man and says, ‘Swear not, blaspheme not, speak not lies in the name of the Lord, kill not, steal not under the pain of feeling the stroke of the sword’: he commands not sinning. For though he forbid only external abstinence from sins that troubles the outward man, without any spiritual and internal right way of abstaining, he commands not sin and hypocrisy, per se, and kindly [in its kind], and properly.

1. Because the Magistrate, as the Magistrate, should and ought, as the Minister of God, give commandments to the outward man under pain of corporal punishment, not to the soul or to the inward man.

2. Because that external obedience, not to kill, not to steal, not to speak lies, is good, lawful external obedience, to man, and profitable in the State for the end that God has appointed it, which is the peaceable conversing one with another; that same abstinence from killing in an unrenewed man, who abstains not from killing for fear of God and love to his brethren, is a sinful abstinence and carnal repentance, by accident, and in relation to the Law of God; but the Magistrate neither commands abstinence from killing from an inward spiritual principle, nor forbids he the contrary: he commands not abstinence from false doctrine out of the love that the messenger owes to him who purchased the flock with his blood, nor forbids he such abstinence, but only he commands abstinence from speaking lies to the people of God.

3. If we distinguish obedience, there is first a necessary and good and lawful obedience. 2. There is an obedience complete and entire, and full, and sincere. Outward obedience, which the Magistrate commands, is good and lawful and [is] necessary obedience, and is, in the kind of external and necessary obedience (I mean) necessary for its end, [namely] the safety of the society, not hypocritical, unlawful or sinful. In this notion only it is commanded by the Magistrate, and the omission of it [is] unlawful and punishable by the sword of the deputy and Minister of God. But if we speak of an obedience complete, full and sincere, which is required from the whole man in order to the Law of God, then the outward obedience that the Magistrate demands is not complete, entire, nor sincere, but in relation to the Law of God, which requires entire obedience from the whole man, soul and body, it is not full, not entire, not sincere obedience, but an outside of obedience; but in this sense the Magistrate does not demand obedience to the Law of God, for he has to do with the outward man only and as a Magistrate has nothing to do with the soul and conscience: so then, though the Magistrate command to preach sound doctrine, forbid to preach lies in the name of the Lord, yet he commands not hypocrisy and sin; for this argument may as well prove [that] the Magistrate should neither forbid nor punish murder, nor command abstinence from murder to an unrenewed man, for an unrenewed man cannot but abstain from murder in a sinful way, and his abstinence from murder, in order to the spiritual Law of God, is no better ‘than the oblation of swine’s blood, and the cutting off of a dog’s head to God,’ Isa. 66. 1:2, as is all external obedience of either Tables of the Law, First or Second, without faith and spiritual, inward, moral principles and heart-obedience; and Mr. Williams cannot answer this argument but by the principles of Anabaptists, Familists and Enthusiasts, who say [that] all outward ordinances, ministry, preaching, sacraments, yea preachers and magistrates who command outward obedience to God are unlawful now under the New Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649) | Ch. 27, ‘Whether our Darkness &amp; Incapacity to Believe…’, p. 323-5 (356-8)</span></figcaption>

+he+has+to+do+with+the+outward+man+only+and+as+a+Magistrate+has+nothing+to+do+with+the+soul+and+conscience%3A+so+then%2C+though+the+Magistrate+command+to+preach+sound+doctrine%2C+forbid+to+preach+lies+in+the+name+of+the+Lord%2C+yet+he+commands+not+hypocrisy+and+sin%3B+for+this+argument+may+as+well+prove+%5Bthat%5D+the+Magistrate+should+neither+forbid+nor+punish+murder%2C+nor+command+abstinence+from+murder+to+an+unrenewed+man%2C+for+an+unrenewed+man+cannot+but+abstain+from+murder+in+a+sinful+way%2C+and+his+abstinence+from+murder%2C+in+order+to+the+spiritual+Law+of+God%2C+is+no+better+%E2%80%98than+the+oblation+of+swine%E2%80%99s+blood%2C+and+the+cutting+off+of+a+dog%E2%80%99s+head+to+God%2C%E2%80%99+Isa.+66.+1%3A2%2C+as+is+all+external+obedience+of+either+Tables+of+the+Law%2C+First+or+Second%2C+without+faith+and+spiritual%2C+inward%2C+moral+principles+and+heart-obedience%3B+and+Mr.+Williams+cannot+answer+this+argument+but+by+the+principles+of+Anabaptists%2C+Familists+and+Enthusiasts%2C+who+say+%5Bthat%5D+all+outward+ordinances%2C+ministry%2C+preaching%2C+sacraments%2C+yea+preachers+and+magistrates+who+command+outward+obedience+to+God+are+unlawful+now+under+the+New+Testament.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Free+Disputation+Against+Pretended+Liberty+of+Conscience%2C+%E2%80%A6+%281649%29+%7C+Ch.+27%2C+%E2%80%98Whether+our+Darkness+%26+Incapacity+to+Believe%E2%80%A6%E2%80%99%2C+p.+323-5+%28356-8%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F15291052f3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/15291052f3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/civil-government/#:~:text=the%20Magistrate%20indeed%20forbids%20speaking%20of,unlawful%20now%20under%20the%20New%20Testament&amp;text=the%20Magistrate%20indeed%20forbids%20speaking%20of%20blasphemy%20and&amp;text=God%20are%20unlawful%20now%20under%20the%20New%20Testament" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1. There is a subjection in respect of natural being, as the effect to the cause; so, though Adam had never sinned, this morality of the Fifth Command should have stood in vigor, that the son by nature, without any positive law, should have been subject to the father, because from him he has his being, as from a second cause. But I doubt if the relation of a father, as a father, does necessarily infer a royal or kingly authority of the father over the son; or by nature’s law, that the father has a power of life and death over, or above, his children, and the reasons I give are: (1) Because power of life and death is by a positive law, presupposing sin and the fall of man [Gen. 9:5-6]; and if Adam, standing in innocency, could lawfully kill his son, though the son should be a malefactor, without any positive law of God, I much doubt [Gen. 4:14-15]. (2) I judge that the power royal, and the fatherly power of a father over his children, shall be found to be different; and the one is founded on the law of nature, the other, to wit, royal power, on a mere positive law.

2. The degree or order of subjection natural is a subjection in respect of gifts or age. So Aristotle (1 polit., chp. 3) says, “that some are by nature servants.” His meaning is good — that some gifts of nature, as wisdom natural, or aptitude to govern, has made some men of gold, fitter to command, and some of iron and clay, fitter to be servants and slaves… It is possible Plato had a good meaning (Dialogue 3, Of Laws) who made six orders here. “1. That fathers command their sons;

2. The noble the ignoble;

3. The elder the younger;

4. The masters the servants;

5. The stronger the weaker;

6. The wise the ignorant.” Aquinas (22, q. 57, article 3), Driedo (de libert. Christ, bk. 1, p. 8), following Aristotle (polit. bk. 7, ch. 14) hold, though man had never sinned there should have been a sort of dominion of the more gifted and wiser above the less wise and weaker; not antecedent from nature properly, but consequent, for the utility and good of the weaker, in so far as it is good for the weaker to be guided by the stronger, which cannot be denied to have some ground in nature.</p></blockquote>

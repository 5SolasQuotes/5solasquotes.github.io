<blockquote><p>Thirdly, that the offence of aliens is to be regarded, that is, we must not do anything by which men that are not yet converted may be hardened from the liking of religion: and so offence must not be given either to the Jew or to the Grecian, 1 Cor. 10:31.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-46637a5233" data-kw="">
<blockquote><p>VIII. The occasion of a scandal which is only passive should be removed, if it be not some necessary thing… … X. A scandal is passive and taken by the scandalized, without the fault of the doer, only in this case: cum factum unius est alteri occasio peccandi, prater intentionem facientis, et conditionem facti (Ames, Of Conscience, bk. 5, ch. 11, q. 3); so that to the making of the doer blameless is not only required that he intend not his brother’s fall, but also that the deed be neither evil in itself, nor yet done inordinately and with apperance of evil. XI. The scandal not to be cared for is only in necessary things, such as the hearing of the Word, prayer, etc., from which we may not abstain, though all the world should be offended at us: In these I say, and these only, Scandalum quod oritur ex rebus per s•… bonis et necessariis, non licet evitare, etc. at rerum legittimarum sed non necessariarum disparest ratio, etc., says a great Formalist (Cameron, Praelectiones on Mt. 18:7, Of Scandal). XII. We ought for the scandal of the malicious to abstain from all things from which we ought to abstain for the scandal of the weak; for we ought not to abstain from necessary things for the scandal of the weak no more than for the scandal of the malicious… … Christ’s not caring for the scandal of the Pharisees is also objected to prove that if the thing be lawful or indifferent, we are not to care for the offence of the malicious. But Parker answers well (Of the Cross, pt. 2, p. 57): ‘The scandal there not cared for is when the Pharisees are offended at his abstaining from their washings and his preaching of true doctrine, both of which were necessary duties for Him to do. And when He defends his healing on sabbaths (Lk. 13:15) and his disciples plucking corns (Mt. 12:7), upon this reason, they are duties of necessity and charity, He plainly insinuates there is no defence for deeds unnecessary when the malicious are scandalized. When the thing was indifferent, does He not forgoe his liberty for to please them, as when He payed tribute lest he should offend them (Mt. 17:27), although he know they were malicious.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 8, pp. 32-34</span></figcaption>

<blockquote><p>Further, if people are thus unjustly charged, it may be some comfort to consider the best of Christ’s servants have been thus accused, as appears from what the apostle says, 2 Cor. 1:17-18, when it seems such as turned his enemies in that Church had charged him with lightness and changeableness in his doctrine and principles, as well as in his purposes, where, for his own vindication, he is obliged to use a sort of solemn oath, saying, ‘But as God is true, our word,’ or preaching, ‘toward you was not yea and nay.’ And Durham on Scandal (p. 176) instances this as one of the ways whereby the Devil carries on division in the Church, viz. by making people charge ministers with ‘lightness’ and ‘changeableness,’ as if they were of one mind this year and of another the next. As formerly I endeavored to contribute my mite in opposing what I judged amiss in the Church of Scotland, so, through grace, I hope to continue and cannot see a shadow of reason to imagine but it is as acceptable to God, and much more acceptable to Him to oppose what may be amiss in her conduct, in a way of Church-communion, as in a separate state, ‘Separation’ (as the Protesters say) ‘being highly impedimental to reformation.’ (Rep. to Ass., 1652) I know every Christian, and ministers of the Gospel, in a special manner, ought to be very cautious, guarding against giving offense to any of Christ’s little ones, but if they will take offense at doing what is plain present duty, though they are to be pitied and used tenderly, yet they are not to be regarded so as to omit duty for fear they take offense. When the great apostle of the gentiles opposed Peter, and other saints, who pretending greater strictness, did separate from the gentile converts, he knew his conduct in that would offend many who were dear unto the Lord; yet he regarded not their offense, but ‘withstood Peter to the face, because he was to be blamed.’ (Gal. 2:11-14) Our Lord Jesus knew his healing and curing diseased persons on the Sabbath would occasion such as watched him (Mk. 3:2) to take offense; He also knew his familiar converse with publicans and sinners would be stumbling and offensive to sundry; yet he would not forbear it. Sometimes we are called to deny ourselves as to our ease, conveniency, pleasure and satisfaction rather than occasion the offending of such as causelessly take offense, but, according to our Lord’s example, commanded present duty is to be done, let never so many stumble or be offended. Hence [Matthew] Henry says (on Mk. 2:16), ‘Those are too tender of their own good name who, to preserve it with some nice people, will decline a good work; Christ would not do so.’ And tender Christians, who may be ready to take offense, ought to consider what danger there is in being ‘righteous over much.’ If the prophetess Miriam, or Aaron, the saint of God, speak against Moses, his Lord will resent it, asking ‘Wherefore were ye not afraid to speak against my servant Moses?’ (Num. 12:8) Now, for doing what, in my opinion, is plain present duty in this case, viz. the opposing what I take to be sinful schism, though I should further suffer in my reputation from some, yet ’tis some satisfaction to think in this I’m far from being singular; for here I suffer with a cloud of faithful witnesses, as…</p></blockquote>

<blockquote><p>…there is a twofold scandal which may be and has been given by things lawful in themselves… viz. the giving of occasion to the weak to condemn our lawful deeds, and the animating of them to follow our example against their own consciences: both ways we make them to sin. …Behold what scandal may arise, even out of things which are in themselves lawful, which also arises out of the ceremonies (let them be as lawful as can be): …2. We are animated by the example of Formalists to practice conformity, which in our consciences we condemn, and by consequence do sin, because he that doubteth is damned, and whatsoever is not of faith is sin.</p></blockquote>

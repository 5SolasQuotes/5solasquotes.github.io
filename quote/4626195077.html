<main class="wrap"><figure class="quote" id="q-4626195077" data-kw="">
<blockquote><p>Therefore, in order that none of us may stumble on that stone, let us first consider that there is a twofold government in man (duplex esse in homine regimen): one aspect is spiritual, whereby the conscience is instructed in piety and in reverencing God; the second is political, whereby man is educated for the duties of humanity and citizenship that must be maintained among men. These are usually called the “spiritual” and the “temporal” jurisdiction (not improper terms) by which is meant that the former sort of government pertains to the life of the soul, while the latter has to do with the concerns of the present life—not only with food and clothing but with laying down laws whereby a man may live his life among other men holily, honorably, and temperately. For the former resides in the inner mind, while the latter regulates only outward behavior. The one we may call the spiritual kingdom, the other, the political kingdom. Now these two, as we have divided them, must always be examined separately; and while one is being considered, we must call away and turn aside the mind from thinking about the other. There are in man, so to speak, two worlds, over which different kings and different laws have authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559 edition), 3.19.15 (Battles edition).</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-97903c9b00" data-kw="">
<blockquote><p>Reason 5. Let those that better know the law of the land consider whether it be not necessary to our own peace to free us from lawsuits that we have first the people’s express consent [for church membership, duties and public reproofs]? and whether they may have no action against a minister else for naming any man in the congregation by reproof and pronouncing him a person to be avoided? and so no discipline will be exercised.</p></blockquote>

</figure><figure class="quote" id="q-379021b5c3" data-kw="">
<blockquote><p>The Gibbites in 1681, and Russelites in 1682, and for some years, did maintain the same unhappy principles and practices [as the later M’Millianites after 1689]; and stated their testimonies against paying of excise and customs, and other fool things, not only for themselves, but separation from all that durst not go their lengths, even when imprisoned together going as far from us as the walls of the prison would allow them, and stopping their ears when we went about publick worship three times a day, which was our ordinary in each room… It is a piece of demented infatuation to make little or no difference betwixt that period [before 1689] and this [period after 1689 during toleration], and to follow the same methods that the Lord’s people were obliged to take against tyranny and defections.</p></blockquote>

</figure><figure class="quote" id="q-8b1561376e" data-kw="">
<blockquote><p>It is not in men’s free will that they have government or no government, because it is not in their free will to obey or not to obey the acts of the court of nature, which is God’s court; and this court enacts that societies suffer not mankind to perish, which must necessarily follow if they appoint no government; also it is proved elsewhere, that no moral acts, in their exercises and use, are left indifferent to us…</p></blockquote>

</figure><figure class="quote" id="q-18f4a949e3" data-kw="">
<blockquote><p>For the words themselves, ‘Honor the King’, I have already spoken at large of the duty contained herein: Know we only, that by the King here, is meant Caesar, who was a heathen emperor, one that intruded himself, ruled tyrannously, and was an idolater… … Under this honor is understood, the inward reverence in heart to be declared outwardly by obedience to all their godly commandments, cheerfulness in payments, prayer and thanksgiving, etc. Now if all this be due to a wicked King, as here, and now to be performed of us, if we had a wicked king, what then is to be done of us to such a king as God has bestowed on us?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rogers.html">John Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly and Fruitful Exposition upon all the First Epistle of Peter</cite>, (d. 1636; 1650) | On 1 Tim., 2:17</span></figcaption>

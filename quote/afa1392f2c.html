<main class="wrap"><figure class="quote" id="q-afa1392f2c" data-kw="">
<blockquote><p>A second question is, How far the Law can draw a sinner to Christ? Antinomians tell us of a legal drawing and conversion, and of an evangelic drawing; the legal drawing they say is ours [that of the reformed]; the latter theirs. Assertion 1. The difference between the letter of the Law and the Gospel is not in the manner of working, for the letter of either Law or Gospel is alike ineffectual and fruitless to draw any to Christ. Christ preached the Gospel to hard-hearted Pharisees; it moved them not. Moses preached the Law and the curses thereof to the stiffnecked Jews and they were as little humbled. Sounds and syllables of ten hells, of twenty heavens and Gospels, without the Spirit’s working, are alike fruitless. And we grant the Law is a sleepy keeper of a captive sinner; he may either steal away from his keeper or if he be awed with his keeper, he is not kept from any spiritual, internal breach of the Law, nor moved thereby to sincere and spiritual walking. But the difference between Law and Gospel is not in the internal manner of working, but in two other things: 1. In the matter contained in Law and Gospel: because nature is refractory to violence and the Law can do nothing but curse sinners; therefore it can draw no man to Christ. The Gospel again contains sweet and glorious promises of giving a new heart to the elect, of admitting to the Prince of peace laden and broken-hearted mourners in Zion and in conferring on them a free imputed righteousness; and this is in itself a taking-way, but without the Gospel-spirit [it is] utterly ineffectual. 2. To the Gospel there is a Spirit added, which works as God does with an omnipotent pull; and this Spirit does also use the Law to prepare and humble; though this be by a higher power than goes along with the Law as the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London: 1647), pp. 272-318</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e02eae89de" data-kw="">
<blockquote><p>The will of God is one, since it is the very essence of God. Yet sometimes it is spoken of as many, as in the words of Ps. 110:2: ‘Great are the works of the Lord, sought out according to all His wills.’ Therefore sometimes the sign must be taken for the will… Some things are said of God in their strict sense; others by metaphor, as appears from what has been said before (q. 13, art. 3). When certain human passions are predicated of the Godhead metaphorically, this is done because of a likeness in the effect. Hence a thing that is in us a sign of some passion, is signified metaphorically in God under the name of that passion… In the same way, what is usually with us an expression of will, is sometimes metaphorically called will in God; just as when anyone lays down a precept, it is a sign that he wishes that precept obeyed. Hence a divine precept is sometimes called by metaphor the will of God, as in the words: ‘Thy will be done on earth, as it is in heaven’ (Matt 6:10)… Therefore in God there are distinguished will in its proper sense, and will as attributed to Him by metaphor. Will in its proper sense is called the will of good pleasure; and will metaphorically taken is the will of expression [signi], inasmuch as the sign itself of will is called will… Expressions [signa] of will are called divine wills, not as being signs that God wills anything; but because what in us is the usual expression [signa] of our will, is called the divine will in God. Thus punishment is not a sign that there is anger in God; but it is called anger in Him, from the fact that it is an expression [signum] of anger in ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, q. 19, art. 11</span></figcaption>

</figure><figure class="quote" id="q-9aa4adf912" data-kw="">
<blockquote><p>Another reason is taken according to another way of distinguishing: because some are signs of the absolute divine will, others of the conditional. I say, therefore, that because one cannot act against the absolute will, one cannot act against the signs of the absolute will, such as are fulfillment and permission. But because one can act against the antecedent or conditional will, because man can turn away from the order to which he was created by his institution: hence it is that one can act against the will of the sign which signifies that, namely against prohibition, precept, and counsel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 47 | quest. 2, ‘Whether anyone can act against the will of the sign’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>What we will antecedently, we do not will simply, but in a qualified sense; because the will is compared to things as they are in themselves: but in themselves they are in particular, hence we simply will something, according as we will it considering all particular circumstances, which is to will consequently.</p></blockquote>

<blockquote><p>2. The convictions and excitations of conscience are prevented, or made ineffectual by the prosperity of sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Danger of Prosperity Discovered in Several Sermons upon Prov. 1:27</cite>, (London: Aylmer, 1685), p. 67</span></figcaption>

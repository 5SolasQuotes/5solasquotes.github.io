<blockquote><p>We usually consider the separation of the attributes as quite a bit different than the distinction of the persons themselves. Indeed, in the distinction of persons, no religious devotion causes us to do anything but form three concepts referred not to some three divines (because the word “divine” denotes the essence common to the three persons), but to three hypostases in that divine, each of which circumscribes and determines our thought.

But in the distinction of attributes, if when we happen to imagine various concepts, it’s the case that according to our mode of conceiving and considering we conceive of the divine properties hardly different than of some powers (and surely Peter calls them αρετας), like they should differ in their nature from the essence, close to like how we understand habits and qualities are different from the very substance of the soul.

But after we’ve grown in this so that we ponder in our hearts that whatever is in God is necessarily God himself (which is God’s absolutely simple nature, utterly devoid of any composition), then we both immediately retract all those concepts into one only, and advance from it such that he is defined by one object without any distinction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mo-se-amyraut.html">Moїse Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissertation on the Economy of the Three Person in the Divine Works (1645) , trans. Ryan M. Hurd in Ad Fontes: A Journal of Protestant Resourcement</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-caae9f43b3" data-kw="">
<blockquote><p>God in his Word reveals Himself to be Jehovah Elohim, i.e. one God subsisting in three Persons. Though essence and subsistence, that is, the divine nature, and the Trinity of Persons in that nature, are the same thing, they being distinguished not as a Being and a Being, but as the manner of a Being or thing is distinguished from the Being or thing itself: yet for the help of our apprehension, God being pleased so far to condescend to our capacity (as delighting to be understood by us), we first consider of the essence, then of the subsistence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 1-2</span></figcaption>

<blockquote><p>Let our Souls pause and imagine what an Incomprehensible Spirit GOD is! What is his Name, and his Sons Name, if thou canst tell. HE is that He is, has Life in Himself, and in Him we live and move and have our Being. The Worlds of Spirits, and so the Corporeal Universe, are his Workmanship, continually sustained and governed by Him.

His active Essence therefore intimately pervades and penetrates the immeasurable Frame! GOD is Life, Light, Mind, Self-existence; Glory, Blessedness, Perfection; incomparable, inconceivable. To Whom can we liken Him, or what Likeness can we compare unto Him? Singularity and Onliness is his Glory. There is One God, and no other than He.

We should not have dared to say of God that He is a Spirit, or to have called Spirits his Image and Likeness, if He Himself had not so spoken to us of Himself. Yet is there no other Image whereby our Minds can represent Him to themselves, but from their own spiritual Nature, Powers, and Operations. This therefore must be the first thing in the Image of God of Angels and Men, Spirituality. In this Glass we see the first Shadow of God. Our Souls discern it by Reflection on themselves. We then look without, look abroad, and see thro’ the Eyes of the Body Images of Wisdom, Power and Goodness, in every thing Material and Visible.

We see the Work of some perfectly wise, good, Almighty Intelligence. — It is in and from it self, that the poor finite Spirit of Man, conscious to its own Understanding and Affections, and enlightened from the Spirit and Word of God, conceives and infers what a transcendent Being and Spirit God is; the Framer of the Universe, and the Former and Father of all Spirits. It is because we in our Souls bear some Image of God, that we can at all apprehend &amp; know that God is a Spirit. The Beasts have Eyes to see the Fields of Grass and Corn as much as we, but not having our Souls to discern the Eternal Power and Godhead from the Things that are made, their Spirits are not the Likeness of God as ours are.

And yet the spiritual Nature of Angels and Men is not to be compared with the Spirituality of God, or the Simplicity of his Essence. The grossest Matter that our Eyes behold is not so much below the Soul of Man, as that is below the Spirituality of the Divine Nature. Never the less in the Faculties of the Human Soul we plainly see some Resemblance of the Infinite Eternal Spirit, the Maker and Preserver of all Things, visible &amp; invisible. And this is the first and most obvious part of the Image of God upon us in our Creation, that we are Souls or Spirits. God who made us this Soul, herein has made us in his own Image, after his Likeness; for He is THE SPIRIT, and the Father of Spirits.

God is a Spirit in a Sense far superior to that wherein Angels are to be so called. He maketh his Angels Spirits. I doubt not but God is more invisible to them, and in Comparison of them, than they are to us and in Comparison of us. Created Spirits are compounded Beings if compared with their MAKER; they are made what they are, and He who made them can if he please annihilate and dissolve them again.

But there is an ineffable, inconceivable Simplicity of Essence in the Divine Nature, which infinitely distinguishes His Spirituality from that of all Creatures.— Angels and Souls are Spirits but they singly occupy a space, and pass from place to place, with an incredible Swiftness, like Rays of Light; but the Invisible God is an Immense Being filling Heaven and Earth, always present and the same in all Places. This is as far above Souls or Angels, as they are above Bodies.

It is a most just and glorious Account that God gave of Himself to Moses, I AM THAT I AM. He is what no One else is or can be; He is alone what He is; what all his Creatures can but poorly represent, and less can understand; even as the Shadow of a Man does but poorly represent him in his Life, Look, Thought and Speech. — God is singly the Spiritual BEING, and there is none like Him, none beside Him. As there is none Good but One which is God, so is there but One only Spirit in the Universe, who filleth all in all.

Thus the Lord our God is ONE LORD, and the Knowledge of HIM is too wonderful for us; it is high, and we cannot attain to it: yea how little do we know of our own Spirits, which are made for the Knowledge of Him? It is but as thro’ a Glass darkly that we see any thing of GOD. The Ideas of Infinite, Eternal, Unchangeable and Self existent are the Proof and Illustration of his Spirituality. We can only explain and confirm the One from the other. As what Man knoweth the Things of a Man, save the Spirit of Man that is in him? even so the things of God knoweth no Man, but the Spirit of God: Which Things we therefore speak, not in the Words which Man’s Wisdom teacheth, but which the Holy Ghost teacheth, comparing spiritual things with spiritual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-colman.html">Benjamin Colman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dissertation on the image of God wherein man was created</cite>, (Boston: S. Kneeland and T. Green, 1736), pp 4-7.</span></figcaption>

d+glorious+Account+that+God+gave+of+Himself+to+Moses%2C+I+AM+THAT+I+AM.+He+is+what+no+One+else+is+or+can+be%3B+He+is+alone+what+He+is%3B+what+all+his+Creatures+can+but+poorly+represent%2C+and+less+can+understand%3B+even+as+the+Shadow+of+a+Man+does+but+poorly+represent+him+in+his+Life%2C+Look%2C+Thought+and+Speech.+%E2%80%94+God+is+singly+the+Spiritual+BEING%2C+and+there+is+none+like+Him%2C+none+beside+Him.+As+there+is+none+Good+but+One+which+is+God%2C+so+is+there+but+One+only+Spirit+in+the+Universe%2C+who+filleth+all+in+all.%0A%0AThus+the+Lord+our+God+is+ONE+LORD%2C+and+the+Knowledge+of+HIM+is+too+wonderful+for+us%3B+it+is+high%2C+and+we+cannot+attain+to+it%3A+yea+how+little+do+we+know+of+our+own+Spirits%2C+which+are+made+for+the+Knowledge+of+Him%3F+It+is+but+as+thro%E2%80%99+a+Glass+darkly+that+we+see+any+thing+of+GOD.+The+Ideas+of+Infinite%2C+Eternal%2C+Unchangeable+and+Self+existent+are+the+Proof+and+Illustration+of+his+Spirituality.+We+can+only+explain+and+confirm+the+One+from+the+other.+As+what+Man+knoweth+the+Things+of+a+Man%2C+save+the+Spirit+of+Man+that+is+in+him%3F+even+so+the+things+of+God+knoweth+no+Man%2C+but+the+Spirit+of+God%3A+Which+Things+we+therefore+speak%2C+not+in+the+Words+which+Man%E2%80%99s+Wisdom+teacheth%2C+but+which+the+Holy+Ghost+teacheth%2C+comparing+spiritual+things+with+spiritual.%E2%80%9D%0A%0A%E2%80%94+Benjamin+Colman%2C+A+dissertation+on+the+image+of+God+wherein+man+was+created%2C+%28Boston%3A+S.+Kneeland+and+T.+Green%2C+1736%29%2C+pp+4-7.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0fe6c6a596.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0fe6c6a596.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/03/14/benjamin-colman-on-the-divine-incomprehensibility-simplicity-and-spirituality/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>III. Because the essence and attributes of the Deity are not immediately, adequately comprehended by the human mind, as they are in themselves, and so perfectly: but only through the way of negation, causality, eminence: for here the human mind conducts itself as the eyes of owls to the sun.</p></blockquote>

</figure><figure class="quote" id="q-d205dc04a4" data-kw="">
<blockquote><p>…Grim’s objection also seems to assume a model of divine knowledge which would be rejected by those who hold (as, again, Scholastic realists do) that God is absolutely simple or noncomposite. In particular, it seems to assume that the truths God knows correspond to discrete ideas in the divine intellect, which together form a set. But given divine simplicity, what we describe in terms of such discrete ideas is really one and the same thing in God. There is in God something analogous to what we call, in the case of our own intellects, a grasp of the proposition that all men are mortal, something analogous to what we call a grasp of the proposition that Socrates is a man, and so forth. But these are different ways of describing what, in God, is really one and the same thing.</p></blockquote>

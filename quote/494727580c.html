<main class="wrap"><figure class="quote" id="q-494727580c" data-kw="">
<blockquote><p>XVI. Moreover, it makes no difference for justification according to the law whether our good works proceed from our own free will or from the power of the Holy Spirit (even though, by the law, the Spirit is not received – Gal. 3:2). For in judgment according to the law, what matters is whether you have done what the law requires as it should be done, not where that obedience came from. Just as in judgment according to the Gospel, what matters is not how faith came about, but whether you believe. Thus, if it were possible for someone, by their own free will and without the work of the Holy Spirit, truly to believe in Christ, he would be just as justified before God as one in whom the Spirit has implanted faith—for with God there is no partiality (Rom. 11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joshua-placeus.html">Joshua Placeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Justification of Man before God’ (1634)</cite>, p. 4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6781601465" data-kw="">
<blockquote><p>Those of mankind that are predestinated unto life, God, before the foundation of the world was laid, according to his eternal and immutable purpose, and the secret counsel and good pleasure of his will, hath chosen, in Christ, unto everlasting glory, out of his mere free grace and love, without any foresight of faith, or good works, or perseverance in either of them, or any other thing in the creature, as conditions, or causes moving him thereunto; and all to the praise of his glorious grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 3.5</span></figcaption>

<blockquote><p>2. That the only moving and efficient cause of election and predestination unto life is the mere good pleasure and grace of God, not the consideration of any foreseen faith, perseverance, good works, good will, good endeavors, or any other quality or condition whatsoever in the persons elected. 3. That though sin be the only cause of damnation, yet the sole and primary cause of reprobation or non-election (that is, why God does pass by this man rather than another, why He rejected Esau, when He elected Jacob) is the mere freewill and pleasure of God: not the confideration or foresight of any actual sin, infidelity, or final impenitency in the persons rejected.</p></blockquote>

</figure><figure class="quote" id="q-26b513cea7" data-kw="">
<blockquote><p>Paul … alludes to the creation of Adam, and rises up to the eternal purpose of God, who, before he created mankind, decreed of his own mere will and pleasure, to manifest his glory, both in saving of some whom he knew, in a way of mercy, and in destroying others, whom he also knew, in righteous judgment. And verily, unless we judge this to be the case, God will be greatly injured; because he will not be sufficiently wise, who first creates men, and looks upon them corrupt, and then appoints to what purpose he has created them: nor sufficiently powerful, if when he has taken up a purpose concerning them, he is hindered by another, so that he obtains not what he willed; nor sufficiently constant, if willingly and freely he takes up a new purpose, after his workmanship is corrupted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Most Complete Tract on the Doctrine &amp; True Use of Predestination, out of the Lectures of Theodore Beza on Chapter 9 of the Epistle to the Romans… adjoined are some places taken out of the book of Dr. Luther on the Bound Will Against Erasmus, from which appears that his judgment on Predestination was in everyway consonant with ours 2nd ed. ed. Raphael Eglin (Eustathius Vignon, 1583) 182</cite>, pp. no ToC Table</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

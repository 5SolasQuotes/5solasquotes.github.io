</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-711b1f206b" data-kw="">
<blockquote><p>Simplicity is God, one mere and perfect act without all composition. God calls his name, ‘I am,’ Ex. 3:14, that is, mere essence, wherein is nothing past, nor to come. Because spirits are immixed in respect of bodies, to show that He is not compounded, He says He is a Spirit, Jn. 4:24. When we say that God is a mere and perfect act, the meaning is that God is a cause without any cause, a being that is not from any being; not compounded of an act, by which He is, and possibility, by which He might not have been or may not be: of whom it never could, nor can be said that anything was to be in Him, which was not; or cannot be, that is. That God is a pure and simple act without all composition is evident, because of his perfection; all composition supposes imperfection, because He is the first Being. Were there any composition in God, it would follow there were first and second in God: Something in God that were not first, or that there were more first Beings. Because God is a Being of absolute necessity (Deus est ens necesse esse [God is necessary being]. Smising, Of the One God, tract 2, disp. 2, n. 49): Composition implies either that there must be more beings of absolute necessity, or that there is something in God that may not be. Composition supposes succession, i.e. something past or to come in God; contrary to his name, ‘I am’. Nay it supposes that not-being is not repugnant to the nature of God: Where there is composition, there may be dissolution; dissolution is the way to not-being. It much helps us in the contemplation of the simplicity of God to look upon it as opposed to composition, all the ways whereof the learned have referred to these seven heads. Composition is either of 1. Parts, which are bounded by quantity; as a body having one part upon another. 2. Matter and form; as a man of body and soul: these two compositions are only found in corporeal things. 3. General and special nature: as every species, whose common nature is to be found in some other thing, where the special nature is not; as a living creature and a man. 4.A subject and an accident; as every created substance: There are no accidents in God: He is wise, holy, just, essentially: there is not a substance and a quality in Him. When God is said only to have immortality, 1 Tim. 6:16, it is to be understood by way of eminency; He so has it as none has besides Him: He has it originally, not derivatively and by participation. 5. An act and a possibility-objective that is to be, if the thing looked at as yet is not in being; or [a possibility-]passive that is not to be (though that not-being never shall be), if the thing be looked at as in actual being: this composition holds concerning angels. 6. A person and nature; as Christ, compounded of the divine Person and human nature; which yet is not properly composition of parts, but of number. 7. Being and individuation; that is, that by which we have such a particular being, as humanity and Peter. Objection: Where there is a plurality, there is not simplicity: But in the divine nature there is a plurality: therefore. Answer: The objection holds where there is a plurality of essences, beings or things, but not where there is only a plurality of subsistences. In the divine nature, though there be a Trinity, therefore a plurality of subsistences or Persons, yet there is but one essence: In the Trinity there is distinction, but not composition. Objection 2. The attribute of simplicity concludes that all the attributes are God Himself, and consequently that there is no inequality amongst them: yet we read that his tender mercies are over all his works; so, as it may seem, mercy exceeds the other attributes. Answer: The meaning is that his mercy is over, that is, upon all his works, not that God’s mercy exceeds all his other attributes, as if one attribute were greater than another: for all the attributes of God are equal, not one higher or greater than another, because they are all God Himself. From the simplicity of God it follows: 1. That whatsoever is in God, is God. 2. Whatsoever God wills He willed from eternity and always wills. 3. Whatsoever God wills, He wills simply, absolutely and independently. 4. God is justice, wisdom, love, etc. essentially: although He be said to have them eminently, yet He has them not derivatively.</p></blockquote>

<blockquote><p>The analogical use of terms is crucial to understanding God’s knowledge properly in another respect. I have spoken of various concepts and propositions existing in the divine intellect, but they cannot exist there in exactly the same sense in which they exist in our intellects. For in our intellects they exist as distinct thoughts, and there cannot be any such distinctions in God consistent with his simplicity. To a first approximation, we might think instead in terms of a conjunction of all propositions, and say that there is in the divine intellect something like a single thought with this one gigantic conjunctive proposition as its content. But even that cannot be quite right, because this single conjunctive proposition will itself have component parts. A better, though still imperfect, way to understand the nature of God’s knowledge would be to think in terms of analogies like the following. From a beam of white light, various beams of colored light can be derived by passing it through a prism. Though the colors are not separated out until the beam reaches the prism, they are still in the white light in a unified way. From a lump of dough, cookies of various shapes can be derived by means of cookie cutters. Though the various cookies with their particular shapes are not separated out until the cutters are applied to the dough, they are still in the uncut dough virtually. Now, God is pure actuality, whereas each kind of created thing represents a different way in which actuality might be limited by potentiality. That is to say, each created thing is comparable to one of the different specific colors that might be derived from the white light that contains all of them, or is like one of the many cookie shapes which might be derived from the dough which contains all of them. God’s creation of the world is thus like the passing of white light through a prism or the application of the cutters to the dough. The prism draws out, from the color spectrum which is contained in a unified way in the white light, a particular beam of this color and a particular beam of that color; and the cutters draw out, from the variety of possible cookies contained in a unified way in the lump of dough, a cookie of this particular shape and a cookie of that particular shape… Now, just as if you knew the white light perfectly, you would know all the colors which could be derived from it, and if you knew the lump of dough perfectly, you would know all the shapes which might be carved out of it, so too, perfectly to know that which is pure actuality would entail knowing all the various limited ways of being actual which might be derived from it. And that is how God knows all the various kinds of finitely actual things which exist or might exist—by virtue of perfectly knowing himself as that which is pure or unlimited actuality. That is not to say that his knowledge is exactly like that of someone who grasps the nature of white light or of dough, but it is analogous to that. And even if the analogy is imperfect, that is, as I have said, only to be expected given how very far beyond its ordinary sphere of operation reason has to push itself when seeking ultimate explanations.</p></blockquote>

sm draws out, from the color spectrum which is contained in a unified way in the white light, a particular beam of this color and a particular beam of that color; and the cutters draw out, from the variety of possible cookies contained in a unified way in the lump of dough, a cookie of this particular shape and a cookie of that particular shape… Now, just as if you knew the white light perfectly, you would know all the colors which could be derived from it, and if you knew the lump of dough perfectly, you would know all the shapes which might be carved out of it, so too, perfectly to know that which is pure actuality would entail knowing all the various limited ways of being actual which might be derived from it. And that is how God knows all the various kinds of finitely actual things which exist or might exist—by virtue of perfectly knowing himself as that which is pure or unlimited actuality. That is not to say that his knowledge is exactly like that of someone who grasps the nature of white light or of dough, but it is analogous to that. And even if the analogy is imperfect, that is, as I have said, only to be expected given how very far beyond its ordinary sphere of operation reason has to push itself when seeking ultimate explanations.”

— Edward Feser, Five Proofs of the Existence of God (San Francisco: Ignatius Press, 2017) | ‘The Divine Attributes’, ‘Omniscience’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+analogical+use+of+terms+is+crucial+to+understanding+God%E2%80%99s+knowledge+properly+in+another+respect.+I+have+spoken+of+various+concepts+and+propositions+existing+in+the+divine+intellect%2C+but+they+cannot+exist+there+in+exactly+the+same+sense+in+which+they+exist+in+our+intellects.+For+in+our+intellects+they+exist+as+distinct+thoughts%2C+and+there+cannot+be+any+such+distinctions+in+God+consistent+with+his+simplicity.+To+a+first+approximation%2C+we+might+think+instead+in+terms+of+a+conjunction+of+all+propositions%2C+and+say+that+there+is+in+the+divine+intellect+something+like+a+single+thought+with+this+one+gigantic+conjunctive+proposition+as+its+content.+But+even+that+cannot+be+quite+right%2C+because+this+single+conjunctive+proposition+will+itself+have+component+parts.+A+better%2C+though+still+imperfect%2C+way+to+understand+the+nature+of+God%E2%80%99s+knowledge+would+be+to+think+in+terms+of+analogies+like+the+following.+From+a+beam+of+white+light%2C+various+beams+of+colored+light+can+be+derived+by+passing+it+through+a+prism.+Though+the+colors+are+not+separated+out+until+the+beam+reaches+the+prism%2C+they+are+still+in+the+white+light+in+a+unified+way.+From+a+lump+of+dough%2C+cookies+of+various+shapes+can+be+derived+by+means+of+cookie+cutters.+Though+the+various+cookies+with+their+particular+shapes+are+not+separated+out+until+the+cutters+are+applied+to+the+dough%2C+they+are+still+in+the+uncut+dough+virtually.+Now%2C+God+is+pure+actuality%2C+whereas+each+kind+of+created+thing+represents+a+different+way+in+which+actuality+might+be+limited+by+potentiality.+That+is+to+say%2C+each+created+thing+is+comparable+to+one+of+the+different+specific+colors+that+might+be+derived+from+the+white+light+that+contains+all+of+them%2C+or+is+like+one+of+the+many+cookie+shapes+which+might+be+derived+from+the+dough+which+contains+all+of+them.+God%E2%80%99s+creation+of+the+world+is+thus+like+the+passing+of+white+light+through+a+prism+or+the+application+of+the+cutters+to+the+dough.+The+prism+draws+out%2C+from+the+color+spectrum+which+is+contained+in+a+unified+way+in+the+white+light%2C+a+particular+beam+of+this+color+and+a+particular+beam+of+that+color%3B+and+the+cutters+draw+out%2C+from+the+variety+of+possible+cookies+contained+in+a+unified+way+in+the+lump+of+dough%2C+a+cookie+of+this+particular+shape+and+a+cookie+of+that+particular+shape%E2%80%A6+Now%2C+just+as+if+you+knew+the+white+light+perfectly%2C+you+would+know+all+the+colors+which+could+be+derived+from+it%2C+and+if+you+knew+the+lump+of+dough+perfectly%2C+you+would+know+all+the+shapes+which+might+be+carved+out+of+it%2C+so+too%2C+perfectly+to+know+that+which+is+pure+actuality+would+entail+knowing+all+the+various+limited+ways+of+being+actual+which+might+be+derived+from+it.+And+that+is+how+God+knows+all+the+various+kinds+of+finitely+actual+things+which+exist+or+might+exist%E2%80%94by+virtue+of+perfectly+knowing+himself+as+that+which+is+pure+or+unlimited+actuality.+That+is+not+to+say+that+his+knowledge+is+exactly+like+that+of+someone+who+grasps+the+nature+of+white+light+or+of+dough%2C+but+it+is+analogous+to+that.+And+even+if+the+analogy+is+imperfect%2C+that+is%2C+as+I+have+said%2C+only+to+be+expected+given+how+very+far+beyond+its+ordinary+sphere+of+operation+reason+has+to+push+itself+when+seeking+ultimate+explanations.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+Five+Proofs+of+the+Existence+of+God+%28San+Francisco%3A+Ignatius+Press%2C+2017%29+%7C+%E2%80%98The+Divine+Attributes%E2%80%99%2C+%E2%80%98Omniscience%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9945e0b4ac.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9945e0b4ac.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-divine-simplicity/#:~:text=The%20an <blockquote><p>§2. Just as the essence and existence of God do not really differ from His vital actuality [actuositas vitalis], but are distinguished only by a mental abstraction: so His understanding and willing are comprehended under His life, or most perfect thought, as by no means really distinct from one another, but as identified in God—so that the distinction here also is nothing but the abstraction of our mind.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-787ebefe58" data-kw="">
<blockquote><p>But he is called the Father of Christ also in respect of each of his natures. For the Father by an eternal and ineffable generation hath communicated to his Son his Divine essence. I say by an eternal generation : because we must not think in divine things that God the Father is prior to his Son, as among creatures the father always is.

Well spake Damascenus [John of Damascus], … with respect then to the generation of the Son it is impious to say that there was interval of time. For the Son is not brought into existence from a state of non-existence, but always was with the Father, and in him from all eternity, and without beginning begotten by him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), i, 56.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3d64d40d2a" data-kw="">
<blockquote><p>As the Head of his Church, Christ is its source of spiritual influence. In him, for the use of his Church, the Spirit dwells in immeasurable degree. For the “Father giveth not the Spirit by measure unto his Son.” It has thus pleased the Father, that in him all fulness should dwell; and the conclusion is clear — Out of his fulness may we all receive, even grace upon grace. Oh, it was no scanty supply of the Spirit Christ ensured for his Church. There is no risk of soon draining this fountain dry. Believe it, it is inexhaustible. Hither may you repair, and drink of the water of life as largely as your finite capacities will admit of, and yet leave it undiminished.

Mark well, for it is important, the encouragement afforded us by the death of Christ to expect free and full communications of the Holy Spirit. Had Christ not died, the Spirit could in no degree — not even in the smallest —have been sent forth to enlighten, and sanctify, and save; for the justice of God, unpropitiated and unappeased, would have stood immoveably in the way of this. But now Christ having died, and justice being satisfied, and every obstacle on God’s part removed, what hinders that the Spirit be now shed forth through Christ, and that not grudgingly and sparingly, but cheerfully and abundantly?

It is now not merely consistent with the Divine character that the Spirit may be obtained. The glory of the Divine character requires that what Christ died for be accomplished — that what he purchased be bestowed. To imagine that Christ has obtained by his death only a small measure of spiritual influence for the Church, is virtually to detract from the merit and efficacy of his death. To go to God with doubting, confused, straitened desires for the Spirit, is virtually to deny that the Spirit is the purchase of Christ for his Church, and to insinuate that something yet remains to be done to entitle us to receive him, at least so fully as we need.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-l-r-foote.html">Alexander L. R. Foote</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of the Lord not Straitened in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-1021da70d5" data-kw="">
<blockquote><p>The Scriptures teach that there is essentially but one God, and, therefore, that the essence both of the Son and Spirit is unbegotten; but inasmuch as the Father is first in order, and of himself begat his own Wisdom, he, as we lately observed, is justly regarded as the principle and fountain of all the Godhead. Thus God, taken indefinitely, is unbegotten, and the Father, in respect of his person, is unbegotten.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.25</span></figcaption>

<blockquote><p>71. Fourthly, they [Romanists] accuse us of blasphemy against the Son of God, for denying (as they say) that He is Deus ex Deo, God of God: against the doctrine of the Nicene Creed; and this they call the atheism of Calvin and Beza: a palpable slander: for neither Calvin nor Beza did ever imagine, much less utter the same in that sense which they lay to their charges: for let [Robert] Bellarmine their sworn adversary speak for them: ‘Calvin and Beza teach’ (says he) ‘that the Son is of Himself in respect of his essence, but not in respect of his Person, and they seem to say that the essence of the Deity in Christ is not begotten, but is of itself: which opinion’ (says he) ‘I see not why it may not be called Catholic.’ Here Bellarmine tells us truly what their opinion was, and does acknowledge it to be a true catholic doctrine: and yet in the same chapter he contemns Calvin for his manner of speaking of it and of intolerable sauciness for finding fault with the harshness of the phrase used by the Nicene Council, ‘God of God: Light of light’. Mark (I pray you) his absurdity, it is catholic, and yet it may not be spoken: it is true, and yet it is to be blamed. May not a catholic doctrine be spoken then? or must the truth be smothered? This is such an inconsequence as neither reason nor religion can any ways bear withal: and for his saucy dealing with the Nicene Council, all that ever he says is, that it is durum dictum, ‘a hard phrase’: yet so that he confesses it may receive a good and commodious interpretation if it be understood in the concrete, that Christ who is God, is of the Father that is God: the word being taken personally, and not in the abstract; as if the essence of the Deity of the Son should be from the Father, which is entirely subsisting, in, of, and by its own eternal, incomprehensible, and most glorious nature: and this without question was the true intendement of the Council; for else it had not confuted, but favored the blasphemous heresy of Arius, against whom it was assembled, which Calvin and Beza do not anyways cross, but onely bring unto it a fit and fauourable exposition. Thus we have Bellarmine, Calvin’s and Beza’s patron in this doctrine, though full ill against his will: and not only him, but Ribera and Gregory de Valentia, two other no mean Rabbies, both which do conclude that: ‘the Son as He is a Person, is of another; but as He is a simple ens [being], is not of another: and that the essence does not beget the essence, but the Father the Son;’ so that either they are slanderers of the truth, or their catholic doctrines may be atheism and blasphemy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-beard.html">Thomas Beard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Retractive from the Romish Religion</cite>, … (London, 1616), Motive 12, pp. 469-70</span></figcaption>

<blockquote><p>This union [of the person of the Son with the human nature in the inarnation] can be viewed either in respect of the principle or in respect of the terminus. In the former sense, it is attributed to the whole Trinity, by the power of which such union is made (to wit, by a transient action of God by which he united in the person of the Logos, the humanity of Christ). In the latter, it belongs to the Logos alone because it is terminated on him. Although the person of the Logos may well be said to have been incarnate, yet the Trinity itself may not because the incarnation is not terminated on the divine nature absolutely, but on the person of the Logos relatively.</p></blockquote>

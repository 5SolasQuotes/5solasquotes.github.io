<main class="wrap"><figure class="quote" id="q-62f7cadd1b" data-kw="">
<blockquote><p>[F]or many greatly deceive themselves in hearing the word. They admit of sacred truths in their understanding, and assent unto them, but take not in the power of them on their consciences, nor strictly judge of their state and condition by them, which proves their ruin; for healthy they seem to themselves to believe that whereof in truth they believe not one syllable as they ought. They hear it, they understand it in the notion of it, they assent unto it, at least they do not contradict it, yea, they commend it oftentimes and approve of it, but yet they believe it not; for if they did, they would judge themselves by it, and reckon on it that it will be with them at the last day according as things are determined therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The grace and duty of being spiritually minded declared and practically improved</cite>, (London, 1681) in W. H. Goold (ed.), The works of John Owen (16 vols, Edinburgh, 1965), vii, 271-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith.html">Faith</a></span></div>

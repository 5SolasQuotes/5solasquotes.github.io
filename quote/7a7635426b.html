<blockquote><p>2. The apostle, 1 Jn. 5:16, speaks of a sin unto death, that we are not to pray for one guilty of that; This has much troubled the learned; The ancients, they thought it was not an absolute prohibition of all [persons] to pray for such, but only that eminent men might do it; They thought for an ordinary Christian to pray for such sinners, it would be high presumption; As it’s not for everyone in the court to speak for some heinous offender but a special favourite; When God said, though Noah, Job and Daniel should pray for that people, He would not hear them (Eze. 14:14); This implied that they were nearer to God’s ear and might prevail sooner than others; Though this exposition be old, yet the text seems to be absolutely prohibitive; and so Augustine said that if we knew who had sinned that unpardonable sin against the Holy Ghost, we were no more to pray for him than for one damned in hell:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>145 Expository Sermons upon the Whole 17th Chapter of the Gospel according to St. John… (London: Miller, 1656), Sermon 41, ‘Of Praying both for the Godly &amp; the Wicked,’</cite>, pp. 229-30</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c7ef78fc9" data-kw="">
<blockquote><p>Thus you have heard the nature and specifications of injustice; now look upon the continuance of it; for so much the word imports. God will not cast all sinners into Hell, who then should go to heaven? but ‘the unjust’: such as practice unrighteousness without any recovery of repentance. ‘The unrighteous shall not enter into the kingdom of heaven’ (1 Cor. 6:9; Eph. 5:6): it is the continuance in sin that excludes from mercy. Two things throw men to perdition without the intervention of extraordinary favor: malice in sin and utter apostasy. These be the symptoms of that endangered disease for which there is no balm in Gilead; we call it the sin of the Holy Ghost. Not that it is against the third Person, as He is the third Person, more than against the first or second: but because it is against the function or operation of that Person, whose office is to illuminate the mind and mollify the heart with love: therefore Himself is called love. (Heb. 10:26) If men sin wilfully after that they have received the knowledge of the truth, there remains no more sacrifice for their sins: because they maliciously have sacrificed their sacrifice and split the only vessel that should save them. The iniquity of Eli’s house shall not be purged with sacrifice forever (1 Sam. 3:14): never expiated. There is a sin unto death, I do not say he shall pray for it. (1 Jn. 5:16) Every sin is unto death, but this emphatically, with a prohibition of interceeding set upon it, like the flaming sword that kept Paradise; Pray not for it. Schoolmen give this reason why the sinne of malice is unpardonable: The defect may find remission where the will may pretend fear of excess. A sin of ignorance is often forgiven, as was Paul’s (1 Tim. 1:16), because a man may affect too much knowledge, as Adam did. A sin of infirmity is oft forgiven because a man may affect too much power and dominion, as did the angels. A sin of carnal fear is often forgiven because a man may affect too much zeal; as did two of the apostles. A sin of partiality is oft forgiven because a man may affect too much justice. (Eccl. 7:14) But not a sin of malice, because a man can never affect too much charity. No less does apostasy and falling off from God; Totus, a toto, in totum. A man may sin beyond all comfort in his own conscience, till he cannot hope for himself, as did Judas. Beyond all interest in the Church’s devotion, till their prayers cannot help them: ‘Pray not thou for this people.’ (Jer. 7:16) Beyond all claim to Christ’s satisfaction; the blood of the Lamb shall not help them, Mt. 12:31. That which makes this sin past all cure is because it strives against the cure: as a mad man wounded will not suffer his wounds to be bound up, but rather seeks to wound the surgeon, God has mercy upon sinners, Christ came to call and die for sinners, there be none now in heaven but they were once sinners; which of all the holy patriarchs, blessed apostles, can excuse themselves that they never did act unjustly? But injustice was none of their trade; they did not live in it, not die in it. Zacheus was once unjust, but he testified his repentance by charity and restitution. But they that practise unrighteousness to the end, in the end shall find judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary or Exposition upon the Divine Second Epistle General... (London: Badger, 1633), on 2 Pet. 2:9, “to reserve the unjust unto the day of judgment to be punished”</cite>, pp. 709-10</span></figcaption>

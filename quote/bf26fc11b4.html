<blockquote><p>IF of holy letters we be not sleepy nor vain readers, but diligently mark what we read, we shall easily perceive that among other commandments of God this is not at the last nor the least, which he giveth concerning the bringing up of youth in the knowledge of his blessed will.

For the godly wisdom knoweth right well, that except younglings of a commonweal be virtuously brought up, and faithfully framed according the right rule of God’s holy appointment, it cannot come to pass, but that his glory (the good parents being once deceased) must needs be obscured in this world, the invocation of his name cease, and all godly religion decay: yea, the men themselves (if they be worthy of that name) must needs become brute-like, be carried about with every strange doctrine, contemn all laudable laws, break all good orders, follow their fleshly appetites, like unreasonable beasts, and so at last bring both themselves and their realms unto utter destruction.

Therefore as God in his holy law requireth of parents nothing more earnestly than to bring up their children virtuously and according to his word; so likewise all godly fathers and mothers have ever from the beginning done their uttermost endeavour to train up their younglings, even from the very cradles, in the nurture, fear, and doctrine of the Lord; supposing themselves then best to please God, and most to do the true office of godly and natural parents, when they study how to garnish, not their children’s bodies with gay and sumptuous vestures, but their minds with noble and precious virtues; not how to lift them up unto transitory dignities and worldly honours, which, as daily experience teacheth, are more brittle than glass and fade away like the grass, but how to make them honourable and praiseworthy in the sight of good men, and profitable to the commonweal, through virtue, learning, wisdom, and counsel.

And the more parents themselves did excel other in knowledge, wisdom, and learning, the greater desire had they to bring their children unto the like perfection, bearing heavily that theirs should in any point degenerate from their fathers’ virtues, and not orderly answer to the godly qualities of their noble parents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-becon.html">Thomas Becon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to be Known of the Faithful Newly set Forth to the Great Profit of all the Readers (1569) in The Catechism of Thomas Becon … with other pieces written by him in the Reign of King Edward the Sixth, ed. John Ayre (Cambridge: The Parker Society, 1844), pp 480-81.</cite></span></figcaption>

<blockquote><p>They that shall adventure to bring into the city and to sell things forbidden are worthily to be punished with the loss of the things themselves. The same punishment is to be laid upon the buyers, if they yet now have with them the things whole and untouched: otherwise let the punishment be equal unto the price of the things. He that is found selling of profitable things, as meats or drinks, in any other place than in the place appointed, let him bear the loss of all that he sets to sale. Whosoever of his own private authority shall covetously increase the price of things sellable above that [which] is reasonable or above the appointed rate, let him be under the punishment of unlawful usuries, and for a time forbidden to occupy any more.</p></blockquote>

<blockquote><p>190. On what principles do you rest the advocacy of the doctrine in question?

The distinct, continued, or descending obligation of public social Covenants arises from the unchangeable obligation of moral and Christian duty, from the moral identity of the social body, and more especially from the Divine will as revealed in the Scriptures.

191. Does not the moral identity of the national society require that such a latitude of view should be connected with the idea of continued obligation?

It does. The social body is a moral subject, and as such is rewarded or punished by the Supreme Being. “The identity of a nation, as existing through different ages, is, in all moral respects, as real as the identity of an individual through the whole period of his life. The individuals that compose it, like the particles of matter in the human body, pass away, and are succeeded by others, but the body politic continues essentially the same.”

192. Do we find men, in the common affairs of life, recognising and acting upon the principle just alluded to?

Yes; hence, debts contracted, on certain kinds of property, by the parent, descend as a burden upon the heir; debts contracted by the British Government a century ago are still acknowledged as real debts: the Magna Charta granted by King John, and confirmed by his son, Henry III., six hundred years ago, is still considered as constituting the very charter of English liberty; and the Revolution Settlement is still viewed by the nations as equally binding now as it was by those who first entered into it.</p></blockquote>

</figure><figure class="quote" id="q-edb3caa851" data-kw="">
<blockquote><p>They [Papists] do not only say… that one born in an heretical country may deny his country, but that by heresy a man, nay, a king, is deprived of all his jurisdiction, whether natural, civil or politic… One of their own bishops says, “As soon as a Christian king becomes heretical, forthwith the people are freed from subjection.” A cardinal says, “As long as the prince continues excommunicated (as he must do ever, if he be not a Romanist, for the Pope excommunicates ipso facto all heretics) the subject is freed from the oath of subjection,” but by whom? By the Pope, says a Jesuit, who upon just cause has power to absolve from oaths both himself, (as Gregory the 12th did when he sware that if he were chosen Pope he would give it over) and all others. If he be personally excommunicated, then, says their lawyer, subjects are freed from their allegiance and all his heretical assistants are to be rooted out, and their land to be exposed to be possessed of (strangers) Catholics. Nay, says another lawyer, if he be not excommunicated, yet if his heresy be publicly known, there needs no pronunciation of the sentence of excommunication, so that (says the Jesuit) subjects may lawfully deny him obediencer? How so? For the evidence of the crime, (says their whole school, and make it a matter of certainty and faith) does infer a sentence of condemnations because (as the more common opinion does define it) there must we understand the Pope’s will to have him excommunicated, whom upon the knowledge of his fault he would excommunicate. Nay, suppose that a Protestant prince have a just quarrel: yet, no war can be lawfully denounced or waged by the Queen (being excommunicated by name) though otherwise in itself it were most just: because her power is unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, ch. 49, ‘Concerning Magistrates’, ‘What are the Assertions of Papists in this Point?’, p. 901-902</span></figcaption>

<blockquote><p>The second cause [for marriage] is to avoid fornication. This Paul signifieth when he saith, ‘For the avoiding of fornication, let every man have his own wife,’ 1 Cor. vii. 8. He saith not for avoiding of adultery, but for avoiding of fornication, showing that fornication is unlawful, too, which the papists make lawful, in maintaining their stews [brothels], as a stage for fornicators to play upon, and a sanctuary to defend them; like Absalom’s tent, which was spread upon the top of the house, that all Israel might see how he defiled his father’s concubines, 2 Sam. xvi. 22.

For this cause Malachi saith that God did create but one woman for the man. He had power to create more, but to show that he would have him to stick to one, therefore he created of one rib but one wife for one husband, Mal. ii. 15. And in the ark there were no more women than men, but four wives for four husbands, although it was otherwise in the beginning of the world, when many wives might seem necessary to multiply mankind.</p></blockquote>

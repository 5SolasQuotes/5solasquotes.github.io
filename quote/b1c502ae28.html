<main class="wrap"><figure class="quote" id="q-b1c502ae28" data-kw="">
<blockquote><p>The question then comes to this—whether the Scriptures are so plain in things essential to salvation (not as to the things delivered, but as to the mode of delivery; not as to the subject, but the object) that without the external aid of tradition or the infallible judgment of the church, they may be read and understood profitably by believers. The papists deny this; we affirm it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/clarity.html">Clarity</a></span></div>

</figure><figure class="quote" id="q-792fccf965" data-kw="">
<blockquote><p>The question therefore comes to this: is Scripture so understandable in matters necessary for salvation, not with regard to what is taught but with regard to the manner of teaching, not with regard to the subject [persons], but to the object [Scripture itself], that it can be read and understood for salvation (salutariter) by believers without the help of external traditions? The Roman Catholics deny this; we affirm it.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-01e94e1088" data-kw="">
<blockquote><p>In 1649, the General Assembly at Edinburgh, adopted the version which she still uses. The ground-work of this was laid by Mr. Francis Rouse, who is represented as a man of piety and learning. It was recommended to the attention of the Assembly of Divines at Westminster. Under their correcting hand, in the course of several years, it was improved. It was then forwarded to the North, and was, by the supreme judicatory of the Scottish Church, committed to committees for revision. Years were by them employed in comparing it with the original Hebrew, and in attempting to carry as much as possible of the spirit of the primitive composition into the translation.

And the man of literature and taste, who shall carefully examine the subject, it is believed, will admit, that they admirably succeeded. Like the version of the Bible, this of the Psalms, is not remarkable for modern elegance of diction; but it is remarkably literal. To present the book of Psalms in its native simplicity, beauties, and force, was the aim of the Westminster divines, as well as of the Assembly at Edinburgh. To the man of God, to the child of grace, and the man of legitimate taste, these characteristics must be a recommendation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-mcmaster.html">Gilbert McMaster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Book of Psalms, in Five Letters; Addressed to the Friends of Union in the Church of God</cite>, (1818; 4th edn, Philadelphia: Daniels &amp; Smith, 1852), pp 74-75.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

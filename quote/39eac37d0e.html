<main class="wrap"><figure class="quote" id="q-39eac37d0e" data-kw="">
<blockquote><p>That he [Paul] did not propose this his practice [of not receiving money from the Christians in Ephesus in Acts 20:33-35] as a precept or precedent law or rule to all ministers, for he had not power to deprive them of what God had given them (Lev. 27:32; Mt. 10:10; Lk. 11:42; Prov. 3:9,10; Mal. 3:9,10). Tithes were paid by Abraham to Melchisedeck long before the Levitical Law: So that there must be a moral equity in this reciprocal duty both before the Law, under the Law, and after the Law under the Gospel. And though Paul did thus in a juncture and case of necessity because of their present poverty (had they been able, more shame would it have been to them to let him labor) and because false teachers were watching all advantages against him, yet does he himself often assert his own privilege (1 Cor. 9:14; Gal. 6:6) and Christ’s words (he urges) might be collected out of Lk. 6:38 and 16:9, etc. yea, the very terms might be spoken by Christ, for all He spake is not writ (Jn. 20:30).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-ness.html">Christopher Ness</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete History &amp; Mystery of the Old &amp; New Testament, Logically Discussed &amp; Theologically Improved</cite>, (1696), p. 457 Ness was an English, Independent puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-034818ef77" data-kw="">
<blockquote><p>Certainly in Christ’s time both liturgies by forms and also prayers by habit were used [Lk. 18:11-13]. And yet Christ never interposed in the controversy, so as to condemn the one or the other. He condemns the Pharisees for making long prayers to cover their devouring widows’ houses, and for their praying to be seen of men: But whether their prayers were a liturgy and set form, or whether they were extemporary, He takes no notice, as telling us that He condemned neither! (And it’s likely the Pharisees’ long liturgy was in many things worse than ours, though the psalms were a great part of it: and yet Christ and his apostles oft joined with them, and never condemned them). Nay as far as I can find, the Pharisees and other Jews were not in this so blind and quarrelsome as we; nor never made a controversy of it, nor ever presumed to condemn either liturgies or prayers by habit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 32, p. 176</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-3fe43b0229" data-kw="">
<blockquote><p>11. We thought it meet to subjoin the full proof of every word [of our agreed upon articles] from the Scripture, that it might be past controversy with all believers. Concerning the texts cited, I must desire you to observe that every text does not express the very words that we have put down, but all express the sense and sum of the words; so that I think scarce two syllables can be found that are not expressly in the words of Scripture, which contain any matter that is liable to controversy. If you find ten texts cited for one thing, if the words be not in nine of them, it is sufficient if they be in the tenth; and therefore I must intreat you, if you doubt, to peruse them all. And let not the number offend you: If you need them not, they are no trouble to you: Few of them, I think, or none, are impertinent: A consent of many texts may convince more than one single text: at least it will be useful to have so many texts at hand for the convincing any others of any article of the Faith, though you doubt not yourselves. Only the particular application of some parts of the last branch, viz. ‘our consent that such a man shall be our pastor,’ and that ‘we will be members of this or that particular church:’ cannot be proved in terms from Scripture, but by consequence: For who can expect that Scripture should name the persons of our pastors or the places of our habitation?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653), ‘A Brief Explication of some Passages in the Profession’, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<blockquote><p>5. Hearing of the Word is a worshiping of God. Therefore, the Church-hearing of the Word must be Church-worship. For all professing by their visible communion in hearing the Word, one Faith, one Lord, one Hope of glory, and that as one visible body, must thereby testify they be all joint-worshippers of Christ and of one God, whose covenant they preach and hear.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ab89edfd4f" data-kw="">
<blockquote><p>The abolition of the slave trade and of slavery was effected by the vigorous and persevering efforts of noble-minded philanthropists; and the awakened conscience of a Christian people, and the generous sacrifice of twenty-millions of pounds of the public treasury, testified to the earnest desire of Britain to wipe away the last foul stain of the accursed system from the national escutcheon.

The measures proposed for the termination of slavery were at first vehemently denounced by those whose vested rights were interfered with, and were ultimately carried, on the principle of establishing what humanity and justice equally demanded, whatever should become of private or class interests.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Races: The Evils Connected with Horse-Racing and the Steeple-Chase and their Demoralizing Effects</cite>, (1853) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D, Knockbracken (4 vols, Edinburgh: Andrew Elliot, 1876), 4: 329.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

<blockquote><p>2. Calvin thinks their vow not lawful. Bucanus, Polyander and Willet think it the lawful vow of the Nazarites, commanded [in] Num. 6. What then? if by God’s Law of the Nazarites, they abstained from wine and the Passover? God is above his own Law… 3. How prove ye, they abstained from the Passover? being so divine a law, might not their vow suffer an exception for a greater law in eating the Passover? I think it might, for in case of necessity they [the Rechabites] came and dwelt at Jerusalem for fear of the army of the Chaldeans, Jer. 35:11, and yet their vow was to dwell in tents.</p></blockquote>

</figure><figure class="quote" id="q-c5c9d752b4" data-kw="">
<blockquote><p>If a people, trusting in the goodness of their prince, enslave themselves to him, and he shall after[ward] turn [a] tyrant, a rash and temerarious surrender obliges not, Et ignorantia facit factum quasi involuntarium. Ignorance makes the fact some way involuntary; for if the people had believed that a meek king would have turned a roaring lion, they should not have resigned their liberty into his hand; and, therefore, the surrender was tacitly conditional to the king as meek, or whom they believed to be meek, and not to a tyrannous lord; and, therefore, when the contract is made for the utility of the one party, the law says, their place is for after wits, that men may change their mind and resume their liberty, though, if they had given away their liberty for money, they cannot recall it; and if violence made the surrender of liberty, here is slavery; and slaves taken in war, so soon as they can escape and return to their own, they are free. (D. Sect. item, ea justit. de rerum divin. I. nihil. F. de rapt. I. 3). So the learned Ferdin. Vasquez (illust. bk. 2, ch. 82, n. 15) says, “The bird that was taken, and has escaped, is free.” Nature in a forced people, so soon as they can escape from a violent conqueror, makes them a free people; and si solo tempore (says Ferd. Vasquez, bk. 2, ch. 82, n. 6) justificatur subjectio, solo tempore facilius justificabitur liberatio.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), question 16, pp. 66-67</span></figcaption>

<blockquote><p>Writing to Thomas Houston of the Reformed Presbyterian Church of Ireland in 1847, the Revd David Scott and another American Covenanter bemoaned the fact that so many churches compromised by not disciplining slaveholders or testifying against a proslavery constitution:

Rev. and Dear Sir,

[…] In regard to the state of things around us […] the disregard of the rights of man by the larger denominations in this country, none of which maintains a faithful testimony against the sin of slaveholding, or puts any restraint upon their members voting under a slaveholding Constitution, and most of which admit without question slave holders to the enjoyment of church privileges […] Others are not so discouraged but are assured that our cause will ultimately triumph.

[We are not] entirely devoid of encouragement in the condition of things around us. The evils of the Constitution, particularly as a pro-slaveholding instrument, are becoming more and more manifest […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-newell-and-david-scott.html">J. Newell and David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Thomas Houston, Allegheny, 2 June 1847 (Reformed Presbyterian Historical Library, Knockbracken, American correspondence, no. 14)</cite></span></figcaption>

</figure><figure class="quote" id="q-7a9d848621" data-kw="">
<blockquote><p>Assertion 1. As a man comes into the world a member of a politic society, he is, by consequence, born subject to the laws of that society… Assertion 2. Slavery of servants to lords or masters, such as were of old amongst the Jews, is not natural, but against nature:

1. Because slavery is malum naturae, a penal evil and contrary to nature, and a punishment of sin.

2. Slavery should not have been in the world if man had never sinned, no more than there could have been buying and selling of men, which is a miserable consequent of sin and a sort of death, when men are put to the toiling pains of the hireling, who longs for the shadow, and [are] under iron harrows and saws, and to hew wood, and draw water continually.

3. The original of servitude was when men were taken in war, to eschew a greater evil, even death, the captives were willing to undergo a less evil, slavery, (S. Servitus, 1 de jure. Pers.)

4. A man being created according to God’s image, he is res sacra, ‘a sacred thing,’ and can no more, by nature’s law, be sold and bought than a religious and sacred thing dedicated to God. Servitus, 1. Instit. de inutil. scrupl. I. inter Stipulantem. S. Sacram. F. de verber. Obligat.</p></blockquote>

3. The original of servitude was when men were taken in war, to eschew a greater evil, even death, the captives were willing to undergo a less evil, slavery, (S. Servitus, 1 de jure. Pers.)

<blockquote><p>XXVII. Self-interest, self-government and family-government are all antecedent to public government, which rules them for the common good, but has no authority to destroy them: No king or prelate can bind a man to do that which would damn his soul, nor to omit that which is needful to his salvation: All power is for edification: They are God’s ministers for God. XXVIII. As it belongs to self-government to choose our own diet, and clothes, and wives, and physicians, (though we may be restrained from doing public hurt on such pretences); And it belong to family government to educate our own children, and choose their tutors, callings, wives, etc. so it more nearly belongs to self-government to choose the most safe and profitable means of our own salvation, which no man may forbid us; and to avoid that which is pernicious or hurtful; and to family-government to do the like for our children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), ch. 4, p. 26</span></figcaption>

</figure><figure class="quote" id="q-7c69e010b9" data-kw="">
<blockquote><p>If it be asked then, With what kind of defects or discontents may a union be made up? or, what rules may be walked by therein? For answer, we offer these considerations or rules:

1. Whatever doesn’t warrant an initial separation doesn’t warrant a continued separation…

2. Whatever defects do not make union with a church and her ordinances sinful do not warrant separation…

3. Union with a church is lawful for those (i) whose callings lead them to a particular church and (ii) they can fulfill the duty of their callings without impediment, even if others fail to fulfill their duty…

4. Union must be maintained even if principles generally acknowledged in a church are not applied in practice…

5. Union must be maintained when the inconveniences following from separation are more harmful to the church than the inconveniences following union, provided that nothing makes union with a church and her ordinances sinful…

6. Union must be maintained when union with a church and her ordinances doesn’t require (i) personal sin or (ii) complicity in others’ sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, … (Edinburgh, 1659) | pt. 4, ch. 7, ‘General Grounds leading to Unity’, pp. 320-24</span></figcaption>

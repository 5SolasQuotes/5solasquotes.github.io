<main class="wrap"><figure class="quote" id="q-49d1b19504" data-kw="">
<blockquote><p>Rule Two. We must have a respect to the ordinance itself, that it be not made contemptible, that the discipline of Christ’s house be not rendered obnoxious to reproach and contempt; and as in the first reformation of religion, when men were coming out of popery and were ready to fear and spurn at discipline, and knew not the difference between the popish yoke and Christ’s yoke, in that case and in that time there was forbearance on this account. ‘I would they were cut off that trouble you’ (Gal. 5:12). Why then would he not cut them off? Because there was such a distemper among the Galatians, they were so bewitched and led away after the false teachers, and Paul’s authority was questioned; therefore he held himself at a wish and will not put forth the authority he had against those false and corrupt men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collected Sermons of James Durham</cite>, p. 923 of 7. ‘A Sermon on Ephesians 4:11-12’ in Collected Sermons of James Durham…, vol. 1 (Naphtali &amp; RHB, 2017)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-50faa103fb" data-kw="">
<blockquote><p>18. It was not necessary to the priesthood before Christ that there were an uninterrupted succession of right ordination: For the priests in Christ’s time were such as had no right to it, not of the right line (which had been long before interrupted), they bought the priesthood for money: and as many judge, were annual and two at a time (though not equal). Yet Christ requires submission to them as priests. I am sorry that we must be put to use the same arguments with these [episcopal] men as we have done against the old Separatists so long.</p></blockquote>

</figure><figure class="quote" id="q-655d825017" data-kw="">
<blockquote><p>‘Ye shall not do’ (says Moses) ‘after all things, which we do here this day, every man, all that is right in his own eyes.’ [Dt. 12:8]… And the speech of Moses seems to mean the true service of God, which was not yet perfected, neither could be in their travels, as it was after in Canaan, vv. 10-11. Not that they sacrificed after their fancy (says the Geneva notes) but that God would be served more purely in the land of Canaan. Junius upon this place notes: ‘Etsi oblationum lex una semper fuit ab initi• praescripta a Deo, non potuit tamen usque adeo in ambulatoriis Israelitarum castris observari, ant summo jure ab illis exigi, prout ostendit; Antithesis, verse 11; vide Num, 28:6.’ The [Romanist] Douay divines, on the place, give this observation, ‘In the desert they could not observe the ceremonies of the Law, but coming to rest, they were bound to keep all one set form of holy rites.’ The conclusion from this text is that God is pleased to dispense with his people in his own prescribed worship, until, if He has appointed, determined, or appropriated a certain form, time and place, they have opportunity to serve Him at that time, in that place, and after that form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam</cite>, … (London: R.B., 1642), ch. 1, section 4, p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

edbooksonline.com/on-church-ordinances/#:~:text=Ye%20shall%20not%20do%E2%80%99%20%28says%20Moses,that%20place%2C%20and%20after%20that%20form&amp;text=Ye%20shall%20not%20do%E2%80%99%20%28says%20Moses%29%20%E2%80%98after%20all&amp;text=time%2C%20in%20that%20place%2C%20and%20after%20that%20form" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-49107bfd5f" data-kw="">
<blockquote><p>Is it not fit that bounds for order and division should be set?… And is it not done in most places as well as you can desire? And where it is not… get them amended as soon as you can. In the mean time, affect not confusion: turn not all order upside down: God is not the God of confusion, but of order, which He would have established in all the Churches.</p></blockquote>

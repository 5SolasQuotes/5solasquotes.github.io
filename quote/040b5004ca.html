<main class="wrap"><figure class="quote" id="q-040b5004ca" data-kw="">
<blockquote><p>As the act of healing through the eyes of the Israelites and the brazen serpent went together; so, in the act of justifying, these two, faith and Christ, have a mutual relation, and must always concur- faith as the action which apprehendeth, Christ as the object which is apprehended; so that neither the passion of Christ saveth without faith, nor doth faith help unless it be in Christ, its object.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdray.html">Daniel Cawdray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Puritan Golden Treasury</cite>, p. 104</span></figcaption>

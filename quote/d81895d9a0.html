<main class="wrap"><figure class="quote" id="q-d81895d9a0" data-kw="">
<blockquote><p>This divine knowlege [of what God decrees] is the cause of things, since it is united to God’s free will, which, among all possible things, chooses one particular thing to exist rather than another. God’s knowledge of possible things, since it presupposes no decree of the divine will, is called simple intelligence. But his knowledge of actual things, since it does presuppose such a decree, is called ‘knowledge of approbation,’ approbation, not of evil, but of all that is real and good in the created universe. How then does God know evil? He knows it by its opposition to the good wherein alone evil can exist. Hence God knows evil by knowing what He permits, what He does not hinder. No evil, physical or moral, can come to be unless, for a higher good, God permits it to be. Knowing what He permits, God knows by that permission all evil that has been, is, or will ever be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought (St. Louis: Herder, 1950), ch. 9, God’s Knowledge, p. 99 Lagrange was a Neo-Thomist.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-940c6385f9" data-kw="Affliction Wisdom">
<blockquote><p>It is the discipline of wisdom. He who administers it is the &quot;God only wise.&quot; What deep wisdom then must there be in all His dealings! He knows exactly what we need and how to supply it. He knows what evils are to be found in us, and how these may be best removed. His training is no random work. It is carried on with exquisite skill. The time and the way and the instrument are all according to the perfect wisdom of God. The fittest time is chosen, just the very moment when discipline is called for, and when it would be most profitable. The surest, most direct, and at the same time gentlest method is devised. The instrument which will be surest yet safest, most effectual yet least painful, is brought into operation. For all is wisdom in the discipline of God.</p></blockquote>

<blockquote><p>potentia absoluta: absolute power; the omnipotence of God limited only be the law of noncontradiction. According to his potentia absoluta, God can effect all possibility, constrained only by his own nature. Things which are by nature evil and either impossible or noncompossible things (like square circles) fall outside of the realm of God’s power. The term emphasizes the transcendence and omnipotence of God by setting God even above and beyond the laws he has ordained for the operation of his universe…</p></blockquote>

</figure><figure class="quote" id="q-addf886a5b" data-kw="">
<blockquote><p>I will make your cause better than you have made it, but not by making other men’s worse, but by opening the reconciling truth. I. I shall tell you in what sense God’s will and decrees may and must be said to have an extrinsic cause, without change in God. (Predestinatio nihil ponit in praedestinato inquit [Predestination places nothing in the one who is predestined]; Aquinas, pt. 1, q. 23, art. 2) 1. Know therefore that God’s essence is his will, but not as essence. To say that God is God, and that God wills this or that, are not terms of the same signification. 2. God’s will is his essence denominated from some amiable good as the object; and so there is ever quid respectivum [in that respect] in the notion of will. 3. As God wills Himself, the act being perfectly immanent, his will is called Himself much more properly than his will of things extrinsic (which is ever either effectively, or at least objectively transient), because it is God that wills, and that is willed or loved (which made many ancients say that this was the Third Person in the Trinity). 4. But as God wills things ad extra [to things outside Himself], though it is his essence that so wills them, yet it is unfit to say simply that this will is God; e.g. that to will Peter’s salvation is God, because the name ‘will’ here includes the thing willed. 5. And therefore when we speak of God’s will in the universal notion, as abstracted from all particular objects and acts, it is less inconvenient to say simply that this will is God than when we speak of his will in act ad extra. By this time you may see that though God’s will, as his essence, has no cause, yet his will as denominated extrinsically from the object may have some kind of cause, that is objective, which is quasi materia actus [the matter of the act, as it were], and the terminus sine quo non [end-without-which-nothing] (Alvarez himself says that by a ’cause’ he means also any objective condition or reason of the act); that is, God’s will is not denominated a complacency in Christ existent or in Peter regenerate, or his understanding a seeing that the world was good before any of these things did exist. (This is all that Ruiz’s reasons prove, Of the Will of God, disp. 115, sect. 4, p. 102, who says that there is more than extrinsic denomination; et relatio rationis quam realis formalitas [and a relation of reason rather than a real formality]. But he does but show by his quodammodo [in some way], that he knows not what to say.) So that by extrinsic denomination, without any change in God, He may and should be said de novo [of new] to know things to be existent, to be past, to will things as existent with complacency or will them with displicency: But not to will the futurity of men’s damnation de novo; but yet his will of the futurity of men’s damnation has several degrees of the objective cause, from whence it is denominated: As in esse cognito [known being], the person who is the object is in order of nature first a man, a subject, and then a sinner, and a despiser of mercy, and then a damnable sinner. And so these are indeed conditions in the object, or causae sine quibus non [causes without which nothing], or objective material-constituent causes, not in themselves, but the foresight of them, not of God’s will as his essence, nor of his will as a will, but of his will as extrinsically denominated: a decree to damn Judas, e.g. because no otherwise is Judas an object capable of giving such an extrinsic denomination to God’s will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination</cite>, pp. 8-9</span></figcaption>

— Richard Baxter, Catholic Theology (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, pp. 8-9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+will+make+your+cause+better+than+you+have+made+it%2C+but+not+by+making+other+men%E2%80%99s+worse%2C+but+by+opening+the+reconciling+truth.+I.+I+shall+tell+you+in+what+sense+God%E2%80%99s+will+and+decrees+may+and+must+be+said+to+have+an+extrinsic+cause%2C+without+change+in+God.+%28Predestinatio+nihil+ponit+in+praedestinato+inquit+%5BPredestination+places+nothing+in+the+one+who+is+predestined%5D%3B+Aquinas%2C+pt.+1%2C+q.+23%2C+art.+2%29+1.+Know+therefore+that+God%E2%80%99s+essence+is+his+will%2C+but+not+as+essence.+To+say+that+God+is+God%2C+and+that+God+wills+this+or+that%2C+are+not+terms+of+the+same+signification.+2.+God%E2%80%99s+will+is+his+essence+denominated+from+some+amiable+good+as+the+object%3B+and+so+there+is+ever+quid+respectivum+%5Bin+that+respect%5D+in+the+notion+of+will.+3.+As+God+wills+Himself%2C+the+act+being+perfectly+immanent%2C+his+will+is+called+Himself+much+more+properly+than+his+will+of+things+extrinsic+%28which+is+ever+either+effectively%2C+or+at+least+objectively+transient%29%2C+because+it+is+God+that+wills%2C+and+that+is+willed+or+loved+%28which+made+many+ancients+say+that+this+was+the+Third+Person+in+the+Trinity%29.+4.+But+as+God+wills+things+ad+extra+%5Bto+things+outside+Himself%5D%2C+though+it+is+his+essence+that+so+wills+them%2C+yet+it+is+unfit+to+say+simply+that+this+will+is+God%3B+e.g.+that+to+will+Peter%E2%80%99s+salvation+is+God%2C+because+the+name+%E2%80%98will%E2%80%99+here+includes+the+thing+willed.+5.+And+therefore+when+we+speak+of+God%E2%80%99s+will+in+the+universal+notion%2C+as+abstracted+from+all+particular+objects+and+acts%2C+it+is+less+inconvenient+to+say+simply+that+this+will+is+God+than+when+we+speak+of+his+will+in+act+ad+extra.+By+this+time+you+may+see+that+though+God%E2%80%99s+will%2C+as+his+essence%2C+has+no+cause%2C+yet+his+will+as+denominated+extrinsically+from+the+object+may+have+some+kind+of+cause%2C+that+is+objective%2C+which+is+quasi+materia+actus+%5Bthe+matter+of+the+act%2C+as+it+were%5D%2C+and+the+terminus+sine+quo+non+%5Bend-without-which-nothing%5D+%28Alvarez+himself+says+that+by+a+%E2%80%99cause%E2%80%99+he+means+also+any+objective+condition+or+reason+of+the+act%29%3B+that+is%2C+God%E2%80%99s+will+is+not+denominated+a+complacency+in+Christ+existent+or+in+Peter+regenerate%2C+or+his+understanding+a+seeing+that+the+world+was+good+before+any+of+these+things+did+exist.+%28This+is+all+that+Ruiz%E2%80%99s+reasons+prove%2C+Of+the+Will+of+God%2C+disp.+115%2C+sect.+4%2C+p.+102%2C+who+says+that+there+is+more+than+extrinsic+denomination%3B+et+relatio+rationis+quam+realis+formalitas+%5Band+a+relation+of+reason+rather+than+a+real+formality%5D.+But+he+does+but+show+by+his+quodammodo+%5Bin+some+way%5D%2C+that+he+knows+not+what+to+say.%29+So+that+by+extrinsic+denomination%2C+without+any+change+in+God%2C+He+may+and+should+be+said+de+novo+%5Bof+new%5D+to+know+things+to+be+existent%2C+to+be+past%2C+to+will+things+as+existent+with+complacency+or+will+them+with+displicency%3A+But+not+to+will+the+futurity+of+men%E2%80%99s+damnation+de+novo%3B+but+yet+his+will+of+the+futurity+of+men%E2%80%99s+damnation+has+several+degrees+of+the+objective+cause%2C+from+whence+it+is+denominated%3A+As+in+esse+cognito+%5Bknown+being%5D%2C+the+person+who+is+the+object+is+in+order+of+nature+first+a+man%2C+a+subject%2C+and+then+a+sinner%2C+and+a+despiser+of+mercy%2C+and+then+a+damnable+sinner.+And+so+these+are+indeed+conditions+in+the+object%2C+or+causae+sine+quibus+non+%5Bcauses+without+which+nothing%5D%2C+or+objective+material-constituent+causes%2C+not+in+themselves%2C+but+the+foresight+of+them%2C+not+of+God%E2%80%99s+will+as+his+essence%2C+nor+of+his+will+as+a+will%2C+but+of+his+will+as+extrinsically+denominated%3A+a+decree+to+damn+Judas%2C+e.g.+because+no+otherwise+is+Judas+an+object+capable+of+giving+such+an+extrinsic+denomination+to+God%E2%80%99s+will.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Theology+%28London%3A+White%2C+1675%29%2C+pt.+2%2C+1st+Day%E2%80%99s+Conference%2C+about+Predestination%2C+pp.+8-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faddf886a5b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/addf886a5b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-knowledge-omniscience/#:~:text=I%20will%20make%20your%20cause%20better,an%20extrinsic%20denomination%20to%20God%E2%80%99s%20will&amp;text=I%20will%20make%20your%20cause%20better%20than%20you&amp;text=giving%20such%20an%20extrinsic%20denomination%20to%20God%E2%80%99s%20will" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-21b0057632" data-kw="">
<blockquote><p>Assertion 1 — There is an oath betwixt the king and his people, laying on by reciprocation of bands mutual civil obligation upon the king to the people and the people to the king; 2 Sam. 5:3, “So all the elders of Israel came to the king to Hebron, and king David made a covenant with them in Hebron before the Lord, and they anointed David king over Israel.” 1 Chron. 11:3, “And David made a covenant with them before the Lord, and they anointed David king over Israel, according to the word of the Lord by Samuel.” 2 Chron. 23:2-3, ” And they went about in Judah, and gathered the Levites out of all the cities of Judah, and the chief of the fathers of Israel, and they came to Jerusalem. And all the congregation made a covenant with the king [Joash] in the house of God.” 2 Kings 11:17, “Jehoiada made a covenant between the Lord and the king and the people, that they should be the Lord’s people; between the king also and the people.” Eccl. 8:2, “I counsel thee to keep the king’s commandment, and that in regard of the oath of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), pp. 54-55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

e</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c4cf9f05e8" data-kw="">
<blockquote><p>If a Sovereign Prince endeavor by arms to defend transgressors, to subvert those things which are taught in the word of God, they who are in authority under him, ought first to dissuade him; if they prevail not, and that he now bears himself not as a Prince, but as an enemy, and seeks to violate privileges and rights granted to inferior Magistrates or commonalities, it is the part of pious Magistrates, imploring first the assistance of God, rather to try all ways and means,then to betray the flock of Christ, to such an enemy of God: for they also are to this end ordained, that they may defend the people of God, and maintain those things which are good and just. For to have supreme power lessens not the evil committed by that power, but makes it the less tolerable, by how much the more generally hurtful. Then certainly the less tolerable, the more unpardonably to be punished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, on Mt. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-5aa04506f5" data-kw="">
<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>

</figure><figure class="quote" id="q-18f4a949e3" data-kw="">
<blockquote><p>For the words themselves, ‘Honor the King’, I have already spoken at large of the duty contained herein: Know we only, that by the King here, is meant Caesar, who was a heathen emperor, one that intruded himself, ruled tyrannously, and was an idolater… … Under this honor is understood, the inward reverence in heart to be declared outwardly by obedience to all their godly commandments, cheerfulness in payments, prayer and thanksgiving, etc. Now if all this be due to a wicked King, as here, and now to be performed of us, if we had a wicked king, what then is to be done of us to such a king as God has bestowed on us?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rogers.html">John Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly and Fruitful Exposition upon all the First Epistle of Peter</cite>, (d. 1636; 1650) | On 1 Tim., 2:17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

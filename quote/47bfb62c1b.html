<main class="wrap"><figure class="quote" id="q-47bfb62c1b" data-kw="">
<blockquote><p>The pastor need not be surprised if he finds troublers in his church. The discovery of such persons among the professed people of God sometimes shocks ministers, especially inexperienced ones, and discourages them, and sometimes leads them unwisely to give up their charges. But it should be understood as a lamentable fact that such persons are most likely to be found in every church, that the pastor will almost certainly encounter them, and that he ought to be prepared for the discovery, and not to be too much cast down by it. It is well for the pastor to be forewarned on this subject, and to be undismayed if he encounters many dispositions which are calculated to disturb the peace of the church. He will find that some are sadly inconsistent, bringing constant reproach upon the cause; some are complainers and fault-finders, acute at finding or inventing things to annoy; some take pleasure in criticising and opposing everything that is done or said by the pastor; some are so utterly unreasonable that they will listen to neither argument nor entreaty; some are restless, always finding something to agitate and distract; some are quarrelsome, as if they found their greatest satisfaction in strife; and others again there are whose business it seems to be to pull down, never to extend a helping hand even to the cause which they profess to love. The injustice and the cruelty of such persons toward him and that, too, when he is conscious of doing the very best in his power—will sometimes almost break the minister’s heart. We would recommend as the sovereign remedy for such troublers in the church simply to let them alone. Our advice would be, Do not notice them; do not speak of them; do not oppose them; if possible, do not think of them; and they are disarmed for evil. If they cannot excite any commotion, they soon become weary of their fruitless efforts to annoy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-murphy.html">Thomas Murphy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pastoral Theology</cite>, (Philadelphia: Presbyterian Board of Publication, 1877), 461–62</span></figcaption>

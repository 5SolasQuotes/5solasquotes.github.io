<main class="wrap"><figure class="quote" id="q-b22aa1c0a9" data-kw="">
<blockquote><p>I. There are three kinds or differences of life: there is a life of nature, which the apostle calls Natural. There is a life of Grace, which the sons of God alone do enjoy in this world: there is a life of Glory, which consists in the vision of God.

II. Life eternal is two ways taken: Metonymically, both for the way to life, and for Christ Himself: Properly, for the state of the blessed after this life.

III. There is one vision of God natural, in the things created; another specular, or symbolical, by resemblances and signs; another of faith, by the doctrine and doings of Christ; another of present sight, or of glory to come, when we shall see God face to face.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity</cite>, … (London, 1610), bk. 3, ch. 8, ‘Of Man’s Estate After this Life’ | The Part Confuting, of Life Eternal, pp. 594-5</span></figcaption>

</figure><figure class="quote" id="q-088949c4d2" data-kw="">
<blockquote><p>If it be man’s chief end to glorify God and enjoy Him for ever, then man has attained his end, the sole purpose for which he was made, the entire object for which he exists, when he enters into communion with God, abides in His presence, streaming out to Him in all the emotions, I do not say appropriate to a creature in the presence of his Maker and Lord, apprehended by him as the Good Lord and Righteous Ruler of the souls of men, but appropriate to the sinner who has been redeemed by the blood of God’s own Son and is inhabited by His Spirit and apprehends his Maker as also his Saviour, his Governor as also his Lover, and knows the supreme joy of him that was lost and is found, was dead and is alive again,—and all, through the glory of God’s seeking and saving love. He who attains to this experience has attained all that is to be attained. He is absorbed in the beatific vision. He that sees God shall be like Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith &amp; Life: ‘Conferences’ in the Oratory of Princeton Seminary</cite>, (1916), “Prayer as a Practice”, p. 439</span></figcaption>

</figure><figure class="quote" id="q-c09bf5a540" data-kw="">
<blockquote><p>Against claims that John Calvin repudiated the beatific vision and teleological virtue ethics, this article demonstrates the importance of the visio Dei by examining sections of Calvin’s exegesis and several important sermons. To explicate how such a teleology impacts the Christian’s relation to ‘lower goods’, it then explores Augustine’s theology of created being. Together these conversations contribute to an explanation of Calvin’s view of Christian moral life now through growth in virtue and in relation to the hope of seeing or contemplating God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alden-c-mccray.html">Alden C. McCray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Defending ‘Avertive’ Religion: Calvin on the Visio Dei &amp; Moral Theology’ in Reformed Theological Review</cite>, vol. 82, no. 1 (April 2023), pp. 25-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

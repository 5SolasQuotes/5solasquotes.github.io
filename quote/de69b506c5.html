<main class="wrap"><figure class="quote" id="q-de69b506c5" data-kw="">
<blockquote><p>Therefore, our doctrine is that in elenctic theology, or in the refutation of falsehood, e.g. Purgatory, indulgences, etc, discourse and consequences are to be employed. And if it is the case that a resolute adversary denies them, then the proving of consequences is also to be employed, not only from the Holy Bible, but also from the axioms and principles of the light of nature, known either naturally or technically, from Philosophy and Logic, so that the suitable connection of the middle term with the major term is apparent. The truth of doctrines, rather, or of middle terms, and the connection of the middle term with the minor, is to be demonstrated either from the express words, or equivalent ones, or the good consequence, of Scripture alone (except if the doctrines belong to natural theology, which are proven from Scripture primarily, and also from the light of nature secondarily).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Selectarum Disputationum Theologicarum Pars Prima</cite>, (Utrecht: Apud Joannem Waesberge, 1658), pp. 3-4 &amp; 7 as quoted in Johannes Hoornbeeck, ch. 1, ‘On Theology’ in Institutions of Theology Set in Order from the Best Authors (1658) tr. Charles Johnson</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-40e246eff8" data-kw="">
<blockquote><p>Upright common sense (or practical reason) tends to accurately recognize moral judgments before one can formally articulate and intellectually conclude the sometimes complex moral principles involved (Ps. 119:66; Rom. 2:14-15; Lk. 10:36-37; 14:5; Jn. 3:21; 1 Cor. 10:15; 14:37; 1 Jn. 1:1-4; 2:20; 3:9-10, 18-19). In this respect philosophy ought to confirm and validate common sense. It is believed the principles laid out in this article do exactly that (albeit imperfectly due to my own unskillful dullness), and reflect and synthesize the gradations of ethical living in common life better…</p></blockquote>

</figure><figure class="quote" id="q-dc3d5105c3" data-kw="">
<blockquote><p>Part of Heider’s project is to argue that Suárez was in fact a moderate realist, despite widespread characterizations of him, both by his immediate successors and by recent scholars, as essentially a nominalist. Such characterizations gain strength from Suárez’s own statement that he perhaps differed from the nominalists only modo loquendi (97). Heider, however, argues that it makes more sense to regard Suárez as a moderate realist, of broadly the same stripe as Poinsot, Mastri, and Belluto. It is not always entirely clear, though, wherein Heider disagrees with other commentators. Do they offer substantively different interpretations of Suárez, or are they using different taxonomies, with more or less strict usages of the term “nominalist?” In particular, it is worth noting that, if the crude, but widely used, division between realism and nominalism is employed, moderate realism is a species of nominalism, rather than the realism its name suggests. The great strength of this book is Heider’s masterful, detailed examination of three representative accounts from sixteenth- and seventeenth-century Scholasticism. Suárez offers an original blend of Thomist, Scotist, and nominalist elements; Poinsot’s account is more purely ad mentem Thomi, while Mastri and Belluto take an approach ad mentem Scoti. Of course, there were other streams of thought in the period, but Heider reasonably takes these to be the most important ones… Heider rightly presents Suárez as the first Scholastic of a venerable early modern tradition, rather than as the last schoolman. The present volume decisively dismantles the latter characterization.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-heider.html">Daniel Heider</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Universals in Second Scholasticism: A Comparative Study with Focus on the Theories of Francisco Suárez S.J</cite>, (1548–1617), João Poinsot O.P. (1589–1644) and Bartolomeo Mastri da Meldola O.F.M. Conv. (1602–1673)/Bonaventura Belluto O.F.M. Conv. (1600–1676) (Amsterdam: John Benjamins Publishing Company, 2014) 344 pp. | See this review by Sydney Penner. Penner:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

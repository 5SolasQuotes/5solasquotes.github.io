<main class="wrap"><figure class="quote" id="q-38a08a75b7" data-kw="">
<blockquote><p>God, at the creation, beheld man, a goodly frame of his own rearing, adorned with his own image, beautified with his graces, embellished with holiness and righteousness, and furnished with a power to stand; and afterwards beheld him ungratefully rebelling against his sovereign, invading his rights, and contemning his goodness, forfeiting his own privileges, courting his ruin, and sinking into misery.

So blinded is his mind, as not to be able to find out a way for his own recovery; so perverse is his will, that instead of craving pardon of his judge, he flies from him, and when his flight would not advantage him, he stands upon his own defence, and extenuates his crime; thus adding one provocation to another, as if he had an ambition to harden the heart of God against him, and render himself irrecoverably miserable.

God so overlooks these, as in immense love and grace to settle a way for man’s recovery, without giving any dissatisfaction to his justice, so strongly engaged for the punishment of the offence. And rather than this notorious rebel and prodigious apostate should perish according to his merit, he would transfer the punishment (which he could not remit without a violation of his truth, and an injury to his righteousness) upon a person equal to himself, most beloved by him, his delight from eternity, and infinitely dearer to him than anything in heaven or earth. Herein was the emphasis of divine love to us, that ‘he sent his Son to be the propitiation for our sin,’ 1 John iv. 10.

It was love that he would restore man after the fall; there was no more necessity of doing this, than of creating the world. As it added nothing to the happiness of God, so the want of it had detracted nothing from it. There was no more absolute necessity of setting up man again after his breaking, than of a new repair of the world after the destructive deluge. But that he might wind up his love to the highest pitch, he would not only restore man, but rather than let him lie in his deserved misery, would punish his own bowels to secure man from it. It was purely his grace which was the cause that his Son ‘tasted death for every man,’ Heb. ii. 9.</p></blockquote>

<blockquote><p>4. Benignity is God willing freely to communicate his grace and goodness unto his creatures proportionably to their several capacities, Ex. 33:19; Mt. 5:45; Ps. 33:5. Goodness according to some admits of a threefold consideration: Of nature, which is called perfection. Of manners, called holiness. Of beneficence, id est, a disposition to do good to others; this is properly called benignity: ‘Thou art good and doest good,’ Ps. 119:68. Goodness is either essential or by participation. God is essentially good: He is good of Himself, He is goodness itself: the creature is good by participation, i.e. by a goodness received of God. The sun, if compared with other creatures, you may say (in that respect) it has light of itself, but the moon and stars are light by participation: that is, they receive their light from the sun. God is a full fountain, or rather a fountain which is fulness itself; willing to communicate, as the sun sends forth its light, a fountain its streams and the prolifical virtue in plants, inclines them to fruitfulness; as the seminal virtue in living creatures disposes them to generation: the peculiar affection in parents towards their children renders them propense to do them good: and the soul full of matter (like wine which has no vent) propends to pour out itself; so is the Lord affected to do good according as He has willed concerning the creature. The goodness communicated from God unto the creature is either special, bestowed upon angels and men: Or common, bestowed upon the rest of the creation: ‘The earth is full of the goodness of the Lord,’ Ps. 33:5. The impression of his image is upon the reasonable, the impression of his footsteps is upon the unreasonable creature. God, who is the increated good, communicates Himself without division, effusion, or multiplication of Himself: all that He communicates, notwithstanding, He remains infinite and the same. God were God blessed forever though He had never willed of his goodness unto any, but if He were not a God of benignity, He were not our God. Goodness so descends and comes from God unto the creature as that it stops not there, but ascends and returns again unto God: either by way of manifesting of his glory as a mere subject and representative glass of his goodness in the unreasonable creature: or by way of giving glory to Him, not only as a mere subject whereon his goodness is legibly engraven, but also as a subject yielding obedience to the command in the reasonable and sanctified creature (Amor est [Greek]. Circulus perpetuus est in amore. [Love is [Greek]. A perpetual circle is in love]). Hence love is said to be both ecstatical, that is, carrying the lover as it were out of himself unto the loved; as it is with the soul removed out of the body in a trance: and circular, the beginning and end of which circle is God, that Alpha and Omega, from whom and to whom are all things. Unto that infinite and increated sea whence all created rivers of goodness come, thither they return again.</p></blockquote>

<blockquote><p>The effect or manner of God’s love is, that God makes the person happy whom he loves. For he doth amply reward that joy and delight which he takes in the holiness and obedience of the Elect, while he pours plentifully upon them all gifts, both of grace and of glory [1 John 4:16; John 3:35; Rom 5:8; Mal. 1:2]. This love of God to the elect is (1) Free, Hos. 5:15. He was moved with nothing but his own goodness [1 John 4:10, 19]. (2) Sure, firm, and unchangeable, Rom. 5:8, 10; 1 John 4:10; John 13:1 and 13:3. Infinite and Eternal, which shall never alter, John 3:16. (3) Effectual, as is declared both by his temporal and eternal blessings, 1 John 3:1. (4) Great and ardent, John 3:16 and 15:13; Rom. 5:6, 7. God bestows pledges of his love and favor upon them whom he has chosen, and sometimes he sheds the sense of his love abroad in their hearts [cf. Rom. 5:5; 8:1, 2]</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The effect or manner of God’s love is, that God makes the person happy whom he loves. For he doth amply reward that joy and delight which he takes in the holiness and obedience of the Elect, while he pours plentifully upon them all gifts, both of grace and of glory [1 John 4:16; John 3:35; Rom 5:8; Mal. 1:2]. This love of God to the elect is (1) Free, Hos. 5:15. He was moved with nothing but his own goodness [1 John 4:10, 19]. (2) Sure, firm, and unchangeable, Rom. 5:8, 10; 1 John 4:10; John 13:1 and 13:3. Infinite and Eternal, which shall never alter, John 3:16. (3) Effectual, as is declared both by his temporal and eternal blessings, 1 John 3:1. (4) Great and ardent, John 3:16 and 15:13; Rom. 5:6, 7. God bestows pledges of his love and favor upon them whom he has chosen, and sometimes he sheds the sense of his love abroad in their hearts [cf. Rom. 5:5; 8:1, 2]”

— Edward Leigh, A Treatise Of Divinity Consisting Of Three Books, (London, 1646), II.viii quoted in Richard A. Muller, Post-Reformation Reformed Dogmatics: The Rise and Development of Reformed Orthodoxy; Volume 3: The Divine Essence and Attributes (Grand Rapids, MI: Baker Academic, 2003), 568.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+effect+or+manner+of+God%E2%80%99s+love+is%2C+that+God+makes+the+person+happy+whom+he+loves.+For+he+doth+amply+reward+that+joy+and+delight+which+he+takes+in+the+holiness+and+obedience+of+the+Elect%2C+while+he+pours+plentifully+upon+them+all+gifts%2C+both+of+grace+and+of+glory+%5B1+John+4%3A16%3B+John+3%3A35%3B+Rom+5%3A8%3B+Mal.+1%3A2%5D.+This+love+of+God+to+the+elect+is+%281%29+Free%2C+Hos.+5%3A15.+He+was+moved+with+nothing+but+his+own+goodness+%5B1+John+4%3A10%2C+19%5D.+%282%29+Sure%2C+firm%2C+and+unchangeable%2C+Rom.+5%3A8%2C+10%3B+1+John+4%3A10%3B+John+13%3A1+and+13%3A3.+Infinite+and+Eternal%2C+which+shall+never+alter%2C+John+3%3A16.+%283%29+Effectual%2C+as+is+declared+both+by+his+temporal+and+eternal+blessings%2C+1+John+3%3A1.+%284%29+Great+and+ardent%2C+John+3%3A16+and+15%3A13%3B+Rom.+5%3A6%2C+7.+God+bestows+pledges+of+his+love+and+favor+upon+them+whom+he+has+chosen%2C+and+sometimes+he+sheds+the+sense+of+his+love+abroad+in+their+hearts+%5Bcf.+Rom.+5%3A5%3B+8%3A1%2C+2%5D%E2%80%9D%0A%0A%E2%80%94+Edward+Leigh%2C+A+Treatise+Of+Divinity+Consisting+Of+Three+Books%2C+%28London%2C+1646%29%2C+II.viii+quoted+in+Richard+A.+Muller%2C+Post-Reformation+Reformed+Dogmatics%3A+The+Rise+and+Development+of+Reformed+Orthodoxy%3B+Volume+3%3A+The+Divine+Essence+and+Attributes+%28Grand+Rapids%2C+MI%3A+Baker+Academic%2C+2003%29%2C+568.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa933512888.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a933512888.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/02/gods-love-does-not-change-him-or-in-him-but-it-does-change-us/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-e1a9805cad" data-kw="">
<blockquote><p>It was not possible for a mortal creature to give a higher document of love to God than by sacrificing for His sake a dearly beloved and only son. The whole history is so amazing that we know not whether we should most admire the strange commandment or the unparalleled obedience. Even so, it was not possible for the immortal God to give a nobler demonstration of love to men than by delivering for their sake His only begotten Son to die for their offenses: “Greater love hath no man than this, that a man lay down his life for his friends” (John 15:13). The whole transaction, from first to last, is of such uncommon nature and so foreign to every human plan for acceptance with God that to the wise Greeks it was mere foolishness and to the Jews a stumbling block. As Abraham could not without faith have acquiesced in the precept, no more can we without faith acquiesce in the gospel plan. He consulted not with Sarah when he was called to obey; and when we are called to believe, we must not consult with vain philosophy.

Though in the mystery of redemption there is a depth of wisdom, thy line, O reason, is too short to sound its bottom. Reason, especially in its depraved state, may not unfitly be compared to the patriarch’s ass, which stayed at the foot of the hill but ascended not with Isaac to the sacrifice. It is the province of faith alone to ascend this hill of the Lord and comprehend the love of God “which passeth knowledge” (Eph. 3:19). Isaac, it is true, was not sacrificed, and there was no need that God should raise him from the dead, as the patriarch perhaps expected.

But as he was in a manner a dead man during all the three days that intervened betwixt the sentence being passed against him and the reversing of it by the heavenly voice, it may be truly said that “in a figure” he was received “from the dead” (Heb. 11:19). Exactly so, our true Isaac was received on the third day from the dead, not in a figure only. Like Isaac, He felt no harm, but, “O death, He was thy plague; O grave, He was thy destruction.” Like Isaac, He returned to His Father’s house from whence He came and became a Father of many nations, who are begotten again to a lively hope by His resurrection from the dead; for thus the prophet Isaiah foretells, with admirable plainness and propriety, “When thou [O heavenly Father] shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the LORD shall prosper in his hand” (Isa. 53:10).

Forbear, ye children of men, anxiously to inquire, “Wherewith shall I come before the LORD, and bow myself before the high God?… shall I give my firstborn for my transgression, the fruit of my body for the sin of my soul?” (Mic. 6:6–7). For lo, He has given His firstborn to atone for your transgression, and the Son of His love to expiate the sin of your souls by the sacrifice of Himself. “He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?” (Mic. 6:8).</p></blockquote>

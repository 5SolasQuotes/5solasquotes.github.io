<main class="wrap"><figure class="quote" id="q-072478828f" data-kw="">
<blockquote><p>Could I perceive either of those this day in our case in the communion of this Church, I should not only think it my duty to separate, but also to press you to it; but, though our mother has gone far back, she is not gone that length.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3db040416a" data-kw="">
<blockquote><p>Only let our friends know, that, in setting up distinct congregations and judicatories, they not only withdraw from judicious and eminently godly ministers and private Christians, but do also consequentially go far towards a dooming them to Hell, as owning themselves to be in the communion of a Church that is no true Church, and with which (according to their principles) the Lord Jesus entertains no more any communion; for certainly their setting up separated judicatories and Churches will imply so much, or else they must say that they will have no fellowship with Churches with whom the Lord Jesus does entertain communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-9f1e6a1d66" data-kw="">
<blockquote><p>The first particular is (as they [the Resolutioners] call it) “The declining the authority of the supreme Church-judicatories of this nation once and again”; They mean the protestations [by the Protesters] against the two late pretended Assemblies at St. Andrews, and Dundee, and Edinburgh… …they [the Protesters] have learned to distinguish betwixt the government of the Church, and the male-administrations and corruptions of the Church-governors; and not to condemn the one [the former] when they are necessarily called to give a testimony against the other [the latter]; Yea, the duty and care they owe to the preservation of the government [of the Church] constrains them to testify against the abusing and corrupting of it: So did our fathers of old, whose protestations against corrupt National Church assemblies are upon record to this day, and so far have they been by men of sound judgments, from being judged because thereof to be against the government, that they are honored amongst the greatest patrons and preservers thereof… …neither do they [the Protesters] think that testifying against the corruptions of many of these that are now in the exercise of the government of the Church, is to dissent from, or to do injury to the government it self;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them… (1658)</cite>, pp. 17-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

%2F9f1e6a1d66.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9f1e6a1d66.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/scottish-theology/free-church-of-scotland/quotes-on-the-right-of-continued-protest/#:~:text=The%20first%20particular%20is%20%28as%20they,injury%20to%20the%20government%20it%20self&amp;text=The%20first%20particular%20is%20%28as%20they%20%5Bthe%20Resolutioners&amp;text=to%20do%20injury%20to%20the%20government%20it%20self" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-00b551954c" data-kw="">
<blockquote><p>Therefore our brethren in Ireland have Scripture and reason on their side to support them in their conduct and practice, when they have declared a secession from such as have laid aside confessions of faith, and in their associating together in distinct presbyteries from them.</p></blockquote>

</figure><figure class="quote" id="q-76a8f6ea15" data-kw="">
<blockquote><p>The second distinction is, between congregations ‘which have a competent and well-qualified eldership, and small congregations, who have but few office-bearers, and those, it may be, not sufficiently able for church government. In this case of insufficiency, a congregation may not independently, by itself, exercise jurisdiction, and not in re propis,” says Parker.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Assertion of the Government of the Church of Scotland (Edinburgh, 1846), Part 2, Concerning the Assemblies of the Church of Scotland, and the Authority Thereof | Ch. 2, ‘Of the Independency of the Elderships of Particular Congregations’</cite>, p. 43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

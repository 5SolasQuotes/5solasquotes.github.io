<blockquote><p>[You must distinguish:]

20. Betwixt pardon and justification conditional, which is an immediate effect of Christ’s death and resurrection, or rather of the making of the new Covenant. 2. And pardon and justification absolute, when we have performed all the conditions.

21. Betwixt conditional pardon and justification, which is only potential (such is that which immediately follows the enacting of the new Covenant to men before faith, or before they have sinned). 2. And conditional justification, which is actual, and of which the person has true possession, such is our justification after faith, till the Last Judgment, which is ours actually, but yet upon condition of perseverance in faith and sincere obedience. … 25. Betwixt the accusation of the Law (from [which] Christ does justify believers). 2. And the accusation of the Gospel or new Covenant, for not performing its conditions at all (from which no man can be justified, and for which there is no sacrifice). … 27. Betwixt our first possession of justification, which is upon our contract with Christ or mere faith. 2. And the confirmation, continuation and accomplishment of it (whose condition is also sincere obedience and perseverance).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification</cite>, … (Hague, 1655), Guide to the Reader</span></figcaption>

<blockquote><p>4. The Holy Ghost speaks generally of all men, whether regenerate or unregenerate, and of all works, whether going before faith or following it, that a man, that is, every one, who is justified, is justified by faith without the works of the law, Rom. 3:28, that a man is not justified (that is, that no man is justified) by the works of the Law, but by the faith of Jesus Christ, for by the works of the Law no flesh, that is, as the Psalmist speaks, no man living shall be justified, Gal. 2:16. For as in the first act of justification we are justified by faith without respect of works, so our justification is continued unto us without respect of our works. And this appears most plainly in the examples of Abraham, of Job, of David, of Paul, etc. as I showed before, who, though they abounded with good works which they wrought by faith, yet were not justified by them, but by faith only. For that which Chrysostom says of Abraham is also verified of all the godly: for, says he, that a man having not works should be justified by faith, it is no unlikely thing: [Greek], but this, that a man flourishing in good works, should not thereby be justified, but by faith, it was wonderful, and very much sets forth the force of faith.</p></blockquote>

</figure><figure class="quote" id="q-ebd9cd8cc4" data-kw="">
<blockquote><p>A double accusation may be brought against man before the tribunal of God: that he is a sinner, and so guilty of the breach of the first covenant [of Works]; or that he is no sound believer, having not fulfilled the condition [i.e. faith] of the second [covenant, i.e. of grace]. As to the first accusation, we are justified by faith; as to the second, by works; and so James and Paul are reconciled (Rom. 3:24; Jm. 2:24): “A man is justified by faith without the deeds of the law,” and “a man is justified by works and not by faith only.</p></blockquote>

</figure><figure class="quote" id="q-8abb1b53b8" data-kw="">
<blockquote><p>We had said, following the apostle and all Scripture, that there is a twofold righteousness of the saints by which they are just before God and men. One is Christ’s, perfect, on which all their hope of God’s grace and salvation and eternal life entirely rests. The other is begun in them by the Spirit of Christ, in which they ought not to trust, because it is always imperfect while they live here and cannot be approved by God except out of his liberal and infinite mercy and the merit of Christ. By this righteousness no one is justified before God with the justification of life.</p></blockquote>

</figure><figure class="quote" id="q-b8026e58bd" data-kw="">
<blockquote><p>The sum of my doctrine which I bring them [Scriptures] to confirm, I contract into these heads.

1. That faith justifies not as an instrumental efficient cause, but as conditio applicans et disponens, the applying and disposing condition: its applicatory nature being the aptitude to the office, and its being the condition of the promise being the formal or nearest reason of its interest.

2. That repentance is conditio disponens, a dispositive condition of our first justification.

3. That Covenant-keeping by sincere love, thankfulness and obedience to God▪ Redeemer is a condition of the continuing, or not-losing our state of justification.

4. That the renewal of our faith and repentance, upon our lapses into discerned wounding sins, is a condition of the particular pardon of those sins, and our discharge or justification from the guilt of them.

5. That all the foresaid conditions, faith, repentance, love, thankfulness, sincere obedience, together with final perseverance, do make up the condition of our final absolution in judgment, and our eternal glorification.

6. That in the Day of Judgement, seeing we must be Judged by the Gospel or New Covenant, and it will be no small part of the work of the day to enquire whether we have performed the conditions of that Covenant which gives us Christ, and life and pardon, or not; we must therefore against the accusation of non-performance (real or supposed) be justified by our own performance as our particular righteousness: and this is the judging or jusiifying us according to our works, which Scripture mentions. And upon this will our universal and final justification depend, as upon its condition. And therefore whoever will be justified at that day, must have a Justitia prolegalis or a righteousness of remission of sin through the blood of Christ, to plead against the Law, and also a personal evangelical righteousness, consisting in a performance of the conditions of the Gospel or new Covenant, which is the condition of our interest in the first; or else he cannot be justified (yet is this latter but subordinate to the former, as to that sentential absolution).

7. Seeing this twofold righteousness is necessary to our justification in judgment, therefore it must needs follow that it is necessary to the making us righteous, or our constitutive justification in this life (in the order before laid down): For the Law is the rule of judgment; and God judges men to be as they are; and therefore He makes them righteous, both by remission of all sin and by giving them to perform the conditions of the New Covenant, before He judge them so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Confession of his Faith</cite>, … (London: 1655), ch. 3, pp. 56-57</span></figcaption>

6. That in the Day of Judgement, seeing we must be Judged by the Gospel or New Covenant, and it will be no small part of the work of the day to enquire whether we have performed the conditions of that Covenant which gives us Christ, and life and pardon, or not; we must therefore against the accusation of non-performance (real or supposed) be justified by our own performance as our particular righteousness: and this is the judging or jusiifying us according to our works, which Scripture mentions. And upon this will our universal and final justification depend, as upon its condition. And therefore whoever will be justified at that day, must have a Justitia prolegalis or a righteousness of remission of sin through the blood of Christ, to plead against the Law, and also a personal evangelical righteousness, consisting in a performance of the conditions of the Gospel or new Covenant, which is the condition of our interest in the first; or else he cannot be justified (yet is this latter but subordinate to the former, as to that sentential absolution).

7. Seeing this twofold righteousness is necessary to our justification in judgment, therefore it must needs follow that it is necessary to the making us righteous, or our constitutive justification in this life (in the order before laid down): For the Law is the rule of judgment; and God judges men to be as they are; and therefore He makes them righteous, both by remission of all sin and by giving them to perform the conditions of the New Covenant, before He judge them so.”

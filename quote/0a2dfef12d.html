<main class="wrap"><figure class="quote" id="q-0a2dfef12d" data-kw="">
<blockquote><p>It has been assumed that Theology has to do with the facts or truths of the Bible; in other words, that the Scriptures of the Old and New Testaments are the only infallible rule of faith and practice. This, however, is not a conceded point. Some claim for Reason a paramount, or, at least a coördinate authority in matters of religion. Others assume an internal supernatural light to which they attribute paramount, or coördinate authority. Others rely on the authority of an infallible church. With Protestants, the Bible is the only infallible source of knowledge of divine things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. II</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/nature-of-theology.html">Nature of Theology</a> › <a href="../topics/theology/nature-of-theology/method-of-theology.html">Method of theology</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8317e796d9" data-kw="">
<blockquote><p>Protestants have always been accustomed to meet these views, whether put forth by Roman Catholics or Anglo-Catholics, by establishing the sufficiency and perfection of the sacred Scriptures as the only rule of faith, and by proving that we have not in point of fact, any certain means of knowing accurately what was declared and prescribed by the apostles, except from the writings of the New Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Romanist Theory of Development</cite>, p. 6</span></figcaption>

</figure><figure class="quote" id="q-22b111434a" data-kw="">
<blockquote><p>The Holy Scripture is the only sufficient, certain and infallible rule of all saving knowledge, faith and obedience … The whole counsel of God concerning all things necessary for his own glory, man’s salvation, faith and life, is either expressly set down or necessarily contained in the Holy Scripture: unto which nothing at any time is to be added, whether by new revelation of the Spirit, or traditions of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 1.1, 1.6</span></figcaption>

</figure><figure class="quote" id="q-738aac8891" data-kw="">
<blockquote><p>As we believe and confess the Scriptures of God sufficient to instruct and make the man of God perfect; 2 Tim. iii. 16, 17. so do we affirm and avow the authority of the same to be of God, and neither to depend on men nor angels. We affirm, therefore, that such as allege the Scripture to have no other authority but that which it hath received from the Church, are blasphemous against God, and injurious to the true church; which always heareth and obeyeth the voice of her own Spouse and Pastor</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-reformers.html">Scottish Reformers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scots Confession</cite>, 1560, Art. 19</span></figcaption>

</figure><figure class="quote" id="q-d04c21ab00" data-kw="Grace">
<blockquote><p>It is supernatural, being altogether beyond the powers of the creature to effectuate. It is wholly of the wisdom, grace, and power of God. All the unions we have in the natural world come infinitely short of this. The union of the body and soul in man puzzles and baffles the greatest philosophers, but the union of Christ and His Church is a far greater mystery: that persons so distant, so divided, should be made one, is a profundity which no finite intelligence can fully comprehend. We had known nothing whatever about it if God had not revealed it to us in His Word, and even now we discern it “through a glass darkly.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Union and Communion</cite>, Introduction (nature of the union, 1)</span></figcaption>

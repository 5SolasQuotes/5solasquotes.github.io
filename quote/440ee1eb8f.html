<main class="wrap"><figure class="quote" id="q-440ee1eb8f" data-kw="">
<blockquote><p>It is written. I where? Ans. Nowhere in express words, but it is gathered out of the 16 Chap. and 21 Chap. of Genesis: as if he had said, by conference of Scripture, it may be gathered. Whence ariseth this observation: That the sense and collection of the Scripture, is rightly called Scripture; although the sense is not in express &amp; entire terms, anywhere: and this is oft used in the Epistle to the Hebrews: This is to be noted against Arius Sabellius and such Heretics, who when they did impugn the Divinity of CHRIST, and the distinction of Persons in the unity of Essence in the blessed Trinity, they did condemn the names and words of Essence, Consubstantial, Subsistence, Unity, Trinity, which were used of the ancient Fathers; to open these mysteries, they I say, accused them of Novelty and falsehood; because not found expressly in the Scripture. But by this place of Paul we learn that there is no need that every word and syllable be found in the Scripture, so that if the reason thereof be manifest out of the true sense of the Scripture, it is all one; as if it had been written:

Secondly, hence we learn, what we are to judge of the Sermons of Ministers. It must needs be, that in Preaching, while they open the Doctrine and exhort, that they utter many words and sentences, which in every syllable are not found in Scripture; yet while they speak out of the true sense of Scripture, all their words are the words of God: Neither is there hereby any way made for the Papists, to establish their smoky and reasty traditions, who when they hear those terms of Consubstantial, Coessential, &amp;c. Think that they may by the like right, obtrude upon us their foolish Superstitions as authorized by Scripture; for herein as in all other things, they err fondly; for though is be lawful to devise new words, the ground and meaning whereof is manifest out of the Scripture, yet to coin names repugnant to Piety, or such as through their ambiguity may bring the same in danger, is wicked and not to be attempted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brightman.html">Thomas Brightman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Brightman redivivus: or The post-humian of-spring of Mr. Thomas Brightman, in IIII. sermons. Viz. 1. Of the two covenants. 2. The danger of scandals. 3. God’s commission to Christ to preach the Gospel. 4. The saint’s security</cite>, (London: John Rothwell, 1647), pp 3-4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

<blockquote><p>That the obligations to faith and obedience are personal. Every man is responsible for his religious faith and his moral conduct. He cannot transfer that responsibility to others; nor can others assume it in his stead. He must answer for himself; and if he must answer for himself, he must judge for himself. It will not avail him in the day of judgment to say that his parents or his Church taught him wrong. He should have listened to God, and obeyed Him rather than men.</p></blockquote>

</figure><figure class="quote" id="q-f4b69291f9" data-kw="">
<blockquote><p>To ascertain the true sense of the Scriptures, interpretation is needed. … It is not to be sought by each man&#x27;s private judgment (which is the idia epilysis condemned by Peter), but is to be gathered from the Scriptures themselves as their own best and surest interpreter (Neh. 8:8; Acts 17:11). But for this, after fervent prayer to God, there is need of an inspection of the sources, the knowledge of languages, … collation of passages, … and conformity of the interpretation to the analogy of faith.</p></blockquote>

</figure><figure class="quote" id="q-ec738a4a8b" data-kw="authority">
<blockquote><p>The authority of Scripture (concerning which we here inquire) is nothing else than the right and dignity of the sacred books, on account of which they are most worthy of faith with regard to those things which they propose to be believed and of our obedience in those things which they command us to omit or to do. The divine and infallible truth of these books (which have God for their author) is the foundation because he has the highest right to bind men to faith and duty. But this truth may be either intrinsic or extrinsic. The former is the credibility (axiopistia) in itself of the word which is always equal and consistent with itself, whether it has the testimony of men or not. The latter is the estimation or judgment of men in relation to the Scriptures, which is different as the subjects are different. Of history and of rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.4.3</span></figcaption>

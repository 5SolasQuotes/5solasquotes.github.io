</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d757378e08" data-kw="">
<blockquote><p>The Shorter Catechism agreed upon by the Assembly of divines at Westminster, and presented to the honorable Houses of Parliament then sitting, and by them ordered to be printed and published, but no man enjoined to use it, or punishable if he made use of any other to instruct his people in. This little book for the comprehensiveness of it, as also exactness of order and expression, has (as it deserves) a great esteem with many learned men, notwithstanding to be the one and only book for all capacities that are to be instructed in principles throughout the nation, is a perfection not to be expected from any common gift, nor is this for such purpose the fittest in its kind, as we shall endeavor to show in this dispute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beams of Former Light: discovering how Evil it is to Impose doubtful and disputable forms or practices, upon ministers: especially under the penalty of ejection for non-conformity unto the same. As also something about catechizing</cite>, Beams of Former Light: discovering how Evil it is to Impose doubtful and disputable forms or practices, upon ministers: especially under the penalty of ejection for non-conformity unto the same. As also something about catechizing. (London: 1660) This was published just before the Great Ejection of 1662., pp. 10-11</span></figcaption>

<blockquote><p>For, indeed, in the most considerable councils of the bishops, as I hear, it has been decreed that they who come from heresy should first be trained in catholic doctrine, and then should be cleansed by baptism from the filth of the old and impure leaven.</p></blockquote>

</figure><figure class="quote" id="q-4f2f1b7f0b" data-kw="">
<blockquote><p>245. Therefore, the confessions of particular Churches and the decrees and canons of particular synods, and the catecheses of particular Churches and the liturgies or ecclesiastical agendas and similar formulas, their doctrines or declarations are not the immutable and universal norm of faith and truth, according to which it ought to be judged or pronounced what is to be believed and conceded, what is to be repudiated and condemned, what is true or false, orthodox or heretical. For it is not always necessary that what agrees with the confession of some particular Church, synodical decrees, catechesis, liturgy or ecclesiastical agenda, formula of doctrine or some other declaration, is true; nor is it always false what disagrees with it. Therefore, it should not be demanded that all Churches subscribe to the declaration and formula of one particular Church: but indeed those formulas do not even bind one Church or any private person to approve them and to contain themselves within them, except with this condition, insofar as they agree with divine Scripture and universal Symbols.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System of Christian Theology</cite>, tr. ChatGPT-4, with Latin (Hanau, 1609-1610) at Monergism, bk. 1, Theology &amp; Scripture, p. 1,889</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

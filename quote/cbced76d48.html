<main class="wrap"><figure class="quote" id="q-cbced76d48" data-kw="">
<blockquote><p>11. He [a schismatic] condemns as idolaters all the Churches on earth for six hundred, if not one thousand years after the apostles; not one Church, Christian or heretic (as far as any history tells us that I have found), did ever deny such things as he calls false worship or idolatry. They all went further than our [Anglican] parish churches do. At baptism they used the white garment, tasting milk and honey, chrism or anointing the forehead, crossing; they adored only standing, and not kneeling, every Lord’s Day, all as significant ceremonies: No one Church or person is said to scruple these; I think they did not [do] well: but God rejected not their worship.

12. He makes all or near all the Churches on earth idolaters at this day: All on earth save the Protestants are far grosser in their liturgies and ceremonies than the English: Of the Protesants, Sweden, Denmark, Saxony and all the Lutherans have liturgies, crossing, ceremonies, church-images, consubstantiation. The Helvetians [Swiss] are such as are called Erastians, making the magistrate the only ruler, and [making] sacraments common [to all, having no excommunication]. Geneva and France, yea and Holland, have their liturgies and some rites.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), pt. 2, p. 15</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e53542150b" data-kw="">
<blockquote><p>The Reformed acknowledge that the error of the Lutherans [consubstantiation], although it is quite crass, yet is not fundamental (like that of the papists is in their Mass), nor is it such that it ought to impede ecclesiastical communion among themselves and them, because it is acknowledged on both sides that all those communicating according to Christ’s precept receive spiritual communion with the whole Christ.</p></blockquote>

</figure><figure class="quote" id="q-6ed8f21cd7" data-kw="">
<blockquote><p>Come to churches and say, ‘You have these defects among you, and these things to be reformed;’ but if you will come and say, ‘Your churches and your ministers are Antichristian and come from Babylon,’ there is nothing [that] provokes more…. …and I have learned this principle, which I hope I shall never lay down till I am swallowed up of immortality; and that is that which I said before: To acknowledge every good thing, and hold communion with it, in men, in churches, or whatsoever else. I learn this from Paul; I learn this from Jesus Christ Himself: He fills all in all; He is in the hearts of his people, and fills them in his ordinances to this day; and where Jesus Christ fills, why should we deny an acknowledgment and a right hand of fellowship and communion.</p></blockquote>

</figure><figure class="quote" id="q-9e932db576" data-kw="">
<blockquote><p>It shall be no grief of heart to you afterward that you have pleased others as well as yourselves, and have stretched your principles for an accommodation in Church government as well as in worship, and that for the Church’s peace and edification; and that the ears of our common enemies may tingle (Acts 9:31) when it shall be said, ‘The Churches of Christ… have rest, and are edified, and walking in the fear of the Lord, and in the joy of the Holy Ghost are multiplied.’</p></blockquote>

</figure><figure class="quote" id="q-95da656997" data-kw="">
<blockquote><p>Bodily worship without soul-worship is nothing; but soul-worship may be accepted without bodily worship; therefore it is the soul that God does principally look at in holy duties: If you be not able to worship God in your bodies, you may worship Him in your souls, and God regards that bodily exercise in holy duties is little worth… but it is nothing in comparison: the great work is the work of the soul, for God is a Spirit and must be worshipped in spirit. And God is said to be a Spirit… it notes the simplicity of God… but in the simplicity of your hearts you must come to worship God, and thus you shall worship Him with such worship as is some way suitable to him as he is a Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship</cite>, ... (London: 1647) | Sermon 6, pp. 93-94</span></figcaption>

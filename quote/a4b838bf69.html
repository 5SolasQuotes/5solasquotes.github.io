<main class="wrap"><figure class="quote" id="q-a4b838bf69" data-kw="">
<blockquote><p>At that time the superstitious observance of Lent had prevailed everywhere, because the common people thought that in it they were doing some exceptional service to God, and the pastors commended it as a holy imitation of Christ. On the contrary, it is plain that Christ did not fast to set an example for others, but to prove, in so beginning to proclaim the gospel, that it was no human doctrine but actually one sent from heaven [Matt. 4:2]. And the marvel is that such sheer hallucination (which is refuted so often and with such clear arguments) could creep upon men of keen judgment. For Christ does not fast often—as he would have to do if he had willed to lay down a law of yearly fasting—but only once, when he girded himself for the proclamation of the gospel. Nor does he fast in human fashion, as would have been fitting if he willed to arouse men to imitate him; but he shows an example rather to transport all men to admiration of him than to arouse them with zeal to imitate him. Finally, his reason for fasting was not different from that which Moses performed when he received the law at the Lord’s hand [Ex. 24:18; 34:28]. For since that miracle was manifested in Moses to establish the authority of the law, it ought not to have been omitted in Christ, lest the gospel seem to yield to the law. But since that time it never entered any man’s mind, on the excuse of following Moses, to establish such a form of fasting among the people of Israel. And none of the holy prophets and patriarchs followed it, even when they had enthusiasm and zeal enough for all pious exercises. For the statement that Elijah went forty days without food and drink [1 Kings 19:8] only served to apprise the people that he had been raised up to restore the law, from which almost all Israel had departed. It was, therefore, mere wrongheaded zeal, full of superstition, that they justified and painted fasting as the following of Christ. However, there was amazing diversity in the manner of fasting, as Cassiodorus relates from the ninth book of Socrates’ history. For the Romans (he says) had only three weeks, but for them the fast was continuous, except on Sunday and Saturday. The Illyrians and Greeks had six; others, seven; but fasting was at intervals. They differed as much in choice of foods: some ate only bread and water; others added vegetables; still others did not abstain from fish and fowl; others made no distinction in foods. Augustine also mentions this difference in his second letter to Januarius</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, ed. John T. McNeill, trans. Ford Lewis Battles. The Library of Christian Classics (Louisville: Westminster John Knox Press, 2011), 4.12.20.</span></figcaption>

<blockquote><p>5. By their fruits shall we know them; look whether they give so much liberty to others and take so much to themselves upon their holy days for staying from the public worship and attending wordly business, as they do at the diets of weekly and ordinary preaching: yet they would make the simple believe that their holy days are only appointed to be kept as those ordinary times set apart for divine service on the week-days. Nay, moreover, let it be observed, whether or not they keep the festival days more carefully, and urge the keeping of them more earnestly than the Lord’s own day. Those prelates that will not abase themselves to preach upon ordinary Sabbaths, think the high holy days worthy of their sermons. They have been also often seen to travel upon the Lord’s Day, whereas they hold it religion to travel upon a holy day. And whereas they can digest the common profanation of the Lord’s Day and not challenge it, they cannot away with the not observing of their festivities.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 1, pp. 12-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

</figure><figure class="quote" id="q-98e8182564" data-kw="">
<blockquote><p>Bishop Andrewes will have the feast of Easter drawn from that place 1 Cor. 5:8, where he says there is not only a warrant, but an order for the keeping of it, and he will have it out of doubt that this feast is of apostolical institution, because after the times of the apostles, when there was a contention about the manner of keeping Easter, it was agreed upon by all that it should be kept, and when the one side alleged for them St. John [for keeping it on Passover], and the other St. Peter [for keeping it on the Lord’s Day], it was acknowledged by both that the feast was apostolical. I answer, the testimony of Socrates [a church historian in the early Church] deserves more credit than the Bishop’s naked conclusion. ‘I am of opinion,’ says Socrates (bk. 5, ch. 22), ‘that as many other things crept in of custom in sundry places, so the feast of Easter to have prevailed among all people, of a certain private custom and observation.’ But whereas B. Lindsay in defense of B. Andrewes, replies that Socrates propounds this for his own opinion only, I answer that Socrates in that chapter proves his opinion from the very same ground, which B. Andrewes wrests, to prove that this Feast is Apostolical. For while as in that hot controversy about the keeping of Easter, they of the East alleged John the apostle for their author, and they of the west alleged Peter and Paul for themselves; Yet (says Socrates), there is none that can show in writing any testimony of theirs, for confirmation and proof of their custom. And hereby I do gather that the celebration of the Feast of Easter came up more of custom than by any law or canon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 6, p. 98</span></figcaption>

<blockquote><p>5. It is one question whether a day may be set apart for commemoration of some mystery of our religion, by men, and as a part of God’s worship. And another whether such days may be set apart for worshipping God merely as a piece of good order and policy. The first the Papists are for: the other most of our prelatists own, though some of them differ little from the Papists in this matter. 6. The question is not whether a day may be set apart occasionally for religious worship: that is, when any special providence gives occasion for fasting and humiliation or for thanksgiving and rejoicing: seeing in that case there is a special providential call to that solemn work: but whether a day may be set apart to be observed constantly and as it recurs every year. The one makes a difference between that day of the year and other days and exempts it altogether and constantly from civil use, the other does not so; the one makes a difference among days, the other makes the difference only in the works or dispensations of God which occasion such work on that day and not on another. All that the Church does in the one case, is, whereas the present providence calls to the work, as it is expressed, Isa. 22:12. The Church only determines the circumstance of time, which must be done: in the other, the Church determines more than a necessary circumstance, viz. that there shall be such a solemnity, which the Lord has not enjoined; neither do we doubt, but that the Church may appoint recurrent days for solemn worship, to wit, while the present providence that calls to such work continues. Weekly or monthly fasts may be appointed under a lasting calamity or threatening.</p></blockquote>

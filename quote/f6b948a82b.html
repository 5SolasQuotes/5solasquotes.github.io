<main class="wrap"><figure class="quote" id="q-f6b948a82b" data-kw="">
<blockquote><p>Not only is it in the freedom of God to bestow the grace of regeneration upon elect infants prior to the rite of baptism, but it is to be believed that this is the course he usually pursues. This I deduce in the following manner from what has already been said: Since God may from their very birth receive elect infants into the fellowship of his covenant, unite them to Christ, reconcile them to himself, remitting to them the guilt of original sin, there seems no reason why he should not regenerate them at the same time, unless they are incapable of regeneration, which, as we have just proved, is not the case.

Besides, I cannot suppose it possible to prove by any example or testimony that the guilt of any sin may be taken away through forgiveness unless at the same time the dominion of that sin is broken, so that while it loses the power to condemn, it loses also the power to reign. So far as the power of sin is weakened, sin is mortified. So far as sin is mortified, the soul is quickened—this very quickening of the soul’s regeneration.

In addition, the soul cannot be united to Christ except through the Spirit of Christ. The Spirit of Christ is the Spirit of life (Rom. 8:2). Christ himself is our life (Col. 3:4). How then can it be that a soul chosen of God, beloved of Christ, absolved from the guilt of original sin, and united to the source of life by the Spirit of life should not be immediately quickened into spiritual life by Christ and his Spirit in virtue of that union?

From all these things it undeniably follows that those infants who, before receiving baptism, are regarded as partakers of the benefits of the covenant of grace, united to Christ, reconciled to God, absolved from the guilt of original sin, ought also to be regarded as born again and quickened by Christ’s Spirit. Nor does any argument occur to me to the contrary—so far, at least, as concerns those who depart from this life before attaining to the use of reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant</cite>, (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), pp 147-48.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cc865ae218" data-kw="">
<blockquote><p>Those attributes which God accounts his greatest riches and greatest glory, Rom. 9:23, even his mercy and free grace, which he intends most to exalt, never saw light till now; the doctrine of salvation by Christ being the stage, wherein only it is represented, and elsewhere it is not to be seen, and upon it acts the greatest part, for all passages in it tend to this, to shew, as Eph. 2:5, that ‘by grace we are saved;’ and therefore, 1 Peter 2:10, the whole work of salvation is called ‘mercy,’ all God’s ways to his people are mercy, Ps. 25:10, the whole plot and frame of it is made of mercy, and therefore the doctrine of the gospel is called grace, Titus 2:10, 11. Mercy manageth the plot, gives all other attributes, as it were, their parts to act; mercy enters in at the beginning, acts the prologue in election; and, giving Christ, continues every part of it, sets all a-work, ends the whole in glory…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon</cite>, 1</span></figcaption>

</figure><figure class="quote" id="q-f0bd9502b8" data-kw="">
<blockquote><p>‘Behold, I stand at the door and knock, If any man will open…’ (Rev. 3:20). Alas, we cannot open the door, it is so locked and barred and bolted that it is impossible for us to open it. True, it is so, but yet there is a way to open, and that is to be opening when God would help us to open. When God offers to help you to open the door, then set upon opening the door, and whatever the bolts, bars and locks are, you shall be sure to have it open. Ah, but when does God offer to help us to open it? Then when His Spirit knocks, when in the motions of it He solicits us to open, then God offers His help to help us to open. Take that time and then set on the work and the door shall be opened. But if that time is neglected we may strive to open but cannot open, because then that power is gone that would have helped us to open. See Eccl. 9:12, ‘For man also knoweth not his time.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-dyke.html">Jeremiah Dyke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of Quenching &amp; Not Quenching of the Spirit’</cite>, (d. 1620; 1640; RBO, 2018), p. 47</span></figcaption>

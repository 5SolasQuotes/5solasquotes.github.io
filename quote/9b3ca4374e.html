<main class="wrap"><figure class="quote" id="q-9b3ca4374e" data-kw="">
<blockquote><p>The apostles were all equal among themselves; no one had either office or office-power above others. So were all the ordinary bishops and presbyters mentioned in the Scripture, as shall be proved afterward. No intimation is given of any pre-eminence or superiority amongst them of one over others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Inquiry into the Original, Nature, Institution, Power, Order, and Communion of Evangelical Churches</cite>, Preface (Works 15)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c70c9db27d" data-kw="">
<blockquote><p>Whereas they say that there is a double head of the church, one imperial, which is Christ alone, the other ministerial, which is the pope governing the whole church under Christ; I answer, this distinction robs Christ of His honor because in setting up their ministerial head, they are fain to borrow of Christ things proper unto Him, as the privilege to forgive sins properly and the power to govern the whole earth by making of laws that shall as truly bind conscience as the laws of God, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic</cite>, “Of the Supremacy in Causes Ecclesiastical”</span></figcaption>

</figure><figure class="quote" id="q-2fb22158c4" data-kw="">
<blockquote><p>For petra (rock) is not derived from Peter, but Peter from petra; just as Christ is not called so from the Christian, but the Christian from Christ. For on this very account the Lord said, On this rock will I build my Church, because Peter had said, You are the Christ, the Son of the living God. On this rock, therefore, He said, which you have confessed, I will build my Church. For the Rock (Petra) was Christ; and on this foundation was Peter himself also built. For other foundation can no man lay than that is laid, which is Christ Jesus. The Church, therefore, which is founded in Christ received from Him the keys of the kingdom of heaven in the person of Peter, that is to say, the power of binding and loosing sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tractates on the Gospel of John</cite>, tract. 124, §5</span></figcaption>

</figure><figure class="quote" id="q-ed477133ac" data-kw="">
<blockquote><p>Nor do I regard that as an honour whereby I know that my brethren lose their honour. For my honour is the honour of the universal Church: my honour is the solid vigour of my brethren. Then am I truly honoured when the honour due to all and each is not denied them. For if your Holiness calls me Universal Pope, you deny that you are yourself what you call me universally. But far be this from us. Away with words that inflate vanity and wound charity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters</cite>, bk. 8, ep. 30 (to Eulogius of Alexandria)</span></figcaption>

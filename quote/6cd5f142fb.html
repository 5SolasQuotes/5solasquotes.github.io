<main class="wrap"><figure class="quote" id="q-6cd5f142fb" data-kw="">
<blockquote><p>Yea, and although difference in judgment about smaller matters ought not to cause that alienation of affection, and strangeness either among ministers or people, as with many it does; to the great hindrance of the growth of the Gospel; yet towards such as oppose themselves against the truth in main and fundamental articles thereof, Christians are bound to show themselves strange, to shun all voluntary and unnecessary familiarity with them, to show them no countenance. If we shall receive such into our houses, or bid them Godspeed, we make ourselves partakers of their sins, 2 Jn. 10-11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 152 Lectures upon Psalm 51… (London: 1635), Lecture 48, on Ps. 51:4 (1626), p. 243</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4fd8fffa64" data-kw="">
<blockquote><p>Comprehended in the salutation or apostolic benediction: Because Paul, the author of this epistle, would not that the dignity of the Church of Corinth should in any ways be eclipsed (although he knew there were most corrupt persons among them, not only which lay hid, but openly showed themselves enemies to the apostle), but constantly accounted the Church at Corinth a true Church, to which, by his authority, he applied the benediction of the Gospel, and doubted not to wish them all good things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Pauls epistles, together with an explanation of those other epistles of the apostles, St. James, Peter, John &amp; Jude</cite>, ... (London: R.I., 1659) | on 2 Cor., 1:2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-5181cd583d" data-kw="">
<blockquote><p>Thus contentions were hot in the primitive times for meats and such things which were neither of themselves destructive to the foundation of Faith on either side, at least in that time, and so were not heretical; nor did they break off communion in Church-ordinances, and so were not schismatical;</p></blockquote>

</figure><figure class="quote" id="q-321cf00249" data-kw="">
<blockquote><p>We shall here declare what offences are censurable with this greatest and last censure of excommunication, according to the order that is there prescribed, and which, as it requires, ‘that it be inflicted with great and mature deliberation, and after all other good means have been essayed;’ so it appoints in these express words: ‘That such errours in practice as subvert the Faith, or any other errours which overthrow the power of godliness; if the party who holds them spread them, seeking to draw others after him; and such sins in practice as cause the name and truth of God to be blasphemed, cannot stand with the power of godliness; and such practices, as in their own nature manifestly subvert that order, unity and peace which Christ has established in his Church; and particularly all those scandalous sins, for which any person is to be suspended from the sacrament of the Lord’s Supper, obstinately persisted in; these being publicly known, to the just scandal of the Church; The sentence of excommunication may and ought to proceed, according to the directions after following. But the persons that hold other errors in judgment, about which learned and godly men possibly may and do differ, and which subvert not the faith, nor are destructive to godliness, or that be guilty of such sins of infirmity as are commonly found in the children of God: or being otherwise sound in the Faith and holy in life (and so not falling under censure by the former rules) endeavour to keep the unity of the spirit in the bond of peace; and do yet out of conscience not come up to the observation of all those rules which are or shall be established by authority for regulating the outward worship of God and government of his Church; the sentence of excommunication for these causes shall not be denounced against them.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancaster-presbyterians.html">Lancaster Presbyterians</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Censures of the Church Revived</cite>, … (London: Eversden, 1659) sect. 4, p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-4bd72e58b8" data-kw="">
<blockquote><p>I pray hear some of their words, the London [presbyterian] ministers (Vindication, p. 115), ‘Though we dare not make separation from a true Church… yet we do make separation in a true Church [by purging and reforming it…]’ Read over the whole answer and you may perceive their minds (p. 76)…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8f1024e307" data-kw="">
<blockquote><p>Tenth. Christ has evidently, upon purpose and design, peculiarly honoured the first day of the week, the day on which he rose from the dead, by taking this day of the week from time to time to appear to the apostles in, and by taking this day to pour out the Holy Ghost on the apostles, which we read of in Acts 2. For this was on the first day of the week, being on Pentecost, which was on the first day of the week, as you may see by Leviticus 23:15–16. And by pouring his Spirit on John, and giving him his visions on this day [Revelation 1:10], now doubtless Christ had his meaning in his thus distinguishingly honouring this day.

Eleventh. ‘Tis evident by the New Testament that this especially was the day of the public worship of the primitive Christian church by the direction of the apostles. We are told that this was the day that they were wont to come together to break bread with the apostles’ approbation, in that they preached to ’em on that day and, therefore, doubtless by their direction; Acts 20:7, “Upon the first day of the week, when the disciples came together to break bread, Paul preached unto them.” And so the Holy Ghost was careful that the public contributions should be on this day in all the churches rather than any other day, as appears by our text.

Twelfth. This first day of the week is called the Lord’s day in the New Testament (Revelation 1:10). Some say, “How do we know that that was the first day of the week? Every day is the Lord’s day.” But ’tis ridiculous so to talk, for John’s design is to tell us when he had those visions. And if by Lord’s day is meant any day, how can that inform us when? But what is meant by this expression we know just the same way as we know what is the meaning of any word in the original of the New Testament, or the meaning of any expression in any ancient language, viz. by what we find to be the universal intent and signification of the expression in ancient times.

This expression of “the Lord’s day” is found by the ancient use of the whole Christian church, by what appears by all the writings of ancient times, even from the apostles’ days, to signify the first day of the week. And the expression implies in it the holiness of the day, for doubtless the day is called the Lord’s day as the sacred supper is called the Lord’s Supper, which is so called because ’tis a holy supper to be celebrated in remembrance of the Lord Christ and his redemption. So this is a holy day to be kept in remembrance of the Lord Christ and his redemption.

Thirteenth. The tradition of the church from age to age, though it be no rule, yet may be a great confirmation of the truth in such a case as this is. We find by all accounts, that it has been the universal custom of the Christian church in all ages, even from the age of the apostles [to keep this day]. We read in the writings that remain of the first and second and third centuries of the Christians keeping the Lord’s day, and so in all succeeding centuries; and there are no accounts that contradict them. This day has all along been kept by Christians in all countries throughout the world, and by almost all that have borne the name of Christians of all denominations, however different in their opinions as to other things.

Now, though this ben’t [sic] sufficient of itself without a foundation in Scripture, yet it may be a confirmation of it, because here is really matter of conviction to our reason in it. Reason may greatly confirm truths revealed in Scripture. The universality of the custom through all Christian countries, in all ages, by what account we have of ’em, is a good argument that the church had it from the apostles. And ’tis difficult to conceive how all should come to agree to set up such a custom through the world, of different sects and opinions, and we have no account of any such thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetuity and Change of the Sabbath</cite>, (1730-31) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 239-40.</span></figcaption>

<blockquote><p>In the second place, to supply the defendant his penury, the Rejoynder brings abundance of instances, out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy. But these we absolutely deny to be human inventions. The Rejoinder knew this: and therefore by prevention, replies: to say these are not human inventions, because they partly spring out of natural light, is as much as to say, they are not, because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross, and surplice; the cornered-cap, and tippet; the bishops’ rochet, and coap; with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willful invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time, lay aside right natural invention, and judgement.</p></blockquote>

<blockquote><p>Secondly, Paul requires the elders of the Church of Ephesus to take heed unto and to oversee the whole flock, which did consist of more than did or could then meet together ordinarily into one place for the worship of God, as appears by the Church in the house of Aquila and Priscilla (which was one, but not the only one church assembly at Ephesus) by the great and wonderfull increase of the Gospel at Ephesus… Peter also writing to the churches of the strangers in several provinces, calls them the ‘flock’, not ‘flocks’, and commends unto the elders the feeding and oversight of that flock… No doubt they had the administration of the Word and sacraments partitive, or severally. Nor do I deny but they had a partitive several government: but there was also an union or association of them under one common government, which did denominate them to be one visible, ecclesiastical flock.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Secondly, Paul requires the elders of the Church of Ephesus to take heed unto and to oversee the whole flock, which did consist of more than did or could then meet together ordinarily into one place for the worship of God, as appears by the Church in the house of Aquila and Priscilla (which was one, but not the only one church assembly at Ephesus) by the great and wonderfull increase of the Gospel at Ephesus… Peter also writing to the churches of the strangers in several provinces, calls them the ‘flock’, not ‘flocks’, and commends unto the elders the feeding and oversight of that flock… No doubt they had the administration of the Word and sacraments partitive, or severally. Nor do I deny but they had a partitive several government: but there was also an union or association of them under one common government, which did denominate them to be one visible, ecclesiastical flock.”

</figure><figure class="quote" id="q-d2cc4b9b6c" data-kw="">
<blockquote><p>Thirdly, all pride and vanity of garments are to be shunned and all those ornaments which do rather beseem the profane theaters of the gentiles than the sacred temples of Christians and which rather tend to delight the flesh than to edify the spirit: but all things must be done in the churches with most high reverence and modesty, as in the very sight of God and his angels. And albeit concerning the fashion of garments which ministers ought publicly to wear, either in their ministery or out of it, we do not think it a matter to be so stood upon that for it the peace of the church ought to be troubled; yet where they come nearest to the simplicity of the apostles, there we judge the church rather to be approved.</p></blockquote>

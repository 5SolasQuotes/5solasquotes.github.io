<main class="wrap"><figure class="quote" id="q-776ad811ab" data-kw="">
<blockquote><p>…By adulterating the genuine definition of Christ with his poison [the devil] produces this effect, that although we believe that Christ is the Mediator, in fact our troubled conscience feels and judges that He is a tyrant and a tormentor. So Satan deceives us, and we easily lose the pleasant sight of Christ, our High Priest and Mediator. Once this happens, we avoid Christ as though He were Satan. This is why I am so earnest in my plea to you to learn the true and correct definition of Christ on the basis of these words of Paul: “who gave Himself for our sins.” If He gave Himself into death for our sins, then undoubtedly He is not a tormentor. He is not One who will cast down the troubled, but One who will raise up the fallen and bring propitiation and consolation to the terrified. Otherwise Paul would be lying when he says “who gave Himself for our sins.” If I define Christ this way, I define Him correctly, grasp the authentic Christ, and truly make Him my own. I avoid all speculations about the Divine Majesty and take my stand in the humanity of Christ. There is no fear here; there is sheer sweetness, joy, and the like. This kindles a light that shows me the true knowledge of God, of myself, of all creatures, and of all the wickedness of the kingdom of the devil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann (Concordia Publishing House, 1999), 39.</span></figcaption>

</figure><figure class="quote" id="q-b86bb291ee" data-kw="">
<blockquote><p>The Reformation doctrine of justification helps us to see that our salvation is the work of Christ for us. It also delivers us from a life of doubt and fear that causes us to wonder how God could possibly love sinners like us. It shows us that we have peace with God objectively because Christ has satisfied the demands of God for us, and it shows us subjectively because we can know confidently that by faith in Christ we are right with God.</p></blockquote>

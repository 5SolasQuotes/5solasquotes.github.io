</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e06284c3e4" data-kw="">
<blockquote><p>They are not, however, called ‘works of nature’ as if God works them by nature, seeing that outside Himself He acts not by necessity of nature but by the liberty of His will, Ps. 115:3; Eph. 1:11. … The moving cause of God unto creating was not any necessity or indigence, for He is in need of nothing, Acts 17:25, but His most free will, Ps. 115:3, by which He willed to communicate and manifest Himself to creatures, Gen. 1:27, 31, and thereby to be glorified by them, Ps. 8:1; 19:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alting.html">Johann H. Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

— Johann H. Alting, The Scriptural Theology of Heidelberg, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+are+not%2C+however%2C+called+%E2%80%98works+of+nature%E2%80%99+as+if+God+works+them+by+nature%2C+seeing+that+outside+Himself+He+acts+not+by+necessity+of+nature+but+by+the+liberty+of+His+will%2C+Ps.+115%3A3%3B+Eph.+1%3A11.+%E2%80%A6+The+moving+cause+of+God+unto+creating+was+not+any+necessity+or+indigence%2C+for+He+is+in+need+of+nothing%2C+Acts+17%3A25%2C+but+His+most+free+will%2C+Ps.+115%3A3%2C+by+which+He+willed+to+communicate+and+manifest+Himself+to+creatures%2C+Gen.+1%3A27%2C+31%2C+and+thereby+to+be+glorified+by+them%2C+Ps.+8%3A1%3B+19%3A1.%E2%80%9D%0A%0A%E2%80%94+Johann+H.+Alting%2C+The+Scriptural+Theology+of+Heidelberg%2C+vol.+1+%28d.+1644%3B+Amsterdam%3A+Jansson%2C+1646%29%2C+Locus+5%2C+%E2%80%98On+Creation%E2%80%99%2C+trans.+AI+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe06284c3e4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e06284c3e4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/creation#:~:text=They%20are%20not%2C%20however%2C%20called%20%E2%80%98works,glorified%20by%20them%2C%20Ps.%208%3A1%3B%2019%3A1&amp;text=They%20are%20not%2C%20however%2C%20called%20%E2%80%98works%20of%20nature&amp;text=to%20be%20glorified%20by%20them%2C%20Ps.%208%3A1%3B%2019%3A1" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-8a99d1bd51" data-kw="">
<blockquote><p>These people believe that the Bible clearly states that the Earth does not move, and hence the only acceptable Biblical cosmology is a geocentric one… We examine these arguments, and find them poorly founded. The Scriptural passages quoted do not address cosmology. Some geocentrists draw distinctions that do not exist in the original autographs or even in translations. In short, the Bible is neither geocentric nor heliocentric… Many evolutionists claim that disbelief in evolution is like disbelief that the Earth goes round the Sun. The obvious flaw is that the latter is repeatable and observable while the former is not…. …Aardsma’s ICR Impact article, where he points out something well known to high-school physics students, but apparently not to bibliosceptics—that it’s valid to describe motion from any reference frame, although an inertial one usually makes the mathematics simpler. But there are many times when the Earth is a convenient reference frame; i.e. at some point we all use the geocentric model in one sense. For instance, a planetarium is a geocentric model. Calculation of rising, transiting, and setting of various celestial objects is calculated geocentrically. There are numerous other examples. Since modern astronomers often use an Earth-centred reference frame, it’s unfair and anti-scientific to criticise the Bible for doing the same. But this is hardly the issue, and the use of the geocentric model under these circumstances hardly makes one a geocentrist. I’m using the term to describe those who claim that the Earth is the only valid reference frame and oppose the use of any other reference frame. Perhaps the best-known geocentrist in the world today [2001] is Gerardus Bouw, who has been a professor at Baldwin-Wallace College in Berea, Ohio… To distinguish modern geocentrism from ancient geocentrism, Bouw has coined the term ‘geocentricity’ for the former. Bouw has a Ph.D. in astronomy from Case Western Reserve University… Given Bouw’s stature as the chief champion of geocentricity, we will use his book by the same name as the primary source on the topic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/danny-r-faulkner.html">Danny R. Faulkner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Geocentrism &amp; Creation’ Technical Journal</cite>, (now Journal of Creation) 15, no. 2 (August 2001): 110–121.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-4027e08688" data-kw="">
<blockquote><p>When Moses writes that God created Heaven and Earth and whatever is in them in six days, then let this period continue to have been six days, and do not venture to devise any comment according to which six days were one day. But, if you cannot understand how this could have been done in six days, then grant the Holy Spirit the honor of being more learned than you are. For you are to deal with Scripture in such a way that you bear in mind that God Himself says what is written. But since God is speaking, it is not fitting for you wantonly to turn His word in the direction you wish to go.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What Luther Says. A Practical In-Home Anthology for the Active Christian</cite>, ed. Ewald M. Plass (St. Louis: Concordia, 1959), p. 1523</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>As for schismatics who only for schism are out of the Church, and do hold no erroneous point of doctrine, and are not yet convinced [convicted by a church court], they are yet members of the visible Church, as Morton says from Gerson (Morton, Apologia de no•is R•cl., ch. 2, •at. 1, p. 7), as also Glorianus (lib. de schismat., p. 181); but he who is casten out as a schismatic, is in the same case with an excommunicate[d] person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (London, 1644), pt. 2, ch. 4, section 5</cite>, p. 220</span></figcaption>

<blockquote><p>May any who profess the faith, and desire to come to the Lord’s supper, be kept from it? Such as are found to be ignorant or scandalous, notwithstanding their profession of the faith, and desire to come to the Lord’s supper, may and ought to be kept from that sacrament, by the power which Christ hath left in his church,[i] until they receive instruction, and manifest their reformation.[k] [i] 1 Cor. 11:27-34 compared with Matt. 7:6 and with 1 Cor. 5 and with Jude 23 and with 1 Tim. 5:22. [k] 2 Cor. 2:7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Larger Catechism #173</cite></span></figcaption>

<blockquote><p>…that such who were known to be godly might not come to the sacrament of the Lord’s Supper, unless they were members of some particular congregation, and so, in their partaking with you, they must yield that grand Brownistical principle, the foundation of other errors among the Separatists, namely, that sacraments belong not to visible believers, but as they are members of some particular congregation… And let me entreat you, in your reply you [will] give to this answer, to give me a Scripture to prove that all men who come to the Lord’s Supper must profess their membership and their retaining to such a particular congregation: I profess myself of another judgement, and cast the glove to any of you five, or to you all; That it is lawful for the ministers of Christ to receive such whom they know to be godly to the Lord’s Supper, though they be not members of a particular church, and to receive those who are members without any [of them] professing themselves to be so: Suppose some godly merchants or marriners, who all their days travel and never stay long in any one place, yet in all places where they come, desire to join in the ordinances, ought not such to be received? The standing rule of coming to the Lord’s Supper will be found to be faith and godliness shown forth, rather than the formality of membership: …so I find Mr. Batchelour (one of you) writing from Rotterdam of your churches, that they will not keep back the sacrament from any of the godly of such churches in England, as Mr. Goodwin’s and Mr. Calamy’s are (always provided that their own pastors do consent unto it). Now the godly who are gone into Holland, and especially to New-England, not finding any such word in Scripture of bringing a ticket from their ministers, and so coming into those countries without it, may be long kept from the sacrament of the Lord’s Supper till they either go [back] into England and fetch it, or till they send for it over, and have a return back of the consent of their own pastors (which may be, was the reason, that though you offered to receive into the Communion of the Lord’s Supper some godly that came to visit you in your exile, yet for want of bringing their pastor’s consent unto it, returned into England without partaking in the Lord’s Supper with you). Which (by the way) will be a good warning for all that henceforth go over into Holland or New-England, to carry their minister’s consents over with them, lest otherwise they be not admitted to the Lord’s Supper…</p></blockquote>

<blockquote><p>4. The manner of performing this worship of sanctifying the Lord’s Day in holy duties is required not only to be in public, nor only in secret, but [also] by the members of each family jointly, and apart from other families. For 1. It [the 4th Commandment] cannot be understood to require worship only in public together, because: 1. There may be in some cases no access to public worship, and yet the command of sanctifying the Lord’s Day lies still on, and no doubt by families. 2. Waiting on public worship is but one piece of sanctifying the Lord’s Day, and that but in a part of it; therefore there must be some other thing included here.</p></blockquote>

<blockquote><p>Ch. 8, Of their Dismissing of Members from one church to another, or otherwise. 1. No person once thus admitted (as aforesaid) into any of their churches ought to remove thence without the consent of the said church first sought and obtained. For if he do, they hold that he breaks covenant with God and the Church and like Ananias and Sapphira lies against the Holy Ghost. Answer to 9th Position, p. 73; Apology of the Churches in New England for Church Covenant, p. 39; R.M. to E.B., p. 6. Inasmuch as they conceive their covenant binds them not to depart without consent. Ibid. 2. Therefore when any would remove, they require that he first give notice thereof to their church wherewith he is in covenant and lay before them (how many soever they be) in a public meeting both his reasons for which he desires to remove and also to what other church he would remove, and consult with them about both. Answer to 9th Position, p. 74; Apology, p. 20. 3. If upon examination they approve both of his reasons why and of the place whither he would go, then they consent, and giving him letters of dismission and recommendation to that other church, they send him away with their prayers and blessing. Ibid. 4. If contrarily they approve not, either the one or the other, they dissuade him from his purpose; if they prevail not, they will not hold him by violence (for that they cannot), yet they will neither give their consent, nor give him their letters of recommendation (though he were otherwise never so well deserving), nor send him away with their benediction as otherwise they would. Ibid. Yea, he shall depart little better than an excommunicate, as a covenant breaker with God and man, and as one that is wise in his own conceit and refuses to hearken to counsel. Ibid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice in the Churches Lately Erected in New England: Collected out of Sundry of their Own Printed Papers… (London, 1644) Rathband was a Westminster divine.</cite>, pp. 31-32</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Ch. 8, Of their Dismissing of Members from one church to another, or otherwise. 1. No person once thus admitted (as aforesaid) into any of their churches ought to remove thence without the consent of the said church first sought and obtained. For if he do, they hold that he breaks covenant with God and the Church and like Ananias and Sapphira lies against the Holy Ghost. Answer to 9th Position, p. 73; Apology of the Churches in New England for Church Covenant, p. 39; R.M. to E.B., p. 6. Inasmuch as they conceive their covenant binds them not to depart without consent. Ibid. 2. Therefore when any would remove, they require that he first give notice thereof to their church wherewith he is in covenant and lay before them (how many soever they be) in a public meeting both his reasons for which he desires to remove and also to what other church he would remove, and consult with them about both. Answer to 9th Position, p. 74; Apology, p. 20. 3. If upon examination they approve both of his reasons why and of the place whither he would go, then they consent, and giving him letters of dismission and recommendation to that other church, they send him away with their prayers and blessing. Ibid. 4. If contrarily they approve not, either the one or the other, they dissuade him from his purpose; if they prevail not, they will not hold him by violence (for that they cannot), yet they will neither give their consent, nor give him their letters of recommendation (though he were otherwise never so well deserving), nor send him away with their benediction as otherwise they would. Ibid. Yea, he shall depart little better than an excommunicate, as a covenant breaker with God and man, and as one that is wise in his own conceit and refuses to hearken to counsel. Ibid.”

— William Rathband, A Brief Narration of Some Church Courses Held in Opinion &amp; Practice in the Churches Lately Erected in New England: Collected out of Sundry of their Own Printed Papers… (London, 1644) Rathband was a Westminster divine., pp. 31-32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCh.+8%2C+Of+their+Dismissing+of+Members+from+one+church+to+another%2C+or+otherwise.+1.+No+person+once+thus+admitted+%28as+aforesaid%29+into+any+of+their+churches+ought+to+remove+thence+without+the+consent+of+the+said+church+first+sought+and+obtained.+For+if+he+do%2C+they+hold+that+he+breaks+covenant+with+God+and+the+Church+and+like+Ananias+and+Sapphira+lies+against+the+Holy+Ghost.+Answer+to+9th+Position%2C+p.+73%3B+Apology+of+the+Churches+in+New+England+for+Church+Covenant%2C+p.+39%3B+R.M.+to+E.B.%2C+p.+6.+Inasmuch+as+they+conceive+their+covenant+binds+them+not+to+depart+without+consent.+Ibid.+2.+Therefore+when+any+would+remove%2C+they+require+that+he+first+give+notice+thereof+to+their+church+wherewith+he+is+in+covenant+and+lay+before+them+%28how+many+soever+they+be%29+in+a+public+meeting+both+his+reasons+for+which+he+desires+to+remove+and+also+to+what+other+church+he+would+remove%2C+and+consult+with+them+about+both.+Answer+to+9th+Position%2C+p.+74%3B+Apology%2C+p.+20.+3.+If+upon+examination+they+approve+both+of+his+reasons+why+and+of+the+place+whither+he+would+go%2C+then+they+consent%2C+and+giving+him+letters+of+dismission+and+recommendation+to+that+other+church%2C+they+send+him+away+with+their+prayers+and+blessing.+Ibid.+4.+If+contrarily+they+approve+not%2C+either+the+one+or+the+other%2C+they+dissuade+him+from+his+purpose%3B+if+they+prevail+not%2C+they+will+not+hold+him+by+violence+%28for+that+they+cannot%29%2C+yet+they+will+neither+give+their+consent%2C+nor+give+him+their+letters+of+recommendation+%28though+he+were+otherwise+never+so+well+deserving%29%2C+nor+send+him+away+with+their+benediction+as+otherwise+they+would.+Ibid.+Yea%2C+he+shall+depart+little+better+than+an+excommunicate%2C+as+a+covenant+breaker+with+God+and+man%2C+and+as+one+that+is+wise+in+his+own+conceit+and+refuses+to+hearken+to+counsel.+Ibid.%E2%80%9D%0A%0A%E2%80%94+William+Rathband%2C+A+Brief+Narration+of+Some+Church+Courses+Held+in+Opinion+%26+Practice+in+the+Churches+Lately+Erected+in+New+England%3A+Collected+out+of+Sundry+of+their+Own+Printed+Papers%E2%80%A6+%28London%2C+1644%29+Rathband+was+a+Westminster+divine.%2C+pp.+31-32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4b3469d8b8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4b3469d8b8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-leaving-a-congregation/#:~:text=Ch.%208%2C%20Of%20their%20Dismissing%20of,refuses%20to%20hearken%20to%20counsel.%20Ibid&amp;text=Ch.%208%2C%20Of%20their%20Dismissing%20of%20Members%20from&amp;text=conceit%20and%20refuses%20to%20hearken%20to%20counsel.%20Ibid" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

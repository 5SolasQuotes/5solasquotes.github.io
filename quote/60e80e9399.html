<main class="wrap"><figure class="quote" id="q-60e80e9399" data-kw="">
<blockquote><p>1. There is no power in man to remove that resistance that is in his heart against God and the work of his grace; that which out of its own corrupt principles does wholly resist, and cannot but resist, the operation and dispensation of all spiritual means that would prevail with it for good, that cannot take away the resistance; for resistance cannot take away resistance; it implies a palpable contradiction, as that which is professedly cross to common sense. But the corrupt heart of a natural man, while he is in the state of nature and corruption, does and cannot but wholly resist the work of God’s Spirit and grace, and all the saving operations of all the means thereof. The flesh lusts against the Spirit, and the Spirit against the flesh, and these two are contrary, Gal. 5:17. And what is born of the flesh is flesh, Jn. 3:7; that is the temper and inward constitution of a soul in its natural condition; it is wholly born of the flesh, and therefore nothing but flesh, and therefore can do nothing but resist the Spirit; yea, it cannot but oppose whatever would take that resistance away; for it is a received rule of reason, and confessed of all hands, everything desires the preservation of itself and its being; otherwise the being and the causes that made up the being should be cross to the thing, if it should endeavor its own destruction; nay, a thing should be opposite to itself. Hence it is that the corruption of the heart will put forth all the skill and strength it hath, or by the contrivements of carnal reason can compass, to fortify and preserve itself against the spiritual and saving dispensation of the work of God’s Spirit in his own ordinances; because wicked men look at the power thereof as that which works the ruin of their lusts; therefore they labor to avoid the light if they can; if not that, to oppose it, and overbear it by their delusions; if not that, to destroy it… 2. Before the soul can act against the evil of sin, or for the removal of this resistance wherein the destroying venom of sin lies, and that which stops the passage of the power of the ordinance and the work of grace, it is necessary that the Lord should not only concur with the act of the will of a sinner, to lead or draw forth the act thereof which He has ability to express, but He must let in an influence of the same power and virtue into the faculty of the will, whereby it may be enabled to put forth an act unto which it formerly had no power of itself… 3. The influence of this spiritual power whereby the Lord takes away this sinful resistance, is not by any gracious habit of sanctification, but by an irresistable motion of the work of his Spirit upon the soul…</p></blockquote>

<blockquote><p>53. For just as a physician who abolishes and removes disease and restores health; a master who abolishes and takes away servitude and grants freedom to a slave; a lord who breaks and destroys a prison and releases a captive and exalts him to the highest dignity – these are not said to use force upon the sick man, the slave, or the captive. So neither does God use force upon one to whom He provides that renewing grace. And just as it is foreign to debate whether a sick man is restored to health irresistibly, a slave to liberty, a captive to dignity, so it is foreign to this matter to dispute whether God’s renewing grace operates irresistibly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-c-waser.html">Johann C. Waser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Consideration of a Theological Question: Whether the grace of God is a Force, &amp; Whether it is either Resistible or Irresistible</cite>, (fl. 1628-1667) 22 pp. tr. AI by Confetti, pp. 21-22</span></figcaption>

<blockquote><p>God’s stretching out his hands” is all one with his call, (Prov. 1:24); but all men are not called after the same rate as the called according to purpose: wherefore, this place proves not, that the workings of grace as to the elect are resistible; but that the offers of grace as to the non-elect are serious, God in the means really spreading out his arms of grace unto them. Again: they [the Remonstrants] urge that of our Savior, “These things I say, that you might be saved,” (John 5:34); which words were spoken to them, which “would not come to Christ,” (ver. 40); but that the Holy Spirit spoke as inwardly and powerfully to them, as to the elect who” hear and learn of the Father;” what chemistry can extract it out of this text? or from what other scripture can it be demonstrated? God” commands the light to shine out of darkness in some hearts,” (2 Cor. 4:6); but does He so in all? Whence then are those blinded ones? (ver. 4). If there be any such, where is the Remonstrants’ equality of grace? Where, when they say, that illumination is wrought irresistibly? These things cannot consist together. Wherefore our Savior’s words show not forth the weakness or separableness of grace as to the elect, but the true end and scope of Christ’s preaching as to the non-elect; what he spoke to them was in order to their salvation… wherefore this place proves not I that the working of grace in the elect is resistible, but it signally shows forth the nature, of divine ordinances. Every ordinance is an ordinance from the will of God; it is an appointment dropped down from heaven; it is divinely destinated eis oikodomen, for edification and not for destruction… John’s baptism was not a mere external sign or shadow, but imported God’s ordinative counsel to bring men to repentance; it was eis matanoian, to repentance, as its proper end, (Mt. 3:11). Gospel-preaching is not a mere sound or voice of words, but it imports God’s ordinative counsel to turn men unto himself. Hence every true minister is said to stand. in God’s counsel, and for this very end, to turn them from the evil of their doings, (Jer. 22:22). Every ordinance speaks an ordinative counsel for some spiritual end, a serious ordination for the good of souls.</p></blockquote>

<blockquote><p>Nor do we say that any such previous action [to regeneration] can be performed by the creature ut de merito congrui teneatur Gratiam dare [so that it binds by congruent merit to give grace], that God is bound for the desert of any such previous action to give his inward and regenerating quickening grace: But yet this we say, that in the church of God, where men are daily stirred up by the Word and Spirit to repent and believe savingly, God will give (though not for any of these previous or dispository actions, yet) freely, regenerating grace to all such as are capable of it, unless they have resisted the Spirit of God in the preceding operations and rejected his quickening grace; but yet we deny, that any man can perform these actions so but he will offend and resist the Spirit of God in them: Now why when as all resist, God should reject some, as they have rejected Him, and leave them to the hardness of their own hearts, and work irresistibly on others who have resisted their God as much, and break open their hearts, though locked and barred against Him, and fill them with quickening grace, and pull a Lot out of Sodom by force, and draw a soul out of the wilderness by head and shoulders, I say, why He should do it, when two are grinding at the same mill, take one and leave the other… I will conclude with Dr. Davenant, is Sacrum Misterium divinae voluntati reliquendum, ‘a sacred and secret mystery to be left to the divine pleasure,’ and the reason lies in the agent’s own breast; It is because He will have mercy upon whom He will have mercy, and whom He wills He hardens; God is his own reason, and his free grace its own cause.</p></blockquote>

<blockquote><p>The necessity and contingency of things is not to be attributed to God’s decree, but to the working of his power; contingency is when He uses his resistible power; if He works irresistibly then follows necessity: what is contingent to the second cause is infallible to God’s prescience, but necessary to the work of his omnipotency: his decree is a remote cause, which without his power works not. Christ’s death was contingent to the Jews that crucified Him; infallible to God’s prescience, who foresaw that the Jews would kill Him; but necessary in regard of his decree, working by his power in presenting that bitter cup unto Him.</p></blockquote>

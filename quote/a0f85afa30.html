<main class="wrap"><figure class="quote" id="q-a0f85afa30" data-kw="">
<blockquote><p>In fine, as each person is not admitted to baptism from respect or regard to one of his parents alone, but on account of the perpetual covenant of God; so in like manner, no just reason suffers children to be debarred from their initiation into the church in consequence of the bad conduct of only one parent. In the mean time we confess that it is indispensable for them to have sponsors. For nothing is more preposterous than that persons should be incorporated with Christ, of whom we have no hopes of their ever becoming his disciples. Wherefore if none of its relations present himself to pledge his faith to the church that he will undertake the task of instructing the infant, the rite is a mockery and baptism is prostituted. […]

[I]f we exclude from baptism those whom we have had proofs of having been domesticated, as it were, in the church, the exclusion would be too rigorous. In the mean time, therefore, waiting till greater progress have been made, and discipline have gained strength, let children be admitted to baptism on the condition we have mentioned, viz: that their sponsors engage that they will make it their business to have them brought up in the principles of a pious and uncorrupted religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to John Knox, 7 Nov. 1559 in John Calvin: tracts and letters, ed. Jules Bonnet, trans. M. R. Gilchrist (1858; 7 vols, Edinburgh, 2009), vii, 74-5.</cite></span></figcaption>

7/john-calvin-on-baptism-the-covenant-of-grace-and-christian-instruction/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-529d8f82c6" data-kw="">
<blockquote><p>Unless” (says Dr. [Jacob] Andreas [a Lutheran]) “regeneration be always united to baptism, and remains in such as are baptized, how should the troubled consciences of those be eased and comforted, who because they feel not in themselves any good motions of God’s Holy Spirit, find none other refuge but the Word and sacraments, especially the sacrament of baptism? Now this remedy would be of small force except it be opposed against those imaginations which the Devil casts into a troubled heart; yea, except it taught such that God is greater than our heart, who in baptism has not only offered us the adoption of sons, but hath indeed bestowed the same upon us: as it is said by Christ, ‘He that believeth and is baptized, shall be saved.’ And by Paul, ‘Ye which are baptized, have put on Christ.’ David being armed with the like comfort from his circumcision, feared not to join battle with that great giant Goliath: and if this were not so, it must needs follow that baptism were nothing else but an idle ceremony, and also the persons of the Trinity would be thought liars. Wherefore those afflicted men, when Satan assaults them, must resist him with these words: ‘Depart from me Satan, thou hast neither part nor portion in the inheritance of my soul, because I am baptized in the name of the holy Trinity, and so am truly made the son of God by adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Order which Mr. Theodore Beza used in Comforting Afflicted Consciences’ appended to William Perkins, A Golden Chain</cite>, … (Cambridge, 1600)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>After this Examination of the Convert, this following Prayer was made.

O Eternal God, how wonderful art thou in thy works! Thou hast been found by those who have not sought thee; Thy grace hath prevented their thoughts. It is neither from him that willeth, nor from him that runneth, but from thy mercy alone that Salvation doth proceed. It is neither from the West, nor from the East, but from thy wonderful dispensation; when it pleaseth thee, thou stretchest forth thy arm from the height of Heavens to the bottom of the Abyss, to pluck out those who were already on the brink of Hell; O God who hast commanded that light should shine in the midst of darkness, enlighten the flames of thy truth amongst those who do lie in the valley of the shade of Death, that the most barbarous people may see the ways &amp; traces of thy Christ; that the pavilions of Ismael, and of Midian may be shaken, that the sheep which are not yet in thy fold may henceforth be brought into it.

Behold here a Soul which prostrates it self at thy feet to be washed in the blood of thy holy Son Jesus, in the blood of that sprinkling which speaketh for Sinners; be pleased to pardon this poor Sinner that is here present; pardon the faults committed by him in the time of his ignorance; cause thou the Scales to fast from his eyes. Create in him a new heart, that being a new Creature he may walk in righteousness and holiness. Cause thou that the Baptism which according to thy ordinance we do confer upon him be effectual to his salvation, that it may redound to the glory of thy great name, to the joy of thy Angels, and to the comfort of those who love thy Anointed who is blessed for evermore.

Immediately after this Prayer, the Convert being on his knees was baptized, presented by Monsieur Armand of Caumont Marquis of Montpouillan, and the Lady Adrian de Mayern who were his Godfather and Godmother, from whom he received the name of Armand Adrian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-d-espagne.html">Jean D’Espagne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The joyful convert: represented in a short but elegant sermon preached at the baptizing of a Turk, who renouncing the law of Mahomet, and having given abundant satisfaction for the reasons and soundness of his conversion, was baptized in the French Church May 2. 1658. the Marquis of Montpouillian, a</cite>, (London: I. Leach, 1658), pp 22-24.</span></figcaption>

</figure><figure class="quote" id="q-7cdb80497d" data-kw="">
<blockquote><p>The Law of Nature dictates that all who are admitted into this [Chuch] Society, must consent to be governed by the laws and rules of that society, according to its constitution. For none can be looked upon as a member of a society, but such a one as submits to the rules and laws of the society, as constituted at the time of his entrance into it. That all civil societies are founded upon voluntary consent and agreement of parties, and do depend upon contracts and covenants made between them, is evident to any that consider that men are not bound by the Law of Nature to associate themselves with any but whom they shall judge fit; that dominion and propriety was introduced by free consent of men: and so there must be laws and bonds fit, agreement made, and submission acknowledged to those laws, else men might plead their natural right and freedom still, which would be destructive to the very nature of these societies. When men then did first part with their natural Liberties, two things were necessary in the most express terms to be declared: First, a free and voluntary consent to part with so much of their natural rights as was not consistent with the well-being of the society; Secondly, a free submission to all laws, which should be agreed upon at their entrance into society, or afterwards as they see cause. But when societies were already entered, and children born under them, no such express consent was required in them, being bound by virtue of the protection they find from authority to submit to it, and an implicit consent is supposed in all such as are born under that authority. But for their more full understanding of this obligation of theirs, and to lay the greater tie of obedience upon them, when they come to understanding, it has been conceived very requisite by most states to have an explicit declaration of their consent, either by some formal oath of allegiance, or some other way sufficiently expressing their fidelity, in standing to the covenants long since supposed to be made. To apply this now to the Church. … Our Savior has determined how this consent should be expressed, viz. by receiving baptism from those who have the power to dispense it: which is the federal rite whereby our consent is expressed to own all the laws and submit to them, whereby this society is governed: Which at the first entering of men into this society of the Church was requisite to be done by the express and explicit consent of the parties themselves, being of sufficient capacity to declare it, but the Covenant being once entered into by themselves, not only in their own name, but in the name of their posterity (a thing implied in all covenants wherein benefits do redound to posterity, that the obligation should reach them to; but more particular in this, it having been always the tenor of God’s Covenants with men, to enter the seed as well as the persons themselves, as to outward privileges, Dt. 29:15; Acts 2:38), an implicit consent as to the children in Covenant is sufficient to enter them upon the privileges of it by baptism, although withal it be highly rational for their better understanding the engagement they entered into, that when they come to age, they should explicitly declare their own voluntary consent to submit to the laws of Christ, and to conform their lives to the profession of Christianity… …but in religious societies [in contrast to natural societies], though the act of consent be free, yet there is an antecedent obligation upon men, binding them to this voluntary consent… It is granted, Church-power does suppose consent, but then all Christians are under an obligation from the nature of Christianity to express this consent, and to submit to all censures legally inflicted. … …yet I no ways deny the lawfulness or expediency, in many cases, of having a personal profession from all baptized in infancy when they come to age (which we may, if we please, call Confirmation) and the necessity of desiring admission, in order to participation of all ordinances: which desire of admission, does necessarily imply men’s consenting to the laws of that society, and walking according to the duties of it; and so they are consequentially and virtually, though not expressly and formally, bound to all the duties required from them in that relation.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The Law of Nature dictates that all who are admitted into this [Chuch] Society, must consent to be governed by the laws and rules of that society, according to its constitution. For none can be looked upon as a member of a society, but such a one as submits to the rules and laws of the society, as constituted at the time of his entrance into it. That all civil societies are founded upon voluntary consent and agreement of parties, and do depend upon contracts and covenants made between them, is evident to any that consider that men are not bound by the Law of Nature to associate themselves with any but whom they shall judge fit; that dominion and propriety was introduced by free consent of men: and so there must be laws and bonds fit, agreement made, and submission acknowledged to those laws, else men might plead their natural right and freedom still, which would be destructive to the very nature of these societies. When men then did first part with their natural Liberties, two things were necessary in the most express terms to be declared: First, a free and voluntary consent to part with so much of their natural rights as was not consistent with the well-being of the society; Secondly, a free submission to all laws, which should be agreed upon at their entrance into society, or afterwards as they see cause. But when societies were already entered, and children born under them, no such express consent was required in them, being bound by virtue of the protection they find from authority to submit to it, and an implicit consent is supposed in all such as are born under that authority. But for their more full understanding of this obligation of theirs, and to lay the greater tie of obedience upon them, when they come to understanding, it has been conceived very requisite by most states to have an explicit declaration of their consent, either by some formal oath of allegiance, or some other way sufficiently expressing their fidelity, in standing to the covenants long since supposed to be made. To apply this now to the Church. … Our Savior has determined how this consent should be expressed, viz. by receiving baptism from those who have the power to dispense it: which is the federal rite whereby our consent is expressed to own all the laws and submit to them, whereby this society is governed: Which at the first entering of men into this society of the Church was requisite to be done by the express and explicit consent of the parties themselves, being of sufficient capacity to declare it, but the Covenant being once entered into by themselves, not only in their own name, but in the name of their posterity (a thing implied in all covenants wherein benefits do redound to posterity, that the obligation should reach them to; but more particular in this, it having been always the tenor of God’s Covenants with men, to enter the seed as well as the persons themselves, as to outward privileges, Dt. 29:15; Acts 2:38), an implicit consent as to the children in Covenant is sufficient to enter them upon the privileges of it by baptism, although withal it be highly rational for their better understanding the engagement they entered into, that when they come to age, they should explicitly declare their own voluntary consent to submit to the laws of Christ, and to conform their lives to the profession of Christianity… …but in religious societies [in contrast to natural societies], though the act of consent be free, yet there is an antecedent obligation upon men, binding them to this voluntary consent… It is granted, Church-power does suppose consent, but then all Christians are under an obligation from the nature of Christianity to express this consent, and to submit to all censures legally inflicted. … …yet I no ways deny the lawfulness or expediency, in many cases, of having a personal profession from all baptized in infancy when they come to age (which we may, if we please, call Confirmation) and the necessity of desiring admission, in order to participation of all ordinances: which desire of admission, does necessarily imply men’s consenting to the laws of that society, and walking according to the duties of it; and so they are consequentially and virtually, though not expressly and formally, bound to all the duties required from them in that relation.”

— Edward Stillingfleet, Irenicum, a Weapon-Salve for the Church’s Wounds, ch. 7 in Irenicum, a Weapon-Salve for the Church’s Wounds, or the Divine Right of Particular Forms of Church-Government Discussed &amp; Examined... (London: Mortlock, 1662), pt. 1, pp. 132-40">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Law+of+Nature+dictates+that+all+who+are+admitted+into+this+%5BChuch%5D+Society%2C+must+consent+to+be+governed+by+the+laws+and+rules+of+that+society%2C+according+to+its+constitution.+For+none+can+be+looked+upon+as+a+member+of+a+society%2C+but+such+a+one+as+submits+to+the+rules+and+laws+of+the+society%2C+as+constituted+at+the+time+of+his+entrance+into+it.+That+all+civil+societies+are+founded+upon+voluntary+consent+and+agreement+of+parties%2C+and+do+depend+upon+contracts+and+covenants+made+between+them%2C+is+evident+to+any+that+consider+that+men+are+not+bound+by+the+Law+of+Nature+to+associate+themselves+with+any+but+whom+they+shall+judge+fit%3B+that+dominion+and+propriety+was+introduced+by+free+consent+of+men%3A+and+so+there+must+be+laws+and+bonds+fit%2C+agreement+made%2C+and+submission+acknowledged+to+those+laws%2C+else+men+might+plead+their+natural+right+and+freedom+still%2C+which+would+be+destructive+to+the+very+nature+of+these+societies.+When+men+then+did+first+part+with+their+natural+Liberties%2C+two+things+were+necessary+in+the+most+express+terms+to+be+declared%3A+First%2C+a+free+and+voluntary+consent+to+part+with+so+much+of+their+natural+rights+as+was+not+consistent+with+the+well-being+of+the+society%3B+Secondly%2C+a+free+submission+to+all+laws%2C+which+should+be+agreed+upon+at+their+entrance+into+society%2C+or+afterwards+as+they+see+cause.+But+when+societies+were+already+entered%2C+and+children+born+under+them%2C+no+such+express+consent+was+required+in+them%2C+being+bound+by+virtue+of+the+protection+they+find+from+authority+to+submit+to+it%2C+and+an+implicit+consent+is+supposed+in+all+such+as+are+born+under+that+authority.+But+for+their+more+full+understanding+of+this+obligation+of+theirs%2C+and+to+lay+the+greater+tie+of+obedience+upon+them%2C+when+they+come+to+understanding%2C+it+has+been+conceived+very+requisite+by+most+states+to+have+an+explicit+declaration+of+their+consent%2C+either+by+some+formal+oath+of+allegiance%2C+or+some+other+way+sufficiently+expressing+their+fidelity%2C+in+standing+to+the+covenants+long+since+supposed+to+be+made.+To+apply+this+now+to+the+Church.+%E2%80%A6+Our+Savior+has+determined+how+this+consent+should+be+expressed%2C+viz.+by+receiving+baptism+from+those+who+have+the+power+to+dispense+it%3A+which+is+the+federal+rite+whereby+our+consent+is+expressed+to+own+all+the+laws+and+submit+to+them%2C+whereby+this+society+is+governed%3A+Which+at+the+first+entering+of+men+into+this+society+of+the+Church+was+requisite+to+be+done+by+the+express+and+explicit+consent+of+the+parties+themselves%2C+being+of+sufficient+capacity+to+declare+it%2C+but+the+Covenant+being+once+entered+into+by+themselves%2C+not+only+in+their+own+name%2C+but+in+the+name+of+their+posterity+%28a+thing+implied+in+all+covenants+wherein+benefits+do+redound+to+posterity%2C+that+the+obligation+should+reach+them+to%3B+but+more+particular+in+this%2C+it+having+been+always+the+tenor+of+God%E2%80%99s+Covenants+with+men%2C+to+enter+the+seed+as+well+as+the+persons+themselves%2C+as+to+outward+privileges%2C+Dt.+29%3A15%3B+Acts+2%3A38%29%2C+an+implicit+consent+as+to+the+children+in+Covenant+is+sufficient+to+enter+them+upon+the+privileges+of+it+by+baptism%2C+although+withal+it+be+highly+rational+for+their+better+understanding+the+engagement+they+entered+into%2C+that+when+they+come+to+age%2C+they+should+explicitly+declare+their+own+voluntary+consent+to+submit+to+the+laws+of+Christ%2C+and+to+conform+their+lives+to+the+profession+of+Christianity%E2%80%A6+%E2%80%A6but+in+religious+societies+%5Bin+contrast+to+natural+societies%5D%2C+though+the+act+of+consent+be+free%2C+yet+there+is+an+antecedent+obligation+upon+men%2C+binding+them+to+this+voluntary+consent%E2%80%A6+It+is+granted%2C+Church-power+does+suppose+consent%2C+but+then+all+Christians+are+under+an+obligation+from+the+nature+of+Christianity+to+express+this+consent%2C+and+to+submit+to+all+censures+legally+inflicted.+%E2%80%A6+%E2%80%A6yet+I+no+ways+deny+the+lawfulness+or+expediency%2C+in+many+cases%2C+of+having+a+personal+profession+from+all+baptized+in+infancy+when+they+come+to+age+%28which+we+may%2C+if+we+please%2C+call+Confirmation%29+and+the+necessity+of+desiring+admission%2C+in+order+to+participation+of+all+ordinances%3A+which+desire+of+admission%2C+does+necessarily+imply+men%E2%80%99s+consenting+to+the+laws+of+that+society%2C+and+walking+according+to+the+duties+of+it%3B+and+so+they+are+consequentially+and+virtually%2C+though+not+expressly+and+formally%2C+bound+to+all+the+duties+required+from+them+in+that+relation.%E2%80%9D%0A%0A%E2%80%94+Edward+Stillingfleet%2C+Irenicum%2C+a+Weapon-Salve+for+the+Church%E2%80%99s+Wounds%2C+ch.+7+in+Irenicum%2C+a+Weapon-Salve+for+the+Church%E2%80%99s+Wounds%2C+or+the+Divine+Right+of+Particular+Forms+of+Church-Government+Discussed+%26+Examined...+%28London%3A+Mortlock%2C+1662%29%2C+pt.+1%2C+pp.+132-40&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7cdb80497d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7cdb80497d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=The%20Law%20of%20Nature%20dictates%20that,required%20from%20them%20in%20that%20relation&amp;text=The%20Law%20of%20Nature%20dictates%20that%20all%20who&amp;text=the%20duties%20required%20from%20them%20in%20that%20relation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>What fruit or profit cometh of the baptizing of infants? It serveth for the parents’ comfort, for the sign being committed to the child (as by a printed seal) doth confirm the promise made to the godly parent: that the Lord, will be a God, not to him only, but to his seed also.</p></blockquote>

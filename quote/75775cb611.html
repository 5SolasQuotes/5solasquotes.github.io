<main class="wrap"><figure class="quote" id="q-75775cb611" data-kw="Mary|Queen of Heaven|Idolatry|Paganism" data-pol="mary|images-and-idolatry">
<blockquote><p>These men had constituted a Queen in heaven, not from God: they also offered her cakes and drink offerings. … Those Arab women imitated this custom, against whom and their followers Epiphanius writes, who in Christianity were the first to apply the name Queen of heaven to the Blessed virgin, and offered cakes to her, as the idolatrous Jews did to their queen of heaven.</p></blockquote>
<figcaption>— <a href="../authors/andre-rivet.html">André Rivet</a>, <cite>Apology for the Most Holy Virgin Mary</cite>, Bk. 2, ch. 2 (on Jer. 44:16-18)</figcaption>

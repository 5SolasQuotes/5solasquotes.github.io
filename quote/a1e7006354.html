<blockquote><p>We allege, further, that there is no ground to conclude that the use of the inspired Psalms in the Church was abrogated at the close of the former economy.

It is an incontrovertible maxim, that whatever God has appointed to be observed in his worship should be perpetually observed, unless he himself intimated that it is temporary, or declares its abrogation. Singing God’s praise is obviously a moral duty, and, as such, of permanent obligation. Jehovah himself once appointed this duty to be performed in the words of David and Asaph; that is, by means of the inspired Psalms. Neither the duty of singing not the form of psalmody was of a ceremonial of judicial nature, [1] and, consequently, there is no reason to regard them abrogated when Christ came, and the partition wall was broken down. The church is, moreover, one in all ages. Every institution which her glorious Head has given her, she is bound carefully to observe, until it be abrogated by the same authority which first ordained it. No instance can be adduced in which the King of Zion has abrogated the use of the church’s inspired songs, or given permission to supplant them by the effusions of men. The divine sanction for using the Psalms is, therefore, yet disannulled, and the church now has the same warrant for drawing hence spiritual consolation, as had those to whom the sweet singer of Israel first delivered the inspired songs of Zion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Jan. 1835, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bb319eb0b3" data-kw="">
<blockquote><p>But he is not satisfied that in the Christian Assemblies, in the apostles’ times there were no manner of forms. Who says there were not? There was a form of sound doctrine (which the apostle tells us of), there were Psalms, Hymns, and spiritual Songs in forms, they are the three titles of David’s Psalms; we have nothing to do with any thing but forms of prayer, made by some particular ministers, or Church officers, to be used by all other ministers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Supplement to a Little Book Entitled, A Reasonable Account why some Pious Nonconforming ministers cannot judge it lawful for them to perform their ministerial acts in public solemn prayer, ordinarily, by the prescribed forms of others</cite>, A Supplement to a Little Book Entitled, A Reasonable Account why some Pious Nonconforming ministers cannot judge it lawful for them to perform their ministerial acts in public solemn prayer, ordinarily, by the prescribed forms of others… (London, 1680), Section 1, p. 92. Collinges was an English presbyterian; he is writing against a conforming defender of Anglicanism.</span></figcaption>

<blockquote><p>‘God is to be worshipped in Spirit and in Truth’; no worshipping can be more true, or more spiritual than the Psalter said with a pure mind and a hearty devotion. For David was God’s instrument to the Church, teaching and admonishing us (as our duty is to each other) in psalms and hymns, and spiritual songs, and the Spirit of Truth was the Grand Dictator of what David wrote; so that we may confidently use this devotion as the Church of God ever did, making her addresses to God most frequently by the Psalms:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalter of David with Titles and Collects according to the matter of each Psalm</cite>, (London, 1647) ‘The Preface’, no page number. Taylor (1613–1667) was a conformed cleric in the Church of England who advocated for very liturgical worship. The Preface is very good, at length, with regard to the psalms. Some of the references to ‘hymns’ refer to the psalms themselves. Taylor held to predominant psalmody.</span></figcaption>

<blockquote><p>[The Objection of Quakers:] But our Psalms are not the same in meter, nor the same tunes which the Jews had. [Answer:] That seeing the singing of Psalms is a duty commanded, and amongst others, those of David, and has hid from us the Hebrew tunes, wherewith the Psalms of David were wont to be sung, it must needs follow that the Lord has left it to the liberty of the Church to sing them in such plain, grave tunes as may fit the solemnity of God’s worship, and that because that tunes are but circumstantial and not the substance; and the Church now in the days of the Gospel is not in her minority or young age, but in her man-age, or full grown age, as the apostle speaketh (Gal. 4:1-6), and therefore fitter to appoint circumstantial things in God’s worship than the Jews, being in their non-age.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gaskin.html">John Gaskin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Just Defence &amp; Vindication of Gospel Ministers &amp; Gospel Ordinances Against the Quakers’ many False Accusations, Slanders &amp; Reproaches. In answer to John Horwood, his Letter, &amp; E.B. his Book</cite>, … (London, 1660), pp. 86-87</span></figcaption>

n%2Dage" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>He would have us cheerful, he commandeth us to rejoice evermore; and, is any merry, ‘let him sing’ (James 5:13), but one of the songs of ‘Sion’ [Ps. 137:3]: only let no corrupt communication proceed out of your mouths; but that which is good to the use of edifying, that it may minister grace to the hearers. Sing Psalms, Hymns, &amp; spiritual Songs, singing with a grace in your hearts to the Lord (Col. 3:16). To such songs the spirit of grace commeth flying: the bees come to aromatical and sweet things, the swine will to the mire: to obscene and meritricious songs and discourses, the devil’s swarm, let them only use and love them, who love their company.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s Soliloquy Containing many comforts for Afflicted Minds. As they were delivered in sundry sermons at Saint Mary’s in Dover</cite>, (London, 1627) These sermons of the reformed and conforming Anglican, John Reading (c.1587-1667) on Ps. 42:11 contain 42 references to a psalm or psalms. As is seen from below, the few times Reading refers to ‘hymns’, the term refers to psalms from the book of psalms. Note Reading’s interpretation of the early letter of Pliny as referring to the early Christians singing psalms to Christ., p. 38-9</span></figcaption>

<div class="actions"><button class="copy" data-copy="“He would have us cheerful, he commandeth us to rejoice evermore; and, is any merry, ‘let him sing’ (James 5:13), but one of the songs of ‘Sion’ [Ps. 137:3]: only let no corrupt communication proceed out of your mouths; but that which is good to the use of edifying, that it may minister grace to the hearers. Sing Psalms, Hymns, &amp; spiritual Songs, singing with a grace in your hearts to the Lord (Col. 3:16). To such songs the spirit of grace commeth flying: the bees come to aromatical and sweet things, the swine will to the mire: to obscene and meritricious songs and discourses, the devil’s swarm, let them only use and love them, who love their company.”

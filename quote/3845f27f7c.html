<main class="wrap"><figure class="quote" id="q-3845f27f7c" data-kw="">
<blockquote><p>‘Behold, I stand at the door’ of your heart and ‘knock: Open to Me, my sister, my love, my undefiled; for my head is filled with the dew, and my locks with the drops of the night.’… ‘When He waits to be gracious, and exalts Himself to show mercy.’ why tire out his patience till He ‘shut up all his tender mercies in his wrath?’ ‘Is it a small thing for you to weary men,’ weary parents, and ministers? ‘But will ye weary my God also?‘</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Addresses to Children Concerning Salvation (Torwood Press, 2013) | “An Address to the Young Readers of this Catechism” (1781)</cite>, p. 31</span></figcaption>

<blockquote><p>First, does Christ declare the mind of the Father? get then intimacy and familiarity with Jesus Christ; take Him into thy heart, that lay in the bosom of the Father.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-b77f7d56f4" data-kw="">
<blockquote><p>And he says, though He be a king, yea, the King of Kings, yet He stands at the door and knocks, that is, calls them to repentance and promises if they will let Him in, that is, turn from their sin and yield to his will, He will come unto them and sup with them, signifying what exceeding joy and comfort they should receive by Him; yea, they should be made partakers of the joys of Heaven: where he alludes to the comfort that friends have one of another when they meet together at their dinners, suppers and feasts, which thing, if it be comfortable to men, much more comfort shall it minister unto us, to be partakers of the company of Christ Jesus Himself in his heavenly banquet. A second benefit he notes in that those that do thus receive Him and overcome shall not only receive comfort, but glory also and honor in his Kingdom…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Explanation of the Whole Revelation of St. John… (d. 1603; London: 1622), ch. 3</cite>, p. 22</span></figcaption>

</figure><figure class="quote" id="q-d4be157468" data-kw="">
<blockquote><p>(2) Believing is the soul’s receiving Christ. St. Paul says, “Ye have received Christ Jesus the Lord.” (Col. 2:6) Christ offers to come into man’s heart with pardon, mercy, and grace, and to dwell there as its Peace-maker and King. He says, ‘I stand at the door and knock.’ (Rev. 3:20) The believer hears his voice, opens the door and admits Christ as his Master, Priest and King.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Old Paths: Being Plain Statements of Some of the Weightier Matters of Christianity (London: Charles J. Thynne, 1898)</cite>, pp. 376–402</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-f0c8aa1355" data-kw="">
<blockquote><p>Whereby He signifies that He has long ago looked that they should repent from the bottom of their heart and receive his grace into their heart. Moreover this place does plainly teach us that we cannot rightly receive Christ before He first offer Himself to be received of us. ‘I will enter in unto him and will sup with him, etc.’ The gentleness and mercy of the Lord is marvelous, which so willingly pardons so great injuries done unto Him by his servant, that forgetting all injuries, He does of his own accord offer pardon, and in sign of perfect reconciliation, He will gently come and sup with him. For men are wont by such tokens to renew friendship that is broken between them. But those whom Christ vouchsafes to be partakers of his table (as He vouchsafes all the faithful) He feeds their minds with spiritual dainties, whereby they shall be nourished unto eternal life, namely with righteousness freely given, quietness of conscience, and unspeakable joy, where with the godly are fed by the Holy Ghost, whereof also He has given a most excellent pledge, the holy comunion of his body and blood, which when we receive by faith, we have Him everlastingly dwelling with us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fulke.html">William Fulke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prælections upon the Sacred &amp; Holy Revelation of St. John (1573), ch. 3, on verse 20</cite>, p. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

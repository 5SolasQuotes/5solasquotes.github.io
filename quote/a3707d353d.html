<blockquote><p>Thirdly the difficulty of reclaiming the Country people on the Sundays either from the Sports or from their Work. The Synod beginning to consider of means to cut off these abuses, Festus Hommius amongst other things complained, that through the negligence of the Remonstrants it came that Catechizing was so much decayed; which words of his, it is thought, will be an occasion of some choler, though for the present they passed uncontrolled. Many delivered their opinions how the forementioned hindrances of Afternoon Sermons and Catechizing might be removed.

First, by imploring the help of the States General, that it would please them by their authority to prohibit that ordinary profanation of the Sabbath by working or playing; secondly, by requiring the like help of the particular magistrate in every town and village; thirdly, by taking away those combinations; fourthly, by providing of sufficient school-masters in every village who should not only teach grammar, but instruct youths in the principles of religion; fifthly, that the pastors should not omit afternoon sermons by reason of the negligence of their auditors, but should perform them, though they brought to the church none but their own family, that the pastors and deacons and seniors [elders] should deal with their friends and acquaintance and bring them to church with them; sixthly, that if any pastor neglected to perform this duty, he should be subject to ecclesiastical censure; seventhly, that the deputies [delegates] of other nations should be requested to make overture of their customs in this behalf; lastly, that diligent inquiry should be made throughout all the Classes, whether catechizing and afternoon sermons were observed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hales.html">John Hales</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters from the Synod of Dort to the Right Honourable Sr. Dudley Carleton, Lord Ambassador</cite>, in Golden remains, of the ever memorable Mr. John Hales, of Eaton-College, &amp;c. The second impression. With additions from the author’s own copy, viz., sermons &amp; miscellanies, also letters and expresses concerning the Synod of Dort (not before printed,) from an authentic hand (London: Robert Pawlet, 1673), pp 4-5.</span></figcaption>

<blockquote><p>We believe that these Holy Scriptures fully contain the will of God, and that whatsoever man ought to believe unto salvation, is sufficiently taught therein. For since the whole manner of worship which God requires of us is written in them at large, it is unlawful for any one, though an Apostle, to teach otherwise than we are now taught in the Holy Scriptures; nay, though it were an angel from, heaven, as the Apostle Paul saith. For since it is forbidden to add unto or take away any thing from the Word of God, it doth thereby evidently appear that the doctrine thereof is most perfect and complete in al respects. Neither may we compare any writings of men, though ever so holy, with those divine Scriptures; nor ought we to compare custom, or the great multitude, or antiquity, or succession of times or persons, or councils, decrees, or statutes, with the truth of God, for the truth is above all: for all men are of themselves liars, and more vain than vanity itself. Therefore we reject with all our hearts whatsoever doth not agree with this infallible rule, which the Apostles have taught us, saying, Try the spirits whether they are of God; likewise, If there come any unto you, and bring not this doctrine, receive him not into your house.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/belgic-confession.html">Belgic Confession</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Creeds of Christendom</cite>, vol. 3 (New York: Harper &amp; Brothers, 1882), 389.</span></figcaption>

</figure><figure class="quote" id="q-b1385f3a8f" data-kw="">
<blockquote><p>Not that to drink wine is shameful. God forbid! For such precepts belong to heretics … The passage before us is useful also against heretics, who speak evil of God’s creatures; for if it had been among the number of things forbidden, Paul would not have permitted it, nor would have said it was to be used.

And not only against the heretics, but against the simple ones among our brethren, who when they see any persons disgracing themselves from drunkenness, instead of reproving such, blame the fruit given them by God, and say, “Let there be no wine.” We should say then in answer to such, “Let there be no drunkenness; for wine is the work of God, but drunkenness is the work of the devil. Wine maketh not drunkenness; but intemperance produceth it. Do not accuse that which is the workmanship of God, but accuse the madness of a fellow mortal. But thou, while omitting to reprove and correct the sinner, treatest thy Benefactor with contempt!”

… When, therefore, we hear men saying such things, we should stop their mouths; for it is not the use of wine, but the want of moderation which produces drunkenness, Drunkenness! that root of all evils. Wine was given to restore the body’s weakness, not to overturn the soul’s strength; to remove the sickness of the flesh, not to destroy the health of the spirit.

Do not then, by using the gift of God immoderately, afford a handle to the foolish and the impudent. For what is a more wretched thing than drunkenness! The drunken man is a living corpse. Drunkenness is a demon self-chosen, a disease without excuse, an overthrow that admits of no apology; a common shame to our kind. The drunken man is not only useless in our assemblies; not only in public and private affairs; but the bare sight of him is the most disgusting of all things, his breath being stench.

The belchings, and gapings, and speech of the intoxicated, are at once unpleasant and offensive, and are utterly abhorrent to those who see and converse with them; and the crown of these evils is, that this disease makes heaven inaccessible to drunkards, and does not suffer them to win eternal blessedness: for besides the shame attending those who labour under this disease here, a grievous punishment is also awaiting them there!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies Addressed to the People of Antioch, Concerning the Statutes</cite>, (387), 1.7, 11-12 in Nicene and Post-Nicene Fathers 2, 9: 333, 335.</span></figcaption>

</figure><figure class="quote" id="q-c734929aa3" data-kw="">
<blockquote><p>According to the Westminster Confession, ‘It pleased God the Father, Son, and Holy Ghost, for the manifestation of the glory of His eternal power, wisdom, and goodness, in the beginning, to create, or make of nothing, the world, and all things therein whether visible or invisible, in the space of six days; and all very good.’ (IV.I) Some scholars have argued that this does not require confessional adherents to believe in six-day creation, even though such a conclusion appears to go against the obvious meaning of the words. This argument does not appear to harmonise with the primary sources, moreover. William Gouge, an important member of the Westminster Assembly, argues that the seventh-day of the creation week lasted for twenty-four hours and maintains that this was also the length of the other days:

3. Q. Of how many hours doth the Sabbath day consist?

A. Of four and twenty. Gen. 2.3.

The Sabbath is called the seventh day: so as it is a seventh part of the week: therefore so many hours as make up every of the other days (which are four and twenty) must be accounted to this day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s sanctification</cite>, (London, 1641), p. 2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“According to the Westminster Confession, ‘It pleased God the Father, Son, and Holy Ghost, for the manifestation of the glory of His eternal power, wisdom, and goodness, in the beginning, to create, or make of nothing, the world, and all things therein whether visible or invisible, in the space of six days; and all very good.’ (IV.I) Some scholars have argued that this does not require confessional adherents to believe in six-day creation, even though such a conclusion appears to go against the obvious meaning of the words. This argument does not appear to harmonise with the primary sources, moreover. William Gouge, an important member of the Westminster Assembly, argues that the seventh-day of the creation week lasted for twenty-four hours and maintains that this was also the length of the other days:

3. Q. Of how many hours doth the Sabbath day consist?

A. Of four and twenty. Gen. 2.3.

The Sabbath is called the seventh day: so as it is a seventh part of the week: therefore so many hours as make up every of the other days (which are four and twenty) must be accounted to this day.”

<blockquote><p>…let them who commend them [dances] to the Church, see where those sober and modest dances which they speak of can find any place: and to those that expound choreas ducere [to conduct dances], only of lascivious dances, we will in a form of speech commodious enough interpret these dances to be meant of all dancings whatsoever: otherwise St. Cyprian had not affirmed that David danced before God, unless any should think that the Blessed [Peter] Martyr (which never came into his mind) would brand the royal prophet with a mark of lascivious and obscene dancing. And if there be any that think that dancing be sober and modest, they are at their liberty for me to abound in their own sense: at least, with Octavius, that good defender of the Christian religion, and other lights of Reformed Christianity, it seems meet for me to repute them as obscene and evil pleasures. Lastly, let the patrons of those dances which they call sober…</p></blockquote>

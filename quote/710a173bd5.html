<main class="wrap"><figure class="quote" id="q-710a173bd5" data-kw="Affliction Comfort">
<blockquote><p>All who are disposed to betake themselves to God, under the crook in their lot may take comfort in this, let them know that there is no crook in their lot but they may be made straight; for God made it, surely then He can mend it. He himself can make straight what He has made crooked, though none other can.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crook in the Lot</cite>, Doct. I, Use 2 (consolation)</span></figcaption>

</figure><figure class="quote" id="q-79b15337b3" data-kw="">
<blockquote><p>That I am not my own, but belong—body and soul, in life and in death—to my faithful Savior, Jesus Christ. He has fully paid for all my sins with his precious blood, and has set me free from the tyranny of the devil. He also watches over me in such a way that not a hair can fall from my head without the will of my Father in heaven; in fact, all things must work together for my salvation. Because I belong to him, Christ, by his Holy Spirit, assures me of eternal life and makes me wholeheartedly willing and ready from now on to live for him.</p></blockquote>

<blockquote><p>These events brought about a marked deterioration in the atmosphere. Their immediate result was to impel the government to greater efforts against the field-meetings in general and to deploy more troops to suppress them. Cameron, for his part, appears to have become increasingly embarrassed by Hamilton’s activities on his behalf, and he is said to have publicly expressed his regret for the Loudon Hill [Rutherglen, 1679] incident in particular.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>No King but Christ: the Story of Donald Cargill</cite>, (Durham: Evangelical Press, 1988), pp. 89</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3067d18b5d" data-kw="">
<blockquote><p>Touching the principles and practices of sundry, who during the persecution and afterwards did abstract from hearing presbyterian ministers and confined their attendance to some few, though he pitied a poor oppressed and harassed company, considering that oppression will make even a wise man mad, yet he utterly disapproved and detested their singular opinions, and was at pains to reclaim such of them as he had occasion to see. He was then a prisoner, but found favor to get out upon bail at certain times, and had the fairer occasion to commune with several persons of that set, who, by his converse, were brought to a better mind, though some relapsed and smarted for it as he had foretold them. The bulk of that separating people was filled with indignation and the keenest hatred against him, which they expressed by names and in way I love not to repeat: Many of these went to extravagant heights. As to the separating principles about hearing, etc. their native tendency to subvert all Church-communion, even in the purest times, was and is manifest to any who with judgment and without bias consider the matter. He took special notice on these occasions of that memorable and awful fence which the Lord Jesus was pleased to set about his servants whom He has sent forth to speak in his name, viz. ‘He that heareth you,’ says He, ‘heareth Me; and he that despiseth you, despiseth Me; and he that despiseth Me, despiseth Him that sent me,’ Lk. 10:11-16; Mk. 10:11-13, etc. The guilt inwrapped here reaches far. He judiciously remarked that ’tis no small matter at once to despise and reject God, Father, Son and Holy Ghost; and yet a rejecting these whom the Lord has sent imports so much, being upon the matter a tearing the commissions of Christ’s Ambassadors. I think it most observable, for confirmation of this remark, that the body of these separatists had, and expressed the greatest aversion from the most eminent and faithful ministers of Christ, who were not of their mind, whereas they could have been more easily persuaded to comport with others. All centers here, namely, a sameness of sentiment with them as to the extremes to which they declined, was made the necessary condition of Church-communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

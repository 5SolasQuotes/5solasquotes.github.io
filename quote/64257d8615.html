</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a572ba3041" data-kw="">
<blockquote><p>Yet notwithstanding, I allow their constancy which strive for a just cause, being forced against their wills unto contention. I do worthily condemn frowardness which does hinder and stay the holy carefulness of reforming the Church. And as I behave myself gentle and tractable in mean [lowly] things (as external ceremonies), so do I not always judge it profitable to give place to their foolish stoutness which will forsake nothing of their old wonted [accustomed] custom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>William Whittingham, A Brief Discourse of the Troubles begun at Frankfurt in Germany</cite>, 1554, about the Book of Common Prayer &amp; Ceremonies, &amp; Continued by the English Men there to the end of Queen Mary’s Reign [1558] (1574), ‘The Answer &amp; Judgement of… John Calvin… touching the [Service] Book of England’, p. XXXV</span></figcaption>

rmed Books Online</a></div>
</figure><figure class="quote" id="q-8ce7ded970" data-kw="">
<blockquote><p>The committee of the Assembly of Westminster, in their Reply to the Independents, said, If the Church impose anything that is sinful, we must forbear to comply, yet without separation, as was the practice of the puritans in the late times. As to the charge of schism, they admit that difference in judgment, in some particular points, is not schism; nor does an inconformity to some things enjoined deserve that name. But our [Independent] Brethren desire further to set up separate communions, which is a manifest rupture of our societies into others; and is therefore a schism in the Body. This is a setting up altar against altar, allowing our churches, as Independents do, to be true churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d9865f26ad" data-kw="">
<blockquote><p>Since all people have sinned in Adam and have come under the sentence of the curse and eternal death, God would have done no one an injustice if it had been his will to leave the entire ­human race in sin and under the curse, and to condemn them on account of their sin. As the apostle says: “The whole world is liable to the condemnation of God” (Rom. 3:19), “All have sinned and are deprived of the glory of God” (Rom. 3:23), and “The wages of sin is death” (Rom. 6:23).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/reprobation/reprobation-and-the-justice-of-god.html">Reprobation and the Justice of God</a> › <a href="../topics/reprobation/reprobation-and-the-justice-of-god/romans-9-objections-answered.html">Romans 9 objections answered</a></span><span class="t"><a href="../topics/reprobation/condemnation.html">Condemnation</a> › <a href="../topics/reprobation/condemnation/damnation-for-sin.html">Damnation for sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-11dffc7fdb" data-kw="">
<blockquote><p>The will of God is the supreme rule of righteousness, so that everything which he wills must be held to be righteous by the mere fact of his willing it. Therefore, when it is asked why the Lord did so, we must answer, Because he pleased. But if you proceed farther to ask why he pleased, you ask for something greater and more sublime than the will of God, and nothing such can be found.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.23.2</span></figcaption>

</figure><figure class="quote" id="q-9a59ff59bd" data-kw="Reprobation Author of sin Justice">
<blockquote><p>This is the decree of reprobation, which by no means makes God the Author of sin (the very thought of which is blasphemy), but declares Him to be an awful, irreprehensible, and righteous Judge and Avenger thereof.</p></blockquote>

</figure><figure class="quote" id="q-17dce209ac" data-kw="">
<blockquote><p>We give no countenance to the fiction of absolute power, which, as it is heathenish, so it ought justly to be held in detestation by us. We do not imagine God to be lawless. He is a law to himself; because, as Plato says, men laboring under the influence of concupiscence need law; but the will of God is not only free from all vice, but is the supreme standard of perfection, the law of all laws.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.23.2</span></figcaption>

</figure><figure class="quote" id="q-f286efb481" data-kw="">
<blockquote><p>To those who complain about this grace of an undeserved election and about the severity of a just reprobation, we reply with the words of the apostle, “Who are you, O man, to talk back to God?” (Rom. 9:20), and with the words of our Savior, “Have I no right to do what I want with my own?” (Matt. 20:15). We, however, with reverent adoration of these secret things, cry out with the apostle: “Oh, the depths of the riches both of the wisdom and the knowledge of God! How unsearchable are his judgments, and his ways beyond tracing out! For who has known the mind of the Lord? Or who has been his counselor? Or who has first given to God, that God should repay him? For from him and through him and to him are all things. To him be the glory forever! Amen” (Rom. 11:33-36).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 18</span></figcaption>

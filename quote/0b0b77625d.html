<blockquote><p>4. That the promises concerning perseverance (as has been often intimated) are of two sorts. The first, of the continuance of the favor of God to us, which respects our justification. The other, of the continuance of our obedience unto God, which respects our sanctification… … 2. For those of the first sort, which I shall now handle… I shall propose only some few things unto consideration… … 2. That these promises of God do not properly, and as to their original rise, depend on any conditions in believers or by them to be fulfilled, but are the fountains and springs of all conditions whatever that are required to be in them or expected from them; though the grace and obedience of believers are often mentioned in them, as the means, whereby they are carried on according to the appointment of God unto the enjoyment (or continued in it) of what is promised.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Saints’ Perseverance, Explained &amp; Confirmed</cite>, ... (London, 1654), ch. 5, pp. 118-120</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3eaa37cff6" data-kw="">
<blockquote><p>XIII… But, so that we may perceive this more easily and correctly, it must be maintained that: (1) good works, simply, confer entirely nothing to obtain for us the right to eternal life, because that is the pure, unadulterated [Greek; charisma], gift, of God (Rom. 6:23), impetrated by only the righteousness of Christ; but at the same time (2) their presence is required for many reasons, if not before all justification, at least with justification and after it. Hence, three stages of justification should be diligently observed here, namely: (1) Its constitution, wherein a person is first justified. Here is excluded not only the efficacy of good works to procure justification, but even their very presence, insofar as God justifies the sinner (Rom. 3:23) and the ungodly (Rom. 4:5). (2) Its continuation. Here though no efficacy of good works is admitted for justification, yet their presence is required (Gal. 5:6). And in this sense perhaps, James denies that we are justified by faith alone, but requires works in addition (James 2:14, 17–18, 20–22, 24–26). Finally, (3) Its consummation, wherein the right of eternal life conferred in the first stage and continued in the second is advanced also to its possession. Here, not only the presence of good works is required, but also some sort of efficacy of them, insofar at least as God does not will to confer the possession of eternal life, the right of which we already obtain by Christ’s merit alone, except, besides faith, with good works going before (Heb. 12:14; Matt. 7:21; 25:34–36; Rom. 2:7, 10).</p></blockquote>

<blockquote><p>…those [who err] who imagine that a faithful and regenerate man, by committing any crime or grievous sin, does for a sin loose his faith and justification. And of this first assertion there seem also to be two degrees. For when they say that a faithful man by committing a grievous sin does loose his faith, they mean either the act of faith only or the habit [the abiding principle of it] also. If the act only, which is [for the person] to believe [the] remission of [his] sin, and namely of that crime which he has committed, and whereof he has not as yet repented, we acknowledge that that act of faith when a man is fallen into a great sin is interrupted, until he rise again by repentance. But here is their error in that they think, because the act of faith is interrupted, that therefore there is an intercession of justification and reconciliation with God, and a falling from the state of grace and salvation, into the fearful state of damnation. Unless for the qualifying of their opinion they shall say that they speak not of justification in foro caelesti, ‘in the court of heaven,’ but in foro conscientiae, ‘in the court of their conscience,’ and of falling for a time from the assurance of salvation into the guilt of damnation, which if they shall avouch, there shall not need to be any controversy betwixt us. For we do confess that a man cannot be assured of the remission of any crime whilst he continues in it without repentance: and that howsoever there is no condemnation to them that are in Christ Jesus; yet a faithful man by committing any crime incurs the anger of God and provokes his judgments and not only deserves damnation, and is in himself guilty, or contracts the guilt of death, but many times also by the terror and trouble of his own conscience, aggravated partly by afflictions, partly by spiritual desertions and partly by the temptation of Satan, is, in his own opinion, in the state of damnation. But if we will speak properly, justification is to be considered an act of God, for it is God that justifies, and such an act as depends upon his eternal counsel and proceed[s] from his grace given unto us in Christ before all secular times [before the foundation of the world]. For whom He elects, them He calls, and whom He calls according to his purpose, them and no other He justifies, and whom He justifies, them and all them He glorifies. This act of God, which from our effectual vocation is continued to our glorification, is not interrupted, though the act of faith, which is the apprehension of it, be interrupted.</p></blockquote>

</figure><figure class="quote" id="q-8abb1b53b8" data-kw="">
<blockquote><p>We had said, following the apostle and all Scripture, that there is a twofold righteousness of the saints by which they are just before God and men. One is Christ’s, perfect, on which all their hope of God’s grace and salvation and eternal life entirely rests. The other is begun in them by the Spirit of Christ, in which they ought not to trust, because it is always imperfect while they live here and cannot be approved by God except out of his liberal and infinite mercy and the merit of Christ. By this righteousness no one is justified before God with the justification of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludovicus-de-dieu.html">Ludovicus de Dieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions on Romans</cite>, … to which is added, a Gleaning on the rest of the same Apostle’s, as well as the Catholic Epistles (Leiden: Elzeviers, 1646) de Dieu (1590-1642) was a Dutch reformed minister and a leading orientalist. | on Rom. 8:4, pp. 67-73 | He adds on, p. 308:</span></figcaption>

<div class="actions"><button class="copy" data-copy="“We had said, following the apostle and all Scripture, that there is a twofold righteousness of the saints by which they are just before God and men. One is Christ’s, perfect, on which all their hope of God’s grace and salvation and eternal life entirely rests. The other is begun in them by the Spirit of Christ, in which they ought not to trust, because it is always imperfect while they live here and cannot be approved by God except out of his liberal and infinite mercy and the merit of Christ. By this righteousness no one is justified before God with the justification of life.”

— Ludovicus de Dieu, Animadversions on Romans… to which is added, a Gleaning on the rest of the same Apostle’s, as well as the Catholic Epistles (Leiden: Elzeviers, 1646) de Dieu (1590-1642) was a Dutch reformed minister and a leading orientalist. | on Rom. 8:4, pp. 67-73 | He adds on, p. 308:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+had+said%2C+following+the+apostle+and+all+Scripture%2C+that+there+is+a+twofold+righteousness+of+the+saints+by+which+they+are+just+before+God+and+men.+One+is+Christ%E2%80%99s%2C+perfect%2C+on+which+all+their+hope+of+God%E2%80%99s+grace+and+salvation+and+eternal+life+entirely+rests.+The+other+is+begun+in+them+by+the+Spirit+of+Christ%2C+in+which+they+ought+not+to+trust%2C+because+it+is+always+imperfect+while+they+live+here+and+cannot+be+approved+by+God+except+out+of+his+liberal+and+infinite+mercy+and+the+merit+of+Christ.+By+this+righteousness+no+one+is+justified+before+God+with+the+justification+of+life.%E2%80%9D%0A%0A%E2%80%94+Ludovicus+de+Dieu%2C+Animadversions+on+Romans%E2%80%A6+to+which+is+added%2C+a+Gleaning+on+the+rest+of+the+same+Apostle%E2%80%99s%2C+as+well+as+the+Catholic+Epistles+%28Leiden%3A+Elzeviers%2C+1646%29+de+Dieu+%281590-1642%29+was+a+Dutch+reformed+minister+and+a+leading+orientalist.+%7C+on+Rom.+8%3A4%2C+pp.+67-73+%7C+He+adds+on%2C+p.+308%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8abb1b53b8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8abb1b53b8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=We%20had%20said%2C%20following%20the%20apostle,God%20with%20the%20justification%20of%20life&amp;text=We%20had%20said%2C%20following%20the%20apostle%20and%20all&amp;text=justified%20before%20God%20with%20the%20justification%20of%20life" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>‘That being justified by his grace’ If we understand ‘regeneration’ in its strict and ordinary meaning, it might be thought that the apostle employs the word ‘justified’ instead of ‘regenerated;’ and this is sometimes the meaning of it, but very seldom; yet there is no necessity which constrains us to depart from its strict and more natural [forensic] signification. The design of Paul is to ascribe to the grace of God all that we are, and all that we have, so that we may not exalt ourselves proudly against others. Thus he now extols the mercy of God, by ascribing to it entirely the cause of our salvation. But because he had spoken of the vices of unbelievers, it would have been improper to leave out the grace of regeneration, which is the medicine for curing them. Still this does not prevent him from returning immediately to praise divine mercy; and he even mingles both blessings together — that our sins have been freely pardoned, and that we have been renewed so as to obey God. This, at least, is evident, that Paul maintains that “justification,” is the free gift of God; and the only question is, what he means by the word justified. The contest seems to demand that its meaning shall be extended further than to the imputation of righteousness; and in this larger sense it is seldom (as I have said) employed by Paul; yet there is nothing that hinders the meaning of it from being limited to the forgiveness of sins.</p></blockquote>

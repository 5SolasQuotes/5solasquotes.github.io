<main class="wrap"><figure class="quote" id="q-76582d51d5" data-kw="">
<blockquote><p>Various distinct periods of the Old Testament dispensation, are observable. The first period extended from Adam to Noah; in which, the covenant of grace was embraced by faith, and sealed by sacrifices offered up in faith. The death of Messiah, the just One, was prefigured by that of Abel, who was slain by his brother; and his ascension into heaven, was foreshown by the translation of Enoch thither.

The second was from Noah to Abraham. Noah was a preacher of righteousness. By him Christ preached to those spirits which are now in prison. He was also “an heir of the righteousness which is by faith;” was as it were, the head of a new world; and so, was an illustrious type of Him, who as last Adam, “is the head of the church.” A sacrifice of a sweet savour to Jehovah, typical of the sacrifice of Christ, was offered by him. Upon his offering of that sacrifice, a gracious covenant was divinely established with him and his sons and was sealed with the rainbow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), p. 370.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-6ff7788dc1" data-kw="">
<blockquote><p>And then further, Let the consideration of this be of comfort to thee (when thou hast committed sin against God, if thou be’st such a one as hath been spoken of) in remembering the Covenant that God hath made with thee, and bless God for the Covenant that he hath made with thee in Christ, and the difference that God hath made between thee and others in this thing; magnify his free grace in the Covenant of grace, for from thence is it that thy spot shall not be a deadly spot; and God will not deal with thee as with the wicked: certainly this is not from the nature of thy sin, for that may be as heinous as the sins of the other, but that that makes the difference is the free-grace of God in Christ.

O blessed be God for the Covenant of grace that hath made the difference. I remember I have read of Luther, he indeed saith when he was a Monk, though he were Conscientious then, yet then whensoever he committed any sin against God, his Conscience did so fly in his face, that he thought he was rejected utterly of God, till God made him know that Covenant of his grace in Christ; and then he thought he heard such a voice speaking to him, Oh Martin, do not despair, for thou shalt, as long as thou livest here in the flesh, sin against God; only do thou lustily oppose thy sin, and resist thy sin, and then know, that thou art not under the Law, but under grace: It is from hence that there is this difference, therefore bless God that ever he reveal’d this Covenant of grace to thy soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The difference between the spots of the godly and of the wicked preached by Mr. Jeremiah Burroughs at Cripple Gate</cite>, (London, 1668), pp 107-08.</span></figcaption>

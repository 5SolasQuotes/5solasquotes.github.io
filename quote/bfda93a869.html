<main class="wrap"><figure class="quote" id="q-bfda93a869" data-kw="">
<blockquote><p>39. The use of faulty liturgies is no worse than the use of faulty translations of the Holy Scripture, which yet Christ and his apostles ordinarily [and voluntarily] used [i.e. the Septuagint, the Greek translation of the Hebrew Old Testament] (of which I shall say more anon).ª</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | Faulty Liturgies: no Worse than the Apostles’ Use of the Septuagint</span></figcaption>

</figure><figure class="quote" id="q-f034a947f8" data-kw="">
<blockquote><p>V. 11. Where it is told David that in respect he intended to build a house to God, the Lord likewise should make him a house. We see that the Lord will not suffer the good and laudable intentions of the godly to be unrewarded: much more their pious and commendable actions, no, not a cup of cold water given to one of his, which shall want its reward. Which should be a great encouragement to pious and good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-guild.html">William Guild</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Throne of David, or an Exposition of the Second of Samuel</cite>, (d. 1657; Oxford, 1659), on ch. 7:1-18, p. 131</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-01615fa0d0" data-kw="">
<blockquote><p>…it is a great consideration also: I know that Jesus Christ has given his people light in matters of this nature by degrees. Thousands of good souls that have been bred up and born in our assemblies, and enjoy the ordinances of God, and have done it comfortably, cannot suddenly take in other principles, you must wait upon Christ to do it. In this case, men are not to be wrought off by falsehoods [in exaggerations and extreme speaking and positions], God has no need of them. No, rather till men do take in light, you should give them all that is comfortable in the condition they are in; we should acknowledge every good thing in every man, in every church, in every thing, and that is a way to work upon men, and to prevail with them; as it is Philemon, verse 6: ‘That the communication of thy faith may become effectual by the acknowledgment of every good thing, which is in you in Christ Jesus.’ It is that which builds men up, by acknowledgment of every good thing that is in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, 12 vols. (d. 1680; Edinburgh: Nichol, 1861), vol. 1, Exposition of Eph. 1 (1681), sermon 36, on 1:22-23, pp. 558-59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-632ea4b5ed" data-kw="">
<blockquote><p>There may be a partial separation when one ordinance is so corrupted that we cannot join in it and yet can join with the Church in all other acts of communion: and a total separation when either the Church will not suffer us to join with her in any part of her service unless we join in all; or she is so corrupt that we can join with her in nothing that is religious. The former by most wise and sober men is not reckoned such a schism as that any are to be blamed as schismatics on that account;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 10 Rule was a Scottish, divine-right presbyterian., p. 247</span></figcaption>

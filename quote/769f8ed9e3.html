<blockquote><p>‘United to God’ is an ambiguous word: no creature is united to Him perfectly so as to be thereby what He is, God, in the created nature. Only Christ is united to Him hypostatically in his created nature. All are so far united to Him in natural being as that in Him they live and move and have their being: and the Nature of man is one sort of his image: All things are united to Him as effects to their constant efficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes</cite>, ... (London: 1684), pt. 1, ch. 1, p. 1</span></figcaption>

</figure><figure class="quote" id="q-4c5e512b11" data-kw="">
<blockquote><p>And once you have allowed yourself to see the truth that reason leads you to, what reason apprehends is (given the convertibility of the transcendentals) as good and beautiful as it is real. If you find yourself intellectually convinced that there is a divine Uncaused Cause who sustains the world and you in being at every instant, and don’t find this conclusion extremely strange and moving, something that leads you to a kind of reverence, then I dare say you haven’t understood it. Of course, there are those whose heads and hearts are so out of sync that they cannot follow both at the same time. But we shouldn’t mistake this pathology for an insight into human nature.</p></blockquote>

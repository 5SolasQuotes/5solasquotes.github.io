<main class="wrap"><figure class="quote" id="q-e07c50acc4" data-kw="">
<blockquote><p>The singing of Psalms was under the Law, is under the Gospel an Holy Ordinance of God, in right performance whereof, Churches and Christians make heavenly melody in their hearts unto the Lord. Eph. 5:19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stanley-gower.html">Stanley Gower</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Preface’ in John White, David’s Psalms in Metre. Agreeable to the Hebrew, To be sung in usual Tunes. To the benefit of the Churches of Christ. (London, 1655), no page number. John White was a Westminster divine. This psalter only contains the 150 psalms. Both Gower and White were New England puritans in Dorchester, near Boston.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-16fbe9387d" data-kw="">
<blockquote><p>And for singing of David’s Psalms in meter, establisheth a concord in the harmony; and the matter being the same, it is nothing to the lawfulness or unlawfulness of the thing… and for singing psalms (Mt. 26:30; Acts 16:26; Col. 3:16), we have the practice of our Savior Himself, Paul, Silas, and the recommendation of James, and of Paul also; and ’tis reported of Theodorus, that under the cruel persecution of Julius the Apostate, suffered much in martyrdom, and being on the rack, to the amazement of all the beholders, sung psalms most harmoniously; and if there can be any song spiritual, and yet unlawful, why then did Paul admonish us to exhort one another in psalms, and hymns, and spiritual songs? and there can be no song, but there must be meter, for so the word signifies, and therefore take them as songs, our practice is justified. And if you look for more, I refer you to them who have writ largely on this subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-deacon.html">John Deacon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Nayler’s Blasphemies Discovered, or, Several Queries to him proposed with his own answers thereunto (1657), ‘Answer to the 13th Query’, pp. 50-51. Deacon appears to have been a presbyterian (p. 10 &amp; 54) writing against a Quaker, who did not publicly sing praise at all.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“And for singing of David’s Psalms in meter, establisheth a concord in the harmony; and the matter being the same, it is nothing to the lawfulness or unlawfulness of the thing… and for singing psalms (Mt. 26:30; Acts 16:26; Col. 3:16), we have the practice of our Savior Himself, Paul, Silas, and the recommendation of James, and of Paul also; and ’tis reported of Theodorus, that under the cruel persecution of Julius the Apostate, suffered much in martyrdom, and being on the rack, to the amazement of all the beholders, sung psalms most harmoniously; and if there can be any song spiritual, and yet unlawful, why then did Paul admonish us to exhort one another in psalms, and hymns, and spiritual songs? and there can be no song, but there must be meter, for so the word signifies, and therefore take them as songs, our practice is justified. And if you look for more, I refer you to them who have writ largely on this subject.”

psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=And%20for%20singing%20of%20David%E2%80%99s%20Psalms,have%20writ%20largely%20on%20this%20subject&amp;text=And%20for%20singing%20of%20David%E2%80%99s%20Psalms%20in%20meter&amp;text=them%20who%20have%20writ%20largely%20on%20this%20subject" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-36b994a00c" data-kw="">
<blockquote><p>These thanksgivings [the NT ‘evangelical hymns’, or Bible songs, such as the song of Mary, Simeon, etc.] were made by occasion of certain particular benefits, and are no more to be used for ordinary Prayers than the Ave Maria [Hail Mary, used by Papists]. So that both for this cause, and the other before alledged of the Psalms, it is not convenient to make ordinary Prayers of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As quoted by Richard Hooker, Ecclesiastical Polity, Book 5 (1597), section 40 in Works (London, 1676). Hooker gives as the reference: Cartwright, Book 3, p. 208.</cite>, p. 241, margin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-cedac78489" data-kw="">
<blockquote><p>Yea, and Bernard himself, whom Harding brings in as a favorer of his cause herein, saith, That at Bethlehem the common people sang Psalms and Halleluiahs, yea in the fields as they were plowing and mowing, etc.</p></blockquote>

</figure><figure class="quote" id="q-bb319eb0b3" data-kw="">
<blockquote><p>But he is not satisfied that in the Christian Assemblies, in the apostles’ times there were no manner of forms. Who says there were not? There was a form of sound doctrine (which the apostle tells us of), there were Psalms, Hymns, and spiritual Songs in forms, they are the three titles of David’s Psalms; we have nothing to do with any thing but forms of prayer, made by some particular ministers, or Church officers, to be used by all other ministers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges-savoy-conference.html">John Collinges Savoy Conference</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Supplement to a Little Book Entitled, A Reasonable Account why some Pious Nonconforming ministers cannot judge it lawful for them to perform their ministerial acts in public solemn prayer, ordinarily, by the prescribed forms of others… (London, 1680), Section 1, p. 92. Collinges was an English presbyterian; he is writing against a conforming defender of Anglicanism.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>The apostle, 1 Tim. 6:3-5, saying, separate from such, has a two-fold sense: Either such as teach otherwise than the truth fundamentally, and then separate wholly: Or not fundamentally, but erring only in points less than the foundation. And these diversely also: Either presumptuously obstinately, and of a desparate conscience: and then if that apear, separate from such wholly: Or else, erring in simplicity and of oversight, and former preiudice, from such, separate not wholly, but only from the very error or errors, in no wise from their Christian communion and society, seeing these are true Christians. Seing therefore our corruptions of the prelacy and ceremonies be of these latter sort: which thing hitherto you haue not, nor cannot overthrow (and withal you must utterly overthrow Master [Thomas] Cranmer and the rest of the martyrs’ Christianity likewise): Therefore we in England, by the grace of God, are still true Christians: and you ought so to acknowledge us, as you will answer unto God: All which you may do, and yet touch no part of our ecclesiastical corruptions at all, to give allowance unto them: And in all this, there is no contradiction with myself, it is but your distempered conceit, that seems contrary. Neither is our absolute departure from the Papists hereby any whit impeached…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jacob.html">Henry Jacob</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of the Churches &amp; Ministry of England, written in Two Treatises, against the reasons and objections of Master Francis Johnson, and others of the Separation commonly called Brownists</cite>, (Middleburg, 1599), ‘Jacob’s 2nd Reply to the 9th Reason’, pp. 79-80</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>7. A particular Church of any one denomination, may fail in some points of doctrine and manners, and yet continue a living member of the true Church, if it fail not in fundamentals, and things simply necessary to salvation: for the light of truth has its degrees with men, and so has saving grace its intentions and remissions. The moon in the wane is the same which we sometimes see in the full. The Church of Ephesus, lost her first love, Rev: 2:4. The Church of Galatia was transported by false apostles into some dangerous opinions, Gal. 1, etc. The Church of Israel in Elijah’s time had in a great part forsaken the very covenants of God, 1 Kings 19:14, yet were there some names left, 7000 knees which had not bent to Baal. Now though no particular Church is exempt from the censure of the catholic, yet a Church is not presently to be forsaken by particular members thereof for some foul blemishes, nor many wicked men therein, though we must know that God sometimes for such things removes the candlestick from certain places, as from those seven famous Churches of Asia. ‘Tis not the place, but the saints which make the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to the Holy City</cite>, … (Oxford: Robinson, 1651), ch. 7, p. 53</span></figcaption>

</figure><figure class="quote" id="q-9fae10ed87" data-kw="">
<blockquote><p>The God of truth and of peace (which two titles are the most resplendent gems in the crown of God’s glorious attributes) has commanded us to embrace and maintain with equal love and zeal the truth and peace (Zech. 8:19). Since also both these are the legacies of our blessed Saviour, bequeathed to his Church by his Testament, sealed with his blood; certainly every sincere Christian is concerned in both (2 Cor. 4:1); but the stewards of the mysteries of God are yet more deeply engaged in the preservation or restoration of both, to their utmost ability. At present, our amazing and distressing thoughts are great for the divisions of Reuben (to use the words of Deborah, Jud. 5:15) and the spiritual flames of dissension which (like the late dreadful fire in the city) devour the strength and beauty of our Church, call for the assistance of all hands to quench them. But as in a conflagration, while some labor to repress the violence, or stop the course of the spreading fire, others are employed to guard the goods, and, while they stand with aching hearts for the calamity, do good service in perserving their neighbours as well as their own goods from perishing or plunder: so while my brethren, the blessed sons of peace, are hard at work, in drawing water out of the ever-living spring, the Scripture, which plentifully affords the Word of truth and peace, and applying the same for the allaying of these consuming flames (whose endeavours for the peace of Jerusalem I pray God to prosper) I have undertaken to preserve and rescue an important truth concerning justification, from the attempts made by same to corrupt or obscure this heavenly doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-gataker.html">Charles Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Preface in Thomas Gataker, An Antidote Against Error Concerning Justification… (d. 1654; London: Brome, 1670)</span></figcaption>

<blockquote><p>[Margin note:] Which be the principal points of the catholic Faith or religion? Now, because I see some [persons] (not yielding unto these things which we have spoken in general concerning the fundamental or principal points of our religion) again to demand what those should be: I answer: That these articles are to be called grounds or principles, which being laid, the whole building remains: and which being overthrown, all things builded thereupon fall to the ground. And all these things we profess to have been described with great shortness and plainness out of the Word of God in the Creed which they call the Apostles’. Which thing ought to be added to the Ten Commandments and the Lord’s prayer, of the which, that, to wit, the Ten Commandments do very compendiously set out the order of Christian life: and this, that is, the Lord’s Prayer, does very briefly also set out, right invocation and prayer. This (I say) is that fundamental, true and perpetual mark of the catholic Church, which shall never be blotted out unto the world’s end: but which nevertheless ought to be expounded out of the writings of the prophets and apostles, from whence it is taken, that all men may understand it and keep it as much as in them lies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the True &amp; Visible Marks of the catholic Church</cite>, … (London: 1582), n.p.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-3b3366f077" data-kw="">
<blockquote><p>This special Faith the Papists abhor, and scorn; and yet cannot deny, but that true Christians ought to labour for assurance, namely the assurance, not of faith but of hope.

They must have a kind of hope, that their sins be remitted, and that they shall be saved, but they may not believe the remission of their sins, or eternal life, as belonging to themselves. Howbeit all their assurance is merely conjectural and uncertain: Neither can they have any sound assurance of hope, unless first they had assurance of Faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace or An Exposition upon Luke 1. 73.74.75</cite>, (Dublin, 1631), p. 78.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy.html">Assurance, Peace and Joy</a></span></div>

<blockquote><p>Himself he may doubt, — he may doubt his ability to save himself, — he may doubt his power to better his condition, to make himself more worthy and acceptable, but never let him doubt that Christ is all that a poor, lost, convinced sinner wants. Let him not doubt that Jesus is the Friend of sinners, the Savior of sinners, and that he was never known to cast out one who in lowliness and brokenness of heart, sought his compassionate grace.</p></blockquote>

</figure><figure class="quote" id="q-54b84f2d43" data-kw="">
<blockquote><p>It would spirit our faith, when we shall see his blood confirming an everlasting covenant, wherein God promises to be gracious. All the promises centred in the cross, received their life from his death, and are from thence reflected on us. Where can faith find a vigour but in the royalties of mercy, displayed in the satisfaction of justice? Where can it find a life, but in the views of its proper object?

When we behold a Christ crucified, how can we distrust God, that hath in that, as a plain tablet, writ this language, that he will spare nothing for us, since he hath not spared the best he had. What greater assurance can he give? Where is there anything in heaven or earth that can be a greater pledge of his affection?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Knowledge of Christ Crucified</cite>, (1684) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 505.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy.html">Assurance, Peace and Joy</a></span></div>

</figure><figure class="quote" id="q-05b741b71d" data-kw="">
<blockquote><p>Concerning this preservation of the elect to salvation and the true perseverance of faith in the faithful, they can be certain according to the measure of faith, which they believe makes them true and enduring members of the Church, having forgiveness of sins and eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘On Justifying Faith’, pt. 1, pp. 142-45, 171-75 Latin | CXXXIX. From the doctrine of these British theologians, whose views influenced the drafting of the Canons of the Synod of Dort and whose judgment was included in the Synod’s Acts, one can infer how justified the learned man is who critiques my theses for presenting the Synod’s words as if it had determined that the assurance believers have of their grace and personal salvation is of the same nature, firmness, and necessity as the divine faith with which we assent to the immediately revealed articles of faith. The learned man draws this conclusion from the words found in the fifth chapter on doctrine, article nine, which states:</span></figcaption>

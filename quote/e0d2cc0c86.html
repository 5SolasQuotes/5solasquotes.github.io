</figure><figure class="quote" id="q-181b24d352" data-kw="">
<blockquote><p>Question 9 [to objectors]: Should we not in doubtful cases take the safer side? And is it not safer to do as Christ and his apostles and his Church for many hundred years did, than to follow the novelties of later times? Is it not certain that where there is no law, there is no transgression? and I know of no law binding us to receive kneeling: therefore for my part I cannot fear that Christ will condemn me for following his own, his apostles’ and his Church’s example, when he never gave me a word to the contrary. Objection: If Christ’s example bind to sit, then you must also imitate Him in doing it in an upper room, and but to twelve, etc. Answer:

1. This objection is nothing to our question. For we be not affirming that sitting is necessary, but that it is certainly lawful, and that kneeling is not such a duty, as that men should refuse communion with a church for want of it.

2. Both the known reasons of the thing, and the after practices of the Church do assure us that Christ’s administering in an upper room, and but to twelve, and not to women, were all occasional and mutable; and the Churches did otherwise: But for a feasting gesture there is no such proof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653), ‘Objections Answered’, pp. 91-92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>
<div class="actions"><button class="copy" data-copy="“Question 9 [to objectors]: Should we not in doubtful cases take the safer side? And is it not safer to do as Christ and his apostles and his Church for many hundred years did, than to follow the novelties of later times? Is it not certain that where there is no law, there is no transgression? and I know of no law binding us to receive kneeling: therefore for my part I cannot fear that Christ will condemn me for following his own, his apostles’ and his Church’s example, when he never gave me a word to the contrary. Objection: If Christ’s example bind to sit, then you must also imitate Him in doing it in an upper room, and but to twelve, etc. Answer:

</figure><figure class="quote" id="q-d8fcc4f03a" data-kw="">
<blockquote><p>This book explores the emergence and development of the extra Calvinisticum in the Reformed tradition by tracing its first exposition from Ulrich Zwingli to early Reformed orthodoxy. Rather than being an ancillary issue, the questions surrounding the extra Calvinisticum were a determinative factor in the differentiation of Magisterial Protestantism into rival confessions. …Over time, Reformed theologians, such as Peter Martyr Vermigli and Antione de Chandieu, articulated the extra Calvinisticum with increasing rigor by incorporating conciliar christology, the church fathers, and scholastic methodology to address the polemical needs of engagement with Lutheranism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/k-j-drake.html">K.J. Drake</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Etiam extra carnem</cite>, (Oxford Univ. Press, 2021)</span></figcaption>

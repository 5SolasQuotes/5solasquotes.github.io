<main class="wrap"><figure class="quote" id="q-161a0b6225" data-kw="">
<blockquote><p>Forasmuch then as our turning away from God is our own act, and this is evil will; but our turning to God is not possible, except He rouses and helps us, and this is good will, — what have we that we have not received? But if we received, why do we glory as if we had not received? Therefore, as “he that glorieth must glory in the Lord,” it comes from His mercy, not their merit, that God wills to impart this to some, but from His truth that He wills not to impart it to others.

For to sinners punishment is justly due, because “the Lord God loveth mercy and truth,” and “mercy and truth are met together;” and “all the paths of the Lord are mercy and truth.” And who can tell the numberless instances in which Holy Scripture combines these two attributes? Sometimes, by a change in the terms, grace is put for mercy, as in the passage, “We beheld His glory, the glory as of the Only-begotten of the Father, full of grace and truth.” Sometimes also judgment occurs instead of truth, as in the passage, “I will sing of mercy and judgment unto Thee, O Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Merits and Forgiveness of Sins. And on the Baptism of Infants</cite>, (412), 2.31 in Nicene and Post-Nicene Fathers 1, 5: 56-57.</span></figcaption>

ank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-22d49744d1" data-kw="">
<blockquote><p>Question 9. Whether every will of God is fulfilled? Denied with a distinction. Answer: Concerning the will properly taken, or of good-pleasure [beneplaciti]: affirmed, Isa. 46:10. Concerning the will taken metonymically, or of command [mandati]: denied. And this opinion is insinuated by Thomas, in [Summa] pt. 1, question 19, article 6, where he disputes that every will of God is always fulfilled, together with article 11, where he distinguishes the will into [the will] of the sign and [the will] of good-pleasure. … Question 11. By what will can anyone justly will that which God does not will? Explained. Answer: We thus explain it: by a right will, which is conformable to the law and general command of God, one can will that which God does not will by the will of good-pleasure, or the hidden [will]. See Gen. 22, compared with Heb. 11:17 and 2 Sam. 7:2-3, 13. Question 12, Whether the precepts of God sometimes differ from his will? Affirmed with a distinction. Answer: In the proximate object they differ: for of the precept, or command, there can be another object—and indeed an opposite one—than [that] of the will or good-pleasure. As is manifest, Gen. 22, where the proximate object of the divine command given to Abraham was the slaying [mactatio] of Isaac; and the object of the good-pleasure, or of the divine will properly so called, was the non-slaying of the same. But although the objects of the will of command and of good-pleasure are opposed among themselves, yet the acts of command and of will are not opposed, but the former is subordinated to the latter. For God, by the will of good-pleasure, willed the command, or to command Abraham; but He did not will the thing commanded to Abraham, or the fulfillment of the commanded thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5</cite>, (Utrecht, 1669) tr. AI by Roman Prestarri Latin</span></figcaption>

<blockquote><p>In the next place you [Thomas Jackson, an Arminian] touch upon a distinction much talked of, and as much advanced by some as cried down by others. Yet both Scotus and Durandus give a tolerable, and Aquinas with the Dominicans after him, an orthodox interpretation thereof, though neither suitable to the mind of [John] Damascene, commonly reputed the father of it. Yet look what in this kind is wanting in them is supplied by [Gregory] Arminiensis, who gives both an orthodox construction thereof, and that also in conformity to the opinion of Damascene, of whose text he gives a very sound and orthodox interpretation and the more orthodox the more opposite to their constructions who, with great cry of words draw it to the countenancing of their Arminian tenets without cause. Love, you say, is the fruit of God’s antecedent will, wrath and severity are the proper effects of his consequent will. Fruit and effect you make all one (as with good reason you may). Now what, I pray you, is this effect which you call love? You seem to intimate that they are the effects of creation, as when you say, ‘Every particular faculty of soul or body is a pledge undoubted of God’s love.’ Yet faculties of souls and bodies are found in beasts, but God’s antecedent will in Damascene is referred wholly unto men. Neither does Damascene at all refer it to the work of creation, but makes it to be that whereby God will have all to be saved. Liberty of will is proper to man in distinction from beasts, but who sees not that this indifferently makes him obnoxious unto damnation as well as capable of salvation? Then when you say wrath and severity is the effect of God’s consequent will, what do you mean by ‘wrath’? Is it either a resolution to take vengeance, or the execution of vengeance itself? I think you take it for the execution of vengeance itself. Now there is an execution of reward also properly opposite unto this which, whether it be the same love you speak of, it became you to express so much, or whether you conceive it to be different, yet it were fit you should take notice of it and acknowledge that this is a fruit of God’s consequent will as well as wrath; that as effectually presupposing obedience, as this disobedience: and that love in rewarding is every way as infallibly consequent to the obeying of God’s will revealed as wrath is of our neglecting and despising it. A full explication of this distinction you promise in good time; how well you perform it we may in good time consider with God’s help. Next you enter upon another form of the same distinction (as you pretend) and you suffer it to fly with one wing, for you talk of God’s absolute will (which you seem to confound with God’s antecedent will), but as touching the member congruously opposite, you leave us to seek for that. But as it is we are to consider it: God’s absolute will was (you say) to have men capable of Heaven and Hell, of joys and miseries immortal. This cannot be understood of God’s consequent will; for this absolute will is indifferent to end in the bestowing of reward or punishment, and is immediately terminated only in making man capable of either; but his consequent will is not so indifferent. For the only effect thereof you mention to be wrath and severity, and this presupposes rather than causes capableness. Neither can this absolute will be the antecedent will of God according to Damascene’s meaning. For the antecedent will in Damascene is only referred to the will of God, whereby He wills man’s salvation: but this absolute will is (you say) to have men capable of Heaven and Hell. To help this, you tell us that this absolute will (whose possible objects are two) is in the first place set on man’s eternal joy. But you do not proceed to show on what it is set in the next place, as if by such like incongruities you desired rather to confound your reader [rather] than to satisfy him. Yet by the tenor of your discourse you leave it to us to guess that in the second place, to wit upon the despising of God’s love, it is set upon a man’s damnation. So that by this your doctrine, both God’s antecedent will and consequent will is all one, and that is God’s absolute will. But no such thing is found in Damascene, from whom, such as you are, do usually take this distinction of will antecedent in God and will consequent: And indeed you do well to make one as absolute as another; for like as wrath, the fruit of this will of God in the second place (as you imply) has not its course but upon presupposition of disobedience; so in like manner, the proper opposite to wrath on the other side, the fruit of this will of God in the first place, has not its course but upon presupposition of obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discovery of Dr. Jackson’s Vanity</cite>, … (Amsterdam: Thorp, 1631), pp. 677-80</span></figcaption>

9%3F+Is+it+either+a+resolution+to+take+vengeance%2C+or+the+execution+of+vengeance+itself%3F+I+think+you+take+it+for+the+execution+of+vengeance+itself.+Now+there+is+an+execution+of+reward+also+properly+opposite+unto+this+which%2C+whether+it+be+the+same+love+you+speak+of%2C+it+became+you+to+express+so+much%2C+or+whether+you+conceive+it+to+be+different%2C+yet+it+were+fit+you+should+take+notice+of+it+and+acknowledge+that+this+is+a+fruit+of+God%E2%80%99s+consequent+will+as+well+as+wrath%3B+that+as+effectually+presupposing+obedience%2C+as+this+disobedience%3A+and+that+love+in+rewarding+is+every+way+as+infallibly+consequent+to+the+obeying+of+God%E2%80%99s+will+revealed+as+wrath+is+of+our+neglecting+and+despising+it.+A+full+explication+of+this+distinction+you+promise+in+good+time%3B+how+well+you+perform+it+we+may+in+good+time+consider+with+God%E2%80%99s+help.+Next+you+enter+upon+another+form+of+the+same+distinction+%28as+you+pretend%29+and+you+suffer+it+to+fly+with+one+wing%2C+for+you+talk+of+God%E2%80%99s+absolute+will+%28which+you+seem+to+confound+with+God%E2%80%99s+antecedent+will%29%2C+but+as+touching+the+member+congruously+opposite%2C+you+leave+us+to+seek+for+that.+But+as+it+is+we+are+to+consider+it%3A+God%E2%80%99s+absolute+will+was+%28you+say%29+to+have+men+capable+of+Heaven+and+Hell%2C+of+joys+and+miseries+immortal.+This+cannot+be+understood+of+God%E2%80%99s+consequent+will%3B+for+this+absolute+will+is+indifferent+to+end+in+the+bestowing+of+reward+or+punishment%2C+and+is+immediately+terminated+only+in+making+man+capable+of+either%3B+but+his+consequent+will+is+not+so+indifferent.+For+the+only+effect+thereof+you+mention+to+be+wrath+and+severity%2C+and+this+presupposes+rather+than+causes+capableness.+Neither+can+this+absolute+will+be+the+antecedent+will+of+God+according+to+Damascene%E2%80%99s+meaning.+For+the+antecedent+will+in+Damascene+is+only+referred+to+the+will+of+God%2C+whereby+He+wills+man%E2%80%99s+salvation%3A+but+this+absolute+will+is+%28you+say%29+to+have+men+capable+of+Heaven+and+Hell.+To+help+this%2C+you+tell+us+that+this+absolute+will+%28whose+possible+objects+are+two%29+is+in+the+first+place+set+on+man%E2%80%99s+eternal+joy.+But+you+do+not+proceed+to+show+on+what+it+is+set+in+the+next+place%2C+as+if+by+such+like+incongruities+you+desired+rather+to+confound+your+reader+%5Brather%5D+than+to+satisfy+him.+Yet+by+the+tenor+of+your+discourse+you+leave+it+to+us+to+guess+that+in+the+second+place%2C+to+wit+upon+the+despising+of+God%E2%80%99s+love%2C+it+is+set+upon+a+man%E2%80%99s+damnation.+So+that+by+this+your+doctrine%2C+both+God%E2%80%99s+antecedent+will+and+consequent+will+is+all+one%2C+and+that+is+God%E2%80%99s+absolute+will.+But+no+such+thing+is+found+in+Damascene%2C+from+whom%2C+such+as+you+are%2C+do+usually+take+this+distinction+of+will+antecedent+in+God+and+will+consequent%3A+And+indeed+you+do+well+to+make+one+as+absolute+as+another%3B+for+like+as+wrath%2C+the+fruit+of+this+will+of+God+in+the+second+place+%28as+you+imply%29+has+not+its+course+but+upon+presupposition+of+disobedience%3B+so+in+like+manner%2C+the+proper+opposite+to+wrath+on+the+other+side%2C+the+fruit+of+this+will+of+God+in+the+first+place%2C+has+not+its+course+but+upon+presupposition+of+obedience.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+A+Discovery+of+Dr.+Jackson%E2%80%99s+Vanity%2C+%E2%80%A6+%28Amsterdam%3A+Thorp%2C+1631%29%2C+pp.+677-80&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdd4ecb3709.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dd4ecb3709.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=In%20the%20next%20place%20you%20%5BThomas,course%20but%20upon%20presupposition%20of%20obedience&amp;text=In%20the%20next%20place%20you%20%5BThomas%20Jackson%2C%20an&amp;text=not%20its%20course%20but%20upon%20presupposition%20of%20obedience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></d <blockquote><p>Of love, mercy, and grace, the condition is something otherwise: principally they denote God’s essential goodness and kindness, which is eminent amongst his infinite perfections; and secondarily the effects thereof… The apostle tells us that God is “blessed forever,” Rom. 9:5; “He is the blessed and only Potentate,” 1 Tim. 6:15; ‘God all-sufficient’ Gen. 17:1. That which is inconsistent with absolute blessedness and all-sufficiency is not to be ascribed to God; to do so casts him down from his excellency. But can He be blessed, is He all-sufficient who is tossed up and down with hope, joy, fear, sorrow, repentance, anger, and the like?</p></blockquote>

<blockquote><p>The doctrine of divine simplicity has fallen on hard times in Reformed circles, which is largely owing to the lack of emphasis placed on this subject in the late 19th and early 20th centuries. One theologian who continued to hold the line on the subject was the Dutch-American theologian, Herman Hoeksema.

In accordance with the Thomistic-Reformed position on divine simplicity, he reminded us that the divine attributes were identical with the simple divine essence, and so identical with one another:

His virtues are … identical with that Essence, so are all His virtues one in Him. For even though we do not and cannot comprehend this simple divine Essence … this does not alter the fact that all God’s virtues are one in Him. Hence, His righteousness is His mercy, His holiness is His grace, His truth is His love. And therefore, this eternal Being, this independent, simple Essence that is called God is also the Immutable, in Whom there is no variableness, neither shadow of turning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-hoeksema.html">Herman Hoeksema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, (Grand Rapids: Reformed Free Publishing Association, 1966), p. 36.</span></figcaption>

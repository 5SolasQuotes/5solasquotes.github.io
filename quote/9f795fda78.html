<main class="wrap"><figure class="quote" id="q-9f795fda78" data-kw="">
<blockquote><p>Giving and not granting that they [the Jerusalem Christians] were all convened to prayer [in Acts 4:31], it does not follow that they did meet ordinarily in one place for partaking of Word and sacraments as one congregation, for more might convene to prayer and hearing the Word than could meet ordinarily in a congregational-way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (1644), pt. 1</cite>, p. 431</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-739cd44fcb" data-kw="">
<blockquote><p>1. The word ‘church’ [say the Independents] signifies always a gathered together church, or such as may gather together, Acts 11:26, a whole year they assembled with the Church, Acts 20:7, the disciples came together to break bread; so Acts 1:10; 2:44,46; Acts 5:12; 15:25. [Rutherford’s] Answer: [1.] Our brother Mr. [George] Gillespie (Assertion of the Government of the Church of Scotland, pt. 2, ch. 3, p. 141-42) says many interpreters expound [in Greek], ‘they were together’, that is, of one accord in love and amity: and also [physical] churches not being builded, and they meeting in private houses, as in Mary’s house, Acts 12, school of Tyrranus, Acts 19:9, in an upper chamber, Acts 20:8, Paul’s lodging at Rome, Acts 28:13. What private houses (Acts 10:9) could ordinarily contain so many thousands? 2. The Scripture speaks so [as] to give us an example of the public meeting for public worship where it is not needful that all met in one place collectively; it is enough they meet all distributively. 3. Neither does the word ‘church’ always signify a meeting of one single congregation, as Acts 12:5; prayers were made [for Peter in jail] by the church, that is by all professors [throughout Jerusalem]. Herod vexed the church, Acts 8:3. Saul made havoc of the church; ‘I persecuted the Church.’ (1 Cor. 15:9) There is no necessity to expound these of people meeting ordinarily to worship God; for Herod and Saul persecuted all, whither apostles or professors in houses, not respecting their meeting in one place; Also [that] it shall follow that prayers were not made in private, but only in the church, that is, in the convened congregation for Peter, which is absurd: And that they were a visible-church is clear, else Herod and Saul could not persecute them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea… (1642), ch. 7, ‘If there be No True Visible Church in the New Testament, but Only a Congregation Meeting in One Place, &amp; No Presbyterial or Representative Church (as They Call it) at All’, p. 81 Rutherford is arguing against the novel Independent Church government. See also the chapter at large.</cite></span></figcaption>

</figure><figure class="quote" id="q-904755a747" data-kw="">
<blockquote><p>Objection 17: But the particulars of your [Westminster] Directory of worship are not in Scripture, how then can the magistrate punish for not following the Directory? Answer: That there should be prayers, preaching, reading, praising of God, sacraments in the public worship, is evident by the Scripture, but for the ordering of these worships secundum prius &amp; posterius [according to what is first and that which follows] the words of prayer (so they be according to the pattern of sound doctrine) the Preface of the Directory is clear, that no man is therein to be compelled, though to transgress the Holy Ghost’s express order in the celebration of the Lord’s Supper and to break bread and eat first, and that before any of the words of institution be mentioned, or any blessing of the elements, must be a manifest breach of the directory of Jesus Christ which sure holds forth to us a twofold ordering of acts of worship, one divine, which we must peremptorily follow, another prudential and human in circumstances which concern both the worship of God and civil assemblies, as time, place, persons, etc. and in the latter we are no further to be commanded in point of uniformity than the general rules of the Word lead us; and compulsion, where God has no compelling commandment going before in an exact uniformity, we utterly disclaim, nor can men, or Church, or all the assemblies on earth make laws in matters of God’s worship where the Supreme Lawgiver has made none, and the Preface of the Directory is so clear in this that we trust we shall quickly agree with the godly and sound in judgment in this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (London, 1649)</cite>, pp. 372-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-0444e8a231" data-kw="">
<blockquote><p>For what synods determine, being the undeniable Word of God, is intrinsically infallible, and can never become fallible, though fallible and sinful men that are obnoxious [liable] to error and mistakes do hold it forth ministerially to others: and it is false that we are to believe that what synods determine according to the Word of God, we are to believe it is fallible and liable to error, and may [be] an untruth because they so determine; for then, when a synod determines [that] ‘there is but one true God,’ this principle of faith is believed to be subject to retraction and falsehood, because a synod has determined it to be a truth. But the truth is, we are to believe truths, determined by synods, to be infallible, and never again liable to retraction or discussion, because they are, and were in themselves and without any synodical determination, infallible, but not for this formal medium, because so says the synod, but because so says the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (1649), ch. 2</cite>, p. 36</span></figcaption>

<blockquote><p>XV… 1. As the holy blessing, whose formula is found in Numbers 6, is an invocation of God, from whom all good things are desired for those who receive the blessing, so too is the Christian salutation a prayer, a form of invocation, through which, by faith and charity, we earnestly pray for the best things for others. 2. It is also a support for fellowship and an indication of charity. 3. And it should be done especially for the Holy Church, devout families, and individual believers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1 (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</cite></span></figcaption>

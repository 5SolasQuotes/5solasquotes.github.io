<blockquote><p>V. The covenant of nature is that which God the Creator made with innocent man as his creature, concerning the giving of eternal happiness and life under the conditions of perfect and personal obedience. It is called “natural,” not from natural obligation (which God does not have towards man it is also called “legal” because the condition on man’s part was the observation of the law of nature engraved within him; and of works because it depended upon works or his proper obedience.

XIV. Although man was already bound to this obedience by a natural obligation as a rational creature, necessarily subject to the dominion of God and his law, yet he was more strongly bound by a federal obligation which God so stipulated that man–by the powers received in creation–could perform it, although in order that he might actually perform it, he still needed the help of God both to actuate these faculties and powers and to preserve them from change. This help did not tend to the infusion of any new power but only to exercising the efficacy of that power which he had received. Now this did not belong properly to the covenant of nature, but always depended on the most free good pleasure (eudokia) of God; Otherwise the covenant of nature has been immutable, And man had never sinned.

XV. The sanction of the covenant attended the exaction of duty. It consisted both in the promise of reward and gain and in the threatening of punishment. The promise was of the highest happiness (of eternal life) to be passed not on earth but in heaven. The threatening was of death and whatever in scripture comes under the name of death to express punishment of all kinds (into which man by his own sin deservedly fell). XVI. However, from this pact arises the mutual obligation of the parties, differing according to their condition. With respect to man, not only was it from the pact, but absolute and simple from the nature of the thing (and on account of God, to whom man as a creature to the Creator, the beneficiary to the Benefactor, owed himself wholly and whatever he had to God and was bound to love him with his whole heart). But with respect to God, it was gratuitous, as depending upon a pact or gratuitous promise (by which God was bound not to man, but to himself and to his own goodness, fidelity and truth, Rom. 3:3; 2 Tim 2:13). Therefore there was no debt (properly so called) from which man could derive a right, but only a debt of fidelity, arising out of the promise by which God demonstrated his infallible and immutable constancy in truth. If the apostle seems to acknowledge this right or debt (Rom. 4:4), it must be understood in no other than a respective sense; not as to the proportion and condignity of the duty rendered to God by man (Rom. 8:18; Lk. 17:10), but to the pact of God and justice (i.e., the fidelity of him making it). XVII. If therefore upright man in that state had obtained this merit, it must not be understood properly and rigorously. Since man has all things from and owes all to God, he can seek from him nothing as his own by right, nor can God be a debtor to him–not by condignity of work and from its intrinsic value (because what ever that may be, it can bear no proportion to the infinite reward of life), but from the pact and the liberal promise of God (according to which man had the right of demanding the reward to which God had of his own accord bound himself) and in comparison with the covenant of grace (which rests upon the sole merit of Christ, by which he acquired for us the right to life). However, this demanded antecedently a proper and personal obedience by which he obtained both his own justification before God and life, as the stipulated reward of his labors.</p></blockquote>

<blockquote><p>VII. Second, a law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life (by which it was sealed) and from the threatening of death (which by reason of contraries had the implied promise of life and from the various passages of Scripture which express more clearly the nature and sanction of the law, as Lev. 18:5—“If a man do these, he shall live in them,” cf. Dt. 27:26; Ezk. 20:11; Mt. 19:17; Gal. 3:12)</p></blockquote>

<blockquote><p>1. Of God’s Covenant of Works, with the First Adam, and his natural seed before the fall. APHORISM I. GOD was pleased to enter into covenant with the first Adam, before his fall. Under the term, Adam, Scripture sometimes comprehends both sexes, both Adam and his wife. And if any shall contend that God entered into covenant with both Adam and we at once, as the complete root of mankind, I shall not much gainsay: and yet this will not so easily be proved, nor know I any inconvenience that would follow, should it be denied, the woman coming of Adam as well as any of his posterity. Nor am I ignorant that some are of opinion, that Adam received the covenant alone, and was to teach it, and did teach it to his wife, which opinion hath the more weight, because when God forbids the Eating of the tree of knowledge under pain of death, (wherein the promise of life contrariwise is implied,) he speaks only in the singular number, viz. to Adam only. But how may it be evidenced, That God entered into covenant with the first Adam, even into a Covenant of Works, before the Fall? Answ. Though it be not positively and plainly said in Scripture, that God gave Adam a Covenant of Works, before his fall: and though the characters and footsteps of this covenant are not so expressly discovered in Holy Writ, as of some others; yet notwithstanding, upon sundry Scripture-grounds and considerations, it may be evinced sufficiently. As, From the Inscription of the Covenant of Works in Adam’s heart. Before the Fall God wrote the Covenant of Works, viz. The Substance of the Moral Law, perfectly in Adam’s heart; and in so doing, entered into Covenant with him. Here are three thing in this Position to be cleared; viz. That the Moral Law is the Covenant of Works. That this Moral Law was perfectly written in Adams heart before the Fall. That God in Writing the Moral Law in his heart, entered into Covenant of Works with him.

1. That the Moral Law (abstractly and precisely in its self considered, without the additionals, viz. the preface, ceremonial law, &amp;c. jointly promulgated with it in Horeb) is the Covenant of Works is manifest; (1) Because, the Moral Law (by which is the knowledge of sin, and which works wrath) is styled by the Apostle “The Law of works,” and is set in opposition to “The Law of Faith.” Now this Law of Works, and Law of Faith, amount in effect to as much as the Covenant of works, and Covenant of Faith. (2) Because Righteousness and life were at first by the Moral Law, and should have been so still, had not the Law become unable to give Righteousness and life, in that it was weak through the flesh, man through Sin being unable to keep it. Now the Law, requiring obedience, and promising life upon that condition, must needs be a covenant, and that a Covenant of Works: Works being the proper Condition of it.

2. That this Moral Law for Substance was perfectly written in Adams heart before the Fall, is certain; (1) Because, Man was made in God’s image upright, and perfect. And consequently was thoroughly furnished with all accomplishments of upright and perfect Humane nature: and particularly with the Moral Law, that Law of Nature; The substance whereof was engraved both in his mind, by natural light, knowing it; and in his will, by natural integrity conforming unto it. (2) Because, The Work of the Law remains imperfectly written in some dim characters in the very hearts of pagans and heathens since the fall; They doing by nature the things contained in the Law, and being a Law unto themselves, without the Law of God written. Whence we may strongly conclude that much more before the fall the Moral Law was perfectly written in Adam’s heart, there being in him no sin to deface it in the least degree.

3. That, God, in writing the Moral Law in Adam’s heart, entered into Covenant of Works with him. viz. by real impressions upon his heart: though not by verbal expressions to the ear. For by this Law written in Adam’s heart, he had laid before him, what obedience was required and assented to on Adam’s part: And what recompense should be performed on God’s part. And this was at least an implicit, if not an explicit, covenanting. 2. From God’s express prescription of a positive Law unto Adam in his innocent State. God’s positive Law is laid down in these words, “And the LORD God commanded the man, saying, of every Tree of the Garden you may freely eat: But of the Tree of the Knowledge of good and evil, you shall not eat of it; for in the day that you eat thereof thou shall surely die.” Here are parties covenanting, and agreeing upon terms, viz. God and Adam: Here are also terms agreed upon and matters covenanted reciprocally by these parties; Adam on his part was to be obedient to God, in forbearing to Eat of the Tree of Knowledge only: God on his part, for present, permits Adam to eat of all other Trees of the Garden; And for future (in his explicit threatening of death in case of disobedience,) implicitly promises life in case of obedience herein. Now where there are parties covenanting and agreeing upon terms: And terms mutually agreed upon by those parties, as here; there’s the substance of an express covenant, though it be not formally and in express words called a covenant.</p></blockquote>

— Francis Roberts, The Mystery And Marrow Of The Bible, (London, 1657), 19–21 [Spelling and punctuation modernized].">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Of+God%E2%80%99s+Covenant+of+Works%2C+with+the+First+Adam%2C+and+his+natural+seed+before+the+fall.+APHORISM+I.+GOD+was+pleased+to+enter+into+covenant+with+the+first+Adam%2C+before+his+fall.+Under+the+term%2C+Adam%2C+Scripture+sometimes+comprehends+both+sexes%2C+both+Adam+and+his+wife.+And+if+any+shall+contend+that+God+entered+into+covenant+with+both+Adam+and+we+at+once%2C+as+the+complete+root+of+mankind%2C+I+shall+not+much+gainsay%3A+and+yet+this+will+not+so+easily+be+proved%2C+nor+know+I+any+inconvenience+that+would+follow%2C+should+it+be+denied%2C+the+woman+coming+of+Adam+as+well+as+any+of+his+posterity.+Nor+am+I+ignorant+that+some+are+of+opinion%2C+that+Adam+received+the+covenant+alone%2C+and+was+to+teach+it%2C+and+did+teach+it+to+his+wife%2C+which+opinion+hath+the+more+weight%2C+because+when+God+forbids+the+Eating+of+the+tree+of+knowledge+under+pain+of+death%2C+%28wherein+the+promise+of+life+contrariwise+is+implied%2C%29+he+speaks+only+in+the+singular+number%2C+viz.+to+Adam+only.+But+how+may+it+be+evidenced%2C+That+God+entered+into+covenant+with+the+first+Adam%2C+even+into+a+Covenant+of+Works%2C+before+the+Fall%3F+Answ.+Though+it+be+not+positively+and+plainly+said+in+Scripture%2C+that+God+gave+Adam+a+Covenant+of+Works%2C+before+his+fall%3A+and+though+the+characters+and+footsteps+of+this+covenant+are+not+so+expressly+discovered+in+Holy+Writ%2C+as+of+some+others%3B+yet+notwithstanding%2C+upon+sundry+Scripture-grounds+and+considerations%2C+it+may+be+evinced+sufficiently.+As%2C+From+the+Inscription+of+the+Covenant+of+Works+in+Adam%E2%80%99s+heart.+Before+the+Fall+God+wrote+the+Covenant+of+Works%2C+viz.+The+Substance+of+the+Moral+Law%2C+perfectly+in+Adam%E2%80%99s+heart%3B+and+in+so+doing%2C+entered+into+Covenant+with+him.+Here+are+three+thing+in+this+Position+to+be+cleared%3B+viz.+That+the+Moral+Law+is+the+Covenant+of+Works.+That+this+Moral+Law+was+perfectly+written+in+Adams+heart+before+the+Fall.+That+God+in+Writing+the+Moral+Law+in+his+heart%2C+entered+into+Covenant+of+Works+with+him.+1.+That+the+Moral+Law+%28abstractly+and+precisely+in+its+self+considered%2C+without+the+additionals%2C+viz.+the+preface%2C+ceremonial+law%2C+%26c.+jointly+promulgated+with+it+in+Horeb%29+is+the+Covenant+of+Works+is+manifest%3B+%281%29+Because%2C+the+Moral+Law+%28by+which+is+the+knowledge+of+sin%2C+and+which+works+wrath%29+is+styled+by+the+Apostle+%E2%80%9CThe+Law+of+works%2C%E2%80%9D+and+is+set+in+opposition+to+%E2%80%9CThe+Law+of+Faith.%E2%80%9D+Now+this+Law+of+Works%2C+and+Law+of+Faith%2C+amount+in+effect+to+as+much+as+the+Covenant+of+works%2C+and+Covenant+of+Faith.+%282%29+Because+Righteousness+and+life+were+at+first+by+the+Moral+Law%2C+and+should+have+been+so+still%2C+had+not+the+Law+become+unable+to+give+Righteousness+and+life%2C+in+that+it+was+weak+through+the+flesh%2C+man+through+Sin+being+unable+to+keep+it.+Now+the+Law%2C+requiring+obedience%2C+and+promising+life+upon+that+condition%2C+must+needs+be+a+covenant%2C+and+that+a+Covenant+of+Works%3A+Works+being+the+proper+Condition+of+it.+2.+That+this+Moral+Law+for+Substance+was+perfectly+written+in+Adams+heart+before+the+Fall%2C+is+certain%3B+%281%29+Because%2C+Man+was+made+in+God%E2%80%99s+image+upright%2C+and+perfect.+And+consequently+was+thoroughly+furnished+with+all+accomplishments+of+upright+and+perfect+Humane+nature%3A+and+particularly+with+the+Moral+Law%2C+that+Law+of+Nature%3B+The+substance+whereof+was+engraved+both+in+his+mind%2C+by+natural+light%2C+knowing+it%3B+and+in+his+will%2C+by+natural+integrity+conforming+unto+it.+%282%29+Because%2C+The+Work+of+the+Law+remains+imperfectly+written+in+some+dim+characters+in+the+very+hearts+of+pagans+and+heathens+since+the+fall%3B+They+doing+by+nature+the+things+contained+in+the+Law%2C+and+being+a+Law+unto+themselves%2C+without+the+Law+of+God+written <blockquote><p>When God expelled man from paradise “lest man put forth his hand, and take also of the tree of life, and eat, and live for ever” (Gen. 3:22), these words denote the cause of his ejection from paradise on account of sin (by which, as by his own fault, he had cut himself off from that life, which was the thing signified). Thus he ought no longer to have any right to its sacrament. The covenant of works being broken by man’s disobedience, its promissory and sacramental seals no longer belonged to him as a way of life.</p></blockquote>

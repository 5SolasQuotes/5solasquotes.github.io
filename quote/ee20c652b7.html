<main class="wrap"><figure class="quote" id="q-ee20c652b7" data-kw="">
<blockquote><p>II. These good works, done in obedience to God’s commandments, are the fruits and evidences of a true and lively faith:[c] and by them believers… having their fruit unto holiness, they may have the end eternal life.[l] [l] Rom. 6:22.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5757b1131c" data-kw="">
<blockquote><p>Wherefore good works are necessary to salvation, certainly not as an efficient or meritorious cause, by an efficient principle; yet they are necessary by a principle of being present, and so a testimony of our living faith, without which faith is dead; and they are required to salvation, not as a cause of ruling, but as a way to the kingdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/festus-hommius.html">Festus Hommius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 67, ‘Of Good Works’, ‘Whether Good Works are Necessary to Salvation?’ in 70 Theological Disputations Against Papists</cite>, … in a Collection Against Bellarmine (Leiden, 1614), pp. 454-55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Wherefore good works are necessary to salvation, certainly not as an efficient or meritorious cause, by an efficient principle; yet they are necessary by a principle of being present, and so a testimony of our living faith, without which faith is dead; and they are required to salvation, not as a cause of ruling, but as a way to the kingdom.”

</figure><figure class="quote" id="q-e2c8bb289e" data-kw="">
<blockquote><p>Lastly I answer that the ground of the former objection is erroneous, namely that the promise of salvation depends on the condition of our works: because the Scripture says it is made and accomplished on man’s part freely. I grant indeed that to the promise there is annexed a condition of faith: yet faith must not here be considered as a work, but as an instrument apprehending Christ with his benefits: and withal, repentance with the fruits thereof are on our part required, yet no otherwise but as they are necessary consequents of faith and the signs and documents thereof.</p></blockquote>

</figure><figure class="quote" id="q-3889c8ecc7" data-kw="">
<blockquote><p>In respect of God, our election standeth certain from all eternity… But in respect of ourselves it is uncertain, and therefore we must ‘strive to make the same sure’ by good works, 2 Peter 1:10. These are the ways to come to heaven, though they be not the cause why we should come to heaven; therefore we must keep the way, if ever we mean to come to heaven; for as we are ordained to the end, so are we ordained to the means which bring us to that end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Good Works are the Way to Heaven’ in The Lawyer’s Question: In Three Sermons</cite>, In ‘Good Works are the Way to Heaven’ in The Lawyer’s Question: In Three Sermons (1595) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2:108</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“In respect of God, our election standeth certain from all eternity… But in respect of ourselves it is uncertain, and therefore we must ‘strive to make the same sure’ by good works, 2 Peter 1:10. These are the ways to come to heaven, though they be not the cause why we should come to heaven; therefore we must keep the way, if ever we mean to come to heaven; for as we are ordained to the end, so are we ordained to the means which bring us to that end.”

— Henry Smith, In ‘Good Works are the Way to Heaven’ in The Lawyer’s Question: In Three Sermons (1595) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2:108">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+respect+of+God%2C+our+election+standeth+certain+from+all+eternity%E2%80%A6+But+in+respect+of+ourselves+it+is+uncertain%2C+and+therefore+we+must+%E2%80%98strive+to+make+the+same+sure%E2%80%99+by+good+works%2C+2+Peter+1%3A10.+These+are+the+ways+to+come+to+heaven%2C+though+they+be+not+the+cause+why+we+should+come+to+heaven%3B+therefore+we+must+keep+the+way%2C+if+ever+we+mean+to+come+to+heaven%3B+for+as+we+are+ordained+to+the+end%2C+so+are+we+ordained+to+the+means+which+bring+us+to+that+end.%E2%80%9D%0A%0A%E2%80%94+Henry+Smith%2C+In+%E2%80%98Good+Works+are+the+Way+to+Heaven%E2%80%99+in+The+Lawyer%E2%80%99s+Question%3A+In+Three+Sermons+%281595%29+in+The+Works+of+Henry+Smith%3B+Including+Sermons%2C+Treatises%2C+Prayers%2C+and+Poems%2C+ed.+Thomas+Fuller+%282+vols%2C+Edinburgh%3A+James+Nichol%2C+1866%29%2C+2%3A108&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3889c8ecc7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3889c8ecc7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=In%20respect%20of%20God%2C%20our%20election,which%20bring%20us%20to%20that%20end&amp;text=In%20respect%20of%20God%2C%20our%20election%20standeth%20certain&amp;text=the%20means%20which%20bring%20us%20to%20that%20end" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f9786c0af2" data-kw="">
<blockquote><p>The Orthodox: Good works do not precede one justified, but necessarily follow one justified and precede unto salvation. They are yet ordinarily necessary by adults out of the supposition or necessity: 1. Of presence, as signs and effects of true faith. 2. Of divine command. 3. of a means, so far as they are the way of salvation, a condition and cause sine qua non [without which there is nothing].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-alsted.html">Henry Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Controversy 10, ‘Whether Good Works are Necessary?’ in ‘Of Justification &amp; of Good Works in General’ in Part 4, Controversies with the Papists in Polemical Theology</cite>, … in Seven Parts (Hanau, Germany, 1620), p. 496</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Orthodox: Good works do not precede one justified, but necessarily follow one justified and precede unto salvation. They are yet ordinarily necessary by adults out of the supposition or necessity: 1. Of presence, as signs and effects of true faith. 2. Of divine command. 3. of a means, so far as they are the way of salvation, a condition and cause sine qua non [without which there is nothing].”

— Henry Alsted, Controversy 10, ‘Whether Good Works are Necessary?’ in ‘Of Justification &amp; of Good Works in General’ in Part 4, Controversies with the Papists in Polemical Theology… in Seven Parts (Hanau, Germany, 1620), p. 496">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Orthodox%3A+Good+works+do+not+precede+one+justified%2C+but+necessarily+follow+one+justified+and+precede+unto+salvation.+They+are+yet+ordinarily+necessary+by+adults+out+of+the+supposition+or+necessity%3A+1.+Of+presence%2C+as+signs+and+effects+of+true+faith.+2.+Of+divine+command.+3.+of+a+means%2C+so+far+as+they+are+the+way+of+salvation%2C+a+condition+and+cause+sine+qua+non+%5Bwithout+which+there+is+nothing%5D.%E2%80%9D%0A%0A%E2%80%94+Henry+Alsted%2C+Controversy+10%2C+%E2%80%98Whether+Good+Works+are+Necessary%3F%E2%80%99+in+%E2%80%98Of+Justification+%26+of+Good+Works+in+General%E2%80%99+in+Part+4%2C+Controversies+with+the+Papists+in+Polemical+Theology%E2%80%A6+in+Seven+Parts+%28Hanau%2C+Germany%2C+1620%29%2C+p.+496&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff9786c0af2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f9786c0af2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=The%20Orthodox%3A%20Good%20works%20do%20not,non%20%5Bwithout%20which%20there%20is%20nothing&amp;text=The%20Orthodox%3A%20Good%20works%20do%20not%20precede%20one&amp;text=sine%20qua%20non%20%5Bwithout%20which%20there%20is%20nothing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

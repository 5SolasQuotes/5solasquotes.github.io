<main class="wrap"><figure class="quote" id="q-5a0f0efa11" data-kw="">
<blockquote><p>…but I owe subjection of conscience to God solely, independently, and only… Yea, though crosses and afflictions work only upon us, as occasions, and external objects; yet are we to submit our conscience to them, as to warnings, because they be sent as God’s messengers appointed by Him, as Mic. 6:9, ‘Hear the rod, and who has appointed it.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p. 135</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-258c414b3b" data-kw="">
<blockquote><p>But this right [of the civil government], as far as [it] pertains to its exercise in respect of the infliction of punishment, either tends to the good of the whole republic, as in ordinary cases, or, as in some extraordinary cases, gives place to its hurt; for it is possible that even the exaction of punishment, in a certain condition of a state, may be hurtful. In such a situation of things, the ruler or magistrate has a power not to use his right of government in respect of particular crimes; or rather, he ought to use it in such a manner as is the most likely to attain the end; for he is bound to regard principally the good of the whole and the safety of the people ought to be his supreme law. But he who affirms that in ordinary cases, a magistrate may renounce his right, when that renunciation cannot but turn out to the hurt of the public good, is a stranger to all right.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertation on Divine Justice</cite>, pp. 567-8 of A Dissertation on Divine Justice... ch. 9 in Works, vol. 10</span></figcaption>

</figure><figure class="quote" id="q-cc0c6ef229" data-kw="">
<blockquote><p>The enactment of law is the process by which the magistrate, with the consent of the optimates and estates of his imperium and realm, legislates what is fair, useful, and necessary to the commonwealth.4 The magistrate shall especially see that the customs, temperament, and ancient rights of the nation are respected, and that new laws are accommodated to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-althusius.html">Johannes Althusius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Politica</cite>, 29.4</span></figcaption>

</figure><figure class="quote" id="q-27cf479945" data-kw="">
<blockquote><p>15. Though the people have not miniterial or governing power [in church government], yet they are to have a judgment of discretion, and thereby to try and discern, whether they that do cast out, or absolve by ministerial authoritative declaration, do proceed according to God’s Word or not, and are not to obey any sentence or injunction that is contrary to that Word; yet must they not on that pretence disobey or refuse to execute such injunctions and censures without manifesting their proofs of its error.</p></blockquote>

</figure><figure class="quote" id="q-eb2bbeba38" data-kw="">
<blockquote><p>This consideration may be very useful: For it may first serve to be a cure of two great ills in this land: One is of such as conceive that the Law of God, belongs not to Christians; They may as well say that common and natural equity belongs not to Christians. Is it not written in the heart of man by nature? Is it not confirmed by Jesus Christ? Is it not recommended to Christians by the apostles? Is it not established by faith? Is not the observing of it, a testimony of our communion with God? Is not the end of it love from a pure heart, a good conscience, and faith unfeigned? Is it thankfulness to God, because we are delivered from the condemnation, coaction [compulsory force], and rigor of the Law, not to acknowledge the obligation of the Law? Shall not the domestics of the house of God observe the commandments of God, or shall they not be grieved when they transgress and observe them not?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon Preached to the Honorable House of Commons at their Late Solemn Fast, Wed., Dec. 27 on Ezra 7:23</cite>, (1643), p. 30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

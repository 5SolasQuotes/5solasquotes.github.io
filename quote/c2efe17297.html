<main class="wrap"><figure class="quote" id="q-c2efe17297" data-kw="">
<blockquote><p>There are two sorts of laws whereby God requires the obedience of his rational creatures, which are commonly called moral and positive… Positive laws are taken to be such as have no reason for them in themselves – nothing of the matter of them is taken from the things themselves commanded – but do depend merely and solely on the sovereign will and pleasure of God. Such were the laws and institutions of the sacrifices of old; and such are those which concern the sacraments and other things of the like nature under the New Testament. Moral laws are such as have the reasons of them taken from the nature of the things themselves required in them; for they are good from their respect to the nature of God himself, and from that nature and order of all things which he hath placed in creation. So that this sort of laws is but declarative of the absolute goodness of what they do require; the other is constitutive of it, as unto some certain ends. Laws positive, as they are occasionally given, so they are esteemed alterable at pleasure. Being fixed by mere will and prerogative, without respect to any thing that should make them necessary antecedent to their giving, they may by the same authority at any time be taken away and abolished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Excercitation 4, ‘On the Causes of the Sabbath’</cite>, pp. 75-76 in A Treatise on the Sabbath… new ed., rev. &amp; ed. J.W. Brooks (London, 1829)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-e09efd57c8" data-kw="">
<blockquote><p>In this treatise Hemmingsen [a Lutheran] argues that all particular rules of ethical conduct can be derived from immutable axioms or first principles. Though moral philosophy works according to its own rules, Hemmingsen shows that its conclusions, far from being at odds with the divine revelation of the moral law, are identical with the ethical commandments of Scripture. Thus Hemmingsen includes a section on the Decalogue, along with a lengthy account of the traditional cardinal virtues, supported by a myriad of quotations from classical Greek and Roman sources. This important treatise looks both backward to classical and medieval philosophy and forward to developments in the seventeenth century and beyond.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/niels-hemmingsen.html">Niels Hemmingsen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Law of Nature: A Demonstrative Method ed. &amp; trans. Hutchinson</span></figcaption>

</figure><figure class="quote" id="q-d3ee81f1a3" data-kw="">
<blockquote><p>Forasmuch as we have been freed from the teaching of Moses through Christ the Lord, so that it is no longer necessary for us to observe the civil decrees of the law of Moses, namely, in terms of the way and the circumstances in which they are described, nevertheless, insofar as the substance and proper end of these commandments are concerned, and especially those which enjoin the discipline that is necessary for the whole commonwealth, whoever does not reckon that such commandments are to be conscientiously observed is certainly not attributing to God either supreme wisdom or a righteous care for our salvation.</p></blockquote>

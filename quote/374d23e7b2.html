<main class="wrap"><figure class="quote" id="q-374d23e7b2" data-kw="">
<blockquote><p>Sins are of two sorts, either great and capital, or small and ordinary sins: I know it were a paradox in nature to tell you, that the greatest and mightiest things are of least force; yet this is true in the case we speak of, the greatest things are the weakest. Your own experience tells you, that rapes and murders, parricide, poisoning, treason, and the rest of that rabble of arch sins, are the sins of the fewest, and that they have no strength at all but upon the weakest men; for doubtless if they were the strongest, they would reign with greatest latitude, they would be the commonest, they would be the sins of the most: But wandering thoughts, idle words, petty lusts, inconsiderate wrath, immoderate love to the things of the world, and the rest of that swarm of ordinary sins, these are they that have largest extent and dominion, and some of these, or all of these, more or less, prevail with every man.

As the Magicians in Exodus, when they saw not the power of God in the Serpents, in the Blood, in the Frogs; at the coming of the plague of the Lice presently cried, Digitus Dei hic est; this is the finger of God: so I know not how it comes to pass, though we see and confess that in those great and heinous crimes, the Devil hath least power; yet at the coming of Lice, of the rout of smaller and ordinary sins, we presently yield our selves captives, and cry out, Digitus Diaboli, the strength of the Devil is in these: as if we were like unto that fabulous Rock in Pliny, which if a man thrust at with his whole body, he could not move it, yet a man might shake it with one of his fingers. Now what an error is it in us Christians, when we see the principal and captain sins so easily vanquished, to think the common soldier or lesser sort invincible? For certainly, if the greatest sins be the weakest, the lesser cannot be very strong.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hales.html">John Hales</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Omnipotency</cite>, in Golden remains, of the ever memorable Mr. John Hales, of Eaton-College, &amp;c. The second impression. With additions from the author’s own copy, viz., sermons &amp; miscellanies, also letters and expresses concerning the Synod of Dort (not before printed,) from an authentic hand (London: Robert Pawlet, 1673), p. 122.</span></figcaption>

<blockquote><p>Quest. II. If Peace-makers be blessed, how can any Nation with good conscience make war?

Answ. The Lord’s commandment to have peace with all men, doth not bind men simply, but with this condition, if it be possible, and as much as in us lieth: but when there is no hope of maintaining peace, then the Lord alloweth a lawful war, such as is for just defence, or claim of our needful due and right: for herein the case standeth with the body politick, as it doth with the natural body; while there is hope of health and safety, the Physician useth gentle means; but when the case is desperate, then he useth desperate means, and sometimes gives rank poison, to try if by any means life may be saved. And so may the safety of a State be sought by war, when Motions of peace will not take place.</p></blockquote>

<blockquote><p>There are certain things which you cannot expect from such a true Christian Church. In the first place, you cannot expect from it any cooperation with non-Christian religion or with a non-Christian program of ethical culture. There are those who tell us that the Bible ought to be put into the public schools, and that the public schools should seek to build character by showing the children that honesty is the best policy and that good Americans do not lie nor steal. With such programs a true Christian Church will have nothing to do. The Bible, it will hold, is made to say the direct opposite of what it means if any hope is held out to mankind from its ethical portions apart from its great redemptive center and core; and character building on the basis of human experience may be character destruction; it is the very antithesis of that view of sin which is at the foundation of all Christian convictions and all Christian life. There is no such thing, a true Christian Church will insist, as a universally valid fund of religious principles upon which particular religions, including the Christian religion, may build; “religion” in that vague sense is not only inadequate but false; and a morality based upon human experience instead of upon the law of God is no true morality. Against such programs of religious education and character building, a true Christian Church will seek from the state liberty for all parents everywhere to bring up their children in accordance with the dictates of their conscience, will bring up its own children in accordance with the Word of God, and will try to persuade all other parents, becoming Christians, to bring up their children in that same Christian way. In the second place, you cannot expect from a true Christian Church any official pronouncements upon the political or social questions of the day, and you cannot expect cooperation with the state in anything involving the use of force. Important are the functions of the police, and members of the Church, either individually or in such special associations as they may choose to form, should aid the police in every lawful way in the exercise of those functions. But the function of the Church in its corporate capacity is of an entirely different kind. Its weapons against evil are spiritual, not carnal; and by becoming a political lobby, through the advocacy of political measures whether good or bad, the Church is turning aside from its proper mission, which is to bring to bear upon human hearts the solemn and imperious, yet also sweet and gracious, appeal of the gospel of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Responsibility of the Church in our New Age,” The Presbyterian Guardian 45</cite>, (February, 1976): 5, 13, 14.</span></figcaption>

+expect+from+a+true+Christian+Church+any+official+pronouncements+upon+the+political+or+social+questions+of+the+day%2C+and+you+cannot+expect+cooperation+with+the+state+in+anything+involving+the+use+of+force.+Important+are+the+functions+of+the+police%2C+and+members+of+the+Church%2C+either+individually+or+in+such+special+associations+as+they+may+choose+to+form%2C+should+aid+the+police+in+every+lawful+way+in+the+exercise+of+those+functions.+But+the+function+of+the+Church+in+its+corporate+capacity+is+of+an+entirely+different+kind.+Its+weapons+against+evil+are+spiritual%2C+not+carnal%3B+and+by+becoming+a+political+lobby%2C+through+the+advocacy+of+political+measures+whether+good+or+bad%2C+the+Church+is+turning+aside+from+its+proper+mission%2C+which+is+to+bring+to+bear+upon+human+hearts+the+solemn+and+imperious%2C+yet+also+sweet+and+gracious%2C+appeal+of+the+gospel+of+Christ.%E2%80%9D%0A%0A%E2%80%94+J.+Gresham+Machen%2C+%E2%80%9CThe+Responsibility+of+the+Church+in+our+New+Age%2C%E2%80%9D+The+Presbyterian+Guardian+45%2C+%28February%2C+1976%29%3A+5%2C+13%2C+14.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff925026ff3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f925026ff3.html">Permalink</a><a class="src" href="https://heidelblog.net/2026/11/machen-on-ethics-schools-and-spiritual-weaponry/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

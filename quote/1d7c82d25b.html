<main class="wrap"><figure class="quote" id="q-1d7c82d25b" data-kw="eternal generation order">
<blockquote><p>This generation was made without time (achronōs); not in time, but from eternity. Therefore not priority or posteriority of duration can be observed here, although there may be priority of order according to which the Son is from the Father, although not after the Father. (2) Without place (achōristōs) because the Father did not beget out of himself, but in the same essence. (3) Without any passion (apathōs) or change, either in the Father or in the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.29.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-son.html">The Son</a> › <a href="../topics/the-trinity/the-son/eternal-generation.html">Eternal generation</a></span><span class="t"><a href="../topics/the-trinity/the-son.html">The Son</a> › <a href="../topics/the-trinity/the-son/order-and-subordination.html">Order and subordination</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-487c250015" data-kw="Arius homoousios Nicene">
<blockquote><p>Arius confessed that Christ was God, and the Son of God; because the passages of Scripture to this effect were too clear to be resisted, and then, as if he had done well, pretended to concur with others. But, meanwhile, he ceased not to give out that Christ was created, and had a beginning like other creatures. To drag this man of wiles out of his lurking-places, the ancient Church took a further step, and declared that Christ is the eternal Son of the Father, and consubstantial with the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-trinity-in-controversy.html">The Trinity in Controversy</a> › <a href="../topics/the-trinity/the-trinity-in-controversy/arianism.html">Arianism</a></span><span class="t"><a href="../topics/the-trinity/the-son.html">The Son</a> › <a href="../topics/the-trinity/the-son/deity-of-the-son.html">Deity of the Son</a></span></div>

</figure><figure class="quote" id="q-da3e96a980" data-kw="natural Son not adopted">
<blockquote><p>Christ is said to be “the own Son of the Father” not only inasmuch as it is opposed to one of another family … but inasmuch as it is opposed to an adopted and metaphorical son. Thus he may be called the natural son who is such by the privilege of his nature and not by the grace and benefit of adoption only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.29.16</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Christ is said to be “the own Son of the Father” not only inasmuch as it is opposed to one of another family … but inasmuch as it is opposed to an adopted and metaphorical son. Thus he may be called the natural son who is such by the privilege of his nature and not by the grace and benefit of adoption only.”

— Francis Turretin, Institutes of Elenctic Theology, 3.29.16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CChrist%20is%20said%20to%20be%20%E2%80%9Cthe%20own%20Son%20of%20the%20Father%E2%80%9D%20not%20only%20inasmuch%20as%20it%20is%20opposed%20to%20one%20of%20another%20family%20%E2%80%A6%20but%20inasmuch%20as%20it%20is%20opposed%20to%20an%20adopted%20and%20metaphorical%20son.%20Thus%20he%20may%20be%20called%20the%20natural%20son%20who%20is%20such%20by%20the%20privilege%20of%20his%20nature%20and%20not%20by%20the%20grace%20and%20benefit%20of%20adoption%20only.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.29.16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fda3e96a980.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/da3e96a980.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-ccec615c7d" data-kw="eternal generation essence">
<blockquote><p>As all generation indicates a communication of essence on the part of the begetter to the begotten (by which the begotten becomes like the begetter and partakes of the same nature with him), so this wonderful generation is rightly expressed as a communication of essence from the Father (by which the Son possesses indivisibly the same essence with him and is made perfectly like him).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.29.4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-son.html">The Son</a> › <a href="../topics/the-trinity/the-son/eternal-generation.html">Eternal generation</a></span></div>
<div class="actions"><button class="copy" data-copy="“As all generation indicates a communication of essence on the part of the begetter to the begotten (by which the begotten becomes like the begetter and partakes of the same nature with him), so this wonderful generation is rightly expressed as a communication of essence from the Father (by which the Son possesses indivisibly the same essence with him and is made perfectly like him).”

</figure><figure class="quote" id="q-a6a6dcb745" data-kw="begot necessarily willingly">
<blockquote><p>Arius vexed the Orthodox by asking whether the Father begot the Son by necessity or by will. To this, the response must be that the Father begot the Son not out of necessity but necessarily, for He did not beget contingently. However, whatever this necessity is, it is voluntary and natural and lacks coercion. The Father did not beget the Son by will, but He begot willingly, for He is not compelled by any external or superior cause to beget.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XXIV</span></figcaption>

<main class="wrap"><figure class="quote" id="q-fccad8979c" data-kw="word and Spirit means">
<blockquote><p>Thus the Spirit is indeed rightly said not to work without the word, but not by the word only, but immediately and distinctly from the word. The movement of efficacious grace is properly to be called neither physical nor ethical, but supernatural and divine.</p></blockquote>

</figure><figure class="quote" id="q-099f204dae" data-kw="">
<blockquote><p>As many as are called by the gospel are unfeignedly called. For God has most earnestly and truly declared in His Word what is acceptable to Him, namely, that those who are called should come unto Him. He also seriously promises rest of soul and eternal life to all who come to Him and believe.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“As many as are called by the gospel are unfeignedly called. For God has most earnestly and truly declared in His Word what is acceptable to Him, namely, that those who are called should come unto Him. He also seriously promises rest of soul and eternal life to all who come to Him and believe.”

</figure><figure class="quote" id="q-d1ee3d3ea9" data-kw="against moral suasion">
<blockquote><p>Hence of two to whom the same grace is offered, if one is converted while the other remains unbelieving, the reason is not to be found (according to them) in the grace (which is the same), but in the disposition of the subject or man, because the one draws the bolt, the other does not (i.e., one rejects the grace which the other admits). Thus what they seem to give largely with one hand (preaching that the beginning, progress and complement of all our good is from grace), they secretly steal away with the other, maintaining that the mode of that operation is such that man can always resist it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.6.3</span></figcaption>

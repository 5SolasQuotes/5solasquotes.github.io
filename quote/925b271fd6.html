<blockquote><p>“But some dare say, either because of the love of novelties or in order to appear ingenious, that the earth moves, and contend that neither the eight sphere nor the sun moves while they assign other movement to the celestial spheres and place the earth among the stars. The joke is not new. There is a book by Archimedes called De Numeratione Arenae, in which he reports that Aristarchus of Samos defended this paradox, that the sun remains fixed and the earth turns around the sun. And although clever workers investigate many questions to give expression to their ingenuity, the young should know that it is not good to defend such absurd opinions publicly, nor is it honest or a good example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Universe of Philip Melanchthon</cite>, As quoted in Bruce T. Moran, (1973), pp. 13-14</span></figcaption>

</figure><figure class="quote" id="q-e899841436" data-kw="">
<blockquote><p>The second is, why God called only the light ‘day’, and Moses calls both the evening and the morning, that is, the time of light and darkness, ‘one day’, or ‘the first day’. I answer that God’s ‘day’, which is most truly and properly so called, is the time of light, and in it there is no night or darkness. For God speaks of a natural day, distinct from the night: but Moses speaks of a civil day which comprehends in it the space of 24 hours, in which the sun runs round about the world with the heavens; which ‘day’ includes in it a day and a night: and here observe that God’s ‘day’ is all light, and man’s ‘day’ is mixed of light and darkness. Thirdly, it may asked whether the night, or the day went before in the first day of the creation. The answer is that the night or time of darkness was first; and it is likely that darkness did overspread the face of the deep the space of a night, that is 12 hours, before God formed the light, and setled the visible heavens in their place; and that after the light was created, it did shine forth for the space of 12 hours more before God went about to make the firmament, which was the second day’s work; and so the first day of the world was of the same length with all other civil or astronomical days, that is, 24 hours, divided equally between light and darkness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses</cite>, … (London: Barlet, 1641), Of the Creation of the World, ch. 6; p. 113</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>VIII. Nor is God the univocal cause of the world, but the equivocal; nor necessary and immanent, as Spinoza wishes, Ethics, pt. 1, On God, Proposition 18, p. 19, but free and transient, or better: Creation, taken actively, is not an immanent, but a transient action, by which God produces things diverse from Himself and confers being upon them, the immediate principle of which action is the practical volition of God, his command and mandate. For an agent is then said to act transiently when it actually flows into an external effect diverse from the agent, which has its place in Creation, where a true and real influx of God into the creature is given, signified by the command of God in:Gen. 1:3, “Let there be light: and there was light.”… From this it appears clearer than daylight that here is given a true and real influx of an efficient cause into the effect, and therefore a true and real transient action. These things being diligently observed, the whole of Spinozism collapses. … XI. The preceding, i.e., intrinsically moving, cause is the divine goodness, communicative and diffusive of itself, by which it came to pass that God, blessed in Himself, went forth outside Himself and communicated his goodness with creatures. Ps. 127:5-8; 145:9. He produced all things from nothing, and declared His immense goodness, wisdom, and power to the creature, especially the rational one, by which in turn He would be acknowledged and worshipped. The directing and ordering cause is knowledge, wisdom, and, based on these as a directive principle, the decree of God, as an imperious principle, which is accompanied by the power of God as an executive principle, which things were decreed from knowledge and most wisely. Whence in Eph. 1:11, God is said to do all things ‘according to the counsel of His own will.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), trans. AI Latin</span></figcaption>

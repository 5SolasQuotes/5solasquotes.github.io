<main class="wrap"><figure class="quote" id="q-cf42d56e33" data-kw="">
<blockquote><p>It is ridiculous to profess to find in this a decision of Christ on the subject of war; far more so to find in it a decision against even defensive war as sinful, or against the profession of a soldier as in itself unlawful. It is equally absurd to plead this text in support of what used to be called the divine right of kings, in virtue of which it was held that they might be guilty of extortion and oppression towards their subjects to any extent, while their victims were forbidden by Scripture to rise and resent the tyranny, or rise and throw off the tyrant. The words of Jesus give no countenance to the notion that all war is sinful; and as little to the equally unfounded idea that all revolutions must be rebellions.

We live, as Britons, under a constitution guaranteed to us by a revolution settlement, which was righteous and good, and which banished from the throne a dynasty whom the nation declared, most justly, had forfeited its love and its submission, and whom the judgment of God upon their wickedness has since pursued into extinction. And as we live in internal tranquillity under God, in virtue of a settlement secured by a just revolution; we ought to be prepared in like manner to guard our external relations by readiness, when necessary, for defensive war.

The righteousness, in certain cases, of revolution within; and the righteousness, in certain cases also, of war without; are principles indeed absolutely necessary to the maintenance of peace within the nation itself, and of peace with those around us. And these are principles sanctioned in many passages of Scripture, and certainly not condemned by the words before us.

We venture also very strongly to assert that the admirable historian [J. H. Merle d’Aubigné] of the Reformation has done deep injustice to one of the finest portraits in his noble picture gallery, we mean Zwingle, whom, simply because he died in the field, sword in hand, he represents as having forgotten that the “weapons of our warfare are not carnal,” and as having violated the command which Jesus here gives to Peter. We are persuaded that the lawfulness of the battle in which the great Swiss reformer fell, is not to be settled by the off-hand quotation of this or any other text.

The fact that they were religious men in Switzerland was no reason why they should see, without a struggle, their fatherland overrun and devastated by the wild troops of their allied persecuting foes. Apart from their love to the gospel, it will be no easy matter for any historian to show that the Swiss did wrong in risking their liberties on the issue of battle; and most certainly the introduction into the question of their religious rights as Christians, which they loved and sought to guard even more than their liberties as men, will not make it any easier to prove that they sinned in fighting to defend and retain them. We feel interested in the question; for the memory of our covenanted forefathers in one period of their history stands in the same position, and must share the same fate, as the memory of Zwingle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shadow of Calvary: Gethsemane – The Arrest – The Trial</cite>, (Edinburgh: Lyon &amp; Gemmell, 1875), pp 175-77.</span></figcaption>

ovenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f2d5d7b1c4" data-kw="">
<blockquote><p>All the question is concerning the imperated [commanded] acts and these external, that is not touching opinions and acts of the mind, but that which is visible and audible in these opinions, to wit, the speaking, professed holding of them, publishing, teaching, printing, and known external persuading of others to be of our mind. So that the question will come to this, whether the Magistrate’s sword be to regulate our words that concerns our neighbor, as that we lie not, we forswear not, to the hurt of the life and credit of our neighbor, that we slander not, rail upon no man, far less against the prince and ruler of the people, but whether the words we utter or publish of God though never such blasphemies, and lies, because they come from the conscience (as is truths or words we speak for or against our neighbor did not flow from a conscience either good or ill) be above or beyond all swords or coercive power of men. It is clear the question must be thus stated, for all the laws of the Old Testament (which we hold in their moral equity to be perpetual) that are touching blasphemies, heresies, solicitation to worship false gods and the breach of which the godly magistrate was to punish, command or forbid only such things as may be proved by two or three witnesses, and which husband and wife are not to conceal, and from which all Israel must abstain for fear of the like punishment, Dt. 13:8-11; 17:5-6; Lev. 20:1-5. But opinions in the mind, acts of the understanding, can never be proved by witnesses and such as neither Magistrate nor Church can censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (1649), ch. 4, pp. 46-47</span></figcaption>

<blockquote><p>He that smiteth his Father or Mother, shall die the death. This is an other law in this Chap. which maketh for the exposition of that Commandment of honouring them, &amp; is to be referred to it. We may note in it, how God doth not say, he that killeth Father or Mother shall be killed for it; but he that smiteth, so that not so much as a tip is to be given to parents upon pain of death, no not with the tong may we smite them, that is, by any evil and unfit words abuse them, as you may at large read in the exposition of that Commandment. So great is the honour of Parents before God, and so sharp a Judge is God against all abusers of them: Little thought of by too many in our days, &amp; the rather because continually in the Church there is not a beating of these points of Catechism into Children’s heads, and hearts, by careful Ministers.

O, that they would be once drawn to do this duty in their several Churches: Soon, soon should they find the Fruit of it, and the greatness of their Sin in so long neglecting it. In Plato an heathen we read the like law, wherein is decreed that all beating and contumelies of Parents should be punished with perpetual banishment and death. By the Roman laws the slayer of his parents was not to be slain either with sword or fire, or other ordinary punishment, sed in sutus culeo, &amp;c. sowed in a sack with a Dog, a Cock, a Viper, and an Ape, he should be thrown into the Sea or River, that the ayre whilst he lived, and the earth when he was dead might be denied him, who so had wronged them that gave him a life and being in the air and upon the earth. A good Writer testifieth he saw one put to death at Tigurine who had cursed and reviled his Mother.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Comfortable notes upon the books of Exodus and Leviticus, as before upon Genesis Gathered and laid down still in this plain manner, for the good of them that cannot use better helps, and yet are careful to read the Scriptures, and very desirous to find the comfort in them. … With a table of the prin</cite>, (London: Thomas Chard, 1604), pp 333-34.</span></figcaption>

dead+might+be+denied+him%2C+who+so+had+wronged+them+that+gave+him+a+life+and+being+in+the+air+and+upon+the+earth.+A+good+Writer+testifieth+he+saw+one+put+to+death+at+Tigurine+who+had+cursed+and+reviled+his+Mother.%E2%80%9D%0A%0A%E2%80%94+Gervase+Babington%2C+Comfortable+notes+upon+the+books+of+Exodus+and+Leviticus%2C+as+before+upon+Genesis+Gathered+and+laid+down+still+in+this+plain+manner%2C+for+the+good+of+them+that+cannot+use+better+helps%2C+and+yet+are+careful+to+read+the+Scriptures%2C+and+very+desirous+to+find+the+comfort+in+them.+%E2%80%A6+With+a+table+of+the+prin%2C+%28London%3A+Thomas+Chard%2C+1604%29%2C+pp+333-34.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa684481baa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a684481baa.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/06/24/gervase-babington-on-smiters-of-parents/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-1ebbe593af" data-kw="">
<blockquote><p>How can piety but promise to herself a zealous patron of your Highness, being the sole son and heir of so gracious and great a monarch, who is not only the defender of the faith by title, but also a defender of the faith in truth, as the Christian world hath taken notice, by his learned confuting of [Robert] Bellarmine’s overspreading heresies, and his suppressing in the blade of [Conrad] Vorstius’s Athean blasphemies? [1]

And how easy it is for your Highness to equal, if not exceed, all that were before you, in grace and greatness, if you do but set your heart to seek and to serve God, considering how religiously your Highness hath been educated by godly and virtuous governors and tutors; as also that you live in such a time, wherein God’s providence, and the King’s religious care, hath placed over this church, to the unspeakable comfort thereof, another venerable Jehoiada, that doth good in our Israel both towards God and towards his house; of whom your Highness at all times, in all doubts, may learn the sincerity of religion, for the salvation of your inward soul, and the wisest counsel for the direction of your outward state.

And to excite you the rather to the zealous practice of divine piety, often suppose with yourself, that your Highness hears your religious father James speaking unto you, as sometimes holy David spake to his son Solomon: and thou Charles my son know thou the God of thy father, and serve him with a perfect heart, and with a willing mind; for the Lord searcheth all hearts, and understandeth all the imaginations of the thoughts: if thou seek him, he will be found of thee; but if thou forsake him, he will cast thee off for ever.</p></blockquote>

</figure><figure class="quote" id="q-72c5a026dc" data-kw="">
<blockquote><p>Did the Lord by Moses give to the Jews as a body politic sundry judicial laws which expired with their state? Yes. Do they oblige any other now, further than the general equity thereof may require? No (Ex. 21; 22:1-29; Gen. 49:10; 1 Cor. 9:8-10; 1 Pet. 2:13-14; Mt. 5:17,38-39). Well then, do not some err, though otherwise orthodox, who maintain that the whole judicial law of the Jews is yet alive and binding all of us who are Christian gentiles? Yes. By what reasons are they confuted?

1. Because the judicial law was delivered by Moses to the Israelites to be observed, as to a body politic (Ex. 21).

2. Because this law, in many things which are of particular right, was accommodated to the commonwealth of the Jews, and not to other nations also (Ex. 22:3; 21:2; Lev. 25:2-3; Dt. 24:1-3; 25:5-7).

3. Because, in other things which are not of particular right, it is neither from the law of nature obliging by reason; neither is it pressed upon believers under the gospel to be observed.

4. Because believers are appointed under the gospel to obey the civil law and commands of those under whose government they live, providing they be just, and that for conscience’ sake (Rom. 13:1; 1 Pet. 2:13-14; Titus 3:1).</p></blockquote>

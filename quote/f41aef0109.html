<main class="wrap"><figure class="quote" id="q-f41aef0109" data-kw="">
<blockquote><p>There was a comparative self-denial required in Adam, and is in the man Christ and the elect angels, though no sinful self was in any of these three, and it is that the sinless creature should yield its being, lust [cravings], will and desires rather to be trampled on, despised or turned to nothing before God be dishonored.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist… (1648), pt. 1</cite>, p. 166</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-states-of-christ/state-of-humiliation.html">State of Humiliation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-84ded9faba" data-kw="">
<blockquote><p>We say, therefore, that temptation which proceeds from an external principle, if it finds nothing in us which inclines to evil or delights in it, cannot have the nature of sin. Thus the Devil could tempt Christ, and present various objects to his eyes and imagination, but he had no power in him, who lacked all vicious inclination. The case is different with our inclination and internal movements, which when the Devil moves, indeed even if they are not moved by the Devil, are nevertheless sins, as we have proved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Catholic Opposite the Papist Catholic (1630), Question 14, ‘On Concupiscence, or the remnants of original sin in the regenerated man’</cite>, p. 13 trans. AI</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-states-of-christ/state-of-humiliation.html">State of Humiliation</a></span><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

</figure><figure class="quote" id="q-c28bff1c27" data-kw="">
<blockquote><p>Consider therefore, his infinite condescension, grace, and love herein. Why all this towards you? Does he stand in need of you? Have you deserved it at his hands? Did you love him first? Cannot he be happy and blessed without you? Has he any design upon you, that he is so earnest in calling you unto him? Alas! it is nothing but the overflowing of mercy, compassion, and grace, that moves and acts him herein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations and Discourses on the Glory of Christ</cite>, pt. 2, ch. 1, “Application … an Exhortation unto Such as Are Not Yet Partakers of Him”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-states-of-christ/state-of-humiliation.html">State of Humiliation</a></span></div>

</figure><figure class="quote" id="q-620bbe1bed" data-kw="">
<blockquote><p>(2) Of the seed and blood of the V. Mary was formed Christ’s flesh, the H. Spirit adding quickening force to this material. Of course the seed and blood of the virgin Mary also possessed their own vital and animal spirits, as other men’s seed usually has. But these were by no means sufficient for the plastic or formative force of the foetus in question. And so the H. Spirit’s extraordinary shadowing and quickening were addded: whence also it is said to have been conceived of the H. Spirit, a phrase and manner of speaking which is human and metaphorical, not strictly appropriate. (3) Thus Christ’s incarnation was at once ordinary and extraordinary: ordinary as regards the material supplied by the V. Mary, extraordinary as regards the formative force added to this material.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bartholomaus-keckermann.html">Bartholomaus Keckermann</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Heinrich Heppe, Reformed Dogmatics, Person of Christ, section 12</cite>, p. 425</span></figcaption>

</figure><figure class="quote" id="q-0076ce0f8b" data-kw="sufferings soul wrath">
<blockquote><p>As the suffering of Christ is the principal part of the ransom paid for us by him and the special foundation of our confidence and consolation, it should also be the primary object of our faith and the theme of meditation, that with Paul we may count all things for loss but the knowledge of the crucified Jesus. Did Christ suffer only corporeal punishments for us in the body or in the soul, but only as to its lower and sensitive part? Or did he in truth also bear the spiritual and infernal punishments of sin themselves (in the superior as well as in the inferior part) properly in himself and from a sense of God’s wrath? We deny the former and affirm the latter against the papists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.14.1</span></figcaption>

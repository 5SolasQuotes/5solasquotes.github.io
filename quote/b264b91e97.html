<blockquote><p>…that we will entertain Christ’s ambassadors in our houses, as Lydia and the jailor did; that we will read scriptures, instruct our families, sing psalms, continue instant in family and closet prayer, that all the rooms of our house may be seasoned…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-heywood.html">Oliver Heywood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Family Altar in Works</cite>, vol. 4, p. 374</span></figcaption>

</figure><figure class="quote" id="q-89bde2451f" data-kw="">
<blockquote><p>Mind it, families in their domestic capacity, as well as in a personal, or national capacity may be alienated from God, and may have a root that beareth gall and wormwood, then see what follows: this is that which makes evil families, when instead of praying, reading scriptures, singing psalms, there is cursing, swearing, mocking at serious godliness, vain or profane talk, at least only worldly discourse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-heywood.html">Oliver Heywood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Family Altar in Works</cite>, vol. 4, p. 319</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/family-and-private-worship.html">Family and Private Worship</a></span></div>

</figure><figure class="quote" id="q-142cc5097c" data-kw="">
<blockquote><p>The mortality in our perish is not over yet, though I hoped my child had closed it: but just while I was writing this, I heard of the death of a mother of four small children… carried off at night by a sickness, so far as I could understand, not above two hours long long. Alas! we have provoked our God. By the awful voice of Providence continuing, I was led to Zech. 12:12, ‘And the land shall mourn, every family apart,’ etc., on which I dwelt from 11th March till 20th May; and for some time after, on Ps. 126:5, ‘They that sow in tears, shall reap in joy.’ Upon the former of these I pressed the duty of personal and family fasting, among other things. And this was not without fruit. I knew that some were engaged in these duties; particularly James Biggar’s family, on which the hand of the Lord lay long and heavy, and carried off several of them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Memorial Concerning Personal &amp; Family Fasting &amp; Humiliation on Zech. 12:12</cite>, (†1732) 50 pp. in Works, vol. 11, pp. 343-393 See especially p. 386 ff. | The occasion of this piece (Memoirs, p. 304):</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/family-and-private-worship.html">Family and Private Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The mortality in our perish is not over yet, though I hoped my child had closed it: but just while I was writing this, I heard of the death of a mother of four small children… carried off at night by a sickness, so far as I could understand, not above two hours long long. Alas! we have provoked our God. By the awful voice of Providence continuing, I was led to Zech. 12:12, ‘And the land shall mourn, every family apart,’ etc., on which I dwelt from 11th March till 20th May; and for some time after, on Ps. 126:5, ‘They that sow in tears, shall reap in joy.’ Upon the former of these I pressed the duty of personal and family fasting, among other things. And this was not without fruit. I knew that some were engaged in these duties; particularly James Biggar’s family, on which the hand of the Lord lay long and heavy, and carried off several of them…”

d%20carried%20off%20several%20of%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5e68c3262b" data-kw="">
<blockquote><p>Friday, Oct. 12. — Kept a family fast this day, that we might afflict ourselves before our God; to seek of Him a right way for us and for our little ones, and for all our substance: I trust it was such a fast as the Lord would choose: His divine presence was amongst us, and we had good reason to hope and believe, that the Lord was entreated of us, Oh that we may find more and more reason to say so, when we come on shore. I dread going into the world. But wherefore do I fear? Lord, I believe, O help my unbelief, that Thou wilt keep me unspotted from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-whitefield.html">George Whitefield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Continuation of Whitefield’s Journal During the Time He was Detained in England, by the Embargo</cite>, vol. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/family-and-private-worship.html">Family and Private Worship</a></span></div>

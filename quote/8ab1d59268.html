<blockquote><p>OUR Lord and King JESUS CHRIST, when he was now about to go unto his Father, and desirous to leave unto those whom he loved, some excellent benefit, (a benefit then which the earth cannot yield a greater,) he left them Peace: Peace at his death as a Legacy, he bequeathed them: My Peace (saith he) I leave unto you, my Peace I give unto you; for neither could men wish from heaven a greater blessing, neither could the Angels declare unto men from heaven a more welcome message, then Glory in heaven, and Peace in earth.

This Bond, by which heaven unto earth, and earth unto heaven reciprocally is united, hath so straitly bound the heart of the King’s Majesty of great Britain [James I], that according to the exceeding care which he hath evermore had of the safe-guard and defence of true Religion, of settling Peace and Concord amongst Christian Princes throughout the world; but especially, Most Illustrious, Noble, and Magnificent Lords, of procuring the good and tranquillity of this your State, to which he acknowledges his Kingdom to be linked by the Tie of an ancienter and straiter League: He hath sent us hither with this especial charge, that as much as in us lies, we procure your prosperity, and your Churches Peace.

Certainly, an exceeding desire of Peace &amp; the public good, possest his Princely heart, when he commended unto your Lordships the care of Religion.

This his Majesty’s provident care can never be unwelcome, if it may please your Lordships, according to your Wisdom and Piety, to recount the benefit of the reformed Religion, and the blessings of God’s favour, which like showers from heaven, have watered your Provinces far &amp; near. I suppose, it cannot be unknown unto your Lordships, what &amp; how much you owe to true Religion.

Religion it was, which from blood and tempest reduced your State to these flourishing days of quietness and Sun-shine. Religion it was, which first begat, then enlarged, and finally established your prosperity. Let your Lordships now consider with your selves, what you will repay unto Christ for all these blessings. Of your Lordships, Christ, who is King of Kings, and Lord of Lords, requires this, that for and above all his other benefits, you preserve the Peace which he bequeathed you.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c945ac4a0f" data-kw="">
<blockquote><p>I answer that, Anger, as stated above (Article 1), is properly the name of a passion. A passion of the sensitive appetite is good in so far as it is regulated by reason, whereas it is evil if it set the order of reason aside. Now the order of reason, in regard to anger, may be considered in relation to two things. First, in relation to the appetible object to which anger tends, and that is revenge. Wherefore if one desire revenge to be taken in accordance with the order of reason, the desire of anger is praiseworthy, and is called “zealous anger” [Cf. Gregory, Moral. v, 45. On the other hand, if one desire the taking of vengeance in any way whatever contrary to the order of reason, for instance if he desire the punishment of one who has not deserved it, or beyond his deserts, or again contrary to the order prescribed by law, or not for the due end, namely the maintaining of justice and the correction of defaults, then the desire of anger will be sinful, and this is called sinful anger. Secondly, the order of reason in regard to anger may be considered in relation to the mode of being angry, namely that the movement of anger should not be immoderately fierce, neither internally nor externally; and if this condition be disregarded, anger will not lack sin, even though just vengeance be desired.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, question 158, ‘Anger’ in Summa, 2nd pt. of 2nd pt.</span></figcaption>

<blockquote><p>Reckless Church union is not here being recommended; rather implementing union ought to be governed by nature’s light and laws, Christian prudence and the general rules of the Word. Union ought not to be sought if it would do greater hurt than good, for instance, if the one Church would shred into oblivion, whereas the two Churches separate would at least maintain what good had preexisted. Churches coming together in at least the fundamentals is not being held out as all or nothing; rather it is a goal which may be worked towards as it is able to be borne and as progress can be made.</p></blockquote>

<blockquote><p>§1. Question 1: Must I always do as I would be done by? Or has this rule any exceptions? Answer: The rule intends no more but that your just self-denial and love to others be duly exercised in your dealings with all. And:

1. It supposes that your own will or desires be honest and just, and that God’s Law be their rule. For a sinful will may not be made the rule of your own actions or of other men’s. He that would have another make him drunk, may not therefore make another drunk: And he that would abuse another man’s wife, may not therefore desire that another man would lust after or abuse his wife. He that would not be instructed, reproved or reformed, may not therefore forbear the instructing or reproving others. And he that would kill himself, may not therefore kill another. But he that would have no hurt done to himself injuriously should do none to others: And he that would have others do him good, should be as willing to do good to them.

2. It supposes that the matter be to be varied according to your various conditions. A parent that justly desires his child to obey him, is not bound therefore to obey his child; nor the prince to obey his subjects; nor the master to do all the work for his servants, which he would have his servants do for him. But you must deal by another as you would (regularly) have them deal by you, if you were in their case, and they in yours. And on these terms it is a rule of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, (London, 1673), pt. 4, ch. 19, title 2, p. 114</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

1. It supposes that your own will or desires be honest and just, and that God’s Law be their rule. For a sinful will may not be made the rule of your own actions or of other men’s. He that would have another make him drunk, may not therefore make another drunk: And he that would abuse another man’s wife, may not therefore desire that another man would lust after or abuse his wife. He that would not be instructed, reproved or reformed, may not therefore forbear the instructing or reproving others. And he that would kill himself, may not therefore kill another. But he that would have no hurt done to himself injuriously should do none to others: And he that would have others do him good, should be as willing to do good to them.

2. It supposes that the matter be to be varied according to your various conditions. A parent that justly desires his child to obey him, is not bound therefore to obey his child; nor the prince to obey his subjects; nor the master to do all the work for his servants, which he would have his servants do for him. But you must deal by another as you would (regularly) have them deal by you, if you were in their case, and they in yours. And on these terms it is a rule of righteousness.”

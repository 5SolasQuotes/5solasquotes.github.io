<main class="wrap"><figure class="quote" id="q-abbe9fdc5b" data-kw="">
<blockquote><p>First, in that they [the Anglican ministers of Old England, arguing for set, stinted forms of prayer, as in the English Prayer Book] do confound, and make all one ordinance, Blessings, Psalms, and Prayers. … And first, it is evident, that, howsoever some kind of blessing, and prayer be all one, and so may be confounded, yet that solemn kind of blessing spoken of Num. 6, and which the patriarchs, and priests did use in their places, was clean of an other nature: In prayer the minister stands in place of the people and in their name offers up petitions and thanksgiving to God: But in blessing, the minister stands in the place of God, and in his name pronounceth a blessing, or mercy, upon the people. 2. Whereas this duty of prayer may be performed by one equal to another, by an inferior to a superior, yea by a man to himself: that other of blessing is always from the greater to the lesser: and therefore the apostle to the Hebrews, to show that the Preisthood of Melchisedek was more excellent than that of Levi, proves it by this, that Melchisedec blessed Abraham; taking this for granted without all contradiction, that the less is blessed of the greater. 3. Mr. Bernard himself in this book makes prayer one thing, and the blessing pronounced upon the people when they departed another thing: as he also makes singing of psalms a third distinct thing from them both: as there is cause he should.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Justification of Separation from the Church of England Against Mr. Richard Bernard his Invective, entitled, The Separatists Schism (Amsterdam, 1610)</cite>, pp. 466-67</span></figcaption>

ithub.io%2Fquote%2Fabbe9fdc5b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/abbe9fdc5b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-benediction#:~:text=First%2C%20in%20that%20they%20%5Bthe%20Anglican,as%20there%20is%20cause%20he%20should." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-9ace4a6900" data-kw="">
<blockquote><p>Further, this power of the keys… The key of the ministry of the Word is set down and established by Christ, Mt. 16:19, ‘I will give unto thee the keys of the kingdom of heaven,’ etc. This ministry of the Word is a key, because it opens and shuts heaven; this it does… Secondly: by applying the promises of the Gospel and the threatening of the Law: For when in the ministry of the Word the promises of remission of sins and life everlasting, are applied to believers that repent, then the kingdom of heaven is opened; and when as in the same ministry of the Word, the curses of the law are denounced against impenitent sinners, then is the kingdom of heaven shut. Yet touching the ministry of the Word, this distinction must be remembered; that otherwhiles the church is certain of the faith and repentance of some men, or some congregation; and then they may pronounce remission of sins absolutely. But otherwhiles they are uncertain of their faith and repentance, or of their impenitency; and then they must accordingly remit or retain men’s sins, that is, conditionally; pronouncing the remission of sins to all that repent: and denouncing damnation to all that repent not. And thus is the word to be publicly handled in God’s Church at this day, because our congregations are mixed companies, consisting of some that repent and believe, and of others that do not truly repent nor believe.</p></blockquote>

</figure><figure class="quote" id="q-082206d981" data-kw="">
<blockquote><p>For it is written in the law of Moses, ‘Thou shalt not muzzle the mouth of the ox that treadeth out the corn.’ Doth God take care for oxen?… Do ye not know that they which minister about holy things live of the things of the temple? and they which wait at the altar are partakers with the altar? Even so hath the Lord ordained that they which preach the gospel should live of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Start Here</a></span><span class="wk"><span class="lbl">Work:</span> <cite>At the Reformation Anabaptists, and later Quakers and many Independants, argued that, as the Levitical statutes are done away with, so no law remains to bind persons to systematic giving to the Christian ministry, and that ministers need not, and should not be paid. However, even before the Law with Moses, being yet a gentile, Abraham paid a tithe to the priest Melchizedek (Gen. 14:18-20; Heb. 7:4-9) and Jacob vowed to give a tenth unto God with all that He prospered him with (Gen. 28:20-22). If there were any question about the moral right of ministers to be paid (and the obligation for Christians to pay them), Paul argues this point from the general equity of Old Testament examples (1 Cor. 9:9:13-14):</cite></span></figcaption>

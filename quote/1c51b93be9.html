<main class="wrap"><figure class="quote" id="q-1c51b93be9" data-kw="">
<blockquote><p>This blissful sight of God, being quite above our present capacities, we must needs be much in the dark about it. But it seems to be something else, than the fight of that glory, which we will see with our bodily eyes, in the saints and in the man Christ, or any other splendour or refulgence from the Godhead whatsoever; for no created thing can be our chief good and happiness, nor fully satisfy our souls; and it is plain, that these things are somewhat different from God himself. Therefore I conceive, that the souls of the saints shall see God himself: so the scriptures teach us, that we shall see face to face, and know even as we are known, 1 Cor xiii 12. And that we shall see him as he is, 1 John iii. 12.

Howbeit the saints can never have an adequate conception of God; they cannot comprehend that which is infinite. They may touch the mountain, but cannot grasp it in their arms They cannot with one glance of their eye, behold what grows on every side: but the divine perfections will be an unbounded field, in which the glorified shall walk eternally, seeing more and more of God: since they can never come to the end of that which is infinite. They may bring their vessels to this ocean every moment, and fill them with new waters.

What a ravishing sight would it be, to see all the perfections, and lovely qualities, that are scattered here and there among the creatures, gathered together into one! but even such a sight would be infinitely below this blissful sight the saints shall have in heaven. For they shall see God, in whom all these perfections shall eminently appear, with infinitely more; whereof there is no vestige to be found in the creature. In him shall they see every thing desirable, and nothing but what is desirable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Human nature in its fourfold state, of primitive integrity, subsisting in the parents of Mankind in paradise. Entire depravation, subsisting in the unregenerate. Begun recovery, subsisting in the regenerate. And consummate happiness or misery, subsisting in all mankind in the future state. In severa</cite>, ed. Michael Boston (1784; United States: The Booksellers, 1787), p. 309.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fc4e5a232a" data-kw="">
<blockquote><p>For man knows God naturally in the same way as he desires him naturally. Now man desires him naturally insofar as he naturally desires happiness, which is a likeness of the divine goodness. Hence it does not follow that God considered in Himself is naturally known to man, but that his likeness is. Therefore, man must come by reasoning to know God in the likenesses to Him which he discovers in God’s effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1, ch. 11</span></figcaption>

</figure><figure class="quote" id="q-b0cd5d6e63" data-kw="">
<blockquote><p>For affections or passions in man, they are of two sorts:

1. Sensual belonging to the sensitive appetite and directed by the fantasy: these are common to brute beasts with us, and arise from one like temper and constitution in both. The object of these is all natural good or evil.

2. Rational, appertaining to the reasonable appetite or will, and guided by the understanding. These are proper to man, and they have their original from the substance of the reasonable soul, in which they always remain, not only when it is in the body, but even when tis severed from it. For fear, hope, love, hatred, joy, grief, etc. are in the damned and blessed spirits as well as living men. The object of these properly human passions is all moral and spiritual good or evil. I need not among so many learned, artists stand curiously upon the distinction of these two sorts of passions in man: the identity of names in both sorts has caused some confusion, but in reason the diversity of their nature is evident. Wherefore I go on to see what is meant by excitation or stirring up of the affections: whereby we can understand nothing else but their right and orderly motions about their proper objects. As in the particulars, sensual passions are then duly excited when they are moved about any natural good or evil, according to the instinct of nature in brute beasts and according to the same instinct of nature in man, but guided and moderated by right reason. Reasonable affections are then duly stirred up when their motions about all spiritual and moral good or evil are conformable to the quality of the object affected and to the rules of a rightly informed understanding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith</cite>, … (London: 1627), pp. 125-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-4ad15fa0e7" data-kw="">
<blockquote><p>Heaven is that place alone where is to [be] obtained our highest end, and highest good. God hath made us for himself: “of God, and through God, and to God are all things” (Romans 11:36). Therefore then do we attain to our highest end, when we are brought to God. But that is by being brought to heaven, for that is God’s throne; that is the place of his special presence, and of his glorious residence. There is but a very imperfect union with God to be had in this world: a very imperfect knowledge of God in the midst of abundance of darkness, a very imperfect conformity to God, mingled with abundance of enmity and estrangement. Here we can serve and glorify God but in an exceeding imperfect manner, our service being mingled with much sin and dishonouring to God.

But when we get to heaven, if ever that be, there we shall be brought to a perfect union with God. There we shall have the clear views of God’s glory: we shall see face to face, and know as we are known [1 Corinthians 13:12]. There we shall be fully conformed to God, without any remains of sin: “we shall be like him; for we shall see him as he is” [1 John 3:2]. There we shall serve God perfectly. We shall glorify him in an exalted manner, and to the utmost of the powers and capacity of our nature. Then we shall perfectly give up ourselves to God; then will our hearts be wholly a pure and holy offering to God, offered all in the flame of divine love.

In heaven alone is attainment of our highest good. God is the highest good of the reasonable creature. The enjoyment of him is our proper happiness, and is the only happiness with which our souls can be satisfied. To go to heaven, fully to enjoy God, is infinitely better than the most pleasant accommodations here: better than fathers and mothers, husbands, wives, or children, or the company of any or all earthly friends. These are but shadows; but God is the substance. These are but scattered beams; but God is the sun. These are but streams; but God is the fountain. These are but drops; but God is the ocean.

Therefore, it becomes us to spend this life only as a journey towards heaven, as it becomes us to make the seeking of our highest end, and proper good, the whole work of our lives; and we should subordinate all the other concerns of life to it. Why should we labour for anything else, or set our hearts on anything else, but that which is our proper end, and true happiness?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Christian’s Life a Journey Towards Heaven</cite>, (1734) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 437-38.</span></figcaption>

appiness%2C+and+is+the+only+happiness+with+which+our+souls+can+be+satisfied.+To+go+to+heaven%2C+fully+to+enjoy+God%2C+is+infinitely+better+than+the+most+pleasant+accommodations+here%3A+better+than+fathers+and+mothers%2C+husbands%2C+wives%2C+or+children%2C+or+the+company+of+any+or+all+earthly+friends.+These+are+but+shadows%3B+but+God+is+the+substance.+These+are+but+scattered+beams%3B+but+God+is+the+sun.+These+are+but+streams%3B+but+God+is+the+fountain.+These+are+but+drops%3B+but+God+is+the+ocean.%0A%0ATherefore%2C+it+becomes+us+to+spend+this+life+only+as+a+journey+towards+heaven%2C+as+it+becomes+us+to+make+the+seeking+of+our+highest+end%2C+and+proper+good%2C+the+whole+work+of+our+lives%3B+and+we+should+subordinate+all+the+other+concerns+of+life+to+it.+Why+should+we+labour+for+anything+else%2C+or+set+our+hearts+on+anything+else%2C+but+that+which+is+our+proper+end%2C+and+true+happiness%3F%E2%80%9D%0A%0A%E2%80%94+Jonathan+Edwards%2C+The+True+Christian%E2%80%99s+Life+a+Journey+Towards+Heaven%2C+%281734%29+in+Mark+Valeri+%28ed.%29%2C+Sermons+and+Discourses%2C+1730-1733%3A+The+Works+of+Jonathan+Edwards+Volume+17+%28New+Haven+CN%3A+Yale+University+Press%2C+2000%29%2C+pp+437-38.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4ad15fa0e7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4ad15fa0e7.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/08/05/jonathan-edwards-on-heaven-and-our-highest-good/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>I. There are three kinds or differences of life: there is a life of nature, which the apostle calls Natural. There is a life of Grace, which the sons of God alone do enjoy in this world: there is a life of Glory, which consists in the vision of God.

II. Life eternal is two ways taken: Metonymically, both for the way to life, and for Christ Himself: Properly, for the state of the blessed after this life.

III. There is one vision of God natural, in the things created; another specular, or symbolical, by resemblances and signs; another of faith, by the doctrine and doings of Christ; another of present sight, or of glory to come, when we shall see God face to face.</p></blockquote>

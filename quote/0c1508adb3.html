<blockquote><p>9. It seems to threaten a snare when inquiry about the duty of the time is pursued without respect to the present case and circumstances thereof. For thus a snare may wait in a thing at other times indifferent, the neglect whereof under some special circumstances may be a quitting their duty; and the doing also, or yielding to something in another case warrantable, at sometimes may fall under a moral prohibition. As this, when a thing in itself indifferent, circa sacra et cultum Dei [around sacred things and the worship of God], is pressed by the magistrate as necessary by virtue of his sole command, and to the subjecting the godly in things wherein they are not subject, and to the prejudice of an other jurisdiction; can there be an inquiry about this in the general, without a particular application to the complex case? It may be said a snare is then on the entry when that consideration of the prophet is not much regarded in the present question, ‘Is this a time for such a thing?’ For the disciples to refresh themselves with sleep was a piece of innocent duty; but that they could not watch this one hour with their Master in his sufferings, must needs vary the case, for it was in so far a deserting Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-fleming.html">Robert Fleming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fulfilling of the Scripture</cite>, … (Boston, 1743), Appendix, pp. 508-9</span></figcaption>

<blockquote><p>Neither, however, do we think ourselves bound to teach that God could not forbid sin but under the penalty of eternal death; for we hold that not one or another kind of punishment is necessary, but that punishment itself is necessary, and the punishment, according to the rule of God’s wisdom and justice, is death. Moreover, a rational creature, conscious of its proper subjection and obediential dependence, being created and existing, God did not account it at all necessary to forbid it to sin by a free act of his will, under one penalty or another; for both these follow from the very situation of the creature, and the order of dependence,–namely, that it should not transgress by withdrawing itself from the right and dominion of the Creator, and if it should transgress, that it should be obnoxious and exposed to coercion and punishment. But it being supposed that God should forbid sin by an external legislation, the appointment of punishment, even though there should be no mention made of it, must be coequal with the prohibition. …The modification of punishment respects either its appointment or infliction. Punishment itself is considered either in respect of its general end, which is the punishment of transgression, and has a regard to the condition of the creatures with respect to God; or in respect of some special end, and has a respect to the condition of the creatures among themselves. But whatever modification punishment may undergo, provided it attain its proper end, by accomplishing the object in view, the nature of punishment is preserved no less than if numberless degrees were added to it. As to the establishment of punishment, then, in a human court, as it has not primarily and properly a respect to the punishment of transgression, nor a regard to the condition of the creatures with respect to God, but with respect to one another, that degree of punishment is just which is fit and proper for accomplishing the proposed end. The punishment, then, of theft by a quadruple restitution had in its appointment no such modification conjoined with it as could render it unfit and improper in respect of the end proposed, among that people to whom that law concerning retributions was given; but as the infliction of punishment, according to the sentence of the law, depended on the supreme Ruler of that people, it belonged to him to provide that no temporal dispensation with punishment exercised by him, in right of his dominion, should turn out to the injury of the commonwealth. …But not even in a human court can any such modification be admitted as would render the punishment useless in respect of its end; nor, in respect of God, do we think any degree or mode of punishment necessary, but such as may answer the end of the punishment, so far as respects the state of the creatures with respect to God…</p></blockquote>

</figure><figure class="quote" id="q-0617859933" data-kw="">
<blockquote><p>5thly. I shall only propose one thing more to your consideration. Although the institutions and examples of the Old Testament, of the duty of magistrates in the things and about the worship of God, are not, in their whole latitude and extent, to be drawn into rules that should be obligatory to all magistrates now, under the administration of the gospel,-and that because the magistrate then was ‘custos, vindex, et administrator legis judicialis, et politiae Mosaicae,’ [the custodian, vindicator and administrator of the Judicial Law and Mosaic polity] from which, as most think, we are freed;–yet, doubtless, there is something moral in those institutions, which, being unclothed of their Judaical form, is still binding to all in the like kind, as to some analogy and proportion. Subduct [subtract] from those administrations what was proper to, ad lies upon the account of, the church and nation of the Jews, and what remains upon the general notion of a church and nation must be everlastingly binding.</p></blockquote>

<blockquote><p>If any say that I derogate much from the authority of the Church when I do nothing which she prescribes except I see it lawful and expedient, because I should do this much for the exhortation and admonition of a brother. Answer:

1. I give far more reverence to the direction of the Church than to the admonition of a brother, because that is ministerial, this fraternal: that comes from authority, this only from charity: that is public, this private: that is given by many, this by one: And finally, the Church has a calling to direct me in some things wherein a brother has not.

2. If it be still instanced that in the point of obedience, I do no more for the Church than for any brother because I am bound to do that which is made evident to be lawful and expedient, though a private Christian do but exhort me to it, or, whether I be exhorted to it or not. For answer to this I say that I will obey the directions of the Church in many things rather than the directions of a brother; for in two things which are in themselves indifferent, and none of them inexpedient, I will do that which the Church requires, though my brother should exhort me to the contrary. But always I hold me at this sure ground, that I am never bound in conscience to obey the ordinances of the Church except they be evidently lawful and expedient. This is that, sine quo non obligant [without which they do not bind], and also that which does chiefly bind, though it be not the only thing which binds. Now for making the matter more plain we must consider that the constitutions of the Church are either lawful or unlawful: if unlawful, they bind not at all: if lawful, they are either concerning things necessary as Acts 15:28, and then the necessity of the things do bind, whether the Church ordain them or not; or else concerning things indifferent, as when: the Church ordains that in great towns there shall be sermon on such a day of the week and public prayers every day at such an hour, here it is not the bare authority of the Church that binds, without respect to the lawfulness or expediency of the thing itself which is ordained (else we were bound to do everything which the Church ordains, were it never so unlawful, for quod competit alicui qua tali, competit omni tali. We behold the authority of the Church making laws, as well in unlawful ordinances as in lawful, not yet is it the lawfulness or expediency of the thing itself without respect to the ordinance of the Church (for possibly other times and diets were as lawful and expedient too for such exercises, as those ordained by the Church), but it is the authority of the Church prescribing a thing lawful or expedient. In such a case then neither does the authority of the Church bind except the thing be lawful and expedient, not does the lawfulness and expediency of the thing bind except the Church ordain it, but both these jointly do bind.</p></blockquote>

<blockquote><p>Q. What are the degrees of Concupiscence forbidden here?

A. The first is, wandering and evil thoughts, though we never like of them: for even the very rising of such thoughts in our minds, argueth our corruption of nature: for were it not for that inborn corruption, such thoughts could not once enter into our souls, further then they were offered unto us by some outward tentation of the devil, or of the world, as it was unto our Saviour Christ.

And although in the incorrupt state of man, he might dutifully have thought of the transgression of the Commandment, with a perfect hatred of it; yet the same should not have been (as now it is) suddenly rising in the mind, without thinking or meditation of the naughtiness and hatefulness thereof; where now these thoughts rise suddenly, and the hatred and detestation cometh after, and is not in such perfection as then it should have been. Whereas the Lord our God hath the eyes of his glory so pure, that he will not allow of the least corruption in the temple of our hearts, where he seateth himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), pp 160-61.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

<blockquote><p>But still the images of such things live in my memory, of which I have spoken much, which my habitual way of life has deeply imprinted there, and they occur to me awake, although lacking strength, but in sleep not only to the point of pleasure, but even to the point of consent and an act very like the reality. And such is the force of illusion in my soul and in my flesh, that false visions persuade my sleeping mind of things which true visions cannot persuade my waking mind. Cannot your hand, O All-Powerful God, heal all the languors of my soul and by a more abundant grace extinguish even the lascivious motions of my sleep? You will increase in me more and more, O Lord, your gifts, that my soul may not be rebellious to itself and that not only in sleep it may not perpetrate those turpitudes of corruptions through animal imaginations even to the flow of the flesh, but may not even consent to them…</p></blockquote>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bellarmine Disarmed</cite>, vol. 4, ch. 3 (Of Original Sin)</span></figcaption>

<blockquote><p>Object. § I. But here mark a plot of spiritual treason. Satan, joining with our corruption, setteth the wit on work to persuade the soul that this inward rebellion is not so bad, because it is natural to us, as a condition of nature rising out of the first principles in our creation, and was curbed in by the bridle of original righteousness, which they would have accessory and supernatural, and therefore allege that concupiscence is less odious and more excusable in us, and so no great danger in yielding and betraying our souls unto it, and by that means persuading us that that which is our deadliest enemy hath no harm in it, nor meaneth any to us.

Ans. This rebellion of lusts against the understanding is not natural, as our nature came out of God’s hands at the first, Gen. i. 27; for this, being evil and the cause of evil, could not come from God, who is good and the cause of all good, and nothing but good, who, upon the creation of all things, pronounced them good, and, after the creation of man, pronounced of all things that they were very good, ver. 31. Now, that which is ill and very ill cannot be seated at the same time in that which is good and very good. God created man at the first right; he of himself ‘sought out many inventions,’ Eccles. vii. 29.

As God beautified the heaven with stars, and decked the earth with variety of plants, and herbs, and flowers, so he adorned man, his prime creature hero below, with all those endowments that were fit for a happy condition; and original righteousness was fit and due to an original and happy condition. Therefore, as the angels were created with all angelical perfections, and as our bodies were created in an absolute temper of all the humours, so the soul was created in that sweet harmony wherein there was no discord, as an instrument in tune, fit to be moved to any duty; as a clean, neat glass, the soul represented God’s image and holiness.

§.II. Therefore it is so far, that concupiscence should be natural, that the contrary to it, namely, righteousness, wherein Adam was created, was natural to him; though it were planted in man’s nature by God, and so in regard of the cause of it, was supernatural; yet because it was agreeable to that happy condition, without which he could not subsist, in that respect it was natural, and should have been derived, if he had stood, together with his nature, to his posterity. As heat in the air, though it hath its first impression from the heat of the sun, yet is natural, because it agreeth to the nature of that element; and though man be compounded of a spiritual and earthly substance, yet it is natural that the baser earthly part should be subject to the superior, because where there is different degrees of worthiness, it is fit there should be a subordination of the meaner to that which is in order higher.

The body naturally desires food and bodily contentments, yet in a man endued with reason, this desire is governed so as it becomes not inordinate. A beast sins not in its appetite, because it hath no power above to order it. A man that lives in a solitary place, far remote from company, may take his liberty to live as it pleaseth him; but if he comes to live under the government of some well-ordered city, then he is bound to submit to the laws and customs of that city, under penalty upon any breach of order; so the risings of the soul, howsoever in other creatures they are not blameable, having no commander in themselves, above them, yet in man they are to be ordered by reason and judgment.

Therefore it cannot be, that concupiscence should be natural, in regard of the state of creation. It was Adam’s sin; which had many sins in the womb of it, that brought this disorder upon the soul. Adam’s person first corrupted our nature, and nature being corrupted, corrupts our persons, and our persons being corrupted, increase the corruption of our nature, by custom of sinning, which is another nature in us. As a stream, the farther it runs from the spring head, the more it enlargeth its channel, by the running of lesser rivers into it, until it empties itself into the sea; so corruption, till it be overpowered by grace, swelleth bigger and bigger, so that though this disorder was not natural, in regard of the first creation, yet since the fall it has become natural, even as we call that which is common to the whole kind, and propagated from parents to their children, to be natural; so that it is both natural and against nature, natural now, but against nature in its first perfection.

And because corruption is natural to us, therefore, 1, We delight in it; whence it comes to pass, that our souls are carried along in an easy current, to the committing of any sin without opposition. 2. Because it is natural, therefore it is unwearied and restless, as light bodies are not wearied in their motion upwards, nor heavy bodies in their motion downwards, nor a stream in its running to the sea, because it is natural: hence it is that the ‘old man,’ Eph. iv. 22, is never tired in the ‘works of the flesh,’ Gal. v. 19, nor never drawn dry.

When men cannot act sin, yet they will love sin, and act it over again by pleasing thoughts of it, and by sinful speculations suck out the delight of sin; and are grieved, not for their sin, but because they want strength and opportunity to commit it; if sin would not leave them, they would never leave sin. This corruption of our nature is not wrought in us by reason and persuasions, for then it might be satisfied with reasons, but it is in us by way of a natural inclination, as iron is carried to the loadstone; and till our natures be altered, no reason will long prevail, but our sinful disposition, as a stream stopped for a little while, will break out with greater violence.

3. Being natural, it needs no help, as the earth needs no tillage to bring forth weeds. When our corrupt nature is carried contrary to that which is good, it is carried of itself, as when Satan lies or murders, it comes from his own cursed nature; and though Satan joineth with our corrupt nature, yet the proneness to sin, and the consent unto it, is of ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Soul’s Conflict with Itself, and Victory Over Itself by Faith. A Treatise of the Inward Disquietments of Distressed Spirits, with Comfortable Remedies to Establish them</cite>, (1635) in The Complete Works of Richard Sibbes, ed. Alexander B. Grosart, Nichol’s Series of Standard Divines. Puritan Period (7 vols, Edinburgh: James Nichol, 1862-64), 1: 172-74.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

The body naturally desires food and bodily contentments, yet in a man endued with reason, this desire is governed so as it becomes not inordinate. A beast sins not in its appetite, because it hath no power above to order it. A man that lives in a solitary place, far remote from company, may take his liberty to live as it pleaseth him; but if he comes to live under the government of some well-ordered city, then he is bound to submit to the laws and customs of that city, under penalty upon any breach of order; so the risings of the soul, howsoever in other creatures they are not blameable, having no commander in themselves, above them, yet in man they are to be ordered by reason and judgment.

Therefore it cannot be, that concupiscence should be natural, in regard of the state of creation. It was Adam’s sin; which had many sins in the womb of it, that brought this disorder upon the soul. Adam’s person first corrupted our nature, and nature being corrupted, corrupts our persons, and our persons being corrupted, increase the corruption of our nature, by custom of sinning, which is another nature in us. As a stream, the farther it runs from the spring head, the more it enlargeth its channel, by the running of lesser rivers into it, until it empties itself into the sea; so corruption, till it be overpowered by grace, swelleth bigger and bigger, so that though this disorder was not natural, in regard of the first creation, yet since the fall it has become natural, even as we call that which is common to the whole kind, and propagated from parents to their children, to be natural; so that it is both natural and against nature, natural now, but against nature in its first perfection.

And because corruption is natural to us, therefore, 1, We delight in it; whence it comes to pass, that our souls are carried along in an easy current, to the committing of any sin without opposition. 2. Because it is natural, therefore it is unwearied and restless, as light bodies are not wearied in their motion upwards, nor heavy bodies in their motion downwards, nor a stream in its running to the sea, because it is natural: hence it is that the ‘old man,’ Eph. iv. 22, is never tired in the ‘works of the flesh,’ Gal. v. 19, nor never drawn dry.

When men cannot act sin, yet they will love sin, and act it over again by pleasing thoughts of it, and by sinful speculations suck out the delight of sin; and are grieved, not for their sin, but because they want strength and opportunity to commit it; if sin would not leave them, they would never leave sin. This corruption of our nature is not wrought in us by reason and persuasions, for then it might be satisfied with reasons, but it is in us by way of a natural inclination, as iron is carried to the loadstone; and till our natures be altered, no reason will long prevail, but our sinful disposition, as a stream stopped for a little while, will break out with greater violence.

3. Being natural, it needs no help, as the earth needs no tillage to bring forth weeds. When our corrupt nature is carried contrary to that which is good, it is carried of itself, as when Satan lies or murders, it comes from his own cursed nature; and though Satan joineth with our corrupt nature, yet the proneness to sin, and the consent unto it, is of ourselves.”

— Richard Sibbes, The Soul’s Conflict with Itself, and Victory Over Itself by Faith. A Treatise of the Inward Disquietments of Distressed Spirits, with Comfortable Remedies to Establish them, (1635) in The Complete Works of Richard Sibbes, ed. Alexander B. Grosart, Nichol’s Series of Standard Divines. Puritan Period (7 vols, Edinburgh: James Nichol, 1862-64), 1: 172-74.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObject.+%C2%A7+I.+But+here+mark+a+plot+of+spiritual+treason.+Satan%2C+joining+with+our+corruption%2C+setteth+the+wit+on+work+to+persuade+the+soul+that+this+inward+rebellion+is+not+so+bad%2C+because+it+is+natural+to+us%2C+as+a+condition+of+nature+rising+out+of+the+first+principles+in+our+creation%2C+and+was+curbed+in+by+the+bridle+of+original+righteousness%2C+which+they+would+have+accessory+and+supernatural%2C+and+therefore+allege+that+concupiscence+is+less+odious+and+more+excusable+in+us%2C+and+so+no+great+danger+in+yielding+and+betraying+our+souls+unto+it%2C+and+by+that+means+persuading+us+that+that+which+is+our+deadliest+enemy+hath+no+harm+in+it%2C+nor+meaneth+any+to+us.%0A%0AAns.+This+rebellion+of+lusts+against+the+understanding+is+not+natural%2C+as+our+nature+came+out+of+God%E2%80%99s+hands+at+the+first%2C+Gen.+i.+27%3B+for+this%2C+being+evil+and+the+cause+of+evil%2C+could+not+come+from+God%2C+who+is+good+and+the+cause+of+all+good%2C+and+nothing+but+good%2C+who%2C+upon+the+creation+of+all+things%2C+pronounced+them+good%2C+and%2C+after+the+creation+of+man%2C+pronounced+of+all+things+that+they+were+very+good%2C+ver.+31.+Now%2C+that+which+is+ill+and+very+ill+cannot+be+seated+at+the+same+time+in+that+which+is+good+and+very+good.+God+created+man+at+the+first+right%3B+he+of+himself+%E2%80%98sought+out+many+inventions%2C%E2%80%99+Eccles.+vii.+29.%0A%0AAs+God+beautified+the+heaven+with+stars%2C+and+decked+the+earth+with+variety+of+plants%2C+and+herbs%2C+and+flowers%2C+so+he+adorned+man%2C+his+prime+creature+hero+below%2C+with+all+those+endowments+that+were+fit+for+a+happy+condition%3B+and+original+righteousness+was+fit+and+due+to+an+original+and+happy+condition.+Therefore%2C+as+the+angels+were+created+with+all+angelical+perfections%2C+and+as+our+bodies+were+created+in+an+absolute+temper+of+all+the+humours%2C+so+the+soul+was+created+in+that+sweet+harmony+wherein+there+was+no+discord%2C+as+an+instrument+in+tune%2C+fit+to+be+moved+to+any+duty%3B+as+a+clean%2C+neat+glass%2C+the+soul+represented+God%E2%80%99s+image+and+holiness.%0A%0A%C2%A7.II.+Therefore+it+is+so+far%2C+that+concupiscence+should+be+natural%2C+that+the+contrary+to+it%2C+namely%2C+righteousness%2C+wherein+Adam+was+created%2C+was+natural+to+him%3B+though+it+were+planted+in+man%E2%80%99s+nature+by+God%2C+and+so+in+regard+of+the+cause+of+it%2C+was+supernatural%3B+yet+because+it+was+agreeable+to+that+happy+condition%2C+without+which+he+could+not+subsist%2C+in+that+respect+it+was+natural%2C+and+should+have+been+derived%2C+if+he+had+stood%2C+together+with+his+nature%2C+to+his+posterity.+As+heat+in+the+air%2C+though+it+hath+its+first+impression+from+the+heat+of+the+sun%2C+yet+is+natural%2C+because+it+agreeth+to+the+nature+of+that+element%3B+and+though+man+be+compounded+of+a+spiritual+and+earthly+substance%2C+yet+it+is+natural+that+the+baser+earthly+part+should+be+subject+to+the+superior%2C+because+where+there+is+different+degrees+of+worthiness%2C+it+is+fit+there+should+be+a+subordination+of+the+meaner+to+that+which+is+in+order+higher.%0A%0AThe+body+naturally+desires+food+and+bodily+contentments%2C+yet+in+a+man+endued+with+reason%2C+this+desire+is+governed+so+as+it+becomes+not+inordinate.+A+beast+sins+not+in+its+appetite%2C+because+it+hath+no+power+above+to+order+it.+A+man+that+lives+in+a+solitary+place%2C+far+remote+from+company%2C+may+take+his+liberty+to+live+as+it+pleaseth+him%3B+but+if+he+comes+to+live+under+the+government+of+some+well-ordered+city%2C+then+he+is+bound+to+submit+to+the+laws+and+customs+of+that+city%2C+under+penalty+upon+any+breach+of+order%3B+so+the+risings+of+the+soul%2C+howsoever+in+other+creatures+they+are+not+blameable%2C+having+no+commander+in+themselves%2C+above+them%2C+yet+in+man+they+are+to+be+ordered+by+reason+and+judgment.%0A%0ATherefore+it+cannot+be%2C+that+concupiscence+should+be+natural%2C+in+regard+of+the+state+of+creation.+It+was+Adam%E2%80%99s+sin%3B+which+had+many+sins+in+the+womb+of+it%2C+that+brought+this+disorder+upon+the+soul.+Adam%E2%80%99s+person+first+corrupted+our+nature%2C+and+nature+being+corrupted%2C+corrupts+our+persons%2C+and+our+persons+being+corrupted%2C+increase+the+corruption+of+our+nature%2C+by+custom+of+sinning%2C+which+is+another+nature+in+us.+As+a+stream%2C+the+farther+it+runs+from+the+spring+head%2C+the+more+it+enlargeth+its+channel%2C+by+the+running+of+lesser+rivers+into+it%2C+until+it+empties+itself+into+the+sea%3B+so+corruption%2C+till+it+be+overpowered+by+grace%2C+swelleth+bigger+and+bigger%2C+so+that+though+this+disorder+was+not+natural%2C+in+regard+of+the+first+creation%2C+yet+since+the+fall+it+has+become+natural%2C+even+as+we+call+that+which+is+common+to+the+whole+kind%2C+and+propagated+from+parents+to+their+children%2C+to+be+natural%3B+so+that+it+is+both+natural+and+against+nature%2C+natural+now%2C+but+against+nature+in+its+first+perfection.%0A%0AAnd+because+corruption+is+natural+to+us%2C+therefore%2C+1%2C+We+delight+in+it%3B+whence+it+comes+to+pass%2C+that+our+souls+are+carried+along+in+an+easy+current%2C+to+the+committing+of+any+sin+without+opposition.+2.+Because+it+is+natural%2C+therefore+it+is+unwearied+and+restless%2C+as+light+bodies+are+not+wearied+in+their+motion+upwards%2C+nor+heavy+bodies+in+their+motion+downwards%2C+nor+a+stream+in+its+running+to+the+sea%2C+because+it+is+natural%3A+hence+it+is+that+the+%E2%80%98old+man%2C%E2%80%99+Eph.+iv.+22%2C+is+never+tired+in+the+%E2%80%98works+of+the+flesh%2C%E2%80%99+Gal.+v.+19%2C+nor+never+drawn+dry.%0A%0AWhen+men+cannot+act+sin%2C+yet+they+will+love+sin%2C+and+act+it+over+again+by+pleasing+thoughts+of+it%2C+and+by+sinful+speculations+suck+out+the+delight+of+sin%3B+and+are+grieved%2C+not+for+their+sin%2C+but+because+they+want+strength+and+opportunity+to+commit+it%3B+if+sin+would+not+leave+them%2C+they+would+never+leave+sin.+This+corruption+of+our+nature+is+not+wrought+in+us+by+reason+and+persuasions%2C+for+then+it+might+be+satisfied+with+reasons%2C+but+it+is+in+us+by+way+of+a+natural+inclination%2C+as+iron+is+carried+to+the+loadstone%3B+and+till+our+natures+be+altered%2C+no+reason+will+long+prevail%2C+but+our+sinful+disposition%2C+as+a+stream+stopped+for+a+little+while%2C+will+break+out+with+greater+violence.%0A%0A3.+Being+natural%2C+it+needs+no+help%2C+as+the+earth+needs+no+tillage+to+bring+forth+weeds.+When+our+corrupt+nature+is+carried+contrary+to+that+which+is+good%2C+it+is+carried+of+itself%2C+as+when+Satan+lies+or+murders%2C+it+comes+from+his+own+cursed+nature%3B+and+though+Satan+joineth+with+our+corrupt+nature%2C+yet+the+proneness+to+sin%2C+and+the+consent+unto+it%2C+is+of+ourselves.%E2%80%9D%0A%0A%E2%80%94+Richard+Sibbes%2C+The+Soul%E2%80%99s+Conflict+with+Itself%2C+and+Victory+Over+Itself+by+Faith.+A+Treatise+of+the+Inward+Disquietments+of+Distressed+Spirits%2C+with+Comfortable+Remedies+to+Establish+them%2C+%281635%29+in+The+Complete+Works+of+Richard+Sibbes%2C+ed.+Alexander+B.+Grosart%2C+Nichol%E2%80%99s+Series+of+Standard+Divines.+Puritan+Period+%287+vols%2C+Edinburgh%3A+James+Nichol%2C+1862-64%29%2C+1%3A+172-74.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbf59da810e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bf59da810e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/07/09/richard-sibbes-on-concupiscence-as-a-product-of-the-fall/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Now of Churches faulty and corrupted, some raze the foundation; others, on the true foundation build timber, hay, stubble. From those we must separate; from these we may not. Peter’s is eternal, ‘Whither shall we go from Thee; Thou hast the words of eternal life.’ (Jn. 6:68) Where these words are found, woe be to us if we be not found. Amongst many good separations then, yours cannot be separated from evil, for that we should so far separate from the evil that therefore we should separate from God’s children in the communion of the holy things of God, that for some (after your worst done) not-fundamental corruptions, we should separate from that Church in whose womb we were conceived, and from betwixt whose knees we fell to God: in a word (as one of yours once said) to separate not only from visible evil, but from visible good, as all Antichristian: who but yours can think less than absurd and impious? Grant we should be clean separated from the world, yet if we be not, must you be separated from us?¹ ¹ Neque propter paleam relinquim are am Domini, neque propter pisces malos rumpimus retia Domini. Augustine, Epistle 48 Do but stay till God have separated us from Himself: will the wise husbandman cast away his corn-heap for the chaff and dust? Shall the fisher cast away a good draught because his drag-net has weeds? Does God separate from the faithful soul, because it has some corruptions, her inmates, though not her commanders?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Common Apology of the Church of England against the Unjust Challenges of the over-just Sect, commonly called Brownists</cite>, … (London: Macham, 1610), sect. 4, pp. 10-11</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a2bba13919" data-kw="">
<blockquote><p>Are we then heretics, condemned in ourselves? wherein overthrow we the foundation? What other God, Savior, Scriptures, justification, sacraments, Heaven do they teach beside us? Can all the masters of Seperation, yea can all the churches in Christendom set forth a more exquisite and worthy confession of Faith than is contained in the [39] Articles of the Church of England? Who can hold these and be heretical? Or, from which of these are we revolted? But to make this good they have taught you to say that every truth in Scripture is fundamental; so fruitful is error of absurdities, whereof still one breeds another more deformed than itself. That Trophimus was left at Miletum sick, that Paul’s cloak was left at Troas, that Gaius, Paul’s host, saluted the Romans, that Nabal was drunk; or that Thamar baked cakes [2 Sam. 13:8-10], and a thousand of this nature are fundamental: How large is the Separatists’ Creed, that has all these articles? If they say all Scripture is of the same Author, of the same authority: so say we, but not of the same use. Is it as necessary for a Christian to know that Peter hosted with one Simon, a tanner in Joppa, as that Jesus Christ the Son of God was born of the Virgin Mary? What a monster is this of an opinion, that all truths are equal? That this spiritual house should be all foundation, no walls, no roof? Can no man be saved but he that knows everything in Scripture?… You see then that both all truths must not of necessity be known, and some must: and these we justly call fundamental: which who so holds, all his hay and stubble (through the mercy of God) condemn him not: stil he has right to the church on earth, and hope in heaven: but whither every truth be fundamental, or necessary: Discipline (you say) is so: indeed necessary to the well-being of a church, no more: it may be true without it, not perfect. Christ compares his spouse to an army with banners: as order is to an army, so is discipline to the Church: if the troops be not well marshalled in their several ranks, and move not forward, according to the discipline of war, it is an army still: confusion may hinder their sucess, it cannot bereave them of their name: it is as beautiful proportion to the body, an hedge to a vineyard, a wall to a city, an hem to a garment, ceiling to an house. It may be a body, vineyard, city, garment, house, without them: it cannot be well and perfect. Yet which of our adversaries will say we have no discipline? Some they grant, but not the right: as if they said, Your city has a brick wall indeed, but it should have one of hewn stone; your vineyard is hedged, but it should be paled and ditched: while they cavil at what we want, we thank God for what we have; and so much we have, in spite of all detraction, as makes us both a true Church and a worthy one. But the main quarrel is against but ministry and form of worship: let these be examined; this is the circle of their censure: No Church, therefore no ministry; and no ministry, therefore no Church… What would they have? Have we not competent gifts from aboue, for so great a function? Are we all unlearned, insufficient? Not a man that knows to devide the word aright? As Paul to the Corinthins, is it so that there is not one wise man amongst us? No man will affirm it: some of them have censured our excess in some knowledge; none, our defect in all: What then? Have we not a true desire to do faithful service to God and his Church? No zeal for God’s glory?…</p></blockquote>

<blockquote><p>3. That place must needs be holy where the Lord dwells as a Master in his house, teaching, ordering and supplying all necessaries. Where Christ, the holy Son of God, walks in the midst of the seven golden candlesticks, being conversant among the flocks of shepherds… Surely, this is Bethel, the house of God, and the gate of Heaven. This teaches us not to despise our [Anglican] assemblies, nor to think our churches unholy for some corruptions. Look upon Jerusalem, Mt. 23:37; you shall see the eleven tribes were apostates, there were in it dumb dogs, Isa. 56:10, there were scribes and Pharisees, hypocrites. At this time the doctrine of the Law was corrupted by the false glosses of the Pharisees, and the Temple was almost a den of thieves, full of buyers and sellers. Yet for all this, the evangelist calls it ‘the holy city,’ even when it had more corruptions in it than the Church of England has at this day. Why?:

1. Because there the service of the true God was set up in the Temple, the Word preached, sacrifices offered, and the meetings of the Church of God.

2. Because as yet they had not received a bill of divorce. Have we not the Word truly preached, and the sacraments for substance truly administered? And for discipline, I will say, I wish we had the execution of so much as the Church allows. Or, when did the Lord give us a bill of divorce? Or, what Church has convinced us that we cannot be acknowledged for a true Church? If they say, they of the Separation have, I answer:

1. They have labored to discover some errors, but none fundamental in us, nor without as many in themselves.

2. We… must not think it strange if some unstable persons forsake our communion, since in the golden and flourishing age of the apostles there were some such, Heb. 10:25.</p></blockquote>

hout+as+many+in+themselves.+2.+We%E2%80%A6+must+not+think+it+strange+if+some+unstable+persons+forsake+our+communion%2C+since+in+the+golden+and+flourishing+age+of+the+apostles+there+were+some+such%2C+Heb.+10%3A25.%E2%80%9D%0A%0A%E2%80%94+Thomas+Taylor%2C+Christ%E2%80%99s+Combat+%26+Conquest%3A+or+the+Lion+of+the+Tribe+of+Judah+Vanquishing+the+Roaring+Lion%2C+assaulting+Him+in+three+most+fierce+and+hellish+temptations%2C+expounded%2C+...+%28Cambridge%3A+Legge%2C+1618%29%2C+verses+5-6%2C+pp.+165-66&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4ece83658b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4ece83658b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=3.%20That%20place%20must%20needs%20be,there%20were%20some%20such%2C%20Heb.%2010%3A25&amp;text=3.%20That%20place%20must%20needs%20be%20holy%20where&amp;text=the%20apostles%20there%20were%20some%20such%2C%20Heb.%2010%3A25" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c90c09a9fd" data-kw="">
<blockquote><p>The true matter of a true church is such as profess saving truth taught in the Scriptures, and [this] is proved thus: That which makes a man a true member of a true church, that does make a true church (for members doe constitute the whole): but profession of saving truth makes a true member of a true church; for Simon Magus, upon his profession was admitted a member, till he fell away (Acts 8:13, 37, 38): and the eunuch upon the same profession was admitted too by baptism, and for ought we know continued forever. Now, that we in the church of England do profess saving truth, according to the Scriptures cannot be denied.</p></blockquote>

</figure><figure class="quote" id="q-38d5a0ab65" data-kw="">
<blockquote><p>2. It is not a bare union of men that makes a Church a true Church, but that union must have truth for its foundation; else you know thieves and robbers and highway-men and pirates, and buccaneers, because they agree among themselves, might lay claim to this title, and the most perverse heretics, because they agree in certain points, might say they are the true Church… … And indeed, that which justifies the Protestant Churches’ separation from her [Rome], or breaking peace and communion with her is:

1. Because she would impose that upon the consciences of men which Christ and his apostles never imposed.

2. Because she has turned the spiritual worship of the Gospel into carnal and mechanical devotion and introduced innumerable superstitions… … 5. Because rejecting the supreme authority of the Scriptures, which are the sole rule of Faith, she has made her pretended head, and such councils as he shall call or approve of, the sole dictators and expositors of the doctrine of Christ, requiring blind obedience to their decisions… The divisions among Protestant Churches are to be deplored so much the more because the points they differ in are inconsiderable and might easily be composed if men had but peaceable tempers and were resolved to lay aside interest and carnal respects, and punctilios of honor and credit, etc. for they all agree in fundamentals, all are satisfied that the Church of Rome has notoriously deviated from the simplicity of the Gospel; and the matters in difference, are things in which salvation is not concerned. And upon that account their labours deserve great commendations, who heretofore and very lately have endeavored to reconcile the Protestant Churches into a perfect union: A blessed work. Blessed are the peacemakers, that endeavor to make peace among the jarring members of Christ’s Body; and though they may fail of success, yet they shall not lose their reward. In the meanwhile those who widen or heighten these differences, and incite the respective parties to hatred, and wrath, and animosities one against another, to be sure are no children of the God of peace, and had need at least before they die make public satisfaction for the dreadful effects their heats and passions do produce. But as this peace among Protestant Churches is very much to be wished and prayed for…</p></blockquote>

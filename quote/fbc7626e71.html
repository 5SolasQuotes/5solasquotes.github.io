<main class="wrap"><figure class="quote" id="q-fbc7626e71" data-kw="">
<blockquote><p>…it is added by the Rejoinder that Beza says of some that retain the cross, they may use their own liberty. But in the next words he adds: ‘If they have any just causes of retaining this sign in their churches.’ So that he limits that liberty unto such causes as he was not privy to; nay [not for any use] to such as they at Geneva found to be clean contrary. As for us, we have many necessary reasons why we do no way tolerate that sign, and their causes (alleged in the 8th Epistle) were not peculiar to any time or place, but pertain as well to England as to Geneva.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, pp. 7-8, 214, 232, 353, 464</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4d7f690453" data-kw="">
<blockquote><p>The replier to Dr. Mourton’s Particular Defence, observes (ch. 1, section 3), that this superstition about apparel in divine worship began first among the Frensh bishops, unto whom Caelestinus writes thus. Discernendi, etc. ‘We are to be distinguished from the common people and others by doctrine, not by garment, by conversation, not by habit [one’s dress], by the purity of mind, not by attire: for if we study to innovation, we tread underfoot the order which has been delivered unto us by our fathers, to make place to idle superstitions; wherefore we ought not lead the minds of the faithful into such things: for they are rather to be instructed than played withal: neither are we to blind and beguile their eyes, but to infuse instructions into their minds.’ In which words Caelestinus reprehends this apparel, as a novelty which tended to superstition, and made way to the mocking and deceiving of the faithful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, p. 47.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-2982e7c480" data-kw="">
<blockquote><p>(2) If they allege that we read often in the Old Testament that God appeared to men, I respond, He appeared either without any human form, manifesting his extraordinary presence only by some extraordinary sign, or, if He was present in some form, it was not his own but one that He had assumed. He appeared not in his own form but in a vision, the way Jesus appeared to Stephen, standing at the right hand of God (Acts 7:56), and to Paul (Acts 9:10, 12), the same way that Peter saw a vessel descending from heaven filled with animals (Acts 10:11-12; 11:5-6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, trans. Rester &amp; Spangler (RHB, 2019), vol. 2, bk. 2, ch. 6, ‘The Spirituality &amp; Simplicity of God’ | section 9, pp. 135-36</span></figcaption>

</figure><figure class="quote" id="q-046661d6e9" data-kw="">
<blockquote><p>2. How does [Richard] Hooker prove that the vessels made for Baal are in their own nature more incurable than the sign of the cross? You may remove the superstitious intention and idolatrous use of any vessel and turn it to a good use; yet Josiah burnt them to ashes. The like may be said of the groves which he stamped to powder and cast in the brook Kidron, and of the chariots five of the sun which he burnt with fire, and of the bones of dead men, not any of these being of their own nature more indifferent and innocent creatures of God, [nor] were of their own nature more scandalous and more incurable than the sign of the cross. The like may be said of altars…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), A Dispute Touching Scandal &amp; Christian Liberty, pp. 91-92</span></figcaption>

<blockquote><p>From all this it appears that the Romanists worship images in the same way that the heathen of old did, and pagans of our own day still do. They &quot;bow down to them and serve them.&quot; They pay them all the external homage which they render to the persons they are intended to represent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, p. 1946</span></figcaption>

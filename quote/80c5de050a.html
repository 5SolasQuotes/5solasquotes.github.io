<main class="wrap"><figure class="quote" id="q-80c5de050a" data-kw="">
<blockquote><p>For, though you were contracted before a thousand witnesses and married publicly in the frequentest and most solemn assembly, not by the hand of an ordinary minister, but of a bishop or an archbishop, no rite or ceremony omitted, either the wedding ring, (that Tertullian [c. 155–c. 240 AD] more than once mentions,ª and frees from taint of superstition) or any other: Yet are you no wife, if you do not the duty of a wife; ª Annulus pronubus, Tertullian, On Idiolatry and in Apology. Etiam nunc sponsae annul’ ferreus mittitur, id{que} sine gemma, Pliny, Natural History, bk. 33, ch. 1. Atqui aureus is Tertulliani tempore; prout et nobis nunc dierum.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Good Wife, God’s Gift &amp; a Wife Indeed. Two Marriage Sermons</cite>, (1623), p. 12. Gataker was a Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c6f6b764a9" data-kw="">
<blockquote><p>As touching matrimonial benediction… through divine institution, it has a necessary use, as we have said. And though the Dr. to make it appear that a pastor’s performing of the same is a thing indifferent, alleges that in Scripture there is nothing commanded thereanent. Yet plain it is from Scripture itself that matrimonial benediction ought to be given by a pastor, for God has commanded his ministers to bless his people (Num. 6), which by just analogy belongs to the ministers of the Gospel; neither is there any ground for making herein a difference betwixt them and the ministers of the Law, but we must conceive the commandment to t•…e both alike to the blessing of God’s people. Unto which ministerial duty of blessing, because no such limits can be set as may exclude matrimonial blessing, therefore they are bound to the performance of it also. And if further we consider that the duty of blessing was performed by the minister of the Lord, even before the law of Moses (Heb. 6:7), we are yet more confirmed to think that the blessing of the people was not commanded in the Law as a thing peculiar and proper to the Levitical priesthood, but as a moral and perpetual duty, belonging to the Lord’s ministers forever. Wherefore, notwithstanding of any abuse of matrimonial benediction among Papists, yet forasmuch as it has a necessary use in the Church and may not (as the controverted ceremonies may) be well spared…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 2, pp. 24-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-5f44cb6f49" data-kw="">
<blockquote><p>The woman being created was brought to man and given unto him by God, and he took her, with her consent, as flesh of his flesh, and bone of his bone; and they twain became one flesh. And God commanded this order to be observed unto the end of the world. This was the first institution of this sacred society: So that the first and principal efficient of marriage, was God instituting it; the subordinate, is the mutual consent of the parties. For marriage is a contract, or covenant: This is the general nature of it; and as the matter is one man, and one woman, free from all former obligation that may hinder it, so the form, and chief essence is in the special nature of the contract, whereby they mutually bind themselves one unto another so as to become one flesh for term of life of both the parties. The end is propagation mutual help and comfort, and upon the Fall, per accidens, the avoiding of fornication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-lawson.html">George Lawson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theo-Politica, or, A Body of Divinity Containing the Rules of the Special Government of God</cite>, ... (London: Streater, 1659), ch. 8, 7th Commandment, p. 205</span></figcaption>

</figure><figure class="quote" id="q-74bb235caf" data-kw="">
<blockquote><p>We have gotten the new heavens and as a pledge of that the bridegroom’s love-ring: The children of the wedding chamber have cause to skip and leap for joy, for the marriage supper is drawing nigh and we find the fours-hours sweet &amp; comfortable. O time be not slow! O sun move speedily, &amp; hasten our banquet? O bridegroom be like a roe, or a young hart upon the mountains!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Joshua Redivivus, or Mr. Rutherford’s Letters</cite>, (1664) | To Mr. Thomas Garven (117), p. 224</span></figcaption>

</figure><figure class="quote" id="q-238a15e48c" data-kw="">
<blockquote><p>Conclusion III. We hold that the Church of God has power to prescribe ordinances rules, or traditions touching time and place of God’s worship and touching order and comeliness to be used in the same; and in this regard, Paul, 1 Cor. 11:2, commends the Church of Corinth for keeping his traditions, and Acts 15, the Council at Jerusalem decreed that the Churches of the Gentiles should abstain from blood and from things strangled. This decree is termed a tradition and it was in force among them so long as the offence of the Jews remained. And this kind of traditions, whether made by general Councils or particular Synods, we have care to maintain and observe; these caveats being remembered: first that they prescribe nothing childish or absurd to be done; secondly that they be not imposed as any parts of God’s worship; thirdly, that they be severed from superstition or opinion of merit; lastly that the Church of God be not burdened with the multitude of them. And thus much we hold touching traditions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, (1598), pp. 136-37</span></figcaption>

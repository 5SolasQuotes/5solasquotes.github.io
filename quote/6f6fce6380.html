<main class="wrap"><figure class="quote" id="q-6f6fce6380" data-kw="">
<blockquote><p>…and some Christian commonwealths, he [Barclay] means his own synagogue of Rome, spiritual Sodom, a cage of unclean birds, suffers harlots by law; and the whores pay so many thousands yearly to the Pope, and are free of all punishment by law, to eschew [avoid or lessen] homicides, adulteries of Romish priests, and other greater sins; therefore [it would conclude] God has given power to a king to play the tyrant without any fear of punishment to be inflicted by man. But if this be a good argument, the magistrate to whom God has committed the sword to take vengeance on evil doers (Rom. 13:3-6), such as are perjured persons, professed whores and harlots, has a lawful power from God to connive at sins and gross scandals in the commonwealth, as they dream that the king has power given from God to exercise all acts of tyranny without any resistance. But:

1. This was a grievous sin in Eli, that he being a father and a judge, punished not his sons for their uncleanness, and his house, in God’s heavy displeasure, was cut off from the priesthood therefore. Then God has given no such power to the judge.

2. The contrary duty is lying on the judge to execute judgment for the oppressed (Job 29:12-17; Jer. 22:15-16) and perverting of judgment, and conniving at the heinous sins of the wicked, is condemned (Num. 5:31-32; 1 Sam. 15:23; 1 Kings 29:42-43; Isa. 1:17; 10:1; 5:23); and therefore God has given no power to a judge to permit wicked men to commit grievous crimes without any punishment. As for the [Mosaic] law of divorce, it was indeed a permissive law, whereby the husband might give the wife a bill of divorce and be free of punishment before men, but not free of sin and guiltiness before God, for it was contrary to God’s institution of marriage at the beginning, as Christ says; and the prophet says (Mal. 2) that the Lord hates putting away; but that God has given any such permissive power to the king, that he may do what he pleases, and cannot be resisted, this is in question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1644; Edinburgh: Ogle, 1843), question 18, p. 76 lt col mid-bot</span></figcaption>

<blockquote><p>…a Puritan was a man supremely concerned about conscience… The concern which was really supreme in the minds and hearts of the people called Puritans was a concern about God—a concern to know Him truly, and serve Him rightly, and so to glorify Him and to enjoy Him. But, just because this was so, they were in fact very deeply concerned about conscience, for they held that conscience was the mental organ in men through which God brought His Word to bear on them. Nothing, therefore, in their estimation, was more important for any man than that his conscience should be enlightened, instructed, purged, and kept clean. To them, there could be no real spiritual understanding, or any genuine godliness, except as men exposed and enslaved their consciences to God’s Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-i-packer.html">J. I. Packer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Puritan Conscience’ in Puritan Papers</cite>, Vol. Two: 1960-1962 (P&amp;R, 2001), pp. 237-257</span></figcaption>

<blockquote><p>We all know the intention of the end goes in the intention before the action, but not as an essential cause to make an evil action good, or [to] make an indifferent action necessary and honest: A good intention does make a good action good and better, but that a good intention (as idolators are full of good intentions) can never so season the means, as… that it can make evil to be good. Vasquez condemns the Fathers of ignorance, because they said, Propositum bonum excusat malum opus [A proposed good excuses a bad work]: so Cassianus said [that] it was lawful to lie for a good end, and Chrysostom and Ambrose said the same, as Vasquez says: see Aquinas for this.</p></blockquote>

<blockquote><p>Mather enumerates and condemns all forms of commercial dishonesty and business corruption—including the kidnapping of Africans into slavery. He also gives us a sense of the accommodations of the old theocracy (20 years after the Glorious Revolution and 18 years after the witchcraft crisis) with the new horizons of the eighteenth century, telling the Assembly: ‘In two or three too memorable days of temptation that have been upon us, there have been errors committed. You are always ready to declare unto all the world that you disapprove those errors. You are willing to inform all mankind with your declaration that no man may be persecuted because he is conscientiously not of the same religious opinions with those that are uppermost. And that persons are not to be judged confederates with evil spirits merely because the evil spirits do make possessed people cry out upon them.’ Finally, and as expected, he applies the lesson to the place of America in the grand drama of redemption, holding out the hope that the churches of New England will play the leading role…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cotton-mather.html">Cotton Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theopolis Americana, an Essay on the Golden Street of the Holy City</cite>, Theopolis Americana, an Essay on the Golden Street of the Holy City: publishing a Testimony Against the Corruptions of the Market-Place. With some good hopes of better things to be yet seen in the American world. In a sermon, to the General Assembly of the Massachusett-Province in New-England (Boston, 1710) UNL on Rev., 21:21</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Mather enumerates and condemns all forms of commercial dishonesty and business corruption—including the kidnapping of Africans into slavery. He also gives us a sense of the accommodations of the old theocracy (20 years after the Glorious Revolution and 18 years after the witchcraft crisis) with the new horizons of the eighteenth century, telling the Assembly: ‘In two or three too memorable days of temptation that have been upon us, there have been errors committed. You are always ready to declare unto all the world that you disapprove those errors. You are willing to inform all mankind with your declaration that no man may be persecuted because he is conscientiously not of the same religious opinions with those that are uppermost. And that persons are not to be judged confederates with evil spirits merely because the evil spirits do make possessed people cry out upon them.’ Finally, and as expected, he applies the lesson to the place of America in the grand drama of redemption, holding out the hope that the churches of New England will play the leading role…”

— Cotton Mather, Theopolis Americana, an Essay on the Golden Street of the Holy City: publishing a Testimony Against the Corruptions of the Market-Place. With some good hopes of better things to be yet seen in the American world. In a sermon, to the General Assembly of the Massachusett-Province in New-England (Boston, 1710) UNL on Rev., 21:21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMather+enumerates+and+condemns+all+forms+of+commercial+dishonesty+and+business+corruption%E2%80%94including+the+kidnapping+of+Africans+into+slavery.+He+also+gives+us+a+sense+of+the+accommodations+of+the+old+theocracy+%2820+years+after+the+Glorious+Revolution+and+18+years+after+the+witchcraft+crisis%29+with+the+new+horizons+of+the+eighteenth+century%2C+telling+the+Assembly%3A+%E2%80%98In+two+or+three+too+memorable+days+of+temptation+that+have+been+upon+us%2C+there+have+been+errors+committed.+You+are+always+ready+to+declare+unto+all+the+world+that+you+disapprove+those+errors.+You+are+willing+to+inform+all+mankind+with+your+declaration+that+no+man+may+be+persecuted+because+he+is+conscientiously+not+of+the+same+religious+opinions+with+those+that+are+uppermost.+And+that+persons+are+not+to+be+judged+confederates+with+evil+spirits+merely+because+the+evil+spirits+do+make+possessed+people+cry+out+upon+them.%E2%80%99+Finally%2C+and+as+expected%2C+he+applies+the+lesson+to+the+place+of+America+in+the+grand+drama+of+redemption%2C+holding+out+the+hope+that+the+churches+of+New+England+will+play+the+leading+role%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Cotton+Mather%2C+Theopolis+Americana%2C+an+Essay+on+the+Golden+Street+of+the+Holy+City%3A+publishing+a+Testimony+Against+the+Corruptions+of+the+Market-Place.+With+some+good+hopes+of+better+things+to+be+yet+seen+in+the+American+world.+In+a+sermon%2C+to+the+General+Assembly+of+the+Massachusett-Province+in+New-England+%28Boston%2C+1710%29+UNL+on+Rev.%2C+21%3A21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5b1aa6c82d.html

<blockquote><p>As penitent sinners of various kinds were ordered to sit in the church ”bare-heidit all the tyme of the sermons,’¹ it would appear that the members of the congregation kept their hats on during that time. This is also implied by Knox’s statement that the Earl of Huntly pulled down his bonnet over his eyes when the preacher denounced certain vices.² In 1637, George Gillespie says: ‘A man coming into one of our churches in time of public worship, if he see the hearers covered, he knows, by this customable sign, that sermon is begun.”‘³ Thomas Kirk, an Englishman, who visited Dundee in 1677, says: “We heard a sermon at the greatest church; they first sing a psalm, and then the minister begins his prayer, and as soon as he has taken his text they all put on their hats.’† By the beginning of the eighteenth century many Scottish Presbyterians uncovered their heads during sermon.° The custom survived in the Scottish Church at Rotterdam until at least the last quarter of the nineteenth century. At one time the ministers of Scotland may have kept their hats on while preaching, as French and Dutch Protestant preachers did.ª ¹ Booke of the Universall Kirk, 2:692. ² Laing’s Knox, 2:362. ³ Dispute Against the English-Popish Ceremonies, 1637, part 3, p. 86. † Kirk and Thoresby’s Tours in Scotland, p. 19. — In England, during part of the seventeenth century, it was customary for the people to sit in church with their hats on, and to take them off when they sang the Psalms (Brand’s Popular Antiquities, Bohn’s ed., 2:323). Some lifted them at the name of Jesus [according to the Anglican custom] (Marsden’s Early Puritans, 1853, p. 347). ° An Examination of Three Prelatical Pamphlets, 1703, p. 18. ª “He [i.e. Alix] was bold and brisk in the pulpit, and when he read his text, he cocked his hatt; but Claud, when he put on his hat, slipped it on, and drew down the sides of it” (Wodrow’s Analecta, 2:273). ‘The ministers’ of the Church of Holland ‘are covered in the time of sermon’ (Lieut. -Col. Erskine to Wodrow in 1728, Edinburgh Christian Instructor, xxvii, 265). This custom was approved by at least one eminent English [Independent] Puritan. “Mr. [Philip] Nye told us his private judgement, that in preaching he thinks the minister should be covered, and the people discovered; but in the sacrament, the minister should be discovered, as a servant, and the guests all covered.” (Laing’s Baillie’s Letters, 2:149).</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5d4a47d677" data-kw="">
<blockquote><p>This study addresses the issue of v. 15 in 1 Cor 11:2-16 from the perspective of a veiling custom. If veiling is in view (the position adopted here), then how does one confront the difficulty of reconciling the overall context with the exceptional statement in v. 15 that long hair for a woman is a glory. If, as the text argues, long hair is to be taken as a ‘glory,’ by what logic could a woman understand that she should place a veil upon her head? This article provides a way out of the dilemma by showing how a veil can serve the double function of reflecting the hair’s beauty while at the same time preserving a symbol of female modesty.” – Abstract ‘Veiling among Men in Roman Corinth: 1 Corinthians 11:4 &amp; the Potential Problem of East Meeting West’ Pre Journal of Biblical Literature, vol. 137, no. 2 (Summer, 2018), pp. 501-17 Brown (below) had previously argued against Massey and another scholar on whether the key greek syntax in 1 Cor. 11:4 could mean, or primarily does mean, that it was a shame for men to have long hair while praying (Brown), or that it was a shame for a man to pray with a material head-covering on (Massey). This article of Massey follows that of Brown but never appears to address Brown’s article directly. This work of Massey “is based on the foundational work of Oster, Gill, and Finney.</p></blockquote>

<blockquote><p>Now some would make a significancy in it [Christ sitting to preach, Lk. 4:20]; but I take it, it was only a civil gesture, that Christ observing what the way was at that time, He would conform himself to the order and way of sitting, not that it had any spiritual signification: As now, the French Ministers, they preach with their hats on, It’s the custom there, and no question, if any one were to go among them it were fit they should observe the customs that they have: and so here, to sit down, and in other Churches to stand… Therefore observe here, whatsoever ceremony is but natural and helpful in a natural way, there should be no contention, we have no such custom, nor the Churches of God to contend about these, but if they come to have a religious use put upon them… now they come to be sinful, and therefore Christ He observed the ceremony of the Jews [of sitting to preach] as a natural help.</p></blockquote>

<blockquote><p>§. 9. Of the faults of servants contrary to reverence in carriage. … 2. Others, if at first coming to their master they give some salutation, yet, through too much familiarity with them, all the day after they will carry themselves fellow-like, scarce uncovering their heads in their master’s presence, not enduring to stand long before him, but either setting themselves down, or slinking away when they should be in presence… This unmannerly familiarity is commonly in such servants, as have poor and mean [low] masters: for rich and great men’s servants can be so full of curtesy, as not a word shall be spoken by their masters to them, or by them to their masters, but the knee shall be bowed withal: they can stand hour after hour before their masters, and not once put on their hat: if they be walking after their masters, their master shall not turn sooner than their hat will be off, and that so oft as he turns or speaks to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Domestical Duties… (London: 1622) | 7th Treatise, “Duties of Servants” | section 9</cite>, p. 602</span></figcaption>

<div class="actions"><button class="copy" data-copy="“§. 9. Of the faults of servants contrary to reverence in carriage. … 2. Others, if at first coming to their master they give some salutation, yet, through too much familiarity with them, all the day after they will carry themselves fellow-like, scarce uncovering their heads in their master’s presence, not enduring to stand long before him, but either setting themselves down, or slinking away when they should be in presence… This unmannerly familiarity is commonly in such servants, as have poor and mean [low] masters: for rich and great men’s servants can be so full of curtesy, as not a word shall be spoken by their masters to them, or by them to their masters, but the knee shall be bowed withal: they can stand hour after hour before their masters, and not once put on their hat: if they be walking after their masters, their master shall not turn sooner than their hat will be off, and that so oft as he turns or speaks to them.”

<blockquote><p>…because there is no moral goodness imaginable, but it must have its essential form and being from a law or word of God; therefore all the former circumstances, as they are clothed with either moral conveniency and expediency, or with some religious positive goodness, must be warranted by the Word of God, or the rules of sinless and spiritual prudence, which cannot deviate from the Word of God: For circumstances clothed with religious positive goodness, such as are the Sabbath day, the Holy of Holiest, the Temple; these are not mere circumstances, but worship itself: So a religious habit, as an ephod or a surplice, is not a mere circumstance, or a mere habit, but a worship, or such a part or limb of worship as must be warranted by the Word of truth, else it is nothing but a will-device and a forgery, and so to be rejected.</p></blockquote>

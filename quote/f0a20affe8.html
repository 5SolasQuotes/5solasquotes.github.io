<main class="wrap"><figure class="quote" id="q-f0a20affe8" data-kw="">
<blockquote><p>This word ‘church’… signifies a place or house whether Christian people were wont in the old time to resort at times convenient for to hear the word of doctrine, the law of God and the faith of our Savior Jesus Christ, and how and what to pray and whence to ask power and strength to live goodly.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3a547140f2" data-kw="">
<blockquote><p>2. The person [candidate for being the pastor] is tried by Timothy and Titus, and so by the presbytery, his ability, that he be able to teach others (2 Tim. 2:3), that he be apt to teach (1 Tim. 3:2; Tit. 1:9), else the Timothies of the Church lay hands suddenly on him, contrary to 1 Tim. 5:22. So the presbytery tries according to these canons with us, his skill in the languages: Latin, Hebrew, and Greek; his ability of preaching popular sermons, and interpreting Scripture, in controversies, in chronology, and the history of the Church, and he must be proved and tried by the people, by preaching sundry sermons to them (1 Tim. 3:10), and let these first be proved, and let them use the office, whatever officers they shall be, Pastors, Doctors, Elders or Deacons. … 3. …and another day set for his ordination, at which day the edict is called, all who have anything to object against his life and doctrine are thrice publicly at the church door invited to come and object. And this we think is [in Greek] ‘episkepein andra,’ (Acts 6:3) and ‘dokimazein andra,’ (1 Tim. 3:10) ‘to find out’ and ‘to try the man’. The day of ordination… the pastor calls him up before the congregation, and demands if he be willing to accept the charge, and he must testify his consent as Isaiah (Isa. 6:8; Jer. 6:7,8; Acts 9:20). Then the pastor asks the peoples’ consent, which they testify by their [in Greek] ‘keiro onia’, ‘the lifting up of their hands’ (as Acts 14:23), and the man must please the whole multitude (as Acts 6:5; 1:26). This being done, the pastor… with the Presbytery lays their hands on his head, and prays that God would bless him, as the apostles did (Acts 6:6). The apostles prayed and laid their hands on them (Acts 13:3). They prayed and laid their hands on them (1 Tim. 4:14; 1 Tim. 5:22), all being done, the eldership of the congregation give him the right hand of fellowship (as Gal. 2:9)… And this order in substance is kept in ordaining doctors, elders, and deacons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), ch. 20, 3rd Article, ‘Calling of Officers, especially Pastors’</span></figcaption>

</figure><figure class="quote" id="q-134828ed61" data-kw="">
<blockquote><p>… That this Commission may receive into ministerial communion such of the late conform ministers, as having qualified themselves according to law, shall apply personally to them, one by one, duly and orderly, and shall acknowledge, engage, and subscribe upon the end of the Confession of Faith, as follows, viz.: I… do sincerely own and declare, the above Confession of Faith, approven by former General Assemblies of this Church, and ratified by law in the year 1690, to be the confession of my faith; and that I own the doctrine therein contained to be the true doctrine which I will constantly adhere to; as likeways that I own and acknowledge Presbyterian Church government of this Church, now settled by law, by Kirk-Sessions, Presbyteries, Provincial Synods and General Assemblies, to be the only government of this Church, and that I will submit thereto, concur therewith, and never endeavour directly nor indirectly, the prejudice or subversion thereof… As also that the General Assembly require all Presbyteries and Synods, in their admitting or receiving any to ministerial communion, that they oblidge them to take and subscribe the same acknowledgment…</p></blockquote>

<blockquote><p>The Shorter Catechism agreed upon by the Assembly of divines at Westminster, and presented to the honorable Houses of Parliament then sitting, and by them ordered to be printed and published, but no man enjoined to use it, or punishable if he made use of any other to instruct his people in. This little book for the comprehensiveness of it, as also exactness of order and expression, has (as it deserves) a great esteem with many learned men, notwithstanding to be the one and only book for all capacities that are to be instructed in principles throughout the nation, is a perfection not to be expected from any common gift, nor is this for such purpose the fittest in its kind, as we shall endeavor to show in this dispute.</p></blockquote>

;text=we%20shall%20endeavor%20to%20show%20in%20this%20dispute" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a9effb734b" data-kw="">
<blockquote><p>Assent to a historic Creed or Group of Articles, under whatever formula, involves a reference, not merely to what is fondly termed the ‘plain meaning’ of its sentences, but also to its historical meaning, purpose, background, and spirit. It is not more antiquated, unjust, and disastrous to accept the Bible in the letter of its language wihtout subordinating the Old Testament to the New and both to the Spirit of Christ, and without regard to historical and linguistic and textual research and its invaluable interpretative aids, than it is to prescribe or accept a subordinate and vastly inferior document without some knowledge of the spiritual and scholarly attitude of its formulators, and of the limited purpose and information behind their work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-curtis.html">William Curtis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 25, ‘Subscription &amp; its Ethics: The Ideal Creed’ in A History of Creeds &amp; Confessions of Faith in Christendom &amp; Beyond… (Edinburgh: T&amp;T Clark, 1911), pp. 447-66, p. 455</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Assent to a historic Creed or Group of Articles, under whatever formula, involves a reference, not merely to what is fondly termed the ‘plain meaning’ of its sentences, but also to its historical meaning, purpose, background, and spirit. It is not more antiquated, unjust, and disastrous to accept the Bible in the letter of its language wihtout subordinating the Old Testament to the New and both to the Spirit of Christ, and without regard to historical and linguistic and textual research and its invaluable interpretative aids, than it is to prescribe or accept a subordinate and vastly inferior document without some knowledge of the spiritual and scholarly attitude of its formulators, and of the limited purpose and information behind their work.”

— William Curtis, ch. 25, ‘Subscription &amp; its Ethics: The Ideal Creed’ in A History of Creeds &amp; Confessions of Faith in Christendom &amp; Beyond… (Edinburgh: T&amp;T Clark, 1911), pp. 447-66, p. 455">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAssent+to+a+historic+Creed+or+Group+of+Articles%2C+under+whatever+formula%2C+involves+a+reference%2C+not+merely+to+what+is+fondly+termed+the+%E2%80%98plain+meaning%E2%80%99+of+its+sentences%2C+but+also+to+its+historical+meaning%2C+purpose%2C+background%2C+and+spirit.+It+is+not+more+antiquated%2C+unjust%2C+and+disastrous+to+accept+the+Bible+in+the+letter+of+its+language+wihtout+subordinating+the+Old+Testament+to+the+New+and+both+to+the+Spirit+of+Christ%2C+and+without+regard+to+historical+and+linguistic+and+textual+research+and+its+invaluable+interpretative+aids%2C+than+it+is+to+prescribe+or+accept+a+subordinate+and+vastly+inferior+document+without+some+knowledge+of+the+spiritual+and+scholarly+attitude+of+its+formulators%2C+and+of+the+limited+purpose+and+information+behind+their+work.%E2%80%9D%0A%0A%E2%80%94+William+Curtis%2C+ch.+25%2C+%E2%80%98Subscription+%26+its+Ethics%3A+The+Ideal+Creed%E2%80%99+in+A+History+of+Creeds+%26+Confessions+of+Faith+in+Christendom+%26+Beyond%E2%80%A6+%28Edinburgh%3A+T%26T+Clark%2C+1911%29%2C+pp.+447-66%2C+p.+455&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa9effb734b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a9effb734b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=Assent%20to%20a%20historic%20Creed%20or,purpose%20and%20information%20behind%20their%20work&amp;text=Assent%20to%20a%20historic%20Creed%20or%20Group%20of&amp;text=the%20limited%20purpose%20and%20information%20behind%20their%20work" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

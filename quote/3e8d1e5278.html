</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a37aba1432" data-kw="">
<blockquote><p>Now, the ceremonies are the bane of our churches’ peace and the unhappy instruments of lamentable discord among bretheren who should dwell together in unity. I know that the refusers of the ceremonies are blamed as if they were the troublers of the peace of the Church and the tumultuating contentious spirits who make so much ado about matters of rite and ceremony. But I know also that none have been more ordinarily and commonly blamed for troubling the peace of the Church than they who least deserved to be blamed for it. So was Elijah himself thought to be he that troubled Israel when he contended against the corruptions of the Church in his time.</p></blockquote>

</figure><figure class="quote" id="q-046bce6a8f" data-kw="">
<blockquote><p>Question: Whether it is permissible to migrate and transfer from one Church to a more perfect Church; or whether one must indeed remain perpetually in the Church whose communion one has entered. Answer: Conclusion 1. It is permissible to migrate from a Church laboring under errors (though they do not undermine the entire foundation) in doctrine; especially if scandals have arisen and errors are more firmly established, and there is no hope of correction. Thus migration from a Lutheran Church or from the original and Five-Article Remonstrant Church (for judgment about Socinian Remonstrants must be made differently) to a Reformed Church has never been disapproved by us. Conclusion 2. Even from a Church which in doctrine is indeed sound, but is schismatic and finally lapses into errors unless it maturesly[?] recedes and returns to where it was undone. Such I judge to have been the congregation of the Brownists, who some years ago in Leiden, under the guidance of [John] Robinson, a man otherwise known for his piety, erudition, and zealous devotion, used to be held. Conclusion 3. It is not to be disapproved that someone, in pursuit of better progress and tranquility of conscience, should pass over to a Church purer and more perfect in the simplicity of rites, governance, and discipline, adding also in effective ministry and preaching, in public and domestic exercises of piety, and in effective and more frequent examples of piety; provided it is done through migration from place to place. Indeed, change of habitation wards off the appearance of schism, scandals, contentions, and other inconveniences that might arise from there. Conclusion 4. But to transfer from one Church to another of the same confession or even of a different language known to oneself, without the conscience and consent of both Churches, indeed goes against the order established by Christ, and begets contentions, factions, schisms, scandals. Conclusion 5. It must not be denied, however, that prudently something should be allowed or even done in various cases. Such as, for example, where particular contentions arise between someone and a minister, or ministers, or presbytery, or some brothers in a certain Church: it is better after reconciliation has been initiated, either wholly or temporarily to dismiss the one demanding it, so that both his and the Church’s tranquility may be consulted, and all occasions for renewed exacerbations may be more effectively cut off, or so that impending schisms may be prevented. … 17th Question: Whether for the sake of greater purity and integrity, one should move from one Church to another even without the consent of the Church being left? Answer: 1st Conclusion: If the Churches into whose communion one moves were previously gathered or constituted in greater purity and integrity of doctrine and rites, either before corruption or even after corruption, whether initiated or established, in the same place, city, field, or district, I see no reason why explicit and external communion with the Church in which one has hitherto lived cannot be desired towards better and more perfect things. Thus in Belgium, Lutherans moving from their Churches to ours are welcomed with goodwill; although our people are not unaware that Lutherans do not approve of them leaving. 2nd Conclusion: The situation is different if someone had made a separation from Lutheran Churches and ours, especially ones not yet established, before the [Lutheran] Book of Concord [1580, which was separatistic] and devised new and separate Churches: then I would not wish anyone to be the author of a division, against the common consensus and protestation of the reforming theologians (about which see Sacramentary History of Hofmann). 1. Because at that time there was a distrust of doctrine, confined to one article concerning the presence of the body in the Supper… according to the declaration of both parties in the Marburg Colloquy of 1529. 2. Because the ubiquity [of Christ’s human nature] with appendices, and conditional predestination, along with the true, final apostasy of the faithful, were not commonly accepted then [by the Lutherans], let alone elevated into the doctrines of the Church and fundamental principles. 3. Because the Lutherans themselves had not yet formally resolved their previous schism, and as if they had ejected us from their Churches. 3rd Conclusion: Where there is agreement in doctrine, but rightly someone dissents in rituals and governance, he can nevertheless exercise communion in that Church without approval of these defects, whether directly or indirectly: I would not wish to be the author of a migration from his Church, except in cases where the Church of the same confession and doctrine without those defects, and without the burden or annoyance of tolerating them, can be had; he would be cast out, or by schism negatively, to live outside all ecclesiastical communion; or by positive schism, to establish another separate Church there in the same place, against the Church which should have been and whose liberty permits it. And I think this was the cause that was discussed among English theologians and Separatists or Brownists (as they are called) before. Leaving hypotheticals, we disapprove their theoretical and principal assertions against the Anglican Church, with Paget, Ames, and others alien to ceremonies and the episcopal government of the Anglicans. 4th Conclusion: Yet it is far from me to accuse orthodox and pious brothers of schism who, in recent years, have freely through the Anglican Churches and pulpits, the most frequently, with the ceremonies imposed by the new Papists, had secret and publicized committees separated from their conscience for their building; so that they did not send the rejection of the Anglican Churches, the better of reformationist times and the powers of truth from the lords, expecting in the meantime. The right to do so was suitable for themselves as well as for some Belgian Churches, the time for the contention in the course of the baptism: Read the apology for the fact in 26 &amp; 29.</p></blockquote>

ne+Church+to+another+of+the+same+confession+or+even+of+a+different+language+known+to+oneself%2C+without+the+conscience+and+consent+of+both+Churches%2C+indeed+goes+against+the+order+established+by+Christ%2C+and+begets+contentions%2C+factions%2C+schisms%2C+scandals.+Conclusion+5.+It+must+not+be+denied%2C+however%2C+that+prudently+something+should+be+allowed+or+even+done+in+various+cases.+Such+as%2C+for+example%2C+where+particular+contentions+arise+between+someone+and+a+minister%2C+or+ministers%2C+or+presbytery%2C+or+some+brothers+in+a+certain+Church%3A+it+is+better+after+reconciliation+has+been+initiated%2C+either+wholly+or+temporarily+to+dismiss+the+one+demanding+it%2C+so+that+both+his+and+the+Church%E2%80%99s+tranquility+may+be+consulted%2C+and+all+occasions+for+renewed+exacerbations+may+be+more+effectively+cut+off%2C+or+so+that+impending+schisms+may+be+prevented.+%E2%80%A6+17th+Question%3A+Whether+for+the+sake+of+greater+purity+and+integrity%2C+one+should+move+from+one+Church+to+another+even+without+the+consent+of+the+Church+being+left%3F+Answer%3A+1st+Conclusion%3A+If+the+Churches+into+whose+communion+one+moves+were+previously+gathered+or+constituted+in+greater+purity+and+integrity+of+doctrine+and+rites%2C+either+before+corruption+or+even+after+corruption%2C+whether+initiated+or+established%2C+in+the+same+place%2C+city%2C+field%2C+or+district%2C+I+see+no+reason+why+explicit+and+external+communion+with+the+Church+in+which+one+has+hitherto+lived+cannot+be+desired+towards+better+and+more+perfect+things.+Thus+in+Belgium%2C+Lutherans+moving+from+their+Churches+to+ours+are+welcomed+with+goodwill%3B+although+our+people+are+not+unaware+that+Lutherans+do+not+approve+of+them+leaving.+2nd+Conclusion%3A+The+situation+is+different+if+someone+had+made+a+separation+from+Lutheran+Churches+and+ours%2C+especially+ones+not+yet+established%2C+before+the+%5BLutheran%5D+Book+of+Concord+%5B1580%2C+which+was+separatistic%5D+and+devised+new+and+separate+Churches%3A+then+I+would+not+wish+anyone+to+be+the+author+of+a+division%2C+against+the+common+consensus+and+protestation+of+the+reforming+theologians+%28about+which+see+Sacramentary+History+of+Hofmann%29.+1.+Because+at+that+time+there+was+a+distrust+of+doctrine%2C+confined+to+one+article+concerning+the+presence+of+the+body+in+the+Supper%E2%80%A6+according+to+the+declaration+of+both+parties+in+the+Marburg+Colloquy+of+1529.+2.+Because+the+ubiquity+%5Bof+Christ%E2%80%99s+human+nature%5D+with+appendices%2C+and+conditional+predestination%2C+along+with+the+true%2C+final+apostasy+of+the+faithful%2C+were+not+commonly+accepted+then+%5Bby+the+Lutherans%5D%2C+let+alone+elevated+into+the+doctrines+of+the+Church+and+fundamental+principles.+3.+Because+the+Lutherans+themselves+had+not+yet+formally+resolved+their+previous+schism%2C+and+as+if+they+had+ejected+us+from+their+Churches.+3rd+Conclusion%3A+Where+there+is+agreement+in+doctrine%2C+but+rightly+someone+dissents+in+rituals+and+governance%2C+he+can+nevertheless+exercise+communion+in+that+Church+without+approval+of+these+defects%2C+whether+directly+or+indirectly%3A+I+would+not+wish+to+be+the+author+of+a+migration+from+his+Church%2C+except+in+cases+where+the+Church+of+the+same+confession+and+doctrine+without+those+defects%2C+and+without+the+burden+or+annoyance+of+tolerating+them%2C+can+be+had%3B+he+would+be+cast+out%2C+or+by+schism+negatively%2C+to+live+outside+all+ecclesiastical+communion%3B+or+by+positive+schism%2C+to+establish+another+separate+Church+there+in+the+same+place%2C+against+the+Church+which+should+have+been+and+whose+liberty+permits+it.+And+I+think+this+was+the+cause+that+was+discussed+among+English+theologians+and+Separatists+or+Brownists+%28as+they+are+called%29+before.+Leaving+hypotheticals%2C+we+disapprove+their+theoretical+and+principal+assertions+against+the+Anglican+Church%2C+with+Paget%2C+Ames%2C+and+others+alien+to+ceremonies+and+the+episcopal+government+of+the+Anglicans.+4th+Conclusion%3A+Yet+it+is+far+from+me+to+accuse+orthodox+and+pious+brothers+of+schism+who%2C+in+recent+years%2C+have+freely+through+the+Anglican+Churches+and+pulpits%2C+the+most+frequently%2C+with+the+ceremonies+imposed+by+the+new+Papists%2C+had+secret+and+publicized+committees+separated+from+their+conscience+for+their+building%3B+so+that+they+did+not+send+the+rejection+of+the+Anglican+Churches%2C+the+better+of+reformationist+times+and+the+powers+of+truth+from+the+lords%2C+expecting+in+the+meantime.+The+right+to+do+so+was+suitable+for+themselves+as+well+as+for+some+Belgian+Churches%2C+the+time+for+the+contention+in+the+course+of+the+baptism%3A+Read+the+apology+for+the+fact+in+26+%26+29.%E2%80%9D%0A%0A%E2%80%94+Gisbert+Voetius%2C+Ecclesiastical+Politics+tr.+by+AI+%28Amsterdam%3A+Joannes+%C3%A0+Waesberge%2C+1663%E2%80%931676%29%2C+vol.+1%2C+%E2%80%98The+Nature+of+the+Instituted+Church%E2%80%99%2C+pp.+65-70+%28PDF+pp.+71-77%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F046bce6a8f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/046bce6a8f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separatism/#:~:text=Question%3A%20Whether%20it%20is%20permissible%20to,the%20fact%20in%2026%20%26%2029&amp;text=Question%3A%20Whether%20it%20is%20permissible%20to%20migrate%20and&amp;text=apology%20for%20the%20fact%20in%2026%20%26%2029" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fce6c1b418" data-kw="">
<blockquote><p>This is no separation from the Church of Scotland, either in her doctrine, worship, discipline or government, but only a departing, or going forth from her sins, backslidings and defections, as we are commanded by the Lord; and for a time only from some congregations, because of these. This is not a positive or active separation form the Church, casting at it as no Church, or defaming the ministry thereof, or gathering new distinct Churches; only a negative and passive separation, refusing to follow the declining part of the Church holding on in their new course, and choosing rather to stand still and cleave to that part, though smaller, endeavoring to retain and maintain the covenanted work of reformation against Popery, prelacy, Erastianism and sectarianism, schism and defection.</p></blockquote>

</figure><figure class="quote" id="q-d9df8860b7" data-kw="">
<blockquote><p>Divisions and contendings have been the undoing of this Church first and last, but I think more of late, and more shamefully than ever, the matter being so small (if wisely considered) about which all this noise has been made. I take not upon me to justify the indulged ministers, neither will I rigidly condemn them: But, if the separating from their ministry and pressing the matter with such heat and violence shall be found to be good service done to Christ, I have read the Scriptures wrong; and the sad consequences of it are convincing enough, if people were humble and convincible. It was this contention which expelled that profitable and most edifying exercise of mutual prayer and Christian conference (that I may say nothing how it drove from the shepherds’ tents) upon which followed a sensible decay in the exercise of godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

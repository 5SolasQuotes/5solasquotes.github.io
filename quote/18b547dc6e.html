</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1d651cbde2" data-kw="">
<blockquote><p>Peter clearly insinuates that all who have received the Holy Ghost are to be baptized, Acts 8:47, as Philip, Acts 8:37, and that if the eunuch believed, he might be baptized. So that faith, to speak properly, does give us right to the seals; and to speak accurately, a visible profession of faith does not give a man right to the seals of grace, but only it does notify and declare to the Church that the man has right to the seals because he believes, and that the Church may lawfully give to him the seals, and that profession is a condition required in the right receivers of the seals in an ecclesiastical way; But faith gives the right to these seals, and because the faith of the believer goes with the believer, when he goes to another visible congregation than his own, that faith giveth him right to the seals in all places and in all congregations: for faith gives right to receive Christ sacramentally, not in one congregation only, but in all, and a visible profession does, as a condition notify this faith, and Church-right in all congregations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), ch. 4, section 5, pp. 195-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

nk">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-001baf6d80" data-kw="">
<blockquote><p>Nor is it [baptism] to be administered in private places, or privately, but in the place of public worship, and in the face of the congregation, where the people may most conveniently see and hear; and not in the places where fonts, in the time of Popery, were unfitly and superstitiously placed.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-80b701bb47" data-kw="">
<blockquote><p>In the [Scottish] Book of Common Order [‘The Order of Baptism’]… it is said that the sacraments are not ordained of God to be used in private corners, as charmers and sorcerers use[d] to do, but left to the congregation, and necessarily annexed to God’s Word as seals of the same. In the [general] assembly holden at Edinburgh… [Oct. 17,] 1581 [session 3], it was ordained that the sacraments be not ministered in private houses, but solemnly, according to the good order hitherto observed. But in the late pretended assembly holden at Perth, anno 1618, it was ordained [in its Acts] that the minister shall not refuse to baptize infants in private houses when great need compels the parents to crave it, but the great need is not specified, and therefore left to the judgement of every corrupt minister who shall be willing to pleasure his parishoner upon pretence of any alleged necessity, as a rainy day, or the saving of some charges [expenses], as a dinner, etc. Such like the minister must not refuse to administrate the communion in a private house beside him… It is required only that there be three or four of good religion and conversation present to communicate with him. But, which shakes all loose, these must be free of all impediments. What if they be not free? What suppose there were forty, let be four, if it be not celebrated in the congregation, it is but a private communion. … 2. …Because we cannot attain to a visible communion in the holy things of God immediately with the whole Church-militant, we enjoy it mediately by our communion in a particular congregation… … He [Dr. Lindsay] wrests also that place in Matthew [ch. 18], where Christ promised to be in the midst of two or three convened in his name, as if three or four convened to the administration of baptism or the Lord’s Supper, were a sufficient number to make up a lawful assembly… Christ speaks not there, as Master [Thomas] Cartwright has already answered, of the public administering of the Word and sacraments, but of the proceeding in the Church discipline. … It is a sinew of public assemblies, a hedge of our profession, a band of love and representation of our communion and fellowship, which is and ought to be among the members of the congregation. It is not a part, or two, or three, but the whole body of the congregation which is compared to one bread, when the apostle says, ‘We that are many are one bread, and one body, for we are partakers afore bread,’ 1 Cor. 10:17. Because it is not possible to us to celebrate a sacramental union with the whole Church militant, the Lord has appointed us to keep a sacramentall communion with some particular congregation or visible Church. … A company convened apart from the rest to communicate with the sick person is not united by themselves into the body of a Church, far less three of four, as take, the English [Anglican] service book means to be a number sufficient, seeing they allow the communion to be ministred to three or four in the Church, and in the time of plague, sweat, or such other like contagious sicknesses, the minister may communicate with the person diseased alone… says Bullinger (Decade 5, sermon 9). That is, ‘Seeing it is not a public or general meeting, when three or four communicate with the sick, they say nothing to purpose who say, that the supper may be celebrated beside the sick, if others also communicate.’ … The elements were sent to the absents in time, or immediately after the action in Justin Martyr’s time. Which was the first abuse we read of. After followed reservation of the eucharist for the use of the sick, which was a greater abuse, and carrying of it home to their houses. The opinion of the necessity of private communions did grow to such a height…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Re-examination of the Five Articles enacted at Perth, anno 1618</cite>, … (1636), ‘Of the Administration of the Sacraments in Private Places’, pp. 221-22, 224-25, 230-33</span></figcaption>

— David Calderwood, A Re-examination of the Five Articles enacted at Perth, anno 1618… (1636), ‘Of the Administration of the Sacraments in Private Places’, pp. 221-22, 224-25, 230-33">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+the+%5BScottish%5D+Book+of+Common+Order+%5B%E2%80%98The+Order+of+Baptism%E2%80%99%5D%E2%80%A6+it+is+said+that+the+sacraments+are+not+ordained+of+God+to+be+used+in+private+corners%2C+as+charmers+and+sorcerers+use%5Bd%5D+to+do%2C+but+left+to+the+congregation%2C+and+necessarily+annexed+to+God%E2%80%99s+Word+as+seals+of+the+same.+In+the+%5Bgeneral%5D+assembly+holden+at+Edinburgh%E2%80%A6+%5BOct.+17%2C%5D+1581+%5Bsession+3%5D%2C+it+was+ordained+that+the+sacraments+be+not+ministered+in+private+houses%2C+but+solemnly%2C+according+to+the+good+order+hitherto+observed.+But+in+the+late+pretended+assembly+holden+at+Perth%2C+anno+1618%2C+it+was+ordained+%5Bin+its+Acts%5D+that+the+minister+shall+not+refuse+to+baptize+infants+in+private+houses+when+great+need+compels+the+parents+to+crave+it%2C+but+the+great+need+is+not+specified%2C+and+therefore+left+to+the+judgement+of+every+corrupt+minister+who+shall+be+willing+to+pleasure+his+parishoner+upon+pretence+of+any+alleged+necessity%2C+as+a+rainy+day%2C+or+the+saving+of+some+charges+%5Bexpenses%5D%2C+as+a+dinner%2C+etc.+Such+like+the+minister+must+not+refuse+to+administrate+the+communion+in+a+private+house+beside+him%E2%80%A6+It+is+required+only+that+there+be+three+or+four+of+good+religion+and+conversation+present+to+communicate+with+him.+But%2C+which+shakes+all+loose%2C+these+must+be+free+of+all+impediments.+What+if+they+be+not+free%3F+What+suppose+there+were+forty%2C+let+be+four%2C+if+it+be+not+celebrated+in+the+congregation%2C+it+is+but+a+private+communion.+%E2%80%A6+2.+%E2%80%A6Because+we+cannot+attain+to+a+visible+communion+in+the+holy+things+of+God+immediately+with+the+whole+Church-militant%2C+we+enjoy+it+mediately+by+our+communion+in+a+particular+congregation%E2%80%A6+%E2%80%A6+He+%5BDr.+Lindsay%5D+wrests+also+that+place+in+Matthew+%5Bch.+18%5D%2C+where+Christ+promised+to+be+in+the+midst+of+two+or+three+convened+in+his+name%2C+as+if+three+or+four+convened+to+the+administration+of+baptism+or+the+Lord%E2%80%99s+Supper%2C+were+a+sufficient+number+to+make+up+a+lawful+assembly%E2%80%A6+Christ+speaks+not+there%2C+as+Master+%5BThomas%5D+Cartwright+has+already+answered%2C+of+the+public+administering+of+the+Word+and+sacraments%2C+but+of+the+proceeding+in+the+Church+discipline.+%E2%80%A6+It+is+a+sinew+of+public+assemblies%2C+a+hedge+of+our+profession%2C+a+band+of+love+and+representation+of+our+communion+and+fellowship%2C+which+is+and+ought+to+be+among+the+members+of+the+congregation.+It+is+not+a+part%2C+or+two%2C+or+three%2C+but+the+whole+body+of+the+congregation+which+is+compared+to+one+bread%2C+when+the+apostle+says%2C+%E2%80%98We+that+are+many+are+one+bread%2C+and+one+body%2C+for+we+are+partakers+afore+bread%2C%E2%80%99+1+Cor.+10%3A17.+Because+it+is+not+possible+to+us+to+celebrate+a+sacramental+union+with+the+whole+Church+militant%2C+the+Lord+has+appointed+us+to+keep+a+sacramentall+communion+with+some+particular+congregation+or+visible+Church.+%E2%80%A6+A+company+convened+apart+from+the+rest+to+communicate+with+the+sick+person+is+not+united+by+themselves+into+the+body+of+a+Church%2C+far+less+three+of+four%2C+as+take%2C+the+English+%5BAnglican%5D+service+book+means+to+be+a+number+sufficient%2C+seeing+they+allow+the+communion+to+be+ministred+to+three+or+four+in+the+Church%2C+and+in+the+time+of+plague%2C+sweat%2C+or+such+other+like+contagious+sicknesses%2C+the+minister+may+communicate+with+the+person+diseased+alone%E2%80%A6+says+Bullinger+%28Decade+5%2C+sermon+9%29.+That+is%2C+%E2%80%98Seeing+it+is+not+a+public+or+general+meeting%2C+when+three+or+four+communicate+with+the+sick%2C+they+say+nothing+to+purpose+who+say%2C+that+the+supper+may+be+celebrated+beside+the+sick%2C+if+others+also+communicate.%E2%80%99+%E2%80%A6+The+elements+were+sent+to+the+absents+in+time%2C+or+immediately+after+the+action+in+Justin+Martyr%E2%80%99s+time.+Which+was+the+first+abuse+we+read+of.+After+followed+reservation+of+the+eucharist+for+the+use+of+the+sick%2C+which+was+a+greater+abuse%2C+and+carrying+of+it+home+to+their+houses.+The+opinion+of+the+necessity+of+private+communions+did+grow+to+such+a+height%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+David+Calderwood%2C+A+Re-examination+of+the+Five+Articles+enacted+at+Perth%2C+anno+1618%E2%80%A6+%281636%29%2C+%E2%80%98Of+the+Administration+of+the+Sacraments+in+Private+Places%E2%80%99%2C+pp.+221-22%2C+224-25%2C+230-33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F80b701bb47.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/80b701bb47.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments/whether-the-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=In%20the%20%5BScottish%5D%20Book%20of%20Common,did%20grow%20to%20such%20a%20height&amp;text=In%20the%20%5BScottish%5D%20Book%20of%20Common%20Order%20%5B%E2%80%98The&amp;text=private%20communions%20did%20grow%20to%20such%20a%20height" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>John Owen (1616–83), a prominent English Reformed theologian, emphasized the importance of affections in Christian life… Affections, as opposed to turbulent emotions, are regarded as a more delicate inclination and disposition of the soul… Owen’s theology is built in a theocentric way, with a particular emphasis on the experiential and pastoral aspects. This research investigates how Owen used the concept of affections to construct his anthroposensitive theology.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-709cf6ada5" data-kw="">
<blockquote><p>Ancient and medieval philosophy in general, and Thomism in particular, emphasized metaphysics over epistemology, and objective reality over our subjective awareness of it. The right order of inquiry, from this point of view, is first to determine the nature of the world and the place of human beings within it, and then on that basis to investigate how human beings come to acquire knowledge of the world. Modern philosophy, beginning with Rene Descartes (1596-1650), reverses this approach, tending as it does to start with questions about how we can come to have knowledge of the world and only then going on to consider what the world must be like, based on an account of our knowledge of it. In particular, both Descartes’ rationalism and the empiricism of writers like Locke, Berkeley, and Hume begin with the individual conscious subject or self, develop a theory about how that self can know anything, and then determine what reality in general must be like in line with their respective theories of knowledge. One result of this subjectivist method was to make objective reality and common sense problematic in a way they had not been for Aristotle and Aquinas; skepticism thus came to seem a serious threat, and idealism (the view that the material world is an illusion and that mind alone is real) came to seem a serious option. Another consequence was that even when some sort of objective reality was acknowledged, doubts were raised about the possibility of knowing much about it beyond what the senses could tell us directly. Accordingly, grand metaphysical systems of the sort presented by Plato, Aristotle, and Aquinas were called into question. The philosophy of Immanuel Kant (1724-1804) was an especially influential expression of hostility to traditional metaphysics, distinguishing as it does between ‘phenomena’ (the world as it appears to us, of which we can have knowledge) and ‘noumena’ (the world as it exists in itself, which we cannot know).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Thomistic tradition, Part I’ (2009) Feser is an Analytical Thomist.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-e3840a983d" data-kw="">
<blockquote><p>I. God has planted two principles in the mind of man: the avoidance of evil and the desire of good; the irascible (to thymikon) and concupiscible appetite (to epithymetikon). Viewed in the genus of being and physically, these are neither good nor bad, but mean and indifferent, drawing all their moral goodness and evil from the quality of the objects about which they are exercised.</p></blockquote>

</figure><figure class="quote" id="q-acb4331d2b" data-kw="">
<blockquote><p>One one version [of traducianism], the soul derives form the bodies of the parents. But it is at best difficult to ee how something incorporeal could arise from something corporeal… The other way to interpret traducianism is to hold that the oul derives from the souls of the parents… But it faces another problem. Again, for the reasons considered in chapter 8, the soul is simple or without parts. So how can one’s soul come from the souls of one’s parents? That would seem to require that a part of one’s fatehr’s soul and a part of one’s mother’s soul be passed down to their offspring. But, again, souls do not have parts. It would also seem to require that those parts be combined in order to make up the soul of the child. But souls cannot be made up of parts, because, once again, they lack parts. So it seems that traducianism, on either interpretation, fails. Creationism is the alternative view that… God and the parents together produce the new human being… …Hence, suppose that the existence of God can be independently established… Suppose it can also be established that only God can create something ex nihilo. And suppose that… it can be established that there is no way in principle for a soul to come into being except by being created ex nihilo. Then the appeal to divine action [in creating the soul] will by no means be either ad hoc or a “God of the gaps” explanation. It will be the only possible explanation. My own view is that it is indeed the only possible explanation.</p></blockquote>

</figure><figure class="quote" id="q-e4336db82b" data-kw="">
<blockquote><p>All these principles are the principles of our natural intelligence. They are first manifested in that spontaneous form of intelligence which we call common sense, that is, the natural aptitude of intelligence, before all philosophic culture, to judge things sanely. Common sense, natural reason, seizes these self-evident principles from its notion of intelligible reality. But this natural common sense could not yet give these principles an exact and universal formulation.</p></blockquote>

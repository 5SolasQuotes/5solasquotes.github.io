<main class="wrap"><figure class="quote" id="q-740420a690" data-kw="">
<blockquote><p>Why the Church is called a temple it is not difficult to perceive. It is so called in allusion to the sacred edifice, which, by Divine command, was erected in Jerusalem. That edifice was dedicated to the service of God, and so are all those who believe in Jesus. They feel that they are not their own, and they are taught to glorify God in their bodies and in their spirits, which are his. In the Jewish temple, the Lord was pleased to reveal his glory; and so he does in the Church, but more spiritually and more fully. He manifests himself to all that love and serve him. While the eyes of other men are darkened by the influence of sin, their eyes are opened to discern the Divine glory in the face of Jesus Christ.

The Jewish temple was regarded as God’s residence, for the visible emblem of his glory dwelt between the cherubims. And is not his life-giving presence with his Church on earth? Has he not promised to be always with his people? In the one temple were observed the rites which he was pleased to institute; in the other, he is worshipped in spirit and truth. The world withholds from him its homage. Every unbeliever does so, whether outwardly connected with the Church or not. Those only who believe with the heart unto righteousness are his true worshippers. It is the Church which they constitute, that offers up to him the sacrifices of righteousness, and the grateful incense of praise and supplication. Most fitly, then, is it styled “the temple of the Lord.”

Now, of this temple Jesus is the builder. Before a structure can be reared, the foundation must be laid; and Christ has laid the foundation of his Church. He virtually laid it in the counsels of eternity, when he undertook to accomplish the work of our redemption; and he actually laid it in the fulness of time, when he obeyed and suffered in our stead. He is himself the rock on which his Church is built; and on what other foundation could the temple of the Lord have stood unshaken and secure? Not on a foundation laid by man; for that, like man himself, would have been unstable as the sand. Not on a foundation laid by angels; for that, being the work of creatures, could have had no virtue in itself to sustain the interests of a ruined world.

None but Immanuel, God in our nature, could sustain this mighty load. What the strength of all creatures could never have achieved, he graciously undertook and accomplished to the full, although the work subjected him to humiliation and to suffering intense beyond conception. He satisfied the claims of eternal justice, and is therefore able to save unto the uttermost. O what cause of joy that the foundation laid in Zion is so firm and sure! No power in the universe can shake it; for it is laid by him who has all power in heaven and on earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-couper.html">David Couper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ, the Builder and Ruler of the Temple in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-488e797d7c" data-kw="">
<blockquote><p>The more natural and simple the wine is, the more pure it is; mixtures do but adulterate it. The more simple the worship of God is — I speak of gospel simplicity and order — the more pure it is; human inventions and mixtures may abase it, they cannot adorn it. God’s altar under the law must be of earth; ‘If thou lift up a tool upon it, thou hast polluted it,’ Exod. xx. 24, 25. Men are apt to think, that by lifting up tools on God’s altar they polish it, but God himself saith they pollute it.

When the church was in her infancy, she was dressed in the swaddling clothes of ceremonies; but since she is grown up, God hath provided her other attire. To the Jews, the Sun of righteousness was behind, and therefore the shadow of those ceremonies was before. They were in force and power; but to us Gentiles the Sun of righteousness is before, and therefore the shadow of ceremonies is behind. When Christ came, those shadows seemed to say, as the angels to Jacob, ‘Let us go, for the day breaketh,’ Gen. xxxii. 26; at the death of Christ the veil of the temple was rent in twain from the top to the bottom, to acquaint us that the Jewish ceremonies must then vanish, Mat. xxvii. 51.

Reader, I would not be mistaken; I do not advise thee against that order and decency which is commanded in the worship of God, nor against active obedience to authority in things that are circumstantial, or not directly nor consequentially forbidden in Scripture, but I would counsel thee to beware, lest, like the dog in the fable, whilst thou art snapping at any shadow, thou dost not lose the substance; and withal I must tell thee, that as when the shadows grow long, it is a sign the sun is declining, so when those shadows, those even indifferent things increase, usually the substance, the light of holiness, decreaseth.

When corn runs out into straw and chaff, those that feed on it may well be thin and lean; but when it runs into ear and kernel, thou mayest expect such as eat of it to be fat and well-favoured: when religion runs into formalities and ceremonies, her followers can never be thriving spiritually — they may starve, for all the gaudy flowers wherewith the several dishes on her table are decked and set forth; it is the power of godliness alone, which, like wholesome and substantial food, will distribute nourishment and strength to the inner man.

I expect nourishment from bread, not from straw or stones, because God hath annexed his blessing to the former, not to the latter. I look for spiritual strength from divine institutions, not from human inventions, because God’s promise is made to word-worship, not to will-worship. One would think the sparks of that fire wherewith Aaron’s sons were consumed should fly in the faces of men, and make them afraid to offer up to the Lord what he commanded them not, Lev. x. 1, 2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling</cite>, (1661-65) in The Works of George Swinnock, M.A. (5 vols, Edinburgh: James Nichol, 1868), 1: 81-82.</span></figcaption>

<blockquote><p>Be much with God in religious duties. Secret praying, reading, and meditating, are great helps to piety. The bottom of a Christian’s building is underground, and out of the world’s sight. The greatest part of that trade which a saint drives with God is unseen, and his returns are unknown to the world. Christ giveth his sweetest kisses and dearest embraces to his spouse when she is alone. Jacob met with the blessing when he had parted with his company, and wrestled singly with the angel of the covenant. Bread eaten in secret, how sweet is it! When God meeteth thy soul in a morning or evening prayer, communion with his Majesty will be sweet to thee indeed.

Take heed of omission of duties in the closet. The Amalekite had not eaten in three days, who was nigh death. It is observed that the places under the line are not so hot as some places at a further distance, because, though they have the beams of the sun falling perpendicularly to cause a more intense heat, yet the nights there being longer than in some other parts, the days are not so hot. When the nights are long, the days are very cold; when there are long omissions of duties, godliness will cool.

Ah, didst thou but know what many a saint hath gained by that hidden calling, I am confident thou wouldst mind it, whatever thou didst omit. Remember how often and earnestly I have urged thee to this duty. It is thy privilege, that though thou canst not every day have the showers of public ordinances, yet mayest thou have the watering-pots of secret duties to make thy soul fruitful. Let no day pass without thy morning and evening sacrifices. Fasting is bad for some bodies; I am sure to fast from spiritual food is exceeding injurious to thy soul.

He that runneth into enormities (as a drunkard, or swearer, or adulterer, &amp;c.) he stabbeth his soul; he that omitteth daily duties, he starveth his soul. Now, what great difference is there between the death of the soul by stabbing and by starving? If thy soul die eternally, it will be little comfort to thee to plead that thou didst not drink, or swear, as others. Oh friend, let no day pass without secret duties; if thou risest in a morning, and followest thy calling all day, and liest down at night, and never desirest God’s company, or askest his blessing, I would know wherein thou dost God more service than the ox or ass? For shame, friend, do not thus play the beast any longer.</p></blockquote>

<blockquote><p>8. Likewise, every Christian should learn that this grace and this regeneration have not been given to us so that we might remain idle in that stage of our renewal which we at first obtained, but so that we may grow in everything into him who is the head. Therefore, the people must be taught to devote effort to this growth which indeed happens through good works, both internal and external, which are commanded and commended by God. To these works God has, in many passages from the Gospels, clearly and manifestly promised on account of Christ a reward – good things in this life, as much for the body as for the soul (as much as seems right to divine providence) and after this life in heaven. Therefore, although the inheritance of eternal life is due to the regenerate on account of the promise, as soon as they are reborn in Christ, nevertheless God also renders a reward to good works, not according to the substance of the works, nor because they come from us, but to the extent that they are performed in faith and proceed from the Holy Spirit, who dwells in us, free choice concurring as a partial agent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/colloquy-of-regensburg.html">Colloquy of Regensburg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anthony Lane, Justification by Faith in Catholic-Protestant Dialogue. An Evangelical Assessment, tr. Anthony Lane (London: 2002), Appendix 1, p. 236 This statement was agreed by both the Reformed and Romanist sides</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee49ad5efe" data-kw="">
<blockquote><p>Our consent [with Romanists on the state of perfection] I will set down in two conclusions: I. All true believers have a state of true perfection in this life: Mt. 5:48, ‘Be you perfect as your father in heaven is perfect.’ Gen. 6:9, ‘Noah was a just and perfect man in his time, and walked with God.’ Gen. 17:1, ‘Walk before me and be perfect.’ And sundry kings of Judah are said to walk uprightly before God with a perfect heart, as David, Josiah, Hezekiah, etc. And Paul accounts himself with the rest of the faithfull to be perfect, saying, ‘Let us all that are perfect be thus minded.’ Phil. 3:15. Now this perfection has two parts: The first is the imputation of Christ’s perfect obedience, which is the ground and fountain of all our perfection whatsoever. Heb. 10:14, ‘By one offering,’ that is, by his obedience in his death and passion, ‘has He consecrated, or made perfect, forever them that believe.’ The second part of Christian perfection is sincerity, or uprightness, standing in two things: The first is to acknowledge our imperfection and unworthiness in respect of ourselves: and hereupon, though Paul had said he was perfect, yet he adds further that he did account of himself, not as though he had attained to perfection: but did forget the good things behind, and endeavored himself to that which was before. Here therefore it must be remembered that the perfection whereof I speak may stand with sundry wants and imperfections. It is said of Asa that his heart was perfect with God all his days, and yet he pulled not down the high places, and being diseased in his feet, he put his trust in the physicians and not in the Lord. Secondly this uprightness stands in a constant purpose, endeavor and care to keep not some few, but all and every commandment of the Law of God, as David says, Ps. 119:6, ‘Then shall I not be confounded, when I have respect to all thy commandments.’ And this endeavor is a fruit of perfection, in that it proceeds from a man regenerate. For, as all men through Adam’s Fall, have in them by nature the seeds of all sin, none excepted, no not the sin against the Holy Ghost: so by grace of regeneration through Christ, all the faithful have in them likewise the seeds of all virtues needfull to salvation: and hereupon they both can and do endeavor to yield perfect obedience unto God, according to the whole law. And they may be termed ‘perfect,’ as a child is called a perfect man: though it want [lack] perfection of age and stature and reason: yet has it perfection of parts: because it has all and every part and faculty both of body and soul that is required to a perfect man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic… ([Cambridge] 1598), ch. 13. ‘Of the State of Perfection’</cite>, pp. 980-81</span></figcaption>

</figure><figure class="quote" id="q-94f47c7fb4" data-kw="sanctification follows justification">

</figure><figure class="quote" id="q-0b2ac2e5f1" data-kw="">
<blockquote><p>…in a man regenerate, there are two contrary qualities inherent in every faculty: 1. Grace, in a rectified holy inclination to goodness, infused into it. 2. Corruption in a vitious quality disposing it to evil. These two qualities abide in the regenerate, and oppose one another… let us proceed to declare what is a regenerate man’s resistance that he makes against the working of grace in hindering the performance of any good work: which you shall perceive by these two conclusions: 1. A man regenerate so far forth as he is Spiritual, never resists the work of grace, but is constantly most willing and forward to the performance of all holy actions. … 2. That a man regenerate, so far forth as he is carnal, does always resist the work of grace, being unwilling and backward to perform any holy action. … To conclude this point, there is in every regenerate man a possibility or power of resistence always remaining so long as any corruption abides in him, which will perpetually make some opposition more or less in the performance of every good work. But for the prevailing act of resistency whereby such good works might be quite hindered, we affirm that by the power of assisting grace effectually aiding the regenerate faculties, that act is taken away. The flesh may strive, but the Spirit does overcome… a victory indeed certain in regard of the event, but with some uncertainty in the combat, wherein Israel is sometime put unto the worst. For you are to note that albeit in the general as touching those main and principal acts of beleeving, repenting, persevering in obedience, etc. grace does work so effectually with man’s regenerate will that corruption cannot hinder it in the exercise of those acts: nevertheless, in many particular actions after his first conversion in the continued practice of sanctification, he may obey the enticings of his corrupt concupiscence, against the motions of the Spirit of grace. For many times in sundry particulars of Christian practice God is pleased to deny that effectual assistance which at other times He affords, and then He leaves us unto our own strength, for experiment to try what is in us, for humiliation in discovery of our weakness unto us, for exercise of Christian watchfulness in making diligent use of all gracious helps, and the like good purposes. … But these desertions are not perpetual: corruption may for a time let [prevent] the exercise of some particular graces, but in all and always it shall never hinder: God who has given unto a regenerate man a power to believe by the changing of his will through the infusion of a constant inclination to all spiritual good, will also cause the act of believing infallibly to ensue, by the assistance of cooperating grace, so powerfully strengthening the regenerate will, and so effectually restraining the rebellious motions of corruption that the will shall not choose but do that which above all things in the world it most desires to do, namely, believe and obey the Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 148-57 in Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith… (London: 1627)</cite>, pp. 148-54</span></figcaption>

 in sundry particulars of Christian practice God is pleased to deny that effectual assistance which at other times He affords, and then He leaves us unto our own strength, for experiment to try what is in us, for humiliation in discovery of our weakness unto us, for exercise of Christian watchfulness in making diligent use of all gracious helps, and the like good purposes. … But these desertions are not perpetual: corruption may for a time let [prevent] the exercise of some particular graces, but in all and always it shall never hinder: God who has given unto a regenerate man a power to believe by the changing of his will through the infusion of a constant inclination to all spiritual good, will also cause the act of believing infallibly to ensue, by the assistance of cooperating grace, so powerfully strengthening the regenerate will, and so effectually restraining the rebellious motions of corruption that the will shall not choose but do that which above all things in the world it most desires to do, namely, believe and obey the Gospel.”

— William Pemble, pp. 148-57 in Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith… (London: 1627), pp. 148-54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6in+a+man+regenerate%2C+there+are+two+contrary+qualities+inherent+in+every+faculty%3A+1.+Grace%2C+in+a+rectified+holy+inclination+to+goodness%2C+infused+into+it.+2.+Corruption+in+a+vitious+quality+disposing+it+to+evil.+These+two+qualities+abide+in+the+regenerate%2C+and+oppose+one+another%E2%80%A6+let+us+proceed+to+declare+what+is+a+regenerate+man%E2%80%99s+resistance+that+he+makes+against+the+working+of+grace+in+hindering+the+performance+of+any+good+work%3A+which+you+shall+perceive+by+these+two+conclusions%3A+1.+A+man+regenerate+so+far+forth+as+he+is+Spiritual%2C+never+resists+the+work+of+grace%2C+but+is+constantly+most+willing+and+forward+to+the+performance+of+all+holy+actions.+%E2%80%A6+2.+That+a+man+regenerate%2C+so+far+forth+as+he+is+carnal%2C+does+always+resist+the+work+of+grace%2C+being+unwilling+and+backward+to+perform+any+holy+action.+%E2%80%A6+To+conclude+this+point%2C+there+is+in+every+regenerate+man+a+possibility+or+power+of+resistence+always+remaining+so+long+as+any+corruption+abides+in+him%2C+which+will+perpetually+make+some+opposition+more+or+less+in+the+performance+of+every+good+work.+But+for+the+prevailing+act+of+resistency+whereby+such+good+works+might+be+quite+hindered%2C+we+affirm+that+by+the+power+of+assisting+grace+effectually+aiding+the+regenerate+faculties%2C+that+act+is+taken+away.+The+flesh+may+strive%2C+but+the+Spirit+does+overcome%E2%80%A6+a+victory+indeed+certain+in+regard+of+the+event%2C+but+with+some+uncertainty+in+the+combat%2C+wherein+Israel+is+sometime+put+unto+the+worst.+For+you+are+to+note+that+albeit+in+the+general+as+touching+those+main+and+principal+acts+of+beleeving%2C+repenting%2C+persevering+in+obedience%2C+etc.+grace+does+work+so+effectually+with+man%E2%80%99s+regenerate+will+that+corruption+cannot+hinder+it+in+the+exercise+of+those+acts%3A+nevertheless%2C+in+many+particular+actions+after+his+first+conversion+in+the+continued+practice+of+sanctification%2C+he+may+obey+the+enticings+of+his+corrupt+concupiscence%2C+against+the+motions+of+the+Spirit+of+grace.+For+many+times+in+sundry+particulars+of+Christian+practice+God+is+pleased+to+deny+that+effectual+assistance+which+at+other+times+He+affords%2C+and+then+He+leaves+us+unto+our+own+strength%2C+for+experiment+to+try+what+is+in+us%2C+for+humiliation+in+discovery+of+our+weakness+unto+us%2C+for+exercise+of+Christian+watchfulness+in+making+diligent+use+of+all+gracious+helps%2C+and+the+like+good+purposes.+%E2%80%A6+But+these+desertions+are+not+perpetual%3A+corruption+may+for+a+time+let+%5Bprevent%5D+the+exercise+of+some+particular+graces%2C+but+in+all+and+always+it+shall+never+hinder%3A+God+who+has+given+unto+a+regenerate+man+a+power+to+believe+by+the+changing+of+his+will+through+the+infusion+of+a+constant+inclination+to+all+spiritual+good%2C+will+also+cause+the+act+of+believing+infallibly+to+ensue%2C+by+the+assistance+of+cooperating+grace%2C+so+powerfully+strengthening+the+regenerate+will%2C+and+so+effectually+restraining+the+rebellious+motions+of+corruption+that+the+will+shall+not+choose+but+do+that+which+above+all+things+in+the+world+it+most+desires+to+do%2C+namely%2C+believe+and+obey+the+Gospel.%E2%80%9D%0A%0A%E2%80%94+William+Pemble%2C+pp.+148-57+in+Vindici%C3%A6+grati%C3%A6.+%3D+A+Plea+for+Grace%2C+More+especially+the+Grace+of+Faith%E2%80%A6+%28London%3A+1627%29%2C+pp.+148-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0b2ac2e5f1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0b2ac2e5f1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=in%20a%20man%20regenerate%2C%20there%20are,namely%2C%20believe%20and%20obey%20the%20Gospel&amp;text=in%20a%20man%20regenerate%2C%20there%20are%20two%20contrary&am

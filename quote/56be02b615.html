<main class="wrap"><figure class="quote" id="q-56be02b615" data-kw="">
<blockquote><p>2. And you will hinder the great benefit which the world may get, by their vain attire: For (though it be no thanks to them that intend it not) yet it is a very great commodity that comes to mankind by these people’s sin: that fools should go about in fools-coats, and that empty brains, and proud and wanton hearts should be so openly detected in the streets and churches: that sober people may avoid them; and that wise, and chaste, and civil people may not be deceived by such in marriage to their undoing: As the different clothing of the different sexes is necessary to chastity and order; so it is a matter of great convenience in a commonwealth, that sots, and swaggerers, and phrenetics, and Idiots, and proud, and wanton lustful persons should be openly distinguished from others: As in a plague-time the doors of infected houses are marked with a ‘Lord have mercy on us’: And the wisest magistrate knew not how to have accomplished this himself by a law, as the wretches themselves do by their voluntary choice: For if it were not voluntary, it would be no distinguishing badge of their profession. Now for any honest civil people to join with them and take up their livery, and the habit of their Order, is to profess themselves such as they, and so to encourage and approve them, or else to confound the proud and humble, the vain and the sober, the wanton and the chaste, and destroy the benefit of distinction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), p. 467</span></figcaption>

<blockquote><p>In the siege of Leyden we have a thrilling example of their sufferings and heroism. Three months after the commencement of the siege the food-supply was exhausted. A fearful famine began to rage. For seven weeks the inhabitants had no bread to eat and multitudes perished of hunger. On the heels of the famine came the plague or black death, which carried off a third part of the citizens. The apparently doomed survivors subsisted on dogs and cats. To the summons to surrender, they replied: ” As long as you hear the mew of a cat or the bark of a dog you may know that the city holds out. And when all have perished but ourselves, we will devour our left arms, retaining our right to defend our women, our liberty, and our religion against the foreign tyrant.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-be5edc98fb" data-kw="">
<blockquote><p>The Christian Reformed Church holds it as one of its distinctive principles that the psalms are to be used in public worship as the chief manual of praise. There is divine authority for this use of the psalms, as shown by 1 Chron. 16:4, 7; II Chron. 29:30; Ps. 105:2; 95:1, 2 and Neh. 12:24. Our Lord and his apostles used them to praise God. The “hymn” of Matt. 26:30 and Mark 14;26 refers to Psalms 113 to 118, the great “Hallel” of the Passover celebration. The hymns, songs, and psalms of Eph. 15:19 and Col. 3:16 evidently to not refer to N. T. compositions but to the O.T. Psalms which in the Greek version bear the titles given above. The psalms meet the great requirements of praise, exalting God in His being and work and continuing confessions of our unworthiness, our faith, our gratitude, our needs. In depth of spirituality the psalms excel the hymns. “In the psalms we hear the abiding, eternal fundamental note of the pious heart resounding.” [G. M. Ophoff, Church Right—ed.]….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-beets.html">Henry Beets</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Historical and Explanatory Introduction,” in The Psalter, Doctrinal Standards, Liturgy, And Church Order of the Christian Reformed Church in America</cite>, (Grand Rapids: William B. Eerdmans Publishing Co., 1926).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

r" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-17d2591676" data-kw="">
<blockquote><p>And the best recreation to a spiritual mind, when it is weary of worldly employments, is to walk into Christ’s garden, and there, by reading and meditating, singing of Psalms (Col. 3:16) and holy conference, you may solace yourself with the sweet comforts of the holy Spirit, and may work your heart to joy in God, even to joy in the holy Ghost, and to a delight in the Commandments and Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Daily Walk in Holy Security and Peace</cite>, … (London, 1631), ch. 9, ‘Of keeping Company, as in the sight of God’, section 3, p. 236-7. While Scudder in the passage immediately below allows Col. 3:16 to speak of uninspired compositions in the context of private or social conference, yet the only reference in the book to the content of the Church’s public praise is to ‘psalms’ simply, as is documented below., pp. 64-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

%20the%20Commandments%20and%20Word%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-adc2d5bc08" data-kw="">
<blockquote><p>So, for that scriptural heavenly duty of singing: what more commonly alleged against it than the abuse and ill effects of that precious ordinance? How often is the nonsense and error of the common translation, the rudeness and dullness of the meter of some Psalms, as Ps. 7:13, as also the cold formality with which that ordinance is performed by many who do but parrotize? I say, how often are these things buzzed into the ears of the people to alienate their hearts from so sweet and beneficial a duty? And very often we find it urged [by Antinomians, who sometimes forsook singing public praise altogether] to the same end, how unwarrantable and dangerous a thing it is for carnal and unregenerated persons to appropriate to themselves in singing those praises and experiences which are peculiar to the saints; not understanding or considering that the singing of Psalms is an ordinance of Christ appointed for teaching and admonition, as well as praising, Col. 3:16, ‘Teaching and admonishing one another in psalms and hymns,’ etc… If Satan can prevail first with wicked men to corrupt and abuse God’s ordinances by superstitious mixtures and additions; and then with good men to renounce and slight them for the sake of those abuses; he fully obtains his design, and gives Christ a double wound at once; one by the hands of his avowed enemies, the other by the hands of his friends, no less grievous than the first. First, wicked men corrupt Christ’s ordinances, and then good men nauseate them.</p></blockquote>

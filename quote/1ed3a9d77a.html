<main class="wrap"><figure class="quote" id="q-1ed3a9d77a" data-kw="">
<blockquote><p>As for the Love-feasts used in the primitive Church: 1. They had no religious state in divine worship, but were used only as moral signs of mutual charity. The Rhemists [Romanists] will have them called Coenas dominicas. But what-says Cartwright against them? ‘We grant that there were such feasts used in times past, but they were called by the name of [Greek] or Love-feasts, not by the name of the Lord’s Supper: neither could one without sacrilege give so holy a name to a common feast, which never had ground out of the Word, and which after for just cause was thrust out by the Word of God.’ 2. If it be thought, that they were used as sacred signs of Christian charity, because they were eaten in the Church. I answer, the eating of them in the Church is forbidden by the apostle. ‘What?’ says he, ‘have ye not houses to eat and to drink in?’ or despise ye the Church of God? Aperte vetat, says [David] Pareus: commessationes in Ecclesia, quocunque fueo pingantur. Vocabant [Greek] charitates: sed nihil minus erant. Erant schismatum fomenta. Singulae enim sectae suas instituebant. And a little after: Aliquae Ecclesiae obtemperasse videntur. Nam Iustini temporibus Romana Ecclesia [Greek] non habuit. (Commentary in that place)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3, ch. 5</cite>, p. 90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e902daaad4" data-kw="">
<blockquote><p>Thirdly, to introduce significant sacred ceremonies into the New testament, other than the holy sacraments of God’s own institution, were to reduce Judaism and to impose upon us again the yoke of a ceremonial Law, which Christ has taken off. … Upon this ground also does Perkins condemn all human significant ceremonies. ‘Ceremonies,’ says he, ‘are either of figure and signification, or of order.’ (Com. On Gal. 3:24) The first are abrogated at the coming of Christ, etc. Upon the same ground does Chemnitius condemn them, Quod vero praetenditur, etc. ‘But whereas,’ says he, ‘it is pretended that by those rites of men’s addition, many things are profitably signified, admonished, and taught: Hereto it may be answered that figures do properly belong to the Old Testament: but those things which Christ would have to be taught in the New Testament, he would have them delivered and propounded, not by shadows, but by the light of the Word. And we have a promise of the efficacy of the Word, but not of figures invented by men. (Exam., part 2, de rit. in admin. sacram., p. 32)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3, ch. 5</cite>, p. 83</span></figcaption>

" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a86835e0cd" data-kw="">
<blockquote><p>This foolish imitation of the apostles in all things in matters of external order, has been and is the great foundation of evils on all hands, both in many practices and points of Popery, and amongst the Anabaptists (as I could demonstrate in particulars). Learned Danaeus in his Commentaries upon 1 Tim. ch. 5 [v. 13] speakes of it. Apostolici inter Anabaptist as Schlusselburgius writes also (On the Sect of the Anabaptists), that there is a sort of Anabaptists called Apostolici [Apostles], so named because they professed to imitate the apostles in all things: they washed one another’s feet, they held all things ought to be common, they travailed up and down without staff, shoes, cloak, money, because of Christ’s words, they went up to the tops of houses to preach, because Christ had said, what you have heard in the ear, preach upon the house-top.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644)</cite>, pp. 77-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-36bca76b8d" data-kw="">
<blockquote><p>We require not of necessity an artificial table of timber: a bull-hide or a plot of ground may serve in time of necessity, and answers analogically to a standing table, as the plot of ground did whereabout the multitude sat in rows by fifties and fifties, Mark 6. Neither do we stand upon the fashion, whether it be long or round; but we require that the communicants always sit table-ways [like at a table], so that they may observe the form of a feast or banquet: For in that this holy action is called a ‘supper’, it is imported that it was celebrated in the form of a feast or banquet, as [Johannes] Piscator observes in his observations upon Mt. 26. We do not require all the forms used at common feasts, but these which Christ the institutor, and Master of the feast thought sufficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Re-Examination of Two of the Articles Abridged: to wit, of the Communicants’ Gesture in the Act of Receiving, Eating &amp; Drinking… ([Holland?] 1636), ‘Of the Communicants’ Gesture in the Act of Receiving’, p. 14 Calderwood was an arch-Scottish presbyterian minister and theologian, who was the major mouthpiece for them between 1618-1637.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“We require not of necessity an artificial table of timber: a bull-hide or a plot of ground may serve in time of necessity, and answers analogically to a standing table, as the plot of ground did whereabout the multitude sat in rows by fifties and fifties, Mark 6. Neither do we stand upon the fashion, whether it be long or round; but we require that the communicants always sit table-ways [like at a table], so that they may observe the form of a feast or banquet: For in that this holy action is called a ‘supper’, it is imported that it was celebrated in the form of a feast or banquet, as [Johannes] Piscator observes in his observations upon Mt. 26. We do not require all the forms used at common feasts, but these which Christ the institutor, and Master of the feast thought sufficient.”

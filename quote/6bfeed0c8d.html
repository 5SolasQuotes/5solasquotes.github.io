<main class="wrap"><figure class="quote" id="q-6bfeed0c8d" data-kw="">
<blockquote><p>The great importance of simplicity in preaching, is apparent from various considerations. It is impossible without it to interest deeply the common people. By abstract and excessively analytic discourse, they are little moved, and less profited. They may admire, vaguely, the preacher’s profoundness, but they understand him not, and weariness soon ensues.

They care much less, indeed, for the recondite qualities of things, than for their obvious and practical nature. If truth interests them at all, it is in the living and palpable forms which the Bible gives it. If the water of life allures them, it is not as decomposed, but as it flows from the throne of God and the Lamb.

And the common people, be it remembered, are the great mass of the people, the great majority of our hearers, and withal the most hopeſul subjects of ministerial labour. It was so in the days of Christ. His ministry was chiefly attended by the plain people, and of that class were most of his followers. He had good reason, then, for adapting his preaching to such. And so have his ministers now. He of whom it cannot be said that the common people hear him gladly, may look for little success as a preacher of the gospel. He may be distinguished as a poet, or a critic, as a historian, an antiquarian, or a metaphysician, as deeply versed in theology even—but not as winning souls to Christ.

The wisdom of our Lord’s example, in respect to the point in hand, may be still further evinced. Simplicity of discourse is quite as effective with the truly intellectual, as with the common people. It is no indication of feebleness or poverty of mind, but the very reverse. It is easy enough to make a plain subject dark, by pedantic and profitless distinctions and definitions; but it is one of the highest achievements of intellect to make a dark subject so plain, that all shall wonder it ever seemed otherwise.

Never is learning so magnified, as when she passes over her processes, and gives you her simple results. So the truly learned judge. Hence they respect most highly the preacher who, other things being equal, is most eminent for simplicity of discourse. And the preaching of such a man, is to them, as well as the common people, the most impressive. The truth is, the commonest sympathies of our race, the most ordinary springs of action, are ever the mightiest. Ascertain what chord is of deepest tone in the hearts of the multitude, and you have learned what chord will vibrate most powerfully in the bosoms of the intellectual few.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-67a848c7de" data-kw="">
<blockquote><p>1. Jesus preached peace (Eph. 2:17); don’t be a better preacher than Jesus.

2. Preach first to yourself.

3. Preach from your heart, not only to their heart.

4. Leverage your own distress.

5. How much do you have to hate the people to try to impress them rather than help them?

6. A pervasive tone of encouragement.

7. Vivid imagery. Visceral, sensory. Littered with analogues.

8. They’re more distressed than they’re revealing.

9. The power is in the Word, not your cleverness.

10. The Spirit works with your weakness and need, not our strength and sufficiency.

11. Think yourself full, pray yourself aglow.

12. Be concrete, not abstract.

13. Specificity communicates universality.

14. Be clear. Lewis: sheep. If you given them a route to misunderstand, they’ll take it.

15. Be simple but not simplistic.

16. Ruthlessly cut everything extraneous.

17. Smile. And mean it. Preaching is an act of pastoral love.

18. Doctrine is not enough; but, people do want to know doctrine.

19. Regularly reveal something of your own weakness.

20. Let them know of exegetical discoveries new to you.

21. Don’t ask adjectives to do the work verbs should be doing.

22. Make the gospel clear at some point.

23. Both unbelievers and believers are present.

24. Both eager and stagnant belieers are present.

25. Remember, and speak directly to, the kids.

26. Speak in your natural everyday voice; resist every form of ‘the preacher’s voice’.

27. Handle objections.

28. When on the fence, shorter is better.

29. Quit preaching while you still have them.

30. You don’t look as happy as you are; so stretch for joy.

31. If they feel loved by you (Phil. 4:1), they will feel hurt with you (Phil. 4:14).

32. ‘We will hear you again about this’ (Acts 17:32). Intrigue them with Jesus, even if they haven’t collapsed into his arms yet.

33. Don’t let your main points be transposable onto any other text in the Bible.

34. Slow down to notice every actual word of the text–what it says, and doesn’t say.

35. Calm down and be yourself.

36. Be a farmer, not a penny stock trader. Crock pot, not microwave.

37. They don’t need eloquence; they need radiance.

38. T.F. Tenney: ‘Preach every sermon like your son is sitting on the last row and giving church one last chance.’

39. Tincture. Give them a taste of what Jesus himself is like. Rutherford.</p></blockquote>

<blockquote><p>The foregoing opinion [that the knowledge of God is self-evident] arose from their being accustomed from the beginning to hear and call upon the name of God. Now custom, especially if it dates from our childhood, acquires the force of nature, from which it happens that the mind holds those things with which it was imbued from childhood as firmly as though they were self-evident.</p></blockquote>

<blockquote><p>I saw the evil of legal preaching, which lies in one of two things, or in both. 1. In laying too much stress upon the works of the law, our duties and strength: Or, 2. In pressing evangelical doctrines without an eye to that which is the spring of the church’s edification, the Spirit of the Lord… O Lord, thou knowest how much of it is in this poor church.</p></blockquote>

<blockquote><p>Northampton, May 18, 1742.

My dear Friend,

I am fully satisfied by the account your father has given me, that you have lately gone out of the way of your duty, and done that which did not belong to you, in exhorting a public congregation. I know you to be a person of good judgment and discretion, and therefore can with the greater confidence put it to you to consider with yourself what you can reasonably judge would be the consequence, if I and all other ministers should approve and publicly justify such things as laymen’s taking it upon them to exhort after this manner? If one may, why may not another? And if there be no certain limits or bounds, but every one that pleases may have liberty, alas! what should we soon come to? If God had not seen it necessary that such things should have certain limits and bounds, he never would have appointed a certain particular order of men to that work and office, to be set apart to it in so solemn a manner, in the name of God: the Head of the church is wiser than we, and knew how to regulate things in his church.

’Tis no argument that such things are right, that they do a great deal of good for the present, and within a narrow sphere; when, at the same time, if we look on them in the utmost extent of their consequences, and on the long run of events, they do ten times as much hurt as good. Appearing events are not our rule, but the law and the testimony. We ought to be vigilant and circumspect, and look on every side, and, as far as we can, to the further end of things. God may if he pleases, in his sovereign providence, turn that which is most wrong to do a great deal of good for the present; for he does what he pleases. I hope you will consider the matter, and for the future avoid doing thus.

You ought to do what good you can, by private, brotherly, humble admonitions and counsels; but ’tis too much for you to exhort public congregations, or solemnly to set yourself, by a set speech, to counsel a room full of people, unless it be children, or those that are much your inferiors, or to speak to any in an authoritative way. Such things have done a vast deal of mischief in the country, and have hindered the work of God exceedingly. Mr. [Gilbert] Tennent has lately wrote a letter to one of the ministers of New- England, earnestly to dissuade from such things.

Your temptations are exceeding great: you had need to have the prudence and humility of ten men. If you are kept humble and prudent, you may be a great blessing in this part of the land, otherwise you may do as much hurt in a few weeks as you can do good in four years. You might be under great advantage by your prudence to prevent those irregularities and disorders in your parts, that prevail and greatly hinder the work of God in other parts of the country; but by such things as these you will weaken your own hands, and fill the country with nothing but vain and fruitless and pernicious disputes. Persons when very full of a great sense of things are greatly exposed; for then they long to do something, and to do something extraordinary; and then is the devil’s time to keep them upon their heads, if they be not uncommonly circumspect and self-diffident.

I hope these lines will be taken in good part, from your assured friend,

Jonathan Edwards.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-17ff3efc11" data-kw="">
<blockquote><p>The covenant of works could by no means be renewed by fallen Adam, so as thereby to help himself and his posterity out of this misery, the which is the only thing in question here; otherwise, indeed, it might have been renewed, which is evident by this sad token, that many do actually renew it in their covenanting with God, being prompted thereto by their ignorance of the high demands of the law, their own utter inability, and the way of salvation by Jesus Christ. And from the same principle our legalist here makes no question but Adam might have renewed it, and kept it too, for the after-time; only, he questions whether or not Adam might thereby have helped himself, and his posterity too, out of the misery they were brought into by his sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Notes in Edward Fisher, The Marrow of Modern Divinity</cite>, (Christian Focus Publications, 2009), 62 (HT).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-354c26cd8f" data-kw="">
<blockquote><p>Because what God so severely punished must have been no light sin but a detestable crime, we must consider what species of sin (peccati) there was in Adam’s fall that kindled God’s horrible vengeance against the whole human race. To regard Adam’s sin as gluttonous intemperance (a common notion) is childish. As if the sum and head of all virtues lay in abstaining solely from one fruit, when all sorts of desirable delights abounded everywhere; and not only abundance but also magnificent variety was at hand in that blessed fruitfulness of earth! We must, therefore, look deeper. The prohibition from the tree of knowledge of good and evil was a test of obedience (obedientiae examen), that Adam, by observing it, might prove his willing submission to the command of God. The very name of the tree shows the sole purpose of the precept was to keep him content with his lot and to prevent him from becoming puffed up with cupidity. The promise (promissio), which gave him hope of eternal life as long as he should eat of the tree of life (arbore vitae), and, on the other hand, the fearful denunciation of death the moment he should taste of the tree of knowledge of good and evil, were meant to test (probandam) and exercise his faith. Hence it is not hard to deduce by what means Adam provoked God’s wrath upon himself. Indeed, Augustine speaks rightly when he declares that pride was the beginning of all evils. For if ambition had not raised man higher than was meet and right, he could have remained in his original state.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.1.4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-1b06862aa9" data-kw="">
<blockquote><p>The other covenant or testament here supposed, whereunto that whereof the Lord Christ was the mediator is preferred, is none other but that which God made with the people of Israel on mount Sinai. So it is expressly affirmed, verse 9: “The covenant which I made with your fathers in the day when I took them by the hand to lead them out of the land of Egypt.” This was that covenant which had all the institutions of worship annexed unto it, Hebrews 9:1-3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 76</span></figcaption>

</figure><figure class="quote" id="q-608b2c4844" data-kw="">
<blockquote><p>…In Hos. 6:7 we read: “But they like Adam have transgressed the covenant.” Attempts have been made to discredit this reading. Some have suggested the reading “at Adam,” which would imply that some well-known transgression occurred at a place called Adam. But the preposition forbids this rendering. Moreover, the Bible makes no mention whatever of such a well-known historical transgression at Adam. The Authorized Version renders “like men,” which would then mean, in human fashion. To this it may be objected that there is no plural in the original, and that such a statement would be rather inane, since man could hardly transgress in any other way. The rendering “like Adam” is after all the best. It is favored by the parallel passage in Job 31:33; and is adopted by the American Revised Version.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Grand Rapids: Wm. B. Eerdmans publishing co., 1938), 214–15.</span></figcaption>

</figure><figure class="quote" id="q-874faebf03" data-kw="">
<blockquote><p>God had before given the covenant of works, or perfect obedience, unto all mankind, in the law of creation. But this covenant at Sinai did not abrogate or disannul that covenant, nor any way fulfill it. And the reason is, because it was never intended to come in the place or room thereof, as a covenant, containing an entire rule of all the faith and obedience of the whole church. God did not intend in it to abrogate the covenant of works, and to substitute this in the place thereof; yea, in sundry things it re-enforced, established, and confirmed that covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 93</span></figcaption>

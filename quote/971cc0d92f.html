<main class="wrap"><figure class="quote" id="q-971cc0d92f" data-kw="">
<blockquote><p>Does it belong to the perfection of the soul that we comprehend God’s essence? Response: certainly this does not appear to be the case, and the reason is that what is incomprehensible cannot be comprehended. But, they say, even if what is infinite cannot be comprehended distinctly, nevertheless, it can be comprehended confusedly, and they called this ‘comprehension.’ Thus, that famous phrase: ‘All God is known, but not totally.’ [totum sed non totaliter; this phrase summarizes Thomas, Summa, pt. 1, q. 12, art. 7, replies to objections 2-3] And they bring up the example of an eye, which contemplates the whole man; namely, confusedly, but not totally. Response: There is no comparison between things which come within reach of eyesight and the divine nature… the divine nature is most simple; certainly the soul cannot confusedly comprehend those things which are most simple, let alone the senses, unless it comprehends them in another way than by essence; that is, by laying hold of their very essence. And thus, if God is known by us by essence, it is necessary for him to be known by us distinctly; and if he is known by us distinctly, he is indeed comprehended, which those who state that God will be seen by essence in the life to come do not wish to concede. the axiom common in the schools, “All that is received is received according to the manner of the recipient.” Now, if God’s essence will be seen, it will be seen in a finite way, for the recipient is finite: and thus, the infinite will be seen by essence in a finite way, which implies a contradiction. For finite knowledge is an image of a thing in the mind, and thus, if knowledge is finite, but the thing comprehended is infinite, on the other hand, it follows that the thing is known and not known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Johannes Hoornbeek, ch. 13, §§19-20 of Institutes of Theology, tr. Charles Johnson</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b22aa1c0a9" data-kw="">
<blockquote><p>I. There are three kinds or differences of life: there is a life of nature, which the apostle calls Natural. There is a life of Grace, which the sons of God alone do enjoy in this world: there is a life of Glory, which consists in the vision of God. II. Life eternal is two ways taken: Metonymically, both for the way to life, and for Christ Himself: Properly, for the state of the blessed after this life. III. There is one vision of God natural, in the things created; another specular, or symbolical, by resemblances and signs; another of faith, by the doctrine and doings of Christ; another of present sight, or of glory to come, when we shall see God face to face.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity</cite>, … (London, 1610), bk. 3, ch. 8, ‘Of Man’s Estate After this Life’ | The Part Confuting, of Life Eternal, pp. 594-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-496b81c5fc" data-kw="">
<blockquote><p>Uniquely among the thirteenth-century Scholastic theologians, Henry of Ghent (c.1217–1293) gives an account of beatific union with God according to which it consists not simply in God’s being the object of a creature’s acts of cognition and/or volition, but in God’s fully interpenetrating the creature in such a way that the creature becomes in some sense identical with God. This article places Henry’s view in its immediate theological context, and outlines the two most important immediate reactions to it – including its influence, hitherto unnoticed, on Meister Eckhart’s account of mystical union. In so doing, it highlights a continuity between Scholastic and non-Scholastic theology in the Middle Ages.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cross.html">Richard Cross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Scholastic Debates on Beatific Union with God: Henry of Ghent</cite>, (c.1217-1293) &amp; his Interlocutors’ in Traditio</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-605a0ea47d" data-kw="saints know one another">
<blockquote><p>Will the saints in the other world know one another? We affirm. As in the Scriptures nothing is taught expressly and distinctly on this question, so nothing is set forth to be necessarily believed concerning it. In the meanwhile, the more common opinion is the affirmative, which asserts that the saints will know each other. In our opinion, this is also the more probable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.11.1</span></figcaption>

</figure><figure class="quote" id="q-260ef3bfc3" data-kw="">
<blockquote><p>…but in heaven we see God face to face, that is without means… I cannot determine whether, when we shall know and see the Lord in an immediate vision of glory, our understanding shall receive created forms, intellectual species, images, characters of the lovely essence, the white, ruddy, pleasant, lovely countenance, of that desirable Prince, the Lord Jesus; its a nicety not for our edification, sure Christ shall infuse and pour in into every vessel of glory, so much of Himself, his presence, loveliness, image, beauty, as from bottom to brim, the soul shall be full…</p></blockquote>

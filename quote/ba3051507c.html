</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-39ccd92681" data-kw="Councils">
<blockquote><p>The authority of councils sinks far below that of the Scriptures, nor do their decisions bind the conscience any further than they appear to be conformed to the word of God. Hence a judgment belongs to them in matters of faith; not authoritative, infallible and supreme, but subaltern and ministerial; obligatory as to the external order of ecclesiastical communion and which ought to be of great weight among all the pious, but not as to faith and conscience, except insofar as they coincide with the Scriptures, which alone can bind the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.14</span></figcaption>

</figure><figure class="quote" id="q-ca1b9558ba" data-kw="">
<blockquote><p>Question 3. Whether indifferent actions differ nothing among themselves, but are all equally distant from good and evil? 7th Answer. In their own intrinsic nature they differ nothing at all; but yet there are some which for the most part have evil circumstances annexed to them, and so bend more toward evil, and have an evil name, as to do the work of an accuser, the office of an hangman, etc. Some there be also which for the most part have good circumstances, and so bend toward good, and have a good name, as, to till the ground, to follow our study diligently, etc. Question 4. Whether do things indifferent make any thing for order and comeliness? 8th Answer. Whatsoever it is that of its own nature serves for order or comeliness, or edification, is not indifferent: for when they do participate [in] the nature of goodness, they are not in the middle betwixt good and bad. And when they produce good, they must needs have some good force and efficacy in them: every thing brings forth its like. Question 5. Whether do indifferent things cease to be indifferent when any certain thing is set down concerning them, by such as are in authority? 9th Answer. Nothing ought to be commanded, but that which is good, nor to be forbidden, but what is evil; That which is indifferent cannot simply, absolutely, and forever be either enjoined or forbidden; but commanded, as it draws near to good, forbidden, as it approaches to evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof ([Leiden &amp; London] 1639), bk. 3, ch. 18, ‘Of Things Indifferent’</cite>, p. 89</span></figcaption>

</figure><figure class="quote" id="q-bbb1578b3d" data-kw="">
<blockquote><p>93. Next it may be granted that the [Church] matter may be put under a further examination [by the Church, at the request of the Magistrate], yet upon condition, that when it is come to the revision of the former [Church] sentence, regard may be had of the weaker which are found willing to be taught, though they doubt; but that unto the wicked and contentious tempters, which do mainly strive to oppress our liberty which we have in Christ, and to bring us into bondage, we do not for a moment give place by subjecting ourselves; for what else seek they or wait for, than that under the pretense of a revising and of new debate, they cast in lets and impediments ever and anone, and that by cunning lyings in wait they may betray the liberty of the Church, and in process of time may by open violence more forceably break in upon it, or at least constrain the ministers of the Church to weave Penelope’s web, which they can never bring to an end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>111 Propositions</cite></span></figcaption>

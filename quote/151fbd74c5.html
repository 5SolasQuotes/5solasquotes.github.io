<blockquote><p>XXIV. In this [third state] it is asked: Whether in man’s first conversion to God our will cooperates actively with divine grace by its natural and inherent faculty, or whether in first conversion it behaves passively such that at the first moment of conversion it does not contribute at all, but allows the power of willing well to be infused into itself. The Papists assert the former; we, with Scripture, the latter. XXV. Eze. 11:19: ‘I will take away the heart of stone and give a heart of flesh.’ 1 Cor. 12:3: ‘No one can say Jesus is Lord except through the Holy Spirit.’ Ps. ‘Create in me a clean heart, O Lord, and renew a right spirit within me.’ Jn. 6:44: ‘No one can come to me unless the Father who sent me draws him.’ Phil. 2:13: ‘God is the one who works both to will and to accomplish.’ And these things concern that third [state]; the fourth follows. XXVI. In which those renewed and made children of God, moved by the Holy Spirit, act, namely freely cooperating with divine grace: for since the new man is gradually restored, that is, that image of God lost in Adam is gradually brought back, there is no doubt that they then freely will and meditate on actions conforming to divine Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on Free Will’</cite>, (Leiden: Patius, 1603), trans. AI Latin</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8d1426d071" data-kw="">
<blockquote><p>And from our own [reformed] writers [on regeneration]: the treatise of William Whately on regeneration; the sermon of Obadiah Sedgwick on Rev. 3:1-3; Nicolas Byfield’s Principia Fidei [Principles of Faith], ch. 25; the various opuscula [small works] of Paul Baynes; Thomas Hooker on the humiliation of the soul, on the preparation of the soul for Christ, on the union of the soul with Christ, etc.; and writers on the practice of repentance: Perkins, Stock, Daniel Dyke, Arthur Dent… They are to be read, however, with this judgment: that one aim at the distinctions hitherto brought by us, and consider that the concepts of the practical writers—if not all, at least most—are to be referred to the second moment of regeneration and to actual conversion, whether first or renewed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>XI. ‘Appendix concerning the Second Moment of Conversion’ in Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-e2b293669f" data-kw="">
<blockquote><p>(1) The natural life supposes generation; so does the spiritual, which is therefore expressed by ‘regeneration’, or by ‘being born again’, Jn. 3:3 and 1 Jn. 2:27. Now look, as in natural generation we are first begotten, and then born, so here there is an act qua regeneramur, ‘by which we are begotten again’, and qua renascimur, ‘by which we are born again’. There is an act of God, by which we are begotten again, viz. by the powerful influence of grace upon our hearts, accompanying in the Word, Jm. 1:18; and there is an act of God, by which we are born again, viz. when the new creature is formed in us, and begins to discover itself (“being born again, not of corruptible seed, but of incorruptible”). Effectual calling and sanctification are these two [respective] acts: by the one we are begotten, by the other born; the one may be called our passive, the other our active regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton in two parts: the first containing 27 Sermons on the Twenty-Fifth chapter of St. Matthew</cite>, … (d. 1677; London: Astwood, 1684), Sermons on 2 Cor. 5, Sermon 30, on 2 Cor. 5:15, p. 190</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-7ea1d869d0" data-kw="">
<blockquote><p>3… Next, man’s mind is moved toward God by the Holy Spirit through Christ and this movement is through faith. Through this [faith] man’s mind believes with certainty all that God has transmitted [tradita], and also with full certainty and without doubt assents to the promises made to us by God who, as stated in the psalm [144:13], is faithful in all his words. From there he acquires confidence [fiduciam] on account of God’s promise, by which he has pledged that he will remit sins freely and that he will adopt as children those who believe in Christ, those I say who repent of their former life. By this faith, he is lifted up to God by the Holy Spirit and so he receives the Holy Spirit, remission of sins, imputation of righteousness and countless other gifts.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

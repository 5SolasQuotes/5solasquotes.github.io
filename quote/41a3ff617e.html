<main class="wrap"><figure class="quote" id="q-41a3ff617e" data-kw="">
<blockquote><p>5. Our justification is not by degrees. For the sins of all of us are cast upon Christ, at the same time and once and for all. But this only applies to active justification; for passive justification happens so often as man is repenting his sins and seizes the remission of sins by means of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse</cite>, (1644), ch. 13, ‘On Justification’, p. 233</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-9cd11ee322" data-kw="">
<blockquote><p>4. Since all of both sides [Reformed and Romanist] allow that forgiveness of sins belongs to the formal cause of our justification, let us now discuss the imputation of the justice of Christ, and whether by that also we are formally justified. … 6. Christ merited for us by everything which He did or suffered on earth; for all infinitely pleased God the Father, and were of immeasureable and inexhaustible merit, because of the hypostatic union of the Divine Person, for He worked human works in a divine manner, as testify S. Dionysius the Areopagite and S. John Damascene. But amongst all that Christ did and suffered, undertaken for us, his death, with the passion immediately preceding it, has chiefly and most especially merited to us justification; for in it the obedience of Christ to the Father, and his love to the human race, shone forth in a wonderful manner, and his whole obedience was therein consummated, as the apostle clearly teaches. This is testified by innumerable passages of Scripture and the Fathers, and moreover, in this all Protestants and Romanists agree…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-0b03df12ae" data-kw="">
<blockquote><p>23. Not only are past sins of justified persons remitted but also those to come, Num. 23:25. God sees no iniquity in Jacob or perverseness in Israel. Justification has left no place for condemnation. John 5:24, ‘He who believes has eternal life and shall not come into condemnation’ — justification gives eternal life surely and immediately. It also makes the whole remission obtained for us in Christ actually ours. Neither past or present sins can be altogether fully remitted unless sins to come are in some way remitted.

24. The difference is that past sins are remitted specifically and sins to come potentially. Past sins are remitted in themselves, sins to come in the subject or the person sinning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, (Baker, 1997), ch. 27, ‘Justification’, p. 163</span></figcaption>

<blockquote><p>Those who exaggeratingly refer to other Christian ministers sound in the fundamentals, albeit erring in other respects, as the sons of Belial or priests of Baal worshipping in the high places (where literal idolatry was used and other gods sacrificed to, a matter of fundamentals or tending to overturn them),¹ as the Separatists did,² are not harmless, but slanderous; cure yourself of that warped intoxication and protect others from it. ¹ Lev. 26:30; Dt. 12:2; 1 Kn. 11:7; 14:23; 2 Kn. 18:4; 21:3, 5; 23:20; 2 Chron. 11:15; 14:3–5; 28:25; 2 Chron. 31:1; 33:3, 17–19; 34:3; Ps. 78:58; Jer. 32:35; 48:35; Eze. 6:6, 13. ² Robert Browne, An Answer to Master Cartwright… (London: 1585), p. 48; Henry Barrow, A Collection of Certain Letters &amp; Conferences… ([Dordrecht] 1590), p. 27; idem, A Plain Refutation of Mr. G. Giffard’s Reproachful Book (Dordrecht, 1591), pp. 2, 7, 63, 189, 216, 223.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 182</span></figcaption>

</figure><figure class="quote" id="q-6857e8c576" data-kw="">
<blockquote><p>Question: Why did Christ take bread rather than any other element? Answer: … 2. Christ took bread because of the analogy; Bread did nearly resemble Him, John 6:48, ‘I am that bread of life.’ There is a threefold resemblance: 1. Bread is useful. Other comforts are more for delight than use. Music delights the ear, color, the eye, but bread is the staff of life. So is Christ useful. There is no subsisting without Him, John 6:57, ‘He that eateth Me, even he shall live by Me.’ 2. Bread is satisfying. If a man be hungry, bring him flowers or pictures, they do not satisfy, but bread does satiate. So Jesus Christ the bread of the soul, satisfies; He satisfies the eye with beauty, the heart with sweetness, the conscience with peace. 3. Bread is strengthening, Ps. 104:15, ‘Bread which strengthens man’s heart.’ So Christ, the bread of the soul, transmits strength. He strengthens us against temptations, He gives strength for doing and suffering work. He is like the cake the angel brought to the prophet, 1 Kings 19:8, ‘He arose and did eat, and went in the strength of that meat forty days, and forty nights, unto Horeb the Mount of God.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Holy Eucharist, or, The Myystery of the Lord’s Supper Briefly Explained</cite>, ... (London, 1668), ‘The Mystery of the Lord’s Supper’, pp. 7-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>6. Though it were lawful to add other things contrived by ourselves, the Fathers, the papists or others to the sacred ceremonies instituted by God, yet nevertheless they must not be vain or frivolous; they are not to be multiplied excessively, and neither their perpetuity, uniformity or observation is necessary without a case of scandal or contempt.</p></blockquote>

</figure><figure class="quote" id="q-6cfc349ce3" data-kw="">
<blockquote><p>Fourthly, the flux and reflux (so to speak) of several successive [seatings of] tables [for the Lord’s Supper in one congregation], where there is a great number to communicate, and the repeating, or pronouncing and applying to those several tables of receivers, the words, ‘Take ye’, ‘eat ye’, which Christ pronounced but once in one act of distribution, these things (I say) cannot be justly charged as deviations from the example of Christ, when the same providence which limited Him to a fewer number, calls us to distribute to a great number: Neither can they [the Independents] who so charge us [the presbyterians], ever make good what they allege, unless they prove that although Christ had been distributing this sacrament to all the 500 disciples to whom He appeared after his resurrection [1 Cor. 15:6] (suppose I say, there had been so many communicants), yet He had given them all at once the elements, and had said but once, ‘Take ye, eat ye’, and that there had been no intermission at all, nor no partition into several successive companies. If this can be proved, then they say much against the use of successive tables, otherwise not.</p></blockquote>

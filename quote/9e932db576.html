<main class="wrap"><figure class="quote" id="q-9e932db576" data-kw="">
<blockquote><p>It shall be no grief of heart to you afterward that you have pleased others as well as yourselves, and have stretched your principles for an accommodation in Church government as well as in worship, and that for the Church’s peace and edification; and that the ears of our common enemies may tingle (Acts 9:31) when it shall be said, ‘The Churches of Christ… have rest, and are edified, and walking in the fear of the Lord, and in the joy of the Holy Ghost are multiplied.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wholesome Severity Reconciled with Christian Liberty</cite>, (London, 1645), A Paraenetic</span></figcaption>

</figure><figure class="quote" id="q-fbeca688eb" data-kw="">
<blockquote><p>My being present and hearing of a Conformist [minister is] no approbation of the evil of his conformity, and so no occasional or transient relation is raised thereby. Approbation is an act of the mind or heart; It is not showed to him or others by me until it be expressed outwardly by my words or gestures, which I have not in this case any occasion to do, his evil being done elsewhere and formerly, and not in our presence that now hear him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Case of Great &amp; Present Use: Whether we may Lawfully Hear the now Conforming Ministers who are Re-ordained &amp; have Renounced the</cite>, [Solemn League &amp;] Covenant &amp; Some of them [are] Supposed to be Scandalous in their Lives, Considered &amp; Affirmatively Resolved (1672; 1677), Consideration 3, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-2f72050000" data-kw="">
<blockquote><p>His [God’s] existence no less clearly appears from the exact fulfilment of so many, and so particularly circumstantiated predictions, published long before the events took place, viz. predictions concerning mankind in general; – the descendants of Noah, Lot, and Abraham; – Canaanites, Syrians, Assyrians, Chaldeans, Persians, Greeks, Romans, – Arabs, Turks, – Jesus Christ; Antichrist; New Testament church. It is impossible that these predictions, which were so exactly fulfilled in their respective periods, and of the fulfilment of which there are, at present, thousands of demonstrative and sensible documents in the world, could proceed from any but an all-seeing, and infinitely wise, and almighty Governor of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A compendious view of natural and revealed religion</cite>, (1782; Grand Rapids, 2002), p. 7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-59f4555384" data-kw="">
<blockquote><p>Christ’s first disciples were chosen by Him in order that they might disperse throughout the whole world, and preach His faith everywhere, according to Mt. 28:19, “Going… teach ye all nations.” Now it was not fitting that they who were being sent to teach others should need to be taught by others, either as to how they should speak to other people, or as to how they were to understand those who spoke to them; and all the more seeing that those who were being sent were of one nation, that of Judea, according to Is. 27:6, “When they shall rush out from Jacob [*Vulg.: ‘When they shall rush in unto Jacob,’ etc.]… they shall fill the face of the world with seed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, trans. Fathers of the English Dominican Province (Benziger Bros., 1947), 2nd part of 2nd part, Question 176, ‘Of the Grace of Tongues’, Article 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-19b35ae52e" data-kw="">
<blockquote><p>Fecundity: “increase and multiply.” These words can have: (1) an imperative sense, in which way the ancient Hebrews wanted there to be here a universal precept, placed upon all people, of contracting marriage, which they call ונמה פיריה מצות” ,the commandment of fruitfulness and multiplication,” because one who does not confirm this commandment has no part, they say, in the age to come. But in this way the commandment would fall even upon brute beasts, since the same thing is said of them in verse 22; in this way also there would be a commandment to have dominion over the fish, “have dominion over the fish of the sea,” and so forth. (2) A concessive sense, just as in Genesis 2:16 and Deuteronomy 14:11, 20. Finally, (3) a promissory sense, so that the imperative stands in place of the future, “increase” in place of “you will increase,” and so forth, such that he is promising fertility, power, and appetite to beget what is similar to them; hence this is said only of fecund things, but not of light, stars, plants, and so forth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 9, Exegetical Part, p. 252</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>
<div class="actions"><button class="copy" data-copy="“Fecundity: “increase and multiply.” These words can have: (1) an imperative sense, in which way the ancient Hebrews wanted there to be here a universal precept, placed upon all people, of contracting marriage, which they call ונמה פיריה מצות” ,the commandment of fruitfulness and multiplication,” because one who does not confirm this commandment has no part, they say, in the age to come. But in this way the commandment would fall even upon brute beasts, since the same thing is said of them in verse 22; in this way also there would be a commandment to have dominion over the fish, “have dominion over the fish of the sea,” and so forth. (2) A concessive sense, just as in Genesis 2:16 and Deuteronomy 14:11, 20. Finally, (3) a promissory sense, so that the imperative stands in place of the future, “increase” in place of “you will increase,” and so forth, such that he is promising fertility, power, and appetite to beget what is similar to them; hence this is said only of fecund things, but not of light, stars, plants, and so forth.”

cundity%3A%20%E2%80%9Cincrease%20and%20multiply.%E2%80%9D%20These%20words%20can%20have&amp;text=not%20of%20light%2C%20stars%2C%20plants%2C%20and%20so%20forth" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a78bfa55cf" data-kw="">
<blockquote><p>By the term ‘prophecy’, however, I do not understand the gift of foretelling the future, but as in 1 Cor. 14:3, the science of interpreting Scripture, so that a prophet is an interpreter of the will of God. For Paul, in the passage which I have quoted, assigns to prophets teaching for edification, exhortation, and consolation, and enumerates, as it were, these departments. Let, therefore, ‘prophecy’ in this passage be understood as meaning: interpretation made suitable to present use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Thessalonians</cite>, 5, verse 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-4f9f5bf5fb" data-kw="">
<blockquote><p>Moreover, God permits: (1) sometimes in express terms (Col. 2:16, 20–21; Gen. 2:16–17; Lev. 11:2–4), when he removes these or those things from among things prohibited; (2) sometimes only by nowhere prohibiting (cf. Rom. 14:14; Acts 10:15); (3) sometimes also in terms of commanding (Deut. 23:20; Gen. 1:28), just as in the same terms of commanding he sometimes expressly prohibits (Num. 22:20; John 13:27).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 11, section 4, pp. 356-57</span></figcaption>

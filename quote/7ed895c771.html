<main class="wrap"><figure class="quote" id="q-7ed895c771" data-kw="">
<blockquote><p>Thus also a celebration of the finishing of the creation within the space of seven days, which is termed the Sabbath, was observed not only amongst the Grecians and Italians (for of the Hebrews it is clear enough) but also by… and by the most ancient appellations of the days in the week. …and that the lives of those which lived at the beginning, and afterward were protracted almost to the space of a thousand years, it [is] witnessed by Berosus, Manethos, and others…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugo-grotius.html">Hugo Grotius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>True Religion Explained &amp; Defended… (London, 1632), sect. 15</cite>, pp. 47-48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f14b20fcab" data-kw="">
<blockquote><p>‘My Father worketh hitherto, etc.’ God having finished that work of Creation in the space of six days, rested from that work on the seventh day; but from the work of his providence, and governing the things He has made, He never rested one day from the Creation of the world. In six days the Creation of the world was finished, but the government thereof is perpetual, and God continually works in preserving and maintaining the order thereof, even as the apostle says…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gearing.html">William Gearing</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Eye &amp; Wheel of Providence, or a Treatise Proving that there is a Divine Providence (London: Tyton, 1662), ch. 1</cite>, pp. 5-6</span></figcaption>

</figure><figure class="quote" id="q-bf633d9870" data-kw="">
<blockquote><p>It must first be reiterated that with extraordinary few exceptions no educated person in the history of Western Civilization from the third century B.C. onward believed that the earth was flat. A round earth appears at least as early as the sixth century BC with Pythagoras, who was followed by Aristotle, Euclid, and Aristarchus, among others in observing that the earth was a sphere. Although there were a few dissenters–Leukippos and Demokritos for example–by the time of Eratosthenes (3 c. BC), followed by Crates(2 c. BC), Strabo (3 c. BC), and Ptolemy (first c. AD), the sphericity of the earth was accepted by all educated Greeks and Romans. Nor did this situation change with the advent of Christianity. A fewóat least two and at most five–early Christian fathers denied the spherically of earth by mistakenly taking passages such as Ps. 104:2-3 as geographical rather than metaphorical statements. On the other side tens of thousands of Christian theologians, poets, artists, and scientists took the spherical view throughout the early, medieval, and modern church… No one before the 1830s believed that medieval people thought that the earth was flat… But now, why did the false accounts of Letronne and Irving become melded and then, as early as the 1860s, begin to be served up in schools and in schoolbooks as the solemn truth? The answer is that the falsehood about the spherical earth became a colorful and unforgettable part of a larger falsehood: the falsehood of the eternal war between science (good) and religion (bad) throughout Western history… The reason for promoting both the specific lie about the sphericity of the earth and the general lie that religion and science are in natural and eternal conflict in Western society, is to defend Darwinism. The answer is really only slightly more complicated than that bald statement. The flat-earth lie was ammunition against the creationists. The argument was simple and powerful, if not elegant: “Look how stupid these Christians are. They are always getting in the way of science and progress.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-b-russell.html">J.B. Russell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Myth of the Flat Earth’ (1997) at The American Scientific Affiliation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-f5f171b092" data-kw="">

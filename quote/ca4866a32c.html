<main class="wrap"><figure class="quote" id="q-ca4866a32c" data-kw="">
<blockquote><p>And what shall I say in the conclusion, now I am near to my departure from this contentious world? but sound a retreat to all these unhappy militants, that will not let holiness prosper by the necessary advantage of peace. Cease your proud contendings, O vain-glorious militant clergy! Learn of the Prince of peace and the holy angels that preached Him, to give glory to God in the highest, who gives peace on earth, and well-pleasedness in (or towards) men. Did Christ or his apostles make such work for Christians as you do? The great Shepherd of the flock will take your pretences of order, orthodoxness (or truth) and piety for no excuse for your corrupting order, faith and practice by your tyranny, self-conceitedness and blind zeal and superstition; and for using his name against Himself, to the destroying of that love, and concord and unity which He has bequeathed to his Church; and for serving his enemy, and dividing his people, and hardening infidels and ungodly ones by these scandals. Return to the primitive simplicity, that we may return to unity, love and peace. Dream not of them upon your own corrupting terms. And read and read over again and again James 3, which does describe you, condemn you, and instruct you. If you say, ‘Physicion heal thyself: Who has wrote more of controversies?’ I answer, peruse what I have written and you will see it is of controversies, but against controversies, tending to end and reconcile. If anything be otherwise (except necessary defence of certain necessary faith or duty), I retract it and condemn it: Let it be as not written. I have meddled much with controversies in this book: but it is to end them. The God of Peace give wisdom and peaceable principles, minds and hearts to his servants, that (though I shall not live to see it) true love and piety may revive in the Christian world, by the endeavors of a healing ministry, and the shaming, restraint and reformation of the contentious clergy, whether tyrannical, dogmatical or superstitious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, ... (London: White, 1675), Preface, n.p.</span></figcaption>

<blockquote><p>…union has the advantage over division, because: It is a commanded mean tending to edification, which division is not. 2. Division has no less nor fewer inconveniencies following it, nor [is] less destructive to the Church than union in the case supposed; yea, schism is one of the greatest hurts that can come to an orthodox Church, it being next to heresy in doctrine; and therefore no particular evil can be laid in the balance with it. 3. The ills of division are most inevitable, for the ills that follow union, through God’s blessing, may be prevented; it is not impossible, but in the way of division it is, because itself is out of God’s way.</p></blockquote>

<blockquote><p>Bucer’s thought categorized Christian theological truths (of the disputed doctrines of the day) into a hierarchy, the doctrine of justification being of high importance for the Church. As such, difficulties over other doctrines like the Lord’s Supper could be pragmatically defined and resolved so as to preserve the unity that was held in the truth of justification.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>13. And it greatly wrongs such men that they never had right apprehensions of the nature and great necessity of vanity among believers and the Churches of Christ. They cry out ‘Truth must not be sold for peace,’ when they neither know aright what is truth or peace. But by ‘truth’ they mean their own doubtful opinions and by ‘peace’ they mean their own quietness with men. We easily confess that as peace signifies our freedom from persecution or sufferings, or from the reproach of men, the least holy truth is to be preferred before it, and more tenaciously held than it: But if by ‘peace’ they mean the unity and concord of believers or of the Church of God, they speak dangerously and suppose a pernicious falsehood, that God’s truth and such peace or concord may at any time be separated: And it is no wiselier spoken than if they had said, A man’s eye-sight or health is to be preferred before the union of his soul and body, or before the concord of head and heart, or before the conjunction of his members. When as non cutis nulla est affectio [without skin there is no sensation]. Destroy the subject and you destroy the accidents. Without union of parts, the Church is no Church; dividing it is destroying it. A house or kingdom divided cannot stand. And when it is no Church, it has no truth as a Church, nor anything that dividers did contend for. An Integral member may rather be cut off, than the whole should perish: But what member will separate itself from the body? Or who but a murderer will on pretense of curing, be a divider and dissolver? … 16. And they forget that as the body must have its due magnitude, as well as its comely scite [position] of parts; so we must be zealous for the greatness, as well as the purity, the extensive as well as the intensive growth of the Church. And if Christ’s flock be little, they dishonor it that would make it tenfold less than indeed it is; Jer. 30:19, ‘And out of them shall proceed thanksgiving, and the voice of them that make merry: And I will multiply them, and they shall not be few, and I will glorify them, and they shall not be small.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, (London: Simmons, 1671), ‘To those Readers…’, pp. 7-8</span></figcaption>

<blockquote><p>2. It is not a bare union of men that makes a Church a true Church, but that union must have truth for its foundation; else you know thieves and robbers and highway-men and pirates, and buccaneers, because they agree among themselves, might lay claim to this title, and the most perverse heretics, because they agree in certain points, might say they are the true Church… … And indeed, that which justifies the Protestant Churches’ separation from her [Rome], or breaking peace and communion with her is: 1. Because she would impose that upon the consciences of men which Christ and his apostles never imposed. 2. Because she has turned the spiritual worship of the Gospel into carnal and mechanical devotion and introduced innumerable superstitions… … 5. Because rejecting the supreme authority of the Scriptures, which are the sole rule of Faith, she has made her pretended head, and such councils as he shall call or approve of, the sole dictators and expositors of the doctrine of Christ, requiring blind obedience to their decisions… The divisions among Protestant Churches are to be deplored so much the more because the points they differ in are inconsiderable and might easily be composed if men had but peaceable tempers and were resolved to lay aside interest and carnal respects, and punctilios of honor and credit, etc. for they all agree in fundamentals, all are satisfied that the Church of Rome has notoriously deviated from the simplicity of the Gospel; and the matters in difference, are things in which salvation is not concerned. And upon that account their labours deserve great commendations, who heretofore and very lately have endeavored to reconcile the Protestant Churches into a perfect union: A blessed work. Blessed are the peacemakers, that endeavor to make peace among the jarring members of Christ’s Body; and though they may fail of success, yet they shall not lose their reward. In the meanwhile those who widen or heighten these differences, and incite the respective parties to hatred, and wrath, and animosities one against another, to be sure are no children of the God of peace, and had need at least before they die make public satisfaction for the dreadful effects their heats and passions do produce. But as this peace among Protestant Churches is very much to be wished and prayed for…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-71991dc4d9" data-kw="">
<blockquote><p>It is truly lamentable to observe how many young men and women, of whom better things might have been expected, fall away into semi-Romanism in the present day, under the attraction of a highly ornamental and sensuous ceremonial. Flowers, crucifixes, processions, banners, incense, gorgeous vestments, and the like never fail to draw such young persons together, just as honey attracts flies. I will not insult the common sense of those who find these things attractive by asking them whether they really believe they get any food from them for heart, and conscience, and soul. But I should like them to consider seriously what these things mean. Do they really know that the doctrines of the mass and transubstantiation are the root of the whole system? Are they prepared to swallow these awful heresies? I suspect many are playing with ritualism without the least idea what it covers over. They see an attractive bait, but they do not see the hook.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Knots Untied</cite>, (London, 1898), 216</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>This would be to approve of will worship (ethelothrēskeias, which he elsewhere condemns); but in the second, for that which is founded on reason and is exercised by reason. That is, Paul uses that which is spiritual and inward, not carnal and outward, by antithesis to the Levitical and Old Testament ceremonial service which was carnal in the offering up of beasts; whereas God now no more requires brutes, but rational and spiritual sacrifices, as Peter calls them (1 Pet. 2:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12 / will-worship</span></figcaption>

<blockquote><p>Of the multitude that say they are of the catholic Church, it is rare to meet with men of a catholic spirit. Men have not a universal consideration of, and respect to, the whole Church, but look upon their own party as if it were the whole…. If it be the smallest parcel that possesses not many nations, no, nor cities on earth, they are ready to carry it, as if they were the whole Church, and as if it went well with the Church when it goes well with them.</p></blockquote>

</figure><figure class="quote" id="q-6e6e9458d0" data-kw="">
<blockquote><p>If the terms of our utmost ‘endeavors’ and ‘all the days of our lives’ are to be understood literally [in the SL&amp;C], and that we must not survive any violation of the Covenant… The terms of ‘forever’ [which the SL&amp;C does not use] or ‘for all the days of our lives’ are not in our contracts to be understood naturally, but morally. For we find it plainly in the [Mosaic] Judicial Law that after a Jew had taken a servant and bored a hole through his ear he was (as the text [Ex. 21:6] says) to serve him ‘forever,’ although one of them might possibly have died the next day, and both of them after a while might have been made captives to others. The law calls the league of marriage individua vitae consuetudo, a cohabitation for all the days of our lives, for so it should be ex voto contrahenti [out of the vow binding], in the sincere desires of the contractors. Yet we know one ordinarily dies before the other and that many conditions may happen to legitimate their divorce afterwards, though the contract was never so religiously made in the presence of almighty God at first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Anthony Ascham on the Expiring of the Solemn League &amp; Covenant</cite>, 1649’ (RBO)</span></figcaption>

of%20almighty%20God%20at%20first" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-54985cb2a3" data-kw="">
<blockquote><p>It is pity that any wise and judicious minister should want [lack] that fervor and seriousness of speech which the weight of so great a business does require. And it is greater pity that any serious, affectionate minister should be ignorant and injudicious: And it is yet greater pity that in any good men, too much of their fervor should be merely affected and seem to be what it is not; or at least be raised by a selfish desire to advance ourselves in the hearers’ thoughts and to exercise our parts upon their affections. But it is most pitiful that the Church has any hypocrites who have no other but such affected dissembled fervency. And it is not the least pity that so many good people, especially youths and women, should be so weak, as to value an affectionate tone of speech above a judicious opening of the Gospel. I confess there is something in an affectionate expression, which will move the wisest: And as light and judgment tend to generate judgment, so heat of affection tends to beget affection. And I never loved a senseless delivery of matters of eternal consequence, as if we were asleep ourselves, or would make the hearers to be so: or would have them think by our cold expressions that we believe not ourselves, when we set forth the great inestimable things of the life to come. But yet it grieves my very soul to think what pitiful, raw and ignorant kind of preaching is crowded most after in many places for the mere affectionate manner of expression and loudness of the preacher’s voice! How oft have I known the ablest preachers undervalued and an ignorant man by crowds applauded, when I that have been acquainted with the preacher ab incunabulis [from infancy], have known him to be unable well to answer most questions in the common catechism. And I durst not tell them of his great insufficiency and ignorance for fear of hindering the success of his labors and being thought envious at other men’s acceptance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 41, pp. 214-15</span></figcaption>

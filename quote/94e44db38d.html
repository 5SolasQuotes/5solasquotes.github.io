<main class="wrap"><figure class="quote" id="q-94e44db38d" data-kw="">
<blockquote><p>Worship is an action, or performance, or thing, by which we tender our immediate honor to God from the nature of the thing itself:

1. I call it an action because the passion of dying or suffering is not formally worship, but only dying comparatively: rather than denying of Christ or dying so and so qualified: [in a comparative way] dying with patience and faith may be called a worship [2 Tim. 4:6].

2. I call it not an action only, but a performance or thing, because an office, as the priesthood, the ministry, is a worship and yet not an action; sometime[s], time itself, as the Sabbath Day is a worship; yet it is not an action: So the Lord calls it his Holy Day: and undeniably the Jewish days, the High Priest’s garment, and many things of that kind, were divine or religious performances, things or adjuncts of divine worship, but so as they are not merely adjuncts of worship, but also worship: For the High Priest’s ephod was not only a civil ornament, nor was it a mere physical or natural means to fence off the injuries of sun and heaven; we do not think that the Lord in all, or any place of the Old or New Testament sets down any laws concerning garments simply, as they do fence off cold or heat; that belongs to art: only He speaks of garments, as contrary to gravity [being sober-minded], as signs of vanity and lightness, Isa. 3:16, etc.; Zeph. 1:8; 1 Pet. 3:3-4. And of garments as religious observances, of which sort was the attire and garments of the priests and High Priests in their service, in which consideration the religious times, holy places, and Mosaical garments were divine worship, by which God was immediately honored; but [they were] not adjuncts only, or actions, but religious things or performances.

3. It is such a performance, as from thence honor does immediately redound to God. But that this may be the clearer, I conceive that there is a twofold, immediate honoring of God in the worship of God:

1. An honoring of God less immediate, as hearing of the Word, is an immediate honoring of God, because honor flows immediately from God, both ex conditione operis, and ex conditione operantis; ‘from the nature of the work’, and ‘[from the] intention of the worker’: yet it is a less immediate honoring of God, in regard that I may also hear the Word even from the condition of the work, and so from the intrinsic end of the worker that I may learn to know God and believe; for thus far I am led to honor God immediately in hearing the Word, that action of its own nature conveying honor to God; there intervenes also a medium amidst between me and honoring of God, to wit, the preacher or the Bible (to which no external adoration is due): [2.] There is another more immediate worship, to wit, praising of God, from which, by an immediate result, God is honored, and in worship especially, strictly, immediate, God is immediately honored both in the intention of the work and the intrinsic end of it, and the intention of the worker; though no other thing be done, and others be not edified either in knowledge, increase of faith or any other ways: And in this, duties of the Second Table, of mercy and justice, differ from worship in that such acts of love and mercy, as to give alms to save the life of my brother or of his beast, are not acts of worshipping God; their intrinsic end, and the nature of the work being to do good to the creature, principally, ex natura et conditione operis, though God also thereby be honored, yet in a more secondary consideration: For I praying to God, do immediately, from the nature of the action, honor God, though no good should either redound to myself or to the creature; thereby it is true, God, by acts of love and mercy to our neighbor, is honored two ways:

1. In that men seeing our good works do thence take occasion to glorify our heavenly Father, whose truth teaches us by the grace of God to do these works, but the intrinsic and proper use of these is to do good to ourselves, as in works of sobriety, and to our neighbor, as in works of righteous dealing, but not immediately, and in the first and primary consideration to honor God, as in works of piety, holiness and worship, the honoring of God by secondary resultance, does issue also from these duties of righteousness, but not as from the acts of praying, praising, sacramental eating, drinking.

2. The doer of these acts of mercy may, and is to intend, the honoring of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), pp. 86-88</span></figcaption>

ligious+things+or+performances.+3.+It+is+such+a+performance%2C+as+from+thence+honor+does+immediately+redound+to+God.+But+that+this+may+be+the+clearer%2C+I+conceive+that+there+is+a+twofold%2C+immediate+honoring+of+God+in+the+worship+of+God%3A+1.+An+honoring+of+God+less+immediate%2C+as+hearing+of+the+Word%2C+is+an+immediate+honoring+of+God%2C+because+honor+flows+immediately+from+God%2C+both+ex+conditione+operis%2C+and+ex+conditione+operantis%3B+%E2%80%98from+the+nature+of+the+work%E2%80%99%2C+and+%E2%80%98%5Bfrom+the%5D+intention+of+the+worker%E2%80%99%3A+yet+it+is+a+less+immediate+honoring+of+God%2C+in+regard+that+I+may+also+hear+the+Word+even+from+the+condition+of+the+work%2C+and+so+from+the+intrinsic+end+of+the+worker+that+I+may+learn+to+know+God+and+believe%3B+for+thus+far+I+am+led+to+honor+God+immediately+in+hearing+the+Word%2C+that+action+of+its+own+nature+conveying+honor+to+God%3B+there+intervenes+also+a+medium+amidst+between+me+and+honoring+of+God%2C+to+wit%2C+the+preacher+or+the+Bible+%28to+which+no+external+adoration+is+due%29%3A+%5B2.%5D+There+is+another+more+immediate+worship%2C+to+wit%2C+praising+of+God%2C+from+which%2C+by+an+immediate+result%2C+God+is+honored%2C+and+in+worship+especially%2C+strictly%2C+immediate%2C+God+is+immediately+honored+both+in+the+intention+of+the+work+and+the+intrinsic+end+of+it%2C+and+the+intention+of+the+worker%3B+though+no+other+thing+be+done%2C+and+others+be+not+edified+either+in+knowledge%2C+increase+of+faith+or+any+other+ways%3A+And+in+this%2C+duties+of+the+Second+Table%2C+of+mercy+and+justice%2C+differ+from+worship+in+that+such+acts+of+love+and+mercy%2C+as+to+give+alms+to+save+the+life+of+my+brother+or+of+his+beast%2C+are+not+acts+of+worshipping+God%3B+their+intrinsic+end%2C+and+the+nature+of+the+work+being+to+do+good+to+the+creature%2C+principally%2C+ex+natura+et+conditione+operis%2C+though+God+also+thereby+be+honored%2C+yet+in+a+more+secondary+consideration%3A+For+I+praying+to+God%2C+do+immediately%2C+from+the+nature+of+the+action%2C+honor+God%2C+though+no+good+should+either+redound+to+myself+or+to+the+creature%3B+thereby+it+is+true%2C+God%2C+by+acts+of+love+and+mercy+to+our+neighbor%2C+is+honored+two+ways%3A+1.+In+that+men+seeing+our+good+works+do+thence+take+occasion+to+glorify+our+heavenly+Father%2C+whose+truth+teaches+us+by+the+grace+of+God+to+do+these+works%2C+but+the+intrinsic+and+proper+use+of+these+is+to+do+good+to+ourselves%2C+as+in+works+of+sobriety%2C+and+to+our+neighbor%2C+as+in+works+of+righteous+dealing%2C+but+not+immediately%2C+and+in+the+first+and+primary+consideration+to+honor+God%2C+as+in+works+of+piety%2C+holiness+and+worship%2C+the+honoring+of+God+by+secondary+resultance%2C+does+issue+also+from+these+duties+of+righteousness%2C+but+not+as+from+the+acts+of+praying%2C+praising%2C+sacramental+eating%2C+drinking.+2.+The+doer+of+these+acts+of+mercy+may%2C+and+is+to+intend%2C+the+honoring+of+God.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%2C+%E2%80%A6+%281646%29%2C+pp.+86-88&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F94e44db38d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/94e44db38d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=Worship%20is%20an%20action%2C%20or%20performance,to%20intend%2C%20the%20honoring%20of%20God&amp;text=Worship%20is%20an%20action%2C%20or%20performance%2C%20or%20thing&amp;text=and%20is%20to%20intend%2C%20the%20honoring%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Question: Why did Christ take bread rather than any other element? Answer: …

2. Christ took bread because of the analogy; Bread did nearly resemble Him, John 6:48, ‘I am that bread of life.’ There is a threefold resemblance:

1. Bread is useful. Other comforts are more for delight than use. Music delights the ear, color, the eye, but bread is the staff of life. So is Christ useful. There is no subsisting without Him, John 6:57, ‘He that eateth Me, even he shall live by Me.’

2. Bread is satisfying. If a man be hungry, bring him flowers or pictures, they do not satisfy, but bread does satiate. So Jesus Christ the bread of the soul, satisfies; He satisfies the eye with beauty, the heart with sweetness, the conscience with peace.

3. Bread is strengthening, Ps. 104:15, ‘Bread which strengthens man’s heart.’ So Christ, the bread of the soul, transmits strength. He strengthens us against temptations, He gives strength for doing and suffering work. He is like the cake the angel brought to the prophet, 1 Kings 19:8, ‘He arose and did eat, and went in the strength of that meat forty days, and forty nights, unto Horeb the Mount of God.&#x27;</p></blockquote>

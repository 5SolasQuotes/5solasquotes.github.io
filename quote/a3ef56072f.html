<blockquote><p>5. Where it is said [in the Westminster Confession of Faith], ch. 21, sect. 7, that: ‘by a positive, moral and perpetual commandment, binding all men in all ages, He has particularly appointed one day in seven for a Sabbath,’ I understand it only of a virtual obligation, as much as belongs to the Law, as enacted before promulgation, but not of a true actual obligation. For no law can bind till it is promulgated; and positives are not promulgated by nature; therefore not to all men in all ages; therefore they bind not all men in all ages.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Confession of his Faith… (London: R.W., 1655), ch. 2, sect. 5</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-b2daf828e1" data-kw="">
<blockquote><p>To open this, consider, That there is a twofold original fountain of Righteousness towards man: 1. There is the immediate command and word of God, and that is called Jus Divinum, Divine Righteousness. 2. There is the Law and Command of Nature, and that is Jus Humanum, An humane Righteousness, or Right: And this is either general, the first and immediate principles of nature, such as the apostle speaks of, Rom. 1, concerning the gentiles, that they had ‘a Law written in their hearts,’ [sic] verse 7 [2:14-15], about just and unjust things, and their consciences accusing or excusing, upon the omission or commission of such things, or else they are more remote and particular dictates, such as the good and wholesome laws of all lawgivers, in respective nations. So what is righteous and just between man and man, is to be determined by the laws of that land where they live: Indeed, if any lawgivers (as some heathenish have) commanded or allowed anything that is against the Law of God, or the universal dictates of right reason; such commands are not worthy the name of laws, they are rather unjust decrees, and so do not bind: But otherwise, the laws of a land determine what is righteous and just between man and man: for although it be God’s command, that a man should not steal, yet they are human laws that give the bounds and proprieties of estates to men: So that we Christians, and the Jews, do something differ about the rules of righteousness and equity; for God was the immediate Lawgiver unto that people: Moses as a messenger from God, received from God’s mouth the Judicial Law, which he delivered to them; so that the Judicial Law appointed by God Himself, was the statute-law of that realm: Their Laws were not human, as all the laws of kingdoms and states are since Christ’s coming, but they were Divine: Their laws about a thief, a murderer, the buyer and the seller, were all Divine laws, because immediately commanded by God, though the matter was merely human. Now its greatly disputed how far these Judicial Laws commanding judgement and justice between man and man, do bind us Christians; and whether all lawgivers and statesmen, are not bound to bring in those Judicial Laws? For who can determine what is righteousness and equity better then God, a righteous and wise God? It’s not pertinent to wade into this excellent question at this time: Though some in this point are very rigid, to make all obligatory, that are not expressly repealed by Christ; and some again are very remiss and lax; yet all conclude that the Moral Equity and Reason that was in every Judicial Law, does bind Christians as well as Jews; and with that we shall conclude this particular, whatsoever law God made about justice, restitution or punishment to the Jews, the equity and reason of that law, does still bind us, though not the particular manner. As for the New Testament, Christ’s Kingdoms was not temporal, or of this world; and therefore He only commands righteousness in the general, and commands that excellent maxim, which an heathen emperor did so much admire, saying, he received it from Christians, ‘What ye would have men do to you, do ye to them, for this is the Law and the Prophets,’ Mt. 7:12… Christ therefore He has only given us general rules of righteousness, and for the particulars, He does command Christians to obey and submit to the wholesome laws of that place where they are; as Rom. 13, ‘Pay tribute to whom tribute, custom to whom custom:’ And this the Scripture does often press, that none might think that the freedom they had by Christ did take them off from human obligations and relations: This was a great temptation, they thought because they were Christians, and made free by Christ, that this also did take them off from obedience to civil magistrates, and from the laws they lived under: No, the Scripture is diligent to teach this, That Christianity and the Gospel does not abolish political and civil government, but rather greatly advances it as an institution of God, pressing obedience thereunto for conscience sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining… (London, 1652)</cite>, pp. 565-66</span></figcaption>

<blockquote><p>This critical edition is the first ever publication of Hale’s Of the Law of Nature, which previously existed only in manuscript form. After discussing and defining law in general, Hale examines the natural law in particular, its discovery and divine origin, and how it relates to both biblical and human laws. Hale’s treatise, which was likely written as part of his personal meditations and was circulated among English lawyers after his death, reveals not only the close relationship between law and theology in his thought, but also the importance of natural law to early modern legal thought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-hale.html">Matthew Hale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Law of Nature, ed. David S. Sytsma</cite></span></figcaption>

<blockquote><p>5thly. I shall only propose one thing more to your consideration. Although the institutions and examples of the Old Testament, of the duty of magistrates in the things and about the worship of God, are not, in their whole latitude and extent, to be drawn into rules that should be obligatory to all magistrates now, under the administration of the gospel,-and that because the magistrate then was ‘custos, vindex, et administrator legis judicialis, et politiae Mosaicae,’ [the custodian, vindicator and administrator of the Judicial Law and Mosaic polity] from which, as most think, we are freed;–yet, doubtless, there is something moral in those institutions, which, being unclothed of their Judaical form, is still binding to all in the like kind, as to some analogy and proportion. Subduct [subtract] from those administrations what was proper to, ad lies upon the account of, the church and nation of the Jews, and what remains upon the general notion of a church and nation must be everlastingly binding.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“5thly. I shall only propose one thing more to your consideration. Although the institutions and examples of the Old Testament, of the duty of magistrates in the things and about the worship of God, are not, in their whole latitude and extent, to be drawn into rules that should be obligatory to all magistrates now, under the administration of the gospel,-and that because the magistrate then was ‘custos, vindex, et administrator legis judicialis, et politiae Mosaicae,’ [the custodian, vindicator and administrator of the Judicial Law and Mosaic polity] from which, as most think, we are freed;–yet, doubtless, there is something moral in those institutions, which, being unclothed of their Judaical form, is still binding to all in the like kind, as to some analogy and proportion. Subduct [subtract] from those administrations what was proper to, ad lies upon the account of, the church and nation of the Jews, and what remains upon the general notion of a church and nation must be everlastingly binding.”

— John Owen, Christ’s Kingdom &amp; the Magistrate’s Power: a Sermon, p. 509">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5thly.+I+shall+only+propose+one+thing+more+to+your+consideration.+Although+the+institutions+and+examples+of+the+Old+Testament%2C+of+the+duty+of+magistrates+in+the+things+and+about+the+worship+of+God%2C+are+not%2C+in+their+whole+latitude+and+extent%2C+to+be+drawn+into+rules+that+should+be+obligatory+to+all+magistrates+now%2C+under+the+administration+of+the+gospel%2C-and+that+because+the+magistrate+then+was+%E2%80%98custos%2C+vindex%2C+et+administrator+legis+judicialis%2C+et+politiae+Mosaicae%2C%E2%80%99+%5Bthe+custodian%2C+vindicator+and+administrator+of+the+Judicial+Law+and+Mosaic+polity%5D+from+which%2C+as+most+think%2C+we+are+freed%3B%E2%80%93yet%2C+doubtless%2C+there+is+something+moral+in+those+institutions%2C+which%2C+being+unclothed+of+their+Judaical+form%2C+is+still+binding+to+all+in+the+like+kind%2C+as+to+some+analogy+and+proportion.+Subduct+%5Bsubtract%5D+from+those+administrations+what+was+proper+to%2C+ad+lies+upon+the+account+of%2C+the+church+and+nation+of+the+Jews%2C+and+what+remains+upon+the+general+notion+of+a+church+and+nation+must+be+everlastingly+binding.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Christ%E2%80%99s+Kingdom+%26+the+Magistrate%E2%80%99s+Power%3A+a+Sermon%2C+p.+509&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0617859933.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0617859933.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-civil-law/#:~:text=5thly.%20I%20shall%20only%20propose%20one,and%20nation%20must%20be%20everlastingly%20binding&amp;text=5thly.%20I%20shall%20only%20propose%20one%20thing%20more&amp;text=a%20church%20and%20nation%20must%20be%20everlastingly%20binding" rel="noopener" target="_blank">Read it online · Reformed Books Online</a>

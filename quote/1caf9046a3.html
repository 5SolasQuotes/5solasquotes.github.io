<blockquote><p>We then have received liberty, being made Heirs of the covenant of Grace: but to what end? that we may do what we list, and walk as we please? Shall we freely sin, because we are under grace? S. Paul will take that off with a God forbid. Rom 6.15. for that were to turn the grace of God into wantonness, and to use our liberty, whereunto we are called, or rather to Abuse it for an occasion to the flesh Gal. 5.13.

We rather should walk as S. Paul exhorteth his Ephesians, cap. 4. v. 1. worthy of the vocation wherewith we are called: we are made the members of Christ, the adopted sons of God, therefore (to make good our calling) ought we to live as His children, His servants; not serving our selves in the flesh, but him in the spirit: for the immediate end of our conversion is and ought to be a regularity and reforming of our Conversation; and therefore in this respect tis likewise necessary that we should become new.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-tozer.html">Henry Tozer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian amendment delivered in a sermon on New-year’s day 1631. in St Martin’s Church in Oxford, and now published: by H. Tozer Mr of Arts and Fellow of Exeter College in Oxford</cite>, (Oxford: John Lichfield, 1633), pp 33-34.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-121aeadfca" data-kw="">
<blockquote><p>Verse 33. ‘For he does not afflict willingly.’ Here he tells that if God afflicts, He does it not willingly, but strokes are drawn out of His hand by our provocations and the necessity of our estate. Objection. But how can anything be done to us and God not willing to do it? Answer. He is willing and not willing. [Willing,] because justice requires it, and He must correct us or lose us. Unwilling, because strokes are extorted out of His hand. We see then that simply and absolutely or properly God delights not in our affliction, but when He afflicts, it is extorted from His justice. 2. This shows the procuring cause of our grief is not in the Lord but in ourselves. God is the causer of our grief but not the procurer of it. God is the worker and {bringer about} of grief but not the causer of it. … Use Two. If God afflicted not willingly, then be sure He will comfort willingly. As He is unwilling to strike, so He is ready to comfort. As a father would rejoice to see his son thrive, so would God to see us study to please Him. He can let the rod lie aside us all day, clap [pat] our heads and lay His benefits to our hand. Know then, as it is against God’s will that you come into grief, so it is with His will that you be comforted, or if He let you lie still in that grief, it is because He sees it is necessary for you to steep yourself in trouble [so] that your perverse nature [may] be humbled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Jeremiah’s Lamentations</cite>, (1628; Naphtali Press &amp; RHB, 2020), on Lam. 3:33, p. 205</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>From all this it follows: First, that all the faithful are of the same faith with Abraham. The father and the sons-spiritual are of the same belief: as they do partake of the same spiritual privileges. It is one God that justifies the circumcision and the uncircumcision, and it is the same faith whereby the promises of mercy are embraced. Zaccheus is called the son of Abraham, and he believed in Christ as did Abraham.

2. Not only promises of temporal good things, but of spiritual and eternal were made to the patriarchs in the Covenant of Grace, and sought and obtained by them. They looked for a city whose builder and maker the Lord is. (Heb. 11:11-12) Remission of sins and life everlasting was preached in the Covenant, sealed in the sacrament, and typified by the land of Canaan. To conceive the fathers to be an assembly of brute beasts, which looked to be fed with earthly blessings alone, is highly to dishonor them, and lessen the grace and mercy of God towards them.

3. Sacramental phrases, wherein the name of the thing signified is given to the sign, are ancient and familiar; as circumcision is called the Covenant, and the rock Christ. Why then should our adversaries stumble at this, that in the sacrament of the Supper the bread is called the body of Christ?

4. In this expression of the Covenant, the spiritual good things promised therein are limited to Abraham and to his seed. But all infants whatsoever are not comprehended under the seed of Abraham. To say many thousands are excluded from the seals and outward administration of the Covenant, when yet everyone is partaker of the good promised in the Covenant, is to speak of ourselves, and not according to the Word of God. We will not tie the grace of God to outward means: but ordinarily we cannot affirm they pertain to the Covenant of Grace, and obtain the highest blessings promised therein, whom God does not vouchsafe so much as outwardly to receive into Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645) | ch. 6, ‘Of the Covenant of Grace as it was made and manifested to Abraham’, pp. 91-92</span></figcaption>

</figure><figure class="quote" id="q-8bcd639db3" data-kw="">
<blockquote><p>What remains for sinners, that they may be personally and savingly in covenant with God, is not, as parties contractors and undertakers, to make a covenant with him for life and salvation; but only, to take hold of God’s covenant already made from eternity, between the Father and Christ the second Adam, and revealed and offered to us in the gospel, Isa. lvi. 4, 6. I have no design hereby to disparage our covenants made for national reformation by our godly progenitors, and commonly called the national covenant, and solemn league and covenant, on which God set the seal of his good pleasure in the experience of many. These and the like are covenants of duties, consequential enough to the taking hold of God’s covenant of grace.

Neither would I discourage any serious souls, from taking hold of God’s covenant of grace, for eternal life and salvation to themselves, with all the awful solemnity of the most express words, yea, and of writing and subscribing it with their hands; which is commonly called personal covenanting. But I would have all to beware of a practical corrupting of the covenant of grace, by making covenants of their own, upon such and such terms, which they will fulfil for life and salvation. The carnal Jews mistaking the design of the giving of the law, did so corrupt the covenant of grace; looking for life and salvation, not for the sake of the promised seed alone, but for their obedience, such as it was, to the moral and ceremonial laws.

And thus many, thinking that eternal salvation is proposed to them in the word upon the condition of faith, repentance, and sincere obedience to God’s law, do consent to these terms, and solemnly undertake to perform them: just binding themselves to such and such duties, that God may save their souls : and so they make their covenant. And while they can persuade themselves, that they perform their part of the covenant, they look for life and salvation thereupon. This doth quite overturn the nature of the covenant of grace: for “to him that worketh, the reward is not reckoned of grace, but of debt,” Rom. iv. 4; and “if it be of works, then it is no more grace,” chap. xi. 6.

The sinfulness of this practice is great, as overlooking Christ, the great undertaker and party-contractor by the appointment of the Father; and putting themselves in his room, to do and work for themselves for life. And the danger of it must needs be great, as laying a foundation to bear the weight of their salvation, which divine wisdom saw to be quite unable to bear it. The issue whereof must be, that such covenanters shall lie down in sorrow. So the apostle determines, Gal. v. 4, “Christ is become of no effect unto you, whosoever of you are justified by the law; ye are fallen from grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Grace, from the Sacred Records</cite>, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 430-31.</span></figcaption>

And thus many, thinking that eternal salvation is proposed to them in the word upon the condition of faith, repentance, and sincere obedience to God’s law, do consent to these terms, and solemnly undertake to perform them: just binding themselves to such and such duties, that God may save their souls : and so they make their covenant. And while they can persuade themselves, that they perform their part of the covenant, they look for life and salvation thereupon. This doth quite overturn the nature of the covenant of grace: for “to him that worketh, the reward is not reckoned of grace, but of debt,” Rom. iv. 4; and “if it be of works, then it is no more grace,” chap. xi. 6.

The sinfulness of this practice is great, as overlooking Christ, the great undertaker and party-contractor by the appointment of the Father; and putting themselves in his room, to do and work for themselves for life. And the danger of it must needs be great, as laying a foundation to bear the weight of their salvation, which divine wisdom saw to be quite unable to bear it. The issue whereof must be, that such covenanters shall lie down in sorrow. So the apostle determines, Gal. v. 4, “Christ is become of no effect unto you, whosoever of you are justified by the law; ye are fallen from grace.”

— Thomas Boston, A View of the Covenant of Grace, from the Sacred Records, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 430-31.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+remains+for+sinners%2C+that+they+may+be+personally+and+savingly+in+covenant+with+God%2C+is+not%2C+as+parties+contractors+and+undertakers%2C+to+make+a+covenant+with+him+for+life+and+salvation%3B+but+only%2C+to+take+hold+of+God%E2%80%99s+covenant+already+made+from+eternity%2C+between+the+Father+and+Christ+the+second+Adam%2C+and+revealed+and+offered+to+us+in+the+gospel%2C+Isa.+lvi.+4%2C+6.+I+have+no+design+hereby+to+disparage+our+covenants+made+for+national+reformation+by+our+godly+progenitors%2C+and+commonly+called+the+national+covenant%2C+and+solemn+league+and+covenant%2C+on+which+God+set+the+seal+of+his+good+pleasure+in+the+experience+of+many.+These+and+the+like+are+covenants+of+duties%2C+consequential+enough+to+the+taking+hold+of+God%E2%80%99s+covenant+of+grace.%0A%0ANeither+would+I+discourage+any+serious+souls%2C+from+taking+hold+of+God%E2%80%99s+covenant+of+grace%2C+for+eternal+life+and+salvation+to+themselves%2C+with+all+the+awful+solemnity+of+the+most+express+words%2C+yea%2C+and+of+writing+and+subscribing+it+with+their+hands%3B+which+is+commonly+called+personal+covenanting.+But+I+would+have+all+to+beware+of+a+practical+corrupting+of+the+covenant+of+grace%2C+by+making+covenants+of+their+own%2C+upon+such+and+such+terms%2C+which+they+will+fulfil+for+life+and+salvation.+The+carnal+Jews+mistaking+the+design+of+the+giving+of+the+law%2C+did+so+corrupt+the+covenant+of+grace%3B+looking+for+life+and+salvation%2C+not+for+the+sake+of+the+promised+seed+alone%2C+but+for+their+obedience%2C+such+as+it+was%2C+to+the+moral+and+ceremonial+laws.%0A%0AAnd+thus+many%2C+thinking+that+eternal+salvation+is+proposed+to+them+in+the+word+upon+the+condition+of+faith%2C+repentance%2C+and+sincere+obedience+to+God%E2%80%99s+law%2C+do+consent+to+these+terms%2C+and+solemnly+undertake+to+perform+them%3A+just+binding+themselves+to+such+and+such+duties%2C+that+God+may+save+their+souls+%3A+and+so+they+make+their+covenant.+And+while+they+can+persuade+themselves%2C+that+they+perform+their+part+of+the+covenant%2C+they+look+for+life+and+salvation+thereupon.+This+doth+quite+overturn+the+nature+of+the+covenant+of+grace%3A+for+%E2%80%9Cto+him+that+worketh%2C+the+reward+is+not+reckoned+of+grace%2C+but+of+debt%2C%E2%80%9D+Rom.+iv.+4%3B+and+%E2%80%9Cif+it+be+of+works%2C+then+it+is+no+more+grace%2C%E2%80%9D+chap.+xi.+6.%0A%0AThe+sinfulness+of+this+practice+is+great%2C+as+overlooking+Christ%2C+the+great+undertaker+and+party-contractor+by+the+appointment+of+the+Father%3B+and+putting+themselves+in+his+room%2C+to+do+and+work+for+themselves+for+life.+And+the+danger+of+it+must+needs+be+great%2C+as+laying+a+foundation+to+bear+the+weight+of+their+salvation%2C+which+divine+wisdom+saw+to+be+quite+unable+to+bear+it.+The+issue+whereof+must+be%2C+that+such+covenanters+shall+lie+down+in+sorrow.+So+the+apostle+determines%2C+Gal.+v.+4%2C+%E2%80%9CChrist+is+become+of+no+effect+unto+you%2C+whosoever+of+you+are+justified+by+the+law%3B+ye+are+fallen+from+grace.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+A+View+of+the+Covenant+of+Grace%2C+from+the+Sacred+Records%2C+%281734%29+in+The+Works+of+Thomas+Boston%2C+ed.+Samuel+McMillan+%2812+vols%2C+London%2C+1853%29%2C+viii%2C+430-31.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8bcd639db3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8bcd639db3.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/03/12/thomas-boston-national-covenants-of-duty-are-not-the-unconditional-covenant-of-grace/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

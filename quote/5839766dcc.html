<main class="wrap"><figure class="quote" id="q-5839766dcc" data-kw="">
<blockquote><p>I know that many heap up arguments and bring us long rolls of authorities for episcopacy. And I know that Gersom, Bucer, Beza, [Calderwood’s] Altare Damascenum, Parker, Baynes, Salmasius, Blondel, Prynne (in his Catalogue of Writers against Bishops, and in his History of Bishops, pt. 2, ch. 3 and Unbishopping of Timothy and Titus), Dr. Reynolds and others do give us as long a train of arguments and authorities on the other side… but, methinks all those men that have without prejudice read the authors that I have mentioned (especially Bucer, Parker, and Blondel, and Salmasius), yea, though they have read all that ever was writ on the other side, should be so apprehensive of a difficulty in the business as to be moderate and modest in the censure of their brethren, and not to degrade or excommunicate all that differ from them. … And to have cited Calvin, Beza, Chamier, Pareus, Musculus or any of those multitudes of foreign divines that are known to be against them would have been labor in vain; and so it would have been to have cited Reynolds, Whitaker, Dr. Humphrey and such like at home, who are some known to be against them, and some no fast friends to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653), ‘Objections Answered’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6a15cfada7" data-kw="">
<blockquote><p>27. But ordinances about such circumstances as place, time and the like are rightly said by the best authorities to be partly divine and partly human. They are grounded in part upon the will of God because of their chief and primary purpose, and partly upon man’s prudence, insofar as a special observation agreeable to God’s will is concerned. If no human error is made in this matter, the ordinance is to be held as wholly divine. It is the will of God that the church meet at the most convenient hour of the day, all circumstances considered. If, therefore, no error occurs in estimating the circumstances, the hour assigned for meeting after due consideration must be acknowledged as if appointed by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, tr. John D. Eusden (1623; Baker, 1997), bk. 2, in ch. 14, ‘The Manner of Divine Worship’, section 27, p. 286</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-7071370bd4" data-kw="">
<blockquote><p>As regards eutaxia [good-order] in matters naturally outward and indifferent she [the Church] sets up those she thinks most likely to further edification, not in order that, as is the vicious way in the Papacy, they may become an essential part of divine worship, the norm of which is to be sought in God’s Word alone; but in order that they may be its supports and instruments suited to persons, times and places, as things concerned solely with the determination of outward circumstances, which may be altered in various ways to meet the exigencies of public edification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>XVI, 29, as trans. in Heppe, Reformed Dogmatics, ch. 16, sect. 49</cite>, p. 686</span></figcaption>

</figure><figure class="quote" id="q-191b7244e3" data-kw="">
<blockquote><p>You are pleased, dear sir, very kindly to ask me, whether I could sign the Westminster Confession of Faith, and submit to the presbyterian form of government; and to offer to use your influence to procure a call for me to some congregation in Scotland. I should be very ungrateful if I were not thankful for such kindness and friendship. As to my subscribing to the substance of the Westminster Confession, there would be no difficulty; and as to the presbyterian government, I have long been perfectly out of conceit of our unsettled, independent, confused way of church government in this land, and the presbyterian way has ever appeared to me most agreeable to the word of God, and the reason and nature of things; though I cannot say that I think that the presbyterian government of the Church of Scotland is so perfect, that it cannot, in some respects, be mended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>From a letter from Edwards to John Erskine in Scotland. ‘Memoir of Edwards’, prefixed to the London edition of his Works</cite>, p. 163 Edwards was an early-1700’s, New England congregationalist</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>With this view agrees Calvin. (See Institutes, Bk. 4, ch. 10, pp. 28-31.) The notion of Calvin and our Confession is briefly this: In public worship, indeed in all commanded external actions, there are two elements, a fixed and a variable. The fixed element, involving the essence or the thing, is beyond the discretion of the church. The variable, involving only the ” circumstances” of the action, its separable accidents, may be changed, modified or altered, according to the exigencies of the case. The rules of social intercourse and of grave assemblies in different countries vary. The church accommodates her arrangements so as not to revolt the public sense of propriety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Notes on Ecclesiology</cite>, (Richmond, 1892), Ch. 12, ‘The Nature &amp; Extent of Church Power’, p. 118</span></figcaption>

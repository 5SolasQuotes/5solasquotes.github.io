<blockquote><p>Almighty God will have himself worshipped, not only in a private manner by private persons and families, but also in a more public sort, of all the godly joined together in a visible church; that by this means he may be known not only to be the God and Lord of every Singular person, but also of the creatures of the whole universal world.

Question—But why do not we Christians under the New, keep the Sabbath on the same seventh day on which it was kept under the Old Testament?

I answer—Because our Lord Jesus, who is the Lord of the Sabbath (Matt. xii. 8), and whom the law itself commands us to hear (Deut. xviii. 18, 19), did alter it from that seventh day to this first day of the week on which we keep the Sabbath. For the holy evangelist notes, that our Lord came into the midst of the holy assembly on the two first days of the two weeks immediately following his resurrection, and then blessed the church, breathed on the apostles the Holy Ghost, and gave them the ministerial keys, and power of binding and remitting sins (John xx. 22, 23.)

And so it is most probable he did in a solemn manner every first day of the week, during the forty days he continued on earth between his resurrection and ascension (for the fiftieth day after, being the first day of the week, the apostles were assembled;) during which time he gave commandments unto the apostles, and “spake unto them those things which appertain to the kingdom of God,” (Acts i. 2, 3), that is, instructed them how they should, throughout the churches which were to be converted, change the Sabbath to the Lord’s day; the bodily sacrifices of beasts, to the spiritual sacrifices of praise, prayer, and contrite hearts; the Levitical priesthood of the law, to the Christian ministry of the gospel (Heb. vii. 11, 12;) the Jewish temples and synagogues, to churches and oratories; the old sacraments of circumcision and passover, to baptism and the Lord’s Supper, &amp;c. as may appear by the like phrase (Acts xix. 8; xxviii. 23; Col. iv. 11), put for the whole sum of Paul’s doctrine, by which were wrought all these changes, where it took effect.

So that as Christ was forty days instructing Moses in Sinai, what he should teach, and how he should rule the church under the law; so he continued forty days teaching his disciples in Sion, what they should preach, and how they should govern the church under the gospel (Eph. iv. 8, 11, 12.) And seeing it is manifest, that within those forty days Christ appointed what ministers should teach, and how they should govern his church to the world’s end, it is not to be doubted but that within those forty days he likewise ordained on what day they should keep their Sabbath, and ordinarily do the works of their ministry; especially seeing that under the Old Testament, God shewed himself as careful, both by his moral and ceremonial law, to prescribe the time, as well as the matter of his worship.

Neither is it a thing to be omitted, that the Lord, who hath times and seasons in his own power (Acts i. 7), appointed this first day of the week to be the very day in which he sent down from heaven the Holy Ghost upon the apostles (Acts ii. 1, &amp;c.), so that upon that day they first began, and ever after continued the public exercising of their ministry, in the preaching of the word (Acts ii. 1, 4), the administration of the sacraments (Acts ii. 38, 41, 42), and the loosing of the sins of penitent sinners (Acts ii. 38.) Upon these, and the like grounds, Athanasius plainly affirms that the Sabbath-day was changed by the Lord himself.</p></blockquote>

<blockquote><p>It is affirmed, that in Col. 3:16, and in the parallel scriptures, we have indubitable evidence of the divine right of psalms, hymns, and spiritual songs, of human composition. The word of Christ, that is, according to a very lame exposition, the gospel, or writings of the New Testament, exclusively, must dwell in us richly, and that with a reference to our mutual improvement; which is effected by teaching one another, in the singing of psalms, hymns, and spiritual songs; which compositions not being found in the Old Testament, must be drawn from, and formed according to the doctrines of the gospel, found in the New Testament; for there alone, “the word of Christ,” which is to constitute the great matter of these compositions, is to be found, being expressly distinguished by the apostle, in writing to the Hebrews, from all former revelations.

To these assertions I make the following replies:—You will justify me in remarking, in the first place, that it is not true, that the “word of Christ,” or the gospel, is confined, exclusively, to the writings of the New Testament. One who well understood what the gospel is, informs us, that it was preached unto Abraham; and that to the Antediluvians the righteousness of faith, of which Noah was both an heir and a preacher, was made known. To them Christ by his Spirit preached in the day of forbearance, though now they occupy the place of imprisoned spirits. If the Spirit of Christ preached to them, one would reasonably conclude, they enjoyed the revelation of the word of Christ.

We are also certified, that the gospel was preached to the Israelites in the wilderness.—Unto us was the gospel preached as well as unto them. How could these writers presume to assert, that “where the apostle writes immediately to the Jews themselves, he expressly distinguishes the word of Christ from all former revelations, made by Moses and the prophets,”—“distinguishes the gospel from all the revelations of the divine will, in the Old Testament,”—when that apostle informs those very people, and in that same epistle, that the gospel, in “the revelation of the divine will in the Old Testament,” was preached to their fathers? May not a suspicion, without illiberality, exist, that men who write and talk at this rate, are novices in the knowledge of what the gospel is? But, in every age of the church, teachers have been found, understanding neither what they said, nor whereof they affirmed.

My second remark is this:—It is gratuitous to assert, that in the Old Testament scriptures, psalms, hymns, and spiritual songs, are not to be found. Is not this a pitiful play on words? Does it become men of sense thus to write? …

My third remark is on the text, Col. 3:16.—It appears to be both misunderstood and misapplied. Duties highly important, and the manner of performing them, are enjoined. They are three: An intimate and extensive acquaintance with the doctrine of Christ: Let the word of Christ dwell in you richly—Wisely promoting each other’s edification: In all wisdom, teaching and admonishing one another—Praising God, with proper dispositions of heart, in the use of psalms, hymns, and spiritual songs: In psalms, and hymns, and spiritual songs, singing with grace in your heart to the Lord. The celebration of the divine perfections, in suitable songs, wisely teaching and admonishing one another, are duties demanded by God; and that to discharge these duties aright, requires an extensive acquaintance with the inspired page, our apostle teaches, and the Christian readily acknowledges; but the scripture under consideration neither requires the members of the church to commence making hymns, nor authorizes the use of such, in the church, when made.

Psalms, and hymns, and spiritual songs, are, indeed, to be sung; but these are found in this inspired Book. The attempt to justify the expulsion of the Book of Psalms, and the introduction of uninspired hymns, from these injunctions of the sacred writer, argues a remarkable obliquity of intellect, not excused, even by the unhappy punctuation of our version. I have said, unhappy punctuation; for “through bad pointing this verse is not very intelligible; the several members of it should be distinguished thus: Let the doctrine of Christ dwell richly among you; teaching and admonishing each other in all wisdom; singing, with grace in your hearts unto the Lord, in psalms, hymns, and spiritual songs. This arrangement the original will not only bear, but it absolutely requires it, and it is not sense without it.” Still, it must be seen, that no pointing, however bad, can give any countenance to a human, in preference to an inspired system of psalms. Whether the argument upon which I have animadverted, merits a better character than “gratuitous assumption,” I leave to my reader to decide.</p></blockquote>

as+preached+to+the+Israelites+in+the+wilderness.%E2%80%94Unto+us+was+the+gospel+preached+as+well+as+unto+them.+How+could+these+writers+presume+to+assert%2C+that+%E2%80%9Cwhere+the+apostle+writes+immediately+to+the+Jews+themselves%2C+he+expressly+distinguishes+the+word+of+Christ+from+all+former+revelations%2C+made+by+Moses+and+the+prophets%2C%E2%80%9D%E2%80%94%E2%80%9Cdistinguishes+the+gospel+from+all+the+revelations+of+the+divine+will%2C+in+the+Old+Testament%2C%E2%80%9D%E2%80%94when+that+apostle+informs+those+very+people%2C+and+in+that+same+epistle%2C+that+the+gospel%2C+in+%E2%80%9Cthe+revelation+of+the+divine+will+in+the+Old+Testament%2C%E2%80%9D+was+preached+to+their+fathers%3F+May+not+a+suspicion%2C+without+illiberality%2C+exist%2C+that+men+who+write+and+talk+at+this+rate%2C+are+novices+in+the+knowledge+of+what+the+gospel+is%3F+But%2C+in+every+age+of+the+church%2C+teachers+have+been+found%2C+understanding+neither+what+they+said%2C+nor+whereof+they+affirmed.%0A%0AMy+second+remark+is+this%3A%E2%80%94It+is+gratuitous+to+assert%2C+that+in+the+Old+Testament+scriptures%2C+psalms%2C+hymns%2C+and+spiritual+songs%2C+are+not+to+be+found.+Is+not+this+a+pitiful+play+on+words%3F+Does+it+become+men+of+sense+thus+to+write%3F+%E2%80%A6%0A%0AMy+third+remark+is+on+the+text%2C+Col.+3%3A16.%E2%80%94It+appears+to+be+both+misunderstood+and+misapplied.+Duties+highly+important%2C+and+the+manner+of+performing+them%2C+are+enjoined.+They+are+three%3A+An+intimate+and+extensive+acquaintance+with+the+doctrine+of+Christ%3A+Let+the+word+of+Christ+dwell+in+you+richly%E2%80%94Wisely+promoting+each+other%E2%80%99s+edification%3A+In+all+wisdom%2C+teaching+and+admonishing+one+another%E2%80%94Praising+God%2C+with+proper+dispositions+of+heart%2C+in+the+use+of+psalms%2C+hymns%2C+and+spiritual+songs%3A+In+psalms%2C+and+hymns%2C+and+spiritual+songs%2C+singing+with+grace+in+your+heart+to+the+Lord.+The+celebration+of+the+divine+perfections%2C+in+suitable+songs%2C+wisely+teaching+and+admonishing+one+another%2C+are+duties+demanded+by+God%3B+and+that+to+discharge+these+duties+aright%2C+requires+an+extensive+acquaintance+with+the+inspired+page%2C+our+apostle+teaches%2C+and+the+Christian+readily+acknowledges%3B+but+the+scripture+under+consideration+neither+requires+the+members+of+the+church+to+commence+making+hymns%2C+nor+authorizes+the+use+of+such%2C+in+the+church%2C+when+made.%0A%0APsalms%2C+and+hymns%2C+and+spiritual+songs%2C+are%2C+indeed%2C+to+be+sung%3B+but+these+are+found+in+this+inspired+Book.+The+attempt+to+justify+the+expulsion+of+the+Book+of+Psalms%2C+and+the+introduction+of+uninspired+hymns%2C+from+these+injunctions+of+the+sacred+writer%2C+argues+a+remarkable+obliquity+of+intellect%2C+not+excused%2C+even+by+the+unhappy+punctuation+of+our+version.+I+have+said%2C+unhappy+punctuation%3B+for+%E2%80%9Cthrough+bad+pointing+this+verse+is+not+very+intelligible%3B+the+several+members+of+it+should+be+distinguished+thus%3A+Let+the+doctrine+of+Christ+dwell+richly+among+you%3B+teaching+and+admonishing+each+other+in+all+wisdom%3B+singing%2C+with+grace+in+your+hearts+unto+the+Lord%2C+in+psalms%2C+hymns%2C+and+spiritual+songs.+This+arrangement+the+original+will+not+only+bear%2C+but+it+absolutely+requires+it%2C+and+it+is+not+sense+without+it.%E2%80%9D+Still%2C+it+must+be+seen%2C+that+no+pointing%2C+however+bad%2C+can+give+any+countenance+to+a+human%2C+in+preference+to+an+inspired+system+of+psalms.+Whether+the+argument+upon+which+I+have+animadverted%2C+merits+a+better+character+than+%E2%80%9Cgratuitous+assumption%2C%E2%80%9D+I+leave+to+my+reader+to+decide.%E2%80%9D%0A%0A%E2%80%94+Gilbert+McMaster%2C+An+Apology+for+the+Book+of+Psalms%2C+in+Five+Letters%3B+Addressed+to+the+Friends+of+Union+in+the+Church+of+God%2C+%281818%3B+4th+edn%2C+Philadelphia%3A+Daniels+%26+Smith%2C+1852%29%2C+pp+156-59n.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6a2d046ea4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6a2d046ea4.html">Permalin <blockquote><p>Another fault is that all the people are appointed in diverse places to say after the minister, whereby not only the time is unprofitably wasted and a confused voice of the people, one speaking after another, caused but an opinion bred in their heads that those only be their prayers which they say and pronounce with their own mouths, which causes them to give the less heed to the rest of the prayers which they rehearse not after the minister, which, notwithstanding are as well their prayers as those which they pronounce after the minister otherwise than the order which is left unto the church of God does bear. For God has ordained the minister to this end, that, as in public meetings he only is the mouth of the Lord from Him to the people, even so he ought to be the only mouth of the people from them unto the Lord, and that all the people should attend to that which is said by the minister, and in the end both declare their consent to that which is said, and their hope that it should so be and come to pass which is prayed, by the word “Amen;” as St. Paul declares in the epistle to the Corinthians [1 Cor. 14:6], and Justin Martyr shows to have been the custom of the churches in his time. Although these blots in the Common Prayer be such as may easily enough appear unto any which is not wedded to a prejudicate opinion and that there is no great difficulty in this matter, yet I know that this treatise of prayer will be subject to many reprehensions and that there will not be wanting some probable colors also whereby these things may be defended if men will set themselves to strive and to contend: yet (for the desire that I have that these things should be amended and for the instruction of the simpler which are studious of the truth) I have been bold to utter that which I think, not doubting also but that the light of the truth shall be able to scatter all those mists of reasons which shall go about to darken the clearness thereof.</p></blockquote>

<blockquote><p>That the [Anglican] Ceremonies are a great hinderance to edification appears, first, in that they obscure the substance of religion and weaken the life of godliness by outward glory and splendor, which draws away the minds of people so after it that they forget the substance of the service which they are about… departing from the apostolical and most ancient simplicity, and for adding ceremonies unto ceremonies in a worldly splendor and spectability, whereas the worship of God ought to be pure and simple… Secondly, the Ceremonies are impediments to the inward and spiritual worship, because they are fleshly and external…</p></blockquote>

<blockquote><p>Augustine, in his work, entitled, On the Labour of Monks, complaining of certain itinerant impostors, who, as early as his day, plied a vile and sordid traffic, by carrying the relics of martyrs about from place to place, adds, “If, indeed, they are relics of martyrs.” By this expression, he intimates the prevalence, even in his day, of abuses and impostures, by which the ignorant populace were cheated into the belief, that bones gathered here and there were those of saints. While the origin of the imposture is thus ancient, there cannot be a doubt that in the long period which has since elapsed, it has exceedingly increased, considering, especially, that the world has since been strangely corrupted, and has never ceased to become worse, till it has reached the extreme wherein we now behold it. But the first abuse, and, as it were, beginning of the evil, was, that when Christ ought to have been sought in his Word, sacraments, and spiritual influences, the world, after its wont, clung to his garments, vests, and swaddling-clothes; and thus overlooking the principal matter, followed only its accessory. The same course was pursued in regard to apostles, martyrs, and other saints. For when the duty was to meditate diligently on their lives, and engage in imitating them, men made it their whole study to contemplate and lay up, as it were in a treasury, their bones, shirts, girdles, caps, and similar trifles. I am not unaware that in this there is a semblance of pious zeal, the allegation being, that the relics of Christ are kept on account of the reverence which is felt for himself, and in order that the remembrance of him may take a firmer hold of the mind. And the same thing is alleged with regard to the saints. But attention should be paid to what Paul says, viz., that all divine worship of man’s devising, having no better and surer foundation than his own opinion, be its semblance of wisdom what it may, is mere vanity and folly. Besides, any advantage, supposed to be derived from it, ought to be contrasted with the danger. In this way it would be discovered, that the possession of such relics was of little use, or was altogether superfluous and frivolous, whereas, on the other hand, it was most difficult, or rather impossible, that men should not thereby degenerate into idolatry. For they cannot look upon them, or handle them, without veneration; and there being no limit to this, the honour due to Christ is forthwith paid to them. In short, a longing for relics is never free from superstition, nay, what is worse, it is the parent of idolatry, with which it is very generally conjoined. All admit, without dispute, that God carried away the body of Moses from human sight, lest the Jewish nation should fall into the abuse of worshipping it. What was done in the case of one ought to be extended to all, since the reason equally applies. But not to speak of saints, let us see what Paul says of Christ himself. He declares, that after the resurrection of Christ he knew him no more after the flesh, intimating by these words, that every thing carnal which, belonged to Christ should be consigned to oblivion and discarded, in order that we may make it our whole study and endeavour to seek and possess him in spirit. Now, therefore, when men talk of it as a grand thing to possess some memorial of Christ and his saints, what else is it than to seek an empty cloak with which to hide some foolish desire that has no foundation in reason? But even should there seem to be a sufficient reason for it, yet, seeing it is so clearly repugnant to the mind of the Holy Spirit, as declared by the mouth of Paul, what more do we require? But it is not at all necessary to enter into a long discussion of the point, whether or not it is a good thing to have relics merely for preservation, and not for worship; for, as we have said, experience teaches that the one is never separated from the other. Ambrose, indeed, speaking of Helena, (the mother of Constantine,) who had at great labour and expense procured the cross of our Lord, says, that she did not adore the wood, but only the Lord, who had hung upon it. But it is most rare for persons to be at all devoted to relics, without being also polluted by some degree of superstition. I admit that they do not, at the very outset, break out into open idolatry, but that gradually, from one fallacy to another, they move along their downward path, until they at last rush headlong. Indeed, people, calling themselves Christian, have gone to such lengths as to exhibit the madness of idolatry in a degree equal to that of the heathen of old, For they have prostrated themselves, and bent the knee before relics as before God, lighting torches and tapers as in solemn worship, putting confidence in them, and fleeing to them as if they possessed a divine power and grace. If idolatry is just to transfer the honour of God to others, can we deny that this is idolatry? It is no excuse to say it is done through the excessive zeal of rude and ignorant men or old women. The extravagance is of wider extent. It has everywhere prevailed, and been approved even by those who sit holding the reins of government in the Church. Nay, the bones of the dead, and all other sorts of relics, have been placed over the principal altars in the high and lofty place to be adored with greater reverence. See how what was at first a foolish curiosity for preserving and treasuring up relics, has at length degenerated into such abomination, that men have not only turned away from God, in order to cleave to things vain and perishing, but even with execrable sacrilege to adore things void of sense, instead of Him who liveth, and is blessed for evermore. But as evil leads on to evil, another unhappy consequence was, that vile objects, out of number, and altogether devoid of sense and beauty, were received as relics of Christ and the Saints. So blind was the world, that, under whatever name the vain toys were presented, they were at once received without examination and selection as genuine. In this way, men made no difficulty in hugging any ass’ or dog’s bones which any trifler chose to bring forward as the bones of martyrs. The same thing, as we will afterwards show, happened in other cases, and, I doubt not, by just punishment from God. For when the world, inflamed, as it were, with a kind of rage, longed after relics, that they might pervert them to superstition, it might have been anticipated that God would permit lie to follow upon lie. For in this way is He wont to avenge insult offered to his name, when the glory due only to Himself is transferred to others. Wherefore, the true explanation of the fact, that so many spurious relics exist, is just that when men were delighting in lies, God permitted them to fall into a double error.</p></blockquote>

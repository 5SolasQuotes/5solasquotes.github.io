<main class="wrap"><figure class="quote" id="q-dd1839b160" data-kw="prophetic ministry preaching">
<blockquote><p>But it is taken most strictly and properly for that full and august revelation of the mysteries of salvation which Christ (as the highest teacher of the church) has exhibited to us. It is not comprehended under the priesthood or under the kingly office, but constitutes a distinct part of the mediatorial office—the prophetic. Public teachers and ministers of the church are prophets in a wider sense, in which sense “the spirits of the prophets are subject to the prophets” (1 Cor. 14:32).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.7.1b</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-61a2efa655" data-kw="Mary Queen of Heaven Mediator">

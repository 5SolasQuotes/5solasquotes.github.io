<main class="wrap"><figure class="quote" id="q-71da08c643" data-kw="">
<blockquote><p>Article 32. We believe that it is expedient, that they who be chosen superintendents in the Church, should wisely consult among themselves, by what means the whole body may conveniently be ruled, yet so as they do not swerve from that which our Lord Jesus Christ has instituted. And this does not hinder but that in some churches there may be those particular constitutions, which will be more convenient for them than for others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Intro, section 9, Confession of Faith, held and professed by the Reformed Churches of France, enacted by the first National Synod, in Paris, 1559, p. xiii</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-50faa103fb" data-kw="">
<blockquote><p>18. It was not necessary to the priesthood before Christ that there were an uninterrupted succession of right ordination: For the priests in Christ’s time were such as had no right to it, not of the right line (which had been long before interrupted), they bought the priesthood for money: and as many judge, were annual and two at a time (though not equal). Yet Christ requires submission to them as priests. I am sorry that we must be put to use the same arguments with these [episcopal] men as we have done against the old Separatists so long.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘Objections Answered’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>
<div class="actions"><button class="copy" data-copy="“18. It was not necessary to the priesthood before Christ that there were an uninterrupted succession of right ordination: For the priests in Christ’s time were such as had no right to it, not of the right line (which had been long before interrupted), they bought the priesthood for money: and as many judge, were annual and two at a time (though not equal). Yet Christ requires submission to them as priests. I am sorry that we must be put to use the same arguments with these [episcopal] men as we have done against the old Separatists so long.”

</figure><figure class="quote" id="q-636237e129" data-kw="">
<blockquote><p>If &quot;elders&quot; and &quot;bishops&quot; be not the same persons, having the same office, the same function, and the same duties, and the same names, it is impossible, So far as I understand, how it should be expressed: for these elders are they whom the Holy Ghost made bishops, they were many of them in the same church, their duty it was to attend unto the flock and to feed the church, which comprise all the duties, the whole function of elders and bishops; which must therefore be the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Nature of a Gospel Church and Its Government</cite>, ch. 4 (Works 16)</span></figcaption>

</figure><figure class="quote" id="q-bc20dc03fa" data-kw="">
<blockquote><p>If bishops would ordain presbyters by limiting words, restraining them from any essential or integral part of the office or power as instituted by Christ, and yet profess that they ordain them to the office which Christ has instituted, it is no schism for those presbyters afterward to claim (and execute in season) all the power which by Christ’s institution belongs to their office, though against the bishops’ wills: Because the bishops are not the authors or donors of the office power, but only the ministerial deliverers and investers; and therefore it is Christ and not they that must describe it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), sect. 6, p. 54</span></figcaption>

<blockquote><p>It is indifferent whether we use white or red wine; we are no more bound to the wine of Judea than to the wine of France at the ministration of the Supper: these are but national differences.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6286596b73" data-kw="">
<blockquote><p>Were it that we had no precept of Christ to [‘Do this’] but only the example of his doing it in the first institution, this should be a rule for us to observe it punctually, excepting in such circumstances which only occasionally and accidentally happened therein… Which doctrine we are now to try by the judgement of antiquity… In the days of Pope Julius, anno 337, there arose many giddy spirits which violated the holy institution of Christ in this sacrament when as some consecrated milk instead of wine, others sopped the bread in the cup, a third sort squeezed grapes there-into. These, and the like, that holy Pope did condemn, but how? By pretense of custom only? No, but by the obligation of Christ, his example, and institution of this sacrament, in these words following: Because these are contrary (says he) to evangelical and apostolical doctrine and ecclesiastical custom, as is easily proved from the fountain of truth, from whence the sacraments had their first ordinance; for when our Master of Truth commended this to his disciples, He gave to none milk, but bread only, and the cup. Nor does the Gospel mention the sopping of bread, but of giving bread apart, and the cup also apart, etc. So Pope Julius [see the original latin]. Long after this, the Council of Braccara (about the year of our Lord, 675) [footnote] withstood the complemental custom of receiving both kinds [of bread and wine] in dipped sops, but wot [know] you why? Hearken, even because it is not revealed in the Gospel of Christ’s institution. Ponder the Testimony in the margin [of the book] and you shall find it point-blank contradictory to your opinion and practice. Which reasoning of the bishops of that council had been very loose and lavish, except they had believed that the form of institution of Christ, concerning the participation of both kinds, was as commandatory as well for the people as the priest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-morton.html">Thomas Morton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lords Supper or, A Vindication of the Sacrament</cite>, (1656), pp. 62-3</span></figcaption>

</figure><figure class="quote" id="q-8f9025adaf" data-kw="">
<blockquote><p>The elements of the sacrament are bread and wine. There is controversy between east and west on this point. The Greek Church says the bread must be leavened, the Latin unleavened, making this a point of serious importance. We believe that the bread used was paschal. But it was not Christ’s intention to give ritually a paschal character to the new sacrament; and bread is employed as the material element of nutrition, the one most familiar and universal. Hence, we regard all the disputes as to leaven, and the other minutiae made essential by the Romanist rubric (wheaten, mingled with proper water, not worm–eaten, etc.,) as non–essential.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1898 | This quote was compiled by Andy Webb</span></figcaption>

</figure><figure class="quote" id="q-05426fba33" data-kw="both kinds">
<blockquote><p>From this the opinion of the Romanists is evident without any further investigation. Ours is wholly contrary. In fact, we think that the communion under both kinds instituted by Christ should necessarily be retained; so that it is not only free to each one to use it, but from the command of Christ they are individually bound to it, unless they are prevented by some insuperable hindrance. Not without the highest sacrilege can the cup be taken away from the people against the express law of God. The state of the question therefore (1) is not Was communion under both kinds instituted by Christ? (which our opponents do not dispute); but Ought it to be instituted in like manner by believers, so that it is not only a thing indifferent and accidental, but necessary and essential to the perfection of the sacrament? (2) The question is not Is the believer so bound to communion under both kinds that he cannot in any case without sin commune under one kind only? For we confess if any unavoidable impediment interposes, either internal (arising from the disposition of the receiver) or external from other causes, by which he is prohibited from taking one kind, such an one is worthy of commiseration rather than of reprehension.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.25.5</span></figcaption>

<blockquote><p>§2. The fourth position we draw from the same rule [of following the example of Christ] is, that it is not indifferent for a minister to omit the breaking of the bread at the Lord’s table after the consecration and in the distribution of it, because he ought to follow the example of Christ, who, after He had blessed the bread, and when He was distributing it to them who were at table, brake it, breaking into pieces in his hands the bread he had taken,¹ but had it not carved in small pieces before it was brought to the table. Hence, G. J. Vossius² does rightly condemn those who, though they break the bread in multas minutias [into many small pieces], yet they break it not in actu sacramentali [in the sacramental act]. Such a breaking as this (he says well) is not mystica [related to mystery], but coquinaria [related to cooking].

1. Paræus in 1 Cor. 11:24. manibus comminuendo panem acceptum in partes. [Cf. Ad Corinthios priorem (1609), col. 743.]

2. De Symb. Cœnæ Dom., disp. 2, thes. 5. [Cf. Theses Theologicæ et Historicæ, 1658 ed., p. 275.]</p></blockquote>

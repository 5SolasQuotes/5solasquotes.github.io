<main class="wrap"><figure class="quote" id="q-da08aaf6da" data-kw="">
<blockquote><p>Many things are necessary to us either as causes, or as conditions, or as means, as instruments, as helps, as props, by which we may be brought to eternal life: by which either the bars and impediments may be taken away, which block up to us the way and passage to eternal life, or the necessary stairs are laid under, for our ascending to the height of that sublimity; or else necessary strength is afforded us to go that hard journey, and bear that hard conflict; or that the strength and force of our enemies may be broken and foiled. We have need of knowledge, constancy, charity, sanctity, prayers, good works, etc. But above all these we must seek faith as a certain epitome and compendium of them all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-boyd.html">Robert Boyd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, ch. 4, vv. 12-13, p. 521 trans. Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 410</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-4689b0b30b" data-kw="">
<blockquote><p>So a holy person rejoiceth that the way of holiness is the appointed way to Heaven… he delights in the Gospel-constitution, because it requires universal holiness… This is solid rational religion, fit to be depended upon, in opposition to the antinomian licentiousness, the freaks of enthusiasm, and the irrational flights of passion and imagination on the one hand; and in opposition to formality, mere morality, and the self-sprung religion of nature on the other… Men are naturally averse to this Gospel method of salvation… they will endeavor to widen the way to Heaven, and persuade themselves they shall attain it, notwithstanding their continuance in some known iniquity, and though their hearts have never been thoroughly sanctified… How many give up their hopes of Heaven rather than part with sin… and must not such degenerate creatures be renewed ere they can be holy, or see the Lord!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-davies.html">Samuel Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons</cite>, (Philadelphia, 1864), vol. 1, Sermon 9, ‘The Connection Between Present Holiness and Future Felicity’, on Heb. 12:14, pp. 277-78</span></figcaption>

</figure><figure class="quote" id="q-e5fd42e07e" data-kw="">
<blockquote><p>Justification is such a work as is at once completed in all the causes, and the whole effect of it, though not as unto the full possession of all that it gives right and title unto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, … (London: Boulter, 1677), ch. 5, p. 199</span></figcaption>

</figure><figure class="quote" id="q-9aa27b38b9" data-kw="">
<blockquote><p>What is the end of our Justification? … Lastly, that we ourselves might be bettered and made righteous. Gal. 2:17, “If then while we seek to be made righteous by Christ, we ourselves are found sinners, is Christ therefore the minister of sin? God forbid.” For to this end are we justified by faith through Christ, that the old man being abolished by the power and efficacy of Christ crucified, Christ might live in us and that we should by our study and labor endeavor to bring forth good works, [and] show ourselves thankful to God for so great a benefit. And therefore it is that the apostle Paul almost in all his epistles derives the doctrine of sanctification, or good works, from the doctrine of faith or justification as the cause from the effect, or the necessary consequent from the antecedent. What are the adjuncts of Justification? … For saiys Augustine, good works do follow a man already justified, and do not go before a man that is to be justified, as good fruits are not before a good tree… The works accompanying or following it are… Moreover the adopting of us to be sons of God, our sanctification or newness of life, the fruits whereof are described, Gal. 5:22. For they that are made partakers of Christ through faith, they do with Him receive the Holy Ghost, the author of all holiness; from whence it is, that these two benefits are indeed distinguished one from another, but yet so linked together by an unseparable bond that they can never be plucked asunder; and the latter is the testimony of the former, both in the soul of the faithful man himself and to other men also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (London, 1606), ch. 31, ‘Justification’, pp. 354-56</span></figcaption>

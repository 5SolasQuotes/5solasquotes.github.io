<main class="wrap"><figure class="quote" id="q-fbf68ec730" data-kw="">
<blockquote><p>O! but there are some Princes in the world that pass others in wisdom: there are wise &amp; high spirited men that will put order to others, and with their wit will compass Heaven and earth, that will search out the deepness of nature, and be occupied in high things: it may be that these men have found out this wisdom. The Apostle meeteth this: No, saith he, none of the princes of this world, whether Jews or Gentiles, found out this wisdom.

All the great Monarchs, all the Philosophers, with their wisdom, and philosophy, never thought once on such a thing: it is true indeed, there is some in this world that have ever been occupied in high things above the reach of the common sort of people, sitting on high places, searching into the deepness of nature: but among all their occupations, high conceits and devises, there was never so much as a thought or suspicion or a dream of that only remedy against sin and death, of that only way and means of salvation, and delivery of a lost sinner.

A wonderful thing! condemned men sitting in such occupations, without any thought of their damnation. Emperors condemned men! and yet never such a thing as a thought how they should be relieved of their condemnation! It is true, the Philosophers among the nations aspired to a wisdom and knowledge of God to know Him, and some of them laboured to set down a science of Him.

Plato travailed much on this purpose, and therefore he was called Divine: but all their knowledge was of GOD the Creator, as He created this world, and by His providence governeth it. But will ye speak of GOD the Redeemer in His Son Jesus Christ, they had never such a thing as a thought of Him: and yet for all the business that they had about the Creation; and GOD the Creator, what were they? fools, and evanished in their own cogitations, &amp; as ye may read, Rom. 1. 22. 23. in stead of the true God they set up an idol to be worshipped.

Then seeing they found it not out, and seeing it is so necessary for all men, even for Princes (for they shall never see life except they get a part of this wisdom) they are bound to keep that wisdom, in sincerity, and not to prejudge her liberty one whit: but to maintain her and keep her from all her enemies, that would pervert her. Thou foundest her not out, keep her therefore in her liberty. The Lord grant that men may be occupied this way in their counsels, not in impairing, but in preserving the liberty of this wisdom, that only must save them: Thy kingdom, thy life, thine honour and all these earthly riches will away, only this wisdom will abide.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain sermons, upon several texts of Scripture</cite>, eds Henry Charteris and William Arthur (Edinburgh: Andro Hart, 1616), pp 102-04.</span></figcaption>

<blockquote><p>Now, it happens in certain things which are ordained towards an end that there is both a right and a wrong way to proceed: and for this reason, in the government of a multitude there is a distinction between right and wrong. A thing is rightly directed when it is led towards a fitting end; wrongly, when it is led towards an unfitting end. Now the end which befits a multitude of free men is different from that which befits a multitude of slaves, for the free man is one who exists for his own sake, while the slave, as such, exists for the sake of another.

If, therefore, a multitude of free men is ordered by the ruler towards the common good of the multitude, that rulership will be right and just, as is suitable to free men. If, on the other hand, a rulership aims not at the common good of the multitude, but at the private good of the ruler, it will be an unjust and perverted rulership. And hence the Lord threatens such rulers, saying by the mouth of Ezekiel: Woe to the shepherds that feed themselves, as seeking their own interest, should not the flocks be fed by the shepherd? (Ezek 34:2). Shepherds indeed should seek the good of their flocks, and every ruler the good of the multitude subject to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Ad Regem Cypri</cite>, (1266-67), Book 1, C. 1.</span></figcaption>

<blockquote><p>The supporters of this Seminary are thorough and sound Presbyterians. No uncertain note is given from the pulpits of the alumni of this institution. The directors believe that the students graduated from this Seminary will be, theologically, largely what you make them. Therefore, we believe your teaching must be dogmatic. Your philosophy and your metaphysics will be great contributions to the power of your teaching. But, after all, our theology is not based on secular philosophy or modern psychology but on the Word of God, as contained in the Holy Scriptures, — described in our Confession as the only infallible rule of faith and practice.

Therefore, we expect the students to be taught with a fire of conviction, which cannot help leaving its impression upon them, so that your teaching will not seem to be the abstract discussion of a man who has only half thought his subject through: “Ever learning, but never coming to a knowledge of the truth”. But rather that kind of teaching which presents the result of the teacher’s own labours as he builds his system of theology on the eternal truth of God, revealed by him in our infallible Scriptures.

Such a teacher translates his theological science for his students — not alone correlating great theological principles or distinguishing the Biblical and professional teaching from erroneous views; but while it will be teaching of the highest scholarship, it will gain power — constructive power — by reason of the teacher’s own experience in the application of these great truths to his own soul. This, I believe, is what makes great theological teachers. It was this that made more than one of your distinguished predecessors what they were, and it is this that produces in our ministry men who are not dabblers in theology, but constructive defenders of our Presbyterian doctrinal heritage.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9268f81703" data-kw="">
<blockquote><p>In fact it seems much more accurate to say that Amyraut was the real Reformed “scholastic,” and “Reformed Thomas Aquinas,” the balancer, the synthesizer, the creator of new categories, and structures. And Reformed orthodoxy, with its insistence on limited redemption, was actually a primitive throwback to the rigorous and markedly non-rationalistic particularism of Augustine and Gottschalk. Under whatever label, John Calvin, as a limited redemptionist, belongs historically with Augustine, Gottschalk, Bucer, Beza and Reformed orthodoxy–not with Amyraut.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-rainbow.html">Jonathan Rainbow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Will of God and the Cross</cite>, (Allison Park, PA: Pickwick Publications, 1990), p. 62</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Westminster Assembly and Its Work’ in The Works of Benjamin B. Warfield</cite>, 6:142 &amp; 143), examining the historical debate surrounding WCF 3.6, “Neither are any other redeemed by Christ, effectually called, justified, adopted, sanctified, and saved, but the elect only:”</span></figcaption>

</figure><figure class="quote" id="q-755e0e1434" data-kw="">
<blockquote><p>The first contains the preparation of the remedy necessary for man’s salvation; the second brings with it an application of the same. And consequently the one may well appertain to the common nature, which the Son assumed, when the other is a special privilege vouchsafed to such particular persons only, as the Father has given Him. And therefore we may safely conclude out of all these premises, that ‘the Lamb of God, offering Himself a sacrifice for the sins of the whole world,’ intended by giving sufficient satisfaction to God’s justice, to make the nature of man, which He assumed, a fit subject for mercy and to prepare a medicine for the sins of the whole world, which should be denied to none that intended to take the benefit of it: howsoever He intended not by applying this all-sufficient remedy unto every person in particular to make it effectual unto the salvation of all, or to procure thereby actual pardon for the sins of the whole world. So, in one respect He may be said to have died for all; yet so as in respect of his mercy He may be counted a kind of universal cause of the restoring of our nature, as Adam was of the depraving of it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher</cite>, … 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘Of the True Intent &amp; Extent of Christ’s Death &amp; Satisfaction upon the Cross’ (1617), pp. 552-60, p. 559</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>
<div class="actions"><button class="copy" data-copy="“The first contains the preparation of the remedy necessary for man’s salvation; the second brings with it an application of the same. And consequently the one may well appertain to the common nature, which the Son assumed, when the other is a special privilege vouchsafed to such particular persons only, as the Father has given Him. And therefore we may safely conclude out of all these premises, that ‘the Lamb of God, offering Himself a sacrifice for the sins of the whole world,’ intended by giving sufficient satisfaction to God’s justice, to make the nature of man, which He assumed, a fit subject for mercy and to prepare a medicine for the sins of the whole world, which should be denied to none that intended to take the benefit of it: howsoever He intended not by applying this all-sufficient remedy unto every person in particular to make it effectual unto the salvation of all, or to procure thereby actual pardon for the sins of the whole world. So, in one respect He may be said to have died for all; yet so as in respect of his mercy He may be counted a kind of universal cause of the restoring of our nature, as Adam was of the depraving of it…”

<main class="wrap"><figure class="quote" id="q-c899acc5da" data-kw="">
<blockquote><p>We must carefully distinguish between a twofold union and communion we have with Christ:

1. By the Spirit on his part: for Christ as by his death, he is the meritorious cause of life and grace unto the elect, so by his Spirit He is the only efficient of life and grace in the regenerate. To whom, whilst they are yet dead in sin and destitute of all grace, so as they neither do nor possibly can believe, Christ sends his Spirit which breathes life into them, changes and purifies their nature by working all holy and rectified abilities in every part. Now this first work of the Spirit, creating of grace in the soul, does most apparantly precede not only the act of believing, but the habit also: for the habit itself is infused by this work. And therefore it is also manifest that before all faith we have and must have some participation with Christ, even to this end that we may have faith. But this union with Him is wrought merely by the Holy Spirit, which is that band whereby Christ knits Himself to us, communicating all gracious and quickening virtue from Himself to us, and thereby making us living members of his body.

2. By our faith on our parts: when being quickened by infused grace we actually apply ourselves to embrace the promise and to rely upon Christ only. And here we knit ourselves to Christ, resting upon Him alone for all comfort. By which uniting of ourselves to Christ we receive a greater increase and larger measure of grace from Him. In the first union we were insensible of it, and grace is given to us non petentibus, that asked not after it: in this second union we are most sensible of its comfort and benefit; and here an augmentation of grace is bestowed on us petentes, earnestly suing for it, and by faith expecting the receiving of it. Wherefore I conclude, all grace and virtue whatsoever in us is given us from the fulness of Christ, the fountain of all supernatural life; but yet all is not wrought by Christ embraced by our faith, but by Christ conveying his grace unto us by his Spirit. This first quickens us: we then with Lazarus after life put into us, can awake, stand up, come forth, and by faith look on Him that raised us, fall down, worship and believe in Him as our Lord and God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith</cite>, … (London: 1627), pp. 15-16</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-69a6893b9f" data-kw="">
<blockquote><p>XXIII. The mode by which God acts in efficacious vocation having now been explained, it remains for us to see how man conducts himself toward it. Here, there can be a twofold notion of man, as he is considered either in the first act of conversion or in the second act. Considered in the former, he behaves purely passively toward the efficacy of his vocation, contributing nothing as such, only receiving what is impressed upon him from elsewhere. XXIV. In the second act, however, there is some operation of man, and here he also performs his parts, so that he himself acts, believes, and wills rightly; yet in such a way that he perfects all these things in the virtue of the Holy Spirit as the principal mover. He indeed moves himself, but as one who has been moved, and thus he receives all good inclinations from Him, by which he is active (Phil. 2:12-13).</p></blockquote>

</figure><figure class="quote" id="q-7ebc79b998" data-kw="">
<blockquote><p>God does not ravish our wills, but by setting up a sacred light in our understandings, and a sacred power in our wills, He makes our will fit to determine themselves; we do not determine God’s will, nor does God immediately determine our wills, but by infusing a life and soul, as it were, of grace, without precedent preparations often and where there be preparations, yet the first preparation must needs be without a former, we cannot take in anything without a light of grace; but the light of grace, as of glory, must needs be received immediately into the soul. By an habit of grace, deserved for us by Christ, God makes our wills determine themselves to follow Him; and this the Scripture calls, not a forcing, but a drawing of us, not as we draw a man to the gibbet, but as we draw a man to a wedding who has the wedding garment, or as we draw a sheep after us with a bush of ivy, as we draw children after us with nuts and apples, by way of persuasion, indeed, which is so forcible, that Scripture calls it a kind of constraining… The act of knowing works so in clear evidence of the object, that the understanding cannot choose but assent: The act of believing waits upon the will. All this must be received with a grain of salt thus; There is an act of the will to receive grace, which is antecedent to the first infusion of faith, but so as that it is concomitant with it: Antecedent in the first moment of nature, concomitant in the first moment of time, as the wind by blowing opens the window, and the window by opening lets in the wind. This wind which ‘blows as it lists’ (Jn. 3:8), is the voice of the Spirit within (a voice behind us, Isa. 30:20), which knows and tells a man what is in a man…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-capel.html">Richard Capel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tentations: their Nature, Danger, Cure, the Fourth Part</cite>, pp. 38-39 bound in Tentations… sixth edition, the Fourth Part left enlarged (London: Ratcliffe, 1659)</span></figcaption>

<blockquote><p>The traditional Covenanter view of the Old Testament’s penal sanctions is that the majority of them remain binding today, as they have not been abrogated in the New Testament. Samuel B. Wylie, an American Reformed Presbyterian, explains this position below:

It may perhaps be inquired, what are those things which he [the civil magistrate] may lawfully command? To this I answer, he may lawfully command whatever is contained in the constitution prescribed by him whom he represents. Deut. 17:18, we are told what this is, namely, the Divine Law. Whatever penalties are specified in that law, and nowhere either repealed or mitigated, should be duly inflicted, in case of disobedience. Where the law is silent or indefinite, with respect to particular crimes, against any precept of the Decalogue, and the punishment due thereto, great prudence and discretion will be necessary to ascertain whether said crimes are punishable by civil pains, as there are many violations of the moral law to which no particular civil penalty can attach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), p. 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eb2bbeba38" data-kw="">
<blockquote><p>This consideration may be very useful: For it may first serve to be a cure of two great ills in this land: One is of such as conceive that the Law of God, belongs not to Christians; They may as well say that common and natural equity belongs not to Christians. Is it not written in the heart of man by nature? Is it not confirmed by Jesus Christ? Is it not recommended to Christians by the apostles? Is it not established by faith? Is not the observing of it, a testimony of our communion with God? Is not the end of it love from a pure heart, a good conscience, and faith unfeigned? Is it thankfulness to God, because we are delivered from the condemnation, coaction [compulsory force], and rigor of the Law, not to acknowledge the obligation of the Law? Shall not the domestics of the house of God observe the commandments of God, or shall they not be grieved when they transgress and observe them not?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sermon Preached To the Honorable House of Commons, at Their late Solemn Fast, Wed., Dec. 27</cite>, 27 on Ezra 7:23, (1643), p. 30</span></figcaption>

<blockquote><p>2. Nations are bound to frame their constitutions of government; to enact their laws; and to conduct the civil administration, in professed and real obedience to the Scriptures. – National acknowledgment of the Messiah’s authority is not a bare profession. “Not every one that saith, Lord, Lord, shall enter into the kingdom of heaven; but he that doeth the will of my Father which is in heaven,” Matt. vii. 21. Christ’s titles are not mere honorary titles; he is really a king. Submission to his sceptre implies the reception of his law and obedience to its demands.

The laws of Christ are contained in the Bible, and all the laws of the Bible are Christ’s laws. Both the Old and New Testaments are his statute books. Every moral law found there, carries with it an obligation to obedience. And it is the imperative duty of all Christ’s subjects to search, each for himself, the inspired record, that he may ascertain from its pages the principles of righteousness by which his conduct ought to be governed. “Search the Scriptures; – and they are they which testify of me.” As nations are under the government of the Mediator, this obligation rests upon them as well as upon individuals.

And why should not nations seek light from the Bible? The remains of the moral law are very broken and imperfect in the natural man, even in regard to civil duties. Witness the national follies and crimes of the most enlightened pagan nations: to say nothing of the great majority of the inhabitants of those nations that either have not the Bible at all, or have only a closed Bible and who have consequently sunk into the most wretched condition of moral and social debasement. The Bible professes to be a perfect rule. It has been “given by inspiration of God, that the man of God may be perfect; thoroughly furnished unto all good works,” 2 Tim. iii. 16, 17. There is no exception made of civil or political “works.” This gracious revelation finds man in all things wanting such light as will clearly show him the will of God. This it does.

Nor are its teachings confined to the duties of personal religion and those of the domestic and other social relations. The Scriptures abound with instruction respecting matters civil and political. The historical part of the Old Testament, the prophecies, the book of Proverbs and the Psalms, are full of the richest treasures of political wisdom; while the Pentateuch contains a system of laws devised by infinite wisdom for the chosen people of God. Indeed, civil duties occupy as large a space in the Bible as they do in the actual operations of society.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-m-willson.html">J. M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bible Magistracy: or Christ’s Dominion over the Nations: with an Examination of the Civil Institutions of the</cite>, United States (Philadelphia, 1842), pp 47-50.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>[‘Equity’ is] the suitable application of the law to the demands of the situation, in which is seen the law’s will and intention [i.e. the spirit of the law]… or it is the moderating and amendment of the law that comes about from the prudence of the judge accommodating himself to the circumstances of the case, and bending the law to the case, not the case to the law.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8d8408b7a6" data-kw="">
<blockquote><p>2d. You yourself, and, as much as in you lies, all under your authority, must rest upon this day, Exod. xxiii. 12; xxxiv. 21, the space of the whole day of four-and-twenty hours, from all manner of works, except those which have true reference to the present day’s works of piety, mercy, and true necessity, Matt. xii. 1-13, not doing your own ways, not finding your own pleasures, nor speaking your own words Isa. lviii. 13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s daily walk in holy security and peace</cite>, (1627; Philadelphia, 1800), p. 87.</span></figcaption>

</figure><figure class="quote" id="q-13dd471462" data-kw="">
<blockquote><p>By this reckoning, you will tell me, death is a thing to be wished for: and to pass from so much evil, to so much good, a man should (it seemeth) cast away his life. Surely, I fear not, that for any good we expect, we will hasten one step the faster: though the spirit aspire, [t]he body (it draws with it) withdraws it ever sufficiently towards the earth. Yet is it not that I conclude. We must seek to mortify our flesh in us, and to cast the World out of us: but to cast our selves out of the world is in no sort permitted us.

The Christian ought willingly to depart out of this life, but not cowardly to run away. The Christian is ordained by GOD to fight therein: and cannot leave his place without incurring reproach and infamy. But if it please the grand Captain to recall him, let him take the retreat in good part, and with good will obey it. For he is not borne for himself, but for God: of whom he holds his life at farm, as his tenant at will, to yield him the profits. It is in the Land-lord to take it from him, not in him to surrender it, when a conceit takes him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philippe de Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A discourse of life and death</cite>, trans. Countess of Pembroke (1590; London: Mathew Lownes, 1608), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-45f66c372e" data-kw="">
<blockquote><p>…the people’s praying after the minister they say both wastes time, and also makes an unpleasant sound; the Psalms they would not have to be made (as they are) a part of our common [unison] prayer, nor to be said our sung by turns, nor such music to be used with them; those evangelical hymns they allow not to stand in our liturgy; the Litany, the Creed of Athanasius, the sentence of Glory [Gloria Patria] wherewith we use to conclude psalms, these things they cancel, as having been instituted in regard of occasions peculiar to the times of old, and a being therefore no superfluous.</p></blockquote>

</figure><figure class="quote" id="q-50edffc794" data-kw="">
<blockquote><p>Too near to these do they come, who though they do not tie themselves to the very same rites and ordinances, whereto the Jews were bound, yet tread too near upon their heels, and too apishly imitate them: and that in matters about divine Service: as in fair embroidered Copes, and other Ministers-vestments; in high standing Altars; in low cringings and bowings; in turning to the East, as they to the Temple, when they pray; in variety of musical instruments and artificial anthems; in multitude of holy days, with the like; whereof even this Church stood formerly too guilty.

These Jewish Christians do both justify the poor blind Jews, who yet retain as many of the Mosaical Ceremonies as they can (in that Christians have a greater light, the light of the Gospel, to discover unto them the abrogation of that Law, together with the reason thereof) and also doe harden their hearts, and make them bold in cleaving to their Law, when they see such as profess themselves Christians, come so near there unto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The progress of divine providence, set out in a sermon preached in the Abbey Church of Westminster before the House of Peers, on the 24th of September, 1645. being the day of their monthly fast</cite>, (London: Joshua Kirton, 1645), pp 23-24.</span></figcaption>

an-rituals/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

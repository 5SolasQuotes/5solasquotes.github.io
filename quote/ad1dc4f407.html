<main class="wrap"><figure class="quote" id="q-ad1dc4f407" data-kw="">
<blockquote><p>Vers. 32. And the Spirits of the Prophets are subject to the Prophets.

Reason 3. Because the Spirits of the Prophets are to be examined and judged of by the other Prophets, who might afterwards give their opinions concerning those things which were heard, whether anyone hath seasonably interrupted another, and whether it were agreeable to the Word of God, which was delivered by him; and therefore there was no danger, if he that spoke before, should give place to him that modestly interrupted him, and so more might speak in their order.

When he refers to the Prophets, the judging of the Spirit, or the Doctrine which the Prophet utters by the Spirit, he does not exclude Spiritual men, i. e. the other Governors of the Church, who were skilful in spiritual knowledge and judgement, such as all ought to be in an Ecclesiastical Senate: For he commands these, vers. 37. together with the Prophets, or Ministers of the Word, that according to their Ecclesiastical authority, they acknowledge and defend their doctrine in the Church, that according thereunto they would judge and determine concerning those that were disorderly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 64.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

When he refers to the Prophets, the judging of the Spirit, or the Doctrine which the Prophet utters by the Spirit, he does not exclude Spiritual men, i. e. the other Governors of the Church, who were skilful in spiritual knowledge and judgement, such as all ought to be in an Ecclesiastical Senate: For he commands these, vers. 37. together with the Prophets, or Ministers of the Word, that according to their Ecclesiastical authority, they acknowledge and defend their doctrine in the Church, that according thereunto they would judge and determine concerning those that were disorderly.”

<blockquote><p>6. As morality and piety, rightly grounded on evangelical principles, will give the best and greatest security to government, and will lay in the hearts of men the strongest obligations to due subjection: and as the knowledge of these, is most likely to be propagated through a society by the institution of the public worship of the Deity, and of public instruction in morality and religion: therefore, to promote those important purposes, the people of this state have a right to impower, and do hereby fully impower the legislature to authorize form time to time, the several towns, parishes, bodies-corporate, or religious societies within this state, to make adequate provision at their own expense, for the support and maintenance of public protestant teachers of piety, religion and morality:</p></blockquote>

</figure><figure class="quote" id="q-661b9790a3" data-kw="">
<blockquote><p>4. We may add this consideration, that hitherto toleration of errors and diversity of corrupt opinions have ever been looked upon, and made use of, as a most subtle means for undermining and destroying of the Church. It is marked of that skillful enemy of the Kingdom of Jesus Christ, Julian [A.D. 331-363], that having improven his subtilty to the utmost to find out means to destroy the Church by craft, which his predecessors by violence could not obtain, amongst other means he concluded this: Not to raise open persecution but to give liberty to all the differing bishops and teachers (which then, after the Council of Nicea and Constantine’s death, were very many and bitter in their differences) to follow their own way, and to vent their own opinions without all fear of any restraint: and therefore did call them that he might make intimation thereof to them for their further encouragement therein; The words which he used to them, as they are marked by Ammianus and cited by Lodovicus Molineus (p. 560) are: Ut consopitis civilibus discordiis, suae quisque Religioni serviret intrepidus, that is, in sum, That everyone forbearing civil discords, should worship in his own religion without control or fear: And is it like, that this shall prove a mean useful for the good of the Church, which that expert child of the devil did make use of to destroy the same?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, ... (1659), pt. 3, ch. 13, p. 247</span></figcaption>

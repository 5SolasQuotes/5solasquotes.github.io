<main class="wrap"><figure class="quote" id="q-236068a358" data-kw="">
<blockquote><p>Consider that a separation, when not upon clear and just grounds, is a greater sin before God, and more piercing to the heart of Christ, than either murder or adultery, etc. because this is to dissolve the union of his Church and to divide Christian societies. Whosoever shall be found to plead for this, I dare affirm he blows that fire with his breath, which Christ would quench with his blood. My dear friends, weigh seriously, as before the Lord, how Jesus Christ will take it at any man or woman’s hand to tear the commission of any of his ambassadors, whom he will still own as an ambassador, and as negotiating a peace between God and sinners: Sure I need neither tell you that withdrawing from hearing such is a tearing their commission; nor need I tell you that this will be found a sin more hateful and heinous in the sight of Jesus Christ than many others that appear more black.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b2ae994528" data-kw="">
<blockquote><p>And shall we now set up a Church-tyranny, the mere will and abitriment, yea, the unjust sentences of Church-judicatories for laws, and require absolute submission thereunto, not only of private and single persons, but of all inferior judicatories, not allowing the congregational-eldership once to whisper against what is resolved by the presbytery, or the presbytery against what is resolved by the synod, or the synod against what is resolved by the General Assembly. If then the superior judicatories will tyrannize, what remedy is there? or if they become corrupt, how shall the ruin of religion, or the persecution and oppression of these who desire to keep faith and a good conscience, be avoided? Have the Ministers and saints and courts of Jesus Christ received religion and His ordinances upon these terms, that if a superior Court will have it so, they shall all crouch down as asses under the burden, and let them, without gainsaying (they being now cudgeled into silence by a sentence of suspension from the sacrament, or deposition or excommunication) ruin Church, and Ministers, and ordinances, and professors, and all the precious interests of Jesus Christ; And shall we say that such a submission is required in this case, as though they ought to do nothing but weep and pray in secret? How great tyranny is this, and how remedy-less a way to ruin?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie</cite>, … (1658), pp. 113-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>The mean while the enemy came hard to the bridge-end and spoke to us and we to them. They desired us to come over and they would not harm us, and called for Mr. Hamilton to speak with him; so Mr. David Hume went over, and another gentleman with him, and spoke with the duke, and desired his Grace if he would prevent the effusion of blood. He told them, their petition should have been more humbly worded, and said, lay down our arms and come in his mercy, and we should be favourably dealt with: so he returned and told us. When Robert Hamilton heard it, he laughed at it, and said, ‘and [we shall] hang next.&#x27;</p></blockquote>

<blockquote><p>Schism has ever proven exceeding hurtful to the Church, and has been an inlet and nursery to the greatest errors: It is most pressingly condemned in the Scriptures, even with as great weight as corrupt doctrine and heresy are; and it is attributed to that same original, to wit, the flesh, with witchcraft, idolatry, heresy, etc. Gal. 5:20. It has also proven most dangerous to those who have been engaged therein, and often has been a snare to bring on spiritual desertion, deadness of spirit, security, self-confidence, or some other spiritual evils of that kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

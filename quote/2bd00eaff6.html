<blockquote><p>22. They that think that conforming ministers are guilty of great sin must consider what diversity of education, company and interest may do, even on men of conscience, and that we have all our sins. And it’s sinful uncharitableness to think and speak worse of them than they deserve and to talk against all for the faults of some. … 24. The religion that keeps possession of the parish churches¹ will be the national religion: Mourn therefore before God that ever any men professing godliness should either labor to get all sound Protestants to desert the parish churches or that any such have been against the restoring of nonconformists by that called a ‘comprehension’, which was but the withdrawing of such impositions as these very men thought sinful, and all this, lest it should diminish the number and strength of the private churches. By this we see what we are doing against ourselves, if God save us not. ¹ [The Anglican parish churches tended to have a simpler and more plain and Scriptural worship than the cathedral churches of the cities, which had many more human and showy additions. Many of the older non-conformist ministers that separated from the cathedral worship yet would not separate in principle from the parish churches. Baxter was of this mind.] 25. They that say conformists convert no souls take on them to know that of thousands which they know not: and forget that before 1640 there were few but conformists to convert them in the land, and that all the Westminster Assembly, save eight, were such.† And that the parliament kept near 7,000 in the ministry that all conformed on Aug. 24, 1662.²</p></blockquote>

</figure><figure class="quote" id="q-3eb42af139" data-kw="">
<blockquote><p>The Divine worship includes not only sacrifices and the like, which seem to be directed to God immediately, but also those things whereby His worshippers are duly prepared to worship Him: thus too in other matters, whatever is preparatory to the end comes under the science whose object is the end. Accordingly those precepts of the Law which regard the clothing and food of God’s worshippers, and other such matters, pertain to a certain preparation of the ministers, with the view of fitting them for the Divine worship: just as those who administer to a king make use of certain special observances. Consequently such are contained under the ceremonial precepts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 2, pt. 1, Question 101, ‘Of the Ceremonial Precepts in Themselves’, Article 1, ‘Whether the nature of the ceremonial precepts consists in their pertaining to the worship of God?’, Reply to Objection 1. While Aquinas’s teaching can be taken too far, as Romanists have taken it in setting apart as holy the many various instruments involved with the mass, yet there is an aspect of truth in the teaching.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

ncludes%20not%20only,are%20contained%20under%20the%20ceremonial%20precepts." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a0e52f9b0e" data-kw="">
<blockquote><p>‘Yea, but’ (say they) ‘our ceremonies are typical and Jewish ceremonies, which hurt our worship.’ They mean (as I conceive) they are teaching ceremonies, not ceremonies of mere order, but significant, to put us in mind of duty. I am sorry that this should be accounted a fault. If they did not signify, how could they edify? (1 Cor. 14:26) Were they types and shadows of the mysteries of the Gospel invented by men, indeed Christ were ill-advised not to ordain them. But being only moral documents and monitors of some duties, I wonder where their guilt lies. If I had an hundred boxes in my house for my uses, and some few of them had a mark upon them to direct me where my money lay, that I might be careful of that, does this savor of want of natural wisdom? So neither does it taste of want of spiritual wisdom to set a mark upon some few ceremonies, to put me in mind of my duty to Christ. ‘What are these’ (say they) ‘but images set up to ourselves for religious use?’ What? to worship? to adore God in or by? No, but to remind us of what we ought to do. And this was the practice of the Church in all ages: Abraham put his servant’s hand under his thigh in swearing, surely to signify his subjection to him in that business about the promised seed (Gen. 24:2). Moses set up an altar when Amalek was overthrown and called it Jehovah-Nissi, to signify that the Lord was their banner (Ex. 17:15). The two tribes and a half built an altar, not to distinguish their borders, but to signify that they were God’s people and that they had all one God, to whom they and their posterity must sacrifice upon his own altar (Josh. 22:24–35). Samuel set up a stone when the Philistines were discomfited and called it Eben-Ezer, to signify that the Lord helped them (1 Sam. 7:12). When Christ the truth was come, he used human significant ceremonies, as the feast of dedication (John 10:22), sitting at the Passover—a sign of rest (Matt. 26:20)—the water pots of the Jewish purifications (John 2:6), the custom of embalming (John 19:39–40), besides other formalities of the synagogue. (Lk. 4:17-20) The Corinthians had the women’s veil in the congregation, to signify subjection (1 Cor. 11:5–6), and the kiss of peace to signify love (Rom. 16:20; 2 Pet. 2:11). Other Christians had agapae [love-feasts] at the sacrament (Jude), in the room whereof the Christians’ offertory was brought in for pious uses, to signify that love they should have one to another. So we have standing at the Belief [Apostles’ Creed], to signify that it is not a prayer and that we are ready to confess our faith; kneeling at the commandments, to signify the honor we have to that God that gave it, and that we must be ready to dart up prayer for our obedience; and kneeling at the sacrament, to signify an humble acknowledgment of God’s love for so great a benefit. And do we and all these saints before us set up images to ourselves in these ceremonies for religious use? God forbid. The practice of these saints, when the laws of God were purely taught and kept, teaches us that though we may not set up an image to worship God by or in, yet may we set up some edifying signs to put us in mind of those duties we owe to God (1 Cor. 14): The patriarchs may build altars, give their children proper names to be admonishing signs of their duties to God; and we may set all our senses on work that way. We may set up a post in a dark and dangerous passage, that when I go that way and touch it, it may signify my danger, and I may avoid it. I may set a watchman in a tower to give a sound when the enemy comes, that he may signify my enemy’s approach, and I may avoid him. I may set up a sea mark to signify a rock near, that I split not upon it. And may not we be as wise for our souls as for our bodies? God forbid. I am sure He has nowhere forbidden it. Therefore it is not against Christ. If it be not against Him, it is for Him, says our Savior (Mk. 9:40).</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“‘Yea, but’ (say they) ‘our ceremonies are typical and Jewish ceremonies, which hurt our worship.’ They mean (as I conceive) they are teaching ceremonies, not ceremonies of mere order, but significant, to put us in mind of duty. I am sorry that this should be accounted a fault. If they did not signify, how could they edify? (1 Cor. 14:26) Were they types and shadows of the mysteries of the Gospel invented by men, indeed Christ were ill-advised not to ordain them. But being only moral documents and monitors of some duties, I wonder where their guilt lies. If I had an hundred boxes in my house for my uses, and some few of them had a mark upon them to direct me where my money lay, that I might be careful of that, does this savor of want of natural wisdom? So neither does it taste of want of spiritual wisdom to set a mark upon some few ceremonies, to put me in mind of my duty to Christ. ‘What are these’ (say they) ‘but images set up to ourselves for religious use?’ What? to worship? to adore God in or by? No, but to remind us of what we ought to do. And this was the practice of the Church in all ages: Abraham put his servant’s hand under his thigh in swearing, surely to signify his subjection to him in that business about the promised seed (Gen. 24:2). Moses set up an altar when Amalek was overthrown and called it Jehovah-Nissi, to signify that the Lord was their banner (Ex. 17:15). The two tribes and a half built an altar, not to distinguish their borders, but to signify that they were God’s people and that they had all one God, to whom they and their posterity must sacrifice upon his own altar (Josh. 22:24–35). Samuel set up a stone when the Philistines were discomfited and called it Eben-Ezer, to signify that the Lord helped them (1 Sam. 7:12). When Christ the truth was come, he used human significant ceremonies, as the feast of dedication (John 10:22), sitting at the Passover—a sign of rest (Matt. 26:20)—the water

<blockquote><p>Possibly also union in fundamental things, being accorded unto, it may make way for moderating affections in other things less fundamental. This method was ever urged by Bucer, Beza and other Reformers, who keeped conferences at first with the Lutheran party…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-12a7c3447d" data-kw="">
<blockquote><p>The most significant attempts to overcome religious division between the old church and those desiring reformation were those colloquies that the emperor called at the level of the Holy Roman Empire of the German Nation. They took place in a twenty-year period beginning in 1540. Thereafter this type of imperial colloquy faded because the Religious Peace of Augsburg (1555) guaranteed adherents of the Augsburg Confession legal protection within the boundaries of their own territories. This essentially rendered further Catholic-Evangelical colloquies superfluous.</p></blockquote>

</figure><figure class="quote" id="q-6dbb8b038c" data-kw="">
<blockquote><p>Tota ratio Schismatis, the very essence of a schism consists in the separating from the Church, I say, from the true and orthodoxal Church. It is a renting or dissolving of that unity which ought to be amongst Christians; See Mr. [Stephen] Marshall’s Sermon on Rom. 12:4-5. It was a memorable speech of Calvin, who said he would willingly travel all over the seas and countries in the world to put an end to the differences that were in the Reformed Churches. [John] Cameron well distinguishes of a double schism: 1. Negative, which is a bare secession or subduction, and is unlawful. Non separatio sed causa facit Schismaticum [Not the separation but the cause that makes the schismatic]. Cassander. 2. Positive, when there is a certain consociation, which uses ecclesiastical laws, the Word of God and administration of the sacraments separatim [in a separated way], which he calls setting up an altar against an altar; this is called schism Antonomastic [Greek], and [Greek], says he [in] De Ecclesia. Different forms of Churches and Church-government in one state must needs lay a foundation of strife and division therein. It is no wisdom (says Mr. [John] Dury in a letter [about congregationalists]) in a state, to reject an approved way of government, which all the best reformed Churches have received all this while, and acknowledged to be God’s way, and by experience found to be safe, sound; and instead of it to take up another, which it is not yet known what it is, nor was ever tried but in two or at the most three churches, and that for the space of a few years. The slighter the cause of separation, the greater the fault of schism; when men hold the same Faith and orthodox truths, yet separate for lesser matters. The true saints in the 7 Churches of the Revelation were never bid go out of them though they were very corrupt, as they were out of Babylon, Mr. [Richard] Vines. The first separatist in the Scripture (says one) was Cain, Gen. 4:16. Enforcements to love are clear, 1 Cor. 13:1. That question of Separation in Scripture is dark. See Mr. [George] Gillespie, Miscellaneous Questions, ch. 10 and 15, and Mr. [Thomas] Manton on James 3. 17. Schisma est secessio in religionis negotio vel temeraria vel injusta, Cameron, De Ecclesia. Schism is a causeless separation from external communion with any true Church of Christ: Mr. [John] Ball, Against Separation, ch. 8. Schism is a breach of the unity of the Church. Dr. Field, bk. 3, Of the Church, ch. 5. We do not leave communion of true Churches for corruptions and sins, but only abstain from the practice of evil in our own persons, and witness against it in others, still holding communion with the Churches of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity... (London: A.M., 1654), bk. 4, ch. 22, ‘Schism’</cite>, pp. 376-77</span></figcaption>

</figure><figure class="quote" id="q-13cadfdfe6" data-kw="">
<blockquote><p>To conclude this, separation from Churches, from which Christ does not separate, is schismatical; now it’s clear in the Scripture that Christ owns churches where faith is sound for the substance, and their worship, Gospel-worship, though there be many defects and sinful mixtures among them. And what I have said concerning the schismaticalness of separation because of the sinful mixtures of those who are wicked in practice, is as true concerning separation from them who are erroneous in judgment; if the errors of those from whom the separation is made, be not fundamental, and hinder communion with Christ the head. And much more clear (if clearer can be) is the schismaticalness of those who separate from and renounce all communion with those churches which are not of their own manner of constitution and modelled according to the platform of their own particular church-order. To refrain fellowship and communion with such Churches who profess Christ their Lord, whose faith is sound, whose worship is Gospel-worship, whose lives are holy, because they come not into that particular way of church-order which we have pitched upon, is a schismatical rending of the Church of Christ to pieces… Herein likewise those separatists among ourselves are heinously faulty who censure and condemn all other churches, though their faith, worship and conversation be never so scriptural, merely because they are not gathered into church order according to their own patterns. In Scripture, Churches are commended and dignified, according as their fundamental faith was sound and their lives holy; not according to the regularity of their first manner of gathering.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude... (London: Maxey, 1654), on verse 19, Observations</cite>, p. 593</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-1bbdab7c77" data-kw="">
<blockquote><p>As they that affect alienation from others make their differences as great and the adverse opinion or practice as odious as they can, thereby to further their desired victory over them and to harden themselves and their side against them: So on the contrary, they who desire peace and accord both interpret things in the best part that reasonably they can and seek how and where they may find any lawful door of entry into accord and agreement with others.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“As they that affect alienation from others make their differences as great and the adverse opinion or practice as odious as they can, thereby to further their desired victory over them and to harden themselves and their side against them: So on the contrary, they who desire peace and accord both interpret things in the best part that reasonably they can and seek how and where they may find any lawful door of entry into accord and agreement with others.”

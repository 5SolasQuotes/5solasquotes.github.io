<main class="wrap"><figure class="quote" id="q-630b9d1cd4" data-kw="">
<blockquote><p>[Error:] To cry down the very being and use of these external ordinances as being but forms, and the spiritual frame of the heart is made all in all. Thus there are blasphemous heretics that cry down the sacraments, the ministry, yea, the Scripture itself, yea Christ Himself, as being but forms, and we ought to have communion with God immediately. But it is elsewhere to be showed that Christ has appointed an external form of communion in his Church, which consists in reading, and preaching of the Word, administration and receiving of sacraments, prayer, and Church-government and censures, with a ministry from Him, all which are of a perpetual institution for the substantials of them, and to cry down these forms which God has appointed as means to beget and increase grace, which are in the gracious use of them a solemn acknowledging and owning of God, is a Beelzebub error as I may so say and a false doctrine in the first magnitude: we are therefore to sail between these extremes neither resting upon externals in religion, as enough without Christ and regeneration, or on the contrary abolishing and neglecting the use of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652), section 3, sermon 19, p. 105</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

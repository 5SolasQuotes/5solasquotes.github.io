<main class="wrap"><figure class="quote" id="q-38aa99d363" data-kw="">
<blockquote><p>Furthermore, those who, having forsaken Scripture, imagine some way or other of reaching God, ought to be thought of as not so much gripped by error as carried away with frenzy. For of late, certain giddy men have arisen who, with great haughtiness exalting the teaching office of the Spirit, despise all reading and laugh at the simplicity of those who, as they express it, still follow the dead and killing letter.1 But I should like to know from them what this spirit is by whose inspiration they are borne up so high that they dare despise the Scriptural doctrine as childish and mean. For if they answer that it is the Spirit of Christ, such assurance is utterly ridiculous. Indeed, they will, I think, agree that the apostles of Christ and other believers of the primitive church were illumined by no other Spirit. Yet no one of them thence learned contempt for God’s Word; rather, each was imbued with greater reverence as their writings most splendidly attest. And indeed it had thus been foretold through the mouth of Isaiah. For where he says, “My Spirit which is in you, and the words that I have put in your mouth, will not depart from your mouth, nor from the mouth of your seed … forever” [Isa. 59:21 p., cf. Vg.], he does not bind the ancient folk to outward doctrine as if they were learning their ABC’s; rather, he teaches that under the reign of Christ the new church will have this true and complete happiness: to be ruled no less by the voice of God than by the Spirit. Hence we conclude that by a heinous sacrilege these rascals tear apart those things which the prophet joined together with an inviolable bond. Besides this, Paul, “caught up even to the third heaven” [2 Cor. 12:2], yet did not fail to become proficient in the doctrine of the Law and the Prophets, just as also he urges Timothy, a teacher of singular excellence, to give heed to reading [1 Tim. 4:13]. And worth remembering is that praise with which he adorns Scripture, that it “is useful for teaching, admonishing, and reproving in order that the servants of God may be made perfect” [2 Tim. 3:16–17]. What devilish madness is it to pretend that the use of Scripture, which leads the children of God even to the final goal, is fleeting or temporal? Then, too, I should like them to answer me whether they have drunk of another spirit than that which the Lord promised his disciples. Even if they are completely demented, yet I do not think that they have been seized with such great dizziness as to make this boast. But in promising it, of what sort did he declare his Spirit would be? One that would speak not from himself but would suggest to and instill into their minds what he had handed on through the Word [John 16:13]. Therefore the Spirit, promised to us, has not the task of inventing new and unheard-of revelations, or of forging a new kind of doctrine, to lead us away from the received doctrine of the gospel, but of sealing our minds with that very doctrine which is commended by the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion, trans. Ford Lewis Battles, The Library of Christian Classics (Louisville, KY: Westminster John Knox Press, repr. 2011), 1.9.1.</cite></span></figcaption>

<blockquote><p>Not only the covetous, but the unclean, are idolaters; for the apostle, who here makes covetousness to be idolatry, counts voluptuous persons idolaters also, where he speaks of some who make their belly their God, Philip. 3. Indeed, every reigning lust is an idol, and every person in whom it reigns is an idolater. ‘The lust of the flesh, the lust of the eye, and the pride of life,’ i.e. pleasures, and riches, and honours, are the carnal man’s trinity, the three great idols of worldly men, to which they prostrate their souls; and giving that to them which is due only to God, they hereby become guilty of idolatry.… Idolatry is … to give that honour and worship to the creature which is due only to God.… Now this worship due to God only is not only given by heathens to their false gods, and by papists to angels, saints, images, &amp;c., but also by carnal men to their lusts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (Practical Works)</span></figcaption>

<blockquote><p>Q. 11. Is all use of images unlawful? A. God did so much hate idolatry and the neighborhood of the idolaters made it so dangerous to the Israelites that He did not only forbid the worshipping of images, but all such making or using of them as might become a snare or temptation to any. So that though it be lawful to make images for civil uses, and when they are made, to fetch holy thoughts or meditation from them, as from all other creatures or things in the world, yet in any case when they become a snare or danger (being not necessary things, they become a sin to those that so use them as [a] snare to others or themselves. Ex. 34:13-15; Num. 33:52; Dt. 7:2; Kn. 11:18 &amp; 23; 14:24. Q. 12. Is it lawful to make any picture of God? A. No: for pictures are the signs of corporeal things, and it is blasphemy to think God like a bodily substance: But it is lawful to make such pictures (as of a glorious light) from which occasion may be taken of good thoughts concerning God. Ex. 25:18, 1•… 20; 1 Sam. 4:4; Ps. 18:1; Eze. 10:2. Q. 13. Is it lawful to make the picture of Christ as man, or as crucified? A. The doing it as such is not forbidden, nor the right use of it when done: But the abuse, i.e. the worshipping of it or of Christ by it, is forbidden and the making or using such when it tends to such abuse and has more of snare than profit.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“Q. 11. Is all use of images unlawful? A. God did so much hate idolatry and the neighborhood of the idolaters made it so dangerous to the Israelites that He did not only forbid the worshipping of images, but all such making or using of them as might become a snare or temptation to any. So that though it be lawful to make images for civil uses, and when they are made, to fetch holy thoughts or meditation from them, as from all other creatures or things in the world, yet in any case when they become a snare or danger (being not necessary things, they become a sin to those that so use them as [a] snare to others or themselves. Ex. 34:13-15; Num. 33:52; Dt. 7:2; Kn. 11:18 &amp; 23; 14:24. Q. 12. Is it lawful to make any picture of God? A. No: for pictures are the signs of corporeal things, and it is blasphemy to think God like a bodily substance: But it is lawful to make such pictures (as of a glorious light) from which occasion may be taken of good thoughts concerning God. Ex. 25:18, 1•… 20; 1 Sam. 4:4; Ps. 18:1; Eze. 10:2. Q. 13. Is it lawful to make the picture of Christ as man, or as crucified? A. The doing it as such is not forbidden, nor the right use of it when done: But the abuse, i.e. the worshipping of it or of Christ by it, is forbidden and the making or using such when it tends to such abuse and has more of snare than profit.”

— Richard Baxter, The Catechizing of Families, a Teacher of Householders how to Teach their Households (London: Parkhurst, 1683), ch. 35, ‘Of the Second Commandment’, pp. 256-57">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQ.+11.+Is+all+use+of+images+unlawful%3F+A.+God+did+so+much+hate+idolatry+and+the+neighborhood+of+the+idolaters+made+it+so+dangerous+to+the+Israelites+that+He+did+not+only+forbid+the+worshipping+of+images%2C+but+all+such+making+or+using+of+them+as+might+become+a+snare+or+temptation+to+any.+So+that+though+it+be+lawful+to+make+images+for+civil+uses%2C+and+when+they+are+made%2C+to+fetch+holy+thoughts+or+meditation+from+them%2C+as+from+all+other+creatures+or+things+in+the+world%2C+yet+in+any+case+when+they+become+a+snare+or+danger+%28being+not+necessary+things%2C+they+become+a+sin+to+those+that+so+use+them+as+%5Ba%5D+snare+to+others+or+themselves.+Ex.+34%3A13-15%3B+Num.+33%3A52%3B+Dt.+7%3A2%3B+Kn.+11%3A18+%26+23%3B+14%3A24.+Q.+12.+Is+it+lawful+to+make+any+picture+of+God%3F+A.+No%3A+for+pictures+are+the+signs+of+corporeal+things%2C+and+it+is+blasphemy+to+think+God+like+a+bodily+substance%3A+But+it+is+lawful+to+make+such+pictures+%28as+of+a+glorious+light%29+from+which+occasion+may+be+taken+of+good+thoughts+concerning+God.+Ex.+25%3A18%2C+1%E2%80%A2%E2%80%A6+20%3B+1+Sam.+4%3A4%3B+Ps.+18%3A1%3B+Eze.+10%3A2.+Q.+13.+Is+it+lawful+to+make+the+picture+of+Christ+as+man%2C+or+as+crucified%3F+A.+The+doing+it+as+such+is+not+forbidden%2C+nor+the+right+use+of+it+when+done%3A+But+the+abuse%2C+i.e.+the+worshipping+of+it+or+of+Christ+by+it%2C+is+forbidden+and+the+making+or+using+such+when+it+tends+to+such+abuse+and+has+more+of+snare+than+profit.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Catechizing+of+Families%2C+a+Teacher+of+Householders+how+to+Teach+their+Households+%28London%3A+Parkhurst%2C+1683%29%2C+ch.+35%2C+%E2%80%98Of+the+Second+Commandment%E2%80%99%2C+pp.+256-57&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F53cb2189a

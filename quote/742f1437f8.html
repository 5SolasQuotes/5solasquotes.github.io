<main class="wrap"><figure class="quote" id="q-742f1437f8" data-kw="prayers for the dead">
<blockquote><p>Indeed it has been found by experience that from insignificant beginnings wonderful progress was made in superstition and idolatry in the the papacy as to the worship of images, invocation of saints, purgatory, the sacrifice of the mass, prayers for the dead, etc. Thus it seems better to lack some useful good (but less necessary), than from the use of it to incur the imminent danger of any great evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2371fe68a6" data-kw="limbo">
<blockquote><p>Still it must be confessed that others are not so rigid, but allow certain exceptions. First, that this necessity had a place only after the death of Christ and from the day of Pentecost. Again, the baptism of water could be supplied by the desire for it or by martyrdom. Hence the Council of Trent utters an anathema against those “who say that without the sacraments, or a desire for them, men receive the grace of justification by faith alone” (Session 7, Canon 4, Schroeder, p. 52).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19</span></figcaption>

</figure><figure class="quote" id="q-d6582df282" data-kw="">
<blockquote><p>If it is perfectly clear, from what was lately said, that the blood of Christ is the only satisfaction, expiation, and cleansing for the sins of believers, what remains but to hold that purgatory is mere blasphemy, horrid blasphemy against Christ?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.5.6</span></figcaption>

</figure><figure class="quote" id="q-462475d23c" data-kw="">
<blockquote><p>To say nothing of these abominations, who taught the Pope to enclose the grace of Jesus Christ in lead and parchment, grace which the Lord is pleased to dispense by the word of the Gospel?</p></blockquote>

</figure><figure class="quote" id="q-1b5846db12" data-kw="">
<blockquote><p>We prove the vanity of this fiction in this way. First, because scripture teaches that the faithful (for whom they want Purgatory to be constructed) pass from here through death into eternal life. John 5:24 — &quot;Whoever hears my word and believes him who sent me has eternal life and will not come under judgment but has passed from death to life.&quot; Therefore they do not come into the judgment of Purgatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thesis on Purgatory</cite>, p. 1</span></figcaption>

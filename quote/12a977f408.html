<main class="wrap"><figure class="quote" id="q-12a977f408" data-kw="">
<blockquote><p>Yet know and consider that God’s power in thus abandoning all mankind for their sin in Adam is far inferior to that power He showed in cruciating his own Son, his most innocent and holy Son, in making his soul an offering for our sin. And that God has power, not only to annihilate the holiest (which is without all question), but to inflict upon him any pain. Medina is bold to profess, Ex concordi omnium theologorum sententia [according to the harmonious judgment of all theologians]; And Vasques the Jesuit acknowledges as much, though herein, they say, He should not cary himself as Judex [a Judge], but as Dominus vitae et mortis [the Lord of life and death].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Synod of Dort &amp; Arles Reduced to the Practice</cite>, … (Amsterdam: Thorp, 1631), pt. 1, 1st section, p. 50</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a4cc6d4d11" data-kw="">
<blockquote><p>If by ‘thinking’ we mean the capacity for what Bermudez calls direct belief modification, goal-desires, simple seeing, dispositions to form beliefs about things of a general type, and so forth, then non-linguistic animals are capable of thinking. But all of this falls within the range of capacities made possible by what Aristotelians traditionally call the ‘internal senses’. It doesn’t follow that non-linguistic animals are capable of what Bermudez calls second-order cognition, higher-order desires, the attribution to others of propositional attitudes, reflective belief modification, a grasp of compound, modal, tensed and general propositions, situation-desires and epistemic seeing, and so forth… If that is the sort of thing we mean by ‘thinking,’ then there is good reason to conclude that non-linguistic animals are not capable of thinking… Karl Popper drew a distinction between four main functions of language. The first is the expressive function, which involves the outward expression of an inward state… The second is the signaling function, which adds to the expressive function the generation of a reaction in others. Popper compares it to the dange signals an animal might send out in order to alert other animals… The third is the descriptive function, which involves the expression of a proposition, something that can be either true or false… The fourth is the argumentative function, which involves the expression of an inference from one or more propositions to another in a manner that can be said to be either valid or invalid… While the most primitive animals may be incapable of behavior that performs even the first two of these functions, there are also obviously animals that can perform them, and in that sense they can be said to have language. But… [this] does not entail being capable of the descriptive and argumentative functions… Whether animals lacking that particular sort of language, can be said to think in the sense of entertaining concepts, propositions, and logical inferences… the answer must be in the negative.</p></blockquote>

</figure><figure class="quote" id="q-acb4331d2b" data-kw="">
<blockquote><p>One one version [of traducianism], the soul derives form the bodies of the parents. But it is at best difficult to ee how something incorporeal could arise from something corporeal… The other way to interpret traducianism is to hold that the oul derives from the souls of the parents… But it faces another problem. Again, for the reasons considered in chapter 8, the soul is simple or without parts. So how can one’s soul come from the souls of one’s parents? That would seem to require that a part of one’s fatehr’s soul and a part of one’s mother’s soul be passed down to their offspring. But, again, souls do not have parts. It would also seem to require that those parts be combined in order to make up the soul of the child. But souls cannot be made up of parts, because, once again, they lack parts. So it seems that traducianism, on either interpretation, fails. Creationism is the alternative view that… God and the parents together produce the new human being… …Hence, suppose that the existence of God can be independently established… Suppose it can also be established that only God can create something ex nihilo. And suppose that… it can be established that there is no way in principle for a soul to come into being except by being created ex nihilo. Then the appeal to divine action [in creating the soul] will by no means be either ad hoc or a “God of the gaps” explanation. It will be the only possible explanation. My own view is that it is indeed the only possible explanation.</p></blockquote>

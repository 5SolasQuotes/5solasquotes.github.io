<main class="wrap"><figure class="quote" id="q-553bd25b66" data-kw="">
<blockquote><p>The reception of that gift is faith: faith means not doing something but receiving something; it means not the earning of a reward but the acceptance of a gift. A man can never be said to obtain a thing for himself if he obtains it by faith; indeed to say that he obtains it by faith is only another way of saying that he does not obtain it for himself but permits another to obtain it for him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What Is Faith?</cite>, ch. 7</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e5e27610a2" data-kw="">
<blockquote><p>In the conversion of a man there is no concurrence of the powers of free arbitrium. But at the first moment of it man and his will act in a purely passive state. Here we are speaking of the first impulse and moment of conversion, or the first beginning of this movement, in which acknowledging his sins man turns to God. And this first beginning, we assert, does not depend on the natural strength of the will, but is the beginning of grace alone, according to the express testimonies of Scripture, Col. 2:13 (and you being dead through your trespasses and the uncircumcision of your flesh, you, I say, he did quicken together with him, having forgiven us all our tresspasses), where it is said that men are dead in sins… Yet at the very moment in which God effects in us the grace of conversion He also bends man’s will to desire and seek for that grace, and so in the progress of conversion the will co-operates with divine grace.</p></blockquote>

<blockquote><p>But regeneration occurs, by faith, in repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apology of the Augsburg Confession</cite>, Trans. F. Bente &amp; W. H. T. Dau (1531; Project Gutenberg, 2004) | pt. 10</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But regeneration occurs, by faith, in repentance.”

— Philip Melanchthon, Apology of the Augsburg Confession Trans. F. Bente &amp; W. H. T. Dau (1531; Project Gutenberg, 2004) | pt. 10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+regeneration+occurs%2C+by+faith%2C+in+repentance.%E2%80%9D%0A%0A%E2%80%94+Philip+Melanchthon%2C+Apology+of+the+Augsburg+Confession+Trans.+F.+Bente+%26+W.+H.+T.+Dau+%281531%3B+Project+Gutenberg%2C+2004%29+%7C+pt.+10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe97f0b5b54.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e97f0b5b54.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-being-born-again-as-subsequent-to-faith-in-receiving-christ-the-fullness-of-life-by-faith/#:~:text=But%20regeneration%20occurs%2C%20by%20faith%2C%20in%20repentance" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2f8de45373" data-kw="">
<blockquote><p>Synonyms [of regeneration] more properly signifying are: … II. Conversion. This word sometimes denotes the act of God alone; sometimes the complete act of God and man; sometimes the formal act of man, so that it is of the same notion as the word penitence and repentance. The first signification looks to the act of first or preventing grace, and properly pertains here and makes a synonym of regeneration. In the Pelagian controversies concerning grace and free will, such conversion is wont to be called by theologians the first moment of conversion, where man conducts himself purely passively. The second signification looks to the act of God’s second grace, by which man, instructed and informed through preventing or first grace with a new habitual principle of spiritual life impressed by the omnipotent facility of God, is premoved and excited by God to perform acts and to actually elicit acts of spiritual life, or of repentance and faith, Jer. 31:18; Song 1:4. The third signification properly looks to the act of man. For man is the proper and formal principle of actual penitence or repentance, of conversion from his sin—not God, who is the effective principle. For He Himself does not do, so as to be that proper and particular cause (which, for example, is Peter repenting), that is, He does not grieve, does not repent, does not weep bitterly, does not die to sin, does not rise to new life; but He makes us to do, as Augustine speaks. We ourselves therefore do those things, but not of ourselves—as I remember reading that distinction in the homilies of Ardentius Pictaviensis [Ardent of Poitiers]. … II. Sometimes it [‘regeneration’] denotes: 1. The first impression of the new creature, or the change from non-being to spiritual being. 2. Its conservation, continuation, and augmentation. 3. Its instauration and renovation. 4. Its consummation and final perfection. … As for regeneration or conversion in the second moment, it can be analogically conceived thus: I. The one generating is the Holy Spirit through second grace as through a plastic power. II. The matter of generation and seed is the new creature implanted in the first moment of regeneration, from which those acts are elicited. III. The form is the second act of faith, which as it were actuates and πληροῖ [plēroi, fills/fulfills] that seed of regeneration. IV. Preparatory dispositions are certain acts of repentance preceding faith. V. Mixture is the actual union of faith with the promises of the Gospel, Heb. 4:2. VI. Animation of the fetus, or introduction of the form, is when by actual faith Christ is applied for justification. VII. The first thing emanating from the form now introduced, or the elicited act, is the reflexive act of faith. VIII. To which follows the impetrated act: namely, the ἐνέργεια [energeia, energy/activity] of charity. IX. The process and succession of acts which dispose to the production of the first actual faith nearly holds itself as that of the human fetus, which, although the rational soul infused is specific, by which the vegetative and sensitive are contained (in the same way as the binary is in the ternary and the triangle in the quadrangle), yet man first lives the life of a plant, then of an animal, then of a man. So faith, although it is the first act of the new creature, indeed as it were the radical principle of the whole new creature, yet its second act, at least the complete and formed or sensible one, is exercised nearly among the last.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology</span></figcaption>

+or+sensible+one%2C+is+exercised+nearly+among+the+last.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Disputation+29%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+1+%281639%29+tr.+AI+by+Roman+Prestarri+in+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+pp.+432-65+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2f8de45373.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2f8de45373.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=Synonyms%20%5Bof%20regeneration%5D%20more%20properly%20signifying,is%20exercised%20nearly%20among%20the%20last&amp;text=Synonyms%20%5Bof%20regeneration%5D%20more%20properly%20signifying%20are&amp;text=sensible%20one%2C%20is%20exercised%20nearly%20among%20the%20last" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-864c580f03" data-kw="">
<blockquote><p>Fourthly, does she lean upon God before she can come? must He work the first motion to make her willing, before she can believe in Him? Then how are those to be here reproved that would make man’s will to be the author of its first motions unto God. Pelagius was a great defender of it… Lastly, he would maintain (and the Arminians still from him) that grace did indeed help a good work, but it had its first motion from our wills, or at least might have; and the will had a negative voice, and might resist and cross grace which did not work irresistibly in the soul, to force the soul to Him. … Does God move the will attending Him in duties, first? Secondly, when the will is thus moved, does it then come? when it is drawn, does it run? Then this reproves the Enthusiasts of old, the Anabaptists, Antinomians, Seekers of our days, that hold, first, there is no need of duties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved, wherein is laid down the soul’s glory in Christ and the way by which the soul comes to Christ, delivered in two lecture sermons</cite>, … (London: 1646), pp. 62-63</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Fourthly, does she lean upon God before she can come? must He work the first motion to make her willing, before she can believe in Him? Then how are those to be here reproved that would make man’s will to be the author of its first motions unto God. Pelagius was a great defender of it… Lastly, he would maintain (and the Arminians still from him) that grace did indeed help a good work, but it had its first motion from our wills, or at least might have; and the will had a negative voice, and might resist and cross grace which did not work irresistibly in the soul, to force the soul to Him. … Does God move the will attending Him in duties, first? Secondly, when the will is thus moved, does it then come? when it is drawn, does it run? Then this reproves the Enthusiasts of old, the Anabaptists, Antinomians, Seekers of our days, that hold, first, there is no need of duties.”

— John Collinges, The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved, wherein is laid down the soul’s glory in Christ and the way by which the soul comes to Christ, delivered in two lecture sermons… (London: 1646), pp. 62-63">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFourthly%2C+does+she+lean+upon+God+before+she+can+come%3F+must+He+work+the+first+motion+to+make+her+willing%2C+before+she+can+believe+in+Him%3F+Then+how+are+those+to+be+here+reproved+that+would+make+man%E2%80%99s+will+to+be+the+author+of+its+first+motions+unto+God.+Pelagius+was+a+great+defender+of+it%E2%80%A6+Lastly%2C+he+would+maintain+%28and+the+Arminians+still+from+him%29+that+grace+did+indeed+help+a+good+work%2C+but+it+had+its+first+motion+from+our+wills%2C+or+at+least+might+have%3B+and+the+will+had+a+negative+voice%2C+and+might+resist+and+cross+grace+which+did+not+work+irresistibly+in+the+soul%2C+to+force+the+soul+to+Him.+%E2%80%A6+Does+God+move+the+will+attending+Him+in+duties%2C+first%3F+Secondly%2C+when+the+will+is+thus+moved%2C+does+it+then+come%3F+when+it+is+drawn%2C+does+it+run%3F+Then+this+reproves+the+Enthusiasts+of+old%2C+the+Anabaptists%2C+Antinomians%2C+Seekers+of+our+days%2C+that+hold%2C+first%2C+there+is+no+need+of+duties.%E2%80%9D%0A%0A%E2%80%94+John+Collinges%2C+The+Spouse%E2%80%99s+Hidden+Glory+%26+Faithful+Leaning+upon+her+Well-Beloved%2C+wherein+is+laid+down+the+soul%E2%80%99s+glory+in+Christ+and+the+way+by+which+the+soul+comes+to+Christ%2C+delivered+in+two+lecture+sermons%E2%80%A6+%28London%3A+1646%29%2C+pp.+62-63&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F864c580f03.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/864c580f03.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=Fourthly%2C%20does%20she%20lean%20upon%20God,there%20is%20no%2

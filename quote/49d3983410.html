<main class="wrap"><figure class="quote" id="q-49d3983410" data-kw="unconditional election good pleasure">
<blockquote><p>Election was made from God’s mere good pleasure; therefore, not on account of Christ [as antecedent cause] because good pleasure excludes every cause out of God upon which election may depend. … “That the purpose of God according to election might stand, not of works, but of him that calleth” (Rom. 9:11); “It is not of him that willeth, nor of him that runneth, but of God that sheweth mercy” (Rom. 9:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.10.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a> › <a href="../topics/election/nature-of-election/unconditional.html">Unconditional</a></span><span class="t"><a href="../topics/election/conditional-election.html">Conditional Election</a> › <a href="../topics/election/conditional-election/faith-the-fruit-not-the-cause-of-election.html">Faith the fruit, not the cause, of election</a></span></div>

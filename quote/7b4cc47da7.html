<main class="wrap"><figure class="quote" id="q-7b4cc47da7" data-kw="">
<blockquote><p>This position has been also handled and proved abundantly by others, chiefly by Mr. Cawdrey and Mr. Pynchon, whose arguments I judge unanswerable. ‘Tis to me an unquestionable conclusion that the Sabbath, being a natural day consisting of 24 hours, it must begin and end as the natural day itself does.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-warren.html">Edmund Warren</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Position 6, ‘That the Sabbath Begins</cite>, ... (London: Maxwel, 1659), pp. 242-45, p. 242</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>
<div class="actions"><button class="copy" data-copy="“This position has been also handled and proved abundantly by others, chiefly by Mr. Cawdrey and Mr. Pynchon, whose arguments I judge unanswerable. ‘Tis to me an unquestionable conclusion that the Sabbath, being a natural day consisting of 24 hours, it must begin and end as the natural day itself does.”

— Edmund Warren, Position 6, ‘That the Sabbath Begins in the Morning’ in The Jew’s Sabbath Antiquated &amp; the Lord’s Day Instituted by Divine Authority... (London: Maxwel, 1659), pp. 242-45, p. 242">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+position+has+been+also+handled+and+proved+abundantly+by+others%2C+chiefly+by+Mr.+Cawdrey+and+Mr.+Pynchon%2C+whose+arguments+I+judge+unanswerable.+%E2%80%98Tis+to+me+an+unquestionable+conclusion+that+the+Sabbath%2C+being+a+natural+day+consisting+of+24+hours%2C+it+must+begin+and+end+as+the+natural+day+itself+does.%E2%80%9D%0A%0A%E2%80%94+Edmund+Warren%2C+Position+6%2C+%E2%80%98That+the+Sabbath+Begins+in+the+Morning%E2%80%99+in+The+Jew%E2%80%99s+Sabbath+Antiquated+%26+the+Lord%E2%80%99s+Day+Instituted+by+Divine+Authority...+%28London%3A+Maxwel%2C+1659%29%2C+pp.+242-45%2C+p.+242&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7b4cc47da7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7b4cc47da7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-day/when-does-the-lords-day-begin/#:~:text=This%20position%20has%20been%20also%20handled,as%20the%20natural%20day%20itself%20does&amp;text=This%20position%20has%20been%20also%20handled%20and%20proved&amp;text=and%20end%20as%20the%20natural%20day%20itself%20does" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-da9c142ca5" data-kw="">
<blockquote><p>Surely it is a notable gift that we may be reckoned among the number of God’s creatures. And who doubts, but that it is well done, to give thanks unto God for it [one’s birth], and in thanksgiving to testify the joyfulness of mind by an outward token of some modest banket? The use of honest pleasures is such, as they have always godliness joined with them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places</cite>, II.2.26, … (London: Henrie Denham et al., 1583), pt. 2, 7. ‘The Fourth Precept: of Sanctifying the Sabbath Day’, section 6, ‘Whether it be lawful to solemnize the birthday of any man’, p. 377</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-832527ca0f" data-kw="">
<blockquote><p>It was unlawful for God’s people under the Old Testament to spend any part of the Sabbath in carnal pleasures and recreations, it is unlawful for us under the New… That such recreations were prohibited to the Jews, I believe none will deny… [by] the Fourth Command and Isa. 58:13 forecited… we are bound to abstain from those recreations upon the Sabbath, as well as the Jews… but the Jews were bound to abstain from carnal recreations on the Sabbath, upon moral grounds, which concern us as well as them… the reasons of the Fourth Command are moral… every one of them levels as much against worldly recreations on the Sabbath Day as against worldly employments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-willison.html">John Willison</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Concerning the Sanctification of the Lord’s Day</cite>, … 3rd ed. (1716; Edinburgh: Lumisden, 1745), pp. 75-76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-617c6a0947" data-kw="">
<blockquote><p>…nor they and their families [may] go so far [to church] without such inconvenience and trouble as will frustrate the end of their endeavors: As in France where the Protestants must go twenty miles or ten to a church, which the weak, children and aged cannot do, nor the rest of the family without such cost and pains, and loss of time as will deprive them of the benefit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace</cite>, … (London, 1679), sect. 6, p. 100</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-afe51e93d3" data-kw="">
<blockquote><p>A second sort of works allowed to be done on the Lord’s day: are bodily works and labors which are so necessary for the fitting and enabling of Christians to sanctify that day… And because men cannot be so cheerful in the service of God, nor so heartily rejoice before Him, not with strength and delight spend the whole day in Sabbath duties, without warm and wholesome food, and plentiful refreshing of their weak bodies, therefore the dressing, boiling, baking and roasting of meat is lawful on the Lord’s day, so far as it more helps than hinders holy duties and the service of God. This is manifest by the words of the law, Ex. 12:16, where the Lord forbidding all manner of work on his holy Sabbaths, excepts labor and work about that which people were to eat, and which was necessary for the upholding of an holy moderate feasting on those days. This was practised by the Pharisees and by our Savior and his apostles who on the Sabbath day came to a feast to the house of a chief Pharisee, Lk. 14:1-2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath</cite>, … (Amsterdam, 1638), ch. 21 Westminster divine, p. 152</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

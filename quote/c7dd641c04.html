<main class="wrap"><figure class="quote" id="q-c7dd641c04" data-kw="">
<blockquote><p>How then was the human nature taken? Surely, it was so taken into unity of the same person, that yet it is not made the very person: but rather exists in the person, is born and sustained of the person, and ever depends wholly upon the same.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-de9c7888de" data-kw="">
<blockquote><p>By the Understanding, Will, and Affection, the Soul doth (as it were) enter into God, and God into the Soul; whence followeth (as it were) a mutual in-being of one in another, and an intimate vital union between God and the Soul. Either the vision, fruition, and love of God, is Blessednesse, or there is no Blessednesse; God is not God, Heaven is not Heaven; the Creature, according to the best, namely, the Gospel-dispensation of God, is capable of no more, needs no more, can have no more; God in Christ doth no more for Man, man needs no more from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, London, 1654, ch. 15, p. 335</span></figcaption>

</figure><figure class="quote" id="q-37629f4e18" data-kw="">
<blockquote><p>Objection 2: Further, hypostasis is nothing more than a ‘particular substance,’ as Boethius says (De Duab. Nat.). But it is plain that in Christ there is another particular substance beyond the hypostasis of the Word, viz. the body and the soul and the resultant of these. Therefore there is another hypostasis in Him besides the hypostasis of the Word. … Reply to Objection 2: Hypostasis signifies a particular substance, not in every way, but as it is in its complement. Yet as it is in union with something more complete, it is not said to be a hypostasis, as a hand or a foot [is, as joined to a person’s body]. So likewise the human nature in Christ, although it is a particular substance, nevertheless cannot be called a hypostasis or suppositum, seeing that it is in union with a completed thing, viz. the whole Christ, as He is God and man. But the complete being with which it concurs is said to be a hypostasis or suppositum.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 3, question 2, ‘Of the Mode of Union of the Word Incarnate’ | article 3, ‘Whether the union of the Word Incarnate took place in the suppositum or hypostasis?’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

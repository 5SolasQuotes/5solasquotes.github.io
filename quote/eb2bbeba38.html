<main class="wrap"><figure class="quote" id="q-eb2bbeba38" data-kw="">
<blockquote><p>This consideration may be very useful: For it may first serve to be a cure of two great ills in this land: One is of such as conceive that the Law of God, belongs not to Christians; They may as well say that common and natural equity belongs not to Christians. Is it not written in the heart of man by nature? Is it not confirmed by Jesus Christ? Is it not recommended to Christians by the apostles? Is it not established by faith? Is not the observing of it, a testimony of our communion with God? Is not the end of it love from a pure heart, a good conscience, and faith unfeigned? Is it thankfulness to God, because we are delivered from the condemnation, coaction [compulsory force], and rigor of the Law, not to acknowledge the obligation of the Law? Shall not the domestics of the house of God observe the commandments of God, or shall they not be grieved when they transgress and observe them not?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon Preached to the Honorable House of Commons at their Late Solemn Fast, Wed., Dec. 27 on Ezra 7:23</cite>, (1643), p. 30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>…so neither is the prince to be obeyed, using his authority against God, in commanding impious and unhonest things: we must give unto Caesar the things that are Caesar’s and unto God the things which are God’s, we may not give unto the prince the things which are God’s, that is, the conscience. And in this case the apostles give us a rule, to obey God rather than man, Acts 4:19, when obedience then is denied in unjust and unlawful things, not the authority which is God’s ordinance, but the abuse of the authority is gainsaid.</p></blockquote>

<blockquote><p>7. We take it that the 15th Proposition contains the true mean between the usurped power of some pastors to bind the people, by a known erring sentence, to go against God’s Word; and the usurped power which many pretend to, of ruling the Church by their major vote. But how far the congregation should first have cognisance of the matter, or be heard in the debate; or how far the ministers must endeavor their consent, or suspend their own actions for want of their consent, we do not determine. And therefore all moderate presbyterians and Independents may well agree with us in this; because it’s no power that we deny the pastors, but a power of binding men to go against God’s Word; and it is not any of their liberty that we deny the people, but only ruling ministerial authority, which God never gave them, we must needs deny them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653) | An Explication of Some Passages in the Propositions, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>But their [the Brownists’] great tenet about the magistrate is this, that no prince nor State on the earth has any legislative power; that neither king nor parliament can make any law in anything that concerns either Church or State; that God alone is the Lawgiver; that the greatest magistrate has no other power, but to execute the laws of God set down in Scripture; (Bar. Dis., p. 84. “I am persuaded, that the magistrate ought not to make permanent law of that the Lord has left in our liberty.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f8498633c4" data-kw="">
<blockquote><p>1. Is the Sabbath commandment a moral law or a ceremonial law? The commandment to observe the weekly Sabbath is a moral law of God.

2. How can it be shown that the Sabbath commandment is a moral rather than a ceremonial law? (a) The fourth commandment itself mentions the fact that the Sabbath originated not at the time of Moses but at the creation of the world. Thus the Sabbath existed thousands of years before God gave the ceremonial laws in the time of Moses. (b) The Sabbath commandment is a part of the Ten commandments, and thus, being found in a context of moral laws, it too must be regarded as a moral Iaw: it would be very strange if the Ten Commandments were composed of nine moral precepts and one ceremonial precept, nine permanent laws and one law of only temporary validity. The Ten form a unity as a summary of God’s moral law, and if the Sabbath commandment were not a moral law, this unity would be broken. (c) Like the rest of the Ten commandments, the Sabbath commandment was not written on perishable material but upon tablets of stone, indicating its permanent validity. All parts of the ceremonial law passed away at the time of the crucifixion of Christ, and if the Sabbath commandment is a ceremonial law, then it too passed away, and was not permanent, but only of temporary validity. But the fact that it was written on stone by God himself indicates that it was intended to be permanent.

3. On whom is the Sabbath commandment binding? Upon all men without exception. As Jesus said, “the Sabbath was made for man”; he did not say that the Sabbath was made for Israel, but that it was made for man, and not man for the Sabbath. Thus it is not limited to any particular class of men, but is binding upon the human race.

4. What attempts have been made to limit the obligation to observe the Sabbath to certain classes of people? (a) Some have held that the obligation to keep the Sabbath is binding only on the people of Israel or the Jews. (b) Others have maintained that the obligation to observe the Sabbath is binding only on Christians, and that those who do not profess to be Christians need not observe the Sabbath.

5. How can these claims be answered? (a) It has been shown above that the Sabbath commandment is a moral law. But if it is a moral law, it must be binding on all people without exception. (b) If we say that the fourth commandment applies only to Jews, or only to Christians, why not go on and say that the fifth, sixth, and seventh commandments, for example, apply only to Jews, or only to Christians? We must always remember that the Ten Commandments form a unity and may not be arbitrarily broken up. We may not single out one commandment and say that it applies only to a limited group of people, while the rest apply to all mankind. The Ten Commandments must be taken together, and we should realize that while they were originally revealed by God to the people of Israel, they form a summary of God’s moral law which is binding on all mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Larger Catechism: A Commentary</cite>, ed. G. I. Williamson (Phillipsburg NJ: P&amp;R, 2002), pp 321-22.</span></figcaption>

<blockquote><p>A corrupt and wicked life argues a man to be a stranger to God, and God him; for otherwise a man might draw nigh to God, and have unclean hands too, which the Text [James 4:8] supposes that it cannot be. That power which draws a man into acquaintance with God, doth proportionably kill sin.

That power which flows from God in acquaintance with a man, kills sin too: whether I go out to the sun, or the sun come in to me, the darkness is expelled: sin hath not dominion over them that are under grace, Rom. 6. 14. the knowledge of God sets a man loose from his bondage to the enslaving lusts he before served, ye shall know the truth, and the truth shall make you free, John 8. 32. draw nigh to God, and be unclean if you can. That faith which is uniting to Christ, is a purifying faith; rebellion against the Commandments of God, is inconsistent with communion with God; you may fast, and pray, and ask, that you may consume upon your lusts, ver. 4. like a cutpurse in a Church, who comes not thither to seek God, but his prey.

They that draw nigh to God, must cleanse their hands; I will wash mine hands in innocency, so will I compass thine Altar, O Lord, Psal. 26. 6. Where you may observe, that thanksgivings and praises, which the Psalmist calls sacrifices of shouting, or loud music, Psal. 27. 6. and wherein they used (as one saith) … are to be performed with washen hands: so in your prayers, the Lord requires that you should lift up pure hands, 1 Tim. 2. 8. and what a sweet reflection may you make upon your deliverances which are wonderful, when you can say, I was upright with God, and I kept my self from mine iniquity? Therefore hath the Lord recompensed me according to my righteousness, according to the cleanness of my hands in his eye-sight, Psal. 18. 23, 24.

If ye fall into straits, and be plunged into depths of misery; If your face be foul with weeping, and on your eye lids be the shadow of death; what a lifting up of the head will it be unto you, to be able to say, Not for any injustice in my hands? Job. 16. 17. If the Lord shall deliver this Island from the oppression and injustice under which it hath groaned; what a crown and comfort will it be to you, that it is delivered by the pureness of your hands? Job. 22. 30.

To conclude. If there be a frustration of our counsels, and our endeavours bring forth nothing but wind; You shall find the reason why God makes all void and ineffectual, Isa. 59. 6. Their webs shall not become garments, neither shall they cover themselves with their works; Their works are works of iniquity, and the act of violence is in their hands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The purifying of unclean hearts and hands: opened in a sermon preached before the Honourable House of Commons, at their solemn fast, January 28. 1645 in Margaret’s Westminster</cite>, (London: Abel Roper, 1646), pp 9-10.</span></figcaption>

<blockquote><p>Therefore, a true and worthy esteem of God and other acts manifesting esteem constitute, as it were, the first matter of religion. Every honest, human act making for the honor and glory of God may be the matter or material object of religion. It is one and the same act which as submission to commandment is called obedience and as honor to God is called religion and worship.</p></blockquote>

<blockquote><p>…the bishop’s own words. For he says that we kneel before the elements [of the Supper], ‘having them in our sight, or object to our senses, as ordinary signs, means, and memorials, to stir us up, to worship, etc.’ Now if we have them in our sight and before our senses for this purpose, that they may be means, signs, and memorials to stir us up to worship, then (sure) their being really before our senses is not accidental to us when we kneel. Since Dr. Burgess has been so dull and sottish as to write that ‘the signs are but accidentally before the communicants when they receive,’ he is to be ignominiously exsibilat; for making the sacred sacramental signs to be no otherwise present than the walls of the Church, the nails and timber of the material table whereupon the elements are set, or anything else accidentally before the communicants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 3, ch. 4, p. 58</span></figcaption>

<blockquote><p>V. 1, ‘And Nadab and Abihu’ — These jolly young priests, overjoyed haply of their new employment and overwarmed with wine, as some gather out of Lev. 10:9, over did themselves the very day of their service, Lev. 10:19 and are suddenly surprised by a doleful death. … V. 16, ‘And Moses diligently sought the goat of the sin offering, and, behold, it was burnt: and he was angry with Eleazar and Ithamar, the sons of Aaron’ Passion for their dead friends had so transported the priests that they knew not well what they did… but then it must not be excessive as here, and as 2 Sam. 18:33. … V. 18, ‘Behold, the blood of it was not brought in within the holy (place): ye should indeed have eaten it in the holy (place), as I commanded.’ Thus, by misreckoning a point, ye have missed the haven and hazarded yourselves to the rocks of the divine displeasure, against which your brethren so lately split.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-trapp.html">John Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Leviticus</cite>, 10</span></figcaption>

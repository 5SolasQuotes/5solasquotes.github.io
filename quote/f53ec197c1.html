<main class="wrap"><figure class="quote" id="q-f53ec197c1" data-kw="">
<blockquote><p>The Reformed Catholics hold that there is in the Church one, and that an infallible rule for understanding the holy Scripture and conserving of unity in matters of Faith. And that rule is: ‘The evidence of its own meaning as inherent in itself, discernible or intelligible by men prepared and instructed, by competent teaching and study, and the necessary help of God’s grace and Spirit.’ This is that rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Protestant Religion Truly Stated &amp; Justified</cite>, … (London: Salusbury, 1692), p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-63d112067c" data-kw="Succession of doctrine">
<blockquote><p>Succession is necessary in the church, but of doctrine and of the common and pastoral office; but not of place, or of persons and of the extraordinary apostolic office. Pastors in the first way succeed the apostles, but no one could have succeeded them in the latter way. … There are officers who must perpetually accompany the church, as pastors and teachers. Others, who were appointed to found it (such as apostles and evangelists), ought to remain only for a time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.19.16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/apostolic-succession.html">Apostolic succession</a></span></div>

</figure><figure class="quote" id="q-01dbabec62" data-kw="">
<blockquote><p>The state and condition of the church with respect unto them has utterly ceased; and nothing can be more vain than to pretend any succession unto them, in the whole or any part of their office, unless men can justify their claim unto it by any or all of those things which concurred unto it in the apostles, which they cannot do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Inquiry into the Original, Nature, Institution, Power, Order, and Communion of Evangelical Churches</cite>, ch. 3 (Works 15)</span></figcaption>

</figure><figure class="quote" id="q-669e01d933" data-kw="">
<blockquote><p>Your see, however, which is called the Court of Rome, and which neither you nor any man can deny to be more corrupt than any Babylon or Sodom, and quite, as I believe, of a lost, desperate, and hopeless impiety, this I have verily abominated, and have felt indignant that the people of Christ should be cheated under your name and the pretext of the Church of Rome; and so I have resisted, and will resist, as long as the spirit of faith shall live in me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Pope Leo X</cite>, p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a></span></div>

</figure><figure class="quote" id="q-c23f226acb" data-kw="">
<blockquote><p>For neither does any of us set himself up as a bishop of bishops, nor by tyrannical terror does any compel his colleague to the necessity of obedience; since every bishop, according to the allowance of his liberty and power, has his own proper right of judgment, and can no more be judged by another than he himself can judge another. But let us all wait for the judgment of our Lord Jesus Christ, who is the only one that has the power both of preferring us in the government of His Church, and of judging us in our conduct there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cyprian-of-carthage.html">Cyprian of Carthage</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Seventh Council of Carthage</cite>, (256), opening address</span></figcaption>

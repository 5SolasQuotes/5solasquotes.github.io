<main class="wrap"><figure class="quote" id="q-9be10c6f93" data-kw="">
<blockquote><p>In matter of hearing, it is not so hard to discern who are to be accounted to speak without God’s commission: because ordinarily, such have either no warrantable call at all (no not in the outward form; and so cannot be accounted but to run unsent) or, by palpable defection from the truth, and commission given them in that call, they have forfeited their commission, and so no more are to be accounted ambassadors to Christ, or watchmen of His flock, than a watchman of the city, is to be accounted an observer thereof, when he has publicly made defection to the enemy, and taken on with him. For we are here to rest in the external call, and not to dispute that which is inward: because it passes our reach; and Christ has furnished his House with external ordinances, for the warranting of his people’s peace in reference to these things: there is therefore great difference to be placed here between one that is called, and one whom we think not worthy to be called: it’s the first that warrants hearing…</p></blockquote>

</figure><figure class="quote" id="q-67a848c7de" data-kw="">
<blockquote><p>1. Jesus preached peace (Eph. 2:17); don’t be a better preacher than Jesus.

2. Preach first to yourself.

3. Preach from your heart, not only to their heart.

4. Leverage your own distress.

5. How much do you have to hate the people to try to impress them rather than help them?

6. A pervasive tone of encouragement.

7. Vivid imagery. Visceral, sensory. Littered with analogues.

8. They’re more distressed than they’re revealing.

9. The power is in the Word, not your cleverness.

10. The Spirit works with your weakness and need, not our strength and sufficiency.

11. Think yourself full, pray yourself aglow.

12. Be concrete, not abstract.

13. Specificity communicates universality.

14. Be clear. Lewis: sheep. If you given them a route to misunderstand, they’ll take it.

15. Be simple but not simplistic.

16. Ruthlessly cut everything extraneous.

17. Smile. And mean it. Preaching is an act of pastoral love.

18. Doctrine is not enough; but, people do want to know doctrine.

19. Regularly reveal something of your own weakness.

20. Let them know of exegetical discoveries new to you.

21. Don’t ask adjectives to do the work verbs should be doing.

22. Make the gospel clear at some point.

23. Both unbelievers and believers are present.

24. Both eager and stagnant belieers are present.

25. Remember, and speak directly to, the kids.

26. Speak in your natural everyday voice; resist every form of ‘the preacher’s voice’.

27. Handle objections.

28. When on the fence, shorter is better.

29. Quit preaching while you still have them.

30. You don’t look as happy as you are; so stretch for joy.

31. If they feel loved by you (Phil. 4:1), they will feel hurt with you (Phil. 4:14).

32. ‘We will hear you again about this’ (Acts 17:32). Intrigue them with Jesus, even if they haven’t collapsed into his arms yet.

33. Don’t let your main points be transposable onto any other text in the Bible.

34. Slow down to notice every actual word of the text–what it says, and doesn’t say.

35. Calm down and be yourself.

36. Be a farmer, not a penny stock trader. Crock pot, not microwave.

37. They don’t need eloquence; they need radiance.

38. T.F. Tenney: ‘Preach every sermon like your son is sitting on the last row and giving church one last chance.’

39. Tincture. Give them a taste of what Jesus himself is like. Rutherford.</p></blockquote>

</figure><figure class="quote" id="q-a9862497ce" data-kw="">
<blockquote><p>We have another example of reverence given to such rulers, even in things that were done by them wrongfully. For Jeremiah, being for a time suspended from coming into the Temple, being at liberty, would not (lest, as it seems, he should make a tumult) enter the Temple; and therefore (having written that which he had to say) sent Baruch to read his sermon in the Temple.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Letter of T. C. To Richard Harrison Concerning Separation’</cite>, (1584), p. 12 in The Judgment of Mr. Cartwright &amp; Mr. Baxter Concerning Separation &amp; the Ceremonies (1673)</span></figcaption>

</figure><figure class="quote" id="q-54985cb2a3" data-kw="">
<blockquote><p>It is pity that any wise and judicious minister should want [lack] that fervor and seriousness of speech which the weight of so great a business does require. And it is greater pity that any serious, affectionate minister should be ignorant and injudicious: And it is yet greater pity that in any good men, too much of their fervor should be merely affected and seem to be what it is not; or at least be raised by a selfish desire to advance ourselves in the hearers’ thoughts and to exercise our parts upon their affections. But it is most pitiful that the Church has any hypocrites who have no other but such affected dissembled fervency. And it is not the least pity that so many good people, especially youths and women, should be so weak, as to value an affectionate tone of speech above a judicious opening of the Gospel. I confess there is something in an affectionate expression, which will move the wisest: And as light and judgment tend to generate judgment, so heat of affection tends to beget affection. And I never loved a senseless delivery of matters of eternal consequence, as if we were asleep ourselves, or would make the hearers to be so: or would have them think by our cold expressions that we believe not ourselves, when we set forth the great inestimable things of the life to come. But yet it grieves my very soul to think what pitiful, raw and ignorant kind of preaching is crowded most after in many places for the mere affectionate manner of expression and loudness of the preacher’s voice! How oft have I known the ablest preachers undervalued and an ignorant man by crowds applauded, when I that have been acquainted with the preacher ab incunabulis [from infancy], have known him to be unable well to answer most questions in the common catechism. And I durst not tell them of his great insufficiency and ignorance for fear of hindering the success of his labors and being thought envious at other men’s acceptance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 41, pp. 214-15</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It is pity that any wise and judicious minister should want [lack] that fervor and seriousness of speech which the weight of so great a business does require. And it is greater pity that any serious, affectionate minister should be ignorant and injudicious: And it is yet greater pity that in any good men, too much of their fervor should be merely affected and seem to be what it is not; or at least be raised by a selfish desire to advance ourselves in the hearers’ thoughts and to exercise our parts upon their affections. But it is most pitiful that the Church has any hypocrites who have no other but such affected dissembled fervency. And it is not the least pity that so many good people, especially youths and women, should be so weak, as to value an affectionate tone of speech above a judicious opening of the Gospel. I confess there is something in an affectionate expression, which will move the wisest: And as light and judgment tend to generate judgment, so heat of affection tends to beget affection. And I never loved a senseless delivery of matters of eternal consequence, as if we were asleep ourselves, or would make the hearers to be so: or would have them think by our cold expressions that we believe not ourselves, when we set forth the great inestimable things of the life to come. But yet it grieves my very soul to think what pitiful, raw and ignorant kind of preaching is crowded most after in many places for the mere affectionate manner of expression and loudness of the preacher’s voice! How oft have I known the ablest preachers undervalued and an ignorant man by crowds applauded, when I that have been acquainted with the preacher ab incunabulis [from infancy], have known him to be unable well to answer most questions in the common catechism. And I durst not tell them of his great insufficiency and ignorance for fear of hindering the success of his labors and being thought envious at other men’s acceptance.”

— Richard Baxter, The Cure of Church Divisions… (London, 1670), pt. 1, Direction 41, pp. 214-15">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+pity+that+any+wise+and+judicious+minister+should+want+%5Black%5D+that+fervor+and+seriousness+of+speech+which+the+weight+of+so+great+a+business+does+require.+And+it+is+greater+pity+that+any+serious%2C+affectionate+minister+should+be+ignorant+and+injudicious%3A+And+it+is+yet+greater+pity+that+in+any+good+men%2C+too+much+of+their+fervor+should+be+merely+affected+and+seem+to+be+what+it+is+not%3B+or+at+least+be+raised+by+a+selfish+desire+to+advance+ourselves+in+the+hearers%E2%80%99+thoughts+and+to+exercise+our+parts+upon+their+affections.+But+it+is+most+pitiful+that+the+Church+has+any+hypocrites+who+have+no+other+but+such+affected+dissembled+fervency.+And+it+is+not+the+least+pity+that+so+many+good+people%2C+especially+youths+and+women%2C+should+be+so+weak%2C+as+to+value+an+affectionate+tone+of+speech+above+a+judicious+opening+of+the+Gospel.+I+confess+there+is+something+in+an+affectionate+expression%2C+which+will+move+the+wisest%3A+And+as+light+and+judgment+tend+to+generate+judgment%2C+so+heat+of+affection+tends+to+beget+affection.+And+I+never+loved+a+senseless+delivery+of+matters+of+eternal+consequence%2C+as+if+we+were+asleep+ourselves%2C+or+would+make+the+hearers+to+be+so%3A+or+would+have+them+think+by+our+cold+expressions+that+we+believe+not+ourselves%2C+when+we+set+forth+the+great+inestimable+things+of+the+life+to+come.+But+yet+it+grieves+my+very+soul+to+think+what+pitiful%2C+raw+and+ignorant+kind+of+preaching+is+crowded+most+after+in+many+places+for+the+mere+affectionate+manner+of+expression+and+loudness+of+the+preacher%E2%80%99s+voice%21+How+oft+have+I+known+the+ablest+preachers+undervalued+and+an+ignorant+man+by+crowds+applauded%2C+when+I+that+have+been+acquainted+with+the+preacher+ab+incunabulis+%5Bfrom+infancy%5D%2C+have+known+him+to+be+unable+well+to+answer+most+questions+in+the+common+

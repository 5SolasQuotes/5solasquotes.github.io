<blockquote><p>Now let the Apostles come forward in order. Their number, however, may beget confusion; and, therefore, the better course will be to take Paul and Peter by themselves, and afterwards proceed to the rest. Their bodies are at Rome, half at St Peter’s, and half at St Paul’s, Sylvester having, it is said, weighed them to make sure of an equal division. The heads of both are in the church of Joannes Lateranensis, though in the same church there is a tooth of Peter existing separately by itself. Though these things are so, it does not prevent them from being in other places also, as at Poictiers, where they have Peter’s cheek-bone and his beard. At Treves they have many bones belonging to both, and at Argenton, in Berri, they have Paul’s shoulder. But the thing is endless. Wherever there are churches dedicated to them, they have their relics in abundance. If it be asked, what kind of relics? let them call to mind what kind of a one the brain of St Peter was which I formerly mentioned, and which stood on the high altar of this city. As it turned out to be a pumice stone, so, on inquiry, it will be found, that many of the bones which are attributed to these Apostles are those either of horses or dogs. Then come the things belonging to the bodies, as accessories. For instance, there is a shoe at St Salvator’s in Spain, but of what form and material I am unable to say. But the probability is, that it is an article of a similar description to the shoes which they have at Poictiers, and which are made of polished leather, ornamented with gold. See how splendidly they have adorned him after death, to compensate for the poverty in which he passed his life! As the Bishops of the present day, in representing pontifical majesty, are so splendidly clothed, it would seem to derogate from the dignity of the Apostles, were not something of the same nature attributed to them. True! painters can draw pictures in what colours they please, decking them from top to toe in varied attire, and then give them the name of Peter and Paul, or any other name; but every body knows the kind of clothing which they actually had in this world, and that it was no better than that which is usually worn by the poor. They have also at Rome the episcopal chair in which Peter sat, together with the sacerdotal robe in which he used to say mass, as if Bishops had at that time sat on thrones. Their business rather was to teach, comfort, and exhort in public and private, and make themselves ensamples to the flock; not to show themselves to the people to be adored by them, as the prelates of our day are wont to do. With regard to the robe for mass, the custom of masking after the manner of players was not then introduced; for plays were not then acted in the Church as they are now. Wherefore, in order to prove that Peter was dressed in a missal robe, they must first show that when he worshipped God he performed the part of a player like the Popish priests. It was natural enough for them to give him a missal robe, as they had previously given him an altar; but there is no more plausibility in the one than in the other. What kind of masses was then celebrated is well known; for the Apostles in their time only celebrated the Lord’s Supper, and for this no altar was necessary. That kind of monstrosity called a mass was altogether unknown, and continued to be unknown for long after. Hence it is clear, that these men, in fabricating their relics, must have supposed they were never to meet with an opponent; so shamelessly and extravagantly have they dared to lie. And yet they are not agreed among themselves as to that altar. For the Romans say that they have it, while the people of Pisa also show it in their suburb which faces the sea. But that they might lose no possible means of making profit, they have not forgotten the sword with which the ear of Malchus was cut off, as if it were some fair ornament worthy of being preserved as a relic. I have omitted to mention the staff which is shown at Paris in the church of St Stephen á Pierre, and which is in as high repute as the altar and missal robe, and just for as good a reason. As to the staff, there is somewhat more plausibility in it, as it is not unlikely he may have used a staff in travelling; but then they throw every thing into confusion, by not agreeing among themselves about it. For the inhabitants of Cologne, and likewise those of Treves, contend for the possession of it. While they accuse each other of falsehood, they furnish us with good grounds for not giving credit to either. As to the chain with which Peter was bound I say nothing. It is shown at Rome in the church which bears its name. Nor do I say anything of the pillar on which he was beheaded, and which is shown in the church of St Anastasius. I only leave my readers to reflect how that chain must have been procured for the purpose of being converted into relics, and also whether, at that time, it was customary for executions to take place upon pillars. We will now consider the case of the other Apostles jointly, and will dispose of it in a very few words. And first, we will mention where the whole bodies are, that by comparing them together, it may be seen what certainty can be had in reference to the things said of them. Everybody knows that the inhabitants of Tholouse think that they have got six of these bodies, viz., those of James the Greater, Andrew, James the Less, Philip, Simeon, and Jude. The body of Matthias is at Padua, that of Matthew, at Salerno, of Thomas, at Ortona, and of Bartholomew, at Naples, or somewhere in that district. Now, let us attend to those who have had two or three bodies. For Andrew has another body at Melfi, Philip and James the Less have each another body at the church of the Holy Apostles, and Simeon and Jude, in like manner, at the church of St Peter. Bartholomew has also another in the church dedicated to him at Rome. So here are six who have each two bodies, and also by way of a supernumerary, Bartholomew’s skin is shown at Pisa. Matthias, however, surpasses all the rest, for he has a second body at Rome, in the church of the Elder Mary, and a third one at Treves. Besides, he has another head, and another arm, existing separately by themselves. There are also fragments of Andrew existing at different places, and quite sufficient to make up half a body. For his head is at Rome, at the church of St Peter, a shoulder in that of Grisgon, a rib in that of St Eustathius, an arm in that of the Holy Spirit, and some other part in the church of St Blaise. There is also a foot at Aix. Were all these joined together, and properly fitted, they would make up two quarters of the body. But as Bartholomew left his skin at Pisa, so also he has left one of his heads at Treves, and some other member, I know not what. He has also a finger at Frene, while some other relics of them exist also at Rome, in the church of St Barbara. Thus, there is not only no want, but a superfluity in his case. The others are not so well supplied, yet each of them has somewhat to spare. For Philip has one foot at Rome, in the church of the Holy Apostles; also in the church of St Barbara he has I know not what relics, besides these which he has at Treves. In these two last churches he has James for his companion; for James, in like manner, has a hand in the church of St Peter, an arm in that of Grisgon, and another in that of the Holy Apostles. Matthew and Thomas have been left poorer than the rest. For the former has only one body, together with a few bones at Treves, and an arm at Rome, in the church of St Marcellus, and a head in that of St Nicholas, unless there be some which have escaped me. This is very likely; for how can one avoid losing one’s self in such a labyrinth? Finding in their legends that the body of the Evangelist John vanished as soon as it had been consigned to the earth, it has been impossible for them to produce his bones, but they have endeavoured to compensate the matter in another way, by making a rush at all the articles connected with him. And the first thing which occurred to them is the cup out of which he drank poison after he was condemned by Domitian. But as two cities lay claim to it, we must either give implicit credit to what alchymists tell us of multiplication, or these people with their cup have played off a hoax on the world. There is one at Boulogne, and another at Rome, in the church of Joannes Lateranensis. Next, they have laid hold of his tunic, and the chain with which he was bound when he was brought from Ephesus, together with the oratory in which he prayed while he was in prison. I should like to know, whether at this time he hired carpenters to make an oratory for him, and also what intimacy between Christians and his jailors enabled them to obtain the chain from them, and so give it a place among their relics. These things are too absurd even to amuse children. But the most extraordinary articles of all are the twelve apostolic combs, which are exhibited in the church of Mary Insulan, near Lyons. I believe they were placed there at first with the intention of exhibiting them as combs which belonged to twelve peers of France, but their dignity afterwards having increased, they became apostolic.</p></blockquote>

of+Matthias+is+at+Padua%2C+that+of+Matthew%2C+at+Salerno%2C+of+Thomas%2C+at+Ortona%2C+and+of+Bartholomew%2C+at+Naples%2C+or+somewhere+in+that+district.+Now%2C+let+us+attend+to+those+who+have+had+two+or+three+bodies.+For+Andrew+has+another+body+at+Melfi%2C+Philip+and+James+the+Less+have+each+another+body+at+the+church+of+the+Holy+Apostles%2C+and+Simeon+and+Jude%2C+in+like+manner%2C+at+the+church+of+St+Peter.+Bartholomew+has+also+another+in+the+church+dedicated+to+him+at+Rome.+So+here+are+six+who+have+each+two+bodies%2C+and+also+by+way+of+a+supernumerary%2C+Bartholomew%E2%80%99s+skin+is+shown+at+Pisa.+Matthias%2C+however%2C+surpasses+all+the+rest%2C+for+he+has+a+second+body+at+Rome%2C+in+the+church+of+the+Elder+Mary%2C+and+a+third+one+at+Treves.+Besides%2C+he+has+another+head%2C+and+another+arm%2C+existing+separately+by+themselves.+There+are+also+fragments+of+Andrew+existing+at+different+places%2C+and+quite+sufficient+to+make+up+half+a+body.+For+his+head+is+at+Rome%2C+at+the+church+of+St+Peter%2C+a+shoulder+in+that+of+Grisgon%2C+a+rib+in+that+of+St+Eustathius%2C+an+arm+in+that+of+the+Holy+Spirit%2C+and+some+other+part+in+the+church+of+St+Blaise.+There+is+also+a+foot+at+Aix.+Were+all+these+joined+together%2C+and+properly+fitted%2C+they+would+make+up+two+quarters+of+the+body.+But+as+Bartholomew+left+his+skin+at+Pisa%2C+so+also+he+has+left+one+of+his+heads+at+Treves%2C+and+some+other+member%2C+I+know+not+what.+He+has+also+a+finger+at+Frene%2C+while+some+other+relics+of+them+exist+also+at+Rome%2C+in+the+church+of+St+Barbara.+Thus%2C+there+is+not+only+no+want%2C+but+a+superfluity+in+his+case.+The+others+are+not+so+well+supplied%2C+yet+each+of+them+has+somewhat+to+spare.+For+Philip+has+one+foot+at+Rome%2C+in+the+church+of+the+Holy+Apostles%3B+also+in+the+church+of+St+Barbara+he+has+I+know+not+what+relics%2C+besides+these+which+he+has+at+Treves.+In+these+two+last+churches+he+has+James+for+his+companion%3B+for+James%2C+in+like+manner%2C+has+a+hand+in+the+church+of+St+Peter%2C+an+arm+in+that+of+Grisgon%2C+and+another+in+that+of+the+Holy+Apostles.+Matthew+and+Thomas+have+been+left+poorer+than+the+rest.+For+the+former+has+only+one+body%2C+together+with+a+few+bones+at+Treves%2C+and+an+arm+at+Rome%2C+in+the+church+of+St+Marcellus%2C+and+a+head+in+that+of+St+Nicholas%2C+unless+there+be+some+which+have+escaped+me.+This+is+very+likely%3B+for+how+can+one+avoid+losing+one%E2%80%99s+self+in+such+a+labyrinth%3F+Finding+in+their+legends+that+the+body+of+the+Evangelist+John+vanished+as+soon+as+it+had+been+consigned+to+the+earth%2C+it+has+been+impossible+for+them+to+produce+his+bones%2C+but+they+have+endeavoured+to+compensate+the+matter+in+another+way%2C+by+making+a+rush+at+all+the+articles+connected+with+him.+And+the+first+thing+which+occurred+to+them+is+the+cup+out+of+which+he+drank+poison+after+he+was+condemned+by+Domitian.+But+as+two+cities+lay+claim+to+it%2C+we+must+either+give+implicit+credit+to+what+alchymists+tell+us+of+multiplication%2C+or+these+people+with+their+cup+have+played+off+a+hoax+on+the+world.+There+is+one+at+Boulogne%2C+and+another+at+Rome%2C+in+the+church+of+Joannes+Lateranensis.+Next%2C+they+have+laid+hold+of+his+tunic%2C+and+the+chain+with+which+he+was+bound+when+he+was+brought+from+Ephesus%2C+together+with+the+oratory+in+which+he+prayed+while+he+was+in+prison.+I+should+like+to+know%2C+whether+at+this+time+he+hired+carpenters+to+make+an+oratory+for+him%2C+and+also+what+intimacy+between+Christians+and+his+jailors+enabled+them+to+obtain+the+chain+from+them%2C+and+so+give+it+a+place+among+their+relics.+These+things+are+too+absurd+even+to+amuse+children.+But+the+most+extraordinary+articles+of+all+are+the+twelve+apostolic+combs%2C+which+are+exhibited+in+the+church+of+Mary+Insulan%2C+near+Lyons.+I+believe+they+were+placed+there+at+first+with+the+intention+of+exhibiting+them+as+combs+which+belonged+to+twelve+peers+of+France%2C+but+their+dignity+afterwards+having+increased%2C+they+became+apostolic.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+%E2%80%9CAn+Admonition+Showing+the+Advantages+Which+Christendom+Might+Derive+From+an+Inventory+of+Relics%E2%80%9D+in+Tracts+Relating+to+the+Reformation%2C+Vol.+1+%7C+Edinburgh%3A+Calvin+Translation+Society%2C+1844%2C+pp.+324%E2%80%9329&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F981c90a569.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/981c90a569.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/05/calvin-time-for-an-inventory-11/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>2. We see also that though ministers are virtually both elders and deacons (as the apostles were), yet ought they to regulate their exercising of both these with respect to the former two. And, 3. that elders and deacons ought in governing and overseeing the poor to have special respect to keep ministers from being burdened or toiled with these, that they may have freedom to follow the ministry of the Word as the main thing: Yea, even to have much access to privacy and solitariness, which is both most necessary for and a well becoming duty to a minister; This is a special end of the appointment of these officers, and in reference to which they are helps, 1 Cor. 12:28, both to the people and to the ministers.</p></blockquote>

<blockquote><p>Question 1. If so much knowledge will save a man as helps him to love God as God, may not heathens or infidels at least be saved? For they know that there is one God who is infinitely good and perfect, and more amiable than all the world, and the great benefactor of man, and of the whole creation: So that there is no goodness but what is in Him, or from Him, and through Him, and finally to Him: And man’s will is made to love apprehended good, and follows the last practical act of the intellect, at least where there is no competitor, but omnimoda ratio boni. And all men know that God is not only best in Himself, but good, yea best to them, because that all they have is from Him: and they have daily experience of pardoning grace contrary to their commerit. It seems therefore that they may love God as God. Answer: 1. To cause a man to love God as God, there is necessary both objective revelation of God’s amiableness, and such subjective grace which consists in a right disposition of the soul. 2. Objective revelation is considered as sufficient either to well disposed, or to an ill disposed soul. 3. This right disposition consists both in the abatement of men’s inclinations to contrary (sensual) objects, and in the inclining them to that which is divine and spiritual. And now I answer: 1. It cannot be denied but that so much of God’s amiableness or goodness is revealed to infidels that have not the Gospel, by the means mentioned in the objection, as is sufficient to bring men under an obligation to love God as God, and to leave them unexcusable that do not. 2. Therefore to such the impossibility is not physical, but moral. 3. And there is in that objective revelation, so much sufficiency, as that if the soul itself were sanctified and well disposed, it might love God upon such revelation. (Which [Moses] Amyraldus has largely proved.) 4. But to an unholy and undisposed soul no objective revelation is sufficient without the Spirit’s help and operations. 5. Only the Spirit of Christ the Mediator, as given by and from Him, does thus operate on souls, as savingly to renew them. (Of all this I have discoursed more largely in my Catholic Theology, and the applied Epitome.) 6. Whether ever the Spirit of Christ does thus operate on any that hear not of Christ’s incarnation, must be known either by the Scripture or by experience. [1.] By the Scripture I am not able to prove the universal negative, though it’s easy to prove sanctification incomparably more common in the Church, than on those without, if any there have it. The case of infants and of the Churches, and the world before Christ’s incarnation, must here come into consideration. 2. And by experience no man can prove the negative; because no man has experience what is in the hearts of all the persons in the world.</p></blockquote>

if+the+soul+itself+were+sanctified+and+well+disposed%2C+it+might+love+God+upon+such+revelation.+%28Which+%5BMoses%5D+Amyraldus+has+largely+proved.%29+4.+But+to+an+unholy+and+undisposed+soul+no+objective+revelation+is+sufficient+without+the+Spirit%E2%80%99s+help+and+operations.+5.+Only+the+Spirit+of+Christ+the+Mediator%2C+as+given+by+and+from+Him%2C+does+thus+operate+on+souls%2C+as+savingly+to+renew+them.+%28Of+all+this+I+have+discoursed+more+largely+in+my+Catholic+Theology%2C+and+the+applied+Epitome.%29+6.+Whether+ever+the+Spirit+of+Christ+does+thus+operate+on+any+that+hear+not+of+Christ%E2%80%99s+incarnation%2C+must+be+known+either+by+the+Scripture+or+by+experience.+%5B1.%5D+By+the+Scripture+I+am+not+able+to+prove+the+universal+negative%2C+though+it%E2%80%99s+easy+to+prove+sanctification+incomparably+more+common+in+the+Church%2C+than+on+those+without%2C+if+any+there+have+it.+The+case+of+infants+and+of+the+Churches%2C+and+the+world+before+Christ%E2%80%99s+incarnation%2C+must+here+come+into+consideration.+2.+And+by+experience+no+man+can+prove+the+negative%3B+because+no+man+has+experience+what+is+in+the+hearts+of+all+the+persons+in+the+world.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Treatise+of+Knowledge+%26+Love%E2%80%A6+%28London%3A+Parkhurst%2C+1689%29%2C+pt.+2%2C+ch.+14%2C+pp.+265-69&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F061cbb5771.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/061cbb5771.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-calling/#:~:text=Question%201.%20If%20so%20much%20knowledge,all%20the%20persons%20in%20the%20world&amp;text=Question%201.%20If%20so%20much%20knowledge%20will%20save&amp;text=hearts%20of%20all%20the%20persons%20in%20the%20world" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4a26fef0a7" data-kw="">
<blockquote><p>Our judgment is that none may publicly in the church assembly of the faithful preach the Word of God in the Name of Christ and of God, but he who is sent by a divine calling for that work; as the Protestants demonstrate against the Socinians and Anabaptists from Rom. 10:14-15; Heb. 5:4-5; Acts 13:1-2 &amp; 14:22; Tit. 1:5; 2 Tim. 2:2, and other places and arguments; and from the examples of all those, who either in an extraordinary or ordinary manner were sent to preach the Word. Which mission, or sending, consists not only in conferring gifts, whereby an ability, [Greek], is given by God; but in conferring a power, whereby is given an authority, [Latin], to preach the Word of God; which authority is oft-times not conferred on those, on whom yet God bestows gifts and ability. For it is by the Word of God denied to women, in whose lips is the Law of God, Prov. 31:26, and a fitness to teach the yonger women, Tit. 2:3-4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God</cite>, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 75-77</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>…for all argument they come at last to this,’By what authority doest thou these things; and who gave thee this authority?’ where the Lord answering for Himself, then, and for us now in the like case, most plainly and at length shows that, howsoever in the ordinary course of a constitute Church, a careful regard must be had to the ordinary calling, yet when (as sometime it falls) that the ordinary husband-men become murderers, and the ordinary builders become destroyers, there God extraordinarily stirs up men whose ministry proves itself to be from Heaven and not from men, even by this, that they come in the way of righteousness: and sinners are converted by them, that, so the Lord of the vineyard may report fruit thereof, even when the ordinary husbandmen rebel, and that the stone, rejected, even of the ordinary builders, may yet be made the head of the corner: which, howsoever it be marvelous in our eyes, yet it is the Lord his doing.</p></blockquote>

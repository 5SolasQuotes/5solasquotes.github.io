<main class="wrap"><figure class="quote" id="q-8d2bf56d61" data-kw="">
<blockquote><p>This supremacy of God’s power, is founded upon this absolute Right that God hath over us as he is our Creator. For he is Jehovah, that gives being to all, and receives being from none. Of him, and to him, and through him are all things. All creatures are beams from his Sun, drops from his Ocean. If I speak (saith the Text,) I in whom all men live, move, and have their being; I that made all things out of nothing, and can as easily turn all things into nothing, If I speak. This power of God over Kingdoms, hath two properties.

1. It is illimited and independent, which appears by three expressions in the Text 1. By these words, At what instant; which hold forth unto us, that God can destroy a Nation in an instant, in the very twinkling of an eye. In the morning the Sun shone upon Sodom, but before night it was destroyed with fire and brimstone. The old World was drowned (as Luther thinks) in the Spring time, when all things began to bud and blossom. The flood came suddenly, saith Christ, it came de repent, according to the vulgar translation of these words, when they least expected it. And on the contrary, God can in an instant make a Nation happy.

The Israelites were in an instant brought out of Egypt; and were in one and the same day, of all people most miserable, and of all people most happy, as Calvin well observeth upon this Text. 2. By these words—I shall speak. If God do but speak to destroy a Nation, it is presently destroyed: He spake the word, and the World was made; and if he speak the word, the World will return to its first Principles. If I bring a sword upon a land, and say, sword go through that land, so that I cut off man and beast from it. Though these three men were in it, as I live, saith the Lord, they shall deliver neither sons nor daughters, &amp;c. Ezek. 14.17, 18. On the contrary, if God do but speak to plant a Nation, it is planted; for God’s benedicere, is benefacere.

3. This absolute power of God is likewise deciphered by three synonymical expressions in the Text, To pluck up, pull down, and to destroy. Which three words do intimate, That God hath an illimited Prerogative over Kingdoms, and that he can overturn, overturn, overturn them, as it is said, Ezek. 21.27. Or as Hugo glosseth upon the words, He can pluck up all mercies, pull down all judgments, and destroy them; that is, make an utter ruin of them.

2. This power of God, is universal. For the words run in general, At what instant I shall speak concerning a Nation: not this or that Nation, but a Nation indefinitely. There is no Kingdom exempted from God’s jurisdiction, or that hath Letters Patents to privilege it. If I speak concerning Jerusalem, or concerning England, &amp;c. God is the Governor of the whole World, all alike to this Heavenly Potter.

If God’s power over Kingdoms be so large, If and so absolute; let all the World stand in awe, and not dare to sin against such a mighty and terrible God …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-calamy.html">Edmund Calamy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>England’s looking-glass presented in a sermon preached before the Honourable House of Commons at their late solemn fast, December 22, 1641</cite>, (London: Chr. Meredith, 1642), pp 4-6.</span></figcaption>

<blockquote><p>This may possibly be also a new encouragement to your Majesty, who is already engaged in the work of restoring the kingdom of Christ, and to many who live under your government to further the same work. Your kingdom is extensive and renowned, and abounds in many excellencies; Christ as its chief ruler and governor, so that it may be defended by his safeguarded and protection; for to submit your sceptre to him, is not inconsistent with that elevation in which you are placed; but it would be far more glorious than all the triumphs of the world. For since among men gratitude is deemed the proper virtue of a great and exalted mind, what in kings can be more unbecoming than to be ungrateful to the Son, by whom they have been raised to the highest degree of honour? It is, therefore, not only an honourable, but more than a royal service, which raises us to the rank of angels, when the throne of Christ is erected among us, so that his celestial voice becomes the only rule for living and dying both to the highest and to the lowest. For though at this day to obey the authority of Christ is the common profession, made almost by all, yet there are very few who render this obedience of which they boast.

Now this obedience cannot be rendered, except the whole of religion be formed according to the infallible rule of his holy truth. But on this point strange conflicts arise, while men, not only inflated with pride, but also bewitched by monstrous madness, pay less regard to his unchangeable oracles of our heavenly Master than to their own vain fictions […]</p></blockquote>

</figure><figure class="quote" id="q-1f8094bfeb" data-kw="">
<blockquote><p>Next, after a thousand years of repose and silence in the Church, the third was developed (Soteriology) through the labors of Luther and Calvin, proclaiming salvation as by grace through faith, leaving the fourth, Ecclesiology, yet to be developed. Do not the providences of God toward the American Church in freeing her from the civil domination which, by violence or seduction, silenced the martyr-voice of her Scotch mother when she would testify for Christ’s crown and covenant, and in placing the Church here in a position (for the first time, perhaps, since the apostles) to actualize fully and without hindrance her true nature and functions as a spiritual commonwealth—do not all seem to indicate that the time has fully come for the final development of the visible Church as a governmental power on earth, yet a kingdom not of this world, a people not reckoned among the nations?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stuart-robinson.html">Stuart Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church Of God As An Essential Element Of The Gospel</cite>, (Philadelphia, 1858), 28, 84, 87</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Next, after a thousand years of repose and silence in the Church, the third was developed (Soteriology) through the labors of Luther and Calvin, proclaiming salvation as by grace through faith, leaving the fourth, Ecclesiology, yet to be developed. Do not the providences of God toward the American Church in freeing her from the civil domination which, by violence or seduction, silenced the martyr-voice of her Scotch mother when she would testify for Christ’s crown and covenant, and in placing the Church here in a position (for the first time, perhaps, since the apostles) to actualize fully and without hindrance her true nature and functions as a spiritual commonwealth—do not all seem to indicate that the time has fully come for the final development of the visible Church as a governmental power on earth, yet a kingdom not of this world, a people not reckoned among the nations?”

<blockquote><p>III. …to be elected by virtue of this constitution, they shall jointly in the house of representatives choose… a governor and commander-in-chief, a lieutenant-governor… and a privy council, all of the Protestant religion… … XII. …and that no person shall be eligible to a seat in the said senate unless he be of the Protestant religion… XIII. …No person shall be eligible to sit in the house of representatives unless he be of the Protestant religion… XXXVIII. That all persons and religious societies who acknowledge that there is one God, and a future state of rewards and punishments, and that God is publicly to be worshipped, shall be freely tolerated. The Christian Protestant religion shall be deemed and is hereby constituted and declared to be, the established religion of this State. That all denominations of Christian Protestants in this State, demeaning themselves peaceably and faithfully, shall enjoy equal religious and civil privileges… …And that whenever fifteen or more male persons, not under twenty-one years of age, professing the Christian Protestant religion, and agreeing to unite themselves in a society for the purposes of religious worship, they shall (on complying with the terms hereinafter mentioned) be, and be constituted a church, and be esteemed and regarded in law as of the established religion of the State, and on a petition to the legislature shall be entitled to be incorporated and to enjoy equal privileges. …each society so petitioning shall have agreed to and subscribed in a book the following five articles, without which no agreement or union of men upon pretence of religion shall entitle them to be incorporated and esteemed as a church of the established religion of this State: 1st. That there is one eternal God, and a future state of rewards and punishments. 2nd. That God is publicly to be worshipped. 3rd. That the Christian religion is the true religion. 4th. That the holy scriptures of the Old and New Testaments are of divine inspiration, and are the rule of faith and practice. 5th. That it is lawful and the duty of every man being thereunto called by those that govern, to bear witness to the truth.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f01b2e689e" data-kw="">
<blockquote><p>If then nothing be good [simply] because rulers command it; but, by the contrary, they do lawfully command it because it is good. The Church’s power is one and the same in things indifferent, and necessary in matters of doctrine, discipline and order; for in both, the Church does not create goodness, but does by the light of the Word, or (which is a part of the Word) by nature’s light, find preexistent goodness in doctrine, discipline, and matters of order. Therefore, will of authority, as will, has no power to dispose of the east circumstance of time, place or person; but the Church’s power is ministerial and determined to what is good, expedient and convenient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), pp. 648-9</span></figcaption>

</figure><figure class="quote" id="q-5cc8ab07d5" data-kw="">
<blockquote><p>There be some that call in question the warrant and authority of classical presbyteries, of provincial synods and national assemblies, as they are used and maintained in the Church of Scotland. I mean not the praelatical faction, whom we set aside, but even some who are as anti-episcopal as we are. The scrupulosity of such (at least of many such) herein [of the Independents] does (we conceive) proceed not from any perverseness of mind, but only from certain mistakings, which better information may remove.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, … (Edinburgh, 1641), pp. 108-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><figure class="quote" id="q-ca1b9558ba" data-kw="">
<blockquote><p>Question 3. Whether indifferent actions differ nothing among themselves, but are all equally distant from good and evil? 7th Answer. In their own intrinsic nature they differ nothing at all; but yet there are some which for the most part have evil circumstances annexed to them, and so bend more toward evil, and have an evil name, as to do the work of an accuser, the office of an hangman, etc. Some there be also which for the most part have good circumstances, and so bend toward good, and have a good name, as, to till the ground, to follow our study diligently, etc. Question 4. Whether do things indifferent make any thing for order and comeliness? 8th Answer. Whatsoever it is that of its own nature serves for order or comeliness, or edification, is not indifferent: for when they do participate [in] the nature of goodness, they are not in the middle betwixt good and bad. And when they produce good, they must needs have some good force and efficacy in them: every thing brings forth its like. Question 5. Whether do indifferent things cease to be indifferent when any certain thing is set down concerning them, by such as are in authority? 9th Answer. Nothing ought to be commanded, but that which is good, nor to be forbidden, but what is evil; That which is indifferent cannot simply, absolutely, and forever be either enjoined or forbidden; but commanded, as it draws near to good, forbidden, as it approaches to evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof</cite>, ([Leiden &amp; London] 1639), bk. 3, ch. 18, ‘Of Things Indifferent’, p. 89</span></figcaption>

<blockquote><p>13. For the Spirit dictates [by illumination] both unto the Church, as well what is profitable for avoiding of scandal, as also that those things which are commanded for avoiding of scandal, are neither the worship of God, nor yet necessary to be observed without the case of scandal and contumacy, as appears by those sayings (1 Cor. 7:6, 35): ‘I speake this by permission, not by commandement. This I speak for your own commodity, not to entangle you in a snare, but that you follow that which is honest, and that you may cleave fast unto the Lord without separation.&#x27;</p></blockquote>

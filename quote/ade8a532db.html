<blockquote><p>What pain and difficulty do men often find in bringing their hearts to religious duties? And what a task is it to the carnal heart to abide at them? It is a pain to it, to leave the world but a little, to converse with God. It is not easy to borrow time from the many things, to bestow it upon the one thing needful. Men often go to God in duties, with their faces towards the world; and when their bodies are on the mount of ordinances, their hearts will be found at the foot of the hill, going after their covetousness, Ezek. xxxiii. 31. They are soon wearied of well-doing; for holy duties are not agreeable to their corrupt nature. Take notice of them at their worldly business, set them down with their carnal company, or let them be sucking the breasts of a lust; time seems to them to fly, and drive furiously, so that it is gone ere they are aware. But how heavily does it drive, while a prayer, a sermon, or a sabbath lasts?

The Lord’s day is the longest day of all the week with many; and therefore they must sleep longer that morning, and go sooner to bed that night, than ordinarily they do; that the day may be made of a tolerable length: for their hearts say within them, when will the sabbath be gone? Amos viii. 5. The hours of worship are the longest hours of that day: hence when duty is over, they are like men eased of a burden; and when sermon is ended, many have neither the grace nor the good manners to stay till the blessing be pronounced, but like the beasts, their head is away as soon as one puts his hand to loose them; why, but because while they are at ordinances, they are, as Doeg, detained before the Lord, 1 Sam. xxii. 7.</p></blockquote>

<blockquote><p>Those who speak out more plainly than bishop [David] Lindsay [d. 1641], do here object to us that reverence is due to the sacrament, and that we ourselves do reverence it when we sit uncovered at the receiving of it. But Didoclavius [the Scottish presbyterian, David Calderwood] does well distinguish betwixt veneration and adoration (Altare Damascenum, 1623, p. 809), because in civility we use to be uncovered, even to inferiors and equals for the regard which we bear to them, yet do we not worship them, as we worship the king on our knees. As, then, in civility there is a respect and reverence different from adoration, so it is in religion also. Yea [Cardinal Robert] Bellarmine himself distinguishes the reverence which is due to holy things from adoration. Paybody and Dr. Burgess [Formalists] will by no means admit this distinction betwixt veneration and adoration. But since neither of them has alleged any reason against it, I hope they will be weighed down by the authority of the [Romanist] Archbishop of Spalato [d. 1624], and the [Scottish] bishop of Edinburgh [David Lindsay], both of which agree to this distinction. So, then, we give no adoration at all to the sacrament, because neither by any outward nor inward action do we perform any worship for the honor of the same. Burgess himself has noted to us that the first Nicene Council exhorts that men should not be humiliter intenti [basely stretched out] to the things before them. We neither submit our minds nor humble our bodies to the sacrament, yet do we render to it veneration, for as much as we esteem highly of it as a most holy thing, and meddle reverently with it, without all contempt or unworthy usage. Res profecto inanimatae [Surely inanimate things], says the Archbishop of Spalato, sint sacrae quantum placet, alium honorem a nobis non merentur, nisi in sensu negativo [may be sacred so far as it may be fitting, not being deserving of another honor from us except in a negative sense], as that they be not contemned, nor unworthily handled. If it be said that we ought not to contemn the Word, yet has it not that respect given to it which the sacrament has, at which we are uncovered, so that this veneration given to the sacrament must be somewhat more than non prophanatio [a non-profanation]; I answer: as honor in the positive sense, so also in the negative, has various degrees: and according to the more or less immediate manifestation of divine ordinances to us, so ought the degrees of our veneration to be intended or remitted; which is not so to be understood as if one part of God’s sacred worship were to be less contemned then another (for none of God’s most holy ordinances may be in any sort contemned), but that for the greater regard of those things which are more immediately divine, we are not in the usage of them to take to ourselves so much scope and liberty as otherwise we may lawfully allow to ourselves in meddling with such things as are not merely, but mixedly divine, and which are not from God so immediately as the other, but more by the intervention of means. And thus a higher degree of veneration is due to the sacrament than to the Word preached, not by taking ought from the Word, but by adding more respect to the sacrament than the Word has. The reason hereof is given to be this, because when we come to the sacrament, nihil hic humanum, sed Divina omnia [nothing of this is of man, but is all divine], for Christ’s own Words are, or at least should be, spoken to us when we receive the sacrament, and the elements also are by Christ’s own institution holy symbols of his blessed body and blood. Whereas the Word preached to us is but mixedly and mediately divine, and because of this intervention of the ministry of men, and mixture of their conceptions with the holy Scriptures of God, we are bidden try the spirits [1 Jn. 4:1] and are required after the example of the Bereans to search the Scriptures daily whether these things which we hear preached be so or not. Now we are not in like sort to try the elements and the words of the institution, whether they be of God or not, because this is sure to all who know out of Scripture the first principles of the oracles of God. The consideration hereof warns us that the sacrament given according to Christ’s institution is more merely and immediately divine than is the Word preached. But others (I hear) object that if a man should uncover his head at the sight of a graven image, we would account this to be an adoring of the image; and why then shall not we call our uncovering at the sacrament adoration also? Answer: Though veneration and adoration be distinguished in holy things, to show that adoration given to them is idolatry, but veneration given to them is not idolatry, yet in profane things, such as images are, veneration given to them is idolatry as well as adoration: and we are idolaters for doing so much as to respect and reverence them, as things sacred or holy. For as I touched [upon] before, and as Zanchi evidences by sundry instances (bk. 1, de Viti. ext. cult. oppos., cols. 504-5), idolatry is committed when more estimation is had of anything, more dignity and excellency placed in it, and more regard had to it, than God allows, or than can stand with God’s revealed will. For a thing thus regarded, though it be not exalted, ut Deus simpliciter [as God simply], yet it is set up, tanquam Deus ex parte [like as unto God in some degree].</p></blockquote>

ender+to+it+veneration%2C+for+as+much+as+we+esteem+highly+of+it+as+a+most+holy+thing%2C+and+meddle+reverently+with+it%2C+without+all+contempt+or+unworthy+usage.+Res+profecto+inanimatae+%5BSurely+inanimate+things%5D%2C+says+the+Archbishop+of+Spalato%2C+sint+sacrae+quantum+placet%2C+alium+honorem+a+nobis+non+merentur%2C+nisi+in+sensu+negativo+%5Bmay+be+sacred+so+far+as+it+may+be+fitting%2C+not+being+deserving+of+another+honor+from+us+except+in+a+negative+sense%5D%2C+as+that+they+be+not+contemned%2C+nor+unworthily+handled.+If+it+be+said+that+we+ought+not+to+contemn+the+Word%2C+yet+has+it+not+that+respect+given+to+it+which+the+sacrament+has%2C+at+which+we+are+uncovered%2C+so+that+this+veneration+given+to+the+sacrament+must+be+somewhat+more+than+non+prophanatio+%5Ba+non-profanation%5D%3B+I+answer%3A+as+honor+in+the+positive+sense%2C+so+also+in+the+negative%2C+has+various+degrees%3A+and+according+to+the+more+or+less+immediate+manifestation+of+divine+ordinances+to+us%2C+so+ought+the+degrees+of+our+veneration+to+be+intended+or+remitted%3B+which+is+not+so+to+be+understood+as+if+one+part+of+God%E2%80%99s+sacred+worship+were+to+be+less+contemned+then+another+%28for+none+of+God%E2%80%99s+most+holy+ordinances+may+be+in+any+sort+contemned%29%2C+but+that+for+the+greater+regard+of+those+things+which+are+more+immediately+divine%2C+we+are+not+in+the+usage+of+them+to+take+to+ourselves+so+much+scope+and+liberty+as+otherwise+we+may+lawfully+allow+to+ourselves+in+meddling+with+such+things+as+are+not+merely%2C+but+mixedly+divine%2C+and+which+are+not+from+God+so+immediately+as+the+other%2C+but+more+by+the+intervention+of+means.+And+thus+a+higher+degree+of+veneration+is+due+to+the+sacrament+than+to+the+Word+preached%2C+not+by+taking+ought+from+the+Word%2C+but+by+adding+more+respect+to+the+sacrament+than+the+Word+has.+The+reason+hereof+is+given+to+be+this%2C+because+when+we+come+to+the+sacrament%2C+nihil+hic+humanum%2C+sed+Divina+omnia+%5Bnothing+of+this+is+of+man%2C+but+is+all+divine%5D%2C+for+Christ%E2%80%99s+own+Words+are%2C+or+at+least+should+be%2C+spoken+to+us+when+we+receive+the+sacrament%2C+and+the+elements+also+are+by+Christ%E2%80%99s+own+institution+holy+symbols+of+his+blessed+body+and+blood.+Whereas+the+Word+preached+to+us+is+but+mixedly+and+mediately+divine%2C+and+because+of+this+intervention+of+the+ministry+of+men%2C+and+mixture+of+their+conceptions+with+the+holy+Scriptures+of+God%2C+we+are+bidden+try+the+spirits+%5B1+Jn.+4%3A1%5D+and+are+required+after+the+example+of+the+Bereans+to+search+the+Scriptures+daily+whether+these+things+which+we+hear+preached+be+so+or+not.+Now+we+are+not+in+like+sort+to+try+the+elements+and+the+words+of+the+institution%2C+whether+they+be+of+God+or+not%2C+because+this+is+sure+to+all+who+know+out+of+Scripture+the+first+principles+of+the+oracles+of+God.+The+consideration+hereof+warns+us+that+the+sacrament+given+according+to+Christ%E2%80%99s+institution+is+more+merely+and+immediately+divine+than+is+the+Word+preached.+But+others+%28I+hear%29+object+that+if+a+man+should+uncover+his+head+at+the+sight+of+a+graven+image%2C+we+would+account+this+to+be+an+adoring+of+the+image%3B+and+why+then+shall+not+we+call+our+uncovering+at+the+sacrament+adoration+also%3F+Answer%3A+Though+veneration+and+adoration+be+distinguished+in+holy+things%2C+to+show+that+adoration+given+to+them+is+idolatry%2C+but+veneration+given+to+them+is+not+idolatry%2C+yet+in+profane+things%2C+such+as+images+are%2C+veneration+given+to+them+is+idolatry+as+well+as+adoration%3A+and+we+are+idolaters+for+doing+so+much+as+to+respect+and+reverence+them%2C+as+things+sacred+or+holy.+For+as+I+touched+%5Bupon%5D+before%2C+and+as+Zanchi+evidences+by+sundry+instances+%28bk.+1%2C+de+Viti.+ext.+cult.+oppos.%2C+cols.+504-5%29%2C+idolatry+is+committed+when+more+estimation+is+had+of+anything%2C+more+dignity+and+excellency+placed+in+it%2C+and+more+regard+had+to+it%2C+than+God+allows%2C+or+than+can+stand+with+God%E2%80%99s+revealed+will.+For+a+thing+thus+regarded%2C+though+it+be+not+exalted%2C+ut+Deus+simpliciter+%5Bas+God+simply%5D%2C+yet+it+is+set+up%2C+tanquam+Deus+ex+parte+%5Blike+as+unto+God+in+some+degree%5D.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies%2C+%281637%29+%7C+3rd+Part%2C+%E2%80%98Against+the+Lawfulness+of+the+Ceremonies%E2%80%99+%7C+ch.+4%2C+%E2%80%98That+the+ceremonies+are+idols+among+Formalists+themselves%3B+and+that+kneeling+in+the+Lord%E2%80%99s+Supper+before+the+Bread+%26+Wine+in+the+act+of+receiving+them+is+formally+idolatry%E2%80%99%2C+pp.+62-63&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa377dddf14.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a377dddf14.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/gillespie-rutherford-on-headcoverings-in-public-worship/#:~:text=Those%20who%20speak%20out%20more%20plainly,as%20unto%20God%20in%20some%20degree&amp;text=Those%20who%20speak%20out%20more%20plainly%20than%20bishop&amp;text=parte%20%5Blike%20as%20unto%20God%20in%20some%20degree" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8da87685d3" data-kw="">
<blockquote><p>Where is now our gay and gorgeous apparel?… our pompous shows? our various delights and pastimes? our riotous banquets? our effeminate songs? our melodious music? our lascivious dancing? our amorous embracings? All these things are vanished like shadows; but our sorrows come upon us thick…</p></blockquote>

</figure><figure class="quote" id="q-1ed3a9d77a" data-kw="">
<blockquote><p>As for the Love-feasts used in the primitive Church:

1. They had no religious state in divine worship, but were used only as moral signs of mutual charity. The Rhemists [Romanists] will have them called Coenas dominicas. But what-says Cartwright against them? ‘We grant that there were such feasts used in times past, but they were called by the name of [Greek] or Love-feasts, not by the name of the Lord’s Supper: neither could one without sacrilege give so holy a name to a common feast, which never had ground out of the Word, and which after for just cause was thrust out by the Word of God.’

2. If it be thought, that they were used as sacred signs of Christian charity, because they were eaten in the Church. I answer, the eating of them in the Church is forbidden by the apostle. ‘What?’ says he, ‘have ye not houses to eat and to drink in?’ or despise ye the Church of God? Aperte vetat, says [David] Pareus: commessationes in Ecclesia, quocunque fueo pingantur. Vocabant [Greek] charitates: sed nihil minus erant. Erant schismatum fomenta. Singulae enim sectae suas instituebant. And a little after: Aliquae Ecclesiae obtemperasse videntur. Nam Iustini temporibus Romana Ecclesia [Greek] non habuit. (Commentary in that place)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 5, p. 90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-53cb2189a7" data-kw="">
<blockquote><p>Q. 11. Is all use of images unlawful? A. God did so much hate idolatry and the neighborhood of the idolaters made it so dangerous to the Israelites that He did not only forbid the worshipping of images, but all such making or using of them as might become a snare or temptation to any. So that though it be lawful to make images for civil uses, and when they are made, to fetch holy thoughts or meditation from them, as from all other creatures or things in the world, yet in any case when they become a snare or danger (being not necessary things, they become a sin to those that so use them as [a] snare to others or themselves. Ex. 34:13-15; Num. 33:52; Dt. 7:2; Kn. 11:18 &amp; 23; 14:24. Q. 12. Is it lawful to make any picture of God? A. No: for pictures are the signs of corporeal things, and it is blasphemy to think God like a bodily substance: But it is lawful to make such pictures (as of a glorious light) from which occasion may be taken of good thoughts concerning God. Ex. 25:18, 1•… 20; 1 Sam. 4:4; Ps. 18:1; Eze. 10:2. Q. 13. Is it lawful to make the picture of Christ as man, or as crucified? A. The doing it as such is not forbidden, nor the right use of it when done: But the abuse, i.e. the worshipping of it or of Christ by it, is forbidden and the making or using such when it tends to such abuse and has more of snare than profit.</p></blockquote>

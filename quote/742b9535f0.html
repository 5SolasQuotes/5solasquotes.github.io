<blockquote><p>Quest. What is a Sacrament?

Answer. It is an outward Sign ordained of God, and is appointed to be unto the worthy receiver, as a Seal, either of our entrance into Christian profession as Baptism, or our continuance therein, as the Lords Supper. …

Q. How else may it be more briefly defined?

Answer. It is a visible pledge of those invisible benefits of our Salvation which we obtain by Christ.

Quest. How is our faith and Repentance furthered by the Sacrament of Baptism?

Answer. By the outward washing with Water is not only signified, and Sealed the inward washing away of our sins, by the blood of Christ and power of his Spirit, but also our covenant made then unto God, to forsake sin and to lead a new life. …

Quest. How is our Faith and Repentance furthered by the Sacrament of the Lord’s Supper?

A. By the worthy partaking of the outward Elements of Bread and Wine is signified and Sealed, the giving and receiving of Christs Body and Blood by Faith to be our Spiritual nourishment. …

Q. How else?

A. By the oft and worthy partaking thereof, we are not only provoked to a more serious examination of our Spiritual estate, but also by renewing our covenant made to God, to bind our selves more firmly to his service for time to come.</p></blockquote>

<blockquote><p>Dr. Forbess goes about to warrant private baptism by Philip’s baptizing the eunuch, there being no greater company present, so far as we can gather from the narration of Luke, Acts 8. As likewise by Paul and Silas, their baptizing the goaler [jailer] and all his in his own private house, Acts 16. Touching the first of those places, we answer:

1. How thinks he that a man of so great authority and charge was alone in his journey? We suppose a great man traveling in a chariot must have some number of attendants, especially having come to a solemn worship at Jerusalem.

2. What Philip then did, the extraordinary direction of the Spirit guided him unto it, vv. 29, 39. As to the other place, there was in that time of persecution no liberty for Christians to meet together in temples and public places as now there is. Wherefore the example of Paul and Silas does prove the lawfulness of the like deed in the like case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, … (1637), pt. 3, ch. 6, p. 96</span></figcaption>

<blockquote><p>…it becometh not Mr. Hooker with Arminians and Socinians to impeach the wisdom of the Holy One, because He appoints the giving of the seals, baptism to Judas and to Magus, who have no right, true and real in foro Dei [in the court of God], in the Decree of God, and in his holy intention, as I spake [on] pp. 248, 249, to the seals, and the grace sealed; nor to the engraven Law, and God’s teaching of the heart, and to perseverance; .. Again, God giveth a right to the seals to hypocrites; that is, he commandeth the Church to give the seals to Magus, whether such really or hypocritically believe; this is a right not properly inherent in visible members, for their profession, yea, or their supposed conversion:

1. Because all saving and real right to ordinances is relative to election to glory, and flows from the merit of Christ’s death; but visible professors, as such, of whose society Magus and Judas are, have not any saving and real right, as chosen and redeemed in Christ, by grant of our [Congregationalist] Brethren.

2. A right flowing only from an external profession, and from composed hypocrisy in Magus, is no true right; a lie cannot give a true right: I offend that Mr. Hooker so anxiously contends for a charter to such bastards as Magus.

3. It is a favor to hear the Gospel and partake of the seals; and jus activum, ‘an active right’ the Church and ministers have to call and admit to the seals all who profess as Magus, that the elect in the visible Church may be converted, but it is not a right proprie dictum ne quidem Ecclesiasticum [properly said with certainty to the Church], that they have who are such hypocrites as Judas and Magus; for the command and revealed Will of God most unproperly is said to give Magus a right to the seals: Except [for] Mr. Hooker, never [a] divine so spake; the command reveals the right, but gives none. As also the right of visible professors is jus passivum, and a conditional and passive right; for Magus and Judas have no right to be visible members, or to partake of the seals, yea or to profess the Covenant and Name of God, Ps. 50:16, but upon condition of faith: for God cannot command sin and an hypocritical profession: yea, He forbids [their] treading in his courts, Isa. 1:12-13, except they repent and believe, vv. 16, 17; therefore Magus sins in professing, and in being baptized: he remaining rotten. But the Church sins not, but does the command of Christ in calling, inviting all that profess, whether they be really, or in the judgement of charity, converts or no. Which distinction not being observed, our [congregationalist] Brethren and Mr. Hooker mistake the nature of an ecclesiastical right; for the Lord in the command gives to all visible professors, such as Peter, who really believe, both the ecclesiastic and external right to the seals which He decreed to give them, and the same internal and real right which they have by faith, and no other than according to his eternal decree, they have given them in time by real believing. But for hypocrites, as Magus, they have no right ecclesiastic to the seals, but a sort of active and permissive right, by which they claim room in the visible Church, and the seals from the Church. Therefore taking the Church-visible as only visible, as contra-distinguished from the invisible and really believing: and as visibility is common to both Peter and Magus, and their external profession obvious to the eye of man, so the visible Church hath no right that is true and real to the seals. So I retort the Argument upon Mr. Hooker: True real believers, as Peter, and hypocrites, as Magus, have either one and the same Church-right to membership and seals, or another, and diverse. The same right they cannot have:

1. Because the right of truly and really believing ones, is according to the decree of election, such as the Lord ordained to be purchased to them by the merits of Christ, and also according to the Lord’s revealed Will. He who believes hath right to eat of the Tree of Life, and to membership and seals: But this right Magus and hypocrites have not, for they have no part in Christ.

2. The right that believers, as Peter and John, have, is by fulfilling of the condition. He who believes, and loves to be reformed, hath right to the Covenant, promises, to perseverance, to the anointing that teacheth all things. These are promised and decreed to them, Jer. 31:33-34 &amp; 32:38-40; Isa. 54:10-11 &amp; 59:20-21; compared with Acts 13:47-48; Jn. 6:44-46 &amp; 6:37 &amp; 10:26-27; and to them only, not to Magus and to reprobates.

3. Magus, and such like wooden and tree-legs, might claim the same life, living membership, lively and vital operations, and to have the anointing, and to be kept through faith unto salvation by the power of God, 1 Pet. 1:4 and to have the fear of God put in their hearts, that they should not depart from God, as Jer. 31:39-40, if they have the same right to membership and the seals in their substance and grace signified with sound believers. And this is most absurd.</p></blockquote>

ne+quidem+Ecclesiasticum+%5Bproperly+said+with+certainty+to+the+Church%5D%2C+that+they+have+who+are+such+hypocrites+as+Judas+and+Magus%3B+for+the+command+and+revealed+Will+of+God+most+unproperly+is+said+to+give+Magus+a+right+to+the+seals%3A+Except+%5Bfor%5D+Mr.+Hooker%2C+never+%5Ba%5D+divine+so+spake%3B+the+command+reveals+the+right%2C+but+gives+none.+As+also+the+right+of+visible+professors+is+jus+passivum%2C+and+a+conditional+and+passive+right%3B+for+Magus+and+Judas+have+no+right+to+be+visible+members%2C+or+to+partake+of+the+seals%2C+yea+or+to+profess+the+Covenant+and+Name+of+God%2C+Ps.+50%3A16%2C+but+upon+condition+of+faith%3A+for+God+cannot+command+sin+and+an+hypocritical+profession%3A+yea%2C+He+forbids+%5Btheir%5D+treading+in+his+courts%2C+Isa.+1%3A12-13%2C+except+they+repent+and+believe%2C+vv.+16%2C+17%3B+therefore+Magus+sins+in+professing%2C+and+in+being+baptized%3A+he+remaining+rotten.+But+the+Church+sins+not%2C+but+does+the+command+of+Christ+in+calling%2C+inviting+all+that+profess%2C+whether+they+be+really%2C+or+in+the+judgement+of+charity%2C+converts+or+no.+Which+distinction+not+being+observed%2C+our+%5Bcongregationalist%5D+Brethren+and+Mr.+Hooker+mistake+the+nature+of+an+ecclesiastical+right%3B+for+the+Lord+in+the+command+gives+to+all+visible+professors%2C+such+as+Peter%2C+who+really+believe%2C+both+the+ecclesiastic+and+external+right+to+the+seals+which+He+decreed+to+give+them%2C+and+the+same+internal+and+real+right+which+they+have+by+faith%2C+and+no+other+than+according+to+his+eternal+decree%2C+they+have+given+them+in+time+by+real+believing.+But+for+hypocrites%2C+as+Magus%2C+they+have+no+right+ecclesiastic+to+the+seals%2C+but+a+sort+of+active+and+permissive+right%2C+by+which+they+claim+room+in+the+visible+Church%2C+and+the+seals+from+the+Church.+Therefore+taking+the+Church-visible+as+only+visible%2C+as+contra-distinguished+from+the+invisible+and+really+believing%3A+and+as+visibility+is+common+to+both+Peter+and+Magus%2C+and+their+external+profession+obvious+to+the+eye+of+man%2C+so+the+visible+Church+hath+no+right+that+is+true+and+real+to+the+seals.+So+I+retort+the+Argument+upon+Mr.+Hooker%3A+True+real+believers%2C+as+Peter%2C+and+hypocrites%2C+as+Magus%2C+have+either+one+and+the+same+Church-right+to+membership+and+seals%2C+or+another%2C+and+diverse.+The+same+right+they+cannot+have%3A+1.+Because+the+right+of+truly+and+really+believing+ones%2C+is+according+to+the+decree+of+election%2C+such+as+the+Lord+ordained+to+be+purchased+to+them+by+the+merits+of+Christ%2C+and+also+according+to+the+Lord%E2%80%99s+revealed+Will.+He+who+believes+hath+right+to+eat+of+the+Tree+of+Life%2C+and+to+membership+and+seals%3A+But+this+right+Magus+and+hypocrites+have+not%2C+for+they+have+no+part+in+Christ.+2.+The+right+that+believers%2C+as+Peter+and+John%2C+have%2C+is+by+fulfilling+of+the+condition.+He+who+believes%2C+and+loves+to+be+reformed%2C+hath+right+to+the+Covenant%2C+promises%2C+to+perseverance%2C+to+the+anointing+that+teacheth+all+things.+These+are+promised+and+decreed+to+them%2C+Jer.+31%3A33-34+%26+32%3A38-40%3B+Isa.+54%3A10-11+%26+59%3A20-21%3B+compared+with+Acts+13%3A47-48%3B+Jn.+6%3A44-46+%26+6%3A37+%26+10%3A26-27%3B+and+to+them+only%2C+not+to+Magus+and+to+reprobates.+3.+Magus%2C+and+such+like+wooden+and+tree-legs%2C+might+claim+the+same+life%2C+living+membership%2C+lively+and+vital+operations%2C+and+to+have+the+anointing%2C+and+to+be+kept+through+faith+unto+salvation+by+the+power+of+God%2C+1+Pet.+1%3A4+and+to+have+the+fear+of+God+put+in+their+hearts%2C+that+they+should+not+depart+from+God%2C+as+Jer.+31%3A39-40%2C+if+they+have+the+same+right+to+membership+and+the+seals+in+their+substance+and+grace+signified+with+sound+believers.+And+this+is+most+absurd.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Survey+of+that+Sum+of+Church-Discipline+Penned+by+Mr.+Thomas+Hooker%2C+%281658%29+%7C+ch.+16%2C+%E2%80%98Of+the+Principal+%26+Prime+Subject+of+All+the+Privileges+of+Special+Note+Bestowed+in+the+Mediator+Christ+upon+the+Church%E2%80%99%2C+pp.+77-81&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4fdc8f7be5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4fdc8f7be5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments#:~:text=it%20becometh%20not%20Mr.%20Hooker%20with,believers.%20And%20this%20is%20most%20absurd&amp;text=it%20becometh%20not%20Mr.%20Hooker%20with%20Arminians%20and&amp;text=with%20sound%20believers.%20And%20this%20is%20most%20absurd" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c12160be28" data-kw="">
<blockquote><p>XI. Whether any other but a minister. lawfully called and ordained, may administer the sacraments, baptism and the Lord’s Supper? ([Margin Note:] Thus the Augsburg Confession says, ‘De ordine ecclesiastico docent ecclesiae nostrae, quod nemo in ecclesia debeat publice docere, aut sacramenta administrare, nisi rite vocatus, quae confessionis verba opposita sunt calumniis pontificiorum, qui dic•t omnia in ecclesiis nostris confuse et sine ordine geri et cuivis in ecclesia docendi potestatem apud nos concedi.’ [Johann] Gerhard, Common Places, ‘On the Ecclesiastical Minister’, ch. 3, sect. 1, ‘Res inter se perpetuo nexu conjunctae, pascere ecclesiam salutis doctrina, et sacramenta administraro.’ Calvin, Catechism of the Christian Religion. See Master [Richard] Baxter’s, Infant Church-Membership, part 2, errour 2 &amp; 3) It is held by the reformed Churches, and by the soundest protestant writers, that neither of these sacraments may be dispensed by any, but by a minister of the Word, lawfully ordained.

      1. God has appointed the ministers of the Word, lawfully called and ordained, and no other to be stewards and dispensers of the mysteries of Christ, 1 Cor. 4:1; Tit. 1:5,7.

      2. He has appointed them to be pastors or shepherds, to feed the flock of God, Jer. 3:15; Eph. 4:11; Acts 20:28; 1 Pet. 5:2; much of this feeding consists in the dispensation of the sacraments.

      3. Christ gives a commission to the apostles to teach and baptize, and extends the same commission to all teaching ministers to the end of the world, Mt. 28:19,20; Eph. 4:11-13. Neither of the sacraments have efficacy, unless they be administred by him that is lawfully called thereunto, or a person made public and clothed with authority by ordination. This error in the matter of baptism is begot by another error of the absolute necessity of baptism. Mr. [Alexander] Henderson’s second paper to the king. The Scripture joins together the preaching of the Word and dispensations of the seals, both belonging to the officers who have received commission from Jesus Christ, Mt. 28:19; 1 Cor. 1. Mr. [John] Ball. Heb. 5:4, ‘No man takes this honour but he which is called, as was Aaron;’ which sentence does manifestly shut out all private persons from administration of baptism, seeing it is a singular honor in the Church of God. [Thomas] Cartwright, 2nd Reply [to John Whitgift], 11th Tractate. The example of Zipporah either was rash or singular, and also no way like women’s baptizing; circumcision was then commanded [to] the head of the family, baptism belongs only to ministers, Mt. 28; she circumcised her son when he was not in danger of death, as these [do that] baptize.</p></blockquote>

 it online · Reformed Books Online</a></div>

<blockquote><p>Nor is it [baptism] to be administered in private places, or privately, but in the place of public worship, and in the face of the congregation, where the people may most conveniently see and hear; and not in the places where fonts, in the time of Popery, were unfitly and superstitiously placed.</p></blockquote>

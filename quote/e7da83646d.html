<main class="wrap"><figure class="quote" id="q-e7da83646d" data-kw="">
<blockquote><p>After this Examination of the Convert, this following Prayer was made.

O Eternal God, how wonderful art thou in thy works! Thou hast been found by those who have not sought thee; Thy grace hath prevented their thoughts. It is neither from him that willeth, nor from him that runneth, but from thy mercy alone that Salvation doth proceed. It is neither from the West, nor from the East, but from thy wonderful dispensation; when it pleaseth thee, thou stretchest forth thy arm from the height of Heavens to the bottom of the Abyss, to pluck out those who were already on the brink of Hell; O God who hast commanded that light should shine in the midst of darkness, enlighten the flames of thy truth amongst those who do lie in the valley of the shade of Death, that the most barbarous people may see the ways &amp; traces of thy Christ; that the pavilions of Ismael, and of Midian may be shaken, that the sheep which are not yet in thy fold may henceforth be brought into it.

Behold here a Soul which prostrates it self at thy feet to be washed in the blood of thy holy Son Jesus, in the blood of that sprinkling which speaketh for Sinners; be pleased to pardon this poor Sinner that is here present; pardon the faults committed by him in the time of his ignorance; cause thou the Scales to fast from his eyes. Create in him a new heart, that being a new Creature he may walk in righteousness and holiness. Cause thou that the Baptism which according to thy ordinance we do confer upon him be effectual to his salvation, that it may redound to the glory of thy great name, to the joy of thy Angels, and to the comfort of those who love thy Anointed who is blessed for evermore.

Immediately after this Prayer, the Convert being on his knees was baptized, presented by Monsieur Armand of Caumont Marquis of Montpouillan, and the Lady Adrian de Mayern who were his Godfather and Godmother, from whom he received the name of Armand Adrian.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c7037dede4" data-kw="">
<blockquote><p>We have a proof of this in Cornelius the centurion, who, after he had been previously endued with the graces of the Holy Spirit, was baptised for the remission of sins, not seeking a fuller forgiveness from baptism, but a surer exercise of faith; nay, an argument for assurance from a pledge. It will, perhaps, be objected, Why did Ananias say to Paul that he washed away his sins by baptism (Acts 22:16), if sins are not washed away by the power of baptism? I answer, we are said to receive, procure, and obtain, whatever according to the perception of our faith is exhibited to us by the Lord, whether he then attests it for the first time, or gives additional confirmation to what he had previously attested. All then that Ananias meant to say was, Be baptised, Paul, that you may be assured that your sins are forgiven you. In baptism, the Lord promises forgiveness of sins: receive it, and be secure. I have no intention, however, to detract from the power of baptism. I would only add to the sign the substance and reality, inasmuch as God works by external means.</p></blockquote>

</figure><figure class="quote" id="q-ea02c3cad9" data-kw="">
<blockquote><p>There is a necessity of baptism in respect of Gods ordinance, which bindeth us to administer it: but we affirm not such a necessitatem medii, that all they should be absolutely excluded from the Kingdom of Heaven, who die without baptism, as many infants do. That uncharitable opinion we leave to the maintainers thereof, we have no warrant so to judge: and therefore we say, that not the bare privation, but the contempt of the Sacrament condemneth; of which Infants cannot be guilty.

So that if you clearly mean a necessitate medii in respect of the external ministry of man, your proposition is not true, nor owned by us: but if you mean a necessity in respect of our duty in baptizing infants, or their spiritual baptism by regeneration, we so far consent; but then we cannot excuse your medium for an homonomia, which concludeth not an absolute exclusion of all persons unbaptized; is apparently false, in the example of the penitent thief, saved but not baptized, and in charity to be concluded so, in elect children dying before they are baptized …</p></blockquote>

<blockquote><p>Regarding the baptism of infants, we have stated our case sufficiently and more: we consider it nothing else than the holy washing of regeneration. Yet at the same time, we do not suppose that our salvation depends upon the sacrament of baptism, but upon our adoption according to the covenantal formula: “I will be your God and that of your seed.” [Gen. 17:7] We diligently attend to this adoption in the children of the saints according to the Word of the Lord since it has been sealed upon them through the sacrament of baptism… …little corruptions have arisen from no other source than from the understanding that baptism is necessary for salvation, which we consider entirely false. We hold this view to be false because adoption by God must take place before anyone can be baptized rightly. Otherwise why is a confession of faith required of adults before they are baptized?… …those children whom (we claim) the Lord has already truly adopted before, according to the covenantal formula, are introduced into the outward company of the church through baptism. Thus we leave the hidden judgments to God, just as we should.</p></blockquote>

<blockquote><p>Q. What is Baptism?

A. A Sacrament of Regeneration, wherein by the outward washing of the body with water in the name of the Father, the Son, and the Holy Ghost, the inward cleansing of our souls by the blood of Christ is represented and sealed up unto us.

Q. Who are to be baptized?

A. They who in charity may be thought to be in the Covenant.

[Q.] Who are they?

A. Both all that profess themselves to be of the Christian faith, and also their children.

Q. What ground have we to judge the children of Christians to be in the Covenant?

A. The extent of God’s promise which reacheth even to them.

Q. How oft may one be baptized?

A. Only once: for once only we are born again and engrafted into Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A short catechism wherein are briefly handled the fundamental principles of Christian religion. Needful to be known of all Christians before they be admitted to the Lords Table. Whereunto are added sundry prayers</cite>, (London, 1635), unpaginated.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Q. What is Baptism?

A. A Sacrament of Regeneration, wherein by the outward washing of the body with water in the name of the Father, the Son, and the Holy Ghost, the inward cleansing of our souls by the blood of Christ is represented and sealed up unto us.

Q. Who are to be baptized?

A. They who in charity may be thought to be in the Covenant.

[Q.] Who are they?

A. Both all that profess themselves to be of the Christian faith, and also their children.

Q. What ground have we to judge the children of Christians to be in the Covenant?

A. The extent of God’s promise which reacheth even to them.

Q. How oft may one be baptized?

A. Only once: for once only we are born again and engrafted into Christ.”

— William Gouge, A short catechism wherein are briefly handled the fundamental principles of Christian religion. Needful to be known of all Christians before they be admitted to the Lords Table. Whereunto are added sundry prayers, (London, 1635), unpaginated.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQ.+What+is+Baptism%3F%0A%0AA.+A+Sacrament+of+Regeneration%2C+wherein+by+the+outward+washing+of+the+body+with+water+in+the+name+of+the+Father%2C+the+Son%2C+and+the+Holy+Ghost%2C+the+inward+cleansing+of+our+souls+by+the+blood+of+Christ+is+represented+and+sealed+up+unto+us.%0A%0AQ.+Who+are+to+be+baptized%3F%0A%0AA.+They+who+in+charity+may+be+thought+to+be+in+the+Covenant.%0A%0A%5BQ.%5D+Who+are+they%3F%0A%0AA.+Both+all+that+profess+themselves+to+be+of+the+Christian+faith%2C+and+also+their+children.%0A%0AQ.+What+ground+have+we+to+judge+the+children+of+Christians+to+be+in+the+Covenant%3F%0A%0AA.+The+extent+of+God%E2%80%99s+promise+which+reacheth+even+to+them.%0A%0AQ.+How+oft+may+one+be+baptized%3F%0A%0AA.+Only+once%3A+for+once+only+we+are+born+again+and+engrafted+into+Christ.%E2%80%9D%0A%0A%E2%80%94+William+Gouge%2C+A+short+catechism+wherein+are+briefly+handled+the+fundamental+principles+of+Christian+religion.+Needful+to+be+known+of+all+Christians+before+they+be+admitted+to+the+Lords+Table.+Whereunto+are+added+sundry+prayers%2C+%28London%2C+1635%29%2C+unpaginated.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd87622f9f0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d87622f9f0.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/10/01/william-gouge-on-infant-baptism-as-a-term-of-communion/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

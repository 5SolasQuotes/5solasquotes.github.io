<blockquote><p>We acknowledge separation from corruption, but not from the worship of corrupters, when they keep the foundation; the Samaritan-Church had not the foundation, but worshipped they knew not what, neither was there salvation in their Church, Jn. 4:2; but there was the true God worshipped among the Jews and salvation amongst them.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-15e78e36c0" data-kw="">
<blockquote><p>Conclusion 2. That a real and approved holiness is a sure-note that the error which they hold is not a damning, destroying error. I say, though the holiness of those men that maintain an opinion, be not a sure note that the opinion they maintain is a truth, yet it is a certain evidence that it is not an undoing and destructive error. Christ says that the elect shall not be deceived, Mt. 24:24, that is, though they may be carried aside with some sinful, yet they shall not be drawn away with undoing errors. And we have all the harmony of Scripture for that: He tells us that they who do his will, shall know his doctrine, that we shall all be taught of God, that we shall hear his voice, and shall not follow the voice of strangers, and that we have received an anointing of the holy One, whereby we know all things. All which places are to be understood of necessary truths, not accessory; of truths that are essential and fundamental, not circumstantial: and it proves fully to us that God will never give up his holy ones to undoing errors. That’s the second answer; that holiness is a sure note, that the opinions which they hold (though an error) yet it is not a damning and destroying error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error... (1646)</cite>, p. 166</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

20destroying%20error" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7e085b9b29" data-kw="">
<blockquote><p>The Church of Corinth was defiled with many sins, and horrible outrages, both in life and doctrine, they were deriders, sectaries, incestuous, profaners of the Lord’s Supper, deniers of the most essential article of the resurrection; yet so long as the ministry of the Word and sacraments was not utterly rejected, Paul acknowledges them a glorious Church. Certainly tares and unclean vessels are in the Church, yet let us endeavor ourselves to be good corn, and not go out of the Church, but follow the counsel of Augustine: Corripiat homo, quod potest, quod non potest, patienter ferat; Let a man reprove what he can (without danger of schism) and what he cannot, let him patiently suffer, but let him never make separation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-otes.html">Samuel Otes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Explanation of the General Epistle of Saint Jude (London: Purslow, 1633), sermon 19</cite>, p. 227</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-454f9c5b4b" data-kw="">
<blockquote><p>3rd Argument. If Paul do not only not command separation in the Church of Corinth, but also command and approve their meeting together in Church-communion, 1 Cor. 5:4; 11:18, 20-22; 14:23; 16:2, where there was: Schisms and contentious, 1 Cor. 1:12-13, envying and strife, 1 Cor. 3:3, incest, and incest tolerated, such as is not named amongst the gentiles, 1 Cor. 5:1, going to law with their brethren for gain before infidels, 1 Cor. 6, harlotry, vv. 15-16, eating at the idols’ table, 1 Cor. 8, keeping fellowship with devils, 1 Cor. 10:20-22, coming to the Lord’s Table drunken, 1 Cor. 11:21, eating and drinking damnation, vv. 29-30. A denying of a fundamental point of faith, the resurrection of the dead, and that with scoffing at it, 1 Cor. 15:35, murdering of weak souls, whom Christ had died for, 1 Cor. 8:12-13, Paul’s name despitefully traduced, 2 Cor. 10:8-9, etc. Then it is unlawful to separate from the pure worship of God, because a Church is not constituted of visible saints and a people all taught of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbyterie in Scotland… (London: Bartlet, 1642), ch. 10, ‘Whether or not it be lawful to separate from a true Church visible, for the corruption of teachers… where faith is begotten by the preaching of professed truth?’</cite>, pp. 141-42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-6595eacc6b" data-kw="">
<blockquote><p>That in endeavoring union and healing men would not straiten it to an universal union in everything, in judgement and practice, but would resolve to have it with many things defective that need forbearance in persons that are united, which men may take up in these particulars: 1. There may be difference of judgement in many things, I mean in such things that are consistent with the foundation and edification; and such a forbearance would be resolved upon, and to do otherways were to think that either men had no reason at all, or that their understandings were perfect, or at least of equal reach. 2… certainly, if people ought to carry even to corrupt ministers who yet destroy not the foundation, as ministers, in the duties that becomes them to ministers in communion with them, while they continue such, then certainly ministers ought to keep that communion with ministers, that becomes their relations, seeing they are still ministers in that respect, as well as in the other. And if this corruption will not warrant separation in other ordinances, as was said in the close of the second part, then neither will it warrant division in the ordinance of government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dying Man’s Testament… (Edinburgh: Higgins, 1659), pt. 4, ch. 7, ‘General Grounds leading to Unity’</cite>, pp. 316–18</span></figcaption>

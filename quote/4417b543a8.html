<main class="wrap"><figure class="quote" id="q-4417b543a8" data-kw="">
<blockquote><p>…to appear in the likeness of a flame of fire in a bush, and the bush not consumed, is not an impossible work to a created angel: yet it was God Himself, even Christ the Son of God that so appeared: for He is called the God of Abraham, the God of Isaac, Ex. 3:6, which could be no angel. And Moses pronouncing a blessing upon Joseph, says, The good will of him that dwelt in the bush, shall come upon the head of Joseph, Deut. 33:16, but God only has the power and authority of blessing… It was God therefore, and not an angel that appeared in the bush. Now then by these places given in instance it is evident, that some things said to be done by God in the Scriptures, not exceeding the power of angels, were so done by the Lord Himself, and not by the angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Genesin &amp; Exodum: that is, A Sixfold Commentary... (London: Haviland, 1633), Question 20, ‘Whether Jehovah Christ Jesus appeared not in the Old Testament, but only, or usually the angels’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<blockquote><p>It’s further also to be observed in the general, that God has always had apparitions suitable to the matter in hand. Thus He appeared in a burning bush to Moses, like an armed man to Joshua; and with all signs of majesty, and a great God, being to deliver laws to the people that they might see how potent He was to be avenged for every breach.</p></blockquote>

</figure><figure class="quote" id="q-1dff4e8341" data-kw="">
<blockquote><p>Your long labor in setting down the faults to be found in our Liturgy is to small purpose. The Nonconformists do except against many things appointed in the Book, as inconvenient at least, and such as should be taken away or reformed, as the reading of Apocryphal books under the title of holy Scripture, specially such parts as be corrupt for matter: The cross and surplice as idolothites by participation and signs of mystical signification: The corruptions in the translations: and some things in the forms of burial, matrimony, thanksgiving for women after child-bed, etc. But these they condemn not as idolatry, nor as that which makes the worship itself false and idolatrous. It is one thing to say such a rite is inconvenient, superstitious, scandalous borrowed from the Papists, not warranted by the Word of God, in the use will-worship, if the word be taken largely; another that the worship itself is false and idolatrous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists… (London: R.B., 1642), ch. 2</cite>, p. 29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<main class="wrap"><figure class="quote" id="q-1357bccbda" data-kw="">
<blockquote><p>Recreation is an exercise joined with the fear of God, conversant with things indifferent, for the preservation of bodily strength and the confirmation of the mind in holiness (Eccl. 2.2; Isa. 5.12; 1 Cor. 10.9; Luke 6.25; Deut. 12.7). To this end has the Word of God permitted shooting (2 Sam. 1.18), musical consort (Neh. 7.67), putting forth riddles (Judges 14.12), hunting of wild beasts (Cant. 2.15), searching out or the contemplation of the works of God (1 Kings 4.33).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Order &amp; Causes of Salvation &amp; Damnation in The Works of William Perkins, vol. 1</cite>, pp. 57-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d42f7d329e" data-kw="">
<blockquote><p>The reasons by which it appears that this restraint of kindling a fire [by the Israelites in the wilderness] on the Sabbath day [Ex. 35:3] was only temporary, are these: … Secondly, this seems to cross our Savior’s general rule, Mk. 2:27, that the Sabbath was made for man, and not man for the Sabbath; He means for man’s comfort and refreshing, for which kindling of fire and dressing of meat may be, and are in a sort necessary. Thirdly, our Savior allows the loosing of a beast from the stall, and leading of him to the water on the Sabbath day: now we know, the beast might be provided for by setting water in the stall overnight, which would refresh it sufficiently, and better than meat dressed overnight could comfort many men. Fourthly, we find our Savior present at a great feast, Lk. 14:1, where many, and it seems persons of quality, verses 7, 12, were bidden: now it is very unlikely that the provisions for that feast were dressed over night; and if it were dressed on that day, neither would the Pharisee have permitted, nor our Savior have countenanced the dinner with his presence, if dressing of meat, kindling of fires on the Sabbath day, had been forbidden by the law. Now why the dressing of manna, while the Israelites were in their peregrination in the wilderness was forbidden, though the dressing of other meats might be allowed afterwards, there may be some reason given. For manna it may be… as good and comfortable eaten cold as hot, and the preparing overnight, might be no inconvenience at all; howsoever it is out of question that in that unsettled condition of the Israelites wandering in the wilderness, when they were enforced to pick up fuel, where they could get it, baking and boiling must needs be more troublesome and laborious than it was afterwards in Canaan, where being settled in their dwellings, they had all things whereof they were to make use for such works provided and ready at hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Way to the Tree of Life Discovered in Sundry Directions for the Profitable Reading of the Scriptures... (1647), A Digression concerning the Morality of the Fourth Commandement, Section III, ‘The Morality &amp; Perpetuity of the Sabbath Proved out of the Fourth Commandement’, pp. 294-95 White was a Westminster divine.</cite></span></figcaption>

</figure><figure class="quote" id="q-eb0567b629" data-kw="">
<blockquote><p>And yet so far only to exercise it [the body on the Lord’s Day] as not to tire and weary it, if urgent occasion do not require, lest wearisomeness require some such recreation thereof as is nor [not] meet. … Whence it follows that all bodily recreations that do not further us to divine worship, are unlawful on the Lord’s Day: Because they serve only to refresh the body after labor; which is restrained therefrom; otherwise I say, then they shall make us fitter to serve God, when we have any liberty to labor upon case of necessity, though we may use that liberty to wearisomeness, yet this is to be relieued specially with spiritual recreation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cooper.html">Thomas Cooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wilie Beguile Ye, or The Worldling’s Gain… (London, 1621), Conclusion to the Reader, pp. 53-54 Cooper (1569/70 – 1626 or later) was an English puritan; works.</cite></span></figcaption>

<blockquote><p>…in the doctrine of scandal, which is more intricate and obscure than every divine conceives, God places acts of providential necessity as emergent significations of his approving will, which are so to us in place of a divine commandment of God’s revealed will, and these providential acts of necessity do no less oblige us to moral obedience than any of the express written commandments of God. I clear it thus: There is an express law, It is sin and unlawful for David, or any man, who is not one of the Lord’s priests, to eat showbread. But God comes in and puts David in such a posture of divine providence that if he eat not showbread, he shall be sinfully guilty of violating a higher moral law of God, who says, ‘I will have mercy and not sacrifice.’ Then David shall be cruel to his own life, and sin against the Sixth Commandment, ‘Thou shalt do no murder,’ if he eat not; for not to eat, when you are in a providential condition of starving, if you may have it, is to kill yourself, and this providential condition does no less oblige you to the moral obedience of the Sixth Command than if God in the letter of the Law should command you to eat. This fact of David was not done by any extraordinary impulsion of the Spirit, but by a constant channel that providence ordinarily runs in, according to which I, or any professor [of Christianity] must be obliged to prefer a work of mercy to sacrifice, that is, by which we are to give obedience to the Sixth Command, which is not to kill; even as without extraordinary impulsion, I may absent myself from hearing the Word when I find going to Church may endanger my life, for non-obedience to affirmatives [affirmative commands] in a greater necessity is ordinary. And therefore Christian prudence, with which the Wisdom of God keeps house, Prov. 8:12, does determine many things of scandal: And prudence is a virtue commanded in the Word of God, for a wise man observes times, and so will he observe all other circumstances… Now these [things against a positive divine law] we are upon no ordinary necessity to do, but such as may encroach upon the hazard of the loss of life, in which case an exigence of providence does stand for a command of non-murdering; had Saul and his army been reduced to a danger of starving in a wilderness, and could have no food except they should kill and eat the cattle of the Amalakites, conceive the Lord’s preferring of mercy before sacrifice should warrant them to eat of the Amalakites cattle, yet would this providential necessity be so limited as it may fall out that it stand not for a divine command, for it holds in affirmative commands only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646), Appendix, Intro to Scandal, question 6</cite>, pp. 81-83</span></figcaption>

ds%5D+in+a+greater+necessity+is+ordinary.+And+therefore+Christian+prudence%2C+with+which+the+Wisdom+of+God+keeps+house%2C+Prov.+8%3A12%2C+does+determine+many+things+of+scandal%3A+And+prudence+is+a+virtue+commanded+in+the+Word+of+God%2C+for+a+wise+man+observes+times%2C+and+so+will+he+observe+all+other+circumstances%E2%80%A6+Now+these+%5Bthings+against+a+positive+divine+law%5D+we+are+upon+no+ordinary+necessity+to+do%2C+but+such+as+may+encroach+upon+the+hazard+of+the+loss+of+life%2C+in+which+case+an+exigence+of+providence+does+stand+for+a+command+of+non-murdering%3B+had+Saul+and+his+army+been+reduced+to+a+danger+of+starving+in+a+wilderness%2C+and+could+have+no+food+except+they+should+kill+and+eat+the+cattle+of+the+Amalakites%2C+conceive+the+Lord%E2%80%99s+preferring+of+mercy+before+sacrifice+should+warrant+them+to+eat+of+the+Amalakites+cattle%2C+yet+would+this+providential+necessity+be+so+limited+as+it+may+fall+out+that+it+stand+not+for+a+divine+command%2C+for+it+holds+in+affirmative+commands+only%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government...+%281646%29%2C+Appendix%2C+Intro+to+Scandal%2C+question+6%2C+pp.+81-83&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb571955e76.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b571955e76.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-positive-laws-ordinances/#:~:text=in%20the%20doctrine%20of%20scandal%2C%20which,it%20holds%20in%20affirmative%20commands%20only&amp;text=in%20the%20doctrine%20of%20scandal%2C%20which%20is%20more&amp;text=command%2C%20for%20it%20holds%20in%20affirmative%20commands%20only" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>So to draw the ox out of the ditch, and to lead cattle to watering, I take it to be a work of mercy, as tending to the preservation of life in a dumb creature. In like sort the dressing [preparing] of meat for the health of man’s body, I take to be a work of mercy. So that the performing of these in reference to the end whereto they tend, I take to be of necessary duty (as here they are called works of necessity) and consequently not permitted only, but commanded also in the general, though not in this [fourth] commandment; but in the Second Commandment of the Second Table only…</p></blockquote>

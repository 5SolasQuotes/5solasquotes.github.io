<blockquote><p>There is no cause why any man should deny this epistle, as maintaining the popish sacrament of extreme unction, for that it does not, but speaks of the use of the gift of healing which was in the primitive church in the elders of the congregation, expressed by the outward sign of anointing with oil, as it is manifest, Mk. 6:13. Whereof, as Bede thinks, came the custom of anointing them that were possessed with devils, and the sick with oil, which he confesses might be done not only of the priests, but also of every Christian in their necessity, as Innocent teaches. Therefore, although he allow the ceremony, yet he allows not your sacrament, which may be ministered by none but by a priest, and unto none, but them that be in extremity of sickness, when health is despaired: yea, Bede understands it to pertain not only to them that are sick in body, but also to them that are weak in faith, though they be whole in body. “Commanding,” says he, “him that is weak in body, or in faith, that he which has sustained a greater wound, should remember to cure himself with the aid of more men, and them of the elder sort, neither should refer the cause of his weakness to the younger sort, and less learned, lest he receive by them, any hurtful speech or counsel.” You see therefore, that even the custom and use of the ceremony is greatly changed from the days of Bede, which is but seven or eight hundred years ago. For in the popish church one priest is sufficient, young or old, who comes not to give any ghostly counsel, but commonly when a man is past his senses. It is certain therefore, that in Bede’s time, this anointing was not taken for a sacrament. But you say, what dishonor is it to God that a sacrament should be instituted in oil more than in water, etc. Verily if God had instituted any such perpetual sacrament in oil, as He does in water, we would nothing doubt of it. But this sign of anointing was temporal, as the gift of healing whereunto it was annexed was but for a season, and that does this Scripture tell us sufficiently, seeing experience testifies that the gift of healing does not now remain. Where you say the church of God has always used it, it is false: for the Greek church never received it to this day as a sacrament, and for many hundred years it was counted a free ceremony in the Latin church, as appears by the epistle of Innocent and that which Bede writes, that it was lawful for all Christians to use it. But when we say it pertained to the gift of healing, you ask, “whether Christ appointed any certain creature or external element unto the apostles generally to work miracles by.” I answer no: for with external sign and without, they did miracles. Yet it appears, Mk. 6:13, that He appointed them to anoint the sick with oil that they might recover health, though it were not necessary so to do at all times, when they healed the sick. Where you say, “that Christ would have miracles in the beginning wrought by sundry sacraments which remain, the miracles ceasing,” we find no such matter, which it were so, the institution and commandment of the perpetuity of them were sufficient for their continuance. You demand, “whether ever we read or heard that men were generally commanded to seek for their health by miraculous means?” We read that men were commanded generally to seek all spiritual and miraculous gilts, as long at God gave them, and not health only, but the gift of healing also, 1 Cor. 12:31; ch. 14:1, under the general rule of submitting all our requests and whole will to God’s will. You demand, whether all priests or elders had the gift of miracles in the primitive church. We answer, it is not necessary that every one had the gift of healing, yet among the company of elders that were in every church, some doubtless had when others had which were not elders of the church. Or the gift might be given to the whole number, which every one had not, as Paul speaks of the gift of prophecy, given by laying on of the hands of the elders, 1 Tim. 4:14. Neither would the apostle promise health, if the gift of healing had not been general in every congregation. But though the apostles had the gift to cure men and revive them, yet there was no such general precept to call for the apostles, to heal men or restore them: so long as that gift continued in the church, it was all men’s duty to seek the use of it, so far as it would stand with God’s pleasure. Therefore as Paul sets down an order for the right use of the gifts of tongues, 1 Cor. 14:27, so does James here for the gift of healing. You ask if any external element, or miraculous practice unless it were a sacrament, had promise of the remission of all kind of actual sins joined to it? But neither has the element of oil any such promise annexed unto it, but the prayers of the faithful, as 1 John 5:6. You ask whether James could institute such a ceremony of himself? etc. We say he did not institute any such ceremony as you speak of, nor mentions any such, but wills the gift of healing, to be used according as God had appointed. As for the promise of remission of sins, he annexes it not to the element, but out of the general doctrine of prayer, he shows the fruit thereof to be the obtaining of remission of sins. But at “other times,” you say, “we rail at the popish church, for annexing of remission of sins, to the element of water. Here we are driven to hold that James prescribed a miraculous oil, which had much more power and efficacy.” Concerning your popish holy water, although it be conjured to be health of body and soul, which includes not only venial but all sins: yet even your doctrine of venial sins is intolerable. For who gave you authority to annex any remission of sins to that or any other creature? But that you say, we are driven to hold, is false, for we hold no such thing, either that James of his own authority prescribed a miraculous oil, or that any such power or efficacy to remit sins, was in the oil, or annexed to it. Therefore you are driven to the straits, that without shame feign a sacrament of a ceremony used only for health of body, and are bold to slander the universal church of Christ, with such a practice as never was received in the church of Christ, for a sacrament. How the ceremony was used in Bede’s time I have showed before. The testimony of Innocent and De visitat. infirm. I have answered before, Gal. 4, sect. 2. Bernard writes no more but that Malachi was anointed according to the ceremony used in his time. The other councils that follow, being of later years, are according to the epistle of Innocent. Who because, he says, that this anointing may be used, not only of the priests, but also of all Christians, you are driven to a poor shift, in saying they used it not in that sacramental sort which the apostle prescribes; but Innocent says plainly they might use it lawfully, without any distinction of sacramental sort, as his words are manifest, which with small learning, may easily be understood. But where you say, “they use it as Christians do now the water of baptism, to take it home with them after it was hallowed, and to give it to their diseased to drink,” no doubt it was a vile superstitious abusing of the sacrament of baptism, as there have been many by conjurers and idolaters, but never used of well instructed Christians.</p></blockquote>

</figure><figure class="quote" id="q-18ab2a95ec" data-kw="">
<blockquote><p>The gestures or the external manner of administration of this sacrament must be such as most closely resembles the first Lord’s Supper administered by Christ, as well as the administration of the Lord’s Supper by the apostles and the apostolic churches as recorded in the Holy Scriptures. Then the Lord’s Supper was administered while seated at a table. Since it is a meal, it is therefore proper that it be administered in such a manner as one would serve either common or special meals. To come, one by one, to that which one calls an altar, to there receive the bread out of the hand of the celebrant—who time and again takes it from the altar and gives it to the communicant—to there receive it while kneeling, and to let it be put into his mouth, is superstitious and gives occasion for superstition. To use the sacrament standing and while passing the table is not as edifying. It also does not agree as fully with the first administration as does sitting at the table—be it that the minister gives the bread and the cup to each person one by one, or be it that he breaks the bread and puts it upon dishes which he passes on to those guests who are partaking, subsequently giving the cup to be passed on from hand to hand.</p></blockquote>

<blockquote><p>Vers. 18. For if I build again the things which I destroyed, I make myself a transgressor.

He gives four reasons of his Answer; The first is this, I betaking myself to Justification by the Faith of Christ, have entered upon a sure course for the destroying of sin, because I betook myself to Christ, that he might both forgive my sin, and administer grace to the mortification of sin: Therefore if I should again give myself up to sin, (as is objected) and build the work of the Devil in me, I should be contrary to myself, I should transgress the means which is now laid for the destroying of sin, and so I should be foolish and mad, not following the Doctrine of Justification by Faith: Therefore from the Principles of Justification by Faith it is impossible, that I should abuse the Grace or Name of Christ to sin more freely.

Vers. 19. For I through the Law am dead to the Law, that I might live unto God.

Reas. 2. I by the strength of the Law, am slain in the death of Christ, and in respect of the Law or Legal Covenant I am dead to the Law, and so set free from the Covenant of the Law, to that end, not that I should sin, but that I should live unto God, and should obey him: Therefore from the Principles of this Doctrine I cannot indulge myself to sin. The Argument is of force, for if through the Law or Covenant of Works, Christ is dead, in the place of those that are to be justified, to this end, that they being justified should live unto God; It is impossible, that the justified, who in Christ are dead to the Law, and would be accounted free from the Covenant of Works, should not also acknowledge themselves bound to live unto God, and consequently, that they ought not to indulge themselves in sin.

Vers. 20. I am crucified with Christ. Nevertheless I live, yet not I, but Christ liveth in me, and the life which I now live in the flesh, I live by the Faith of the Son of God, who loved me, and gave himself for me.

Reas. 3. Confirming the former: I being justified by Faith, am judicially united unto Christ crucified, and in him I am judicially bound to die unto sin, to crucify the old man: Therefore I cannot consent to sin from the principles of the Doctrine of Justification by Faith. This is the Reason, Christ our Surety on the Cross, did not only expiate the sins of the redeemed, but also for their sakes he promised that they should die to sin, and crucify their corrupt nature: Therefore he which by Faith apprehending his judicial union with Christ crucified, it is necessary also that he acknowledge his obligation, to dye to sin, or to crucify his old nature by the virtue of Christ.

Nevertheless I live] I justified by Faith, am a new Creature, by the Spirit of Christ living in me, so that I live not, as to the old man, but Christ dwelling in me useth this natural life as his Organ and Member, and Effects, that by Faith, in his strength, I may lead this life, taking care of all my affairs, that I may, as it were, bring the Spirit into obedience unto God, and that out of his same love, by which he died for me: Therefore I cannot consent to sin from the principles of justifying Faith. The force of the Argument in short is this; The Spirit quickens us that are justified by the Faith of Christ to live holily: Therefore Justification by Faith doth not give liberty to sin.

Vers. 21. I do not frustrate the Grace of God: for if Righteousness come by the Law, then Christ is dead in vain.

The Objection is removed: The second Argument for Justification by Faith, and not by the Works of the Law followeth: If Justification be by the Works of the Law, the Grace of God is in vain, and made of none effect; for if Justification bee by Works, it cannot be by Grace, as Rom. 11.6. But God forbid, that I should make the Grace of God of none effect: Therefore God forbid, that I should determine Justification to be by Works.

For if] Argum. 3. If Justification be by the Law, Christ is dead in vain, because then both otherwise, and more easily Justification might be obtained, than by the death of Christ: But it is absurd to say that Christ is dead in vain: Therefore Justification is not by the Law, but by Faith.</p></blockquote>

<blockquote><p>2. The predicate [of the verse Rom. 6:7 is], ‘is freed from sin.’ The word [for “freed”] δεδικαιωται, the Vulgar [Vulgate] has, justificatus est a peccato [is justified from sin]: Beza, with many of the ancients, liberatus est [is liberated]. Our translation has both in the text, “freed,” in the margin, “justified”. Whether you take one or the other word, it imports deliverance from the yoke and dominion of sin, so as not to obey its motions and commands. For the apostle does not speak here of the forgiveness of sin, but the abolition of its power and dominion; for it is brought as a reason why those whose old man is crucified with Christ should not serve sin; and the word “justified” is the rather used, because one justified and absolved by his judge, is also released and set free from his bonds; so are we. …

I. The nature of this freedom from sin. I told you before, it is an exemption from the dominion and reign of sin.

      1. We quit the evil disposition and temper of our souls…

      2. We renounce our former course of living, after the habits we are free from the acts, we do not, and durst not to live in sin, the former conversation [conduct] is cast off as well as the former lusts… Now this freedom is expressed by a word that signifies justification, and fitly:

      1. Because of the nature of justification, in which there are two branches; liberatio a poena [liberation from punishment], and acceptatio ad vitam [acceptance to life]. The punishment incurred by the Fall is poena damni and poena sensus, the loss and the pain: Both may be considered as in this life, or the life to come… But in this life we must also consider the loss and pain. The pains are all those miseries and afflictive evils, which came into the world by reason of sin. The loss is loss of God’s image: that threatening, ‘Thou shalt die the death,’ Gen. 2:17, implied spiritual death as well as temporal and eternal. Now we are justified when we are freed from punishment, and among other punishments from the punishment of loss, when God giveth us the blessing, which sin had deprived us of: As for instance, when He gives us the sanctifying Spirit [Rom. 5:5], this is called a receiving the atonement, Rom. 5:11. We had forfeited it by sin, and God being pacified in Christ, does restore it to us. Man brought upon himself spiritual death by sin, and the gift of the sanctifying Spirit is the great and first act of God’s pardoning mercy, and a means to qualify us for other parts of pardon. Though the thing be plain of itself, yet to make it more clear to us:

      2. Let us distinguish of the kinds of justification. There is a twofold justification, it is either constitutive or executive. First, constitutive justification is by the new Covenant, when those who submit to the terms are constituted or made righteous: Jn. 5:24, ‘He that hears my word, and believes in Him that sent Me, has everlasting life, and shall not come into condemnation; but is passed from death to life.’ There is God’s grant, and whosoever can make good his claim, has a right to justification by God’s own grant, according to the law of grace, he is one freed from sin. Secondly, executive, when God accordingly takes off all penalties and evils, and gives us all the good which belongs to the righteous or justified: as in the case in hand, when God gives us the Spirit to break the power and reign of sin: And therefore so often in Scripture is God said to sanctify us as a God of peace, or as a God pacified and reconciled to us in Jesus Christ: Heb. 13:20-21, ‘Now the God of peace that brought again from the dead our Lord Jesus, that great Shepherd of the sheep, through the blood of the everlasting covenant, make you perfect in every good work to do his will, working in you that which is well-pleasing in his sight.’ 1 Thess. 5:23, ‘And the very God of peace sanctify ye wholly, etc.’ 2 Cor. 5:18, ‘And all things are of God, who hath reconciled us to Himself by Jesus Christ.’ This God does as a Judge, acting according to the rules of government constituted in the new Covenant, upon the account of the merit of Christ, and our actual interest in Him.

II. As to the degree, how far we are freed from sin.

      1. All the justified and converted to God are freed from the Reign of it. The flesh, though it remaineth, is made subject to the Spirit, which by degrees doth destroy the reliques of sin: For it is said of the justified, Rom. 8.1. There is no condemnation to them that are in Christ Jesus, who walk not after the flesh, but after the Spirit.

      2. The more obedient we are to the motions of the sanctifying Spirit, the more power we have against sin: Gal. 5.18. If ye be led by the Spirit, ye are not under the Law, under the irritating Power and Curse of it. Many sins are in a great measure left uncured as a part of our punishment. … 4. Where the work is really begun and duly submitted unto, we have hopes of a better estate, it still increases towards that perfect blessedness, when we shall be without spot and blemish, or any such thing, Eph. 5:27. What a life do God’s holy ones live in Heaven, who are wholly freed from sin?… There is none in Heaven by the first Covenant [of Words]; all that are there come thither as sanctified and justified by Jesus Christ, and in the way of his pardoning grace. Surely since we have the same Redeemer, depend upon the merit of the same sacrifice, and wait for the same Spirit in the use of all holy means and endeavours, He will not be strange to us… … IV. How is it a consequent of our dying with Christ?… … 2. It is his privilege, being crucified with Christ; he has a right, and not a right only, but his justification is executed and applied to him by the gift of the sanctifying Spirit, which is the surest token of God’s love, and the true effect of his approbation… … Use 1. To inform us of the intimate connection between all the parts and branches of the grace of the Gospel. We are absolved and discharged from the power of sin as well as from the guilt of it. All will grant that justification respects the guilt of sin; but the apostle tells us here that justification respects the power of sin also. The penalty was the loss of God’s image as well as of his favor: so that pardon is executed and applied when our natures are sanctified and healed. The privation of the Spirit being the great punishment, the gift of the Spirit is a great branch of our absolution, and so Christ’s reconciling and renewing grace fairly accord and agree.</p></blockquote>

II. As to the degree, how far we are freed from sin.

      1. All the justified and converted to God are freed from the Reign of it. The flesh, though it remaineth, is made subject to the Spirit, which by degrees doth destroy the reliques of sin: For it is said of the justified, Rom. 8.1. There is no condemnation to them that are in Christ Jesus, who walk not after the flesh, but after the Spirit.

      2. The more obedient we are to the motions of the sanctifying Spirit, the more power we have against sin: Gal. 5.18. If ye be led by the Spirit, ye are not under the Law, under the irritating Power and Curse of it. Many sins are in a great measure left uncured as a part of our punishment. … 4. Where the work is really begun and duly submitted unto, we have hopes of a better estate, it still increases towards that perfect blessedness, when we shall be without spot and blemish, or any such thing, Eph. 5:27. What a life do God’s holy ones live in Heaven, who are wholly freed from sin?… There is none in Heaven by the first Covenant [of Words]; all that are there come thither as sanctified and justified by Jesus Christ, and in the way of his pardoning grace. Surely since we have the same Redeemer, depend upon the merit of the same sacrifice, and wait for the same Spirit in the use of all holy means and endeavours, He will not be strange to us… … IV. How is it a consequent of our dying with Christ?… … 2. It is his privilege, being crucified with Christ; he has a right, and not a right only, but his justification is executed and applied to him by the gift of the sanctifying Spirit, which is the surest token of God’s love, and the true effect of his approbation… … Use 1. To inform us of the intimate connection between all the parts and branches of the grace of the Gospel. We are absolved and discharged from the power of sin as well as from the guilt of it. All will grant that justification respects the guilt of sin; but the apostle tells us here that justification respects the power of sin also. The penalty was the loss of God’s image as well as of his favor: so that pardon is executed and applied when our natures are sanctified and healed. The privation of the Spirit being the great punishment, the gift of the Spirit is a great branch of our absolution, and so Christ’s reconciling and renewing grace fairly accord and agree.”

— Thomas Manton, A Second Volume of Sermons preached by the late reverend and learned Thomas Manton, … (d. 1677; London: Astwood, 1684) | Sermons on Rom. 6, Sermon 6, pp. 36-41 on Rom. 6:7, “For he that is dead is freed [δεδικαιωται, justified] from sin.”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+The+predicate+%5Bof+the+verse+Rom.+6%3A7+is%5D%2C+%E2%80%98is+freed+from+sin.%E2%80%99+The+word+%5Bfor+%E2%80%9Cfreed%E2%80%9D%5D+%CE%B4%CE%B5%CE%B4%CE%B9%CE%BA%CE%B1%CE%B9%CF%89%CF%84%CE%B1%CE%B9%2C+the+Vulgar+%5BVulgate%5D+has%2C+justificatus+est+a+peccato+%5Bis+justified+from+sin%5D%3A+Beza%2C+with+many+of+the+ancients%2C+liberatus+est+%5Bis+liberated%5D.+Our+translation+has+both+in+the+text%2C+%E2%80%9Cfreed%2C%E2%80%9D+in+the+margin%2C+%E2%80%9Cjustified%E2%80%9D.+Whether+you+take+one+or+the+other+word%2C+it+imports+deliverance+from+the+yoke+and+dominion+of+sin%2C+so+as+not+to+obey+its+motions+and+commands.+For+the+apostle+does+not+speak+here+of+the+forgiveness+of+sin%2C+but+the+abolition+of+its+power+and+dominion%3B+for+it+is+brought+as+a+reason+why+those+whose+old+man+is+crucified+with+Christ+should+not+serve+sin%3B+and+the+word+%E2%80%9Cjustified%E2%80%9D+is+the+rather+used%2C+because+one+justified+and+absolved+by+his+judge%2C+is+also+released+and+set+free+from+his+bonds%3B+so+are+we.+%E2%80%A6%0A%0AI.+The+nature+of+this+freedom+from+sin.+I+told+you+before%2C+it+is+an+exemption+from+the+dominion+and+reign+of+sin.%0A%0A%C2%A0%C2%A0%C2%A0%C2%A0%C2%A0%C2%A01.+We+quit+the+evil+disposition+and+temper+of+our+souls%E2%80%A6%0A%0A%C2%A0%C2%A0%C2%A0%C2%A0%C2%A0%C2%A02.+We+renounce+our+former+course+of+living%2C+after+the+habits+we+are+free+from+the+acts%2C+we+do+not%2C+and+durst+not+to+live+in+sin%2C+the+former+conversation+%5Bconduct%5D+is+cast+off+as+well+as+the+former+lusts%E2%80%A6+Now+this+freedom+is+expressed+by+a+word+that+signifies+justification%2C+and+fitly%3A%0A%0A%C2%A0%C2%A0%C2%A0%C2%A0%C2%A0%C2%A01.+Because+of+the+nature+of+justification%2C+in+which+there+are+two+branches%3B+liberatio+a+poena+%5Bliberation+from+punishment%5D%2C+and+acceptatio+ad+vitam+%5Bacceptance+to+life%5D.+The+punishment+incurred+by+the+Fall+is+poena+damni+and+poena+sensus%2C+the+loss+and+the+pain%3A+Both+may+be+considered+as+in+this+life%2C+or+the+life+to+come%E2%80%A6+But+in+this+life+we+must+also+consider+the+loss+and+pain.+The+pains+are+all+those+miseries+and+afflictive+evils%2C+which+came+into+the+world+by+reason+of+sin.+The+loss+is+loss+of+God%E2%80%99s+image%3A+that+threatening%2C+%E2%80%98Thou+shalt+die+the+death%2C%E2%80%99+Gen.+2%3A17%2C+implied+spiritual+death+as+well+as+temporal+and+eternal.+Now+we+are+justified+when+we+are+freed+from+punishment%2C+and+among+other+punishments+from+the+punishment+of+loss%2C+when+God+giveth+us+the+blessing%2C+which+sin+had+deprived+us+of%3A+As+for+instance%2C+when+He+gives+us+the+sanctifying+Spirit+%5BRom.+5%3A5%5D%2C+this+is+called+a+receiving+the+atonement%2C+Rom.+5%3A11.+We+had+forfeited+it+by+sin%2C+and+God+being+pacified+in+Christ%2C+does+restore+it+to+us.+Man+brought+upon+himself+spiritual+death+by+sin%2C+and+the+gift+of+the+sanctifying+Spirit+is+the+great+and+first+act+of+God%E2%80%99s+pardoning+mercy%2C+and+a+means+to+qualify+us+for+other+parts+of+pardon.+Though+the+thing+be+plain+of+itself%2C+yet+to+make+it+more+clear+to+us%3A%0A%0A%C2%A0%C2%A0%C2%A0%C2%A0%C2%A0%C2%A02.+Let+us+distinguish+of+the+kinds+of+justification.+There+is+a+twofold+justification%2C+it+is+either+constitutive+or+executive.+First%2C+constitutive+justification+is+by+the+new+Covenant%2C+when+those+who+submit+to+the+terms+are+constituted+or+made+righteous%3A+Jn.+5%3A24%2C+%E2%80%98He+that+hears+my+word%2C+and+believes+in+Him+that+sent+Me%2C+has+everlasting+life%2C+and+shall+not+come+into+condemnation%3B+but+is+passed+from+death+to+life.%E2%80%99+There+is+God%E2%80%99s+grant%2C+and+whosoever+can+make+good+his+claim%2C+has+a+right+to+justification+by+God%E2%80%99s+own+grant%2C+according+to+the+law+of+grace%2C+he+is+one+freed+from+sin.+Secondly%2C+executive%2C+when+God+accordingly+takes+off+all+penalties+and+evils%2C+and+gives+us+all+the+good+which+belongs+to+the+righteous+or+justified%3A+as+in+the+case+in+hand%2C+when+God+gives+us+the+Spirit+to+break+the+power+and+reign+of+sin%3A+And+therefore+so+often+in+Scripture+is+God+said+to+sanctify+us+as+a+God+of+peace%2C+or+as+a+God+pacified+and+reconciled+to+us+in+Jesus+Christ%3A+Heb.+13%3A20-21%2C+%E2%80%98Now+the+God+of+peace+that+brought+again+from+the+dead+our+Lord+Jesus%2C+that+great+Shepherd+of+the+sheep%2C+through+the+blood+of+the+everlasting+covenant%2C+make+you+perfect+in+every+good+work+to+do+his+will%2C+working+in+you+that+which+is+well-pleasing+in+his+sight.%E2%80%99+1+Thess.+5%3A23%2C+%E2%80%98And+the+very+God+of+peace+sanctify+ye+wholly%2C+etc.%E2%80%99+2+Cor.+5%3A18%2C+%E2%80%98And+all+things+are+of+God%2C+who+hath+reconciled+us+to+Himself+by+Jesus+Christ.%E2%80%99+This+God+does+as+a+Judge%2C+acting+according+to+the+rules+of+government+constituted+in+the+new+Covenant%2C+upon+the+account+of+the+merit+of+Christ%2C+and+our+actual+interest+in+Him.%0A%0AII.+As+to+the+degree%2C+how+far+we+are+freed+from+sin.%0A%0A%C2%A0%C2%A0%C2%A0%C2%A0%C2%A0%C2%A01.+All+the+justified+and+converted+to+God+are+freed+from+the+Reign+of+it.+The+flesh%2C+though+it+remaineth%2C+is+made+subject+to+the+Spirit%2C+which+by+degrees+doth+destroy+the+reliques+of+sin%3A+For+it+is+said+of+the+justified%2C+Rom.+8.1.+There+is+no+condemnation+to+them+that+are+in+Christ+Jesus%2C+who+walk+not+after+the+flesh%2C+but+after+the+Spirit.%0A%0A%C2%A0%C2%A0%C2%A0%C2%A0%C2%A0%C2%A02.+The+more+obedient+we+are+to+the+motions+of+the+sanctifying+Spirit%2C+the+more+power+we+have+against+sin%3A+Gal.+5.18.+If+ye+be+led+by+the+Spirit%2C+ye+are+not+under+the+Law%2C+under+the+irritating+Power+and+Curse+of+it.+Many+sins+are+in+a+great+measure+left+uncured+as+a+part+of+our+punishment.+%E2%80%A6+4.+Where+the+work+is+really+begun+and+duly+submitted+unto%2C+we+have+hopes+of+a+better+estate%2C+it+still+increases+towards+that+perfect+blessedness%2C+when+we+shall+be+without+spot+and+blemish%2C+or+any+such+thing%2C+Eph.+5%3A27.+What+a+life+do+God%E2%80%99s+holy+ones+live+in+Heaven%2C+who+are+wholly+freed+from+sin%3F%E2%80%A6+There+is+none+in+Heaven+by+the+first+Covenant+%5Bof+Words%5D%3B+all+that+are+there+come+thither+as+sanctified+and+justified+by+Jesus+Christ%2C+and+in+the+way+of+his+pardoning+grace.+Surely+since+we+have+the+same+Redeemer%2C+depend+upon+the+merit+of+the+same+sacrifice%2C+and+wait+for+the+same+Spirit+in+the+use+of+all+holy+means+and+endeavours%2C+He+will+not+be+strange+to+us%E2%80%A6+%E2%80%A6+IV.+How+is+it+a+consequent+of+our+dying+with+Christ%3F%E2%80%A6+%E2%80%A6+2.+It+is+his+privilege%2C+being+crucified+with+Christ%3B+he+has+a+right%2C+and+not+a+right+only%2C+but+his+justification+is+executed+and+applied+to+him+by+the+gift+of+the+sanctifying+Spirit%2C+which+is+the+surest+token+of+God%E2%80%99s+love%2C+and+the+true+effect+of+his+approbation%E2%80%A6+%E2%80%A6+Use+1.+To+inform+us+of+the+intimate+connection+between+all+the+parts+and+branches+of+the+grace+of+the+Gospel.+We+are+absolved+and+discharged+from+the+power+of+sin+as+well+as+from+the+guilt+of+it.+All+will+grant+that+justification+respects+the+guilt+of+sin%3B+but+the+apostle+tells+us+here+that+justification+respects+the+power+of+sin+also.+The+penalty+was+the+loss+of+God%E2%80%99s+image+as+well+as+of+his+favor%3A+so+that+pardon+is+executed+and+applied+when+our+natures+are+sanctified+and+healed.+The+privation+of+the+Spirit+being+the+great+punishment%2C+the+gift+of+the+Spirit+is+a+great+branch+of+our+absolution%2C+and+so+Christ%E2%80%99s+reconciling+and+renewing+grace+fairly+accord+and+agree.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Second+Volume+of+Sermons+preached+by+the+late+reverend+and+learned+Thomas+Manton%2C+%E2%80%A6+%28d.+1677%3B+London%3A+Astwood%2C+1684%29+%7C+Sermons+on+Rom.+6%2C+Sermon+6%2C+pp.+36-41+on+Rom.+6%3A7%2C+%E2%80%9CFor+he+that+is+dead+is+freed+%5B%CE%B4%CE%B5%CE%B4%CE%B9%CE%BA%CE%B1%CE%B9%CF%89%CF%84%CE%B1%CE%B9%2C+justified%5D+from+sin.%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fae8014cdae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ae8014cdae.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=2.%20The%20predicate%20%5Bof%20the%20verse,renewing%20grace%20fairly%20accord%20and%20agree&amp;text=2.%20The%20predicate%20%5Bof%20the%20verse%20Rom.%206%3A7&amp;text=reconciling%20and%20renewing%20grace%20fairly%20accord%20and%20agree" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And to say that no man is completely justified in the sight of God in this life, is at once to overthrow all that is taught in the Scriptures concerning justification, and wherewithal all peace with God and comfort of believers.</p></blockquote>

</figure><figure class="quote" id="q-eae6011327" data-kw="">
<blockquote><p>There is no part of religion which Satan does not endeavor to destroy under pretense of promoting it: and his way is to overgo Christ and his apostles, and to seem more zealous than ever they were, and to mend their work by doing it better or doing more… Satan has always two ways to destroy both truth and duty: The first is by direct opposing it; But when that will not do, the next is by overdoing and pretending to defend it… If he cannot destroy faith by open infidelity, he will try to make men believe too much, by making the objects of their own belief and calling that a particular faith, and altering God’s Word and casting away the reasons and evidences of faith, to show the strength and nobleness of their faith, which needs no such helps as these; till by over-doing they have raised their edifice in the air and rejected their foundations, and put out their eyes in honor of the sun, and of their physician, lest either of them should be accused as insufficient.</p></blockquote>

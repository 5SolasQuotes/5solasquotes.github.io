<blockquote><p>Fifth [objection], [there must be composition in God] because in God there are very many attributes really distinct from Him and among themselves – at least distinct in such a way that they are not God Himself, therefore… Response: We deny the antecedent. They are God Himself, nor do they really differ, e.g. goodness, justice, power, intellect, will. There are some who concede that they are distinguished from the nature of the thing formally, as Scotus with his followers, because although they are the same simple thing, nevertheless from the nature of the thing they are distinct formal notions; for the formal notion and definition of one, e.g. of intellect or justice, is not the definition and formal notion of the other, e.g. of will or mercy – which opinion Rada, Bishop of Patti, subtly defends against all the Thomists out of the more recent authors in the cited place. But others, such as the Thomists and most of the more recent Papists (with whom I think the Reformed philosophers and Theologians side), more truly and accurately establish here a distinction of reasoning reason and reasoned reason [i.e. a purely rational distinction]. The former indeed on the part of our intellect, both on account of the most eminent perfection of God which cannot be represented by a single notion, and on account of the finitude and narrowness of our intellect, which cannot adequately conceive the whole perfection of God by a single concept, but needs many inadequate concepts to conceive it – hence it happens that it conceives one and the same thing separately by many formal concepts really distinct, concepts, I say, analogically taken from created things which through many distinct qualities furnish those things which the divine essence [furnishes] through itself. But the latter [distinction] on the part of the thing, because there are various objective concepts not really, actually, in themselves, but virtually or eminently distinct in effects, emanations, and terminations. This distinction they properly call virtual or eminent [distinction] of reasoned reason; or (to adapt it to Scotistic terms) from the nature of the thing formal not in act, but in power or eminently. So that there is some foundation of this latter distinction on the part of the thing, not indeed in God Himself, but in the effects of God. For although the divine essence and perfection is one and simple, nevertheless it does not operate according to its adequate notion. Whence we say that God punishes the wicked according to the notion of justice, saves his own [people] according to the notion of mercy, produces Bucephalus to the idea of a horse, not of a man; but Alexander to the idea of a man, not of a horse. The attributes of justice and mercy, as well as the ideas of man and horse, are indeed not multiplied or distinguished in God Himself in act; but they are distinguished only virtually in the effects themselves, or in termination to such and such a work or effect. Let the more immature learn the nature of this distinction from the common metaphysical and logical authors and apply it to the present matter. Two examples are usually adduced, of the soul and of solar light. The soul, really one in man, is virtually or eminently threefold: vegetative, sensitive, rational; because that one form furnishes in man what the vegetative [furnishes] in plants, the sensitive in brutes. The light of the sun, although it is one, nevertheless virtually or as to its effects contains in itself a drying and heating force. But when it illuminates or heats or dries, it does not operate according to its whole notion. For by the action of illuminating as such, it does not dry or heat, although the drying or heating force is not separated from the illuminative force, but they hold themselves accidentally to illumination; because light does not operate according to its whole notion, but only according to the notion of illuminating. … Instance 2, which is Walter’s: The attributes are in diverse predicaments, e.g. essence in substance, goodness in quality. Response: Now boys in the schools know that God is in a predicament analogically. Instance 3: Things which cannot be predicated of each other and of the essence in the abstract, in the nominative case, and by synonymous predication, are not really the same. But the former is true. Therefore… Response: There is a fallacy of figure of speech; for the identical sense is changed into the formal sense. Something is predicated of another either in the identical sense or in the formal sense. The attributes as they are considered on the part of the thing and insofar as they are in God and thus are entirely the same as the essence and among themselves, can be predicated of each other in the identical sense; thus you will rightly and most truly say: The essence on the part of the thing is life, will on the part of the thing is intellect, and vice versa, and so in others. But as the attributes are conceived by us, and as they are in our concepts, they cannot be truly and properly predicated of each other, namely in the formal sense; the reason is, because thus they are not entirely the same but are distinguished by reasoning reason and reasoned reason (namely virtual). For there are many objective concepts virtually distinct which correspond to many formal concepts really distinct. Therefore it cannot be said: The objective concept of will is the objective concept of intellect, or, the attribute of mercy is the attribute of punitive justice. It must nevertheless be noted that there are some propositions which can be taken in both senses, namely those which consist of the copula “is”, e.g. Intellect is will; to understand is to will; mercy is justice – which taken in the abstract and in the identical sense are true, but in the formal sense false. There are also others which are always taken in the formal sense, and thus under those terms are absolutely and always false, in which essential or notional acts are signified. Essential: as intellect understands, will wills. Notional: as the Father begets, the Son is begotten, the Holy Spirit proceeds – which are only true when something is signified to be appropriate to God according to that notion according to which it is truly appropriate; but they are false when something is signified to be appropriate to God according to another notion which holds itself accidentally and according to which it is not truly appropriate, e.g. intellect wills, will understands, justice shows mercy, mercy punishes – which nevertheless can be true under other terms, namely taken in the abstract, in themselves, as they are on the part of the thing in God, but not as they are attended to in distinct effects as principles of diverse productions or according to the diverse emanations of God, as, that thing which is will understands, that thing which is mercy punishes.</p></blockquote>

<blockquote><p>Simplicity is God, one mere and perfect act without all composition. God calls his name, ‘I am,’ Ex. 3:14, that is, mere essence, wherein is nothing past, nor to come. Because spirits are immixed in respect of bodies, to show that He is not compounded, He says He is a Spirit, Jn. 4:24. When we say that God is a mere and perfect act, the meaning is that God is a cause without any cause, a being that is not from any being; not compounded of an act, by which He is, and possibility, by which He might not have been or may not be: of whom it never could, nor can be said that anything was to be in Him, which was not; or cannot be, that is. That God is a pure and simple act without all composition is evident, because of his perfection; all composition supposes imperfection, because He is the first Being. Were there any composition in God, it would follow there were first and second in God: Something in God that were not first, or that there were more first Beings. Because God is a Being of absolute necessity (Deus est ens necesse esse [God is necessary being]. Smising, Of the One God, tract 2, disp. 2, n. 49): Composition implies either that there must be more beings of absolute necessity, or that there is something in God that may not be. Composition supposes succession, i.e. something past or to come in God; contrary to his name, ‘I am’. Nay it supposes that not-being is not repugnant to the nature of God: Where there is composition, there may be dissolution; dissolution is the way to not-being. It much helps us in the contemplation of the simplicity of God to look upon it as opposed to composition, all the ways whereof the learned have referred to these seven heads. Composition is either of 1. Parts, which are bounded by quantity; as a body having one part upon another.

2. Matter and form; as a man of body and soul: these two compositions are only found in corporeal things.

3. General and special nature: as every species, whose common nature is to be found in some other thing, where the special nature is not; as a living creature and a man. 4.A subject and an accident; as every created substance: There are no accidents in God: He is wise, holy, just, essentially: there is not a substance and a quality in Him. When God is said only to have immortality, 1 Tim. 6:16, it is to be understood by way of eminency; He so has it as none has besides Him: He has it originally, not derivatively and by participation.

5. An act and a possibility-objective that is to be, if the thing looked at as yet is not in being; or [a possibility-]passive that is not to be (though that not-being never shall be), if the thing be looked at as in actual being: this composition holds concerning angels.

6. A person and nature; as Christ, compounded of the divine Person and human nature; which yet is not properly composition of parts, but of number.

7. Being and individuation; that is, that by which we have such a particular being, as humanity and Peter. Objection: Where there is a plurality, there is not simplicity: But in the divine nature there is a plurality: therefore. Answer: The objection holds where there is a plurality of essences, beings or things, but not where there is only a plurality of subsistences. In the divine nature, though there be a Trinity, therefore a plurality of subsistences or Persons, yet there is but one essence: In the Trinity there is distinction, but not composition. Objection 2. The attribute of simplicity concludes that all the attributes are God Himself, and consequently that there is no inequality amongst them: yet we read that his tender mercies are over all his works; so, as it may seem, mercy exceeds the other attributes. Answer: The meaning is that his mercy is over, that is, upon all his works, not that God’s mercy exceeds all his other attributes, as if one attribute were greater than another: for all the attributes of God are equal, not one higher or greater than another, because they are all God Himself. From the simplicity of God it follows:

1. That whatsoever is in God, is God.

2. Whatsoever God wills He willed from eternity and always wills.

3. Whatsoever God wills, He wills simply, absolutely and independently.

<div class="actions"><button class="copy" data-copy="“Simplicity is God, one mere and perfect act without all composition. God calls his name, ‘I am,’ Ex. 3:14, that is, mere essence, wherein is nothing past, nor to come. Because spirits are immixed in respect of bodies, to show that He is not compounded, He says He is a Spirit, Jn. 4:24. When we say that God is a mere and perfect act, the meaning is that God is a cause without any cause, a being that is not from any being; not compounded of an act, by which He is, and possibility, by which He might not have been or may not be: of whom it never could, nor can be said that anything was to be in Him, which was not; or cannot be, that is. That God is a pure and simple act without all composition is evident, because of his perfection; all composition supposes imperfection, because He is the first Being. Were there any composition in God, it would follow there were first and second in God: Something in God that were not first, or that there were more first Beings. Because God is a Being of absolute necessity (Deus est ens necesse esse [God is necessary being]. Smising, Of the One God, tract 2, disp. 2, n. 49): Composition implies either that there must be more beings of absolute necessity, or that there is something in God that may not be. Composition supposes succession, i.e. something past or to come in God; contrary to his name, ‘I am’. Nay it supposes that not-being is not repugnant to the nature of God: Where there is composition, there may be dissolution; dissolution is the way to not-being. It much helps us in the contemplation of the simplicity of God to look upon it as opposed to composition, all the ways whereof the learned have referred to these seven heads. Composition is either of 1. Parts, which are bounded by quantity; as a body having one part upon another.

2. Matter and form; as a man of body and soul: these two compositions are only found in corporeal things.

3. General and special nature: as every species, whose common nature is to be found in some other thing, where the special nature is not; as a living creature and a man. 4.A subject and an accident; as every created substance: There are no accidents in God: He is wise, holy, just, essentially: there is not a substance and a quality in Him. When God is said only to have immortality, 1 Tim. 6:16, it is to be understood by way of eminency; He so has it as none has besides Him: He has it originally, not derivatively and by participation.

5. An act and a possibility-objective that is to be, if the thing looked at as yet is not in being; or [a possibility-]passive that is not to be (though that not-being never shall be), if the thing be looked at as in actual being: this composition holds concerning angels.

6. A person and nature; as Christ, compounded of the divine Person and human nature; which yet is not properly composition of parts, but of number.

7. Being and individuation; that is, that by which we have such a particular being, as humanity and Peter. Objection: Where there is a plurality, there is not simplicity: But in the divine nature there is a plurality: therefore. Answer: The objection holds where there is a plurality of essences, beings or things, but not where there is only a plurality of subsistences. In the divine nature, though there be a Trinity, therefore a plurality of subsistences or Persons, yet there is but one essence: In the Trinity there is distinction, but not composition. Objection 2. The attribute of simplicity concludes that all the attributes are God Himself, and consequently that there is no inequality amongst them: yet we read that his tender mercies are over all his works; so, as it may seem, mercy exceeds the other attributes. Answer: The meaning is that his mercy is over, that is, upon all his works, not that God’s mercy exceeds all his other attributes, as if one attribute were greater than another: for all the attributes of God are equal, not one higher or greater than another, because they are all God Himself. From the simplicity of God it follows:

1. That whatsoever is in God, is God.

2. Whatsoever God wills He willed from eternity and always wills.

3. Whatsoever God wills, He wills simply, absolutely and independently.

4. God is justice, wisdom, love, etc. essentially: although He be said to have them eminently, yet He has them not derivatively.”

+tender+mercies+are+over+all+his+works%3B+so%2C+as+it+may+seem%2C+mercy+exceeds+the+other+attributes.+Answer%3A+The+meaning+is+that+his+mercy+is+over%2C+that+is%2C+upon+all+his+works%2C+not+that+God%E2%80%99s+mercy+exceeds+all+his+other+attributes%2C+as+if+one+attribute+were+greater+than+another%3A+for+all+the+attributes+of+God+are+equal%2C+not+one+higher+or+greater+than+another%2C+because+they+are+all+God+Himself.+From+the+simplicity+of+God+it+follows%3A+1.+That+whatsoever+is+in+God%2C+is+God.+2.+Whatsoever+God+wills+He+willed+from+eternity+and+always+wills.+3.+Whatsoever+God+wills%2C+He+wills+simply%2C+absolutely+and+independently.+4.+God+is+justice%2C+wisdom%2C+love%2C+etc.+essentially%3A+although+He+be+said+to+have+them+eminently%2C+yet+He+has+them+not+derivatively.%E2%80%9D%0A%0A%E2%80%94+John+Norton%2C+The+Orthodox+Evangelist%2C+%E2%80%A6+%28London%3A+Macock%2C+1654%29%2C+ch.+1%2C+%E2%80%98Of+the+Divine+Essence%E2%80%99%2C+pp.+5-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F711b1f206b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/711b1f206b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-divine-simplicity/#:~:text=Simplicity%20is%20God%2C%20one%20mere%20and,yet%20He%20has%20them%20not%20derivatively&amp;text=Simplicity%20is%20God%2C%20one%20mere%20and%20perfect%20act&amp;text=them%20eminently%2C%20yet%20He%20has%20them%20not%20derivatively" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The analogical use of terms is crucial to understanding God’s knowledge properly in another respect. I have spoken of various concepts and propositions existing in the divine intellect, but they cannot exist there in exactly the same sense in which they exist in our intellects. For in our intellects they exist as distinct thoughts, and there cannot be any such distinctions in God consistent with his simplicity. To a first approximation, we might think instead in terms of a conjunction of all propositions, and say that there is in the divine intellect something like a single thought with this one gigantic conjunctive proposition as its content. But even that cannot be quite right, because this single conjunctive proposition will itself have component parts. A better, though still imperfect, way to understand the nature of God’s knowledge would be to think in terms of analogies like the following. From a beam of white light, various beams of colored light can be derived by passing it through a prism. Though the colors are not separated out until the beam reaches the prism, they are still in the white light in a unified way. From a lump of dough, cookies of various shapes can be derived by means of cookie cutters. Though the various cookies with their particular shapes are not separated out until the cutters are applied to the dough, they are still in the uncut dough virtually. Now, God is pure actuality, whereas each kind of created thing represents a different way in which actuality might be limited by potentiality. That is to say, each created thing is comparable to one of the different specific colors that might be derived from the white light that contains all of them, or is like one of the many cookie shapes which might be derived from the dough which contains all of them. God’s creation of the world is thus like the passing of white light through a prism or the application of the cutters to the dough. The prism draws out, from the color spectrum which is contained in a unified way in the white light, a particular beam of this color and a particular beam of that color; and the cutters draw out, from the variety of possible cookies contained in a unified way in the lump of dough, a cookie of this particular shape and a cookie of that particular shape… Now, just as if you knew the white light perfectly, you would know all the colors which could be derived from it, and if you knew the lump of dough perfectly, you would know all the shapes which might be carved out of it, so too, perfectly to know that which is pure actuality would entail knowing all the various limited ways of being actual which might be derived from it. And that is how God knows all the various kinds of finitely actual things which exist or might exist—by virtue of perfectly knowing himself as that which is pure or unlimited actuality. That is not to say that his knowledge is exactly like that of someone who grasps the nature of white light or of dough, but it is analogous to that. And even if the analogy is imperfect, that is, as I have said, only to be expected given how very far beyond its ordinary sphere of operation reason has to push itself when seeking ultimate explanations.</p></blockquote>

<blockquote><p>God in his Word reveals Himself to be Jehovah Elohim, i.e. one God subsisting in three Persons. Though essence and subsistence, that is, the divine nature, and the Trinity of Persons in that nature, are the same thing, they being distinguished not as a Being and a Being, but as the manner of a Being or thing is distinguished from the Being or thing itself: yet for the help of our apprehension, God being pleased so far to condescend to our capacity (as delighting to be understood by us), we first consider of the essence, then of the subsistence.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e0cc8f8af3" data-kw="">
<blockquote><p>Vers. 1. Now concerning the Collection for the Saints, as I have given order to the Churches of Galatia, even so do ye.

As touching the Collection: The famine which was prophesied by Agabus, Act. 11.28. as also the persecution, did much distress the Churches in Judea, wherefore the Apostles living at Jerusalem, exhort Paul and Barnabas, that they would take care to make a collection amongst the Gentiles, to succour the need of the poor Jews, Gal. 2.20. hee speaks of this contribution, commanding that on the Lord’s Day (whereupon all Christians ceased from their labours, and met publicly to the Worship of God) that every one according to his ability, without vainglory, should cast something into the Treasury.

There are six reasons of his Exhortation: The first is from the example of other Churches, by name of those which were in Galatia, who were bound to the same duty, under the same Precepts.

Vers. 2. Upon the first day of the week, let every one of you lay by him in store, as God hath prospered him, that there be no gatherings when I come.

Reason 2. Because nothing is required of them unfitting or burdensome, but that once every week, in convenient time and place, every one would contribute according to that measure wherewith God had blessed him: And the manner is plain, whereby the collection might be made publicly every Lord’s Day, and yet every one should lay it by himself, i. e. no man knowing the sum: We may imagine that they imitated the example of the Ancient Church, a bored Chest being placed in the entrance to the house where they met for the Worship of God.

Lest when I come] Reason 3. Because he was about to come unto them, to enquire of their obedience. Here we have the fourth Reason, lest upon their putting off, or neglecting the matter, they might be found unprepared when the Apostles should come, and might make their collection not so seasonable, with greater difficulty and prejudice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 69.</span></figcaption>

<blockquote><p>Saying AMEN, audibly to all. Neh. 8. 6. […]

As for an audible pronouncing of Amen, if the mind of them that pronounce it, have been upon that which the Minister uttered, and their heart have given consent thereto, it compriseth altogether as much as the Minister hath uttered. This is the only warranteable means for people to utter their mind in a Congregation. It must therefore be uttered by every one, altogether, so loud, as well as they hear what he hath uttered in their name. For the one is as requisite as the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s Sanctification</cite>, (London, 1641), p. 5.</span></figcaption>

</figure><figure class="quote" id="q-5befdc3ee6" data-kw="">
<blockquote><p>And as evil is to be controlled by Law, so that which is good is also by Law to be procured. God hath made us many ways rich. For what we have, freely at his hands we have it. But he himself is become very poor: in so much that, for want of relief, he is forced to beg; and, for want of lodging and meat, he lieth and dieth in our streets. This great ingratitude God cannot but revenge.

Oh what shame is this to a Christian common wealth, in a reformed country? Obstinate Jews would never shew themselves so unthankful. Their ancient Law forbidding beggars is even to this day most straitly kept amongst them. Laws in this behalf have been provided: but as they wanted perfection, so have they in manner in no point or any where had execution.

Serve God in truth, provide that Christ crave not. Such as will not feed him here: he will never feed in his kingdom. Thus have I, point by point, let you see disorders and wants in the common wealth. Ye have authority by Law to reform them. Consider dutifully of it, and serve God truly as ye ought, always remembering the saying of the Prophet Esay, Woe be to them that make wicked Laws.</p></blockquote>

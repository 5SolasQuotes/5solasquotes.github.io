<main class="wrap"><figure class="quote" id="q-1946aa0d79" data-kw="">
<blockquote><p>But if anyone either on the testimony of the church, or parents, or witnesses, or of others cannot be sure about the baptism that he had received in infancy, or if it happened that he was moistened by no other baptism than that of the midwives or private individuals, we are of the opinion that such a man may be baptized without any scruple. For the baptism applied by the last-mentioned people is not baptism at all, and the baptism of the first mentioned people is worthless, as the Council of Carthage [AD 418] has rightly decided (5.3): ‘Concerning infants it has been decided that whenever no very certain witnesses are found who testify without a doubt that they were baptized, and whenever they themselves are not, on account of their age, in a position to give an answer about the sacraments that were given to them, they should be baptized without any scruple, lest that doubt should cause them to be bereft of the cleansing of the sacraments.’ For as Leo [AD 400-461] rightly added, ‘what is not known to have been done cannot be said to have been repeated.’ And consequently we should not approve of a conditional baptism that the papal teachers are used to observing in such cases, according to this formula: ‘If you have not been baptized, then I baptize you.’ For a baptism of this kind lacks any precedent in Scripture and changes the form for baptism that Christ had taught, and it also leaves the one who has been baptized in doubt as to which baptism is the real one–which goes against the purpose of baptism that does not make the promises of God ambiguous but establishes and seals them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, (1625; Brill, 2020), vol. 3, Disputation 44, ‘On the Sacrament of Baptism’, sections 55-56, pp. 169-71</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d32d893a76" data-kw="">
<blockquote><p>This title by conquest, through the people’s after consent, may be turned into a just title, as in the case of the Jews in Caesar’s time, for which cause our Savior commanded to obey Caesar, and to pay tribute unto him… 2. Though the consent be some way over-awed [by intimidation], yet is it a sort of contract and covenant of loyal subjection made to the conqueror, and therefore sufficient to make the title just; otherwise, if the people never give their consent, the conqueror, domineering over them by violence, has no just title to the crown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, (Edinburgh: Ogle &amp; Boyd), p. 47</span></figcaption>

</figure><figure class="quote" id="q-5323c4e91a" data-kw="">
<blockquote><p>…in favor of the baptism of infant servants, from the cessation of the Jewish Church to the times of Augustine, we can only say that Augustine speaks of it as a custom in existence; that it resulted, in his day, from the conviction that baptism came in place of circumcision, a conviction which we can trace up through the earliest fathers… …we commend the resolutions of the Synod of South Carolina… ‘1. Resolved, That it is the duty of believing masters to train up their servants, as well as their children, in the nurture and admonition of the Lord. 2. Resolved, That the principles of the Abrahamic covenant, as to the cirucmcision of servants, is till in force in reference to the infant offspring of those who stand to us in this relation; and that as baptism succeeds to circumcision, it is the duty of masters to dedicate such servants to God in the ordinance of baptism, and to do all in their power to train them up in a knowledge of the truth and in the way of salvation through Christ. 3. Resolved, That though there are great and manifest dificulties in carrying out the principles of these resolutions, these difficulties have chiefly resulted from the long continued neglect of believing masters and of the church, and that these difficulties must be gradually overcome by continued and persevering efforts.&#x27;</p></blockquote>

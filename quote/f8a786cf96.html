<blockquote><p>It is a question, the threatening standing, Gen. 2:17, how the active righteousness of Christ can be a cause meriting to us life and satisfying the Law when there is no suffering for the breach of the Law, which expressly required death in the sinner: Not to say that it seems too near to make Christ’s dying needless if his active holiness do the business; Nay we cannot so teach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pt. 2, ch. 1 of The Covenant of Life Opened (1655), pp. 225-30, p. 230</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

<blockquote><p>Howbeit this exposition of the term justification seems faulty as well as the former: and that two ways: … 2. With them all, it presumes in the matter of justification a needles twofold act, the not-imputation of sin, and the imputation of righteousness, as two distinct things; whereas not to impute sin in consideration of satisfaction made for it, is no other thing than to impute righteousness to the party therein concerned. Since that a man cannot be deemed or doomed guiltless or faultless, but he must of necessity be deemed or doomed just or righteous; there being no medium or middle state between a delinquent or a guilty person and one guiltless or just. He that can prove himself no delinquent, but free from fault, must of necessity be justified, acquitted and assoiled as just. See Dt. 25:1. If nothing but sin can make a man unjust, then surely the utter absence of sin must necessarily make a man just. See Paul’s plea, Acts 25:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote Against Error Concerning Justification</cite>, … (d. 1654; London: Brome, 1670), pp. 19-20</span></figcaption>

<blockquote><p>13… And thus far there is the highest consensus among the Orthodox, although a certain dissensus intervenes in the explication of the material cause — some urging both the ἐνεργητική [energētikē, active] and the παθητική [pathētikē, passive] obedience, and conjoining satisfaction through obedience and through suffering; others seeking the material cause of our justification in satisfaction through suffering alone. 14. The foundation is safe among both parties. For both not only admit but also require the obedience of Christ perfectly rendered to the law for our justification; but they differ in the manner of explicating the matter. For some hold it to be the meritorious cause of our justification; others hold it to be the condition of the person and the causa sine qua non [indispensable cause] of meriting justification — namely, that it behoved us to have such a High Priest who was holy and undefiled, Heb. VII.26–27. Concerning which there is a certain dissensus of opinions, the unity of faith and charity being preserved, since both parties apprehend the whole Christ and Christ alone, and in Him whole and alone seek righteousness and life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>

<blockquote><p>27. By the righteousness of Christ imputed to us we cannot be said absolutely or in every respect to be righteous, as if, on account of it, God regarded us as though we had performed all things required of us by his law. For then, after that righteousness of Christ had been admitted and accepted, God could demand no obedience to his law from us on our part. But by the righteousness of Christ imputed to us God esteems us righteous insofar as we have been transgressors of the divine law; so that we are said to be made righteous by that righteousness of Christ insofar as by our disobedience we had been constituted unrighteous. For Christ did not satisfy for all those things which we were bound to do by the law (for He would then have come into the world to dissolve the law), but only for those things which we had done against the law, or which, when we ought to have done them, we did not do.</p></blockquote>

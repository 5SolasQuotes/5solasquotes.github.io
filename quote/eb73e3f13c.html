<blockquote><p>Augustine, in his work, entitled, On the Labour of Monks, complaining of certain itinerant impostors, who, as early as his day, plied a vile and sordid traffic, by carrying the relics of martyrs about from place to place, adds, “If, indeed, they are relics of martyrs.” By this expression, he intimates the prevalence, even in his day, of abuses and impostures, by which the ignorant populace were cheated into the belief, that bones gathered here and there were those of saints. While the origin of the imposture is thus ancient, there cannot be a doubt that in the long period which has since elapsed, it has exceedingly increased, considering, especially, that the world has since been strangely corrupted, and has never ceased to become worse, till it has reached the extreme wherein we now behold it. But the first abuse, and, as it were, beginning of the evil, was, that when Christ ought to have been sought in his Word, sacraments, and spiritual influences, the world, after its wont, clung to his garments, vests, and swaddling-clothes; and thus overlooking the principal matter, followed only its accessory. The same course was pursued in regard to apostles, martyrs, and other saints. For when the duty was to meditate diligently on their lives, and engage in imitating them, men made it their whole study to contemplate and lay up, as it were in a treasury, their bones, shirts, girdles, caps, and similar trifles. I am not unaware that in this there is a semblance of pious zeal, the allegation being, that the relics of Christ are kept on account of the reverence which is felt for himself, and in order that the remembrance of him may take a firmer hold of the mind. And the same thing is alleged with regard to the saints. But attention should be paid to what Paul says, viz., that all divine worship of man’s devising, having no better and surer foundation than his own opinion, be its semblance of wisdom what it may, is mere vanity and folly. Besides, any advantage, supposed to be derived from it, ought to be contrasted with the danger. In this way it would be discovered, that the possession of such relics was of little use, or was altogether superfluous and frivolous, whereas, on the other hand, it was most difficult, or rather impossible, that men should not thereby degenerate into idolatry. For they cannot look upon them, or handle them, without veneration; and there being no limit to this, the honour due to Christ is forthwith paid to them. In short, a longing for relics is never free from superstition, nay, what is worse, it is the parent of idolatry, with which it is very generally conjoined. All admit, without dispute, that God carried away the body of Moses from human sight, lest the Jewish nation should fall into the abuse of worshipping it. What was done in the case of one ought to be extended to all, since the reason equally applies. But not to speak of saints, let us see what Paul says of Christ himself. He declares, that after the resurrection of Christ he knew him no more after the flesh, intimating by these words, that every thing carnal which, belonged to Christ should be consigned to oblivion and discarded, in order that we may make it our whole study and endeavour to seek and possess him in spirit. Now, therefore, when men talk of it as a grand thing to possess some memorial of Christ and his saints, what else is it than to seek an empty cloak with which to hide some foolish desire that has no foundation in reason? But even should there seem to be a sufficient reason for it, yet, seeing it is so clearly repugnant to the mind of the Holy Spirit, as declared by the mouth of Paul, what more do we require? But it is not at all necessary to enter into a long discussion of the point, whether or not it is a good thing to have relics merely for preservation, and not for worship; for, as we have said, experience teaches that the one is never separated from the other. Ambrose, indeed, speaking of Helena, (the mother of Constantine,) who had at great labour and expense procured the cross of our Lord, says, that she did not adore the wood, but only the Lord, who had hung upon it. But it is most rare for persons to be at all devoted to relics, without being also polluted by some degree of superstition. I admit that they do not, at the very outset, break out into open idolatry, but that gradually, from one fallacy to another, they move along their downward path, until they at last rush headlong. Indeed, people, calling themselves Christian, have gone to such lengths as to exhibit the madness of idolatry in a degree equal to that of the heathen of old, For they have prostrated themselves, and bent the knee before relics as before God, lighting torches and tapers as in solemn worship, putting confidence in them, and fleeing to them as if they possessed a divine power and grace. If idolatry is just to transfer the honour of God to others, can we deny that this is idolatry? It is no excuse to say it is done through the excessive zeal of rude and ignorant men or old women. The extravagance is of wider extent. It has everywhere prevailed, and been approved even by those who sit holding the reins of government in the Church. Nay, the bones of the dead, and all other sorts of relics, have been placed over the principal altars in the high and lofty place to be adored with greater reverence. See how what was at first a foolish curiosity for preserving and treasuring up relics, has at length degenerated into such abomination, that men have not only turned away from God, in order to cleave to things vain and perishing, but even with execrable sacrilege to adore things void of sense, instead of Him who liveth, and is blessed for evermore. But as evil leads on to evil, another unhappy consequence was, that vile objects, out of number, and altogether devoid of sense and beauty, were received as relics of Christ and the Saints. So blind was the world, that, under whatever name the vain toys were presented, they were at once received without examination and selection as genuine. In this way, men made no difficulty in hugging any ass’ or dog’s bones which any trifler chose to bring forward as the bones of martyrs. The same thing, as we will afterwards show, happened in other cases, and, I doubt not, by just punishment from God. For when the world, inflamed, as it were, with a kind of rage, longed after relics, that they might pervert them to superstition, it might have been anticipated that God would permit lie to follow upon lie. For in this way is He wont to avenge insult offered to his name, when the glory due only to Himself is transferred to others. Wherefore, the true explanation of the fact, that so many spurious relics exist, is just that when men were delighting in lies, God permitted them to fall into a double error.</p></blockquote>

<blockquote><p>The Sanctity of this blessed House [of the saints in Heaven]… Sanctity of place is relative and is founded either upon the manifestation of God’s special Presence, or consecration of it to his service. ‘Tis consistent with the Divine Immensity to be differently present in several places: as the soul is in another manner present in the head, where it performs its noblest operations, than in other parts of the body; and upon any special appearance of God, a place is sacred. Thus when Moses approached to see the flaming bush, he was enjoined, ‘Do not come near hither; pluck off thy shoes from off thy feet, the place where thou standest is holy ground.’ The visible testimony of the divine Presence sanctified the place, and the most humble outward reverence was due, a sign and effect of the internal respect that is owing to his most adorable Majesty. The sanctity of that place was an extraordinary relation and ceased upon the vanishing of the flame, the sign of God’s Presence.</p></blockquote>

d it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-544f7ad273" data-kw="">
<blockquote><p>But as touching these ceremonies in question, we are upon evident grounds persuaded in our consciences that they are both unlawful and inexpedient for our Church: and though they were lawful in themselves, yet we may answer as the oppugners of the Interim [1548] replied to those who urged yielding to the ceremonies of the same (Friedrich Balduin [a Lutheran], On Cases of Conscience, bk. 4, ch. 11, case 3), surplice, holy days, tapers [candles], etc. because of the emperor’s commandment. That the question is not about things indifferent, but about a main article of faith, namely Christian Liberty, which admits not any yoke to be imposed upon the conscience, no not in things indifferent.</p></blockquote>

</figure><figure class="quote" id="q-9714cc21b3" data-kw="">
<blockquote><p>5. By their fruits shall we know them; look whether they give so much liberty to others and take so much to themselves upon their holy days for staying from the public worship and attending wordly business, as they do at the diets of weekly and ordinary preaching: yet they would make the simple believe that their holy days are only appointed to be kept as those ordinary times set apart for divine service on the week-days. Nay, moreover, let it be observed, whether or not they keep the festival days more carefully, and urge the keeping of them more earnestly than the Lord’s own day. Those prelates that will not abase themselves to preach upon ordinary Sabbaths, think the high holy days worthy of their sermons. They have been also often seen to travel upon the Lord’s Day, whereas they hold it religion to travel upon a holy day. And whereas they can digest the common profanation of the Lord’s Day and not challenge it, they cannot away with the not observing of their festivities.</p></blockquote>

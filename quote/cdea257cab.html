<main class="wrap"><figure class="quote" id="q-cdea257cab" data-kw="">
<blockquote><p>XL. Our [Reformed] theologians also inquire whether angels are part of the Church. Tilenus, Polanus and others who want the Church to be taken broadly enough to include even the angels affirm this. However, the illustrious Amyraldus, in his Theses on the Parts of the Church, denies it along with many others. I think briefly that there is great communion between angels and pious and faithful men, and that Christ’s death reconciled angels to men and closely united them, making angels protectors and guardians of the faithful and promoting their salvation. But pious men form a certain society among themselves to which angels do not belong. The name ‘Church’ in Scripture is only attributed to the society of men and never includes angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church</cite>, p. 429 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f1dcbad45a" data-kw="">
<blockquote><p>3. Place XV. Third, the place of their existing, which they occupy not only by reason of their operating, but by coexistence; nor by circumscription, as if they were bounded extrinsically, like bodies; nor by repletion, or infinite coexistence; but by delimitation,18 whereby on account of the finitude of their essence, they are so restricted to this place that they may not be in a different one.19 Thus it is said that in one man there was a legion (Luke 8:30). 18. definitio, cf. §XXVIII, below 19. …non sola operandi ratione, sed per coexistentiam; nec per circumscriptionem…; nec per repletionem…; sed per definitionem…. Cf. Roelf T. te Velde, Paths Beyond Tracing Out: The Connection of Method and Content in the Doctrine of God, Examined in Reformed Orthodoxy, Karl Barth, and the Utrecht School (Delft: Uitgeverij Eburon, 2010), 139. 4. Motion XVI. Accordingly, fourth, a local motion by which they pass from place to place (Gen. 28:12), which although it is most rapid, since no medium resists it, from which they are compared to wind and fire (Ps. 104:4), and the seraphim are said to be winged (Ezek. 1:6), and like lightning (Luke 10:18), yet it occurs not in a moment, but successively.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology, vol. 3, bk. 3, ch. 7, The Good Angels, §15</cite>, pp. 183-84</span></figcaption>

%20moment%2C%20but%20successively." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3deccb32a6" data-kw="">
<blockquote><p>Men understand by way of syllogistical discourse, viz. by reasoning; that is, by deducing and gathering conclusions from principles by several acts of their understanding: and by compounding and dividing: that is, by laying the subject and predicate together, or by taking them asunder: and thereby collecting what may be said, or not said truly concerning such a subject. Those truths which men, by reason of the weakness of their understanding, apprehend not without discourse and by compounding and dividing (Thomas, pt. 1, quest. 58, art. 3-4; Polanus, Syntagma, bk. 5, ch. 11), angels, by reason of the quickness and strength of their understanding, apprehend readily and as it were at first sight. Whence albeit they understand syllogistical discourse, composition and division, yet (at least compared with men) they may be said not to understand by discourse, nor by composition and division, but intuitively and as it were at first sight.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London, 1654), ch. 1, Of the Divine Essence</cite>, pp. 16-17</span></figcaption>

</figure><figure class="quote" id="q-df026d6c02" data-kw="">
<blockquote><p>There is no created holiness sure, stable, and perfect in itself: The glorious angels which are, and ever shall be saints in Heaven, and the saints in Heaven who are like angels, stand not in that holy and happy estate by their own sufficiency, but by the decree and grace of God. Those angels which fell at first were holy, and they who now stand, might have fallen notwithstanding their created holiness, if God had not superadded confirming grace which establishes them forever. Yet this is not all, that the angels are imperfect because they might fall if not supported, there is somewhat more in it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job… (London: 1650), sermon on Job 15:15</cite>, pp. 62-63</span></figcaption>

</figure><figure class="quote" id="q-753214a097" data-kw="against perpetual guardian angel">
<blockquote><p>Is a particular angel assigned as a perpetual guardian to each believer? We deny. From Acts 12:15, where mention is made of Peter’s angel, it can be collected that a certain angel was then present with Peter, but not that a particular and perpetual guardian was given to him. For he is said “to have come upon him”; as when “the physician and servant of the king” is alluded to, not a particular one is understood, but indefinitely he who performs that office (which many can perform successively).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.8</span></figcaption>

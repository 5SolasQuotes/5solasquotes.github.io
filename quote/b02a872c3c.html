<main class="wrap"><figure class="quote" id="q-b02a872c3c" data-kw="">
<blockquote><p>4. Zepperus, On the Sacraments, ch. 13, fol. 324-26, 328.

1. The furious clamors and persecutions of the Papists did not permit this reformation of ceremonies at the first: which were so violent and bloody, that it gave small or no leisure to the teachers and lights of the Church, neither was it safe for them to bend their care or cogitations this way.

2. The people were so drowned in the deep darkeness and idolatry of the Papacy that the amendment of ceremonies, and of external worship could not in those beginnings be undertaken. It was necessary to use doctrine, and to instruct the people of sundry and horrible errors, idolatry, superstitions and abuses, which the whole Papacy and Popish ceremonies have in their departure, that so all those ugly things might first be removed out of their minds, before they were removed from their sight. That which is not the work of one year, but a task of long season: For as ceremonies which are visible things and apprehended by the eyes do more affect and move than the invisible doctrine; So the people did closely stick to their accustomed ceremonies, and opposed themselves vehemently against the reformation of them: Even as we see at this day to come to pass, when as yet sound doctrine has prevailed and flourished for above these 80 years.

3. The Church in Popery was nothing else but a sick body: In which from the sole of the foot to the crown of the head, there was nothing sound and entire: Wherefore at the first beginning of reformation that whole chaos and abomination of error, and of Popish idolatry could not suddenly be perceived, but use and experience did daily manifest and teach every day more, than at the first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘Reformed Practices’, pp. 173-74</span></figcaption>

<blockquote><p>Again, he [an episcopalian] argues we cannot be said to be members of a particular Church, or to hold communion with it, if we do not join in their worship, as it is established among them. This is easily answered by a plain distinction: unless we join in their established worship, as to the greatest and chief acts of it, conceditur [it is conceded]: as to all the parts of it, even to the least, negatur [I deny]. I may join with a Church in the Word and sacraments; and yet if they have a holy day or two beside the Sabbath, may forbear; yea I may, without this be a member of that Church (if they will suffer me), which all the Reformed Churches do, except the Episcopal Church of England.</p></blockquote>

</figure><figure class="quote" id="q-f9c7f70eeb" data-kw="">
<blockquote><p>They [older non-conformists] argue that there is no necessity for [total] Separation for the sake of such corruptions, because a person may communicate in the worship without partaking in those corruptions…

1. This separation of the good from the bad in divine worship they grant possible. So Mr. [John] Ball: ‘If some things human be mixed with divine, a sound Christian must separate the one from the other, and not cast away what is of God as a nullity, fruitless, unprofitable, defiled, because somewhat of men is annexed unto them. In the body we can distinguish betwixt the substance and the sickness which cleaves unto it; betwixt the substance of a part or member, and some bunch or swelling, which is a deformity, but destroys not the nature of that part or member, etc.’ (Trial of the Grounds, etc., [ch. 13,] p. 308) …

2. They grant that what is faulty and a sin in worship, is no sin to us when we do not consent to it. So Mr. [John] Corbet: ‘My partaking in any divine worship, which is holy and good for the matter and allowable or passable in the mode for the main, does not involve me in the blame of some sinful defects therein, to which I consent not and which I cannot redress.’ (Non-Conformists Plea, etc., p. 6) So another [John Barret], in his Farewell Sermon: ‘While all necessary fundamental truth is publicly professed and maintained in a Church, is taught and held forth in public assemblies and the corruptions there (though great, yet) are not such as make the worship cease to be God’s worship, nor of necessity to be swallowed down if one would communicate in that worship, while any Christian (that is watchful over his own heart and carriage, as all ought ever to be) may partake in the one, without being active in, or approving the other; there God is yet present, there he may be spiritually worshipped, served acceptably, and really enjoyed.’ (England‘s Remembrancer, sermon 4, p. 94)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">London Ministers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Collection of Cases &amp; other Discourses lately written to recover Dissenters</cite>, (London, 1685), vol. 1, John Williams, ‘The Non-Conformists’ Plea for Lay-Communion with the Church of England’ Williams (d. 1709) was an Anglican bishop., p. 32</span></figcaption>

<blockquote><p>Neither may they forbid a communion with them in good because all communion in evil is denied us. Neither to hear them preach evil or untruth is to communicate with them in evil, except we yield to, believe, or obey their evil. And so those Scriptures forbidding to hear are to be understood. For Jeremiah did hear the false prophet Hananiah and said ‘amen’ to his prayer (Jer. 28:6). That is, to that good, or to those words of his prayer which might be taken well, he answered ‘so be it, the Lord ratify they words,’ but yet he reproved the evil.</p></blockquote>

<blockquote><p>6. The goodness of God is seen in bearing with the infirmities of his people and accepting imperfect obedience. Though Asa had many blots in his escutcheon [a coat of arms as an emblem], yet they are over-looked, and this note set upon record by divine goodness, that his heart was perfect towards the Lord all his days: ‘But the high places were not removed, nevertheless Asa’s heart was perfect with the Lord all his days.’ (1 Kings 15:14) He takes notice of a sincere, though chequered obedience, to reward it, which could claim nothing but a slight from Him if he were extreme to mark what is done amiss. When there is not an opportunity to work, but only to will, He accepts the will, as if it had passed into work and act. He sees ‘no iniquity in Jacob,’ (Num. 23:21) i.e. He sees it not so as to cast off a respect to their persons and the acceptance of their services: His omniscience knows their sins, but his goodness does not reject their persons. He is of so good a disposition that He delights in a weak obedience of his servants, not in the imperfection but in the obedience: ‘He delights in the way of a good man,’ (Ps. 37:23) though he sometimes slips in it: He accepts a poor man’s pigeon as well as a rich man’s ox; He has a bottle for the tears and a book for the services of the upright (Ps. 56:8), as well as for the most perfect obedience of angels. He preserves their tears as if they were a rich and generous wine, as the vine-dresser does the expressions [pressed out flowings] of the grape.</p></blockquote>

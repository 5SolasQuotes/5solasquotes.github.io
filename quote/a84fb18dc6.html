<main class="wrap"><figure class="quote" id="q-a84fb18dc6" data-kw="">
<blockquote><p>As the essence of the Godhead is common to the several persons, they have a common intelligence, will, and power. There are not in God three intelligences, three wills, three efficiencies. The Three are one God, and therefore have one mind and will. This intimate union was expressed in the Greek Church by the word perichoresis, which the Latin words inexistentia, inhabitatio, and intercommunio, were used to explain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8823651c54" data-kw="">
<blockquote><p>This union [of the person of the Son with the human nature in the inarnation] can be viewed either in respect of the principle or in respect of the terminus. In the former sense, it is attributed to the whole Trinity, by the power of which such union is made (to wit, by a transient action of God by which he united in the person of the Logos, the humanity of Christ). In the latter, it belongs to the Logos alone because it is terminated on him. Although the person of the Logos may well be said to have been incarnate, yet the Trinity itself may not because the incarnation is not terminated on the divine nature absolutely, but on the person of the Logos relatively.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 2, 13th Topic, Question 6, section 4, p. 311</span></figcaption>

</figure><figure class="quote" id="q-c8ce53b64b" data-kw="">
<blockquote><p>24. III. And the existence of this divine essence must be known by us in this gradual threefold conception: 1. In virtute (vel potentia) [in virtue or power], 2. In actu immanente [in an immanent act], 3. In actione transeunte [in a transitive action]. Of the first I shall say no more than what is said before. By the second I mean God’s own most perfect essence as active in itself, without extrinsic effect or object. By the third, I mean not the creature, or the divine action ut recipitur in passo [as it is received in the patient], or the effect, but the divine essence itself in the state of agency ad extra [toward what is outside]; which the schools conclude to be eternal, though the effect is but in time. Yet if any will call this a free and not a necessary state of the divine essence, I contend not.

25. IV. The essential immanent acts of God are three:

1. Sibi vivere [to live to Himself], or to be essential active life in Himself;

2. Se intelligere [to understand Himself], to know Himself;

3. Se amare [to love Himself], or to be amor sui [self-love].</p></blockquote>

<blockquote><p>Helpful history of key figures and moves.” – Mark Jones . On the Medieval Church Articles Muller, Richard – pt. 1, ch. 1, ‘The Doctrine of the Trinity in the Christian Tradition: the Medieval Backgroun’ ToC in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725, vol. 4, The Triunity of God 2nd ed. (Baker Books, 2003), pp. 17-59 Butner, D. Glenn – ‘For &amp; Against [Theodore] de Regnon: Trinitarianism East &amp; West’ (2015) 13 pp. Abstract: “Modern systematic theologians frequently claim that Eastern trinitarianism begins with the persons while Western trinitarianism begins with the divine essence, and fails to truly differentiate the persons. This article explores the origins of this claim in the writing of Theodore de Régnon [1831-1893], noting recent criticism of his paradigm’s applicability to the patristic era. In response to these criticisms, I argue ﬁrst for the limited validity of the de Régnon paradigm by demonstrating its applicability in the Carolingian–Photian dispute surrounding the ﬁlioque. I then argue against the deployment of the paradigm as a controlling schema in systematic theology by pointing to problems this narrative has created in the theology of Robert Jenson and John Zizioulas.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-76c6f8bafd" data-kw="">
<blockquote><p>Creation, Providence and Redemption, considered as they are in God, i.e. as immanent acts, belong unto God’s sufficiency and may be placed amongst his attributes; but if they be looked at as transient acts, i.e. as acts passing, and done in time; so they belong unto God’s efficiency, and are placed amongst the works of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, ... (London: 1654), ch. 1, Of the Divine Essence, p. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4033150b6b" data-kw="">
<blockquote><p>1. God by a virtual or ordinative will does will the turning and salvation of all men within the bosom of the church; for they have Jesus Christ set before their eyes, and what was the true end of Christ’s coming, but to turn every one from his iniquities, (Acts 3:26)… Neither will it salve the business, to say, there is a voluntas signi [will of sign] in all this; for what is voluntas signi, if it be not signum voluntatis [asign of the will]? If it be only an outward sign or appearance, and there be no counterpane or prototype thereof, within the divine will, how is it a true sign? which way could it be breathed out from God’s heart? When God makes his great gospel supper, and says, ‘Come, for all things are ready;’ he is not, he cannot be like him with the evil eye, who says, Eat and drink, but his heart is not with thee, (Prov.xxiii.6.7.) No, God’s heart goes along with every offer of grace; he never calls, but in a serious manner.</p></blockquote>

<blockquote><p>XXI. God will have all men to be saved and He will have wicked men to be damned: that, is his antecedent will; this, his consequent: that, is sometimes frustrated of its end, this never; and its fitting that seeing his will cannot be fulfilled by us, it should be fulfilled upon us. They that will not satisfy his will by their obedience, shall satisfy his will in suffering just vengeance.</p></blockquote>

<blockquote><p>2. ‘What is the nature of the permissive will of God, and of the will of good pleasure and sign. The Remonstrants, Arminians are called to the discussion, the faith of Judas the traitor, which nevertheless He by no means willed or decreed by the will of good pleasure since such things never happen in the nature of things… the object of the will of sign or approving of God, is that which is morally good and honest, but of the disapproving, what is unjust and evil: whether it happen in the nature of things, or not… Thus God willed and commanded the repentance of Cain, but it by no means follows therefore Cain repents, because the event of the thing or non-event of the thing is badly, and by no art of logic concluded from the will of sign or approving… the commandment of God does not signify to us the will of God about such an event; but only the will of God about such moral equity of the thing. … as far as pertains to the essence of the will of sign, God equally approves with moral complacency the final obedience of Judas the traitor, as the obedience of Peter the apostle:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scholastic Disputation on Divine Providence, chs. 1-10</cite>, tr. by AI by Onku (Edinburgh, 1649), ch. 2. ‘What is the nature of the permissive will of God, and of the will of good pleasure and sign. The Remonstrants, Arminians are called to the discussion’ Latin, pp. 12-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>360. XII. The last now to be named is the antecedent and consequent will. This also is handled by many Schoolmen and much used by the Jesuits and Arminians. To pass by others, Pennottus handles it Propugn. bk. 4, ch. 21, having first showed, ch. 20, p. 225 that Chrysostom and Damascene first used it. His explicatory propositions are: 1. Voluntas antecedens et consequens non est in Deo respectu omnium volitorum, sed solum respectu eorum quae aliquo modo pendent ex lib. arbtrio creaturae. [The antecedent and consequent will do not exist in God with respect to all things willed, but only with respect to those things which in some manner depend upon the free will of the creature.] 2. Voluntas antecedens est illa qua Deus vult hominis salutem quantum in ipso est, et qua illum ad salutem ordinat, et media ad salutem necessaria praeparat, quibus nisi per ipsum hominem steterit, salutem assequatur. [The antecedent will is that by which God wills the salvation of man, insofar as it lies in Him, and by which He ordains him to salvation and prepares the means necessary for salvation, so that, unless the hindrance to salvation should arise from the man himself, he may attain salvation.] 3. Non semper voluntas antecedens et consequens circa objecta contraria versantur, sed potest idem objectum esse volitum à Deo voluntate tum antecedente tum consequente. [The antecedent and consequent will do not always concern contrary objects; rather, the same object may be willed by God both by the antecedent will and by the consequent will.] 4. Voluntas antecedens in Deo est voluntas beneplaciti, et non solum voluntas signi. [The antecedent will in God is the will of good pleasure, and not merely the will of sign.] 5. Voluntas antecedens est formaliter et proprie in Deo existens, et non solum per metaphoram ad eum modum, quo voluntas signi. [The antecedent will exists formally and properly in God, and not merely metaphorically, in the manner in which the will of sign does.] 361. I tell you their sense that I may the better open the plain truth to you, which is as follows: 1. This distinction of voluntas antecedens et consequens is not applied to God as He is our Creator, or end, nor as He is mere Proprietor or Benefactor, but only as He is Rector or [the] Moral Ruler of man. 2. As government has an antecedent and consequent part, viz. legislation and judgement (with execution), so God’s antecedent will is nothing but his legal will, or his will as Rector signified by his laws; and his consequent will is his judicial will, or expressed in judgment: one antecedent to man’s part (obedience or disobedience) and the other consequent to it. 3. It is most certain that God wills antecedently all that is in his Law, that is, that all that believe and repent shall be saved: and that He wills consequently that Judas e.g., and every finally impenitent unbeliever, shall be damned. For what God does, that He wills to do: But God does Himself make such a Law and pass such a judgement: Therefore He is willing of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology</cite>, ... (London: White, 1675) | pt. 1, sect. 14, Of Several Distinctions of God’s Will, pp. 56-57</span></figcaption>

<div class="actions"><button class="copy" data-copy="“360. XII. The last now to be named is the antecedent and consequent will. This also is handled by many Schoolmen and much used by the Jesuits and Arminians. To pass by others, Pennottus handles it Propugn. bk. 4, ch. 21, having first showed, ch. 20, p. 225 that Chrysostom and Damascene first used it. His explicatory propositions are: 1. Voluntas antecedens et consequens non est in Deo respectu omnium volitorum, sed solum respectu eorum quae aliquo modo pendent ex lib. arbtrio creaturae. [The antecedent and consequent will do not exist in God with respect to all things willed, but only with respect to those things which in some manner depend upon the free will of the creature.] 2. Voluntas antecedens est illa qua Deus vult hominis salutem quantum in ipso est, et qua illum ad salutem ordinat, et media ad salutem necessaria praeparat, quibus nisi per ipsum hominem steterit, salutem assequatur. [The antecedent will is that by which God wills the salvation of man, insofar as it lies in Him, and by which He ordains him to salvation and prepares the means necessary for salvation, so that, unless the hindrance to salvation should arise from the man himself, he may attain salvation.] 3. Non semper voluntas antecedens et consequens circa objecta contraria versantur, sed potest idem objectum esse volitum à Deo voluntate tum antecedente tum consequente. [The antecedent and consequent will do not always concern contrary objects; rather, the same object may be willed by God both by the antecedent will and by the consequent will.] 4. Voluntas antecedens in Deo est voluntas beneplaciti, et non solum voluntas signi. [The antecedent will in God is the will of good pleasure, and not merely the will of sign.] 5. Voluntas antecedens est formaliter et proprie in Deo existens, et non solum per metaphoram ad eum modum, quo voluntas signi. [The antecedent will exists formally and properly in God, and not merely metaphorically, in the manner in which the will of sign does.] 361. I tell you their sense that I may the better open the plain truth to you, which is as follows: 1. This distinction of voluntas antecedens et consequens is not applied to God as He is our Creator, or end, nor as He is mere Proprietor or Benefactor, but only as He is Rector or [the] Moral Ruler of man. 2. As government has an antecedent and consequent part, viz. legislation and judgement (with execution), so God’s antecedent will is nothing but his legal will, or his will as Rector signified by his laws; and his consequent will is his judicial will, or expressed in judgment: one antecedent to man’s part (obedience or disobedience) and the other consequent to it. 3. It is most certain that God wills antecedently all that is in his Law, that is, that all that believe and repent shall be saved: and that He wills consequently that Judas e.g., and every finally impenitent unbeliever, shall be damned. For what God does, that He wills to do: But God does Himself make such a Law and pass such a judgement: Therefore He is willing of it.”

— Richard Baxter, Richard Baxter’s Catholic Theology... (London: White, 1675) | pt. 1, sect. 14, Of Several Distinctions of God’s Will, pp. 56-57">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C360.+XII.+The+last+now+to+be+named+is+the+antecedent+and+consequent+will.+This+also+is+handled+by+many+Schoolmen+and+much+used+by+the+Jesuits+and+Arminians.+To+pass+by+others%2C+Pennottus+handles+it+Propugn.+bk.+4%2C+ch.+21%2C+having+first+showed%2C+ch.+20%2C+p.+225+that+Chrysostom+and+Damascene+first+used+it.+His+explicatory+propositions+are%3A+1.+Voluntas+antecedens+et+consequens+non+est+in+Deo+respectu+omnium+volitorum%2C+sed+solum+respectu+eorum+quae+aliquo+modo+pendent+ex+lib.+arbtrio+creaturae.+%5BThe+antecedent+and+consequent+will+do+not+exist+in+God+with+respect+to+all+things+willed%2C+but+only+with+respect+to+those+things+which+in+some+manner+depend+upon+the+free+will+of+the+creature.%5D+2.+Voluntas+antecedens+est+illa+qua+Deus+vult+hominis+salutem+quantum+in+ipso+est%2C+et+qua+illum+ad+salutem+ordinat%2C+et+media+ad+salutem+necessaria+praeparat%2C+quibus+nisi+per+ipsum+hominem+steterit%2C+salutem+assequatur.+%5BThe+antecedent+will+is+that+by+which+God+wills+the+salvation+of+man%2C+insofar+as+it+lies+in+Him%2C+and+by+which+He+ordains+him+to+salvation+and+prepares+the+means+necessary+for+salvation%2C+so+that%2C+unless+the+hindrance+to+salvation+should+arise+from+the+man+himself%2C+he+may+attain+salvation.%5D+3.+Non+semper+voluntas+antecedens+et+consequens+circa+objecta+contraria+versantur%2C+sed+potest+idem+objectum+esse+volitum+%C3%A0+Deo+voluntate+tum+antecedente+tum+consequente.+%5BThe+antecedent+and+consequent+will+do+not+always+concern+contrary+objects%3B+rather%2C+the+same+object+may+be+willed+by+God+both+by+the+antecedent+will+and+by+the+consequent+will.%5D+4.+Voluntas+antecedens+in+Deo+est+voluntas+beneplaciti%2C+et+non+solum+voluntas+signi.+%5BThe+antecedent+will+in+God+is+the+will+of+good+pleasure%2C+and+not+merely+the+will+of+sign.%5D+5.+Voluntas+antecedens+est+formaliter+et+proprie+in+Deo+existens%2C+et+non+solum+per+metaphoram+ad+eum+modum%2C+quo+voluntas+signi.+%5BThe+antecedent+will+exists+formally+and+properly+in+God%2C+and+not+merely+metaphorically%2C+in+the+manner+in+which+the+will+of+sign+does.%5D+361.+I+tell+you+their+sense+that+I+may+the+better+open+the+plain+truth+to+you%2C+which+is+as+follows%3A+1.+This+distinction+of+voluntas+antecedens+et+consequens+is+not+applied+to+God+as+He+is+our+Creator%2C+or+end%2C+nor+as+He+is+mere+Proprietor+or+Benefactor%2C+but+only+as+He+is+Rector+or+%5Bthe%5D+Moral+Ruler+of+man.+2.+As+government+has+an+antecedent+and+consequent+part%2C+viz.+legislation+and+judgement+%28with+execution%29%2C+so+God%E2%80%99s+antecedent+will+is+nothing+but+his+legal+will%2C+or+his+will+as+Rector+signified+by+his+laws%3B+and+his+consequent+will+is+his+judicial+will%2C+or+expressed+in+judgment%3A+one+antecedent+to+man%E2%80%99s+part+%28obedience+or+disobedience%29+and+the+other+consequent+to+it.+3.+It+is+most+certain+that+God+wills+antecedently+all+that+is+in+his+Law%2C+that+is%2C+that+all+that+believe+and+repent+shall+be+saved%3A+and+that+He+wills+consequently+that+Judas+e.g.%2C+and+every+finally+impenitent+unbeliever%2C+shall+be+damned.+For+what+God+does%2C+that+He+wills+to+do%3A+But+God+does+Himself+make+such+a+Law+and+pass+such+a+judgement%3A+Therefore+He+is+willing+of+it.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Richard+Baxter%E2%80%99s+Catholic+Theology...+%28London%3A+White%2C+1675%29+%7C+pt.+1%2C+sect.+14%2C+Of+Several+Distinctions+of+God%E2%80%99s+Will%2C+pp.+56-57&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6d8ba7dbf0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6d8ba7dbf0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=360.%20XII.%20The%20last%20now%20to,Therefore%20He%20is%20willing%20of%20it&amp;text=360.%20XII.%

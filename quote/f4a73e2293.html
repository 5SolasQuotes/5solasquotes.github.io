<main class="wrap"><figure class="quote" id="q-f4a73e2293" data-kw="">
<blockquote><p>Among “evangelical Calvinists” Henry Scougal’s book, The life of God in the soul of man, is held in high esteem – largely owing to the book’s influence upon George Whitefield. The Scottish Seceders, however, regarded it as a work that was harmful to the gospel:

Socinian and Arminian doctrine is now in such general request, that some have ventured openly to recommend these principles without being noticed by any of the judicatories of the church. Mr. William Wishart, principal of the college of Edinburgh, has recommended Dr. Scougal’s life of God in the soul of man, upon which Mr. Whitefield’s experiences are founded; a book calculated to lead off from faith in the righteousness of Christ without us, to a righteousness within us, and inward sensations, as the ground of our pardon and acceptance before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/acts-of-the-associate-presbytery-with-an.html">Acts of the Associate Presbytery; with an</a></span><span class="wk"><span class="lbl">Work:</span> <cite>discovering the rise and progress of the opposition to the doctrine of grace, and the reasons of the passing and publishing this Act, in vindication of the same</cite>, (Glasgow, 1762), vi-vii.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-fe9e827b1c" data-kw="">
<blockquote><p>The short [of your inquiring letter] whereof is: The receiving without public repentance of those which come from the Churches of England [to separate assemblies in England]: where because in the outward profession, that the laws of the land do justify the dumb [non-preaching] ministry, there appear unto you no lawful assemblies of the Church of Christ; your fear is, lest in uniting yourselves with such [by allowing them into the good graces of the separate assemblies], you should be unequally yoked [with them], and made fellow members of some other than of that whereof Christ Jesus is the Head. First therefore, if it be showed that the ordinary assemblies of those that profess the Gospel in England be the Churches of Christ, it seems that the way will be paved and planed for mutual intercourse between us…</p></blockquote>

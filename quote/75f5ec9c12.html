<main class="wrap"><figure class="quote" id="q-75f5ec9c12" data-kw="">
<blockquote><p>That which no law of God or valid law of man forbids, is not unlawful: but the use of the things forementioned, no law of God or valid law of man forbids: Therefore the use of the things forementioned, is not unlawful. He that will say that there is any such law must show that law and prove his affirmative: But let him take heed of adding to God’s law: A false prophet that fathered a false message from God was an heinous sinner. Is it not worse falsely to father a law on Him?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes… (London: 1684), pt. 2</cite>, p. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-a86835e0cd" data-kw="">
<blockquote><p>This foolish imitation of the apostles in all things in matters of external order, has been and is the great foundation of evils on all hands, both in many practices and points of Popery, and amongst the Anabaptists (as I could demonstrate in particulars). Learned Danaeus in his Commentaries upon 1 Tim. ch. 5 [v. 13] speakes of it. Apostolici inter Anabaptist as Schlusselburgius writes also (On the Sect of the Anabaptists), that there is a sort of Anabaptists called Apostolici [Apostles], so named because they professed to imitate the apostles in all things: they washed one another’s feet, they held all things ought to be common, they travailed up and down without staff, shoes, cloak, money, because of Christ’s words, they went up to the tops of houses to preach, because Christ had said, what you have heard in the ear, preach upon the house-top.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644)</cite>, pp. 77-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-dd6a40202f" data-kw="">
<blockquote><p>If it departs entirely from the judgment of natural and divine law (jus naturale et divinum), it is not to be called law (lex). It is entirely unworthy of this name, and can obligate no one against natural and divine equity.</p></blockquote>

</figure><figure class="quote" id="q-258f167564" data-kw="">
<blockquote><p>…the question is, Why the bread is called Christ’s body and the cup Christ’s blood: that is, why the things signified are attributed to the signs, and the signs called by their name. There are two causes alleged hereof: 1. For the natural analogy or likeness, which Christs body and the bread have between themselves. 2. For the certainty or confirmation of the joint-exhibition of the sign, and the thing signified in the true use.</p></blockquote>

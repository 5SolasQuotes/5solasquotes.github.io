<main class="wrap"><figure class="quote" id="q-faff7e21b8" data-kw="">
<blockquote><p>Wherefore John Baptist declaring the office of Christ, when he shewed him with his finger, said: Behold the lamb of God, which taketh away the sins of the world. These things make against the Anabaptists, which make the Gospel to be nothing but good works, and a most absolute conversation.

These men know not the chief and principal benefit of Christ, neither make they any difference between the law and the Gospel. The law in deed commandeth: but the Gospel ministreth strengths to accomplish those things which are commanded. The law accused the: The Gospel absolveth: The law maketh a sound outwardly: The Gospel is graven in the bowels: The law worketh anger: The Gospel maketh God pacified, and reconciled unto us: The law by making afeard, dejecteth the mind: The Gospel by comforting, erecteth it: The law is the ministry of death: The gospel, of life: The law, is a, schoolmaster: The gospel, is a perfect instruction: The whole law consisteth in this, that we should work:

The Gospel herein chiefly consisteth, that we should believe: The law bringeth a curse unto them which live under it: The Gospel bringeth blessing: The law bringeth bondage: The Gospel, spiritual liberty: The law, is the letter: The Gospel, is the spirit: The law hath promises, but with this condition, if ye shall do all those things: The promises of the Gospel, are free, and therefore firm. There might be rehearsed also other differences, whereby these two differ very much, asunder. But at this time we think these to be sufficient.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a5062932b0" data-kw="">
<blockquote><p>If some admirer of the sky and the stars – and what can one think of that is more beautiful than these bodies? – wanted to remove water from the nature of things, because it is no match for the brightness of the stars, would we not say that he is mad? If someone, out of admiration for the teachings of religion, ordered us to remove from our lives all laws and precepts of the state and all links of domestic life, would not all sane men judge it necessary for him to be suppressed by force and by the use of weapons?

And in these recent years we have seen some who were practising theology in an unholy way, madmen with fanatical opinions, punished for their errors. For you will remember Müntzer and the Anabaptists and other monsters of that kind. Consider those mad in the same way, who disturb the chorus and the harmony of the arts by neglect of, and contempt for, the lower arts. Therefore, just as when you think of the elements of writing you believe that the entire alphabet is necessary for discourse, so you will consider all the disciplines that are taught in the schools necessary for life.

For only he can have the right feelings about the arts, who, when he has noticed their order, understands that each art has been devised because of its certain usefulness. I have said this to remind young men of it, many of whom we see rushing unrestrainedly towards the higher disciplines, not only to their own detriment, but also to that of the state. For your studies do not concern only you, but also the state.

And you ought to keep in view the purpose of your studies, and decide that they are provided for giving of advice for the state, for teaching in the churches and for upholding the doctrine of religion. You will not be able to excel in any of those without perfect doctrine, and perfect doctrine is not granted to anyone without the lower disciplines.</p></blockquote>

<blockquote><p>Anno, 1522. Did arise in Saxony Nicholas Stork, who boasted of dreams and visions and rejected the Scripture as being a carnal and literal rule. Antinomians call it carnal, literal, and legal. From him and others arose Thomas Muntzer, about anno 1524, who styled himself “Thomas Muntzer, the servant of God, with the sword of Gideon against the ungodly.” This man, being hungry for glory, hunted for Luther’s name to his new designs but not obtaining it, said but [unclear] Antichrist: that Luther’s carnal and literal gospel was worse than the pope and therefore cried down books and the letter of Scripture and said the Spirit was the leader and rule to believers.</p></blockquote>

<blockquote><p>Hence I believe that there is one Church of those who have the same Spirit, through whom they are made certain that they are the true children of the family of God; and this is the first fruits of the Church. I believe that this Church does not err in regard to truth, namely in those fundamental matters of faith upon which everything depends. I believe also that the universal, visible Church is one, while it maintains that true confession, of which we have already spoken. I believe also that all belong to this Church who give their adherence to it according to the rule and promise of God’s Word. I believe that to this Church belong Isaac, Jacob, Judah and all who were of the seed of Abraham, and also those infants whose parents in the first beginnings of the Christian Church, through the preaching of the apostles, were won to the cause of Christ. For if Isaac and the rest of the ancients had not belonged to the Church, they would not have received the Church’s token, circumcision. Since these, then, were members of the Church, infants and children belonged to the primitive Church. Therefore I believe and know that they were sealed by the sacrament of baptism. For children also make a confession, when they are offered by their parents to the Church, especially since the promise offers them to God, which is made to our infants no less, but even far more amply and abundantly, than formerly to the children of the Hebrews. These are the grounds for baptizing and commending infants to the Church, against which all the weapons and war engines of the Anabaptists avail nothing. For not only are they to be baptized who believe, but they who confess, and they who, according to the promise of God’s Word, belong to the Church. For otherwise even the apostles would not have baptized anyone, since no apostle had absolute evidence regarding the faith of one confessing and calling himself a Christian. For Simon the impostor, Ananias, Judas, and no one knows who, were baptized when they declared their adherence to Christ, even though they did not have faith. On the other hand, Isaac was circumcised as an infant without declaring his adherence or believing, but the promise acted in his behalf. But since our infants are in the same position as those of the Hebrews, the promise also declares their adherence to our Church and makes confession. Hence, in reality baptism, like circumcision (I am speaking of the sacrament of baptism) pre-supposes nothing but one of two things, either confession, i.e., a declaration of allegiance or a covenant, i.e., a promise. All of which will become somewhat clearer from what follows.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Hence I believe that there is one Church of those who have the same Spirit, through whom they are made certain that they are the true children of the family of God; and this is the first fruits of the Church. I believe that this Church does not err in regard to truth, namely in those fundamental matters of faith upon which everything depends. I believe also that the universal, visible Church is one, while it maintains that true confession, of which we have already spoken. I believe also that all belong to this Church who give their adherence to it according to the rule and promise of God’s Word. I believe that to this Church belong Isaac, Jacob, Judah and all who were of the seed of Abraham, and also those infants whose parents in the first beginnings of the Christian Church, through the preaching of the apostles, were won to the cause of Christ. For if Isaac and the rest of the ancients had not belonged to the Church, they would not have received the Church’s token, circumcision. Since these, then, were members of the Church, infants and children belonged to the primitive Church. Therefore I believe and know that they were sealed by the sacrament of baptism. For children also make a confession, when they are offered by their parents to the Church, especially since the promise offers them to God, which is made to our infants no less, but even far more amply and abundantly, than formerly to the children of the Hebrews. These are the grounds for baptizing and commending infants to the Church, against which all the weapons and war engines of the Anabaptists avail nothing. For not only are they to be baptized who believe, but they who confess, and they who, according to the promise of God’s Word, belong to the Church. For otherwise even the apostles would not have baptized anyone, since no apostle had absolute evidence regarding the faith of one confessing and calling himself a Christian. For Simon the impostor, Anan — Huldrych Zwingli, Fidei Ratio, (1530) in James T. Dennison Jr. ed., Reformed Confessions of the 16th and 17th Centuries in English Translation: 1523–1693, vol. 1 (Grand Rapids: Reformation Heritage Books, 2008–14), 122–23.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence+I+believe+that+there+is+one+Church+of+those+who+have+the+same+Spirit%2C+through+whom+they+are+made+certain+that+they+are+the+true+children+of+the+family+of+God%3B+and+this+is+the+first+fruits+of+the+Church.+I+believe+that+this+Church+does+not+err+in+regard+to+truth%2C+namely+in+those+fundamental+matters+of+faith+upon+which+everything+depends.+I+believe+also+that+the+universal%2C+visible+Church+is+one%2C+while+it+maintains+that+true+confession%2C+of+which+we+have+already+spoken.+I+believe+also+that+all+belong+to+this+Church+who+give+their+adherence+to+it+according+to+the+rule+and+promise+of+God%E2%80%99s+Word.+I+believe+that+to+this+Church+belong+Isaac%2C+Jacob%2C+Judah+and+all+who+were+of+the+seed+of+Abraham%2C+and+also+those+infants+whose+parents+in+the+first+beginnings+of+the+Christian+Church%2C+through+the+preaching+of+the+apostles%2C+were+won+to+the+cause+of+Christ.+For+if+Isaac+and+the+rest+of+the+ancients+had+not+belonged+to+the+Church%2C+they+would+not+have+received+the+Church%E2%80%99s+token%2C+circumcision.+Since+these%2C+then%2C+were+members+of+the+Church%2C+infants+and+children+belonged+to+the+primitive+Church.+Therefore+I+believe+and+know+that+they+were+sealed+by+the+sacrament+of+baptism.+For+children+also+make+a+confession%2C+when+they+are+offered+by+their+parents+to+the+Church%2C+especially+since+the+promise+offers+them+to+God%2C+which+is+made+to+our+infants+no+less%2C+but+even+far+more+amply+and+abundantly%2C+than+formerly+to+the+children+of+the+Hebrews.+These+are+the+grounds+for+baptizing+and+commending+infants+to+the+Church%2C+against+which+all+the+weapons+and+war+engines+of+the+Anabaptists+avail+nothing.+For+not+only+are+they+to+be+baptized+who+believe%2C+but+they+who+confess%2C+and+they+who%2C+according+to+the+promise+of+God%E2%80%99s+Word%2C+belong+to+the+Church.+For+otherwise+even+the+apostles+would+not+have+baptized+anyone%2C+since+no+apostle+had+absolute+evidence+regarding+the+faith+of+one+confessing+and+calling+himself+a+Christian.+For+Simon+the+impostor%2C+Ananias%2C+Judas%2C+and+no+one+knows+who%2C+were+baptized+when+they+declared+their+adherence+to+Christ%2C+even+though+they+did+not+have+faith.+On+the+other+hand%2C+Isaac+was+circumcised+as+an+infant+without+declaring+his+adherence+or+believing%2C+but+the+promise+acted+in+his+behalf.+But+since+our+infants+are+in+the+same+position+as+those+of+the+Hebrews%2C+the+promise+also+declares+their+adherence+to+our+Church+and+makes+confession.+Hence%2C+in+reality+baptism%2C+like+circumcision+%28I+am+speaking+of+the+sacrament+of+baptism%29+pre-supposes+nothing+but+one+of+two+things%2C+either+confession%2C+i.e.%2C+a+declaration+of+allegiance+or+a+covenant%2C+i.e.%2C+a+promise.+All+of+which+will+become+somewhat+clearer+from+what+follows.%E2%80%9D%0A%0A%E2%80%94+Huldrych+Zwingli%2C+Fidei+Ratio%2C+%281530%29+in+James+T.+Dennison+Jr.+ed.%2C+Reformed+Confessions+of+the+16th+and+17th+Centuries+in+English+Translation%3A+1523%E2%80%931693%2C+vol.+1+%28Grand+Rapids%3A+Reformation+Heritage+Books%2C+2008%E2%80%9314%29%2C+122%E2%80%9323.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa0c4324357.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a0c4324357.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/02/zwingli-against-the-war-engines-of-the-anabaptists-in-1530/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>All things then being considered, it is manifest and plain, that the baptism of children is of God, against the which, sith that the anabaptists do repugn, it is without doubt that they do contrary the gospel, the election of God, and the everlasting covenant. They are therefore over bold &amp; rash, they are open violators or breakers of the covenant of God, unfaithful against God, sith that they do exclude and debar them from the covenant of God, whom God’s grace doth comprehend in the covenant.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2b30abdfa1" data-kw="efficacy moral">
<blockquote><p>The opinion of the orthodox is far different. First, they admit no blotting out of sin in baptism, springing ex opere operato or from a virtue inherent in it (as was proved before when we considered the efficacy of the sacraments). Second, they say that the efficacy of baptism (taken oppositely for the element and its dispensation) is moral, as has already been set forth; but the efficacy of baptism considered compositely for the sign and thing signified is real with respect to the one receiving it, although it is not restricted to the moment of baptism. Third, they acknowledge in baptism the testification and sealing of the twofold grace promised in the gospel; both of justification (by which sin is taken away as to its guilt so that it is not imputed) and of sanctification (by which its pollution is lessened and corrected that it may no more rule in us in this life; not however that it is not absolutely or exists in us anymore). The grace of justification pardons all our sins: original, actual, past, present and future.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.19.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/nature-and-institution.html">Nature and Institution</a> › <a href="../topics/baptism/nature-and-institution/union-with-christ.html">Union with Christ</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c7037dede4" data-kw="">
<blockquote><p>We have a proof of this in Cornelius the centurion, who, after he had been previously endued with the graces of the Holy Spirit, was baptised for the remission of sins, not seeking a fuller forgiveness from baptism, but a surer exercise of faith; nay, an argument for assurance from a pledge. It will, perhaps, be objected, Why did Ananias say to Paul that he washed away his sins by baptism (Acts 22:16), if sins are not washed away by the power of baptism? I answer, we are said to receive, procure, and obtain, whatever according to the perception of our faith is exhibited to us by the Lord, whether he then attests it for the first time, or gives additional confirmation to what he had previously attested. All then that Ananias meant to say was, Be baptised, Paul, that you may be assured that your sins are forgiven you. In baptism, the Lord promises forgiveness of sins: receive it, and be secure. I have no intention, however, to detract from the power of baptism. I would only add to the sign the substance and reality, inasmuch as God works by external means.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.15.15</span></figcaption>

</figure><figure class="quote" id="q-9cbaa3a91f" data-kw="">
<blockquote><p>In this matter of baptism — if I may be pardoned for saying it — I can only conclude that all the doctors have been in error from the time of the apostles. . . . All the doctors have ascribed to the water a power which it does not have and the holy apostles did not teach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Baptism</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/nature-and-institution.html">Nature and Institution</a></span></div>
<div class="actions"><button class="copy" data-copy="“In this matter of baptism — if I may be pardoned for saying it — I can only conclude that all the doctors have been in error from the time of the apostles. . . . All the doctors have ascribed to the water a power which it does not have and the holy apostles did not teach.”

— Huldrych Zwingli, Of Baptism">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+this+matter+of+baptism+%E2%80%94+if+I+may+be+pardoned+for+saying+it+%E2%80%94+I+can+only+conclude+that+all+the+doctors+have+been+in+error+from+the+time+of+the+apostles.+.+.+.+All+the+doctors+have+ascribed+to+the+water+a+power+which+it+does+not+have+and+the+holy+apostles+did+not+teach.%E2%80%9D%0A%0A%E2%80%94+Huldrych+Zwingli%2C+Of+Baptism&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9cbaa3a91f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9cbaa3a91f.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-3aa24a2f4e" data-kw="">
<blockquote><p>Baptism is a profession of faith in the Father, and the Son, and the Holy Spirit; not of a faith to be obtained through the ordinance, but of a faith already entertained. When the Eunuch applied to Philip for baptism, he said: “If thou believest with all thine heart thou mayest.” Of those who heard Peter’s sermon on the day of Pentecost it is said, “they that gladly received his word were baptized.” (Acts 2:41.) On this point, however, there can be no dispute. The only way in which Romanists and Romanizers evade this argument, is by denying that faith and repentance are the fruits of the Spirit, or of regeneration. They are in their view not gracious, but natural works, works done before regeneration; works which leave the soul in a state of perdition. But in this they contradict the express words of Christ, who says, whosoever believes shall be saved. And, in contradicting Christ, they contradict the whole Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Efficacy of Baptism”</span></figcaption>

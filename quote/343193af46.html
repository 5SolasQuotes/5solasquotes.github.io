<main class="wrap"><figure class="quote" id="q-343193af46" data-kw="">
<blockquote><p>just as the other acts signified under faith, as it were materially and by synecdoche, are not of themselves and directly ordered to the properly effecting of friendship with God and salvation, but either to faith (to which they in some way contribute), or at least to the not-losing of friendship with God or salvation; so neither do they properly and directly justify or save. They are useful, however, insofar as by them we exclude and avoid sins and ingratitude, which would altogether be the true cause of losing righteousness and salvation—such a cause as they are accustomed to refer to as a removing or prohibiting cause, and among causes per accidens.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/conrad-bergius.html">Conrad Bergius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Praexi Cathol. Divin. Canon., Dissertation 7</cite>, pp. 986-87 as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 364, trans. ChatGPT-5 Bergius (1544-1592) was a German reformed theologian.</span></figcaption>

<blockquote><p>Bellarmine: 1. The adversaries in this bring things together so that good works are not necessary to salvation, except for a necessity of presence, so that they do not have any relation to salvation as they are merits, causes, conditions, etc. We speak against them that just good works are necessary to salvation, even as an efficient principle, even as they bring about [efficiunt] salvation. Protestants: We do not deny that good works have some relation to salvation, namely that they have a relation of being joined as a consequence, as a fitting effect to salvation (so to speak), being joined as an antecedent, namely as a fitting disposition unto salvation, and also as an argument confirming trust and hope in salvation; but we deny that our works are able to be some meritorious cause of justification and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of the Necessity of Works unto Salvation’ in Bellarmine Enervated</cite>, vol. 4 (London, 1632), pp. 367-369, p. 367</span></figcaption>

</figure><figure class="quote" id="q-a63c435ec8" data-kw="">
<blockquote><p>We, indeed, allow that good works are required for righteousness; we only take away from them the power of conferring righteousness, because they cannot stand before the tribunal of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Catholic Epistles</cite>, James 2:25</span></figcaption>

<div class="actions"><button class="copy" data-copy="“We, indeed, allow that good works are required for righteousness; we only take away from them the power of conferring righteousness, because they cannot stand before the tribunal of God.”

— John Calvin, Commentaries on the Catholic Epistles, James 2:25">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe%2C%20indeed%2C%20allow%20that%20good%20works%20are%20required%20for%20righteousness%3B%20we%20only%20take%20away%20from%20them%20the%20power%20of%20conferring%20righteousness%2C%20because%20they%20cannot%20stand%20before%20the%20tribunal%20of%20God.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentaries%20on%20the%20Catholic%20Epistles%2C%20James%202%3A25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa63c435ec8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a63c435ec8.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom45" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-ac017145c5" data-kw="">
<blockquote><p>What is to be observed in the sayings of the Scriptures wherein justification, salvation and life eternal is ascribed to works?

1. Legal sentences are to be understood of perfect good works, such as none can be found in no creature; But evangelical sentences do always include faith in our works. And we must understand that by faith in the first place, justification is received, and acceptation to life eternal: afterward in the second place and by consequence, works are accepted as the fruits of faith, and life eternal is promised to these for Christ’s sake.

2. In such sayings, there are not brought forth arguments from the cause [as to] why the person is made partaker of eternal life, but it is showed from the effects or the adjuncts what person is partaker of remission of sins and life eternal (so Lk. 7:47). Christ plainly proves in way of resolution by this argument that the woman’s sins were pardoned because she loved much. But two diverse questions are at no hand to be confounded. The one to whom life eternal is given, the other for what cause it is given. To them that do well and meditate in the law of God, is happiness and life eternal promised, but yet it is given freely for Christ’s sake.

3. In this question we must remember to observe a rule of the Rabbins concerning the Holy Scriptures. In every place wherein thou lightest on an objection for an heretics, thou findest a medicine in the side thereof. So the scripture, wheresoever it ascribes eternal life to works as a reward, calls it an inheritance.

4. When as diverse effects do depend alike of one and the self same cause, the consequence from one effect avails to another because of their common dependence, as Lk. 7:47, the consequence from love avails (to prove) the remission of sins: because each of them depends on faith.

5. Where there is a subject there is his propriety, and on the contrary where there is a propriety there is his subject. So where there is faith there be works, and where there be good works there is faith.

6. Seeing good works do spring from faith, whatsoever is attributed to them, must needs be ascribed to the root (i.e. faith, whence they spring).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (London, 1606), ch. 32, ‘Of Good Works’, p. 376-77</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-b696011b19" data-kw="">
<blockquote><p>Secondly, as necessary fruits of our election, for we are elected to that end that we should be holy, Eph. 1:4, as necessary fruits of faith, without which it is judged to be dead, James 2:26, as unseparable consequents of our redemption and justification, Luk. 1:74. And as they are necessary consequents of our justification, so they are necessary forerunners of salvation, by which we are fitted for God’s Kingdom, because no unclean thing can enter into the Kingdom of heaven, Apoc. 21:27, and finally so necessary is a godly life that without it no man shall see God, Heb. 12:14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification</cite>, (London, 1633), Book 7, ‘Concerning Good Works’, ch. 1, Answer IX, p. 438</span></figcaption>

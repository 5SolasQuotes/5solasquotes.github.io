<main class="wrap"><figure class="quote" id="q-b47d2af4ff" data-kw="">
<blockquote><p>At least let him who thinks it advantageous and allowable to kill himself kill his neighbour also, since the Scripture says: ‘Thou shalt love thy neighbour as thyself.’ But when no laws or lawful authorities give command, it is not lawful to kill another, even if he wishes and asks for it and has no longer the strength to live, as is clearly proved by the Scripture in the Book of Kings, where King David ordered the slayer of King Saul to be put to death, although he said that he had been importuned by the wounded and half-dead king to kill him with one blow and to free his soul struggling with the fetters of the body and longing to be released from those torments. Therefore, since everyone who kills a man without any authorization of lawful power is a murderer, anyone who kills himself will not be a murderer if he is not a man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Dulcitius, 420 (no. 204) in Saint Augustine Letters: Volume V, trans. Wilfred Parsons, The Fathers of the Church: A New Translation, vol. 32 (Washington D.C.: The Catholic University of America Press, 1956), p. 6.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“At least let him who thinks it advantageous and allowable to kill himself kill his neighbour also, since the Scripture says: ‘Thou shalt love thy neighbour as thyself.’ But when no laws or lawful authorities give command, it is not lawful to kill another, even if he wishes and asks for it and has no longer the strength to live, as is clearly proved by the Scripture in the Book of Kings, where King David ordered the slayer of King Saul to be put to death, although he said that he had been importuned by the wounded and half-dead king to kill him with one blow and to free his soul struggling with the fetters of the body and longing to be released from those torments. Therefore, since everyone who kills a man without any authorization of lawful power is a murderer, anyone who kills himself will not be a murderer if he is not a man.”

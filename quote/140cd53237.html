<main class="wrap"><figure class="quote" id="q-140cd53237" data-kw="">
<blockquote><p>A certain levity lies at the heart of “the Keswick Movement”; its zeal is to assure ourselves that we are actually and fully saved, rather than to give ourselves to the repentance which is due to our sins, to the working out of salvation with fear and trembling, to heavenly mindedness, and a life of prayer and a walk in love.

It imagines that there can be faith without repentance and conquest of sin without moral struggle. The law, sin itself as evil desire in the regenerate, the determined fulfilment of the will of God in vital endeavour, are pushed into the background. It seeks, in a word, peace instead of righteousness, and the trail of a spiritual euthymia lies over it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Die Heiligungsbewegun in Bibliotheca Sacra</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion.html">Repentance and Conversion</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f72063ba88" data-kw="">
<blockquote><p>The Prophets in the old Testament exhorting the rebellious Jews unto Repentance, use commonly an Hebrew verb which signifieth turn ye, or return ye &amp; come back again, by the which Metaphor is meant, that like as a man that is strayed far out of his way, must turn quite back again the contrary way: So those that have strayed from the ways of Godliness, to the way of sin, must come back again, as fast as ever they went forward, &amp; altogether change the course of their life: so that Repentance is an earnest turning unto God with all our heart, soul, and mind.

Saint John Baptist, and the Apostles in the New Testament exhorting unto Repentance, use a Greek word which signifieth a changing of the mind afterward, or afterwit, so that those which through their folly &amp; want of former wit, have slipped into the deep pit, and dangerous gulf of sin, when they come to themselves, &amp; have recovered their wits, will be wise afterward, &amp; take heed they never come there again according to the Proverb: The burnt child will take heed of the Fire.

By this time I hope you see what is repentance. It is not every sorrow, but sorrow for sin, not for some sin, but for all sin, not for an hour, but for ever, not for a day, but continually, not for a week, but as long as we live. Some think every sorrow is repentance: but so should worldlings repent. Some think every little pant for sin is repentance: so should Pharaoh repent. Some think all weeping and lamenting for sin is repentance: so should Esau, Judas &amp; Cain, repent. Some think every little humbling of our selves is repentance: but so should Ahab repent. Some think that good words, and good purposes is Repentance: but so should every sick man repent. Some think the reformation of words and deeds, is Repentance: but so should civil men repent. Some think that cry God mercy is repentance: and so should every fool repent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-dent.html">Arthur Dent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon of repentance. A very godly and profitable Sermon, preached at Lee in Essex, by Arthur Dent, Minister of God’s word. And published at the request of sundry Godly and well disposed persons. 1581. the 7. of March</cite>, (London: John Harison, 1582), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-0c28f715af" data-kw="">
<blockquote><p>We deny that regenerating grace is infused into slothful men, but into souls subdued by God’s Word and law, and after a manner disposed by the foregoing actions; yet we say that even these forgoing actions have their first motions from God; and the question is whether God does not first work a sight and sense of sin and an humiliation for it by his exciting grace, before He comes with his regenerating, quickening and saving grace into the soul; we say He does in his ordinary course of his dispensations. (Only I must here be safely understood that I speak according to man’s apprehension; for in respect of God, nothing is first or last; He works all in an instant, all graces together in the soul; but the question lies not whether God works the habit of repentance before the habit of faith, or no; for without question He works together all his works; but whether God makes humiliation act before faith, which we say he does. Esau and Jacob may be in their mother’s womb together, but Esau may come out and be seen in the world before Jacob: yet not tying up the Almighty to this method, who can and will work any way, even which way it pleases Him:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved</cite>, … (London: 1646), pp. 25-26</span></figcaption>

<blockquote><p>2nd Problem: Whether faith precedes regeneration, at least repentance? Response: The former is denied; the latter is affirmed concerning faith in the first act, which in the order of nature precedes repentance considered both in the first act and in the second act. But it is denied concerning faith in the second act, at least the complete or formed second act. For such faith is necessarily preceded in the order of nature and of time by certain acts of repentance. This distinction observed will contribute not a little to reconciling the dogmatic and practical theologians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

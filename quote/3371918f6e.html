<main class="wrap"><figure class="quote" id="q-3371918f6e" data-kw="">
<blockquote><p>The next thing in order is the soldier’s spear. This ought to be one only, but perhaps, from having felt the fire of some alchymist, it has increased and multiplied. For four have come to light, besides those which exist in different places, of which I have not the names. There is one at Rome, another in the Holy Chapel at Paris, a third at Saintonge in the monastery of Ciseaux, a fourth at Selve, near Bourdeaux. Which of these, then, is to be selected as the true one? The easier course will be to turn them all adrift, and leave them as they are. But granting that there is one, I would fain know where it was found. As no ancient histories, or other writings, mention it, it must be of modern manufacture. In regard to the crown of thorns, it would seem that its twigs had been planted that they might grow again. Otherwise I know not how it could have attained to such a size. First, a third part of it is at Paris, in the Holy Chapel, and then at Rome there are three thorns in Santa Croce, and some portion also in St Eustathius. At Sienna, I know not how many thorns, at Vincennes one, at Bourges five, at Besançon, in the church of St John, three, and as many at Köningsberg. At the church of St Salvator, in Spain, are several, but how many I know not; at Compostella, in the church of St Jago, two; in Vivarais, three; also at Toulouse, Mascon, Charrox in Poictou, St Clair, Sanflor, San Maximin Provence, in the monastery of Selles, and also in the church of St Martin at Noyon, each place having a single thorn. But if diligent search were made, the number might be increased fourfold. It is most evident that there must here be falsehood and imposition. How will the truth be ascertained? It ought, moreover, to be observed, that in the ancient Church it was never known what had become of that crown. Hence it is easy to conclude, that the first twig of that now shown grew many years after our Saviour’s death. Next comes the purple robe in which Pilate clothed Christ in derision, because he had called himself a king. It was a costly robe not to be carelessly cast away. Nor is it to be supposed, that, after the mockery of Christ was over, Pilate or his servants did cast it away. I should like to know who the merchant was that purchased it from Pilate to preserve it for relics. To give some colour to their fiction, they show some drops of blood upon it, as if, forsooth, the villains who put it on the shoulders of Christ in mockery had afterwards chosen to destroy it. I know not whether any thing under the same name is found elsewhere. The coat, woven from the top to the bottom, and without seam, as it seemed better adapted to stimulate the piety of the unlearned, has produced a considerable number of others. For one is exhibited at Argenteuil, a village in the suburbs of Paris, and another at Treves. But if the Bull which is in the church of St Salvator in Spain says true, Christians have, from inconsiderate zeal, sinned more heinously than those wicked soldiers who did not dare to divide it. Christians have not feared to tear it in pieces, for purposes of adoration. But what will the Turk say, who, while he derides the madness, declares that it is with him? It is unnecessary, however, to go to law with the Turks about it, as they will have enough to do in settling the quarrel among themselves. Meanwhile, we have a good excuse for not giving credit to any of them; for we must not favour either party before hearing the cause. This were a violation of equity. Nay, if they wish to be believed, they must first reconcile themselves with the Evangelists. The matter stands thus—The garment for which lots were cast was the tunic, which the Greeks call χιτων. I would have men carefully consider the form of the one which is at Strasburgh or at Treves. They will find that the one at Strasburgh resembles the robe used at mass, and to which they give the name of chasuble. And, therefore, though they were to put out men’s eyes, the imposture might still be detected, being such as may be felt by the hand. To conclude this article, I wish to propose a simple question. Scripture declares that the soldiers parted our Saviour’s vesture among them; and it is most certain that they did so for their own private advantage. Will they now then tell me what Christian it was who bought of the soldiers the tunic and other vestments, which are exhibited, for instance, at Rome, in the church of St Eustathius, and in other places? How came the Evangelists to forget the circumstance? For it was absurd to tell us that the soldiers parted the vesture among them, without also telling who it was that redeemed it out of the hands of the soldiers, in order that it might be preserved for relics. Moreover, how came the ancient writers to be so unkind as never to say one word on the subject? In solving these questions, they had better choose a day when men are devoid of sense, intelligence, and judgment. But they have not stopped here. In addition to the robe, they have thought proper also to have the dice employed in casting the lots. One of these is at Treves, another at St Salvator’s in Spain. In this they have characteristically displayed their childishness. The lots to which the Evangelists refer were those which were usually taken out of a hat or urn, as in the present day when a king is elected by ballot, or in the common game called Biancha. In short, everybody knows how lots are cast when lands or heritages are divided. But those asses have imagined that the lot was like our one for playing at dice, though that thing was not then in existence, at least in the shape in which we now have it. For, in place of the dots which are upon our dice, they had certain figures, such as Venus, or a dog, which they designated by their proper names. Let them now go and kiss their relics, on the testimony of men, thus stupid, and thus absurd in their lies. We must now consider the napkin, as to which they have still more openly betrayed their impudence and stupidity. For, besides the napkin of Veronica, which is exhibited at St Peter’s, and the robe which the Virgin Mary is said to have wrapped round our Saviour, and which is shown in the church of Joannes Lateranensis, and also in the Augustin monastery at Carcassone, they have also the napkin which our Saviour’s head was wrapped in the sepulchre. This is exhibited at the same place. There are, at least, six cities more which boast of having this very napkin, as the one at Nice, which was brought from Cambray, also those at Acqs in Germany, at Maestricht, at Besançon, and also at Vindon in Limoges, also in a certain town in Lorraine, on the borders of Alsace; besides portions of it which are scattered up and down in different places, as at St Salvator’s in Spain, and in a monastery of Augustins in the Vivarais. I say nothing of that complete napkin, which exists in a certain nunnery at Rome, as the Pope has expressly prohibited the exhibition of it. Must not men, I ask, have been exceedingly infatuated, to travel so far, at great expense, and with greater trouble, to see a bit of cloth, as to which not the least certainty could be had, or rather as to which they must, of necessity, have had their doubts? For whosoever believes that this napkin exists in one particular place, brings a charge of falsehood against all the others which boast that they possess it. For instance, he who believes that the piece of cloth which was at Cambray is the genuine napkin, condemns those of Besançon, of Acqs, of Vindon, of Maestricht, and of Rome, as guilty of falsehood and of wickedness, inasmuch as they stimulate the people to idolatry, and impose upon them, by making them believe that a bit of common cloth is the linen which wrapped our Saviour’s body in the tomb. Let us now attend to the testimony which the Gospel gives on the subject; for it were little that they merely convicted each other of falsehood, if the Holy Spirit did not oppose them, and openly condemn all of them to a man, First, it is very strange that the Evangelists make no mention of Veronica, who is said to have wiped our Saviour’s face with a napkin, though they speak of all the women who accompanied our Saviour to the cross. The circumstance would have been remarkable, and well worthy of a place in their narrative, had our Saviour’s face been miraculously imprinted on a napkin. On the other hand, it does not seem a matter of much importance that some women accompanied our Saviour to the cross, if nothing miraculous, in regard to them, was performed. How comes it that the Evangelists relate things of little or of no great importance, and are silent as to the most important of all? For, had such a miracle been performed as is commonly pretended, the Holy Spirit is chargeable either with forget-fulness or thoughtlessness, in having failed to select the matters which it was of most importance to relate. So much for their Veronica, as to whom all men may see how manifestly false every thing is which they would fain have generally believed.</p></blockquote>

erybody+knows+how+lots+are+cast+when+lands+or+heritages+are+divided.+But+those+asses+have+imagined+that+the+lot+was+like+our+one+for+playing+at+dice%2C+though+that+thing+was+not+then+in+existence%2C+at+least+in+the+shape+in+which+we+now+have+it.+For%2C+in+place+of+the+dots+which+are+upon+our+dice%2C+they+had+certain+figures%2C+such+as+Venus%2C+or+a+dog%2C+which+they+designated+by+their+proper+names.+Let+them+now+go+and+kiss+their+relics%2C+on+the+testimony+of+men%2C+thus+stupid%2C+and+thus+absurd+in+their+lies.+We+must+now+consider+the+napkin%2C+as+to+which+they+have+still+more+openly+betrayed+their+impudence+and+stupidity.+For%2C+besides+the+napkin+of+Veronica%2C+which+is+exhibited+at+St+Peter%E2%80%99s%2C+and+the+robe+which+the+Virgin+Mary+is+said+to+have+wrapped+round+our+Saviour%2C+and+which+is+shown+in+the+church+of+Joannes+Lateranensis%2C+and+also+in+the+Augustin+monastery+at+Carcassone%2C+they+have+also+the+napkin+which+our+Saviour%E2%80%99s+head+was+wrapped+in+the+sepulchre.+This+is+exhibited+at+the+same+place.+There+are%2C+at+least%2C+six+cities+more+which+boast+of+having+this+very+napkin%2C+as+the+one+at+Nice%2C+which+was+brought+from+Cambray%2C+also+those+at+Acqs+in+Germany%2C+at+Maestricht%2C+at+Besan%C3%A7on%2C+and+also+at+Vindon+in+Limoges%2C+also+in+a+certain+town+in+Lorraine%2C+on+the+borders+of+Alsace%3B+besides+portions+of+it+which+are+scattered+up+and+down+in+different+places%2C+as+at+St+Salvator%E2%80%99s+in+Spain%2C+and+in+a+monastery+of+Augustins+in+the+Vivarais.+I+say+nothing+of+that+complete+napkin%2C+which+exists+in+a+certain+nunnery+at+Rome%2C+as+the+Pope+has+expressly+prohibited+the+exhibition+of+it.+Must+not+men%2C+I+ask%2C+have+been+exceedingly+infatuated%2C+to+travel+so+far%2C+at+great+expense%2C+and+with+greater+trouble%2C+to+see+a+bit+of+cloth%2C+as+to+which+not+the+least+certainty+could+be+had%2C+or+rather+as+to+which+they+must%2C+of+necessity%2C+have+had+their+doubts%3F+For+whosoever+believes+that+this+napkin+exists+in+one+particular+place%2C+brings+a+charge+of+falsehood+against+all+the+others+which+boast+that+they+possess+it.+For+instance%2C+he+who+believes+that+the+piece+of+cloth+which+was+at+Cambray+is+the+genuine+napkin%2C+condemns+those+of+Besan%C3%A7on%2C+of+Acqs%2C+of+Vindon%2C+of+Maestricht%2C+and+of+Rome%2C+as+guilty+of+falsehood+and+of+wickedness%2C+inasmuch+as+they+stimulate+the+people+to+idolatry%2C+and+impose+upon+them%2C+by+making+them+believe+that+a+bit+of+common+cloth+is+the+linen+which+wrapped+our+Saviour%E2%80%99s+body+in+the+tomb.+Let+us+now+attend+to+the+testimony+which+the+Gospel+gives+on+the+subject%3B+for+it+were+little+that+they+merely+convicted+each+other+of+falsehood%2C+if+the+Holy+Spirit+did+not+oppose+them%2C+and+openly+condemn+all+of+them+to+a+man%2C+First%2C+it+is+very+strange+that+the+Evangelists+make+no+mention+of+Veronica%2C+who+is+said+to+have+wiped+our+Saviour%E2%80%99s+face+with+a+napkin%2C+though+they+speak+of+all+the+women+who+accompanied+our+Saviour+to+the+cross.+The+circumstance+would+have+been+remarkable%2C+and+well+worthy+of+a+place+in+their+narrative%2C+had+our+Saviour%E2%80%99s+face+been+miraculously+imprinted+on+a+napkin.+On+the+other+hand%2C+it+does+not+seem+a+matter+of+much+importance+that+some+women+accompanied+our+Saviour+to+the+cross%2C+if+nothing+miraculous%2C+in+regard+to+them%2C+was+performed.+How+comes+it+that+the+Evangelists+relate+things+of+little+or+of+no+great+importance%2C+and+are+silent+as+to+the+most+important+of+all%3F+For%2C+had+such+a+miracle+been+performed+as+is+commonly+pretended%2C+the+Holy+Spirit+is+chargeable+either+with+forget-fulness+or+thoughtlessness%2C+in+having+failed+to+select+the+matters+which+it+was+of+most+importance+to+relate.+So+much+for+their+Veronica%2C+as+to+whom+all+men+may+see+how+manifestly+false+every+thing+is+which+they+would+fain+have+generally+believed.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+%E2%80%9CAn+Admonition+Showing+the+Advantages+Which+Christendom+Might+Derive+From+an+Inventory+of+Relics%E2%80%9D+in+Tracts+Relating+to+the+Reformation%2C+Vol.+1+%7C+Edinburgh%3A+Calvin+Translation+Society%2C+1844%2C+pp.+304%E2%80%9308&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3371918f6e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3371918f6e.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/05/calvin-time-for-an-inventory-6/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Are the wicked intermixed with true and zealous professors? What shall we then say to the old Donatists (Socrates, Ecclesiastical History, bk. 1, ch. 7), and the Brownists, and Anabaptists, which separate themselves from the true Church, say with those in the prophet, ‘Come not near us for we are holier then ye.’ Me thinks I may say unto them as Constantine said to Acesius, a Novatian Bishop: Let them make a ladder for themselves to ascend into heaven, here is no place for them on earth, as long as this world shall last, the Lord’s wheat shall grow up with the tares.(Mt. 13:29) Christ has spoken it, and Christ is truth, ‘if there be in them any charity, they will assent to this verity’ (Sit in illis charitas et congaudeant veritate, Augustine, Cor. 2:6). ‘Yea but light has no communion with darkness, nor bitterness with honey, nor life with death, nor the unbeliever with the infidel.’ It is the objection of Petilian the Donatist against Augustine. But his answer is that when they eschew the darkness, they forsake the light: when they flee from death they flee from life also: Attendis Zizania per mundum, &amp; triticum non attendis, cum per totum vtraque sint iussa crescere? attendis semen maligni, quod ad finem messis separabitur; et non attendis semen Abrahae, in quo benedicentur omnes gentes? Dost thou mark the darnel, and dost thou not remember the wheat? Dost thou think upon the seed of the serpent, whose head shall be crushed; and dost thou not think upon the seed of Abraham, in whom all the nations of the earth shall be blessed? When thou fleest from the chaff, thou forsakest the good wheat, which is mingled with it. When thou separatest thyself from the seed of the wicked, thou seperatest thyself from the seed of Abraham. When thou thus dividest thyself from the hypocrites that are in the true Church, thou cuttest thyself from the Church, and a member taken from the whole must needs perish. If thou wilt think upon this with that heedfulness that thou shouldst, thou wilt not forsake the green pastures of the Lord that are besides the waters of comfort (Ps. 23) because of the goats; nor leave God’s house because of the vessels of dishonor; nor run out of the Lord’s floor, because of the chaff; nor separate thyself from the wheat because of the tares, which shall at length be bound in a bundle and cast into the fire; nor burst the unity of the Lord’s net because of the bad fish, which swim in it, (which, when the net is brought to land, shall be cast away), but as a father speaks: tolerare potiùs propter bonos cōmixtionem malorum, quam violare propter malos charitatem bonorum; rather for the good to tolerate the bad than for the bad to forsake the good. (Augustine, bk. 3, Contra litt. Petit., ch. 3)</p></blockquote>

<blockquote><p>17. The Sieur Codure, formerly pastor and professor of divinity in the Church and University of Nismes, having sent letters with a diatribe of his, dedicated unto this Assembly, in which he pretends to reconcile the differences between the Protestants and the Church of Rome concerning Justification, and demanded audience of it: According to his request, he was admitted to propound the reasons and motives of his design. Which having done, there was a most serious remonstrance made him of the great wrong he had done; First, unto the truth of God, in taking upon him to reconcile contradictory opinions, and utterly inconsistent one with the other. And then secondly, how injurious he was unto the Protestants, in oppugning as erroneous their common Confession, that so to their prejudice he might advantage the Romish Church, which does notoriously confound two of the greatest blessings of God, and inseparable one from the other, though yet always distinct in themselves; to wit, the sinner’s absolution before the tribunal of God, upon the account of the merits of Christ Jesus, his obedience imputed to him, and regeneration wrought in the heart of man, by the sanctifying operation of the Holy Ghost. And lastly, how much an enemy he was unto himself, in forsaking his ministry, and the cure of souls, to become an advocate of such a vile and ungodly cause as is this of the Papacy, which is altogether unreasonable in him, for that he undertakes things impossible. But he still protesting that he never intended to, and never would depart from the Orthodox Creed professed in our Churches, and offered to purge and acquit himself from all suspicions that might be had of him by his voluntary subscribing the principal articles of the doctrine of truth, from which he was supposed to have swerved and declined: They were thereupon offered to him; which when he had as freely and in general signed and subscribed, as he had offered to do it, yet it being done with hesitation for some time, and this also attended with ambiguous expressions, the Assembly was constrained to doubt of his sincerity; and it was the rather feared, for that after the subscription required, he resolutely refused to follow his vocation, and the counsel of his brethren, discovering an unworthy disdain and scorn of that holy and honorable employment in the ministry of the Gospel, whereunto in his younger days he was called by God. All which considered, the synod interdicted him all the offices of the sacred ministry, and of the profession of theology, and enjoined both the province, and that particular church where he constantly resides, to watch over his deportments, and to give an accompt of him and his conversation unto the next national synod, which may, according to what testimonials they shall receive of him, and his future carriage, proceed unto his restoration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Gallia Reformata (John Quick, London, 1692)</cite>, ed. John Quick, Synodicon (London, 1692), 3rd National Synod of Charenton, ch. 11, p. 460</span></figcaption>

v>
</figure><figure class="quote" id="q-5e87bb7bf1" data-kw="Supreme judge">
<blockquote><p>The supreme judge of controversies and legitimate interpreter of scripture should have these three properties: the first is, that we should certainly know that the sentence which he delivers is true, and that we can acquiesce in it; the second, that no appeal from that sentence shall be lawful; the third, that he be influenced by no partiality. Now the church or the pope possess none of these; whereas the scripture, and the Holy Spirit speaking in the scripture, have them all. Therefore the supreme decision is to be given to them, and not to the church or the pope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Question 5, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-677425ee04" data-kw="">
<blockquote><p>Externally this covenant is made with every member of the Church, even with the parents and their children, so many as hear and embrace the promises of salvation, and give and dedicate their children unto God according to his direction; for the sacraments—what are they but seals of the covenant? But savingly, effectually, and in a special manner it is made only with them who are partakers of the benefits promised. And as the covenant is made outwardly or effectually, so some are the people of God externally, others internally and in truth. For they are the people of God with whom God has contracted a covenant, and who in like manner have sworn to the words of the covenant, God stipulating and the people receiving the condition; which is done two ways: [1] for either the covenant is made extrinsically, God by some sensible token gathering the people, and the people embracing the condition in the same manner, and so an external consociation of God and the people is made; [2] or the covenant is entered after an invisible manner, by the intervention of the Spirit, and that with so great efficacy that the condition of the covenant is received after an invisible manner, and so an internal consociation of God and the people is made up.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’, p. 24</span></figcaption>

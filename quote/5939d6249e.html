<main class="wrap"><figure class="quote" id="q-5939d6249e" data-kw="">
<blockquote><p>This [lack of spiritual comfort] may arise from the prevalence of a natural melancholy [depression] in the body, whereby the understanding may be darkened, the fancy troubled, reason perverted, and the soul saddened. Melancholy is the mother of discomfort and the nurse of doubting. It was (as some think) depth of melancholy that prevailed upon Nebuchadnezzar, so that he did not know, he was a man or a beast. And in the like manner this bodily melancholy may so far distemper your soul that you who have grace yet may not know whether you are a child of God or a child of the devil. It is not more wonder to see a melancholy man doubt and question his spiritual condition than it is to see a child cry when beaten or to hear a sick man groan.

You may silence a melancholy man when you are not able to comfort him; and though you may resolve his doubts and scruples by evident and convincing answers and arguments, yet let such a man retire alone and brood over his melancholy thoughts, and by the prevalence of this perturbing humour all is forgotten, and he is as unsatisfied as if you had said nothing to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace: The Truth, Growth, and Different Degrees</cite>, ed. Don Kistler (Morgan PA: Soli Deo Gloria, 1997), pp 114-15.</span></figcaption>

</figure><figure class="quote" id="q-60c44cda4b" data-kw="">
<blockquote><p>3. The Holy Spirit specially seals each particular believer, and makes him sure of his adoption, by a certain wonderful and secret testimony: for he is given to every believer as a pledge of divine love; and he, finally, pronounces in the hearts of the godly, that they are in favour with God: which testimony they both may and ought to believe. Therefore they do believe in particular that they are in the grace of God, and that their sins are remitted them.

The authorities from which all this is proved are well known: Rom. viii. 16, The Spirit beareth witness with our spirits that we are the children of God; Gal. iv. 6, Because ye are sons, God hath sent forth the Spirit of his Sort into your hearts, crying, Abba, Father; and Ephes. i. 13, 14, Ye were sealed with that Holy Spirit, after that ye believed, which is the earnest of your inheritance. Nor is this testimony fallacious or conjectural, but certain and infallible in all in whom it is found.

For the word is the ministration of the Spirit, 2 Cor. iii.; and faith conceived by the ministration of the word, is always joined with the witness of the Spirit itself. Therefore the impression of faith by the Holy Spirit, in the heart of a particular man, is, as it were, a particular testimony that he is in grace, and that he is a child of God. So Bernard, Serm. 5, De dedicat. ecclesise. Who can tell whether he is worthy of love or hatred? Who hath known the mind of the Lord? Here it is necessary that faith should come to our aid; that what is concealed concerning us in the heart of the Father, may be revealed to us by his Spirit; and his Spirit bearing witness may persuade our spirits that we are the children of God. But he persuades by calling and justifying us freely through faith.

[Cardinal Robert] Bellarmin[e] replies, that the Holy Spirit witnesses to our spirits only by some experience of an internal suavity and peace which produces nothing better than a conjectural certainty. De justif. lib. iii. cap. 9.

But Bernard rejects this Jesuitical comment: for he says this testimony is received by the act of faith; and that the Holy Spirit persuades our spirit that we are the children of God, by faith, not by fallible conjectures. So Chrysostom in viii. ad Rom. When the Spirit testifies can any doubt remain?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), i, 39-40.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy.html">Assurance, Peace and Joy</a></span></div>

</figure><figure class="quote" id="q-4d45975794" data-kw="">
<blockquote><p>The seducers that had infiltrated the Galatians and corrupted the purity of the gospel…Paul stops here, and says that if we are being forced and obliged to perform this task for God and to enter into this covenant with him, Jesus Christ will not profit us. …Why? Because they look no further than the external act…making us think that we are obliged to do it to be acceptable to God; we have entered into a covenant with him based upon doing our duty. Whoever has fulfilled his duty has made God his debtor, according to the devilish doctrines…We can only obtain grace by our merits, and the memory of our sins and iniquities can be wiped out by making our own satisfaction for sin and thereby appeasing God’s wrath. We see, therefore, that if we can obtain our own pardon, Jesus Christ is made of no value and cannot profit us at all. Why? Because Jesus Christ is not our righteousness if we do not seek remission of our sins through the sacrifice of his death. We need to be sure that God is our Father, and that we can call upon him with a peaceful conscience, having been adopted through the Lord Jesus Christ. …We need the assurance that he accepts us as his children and supports us so compassionately that he approves of what we do, though it is worthless, because of the fatherly love he bears us. If we do not have this assurance, the thought of serving God will make us grind our teeth. If, however, we are persuaded that God looks upon us favourably; if, though we are weak and can do nothing worthy of his approval, he accepts us in the name of the Lord Jesus Christ, then we will surely be filled with courage. We will be like a ship’s sail that has been stretched and filled by the breeze! Thus, our hearts will run to obey him, like a ship driven along by its sail, when we know that God delights in us and accepts our works, not wanting us to be compelled into servitude. He is happy for us to be his children, and that we desire to obey him. Knowing this, we can serve our God with all the more zeal. With his grace as our foundation, we are so filled with his joy that we can offer the sacrifice of praise. Likewise, having sought him in prayer, we can know that he will answer us and, in return, we can thank him for the priceless gifts that he communicates to us every day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on Galatians 5:1–3</cite>, Other citations (work not named), 1557–58; HT: John Fonville)</span></figcaption>

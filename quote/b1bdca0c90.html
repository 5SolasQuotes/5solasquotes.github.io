<main class="wrap"><figure class="quote" id="q-b1bdca0c90" data-kw="">
<blockquote><p>It is not denied that the people, learned and unlearned, in order to the proper understanding of the Scriptures, should not only compare Scripture with Scripture, and avail themselves of all the means in their power to aid them in their search after the truth, but they should also pay the greatest deference to the faith of the Church. … What Protestants deny on this subject is, that Christ has appointed any officer, or class of officers, in his Church to whose interpretation of the Scriptures the people are bound to submit as of final authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

<blockquote><p>The supreme judge, by which all controversies of religion are to be determined, and all decrees of councils, opinions of ancient writers, doctrines of men, and private spirits, are to be examined, and in whose sentence we are to rest, can be no other but the Holy Scripture delivered by the Spirit, into which Scripture so delivered, our faith is finally resolved.</p></blockquote>

</figure><figure class="quote" id="q-64ef925976" data-kw="infallibility of the church">
<blockquote><p>Man cannot be the infallible interpreter of the Scriptures and judge of controversies because he is liable to error. Our faith cannot be placed in him, but upon God alone from whom depends the sense and meaning of the Scriptures and who is the best interpreter of his own words. … If the rulers of the church are influenced by the Holy Spirit, they do not cease to be men and therefore fallible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 1, Second Topic, Q. 20, §XI</span></figcaption>

</figure><figure class="quote" id="q-721cb5dffe" data-kw="">
<blockquote><p>We believe that Holy Scripture has one true and authentic meaning, but this meaning can be twofold, either simple or composite. … That there is a single meaning to Scripture is evident (1) from the unity of truth, because truth is single (unicus) and simple (simplex), and for that reason does not admit of several meanings, which would make it uncertain and ambiguous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.19.2</span></figcaption>

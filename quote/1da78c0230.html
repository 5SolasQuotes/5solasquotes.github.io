<blockquote><p>Burmann (V, viii, 24): ‘With this is also connected the grace by which Christ could never sin, since in such great light of knowledge and perfect love of will and holy motions it was quite impossible for him to fall away.’ Maresius (XI, 20): ‘Christ could never sin.’ (21): ‘Nor did Christ’s impeccability stand in the way of his free judgment, since freedom of judgment does not necessarily involve the faculty of sinning, i.e., of falling short of perfection.&#x27;</p></blockquote>

<blockquote><p>Position 6. Grace is not educed or extracted out of the potency of any created nature. Grace is born in heaven and came from the inmost of the heart of Christ; it has neither seed nor parent on earth; therefore the Lord challenges it as his own, 2 Cor. 12.9, ‘The Lord said unto me, My grace is sufficient for thee.’ 2 Tim. 2:1, ‘The grace that is in Christ Jesus.’ 1 Cor. 15:10, ‘The grace of God.’ 2 Cor. 13:14, ‘The grace of the Lord Jesus Christ.’ Gal. 1:15, ‘He called me by his grace.’ If we could engage the grace of God, or prevent it [come before it], then should grace be our birth; but grace is not essential to angels. It’s a doubt if any creature can be capable by nature of any possibility-natural not to sin; it is much to know the just owner of grace who begot it? It came out of the eternal womb and bowels of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, p. 239</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-a931e0e622" data-kw="">
<blockquote><p>Controversy 3 – Would Jesus Christ have been made man and come into the world if men had not sinned? We deny against the Socinians and Scholastics. Arguments: 1. He was only promised after the fall (Gen. 3:15), and He could not have been born of a virgin except in virtue of the promise. 2. Those who are well have no need of a physician (Mt. 9:13). He only came to save sinners (2 Tim. 1:15). 3. He has been sent on the basis of the love of God toward fallen man (Jn. 3:16), which could not exist in that case. [That is, He would not have had compassion on fallen man, if man had not fallen. This compassion and love for fallen man is given as the reason for the Father sending the Son.] 4. It would not have been necessary for God to be man; therefore, He would have come in vain. 5. Nor would humanity have had any obligation (obligatio) to Him as incarnate. Objections: 1. Christ is the firstborn of all creatures (Col. 1:15). Reply. ‘Firstborn’ means generated from eternity before all creatures. 2. In all things, He is preeminent (primus) (v. 19). Reply. In dignity and position. 3. All things have been created in Him (meaning “on account of Him”). Reply. All things have been created on account of Him as God not as man. 4. Then we have not been made on account of Christ, but He was made on account of us. Reply. Yes, as man. Objection. Then we should be given thanks since it is on account of us. Reply. That’s ridiculous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’</cite>, pp. 112-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-be53d476ea" data-kw="">
<blockquote><p>The personal union of the two natures in Christ is the substantial copulation of them by which the specificness of the assumed human nature does not have subsistence in itself [but] the substance of the Logos has been communicated, so that the two natures in Christ may be one person. The essential form of the personal union in Christ, in which that subsists, is not the communication of the attributes of deity, but the communication of the subsistence of the Word with the assumed human nature.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-62955810eb" data-kw="">
<blockquote><p>Why is the Son so called? Answer. Because He was begotten of the Father by a perfect and eternal generation, not to be uttered of man or conceived. And we must be warned not to conceive it in any carnal or human manner. For an earthly father is in time before his son, and the son after. But God the Father and the Son are coeternal, and not one before or after the other for time. An earthly father is forth of [i.e., separate from] the son, and the son forth of the father. But God the Father is in the Son, and the Son in the Father. An earthly child is from his father by propagation, but the Son is from the heavenly Father not by propagation, but by communication of substance. Lastly, the heavenly Father begets the Son by communication of His whole substance, and so does no earthly father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 246.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-2dd84b7c30" data-kw="">
<blockquote><p>XX… For the Father is called God [in Col. 1:2] by way of distinction, not in an absolute sense, but in terms of order, because He is the first person of the Godhead who begot the Son from Himself, as the source and principle of the Deity. This is known as the simple essence of the divine unity, which cannot be conceived unless it begins from the Father. The mention of ‘our Lord Jesus Christ’ is expressly added to the Father, both for the purpose of distinction because He is the Mediator, and to refute the Arians, both the ancient and recent ones, who wrongly deduce from this passage of Paul that the name of God belongs exclusively and properly to the Father alone. It is certain that it is used relatively here because the mention of our Lord Jesus Christ is explicitly joined to the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1</cite>, (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>

</figure><figure class="quote" id="q-a6a6dcb745" data-kw="begot necessarily willingly">
<blockquote><p>Arius vexed the Orthodox by asking whether the Father begot the Son by necessity or by will. To this, the response must be that the Father begot the Son not out of necessity but necessarily, for He did not beget contingently. However, whatever this necessity is, it is voluntary and natural and lacks coercion. The Father did not beget the Son by will, but He begot willingly, for He is not compelled by any external or superior cause to beget.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XXIV</span></figcaption>

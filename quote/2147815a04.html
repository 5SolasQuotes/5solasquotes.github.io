<blockquote><p>The great reason assigned by God for blessing and sanctifying the Sabbath, both in the second chapter of Genesis, and in the fourth commandment, is the fact that he rested from the work of creation. It ought to be noted that there is implied in the word rested, completion, perfection, intimating that God’s rest was not an actual idleness, a vacuity of mind or employment, but the completion of a work which in its every part was such as he designed, and would display to intelligent beings the glory of his character. At the close of this work, executed in infinite wisdom, and contemplated by Deity himself as very good, God sanctified a seventh portion of man’s time, and left him his own example to imitate. And the example of Jehovah, when set before us, as far as it is imitable, becomes authoritative law to the whole universe.

It would be singular indeed, if God’s ceasing from a work which was intended to exhibit his glorious perfections to the admiration of all intellectual beings, were a reason to be employed in securing the observance of the Sabbath among the Jewish people only. It is manifestly alike applicable to all, and strongly intimates, that the institution with which it is connected, was appointed to be equally extensive in its obligation. God rested from his work which he had created and made, blessed and hallowed the day, and commanded, not only Jews, but all people, to remember it and keep it holy.

Nor will it suffice as an answer to this argument, to say, that in Deut. “the commandment is repeated with a reference to a different event,” viz. the deliverance of the Israelites from their Egyptian bondage; and that when afterward “spoken of as peculiar to the people of Israel,” it is founded on this same universal reason. There is nothing absurd in the idea of adding to the first weighty reason, others of subordinate importance, which are forcibly applicable in the circumstances in which they are announced. Thus, while in the fourth commandment God promulges the chief reason for which he had blessed the Sabbath, in repeating it afterward, he impresses on the Jews with additional force, their obligation in reference to part of the duties of the day, by adverting to their former subjection to bondage: “Because ye have been servants in Egypt, with special reason, I command you to remember the Sabbath, that thy man-servant and thy maidservant may rest as well as thou.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-holmes-agnew.html">John Holmes Agnew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Manual on the Christian Sabbath</cite>, (Philadelphia PA: Presbyterian Board of Publication, 1852), pp 79-80.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2ec377fb86" data-kw="">
<blockquote><p>The Genevan practice of wearing black academic gowns, white preaching bands, and black caps deliberately indicated that ministers were teachers of the Word rather than sacerdotal mediators. There clothes were not considered clerical vestments but were standard attire for clergy to be worn during and outside public worship (Maetsch, Calvin’s Company of Pastors, 19; William D. Maxwell, John Knox’s Genevan Service Book, 1556 (Westminster: Faith Press, 1965), 210-213). Lavater’s Short Work on Rites and Regulations described a similar approach to clerical attire in Zurich; however, the clerical dress was more informal than Calvin’s: clergy were to ‘wear ordinary, yet respectable clothing (as other respectable citizens do), not theatrical clothing.’ John Knox held a similarly minimalist approach among the English exiles in Frankfurt, signaling his displeasure at Cranmer’s retention of the surplice. In a sermon on Noah’s drunkenness and the subject of what should or should not be covered up, he touched upon the sensitive matter of English cleric John Hooper’s refusal to wear clerical vestments (Jane Dawson, John Knox (New Haven, CT: Yale University Press, 2016), 101). Earlier in 1550, Hooper refused to be consecrated as bishop, partly on the grounds of what he perceived to be unreformed vestments (‘those Aaronic habits’). (John Hooper to Heinrich Bullinger, June 29, 1550. See Hastings Robinson, Original Letters Relative to the English Reformation, 2 vols. (Cambridge: Cambridge University Press, 1846-1847), 1:87) In reply, both Martin Bucer and Peter Martyr Vermigli refuted his position on the basis that vestments were adiaphorus [indifferent]. Vermigli made the slightly backhanded remark that ‘indifferent things cannot corrupt those that are of a pure mind and sincere conscience in their doings.’ (Correspondence between Bucer, Martyr and Hooper in George Cornelius Gorham, Gleanings of a Few Scattered Ears During the Period of the Reformation in England (London: Bell and Daldy, 1857). Bucer and Martyr’s replies to Hooper were also used by Archbishop Parker [who sought to universally enforce such clerical dress] in response to the Vestarian Controversy under Queen Elizabeth I. Quotes are in Matthew Parker, A Brief Examination for the Tyme…, (London: Richard Jugge, 1566), RSTC 10387, sig. C.2r.) Hooper–helped by a spell in prison–begrudingly took the advice on board and was consecrated Bishop of Gloucester later that year. Thus, when Knox and his colleagues left the English congregation at Frankfurt for Calvin’s Geneva, they found the clerical attire more congenial to their approach. However, when the Genevan exiles returned home after the death of Queen Mary, they had mixed success in implementing their desired clerical attire. Knox returned to Scotland where the Genevan gown became the norm, whereas Christopher Goodman and others returned to England were vestments were retained (indeed, to the 1549 standards). The controversy over vestments was reignited and contributed to the production of the Middelburg Liturgy (1586) by the English Puritans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-earngey.html">Mark Earngey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Soli Deo Gloria</cite>, (New Growth, 2017), pp. 42-43</span></figcaption>

<blockquote><p>If we ‘stretch out our hands towards Him,’ we must ‘put iniquity far away from us’ (Job 11:13-14); the fruits of all service will else drop off to nothing. ‘Then shall the offering of Judah and Jerusalem be pleasant to the Lord;’ When? when the heart is ‘purged’ by Christ sifting as a ‘purifier of silver’. (Mal. 3:3-4)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“If we ‘stretch out our hands towards Him,’ we must ‘put iniquity far away from us’ (Job 11:13-14); the fruits of all service will else drop off to nothing. ‘Then shall the offering of Judah and Jerusalem be pleasant to the Lord;’ When? when the heart is ‘purged’ by Christ sifting as a ‘purifier of silver’. (Mal. 3:3-4)”

— Stephen Charnock, Several Discourses upon the Existence &amp; Attributes of God, (London, 1682), ‘On the Holiness of God’, p. 564">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+we+%E2%80%98stretch+out+our+hands+towards+Him%2C%E2%80%99+we+must+%E2%80%98put+iniquity+far+away+from+us%E2%80%99+%28Job+11%3A13-14%29%3B+the+fruits+of+all+service+will+else+drop+off+to+nothing.+%E2%80%98Then+shall+the+offering+of+Judah+and+Jerusalem+be+pleasant+to+the+Lord%3B%E2%80%99+When%3F+when+the+heart+is+%E2%80%98purged%E2%80%99+by+Christ+sifting+as+a+%E2%80%98purifier+of+silver%E2%80%99.+%28Mal.+3%3A3-4%29%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+Several+Discourses+upon+the+Existence+%26+Attributes+of+God%2C+%28London%2C+1682%29%2C+%E2%80%98On+the+Holiness+of+God%E2%80%99%2C+p.+564&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F103454afe4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/103454afe4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=If%20we%20%E2%80%98stretch%20out%20our%20hands,a%20%E2%80%98purifier%20of%20silver%E2%80%99.%20%28Mal.%203%3A3%2D4&amp;text=If%20we%20%E2%80%98stretch%20out%20our%20hands%20towards%20Him&amp;text=sifting%20as%20a%20%E2%80%98purifier%20of%20silver%E2%80%99.%20%28Mal.%203%3A3%2D4" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f25aa18f93" data-kw="">
<blockquote><p>But beware that you take not decent or comely ceremonies for essential parts of worship. The apostle urging women in the Church of Corinth to be covered, 1 Cor. 11:6, that which they might think was too much preciseness in him (for we may be apt to suppose he discontented them that did otherwise) was decent in his eyes, and commanded to be done; but not making it a point of worship, nor pressing it upon them as part of God’s service, declares that ceremonies may be used in, but ought ever to be differenced from the worship performed. In brief, whatever Ceremony of what nature or kind soever that is enjoined, that is not contrary to the Word of God, and by the officers of the Church thought comely to be used, as tending to make that worship then used to be the more reverenced and esteemed by the performers, is not to be opposed. This age discovers, what a disrespect, contempt, undervaluinig thoughts most men have (even good men in a great measure) of the house of God, table of God, service of God and servants of God, since decent and comely ceremonies were banished from the Church of God: and where such ceremonies are enjoined, and thou separatest, thou art guilty of renting the seamless coat, there being no cause for making that separation justifiable.</p></blockquote>

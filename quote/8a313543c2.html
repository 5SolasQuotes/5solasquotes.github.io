</figure><figure class="quote" id="q-6a81fbefaf" data-kw="">
<blockquote><p>Is a believer’s justification complete at once; are all his sins, past, present and to come, on his first believing, pardoned? Justification, as has already been shown, changes a person’s state; and a believer’s state being changed, all his legal condemnation is at that time taken from off his person: union with Christ exempts from the same. “There is therefore now no condemnation to them that are in Christ Jesus” Rom. 8:1. Here is the high privilege of those in Christ asserted, namely, exemption from God’s condemnation; and the Holy Ghost here tells us, “There is therefore now no condemnation,” not the least condemnation remains to them “in Christ,” but their sins are freely remitted, “for his name’s sake, and all that believe are justified from all things” Acts 13:39. Here is a most complete absolution from all sins, for all those that believe in the Lord Christ. Thus Col. 1:13, “Having forgiven you all trespasses.” God does not, in the justification of his people, forgive some sins only, and leave others standing on the score. “Who forgiveth all thine iniquities,” Ps. 103:3. And not only so, but Christ covers the believer with the robe of righteousness, Isa. 61:10. For no sooner does a man truly believe in Christ, but his righteousness is imputed to him, and in and by that righteousness, he stands righteous before God, as well at the first as at the last; that righteousness of Christ by which we are justified, whether first or last, being most perfect: therefore the righteousness of justification cannot be increased, neither does our justification before God admit degrees, either in one and the same person, or yet in diverse men.—Downame on Justification, page 7. But God only forgives the sins that are past? Rom. 3:25. I answer, This looks to the sins of the saints, that were committed before Christ’s coming in the flesh, and holds forth God’s indulgence in pardoning of them, on the account of Christ’s engagement, though the price of their redemption was not actually laid down. To the same thing does the Holy Ghost speak, “And for this cause He is the Mediator of the new testament, that by means of death, for the redemption of the transgressions that were under the first testament,” Heb. 9:15. Here is that most excellent sacrifice, that looked as high as Adam, being the Lamb slain from the foundation of the world, from whence all the Old Testament saints had both full and free remission of all sin: and this I take to be the true meaning of this scripture. And though sin cannot properly be said to be actually forgiven, before it be committed, yet when the elect are, by the Holy Ghost, united to Christ, their persons are completely justified, and Christ having fulness of pardoning grace in his hands, their justification is continued and maintained by his intercession in heaven, 1 John 2:1. And thus the saints’ justification is, and continues to be, one constant and complete act of free grace, never to be reversed again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of Justification by Faith, Opened &amp; Applied from Rom. 3:24-25…’ in Works (London: Tegg, 1845), vol. 5</cite>, pp. 382-89</span></figcaption>

</figure><figure class="quote" id="q-04a4146caa" data-kw="">
<blockquote><p>It is a clear case, that these three [belief, fear and love] are the only means, yea a perfectly sufficient means to make the solder and the union between God and man, and to bring a man to the possession and fruition of God (for this comprehends the whole man), so that the whole man is possessed of God, and inflamed by God, when his understanding knows Him, and sees the excellency that is in Him, and when the affections of his heart cleave to Him, and close with the most sovereign affections of fear and love, and then when all his whole man is at the command of this, etc.</p></blockquote>

<blockquote><p>1. Because this is faith; and the Scripture says we are justified by faith. 2. We receive Christ by faith, Jn. 1:12. (3) We receive and embrace the promise by faith, Heb. 11:11, and were persuaded of them. 4. We are to believe without staggering, Rom. 4:19. (5) We have peace of conscience through faith, Rom. 5:1. (6) By faith we have access into this grace wherein wee stand, Rom. 5:2. And boldness to enter into the holy of holiest, and draw near to our High Priest, with full assurance of faith, Heb. 10:19-22. Now we are not justified by repentance and mortification; we neither receive Christ, nor embrace the promises by repentance. The apostle requires in repentance, sorrow, carefulness to eschew sin, clearing, indignation, fear, zeal, desire, revenge, 2 Cor. 7:10-11, but no where does the Scripture require this as an ingredient of repentance, that we have boldness and access, and full assurance: nor do Antinomians admit that by repentance we have peace, or pardon, but this they ascribe to faith.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. Because this is faith; and the Scripture says we are justified by faith. 2. We receive Christ by faith, Jn. 1:12. (3) We receive and embrace the promise by faith, Heb. 11:11, and were persuaded of them. 4. We are to believe without staggering, Rom. 4:19. (5) We have peace of conscience through faith, Rom. 5:1. (6) By faith we have access into this grace wherein wee stand, Rom. 5:2. And boldness to enter into the holy of holiest, and draw near to our High Priest, with full assurance of faith, Heb. 10:19-22. Now we are not justified by repentance and mortification; we neither receive Christ, nor embrace the promises by repentance. The apostle requires in repentance, sorrow, carefulness to eschew sin, clearing, indignation, fear, zeal, desire, revenge, 2 Cor. 7:10-11, but no where does the Scripture require this as an ingredient of repentance, that we have boldness and access, and full assurance: nor do Antinomians admit that by repentance we have peace, or pardon, but this they ascribe to faith.”

— Samuel Rutherford, Christ Dying &amp; Drawing Sinners to Himself… (London: 1647) | pt. 3, p. 272">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Because+this+is+faith%3B+and+the+Scripture+says+we+are+justified+by+faith.+2.+We+receive+Christ+by+faith%2C+Jn.+1%3A12.+%283%29+We+receive+and+embrace+the+promise+by+faith%2C+Heb.+11%3A11%2C+and+were+persuaded+of+them.+4.+We+are+to+believe+without+staggering%2C+Rom.+4%3A19.+%285%29+We+have+peace+of+conscience+through+faith%2C+Rom.+5%3A1.+%286%29+By+faith+we+have+access+into+this+grace+wherein+wee+stand%2C+Rom.+5%3A2.+And+boldness+to+enter+into+the+holy+of+holiest%2C+and+draw+near+to+our+High+Priest%2C+with+full+assurance+of+faith%2C+Heb.+10%3A19-22.+Now+we+are+not+justified+by+repentance+and+mortification%3B+we+neither+receive+Christ%2C+nor+embrace+the+promises+by+repentance.+The+apostle+requires+in+repentance%2C+sorrow%2C+carefulness+to+eschew+sin%2C+clearing%2C+indignation%2C+fear%2C+zeal%2C+desire%2C+revenge%2C+2+Cor.+7%3A10-11%2C+but+no+where+does+the+Scripture+require+this+as+an+ingredient+of+repentance%2C+that+we+have+boldness+and+access%2C+and+full+assurance%3A+nor+do+Antinomians+admit+that+by+repentance+we+have+peace%2C+or+pardon%2C+but+this+they+ascribe+to+faith.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself%E2%80%A6+%28London%3A+1647%29+%7C+pt.+3%2C+p.+272&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F19abe66ad7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/19abe66ad7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=1.%20Because%20this%20is%20faith%3B%20and,but%20this%20they%20ascribe%20to%20faith." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

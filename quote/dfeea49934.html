<main class="wrap"><figure class="quote" id="q-dfeea49934" data-kw="">
<blockquote><p>Since a great part of mankind imagine a righteousness compounded of faith and works let us here show that there is so wide a difference between justification by faith and by works, that the establishment of the one necessarily overthrows the other. … Away, then, with the dream of those who invent a righteousness compounded of faith and works.</p></blockquote>

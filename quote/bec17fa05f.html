<main class="wrap"><figure class="quote" id="q-bec17fa05f" data-kw="">
<blockquote><p>…but it follows not that they [Churches] have no intrinsic power from Christ to meet themselves, if the prince refuse to convocate them, as Asa, Hezekiah, Josiah did, for the Magistrate ought to protect the independent congregation, and every single professor [of Christ]: but it follows not, therefore, [that] the single congregation has no power-intrinsic to meet for Word and seals, except the prince, who is a persecutor, give him leave… For Christ has given to his Church, and members thereof, power to worship him in private, in public, in Church-assemblies, and has laid above their heads no lawful privative [depriving] power of rulers to hinder his people to worship the Lord God, Exodus 3… The prince has no power under pretense of keeping civil peace to Caesar, to hinder actings of rendering honor to God, contrary to truth and destructive to the Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 4, ch. 12, ‘Of the Magistrate’s Power in Convocating Synods’, pp. 501-2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8b76b9e9b8" data-kw="">

</figure><figure class="quote" id="q-e6f79cad8b" data-kw="">
<blockquote><p>…neither can he [an opponent] be ignorant of that which he has so often read and learned of your most godly writings, that it pertains not to the prince either to prescribe religion to the kirk or discipline to the pastors thereof, but by his authority to confirm both the one and the other, appointed by God, and sincerely declared out of his Word by the ministry of his servants; to revenge and punish all corrupting of clean doctrine, contempt of holy discipline, and perturbation of lawful order (for which use and purpose he has received the sword), to decore the Assemblies, if need be, with his presence; to arm the innocency of the ministry by his safe-guard and defense; if there arise controversies among the pastors, sometimes to compose and agree the same by his authority interpouned; to promove, by good laws made for that effect these things which are lawfully constituted by the Assemblies, and to do many other things for the weale of the kirk which were long to rehearse, and unneedful. But far otherwise does he sit in the synods among the pastors than he does in the throne of the kingdom among the estates: here to make laws for subjects and command, but there to receive laws from God and to obey. And albeit that some things be called ecclesiastical, and other things civil, and the civil appertain to the commonweal, and the other to the kirk; yet it is not so much to be considered what things are handled, as how, seeing the knowledge of one and the self-same thing one way, and in some respect, appertains to the magistrate, and another way to the senate ecclesiastical. And yet such a matter neither does the kirk civilly, nor the counsel or parliament ecclesiastically entreat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-melville.html">Andrew Melville</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘To Pastors of the Kirk of Geneva &amp; Zurich’</cite>, pp. 165-66 in David Calderwood, History of the Kirk of Scotland, vol. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-305c9484c3" data-kw="">
<blockquote><p>Neither in this case ought the authority of certain worthy and most learned men to move us, who seem too indiscreetly for to deny that this care appertains unto the Magistrate, whose office (say they) it is not to rid men from diseases, but only to maintain the safety and peace of our life and goods. For it may even out of their own words be proved sufficiently, that albeit the magistrate ought not to cure the diseases of every several man, or preserve them from such as do not openly ravage, nor have common causes (for this is the proper duty of the physicians), yet when as they hold it to be belonging to their charge, by their service and authority to perform, that their subjects may live commodiously: who sees not that this commodiousness does also appertain unto the health of the body? Which thing he that believes not, the same has never seen how miserably all the duties of men are cumbered, the order of the churches, the exercises of godliness, the instruction of youth, the traffic of citizens, whereupon must needs ensue a most grievous destruction of particular persons, when the plague troubles a city or country. Wherefore, I appeal unto thyself, whosoever thou art that art of this opinion, that thou thinkest not it to be the duty of the Magistrate to preserve the commonwealth from diseases (and especially common diseases) do not such sicknesses seem unto thee to be numbered amongst other incommodities? And can men live together commodiously when as these diseases do rage? Doubtless this canst thou not affirm if ever thou hast had experience before what the plague is, or what it may work, where it once has prevailed? Why then, say I, doest thou think it a thing not appertaining unto the duty of the magistrate, to deliver men from such diseases, that is with public care to defend? I pray thee, hast thou not seen that which is usual in all well ordered commonwealths, how diligently in cities the Magistrate provides and stores up such things as serve for the use of war? How carefully he prepares weapons? How busily he retains garrisons set in a readiness? Especially when he is in fear of some hurt to ensue? and to what end? but that men should live commodiously. Wherefore are horses kept; ships built; walls repaired, trenches dug, towers set up and banks cast: but that the citizens should live more commodiously in safety against the invasions or assaults of the enemies? Dogs are maintained for the like cause, nets are pitched, hunters are hired and troops of country people draw together if at any time wolves or such like beasts do trouble a country. I remember in the kingdom of France that certain leopards, which the king uses to keep, did break out of ward, and in every place slew the countrymen. The whole country was mustered and neither cost nor labor spared until they had rid the land from that fear. How much more justly then in this calamity and misery also ought there some provident course to be taken whereby this so mighty an enemy and cruel beast may be kept away from our throats, which in a very short time is wont to ravage very far, and as it were a canker, eat up every thing that is next [to] it? To the end that the clean in the Old Testament should not keep company with the unclean lepers, by the authority of the Magistrate, there was made a separation, neither were they received among the other people before that they were by the priests appointed to this office, judged cleansed after they were viewed naked.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books</cite>, (London, 1583), bk. 1, ch. 1, p. 4-5. von Ewich was a reformed German reformer, physician and city health official.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

e+before+what+the+plague+is%2C+or+what+it+may+work%2C+where+it+once+has+prevailed%3F+Why+then%2C+say+I%2C+doest+thou+think+it+a+thing+not+appertaining+unto+the+duty+of+the+magistrate%2C+to+deliver+men+from+such+diseases%2C+that+is+with+public+care+to+defend%3F+I+pray+thee%2C+hast+thou+not+seen+that+which+is+usual+in+all+well+ordered+commonwealths%2C+how+diligently+in+cities+the+Magistrate+provides+and+stores+up+such+things+as+serve+for+the+use+of+war%3F+How+carefully+he+prepares+weapons%3F+How+busily+he+retains+garrisons+set+in+a+readiness%3F+Especially+when+he+is+in+fear+of+some+hurt+to+ensue%3F+and+to+what+end%3F+but+that+men+should+live+commodiously.+Wherefore+are+horses+kept%3B+ships+built%3B+walls+repaired%2C+trenches+dug%2C+towers+set+up+and+banks+cast%3A+but+that+the+citizens+should+live+more+commodiously+in+safety+against+the+invasions+or+assaults+of+the+enemies%3F+Dogs+are+maintained+for+the+like+cause%2C+nets+are+pitched%2C+hunters+are+hired+and+troops+of+country+people+draw+together+if+at+any+time+wolves+or+such+like+beasts+do+trouble+a+country.+I+remember+in+the+kingdom+of+France+that+certain+leopards%2C+which+the+king+uses+to+keep%2C+did+break+out+of+ward%2C+and+in+every+place+slew+the+countrymen.+The+whole+country+was+mustered+and+neither+cost+nor+labor+spared+until+they+had+rid+the+land+from+that+fear.+How+much+more+justly+then+in+this+calamity+and+misery+also+ought+there+some+provident+course+to+be+taken+whereby+this+so+mighty+an+enemy+and+cruel+beast+may+be+kept+away+from+our+throats%2C+which+in+a+very+short+time+is+wont+to+ravage+very+far%2C+and+as+it+were+a+canker%2C+eat+up+every+thing+that+is+next+%5Bto%5D+it%3F+To+the+end+that+the+clean+in+the+Old+Testament+should+not+keep+company+with+the+unclean+lepers%2C+by+the+authority+of+the+Magistrate%2C+there+was+made+a+separation%2C+neither+were+they+received+among+the+other+people+before+that+they+were+by+the+priests+appointed+to+this+office%2C+judged+cleansed+after+they+were+viewed+naked.%E2%80%9D%0A%

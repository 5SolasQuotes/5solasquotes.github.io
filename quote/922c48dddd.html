<main class="wrap"><figure class="quote" id="q-922c48dddd" data-kw="">
<blockquote><p>…we consider things circumstantial, as time, place, etc. And circumstances are either merely physical, or 2. merely moral, or 3. mixed, partly moral, partly physical. Circumstances merely physical are such adjuncts of divine worship as are common and inseparable concomitants of both civil, natural and religious or sacred actions performed by men, and as they are such, contribute no moral goodness or badness to the action or agent in the performance thereof, such as I take to be the seven individuall proprieties of every man: forma, figura, locus, tempus, strips, patria, nomen. Under form and figure, the first two, I comprehend such a proportion of body, a man of a high stature or low, a man beautiful or not beautiful, to which I crave leave to reduce all external forms of habits, as clothes, the head covered or not covered, the situation of the body, as as they are in themselves, mere physical acts, kneeling, sitting, standing, the eyes cast down to the earth or lifted up, the hands lifted up, or not lifted up, the knocking on the breast, or not knocking, motions of the soul, that are natural… 1. All these are common concomitants of civil, natural and religious actions, for all actions performed by man of what kind soever, as natural, to eat, sleep, or civil, to declaim an oration before the people, or religious, to preach or pray, must be done by some persons, John or Thomas, men of some family, in some time, in some place, for they are not actions eternal, and so must be done in time and place, so the agents must have some habit [garment], some gesture in the doing of all these actions, and they are unseparable adjuncts of all these actions because neither actions natural, civil, nor religious can be performed but by some persons in some habit and gesture, in some time, in some place: and lastly, they are mere circumstantials, and contribute no moral goodness or badness to the actions, as they are but common and inseparable circumstances; for because he preaches in time, or in place simply, the preaching is neither morally good, nor ill, better or worse, because Thomas prays in gown or cloak, in this place, rather than that place… the praying is neither the more or the less acceptable to God because of these common and unseparable adjuncts. … I did say that Christ Jesus has set down in the Word a perfect platform of Church-government in all morals; I say ‘in all morals’ because the Word does not teach us anything of circumstances, physical as physical. Scriptura talia non ponit, sed supponit [Scripture does not appoint such things, but supposes them]: The Scripture says not that the Worship of God must have a time, a place, when, and where it’s to be performed, a person, who is to perform it, a habit, or garments on the person that worships; the Scripture teaches none of these, but supposes that they are and must be, because nature teaches that without time, place, person, habit, gesture, it’s impossible that these or any human actions can be; and therefore Prelatical Formalists do without all sense or reason require that we should prove by Scripture, the lawfulness of time, place, person, habit, gesture in God’s worship; for these are presupposed in all actions, natural, civil, religious, private, public, lawful, unlawful, in acts of arts, sciences, of moral conversing and all…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Introduction, pp. 2-5</span></figcaption>

ral%2C+civil%2C+nor+religious+can+be+performed+but+by+some+persons+in+some+habit+and+gesture%2C+in+some+time%2C+in+some+place%3A+and+lastly%2C+they+are+mere+circumstantials%2C+and+contribute+no+moral+goodness+or+badness+to+the+actions%2C+as+they+are+but+common+and+inseparable+circumstances%3B+for+because+he+preaches+in+time%2C+or+in+place+simply%2C+the+preaching+is+neither+morally+good%2C+nor+ill%2C+better+or+worse%2C+because+Thomas+prays+in+gown+or+cloak%2C+in+this+place%2C+rather+than+that+place%E2%80%A6+the+praying+is+neither+the+more+or+the+less+acceptable+to+God+because+of+these+common+and+unseparable+adjuncts.+%E2%80%A6+I+did+say+that+Christ+Jesus+has+set+down+in+the+Word+a+perfect+platform+of+Church-government+in+all+morals%3B+I+say+%E2%80%98in+all+morals%E2%80%99+because+the+Word+does+not+teach+us+anything+of+circumstances%2C+physical+as+physical.+Scriptura+talia+non+ponit%2C+sed+supponit+%5BScripture+does+not+appoint+such+things%2C+but+supposes+them%5D%3A+The+Scripture+says+not+that+the+Worship+of+God+must+have+a+time%2C+a+place%2C+when%2C+and+where+it%E2%80%99s+to+be+performed%2C+a+person%2C+who+is+to+perform+it%2C+a+habit%2C+or+garments+on+the+person+that+worships%3B+the+Scripture+teaches+none+of+these%2C+but+supposes+that+they+are+and+must+be%2C+because+nature+teaches+that+without+time%2C+place%2C+person%2C+habit%2C+gesture%2C+it%E2%80%99s+impossible+that+these+or+any+human+actions+can+be%3B+and+therefore+Prelatical+Formalists+do+without+all+sense+or+reason+require+that+we+should+prove+by+Scripture%2C+the+lawfulness+of+time%2C+place%2C+person%2C+habit%2C+gesture+in+God%E2%80%99s+worship%3B+for+these+are+presupposed+in+all+actions%2C+natural%2C+civil%2C+religious%2C+private%2C+public%2C+lawful%2C+unlawful%2C+in+acts+of+arts%2C+sciences%2C+of+moral+conversing+and+all%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%281646%29%2C+Introduction%2C+pp.+2-5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote% </figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-501c80bd1e" data-kw="">
<blockquote><p>Paybody thinks kneeling in the act of receiving the Communion to be expedient for the reverend using and handling of that holy sacrament, and that much reverence arises to the sacrament from it. Answer: I verily believe that more reverence arises to the sacrament from kneeling than is due to it, but I am sure there is no less true reverence of that holy sacrament among such as kneel not in the receiving of it than among such as do kneel. I hope it is not unknown how humbly and reverently many sincere Christians, with feare and trembling, do address themselves to that most holy sacrament, who yet for all the world, would not kneel in receiving it. Thus we see that these expediencies pretended for the ceremonies are attained unto as well and better without them, than by them.</p></blockquote>

</figure><figure class="quote" id="q-3ffcc16b4a" data-kw="">
<blockquote><p>Where they have read that the people bowed before the altar of God, I know not. Bishop Lindsey indeed would prove from 2 Chron. 6:12-13 and Mic. 6:6 that the people bowed before the altar and the offering. But the first of those places speaks nothing of kneeling before the altar, but only of kneeling before the congregation, that is, in sight of the congregation. And if Solomon had then kneeled before the altar, yet the altar had been but occasionally and accidentally before him in his adoration, for to what end and use could he have purposely set the altar before him whiles he was kneeling and praying? The place of Micah cannot prove that God’s people did kneel before the offerings at all (for it speaks only of bowing before God) far less that they kneeled before them in the very act of offering, and that with their minds and senses fixed upon them, as we kneel [speaking of Gillespie’s opponents] in the very act of receiving the sacrament, and at that instant when our minds and senses are fastened upon the signs, that we may discern the things signified by them, for the exercising of our hearts in a thankful meditation upon the Lord’s death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 3, ch. 4, p. 69</span></figcaption>

<blockquote><p>And by this posture [lifting up his eyes] did [Christ] testify the heavenly and depending frame of his spirit. 4. Albeit the Lord know the most secret desires of the heart, and do respect and hear the very thoughts of his people, yet it is their duty, as they have opportunity, to make use of their tongue in prayer, that so they may do Him homage with the whole man, may, by that means (among others) excite their own affections in prayer and may edify others in their place and station, for some (at least) of these causes it is that Christ in prayer spake in the audience of his disciples, ‘He lift up his eyes, and said,’ and by his practice and example would teach us our duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Gospel of Jesus Christ, according to John</cite>, (London, 1657) | on Jn., 17:1</span></figcaption>

<blockquote><p>§41. 2. And for kneeling at the sacrament, I doubt not at all but the imposing it, and that on such rigorous terms, tying all to it and casting all out of the communion of the Church or from the participation of the sacrament that durst not use it, was a very grievous sin and tended to persecution, injustice and Church-dividing. It is certainly in a doubtful case the safest way to do as Christ and his apostles, and the universal Church did for many hundred years. That none should kneel in public worship on the Lord’s Day, no not in prayer, much less in receiving the eucharist, was a Custom so ancient and universal in the Church, that it was everywhere observed before general councils were made use of; and in the first general Council of Nicea it was made the last canon; and other general councils afterward renewed it; so that I know not how any ceremony can possibly pretend to greater ecclesiastical authority than this had. And to cast out all from Church communion in sacraments that dare not go against the examples of Christ and his apostles, and all the primitive Church (who long received the eucharist in another gesture) and against the canons of the first and most famous, and other succeeding general councils, this is a most inhumane part. Either the gesture is indifferent in itself or not: If it be, how dare they thus divide the Church by it and cast out Christians that scruple it when they have these and many other reasons of their scruples (which for brevity I omit). If they say that kneeling is of itself necessary, and not indifferent, because it is reverent etc. then: 1. They make Christ an imperfect Lawgiver: 2. They make Himself or his apostles, or both to have been sinners. 3. They condemn the catholic Church of sin. 4. They condemn the canons of the chief general councils. 5. And then if the bishops themselves in council should change the gesture, it were unlawful to obey them. All which are consequents that I suppose they will disown. What a perverse preposterous reverence is this? when they have leave to lie in the dust before and after the very act of receiving, through all their confessions and prayers, yet they will at other times stand, and many of them sit at prayer, and sit at singing Psalms of Prayer and Praise to God, and yet when Christ doth invite them to a feast, they dare not imitate his apostles and universal Church in their gesture, lest they should be sinfully unreverent. §42. But yet, as sinfully as this gesture was imposed, for my part I did obey the imposer and would do if it were to do again, rather than disturb the peace of the Church, or be deprived of its communion. For God having made some gesture necessary and confined me to none, but left it to humane determination, I shall submit to magistrates in their proper work, even when they miss it in the manner. I am not sure that Christ intended the example of Himself and his apostles as obligatory to us that shall succeed. I am sure it proves sitting lawful: but I am not sure that it proves it necessary: (though very convenient). But I am sure He has commanded me obedience and peace.</p></blockquote>

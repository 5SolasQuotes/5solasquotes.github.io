<blockquote><p>197. But can you not appeal to Scripture, if possible, of a still more conclusive nature, in relation to this subject?

Yes: posterity is charged with the guilt of violating Covenants made with ancestors: “They are turned back to the iniquity of their forefathers, which refused to hear my words; and they went after other gods to serve them: the house of Israel and the house of Judah have broken my Covenant which I made with their fathers.” (Jer. xi. 10.) Still more explicit Israel on the plains of Moab; for, in relation to the transactions at Sinai, entered into forty years before the time when Moses addressed the words to Israel, and when he, Caleb, and Joshua, were the only three original Covenanters alive, he declare:- “The Lord our God made a Covenant with us in Horeb: the Lord made not this Covenant with our fathers, but with us, even with us, who are all of us here alive this day.” (Deut. v. 2, 3.)

198. Is not the principle of the continued obligation of Covenants often in Scripture made a plea in supplicating the Divine mercy?

Yes, frequently. Hence, for example, Jeremiah exclaims:- “Do not abhor us for thy name’s sake: remember, break not thy Covenant with us.” (See Jer. xiv. 21.)

199. On the other hand, does not Jehovah himself frequently rest a plea on the same principle, why punishment should fall upon the guilty?

He does. In the suppositional case stated by Moses (Deut. xxix. 25) to inquirers after the cause of the conditional infliction of sweeping desolations on the Jewish race, the emphatic reply is given: – “Because they have forsaken the Covenant of the Lord God of THEIR FATHERS.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prize Catechism on the Principles and Position of the Reformed Presbyterian Church</cite>, (Belfast: M. Pollock, 1858), pp 86-87.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-470635d08b" data-kw="">
<blockquote><p>The work of the Incarnation of the Son of God, and the Redemption of the World by him, was such, that one main end of making this goodly frame of Heaven and Earth was, that it might be the stage upon which that Work should be acted. A work wherein not only all man’s happiness lies, and whence it flows; but wherein all God’s Attributes are glorified to the highest; and for which the Church Triumphant shall think Eternity short enough to praise God. Of this Work (I say) the sum is given in one word, Immanuel, God is with us.

And plain Reason may demonstrate that it must needs be so. What is glory, but the shining out of excellency? What is happiness but the fruition of the greatest good? Now there is no Excellency that shines out in anything, like to that which beams out from God in the Covenant of grace to his people. There is no good that any people can enjoy like the fruition of God in that Covenant. It is true, God manifests himself to all the Nations in the World (in him they live, and move, and have their being:) yet it is as in a dark Cloud, they grope after him, and cannot feel him, but in the covenant of grace men behold him with open face, like the Sun shining in his strength, as through a Mirror: Such a Mirror as the Prince of Orange had, that would shew the Sun in his full bigness and beauty. Thus God shines in the Covenant of grace.</p></blockquote>

<blockquote><p>While the non-elect may belong to the external administration of the covenant of grace, only the elect are, properly speaking, in the covenant of grace (cf. Galatians 3:16, Romans 5:15-21, Isaiah 53:10, 11). This view is not a “Reformed Baptist” notion but is the official position of the Westminster Standards (see Larger Catechism 31). Moreover, we find the Westminster divine, Edmund Calamy, arguing for this position:

[A]ll men enter into Adam’s covenant by nature, but the Elect only enter into Christ’s covenant by grace …</p></blockquote>

</figure><figure class="quote" id="q-d64f9341df" data-kw="">
<blockquote><p>The word Testament is a Latin word, whereby the Greek word Diatheke is rendered, which the Greek Translators use to express the Hebrew word Berith, that is, Covenant. And thereby is properly understood the Covenant itself, which God hath made with mankind upon certain conditions to give them everlasting life: which Covenant is twofold, the Old and the New.

The Old is that which God made with the first man before the fall, wherein eternal life was promised upon condition of a thoroughly perfect, and keeping of the Law; and is therefore called the Legal Covenant, which God again propounded to the Israelites, that from thence they might learn to understand (seeing this condition is transgressed by all men, and can now be fulfilled by no man) that they must seek their salvation in another Covenant, which is called the New [Covenant,] and consisteth in this: That God hath appointed his Son for a Mediator, and promiseth eternal life upon condition that we believe in him; and is called the Covenant of Grace.

And this also in regard of the several administrations thereof unto mankind is called Old and New. The Old is the administration of the Covenant before the coming of the Mediator, which was promised to Abraham and his posterity [to come] of his seed, and prefigured by manifold Ceremonies laid down by Moses. The New is the administration of the same Covenant, since the Son of God, the Mediator of this Covenant came in the flesh, and hath accomplished man’s reconciliation with God. These two Covenants are of one kind as concerning their substance, forasmuch as in both forgiveness of sins, salvation and eternal life are promised upon condition of faith in the Mediator: but are different in respect of their several administrations, which in the New is much clearer, without figures, and extends itself unto all Nations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-haak.html">Theodore Haak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Argument of the New Testament in The Dutch Annotations upon the Whole Bible</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

The Old is that which God made with the first man before the fall, wherein eternal life was promised upon condition of a thoroughly perfect, and keeping of the Law; and is therefore called the Legal Covenant, which God again propounded to the Israelites, that from thence they might learn to understand (seeing this condition is transgressed by all men, and can now be fulfilled by no man) that they must seek their salvation in another Covenant, which is called the New [Covenant,] and consisteth in this: That God hath appointed his Son for a Mediator, and promiseth eternal life upon condition that we believe in him; and is called the Covenant of Grace.

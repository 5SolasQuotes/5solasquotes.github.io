<blockquote><p>Reflection is also needful to preserve the sabbath disposition and blessing. First, this consists in reflecting upon how the day was spent publicly and privately, and upon the sins which one has committed; that is, laxity, listlessness, lack of spirituality, and the failure to abhor these. Confess this with sorrow before the Lord, and seek forgiveness through Christ.

Secondly, it consists in reflecting upon the good we have performed on this day, upon the upright objective to hallow the sabbath, and the efforts to do everything in such a manner as is pleasing to God. It furthermore consists in reflecting upon the blessings, refreshments, comforts, illumination, and quickening we enjoyed from the Spirit of the Lord. One must acknowledge this and rejoice in this, even if it were ever so little. Even if the insatiable desire of our soul has not been satisfied, we should yet thank the Lord for the good we received.

Thirdly, it consists in the acknowledgement of God‘s goodness to His church in giving her the sabbath, enabling her to gather publicly and conduct all her public worship services, and for the privilege to enjoy a holy rest.

Fourthly, it consists in yearning and longing for the rest which remains for the people of God (Heb 4:9), in rejoicing in this hope, in forgetting those things which are behind, and reaching forth unto those things which are before, pressing toward the mark for the prize of the high calling of God in Christ Jesus. Blessed is he who thus begins, observes, and ends the sabbath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 3: 146-47.</span></figcaption>

<blockquote><p>1. That no human engagements are or ought to be binding to the conscience of those that take them further than the meaning of those that give them is declared and assented unto by the taker.

2. That no engagements whereof the meaning is declared ought to be further binding to the conscience than the intent declared is lawful and allowable in the presence of God.

3. That the intents of no engagements amongst men can be further lawful and allowable in the presence of God than as they are subordinate unto the main rules of our Christian profession and to the principles of natural equity in human societies, whence this corollary will follow: That if upon unforeseen accidents and emergences (which alter the nature of all human affairs) one and the same intent and design may be at one time agreeable to these rules and principles, and at another time become disagreeable thereunto: then that intent and design not only may, but must be laid down; for it is wholly unlawful to maintain any purposes which cease the practice or the profession of duties flowing from these rules and principles.

4. That the intents and designs of the Oath of Allegiance [to Charles I, who was executed] and of the National [Solemn League &amp;] Covenant were never made by the parliaments which framed them to contradict one another; or in their proper times to oppress the rules of our Christian profession or the principles of natural equity by which our society is upheld: although in respect of certain expressions which relate to the circumstances of several times wherein they were framed, they are clearly different one from another. Whence this again will follow: That to be obliged to different intentions (though contrary) upon several occasion (if both agree in their proper times to the forenamed rules and principles) this can be no breach of duty or prejudice of conscience.

5. That it does belong only to the superior powers of human societies to judge and determine at all times that the public engagements and designs ought to be, and what the form of government is, which is most proper for the times, and agreeable to natural equity to be yielded unto by all for common preservation in humane societies.

6. That the supreme powers cannot be bound up unalterably to any particular design or human engagement so as not to be free upon emergencies to entertain other designs and engagements; when they shall think it most expedient for common safety, and agreeable to Christianity, nay, they are not only free to do this, but they are bound to it: else they are not faithful to the charge which God has committed to them.

7. That subjects (that is, particular men in private stations) ought not to make themselves interpreters of the intents of public engagements otherwise than as they are agreeable to the rules of Christianity and the principles of natural equity; and so far as they bear a sense agreeable unto these, so far they are bound in conscience professedly to own them; but if a sense be imposed upon them contrary to any of these, then they are not obliged to own that sense.</p></blockquote>

<blockquote><p>Evan. If we look into the word of God, we shall find that the ordinary means and parts of God’s worship, are invocations upon the name of God, ministry and hearing of the word of God, administration and receiving the sacraments, with all helps and furtherances to the right performance of the same.

But to declare this more particularly, First of all, prayer both public and private is required in God’s word, as you may see, (1 Tim. 2:8, Acts 2:21,22, Dan. 6:10).

Secondly, Reading the word, or hearing it read, both publicly and privately, is required in God’s word, as you may see, (Rev. 1:3, Deut. 5:6).

Thirdly, Preaching, and hearing of the word preached, is required in the word of God, as you may see, (2 Kings 4:2, 1 Thess. 2:13).

Fourthly, The administration and receiving the sacrament is required in the word of God, as you may see, (Matt. 3:6, 26:26, 1 Cor. 10:16).

Fifthly, Praising of God, in singing of psalms, both publicly and privately, is required in the word of God, as you may see, (Col. 3:16, James 5:13).

Sixthly, Meditation on the word of God is required in the word of God, as you may see, (Psa. 1:2, Acts 17:11). Seventhly, Conference about the word of God is required in the word of God, as you may see, (Mal. 3:16).

And, Lastly, For the better fitting and stirring us up to the right performance of these duties, religious fasting, both in public and in private, is required in the word of God, as you may see, (Joel 1:14, 2:15). And so also is a religious vow or free promise made to God, to perform some outward work, or bodily exercise for some end, as you may see, (Eccl. 5:3,4). And thus have I shown you what be the means of God’s worship which he hast prescribed in his word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 405-06.</span></figcaption>

<blockquote><p>Objection [of Separatists]: They [wicked people] mix with us in our [congregational] singing; mixed worship we cannot join in. Answer: I cannot conceive what harm this can do to you; is the mixing of your own corruption in your service less prejudicial to the acceptance of it with God, than the presence of wicked men joining in the service?</p></blockquote>

</figure><figure class="quote" id="q-c1b9f9054e" data-kw="">
<blockquote><p>It is granted by all sober Protestants that the Church has power of making canons and constitutions for decency and order in the public worship of God; and not only to prescribe the necessary circumstances of time and place, but also to continue and establish those ancient rites of the Christian Church which were practiced in the primitive times and are in themselves of an indifferent nature; which authority of the Church was asserted in the Augustan [Augsburg] Confession [art. 7, 15, 21, 24, Conclusion], and particularly by Mr. Calvin (Institutes, bk. 4, ch. 10, sect. 27. See Thomas Cartwright, [A Reply to an Answer,] bk. 1, [Answer to pp. 20-22,] p. 27), and other worthy persons in the Reformation. Which our [Anglican] reformers also did assume to themselves, as is declared in the 20th Article [of the 39 Articles]; and has been practised and defended against all Dissenters, as well by Scripture (Acts 15:28; 1 Cor. 11:16), as by antiquity and right reason… And the Royal Martyr [King Charles I] was so tender of their reputation that in his answer to the Parliament’s remonstrance, he promises to reform the ceremonies with these cautions:

1. That the reformation were pursued with such modesty and submission that the quiet of the kingdom were not disturbed;

2. Nor the decency and comeliness of God’s service discountenanced;

3. Nor the pious, sober and devout actions of those reverend persons who were the first laborers in the blessed Reformation be scandalized and defamed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-long.html">Thomas Long</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Preface concerning the Ceremonies of the Church’ in Misericordiam Volo</cite>, ‘The Preface concerning the Ceremonies of the Church’ in Misericordiam Volo: or the Pharisees’ Lesson, showing the Impiety &amp; Unreasonableness of contending for Outward Forms &amp; Ceremonies to the Violation of Obedience, Charity &amp; the Public Peace in The Character of a Separatist, or Sensuality the Ground of Separation... (London: Kettilby, 1677)</span></figcaption>

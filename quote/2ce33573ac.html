<blockquote><p>5. Predestination does not depend on any external cause, reason or condition, but proceeds purely from the will of the one predestinating.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d88e89822c" data-kw="">
<blockquote><p>16. God’s providence extensively is occupied concerning all both entities and acts of entities, and intensively is partly effective, partly permissive, partly directive.

17. Works of grace are either preparatory of it [i.e. decrees] or applicatory.

18. Secondary preparatory works of grace [such as infra decrees] can be given; primary ones [such as supra decrees] cannot be given.

19. Secondary preparatory works of grace are the eternal destination of the Mediator, and his temporal mission, and the obedience of the one sent, consisting both in his appearance and in the execution of the threefold office undertaken by him. …

24. Applicatory works of grace are either external or internal.

25. External ones are both calling through the Word partly of law, partly of gospel, and the sealing of those called through sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-friedrich-spanheim.html">Friedrich Spanheim the Elder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), ‘Miscellaneous Theological Disputation’, trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

aling%20of%20those%20called%20through%20sacraments" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5f317cf4ce" data-kw="">
<blockquote><p>Of what sort of men is election? Of such as are uncleane and ungodly in the sight of God. “For He has chosen us that we might be holy and without blame,” Eph. 1:4. But whereas He chose us before the world was made, it is effected that God set before his eyes all men that ever should be, and for as much as they would be ungodly and accursed, He likewise so considered them and so chose some out of the common lump and filth of men, and those freely according to the good pleasure of his will, leaving others in their sin and curse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (London: 1606), Place 36, ‘Of Predestination’, p. 433</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><figure class="quote" id="q-252239b9c2" data-kw="">
<blockquote><p>While living in Geneva about 1558, Knox was asked by persons back in England to answer a book circulating there titled Careless by Necessity. This work, written by an Anabaptist, denied the doctrine of Predestination. Knox complied… This work is the longest of Knox’s writings… On Predestination is in the form of an ‘answer’, and is disputational in structure. Knox alternately [block] quotes an assertion from his ‘Adversarie’ [in the order of the adversary’s book] immediately following it with his ‘Answer’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-l-dole.html">Brian L. Dole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘John Knox on Predestination’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>
<div class="actions"><button class="copy" data-copy="“While living in Geneva about 1558, Knox was asked by persons back in England to answer a book circulating there titled Careless by Necessity. This work, written by an Anabaptist, denied the doctrine of Predestination. Knox complied… This work is the longest of Knox’s writings… On Predestination is in the form of an ‘answer’, and is disputational in structure. Knox alternately [block] quotes an assertion from his ‘Adversarie’ [in the order of the adversary’s book] immediately following it with his ‘Answer’.”

</figure><figure class="quote" id="q-ed0cd0edfa" data-kw="">
<blockquote><p>Finally, the end [of God’s creating the world] is twofold: The first and highest is the glory of God, Prov. 16:4, Rom. 11:36, 1 Cor. 8:6, Col. 1:16; which consists in the manifestation of His goodness, wisdom, and power (both by God and by the intelligent creature of God). … Then the second, subordinate to the first and tending toward it, is twofold: The first is the utility of the creature, Ps. 104… The last is the eternal salvation of all the elect in heaven, Mt. 25:34 and 22:30, Rom. 9:23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epitome of Theological Common Places</cite>, (d. 1641; Amsterdam: Jansson, 1653), Locus 6, ‘On the Creation of the World’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

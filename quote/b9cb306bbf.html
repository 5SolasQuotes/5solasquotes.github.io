<main class="wrap"><figure class="quote" id="q-b9cb306bbf" data-kw="">
<blockquote><p>And the same is objected against them by Maimonides in Pirke Aboth: as though it were not known that the greatest part of their Talmud, the sacred treasury of their oral law, is taken up with differences and disputes of their masters among themselves, with a multitude of various opinions and contradictory conceptions about their traditions. Thus deal the Romanists also with their adversaries, this they charge them withal. They are heretics, Biblists; and, by adhering to the Scripture alone, have no certainty among themselves, but run into diversities of opinion, having deserted the unerring rule of their Cabala;—when the world is filled with the noise of their own conflicts, notwithstanding the pretended relief which they have thereby.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, vol. 18, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 140.</span></figcaption>

<blockquote><p>Section 14. It is no doubt but that in the copies we now enjoy of the Old Testament there are some diverse readings, or various lections… the various lections of Ben-Asher or Rabbi Aaron the son of Rabbi Moses of the tribe of Asher, and Ben Nepthali, or R: Moses the son of David of the tribe of Nepthali; of the East and Western Jews, which we have collected at the end of the great Bible with the Masora, evince it. But yet we affirm that the whole Word of God, in every letter and tittle, as given from Him by inspiration, is preserved without corruption. Where there is any variety it is always in things of less, indeed of no importance. God by his providence preserving the whole entire, suffered this lesser variety to fall out, in or among the copies we have, for the quickening and exercising of our diligence in our search into his Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Divine Original, with the Authority, Self-Evidencing Power &amp; Light of the Holy Scriptures, ch. 1 in Of the Divine Original, Authority, Self-Evidencing Light &amp; Power of the Scriptures. With an Answer to that Enquiry… (Oxford: Hall, 1659), pp. 13-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/inerrancy-and-infallibility.html">Inerrancy and Infallibility</a></span></div>

ur%20diligence%20in%20our%20search%20into%20his%20Word" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>In the third place, it is said, as I also have read, that they base their faith on this verse, “He who believes and is baptized will be saved” [Mark 16:16]. This they interpret to mean that no man should be baptized before he believes. I must say that they are guilty of a great presumption. For if they follow this principle they cannot venture to baptize before they are certain that the one to be baptized believes, How and when can they ever know that for certain? Have they now become gods so that they can discern the hearts of men and know whether or not they believe? If they are not certain if they believe, why then do they baptize, since they contend so strenuously that faith must precede baptism? Are they not contradicting themselves when they baptize without being certain if faith is there or not? For whoever bases baptism on faith and baptizes on chance and not on certainty that faith is present does nothing better than he who baptizes him who has no faith. For unbelief and uncertain belief are one and the same thing, and both are contrary to the verse, “Whoever believes,” which speaks of a sure faith which they who are to be baptized should have. You say, I know, that he confesses that he believes, etc. Dear sir, confession is neither here nor there. The text does not say, “He who confesses,” but “He who believes.” To have his confession is not to know his faith. With all your reasoning you cannot do justice to this verse unless you also know he has faith, since all men are liars and God alone knows the heart. So whoever bases baptism on the faith of the one to be baptized can never baptize anyone. Even if you baptized a person a hundred times a day you would not at all know if he believes. Why then do you carry on with your rebaptizing, since you contradict yourself and baptize when you are not sure that faith is present, and yet you teach that faith must most certainly be present. This verse, “Whoever believes,” altogether opposes their rebaptizing, since the verse speaks of a certain faith. They base their rebaptizing on an uncertain faith, and in not a syllable do they follow the meaning of the verse. I say the same thing about the baptized one who receives or grounds his baptism on his faith. For he is not sure of his own faith. I would compare the man who lets himself be rebaptized with the man who broods and has scruples because perhaps he did not believe as a child. So when next day the devil comes, his heart is filled with scruples and he says, Ah, now for the first time I feel I have the right faith, yesterday I don’t think I truly believed. So I need to be baptized a third time, the second baptism not being of any avail. You think the devil can’t do such things? You had better get to know him better. He can do worse than that, dear friend. He can go on and cast doubt on the third, and the fourth and so on incessantly (as he indeed has in mind to do), just as he has done with me and many in the matter of confession. We never seemed able to confess sufficiently certain sins, and incessantly and restlessly sought one absolution after the other, one father confessor after the other. Just because we sought to rely on our confession, as those to be baptized now want to rely on their faith. What is the end result? Baptizing without end would result. All this is nonsense. Neither the baptizer nor the baptized can base baptism on a certain faith. This verse of Scripture is far more a judgment on them than on us. And these are the people who don’t want to trust the men who are witnesses of their baptism, but now as men are ready to trust themselves that they are baptized as if they were not men, or as if they were more certain of their faith than the witness of Christendom allows. So I contend that if they want to do justice to this passage, “Whoever believes,” according to their understanding, they must condemn rebaptism much more earnestly than the first baptism. Neither the baptizer nor the baptized can maintain his position, for both are uncertain of their faith, or at least are in constant peril and anxiety. For it happens, indeed it is so in this matter of faith, that often he who claims to believe does not at all believe; and on the other hand, he who doesn’t think he believes, but is in despair, has the greatest faith. So this verse, “Whoever believes,” does not compel us to determine who has faith or not. Rather, it makes it a matter of every man’s conscience to realize that if he is to be saved he must believe and not pretend that it is sufficient for a Christian to be baptized. For the verse does not say, “Whoever knows that he believes, or, if you know that anyone believes,” but it says, “Whoever believes.” Who has it, has it. One must believe, but we neither should nor can know it for certain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concerning Rebaptism in Luther’s Works</cite>, Vol. 40: Church and Ministry II, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 40 (Philadelphia: Fortress Press, 1999), 239–41.</span></figcaption>

Neither the baptizer nor the baptized can maintain his position, for both are uncertain of their faith, or at least are in constant peril and anxiety. For it happens, indeed it is so in this matter of faith, that often he who claims to believe does not at all believe; and on the other hand, he who doesn’t think he believes, but is in despair, has the greatest faith. So this verse, “Whoever believes,” does not compel us to determine who has faith or not. Rather, it makes it a matter of every man’s conscience to realize that if he is to be saved he must believe and not pretend that it is sufficient for a Christian to be baptized. For the verse does not say, “Whoever knows that he believes, or, if you know that anyone believes,” but it says, “Whoever believes.” Who has it, has it. One must believe, but we neither should nor can know it for certain.”

— Martin Luther, Concerning Rebaptism in Luther’s Works, Vol. 40: Church and Ministry II, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 40 (Philadelphia: Fortress Press, 1999), 239–41.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+the+third+place%2C+it+is+said%2C+as+I+also+have+read%2C+that+they+base+their+faith+on+this+verse%2C+%E2%80%9CHe+who+believes+and+is+baptized+will+be+saved%E2%80%9D+%5BMark+16%3A16%5D.+This+they+interpret+to+mean+that+no+man+should+be+baptized+before+he+believes.+I+must+say+that+they+are+guilty+of+a+great+presumption.+For+if+they+follow+this+principle+they+cannot+venture+to+baptize+before+they+are+certain+that+the+one+to+be+baptized+believes%2C+How+and+when+can+they+ever+know+that+for+certain%3F+Have+they+now+become+gods+so+that+they+can+discern+the+hearts+of+men+and+know+whether+or+not+they+believe%3F+If+they+are+not+certain+if+they+believe%2C+why+then+do+they+baptize%2C+since+they+contend+so+strenuously+that+faith+must+precede+baptism%3F+Are+they+not+contradicting+themselves+when+they+baptize+without+being+certain+if+faith+is+there+or+not%3F+For+whoever+bases+baptism+on+faith+and+baptizes+on+chance+and+not+on+certainty+that+faith+is+present+does+nothing+better+than+he+who+baptizes+him+who+has+no+faith.+For+unbelief+and+uncertain+belief+are+one+and+the+same+thing%2C+and+both+are+contrary+to+the+verse%2C+%E2%80%9CWhoever+believes%2C%E2%80%9D+which+speaks+of+a+sure+faith+which+they+who+are+to+be+baptized+should+have.+You+say%2C+I+know%2C+that+he+confesses+that+he+believes%2C+etc.+Dear+sir%2C+confession+is+neither+here+nor+there.+The+text+does+not+say%2C+%E2%80%9CHe+who+confesses%2C%E2%80%9D+but+%E2%80%9CHe+who+believes.%E2%80%9D+To+have+his+confession+is+not+to+know+his+faith.+With+all+your+reasoning+you+cannot+do+justice+to+this+verse+unless+you+also+know+he+has+faith%2C+since+all+men+are+liars+and+God+alone+knows+the+heart.+So+whoever+bases+baptism+on+the+faith+of+the+one+to+be+baptized+can+never+baptize+anyone.+Even+if+you+baptized+a+person+a+hundred+times+a+day+you+would+not+at+all+know+if+he+believes.+Why+then+do+you+carry+on+with+your+rebaptizing%2C+since+you+contradict+yourself+and+baptize+when+you+are+not+sure+that+faith+is+present%2C+and+yet+you+teach+that+faith+must+most+certainly+be+present.+This+verse%2C+%E2%80%9CWhoever+believes%2C%E2%80%9D+altogether+opposes+their+rebaptizing%2C+since+the+verse+speaks+of+a+certain+faith.+They+base+their+rebaptizing+on+an+uncertain+faith%2C+and+in+not+a+syllable+do+they+follow+the+meaning+of+the+verse.+I+say+the+same+thing+about+the+baptized+one+who+receives+or+grounds+his+baptism+on+his+faith.+For+he+is+not+sure+of+his+own+faith.+I+would+compare+the+man+who+lets+himself+be+rebaptized+with+the+man+who+broods+and+has+scruples+because+perhaps+he+did+not+believe+as+a+child.+So+when+next+day+the+devil+comes%2C+his+heart+is+filled+with+scruples+and+he+says%2C+Ah%2C+now+for+the+first+time+I+feel+I+have+the+right+faith%2C+yesterday+I+don%E2%80%99t+think+I+truly+believed.+So+I+need+to+be+baptized+a+third+time%2C+the+second+baptism+not+being+of+any+avail.+You+think+the+devil+can%E2%80%99t+do+such+things%3F+You+had+better+get+to+know+him+better.+He+can+do+worse+than+that%2C+dear+friend.+He+can+go+on+and+cast+doubt+on+the+third%2C+and+the+fourth+and+so+on+incessantly+%28as+he+indeed+has+in+mind+to+do%29%2C+just+as+he+has+done+with+me+and+many+in+the+matter+of+confession.+We+never+seemed+able+to+confess+sufficiently+certain+sins%2C+and+incessantly+and+restlessly+sought+one+absolution+after+the+other%2C+one+father+confessor+after+the+other.+Just+because+we+sought+to+rely+on+our+confession%2C+as+those+to+be+baptized+now+want+to+rely+on+their+faith.+What+is+the+end+result%3F+Baptizing+without+end+would+result.+All+this+is+nonsense.+Neither+the+baptizer+nor+the+baptized+can+base+baptism+on+a+certain+faith.+This+verse+of+Scripture+is+far+more+a+judgment+on+them+than+on+us.+And+these+are+the+people+who+don%E2%80%99t+want+to+trust+the+men+who+are+witnesses+of+their+baptism%2C+but+now+as+men+are+ready+to+trust+themselves+that+they+are+baptized+as+if+they+were+not+men%2C+or+as+if+they+were+more+certain+of+their+faith+than+the+witness+of+Christendom+allows.+So+I+contend+that+if+they+want+to+do+justice+to+this+passage%2C+%E2%80%9CWhoever+believes%2C%E2%80%9D+according+to+their+understanding%2C+they+must+condemn+rebaptism+much+more+earnestly+than+the+first+baptism.+Neither+the+baptizer+nor+the+baptized+can+maintain+his+position%2C+for+both+are+uncertain+of+their+faith%2C+or+at+least+are+in+constant+peril+and+anxiety.+For+it+happens%2C+indeed+it+is+so+in+this+matter+of+faith%2C+that+often+he+who+claims+to+believe+does+not+at+all+believe%3B+and+on+the+other+hand%2C+he+who+doesn%E2%80%99t+think+he+believes%2C+but+is+in+despair%2C+has+the+greatest+faith.+So+this+verse%2C+%E2%80%9CWhoever+believes%2C%E2%80%9D+does+not+compel+us+to+determine+who+has+faith+or+not.+Rather%2C+it+makes+it+a+matter+of+every+man%E2%80%99s+conscience+to+realize+that+if+he+is+to+be+saved+he+must+believe+and+not+pretend+that+it+is+sufficient+for+a+Christian+to+be+baptized.+For+the+verse+does+not+say%2C+%E2%80%9CWhoever+knows+that+he+believes%2C+or%2C+if+you+know+that+anyone+believes%2C%E2%80%9D+but+it+says%2C+%E2%80%9CWhoever+believes.%E2%80%9D+Who+has+it%2C+has+it.+One+must+believe%2C+but+we+neither+should+nor+can+know+it+for+certain.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Concerning+Rebaptism+in+Luther%E2%80%99s+Works%2C+Vol.+40%3A+Church+and+Ministry+II%2C+ed.+Jaroslav+Jan+Pelikan%2C+Hilton+C.+Oswald%2C+and+Helmut+T.+Lehmann%2C+vol.+40+%28Philadelphia%3A+Fortress+Press%2C+1999%29%2C+239%E2%80%9341.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9294aabf54.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9294aabf54.html">Permalink</a><a class="src" href="https://heidelblog.net/2021/01/luther-challenges-the-anabaptist-interpretation-of-mark-1616/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

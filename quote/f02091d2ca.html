<main class="wrap"><figure class="quote" id="q-f02091d2ca" data-kw="">
<blockquote><p>(1.) The divine institution of the Lord’s day, or Christian Sabbath.

First, Put a difference between this and the other six days, even as you put a difference between the bread and wine in the sacrament, and that which is for common use. And that because it is set apart for holy use, by divine institution. For as the seventh day, from the beginning of the creation, until the day of Christ’s blessed resurrection; so our Lord’s day, which is the day of the resurrection, is by divine institution moral. The commandment to keep an holy rest upon the seventh day, after the six days of work (which is the substance of the fourth commandment) remains the same. And this Adam (no doubt by the instinct of uncorrupted nature, which desires a time for God’s honour and solemn worship) knowing that God finished the creation in six days, and rested on the seventh, would have observed; yet it was requisite that the particular day should be by institution, for natural reason could not certainly tell him which day. The Lord of the Sabbath therefore limited it unto the seventh from the creation, until Christ’s resurrection, and then removed it to the day we keep, which is the first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s daily walk in holy security and peace</cite>, (1627; Philadelphia, 1800), pp 85-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>2. Here you say ‘matters of worship,’ before it was ‘in worship’. And even the word ‘worship’ is taken so variously as calls for explication before we determine whether man may appoint matters of worship: For if you will call putting off the hat and reverent gestures in particular and meters, and tunes, and the method and words of the particular prayer or sermon by the name of worship, then man may appoint it.</p></blockquote>

</figure><figure class="quote" id="q-7ae450d63b" data-kw="">
<blockquote><p>Liturgical vestments that distinguished the priest from the community are attested only from the fourth century onward. There are no guidelines or regulations given in the New Testament. Moreover, the early Christian communities did not place themselves in the tradition of the Old Testament priesthood and its cultic dress… As the customary everyday dress changed, the clergy held on to the old style of dress… This older form of dress… served to distinguish the clergy from the other members of the community. In Rome as early as the sixth century it seems that there existed blessings for liturgical vestments. From the ninth century onward prayers were said as the vestments were put on… Liturgical vestments were given ever new allegorical interpretations reflecting salvation history (Rabanus Maurus [780-856] and Amalar of Metz [775-850])… …In the adiaphorist [indifferent] controversy Zwingli, Calvin, the Anabaptists, and Matthias Flacius Illyricus [a Lutheran] and his followers among other things called for doing away with liturgical vestments. As early as the first Zurich Disputation of 1523 Zwingli rejected liturgical vestments; he allowed for them in his work De canone missae epicheiresis, which appeared that same year; finally, toward the end of the year, presumably under external pressure, he adopted a stance against vestments. In the Zurich regulations of 1535 he disapproved of external adornments such as silk, gold and silver in the churches on the grounds that the early church not only did not possess these things, but even rejected them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oxford-encyclopedia-of-the-reformation.html">Oxford Encyclopedia of the Reformation</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Oxford Encyclopedia of the Reformation</cite>, (1996), ‘Clerical Vestments’, vol. 1, pp. 366-68</span></figcaption>

</figure><figure class="quote" id="q-f156f200bc" data-kw="">
<blockquote><p>I think all will-worship is not idolatry: Our Lord, who accused the Pharisees of will-worship, did not accuse them of idolatry… his accusing ministers of idolatry, for using a Service-book in the main right in respect of the worship, and a gesture [kneeling in receiving the Supper] avowed to be only to the true God, in a Church, holding in the main, the right Faith, under a prince that professes the same Faith and worship, and to be a defender of it. As for such relics of pagan customs, or Popish, as yet remain, though it were to be wished they were quite left [off], since they are not used in any honor to the pagan idols, but the original and reason of them at first [such as honor and decency], being almost if not quite forgotten by those that use them, and are become but as civil customs that have no state in [or condition of being] religious worship, experience shows that they are more easily reformed by neglect than by earnest declamations against them. Nor do I think the course this author takes, of seeking reformation by invectives and separations, likely to promote it, but to exasperate rulers and make opposites more violent in their way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England against a book unjustly entitled, A Christian testimony against them that serve the image of the beast</cite>, … (London: E. Cotes, 1667) | Sect. 16. The Crimination of the Ministers, as Idolaters, is not excusable, Ch. 7; pp. 263-64</span></figcaption>

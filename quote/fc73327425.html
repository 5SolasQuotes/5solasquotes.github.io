<main class="wrap"><figure class="quote" id="q-fc73327425" data-kw="">
<blockquote><p>It is a school for acquiring practical wisdom. When we are in eager pursuit of this world’s enjoyments we have no leisure for serious reflection—when we have obtained these our minds are unfitted for it, and, though the price is in our hands, we have no heart to buy wisdom. Adversity has a tendency to sober the mind, disperses the illusions which prosperity had created, and induces thoughtfulness and meditation. He who bears the yoke in his youth sitteth alone and is silent, searches and tries his ways, and applies his heart to wisdom.

Practical wisdom comprehends two things—the knowledge of ourselves and of others, and both of these are most advantageously acquired in adversity.

How ignorant are even good men of themselves before they are put to the trial! How ready to mistake their character, to be deceived as to the motives by which they are actuated, and to overrate their talents and the strength of their principles! How apt to think they are something when they are nothing, and to expose themselves rashly to temptation! Happy was it for Peter that his grand trial was over, and that the secrets of his heart were revealed to him before he was called to take a leading part in the propagation of the gospel, and to appear before kings and rulers for the name of Christ!

It is true we would not be such strangers to ourselves if we listened to faithful counsel, and subjected our hearts to the test of an impartial and rigid self-examination. But still there is no knowledge like to that which is gained by experience, and no experience like that which is the result of tribulation. By encountering hardships we discover where our weakness lies, and in what quarter we are most vulnerable by the shafts of temptation—whether we are in greater danger of failing, in the hour of trial, from love to the world, timidity, a sense of shame, impatience, anger, unbelief, pride, or vainglory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Advantages of Adversity, Illustrated in the History of Joseph in Sermons</cite></span></figcaption>

</figure><figure class="quote" id="q-17e83dc68a" data-kw="">
<blockquote><p>4. They [civil magistrates] may and ought to destroy such books as they [spiritual seducers] use to spread for the infecting of others, and inhibit and stop printing of them, or actual selling, spreading or transporting of them, as they may stop carrying of suspected or forbidden goods. 6. They may and ought to restrain and censure all blasphemous and irreverent expressions and speeches against the majesty of God and His ordinances, and all calumnies and bitterness against faithful ministers or professors that adhere to truth: for, these are moral sins; and blasphemy, calumny, and such like, are no more to be passed over without censure in such, than in others who are not professedly tainted with error: And the pretext of following light and conscience, cannot make these sins tolerable, more than the Nicolaitans [Rev. 2] pretending the same for their committing adultery and other filthiness: And this is not to punish men’s opinions, or force their consciences, but to punish their vices, even such as have been hateful unto and punished by, many natural and heathen men.</p></blockquote>

noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a8697e8299" data-kw="">
<blockquote><p>There were 3 things (most Honourable Sirs!) which Luther did fear would prove to be the Ruin of Religion.

1. Oblivion.

2. Security.

3. Carnal policy: The good God overthrow these in our Land, lest our land be overthrown by these: Though Ministers discover all sorts of sins, and though a Parliament discovers all sorts of plots and dangers, yet people are settled on their Lee’s, they will not see, nor fear, nor humble themselves, nor turn to the Lord at all; O pray, (said a dying man in the beginning of the German reformation) that God would preserve the Gospel … For the Pope and the Council of Trent are hatching of strange things: Ministers say as much and more to people, pray, be humbled, reform; For you see what the bloody Papists have done in Ireland, and you hear what they are plotting against England, we do thus speak and weep, but man will not hearken and obey; They who will not easily see their sins, will as hardly believe their dangers … O that God’s advises (so frequent, so earnest, so and more safe) to humbling and reforming might once be regarded and followed: we shall be safe, if we ever remain impenitent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>England’s Preservation or, A Sermon Discovering the only way to prevent Destroying Judgements: Preached to the Honourable House of Commons at their last Solemn Fast, being on May, 25, 1642</cite>, (London: Samuel Gellibrand, 1642), epistle dedicatory.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

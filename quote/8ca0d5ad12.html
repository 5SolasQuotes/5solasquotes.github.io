<main class="wrap"><figure class="quote" id="q-8ca0d5ad12" data-kw="">
<blockquote><p>For lest we of the people should bogle at coming on the stage to act our late tragedy over again, he [the opponent] would impose it on our beliefs that we are still in the middle act of it and that we ought to finish it. It is high time for him to consider whether if we run along with him in this we should not shut up compassion from our brethren and shut out a great part of our gratitude towards God; although I confess some scars and haltings may remain yet, after the war itself is ended. Methinks he should find everything both in Nature and Christianity more favourable for our present peace than for our third war, especially seeing all our former wars have ended very contrary to the expectation of those who were hottest to begin them. But I consider that passion is the last hold out of which we are beaten, of which the fuller men are, the less do they (through a great judgement on their spirits) perceive into what deformities they do transport them, it being the nature of all intoxications that their defects are better perceived by any than by those who are oppressed by them.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13e6b614f3" data-kw="">
<blockquote><p>Whether they are sure that these superstitions of theirs may not run the round as other superstitions have done before them?… What if the next age should turn them into a dead formality? And what if the next age after that should make laws to enforce them? And then godly people first scruple them, and then fly from them as discerned superstition? And then the worst men be glad of that advantage to persecute those that would not submit to them? By this circulation, if the same men who invented… new and needless Church covenants, etc. could but live two or 300 years, they might come to be among the number of those who cry out of them as superstitious, and suffer persecution because they will not use them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 58, p. 293</span></figcaption>

</figure><figure class="quote" id="q-b92d4c2781" data-kw="">
<blockquote><p>XXVI. …Yet the case may be, and often has been (and whither or no it be ours now [referring to Scotland in 1681], is not mine to determine) that a people may and ought to submit themselves to the government even of such a magistrate who either has injuriously usurped that office, or has so maleversed in the exercise thereof (by violating the main and most of the conditions upon which he was admitted to it) that his government is degenerat[ed] into a manifest tyranny and irreligion, and so has (de jure) fore-faulted his right to rule as a magistrate: I say the case of a people may be so circumstantiate [bound by circumstances], that they ought to subject themselves even to such a tyrant till the Lord clearly point forth to them a way, either from his written Word, or some extraordinary impulse and influence upon their spirits, or from indubitable grounds and persuasives of sound moral principles, or such like, whereby they may emerge from under that yoke. Hereby I do not yield, nor assert, that it is lawful to give obedience to any unlawful commands, or that it is no ways lawful for a people to shake off the yoke of an unlawful and tyrannical government: but only that there may be some cases wherein it is lawful for a people to yield subjection to a lawless tyrant, and wherein it may be unlawful for them to perpetrate or attempt their own liberation by external force (which abstractly from those circumstances might be both lawful, laudable and a necessary duty), viz. when the thing attempted is either altogether impracticable, the means or manner of effectuating it dubious or unwarrantable, the timing of it inexpedient and unseasonable, or the necessary concomitants or consequents of the cure more hurtful or dangerous than the disease; or the like: Neither do I affirm that under a tyrannical government it is always or absolutely lawful for the people to give passive obedience (if such a form of phrase may be admitted which many explode as inaccurate and incongruous) but only that there is a time which may be called the proper season of suffering, that is, when suffering (in opposition to acting or resisting) is a necessary and indispensable duty. XXVII. As a man’s subjecting himself to a private robber assaulting and prevailing against him, is no solid proof of his approving or acknowledging the injury and violence committed by the robber; so in many cases a people or person’s yielding subjection (viz. in matters civil and external, for I always exeem [exempt] conscience and religion from subjection to any creature whatsoever) to a tyrant, i.e. a public robber, does not argue their acknowledging or approving his tyranny and oppression. XXVIII. As it is one thing to be subject to the magistrate for conscience sake [Rom. 13:5] and a far other to subject our conscience to the magistrate, that is, to be subject for his pleasure sake: So although we may lawfully submit our bodies and estates to the civil magistrate, and in many cases also to a tyrant; yet in no case can it be lawful for us to subject our conscience or religion to any magistrate or mortal, God Himself being the immediate and sole Sovereign Lord of both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Banders Disbanded</cite>, (1681), pp. 47-48</span></figcaption>

reign%20Lord%20of%20both" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>No person is exempt by any Law of God from this punishment, be he king, queen, or emperor, he must die the death, for God has not placed them above others, to transgress his laws as they list, but to be subject to them as well as others, and if they be subject to his laws, then to the punishment also, so much the more as their example is more dangerous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-goodman.html">Christopher Goodman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Obedience, Ch. 13, p. 184</span></figcaption>

</figure><figure class="quote" id="q-8bb454fa24" data-kw="">
<blockquote><p>Here be two questions. The first is: whether the tyrant must be removed from his room or not? The second: how, and by whom. Therefore I do not deny but that a wicked magistrate must be put down, but not the same way that thou wilt. No man ought to kill him, nor to stir up war and sedition against him, we must go to work, another manner of way, the matter must be attempted and assayed by lawful means, for God has called us in peace, 1 Corinthians the seventh chapter. The tyrant must be taken away (that do I not deny), for Samuel does depose Saul from his office, and does anoint David king over the people of Israel. Jehoiada puts forth Athalia from the ruledom and makes Joash a king. If then a king be made by the common assent of all the people, and begins to be wicked, let him agayn be put downe with common assent of the people, except they will all be punished with him. And if he be chosen by the consent and election of few princes, let the people signify and show unto them, the wicked and ungodly life of this king, and that it ought to be born or suffered no longer, let them be commanded, that have chosen him, to put him down again. … But first and foremost, the prophets, that is to say, the ministers of God’s Word, must be bold to rebuke the sins and wicked facts of princes and rulers: none other way more commodious to overcome tyrants can be, than if the preachers of the truth do once determine to die, they must put their bodies and lives to jeopardy. … Finally, and last of all, that we thirst for righteousness, that we amend our lives, and change our conditions. For if we be godly and righteous, it is impossible that a tyrant do reign long.</p></blockquote>

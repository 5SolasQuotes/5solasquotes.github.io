<main class="wrap"><figure class="quote" id="q-530a83e50a" data-kw="">
<blockquote><p>Works will come into consideration as a manifestation of genuine saving faith. Work in the scriptural sense also means not just an external display but the expression of one’s life that flows out of the depth of the heart…. Scripture also speaks of reward for believers (“their works follow them,” Rev 14:13; Matt 5:12, 16; 6:1; Luke 6:23; Heb 10:34–38). This reward comes as compensation for the cross, as restitution for what was robbed, as recompense for love shown to the servants of the Lord, etc….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: A System of Christian Theology Single Volume Edition</cite>, 5.293</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works.html">Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1c3699ab9a" data-kw="">
<blockquote><p>5. Good works are no less necessary as they are our walking in the way which leads to heaven. Jesus Christ is the way (John 14:6). Faith and holiness are our walking in Him as the way. This way, accordingly, is called “the way of holiness,” or “the holy way” (Isaiah 35:8), inasmuch as none can walk in Christ other than by faith, and by that holiness of heart and life which is “the obedience of faith.</p></blockquote>

</figure><figure class="quote" id="q-8576419509" data-kw="">
<blockquote><p>Q. 153. What doth God require of us, that we may escape his wrath and curse due to us by reason of the transgression of the law? A. That we may escape the wrath and curse of God due to us by reason of the transgression of the law, he requireth of us repentance toward God, and faith toward our Lord Jesus Christ,[i] and the diligent use of the outward means whereby Christ communicates to us the benefits of his mediation.[k] [i] Acts 20:21. Matt. 3:7,8. Luke 13:3,5. Acts 16:30,31. John 3:16,18. [k] Prov. 2:1-5. Prov. 8:33-36. Q. 154. What are the outward means whereby Christ communicates to us the benefits of his mediation? A. The outward and ordinary means whereby Christ communicates to his church the benefits of his mediation, are all his ordinances; especially the word, sacraments, and prayer; all which are made effectual to the elect for their salvation.[l] [l] Matt. 28:19,20. Acts 2:42,46,47.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Larger Catechism</cite></span></figcaption>

</figure><figure class="quote" id="q-81e5a4dbbd" data-kw="">
<blockquote><p>Calvin rules out this interpretation with sufficient clarity when he denies that Christ gained merit for Himself, and censured the Scholastics who taught that He did. Calvin’s censure would have been completely unwarranted if Christ could have merited reward for Himself in any way at all. He felt that it was enough to show that Christ could not merit reward for Himself as God for God, or as man for man. Calvin just takes it for granted that one nature could not merit reward for the other. And rightfully so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/faustus-socinus.html">Faustus Socinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As quoted in J.V. Fesko, ‘Socinus &amp; the Racovian Catechism on Justification’ being ch. 13 in Michael Parsons, Aspects of Reforming: Theology &amp; Practice in Sixteenth Century Europe</cite>, (Paternoster, 2013)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>
<div class="actions"><button class="copy" data-copy="“Calvin rules out this interpretation with sufficient clarity when he denies that Christ gained merit for Himself, and censured the Scholastics who taught that He did. Calvin’s censure would have been completely unwarranted if Christ could have merited reward for Himself in any way at all. He felt that it was enough to show that Christ could not merit reward for Himself as God for God, or as man for man. Calvin just takes it for granted that one nature could not merit reward for the other. And rightfully so.”

— Faustus Socinus, As quoted in J.V. Fesko, ‘Socinus &amp; the Racovian Catechism on Justification’ being ch. 13 in Michael Parsons, Aspects of Reforming: Theology &amp; Practice in Sixteenth Century Europe (Paternoster, 2013)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCalvin+rules+out+this+interpretation+with+sufficient+clarity+when+he+denies+that+Christ+gained+merit+for+Himself%2C+and+censured+the+Scholastics+who+taught+that+He+did.+Calvin%E2%80%99s+censure+would+have+been+completely+unwarranted+if+Christ+could+have+merited+reward+for+Himself+in+any+way+at+all.+He+felt+that+it+was+enough+to+show+that+Christ+could+not+merit+reward+for+Himself+as+God+for+God%2C+or+as+man+for+man.+Calvin+just+takes+it+for+granted+that+one+nature+could+not+merit+reward+for+the+other.+And+rightfully+so.%E2%80%9D%0A%0A%E2%80%94+Faustus+Socinus%2C+As+quoted+in+J.V.+Fesko%2C+%E2%80%98Socinus+%26+the+Racovian+Catechism+on+Justification%E2%80%99+being+ch.+13+in+Michael+Parsons%2C+Aspects+of+Reforming%3A+Theology+%26+Practice+in+Sixteenth+Century+Europe+%28Paternoster%2C+2013%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F81e5a4dbbd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/81e5a4dbbd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/whether-christ-merited/#:~:text=Calvin%20rules%20out%20this%20interpretation%20with,for%20the%20other.%20And%20rightfully%20so&amp;text=Calvin%20rules%20out%20this%20interpretation%20with%20sufficient%20clarity&amp;text=merit%20reward%20for%20the%20other.%20And%20rightfully%20so" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-71b550412f" data-kw="">
<blockquote><p>We conclude that Holy Scripture does not speak of a reward such as is owed, by a right of hire, on account of worthiness corresponding to the reward; but rather of that which is conferred not upon the idle but upon those who labor, by virtue of covenant and of a gratuitous promise. Hence it is elsewhere also called an inheritance. Nor ought the name “inheritance” to be thought to prevent its being called a “reward”; for even to an adopted son, who has diligently obeyed his adopter and endured many things for his sake, the inheritance comes by filial right, and yet, in respect of the works he has performed and the afflictions he has undergone, it may be called a reward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gerhard-j-vossius.html">Gerhard J. Vossius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theses on the Merit of Good Works as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith</cite>, … (London: 1655), ch. 3, pp. 375-76, trans. ChatGPT-5 Vossius (1577-1649) was an Arminian professor of history and politics at Amsterdam., p. 76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

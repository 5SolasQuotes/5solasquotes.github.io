<main class="wrap"><figure class="quote" id="q-077bfd575c" data-kw="">
<blockquote><p>…lest the evil one, making use of our natures, should pervert with lascivious and wanton songs; God Himself made us songs, wherein we might both profit and delight. Psalms are the angels’ exercise, the daily practice of blessed saints, the spiritual incense of the host of heaven: the sweet harbor in solitude: the ornament of celebrities, the medicine of sick minds, the mode ratour[?] of affections: an exercise becoming all degrees, all ages, all conditions, since none are either too grave, or too good to praise the Lord. I have not made so large a digression upon this point only to praise these spiritual hymns [God-given psalms], which beyond all commendations, praise themselves to every religious heart and care…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s Soliloquy Containing many comforts for Afflicted Minds. As they were delivered in sundry sermons at Saint Mary’s in Dover (London, 1627) These sermons of the reformed and conforming Anglican, John Reading (c.1587-1667) on Ps. 42:11 contain 42 references to a psalm or psalms. As is seen from below, the few times Reading refers to ‘hymns’, the term refers to psalms from the book of psalms. Note Reading’s interpretation of the early letter of Pliny as referring to the early Christians singing psalms to Christ.</cite>, pp. 30-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-63c4a4c1f1" data-kw="">
<blockquote><p>The oldest of the Conclusions, so far as is known, is that to Psalm 148 [only], which is found in the 1575 edition by Bassandyne, at the very end of the volume… Though the introduction of these compositions is involved in obscurity, it cannot be supposed that they were forced into the Psalm Book against the wishes of the church authorities… It is more conceivable that they were inserted quietly, on the printer’s own responsibility or that of other private parties; and their disappearance from most of the subsequent editions lends countenance to this conjecture. Even those for common metre are wanting in so important an edition of 1615. Very possibly those who had Episcopal leanings had most to do with their first introduction; but the absence of any trace of controversy on the subject warrants the inference that other parties acquiesced, so far at least as to make the use of them a matter of forebearance. It may also be inferred from the state of the psalm books that they were used only to a partial extent till after 1615.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/neil-livingston.html">Neil Livingston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scottish Psalter of 1635 (1864) | ‘3. Conclusions’, pp. 35-37 in II – ‘Appendages to Metrical Psalms’ in Dissertation III, ‘The Literary Materials of the Psalter’</cite>, p. 37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-70334928a3" data-kw="">
<blockquote><p>‘Dost thou wish’, he [the apostle] says, ‘to be cheerful, dost thou wish to employ the day? I give thee spiritual drink;’ for drunkenness even cuts off the articulate sound of our tongue; it makes us lisp and stammer, and distorts the eyes, and the whole frame together. Learn to sing psalms, and thou shalt see the delightfulness of the employment. For they who sing psalms are filled with the Holy Spirit, as they who sing satanic songs are filled with an unclean spirit.</p></blockquote>

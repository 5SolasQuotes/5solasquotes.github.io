<main class="wrap"><figure class="quote" id="q-2553d9b193" data-kw="">
<blockquote><p>I know how difficult it is to persuade the world that God disapproves of all modes of worship not expressly sanctioned by His Word. The opposite persuasion which cleaves to them, being seated, as it were, in their very bones and marrow, is, that whatever they do has in itself a sufficient sanction, provided it exhibits some kind of zeal for the honor of God. But since God not only regards as fruitless, but also plainly abominates, whatever we undertake from zeal to His worship, if at variance with His command, what do we gain by a contrary course? The words of God are clear and distinct: “Obedience is better than sacrifice.” (1 Samuel 15:22) “In vain do they worship me, teaching for doctrines the commandments of men,” (Matthew. 15:9.) Every addition to His word, especially in this matter, is a lie. Mere “will worship” (εθελοθρησκεια) is vanity. This is the decision, and when once the judge has decided, it is no longer time to debate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Reforming the Church</cite>, Humble Exhortation—The Necessity of Reforming the Church (1543).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-c112d7d3a3" data-kw="">
<blockquote><p>Moses was not so well when he was in Midian, as if he had been in Canaan, yet better than when he was in Egypt: for though Jethro had not the worship of God pure in every respect, yet was not he an idolater. For then Moses would not have dwelt with him, nor yet have sacrificed with him, if he had offered to a strange God. Whence we learn two things: The first, that if we have the chief and principal points of religion with us although there may be some wants and defects, yet that we make much of God’s great blessing therein, and labor carefully and diligently to use them, showing ourselves thankful to God for them: so will the Lord in his due time bestow more blessings upon us, and minister that which is wanting unto us. Secondly, that the Lord will always have some to keep his truth, to the glory of his own name, and the condemnation of the wicked. Jethro’s religion may be tried by these notes:

1. That he rejoiced more for the deliverance of God’s people than for the promotion of his son.

2. Because he was careful to confirm his faith by the experience of them which had received greater graces.

3. Because his joy did break out into an open profession of sacrifice.

4. His divine speech and good counsel which he gave to Moses does testify that he was a pure worshipper of God: at the least he held the chiefest, and was not a novice in religion. By Jethro’s example we may learn to try our religion, if it be pure, then: [1.] It works in us a care to use all the means.

2. We take joy in them.

3. We express the fruits of it in our life.

4. We rejoice more at the prosperity of God’s people than at our own preferments or commodity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of</cite>, … Richard Greenham… (d. 1594?; London: Welby, 1612), pt. 4, ‘Godly Instructions’, ch. 66, ‘Of God’s Worship, &amp; of Religion True &amp; False’, p. 803</span></figcaption>

</figure><figure class="quote" id="q-30fb86e05a" data-kw="">
<blockquote><p>Section 5. Note that things not determined of God [for public worship] and left to the determination of men must be such as are necessary in genere, and not things idle and superfluous. A superior may not institute a superfluous thing that is not simply evil, though sometimes the inferior may lawfully obey therein; or to speak more properly, [the inferior may] lawfully do the thing to avoid inconvenience, or to testify respect to the superior, though in that particular he has no lawful power to command. Note also, that of things necessary in genere, the superior may not lawfully determine for such species, as, though not simply evil, may have a tendency to evil or be evil in the consequence, when he may determine that which will not be evil in the consequence. Yet the inferior may obey, or rather observe the thing commanded, when the evil consequence of non-observance will be greater than the evil consequence of observance. Section 6. If superiors command that which is above their sphere to command [for public worship], namely, things not necessary in genere [by its kind], yet if they be not simply evil, subjects may¹ do those things, unless they be evil in their consequence to a higher degree than the not doing of them would be.² In this case it is not formal obedience,³ but they are done for the end’s sake and to avoid evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of the Reverend &amp; Learned Mr. John Corbet</cite>, Of Divine Worship… in The Remains of the Reverend &amp; Learned Mr. John Corbet… (London: Thomas Parkhurst, 1684), pt. 3 Corbet (d. 1680) was an English, congregationalist puritan.</span></figcaption>

<blockquote><p>About receiving the Lord’s Supper with inconvenient ceremonies and persons in differing doctrine: Peter Martyr, when he came into England first, and the opinion of the corporal presence of Christ in the Lord’s Supper was in force, and when the ministers, albeit differing from him in judgment, yet did not refuse to admit him with open confession of [the] contrary judgment, he joined with them and received the Lord’s Supper, Non obstantibus illorum ceremonijs sibilicet ipsi molestis, ‘notwithstanding the ceremonies, though very much troubling him.’ This counsel did P. Martyr give to [Zachary] Ursinus and to other Christians in Germany; Ursinus, Exercitat., lib 2, fol. 840.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘Reformed Practices’, p. 162</span></figcaption>

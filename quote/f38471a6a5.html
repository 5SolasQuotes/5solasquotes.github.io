<main class="wrap"><figure class="quote" id="q-f38471a6a5" data-kw="">
<blockquote><p>The first [topic of discussion] is about the imputed righteousness of Christ. This righteousness of Christ, in his active and passive obedience, hath been asserted by Protestant divines, to be not only the procuring and meritorious cause of our justification; for this the Papists own; but the matter; as the imputation of it is the form of our justification: though I think that our logical terms are not so adapted for such divine mysteries.

But whatever propriety or impropriety be in such school terms, the common Protestant doctrine hath been, that a convinced sinner seeking justification, must have nothing in his eye but this righteousness of Christ, as God proposeth nothing else to him; and that God in justifying a sinner, accepts him in this righteousness only, when he imputes it to him.

Now, about the imputed righteousness of Christ some say, “That it belongs only to the person of Christ: he was under the law, and bound to keep it for himself; that he might be a fit Mediator, without spot or blemish. That it is a qualification in the Mediator, rather than a benefit acquired by him, to be communicated to his people.” For they will not allow “this personal righteousness of Christ to be imputed to us any otherwise than in the merit of it, as purchasing for us a more easy law of grace; in the observation whereof they place all our justifying righteousness:” understanding hereby “our own personal inherent holiness, and nothing else.” They hold, “That Christ died to merit this of the Father, to-wit that we might be justified upon easier terms under the gospel, than those of the law of innocency. Instead of justification by perfect obedience, we are now to be justified by our own evangelical righteousness, made up of faith, repentance, and sincere obedience.”

And if we hold not with them in this, they tell the world we are enemies to evangelical holiness, slighting the practice of all good works, and allowing our hearers to live as they list. Thus they slander the preachers of free grace, because we do not place justification in our own inherent holiness; but in Christ’s perfect righteousness, imputed to us upon our believing in him. Which faith, we teach, purifies the heart, and always inclines to holiness of life.

Neither do we hold any faith to be true and saving, that doth not shew itself by good works; without which no man is, or can be justified, either in his own conscience, or before men. But it doth not hence follow that we cannot be justified in the sight of God by faith only, as the apostle Paul asserts the latter, and the apostle James the former, in a good agreement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-traill.html">Robert Traill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Protestant Doctrine Concerning Justification, and of its Preachers and Professors, From the Unjust Charge of Antinomianism. In a Letter from the Author, to a Minister in the Country</cite>, (1692) in The Works of Robert Traill, A.M. Minister of the Gospel in London (4 vols, Edinburgh: J. Ogle, 1810), 1: 257-58.</span></figcaption>

<blockquote><p>Despite its many weaknesses, this earlier work remains a landmark of scholarship in the field… At that time, the only serious attempt to document this development was Ritschl’s Die christliche Lehre von der Rechtfertigung und Versohnung (1870). The value of that work was rather reduced by the moralist assumptions Ritschl brought to his task, and by his decision to limit his analysis from the eleventh to the nineteenth century, focusing particularly on German-language Protestant contributions to the discussion. The vast scholarly undertakings which have given the modern period the magnificent critical editions denied to Ritschl (such as the Weimar Luther edition) have also cast new light on the theology of the medieval period, calling into question many of Ritschl’s conclusions. One of the more troubling aspects of my investigation was the realisation that most of Ritschl’s conclusions, particularly his very unsatisfactory account of Luther’s theological formation, could no longer be sustained.” – McGrath, Iustitia Dei, 3rd ed., Preface, vii, ix-x McGrath, Alister – Iustitia Dei: A History of the Christian Doctrine of Justification 3rd ed. rev. (Cambridge Univ. Press, 2005) 2nd ed.: ToC 1, 2 Kang, Paul C. – Justification: the Imputation of Christ’s Righteousness from Reformation Theology to the American Great Awakening &amp; the Korean Revivals Pre (2006) 160 pp. ToC . On the Early &amp; Medieval Church Book Estrada, Erik – Faith Alone: Debates About Justification Before the Reformation Pre (Fortress Press, 2026) 466 pp. ToC Blurb: “…contrary to the historical outlook of a good number of Catholic and Protestant historians and theologians, there were indeed conflicts within the Great Church (ca. 100-700 CE) over the question ‘After baptism, is faith alone enough to save the orthodox Christian?&#x27;</p></blockquote>

<blockquote><p>Now take both Laws, the Ceremonial Law and the Moral Law or the Decalog. Imagine that by the merit of congruity you have made so much progress that the Spirit has been granted to you and that you have love. Of course, all this would be a monstrosity and cannot be found anywhere in the nature of things. But imagine, I say, that, by doing what lies within you, you acquire grace, are righteous, and have the Spirit. On what basis? On the basis of the merit of congruity? Then you do not need Christ, but He has become useless to you and died to no purpose.</p></blockquote>

<blockquote><p>3. But the word [‘to justify’] is used with that specialized meaning when it concerns the judgment of God as He absolves the sinner who stands before his judgment seat (Ps. 143:2; Rom. 5:16 and 8:33-34). And so this entire act of justification is depicted as a forensic process. Yet we still grant that justification sometimes appears also to include sanctification as its consequence because of the very strong, close connection between the two (Rom. 8:30; Titus 3:7, etc.).</p></blockquote>

<blockquote><p>9 Q. Could you give a more definitive explanation of what the gospel is? A. The gospel, or the good news that delights the heart of the poor condemned sinner, is a revelation of the fatherly and immutable will of God, in which He promised us, who are unworthy, that all our sins have been washed away and pardoned not just for the rest of our lives but, indeed, forever. He carries out this promise by giving His Son to die for us and by raising Him. Since Christ died not in His own sin but in ours (as if He Himself had committed it) and arose out of this same sin as a mighty victor (1 Cor. 15:17), it follows that there is not a single sin of ours for which He has not paid. If even one of all those sins that Christ took upon Himself had not been paid for, He would have had to remain the tomb and could not have risen. For where there is even one sin, there is also eternal death, as God Himself says in Deuteronomy 27. Also, “The wages of sin is death” (Rom. 6[:23]). Since, therefore, Christ arises out of all our sin as a victor in our flesh (which He assumed and forever retains), this is public testimony to us that we are considered as pure and righteous in the eyes of God as Christ Jesus was when He arose from the grave (Rom. 4; 1 Cor. 15:17). Along with that, God through Christ both promises us in the gospel and then actually gives us the Holy Spirit. The Spirit turns our hearts from sin and from the kingdom of the Devil to Himself, bears witness that we are children of God, initiates in us both joy in God and eternal life here below, and brings it to completion in us up in heaven. All of this God freely offers and gives to us in the gospel, without any regard to our past, present, or future merit or piety. He applies it to us by grace through faith, so that whoever boasts, boasts in the Lord (Jer. 9[:24]; 1 Cor. 1[:31]). It can also be described more briefly: the gospel is a revelation of the fatherly and immutable will of God, in which He promises all believers (1) that their sins have been pardoned from eternity and shall be forever forgotten, and (2) that He will freely give them the Holy Spirit and eternal life, without any past, present, or future merit of ours, because of the voluntary sacrifice of this most exalted person, Christ—truly God and truly human. This sacrifice was there before the face of God from eternity, then was promised, and now has been carried out and completed, retaining forever its efficacy for our full redemption (Eph. 1).</p></blockquote>

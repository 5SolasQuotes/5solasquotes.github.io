<blockquote><p>From this influx, it is not surprising that the doctrines of faith and, most especially, that of the new birth became so rapidly corrupted in the churches. With separation from the world spurned, there is no wonder that the sanctity and glory of the gospel was overshadowed, and superstitious practices flooded in along with the unconverted pagans, until, at length, Christian church discipline was remodeled on the fashion of the pagan secular state. Once hypocrites and other unregenerate people began, as it were, to swamp and overwhelm the believers, there soon emerged leaders who were pleased enough to accommodate spiritual doctrines to the prevailing systems of philosophy. And so it came about that faith was neglected, doctrine no longer studied, regeneration equated to the mechanical performance of the rite of baptism, truth and piety no longer defended by any great efforts in the assemblies and councils, the majorities at best indifferent, at worst bitterly hostile, to the total over-shadowing of these essential things. By that time, most of the world had taken up the Christian profession so, at most, everything that had been instituted by Christ had been basely transmuted into another gospel. Strange to tell, it was done without a protest or major split in the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Biblical Theology</cite>, (Soli Deo Gloria 1994), 660 | HT: Gary Johnson.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cebb4ffe52" data-kw="">
<blockquote><p>4. The Fathers erred not so much as many suppose in their ascribing [salvific effects] to baptism. For: 1. Sometime by baptism they mean not only the external ordinance, but the whole work therein to be done; viz. the accepting Christ solemnly in Covenant, and giving up ourselves as a sanctified people to Him, renouncing the flesh, the world and the Devil, and so becoming fully Christians. This is baptism with them, and not the outward sign alone. And what says Peter less, when he says, ‘Baptism saves us,’ and thus expounds himself when he has done? And what say the Fathers more? 2. When they speak of these effects of baptism, they suppose a due recipient or subject, that is, a true believer, or the seed of such: and therefore they oft speak of the inefficacy of the outward baptism to hypocrites. 3. When they speak of the outward ordinance only, the collation which they ascribe to it and all the great effects, are to be understood but by way of obsignation and solemnization, and not solely excluding the internal faith and the Covenant: as actual solemnized marriage gives a woman right to her husband and all that he has, when yet she had a right by secret covenant and contract before. Now common reason and the nature of the thing and many of the contexts showing that the Fathers and Councils must be thus expounded according to these rules, I would fain know how they deserve that heavy accusation that we commonly lay upon them for their judgement in this, or what ground the Papists have to plead them generally for their efficacy ex opere operato [from the work working]? And yet I will not excuse each particular person of them thus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Disputations of Right to Sacraments</cite>, ... (London: Simmons, 1658), 2nd Disputation, pp. 200-201</span></figcaption>

<blockquote><p>Paul, Rom. 4. stands much upon this to prove that justification by faith is not conferred by the sacraments. And from the circumstance of time he gathers that Abraham was first justified and afterward received circumcision, the sign and the seal of his righteousness. Now we know that the general condition of all sacraments is one and the same and that baptism succeeded circumcision. And what can be more plain then the example of Cornelius (Acts 10). who before Peter came to him had the commendation of the fear of God and was indued with the spirit of prayer. And afterward when Peter by preaching opened more fully the way of the Lord, he and the rest received the holy Ghost? And after all this they were baptized. Now if they received the holy Ghost before baptism, then they received remission of sins, and were justified before baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, 611.</span></figcaption>

</figure><figure class="quote" id="q-e695624f3c" data-kw="infants are not to be baptized">
<blockquote><p>Because they baptized Proselytes both Men, Women and Children, must Christians do so too? Sure the Custom of the Romish Church in baptizing of Infants, as a human Tradition, is every way of as good Authority to warrant us so to do, as the Custom of the unbelieving Jews. But pray take what a Learned Pedo-Baptist, and a Son of the Church of England, hath said in answer to this vain Conceit; &#x27;tis Sir Norton Knatchbull, in his Animadversiones in lib. Novi Testamenti, pag. 313. Ac cum videam summi judicii viros in his temporibus ex Rabbinis fundamenta petere veritatis, &amp;c. But when I see in these times some Men of the greatest Judgment to fetch the Foundation of Truth from the Rabbins, I cannot but stick at it: for whence was the Talmud sent to us, (they are the words (saith he) of Buxtorf in his Synagoga Judaica) that we should give so, much Credit thereto, that we should believe that the Mosaic Law either was or ought to be understood therefrom, much less the Gospel, to which they are professed Enemies?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-keach.html">Benjamin Keach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pedo-Baptism Disproved</cite></span></figcaption>

</figure><figure class="quote" id="q-7ed806c3ce" data-kw="">
<blockquote><p>The earliest known example of a Catechetical work is the “Teaching of the Twelve Apostles,” which Athanasius names among the “books not included in the Canon, but appointed by the Fathers to be read by those who are just recently coming to us, and wish to be instructed in the word of godliness (κατηχεῖσθαι τὸν τῆς εὐσεβείας λόγον).” This use of the Didache for the instruction of recent converts from Paganism agrees with its original purpose as stated in the longer title, “Teaching of the Lord through the Twelve Apostles for the Gentiles.” The first six chapters are evidently adapted for those who need elementary instruction, more particularly for Catechumens of Gentile descent, as distinct from Jewish candidates for Baptisms. The remaining chapters of the Didaché relate chiefly to the administration of Baptism, to Prayer, Fasting, and the services of the Lord’s Day, and to the celebration of the Agape and Eucharist. This same division of subjects is observed in the two classes of S. Cyril’s Catechetical Lectures: the first class, including the Procatechesis, consists of XIX Lectures addressed to candidates for Baptism, and these are followed by five “Mystagogic” Lectures, so called as being explanations of the Sacramental Mysteries to the newly-baptized.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-hamilton-gifford.html">Edward Hamilton Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Catechetical Lectures of S. Cyril: Introduction,” in S. Cyril of Jerusalem, S. Gregory Nazianzen</cite>, ed. Philip Schaff and Henry Wace, vol. 7, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Christian Literature Company, 1894), xii.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The earliest known example of a Catechetical work is the “Teaching of the Twelve Apostles,” which Athanasius names among the “books not included in the Canon, but appointed by the Fathers to be read by those who are just recently coming to us, and wish to be instructed in the word of godliness (κατηχεῖσθαι τὸν τῆς εὐσεβείας λόγον).” This use of the Didache for the instruction of recent converts from Paganism agrees with its original purpose as stated in the longer title, “Teaching of the Lord through the Twelve Apostles for the Gentiles.” The first six chapters are evidently adapted for those who need elementary instruction, more particularly for Catechumens of Gentile descent, as distinct from Jewish candidates for Baptisms. The remaining chapters of the Didaché relate chiefly to the administration of Baptism, to Prayer, Fasting, and the services of the Lord’s Day, and to the celebration of the Agape and Eucharist. This same division of subjects is observed in the two classes of S. Cyril’s Catechetical Lectures: the first class, including the Procatechesis, consists of XIX Lectures addressed to candidates for Baptism, and these are followed by five “Mystagogic” Lectures, so called as being explanations of the Sacramental Mysteries to the newly-baptized.”

— Edward Hamilton Gifford, “The Catechetical Lectures of S. Cyril: Introduction,” in S. Cyril of Jerusalem, S. Gregory Nazianzen, ed. Philip Schaff and Henry Wace, vol. 7, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Christian Literature Company, 1894), xii.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+earliest+known+example+of+a+Catechetical+work+is+the+%E2%80%9CTeaching+of+the+Twelve+Apostles%2C%E2%80%9D+which+Athanasius+names+among+the+%E2%80%9Cbooks+not+included+in+the+Canon%2C+but+appointed+by+the+Fathers+to+be+read+by+those+who+are+just+recently+coming+to+us%2C+and+wish+to+be+instructed+in+the+word+of+godliness+%28%CE%BA%CE%B1%CF%84%CE%B7%CF%87%CE%B5%E1%BF%96%CF%83%CE%B8%CE%B1%CE%B9+%CF%84%E1%BD%B8%CE%BD+%CF%84%E1%BF%86%CF%82+%CE%B5%E1%BD%90%CF%83%CE%B5%CE%B2%CE%B5%CE%AF%CE%B1%CF%82+%CE%BB%CF%8C%CE%B3%CE%BF%CE%BD%29.%E2%80%9D+This+use+of+the+Didache+for+the+instruction+of+recent+converts+from+Paganism+agrees+with+its+original+purpose+as+stated+in+the+longer+title%2C+%E2%80%9CTeaching+of+the+Lord+through+the+Twelve+Apostles+for+the+Gentiles.%E2%80%9D+The+first+six+chapters+are+evidently+adapted+for+those+who+need+elementary+instruction%2C+more+particularly+for+Catechumens+of+Gentile+descent%2C+as+distinct+from+Jewish+candidates+for+Baptisms.+The+remaining+chapters+of+the+Didach%C3%A9+relate+chiefly+to+the+administration+of+Baptism%2C+to+Prayer%2C+Fasting%2C+and+the+services+of+the+Lord%E2%80%99s+Day%2C+and+to+the+celebration+of+the+Agape+and+Eucharist.+This+same+division+of+subjects+is+observed+in+the+two+classes+of+S.+Cyril%E2%80%99s+Catechetical+Lectures%3A+the+first+class%2C+including+the+Procatechesis%2C+consists+of+XIX+Lectures+addressed+to+candidates+for+Baptism%2C+and+these+are+followed+by+five+%E2%80%9CMystagogic%E2%80%9D+Lectures%2C+so+called+as+being+explanations+of+the+Sacramental+Mysteries+to+the+newly-baptized.%E2%80%9D%0A%0A%E2%80%94+Edward+Hamilton+Gifford%2C+%E2%80%9CThe+Catechetical+Lectures+of+S.+Cyril%3A+Introduction%2C%E2%80%9D+in+S.+Cyril+of+Jerusalem%2C+S.+Gregory+Nazianzen%2C+ed.+Philip+Schaff+and+Henry+Wace%2C+vol.+7%2C+A+Select+Library+of+the+Nicene+and+Post-Nicene+Fathers+of+the+Christian+Church%2C+Second+Series+%28New+York%3A+Christian+Literature+Company%2C+1894%29%2C+xii.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7ed806c3ce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7ed806c3ce.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/08/catechism-and-catechesis-in-the-early-church/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

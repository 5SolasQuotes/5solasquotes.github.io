<blockquote><p>Do not thou cruelly destroy the image of God. Thou angerest thy Maker, when thou killest his image. Consider with thyself, that thou art sorry for an image of brass. Now it is evident to all men what difference there is betwixt a thing that is dead, and that which hath life and a reasonable soul. Moreover, it is an easy matter instead of one brasen image to set up more: but it is unpossible to restore one hair to them that once are slain. Finally, murder is clean contrary to the nature of man. For man cherisheth himself, and flesh destroyeth not itself, but preserveth and nourisheth itself so much as it may. But all we men, as many as live, are of one lump, and of the same substantial flesh: and to kill a man therefore is against man’s nature.

Furthermore, all men are the children of one father, of one stock, and of the same progeny: murder therefore is directly against civil humanity, and is a plague that reigns among men. And doth not the Lord our Redeemer also require charity of all men, which must so abound, that we may not stick to die for our neighbour? To kill our neighbour, therefore, is flatly repugnant to christian religion. And take this by the way too; that the blood of man, shed by murder, crieth out of the earth to heaven for revengement: for to Cain, when he had slain his brother, it was said, “The voice of thy brother’s blood crieth out of the earth, and is come up to me.” For bloodshed verily polluteth and maketh the ground accursed whereon it is shed, and is not cleansed again, nor easily appeased, until it do also drink the guilty blood of them which spilt before the guiltless blood of innocents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly and Learned Sermons, Divided into the Five Decades Containing the Chief and Principal Points of Christian Religion</cite>, trans. H. I. ed. Thomas Harding (1587; 4 vols, Cambridge: The Parker Society, 1849-52), 1: 306-07.</span></figcaption>

<blockquote><p>In form this crying and sighing is that amid your trial you do not call God a tyrant, an angry judge, or a tormentor, but a Father—even though the sighing may be so faint that it can hardly be felt. By contrast the other crying is very great and is felt very strongly, when in genuine terror of conscience we call God wicked, cruel, an angry tyrant, and a judge. For then it seems that God has forsaken us and that He wants to banish us to hell. That is how the saints often complain the psalms (Ps. 31:22, 12): “I am driven far from Thy sight”; “I have become like a broken vessel.” This is certainly not a sigh that says: “Father”; it is the roar of hatred for God that cries loudly: “Harsh judge, cruel tormentor!” Now it is time to turn your eyes away from the Law, from works, and from your own feelings and conscience, to lay hold of the Gospel, and to depend solely on the promise of God. Then there is emitted a little sigh, which silences and drowns out that violent roaring; and nothing remains in your heart but the sigh that says: “Abba! Father! However much the Law may accuse me, and sin and death may terrify me, nevertheless Thou, O God, dost promise grace, righteousness, and eternal life through Christ.” And so the promise produces the sigh that cries: “Father!</p></blockquote>

<blockquote><p>The proof here of is evident if Christ’s words be weighed in the nineteenth Chapter of S. Matthew’s gospel. For when the Pharisees asking him a question, whether it were lawful for a man to put away his wife for every cause, received answer that it was not, and thereupon said unto him, Why did Moses then command to give a bill of divorcement and to put her a way: Our Saviour said unto them; Moses suffered you because of the hardness of your heart to put away your wives: But from the beginning it was not so. And I say unto you, that, whosoever shall put away his wife, except it be for whoredom, and shall marry another, doth commit adultery: and who so marrieth her that is put away, doth commit adultery.

Now in this sentence, the clause of exception [except it be for whoredom] doth argue that he commiteth not adultery, who, having put away his wife for whoredom marrieth another.

But he must needs commit it in doing so unless the band of marriage be loosed and dissolved. For who so marrieth another as long as he is bound to the former, is an adulterer. The band then of marriage is loosed &amp; dissolved between that man and wife who are put asunder and divorced for whoredom.

And if the band beloosed, the man may marry another: seeing it is written Art thou loosed from a wife? If thou marry thou sinnest not. Therefore it is lawful for him who hath put away his wife for whoredom to marry another.

This argument doth firmly and necessarily conclude the point in question, if the first part &amp; proposition of it be proved to be true. For there is no controversy of any of the rest: being all grounded on such undoubted principles of scripture &amp; reason, that our adversaries themselves admit and grant them all.

The first they deny to wit that the clause of exception in Christ’s speech [except it be for whoredom] doth argue that the man committeth not adultery, who, having put away his wife for whoredom, marrieth another. And to overthrow this proposition, they do bring sundry answers and evasions. The best of all which as Bellarmine avoucheth, is, that those words [except it be for whoredom] are not an exception. For Christ (saith he) meant those words [except for whoredom] not as an exception, but as a negation. So that the sense is whosoever shall put away his wife. except for whoredom; that is to say without the cause of whoredom, &amp; shall marry another doth commit adultery. Whereby it is affirmed that he is an adulterer who having put away his wife without the cause of whoredom, marrieth another: but nothing is said touching him who marrieth another, having put away his former wife for whore dome. In deed this evasion might have some colour for it, if these words of Christ [except it be for whoredom] were not an exception.

But neither hath Bellarmine ought that may suffice for the proof hereof and the very text of the Scripture it self is soe clear against him, that he must of necessity give over his hold. For the principal pillar wherewith he under propseth it, is S. Austin’s judgment, who hath so expounded it in his first book touching adulterous marriages: Now of that treatise S. Austin saith himself in his retractations I have written two books touching adulterous marriages, as near as I could according to the scriptures being desirous to open and loose the knots of a most difficult question. Which whether I have done so that no knot is left therein, I know not: nay rather I perceive that I have not done it perfectly, and thoroughly, although I have opened many creeks thereof, as whosoever readeth with judgment may discern. S. Augustin then acknowledgeth that there are some wants &amp; imperfections in that work which they may see who read with judgment.

And whether this that Bellarmine doth allege out of it, deserve not to fall within the compass of that censure I appeal to their judgment who have eyes to see: For S. Augustin thought that the word in the original of S. Matthew’s gospel, had, by the Proper signification of it, imported a negation rather then an exception. As he sheweth by saying that where the common Latin translation hath [except for whoredom] in the Greek text it is rather read without the cause of whoredom. Supposing belike (whether by slip of memory or rather oversight) that the same words, which were used before in the fifth Chapter of S. Matthew’s Gospel to the same purpose, were used also in this place: whereas here they differ, and are well expressed by that in the Latin by which S. Austin thought they were not so well. Howbeit, if they had been the same with the former: yet neither so might Bellarmine allow his opinion: considering that the common Latin translation (which Papists by there Council of Trent are bound to stand to under pain of curse) expresseth those likewise as a plain exception.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A defence of the judgment of the Reformed churches. That a man may lawfully not only put away his wife for her adultery, but also marry another. Wherein both Robert Bellarmine the Jesuits Latin treatise, and an English pamphlet of a nameless author maintaining the contrary are confuted by John Raino</cite>, (Dordrecht: George Walters, 1609), pp 2-4.</span></figcaption>

estion%2C+if+the+first+part+%26+proposition+of+it+be+proved+to+be+true.+For+there+is+no+controversy+of+any+of+the+rest%3A+being+all+grounded+on+such+undoubted+principles+of+scripture+%26+reason%2C+that+our+adversaries+themselves+admit+and+grant+them+all.%0A%0AThe+first+they+deny+to+wit+that+the+clause+of+exception+in+Christ%E2%80%99s+speech+%5Bexcept+it+be+for+whoredom%5D+doth+argue+that+the+man+committeth+not+adultery%2C+who%2C+having+put+away+his+wife+for+whoredom%2C+marrieth+another.+And+to+overthrow+this+proposition%2C+they+do+bring+sundry+answers+and+evasions.+The+best+of+all+which+as+Bellarmine+avoucheth%2C+is%2C+that+those+words+%5Bexcept+it+be+for+whoredom%5D+are+not+an+exception.+For+Christ+%28saith+he%29+meant+those+words+%5Bexcept+for+whoredom%5D+not+as+an+exception%2C+but+as+a+negation.+So+that+the+sense+is+whosoever+shall+put+away+his+wife.+except+for+whoredom%3B+that+is+to+say+without+the+cause+of+whoredom%2C+%26+shall+marry+another+doth+commit+adultery.+Whereby+it+is+affirmed+that+he+is+an+adulterer+who+having+put+away+his+wife+without+the+cause+of+whoredom%2C+marrieth+another%3A+but+nothing+is+said+touching+him+who+marrieth+another%2C+having+put+away+his+former+wife+for+whore+dome.+In+deed+this+evasion+might+have+some+colour+for+it%2C+if+these+words+of+Christ+%5Bexcept+it+be+for+whoredom%5D+were+not+an+exception.%0A%0ABut+neither+hath+Bellarmine+ought+that+may+suffice+for+the+proof+hereof+and+the+very+text+of+the+Scripture+it+self+is+soe+clear+against+him%2C+that+he+must+of+necessity+give+over+his+hold.+For+the+principal+pillar+wherewith+he+under+propseth+it%2C+is+S.+Austin%E2%80%99s+judgment%2C+who+hath+so+expounded+it+in+his+first+book+touching+adulterous+marriages%3A+Now+of+that+treatise+S.+Austin+saith+himself+in+his+retractations+I+have+written+two+books+touching+adulterous+marriages%2C+as+near+as+I+could+according+to+the+scriptures+being+desirous+to+open+and+loose+the+knots+of+a+most+difficult+question.+Which+whether+I+have+done+so+that+no+knot+is+left+therein%2C+I+know+not%3A+nay+rather+I+perceive+that+I+have+not+done+it+perfectly%2C+and+thoroughly%2C+although+I+have+opened+many+creeks+thereof%2C+as+whosoever+readeth+with+judgment+may+discern.+S.+Augustin+then+acknowledgeth+that+there+are+some+wants+%26+imperfections+in+that+work+which+they+may+see+who+read+with+judgment.%0A%0AAnd+whether+this+that+Bellarmine+doth+allege+out+of+it%2C+deserve+not+to+fall+within+the+compass+of+that+censure+I+appeal+to+their+judgment+who+have+eyes+to+see%3A+For+S.+Augustin+thought+that+the+word+in+the+original+of+S.+Matthew%E2%80%99s+gospel%2C+had%2C+by+the+Proper+signification+of+it%2C+imported+a+negation+rather+then+an+exception.+As+he+sheweth+by+saying+that+where+the+common+Latin+translation+hath+%5Bexcept+for+whoredom%5D+in+the+Greek+text+it+is+rather+read+without+the+cause+of+whoredom.+Supposing+belike+%28whether+by+slip+of+memory+or+rather+oversight%29+that+the+same+words%2C+which+were+used+before+in+the+fifth+Chapter+of+S.+Matthew%E2%80%99s+Gospel+to+the+same+purpose%2C+were+used+also+in+this+place%3A+whereas+here+they+differ%2C+and+are+well+expressed+by+that+in+the+Latin+by+which+S.+Austin+thought+they+were+not+so+well.+Howbeit%2C+if+they+had+been+the+same+with+the+former%3A+yet+neither+so+might+Bellarmine+allow+his+opinion%3A+considering+that+the+common+Latin+translation+%28which+Papists+by+there+Council+of+Trent+are+bound+to+stand+to+under+pain+of+curse%29+expresseth+those+likewise+as+a+plain+exception.%E2%80%9D%0A%0A%E2%80%94+John+Rainolds%2C+A+defence+of+the+judgment+of+the+Reformed+churches.+That+a+man+may+lawfully+not+only+put+away+his+wife+for+her+adultery%2C+but+also+marry+another.+Wherein+both+Robert+Bellarmine+the+Jesuits+Latin+treatise%2C+and+an+English+pamphlet+of+a+nameless+author+maintaining+the+contrary+are+confuted+by+John+Raino%2C+%28Dordrecht%3A+George+Walters%2C+1609%29%2C+pp+2-4.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa49a2c7086.html&amp;via=5Solas" target="_blank" rel="noopener"> </figure><figure class="quote" id="q-57c738a3a2" data-kw="">
<blockquote><p>Let your affection, then, be drawn out by us more and more as we nearly say to you what Ruth said to Naomi. We came here to become the same body with you. And as your God is our God, your people will from now on also be our people, your laws will be our laws, and your interests our interests. Where you live we will live; where you die we will die and we will be buried in your tombs. Love us, then, as your brothers and your countrymen, and kindly look down on our weaknesses. We were born in a climate that doesn’t give to everyone the wise, discreet and restrained temperament that yours gives to you. Put up with us, for as it is proper that we should conform ourselves as much as is possible to your prudence, we also hope that you in fairness will not hold against us all of our weaknesses.</p></blockquote>

</figure><figure class="quote" id="q-eaaa519a7b" data-kw="">
<blockquote><p>All decays in Religion begin in individual persons, though it extend it self unto families, and so the infection spreads unto greater societies, Ecclesiastical and National. For such also is the order in the genuine progress of the power of Religion whereunto it is opposed. The testimony that God gave unto Abraham was, that keeping the way of the Lord himself, he taught and commanded his Children and household after him so to do.

And if the living power of Godliness expressed in the History of Christ, and the Gospel in an holy Conversation, be not preserved in Individual Persons; the Profession of the purest Religion in Churches, or the highest Pretence unto it in Publick, National Acts are neither useful to the Souls of men, nor do any way tend unto the Glory of God. And the sole use of all outward Religious Order and Profession is lost, where they are not applied unto the Ingenerating and promoting of Holiness, or Evangelical Obedience in particular Persons.

Wherefore if any Revival of the Power of Religion in the World may be yet hoped for; if any stop may be put unto the Fatal Declension, which it suffers under, the forming and restoring of the Principles of it in the Hearts and Consciences of such Persons is the way whereby it must be attempted; from and by them must it be diffused into Families, and greater Societies: Here must all Reformation begin, or in the use of means suited thereunto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law Unsealed: or, A Practical Exposition of the Ten Commandments With a Resolution of Several Momentous Questions and Cases of Conscience</cite>, (Glasgow: Robert Sanders, 1676), unpaginated.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-e2f1c48fa2" data-kw="">
<blockquote><p>Verse 30. ‘When they had sung a hymn,’ etc. A hymn is a verse sung for the praise of God. Their opinion doth not seem to be vain who think that the apostles at that time sung a great hymn which consists of six Psalms: 113, 114, 115, 116, 117, and 118. The Hebrews certainly sing this song in the night of the Passover after the lamb is eaten. Paulus Burgensis thinks that the Apostles rehearsed this hymn, according to the custom of the Jews, after the Passover, and that this place is to be understood of that, which is very probable, for since in other things it is manifest that Christ with his apostles observed the rite of the Jews in eating the Passover, it is not unlikely that He might follow them in this also. Grotius saith, learned men think that the hymns were sung by Christ which were wont to be sung at the Passover, as the 114, and those that follow, but he seems to be of another opinion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the New Testament, Philological &amp; Theological</cite>, (London: 1650) | on Mt., 26:30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c802b39c4c" data-kw="">
<blockquote><p>I say, we close our prayers ordinarily with praise and glory to the Father, the Son, and the Holy Ghost; because it is warrantable from Scripture-practice, to wit, in blessing; and agreeable to the truth and liberty of Gospel-worship; and yet we refuse it in singing (mark it, not in praising), because, for that exercise, the Lord having instructed us with a sufficient plenty of Divine composures, we think it neither needful nor acceptable that we should gratify an arbitrary imposition in receiving the supplement of a human addition: It is true, the words are Scriptural, but can you say that the Scripture bears any such allowance for their use in singing as it doth for the Psalms of David? Yea and many other spiritual songs in Scripture, whereof you might indeed with some reason reprehend our too great disuse:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect., p. 279-80</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

,reason%20reprehend%20our%20too%20great%20disuse&amp;text=I%20say%2C%20we%20close%20our%20prayers%20ordinarily%20with&amp;text=with%20some%20reason%20reprehend%20our%20too%20great%20disuse" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-685145a5ee" data-kw="">
<blockquote><p>Thirdly, he expresseth the matter to be sung in three words, the very titles which are given to David’s Psalms and other scriptural songs: and though there be some difference among interpreters about the kind of songs, which are expressed by every one of those in particular, yet the most received and probable opinion is that by ‘psalms’ are meant all holy songs in general of whatsoever argument, whether they contain prayers, praises, complaints, deprecations, prophecy, history, or a purpose mixed of all those; and by ‘hymns’ are meant special songs of praise to God; and by ‘songs’, a certain kind of hymns, expressing the praises of God for some of his noble acts, great and wonderful beyond others. And those ‘songs’ he calleth ‘spiritual’ (which epithet is to be extended to the psalms and hymns also), as being framed by the Spirit of God, containing spiritual and heavenly purpose, and requiring the assistance of God’s Spirit and a spiritual frame of heart for singing them aright; and this in opposition to the obscene, filthy, and fleshly songs of carnal men and drunkards. … 2. That we may go about this worship of singing praises to God acceptably, it is necessary that we be filled with the Spirit and have a rich and copious measure of his presence and assistance, though not to compose new songs: for he pointeth at scriptural songs, as the most fitting purpose to be sung, under the titles of “psalms, hymns, and spiritual songs;” yet that we may be enabled to choose the fittest songs for the present occasion, and sing them with such a spiritual, elevated frame of heart, as such a divine and heavenly piece of worship requireth; for he saith, “be filled with the Spirit, speaking to yourselves in psalms and hymns and spiritual songs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Exposition of the Epistles of Paul to the Galatians, Ephesians, Philippians, Colossians, and Thessalonians</cite>, (1656-1674; London, 1841), p. 239 &amp; 365 | On Eph. 5:19, p. 239</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

— James Fergusson, A Brief Exposition of the Epistles of Paul to the Galatians, Ephesians, Philippians, Colossians, and Thessalonians (1656-1674; London, 1841), p. 239 &amp; 365 | On Eph. 5:19, p. 239">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThirdly%2C+he+expresseth+the+matter+to+be+sung+in+three+words%2C+the+very+titles+which+are+given+to+David%E2%80%99s+Psalms+and+other+scriptural+songs%3A+and+though+there+be+some+difference+among+interpreters+about+the+kind+of+songs%2C+which+are+expressed+by+every+one+of+those+in+particular%2C+yet+the+most+received+and+probable+opinion+is+that+by+%E2%80%98psalms%E2%80%99+are+meant+all+holy+songs+in+general+of+whatsoever+argument%2C+whether+they+contain+prayers%2C+praises%2C+complaints%2C+deprecations%2C+prophecy%2C+history%2C+or+a+purpose+mixed+of+all+those%3B+and+by+%E2%80%98hymns%E2%80%99+are+meant+special+songs+of+praise+to+God%3B+and+by+%E2%80%98songs%E2%80%99%2C+a+certain+kind+of+hymns%2C+expressing+the+praises+of+God+for+some+of+his+noble+acts%2C+great+and+wonderful+beyond+others.+And+those+%E2%80%98songs%E2%80%99+he+calleth+%E2%80%98spiritual%E2%80%99+%28which+epithet+is+to+be+extended+to+the+psalms+and+hymns+also%29%2C+as+being+framed+by+the+Spirit+of+God%2C+containing+spiritual+and+heavenly+purpose%2C+and+requiring+the+assistance+of+God%E2%80%99s+Spirit+and+a+spiritual+frame+of+heart+for+singing+them+aright%3B+and+this+in+opposition+to+the+obscene%2C+filthy%2C+and+fleshly+songs+of+carnal+men+and+drunkards.+%E2%80%A6+2.+That+we+may+go+about+this+worship+of+singing+praises+to+God+acceptably%2C+it+is+necessary+that+we+be+filled+with+the+Spirit+and+have+a+rich+and+copious+measure+of+his+presence+and+assistance%2C+though+not+to+compose+new+songs%3A+for+he+pointeth+at+scriptural+songs%2C+as+the+most+fitting+purpose+to+be+sung%2C+under+the+titles+of+%E2%80%9Cpsalms%2C+hymns%2C+and+spiritual+songs%3B%E2%80%9D+yet+that+we+may+be+enabled+to+choose+the+fittest+songs+for+the+present+occasion%2C+and+sing+them+with+such+a+spiritual%2C+elevated+frame+of+heart%2C+as+such+a+divine+and+heavenly+piece+of+worship+requireth%3B+for+he+saith%2C+%E2%80%9Cbe+filled+with+the+Spirit%2C+speaking+to+yourselves+in+psalms+and+hymns+and+spiritual+songs.%E2%80%9D%0A%0A%E2%80%94+James+Fergusson%2C+A+Brief+Exposition+of+the+Epistles+of+Paul+to+the+Galatians%2C+Ephesians%2C+Philippians%2C+Colossians%2C+and+Thessalonians+%281656-1674%3B+London%2C+1841%29%2C+p.+239+%26+365+%7C+On+Eph.+5%3A19%2C+p.+239&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F685145a5ee.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/685145a5ee.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=Thirdly%2C%20he%20expresseth%20the%20matter%20to,psalms%20and%20hymns%20and%20spiritual%20songs&amp;text=Thirdly%2C%20he%20expresseth%20the%20matter%20to%20be%20sung&amp;text=yourselves%20in%20psalms%20and%20hymns%20and%20spiritual%20songs" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6d7d3409b4" data-kw="">
<blockquote><p>And doubtless, as the people of God under the Old Testament, and we under the New, ought to use David’s Hymns of Prayer and Praise, as an Ordinance of God in his public worship;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-long.html">Thomas Long</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation Concerning the Frequent Use of our Lord’s Prayer in the public Worship of God and a view of what hath been said by Mr</cite>, [John] Owen concerning that subject (London, 1658), pp. 40-1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-bb319eb0b3" data-kw="">
<blockquote><p>But he is not satisfied that in the Christian Assemblies, in the apostles’ times there were no manner of forms. Who says there were not? There was a form of sound doctrine (which the apostle tells us of), there were Psalms, Hymns, and spiritual Songs in forms, they are the three titles of David’s Psalms; we have nothing to do with any thing but forms of prayer, made by some particular ministers, or Church officers, to be used by all other ministers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Supplement to a Little Book Entitled, A Reasonable Account why some Pious Nonconforming ministers cannot judge it lawful for them to perform their ministerial acts in public solemn prayer, ordinarily, by the prescribed forms of others</cite>, A Supplement to a Little Book Entitled, A Reasonable Account why some Pious Nonconforming ministers cannot judge it lawful for them to perform their ministerial acts in public solemn prayer, ordinarily, by the prescribed forms of others… (London, 1680), Section 1, p. 92. Collinges was an English presbyterian; he is writing against a conforming defender of Anglicanism.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But he is not satisfied that in the Christian Assemblies, in the apostles’ times there were no manner of forms. Who says there were not? There was a form of sound doctrine (which the apostle tells us of), there were Psalms, Hymns, and spiritual Songs in forms, they are the three titles of David’s Psalms; we have nothing to do with any thing but forms of prayer, made by some particular ministers, or Church officers, to be used by all other ministers.”

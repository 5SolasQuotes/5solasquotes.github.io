<blockquote><p>Hence we may perceive how astonishing it is that a person (Faustus Socinus) who, with respect to other matters, spoke very highly of the privileges of reason, in this one point, relating to the knowledge of God, where its influence is more plainly discernable, should ascribe nothing to it – His opinion was, that we cannot have the least idea of the supreme Being from the light of nature …</p></blockquote>

<blockquote><p>[The Socinian Biddle asks] Q. Doth the Scripture account Christ to be the Son of God because he was eternally begotten out of the divine essence, or for other reasons agreeing to him only as a man? Rehearse the passages to this purpose. A. Luke 1:30, 32, 34, 35; John. 10:36; Acts 13:32, 33; Rev. 1:5; Col. 1:18; Heb. 1:4, 5, 5:5; Rom. 8:29. [Owen Replies]…

1. Distinction of persons (it being an infinite substance) doth no way prove difference of essence between the Father and the Son. Where Christ, as mediator, is said to be another from the Father or God, spoken personally of the Father, it argues not in the least that he is not partaker of the same nature with him. That in one essence there can be but one person may be true where the substance is finite and limited, but hath no place in that which is infinite. …

2. Distinction and inequality in respect office in Christ doth not in the least take away equality and sameness with the Father in respect of nature and essence. A son of the same nature with his father, and therein equal to him, may in office be his inferior, his subject. … Q. 9. We are come to the head of this discourse, and of Mr B.’s design in this chapter, and, indeed, of the greatest design that he drives in religion, namely, the denial of the eternal deity of the Son of God; which not only in this place directly, but in sundry others covertly, he doth invade and oppose. His question is, “Doth the Scripture account Christ to be the Son of God because he was eternally begotten out of the divine essence, or for other reasons agreeing to him only as a man? Rehearse the passages to this purpose.” His answer is from Luke 1:31–35; John 10:36; Acts 13:32, 33; Rev. 1:5; Col. 1:18; Heb 1:4, 5, 5:5; Rom. 8:29; most of which places are expressly contrary to him in his design, as the progress of our discourse will discover. This, I say, being the head of the difference between us in this chapter, after I have rectified one mistake in Mr B.’s question, I shall state the whole matter so as to obviate farther labour and trouble about sundry other ensuing queries. For Mr B.’s question, then, we say not that the Son is begotten eternally out of the divine essence, but in it, not by an eternal act of the Divine Being, but of the person of the Father; which being premised, I shall proceed. [Owen quotes Socinians denying the eternal generation of the Son] … I insist somewhat the more on these things, that men may judge the better whether in all probability Mr B., in his “impartial search into the Scripture,” did not use the help of some of them that went before him in the discovery of the same things which he boasts himself to have found out. And this is the first reason which our catechist hath taken from his masters to communicate to his scholars [students] why Jesus Christ is called the “Son of God.” This he and they insist on exclusively to his eternal sonship, or being the Son of God in respect of his eternal generation of the substance of his Father. And these are some of those monstrous figments which, under pretence of bare adherence to the Scripture, our catechist would obtrude upon us: First, Christ is the Son of God; then, growing like God in divine qualities, he is made a God; and so becomes the Son of God. And this, if the man may be believed, is the pure doctrine of the Scripture! And if Christ be a God because he is like God, by the same reason we are all gods in Mr B[iddle]’s conceit, being all made in the image and likeness of God; which, says he, by sin we have not lost. … 1. He who is ἴδιος υἱός, the “proper son” of any, is begotten of the substance of his father. Christ is the proper Son of God, and God he called often ἴδιον Πατέρα, his “proper Father.” He is properly a father who begets another of his substance; and he is properly a son who is so begotten. … he who is properly a son is distinguished from him who is metaphorically so only; for any thing whatever is metaphorically said to be what it is said to be by a translation and likeness to that which is true. Now, if Christ be not begotten of the essence of his Father, he is only a metaphorical Son of God by way of allusion, and cannot be called the proper Son of God, being only one who hath but a similitude to a proper Son; so that it is a plain contradiction that Christ should be the proper Son of God, and yet not be begotten of his Father’s essence. … 4. He who is the Son of God, begotten of his Father by an eternal communication of his divine essence, he is the Son begotten of the essence of the Father; for these terms are the same, and of the same importance. … And this may suffice (without insisting upon what more might be added) for the demonstration of the first assertion, That Christ’s filiation ariseth from his eternal generation, or he is the Son of God upon the account of his being begotten of the essence of his Father from eternity. … 4. That which only manifests the filiation of Christ is not the cause of it. The cause of a thing is that which gives it its being. The manifestation of it is only that which declares it to be so. … To the farther confirmation of this assertion two things are to be annexed:—First, The eversion of that fancy of Episcopius before mentioned, and the rest of the Socinianizing Arminians, that Christ is called the “Son of God,” both on the account of his eternal sonship and also of those other particulars mentioned from him above. Secondly, To consider the texts of Scripture produced by Mr [Biddle] for the confirmation of his insinuation, that Christ is not called the “Son of God” because of his eternal generation of the essence of his Father. … 3. An invincible argument for the sonship of Christ, to be placed only upon the account of his eternal generation, ariseth from this very place that was produced to oppose it! He who is the Son of God because he is “one with the Father,” and God equal to him, is the Son of God upon the account of his eternal relation to the Father: but that such was the condition of Jesus Christ, himself here bears witness to the Jews, although they are ready to stone him for it; and of his not blaspheming in this assertion he convinces his adversaries by an argument a minori, [from the lesser or the minor premise; John 10] verses 34–36.</p></blockquote>

s+purpose.%E2%80%9D+His+answer+is+from+Luke+1%3A31%E2%80%9335%3B+John+10%3A36%3B+Acts+13%3A32%2C+33%3B+Rev.+1%3A5%3B+Col.+1%3A18%3B+Heb+1%3A4%2C+5%2C+5%3A5%3B+Rom.+8%3A29%3B+most+of+which+places+are+expressly+contrary+to+him+in+his+design%2C+as+the+progress+of+our+discourse+will+discover.+This%2C+I+say%2C+being+the+head+of+the+difference+between+us+in+this+chapter%2C+after+I+have+rectified+one+mistake+in+Mr+B.%E2%80%99s+question%2C+I+shall+state+the+whole+matter+so+as+to+obviate+farther+labour+and+trouble+about+sundry+other+ensuing+queries.+For+Mr+B.%E2%80%99s+question%2C+then%2C+we+say+not+that+the+Son+is+begotten+eternally+out+of+the+divine+essence%2C+but+in+it%2C+not+by+an+eternal+act+of+the+Divine+Being%2C+but+of+the+person+of+the+Father%3B+which+being+premised%2C+I+shall+proceed.+%5BOwen+quotes+Socinians+denying+the+eternal+generation+of+the+Son%5D+%E2%80%A6+I+insist+somewhat+the+more+on+these+things%2C+that+men+may+judge+the+better+whether+in+all+probability+Mr+B.%2C+in+his+%E2%80%9Cimpartial+search+into+the+Scripture%2C%E2%80%9D+did+not+use+the+help+of+some+of+them+that+went+before+him+in+the+discovery+of+the+same+things+which+he+boasts+himself+to+have+found+out.+And+this+is+the+first+reason+which+our+catechist+hath+taken+from+his+masters+to+communicate+to+his+scholars+%5Bstudents%5D+why+Jesus+Christ+is+called+the+%E2%80%9CSon+of+God.%E2%80%9D+This+he+and+they+insist+on+exclusively+to+his+eternal+sonship%2C+or+being+the+Son+of+God+in+respect+of+his+eternal+generation+of+the+substance+of+his+Father.+And+these+are+some+of+those+monstrous+figments+which%2C+under+pretence+of+bare+adherence+to+the+Scripture%2C+our+catechist+would+obtrude+upon+us%3A+First%2C+Christ+is+the+Son+of+God%3B+then%2C+growing+like+God+in+divine+qualities%2C+he+is+made+a+God%3B+and+so+becomes+the+Son+of+God.+And+this%2C+if+the+man+may+be+believed%2C+is+the+pure+doctrine+of+the+Scripture%21+And+if+Christ+be+a+God+because+he+is+like+God%2C+by+the+same+reason+we+are+all+gods+in+Mr+B%5Biddle%5D%E2%80%99s+conceit%2C+being+all+made+in+the+image+and+likeness+of+God%3B+which%2C+says+he%2C+by+sin+we+have+not+lost.+%E2%80%A6+1.+He+who+is+%E1%BC%B4%CE%B4%CE%B9%CE%BF%CF%82+%CF%85%E1%BC%B1%CF%8C%CF%82%2C+the+%E2%80%9Cproper+son%E2%80%9D+of+any%2C+is+begotten+of+the+substance+of+his+father.+Christ+is+the+proper+Son+of+God%2C+and+God+he+called+often+%E1%BC%B4%CE%B4%CE%B9%CE%BF%CE%BD+%CE%A0%CE%B1%CF%84%CE%AD%CF%81%CE%B1%2C+his+%E2%80%9Cproper+Father.%E2%80%9D+He+is+properly+a+father+who+begets+another+of+his+substance%3B+and+he+is+properly+a+son+who+is+so+begotten.+%E2%80%A6+he+who+is+properly+a+son+is+distinguished+from+him+who+is+metaphorically+so+only%3B+for+any+thing+whatever+is+metaphorically+said+to+be+what+it+is+said+to+be+by+a+translation+and+likeness+to+that+which+is+true.+Now%2C+if+Christ+be+not+begotten+of+the+essence+of+his+Father%2C+he+is+only+a+metaphorical+Son+of+God+by+way+of+allusion%2C+and+cannot+be+called+the+proper+Son+of+God%2C+being+only+one+who+hath+but+a+similitude+to+a+proper+Son%3B+so+that+it+is+a+plain+contradiction+that+Christ+should+be+the+proper+Son+of+God%2C+and+yet+not+be+begotten+of+his+Father%E2%80%99s+essence.+%E2%80%A6+4.+He+who+is+the+Son+of+God%2C+begotten+of+his+Father+by+an+eternal+communication+of+his+divine+essence%2C+he+is+the+Son+begotten+of+the+essence+of+the+Father%3B+for+these+terms+are+the+same%2C+and+of+the+same+importance.+%E2%80%A6+And+this+may+suffice+%28without+insisting+upon+what+more+might+be+added%29+for+the+demonstration+of+the+first+assertion%2C+That+Christ%E2%80%99s+filiation+ariseth+from+his+eternal+generation%2C+or+he+is+the+Son+of+God+upon+the+account+of+his+being+begotten+of+the+essence+of+his+Father+from+eternity.+%E2%80%A6+4.+That+which+only+manifests+the+filiation+of+Christ+is+not+the+cause+of+it.+The+cause+of+a+thing+is+that+which+gives+it+its+being.+The+manifestation+of+it+is+only+that+which+declares+it+to+be+so.+%E2%80%A6+To+the+farther+confirmation+of+this+assertion+two+things+are+to+be+annexed%3A%E2%80%94First%2C+The+eversion+of+that+fancy+of+Episcopius+before+mentioned%2C+and+the+rest+of+the+Socinianizing+Arminians%2C+that+Christ+is+called+the+%E2%80%9CSon+of+God%2C%E2%80%9D+both+on+the+account+of+his+eternal+sonship+and+also+of+those+other+particulars+mentioned+from+him+above.+Secondly%2C+To+consider+the+texts+of+Scripture+produced+by+Mr+%5BBiddle%5D+for+the+confirmation+of+his+insinuation%2C+that+Christ+is+not+called+the+%E2%80%9CSon+of+God%E2%80%9D+because+of+his+eternal+generation+of+the+essence+of+his+Father.+%E2%80%A6+3.+An+invincible+argument+for+the+sonship+of+Christ%2C+to+be+placed+only+upon+the+account+of+his+eternal+generation%2C+ariseth+from+this+very+place+that+was+produced+to+oppose+it%21+He+who+is+the+Son+of+God+because+he+is+%E2%80%9Cone+with+the+Father%2C%E2%80%9D+and+God+equal+to+him%2C+is+the+Son+of+God+upon+the+account+of+his+eternal+relation+to+the+Father%3A+but+that+such+was+the+condition+of+Jesus+Christ%2C+himself+here+bears+witness+to+the+Jews%2C+although+they+are+ready+to+stone+him+for+it%3B+and+of+his+not+blaspheming+in+this+assertion+he+convinces+his+adversaries+by+an+argument+a+minori%2C+%5Bfrom+the+lesser+or+the+minor+premise%3B+John+10%5D+verses+34%E2%80%9336.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Works+of+John+Owen%2C+21+vol.+ed.+William+H.+Goold+%28Edinburgh%3A+T.+and+T.+Clark%2C+1862%29%2C+12.169%2C+170%2C+171%2C+177%2C+181%2C+182%2C+185%2C+189%2C+190%2C+193%2C+194%2C+198&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F907cf60c39.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/907cf60c39.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/10/john-owen-defended-eternal-generation-against-the-socinians/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

</figure><figure class="quote" id="q-091fe61be9" data-kw="">
<blockquote><p>These things being premised; the Question is not, Whether the scripture may teach some mysteries contrary to right reason? Nor, whether reason may ever oppose itself to the doctrine of the scripture, under pretence of its own rectitude? Nor, whether in investigating the sense of scripture, reason be of great use? For this would be an ambiguous statement of the subject.

But, when we enquire into the meaning of the holy scriptures, the question is, Whether then the dictates of what is accounted right reason, must be first consulted, that it may in the first place determine, concerning the things themselves, whether they be worthy a divine revelation; or, whether we ought simply to attend to what the words, in all their circumstances, properly signify, so that what they are found to mean, may forthwith be received for true, examination, of the things according to pretended axioms of reason?

Or, (more briefly stated) whether it is better to explain the words of scripture so that they may agree with the axioms of reason, or to correct the axioms of reason to that sense which the words of scripture plainly speak? The Socinians contend for the former, and support it by their practice; and I wish they only did so: the Orthodox maintain the latter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on the Use and Abuse of Reason, in Matters of Religion</cite>, trans. John Carter (Norwich: Crouse, Stevenson and Matchett, 1795), pp 6-7.</span></figcaption>

edcovenanter.wordpress.com/2019/05/15/herman-witsius-on-socinian-and-orthodox-approaches-to-reason/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-067a7e2059" data-kw="">
<blockquote><p>And in a special manner, the enmity of the heart against Christ in his priestly office, seems to be hid from the view of most of the hearers of the gospel. Yet there appears to be a peculiar malignity in corrupt nature against that office of his. It may be observed, that the Socinians, these enemies of our blessed Lord, allow him to be properly a Prophet and a King, but deny him to be properly a Priest. And this is agreeable enough to the corruption of our nature; for under the covenant of works, the Lord was known as a Prophet or Teacher, and also as a King or Ruler; but not at all as a Priest: so man knows nothing of the mystery of Christ, as the way to the Father, till it be revealed to him. And when it is revealed, the will riseth up against it; for corrupt nature lies cross to the mystery of Christ, and the great contrivance of salvation, through a crucified Saviour, revealed in the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Human nature in its fourfold state, of primitive integrity, subsisting in the parents of Mankind in paradise. Entire depravation, subsisting in the unregenerate. Begun recovery, subsisting in the regenerate. And consummate happiness or misery, subsisting in all mankind in the future state. In severa</cite>, ed. Michael Boston (1784; United States: The Booksellers, 1787), p. 71.</span></figcaption>

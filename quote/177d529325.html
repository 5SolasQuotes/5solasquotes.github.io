<main class="wrap"><figure class="quote" id="q-177d529325" data-kw="">
<blockquote><p>THE fifth Truth, which our Saviour was willing continually to set before our Eyes by the Celebration of the Eucharist, is, That this Bloody Death of his was the Blessed Means, by which GOD entered into Covenant with Mankind. Moses had said of the Blood he sprinkled upon the People, Behold the Blood of the Covenant which the Lord has made with you, concerning all these words, Exod. 24.8. And Our Saviour plainly opposing his Blood to that, says concerning the Cup, This Cup is the New Covenant (or Testament) in my Blood, which is shed for the remission of your Sins.

This Covenant is the greatest and most important Truth of our Religion. By it GOD delivers Men from Hell, and restores them to his Favour and Protection. It is this also displays before us the whole Mystery of our Redemption; as 1. That Man being created Innocent fell into Rebellion against GOD, by listening to the insinuations of the Devil. 2. That though Man deserved to be not only reduced to nothing, from whence the Hand of GOD had raised him at the first, but to be cast into Hell, there to undergo the punishment due to his Disobedience; yet GOD being moved with pity, resolved to forgive all, and make a New Covenant with him.

3. That it was the Will of GOD that his Own Son taking in due time Human Nature upon Him, should be the Person in whose Blood this Covenant was to be Established. 4. That JESUS CHRIST having really shed his Blood, this Covenant was fully ratified and confirmed, and Remission of Sins offered to all that would repent. For that is the thing which is meant by the New Covenant, according as GOD expresses it in Jeremy 31.34. saying, I will forgive their Iniquity and remember their Sin no more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-allix.html">Pierre Allix</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A preparation for the Lord’s Supper</cite>, trans. Paul Lorrain (London: Brab. Aylmer, 1688), pp 28-30.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-05dd0db63e" data-kw="admin">
<blockquote><p>The nature of the things, for since they were still future and prophecies before their fulfillment are wont to be somewhat obscure (at least as to the manner of fulfillment), it is not to be wondered at that at first they were set forth more obscurely and then more clearly, the nearer the time of fulfillment approached. Thus the light increased more and more. There was a progress in revelation: prophet handed on to prophet, and he received the lamp of the gospel by which the church might be illuminated, adding a new measure of light. The same promises are repeated and illustrated. The more the time of fulfillment presses on, the clearer and fuller they become. Before the law given by Moses, the promise was somewhat obscure; from the giving of the law until the times of the prophets less obscure; from the times of the prophets until John the Baptist, clearer; after the preaching of John clear; after the coming of Christ most clear. Thus from the beginning, the Messiah was promised only as the seed of the woman (Gen. 3:15); afterwards as the son of Abraham (Gen. 12:2); to spring from Judah (Gen. 49:10); and in the tribe of Judah from the family of David (2 S. 7:13, 14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.7.V</span></figcaption>

<blockquote><p>VI. The end of the Covenant [of Grace] is the same that is of the general vocation, God’s glory, and the salvation of the Elect.

VII. The subject or object of this proffered Covenant, are all that be called; but properly the Elect only.

This Covenant is proffered to all that are called, but the Elect only enjoy the Promises of the Covenant.</p></blockquote>

</figure><figure class="quote" id="q-9c2b54c1ae" data-kw="">
<blockquote><p>Were all the promises of the covenant, made to Christ; and are they all “in him, yea, and Amen?” Then it follows, that they, in and with him, are freely offered to sinners of mankind in common, who hear the gospel. Reader, Christ and all the precious promises in him, are by Jehovah graciously offered, and in the offer, are directed to thee for thy acceptance. The authentic offer, brings them all within thy reach, and affords thee a Divine, an authoritative warrant, to come as a sinner, and to accept him, and them in him.

Come then, come as thou art; come without delay; come without looking into thy heart, or to thy life, for any good thing to recommend thee; and, upon the warrant of the free, full, and particular offer, so embrace the promises in Christ, as cordially to trust in him, for the performance of them to thy soul. Come, not on the ground of any good disposition wrought in thee, or of any good work done by thee, for these afford thee no right, but, come as a sinner, upon the warrant of the unlimited grant and call of the gospel, and trust in the Lord Jesus, for all the grace of the promise.

After thou hast begun, continue to trust in him. The believer’s turning away his eye from Christ and the covenant, is the cause, why he begins to sink under his pressures. His departing from Christ his living Redeemer, by “an evil heart of unbelief,” issues for ordinary, in his being torn asunder with a thousand anxieties. O beware of disbelieving the promise, of distrusting the grace, of a promising God; lest he measure to thee according to thy opinion of him. Since the spotless righteousness of Jesus Christ, is likewise offered to thee, and since the offer affords thee, an immediate warrant to receive it; O rely on it, for a right to the blessings promised.

Trust with assured confidence, that the promises will he fulfilled to thee, on the ground of that righteousness only, which is thine in offer; and not, on the ground of any works, which thou thyself hast done. Rely not even on thy acts of faith, for a title to the grace of the promise, but wholly on the righteousness, “revealed from faith to faith so shalt thou be an heir of promise, and shalt Christ “reign in life” eternal, “by one, Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 277-78.</span></figcaption>

</figure><figure class="quote" id="q-e69857d634" data-kw="">
<blockquote><p>Paul considered it as involved in what he had already said, and especially in the predictions of the ancient prophets, that it was the will of God that all men should call upon him. This being the case, he argues to prove that it was his will that the gospel should be preached to all. As invocation implies faith, as faith implies knowledge, knowledge instruction, and instruction an instructor, so it is plain that if God would have all men to call upon him, he designed preachers to be sent to all, whose proclamation of mercy being heard, might be believed, and being believed, might lead men to call on him and be saved. This is agreeable to the prediction of Isaiah, who foretold that the advent of the preachers of the gospel should be hailed with great and universal joy. According to this, which is the common and most natural view of the passage, it is an argument founded on the principle, that if God wills the end, he wills also the means; if he would have the Gentiles saved, according to the predictions of his prophets, he would have the gospel preached to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, (Grand Rapids: Eerdmans, 1955), 547.</span></figcaption>

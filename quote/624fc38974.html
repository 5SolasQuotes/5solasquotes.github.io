<main class="wrap"><figure class="quote" id="q-624fc38974" data-kw="">
<blockquote><p>For no man is exempted from an obligation to obey God’s Law because of his own sinful and culpable ignorance, for we speak not now of invincible ignorance of these things which we are not obliged to know or believe. But if our sinful and erroneous conscience free us from actual obligation to be tied by a law, then our erroneous conscience frees us from sinning against a law, and so from punishment, for whatever frees a man from actual obligation, frees him also from actual sinning, for all sin is a doing against a Law-obligation, and if so, then are none to be led by any rule but their own conscience, the written Law and Gospel is not henceforth our rule any more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (1649)</cite>, p. 34</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-72b7111168" data-kw="">
<blockquote><p>Fifth, the last commandment of lust forbids the first motions to sin that are before consent. … Again, the philosophers knew that lust with consent was evil, even by the light of nature. But Paul, a learned Pharisee, and therefore more than a philosopher, knew not lust to be sin that is forbidden in this commandment [Rom. 7:7]. Lust therefore that is forbidden here, is without consent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Advertisement to all Favorers of the Roman Religion</cite></span></figcaption>

</figure><figure class="quote" id="q-84ded9faba" data-kw="">
<blockquote><p>We say, therefore, that temptation which proceeds from an external principle, if it finds nothing in us which inclines to evil or delights in it, cannot have the nature of sin. Thus the Devil could tempt Christ, and present various objects to his eyes and imagination, but he had no power in him, who lacked all vicious inclination. The case is different with our inclination and internal movements, which when the Devil moves, indeed even if they are not moved by the Devil, are nevertheless sins, as we have proved.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3cb4a2f549" data-kw="">
<blockquote><p>Is Christianity private or public? Does the truth about Christ Jesus, who is the object of my faith, depend on my own private beliefs, or is there something verifiable that can be “fact-checked”? The reason I pose these questions is because we are living in a time when the determination of truth and untruth have turned inward, making one’s own personal beliefs the measure of what is true or not. While examining and verifying evidence and testimony may be found in courts of law, in the press and many political and personal interactions it is common to observe persons passing off as truth what are merely their own feelings, opinions, and beliefs, often without evidence or verifiable testimony. The resurrection of Jesus was a very public miracle. Not so with the resurrection of Christ Jesus. The resurrection of Jesus was a very public miracle witnessed by many and supported by evidence at the time it occurred and afterward. The evidence is recorded in Scripture. There are about 5,250 ancient Greek manuscripts of books and parts of the New Testament that record Jesus’ life, death, and resurrection. The earliest is dated to about 90 years after his death (Rylands Library Papyrus 52).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rowlands.html">Daniel Rowlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Fact Checking The Resurrection”</cite>, Jan 31, 2022</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><figure class="quote" id="q-f4b69291f9" data-kw="">
<blockquote><p>To ascertain the true sense of the Scriptures, interpretation is needed. … It is not to be sought by each man&#x27;s private judgment (which is the idia epilysis condemned by Peter), but is to be gathered from the Scriptures themselves as their own best and surest interpreter (Neh. 8:8; Acts 17:11). But for this, after fervent prayer to God, there is need of an inspection of the sources, the knowledge of languages, … collation of passages, … and conformity of the interpretation to the analogy of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.19.18</span></figcaption>

</figure><figure class="quote" id="q-44b94d52cb" data-kw="">
<blockquote><p>Thirdly, I demand of you, how you could so nakedly propound the apostolical directions, patterns and examples of the primitive Churches to walk by (excepting mere circumstances and the rules of the law of nature) and not except withal extraordinary and miraculous, personal and particular, occasional and accidental, temporary and local patterns and examples. I own the Scripture for the rule, rightly understanding it, and in matters of discipline and Church-order profess to walk by it, desiring to be tied to the Scripture patterns, particularly to the patterns of examples and precepts recorded in the New Testament (provided this be understood in essentials and fundamentals of order, in matters of perpetual use, and of a common reason to all times and places); only I add that in some things, where in matter of order and external government there may be no such clear directions either by precept or example, there general rules of the Word, with deductions out of Scripture examples, and from precepts by way of analogy, with rules of common prudence be taken in too. Now the interpretation of this rule (as I have laid it down) being rejected, and the rule simply taken up without such limitations, will produce a wild and strange discipline and Church-order, to practice all things recorded in the Acts of the Apostles and epistles without distinction and difference of those times, persons, places, and ours: and on the other hand to practice nothing but what has a clear example, or precept is strange too, and in so doing, reasonable men cannot become a Church society, nor exercise Church communion. And however in matters of external government and administration of holy things in the visible Church some pretend to this, to practice whatever they find recorded in the Scriptures, and to practice nothing whatsoever they find not there, yet none of the Independents, no not the highest form of them, the Anabaptists, nor the highest sort of Anabaptists (who were called Apostolici [Apostles] from their pretending to imitate the apostles in all things) ever yet have or do practice all patterns and examples recorded in the New Testament, or are contented with them alone, but practice somewhat over and above not particularly recorded in Scripture. I could lay down a catalogue of many particulars specified in the Acts of the Apostles and epistles not practiced in your churches, nor in any churches of the Independent way, as also of many things practiced by you which we never read of in the Scriptures, so that all the Independents are in many things according to the first pattern both defective and excessive. But I refer the full handling of this to a Tractate I intend concerning the Scriptures [which appears to never have been published], How far the Scriptures are a rule for all matters of Church government and order in the visible Church. I add only one thing for the reader’s sake, that they be careful to understand this first principle of yours, not so nakedly as you lay it down in pages 8-11 [of the Independents’ Apology], because it has been, is, and may be a rock to split many on, and an ignis fatuus [elf-fire] to lead many into waters, instead of a sacred pillar of fire to guide to Heaven in a safe way. This foolish imitation of the apostles in all things in matters of external order, has been and is the great foundation of evils on all hands, both in many practices and points of Popery, and amongst the Anabaptists (as I could demonstrate in particulars). Learned Danaeus in his Commentaries upon 1 Tim. ch. 5 [v. 13] speakes of it. Apostolici inter Anabaptist as Schlusselburgius writes also (On the Sect of the Anabaptists), that there is a sort of Anabaptists called Apostolici [Apostles], so named because they professed to imitate the apostles in all things: they washed one another’s feet, they held all things ought to be common, they travailed up and down without staff, shoes, cloak, money, because of Christ’s words, they went up to the tops of houses to preach, because Christ had said, what you have heard in the ear, preach upon the house-top. Now how far the want [lack] of these limitations and distinctions in this your first rule has led some of you into errors and strange practices and may lead you further, as into anointing the sick with oil, baptizing in rivers, etc. I leave you to consider of. But yet this first and great principle upon which you went and reared up your new Church way, how difficult and abstruse a rule, and how doubtful a groundwork do you make it, before you pass from it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644), pp. 75-78</span></figcaption>

+administration+of+holy+things+in+the+visible+Church+some+pretend+to+this%2C+to+practice+whatever+they+find+recorded+in+the+Scriptures%2C+and+to+practice+nothing+whatsoever+they+find+not+there%2C+yet+none+of+the+Independents%2C+no+not+the+highest+form+of+them%2C+the+Anabaptists%2C+nor+the+highest+sort+of+Anabaptists+%28who+were+called+Apostolici+%5BApostles%5D+from+their+pretending+to+imitate+the+apostles+in+all+things%29+ever+yet+have+or+do+practice+all+patterns+and+examples+recorded+in+the+New+Testament%2C+or+are+contented+with+them+alone%2C+but+practice+somewhat+over+and+above+not+particularly+recorded+in+Scripture.+I+could+lay+down+a+catalogue+of+many+particulars+specified+in+the+Acts+of+the+Apostles+and+epistles+not+practiced+in+your+churches%2C+nor+in+any+churches+of+the+Independent+way%2C+as+also+of+many+things+practiced+by+you+which+we+never+read+of+in+the+Scriptures%2C+so+that+all+the+Independents+are+in+many+things+according+to+the+first+pattern+both+defective+and+excessive.+But+I+refer+the+full+handling+of+this+to+a+Tractate+I+intend+concerning+the+Scriptures+%5Bwhich+appears+to+never+have+been+published%5D%2C+How+far+the+Scriptures+are+a+rule+for+all+matters+of+Church+government+and+order+in+the+visible+Church.+I+add+only+one+thing+for+the+reader%E2%80%99s+sake%2C+that+they+be+careful+to+understand+this+first+principle+of+yours%2C+not+so+nakedly+as+you+lay+it+down+in+pages+8-11+%5Bof+the+Independents%E2%80%99+Apology%5D%2C+because+it+has+been%2C+is%2C+and+may+be+a+rock+to+split+many+on%2C+and+an+ignis+fatuus+%5Belf-fire%5D+to+lead+many+into+waters%2C+instead+of+a+sacred+pillar+of+fire+to+guide+to+Heaven+in+a+safe+way.+This+foolish+imitation+of+the+apostles+in+all+things+in+matters+of+external+order%2C+has+been+and+is+the+great+foundation+of+evils+on+all+hands%2C+both+in+many+practices+and+points+of+Popery%2C+and+amongst+the+Anabaptists+%28as+I+could+demonstrate+in+particulars%29.+Learned+Danaeus+in+his+Commentaries+upon+1+Tim.+ch.+5+%5Bv.+13%5D+speakes+of+it.+Apostolici+inter+Anabaptist+as+Schlusselburgius+writes+also+%28On+the+Sect+of+the+Anabaptists%29%2C+that+there+is+a+sort+of+Anabaptists+called+Apostolici+%5BApostles%5D%2C+so+named+because+they+professed+to+imitate+the+apostles+in+all+things%3A+they+washed+one+another%E2%80%99s+feet%2C+they+held+all+things+ought+to+be+common%2C+they+travailed+up+and+down+without+staff%2C+shoes%2C+cloak%2C+money%2C+because+of+Christ%E2%80%99s+words%2C+they+went+up+to+the+tops+of+houses+to+preach%2C+because+Christ+had+said%2C+what+you+have+heard+in+the+ear%2C+preach+upon+the+house-top.+Now+how+far+the+want+%5Black%5D+of+these+limitations+and+distinctions+in+this+your+first+rule+has+led+some+of+you+into+errors+and+strange+practices+and+may+lead+you+further%2C+as+into+anointing+the+sick+with+oil%2C+baptizing+in+rivers%2C+etc.+I+leave+you+to+consider+of.+But+yet+this+first+and+great+principle+upon+which+you+went+and+reared+up+your+new+Church+way%2C+how+difficult+and+abstruse+a+rule%2C+and+how+doubtful+a+groundwork+do+you+make+it%2C+before+you+pass+from+it%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Thomas+Edwards%2C+Antapologia%2C+or%2C+A+Full+Answer+to+the+Apologetical+Narration+of+%5Bthe+Independents%5D+Mr.+Goodwin%2C+Mr.+Nye%2C+Mr.+Sympson%2C+Mr.+Burroughs%2C+Mr.+Bridge%E2%80%A6+%28London%2C+1644%29%2C+pp.+75-78&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F44b94d52cb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/44b94d52cb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/contra-biblicism/#:~:text=Thirdly%2C%20I%20demand%20of%20you%2C%20how,it%2C%20before%20you%20pass%20from%20it&amp;text=Thirdly%2C%20I%20demand%20of%20you%2C%20how%20you%20could&amp;text=you%20make%20it%2C%20before%20you%20pass%20from%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

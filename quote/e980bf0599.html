<blockquote><p>And then for what He suffers in his minister? There He knocks, and says, ‘Open in them.’ And how was He used in the apostles that were after Him, and in the ministers of the Church ever since. What have they endured? for He put a spirit of patience upon them. And what indignities endured they in the primitive Church, that were the publishers of the Gospel, those sweet publishers thereof, drawing men to open to Christ, were killed for preaching.</p></blockquote>

<blockquote><p>2. This Day of Grace is not passed when the sinner sets open the door of his heart that Christ the Lord may enter. That promise is most sure, ‘If any man hear my voice and open the door, I will come into him, and sup with him, and he shall sup with Me,’ Rev. 3:20. Christ complains of the Jews that they would not come to him that they might have life; but if any are made willing to come, the waters of life are open, and none that desire shall be denied them, Rev. 22:17, ‘Let him that is a thirst come, and whoever will, let him drink of the waters of life freely.’ Doest thou know Christ? Art thou acquainted with his kingdom as well as his priesthood? and art thou willing to have his kingdom set up in thy heart, and thy very thoughts and affections brought into obedience and captivity? Art thou willing thus to receive Him? Certainly thou shalt be received by Him and have power to become a child of God, Jn. 1:12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-vincent.html">Nathanael Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Day of Grace in which the Chief of Sinners may be Turned &amp; Healed</cite>, (London: Parkhurst, 1669), ‘The Day of Grace’ on Lk. 19:41-42, pp. 98-99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

Books Online</a></div>
</figure><figure class="quote" id="q-f0c8aa1355" data-kw="">
<blockquote><p>Whereby He signifies that He has long ago looked that they should repent from the bottom of their heart and receive his grace into their heart. Moreover this place does plainly teach us that we cannot rightly receive Christ before He first offer Himself to be received of us. ‘I will enter in unto him and will sup with him, etc.’ The gentleness and mercy of the Lord is marvelous, which so willingly pardons so great injuries done unto Him by his servant, that forgetting all injuries, He does of his own accord offer pardon, and in sign of perfect reconciliation, He will gently come and sup with him. For men are wont by such tokens to renew friendship that is broken between them. But those whom Christ vouchsafes to be partakers of his table (as He vouchsafes all the faithful) He feeds their minds with spiritual dainties, whereby they shall be nourished unto eternal life, namely with righteousness freely given, quietness of conscience, and unspeakable joy, where with the godly are fed by the Holy Ghost, whereof also He has given a most excellent pledge, the holy comunion of his body and blood, which when we receive by faith, we have Him everlastingly dwelling with us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fulke.html">William Fulke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prælections upon the Sacred &amp; Holy Revelation of St. John</cite>, (1573), ch. 3, on verse 20, p. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

<blockquote><p>2… Look yonder on the amiable Jesus Christ (for a marriage between whom and thy precious soul I am now wooing). Do but observe his condescending willingness to be united to thee: That great Ahasuerus courts his own captive Esther. The Potter makes suit to his own clay, woos thee, though He wants [needs] thee not; is infinitely happy without thee, yet is not, cannot be satisfied but with thee. Heark how He commands, entreats, begs thee to be reconciled, 2 Cor. 5:20; Swears and pawns his life upon it, that He desires not thy death, Eze. 33:11; seals his oath with his blood; and if after all this thou art fond of thine own damnation and hadst rather be at an agreement with Hell, than with Him; see how the brinish tears trickle down his cheeks, Lk. 19:41-42. He weeps for thee, that dost not, wilt not weep for thyself: Nay, after all this obdurate obstinacy, is resolved still to wait, that He may be gracious, Isa. 30:18. Stands yet and knocks, though his head be wet with rain, and his locks with the dew of the night; fain He would have thee open the door, that He may be come in and sup with thee, and thou with Him, Rev. 3:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-lye.html">Thomas Lye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Morning Exercise Methodized</cite>, (London: E.M., 1660), Sermon 18, p. 397</span></figcaption>

im%2C%20Rev.%203%3A20" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3a4fd6c2c2" data-kw="">
<blockquote><p>…but as for that which no hypocrite or unsound professor can attain to, a broken, hungry, self-deined heart, that Christ and his grace might enter and dwell there, oh, how harsh is it?… what shall they look for that despise the grace of the Gospel, and that offer which God has honored by so many miracles, and such abundance of sermons, and the powerful ministry of so many preachers? Beware of refusing such salvation, as being a more spiritual wickedness than any moral offense. Thirdly, its reproof to all cavillers that descant upon this free, plain and simple-hearted offer of God. Being urged to receive it, they answer so they would if they knew themselves elected. But (say they) we are afraid God means it us not. If we be chosen, we are sure to be called to believe it: if not, none of their preachers can give it us. It must be God (say they) and not man that must work our hearts and draw us. But, oh vain jangler, tell me, has not God revealed his will in his offer? Dost thou know his secrets? Is not his offer ingenuous? Say not in thine heart, ‘Who shall go up to Heaven or descend, etc? Lo, the Word is in thy mouth, it is neare thee.’ (Dt. 29:19) If Jeremiah in the dungeon had told Ebedmelech [Jer. 38] he knew not whether he meant to help him out or no, and so have refused to come out, had he not justly been left there still? So, when the Lord lets down the ladder of his offer, into thy dungeon, casts thee his cords and rags to put under thy armholes, that He may draw thee out, dost thou cavil and say, ‘Lord, I know not whether thou meanst me well or no; perhaps Thou wilt pull me out a little way, and then let me fall back again; perhaps I am not elected!’ Is not this a woeful dishonor to the simplicity of the offer? Was he ever tied at all to offer it? and dost thou distrust his ingenuous meaning in it? Thy blood be upon thy own head, in that thou choosest rather to smite the Lord to thy own destruction than to set thy foot in his ladder and put on his cords, that thou mightst come out! The way for thee is first to step upward that thou mayst come to the top than to leap to the top at first, to break thy neck backward.</p></blockquote>

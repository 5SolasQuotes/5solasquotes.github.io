</figure><figure class="quote" id="q-99ae3bd781" data-kw="">
<blockquote><p>Answer: 1. The word ‘Church’ usually signifies among Christians a Christian society, or a company of Christians associated for God’s worship and mutual edification; sometime any company of Christians whether so associated or not; sometime those are called ‘Christians’—as distinct from infidels—who profess most of the substance of Christianity but deny some part, or who profess the whole substance or the fundamentals, though they contradict it again by plain consequence in other superadded points, though these, as compared with the orthodox, are wont to be called heretics. We deny not but that the greatest Papists are such Christians, and that as the word ‘Church’ is applicable to combinations or companies consisting of such materials, so far the Romanists are a true Church, supposing that we only speak of metaphysical truth. But as the word ‘Christian’ is taken for one that so holds the fundamentals of Christian faith as not to subvert them by plain consequence after he has professed them, so it is yet under dispute whether the Romanists be a true Church, and therefore not to be taken as granted. However, those Protestant divines that grant them to be a true Church do say that it is but by a metaphysical verity, convertible with the essence; but that morally it is a false Church and not a true one, as a thief is a true man, that is, truly a man, but he is not a true man, that is, not an honest faithful man. 2. The thing called ‘The Church of Rome’ does not consist of homogeneous parts, or at least that word signifies several sorts of persons. There are some that with the Pope and his cardinals entertain the full body of Popery and enslave the rest. There are multitudes of the people that silently live under them and let them alone, and are defiled by them in many things, but receive not the great and most dangerous part of their corruption. These are not equally to be called the ‘Church,’ nor are they equally in danger of damnation. 3. I deny the consequence of the major proposition. For if the Church of Rome be a ‘true Church,’ it is because they are true Christians, and not because they are Papists: so that to argue, ‘The Church of Rome is a true Church, therefore Popery is a safe way to salvation,’ is as unsound as to argue: Gehazi the leper is a living man, therefore the leprosy is a thing safe or profitable to man’s life. Popery is the disease of their Church, and Christianity is what makes them a Church. You may well therefore conclude that Christianity is a safe way to heaven, but not that Popery is so. To the confirmation I answer that the religion of Papists has two parts: the Christian religion, as they are Christians, and that makes them a true Church if they be one; and the Popish corruptions, which denominate them Papists, and that makes them not a true Church, nor is a safe way to salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Safe Religion, or Three Disputations for the Reformed catholic religion against Popery proving that Popery is against the Holy Scriptures, the unity of the catholic Church, the consent of the ancient doctors, the plainest reason and common judgment of sense itself</cite>, ... (London: Miller, 1657), ‘Query: Whether Popery be a safe way to salvation?’, p. 177</span></figcaption>

0way%20to%20salvation&amp;text=Answer%3A%201.%20The%20word%20%E2%80%98Church%E2%80%99%20usually%20signifies%20among&amp;text=Church%2C%20nor%20is%20a%20safe%20way%20to%20salvation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-67eabd86f5" data-kw="">
<blockquote><p>The ordinary [call] is that which is wont to be made by ordinary means; such as was the call of the priests in the Old Testament and of pastors in the New. And this again is either good (inasmuch as it is instituted by God) or evil and corrupt (inasmuch as it has been vitiated by the depraved morals and customs of men), which either absolutely and in every part is so bad that it cannot be reformed, but must be wholly abolished (such as is the call of the Pope and of his cardinals); or only partly, which although somewhat depraved from the fault of men, yet still retains something good from the first institution of God (such as is the call of the Roman bishops).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), 18th Topic, Question 23, p. 216</span></figcaption>

</figure><figure class="quote" id="q-3548a0cd40" data-kw="">
<blockquote><p>Concerning the substance of Christian religion we confess that it is also amongst them [Romanists], but not pure, nor separated not only from chaff and straw, that is, from tolerable abuses, but neither from the venom and poison of false doctrine… It is true that the Church of Rome teaches that there is one God, Father, Son, and Holy Ghost, that for the redemption of mankind, the Son has taken to Himself the nature of man, and in it has expiated our sins by his death, that He was buried, raised from the dead, taken up into heaven, sitting at the right hand of God Almighty: That the Holy Ghost sanctifies us, that there is a Church, a communion of saints, a remission of sins, a resurrection of the flesh, and a life everlasting, that by faith we must rely upon the mercy of God, that by hope we must expect the accomplishment of his promises, by charity love Him. This is indeed the substance of Christian religion which continues so far as the doctrine and outward profession of it [is] in the Church of Rome, in this respect we have not forsaken her, but these considerations make us leave her the title of a Church, to which so far we will always be joined. But what is it that has not been added to corrupt this truth? what strange doctrines have been invented to obscure it? What heresies? what idolatry? what gross sacrilege vent they under the protection of this truth which they profess. These are the causes of our separation from them, if amongst them we could haue enioyed the substance of true religion, without defiling us with their superstition, we had tarried with them still. … …so before the Lord had sounded us a loud summons with his trumpet, ‘Come out of Babylon my people,’ He sustained and supported his people in the midst of Babylon; it was not at that time a sin, but a captivity to abide in it. But for any to abide, or linger in it after the publishing of this summons, it is a sure testimony, that they live not in it unwillingly, but with delight, and that, at least outwardly, they partake of her sins, and so may justly partake of her plagues.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a></span></div>
<div class="actions"><button class="copy" data-copy="“Concerning the substance of Christian religion we confess that it is also amongst them [Romanists], but not pure, nor separated not only from chaff and straw, that is, from tolerable abuses, but neither from the venom and poison of false doctrine… It is true that the Church of Rome teaches that there is one God, Father, Son, and Holy Ghost, that for the redemption of mankind, the Son has taken to Himself the nature of man, and in it has expiated our sins by his death, that He was buried, raised from the dead, taken up into heaven, sitting at the right hand of God Almighty: That the Holy Ghost sanctifies us, that there is a Church, a communion of saints, a remission of sins, a resurrection of the flesh, and a life everlasting, that by faith we must rely upon the mercy of God, that by hope we must expect the accomplishment of his promises, by charity love Him. This is indeed the substance of Christian religion which continues so far as the doctrine and outward profession of it [is] in the Church of Rome, in this respect we have not forsaken her, but these considerations make us leave her the title of a Church, to which so far we will always be joined. But what is it that has not been added to corrupt this truth? what strange doctrines have been invented to obscure it? What heresies? what idolatry? what gross sacrilege vent they under the protection of this truth which they profess. These are the causes of our separation from them, if amongst them we could haue enioyed the substance of true religion, without defiling us with their superstition, we had tarried with them still. … …so before the Lord had sounded us a loud summons with his trumpet, ‘Come out of Babylon my people,’ He sustained and supported his people in the midst of Babylon; it was not at that time a sin, but a captivity to abide in it. But for any to abide, or linger in it after the publishing of this summons, it is a sure testimony, that they live not in it unwillingly, but with delight, and that, at least outwardly, they partake of her sins, and so may justly partake of her plagues.”

— John Cameron, An Examination of those Plausible Appearances which seem most to commend the Romish Church, and to Prejudice the Reformed… (Oxford, 1626), ch. 37, ‘In what sense we yield that the Church of Rome has the substance of true religion, and how she ceases not for all that to be a false Chuch’, pp. 147-50">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConcerning+the+substance+of+Christian+religion+we+confess+that+it+is+also+amongst+them+%5BRomanists%5D%2C+but+not+pure%2C+nor+separated+not+only+from+chaff+and+straw%2C+that+is%2C+from+tolerable+abuses%2C+but+neither+from+the+venom+and+poison+of+false+doctrine%E2%80%A6+It+is+true+that+the+Church+of+Rome+teaches+that+there+is+one+God%2C+Father%2C+Son%2C+and+Holy+Ghost%2C+that+for+the+redemption+of+mankind%2C+the+Son+has+taken+to+Himself+the+nature+of+man%2C+and+in+it+has+expiated+our+sins+by+his+death%2C+that+He+was+buried%2C+raised+from+the+dead%2C+taken+up+into+heaven%2C+sitting+at+the+right+hand+of+God+Almighty%3A+That+the+Holy+Ghost+sanctifies+us%2C+that+there+is+a+Church%2C+a+communion+of+saints%2C+a+remission+of+sins%2C+a+resurrection+of+the+flesh%2C+and+a+life+everlasting%2C+that+by+faith+we+must+rely+upon+the+mercy+of+God%2C+that+by+hope+we+must+expect+the+accomplishment+of+his+promises%2C+by+charity+love+Him.+This+is+indeed+the+substance+of+Christian+religion+which+continues+so+far+as+the+doctrine+and+outward+profession+of+it+%5Bis%5D+in+the+Church+of+Rome%2C+in+this+respect+we+have+not+forsaken+her%2C+but+these+considerations+make+us+leave+her+the+title+of+a+Church%2C+to+which+so+far+we+will+always+be+joined.+But+what+is+it+that+has+not+been+added+to+corrupt+this+truth%3F+what+strange+doctrines+have+been+invented+to+obscure+it%3F+What+heresies%3F+what+idolatry%3F+what+gross+sacrilege+vent+they+under+the+protection+of+this+truth+which+they+profess.+These+are+the+causes+of+our+separation+from+them%2C+if+amongst+them+we+could+haue+enioyed+the+substance+of+true+religion%2C+without+defiling+us+with+their+superstition%2C+we+had+tarried+with+them+still.+%E2%80%A6+%E2%80%A6so+before+the+Lord+had+sounded+us+a+loud+summons+with+his+trumpet%2C+%E2%80%98Come+out+of+Babylon+my+people%2C%E2%80%99+He+sustained+and+supported+his+people+in+the+midst+of+Babylon%3B+it+was+not+at+that+time+a+sin%2C+but+a+captivity+to+abide+in+it.+But+for+any+to+abide%2C+or+linger+in+it+after+the+publishing+of+this+summons%2C+it+is+a+sure+testimony%2C+that+they+live+not+in+it+unwillingly%2C+but+with+delight%2C+and+that%2C+at+least+outwardly%2C+they+partake+of+her+sins%2C+and+so+may+justly+partake+of+her+plagues.%E2%80%9D%0A%0A%E2%80%94+John+Cameron%2C+An+Examination+of+those+Plausible+Appearances+which+seem+most+to+commend+the+Romish+Church%2C+and+to+Prejudice+the+Reformed%E2%80%A6+%28Oxford%2C+1626%29%2C+ch.+37%2C+%E2%80%98In+what+sense+we+yield+that+the+Church+of+Rome+has+the+substance+of+true+religion%2C+and+how+she+ceases+not+for+all+that+to+be+a+false+Chuch%E2%80%99%2C+pp.+147-50&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3548a0cd40.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3548a0cd40.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/is-roman-catholic-baptism-valid/#:~:text=Concerning%20the%20substance%20of%20Christian%20religion,may%20justly%20partake%20of%20her%20plagues&amp;text=Concerning%20the%20substance%20of%20Christian%20religion%20we%20confess&amp;text=and%20so%20may%20justly%20partake%20of%20her%20plagues" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

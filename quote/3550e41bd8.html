<main class="wrap"><figure class="quote" id="q-3550e41bd8" data-kw="">
<blockquote><p>The righteousness with which we are here justified before God, is not our conformity with the law, nor our good works, nor our faith; but it is the satisfaction which Christ rendered to the law in our stead; or the punishment which he endured in our behalf; and therefore the entire humiliation of Christ, from the moment of his conception to his glorification, including his assumption of humanity, his subjection to the law, his poverty, reproach, weakness, sufferings, death, &amp;c., all of which he did willingly; yea, whatever he did and suffered to which he was not bound, as being righteous, and the Son of God, is all included in the satisfaction which he made for us, and in the righteousness which God graciously imputes to us, and all believers. This satisfaction is equivalent to the fulfilling of the law, or to the endurance of eternal punishment for sin, to one or the other of which the law binds all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. G. W. Williard (Elm Street Printing Company, 1888), 327</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-155d6a9197" data-kw="">

</figure><figure class="quote" id="q-685533d1c4" data-kw="necessity satisfaction debt">
<blockquote><p>The satisfaction here discussed is not taken widely for a simple and indiscriminate reparation of injury (as when one purges and excuses himself to him who has suffered injury). Rather it is taken strictly for the payment of a debt, with which is paid what another owes and with which he satisfies the creditor or judge who requires the debt or punishment. Was it necessary for Christ to make satisfaction to divine justice for us? We affirm against the Socinians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.10.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/necessity-of-satisfaction.html">Necessity of Satisfaction</a> › <a href="../topics/priestly-office-satisfaction-and-atonement/necessity-of-satisfaction/why-god-requires-satisfaction.html">Why God requires satisfaction</a></span><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/necessity-of-satisfaction.html">Necessity of Satisfaction</a> › <a href="../topics/priestly-office-satisfaction-and-atonement/necessity-of-satisfaction/justice-and-mercy.html">Justice and mercy</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 14.10.3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20satisfaction%20here%20discussed%20is%20not%20taken%20widely%20for%20a%20simple%20and%20indiscriminate%20reparation%20of%20injury%20%28as%20when%20one%20purges%20and%20excuses%20himself%20to%20him%20who%20has%20suffered%20injury%29.%20Rather%20it%20is%20taken%20strictly%20for%20the%20payment%20of%20a%20debt%2C%20with%20which%20is%20paid%20what%20another%20owes%20and%20with%20which%20he%20satisfies%20the%20creditor%20or%20judge%20who%20requires%20the%20debt%20or%20punishment.%20Was%20it%20necessary%20for%20Christ%20to%20make%20satisfaction%20to%20divine%20justice%20for%20us%3F%20We%20affirm%20against%20the%20Socinians.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2014.10.3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F685533d1c4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/685533d1c4.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-0c22edc0d1" data-kw="">
<blockquote><p>He had undergone, for our sakes, though innocent, the sentence of death. For, in His own Person, He bore the sentence righteously pronounced against sinners by the Law. For He became ‘a curse for us’, according to the Scripture: ‘For cursed is everyone’, it is said, ‘that hangeth on a tree.’ And accursed are we all, for we are not able to fulfil the Law of God: ‘For in many things we all stumble’; and very prone to sin is the nature of man. And since, too, the Law of God says: ‘Cursed is he which continueth not in all things that are written in the book of this Law, to do them,’ the curse, then, belongeth unto us, and not to others. For those against whom the transgression of the Law may be charged, and who are very prone to err from its commandments, surely deserve chastisement. Therefore, He That knew no sin was accursed for our sakes, that He might deliver us from the old curse. For all-sufficient was the God Who is above all, so dying for all; and by the death of His own Body, purchasing the redemption of all mankind. The Cross, then, that Christ bore, was not for His own deserts, but was the cross that awaited us, and was our due, through our condemnation by the Law. For as He was numbered among the dead, not for Himself, but for our sakes, that we might find in Him, the Author of everlasting life, subduing of Himself the power of death; so also, He took upon Himself the Cross that was our due, passing on Himself the condemnation of the Law, that the mouth of all lawlessness might henceforth be stopped, according to the saying of the Psalmist; the Sinless having suffered condemnation for the sin of all.” (commenting on John 19:16–18) “And the title contained a handwriting against us—the curse that, by the Divine Law, impends over the transgressors, and the sentence that went forth against all who erred against those ancient ordinances of the Law, like unto Adam’s curse, which went forth against all mankind, in that all alike broke God’s decrees. For God’s anger did not cease with Adam’s fall, but He was also provoked by those who after him dishonoured the Creator’s decree; and the denunciation of the Law against transgressors was extended continuously over all. We were, then, accursed and condemned, by the sentence of God, through Adam’s transgression, and through breach of the Law laid down after him; but the Savior wiped out the hand- writing against us, by nailing the title to His Cross, which very clearly pointed to the death upon the Cross which He underwent for the salvation of men, who lay under condemnation. For our sake He paid the penalty for our sins. For though He was One that suffered, yet was He far above any creature, as God, and more precious than the life of all.” (commenting on John 19:19)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-cyril-of-alexandria.html">Cyril of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on John</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><figure class="quote" id="q-cec55288b5" data-kw="">
<blockquote><p>Rejection of the errors of those: Who teach that Christ died for each and everyone sufficiently not only with regard to the worth, but even by reason of the intention, or for all conditionally if they believe; or who assert that Scripture teaches that Christ died for all men in general, and particularly that the Scripture passages Ezek. 18:21, etc., and 33:11; John 3:16; I Tim. 2:4; II Pet. 3:9 ought to extend to each and every man, and that the universality of love and grace is proved by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/genevan.html">Donald Davis Grohman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Genevan Reactions to the Saumur Doctrines of Hypothetical Universalism</cite>, Donald D. Grohman, The Genevan Reactions to the Saumur Doctrines of Hypothetical Universalism: 1635-1685 Th.D. diss, (Knox College in cooperation with Toronto School of Theology. 1971), pp. 231-35 For context see ‘Donald Grohman on Dort and the 1649 Genevan Articles’ at Calvin &amp; Calvinism and Grohman.</span></figcaption>

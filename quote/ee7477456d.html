<main class="wrap"><figure class="quote" id="q-ee7477456d" data-kw="">
<blockquote><p>For this end (I mean that we might be coupled &amp; married thus to Christ, and so be certain of salvation &amp; at godly peace with god in our consciences) God hath given his holy word, which hath two parts (as now the children of God do consist of two men) one part of God’s word being proper to the old man, &amp; the other part of God’s word being proper to the new man. The part properly pertaining to the old man is the law: the part properly pertaining to the new man is the gospel.

The law is a doctrine which commandeth &amp; forbiddeth, requiring doing and avoiding. Under it therefore are contained all precepts, threatnings, promises upon conditions of our doing &amp; avoiding &amp;c. The Gospel is a doctrine which always offereth and giveth, requiring on our behalf, not as of worthiness or as a cause but as a certificate unto us, &amp; therefore under it is contained all the free and sweet promises of God: as I am the lord thy God &amp;c.

In those that be of years of discretion, it requireth faith, not as a cause, but as an instrument whereby we our selves may be certain of our good husband Christ, and of his glory: and therefore when the conscience feeleth it self disquieted for fear of God’s judgement against sin, she may in no wise look upon the doctrine pertaining to the old man, but to the doctrine only that pertaineth to the new man, in it not looking for that which it requireth, that is Faith, because we never believe as we should: but only on it which it offereth, which it giveth that is, on God’s grace &amp; eternal mercy and peace in Christ. So shall she be in quiet, when she looketh for it altogether out of herself in God’s mercy in Christ Jesus: in whose lap if she lay her head with saint John, then is she happy and shall find quietness in deed.

When she feeleth her self quiet, then in God’s name let her look on the law &amp; upon such things as it requireth, thereby to bridle and keep down the old Adam, to slay that Goliath, from whom she must needs keep the sweet promises, being the bed wherein her spouse and she meet and lie together, as the wife will keep her bed only for her husband, although in other things she is contented to have fellowship with others, as to speak, sit, eat, drink, go, &amp;c.

So our consciences, which are Christ’s wives, must needs keep the bed, that is, God’s sweet promises, all only for our selves and our husband, there to meet together, to embrace and laugh together, and to be joyful together. If sin, the law, the devil, or any thing would creep into the bed and lie there, then complain to thy husband Christ, and forth with thou shalt see him play Phineas’ part. Thus my dearly beloved, I have given you in few words a sum of all the Divinity which a Christian conscience cannot want.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bradford.html">John Bradford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A fruitful treatise and full of heavenly consolation against the fear of death. Whereunto are annexed certain sweet meditations of the kingdom of Christ, of life everlasting, and of the blessed state &amp; felicity of the same</cite>, (London: William Powell, 1564), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ea1baf7f9a" data-kw="two tables four and six">
<blockquote><p>Some assign five precepts to each table: as Josephus, “Moses brings forward two tables containing ten written precepts, five on each,” whom Philo follows and, of the fathers, Irenaeus. But this is false because Christ comprehends the fifth precept under the second table (Mt. 19:18); and Paul also when he calls it the first commandment of the second table with promise (Eph. 6:2). For in the first table, a promise is given in the second precept. Also the nature of the thing proves it because some are duties of religion towards God (prescribed in the first table), others of love and reverence for superiors (prescribed in the second table).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.5.2</span></figcaption>

<blockquote><p>As for that which they tax the ministers, to be ministers of the dead letter, one may plainly see the Lord’s taking vengeance upon the outrage offered unto his holy Word; smiting them with the spirit of giddiness, for having despised the true and only means of coming unto God, which is the Scripture and the Word of God. In the passage of the Corinthians where Paul says, “The letter kills, and the Spirit quickens;” let any closely consider, against whom the Apostle disputes, and they will understand his drift. It is very evident that Paul in this place, had to do with false Apostles, who preached and extolled the Law without Christ, and caused the people to recoil from salvation purchased by Christ, and the grace of the new covenant, whereunto the Lord had promised to write his Law in the heart of the faithful: the Law then being separated from Christ, as a body without a soul; and nothing comes from it but death, to those that are under it: it does nothing but beat and strike the ears, without quickening the soul, until by faith we are sent from it unto Christ, as from the usher to the master; and then the Law will be found such as David sings it, “The Law of the Lord is perfect, converting the soul; the testimony of the Lord is faithful, making Wise the simple: the commandments of the Lord are right, rejoicing the heart, etc.” Thus must we understand how it is said, “The Letter kills:” Paul called the Law, The killing Letter, and says, The Spirit quickens, i.e., The Ministry of the Gospel, which he opposes unto the naked Law; and he himself calls his preaching “The Ministry of the Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rise, Spring, and Foundation of the Anabaptists</cite>, (1st edition, 1552; English translation 1668), 40-41.</span></figcaption>

<blockquote><p>Having proved it is a Covenant, all the difficulty remaineth in declaring what Covenant it is; for here is much difference of judgements, even with the Learned and Orthodox: and this doth arise from the different places of the Scripture, which, although they be not contrary one to another, yet the weakness of our understandings is many times overmastered by some places:

Some (as you have heard) make it a Covenant of works, others a mixt Covenant, some a subservient Covenant; but I am persuaded to go with those who hold it to be a Covenant of grace: and indeed, it is very easy to bring strong arguments for the affirmative; but then there will be some difficulty to answer such places as are brought for the negative; and if the affirmative prove true, the dignity and excellency of the Law will appear the more. Now, before I come to the arguments, which induce me hereunto, consider in what sense it may be explained, that it is a Covenant of grace.</p></blockquote>

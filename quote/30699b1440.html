<main class="wrap"><figure class="quote" id="q-30699b1440" data-kw="procession Spirit">
<blockquote><p>As generation (gennēsis) is ascribed to the Son, so procession (ekporeusis) is ascribed to the Holy Spirit—taking the word … strictly (inasmuch as it denotes an emanation from the Father and the Son, distinct from the generation of the Son).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.31.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a> › <a href="../topics/the-trinity/the-holy-spirit/procession.html">Procession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7b33af83f5" data-kw="Spirit deity Ananias">
<blockquote><p>The title of God and the attribute of eternal Spirit, given in sacred Scripture, prove that the Spirit in whose name we are baptized is not a quality, grace, or effect. When Peter reproached Ananias for lying to the Holy Spirit, he said that Ananias had lied not to men but to God (Acts 5:4). Paul infers that we are the temple of God because the Spirit dwells in us (1 Cor. 3:16 and 6:19). As Augustine eloquently teaches in Epistle 66, if we were commanded to build a temple for God out of wood and stone, because such worship is due to Him alone, it would clearly argue His divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XXV</span></figcaption>

</figure><figure class="quote" id="q-8d5cf3a7cf" data-kw="Spirit of both Filioque">
<blockquote><p>Scripture teaches that the Spirit proceeds from both the Father and the Son, in passages where He is called the Spirit of both. In Romans 8:9, He is called both the Spirit of God and the Spirit of Christ in the same verse. The Spirit is said to be sent by both the Father and the Son (John 15:26): &quot;The Comforter, whom I will send to you from the Father, the Spirit of truth, who proceeds from the Father.&quot; And in John 16:14: &quot;He will take what is mine and declare it to you.&quot; Reason also supports this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XXVII</span></figcaption>

</figure><figure class="quote" id="q-fdb18aed36" data-kw="Filioque from Son">
<blockquote><p>Although the Greeks ought not to have been charged with heresy on account of their opinion … still the opinion of the Latins may be properly retained as more agreeable to the words of Scripture and the truer. (1) The Holy Spirit is sent from the Son as well as from the Father (Jn. 16:7). He therefore ought to proceed from him because he cannot be sent by the Son unless he proceeds from him. (2) He is called the Spirit of the Son as well as the Father (Gal. 4:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.31.5</span></figcaption>

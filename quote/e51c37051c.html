<main class="wrap"><figure class="quote" id="q-e51c37051c" data-kw="">
<blockquote><p>Tell me the articles of thy faith. I believe in God the Father almighty maker of heaven and earth. etc. Let young men be learned this creed perfectly, and let them say it not with mouth. But have it in their hearts, that they may set all there trust upon God their maker, that both he will and also is able to defend them. Thus it meaneth, almighty God is the maker of all things of heaven of earth of things visible and things invisible. All things that be, have their being of God, for without him nothing is made.

Corn, wine, oil, wool, and all things else, yea the Angels of heaven. All come of god, here we must consider that all these things were created for us. Oh, what a merciful father is this, which hath ordained such things for us so unworthy wretches? what will not he grant us hereafter, what will he deny now to his children? unto elder men and such as be more grown in their faith the mystery of the Trinity must be declared, so much as man’s weakness may comprehend. There is one God which made all things, both that are in heaven &amp; that are in earth. If thou dost trust in God, thou mayst be sure the devil cannot hurt them, much less no mortal creature.

To believe in God, is to have a constant trust in God, and to drive all thine hope in him, all other things and creatures set apart, and that shall cause us to love God truly, other else it is but a feigned &amp; hypocritical love. It followeth in the Creed.

And in Jesus Christ his only son. All mankind was damned utterly for their great and manifold offences, but Christ hath borne upon his Back all our sins satisfying his father for us, and delivering us from everlasting death, that now we should live to our master Christ, whosoever doth inwardly believe this, will conform his life honestly according to the commandments of God, eschewing all manner of vice, so much as in him lieth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-oecolampadius.html">Johann Oecolampadius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon, of John Oecolampadius, to young men, and maidens</cite>, trans. John Foxe (London: Humfrey Powell, 1548), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2bb428b658" data-kw="">
<blockquote><p>Now because lots may say to cards what Naomi said to Boaz, ‘They are near unto us, and of our affinity,’ something also of the use of them. It were no great harm if there were no other cards used than those of clothiers about wool and of mariners in the ship. But as for cards to play with, let us not wholly condemn them, lest lacing our consciences too straight we make them to grow awry on the wrong side. Such recreations are lawful if we use them as Jonathan tasted the honey, putting forth the end of his rod he touched a little of it, and his eyes were cleared. But let us take heed of a surfeit into which those do fall who either play out of covetousness, or for more than their estates can bear, or constantly and continually; all their meat is sauce, all the days in their almanac play-days, though few holy-days. The Creation lasted but a week, but these men’s recreations all the days of their lives; such using of lawful exercises is altogether unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-fuller.html">Thomas Fuller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Collection of Sermons</cite>, … together with Notes upon Jonah (London: Stafford, 1655-1657), on Jonah 1:7, pp. 40-41</span></figcaption>

oks Online</a></div>
</figure><figure class="quote" id="q-7ca521123f" data-kw="">
<blockquote><p>Here is great affinity between an oath, and a lot. Both the one and other serve to end controversies and cause contentions to cease, not easily or conveniently otherwise to be decided. In both, men as it were, renounce themselves and all other creatures and appeal to God’s special providence. In an oath we appeal to God as a wise and righteous witness and judge, knowing what is truth and hating and punishing falsehood and lies. In a lot we appeal to God, as to an absolute Lord, for the disposing of persons and things by his more singular work of providence: unto which alone he that casts the lot referrs himself if he mock not both God and man, wholy renouncing his own wit and skill every way, for the furthering of this chance, event, or lot, rather than that. Some may be and are too scrupulous in both: But a thousand times more are too profanely prodigal of the one and other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Observations Divine &amp; Moral</cite>, … (Amsterdam, 1625), ch. 49, ‘Of Oaths &amp; Lots’, pp. 253-54</span></figcaption>

<blockquote><p>…every pious person is bound in duty to his conscience to have privately his daily devotional exercises, still on this [Lord’s] day above others a holy convocation ought to take place (as was the custom on the Sabbath, Lev. 23:3) in which there may be leisure for devout attention to the reading and hearing of the Word (Heb. 10:25), the celebration of the sacraments (Acts 20:7), the psalms and prayer (Col. 3:16; Acts 1:14), to alms and helo to the poor (1 Cor. 16:2) and in general to all that sacred service pertaining to external and stated worship.</p></blockquote>

<blockquote><p>§50. Yea more, I would not only give men their liberty in this [observing evangelical feast days, which Baxter was not for], but if I lived under a government that peremptorily commanded it, I would observe the outward rest of such a holy day, and I would preach on it, and join with the assemblies in God’s worship on it. Yea I would thus observe the day, rather than offend a weak brother, or hinder any man’s salvation, much more rather than I would make any division in the Church. I think in as great matters as this did Paul condescend when he circumcised Timothy and resolved to eat no flesh while he lived rather than offend his brother, and to become all things to all men for their good. Where a thing is evil but by accident, the greatest accidents must weigh down the less. I may lawfully obey and use the day, when another does unlawfully command it: And I think this is the true case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London, 1659), ch. 2; p. 417</span></figcaption>

<div class="actions"><button class="copy" data-copy="“§50. Yea more, I would not only give men their liberty in this [observing evangelical feast days, which Baxter was not for], but if I lived under a government that peremptorily commanded it, I would observe the outward rest of such a holy day, and I would preach on it, and join with the assemblies in God’s worship on it. Yea I would thus observe the day, rather than offend a weak brother, or hinder any man’s salvation, much more rather than I would make any division in the Church. I think in as great matters as this did Paul condescend when he circumcised Timothy and resolved to eat no flesh while he lived rather than offend his brother, and to become all things to all men for their good. Where a thing is evil but by accident, the greatest accidents must weigh down the less. I may lawfully obey and use the day, when another does unlawfully command it: And I think this is the true case.”

— Richard Baxter, Five Disputations of Church-Government &amp; Worship, (London, 1659), ch. 2; p. 417">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A750.+Yea+more%2C+I+would+not+only+give+men+their+liberty+in+this+%5Bobserving+evangelical+feast+days%2C+which+Baxter+was+not+for%5D%2C+but+if+I+lived+under+a+government+that+peremptorily+commanded+it%2C+I+would+observe+the+outward+rest+of+such+a+holy+day%2C+and+I+would+preach+on+it%2C+and+join+with+the+assemblies+in+God%E2%80%99s+worship+on+it.+Yea+I+would+thus+observe+the+day%2C+rather+than+offend+a+weak+brother%2C+or+hinder+any+man%E2%80%99s+salvation%2C+much+more+rather+than+I+would+make+any+division+in+the+Church.+I+think+in+as+great+matters+as+this+did+Paul+condescend+when+he+circumcised+Timothy+and+resolved+to+eat+no+flesh+while+he+lived+rather+than+offend+his+brother%2C+and+to+become+all+things+to+all+men+for+their+good.+Where+a+thing+is+evil+but+by+accident%2C+the+greatest+accidents+must+weigh+down+the+less.+I+may+lawfully+obey+and+use+the+day%2C+when+another+does+unlawfully+command+it%3A+And+I+think+this+is+the+true+case.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Five+Disputations+of+Church-Government+%26+Worship%2C+%28London%2C+1659%29%2C+ch.+2%3B+p.+417&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F28d71279c5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/28d71279c5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=50.%20Yea%20more%2C%20I%20would%20not,think%20this%20is%20the%20true%20case&amp;text=50.%20Yea%20more%2C%20I%20would%20not%20only%20give&amp;text=And%20I%20think%20this%20is%20the%20true%20case" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

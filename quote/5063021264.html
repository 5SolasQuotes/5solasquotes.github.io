<blockquote><p>On the other hand, the orthodox maintain that this justice is an essential property of God and not merely the effect of his free will. Nevertheless it must be confessed that there is among them some diversity of opinion about the exercise of this justice – some holding it to be necessary, others that it is free and indifferent (viz., such that God can abstain from it if he will).

Hence they think diversely concerning the necessity of the satisfaction. Some maintain that it is only hypothetical (viz., from the hypothesis of the divine will and decree) so that God could not remit sins without a satisfaction; not that his justice would demand this absolutely and necessarily, but because he so decreed (which opinion [William] Twisse follows walking in the footsteps of some of our teachers who spoke with more freedom before Socinus arose).

But others make it absolute, not only depending on the decree, but also taking its rise from the divine justice. But although both agree as to the hinge of the question against the Socinians (who deny the necessity of a satisfaction), still it is certain that the latter opinion (now the most commonly held) is far more efficacious to the strangling of that most pestilent heresy and more in accordance with the nature of God and the words of Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679-85; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 3.19.9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

63021264.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/09/22/francis-turretin-on-differences-among-reformed-divines-on-the-absolute-or-hypothetical-necessity-of-the-atonement/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-14703c5ccd" data-kw="">
<blockquote><p>It is no accident, therefore, that the Reformers presented the Christian life as a life of continuous dissatisfaction with self and of continuous looking afresh to Christ as the ground of all our hope. The effort of [Albrecht] Ritschl to present the Christian life rather as a life of complete satisfaction with self tends not only altogether to undermine the entire evangelical system, but to strike a direct blow at that peace and joy of the Christian which it is his professed object to secure.

For the Christian’s peace and joy are not and cannot be grounded in himself, but in Christ alone. He rejoices in the sufficiency of Christ’s saving work for him; his exultation is in a salvation made his despite his unworthiness of it. This joy obtains its peculiarity precisely from the coexistence of dissatisfaction with self and satisfaction with Christ. The dissatisfaction with self does not mar it; it enhances it rather — because the more dissatisfaction we feel with ourselves the more the greatness of Christ’s salvation is manifest to us, and the more our delight in it waxes.

Transfer the ground of our satisfaction from Christ to ourselves, and all satisfaction becomes at once impossible — except for the shallow souls who can find satisfaction in their own hearts and in the works which proceed from them. We have returned to medieval work-salvation: the very essence of Luther’s revolt turned on his inability to find satisfaction in self. We are not preaching, and Luther did not preach, a lugubrious Christianity, which is always and only preoccupied with shortcomings and failures. Of course the Christian delights in his salvation. Of course he has no impulse to depreciate what he has already received.

Of course his joy is unbounded, and his peace supreme. But this only because — and only on the condition that he understands that — he has not yet “attained”; that what he has received is but the earnest of what is to come; that what he has already done or is now doing is not the ground, and what he already is is not the extent, of his hope. It belongs to the very essence of Christianity that we have not “attained”; and that is the same as saying that sanctification is in progress and there is more to come. The Christian who has stopped growing is dead; or to put it better, the Christian does not stop growing because he is not dead Luther rightly says the Christian is not made but is in the making.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Albrecht Ritschl and his Doctrine of Christian Perfection. Article II: Ritschl the Perfectionist in Princeton Theological Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><figure class="quote" id="q-43abe76116" data-kw="">
<blockquote><p>Though I yield some degree of eﬃcacy in Christ’s death unto all; yet I conceive it far short, both of impetration [legal undertaking and payment of sins] and application of that gracious atonement, which is thereby wrought to the elect of God; whence also it is that I dare not preach the Gospel indifferently unto all, before the Law; nor the worth of Christ, before the need of Christ. Children’s bread is not meet for whelps; and full souls will despise honey-combs.</p></blockquote>

<blockquote><p>VIII. …We acknowledge that Christ died for all; but we deny that by his death salvation and forgiveness of sin is obtained for all men: or that reconciliation is made for Cain, Pharaoh, Saul, Judas, etc. Neither do we think that remission of sins is obtained for anyone whose sins are not remitted; or that salvation was purchased for him, whom God from eternity hath decreed to condemn: for this were a vain purchase… IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: and that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man. Finally, Christ may be said to reconcile all men to God by his death, after the same manner, that we say that the sun doth enlighten the eyes of all men, although many are blind, many sleep, and many are hid in darkness: Because if all and several men had their eyes, and were awake, and were in the midst of the light, the light of the sun were sufficient to enlighten them. Neither is it any doubt but that it may be said, not only that Christ died for all men, but also that all men are saved by Christ, because among men, there is none saved but by Christ: after the same manner that the apostle saith, 1 Cor. 15:20, that ‘all men are made alive by Christ’, because no man is made alive but by Him.</p></blockquote>

st%E2%80%99%2C+because+no+man+is+made+alive+but+by+Him.%E2%80%9D%0A%0A%E2%80%94+Pierre+Du+Moulin%2C+The+Anatomy+of+Arminianism%2C+ch.+27%2C+%E2%80%98How+Far%2C+%26+in+What+Sense+Christ+Died+for+All%3F+The+Opinions+of+the+Parties%E2%80%99+in+The+Anatomy+of+Arminianism%E2%80%A6+%281619%3B+London%2C+1635%29%2C+p.+196+ff.+%7C+Moulin+first+surveys+the+opinions+and+statements+of+the+Arminians+and+then+concludes+the+chapter+with+a+positive+statement+of+his+%28and+others%E2%80%99%29+position%3A%2C+pp.+198-199&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3060066d73.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3060066d73.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=We%20acknowledge%20that%20Christ%20died%20for,is%20made%20alive%20but%20by%20Him&amp;text=We%20acknowledge%20that%20Christ%20died%20for%20all%3B%20but&amp;text=no%20man%20is%20made%20alive%20but%20by%20Him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>For the Kind, we must beware how we put the New Creature in the room of Christ: it is not so available as our blessed Lord Jesus is, who is the only Foundation, on which the Church is built, 1 Cor. 3.10. And able to save to the uttermost, Heb. 7.25. No Creature must be set up in competition with him, for there’s no Salvation in any other, Acts 4.12.

And herein I am afraid the Quakers are guilty of a gross Heresy, who call us from a Christ without us, to a Christ within us: yea, it hath been a dispute in the Plantation, called Pennsylvania, whether we must believe only in a Christ within us, or a Christ both within and without us, and it was carried mostly in the former Sense: But let no man be drawn from placing his entire confidence in Christ the Son of God, both God and Man in one Person, who suffered Death on the Cross, to make atonement for Sinners, and now sits on the right hand of God to make intercession for us.

2. If by a Christ within, they mean that called Light within, either Free will or Natural Conscience, or a power to help our selves without special Grace, its an exploded Error, and it’s to be feared, the Jesuits deliver their Popish stuff out of these men’s Mouths with refined Language. 3. If by Christ within, be meant Christ’s Person in the Believer, that he is Christed or Goded, ’tis blasphemy. 4. If by this expression, Christ within us, the hope of glory, Col. 1.27. or Christ dwelling in our hearts by faith, Eph. 3.17.</p></blockquote>

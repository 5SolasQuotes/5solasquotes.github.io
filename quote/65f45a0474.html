<blockquote><p>Thus, for them [Romanists], the purpose of original righteousness was to restrain the lower appetites in their natural propensity to rebel against reason and incline to material things, and war against the spiritual. In this regard, the Romanists have departed from the teaching of some of the earlier scholastics, who assert without any trouble that which is more in accord with the teaching of the Reformed churches, namely that the lower appetites were created with the intent purpose to be subject to reason and its proper exercise, even considered apart from grace. Thus Durandus…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matt-hedges.html">Matt Hedges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Was Concupiscence Natural to Adam in Pure Nature?’ (2026)</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3fd84ecb2b" data-kw="">
<blockquote><p>Forsomuch then as it appears by most substantial reasons that the corrupt lusts which remain in us after baptism are sins; now it rests that we see unto what kind or part of sins they belong. Sin may seem thus to be divided: that there is one thing, which may be forgiven, and another thing, which cannot. Transgression against the law of God, which is never forgiven, is sin against the Holy Ghost. But if sin may be forgiven, that may be two manner of ways: for either it is so forgiven as we must of necessity altogether depart from it; which we see come to pass in sore and grievous sins, which Paul says do separate us from the kingdom of God, and commonly be called mortal: and those be called small or venial sins, without the which man’s life cannot here be led. [Note in margin: 1 Cor. 6:9, or else be so forgiven, as we depart not from them; partly, through ignorance engrafted in us, and partly, by reason of the infirmity, wherewith we be infected.] [Note in margin: Lust and the first motions motions unto evil, be in their own nature mortal] Paul has put a notable difference between these sins, when he exhorts us that we should not suffer sin to reign in us. (Rom. 6:1) And of this third kind of sins the apostle complained, when he said, ‘O unhappy man that I am! Who shall deliver me from the body of this death? (Rom. 7:24)’ And of these sins do we mean, when we teach, that the works of men, notwithstanding they be godly men, be not without deadly sins; for that we do nothing without this kind of defects. And such kind of defects be deadly, because in their own nature they deserve death: for the reward of sin is death. Further also, for that so long as we carry about with us these blemishes of corruption, we cannot enjoy the life eternal: for so long are we excluded from it, until by death we have put off all corruption. Moreover, it is written; ‘Cursed be every one, which abides not in all the things which are written in the words of this law.’ And he which complains with Paul, that he does not the good which he would, does not perform all the things, which the law requires, nor is not utterly without curse: though the same, through the mercy of God, be not imputed unto him unto eternal destruction. [Note in margin: By the mercy of God they be not imputed to damnation]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

</figure><figure class="quote" id="q-01905efa84" data-kw="">

</figure><figure class="quote" id="q-45aba695e3" data-kw="">
<blockquote><p>…and the ignorance of any questions which may be cleared by God’s Word, is vincible and culpable, for the Law says, ‘The ignorance of these things which we are obliged to know is culpable, and excuses not.’ (Reg. juris Culpabilis est ignorantia rerum quas scire tenemur.) But thirdly, a question of fact is properly a question whether this Corinthian committed incest or no, whether Titus committed murder, or no, and in this there is sometimes invincible ignorance when all diligence morally possible is given to come to the knowledge of the fact.</p></blockquote>

</figure><figure class="quote" id="q-a9c43a6ea8" data-kw="">
<blockquote><p>201. There is in the very essence of the natural power or faculty, besides the vis vel virtus agendi [power or virtue of acting], a certain natural inclination to some things, which is inseparable from it, from which the [Medieval] Schoolmen say even of the will that it is quaedam natura, et pondus animae [a certain nature and gravitation of the soul]. So the soul is inclined or propense (and not only able) to activity as such, to intellection as such, to volition as such; and objectively to truth as such, and to natural good and felicity as such. And there is an inclination of the soul, which is not essential and inseparable, but is much under the power of the will, and may be got and lost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ricahrd-baxter.html">Ricahrd Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology, Plain, Pure, Peaceable... (London: White, 1675), sect. 10, ‘Of Natural &amp; Moral Power as Foreseen’</cite>, pp. 36-37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

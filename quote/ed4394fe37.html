<main class="wrap"><figure class="quote" id="q-ed4394fe37" data-kw="">
<blockquote><p>When God blesseth his elect, with all spiritual blessings in Christ, we need not say, he aims rather at somewhat else then the praise of the glory of his grace: when out of mere grace he made his glorious self known unto us, he made not only his grace known unto us, but all his attributes more or less, which to our understanding are equally glorious in themselves, though we take more comfort in the speculation of his grace; which yet is more wonderful, when we consider his sovereignty over us his creatures, and that it was indifferent to him to make us vessels of wrath, as well as vessels of mercy: and in this very consideration, the very damnation of reprobates shall improve our glorious joys in the apprehension of God’s free love to us at the day of judgement, according to that of the Apostle, Rom. 9. 22.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), pp 37-38.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling.html">Effectual Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-710314ac0a" data-kw="">
<blockquote><p>Together with these external means, serving for drawing on the covenant and going on in it, the common operations of God do concur; common to all the called, both elect and reprobate, and gifts common to both, are bestowed, such as illumination, moral persuasion, historical, dogmatic and temporary faith, moral change of affections, and some sort of external amendment of their outward conversation, saving grace being the special gift of God to His own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Therapeutica Sacra</cite>, Book 1, Chapter 6</span></figcaption>

</figure><figure class="quote" id="q-60e80e9399" data-kw="">
<blockquote><p>1. There is no power in man to remove that resistance that is in his heart against God and the work of his grace; that which out of its own corrupt principles does wholly resist, and cannot but resist, the operation and dispensation of all spiritual means that would prevail with it for good, that cannot take away the resistance; for resistance cannot take away resistance; it implies a palpable contradiction, as that which is professedly cross to common sense. But the corrupt heart of a natural man, while he is in the state of nature and corruption, does and cannot but wholly resist the work of God’s Spirit and grace, and all the saving operations of all the means thereof. The flesh lusts against the Spirit, and the Spirit against the flesh, and these two are contrary, Gal. 5:17. And what is born of the flesh is flesh, Jn. 3:7; that is the temper and inward constitution of a soul in its natural condition; it is wholly born of the flesh, and therefore nothing but flesh, and therefore can do nothing but resist the Spirit; yea, it cannot but oppose whatever would take that resistance away; for it is a received rule of reason, and confessed of all hands, everything desires the preservation of itself and its being; otherwise the being and the causes that made up the being should be cross to the thing, if it should endeavor its own destruction; nay, a thing should be opposite to itself. Hence it is that the corruption of the heart will put forth all the skill and strength it hath, or by the contrivements of carnal reason can compass, to fortify and preserve itself against the spiritual and saving dispensation of the work of God’s Spirit in his own ordinances; because wicked men look at the power thereof as that which works the ruin of their lusts; therefore they labor to avoid the light if they can; if not that, to oppose it, and overbear it by their delusions; if not that, to destroy it…

2. Before the soul can act against the evil of sin, or for the removal of this resistance wherein the destroying venom of sin lies, and that which stops the passage of the power of the ordinance and the work of grace, it is necessary that the Lord should not only concur with the act of the will of a sinner, to lead or draw forth the act thereof which He has ability to express, but He must let in an influence of the same power and virtue into the faculty of the will, whereby it may be enabled to put forth an act unto which it formerly had no power of itself…

3. The influence of this spiritual power whereby the Lord takes away this sinful resistance, is not by any gracious habit of sanctification, but by an irresistable motion of the work of his Spirit upon the soul…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hooker.html">Thomas Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Application of Redemption by the Effectual Work of the Word &amp; Spirit of Christ for the bringing home of lost sinners to God</cite>, (d. 1647; London: Cole, 1656), bk. 10, pp. 358-86</span></figcaption>

</figure><figure class="quote" id="q-52a1cbc84b" data-kw="">
<blockquote><p>4. A change from the offers of Grace, to the Revelations of Wrath: Shall thy loving kindness be declared in the grave, or thy faithfulness in destruction (says the Psalmist) in Psalm 88:11. True in the 1 Pet. 3:19-20, we read of Christ’s preaching by his Spirit to the Spirits in Prison, that is, to souls in Hell: But mark, when was it that he preach’d to them? not when in prison, but in the days of Noah, when they lived in the world. There is never an offer of grace and love made to souls in the Grave; while life lasts, the soul hears the joyful sound: And O the sweet offers, the gracious tenders, the loving invitations, that are made to him of Christ, of Grace, of Eternal Life and Love! O the wooings, the meltings, the entreatings, the allurings of Divine Love to and over the soul! but when death comes, farewell all these, farewell all the sweet offers of Christ, and all the blessed motions of the Spirit; then there’s nothing but wrath revealed, and wrath shall come on the neglecting soul to the uttermost.

5. A Change from fair probabilities to utter Impossibilities of Life and Salvation; a sad change still: Now is the accepted time, now is the day of Salvation; now, and not hereafter, 2 Cor. 6:2. Now there is a fair probability of the worst of Sinners to be saved, if they will look after Salvation, and mind their eternal Concerns; Christ is both able and willing to save: To save was the end of his coming into the World, and of all he did and suffered here, 1 Tim. 1:15. Now they are besought and entreated to be reconciled to God, 2 Cor. 5:19,20, but when Death comes, that changes these fair probabilities into utter Impossibilities of Life and Salvation. Therefore mark: Now (says the Apostle) is the day of Salvation; that is, now whilst Life lasts, and while the Gospel is preached.</p></blockquote>

<blockquote><p>It must also be borne in mind that elsewhere Hoeksema’s [who denies common grace] definition of the word ‘goodness’ is very different from the meaning commonly given to it by Reformed writers and, more particularly, its usage in the Westminster Standards. For example, in Answer 4 of the Shorter Catechism, we read, ‘God is a Spirit, infinite eternal and unchangeable in his being, wisdom, power, holiness, justice, goodness and truth’. The Shorter Catechism has been criticised by some at this point for not using the terms ‘grace, mercy, love’, but it must be recognised that in the minds of the Westminster Assembly the term goodness included all of these. This explains why the term ‘goodness’ is expanded in the Larger Catechism as equivalent to ‘most merciful and gracious, long-suffering, and abundant in goodness’ (Answer 7) and in the Westminster Confession as ‘most loving, gracious, merciful, longsuffering, abundant in goodness…forgiving iniquity, transgression and sin; the rewarder of them that diligently seek him…’ (Ch. 2.1). The terms ‘good’ and ‘goodness’ (Heb. tob) are consistently linked to God’s mercy or faithful love (Heb. chesed), for example in Psalms 23:6, 25:7-8, 86:5, 100:5, 145:9 etc., and when Psalm 34:8 is referred to in 1 Peter 2:3, the term is rendered ‘gracious’ (Gk. chreestos: A.V. ‘kind’). No doubt this explains why the term is rendered ‘gracious’ in the 1650 Metrical Psalter rendering Psalm 86:5.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-fa1e8144e7" data-kw="">
<blockquote><p>3. Necessary and decent; either always, as a woman to keep silence in the Church, or at least, Hic &amp; nunc [here and now], so as the neglect thereof would be uncomely to the light of Nature, Scripture, custom: As a woman to be veiled in the congregation in the Eastern countries: So, to abstain from blood, whilst the eating of it was offensive to the Jew.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Some Treasure Fetched out of Rubbish: or, Three Short but Seasonable Treatises… (London, 1660)</cite>, p. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2764fbc164" data-kw="">
<blockquote><p>…suppose the 〈◊〉 of churches in a city meet at nine of the clock for God’s 〈◊〉, and in the country parishes adjoining, where many people live at a great distance from their churches, they meet at ten or half an hour after nine, nay in the same church at one and the same time [as they have feed animals, etc. and can’t leave sooner], whilst the Word of God is read or preached, those that sit in seats may have their heads uncovered, and those that stand in allies may keep on their hats the whole sermon〈◊〉, because the crowd or throng may render it inconvenient to keep them off. Now in both these instances there is not uniformity in the same circumstances, and yet there may be order observed, and confusion may very well, notwithstanding, be avoided in all the parts of God’s worship and service.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Uniformity in Human Doctrinal Ceremonies ungrounded on 1 Cor. 14:40, p. 79 in A Second Part of the Mixture of Scholastical Divinity... (Oxford, 1660) Jeanes was an English presbyterian.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-521b1ca99a" data-kw="">
<blockquote><p>2. Paul’s traditions which he delivered, were either concerning matters of doctrine and faith, which are perpetual, and they be all expressed in the Scriptures, or else of ceremonies which are mutable by authority of the church, according to time, places, and persons, observing the general rules prescribed by the Apostle, that all things be done in order and comeliness, and to edification. … 16. Paul saith, the apostles and church have no such custom to be contentious. Chrysostom, homily 27, in Epistle X. Cor. for matters of external order, yet does he give reasons for that order of covering women’s heads. By whose example the preachers are likewise to endeavour to satisfy by reason both men and women, that hurnbly desire their resolution for quiet of their conscience, and not to beat them down with the club of custom only. For so the apostle does not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fulke.html">William Fulke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confutation of the Rhemish Testament… (1582; NY: 1834), on 1 Cor. 11:2, 16</cite>, p. 202 Fulke (1538–1589)</span></figcaption>

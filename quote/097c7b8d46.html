<main class="wrap"><figure class="quote" id="q-097c7b8d46" data-kw="">
<blockquote><p>But they would make some clearing here by telling us that: ‘All who are acquainted with the principles and practices of our worthy predecessors, and of the learned and godly non-conformists in England, will easily see how far they are from their judgments and practices who follow the ways of separation.’ [1.] Bel•ke they still dwell beside evil neighbors, but which is worse, they are hardly believed, when men call to mind and consider how now of a long time still they took the patrociny [patronage] of all that were suspected to follow those ways. 2. What progress some of their chief and cried up men have made in those ways. 3. What affection they still carry to them and how familiarly they converse with them, even although excommunicated. 4. But especially how unavoidable separation is upon their grounds: For if it be a matter of conscience for them to join with others in civil duties that necessarily belong to the incorporation whereof both are members, sure much more in ecclesiastic [affairs].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-resolutioners.html">Scottish Resolutioners</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Member of the General Assembly | The Protestation given in by the Dissenting Brethren, to the General Assembly, July 21, 1652, Reviewed &amp; Refuted (Leith: Tyler, 1652)</cite>, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

fairs%5D." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d73f9ef76a" data-kw="">
<blockquote><p>For the work of peace, at the persuasion of some friends, he took a journey thitherward [to Lutheran Sweden], where he arrived in June, anno 1636… a resolution was taken to permit Master Dury to treat with the divines of that kingdom… to which he might address himself particularly, and lay open his intention… There he had conference both collegially and severally with the professors of divinity, who gave full assent unto his desires, and set down these conditions, upon which they were ready to agree, and join with the reformed side: 1. That a full agreement should be made in all the fundamental articles of Faith. 2. That all errors overthrowing the foundation, or tending to overthrow the same, should be condemned. 3. That in matters ceremonial and of indifferency, there should be a mutual toleration. 4. That betwixt the parties, united sincerity and uprightness should be maintained, lest ancient errors might be upheld under doubtful speeches. 5. That when peace is made, none should be suffered to maintain, excuse or spread any more the errors once condemned. 6. That ambitious and needless disputes and brabblings should be inhibited on all sides. 7. That former reproaches and injuries should be put to oblivion. 8. That the Church government should be settled according to apostolical rules. These demands the rest agreed unto, neither was any thing of moment added thereunto by any.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quote on Dury | Samuel Hartlib, A Brief Relation of that which has been Lately attempted to Procure Ecclesiastical Peace amongst Protestants (London: I.R., 1641)</cite>, pp. 16-17</span></figcaption>

</figure><figure class="quote" id="q-1878dea24a" data-kw="">
<blockquote><p>If he [the opponent] judge the terms of our communion lawful [in the Church of Scotland], then he must either join and keep communion with us, or maintain that a Church, the terms of whose communion are lawful, or, to keep to our these [thesis], in which there are no sinful terms of communion imposed, is yet to be separated from. This is a new tenet, never known before among men that called themselves presbyterians. I think they had reason, who, when these [separatist] men began to call themselves ‘the true presbyterians of the Chuch of Scotland’ [after the Glorious Revolution of 1689], they called them ‘the new presbyterians’.</p></blockquote>

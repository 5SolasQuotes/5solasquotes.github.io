<main class="wrap"><figure class="quote" id="q-f7e4b76b7c" data-kw="">
<blockquote><p>Is it inconsistent in God to do any kind and degree of good to a sinner, if He has decided not to do the highest kind and degree of good in his power? Shall God do nothing at all that is kind and gracious to a sinful man, unless He has decided to overcome all the opposition that He may make to his kindness and grace? Must God make no offer of mercy to a sinner, unless He has decided to make him accept it? There never was an age of the world when men more needed than now to be reminded that they are resisting the common grace of God, and rejecting his universal offer of mercy [in the gospel], and this in so doing they run the great hazard of God’s preterition [passing them over].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-shedd.html">William Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed (1893; rep. Banner of Truth, 1993)</cite>, p. 105</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

<blockquote><p>4. A change from the offers of Grace, to the revelations of wrath: Shall thy loving kindness be declared in the grave, or thy faithfulness in destruction (says the Psalmist) in Psalm 88:11… There is never an offer of grace and love made to souls in the grave; while life lasts, the soul hears the joyful sound: And O the sweet offers, the gracious tenders, the loving invitations, that are made to him of Christ, of Grace, of Eternal Life and Love! O the wooings, the meltings, the entreatings, the allurings of Divine Love to and over the soul! but when death comes, farewell all these, farewell all the sweet offers of Christ, and all the blessed motions of the Spirit; then there’s nothing but wrath revealed, and wrath shall come on the neglecting soul to the uttermost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-pearse.html">Edward Pearse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Concern, or A Serious Warning to a Timely &amp; Thorough Preparation for Death (London: J. Robinson, 1674)</cite>, pp. 73–75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

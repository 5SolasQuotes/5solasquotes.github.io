<main class="wrap"><figure class="quote" id="q-9aa9e0dab1" data-kw="">
<blockquote><p>But if the law of God be diligently searched, this doubt shall easily be resolved. For it will witness that no less ought the murderer, the blasphemer, and such other, to suffer the death, then that the meek and the fearer of God should be defended. And also, that such as maintain and defend the one, are no less criminal before God then those that oppress the others. […] Now to you justifiers of Servetus: Servetus was an abominable blasphemer against God; and you are justifiers of Servetus: therefore ye are blasphemers before God, like abominable as he was. […] Ye will not easily admit that Servetus be convicted of blasphemy; for if he be, ye must be compelled to confess (except that ye will refuse God) that the sentence of death executed against him was not cruelty; neither yet that the judges who justly pronounced that sentence were murderers nor persecutors; but that this death was the execution of God’s judgement, and they the true faithful servants of God, who, when no other remedy was found, did take away iniquity from amongst them. That God hath appointed death by his law, without mercy, to be executed upon the blasphemers, is evident by that which is written, Leviticus 24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An answer to the cavillations of an adversary respecting the doctrine of predestination</cite>, (1560) repr. in The works of John Knox, ed. David Laing (6 vols, Edinburgh, 1856), v, 223-4.</span></figcaption>

<blockquote><p>135. Should I proceed to explain to you all or half of the questions about which the sharpest-witted Schoolmen merely dream concerning the knowledge and decrees of God, I would tire myself and the reader to little purpose; such as, An scientia actualis aliorum sit de Essentia Dei? (Is the actual knowledge of other things part of God’s essence?), An Essentia Dei sit Motivum adaequatum ejus scientiae? (Is God’s essence the adequate motive for His knowledge?), An Deus cognoscat creaturas ex seipso, aut ex alio per discursum? (Does God know creatures from Himself, or from something else through reasoning?), An &amp; quomodo scientia Dei possit dividi in plures? (If and how can God’s knowledge be divided into multiple parts?), An &amp; quomodo Deus cognoscat Mala? (If and how does God know evil?), An &amp; quomodo Deus cognoscat negationes &amp; privationes? (If and how does God know negations and privations?), An Deus cognoscat Entia rationis? (Does God know beings of reason?), An habeat in se Entia Rationis? (Does He have beings of reason within Himself?), De scientia Media (On middle knowledge), An scientia Visionis sit causa futurorum? (Is the knowledge of vision the cause of future things?), An futura causa scientiae? (Are future things the cause of knowledge?), An scientia simplicis intelligentiae sit causa futurorum &amp; practica? (Is the knowledge of simple intelligence the cause of future things and practical?), An Deus cognoscat futura compenendo &amp; dividendo? (Does God know the future by composing and dividing?), An Deus cognoscat praesentia eadem indivisibili cognitione, qua ipsa praenovit futura? (Does God know present things with the same indivisible cognition with which He foresaw the future?), An Deus noverit Infinita scientia simplicis intelligentiae? (Does God know infinite things with the knowledge of simple intelligence?), An eadem cognitione se &amp; creaturas cognoscat? (Does He know Himself and creatures with the same cognition?), An existente objecto pro solo imperio Voluntatis Divinae possit non esse in Deo aliquis actus scientiae divino intellectui possibilis? (If an object exists solely by the empire of the Divine Will, is it possible that there is no act of knowledge in God, possible to the Divine intellect?), etc., with a multitude of lesser questions that arise from dealing with these; and with as many more about predestination, God’s decrees or volitions, predetermination, etc. I think your patience has already been sufficiently tested.

136. If you say that by reciting these difficulties, I am only confusing people’s understanding rather than clarifying the matters at hand, I answer: If you get lost in them, I achieve my goal, which is to make you aware of how inappropriate it is that the peace of the Church and the concord and communion among brethren should be based on such a multitude of difficult and unsearchable things—some of which are vain, and others beyond human understanding. Should we call one another by sect names and reproach our brethren as if it were for God’s truth and glory until all these controversies are cleared up for everyone? I, who admit that they are beyond my reach and acknowledge my ignorance of many of them, am still censured by my brethren for being too scholastically curious for merely mentioning or engaging with them; yes, even for deciding cases that can and must be decided. And of all our present ministers, I am confident that not one in fifty (if even one in a hundred) has thoroughly studied them or ever will. Now, if the Church is to have love and concord, how will it be achieved? Of those few (one in a hundred who studied them thoroughly), six men will likely hold three different opinions. And what will the other ninety-nine do who have never studied them? Either they must know what they have never studied and be right where they do not understand what they are saying, or else they must unite by implicit faith. And in whom should that be? In the Church? Which Church is it? Are not many churches of many minds? If in the Papal Church, it has more sense than to decide such controversies, so that their doctors are still almost sectarian, divided to this day.

137. And if anyone dreams that the controversies between Calvinists and Lutherans (or Arminians) and between Dominicans and Jesuits can be resolved for either side without engaging with these questions, that person is too ignorant to be fit to speak confidently on the matter. Let them try to engage in a dispute with any capable adversary, and they will be led to these issues whether they want to or not.

138. But if it is someone so confident in either position that they believe their side or opinions are so great and clear that the contrary positions are unworthy of our tolerance and communion, I must be frank enough to say that they exhibit such ignorance and pride as to make their own fitness for communion much more questionable. For is it not the most odious ignorance for a person not to recognize their own ignorance of so many mysteries that no mortals know? And is it not loathsome pride for people to be so confident in these false notions and arrogate to themselves a knowledge that human existence is incapable of attaining?

139. And I am filled with shame to see that, although there has been some recent turmoil against the Jansenists, all these sects (Dominicans, Jesuits, Scotists, Nominals, etc.) manage to live in communion despite their differences, while Protestants have pursued the same differences with all the bitterness you can find in German historians and theologians (such as Schlusselburgius, Calovius, and many others), in the sad history of the Low Countries, and in Heylin’s Life of Archbishop Laud. You can still hear it in all parties today, in their ignorant censures of one another, using the names of Calvinists and Arminians. And yet, we rightly condemn the Church of Rome for its uncharitable cruelty against dissenters, while in doing so, we condemn ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, 1. by contending about things unrevealed or not understood, 2. and by taking verbal differences for real. pt. 1, sect. VII, pp. 121-23</span></figcaption>

dem+indivisibili+cognitione%2C+qua+ipsa+praenovit+futura%3F+%28Does+God+know+present+things+with+the+same+indivisible+cognition+with+which+He+foresaw+the+future%3F%29%2C+An+Deus+noverit+Infinita+scientia+simplicis+intelligentiae%3F+%28Does+God+know+infinite+things+with+the+knowledge+of+simple+intelligence%3F%29%2C+An+eadem+cognitione+se+%26+creaturas+cognoscat%3F+%28Does+He+know+Himself+and+creatures+with+the+same+cognition%3F%29%2C+An+existente+objecto+pro+solo+imperio+Voluntatis+Divinae+possit+non+esse+in+Deo+aliquis+actus+scientiae+divino+intellectui+possibilis%3F+%28If+an+object+exists+solely+by+the+empire+of+the+Divine+Will%2C+is+it+possible+that+there+is+no+act+of+knowledge+in+God%2C+possible+to+the+Divine+intellect%3F%29%2C+etc.%2C+with+a+multitude+of+lesser+questions+that+arise+from+dealing+with+these%3B+and+with+as+many+more+about+predestination%2C+God%E2%80%99s+decrees+or+volitions%2C+predetermination%2C+etc.+I+think+your+patience+has+already+been+sufficiently+tested.%0A%0A136.+If+you+say+that+by+reciting+these+difficulties%2C+I+am+only+confusing+people%E2%80%99s+understanding+rather+than+clarifying+the+matters+at+hand%2C+I+answer%3A+If+you+get+lost+in+them%2C+I+achieve+my+goal%2C+which+is+to+make+you+aware+of+how+inappropriate+it+is+that+the+peace+of+the+Church+and+the+concord+and+communion+among+brethren+should+be+based+on+such+a+multitude+of+difficult+and+unsearchable+things%E2%80%94some+of+which+are+vain%2C+and+others+beyond+human+understanding.+Should+we+call+one+another+by+sect+names+and+reproach+our+brethren+as+if+it+were+for+God%E2%80%99s+truth+and+glory+until+all+these+controversies+are+cleared+up+for+everyone%3F+I%2C+who+admit+that+they+are+beyond+my+reach+and+acknowledge+my+ignorance+of+many+of+them%2C+am+still+censured+by+my+brethren+for+being+too+scholastically+curious+for+merely+mentioning+or+engaging+with+them%3B+yes%2C+even+for+deciding+cases+that+can+and+must+be+decided.+And+of+all+our+present+ministers%2C+I+am+confident+that+not+one+in+fifty+%28if+even+one+in+a+hundred%29+has+thoroughly+studied+them+or+ever+will.+Now%2C+if+the+Church+is+to+have+love+and+concord%2C+how+will+it+be+achieved%3F+Of+those+few+%28one+in+a+hundred+who+studied+them+thoroughly%29%2C+six+men+will+likely+hold+three+different+opinions.+And+what+will+the+other+ninety-nine+do+who+have+never+studied+them%3F+Either+they+must+know+what+they+have+never+studied+and+be+right+where+they+do+not+understand+what+they+are+saying%2C+or+else+they+must+unite+by+implicit+faith.+And+in+whom+should+that+be%3F+In+the+Church%3F+Which+Church+is+it%3F+Are+not+many+churches+of+many+minds%3F+If+in+the+Papal+Church%2C+it+has+more+sense+than+to+decide+such+controversies%2C+so+that+their+doctors+are+still+almost+sectarian%2C+divided+to+this+day.%0A%0A137.+And+if+anyone+dreams+that+the+controversies+between+Calvinists+and+Lutherans+%28or+Arminians%29+and+between+Dominicans+and+Jesuits+can+be+resolved+for+either+side+without+engaging+with+these+questions%2C+that+person+is+too+ignorant+to+be+fit+to+speak+confidently+on+the+matter.+Let+them+try+to+engage+in+a+dispute+with+any+capable+adversary%2C+and+they+will+be+led+to+these+issues+whether+they+want+to+or+not.%0A%0A138.+But+if+it+is+someone+so+confident+in+either+position+that+they+believe+their+side+or+opinions+are+so+great+and+clear+that+the+contrary+positions+are+unworthy+of+our+tolerance+and+communion%2C+I+must+be+frank+enough+to+say+that+they+exhibit+such+ignorance+and+pride+as+to+make+their+own+fitness+for+communion+much+more+questionable.+For+is+it+not+the+most+odious+ignorance+for+a+person+not+to+recognize+their+own+ignorance+of+so+many+mysteries+that+no+mortals+know%3F+And+is+it+not+loathsome+pride+for+people+to+be+so+confident+in+these+false+notions+and+arrogate+to+themselves+a+knowledge+that+human+existence+is+incapable+of+attaining%3F%0A%0A139.+And+I+am+filled+with+shame+to+see+that%2C+although+there+has+been+some+recent+turmoil+against+the+Jansenists%2C+all+these+sects+%28Dominicans%2C+Jesuits%2C+Scotists%2C+Nominals%2C+etc.%29+manage+to+live+in+communion+despite+their+differences%2C+while+Protestants+have+pursued+the+same+differences+with+all+the+bitterness+you+can+find+in+German+historians+and+theologians+%28such+as+Schlusselburgius%2C+Calovius%2C+and+many+others%29%2C+in+the+sad+history+of+the+Low+Countries%2C+and+in+Heylin%E2%80%99s+Life+of+Archbishop+Laud.+You+can+still+hear+it+in+all+parties+today%2C+in+their+ignorant+censures+of+one+another%2C+using+the+names+of+Calvinists+and+Arminians.+And+yet%2C+we+rightly+condemn+the+Church+of+Rome+for+its+uncharitable+cruelty+against+dissenters%2C+while+in+doing+so%2C+we+condemn+ourselves.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Theology+Plain%2C+Pure%2C+Peaceable%2C+1.+by+contending+about+things+unrevealed+or+not+understood%2C+2.+and+by+taking+verbal+differences+for+real.+pt.+1%2C+sect.+VII%2C+pp.+121-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc0a2c6667d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c0a2c6667d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-decrees-of-god#:~:text=135.%20Should%20I%20proceed%20to%20explain,in%20doing%20so%2C%20we%20condemn%20ourselves&amp;text=135.%20Should%20I%20proceed%20to%20explain%20to%20you&amp;text=dissenters%2C%20while%20in%20doing%20so%2C%20we%20condemn%20ourselves" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-982373dad1" data-kw="">
<blockquote><p>The 1868 Old School Assembly declared that the New School pronouncement of ‘true doctrines’ in the 1837 Auburn Declaration ’embrace all the fundamentals of the Calvinistic creed.’ The New School version of Calvinism was vindicated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-donald-fortson-iii.html">S. Donald Fortson III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘New School Calvinism &amp; the Presbyterian Creed’ in The Journal of Presbyterian History</cite>, (1997-), vol. 82, no. 4 (Winter 2004), pp. 221-43, p. 238</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“The 1868 Old School Assembly declared that the New School pronouncement of ‘true doctrines’ in the 1837 Auburn Declaration ’embrace all the fundamentals of the Calvinistic creed.’ The New School version of Calvinism was vindicated.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f4042b8944" data-kw="">
<blockquote><p>While [John] Thomson has been portrayed as a strict Subscriber his overture [in 1727, which led to the Adopting Act] recognizes a need to deal with exceptions, ‘if any minister within our bounds shall take upon him to teach or preach any thing contrary to any of the said Articles, unless first he propose the said point to the Presbytery or Synod, to be by them discussed, he shall be censured’. And as he closed the preface: ‘if there should be any paragraphs or clauses at which some may scruple, there are rational methods according to charity and piety, to have such scruples removed in a regular way, and it’s a pity to deprive a whole Church of the benefit of such and excellent Confession, for the scruples perhaps of a few, or for a few scruples about some particular and lesser points of religion.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-scott-sealy.html">Charles Scott Sealy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Authority &amp; Non-Subscription Controversies in Early 18th Century Presbyterianism PhD thesis</cite>, Charles S. Sealy, Church Authority &amp; Non-Subscription Controversies in Early 18th Century Presbyterianism PhD thesis, (Univ. of Glasgow, 2010), p. 176 quoting [John Thomson], An Overture Presented to the Reverend Synod of Dissenting Ministers, Sitting in Philadelphia, in the Month of September, 1728… (n.l., 1729), pp. 24, 32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“While [John] Thomson has been portrayed as a strict Subscriber his overture [in 1727, which led to the Adopting Act] recognizes a need to deal with exceptions, ‘if any minister within our bounds shall take upon him to teach or preach any thing contrary to any of the said Articles, unless first he propose the said point to the Presbytery or Synod, to be by them discussed, he shall be censured’. And as he closed the preface: ‘if there should be any paragraphs or clauses at which some may scruple, there are rational methods according to charity and piety, to have such scruples removed in a regular way, and it’s a pity to deprive a whole Church of the benefit of such and excellent Confession, for the scruples perhaps of a few, or for a few scruples about some particular and lesser points of religion.&#x27;”

— Before the Adopting Act of, Charles S. Sealy, Church Authority &amp; Non-Subscription Controversies in Early 18th Century Presbyterianism PhD thesis (Univ. of Glasgow, 2010), p. 176 quoting [John Thomson], An Overture Presented to the Reverend Synod of Dissenting Ministers, Sitting in Philadelphia, in the Month of September, 1728… (n.l., 1729), pp. 24, 32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhile+%5BJohn%5D+Thomson+has+been+portrayed+as+a+strict+Subscriber+his+overture+%5Bin+1727%2C+which+led+to+the+Adopting+Act%5D+recognizes+a+need+to+deal+with+exceptions%2C+%E2%80%98if+any+minister+within+our+bounds+shall+take+upon+him+to+teach+or+preach+any+thing+contrary+to+any+of+the+said+Articles%2C+unless+first+he+propose+the+said+point+to+the+Presbytery+or+Synod%2C+to+be+by+them+discussed%2C+he+shall+be+censured%E2%80%99.+And+as+he+closed+the+preface%3A+%E2%80%98if+there+should+be+any+paragraphs+or+clauses+at+which+some+may+scruple%2C+there+are+rational+methods+according+to+charity+and+piety%2C+to+have+such+scruples+removed+in+a+regular+way%2C+and+it%E2%80%99s+a+pity+to+deprive+a+whole+Church+of+the+benefit+of+such+and+excellent+Confession%2C+for+the+scruples+perhaps+of+a+few%2C+or+for+a+few+scruples+about+some+particular+and+lesser+points+of+religion.%27%E2%80%9D%0A%0A%E2%80%94+Before+the+Adopting+Act+of%2C+Charles+S.+Sealy%2C+Church+Authority+%26+Non-Subscription+Controversies+in+Early+18th+Century+Presbyterianism+PhD+thesis+%28Univ.+of+Glasgow%2C+2010%29%2C+p.+176+quoting+%5BJohn+Thomson%5D%2C+An+Overture+Presented+to+the+Reverend+Synod+of+Dissenting+Ministers%2C+Sitting+in+Philadelphia%2C+in+the+Month+of+September%2C+1728%E2%80%A6+%28n.l.%2C+1729%29%2C+pp.+24%2C+32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff4042b8944.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f4042b8944.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=While%20%5BJohn%5D%20Thomson%20has%20been%20portrayed,particular%20and%20lesser%20points%20of%20religion&amp;text=While%20%5BJohn%5D%20Thomson%20has%20been%20portrayed%20as%20a&amp;text=about%20some%20particular%20and%20lesser%20points%20of%20religion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-068e7925f0" data-kw="">
<blockquote><p>The language here employed [in the Scottish subscription formula in 1694 &amp; 1711] is cautious and temperate, and is thus well suited to the circumstances of a solemn profession to be made by a numerous body of men, who might not all see their way to concur in stronger and more specific phraseology. Besides, it is to be observed that the profession respects not merely the fundamentals or essentials of Presbyterianism in the abstract, which alone can be reasonably maintained to have the clear and positive sanction of apostolic practice; but ‘the Presbyterian government and discipline of this church,’ including the detailed development of the essential principles of Presbyterianism as exhibited in the actual constitution and arrangements of our church, and of all this in the concrete, or taken complexly, nothing higher or stronger could with propriety be affirmed, than that it is founded upon the word of God, and agreeable thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, vol. 1, p. 76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-96cad867f8" data-kw="">
<blockquote><p>And so the Temple of God in heaven, is properly taken for his heavenly elect Church upon earth, and for their true doctrine, profession, and religion… the true Christian Churches, professors of Christ his true testimony, were visible and patent, their true doctrine and Christian religion opened up, and the majesty of God thereby made known, and manifested in the days of the apostles:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-napier.html">John Napier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Discovery of the Whole Revelation of Saint John</cite>, (Edinburgh: Waldegrave, 1593) Napier (1550–1617) was a Scottish scholar.</span></figcaption>

</figure><figure class="quote" id="q-3e453359e8" data-kw="">
<blockquote><p>Wherefore we suffer not ourselves, in controversies about religion, or matters of faith, to be pressed with the bare testimonies of Fathers, or Decrees of Councils; much less with received customs, or with the multitude of men being of one judgment, or with prescription of long time. Therefore, in controversies of religion, or matters of faith, we cannot admit any other judge than God himself, pronouncing by the holy Scriptures, what is true, what is false, what is to be followed, or what to be avoided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 2</span></figcaption>

<main class="wrap"><figure class="quote" id="q-183d7cc39f" data-kw="">
<blockquote><p>I do not know all the things that will happen when the great revival sweeps over the Church, the great revival for which we long. Certainly I do not know when that revival will come; its coming stands in the Spirit’s power. But about one thing that will happen when that blessing comes I think we can be fairly sure. When a great and true revival comes in the Church, the present miserable, feeble talk about avoidance of controversy on the part of the servants of Jesus Christ will all be swept away as with a mighty flood. A man who is really on fire with his message never talks in that feeble and compromising way, but proclaims the gospel plainly and boldly in the presence of every high thing that is lifted up against the gospel of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Facing the Facts Before God”</cite>, (1931).</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ee3a8211b" data-kw="">
<blockquote><p>…the everlasting and precise observation of this favorable precept [2nd Commandment] in the ancient, purely Christian Church… They observed the rule with the Cherubim, too; it was exactly as if they had not been put in the temple, even outside the gaze of all the Priests, and they were put forth as types of the Majesty of the Messiah who rules over the angels themselves, the truth of which we now maintain. [Note that numerous reformed theologians (such as Owen below), in accord with many in the Christian Church before them, irrespective of possibly a more direct figuring of Israel under Egyptian persecution, taught that the burning bush was a type of the majesty of the Messiah (the true Israel) who would join the divine nature to his human nature in his Person (who spoke both as the angel of the Lord, and God, out of the bush), and not be consumed. Beza’s and the Reformed’s caution is here evident.] But the other images, like the lions and the bulls, pertain in no way to this matter, (r) since they were like decorations of holy vases, lacking any danger of idolatry, and besides this, constructed in this way by the express word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586</cite>, (Concordia Publishing House, 2017), ch. 4, p. 462</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

<blockquote><p>6. Our prayers unto God should be joined with submissiveness of spirit, self-denial and hopeful dependance on God: for so much does the gesture of lifting up of the hands in prayer of its own nature signify, and therefore here the gesture is put for the prayer, which should be joined with such an inward disposition; ‘Let the lifting up of my hands be as evening sacrifice.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the Last Fifty Psalms from Ps. 100 to the End</cite>, (London, 1654), on Ps. 141, verse 2</span></figcaption>

</figure><figure class="quote" id="q-2cfa4393d8" data-kw="Mary Queen of Heaven Satan Grace">
<blockquote><p>Hence we see how widely the Papists differ from her, who idly adorn her with their empty devices, and reckon almost as nothing the benefits which she received from God. They heap up an abundance of magnificent and very presumptuous titles, such as, &quot;Queen of Heaven, Star of Salvation, Gate of Life, Sweetness, Hope, and Salvation.&quot; Nay more, to such a pitch of insolence and fury have they been hurried by Satan, that they give her authority over Christ; for this is their pretty song, &quot;Beseech the Father, Order the Son.&quot; None of these modes of expression, it is evident, proceeded from the Lord. All are disclaimed by the holy virgin in a single word, when she makes her whole glory to consist in acts of the divine kindness. If it was her duty to praise the name of God alone, who had done to her wonderful things, no room is left for the pretended titles, which come from another quarter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 1:48-49</span></figcaption>

</figure><figure class="quote" id="q-7d6e29db6f" data-kw="">
<blockquote><p>Such ceremonies as had signification put upon them were notwithstanding lawful, as is manifest by the consideration of most of those ceremonies mentioned before; the altar by Jordan, the cup used at the Passover, the cover on the heads of women, and the love-feasts with the holy kiss: and so had all the Jewish ceremonies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter</cite>, … (London, 1623), on v. 13, pp. 588-90 &amp; 594 Byfield was an Anglican minister that had practical, puritan characteristics, but here takes an Anglican view on ceremonies.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-67be89223d" data-kw="">
<blockquote><p>…when many have been in the fault, there has been a forbearance [in exercising Church discipline]… ‘I would they were cut off that trouble you’ (Gal. 5:12). Why then would he [the apostle Paul] not cut them off? Because there was such a distemper among the Galatians, they were so bewitched and led away after the false teachers, and Paul’s authority was questioned; therefore he held himself at a wish and will not put forth the authority he had against those false and corrupt men.</p></blockquote>

<blockquote><p>Conclusion 1. The appearing-holiness of those who hold an opinion is not enough to demonstrate it a truth. A man may be in a dangerous (I had like to have said, damning) error, and yet to the view of men appearingly-holy. Many men have put on a form of godliness, and shew of holiness, till they have gotten strength and power enough to back them in their opinions, and then they have discovered the venom of their spirits, and let loose their spirits to those corrupt ways which their erroneous understandings did lead them to.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, ... (1646), p. 164</span></figcaption>

</figure><figure class="quote" id="q-6dbb8b038c" data-kw="">
<blockquote><p>Tota ratio Schismatis, the very essence of a schism consists in the separating from the Church, I say, from the true and orthodoxal Church. It is a renting or dissolving of that unity which ought to be amongst Christians; See Mr. [Stephen] Marshall’s Sermon on Rom. 12:4-5. It was a memorable speech of Calvin, who said he would willingly travel all over the seas and countries in the world to put an end to the differences that were in the Reformed Churches. [John] Cameron well distinguishes of a double schism: 1. Negative, which is a bare secession or subduction, and is unlawful. Non separatio sed causa facit Schismaticum [Not the separation but the cause that makes the schismatic]. Cassander. 2. Positive, when there is a certain consociation, which uses ecclesiastical laws, the Word of God and administration of the sacraments separatim [in a separated way], which he calls setting up an altar against an altar; this is called schism Antonomastic [Greek], and [Greek], says he [in] De Ecclesia. Different forms of Churches and Church-government in one state must needs lay a foundation of strife and division therein. It is no wisdom (says Mr. [John] Dury in a letter [about congregationalists]) in a state, to reject an approved way of government, which all the best reformed Churches have received all this while, and acknowledged to be God’s way, and by experience found to be safe, sound; and instead of it to take up another, which it is not yet known what it is, nor was ever tried but in two or at the most three churches, and that for the space of a few years. The slighter the cause of separation, the greater the fault of schism; when men hold the same Faith and orthodox truths, yet separate for lesser matters. The true saints in the 7 Churches of the Revelation were never bid go out of them though they were very corrupt, as they were out of Babylon, Mr. [Richard] Vines. The first separatist in the Scripture (says one) was Cain, Gen. 4:16. Enforcements to love are clear, 1 Cor. 13:1. That question of Separation in Scripture is dark. See Mr. [George] Gillespie, Miscellaneous Questions, ch. 10 and 15, and Mr. [Thomas] Manton on James 3. 17. Schisma est secessio in religionis negotio vel temeraria vel injusta, Cameron, De Ecclesia. Schism is a causeless separation from external communion with any true Church of Christ: Mr. [John] Ball, Against Separation, ch. 8. Schism is a breach of the unity of the Church. Dr. Field, bk. 3, Of the Church, ch. 5. We do not leave communion of true Churches for corruptions and sins, but only abstain from the practice of evil in our own persons, and witness against it in others, still holding communion with the Churches of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, ... (London: A.M., 1654), bk. 4, ch. 22, ‘Schism’, pp. 376-77</span></figcaption>

<blockquote><p>And in the Acts we read that the faithful continued in the doctrine of the apostles, in the communion and breaking of bread, and in prayers (Acts 2:42), which is no other thing but a brief description of the true Church of Christ, instructed by the Word, in true faith and knit together in true charity, through the communion that is in Him. The which thing St. Ambrose teaches us saying (De Salubr., ch. 7), that the catholic Church is that where God speaks with his servants: and St. Augustine also (contra Cresco. Gramat., bk. •, ch. 11 etc.), where He places the ministry of ministers and pastors of the Church, in the Word of God and sacraments. Let us yet add hereunto the third mark of this Church, albeit it be not of the substance, but outward, to wit, the lawful vocation of pastors and ministers of the Church, which have the administration of the things aforesaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philip Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter</cite>, [in controversy with Romanism] (London: Barker, 1579), ch. 2, n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>3. Stout in fundamentals of doctrine or practise, but sober and submiss in circumstantials. Foundations of faith and the unity of the Church were very dear to his [the minister John Frost’s] soul, and high in his esteem. The skeptical shakings of the one, and schismatical distractions of the other, sat as sad burdens on his spirit. With strength and much resolution would he contend for essentials of salvation: and things that must be believed, he would often press his people to hold without controversy, noting it to be the shame of Christianity, to lay the [Apostle’s] Creed open to common disputes. And very studious he was to cement differences among brethren: slow he was in censures, but free in rebukes of, and complaints over brethren’s distance. Earnestly he desired, and studiously endeavoured an union between Episcopal and presbyterial divines in things relating to the discipline of the Church; many times he has in my hearing lamented the want of discipline, and observed the animosity of both as no mean hindrance to its restitution.</p></blockquote>

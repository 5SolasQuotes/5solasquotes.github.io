<blockquote><p>…the people’s praying after the minister they say both wastes time, and also makes an unpleasant sound; the Psalms they would not have to be made (as they are) a part of our common [unison] prayer, nor to be said our sung by turns, nor such music to be used with them; those evangelical hymns they allow not to stand in our liturgy; the Litany, the Creed of Athanasius, the sentence of Glory [Gloria Patria] wherewith we use to conclude psalms, these things they cancel, as having been instituted in regard of occasions peculiar to the times of old, and a being therefore no superfluous.</p></blockquote>

</figure><figure class="quote" id="q-e9b601c8d0" data-kw="">
<blockquote><p>The duties required in the first commandment are, the knowing and acknowledging of God to be the only true God, and our God;[o] and to worship and glorify him accordingly,[p] by thinking,[q] meditating,[r] remembering,[s] highly esteeming,[t] honouring,[v] adoring,[w] choosing,[x] loving,[y] desiring,[z] fearing of him;[a] believing him;[b] trusting,[c] hoping,[d] delighting,[e] rejoicing in him;[f] being zealous for him;[g] calling upon him, giving all praise and thanks,[h] and yielding all obedience and submission to him with the whole man;[i] being careful in all things to please him,[k] and sorrowful when in any thing he is offended;[l] and walking humbly with him.[m] [o] 1 Chron. 28:9. Deut. 26:17. Isa. 43:10. Jer. 14:22. [p] Ps. 95:6,7. Matt. 4:10. Ps. 29:2. [q] Mal. 3:16. [r] Ps. 63:6. [s] Eccl. 12:1. [t] Ps. 71:19. [v] Mal. 1:6. [w] Isa. 45:23. [x] Josh. 24:15,22. [y] Deut. 6:5. [z] Ps. 73:25. [a] Isa. 8:13. [b] Exod. 14:31. [c] Isa. 26:4. [d] Ps. 130:7. [e] Ps. 37:4. [f] Ps. 32:11. [g] Rom. 12:11 compared with Num. 25:11. [h] Phil. 4:6. [i] Jer. 7:23. James 4:7. [k] 1 John 3:22. [l] Jer. 31:18. Ps. 119:136. [m] Micah 6:8.</p></blockquote>

%20%5Bm%5D%20Micah%206%3A8&amp;text=The%20duties%20required%20in%20the%20first%20commandment%20are&amp;text=l%5D%20Jer.%2031%3A18.%20Ps.%20119%3A136.%20%5Bm%5D%20Micah%206%3A8" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5510b393e4" data-kw="">
<blockquote><p>‘It’s not always easy to identify a cult,’ Jenkinson says, explaining that there isn’t one type of person that joins a cult, they don’t dress a certain way and they can operate from ‘ordinary’ houses. The Family Survival Trust… defines a cult as a system controlled by a charismatic and authoritarian leadership that is ‘rigidly bounded’ and supported by a fixed set of beliefs. It involves brainwashing designed to isolate, control and exploit followers. Cults do not have to be religious. Linguist Amanda Montell, author of Cultish: The Language of Fanaticism, explains people can ‘erect a cult around anything, as long as you can inject it with fear and an ‘us-versus-them’ mentality’. … While cults can be hard to spot, Jenkinson and Montell note some ‘red flags’ people can look for: – One possible indicator Jenkinson highlights is ‘love bombing,’ a manipulation tactic that sees abusers use affection and declarations of love as a way of gaining power and control. – Another common theme is promising ‘answers to life’s very complex problems’… – Montell says the combination of mantras, buzzwords and nicknames for insiders and outsiders of the group, as well as language that elicits a strong reaction while encouraging us not to ask further questions, can be indicators. – The linguist adds that certain texts being ‘off-limits’ in the group can also be a warning sign. – The most ‘extreme’ trait of a cult for Montell is a ‘high barrier to exit’, meaning group members being made to feel they might lose their identity or friendships, or fear retaliation, if they leave the group.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/shola-lee.html">Shola Lee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”You’re sold a lie’: How do you spot a cult’</cite>, (2025) at BBC.com</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

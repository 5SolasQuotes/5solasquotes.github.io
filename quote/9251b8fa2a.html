<main class="wrap"><figure class="quote" id="q-9251b8fa2a" data-kw="">
<blockquote><p>Assertion 2: That the king only has the power of war and raising armies must be but a positive civil law. For: 1. By divine right, if the inferior judges have the sword given to them of God, then have they also power of war and raising armies. 2. …as therefore the king cannot take from one particular man the power of the sword for natural self-preservation, because it is the birthright of life, neither can the king take from a community and kingdom a power of rising in arms for their own defense… 3. Because no king, no civil power can take away nature’s birthright of self-defense from any man or a community of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex (1644; Edinburgh: Ogle, 1843)</cite>, p. 184 rt col</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-09a8066301" data-kw="">
<blockquote><p>…we will distinguish with the School-men a two-fold power, the power of Order, and the power of Jurisdiction; which are different in sundry respects. 1. The power of order comprehends such things as a minister by virtue of his ordination, may do without a commission from any presbytery, or assembly of the Church, as to preach the Word, to minister the sacraments, to celebrate marriage, to visit the sick, to catechize, to admonish, etc. The power of jurisdiction comprehends such things as a minister cannot do by himself, nor by virtue of his ordination; but they are done by a session, presbytery, or synod; and sometimes by a minister, or ministers, having commission, and authority from the same, such as ordination and admission, suspension, deprivation and excommunication, and receiving again into the Church, and making of laws and constitutions ecclesiastical and such like; whereof we boldly maintain, that there is no part of ecclesiastical jurisdiction, in the power of one man, but of many met together in the name of Christ. 2. The power of order is the radical and fundamental power, and makes a minister susceptive, and capable of the power of jurisdiction. 3. The power of order goes no further than the court of conscience; the power of jurisdiction is exercised in external and ecclesiastical courts. Fourthly, the power of order is sometime unlawful in the use, yet not void in itself. The power of Jurisdiction when it is unlawful in the use, it is also void in itself. If a minister do any act of jurisdiction, as to excommunicate, or absolve without his own parish, wanting also the consent of the ministry and elders of the bounds where he does the same, such acts are void in themselves, and of no effect. But if without his own charge, and without the consent aforesaid, he baptize an infant, or do any such thing belonging to the power of order, though his act be unlawful, yet is the thing itself of force, and the sacrament remains a true sacrament.</p></blockquote>

</figure><figure class="quote" id="q-4f922161b6" data-kw="">

<blockquote><p>In summary, for [John] Cameron, as for Aquinas, the fundamental core of ethics chiefly concerned immanent structures of divine rationality. By contrast, for Rutherford, ethics was grounded in both human self-denial and subjection to God and the higher, transcendent and ultimately inscrutable rationality of the divine will.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-43d9e0e19c" data-kw="">
<blockquote><p>From this it follows, that subjects are no farther bound to obey the magistrate because of conscience, than in as far as he himself presides and enjoins with a good conscience, and on the authority of the Word of God: and besides, it is worthy of observation, that the wrath of the magistrate, unless directed against the disobedient, refusing to do their duty according to the injunction of Jehovah, is neither just, nor lawful, nor to be feared by his subjects, but Christians, in the Christian warfare, must pass through the midst of it to victory in Christ, by the power of the Spirit of God; as we see in the case of Daniel, who rose to victory through the lions’ den, with his three friends, who esteemed the wrath of the king as nothing in comparison with their duty to God, although the disobedient were threatened with a fiery furnace, the heat of which had been increased seven times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-ferme.html">Charles Ferme</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Logical Analysis of Romans (†1617) on Rom. 13:5, p. 293. Ferme (1565-1617) was a reformed Scottish divine.</cite></span></figcaption>

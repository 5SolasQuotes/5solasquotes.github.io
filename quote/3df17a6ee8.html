<main class="wrap"><figure class="quote" id="q-3df17a6ee8" data-kw="">
<blockquote><p>To take the measures of absolutely perfect happiness at the lowest, it is evident there must be absolutely perfect possession and enjoyment of complete and absolutely perfectly good; that the matter, the possession, and the enjoyment, must all be perfect, and absolutely so, to make out a happiness of this kind: the least remission or abatement in any of these, must produce a proportional diminution of happiness, and bring it down so much below perfection.

It scarcely needs any reflection to assure one, that the matter of this kind of happiness, or what raises and maintains the constant flow of pleasure, satisfaction, and delight, wherein the very nature of happiness lies, must be absolutely perfect in every view; and therefore must be such, as not only doth not admit, but most effectually excludes, every degree and every tendency toward evil, of what kind forever; such as shall furnish out, and actually maintain, in the highest degree, and with infallible certainty, complete finished pleasure, satisfaction, delight, and continue for ever to do so; and, at the same time, support the happy being in the possession and perfect exercise of all possible powers, equal, and always the fame, without decrease, intermission, or end; as nothing can be more evident, than that a failure, the least failure, in any of these, would make a flaw in the enjoyment.

That there must be at the same time an absolutely perfect possession of this fame perfect good, is as evident; and that cannot subsist without the absolute property of it, independent of, and altogether above the reach of, every other being: or, to use the Stoics phrase, The happy being must have it in himself; not in that precarious and loose manner they imagined their wise man possessed of virtue, but that it shall be as essential to, and inseparable from him, as his own being. In one word, himself must be the fund of his own happiness, and in the all-sufficient fullness of his own being, and the unbounded extent of his powers, it must lie.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-riccaltoun.html">Robert Riccaltoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Essays on Human Nature</cite>, in The Works of the Late Reverend Mr Robert Riccaltoun, Minister of the Gospel at Hobkirk (3 vols, Edinburgh: A. Murray &amp; J. Cochran, 1771-72), 1: 8-9.</span></figcaption>

<blockquote><p>Eternity is God without beginning, without end and without all manner of succession; there is nothing past, nor to come. It was well said of him, who unto the question, ‘What was eternity?’ answered by that word of modesty, ‘I know not: It is the measure (without measure) of the duration of God, according to our apprehension.’ (Quid autem sit aeternitas, quaerat aliquis? Hîc si respondeam per verbum modestiae nescio recta ingenia per se intelligent, a byssum esse.) Three things are requisite thereunto, viz. to be without beginning, without end, and without all change: An unalterable and independing duration: It is all at once, where there is nothing past, nor to come; A remaining NOW. Duration is either increated, viz. eternity, proper to God, or created, viz. eviternity, the duration of the blessed in glory: or time, which is the duration of the corruptible creature: Eternity is a duration, consisting of an eternal NOW, without beginning, and without ending; there is nothing past, nor to come. Eviternity is a duration, having a continuing NOW, with a beginning, but without ending. The duration of angels and of the blessed, in respect of their persons and substances admit of no instant concerning which it can be said that it is past: but in regard of their operations and other accidents, their duration admits of succession. Time is a successive duration, having a beginning and ending, without any remaining NOW.</p></blockquote>

<blockquote><p>41. Potency involves some imperfection if it is understood in the sense of subjective or objective potency (potential being) [see pp. 51-52] or of passive or obediential potency¹ [see pp. 52-53]; but not if it is understood as: the possible is opposed to the impossible. ¹ [See also ‘On Obediential Potency’.] The point is plain from the definitions of these potencies; for all these potencies adduced before agree in that they express the capacity of receiving some real perfection, and so that which is said to be in this sort of potency is in itself perfectible and hence in some way imperfect. Actual being on the contrary does not involve imperfection. The same must be said of the logically possible and of active potency¹ [that these do not involve imperfection]. ¹ [The importance here is because the First Cause (i.e. God) has no passive potency, or capability to be acted upon or effected, but has all active potency, that is, to act upon others. This is not special pleading for God, but is plainly necessary for what a First Cause must be. See ‘On the Distinction Between Passive Power (Denied) &amp; Active Power (Affirmed) About God’.]

42. Act and potency as constitutive principles involve imperfection insofar as they are mutually perfectible in themselves; for only the imperfect is perfectible.

43. Potential being considered in itself is not simply real, that is, does not really exist, save virtually in its causes. But it differs conceptually from the absolutely nothing and from being of reason [that which only exists in a mind]; for the idea of a possible quiddity [what-ness or essence] involves the relation of non-repugnance to existence, while the others do not.

44. Therefore that which is a potential being cannot have the reason for its existence in itself but in its cause; so the potential is the causable.

45. If something is a potential being, something else is actual. Potential being does not in fact exist; therefore if it can in fact exist, some being is required that can effect it; therefore (from conclusions 24 and 26) something actually exists, namely at least the first ineffectible efficient cause.

46. If something is in subjective, passive, objective, or obediential potency it is causable. The point is plain from the definitions, at least as concerns the real perfection to which something is in potency.

47. Therefore if something is uncausable, it is not in this sort of potency,¹ but is pure act (from negation of the previous conclusion). ¹ [The importance again, is that the First Cause (i.e. God) can have no passive potency to be acted on (which would be an imperfection), but, in the words of Wolter, has all logical potency, or active potency to cause others (which is no imperfection, but the height of perfection).]</p></blockquote>

thers+do+not.+44.+Therefore+that+which+is+a+potential+being+cannot+have+the+reason+for+its+existence+in+itself+but+in+its+cause%3B+so+the+potential+is+the+causable.+45.+If+something+is+a+potential+being%2C+something+else+is+actual.+Potential+being+does+not+in+fact+exist%3B+therefore+if+it+can+in+fact+exist%2C+some+being+is+required+that+can+effect+it%3B+therefore+%28from+conclusions+24+and+26%29+something+actually+exists%2C+namely+at+least+the+first+ineffectible+efficient+cause.+46.+If+something+is+in+subjective%2C+passive%2C+objective%2C+or+obediential+potency+it+is+causable.+The+point+is+plain+from+the+definitions%2C+at+least+as+concerns+the+real+perfection+to+which+something+is+in+potency.+47.+Therefore+if+something+is+uncausable%2C+it+is+not+in+this+sort+of+potency%2C%C2%B9+but+is+pure+act+%28from+negation+of+the+previous+conclusion%29.+%C2%B9+%5BThe+importance+again%2C+is+that+the+First+Cause+%28i.e.+God%29+can+have+no+passive+potency+to+be+acted+on+%28which+would+be+an+imperfection%29%2C+but%2C+in+the+words+of+Wolter%2C+has+all+logical+potency%2C+or+active+potency+to+cause+others+%28which+is+no+imperfection%2C+but+the+height+of+perfection%29.%5D%E2%80%9D%0A%0A%E2%80%94+Allan+B.+Wolter%2C+%E2%80%98Allan+Wolter%E2%80%99s+Conclusions+respecting+Reality%2C+Proving+God%E2%80%99%2C+%281958%29%2C+%E2%80%98Conclusions+respecting+Reality%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff37f11e482.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f37f11e482.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-god-as-pure-act/#:~:text=41.%20Potency%20involves%20some%20imperfection%20if,imperfection%2C%20but%20the%20height%20of%20perfection&amp;text=41.%20Potency%20involves%20some%20imperfection%20if%20it%20is&amp;text=is%20no%20imperfection%2C%20but%20the%20height%20of%20perfection" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

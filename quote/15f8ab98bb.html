<blockquote><p>I. The question whereby it is demanded whether God doth equally love all men, and so desire their Salvation, is an addition to the former question, and doth depend on it: For if remission of sins and Salvation are not purchased for all men by the death of Christ, it is plain that all men are not equally loved by God: wherefore these innovators do defend themselves in either question, by the same places of Scripture. …

II. Which before we demonstrate, the reader is to be admonished, that love in God is not an affection, nor passion, nor inclination of the mind, nor any desire; for God is not touched by these passions, as being impassible, and not subject to affections: But as God is said then to be angry or to hate, when he will punish or destroy; so love in God is a certain and sure will of doing good to the creature. Whence it cometh to pass, that he may rightly be said to be loved by God, to whom he hath given or hath decreed to give more and better good things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 31.1-2, pp 228-29.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cd32f57039" data-kw="">
<blockquote><p>As in the previous controversies, the rectitude of the distinction depends upon its definition: ‘it is possible to allow a voluntas conditionata [conditional will]’ in God ‘but not in an a priori and antecedent sense, as if dependent on a condition, rather in an a posteriori and consequent sense, given that some condition in the creature intervenes between the will and its execution’; and then ‘only to the extent that the condition does not belong to the internal divine act (a parte actus interni) or volition (volitionis), but to the external object (a parte obiecti externi) or thing willed (rei volitae).’ In this sense, the distinction can legitimately be applied to the promises associated with God’s covenants… the covenants of law and gospel, where God’s promises are extended conditionally to sinners… In other words, the conditional will remains an immutable will, willed eternally by God, but it is understood as being directed toward a contingent or conditional event: the condition, strictly understood, obtains, not in the divine will, but in the temporal event.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, 5. ‘Voluntas absoluta and voluntas conditionata’ in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd ed. (Baker Books, 2003), vol. 3, ch. 5.4, E. The Ad Intra–Ad Extra Distinctions, pp. 463-65, p. 464</span></figcaption>

<blockquote><p>§6. Let no one doubt that the will of God tends toward Himself: 1. Because God, in the genus of being and of goods, is the best and greatest, who adequately and intimately knows Himself as such: which knowledge with consciousness evidently presents to Him as thinking a thing exceedingly pleasing, in which He takes delight and rests—since, seeing that He absolutely possesses every reality, He sees that nothing is lacking to Him which He could desire, and thus He loves Himself, and is conscious to Himself of an acquiescence which expresses the very formal ratio of His blessedness.</p></blockquote>

<blockquote><p>673. Eze. 18:23; 33:11, ‘God will not the death.’ ‘He has no pleasure in the death of the wicked.’ Rom. 9:18, ‘He has mercy on whom He will, and whom He will he hardens.’ God will not the death of a sinner by his antecedent will, but by his consequent will, or his justice; because he justly punishes him who rejects the grace of God offered unto Him. He hardens therefore permissively, not affectively.

674. Eze. 18:23, ‘I will not the death of him that dies. Ch. 3:18, ‘Thou shalt die the death.’ God as our Father will not by the Gospel, but as He is our judge and revenger, He will by the Law, that a sinner shall die.</p></blockquote>

</figure><figure class="quote" id="q-65583f6f88" data-kw="">
<blockquote><p>Now we understand that God’s efficacious will is always infallibly fulfilled… In what sense, then, do we speak of God’s inefficacious will? This will, says Thomas (Ia, q. 19, a. 6 [Whether the Will of God is always fulfilled?], ad 1), is a conditioned will, an antecedent will, which wills all that is good in itself, independently of circumstances. Now this conditional, antecedent will remain[s] inefficacious because, in view of a higher good of which He alone is judge, God permits that this or that good thing does not come to pass. Thus, in view of that higher good , God permits to illustrate, that harvests do not reach maturity, that the gazelle becomes the prey of the lion, that the just suffer persecution, that this or that sinner dies in final impenitence. Sometimes we see the higher good in question, sometimes we cannot. In permitting final impenitence, for example, God may be manifesting infinite justice against obstinacy in evil. Such is the Thomistic distinction of antecedent (inefficacious) will from consequent (efficacious) will… To illustrate. God willed, by consequent will, the conversion of St. Paul. This conversion comes to be, infallibly but freely, because God’s will, strong and sweet, causes Paul’s will to consent freely, spontaneously, without violence, to his own conversion. God did not on the other hand will, efficaciously, the conversion of Judas, though He, conditionally, inefficaciously, antecedently, certainly willed it, and He permitted Judas to remain, freely, in final impenitence. What higher good had God in mind? This, at least: the manifestation of infinite justice. (For more extended exposition, see our work, De Deo uno, 1938, pp. 410-34; also Rev. thom., May, 1937, “Le fondement supreme de la distinction des deux graces, suffisante et efficace.”) We must add this remark: Resisting sufficient grace is an evil which comes solely from ourselves. But non-resistance is a good, which, in last analysis, comes from God, source of all good.</p></blockquote>

— Reginald Garrigou-Lagrange, Reality: a Synthesis of Thomistic Thought, (Herder Book Co., 1950), ch. 10, God’s Will &amp; God’s Love, pp. 104-5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+we+understand+that+God%E2%80%99s+efficacious+will+is+always+infallibly+fulfilled%E2%80%A6+In+what+sense%2C+then%2C+do+we+speak+of+God%E2%80%99s+inefficacious+will%3F+This+will%2C+says+Thomas+%28Ia%2C+q.+19%2C+a.+6+%5BWhether+the+Will+of+God+is+always+fulfilled%3F%5D%2C+ad+1%29%2C+is+a+conditioned+will%2C+an+antecedent+will%2C+which+wills+all+that+is+good+in+itself%2C+independently+of+circumstances.+Now+this+conditional%2C+antecedent+will+remain%5Bs%5D+inefficacious+because%2C+in+view+of+a+higher+good+of+which+He+alone+is+judge%2C+God+permits+that+this+or+that+good+thing+does+not+come+to+pass.+Thus%2C+in+view+of+that+higher+good+%2C+God+permits+to+illustrate%2C+that+harvests+do+not+reach+maturity%2C+that+the+gazelle+becomes+the+prey+of+the+lion%2C+that+the+just+suffer+persecution%2C+that+this+or+that+sinner+dies+in+final+impenitence.+Sometimes+we+see+the+higher+good+in+question%2C+sometimes+we+cannot.+In+permitting+final+impenitence%2C+for+example%2C+God+may+be+manifesting+infinite+justice+against+obstinacy+in+evil.+Such+is+the+Thomistic+distinction+of+antecedent+%28inefficacious%29+will+from+consequent+%28efficacious%29+will%E2%80%A6+To+illustrate.+God+willed%2C+by+consequent+will%2C+the+conversion+of+St.+Paul.+This+conversion+comes+to+be%2C+infallibly+but+freely%2C+because+God%E2%80%99s+will%2C+strong+and+sweet%2C+causes+Paul%E2%80%99s+will+to+consent+freely%2C+spontaneously%2C+without+violence%2C+to+his+own+conversion.+God+did+not+on+the+other+hand+will%2C+efficaciously%2C+the+conversion+of+Judas%2C+though+He%2C+conditionally%2C+inefficaciously%2C+antecedently%2C+certainly+willed+it%2C+and+He+permitted+Judas+to+remain%2C+freely%2C+in+final+impenitence.+What+higher+good+had+God+in+mind%3F+This%2C+at+least%3A+the+manifestation+of+infinite+justi

<main class="wrap"><figure class="quote" id="q-0b38dacc62" data-kw="">
<blockquote><p>This may possibly be also a new encouragement to your Majesty, who is already engaged in the work of restoring the kingdom of Christ, and to many who live under your government to further the same work. Your kingdom is extensive and renowned, and abounds in many excellencies; Christ as its chief ruler and governor, so that it may be defended by his safeguarded and protection; for to submit your sceptre to him, is not inconsistent with that elevation in which you are placed; but it would be far more glorious than all the triumphs of the world. For since among men gratitude is deemed the proper virtue of a great and exalted mind, what in kings can be more unbecoming than to be ungrateful to the Son, by whom they have been raised to the highest degree of honour? It is, therefore, not only an honourable, but more than a royal service, which raises us to the rank of angels, when the throne of Christ is erected among us, so that his celestial voice becomes the only rule for living and dying both to the highest and to the lowest. For though at this day to obey the authority of Christ is the common profession, made almost by all, yet there are very few who render this obedience of which they boast.

Now this obedience cannot be rendered, except the whole of religion be formed according to the infallible rule of his holy truth. But on this point strange conflicts arise, while men, not only inflated with pride, but also bewitched by monstrous madness, pay less regard to his unchangeable oracles of our heavenly Master than to their own vain fictions […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the epistle of Paul the apostle to the Hebrews</cite>, trans. John Owen (1549; n.p. 1853) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, pp xx-xxi.</span></figcaption>

<blockquote><p>(2) The formation of Christ’s body, to which belongs its organization, animation and the uniting of the two, body as well as soul, with the blood. 28: Query, Was Christ’s body formed in a moment or successively? Answer: Three things occur here: (1) the preparation of the material of which Christ’s body was formed; (2) the formation of the body out of the material duly prepared; (3) the completion of the same body brought gradually by its own increments to the proper stature. As regards (1) and (3) all are agreed that they were accomplished by degrees (successive). As regards (2) theologians disagree, some urging an instantaneous formation, others a successive, with the latter of whom we agree. Because: (1) the instantaneous and miraculous formation of Christ’s complete body and its union with the soul is a fiction unsupported by Scripture; (2) in his assumption of human nature Christ is said to have been made like us, except for sin; (3) if Christ’s body was completed in a moment, it could equally have been born the same moment and the Blessed Virgin need not have suffered the inconveniences of ordinary generation.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f6f09774b0" data-kw="">
<blockquote><p>The riches of the unsearchable favours of my spouse towards me have been so great, he hath made his glory to dwell so sensibly in this land, that I may boldly say, Mercy and truth righteousness and peace had never since Christ’s coming in the flesh a more glorious meeting, &amp; amiable embracing on earth, then ye have seen amongst your selves in the rough end of this northern Land: which therefore hath justly obtained (to my no small comfort) a great name among the chief Kirks and Kingdoms in the World.

A people that sat in darkness hath seen a great light, and to them who sat in the region of death light is sprung up. To what nation under heaven (when now the sun of righteousness hath shined upon the most part of the world) hath the Lord communicated the Gospel for so large a time, with such purity, fullness, prosperity, power, liberty and peace. The hottest persecutions had never greater purity, and power; the most halcyon heretical times had never more prosperity and peace; the best reformed Kirks in other places can hardly parallel your fullness and liberty.

And all these with such continuance, that not only hath he made the truth to stay with you, as he did the sun in the days of Joshua; but when the cloud of your iniquities did hasten it to go down, in his mercy hath he brought back the glorious sun by many degrees as in the times of Hezekiah. Oh that ye had known the long pleasant day of your visitation, and in this your day the things belonging unto your peace.

Christ hath not only been one, &amp; his name one, in respect of his prophetical office for your information, of his priesthood for the expiation of your sins, and intercession for you: but also hath displayed his banners; and hath shewed himself (few can say the like) a sovereign King in our Land, to govern you with his own sceptre erected in his Word, to cut off with his sword all monuments of Idolatry, and superfluity of pompous ceremonies; &amp; to restore all the means of his worship in Word, Sacraments and discipline to the holy simplicity and integrity of the first pattern shewed in the mount; from the which, by that wisdom of man which is ever foolishness with God, they had fearfully and shamefully swerved.

The sincerer sort of the bordering nations about you, have been so ravished with that beauty of the Lord upon your Sion, with that crown of glory and rich diadem by the hand of our God set upon your heads, that they have made you the meath [sic] of their religious wishes: they have with vehement desires longed to see the things that ye have seen. And have not spared to profess, that in your case, they would rather suffer themselves to be dissolved, then that one pin of that holy Tabernacle so divinely compacted should be loosed.

Within and amongst your selves that purity of profession received universally with so full consent, that Prince and Peers, Pastors and people were all for Christ, one heart &amp; one soul of those who believed, with such evidences of God’s favour that the windows &amp; gates of heaven seemed to be opened, to rain down upon this Land spiritual gifts to save you, as sometime they had been ready to pour down rain to destroy the world, every hand almost received some gift, and every head crowned with some grace, with such success that it brought a rare unity, prosperity, &amp; peace upon Kirk &amp; common wealth.

With such power and presence of the spirit of God in converting, comforting &amp; confirming his people that Satan was seen fall like lightning from heaven, the infidel and unbeliever casting himself down on his face, and confessing that undoubtedly God was amongst you, and in the middest of your meetings, as the soules of his own secret ones can best bear witnesse, who have been most submitted to that holy and happy simplicity, the effects whereof yet remaining in the hearts of many, all worldly power be it never so violent shall not be able to remove it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The speech of the Kirk of Scotland to her beloved children</cite>, (Amsterdam, 1620), pp 5-9.</span></figcaption>

<blockquote><p>Schism is a breach of unity; and therefore, there can be no schism where there ought to be no unity; yea, where there need be no unity, or where there can be no unity. Wherefore that we may understand what schism is, it is needful to consider what unity should, and must be among Churches, and among Christians. There are several sorts of unity, that we cannot have with all Churches, as local communion: some that we need not have, as identity of rites: some that we ought not to have with some Churches; as communion in false doctrine, or impure worship.</p></blockquote>

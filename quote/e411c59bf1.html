<main class="wrap"><figure class="quote" id="q-e411c59bf1" data-kw="">
<blockquote><p>…and it is most certain that angelical persons have a limited presence, because they have a finite essince [as opposed to God]… I need say no more concerning angels than what is commonly said, ‘Angeli sunt alicuoi definitive; sunt enim in suo ubi non per operationem vel circumscriptionem, sed per designationem definitivam,’ angels are naturally somewhere; though they are not in any place by extension of parts, yet their finite nature is contained within certain bounds and limits. Hence it is that some learned men affirm that it is improper to say, that God is somewhere because He is everywhere; somewhere is a definitive word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Trinunity of the Father, Son &amp; Holy Spirit</cite>, … (London, 1650), ch. 6, pp. 169-70</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ba4f7ef7f" data-kw="">
<blockquote><p>The creature is limited by the circumstance of time, by which it has its being measured out as it were by parcels, past, present and to come; it had beginning, has succession and may have an end. The most glorious angel, as well as a worm, is thus limited by time; once he was not, then he began to be; that which is past is gone, and that which is to come is not yet, and he has but a little time present. But God’s essence had no beginning, has no succession, can have no end. We cannot say of it properly: It was or shall be; but alone It is, Ex. 3:14; Jn. 8:58. He has his whole being at once; not some after, some by parcels, one following another, Gen. 21:13 and 23:33; Ps. 90:2, 24; Isa. 57:15. Eternity is the continual existence and duration of the divine essence. The creatures being is a flux or perpetual flowing from one moment to another. God is a being above time, has his being measured by time, but is wholly eternal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, (London: A.M., 1654), bk. 2, ch. 4, That God is infinite, omnipresent, eternal, pp. 148-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

<blockquote><p>14. Since they are not mere thoughts but substantial beings they exist spatially, but in such wise that space is not for them an obstructive barrier. In the same way angels exist temporally as beings created for a definite time, but in such wise that for them time never ends. … Thomas is more correct in denying that they are in a place without operating, because they are everywhere and operate by knowledge and will, even ad extra [to themselves], by glorifying God, and serving Him among men and all other creatures. So that they may be said to be in a place not because they are bounded by a place but because they themselves rather bound the place by their operation, as Thomas rightly says, 22: Therefore angels whom no medium resists must move very swiftly; much more, assuredly, than a corporeal thunderbolt, which is borne from east to west in a most destructive moment. Nor does it follow from this that angels move in a moment or by deserting their localisation acquire a new one in a moment. Although the medium is not resistant, succession is and so is a fresh act succeeding a former one, as well as the distance between the termini, which involves some measure of delay. For it is impossible that in the same nuni and present it should have a locus and when it leaves it should acquire a new one. Nor may we accept outright without a grain of salt Tertullian’s words: ‘As spirit has wings, in a moment it is everywhere.’ Heidegger (VIII, 23): ‘The duration of angels is neither eternity, which befits God alone as existing necessarily and through his nature; nor time or a continuance consisting of material things measurable by movement; or something separate (discretum), which suits things that succeed each other without continuity, not permanent things; nor a permanent instant which is defectible. Therefore what is usually attributed to them is aion, aevum, as it were aei on, always (at least a posteriori) existing, because of their prolonged duration, the origin of which man does not attain to by living, and of which there shall be no end at all.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics rev. Ernst Bizer</cite>, ed. Ernst Bizer, tr. G.T. Thomson (1861; Wipf &amp; Stock, 2007), ch. 10, ‘Angels Good &amp; Bad’, pp. 209-10 Heppe (1820–1879) was a German reformed theologian.</span></figcaption>

</figure><figure class="quote" id="q-cdea257cab" data-kw="">
<blockquote><p>XL. Our [Reformed] theologians also inquire whether angels are part of the Church. Tilenus, Polanus and others who want the Church to be taken broadly enough to include even the angels affirm this. However, the illustrious Amyraldus, in his Theses on the Parts of the Church, denies it along with many others. I think briefly that there is great communion between angels and pious and faithful men, and that Christ’s death reconciled angels to men and closely united them, making angels protectors and guardians of the faithful and promoting their salvation. But pious men form a certain society among themselves to which angels do not belong. The name ‘Church’ in Scripture is only attributed to the society of men and never includes angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church, p. 429 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

<blockquote><p>There is no created holiness sure, stable, and perfect in itself: The glorious angels which are, and ever shall be saints in Heaven, and the saints in Heaven who are like angels, stand not in that holy and happy estate by their own sufficiency, but by the decree and grace of God. Those angels which fell at first were holy, and they who now stand, might have fallen notwithstanding their created holiness, if God had not superadded confirming grace which establishes them forever. Yet this is not all, that the angels are imperfect because they might fall if not supported, there is somewhat more in it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job</cite>, … (London: 1650), sermon on Job 15:15, pp. 62-63</span></figcaption>

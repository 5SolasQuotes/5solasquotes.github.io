<main class="wrap"><figure class="quote" id="q-a0af55c8fd" data-kw="">
<blockquote><p>When in the latter part of Psalm 22 the Messiah joyfully gives a presentiment of the saving and super-abounding fruit, that, by His Sponsorial Merits and vicarious Passion, the people, given to Him by the Father to be redeemed to Himself, were going to carry off, which people were to be satisfied with the delights of the house of the Lord unto eternal life; the Messiah signifies that in the enjoyment of these spiritual benefits, to be communicated to a world brought unto a glory merited by Himself through sufferings, absolutely every distinction of peoples and nations is going to be removed; such that whatever families of the nations and those that were inhabiting the very ends of the earth were to be led to the gracious communion of God in Christ through the Spirit of faith and repentance, no less than those that were able to be named of Israel by right of birth; indeed, with the rejection of the latter having been appointed until an especially ἱκανoν/suitable time, the former are to be reputed as the Israel of God, verses 23-28.

But also, among all these nations, whichever ones might be in view, without distinction of condition, whether more sumptuous or slight, in the world, it is prophesied that they are to be made partakers of this grace, to be bequeathed in superlative abundance, verse 29: Indeed, this is not going to be the prerogative of one age or of a brief time, but through all ages succeeding one another unto the consummation of this world the seed of the Church is going to be roused, which is going to enlist under God and Christ as King, and rejoice in the privileges of the holy city, verse 30.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), preface to the reader, p. 17.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>And when the Scripture assures us that it was their practice to use Psalms and Hymns, and spiritual songs, praising God and praying unto Him in the words of David… And when we all account it our duty to praise God in singing David’s Psalms, some of which, as we use them [in the psalters they had], are of a mean composure and carry expressions beneath the majesty of Scripture; others, such as concerned the Jewish Church only; why ought not the apostles, and we as necessarily, to use this form of prayer sanctified by our Savior’s own lips?</p></blockquote>

</figure><figure class="quote" id="q-adc2d5bc08" data-kw="">
<blockquote><p>So, for that scriptural heavenly duty of singing: what more commonly alleged against it than the abuse and ill effects of that precious ordinance? How often is the nonsense and error of the common translation, the rudeness and dullness of the meter of some Psalms, as Ps. 7:13, as also the cold formality with which that ordinance is performed by many who do but parrotize? I say, how often are these things buzzed into the ears of the people to alienate their hearts from so sweet and beneficial a duty? And very often we find it urged [by Antinomians, who sometimes forsook singing public praise altogether] to the same end, how unwarrantable and dangerous a thing it is for carnal and unregenerated persons to appropriate to themselves in singing those praises and experiences which are peculiar to the saints; not understanding or considering that the singing of Psalms is an ordinance of Christ appointed for teaching and admonition, as well as praising, Col. 3:16, ‘Teaching and admonishing one another in psalms and hymns,’ etc… If Satan can prevail first with wicked men to corrupt and abuse God’s ordinances by superstitious mixtures and additions; and then with good men to renounce and slight them for the sake of those abuses; he fully obtains his design, and gives Christ a double wound at once; one by the hands of his avowed enemies, the other by the hands of his friends, no less grievous than the first. First, wicked men corrupt Christ’s ordinances, and then good men nauseate them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 3, ‘The Causes &amp; Cures of Mental Errors’, p. 476</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

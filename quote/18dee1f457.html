<blockquote><p>In fact, the times and places of religious assemblies are assuredly regarded among things indifferent; and yet, if there is no prescription in such cases, consider, I pray, what confusion and disorder would ensue?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c937f8d010" data-kw="">
<blockquote><p>All, therefore, to whom the office of teaching was committed, they called presbyters, and in each city these presbyters selected one of their number to whom they gave the special title of bishop, lest, as usually happens, from equality dissension should arise. The bishop, however, was not so superior in honour and dignity as to have dominion over his colleagues, but as it belongs to a president in an assembly to bring matters before them, collect their opinions, take precedence of others in consulting, advising, exhorting, guide the whole procedure by his authority, and execute what is decreed by common consent, a bishop held the same office in a meeting of presbyters. And the ancients themselves confess that this practice was introduced by human arrangement, according to the exigency of the times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.4.2</span></figcaption>

</figure><figure class="quote" id="q-323e74c17f" data-kw="">
<blockquote><p>A bishop ordained of God, or set up by the law of God, does declare nothing else but their calling, which by an other more special name, are called pastors, whom (says Luke [in Acts 20]) the holy Ghost has appointed bishops to feed the Church of God. And either of these names of pastor or of bishop is proper to them in the New Testament, whereby the apostle does distinguish them from apostles, prophets, and evangelists, which were callings to endure for a time, Eph. 4:11, and from deacons, 1 Tim. 3 and Phil. 1:1, for otherwise they are everywhere called elders… But they are called bishops in regard of the sheep committed unto them, as though a man should call them watchmen of [or?] overseers. These now were one alone, as where any church had but one pastor, or more if the church had more than one. And the meeting of them together jointly with their elders, whom Paul calls ‘governors’ [1 Cor. 12], of the other common name called, was the eldership. Their duty was to attend on the word and prayer, both publicly and privately, and in common to governe the Church, as appears by many places of Scripture. … Of the Bishop that is of Man The bishop that is of man, that is to say, brought into the Church by the alone wisdom of man, besides the express Word of God, is a certain power given to one certain pastor above his other fellows, yet limited with certain orders or rules provided against tyranny. They which did bear this office of bishop, are called bishops in regard of their fellow elders and the whole clergy, as watchmen set over the clergy. That this calling was not brought in by the Word, it is manifest by that, that there is not to be found in the New Testament so much as one syllable, whereby there may be the least surmise of any such thing. For although we doubt not, but all things ought to be done orderly in the Lord’s house, and therefore that some one should be president in every assembly… … The Answer to the First Question Where as Satan’s bishop has been the overthrow of the Church and all Christian kingdoms, whose head is the Roman Antichrist, it is to be looked unto of all hands, especially of all godly princes, that they at once abolish it, if they mind the reformation of the Church and their own safety. As for the bishop ordained by man and brought into the Church by little and little, whereby Satan made him a way for greater things, it had been tolerable… experience of so many ages does teach us too well, that unless this root also be plucked up, it will come to pass that the same fruit will sprout and bud forth again. Finally, seeing the Lord has so often decided this controversy of superiority among his own disciples, that He shut it clean out, seeing the rule both for doctrine and good order of the Church is to be sought for out of the very writings of the apostles: and it is manifested, the churches then prospered, when all this authority of one man over the rest, yet was not, but as that grew up, so all things fell to decay. Finally, seeing where the remnants of this government by a few are not clean taken away, the work of the Lord, is openly hindered: Our judgement is that after the chasing away of this device of man, the churches shall be well provided for, if they may be repaired according to the writings of the apostles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Judgment of a Most Reverend &amp; Learned Man from Beyond the Seas Concerning a Threefold Order of Bishops</cite>, [of God, of Man, of the Devil], with a Declaration of Certain Other Weighty Points Concerning the Discipline &amp; Government of the Church ([London, 1585]) 43, pp. ToC</span></figcaption>

e+whole+clergy%2C+as+watchmen+set+over+the+clergy.+That+this+calling+was+not+brought+in+by+the+Word%2C+it+is+manifest+by+that%2C+that+there+is+not+to+be+found+in+the+New+Testament+so+much+as+one+syllable%2C+whereby+there+may+be+the+least+surmise+of+any+such+thing.+For+although+we+doubt+not%2C+but+all+things+ought+to+be+done+orderly+in+the+Lord%E2%80%99s+house%2C+and+therefore+that+some+one+should+be+president+in+every+assembly%E2%80%A6+%E2%80%A6+The+Answer+to+the+First+Question+Where+as+Satan%E2%80%99s+bishop+has+been+the+overthrow+of+the+Church+and+all+Christian+kingdoms%2C+whose+head+is+the+Roman+Antichrist%2C+it+is+to+be+looked+unto+of+all+hands%2C+especially+of+all+godly+princes%2C+that+they+at+once+abolish+it%2C+if+they+mind+the+reformation+of+the+Church+and+their+own+safety.+As+for+the+bishop+ordained+by+man+and+brought+into+the+Church+by+little+and+little%2C+whereby+Satan+made+him+a+way+for+greater+things%2C+it+had+been+tolerable%E2%80%A6+experience+of+so+many+ages+does+teach+us+too+well%2C+that+unless+this+root+also+be+plucked+up%2C+it+will+come+to+pass+that+the+same+fruit+will+sprout+and+bud+forth+again.+Finally%2C+seeing+the+Lord+has+so+often+decided+this+controversy+of+superiority+among+his+own+disciples%2C+that+He+shut+it+clean+out%2C+seeing+the+rule+both+for+doctrine+and+good+order+of+the+Church+is+to+be+sought+for+out+of+the+very+writings+of+the+apostles%3A+and+it+is+manifested%2C+the+churches+then+prospered%2C+when+all+this+authority+of+one+man+over+the+rest%2C+yet+was+not%2C+but+as+that+grew+up%2C+so+all+things+fell+to+decay.+Finally%2C+seeing+where+the+remnants+of+this+government+by+a+few+are+not+clean+taken+away%2C+the+work+of+the+Lord%2C+is+openly+hindered%3A+Our+judgement+is+that+after+the+chasing+away+of+this+device+of+man%2C+the+churches+shall+be+well+provided+for%2C+if+they+may+be+repaired+according+to+the+writings+of+the+apostles.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+The+Judgment+of+a+Most+Reverend+%26+Learned+Man+from+Beyond+the+Seas+Concerning+a+Threefold+Order+of+Bishops+%5Bof+God%2C+of+Man%2C+of+the+Devil%5D%2C+with+a+Declaration+of+Certain+Other+Weighty+Points+Concerning+the+Discipline+%26+Government+of+the+Church+%28%5BLondon%2C+1585%5D%29+43%2C+pp.+ToC&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F323e74c17f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/323e74c17f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/prelacy#:~:text=A%20bishop%20ordained%20of%20God%2C%20or,to%20the%20writings%20of%20the%20apostles&amp;text=A%20bishop%20ordained%20of%20God%2C%20or%20set%20up&amp;text=repaired%20according%20to%20the%20writings%20of%20the%20apostles" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-539a4a77bc" data-kw="">
<blockquote><p>As Baillie explained, there were certain cases of necessity in which a presbytery could deem it expedient to appoint a temporary bishop, either to prevent schism schism and preserve the unity of the national church or to preside over an ecclesiastical assembly as moderator… The type of ‘superintendent’ of which Baillie approved in the ancient church was never granted powers of order or jurisdiction that were not also given to preaching presbyters… Ordination was given by divine right to the presbytery of Ephesus–not just the meeting of presbyters but the ‘office and grade of presbyter’ as described by St Jerome and Calvin–which continued to exist even after the ordination of Timothy as a bishop; a delegation, rather than relegation of powers of jurisdiction. Acts 20:17 and 28 both outlined the divine warrant of temporary, ambulatory pastors who were ‘given the power of determining doctrine and expelling heretics from the church by the Sacred Spirit’. Yet Baillie quickly affirmed that the superiority maintained in these loci were during periods when the church’s polity was in flux.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-campbell.html">Alexander Campbell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Episcopacy in the Mind of Robert Baillie</cite>, 1637-1662’ The Scottish Historical Review, vol. 93, no. 236, pt. 1 (April 2014), pp. 29-55, p. 49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

0were%20certain,the%20church%E2%80%99s%20polity%20was%20in%20flux&amp;text=As%20Baillie%20explained%2C%20there%20were%20certain%20cases%20of&amp;text=periods%20when%20the%20church%E2%80%99s%20polity%20was%20in%20flux" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The Dutch superintendens are as like to English bishops as an emperor in the days of Fabius Maximus, when the senate ruled all, to an emperor in the days of Tiberius or Nero, when an absolute prince, I will not say a tyrant, did govern all at his pleasure. The name is one, but the things are essentially different, and so far distant as the East is from the West.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d8438f77a1" data-kw="">
<blockquote><p>But the Papists are doubly foolish, when they conclude from this passage, that no interpretation of a private man ought to be deemed authoritative. For they pervert what Peter says, that they may claim for their own councils the chief right of interpreting Scripture; but in this they act indeed childishly; for Peter calls interpretation private, not that of every individual, in order to prohibit each one to interpret; but he shews that whatever men bring of their own is profane.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, 2 Peter 1:20</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-76a5437c2b" data-kw="">
<blockquote><p>We do not deny that there can be in the church a ministerial and secondary judge, who can officially moderate controversies over the faith by the Word of God, but we hold that the Holy Spirit, as its source, teaches us the true interpretation of Scripture where inner assurance is concerned. We deny that any supreme and infallible judge except Scripture need be sought with regard to external proof of the object, much less that the pope, who assumes such a task, is to be accepted. We believe that Scripture alone, or God speaking in it, is enough.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.7</span></figcaption>

</figure><figure class="quote" id="q-40145f457d" data-kw="Authority of Scripture">

</figure><figure class="quote" id="q-ca480713e5" data-kw="">
<blockquote><p>Providence without the word is a dark enigma. None can solve it. The best commentary on Providence is the Bible. The best commentary on the Bible is Providence. The events of a godly man&#x27;s life are to him the fulfillings of the Scriptures. In a thousand ways they teach him the true sense of promises and threatenings, predictions and narratives, precepts and doctrines. They mightily confirm his belief of the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-s-plumer.html">William S. Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jehovah-Jireh: A Treatise on Providence</cite>, ch. “The Special Kindness of Providence Towards Godly Men”</span></figcaption>

</figure><figure class="quote" id="q-f4b69291f9" data-kw="">
<blockquote><p>To ascertain the true sense of the Scriptures, interpretation is needed. … It is not to be sought by each man&#x27;s private judgment (which is the idia epilysis condemned by Peter), but is to be gathered from the Scriptures themselves as their own best and surest interpreter (Neh. 8:8; Acts 17:11). But for this, after fervent prayer to God, there is need of an inspection of the sources, the knowledge of languages, … collation of passages, … and conformity of the interpretation to the analogy of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.19.18</span></figcaption>

<main class="wrap"><figure class="quote" id="q-7a453daf52" data-kw="">
<blockquote><p>As from the doctrine of the Church in general, so from the parts thereof, do many both learned and ignorant take occasion of offence; as first, from the doctrine of God’s predestination, whereby we teach that God hath decreed the condemnation of some. This doctrine many do renounce, as a doctrine of cruelty, and thereupon frame unto themselves private opinions, which will not stand with the word of God.

The way to avoid this occasion of offence, is this; First, to grant unto God himself so much in this case, as we will yield to mortal man in the like. Among our selves we allow of this liberty one to another, that a man may kill a fly, or a worm; and for his lawful use and pleasure, kill sheep, oxen, and other creatures, and yet be a merciful man: shall we not then allow unto God, that he may glorify his name, in the just and deserved condemnation and destruction of his creature? This is less then we grant to men, for a worm is something unto man; but a man is nothing in respect of God. Again, among our selves, in some things we give liberty one to another to do as we will, and yet think the action just and lawful; much more then ought we to give freedom of will unto God in all his actions, without conceit of cruelty in any one of his works; for all his works are done in equity.

Secondly, it must be remembered, that we teach not, that God doth simply ordain some men to hell fire: but touching reprobation, our doctrine is this: that God hath decreed and purposed to glorify his name, in the due and deserved condemnation of some: for in man’s reprobation? God hath two actions: First, he decrees to pass by some men, without shewing his eternal mercy unto them, and only to declare his justice upon them; then after he decrees, when they are by themselves fallen into sin, to inflict upon them deserved condemnation for the same.

The unlearned also, from this doctrine of Predestination, take occasion of most fearful falling; for thus they reason: If I be predestinate to salvation, I am sure to be saved, let me do what I will; and if I be predestinated to condemnation, I am sure to be condemned, though I live never so godly; for God’s decree changeth not, and therefore I will live as I list. Thus do desperate persons embolden themselves to sin, and to cast away their souls.

The way to cut off this offence is this; they must remember, that in God’s decree, the end, and the means that bring men to that end, go always together: and therefore, that such as are ordained to salvation, are ordained to the means thereof; namely to vocation, justification, &amp; sanctification, Rom. 8. 30. The end and the means in Gods decree must never be severed: Now righteousness and holiness in Christ, is the means whereby God hath decreed to bring men to salvation: and therefore they sin grievously, that upon the immutability of God’s decree, take occasion to live profanely.

Hezekias is sick unto death, yet God promiseth to add unto his days fifteen years: now if Hezekias had consulted with these men, they would have told him thus; be of good cheer O King, neither eat nor drink, nor use any thing to cure thy sore, or to preserve life: for thou shalt certainly live fifteen years; God hath said it, and it must be done: but Hezekias taketh no such course: nay, he useth the means both to cure his sore, and to preserve his life. And so did Paul, for his own and others preservation, keep the mariners in the ship, who were the means upon the sea to bring them safe to land, though God had given unto him all that sailed with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A godly and learned exposition of Christ’s Sermon in the Mount</cite>, (Cambridge: University of Cambridge, 1608), pp 132-34.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bae62eb49e" data-kw="">
<blockquote><p>Of this intellectual treasure house [the conscience], we are to know these: 1. That in the inner cabinet, the natural habit of moral principles lodges, the register of the common notions left in us by nature, the ancient records and chronicles which were in Adam’s time, the Law of Nature of two volumes: One of the first table, that there is a God, that He creates and governs all things, that there is but one God, infinitely good, more just rewarding the evil and the good; And of the second table, as to love our parents, obey superiors, to hurt no man, the acts of humanity; All these are written in the soul, in deep letters, yet the ink is dim and old, and therefore this light is like the moon swimming through watery clouds, often under a shadow, and yet still in the firmament. Caligula, and others, under a cloud, denied there was any God, yet when the cloud was over, the light broke out of prison, and granted, a God there must be; strong winds do blow out a torch in the night, and will blow in the same light again; and that there be other seeds, though come from a far land, and not growing out of the ground, as the former, is clear, for Christ scatters some Gospel-truths in this chalmer [chamber]; as John 7:28, ‘Then cried Jesus in the Temple; as He taught, saying, Ye both know Me, and whence I am.’ John 15:24, ‘But now they have both seen, and hated both Me and my Father.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (1649), ch. 1, ‘Of Conscience &amp; its Nature’</span></figcaption>

</figure><figure class="quote" id="q-a9aceb5085" data-kw="">
<blockquote><p>Nay suppose some should so extol the fullness and sufficiency of the Scriptures that they should hold them so perfect and sufficient for all Christians as to be a perfect rule for all civil government, and that Chrstian commonwealths ought to be governed by laws only there recorded and by no other (which opinion in substance Carolostadius held; that in courts of justice judges should not proceed according to humane laws, but according to the law of Moses; and so for military practices, should hold all the way of war must be founded upon the Scriptures, and thereupon should clamor against any other art and way of war than what was practised there. What would you reply to these men, or what strength were there in such principles? Would not you answer them in what sense the Scriptures were perfect, and how they must understand it?</p></blockquote>

they%20must%20understand%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Even as we say of the Judicial Law, though the particular duty or punishment may not oblige us Christians, yet the moral equity and reason, upon which it was grounded, does.</p></blockquote>

</figure><figure class="quote" id="q-4d4d76bc79" data-kw="">
<blockquote><p>Vice prevailing greatly weakens a people and makes them far less able to uphold and defend themselves. It weakens them as it enfeebles their bodies, and so renders them the more unfit for the fatigue and hardship and warlike achievements necessary for the defence of a nation. It weakens them, as it thins their numbers. Proverbs 14:28, “In the multitude of people is the king’s honour: but in the want of people is the destruction of the prince.”

It weakens them as it enfeebles their minds and renders them effeminate. It weakens them as it consumes their wealth. The strength and power of a nation or kingdom consists very much in their wealth. It has ever been found by experience that nations or kingdoms [that] have been very much overrun with luxury and sensuality, that they have declined and have been an easy prey to their enemies.

Thus sin is a reproach to any people, as they thereby lose their power and influence, and so lose their honour and expose themselves to [the] contempt and the insults of their neighbours; and often by this means are reduced from a prosperous and flourishing state, to become subjects and slaves to foreigners’ honour.</p></blockquote>

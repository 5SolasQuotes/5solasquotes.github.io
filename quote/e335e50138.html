<blockquote><p>Aquinas and other Scholastic philosophers often employ the principle agere sequitur esse (Latin for “action follows being”). The basic idea is that what a thing does necessarily reflects what it is. Eyes and ears function differently because they are structured differently. Plants take in nutrients, grow, and reproduce while stones do none of these things, because the former are living things and the latter are inanimate… The PPC [Principle of Proportionate Causality] tells us, again, that whatever is in the thing that changes or comes to exist must in some way have been in the total set of factors that brought about this change or existent. In this sense, the effect cannot go beyond the cause. A formal cause is the nature of a thing, that which makes it the kind of thing it is… The principle agere sequitur esse basically says that these attributes and activities cannot go beyond that nature, any more than an effect can go beyond its efficient cause. Hence, a stone cannot exhibit attributes and activities like nutrition, growth, and reproduction, because these go beyond the nature of a stone. Anything that could do these things wouldn’t be a stone in the first place. The principle agere sequitur esse, like the PPC, follows from the PSR [Principle of Sufficient Reason, that everything has a sufficient reason for it]. If an effect could go beyond its total efficient cause, then the part of the effect that went beyond it would have no explanation and be unintelligible. Similarly, if a thing’s activities could go beyond its nature—if, for example, a stone could take in nutrients or use language—then this activity would lack an explanation and be unintelligible… …even a materialist could agree that if intellectual activity were immaterial, then the thing which carries out that activity would itself have to be immaterial. And indeed, the naturalist philosopher John Searle takes precisely that view in criticizing a theory known as property dualism. Property dualism holds that mental properties are immaterial but that they are nevertheless properties of a material thing —namely, the brain. The theory is essentially an attempt to acknowledge the problems with materialist theories of the mind without having to accept the dualist view that the mind is an immaterial thing. Searle’s criticism is that the theory is unstable. If the property dualist maintains that a mental property is something ‘over and above’ the brain, then the trouble in Searle’s view is that such a property cannot be a property of the brain, but must be ‘a separate thing, object, or non-property type of entity’. On the other hand, if a mental property really is a property of the brain, then it cannot be something ‘over and above’ the brain. Other critics of property dualism have complained that it is mysterious how an entirely material thing like the brain could give rise to immaterial properties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God</cite>, (Ignatius Press, 2017), ch. 6</span></figcaption>

ks Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6faf9d6c2b" data-kw="">
<blockquote><p>Human acts are the acts of the will directed by reason. They are either elicited, that is, produced by the will itself, or commanded, that is, produced by some other faculty under the influence of the will. Elicited acts are concerned either with the end or with the means. Three acts are concerned with the end: a) simple velleity, not yet efficacious; b) efficacious intention of the end; c) joy in the end attained. Two acts are concerned with means: a) consent, which accepts means; b) choice of a determined set of means. Each of these five acts of the will is preceded by a directive act of the intellect. Simple velleity, by the knowledge of the good in question; intention, by a judgment that this end should be attained; consent, by counsel; choice, by the last practical judgment which terminates deliberation. After voluntary choice there follows, in the intellect, the act called imperium, which directs the execution of the means chosen, ascending from lower means to those higher and nearer to the end to be obtained, in order inverse to that of intention, which descends from the desired end to the means which come first in execution. After the intellect’s imperium there follows in the will the act called active use, which sets the other faculties to work. These acts of the other faculties, called passive use, are, properly speaking, commanded acts of the will. And the will’s last act is that of joy in the possession of the end obtained. The end, which was first in the order of intention, is the last in the order of execution. … By the term ‘interior’ act St. Thomas often means an act which does not arise from a previous act, the first act, for example, of willing an end. By opposition, then, ‘exterior act’ often means not only the act of the corporeal members, but also an act of the will itself, if this act arises from a preceding act, as when, for example, we will the means because we already will the end. Here we must remark, further, that a human act, voluntary and free, is not necessarily preceded, if we speak precisely, by a discursive deliberation, but may be the fruit of a special inspiration, superior to human deliberation. But, even here, the act is free… because the will consents to follow the inspiration. Here lies the difference between the virtue of prudence, which presupposes discursive deliberation, and the gifts which make man prompt and docile to the inspirations of the Holy Ghost. These latter acts, free but not in the proper sense deliberate [deliberative], are the fruit, as we shall see later, not of co-operating grace, but of operating grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (St. Louis: Herder, 1950), ch. 46, ‘Human Acts’, pp. 278-80 Lagrange was a Neo-Thomist.</span></figcaption>

<blockquote><p>V… This naturally raises the question: Did the first man have the potential to believe in Christ? The answer, affirming against Socinians and Remonstrants, is yes. His mind was adorned with clarity, and his will with sanctity, which could have produced faith in Christ if Christ had been revealed to him as an object, which was possible. Even Adam’s faith in God did not differ essentially from ours but only in its special object; this difference does not alter the nature of faith but confirms it, much like certain precepts of the law aligned with the Gospel in their broader sense. An objection arises: Could Adam have believed in Christ at some point, which seems absurd? The response distinguishes between potential as cause and potential as effect. In the former, considered in a divided sense regarding the simultaneity of potentials, he could have; but in the latter, in a composed sense regarding the simultaneity of action (κρινόμενον), he could not have immediately believed that Christ’s righteousness would be imputed to him because his state and its economy (οἰκονομία) did not allow it. This follows no more than arguing from God’s absolute potential to its actual exercise under His decree. Thus, from these considerations, we conclude that faith in Christ could justly be demanded from us under the first covenant [i.e. of Works], even though we are utterly powerless. Furthermore, in his will, a second kind of soul’s life shone without blemish, more admirable than any star. The will could righteously bear whatever the divinely illuminated practical intellect had judged and approved, and thus we consider that the free will of that state must be regarded in the moral sense.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“V… This naturally raises the question: Did the first man have the potential to believe in Christ? The answer, affirming against Socinians and Remonstrants, is yes. His mind was adorned with clarity, and his will with sanctity, which could have produced faith in Christ if Christ had been revealed to him as an object, which was possible. Even Adam’s faith in God did not differ essentially from ours but only in its special object; this difference does not alter the nature of faith but confirms it, much like certain precepts of the law aligned with the Gospel in their broader sense. An objection arises: Could Adam have believed in Christ at some point, which seems absurd? The response distinguishes between potential as cause and potential as effect. In the former, considered in a divided sense regarding the simultaneity of potentials, he could have; but in the latter, in a composed sense regarding the simultaneity of action (κρινόμενον), he could not have immediately believed that Christ’s righteousness would be imputed to him because his state and its economy (οἰκονομία) did not allow it. This follows no more than arguing from God’s absolute potential to its actual exercise under His decree. Thus, from these considerations, we conclude that faith in Christ could justly be demanded from us under the first covenant [i.e. of Works], even though we are utterly powerless. Furthermore, in his will, a second kind of soul’s life shone without blemish, more admirable than any star. The will could righteously bear whatever the divinely illuminated practical intellect had judged and approved, and thus we consider that the free will of that state must be regarded in the moral sense.”

— Andreas Essenius, ‘Theological Disputation on the Image of God in Man’ Download tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CV%E2%80%A6+This+naturally+raises+the+question%3A+Did+the+first+man+have+the+potential+to+believe+in+Christ%3F+The+answer%2C+affirming+against+Socinians+and+Remonstrants%2C+is+yes.+His+mind+was+adorned+with+clarity%2C+and+his+will+with+sanctity%2C+which+could+have+produced+faith+in+Christ+if+Christ+had+been+revealed+to+him+as+an+object%2C+which+was+possible.+Even+Adam%E2%80%99s+faith+in+God+did+not+differ+essentially+from+ours+but+only+in+its+special+object%3B+this+difference+does+not+alter+the+nature+of+faith+but+confirms+it%2C+much+like+certain+precepts+of+the+law+aligned+with+the+Gospel+in+their+broader+sense.+An+objection+arises%3A+Could+Adam+have+believed+in+Christ+at+some+point%2C+which+seems+absurd%3F+The+response+distinguishes+between+potential+as+cause+and+potential+as+effect.+In+the+former%2C+considered+in+a+divided+sense+regarding+the+simultaneity+of+potentials%2C+he+could+have%3B+but+in+the+latter%2C+in+a+composed+sense+regarding+the+simultaneity+of+action+%28%CE%BA%CF%81%CE%B9%CE%BD%CF%8C%CE%BC%CE%B5%CE%BD%CE%BF%CE%BD%29%2C+he+could+not+have+immediately+believed+that+Christ%E2%80%99s+righteousness+would+be+imputed+to+him+because+his+state+and+its+economy+%28%CE%BF%E1%BC%B0%CE%BA%CE%BF%CE%BD%CE%BF%CE%BC%CE%AF%CE%B1%29+did+not+allow+it.+This+follows+no+more+than+arguing+from+God%E2%80%99s+absolute+potential+to+its+actual+exercise+under+His+decree.+Thus%2C+from+these+considerations%2C+we+conclude+that+faith+in+Christ+could+justly+be+demanded+from+us+under+the+first+covenant+%5Bi.e.+of+Works%5D%2C+even+though+we+are+utterly+powerless.+Furthermore%2C+in+his+will%2C+a+second+kind+of+soul%E2%80%99s+life+shone+without+blemish%2C+more+admirable+than+any+star.+The+will+could+righteously+bear+whatever+the+divinely+illuminated+practical+intellect+had+ <blockquote><p>Therefore choice, arbitrium (an excessively proud term, in Greek αὐτεξούσιον), naturally considered, is the faculty of intellect and will by which we do what we want, by preceding counsel and judgment, such that we are not determined by any other created cause. It pertains to the intellect and will in such a way that the intellect judges and shows what should be done, but the will commands what is shown and judged, and thus at root it has reference to the intellect, but formally it has reference to the will. This certainly implies some indifference, in a divided sense, as they say, by which, with the consideration of the divine decree and predetermination set aside, man is indifferent at least by nature to acting or not acting; yet he is not indifferent in a composite sense, with regard to the divine decree and its predetermining providence, but is already determined virtually to one or the other; much less does choice consist in indifference itself. For in this way neither God, nor angel, nor any man, regenerate or unregenerate, would possess free choice, and consequently free choice would be a non-entity. For God is determined to good… And so arbitrium, choice, is more correctly said to consist in the power of acting from counsel and προαίρεσις, free choosing, or what is the same thing, in rational complacency.</p></blockquote>

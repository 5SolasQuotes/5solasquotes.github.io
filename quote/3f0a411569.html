<main class="wrap"><figure class="quote" id="q-3f0a411569" data-kw="">
<blockquote><p>In vain [it is] to participate of those mysteries of our salvation, the body and blood of our Lord, till first by self-examination we have cast out the venom of our sinful doings by repentance and steadfast purposes of amendment. In a word, it is our sins unrepented that make void and ineffectual all the blessed means of grace and of the Spirit; by those it is we quench the Spirit, we grieve the Spirit, we resist the Spirit, we provoke the Spirit (1 Thess. 5:19; Eph. 4:30), and poison the blessed nature of life; so that all the conveyances of the Spirit are barren and unfruitful whilst they reflect upon hardened and impenitent hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sherlock.html">Richard Sherlock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers’ Wild Questions Objected against the Ministers of the Gospel</cite>, … with Brief Answers Thereunto... (London: Cotes, 1654) Sherlock (1612–1689) was an Anglican clergyman., p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-afa1392f2c" data-kw="">
<blockquote><p>A second question is, How far the Law can draw a sinner to Christ? Antinomians tell us of a legal drawing and conversion, and of an evangelic drawing; the legal drawing they say is ours [that of the reformed]; the latter theirs. Assertion 1. The difference between the letter of the Law and the Gospel is not in the manner of working, for the letter of either Law or Gospel is alike ineffectual and fruitless to draw any to Christ. Christ preached the Gospel to hard-hearted Pharisees; it moved them not. Moses preached the Law and the curses thereof to the stiffnecked Jews and they were as little humbled. Sounds and syllables of ten hells, of twenty heavens and Gospels, without the Spirit’s working, are alike fruitless. And we grant the Law is a sleepy keeper of a captive sinner; he may either steal away from his keeper or if he be awed with his keeper, he is not kept from any spiritual, internal breach of the Law, nor moved thereby to sincere and spiritual walking. But the difference between Law and Gospel is not in the internal manner of working, but in two other things:

1. In the matter contained in Law and Gospel: because nature is refractory to violence and the Law can do nothing but curse sinners; therefore it can draw no man to Christ. The Gospel again contains sweet and glorious promises of giving a new heart to the elect, of admitting to the Prince of peace laden and broken-hearted mourners in Zion and in conferring on them a free imputed righteousness; and this is in itself a taking-way, but without the Gospel-spirit [it is] utterly ineffectual.

2. To the Gospel there is a Spirit added, which works as God does with an omnipotent pull; and this Spirit does also use the Law to prepare and humble; though this be by a higher power than goes along with the Law as the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London: 1647), pp. 272-318</span></figcaption>

</figure><figure class="quote" id="q-76c6f8bafd" data-kw="">
<blockquote><p>Creation, Providence and Redemption, considered as they are in God, i.e. as immanent acts, belong unto God’s sufficiency and may be placed amongst his attributes; but if they be looked at as transient acts, i.e. as acts passing, and done in time; so they belong unto God’s efficiency, and are placed amongst the works of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, ... (London: 1654), ch. 1, Of the Divine Essence, p. 14</span></figcaption>

</figure><figure class="quote" id="q-57db1848de" data-kw="">
<blockquote><p>1. Because out of the amiable invitation, this only is concluded: the simple obligation of the creature to obedience, an earnest approbation and complacency which God has with respect to the obedience, inasmuch as the thing is holy, has been required of him, is morally pleasing, and as it is unto the convenience and salvation of a man. On account of this disposition in God, nothing is further added by the simple complacency of God around obedience except a certain quasi-intention and vehemency of divine obligation to the thing, which testifies to the obedience of all by an earnestness from the precept and from having obliged men to the thing; and thus it is to Him singularly and vehemently pleasing in his sight inasmuch as salvation is made glorious to men; but except He decree it, by the corruption of men, it will not come to be.</p></blockquote>

<blockquote><p>13. In the same way too it cannot be concluded that because the outward calling of the rejected is ineffectual it is therefore not seriously meant by God. Outward calling is always per se [of itself, in principle] a real calling to salvation, since everyone who follows it up thereby gains righteousness in Christ and eternal life: only, in the case of the godless, it is ineffectual because of their hardness of heart. Similarly, the calling from God’s side is always seriously intended, since God promises grace even to the rejected upon condition of faith, and makes faith for them a duty. But of course God omits to give faith to the rejected, because He is not bound to do so in the case of any man… From this it follows that even the calling of the godless is on God’s side ‘sincere and serious’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics rev. Ernst Bizer</cite>, tr. G.T. Thompson (1861; 1950; Wipf &amp; Stock, 2007), p. 517</span></figcaption>

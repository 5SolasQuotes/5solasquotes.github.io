<blockquote><p>by way of precept there is an absolute necessity of uniting laid upon the Church, so that it falls not under debate whether a Church should continue divided or united in these [in thesis]… seeing that union is both commanded as a duty and commanded as eminently tending to the edification of the Church, and therefore is so frequently joined with edification? Nor is it to be asked by a Church what is to be done for the Church’s good in a divided way, thereby supposing a dispensation, as it were, to be given to division and a forbearing of the use of means for the attaining thereof; or rather supposing a stating or fixing of division, and yet notwithstanding thereof, thinking to carry on edification?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, ... (Edinburgh: Higgins, 1659), pt. 4, ch. 7, pp. 315-16</span></figcaption>

— John Currie, An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAn+ungrounded+and+causeless+separation+from+their+lawful+pastor+or+parish-church+was+what+the+primitive+Christians+commonly+termed+schism%2C%E2%80%9D%0A%0A%E2%80%94+John+Currie%2C+An+Essay+on+Separation%3A+or+a+Vindication+of+the+Church+of+Scotland+contra+the+Seceders&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F568ec73ed9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/568ec73ed9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/john-currie-essay-on-separation-or-a-vindication-of-the-church-of-scotland-contra-the-seceders/#:~:text=An%20ungrounded%20and%20causeless%20separation%20from,the%20primitive%20Christians%20commonly%20termed%20schism&amp;text=An%20ungrounded%20and%20causeless%20separation%20from%20their%20lawful&amp;text=was%20what%20the%20primitive%20Christians%20commonly%20termed%20schism" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ac4705b8fe" data-kw="">
<blockquote><p>For the erecting of a Church within a presbyterian Church, I must say that it is a novation with a witness. Our friends express much zeal for the obligation of our covenants (which I acknowledge is inviolable) and therefore I would recommend to their serious views that article of our National Covenant, whereby we abjure all novations contrary to our received standards. Sure I am, our old covenanters were not of their mind. I know no precedent for their way amongst us save this one, of which I think they will not be very fond, namely, that of the Public Resolutioners, who were the first that ever pretended to set up distinct judicatories in this Church: The Protesters sat with them in judicatories without any hesitation, and pressed to continue, and to act a faithful part as it might please the Lord to guide them, they were the separatists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-3051b669e2" data-kw="">
<blockquote><p>…the decision of a Convention of Estates, or Parliament, in June to levy a ‘cess’, or tax, for the express purpose of raising additional troops to suppress the field-meetings. To Hamilton in particular, opposition to this tax became a test of orthodoxy, on a par with opposition to the indulgence. There is considerable evidence that in the summer and autumn of 1678 both he and Kersland sought to influence the younger field-preachers to adopt an increasingly militant tone in their preaching, and to condemn both those who payed the ‘cess’ and the ministers who had accepted the Indulgence. It is also clear that during this period both Hamilton and Kersland became increasingly associated with Richard Cameron… Throughout the 1670’s it had been customary for the leading field-preachers, such as John Welsh, to be accompanied by armed bodyguards as they moved around the country. This was seen as a necessary precaution for their own safety… Having attached himself to Cameron, Hamilton concluded that Cameron too should enjoy the same protection. He therefore gathered a body of men… whom he engaged to accompany Cameron around the country… Hamilton himself assumed the command of this group. A show of military order was observed, though neither Hamilton himself, nor, it apprears, any of those whom he led, had any military experience. However, it satisfied Hamilton’s fondness for demonstration and for display, and it was, of course, fully consistent with the militant approach which he advocated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron</cite>, (Durham: Evangelical Press, 1997), pp. 100-101</span></figcaption>

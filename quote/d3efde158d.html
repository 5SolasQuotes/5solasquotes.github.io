<blockquote><p>Argument 8— He who, by office, is obliged to expend himself, and to give his life for the safety of the people, must be inferior to the people. So Christ says, the life is more than raiment or food, because both these give themselves to corruption for man’s life; so the beasts are inferior to man, because they die for our life, that they may sustain our life. And Caiaphas prophesied right, that it was better that one man die than the whole nation perish (John 11:50); and in nature, elements, against their particular inclination, defraud themselves of their private and particular ends, that the commonwealth of nature may stand; as heavy elements ascend, light descend, lest nature should perish by a vacuity. And the good Shepherd (John 10) gives his life for his sheep; so both Saul and David were made kings to fight the Lord’s battles, and to expose their lives to hazard for the safety of the church and people of God. But the king, by office, is obliged to expend his life for the safety of the people of God; he is obliged to fight the Lord’s battles for them; to go betwixt the flock and death, as Paul was willing to be spent for the church. It may be objected, Jesus Christ gave Himself a ransom for his church, and his life for the life of the world, and was a gift given to the world (John 3:16; 4:10) and He was a mean to save us; and so, what arguments we have before produced to prove that the king must be inferior to the people, because he is a ransom, a mean, a gift, are not conclusive, I answer: 1. Consider a mean reduplicatively, and formaliter, [formally] as a mean; and secondly, as a mean materially, that is, the thing which is a mean. 2. Consider that which is only a mean and ransom, and gift, and no more; and that which, beside that it is a mean, is of a higher nature also. So Christ formally as a mean, giving his temporal life for a time, according to the flesh, for the eternal life of all the catholic Church, to be glorified eternally—(not his blessed Godhead and glory, which, as God, He had with the Father from eternity)— in that respect Christ has the relation of a servant, ransom, gift, and some inferiority in comparison of the Church of God; and his Father’s glory, as a mean, is inferior to the end; but Christ materially, in concreto [in particular, materially]: Christ is not only a mean to save his Church, but, as God (in which consideration He was the immortal Lord of life) He was more than a mean— even the Author, Efficient and Creator of heaven and earth; and so there is no ground to say that He is inferior to the Church, but the absolute head, king— the chief of ten thousand— more in excellency and worth than ten thousand millions of possible worlds of men and angels. But such a consideration cannot befall any mortal king; because, consider the king materially as a mortal man, he must be inferior to the whole church, for he is but one, and so of less worth than the whole church; as the thumb, though the strongest of the fingers, yet it is inferior to the hand, and far more to the whole body, as any part is inferior to the whole. Consider the king reduplicative and formally as king, and by the official relation he has, he is no more than but a royal servant, an official mean tending, ex officio [from his office], to this end, to preserve the people, to ride and govern them; and a gift of God, given by virtue of his office, to rule the people of God, and so any way inferior to the people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 79</span></figcaption>

om%2C+and+gift%2C+and+no+more%3B+and+that+which%2C+beside+that+it+is+a+mean%2C+is+of+a+higher+nature+also.+So+Christ+formally+as+a+mean%2C+giving+his+temporal+life+for+a+time%2C+according+to+the+flesh%2C+for+the+eternal+life+of+all+the+catholic+Church%2C+to+be+glorified+eternally%E2%80%94%28not+his+blessed+Godhead+and+glory%2C+which%2C+as+God%2C+He+had+with+the+Father+from+eternity%29%E2%80%94+in+that+respect+Christ+has+the+relation+of+a+servant%2C+ransom%2C+gift%2C+and+some+inferiority+in+comparison+of+the+Church+of+God%3B+and+his+Father%E2%80%99s+glory%2C+as+a+mean%2C+is+inferior+to+the+end%3B+but+Christ+materially%2C+in+concreto+%5Bin+particular%2C+materially%5D%3A+Christ+is+not+only+a+mean+to+save+his+Church%2C+but%2C+as+God+%28in+which+consideration+He+was+the+immortal+Lord+of+life%29+He+was+more+than+a+mean%E2%80%94+even+the+Author%2C+Efficient+and+Creator+of+heaven+and+earth%3B+and+so+there+is+no+ground+to+say+that+He+is+inferior+to+the+Church%2C+but+the+absolute+head%2C+king%E2%80%94+the+chief+of+ten+thousand%E2%80%94+more+in+excellency+and+worth+than+ten+thousand+millions+of+possible+worlds+of+men+and+angels.+But+such+a+consideration+cannot+befall+any+mortal+king%3B+because%2C+consider+the+king+materially+as+a+mortal+man%2C+he+must+be+inferior+to+the+whole+church%2C+for+he+is+but+one%2C+and+so+of+less+worth+than+the+whole+church%3B+as+the+thumb%2C+though+the+strongest+of+the+fingers%2C+yet+it+is+inferior+to+the+hand%2C+and+far+more+to+the+whole+body%2C+as+any+part+is+inferior+to+the+whole.+Consider+the+king+reduplicative+and+formally+as+king%2C+and+by+the+official+relation+he+has%2C+he+is+no+more+than+but+a+royal+servant%2C+an+official+mean+tending%2C+ex+officio+%5Bfrom+his+office%5D%2C+to+this+end%2C+to+preserve+the+people%2C+to+ride+and+govern+them%3B+and+a+gift+of+God%2C+given+by+virtue+of+his+office%2C+to+rule+the+people+of+God%2C+and+so+any+way+inferior+to+the+people.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex...+%281644%3B+Edinburgh%3A+Ogle% <blockquote><p>…in the case of a rational substance, an end toward which it is directed can be known intellectually, and that the will or rational appetite just is that power by virtue of which such a subtance can aim at an end qua grasped by the intellect.ª ª We can, of course, also aim at ends that are not grasped by the intellect. For example, any human being aims at the end of circulating blood through his body, just by virtue of having a heart and blood vessels, and does so even if he is completely unaware of the existence of this circulatory system. It is precisely because we can iam at such ends without the intellect being cognizent of them that their pursuit is not the subject of the will. A will that was not of its nature directed toward what the intellect takes to be good would be like an acorn that was not of its nature directed toward becoming an oak. The latter just wouldn’t really be an acorn, and the former just wouldn’t really be a will.¹ ¹ For further discussion and defense of the thesis that the will always aims at what the intellect takes to be good, see Edward Feser, ‘Being, the Good, and the Guise of the Good,’ in Daniel D. Novotny and Lukas Novak, eds., Neo-Aristotelian Perspectives in Metaphysics (London: Routledge, 2012). …A tree that did not aim at getting its branches toward the sun would not be a freer tree, but just a defective tree. And a will that did not aim at the good would not be a freer will, but just a defective will.</p></blockquote>

<blockquote><p>117. A significant part of that dominion and subjection [Gen. 1:28] is that humans could feed not only on herbs and tree fruits, but also on animals for food. After the Pythagoreans and Hebrews, other ancient and modern Christians considered this unlawful, deceived by παρερμηνείᾳ [a misinterpretation] of Moses’ words, which when correctly explained declare the opposite. For God speaks thus [Gen. 1:29-30]: “Behold, I have given you every herb bearing seed, which is upon the face of the earth, and every tree which is in it, the fruit of the tree bearing seed shall be yours for food; ולכל חית הארץ [and for all living things of the earth], or together with all animals of the earth, indeed and every bird of יeaven and every creeping thing upon the earth, with every green herb of the earth for food.</p></blockquote>

<blockquote><p>We are immediately conscious that we are free agents. The validity of this witness as regard our volitions themselves seems to be of the same weight and certitude that we have of our own cognition. Hence we are certain that something at least is contingent, namely our willing. To the extent that we can prove other actions or effects of this sort to be truly under the command or our will, to that extent is the existence of other contingent beings proved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), Wolter was a Scotist. | ‘On the Existence of Contingent Being’, p. 49</span></figcaption>

<blockquote><p>(2) To evince to you the greatness and horridness of that sin [of not delighting in God]. Suffer yourselves therefore to be reasoned with to this purpose; and consider, first, that you have somewhat of delectation in your natures, that is, you have the power naturally inherent in you of taking delight in one thing or other… Therefore herein an act is not enjoined you which is incompetent to your natures, or simply impossible to you… …Yea, when you look into your disaffected hearts and find that you not only do not delight in God, but you cannot, and not for the want of the natural power, but a right inclination, should you not with astonishment bethink yourselves, every one for himself, ‘What is this that has befallen me? I am convinced this is the best good, every way most worthy of my highest delight and love, and yet my heart savors it not!&#x27;</p></blockquote>

</figure><figure class="quote" id="q-0e41903d87" data-kw="">
<blockquote><p>The sum of all is this, that the determination or predetermination of Divine concurse to this or that act does not make the negation of that act, or a contrary act, a simple or most strictly natural impossibility, as some would persuade us, but only infers a necessity of the consequence, the will having still, in sensu diviso [in a divided sense], i. e. on supposition of the withdrawment of Divine concurse, an habitual indifference to act or not to act, though, in sensu composito [in a combined sense], as predetermined by Divine concurse, it cannot but act. Or summarily thus: The will has at that very time, when it is predetermined by God to this or that act, an habitual power or radical indifference to the negation of that act, or to the putting forth a contrary act: So that Divine predetermination excludes only a contrary act, not the radical power to that act.</p></blockquote>

</figure><figure class="quote" id="q-5b6fc015ca" data-kw="">
<blockquote><p>52. Because nothing is done without a sufficient Reason (sect. 1), also liberty in election cannot act without reason, we therefore define the same as that faculty of the mind to elect or choose out of more possible things what one pleases, agreeable to proposed reasons. Hence all coaction [coercion] by which man is compelled thorugh extrinsical violence is at a great distance from liberty; metaphysical necessity, where there is but one only object possible, and consequently election ceases, has nothing to do with liberty; also physical necessity (i.e. natural necessity), when there is no knowledge of the objects, is far distant from liberty (or is utterly inconsistent with the very nature of it); but there is only a moral necessity, which is no more than a certainty so that man is sweetly and willingly inclined or moved to this or that thing from these or other motives, namely because he sees what things are best.

53. Hence since liberty of indifference is repugnant to the principle of a sufficient reason, it is utterly impossible (i.e. there is no liberty of indifference); it is a chimera (or a groundless and vain imagination which has no foundation in reason or nature); it is nothing but the mere inaction of the will; besides let those who maintain an indifference of the equilibrium in liberty (or those who place the essence of liberty in the indifference of the will), let them answer us (let them reply to the following queries, viz.), Whether God, the (holy) angels and all the inhabitants of heaven are not most free, or act with the most perfect liberty? and whether they are indifferent about good and evil?</p></blockquote>

<blockquote><p>(c) Nor is a thing necessary properly speaking unless it is produced from a necessary proximate cause, that is, such a cause that is determined by its own nature to such an effect; however, the decree of reprobation does not imply such a cause, although it does imply a certain and indeclinable futurity, which is as different from necessity as heaven from earth. [It is objected] (2) That this reprobation makes God the author of all sin, inasmuch as it predestined and necessitates the sinner to sinning. I respond: (a) It does not make it that the sinner sins necessarily, or that he does so determined by his own nature to sinning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3; ch. 4, section 11, Objections, p. 88</span></figcaption>

<main class="wrap"><figure class="quote" id="q-62e14f7ccf" data-kw="">
<blockquote><p>True faith always perseveres, and is never lost. This is proved by the following arguments. We must reason in the same way concerning faith, as concerning election, since the former is the effect of the latter. Now the decree of election is unchangeable, as we have before proved; therefore faith is unchangeable. Again: if faith could be lost, then the covenant of grace, which God promises to perform towards us, could also be abolished with regard to those who ceased to believe; but the covenant of grace also is unchangeable, and can never be revoked, as we well know; for in this way it is distinguished from the covenant of works, which was broken and made of none effect.

“I will make an everlasting covenant with them, that I will not turn away from them to do them good; but I will put my fear in their hearts, that they shall not depart from me,” (Jer. xxxii. 40.) “The mountains shall depart, and the hills shall be removed; but my kindness shall not depart from thee, neither shall the covenant of my peace be removed, saith the Lord,” (Isaiah liv. 10.) Again: if faith could be lost, the union of the faithful with Christ could be dissolved; whereas that union is so firm that nothing can separate them from him, (Rom. viii. 38, 39.)

And Christ himself thus speaks, “My sheep hear my voice, and I know them, and they follow me; and I give unto them eternal life: and they shall never perish, neither shall any man pluck them out of my hand,” i.e. neither Satan, nor the world, nor the flesh, the three enemies of all Christ’s people. (John x. 27, 28.) Moreover, if faith could be lost, it would be possible that “he that believeth on the Son, should not have eternal life,” contrary to Christ’s own declaration, (John iii. 36.) and elsewhere; and that they should not be “glorified” whom God hath “called,” contrary to St. Paul’s assertion. (Rom. viii. 30.) Further: they who believe are “sealed by the Holy Spirit unto the day of redemption,” (Eph. i. 13, 14; iv. 30.) but those who are thus scaled surely cannot perish. Lastly, faith is the effect of Christ’s death and intercession; but both these are of infinite value, and Christ’s intercession is continual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 7.5, pp 354-55.</span></figcaption>

</figure><figure class="quote" id="q-bf275ede3d" data-kw="">
<blockquote><p>That the covenant of grace is the contract of marriage, the plan of which was agreed upon in the council of peace, betwixt the Father and the Son, from all eternity: Psa. Ixxxix. 3. “I have made a covenant with my chosen, I have sworn unto David my servant.” It was originally made with the Bridegroom, as the Head, Husband, and Representative of the bride, wherein he undertakes, that the grace of God shall reign and be glorified through his own righteousness, to her eternal life and salvation.

As Surety of the covenant, he undertakes to fulfil the condition of it, by his own obedience unto death, to buy his bride from the hands of justice, by paying a ransom of his own blood for her, and to buy. at the same time, all the blessings and goods of the covenant for her use; and that, by the power of his word and Spirit, he will make her to take hold of his covenant, bring her within the bond of it, and make an effectual application thereof in due time, according to the order of the covenant; and that he will betroth her unto himself for ever, in righteousness, and in judgment, and in loving-kindness, and in mercies; yea, that he will betroth her unto himself in faithfulness, and that she shall know the Lord, Hos. ii. 19, 20.</p></blockquote>

<blockquote><p>Obj 4. Faith is a condition (though not of it self, yet) of salvation, &amp; that in the Elect themselves: therefore the Application of salvation seems not to be free in respect of the Elect.

Ans. A Condition, is either a Condition properly so called, (i. e. an antecedent Condition,) Or a Condition improperly so called: i. e. a consequent Condition. A Condition (properly so called) is a Law, or Observation, annexed to a business; the performance whereof lyeth upon the Covenant; and accordingly the business becometh valid, or null. Such a condition was Works in the first Covenant. If Faith were such a condition, there would soon be an end of the Covenant of grace: yea, the Covenant of grace, were indeed no Covenant of grace.

A Condition improperly (so called, or a Consequent Condition) is such a condition, whose performance by the Covenantee, is absolutely undertaken for; and irresistibly wrought by the Covenantor, and not left in suspense upon the Covenantee, to be performed by his own strength. Faith is a consequent condition, not an antecedent condition. So as this Proposition, I will give Eternal life unto the Elect, if they do believe: is aequivolent unto this, I will out of my absolute will give unto the Elect Eternal life, because I will out of my absolute will give unto the Elect to believe. The Condition of Faith depends not upon the Will of the Elect; either to be, or not to be; but upon the absolute and gracious Will of God.</p></blockquote>

2%80%9D%0A%0A%E2%80%94+John+Norton%2C+The+orthodox+evangelist.+Or+A+treatise+wherein+many+great+evangelical+truths+%28not+a+few+whereof+are+much+opposed+and+eclipsed+in+this+perilous+hour+of+the+passion+of+the+Gospel%29+are+briefly+discussed%2C+cleared%2C+and+confirmed%3A+as+a+further+help%2C+for+the+begetting%2C+and+establishing+of+the+faith+which+i%2C+%28London%3A+Henry+Cripps+and+Lodowick+Lloyd%2C+1654%29%2C+pp+227-28.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8abcb3519f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8abcb3519f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/10/26/john-norton-is-faith-the-proper-condition-of-the-covenant-of-grace/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>In eternal life, which belongs to the New Testament: (a) as to actual aquisition obtained by the blood of Christ (which in the Old Testament was only moral); (b) as to the actual entrance of Christ as man into heaven, as the true sanctuary, into which he entered as a forerunner, not only for himself, but also for us (Heb. 6:20); (c) as to a far more illustrious manifestation (2 Tim. 1:10), which in the Old Testament was more obscure (Heb. 9:8)—hence confidence and hope is far greater, all fear of death being removed, entering now within the veil (Heb. 6:19); (d) as to the more frequent promises, which regard solely eternal life, those being removed which have reference to this life and its prolongation (which were far more frequent under the Old Testament).</p></blockquote>

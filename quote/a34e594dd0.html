<main class="wrap"><figure class="quote" id="q-a34e594dd0" data-kw="">
<blockquote><p>…forasmuch as it is not permitted by God’s Word, that women should preach or minister the sacraments, and it is evident, that the sacraments are not ordained of God to be used in private corners, as charms or sorceries, but left to the congregation, and necessarily annexed to God’s Word, as seals of the same: therefore the infant which is to be baptized, shall be brought to the church on the day appointed with the father and godfather. So that after the sermon, the child being presented…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/book-of-common-order.html">Book of Common Order</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Order of Baptism</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8cbb33aaf8" data-kw="">
<blockquote><p>As to that question, Whether baptism may be lawfully administred extraordinarily where the child is ready to die? It was resolved that in those places where the Word of God is ordinarily preached, the established order shall be observed; but in such places where sermons are had only extraordinarily, at an undue hour, it is left to the minister’s discretion to accommodate themselves to the infirmities of parents, yet to be very careful that they do not nourish them up in superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon (John Quick, London, 1692)</cite>, French Reformed Churches, John Quick, Synodicon (London, 1692) | 2nd Synod, at Poictiers (1560), ch. 6, section 8, p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-2a2fa673ee" data-kw="">
<blockquote><p>In the time of Justin the Deacon some did carry that which was left of the Communion, at what time the Lord’s Supper was celebrated, to them which were absent by reason of their disease, from the public assembly or unto strangers, and outlandish bishops into their inn. And as Eusebius reports (Church History, Ch. 5, bk. 24), the bishop of Rome was wont to do so, but without superstition, and for no other end but for a token of concord and consent in doctrine and in the whole profession: but because we say that we must not so much enquire whether those fragments were sent, or but whether they were well sent. And that custom has degenerated into superstition, whereby at this day the host is carried to them alone which are about to die, and that for certain gain and advantage, as also in a vain persuasion of a certain necessary provision for their journey, that custom of carrying the Supper to the absent, is worthily taken away in our Churches. Cyprian in the administration of this sacrament, ‘We ought to do no other thing than that which Christ did.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, In what place is it to be administered?’ in Institutions of Christian Religion… (London, 1601), 48th Place, ‘Of the Supper of the Lord’, p. 931</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-128651e0cf" data-kw="">
<blockquote><p>For St. Paul’s baptizing in the house of the jailor had been more fit for him [John Whitgift], for unto his place it may be easily answered that Cornelius, having so great a family, as it is like he had, and besides that diverse soldiors underneath him, and further his friends and his acquaintance which he had called, had a competent number, and as many as would make a congregation, and as could commodiously be preached unto in one place. But the answer to both these examples, and other such like, as that St. Paul baptized in the house of Ananias [Acts 9] is easy. For there being persecutions at that time, so that it was not safe, neither for the minister nor for the people, to be seen, it was meet that they should do it in houses, which otherwise they would have done in open places: and then those houses which receive the congregation are not, as I have showed, for the time to be counted private houses: and further in places where the gospel has not been received, nor no church gathered, but one only household embracing the Gospel, I say in such a case, and especially in the time of persecution, where should the ministers preach, or minister the sacraments more conveniently than in that house where those professors of the gospel be? Now to draw this into our churches, which may safely come into open places, and where the church and congregation stands of diverse households, is a token of greate want of judgment, in shuffling those things together which, for the great diversity of their natures, will not be mingled.</p></blockquote>

</figure><figure class="quote" id="q-28a371500c" data-kw="">
<blockquote><p>Dr. Forbess goes about to warrant private baptism by Philip’s baptizing the eunuch, there being no greater company present, so far as we can gather from the narration of Luke, Acts 8. As likewise by Paul and Silas, their baptizing the goaler [jailer] and all his in his own private house, Acts 16. Touching the first of those places, we answer:

1. How thinks he that a man of so great authority and charge was alone in his journey? We suppose a great man traveling in a chariot must have some number of attendants, especially having come to a solemn worship at Jerusalem.

2. What Philip then did, the extraordinary direction of the Spirit guided him unto it, vv. 29, 39. As to the other place, there was in that time of persecution no liberty for Christians to meet together in temples and public places as now there is. Wherefore the example of Paul and Silas does prove the lawfulness of the like deed in the like case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, … (1637), pt. 3, ch. 6, p. 96</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

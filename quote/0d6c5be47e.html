<main class="wrap"><figure class="quote" id="q-0d6c5be47e" data-kw="">
<blockquote><p>Purity cannot be maintained without Order; a disorderly Society will corrupt within it self; for by Disorder it’s divided, by divisions the joints and bands are broken, not only of Love and Affection, but of visible Conjunction; so that roots of bitterness, and sensual Separation arising, many are defiled.

It’s true, there may be a kind of Peace and Agreement in a Society that is a stranger to Gospel-Order, when Men agree together, to walk according to a false Rule, or in a supine and negligent Observation of the True Rule. There may be a common Connivance at each one to walk as he list, but this is not Order but Disorder by Consent: Besides a Church may, for the most part, walk in Order, when there is Breaches and Divisions. Some do agree to walk according to the Rule, when others will deviate from it. It’s orderly to endeavour to reduce those that walk not orderly; though such just Undertakings seem sometimes grounds of Disturbance, and causes of Convulsion in the whole Body, threatening even its breaking in pieces; but yet this must be done to preserve the whole.

The Word Translated Order, Colos. ii. 5., τάξιν, is a Military Word; it’s the Order of Soldiers in a Band, keeping Rank and File, where every one keeps his place, follows his Leader, observes the Word of Command, and his Right-hand Man. Hence the Apostle joys to see their close Order, and Steadfastness in the Faith, their Firmness, Valour, and Resolution in fighting the good Fight of Faith, and the Order in so doing; not only in watching as single Professors, but in Marching Orderly together as an Army with Banners. There is nothing more comely than a Church walking in Order when every one keeps his place, knows and practiseth his Duty according to the Rule, each submitting to the other in the performance of Duty. When the Elders know their places, and the People theirs. Christ hath been more Faithful than Moses, and therefore hath not left his Churches without sufficient Rules to walk by.

That Order may be in a Church of Christ, the Rules of the Gospel must be known, and that by Officers and People. They that are altogether Ignorant of the Rule, or negligent in attending it, or doubtful, and therefore always contending about it, will never walk according to it. Hence it’s the great Duty of Ministers to study Order well, and acquaint the People with it. It’s greatly to be bewailed, that so few Divines bend their Studies that way. They content themselves only with Studying and Preaching the Truths that concern Faith in the Lord Jesus, and the mere Moral part of Holiness; but as to Gospel-Churches or Instituted Worship, they generally in their Doctrine and Practice let it alone, and administer Sacraments as indefinitely as they Preach; care not to stand related to one People more than another, any further than Maintained by them.

Likewise many good People are as great Strangers to Gospel Churches and Order, and as their Ministers have a great Adverseness to both, and look upon it as Schism and Faction; and this is the great reason of the readiness of both to comply with Rules of Men for making Churches, Canons established by human Laws, being carried away (if they would speak the Truth) by corrupt Erastian Principles, That Christ hath left the Church to be altogether Guided and Governed by Laws of Magistratick Sanction. Reformation from the gross Idolatrous part of Antichristianism was engaged in with some Heroic Courage and Resolution, but the coldness and indifference of Protestants to any further progress, almost ever since is not a little to be lamented.

Many think it enough that the Foundation of the House is laid in Purity of Doctrine, (and it’s well if that were not rather written in the Books than preached in Pulpits at this Day) but how little do they care to set their Hands to Building the House. Sure a great matter is from that Spiritual Slothfulness that many are fallen under, as likewise being ready to sink under the great Discouragements laid before them by the Adversaries of Judah, when they find the Children of the Spiritual Captivity are about to Build a Gospel Church unto the Lord. And how long hath this great Work ceased?

And will the Lord’s Ministers and People yet say, The Time is not come, the Time that the Lord’s House should be Built? Is it time to Build our own Houses, and not the House of the Lord? Surely it’s time to Build, for we understand by Books the number of Years whereof the Word of the Lord came to Daniel the Prophet, and to John the beloved Disciple and New Testament Prophet, that he would accomplish 1260. Years in the Desolation of our Jerusalem, and the Court which is without the Temple, viz. The generality of Visible Professors, and the external part of Worship, which hath been so long trod down by Gentilism; wherefore consider your Ways, Go up to the Mountain, and bring Wood, build the House, saith the Lord, and I will take pleasure in it, (Hag. i. 8.) and I will be glorified.

Men, it may be, have thought they have got, or, at least, saved by not troubling themselves with the Care, Charge, and Trouble of gathering Churches, and walking in Gospel Order; but God saith, Ye looked for much and lo it came to little, and when ye brought it Home I did blow upon it. Why, saith the Lord, because of my House that is waste, and ye run every Man to his own House. I doubt not but the time is nigh at Hand that the Gospel-Temple must be built with greater Splendour and Glory than ever Soloman‘s or Zerubbabel’s was; and though it seems to be a great Mountain of Difficulties, yet it shall become a Plain before him that is exalted far above all Principalities and Powers, and as he hath laid the Foundation thereof in the Oppressed state of his People, so his Hands shall finish it, and bring forth the Head-stone thereof with shouting in the New Jerusalem-State, crying, now Grace, Grace, but then Glory, Glory to it.</p></blockquote>

<blockquote><p>To conclude this, separation from Churches, from which Christ does not separate, is schismatical; now it’s clear in the Scripture that Christ owns churches where faith is sound for the substance, and their worship, Gospel-worship, though there be many defects and sinful mixtures among them. And what I have said concerning the schismaticalness of separation because of the sinful mixtures of those who are wicked in practice, is as true concerning separation from them who are erroneous in judgment; if the errors of those from whom the separation is made, be not fundamental, and hinder communion with Christ the head. And much more clear (if clearer can be) is the schismaticalness of those who separate from and renounce all communion with those churches which are not of their own manner of constitution and modelled according to the platform of their own particular church-order. To refrain fellowship and communion with such Churches who profess Christ their Lord, whose faith is sound, whose worship is Gospel-worship, whose lives are holy, because they come not into that particular way of church-order which we have pitched upon, is a schismatical rending of the Church of Christ to pieces… Herein likewise those separatists among ourselves are heinously faulty who censure and condemn all other churches, though their faith, worship and conversation be never so scriptural, merely because they are not gathered into church order according to their own patterns. In Scripture, Churches are commended and dignified, according as their fundamental faith was sound and their lives holy; not according to the regularity of their first manner of gathering.</p></blockquote>

<blockquote><p>Calvin frequently affirmed the ideals of the Conciliarists and criticized with the greatest severity the papal domination of councils. In a memorandum written probably in December 1560, after the treaty of Cateau-Cambresis between France and the Empire had renewed the issue of a council for pacification, he described the ‘free and universal council’ that was needed ‘to put an end to the existing divisions in Christianity’. It must be free with respect to place of meeting, personnel, and procedure, and bound only by Scripture. The location should be central to the attending nations. This interesting document offers what is virtually an agenda for the council, listing numberous points in dispute in the realms of doctrine, worship, and polity. Calvin’s council was to be a conference on Faith and Order–with power. The Pope is not excluded, but he must submit to the council’s decisions and swear to abide by them. Calvin insists that, while a national synod may undertake internal reform, only a genuinely universal council can allay the troubles of Christendom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Calvin | John T. McNeill, ch. 1. “The Ecumenical Idea &amp; Efforts to Realize it, 1517-1618” in eds. Ruth Rouse &amp; Stephen C. Neill, A History of the Ecumenical Movement: 1517-1948 (Philadelphia, 1967), pp. 33-34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>4. The fourth sort of erroneous persons which I judge holy Churches and saints ought to separate from, are such as err in fundamentals or foundation points of religion, holding opinions that lay the ax to the root of the Tree of Life. Now as these sorts of errors are most dangerous to be permitted, so they are most difficult to single out; for though it be a thing out of doubt that there are foundation doctrines which the Church of God ought to prefer in order to its being before its peace and unity, yet it remains very doubtful whether several of those precious and substantial truths that are highly to be prized and much contended for, and are by several godly and sound Christians esteemed foundation points, be so or no: that is, so to be esteemed foundations as the persons not believing them or holding error contrary to them (and are otherwise in the main gracious), be thereby made incommunicable: But as in the former cases, so in this, I shall decline coming to particulars as a work above my capacity and shall only tender my thoughts in some few general rules; and so leave it to them who are more able to add.

1. First, I judge that errors against the foundation points of religion must be of such a nature and tendency as do strike at the very root of saving-grace and tend to unstate the the person holding them from a possibility of salvation, he living and dying therein; for so Paul argues, 1 Cor. 15:14, concerning the resurrection of the dead: ‘If Christ be not risen then is our preaching vain, and our faith is also vain.’ And also verses 17-18, ‘And if Christ be not raised, your Faith is vain, ye are yet in your sins. Then they also that are fallen asleep in Christ, are perished.’

2. I judge they must be errors contrary to the general tendency and scope of Scripture and to the doctrines of salvation plainly and evidently therein expressed which all true believers concur and agree in: And therefore says the apostle: ‘If our Gospel be hid, it is hid to them that are lost,’ 2 Cor. 3:3; and so chapter 11:3, ‘But I fear lest by any means, as the serpent beguiled Eve through his subtilty, so your minds should be corrupted from the simplicity that is in Christ. For if he that comes preaches another Jesus, whom we have not preached, or if ye receive another spirit which ye have not received, or another Gospel which ye have not excepted, etc. ye might well bear with him.’ And so Gal. 1:6-8, ‘I marvel that ye are so soon removed from him that has called you into the grace of Christ, unto another Gospel: Which is not another; but there be some which trouble you, and would pervert the Gospel of Christ. But though we, or an angel from Heaven preach another Gospel unto you, then that which we have preached, let him be accursed.’ Now it is evident that that bringing in another Gospel was a joining circumcision and the works of the Law with faith in Christ in justification, contrary to the very essence of Gospel faith, as they held it. Objection: Why, how did they hold it? Did not you before number this among one of the errors Paul permitted in the Church of Rome, etc. and pressed the Church to union, without separating from it? Answer: They held it rigidly, imposing it upon others as of necessity to salvation, ch. 2:14 and 6:12. For where the same error was held more moderately, as we observe before in the Church of Rome and Corinth, etc. the apostle deals milder with it; there he says, ‘Circumcision is nothing, nor uncircumcision is nothing,’ 1 Cor. 7:19. ‘Is any man called being circumcised; let him not be uncircumcised,’ verse 8. But when they come to hold it imposingly and positively, as in this verse, he then changes his voice: then ‘O foolish Galatians, who has bewitched you, that ye should not obey the truth?’ etc. ch. 3:1-4, then, ‘Behold, I Paul say unto you, that if ye be circumcised, Christ shall profit you nothing; For I testify again to every man that is circumcised, Christ is become of none effect unto you,’ ch. 5:2-4. So that the manner of holding an error alters the case of its fundamentalness much: It was Peter’s separating from the saints differing minded, and dissimulation, rather than his error, ch. 2:11-14, that made Paul withstand him to the face, verse 11… That if those errors and heresies the Scripture mentions as dangerous and unsufferable in the Church of God, which the Churches and saints of God are onely exhorted to reject and withdraw from, was all either of a scandalous profane nature, denying the power of godliness, on the one hand, or contrary to a godly life, inconsistent with true grace, or striking at the foundation of saving faith on the other hand: Then the Churches and saints of God, who desire not to be wise above what is written at this day, ought only to reject and withdraw from such…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richad-lawrence.html">Richard Lawrence</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel-Separation Separated from its Abuses</cite>, Gospel-Separation Separated from its Abuses; or the Saints’ Guide in Gospel-Fellowship: whereby they may be Directed not only to Preserve the Purity, but withal the Unity of Gospel-Worship: by a well-wisher to Sion’s Purity and Unity (London: Calvert, 1657), p. 73-79 This work has an imprimatur by Joseph Caryl.</span></figcaption>

ot+risen+then+is+our+preaching+vain%2C+and+our+faith+is+also+vain.%E2%80%99+And+also+verses+17-18%2C+%E2%80%98And+if+Christ+be+not+raised%2C+your+Faith+is+vain%2C+ye+are+yet+in+your+sins.+Then+they+also+that+are+fallen+asleep+in+Christ%2C+are+perished.%E2%80%99%0A%0A2.+I+judge+they+must+be+errors+contrary+to+the+general+tendency+and+scope+of+Scripture+and+to+the+doctrines+of+salvation+plainly+and+evidently+therein+expressed+which+all+true+believers+concur+and+agree+in%3A+And+therefore+says+the+apostle%3A+%E2%80%98If+our+Gospel+be+hid%2C+it+is+hid+to+them+that+are+lost%2C%E2%80%99+2+Cor.+3%3A3%3B+and+so+chapter+11%3A3%2C+%E2%80%98But+I+fear+lest+by+any+means%2C+as+the+serpent+beguiled+Eve+through+his+subtilty%2C+so+your+minds+should+be+corrupted+from+the+simplicity+that+is+in+Christ.+For+if+he+that+comes+preaches+another+Jesus%2C+whom+we+have+not+preached%2C+or+if+ye+receive+another+spirit+which+ye+have+not+received%2C+or+another+Gospel+which+ye+have+not+excepted%2C+etc.+ye+might+well+bear+with+him.%E2%80%99+And+so+Gal.+1%3A6-8%2C+%E2%80%98I+marvel+that+ye+are+so+soon+removed+from+him+that+has+called+you+into+the+grace+of+Christ%2C+unto+another+Gospel%3A+Which+is+not+another%3B+but+there+be+some+which+trouble+you%2C+and+would+pervert+the+Gospel+of+Christ.+But+though+we%2C+or+an+angel+from+Heaven+preach+another+Gospel+unto+you%2C+then+that+which+we+have+preached%2C+let+him+be+accursed.%E2%80%99+Now+it+is+evident+that+that+bringing+in+another+Gospel+was+a+joining+circumcision+and+the+works+of+the+Law+with+faith+in+Christ+in+justification%2C+contrary+to+the+very+essence+of+Gospel+faith%2C+as+they+held+it.+Objection%3A+Why%2C+how+did+they+hold+it%3F+Did+not+you+before+number+this+among+one+of+the+errors+Paul+permitted+in+the+Church+of+Rome%2C+etc.+and+pressed+the+Church+to+union%2C+without+separating+from+it%3F+Answer%3A+They+held+it+rigidly%2C+imposing+it+upon+others+as+of+necessity+to+salvation%2C+ch.+2%3A14+and+6%3A12.+For+where+the+same+error+was+held+more+moderately%2C+as+we+observe+before+in+the+Church+of+Rome+and+Corinth%2C+etc.+the+apostle+deals+milder+with+it%3B+there+he+says%2C+%E2%80%98Circumcision+is+nothing%2C+nor+uncircumcision+is+nothing%2C%E2%80%99+1+Cor.+7%3A19.+%E2%80%98Is+any+man+called+being+circumcised%3B+let+him+not+be+uncircumcised%2C%E2%80%99+verse+8.+But+when+they+come+to+hold+it+imposingly+and+positively%2C+as+in+this+verse%2C+he+then+changes+his+voice%3A+then+%E2%80%98O+foolish+Galatians%2C+who+has+bewitched+you%2C+that+ye+should+not+obey+the+truth%3F%E2%80%99+etc.+ch.+3%3A1-4%2C+then%2C+%E2%80%98Behold%2C+I+Paul+say+unto+you%2C+that+if+ye+be+circumcised%2C+Christ+shall+profit+you+nothing%3B+For+I+testify+again+to+every+man+that+is+circumcised%2C+Christ+is+become+of+none+effect+unto+you%2C%E2%80%99+ch.+5%3A2-4.+So+that+the+manner+of+holding+an+error+alters+the+case+of+its+fundamentalness+much%3A+It+was+Peter%E2%80%99s+separating+from+the+saints+differing+minded%2C+and+dissimulation%2C+rather+than+his+error%2C+ch.+2%3A11-14%2C+that+made+Paul+withstand+him+to+the+face%2C+verse+11%E2%80%A6+That+if+those+errors+and+heresies+the+Scripture+mentions+as+dangerous+and+unsufferable+in+the+Church+of+God%2C+which+the+Churches+and+saints+of+God+are+onely+exhorted+to+reject+and+withdraw+from%2C+was+all+either+of+a+scandalous+profane+nature%2C+denying+the+power+of+godliness%2C+on+the+one+hand%2C+or+contrary+to+a+godly+life%2C+inconsistent+with+true+grace%2C+or+striking+at+the+foundation+of+saving+faith+on+the+other+hand%3A+Then+the+Churches+and+saints+of+God%2C+who+desire+not+to+be+wise+above+what+is+written+at+this+day%2C+ought+only+to+reject+and+withdraw+from+such%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Richard+Lawrence%2C+Gospel-Separation+Separated+from+its+Abuses%2C+Gospel-Separation+Separated+from+its+Abuses%3B+or+the+Saints%E2%80%99+Guide+in+Gospel-Fellowship%3A+whereby+they+may+be+Directed+not+only+to+Preserve+the+Purity%2C+but+withal+the+Unity+of+Gospel-Worship%3A+by+a+well-wisher+to+Sion%E2%80%99s+Purity+and+Unity+%28London%3A+Calvert%2C+1657%29%2C+p.+73-79+This+work+has+an+imprimatur+by+Joseph+Caryl.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fab455a9dd7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ab455a9dd7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=4.%20The%20fourth%20sort%20of%20erroneous,to%20reject%20and%20withdraw%20from%20such&amp;text=4.%20The%20fourth%20sort%20of%20erroneous%20persons%20which&amp;text=ought%20only%20to%20reject%20and%20withdraw%20from%20such" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-020063863f" data-kw="">
<blockquote><p>Answer: Though the violation of the general [moral] law hurts the conscience, it being against the Fifth Commandment; it follows not that the violation of every particular law, even that that is merely positive, hurts the conscience before God: For then the carrying of armor in the night [which is suspicious of violence and may be dangerous to a town], suppose no ruler on earth make a law there anent, should be a sin before God, which no wise-man can say. 2. The other reason is more important, and draws with it that school-question agitated by [civil] jurists also and [ecclesiastical] canonists, An ulla detur lex pure paenalis; ‘If there be a law purely penal,’ without sin in it: And if the law of rulers in things merely positive be merely penal and co-active, and not formally obliging [connected] to sin. But I Answer: Rulers do justly punish the transgression of a positive law, not as particularly human and positive: But as: 1. It has connection with the moral reason of the law. 2. As the particular transgression is scandalous and against order, in which case the formal object of the just punishment inflicted by the ruler, is in very deed not the simple omission of the positive act of a particular human law, but the violation of the moral goodness annexed to it, and of the scandal given. Now in this meaning, the transgression of the positive human law is not kindly [in its kind], per se, of itself punishable, but by accident, and so it binds the conscience by accident; and in this sense, great doctors, as Ambrose, Anselm, Theodoret, Chrysostom, Navarra, Felinus, Taraquel, say that human laws oblige the conscience. But the most learned of the [ecclesiastical] canonists aver that not to obey civil laws, laying aside the evil of scandal, is no mortal sin, and so does not involve the conscience in guiltiness before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), ch. 2, pp. 216-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-3954338d9e" data-kw="">
<blockquote><p>The Dicaeologicae was an immense Latin work that sought to construct a single comprehensive juridical system by collating the Decalogue, Jewish law, Roman law, and various streams of European customary law. The translated sections comprising On Law and Power address such topics as common law, natural law, private or individual (civil) law, the nature of sovereign public authority, and limitations on public power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-althusius.html">Johannes Althusius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Law &amp; Power</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-993670cede" data-kw="">
<blockquote><p>What is warranted by the direction of nature’s light is warranted by the law of nature, and consequently by a divine law; for who can deny the law of nature to be a divine law?… All civil power is immediately from God in its root; in that, 1st, God has made man a social creature, and one who inclines to be governed by man; then certainly He must have put this power in man’s nature: so are we, by good reason, taught by Aristotle. 2nd, God and nature intends the policy and peace of mankind, then must God and nature have given to mankind a power to compass this end; and this must be a power of government… As domestic society is by nature’s instinct…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 1</span></figcaption>

</figure><figure class="quote" id="q-3dca8c4bdb" data-kw="">
<blockquote><p>4. That which is the garland and proper flower of the King of kings, as He is absolute above his creatures, and not tied to any law, without Himself that regulates his will, that must be given to no mortal man or king except we would communicate that which is God’s proper due to a sinful man, which must be idolatry. But to do royal acts out of an absolute power above law and reason, is such a power as agrees to God, as is evident in positive laws and in acts of God’s mere pleasure, where we see no reason without the Almighty for the one side rather than for the other, as God’s forbidding the eating of the Tree of Knowledge makes the eating sin and contrary to reason; but there is no reason in the object; for if God should command eating of that tree, not to eat should also be sin. So God’s choosing Peter to glory and his refusing Judas, is a good and a wise act, but not good or wise from the object of the act, but from the sole wise pleasure of God; because, if God had chosen Judas to glory and rejected Peter, that act had been no less a good and a wise act than the former. For when there is no law in the object but only God’s will, the act is good and wise, seeing infinite wisdom cannot be separated from the perfect will of God; but no act of a mortal king, having sole and only will, and neither law nor reason in it, can be a lawful, a wise, or a good act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1646), Question 23, pp. 106-7</span></figcaption>

<blockquote><p>But to make it yet more and plentifully appear how miserably our opposites would enthrall our consciences, I will here show: 1. What the binding of the conscience is, 2. How the laws of the Church may be said to bind [and how not]. 3. What is the judgment of Formalists touching the binding power of ecclesiastical laws.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, ... (Edinburgh, 1637) | 1st Part, ch. 4, ‘That the Ceremonies take away our Christian Liberty, proved by a second reason, namely, because Conscience itself is bound and adstricted’. Pages 8-11 are the most important. The last third of the section refutes the formalist view that such ordinances bind the outward man, though not the conscience., p. 7</span></figcaption>

<blockquote><p>The officers that rule the world in God’s stead, as father mother, master, husband, lord and prince, are honoured, when the law, which Almighty God has committed unto them to rule with, is obeyed. Thy neighbour that is out of office is honored, when thou (as God has commanded thee) lovest Him as thyself, countest him as good as thyself, thinkest him as worthy of any thing as thyself, and comest lovingly to help him at all his need, as thou wouldest be holp thyself; because God hath made him like unto his own image, as well as thee, and Christ hath bought him as well as thee. If I hate the law, so I break it in mine heart; and both hate and dishonour God, the maker thereof. If I break it outwardly, then I dishonour God before the world, and the officer that ministers it. If I hurt my neighbour, then I dishonor my neighbor and Him that made him, and him also that bought him with his blood… If I be not ready to help my neighbor at his need, so I take his due honour from him, and dishonour him, and him that made him, and Him also that bought him with his blood, whose servant he is… In like manner, if the officer, abusing his power, compel the subject to do that which God forbiddeth, or to leave undone that which God commandeth, so he dishonoureth God in withdrawing his servant from him, and maketh an idol of his own lusts, in that he honoureth them above God; and he dishonoureth his brother in that he abuseth him, contrary unto the right use which God hath created him for, and Christ hath bought him for, which is to wait on God’s commandments. For if the officer be otherwise minded than this, the worst of these subjects is made by the hands of Him that made me, and bought with the blood of Him that bought me, and therefore, my brother; and I but his servant only, to defend him, and to keep him in the honour that God and Christ has set him, that no man dishonors him: he dishonours both God and man.</p></blockquote>

— William Tyndale, An Answer to Sir Thomas More’s Dialogue, the Supper of the Lord… (d. c. 1536; Cambridge: Parker Society, 1850), pp. 56-57">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+officers+that+rule+the+world+in+God%E2%80%99s+stead%2C+as+father+mother%2C+master%2C+husband%2C+lord+and+prince%2C+are+honoured%2C+when+the+law%2C+which+Almighty+God+has+committed+unto+them+to+rule+with%2C+is+obeyed.+Thy+neighbour+that+is+out+of+office+is+honored%2C+when+thou+%28as+God+has+commanded+thee%29+lovest+Him+as+thyself%2C+countest+him+as+good+as+thyself%2C+thinkest+him+as+worthy+of+any+thing+as+thyself%2C+and+comest+lovingly+to+help+him+at+all+his+need%2C+as+thou+wouldest+be+holp+thyself%3B+because+God+hath+made+him+like+unto+his+own+image%2C+as+well+as+thee%2C+and+Christ+hath+bought+him+as+well+as+thee.+If+I+hate+the+law%2C+so+I+break+it+in+mine+heart%3B+and+both+hate+and+dishonour+God%2C+the+maker+thereof.+If+I+break+it+outwardly%2C+then+I+dishonour+God+before+the+world%2C+and+the+officer+that+ministers+it.+If+I+hurt+my+neighbour%2C+then+I+dishonor+my+neighbor+and+Him+that+made+him%2C+and+him+also+that+bought+him+with+his+blood%E2%80%A6+If+I+be+not+ready+to+help+my+neighbor+at+his+need%2C+so+I+take+his+due+honour+from+him%2C+and+dishonour+him%2C+and+him+that+made+him%2C+and+Him+also+that+bought+him+with+his+blood%2C+whose+servant+he+is%E2%80%A6+In+like+manner%2C+if+the+officer%2C+abusing+his+power%2C+compel+the+subject+to+do+that+which+God+forbiddeth%2C+or+to+leave+undone+that+which+God+commandeth%2C+so+he+dishonoureth+God+in+withdrawing+his+servant+from+him%2C+and+maketh+an+idol+of+his+own+lusts%2C+in+that+he+honoureth+them+above+God%3B+and+he+dishonoureth+his+brother+in+that+he+abuseth+him%2C+contrary+unto+the+right+use+which+God+hath+created+him+for%2C+and+Christ+hath+bought+him+for%2C+which+is+to+wait+on+God%E2%80%99s+commandments.+For+if+the+officer+be+otherwise+minded+than+this%2C+the+worst+of+these+subjects+is+made+by+the+hands+of+Him+that+made+me%2C+and+bought+with+the+blood+of+Him+that+bought+me%2C+and+therefore%2C+my+brother%3B+and+I+but+his+servant+only%2C+to+defend+him%2C+and+to+keep+him+in+the+honour+that+God+and+Christ+has+set+him%2C+that+no+man+dishonors+him%3A+he+dishonours+both+God+and+man.%E2%80%9D%0A%0A%E2%80%94+William+Tyndale%2C+An+Answer+to+Sir+Thomas+More%E2%80%99s+Dialogue%2C+the+Supper+of+the+Lord%E2%80%A6+%28d.+c.+1536%3B+Cambridge%3A+Parker+Society%2C+1850%29%2C+pp.+56-57&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc42b46fc70.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c42b46fc70.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-human-laws-bind-the-conscience-how-they-do-not/#:~:text=The%20officers%20that%20rule%20the%20world,he%20dishonours%20both%20God%20and%20man&amp;text=The%20officers%20that%20rule%20the%20world%20in%20God%E2%80%99s&amp;text=dishonors%20him%3A%20he%20dishonours%20both%20God%20and%20man" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We indeed know that repudiation [divorce], properly speaking, had never been allowed by God; for though it was not punished under the [Mosaic] Law, yet it was not permitted. It was the same as with a magistrate, who is constrained to bear many things which he does not approve; for we cannot so deal with mankind as to restrain all vices. It is indeed desirable, that no vice should be tolerated; but we must have a regard to what is possible. Hence Moses has specified no punishment, according to the heinousness of the crime, if one repudiated his wife; and yet it was never permitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Malachi</cite>, 2:16</span></figcaption>

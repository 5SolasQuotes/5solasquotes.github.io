<main class="wrap"><figure class="quote" id="q-51e9c9e97f" data-kw="">
<blockquote><p>My I. Rule is, THAT there be instantly an enquiry into, and a revival of the laws made and enacted by the state in times of reformation, and the acts of the church in her primary assemblies, both made against all such as do speak, publish, or disseminate any doctrines or opinions, against any of the persons of the holy and blessed Trinity, or denies and disparages any part, or doctrine, of divine revelation; and these acts and laws reduced into practice, by such as are in a capacity of so doing, against all such enemies to both GOD and good men, as do, and are in the habit of publishing against GOD, and against divine revelation.

TWO things will exhibit the necessity, the expediency, and utility of such a plan being forewith set on foot. First, The approven conduct and practice of Israel, who were laid under the most positive and particular obligations, to watch most zealously against all such as would either deny the true GOD, or bring in false worship, contrary to the express nature and design of the first and second commandments. Let Deut. V. 12, 13 be read and duly considered, as an original reason why we should take good heed to ourselves on this head. – Second, Let us consult civil and ecclesiastical histories, and we will find that it has been the practice of all the countries of Europe, where true Christianity has prevailed, to make laws against atheists and deists designs to oppose GOD and his glory, or to deny divine revelation: And from such warrants and presidents as these, be induced to adopt the above rule into public use, as a barrier against the growth of infidelity. […]

Rule V. THAT every magistrate should, and every faithful minister ought, in their distinct spheres, endeavour to prevent, or will bring to deserved punishment, all persons who encourage deistical principles, as the same are destructive to both religious and civil society; and all printers who will publish, either more openly or secretly, those tenets and principles as have a manifest tendency to destroy the true foundations of faith and hope, and overturns the first principles of religious practice, and tends absolutely to reduce the final state of the Christian world, to a condition infinitely dangerous and hazardous; in as much, as all deists do reject that true revelation, which GOD himself hath confirmed with the most illustrious attestations; and refuses all the parts of that divine testimony GOD has given of his Son, as a Redeemer; and slights the authority of his laws, and the offers of his grace and mercy; and despises all his glorious promises, and sets at nought all his righteous threatenings: this brings persons and nations under dreadful guilt, where such tenets and opinions are openly encouraged.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-stavely.html">William Stavely</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An appeal to light; or, the tenets of Deists examined and disapproved; and the authority of the Holy Scriptures asserted and vindicated</cite>, (Belfast, 1796), pp 138-9, 142.</span></figcaption>

<blockquote><p>… I hope the Reader will … in a particular manner be led and excited to consider and improve his Sabbaths as a Sign and Memorial of the Covenant of Grace, and the blessed Seasons and Means of Sanctification.— So our Fathers, like wise and good Men, began with God in the planting of these Churches: They covenanted with God to be his People and to keep his Sabbaths, and they found Him to be the Lord their Sanctifier. The reverend Observation of the Lord’s-day was their distinguishing honour and glory, and the fruits of holiness to the praise and glory of God abounded among them.—

As the World grows upon us in its numbers and trade, we are growing out of this our primitive purity and beauty; but it is visible that the decay of Sanctity bears proportion to our declension in Sabbath Sanctification. We had need therefore to remember how we have received and heard, and hold fast and repent; let no man take our Crown. I know no one Rule more compendious, comprehensive and effectual for the revival and perpetuity of Religion among us than this, that we keep the LORD’s Sabbaths, as a Sign between Him and us thro’ out our Generations, that HE is the Lord that doth sanctify us.</p></blockquote>

<blockquote><p>The classical and confessional understanding of this principle [the RPW] led the Reformed churches to distinguish between two aspects of worship: elements and circumstances. This distinction was a corollary to the distinction between a substance and an accident. A substance is that which makes a thing what it is. An accident is something that is temporarily connected or related to the substance but such that it can be changed without changing the substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-scott-clark.html">R. Scott Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Recovering the Reformed Confession</cite>, (P&amp;R, 2008), pp. 229-30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-9ace4a6900" data-kw="">
<blockquote><p>Further, this power of the keys… The key of the ministry of the Word is set down and established by Christ, Mt. 16:19, ‘I will give unto thee the keys of the kingdom of heaven,’ etc. This ministry of the Word is a key, because it opens and shuts heaven; this it does… Secondly: by applying the promises of the Gospel and the threatening of the Law: For when in the ministry of the Word the promises of remission of sins and life everlasting, are applied to believers that repent, then the kingdom of heaven is opened; and when as in the same ministry of the Word, the curses of the law are denounced against impenitent sinners, then is the kingdom of heaven shut. Yet touching the ministry of the Word, this distinction must be remembered; that otherwhiles the church is certain of the faith and repentance of some men, or some congregation; and then they may pronounce remission of sins absolutely. But otherwhiles they are uncertain of their faith and repentance, or of their impenitency; and then they must accordingly remit or retain men’s sins, that is, conditionally; pronouncing the remission of sins to all that repent: and denouncing damnation to all that repent not. And thus is the word to be publicly handled in God’s Church at this day, because our congregations are mixed companies, consisting of some that repent and believe, and of others that do not truly repent nor believe.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Further, this power of the keys… The key of the ministry of the Word is set down and established by Christ, Mt. 16:19, ‘I will give unto thee the keys of the kingdom of heaven,’ etc. This ministry of the Word is a key, because it opens and shuts heaven; this it does… Secondly: by applying the promises of the Gospel and the threatening of the Law: For when in the ministry of the Word the promises of remission of sins and life everlasting, are applied to believers that repent, then the kingdom of heaven is opened; and when as in the same ministry of the Word, the curses of the law are denounced against impenitent sinners, then is the kingdom of heaven shut. Yet touching the ministry of the Word, this distinction must be remembered; that otherwhiles the church is certain of the faith and repentance of some men, or some congregation; and then they may pronounce remission of sins absolutely. But otherwhiles they are uncertain of their faith and repentance, or of their impenitency; and then they must accordingly remit or retain men’s sins, that is, conditionally; pronouncing the remission of sins to all that repent: and denouncing damnation to all that repent not. And thus is the word to be publicly handled in God’s Church at this day, because our congregations are mixed companies, consisting of some that repent and believe, and of others that do not truly repent nor believe.”

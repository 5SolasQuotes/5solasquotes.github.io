<main class="wrap"><figure class="quote" id="q-cbdc1c3dce" data-kw="">
<blockquote><p>If no time be set apart by a competent authority for public worship, there will be no public worship. When Paul rebuked some of the early Christians, for “forsaking the assembling of themselves together,” Heb. 10:25, it would have been ample justification for them to have replied, “No such thing is required, and no time is set for it.” But we hear of no such plea. It never was made.

There was as much agreement among the early Christians in observing the Lord’s day as in observing the Lord’s supper. It would be mere will-worship to observe the Lord’s day, if it had not been appointed to be so observed by God himself. Is it credible that God should have left the whole church so ignorant of his will, that all believers for eighteen hundred years should have been mistaken as to their duty in so important a matter as this?

The apostle James says, “He that keepeth the whole law, and yet offendeth in one point, is guilty of all.” That he here means the moral law is evident, for he cites two of the precepts of it in the next verse: “Do not commit adultery,” “Do not kill.” James 2: 10, 11. Now, if you do not kill, or swear profanely, yet if you violate the fourth commandment, you are “become a transgressor of the law.” Let those who indulge in Antinomian laxity concerning the law of the Sabbath, solemnly consider the course of reasoning adopted by James, and be warned in time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-swan-plumer.html">William Swan Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law of the Sabbath Still Binding, and What it Forbids in Tracts of American Tract Society. General Series</cite>, vol. VI, no. 187 (New York, n.d.), p. 15.</span></figcaption>

</figure><figure class="quote" id="q-cf76906b88" data-kw="">
<blockquote><p>But the more private the duties of worship are, the greater latitude is indulged in the external part, or signs of reverence and honor. For though these outward expressions, compositions, or gestures of the body, be the genuine effects of that inward reverence of the mind, and so due to the divine Majesty, yet it is with special reference unto men, that others may see how God is and ought to be feared of his saints. So that such things which are necessary in public worship, are not alway so necessary in private or secret; and that which a person finds to be most advantageous to the right performance of his worship in secret, may not be so expedient in public, because there is not the like reason in both.</p></blockquote>

</figure><figure class="quote" id="q-9a76eb091a" data-kw="">
<blockquote><p>Your long silence hath made us speak, to utter to you our own troubles, and the sighs and groans of your helpless Flocks. We cannot inform you, but have only writ to stir you up by way of remembrance, and humbly to put you in mind, that you stir up the gift of God that is in you, and suffer not your worthy Talents to be buried in the Napkin, now the sinking Church and dying Religion hath such pressing need for their utmost improvement.

These Letters are to you in behalf of the poor Flocks, like the man of Macedonia crying to you, Come and help us: or, a Call to Archippus, to take heed to the Ministry that he hath received, that he fulfil it.

Fathers and Brethren, we unfeignedly reverence you, we magnify the grace of God in and unto you. Did not we reverence your Parts, Gifts and Graces, and esteem them every way so useful to the Churches, we should contentedly see you sit still, and never be at the pains to excite you. But our high value of you, hath made us humbly bold to expostulate the case a little with you, and passionately to beseech you, to remember how great a work it is that lies upon you, and to set your hands to it in this time of difficulty.

Some of yours were the holy hands by which we were called to our Office, when you made us publicly promise (according to the obligation of our Office) that we would never, for fear of any persecution, desist from preaching the Gospel; and far be it from our Fathers to withdraw, as soon as persecution begins. Suffer us with all modesty and submission, to reason with you. Hath not God said, Necessity is laid on you, and WO unto you if you preach not the Gospel? Who shall free you from that Wo, or loose your bonds of that necessity, if yet you sit still in silence?

Shall we mind you of Paul’s example and charge? No bonds nor afflictions could move him, nor make him shun to declare the whole counsel of God. And how strict is the command, That you take heed to your selves, and all the Flock, over whom the holy Ghost hath made you Bishops? And let it be noted, how pertinent the motive is, Because grievous Wolves are entered in, not sparing the Flock: And will you, at such a time, give over your care for the Flock? Are we not most dreadfully charged, before God, and our Lord Jesus Christ, and the elect Angels, to observe these things, and to preach the Word, and be instant, and reprove, rebuke, exhort with all LONG SUFFERING? and shall we flinch at the beginning of any Suffering? Are we not required to continue in Doctrine, as ever we would save our selves, or them that hear us? Hath not our Lord told us, That he that hath set his hand to the Plough, and looketh back, is not fit for the Kingdom of God?

Let us call upon your Bowels. Where there is no Vision, the People perish: and can you see them perish, when you have bread enough, and to spare? Further, Are not you they, that are set for the defence and confirmation of the Gospel? and will not you stand to your work, against the contradictions of men, that would make the work of the Lord to cease? Besides, now is the time for you to approve your selves to be Ministers of God, in much patience, affliction, necessity, distress, imprisonment, labour, watchings, fastings; by long-suffering, by kindness, by the Holy Ghost, by Love unfeigned, Word of Truth, Power of God, Armour of Righteousness, on the right hand and on the left.

Is not this the Work of your Office and Calling, To watch in all things, to suffer afflictions, and thereby to make full proof of your Ministry, and, as good Soldiers of Jesus Christ, to endure hardness? Shall you with Jonah, fly to Tarshish, when the Lord sends you about your work? will you not rather say, with resolution, as holy Nehemiah, Shall such a man as I flee? Who is there, that being as I am, would flee? &amp;c. And as the Apostles, your Leaders, when in your case; And now, Lord, behold their threatnings, and grant unto thy Servants, that with all boldness they may speak thy Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-alleine.html">Joseph Alleine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A call to Archippus, or, An humble and earnest motion to some ejected ministers (by way of letter). To take heed to their ministry, that they fulfil it</cite>, ([London], 1664), pp 3-5.</span></figcaption>

Some of yours were the holy hands by which we were called to our Office, when you made us publicly promise (according to the obligation of our Office) that we would never, for fear of any persecution, desist from preaching the Gospel; and far be it from our Fathers to withdraw, as soon as persecution begins. Suffer us with all modesty and submission, to reason with you. Hath not God said, Necessity is laid on you, and WO unto you if you preach not the Gospel? Who shall free you from that Wo, or loose your bonds of that necessity, if yet you sit still in silence?

Shall we mind you of Paul’s example and charge? No bonds nor afflictions could move him, nor make him shun to declare the whole counsel of God. And how strict is the command, That you take heed to your selves, and all the Flock, over whom the holy Ghost hath made you Bishops? And let it be noted, how pertinent the motive is, Because grievous Wolves are entered in, not sparing the Flock: And will you, at such a time, give over your care for the Flock? Are we not most dreadfully charged, before God, and our Lord Jesus Christ, and the elect Angels, to observe these things, and to preach the Word, and be instant, and reprove, rebuke, exhort with all LONG SUFFERING? and shall we flinch at the beginning of any Suffering? Are we not required to continue in Doctrine, as ever we would save our selves, or them that hear us? Hath not our Lord told us, That he that hath set his hand to the Plough, and looketh back, is not fit for the Kingdom of God?

Let us call upon your Bowels. Where there is no Vision, the People perish: and can you see them perish, when you have bread enough, and to spare? Further, Are not you they, that are set for the defence and confirmation of the Gospel? and will not you stand to your work, against the contradictions of men, that would make the work of the Lord to cease? Besides, now is the time for you to approve your selves to be Ministers of God, in much patience, affliction, necessity, distress, imprisonment, labour, watchings, fastings; by long-suffering, by kindness, by the Holy Ghost, by Love unfeigned, Word of Truth, Power of God, Armour of Righteousness, on the right hand and on the left.

Is not this the Work of your Office and Calling, To watch in all things, to suffer afflictions, and thereby to make full proof of your Ministry, and, as good Soldiers of Jesus Christ, to endure hardness? Shall you with Jonah, fly to Tarshish, when the Lord sends you about your work? will you not rather say, with resolution, as holy Nehemiah, Shall such a man as I flee? Who is there, that being as I am, would flee? &amp;c. And as the Apostles, your Leaders, when in your case; And now, Lord, behold their threatnings, and grant unto thy Servants, that with all boldness they may speak thy Word.”

— Joseph Alleine, A call to Archippus, or, An humble and earnest motion to some ejected ministers (by way of letter). To take heed to their ministry, that they fulfil it, ([London], 1664), pp 3-5.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYour+long+silence+hath+made+us+speak%2C+to+utter+to+you+our+own+troubles%2C+and+the+sighs+and+groans+of+your+helpless+Flocks.+We+cannot+inform+you%2C+but+have+only+writ+to+stir+you+up+by+way+of+remembrance%2C+and+humbly+to+put+you+in+mind%2C+that+you+stir+up+the+gift+of+God+that+is+in+you%2C+and+suffer+not+your+worthy+Talents+to+be+buried+in+the+Napkin%2C+now+the+sinking+Church+and+dying+Religion+hath+such+pressing+need+for+their+utmost+improvement.%0A%0AThese+Letters+are+to+you+in+behalf+of+the+poor+Flocks%2C+like+the+man+of+Macedonia+crying+to+you%2C+Come+and+help+us%3A+or%2C+a+Call+to+Archippus%2C+to+take+heed+to+the+Ministry+that+he+hath+received%2C+that+he+fulfil+it.%0A%0AFathers+and+Brethren%2C+we+unfeignedly+reverence+you%2C+we+magnify+the+grace+of+God+in+and+unto+you.+Did+not+we+reverence+your+Parts%2C+Gifts+and+Graces%2C+and+esteem+them+every+way+so+useful+to+the+Churches%2C+we+should+contentedly+see+you+sit+still%2C+and+never+be+at+the+pains+to+excite+you.+But+our+high+value+of+you%2C+hath+made+us+humbly+bold+to+expostulate+the+case+a+little+with+you%2C+and+passionately+to+beseech+you%2C+to+remember+how+great+a+work+it+is+that+lies+upon+you%2C+and+to+set+your+hands+to+it+in+this+time+of+difficulty.%0A%0ASome+of+yours+were+the+holy+hands+by+which+we+were+called+to+our+Office%2C+when+you+made+us+publicly+promise+%28according+to+the+obligation+of+our+Office%29+that+we+would+never%2C+for+fear+of+any+persecution%2C+desist+from+preaching+the+Gospel%3B+and+far+be+it+from+our+Fathers+to+withdraw%2C+as+soon+as+persecution+begins.+Suffer+us+with+all+modesty+and+submission%2C+to+reason+with+you.+Hath+not+God+said%2C+Necessity+is+laid+on+you%2C+and+WO+unto+you+if+you+preach+not+the+Gospel%3F+Who+sha make+full+proof+of+your+Ministry%2C+and%2C+as+good+Soldiers+of+Jesus+Christ%2C+to+endure+hardness%3F+Shall+you+with+Jonah%2C+fly+to+Tarshish%2C+when+the+Lord+sends+you+about+your+work%3F+will+you+not+rather+say%2C+with+resolution%2C+as+holy+Nehemiah%2C+Shall+such+a+man+as+I+flee%3F+Who+is+there%2C+that+being+as+I+am%2C+would+flee%3F+%26c.+And+as+the+Apostles%2C+your+Leaders%2C+when+in+your+case%3B+And+now%2C+Lord%2C+behold+their+threatnings%2C+and+grant+unto+thy+Servants%2C+that+with+all+boldness+they+may+speak+thy+Word.%E2%80%9D%0A%0A%E2%80%94+Joseph+Alleine%2C+A+call+to+Archippus%2C+or%2C+An+humble+and+earnest+motion+to+some+ejected+ministers+%28by+way+of+letter%29.+To+take+heed+to+their+ministry%2C+that+they+fulfil+it%2C+%28%5BLondon%5D%2C+1664%29%2C+pp+3-5.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9a76eb091a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9a76eb091a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/02/01/joseph-alleine-on-ministers-not-preaching-for-fear-of-persecution/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-f3c4ad26d2" data-kw="">
<blockquote><p>…he exhorts all the members of the visible Church to the intent they may receive righteousness and salvation from God (who is in covenant with his Church) heartily to welcome Christ Jesus, the King of glory and Lord of hosts… He exhorts, I say, patent doors to be made unto Him, wherever he offers Himself to kingdoms, cities, incorporations, visible Churches, families and hearts of men in special. Whence learn: 1. The way to make men true converts, true believers, true saints and inheriters of Heaven, is to receive Christ heartily and honorably, to cast up doors in hearty consent of faith and love, like triumphant archers for welcoming so glorious a conquerour to be their guest; ‘Lift up your heads, O ye gates, etc.’ 2. Whosoever shall receive the offer, and open the heart to Him, He shall close covenant with Him; ‘Be ye lift up ye everlasting doors, and the King of glory shall come in.’ 3. He is an unknown King till He be manifested to us; and such as are wise, when they hear of Him, will seek to know Him. ‘Who is this King of glory?’ will be their question. 4. Such as seek to know Christ, shall indeed have experimental knowledge of Him: That He is able to save them to the uttermost, to work all their work for them, to defend them from their adversaries, and to give them complete victory; ‘He is the Lord strong and mighty, the Lord mighty in battle.’ 5. We have need again and again to hear the offer of Christ’s grace, and to be wakened up to observe Christ and his glory: need to be exhorted again and again to open our hearts wide to Him. ‘Lift up your heads, ye gates,’ the second time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the First Fifty Psalms (London: T.M., 1655), on Ps. 24, verses 7-10</cite></span></figcaption>

<blockquote><p>Christ makes the feast, Lk. 15:23, and the angels make the music, verse 7. But if men will not receive the tenders of grace, Christ grieves, Mk. 3:5. He is like a judge that passes the sentence with tears in his eyes, Lk. 19:42, ‘And when He came nigh the city, He wept.’ ‘Ah sinners, I come to save you, but you put away salvation from you (Acts 13). I come with healing under my wings, but you bolt out your Physician; I would have you but open your hearts to receive Me, and I will open Heaven to receive you, but you will rather stay with your sins and die, than come to Me and live, Ps. 81:11, ‘Israel would none of me.’ Well sinners, I will weep at your funerals.’ Oh how lovely is Christ in his disposition! He comes with his supplying oil to pour into sinners’ wounds; He would fain break their hearts with his mercies, He labors to overcome their evil with his good.</p></blockquote>

<blockquote><p>It will be seen, then, that the doctrine of the irresistibility, or insuperability, of divine grace in conversion is a necessary consequence of scriptural views of man’s entire depravity, and his inability by nature to will anything spiritually good; and that all that Calvinists intend to set forth in maintaining this doctrine, is declared when they assert that it is necessary that men’s will be renewed, and that, in the commencement of the process by which this renovation is effected, they are wholly passive,—incapable of co-operating with divine grace, or with the Holy Spirit operating upon them, until He has, by His own almighty power, effected an important change upon them. This change is sometimes called regeneration, when that word is taken in its most limited sense, as distinguished from conversion [the exercise of faith in Christ and repentance]; and, in that case, regeneration means the first implantation of spiritual life,—the process of vivification, or making alive,—while conversion describes the process by which men, now quickened and renewed,—no longer passive, but active,—do willingly turn to God, and embrace Jesus Christ as all their salvation and all their desire; and the whole is comprehended under the designation of effectual calling, which includes the whole work of the Spirit, in applying to men the blessings which Christ purchased, and in effecting that important change in their condition and character which is, in every instance, indispensable to salvation. An essential part of this process is the renovation of the will, or the giving it a new capacity or tendency,—a power of willing what is spiritually good,—whereas before it could will only what was spiritually evil. And it is important to have our attention directed to this feature in the process, as it is that right views of which most directly oppose and exclude Arminian errors upon this subject. In the description of effectual calling, given in the [Westminster] Shorter Catechism, it is said to be “a work of God’s Spirit, whereby, convincing us of sin and misery, enlightening our minds in the knowledge of Christ, and renewing our wills, He does persuade and enable us to embrace Jesus Christ freely offered to us in the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology, vol. 2, 1862, reprinted Banner of Truth, 1994, Ch. 25, The Arminian Controversy, Section 6, Efficacious &amp; Irresistible Grace</cite>, pp. 411-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

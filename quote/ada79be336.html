<main class="wrap"><figure class="quote" id="q-ada79be336" data-kw="">
<blockquote><p>For the answering of this, we must make a double distinction: one of errors, the other of persons that err. Of errors, some are destroyers of the Faith, some only weakeners of it: A destroyer is that which overturns any fundamental point of religion, which is of that nature, that if it be denied, religion itself is overturned, as the denial of the death of Christ, and the immortality of the soul, justification by works, and such like; And the sum of these fundamental points is comprised in the Creed of the Apostles and the Decalogue. A weakening error is that the holding whereof does not overturn any point in the foundation of salvation, as the error of freewill and sundry such like. This distinction is made by the Holy Ghost, who says expressly that the doctrines of repentance, and faith, and baptisms, and laying on of hands, and the resurrection, and the last Judgment, are the foundation, namely of religion: and again, that Christ is the foundation, and that other doctrines consonant to the Word are as gold and silver laid thereupon. Secondly, persons erring, are of two sorts: Some err of weakness, being carried away by others, or of simple ignorance, not yet being convicted and informed concerning the truth. Some again err of obstinacy or affected ignorance, which having been admonished and convicted, still persevere in their forged opinions. This being said, we now come to the point: If any man or Church shall hold an error of the lighter kind, he still remains a member of the Church of God, and so must be reputed of us. As when a Lutheran shall hold that images are still to be retained in the church, that there is an universal election of all men, etc.; for these and such like opinions may be maintained, the foundation of salvation unrazed. This which I say is flatly avouched by Paul. ‘If any man’ (says he): ‘build on this foundation gold, silver, precious stones, timber, hay, or stubble, his work shall be made manifest by the fire, etc. and if any man’s work burn, he shall loose, but yet he shall be safe himself.’ And therefore the hay and stubble of men’s errors that are beside the foundation, on which they are laid, do not debar them from being Christians or members of the Church. A man breaks down the windows of his house; the house stands: he breaks down the roof or the walls, the house yet stands, though deformed. He pulls up the foundation, the house itself falls and ceases to be a house. Now religion which we profess is like a house or building: and some points thereof are like windows, doors, walls, roofs, and some are the very foundation: and the former may be battered, the foundation standing. Again, if the error be directly or by necessary consequent, even in common sense against the foundation, consideration must be had whether the Church or party errs of weakness or malice: If of weakness, the party is to be esteemed as a member of the catholic Church. And thus Paul writes unto the Church of Galatia, as to a church of God, though by false teachers it had been turned away to another Gospel, and embraced the fundamental error of justification by works. But when any man or church shall hold fundamental errors in obstinacy or affected ignorance, we are not then bound to repute them any longer as churches or Christians, but as such to whom condemnation belongs, as Paul shows by the example of Jannes and Jambres. And as Jannes and Jambres, says he, withstood Moses, so do these also resist the truth, men of corrupt minds, reprobate concerning the faith. Yet withal, this caveat must ever be remembered, that we rather condemn the error than the person that errs, because God’s mercy is like a bottomless sea, whereby He works what He will and when He will in the hearts of miserable sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Creed, on the Church in A Golden Chain</cite>, (Cambridge, 1600), pp. 493-94</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7091759340" data-kw="">
<blockquote><p>If it be said, that final perseverance, which is so express a condition of salvation in the new covenant, is not indeed the condition of our first justification, but it is the condition of the continuation of our justification; then they yield up their grand position, that whatever is a necessary condition of the new covenant is a necessary condition of justification: for it is that which they call the first justification alone which we treat about. And that the continuation of our justification depends solely on the same causes with our justification itself, shall be afterwards declared.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-78f2548b78" data-kw="">
<blockquote><p>Wherefore I say then, that on supposition that a man lives in this world, perseverance unto the end is a necessary condition of his justification. And if so, no man can be justified whilst he is in this world; for a condition does suspend that whereof it is a condition from existence until it be accomplished. It is, then, to no purpose to dispute any longer about justification, if indeed no man is, nor can be, justified in this life. But how contrary this is to Scripture and experience is known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-e7d3313ae5" data-kw="">

</figure><figure class="quote" id="q-7d87be8070" data-kw="">
<blockquote><p>This proposition, — that God pardons men their sins, gives them the adoption of children, with a right unto the heavenly inheritance, according to their works, — is not only foreign to the gospel, but contradictory unto it, and destructive of it, as contrary unto all express testimonies of the Scripture, both in the Old Testament and the New, where these things are spoken of; but that God judges all men, and renders unto all men, at the last judgment, according unto their works, is true, and affirmed in the Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 6</span></figcaption>

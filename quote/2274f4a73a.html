<main class="wrap"><figure class="quote" id="q-2274f4a73a" data-kw="">
<blockquote><p>It is worthy of note, that in every form of religion established by God among men, the Sabbath has stood forth its most conspicuous monument. In the religion of nature, which was strictly a religion of law, and had respect to man in his primitive holiness, the Sabbath was the only ordinance of worship.

There was the law written upon Adam’s heart; there was the tree of temptation for the proof of his obedience; there was the sacramental tree of life, the seal of the covenant and its blessings, instantly forfeited upon transgression; but amidst them all rose the Sabbath, itself the sign of a more perfect rest, the great comprehensive institute of natural religion, embodying the worship which man owes to God, and embracing that obedience to His law, which was its fundamental element. It was eminently proper that man should thus bring, in the worship of the Sabbath, a pledge of his soul’s deepest homage to God. But this was not all; in its repose also, he brought a religious tribute of that very life and being which God had bestowed.

In the gift of immortality, God set the seal of His own image upon the existence which He gave to man. If it was not self-being, since this could not be given, it was at least ceaseless being; and this natural endowment is placed as the stake of man’s obedience, which the law covers with its mortgage. Now, it is of this very being, thus consecrated by the seal of God’s image, and placed as the pawn to be redeemed only by perfect obedience to the divine law, that man, in the repose of the first Sabbath, offered the first fruits to God; and ever as this weekly day of rest recurs, is there presented a perpetual wave-offering before the Lord, by which our whole time and life are surrendered to Him, and anew received at His hands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-morgan-palmer.html">Benjamin Morgan Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pastoral Letter on the Observance of the Sabbath, to the Churches and Church members within the Synod of South Carolina in Minutes of the Synod of South Carolina, at their Sessions, in Winnsborough, Fairfield District, S.C., Nov. 1851</cite></span></figcaption>

</figure><figure class="quote" id="q-8d6d420903" data-kw="">
<blockquote><p>In worship, their paintings, crossings, crucifixes, bowings, cringings, altars, tapers, wafers, organs, anthems, litany, rails, images, copes, vestments,—what were they but Roman varnish, an Italian dress for our devotion, to draw on conformity with that enemy of the Lord Jesus? In doctrine, the divinity of Episcopacy, auricular confession, free-will, predestination on faith, yea, works foreseen, “limbus patrum,” justification by works, falling from grace, authority of a church, which none knew what it was, canonical obedience, holiness of churches, and the like innumerable,—what were they but helps to Sancta Clara, to make all our articles of religion speak good Roman Catholic? How did their old father of Rome refresh his spirit, to see such chariots as those provided to bring England again unto him! This closing with Popery was the sting in the errors of those days, which cause pining, if not death, in the episcopal pot.</p></blockquote>

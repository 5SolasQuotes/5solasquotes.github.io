<main class="wrap"><figure class="quote" id="q-9b84dda9a4" data-kw="">
<blockquote><p>For the choosing of widows that are poor to take care of the poor and sick in hospitals, we think it just as necessary now as then, though no ways if there be none sick and poor in the Church: But that widows were Church-officers ordained, as were deacons, Acts 6:6, we never thought, and therefore we do not see that the wanting [lacking] of such widows, is the want of a positive institution of Church-policy; for other positive things of policy that should be of perpetual use, and not all of the same kind, and of equal necessity: I see no reason (which I speak for apostles) which were necessary then, and not now;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (London, 1646), Introduction</cite>, p. 12</span></figcaption>

— George Gillespie, Male Audis [Bad Hearing] or an Answer to Mr. Coleman, his Male dicis [Bad Speaking]... (London, 1646), ch. 4, p. 35">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+thirteenth+and+last+error+%5Bof+Coleman%2C+an+Erastian%5D+concerns+the+office+of+deacons.+Not+only+a+widow+but+a+deacon+is+denied+to+be+a+Church-officer%2C+or+to+have+any+warrant+from+Scripture.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+Male+Audis+%5BBad+Hearing%5D+or+an+Answer+to+Mr.+Coleman%2C+his+Male+dicis+%5BBad+Speaking%5D...+%28London%2C+1646%29%2C+ch.+4%2C+p.+35&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feaa56d251c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eaa56d251c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-office-of-widows-the-churchs-ministry-to-the-needy/#:~:text=The%20thirteenth%20and%20last%20error%20%5Bof,to%20have%20any%20warrant%20from%20Scripture&amp;text=The%20thirteenth%20and%20last%20error%20%5Bof%20Coleman%2C%20an&amp;text=Church%2Dofficer%2C%20or%20to%20have%20any%20warrant%20from%20Scripture" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-02839b324d" data-kw="">
<blockquote><p>It is to be carefully observed, that Paul, though an apostle, does not himself, as an individual, excommunicate according to his own pleasure [in 1 Cor. 5], but consults with the Church, that the matter may be transacted by common authority. He, it is true, takes the lead, and shows the way, but, in taking others as his associates, he intimates with sufficient plainness, that this authority does not belong to any one individual. As, however, a multitude never accomplishes anything with moderation or seriousness, if not governed by counsel, there was appointed in the ancient Church a presbytery, that is, an assembly of elders, who, by the consent of all, had the power of first judging in the case. From them the matter was brought before the people, but it was as a thing already judged of. Whatever the matter may be, it is quite contrary to the appointment of Christ and his apostles — to the order of the Church, and even to equity itself, that this right should be put into the hands of any one man, of excommunicating at his pleasure any that he may choose. Let us take notice, then, that in excommunicating this limitation be observed — that this part of discipline be exercised by the common counsel of the elders, and with the consent of the people, and that this is a remedy in opposition to tyranny. For nothing is more at variance with the discipline of Christ than tyranny, for which you open a wide door, if you give one man the entire power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Cor. 5, v. 4</cite></span></figcaption>

ers#:~:text=It%20is%20to%20be%20carefully%20observed,give%20one%20man%20the%20entire%20power&amp;text=It%20is%20to%20be%20carefully%20observed%2C%20that%20Paul&amp;text=if%20you%20give%20one%20man%20the%20entire%20power" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-acd0b817f0" data-kw="">
<blockquote><p>Nor are women, sons, servants, debarred from voicing in election because it is a Church-power, for it is no power of jurisdiction. For: 1. Their tacit [understood or implied without being stated] voices and consents are not excluded, because they must try the spirits, and not upon trust and fide implicita [implicit faith] believe every teacher more than men, or believe as the Church believes, more than their husbands, nor must they take doctrines as truth upon their husband’s word; nor are women so excluded from speaking in the Church as [that] they may upon no occasion: confess their faith, 2. profess vocally repentance, 3. depose as witnesses, [or] 4. accuse the guilty before the binding Church. 4. Nor may a [civil] corporation cast out a major [an official] by an authoritative power such as binding and loosing is, Mt. 18 [that is, the power by which they do it is not of the same kind as ecclesiastical power]. 5. We seek a warrant why the votes of women in choosing their pastors must more be included in the votes of the male than their being essential parts of the redeemed Church is included in the males, or their confessing publicly that Jesus is the Christ, as many women martyrs and sons and servants have gloriously done; and yet their confession of Christ to the death must be personal, and not included in the confession of husband or parents, as Mt. 10:32.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church Discipline Penned by Mr. Thomas Hooker… (London, 1658)</cite>, p. 257</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

<main class="wrap"><figure class="quote" id="q-ecd92a601f" data-kw="">
<blockquote><p>Anselm had said that we have an idea of a most perfect being than which none higher can be conceived. He would not have regarded such rejoinders about perfect islands in the sea or dollars in the pocket as relevant, inasmuch as neither of them can be included within the category of “most perfect of existences than which nothing greater can be conceived.” Furthermore, if anyone objected to Anselm that he could think of a most perfect being but that that did not guarantee the existence of such a being, Anselm had a ready reply.

If, he would say, you have an idea of a most perfect being which does not exist, it is not the most perfect being than which none higher can be conceived. The most perfect being which does exist is higher than the most perfect being which does not exist. Existence, after all, is greater than nonexistence. Therefore, a being which does exist is greater than one which does not exist. Consequently, the most perfect being than which none greater can be conceived must exist, because if it did not exist it would not be the being than which none greater can be conceived.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reasons for Faith</cite>, (1960; Orlando, FL: Reformation Trust Publishing, 2014), p. 51.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6e98fe4148" data-kw="">
<blockquote><p>Another argument in support of this conclusion is adduced by Damascene (On the Orthodox Faith 1, 3) from the government of things, and the same reasoning is indicated by the Commentator in 2 Physics. It runs as follows: It is impossible for contrary and discordant things to accord in one order always or frequently except by someone’s governance, through which each and all are made to tend to a definite end. Now we see that in the world things of different natures accord in one order, not seldom and fortuitously, but always or for the most part. Therefore, it follows that there is someone by whose providence the world is governed. And this we call God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1, ch. 13, ‘Arguments in Proof of God’s Existence’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><figure class="quote" id="q-dbc2bfaf22" data-kw="">
<blockquote><p>In support, however, of this kind of truth [i.e. of things of faith which cannot be known by reason alone], certain probable arguments must be adduced for the practice and help of the faithful, but not for the conviction of our opponents, because the very insufficiency of these arguments would rather confirm them in their error if they thought that we assented to the truth of faith on account of such weak reasonings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1, ch. 9</span></figcaption>

</figure><figure class="quote" id="q-334c77873e" data-kw="">
<blockquote><p>…there is more than one way in which a thing is said in the heart or conceived. For, in one sense, an object is conceived, when the word signifying it is conceived; and in another, when the very entity, which the object is, is understood. In the former sense, then, God can be conceived not to exist; but in the latter, not at all. For no one who understands what fire and water are can conceived fire to be water, in accordance with the nature of the facts themselves, although this is possible according to the words. So then, no one who understands what God is can conceive that God does not exist; although he says these words in his heart, either without any or with some foreign signification. For, God is that than which a greater cannot be conceived. And he who thoroughly understands this, assuredly understands that this being so truly exists, that not even in concept can it be non-existent. Therefore, he who understans that God so exists, cannot conceive that he does not exist. I thank thee, gracious Lord, I thank thee; because what I formerly believed by thy bounty, I now so understand by thine illumination, that if I were unwilling to believe that thou does exist, I should not be able not to understand this to be true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anselm.html">Anselm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Proslogium, or ‘Discourse’ on the Existence of God ToC in St. Anselm: Proslogium; Monologium; an Appendix in behalf of the Fool by Gaunilon</cite>, … tr. Sidney N. Deane (Chicago: Open Court Publishing Co., 1903), ch. 4, p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

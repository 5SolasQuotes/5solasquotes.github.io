<main class="wrap"><figure class="quote" id="q-17af56b02f" data-kw="">
<blockquote><p>Although it be true (which a worthy Divine [Robert Bolton] observeth) that formal Hypocrites are heartened and hardened in their lewd courses &amp; false conceits of happiness, when they hear more infamous Sinners than themselves, gloriously and flatteringly commended at their Deaths; yet we need not fear any such bad effect by the Funeral-commendation of God’s true Saints; because the public Testimony of their just Praises doth not only make the wicked more inexcusable, and the Glory of God’s Graces shine far brighter to Posterity; but also enkindleth in the hearts of the godly a greater fire of Zeal for imitation.

These are some of the Ends, why it hath ever been and is still an unreproveable Custom in God’s Church, that the Godly should be Marked and Honoured at their Deaths, as Hezekiah was by all Judah &amp; Jerusalem: Valentinean, Satyrus and Theodosius by Saint Ambrose: Basil, Gregory and Gorgonia by Nazianzen: Nepotian, Paula and Marcella by S. Jerome. Had not their Holy Lives and Happy Deaths been published by such unpartial Pens, we should have been ignorant now of many excellent Courses of sanctified Men and Women, of many comfortable workings of the Holy Ghost in them, and should have wanted many inflaming Motives to follow their religious steps. …

We the Ministers of Christ, and Stewards of the Mysteries of God, must adorn none with the Honourable Attributes of Heavenly Praise; but such as are truly beautified, enriched, and ennobled with the Purity and Power of God’s Fear in their Humble Souls. This praise the Lord will Prosper, which is uttered in that Wisdom, whereof the Fear of the Lord is the beginning. But for the Saints themselves: I dare say with Saint Augustine, that they desire more the Imitation, than the Commendation of their virtues: …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hannibal-gamon.html">Hannibal Gamon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The praise of a godly woman. A sermon preached at the solemn funeral of the right honourable lady, the Lady Frances Roberts, at Lanhide-rock-Church in Cornwall, the tenth of August, 1626</cite>, (London: John Grismond, 1627), dedication.</span></figcaption>

</figure><figure class="quote" id="q-1c3100eede" data-kw="death wages of sin">

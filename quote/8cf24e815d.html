<main class="wrap"><figure class="quote" id="q-8cf24e815d" data-kw="">
<blockquote><p>By SYNECDOCHE, 1. More universal terms are put for such as are more restricted: as ALL, for many; for all kinds; for the greater or better part, Matth. iii. 5. and xix. 28; the world, for the Roman empire, the Gentiles, the wicked, the Antichristians, Luke ii. 1. 1 John ii. 2. and v. 18. Rev. xiii. 8; every creature, for men, Mark xvi. 15; or the plural number for the singular, as children, for child, Gen. xxi. 7. 2. More restricted terms are put for such as are more extensive: as, one for all of the kind, Psal. i. 1; yesterday, for time past, Heb. xiii. 8; a limited number, as thrice, seven, or ten times, for frequently, 2 Cor. xii. 8. Psal. cxix. 164; a thousand, five thousand, for an uncertain number, Is. xxx. 17. 3.

A whole person, thing, place, or time, is put for an adjunct or part of it. So Christ is said to die; to be buried; when only his body died, and was buried, John xix. 42. and ii. 13; world is put for Canaan, Rom. iv. 13; north for Chaldea, Jer. i. 13. for ever, for a long time, Dan. ii. 4. 4. A part of a person, thing, place, or time, is put for the whole of it. So souls denote human persons, Acts ii. 41; resurrection is put for Christ’s whole appearance in our nature, Acts i. 22; hour for a period of time, John iv. 23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief view of the figures: and explication of the metaphors, contained in scripture</cite>, (Edinburgh: Gavin Alston, 1782), pp 6-7.</span></figcaption>

<blockquote><p>And as touching the binding power of their [magistrates’] laws, be they never so just, they cannot bind you any other way, nor [except] in respect of the general end of them: For per se they cannot bind more than the Churches’ laws can. Which things Dr. Forbes also has told you out of Calvin [Irenicum, bk. 2, ch. 4, §3]. And hence it follows, that whensoever you may omit that which princes enjoin, without violating the law of charity, you are not holden to obey them, [even] for the majesty of princely authority. … whatsoever princes can commendably either do by themselves, or command to be done by others in such matters as anyway pertain to the external worship of God, must be both lawful in the nature of it, and expedient in the use of it, which conditions if they be wanting [lacking], their commandments cannot bind to obedience. … 3. We are bound by the Law of God to do nothing which is not good and profitable or edifying, 1 Cor. 6:12 &amp; 14:26. This Law of Charity is of a higher and straighter bound than the Law of any prince in the world… Therefore it is most necessary as well for princes to permit, as for subjects to take liberty to try and examine by the judgement of discretion, everything which authority enjoins whether it be agreeable or repugnant to the rules of the Word, and if after trial it be found repugnant to abstain from the doing of the same.</p></blockquote>

<blockquote><p>For if it be a great Crime, and almost an Impiety not to live under and suffer patiently the Humours and harsh Usage of our Natural Parents; ’tis sure a much greater, not to endure those of our Country, which wise Men have unanimously preferred to their Parents. …

But a Man may sometimes say, My Country is grown mad or foolish, (as Plato said of his) sometimes that it rages and cruelly tears out its own Bowels.—We are to take care in the first Place, that we do not ascribe other Folks Faults to our innocent Country. There have been may cruel Tyrants in Rome and in other Places; these not only tormented innocent good Men, but even the best deserving Citizens, with all manner of Severities: Does it therefore follow, that the Madness of these Tyrants must be imputed to their Country?

The Cruelty of the Emperor Macrinus is particularly memorable; who as Julius Capitolinus writes, was nicknamed Macellinus, because his House was stained with the Blood of Men, as a Shambles is with that of Beasts. Many such others are mentioned by Historians, who for the like Cruelty (as the same Capitolinus tells us) were styled, one Cyclops, another Busiris, a 3d Sciron, a 4th Tryphon, a 5th Gyges. These were firmly persuaded, that Kingdoms and Empires could not be secured without Cruelty: Would it be therefore reasonable, that good Patriots should lay aside all Care and Solicitude for their Country? Certainly they ought rather to succour her, when like a miserable oppressed Mother, she implores her Children’s Help, and to seek all proper Remedies for the Mischiefs that afflict her.</p></blockquote>

<blockquote><p>Augustine: … First of all, I think there should be a discussion whether a charging enemy or a murderer attacking from ambush may be killed without lust, but for the sake of one’s life, freedom, or chastity.

Evodius: How can I think that people are free of lust if they fight ferociously for things that can be lost against their will? On the other hand, if such things cannot be lost, what need is there to resort to killing someone for their sake?

Augustine: Therefore, the law is unjust which grants permission (a) to a traveller to kill a highway robber, so as not to be killed himself; (b) to any man or woman to slay a rapist in his onslaught, if possible, before enduring rape. Indeed, the law bids a soldier to kill the enemy, and if he holds back from this bloodshed he pays the penalties from his commander. Surely we will not dream of calling these laws unjust – or rather, not to call them “laws” at all, for a law that is not just does not seem to me to be a law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Free Choice of the Will</cite>, (c. 387-95), ed. and trans. Peter King (Cambridge: Cambridge University Press, 2010), 1.5.11.32-33.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“Augustine: … First of all, I think there should be a discussion whether a charging enemy or a murderer attacking from ambush may be killed without lust, but for the sake of one’s life, freedom, or chastity.

Evodius: How can I think that people are free of lust if they fight ferociously for things that can be lost against their will? On the other hand, if such things cannot be lost, what need is there to resort to killing someone for their sake?

Augustine: Therefore, the law is unjust which grants permission (a) to a traveller to kill a highway robber, so as not to be killed himself; (b) to any man or woman to slay a rapist in his onslaught, if possible, before enduring rape. Indeed, the law bids a soldier to kill the enemy, and if he holds back from this bloodshed he pays the penalties from his commander. Surely we will not dream of calling these laws unjust – or rather, not to call them “laws” at all, for a law that is not just does not seem to me to be a law.”

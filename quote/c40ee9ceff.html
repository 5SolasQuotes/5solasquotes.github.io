<blockquote><p>Vers. 18. For ye are not come unto the Mount that might be touched, and that burned with fire, nor unto blackness, and darkness, and tempest,

19. And the sound of a Trumpet, and the voice of words, which voice they that heard, intreated that the word should not be spoken to them any more.

20. (For they could not endure that which was commanded: and if so much as a beast touch the Mountain, it shall be stoned, or thrust through with a dart.

21. And so terrible was the sight, that Moses said, I exceedingly fear and quake.)

Reas. 3. To this sense, Ye are not called to the Legal Covenant, and its terrors, to vers. 22. but to the Covenant of Grace, and to the most sweet society of Christ and his Saints, to vers. 25. Therefore ye ought to look diligently lest any man fail of Grace, or lest any man be profane,, i. e. lest any man detract by his Infidelity from the Grace of God, into profane licentiousness, which is the same with the Apostle’s conclusion inferred, vers. 25. See that ye refuse not him, that is, Christ that speaketh, &amp;c.

The force of the Argument is this, If now (seeing that not fear, but love, not Justice, but Grace, not the Law, but Gospel offers itself to be your leader in your way to Heaven) ye shall fail of Grace, or abuse it to profaneness, it shall come to pass, that ye will be found to refuse and reject Christ speaking from Heaven, and most gently inviting you to the communion with himself and his Saints, which ye ought to have a care of. As for the Covenants of works, or the Law, he sets down the terrible manner wherein the Law was delivered, of which description there are eight Branches.

(1) In the Covenant of works, or Legal Covenant there was a Mountain that might be touched, or earthly (whereto Heaven is opposed, or the heavenly Mount Zion, the Throne of Grace) as if he had said, After ye believed in Christ, ye came not unto the Mount that might not be touched, and that which is earthly, the very sight whereof did affright, thereby the throne of Justice was represented, wherein God sitteth, when he deals with the unregenerate man, that putteth confidence in his own strength, shining in the merit of his own works.

(2) In making that Covenant, the Mount burned with fire, whereby the anger of the Judge armed, and ready to consume sinners, trusting in their merits or works, or dealing with him from the Covenant of works.

(3) In making that Covenant, there was a whirlwind, darkness, and a tempest, whereby was represented the perplexed condition, amazement and horror of the mind, whereby the soul of the sinner is repressed when the Judge shews to him out of the Law or Covenant of works, his justice and anger, according to the condition of the violated Covenant.

(4) In giving the Law there was the sound of a Trumpet, whereby was signified that all who are guilty of violating the Covenant of works, shall be cited, and of necessity appear before the Tribunal of God the supreme Judge, and none escape.

(5) In making that Covenant there was a voice of words, by which was represented the Letter of the Law, reciting the duties we were bound to, but not at all conferring strength for the performing of the things commanded.

(6) In making that Covenant, they who had heard the voice of words, intreated that the word should not be spoken to them any more, whereby was signified the intolerable weight of multiplied guilt contracted by the violation of the Law, as also despair touching the future performance of the Law incumbent upon the conscience, when God deals with the sinner out of the Covenant of works. That which the Apostle here intimates, when he says, For they could not endure that which was commanded.

(7) In making that Covenant, if so much as a beast had touched the Mountain, it was to be stoned or thrust through with a dart, whereby was signified; First, That the sinner is excluded from all access to God, neither is it lawful that any sinner should approach to him, from the condition of this Covenant. Secondly, That both the sinner, and all things that belong unto him, his Oxen and Cattel are an abomination unto God. Thirdly, That the sinner is to perish miserably by this Covenant, i. e. with contempt and ignominy, as with stones and darts shot at his cursed and abominable head.

(8) In making that Covenant, so terrible was the sight, that Moses said, I exceedingly fear and quake, and confessed his horror; whereby was also signified that the most holy or just men could not be able to stand before God, if they should be dealt with according to the Covenant of works, as Psal. 143. v. 2. It is said, In thy sight shall no flesh living be justified: This is the former part of the Argument, the sum whereof is this. God hath delivered you from the Covenant of works, and the terrors thereof.</p></blockquote>

<blockquote><p>The second way He presses it, verse 20, is, by a most instant and importunate pursuing of His offer, with a protestation of his being there, and of his making the same. This is done four ways;

1. By showing His work and posture, I stand at the door and knock. Hearts are naturally as castles shut and guarded by the Devil against Christ: When He comes with His ordinances, He does thereby, as it were, lay a siege at them, and by His word knock at the doors thereof to gain their consent; and the more pungently he presses by His ordinances, He is said to knock the more: And in this respect, Song 5:2, His voice is said to knock at the believer’s door in their sleepy condition. Here these two things are imported:

1. Christ’s continuing to deal with His Church, and to wait upon her in His ordinances, notwithstanding of her many former refusals. Thus, He is said to stand at the door: Whereby is holden forth their ingratitude to him, in keeping of Him out, and His patience that still waits on.

2. In this, by the other word, is imported His growing more instant in His dealing with them: Therefore He is said to knock. And indeed if the former sharp threatening and charge, and the sweet free offer be considered, it may well be said that now His knocks are doubled. 2. The second way He presses in this verse, is, by making His offer particular, as it were, bringing it to every man’s door, If any man hear My voice, and open the door, etc.</p></blockquote>

<blockquote><p>XIV. The efficacy of this instrument, and its entire power in producing the effect, depends on the Holy Spirit and his interior operation in the soul (Acts 16:14). It gives to this vocation its formal character, by which it is distinguished from that general call which is common even to the reprobate, so much so that if the Spirit of God did nothing more here than there, it would not be efficacious, but would be vain for salvation (2 Pet. 1:3).

XV. Just as, on the contrary, if He should operate here as He is accustomed to do in the conversion of the elect (for even in the reprobate He is often efficacious in some manner and degree) (Mt. 13:20), the effect would necessarily exist, and the man would necessarily be brought to obedience and to a new life in Christ (Jn. 6:44-45).</p></blockquote>

<blockquote><p>VII. (2) The question [at hand to be discussed] is not whether God is born by a general love and philanthropy (philanthropia) towards men as his creatures, and also bestows upon them various temporal benefits pertaining to the things of this life (ta biotika). We do not deny that God has never left Himself without witness (amartyron) with regard to this (Acts 14:17). And we readily grant that there is no one who does not owe some gratitude to God and who, whatever he is or can do, is not bound to give thanks to his Creator. But the question concerns the special and saving love which tends to spiritual benefits, and by which God willed to have mercy upon them to salvation. We think this is particular to the elect alone, not universal and common to all.</p></blockquote>

<blockquote><p>4. A change from the offers of Grace, to the Revelations of Wrath: Shall thy loving kindness be declared in the grave, or thy faithfulness in destruction (says the Psalmist) in Psalm 88:11. True in the 1 Pet. 3:19-20, we read of Christ’s preaching by his Spirit to the Spirits in Prison, that is, to souls in Hell: But mark, when was it that he preach’d to them? not when in prison, but in the days of Noah, when they lived in the world. There is never an offer of grace and love made to souls in the Grave; while life lasts, the soul hears the joyful sound: And O the sweet offers, the gracious tenders, the loving invitations, that are made to him of Christ, of Grace, of Eternal Life and Love! O the wooings, the meltings, the entreatings, the allurings of Divine Love to and over the soul! but when death comes, farewell all these, farewell all the sweet offers of Christ, and all the blessed motions of the Spirit; then there’s nothing but wrath revealed, and wrath shall come on the neglecting soul to the uttermost.

5. A Change from fair probabilities to utter Impossibilities of Life and Salvation; a sad change still: Now is the accepted time, now is the day of Salvation; now, and not hereafter, 2 Cor. 6:2. Now there is a fair probability of the worst of Sinners to be saved, if they will look after Salvation, and mind their eternal Concerns; Christ is both able and willing to save: To save was the end of his coming into the World, and of all he did and suffered here, 1 Tim. 1:15. Now they are besought and entreated to be reconciled to God, 2 Cor. 5:19,20, but when Death comes, that changes these fair probabilities into utter Impossibilities of Life and Salvation. Therefore mark: Now (says the Apostle) is the day of Salvation; that is, now whilst Life lasts, and while the Gospel is preached.</p></blockquote>

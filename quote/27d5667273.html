<main class="wrap"><figure class="quote" id="q-27d5667273" data-kw="">
<blockquote><p>The image consists antecedently in nature (as to the spirituality and immortality of the soul); formally in rectitude or original righteousness; consequently in the dominion and immortality of the whole man (which was the brightness of that shining image and the rays striking out in all directions which illumined the whole man).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 1, p. 466</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“The image consists antecedently in nature (as to the spirituality and immortality of the soul); formally in rectitude or original righteousness; consequently in the dominion and immortality of the whole man (which was the brightness of that shining image and the rays striking out in all directions which illumined the whole man).”

— Francis Turretin, Institutes, vol. 1, p. 466">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+image+consists+antecedently+in+nature+%28as+to+the+spirituality+and+immortality+of+the+soul%29%3B+formally+in+rectitude+or+original+righteousness%3B+consequently+in+the+dominion+and+immortality+of+the+whole+man+%28which+was+the+brightness+of+that+shining+image+and+the+rays+striking+out+in+all+directions+which+illumined+the+whole+man%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes%2C+vol.+1%2C+p.+466&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F27d5667273.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/27d5667273.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/man-the-image-of-god#:~:text=The%20image%20consists%20antecedently%20in%20nature,directions%20which%20illumined%20the%20whole%20man&amp;text=The%20image%20consists%20antecedently%20in%20nature%20%28as%20to&amp;text=in%20all%20directions%20which%20illumined%20the%20whole%20man" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6a86336749" data-kw="">
<blockquote><p>V… But as a supernatural good, spiritual and religious, man knew God, His revealed will, and found his supreme happiness therein with perfect accuracy. He was also endowed with an excellent knowledge of other things, as evidenced by the accurate naming of creatures according to their natures (Genesis 2:19-20) and the instantaneous recognition of his spouse, which amply confirmed this (Genesis 2:23). [Faustus] Socinus, then, must be considered utterly foolish for attributing brutish stupidity to such an excellent man… From this habitual righteousness, like a fountain, actual holiness arose in the lower faculties and the entire composite. The harmony (συμμετρία) of the sensitive appetite, both in desire (ἐπιθυμία) and passion (πάθος), was conformed to the superior faculties and right reason. This assembly of habits (commonly called Original Righteousness) constituted this image of God, particularly as its highest point (καρυφαῖον)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download</cite>, tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“V… But as a supernatural good, spiritual and religious, man knew God, His revealed will, and found his supreme happiness therein with perfect accuracy. He was also endowed with an excellent knowledge of other things, as evidenced by the accurate naming of creatures according to their natures (Genesis 2:19-20) and the instantaneous recognition of his spouse, which amply confirmed this (Genesis 2:23). [Faustus] Socinus, then, must be considered utterly foolish for attributing brutish stupidity to such an excellent man… From this habitual righteousness, like a fountain, actual holiness arose in the lower faculties and the entire composite. The harmony (συμμετρία) of the sensitive appetite, both in desire (ἐπιθυμία) and passion (πάθος), was conformed to the superior faculties and right reason. This assembly of habits (commonly called Original Righteousness) constituted this image of God, particularly as its highest point (καρυφαῖον)…”

CE%B1%CF%81%CF%85%CF%86%CE%B1%E1%BF%96%CE%BF%CE%BD&amp;text=But%20as%20a%20supernatural%20good%2C%20spiritual%20and%20religious&amp;text=of%20God%2C%20particularly%20as%20its%20highest%20point%20%28%CE%BA%CE%B1%CF%81%CF%85%CF%86%CE%B1%E1%BF%96%CE%BF%CE%BD" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ee60753388" data-kw="">
<blockquote><p>Righteousness, which is commonly called ‘Original’, is part of this image, and consists in that rectitude of human nature by which the affections obeyed the will, the will obeyed reason, and reason obeyed God. Since this was implanted in the first man in creation itself, Gen. 1:26-27, 31; 2:25; Eph. 4:24, it is rightly called ‘natural’. Through this man had free will unto good, but mutably. For when God did not preserve him, he could by a fallacious appearance of the object defect unto evil, as the event taught a little later.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-9a138aa03a" data-kw="">
<blockquote><p>The correct judgment, I would argue, is that the conscious awareness characteristic of animal life is irreducible to the properties possessed either by inorganic substances or purely vegetative living substances, but that it is nevertheless an entirely physical or corporeal phenomenon.</p></blockquote>

</figure><figure class="quote" id="q-26241bcaf4" data-kw="">
<blockquote><p>III… Furthermore, the phrase “according to his measure” [in Essenius’s definition of the image of God] is not without significance, for although this conformity is in itself most perfect, it varies according to the capacity of its subjects (since it applies differently to angels than to humans). Consequently, this image was also implanted in humans according to their measure…</p></blockquote>

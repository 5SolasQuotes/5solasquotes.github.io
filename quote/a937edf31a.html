<main class="wrap"><figure class="quote" id="q-a937edf31a" data-kw="">
<blockquote><p>But we can hardly say the physical fact of the genetic uniqueness of human fetal tissue is the basis of all the anxious inquiry, for the same uniqueness prevails in the animal world…. …when the fetus becomes a human being… the “breath of life” and the “blood which is the life” are applicable to animals as well as men. The biblical description of man’s distinctive creation “in the divine image” refers to a quality of life that, though it depends upon breath and blood, is not equated with them… although Augustine and Thomas condemned deliberate interference with the life of the fetus, they considered it homicide only when the fetus was possessed of a human soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-k-jewett.html">Paul K. Jewett</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Relation of the Soul to the Fetus: Tracing the Development of a Human Being’ Christianity Today</cite>, vol. 13 (Nov. 1968)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b65636a96f" data-kw="">
<blockquote><p>But if it is doubted about the animation of the fetus – whether a religious giving or procuring a potion for abortion, or advising or lending assistance, incurs irregularity? I respond that in the contentious forum, where the question is about punishment, interpretation ought to be made in the milder part: Law, ‘By interpretation,’ Digest, ‘On punishments.’ But in the forum of the soul, where the question is about placating God and amendment, one ought to consider himself a murderer, because in such matters the safer way is to be chosen, as in ch. ‘A young man,’ on betrothal, and it belongs to good minds to fear fault there where there is no fault: ch. ‘To his hearing’ at the end, dist. 5, argument from ch. ‘To his hearing,’ on homicide. See Navarrus in the Manual, ch. 27, n. 223.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 2, ‘On Creation’, pt. 8, ‘On Man’, pp. 264-67 Latin | So that we may now give some taste to students and others who do not have leisure to inquire laboriously into these things, or who do not have the books at hand, we set down these conclusions: | 5th conclusion: It is homicide to procure the abortion of an animated fetus, when it is doubted whether the fetus is animated. In the papacy most teach that [the state of] irregularity is incurred by such a one, because he is doubtful whether he is a murderer. [Rom. 14:23]</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“But if it is doubted about the animation of the fetus – whether a religious giving or procuring a potion for abortion, or advising or lending assistance, incurs irregularity? I respond that in the contentious forum, where the question is about punishment, interpretation ought to be made in the milder part: Law, ‘By interpretation,’ Digest, ‘On punishments.’ But in the forum of the soul, where the question is about placating God and amendment, one ought to consider himself a murderer, because in such matters the safer way is to be chosen, as in ch. ‘A young man,’ on betrothal, and it belongs to good minds to fear fault there where there is no fault: ch. ‘To his hearing’ at the end, dist. 5, argument from ch. ‘To his hearing,’ on homicide. See Navarrus in the Manual, ch. 27, n. 223.”

— Gisbert Voetius, Select Theological Disputations, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 2, ‘On Creation’, pt. 8, ‘On Man’, pp. 264-67 Latin | So that we may now give some taste to students and others who do not have leisure to inquire laboriously into these things, or who do not have the books at hand, we set down these conclusions: | 5th conclusion: It is homicide to procure the abortion of an animated fetus, when it is doubted whether the fetus is animated. In the papacy most teach that [the state of] irregularity is incurred by such a one, because he is doubtful whether he is a murderer. [Rom. 14:23]">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+if+it+is+doubted+about+the+animation+of+the+fetus+%E2%80%93+whether+a+religious+giving+or+procuring+a+potion+for+abortion%2C+or+advising+or+lending+assistance%2C+incurs+irregularity%3F+I+respond+that+in+the+contentious+forum%2C+where+the+question+is+about+punishment%2C+interpretation+ought+to+be+made+in+the+milder+part%3A+Law%2C+%E2%80%98By+interpretation%2C%E2%80%99+Digest%2C+%E2%80%98On+punishments.%E2%80%99+But+in+the+forum+of+the+soul%2C+where+the+question+is+about+placating+God+and+amendment%2C+one+ought+to+consider+himself+a+murderer%2C+because+in+such+matters+the+safer+way+is+to+be+chosen%2C+as+in+ch.+%E2%80%98A+young+man%2C%E2%80%99+on+betrothal%2C+and+it+belongs+to+good+minds+to+fear+fault+there+where+there+is+no+fault%3A+ch.+%E2%80%98To+his+hearing%E2%80%99+at+the+end%2C+dist.+5%2C+argument+from+ch.+%E2%80%98To+his+hearing%2C%E2%80%99+on+homicide.+See+Navarrus+in+the+Manual%2C+ch.+27%2C+n.+223.%E2%80%9D%0A%0A%E2%80%94+Gisbert+Voetius%2C+Select+Theological+Disputations%2C+vol.+1+tr.+by+AI+by+Onku+%28Utrecht%3A+Johannes+a+Waesberg%2C+1648%29%2C+pt.+2%2C+%E2%80%98On+Creation%E2%80%99%2C+pt.+8%2C+%E2%80%98On+Man%E2%80%99%2C+pp.+264-67+Latin+%7C+So+that+we+may+now+give+some+taste+to+students+and+others+who+do+not+have+leisure+to+inquire+laboriously+int </figure><figure class="quote" id="q-a971aaef88" data-kw="">
<blockquote><p>Others (Rodr., Sum., Tome 1, ch. 5, de Abort.) more probably hold that if the case be utterly desperate, and it be certain that both mother and child must undoubtedly perish if some speedy remedy be not had, it may then be lawful to make use of such receits [receiving treatments] as may possibly give some hopes to save the mother, though not without some peril of the child. But all this while the intentions and indeavours must be no other than preservatory, however it pleases God to order the events: Shortly, no man that purposely procures an abortion, as such, can wash his hands from blood; No woman that willfully acts, or suffers it (however the secrecy may exempt her from the danger of human laws) can think to avoid those judgments of the righteous God, which he has charged upon murderers. … But withal, let me advise you, (with Martinus Vivaldus, Mart. Alphons. Vivald., Expli. Bull Crue.) that what I have herein written against the procurers of abortions may not be extended to the practice of those discrete physicians and chirurgeans [surgeons], who, being called to for their aid in difficult and hopeless child-births, prescribe to the woman in travail such receits as may be like to hasten her delivery (whether the child be alive or dead); forasmuch as the conception is now at the full maturity and the endeavor of these artists is not to force an abortment, but to bring forward a natural birth to the preservation of the mother, or the child, or both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times</cite>, 2nd Decade, Case 3, ‘Whether may it be Lawful, in Case of Extremity, to Procure the Abortion of the Child, for the Preservation of the Mother?’ in Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times (London, 1654), pp. 96-7, 100</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-db93995baf" data-kw="">
<blockquote><p>…the burden of proof for sin is on those who call conception control sin. NCC [No-Conception-Control] advocates often try to reverse the burden of proof and ask, “Where does the Bible justify the use of conception control?”… the Bible gives individuals and families maximum liberty (whatever is not forbidden is allowed).</p></blockquote>

</figure><figure class="quote" id="q-25f516dcaa" data-kw="">
<blockquote><p>In order effectively to serve the needs of human life, modern biology reconstructed the nature of the organic body, representing it not as something animated, purposive and striving, but as dead matter-in-motion. This reductive science has given us enormous power, but it offers no standards to guide its use. Worse, it challenges our self-understanding as creatures of dignity, rendering us incapable of recognizing dangers to our humanity that arise from the very triumphs biology has made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-may.html">William May</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Leon Kass &amp; the Challenge of Bioethics’</cite>, (2003) | Kass:</span></figcaption>

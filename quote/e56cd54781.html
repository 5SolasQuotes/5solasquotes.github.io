<main class="wrap"><figure class="quote" id="q-e56cd54781" data-kw="">
<blockquote><p>First, their ecclesiasticall errors, such as peculiarly concern the doctrine or discipline of the Church are: First, that Christ took not flesh from the Virgin Mary, but that he passed through her as the sun beams do through glass, or rain through a spout. Secondly, that there is no original sin. Thirdly, that children ought not to be baptized. Fourthly, that such as have been baptized in their infancy ought to be re-baptized when they come to years of discretion. Fifthly, that lay-people may preach and administer the sacraments… Sixthly, that men have free will, not only in natural and moral, but also in spiritual actions. Seventhly, that absolution and the church-peace ought to be denied to such who are fallen into any grievous sin; yea, though they repent of it. Eighthly, that Luther’s doctrine is worse than the Pope’s. Secondly, their politicall errors, or in matter of state, are: First, that the people may depose their magistrates and chief rulers… Secondly, that a Christian with a good conscience may not take upon him, or bear the office of a magistrate, or keep any court of justice. Thirdly, that none may administer an oath to another. Fourthly, that no malefactors ought to be put to death. Thirdly, their economical errors [about the family] are: First, that no man has a propriety in his goods, but that all things ought to be held in common. Secondly, that it is lawful to have more wives than one at once. Thirdly, that a man may put away his wife if she differ from him in point of religion, and be not of their sect. … All the errors of the Anabaptists are of two sorts: First, such as they hold in common with other heretics. Secondly, such as are peculiar to their sect. First, concerning the common errors [not mentioned above]… First, with the Millenaries and their joint issue is, that Christ before the day of judgement shall come down from Heaven, and reign with the saints upon earth a thousand years; in which time they shall destroy all the wicked, binding their kings in chains, and their nobles in links of iron. … Thirdly, with the Donatists and their joynt issue is that in the true church there are no scandals, or lewd and vicious livers; that the church of Christ is confined to their sect; that we ought to separate from all assemblies of Christians wherein there are any abuses or scandals, yea, though the church allows them not, but seeks to reform them; that all such as have been baptized by any other than those of their sect, ought to be rebaptized. … Seventhly, with the Enthusiasts and their joint issue is that the Scripture is not our only rule of faith and manners, but that God reveals his will to his children at this day by visions and dreams… … Ninthly, with the Arminians and their joint issue is, that there is no original sin, or at least, that none is damned for it alone; that election is upon foreseen faith and repentance; that God gives all men sufficient grace to be saved; that man has free-will of himself either to accept or refuse God’s grace; that Christ died indifferently for all; that a true beleever, who is in the state of grace, may fall away totally and finally. Tenthly, with the Brownists or Barrowists and their joint issue is, that there ought to be a parity in the church… that in regard of these and such like abuses and corruptions [in ceremonies and governemnt] the church of England is no true Church of Christ, and consequently, that all that have a care of their soules must of necessity separate from her. Eleventhly, with a peculiar sect, called the Separati and their joint issue is, that no Christian may go to law, or in any case to right himself by arms or violent means. Secondly, such [errors] as are peculiar to their sect, and these are six: … Thirdly, that there ought to be no set form of Liturgy or prayer by the book, but only by the Spirit. Fourthly, that there ought to be no distinction by the Word of God between the clery and the laity, but that all who are gifted may preach the Word and administer the sacraments. Fifthly, that it is not lawful to take an oath at all, no, not though it be demanded by the magistrate…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dippers Dipped, or, the Anabaptists Ducked &amp; Plunged… (London, 1645), Ch. 2, ‘Of the Errors of the Anabaptists, both common to other sects, and those which are peculiarly their own’</cite>, pp. 28-32</span></figcaption>

<blockquote><p>…use the best skill you have to instruct your children and servants, yet this is no reason to withdraw them from public instructions: nor can any man, who understands his religion, think he discharges his duty to God and the Church, merely by his private instruction of his family, when he neglects, or refuses to bring them to public instructions. 3. For he must consider, that his children and servants, who are baptized, are members of the Christian Church, and therefore ought to be subject to the instructions and discipline of it, as far as their age and capacity will permit. They do not only belong to his private care, but to the public care of the Church, who is to provide for the instruction of her children; and to deny the Church liberty to instruct her children, or not to interpose their own authority to make them submit to it, is to withdraw their children from the communion of the Church, after a solemn dedication of them to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-sherlock.html">William Sherlock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Discourse of Religious Assemblies… (London, 1681), pt. 2, ch. 5, pp. 303-4 Sherlock was an Anglican.</cite></span></figcaption>

<blockquote><p>The matter is often spoken of as if the Church of England must of necessity have laid down, and had in fact laid down, a certain definite precise view upon this subject, and peremptorily enjoined it upon all her ministers for their acceptance and belief. In my humble apprehension such a notion is entirely opposed to fact… …all which our Church has done upon this question is, to lay down certain limits on both sides, within which the views of her ministers are to be confined.</p></blockquote>

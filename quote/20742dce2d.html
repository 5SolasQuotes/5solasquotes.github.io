<main class="wrap"><figure class="quote" id="q-20742dce2d" data-kw="">
<blockquote><p>III. Problem: Whether the will lost something through the fall, and thus some new grace (which is after the manner of a habit or some inhering quality) is impressed upon it through regeneration; or whether it is of itself entirely free (namely, by proximate potency) to act well or badly? Response: The Remonstrants in the Hague Collation deny the former and affirm the latter. We say the contrary: First, because the will is expressly said to be corrupt and corrupting, dead in sins, Eph. 2 with 4:22, 18; Rom. 8:6; it is as it were informed with a habit of malice, whereby it happens that it is inclined to act badly, nor can it will to be able, or will to be able, to act well, Jer. 13:24 [13:23]; Gen. 6 &amp; 8; Prov. 17:20; Jn. 5:40 &amp; 8:34. Hence it is as it were constrained by the law of sin, Rom. 7:21, 23, and the heart is called stony, Eze. 36; evil, Heb. 3:12; perverse, Jer. 17 [v. 9]; the neck and forehead iron and brass, Isa. 48:4. Second, the will is said to be changed, converted, endowed and informed with new life and new qualities or virtues, Eze. 36:26; Jer. 31:33 &amp; 32:39–40; Dt. 30:6. Third, the will is the proximate and formal principle which [principium quod] of human actions, and all virtues or moral theological habits according to the first and second table are subjected in the will; therefore a spiritual principle by which [principium quo] must be newly created and impressed upon it through regeneration (no less than new light is infused into the intellect), Jn. 1:13 with Eph. 2:8; Heb. 8:10; 2 Pet. 1:3–4; Zech. 12:10; and the habits of hope, charity, and repentance must be infused into it, Acts 5:31 &amp; 11:17–18, so that the heart turned from its corruption may cleave to the Lord, Acts 15:9 with 11:23; Ps. 63:9 [63:8]; and 62:9 [62:8], 11 [62:10]; and 73:28. Fourth, the will before the fall was endowed and clothed with its qualities, namely, holiness and righteousness, Eph. 4:24. Therefore those qualities lost through the fall must be restored anew through regeneration, Col. 1:10 [3:10].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, (1655), vol. 2, Disputation 30, ‘On Regeneration’, pt. 2 (1639), p. 447 ff. tr. AI by Roman Prestarri Latin at Confessionally Reformed Theology</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c26fbd5ea3" data-kw="">
<blockquote><p>We should give to God the glory of his supremacy; we should not deny to the creature the properties that God has bestowed. We should not be afraid to say, My act, or My thought, or My feeling, because whatever is positive or real in these functions should be ascribed only to God. They are ours by a power which God imparted to us, and every abuse of these faculties is an act which must be ascribed in all its relations to the will of the creature, and the creature alone.</p></blockquote>

</figure><figure class="quote" id="q-fb6aafc4ef" data-kw="">
<blockquote><p>But inasmuch as we cannot conceive an act of the will to the performance of which no inducement existed, we naturally inquire whether the inspired account of the first sin meets this difficulty. It does. There were inducements to the commission of it; but they were not motives which sprung from the moral nature of our first parents. Their moral spontaneity, so far from furnishing the motives to the perpetration of the sin, would, if it had been consulted, have urged them to its resistance. They were, as Bishop Butler intimates, blind impulses, in themselves innocent and legitimate because implanted by God Himself in the very make of man. The bodily appetite for food, and the intellectual desire for knowledge, were, in Eve’s case, precisely the inducements [Gen. 3:6] upon which the great master of temptation put his finger. In the case of Adam, in contradistinction to that of Eve, it is more than a probable inference–it is one necessitated by the narrative [Gen. 3:12,17]–that the natural impulse of affection for his wife and sympathy with her operated as an inducement to the commission of his first sin. It must be admitted, that while we may accept Butler’s theory as in all probability correct, that Eve fell through the lack of vigilance mainly, we cannot account for Adam’s sin in the same way. The Scriptures inform us that he was not deceived as was Eve [1 Tim. 2:14]. His eye was directed to both alternatives. He saw clearly the issues involved, and deliberately resolved to break with his God, and ruin his race. But we cannot avoid the conclusion that, as his moral dispositions and tendencies were all in the direction of holiness, the intrinsically legitimate blind impulses of his constitution started the train of inducements, inflamed the desire which enticed the will in the direction of sin. Here were motives brought to bear upon the will; but it is obvious that, in their first presentation, they were in the control of the will. It had the power to resist them, or to comply with them. The instant it freely consented to entertain them directed to the forbidden object, that instant the fall began. Here then we have a reason why the will acted in a specific direction–used its power to choose between opposing possibilities–and we see that it had the power to act or not to act in accordance with it. There was motive, but the will was, at first, master of the motive, not the motive of it. The innocent impulses of man’s constitution, when directed to a forbidden object and approved by the will, traversed the dispositions to holiness and dashed down the moral spontaneity. But, although, in the first instance, the will was not necessitated to action by these impulses, but had the control of them so that it could have resisted them, yet when it did freely consent to tolerate them, it surrendered that control, and was thenceforward mastered by them [John 8:34].</p></blockquote>

<blockquote><p>Or, by way of further elaboration, in the case of an event, ‘a’, God can will ‘a’ or will ‘not-a’–but he can also ‘not will ‘a” without any necessity of willing ‘not-a’ and, indeed, he can ‘not will ‘a” and in the same moment ‘not will ‘not-a”. This distinction may be yet another example of the Scotist influence found in seventeenth-century Reformed thought.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Or, by way of further elaboration, in the case of an event, ‘a’, God can will ‘a’ or will ‘not-a’–but he can also ‘not will ‘a” without any necessity of willing ‘not-a’ and, indeed, he can ‘not will ‘a” and in the same moment ‘not will ‘not-a”. This distinction may be yet another example of the Scotist influence found in seventeenth-century Reformed thought.”

</figure><figure class="quote" id="q-075d4894b3" data-kw="unbelief">
<blockquote><p>Hence it is evident that the beginning of sin is better referred to unbelief than to pride, although in it both are joined. There ought to be the same order in the sin that was in the temptation. Now in the temptation man was first solicited to unbelief before pride. For by his interrogation, the tempter first urges him to doubt the word of God (Gen. 3:1), then to deny it (“Ye shall not surely die,” v. 4) before he incites to pride by the promise of divinity. Pride could not have place in man except on the positing of unbelief.</p></blockquote>

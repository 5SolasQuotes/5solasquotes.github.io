<blockquote><p>There is hardly any kind of Deceit which is not practised to fortify one’s own Party, and to diminish the opposite Party: But here is that which is most ordinarily used, and with less Secrecy. It’s that on one side, they paint out the Religion, which they would combat, with colours most black and hideous; they render it monstrous, that it may cause horror; they dissemble what Good it hath, they exaggerate what it hath of Evil; they give a Criminal Character to all its Expressions; they make Heresies of all Tenets; they ascribe to it what it doth not hold; they disguise, with the hue of Infidelity, what it holds. On the other part, they fairly colour the Religion, whereof they undertake the defence; they draw the Curtain on that, which might scandalize it; they give an air of Innocency to their most criminal Practices; they cover with fair Names the foulest Things.

It’s a kind of discredit whereof each Party accuses the opposite Party: the Roman Catholic accuses the Protestant, and the Protestant accuses the Roman Catholic. It’s a Process that one cannot decide, but by examining to the bottom, to see who is in the wrong, and who it is that imputes or imputes not. As I do not here pretend to be uninterested, being a declared Protestant, I make no difficulty to pronounce, that our Side is alone in the good Faith; yet will I not be believed upon my Word: But the thing is so clear, and so well known of all the World, that I could suppose it, without taking the pains to prove it. They have blacked Us with the most horrid Imputations, and it’s a case of so great notoriousness, that I know not whether it be possible to deny it. There is no Heresy whereof they would not render us guilty: They have said, that with Arius we deny the Eternity of the Son and his Deity; that with Nestorius we establish two Persons in Jesus Christ; that with Eutyches we confound his two Natures. They are two opposite Heresies, and which cannot subsist together. It matters not, all is well enough, if we be but calumniated. Hath not Bellarmine made a Preface to his Book de Christo, expressly to prove, that we are Nestorians, Sabellians, Arians and Eutychians?

Hath not Gregory of Valencia made a thick Book, de Unitate &amp; Trinitate, against the Lutherans and the Calvinists? asserting, that the Lutherans are truly of the Opinion of Servetus, and that the Calvinists deny the Divinity of Jesus Christ? And doth not Father Cresset say but newly, That we hate the Virgin, because we hate her Son? In regard of Free Will, they would have Us to be in the Party of the Manichees, who said, That Men were by their Nature determined to good or to evil, and that they are not carried thereto by Choice and by Will. In regard of Good Works, they attribute to Us the horrid Opinion of the Gnostics, that said, That the Spiritual man may plunge himself into the most abominable Crimes of the Flesh, without fear of the least Pollution, or any Condemnation.

They say, That we deny the necessity of Good Works to Salvation; that we make a vile Sinner, after a small act of Faith and Repentance, as just as the Holy Virgin; that we make Men to be Just by the Righteousness of another, as if we should make a black Stuff to be white with the whiteness of another Stuff; that we do clothe our Just man with an imputed Justice, under which are hid the most horrid moral Impurities; that we lead men to Salvation by the way of Crimes, Murders, and Adulteries; that we render the effects of Predestination infallible, like the Mahumetans; so that a Man Predestinate living like a Devil, cannot fail to become happy like an Angel. That we would have an Adulterer, a Fornicator, yea a Man guilty of the Vilest disorders, may be as assured of his Salvation as Jesus Christ; that our Lord Jesus Christ despaired that he was damned; that we are Enemies to the Saints.

In fine, Who could number all the Calumnies wherewith they load us, to render us odious? That is but a small part thereof. And the most terrible of all, it’s that though we justify our selves never so often, and tell them we abhor all those Heresies, that we detest them, that we combat them; though we explain our selves never so much, and declare that the Words so abused are taken in a Counter-sense; though we cry out against the Calumny, protest our Innocency, formally reject all the Consequences imputed to us; that comes to nothing, and they still return to the like again. We must needs be Heretics at any rate, and they repeat against Us this day all those Calamities, with the same air of Confidence as if we had nothing to answer thereto, or had never answered the same.

We should more easily bear with those Excesses, if that we had none to complain of, but those small Declaimers, who do harangue on Shop-boards, and who preach in the Markets, from the Steps of a Cross. If those Outrages were done Us, but by those little Scribes, who are void of Science, Name, Spirit, Honour and Conscience, whereof the World is full. But it’s impossible not to lose our Patience, when we see Authors that are grave and able, learned and famous, compose great Volumes, whereof all the Pages are soiled with those black Slanders, whereto we have answered an hundred times.

When we cannot blame Ignorance and Insufficiency, we cannot but complain of unsincere dealings, and say, that such a Course is not honest. It’s an inseparable Character of the false Church; Heretics have always dealt thus with the Orthodox. They have still calumniated them, and have disfigured by their Imputations the purest and holiest Doctrines; we need but to have read a few of the Holy Fathers to be assured thereof. But the true Church was always most tender of Sincerity; She would never slander her Adversaries, and would never disjoin Zeal from fair dealing.</p></blockquote>

— Samuel Rutherford, Other citations (work not named), ed. Travis Fentiman, ‘Samuel Rutherford on the Judicial Laws of Moses: Excerpts Arranged Topically’, pp. 4-6, 23 | The Due Right of Presbyteries (1644), p. 70">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+Church+and+State+in+Israel+were+two+incorporations+formally+distinguished.+And+I+see+not%2C+but+those+who+do+confound+them+%5Bthe+Erastians%5D%2C+may+also+say+that+the+Christian+State+and+the+Christian+Church+be+all+one+State%2C+and+that+the+government+of+the+one+must+be+the+government+of+the+other%3B+which+were+a+confusion+of+the+two+kingdoms.+It+is+true%2C+God+has+not+prescribed+judicials+to+the+Christian+State%2C+as+He+did+to+the+Jewish+State%2C+because+shadows+are+now+gone+when+the+body+Christ+is+come%3B+but+God%E2%80%99s+determination+of+what+is+morally+lawful+in+civil+laws+is+as+particular+to+us+as+to+them%3B+and+the+Jewish+judicials+did+no+more+make+the+Jewish+State+the+Jewish+Church%2C+than+it+made+Aaron+to+be+Moses+and+the+priest+to+be+the+king+and+civil+judge%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Other+citations+%28work+not+named%29%2C+ed.+Travis+Fentiman%2C+%E2%80%98Samuel+Rutherford+on+the+Judicial+Laws+of+Moses%3A+Excerpts+Arranged+Topically%E2%80%99%2C+pp.+4-6%2C+23+%7C+The+Due+Right+of+Presbyteries+%281644%29%2C+p.+70&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5a656e4bf9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5a656e4bf9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/church-state-relations/erastianism/#:~:text=the%20Church%20and%20State%20in%20Israel,be%20the%20king%20and%20civil%20judge&amp;text=the%20Church%20and%20State%20in%20Israel%20were%20two&amp;text=priest%20to%20be%20the%20king%20and%20civil%20judge" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1988bb49ed" data-kw="">
<blockquote><p>The laws of God are usually regarded as of two kinds—moral and positive. By a moral law, we are to understand a law which enjoins something in itself necessarily and eternally right, and which would be binding on God’s rational creatures, even though it had not been enjoined by an express commandment. Of this kind is the law which requires us to worship the true God only, to obey our parents, to abstain from murder, and many others which will readily occur to everyone.

A positive law, on the other hand, is a law enjoining something which is not necessarily binding on men, and which becomes binding only in consequence of being commanded—such as the ceremonial observances which were imposed on the people of Israel, but which are no longer binding on the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-gordon.html">Robert Gordon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sanctification of the Sabbath: A Discourse in Christian Miscellany</cite></span></figcaption>

<blockquote><p>Faith then is the hand and wheel which must frame a vessel for honor, prepared, as for all other, so for this work of marriage. And in truth, as it is all religion (upon point) so it is the marriage ring, which makes the soul one with the Lord; and this ring is beset with many rich jewels, all of them serving for the honor, that is, the well carrying and discharge of marriage duties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rogers.html">Daniel Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matrimonial Honour</cite>, (1642), pp. 24-25</span></figcaption>

</figure><figure class="quote" id="q-e08e3c05c5" data-kw="">
<blockquote><p>But if the tyrant forbids what God commands, you should not at all judge that you have performed your duty if you have merely refused to obey the tyrant, unless at the same time you obey the command of God as we declared that Obadiah did, who not merely refrained from slaying the prophets of God, but even protected and nourished them in defiance of the command of Ahab and Jezebel, since the Lord bids us, each as far as his calling permits, to bring succour to his brethren in peril. Thus also the Apostles, as we have said above, not merely did not desist from preaching the Gospel that they might heed the priests, but on the contrary they steadfastly preached everywhere since they had expressly received this command from the Lord: “Go ye and preach the Gospel to every creature,” etc.

Therefore when today we see many Rulers so bewitched by the Roman Antichrist that they by the sternest commands compel their subjects to attend the execrable sacrifice of Mass, the duty of all pious men requires not merely that they should not carry out that command, but further that they should in accordance with the example of Elijah and Elisha, even of the entire pure and true Church of old, join in pious gatherings, there hear the word of God and have communion of the sacraments as Christ ordained that it should be done in the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concerning the Rights of Rulers over their Subjects and the Duty of Subjects Towards their Rulers: A Brief and Clear Treatise Particularly Indispensable to Either Class in these Troubled Times</cite>, (1572), trans. Henry Louis Gonin, ed. Patrick S. Poole in Journal of Christian Reconstruction, 14.1 (1996), p. 106.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<main class="wrap"><figure class="quote" id="q-5ff5aaf85c" data-kw="">
<blockquote><p>We know it was the cursed error of the Manichees and Marcionites, that the Law was only carnal, and had only carnal promises; whereas it’s evident, that the Fathers had the same faith for substance as we have. It’s true, if we take Law and Gospel in this strict difference, as some Divines do, that all the Precepts, wheresoever they are, must be under the Law, and all the Promises be reduced to the Gospel, whether in Old or New Testament; in which sense Divines then say, Lex jubet &amp; Gratia juvat; the Law commands, and Grace helps; and, Lex imperat, the Law commands, and Fides impetrat, Faith obtaineth; then the Law can have no sanction by Promise: But where can this be shewed in Scripture? When we speak of the sanction of the Law by Promise, we take it as in the administration of it by Moses, which was Evangelical; not as it was given to Adam, with a Promise of Eternal life upon perfect obedience: for the Apostle Paul’s propositions, To him that worketh, the reward is reckoned of debt; and, the doers of the Law are justified, were never verifiable, but in the state of innocency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis: or, a vindication of the moral law and the covenants, from the errors of the papists, Arminians, Socinians, and more especially, Antinomians. In XXX lectures, preached at Laurence-Jury,</cite>, London (2nd edn, London, 1647), pp 5-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/ceremonial-law.html">Ceremonial Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b442a237cd" data-kw="">
<blockquote><p>Having proved it is a Covenant, all the difficulty remaineth in declaring what Covenant it is; for here is much difference of judgements, even with the Learned and Orthodox: and this doth arise from the different places of the Scripture, which, although they be not contrary one to another, yet the weakness of our understandings is many times overmastered by some places:

Some (as you have heard) make it a Covenant of works, others a mixt Covenant, some a subservient Covenant; but I am persuaded to go with those who hold it to be a Covenant of grace: and indeed, it is very easy to bring strong arguments for the affirmative; but then there will be some difficulty to answer such places as are brought for the negative; and if the affirmative prove true, the dignity and excellency of the Law will appear the more. Now, before I come to the arguments, which induce me hereunto, consider in what sense it may be explained, that it is a Covenant of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis, or, A Vindication of the Moral Law and the Covenants, from the Errors of Papists, Arminians, Socinians, and more especially, Antinomians</cite>, (London, 1647), pp 231-32.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/ceremonial-law.html">Ceremonial Law</a></span></div>

</figure><figure class="quote" id="q-faff82bb91" data-kw="ceremonial abrogation">
<blockquote><p>The ceremonial law can be viewed in two ways: either with regard to doctrine and signification; or with regard to obligation and observance. The question is not whether it was abrogated as to doctrine. We confess that it still remains and is useful in many ways among Christians; and that the mystical truth, hidden under this shell, is always the same and of perpetual necessity. Rather the question is whether it was abrogated as to obligation and obedience and whether believers are still in subjection to the ceremonial law. This was the opinion not only of the Jews of old, but also of the Judaizing false apostles in the time of the apostles. However we, with the apostles and the whole church, deny it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.25.1</span></figcaption>

</figure><figure class="quote" id="q-b0033d0c83" data-kw="natural moral ceremonial judicial">
<blockquote><p>Whether there is a natural law, and how it differs from the moral law. The former we affirm; the latter we distinguish. The moral law remains perpetual; the ceremonial is abrogated in Christ as to obligation, having served as types; the judicial binds as to general equity. From the law comes knowledge of sin, and justification by the law is impossible to fallen man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.1</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d4cffed88b" data-kw="">
<blockquote><p>1. That by Divine as well as by human right the supreme Magistrate himself is appointed for managing business of this kind. In the Scriptures, 1 Kings 15 and 17, it is the express eulogy of the good kings that they “took away” the high places and removed the “idols”; on the contrary it is the perpetual stigma of the bad ones that they did not take away, did not remove them; 2 Kings 18 and 23… Hence it is evident from whom God expects the Reformation of the Church and of Religion… 2. Secondly, as the authority of reforming the Church is imposed upon kings, so it is removed from the people. For where a vocation is wanting [lacking], although the thing which is done, considered in itself, be laudable, yet there i blame attaching to the agent, on account of the defect of a lawful power. To offer sacrifices to God was in itself pious and religious; but in Saul, who had no call to this office, it was impious and sacrilegious; (1 Sam. 13:13)… Search the sacred Scriptures, you will find the people of God everywhere blamed because they worshipped the golden calves… but never censured by any prophet becaue they did not remove idolatry by force of arms, against the will of their kings. That this work, consequently, does not belong to the people, the prophets have taught by this their silence on the subject… Thirdly… 1… But what then [it may be asked] are those duties?… To beware of bowing down before idols; to avoid heresies, not to extirpate them by force of arms; to bewail the corruptions of the Church, not to remove them; in one word, to endure the severest punishments inflicted by the Magistrate rather than to desert the true religion; not to force the Magistrate to introduce true religion (1 Kings 19; Eze. 9)… ‘Religion certainly should be defended by all private individuals, though not by slaying, but by dying; not by severity, but by patience; not by wickedness, but by faith,’ as Lactantius has admirably said, Institutes 5.20. 2. Moreover, it is not allowable in the people when the magistrate refuses it, to put their hand to this business… For he who undertakes to reform religion when the magistrate is reluctant, first dethrones the magistrate himelf, tramples upon him, and must necessarily reduce him to the common level… cursed are they who stir up rebellion under the cloak of these things. It is a maxim of lawyers… ‘an equal has no power over his equal’: how much less inferior over superior… I thus sum up all: Equity does not allow it; necessity does not require it; utility does not advise it: therefore, it is unlawful for the people, againt the consent of the Magistrate, to attempt the Reformation of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Question 12, ‘The People may not Attempt a Reformation in the Church Against the Consent of the Magistrate’ in The Determinations, or Resolutions of Certain Theological Questions tr. Josiah Allport (1634; 1846) bound after Davenant, A Treatise on Justification, or the Disputatio de Justitia... tr. Allport (1631; London, 1846), vol. 2</cite>, pp. 279-83</span></figcaption>

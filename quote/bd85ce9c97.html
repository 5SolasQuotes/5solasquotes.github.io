<blockquote><p>But to the contrary: 1. First it is argued through the text of Genesis, where it is said that through the space of six days [sex dierum spatium] the Lord completed the work that was begun. Therefore it is seen that the underlying matter was not produced in perfect actuality, according to the judgment of sacred Scripture.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>Voetius as well as Van Mastricht and Driessen maintained a literal interpretation of the description of Genesis that God created the world in six days. Both Van Mastricht and Driessen criticised the notion of natural laws that are in force prior to creation… Van Mastricht notes that the concepts of matter and form make it possible still to speak of creation after the first day…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 3.1 ‘Creation in 6 Days’ in ch. 2, ‘Creation, Mosaic Physics, Copernicanism &amp; Divine Accommodation’ in Reformed Orthodoxy and Philosophy, 1625-1750: Gisbertus Voetius, Petrus Van Mastricht, and Anthonius Driessen Pre (Boston: Brill, 2006), pp. 105-13, p. 113</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

— Aza Goudriaan, 3.1 ‘Creation in 6 Days’ in ch. 2, ‘Creation, Mosaic Physics, Copernicanism &amp; Divine Accommodation’ in Reformed Orthodoxy and Philosophy, 1625-1750: Gisbertus Voetius, Petrus Van Mastricht, and Anthonius Driessen Pre (Boston: Brill, 2006), pp. 105-13, p. 113">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVoetius+as+well+as+Van+Mastricht+and+Driessen+maintained+a+literal+interpretation+of+the+description+of+Genesis+that+God+created+the+world+in+six+days.+Both+Van+Mastricht+and+Driessen+criticised+the+notion+of+natural+laws+that+are+in+force+prior+to+creation%E2%80%A6+Van+Mastricht+notes+that+the+concepts+of+matter+and+form+make+it+possible+still+to+speak+of+creation+after+the+first+day%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Aza+Goudriaan%2C+3.1+%E2%80%98Creation+in+6+Days%E2%80%99+in+ch.+2%2C+%E2%80%98Creation%2C+Mosaic+Physics%2C+Copernicanism+%26+Divine+Accommodation%E2%80%99+in+Reformed+Orthodoxy+and+Philosophy%2C+1625-1750%3A+Gisbertus+Voetius%2C+Petrus+Van+Mastricht%2C+and+Anthonius+Driessen+Pre+%28Boston%3A+Brill%2C+2006%29%2C+pp.+105-13%2C+p.+113&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbcb786eb53.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bcb786eb53.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-long-god-took-in-creating/#:~:text=Voetius%20as%20well%20as%20Van%20Mastricht,of%20creation%20after%20the%20first%20day&amp;text=Voetius%20as%20well%20as%20Van%20Mastricht%20and%20Driessen&amp;text=to%20speak%20of%20creation%20after%20the%20first%20day" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b5df3ae534" data-kw="">
<blockquote><p>Q. DId God create the world at the same instant, or in the space of six days? A. In the space of six days: First, because Moses’ narration is historical, and therefore he speaks of six distinct days. Secondly, Moses, Ex. 20 &amp; 31, urges the Jews to work six days and rest the seventh, because God created the world in six days and rested the seventh; this reason had been ridiculous if God had made the world in an instant. Thirdly, if we understand Moses in this place allegorically, then we must make this whole history an allegory. Fourthly, if the seventh day had been the first (and in it God had created the world), then how is it understood that God rested the seventh day? Fiftly, how could so many diverse kinds of creatures be created in the same instant of time? yea, then we must say that man was created and brought into Paradise and was cast asleep, and Eve was formed of his rib the same instant. Q. How then is that understood, Ecclesiasticus 18 [v. 1], ‘He that lives forever, created all things together’? A. It is to be understood of that confused mass that God created in the beginning: out of the which afterward He created the rest of the creatures in their distinct days. Q. Why did God spend so much time in making the world? A. Not because He was weak and could not make it in less time, but that we might the more seriously consider the order of the creation, distinction and replenishing of the world; and in these, the omnipotency, wisdom and goodness of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Fourteen First Chapters of Genesis, by way of Question &amp; Answer</cite>, … (London, 1626), Questions on the 2nd Chapter, pp. 28-29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>Spiritual desertion is either by way of trial or by way of punishment. Someone is deserted in the first way in order to demonstrate and strengthen his virtues. In this way God deserted Adam when he was falling and, likewise, a master deserts his pupil in the arena of disputation. In the second way someone is deserted because of his sin, as God deserted Pharaoh and apostates. In this way a father disinherits his son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Hundredfold Most General Distinctions</cite>, in Scholastic Discourse: On Theological and Philosophical Distinctions and Rules, PIRef 4, trans. Willem J. van Asselt et al, ed. William den Boer (1656; Apeldoorn: Institute for Reformation Research, 2009), 2.10, p. 317.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3bd7c96cb1" data-kw="">
<blockquote><p>First; an earnest deprecation of an impending Judgment, is reconcilable with our Submission to the pleasure of God, declared by the Event. Our Saviour with humility and importunity desired the removing of the Cup of Bitterness. We must distinguish between God’s Law, and his Decree and Counsel; The Law is the Rule of our Duty, and requires an entire exact subjection in all our Faculties, even in our internal Desires, in the first motions of the Will; the least velleity, or rising of the Heart against the Divine Command, is irregular and culpable; for not only the acts of Sin are forbidden in every Command respectively, but all the incitations of Concupiscence, before the deliberate judgment of the Mind, or the actual consent of the Will. But the Decree of God is not the Rule of our Duty, and Secret, till manifested by the event of things. This being premised, the Reasons are evident why we may pray against an Affliction that threatens us, without violating our Duty.

First; Because Afflictions are Evils which the Will naturally declines, and are not desirable things in themselves. They are not beneficial and productive of our good by any proper efficacy and operation, but by the over-ruling Providence of God, and the gracious assistance of his Spirit. When Aaron‘s Rod was put into the Sanctuary, and became green and flourishing with Blossoms and Almonds, ’twas not from any inherent virtue of its own, but from the special influence of the Divine Power; for the other Rods remained dead and dry: thus the happy effects of the Afflicting Rod are from Divine Grace.

Secondly; There are proper Temptations that attend the afflicted State. Many are encompassed in a sad Circle, their Sins procure Afflictions, and their Afflictions occasion many Sins. Indeed, Tribulation that is sanctified, by a happy gradation worketh Patience; and Patience, Experience of the Divine Mercy; and Experience, Hope, and Hope maketh not ashamed. But when it meets with a stubborn Spirit, there are fearful descents of Sin: Tribulation excites Impatience, and Impatience causeth Perplexity, and that Despair, and Despair Confusion.

The Devil lays his trains in every condition, and sometimes by immoderate Sorrow, sometimes by inordinate Joy, doth mischief to the Soul. And as more perish by Surfeits than Abstinence, yet the Diseases that are caused by emptiness, are more dangerous and incurable than those that proceed from fullness: So more are ruined by Prosperity than Adversity: But the guilty Passions that ferment and rage in Adversity, are more pernicious, and more hardly tempered and subdued, than the Luxurious Appetites that are fomented and drawn forth by Prosperity. We are directed by our Saviour to pray, that we may not be led into Temptation, and to be delivered from all Evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The great duty of resignation to the divine will in afflictions, enforced from the example of our suffering Saviour</cite>, (London: Brabazon Aylmer, 1684), pp 6-9.</span></figcaption>

</figure><figure class="quote" id="q-feaede9d94" data-kw="">
<blockquote><p>A holy, a prudent silence under affliction doth not exclude and shut out a sense and feeling of our afflictions. Ps. xxxix. 9, though he ‘was dumb, and laid his hand upon his mouth,’ yet he was very sensible of his affliction: verses 10, 11, ‘Remove thy stroke away from me, I am consumed by the blow of thine hand. When thou with rebukes dost correct man for iniquity, thou makest his beauty to consume away like a moth: surely every man is vanity.’ He is sensible of his pain as well as of his sin; and having prayed off his sin in the former verses, he labours here to pray off his pain. Diseases, aches, sicknesses, pains, they are all the daughters of sin, and he that is not sensible of them as the births and products of sin, doth but add to his sin and provoke the Lord to add to his sufferings, Isa. xxvi. 9-11.

No man shall ever be charged by God for feeling his burden, if he neither fret nor faint under it. Grace doth not destroy nature, but rather perfect it. Grace is of a noble offspring; it neither turneth men into stocks nor to stoics. The more grace, the more sensible of the tokens, frowns, blows, and lashes of a displeased Father. Though Calvin, under his greatest pains, was never heard to mutter nor murmur, yet he was heard often to say, ‘How long, Lord, how long?’ A religious commander being shot in battle, when the wound was searched, and the bullet cut out, some standing by, pitying his pain, he replied, Though I groan, yet I bless God I do not grumble. God allows his people to groan, though not to grumble. It is a God-provoking sin to be stupid and senseless under the afflicting hand of God. God will heat that man’s furnace of affliction sevenfold hotter, who is in the furnace but feels it not …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mute Christian under the Smarting Rod</cite>, (1684) in The Works of Thomas Brooks, ed. Alexander B. Grosart (6 vols, Edinburgh: Banner of Truth, 1980), i, 306-07.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><figure class="quote" id="q-f6e19a7a29" data-kw="">
<blockquote><p>But we see that the godly are visited with sore anguish and very heavy afflictions beyond others; for in this manner God wishes to try their faith, that, after having laid aside their desires and forsaken the world, they may serve him. Since, therefore, the Lord has a peculiar care of them, he must chastise them, while he permits wicked men to indulge in unbounded licentiousness.

Here we are also reminded that we must endure not merely one or another calamity, and must not imagine that, when we have endured some afflictions, there are none in reserve for us; for we ought always to be prepared to endure new ones. When God begins to chastise his people, he does not immediately cease. We shall “bring forth wind” when we think that the birth is at hand; other calamities will break out, and we shall be continually attacked by additional sorrows. We must therefore maintain this warfare so long as it shall please God to employ us in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Second</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 7: 235.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>
<div class="actions"><button class="copy" data-copy="“But we see that the godly are visited with sore anguish and very heavy afflictions beyond others; for in this manner God wishes to try their faith, that, after having laid aside their desires and forsaken the world, they may serve him. Since, therefore, the Lord has a peculiar care of them, he must chastise them, while he permits wicked men to indulge in unbounded licentiousness.

Here we are also reminded that we must endure not merely one or another calamity, and must not imagine that, when we have endured some afflictions, there are none in reserve for us; for we ought always to be prepared to endure new ones. When God begins to chastise his people, he does not immediately cease. We shall “bring forth wind” when we think that the birth is at hand; other calamities will break out, and we shall be continually attacked by additional sorrows. We must therefore maintain this warfare so long as it shall please God to employ us in it.”

— John Calvin, Commentary on the Book of the Prophet Isaiah: Volume Second, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 7: 235.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+we+see+that+the+godly+are+visited+with+sore+anguish+and+very+heavy+afflictions+beyond+others%3B+for+in+this+manner+God+wishes+to+try+their+faith%2C+that%2C+after+having+laid+aside+their+desires+and+forsaken+the+world%2C+they+may+serve+him.+Since%2C+therefore%2C+the+Lord+has+a+peculiar+care+of+them%2C+he+must+chastise+them%2C+while+he+permits+wicked+men+to+indulge+in+unbounded+licentiousness.%0A%0AHere+we+are+also+reminded+that+we+must+endure+not+merely+one+or+another+calamity%2C+and+must+not+imagine+that%2C+when+we+have+endured+some+afflictions%2C+there+are+none+in+reserve+for+us%3B+for+we+ought+always+to+be+prepared+to+endure+new+ones.+When+God+begins+to+chastise+his+people%2C+he+does+not+immediately+cease.+We+shall+%E2%80%9Cbring+forth+wind%E2%80%9D+when+we+think+that+the+birth+is+at+hand%3B+other+calamities+will+break+out%2C+and+we+shall+be+continually+attacked+by+additional+sorrows.+We+must+therefore+maintain+this+warfare+so+long+as+it+shall+please+God+to+employ+us+in+it.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+the+Book+of+the+Prophet+Isaiah%3A+Volume+Second%2C+trans.+William+Pringle+%28Geneva%2C+1551%29+in+Calvin%E2%80%99s+Commentaries+%2822+vols%2C+Grand+Rapids%3A+Baker%2C+1993%29%2C+7%3A+235.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff6e19a7a29.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f6e19a7a29.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/04/john-calvin-on-preparing-for-new-afflictions/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>It cannot be concluded, they do not suffer for Christ, who have some sin mixed with that which is made the cause of their sufferings, if it be the cause of God indeed, for the substance of it, and they sincere in it for the main. When the people of God are ready to offer up themselves, and what they have for him, he will not reject such a sacrifice for every blemish. Christ had something against the church of Ephesus, something to charge her with as matter of provocation, even when he is speaking of her sufferings, Rev. ii. 4. And yet he owns her as one that had suffered and laboured for his name’s sake, verse 3.

Nor can this be concluded, because of some miscarriage under their sufferings. David, while he was persecuted by Saul, miscarried divers ways, as you may see 1 Sam. xxi. 2, 12, 13, and elsewhere; yet this did not hinder him from being a sufferer for righteousness.

As the Lord has provided a way, that what his people do for him may be accepted as done for him, though there be too many sinful mixtures therein, so he has provided an expedient, that what they suffer for him may be accepted as suffered for him, though there be many flaws therein, both for matter and manner. The Lord Jesus, the advocate of and sacrifice for his people, is effectual for both. When they apply themselves to him, in the exercise of faith and repentance, through his mediation, that which is therein evil shall not be remembered, that which is good therein will be accepted, Rom. xii. 1. How acceptable, see Eph. i. 6, 7.

Licinius, as you may read, Eusebius De vita Constantini, makes an edict, that whosoever did relieve the imprisoned and distressed Christians should suffer the same things that were inflicted upon them. Now, suppose some, out of love to Christ and his afflicted members, should have ventured (as many did indeed) to have relieved them, and yet should have done it too sparingly, or too fearfully, or with some selfish reflections, and should, according to the edict, have suffered for relieving them, here had been some sin mixed with the cause of their sufferings. And yet in this case, since their cause was good, and the cause of Christ, for the substance of it, who would deny but they suffered for Christ?

Or suppose one should suffer because he would not leave praying (which was Daniel’s case, Dan. 6), and yet in his prayer should have some mixture of unbelief, and lukewarmness, and other distempers, which the best cannot always escape, here would be some sin mixed with the cause of sufferings; yet who would deny but that, suffering for doing his duty, he is a sufferer for God?

To proceed a little further: suppose some godly Lutherans should suffer for those great truths of the gospel, which they maintain against the papists, and together with them should suffer for consubstantiation, which indeed is an error, here would be a sin mixed with the cause of their suffering; yet I suppose their laying down their lives for those other great truths of Christ, notwithstanding this sinful mixture, would be accounted a suffering for Christ.</p></blockquote>

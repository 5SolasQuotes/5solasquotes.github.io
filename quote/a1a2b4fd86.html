</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-183ccf445b" data-kw="">
<blockquote><p>We entreated them to stand to the declaration, to let us go on against our enemy, and to let all debates alone till a free parliament and a general assembly [was had]. They told us we were for an indulgence, and they would sheathe their swords as soon in them who owned it as they would do in many of the malignants. We wished that we had known that sooner. We said, we told them we were not for an indulgence more nor they, and we would subscribe it if they would not believe us. Robert Hamilton told us that they owned Cameron, and were of his judgment plainly. I arose and told Robert Hamilton, that I had a wife and five children, and that I had a little bit of an estate, and that I was come to hazard all and my life, to get the yoke of prelacy and supremacy removed; but for ought that I saw, they intended to tyrannize over our consciences, and lead us to a worse snare nor we were into; and for my part, I would fight till the last drop of my blood before I went one step-length with them. And I told Mr. Cargill, he rendered himself odious by his naughty principles. He was very much offended with me. When they saw we were resolved to leave them, they drew by, and when they came to us they condescended to stand to the declaration, and to let all debates alone, and to give it under their hands: so we were all glad and merry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ure.html">James Ure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of Mr. William Veitch, and George Brysson, written by Themselves</cite>, ed. Thomas M’Crie (Edinburgh: William Blackwood, 1825) Ure was a covenanter, on the side of the moderate party, led by the minister John Welsh, and was a first-hand witness of the battle of Bothwell., p. 470</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-f10d1f2232" data-kw="">
<blockquote><p>Moreover this Assembly entreats and exhortsall for God’s sake, and the glory of his great name, and their own salvation,and for the peace and welfare of the nation; yea, it adjures by all that is desirable or commendable, the whole body of our communion in general, and every faitful soul in particular, to divest themselves of all animosities whatsoever, and to lop off immediately all dissolutions and dissensions, lest they should be the causes of the dissipation of the Churches of God in this kingdom. And all pastors and elders of Churches are enjoined diligently to procure the reunion of the respective members of their flocks, and to lend one another their helping hand to effect so good a work, and mightily to insist upon it in their public sermons, and private exhortations and remonstrances; And in case they should meet with contempt, scorn and reproach in the discharge of this their duty, and that any one, through an obdurate perverseness, should show himself implacable and irreconcilable, this Assembly, according to that authority which the great God gives unto the ministers of his holy Word, denounces to them the dreadful judgments of God, and wishes they may be had in execration” (that is, detestation) “among and by all the faithful; yea, all the censures of the Churchshall be exerted against such refractory persons, and the utmost rigor of our discipline shall be inflicted and executed upon them, lest the good name of God should be blasphemed through our sins, and that we may not contract upon ourselves the guilt of the Church’s desolation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

squotes.github.io%2Fquote%2Ff10d1f2232.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f10d1f2232.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/john-currie-essay-on-separation-or-a-vindication-of-the-church-of-scotland-contra-the-seceders/#:~:text=Moreover%20this%20Assembly%20entreats%20and%20exhortsall,the%20guilt%20of%20the%20Church%E2%80%99s%20desolation&amp;text=Moreover%20this%20Assembly%20entreats%20and%20exhortsall%20for%20God%E2%80%99s&amp;text=upon%20ourselves%20the%20guilt%20of%20the%20Church%E2%80%99s%20desolation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c8e0c91602" data-kw="">
<blockquote><p>1. I see not how all these arguments [of Thomas Hooker] taken from moral commandments, do not oblige son as well as father, servant as master, all are Christ’s freemen, son or servant, so as they are to obey what ever Christ commands, Mt. 18:10, and with the Spouse to seek Christ in the fullest measure and in all his ordinances; and son and servant are to know their own heart, so as they have need of all Christ’s ordinances, and are no more to remain in a congregation where their souls are famished because fathers and masters neglect to remove to other congregations where their souls may be fed in the fullest measure; [If the sinful exercise of an authority over us releases us from God’s commandment] then the apostles Acts 4:29 &amp; 5:29 were to preach no more in the name of Jesus, because the rulers commanded them to preach no more in his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (London, 1644), pt. 1, ch. 4, section 4, question 5, p. 71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

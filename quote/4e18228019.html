<blockquote><p>Question: Why is the Magistracy called an ‘ordinance of man’ [1 Pet. 2] v. 13, seeing all powers are ordained of God, and every power is the ordinance of God, Rom. 13:1-2? Answer: The superiority of power, or government itself, is simply and absolutely commanded by God, and in that respect [it] is called the ordinance of God; but this or that special manner of power or government is not determined by God, but by men; and is therefore [it is] called an ordinance of man, which as touching the nature of it, may also be called an ordinance of God: And this is the difference betwixt an ecclesiastical and a civil office: An ecclesiastical office is not legitimate if it be not directly determined by God Himself, and consequently cannot be changed by men: but this or that civil office may be made and changed by men. And the reason of the difference is this, because God and Christ alone has dominion and power in spiritual matters; but in civil matters men are also [g]ods, though not absolute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of both the Epistles of the Apostle Peter</cite>, … (London, 1641), p. 58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

d Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9bb81ef7f7" data-kw="">
<blockquote><p>To these appertains the doing and execution of civil and temporal affairs, so as their subiects may live in peace. By reason whereof the taxes and subsidies are due unto them and to them appertain to use the sword which God has given them, for the preservation as well of the countries which be committed to them, as also for the defence and maintenance of good laws, and punishment of the evil and wicked doers. Secondly, the duty and office of the magistrates is not to regard simply the peace and concord of subiects, but principally for this end, that the peace and concord may tend to the honor and glory of God, that all men may live not only in a certain civil honesty, but also with piety and true worship of God, as witnesses saint Paul. For this cause especially it appertains to the magistrate that the laws which he uses and executes may be conformable to the will of God: and principally to give order that the religion be perfect and holy, and that all the Church be ordered according to the Word of God, forbidding and punishing, as the case requires, all those which trouble the Church or concerning the discipline thereof [Beza’s larger context makes clear he is speaking in the context of a Christian nation].</p></blockquote>

<blockquote><p>The immediate nearest end of civil power is that the good of the commonwealth may be provided for and procured, whether it be in time of peace, according to the rules of law and council of judges, or in time of war according to the rules of military prudence; and so the temporal safety of the subjects may be procured and that external peace and civil liberty may be preserved, and being lost may be again restored.</p></blockquote>

<blockquote><p>1. There is a subjection in respect of natural being, as the effect to the cause; so, though Adam had never sinned, this morality of the Fifth Command should have stood in vigor, that the son by nature, without any positive law, should have been subject to the father, because from him he has his being, as from a second cause. But I doubt if the relation of a father, as a father, does necessarily infer a royal or kingly authority of the father over the son; or by nature’s law, that the father has a power of life and death over, or above, his children, and the reasons I give are: (1) Because power of life and death is by a positive law, presupposing sin and the fall of man [Gen. 9:5-6]; and if Adam, standing in innocency, could lawfully kill his son, though the son should be a malefactor, without any positive law of God, I much doubt [Gen. 4:14-15]. (2) I judge that the power royal, and the fatherly power of a father over his children, shall be found to be different; and the one is founded on the law of nature, the other, to wit, royal power, on a mere positive law. 2. The degree or order of subjection natural is a subjection in respect of gifts or age. So Aristotle (1 polit., chp. 3) says, “that some are by nature servants.” His meaning is good — that some gifts of nature, as wisdom natural, or aptitude to govern, has made some men of gold, fitter to command, and some of iron and clay, fitter to be servants and slaves… It is possible Plato had a good meaning (Dialogue 3, Of Laws) who made six orders here. “1. That fathers command their sons; 2. The noble the ignoble; 3. The elder the younger; 4. The masters the servants; 5. The stronger the weaker; 6. The wise the ignorant.” Aquinas (22, q. 57, article 3), Driedo (de libert. Christ, bk. 1, p. 8), following Aristotle (polit. bk. 7, ch. 14) hold, though man had never sinned there should have been a sort of dominion of the more gifted and wiser above the less wise and weaker; not antecedent from nature properly, but consequent, for the utility and good of the weaker, in so far as it is good for the weaker to be guided by the stronger, which cannot be denied to have some ground in nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843) | question 13, p. 50 rt col</span></figcaption>

</figure><figure class="quote" id="q-4698f1b8ef" data-kw="">
<blockquote><p>And because the king being made a king leaves not off to be a reasonable creature, he must be under a law, and so his will and lust cannot be the rule of his power and dominion, but law and reason must regulate him. Now if God had given to the king a dominion over men as reasonable creatures, his power and dominion which by royalists is conceived to be above law, should be a rule to men as reasonable men, which would make men under kings no better than brute beasts, for then should subjects exercise acts of reason, not because good and honest, but because their prince commands them so to do; and if this cannot be said, none can be at the disposing of kings in politic acts liable to royal government, that way that the slave is in his actions under the dominion of his master.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 65 rt col</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>
<div class="actions"><button class="copy" data-copy="“And because the king being made a king leaves not off to be a reasonable creature, he must be under a law, and so his will and lust cannot be the rule of his power and dominion, but law and reason must regulate him. Now if God had given to the king a dominion over men as reasonable creatures, his power and dominion which by royalists is conceived to be above law, should be a rule to men as reasonable men, which would make men under kings no better than brute beasts, for then should subjects exercise acts of reason, not because good and honest, but because their prince commands them so to do; and if this cannot be said, none can be at the disposing of kings in politic acts liable to royal government, that way that the slave is in his actions under the dominion of his master.”

<main class="wrap"><figure class="quote" id="q-7ed806c3ce" data-kw="">
<blockquote><p>The earliest known example of a Catechetical work is the “Teaching of the Twelve Apostles,” which Athanasius names among the “books not included in the Canon, but appointed by the Fathers to be read by those who are just recently coming to us, and wish to be instructed in the word of godliness (κατηχεῖσθαι τὸν τῆς εὐσεβείας λόγον).” This use of the Didache for the instruction of recent converts from Paganism agrees with its original purpose as stated in the longer title, “Teaching of the Lord through the Twelve Apostles for the Gentiles.” The first six chapters are evidently adapted for those who need elementary instruction, more particularly for Catechumens of Gentile descent, as distinct from Jewish candidates for Baptisms. The remaining chapters of the Didaché relate chiefly to the administration of Baptism, to Prayer, Fasting, and the services of the Lord’s Day, and to the celebration of the Agape and Eucharist. This same division of subjects is observed in the two classes of S. Cyril’s Catechetical Lectures: the first class, including the Procatechesis, consists of XIX Lectures addressed to candidates for Baptism, and these are followed by five “Mystagogic” Lectures, so called as being explanations of the Sacramental Mysteries to the newly-baptized.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-hamilton-gifford.html">Edward Hamilton Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Catechetical Lectures of S. Cyril</cite>, ed. Philip Schaff and Henry Wace, vol. 7, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Christian Literature Company, 1894), xii.</span></figcaption>

<blockquote><p>As concerning children, we cannot bind all to the same measure of age. For there are some in whom spiritual knowledge, study and zeal for piety, and grave and well-ordered morals supply the defect of years. Yet it is not in the least to be approved that each and all alike, after the age of fourteen, initiated with the sacrament of confirmation (according to the Papists)… are received to communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, 6th Question, ‘Is the Supper to be Granted to Infants, or to Children?’ [No] in Ecclesiastical Politics, vol. 1, book 2, tract 2, section 4, ch. 3, pp. 757-58 trans. Charles Johnson</span></figcaption>

<blockquote><p>The Law of Nature dictates that all who are admitted into this [Chuch] Society, must consent to be governed by the laws and rules of that society, according to its constitution. For none can be looked upon as a member of a society, but such a one as submits to the rules and laws of the society, as constituted at the time of his entrance into it. That all civil societies are founded upon voluntary consent and agreement of parties, and do depend upon contracts and covenants made between them, is evident to any that consider that men are not bound by the Law of Nature to associate themselves with any but whom they shall judge fit; that dominion and propriety was introduced by free consent of men: and so there must be laws and bonds fit, agreement made, and submission acknowledged to those laws, else men might plead their natural right and freedom still, which would be destructive to the very nature of these societies. When men then did first part with their natural Liberties, two things were necessary in the most express terms to be declared: First, a free and voluntary consent to part with so much of their natural rights as was not consistent with the well-being of the society; Secondly, a free submission to all laws, which should be agreed upon at their entrance into society, or afterwards as they see cause. But when societies were already entered, and children born under them, no such express consent was required in them, being bound by virtue of the protection they find from authority to submit to it, and an implicit consent is supposed in all such as are born under that authority. But for their more full understanding of this obligation of theirs, and to lay the greater tie of obedience upon them, when they come to understanding, it has been conceived very requisite by most states to have an explicit declaration of their consent, either by some formal oath of allegiance, or some other way sufficiently expressing their fidelity, in standing to the covenants long since supposed to be made. To apply this now to the Church. … Our Savior has determined how this consent should be expressed, viz. by receiving baptism from those who have the power to dispense it: which is the federal rite whereby our consent is expressed to own all the laws and submit to them, whereby this society is governed: Which at the first entering of men into this society of the Church was requisite to be done by the express and explicit consent of the parties themselves, being of sufficient capacity to declare it, but the Covenant being once entered into by themselves, not only in their own name, but in the name of their posterity (a thing implied in all covenants wherein benefits do redound to posterity, that the obligation should reach them to; but more particular in this, it having been always the tenor of God’s Covenants with men, to enter the seed as well as the persons themselves, as to outward privileges, Dt. 29:15; Acts 2:38), an implicit consent as to the children in Covenant is sufficient to enter them upon the privileges of it by baptism, although withal it be highly rational for their better understanding the engagement they entered into, that when they come to age, they should explicitly declare their own voluntary consent to submit to the laws of Christ, and to conform their lives to the profession of Christianity… …but in religious societies [in contrast to natural societies], though the act of consent be free, yet there is an antecedent obligation upon men, binding them to this voluntary consent… It is granted, Church-power does suppose consent, but then all Christians are under an obligation from the nature of Christianity to express this consent, and to submit to all censures legally inflicted. … …yet I no ways deny the lawfulness or expediency, in many cases, of having a personal profession from all baptized in infancy when they come to age (which we may, if we please, call Confirmation) and the necessity of desiring admission, in order to participation of all ordinances: which desire of admission, does necessarily imply men’s consenting to the laws of that society, and walking according to the duties of it; and so they are consequentially and virtually, though not expressly and formally, bound to all the duties required from them in that relation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-stillingfleet.html">Edward Stillingfleet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, a Weapon-Salve for the Church’s Wounds</cite>, ch. 7 in Irenicum, a Weapon-Salve for the Church’s Wounds, or the Divine Right of Particular Forms of Church-Government Discussed &amp; Examined... (London: Mortlock, 1662), pt. 1, pp. 132-40</span></figcaption>

<blockquote><p>…we do not suppose that our salvation depends upon the sacrament of baptism, but upon our adoption according to the formula: “I will be your God and that of your seed.” [Gen. 17:7] We diligently attend to this adoption in the children of the saints according to the Word of the Lord since it has been sealed upon them through the sacrament of baptism… …little corruptions have arisen from no other source than from the understanding that baptism is necessary for salvation, which we consider entirely false. We hold this view to be false because adoption by God must take place before anyone can be baptized rightly. Otherwise, why is a confession of faith required of adults before thy are baptized? We believe, however, that the children of the saints have already been adopted right in the womb according to the covenantal formula. And so we baptize them. …We count as nonsense his assertion that children are holy–that is, in the outward company of the church–before their baptism. For the opposite is true: those children whom (we claim) the Lord has already truly adopted before, according to the covenantal formula, are introduced into the outward company of the church through baptism.</p></blockquote>

<blockquote><p>The opinion of the orthodox is far different. First, they admit no blotting out of sin in baptism, springing ex opere operato or from a virtue inherent in it (as was proved before when we considered the efficacy of the sacraments). Second, they say that the efficacy of baptism (taken oppositely for the element and its dispensation) is moral, as has already been set forth; but the efficacy of baptism considered compositely for the sign and thing signified is real with respect to the one receiving it, although it is not restricted to the moment of baptism. Third, they acknowledge in baptism the testification and sealing of the twofold grace promised in the gospel; both of justification (by which sin is taken away as to its guilt so that it is not imputed) and of sanctification (by which its pollution is lessened and corrected that it may no more rule in us in this life; not however that it is not absolutely or exists in us anymore). The grace of justification pardons all our sins: original, actual, past, present and future.</p></blockquote>

<blockquote><p>While the young of no class are to be overlooked, while we must ever contend for a thorough scriptural education as of vital importance, Christian parents and the Church unitedly must double their diligence, and employ all scriptural means to instil right principles into the minds of the youth of the Church, and to excite them to holy activity and devotedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The judgment of the papacy: and the reign of righteousness</cite>, (1851) in Works doctrinal and practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh, 1876), i, 362.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>I. The first thing I have to show is the general excellence of freedom.

On this point some readers may think it needless to say anything: they imagine that all men know the value of freedom, and that to dwell on it is a mere waste of time. I do not agree with such people at all. I believe that myriads of Englishmen know nothing of the blessings which they enjoy in their own land: they have grown up from infancy to manhood in the midst of free institutions. They have not the least idea of the state of things in other countries: they are ignorant alike of those two worst forms of tyranny,—the crushing tyranny of a cruel military despot, and the intolerant tyranny of an unreasoning mob. In short, many Englishmen know nothing of the value of liberty, just because they have been born in the middle of it, and have never been for a moment without it.

I call then on every one who reads this paper to remember that liberty is one of the greatest temporal blessings that man can have on this side the grave. We live in a land where our bodies are free. So long as we hurt nobody’s person, or property, or character, no one can touch us: the poorest man’s house is his castle. We live in a land where our actions are free. So long as we support ourselves, we are free to choose what we will do, where we will go, and how we will spend our time. We live in a land where our consciences are free. So long as we hold quietly on our own way, and do not interfere with others, we are free to worship God as we please, and no man can compel us to take his way to heaven. We live in a land where no foreigner rules over us. Our laws are made and altered by Englishmen like ourselves, and our Governors dwell by our side, bone of our bone and flesh of our flesh.

In short, we have every kind of freedom to an extent which no other nation on earth can equal. We have personal freedom, civil freedom, religious freedom, and national freedom. We have free bodies, free consciences, free speech, free thought, free action, free Bibles, a free press, and free homes. How vast is this list of privileges! How endless the comforts which it contains! The full value of them can never perhaps be known. Well said the Jewish Rabbins in ancient days: ‘If the sea were ink and the world parchment, it would never serve to describe the praises of liberty.’

The want of this freedom has been the most fertile cause of misery to nations in every age of the world. What reader of the Bible can fail to remember the sorrows of the children of Israel, when they were bondmen under Pharaoh in Egypt, or under Philistines in Canaan? What student of history needs to be reminded of the woes inflicted on the Netherlands, Poland, Spain, and Italy by the hand of foreign oppressors, or the Inquisition? Who, even in our own time, has not heard of that enormous fountain of wretchedness, the slavery of the Negro race? No misery certainly is so great as the misery of slavery.

To win and preserve freedom has been the aim of many national struggles which have deluged the earth with blood. Liberty has been the cause in which myriads of Greeks, and Romans, and Germans, and Poles, and Swiss, and Englishmen, and Americans have willingly laid down their lives. No price has been thought too great to pay in order that nations might be free.

The champions of freedom in every age have been justly esteemed among the greatest benefactors of mankind. Such names as Moses and Gideon in Jewish history, such names as the Spartan Leonidas, the Roman Horatius, the German Martin Luther, the Swedish Gustavus Vasa, the Swiss William Tell, the Scotch Robert Bruce and John Knox, the English Alfred and Hampden and the Puritans, the American George Washington, are deservedly embalmed in history, and will never be forgotten. To be the mother of many patriots is the highest praise of a nation.

The enemies of freedom in every age have been rightly regarded as the pests and nuisances of their times. Such names as Pharaoh in Egypt, Dionysius at Syracuse, Nero at Rome, Charles IX. in France, bloody Mary in England, are names which will never be rescued from disgrace. The public opinion of mankind will never cease to condemn them, on the one ground that they would not let people be free.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Practical Religion: Being Plain Papers on the Daily Duties, Experience, Dangers, and Privileges of Professing Christians</cite>, (1878; Edinburgh: Banner of Truth, 2013), pp 200-02.</span></figcaption>

</figure><figure class="quote" id="q-43ae23943d" data-kw="">
<blockquote><p>Reformed Christians have often been divided on whether or not the apostle Paul was referring to Nero in Romans 13. The Revd Samuel Simms of Loughbrickland Reformed Presbyterian Church answered in the negative (arguably, Simms goes too far in some things that he says, though we agree that the passage does not refer to Nero as a persecuting tyrant):

The Seceding view is based, I am fully persuaded, on a misinterpretation of Rom. xiii. 1-7. That passage states that there is “no power but of God.” What does the Seceder say of this? He says, that every power that exists is of God! What does the Covenanter say of it? He says that if a power is not a God-power, it is no power, but a tyranny? …

Let us read the passage in dispute. What sort of a power does Paul describe? Seven things are said about it. (1) It is not a terror to good works. (2) It is a terror to the evil. (3) It praises what is good. (4) It is (or he is) the minister of God for good. (5) It (or he) beareth not the sword in vain. (6) It (or he) is a revenger to execute wrath upon him that doeth evil. (7) Men are to be subject to it (or to him) for conscience sake.

Now, can all this be applied to Nero? Of course, it cannot. Nero was a monstrous butcher, who murdered his own mother and his own wife, and who made flambeaux of the Christians to illuminate his gardens: how could he be the minister of God for good to men? How could Elagabalus, acting the tom-fool the whole day long among his Syrian dancing wenches, be the minister of God for good to men? Ah, no; it may not be, it cannot be, that such a precious gem as Rom. xiii. 1-7, should be allowed to sparkle on the harlot brow of the selfish, cruel, monstrous, Divine Right theory!

But again – how will the notion of Seceders, that the government of Nero was just as much an ordinance of God as was that of David, the man after God’s own heart, agree with other portions of the Divine Word? In Hosea viii. 4, it is stated – “They have set up kings, but not by me: they have made princes, and I knew it not.” In Ezek. xxi. 27, we have the threat – “I will overturn, overturn, overturn it,” &amp;c.; but on the existence theory principle, how can we acquiesce in this decision or turn this prediction into a prayer; for the power to be overturned was, on Seceding principles, as much the ordinance of God as any other power that could be! It is well known that the fox is a cunning and destructive animal; and yet, the Omniscient Redeemer, plainly and bluntly, called Herod “that fox” (Luke xiii. 32). The Apostle Paul calls the Roman magistrates at Corinth, “the unjust;” now, if they were the unjust at Corinth, how could they be the ordinance of God for good to man at Rome?

And once more; are not Christians commanded to wrestle “against the rulers of the darkness of this world, against spiritual wickedness in high places?” Who are “rulers of the darkness of this world?” Evil angels, of course, primarily; but undoubtedly also, wicked rulers who legislate by evil or satanic principles. It is not, therefore, true as Seceders virtually teach, that “whatever is is right,” as regards civil government. No, for we must take unto ourselves the whole armour of God and fight manfully against all devilish principles in high places; and this we are to do, not by swearing to devilish principles, nor by voting for men to swear to support devilish principles; but by taking up a position of manful, peaceable, but determined protest and dissent with regard to all devilish principles.</p></blockquote>

— Samuel Simms, The Bible, the Church, and Terms of Communion: Together with the Terms of Communion of the Reformed Presbyterian Church in Ireland. To which is Appended the Cameronian Dream, (Belfast, 1879), pp 22-24.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CReformed+Christians+have+often+been+divided+on+whether+or+not+the+apostle+Paul+was+referring+to+Nero+in+Romans+13.+The+Revd+Samuel+Simms+of+Loughbrickland+Reformed+Presbyterian+Church+answered+in+the+negative+%28arguably%2C+Simms+goes+too+far+in+some+things+that+he+says%2C+though+we+agree+that+the+passage+does+not+refer+to+Nero+as+a+persecuting+tyrant%29%3A%0A%0AThe+Seceding+view+is+based%2C+I+am+fully+persuaded%2C+on+a+misinterpretation+of+Rom.+xiii.+1-7.+That+passage+states+that+there+is+%E2%80%9Cno+power+but+of+God.%E2%80%9D+What+does+the+Seceder+say+of+this%3F+He+says%2C+that+every+power+that+exists+is+of+God%21+What+does+the+Covenanter+say+of+it%3F+He+says+that+if+a+power+is+not+a+God-power%2C+it+is+no+power%2C+but+a+tyranny%3F+%E2%80%A6%0A%0ALet+us+read+the+passage+in+dispute.+What+sort+of+a+power+does+Paul+describe%3F+Seven+things+are+said+about+it.+%281%29+It+is+not+a+terror+to+good+works.+%282%29+It+is+a+terror+to+the+evil.+%283%29+It+praises+what+is+good.+%284%29+It+is+%28or+he+is%29+the+minister+of+God+for+good.+%285%29+It+%28or+he%29+beareth+not+the+sword+in+vain.+%286%29+It+%28or+he%29+is+a+revenger+to+execute+wrath+upon+him+that+doeth+evil.+%287%29+Men+are+to+be+subject+to+it+%28or+to+him%29+for+conscience+sake.%0A%0ANow%2C+can+all+this+be+applied+to+Nero%3F+Of+course%2C+it+cannot.+Nero+was+a+monstrous+butcher%2C+who+murdered+his+own+mother+and+his+own+wife%2C+and+who+made+flambeaux+of+the+Christians+to+illuminate+his+gardens%3A+how+could+he+be+the+minister+of+God+for+good+to+men%3F+How+could+Elagabalus%2C+acting+the+tom-fool+the+whole+day+long+among+his+Syrian+dancing+wenches%2C+be+the+minister+of+God+for+good+to+men%3F+Ah%2C+no%3B+it+may+not+be%2C+it+cannot+be%2C+that+such+a+precious+gem+as+Rom.+xiii.+1-7%2C+should+be+allowed+to+sparkle+on+the+harlot+brow+of+the+selfish%2C+cruel%2C+monstrous%2C+Divine+Right+theory%21%0A%0ABut+again+%E2%80%93+how+will+the+notion+of+Seceders%2C+that+the+government+of+Nero+was+just+as+much+an+ordinance+of+God+as+was+that+of+David%2C+the+man+after+God%E2%80%99s+own+heart%2C+agree+with+other+portions+of+the+Divine+Word%3F+In+Hosea+viii.+4%2C+it+is+stated+%E2%80%93+%E2%80%9CThey+have+set+up+kings%2C+but+not+by+me%3A+they+have+made+princes%2C+and+I+knew+it+not.%E2%80%9D+In+Ezek.+xxi.+27%2C+we+have+the+threat+%E2%80%93+%E2%80%9CI+will+overturn%2C+overturn%2C+overturn+it%2C%E2%80%9D+%26c.%3B+but+on+the+existence+theory+principle%2C+how+can+we+acquiesce+in+this+decision+or+turn+this+prediction+into+a+prayer%3B+for+the+power+to+be+overturned+was%2C+on+Seceding+principles%2C+as+much+the+ordinance+of+God+as+any+other+power+that+could+be%21+It+is+well+known+that+the+fox+is+a+cunning+and+destructive+animal%3B+and+yet%2C+the+Omniscient+Redeemer%2C+plainly+and+bluntly%2C+called+Herod+%E2%80%9Cthat+fox%E2%80%9D+%28Luke+xiii.+32%29.+The+Apostle+Paul+calls+the+Roman+magistrates+at+Corinth%2C+%E2%80%9Cthe+unjust%3B%E2%80%9D+now%2C+if+they+were+the+unjust+at+Corinth%2C+how+could+they+be+the+ordinance+of+God+for+good+to+man+at+Rome%3F%0A%0AAnd+once+more%3B+are+not+Christians+commanded+to+wrestle+%E2%80%9Cagainst+the+rulers+of+the+darkness+of+this+world%2C+against+spiritual+wickedness+in+high+places%3F%E2%80%9D+Who+are+%E2%80%9Crulers+of+the+darkness+of+this+world%3F%E2%80%9D+Evil+angels%2C+of+course%2C+primarily%3B+but+undoubtedly+also%2C+wicked+rulers+who+legislate+by+evil+or+satanic+principles.+It+is+not%2C+therefore%2C+true+as+Seceders+virtually+teach%2C+that+%E2%80%9Cwhatever+is+is+right%2C%E2%80%9D+as+regards+civil+government.+No%2C+for+we+must+take+unto+ourselves+the+whole+armour+of+God+and+fight+manfully+against+all+devilish+principles+in+high+places%3B+and+this+we+are+to+do%2C+not+by+swearing+to+devilish+principles%2C+nor+by+voting+for+men+to+swear+to+support+devilish+principles%3B+but+by+taking+up+a+position+of+manful%2C+peaceable%2C+but+determined+protest+and+dissent+with+regard+to+all+devilish+principles.%E2%80%9D%0A%0A%E2%80%94+Samuel+Simms%2C+The+Bible%2C+the+Church%2C+and+Terms+of+Communion%3A+Together+with+the+Terms+of+Communion+of+the+Reformed+Presbyterian+Church+in+Ireland.+To+which+is+Appended+the+Cameronian+Dream%2C+%28Belfast%2C+1879%29%2C+pp+22-24.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F43ae23943d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/43ae23943d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/05/03/samuel-simms-on-nero-and-romans-13/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>VI. (2) The question does not concern the privileges which, from the kindness and liberality of Christian rulers and princes, can be granted to the clergy, many of which it is evident have been granted by emperors. Rather the question concerns the immunity which belongs to them by divine right. (3) It is not inquired concerning the personal burdens which we acknowledge ought not to be imposed, lest they should be a hindrance to the exercise of their ecclesiastical duties and detract in some way from either the dignity or the authority of the sacred office… Leave out the case of extreme necessity, if the country is exposed to extreme danger. But concerning real burdens, as to the property which they possess, not so much with respect to sacred and ecclesiastical property, which, consecrated to the church, is before free and safe from all pressure of tributes (although in a case of necessity, it may be subjected to an extraordinary tribute, as with respect to secular property acquired by them by purchase, inheritance, the rights of marriages and other means, from which ought to be paid to the magistrate what is owed). For the property passes over with the burden upon it, ‘while burdens follow the property and its possessors whomsoever they are’…</p></blockquote>

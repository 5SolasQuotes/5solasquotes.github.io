<main class="wrap"><figure class="quote" id="q-8d41282a47" data-kw="">
<blockquote><p>[T]he covenant of grace surpasses the covenant of works by a thousand miles, for: (a) the covenant of works was from God as the generous Creator, the covenant of grace is from the same as the merciful Redeemer. (b) The former is from benevolence alone, the latter in addition from mercy. (c) The former was in the first Adam with a mere man, the latter in the second Adam with Christ the God-man. (d) The former demanded exact and perpetual obedience from man himself, the latter the righteousness and obedience of Christ the God-man. (e) The former was founded on a perfect nature without a mediator, the latter on the most perfect grace of Christ the Mediator. (f) The former was mutable, the latter eternal. (g) The former produced a servant of God, the latter preeminently a son, heir, and joint heir with Christ. (h) The former concerned the exalting of the glory of divine wisdom, goodness, and righteousness; the latter, in addition, the glory of mercy and longsuffering.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology. Volume 4: Redemption in Christ</cite>, trans. Todd M. Rester, eds. Joel R. Beeke and Michael T. Spangler (Grand Rapids, MI: Reformation Heritage Books, 2023), Book 5, 1.5.1.XXVII.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aeaf25ae84" data-kw="">
<blockquote><p>1. He from all eternity decreed the creation of man after his own image, and the making of the covenant of works with him, in time. All things brought forth in time, lay from eternity in the womb of God’s decree; in virtue whereof they have their being in time: for which cause the decree is said to bring forth, as a woman doth a child, Zeph. ii. 2. And the creation of angels and men, with the providence about them, made many lines in the volume of the sealed book of the decrees.

God self-sufficient needed neither man nor angel: but, for the manifestation of his own glory, he purposed from eternity to create them; and moreover, to enter into such a covenant with man, as one should therein represent the whole family; sovereign pleasure meanwhile taking another method with the angelic tribe: but withal purposing to give both the one and the other a sufficient ability to stand in their integrity, if they would. Thus, from eternity, the covenant of works, in all the parts and appurtenances thereof, was before the eternal mind; though being made with a mere man, it could not actually be entered into, till once man was created. But, “Known unto God are all his works from the beginning of the world,” Acts xv. 18.

2. He decreed also from eternity, to permit the first man, the representative of the whole family, to fall, and so to break the covenant, and involve himself, and all his posterity in ruins. It is evident from the spotless holiness of God, and the nature of the thing, that the divine permission was not the cause of man’s fall; and from the necessary dependence of the creature upon the Creator, that without it, he could not have fallen. But the sovereign Lord of the creatures, permitted the fall of man for his own holy ends, purposing to bring about good from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Grace, from the Sacred Records</cite>, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 386-87.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-5ce83c846f" data-kw="federal head">
<blockquote><p>Man must be viewed under a double relation—either as just or as the first. In the former respect, he had the power to perform the prescribed duty. In the latter, Adam in a certain manner included the whole human race, which was to spring from him, both as the root and the seminal principle from whom the whole human race was to descend; and as a public person and representative head, because he represented all men who were to spring naturally from him. Hence that covenant pertained not only to Adam, but to all his posterity in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.3.11</span></figcaption>

<blockquote><p>It will now be asked, what manner of covenant was that at Mount Sinai, which is called the worst covenant? What kind of covenant was it? Sol. In general, it was a covenant of works, as to be fulfilled by Jesus Christ, but not so to Israel. Or, it was the covenant of grace as to its legal condition to be performed by Jesus Christ, represented under a conditional administration of it to Israel.</p></blockquote>

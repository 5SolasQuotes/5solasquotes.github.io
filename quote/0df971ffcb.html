<main class="wrap"><figure class="quote" id="q-0df971ffcb" data-kw="">
<blockquote><p>Persons who are justly condemned to slavery [penal servitude], as a punishment of their dishonesty or other crimes, may be lawfully bought for slaves: and prisoners may be bought from conquerors, if it be in order to preserve their lives.

But to make war upon neighbours, or encourage others to it, in order to procure slaves, – or to trade in buying slaves, – is altogether unmerciful, and shocking to right reason and humanity, – natively entailing upon these merchants the blood of the souls and bodies of their fellow-creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A compendious view of natural and revealed religion</cite>, (1782; Fearn: Christian Focus Publications, 2002), p. 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-edfd048b2c" data-kw="">
<blockquote><p>The Free Church of Scotland minister, Dr Thomas Guthrie, said the following about Northern and British guilt in Southern slavery:

Abuse the South as men may, I say that in some respects the North is the guiltier of the two. They know the truth, they had the truth, they were free, and they ought to have more sympathy with the cause of freedom than men bred up in the South with slavery; and, for my part, I sometimes think there are six of the one and half-a-dozen of the other. I don’t say that our own country is without blame in the matter, and I should not be surprised that we suffer some share of the judgment. Our merchants and manufacturers were long guilty of neglecting to raise cotton in our own colonies, and thereby to cut the foundation out below slavery. But just look at New York – look at its merchants. It is a notorious fact that the merchants of New York, by the reverence which they pay to the dollar, have been the mainstay of slavery in the South. It is New York dollars that have built every slave ship, and it is by New York merchants that every ship is owned that carries on that infamous traffic. And look to the pulpits of the North – look to their preachers and their ministers. They have employed their pens and prostituted their pulpits in defending this atrocious system.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-guthrie.html">Thomas Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Banner of Ulster</cite>, 14 May 1861.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

nter</a></div>
</figure><figure class="quote" id="q-31d5d00968" data-kw="">
<blockquote><p>Now that the prophet was ordered to offer them wine, and that they refused, a question here arises: Was their continency in this respect laudable? They seemed thus to prefer Jonadab [their forefather] to God, for they knew that Jeremiah, who offered them wine, was sent by God. But the Rechabites, no doubt, modestly excused themselves, when they said that it was not right for them to drink wine, because they had been forbidden by their father. It was not then their purpose to give more honor to their father than to God or to his prophet, but they simply answered for the sake of excusing themselves, that they had abstained from wine for three hundred years, that is, that the whole family had done so. This, then, is the solution of the question. But what the Papists do in bringing against us the Rechabites, first to support their tyrannical laws, and secondly, in order to torment miserable consciences at their pleasure, is frivolous in the extreme. As I have already said, the advice of Jonadab is not commended, as though he had rightly forbidden his sons to drink wine; but only his sons are spoken of as having reverently and humbly obeyed the command of their dead father. Then this passage gives no countenance to the Papists, as though the object of it was to bind the consciences of the faithful to their laws; for what is here spoken of is that the Rechabites proved by their obedience how base and wicked was the obduracy of the people, as they showed less reverence and honor to God than these did to a man that was dead. But the Papists, however, dwell much on another point, — that whatever has been handed down from the fathers ought to be observed; and thus they reason, “The authority of the whole Church is greater than that of a private man; now the Rechabites are commended for having followed the command of a private individual, much more then ought we to obey the laws of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jeremiah</cite>, 35, v. 7, on the Rechabites</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

</figure><figure class="quote" id="q-ff3b9cf688" data-kw="">
<blockquote><p>What compelled people may do to redeem their lives, with loss of liberty, is nothing to the point… and that they may sell the liberty of their posterity, not yet born, is utterly denied as unlawful; yea, a violentated father to me is a father, and not a father, and the posterity may vindicate their own liberty given away unjustly before they were born, Qua omne regnum vi partum potest vi dissolvi.</p></blockquote>

</figure><figure class="quote" id="q-da40032e7d" data-kw="">
<blockquote><p>Mere head knowledge of these virtues of faith, hope, and love is worthless; these virtues must be earnestly put into practice. The kingdom of God is not just a matter of talk but of power (1 Cor. 4:20). Thus, we should not be satisfied with merely knowing the virtues we have so far discussed but should endeavour to exercise them so that they are manifest in our actions. Likewise, someone is not justified because he can eloquently describe the doctrine of justification, but because he persistently proves his faith by his good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/godefridus-udemans.html">Godefridus Udemans</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Faith, Hope, and Love</cite>, trans. Annemie Godbehere, ed. Joel R. Beeke (1621; Grand Rapids MI: Reformation Heritage Books, 2012), p. 36.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

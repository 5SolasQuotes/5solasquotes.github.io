<blockquote><p>Corollary 2. We reject the assertion of the Remonstrants in the Hague Collation, by which they establish that the will before the fall had no good qualities or habits, and consequently lost none through the fall.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8a312a8286" data-kw="">
<blockquote><p>Some infer from this passage that men were content with herbs and fruits until the deluge, and that it was even unlawful for them to eat flesh. And this seems the more probable, because God confines, in some way, the food of mankind within certain limits. Then after the deluge [Gen. 9], He expressly grants them the use of flesh. These reasons, however are not sufficiently strong: for it may be adduced on the opposite side, that the first men offered sacrifices from their flocks [Gen. 4]. This, moreover, is the law of sacrificing rightly, not to offer unto God anything except what He has granted to our use. Lastly men were clothed in skins [Gen. 3:21]; therefore it was lawful for them to kill animals. For these reasons, I think it will be better for us to assert nothing concerning this matter. Let it suffice for us, that herbs and the fruits of trees were given them as their common food; yet it is not to be doubted that this was abundantly sufficient for their highest gratification. For they judge prudently who maintain that the earth was so marred by the deluge, that we retain scarcely a moderate portion of the original benediction. Even immediately after the fall of man, it had already begun to bring forth degenerate and noxious fruits, but at the deluge, the change became still greater. Yet, however this may be, God certainly did not intend that man should be slenderly and sparingly sustained; but rather, by these words, He promises a liberal abundance, which should leave nothing wanting to a sweet and pleasant life. For Moses relates how beneficent the Lord had been to them, in bestowing on them all things which they could desire, that their ingratitude might have the less excuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Gen. 1, verse 28</cite></span></figcaption>

olasquotes.github.io%2Fquote%2F8a312a8286.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8a312a8286.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-mans-original-state-in-righteousness/#:~:text=Some%20infer%20from%20this%20passage%20that,ingratitude%20might%20have%20the%20less%20excuse&amp;text=Some%20infer%20from%20this%20passage%20that%20men%20were&amp;text=that%20their%20ingratitude%20might%20have%20the%20less%20excuse" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>All these principles are the principles of our natural intelligence. They are first manifested in that spontaneous form of intelligence which we call common sense, that is, the natural aptitude of intelligence, before all philosophic culture, to judge things sanely. Common sense, natural reason, seizes these self-evident principles from its notion of intelligible reality. But this natural common sense could not yet give these principles an exact and universal formulation.</p></blockquote>

<blockquote><p>201. There is in the very essence of the natural power or faculty, besides the vis vel virtus agendi, a certain natural inclination to some things, which is inseparable from it, from which the schoolmen say even of the will that it is quaedam natura, et pondus animae. So the soul is inclined or propense (and not only able) to activity as such, to intellection as such, to volition as such; and objectively to truth as such, and to natural good and felicity as such. And there is an inclination of the soul, which is not essential and inseparable, but is much under the power of the will, and may be got and lost. 202. This adventitious disposition is found in the soul in various degrees: 1. When it is in such a degree only, as that immediately and properly without any other power added, the will may be said to be able to act thus or thus, then it is called a moral power: [2.] But when it is in such a degree as that we are disposed to act promptly and easily, it is called a habit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology, Plain, Pure, Peaceable... (London: White, 1675)</cite>, sect. 10, ‘Of Natural &amp; Moral Power as Foreseen’; pp. 36-37</span></figcaption>

med Books Online</a></div>

<blockquote><p>V. Next, we must examine those aspects that primarily and chiefly pertain here (πρώτως καὶ κυρίως, “primarily and chiefly”): namely, the infused and inherent habits (habitus infusi &amp; concreati), for considering only acquired habits, as the Socinians and Remonstrants do, is sheer nonsense. These habits perfected and adorned these faculties excellently, such as the clarity and rectitude of the mind, not only regarding that innate (ὑπάρχον) aspect of the divine (τὸ τοῦ θεοῦ), whether it is innate through common notions (κοιναὶ ἐννοίαι) and the subjective light of the mind, or acquired through the objective light of being, as Socinus vainly objects (Romans 1; Isaiah 40; Psalm 19; Acts 14; Romans 2). But as a supernatural good, spiritual and religious, man knew God, His revealed will, and found his supreme happiness therein with perfect accuracy… We do not, however, regard this Original Righteousness as something substantial, as Osiander does, nor do we consider it a supernatural addition extrinsically added to the first nature in its pure natural state, as the Roman Catholics do. Instead, we deem it natural or connatural; otherwise, God would have commanded man to fulfill His law by his own strength in vain. This is further confirmed by the fact that, as it was to be propagated because it was natural, so reciprocally it was to be propagated by divine grace (Genesis 1:28, 1 Corinthians 15:48). What pertains to the supernatural, as such, cannot be sought in vain. However, we can easily accept calling it supernatural insofar as it did not flow from the essential principles of human nature but was infused by the grace of God as a moral good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin</cite></span></figcaption>

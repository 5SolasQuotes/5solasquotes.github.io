<main class="wrap"><figure class="quote" id="q-eff02f040a" data-kw="">
<blockquote><p>…his [Christ’s] servants, who stood firm in their opposition to Prelacy… but if they will have patience to hear me to ‘Amen’ [at the end], I may possibly convince them of a truth they, are not willing to hear; for I not only grant that they have forgotten their Master’s directions, inhibiting them to to lift up themselves above their brethren… they must have leave to put out mine and other men’s eyes besides (which we are not willing to give them; though if any man would gratify his Grace [the king], and their Lordships [the prelates], he must part with these in the first place; for an implicit faith is the basis and foundation of their Kingdom of darkness, without which it would fall about their ears and but overwhelm them in the rubbish… before this come so much as under debate, almost with indifferent men, whether God be angry at their way? His very giving of them up to persecute his people &amp; servants, says nothing, if it say not this, that whatever be their outward prosperity, he has classed them with Pharaoh, in pouring out his plagues upon their heart…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Joshua Redivivus, or Mr. Rutherford’s Letters</cite>, … ([Rotterdam?, 1664]), ‘Christian Reader’, no page numbering</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9bbfb27e69" data-kw="">
<blockquote><p>A politic writer admonishes, retinere antiqua [retain that which is ancient], only with this caution: Si proba [if it is proved]. Calvin (speaking against human ceremonies) says: Si objiciatur, etc. ‘If’, says he, ‘antiquity be objected (albeit they who are too much addicted to custom and to received fashions, do boldly use this buckler to defend all their corruptions), the refutation is easy: For the ancients also themselves with heavy complaints have abundantly testified that they did not approve of anything which was devised by the will of men.’… 3. …If then it be enough to pitch upon custom, why ought not those customs to have been commended and continued? But if they were commendably changed, then ought we not to follow blindly the bare custom of the Church, but examine the equity of the same, and demand grounds of reason for it. St. Paul (says Dr. Fulke) does give reasons for that order of covering women’s heads: By whose example the preachers are likewise to endeavor to satisfy by reason both men and women, that humbly desire their resolution for quiet of their conscience, and not to beat them down with the club of custom only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, ... (1637), pt. 3, ch. 6, pp. 104-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

ishes%2C%20retinere%20antiqua%20%5Bretain%20that&amp;text=them%20down%20with%20the%20club%20of%20custom%20only" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>5. Still, however, we see not how necessary that obedience is, unless we at the same time consider how prone our carnal nature is to shake off the yoke of God whenever it has been treated with some degree of gentleness and indulgence. It just happens to it, as with refractory horses, which, if kept idle for a few days at hack and manger, become ungovernable and no longer recognize the rider, whose command before they implicitly obeyed. And we invariably become what God complains of in the people of Israel — waxing gross and fat, we kick against Him who reared and nursed us (Deut. xxxii. 15). The kindness of God should allure us to ponder and love his goodness…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, bk. 3, ch. 8, section 5</span></figcaption>

</figure><figure class="quote" id="q-3dbf382cd4" data-kw="">
<blockquote><p>Nor are we obliged to follow what our conscience says is true and good, because, or upon this formal reason and ground, that the conscience says so, more than we are to believe and practice what the Church or the conscience of others, [who are] the Church, the learned and godly, say; for we make not the word of the Church the formal object of our faith, but ‘thus saith the Lord’ only, because the Church is but a company of men and so our faith should depend upon men, even though holy and speaking ingenuously what their conscience dictates as true, which is absurd, ergo, by the same reason, what one man’s conscience, our own or others’ say, is not the formal object of our faith and practices, for so also our faith should depend on man, not on God. And we say the conscience, at its best, is but regula regulata [a rule being regulated] not, regula regulans [a regulating rule], nor ought it to have the throne of God, for God is only Regula Regulans. If it were a rule, it is to be ruled by God and his Word, yea, as we are to try all things and not believe with a blind faith what others say, or their conscience proposes to themselves and us, as truth, for then we make a Pope of the consciences of men under the notion of teachers and Church; so we are not to be ruled without trying, and absolutely [ruled] by our own conscience, but to try its dictates by the Word of God, otherwise we make a Pope and a God of our own conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (London [1649]), ch. 11, ‘Of the Obliging Power of Conscience’, p. 135 &amp; passim</span></figcaption>

</figure><figure class="quote" id="q-3c5bf74804" data-kw="">
<blockquote><p>And having first corrupted [Church] government from the primitive simplicity, and made princes their lictors [jailors and executioners] (as [Hugo] Grotius speaks in that excellent epistle newly translated by Mr. Barksdale), they next corrupt doctrine and worship consequently. For tyrants must have their wills in everything: and numerous and needless laws and canons must be made to show their power and fulfil their wills, that they may be lawgivers and a rule to all the world. And when they have made a seeming necessity of doing things unnecessary, then to plead the necessity which they have made, is the sum of all their arguments. And they that are against strict and precise adhering to the Scriptures, or observance of God’s own commands, are yet so strict for obedience to their proud imperious wills that they persuade themselves and others that without it there can be no order, no unity, no peace, but rebellion and confusion: And so they cry up obedience, obedience, that their idol wills may be bowed to by all without control; And when they are mere usurpers, and use no power given them by God, they yet get the advantage of making all odious that obey them not in the least and greatest matters, by the names of schism, unruliness or such like. O say the Papal usurpers, ‘The Church must be obeyed, or there will be no order: Disobedience in small matters is no small sin,’ when they have set up an idol-power against Christ; as if to disobey Him, whose laws they make void by their traditions and usurpations were a lesser fault. And when they have departed as far from the Christian simplicity in doctrine, government and worship, as their voluminous councils and decretals, and missals differ from the ancient simple Christianity, and have made as many snares and engines to divide and tear the Church of Christ as there are noxious (that I say not needless) laws, canons, and decrees imposed as necessary to peace and concord, then no men’s mouths are more opened against schism, when they have unavoidably caused it, yea are the greatest schismatics; And no men call so loud for unity and concord, as they that have first made it a thing impossible. … …

2. Have they not room enough to show their power, and work enough to do in seeing to the execution of Christ’s own universal laws and preserving mere order and decency in undetermined circumstances, that all may be done to edification?

3. Does not every needless oath and subscription by which they would tie men faster to themselves in controvertible cases, plainly tend to undermine themselves and keep up still a conscientious party against them? For while men have nothing to do but live quietly under a government, they will be glad of peace: But when they are put to subscribe, declare, covenant and swear that all this is good or lawful, or that they will never be against it, it sets men unavoidably on the deepest studies of the case, and so all the people are set on trying and judging of that, which else they would never have meddled with: For what honest man will say, swear or promise he knows not what? Even as some crafty rebels would undermine princes by drawing them to put the controverted parts of their prerogative into the subjects’ oaths, that so they may make all the people students and judges of the cause, and unavoidably make factions and dissenters, that else would have lived quietly if they might: so do the Papal clergy ruin themselves by such over-doing impositions. I remember Lampridius tells us that Alexander Severus (that great enemy of injustice) was so severe that he would have made a law to regulate men’s apparel: But Ulpian changed his mind by telling him that many laws cause divisions and make occasions of disobedience. They cry out, ‘There will be no order if ministers and people be left to their own discretion in such and such circumstantials;’ but do they dream of perfect concord on earth? and that men of such various interests, tempers, educations, converse and degrees of knowledge should not differ in a word or gesture? Our English rulers make no laws what gesture shall be used in singing Psalms, or in hearing sermons, and there is no division or great disorder in them: But if on pretence of nearer concord, they should tie all to one gesture, this or that, we should presently find it an engine of division. And O how many such engines have the Papal clergy made and used long! and to what purpose? To silence faithful ministers, to torment faithful Christians in the inquisitions, to brand the best men with the names of heretics and schismatics, to gratify all profaneness and malignity, to quench brotherly love, and to tear the Church into pieces; and no experience will make them wiser.</p></blockquote>

rd, then no men’s mouths are more opened against schism, when they have unavoidably caused it, yea are the greatest schismatics; And no men call so loud for unity and concord, as they that have first made it a thing impossible. … …

<main class="wrap"><figure class="quote" id="q-42e6780277" data-kw="">
<blockquote><p>Once ‘desire’ is attributed to him (Lk. xxii. 15),—he had ‘set his heart’, as we should say, upon eating the final passover with his disciples—the term used emphasizing the affectional movement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/b-b-warfield.html">B. B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Emotional Life of our Lord’ (1912)</cite>, p. 82</span></figcaption>

</figure><figure class="quote" id="q-c193217004" data-kw="">
<blockquote><p>Keckermann 323f.: (2) ‘Of the seed and blood of the Virgin Mary was formed Christ’s flesh, the Holy Spirit adding quickening force to this material. Of course the seed and blood of the Virgin Mary also possessed their own vital and animal spirits, as other men’s seed usually has. But these were by no means sufficient for the plastic or formative force of the foetus in question. And so the Holy Spirit’s extraordinary shadowing and quickening were added: whence also it is said to have been conceived of the Holy Spirit, a phrase and manner of speaking which is human and metaphorical, not strictly appropriate.–(3) Thus Christ’s incarnation was at once ordinary and extraordinary: ordinary as regards the material supplied by the Virgin Mary, extraordinary as regards the formative force added to this material…&#x27;</p></blockquote>

</figure><figure class="quote" id="q-04da18c64a" data-kw="">
<blockquote><p>Certainly from one perspective, as a creature and as man, it seems that He [Christ] cannot be exempted from the moral government of God, nor otherwise could He as a man have merited anything for Himself. From another perspective, if He were in Adam under the covenant of nature, then it would seem that in and with Adam who sinned, He violated that same covenant, which is beyond absurd. Therefore it seems most safe to state: although as a rational creature He cannot be exempted from moral government with respect to his natural duties, yet He could have been withdrawn by God from the same moral governance in the positive duties, such as the commandment not to eat of the forbidden fruit (upon the transgression of which the sin of the human race hangs).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (RHB), vol. 3, bk. 3, ch. 12, section 9, ‘Was it [the CoW] also entered into with the second Adam?’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-641785839b" data-kw="">
<blockquote><p>Christ, as God, sanctified Himself in His humanity: (1) By appointing His humanity as a sacrifice for sins. (2) By conferring merit and efficacy to His sacrifice, in order to acquire the remission of sins. Some of the Lutherans say that the person, according to both natures, was the subject of the passion. Whence that horrible assertion: the Deity also suffered: which most moderns disapprove, and that rightly. At the same time, being impatient of our animadversion, they strike at us with something else, itself erroneous, concerning the subject of the passion: namely, that, according to the opinion of the Calvinists, only the human nature of Christ suffered: which they then refute with many arguments, but in vain. They invent for themselves an enemy: they do not have us in this role, who orthodoxly and according to Scripture teach, that Christ, according to the flesh, suffered, 1 Pet. 4:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd ed. (1634), Species of the Office of Christ, pt. 2</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

<main class="wrap"><figure class="quote" id="q-6518e61183" data-kw="">
<blockquote><p>THE OFFICE OF THE CHRISTIAN MAGISTRATE

It remains for us to speak of the Christian magistrate, as being one of the members of the Church, and also the chief in his own sphere, appointed above all others, without any exception (Rom 13:1). His office is to show himself protector of the peace and public tranquillity (1 Tim 2:2). This cannot be justly down without firstly re-establishing the true worship of God, for from Him alone flows all true happiness. It follows therefore that no greater condemnation can be given to Christian magistrates than to have a well ordered Church, according to the Word of God, to maintain and defend to authority against all those who would despise it and obstinately cause disturbance. They will follow the example of David, Solomon, Hezekiah, Josiah, in short, of all the holy kings and princes (Deut. 17:18; Is. 49:23; Ps 101:8; 75:10; 1 Kings 2:27; 2 Chron 14, 15 and 17; 2 Kings 10:25; 18:3; 23:20).

There is no question here of giving ground to those who, under the colour of a false show of mildness, and by arguments which are not only vain and impertinent, but savour also of great impiety and sacrilegious boldness, would exempt false prophets and heretics from the sword of Christian princes. On the contrary, there are no other persons whom the magistrate must suppress with greater severity than these; the Word of God expressly commands it, and faithful princes have always done it (Exod 22:20; Deut 13; Exod 31:14; Lev 24:15; Num 15:30).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, trans. James Clark (1558; Edinburgh, 2016), 5.44, pp 103-04.</span></figcaption>

</figure><figure class="quote" id="q-8d04bf15d2" data-kw="">
<blockquote><p>Enclosers; that pretend a distinction of possessions, a preservation of woods, indeed to make better and broader their own territories, and to steal from the poor commons; these are horrible thieves.

The poor man’s beast is his maintenance, his sustenance, his life, to take food from his beast, is to take the beasts food from his belly: so he that incloseth Commons is a monstrous thief, for he steals away the poor man’s living and life; hence many a Cottager, nay perhaps Farmer, is fain (as the Indians do to Devils) to sacrifice to the lord of the soil, a yearly bribe for a nenoceat.

For though the law forbids such enclosures: yet (quod fieri non debet, factum valet) when they are once ditched in, say the law what it will, I see no throwing out: force bears out, what fraud hath borne in: let them never open their mouths to plead the Common-wealth’s benefit: they intend it as much as Judas did, when he spake for the poor: no, they are thieves, the bane of the common good, the surfeit of the land, the scourge of the poor: good only to themselves; and that in opinion only: for they do it, to dwell alone, and they dwell alone indeed: for neither God nor good Angel keeps them company: and for a good conscience, it cannot get thorow their quick-sets.

These are thieves, though they have enclosed their theft, to keep the Law out, and their wickedness in: yet the day shall come, their lands shall be thrown out, their lives thrown out, their souls thrown out: their lands out of their possessions, their lives out of their bodies, their souls out of heaven; except repentance and restitution prevail with the great Judge for their pardon: mean time, they are thieves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The white devil, or The hypocrite uncased: In a sermon preached at Paul’s Cross, March 7. 1612</cite>, (London: Melchisedech Bradwood, 1613), pp 46-47.</span></figcaption>

<blockquote><p>§ 10, Direction 7. Meddle not with lawsuits till you have offered an equal arbitration of indifferent men, or used all possible means of love to prevent them. Lawsuits are not the first, but the last remedy. Try all others before you use them. § 11, Direction 8. When you must needs go to law, compose your minds to unfeigned love towards him that you must contend with, and watch over your hearts with suspicion and the strictest care, lest secret disaffection get advantage by it; And go to your neighbor and labor to possess his heart also with love, and to demulce [pacify] his mind, that you may not use the courts of justice as soldiers do their weapons, to do the worst they can against another, as an enemy: but as loving friends do use an amicable arbitration, resolving contentedly to stand to what the judge determines, without any alienation of mind or abatement of brotherly love. § 12, Direction 9. Be not too confident of the righteousness of your own cause, but ask counsel of some understanding, godly and impartial men; and hear all that can be said, and patiently consider of the case, and do as you would have others do by you.</p></blockquote>

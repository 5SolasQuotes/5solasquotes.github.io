<main class="wrap"><figure class="quote" id="q-555fb85697" data-kw="">
<blockquote><p>When therefore, we say that the faithful are esteemed just even in their deeds this is not stated as a cause of their salvation, and we must diligently notice that the cause of salvation is excluded from this doctrine; for, when we discuss the cause, we must look nowhere else but to the mercy of God, and there we must stop. But although works tend in no way to the cause of justification, yet, when the elect sons of God were justified freely by faith, at the same time their works are esteemed righteous by the same gratuitous liberality. Thus it still remains true, that faith without works justifies, although this needs prudence and a sound interpretation; for this proposition, that faith without works justifies is true and yet false, according to the different senses which it bears. The proposition, that faith without works justifies by itself, is false, because faith without works is void. But if the clause “without works” is joined with the word “justifies,” the proposition will be true. Therefore faith cannot justify when it is without works, because it is dead, and a mere fiction. He who is born of God is just, as John says. (1 John v. 18.) Thus faith can be no more separated from works than the sun from his heat: yet faith justifies without works, because works form no reason for our justification; but faith alone reconciles us to God, and causes him to love us, not in ourselves, but in his only-begotten Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ezekiel</cite>, (Grand Rapids: Baker Book House, 1979), p. 238</span></figcaption>

<blockquote><p>When the doctrine of the Reformers began to be abused by the Antinomians, the Puritans were raised up, in the good providence of God, to give the same prominence to Sanctification as Luther had given to Justification; to insist as as strenuously on the the work of the Spirit in applying salvation as he had done on the work of Christ in procuring it: for though both doctrines were taught at an earlier period… it was reserved for their successors, when controversy arose, to expound them more fully in their necessary connection and mutual relations. Such writers as Owen, and Goodwin, and Charnock, and Howe, and Trail adhered firmly to the doctrine of Justification as proclaimed by Luther and Calvin, while they checked every tendency to Antinomian licence by the firm assertion of the indispensable necessity of personal holiness as one of the essential parts of the great salvation… Considered as fruits of our sanctification, and as evidences of our ‘MEETNESS for the inheritance of the saints in light,’ they cannot be too highly commended; but considered as the ground of our Justification, or as forming any part of our TITLE to that inheritance, they are to be utterly rejected, and treated as ‘dung’ and ‘filthy rags’ with reference to that end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification: An Outline of Its History in the Church and of Its Exposition from Scripture.(Edinburgh: T&amp;T Clark</cite>, (Grand Rapids: Baker, 1955), pp. 363-64</span></figcaption>

</figure><figure class="quote" id="q-ac017145c5" data-kw="">
<blockquote><p>What is to be observed in the sayings of the Scriptures wherein justification, salvation and life eternal is ascribed to works?

1. Legal sentences are to be understood of perfect good works, such as none can be found in no creature; But evangelical sentences do always include faith in our works. And we must understand that by faith in the first place, justification is received, and acceptation to life eternal: afterward in the second place and by consequence, works are accepted as the fruits of faith, and life eternal is promised to these for Christ’s sake.

2. In such sayings, there are not brought forth arguments from the cause [as to] why the person is made partaker of eternal life, but it is showed from the effects or the adjuncts what person is partaker of remission of sins and life eternal (so Lk. 7:47). Christ plainly proves in way of resolution by this argument that the woman’s sins were pardoned because she loved much. But two diverse questions are at no hand to be confounded. The one to whom life eternal is given, the other for what cause it is given. To them that do well and meditate in the law of God, is happiness and life eternal promised, but yet it is given freely for Christ’s sake.

3. In this question we must remember to observe a rule of the Rabbins concerning the Holy Scriptures. In every place wherein thou lightest on an objection for an heretics, thou findest a medicine in the side thereof. So the scripture, wheresoever it ascribes eternal life to works as a reward, calls it an inheritance.

4. When as diverse effects do depend alike of one and the self same cause, the consequence from one effect avails to another because of their common dependence, as Lk. 7:47, the consequence from love avails (to prove) the remission of sins: because each of them depends on faith.

5. Where there is a subject there is his propriety, and on the contrary where there is a propriety there is his subject. So where there is faith there be works, and where there be good works there is faith.

6. Seeing good works do spring from faith, whatsoever is attributed to them, must needs be ascribed to the root (i.e. faith, whence they spring).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (London, 1606), ch. 32, ‘Of Good Works’, p. 376-77</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

<blockquote><p>19. In this life they [powers of human choice] avail nothing without the help of God, whether general or special.

20. General help is called the general motion of divine providence by which all things are governed and preserved. Acts 17:28; Heb. 1:3.

21. Special help is called the particular grace that moves, strengthens, and advances unto action.

22. And this is either apart from regenerating grace, by which God distributes moral gifts and moral virtues to whom he wills, even to the reprobate (1 Cor. 12), or it is joined with regenerating grace, that is, the saving grace of Christ, of which it is said in Jn. 15:5 and 1 Cor. 15:10.

23. I say that the powers of human choice (vires humani arbitrii) avail nothing in themselves, neither in earthly matters nor in heavenly matters.

24. I call earthly matters those things which pertain only to earthly life.

25. And these are either natural or moral.

26. Natural things are called those which are common to all living beings, such as eating, drinking, sleeping, walking, procreating, etc.

27. Moral things are called political or civil matters which pertain to establishing and preserving human life, household management, society, and the commonwealth—such as buying, selling, administering justice, serving in the military, cultivating peace, governing a family, learning the sciences and arts whether liberal or mechanical, etc.

28. Heavenly matters are those things which pertain to the heavenly and spiritual life in the kingdom of Christ, such as believing in God, calling upon God, doing the will of God, fulfilling the commandments of God, etc. These are also called spiritual matters, matters pertaining to salvation, pious, Christian, and religious matters. …

38. After the fall, choice, both regenerate and unregenerate, can choose and accomplish no natural things without the general help of God.

39. Much less is it able to choose and pursue political matters without the general help of God.

40. Indeed, it cannot desire and pursue moral virtues, disciplines, and arts without the special help of God, who in his goodness bends the will and supplies strength.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“19. In this life they [powers of human choice] avail nothing without the help of God, whether general or special.

20. General help is called the general motion of divine providence by which all things are governed and preserved. Acts 17:28; Heb. 1:3.

21. Special help is called the particular grace that moves, strengthens, and advances unto action.

22. And this is either apart from regenerating grace, by which God distributes moral gifts and moral virtues to whom he wills, even to the reprobate (1 Cor. 12), or it is joined with regenerating grace, that is, the saving grace of Christ, of which it is said in Jn. 15:5 and 1 Cor. 15:10.

23. I say that the powers of human choice (vires humani arbitrii) avail nothing in themselves, neither in earthly matters nor in heavenly matters.

24. I call earthly matters those things which pertain only to earthly life.

25. And these are either natural or moral.

26. Natural things are called those which are common to all living beings, such as eating, drinking, sleeping, walking, procreating, etc.

27. Moral things are called political or civil matters which pertain to establishing and preserving human life, household management, society, and the commonwealth—such as buying, selling, administering justice, serving in the military, cultivating peace, governing a family, learning the sciences and arts whether liberal or mechanical, etc.

28. Heavenly matters are those things which pertain to the heavenly and spiritual life in the kingdom of Christ, such as believing in God, calling upon God, doing the will of God, fulfilling the commandments of God, etc. These are also called spiritual matters, matters pertaining to salvation, pious, Christian, and religious matters. …

38. After the fall, choice, both regenerate and unregenerate, can choose and accomplish no natural things without the general help of God.

39. Much less is it able to choose and pursue political matters without the general help of God.

40. Indeed, it cannot desire and pursue moral virtues, disciplines, and arts without the special help of God, who in his goodness bends the will and supplies strength.”

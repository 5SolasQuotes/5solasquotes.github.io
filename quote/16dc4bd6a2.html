<blockquote><p>But among other things which were prudently and happily done by you, the convocation of the Synod of Dort hath obtained the chief place. Then which Synod for many ages past there hath been none more famous, more holy, nor more profitable to the Church.

Whereunto that ye might call most choice men from divers parts, ye spared neither cost, nor labour; wherein all things were done so orderly and gravely, that it hath drawn the people into admiration, and hath stayed those that were staggering, and hath so troubled headstrong and obstinate persons only with the sight thereof, that they which before did seem to be desirous of the conflict, and greedily to call for the encounter, have by contrary practices, (whether fear stroke them, or their conscience affrighted them) begun to shun the hearing of the cause, to hate the light, and to work delays.

To so excellent a thing, both other Princes did exhort you, and especially the most renowned Prince JAMES, King of great Britain, who hath always been most earnest and forward to drive away the errors of all innovators; who as he is rightly styled the Defender of the Faith, so he hath his eyes vigilant on all sides, carefully watching lest Christian faith should any where receive any damage.</p></blockquote>

<blockquote><p>5. It is now supposed, and shall (if it please God) hereafter be demonstrated, that human souls are not traducted, nor causally brought out of the flesh: yet are they occasionally (that I may touch at the manner), God having resolved and decreed, after generation and fit organization of the embryo, to create and infuse a reasonable soul: which soul, because it is united to a mass corrupted, in such a manner as a spiritless mass may be corrupted, or rather to a mass inclining or inducing to corruption, in the very unition it contracts original sin. Hugo Eterianus [d. 1182] thus descants on this point: ‘When the soul languishes, it is neither cast down by the will, nor by necessity, but only by fellowship, if the soul were corrupted by the will, it should not be counted original sin, but actual: if it should fall by necessity, that vice were no further to be imputed.’ Concerning the latter part, I answer, if in his necessity he imply coaction, he says true: otherwise, by this concurrence of our condescending will in Adam, or by our own implicit will, we may draw on us a necessity of after-sinning, which most justly may be imputed to us, and we may tie ourselves with our own bonds. To the former part this may give satisfaction, that against the will of the soul, the soul itself cannot be corrupted: for then the will should be forced, and so [be] no will at all, but [a] noluntas, and not voluntas. ‘It is not necessary,’ says Bellarmine, ‘that our soul must needs come from Adam, because we draw sin from him: if but one part come from him it is enough.’ For a father does not per se produce original sin in the child, but per accidens; namely, as by the act of generation it comes to pass, that his son is a member of mankind, which was overtaken in Adam’s corruption, and that the propension unto evil of the earthly part traducted, meeting with a soul not much resisting, causes this original sin to result thencefrom, and death by this original sin. So that no sooner is the soul united to its body, and the matter glued to the form, but the infant deserves to be, and is the child of death, by reason of the primigeneal corruption. If you inquire after what manner the body works the soul unto this evil, we may truly say, ‘The body works not upon the soul by a natural and immediate action.’ You heard what Hugo Eterianus said, ‘It is stricken or cast down only by fellowship.’ He enlarges himself in the same chapter, thus: ‘Imperfection, languishing, and corruption abide in the flesh before the soul’s conjunction; from which disease the soul is infected: as if a vessel be tainted with an ill odour, it infects therewith whatsoever liquor it receives.’ Gerson thus, ‘The soul by the conjunction with the body contracts that infection; as when one falls into the mire, he is besmeared and stained.’ Felisius thus: ‘A clean apple put in an unclean hand is soiled. Good wine poured into a fustie vessel contracts a strange taste, and loses its own natural: so the soul loses its naturall vigor, when it is united in the flesh.’ Another thus, ‘Anima cum labente simul labitur, et frustra nititur dum innititur.’ To the same effect another says thus: ‘As the purest rain-water falling on dust, is turned with the dust into a lump of mire: so at the coadunation of the soul unto the earthly part, both spirit and flesh are plunged in the durt of corruption.’ Augustine, against Julian the Pelagian, prefers the very heathen before Julian; for he held that ‘nothing was conveyed unto us from Adam;’ and they held, ‘That we were born to be punished for old crimes committed in a former life.’ ‘And,’ says Augustine, ‘it is true which Aristotle relates, that we are punished like to those who fell among the Hetrurian robbers, whose living bodies being coupled face to face with dead men’s carcasses, were so killed.’ Of the Hetrurian tyrant Mezentius, Virgil, Aeneid, 8, records the like: Mortua corporibus jungebat corpora vivis, Componens manibúsque manus at que oribus ora, (Tormenti genus) et sanie tabóque fluentes, Complexu in misero, longâ sic morte necabat. But I return from this digression. The heathen say (as St. Augustine relates) that ‘our souls united to our bodies are like the living coupled with the dead.’ ‘They saw somewhat,’ says he, and commends their wisdom in discerning the miseries of mankind to be for somewhat before committed, and in acknowledging the power and justice of God; though without divine revelation they could not know that it was Adam’s offence which brought such a wrack both on our souls and on our bodies. What has been hitherto related seems too much to incline to the natural, physical, immediate working of the soul upon the body. Others are as faulty, who say, ‘The soul receives no annoyance from the body, but by way of impedition [being impeded] only, where the spiritual faculties are hindered and the music spilt, by reason of the untuneableness of the organs. But they will not seem to hear that ‘a spiritual substance can receive infection from a nature corporeal.’ Both opinions may rest contented in the middesse or mean, that as the body cannot go beyond the sphere of its activity, and work properly and physically upon the soul: so by the interposition, as it were, of a middle nature, the body not only hinders the faculties of the soul from working, but sometimes works upon the soul. Thus the natural, vital and animal spirits do bind and unite the soul to the body, that neither part can part from other, though it would. Thus bodily objects work on the mind, but it is by the mediation of the outward and inward senses. Shall corporeal, outward, and remote objects, by degrees, draw the soul into sin, even in our perfect age, when our natural reason is most vigorous; and may not the corrupted seed, having as great a propension to evil as Naphtha to take fire, at the conjunction, infect the soul with a participation of uncleanness, though the operation be not physical, or immediate? By Adam’s soul sinning was Adam’s flesh infected; may not our soul be infected as well by our flesh? A spiritual substance can produce a bodily effect. Boëtius says excellently: ‘Forms material came from forms immaterial: Our will was moved by our intellect, our appetite by our will, and a bodily change conformable to our appetite.’ And may not a bodily species work by the same degrees, backward, on the soul itself? The reason is alike in the contrariety. Does the corporeal fire of Hell torment and affect the incorporeal spirits of evil angels, and shall it of wicked men (as most certainly it does and must; which shall be proved, God willing, otherwhere) and may not the matter make some impression on the form, the body upon the soul, when there is such a sympathy in nature betwixt them? If the soul do no way suffer from the body, how does it follow the temperature of the body? How does madness, foolishness, anger and love, with other affections, work upon the mind? Yea, how comes it to pass that not only strength and nimbleness of body, but even goodness of wit is propagated (if nature be strong) and children resemble their fathers both in manners and understanding? The flesh itself without the soul, if it be beaten, hurt, or cut, is no way sensible. Reunite the separated soul to the wronged body, the soul feeleth, and is much affected: nor is the grief in the incision only, but in the soul. Yea, in apoplexies and deep sleeps, cast upon men by stupefactive ingredients and compounded by art, while the soul is in the body, wounds have been given unto the earthy part, and it never felt them: when those fits are vanished, the soul feels the pain of the discontinuity and division of the flesh as well as the body. Doctor [John] Rainolds thus, ‘God by nature has ordered that the soul naturally united to the body should suffer with the body and be grieved, the body being afflicted, and rejoice, it being refreshed, and be sorrowfull, the body being killed; so that some way it suffers by reason of the body.’ Permit me but the use of his modification some way and I dare say the body draws the soul its way, some way to sin. Aquinas on Rom. 5, lect. 3: ‘It should not seem that sin, which is an accident of the soul, can be produced by the original of the flesh: It is answered (says he) with reason. Though the soul be not in the seed, yet there is in the seed a virtue disposing the body to receive the soul, which soul being poured or infused into the body, is after a sort conformable to the body, because every thing received is in the receiver according to the capacity of the receiver.’ To him let me add: if a new created soul should be put into a body not descending from Adam, it should not have original sin; but meeting with a body disposed to corruption, after its kind it yields and contracts original sin.

6. Yea, but the act of Adam’s sin passed quickly away, and the guiltines was forgiven [for him]; how could it infect us? I answer, ‘The person did first infect the nature, afterwards the nature did infect the person.’… And the manner how the soul is made sinful is described at large before, to wit, that by the union it is infected, and so soon as it is infused, it tastes of corruption… so does a just man beget an unjust, Christianus non Christianum, ‘A Christian an unchristian’; the circumcised Hebrews beget children uncircumcised: for the generation is natural and not spiritual… just Lot who begat wicked daughters, or David who had Absalom, or Abraham, who had Ismael, or Isaac who had Esau; or Noah, who had Ham… For man begets man like to himself, as he is species hominis [the species of a man], not as he is individuum [an individual]: and accidents belonging to the individual person of the Father pass not over to the child, but those things that pertain to the specifical nature. Therefore what belongs to man, as he is individuum, he does not propagate.</p></blockquote>

t+come+from+him+it+is+enough.%E2%80%99+For+a+father+does+not+per+se+produce+original+sin+in+the+child%2C+but+per+accidens%3B+namely%2C+as+by+the+act+of+generation+it+comes+to+pass%2C+that+his+son+is+a+member+of+mankind%2C+which+was+overtaken+in+Adam%E2%80%99s+corruption%2C+and+that+the+propension+unto+evil+of+the+earthly+part+traducted%2C+meeting+with+a+soul+not+much+resisting%2C+causes+this+original+sin+to+result+thencefrom%2C+and+death+by+this+original+sin.+So+that+no+sooner+is+the+soul+united+to+its+body%2C+and+the+matter+glued+to+the+form%2C+but+the+infant+deserves+to+be%2C+and+is+the+child+of+death%2C+by+reason+of+the+primigeneal+corruption.+If+you+inquire+after+what+manner+the+body+works+the+soul+unto+this+evil%2C+we+may+truly+say%2C+%E2%80%98The+body+works+not+upon+the+soul+by+a+natural+and+immediate+action.%E2%80%99+You+heard+what+Hugo+Eterianus+said%2C+%E2%80%98It+is+stricken+or+cast+down+only+by+fellowship.%E2%80%99+He+enlarges+himself+in+the+same+chapter%2C+thus%3A+%E2%80%98Imperfection%2C+languishing%2C+and+corruption+abide+in+the+flesh+before+the+soul%E2%80%99s+conjunction%3B+from+which+disease+the+soul+is+infected%3A+as+if+a+vessel+be+tainted+with+an+ill+odour%2C+it+infects+therewith+whatsoever+liquor+it+receives.%E2%80%99+Gerson+thus%2C+%E2%80%98The+soul+by+the+conjunction+with+the+body+contracts+that+infection%3B+as+when+one+falls+into+the+mire%2C+he+is+besmeared+and+stained.%E2%80%99+Felisius+thus%3A+%E2%80%98A+clean+apple+put+in+an+unclean+hand+is+soiled.+Good+wine+poured+into+a+fustie+vessel+contracts+a+strange+taste%2C+and+loses+its+own+natural%3A+so+the+soul+loses+its+naturall+vigor%2C+when+it+is+united+in+the+flesh.%E2%80%99+Another+thus%2C+%E2%80%98Anima+cum+labente+simul+labitur%2C+et+frustra+nititur+dum+innititur.%E2%80%99+To+the+same+effect+another+says+thus%3A+%E2%80%98As+the+purest+rain-water+falling+on+dust%2C+is+turned+with+the+dust+into+a+lump+of+mire%3A+so+at+the+coadunation+of+the+soul+unto+the+earthly+part%2C+both+spirit+and+flesh+are+plunged+in+the+durt+of+corruption.%E2%80%99+Augustine%2C+against+Julian+the+Pelagian%2C+prefers+the+very+heathen+before+Julian%3B+for+he+held+that+%E2%80%98nothing+was+conveyed+unto+us+from+Adam%3B%E2%80%99+and+they+held%2C+%E2%80%98That+we+were+born+to+be+punished+for+old+crimes+committed+in+a+former+life.%E2%80%99+%E2%80%98And%2C%E2%80%99+says+Augustine%2C+%E2%80%98it+is+true+which+Aristotle+relates%2C+that+we+are+punished+like+to+those+who+fell+among+the+Hetrurian+robbers%2C+whose+living+bodies+being+coupled+face+to+face+with+dead+men%E2%80%99s+carcasses%2C+were+so+killed.%E2%80%99+Of+the+Hetrurian+tyrant+Mezentius%2C+Virgil%2C+Aeneid%2C+8%2C+records+the+like%3A+Mortua+corporibus+jungebat+corpora+vivis%2C+Componens+manib%C3%BAsque+manus+at+que+oribus+ora%2C+%28Tormenti+genus%29+et+sanie+tab%C3%B3que+fluentes%2C+Complexu+in+misero%2C+long%C3%A2+sic+morte+necabat.+But+I+return+from+this+digression.+The+heathen+say+%28as+St.+Augustine+relates%29+that+%E2%80%98our+souls+united+to+our+bodies+are+like+the+living+coupled+with+the+dead.%E2%80%99+%E2%80%98They+saw+somewhat%2C%E2%80%99+says+he%2C+and+commends+their+wisdom+in+discerning+the+miseries+of+mankind+to+be+for+somewhat+before+committed%2C+and+in+acknowledging+the+power+and+justice+of+God%3B+though+without+divine+revelation+they+could+not+know+that+it+was+Adam%E2%80%99s+offence+which+brought+such+a+wrack+both+on+our+souls+and+on+our+bodies.+What+has+been+hitherto+related+seems+too+much+to+incline+to+the+natural%2C+physical%2C+immediate+working+of+the+soul+upon+the+body.+Others+are+as+faulty%2C+who+say%2C+%E2%80%98The+soul+receives+no+annoyance+from+the+body%2C+but+by+way+of+impedition+%5Bbeing+impeded%5D+only%2C+where+the+spiritual+faculties+are+hindered+and+the+music+spilt%2C+by+reason+of+the+untuneableness+of+the+organs.+But+they+will+not+seem+to+hear+that+%E2%80%98a+spiritual+substance+can+receive+infection+from+a+nature+corporeal.%E2%80%99+Both+opinions+may+rest+contented+in+the+middesse+or+mean%2C+that+as+the+body+cannot+go+beyond+the+sphere+of+its+activity%2C+and+work+properly+and+physically+upon+the+soul%3A+so+by+the+interposition%2C+as+it+were%2C+of+a+middle+nature%2C+the+body+not+only+hinders+the+faculties+of+the+soul+from+working%2C+but+sometimes+works+upon+the+soul.+Thus+the+natural%2C+vital+and+animal+spirits+do+bind+and+unite+the+soul+to+the+body%2C+that+neither+part+can+part+from+other%2C+though+it+would.+Thus+bodily+objects+work+on+the+mind%2C+but+it+is+by+the+mediation+of+the+outward+and+inward+senses.+Shall+corporeal%2C+outward%2C+and+remote+objects%2C+by+degrees%2C+draw+the+soul+into+sin%2C+even+in+our+perfect+age%2C+when+our+natural+reason+is+most+vigorous%3B+and+may+not+the+corrupted+seed%2C+having+as+great+a+propension+to+evil+as+Naphtha+to+take+fire%2C+at+the+conjunction%2C+infect+the+soul+with+a+participation+of+uncleanness%2C+though+the+operation+be+not+physical%2C+or+immediate%3F+By+Adam%E2%80%99s+soul+sinning+was+Adam%E2%80%99s+flesh+infected%3B+may+not+our+soul+be+infected+as+well+by+our+flesh%3F+A+spiritual+substance+can+produce+a+bodily+effect.+Bo%C3%ABtius+says+excellently%3A+%E2%80%98Forms+material+came+from+forms+immaterial%3A+Our+will+was+moved+by+our+intellect%2C+our+appetite+by+our+will%2C+and+a+bodily+change+conformable+to+our+appetite.%E2%80%99+And+may+not+a+bodily+species+work+by+the+same+degrees%2C+backward%2C+on+the+soul+itself%3F+The+reason+is+alike+in+the+contrariety.+Does+the+corporeal+fire+of+Hell+torment+and+affect+the+incorporeal+spirits+of+evil+angels%2C+and+shall+it+of+wicked+men+%28as+most+certainly+it+does+and+must%3B+which+shall+be+proved%2C+God+willing%2C+otherwhere%29+and+may+not+the+matter+make+some+impression+on+the+form%2C+the+body+upon+the+soul%2C+when+there+is+such+a+sympathy+in+nature+betwixt+them%3F+If+the+soul+do+no+way+suffer+from+the+body%2C+how+does+it+follow+the+temperature+of+the+body%3F+How+does+madness%2C+foolishness%2C+anger+and+love%2C+with+other+affections%2C+work+upon+the+mind%3F+Yea%2C+how+comes+it+to+pass+that+not+only+strength+and+nimbleness+of+body%2C+but+even+goodness+of+wit+is+propagated+%28if+nature+be+strong%29+and+children+resemble+their+fathers+both+in+manners+and+understanding%3F+The+flesh+itself+without+the+soul%2C+if+it+be+beaten%2C+hurt%2C+or+cut%2C+is+no+way+sensible.+Reunite+the+separated+soul+to+the+wronged+body%2C+the+soul+feeleth%2C+and+is+much+affected%3A+nor+is+the+grief+in+the+incision+only%2C+but+in+the+soul.+Yea%2C+in+apoplexies+and+deep+sleeps%2C+cast+upon+men+by+stupefactive+ingredients+and+compounded+by+art%2C+while+the+soul+is+in+the+body%2C+wounds+have+been+given+unto+the+earthy+part%2C+and+it+never+felt+them%3A+when+those+fits+are+vanished%2C+the+soul+feels+the+pain+of+the+discontinuity+and+division+of+the+flesh+as+well+as+the+body.+Doctor+%5BJohn%5D+Rainolds+thus%2C+%E2%80%98God+by+nature+has+ordered+that+the+soul+naturally+united+to+the+body+should+suffer+with+the+body+and+be+grieved%2C+the+body+being+afflicted%2C+and+rejoice%2C+it+being+refreshed%2C+and+be+sorrowfull%2C+the+body+being+killed%3B+so+that+some+way+it+suffers+by+reason+of+the+body.%E2%80%99+Permit+me+but+the+use+of+his+modification+some+way+and+I+dare+say+the+body+draws+the+soul+its+way%2C+some+way+to+sin.+Aquinas+on+Rom.+5%2C+lect.+3%3A+%E2%80%98It+should+not+seem+that+sin%2C+which+is+an+accident+of+the+soul%2C+can+be+produced+by+the+original+of+the+flesh%3A+It+is+answered+%28says+he%29+with+reason.+Though+the+soul+be+not+in+the+seed%2C+yet+there+is+in+the+seed+a+virtue+disposing+the+body+to+receive+the+soul%2C+which+soul+being+poured+or+infused+into+the+body%2C+is+after+a+sort+conformable+to+the+body%2C+because+every+thing+received+is+in+the+receiver+according+to+the+capacity+of+the+receiver.%E2%80%99+To+him+let+me+add%3A+if+a+new+created+soul+should+be+put+into+a+body+not+descending+from+Adam%2C+it+should+not+have+original+sin%3B+but+meeting+with+a+body+disposed+to+corruption%2C+after+its+kind+it+yields+and+contracts+original+sin.%0A%0A6.+Yea%2C+but+the+act+of+Adam%E2%80%99s+sin+passed+quickly+away%2C+and+the+guiltines+was+forgiven+%5Bfor+him%5D%3B+how+could+it+infect+us%3F+I+answer%2C+%E2%80%98The+person+did+first+infect+the+nature%2C+afterwards+the+nature+did+infect+the+person.%E2%80%99%E2%80%A6+And+the+manner+how+the+soul+is+made+sinful+is+described+at+large+before%2C+to+wit%2C+that+by+the+union+it+is+infected%2C+and+so+soon+as+it+is+infused%2C+it+tastes+of+corruption%E2%80%A6+so+does+a+just+man+beget+an+unjust%2C+Christianus+non+Christianum%2C+%E2%80%98A+Christian+an+unchristian%E2%80%99%3B+the+circumcised+Hebrews+beget+children+uncircumcised%3A+for+the+generation+is+natural+and+not+spiritual%E2%80%A6+just+Lot+who+begat+wicked+daughters%2C+or+David+who+had+Absalom%2C+or+Abraham%2C+who+had+Ismael%2C+or+Isaac+who+had+Esau%3B+or+Noah%2C+who+had+Ham%E2%80%A6+For+man+begets+man+like+to+himself%2C+as+he+is+species+hominis+%5Bthe+species+of+a+man%5D%2C+not+as+he+is+individuum+%5Ban+individual%5D%3A+and+accidents+belonging+to+the+individual+person+of+the+Father+pass+not+over+to+the+child%2C+but+those+things+that+pertain+to+the+specifical+nature.+Therefore+what+belongs+to+man%2C+as+he+is+individuum%2C+he+does+not+propagate.%E2%80%9D%0A%0A%E2%80%94+Edward+Kellet%2C+Miscellanies+of+Divinity%2C+divided+into+Three+Books%2C+%E2%80%A6+%28Cambridge%2C+1635%29%2C+bk.+1%2C+ch.+6+Kellet+%281583-1641%29+was+a+doctor+of+divinity+and+a+calvinistic%2C+Anglican%2C+canon+in+the+cathedral+church+at+Exeter.+%7C+section+5%2C+pp.+103-6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F76363c3521.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/76363c3521.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=5.%20It%20is%20now%20supposed%2C%20and,is%20individuum%2C%20he%20does%20not%20propagate&amp;text=5.%20It%20is%20now%20supposed%2C%20and%20shall%20%28if&amp;text=as%20he%20is%20individuum%2C%20he%20does%20not%20propaga <blockquote><p>Assertion 4. There may be some cases in which it is expedient to admit an accuser, and not to admit a process without one. As suppose one were under no ill report and yet some gross scandal were imputed to him, which were not of such fame, or had not such presumptions as to give ground for a Church-judicatory immediately to interpose, and the scandal being of such a nature as the trial thereof could neither be omitted, nor closed in private; in that case, suppose one should complain of the Church’s negligence in the same, asserting the evidences to be clear, and offering to make them out; In such a case, I say, the Church can hardly refuse to hear him, lest they be thought partial; nor is there ground, nor is it fit for them immediately to pursue it: Therefore an accuser is expedient, that so, upon the one side, the Church’s impartiality may be vindicated in refusing the complaint of no sober man, nor the uttermost of any trial, that in well grounded reason they may expect; And, on the other side, that the mouths of some needless and too importunate complainers may be stopped, and they themselves found censurable, if either without cause they traduce the Church-officers as negligent and partial, while there is access to make out before them such a truth if it be truth; or if precipitantly and inconsiderately (if not maliciously) they have tabled a scandal against another as a public scandal which they cannot make out, and so have needlessly troubled a Church-judicatory in such a matter and sinfully wronged their neighbor. For, a process in such cases where it cannot be made out, is scandalous: therefore if a person rest not satisfied so as to abstain till he have trial put to the utmost, he is to be dealt with as a scandalous person, lest men take liberty, under the pretext of pursuing offences, to defame others and abuse the ordinance of Christ. And though it be just in such a case, that he be materially dealt with as unjust accusers use to be in civil courts, yet this does not only flow from the consideration of such a persons being a formal accuser, but from the nature of the deed which is scandalous in such a measure, and that publicly, and therefore is to be restrained, whether the person take on him that formal consideration or not, lest yet, upon the matter, he continue publicly and importunately to press the pursuit. And we conceive, the imposing the title of accuser in such a case, or the making of it necessary, that one take on him that formal notion, is rather for conveniency to restrain men’s inordinateness and stop their mouths, and to add weight to the matter of the sentence if they fail, than as being simply necessary for making such a person to be accounted scandalous, if he come short.</p></blockquote>

ith as unjust accusers use to be in civil courts, yet this does not only flow from the consideration of such a persons being a formal accuser, but from the nature of the deed which is scandalous in such a measure, and that publicly, and therefore is to be restrained, whether the person take on him that formal consideration or not, lest yet, upon the matter, he continue publicly and importunately to press the pursuit. And we conceive, the imposing the title of accuser in such a case, or the making of it necessary, that one take on him that formal notion, is rather for conveniency to restrain men’s inordinateness and stop their mouths, and to add weight to the matter of the sentence if they fail, than as being simply necessary for making such a person to be accounted scandalous, if he come short.”

<blockquote><p>In the second place, let us refer to the right inherent in the Church of Christ to propagate the Gospel, and make disciples in every country and nation under heaven. This right, claimed by the Church, and belonging to her in consequence of the duty enjoined by her Head, is a right of such a nature, that it cannot properly consist with the neutrality of the civil magistrate, or be recognised by any state constituted on the principle that it has nothing to do with religion.

The full and free and unrestricted power to take possession of this world in the name of Christ, to the exclusion of any other form of faith and worship, is what Christianity demands: with less than this it cannot be satisfied. And yet it may well be doubted whether it be consistent with the principle and practice of absolute neutrality on the part of the state to concede this demand, or whether a toleration for the truth, founded on the theory of entire impartiality and indifference as regards truth and falsehood, is sufficient to protect the Church of Christ in its exclusive claims.

The Gospel of Christ is not, like the systems of polytheism among which it was introduced at first, compatible with every other system of falsehood. It is exclusive in its character and pretensions; and demands that it be received and owned and submitted to, to the abandonment and rejection of every other faith. Christ Himself tells us that He came to send on the earth, “not peace, but a sword,” not ease, but “a burning fire;” and, like a sword, His Gospel divides asunder the outward and formal union of human society, and, like a fire, it kindles strife and division in the world.

There is so much in the Gospel fitted to awaken the hostility of the human heart, and standing in direct opposition to the principles and practices of the world, that it cannot but act as a firebrand wherever it enters. To introduce and propagate it, therefore, in any community, tends not indirectly to excite the rage and outrage and violence of men. More than this: its first principle and first duty is that of aggression.

The ministers of the Gospel claim it as a right to go into every nation, however fenced around and guarded from intrusion, and to demand an entrance in the name of Him who sent them, even although the magistrate should bid them depart from his coasts. Further still, the messengers of the Cross arrogate to themselves the title to enter into every human dwelling where a sinner is to be found,-seeking admittance in the name of the Saviour of sinners, that they may negotiate with the inhabitant in behalf of their Master, however sternly the door may be closed against them by jealousy of their errand, or hatred to their cause.

It has been the eloquent boast of freedom in our country, that every man’s house is his castle; and that, be it but a strawbuilt shed, open to every breath of heaven, yet fenced about by the protection and the sanction of law, there even “the king cannot and dare not enter.” But where the king cannot enter, there the missionary of Christ claims to be admitted; and, with a higher warrant in his hand than that of human law, bids the gates be lifted up, that with the Gospel he may enter in. And can claims and pretensions so essentially exclusive and aggressive, which belong from its very nature to Christianity, be owned and conceded by a state constituted on the principle of entire and equal indifference to truth and falsehood?

Is it, in the nature of things, possible, in regard to such demands, to profess or carry out the theory of neutrality in civil legislation, granting a licence free and full to Christianity, intolerant as it is of every other religion? Ask the Roman magistrate within whose jurisdiction the Gospel was at first preached, or the magistrate of any country not Christian within whose rule Christianity is introduced at the present day. For the first three hundred years of its existence the religion of Christ was in almost perpetual collision with the state, just on the ground that it was essentially a missionary and an exclusive religion, that it would not, and could not, exist in peace alongside of any other faith, that its temples must stand alone, and its Deity find no place in the Pantheon. Nor has the essential character of Christianity altered since the days of Nero and Diocletian.

Upon the principle of complete indifference to truth and to falsehood, it were difficult to argue or assert that any government could or ought to protect, or give place by civil permission to, a religion framed upon a principle so intolerant, and proceeding in a manner so aggressive. With no other right to toleration than the right which falsehood equally has, it were a matter of question whether the preaching of the truth as it is in Jesus, and the full claims of an exclusive kind which it makes, ought to be granted by any state.

At all events, waiving the question of right, we know that, in the history of the world, it has been found impossible in point of fact for any state not Christian to grant them; and that, in the person of a magistrate not a friend to the Gospel, we have, from the very necessity of the case, to deal with an enemy and a persecutor, whether that magistrate be a philosopher, like Pliny, or “the father of his people,” like Marcus Antoninus.</p></blockquote>

<blockquote><p>While the young of no class are to be overlooked, while we must ever contend for a thorough scriptural education as of vital importance, Christian parents and the Church unitedly must double their diligence, and employ all scriptural means to instil right principles into the minds of the youth of the Church, and to excite them to holy activity and devotedness.</p></blockquote>

<blockquote><p>5th Consideration. The essential ingredients and reasons of a lawful divorce [from Romanism] are here:

1. We could not lie in one bed with that sometime sister Church of Rome, but our skin behoved to rub upon her botch-boil, and therfore we did separate from nothing but corruption.

2. There was there persecutions, and in that we are patients and ejected rather then departers on foot and horse.

3. A professed dominion over our consciences.

4. Necessity of receiving the mark of the beast, and so the plagues of the beast, to worship images, and the work of men’s hands, a necessity of professing fundamental errors that subvert the foundation of faith, did all necessitate our seperation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London: Bartlet, 1642), ch. 10, ‘Whether or not it be lawful to separate from a true Church visible, for the corruption of teachers… where faith is begotten by the preaching of professed truth?’, p. 123</span></figcaption>

<blockquote><p>22. The heretic is not to be confused with the schismatic: nor is every schismatic to be counted among the number of heretics. For although heretics often become schismatics, and conversely schismatics often become heretics, nevertheless the heretic and the schismatic differ. For first, heretics, corrupting the sincerity of faith with false doctrines, do not always separate themselves from the Church: but schismatics, sometimes even retaining the purity of faith without the stain of heresy, break the bond of brotherly society out of ambition for honor or some function in which they do not want another to be preferred over them, or out of hatred and impatience of divine order and ecclesiastical discipline, or under the pretext of scandals which are committed everywhere.

23. Heretics properly strike against the truth of the doctrines of faith, as heretics: but schismatics against charity, as schismatics:

24. Those who at the same time stumble in the truth of faith and charity, and obstinately defending the error of faith separate themselves from the Church of God, they are at the same time heretics and schismatics.

25. Very often it happens in practice that some orthodox individuals think differently from others, without strife or schism: as Jerome and Augustine.

26. Schismatics either separate themselves entirely from the Church, or in part also from this or that Church in the name of particular offenses.</p></blockquote>

<blockquote><p>4. They, who truly fear the name of God [and refuse the ceremonies], are indeed scandalized by the prelates, their depriving of ministers for refusing to conform: but by the ministers, their suffering of deprivation for this cause, they are not scandalized, but edified. But fiftly saith Mr. [John] Sprint, it offends the magistrate, by provoking him (persuaded and resolved as he is [as to the lawfulness of the ceremonies]) to disgrace these otherwise well deserving ministers, and to strike them with the sword of authority. Answer: Our refusal to conform to inconvenient ceremonies, being a necessary duty, if the magistrate be provoked therewith, we are blameless: neither can it any otherwise provoke him to disgrace those well deserving ministers than Moses his seeking of liberty for Israel to go and serve God according to his will provoked Pharaoh the more to oppress them, or than Christ’s preaching of the truth and his abstaining from the superstitious ceremonies of the Pharisees provoked them to disgrace Him and plot his hurt. Howbeit we are not ignorant that the magistrate is not provoked by our refusing to conform, except as it is misreported, misdeemed, and misconstructed to him by the false calumnies of our adversaries: which being so, he is not incited by our deed, but by theirs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 1, p. 7</span></figcaption>

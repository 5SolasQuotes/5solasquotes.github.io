<main class="wrap"><figure class="quote" id="q-445d4bb9b7" data-kw="">
<blockquote><p>As for such who not only withdraw from this Church [of Scotland] but also have disowned the [Scottish] civil government always since this late happy [Glorious] Revolution [of 1689], and yet take the name of presbyterians to themselves [such as the United Societies and later Reformed Presbyterians], it is to be feared some of them may be under some bad Influence of Jacobites [those loyal to the previous king, James II and the House of the Stuarts], or else to be so weak as not to discern the absurdity of such a practice: And it is more remarkable that since King William came to the throne, these people have neither had minister nor preacher under the name of a presbyterian to countenance them in their sinful courses. And, in the year 1688 and 1689 we were so far from giving any countenance to such courses that we encouraged the publishing the Prince of Orange’s Declaration at Glasgow before it was published in any other place of the kingdom; we prayed publicly for success to his enterprise even before his landing in England; we swore (in the National Covenant renewed at Lesmahagow, March 3, 1689) that we would stand to the defense of his Highness, his person and authority when lawfully chosen and established as king or supreme magistrate over us. The people we preached to, in consequence of this, went to Edinburgh with others and guarded the Convention of Estates, anno 1689, and mustered in one day 1,140 men as a regiment under the command of the right honorable, the late Earl of Angus, to fight for religion and liberty under the authority of King William of glorious memory. All which make it evident that our former testimony against tyranny was from no disloyal principle to magistracy; and consequently that these people never had any encouragement to live as they do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-lining.html">Thomas Lining</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Epistle to the Reader’</cite>, p. vii in Alexander Shields, An Enquiry into Church-Communion, or a Treatise against Separation from the Revolution Settlement of this National Church, as it was Settled anno 1689 &amp; 1690… 2nd ed. (1706; Edinburgh: William Gray, 1747) Lining was one of the last three Cameronian ministers, all of whom joined the 1690 Church of Scotland.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-41b1fa392b" data-kw="">
<blockquote><p>I lay down this maxim of divinity: Tyranny being a work of Satan, is not from God, because sin, either habitual or actual, is not from God: the power that is, must be from God; the magistrate, as magistrate, is good in nature of office, and the intrinsic end of his office (Rom. 13:4), ‘for he is the minister of God for thy good;’ and, therefore, a power ethical, politic, or moral, to oppress, is not from God, and is not a power, but a licentious deviation of a power; and is no more from God, but from sinful nature and the old serpent, than a license to sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1644; Edinburgh: Ogle, 1843) | question 9, p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-d27615bfc7" data-kw="">
<blockquote><p>And hereunto divines and casuists give their concurrence; among them one that is resolute both for monarchy and lineal succession [of royalty], thus expresses his judgment, both for seeking of right and justice from a usurper (whom he calls a tyrant, in regard of an unjust title, not in respect of tyranical oppression [only]) and for obeying his commands. First, that subjects may lawfully seek justice of him…¹ ¹ ‘Dicendum est, licite subditos ab eo (qui•y rannus jure et titulo est) jus petere, quia quamvis jus et titulum non habeat, respublica tamen tacite consemit in hoc ut civibus ipsi tyranno, facto, non jure subditis, jus dicat, ac si esset competens judex et legitimus superior’… Juan Azor, Moral Institutions [d. 1603; Hierat, 1608], pt. 2, bk. 11, ch. 5 [col. 1675]. ‘Non peceat subditus tyranni, qui dominium et jurisdictionem alicujus di•ionis usurpavit, petendo ab eo justitiae administrationem, etc. Si quidem dat operem ut qui pe••at jurisdictionem usurpando, non peccet etiam justitiae administrationem praetermittendo;’ Martin de Azpilcueta Navarro, Manual de Confessores [c. 1557], ch. 1•, n. 41.</p></blockquote>

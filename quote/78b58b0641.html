<main class="wrap"><figure class="quote" id="q-78b58b0641" data-kw="person hypostasis">
<blockquote><p>Hence it is evident what must be understood by the word “person.” That which among the Greeks is called “hypostasis” is with the Latins called persona.… properly and strictly, it denotes an intellectual suppositum.</p></blockquote>

</figure><figure class="quote" id="q-74c3572d0d" data-kw="unity three persons">
<blockquote><p>While he proclaims his unity, he distinctly sets it before us as existing in three persons. These we must hold, unless the bare and empty name of Deity merely is to flutter in our brain without any genuine knowledge. Moreover, lest any one should dream of a threefold God, or think that the simple essence is divided by the three Persons, we must here seek a brief and easy definition which may effectually guard us from error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.2</span></figcaption>

<blockquote><p>In the one only and most simple essence of God there are three distinct persons so distinguished from each other by incommunicable properties or modes of subsisting that one cannot be the other—although by an inexpressible circum-insession (emperichōrēsin) they always remain and exist in each other mutually.</p></blockquote>

</figure><figure class="quote" id="q-2c3189cb1c" data-kw="person subsistence Sabellians">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Trinity</cite>, Thesis XI</span></figcaption>

</figure><figure class="quote" id="q-c01b0d097a" data-kw="">
<blockquote><p>Tis said [for conforming in church to what is less good:] ‘What we may do sometimes, we may and ought to do always.’ But we have hundreds of instances that we would be loth to do that always which we might do and have done sometimes. We have often eat bad and unwholesome meat, dwelt in inconvenient and bad houses, etc. but are we bound to do so always? So some have been forced and been glad to use such helps for their souls as they could get, but are they bound to use them always? If we have better means and helps, should we not use them rather? Reason speaks it, and Scripture also, and gives us some examples which look that way. St. Paul circumcised Timothy, but opposed it in others, and would not let Titus be circumcised. He also, to satisfy the believing Jews that were too zealous for the Law, and misinformed of him, took men, shaved his head, purified himself with them, entered into the Temple, etc. This he did once, but would he have done so always?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-tallents.html">Francis Tallents</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short History of Schism: for the Promoting of Christian Moderation &amp; the Communion of Saints</cite>, (London: Parkhurst, 1705), p. 110 Tallents (1619–1708) was a non-conforming English presbyterian minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>2. The second assembly is a classis [presbytery] of many pastors and elders from sundry congregations who have power of excommunication, (1) in respect [case] that the person excommunicated does keep company with many consociated [associated] churches and so as a leaven may infect many (1 Cor. 5:4; Matt 26:59; John 11:47; Acts 20:17,18); (2) and for this cause, one pastor of a single congregation, is not able to ordain a pastor (because it wants example in the Word of God). Therefore a college of presbyters, or a presbytery of pastors and elders, who have power larger than a session, even to excommunicate and ordain pastors, is necessary in the church, which ordains Timothy to be a pastor, and so may deprive and excommunicate him (1 Tim. 4:14, Acts 20:17,18,28,29). … In church censures we proceed thus: In private faults if a brother offend a brother, he is admonished alone by the offended. If that gain him not, he is admonished before two or three; if that prevail not, the matter is brought before the church, which has power of the keys; if he obey not the church, he is excommunicated (Matt 18:15-20). … 3. Our third censure is the greater excommunication, which is done by the whole congregation, as all other censures, but in diverse ways: (1) by the presbytery or eldership judicially and authoritatively, (2) by Paul his pastoral spirit (1 Cor. 5:4), the minister in the church’s name pronouncing the sentence (1 Tim. 1:20), (3) and by the people…</p></blockquote>

<blockquote><p>Sir Robert Hamilton remained the central figure in the United Societies until his death in 1701, even though there is no record that he was ever ordained to any office. The Societies then remained without a designated leader, or any ministerial oversight, until 1706 when John Macmillan, a deposed minister from the Church of Scotland, was called as their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/justin-stodghill.html">Justin Stodghill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Alexander Shields’ Response to Sir Robert Hamilton in 1690” Scottish Reformation Society Historical Journal 7</cite>, (2017), pp. 73-103</span></figcaption>

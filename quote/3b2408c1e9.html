</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8b86543bca" data-kw="">
<blockquote><p>Observation 4. Our Savior does not command his disciples to separate from commmunion with the Pharisees, and oblige them not hear their doctrine; but only to beware of the errors that they mix with their doctrine. We may, and ought to hold communion with a Church, though erroneous in doctrine, if not fundamentally erroneous. Separation from a Church is not justifiable upon any other ground than that which makes a separation betwixt God and that Church: Which is either the apostasy of that Church into gross idolatry; or in point of doctrine, into damnable heresy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-burkitt.html">William Burkitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Notes with Practical Observations on the Four Holy Evangelists</cite>, … (London, 1700), On Mt. 16</span></figcaption>

</figure><figure class="quote" id="q-f3cf654479" data-kw="">
<blockquote><p>The ignorance of fundamentals condemns, which is to be understood [in] two ways:

1. The ignorance of fundamentals such as are supernatural fundamentals, condemns all within the visible church as a sin, but it does not formally condemn those who are [outside] the visible church (John 15:22). It only makes those who are without the church incurable, but does not formally condemn them, as medicine not known, and so not refused, makes sick men incurable, as a loss, but does not kill them as a sin.

2. Superstructures, which by consequence arise from fundamentals, are fundamental by consequence, and secondarily, as the second rank of stones that are immediately laid upon the foundation, are a foundation in respect of the higher parts of the wall, and therefore are materially fundamental. And the ignorance of these virtually condemns, and the denying of such, by consequence, is a denying of the foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, The Due Right of Presbyteries, … (1644), pt. 2, ch. 4, section 5, p. 221 ff. | 2 Distinctions about Ignorance of Fundamentals</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

nying%20of%20the%20foundation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2c8bcddfb8" data-kw="">
<blockquote><p>Those articles of religion wherein the divines of both sides [of the reformed and Lutherans] do fully agree are abundantly sufficient, both for a Christian man’s salvation and likewise for the establishing of a firm and lasting peace in the Churches of God. As for the rest… they are such as may perhaps not unfitly be sent to the divinity-schools, there to be thoroughly discussed: but by no means ought they to disquiet the peace either of any Christian soul or of God’s holy Church… our good and gracious Savior passed over with silence and toleration great and grievous errors in comparison of these… and that too even in such as were of his own household and retinue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Opinions of Certain Reverend &amp; Learned Divines concerning the Fundamental Points of the True Protestant Religion, &amp; the Right Government of Reformed Churches</cite>, ([Oxford] Downes, 1643), “Opinion of Joseph Hall,”, pp. 1–2</span></figcaption>

<blockquote><p>…union has the advantage over division, because: It is a commanded mean tending to edification, which division is not.

2. Division has no less nor fewer inconveniencies following it, nor [is] less destructive to the Church than union in the case supposed; yea, schism is one of the greatest hurts that can come to an orthodox Church, it being next to heresy in doctrine; and therefore no particular evil can be laid in the balance with it.

3. The ills of division are most inevitable, for the ills that follow union, through God’s blessing, may be prevented; it is not impossible, but in the way of division it is, because itself is out of God’s way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, … (Edinburgh: Higgins, 1659) | pt. 4, ch. 7; p. 323</span></figcaption>

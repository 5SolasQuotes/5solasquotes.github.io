<blockquote><p>As for an instance (which has been too frequent in all this isle all these years past, saving the pleasure of God), every burgh-royal has their own times of public mercats [markets] allowed unto them by the law, and the king’s privilege; but when the plague happened in any of these towns, did not he, by proclamation, discharge the holding of the mercat at that time for fear of infection, and yet thereby did no prejudice to their privileges…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/king-james-i.html">King James I</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Declaration of the Just Causes of His Majestie’s Proceedings…’ in David Calderwood, History of the Kirk of Scotland 6.426</cite></span></figcaption>

</figure><figure class="quote" id="q-c60c8c8879" data-kw="">
<blockquote><p>Then the true state of the question is not [1.] whether the sword be a means of conversion of men to the true faith [which its not], nor 2. whether heathen by fire and sword are to be compelled to embrace the truth [they’re not], nor 3. whether violence without instruction and arguing from light of scriptures, should be used against false teachers [its not], nor 4. whether the Magistrate can punish the opinions of the mind, and strain internal liberty [it can’t]. But whether or not ought the godly and Christian prince [to] restrain and punish with the sword false teachers, publishers of heretical and pernicious doctrines, which may be proved by witness, and tends to the injuring of the souls of the people of God, in a Christian society, and are dishonorable to God, and contrary to sound doctrine; and so coerce men for external misdemeanors flowing from a practical conscience sinning against the second table, as well as from a speculative conscience (to borrow these terms here) when they profess and are ready to swear they perform these externals merely from and for conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience... (London, 1649)</cite>, pp. 57-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-76a8711059" data-kw="">
<blockquote><p>So when God layeth sin to the charge of the sinner, in punishing it, He is said to lay a burden on the sinner, 2 Kings 9:25. And to remove this burden, is to pardon the sin. 2 Chron. 7:14, “If my people humble themselves, then will I hear from heaven, and will forgive their sin, and will heal their land;” by removing the locusts and the pestilence. See, the pardoning of their sin is exponed [expounded] to be the removing of the locusts and pestilence [2 Chron. 7:13].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying and Drawing Sinners to Himself... (London, 1647)</cite>, p. 37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

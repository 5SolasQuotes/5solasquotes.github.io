<blockquote><p>[T]he best course for nations and states is to ‘kiss the Son’ (Psa. 2:12), and to embrace Christ and his religion; to side with Christ, and to own his cause in the world. His side will prove the stronger side at the last. … True religion in a state is as the main pillar of a house and the post of a tent that upholds all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bruised Reed</cite>, (1630; Edinburgh: Banner of Truth, 2011), p. 106.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2ae1b34237" data-kw="">
<blockquote><p>In like manner is Rahab commended as one that by reason of her faith and works perished not with them which obeyed not, when she had received the spies peaceably. Yet if we look into the story, we shall easily discern a great deal of infirmity in that very work of love and mercy, by which she got the testimony of such a notable faith: for she bewrayed much unbelief in making a lie to preserve the spies in safety… So the angel (as is recorded in the Gospel) rebuked those good and faithful women, for that they sought the living among the dead: yet… He is risen again, as He foretold you that He would: yet herein does your uprightness appear, that you hold out still in the love and profession of Christ, even now, when He is in such disgrace and dislike… Thus we may perceive how favourable the Lord is towards his children that offend not upon set purpose and presumptuously: but through Satan’s instigation or through human frailty… This makes for the confutation of their error: 1. That think they have no calling to come to the sacrament because they see more and greater faults in themselves than they can espie, or then, indeed, there are in many other Christians… They find so much hypocrisy, so much pride, so much vain-glory and self-love… that they… begin to fear that God will in no sort accept of them, if they should come unto the table of his Son… and therefore [these things] should by no means keep them from the holy sacrament… Further, [2.] those that by reason of their infirmities will forgoe that ordinance do greatly dishonor God and lay an hard imputation upon Him, as who should say that He were such an extreme and rigorous Judge as will accept of none but of those that have attained to a great measure of perfection. Besides, [3.]… they have a calling to partake of the sacrament, as appears in this text… all such as prepared their whole hearts (that is, did their best endeauour with a true and sincere heart) to seek the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper</cite>, (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20 | (London, 1610), 4th Sermon, pp. 125-28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-653b7211b4" data-kw="">
<blockquote><p>It is storied of Caius Marius Victorius, who lived about three hundred years after Christ, and to his old age continued a Pagan; but at last being convinced of the Christian verity, he came to Simplicianus, and told him he would be a Christian; but neither he nor the church could believe it, it being so rare an example for any to be converted at his age; but at last seeing it was real, there was a shouting and gladness, and singing of psalms in all churches; the people crying, Caius Marius Victorius. is become a Christian!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Flavel on the Content of Singing Public Praise to God</cite>, vol. 1; vol. 5, ‘Husbandry Spiritualized’, p. 120</span></figcaption>

</figure><figure class="quote" id="q-655d825017" data-kw="">
<blockquote><p>‘Ye shall not do’ (says Moses) ‘after all things, which we do here this day, every man, all that is right in his own eyes.’ [Dt. 12:8]… And the speech of Moses seems to mean the true service of God, which was not yet perfected, neither could be in their travels, as it was after in Canaan, vv. 10-11. Not that they sacrificed after their fancy (says the Geneva notes) but that God would be served more purely in the land of Canaan. Junius upon this place notes: ‘Etsi oblationum lex una semper fuit ab initi• praescripta a Deo, non potuit tamen usque adeo in ambulatoriis Israelitarum castris observari, ant summo jure ab illis exigi, prout ostendit; Antithesis, verse 11; vide Num, 28:6.’ The [Romanist] Douay divines, on the place, give this observation, ‘In the desert they could not observe the ceremonies of the Law, but coming to rest, they were bound to keep all one set form of holy rites.’ The conclusion from this text is that God is pleased to dispense with his people in his own prescribed worship, until, if He has appointed, determined, or appropriated a certain form, time and place, they have opportunity to serve Him at that time, in that place, and after that form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam</cite>, … (London: R.B., 1642), ch. 1, section 4, p. 51</span></figcaption>

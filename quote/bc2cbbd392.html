<main class="wrap"><figure class="quote" id="q-bc2cbbd392" data-kw="">
<blockquote><p>Bellarmine as his manner is, confoundeth and taketh for one and the same, the things which in the Apostle are manifestly diuerse: to wit, regeneration and iustification; … which glosse notwithstanding might be admitted, if it were rightly vnderstood, namely of the procreant cause of faith, and not of the formall cause of iustification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned and Profitable Treatise of Man&#x27;s Justification</cite>, p. 54</span></figcaption>

</figure><figure class="quote" id="q-b7f7f8b773" data-kw="">
<blockquote><p>They formerly asserted in their decrees that the righteousness of God was the only formal cause of Justification; now they anathematize those who say that we are formally righteous by the obedience of Christ. … if any one were to teach that we are righteous formally, i.e., not by quality but by imputation, meaning that our righteousness is in relation merely, there would be nothing worthy of censure.</p></blockquote>

</figure><figure class="quote" id="q-5e998e8dd1" data-kw="">
<blockquote><p>Between them and us there is this difference, that they persuade themselves that the movement comes from the man himself, whereas we maintain that faith is voluntary, because God draws our wills to himself. Add, that when we say a man is justified by faith alone, we do not fancy a faith devoid of charity, but we mean that faith alone is the cause of justification.</p></blockquote>

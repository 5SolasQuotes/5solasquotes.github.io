<main class="wrap"><figure class="quote" id="q-1fceec7d24" data-kw="">
<blockquote><p>Let him who wishes to contemplate the invisible things of God in the unity of his essence fix his attention first on being itself, and let him see that being itself is so certain in itself that it cannot be thought not to be. For pure being occurs only in full flight from nonbeing just as nothing is in full flight from being. Therefore, just as absolute nothing has nothing of being or its attributes, so contrariwise being itself has nothing of nonbeing either in act or potency, either in objective truth or in our estimation.

Since nonbeing is the privation of being, it does not come into our understanding except through being; but being does not come to us through something else because everything which is understood is understood as nonbeing or being in potency or being in act. If, therefore, nonbeing can be understood only through being and being in potency only through being in act, and if being signifies the pure act of being, then being is what first comes into the intellect and this being is pure act. But this is not particular being, which is limited because mixed with potency; nor is it analogous being because that has only a minimum of actuality because it has only a minimum of being. It remains that the being in question must be divine Being.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Soul’s Journey into God</cite>, (1259), trans. and ed. Ewert Cousins, The Classics of Western Spirituality (New York: Paulist Press, 1978), 5.3, p. 96.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0db55133c7" data-kw="">
<blockquote><p>The will of God is God by one simple act, absolutely willing the being of whatsoever He pleases. That distinction of the absolute and conditional will, as also that of the antecedent and consequent will of God, are both unsound. God wills it to be a truth that whosoever believes shall be saved: He likewise wills it to be the duty of Judas to believe: Hence follows (in case) a will of approbation concerning things in their own nature possible, which yet never shall be: as namely, the acceptation of the obedience of the reprobates; but it does not follow that God has conditionally willed the acceptation of the obedience of the reprobates. God decrees the coexistence of two extremes conditionally cohering, as the faith and salvation of Judas, the sight of such miracles and repentance in the Tyrians: the being of which extremes themselves He has not decreed. Though the things willed be conditioned, yet the volition or willing of God concerning those things is absolute. The authors and approvers of the second distinction, understand by the antecedent will of God (John Damascene, Of the Orthodox Faith, bk. 2, ch. 29), his will concerning the creature looking at it as in itself, without any consideration of after-circumstances: so they say God wills all men, even the reprobate to be saved: this they call his first will, and it is, say they, uncertain. By the consequent will of God, they understand his will concerning the creature looked at, not only as in itself, but together with after-adjuncts and circumstances, as sin, etc. This they call his second will, and it is, say they, certain. As a judge looking upon such a person as in himself, accounts it best that he should live; but looking upon him in second respects, as a murderer, etc. he accounts it best that he should die. The vanity of both these distinctions appears in that they are repugnant to the simplicity, perfection and independence of the first cause. The will of God in the decree, and the revealing of part thereof in the command, do not infer diverse wills in God: The command shows what is the duty of man; the decree contains God’s purpose concerning our doing or not doing our duty. To will such a thing ought to be and not to will that it shall be, yea to will the not being thereof, are not opposite. But both may and do proceed from the same will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 17-18</span></figcaption>

<blockquote><p>Another reason is taken according to another way of distinguishing: because some are signs of the absolute divine will, others of the conditional. I say, therefore, that because one cannot act against the absolute will, one cannot act against the signs of the absolute will, such as are fulfillment and permission. But because one can act against the antecedent or conditional will, because man can turn away from the order to which he was created by his institution: hence it is that one can act against the will of the sign which signifies that, namely against prohibition, precept, and counsel.</p></blockquote>

<blockquote><p>There is a twofold Word, or rather a double declaration of the same Word:

1. There is God’s external or outward Word, containing letters and syllables, and this is his external voice.

2. There is God’s internal Word and voice, which secretly speaks to the heart, even by the external Word, when that only speaks to the ear. … 2. This inward Word is double: 1. ineffectual (though inward); 2. effectual. 1. Ineffectual, is that which has some inward operation upon the heart, but it attains not God’s end to bring a man into a state of life; and thus, Heb. 6:2, 5. Many tasted of the good Word of God, yet fell away. And such a heart is compared to a field which a man plows and sows, and rain falls on it, and yet the end is not attained: it brings forth thistles; and this many Jews did hear, and hence had some kind of faith in Christ.</p></blockquote>

<blockquote><p>Therefore, when the instructor speaks here of man’s only comfort, it is abundantly clear that he has in mind only true believers, who, by the grace of the Holy Spirit, have received true self-knowledge as to the depth of their inability and misery. Such have become deeply troubled and sorrowful about this, and no longer are able to be at peace with themselves.

Instead, being truly lost, wretched, and poor in spirit, they have looked outside of themselves and taken refuge only to the free grace of God in Christ Jesus for their comfort and deliverance. So the instructor has in mind true believers who truly know themselves to be poor and wretched, and it is concerning them that he inquires into what their comfort consists in regard to such misery.

The instructor proceeds to describe this comfort in greater detail and formulates it as the only comfort in life and death. The essential characteristic of man’s true comfort consists in the fact that it is singular in nature. It is unique; that is, there is but one object in which this true comfort can be sought and found: the all-sufficient God and His blessed communion. This is the only and highest good, and apart from this good there is none other in which a wretched sinner could find this true and essential comfort for his poor soul. The soul has miseries, needs, and desires that are infinite in dimension, and everything apart from God is finite and deficient.

Nothing but God alone can provide the soul with true and essential satisfaction, comfort, and encouragement. There is but one comfort for a poor and believing sinner. Only one Object can yield true and essential comfort. All comfort that is sought for and found outside of this Object is extremely harmful and vain. With Asaph, the soul of a believing sinner must here say to her God, “Whom have I in heaven but thee? and there is none upon earth that I desire beside thee” (Ps. 73:25).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Therefore, when the instructor speaks here of man’s only comfort, it is abundantly clear that he has in mind only true believers, who, by the grace of the Holy Spirit, have received true self-knowledge as to the depth of their inability and misery. Such have become deeply troubled and sorrowful about this, and no longer are able to be at peace with themselves.

Instead, being truly lost, wretched, and poor in spirit, they have looked outside of themselves and taken refuge only to the free grace of God in Christ Jesus for their comfort and deliverance. So the instructor has in mind true believers who truly know themselves to be poor and wretched, and it is concerning them that he inquires into what their comfort consists in regard to such misery.

The instructor proceeds to describe this comfort in greater detail and formulates it as the only comfort in life and death. The essential characteristic of man’s true comfort consists in the fact that it is singular in nature. It is unique; that is, there is but one object in which this true comfort can be sought and found: the all-sufficient God and His blessed communion. This is the only and highest good, and apart from this good there is none other in which a wretched sinner could find this true and essential comfort for his poor soul. The soul has miseries, needs, and desires that are infinite in dimension, and everything apart from God is finite and deficient.

Nothing but God alone can provide the soul with true and essential satisfaction, comfort, and encouragement. There is but one comfort for a poor and believing sinner. Only one Object can yield true and essential comfort. All comfort that is sought for and found outside of this Object is extremely harmful and vain. With Asaph, the soul of a believing sinner must here say to her God, “Whom have I in heaven but thee? and there is none upon earth that I desire beside thee” (Ps. 73:25).”

— Theodorus VanderGroe, The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 5.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore%2C+when+the+instructor+speaks+here+of+man%E2%80%99s+only+comfort%2C+it+is+abundantly+clear+that+he+has+in+mind+only+true+believers%2C+who%2C+by+the+grace+of+the+Holy+Spirit%2C+have+received+true+self-knowledge+as+to+the+depth+of+their+inability+and+misery.+Such+have+become+deeply+troubled+and+sorrowful+about+this%2C+and+no+longer+are+able+to+be+at+peace+with+themselves.%0A%0AInstead%2C+being+truly+lost%2C+wretched%2C+and+poor+in+spirit%2C+they+have+looked+outside+of+themselves+and+taken+refuge+only+to+the+free+grace+of+God+in+Christ+Jesus+for+their+comfort+and+deliverance.+So+the+instructor+has+in+mind+true+believers+who+truly+know+themselves+to+be+poor+and+wretched%2C+and+it+is+concerning+them+that+he+inquires+into+what+their+comfort+consists+in+regard+to+such+misery.%0A%0AThe+instructor+proceeds+to+describe+this+comfort+in+greater+detail+and+formulates+it+as+the+only+comfort+in+life+and+death.+The+essential+characteristic+of+man%E2%80%99s+true+comfort+consists+in+the+fact+that+it+is+singular+in+nature.+It+is+unique%3B+that+is%2C+there+is+but+one+object+in+which+this+true+comfort+can+be+sought+and+found%3A+the+all-sufficient+God+and+His+blessed+communion.+This+is+the+only+and+highest+good%2C+and+apart+from+this+good+there+is+none+other+in+which+a+wretched+sinner+could+find+this+true+and+essential+comfort+for+his+poor+soul.+The+soul+has+miseries%2C+needs%2C+and+desires+that+are+infinite+in+dimension%2C+and+everything+apart+from+God+is+finite+and+deficient.%0A%0ANothing+but+God+alone+can+provide+the+soul+with+true+and+essential+satisfaction%2C+comfort%2C+and+encouragement.+There+is+but+one+comfort+for+a+poor+and+believing+sinner.+Only+one+Object+can+yield+true+and+essential+comfort.+All+comfort+that+is+sought+for+and+found+outside+of+this+Object+is+extremely+harmful+and+vain.+With+Asaph%2C+the+soul+of+a+believing+sinner+must+here+say+to+her+God%2C+%E2%80%9CWhom+have+I+in+heaven+but+thee%3F+and+there+is+none+upon+earth+that+I+desire+beside+thee%E2%80%9D+%28Ps.+73%3A25%29.%E2%80%9D%0A%0A%E2%80%94+Theodorus+VanderGroe%2C+The+Christian%E2%80%99s+Only+Comfort+in+Life+and+Death%3A+An+Exposition+of+the+Heidelberg+Catechism%2C+trans.+Bartel+Elshout%2C+ed.+Joel+R.+Beeke+%281838-44%3B+2+vols%2C+Grand+Rapids+MI%3A+Reformation+Heritage+Books%2C+2016%29%2C+1%3A+5.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe4dd42acb6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e4dd42acb6.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/03/06/theodorus-vandergroe-on-god-as-mans-only-source-of-comfort/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

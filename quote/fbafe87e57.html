<main class="wrap"><figure class="quote" id="q-fbafe87e57" data-kw="">
<blockquote><p>At the time of the Westminster Assembly, various Presbyterian ministers in London wrote a book defending the divine right of church government. This book was entitled, Jus Divinum. In relation to the view of the Westminster divines concerning the judicial law, Chris Coldwell has recently argued that ‘it would seem to exhibit the understanding of [Westminster Confession] 19.4 of at least a significant portion of the divines’ and is ‘possibly the closest thing to an authoritative explication of the divines’ meaning at 19.4 that may be found.’[1] Hence, the comments recorded in this volume with respect to the Mosaic judicials are highly significant:

We answer, the Laws of the Jewish Church, whether Ceremonial or Judicial, so far forth are in force, even at this day, as they were grounded upon common equity, the principles of reason and nature, and were serving to the maintenance of the Moral Law. … The Jewish Politie is only abrogated in regard of what was in it of particular right, not of common right, so far forth as there was in their Laws either a typicalness proper to their Church, or a peculiarness of respect to their state in that Land of Promise given unto them. Whatsoever was in their Laws of Moral concernment, or general equity is still obliging …[2]

Judging by the views expressed above, we can discern that the original intent of Westminster 19 is that whatever was uniquely Jewish in the Mosaic judicial law has been abrogated, but whatever is of common right in the Mosaic judicials remains valid.

[1] Chris Coldwell, ‘The Westminster Assembly and the judicial law: a chronological compilation and analysis’ in Confessional Presbyterian, v (2009), p. 46.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sundry-ministers-of-christ-within-the-city-of-london.html">Sundry ministers of Christ within the city of London</a></span><span class="wk"><span class="lbl">Work:</span> <cite>, Jus Divinum Regiminis Ecclesiastici: or, the divine right of church-government, asserted and evidenced by the holy scriptures</cite>, (London, 1647), pp 254-5.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aa16ffe7e7" data-kw="">
<blockquote><p>And this general Rule give me leave to assert and commend to your most serious considerations and consciences. That whatsoever Law of GOD, or Command of His, we find recorded in the Law-book, in either of the Volumes of GODS Statute, the N.T. or the Old, Remains obligatory to us, unless we can prove it to be expired, or repealed. So it is with the Statute-Law of this Nation, or of any Nation; What I can prove to be once enacted, I may urge as still in force, unless any one can answer me with a just proof that it is now out of date, or Repealed by a latter Law. And so men (I forewarn them) shall find one day urged upon them, for all those Laws that stand upon Record in GODS sacred Volumes, however now many take Liberty to reject what they please, without any just ground, that GOD hath discharged them: And the Denial or Neglect of this (in matter of Church-Government) is the Rock that we have dashed upon formerly; and therefore we had need to take the more heed of it for time to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herbert-palmer.html">Herbert Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The glass of God’s providence towards his faithful ones</cite>, (London, 1644), p. 52.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

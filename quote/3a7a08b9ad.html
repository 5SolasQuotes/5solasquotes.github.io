<main class="wrap"><figure class="quote" id="q-3a7a08b9ad" data-kw="">
<blockquote><p>Farther this Pigghius reasons and says that this desire which Augustine calls concupisence is a work of nature and of God: and therefore it cannot be counted sin. But we have before answered that it comes not from the grounds of nature as it was instituted by God, but of nature corrupted. For man, when he was created, was made right and (and as the scripture says) to the image of God. Wherefore that desire of things pleasant and preservative in Adam, when he was first created, was not outrageous or vehement, to be against right reason and the word of God: for, that followed afterward. Wherefore we ought not to call it the work of God (as Pigghius says) but the wickedness of sin and corruption of affections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, ch. 5, p. 123 in Most Learned &amp; Fruitful Commentaries of Dr. Peter Martyr Vermilius... (d. 1562; London: 1568)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-c16e5bdc40" data-kw="">
<blockquote><p>But I add, that, as the Son was the common head [by creation] both of men and angels, so the dignity which was conferred on man belonged to the angels also. For when we hear them called the sons of God (Ps. lxxxii. 6) it would be incongruous to deny that they were endued with some quality in which they resembled the Father. But if He was pleased that his glory should be represented in men and angels, and made manifest in both natures, it is ignorant trifling in Osiander to say that angels were postponed to men, because they did not bear the image of Christ. They could not constantly enjoy the immediate presence of God if they were not like to Him; nor does Paul teach (Col. iii. 10) that men are renewed in the image of God in any other way than by being associated with angels, that they may be united together under one head. In fine, if we believe Christ our felicity will be perfected when we shall have been received into the heavens, and made like the angels. But if Osiander is entitled to infer that the primary type of the image of God was in the man Christ, on the same ground may anyone maintain that Christ behoved to partake of the angelic nature, seeing that angels also possess the image of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, tr: Beveridge (1559), bk. 2, ch. 12, section 6, pp. 9-10</span></figcaption>

<blockquote><p>The intellect is that power by which we are able to entertain concepts, to affirm the truth or falsity of propositions, and to assess the cogency of arguments… Traditionally, the act of entertaining a concept is known as simple apprehension; the act of affirming or denying the truth of a proposition is known as judgment; and the act of inferring a proposition from other propositions is known as reasoning. Simple apprehension, judgment, and reasoning are the intellect’s basic operations. Being rational or capable of thought is essentially a matter of having the capacity for these operations of the intellect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholasticae, 2024), ch. 3, ‘The Intellect’, p. 64</span></figcaption>

</figure><figure class="quote" id="q-6faf9d6c2b" data-kw="">
<blockquote><p>Human acts are the acts of the will directed by reason. They are either elicited, that is, produced by the will itself, or commanded, that is, produced by some other faculty under the influence of the will. Elicited acts are concerned either with the end or with the means. Three acts are concerned with the end: a) simple velleity, not yet efficacious; b) efficacious intention of the end; c) joy in the end attained. Two acts are concerned with means: a) consent, which accepts means; b) choice of a determined set of means. Each of these five acts of the will is preceded by a directive act of the intellect. Simple velleity, by the knowledge of the good in question; intention, by a judgment that this end should be attained; consent, by counsel; choice, by the last practical judgment which terminates deliberation. After voluntary choice there follows, in the intellect, the act called imperium, which directs the execution of the means chosen, ascending from lower means to those higher and nearer to the end to be obtained, in order inverse to that of intention, which descends from the desired end to the means which come first in execution. After the intellect’s imperium there follows in the will the act called active use, which sets the other faculties to work. These acts of the other faculties, called passive use, are, properly speaking, commanded acts of the will. And the will’s last act is that of joy in the possession of the end obtained. The end, which was first in the order of intention, is the last in the order of execution. … By the term ‘interior’ act St. Thomas often means an act which does not arise from a previous act, the first act, for example, of willing an end. By opposition, then, ‘exterior act’ often means not only the act of the corporeal members, but also an act of the will itself, if this act arises from a preceding act, as when, for example, we will the means because we already will the end. Here we must remark, further, that a human act, voluntary and free, is not necessarily preceded, if we speak precisely, by a discursive deliberation, but may be the fruit of a special inspiration, superior to human deliberation. But, even here, the act is free… because the will consents to follow the inspiration. Here lies the difference between the virtue of prudence, which presupposes discursive deliberation, and the gifts which make man prompt and docile to the inspirations of the Holy Ghost. These latter acts, free but not in the proper sense deliberate [deliberative], are the fruit, as we shall see later, not of co-operating grace, but of operating grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (St. Louis: Herder, 1950), ch. 46, ‘Human Acts’, pp. 278-80 Lagrange was a Neo-Thomist.</span></figcaption>

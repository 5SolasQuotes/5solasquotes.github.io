<main class="wrap"><figure class="quote" id="q-d646d04a74" data-kw="">
<blockquote><p>3. Neither Mr. Rutherford [contra what Hooker said] nor any judicious man can teach that either a gift to write books, or of eminent preaching, praying, exhorting, proceeds out of a power of office; it is a sanctified gift which the Church sees and judges to be in any before they call him to office; and any gift is by order of nature and time before the office, and so proceeds not from the office; and therefore it is not required that every pastor should have a gift of writing books; But if the Lord have given it to any, they exercise it as such [additionally] gifted officers as the prophets and apostles, as such prophets so gifted did write canonic Scriptures; so are pastors, if gifted, to write and preach in their way, and both to write and preach by their office. Nor is it good logic that all in office should write books because some by virtue of their office write books; for a minister gifted with four talents is obliged to gain with these four talents, and that as a minister by virtue of his office; but it is weak logic to infer, therefore, all ministers by virtue of their office are obliged to gain with four talents, for many are obliged by virtue of their office to gain with only two [talents, not including with writing books] to their Lord, and with only one [talent]. 4. It was needless to Mr. Hooker to prove writing of books does not belong to the power of office because a learned man out of office may do it with more authority, for Mr. Rutherford had no such intention [of teaching to the contrary]. For sure, if such a thing agreed to the office-power as the office-power, then all officers, pastors [and] elders were obliged to write books, and yet Mr. Hooker does not very happily prove it, because many learned men, unofficed, may with more authority of truth write books than officed men. It is only some officed men he must mean, or it is not true. [emphasis added below] And then I retort it thus: Many officed men may write books with more authority both of truth and of office (and two are better than one) than some unofficed men less learned [Rutherford affirms this]. Therefore [according to Hooker’s logic, it would seem], some gifted pastors do not as pastors so gifted, and by virtue of their office relating both to the presbyterian Church and their own congregation, edify all the Churches about by writing books. It follows not. [Rutherford is affirming that some gifted pastors do write books with the virtue of their office in relation to the churches, though a calling to write books does not derive simply from their office]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 2, ch. 4, pp. 210-11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fdea1702b8" data-kw="">
<blockquote><p>Your next exception against the presbytery is for their expectants, these be the sons of the prophers, who in their preparations for the ministry, at their first exercises for assay and trial are heard in the presbytery; with this practise no reasonable man can find fault; it is naturally impossible for any, without a miracle, to attain the habit of preaching but by diverse initial and preparatory actions; where can these be so fitly performed as in the classes [presbyteries]? The expectants are present in the classes for their training, not as members, for they do not voice in any matters of discipline. The true mystery of this controversy is that the expectants [in Anglicanism] are permitted to preach before the holy hands of a bishop have conferred upon them the order of a deacon, and so [have] power to preach and baptize: The Church of Scotland did always reject this corruption as clearly contrary to Scripture.</p></blockquote>

d it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7ac968f88a" data-kw="">
<blockquote><p>But beside, suppose there were some petty defects or irregularities in their entry to the exercise of their ministry… yet ye should know it is not every lighter fault of that nature which will warrant Separation; but only such attrocious crimes as either destroys the essence of the ministry and makes it null and void (as your Reverend Mr. [Robert] Brown teaches in the Preface to his Book against Wolrogen, and excellent Mr. [Oliver] Bowels in his Pastor Evangelicus, bk. 1, ch. 4), for recte fieri is one thing, and ratum esse is another, and multa impediunt matrimonium contrahendum, quae non dirimunt contractum; or else does so vitiate their ministry as people cannot join therewith in its ministerial acts without real and native participating in the sin, in God’s account and in the construction of his holy Law: Otherwise if there be any pollution adherent to their ministry, which neither evacuates the essence thereof, nor so intrinsically leprosies it, but ye may communicate in its acts abstractly from and without touching the spot; the sin rests on the men themselves, and ye are not concerned therein farther than to lament it, but not to be scared and debarred by it from joining in their ministerial administrations, they being to you clean, whatever they be to the men themselves.</p></blockquote>

<blockquote><p>Neither can it be ground enough to plead for such decisions in preaching, that the thing they preach-for is truth, and the thing they condemn is error. Because: 1. It is not the lawfulness of the thing simply that is in question, but the necessity and expediency thereof in such a case: Now, many things are lawful that are not expedient, 1 Cor. 10:23. 2. In these differences that were in the primitive times concerning meats, days, genealogies, etc. there was a truth or an error upon one of the sides, as there is a right and a wrong in every contradiction of such a kind, yet the apostle thinks fitter, for the Church’s peace, that such be altogether refrained, rather than any way (at least in public) insisted upon or decided. 3. Because no minister can bring forth every truth at all times, he must then make choice; And I suppose some ministers may die, and all do so, who have not preached every truth, even which they knew, unto the people. Beside, there are (no question) many truths hid to the most learned. Neither can this be thought inconsistent with a minister’s fidelity, who is to reveal the whole counsel of God; because, that counsel is to be understood of things necessary to men’s salvation, and is not to be extended to all things whatsoever; for, we find the great apostle expounding this in that same sermon, Acts 20, verse 20, ‘I have keeped back nothing that was profitable unto you;’ which evidenceth that ‘the whole counsel of God,’ or the things which he showed unto them, is the whole, and all that was profitable for them, and that for no by-respect or fear whatsoever he shunned to reveal that unto them. [4.] Also, it is clear, that there are many truths which are not decided by any judicial act; and amongst other things, sparingness to decide truths that are not fundamental judicially has been ever thought no little mean[s] of the Church’s peace, as the contrary has been of division.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on Scandal</cite>, pp. 358-359</span></figcaption>

<blockquote><p>5th Distinction: There is a formal calling of the Church, as the laying on of the hands of the elders, and a virtual and interpretative calling or tacit approbation of the Church, when learned men of eminent gifts, not in office, do write commentaries, sermons on canonical Scriptures, and tractates refuting heresies; to this the tacit approbation of the Church is required, but these have not ordinary pastoral care, nor are they the ordinary converters of souls to Christ, as the pretended prophets of Separatists are [claimed to be].</p></blockquote>

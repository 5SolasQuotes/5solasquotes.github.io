<main class="wrap"><figure class="quote" id="q-209fbb2df4" data-kw="">
<blockquote><p>To doubt the love, the wisdom, and the faithfulness of God; to doubt the perfection of the work of Christ; to doubt the operation of the Spirit on the heart, what can tend more to the weakening and decay of this precious and costly grace? Every time the soul sinks under the pressure of a doubt of its interest in Christ, the effect must be a weakening of the soul&#x27;s view of the glory, perfection, and all-sufficiency of Christ&#x27;s work. But imperfectly may the doubting Christian be aware what dishonor is done to Jesus, what reflection is cast upon his great work, by every unbelieving fear he cherishes.</p></blockquote>
<figcaption>— <a href="../authors/octavius-winslow.html">Octavius Winslow</a>, <cite>Personal Declension and Revival of Religion in the Soul</cite>, p. 74</figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/doubts-and-fears.html">Doubts and Fears</a></span><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bca1995867" data-kw="">
<blockquote><p>Himself he may doubt, — he may doubt his ability to save himself, — he may doubt his power to better his condition, to make himself more worthy and acceptable, but never let him doubt that Christ is all that a poor, lost, convinced sinner wants. Let him not doubt that Jesus is the Friend of sinners, the Savior of sinners, and that he was never known to cast out one who in lowliness and brokenness of heart, sought his compassionate grace.</p></blockquote>
<figcaption>— <a href="../authors/octavius-winslow.html">Octavius Winslow</a>, <cite>Personal Declension and Revival of Religion in the Soul</cite>, p. 80</figcaption>

</figure><figure class="quote" id="q-f4da6d65e4" data-kw="">
<blockquote><p>Assurance makes most for your comfort—but holiness makes most for God&#x27;s honor. Man&#x27;s holiness is now his greatest happiness, and in heaven man&#x27;s greatest happiness will be his perfect holiness. Assurance is the daughter of holiness; and he who shall more highly prize, and more earnestly press after the enjoyment of the daughter than the mother, it is not a wonder if God shuts the door upon him, and crosses him in the thing he most desires. The surest and the shortest way to assurance is to wrestle and contend with God for holiness. When the stream and cream of a man&#x27;s spirit runs after holiness, it will not be long night with that man; the Sun of righteousness will shine forth upon that man, and turn his winter into summer, and crown him with the diadem of assurance.</p></blockquote>
<figcaption>— <a href="../authors/thomas-brooks.html">Thomas Brooks</a>, <cite>Heaven on Earth: A Treatise on Christian Assurance</cite>, p. 104</figcaption>

</figure><figure class="quote" id="q-82e246423c" data-kw="">
<blockquote><p>This certainty is not a bare conjectural and probable persuasion grounded upon a fallible hope, but an infallible assurance of faith, founded on the blood and righteousness of Christ revealed in the Gospel; and also upon the inward evidence of those graces of the Spirit unto which promises are made, and on the testimony of the Spirit of adoption, witnessing with our spirits that we are the children of God; and, as a fruit thereof, keeping the heart both humble and holy.</p></blockquote>
<figcaption>— <a href="../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith</cite>, 1689, 18.2</figcaption>

</figure><figure class="quote" id="q-b8ba812231" data-kw="">
<blockquote><p>Assurance is a jewel of that worth, a pearl of that price, that he who will have it must work, and sweat, and weep, and wait to obtain it. He must not only use diligence—but he must use all diligence; not only dig—but he must dig deep, before he can come to this golden mine. Assurance is that &quot;white stone,&quot; that &quot;new name,&quot; that hidden manna, which none can obtain but such as labor for it as for life. Assurance is such precious gold, that a man must win it before he can wear it.</p></blockquote>
<figcaption>— <a href="../authors/thomas-brooks.html">Thomas Brooks</a>, <cite>Heaven on Earth: A Treatise on Christian Assurance</cite>, p. 34</figcaption>

<main class="wrap"><figure class="quote" id="q-883ddbe677" data-kw="">
<blockquote><p>God is incomprehensible, because it is said in Jeremiah: if the heavens above can be measured, and the foundations of the earth below can be explored, then I will cast off all the descendants of Israel (Jer 31:37).

I answer that in one sense, to comprehend means to enclose, as a house comprehends us; in another sense, it means to attain and hold.

In the first sense he is incomprehensible, because he cannot be enclosed in a created intellect, since he is most simple and because you do not know or love him to the degree that he is knowable and loveable, as a person who does not know a truth by demonstration but by opinion does not know it as perfectly as it can be known. But God knows himself, as far as he is knowable. The reason for this is that a thing is known according to the mode of its own being and truth. God, however, is infinite light and truth, whereas our light is finite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super ad Philipenses</cite>, C. 3, L. 2, 127.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-08b86ee7f5" data-kw="">
<blockquote><p>CARLYLE. I am no worshipper of Force. I see nothing to admire in mere power, i.e. in its quantity apart from its quality. Carlyle’s earnestness is very touching and noble; but it seems to me that, according to his teaching, if you could conceive an omnipotent devil, you ought to worship him as much as Israel’s Jehovah. [So that he is in one sense a modem Manichee?] I suspect so. And an omnipotent militia of darkness would be the very horror of horrors. . .

The connection between Carlylism and despotism I see, but the link is nowhere explicitly avowed. Carlyle is sometimes difficult to understand, and very difficult to judge. Why did he call Chalmers the last of the Christians? I suppose he forgets what he has written elsewhere. Hero-worship! ah well, he and I have to meet a strange hero yet … the greatest that I know of next to Him who overcame him. Carlyle has great faith in the devil, but I suspect he always appreciates quantity of being and of power more than quality. Have you observed how Christianity takes up the fragmentary truth that lies in the demonological and the spirit-inhabited? We Christians have lost nothing that could be retained in the old mythologies. And perhaps these beliefs in spiritual presences in nature are but the lingering mist of patriarchal tradition concerning the spirit-world. …

Carlyle, too, when he keeps to genuine English, when his historical narrative (as in some parts of his “French Revolution “) is vigorously sustained, has done a great deal to display the capabilities of English prose. But he often writes sheer gibberish, according to the classical tests. And whenever a man becomes cloudy in his words, be sure that his thought has grown shadowy too.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duncan.html">John Duncan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Colloquia Peripatetica</cite>, ed. William Knight (Edinburgh: Edmonston &amp; Douglas, 1870), pp 49, 53.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-e0313fd875" data-kw="">
<blockquote><p>This discussion about University education leads up to another view of the transition from philosophy to theology. The Scottish Churches have made statutory the transition, formal and express, as a vital part of the training of young men for the ministry. They will have no one licensed to preach who has not previously undergone a theological curriculum of studies in the Halls; and they will allow no one to enter the Hall as a regular student who has not passed through an arts curriculum distinctively philosophical.

There, then, is the transition from philosophy to theology prescribed by law. It is true that in some cases the law may be obeyed only in form. One student may leave the University without anything perceptible of philosophical culture or attainment. Another may leave the Hall with little or nothing of real theological culture or attainment. Thus the transition may not be a reality in this or that case: either because the student has not philosophy to begin with; or because he does not come to have theology to end with; or both. But what we now look to is the ideal in the mind of the churches as represented by their law. And looking to this we see that the transition from philosophy to theology ought in their judgment to have place in the formative process of preparation for the Christian ministry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-macgregor.html">James MacGregor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Transition from Philosophy to Theology in British and Foreign Evangelical Review</cite></span></figcaption>

<blockquote><p>Moreover, there is yet another reason for which, out of charity, we love more those who are more nearly connected with us, since we love them in more ways. For, towards those who are not connected with us we have no other friendship than charity, whereas for those who are connected with us, we have certain other friendships, according to the way in which they are connected.

Now since the good on which every other friendship of the virtuous is based, is directed, as to its end, to the good on which charity is based, it follows that charity commands each act of another friendship, even as the art which is about the end commands the art which is about the means.

Consequently, this very act of loving someone because he is akin or connected with us, or because he is a fellow-countryman or for any like reason that is referable to the end of charity, can be commanded by charity, so that, out of charity both eliciting and commanding, we love in more ways those who are more nearly connected with us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologica</cite>, (c. 1266-73), II-II, Q. 26, Art. 7, co.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-32dd884dec" data-kw="">
<blockquote><p>The worship (or service) of God is a work commanded of God, wrought through faith (principally) to the setting forth of the glory of God. In this definition there be three things, which in the true worship of God are necessarily joined together: First: The matter (or material part), which is a work commanded of God. Secondly: The cause, namely that the same work be done of faith, in Jesus Christ. Thirdly: The end, namely the glory of God, which the worker respects, that by this means he may declare himself obedient to his heavenly father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/niels-hemmingsen.html">Niels Hemmingsen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Way of Life A Christian, &amp; Catholic Institution comprehending Principal Points of Christian Religion</cite>, … (London: Jones, 1578), ‘Of the Worship (or Service) of God’, p. 180 Hemmingsen was a Lutheran.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>Does the Regulative Principle only apply to public worship and not private worship? John Jackson shows how God’s word is to be applied in both private and public worship. In this exhorting work, Jackson plows up the fallow ground of both your private and public service (your worship) to God, to present it in a more acceptable manner through the work of Christ. He outlines and exhorts you and your family in these duties as they are prescribed and regulated by the Word of God… He cites over 700 footnotes, all of which are Scriptural proofs of his encouraging words. This is a work that should sit alongside your bible to refer to daily.” – Matthew McMahon Burroughs, Jeremiah – Gospel-Worship, or, The Right Manner of Sanctifying the Name of God in General &amp; Particularly in these Three Great Ordinances, viz. 1. Hearing of the Word, 2. Receiving the Lord’s Supper, 3. Prayer (London, 1653) Love, Christopher – The Zealous Christian Taking Heaven by Holy Violence in [13] Several Sermons, Tending to Direct Men how to Hear with Zeal, [how] to Pray with Importunity… (London, 1653) This has been reprinted as The Hearer’s Duty &amp; Other Works Buy (Puritan Publications). Cawdrey, Daniel Diatribe triplex, or, A Threefold Exercitation concerning 1. Superstition, 2. Will-Worship, 3. Christmas Festival, with the Reverend &amp; Learned Dr. Hammond (London: Wright, 1654) 204 pp. ToC The Account Audited &amp; Discounted: or, a Vindication of the Threefold Diatribe, of: 1. Superstition, 2. Will-Worship, 3. Christmas Festival, Against Dr. Hammond’s Manifold Para-Diatribes (London, 1658) Brewer, Thomas – Gospel Public Worship: or the Translation, Metaphrase, Analysis &amp; Exposition of Rom. 12, vv. 1-8, Describing &amp; Prescribing the Complete Pattern of Gospel-Worship in Gospel Public Worship… Also, an Exposition of the 18th Chapter of Matthew, to which is Added A Discovery of Adam’s Threefold Estate in Paradise… (London: Godbid, 1656), pp. 1-222 Brewer was an English separatist minister who suffered much persecution under the prelates. When “at Leiden… he walked in communion with Mr. [John] Robinson, and also with Mr. [Henry] Ainsworth.</p></blockquote>

</figure><figure class="quote" id="q-76b56e04c0" data-kw="">
<blockquote><p>There are three fundamental principles held by non-conformists (and those especially of them which are called presbyterians) wherein they differ from others: 1. That the Scriptures of the Old and New Testament are a perfect Rule for Christians, directing them not only what to believe in the things of God, but also what to do in all matters relating to the Worship of God, and the government of the Church; so as in these things they may not either believe or do what is not there expressly, or by immediate consequence revealed. In civil matters they believe the Scripture to be only a general rule, or rather as to them, to contain some general rules only, by which all men’s actions are to be directed; but in sacred things, they believe the Scriptures to be a particular rule… Thus they differ from Papists, who will not allow the Scriptures to be a perfect rule as to matters of faith; and from those, who although they allow them in matters of faith a perfect rule, yet deny them to be so in the matters of worship, or government of the Church; and as to the first, say that the Scriptures are only a perfect rule as to acts of worship, not as to means, and modes, or religious rites used in, and about the worship of God; but that these may be directed by superiours for spiritual edification; or who say, that the Scripture has only directed that the Church should be governed, but has left to superiours to determine by what officers, acts and rules that government should be exercised: So as the first and main question is, Whether the Scriptures be a perfect and sufficient rule for Christians in matters of worship, and Church government, as well as matters of faith? which those called presbyterians believe it is; because they find sufficient directions in it for the decent and orderly performance of all acts of worship, without any human supplements; and such Church-officers directed by it, such acts of jurisdiction and censures prescribed in it, as are sufficient to preserve the unity, peace and purity of the Church; which are the great ends of that government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english-presbyterians.html">English Presbyterians</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anonymous, English Presbytery, or an Account of the Main Opinions of those ministers and people in England who go under the name of Presbyterians</cite>, … (London, 1680), pp. 1-2</span></figcaption>

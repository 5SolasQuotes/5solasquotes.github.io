<blockquote><p>VI. Problem: Whether there are more than one soul in each man, or whether the vegetative, sensitive and rational in one man are three souls really distinct? I deny. Gennadius, in his book, On Ecclesiastical Dogmas, ch. 15, imputes as a heresy to James and other disputers that they posited two souls in man, one animal by which the body is animated and is mixed with the blood, and the other spiritual which provides reason – with which opinion those agree who posited two, and indeed opposite souls, namely the sensitive and the rational, of which the former is mortal, the latter immortal, in Clement, bk. 2 of the Stromata and Theodoret bk. 5, On the Cure of Greek affections; and Ockham on the fourth book of The Sentences, distinction 7, Francis de Meyronnes on the second book distinction 17, Pico della Mirandola on the eversion of the singular certitude book 33. There were some (among whom Didymus, bk. 3 on the Holy Spirit) who from 1 Thess. 5:23 wrongly understood constituted three essential parts in man – body, soul, spirit – in Gennadius chapter 20, Jerome to Hedybia question 12 epistle 150, the author of the work on Spirit and Soul chapter 49. But in response to the objected passage, among the orthodox some understand by “spirit” the grace of the Holy Spirit (Gennadius and Jerome); others the soul itself, which for its diverse functions and respects is called soul, insofar as it animates the body for living or vivifying, and spirit, either because it breathes in the body and makes it vital and spiritual, or because its substance is spiritual (the author of the work on Spirit and Soul, Gennadius cited above, Jerome, bk. 4 on Mt. ch. 27, Tertullian on the Soul ch. 6, Gregory the Great, bk. 11 of the Moralia, ch. 3, Isidore, bk. 11 of the Origins, ch. 1). We with the more recent interpreters expound “spirit” as the rational part of the soul, and “soul” as the remaining part which we have in common with the brutes. Thus they generally distinguish Mt. 22:37. The Manicheans imagined two souls, one a particle of the divine breath and free from all fault, the other vicious produced by the evil principle, in Augustine book 6 against Faustus chapter 8 and book 10 on the Literal Interpretation of Genesis chapter 13. Plato in the Timaeus, compared with book 9 of the Republic, as Aristotle also reports in book 1 of On the Soul the last chapter, posited three souls. This opinion of his, condemned by the common school, was revived in the previous century by the celebrated philosopher Zabarella in his treatise on the Faculties of the Soul (with Averroes preceding him), whom one or another then followed, among them William Ursinus, who contends that this is the opinion of Aristotle, Disputations part 2 disputation 2. Although we with Hervaeus, treatise on the unity of forms VII. Problem: Whether therefore it is to be said that the embryo is successively informed by three souls, so that when the sensitive arrives, the vegetative is abolished, and when the rational arrives, the sensitive is abolished? [as was the typical Medieval view] I answer: Indeed the scholastics commonly say this with Thomas, first part, question 118, article 2, and Summa contra Gentiles, bk. 2, ch. 89, and Scaliger, Exercises 297, section 1 and exercise 290, section 2, the Coimbrans cited above, and all the other Pontifical philosophers and theologians. To me, however, this opinion has never been pleasing. Now looking around to see if others also judge with me, I find Goclenius in his Exercises on Scaliger, question 5, p. 55 doubting it, but Zanchi, in the chapter cited, openly rejecting it. See their reasons there. To me it has always seemed absurd: 1) To imagine a triple generation and introduction of form, and therefore to constitute a triple species of living nature in act (for the soul is the act of an organic body), so that the pregnant female conceives and carries first not a man, but a plant, and then a brute; 2) Then an abortion which occurs after the animation of the fetus would not always be a man, but sometimes only a plant or brute; 3) Then it could not be judged whether an aborted fetus was to be baptized and honored with (as they say) ecclesiastical burial, because although it lived and moved itself for some moment, there is still no certainty whether the rational soul had been introduced and the sensitive abolished. The Pontificals especially should have thought about this case, who so precisely and anxiously inquire about the necessity of baptism and ecclesiastical burial. These things I thus commented in the year 1638 in the first edition of this disputation for the determination of the present and immediately preceding problem. Afterwards it happened that some obsolete concepts about the mind or spirit, distinct from the human soul and body, and about the human animal, were rehashed by some more recent authors – which if they are defended with their own thorns and hypotheses to the end, seem to render theology inconvenient and difficult for us somewhere, especially in the refutations of the Socinians and others, ancient and modern. I, given the occasion here, gave in advance to Christian philosophers and theologians to consider in the year 1641, in the corollaries to the disputation on the Jubilee, what inconveniences seemed to me to be able to follow from that new philosopheme about man as a being per accidens.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648) Latin | ‘On Creation’, pt. 9, pp. 279-81</span></figcaption>

2) Then an abortion which occurs after the animation of the fetus would not always be a man, but sometimes only a plant or brute; 3) Then it could not be judged whether an aborted fetus was to be baptized and honored with (as they say) ecclesiastical burial, because although it lived and moved itself for some moment, there is still no certainty whether the rational soul had been introduced and the sensitive abolished. The Pontificals especially should have thought about this case, who so precisely and anxiously inquire about the necessity of baptism and ecclesiastical burial. These things I thus commented in the year 1638 in the first edition of this disputation for the determination of the present and immediately preceding problem. Afterwards it happened that some obsolete concepts about the mind or spirit, distinct from the human soul and body, and about the human animal, were rehashed by some more recent authors – which if they are defended with their own thorns and hypotheses to the end, seem to render theology inconvenient and difficult for us somewhere, especially in the refutations of the Socinians and others, ancient and modern. I, given the occasion here, gave in advance to Christian philosophers and theologians to consider in the year 1641, in the corollaries to the disputation on the Jubilee, what inconveniences seemed to me to be able to follow from that new philosopheme about man as a being per accidens.”

rome%2C+bk.+4+on+Mt.+ch.+27%2C+Tertullian+on+the+Soul+ch.+6%2C+Gregory+the+Great%2C+bk.+11+of+the+Moralia%2C+ch.+3%2C+Isidore%2C+bk.+11+of+the+Origins%2C+ch.+1%29.+We+with+the+more+recent+interpreters+expound+%E2%80%9Cspirit%E2%80%9D+as+the+rational+part+of+the+soul%2C+and+%E2%80%9Csoul%E2%80%9D+as+the+remaining+part+which+we+have+in+common+with+the+brutes.+Thus+they+generally+distinguish+Mt.+22%3A37.+The+Manicheans+imagined+two+souls%2C+one+a+particle+of+the+divine+breath+and+free+from+all+fault%2C+the+other+vicious+produced+by+the+evil+principle%2C+in+Augustine+book+6+against+Faustus+chapter+8+and+book+10+on+the+Literal+Interpretation+of+Genesis+chapter+13.+Plato+in+the+Timaeus%2C+compared+with+book+9+of+the+Republic%2C+as+Aristotle+also+reports+in+book+1+of+On+the+Soul+the+last+chapter%2C+posited+three+souls.+This+opinion+of+his%2C+condemned+by+the+common+school%2C+was+revived+in+the+previous+century+by+the+celebrated+philosopher+Zabarella+in+his+treatise+on+the+Faculties+of+the+Soul+%28with+Averroes+preceding+him%29%2C+whom+one+or+another+then+followed%2C+among+them+William+Ursinus%2C+who+contends+that+this+is+the+opinion+of+Aristotle%2C+Disputations+part+2+disputation+2.+Although+we+with+Hervaeus%2C+treatise+on+the+unity+of+forms+VII.+Problem%3A+Whether+therefore+it+is+to+be+said+that+the+embryo+is+successively+informed+by+three+souls%2C+so+that+when+the+sensitive+arrives%2C+the+vegetative+is+abolished%2C+and+when+the+rational+arrives%2C+the+sensitive+is+abolished%3F+%5Bas+was+the+typical+Medieval+view%5D+I+answer%3A+Indeed+the+scholastics+commonly+say+this+with+Thomas%2C+first+part%2C+question+118%2C+article+2%2C+and+Summa+contra+Gentiles%2C+bk.+2%2C+ch.+89%2C+and+Scaliger%2C+Exercises+297%2C+section+1+and+exercise+290%2C+section+2%2C+the+Coimbrans+cited+above%2C+and+all+the+other+Pontifical+philosophers+and+theologians.+To+me%2C+however%2C+this+opinion+has+never+been+pleasing.+Now+looking+around+to+see+if+others+also+judge+with+me%2C+I+find+Goclenius+in+his+Exercises+on+Scaliger%2C+question+5%2C+p.+55+doubting+it%2C+but+Zanchi%2C+in+the+chapter+cited%2C+openly+rejecting+it.+See+their+reasons+there.+To+me+it+has+always+seemed+absurd%3A+1%29+To+imagine+a+triple+generation+and+introduction+of+form%2C+and+therefore+to+constitute+a+triple+species+of+living+nature+in+act+%28for+the+soul+is+the+act+of+an+organic+body%29%2C+so+that+the+pregnant+female+conceives+and+carries+first+not+a+man%2C+but+a+plant%2C+and+then+a+brute%3B+2%29+Then+an+abortion+which+occurs+after+the+animation+of+the+fetus+would+not+always+be+a+man%2C+but+sometimes+only+a+plant+or+brute%3B+3%29+Then+it+could+not+be+judged+whether+an+aborted+fetus+was+to+be+baptized+and+honored+with+%28as+they+say%29+ecclesiastical+burial%2C+because+although+it+lived+and+moved+itself+for+some+moment%2C+there+is+still+no+certainty+whether+the+rational+soul+had+been+introduced+and+the+sensitive+abolished.+The+Pontificals+especially+should+have+thought+about+this+case%2C+who+so+precisely+and+anxiously+inquire+about+the+necessity+of+baptism+and+ecclesiastical+burial.+These+things+I+thus+commented+in+the+year+1638+in+the+first+edition+of+this+disputation+for+the+determination+of+the+present+and+immediately+preceding+problem.+Afterwards+it+happened+that+some+obsolete+concepts+about+the+mind+or+spirit%2C+distinct+from+the+human+soul+and+body%2C+and+about+the+human+animal%2C+were+rehashed+by+some+more+recent+authors+%E2%80%93+which+if+they+are+defended+with+their+own+thorns+and+hypotheses+to+the+end%2C+seem+to+render+theology+inconvenient+and+difficult+for+us+somewhere%2C+especially+in+the+refutations+of+the+Socinians+and+others%2C+ancient+and+modern.+I%2C+given+the+occasion+here%2C+gave+in+advance+to+Christian+philosophers+and+theologians+to+consider+in+the+year+1641%2C+in+the+corollaries+to+the+disputation+on+the+Jubilee%2C+what+inconveniences+seemed+to+me+to+be+able+to+follow+from+that+new+philosopheme+about+man+as+a+being+per+accidens.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Select+Theological+Disputations%2C+vol.+1%2C+pt.+2+tr.+by+AI+by+Onku+%28Utrecht%3A+Johannes+a+Waesberg%2C+1648%29+Latin+%7C+%E2%80%98On+Creation%E2%80%99%2C+pt.+9%2C+pp.+279-81&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F59ffa0a199.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/59ffa0a199.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=VI.%20Problem%3A%20Whether%20there%20are%20more,man%20as%20a%20being%20per%20accidens&amp;text=VI.%20Problem%3A%20Whether%20there%20are%20more%20than%20one&amp;text=philosopheme%20about%20man%20as%20a%20being%20per%20accidens" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-b0a6fe72b8" data-kw="">
<blockquote><p>This crucified Redeemer only was able to effect this work. He was an infinite person, consisting of a divine and human nature; the union of the one gave value to the suffering of the other. The word of God was passed in his threatening; his justice would demand its right of his veracity; a sacrifice there must be to repair the honour of God by bearing the penalty of the law, which could not be done by the strength and holiness of any creature. All the created force in the earth, and the strongest force of the angelical nature, were too feeble for so great a task.

Justice must have satisfaction; the sinner could not give it without suffering eternal punishment. He then puts himself into our place to free us from the arrest of justice, and bear those strokes which, by virtue of the law, wrath had prepared for us. The dignity of his person puts a value upon his punishment, and renders it acceptable for us, it being a death superior in virtue to the death of worlds; it was a death which justice required, and at the sight of it justice was so calmed, that the sharp revenging sword drops out of its hand.

God hath smelt in it so sweet a savour that hath fully pleased him. He can now pardon the sins of believers with the glory of his righteousness, as well as of his grace. He can legally justify a repenting sinner. God hath been served in the passion of the Redeemer, his justice and holiness were glorified and the law accomplished, the honour of God is salved, and the author of the law righted, the justice of God sweetened.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Knowledge of Christ Crucified</cite>, (1684) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), iv, 499.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d4b2ad7120" data-kw="">
<blockquote><p>Christ as Redeemer executes the offices of prophet, priest; and king. These offices are essentially distinct, each has its own peculiar province, but they are necessarily and inseparably connected one with another, and all of them are indispensable to the accomplishment of his work as Mediator. As a prophet, he proclaims the will of God; as a priest, he makes satisfaction for sin, and pleads the efficacy of his atoning sacrifice; as a king, he applies the redemption he has purchased, so as to secure the full and eternal blessedness of those for whom it was designed.

Were he not a prophet, the plan of salvation would have remained unknown; were he not a priest, there would have been no glad tidings to publish to a fallen world; were he not a king, his instructions would have been without efficacy, and his sacrifice would have proved altogether unavailing to the salvation of those for whom he died. It is his office as a king which gives perfection and efficacy to his offices as a priest and as a prophet, and secures the great ends for which he taught and suffered — for which his blood was shed on Calvary, and carried within the vail. Were he not a king, he would not be a Saviour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ewing.html">James Ewing</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ, King of Zion in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>IX. Hence the state of the question is easily elicited. (1) It is not asked with respect to the value and sufficiency of the death of Christ–whether it was in itself sufficient for the salvation of all men. For it is confessed by all that since its value is infinite, it would have been entirely sufficient for the redemption of each and every one, if God had seen fit to extend it to the whole world. And here belongs the distinction used by the fathers and retained by many divines–that Christ ‘died sufficiently for all, but efficiently for the elect only.’ For this being understood of the dignity of Christ’s death is perfectly true (although the phrase would be less accurate if referred to the will and purpose of Christ). But the question properly concerns the purpose of the Father in delivering up his own Son and the intention of Christ in dying. Did the Father appoint his Son for each and every one and, did the Son deliver himself up to death with the design and intention of substituting himself in the place of each and every one to make satisfaction and acquire salvation for the same? Or did he resolve to deliver himself up for the elect only, who were given him by the Father to be redeemed and whose head he was to be?… Hence it is sufficiently evident that it is not here treated of the revealed will (eurestias) of God only, but of his secret will (eudokias) under which the death and mission of Christ fall (as all must agree).

X. (2) The question does not concern the fruits and efficacy of Christ’s death–whether each and all will be actually made partakes of these [and hence be saved]… Our opponents acknowledge that these are to be extended to believers only. Rather the question refers to the design of God in sending his Son into the world and the purpose of Christ in his death. Were these such that Christ by substituting himself in the place of each and every one, made satisfaction and obtained the remission of sin and salvation for them all or for the elect only? They affirm the former; we affirm the latter.

XI. (3) We do not inquire whether the death of Christ gives occasion to the imparting of many blessings even to reprobates. For it is due to the death of Christ that the gospel is preached to every creature, that the gross idolatry of the heathen has been abolished from many parts of the world , that the daring impiety of men is greatly restrained by God’s word and that some often obtain many and excellent (though not saving) gifts of the Holy Spirit. All these unquestionable flow from the death of Christ, since no place would have been given for them in the church unless Christ had died. Rather the question is whether the suretyship and satisfaction of Christ were (by the counsel of God and the will of Christ himself) intended for each and every one (as they hold); or for the elect only (as we assert).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 14th Topic, ‘The Mediatorial Office of Christ’, Question 14, sections 9-11, pp. 458-59</span></figcaption>

<blockquote><p>They [the anti-predestinarians] also grant that ‘Christ died for us all’ and infer from this that his benefits are common to everyone. We gladly grant this, too, if we are considering only the worthiness of the death of Christ, for it might be sufficient for all the world’s sinners. Yet even if in itself it is enough, yet it did not have, nor has, nor will have effect in all men. The [Medieval] Scholastics also acknowledge the same thing when they affirm that Christ redeemed all men sufficiently but not effectually.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Predestination &amp; Justification</cite>, tr. Frank A. James (Kirksville, Missouri: Sixteenth Century Essays &amp; Studies, 2003), vol. 8, p. 62</span></figcaption>

</figure><figure class="quote" id="q-7d8442c03d" data-kw="intention elect only">

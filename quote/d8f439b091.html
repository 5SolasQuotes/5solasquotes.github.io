<blockquote><p>…that if a believer has been warned, that what is set before him has been offered to an idol, and sees that there is a danger of offense being given, he sins against the brethren if he does not abstain.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf253bce9f" data-kw="">
<blockquote><p>…it is further confirmed by that great scandal whereby Peter compelled the Gentiles to judaize, Gal. 2:14. ‘He constrained them,’ says Perkins (Commentary on Gal. 2:14), ‘by the authority of his example, whereby he caused them to think that the observation of the Ceremonial Law was necessary.’ It was then the quality of his action which made the scandal active, because that which he did was inductive to sin; but we are not to think that Peter had an intention to draw the Gentiles to sin. (tome 1, an. 55, n. 39)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637) | pt. 2, ch. 9</cite>, pp. 39-40</span></figcaption>

</figure><figure class="quote" id="q-1b10df61f8" data-kw="">
<blockquote><p>2. The apostle [Peter] would have Christians in a special manner careful that they offend not the laws of the princes of this world; this appears in that he enjoins [in 1 Pet. 2:13 ff.] them the duties of subjects first, and in that they do teach them the duty of submission, both in this and other Scriptures with great force and violence (as it were) of arguments… Fiftly, because perversness and contempt, and careless neglect of the laws of princes many times proves scandalous, and we must not offend them that are without, 1 Cor. 10:2; Col. 4:5. Many that were somewhat inclined to embrace the sincerity of the Gospel, have been cast back, and profess that therefore they abhor such people because they observe their disobedience against human government, either through indiscretion or nice scruples, or perverse willfulness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter... (London, 1623), on 1 Pet. 2:13</cite>, pp. 560-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

</figure><figure class="quote" id="q-5930dd7363" data-kw="">
<blockquote><p>Thirdly, suffer thyself to be over-borne in things indifferent by the authority of the Church, till thou be able to prove it simply unlawful, or to prove that there is a greater scandal in the use of it than in disobeying the voice of the Church and of the Christian magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randal.html">John Randal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Richard Lytler, The Reformed Presbyterian, humbly offering to the consideration of all pious and peaceable spirits several arguments for obedience to the Act for Unifromity, as the way to unity... (London, 1662), ch. 14, p. 138. Randal (1570–1622) was a puritan minister. Robert Bolton was his pupil.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

</figure><figure class="quote" id="q-dd6eb3c3f5" data-kw="">
<blockquote><p>Lastly, there is difference in the faulty carriage of the persons: and that on both parts; especially on ours. For though our non-conforming brethren condemn us [conformists] with much liberty of speech and spirit, having yet less reason for it than the weak Romans had [in ch. 14] (for the strong among them might have forborn some things for the weak’s sake; and it would well have become them for the avoiding of scandal so to have done; which we cannot do without greater scandal in the open contempt of lawful authority…</p></blockquote>

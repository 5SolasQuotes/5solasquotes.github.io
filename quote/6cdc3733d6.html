<main class="wrap"><figure class="quote" id="q-6cdc3733d6" data-kw="">
<blockquote><p>I. Children of pagans, of whatever age and however they have come into the power of Christians, whether legitimately or illegitimately, if they are taken into Christian families as their slaves or servants, who can be manumitted [released] again at their masters’ pleasure and ejected from Christian families, should not be baptized, but should first be taught the Christian religion, and a confession of the same should be required from them before they are admitted to baptism. For such children of pagans are not and should not be considered members of the visible church either by right of birth or by right of adoption into Christian families. Not by right of birth, for they are born outside the church from unbelieving and polluted parents, and therefore they themselves are also rightly considered unbelieving and polluted, according to 1 Corinthians 7:14. Not by right of adoption into Christian families, for this, if it is done only for the sake of servitude and with reserved liberty of expulsion, makes no one a member of the church. For thus in the Old Testament, in the families of faithful patriarchs, and in the time of the primitive apostolic church in Christian families, many children were born from pagan servants, who nevertheless were outside the church no less than their parents, and were not considered its members, until their parents, having abandoned paganism, transferred to the Jewish or Christian religion and brought their children with them to the church. Nor does the example of Abraham in Genesis 17 stand opposed [to our position], who also circumcised those bought with money and foreigners. For Abraham did not force such unwilling ones to circumcision, nor did he admit them while still unbelieving, for otherwise God’s covenant would have been profaned. Instead, he first instructed them in the doctrine of the covenant and circumcised those who embraced that doctrine along with their infants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/no.html">No</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Hessian Delegation at the Synod of Dordt on the Baptism of Slave Children’ tr. Michael Lynch from Early Sessions of the Synod of Dordt (V&amp;R, 2018), pp. 134-36 at Translationes Lyncei</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d546e837e5" data-kw="">
<blockquote><p>Nor yet do [they, the apostles] make their being of a household simply the ground of their being baptized; for I confess there may be diverse in and of a houshold, that in some case, that is, of positive refusing to stoop to the Gospel, may not be baptized; as an unbelieving wife, servant, or child grown, they are by persuasion to be won in, or else let alone, this springing from the foresaid ground of not forcing ordinances upon men: But I make the grounds of their baptism: the tenor of the commission that bids them [ministers to] disciple all the gentiles, and of the gospel holding forth grace to all, one and other, no man being common or unclean in that respect in God’s account, but as they render themselves so by their willing rejections of the grace tendered to them, with their being under the tuition of those that profess faith, and subjection to the doctrine of Christ, and the non-resistance found in them, and the duty lying upon parents to bring them up in the nurture and admonition of the Lord. Whence it is to be noted, that it’s said of the jailor, he and all his, not all his ‘houshold’, but all ‘his’ were baptized; possibly some in the house might not be in his [to] dispose, but so many as were his were baptized. If any man say, its an act of force to disciple an infant; I say no, of no more force to baptize them to Christ, than to lay them in their cradles or carry them in their arms; they have no will nor reluctancy against it, ye may do with them what ye will: whence they are a pattern of right entring the Kingdom: ‘He that receives not the Kingdom of God as a little child,’ etc. They receive it as God and his people order them into it, and in it. And for their discipling by instruction, they usually, if well educated, drink it in, and submit to it better than others, as to the outward profession at least, as was before said. And I find not that baptism was ever denied to any that would submit themselves to learn the Christian profession… …who yet when they [infants] came to years of understanding, owning what was in infancy done to them, were never therefore reputed members of the Church or proselytes by compulsion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-horn.html">John Horn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>…A Consideration of Infant Baptism, wherein the grounds of it are laid down… and many things of Mr Tombes [a Baptist] about it… Answered… (London, 1654), pp. 38-9 Horn (1614-1676) was an English minister.</cite></span></figcaption>

</figure><figure class="quote" id="q-3e86cdf760" data-kw="">
<blockquote><p>This place destroyeth the opinion of them that would not have children to be baptized, and their opinion also, that make baptism the very cause of salvation. For the children of the faithful are holy, by virtue of the Covenant, even before Baptism, and Baptism is added [sic] at the seal of that holiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The New Testament of our Lord Jesus Christ, translated out of Greek by Theodore Beza… (London, 1599) | On 1 Cor. 14</cite></span></figcaption>

</figure><figure class="quote" id="q-363ccf782c" data-kw="">
<blockquote><p>Therefore, when we say that the proper power of outward baptism resides in being a seal, we mean two things: firstly, that it makes more certain the promised grace that the principal cause has conferred or is to confer, and secondly that it strengthens and increases that grace. But since that promise is not absolute but linked to the condition of faith and repentance, it follows that the grace is sealed only to those who believe and repent, and consequently do not use the signs in a unworthy manner, as the apostle says in 1 Corinthians 11:29. In this regard we grant that this sacrament–just like the other ones–is also exhibitive of the thing that is promised, because in the lawful and worthy use of this sacrament these things that are promised are through the Holy Spirit not merely offered to believers but they are in fact exhibited to and conferred upon them. For God is truthful in sealing his promises, and our sacraments are not supplements of a letter that kills, but of the life-giving Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synposis of a Purer Theology (Brill, 2020), vol. 3, Disputation 44, ‘On the Sacrament of Baptism’, sections 31-32</cite>, p. 155</span></figcaption>

</figure><figure class="quote" id="q-7516cb2aa2" data-kw="">
<blockquote><p>Those who are to be admitted to this sacrament must be found to have a competent knowledge of the fundamentals of the Christian religion, and to be of such an inoffensive walk and conversation, both towards God and their neighbors, that they are not known to be guilty of any scandal that merits church-censure. By the 12th chapter of the French Church Discipline, article 2, persons shall not be admitted to the Lord’s Supper till they be above twelve years of age. But I am sure, if children at nine years of age can express themselves piously and knowingly, showing that they have the grace signified and promised, the seal of the promise cannot warrantably be denied unto them.</p></blockquote>

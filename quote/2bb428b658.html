<blockquote><p>Now because lots may say to cards what Naomi said to Boaz, ‘They are near unto us, and of our affinity,’ something also of the use of them. It were no great harm if there were no other cards used than those of clothiers about wool and of mariners in the ship. But as for cards to play with, let us not wholly condemn them, lest lacing our consciences too straight we make them to grow awry on the wrong side. Such recreations are lawful if we use them as Jonathan tasted the honey, putting forth the end of his rod he touched a little of it, and his eyes were cleared. But let us take heed of a surfeit into which those do fall who either play out of covetousness, or for more than their estates can bear, or constantly and continually; all their meat is sauce, all the days in their almanac play-days, though few holy-days. The Creation lasted but a week, but these men’s recreations all the days of their lives; such using of lawful exercises is altogether unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-fuller.html">Thomas Fuller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Collection of Sermons</cite>, … together with Notes upon Jonah (London: Stafford, 1655-1657), on Jonah 1:7, pp. 40-41</span></figcaption>

<blockquote><p>§44. 4. And though the taking of an oath be a sort of worship, yet not the natural worship of the First Commandment, nor the instituted of the Second, but the reverent use of his name in the third; so that it is not primarily an act of worship, but reductively and consequentially: It being the principal use of an oath to confirm the truth and end strife, by appealing to God, which appellation is indeed an acknowledgment of his government and justice. And the laying the hand upon the book, or kissing it, is but a professing sign of my own intentions, such as my words themselves are: and therefore is left to human choice, and a lawful thing. And I have met but with very few [non-conformists], among all our ceremonies, that questioned this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, pp. 411-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

<blockquote><p>§35. Question 28: May one person disoblige another of a promise made to him? Answer: Yes, if it be no more than a promise to that person: because a man may give away his right. But if it be moreover a vow to God, or you intend to oblige yourself in point of veracity under the guilt of a lie if you do otherwise, these alter the case and no person can herein disoblige you. §36. Question 29. But what if the contract be bound by an oath, may another then release me? Answer: Yes, if that oath did only tie you to perform your promise and were no vow to God which made him a party by dedicating anything to Him: For then the oath being but subservient to the promise, he that discharges you from the promise, discharges you also from the oath which bound you honestly to keep it. §37. Question 30: Am I bound by a promise when the cause or reason of it proves a mistake? Answer: If by the cause you mean only the extrinsic reasons which moved you to it, you may be obliged nevertheless for finding your mistake: Only so far as the other was the culpable cause (as is aforesaid) he is bound to satisfy you: But if by the cause you mean the formal reason, which constitutes the contract, then the mistake may in some cases nullify it (of which enough before). §38. Question 31. What if a following accident make it more to my hurt than could be foreseen? Answer: In some contracts it is supposed or expressed that men do undertake to run the hazard: and then they must stand obliged. But in some contracts, it is rationally supposed that the parties intend to be free if so great an alteration should fall out. But to give instances of both these cases would be too long a work. §39. Question 32: What if something unexpectedly fall out which makes it injurious to a third person? I sure cannot be obliged to injure another. Answer: If the case be the latter mentioned in the foregoing answer, you may be thus free: But if it be the former (you being supposed to run the hazard and secure the other party against all others) then either you were indeed authorized to make this bargain or not: If not, the third person may secure his right against the other. But if you were, then you must make satisfaction as you can to the third person. Yet, if you made a covenant without authority, you are obliged to save the other harmless, unless he knew your power to be doubtful and did resolve to run the hazard. §40. Question 33: What if somewhat fall out which makes the performance to be a sin? Answer: You must not do it: But you must make the other satisfaction for all the loss which you were the cause of unless he undertook to stand to the hazard of this also (explicitly or implicitly). §41. Question 34: Am I obliged if the other break covenant with me? Answer: There are covenants which make relations (as between husband and wife, pastor and flock, rulers and subjects), and covenants which convey title to commodities, of which only I am here to speak. And in these there are some conditions which are essential to the covenant: If the other first break these conditions, you are disobliged. But there are other conditions which are not essential, but only necessary to some following benefit: whose non-performance will only forfeit that particular benefit: and there are conditions which are only undertaken subsequent duties, trusted on the honesty of the performer: And in these a failing does not disoblige you. These latter are but improperly called conditions. §42. Question 35: May I contract to perform a thing which I foresee is like to become impossible or sinful before the time of performance come, though it be not so at present. Answer: With all persons you must deal truly; and with just contractors, openly: But with thieves and murderers, and persecutors, you are not always bound to deal openly. This being premised, either your covenant is absolutely, ‘This I will do, be it lawful or not, possible or impossible’: and such a covenant is sin and folly. Or it is conditional, ‘This I will do, if it continue lawful or possible.’ This condition (or rather exception) is still implied where it is not expressed, unless the contrary be expressed: Therefore such a covenant is lawful with a robber with whom you are not bound to deal openly: because it is but the concealing from him the event which you foresee. As e.g. you have intelligence that a ship is lost at sea, or is like to be shortly taken by pirates, which the robber expects shortly to come safe into the harbor: You may promise him to deliver up yourself his prisoner when that ship comes home. Or you know a person to be mortally sick and will die before the next week: you may oblige yourself to marry or serve that person two months hence: For it is implied if he or she be then alive. But with equal contractors, this is unlawful, with whom you are obliged not only to verity, but to justice, as in the following cases will be further manifested.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London, 1673) | pt. 4, ch. 19, title 2, pp. 119-20</span></figcaption>

— Richard Baxter, A Christian Directory... (London, 1673) | pt. 4, ch. 19, title 2, pp. 119-20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A735.+Question+28%3A+May+one+person+disoblige+another+of+a+promise+made+to+him%3F+Answer%3A+Yes%2C+if+it+be+no+more+than+a+promise+to+that+person%3A+because+a+man+may+give+away+his+right.+But+if+it+be+moreover+a+vow+to+God%2C+or+you+intend+to+oblige+yourself+in+point+of+veracity+under+the+guilt+of+a+lie+if+you+do+otherwise%2C+these+alter+the+case+and+no+person+can+herein+disoblige+you.+%C2%A736.+Question+29.+But+what+if+the+contract+be+bound+by+an+oath%2C+may+another+then+release+me%3F+Answer%3A+Yes%2C+if+that+oath+did+only+tie+you+to+perform+your+promise+and+were+no+vow+to+God+which+made+him+a+party+by+dedicating+anything+to+Him%3A+For+then+the+oath+being+but+subservient+to+the+promise%2C+he+that+discharges+you+from+the+promise%2C+discharges+you+also+from+the+oath+which+bound+you+honestly+to+keep+it.+%C2%A737.+Question+30%3A+Am+I+bound+by+a+promise+when+the+cause+or+reason+of+it+proves+a+mistake%3F+Answer%3A+If+by+the+cause+you+mean+only+the+extrinsic+reasons+which+moved+you+to+it%2C+you+may+be+obliged+nevertheless+for+finding+your+mistake%3A+Only+so+far+as+the+other+was+the+culpable+cause+%28as+is+aforesaid%29+he+is+bound+to+satisfy+you%3A+But+if+by+the+cause+you+mean+the+formal+reason%2C+which+constitutes+the+contract%2C+then+the+mistake+may+in+some+cases+nullify+it+%28of+which+enough+before%29.+%C2%A738.+Question+31.+What+if+a+following+accident+make+it+more+to+my+hurt+than+could+be+foreseen%3F+Answer%3A+In+some+contracts+it+is+supposed+or+expressed+that+men+do+undertake+to+run+the+hazard%3A+and+then+they+must+stand+obliged.+But+in+some+contracts%2C+it+is+rationally+supposed+that+the+parties+intend+to+be+free+if+so+great+an+alteration+should+fall+out.+But+to+give+instances+of+both+these+cases+would+be+too+long+a+work.+%C2%A739.+Question+32%3A+What+if+something+unexpectedly+fall+out+which+makes+it+injurious+to+a+third+person%3F+I+sure+cannot+be+obliged+to+injure+another.+Answer%3A+If+the+case+be+the+latter+mentioned+in+the+foregoing+answer%2C+you+may+be+thus+free%3A+But+if+it+be+the+former+%28you+being+supposed+to+run+the+hazard+and+secure+the+other+party+against+all+others%29+then+either+you+were+indeed+authorized+to+make+this+bargain+or+not%3A+If+not%2C+the+third+person+may+secure+his+right+against+the+other.+But+if+you+were%2C+then+you+must+make+satisfaction+as+you+can+to+the+third+person.+Yet%2C+if+you+made+a+covenant+without+authority%2C+you+are+obliged+to+save+the+other+harmless%2C+unless+he+knew+your+power+to+be+doubtful+and+did+resolve+to+run+the+hazard.+%C2%A740.+Question+33%3A+What+if+somewhat+fall+out+which+makes+the+performance+to+be+a+sin%3F+Answer%3A+You+must+not+do+it%3A+But+you+must+make+the+other+satisfaction+for+all+the+loss+which+you+were+the+cause+of+unless+he+undertook+to+stand+to+the+hazard+of+this+also+%28explicitly+or+implicitly%29.+%C2%A741.+Question+34%3A+Am+I+obliged+if+the+other+break+covenant+with+me%3F+Answer%3A+There+are+covenants+which+make+relations+%28as+between+husband+and+wife%2C+pastor+and+flock%2C+rulers+and+subjects%29%2C+and+covenants+which+convey+title+to+commodities%2C+of+which+only+I+am+here+to+speak.+And+in+these+there+are+some+conditions+which+are+essential+to+the+covenant%3A+If+the+other+first+break+these+conditions%2C+you+are+disobliged.+But+there+are+other+conditions+which+are+not+essential%2C+but+only+necessary+to+some+following+benefit%3A+whose+non-performance+will+only+forfeit+that+particular+benefit%3A+and+there+are+conditions+which+are+only+undertaken+subsequent+duties%2C+trusted+on+the+honesty+of+the+performer%3A+And+in+these+a+failing+does+not+disoblige+you.+These+latter+are+but+improperly+called+conditions.+%C2%A742.+Question+35%3A+May+I+contract+to+perform+a+thing+which+I+foresee+is+like+to+become+impossible+or+sinful+before+the+time+of+performance+come%2C+though+it+be+not+so+at+present.+Answer%3A+With+all+persons+you+must+deal+truly%3B+and+with+just+contractors%2C+openly%3A+But+with+thieves+and+murderers%2C+and+persecutors%2C+you+are+not+always+bound+to+deal+openly.+This+being+premised%2C+either+your+covenant+is+absolutely%2C+%E2%80%98This+I+will+do%2C+be+it+lawful+or+not%2C+possible+or+impossible%E2%80%99%3A+and+such+a+covenant+is+sin+and+folly.+Or+it+is+conditional%2C+%E2%80%98This+I+will+do%2C+if+it+continue+lawful+or+possible.%E2%80%99+This+condition+%28or+rather+exception%29+is+still+implied+where+it+is+not+expressed%2C+unless+the+contrary+be+expressed%3A+Therefore+such+a+covenant+is+lawful+with+a+robber+with+whom+you+are+not+bound+to+deal+openly%3A+because+it+is+but+the+concealing+from+him+the+event+which+you+foresee.+As+e.g.+you+have+intelligence+that+a+ship+is+lost+at+sea%2C+or+is+like+to+be+shortly+taken+by+pirates%2C+which+the+robber+expects+shortly+to+come+safe+into+the+harbor%3A+You+may+promise+him+to+deliver+up+yourself+his+prisoner+when+that+ship+comes+home.+Or+you+know+a+person+to+be+mortally+sick+and+will+die+before+the+next+week%3A+you+may+oblige+yourself+to+marry+or+serve+that+person+two+months+hence%3A+For+it+is+implied+if+he+or+she+be+then+alive.+But+with+equal+contractors%2C+this+is+unlawful%2C+with+whom+you+are+obliged+not+only+to+verity%2C+but+to+justice%2C+as+in+the+following+cases+will+be+further+manifested.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory...+%28London%2C+1673%29+%7C+pt.+4%2C+ch.+19%2C+title+2%2C+pp.+119-20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F459b617b88.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/459b617b88.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-oaths-vows/#:~:text=35.%20Question%2028%3A%20May%20one%20person,following%20cases%20will%20be%20further%20manifested&amp;text=35.%20Question%2028%3A%20May%20one%20person%20disoblige%20another&amp;text=in%20the%20following%20cases%20will%20be%20further%20manifested" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

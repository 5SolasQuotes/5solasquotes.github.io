<main class="wrap"><figure class="quote" id="q-9b5e0d91da" data-kw="">
<blockquote><p>Very many passages of Holy Scriptures (of which some are adduced by Bellarmine; but almost numberless others might be added to them, Heb. 10:36; 1 Tim. 2:15; Phil. 2:12… 2 Cor. 7:10 &amp; 4:17… Rom. 8:13,17 &amp; 10:10; Mt. 25:34-35… and in verse 21 of the same chapter according to the vulgate translation… James 1:25 &amp; 2:14; Gal. 6:8… Rev. 7:14-15… most clearly demonstrate that in adult persons good works have to salvation not merely the relation ‘of order’ (as besides others, Paraeus frigidly answers)… but also a causal relation, such as is the relation of a cause efficient or aiding, after its own manner and place, to its effect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, p. 309 of Book 4, ‘Of the Justice of Works’, ch. 1, ‘Of the Necessity of Good Works to Salvation, and the Coincident Questions…’ in A Fair &amp; Calm Consideration of the Modern Controversy Concerning Justification, as it is Explained in the Five Books of Cardinal Bellarmine in Modest &amp; Pacifying Considerations of Controversies, vol. 1 (Oxford, 1850)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Very many passages of Holy Scriptures (of which some are adduced by Bellarmine; but almost numberless others might be added to them, Heb. 10:36; 1 Tim. 2:15; Phil. 2:12… 2 Cor. 7:10 &amp; 4:17… Rom. 8:13,17 &amp; 10:10; Mt. 25:34-35… and in verse 21 of the same chapter according to the vulgate translation… James 1:25 &amp; 2:14; Gal. 6:8… Rev. 7:14-15… most clearly demonstrate that in adult persons good works have to salvation not merely the relation ‘of order’ (as besides others, Paraeus frigidly answers)… but also a causal relation, such as is the relation of a cause efficient or aiding, after its own manner and place, to its effect.”

— William Forbes, p. 309 of Book 4, ‘Of the Justice of Works’, ch. 1, ‘Of the Necessity of Good Works to Salvation, and the Coincident Questions…’ in A Fair &amp; Calm Consideration of the Modern Controversy Concerning Justification, as it is Explained in the Five Books of Cardinal Bellarmine in Modest &amp; Pacifying Considerations of Controversies, vol. 1 (Oxford, 1850)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVery+many+passages+of+Holy+Scriptures+%28of+which+some+are+adduced+by+Bellarmine%3B+but+almost+numberless+others+might+be+added+to+them%2C+Heb.+10%3A36%3B+1+Tim.+2%3A15%3B+Phil.+2%3A12%E2%80%A6+2+Cor.+7%3A10+%26+4%3A17%E2%80%A6+Rom.+8%3A13%2C17+%26+10%3A10%3B+Mt.+25%3A34-35%E2%80%A6+and+in+verse+21+of+the+same+chapter+according+to+the+vulgate+translation%E2%80%A6+James+1%3A25+%26+2%3A14%3B+Gal.+6%3A8%E2%80%A6+Rev.+7%3A14-15%E2%80%A6+most+clearly+demonstrate+that+in+adult+persons+good+works+have+to+salvation+not+merely+the+relation+%E2%80%98of+order%E2%80%99+%28as+besides+others%2C+Paraeus+frigidly+answers%29%E2%80%A6+but+also+a+causal+relation%2C+such+as+is+the+relation+of+a+cause+efficient+or+aiding%2C+after+its+own+manner+and+place%2C+to+its+effect.%E2%80%9D%0A%0A%E2%80%94+William+Forbes%2C+p.+309+of+Book+4%2C+%E2%80%98Of+the+Justice+of+Works%E2%80%99%2C+ch.+1%2C+%E2%80%98Of+the+Necessity+of+Good+Works+to+Salvation%2C+and+the+Coincident+Questions%E2%80%A6%E2%80%99+in+A+Fair+%26+Calm+Consideration+of+the+Modern+Controversy+Concerning+Justification%2C+as+it+is+Explained+in+the+Five+Books+of+Cardinal+Bellarmine+in+Modest+%26+Pacifying+Considerations+of+Controversies%2C+vol.+1+%28Oxford%2C+1850%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9b5e0d91da.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9b5e0d91da.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=Very%20many%20passages%20of%20Holy%20Scriptures,manner%20and%20pla </figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-245cbc81d0" data-kw="">
<blockquote><p>Of what then does our Lord in this place [Mt. 25:35,42] say that the god works of the holy are the cause; for they are added with the causal conjunction ‘for I was an hungered.’ etc.? They are the cause of the full attainment to and enjoyment of this kingdom, not of the right to it… God therefore makes the good works of those who are His, causes both of increasing and daily perfecting their salvation, and at length of fully enjoying it also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputata Ratisbonae</cite>, … De Justificatione, et locis doctrinae Euangelicae omnibus, quos doctrina de Iustificatione complectitur… (1548) as translated in Forbes, Justification, p. 311. Rutherford quotes from this work of Bucer to the same effect as below approvingly in his Examination, pp. 531-531., p. 94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

— Martin Bucer, Disputata Ratisbonae, in altero colloqui, Anno XLVI. Et Collocutorum Augustanae Confessionis Responsa … De Justificatione, et locis doctrinae Euangelicae omnibus, quos doctrina de Iustificatione complectitur… (1548) as translated in Forbes, Justification, p. 311. Rutherford quotes from this work of Bucer to the same effect as below approvingly in his Examination, pp. 531-531., p. 94">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COf+what+then+does+our+Lord+in+this+place+%5BMt.+25%3A35%2C42%5D+say+that+the+god+works+of+the+holy+are+the+cause%3B+for+they+are+added+with+the+causal+conjunction+%E2%80%98for+I+was+an+hungered.%E2%80%99+etc.%3F+They+are+the+cause+of+the+full+attainment+to+and+enjoyment+of+this+kingdom%2C+not+of+the+right+to+it%E2%80%A6+God+therefore+makes+the+good+works+of+those+who+are+His%2C+causes+both+of+increasing+and+daily+perfecting+their+salvation%2C+and+at+length+of+fully+enjoying+it+also.%E2%80%9D%0A%0A%E2%80%94+Martin+Bucer%2C+Disputata+Ratisbonae%2C+in+altero+colloqui%2C+Anno+XLVI.+Et+Collocutorum+Augustanae+Confessionis+Responsa+%E2%80%A6+De+Justificatione%2C+et+locis+doctrinae+Euangelicae+omnibus%2C+quos+doctrina+de+Iustificatione+complectitur%E2%80%A6+%281548%29+as+translated+in+Forbes%2C+Justification%2C+p.+311.+Rutherford+quotes+from+this+work+of+Bucer+to+the+same+effect+as+below+approvingly+in+his+Examination%2C+pp.+531-531.%2C+p.+94&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F245cbc81d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/245cbc81d0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=Of%20what%20then%20does%20our%20Lord,length%20of%20fully%20enjoying%20it%20also&amp;text=Of%20what%20then%20does%20our%20Lord%20in%20this&amp;text=and%20at%20length%20of%20fully%20enjoying%20it%20also" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d93e854d06" data-kw="">
<blockquote><p>First therefore take notice what we mean by good works. We take not good works strictly, for the works of charity or liberality; nor for any external actions of religion, which may be done where the heart is not cleansed; much less for the Popish good works of supererogation: but for the graces of God’s Spirit in us, and the actions flowing from them: For, usually, with the Papists and Popish persons, good works are commonly called those superstitious and supererogant works, which God never commanded: or, if God has commanded them, they mean them as external and sensible; such as coming to church and receiving of sacraments; not internal and spiritual faith, and a contrite spirit, which are the soul of all duties: and if these be not there, the outward duties are like clothes upon a dead man, that cannot warm him, because there is no life within. Therefore much is required even to the essence of a godly work, though it be not perfect in degrees: As:

1. It must be commanded by God.

2. It must be wrought in us by the Spirit of God. All the unregenerate man’s actions, his prayers, and services are sins.

3. It must flow from an inward principle of grace, or a supernatural being in the soul, whereby a man is a new creature.

4. The end must be God’s glory. That which the most refined man can do is but a glow-worm, not a star: So that then only is the work good, when, being answerable to the rule, it’s from God, and through God, and to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis</cite>, … (London: Young, 1647), Lecture 4, p. 39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-4322decca7" data-kw="">

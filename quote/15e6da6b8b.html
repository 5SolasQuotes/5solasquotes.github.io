<main class="wrap"><figure class="quote" id="q-15e6da6b8b" data-kw="">
<blockquote><p>Thirteenthly, [it is superstition] that it is simply unlawful to use a form of prayer or to read a prayer on a book. Fourteenthly, that if a school-master impose a form upon a scholar, or a parent on a child, it makes it become unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 58, p. 290</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5b0ff10da8" data-kw="">
<blockquote><p>The ritual of Calvinism, like its creed, was founded, therefore, on the theory of a simple return to the scriptural and primitive pattern. Differing from the systems of Luther and [the English] Cranmer, it lost sight completely of all practices which had originated in a less remote antiquity; it left the missal and the breviary [Romanist responsive, liturgical books] among the rubbish of ‘idolatrous gear’ swept out from its renovated churches; refusing to tamper with the complications of a corrupt ceremonial, whose forms had long enough weighed upon and wearied the souls of men. It went back for authority and inspiration to the law and to the testimony of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/switzerland-geneva.html">Switzerland Geneva</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dr. Charles Baird, Eutaxia</cite>, (1855. rep. 1960), ch.1, ‘Calvin and the Church of Geneva’, pp. 20</span></figcaption>

</figure><figure class="quote" id="q-c8631a09ca" data-kw="">
<blockquote><p>To the kirks where no ministers can be had presently, must be appointed the most apt men that distinctly can read the common prayers and the scriptures, to exercise both themselves and the kirk, till they grow to greater perfection; and in process of time he that is but a reader may attain to the further degree, and by consent of the kirk and discreet ministers, may be permitted to minister the sacraments;</p></blockquote>

</figure><figure class="quote" id="q-14172bfe30" data-kw="">
<blockquote><p>…for you lay down as an undeniable principle, and the basis of your whole doctrine of independent government that there are no visible Churches in the world but a congregation meeting in one place to worship God, which I have demonstrated to be most false… so, though a congregation may only be actually seen when it is convened within the four angles of a material house, yet all the congregations on earth make one visible Church, and have some visible and audible acts of external government common to all, as that all pray, praise, fast, mourn, rejoice, one with another; and are to rebuke, exhort, comfort one another and to censure one another, so far as is possible, and of right and by law meet in one council, and so by Christ’s institution are that way visible, that a single congegation is visible which meets in one house, though many be absent de facto, through sickness, callings, imprisonment and some through sinful neglect;</p></blockquote>

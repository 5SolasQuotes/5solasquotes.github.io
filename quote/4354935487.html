<main class="wrap"><figure class="quote" id="q-4354935487" data-kw="">
<blockquote><p>Christ weeps to us in the law, but we do not lament; and He pipes to us in the gospel, but we do not dance: He is willing to draw us with the cords of men and with the bands of love, and yet we will not have Him to reign over us… Christ has now given us the first and second summons, the day is approaching when the sad and woeful summons shall be sent against us, of departing from Him into these everlasting flames, out of which there is no redemption.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1cf9912c79" data-kw="">
<blockquote><p>…these considerations must be premised: 1. That mercy is otherwise in God than in man: in man indeed it is a grief or compassion conceived upon another’s misery: but in God it is only a propension and readiness of the divine will to help those which are in misery. 2. Mercy in God either signifies the inclination, power, faculty and property to show mercy, and this is natural in God: or the act and exercising of that property toward the creature, and this is so natural in God as yet it is directed by his will. 3. A thing is said to be natural two ways: Either that which only proceeds from the instinct of nature, as the fire naturally burns: or that whereunto nature inclines, yet not without direction of the will, as thus a man is said to speak, to understand naturally: So God is both ways naturally merciful, in Himself the first way; toward his creatures the second. Now to the arguments we answer: 1. The apostle [in Rom. 9:18] speaks not of the natural property, but of the act of mercy, which is directed by the will of God. 2. All the natural properties which are in God He always uses not, nor towards all: as his justice, power, longanimity, mercy: they are always in God, but He exercises them as it pleases Him. 3. Justice and mercy are not contrary, but cruelty is opposed to mercy: neither is there any contrariety in God, but in the effects in diverse subjects: as the Sun with the same heat mollifies the wax and hardens the clay. 4. Neither are these properties unequal in God, but the effects and acts only are unequal, as it pleases God to dispose in his freewill.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla, that is a Six-fold Commentary upon… Romans... (Lege, 1611) | on ch. 9, Places of Controversy, Controversy 12, Whether mercy be a natural property in God, or an effect only of his will, against Socinus?</cite></span></figcaption>

</figure><figure class="quote" id="q-688db4ad07" data-kw="">
<blockquote><p>Thesis XII: The impulsive efficient [cause], that is, that because of which we have been chosen, is the benevolent disposition of the will of God, or the εὐδοκία, or good pleasure, of the divine will. Explanation: I. It is a question among us, the Lutherans, and the Papists: What moved or impelled God (it is permitted to us to make use of these words, which rather agree with the decrees of men, and are accommodated to our capacity: for properly speaking no impulsive cause of the divine will is granted, as we saw above) to decree to grant eternal life to certain men? We respond: That God was moved by no other thing to determine eternal life for certain ones, than by the benevolent disposition of His will, or His own good pleasure. There are principally two foundations of our opinion: (1.) Because the Scripture names this alone as the cause of election. Ephesians 1:5, He predestinated us, whom He would adopt as Sons through Jesus Christ unto Himself, according to the benevolent disposition of His own will…</p></blockquote>

<blockquote><p>3. In the moral providence of God, is there a place for an ineffective wish? XIII. It is asked, third, whether in the moral providence of God, there is a place for some ineffective wish or desire of God. The Pelagians and Pelagianizers—Socinians, Jesuits, Arminians, and others—because they argue for a self-determined free choice that God cannot determine, and because likewise they argue for a conditioned antecedent will in God, by which God wills if a person wills, and likewise by which he wills that each and every person be saved, if only they will it, say that there is in God a wish properly so-called, by which God desires that this or that duty be done by man, but he desires it in vain. The Reformed acknowledge no sort of wish and desire in God, except that which coincides with his commandment, different from it in this alone, that whereas a commandment urges a duty only by the authority of the lawgiver, a wish urges it by a motive drawn from a certain eminent advantage which is certainly set to fall from that duty upon him who obeys. We examined the reasons on both sides in book 2, chapter 15, §XXXII.</p></blockquote>

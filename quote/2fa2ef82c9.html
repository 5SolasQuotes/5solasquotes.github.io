<blockquote><p>Hypothetical universalism reduces the propitiation of the Son of God to a potentiality. The cross actually achieves nothing, it only makes sinners potentially salvable. Definite atonement, or better simply ‘atonement,’ truly glories in the ‘finished work’ of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ian-hamilton.html">Ian Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Amyraldianism—Is it Modified Calvinism? (Great Britain: EPCEW, 2003)</cite>, p. 20</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-87bc282954" data-kw="">
<blockquote><p>But if to believe that Christ died for oneself is the same thing as to believe that the death of Christ is sufficient of itself to expiate one’s sins, we do not deny that reprobates are also bound to believe this: which is perfectly true, whether they believe it, or not. For, the value of Christ’s death is such, that it is of itself sufficient for the altogether complete expiation of the sins of all men, even if they should be ten thousand times more: even if God did not determine it for the expiation of the sins of all. So indeed in this controversy it is customary among many to make a distinction, that they say, that Christ died sufficiently for all, even reprobates; but efficiently only for the elect: which words, suitably explained, and applied to amplify the value of the merit of Christ, we readily admit: even if we have not made use of this distinction from the beginning: because the impropriety in the words appears to be overly harsh. For to [have] died for someone, if we speak properly, is to die for the favor of someone, or in the place of someone, so that he might be delivered from death: and if a voluntary death is met for another, it presupposes the greatest possible love, as Christ testifies, Jn. 15:13. Now, if you should add, ‘sufficiently only, not efficiently’, this not very suitable sense will emerge: Christ, impelled by the greatest possible charity, died in the place of reprobates, so that they might be delivered from death, sufficiently indeed, but not efficiently, that is, they are never actually delivered. Those that say, that Christ dies also for reprobates, not indeed so that they might actually be delivered, but so that they might be able to be delivered, tacitly suppose (or they really do not say anything relevant), that it is in the power and ability of reprobates to apprehend Christ’s offered merit by faith: since without faith they are not even able to be delivered. Likewise (which I wish properly to be observed), that God decreed from eternity to save all men and each through Christ, under this condition, that they believe upon Christ, the Redeemer of all men and each. Which no Orthodox theologian would admit, as Pelagian or Semi-pelagian dogma. I leave unmentioned, that God foreknew from eternity, that a great many were not going to believe, and that He decreed that He was not going to give faith to them, which is not able to be had, except with Him freely giving. Why then would He have decree salvation, and have determined means of salvation, that is, the death of His Son, under a condition, which He foreknew that He was not going to fulfill, and the ability of the fulfilling of which He denied in His eternal decree. Not even man plans so imprudently. But let us dismiss these things. Nevertheless, we think that it is more rightly and plainly said, that the death of Christ is sufficient in itself for the expiation of all the sins of men, than, Christ died sufficiently for all, even reprobates.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd ed. (1634), Species of the Office of Christ, pt. 3 Wendelin admits that Christ died for the world to make a sufficient atonement for all, yet Christ dying for someone properly means to deliver them; hence he does not like the language of Christ dying for all sufficiently. He then argues against hypothetical universalism.</cite></span></figcaption>

</figure><figure class="quote" id="q-fbf177cc5d" data-kw="">
<blockquote><p>The Confession, therefore, must be regarded as teaching, that it is not true of any but the elect only that they are redeemed by Christ, any more than it is true that any others are called, justified, or saved. Here I may remark by the way, that though many modern defenders of a universal atonement regard the word redemption as including the application as well as the impetration of pardon and reconciliation, — and, in this sense, disclaim the doctrine of universal redemption, — yet a different phraseology was commonly used in theological discussions about the period at which the Confession was prepared, and in the seventeenth century generally. Then the defenders of a universal atonement generally maintained, without any hesitation, the doctrine of universal redemption, — using the word, of course, to describe only the impetration, and not the application, of spiritual and saving blessings; and this holds true, both of those who admitted, and of those who denied, the Calvinistic doctrine of election. Of the first of these cases (the Calvinists) we have an instance in Richard Baxter’s work, which he entitled Universal Redemption of Mankind by the Lord Jesus Christ; and of the second (the Arminians) in Dr. Isaac Barrow’s sermons, entitled The Doctrine of Universal Redemption Asserted and Explained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 325-31 of Historical Theology (Edinburgh: T&amp;T Clark, 1863), vol. 2</cite>, p. 327</span></figcaption>

al-universalism/#:~:text=The%20Confession%2C%20therefore%2C%20must%20be%20regarded,of%20Universal%20Redemption%20Asserted%20and%20Explained&amp;text=The%20Confession%2C%20therefore%2C%20must%20be%20regarded%20as%20teaching&amp;text=The%20Doctrine%20of%20Universal%20Redemption%20Asserted%20and%20Explained" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>“There are others, who, rejecting that first absolute decree, and rightly so, make the conditional decree so common to all men that they assert that the counsel of God the Father in delivering the Son to death and of the Son in undergoing the same, and their intention and scope, was to acquire, impetrate and merit for all and every sinful man by that most precious death and passion, that, if they repent, when they are capable of doctrine and believe in Christ, they might be able to be reconciled with God and receive the remission of sins. They deny, however, that actual reconciliation with God or the remission of sins or eternal life was actually acquired or impetrated for those who remain in impenitence. 11. Since these deny that Christ died equally for the impious and the pious, and affirm that only the pious may glory in the satisfaction of Christ, because the principal fruit and efficacy of the satisfaction comes to them, they agree in sense with all other Orthodox on that point, even if they differ in their mode of speaking; especially since they acknowledge a certain special decree, according to which He died specially for the elect alone, by which they are brought not only to the common, but also to the singular benefits, namely the grace of regeneration and of efficacious calling, of justification and of glorification; and to the merit of Christ’s death they assign the true and efficacious communion, bestowal and application of saving grace, and the donation of faith itself, by which the application is made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works (d. 1651), vol. 2, Thirteen Disputations on the Just &amp; Gracious Dispensation of God concerning the Salvation of the Human Race, Disputation 6, Theses 9-11 in Barthold Holtzfus, Theological Treatise on Predestination, Election &amp; Reprobation of Men 3rd ed. tr. by AI by Nosferatu (Leiden, 1705)</cite>, p. 121 Latin</span></figcaption>

<div class="actions"><button class="copy" data-copy="““There are others, who, rejecting that first absolute decree, and rightly so, make the conditional decree so common to all men that they assert that the counsel of God the Father in delivering the Son to death and of the Son in undergoing the same, and their intention and scope, was to acquire, impetrate and merit for all and every sinful man by that most precious death and passion, that, if they repent, when they are capable of doctrine and believe in Christ, they might be able to be reconciled with God and receive the remission of sins. They deny, however, that actual reconciliation with God or the remission of sins or eternal life was actually acquired or impetrated for those who remain in impenitence. 11. Since these deny that Christ died equally for the impious and the pious, and affirm that only the pious may glory in the satisfaction of Christ, because the principal fruit and efficacy of the satisfaction comes to them, they agree in sense with all other Orthodox on that point, even if they differ in their mode of speaking; especially since they acknowledge a certain special decree, according to which He died specially for the elect alone, by which they are brought not only to the common, but also to the singular benefits, namely the grace of regeneration and of efficacious calling, of justification and of glorification; and to the merit of Christ’s death they assign the true and efficacious communion, bestowal and application of saving grace, and the donation of faith itself, by which the application is made.”

— André Rivet, Works (d. 1651), vol. 2, Thirteen Disputations on the Just &amp; Gracious Dispensation of God concerning the Salvation of the Human Race, Disputation 6, Theses 9-11 in Barthold Holtzfus, Theological Treatise on Predestination, Election &amp; Reprobation of Men 3rd ed. tr. by AI by Nosferatu (Leiden, 1705), p. 121 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%9CThere+are+others%2C+who%2C+rejecting+that+first+absolute+decree%2C+and+rightly+so%2C+make+the+conditional+decree+so+common+to+all+men+that+they+assert+that+the+counsel+of+God+the+Father+in+delivering+the+Son+to+death+and+of+the+Son+in+undergoing+the+same%2C+and+their+intention+and+scope%2C+was+to+acquire%2C+impetrate+and+merit+for+all+and+every+sinful+man+by+that+most+precious+death+and+passion%2C+that%2C+if+they+repent%2C+when+they+are+capable+of+doctrine+and+believe+in+Christ%2C+they+might+be+able+to+be+reconciled+with+God+and+receive+the+remission+of+sins.+They+deny%2C+however%2C+that+actual+reconciliation+with+God+or+the+remission+of+sins+or+eternal+life+was+actually+acquired+or+impetrated+for+those+who+remain+in+impenitence.+11.+Since+these+deny+that+Christ+died+equally+for+the+impious+and+the+pious%2C+and+affirm+that+only+the+pious+may+glory+in+the+satisfaction+of+Christ%2C+because+the+principal+fruit+and+efficacy+of+the+satisfaction+comes+to+them%2C+they+agree+in+sense+with+all+other+Orthodox+on+that+point%2C+even+if+they+differ+in+their+mode+of+speaking%3B+especially+since+they+acknowledge+a+certain+special+decree%2C+according+to+which+He+died+specially+for+the+elect+alone%2C+by+which+they+are+brought+not+only+to+the+common%2C+but+also+to+the+singular+benefits%2C+namely+the+grace+of+regeneration+and+of+efficacious+calling%2C+of+justification+and+of+glorification%3B+and+to+the+merit+of+Christ%E2%80%99s+death+they+assign+the+true+and+efficacious+communion%2C+bestowal+and+application+of+saving+grace%2C+and+the+donation+of+faith+itself%2C+by+which+the+application+is+made.%E2%80%9D%0A%0A%E2%80%94+Andr%C3%A9+Rivet%2C+Works+%28d.+1651%29%2C+vol.+2%2C+Thirteen+Disputations+on+the+Just+%26+Gracious+Dispensation+of+God+concerning+the+Salvation+of+the+Human+Race%2C+Disputation+6%2C+Theses+9-11+in+Barthold+Holtzfus%2C+Theological+Treatise+on+Predestination%2C+Election+%26+Reprobation+of+Men+3rd+ed.+tr.+by+AI+by+Nosferatu+%28Leiden%2C+1705%29%2C+p.+121+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2c726bebc9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2c726bebc9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=There%20are%20others%2C%20who%2C%20rejecting%20that,by%20which%20the%20application%20is%20made&amp;text=There%20are%20others%2C%20who%2C%20rejecting%20that%20first%20absolute&amp;text=faith%20itself%2C%20by%20which%20the%20application%20is%20made" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>31. But the sense of these places [1 Jn. 2 and 2 Pet. 2] is that Christ gave Himself (which we easily acknowledge) as a sufficient price for the whole world and for the false teachers themselves. Even so, those alone are effectually redeemed who acknowledge this grace; not those who delight themselves in their own captivity, and are rejecters of Christ, such as are the reprobate. 32. We have already warned above about those universal passages that they ought to be, in certain places, restricted to all the elect, whom the Lord has [as his own], not only in Judea but also in all parts of the world, in which sense it may also be said that “the blood of Christ is a propitiation for the whole world”—although this text we freely acknowledge to be about sufficiency. … 37. However, it is incredible shamelessness of those critics which drives them to write that our church doctrine about the death of Christ, and its efficacy being limited to the elect and believers alone, leads people to despair, because one cannot deduce anything certain from mere particular propositions. … 9. We accordingly conclude with the Scriptures that all the elect or believers in Christ are saved by Christ… 10. But as one error begets another, our adversaries claiming that God equally loves all and that Christ died effectually for all, although they nominally admit there to be a certain number of the elect, nevertheless they undermine the whole force of divine election, and instead they move into the military camp of the Pelagians, who make foreseen faith and [foreseen] unbelief the cause of salvation and death, of election and reprobation.</p></blockquote>

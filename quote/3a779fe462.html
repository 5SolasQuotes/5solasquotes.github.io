<main class="wrap"><figure class="quote" id="q-3a779fe462" data-kw="">
<blockquote><p>Do you contemplate, O man, the most immaculate Lord, hanging on the cross: and do you dare, O impudent and unhappy man, to spend your whole time of your life on earth in delights and laughter? Do you not know, O miserable and impudent one, that He who was crucified for you as Lord will demand an account from you for all these negligences and contempts? Now indeed, while you hear this, you neglect it, you laugh in delights; and free from all care, you see yourself as free: but that terrible day will surely come, the day of vengeance, and you will mourn without end and cry out because of your pains in the eternal fire: and there will be absolutely no one there to answer and to have mercy on your soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/diego-ruiz.html">Diego Ruiz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries &amp; Disputations on the First Part of St. Thomas, on the Will of God &amp; his Proper Acts</cite>, (Lugduni: Prost, 1630), Disp. 20, sect. 6 tr. AI by The Faith Received | 8. I prove the minor premise of the primary reason, and I explain more and confirm the whole preceding discourse. For at least the most excellent and most universal [will] of human salvation is established to be willed by God formally, as means in order to salvation not only of the predestined, but also of all other men, for: | 13. Ephraem Syrus, in his entire sermon on the passion of the Savior, teaches that it was offered for all sinners. Particularly noteworthy are those words towards the end:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c358548691" data-kw="">
<blockquote><p>3… The true resolution is that God wills all things on account of His own goodness, as the ultimate end and the first reason for willing all things. However, this does not exclude that, in willing, He attends to the greater or lesser goodness in the things themselves, for from this arises also the greater or lesser fittingness of acting or willing, even on account of His own goodness. And the fact that God operates all things for Himself does not prevent Him from pursuing rational creatures with true love of benevolence and friendship. For they are capable of such love, and it befits the divine goodness to love them thus. Also, because He does not love them for His own utility or advantage, but for their own good. That this good of theirs is ordered to the glory of God as the ultimate end by God Himself is not contrary to the nature of friendship, for this does not exclude the due order to God or to the ultimate end. But God loves lower creatures with the love of concupiscence, because He wills all of them for the advantage and utility of rational creatures, and irrational beings are not capable of greater love. This is clear from Aristotle (Ethics VIII, ch. 2), St. Thomas (I, q. 20, a. 2, ad 3 and 4; Contra Gentiles, ch. 19).</p></blockquote>

<blockquote><p>Effective permission or willing permission; especially, the providential concursus (q.v.) underlying evil acts of human beings; a concept typical of Reformed theology, which will not allow a bare or ineffectual permission on the part of God and which will acknowledge no realm of activity outside of the will of God. God therefore is viewed as positively willing to permit the free agency of human beings and as supporting their acts with his providential concursus even when those acts go against his revealed will.</p></blockquote>

<blockquote><p>53. Those means through which that will is revealed are the ‘intention of the sign’ [voluntas signi]–rightly so called not only by metaphor because they show men what they mean, but also by metonymy because they are the effects or adjuncts or partial declarations of God’s own will.

54. There are five signs included in that old verse: He instructs, forbids, permits, counsels, and fuliflls. Because counseling coincides with instruction, it would have been better to have substituted: He promises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, (1997), bk. 1, ch. 7, p. 100</span></figcaption>

</figure><figure class="quote" id="q-bad5963280" data-kw="">
<blockquote><p>Election and rejection or reprobation, and in general the will of God, may be considered either quoad actum voluntis, ‘as touching the act of’ God ‘willing,’ or as touching the things willed. Of this distinction, this author [Samuel Hoard] takes no notice; It is fit for some and advantageous to fish in troubled waters. Now as touching the act of God willing, both Aquinas has proved that there can be no cause thereof and withal professes that never was any so mad as to say that merits can be the cause of predestination, quoad actum praedestinantis, ‘as touching the act of’ God ‘predestinating’. And Bradwardine has curiously disputed this way, that no will of God is conditional, to will quoad actum volentis; and [Johannes] Piscator against Vorstius has proved the same after his way; and by variety of demonstration this way may be convinced, as in part I have showed in this discourse, both on the part of election and on the part of reprobation. And both Dr. [Thomas] Jackson [an Arminian] in his book of Providence, professes that the distinction of Voluntas antecedens and consequens, or antecedent and consequent will in God, is to be understood quoad res volitas, ‘as touching the things willed’, as much as to say, non quoad actum volentis. And Gerardus Vossius [an Arminian], drawing the distinction of will antecedent and will consequent unto the distinction of will absolute and will conditional, applies it only quoad res volitas, and so interprets Fathers’ discourse[s] thereof; And of a conditional will gives this instance: God will have men to be saved in case they believe, where faith is clearly made the condition of salvation, a temporal thing, the condition of a temporal thing, not the condition of God’s will to save, it being no way fit that a temporal thing should be made the condition of a thing eternal, such as is God’s will to save. And this is more apparent by the reading of Vossius himself, History of Pelagianism, bk. 7, treating of God’s will to save all. Now if we speak thus of God’s will quoad res volitas, ‘as touching the things willed,’ these things willed being very different, we have reason to consider them distinctly also. Now these things are either grace or glory, commonly called salvation; and as touching grace, to wit, the grace of regeneration, the grace of faith and repentance, we willingly confess that God’s will to confer them is so absolute that He has determined to confer them according to the mere pleasure of his will, not according to man’s works (which is plain Pelagianism and condemned in the Synod of Palestine above 1200 years ago); and as He gives them to whom He will, so He denies them to whom He will, according to that Rom. 9:18, ‘He hath mercy on whom He will, and whom He will He hardneth.’ But as touching salvation or damnation, in which respect this author usually speaks of the absolute or conditional will of God, we utterly deny that God in the dispensation or administration, or execution of these proceeds or ever did decree to proceed according to the mere pleasure of his own will, but altogether according to their works. For albeit God has made no law according whereto He means to proceed in giving or denying grace, yet has He made a law according whereto He proceeds in bestowing salvation and inflicting damnation. And the law is this: ‘Whosever believeth shall be saved; whosoever believeth not shall bedamned.’ 2 Cor. 5:10, ‘We must all appear before the judgment seat of Christ, that every man may receive the things, which are done in his body according to that he hath done, whether good or evil.’ So that according to that sense wherein this author usually speaks of the absolute and conditional will of God, we utterly deny that God does absolutely elect any man to salvation or reject any man unto damnation, though He does absolutely elect some unto grace, that is to the grace of regeneration, to the grace of faith and repentance, and absolutely reject others therefrom. For as much as He bestows these graces on some and denies them unto others not according to their works, but according to the mere pleasure of his own will, but he does not inflict damnation or bestow salvation according to the mere pleasure of his will, but according unto man’s works. And as he carries himself in the execution of salvation and damnation, after the same manner He did from everlasting decree to carry Himself, namely to save no man of ripe years but by way of reward of their faith, repentance and good works, [and] so to damn none but for their infidelity, impenitency and evil works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath</cite>, ... (d. 1646; Oxford, L.L., 1653), bk. 1, pt. 2, Discourse, 3rd Sort of Reasons, pp. 250-51</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Election and rejection or reprobation, and in general the will of God, may be considered either quoad actum voluntis, ‘as touching the act of’ God ‘willing,’ or as touching the things willed. Of this distinction, this author [Samuel Hoard] takes no notice; It is fit for some and advantageous to fish in troubled waters. Now as touching the act of God willing, both Aquinas has proved that there can be no cause thereof and withal professes that never was any so mad as to say that merits can be the cause of predestination, quoad actum praedestinantis, ‘as touching the act of’ God ‘predestinating’. And Bradwardine has curiously disputed this way, that no will of God is conditional, to will quoad actum volentis; and [Johannes] Piscator against Vorstius has proved the same after his way; and by variety of demonstration this way may be convinced, as in part I have showed in this discourse, both on the part of election and on the part of reprobation. And both Dr. [Thomas] Jackson [an Arminian] in his book of Providence, professes that the distinction of Voluntas antecedens and consequens, or antecedent and consequent will in God, is to be understood quoad res volitas, ‘as touching the things willed’, as much as to say, non quoad actum volentis. And Gerardus Vossius [an Arminian], drawing the distinction of will antecedent and will consequent unto the distinction of will absolute and will conditional, applies it only quoad res volitas, and so interprets Fathers’ discourse[s] thereof; And of a conditional will gives this instance: God will have men to be saved in case they believe, where faith is clearly made the condition of salvation, a temporal thing, the condition of a temporal thing, not the condition of God’s will to save, it being no way fit that a temporal thing should be made the condition of a thing eternal, such as is God’s will to save. And this is more apparent by the reading of Vossius himself, History of Pelagianism, bk. 7, treating of God’s will to save all. Now if we speak thus of God’s will quoad res volitas, ‘as touching the things willed,’ these things willed being very different, we have reason to consider them distinctly also. Now these things are either grace or glory, commonly called salvation; and as touching grace, to wit, the grace of regeneration, the grace of faith and repentance, we willingly confess that God’s will to confer them is so absolute that He has determined to confer them according to the mere pleasure of his will, not according to man’s works (which is plain Pelagianism and condemned in the Synod of Palestine above 1200 years ago); and as He gives them to whom He will, so He denies them to whom He will, according to that Rom. 9:18, ‘He hath mercy on whom He will, and whom He will He hardneth.’ But as touching salvation or damnation, in which respect this author usually speaks of the absolute or conditional will of God, we utterly deny that God in the dispensation or administration, or execution of these proceeds or ever did decree to proceed according to the mere pleasure of his own will, but altogether according to their works. For albeit God has made no law according whereto He means to proceed in giving or denying grace, yet has He made a law according whereto He proceeds in bestowing salvation and inflicting damnation. And the law is this: ‘Whosever believeth shall be saved; whosoever believeth not shall bedamned.’ 2 Cor. 5:10, ‘We must all appear before the judgment seat of Christ, that every man may receive the things, which are done in his body according to that he hath done, whether good or evil.’ So that according to that sense wherein this author usually speaks of the absolute and conditional will of God, we utterly deny that God does absolutely elect any man to salvation or reject any man unto damnation, though He does absolutely elect some unto grace, that is to the grace of regeneration, to the grace of faith and repentance, and absolutely reject others therefrom. For as much as He bestows these graces on some and denies them unto others not according to their works, but according to the mere pleasure of his own will, but he does not inflict damnation or bestow salvation according to the mere pleasure of his will, but according unto man’s works. And as he carries himself in the execution of salvation and damnation, after the same manner He did from everlasting decree to carry Himself, namely to save no man of ripe years but by way of reward of their faith, repentance and good works, [and] so to damn none but for their infidelity, impenitency and evil works.”

— William Twisse, The Riches of God’s Love unto the Vessels of Mercy consistent with his Absolute Hatred or Reprobation of the Vessels of Wrath... (d. 1646; Oxford, L.L., 1653), bk. 1, pt. 2, Discourse, 3rd Sort of Reasons, pp. 250-51">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CElection+and+rejection+or+reprobation%2C+and+in+general+the+will+of+God%2C+may+be+considered+either+quoad+actum+voluntis%2C+%E2%80%98as+touching+the+act+of%E2%80%99+God+%E2%80%98willing%2C%E2%80%99+or+as+touching+the+things+willed.+Of+this+distinction%2C+this+author+%5BSamuel+Hoard%5D+takes+no+notice%3B+It+is+fit+for+some+and+advantageous+to+fish+in+troubled+waters.+Now+as+touching+the+act+of+God+willing%2C+both+Aquinas+has+proved+that+there+can+be+no+cause+thereof+and+withal+professes+that+never+was+any+so+mad+as+to+say+that+merits+can+be+the+cause+of+predestination%2C+quoad+actum+praedestinantis%2C+%E2%80%98as+touching+the+act+of%E2%80%99+God+%E2%80%98predestinating%E2%80%99.+And+Bradwardine+has+curiously+disputed+this+way%2C+that+no+will+of+God+is+conditional%2C+to+will+quoad+actum+volentis%3B+and+%5BJohannes%5D+Piscator+against+Vorstius+has+proved+the+same+after+his+way%3B+and+by+variety+of+demonstration+this+way+may+be+convinced%2C+as+in+part+I+have+showed+in+this+discourse%2C+both+on+the+part+of+election+and+on+the+part+of+reprobation.+And+both+Dr.+%5BThomas%5D+Jackson+%5Ban+Arminian%5D+in+his+book+of+Providence%2C+professes+that+the+distinction+of+Voluntas+antecedens+and+consequens%2C+or+antecedent+and+consequent+will+in+God%2C+is+to+be+understood+quoad+res+volitas%2C+%E2%80%98as+touching+the+things+willed%E2%80%99%2C+as+much+as+to+say%2C+non+quoad+actum+volentis.+And+Gerardus+Vossius+%5Ban+Arminian%5D%2C+drawing+the+distinction+of+will+antecedent+and+will+consequent+unto+the+distinction+of+will+absolute+and+will+conditional%2C+applies+it+only+quoad+res+volitas%2C+and+so+interprets+Fathers%E2%80%99+discourse%5Bs%5D+thereof%3B+And+of+a+conditional+will+gives+this+instance%3A+God+will+have+men+to+be+saved+in+case+they+believe%2C+where+faith+is+clearly+made+the+condition+of+salvation%2C+a+temporal+thing%2C+the+condition+of+a+temporal+thing%2C+not+the+condition+of+God%E2%80%99s+will+to+save%2C+it+being+no+way+fit+that+a+temporal+thing+should+be+made+the+condition+of+a+thing+eternal%2C+such+as+is+God%E2%80%99s+will+to+save.+And+this+is+more+apparent+by+the+reading+of+Vossius+himself%2C+History+of+Pelagianism%2C+bk.+7%2C+treating+of+God%E2%80%99s+will+to+save+all.+Now+if+we+speak+thus+of+God%E2%80%99s+will+quoad+res+volitas%2C+%E2%80%98as+touching+the+things+willed%2C%E2%80%99+these+things+willed+being+very+different%2C+we+have+reason+to+consider+them+distinctly+also.+Now+these+things+are+either+grace+or+glory%2C+commonly+called+salvation%3B+and+as+touching+grace%2C+to+wit%2C+the+grace+of+regeneration%2C+the+grace+of+faith+and+repentance%2C+we+willingly+confess+that+God%E2%80%99s+will+to+confer+them+is+so+absolute+that+He+has+determined+to+confer+them+according+to+the+mere+pleasure+of+his+will%2C+not+according+to+man%E2%80%99s+works+%28which+is+plain+Pelagianism+and+condemned+in+the+Synod+of+Palestine+above+1200+years+ago%29%3B+and+as+He+gives+them+to+whom+He+will%2C+so+He+denies+them+to+whom+He+will%2C+according+to+that+Rom.+9%3A18%2C+%E2%80%98He+hath+mercy+on+whom+He+will%2C+and+whom+He+will+He+hardneth.%E2%80%99+But+as+touching+salvation+or+damnation%2C+in+which+respect+this+author+usually+speaks+of+the+absolute+or+conditional+will+of+God%2C+we+utterly+deny+that+God+in+the+dispensation+or+administration%2C+or+execution+of+these+proceeds+or+ever+did+decree+to+proceed+according+to+the+mere+pleasure+of+his+own+will%2C+but+altogether+according+to+their+works.+For+albeit+God+has+made+no+law+according+whereto+He+means+to+proceed+in+giving+or+denying+grace%2C+yet+has+He+made+a+law+according+whereto+He+proceeds+in+bestowing+salvation+and+inflicting+damnation.+And+the+law+is+this%3A+%E2%80%98Whosever+believeth+shall+be+saved%3B+whosoever+believeth+not+shall+bedamned.%E2%80%99+2+Cor.+5%3A10%2C+%E2%80%98We+must+all+appear+before+the+judgment+seat+of+Christ%2C+that+every+man+may+receive+the+things%2C+which+are+done+in+his+body+according+to+that+he+hath+done%2C+whether+good+or+evil.%E2%80%99+So+that+according+to+that+sense+wherein+this+author+usually+speaks+of+the+absolute+and+conditional+will+of+God%2C+we+utterly+deny+that+God+does+absolutely+elect+any+man+to+salvation+or+reject+any+man+unto+damnation%2C+though+He+does+absolutely+elect+some+unto+grace%2C+that+is+to+the+grace+of+regeneration%2C+to+the+grace+of+faith+and+repentance%2C+and+absolutely+reject+others+therefrom.+For+as+much+as+He+bestows+these+graces+on+some+and+denies+them+unto+others+not+according+to+their+works%2C+but+according+to+the+mere+pleasure+of+his+own+will%2C+but+he+does+not+inflict+damnation+or+bestow+salvation+according+to+the+mere+pleasure+of+his+will%2C+but+according+unto+man%E2%80%99s+works.+And+as+he+carries+himself+in+the+execution+of+salvation+and+damnation%2C+after+the+same+manner+He+did+from+everlasting+decree+to+carry+Himself%2C+namely+to+save+no+man+of+ripe+years+but+by+way+of+reward+of+their+faith%2C+repentance+and+good+works%2C+%5Band%5D+so+to+damn+none+but+for+their+infidelity%2C+impenitency+and+evil+works.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+The+Riches+of+God%E2%80%99s+Love+unto+the+Vessels+of+Mercy+consistent+with+his+Absolute+Hatred+or+Reprobation+of+the+Vessels+of+Wrath...+%28d.+1646%3B+Oxford%2C+L.L.%2C+1653%29%2C+bk.+1%2C+pt.+2%2C+Discourse%2C+3rd+Sort+of+Reasons%2C+pp.+250-51&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbad5963280.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bad5963280.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=Election%20and%20rejection%20or%20reprobation%2C%20and,their%20infidelity%2C%20impenitency%20and%20evil%20works&amp;text=Election%20and%20rejection%20or%20reprobation%2C%20and%20in%20general&amp;text=but%20for%20their%20infidelity%2C%20impenitency%20and%20evil%20works" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-3552d56983" data-kw="">
<blockquote><p>Assertion 4. A conditional and a submissive desire, though not agreeable to a positive law and commandment of God, is no sin, nor does the Law require a conformity in all our inclinations and the first motions of our desires to every command of God, though most contrary to nature and our natural and sinless inclinations: 1. If God command Abraham to kill his only begotten son and offer him in a sacrifice to God, which was a mere positive commandment; for it’s not a command of the law of nature (nor any other than positive) for the father to kill the son; if yet Abraham retain a natural inclination and love commanded also in the law of nature to save his son’s life and to desire that he may live, this desire and inclination, though contradictory to a positive command of God, is no sin; because the Fifth Command, grounded on the law of nature, does command it. Nor did Gods precept (‘Abraham, kill now thy son, even Isaac thine only begotten son’) ever include this, ‘Abraham, root out of thine heart all desire and inclination-natural in a father to preserve the life of the child. So the positive command of the Father, that the Son of God should lay down his life for his sheep, did never root out of the sinless nature of the man-Christ a natural desire to preserve his own being and life, especially He desiring it with special reservation of the will of God commanding that He should die.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (1647), p. 140</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-bf33b0c2d9" data-kw="">
<blockquote><p>II. Law is an ordinance of reason, instituted by him who has the care of a community, concerning good things, for the common and particular advantage of some society; teaching what is to be done and what is not, and likewise commanding or forbidding the same, and obligating the rational creature to perform those things by the threatening of punishment and the promise of reward. … XIX. From this distinction of the Mosaic law, judgment is easily made concerning the difference and agreement of these three parts [the moral, ceremonial and judicial laws], both in substance and as to their accidental abrogation. They agree: 1. in author, both principal and ministerial. 2. in general end, namely, the common good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomar.html">Francis Gomar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’15th of the Theological Disputations, on the Law of God’</cite>, (Leiden: Patius, 1603), trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-f6b15e6750" data-kw="">
<blockquote><p>Whereas some teach, that when we doubt of the lawfulness of the thing enjoined, and are certain that obedience to authority is a duty, we must do the thing; We conceive that we cannot be certain of our obligation to obey in a case wherein we are not sure of the lawfulness of the thing commanded, because we are sure we must not obey the magistrate’s command in things unlawful, and our ignorance or error cannot alter our obligation to God’s Law. Here is therefore an uncertainty on either side, and perhaps the danger may be greater on the side of obeying than refusing. For possibly the injunction of a heinous sin may be the matter of the uncertainty, and in this staight we apprehend it more unsafe and less excusable to choose the greater before the lesser sin, though indeed it be lawful to choose neither.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Account given of the Principles &amp; Practices of Several Nonconformists</cite>, … (London: Parkhurst, 1682), p. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

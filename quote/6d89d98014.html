</figure><figure class="quote" id="q-cb098ede78" data-kw="">
<blockquote><p>True faith is not only a sure knowledge, whereby I hold for truth all that God has revealed to us in His Word (James 1:6), but also a hearty trust (Rom. 4:16–18; Rom. 5:1), which the Holy Ghost (2 Cor. 4:13; Phil. 1:19, 29) works in me by the Gospel (Rom. 1:16; 10:17), that not only to others, but to me also, forgiveness of sins, everlasting righteousness, and salvation are freely given by God (Heb. 11:1–2; Rom. 1:17), merely of grace, only for the sake of Christ’s merits (Eph. 2:7–9; Rom. 3:24–25; Gal. 2:16; Acts 10:43).</p></blockquote>

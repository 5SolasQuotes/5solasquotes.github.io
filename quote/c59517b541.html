<main class="wrap"><figure class="quote" id="q-c59517b541" data-kw="">
<blockquote><p>But further, it is objected that… When we come to our common tables before we eat, thither sitting with our heads discovered, or standing, or kneeling, we give thanks and bless with a respect to the meat, which is purposely set on table, etc….</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c3d5b94713" data-kw="">
<blockquote><p>‘Doth not even nature itself teach you’. By nature is either meant, the law and light of nature, reason in man, common sense, or rather custom, which is second nature; and which, in this case, must be restrained to the Greeks and Jews; for though among the Grecians the men cut their hair, and did not suffer it to grow long, as also did the Jews, yet there were many nations who did not (Alex., ab. Alex. Genial. Dier., bk. 5, ch. 18. Servius in Virgil, Aeneid, bk. 10. prope finem), even at that time, observe such a rule or custom; but as the Jews and Greeks were the persons chiefly, if not solely, known to the Corinthians, the apostle signifies that the usages of these people might direct and inform them in this matter:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Whole Bible, on 1 Cor. 11</cite>, v. 14</span></figcaption>

</figure><figure class="quote" id="q-76622747c4" data-kw="">
<blockquote><p>Although certain ordinations of the apostles (which referred to the rites and circumstances of divine worship) were variable and instituted only for a time (as the sanction of not eating blood and of things strangled [Acts 15:20]; concerning the woman’s head being covered and the man’s being uncovered when they prophesy [1 Cor. 11:4, 5]) because there was a special cause and reason for them and (this ceasing) the institution itself ought to cease also; still there were others invariable and of perpetual observance in the church, none of which were founded upon any special occasion to last only for a time by which they might be rendered temporary…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, The Law of God, 14th Question: The Lord’s Day, p. 95</span></figcaption>

</figure><figure class="quote" id="q-d5b17f75ff" data-kw="">
<blockquote><p>Bruce Winter has developed a case that elite Roman ‘new women’ brought into the church at Corinth a style of dress that was offensive and disruptive to church unity, as well as an affront to Rome itself. As a response to this avantgarde feminine independence, Winter situates the άγγέλοι of 1 Cor. 11.10 and the ίδιώται of 1 Cor. 14.23-24 as agents of the State who are sent to investigate the behavior of such Christian women at worship. This study considers Winter’s novel claim and concludes that the evidence does not justify such an interpretation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/preston-t-massey.html">Preston T. Massey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Meaning of κατακαλυπτω</cite>, [covered] and κατα κεϕαλης εχων [hanging down from the head] in 1 Corinthians 11.2–16’ Ref New Testament Studies, vol. 53, issue 4 (Oct. 2007), pp. 502-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Bruce Winter has developed a case that elite Roman ‘new women’ brought into the church at Corinth a style of dress that was offensive and disruptive to church unity, as well as an affront to Rome itself. As a response to this avantgarde feminine independence, Winter situates the άγγέλοι of 1 Cor. 11.10 and the ίδιώται of 1 Cor. 14.23-24 as agents of the State who are sent to investigate the behavior of such Christian women at worship. This study considers Winter’s novel claim and concludes that the evidence does not justify such an interpretation.”

— Preston T. Massey, ‘The Meaning of κατακαλυπτω [covered] and κατα κεϕαλης εχων [hanging down from the head] in 1 Corinthians 11.2–16’ Ref New Testament Studies, vol. 53, issue 4 (Oct. 2007), pp. 502-23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBruce+Winter+has+developed+a+case+that+elite+Roman+%E2%80%98new+women%E2%80%99+brought+into+the+church+at+Corinth+a+style+of+dress+that+was+offensive+and+disruptive+to+church+unity%2C+as+well+as+an+affront+to+Rome+itself.+As+a+response+to+this+avantgarde+feminine+independence%2C+Winter+situates+the+%CE%AC%CE%B3%CE%B3%CE%AD%CE%BB%CE%BF%CE%B9+of+1+Cor.+11.10+and+the+%CE%AF%CE%B4%CE%B9%CF%8E%CF%84%CE%B1%CE%B9+of+1+Cor.+14.23-24+as+agents+of+the+State+who+are+sent+to+investigate+the+behavior+of+such+Christian+women+at+worship.+This+study+considers+Winter%E2%80%99s+novel+claim+and+concludes+that+the+evidence+does+not+justify+such+an+interpretation.%E2%80%9D%0A%0A%E2%80%94+Preston+T.+Massey%2C+%E2%80%98The+Meaning+of+%CE%BA%CE%B1%CF%84%CE%B1%CE%BA%CE%B1%CE%BB%CF%85%CF%80%CF%84%CF%89+%5Bcovered%5D+and+%CE%BA%CE%B1%CF%84%CE%B1+%CE%BA%CE%B5%CF%95%CE%B1%CE%BB%CE%B7%CF%82+%CE%B5%CF%87%CF%89%CE%BD+%5Bhanging+down+from+the+head%5D+in+1+Corinthians+11.2%E2%80%9316%E2%80%99+Ref+New+Testament+Studies%2C+vol.+53%2C+issue+4+%28Oct.+2007%29%2C+pp.+502-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd5b17f75ff.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d5b17f75ff.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/#:~:text=Bruce%20Winter%20has%20developed%20a%20case,does%20not%20justify%20such%20an%20interpretation&amp;text=Bruce%20Winter%20has%20developed%20a%20case%20that%20elite&amp;text=the%20evidence%20does%20not%20justify%20such%20an%20interpretation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-404369d6ed" data-kw="">
<blockquote><p>And truly this argument of theirs seems to me very preposterous, as if they meant to tie two extremes together without a medium. For who with reason can affirm: Because a man is not of the woman, but the woman of the man, etc. Therefore ought a woman to wear a veil or a hood on her head, by an argument fetched from the moral Law of their creation? Truly I have often heard that the whole Law of God was to be known by the discourse of reason, and was called moral… But whoever could from the dictate of reason know that a woman, because she was made of man and for man, ought therefore to wear a veil or hood on her head, especially in the Church? That she is therefore inferior to her husband, and that therefore she ought to be subject unto him, is not abhorrent from the discourse of reason; and because she is for that cause subject to her husband, reason dictates she ought to acknowledge it, but by what means or sign she should do it in the Church or elsewhere, custom seems only to have taught, especially in Christian churches, as the apostle intimates in this place. For we read not of any such custom in the Old Testament. Rebecca truly might (which they instance for an example), when she came near to Isaac, Gen. 24:65, take a veil and cover herself, as well for modesty as for reverence. But Judah thought Thamar to be an harlot because she covered herself with a veil, Gen. 38:14-15. So that from the beginning the covering of a veil was no certain sign of subjection…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/norton-knatchbull.html">Norton Knatchbull</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon Some Difficult Texts in all the Books of the New Testament</cite>, (Cambridge, 1693), on 1 Cor. 11:10, pp. 196-200 Knatchbull (1602–1685) was an English politician who sat in the House of Commons at various times between 1640 and 1679.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

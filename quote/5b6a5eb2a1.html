<main class="wrap"><figure class="quote" id="q-5b6a5eb2a1" data-kw="">
<blockquote><p>Proposition 3: Many of our learned [Romish] adversaries destroy that which is principal and most essential in remission of sinnes, to wit, condonation. Vasques the Jesuit says [denying condonation]… The said author confirms his opinion by these two arguments especially: … Argument 2: If a condonation be admitted for the merit of Christ, then the merit of Christ imputed is the formal cause of that condonation: and granting this, the justification of a sinner must have two forms: one of remission of sins; the other of inward cleansing and sanctification. But this is contrary to the Trident Council affirming that justification has but one form. (Bellarmine, On Justification, bk. 2, ch. 2; Concil of Trent, sess. 6, ch. 7) And it differs very little from the doctrine of the Protestants. For in the principal, it is one with it, to wit, in that it holds that a justified person does next and immediatly receive the remission of sins for the merit of Christ imputed. And the smaller difference between the sides, to wit, whether inherent justice may be admitted a part of justification, might be qualified by some such modification as Vega propounds to Calvin (For the Council of Trent, bk. 15, ch. 5), saying, ‘If at all times when one is iustified, he is also sanctified, what offence is it to allow one common word (namely ‘justification’ [citing Beza on Tit. 3:7 &amp; Rom. 8:30]) to express and contain both these parts?’ I am not ignorant that many other Papists admit condonation; but Vasquez charges that opinion with having affinity with ours, and affirms and proves that it is repugnant to the Trident Councel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-white.html">Francis White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Faith &amp; Way to the Church Explaned &amp; Justified in Answer to a Popish Treatise</cite>, ... (London: Field, 1617), pt. 1, ch. 1, Observation 1, ‘Touching remission of sins in justification’, pp. 18-19 White (c. 1564 – 1638) was an Anglican bishop.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<blockquote><p>779. Now besides this justification of the sinner which has its place in the first conversion of the sinner to God and which is renewed so long as he repents (for the faithful life is the continual exercise of faith), he is also given a justification of the just which is by works, which James discusses. 780. By this we understand the declaration of God with respect to the accusation of Satan, since in the regenerated sinner are true, colored, and indubitable signs and proofs of true faith which are pleasing to Him, and which are required among the heirs of the goods of grace. 781. This second justification is necessarily connected with the first (it is necessary to distinguish this from the variation of the Papists) so that it cannot be separated from it for any reason.</p></blockquote>

<blockquote><p>…those [who err] who imagine that a faithful and regenerate man, by committing any crime or grievous sin, does for a sin loose his faith and justification. And of this first assertion there seem also to be two degrees. For when they say that a faithful man by committing a grievous sin does loose his faith, they mean either the act of faith only or the habit [the abiding principle of it] also. If the act only, which is [for the person] to believe [the] remission of [his] sin, and namely of that crime which he has committed, and whereof he has not as yet repented, we acknowledge that that act of faith when a man is fallen into a great sin is interrupted, until he rise again by repentance. But here is their error in that they think, because the act of faith is interrupted, that therefore there is an intercession of justification and reconciliation with God, and a falling from the state of grace and salvation, into the fearful state of damnation. Unless for the qualifying of their opinion they shall say that they speak not of justification in foro caelesti, ‘in the court of heaven,’ but in foro conscientiae, ‘in the court of their conscience,’ and of falling for a time from the assurance of salvation into the guilt of damnation, which if they shall avouch, there shall not need to be any controversy betwixt us. For we do confess that a man cannot be assured of the remission of any crime whilst he continues in it without repentance: and that howsoever there is no condemnation to them that are in Christ Jesus; yet a faithful man by committing any crime incurs the anger of God and provokes his judgments and not only deserves damnation, and is in himself guilty, or contracts the guilt of death, but many times also by the terror and trouble of his own conscience, aggravated partly by afflictions, partly by spiritual desertions and partly by the temptation of Satan, is, in his own opinion, in the state of damnation. But if we will speak properly, justification is to be considered an act of God, for it is God that justifies, and such an act as depends upon his eternal counsel and proceed[s] from his grace given unto us in Christ before all secular times [before the foundation of the world]. For whom He elects, them He calls, and whom He calls according to his purpose, them and no other He justifies, and whom He justifies, them and all them He glorifies. This act of God, which from our effectual vocation is continued to our glorification, is not interrupted, though the act of faith, which is the apprehension of it, be interrupted.</p></blockquote>

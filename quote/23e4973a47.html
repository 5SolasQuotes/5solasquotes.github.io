<main class="wrap"><figure class="quote" id="q-23e4973a47" data-kw="">
<blockquote><p>It’s a dream, that God loveth sinners with the same love every way, wherewith he loveth his own Son Christ. And why? Because God loveth us only for his own Son, and for nothing in us Ergo, Far more it must follow, it’s a far other, an higher, fountain love, wherewith the Father loveth his own eternal and consubstantial Son, the Mediator between God and man; and that derived love wherewith he loveth us sinners.

As the one is 1. Natural; the latter, free. 2. The love of the Father to the Son, as his consubstantial Son, and so far as it’s essentially included in his love to Jesus Christ Mediator, is not a love founded on grace and free-mercy, which might never have been in God; because essentially, the Father must love his Son Christ, as his Son; and being Mediator, he cannot for that renounce his natural love to him, which is the fundamental cause, why he loveth us for Christ his Son, as Mediator; but the love wherewith the Father loveth us for his Son Christ, is founded on free Grace and mercy; and might possibly never have been in God.

For, 1. as he could not but beget his Son, he could not but love him; nature, not election can have place in either: but it was his Free will to create a man, or not create him. 2. He cannot but love his Son Christ, but God might either have loved neither man nor Angel, so as to chuse them to Salvation, and he might have chosen other Men and Angels, then these whom he hath chosen; God hath no such freedom in loving his own Consubstantial Son.

2. It’s an untruth, that God loveth his chosen ones, as he doth love his Son; that is, with the same degree of love, wherewith he loves his Son; I think that not far from either gross ignorance, or blasphemy. It possibly may be the same love by proportion, with which the Father tendereth the Mediator, or Redeemer, and all his saved and ransomed ones; but in regard of willing good to the creature loved, he neither loveth his redeemed with the same love, wherewith he loveth his Son; except blasphemously we say, God hath as highly exalted all the redeemed, and given to them a name above every name, as he hath done to his own Son; nor doth he so love all his chosen ones, as he conferreth equal grace and glory upon all alike; as if one starre differed not from another star in glory, in the highest heavens.

Our own good works cannot make our Lord love us less or more, with the love of eternal election; but they may make God love us more with the love of complacency, and a sweeter manifestation of God in the fruits and gracious effects of his love. According to that, John 14.23. Jesus said, if a man love me, he will keep my words, and my Father will love him, and we will come unto him, and make our abode with him.</p></blockquote>

<blockquote><p>4. Benignity is God willing freely to communicate his grace and goodness unto his creatures proportionably to their several capacities, Ex. 33:19; Mt. 5:45; Ps. 33:5. Goodness according to some admits of a threefold consideration: Of nature, which is called perfection. Of manners, called holiness. Of beneficence, id est, a disposition to do good to others; this is properly called benignity: ‘Thou art good and doest good,’ Ps. 119:68. Goodness is either essential or by participation. God is essentially good: He is good of Himself, He is goodness itself: the creature is good by participation, i.e. by a goodness received of God. The sun, if compared with other creatures, you may say (in that respect) it has light of itself, but the moon and stars are light by participation: that is, they receive their light from the sun. God is a full fountain, or rather a fountain which is fulness itself; willing to communicate, as the sun sends forth its light, a fountain its streams and the prolifical virtue in plants, inclines them to fruitfulness; as the seminal virtue in living creatures disposes them to generation: the peculiar affection in parents towards their children renders them propense to do them good: and the soul full of matter (like wine which has no vent) propends to pour out itself; so is the Lord affected to do good according as He has willed concerning the creature. The goodness communicated from God unto the creature is either special, bestowed upon angels and men: Or common, bestowed upon the rest of the creation: ‘The earth is full of the goodness of the Lord,’ Ps. 33:5. The impression of his image is upon the reasonable, the impression of his footsteps is upon the unreasonable creature. God, who is the increated good, communicates Himself without division, effusion, or multiplication of Himself: all that He communicates, notwithstanding, He remains infinite and the same. God were God blessed forever though He had never willed of his goodness unto any, but if He were not a God of benignity, He were not our God. Goodness so descends and comes from God unto the creature as that it stops not there, but ascends and returns again unto God: either by way of manifesting of his glory as a mere subject and representative glass of his goodness in the unreasonable creature: or by way of giving glory to Him, not only as a mere subject whereon his goodness is legibly engraven, but also as a subject yielding obedience to the command in the reasonable and sanctified creature (Amor est [Greek]. Circulus perpetuus est in amore. [Love is [Greek]. A perpetual circle is in love]). Hence love is said to be both ecstatical, that is, carrying the lover as it were out of himself unto the loved; as it is with the soul removed out of the body in a trance: and circular, the beginning and end of which circle is God, that Alpha and Omega, from whom and to whom are all things. Unto that infinite and increated sea whence all created rivers of goodness come, thither they return again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 12-13</span></figcaption>

<blockquote><p>Love of necessity involves feeling, and if there be no feeling in God, there can be no love. That He produces happiness is no proof of love. The earth does that unconsciously and without design. … He may be cold, insensible, indifferent, or even unconscious; He ceases to be God in the sense of the Bible, and in the sense in which we need a God, unless He can love as well as know and act. … We must adhere to the truth in its Scriptural form, or we lose it altogether. We must believe that God is love in the sense in which that word comes home to every human heart.</p></blockquote>

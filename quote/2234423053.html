<main class="wrap"><figure class="quote" id="q-2234423053" data-kw="">
<blockquote><p>…that arrangement which takes away all confusion, barbarity, obstinacy, turbulence, and dissension. There are examples of the first sort in Paul: that profane drinking bouts should not be mingled with the sacred supper of the Lord (1 Cor. 11:21-22), and that women should not go out in public with uncovered heads (1 Cor. 11:5). And we have many others in daily use, such as: that we pray with knees bent and head bare… [Calvin implicitly distinguishes that female covering in Paul’s time was a normal social propriety for appearing in public. Greek and Roman men on the other hand, went uncovered in public. In Reformation Geneva, men normally wore hats in public, but then uncovered for prayer.] But because He did not will in outward discipline and ceremonies what we ought to do (because He foresaw that this depended upon the state of the times, and He did not deem one form suitable for all ages), here we must take refuge in those general rules which He has given, that whatever the necessity if the church will require for order and decorum should be tested against these… Lastly, because He has taught nothing specifically, and because these things are not necessary to salvation, and for the upbuilding of the church ought to be variously accommodated to the customs of each nation and age, it will be fitting (as the advantage of the church will require) to change and abrogate traditional practices and to establish new ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (Westminster Press), bk. 4, ch. 10, sections 29-30, pp. 1207-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6e8ed5adda" data-kw="">
<blockquote><p>The very attire which nature and custom of all times and places have taught women to put on, confirms the same: as long hair, vails, and other coverings over the head: this and the former argument does the Apostle himself use to this very purpose, 1 Cor. 11:7, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Domestical Duties… (London: 1622) | 3rd Treatise, “Of Wives’ Particular Duties,” | section 3, p. 270</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

— William Gouge, Of Domestical Duties… (London: 1622) | 3rd Treatise, “Of Wives’ Particular Duties,” | section 3, p. 270">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+very+attire+which+nature+and+custom+of+all+times+and+places+have+taught+women+to+put+on%2C+confirms+the+same%3A+as+long+hair%2C+vails%2C+and+other+coverings+over+the+head%3A+this+and+the+former+argument+does+the+Apostle+himself+use+to+this+very+purpose%2C+1+Cor.+11%3A7%2C+etc.%E2%80%9D%0A%0A%E2%80%94+William+Gouge%2C+Of+Domestical+Duties%E2%80%A6+%28London%3A+1622%29+%7C+3rd+Treatise%2C+%E2%80%9COf+Wives%E2%80%99+Particular+Duties%2C%E2%80%9D+%7C+section+3%2C+p.+270&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6e8ed5adda.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6e8ed5adda.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/westminster-on-head-coverings/#:~:text=The%20very%20attire%20which%20nature%20and,very%20purpose%2C%201%20Cor.%2011%3A7%2C%20etc&amp;text=The%20very%20attire%20which%20nature%20and%20custom%20of&amp;text=to%20this%20very%20purpose%2C%201%20Cor.%2011%3A7%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-62f4e9eeda" data-kw="">
<blockquote><p>…in 1 Cor. 11:6, ‘if the woman be not covered, let her also be shorn’: If she lays her vail aside and appears in the public assemblies without a covering, then I say, ‘let her also be shorn or shaved’, let her hair be cut close to the skin, let her go like some of the cropped philosophers among the Stoics. Not that he would have her do so, but only by this sarcastic way of speaking he signifies that one is as decent as the other. It is as disgraceful to be uncovered as to be shaved: for ’twas the laudable custom then in the Christian churches for the women to be vailed, and it was disgraceful and reproachful for any of that sex to appear bare-faced in the time of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Authority, Style &amp; Perfection of the Books of the Old &amp; New-Testament with a Continued Illustration of Several Difficult Texts of Scripture throughout the Whole Work</cite>, (London, 1693), ‘Of the Style of the Holy Scriptures’, ch. 4, pp. 132-33 See also, pp. 241-44.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

t=to%20appear%20bare%2Dfaced%20in%20the%20time%20of%20worship" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-58bdc783ba" data-kw="">
<blockquote><p>…but a mere physical circumstance, neither up nor down to the worship, and time and place physical, are neither worship nor religious means of worship: 2. Time and place, name, country, form, figure, habit or garments, to hold off injuries of sun and heaven as such are never commanded, never forbidden of God; and therefore the change of these circumstances can be no change of a commandment of God: We never advanced circumstances, as such, to the orb and sphere of morals; Formalists do so advance their ceremonies…</p></blockquote>

<blockquote><p>…here are rules of order for the outward fashion of praying and prophesying; these may be as variable as the other are constant, it is no more possible to fit all Churches and countries with one form than to fit all bodies with one suit, or all limbs with one size…. They, exercising these manly functions, presumed to take upon them manly fashions; whereas therefore bare-headedness was in Corinth, as also in all Greece and Rome a token of honor and superiority, and covering the head a token of subjection; these forward women usurp upon the fashions of their husbands, and will have their faces seen as well as their voices heard;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shaking of the Olive Tree, the Remaining Works of that incomparable prelate Joseph Hall</cite>, … (d. 1656; 1660), ‘The Women’s Vail: or a Discourse concerning the Necessity or Expedience of the Close-Covering of the Heads of Women… upon 1 Cor. 11:10, Occasioned by an offence unjustly taken at a Modest Dress’, p. 237</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

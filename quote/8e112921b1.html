<blockquote><p>The humiliation of Christ was in no way unworthy of a divine person; for his sufferings were not involuntary, but voluntary; not the effects either of his own sin, or of his low condition, but of an all-wise providence, and of infinite love: he endured these sufferings, that he might be the Redeemer of men, that he might satisfy divine justice, open the fountain of mercy, and become to mankind the author of eternal salvation; by them he opened the gates of Paradise, purchased eternal life, exalted the glory of the divine majesty and justice, restored to holiness and truth their former beauty, and diffused light, joy, and hope, over the whole world.

By this humiliation of Christ, his divine nature was not in any degree lessened, or changed, (for divinity is incapable of any change,) nor did he lose any of his natural and eternal glory, for he ceased not to be what he was; this only followed, that Christ, as God, concealed the glories of his divinity under a veil of flesh, and that, too, a veil of flesh which was weak, miserable, subject to sorrows and disgrace, even to death itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 6.7, p. 286.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-12e051dc37" data-kw="">
<blockquote><p>Let us now come to the use which may be made of the crucifying of Christ. First of all here we learn with bitterness to bewail our sins: for Christ was thus cruelly nailed on the cross, and there suffered the whole wrath of God, not for any offence that ever he committed, but being our pledge and surety unto God, he suffered all for us: and therefore just cause have we to mourn for our offences, which brought our Saviour Christ to this low estate. If a man should be so far in debt that he could not be freed, unless the surety should be cast into prison for his sake; nay, which is more, be cruelly put to death for his debt, it would make him at his wit’s end; and his very heart to bleed.

And so is the case with us by reason of our sins; we are Gods debtors, yea bankrupts before him, yet have we gotten a good surety, even the son of God himself, who to recover us to our former liberty was crucified for the discharge of our debt. And therefore good cause have we to bewail our estate every day, as by the prophet it is said, They shall look on him whom they have pierced, they shall lament for him as one mourneth for his own son: they shall be sorry for him as one is sorry for his first born.

Look as the blood followed the nails that were stricken through the blessed hands and feet of Christ, so should the meditation of the cross and passion of our Redeemer be as it were nails and spears to pierce us, that our hearts might bleed for our sins: and we are not to think more hardly of the Jews for crucifying him then of our selves, because even by our sins we also crucified him. These are the very nails which pierce his hands and feet, and these are the spears which pierce through his side. For the loss of a little worldly pelfe [pleasure?], oh how are we grieved! but seeing our transgressions are the weapons whereby the son of God was crucified, let vs (I say it again and again) learn to be grieved for them above all things, and with bleeding and melting hearts bow and buckle under them, as under the cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), p. 333.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-states-of-christ/state-of-humiliation.html">State of Humiliation</a></span></div>

</figure><figure class="quote" id="q-7bf3a11aba" data-kw="">
<blockquote><p>First. So accordingly he [Joel] invites to a general and national humiliation, it was to be proclaimed by the sound of the Trumpet, vers. 15. not by a knock at a private man’s door, the trumpet was to call together the whole congregation, Num. 10.2. And if ye look to the first verse of this 2 Chap. of Joel, then the judgement comes with a trumpet, it sounds an alarm, it threatens all the inhabitants of the Land; if God threatens with a trumpet, we must call to repentance with a trumpet; with as loud and shrill a sound, that the whole nation may be warned; it must be Zephanies humiliation, Zeph. 2.1, 2. Gather your selves together, O Nation not to be desired, it must be like the fast of expiation, which was the yearly fast in Israel, all must humble themselves, it is a day of atonement, Levit. 23.28, 29. For to make an atonement for you before the Lord your God whatsoever soul it shall be that shall not be afflicted, in the same day he shall be cut off from among his people; personal, and private humiliation, is not of that prevailing efficacy in general danger; God tells the Jews that the prayers of two or three, though never so righteous men, Ezek. 14.14. As Noah, Daniel, and Job, should not divert a judgement from a whole Nation, they might escape themselves; but if the Nation repented not, the whole Land should perish; there is more must go to the removing of a general judgement; we may spit out a spark, or one man’s diligence may quench a small fire, but when a whole Town is on fire, every man must bring his Bucket.

One man’s prayer to remove a National Judgement, is as if we go about to quench a raging fire by sprinkling a little water out of a casting bottle; see this practised by the Jews, 1 Sam. 7.2. all the house of Israel lamented before the Lord, and see how they expressed and testified it, verse the 6. they gathered together to Mispah, and draw water, and poured it out before the Lord, and fasted on that day, and said there, we have sinned against the Lord, their eyes were as buckets, their heads fountains of tears.

And is not a fire kindled amongst us, how many smoking fire-brands are scattered through the Land, we may say of our present sad condition as our Prophet Joel speaks, Joel. 1.2. Hear this you old men and give ear all the Inhabitants of the Land, hath this been in your days, or in the days of your fathers, who can remember such distractions in our kingdom, when did this kingdom shake and totter as now it doth; first troubles in the North, when that’s quenched, the flame breaks out in Ireland, sparks scattered amongst our selves, as Ezekiel prophesies, mischief shall come upon mischief, and rumour shall come upon rumour, Ezek. 7.26. Thus out humiliation should be general, and as it must be general humiliation, so secondly it must be solemn by the help of a fast not to eat the bread of men.

First to testify our inward sorrow, the body must be afflicted.

Secondly, by this solemn fast to protest our unworthiness of the least support of life or refreshing, not worthy of the portion (of Whelps) of the crumbs that fall from the table.

Thirdly, to express our earnestness and importunity of prayer, and calling upon God, that we will lye prostrate before God, take no denial, not eat bread till he granted our petitions, as Saul vowed, not once to eat till he had obtained his victory; as David vowed, not to sleep or slumber till he had effected his desire, now this duty of repentance and humiliation, it is pressed upon them by a double motive; the first is the denouncing of judgement, and that not barely foretold, but exactly described in a dreadful manner the more to affect them; God musters up his force and sets them in battle aray, from the 2. verse to the 12. the Chariots of God are 20. thousand, even thousand of judgements, and the Lord is among them to turn the battle to the gate, ah, this will work fear, and fear is a good ingredient to repentance; thus he urges his people to repentance by the presenting of terrors; Amos 4.12. Therefore thus will I do unto thee O Israel, and because I will do this unto thee prepare to meet thy God O Israel; thus Habakkuk was afflicted with the threatnings of judgement ch. 3.16. when I heard my belly trembled, my lips quivered at the voice, rottenness entered into my bones, and I trembled in my self; God looks for this submission, that we should be startled at his judgements, the Lion hath roared who will not fear, Amos the 3.8. moved with fear, that’s one motive, and that drives us to repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-brownrigg.html">Ralph Brownrigg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Repentance and prayer or, the two fundamental pillars of the nation. Being the substance of four sermons preached at St. Peter’s Poor, London. By that famous and reverend divine Ralph Brownrigg, formerly vice-chancellor of Cambridge, and lately Lord Bishop of Exeter</cite>, (London: Thomas Riland, 1660), pp 5-9.</span></figcaption>

is+on+fire%2C+every+man+must+bring+his+Bucket.%0A%0AOne+man%E2%80%99s+prayer+to+remove+a+National+Judgement%2C+is+as+if+we+go+about+to+quench+a+raging+fire+by+sprinkling+a+little+water+out+of+a+casting+bottle%3B+see+this+practised+by+the+Jews%2C+1+Sam.+7.2.+all+the+house+of+Israel+lamented+before+the+Lord%2C+and+see+how+they+expressed+and+testified+it%2C+verse+the+6.+they+gathered+together+to+Mispah%2C+and+draw+water%2C+and+poured+it+out+before+the+Lord%2C+and+fasted+on+that+day%2C+and+said+there%2C+we+have+sinned+against+the+Lord%2C+their+eyes+were+as+buckets%2C+their+heads+fountains+of+tears.%0A%0AAnd+is+not+a+fire+kindled+amongst+us%2C+how+many+smoking+fire-brands+are+scattered+through+the+Land%2C+we+may+say+of+our+present+sad+condition+as+our+Prophet+Joel+speaks%2C+Joel.+1.2.+Hear+this+you+old+men+and+give+ear+all+the+Inhabitants+of+the+Land%2C+hath+this+been+in+your+days%2C+or+in+the+days+of+your+fathers%2C+who+can+remember+such+distractions+in+our+kingdom%2C+when+did+this+kingdom+shake+and+totter+as+now+it+doth%3B+first+troubles+in+the+North%2C+when+that%E2%80%99s+quenched%2C+the+flame+breaks+out+in+Ireland%2C+sparks+scattered+amongst+our+selves%2C+as+Ezekiel+prophesies%2C+mischief+shall+come+upon+mischief%2C+and+rumour+shall+come+upon+rumour%2C+Ezek.+7.26.+Thus+out+humiliation+should+be+general%2C+and+as+it+must+be+general+humiliation%2C+so+secondly+it+must+be+solemn+by+the+help+of+a+fast+not+to+eat+the+bread+of+men.%0A%0AFirst+to+testify+our+inward+sorrow%2C+the+body+must+be+afflicted.%0A%0ASecondly%2C+by+this+solemn+fast+to+protest+our+unworthiness+of+the+least+support+of+life+or+refreshing%2C+not+worthy+of+the+portion+%28of+Whelps%29+of+the+crumbs+that+fall+from+the+table.%0A%0AThirdly%2C+to+express+our+earnestness+and+importunity+of+prayer%2C+and+calling+upon+God%2C+that+we+will+lye+prostrate+before+God%2C+take+no+denial%2C+not+eat+bread+till+he+granted+our+petitions%2C+as+Saul+vowed%2C+not+once+to+eat+till+he+had+obtained+his+victory%3B+as+David+vowed%2C <blockquote><p>…any one who is willing… will easily perceive how… Mark has inserted this notice of the third hour, so that every one may there be led to bethink himself of an hour at which the Jews really crucified the Lord, although they sought to transfer the burden of the crime to the Romans… Thus, lest any one should leave the Jews out of account, and make the conception of so great a crime lie against those soldiers, Mark gives us here the statement, ‘And it was the third hour, and they crucified Him,’ his object being to have those Jews rather discovered to be the real crucifiers, who will be found by the careful investigator in a position making it quite possible for them to have cried out for the Lord’s crucifixion [before Pilate, Mk. 15:13-14] at the third hour, while he [the investigator] observes [via the Gospel of John] that what was done by the soldiers took place at the sixth hour.</p></blockquote>

<blockquote><p>Was the soul of Christ, after its separation from the body, translated to paradise immediately? Or did it descend locally to hell? The former we affirm; the latter we deny against the papists and Lutherans. The papists maintain that the soul of Christ really and by presence descended into hell and remained there just as long as his body was in the sepulchre, for the purpose of freeing the souls of the fathers of the Old Testament detained in limbo. We reject a local descent.</p></blockquote>

</figure><figure class="quote" id="q-894459d0b9" data-kw="">
<blockquote><p>4. Certain innovators who measure all faith by the courts of kings and regard gain as godliness think they can compile a catholic catechism—a summary of fundamentals to which all may subscribe. Thus, Jews and Christians might subscribe to the sum of the Old Testament, which indeed implicitly contains the New Testament and all its fundamentals, and thereby constitute one true Church. For if we swear to the fundamental articles in a confused and implicit manner, understood according to the vague and indefinite sense that the Holy Spirit intends, even if we do not know it specifically, then surely the Jews and we could rightly and properly subscribe to the Old Testament. But if any sect has its contrary and mutually opposed meanings concerning these articles, then there cannot be one fundamental catechism to which we all assent; rather, there will be as many catechisms regarding meanings as there are diverse opinions among different sects. For doctrine must be received according to its sense, not according to letters and syllables; otherwise, it would be permissible to subscribe to any general doctrine, and thus the Arians might swear that Christ is God, but they would understand Him to be God only nominally, not essentially.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism tr. by AI (1639-1642; 1668; Monergism, 2024)</cite>, ch. 1, ‘Of the Holy Scripture’; pp. 86-87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

<main class="wrap"><figure class="quote" id="q-fd80463dfe" data-kw="">
<blockquote><p>That Christ loves some with a special, superabundant, and peculiar love; for Christ, when he suffered upon the cross, looked with a particular eye of his love upon all that should believe in him; as now in heaven he hath carried our names upon his breast. As the high priest had on his breast plate written the names of the twelve tribes in precious stones, Exodus xxviii. 21, 30; so Christ, our high priest, hath the names of all his children in his heart, to present them always to God by his intercession, so as when he now appears before God, the church with him appears before God in his heart.

The Father sees the church in the heart and breast of Christ. Now as this, I say, is true in heaven, so upon the cross the church was in the breast of Christ. There was but a certain number for whom Christ savingly laid down his life, John xvii. 9. Paul was in the breast of Christ when he shed his blood: ‘Who loved me, and gave himself for me.’ So that then Christ loves some with a peculiar, special, and superabundant love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Salvation Applied</cite>, (London, 1637) in Alexander B. Grossart (ed.), The Works of Richard Sibbes (1862-64; 7 vols, Edinburgh: Banner of Truth, 1977), v, 387-88.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/names-of-god.html">Names of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c645220a5" data-kw="">
<blockquote><p>Controversies of the 1st Kind Whether the name ‘Jehova’ is predicated even of creatures? It is denied conta the Jews and Socinians. Whether this name may have known efficacy in performing miracles? It is denied against the Jews and magicians. Controversies of the 2nd Kind Whether this term [‘Jehova’] is plainly fictitious? It is denied. … Whether God is nameable by us? It is affirmed with a distinction. Whether any name has been imposed immediately by God? It is affirmed. Whether any spoken names of God are predicated of Him substantially? It is affirmed. Whether any names of God are properly spoken of Him or rather all are attributed metaphorically to Him? The prior is affirmed and the latter denied. Whether all the names of God are synonyms? It is affirmed with a distinction. Whether any names are spoken of God and the creatures univocally? It is distinguished. Whether on the supposition that they are spoken analogically, are they spoken first of God or of creatures? It is distingsuished. Whether any names are spoken of God in time? It is affirmed. Whether this name, ‘God’, is a name of nature or of operation? The prior is affirmed. Whether this term ‘God’ signifies his essence and nature or more his office, dignity and power? The prior is affirmed. Whether the name ‘God’ is attributed to God properly or appellatively? The prior is affirmed. Whether this name ‘God’ is incommunicable? It is denied with a distinction. … Whether Jehova is properly translated by the Greek [Septuagint] translators by the term Kurios [Lord]? It is denied with a distinction.</p></blockquote>

</figure><figure class="quote" id="q-3a5b0c6743" data-kw="">
<blockquote><p>If God be Jehovah, the supreme Lord, then it condemns the blasphemous papists, who speak after this manner, &#x27;Our Lord God the Pope.&#x27; Is it a wonder the pope lifts his triple crown above the head of kings and emperors, when he usurps God&#x27;s title, &quot;shewing himself that he is God?&quot; 2 Thess. 2:4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, p. 29</span></figcaption>

</figure><figure class="quote" id="q-41e8b64454" data-kw="">
<blockquote><p>It shall not be amiss, to speak a word or two of the naming of your children. Some are herein overseen, they refuse to call their children by the names of holy men and women, because they think it to savour somewhat too much of religion, and therefore either they name them at adventure, having no regard at all, how they be named: or else they give them the names of Heathen men, and call them Julius, Caesar, Hercules, Lucretia, Scipio, or such like. These, although they were notable in wisdom, learning, chastity, boldness, and in conquests; yet were they Heathen men, and knew not God. The name is nothing, it commendeth us not to God. Yet may a Christian father be ashamed to call his child by the name of such, who were enemies to the cross of Christ. …

Let them carry the names of the Apostles, of the Prophets, of the Martyrs, of such who have been constant in the faith, and have suffered death for Christ’s sake. That so they may be taught by their name to remember whose name they bear, and that they neither speak nor do any thing unworthy of their name.

As, if any be called John, that he pray for grace, and desire to be filled with grace: that he give witness of Christ, that he is the Lamb of God which taketh away the sins of the world: that he rebuke vice boldly, as John did in Herod, though he were a mighty prince. Or, if he be called Paul, that he so become a follower of Paul, as Paul was of Christ: and say with Paul, “That I might live unto God, I am crucified with Christ. Thus I live, yet not I now, but Christ liveth in me: ” and hear Christ speaking unto him as did Paul, and fall down and say, “Lord, what wilt thou that I do? ”

So let him, that is called Thomas, touch the bosom of Christ, and handle his wounds, and make a good confession as Thomas did, and say, “My Lord, and my God.” Let Matthew forsake his custom, even the deceitful gains of the world, and follow Christ. Let Daniel remember Daniel, and though he should be thrown into the den of lions, or be burnt in the fire, or suffer any cruel torments, yet let him not therefore forsake God, but put his whole trust in him. Thus should our names teach us, that whether we write them, or utter them, or hear them spoken, they may put us in mind of Christian duty and godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Sacraments Gathered out of certain Sermons, which the Reverend Father in God, Bishop Jewel, preached in his Cathedral Church at Salisbury</cite>, (London: Christopher Barker, 1583), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/names-of-god.html">Names of God</a></span></div>

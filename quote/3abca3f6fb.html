<main class="wrap"><figure class="quote" id="q-3abca3f6fb" data-kw="">
<blockquote><p>Therefore we approved the judgment of Lactantius [c.250–325], and ancient writer, who says: “Undoubtedly no religion exists where there is an image.” We also assert that the blessed bishop Epiphanius [c.315–403] did right when, finding on the doors of a church a veil on which was painted a picture supposedly of Christ or some saint, he ripped it down and took it away, because to see a picture of a man hanging in the Church of Christ was contrary to the authority of Scripture. Wherefore he charged that from henceforth no such veils, which were contrary to our religion, should be hung in the Church of Christ, and that rather such questionable things, unworthy of the Church of Christ and the faithful people, should be removed. Moreover, we approve of this opinion of St. Augustine [354–430] concerning true religion: “Let not the worship of the works of men be a religion for us. For the artists themselves who make such things are better; yet we ought not to worship them” (De Vera Religione, cap. 55).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/affirmation-of.html">Second Helvetic Confession</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 4 (1566).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0181e0f60e" data-kw="invocation of saints refuted memory not worship">
<blockquote><p>Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny. At the outset, we oppose the calumnies of the papists who slander us as despisers and enemies of the saints because we repudiate the worship of them (as if disgrace were thrown upon the saints when what belongs to God and Christ alone is not attributed to them). Now although their memory is very sacred to us, still we think that care should be diligently taken that they be not worshipped to the injury of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9.2b</span></figcaption>

</figure><figure class="quote" id="q-a6eef9a0dc" data-kw="">
<blockquote><p>In fact let us learn how greatly our nature inclines toward idolatry.… That saying of Horace still stands: once the gods of fools are born of fear. Or rather, as Scripture teaches, once the true knowledge of God has been blotted out by sin, the mind of man becomes a perpetual forge of idols.… Man will be compelled to confess that he is a transient being, and that those whose images he worships were once mortals like himself; yet he transfers divinity to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.11.8–9</span></figcaption>

</figure><figure class="quote" id="q-d9eb87081e" data-kw="">
<blockquote><p>For our hope is placed in the true cross of our Lord Jesus Christ, not in an image. For this reason I confess that I whole-heartedly detest the image of the crucifix. It is the image of the cruelty of the Jews against Christ, and so I cannot bear it. Hezekiah is praised for destroying the bronze serpent to which divine worship was being offered (2 Kings 10 [18:4]), and so I think they should be praised also who do away with the image of the crucifix as well, for the purpose of guarding against the same idolatry, and eliminate them from all temples and sacred places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586</cite>, (Concordia Publishing House, 2017), ch. 4, ‘On the Reformation of Temples, Images &amp; Organs’, p. 489</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

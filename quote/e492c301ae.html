<main class="wrap"><figure class="quote" id="q-e492c301ae" data-kw="">
<blockquote><p>[Papists:] The Lord says not [in Mt. 15:28; Mk. 7:29], ‘Thy daughter is saved by thy faith,’ as if it were by a means or instrument only of attaining that benefit, as you [Protestants] say, but [rather] for this saying as [it was] a meritorious cause. Answer: 1. Confession is taken for faith itself. 2. Faith is here taken in an objective sense, as it signifies Christ apprehended by faith, to whose only merit this benefit is to be ascribed: but by the means of faith; which God requires as an intermediate conditon on our part to this, that any benefit from his bountiful hand may be obtained, etc. [3] Unless that solution please better, which taking the name of ‘faith’ properly, says, that by that speech is not signified a cause, but a condition only, because all things are promised to him that believes; whence it is no wonder if when God gives any benefit to the faithful, He is said to give it for faith, which He necessarily requires in the receiver: Not that he deserves it by believing, but because God has promised it to none but to the believer; and that of mere grace in the Mediator Jesus Christ, in whom all the promises are yea and Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-boyd.html">Robert Boyd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, ch. 2, verse 8, p. 273 trans. Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 409</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-45d25bffc7" data-kw="">
<blockquote><p>What is the work of the Holy Ghost with respect unto the objective evidence which we have concerning the Scripture, that it is the word of God, which is the formal reason of our faith, and whereinto it is resolved?… … These things being supposed , we do affirm, That it is the authority and truth of God, as manifesting themselves in the supernatural revelation made in the Scripture [emphasis added], that our faith arises from and is resolved into. … As the issue of this whole discourse, it is affirmed that our faith is built on and resolved into the Scripture itself, which carries with it its own evidence of being a divine revelation; and therefore doth that faith ultimately rest on the truth and authority of God alone, and not on any human testimony, such as is that of the church, nor on any rational arguments or motive that are absolutely fallible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, bk. 6, pt. 1, The Reason of Faith; or, an Answer unto that inquiry, ‘Wherefore we believe the Scripture to be the Word of God;’ with the causes and nature of that faith wherewith we do so: wherein the grounds whereon the Holy Scripture is believed to be the Word of God with faith divine and supernatural are declared and vindicated in Pneumatologia: or, A Discourse concerning the Holy Spirit, Continued in Works, vol. 4, pp. 1-115 | See especially Ch. 5, ‘Divine Revelation itself the only foundation and reason of faith’, p. 69 ff., pp. 69, 72, 81</span></figcaption>

</figure><figure class="quote" id="q-e120f7bfe8" data-kw="">
<blockquote><p>Adoption, that also is a privilege we receive in this life; yea a learned man ([William] Forbes in his book where he handles the order of God’s graces [Modest Considerations...]) makes adoption (as I take it) to be the first, and to go before justification; yet the apostle, Rom. 8:23, calls the Last Day, the day of adoption. Hence 1 Jn. 3:2, the apostle, though he says, ‘We are now the sons of God,’ yet he says ‘it does not appear what we shall be,’ because the glory God at the Last Day will put upon us is so far transcendent and superlative to what now we are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, (London: Miller, 1651), Lecture 29, on Acts 3:19, p. 256</span></figcaption>

</figure><figure class="quote" id="q-e939b2facc" data-kw="">
<blockquote><p>…our orthodox divines do say that faith justifies as it’s an instrument, laying hold on Christ, so that Christ received by faith is properly that which justifies, not faith itself, or any dignity in it. This is the hand that receiveth the jewel, which does enrich us. This doctrine, though so generally received and avowed by all Protestant writers, yet of late is rejected among other reasons, because [it is said] there cannot be any passive instrument. Now I much wonder that Bellarmine, Becanus and other subtil Jesuits that turned every stone to overthrow faith’s instrumentality in justification, should so far forget their logic and metaphysics as not to pitch upon this objection above all, that there cannot be any such thing as a passive instrument. Truly I think, when a man of godly affections broaches an error, which he takes to be a truth, he himself is a passive instrument to bring others into errors. If we regard natural causes and moral, we may easily mention many passive instruments: In natural things the throat is a passive instrument of drinking. The Conduit-pipe of conveying water, and twenty such instances men may think of. In morality, taking that largely, there are many passive instruments: Nebuchadnezzar and all wicked men are God’s passive instruments. The Serpent by which the Devil deceived Eve, was a passive instrument: and to come nearer to our purpose, who can deny but that miraculous faith was a passive instrument in doing miracles, for the power of working miracles is infinite and could not be communicated to a creature no more than the creation of a world, only they by resting on God’s power, God wrought these wonderful things by them. But nothing does so fully represent this as the opinion of Aristotle and others following him, that intelligere is pati, and so videre, audire, are pati, ‘to understand is to receive,’ and so ‘to see’ and ‘hear;’ the soul does these by those faculties which are passive instruments therein; and therefore when Bellarmine would prove that credere and apprehendere were actions and works, it’s well answered that to believe or to lay hold on Christ (the Greek word applied often to faith is [Greek]. Though they be grammatical actions, yet they are naturally passions, as intelligere, videre are active verbs according to grammar, but naturally and physically are passions: So that a man in believing is passive, that is, he receives Christ for his righteousness: But of a passive instrument more hereafter. Justification is not in giving something to God but in receiving from Him; we do not curiously litigate about the word ‘instrument;’ by instrumentum we mean no more than medium, whereby the soul receives the Gospel-righteousness tendered unto it, and those peculiar expressions you heard the Scripture gives to faith, can evince no less. If therefore faith justify upon a peculiar reason, that that grace only has, viz. because it receives and applies Christ our righteousness, then other graces and holy works, having no such capacity, cannot justify. As the hand only, not the eyes or the feet, are the instrument that take alms given to a poor man. This consideration made that learned man Mr. [John] Ball, say how faith and works should be conjoined as con-causes in justification is impossible to conceive. Treatise of the Covenant of Grace, p. 70. And it’s a mere sophism to say that if by faith we receive Christ, and faith is the receiving of Christ, then we receive Christ by receiving; for its not the notion of faith that is properly the instrument receiving, but faith as the habit putting itself into act. So that the meaning is, faith acting or laying hold upon Christ, is the instrument receiving Him. Neither is this to give too much to faith, no more than in the faith of miracles, when Christ said to some, ‘Thy faith hath made thee whole,’ that thereby our Savior gave any dignity to faith, as if that were the cause of their health.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, … (London, 1654), sermon 23, pp. 224-25</span></figcaption>

e passive instruments therein; and therefore when Bellarmine would prove that credere and apprehendere were actions and works, it’s well answered that to believe or to lay hold on Christ (the Greek word applied often to faith is [Greek]. Though they be grammatical actions, yet they are naturally passions, as intelligere, videre are active verbs according to grammar, but naturally and physically are passions: So that a man in believing is passive, that is, he receives Christ for his righteousness: But of a passive instrument more hereafter. Justification is not in giving something to God but in receiving from Him; we do not curiously litigate about the word ‘instrument;’ by instrumentum we mean no more than medium, whereby the soul receives the Gospel-righteousness tendered unto it, and those peculiar expressions you heard the Scripture gives to faith, can evince no less. If therefore faith justify upon a peculiar reason, that that grace only has, viz. because it receives and applies Christ our righteousness, then other graces and holy works, having no such capacity, cannot justify. As the hand only, not the eyes or the feet, are the instrument that take alms given to a poor man. This consideration made that learned man Mr. [John] Ball, say how faith and works should be conjoined as con-causes in justification is impossible to conceive. Treatise of the Covenant of Grace, p. 70. And it’s a mere sophism to say that if by faith we receive Christ, and faith is the receiving of Christ, then we receive Christ by receiving; for its not the notion of faith that is properly the instrument receiving, but faith as the habit putting itself into act. So that the meaning is, faith acting or laying hold upon Christ, is the instrument receiving Him. Neither is this to give too much to faith, no more than in the faith of miracles, when Christ said to some, ‘Thy faith hath made thee whole,’ that thereby our Savior gave any dignity to faith, as if that were the cause of their health.”

— Anthony Burgess, The True Doctrine of Justification… (London, 1654), sermon 23, pp. 224-25">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6our+orthodox+divines+do+say+that+faith+justifies+as+it%E2%80%99s+an+instrument%2C+laying+hold+on+Christ%2C+so+that+Christ+received+by+faith+is+properly+that+which+justifies%2C+not+faith+itself%2C+or+any+dignity+in+it.+This+is+the+hand+that+receiveth+the+jewel%2C+which+does+enrich+us.+This+doctrine%2C+though+so+generally+received+and+avowed+by+all+Protestant+writers%2C+yet+of+late+is+rejected+among+other+reasons%2C+because+%5Bit+is+said%5D+there+cannot+be+any+passive+instrument.+Now+I+much+wonder+that+Bellarmine%2C+Becanus+and+other+subtil+Jesuits+that+turned+every+stone+to+overthrow+faith%E2%80%99s+instrumentality+in+justification%2C+should+so+far+forget+their+logic+and+metaphysics+as+not+to+pitch+upon+this+objection+above+all%2C+that+there+cannot+be+any+such+thing+as+a+passive+instrument.+Truly+I+think%2C+when+a+man+of+godly+affections+broaches+an+error%2C+which+he+takes+to+be+a+truth%2C+he+himself+is+a+passive+instrument+to+bring+others+into+errors.+If+we+regard+natural+causes+and+moral%2C+we+may+easily+mention+many+passive+instruments%3A+In+natural+things+the+throat+is+a+passive+instrument+of+drinking.+The+Conduit-pipe+of+conveying+water%2C+and+twenty+such+instances+men+may+think+of.+In+morality%2C+taking+that+largely%2C+there+are+many+passive+instruments%3A+Nebuchadnezzar+and+all+wicked+men+are+God%E2%80%99s+passive+instruments.+The+Serpent+by+which+the+Devil+deceived+Eve%2C+was+a+passive+instrument%3A+and+to+come+nearer+to+our+purpose%2C+who+can+deny+but+that+miraculous+faith+was+a+passive+instrument+in+doing+miracles%2C+for+the+power+of+working+miracles+is+infinite+and+could+not+be+communicated+to+a+creature+no+more+than+the+creation+of+a+world%2C+only+they+by+resting+on+God%E2%80%99s+power%2C+God+wrought+these+wonderful+things+by+them.+But+nothing+does+so+fully+represent+this+as+the+opinion+of+Aristotle+and+others+following+him%2C+that+intelligere+is+pati%2C+and+so+videre%2C+audire%2C+are+pati%2C+%E2%80%98to+understand+is+to+receive%2C%E2%80%99+and+so+%E2%80%98to+see%E2%80%99+and+%E2%80%98hear%3B%E2%80%99+the+soul+does+these+by+those+faculties+which+are+passive+instruments+therein%3B+and+therefore+when+Bellarmine+would+prove+that+credere+and+apprehendere+were+actions+and+works%2C+it%E2%80%99s+well+answered+that+to+believe+or+to+lay+hold+on+Christ+%28the+Greek+word+applied+often+to+faith+is+%5BGreek%5D.+Though+they+be+grammatical+actions%2C+yet+they+are+naturally+passions%2C+as+intelligere%2C+videre+are+active+verbs+according+to+grammar%2C+but+naturally+and+physically+are+passions%3A+So+that+a+man+in+believing+is+passive%2C+that+is%2C+he+receives+Christ+for+his+righteousness%3A+But+of+a+passive+instrument+more+hereafter.+Justification+is+not+in+giving+something+to+God+but+in+receiving+from+Him%3B+we+do+not+curiously+litigate+about+the+word+%E2%80%98instrument%3B%E2%80%99+by+instrumentum+we+mean+no+more+than+medium%2C+whereby+the+soul+receives+the+Gospel-righteousness+tendered+unto+it%2C+and+those+peculiar+expressions+you+heard+the+Scripture+gives+to+faith%2C+can+evince+no+less.+If+therefore+faith+justify+upon+a+peculiar+reason%2C+that+that+grace+only+has%2C+viz.+because+it+receives+and+applies+Christ+our+righteousness%2C+then+other+graces+and+holy+works%2C+having+no+such+capacity%2C+cannot+justify.+As+the+hand+only%2C+not+the+eyes+or+the+feet%2C+are+the+instrument+that+take+alms+given+to+a+poor+man.+This+consideration+made+that+learned+man+Mr.+%5BJohn%5D+Ball%2C+say+how+faith+and+works+should+be+conjoined+as+con-causes+in+justification+is+impossible+to+conceive.+Treatise+of+the+Covenant+of+Grace%2C+p.+70.+And+it%E2%80%99s+a+mere+sophism+to+say+that+if+by+faith+we+receive+Christ%2C+and+faith+is+the+receiving+of+Christ%2C+then+we+receive+Christ+by+receiving%3B+for+its+not+the+notion+of+faith+that+is+properly+the+instrument+receiving%2C+but+faith+as+the+habit+putting+itself+into+act.+So+that+the+meaning+is%2C+faith+acting+or+laying+hold+upon+Christ%2C+is+the+instrument+receiving+Him.+Neither+is+this+to+give+too+much+to+faith%2C+no+more+than+in+the+faith+of+miracles%2C+when+Christ+said+to+some%2C+%E2%80%98Thy+faith+hath+made+thee+whole%2C%E2%80%99+that+thereby+our+Savior+gave+any+dignity+to+faith%2C+as+if+that+were+the+cause+of+their+health.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+True+Doctrine+of+Justification%E2%80%A6+%28London%2C+1654%29%2C+sermon+23%2C+pp.+224-25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe939b2facc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e939b2facc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=our%20orthodox%20divines%20do%20say%20that,were%20the%20cause%20of%20their%20health&amp;text=our%20orthodox%20divines%20do%20say%20that%20faith%20justifies&amp;text=if%20that%20were%20the%20cause%20of%20their%20health" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

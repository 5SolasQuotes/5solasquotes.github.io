<main class="wrap"><figure class="quote" id="q-44db643548" data-kw="Merit of congruity">
<blockquote><p>In particular, the following arguments disprove merits of congruity. (1) Nothing good can be either thought or done by sinful man not as yet renewed (as has already been fully proved when we treated of free will and effectual calling). (2) Grace which is due is not grace. Now the grace given to us is wholly gratuitous, preceding and anticipating all our acts and dispositions and in reference to which man stands merely passively (as Paul constantly teaches, Rom. 9:16; Eph. 2:3, 5, 9, 10; Tit. 3:5; 1 Cor. 3:3, 5, and has been shown by us in the cited place). (3) Thus man would give something to God first (contrary to Paul, Rom. 11:35) and have something which he had not received (against the same, 1 Cor. 4:7). (4) Enemies and those without God (such as we all are before grace, Eph. 2:11, 12; Tit. 3:3) can deserve nothing. (5) Either this merit arises from all works or from some only. No one would say from all, nor from some because thus he who would sin in one, would not be guilty of all (contrary to Jam. 2:10).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.5.8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f8ab438839" data-kw="Merit of condignity">
<blockquote><p>Although they who embrace the Scotist opinion (acknowledging no merit except from agreement) err less dangerously than others and come nearer the truth, still they cannot be excused. First they greatly abuse words, calling that merit of condignity which in no way deserves that name (if we wish to follow the ordinary method of speaking). For who would say that a work of condignity merited eternal life which by itself is not worthy of so great a reward, but to which that reward is liberally promised above its own worth? Again, this manner of speaking is not only abusive, but also very dangerous (to wit, favoring Pharisaical pride, which affords the occasion of making grievous mistakes in the thing itself—to wit, ascribing too much to our works and not a little diminishing the glory of the divine mercy, which has evidently been the case in the Roman church).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.5.11</span></figcaption>

</figure><figure class="quote" id="q-d1b630de69" data-kw="Grace and merit">
<blockquote><p>These are incompatible: to give a thing from grace and to give it from merit. For merit makes a thing due, while grace supposes it undue. Therefore whatever is given from grace cannot be given from merit, otherwise grace would not be grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.5.17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-condignity.html">Merit of condignity (de condigno)</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><figure class="quote" id="q-546eb0fd3d" data-kw="Merit">
<blockquote><p>There now can be no merit in man with God by works whatsoever, either of congruity or of condignity. (1) They are not undue, but due; for whatever we are and can do, all this we owe to God, whose debtors we are on this account called (Lk. 17:10; Rom. 8:12). (2) Not one is ours, but all are gifts of grace and fruits of the Spirit (Jam. 1:17; Phil. 2:13; 2 Cor. 3:5). (3) They are not perfect, but alloyed as yet by various impurities (Rom. 7:18; Gal. 5:17, 18; Is. 64:6). (4) They are not equal to future glory because there is no proportion between the finite and temporary and the infinite and eternal (Rom. 8:18; 2 Cor. 4:17). (5) The reward promised to them is purely gratuitous and undue and so to be expected not from the internal merit of the work and its intrinsic worth, but only from the most free estimation of it by the one who crowns it (Rom. 6:23; 4:4; 11:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.5.7</span></figcaption>

</figure><figure class="quote" id="q-80548af3e9" data-kw="Merit">
<blockquote><p>I ask, what need was there to introduce the word Merit, when the value of works might have been fully expressed by another term, and without offense? The quantity of offense contained in it the world shows to its great loss. It is certain that, being a high sounding term, it can only obscure the grace of God, and inspire men with pernicious pride.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.2</span></figcaption>

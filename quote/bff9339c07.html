<main class="wrap"><figure class="quote" id="q-bff9339c07" data-kw="">
<blockquote><p>To the spouse he is ‘altogether lovely,’ Cant. 5:16. Well, then, you see here is the true differencing note between us and the men of the world, whether we see anything in Christ why we should desire him. And it is both an inclusive and an exclusive mark. Some marks are inclusive; that is, if a man find them in him, he may be sure he is in Christ; but if not, he is not to determine he is out of Christ.

As the eminent and vigorous workings of holy graces, they do not take in every state of Christianity, they do not take in the infancy of grace. Other marks are exclusive; that is thus, they knock off the fingers of pretenders, and serve to show a man out of grace, but not in. As frequenting of the ordinances, a care of duty; if a man doth not these things, he may be sure he is none of God’s, though he cannot be sure he is of God because he doth them.

But now this is a mark that is inclusive and exclusive too. It is inclusive, for if your desires be to Christ, no doubt he is yours. It is a true mark, and a mark that is compatible to the weakness of grace. It is a true mark, for God looketh to the heart more than to the duty: Prov. 23:26, ‘My son, give me thy heart.’ And desires are the chiefest part of that. Desires are most genuine and suitable to the judgment and determination of the soul. They are a mark in which God’s weakest servants may comfort themselves. Those that fail in other things are not wanting in desires. However they may have many defects in their carriage and in their duties, yet they are sure their desires are towards him. If they cannot be much in duty, they will be much in their desires and valuations of him.

Peter, that durst not appeal to his own conscience for other things, dareth appeal to God’s omnisciency for this: John 21:17, ‘Lord, thou knowest all things; thou knowest that I love thee.’ And the people of God often vouch this: Isa. 26:8, ‘The desire of our soul is to thy name;’ Neh. 1:11, ‘Thy servants who desire to fear thy name.’ Therefore it is comfortable; and it is convincing too, and exclusive. Wicked men feel no desires; they have some slight wishes, carnal and weak velleities, but they have no serious desires, nor true volitions. Balaam may wish to die the death of the righteous, Num. 23:10. So they may desire Christ out of some general conceit of happiness; but they do not desire Christ for holiness. So there is no beauty in him why we should desire him. They do not desire him as seeing any beauty in his ways John 6:34, ‘Lord, evermore give us this bread.’ When Christ said he was the bread of life, those that would not come to Christ would fain have the bread of life.

Nay, heaven itself is not really desired by wicked men; it is true, they may desire it in a carnal way, as a Turkish paradise, and such a place of ease and delight as the Koran sets forth; but not as it is in itself, to enjoy God, and Christ, and more grace, and to be more free and undisturbed in respect of the prevailing of sin and corruptions. Those that desire Christ truly, desire him not for ease (the spirit of the world may do that), but from the beauty and excellency they find in him, and in his ways. His service is of a high and honourable nature, and therefore they desire it. So that you see here is the note of trial, and the main difference, viz., a desiring of Christ for the rare beauty and perfections that are found in him. Do you, then, try yourselves by this note.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition upon the Fifty-Third Chapter of Isaiah</cite>, (1703) in The Complete Works of Thomas Manton, D.D. (22 vols, London: James Nisbet &amp; Co., 1871), 3: 235-36.</span></figcaption>

</figure><figure class="quote" id="q-97718e7522" data-kw="">
<blockquote><p>Yea, thou wilt find, that he, who prevented thee with grace, &amp; sought thee, ere ever thou soughtest him, &amp; gave thee grace to cry and pray, Have mercy, O God, yet he will seem to mis-know thee, and make thee none answer. Thou wilt cry in sickness, Mercy, but wilt thou always find mercy? No, no, thou wilt cry in other troubles, Mercy, and his Spirit no question will intercede for thee, and yet for a time he will make thee none answer. What meaneth this? why doeth he so? Now when he hath given thee grace to cry for mercy, a thirst &amp; an hunger for grace, (Blessed are they that hunger &amp; thirst) when he hath given thee this first grace, he will let thee cry a great while to try thy constancy.

We never get a spiritual grace in this life, but with the grace we get always a trial: and when he giveth us grace to cry: he will try if we will cry on. And to speak the truth, Brethren, All our life here, is but a trial of the graces of GOD, which he hath given us. We get not our heaven here, but a faith to look a far of unto it, an hunger, a thirst, a desire of it, and with our thirst a trial of our Faith, a trial of our Hope, of our desire, to see if we will stand in it. And then saith Peter, in the life to come, the trial of thy faith, and hope, and patience, being ended, What shall follow, Praise, and honour, and glory, when JESUS shall appear, 1. Pet. 1. 7. Thou shalt bee filled with saciety and fullness of joy, thine hunger and thirst shall be satisfied as soon as ever thou seest thy Redeemer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain sermons, upon several texts of Scripture</cite>, eds Henry Charteris and William Arthur (Edinburgh: Andro Hart, 1616), pp 268-69.</span></figcaption>

<blockquote><p>Not severity, but mercy, Jerome wishes to be observed in this place.</p></blockquote>

<blockquote><p>1. There is no power in man to remove that resistance that is in his heart against God and the work of his grace; that which out of its own corrupt principles does wholly resist, and cannot but resist, the operation and dispensation of all spiritual means that would prevail with it for good, that cannot take away the resistance; for resistance cannot take away resistance; it implies a palpable contradiction, as that which is professedly cross to common sense. But the corrupt heart of a natural man, while he is in the state of nature and corruption, does and cannot but wholly resist the work of God’s Spirit and grace, and all the saving operations of all the means thereof. The flesh lusts against the Spirit, and the Spirit against the flesh, and these two are contrary, Gal. 5:17. And what is born of the flesh is flesh, Jn. 3:7; that is the temper and inward constitution of a soul in its natural condition; it is wholly born of the flesh, and therefore nothing but flesh, and therefore can do nothing but resist the Spirit; yea, it cannot but oppose whatever would take that resistance away; for it is a received rule of reason, and confessed of all hands, everything desires the preservation of itself and its being; otherwise the being and the causes that made up the being should be cross to the thing, if it should endeavor its own destruction; nay, a thing should be opposite to itself. Hence it is that the corruption of the heart will put forth all the skill and strength it hath, or by the contrivements of carnal reason can compass, to fortify and preserve itself against the spiritual and saving dispensation of the work of God’s Spirit in his own ordinances; because wicked men look at the power thereof as that which works the ruin of their lusts; therefore they labor to avoid the light if they can; if not that, to oppose it, and overbear it by their delusions; if not that, to destroy it…

2. Before the soul can act against the evil of sin, or for the removal of this resistance wherein the destroying venom of sin lies, and that which stops the passage of the power of the ordinance and the work of grace, it is necessary that the Lord should not only concur with the act of the will of a sinner, to lead or draw forth the act thereof which He has ability to express, but He must let in an influence of the same power and virtue into the faculty of the will, whereby it may be enabled to put forth an act unto which it formerly had no power of itself…

3. The influence of this spiritual power whereby the Lord takes away this sinful resistance, is not by any gracious habit of sanctification, but by an irresistable motion of the work of his Spirit upon the soul…</p></blockquote>

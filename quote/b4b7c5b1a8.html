<main class="wrap"><figure class="quote" id="q-b4b7c5b1a8" data-kw="">
<blockquote><p>Even after Joseph had died, they observed circumcision (as seems must be gathered from Ex. 4:25), and were also intent upon prayers (Ex. 2:23); they certainly desired sacrifices, but did not sacrifice, being deterred by fear of the Egyptians (Ex. 8:26), yet at the same time when about to flee they sacrificed the Passover in Egypt (Ex. 12). Besides those points, hardly anything is mentioned about their divine worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), bk. 8, ch. 2, sect. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1c585422d6" data-kw="">
<blockquote><p>Some are so proceeded against for not observing of holy days, some for not kneeling at the sacrament of the Lord’s Supper, some for not using the sign of the cross in baptism; and what would become of ministers that should neglect or omit to wear the surplice in sacred administrations is easy to conjecture. But these things are all of them unwritten and unscriptural. Great and many indeed have been the disputes of learned men to prove that although they have no divine institution, nor yet example of apostolical or primitive practise, yet that they may be lawfully used for decency and order in the worship of God. Whether they have evinced what they aimed at is as yet undetermined… they are all granted to be arbitrary inventions of men… For what men think meet to do themselves in the matters of the house of God and his worship, it may be measured and accepted with Him according to their light and design. But for what they impose on others… they ought to have his warrant and authority for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious</cite>, (1672), ch. 5, pp. 212-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

t%20observing&amp;text=ought%20to%20have%20his%20warrant%20and%20authority%20for" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-95da656997" data-kw="">
<blockquote><p>Bodily worship without soul-worship is nothing; but soul-worship may be accepted without bodily worship; therefore it is the soul that God does principally look at in holy duties: If you be not able to worship God in your bodies, you may worship Him in your souls, and God regards that bodily exercise in holy duties is little worth… but it is nothing in comparison: the great work is the work of the soul, for God is a Spirit and must be worshipped in spirit. And God is said to be a Spirit… it notes the simplicity of God… but in the simplicity of your hearts you must come to worship God, and thus you shall worship Him with such worship as is some way suitable to him as he is a Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship</cite>, ... (London: 1647) | Sermon 6, pp. 93-94</span></figcaption>

</figure><figure class="quote" id="q-aa20d12bb0" data-kw="">
<blockquote><p>Q. 161. How do the sacraments become effectual means of salvation? A. The sacraments become effectual means of salvation, not by any power in themselves, or any virtue derived from the piety or intention of him by whom they are administered, but only by the working of the Holy Ghost, and the blessing of Christ, by whom they are instituted.[s] [s] 1 Pet. 3:21. Acts 8:13 compared with verse 23. 1 Cor. 3:6,7. 1 Cor. 12:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite></span></figcaption>

— Westminster Assembly, Larger Catechism">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQ.+161.+How+do+the+sacraments+become+effectual+means+of+salvation%3F+A.+The+sacraments+become+effectual+means+of+salvation%2C+not+by+any+power+in+themselves%2C+or+any+virtue+derived+from+the+piety+or+intention+of+him+by+whom+they+are+administered%2C+but+only+by+the+working+of+the+Holy+Ghost%2C+and+the+blessing+of+Christ%2C+by+whom+they+are+instituted.%5Bs%5D+%5Bs%5D+1+Pet.+3%3A21.+Acts+8%3A13+compared+with+verse+23.+1+Cor.+3%3A6%2C7.+1+Cor.+12%3A13.%E2%80%9D%0A%0A%E2%80%94+Westminster+Assembly%2C+Larger+Catechism&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faa20d12bb0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/aa20d12bb0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Q.%20161.%20How%20do%20the%20sacraments,1%20Cor.%203%3A6%2C7.%201%20Cor.%2012%3A13&amp;text=Q.%20161.%20How%20do%20the%20sacraments%20become%20effectual&amp;text=verse%2023.%201%20Cor.%203%3A6%2C7.%201%20Cor.%2012%3A13" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b0723d8425" data-kw="">
<blockquote><p>V. 3… this being the first violation of the law newly given, and committed by those who should have been the strictest observers and assertors of it, did deserve a very severe punishment.” … V. 12… Moses repeats and reinforces the former command… partly to encourage them to go on in their holy services and not to be dejected for the late severity, as if God would no more accept them or their sacrifices. … V. 16. ‘The goat of the sin-offering,’… which he [Moses] inquired into more than into the other sacrifices, because a mistake there was easy and probable, because that matter might seem something doubtful, by reason of two laws concerning it seemingly contrary, the one Lev. 4:21, where it is to be burned, the other Lev. 6:26, where it was to be eaten. But they are thus reconciled: It was to be burnt when the blood of this sacrifice was brought into the holy place, Lev. 4:16, 17; and when that was not done, which Aaron this first time could not do, for the reason expressed in Lev. 10:18, it was to be eaten, and here lay their mistake… he spares Aaron at this time, as overwhelmed with sorrow, and because the rebuking of him before his sons might have exposed him to some contempt. … V. 19. ‘This day have they offered;’ they have done the substance of the thing though they have mistaken this one circumstance. ‘Such things have befallen me;’ whereby, having been oppressed with grief, and almost bereft of my reason, it is not strange nor unpardonable if I have mistaken. ‘Should it have been accepted?’ because it was not to be eaten with sorrow, but with rejoicing and thanksgiving, as appears from Dt. 12:7; Dt. 26:14; Hos. 9:4; and I thought it fitter to burn it, as I did other sacred relics, than to profane it by eating it unworthily. V. 20. He [Moses] rested satisfied with his answer, either because he thought it reasonable, seeing the letter of the law ofttimes yields to necessities or great accidents, 2 Chron. 30:18; Mt. 12:3,Mt. 12:4; or at least because the things alleged were mitigations of his fault, and he would not add affliction to the afflicted, but rather defer the debate of it to a fitter opportunity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations, on Lev</cite>, 10</span></figcaption>

<main class="wrap"><figure class="quote" id="q-1c7351c444" data-kw="">
<blockquote><p>Yet I will speak what I think, and which, after advised consideration had of all things, touching that place, I suppose is to be determined thereof, namely, that those thousand years (as is evident, most manifestly, even by the event) do not a whit concern or set out the time of the coming of Antichrist: but rather that they are to be reckoned and accompted, after that the said number of years of 666 were once expired… For before the said thousand years were to take place, those things should be accomplished which were spoken of ch. 16:12, namely, that Euphrates should be dried up, and a way opened for the kings of the East to come and make invasion upon those territories and countries, which were before subject to the Romish jurisdiction. Which surely is come to pass: For undoubtedly those kings of the East, which passed through Euphrates, being dried up, (that is, which gave them easy passage through the midst of her channel) and surprised the segniories that belonged to the Romane Empire, were the Turks. Therefore it must needs be that the Turks’ empire should first be raised before those thousand years could be fulfilled. But if we begin to compt those years from the time of Christ’s suffring: then assuredly before the original of the Turks (which is reckoned to be about the year after Christ one thousand two hundred) those thousand years will be fully expired, and so the Apocalypse, that is, the prophecy of the Spirit of God, shall seem false… Wherefore, I am still of the mind I was of, and begin to reckon those 1000 years from the year six hundred sixty-six: which two numbers being put together amount unto one thousand six hundred sixty-six. After which term of time, those things are then to come to pass and be fulfilled: which the Spirit of God in the 19th of the Reuelation, and the chapters following has laid open:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Touching Antichrist</cite>, … (1589), ch. 21, pp. 89-90</span></figcaption>

</figure><figure class="quote" id="q-7441ac4356" data-kw="">
<blockquote><p>Some take these thousand years for the total time of the first coming of Christ unto His second coming, as this word thousand signifies sometimes in Scripture a certain number for an uncertain. See Ps. 91:7; 105:8; Dan. 7:10. But forasmuch as verses 7 and 8, Satan is let loose again after those thousand years, the same cannot be, as neither the opinion of some others who desire to have these thousand years end before the coming of the Antichrist. Seeing in verse 4, even during these thousand years mention is made of some who did not worship the beast nor his image, then Antichrist must also needs have been before the end of the thousand years. Therefore others begin the binding of Satan, that he would deceive the nations no more from the time that Christ, by the preaching of the Gospel and the power of His Spirit by His apostles, has brought the pagan nations in the world everywhere unto repentance; which for the most part was fulfilled about the time of the desolation of Jerusalem and the eradication of the Jews, that is, about the year 70, and end them with the time of pope Gregory VII, who was a strong instrument of the devil to bring the Antichrist’s reign to the highest, and to cause all nations to worship him who sat in the chair about the year 1070. Though some, by reason of the persecutions which Satan raised against the Christians more than two hundred and fifty years after the destruction of Jerusalem, begin these thousand years somewhat later, namely, from Constantine’s time, and continue them till about the year 1300, when the antichrist not only caused the state of Christians to decline more and more, when Boniface VIII reigned over this realm, but also the Turks and Tartars were most set on by Satan to subdue the christian nations in the East and West, and destroyed many kingdoms and Christian churches, not only in Asia, but also in Africa and Europe, as the present condition thereof shows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pastmillennialism.html">Pastmillennialism</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dutch Annotations</cite>, (1637), on Rev., 20:3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/second-coming.html">Second Coming</a></span></div>

</figure><figure class="quote" id="q-1b7202e610" data-kw="">
<blockquote><p>The Fifth Age is of the Church reverting, and Antichrist raging, until this present age when Reformation was aimed at and begun in the West, Antichristian pride was detected and the number of true believers did increase. Then Satan was let loose again, the thousand years of his binding, from the days of Constantine, being expired: then persecutions were frequent; Antichrist foamed and opened his mouth wide to devour the sheep of Jesus. But he who preserved the Woman in the wilderness is the stronger, so that the gates of Hell were not able nor shall be able to prevail against her; yea by the breath of his mouth and preaching of the Word her enemies are scattered, Antichrist is revealed and true Christians are multiplied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-petrie.html">Alexander Petrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Compendious History of the Catholic Church from the year 600 untill the year 1600, showing her Deformation &amp; Reformation: together with the rise, reign, rage, and begin-fall of the Roman Antichrist</cite>, ... (Hague: Adrian Vlack, 1657), Preface, p. 2</span></figcaption>

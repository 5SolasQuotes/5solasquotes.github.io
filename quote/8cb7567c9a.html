<main class="wrap"><figure class="quote" id="q-8cb7567c9a" data-kw="">
<blockquote><p>Thus their divisions increased, and the necessary work which might and should have been gone into, was by their debates first delayed and then entirely marred. And enemies had it to observe and remark that ministers preached and prayed against one another. And Mr. Cargil, they say, publicly protested that they behoved to part one from another because a good many of them would not go into a day of humiliation. When this project failed, I am told, Mr. Hamilton [a lay-leader in the covenanting army] took upon him to send orders to Mr. Welsh, Mr. Hume, Mr. Rae, and others of the more moderate party, to preach against the indulgence, otherwise he and a good many of the officers would not hear them. It is said, Mr. Rae sent a very home and close answer to him, and desired the messenger to tell Mr. Hamilton and the rest, that he had been wrestling against Erastianism in the magistrate for many years; and he would never truckle to the worst kind of Erastianism in the common people [led by Hamilton, with such orders]; that he would receive no instructions from him nor any of them as to the subject and matter of his sermons; and wished he might mind what belonged to him, and not go beyond his sphere and station.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution</cite>, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3, pp. 90-95</span></figcaption>

<blockquote><p>A minority within the Societies, such as Hamilton and Earlstoun, would continue to reject William’s kingship, but the majority, including their ministerial leadership, either tacitly or openly accepted it. That split proved to be fundamental and led to the great schism in the Societies in 1690, when Hamilton and a minority of the Societies refused to accept the Revolution settlement of Church and State, and, ultimately, publicly rejected William’s authority in the Sanquhar Declaration of 1692. (Walker, BP, I, 126; Shields, FCD, 411-2, 418-9.)… The Societies also took steps to secure the Revolution by offering military support…</p></blockquote>

<blockquote><p>3. Nor does it belong to the essence of Presbyterial Government, that all members of this Church, and inferior judicatures, should so submit to the superior respective judicatures, that if they be grieved with the sentence, they ought to acquiesce thereunto, and not to contra-act, but only appeal, until there shall be a general assembly to determine the matter. This never was, and I trust, nor shall ever be their mind who are for presbyterial government; nor do our brethren justly father it upon the general Assembly, 1648, Session 30. For our Church acknowledges no subjection nor subordination of inferior judicatures unto superiors, but in the Lord, and so to submit to any sentence, and to forbear a duty of preaching the Gospel, praying, visiting, exhorting, catechizing pastorally in families, to abstain from the Lord’s Supper, and from acts of due censure necessary for the flock upon the known unjust sentence of a synod, until a general Assembly (which possibly cannot be convened in an age to determine) is to:

1. Obey men unjustly forbidding a called minister of Christ to preach in season, and out of season, rather than God; for they unjustly forbid, and the Lord justly commands; therefore the called minister must act and contra-act to their unjust sentence, and not forbear for an hour, as the Scripture clears, 2 Tim. 4:1-2; Acts 20:17-20; 1 Cor. 9:16; Isa. 58:1; Jer. 1:17; Eze. 2:3-5 &amp; 3:10,17; Acts 5:28-29; and so this is unjust.

2. It is to make synods and ecclesiastical judicatures lords of our faith, which the Reformed Churches detest in popish councils; for all men and councils most lawful can challenge only limited obedience and submission in the Lord to their determinations, if they speak and command ‘according to the Law and the Testimony’, Isa. 8:20, ‘otherwise there is no sight in them.’ And so it is popish.

3. We conceive in performing acts of that government which Christ owns in his Word, we do not sin; for no authority of a judicature can make that to be the word of God, and obedience to God, which was not, as to the matter, obedience to God before that authority, nor on the contrary. Now to abstain from preaching, praying, eating and drinking as the Lord’s Supper in a called minister, and in a visible professor, duly called and fitted, is sin; then cannot the authority of the Church, far less their known unjust sentence make it lawful.

4. Suppose the general Assembly should ratify and confirm the unjust sentence of the inferior judicature, or annul their just sentence, the people of God are not obliged to stand to either the one or the other. So we disown the point which our Brethren delivered to us in their papers for union sought by us, as nothing belonging to the essence of presbyterial government, but reject it as unsound, tyrannical and popish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658), Epistle to the Reader</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>But if one avoid more ordinary communion with a church, as judging it, though not essentially defective, yet to want [lack] or err in some circumstances so considerable as that he counts [that] another church comes nearer the common Christian rule, the Holy Scriptures, and finds its administrations more conducing to his spiritual advantage; he may be led, by the judgment of his conscience, both, sometimes upon weighty and important reasons to communicate with the former [defective Church], and continue therein, according as those reasons shall continue urgent upon him; and yet, sometimes, as the cessant or diminished weight of such reasons shall allow, to communicate with the other [more spiritually advantageous church].</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But if one avoid more ordinary communion with a church, as judging it, though not essentially defective, yet to want [lack] or err in some circumstances so considerable as that he counts [that] another church comes nearer the common Christian rule, the Holy Scriptures, and finds its administrations more conducing to his spiritual advantage; he may be led, by the judgment of his conscience, both, sometimes upon weighty and important reasons to communicate with the former [defective Church], and continue therein, according as those reasons shall continue urgent upon him; and yet, sometimes, as the cessant or diminished weight of such reasons shall allow, to communicate with the other [more spiritually advantageous church].”

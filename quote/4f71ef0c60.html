</figure><figure class="quote" id="q-15b44f5f14" data-kw="">
<blockquote><p>Q. What is the main scope of the First Commandment, ‘Thou shalt have no other Gods before Me?’ A. Here is required all that natural worship of God, whether the same be inward or outward, which is such as if there were no Law prescribed, yet if we well know his nature, we would undoubtedly perform it to Him. Q. Name some principal duties that are here required, with the contrary vices forbidden? A. Here is required faith in God, love to his Majesty, and hope in Him, hearing his voice, calling upon Him by prayer, and such like. … Q What is the main scope of the Second Commandment? A. The Second Commandement enjoyns all that worship of God which is by divine institution and ordinance, Mt. 28:20; Dt. 12:32. Q What are some of the particulars? A. The public and solemn preaching and hearing of his word, and prayer, celebration of sacraments, Church fellowship, election and ordaining of ministers and their whole ministration, with the due observation of Church discipline. … Q. What is the sum of the Third Commandement? A. The things here required are the due manner of observing and using all things that pertain to the natural or instituted worship of God, and all that name of God whereby He makes Himself known unto his people?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-mather.html">Richard Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechisme, or the Grounds &amp; Principles of Christian Religion… (1650), ch. 32, ‘Of the life that beievers ought to live in the world, and of the Law of God’</cite>, pp. 114-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>It would not therefore be thought that that state of the Church, during the first four famous general Councils, wherein the truths of God were vindicated, is to be paralleled with that corrupt state which succeeded to these; yet, considering the beginning of the decay of purity of doctrine and simplicity of worship in the Church, and the way that was then accidentally made for Antichrist’s [the Papacy’s] public appearing…</p></blockquote>

</figure><figure class="quote" id="q-ccbe56d831" data-kw="">
<blockquote><p>Because when we come to worship God, we come to tender up that homage and service unto Him that is due from us as creatures to the infinite Creator; that’s the very end of worship. If you would know what it is to worship God, it is this: You come to tender up that homage and respect that is due from the creature to the Creator. Now when a subject comes to tender up his homage to his prince, he comes towards him [the prince], when he does it immediately:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship… (London: Cole, 1653), Sermon 2</cite>, p. 27</span></figcaption>

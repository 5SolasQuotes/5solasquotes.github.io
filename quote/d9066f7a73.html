<main class="wrap"><figure class="quote" id="q-d9066f7a73" data-kw="">
<blockquote><p>XLII. Those who walk in a manner worthy of the Lord are those who, throughout the course of their lives, follow the will and guidance of God, denying their own desires and the dictates of the flesh, as befits children of the heavenly Father and imitators of God. The consequences are:

1. There is no legitimate religious worship, no good work, unless it is done according to the will and commandment of God.

2. No matter how great the zeal for worship and works that deviate from the will and commandment of God, they are nothing but a great course leading away from the eternal goal of salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1</cite>, (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>

</figure><figure class="quote" id="q-d2d1d6ebfb" data-kw="">
<blockquote><p>Upon the first day of the week, everyone lays by in store, as God prospers him, giving it into a broad [collection plate] at the church door, for the relief of the poor, as 1 Cor. 16:2. It is provided that ministers have competent stipends, as 1 Cor. 9:13, and that hospitals be upholden, Matt 25:35,36; Eccl. 11:1,2, and that the fabric [buildings and external furniture] of the Church be upholden by the [civil] patron and free-holders [civil town citizens],¹ as Mal. 1:10; Hag. 1:4; Hag. 2:16.</p></blockquote>

</figure><figure class="quote" id="q-d29fc826aa" data-kw="">
<blockquote><p>Let every one of you, brethren, give thanks to God in his own order, living in all good conscience, with becoming gravity, and not going beyond the rule of the ministry prescribed to him. Not in every place, brethren, are the daily sacrifices offered, or the peace-offerings, or the sin-offerings and the trespass-offerings, but in Jerusalem only. And even there they are not offered in any place, but only at the altar before the temple, that which is offered being first carefully examined by the high priest and the ministers already mentioned. Those, therefore, who do anything beyond that which is agreeable to His will, are punished with death [Lev. 10]. You see, brethren, that the greater the knowledge that has been vouchsafed to us, the greater also is the danger to which we are exposed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/clement-of-rome.html">Clement of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistle to the Corinthians</cite>, ch. 41</span></figcaption>

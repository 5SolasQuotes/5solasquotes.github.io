<blockquote><p>Clearly the Westminster divines did not believe in the validity of instrumental worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dr-nick-needham.html">Nick Needham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Needham is a contemporary church historian who lectures for Highland Theological College in Scotland</cite>, ‘Westminster and Worship: Psalms, Hymns, and Musical Instruments,’ in The Westminster Confession into the 21st Century, vol. 2, ed. J. Ligon Duncan (Rossshire, Scotland: Christian Focus Publications, 2005), p. 291</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Clearly the Westminster divines did not believe in the validity of instrumental worship.”

— Dr. Nick Needham, Needham is a contemporary church historian who lectures for Highland Theological College in Scotland. | ‘Westminster and Worship: Psalms, Hymns, and Musical Instruments,’ in The Westminster Confession into the 21st Century, vol. 2, ed. J. Ligon Duncan (Rossshire, Scotland: Christian Focus Publications, 2005), p. 291">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CClearly+the+Westminster+divines+did+not+believe+in+the+validity+of+instrumental+worship.%E2%80%9D%0A%0A%E2%80%94+Dr.+Nick+Needham%2C+Needham+is+a+contemporary+church+historian+who+lectures+for+Highland+Theological+College+in+Scotland.+%7C+%E2%80%98Westminster+and+Worship%3A+Psalms%2C+Hymns%2C+and+Musical+Instruments%2C%E2%80%99+in+The+Westminster+Confession+into+the+21st+Century%2C+vol.+2%2C+ed.+J.+Ligon+Duncan+%28Rossshire%2C+Scotland%3A+Christian+Focus+Publications%2C+2005%29%2C+p.+291&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F55ae836a59.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/55ae836a59.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/musical-instruments/the-westminster-confession-and-musical-instruments-in-worship/#:~:text=Clearly%20the%20Westminster%20divines%20did%20not,in%20the%20validity%20of%20instrumental%20worship&amp;text=Clearly%20the%20Westminster%20divines%20did%20not%20believe%20in&amp;text=not%20believe%20in%20the%20validity%20of%20instrumental%20worship" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ee9e51e3f" data-kw="">
<blockquote><p>…The reader will see that I only declared my dislike of organs in our churches, and therein I think I have better authority than those that are of another mind, forasmuch as in the Homily of the Place and time of Prayer (a book established and enjoined by the laws of the land) p. 131, they bring in some superstitious persons, complaining that they could not “hear the like piping, singing, chanting and playing upon the organs, that they could before”: To this is immediately answered thus; “But (dearly beloved) we ought greatly to rejoice and to give thanks to God, that our Churches are delivered out of those things which displeased God so sore, and filthily defiled his holy House”…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelical Worship is Spiritual Worship as it was Discussed in a Sermon</cite>, (1660) | To the Reader</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“…The reader will see that I only declared my dislike of organs in our churches, and therein I think I have better authority than those that are of another mind, forasmuch as in the Homily of the Place and time of Prayer (a book established and enjoined by the laws of the land) p. 131, they bring in some superstitious persons, complaining that they could not “hear the like piping, singing, chanting and playing upon the organs, that they could before”: To this is immediately answered thus; “But (dearly beloved) we ought greatly to rejoice and to give thanks to God, that our Churches are delivered out of those things which displeased God so sore, and filthily defiled his holy House”…”

</figure><figure class="quote" id="q-9aed13649e" data-kw="">
<blockquote><p>What natural, or carnal affections may be excited by them [ceremonies], as men may inflame themselves with idols, Isa. 57:5, or what outward, outside devotion they may direct unto or excite, is uncertain; but that they are no means of stirring up the grace of God in the hearts of believers, or of the increase or strengthening of their faith, which things alone God accepts in Gospel worship, seeing they are not appointed by Him for any such purpose, is most certain: For to say that anything will effectually stir up devotion, that is, excite, strengthen or increase grace in the heart towards God, that is not of his own appointment, is on the one hand to reflect on his wisdom and care towards his Church, as if he had been wanting towards it in things so necessary, which He declares against, Isa. 5:4, ‘What,’ says He, ‘could have been done more to my vineyard, that I have not done in it?’; So on the other [hand], it extols the wisdom of men above what is meet to ascribe unto it. Shall men find out that which God would not, or could not, in matters of so great importance unto his glory and the souls of them that obey Him? yea, and it cannot be but that attendance unto them and their effects must needs divert the mind from those proper spiritual actings of faith and grace, which is its duty to attend unto. And this is evidently seen in them who indulging to themselves in their observation in multiplied instances, as in the Church of Rome, have changed the whole spiritual worship of the Church, into a theatrical pompeous show of carnal devotion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers, and render the worship itself in its performance more decent, beautiful and orderly…?’ pp. 57-58 This quote’s context does not specifically respect musical instruments.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-ee2867da8e" data-kw="">
<blockquote><p>This cathedral music introduces to the Church of God a rabble of church-officers which the Lord never appointed, and which never came into His heart, the choristers and singing-men, and that is a very great evil. It is not in the power of men, but it is the great prerogative of Jesus Christ to appoint officers in His church who has appointed none but pastors and teachers, elders and deacons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-mather.html">Samuel Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Figures or Types of the Old Testament by which Christ and the heavenly things of the Gospel were preached and shadowed to the people of God of old</cite>, (Dublin, 1683), pp. 547-53 of ‘The Gospel of the Feast of Trumpets’; p. 440</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-44a6cfa9e1" data-kw="">
<blockquote><p>…considerable inconveniences, which follow from the introduction, affectation and imposition of a ceremonial way of worship under the Gospel… 2. There is a great obstruction to edification and the salvation of souls [due to the obstructing of spiritual worship and knowing God truly: spiritually as a Spirit]: Beloved, that man understands little of the worth of a soul, that does not value the salvation of one soul, before ten thousand of those unnecessary ceremonies. Better all the organs in the world broken, all material temples leveled with the ground, all sacred garments (as they are accounted) of ministers, cast into a fire, than one soul lost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelical Worship is Spiritual Worship as it was Discussed in a Sermon</cite>, (1660), p. 17</span></figcaption>

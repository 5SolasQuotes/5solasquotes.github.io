<blockquote><p>No man of sound judgment (saith Beza) will deny, that Jesus Christ, the more naked He be, is made the more manifest to us: whereas contrarywise all false religions use by certain external gesturings to turn away men from divine things.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8b0ed966e0" data-kw="">
<blockquote><p>Reason 2. Because nothing is required of them unfitting or burdensome, but that once every week, in convenient time and place, every one would contribute according to that measure wherewith God had blessed him: And the manner is plain, whereby the collection might be made publicly every Lord’s Day, and yet every one should lay it by himself, i. e. no man knowing the sum: We may imagine that they imitated the example of the ancient Church, a bored Chest being placed in the entrance to the house where they met for the Worship of God.</p></blockquote>

</figure><figure class="quote" id="q-38096a0f2f" data-kw="">
<blockquote><p>The worship of God is an honor to be given to God alone according to his commandment: ‘If I be your father, where is my honor?’ ‘I will not give my glory to an other:’ ‘that he that honoureth the Son, might honor the Father also:’ ‘that they may glorify your Father in heaven.’ Prov. 3:9, ‘Honor God with thy riches.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-45f66c372e" data-kw="">
<blockquote><p>…the people’s praying after the minister they say both wastes time, and also makes an unpleasant sound; the Psalms they would not have to be made (as they are) a part of our common [unison] prayer, nor to be said our sung by turns, nor such music to be used with them; those evangelical hymns they allow not to stand in our liturgy; the Litany, the Creed of Athanasius, the sentence of Glory [Gloria Patria] wherewith we use to conclude psalms, these things they cancel, as having been instituted in regard of occasions peculiar to the times of old, and a being therefore no superfluous.</p></blockquote>

</figure><figure class="quote" id="q-fd7f6ad98e" data-kw="">
<blockquote><p>…a definition of the worship of God may be framed thus: The worship or service of God is when, upon right knowledge of God, we freely give Him the honor that is proper to him, in our hearts, according to his own will. Worship thus defined must be condsidered as a distinct thing from that honor which is called ‘veneration’. For worship properly belongs to persons, and veneration to things which appertain to persons. And veneration is to have a reverent estimation of anything or to preserve and keep it without hurt, as making store of it, and to use it reverently if it be to be used.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (d. 1602; London: Legatt, 1626), vol. 1, p. 702</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ad950fb64d" data-kw="">
<blockquote><p>There are in England two sorts of episcopal divines. The one sort are Protestants, differing in nothing considerable from the rest of the Reformed Churches, save only in this matter of Church-government. These (if they be not ignorant, ungodly, negligent, insufficient) I shall heartily reverence and desire their union: And many of them the Church has had, and yet has, with whom I account myself unworthy to be once named: Such as were Jewel, Davenant, and many more formerly; and such as are Archbishop Ussher, Bishop Hall, Bishop Morton, Dr. Sanderson and many more at this day. I am very confident that we have not in our Propositions agreed on any exercise of discipline which is not agreeable to the Principles of Protestant bishops to grant us; nay which Papists do not very many of them allow, where no bishops are. If therefore any of you that are our hearers, being not able to maintain your own conceits, or objections against us, will fly to the authority of episcopal divines; we must entreat you to go to the writings of Protestants only; and if you will inquire of any now living, let them be such as our old godly Protestant bishops were: Or else I must tell you we neither expect their conjunction with us, nor shall much be moved by their judgments. For there is a second sort of episcopal divines of the last edition, and of the growth of about thirty years, who differ from us in greater matters than episcopacy, being indeed Cassandrian Papists, and levelling all their doctrines to the advancement of the Papal interest; If you will appeal to these episcopal divines, we should almost as soon consent to an appeal to Rome… 5. The late bishops [pre-1653], even in the judgment of all moderate men of their own party that ever I spoke with, did very many of them deserve to be put down, and more. Read the articles against Wren, Pierce, Goodman, Laud, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’</cite></span></figcaption>

</figure><figure class="quote" id="q-66b7d80cb8" data-kw="">

</figure><figure class="quote" id="q-5839766dcc" data-kw="">
<blockquote><p>I know that many heap up arguments and bring us long rolls of authorities for episcopacy. And I know that Gersom, Bucer, Beza, [Calderwood’s] Altare Damascenum, Parker, Baynes, Salmasius, Blondel, Prynne (in his Catalogue of Writers against Bishops, and in his History of Bishops, pt. 2, ch. 3 and Unbishopping of Timothy and Titus), Dr. Reynolds and others do give us as long a train of arguments and authorities on the other side… but, methinks all those men that have without prejudice read the authors that I have mentioned (especially Bucer, Parker, and Blondel, and Salmasius), yea, though they have read all that ever was writ on the other side, should be so apprehensive of a difficulty in the business as to be moderate and modest in the censure of their brethren, and not to degrade or excommunicate all that differ from them. … And to have cited Calvin, Beza, Chamier, Pareus, Musculus or any of those multitudes of foreign divines that are known to be against them would have been labor in vain; and so it would have been to have cited Reynolds, Whitaker, Dr. Humphrey and such like at home, who are some known to be against them, and some no fast friends to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>From which testimonies [of Jerome], these things are clear: 1. That there was no difference betwixt the names and offices of bishops and presbyters in the days of the apostles; 2 That the difference was not begun by any apostolic constitution; but upon Church-custom, the decrees of Councils and such other grounds. 3. That although he acknowledges some difference for the time, as that bishops were to ordain, from which presbyters were restricted, yet that is clearly asserted by him not to flow from any divine constitution (for there can be none imagined after the apostles days) but from some human or Church constitution…</p></blockquote>

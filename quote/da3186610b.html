<main class="wrap"><figure class="quote" id="q-da3186610b" data-kw="">
<blockquote><p>Would we do good both to ourselves and others? Let us every one remember the Sabbath day at home, to keep it holy. By this we may be aided in judging of our preparation for heaven. The Sabbath on earth is a type of the Sabbath above. If we find no delight in the holy duties of the day, as now enjoyed, and feel the sacrifice of sanctifying it to be too great, how can we hope to enjoy it in the purity and holiness of heaven? But if it is our delight, and its sacred retirement from worldly cares refreshes the soul, we can discern some degree of conformity to the inheritance of the saints in light.

It is our duty and our privilege, then, to comfort ourselves with the expectation of yet enjoying an eternal Sabbath, where there are no temptations to profane it, no despisers of religion to interfere with its quiet sanctification—no ignorance, through which we may fall into sin, and thus impair our enjoyment,—no disinclination of mind to hold communion with God,—where no weariness in duty, or languor in devotion can make the season appear too long.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/silas-milton-andrews.html">Silas Milton Andrews</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath at Home</cite>, (Philadelphia PA: Presbyterian Board of Publication, 1840), p. 18.</span></figcaption>

</figure><figure class="quote" id="q-bf87252aa8" data-kw="">
<blockquote><p>…we might find much matter, both of rejoicing and mourning, in the wonderful commencement and advancement of this work of reformation [in 1689-1690]. As at the Jews’ return from Babylon to Jerusalem, the priests and Levites, and all the people shouted with a great shout when they praised the Lord because the foundation of the House of the Lord was laid; Yet some of them that had seen the first House wept with a loud voice so that the people could not discern the noise of the shout of joy from the noise of weeping. So at this time we are called to rejoice with thanksgiving for, and we should indeed be very ungrate and unworthy if we did not acknowledge with praise and admiration, the mercy of God which endures forever, manifested and magnified in the progress of this work hitherto… But though for these things we be called to rejoice, yet we are no less obliged to mourn when we observe this House of the Lord, so unlike the former, wanting many things the former had, and pestered with many things the former wanted [lacked]. As at the building of the second House, after the captivity of Babylon, they that had seen the first House wept with a loud voice when they observed its constitution and structure, so far short of the former, for order and beauty, and wanting some glorious prerogatives the other had, as the Urim and Thummim, the fire from Heaven, the ark of the testimony, etc. So, they that have seen our former reformation in its integrity [in 1638-1650], before the late deformation, can hardly refrain from weeping at the sight of the sad disproportion between this and the former. In the former, as the constitution was calculated in the nearest conformity to the divine pattern;</p></blockquote>

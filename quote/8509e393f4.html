<main class="wrap"><figure class="quote" id="q-8509e393f4" data-kw="">
<blockquote><p>If these covenants are still binding on the country, is it not a duty of the most important nature, to bear a testimony against the ingratitude of man in breaking these vows, and for the goodness of God, in having brought the nation into such a close and honourable connection with himself.

In the case of individual saints, defection generally begins with diminished impressions of what the Lord has done for the person’s soul. And it has generally been at this point, that defection has begun in the church. When was it that Israel first turned aside to worship Baal, and Ashtaroth, and the other idol-gods of Palestine? Was it not when Joshua and “the elders that outlived Joshua” were gathered to their fathers, “and there arose another generation after them, who knew not the Lord, nor yet the works which he had done for Israel?”

And did not the defection of the Scottish Church also begin at this point? As Israel provoked God at “the sea, even the Red Sea,” did not our fathers at the Red Sea deliverance of the Revolution, provoke him, by declining, through carnal policy, to assert in a formal manner the obligation of those covenants, which they believed to be still binding on the land? Is it not matter of history, that this was the first introduction of that spirit of worldly expediency, which was afterwards developed into Moderatism? And ought not the revival of a better spirit to be consummated by a public acknowledgment of the vows of God that are lying on the land?

If the covenants be still binding on the country, then Britain must be involved in awful criminality. If this be the case, the church, which does not own the continued obligation of the covenants, cannot fully discharge her duty as the public instructress of the nation, by pointing her testimony against the national sins; nor can she, in an adequate manner, perform the duties of her high function, as an intercessor for the land.

It is a duty we owe to Christ as King of nations, to own the continued obligation of our national covenants. By these solemn deeds, Christ obtained an additional right to his headship over the British dominions. The nation then swore allegiance to Him, vowed to be His in all time coming. He had a right to be the head over all the nations by the covenant of grace, but he obtained a superadded claim to these Islands of the sea, by the national covenants of our fathers; just as in the case of an individual saint, Christ, to whom he already belongs by purchase, acquires an additional right to him by his self-dedication. And I do not see how we can possibly maintain that Christ is King of nations, unless we admit that nations continue bound to him by their oaths of allegiance.

There is, it is true, little likelihood that the scheme of our fathers will be realized in present times. But on that account the matter is by no means unimportant. If it be the truth of God, though it may not be realized in the British empire in our day, it will be realized on a wider field. And our testimony for the grand principles on which covenant obligation is maintained, may be the means of furnishing materials for the construction of nations and churches during the millennial age, when Christ shall reign as king over a covenanted world.

If the covenants be binding, then the land must be lying under an awful load of guilt, for our many and flagrant breaches of these solemn engagements. The first duty, therefore, incumbent on those who admit the continued obligation of these deeds is, to confess the sin of the land in breaking them. A second duty is to feel ourselves under a special obligation in our place and station to carry out the ends of these covenants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-white.html">William White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Covenant the best Defence of Christ’s Crown; or our National Covenants Scriptural, Catholic, and of Permanent Obligation</cite>, (Edinburgh: W. P. Kennedy, 1844), pp 92-93.</span></figcaption>

</figure><figure class="quote" id="q-97886eee8b" data-kw="">
<blockquote><p>The first prejudice then is, That those who dissent and separate from us are the strictest party. In answer to this… As for strictness of opinions, as to government and church communion, if we measure strictness according to the dictates of men’s own spirits, we will yield to them for strictness; and so would our Lord to the Pharisees, and the apostles to the false teachers. But if we measure strictness according to the Word of God, we deny they are strictest, but they are indeed widest from the rule. I will follow Christ to the synagogue of the Jews (I hope some of you at least may understand what I say [who had corruptions in their worship and government]) and in so doing I will be more strict than those that scruple to follow Christ’s example, for fear they be involved in the guilt of the corruptions among them; for the nearer I follow Christ, the more strict I am, if strictness be measured according to the Word of God…</p></blockquote>

<blockquote><p>I cannot see how this piece of policy will hold, seeing the government of our Church as presbyterian is established by a fundamental article of the Treaty of Union, etc.</p></blockquote>

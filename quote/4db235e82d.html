<main class="wrap"><figure class="quote" id="q-4db235e82d" data-kw="paternity filiation procession">
<blockquote><p>“Property” denotes the peculiar mode of subsisting and diacritical character by which this or that person is constituted in his personal being and is distinguished from the others. … there are only three properties—paternity, filiation, procession.</p></blockquote>

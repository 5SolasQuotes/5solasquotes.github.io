<blockquote><p>(Section 7) 3. If the Church prescribe any thing lawfully, so that she prescribe no more than she has power given her to prescribe, her ordinance must be accompanied with some good reason and warrant, given for the satisfaction of tender consciences.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 7, p. 114</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“(Section 7) 3. If the Church prescribe any thing lawfully, so that she prescribe no more than she has power given her to prescribe, her ordinance must be accompanied with some good reason and warrant, given for the satisfaction of tender consciences.”

— George Gillespie, English-Popish Ceremonies (1637), pt. 3, ch. 7, p. 114">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%28Section+7%29+3.+If+the+Church+prescribe+any+thing+lawfully%2C+so+that+she+prescribe+no+more+than+she+has+power+given+her+to+prescribe%2C+her+ordinance+must+be+accompanied+with+some+good+reason+and+warrant%2C+given+for+the+satisfaction+of+tender+consciences.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English-Popish+Ceremonies+%281637%29%2C+pt.+3%2C+ch.+7%2C+p.+114&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F88d4819b25.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/88d4819b25.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-regulative-principle-of-worship/#:~:text=Section%207%29%203.%20If%20the%20Church,for%20the%20satisfaction%20of%20tender%20consciences&amp;text=Section%207%29%203.%20If%20the%20Church%20prescribe%20any&amp;text=warrant%2C%20given%20for%20the%20satisfaction%20of%20tender%20consciences" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-80aa743a1a" data-kw="">
<blockquote><p>…in the use of all indifferencies, in our meals, in our feastings, and merry meetings, in our journeys, in our ordinary talk, and discourse, in our walks, in the actions of our ordinary vocations: Indeed the rule of God’s Word does not at all either command, or forbid the matter of such actions: but the manner of performing them comes under the rule: They are all to be done to the glory of God, in the name of Christ: every good creature is to be sanctified by the Word, and prayer: That command which God gave Abraham (to walk before Him [Gen. 17:1]) is not to be straitened unto the ordinances of God, but to be extended unto all deliberate acts of a man’s life and conversation, Gen. 17:1. Zechariah (in his prophecy of the general call or conversion of Jews, and gentiles) gives this for one character of such, as shall be converted, that they shall have a sacred and sanctified use of things common and indifferent: ‘In that day shall there be upon the bells of their horses, holiness unto the Lord, yea, every pot in Jerusalem and Judah shall be holiness unto the Lord of Hosts,’ Zech. 14:20-21. Not only acts of immediate worship, but all rationall actions, whatsoever, should be offered up as spiritual sacrifices acceptable unto God by Jesus Christ, 1 Pet. 2:5. The apostle exhorts the Romans to salute one another with a holy kiss, Rom. 16:16, this kiss was no religious rite in God’s worship, but a ceremony of civility; and therefore in itself a thing indifferent: And yet the apostle requires holiness for the qualification of it: All our civil actions ought to be such, as becomes saints; that is, so far forth holy for manner, that they be free from sin, and unto the glory of God: Indeed this is a strictness impossible unto lapsed man: But though we cannot exactly and perfectly observe it, yet we may sincerely and cordially endeavor it:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise concerning the Indifferency of Human Actions in A Second Part of The Mixture of Scholastical Divinity with Practical in Several Tractates</cite>, (1660), pp. 58-59</span></figcaption>

</figure><figure class="quote" id="q-3c59836fcd" data-kw="">
<blockquote><p>Men, under the pretense of curing the defects and shortcomings, the nakedness and bareness, attaching to ecclesiastical arrangements as set before us in the New Testament, have been constantly proposing innovations and improvements in government and worship. The question is, How ought these proposals to have been received? Our answer is, There is a great general scriptural principle which shuts them all out. We refuse even to enter into the consideration of what is alleged in support of them. It is enough for us that they have no positive sanction from Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformers &amp; the Theology of the Reformation</cite>, (Edinburgh, Scotland: Banner of Truth, 1989 reprint), p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>Q 73 Why could this covenant not have been valid without a mediator?

A Because God’s justice demanded that he be angry with men forever on account of sin. Therefore, since it was impossible for God to have any fellowship with the human race contrary to his justice, it was necessary that some one intervene who, by pleading with God for us, satisfying the justice of God, and removing every future offence, might again unite God with men who were separated from him.

Q 74 Why must this mediator of the covenant be true man?

A Because the justice of God required that sin be atoned for by suffering and death. But, since the divine nature could not suffer and die, satisfaction had to come through a creature; and since man sinned, through no other creature than man himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Large Catechism</cite>, (1561), trans. Fred H. Klooster and John Medendrop; http://links.christreformed.org/doctrinevision/ursinus_project.pdf.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3dea9d2390" data-kw="">
<blockquote><p>Whether there were any flat necessity of man’s suffering after the Fall is doubted by many and denied by Socinus. Whether this necessity arises from God’s natural justice, or his ordinate, viz. his decree, and the verity of the threatening, is also with many of our own divines a great dispute: Whether God might have pardoned sin if He had not said, ‘The sinner shall die,’ may be doubted of (though I believe the affirmative, yet I judge it a frivolous presumptuous question. But the word of his threatening being once past, methinks it should be past question that He cannot absolutely pardon without the apparent violation of his truth, or wisdom. Some think that it proceeds from his wisdom rather than his justice, that man must suffer: see Mr. John Goodwin, Of Justification, pt. 2, p. 34), but why should we separate what God has conjoined? However, whether wisdom, or justice, or truth (or rather all these) were the ground of it, yet certain it is that a necessity there was that the penalty should be inflicted: or else the Son of God should not have made satisfaction, nor sinners bear so much themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification</cite>, … (Hague, 1655), thesis 5, pp. 12-13</span></figcaption>

</figure><figure class="quote" id="q-d993dbab6f" data-kw="">
<blockquote><p>A Christian [according to the Westminster Confession of Faith] may take up the lawful calling of a magistrate, in contrast to Anabaptism. A magistrate must not exercise his rule in sacred things, in contrast to Erastianism. An infidel magistrate still possesses legal authority, in contrast with Romanism. Although Anabaptism, Erastianism, and Romanism are quite divergent systems, the three share one underlying assumption in their views of the relationship of the State to Christianity–they all teach that lawful civil power is, in some way or another, derived from Jesus Christ as Mediator. Anabaptists denied that non-Christian government is ordained of God. As Robert Baillie relates, they considered the saints to be those who were ‘joined to their Churches and received their Anabaptisme; all the rest of them were wicked and to be cut off.’ Erastians asserted, in the words of Thomas Coleman, ‘that God hath given all magistracy to Christ to be managed under him, for him.’ Romanists made magistrates servants to the papacy. Samuel Rutherford wrote, ‘Stapleton, Bellarmine, and Papists will have them [princes] to be brutish servants, to execute whatsoever the Pope and Councils shall decree, good or bad, without examination.’ All three systems differ as to the application of this principle and the place where ultimate jurisdiction is to be vested–Anabaptists placing it in the Conscience, Erastians in the King, and Romanists in the Pope–but they agree on the principle itself, that Jesus Christ as Mediator is the foundation of civil power. In opposing these three errors, the Westminster divines, with the exception of the Erastian representatives, rejected the view that the civil magistrate derives his authority from Christ as Mediator. Rather, it is from God as the Creator and Supreme Ruler that magistrates receive power… … In contrast to the teaching of the Confession and its framers, theonomy rejects the nature-grace distinction and teaches that the civil magistrate is subservient to Christ as Mediator. Greg Bahnsen claims that ‘A nature/grace dichotomy in the area of civil government is totally alien to the scriptural outlook’ (Theonomy in Christian Ethics, 433). It is taught that ‘the Lord’s Messiah has absolute, firm, and autocratic authority over all the magistrates of the nations; they are guided, directed, and chastised by Him’ (362). The apostle Paul is alleged to have ‘subordinated the authority of Caesar to that of King Jesus’ and ‘by his teaching of the Kingship of Christ Paul was opposing the decrees of autocratic Caesar’ (395).¹ ¹ The Westminster Annotations take the opposite view, and judge the allegation made against Paul and Silas [in Acts 17:7] to be nothing less than a false aspersion cast upon them by the Jews. It also comments, ‘Paul and Silas endeavored to advance the spiritual kingdom of Christ, without any injury to the Roman Empire… the ancient Christians were no disturbers of States.’ ‘Annotations on the Acts of the Apostle’s,’ in The Second Volume of Annotations, on Acts 17:7. Finally it is maintained [by Bahnsen], ‘The only ultimate King in civil government is Christ, and all rulers of the nations derive their authority from Him; hence all magistrates are subject to Christ’s word, even Christ’s confirmation of every bit of the law (Matt 17f.)… National leaders have no exemption from the law of God just as they have no escape from the universal Lordship of Christ’ (429). The civil magistrate, according to this [theonomic] view of it, is a ‘Christocracy’ (432). This means that ‘state leaders are just as obligated to follow Christ’s direction as the church elders are required to obey the Head of the Church’ (433).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-winzer.html">Matthew Winzer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Westminster Assembly and the Judicial Law’ in Confessional Presbyterian</cite>, vol. 5 (2009), pp. 74, 76-77</span></figcaption>

ted+the+view+that+the+civil+magistrate+derives+his+authority+from+Christ+as+Mediator.+Rather%2C+it+is+from+God+as+the+Creator+and+Supreme+Ruler+that+magistrates+receive+power%E2%80%A6+%E2%80%A6+In+contrast+to+the+teaching+of+the+Confession+and+its+framers%2C+theonomy+rejects+the+nature-grace+distinction+and+teaches+that+the+civil+magistrate+is+subservient+to+Christ+as+Mediator.+Greg+Bahnsen+claims+that+%E2%80%98A+nature%2Fgrace+dichotomy+in+the+area+of+civil+government+is+totally+alien+to+the+scriptural+outlook%E2%80%99+%28Theonomy+in+Christian+Ethics%2C+433%29.+It+is+taught+that+%E2%80%98the+Lord%E2%80%99s+Messiah+has+absolute%2C+firm%2C+and+autocratic+authority+over+all+the+magistrates+of+the+nations%3B+they+are+guided%2C+directed%2C+and+chastised+by+Him%E2%80%99+%28362%29.+The+apostle+Paul+is+alleged+to+have+%E2%80%98subordinated+the+authority+of+Caesar+to+that+of+King+Jesus%E2%80%99+and+%E2%80%98by+his+teaching+of+the+Kingship+of+Christ+Paul+was+opposing+the+decrees+of+autocratic+Caesar%E2%80%99+%28395%29.%C2%B9+%C2%B9+The+Westminster+Annotations+take+the+opposite+view%2C+and+judge+the+allegation+made+against+Paul+and+Silas+%5Bin+Acts+17%3A7%5D+to+be+nothing+less+than+a+false+aspersion+cast+upon+them+by+the+Jews.+It+also+comments%2C+%E2%80%98Paul+and+Silas+endeavored+to+advance+the+spiritual+kingdom+of+Christ%2C+without+any+injury+to+the+Roman+Empire%E2%80%A6+the+ancient+Christians+were+no+disturbers+of+States.%E2%80%99+%E2%80%98Annotations+on+the+Acts+of+the+Apostle%E2%80%99s%2C%E2%80%99+in+The+Second+Volume+of+Annotations%2C+on+Acts+17%3A7.+Finally+it+is+maintained+%5Bby+Bahnsen%5D%2C+%E2%80%98The+only+ultimate+King+in+civil+government+is+Christ%2C+and+all+rulers+of+the+nations+derive+their+authority+from+Him%3B+hence+all+magistrates+are+subject+to+Christ%E2%80%99s+word%2C+even+Christ%E2%80%99s+confirmation+of+every+bit+of+the+law+%28Matt+17f.%29%E2%80%A6+National+leaders+have+no+exemption+from+the+law+of+God+just+as+they+have+no+escape+from+the+universal+Lordship+of+Christ%E2%80%99+%28429%29.+The+civil+magistrate%2C+according+to+this+%5Btheonomic%5D+view+of+it%2C+is+a+%E2%80%98Christocracy%E2%80%99+%28432%29.+This+means+that+%E2%80%98state+leaders+are+just+as+obligated+to+follow+Christ%E2%80%99s+direction+as+the+church+elders+are+required+to+obey+the+Head+of+the+Church%E2%80%99+%28433%29.%E2%80%9D%0A%0A%E2%80%94+Matthew+Winzer%2C+%E2%80%98The+Westminster+Assembly+and+the+Judicial+Law%E2%80%99+in+Confessional+Presbyterian%2C+vol.+5+%282009%29%2C+pp.+74%2C+76-77&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd993dbab6f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d993dbab6f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-extent-of-christs-mediatorial-kingdom-2/#:~:text=A%20Christian%20%5Baccording%20to%20the%20Westminster,the%20Head%20of%20the%20Church%E2%80%99%20%28433&amp;text=A%20Christian%20%5Baccording%20to%20the%20Westminster%20Confession%20of&amp;text=to%20obey%20the%20Head%20of%20the%20Church%E2%80%99%20%28433" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The first right which God gave to man to eat flesh, was after the promise, and after that Beasts were consecrated to be sacrificed as Types of Christ, and of his Death. Now these sacrifices of Beasts did shew the nature of the Covenant, and the manner of man’s reconciliation; choosing of clean and harmless Beasts, showed that Christ should be pure and holy in himself, like a Lamb without spot; The consecration of them showed that Christ should in his conception be sanctified, and take our nature, and our sins upon him, that he might be our Redeemer, and our Sacrifice.

The killing of the Beasts, and the burning of the fat, and some parts of them, signified the manner of Christ’s reconciling of us, and working our peace, even by his Death, and passing through the fire of God’s wrath. God’s clothing of Adam and his wife with their skins, signified that Man’s sin and shame is covered with Christ’s satisfaction, and the faithful are to be clothed with the robe of his Righteousness. The liberty which God gave man to eat flesh of Beasts, which he might not before sacrifices were ordained, showeth that we gain more by Christ, than we lost in Adam. This was the first making and revealing of the Covenant.</p></blockquote>

<blockquote><p>One of the greatest misconceptions doing the rounds today is the notion that early Covenanters were opposed to all written prayers and even to the use of the Lord’s Prayer in public worship. Samuel Rutherford helpfully reminds us that this was not the case:

[Y]et did our Church never condemn, but constantly practice the praying of that divine and Canonical prayer of our Saviour, called the Lord’s Prayer, as being commanded, Mat 6.9 Luk 11.2 in matter and manner, though affirmative precepts oblige not ad semper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable and Temperate Plea for Paul’s Presbytery in</cite>, Scotland (London, 1642), p. 326.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b5e9ec14e4" data-kw="">
<blockquote><p>The full assurance of obtaining what we want must not chill our supplications for it. Who can have greater assurance of supply than our Redeemer had of assistance in his task, and exaltation after it? Insured by the promises to him, backed by the oath of God, that he should be a priest for ever, of which he had at this time a sense and impression upon his heart, John xiii. 1, 3, he knew that he should ‘depart out of this world unto the Father;’ and ‘knowing that the Father had given all things into his hands, that he was come from God, and went to God,’ yet he prays for that glory. Promises are not damps, but incentives and guides, to prayer; they are to inflame us, not to cool us.

How can we pray in faith without a promise, which is the ground of faith, since prayer is nothing but a putting promises in suit! Precepts command us to pray, and promises direct us what to pray for, with hopes of success. The promises of a seed to Christ stand firm, yet he is now in heaven an advocate interceding for it. As Christ, though assured, hath nothing without asking, so neither can his members. Promises encourage to put in our claim to them, and not our waiving it. When Daniel knew that the term of the church’s captivity was near expired, according to the promise of God, he buckles more to prayer, Dan. ix. 2, 3</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>, A Discourse on the Knowledge of God</cite>, in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 6-7.</span></figcaption>

</figure><figure class="quote" id="q-2f1681c7f0" data-kw="">
<blockquote><p>The fast is indicted [called and set] eight days before, and the causes laid open for preparing of the people for humiliation (as Joel 2:1-3; Isa. 22:12,13). We have no anniversary [annual] and set fasts or feasts either, because God Himself by his judgment imminent, or already inflicted, or by permitting his people to follow their own ways, calls to fasting and mourning (Isa. 22:13, Joel 2:1-6, etc.), and so by his mercies and wonderful deliverances calls to extraordinary joy of thanksgiving (Ps. 118:24). The doctrine of the Law is preached (as Joel 2 and Isa 58), and the fast observed with abstinence from meat and drink, and carnal and ordinary pleasures (Joel 2:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), Chapter 20, Article 7</span></figcaption>

</figure><figure class="quote" id="q-a71d56be65" data-kw="">
<blockquote><p>Prayer is not a smooth expression, or a well-contrived form of words; not the product of a ready memory, or of a rich invention exerting itself in the performance. These may draw a neat picture of it, but still, the life is wanting. The motion of the heart God-wards, holy and divine affection, makes prayer real, and lively, and acceptable to the Living God, to whom it is presented; the pouring out of thy heart to Him who made it, and therefore hears it, and understands what it speaks, and how it is moved and affected in calling on Him.

It is not the gilded paper and good writing of a petition, that prevails with a king, but the moving sense of it. And to that King who discerns the heart, heart-sense is the sense of all, and that which only He regards: He listens to hear what that speaks, and takes all as nothing where that is silent. All other excellence in Prayer, is but the outside and fashion of it; this is the life of it.

Though prayer, precisely taken, is only petition, yet, in its fuller and usual sense, it comprehends the venting of our humble sense of vileness and sin, in sincere confession, and the extolling and praising of the holy name of our God, His excellency and goodness, with thankful acknowledgment of received mercies. Of these sweet ingredient perfumes is the incense of Prayer composed, and by the Divine fire of love it ascends unto God, the heart and all with it; and when the hearts of the saints unite in joint prayer, the pillar of sweet smoke goes up the greater and the fuller. …

And, indeed, the sincerity and unfeignedness of prayer, makes it go up as a straight pillar, no crookedness in it, tending straight towards heaven, and bowing to no side by the way. Oh ! the single and fixed viewing of God, as it, in other ways, is the thing which makes all holy and sweet, so particularly does it in this Divine work of prayer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary Upon the First Epistle General of Saint Peter</cite>, (1693-94) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 1: 512.</span></figcaption>

2C+makes+it+go+up+as+a+straight+pillar%2C+no+crookedness+in+it%2C+tending+straight+towards+heaven%2C+and+bowing+to+no+side+by+the+way.+Oh+%21+the+single+and+fixed+viewing+of+God%2C+as+it%2C+in+other+ways%2C+is+the+thing+which+makes+all+holy+and+sweet%2C+so+particularly+does+it+in+this+Divine+work+of+prayer.%E2%80%9D%0A%0A%E2%80%94+Robert+Leighton%2C+A+Practical+Commentary+Upon+the+First+Epistle+General+of+Saint+Peter%2C+%281693-94%29+in+The+Whole+Works+of+the+Most+Reverend+Father+in+God%2C+Robert+Leighton%2C+D.D.%2C+Archbishop+of+Glasgow+%282+vols%2C+London%3A+James+Duncan%2C+1828%29%2C+1%3A+512.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa71d56be65.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a71d56be65.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/27/robert-leighton-on-the-life-of-prayer/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-2a5551d19e" data-kw="">
<blockquote><p>This Psalm was composed by David upon occasion, or at the time, of the bringing of the ark of God into the tabernacle which David had prepared for it in Zion, as may be gathered by comparing it with 1 Chron. xvi. 7, 23, 24, &amp;c., where almost the whole Psalm is to be found, But as the ark was an evident type of the Messiah, which David very well knew, as hath been oft-noted before; so David’s thoughts, or at least the design of God’s Spirit, which indited this Psalm, was extended beyond and above it, even to the times of the Messiah, and to his glorious and universal kingdom, in which not the Jews only, but the heathen nations also, should worship the true God, and kiss his Son the Messiah. …

O sing to the LORD a new song: sing to the LORD, all the earth.

A new song, upon this new and great occasion; not the removal of the ark, wherein there was nothing new but an inconsiderable circumstance of place, and that not yet fixed; but the coming of the Messiah, and the confirming of the new covenant by his blood, and the calling of the Gentiles. All the earth; all the nations of the earth, who shall then partake of those great blessings and privileges which are now peculiar to Israel.

2 Sing unto the LORD, bless his name; shew forth his salvation from day to day.

His salvation; that great work of the redemption and salvation of the world by the Messias.

3 Declare his glory among the heathen, his wonders among all people.

You who shall be called out of all the heathen nations to the knowledge of God and Christ, publish this glorious and wonderful work amongst all the heathen nations to whom you belong or may come. …

7 Give unto the LORD, O ye kindreds of the people, give unto the LORD glory and strength.

O ye kindreds of the people; or, O ye families of the people of the world. And the word families may be understood either, 1. Strictly and properly; and so it may be intimated that this great blessing of salvation by Christ should not be imparted to whole nations, but only to some persons taken out of every people and nation, as it is expressed, Revelation v. 9. Or, 2. More largely for nations, as it is taken, Gen. xii. 3 Jer. xxv. 9 Zechariah xiv. 18; and so it may be implied that not only some few of the heathen people should be brought to the acknowledgment and worship of the true God, as was usual in the times of the Old Testament, but that whole nations should come in to the church of God together.

8 Give unto the LORD the glory due unto his name: bring an offering, and come into his courts.

Into the courts of his house. But under this one part of worship he comprehends the whole worship of God; and he speaks of the worship of the New Testament under the expressions of legal worship, as the prophets elsewhere do, as Matt. i. 11, and elsewhere. …

10 Say among the heathen that the LORD reigneth: the world also shall be established that it shall not be moved: he shall judge the people righteously.

Say among the heathen: you converted Gentiles, declare this to those who yet remain in the darkness of heathenism. That the Lord reigneth; that God hath now set up his throne and kingdom in the world. And as that kingdom shall never be destroyed, but shall stand for ever, as is said, Dan. Ii. 44; so the nations of the world shall by the means of it enjoy an established and lasting peace; which is every where mentioned as one of the blessings which the Messiah shall give to the world, as Psa. Lxxii. 3,7; Isa. Ix. 6,7; lxvi. 12; Micah v. 5; Zech. ix. 10.

He shall judge the people righteously; he shall not abuse his invincible power and established dominion to the oppression of his people, as other princes frequently do, but shall govern them by the rules of justice and equity, which is the only foundation of a true and solid peace. See Isa. xxxii. 17.

13 Before the LORD: for he cometh, for he cometh to judge the earth: he shall judge the world with righteousness, and the people with his truth.

Before the Lord; at the presence and approach of their Lord and Maker. To judge the earth; to take to himself that power and authority which belongs to him, to set up his throne and dominion among all the nations of the earth. With his truth; or, in his faithfulness, i.e. so as he hath promised to do. He will certainly and abundantly fulfil all God’s promises made to his people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Holy Bible</cite>, (1685; 3 vols, London: Banner of Truth, 1962), 2: 150-51.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8032717e6d" data-kw="">
<blockquote><p>Oh! the wise invention of the teacher who contrived that while we were singing we should at the same time learn something useful; by this means, too, the teachings are in a certain way impressed more deeply on our minds. Even a forceful lesson does not always endure, but what enters the mind with joy and pleasure somehow becomes more firmly impressed upon it.

What, in fact, can you not learn from the psalms? Can you not learn the grandeur of courage? The exactness of justice? The nobility of self-control? The perfection of prudence? A manner of penance [repentance]? The measure of patience? And whatever other good things you might mention? Therein is perfect theology, a prediction of the coming of Christ in the flesh, a threat of judgment, a hope of resurrection, a fear of punishment, promises of glory, an unveiling of mysteries; all things, as if in some great public treasury, are stored up in the Book of Psalms.

To it, although there are many musical instruments, the prophet adapted the so-called harp, showing, as it seems to me, that the gift from the Spirit resounded in his ears from above. With the cithara and the lyre the bronze from beneath responds with sound to the plucking, but the harp has the source of its harmonic rhythms from above, in order that we may be careful to seek the things above and not be borne down by the sweetness of the melody to the passions of the flesh. And I believe this, namely, that the words of prophecy are made clear to us in a profound and wise manner through the structure of the instrument, because those who are orderly and harmonious in soul possess an easy path to the things above.</p></blockquote>

<blockquote><p>As for the curses drawn out of divers Psalms, where David craveth God’s help against his enemies, desiring that they may be overthrown and confounded, we say as we have said touching that which S. Paul writeth of Alexander the copper smith that is: that David having the spirit of prophecy, might have certain revelation of the overthrow of those against whom he prayed and guided by the same spirit, he forsheweth and wisheth (in conforming him self to the just judgement of God) that his enemies shall come to shame and confusion:

Considering also that this Prophet represented the head of the Church, that is to say Jesus Christ, King of Kings and only head of the faithful: And in this respect he boldly proceedeth and saith: that all they that withstand him whom God hath raised up above others, shall be sharply punished for their boldness and rashness for that they with stand God and his Christ. We may not then defend our selves with such like cursings as are found in many places of Scriptures, seeing there are certain things particular to Prophets, which cannot consequently belong to them that are much inferior to such holy personages: which did as it were foresee their overthrow at hand, whom they wished to be saved if they would have repented: …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-marlorat.html">Augustine Marlorat</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of the sin against the holy ghost made by M. Augustine Marlorate. Translated out of French to the great consolation of all such as repent them of their sins, and to the astonying [sic] of those that mock and despise the gospel of our Lord Jesus Christ</cite>, (London: Lucas Harison, [1570]), unpaginated.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“As for the curses drawn out of divers Psalms, where David craveth God’s help against his enemies, desiring that they may be overthrown and confounded, we say as we have said touching that which S. Paul writeth of Alexander the copper smith that is: that David having the spirit of prophecy, might have certain revelation of the overthrow of those against whom he prayed and guided by the same spirit, he forsheweth and wisheth (in conforming him self to the just judgement of God) that his enemies shall come to shame and confusion:

Considering also that this Prophet represented the head of the Church, that is to say Jesus Christ, King of Kings and only head of the faithful: And in this respect he boldly proceedeth and saith: that all they that withstand him whom God hath raised up above others, shall be sharply punished for their boldness and rashness for that they with stand God and his Christ. We may not then defend our selves with such like cursings as are found in many places of Scriptures, seeing there are certain things particular to Prophets, which cannot consequently belong to them that are much inferior to such holy personages: which did as it were foresee their overthrow at hand, whom they wished to be saved if they would have repented: …”

— Augustine Marlorat, A treatise of the sin against the holy ghost made by M. Augustine Marlorate. Translated out of French to the great consolation of all such as repent them of their sins, and to the astonying [sic] of those that mock and despise the gospel of our Lord Jesus Christ, (London: Lucas Harison, [1570]), unpaginated.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+for+the+curses+drawn+out+of+divers+Psalms%2C+where+David+craveth+God%E2%80%99s+help+against+his+enemies%2C+desiring+that+they+may+be+overthrown+and+confounded%2C+we+say+as+we+have+said+touching+that+which+S.+Paul+writeth+of+Alexander+the+copper+smith+that+is%3A+that+David+having+the+spirit+of+prophecy%2C+might+have+certain+revelation+of+the+overthrow+of+those+against+whom+he+prayed+and+guided+by+the+same+spirit%2C+he+forsheweth+and+wisheth+%28in+conforming+him+self+to+the+just+judgement+of+God%29+that+his+enemies+shall+come+to+shame+and+confusion%3A%0A%0AConsidering+also+that+this+Prophet+represented+the+head+of+the+Church%2C+that+is+to+say+Jesus+Christ%2C+King+of+Kings+and+only+head+of+the+faithful%3A+And+in+this+respect+he+boldly+proceedeth+and+saith%3A+that+all+they+that+withstand+him+whom+God+hath+raised+up+above+others%2C+shall+be+sharply+punished+for+their+boldness+and+rashness+for+that+they+with+stand+God+and+his+Christ.+We+may+not+then+defend+our+selves+with+such+like+cursings+as+are+found+in+many+places+of+Scriptures%2C+seeing+there+are+certain+things+particular+to+Prophets%2C+which+cannot+consequently+belong+to+them+that+are+much+inferior+to+such+holy+personages%3A+which+did+as+it+were+foresee+their+overthrow+at+hand%2C+whom+they+wished+to+be+saved+if+they+would+have+repented%3A+%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Augustine+Marlorat%2C+A+treatise+of+the+sin+against+the+holy+ghost+made+by+M.+Augustine+Marlorate.+Translated+out+of+French+to+the+great+consolation+of+all+such+as+repent+them+of+their+sins%2C+and+to+the+astonying+%5Bsic%5D+of+those+that+mock+and+despise+the+gospel+of+our+Lord+Jesus+Christ%2C+%28London%3A+Lucas+Harison%2C+%5B1570%5D%29%2C+unpaginated.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8b51f5e102.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8b51f5e102.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/08/27/augustin-marlorat-on-the-imprecatory-psalms/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Spiritual songs they are called, both because they are indited [composed] by the Spirit, and because they spiritualize us in the use of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-trapp.html">John Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible</cite>, (d. 1669), on Ephesians ch. 5, v. 19</span></figcaption>

— John Trapp, Commentary on the Whole Bible, (d. 1669), on Ephesians ch. 5, v. 19">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSpiritual+songs+they+are+called%2C+both+because+they+are+indited+%5Bcomposed%5D+by+the+Spirit%2C+and+because+they+spiritualize+us+in+the+use+of+them.%E2%80%9D%0A%0A%E2%80%94+John+Trapp%2C+Commentary+on+the+Whole+Bible%2C+%28d.+1669%29%2C+on+Ephesians+ch.+5%2C+v.+19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F56ec225443.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/56ec225443.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=Spiritual%20songs%20they%20are%20called%2C%20both,us%20in%20the%20use%20of%20them&amp;text=Spiritual%20songs%20they%20are%20called%2C%20both%20because%20they&amp;text=they%20spiritualize%20us%20in%20the%20use%20of%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-be5edc98fb" data-kw="">
<blockquote><p>The Christian Reformed Church holds it as one of its distinctive principles that the psalms are to be used in public worship as the chief manual of praise. There is divine authority for this use of the psalms, as shown by 1 Chron. 16:4, 7; II Chron. 29:30; Ps. 105:2; 95:1, 2 and Neh. 12:24. Our Lord and his apostles used them to praise God. The “hymn” of Matt. 26:30 and Mark 14;26 refers to Psalms 113 to 118, the great “Hallel” of the Passover celebration. The hymns, songs, and psalms of Eph. 15:19 and Col. 3:16 evidently to not refer to N. T. compositions but to the O.T. Psalms which in the Greek version bear the titles given above. The psalms meet the great requirements of praise, exalting God in His being and work and continuing confessions of our unworthiness, our faith, our gratitude, our needs. In depth of spirituality the psalms excel the hymns. “In the psalms we hear the abiding, eternal fundamental note of the pious heart resounding.” [G. M. Ophoff, Church Right—ed.]….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-beets.html">Henry Beets</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Historical and Explanatory Introduction,” in The Psalter, Doctrinal Standards, Liturgy, And Church Order of the Christian Reformed Church in America</cite>, (Grand Rapids: William B. Eerdmans Publishing Co., 1926).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<main class="wrap"><figure class="quote" id="q-32be176ae9" data-kw="">
<blockquote><p>We have often admired the unflinching tenacity with which Romish priests cling to very unpalatable dogmas—a wonderful contrast to many Protestants. It reminds one of the saying of the great actor to the minister: “We speak fiction as if it were truth; and you speak truth as if it were fiction.” It is this self-seeking, soft, and molluscous nature, this feeble and compromising spirit, this lack of stern principle, proceeding both from ignorance and the want of faith, that is the opprobrium and disgrace of many in the Protestant ministry.

Young ministers especially go down to their congregations often with a sad sense of dependence, and, forgetting their ordination vows whilst sometimes making high professions, they allow themselves to be guided and overborne by fussy and pretentious people into introducing or sanctioning innovations. They would never have been martyrs. They mainly aim at man-pleasing, with a view to an easy life, or the gratification of human ambition. It is in reference to this that the apostle introduces his earnest repudiation: “If I yet pleased men, I should not be the servant of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anarchy in Worship or Recent Innovations Contrasted with the Constitution of the Presbyterian Church and the Vows of Her Office-Bearers</cite>, (Edinburgh: Lyon &amp; Gemmell, 1875), p. 19.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-02de796914" data-kw="">
<blockquote><p>The apostle, 1 Tim. 6:3-5, saying, separate from such, has a two-fold sense: Either such as teach otherwise than the truth fundamentally, and then separate wholly: Or not fundamentally, but erring only in points less than the foundation. And these diversely also: Either presumptuously obstinately, and of a desparate conscience: and then if that apear, separate from such wholly: Or else, erring in simplicity and of oversight, and former preiudice, from such, separate not wholly, but only from the very error or errors, in no wise from their Christian communion and society, seeing these are true Christians. Seing therefore our corruptions of the prelacy and ceremonies be of these latter sort: which thing hitherto you haue not, nor cannot overthrow (and withal you must utterly overthrow Master [Thomas] Cranmer and the rest of the martyrs’ Christianity likewise): Therefore we in England, by the grace of God, are still true Christians: and you ought so to acknowledge us, as you will answer unto God: All which you may do, and yet touch no part of our ecclesiastical corruptions at all, to give allowance unto them: And in all this, there is no contradiction with myself, it is but your distempered conceit, that seems contrary. Neither is our absolute departure from the Papists hereby any whit impeached…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jacob.html">Henry Jacob</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of the Churches &amp; Ministry of England, written in Two Treatises, against the reasons and objections of Master Francis Johnson, and others of the Separation commonly called Brownists</cite>, (Middleburg, 1599), ‘Jacob’s 2nd Reply to the 9th Reason’, pp. 79-80</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<main class="wrap"><figure class="quote" id="q-62cf1b0924" data-kw="">
<blockquote><p>amor Dei, ‘the love of God’ … “Considered as a divine attribute, the amor Dei can be defined as the propensity of the divine essence or nature for the good, both in the sense of God’s inward, intrinsic, benevolentia, or willing of the good, and in the sense of God’s external, extrinsic, beneficentia, or kindness, toward his creatures. … Externally or extrinsically, the amor Dei is directed toward all things, but according to a threefold distinction. [1] The amor Dei universalis encompasses all things and is manifest in the creation itself, in the conservation and governance of the world; [2] the amor Dei communis is directed toward all human beings, both elect and reprobate, and is manifest in the blessings, or benefits (beneficia), of God; [3] and the amor Dei proprius, or specialis, is directed toward the elect or believers only and is manifest in the gift of salvation. The amor Dei universalis is frequently called by the scholastics complacentia, or general good-pleasure; the amor Dei communis is understood to be benevolentia in the strict sense of goodwill toward human beings; and amor Dei specialis, is termed amicitia, i.e. friendship or sympathy toward believers. In the discussion of the divine attributes, the amor Dei is considered both as an ultimate essential characteristic of God determinative of the other attributes and as one of the affections of the divine will. In the former sense, resting on the scriptural predication, “God is Love” (1 John 4:8), the scholastics can subsume the grace (gratia), mercy (misericordia), long-suffering (long animitas), patience (patientia), and clemency or mildness (clementia) of God under the amor Dei. In the latter sense, the amor Dei together with these related attributes is viewed as an aspect of the divine willing and is juxtaposed with the wrath (ira) and hate (odium) of God against sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, (1985), p. 31-32</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cfbdfea50a" data-kw="">
<blockquote><p>VI. The negative act includes two: both preterition, by which in the election of some to glory as well as to grace, he neglected and slighted others (which is evident from the event of election); and negative desertion, by which he left them in the corrupt mass and in their misery. However this is so to be understood: (that the are not excepted from the laws of common providence, but remain subject to them; nor are they immediately deprived of all God’s favor [Latin: gratia, or grace], but only of the saving and a vivifying (which is the fruit of election)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1:381</span></figcaption>

</figure><figure class="quote" id="q-9f715a8a9e" data-kw="">
<blockquote><p>God made man upright, gave him a righteous law, which, when broken, that all hopes might not be cut off, He sent his Son: Rom. 8:3, ‘God sending his own Son in the likeness of sinful flesh, and for sin, condemned sin in the flesh,’ to be the foundation of a new covenant; offered you grace in Him, pardon of all your sins past, to help you in the course of obedience for time to come; moved you by powerful arguments, not by low and cheap considerations, but those of the greatest weight, the joys of heaven, the torments of hell; called upon you often by the ministry, knocked at your hearts as well as your ears by his Spirit; waited for your amendment for many years, tried you by mercies if they could melt you, by afflictions if they would reduce you to a sense of your duty. But all this will not do; yet you are still alive, and these means continued. What shall God do more? Now why are you not converted? Others are wrought upon by the same means and turned to the Lord, and have entered in by the strait gate, and framed their desire to walk in the narrow way. They have not offers more rich, or free, or particular. God has not told them of a hotter hell or a better heaven, or another or a more taking gospel. God speaks to you and them in the same terms, with the same grace and favor, and makes the door wide enough to get in.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon</cite>, 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

<blockquote><p>4…. but the conscience is more dull in apprehending that spiritual vengeance follows such spiritual sins as unbelief, because until there be some supernatural revelation, we are dead to the Gospel truths, and Gospel sins, but when a common grace heightens the soul to a supernatural assent, that Christ is a Teacher sent of God (Jn. 7:28; Jn. 3:2), the conviction is more strong: But because it is more supernatural, and in stead of kindly affection of love which it wants [lacks], it is mixed with hatred and anger and so degenerates into fiery indignation against the Holy Ghost, as Jn. 15:24 compared with Mt.12:15; 26:31 clears.</p></blockquote>

<blockquote><p>Christians have been known to spend much time debating who was technically right in the American Civil War/War Between the States. While not an entirely useless endeavour, this approach is in danger of missing the bigger picture. Isaac Nelson, of the Irish Presbyterian Church, reminds us of how the war demonstrated what happens when a nation abandons biblical justice:

His judgment long ago was – that slavery was entirely opposed to all justice. The pulpit had not done its duty in the matter, when it might have done so. The Churches of America had filled the cup of God’s indignation, and the people had now drunk it to the dregs. We find fault with the men who are corrupting the Word of the living God. It was quite possible for a nation as well as an individual to sin away its days of grace; and let us beware that as a nation we are not doing so. The lesson we have to learn from America is this – that they took to their bosom an adder of which we have to mourn, and learn the lesson that to do justice, to love mercy, to walk humbly with God is the only security for national prosperity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-nelson.html">Isaac Nelson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Banner of Ulster</cite>, 22 Apr. 1865</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9e6ae97590" data-kw="">
<blockquote><p>Of the promises it is evident, that to lawful powers is given the sword for punishment of malefactors, for maintenance of innocents, and for the profit and utility of their subjects. Now let us consider, whether the reformation of religion fallen in decay, and punishment of false teachers, do pertain to the Civil Magistrate and Nobility of any realm. I am not ignorant that Satan of old time, for maintenance of his darkness, has obtained of the blind world two chief points: Former, he has persuaded to Princes, Rulers, and Magistrates, that the feeding of Christ’s flock appertains nothing to their charge, but that it is rejected [i.e., devolved] upon the bishops and estate ecclesiastical: and secondarily, that the reformation of religion, be it never so corrupt, and the punishment of such as be sworn soldiers in their kingdom, are exempted from all civil power [per Romanism, for the clergy], and are reserved to themselves and to their own cognition. But that no offender can justly be exempted from punishment, and that the ordering and reformation of religion, with the instruction of subjects, does especially pertain to the Civil Magistrate, shall God’s perfect ordinance, his plain Word, and the facts and examples of those that of God are highly praised, most evidently declare.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Appellation, to the Nobility and Estates of Scotland</cite>, …’ (1558)</span></figcaption>

<blockquote><p>Do not thou cruelly destroy the image of God. Thou angerest thy Maker, when thou killest his image. Consider with thyself, that thou art sorry for an image of brass. Now it is evident to all men what difference there is betwixt a thing that is dead, and that which hath life and a reasonable soul. Moreover, it is an easy matter instead of one brasen image to set up more: but it is unpossible to restore one hair to them that once are slain. Finally, murder is clean contrary to the nature of man. For man cherisheth himself, and flesh destroyeth not itself, but preserveth and nourisheth itself so much as it may. But all we men, as many as live, are of one lump, and of the same substantial flesh: and to kill a man therefore is against man’s nature.

Furthermore, all men are the children of one father, of one stock, and of the same progeny: murder therefore is directly against civil humanity, and is a plague that reigns among men. And doth not the Lord our Redeemer also require charity of all men, which must so abound, that we may not stick to die for our neighbour? To kill our neighbour, therefore, is flatly repugnant to christian religion. And take this by the way too; that the blood of man, shed by murder, crieth out of the earth to heaven for revengement: for to Cain, when he had slain his brother, it was said, “The voice of thy brother’s blood crieth out of the earth, and is come up to me.” For bloodshed verily polluteth and maketh the ground accursed whereon it is shed, and is not cleansed again, nor easily appeased, until it do also drink the guilty blood of them which spilt before the guiltless blood of innocents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly and Learned Sermons, Divided into the Five Decades Containing the Chief and Principal Points of Christian Religion</cite>, trans. H. I. ed. Thomas Harding (1587; 4 vols, Cambridge: The Parker Society, 1849-52), 1: 306-07.</span></figcaption>

<blockquote><p>If any say [such as the Erastians], ‘Who can deny but the magistrate as the magistrate may command that which is obedience to Christ, and reward it, and forbid sin and punish it?’ Answer: But the magistrate as such forbids not sin as sin, for then as a magistrate he should forbid sin under the punishment of eternal wrath, which he cannot do as a magistrate, he only can forbid sin under the pain of his temporary punishment, which he can inflict, and as it disturbs societies and incorporations.</p></blockquote>

</figure><figure class="quote" id="q-1a09d2d7c2" data-kw="">
<blockquote><p>From Adam till now, what is the history of our race? It is a lengthened and almost unvarying bill of mortality. What is the most necessary part of a family possession? It is a burial-place where to lay our dead. What are the words which apply alike to all? It is the solemn sentence —”Dust to dust, earth to earth.” Go where you will, you will everywhere see the ravages of death. There is no island of the blest—no famed spot of earth where you will not meet with the grim and ghastly trophies of his triumph.

There is no speech nor language where you will not hear his hoarse voice calling, “Return ye children of men.” The pyramids of Egypt, while they are a monument of human labour, are also a monument of human folly and of man’s mortality. The decaying cemetery in Jehoshaphat’s vale reads to us an intelligible lesson, even though the epitaphs of the tombs are obliterated. The thickening grave-stones of every church-yard speak to the eye and to the heart, and say, “All flesh is as grass.”

There are times when the truth of man’s mortality is forced upon the mind with the most striking solemnity. The sun rises with a burning heat, and the grass withereth. The progress of the plague, or a fever’s desolation, fills the church-yard and thins the ranks of families; and every house wears mourning, because death hath entered the dwelling; and every countenance wears gloom, because of the uncertainty and fears in which every man lives.

There are other times when the grass is not withered by a sudden stroke, but is cut down by the hand of the mower. At morn it flourishes, it is allowed to stand during the day, but by evening it is doomed to fall before the sickle of the reaper. It is fading at the best. So is it with man. He may escape sudden death, or rapid disease, or premature decay—he may live during his day—but evening comes, and relentless death with his sweeping scythe lays him low.

Every man knows these things; every man is assured that he must die—that sooner or later he will be carried to his long home, and will lie down in his narrow bed. Yet on how few does this assurance exercise a practical effect! It is a general truth of which men speak, but of which they seldom think. Let me ask you, dying man, Have you ever retired into your closet, and held converse with death? Have you ever said to yourself, After a few short years are come and gone, I will go to that place whence I shall not return? Have you ever asked yourself, What shall become of me after I die? Is it true what the Bible says, “After death is the judgment?” Must this soul which animates my bosom live for ever? How awfully solemn are such thoughts!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-w-taylor.html">J. W. Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mortality of Man and the Eternity of the Word of God in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

There is no speech nor language where you will not hear his hoarse voice calling, “Return ye children of men.” The pyramids of Egypt, while they are a monument of human labour, are also a monument of human folly and of man’s mortality. The decaying cemetery in Jehoshaphat’s vale reads to us an intelligible lesson, even though the epitaphs of the tombs are obliterated. The thickening grave-stones of every church-yard speak to the eye and to the heart, and say, “All flesh is as grass.”

There are times when the truth of man’s mortality is forced upon the mind with the most striking solemnity. The sun rises with a burning heat, and the grass withereth. The progress of the plague, or a fever’s desolation, fills the church-yard and thins the ranks of families; and every house wears mourning, because death hath entered the dwelling; and every countenance wears gloom, because of the uncertainty and fears in which every man lives.

There are other times when the grass is not withered by a sudden stroke, but is cut down by the hand of the mower. At morn it flourishes, it is allowed to stand during the day, but by evening it is doomed to fall before the sickle of the reaper. It is fading at the best. So is it with man. He may escape sudden death, or rapid disease, or premature decay—he may live during his day—but evening comes, and relentless death with his sweeping scythe lays him low.

Every man knows these things; every man is assured that he must die—that sooner or later he will be carried to his long home, and will lie down in his narrow bed. Yet on how few does this assurance exercise a practical effect! It is a general truth of which men speak, but of which they seldom think. Let me ask you, dying man, Have you ever retired into your closet, and held converse with death? Have you ever said to yourself, After a few short years are come and gone, I will go to that place whence I shall not return? Have you ever asked yourself, What shall become of me after I die? Is it true what the Bible says, “After death is the judgment?” Must this soul which animates my bosom live for ever? How awfully solemn are such thoughts!”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c30adc8ce" data-kw="">
<blockquote><p>Among the Corinthians the covering of the head was not as it is with us, a token of preeminence and superiority, but a sign of subjection (Mr. [William] Perkins on Revelation); therefore the apostle would have the women of Corinth, when they came into the congregation, to have their heads covered, to signify their submission and reverence unto the ministry of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the New Testament, Philological &amp; Theological… (London, 1654), on 1 Cor. 11 | v. 10</cite></span></figcaption>

</figure><figure class="quote" id="q-e096e87921" data-kw="">
<blockquote><p>…failure to wear the veil not because of vanity, but because of some contrary custom, ‘propter contrariam consuetudinem,’ will excuse the woman from sin. But such a custom is, in St. Thomas’s beautifully understated style, ‘non sit laudabilis,’ not praiseworthy.</p></blockquote>

</figure><figure class="quote" id="q-521b1ca99a" data-kw="">
<blockquote><p>2. Paul’s traditions which he delivered, were either concerning matters of doctrine and faith, which are perpetual, and they be all expressed in the Scriptures, or else of ceremonies which are mutable by authority of the church, according to time, places, and persons, observing the general rules prescribed by the Apostle, that all things be done in order and comeliness, and to edification. … 16. Paul saith, the apostles and church have no such custom to be contentious. Chrysostom, homily 27, in Epistle X. Cor. for matters of external order, yet does he give reasons for that order of covering women’s heads. By whose example the preachers are likewise to endeavour to satisfy by reason both men and women, that hurnbly desire their resolution for quiet of their conscience, and not to beat them down with the club of custom only. For so the apostle does not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fulke.html">William Fulke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confutation of the Rhemish Testament… (1582; NY: 1834), on 1 Cor. 11:2, 16</cite>, p. 202 Fulke (1538–1589)</span></figcaption>

</figure><figure class="quote" id="q-7540fcb622" data-kw="">
<blockquote><p>…if [1 Cor. 11:2 speaks] of indifferent ceremonies, it is still farther from touching us. For these may be changed, provided only the reason and end be preserved; nor are they necessary, as is plain from the place before us. For the apostle speaks of that modesty which women ought to observe in the congregation, and of that decency also which is required in men when they frequent religious meetings and assemblies. He desires men to pray with uncovered, women with covered heads: which injunctions are not of a perpetual obligation; for they are not now observed even by the papists themselves, so as to make it plain that all churches are not bound to the same ceremonies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton (1588; Cambridge: Parker Society, 1849)</cite>, p. 549</span></figcaption>

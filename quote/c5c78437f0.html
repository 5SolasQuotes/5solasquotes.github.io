<main class="wrap"><figure class="quote" id="q-c5c78437f0" data-kw="">
<blockquote><p>[P]eople have no ground at all to suspect their own gracious standing in reference to God because of their straights. Deep and devouring dangers may be ready to swallow up the righteous, God may bring an Abraham into the Mount, unto great difficulties, God’s people may travel through the red sea in the way to Canaan, seas of trouble, bloody times may overtake them who are most dear to God.

This I rather note because God’s people are apt to dash upon this rock, and to do themselves much wrong by thus reasoning. If God did love me, or had been graciously respective to my humiliations and prayers, I should not have seen so black, so dark a day. My self and mine, our peace and Parliament, our persons and possessions had never been in such danger, if the Lord had been favourable to me in seeking better times. Herein David failed: Psal. 73.13, 14. Verily I have cleansed my heart in vain, and washed my hands in innocency, for all the day long have I been plagued, and chastened every morning.

Now to keep us from adding guilt to our grief, that we may not provoke God to be angry, while our enemies are filled brim full of blood-thirsting fury. I will briefly suggest four considerations, to preserve us from this mistake.

1. By this error acted, we deny the perfection of the word of God, because therein there is no such rule to judge by. Yea the Scriptures openly and evidently speak the contrary, Eccles. 9.1, 2. No man knoweth either love or hatred by all that is before them. All things come alike to all, there is one event to the righteous and to the wicked. And certainly if we shall dare to add our devices to God’s word, he will be angry. Add thou not unto his words lest he reprove thee, and thou be found a liar.

2. Thus people bear false witness against themselves, by passing unjustifiable sentences against their own souls. Thou shalt not bear false witness against thy neighbour. To detract from our neighbour’s credit and comfort, is a breach of God’s law. And truly it admits many aggravations, when we deal thus injuriously with our selves.

3. We express much ingratitude to God, the God of all our mercies, calling his love into question, and overlooking or undervaluing all former favours, because of present pressures and approaching dangers. Let Israel’s miscarriage in this kind be your looking-glass to shew the foul face of this fault, that you may take heed of this deformity. When Pharaoh pursued them, and the roaring seas threatened to devour them, their deliverance out of Egypt (though wrought on by many miraculous providences) was accounted a misery rather then a mercy, for observe their language, Exod. 14.11. wherefore hast thou dealt thus with us?

4. By this mistake we reach a wrong to others, Psal. 73.15. If I say I will speak thus, behold I should offend against the generation of thy children. Our carriage in this particular may cast sad discouragements upon the hearts of many dear to God, causing them to question their spiritual state, because of outward straights. Hereby also we seem to suspect their wisdom who uphold their hopes, and maintain their comforts, notwithstanding their manifold heavy afflictions.

Censure not others to be rejected or abhorred by the Lord, because you meet with them in the Mount, you see them in straights, in extremities. Beloved, the words of the Psalmist are considerable. Blessed is he that considereth the poor, the Lord will deliver him in time of trouble, the Lord will strengthen him upon the bed of languishing, thou wilt make all his bed in his sickness. As you desire favourable dealing from God in the time of your personal calamity, learn to judge wisely and charitably of them who are in extremity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/simeon-ashe.html">Simeon Ashe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A support for the sinking heart in times of distress, or, A sermon preached in London to uphold hope and allay fear January 4th which was a day of great trouble and deep danger in the city</cite>, (London: Thomas Underhill, 1642), pp 13-15.</span></figcaption>

<blockquote><p>From the conformity of our church to the primitive apostolic Church. For since no one can deny that the primitive church was instituted by Christ and the apostles neither can it be denied that our church, if it is conformed that both in faith and in worship, was even then in it. Now it is easy to prove that it is conformed if we approach the examination of doctrine, as we so often desire. From this it will appear that nothing is received by us to be believed or done which was not delivered by Christ and the apostles; and whatever is rejected by us has no foundation in the writings, but is beyond what is written (par ho gegraphtai) And beyond that gospel which they preached (Gal 1:8). Nor is it to be said here that the ancient church cannot be said to be the same with ours because it did not reject the papacy, as we have done. (a) Faith and religion by themselves (and essentially) are not negative, but positive, since a negation or a rejection of error is by accident and positive faith suffices for the essential unity of the church. (b) if it did not reject explicitly (because the papacy had not yet sprung up), it rejected it implicitly and virtually by teaching such things as are incompatible (asystata) with it (in which way the scripture is said by the positing of the truth to reject errors not yet arisen, but only about to arise in the in the progress of time).</p></blockquote>

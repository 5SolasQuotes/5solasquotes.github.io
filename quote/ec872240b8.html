<main class="wrap"><figure class="quote" id="q-ec872240b8" data-kw="">
<blockquote><p>The covenant conception is of frequent occurrence in the O[ld] T[estament]. Used at first in connexion with single transactions and partial aspects of the religious intercourse between God and man, it later becomes the formula designating the entire structure and content of the religion of Israel in its most comprehensive sense.

This latter representation occurs as early as Gn 17:1-14 Ex 19:5 24:7-8, and often in Deuteronomy. The earlier covenants belonging to the time of Noah and Abraham (Gn 6:18 9:8-17 15:18) do not yet possess this comprehensive character, but appear as solemn religious rites whereby some particular promise of God is made sure.

Whether the word berith (בְּרִית) originally meant ‘enactment,’ ‘appointment,’ ‘law,’ a meaning which it undoubtedly has in several instances, or did from the beginning signify a two-sided agreement, cannot be determined with certainty. It seems easier to conceive of the former sense as developed out of the latter than the reverse. At any rate, the comprehensive signification in which it stands for the whole religious relationship between God and Israel, rests on the idea of the covenant as a two-sided agreement.

It should be remembered, however, that the two-sidedness never extends so far that God and Israel appear on an equal footing in the determination of the covenant. The planning and proposing of the covenant belong exclusively to God. Still the fact that Israel voluntarily accepts the covenant is as strongly emphasized (Ex 19:5 24:3, 7, and elsewhere). Indeed, the covenant idea serves primarily to express the free, ethical, historically originated bond that exists between God and Israel.

Its covenant character marks off the religion of Israel as a religion of real, conscious, spiritual fellowship between God and His people, in distinction from the religions of paganism, in which either the Deity and the creature are pantheistically fused, or the Godhead after a deistic fashion is so far removed from the creature as to render true communion impossible, and where the relation between a national god and his worshippers is not a matter of choice but of necessity on both sides. …

On the one hand, the covenant idea begins to express the continuity of God’s dealings with His people; as it is a bond freely established, so it is the fruit of design and the fountain of further history, it has a prospective reference and makes Israel’s religion a growing thing; in a word, the covenant idea gathers around itself the thoughts we have in mind when speaking of a history of redemption and revelation.

On the other hand, inasmuch as God is the originator of the covenant and has solemnly bound Himself not merely to fulfil His promises to Israel, but also to carry out His own purposes contemplated in the covenant, the same bond which originally expresses the freedom of the relation between God and Israel can also become the pledge of the absolute certainty, that God will not finally break with His people, Israel’s infidelity notwithstanding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenant in James Hastings, John A. Selbie, and John C. Lambert (eds), A Dictionary of Christ and the Gospels</cite></span></figcaption>

<blockquote><p>Paybody [a Formalist] thinks kneeling in the act of receiving the communion to be expedient for the reverend using and handling of that holy sacrament, and that much reverence arises to the sacrament from it. Answer: I verily believe that more reverence arises to the sacrament from kneeling than is due to it; But I am sure there is no less true reverence of that holy sacrament among such as kneel not in the receiving of it than among such as do kneel. I hope it is not unknown how humbly and reverently many sincere Christians, with fear and trembling, do address themselves to that most holy sacrament, who yet for all the world, would not kneel in receiving it. Thus we see that these expediencies pretended for the ceremonies are attained unto as well and better without them, than by them.</p></blockquote>

<blockquote><p>And in the seventh chapter [Jn. 7:23], He defends this fact of his, saying, ‘If a man upon the Sabbath receive circumcision, that the law of Moses should not be broken; be ye angry with Me, because I haue made a man every whit whole on the Sabbath day?’ If the law of circumcision do bind men to minister and receive it upon the Sabbath, then much more does the law of love bind men to show mercy upon the Sabbath, seeing that it is appointed of God, not to hinder us from, but to further us in all his works, among which the relieving of them that be in necessity, is one of the chief and principal. And as the Lord Jesus Christ came not to destroy the law, but to fulfill it, so He observed it very carefully in this point, and being most full of compassion, did declare it abundantly, by taking all oportunity to succour them that were in misery, even upon the Sabbath, as the fittest time for it.</p></blockquote>

<blockquote><p>For answering… how the Mediator is the object of divine worship: we shall first distinguish this title ‘object,’ then answer. By divines there is in this case a threefold object acknowledged (all agreeing to the Mediator in some respect):

1. There is objectum materiale, or, quod [‘that’], that is, the object, or Person to whom worship is given.

2. There is objectum formale, or, quo, that is, the account upon which it is given to that Person, or object.

3. There is objectum considerationis, that is, the consideration that the worshipper has of that object in worshipping of Him, and is as a motive thereto, or is (as the learned Voetius calls it, specificatio objecti) ‘the specification of the object,’ whereby the heart of the worshipper, by taking up the object worshipped under such a consideration, is warmed with love and thankfulness, and strengthened in his confidence, to worship that object. Thus, the relations that God took on Him to be the redeemer of His people from Egypt, and from the land of the North, did give no new object of worship, yet did they give some external denominations, or specifications, of that object, God, to them: the consideration whereof in their worshipping did much qualify the object to them, so that with the more thankfulness and confidence they might approach to Him: and thus we distinguish between the object worshipped, and the consideration which may be had of Him in our worship. And this does not make Him adorable simply and in Himself, because He was so naturally; but, it is the ground upon which He is accessible to us, who are sinners and enemies:</p></blockquote>

<blockquote><p>These words contain the fourth Commandment of the Decalogue, being the last of the first Table concerning our duty to God immediately. The Sum of it is to appoint unto men a set and solemn time wherein they should wholly give themselves to the study of holiness, and to the performance of holy exercises necessary for that purpose. …

It is propounded in these words, Remember the Sabbath-day to sanctify it. Remembrance is properly of things past, but here according to the usual acceptation of the word, it signifies a diligent consideration of the thing before hand, as where the young man is commanded, Eccles. 12. 1. To remember his Creator in the days of his youth, that is, seriously to consider of him. It is all one as if he should say, diligently observe, for so he interprets himself Deut. 5. 12.

Think upon and accordingly provide for the observation of this holy rest, by dispatching all the works of thy calling, that nothing might be undone which providence and diligence might prevent, that might hinder thy rest on the seventh day. Men are apt to forget the Creation of the world, therefore the Lord appointed the fourth Commandment; and to forget Christ, therefore he appointed the standing Ordinance of the Lord’s Supper, Luk. 22. 19.

The Sabbath-day] or the day of rest, and ceasing from labour, as the word properly signifieth, which is repeated again in the conclusion of the Commandment. It must not be bestowed as other days, but then they ought conscionably to forbear those things which on other days they might lawfully perform, for rest is a cessation from doing things.

To sanctify it] or keep it holy, that is, to employ the day in holy duties of God’s immediate worship, to sanctify it, to set it a part to holy uses and purposes. So two things are required, 1. The remembrance of the time, which is a serious preconsideration to prepare for it. 2. A careful celebration, consisting in resting and sanctifying it, for a bare rest is not enough, but such a rest as tendeth to and endeth in the sanctifying of it.</p></blockquote>

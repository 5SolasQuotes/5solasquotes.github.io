<main class="wrap"><figure class="quote" id="q-1b6e183838" data-kw="">
<blockquote><p>I confess that there have been wise men, that there have been philosophers of the ancients very eminently distinguished; there were also among them princes and legislators of most respectable genius and celebrated fame. But the principles of their philosophy were deficient, and besides, is there any one who can point out their influence or their efficacy? Can a single country be mentioned, a single city, a village, nay a single man, whom they have taught the true knowledge of God and the pure worship acceptable in his sight?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Revealed Religion</cite>, trans. William Crawford (1737; Belfast: James Magee, 1778), § 1, p. 25.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eb369c8c3a" data-kw="">
<blockquote><p>The first remark which we would make for these words is, that, while a “Sabbath is made for man,” we nowhere read of a Sabbath made for devils. What would the spirits shut up in darkness and in misery give for a weekly Sabbath – a weekly rest – a weekly cessation of misery – a weakly trust from the attacks of the elements of their agony? Truly they would find it no difficulty to “count their Sabbath their rest – a delight.” (Is. lviii. 13.) We would never hear of them being weary of it, or saying, “Would God it were over!”

If that “worm which dieth not” were to slumber for one period out of seven – were those “fires which are not quenched” to be extinguished during one part of the time out of seven – were conscience, with its lash of scorpions, driven back and kept at a distance, so that a weekly rest, a strange Sabbath, might be formed for those to whom, as matters are, there belongeth nothing but “a fearful looking for of vengeance and fiery indignation” – we are quite prepared to see that this would be a boon for which they would scrupulously avoid any line of conduct which would cause the removal.

And from what would thus, in such circumstances, be the actings of those who are shut up in hopeless despair, we, respited and reprieved sinners, may, in solemn and trembling awe, receive a most important lesson. For if, concerning the unearthly supposition which we have made, such a gift would be received with a wild and ecstatic joy, as a periodic gleam of peace, breaking up the monotony of the agony and the despair of the damned, with how much greater joy and rejoicing ought we to receive the return of our Christian Sabbath? For (to speak for a moment longer of this imagination about the condemned) their Sabbath – their rest – would be infinite less valuable than ours.

Their Sabbath, when completed, would throw them full again into the lap of all their misery – misery unmitigated, and to be thus eternally returned to, deriving almost an increased poignancy from its temporary cessation. Their worm would again receive them to the uncontrolled reign of his six days’ malice, augmented (shall we say?) by the temporary release of his victims; and the consuming fire would again blaze forth (shall we say?) with forced redoubled by its temporary suppression. The last hour of supposed Sabbath, as it rang their rest away, would be the returning knell of their spiritual death, obtrusively reminding them, by its regular recurrence, that for them there was no beam of hope – “that hope that comes to all.”

How different the Christian Sabbath given to man! It is designed as the means of saving him from his unbroken eternity of death. It is intended to perpetuate itself for ever. It is intended to lead man where all is rest and all is Sabbath. And oh! If such greater powers belong to it – if such greater gifts are wrapt up in it than in that awful supposition we have made – and if, stinted and mean and meagre as the gift of the day of rest to devils would be, they would nevertheless receive it with a joy and a gladness inconceivable – how ought we to be ready to “count it a delight – the holy of the Lord, and honourable?” (Is. lviii. 13.) “This is the day which the Lord hath made; in it will we rejoice and be glad.” (Ps. cxviii.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath made for Man: A Sermon Preached in the Free Church, Panbride, on February 2, 1845. In Accordance with the Recommendation of the General Assembly</cite>, (Dundee: McCosh, 1845), pp 5-6.</span></figcaption>

</figure><figure class="quote" id="q-265e68f485" data-kw="">
<blockquote><p>Mercy and truth are met together, righteousness and peace have kissed each other. When God made heaven and earth out of nothing, he made them by a word, without any other ceremony; but, when he made man, there was some particular solemnity, a grand council, as it were, of the glorious Trinity called; Come, let us make man after our image. But now man having unmade himself, if God hath a mind for the praise of his own glorious grace to make him up again, by a new creation in Christ Jesus, there must be a more glorious solemnity yet; not only a council of the adorable Trinity, but a grand meeting of all the attributes of God, to consult their own glory that was marred, and reconcile their own interests, and seemingly contradictory claims:

For the sin of man had brought real confusion among all the creatures of God on earth, yea, and seeming war among all the attributes of God in heaven, concerning the execution of the sentence of the law upon mankind, the transgressor thereof; some of these attributes, such as Mercy, saying, if the sentence of death be executed upon them, how shall I be glorified? Others, such as Truth, saying, if the sentence be not executed, how shall I be glorified? Is it to be expected that such opposites can meet together? Or, if they meet, that they will agree together cordially? Yea, tho’ it be beyond the expectation of men and angels, yet behold, it is here celebrated with a song? Mercy and truth are met together, righteousness and peace have kissed each other. …

But now, if we would know what sort of glory it is that appears when Christ is revealed, why it is even the glorious harmony of all the divine attributes illustriously shining in him, who is both our salvation and our glory; Mercy and truth are met together; righteousness and peace have kissed each other. Now, tho’ these words may be applied to the happy meeting of graces in men, upon the revelation of Christ in the soul, which I may afterwards observe in the sequel, and in which sense some interpreters understand it, yet I take it mainly to import the happy meeting of perfections in God to be glorified in the sinner’s salvation by Jesus Christ, which is a gloss that no interpreter I have had occasion to consult does neglect or omit; and, if any of them should miss it, I think they would miss the very ground-work and foundation of all other happy meetings: Mercy and truth are met together, righteousness and peace have kissed each other.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c1195806d4" data-kw="">
<blockquote><p>The Zeeland form for ministers reads: ‘We the undersigned ministers of the Word declare by this subscription, that we heartily believe and are persuaded that all the articles and points of doctrine contained and explained in this Confession and Catechism, from greatest to least, do fully conform (in alles conform syn) to the Word of God, and we also hereby solemnly promise, as the occasion requires, to teach and advocate all these points of doctrine publicly and privately. And if at any time we should have any sentiment or objection against any article or point of doctrine, contained in the aforesaid Confession and Catechism, we promise that we will neither publicly nor privately present the same except properly in classical or synodical assemblies, under the penalty of being censured as schismatics. And if at any time the classis or synod may deem it proper, to maintain unity in doctrine, to require of us our further sentiments and explanation of any article of the aforesaid Confession or Catechism, we also hereby promise to be always ready and willing to do so, without refusal, under the penalty above mentioned.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands.html">Donald Sinnema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Origin of the Form of Subscription</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-2ad6c74ffd" data-kw="">
<blockquote><p>This presbytery consisting of more pastors is the first ruling and governing Church, having power of the keys in all points of discipline within themselves; They have intensively power of the keys in all points, and equal power, intensive [intensively] with greater synods and assemblies, because ordination of pastors by them, 1 Tim. 4:14, is as valid in the point of Church discipline as the decrees made in the great council convented at Jerusalem, Acts 15:21-22, etc. But provincial synods and national assemblies have greater power than the presbyteries extensive [extensively]; because they have power as a great body to exercise discipline that concerns the whole congregations of all the nation, which power is not in inferior elderships.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2ad6c74ffd" data-kw="">
<blockquote><p>This presbytery consisting of more pastors is the first ruling and governing Church, having power of the keys in all points of discipline within themselves; They have intensively power of the keys in all points, and equal power, intensive [intensively] with greater synods and assemblies, because ordination of pastors by them, 1 Tim. 4:14, is as valid in the point of Church discipline as the decrees made in the great council convented at Jerusalem, Acts 15:21-22, etc. But provincial synods and national assemblies have greater power than the presbyteries extensive [extensively]; because they have power as a great body to exercise discipline that concerns the whole congregations of all the nation, which power is not in inferior elderships.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, ... (London, 1642), ch. 13, pp. 188-99</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-67b306feaf" data-kw="">
<blockquote><p>The Estates of Parliament, presently convened by his Majesty’s special authority, considering the supplication of the General Assembly at Edinburgh, the 12th of August 1639, to his Majesty’s high Commissioner, and the Lords of his Majesty’s honourable Privy Council; and the act of council of the 30th of August 1639, containing the answer of the said supplication; and the act of the said General Assembly, ordaining, by their ecclesiastical constitution, the subscription of the Confession of Faith and Covenant mentioned in their supplication: and withal, having supplicated his Majesty to ratify and enjoin the same by his royal authority, under all civil pains, as tending to the glory of God, the preservation of religion, the King’s Majesty’s honour, and the perfect peace of this kirk and kingdom; do ratify and approve the said supplication, act of council, and act of Assembly; and, conform thereto, ordain and command the said Confession and Covenant to be subscribed by all his Majesty’s subjects of what rank and quality soever, under all civil pains; and ordain the said supplication, act of Council, and act of the Assembly, with the whole Confession and Covenant itself, to be insert and registrate in the acts and books of parliament; and also ordain the same to be presented at the entry of every parliament, and, before they proceed to any other act, that the same be publickly read, and sworn by the whole members of parliament claiming voice therein; otherwise the refusers to subscribe and swear the same shall have no place nor voice in parliament: And sicklike, ordain all judges, magistrates, or other officers, of whatsoever place, rank, or quality, and ministers at their entry, to swear and subscribe the same Covenant, whereof the tenor follows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/civil-parliament.html">Civil Parliament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Charles I, Parliament 2, Act 5, Act anent the Ratification of the Covenant, and of the Assembly’s Supplication, Act of Council, and Act of Assembly concerning the Covenant, at Edinburgh, June 11</cite>, 1640</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-d090d11438" data-kw="">
<blockquote><p>§31. p. 356, etc. Rule 23. [The opponent said:] ‘Subscription to Articles and forms of Confession in any particular Church is wholly of political consideration.’ Subscription ought to be so intended that he who has subscribed may not perceive himself taken in a snare: but yet he that subscribes must do it to those purposes and in that sense and signification of things which the supreme power intends in commanding it; that is, at least that he that subscribes do actually approve the Articles overwritten: that he does at that time believe them to be such as it’s said they are; i.e. true, if they only say they are true; useful, if they pretend to usefulness; necessary, if it be affirmed that they are necessary. For if the subscriber believes not this, he by hypocrisy serves [only] the ends of public peace and his own preferment. When Articles are established without necessity [i.e. the establishment of non-necessary articles], subscription must be required without tyranny and imperiousness. That is, it must be left to the liberty of the subject to profess or not profess that doctrine. To bring evil on men that do not believe the Article and dare not profess to believe what they do not, is injustice and oppression; it is a law of iniquity, and therefore it is not obligatory to conscience, and no human authority is sufficient for the sanction and imposition. Question: Can it be lawful for any man to subscribe what he does not believe to be true, giving his hand to public peace and keeping his conscience for God? Answer: No, if subscription signify approbation; for in that case it is hypocrisy, etc. But if subscription were no more than the office of a clerk of the signet or council, who in form of law is to sign all the acts of the council, it were different. For it is not as an account of his own opinion, but as a formality of the court: all the world looks on it as none of his personal act. But in subscription to Articles of Confession every ecclesiastic that subscribes does it for himself, lubens et ex animo subscripsi [‘I have subscribed willingly and from the heart’], is our form in the Church of England. If the intention of our superior be to require our assent, he that subscribes does profess his assent; and whatever he thinks himself, it is the intention of the imposer that qualifies the subscription. No particular Church ought with rigor to require subscriptions to Articles not evidently true and necessary to be professed: because in the division of hearts that is in the world, it is certain that some good men may dissent, and then either they shall be afflicted or tempted to hypocrisy: of either of which if ecclesiastic laws be guilty, they are not for edification: they are neither just, nor pious, and therefore oblige not. §32. pp. 358-59, ‘At least let the Articles be made with as great latitude of sense as they can and so that subscriptions be made to the form of words; let the subscribers understand them in what sense they please which the truth of God will suffer and the words can be capable of.’ This is the last remedy; but it is the worst: It has in it something of craft, but very little of ingenuity; and if it can serve the ends of peace or of external charity, or of fantastic concord [a concord of the fantasy], yet it cannot serve the ends of truth and holiness, and Christian simplicity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace</cite>, 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

<blockquote><p>Up to this time [1573], the prevailing practice was that only ministers signed the Belgic Confession. In 1574, however, the provincial Synod of Dordrecht decided that ‘it would be useful that the elders and deacons also subscribe to the Netherlands Confession, and to the articles of the [Emden] Synod.’ For this purpose, it was considered advisable that a copy of the confession and of the articles of the Emden Synod be kept by all consistories [sessions] or at least by all classes [presbyteries]. For the first time, schoolteachers were also required to sign the confession and to submit to the ‘discipline’ or articles of the Emden Synod. The idea of elders’ and deacons’ subscribing was not immediately accepted in all the churches. For example, at Delft the elders and deacons refused to sign the confession, while at Middelburg they did. Gaspar van der Heyden, pastor at Middelburg and president of the recent Dordrecht Synod, on 16 November 1574 wrote to Delft pastor Arent Cornelisz: ‘Our elders and deacons have signed the Confession of Faith and the articles of the [Emden] synod; I certainly wish that yours had done the same. How would they who now refuse to sign the Confession with ink seal it with their own blood?&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands.html">Donald Sinnema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Origin of the Form of Subscription</cite></span></figcaption>

<blockquote><p>But who can fail to be aware that the sacred canon of Scripture, both of the Old and New Testament, is confined within its own limits, and that it stands so absolutely in a superior position to all later letters of the bishops, that about it we can hold no manner of doubt or disputation whether what is confessedly contained in it is right and true; but that all the letters of bishops which have been written, or are being written, since the closing of the canon, are liable to be refuted if there be anything contained in them which strays from the truth, either by the discourse of some one who happens to be wiser in the matter than themselves, or by the weightier authority and more learned experience of other bishops, by the authority of Councils</p></blockquote>

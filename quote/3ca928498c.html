<main class="wrap"><figure class="quote" id="q-3ca928498c" data-kw="">
<blockquote><p>The church and its supreme governor demanded obedience in all things indifferent. Nonconformists (and it was in this context that the word ‘nonconformist’ first entered the English religious vocabulary) complained that to enforce the use of these things on reluctant consciences was to deprive them of their indifference. The doctrine of ‘Christian liberty’ which came to the fore in these circumstances, was arguably the taproot of that species of Christian conviction known ever since as Puritanism. It was not equivalent to individualistic license, but rather to a conviction that the edification of the church, composed of ‘lively stones’, required the emancipation of conscience from all human ordinances and its total subjection to the word of God… … In 1566 Archbishop Matthew Parker, in consultation with his suffragans and prompted by the queen, published some ‘Advertisements,’ a call to strict conformity… The resultant crisis rocked both the universities of Oxford and Cambridge and came to its head in London, toward Easter 1566. Thirty-seven ministers, much of the preaching ministry in London, at first refused to conform and were suspended; of these a few, the hardest of the hard core, were eventually deprived of their livings… …the Vestiarian Controversy introduced a lasting fault line into the Elizabethan church. The more drastic presbyterianism of the 1570’s might never have come about if it had not been for the episcopal ‘persecution’ of those who cast off the surplice in the 1560’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-collinson.html">Patrick Collinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Vestiarian Controversy’ in Oxford Encyclopedia of the Reformation (1996), vol. 4</cite>, pp. 231-32</span></figcaption>

<blockquote><p>Liturgical vestments that distinguished the priest from the community are attested only from the fourth century onward. There are no guidelines or regulations given in the New Testament. Moreover, the early Christian communities did not place themselves in the tradition of the Old Testament priesthood and its cultic dress… As the customary everyday dress changed, the clergy held on to the old style of dress… This older form of dress… served to distinguish the clergy from the other members of the community. In Rome as early as the sixth century it seems that there existed blessings for liturgical vestments. From the ninth century onward prayers were said as the vestments were put on… Liturgical vestments were given ever new allegorical interpretations reflecting salvation history (Rabanus Maurus [780-856] and Amalar of Metz [775-850])… …In the adiaphorist [indifferent] controversy Zwingli, Calvin, the Anabaptists, and Matthias Flacius Illyricus [a Lutheran] and his followers among other things called for doing away with liturgical vestments. As early as the first Zurich Disputation of 1523 Zwingli rejected liturgical vestments; he allowed for them in his work De canone missae epicheiresis, which appeared that same year; finally, toward the end of the year, presumably under external pressure, he adopted a stance against vestments. In the Zurich regulations of 1535 he disapproved of external adornments such as silk, gold and silver in the churches on the grounds that the early church not only did not possess these things, but even rejected them.</p></blockquote>

<blockquote><p>Yea there are among you now many things of a lower [superstitious] nature, which some dare scarce plainly say God commands or forbids, and yet they are censorious enough about them: …That it is unlawful to wear a gown in divine worship if it be commanded.</p></blockquote>

</figure><figure class="quote" id="q-2ec377fb86" data-kw="">
<blockquote><p>The Genevan practice of wearing black academic gowns, white preaching bands, and black caps deliberately indicated that ministers were teachers of the Word rather than sacerdotal mediators. There clothes were not considered clerical vestments but were standard attire for clergy to be worn during and outside public worship (Maetsch, Calvin’s Company of Pastors, 19; William D. Maxwell, John Knox’s Genevan Service Book, 1556 (Westminster: Faith Press, 1965), 210-213). Lavater’s Short Work on Rites and Regulations described a similar approach to clerical attire in Zurich; however, the clerical dress was more informal than Calvin’s: clergy were to ‘wear ordinary, yet respectable clothing (as other respectable citizens do), not theatrical clothing.’ John Knox held a similarly minimalist approach among the English exiles in Frankfurt, signaling his displeasure at Cranmer’s retention of the surplice. In a sermon on Noah’s drunkenness and the subject of what should or should not be covered up, he touched upon the sensitive matter of English cleric John Hooper’s refusal to wear clerical vestments (Jane Dawson, John Knox (New Haven, CT: Yale University Press, 2016), 101). Earlier in 1550, Hooper refused to be consecrated as bishop, partly on the grounds of what he perceived to be unreformed vestments (‘those Aaronic habits’). (John Hooper to Heinrich Bullinger, June 29, 1550. See Hastings Robinson, Original Letters Relative to the English Reformation, 2 vols. (Cambridge: Cambridge University Press, 1846-1847), 1:87) In reply, both Martin Bucer and Peter Martyr Vermigli refuted his position on the basis that vestments were adiaphorus [indifferent]. Vermigli made the slightly backhanded remark that ‘indifferent things cannot corrupt those that are of a pure mind and sincere conscience in their doings.’ (Correspondence between Bucer, Martyr and Hooper in George Cornelius Gorham, Gleanings of a Few Scattered Ears During the Period of the Reformation in England (London: Bell and Daldy, 1857). Bucer and Martyr’s replies to Hooper were also used by Archbishop Parker [who sought to universally enforce such clerical dress] in response to the Vestarian Controversy under Queen Elizabeth I. Quotes are in Matthew Parker, A Brief Examination for the Tyme…, (London: Richard Jugge, 1566), RSTC 10387, sig. C.2r.) Hooper–helped by a spell in prison–begrudingly took the advice on board and was consecrated Bishop of Gloucester later that year. Thus, when Knox and his colleagues left the English congregation at Frankfurt for Calvin’s Geneva, they found the clerical attire more congenial to their approach. However, when the Genevan exiles returned home after the death of Queen Mary, they had mixed success in implementing their desired clerical attire. Knox returned to Scotland where the Genevan gown became the norm, whereas Christopher Goodman and others returned to England were vestments were retained (indeed, to the 1549 standards). The controversy over vestments was reignited and contributed to the production of the Middelburg Liturgy (1586) by the English Puritans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-earngey.html">Mark Earngey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Soli Deo Gloria: The Reformation of Worship’ being ch. 2 of Reformation Worship: Liturgies from the Past for the Present (New Growth, 2017)</cite>, pp. 42-43</span></figcaption>

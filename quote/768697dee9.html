<main class="wrap"><figure class="quote" id="q-768697dee9" data-kw="">
<blockquote><p>Although Justification be a Court action, and drawn from judicatories, yet God is not in this action, considered merely as a Judge, but as paternus Judex, a fatherly Judge, having an admirable temperament of justice and mercy, so that God pronounceth this sentence from the Throne of Justice and Mercy also; of Justice, in that he will not absolve, till satisfaction be made, and he will not pronounce righteous, but where there is a perfect righteousness:

Therefore that opinion, of making Faith to be accepted of for righteousness is a dangerous and false assertion. God in this work of Justification, is never described, as accepting of an imperfect righteousness for a perfect. No, God doth not cease to be just, while he is thus gracious.

Again his Justice and righteousness is herein seen, that none shall be Justified, but such sinners who feel their guilt, and desire to be eased of that burden, believing and rolling their souls upon him. It is very hard to give the right order of the benefits of Vocation, Justification, Adoption and Sanctification; but yet this may be made good against the Antinomian, that a man is not Justified, till repenting and believing. Here is Justice then but there is also a great deal of Grace and Mercy[.]

As in the accepting of a surety for us, that he would not keep to the Law, of having us in our own persons to pay the utmost farthing: This was great love; so likewise to find out a way for our reconciliation; that when the devils had no remedy provided for them, we have. Further, that when this price is laid down, we have the application of this benefit, and so many thousands have not. Two in a Bed, in a Family, in a Parish, one Justified, and the other condemned; What Grace is this?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), p. 12.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9306965dc9" data-kw="">
<blockquote><p>We do not say that the confidence by which we are justified is the forgiveness of sins already perceived, nor that the object of this confidence is the forgiveness of sins previously perceived; but that confidence by which we each believe our sins are forgiven in the present, not properly in the past or future, although both pertain to justifying faith, but not to the high, so to speak, formal aspect of justifying. When, therefore, the Gospel word offers mercy and forgiveness of sins through Christ to every believer, faith does not only believe in general that this is true, that sins will indeed be forgiven to all who truly believe in Christ, but also the believer confidently persuades himself that this promise applies to him, and by that act of confidence, he is then forgiven his sin, and it becomes his happiness mentioned by the apostle in Rom. 4:7. Just as by extending a hand and accepting a gift, the beneficiary who has approached becomes a participant. Thus, in a faithful person, there are simultaneously forgiveness of sins and confidence about that forgiveness; and by the faith through which that mercy and special grace were received, it is afterward retained, and what was believed about the future is embraced in the present, and what about the past remains certain afterward. But one who believes he will be justified if he believes in Jesus Christ is not yet justified in the past unless he believes in the present that righteousness is given to him, which he receives by the same act. What is later believed about the past does not justify him but presupposes him as justified. All these acts are of the same justifying faith, the first indeed predisposes to justification, the second properly justifies, the third pacifies the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162 | LXV. This is also the doctrine of the Professors of Leiden, critiqued in the eleventh chapter of the Remonstrants’ Confession, whose author is Andreas Rivetus. They say:</span></figcaption>

<blockquote><p>In every generation, the doctrine of justification by faith alone comes under attack. As the heart of the gospel, the doctrine of justification is most fundamental to the definition of salvation and any adequate understanding of the atoning work of the Lord Jesus Christ. In our current cultural milieu where orthodox belief is despised and innovation is praised, many have ignored, maligned, or sought to redefine the biblical doctrine of justification by faith alone. Unfortunately, there are even those within more conservative theological domains whose definition of justification by faith falls short of the biblical and reformed doctrine of justification, particularly as defined in the Westminster Standards. To combat these harmful perversions, we here seek to define a clear, confessional polemic that might serve the church as a bulwark to “strengthen what remains.” …We deny that a man’s works, in any way, contribute to his justification, whether before or after believing on Christ in faith.[4] We deny that we are justified by “sanctifying fruit” in addition to faith in the perfection of Christ’s work. Furthermore, we deny that doing such works from a “justified position” qualifies those works to become somehow instrumental in obtaining one’s “final salvation”. …We deny that our deliverance requires the believer’s attainment of two statuses: namely initial justification and final salvation. While we still await the future enactment of our salvation, when the wrath of God against the nations is revealed and his children are brought into the kingdom fully, the ground of that future salvation is entirely present to the individual in the work of the Spirit at the moment of justification.[8] Furthermore, as God himself calls those whom he predestines, justifies those whom he calls, and glorifies those whom he justifies, we deny that any who are predestined, called, or justified may fail to partake of glorification in the end. Thus, we deny that our salvation from the final judgment is established or obtained through the works which proceed from that justification.</p></blockquote>

ork+of+the+Spirit+at+the+moment+of+justification.%5B8%5D+Furthermore%2C+as+God+himself+calls+those+whom+he+predestines%2C+justifies+those+whom+he+calls%2C+and+glorifies+those+whom+he+justifies%2C+we+deny+that+any+who+are+predestined%2C+called%2C+or+justified+may+fail+to+partake+of+glorification+in+the+end.+Thus%2C+we+deny+that+our+salvation+from+the+final+judgment+is+established+or+obtained+through+the+works+which+proceed+from+that+justification.%E2%80%9D%0A%0A%E2%80%94+General+Synod+of+the+Bible+Presbyterian+Church%2C+Resolution+on+the+Doctrine+of+Justification%2C+%28August+2%E2%80%936%2C+2018%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F406050a4e5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/406050a4e5.html">Permalink</a><a class="src" href="https://heidelblog.net/2018/09/bible-presbyterian-church-we-reject-a-final-justification-through-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>In verse 27 of chapter 3, after he dwells for a little while on the conclusion of the demonstration and has preached a little more fully about the righteousness of faith, he connects the two parts of the principal syllogism and gathers them into one, and after denying the contrary manner of justifying, which is by works, he concludes the manner of justifying that is true and singular, namely, which is by faith. He also concludes the universality of those justified by faith. For as he shows the universality of sinful men, so he also teaches the universality of men who are justified.</p></blockquote>

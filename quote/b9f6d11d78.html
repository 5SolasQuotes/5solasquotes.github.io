<main class="wrap"><figure class="quote" id="q-b9f6d11d78" data-kw="">
<blockquote><p>Another point in the [Cambridge] platform [of 1649], not universally received, is, the distinct office of ruling elders, to join with the pastors in those acts of church-rule, which are distinct from the ministry of the word and sacraments, or to watch over the conversation of the church-members with authority.

There are some who cannot see any such officer as what we call a ruling elder, directed and appointed in the word of God; and the inconveniencies, whereunto many churches have been plunged by elders, not of such a number, or not of such a wisdom, as were desirable, have much increased a prejudice against the office itself; be sure, partly through a prejudice against the office, and partly, indeed chiefly, through a penury of men well qualified for the discharge of it, as it has been heretofore understood and applied, our churches are now generally destitute of such helps in government.

On the other side; there are others, who, if they asked, What order for lay-elders in the word of God? Answer, that properly, the only lay-elders known to be in any church, are the chancellours in the church of England; persons entrusted with the rules of the church, and yet not ordained unto any office in it.

But, that unless a church have divers elders, the church-government must needs become either prelatic or popular; and that a church’s needing but one elder, is an opinion contrary not only to the sense of the faithful in all ages, but also to the law of the scriptures, where there can be nothing plainer, than, elders, who rule well, and are worthy of double honour, though they do not labour in word and doctrine; whereas, if there were any teaching elders, who do not labour in word and doctrine, they would be so far from worthy of double honour, that they would not be worthy of any honour at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cotton-mather.html">Cotton Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Magnalia Christi American: or, The Ecclesiastical History of New-England, from its First Planting in the Year 1620, unto the Year of our Lord, 1698</cite>, (1702; 2 vols, Hartford CN: Silas Andrus, 1820), Book 5, ii, 206.</span></figcaption>

<blockquote><p>Now beside the apostles, prophets and evangelists, which were not ordained to be ordinary and perpetual offices in the Church, there are but two ecclesiastical orders or degrees instituted by Christ in the New Testament, viz. elders and deacons. Excellenter Canones d•…os tantum sacros ordines appellari censent, Diaconatus scilicet &amp; Presbyterat•…, quia hos solos primitiva Ecclesia legitur habuisse, &amp; de hi•… sol•… praeceptum Apostli habe•…, says the Master of Sentences (bk. 4, distinction [??])… Moreover, 1 Tim. 3, he gives order only for bishops and deacons, but says nothing of a third order. Wherefore it is manifest that beside those two orders of elders and deacons, there is no other ecclesiastical order which has any divine institution, or necessary use in the Church. And princes should do well to apply their power and authority to the extirpation and rooting out of Popes, Cardinals, Patriarches, Primates, Archbishops, Bishops, Suffragans, Abbots, Deanes, Vice-Deans, Priors, Archdeacons, Subdeacons, Chancellours, Chantours, Subchantours, Exorcists, Monks, Hermits, Acoluths, and all the whole rabble of Popish orders, which undo the Church, and work more mischief in the earth than can be either soon seene or shortly told. But contrary wise, princes ought to establish and mantain in the Church, elders and deacons, according to the apostolical institution. Now elders are either such as labor in the Word and doctrine, or else such as are appointed for discipline only…. And many more of our divines, who teach that the apostle 1 Tim. 5:17, directly implies that there were some elders who ruled well, and yet labored not in the Word and doctrine, and those elders he means by them that rule, Rom. 12:8 and by governments, 1 Cor. 12:28, where the apostle says not ‘helps in governements,’ as our new English translation corruptly reads, but ‘helps, governements,’ etc. plainly putting ‘governements’ for a different order from ‘helps’ or deacons… Deacons were instituted by the apostles for collecting, receiving, keeping, and distributing of ecclesiastical goods, which were given and dedicated for the maintenance of ministers, churches, schools, and for the help and relief of the poor, the stranger, the sick and the weak, also for furnishing of such things as are necessary to the ministration of the sacraments. Beside which employments, the Scripture has assigned neither preaching, nor baptizing, nor any other ecclesiastical function to ordinary deacons… And as for the other sort of elders, together with deacons, we judge the ancient order of this Church [of Scotland], to have been most convenient for providing of well qualified men for those functions and offices. For the eighth head of the first book of discipline, touching the election of elders and deacons, ordains that men of best knowledge and cleanest life, be nominated to be in election, and that their names be publicly read to the whole Church by the minister, giving them advertisement, that from among them must be chosen elders and deacons: that if any of these nominated be noted with public infamy, he ought to be repelled: And that if any man know others of better qualities within the Church, then these that be nominated, they should be put in election, that the Church may have the choice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), ch. 8, Digression 1, ‘Of the Vocation of Men of Ecclesiastical Order’, pp. 160-63</span></figcaption>

<blockquote><p>…according to the Scripture phrase it is termed a ‘presbytery’. It is made up of the pastor or pastors of every congregation, together with those governing elders which labor there (not in doctrine, but) in discipline only: of which things, we have spoken before (above, Digression 1 [pp. 161-2, 170-1]).</p></blockquote>

</figure><figure class="quote" id="q-da4e78acf0" data-kw="">
<blockquote><p>It is the height of this bitter tyranny to act cruelly towards the wife by stripes or blows, which we do not read that any one among the heathen did unless he was drunk or mad. Hence the civil law [of England] permits the wife to avail herself of a divorce if she can prove that her husband has beaten her: and it gives as a reason that blows are foreign to a state of freedom, Cod. lib. 5, tit. 17, De repudiis and in Novell, Constit. 117. For no superiority whatever gives the power of coercing the inferior by blows. If two persons enter into a league of friendship on the condition that the younger shall obey the elder, and be directed in all things by his wisdom and discretion; he is bound to obedience by virtue of this contract: but if he refuse to do that, he cannot be forced to his duty by blows. The same must be said with regard to the matrimonial contract: for in this the husband and wife agree to a certain amicable fellowship in life, so that the wife is to be subject to her husband and directed by him; but as a companion, not as a slave; by advice, not by stripes. Aristotle gives this reason, because it is not ft to instil such fear into the wife, which may be injurious both to respect and love: but that servile fear which is instilled by blows is subversive of both. Neither is it fit that anyone should exercise power over another by constraint supported by no law; but that power of chastising a wife by stripes is supported by no law either divine or human. Finally add, that is not to be done which cannot be done without sin and what always derives its origin from this sin of bitterness. For although parents often chastise their children from love; yet both the experience and conscience of everyone will testify that no one proceeds to beat his wife except from anger, bitterness or hatred; all which are unlawful things and diametrically opposite to the matrimonial state. Therefore, let all bitterness be done away.</p></blockquote>

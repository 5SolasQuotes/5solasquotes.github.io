<main class="wrap"><figure class="quote" id="q-93537f1367" data-kw="">
<blockquote><p>The enemy, who always fights against the peace of the Lord’s children, finds great advantage against them when their spirits are weakened and worn down by long illness, and is often permitted to assault them. The reasons are hidden from us, but they are doubtless worthy of his wisdom and love; and they terminate in victory, to the praise of his glorious grace, which is more signally manifested by his leading them safely through fire and water, than if their path was always smooth.

He is sovereign in his dispensations, and appoints some of his people to trials and exercises, to which others, perhaps, are strangers all their days. Believers are soldiers: all soldiers by their profession are engaged to fight, if called upon; but who shall be called to sustain the hottest service, and be most frequently exposed upon the field of battle, depends upon the will of the general or king.

Some of our soldiers are now upon hard service in America, while others are stationed round the palace, see the king’s face daily, and have no dangers or hardships to encounter. These, however, are as liable to a call as the others; but, if not called upon, they may enjoy with thankfulness the more easy post assigned them.

Thus, the Captain of our salvation allots to his soldiers such stations as he thinks proper. He has a right to. employ whom he will, and where he will. Some are comparatively at ease; they are not exposed to the fiercest onsets, but live near his presence: others are, to appearance, pressed above measure, beyond strength, so that they despair even of life; yet they are supported, and in the end made more than conquerors through him who hath loved them.

Long observation convinces me, that the temptations which some endure are not chastisements brought upon them by unfaithfulness, or for any thing remarkably wrong in their spirit or walk; I often rather consider that in his warfare, as in worldly wars, the post of danger and difficulty is the post of honour, and as such assigned to those whom he has favoured with a peculiar measure of his grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-newton.html">John Newton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter dated 2 September 1776, Cardiphonia; or, The Utterance of the Heart, in the Course of a Real Correspondence</cite></span></figcaption>

</figure><figure class="quote" id="q-a02d2c5bf4" data-kw="">
<blockquote><p>The word in both covenants was for a long time in the world, even from Adam’s time till Moses, unwritten; delivered as from hand to hand, and continued by a lively voice: for I pass over such matters as Joseph records to be ingraven in columns before the flood, as also the Apocryphals of Henoch.

And when as in continuance of time corruptions grew, by these traditions, and the purity of the doctrine of the covenant could not thus be preserved, and that God would no longer follow the former course only, he began in Moses time to ordain and to publish another form, to wit this, to preserve and to continue the purity of the celestial doctrine in written books, approved and sealed by divine authority and testimony; &amp; the more to commend his written word unto men, in all succeeding ages, God himself with his own hand did first write in tables of stone the words of the Decalogue:

Next after this, he gave it in charge unto Moses, that he should afterwards write and record all things which he received at God’s own mouth: and that the people of God might be assured that the books of Moses came not by man’s will, but were given by divine inspiration, the Lord sealed and testified these writings to be his heavenly oracles, by many great wonders, before they were written, when they were written, and after they were written.

And Moses wrote the Word of both covenants; of both I say, Legal and Evangelical: but whereas he gave, but as it were, the first lineaments of the Evangelical covenant, he set forth the Legal covenant clearly and in full measure. For the legal covenant in the books of Moses is clearly recommended and urged, but the Evangelical more darkly set before us. For which cause all the doctrine of Moses is said to be legal: The Law came by Moses, Joh. 1.</p></blockquote>

</figure><figure class="quote" id="q-5a77753ae2" data-kw="">
<blockquote><p>What to Moses and the Prophets was not a sufficient cause of separation from the Churches of their time, is not a sufficient cause for us to separate from the Churches in our times. But, want of satisfaction by convincing signs of the true grace of many members of the Church, was not a sufficient cause for Moses and the Prophets to separate in their times.

Ergo: The minor is clear and uncontroverted; for Moses and the Prophets were so far from separating from the Churches of their days for want of assurance of the true grace of every person in these Churches that they remained still to their dying day in the bosom of these Churches, communicating with them in the Word, Prayer, Sacraments and Sacrifices, though they were assured of the evident wickedness of the most of their fellow-members.

Moses knew the Body of Israel to be a crooked and perverse generation: Isaiah tells the Jews that they were another Sodom; Jeremy sheweth that Israel in his days was uncircumcised in heart, no better then Moab, Ammon, or Edom; Micah, that the godly in his time were very rare as the summer fruits, as the grapes after the Vintage; of this truth all the Prophets are full; yet for all this, none of the Prophets did ever think of a separation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (London, 1645), p. 157.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

Ergo: The minor is clear and uncontroverted; for Moses and the Prophets were so far from separating from the Churches of their days for want of assurance of the true grace of every person in these Churches that they remained still to their dying day in the bosom of these Churches, communicating with them in the Word, Prayer, Sacraments and Sacrifices, though they were assured of the evident wickedness of the most of their fellow-members.

Moses knew the Body of Israel to be a crooked and perverse generation: Isaiah tells the Jews that they were another Sodom; Jeremy sheweth that Israel in his days was uncircumcised in heart, no better then Moab, Ammon, or Edom; Micah, that the godly in his time were very rare as the summer fruits, as the grapes after the Vintage; of this truth all the Prophets are full; yet for all this, none of the Prophets did ever think of a separation.”

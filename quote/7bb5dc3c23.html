<main class="wrap"><figure class="quote" id="q-7bb5dc3c23" data-kw="">
<blockquote><p>Ordination appears to have been performed by apostles, by evangelists, and by a presbytery, Acts 6:6, and 14:23; Tit. 1:5; 1 Tim. 5:22, and 4:14: but never by private Christians. Could these [private Christians] ordain their pastors or other ecclesiastic officers, to what purpose did Paul leave Titus at Crete to ordain elders in every city? Or why did he write never a word about ordination to the people, in any of his epistles, but to their rulers?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters on the Constitution, Government &amp; Discipline of the Christian Church</cite>, (d. 1787), pp. 73-74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“Ordination appears to have been performed by apostles, by evangelists, and by a presbytery, Acts 6:6, and 14:23; Tit. 1:5; 1 Tim. 5:22, and 4:14: but never by private Christians. Could these [private Christians] ordain their pastors or other ecclesiastic officers, to what purpose did Paul leave Titus at Crete to ordain elders in every city? Or why did he write never a word about ordination to the people, in any of his epistles, but to their rulers?”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8b57c8d624" data-kw="">
<blockquote><p>And even in the matter of the appoinitment of the ministry of the apostle commanding Timothy that he should not communicate with other men’s sins (1 Tim. [5:22]) in the ordination of unfit and unable ministers, he thereby gives to understand that there might be unworthy men ordained ministers against his voice…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, eds. Peel &amp; Carlson, Cartwrightiana (London: Halley Stewart, 1951), ‘Letter to Mrs. Stubbes his sister-in-law to persuade her from Brownism’, p. 69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“And even in the matter of the appoinitment of the ministry of the apostle commanding Timothy that he should not communicate with other men’s sins (1 Tim. [5:22]) in the ordination of unfit and unable ministers, he thereby gives to understand that there might be unworthy men ordained ministers against his voice…”

— Thomas Cartwright, eds. Peel &amp; Carlson, Cartwrightiana (London: Halley Stewart, 1951), ‘Letter to Mrs. Stubbes his sister-in-law to persuade her from Brownism’, p. 69">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+even+in+the+matter+of+the+appoinitment+of+the+ministry+of+the+apostle+commanding+Timothy+that+he+should+not+communicate+with+other+men%E2%80%99s+sins+%281+Tim.+%5B5%3A22%5D%29+in+the+ordination+of+unfit+and+unable+ministers%2C+he+thereby+gives+to+understand+that+there+might+be+unworthy+men+ordained+ministers+against+his+voice%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Thomas+Cartwright%2C+eds.+Peel+%26+Carlson%2C+Cartwrightiana+%28London%3A+Halley+Stewart%2C+1951%29%2C+%E2%80%98Letter+to+Mrs.+Stubbes+his+sister-in-law+to+persuade+her+from+Brownism%E2%80%99%2C+p.+69&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8b57c8d624.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8b57c8d624.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/pastors#:~:text=And%20even%20in%20the%20matter%20of,men%20ordained%20ministers%20against%20his%20voice&amp;text=And%20even%20in%20the%20matter%20of%20the%20appoinitment&amp;text=be%20unworthy%20men%20ordained%20ministers%20against%20his%20voice" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c5f1d6f9a6" data-kw="">
<blockquote><p>Answer. Suppose in this or that Church all the ministers should die, yet it follows not that a ministry can utterly fail in the Church: It is contrary to Eph. 4:11 and to the perpetuity of Christ’s kingly government and throne, which shall endure as the days of heaven: And what if God extraordinarily supply the want of ordination in this or that particular church? A ministerial power is conferred in that case immediately upon some in a Church removed from any Church-consociation from other Churches, and so Christ’s ministerial power dies not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), p. 269</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“Answer. Suppose in this or that Church all the ministers should die, yet it follows not that a ministry can utterly fail in the Church: It is contrary to Eph. 4:11 and to the perpetuity of Christ’s kingly government and throne, which shall endure as the days of heaven: And what if God extraordinarily supply the want of ordination in this or that particular church? A ministerial power is conferred in that case immediately upon some in a Church removed from any Church-consociation from other Churches, and so Christ’s ministerial power dies not.”

— Samuel Rutherford, A Peaceable &amp; Temperate Plea (1642), p. 269">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnswer.+Suppose+in+this+or+that+Church+all+the+ministers+should+die%2C+yet+it+follows+not+that+a+ministry+can+utterly+fail+in+the+Church%3A+It+is+contrary+to+Eph.+4%3A11+and+to+the+perpetuity+of+Christ%E2%80%99s+kingly+government+and+throne%2C+which+shall+endure+as+the+days+of+heaven%3A+And+what+if+God+extraordinarily+supply+the+want+of+ordination+in+this+or+that+particular+church%3F+A+ministerial+power+is+conferred+in+that+case+immediately+upon+some+in+a+Church+removed+from+any+Church-consociation+from+other+Churches%2C+and+so+Christ%E2%80%99s+ministerial+power+dies+not.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Peaceable+%26+Temperate+Plea+%281642%29%2C+p.+269&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc5f1d6f9a6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c5f1d6f9a6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-an-extraordinary-calling/#:~:text=Answer.%20Suppose%20in%20this%20or%20that,so%20Christ%E2%80%99s%20ministerial%20power%20dies%20not&amp;text=Answer.%20Suppose%20in%20this%20or%20that%20Church%20all&amp;text=Churches%2C%20and%20so%20Christ%E2%80%99s%20ministerial%20power%20dies%20not" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ba7f845a30" data-kw="">
<blockquote><p>Eighthly, [it is superstition] that the people do not only choose the persons who shall be their pastors, but also give them their office or power. Ninthly, that the people have the power of the keys, or of Church-government, by vote. Tenthly, that the people of a particular church, do give authority to men to be ministers in the universal Church, and to preach and baptize among those that are without [the Church].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 58, p. 290</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“Eighthly, [it is superstition] that the people do not only choose the persons who shall be their pastors, but also give them their office or power. Ninthly, that the people have the power of the keys, or of Church-government, by vote. Tenthly, that the people of a particular church, do give authority to men to be ministers in the universal Church, and to preach and baptize among those that are without [the Church].”

— Richard Baxter, The Cure of Church Divisions… (London, 1670), pt. 1, Direction 58, p. 290">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEighthly%2C+%5Bit+is+superstition%5D+that+the+people+do+not+only+choose+the+persons+who+shall+be+their+pastors%2C+but+also+give+them+their+office+or+power.+Ninthly%2C+that+the+people+have+the+power+of+the+keys%2C+or+of+Church-government%2C+by+vote.+Tenthly%2C+that+the+people+of+a+particular+church%2C+do+give+authority+to+men+to+be+ministers+in+the+universal+Church%2C+and+to+preach+and+baptize+among+those+that+are+without+%5Bthe+Church%5D.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Church+Divisions%E2%80%A6+%28London%2C+1670%29%2C+pt.+1%2C+Direction+58%2C+p.+290&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fba7f845a30.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ba7f845a30.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/ordination/#:~:text=Eighthly%2C%20%5Bit%20is%20superstition%5D%20that%20the,those%20that%20are%20without%20%5Bthe%20Church&amp;text=Eighthly%2C%20%5Bit%20is%20superstition%5D%20that%20the%20people%20do&amp;text=baptize%20among%20those%20that%20are%20without%20%5Bthe%20Church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6c6f893d51" data-kw="">
<blockquote><p>3. And He has described the persons that he will have to be the officers by their requisite qualifications [e.g. 1 Tim. 3]. All this is done in his laws already.

4. There is nothing therefore left to be done but to determine which are the individual persons that are fittest according to God’s description. This God Himself also will do, but has not tied himself to one way in doing it: In general, some sign of God’s will that this is the man must be had; At first in calling the apostles his own immediate nomination was the sign. Now the most notable sign is the most eminent unquestionable qualification of the person, which when God confers so notably or discernably, that man must be taken as chosen by God, and they that reject him do sin: These qualifications lie both in abilities, willingness, conveniency of habitation or other externals and interest in the people; and if God bow their minds to consent, there is the fuller signification of his will; yet lest any by intrusion should abuse the Church, God has made the pastors and overseers judges of men’s fitness, or the ordinary discerners of it, for the guidance of the Church in their consent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653), ‘Objections Answered’, pp. 82-83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“3. And He has described the persons that he will have to be the officers by their requisite qualifications [e.g. 1 Tim. 3]. All this is done in his laws already.

4. There is nothing therefore left to be done but to determine which are the individual persons that are fittest according to God’s description. This God Himself also will do, but has not tied himself to one way in doing it: In general, some sign of God’s will that this is the man must be had; At first in calling the apostles his own immediate nomination was the sign. Now the most notable sign is the most eminent unquestionable qualification of the person, which when God confers so notably or discernably, that man must be taken as chosen by God, and they that reject him do sin: These qualifications lie both in abilities, willingness, conveniency of habitation or other externals and interest in the people; and if God bow their minds to consent, there is the fuller signification of his will; yet lest any by intrusion should abuse the Church, God has made the pastors and overseers judges of men’s fitness, or the ordinary discerners of it, for the guidance of the Church in their consent.”

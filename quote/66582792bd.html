<blockquote><p>The second head is the will of God, who will have us justified with the alone condition of faith. The Adversary [Bellarmine] answers that it contradicts the Scripture, which lays down also the condition of repentance. Answer:

1. Repentance is the condition of faith and of the person justified, but not properly of justification.

2. It is one thing to treat of the condition of justification, but another thing of the cause and instrument thereof: for a condition notes a consequent, or effect: but a cause, the antecedent or efficient.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-11aad528b3" data-kw="">
<blockquote><p>Assertion 7. Not any protestant divines I know make true repentance a work of the Law, going before faith in Christ.

1. The Law speaks not one word of repentance, but says either do or die. Repentance is an evangelic ingredient in a saint.

2. Christ was made a Prince and exalted to give repentance, Acts 5:31, and the Law, as the Law, has not one word of Christ, though it cannot contradict Christ, except we say that there be two contradictory wills in Christ, which were blasphemy; but some dispositions before conversion I conceive Antinomians yield to us. For one says, speaking of the manner of his conversion: ‘One main thing, I am sure, was to get some soul-saving-comfort; that moved me to reveal my troubled conscience to godly ministers, and not in general to allay my trouble.’ Yet I can make good from Scripture that this desire can be in no unconverted soul; a physician that mistakes the cure doctrinally will prove a cousening [deceiving] comforter. And another says: ‘The persons capable of justification are such as truly feel what lost creatures they are in themselves and in all their works: this is all the preparative condition that God requires on our part to this high and heavenly work, for hereby is a man truly humbled in himself, of whom God speaks, saying, ‘I dwell with him that is of an humble spirit, etc. [Isa. 57:15]’ To make persons capable of justification, here is required a true feeling that they are lost in themselves and in all their works. But this can be no preparative condition of justification, as Eaton says, because: [1.] True feeling must follow faith, not go before it.

2. And true feeling is proper to justified persons, nothing going before justification, and so, [that] which is found in unjustified persons, can be proper to justified persons only.

3. Antinomians say, ‘Sinners as Sinners, and consequently all sinners’ are to believe justification in Christ, without any foregoing preparation. This man says, ‘Prepared and feeling persons that are sensible of sin, are only capable of justification.’

4. To truly feel a lost condition cannot be all the preparative condition, for the Word has annexed no promise of justification to the unjustified who shall feel his lost condition. For the place Isa. 57 speaks of a justified sinner, not of an unjustified [person] who is only prepared for justification:

1. Because God dwells in this humbled soul, then He must be justified and converted. Eph. 3:17, ‘That Christ may dwell in your heart by faith.’

2. This is a liver by faith, and so justified; ‘The just shall live by faith,’ Hab. 2:4; Rom. 1:17; Gal. 3:11; Heb. 10:38; and he must live by faith whom the high and lofty One revives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), pp. 244-45</span></figcaption>

<blockquote><p>Of the premises ye may gather some definition of faith, as namely that ‘love is a holy endeavor for the preservation of that which is beloved, whether God or man, with an earnest desire to be united unto it.’ For love is that bond, as the apostle speaks, whereby the members of the body are knit together. And it serves also in some sort and place to unite us unto God and Christ, notwithstanding that the communion of Christ, the head of his body the Church, be principally to be ascribed unto faith.</p></blockquote>

<blockquote><p>So the pardon of sin is given of grace, and not for works, though pardon be granted only to the penitent, and faith on our part, a lively, unfained and working faith be required to receive the promise. … The stipulation required is that we take God to be our God, that is, that we repent of our iniquities, believe the promises of mercy and embrace them with the whole heart, and yield love, fear, reverence, worship, and obedience unto Him, according to the prescript rule of his Word. Repentance is called for in this Covenant, as it sets forth the subject capable of salvation by faith, but is itself only an acknowledgement of sin, no healing of our wound, or cause of our acquittance. The feeling of pain and sickness causes a man to desire and seek remedy, but it is no remedy itself. (Lk. 13:5; Acts 11:18; 2 Cor. 7, 10; Eze. 18:27) Hunger and thirst make a man to desire and seek for food, but a man is not fed by being hungry. By repentance we know ourselves, we feel our sickness, we hunger and thirst after grace, but the hand which we stretch forth to receive it, is faith alone, without which repentance is nothing but darkness and despair. Repentance is the condition of faith and the qualification of a person capable of salvation: but faith alone is the cause of justification and salvation, on our part required. It is a penitent and petitioning faith, whereby we receive the promises of mercy, but we are not justified partly by prayer, partly by repentance, and partly by faith, but by that faith which stirs up godly sorrow for sin, and enforces us to pray for pardon and salvation. … In the Covenant of works, works were required as the cause of life and happiness: but in the Covenant of grace, though repentance be necessary and must accompany faith, yet not repentance, but faith only is the cause of life. The cause not efficient, as works should have been, if man had stood in the former Covenant, but instrumental only: for it is impossible that Christ, the death and blood of Christ, and our faith should be together the efficient or procuring causes of justification or salvation. … If then, when we speak of the conditions of the covenant of grace, by “condition” we understand whatsoever is required on our part, as precedent, concomitant, or subsequent to justification, repentance, faith, and obedience are all conditions; but if by “condition” we understand what is required on our part as the cause of the good promised, though only instrumental, faith or belief in the promises of free mercy is the only condition. … In this covenant man promises to repent of his sins, and, repenting, to cleave to the promise of mercy made in Jesus Christ, and in faith to yield willing, cheerful, and continual obedience.</p></blockquote>

— John Ball, A Treatise of the Covenant of Grace… (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’, pp. 17-21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+the+pardon+of+sin+is+given+of+grace%2C+and+not+for+works%2C+though+pardon+be+granted+only+to+the+penitent%2C+and+faith+on+our+part%2C+a+lively%2C+unfained+and+working+faith+be+required+to+receive+the+promise.+%E2%80%A6+The+stipulation+required+is+that+we+take+God+to+be+our+God%2C+that+is%2C+that+we+repent+of+our+iniquities%2C+believe+the+promises+of+mercy+and+embrace+them+with+the+whole+heart%2C+and+yield+love%2C+fear%2C+reverence%2C+worship%2C+and+obedience+unto+Him%2C+according+to+the+prescript+rule+of+his+Word.+Repentance+is+called+for+in+this+Covenant%2C+as+it+sets+forth+the+subject+capable+of+salvation+by+faith%2C+but+is+itself+only+an+acknowledgement+of+sin%2C+no+healing+of+our+wound%2C+or+cause+of+our+acquittance.+The+feeling+of+pain+and+sickness+causes+a+man+to+desire+and+seek+remedy%2C+but+it+is+no+remedy+itself.+%28Lk.+13%3A5%3B+Acts+11%3A18%3B+2+Cor.+7%2C+10%3B+Eze.+18%3A27%29+Hunger+and+thirst+make+a+man+to+desire+and+seek+for+food%2C+but+a+man+is+not+fed+by+being+hungry.+By+repentance+we+know+ourselves%2C+we+feel+our+sickness%2C+we+hunger+and+thirst+after+grace%2C+but+the+hand+which+we+stretch+forth+to+receive+it%2C+is+faith+alone%2C+without+which+repentance+is+nothing+but+darkness+and+despair.+Repentance+is+the+condition+of+faith+and+the+qualification+of+a+person+capable+of+salvation%3A+but+faith+alone+is+the+cause+of+justification+and+salvation%2C+on+our+part+required.+It+is+a+penitent+and+petitioning+faith%2C+whereby+we+receive+the+promises+of+mercy%2C+but+we+are+not+justified+partly+by+prayer%2C+partly+by+repentance%2C+and+partly+by+faith%2C+but+by+that+faith+which+stirs+up+godly+sorrow+for+sin%2C+and+enforces+us+to+pray+for+pardon+and+salvation.+%E2%80%A6+In+the+Covenant+of+works%2C+works+were+required+as+the+cause+of+life+and+happiness%3A+but+in+the+Covenant+of+grace%2C+though+repentance+be+necessary+and+must+accompany+faith%2C+yet+not+repentance%2C+but+faith+only+is+the+cause+of+life.+The+cause+not+efficient%2C+as+works+should+have+been%2C+if+man+had+stood+in+the+former+Covenant%2C+but+instrumental+only%3A+for+it+is+impossible+that+Christ%2C+the+death+and+blood+of+Christ%2C+and+our+faith+should+be+together+the+efficient+or+procuring+causes+of+justification+or+salvation.+%E2%80%A6+If+then%2C+when+we+speak+of+the+conditions+of+the+covenant+of+grace%2C+by+%E2%80%9Ccondition%E2%80%9D+we+understand+whatsoever+is+required+on+our+part%2C+as+precedent%2C+concomitant%2C+or+subsequent+to+justification%2C+repentance%2C+faith%2C+and+obedience+are+all+conditions%3B+but+if+by+%E2%80%9Ccondition%E2%80%9D+we+understand+what+is+required+on+our+part+as+the+cause+of+the+good+promised%2C+though+only+instrumental%2C+faith+or+belief+in+the+promises+of+free+mercy+is+the+only+condition.+%E2%80%A6+In+this+covenant+man+promises+to+repent+of+his+sins%2C+and%2C+repenting%2C+to+cleave+to+the+promise+of+mercy+made+in+Jesus+Christ%2C+and+in+faith+to+yield+willing%2C+cheerful%2C+and+continual+obedience.%E2%80%9D%0A%0A%E2%80%94+John+Ball%2C+A+Treatise+of+the+Covenant+of+Grace%E2%80%A6+%28London%3A+1645%29%2C+ch.+3%2C+%E2%80%98Of+the+Covenant+of+Grace+in+General%E2%80%99%2C+pp.+17-21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F36a1f7f04e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/36a1f7f04e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relation-of-repentance-to-saving-faith-justification/#:~:text=So%20the%20pardon%20of%20sin%20is,yield%20willing%2C%20cheerful%2C%20and%20continual%20obedience&amp;text=So%20the%20pardon%20of%20sin%20is%20given%20of&amp;text=faith%20to%20yield%20willing%2C%20cheerful%2C%20and%20continual%20obedience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-0a4b69cfda" data-kw="">
<blockquote><p>We must observe also that the mode of this generation is not to be estimated by the laws of human nativity, or of any created thing, for not so wide is the heaven from the earth, as the generation of the Son is from other generations; for in this divine generation the Father is not older than the Son, nor the Son younger than the Father; both are eternal, and this generation took place without any change. Here the understanding not only of men, but of angels, is at a loss; here we must lay our hands upon our lips, and be silent.</p></blockquote>

<blockquote><p>Great indeed is He Who deserves to be called the Son of the Most High. Is not He great whose immensity knows no limitation? Who is great as the Lord our God? It is He Who is as great as He is high yea, Who is Most High. As “Son of the Most High,” He thought it not robbery to equal Himself to the Most High. Satan, indeed, meditated robbery. Though made out of nothing in angelic form, he compared himself with his Maker, and arrogated to himself what belonged of right to the Son of the Most High, the Son not made by God, but begotten of Him.

For the Most High God the Father, though Omnipotent, could not make a creature equal to Himself, nor beget a Son who was not His equal. He made the angel great, but not as Himself, therefore not Most High. In one alone did He think it no robbery that He should equal Himself with Him in all things; the only-begotten Son, Who was not made, but begotten, by the Omnipotent, Omnipotent; by the Most High, Most High; by the Eternal, Co-eternal. Rightly, then, shall He be great Who shall be called the Son of the Most High.</p></blockquote>

<blockquote><p>Helpful history of key figures and moves.” – Mark Jones . On the Medieval Church Articles Muller, Richard – pt. 1, ch. 1, ‘The Doctrine of the Trinity in the Christian Tradition: the Medieval Backgroun’ ToC in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725, vol. 4, The Triunity of God 2nd ed. (Baker Books, 2003), pp. 17-59 Butner, D. Glenn – ‘For &amp; Against [Theodore] de Regnon: Trinitarianism East &amp; West’ (2015) 13 pp. Abstract: “Modern systematic theologians frequently claim that Eastern trinitarianism begins with the persons while Western trinitarianism begins with the divine essence, and fails to truly differentiate the persons. This article explores the origins of this claim in the writing of Theodore de Régnon [1831-1893], noting recent criticism of his paradigm’s applicability to the patristic era. In response to these criticisms, I argue ﬁrst for the limited validity of the de Régnon paradigm by demonstrating its applicability in the Carolingian–Photian dispute surrounding the ﬁlioque. I then argue against the deployment of the paradigm as a controlling schema in systematic theology by pointing to problems this narrative has created in the theology of Robert Jenson and John Zizioulas.</p></blockquote>

<blockquote><p>How many ways is the name of God taken in the Scriptures?

Two ways: properly for the substance, essence, and nature: and improperly. Now it is taken properly, or for the essence, when it is taken without the distinction of any one of the persons, as Joh. 4.24. God is a spirit, where God is taken for the whole essence of the Deity, as is also the name Jehovah.

Or else, personally, when there is joined unto the name of God the name of the person: as God the Father, God the Son, God the holy Ghost. Or when the Father is opposed to the Son, who is very God, and the second Person in the Trinity, as Rom. 7.25. I thank God by Jesus Christ. So Rom. 8.3 the Father is called God, the word Father being used personally, because the Person sending is opposed to the Person sent.

Improperly, when it is attributed to Angels or men: and truly, either in regard of their office, or else in respect of the revealing of the will of God, and of their reverence: falsely, either by error; or else by usurpation and custom, as 1. Cor. 8.5. or else by worshipping them. 2. Cor. 4.4. Phil. 3.19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guillaume-bucanus.html">Guillaume Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian religion framed out of God’s word, and the writings of the best divines, methodically handled by questions and answers, fit for all such as desire to know, or practise the will of God</cite>, trans. Robert Hill (London: George Snowdon and Leonell Snowdon, 1606), p. 5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

<main class="wrap"><figure class="quote" id="q-796f070775" data-kw="">
<blockquote><p>…because there is no moral goodness imaginable, but it must have its essential form and being from a law or word of God; therefore all the former circumstances, as they are clothed with either moral conveniency and expediency, or with some religious positive goodness, must be warranted by the Word of God, or the rules of sinless and spiritual prudence, which cannot deviate from the Word of God: For circumstances clothed with religious positive goodness, such as are the Sabbath day, the Holy of Holiest, the Temple; these are not mere circumstances, but worship itself: So a religious habit, as an ephod or a surplice, is not a mere circumstance, or a mere habit, but a worship, or such a part or limb of worship as must be warranted by the Word of truth, else it is nothing but a will-device and a forgery, and so to be rejected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646) | Introduction, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c73b601943" data-kw="">
<blockquote><p>Yea there are among you now many things of a lower [superstitious] nature, which some dare scarce plainly say God commands or forbids, and yet they are censorious enough about them: As heretofore many were against wearing the hair of any considerable length…</p></blockquote>

</figure><figure class="quote" id="q-76183e5ca3" data-kw="">
<blockquote><p>The worship of God, must be expressed with seemly, meet, and convenient gesture. The word translated ‘worship’, signifies doing of reverence with bowing of the body and knee: and therefore it is not an indifferent thing, but necessary, to use convenient gesture in God’s worship, that thereby the grace and humility of the heart may be expressed. The angels that stand before the throne of God, have two wings to cover their feet, and two to cover their faces: thereby testifying their reverence to God’s majesty; In this point also many come short: for as the common complaint is, the manner of many is to lie snorting and sleeping under men’s elbows at sermons, and in the time of prayer to sit unreverently with their heads covered. These things ought not to be: for God is Lord of body and soul, and ought to be worshipped with both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Learned Exposition or Commentary upon the Three First Chapters of the Revelation</cite>, … (d. 1602; London, 1606), ch. 3, p. 187</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-fcc025fa63" data-kw="">
<blockquote><p>He lets them know that both these kinds of disorders are repugnant to the institution of God and the dictates of reason. But especially the latter of these practices is confuted here by an appeal to nature, which is a comprehensive topic, and you may understand by it the general dictate of natural reason, and the particular law of nature concerning distinction of sexes, as also usage and custom, which is a second nature… In a word, a man must not be like a woman either as to her veil and covering or as to her long and dressed hair, because he is taught otherwise by the law of reason, and by that of the sex, and even by the practice and custom of the soberest part of the world, which are all comprised in the large extent of the word ‘nature’ in this place of the apostle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Enquiry into Four Remarkable Texts of the New Testament which Contain Some Difficulty in Them</cite>, … (Cambridge, 1692), The 2nd Text Inquired into, 1 Cor. 11:14, pp. 135-36</span></figcaption>

</figure><figure class="quote" id="q-bc3d332290" data-kw="">
<blockquote><p>2. To behave ourselves as those that do expect this help, not tempting God, not grieving the angels; We should take heed how we carry ourselves in regard of this honorable attendance; our sins and vanity offends them, as it does God… Angels are pure and holy creatures that still abode in the truth; pride, lust, and vanity is very offensive to them, especially impurities and undecencies in God’s worship, about which they have a special attendance; therefore the apostle bids the women to cover their heads because of the angels, 1 Cor. 11:10, their fashion being to come into the congregation with loose dishevelled locks, he minds them of the presence of the angels: We may use a like argument to women to cover their naked breasts, now their immodesty is grown so impudent as to out-face the ordinances of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary</cite>, … (London, 1658), verse 9, Question &amp; Answer 4, pp. 371-2</span></figcaption>

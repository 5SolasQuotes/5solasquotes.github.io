<main class="wrap"><figure class="quote" id="q-700824f36e" data-kw="">
<blockquote><p>Every false theology and so-called theology is opposed to Christian theology in that it is either ignorant of Christ or speaks falsely about him. The former is professed by unbelievers, such as (1) the pagans, whom Paul separates into barbarians and Scythians (Col. 3:11); (2) the modern Jews, who also hatefully persecute Christ (I say modern, for in reality the ancient Jews thought the same thing concerning Christ as we do); and 3) the Muslims, who are aware of Christ and receive him, but only as an extraordinary prophet, not as the God-man Redeemer, over whom they even prefer that most crafty impostor Muhammad, and substitute his tenets found in the Qur’an for the divine oracles of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology Volume 1: Prolegomena</cite>, trans. Todd M. Rester, ed. Joel R. Beeke (1699; Grand Rapids MI: Reformation Heritage Books, 2018), 1.1.1.XXI, p. 79.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/jews-and-muslims.html">Jews and Muslims</a></span></div>

</figure><figure class="quote" id="q-fdf2851653" data-kw="">
<blockquote><p>We grant that these prophecies [Isaiah 59:20; Amos 9:11] contain evident arguments for a future restoration of Israel, if you will acknowledge that which is before clearly proved by the testimonies of the Apostles, and by experience, that is, that they are begun already in part: we grant also, that they have such correspondence with these texts of Esaie and Amos and many more to: but we deny 1. your manner of restoration, and we hold that the spiritual restoration is more glorious for the honour of God and weal of Israel. 2. we deny that the Apostle James alledgeth the prophecy of Amos for such a conversion of the Jews: for he speaks expressly of visiting the gentiles, to take out of them a people unto His name Act. 15.14. and of this visiting he expones the words of Amos and the other Prophets: he speaks not only of Amos, but saith generally, and to this agree the words of the Prophets.

3 we deny that the Apostle Paul alledgeth the prophecy of Elaie to that pretended purpose, for he saith not, and then all Israel shall be saved, but, and so all Israel shall be saved: he shows no order or difference in time, but makes a conclusion out of the former words, where he saith, Blindness in part is happened to Israel, until the fullness of the gentiles shall come in: and then he inferreth, And so all Israel shall be saved: and therefore the conclusion must be exponed according to the proceeding words, that is, all Israel are the called of Israel and of the gentiles: there is a distinction twixt Israel, and all Israel; and all Israel is more than Israel, seeing it includes likewise the faithful gentiles: and in this signification the proof following in the cited testimony must necessarily be understood, and not of a calling of the Jews after the full calling of the gentiles: and far less of that calling, which (he saith) shall perhaps be (not in part but) of all the gentiles that shall be left. Yea these conjectures destroy one another: for if the calling of the Jews shall be after the fullness of the calling of the gentiles, then all the gentiles that shat be left cannot be called through the wonderful deliverance of the Jews.

And this last conjecture destroyeth a many tenet of the Millenaries, who say, that the Jews shall rule over all the nations, and hold them in subjection till the end of the 1000 years, and then these profane nations shall rise again in arms against the Jews. Now seeing betwixt these above named prophecies of Jere. 23. and 31, &amp;c. and these two of Esaie and Amos, there is not any material difference, and no other difference them betwixt a brief intimation and a large explication of the same thing: and seeing these prophecies of Esaie and Amos are to be understood of the Christian Church and estate thereof from the beginning till the end, as the Apostles James and Paul expone them, this conclusion follows, These above named prophecies give no ground for the earthly monarchy of the Jews.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-petrie.html">Alexander Petrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Chiliasto-mastix. Or, The prophecies in the Old and New Testament concerning the kingdom of our Savior Jesus Christ. Vindicated from the misinterpretations of the millenaries and specially of Mr. Maton in his book called Israel’s redemption</cite>, (Rotterdam: Isaak UUaesbergen, 1644), pp 24-25.</span></figcaption>

nd+all+Israel+is+more+than+Israel%2C+seeing+it+includes+likewise+the+faithful+gentiles%3A+and+in+this+signification+the+proof+following+in+the+cited+testimony+must+necessarily+be+understood%2C+and+not+of+a+calling+of+the+Jews+after+the+full+calling+of+the+gentiles%3A+and+far+less+of+that+calling%2C+which+%28he+saith%29+shall+perhaps+be+%28not+in+part+but%29+of+all+the+gentiles+that+shall+be+left.+Yea+these+conjectures+destroy+one+another%3A+for+if+the+calling+of+the+Jews+shall+be+after+the+fullness+of+the+calling+of+the+gentiles%2C+then+all+the+gentiles+that+shat+be+left+cannot+be+called+through+the+wonderful+deliverance+of+the+Jews.%0A%0AAnd+this+last+conjecture+destroyeth+a+many+tenet+of+the+Millenaries%2C+who+say%2C+that+the+Jews+shall+rule+over+all+the+nations%2C+and+hold+them+in+subjection+till+the+end+of+the+1000+years%2C+and+then+these+profane+nations+shall+rise+again+in+arms+against+the+Jews.+Now+seeing+betwixt+these+above+named+prophecies+of+Jere.+23.+and+31%2C+%26c.+and+these+two+of+Esaie+and+Amos%2C+there+is+not+any+material+difference%2C+and+no+other+difference+them+betwixt+a+brief+intimation+and+a+large+explication+of+the+same+thing%3A+and+seeing+these+prophecies+of+Esaie+and+Amos+are+to+be+understood+of+the+Christian+Church+and+estate+thereof+from+the+beginning+till+the+end%2C+as+the+Apostles+James+and+Paul+expone+them%2C+this+conclusion+follows%2C+These+above+named+prophecies+give+no+ground+for+the+earthly+monarchy+of+the+Jews.%E2%80%9D%0A%0A%E2%80%94+Alexander+Petrie%2C+Chiliasto-mastix.+Or%2C+The+prophecies+in+the+Old+and+New+Testament+concerning+the+kingdom+of+our+Savior+Jesus+Christ.+Vindicated+from+the+misinterpretations+of+the+millenaries+and+specially+of+Mr.+Maton+in+his+book+called+Israel%E2%80%99s+redemption%2C+%28Rotterdam%3A+Isaak+UUaesbergen%2C+1644%29%2C+pp+24-25.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffdf2851653.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fdf2851653.ht

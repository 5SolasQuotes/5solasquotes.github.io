<main class="wrap"><figure class="quote" id="q-771cc66c44" data-kw="">
<blockquote><p>As for that which they tax the ministers, to be ministers of the dead letter, one may plainly see the Lord’s taking vengeance upon the outrage offered unto his holy Word; smiting them with the spirit of giddiness, for having despised the true and only means of coming unto God, which is the Scripture and the Word of God. In the passage of the Corinthians where Paul says, “The letter kills, and the Spirit quickens;” let any closely consider, against whom the Apostle disputes, and they will understand his drift. It is very evident that Paul in this place, had to do with false Apostles, who preached and extolled the Law without Christ, and caused the people to recoil from salvation purchased by Christ, and the grace of the new covenant, whereunto the Lord had promised to write his Law in the heart of the faithful: the Law then being separated from Christ, as a body without a soul; and nothing comes from it but death, to those that are under it: it does nothing but beat and strike the ears, without quickening the soul, until by faith we are sent from it unto Christ, as from the usher to the master; and then the Law will be found such as David sings it, “The Law of the Lord is perfect, converting the soul; the testimony of the Lord is faithful, making Wise the simple: the commandments of the Lord are right, rejoicing the heart, etc.” Thus must we understand how it is said, “The Letter kills:” Paul called the Law, The killing Letter, and says, The Spirit quickens, i.e., The Ministry of the Gospel, which he opposes unto the naked Law; and he himself calls his preaching “The Ministry of the Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rise, Spring, and Foundation of the Anabaptists</cite>, (1st edition, 1552; English translation 1668), 40-41.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-33ea9cbf74" data-kw="">
<blockquote><p>Hence, also, we see the error of those who, in comparing the Law with the Gospel, represent it merely as a comparison between the merit of works, and the gratuitous imputation of righteousness. This is indeed a contrast not at all to be rejected. For Paul often means by the term “law” the rule of righteous living by which God requires of us what is his own, giving us no hope of life unless we completely obey him, and adding on the other hand a curse if we deviate even in the slightest degree. This Paul does when he contends that we pleasing to God through grace and accounted righteous through his pardon, because nowhere is found that observance of the law for which the reward has been promised. Paul therefore justly makes contraries of the righteousness of the law and that of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.9.4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-7536d9eabe" data-kw="">
<blockquote><p>The Ten Commandments, accordingly, were published from Sinai in the form of a covenant, or federal, transaction. The Sinai transaction was a mixed dispensation. In it, the covenant of grace was repeated and published; the covenant of works was awfully displayed in subservience thereto; and a national covenant between God and the Israelites was also made as an appendage to the covenant of grace. Accordingly, the law of the Ten Commandments was thence promulgated by the Son of God, the glorious Mediator, as a rule of life to believers in a manner suited to the covenant of grace. The same law was repeated and displayed to the Israelites in the form of the covenant of works, and it was published to them as the matter of a national covenant, or covenant of peculiarity, between God and them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 46.</span></figcaption>

</figure><figure class="quote" id="q-e0097125d6" data-kw="">
<blockquote><p>For if the inheritance be of the law, it is no more of promise: but God gave it to Abraham by promise.’ If it was ‘by Promise,’ then it was ‘by faith,’ for faith only receives the Promise; if it was by the Law, then it was by works, for works only fulfil the Law. True, the Law was afterwards added to the Promise, but not to disannul or to supersede it; on the contrary, it was itself a dispensation of the covenant of grace, for it was proclaimed in the name of the ‘God of Abraham, and Isaac, and Jacob;’ and if it republished in all their rigour the original terms of the covenant of works, it was only ‘because of transgressions, till the seed should come to whom the Promise was made.’ It was for conviction of sin, for ‘the Law worketh wrath,’ and is a ‘ministration of death;’ but, as such, it was ‘our schoolmaster to bring us unto Christ, that we might be justified by faith.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification: An Outline of Its History in the Church and of Its Exposition from Scripture</cite>, (Edinburgh: T&amp;T Clark, 1867), 52–53.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-4d60840def" data-kw="">
<blockquote><p>Again, here we see the use of God’s laws, which serve to prevent, restrain, and cut off sin, into which otherwise men would fall unless they were compassed and guarded by laws. Some object for freedom of will, on this manner. If the laws of God cannot be kept, they are in vain. But they are not in vain. Therefore they may be kept. Answer. The major or first part of the reason is not true. For there are other uses of the laws of God than the keeping of them. For they serve to restrain and to prevent open offences, and to keep men in order, at the least outwardly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 203.</span></figcaption>

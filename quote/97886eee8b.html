<main class="wrap"><figure class="quote" id="q-97886eee8b" data-kw="">
<blockquote><p>The first prejudice then is, That those who dissent and separate from us are the strictest party. In answer to this… As for strictness of opinions, as to government and church communion, if we measure strictness according to the dictates of men’s own spirits, we will yield to them for strictness; and so would our Lord to the Pharisees, and the apostles to the false teachers. But if we measure strictness according to the Word of God, we deny they are strictest, but they are indeed widest from the rule. I will follow Christ to the synagogue of the Jews (I hope some of you at least may understand what I say [who had corruptions in their worship and government]) and in so doing I will be more strict than those that scruple to follow Christ’s example, for fear they be involved in the guilt of the corruptions among them; for the nearer I follow Christ, the more strict I am, if strictness be measured according to the Word of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Evil, Nature &amp; Danger of Schism: a Sermon’</cite>, (1708)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-ad9c349332" data-kw="">
<blockquote><p>What cannot warrant a breach where there is union, that cannot warrantably be the ground to keep up a division; Now there are many miscarriages or defects, which are really gross, and yet will not warrant a schism, as all that write thereon do clear, and is obvious to all. The reason of the consequence is, because making up of a breach is no less a duty than preventing thereof; and further, if it began upon such a ground, then the continuing thereof upon the same ground is but the continuing in the same sin; and it cannot be thought that any party by dividing upon an unjust ground can afterward be justified upon the same ground; It remains therefore, that if the ground was not sufficient at first to warrant a separation or division, it cannot be sufficient afterward to continue the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, ... (Edinburgh: Higgins, 1659), pt. 4, ch. 7, p. 320</span></figcaption>

</figure><figure class="quote" id="q-8161c95a42" data-kw="">
<blockquote><p>Lawyer: But why go you to the parish-churches when you might have better? Minister:

1. All non-conformists preach not better than many of them; yea, the liturgy is better words of prayer than some weak or faulty non-conformists often use.

2. A brown loaf and a white one both may be better than a white one alone; I found both best; and I knew it sin to renounce communion with any Church for weakness because they are not as good as others.

3. That is best at one time and place that is not so at another; praying in itself is better than working, and eating, sleeping. And yet in their proper time your servant’s working and your eating and sleeping is better than praying at that time. One that is a son, a servant, a wife who is commanded by the master of the family to hear a tolerable parish-minister may then find it better than disorderly and disobediently to hear an abler man; that may by variety of conditions be one man’s duty which is another’s sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), ch. 58, ‘Whether Communion with so Faulty a Church be Lawful’, pp. 232-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<main class="wrap"><figure class="quote" id="q-7a1a4f739d" data-kw="">
<blockquote><p>It is the complaint of not a few of such who were in Christ before me, that most of us inhabit and dwell in a parched land; the people of the Lord are like a land not rained upon. Though some dare not deny but this is the garden of the Beloved, and the vineyard which the Lord does keep and water every moment; Yet, O where are the sometimes quickening breathings and influences from Heaven that have refreshed his hidden ones! The causes of his withdrawings are unknown to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-97d15e8c3b" data-kw="">
<blockquote><p>Thus, dear sir, I have traced your separating project through diverse periods of the Church under the Old and New Testament: And, having given you touches at the good old way of our Lord Himself, the prophets and apostles, I have pondered these matters again and again, and have had the occasion to know the thoughts of the brightest lights of this and other reformed Churches, who all are of the same sentiments on this weighty head, and do jointly express their high detestation of schisms, which yet never came up the length of your new project. Pardon me to say it, I love to live and die with the cloud of witnesses, and especially with such great and eminent worthies; and have often been put to say it solemnly before the Lord, Let not my soul enter into the secret of your schismatical courses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-993c3a2447" data-kw="">
<blockquote><p>I was a hearty Revolutioner, and a great adorer of God’s goodness to these lands in sending that great man, King William, to overthrow our enemies and redeem us from slavery. Yet the aforesaid nine grievances [on pp. 232-33] stuck close with me, and stumbled me greatly; whereupon I had thoughts to go off the country. But alas, alas! before that project was ripe, I met with some, who otherwise were good men, but they had stated a separation from church and state, after the Revolution, because of the aforesaid nine grievances, to which they added many more. I at least was overcome with their arguments, joined with them, in the inadvertent simplicity of my heart, and being influenced with a zeal not altogether according to knowlege, I continued embarked in communion with them for some time, which laid a foundation for a train of many after trials to me; for I quickly found that I was out of the frying-pan into the heart of the fire: for, though Isaw great reason for these grievances on the government side, yet, amongst the dissenters, I found many grievances, some of which were intolerable unto me…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-nisbet.html">James Nisbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Private Life of the Persecuted: or Memoirs of the First Years of James Nisbet, one of the Scottish Covenanters</cite>, (Edinburgh: Oliphant, 1827), p. 234</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

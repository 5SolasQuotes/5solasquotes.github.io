<main class="wrap"><figure class="quote" id="q-d73f9ef76a" data-kw="">
<blockquote><p>For the work of peace, at the persuasion of some friends, he took a journey thitherward [to Lutheran Sweden], where he arrived in June, anno 1636… a resolution was taken to permit Master Dury to treat with the divines of that kingdom… to which he might address himself particularly, and lay open his intention… There he had conference both collegially and severally with the professors of divinity, who gave full assent unto his desires, and set down these conditions, upon which they were ready to agree, and join with the reformed side: 1. That a full agreement should be made in all the fundamental articles of Faith. 2. That all errors overthrowing the foundation, or tending to overthrow the same, should be condemned. 3. That in matters ceremonial and of indifferency, there should be a mutual toleration. 4. That betwixt the parties, united sincerity and uprightness should be maintained, lest ancient errors might be upheld under doubtful speeches. 5. That when peace is made, none should be suffered to maintain, excuse or spread any more the errors once condemned. 6. That ambitious and needless disputes and brabblings should be inhibited on all sides. 7. That former reproaches and injuries should be put to oblivion. 8. That the Church government should be settled according to apostolical rules. These demands the rest agreed unto, neither was any thing of moment added thereunto by any.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quote on Dury</cite>, Samuel Hartlib, A Brief Relation of that which has been Lately attempted to Procure Ecclesiastical Peace amongst Protestants (London: I.R., 1641), pp. 16-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-d28781669c" data-kw="">
<blockquote><p>2nd Proposition. There may be different sentiments without separation. And hence the apostle exhorts all to “forbear one another in love” (Eph. 4:1-6), and to “walk by the same rule whereunto we have already attained.” [Phil. 3:15-16] If the sentiments of all were the same, there had not been need for any such exhortation. As long as we see but in part, as we think others should allow us to differ from them, we ought to forbear such as differ from us, I mean in things not fundamental.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland, in which the Chief Things in the Testimonies of these Reverend Brethren who lately made a Secession from her are considered &amp; shown to be no Ground of Separation or Secession</cite>, An Essay on Separation: or a Vindication of the Church of Scotland, in which the Chief Things in the Testimonies of these Reverend Brethren who lately made a Secession from her are considered &amp; shown to be no Ground of Separation or Secession (1738) | ch. 2, In which sundry propositions anent separation are laid down</span></figcaption>

<blockquote><p>In matters fundamental, as the profession of faith must be entire in all points of simple belief, so must the doctrine of the Church in all things concerning practice: but errors of inferior alloy, wherein godly men dissent pardonably one from another, both concerning faith and practice, may be found and maintained in the true Church.</p></blockquote>

</figure><figure class="quote" id="q-38b08187c6" data-kw="">
<blockquote><p>However, most others describe the visible Church as the assembly of those who profess the true and salutary doctrine of Christ and legitimately use the sacraments instituted by Him, and also observe the lawful order of discipline. Some others more briefly say it is the assembly of those who profess the true religion, along with their children. Thus, the Anglican Confession, Chapter 25, Article 30. Therefore, they do not want any heretical churches to constitute part of the visible Church, but exclude from it those who are properly called heretics; nor do they place outside it all who err in matters of faith and sin in the administration of the sacraments and the exercise of discipline; but only those who deny and subvert the fundamental teachings concerning faith, discipline, and the sacraments. Therefore, among the many particular churches that are contained within the communion of the true Church, they note various degrees of purity and perfection; nor do they immediately deny a church to be a true Church of Christ if it is not in all respects pure in doctrine or in the rest of worship, rites, and the sanctity of discipline, and if it has some errors in saving faith, some abuses in the use of sacraments, some superstitions in divine worship, and some allowance of scandals in the sanctity of discipline, provided that in the meantime it retains the fundamental and saving doctrine and practice of faith and worship. These are the words of the confession or declaration of the Polish Churches, publicly read at the Thorunien assembly in 1645, and printed and published the following year. And this is the common opinion of our theologians, as can be seen in John Calvin, Institutes, Book 4, Chapter 1, Section 12 and following, and in the illustrious Mestrezat in his French treatise on the Church, Book 2, Chapter 4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Elucidation of the Status of Controversies about the Church Militant</cite>, bk. 5, ch. 1, ‘On the Nature and Definition of the Church’ in Theological Theses Published at Various Times in the Academy of Sedan, 3rd ed., tr. by AI by Colloquia Scholastica (1675; London, 1683), p. 1052</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

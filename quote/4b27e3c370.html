<blockquote><p>Hold out the practice, but not the ground: It will gather more, nay all, that hold it not unlawful; men differently principled may meet in one practice.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-52ab39d3bb" data-kw="">
<blockquote><p>[Johannes G.] Vos says taking the [Scottish, civil] indulgence [in 1669-1688] involved ‘becoming Episcopalians’ and was ‘a compromise with an unscriptural form of Church government…’ Such ‘must be regarded as a sacrifice of principle… they compromised with prelacy.’ This is to confound material actions with their formal ends. The indulged ministers did not necessarily sacrifice or compromise any principle or become anything but presbyterians acting under limitations of a partially unscriptural form of external Church government. If Vos’s slurs were true, that anyone who materially accommodates and cooperates with rulers acting under erroneous principles, sinfully sacrifices principles and becomes as their rulers: would not the old Jewish Church of God, with intrinsic, divine-right Church government, ruled by their Erastian Babylonian rulers in their captivity (in a broken and declining state), have been in sin for so accepting that Erastian supremacy, at the very command of God (Jer. 27:12–13; 29:4–7)? The Erastian, absolutist, civil rulers over the Jews in Christ’s time dictated and changed who was the Jewish, episcopal high priest at their will, contrary to God’s ordinance (Lev. 16:32; Num. 20:25–28; 35:25). Yet they allowed Christ and the apostles to otherwise exercise their ministry freely while practicing presbyterianism (Lk. 7:3; Mt. 18:15–20), alongside the overseeing priests, or bishops (Mt. 26:3, 57; Mk. 11:27; Lk. 20:1). Though Christ and the apostles suffered greatly under these bishops (Mt. 16:21; 27:1; Mk. 8:31), yet without fleeing (Mt. 26:47–57; Jn. 18:4–8; Acts 16:25–30; 21:13), they appeared at their courts (Mt. 21:23; 26:59; Acts 21:13; 25:11) in that broken and declining state of the Church. Question: On Vos’s premise, were not Christ, the apostles and the whole Jewish Church in sin for cooperating under these restrictions? Would not churches today which cooperate under American rulers acting under erroneous principles be guilty of all their rulers’ errors? Say if churches limit (or do not exercise) their own liberty in some ways to comply with over-reaching government restrictions about a spreading disease, so churches may prevent worse things (such as being shut down, or scandalizing unbelievers they are seeking to win to the Gospel), are they therefore guilty of their rulers’ errors? Perhaps some will affirm this, as many have. When you accommodate your boss’s unnecessary restrictions at work for the greater good, are you sacrificing God’s divine-right of governance over you and you are guilty of your boss’s errors? Are you divinely obliged to suffer the consequences of getting fired and hazarding your family’s survival every time your company wants you to do something not fully in accord with God-prescribed, right reason?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 133-34</span></figcaption>

</figure><figure class="quote" id="q-e696627f2a" data-kw="communion join church">
<blockquote><p>For since salvation cannot be obtained except in communion with the true church and many glory in this sacred name who are destitute of its truth, it is of great value to know its true marks that we may be able to distinguish the true fold of Christ from the dens of thieves and dens of robbers. Also that thus we may know what that assembly is to which it is necessary that we should join ourselves that we may obtain salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.12.1c</span></figcaption>

</figure><figure class="quote" id="q-55f07de450" data-kw="">
<blockquote><p>If one would participatingly accommodate a measure of indecency in a civil assembly for the good in it and out of respect and submission to public order, how much more ought one to do so in charity for the Church’s public worship, as such common and legitimately applied civil principles do not need a Scripture precedent and “God is not the author of confusion, but of peace.” (1 Cor. 14:33)? Often doing something that is inconvenient and less than fully decent or in the best order, given the larger context, is more decent, orderly¹ (1 Cor. 14:40) and conducive to peace,² and less confusing, than not, especially for leaders. ¹ Such as in a person eating the distasteful and questionable food at another’s house so as to prevent offense rather than abstain. How much more in the House of God? ² Zanchi: “Wherefore many things are to be tolerated by the ministers that the peace of churches be not rent and that schisms may be avoided, so that they be not such things or doctrines which do fight with the foundation and do heave at it;” On Philippians, ch. 1, fol. 45, as trans. by Sprint, Cassander Anglicanus, ‘Reformed Practices’, p. 167. Are not peace, love and mercy weightier matters of the Law (Mt. 23:23; Mk. 12:33; Rom. 14:19; 1 Cor. 13:13)? and external ceremonial observances are to give way to moral law? (Hos. 6:6; Mk. 12:33) “But if ye had known what this meaneth, ‘I will have mercy, and not sacrifice,’ ye would not have condemned the guiltless.” (Mt. 12:7)</p></blockquote>

<blockquote><p>L… The indispensible Law of Nature obliges every man according to his place and calling, his ability, and his opportunities, to do his best to propagate Christ’s gospel and to save mens souls, as much and more than to feed men’s bodies and save their lives… And we did not receive this calling to be altered or forborn at the will of man, but to be performed according to the Word of God: Men being not the makers of the office, nor of God’s Law under which we execute it, nor the donors or limiters of the power, but only… the governors of us in the exercise of it, according to God’s laws, by which they may punish us for mal-administration, but cannot dissolve the Law’s obligation to those that are indeed commanded by it.</p></blockquote>

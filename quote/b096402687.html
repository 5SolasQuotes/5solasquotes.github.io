<main class="wrap"><figure class="quote" id="q-b096402687" data-kw="">
<blockquote><p>Let Christ, therefore, be our looking glass, in whom we may behold our predestination. We shall have a most evident and sure testimony that we are written in the book of life, if we communicate with Christ; and He is ours and we His by a true faith. Let this comfort us in the temptation touching predestination, than which there is none more dangerous: that the promises of God are general to the faithful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/election-in-christ.html">Election in Christ</a> › <a href="../topics/election/election-in-christ/christ-as-head-and-mirror-of-election.html">Christ as head and mirror of election</a></span><span class="t"><a href="../topics/election/assurance-and-comfort-in-election.html">Assurance and Comfort in Election</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-68e1533d1d" data-kw="">
<blockquote><p>The doctrine of the high mystery of predestination is to be handled with special prudence and care, that men attending the will of God revealed in His Word, and yielding obedience thereunto, may, from the certainty of their effectual vocation, be assured of their eternal election; so shall this doctrine afford matter of praise, reverence, and admiration of God, and of humility, diligence, and abundant consolation to all that sincerely obey the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 3.7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god/use-of-the-doctrine.html">Use of the Doctrine</a> › <a href="../topics/the-decrees-of-god/use-of-the-doctrine/how-to-preach-it.html">How to preach it</a></span><span class="t"><a href="../topics/election/assurance-and-comfort-in-election.html">Assurance and Comfort in Election</a></span></div>
<div class="actions"><button class="copy" data-copy="“The doctrine of the high mystery of predestination is to be handled with special prudence and care, that men attending the will of God revealed in His Word, and yielding obedience thereunto, may, from the certainty of their effectual vocation, be assured of their eternal election; so shall this doctrine afford matter of praise, reverence, and admiration of God, and of humility, diligence, and abundant consolation to all that sincerely obey the gospel.”

</figure><figure class="quote" id="q-4d2bdbf2b2" data-kw="">
<blockquote><p>This perseverance of the saints depends not upon their own free will, but upon the immutability of the decree of election, flowing from the free and unchangeable love of God the Father, upon the efficacy of the merit and intercession of Jesus Christ and union with him, the oath of God, the abiding of his Spirit, and the seed of God within them, and the nature of the covenant of grace; from all which ariseth also the certainty and infallibility thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 17.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/perseverance-of-the-saints/grounds-of-perseverance.html">Grounds of Perseverance</a> › <a href="../topics/perseverance-of-the-saints/grounds-of-perseverance/election.html">Election</a></span><span class="t"><a href="../topics/perseverance-of-the-saints/grounds-of-perseverance.html">Grounds of Perseverance</a> › <a href="../topics/perseverance-of-the-saints/grounds-of-perseverance/covenant.html">Covenant</a></span><span class="t"><a href="../topics/perseverance-of-the-saints/grounds-of-perseverance.html">Grounds of Perseverance</a> › <a href="../topics/perseverance-of-the-saints/grounds-of-perseverance/christs-intercession.html">Christ&#x27;s intercession</a></span><span class="t"><a href="../topics/perseverance-of-the-saints/grounds-of-perseverance.html">Grounds of Perseverance</a> › <a href="../topics/perseverance-of-the-saints/grounds-of-perseverance/the-spirits-indwelling.html">The Spirit&#x27;s indwelling</a></span><span class="t"><a href="../topics/election/ground-of-election.html">Ground of Election</a> › <a href="../topics/election/ground-of-election/gods-good-pleasure.html">God&#x27;s good pleasure</a></span></div>
<div class="actions"><button class="copy" data-copy="“This perseverance of the saints depends not upon their own free will, but upon the immutability of the decree of election, flowing from the free and unchangeable love of God the Father, upon the efficacy of the merit and intercession of Jesus Christ and union with him, the oath of God, the abiding of his Spirit, and the seed of God within them, and the nature of the covenant of grace; from all which ariseth also the certainty and infallibility thereof.”

</figure><figure class="quote" id="q-625f719715" data-kw="">
<blockquote><p>Those in whom a living faith in Christ, an assured confidence of soul, peace of conscience, an earnest endeavor after filial obedience, a glorying in God through Christ, is not as yet strongly felt, and who nevertheless make use of the means which God has appointed for working these graces in us, ought not to be alarmed at the mention of reprobation, nor to rank themselves among the reprobate, but diligently to persevere in the use of means, and with ardent desires devoutly and humbly to wait for a season of richer grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/assurance-and-comfort-in-election.html">Assurance and Comfort in Election</a> › <a href="../topics/election/assurance-and-comfort-in-election/examining-ones-election.html">Examining one&#x27;s election</a></span><span class="t"><a href="../topics/assurance-peace-and-joy/testimony-of-the-spirit.html">Testimony of the Spirit</a></span></div>

— Synod of Dort, The Canons of Dort, Head 1, Art. 16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThose+in+whom+a+living+faith+in+Christ%2C+an+assured+confidence+of+soul%2C+peace+of+conscience%2C+an+earnest+endeavor+after+filial+obedience%2C+a+glorying+in+God+through+Christ%2C+is+not+as+yet+strongly+felt%2C+and+who+nevertheless+make+use+of+the+means+which+God+has+appointed+for+working+these+graces+in+us%2C+ought+not+to+be+alarmed+at+the+mention+of+reprobation%2C+nor+to+rank+themselves+among+the+reprobate%2C+but+diligently+to+persevere+in+the+use+of+means%2C+and+with+ardent+desires+devoutly+and+humbly+to+wait+for+a+season+of+richer+grace.%E2%80%9D%0A%0A%E2%80%94+Synod+of+Dort%2C+The+Canons+of+Dort%2C+Head+1%2C+Art.+16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F625f719715.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/625f719715.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/canons-dort" rel="noopener" target="_blank">Read it online · CRCNA</a></div>
</figure><figure class="quote" id="q-506762ccac" data-kw="">
<blockquote><p>As the godly consideration of predestination and our election in Christ, is full of sweet, pleasant, and unspeakable comfort to godly persons, and such as feel in themselves the working of the Spirit of Christ, mortifying the works of the flesh, and their earthly members, and drawing up their mind to high and heavenly things, as well because it doth greatly establish and confirm their faith of eternal salvation to be enjoyed through Christ, as because it doth fervently kindle their love towards God: so, for curious and carnal persons, lacking the Spirit of Christ, to have continually before their eyes the sentence of God’s predestination is a most dangerous downfall, whereby the devil doth thrust them either into desperation, or into wretchlessness [recklessness] of most unclean living, no less perilous than desperation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-england.html">Church of England</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Thirty-Nine Articles</cite>, 1563, Art. 17</span></figcaption>

<blockquote><p>…but this apostle earnestly invites us to judge and examine ourselves, and showeth to the Corinthians that if we judged ourselves, we should not be judged of the Lord with his temporal plagues; as infirmities, sickness, and temporal death (1 Cor. 11:30,38), by which the Lord did chastise the Corinthians, for not judging and examining themselves before they did eat of the Lord’s body.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c6eb61e32" data-kw="">
<blockquote><p>Answer 1: Mr. Hooker [a New England Independent puritan] makes all that Christians do as [private] Christians and as Churches, that is, gathering of Churches, hearing, partaking of seals and censures, to be private actings not belonging to the magistrate. Strange it is, that the convening of the ten thousand subjects in the same place (as our Brethren [the Independents] say) belongs nothing to the magistrate; sure it sides with peace or war. … [Answer] 3: I wonder more in what capacity the magistrate can have to do with commanding and governing men, if not as they converse morally with men, and in their families, as fathers and sons, as masters and servants, and as Christians who both in private and public may perform duties to one another, or oppress one another… But if Mr. Hooker mean that private actings of citizens, of members of families, of Christians, that are good and indifferent, do not appertain to the magistrate, who is an adversary to him in this? Though all good actions done in private or public deserve praise, reward and protection from the magistrate… Mr. Hooker [said]: “Commission and just permission are all one: A ruler permits a finder [founder] to set up a school; he needs no commission.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 4, ch. 12, ‘Of the Magistrate’s Power in Convocating Synods’, pp. 487-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-888559a1bd" data-kw="">
<blockquote><p>It’s now high time that every crime be brought to punishment: Wrath long contained, and oft refrained, at last must have a vent. Justice severe cannot forbear to plague sin any longer; But must inflict with hand most strict mischief upon the wronger. … Eternal smart is the desert ev’n of the least offence; Then wonder not if I allot to you this recompence: But wonder more that, since so sore and lasting plagues are due To every sin, you liv’d therein, who well the danger knew. .. Die feign they would, if die they could but death will not be had; God’s direful wrath their bodies hath for ev’r immortal made. They live to lie in misery. and bear eternal woe: And live they must whil’st God is just, that He may plague them so. … O love the Lord, all ye his saints, who hath Redeemed you from everlasting wrath: Who hath by dying made your souls to live, And what He dearly bought doth freely give. Give up your selves to walk in all his ways, And study how to live unto his praise. The time is short you have to serve Him here: The day of your deliverance draweth near. Lift up your heads, ye upright ones in heart, Who in Christ’s Purchase have obtain’d a part; Behold! He rides upon a shining cloud, With angel’s voice, and trumpet sounding loud. He comes to save his folk from all their foes, And plague the men that holiness oppose. So come, Lord Jesus, quickly come we pray, Yea come and hasten our Redemption Day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-wigglesworth.html">Michael Wigglesworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Day of Doom; or A Description of the Great and Last Judgment, with a short discourse about Eternity</cite>, (London, 1666) This is an extended poem, and was written during the Great London Plague. | Wigglesworth was a puritan. Stanzas 139, 142, 211 &amp;, p. 91:</span></figcaption>

<blockquote><p>…so in like manner, God’s present visitation of our said burgh of Dundee by the plague, enforces the prorogation [discontinuation without being dissolved] of the said [General] Assembly [of the Church of Scotland] to some other time… …that the General Assembly is continued and prorogued to the last Tuesday of April… and betwixt and then, it may be hoped, that it may please God of his mercy to remove the said plague of pestilence.</p></blockquote>

<blockquote><p>Aug. 10, 1585 Proclamation, Gatherings. The foresaid bailies and a part of the counsel ordains proclamation to be made through this burgh charging that no manner of persons enduring the time of this present pestilence, either men or women, take upon hand to hold any conventions at the close heads, Cowgate, and high streets, be even or be day, as they commonly do, whereby infection daily arises, discharging all convention of huseis [houses?] and women in special and all such other idle persons which has not charge or licence of the bailies, but only to convene at Kirk and market and to no other places and times, under the pain to be enclosed in their houses upon their own charges for the space of a month and further punished in their bodies and goods at the will of the magistrates.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9dcd4c5c87" data-kw="">
<blockquote><p>§VII… To gather the matter into a few words, according to this position God, being about to illustrate his glory, decreed: 1. To create the world and man in it with original justice and with the gifts necessary for persevering in the State of Innocence. 2. To permit the Fall of man. 3. To send a Mediator, who for the universal fault, would pay a universal and most sufficient ransom. 4. To call all seriously and sufficiently to embrace this Mediator. 5. Of the called and relapsed to elect some, through and on account of Christ, to give them a living and rooted faith, through this faith to justify, sanctify and glorify them; The rest, by their own fault, on account of their sins, original and actual, and therefore avoidable, especially on account of contempt of the Mediator, to reprobate and damn. §VIII. This position the divine John Sigismund, Elector of Brandenburg, professed in his Confession of Faith, heroically-Christianly; This the divine George William, Elector of Brandenburg, by sending the same Confession of Faith to the Synod of Dort, made his own, and testified to be his own, and at the Colloquy of Leipzig in the year 1631, he took care to have it expounded by the theologians, of Brandenburg, D. Johann Bergius, and of Hesse, D. Johann Crocius and Theophilus Neuberger; This the divine Frederick William the Great not only took care to have it more broadly explained and defended by his theologians in the year 1645 in the Declaration of Thorn at the Charitable Colloquy, but also gloriously asserted it in the Electoral Edicts of the year 1662 and the year 1664, and augmented them. This the August and Most Potent Lord Frederick, King of Prussia and Elector of Brandenburg, for his piety towards God, today asserts and defends. §IX. To this we also subscribe on account of the following reasons: … II. And that is proven by the philanthropy of God so often and so emphatically praised in Holy Scripture… To John 3:16, however, we note that by the word ‘world’ only the elect cannot be understood, is clear from the circumstances of the text itself. … Whence not only the doctors of the primitive Church, and among them Augustine, but also the most outstanding doctors of the Reformed Church, Bullinger, Musculus, Gualther, Calvin, Zanchi, Pezel, the Palatines, Johann Bergius, Conrad Bergius, Steinius, Johann and Ludwig Crocius, Hildebrand, Davenant, Ward, Cameron, Amyrald, Dallaeus, Hammond, Bartholomaeus Stoschius, Antonius Brunsenius, Johann Claude, and our own, of pious memory, teachers and predecessors D. Elias Grebenitz, D. Johann Simonis, D. Phil. Buchius, and he who today, with the highest praise, teaches in this our academy and Church, Dn. D. Samuel Strimesius, and others have accepted this word for the human race. … XIII… Then, it is to be observed that Augustine posits certain dogmas which necessarily require this series of ours, such as are: 1. That God has embraced the entire world, i.e., all men, with philanthropy (φιλανθρωπίᾳ, philanthrōpia). 2. That Christ died most sufficiently for all men. 3. That it was in the free power of the called men to come. 4. That the predestination or election of men was made after the exemplar of Christ. 5. That Esau and Judas could have been saved. 6. That all the baptized are regenerated. All of which, even taken separately, sufficiently evince this order of divine decrees. And all these things today—all the Thomists, Augustinians, Dominicans, and other doctors and monks of the Pontificals who are followers of Augustine—confess, approve and defend.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Treatise on Predestination, Election &amp; Reprobation of Men, for Promoting Ecclesiastical Concord 3rd ed. tr. by AI by Nosferatu (Leiden, 1705), pp. 41-44 &amp; 57 Latin Holtzfus (1659-1717) was a reformed professor of philosophy and theology at Frankfurt.</cite></span></figcaption>

</figure><figure class="quote" id="q-a7cdc96c37" data-kw="">
<blockquote><p>‘Who has made us fit.’ Doctrine: We are neither naturally happy, nor universally so; not naturally, for we are made fit; not born so, not universally; for He has made [us] fit, not all men. Christ died for his sheep only (Jn. 10), for his Church only (Eph. 1), not for the world (Jn. 17). And therefore when the Scripture says Christ died for all men, we must understand it: First, in respect of the sufficiency of his death, not in respect of the efficiency of it. Secondly, in respect of the common oblation of the benefits of his death externally in the Gospel unto all. Thirdly, as his death extends to all the elect: for all, that is, for the elect. Fourthly, for all, that is, for all that are saved, so that none that are justified and saved, are so, but by the virtue of his death. Fifthly, for all, that is for all indefinitely, for all sorts of men, not for every man of every sort. Lastly, He died for all, that is not for the Jews only, but for the gentiles also.</p></blockquote>

<blockquote><p>We are often demanded whether every one that hears the Gospel be not bound to believe that Christ died for him? Now I say this phrase ‘Christ died for me’ includes many things, as the benefits which arise unto me by the death of Christ may be conceived to be many. But let these benefits be distinguished and we shall readily answer to the question made, and that perhaps differently, as namely, affirmatively to some, negatively to others; as thus: Do you speak of Christ’s dying for me, that is, for the pardon of my sins and for the salvation of my soul: I answer affirmatively and say I am bound to believe that Christ died for the procuring of these benefits unto me in such manner as God has ordained, to wit, not absolutely but conditionally, to wit, in case I do believe and repent. For God has not otherwise ordained that I should reap the benefit of pardon and salvation by virtue of Christ’s death and passion unless I believe in Him and repent. But if question be made whether I am bound to believe that Christ died for me to procure faith and repentance unto me: I do not say that I am bound, or that every one who hears the Gospel is bound to believe this.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“We are often demanded whether every one that hears the Gospel be not bound to believe that Christ died for him? Now I say this phrase ‘Christ died for me’ includes many things, as the benefits which arise unto me by the death of Christ may be conceived to be many. But let these benefits be distinguished and we shall readily answer to the question made, and that perhaps differently, as namely, affirmatively to some, negatively to others; as thus: Do you speak of Christ’s dying for me, that is, for the pardon of my sins and for the salvation of my soul: I answer affirmatively and say I am bound to believe that Christ died for the procuring of these benefits unto me in such manner as God has ordained, to wit, not absolutely but conditionally, to wit, in case I do believe and repent. For God has not otherwise ordained that I should reap the benefit of pardon and salvation by virtue of Christ’s death and passion unless I believe in Him and repent. But if question be made whether I am bound to believe that Christ died for me to procure faith and repentance unto me: I do not say that I am bound, or that every one who hears the Gospel is bound to believe this.”

— William Twisse, The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath, or an answer unto a book entitled, God’s Love unto Mankind... (Oxford: L.L., 1653), pt. 1, Intro, p. 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+are+often+demanded+whether+every+one+that+hears+the+Gospel+be+not+bound+to+believe+that+Christ+died+for+him%3F+Now+I+say+this+phrase+%E2%80%98Christ+died+for+me%E2%80%99+includes+many+things%2C+as+the+benefits+which+arise+unto+me+by+the+death+of+Christ+may+be+conceived+to+be+many.+But+let+these+benefits+be+distinguished+and+we+shall+readily+answer+to+the+question+made%2C+and+that+perhaps+differently%2C+as+namely%2C+affirmatively+to+some%2C+negatively+to+others%3B+as+thus%3A+Do+you+speak+of+Christ%E2%80%99s+dying+for+me%2C+that+is%2C+for+the+pardon+of+my+sins+and+for+the+salvation+of+my+soul%3A+I+answer+affirmatively+and+say+I+am+bound+to+believe+that+Christ+died+for+the+procuring+of+these+benefits+unto+me+in+such+manner+as+God+has+ordained%2C+to+wit%2C+not+absolutely+but+conditionally%2C+to+wit%2C+in+case+I+do+believe+and+repent.+For+God+has+not+otherwise+ordained+that+I+should+reap+the+benefit+of+pardon+and+salvation+by+virtue+of+Christ%E2%80%99s+death+and+passion+unless+I+believe+in+Him+and+repent.+But+if+question+be+made+whether+I+am+bound+to+believe+that+Christ+died+for+me+to+procure+faith+and+repentance+unto+me%3A+I+do+not+say+that+I+am+bound%2C+or+that+every+one+who+hears+the+Gospel+is+bound+to+believe+this.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+The+Riches+of+God%E2%80%99s+Love+unto+the+Vessels+of+Mercy%2C+consistent+with+his+absolute+Hatred+or+Reprobation+of+the+Vessels+of+Wrath%2C+or+an+answer+unto+a+book+entitled%2C+God%E2%80%99s+Love+unto+Mankind...+%28Oxford%3A+L.L.%2C+1653%29%2C+pt.+1%2C+Intro%2C+p.+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F76cf032e15.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X <blockquote><p>…the natural sense of the clause is clearly that no one of the transactions here brought together is to be affirmed of the non-elect. And this impression is increased by the broader context, not to speak of the parallel passages in 8.3 and 5. It might seem somewhat more to the point, possibly, to recall that in this section the language is so ordered as to seem to deal with the actual ordo salutis rather than directly with the ordo decretorum. It is asserted that the ordo salutis is the result of the decreeing of the means by which the elect are brought to glory. But what is subsequently asserted is that none but the elect are (actually) redeemed by Christ, effectually called, etc…</p></blockquote>

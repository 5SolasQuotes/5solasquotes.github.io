<main class="wrap"><figure class="quote" id="q-559bf1690e" data-kw="">
<blockquote><p>6th Rule. There is a principal obligation, a less principal, a least principal. Hence these three degrees issue from love: 1. God, 2. ourselves, 3. our neighbor. The love of God is most principal, and is the measure of the love of ourselves: the love of ourself is less principal than the love of God, and so the obligation [is] less. I am to make away, life and all things, yea, eternal glory as divided from holiness, and as it includes only happiness, rather ere I sin against God. The obligation to care for my own salvation is more principal than my obligation to care for the salvation of my brother: for the love of myself is the measure and rule of the love of my neighbor. Now because the obligation of caring for the soul of my brother is only secondary, in compare[ison] of the obligation of caring for my own salvation, I am not to sin myself, or sinfully to omit anything that is commanded me in a positive precept, to prevent the sin of my brother. Yet hence it does not follow that a positive precept is more excellent than the law of Nature, which is, ‘Thou shalt not murder,’ nor ‘scandalize him for whom Christ died.’ Because though to care for the soul of my brother be of the law of nature simpliciter, yet [it] is a secondary obligation, and may cease and yield to a stronger obligation that ties me more principally to care for my own soul; for though the command be positive, yet knowingly to sin by a sinful omission, is no less a destroying of my own soul, and so of the law of nature, in a higher obligation, than the other is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646), Appendix</cite>, pp. 83-84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-baf430d885" data-kw="">
<blockquote><p>Reckless Church union is not here being recommended; rather implementing union ought to be governed by nature’s light and laws, Christian prudence and the general rules of the Word. Union ought not to be sought if it would do greater hurt than good, for instance, if the one Church would shred into oblivion, whereas the two Churches separate would at least maintain what good had preexisted. Churches coming together in at least the fundamentals is not being held out as all or nothing; rather it is a goal which may be worked towards as it is able to be borne and as progress can be made.</p></blockquote>

</figure><figure class="quote" id="q-62d824cf79" data-kw="">
<blockquote><p>If it be asked then: What way men may discern the side that is to be followed in such a case when inconveniencies threaten on all hands? Answer: By these and such like ways: 1. It is to be looked what side has the most dangerous and destructive inconveniencies. 2. What inconveniencies are most certain and inevitable, and the greatest and most inevitable inconveniencies are to be shunned, and men would not choose a certain hurt to eschew that which is uncertain. 3. It would be looked what side duty lies upon, or to what the command does press; and although inconveniencies seem to follow that, yet it is to be followed as most safe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal... (Edinburgh: Higgins, 1659), pt. 4, ch. 7</cite>, pp. 322-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-71e99a049f" data-kw="">
<blockquote><p>But sure, all our jus and right… that captives and servants have to their masters and lords, is jus limitatum, a right ruled, limited, bounded by the Word of God; nor is the work they perform morally indifferent ([though] physically it is)… But for no cause the most weighty can we choose either to shed innocent blood or to co-operate with the shedding of it, nor to co-operate with the works of darkness, for it is shameful that a servant may lawfully cooperate with and thrust his master in at a window to go to a whore; the jus or dominion of masters to command, and the right of servants to obey is only in the Lord. …the one kind of action in itself is as indifferent and susceptible of moral lawfulness and unlawfulness as the other. And if the master do cooperate to commit harlotry in climbing in at a window to a whore, and to robbing, in digging through an innocent man’s house in the night, to kill the master of the house, and to steal his goods, then the servant that cooperates in these same physical actions, and also digs through the innocent man’s house and kills himself, is the harlot and the robber by cooperation and participation, no less than the master. The naked relation of a captive and of a servant cannot make the captive and servant innocent and guiltless cooperators, for then to sin at the command of any conqueror and master, because I am in the condition of a captive and servant, were lawful, though God forbid and inhibit me to do what I do, by the command of my master and conqueror, for in so doing, Utor meo jure, I use my right as a servant. For God forbids me in what relation I be in, servant or captive, to sin at the command of any, or for declining any ill of punishment, though as weighty as the torment of hell, separated from sinful despairing and blaspheming of God. Now to cooperate with that which I know to be a sin is to partake in other men’s sins, which is forbidden, as a sin, 1 Tim. 5:22; Eph. 5:11. But to run with the thief and to help an arch-robber, Prov. 1:13-14, is a consenting to his robbery and bloodshed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646), Appendix</cite>, p. 85-6</span></figcaption>

</figure><figure class="quote" id="q-58960996c7" data-kw="">
<blockquote><p>I have heard many pleading for ceremonies say that if the magistrate commanded them and would not otherwise permit them to preach the Gospel, they would preach in a fool’s coat and a fool’s cap with a feather rather than forbear. But I do not think that any of them would justify that ruler that would make such a law…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship (London, 1659), 5th Disputation</cite>, ch. 2; pp. 423–24</span></figcaption>

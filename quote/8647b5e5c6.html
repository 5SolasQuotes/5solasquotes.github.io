<blockquote><p>Together with these external means, serving for drawing on the covenant and going on in it, the common operations of God do concur; common to all the called, both elect and reprobate, and gifts common to both, are bestowed, such as illumination, moral persuasion, historical, dogmatic and temporary faith, moral change of affections, and some sort of external amendment of their outward conversation, saving grace being the special gift of God to His own.</p></blockquote>

</figure><figure class="quote" id="q-8d29dc8c6d" data-kw="">
<blockquote><p>The words ‘in love’ [in Eph. 1:4] allow of two senses: either of our kindness and love towards our neighbor through which imitating God Himself as best we can through his Spirit dwelling within us, we eagerly do good to all men; or of the love of us in an objective sense, the love wherewith God has loved us–so that we have a further mention of the cause of our election, which is solely the boundless love of God with which he embraces us in his Son.</p></blockquote>

</figure><figure class="quote" id="q-829edfe447" data-kw="">
<blockquote><p>5. Although through this call salvation becomes the possession of only a few, as everyone must admit, it nevertheless retains its great value and significance also for those who reject it… Frequently, even for those who harden themselves in their unbelief, it is a source of various blessings. The enlightenment of the mind, a taste of the heavenly gift, partaking of the Holy Spirit, enjoyment of the Word of God, the experience of the powers of the age to come–these have sometimes even come to those who later fell away and held the Son of God in contempt (Heb. 6:4–6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, 4:37-38</span></figcaption>

</figure><figure class="quote" id="q-984ac52a70" data-kw="">
<blockquote><p>The Reformed commonly acknowledge a universal grace concerning natural things and a common grace concerning moral things, but saving grace concerning things that accompany salvation they do not allow, except as a grace proper to the elect: they acknowledge no saving grace that extends equally to each individual, not even that grace that they call objective.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

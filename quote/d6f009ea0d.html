<main class="wrap"><figure class="quote" id="q-d6f009ea0d" data-kw="">
<blockquote><p>His second objection is that the Lord’s Supper is not given to the sick at their homes. I wish that they [the Lutherans] had gone before us in this with a purer example. Had they been careful to adapt their practice to the genuine rule of Christ, we would willingly have followed them. But since nothing is less accordant with the doctrine of our heavenly Master than that the bread should be carried about in procession like cakes in a fair, and then that one individual should receive in private and eat apart, disregarding the law of communicating, pious and learned men were from the very first much averse to private dispensations of the Supper. Nothing, therefore, can be more absurd than Westphal’s calumny, that owing to the crafty counsel of Satan, poor souls are deprived of consolation. For we [the Genevan Church] carefully recall to the remembrance of the sick the pledge of life which was once deposited with us, that they may thence confirm their faith, and borrow weapons for the spiritual combat. In short, we herein profit so far that the Supper received in the public assembly, according to the ordinance of Christ, supports them with present consolation not less effectually than if they were to enjoy it privately without communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second Defense of the… Sacraments, in Answer to the Calumnies of Joachim Westphal (1556) in Tracts, containing Treatises on the Sacraments… vol. 2 tr. Henry Beveridge (Edinburgh: Calvin Translation Society, 1849)</cite>, pp. 320-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

olas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d6f009ea0d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments/whether-the-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=His%20second%20objection%20is%20that%20the,to%20enjoy%20it%20privately%20without%20communion." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-001baf6d80" data-kw="">
<blockquote><p>Nor is it [baptism] to be administered in private places, or privately, but in the place of public worship, and in the face of the congregation, where the people may most conveniently see and hear; and not in the places where fonts, in the time of Popery, were unfitly and superstitiously placed.</p></blockquote>

</figure><figure class="quote" id="q-8cbb33aaf8" data-kw="">
<blockquote><p>As to that question, Whether baptism may be lawfully administred extraordinarily where the child is ready to die? It was resolved that in those places where the Word of God is ordinarily preached, the established order shall be observed; but in such places where sermons are had only extraordinarily, at an undue hour, it is left to the minister’s discretion to accommodate themselves to the infirmities of parents, yet to be very careful that they do not nourish them up in superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/qualifications.html">Qualifications</a></span><span class="wk"><span class="lbl">Work:</span> <cite>French Reformed Churches | John Quick, Synodicon (London, 1692) | 2nd Synod, at Poictiers (1560), ch. 6, section 8</cite>, p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-27784aaa36" data-kw="">
<blockquote><p>When you [congregationalists] say that ‘a seal does not make a thing that was not, but confirm a thing that was,’ while you would seem to refute Papists, who vainly teach that sacraments do confer grace ex opere operato, by the deed done, yet do you make the sacrament but a naked sign and take part with Arminians and Socinians, whose very arguments in express words you use, for Socinius goes before you in this argument, and so does Smalcius follow him: ‘To obsignation and sealing there is required the trying of the thing, and some teaching or document; but that ceremony (a baptism) and that rite, though it be holy, does nothing to the remission of sins, but it does only shadow out, and as it were delineate and point forth remission of sins by the washing of water exponed in the Word of God.’ You say, ‘Sacraments do not make a thing that was not, but confirm a thing that was before;’ you can have no other meaning than to deny all causality and all real exhibition of grace in the sacraments: for if a sacrament make not a thing that was not before, or if God give not, and really produce, confer and exhibit grace, and a stronger measure of faith, and assurance of remission of sins, at the due and right use of the sacrament [that is with faith], the Sacrament is a naked sign, and not an exhibitive seal. But if† Christ give and in the present exhibit as surely remission of sins, as the infant is washen with water, as our divines and the Palatinate [Heidelberg] Catechism teaches, yea and the [Belgic] confession thereof, and the Synod of Dort teaches, then by the sacrament of baptism, a thing is made that which it was not. † [That is, this does not necessarily always occur, but if it does, then etc.] It is true a civil seal, as I said before, adds no new lands to the owner of the charter, but if Christ by his seals rightly and in faith used, do not only confirm grace and pardon, but also really exhibit and give grace and pardon in a further degree, and a new measure of assurance to the conscience which there was not before, you go not a streas [star’s?] breadth from Arminians and Socinians, especially seeing Episcopius, Henricus Welsingius say that remission of sins is not sealed by baptism, but signified only, and the Remonstrants in their Apology, while they expone our communion with Christ in the Lord’s Supper, and will reject a physical union of our souls with the physical substance of Christ’s body, which we also reject, they say that communion signifies, ‘only a profession of one and the same worship, whereby Christians solemnly testify that they adhere to Christ as to be partaker of the table of devils and of devils themselves, 1 Cor. 10:18,20, is a testimony of a communion with the devils’: But the Word of God says more, Gal. 3:17, ‘As many of you as are baptized have put on Christ;’ So Rom. 6:3, ‘Therefore we are buried with Him by baptism unto his death, that like as Christ was raised up from the dead, by the glory of the Father, even so we also should walk in newness of life,’ Eph. 5:26, ‘That He might sanctify and cleanse his Church with the washing of water by the Word,’ Tit. 3:5, and 1 Pet. 3:21, ‘The like figure whereunto even baptism does also now save us, etc.’ All this is more than a naked signification, otherwise manna saved Israel, and the water of the rock did wash them from their sins, and the sacrifice of bulls and goats did cleanse from sin, and open Heaven to sinners. Therefore by baptism and the Lord’s Supper something is made what it was not before, as by partaking of the table of devils, the partaker is really made a partaker with the devil, and an idolater; and his idolatry that he committed before was not only confirmed and signified to be what it was before. And in this civil seals and sacraments differ…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries... (London, 1644), pt. 2, ch. 4, section 5</cite>, pp. 216-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

s+not+necessarily+always+occur%2C+but+if+it+does%2C+then+etc.%5D+It+is+true+a+civil+seal%2C+as+I+said+before%2C+adds+no+new+lands+to+the+owner+of+the+charter%2C+but+if+Christ+by+his+seals+rightly+and+in+faith+used%2C+do+not+only+confirm+grace+and+pardon%2C+but+also+really+exhibit+and+give+grace+and+pardon+in+a+further+degree%2C+and+a+new+measure+of+assurance+to+the+conscience+which+there+was+not+before%2C+you+go+not+a+streas+%5Bstar%E2%80%99s%3F%5D+breadth+from+Arminians+and+Socinians%2C+especially+seeing+Episcopius%2C+Henricus+Welsingius+say+that+remission+of+sins+is+not+sealed+by+baptism%2C+but+signified+only%2C+and+the+Remonstrants+in+their+Apology%2C+while+they+expone+our+communion+with+Christ+in+the+Lord%E2%80%99s+Supper%2C+and+will+reject+a+physical+union+of+our+souls+with+the+physical+substance+of+Christ%E2%80%99s+body%2C+which+we+also+reject%2C+they+say+that+communion+signifies%2C+%E2%80%98only+a+profession+of+one+and+the+same+worship%2C+whereby+Christians+solemnly+testify+that+they+adhere+to+Christ+as+to+be+partaker+of+the+table+of+devils+and+of+devils+themselves%2C+1+Cor.+10%3A18%2C20%2C+is+a+testimony+of+a+communion+with+the+devils%E2%80%99%3A+But+the+Word+of+God+says+more%2C+Gal.+3%3A17%2C+%E2%80%98As+many+of+you+as+are+baptized+have+put+on+Christ%3B%E2%80%99+So+Rom.+6%3A3%2C+%E2%80%98Therefore+we+are+buried+with+Him+by+baptism+unto+his+death%2C+that+like+as+Christ+was+raised+up+from+the+dead%2C+by+the+glory+of+the+Father%2C+even+so+we+also+should+walk+in+newness+of+life%2C%E2%80%99+Eph.+5%3A26%2C+%E2%80%98That+He+might+sanctify+and+cleanse+his+Church+with+the+washing+of+water+by+the+Word%2C%E2%80%99+Tit.+3%3A5%2C+and+1+Pet.+3%3A21%2C+%E2%80%98The+like+figure+whereunto+even+baptism+does+also+now+save+us%2C+etc.%E2%80%99+All+this+is+more+than+a+naked+signification%2C+otherwise+manna+saved+Israel%2C+and+the+water+of+the+rock+did+wash+them+from+their+sins%2C+and+the+sacrifice+of+bulls+and+goats+did+cleanse+from+sin%2C+and+open+Heaven+to+sinners.+Therefore+by+baptism+and+the+Lord%E2%80%99s+Supper+something+is+made+what+it+was+not+before%2C+as+by+partaking+of+the+table+of+devils%2C+the+partaker+is+really+made+a+partaker+with+the+devil%2C+and+an+idolater%3B+and+his+idolatry+that+he+committed+before+was+not+only+confirmed+and+signified+to+be+what+it+was+before.+And+in+this+civil+seals+and+sacraments+differ%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries...+%28London%2C+1644%29%2C+pt.+2%2C+ch.+4%2C+section+5%2C+pp.+216-18&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F27784aaa36.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/27784aaa36.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments#:~:text=When%20you%20%5Bcongregationalists%5D%20say%20that%20%E2%80%98a,this%20civil%20seals%20and%20sacraments%20differ%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-ca26c0b1a4" data-kw="">
<blockquote><p>We were debtors to the mandatory and minatory part of the law, arraigned at the instance of divine justice to pay the debt; Christ substitutes himself in our room, and comes under the law to pay the whole debt. It is true, the debt was personal, and justice had a demand upon the person that sinned by virtue of the covenant of works; but that covenant never excluded a surety, tho’ it provided none. The law promised life, upon our personal obedience; but, in case we fail, it revealed no surety to make out an obedience in our room.

There behoved indeed to be a secret reserve in the covenant of works, whereby the perfect obedience of another was not excluded: For, if the covenant of works had absolutely excluded a surety in our room, then the covenant of grace had been excluded, and our salvation had been impossible after our fall; but tho’ the covenant of works did not exclude a surety, yet that covenant did neither provide nor reveal a surety: This is done in the covenant of grace, which is Christ as surety fulfilling for us the covenant of works, in all the articles of it. Now, is truth and faithfulness at any loss here?

No, the truth of the promise &amp; threatening both of the law of works, is fulfilled. On the one hand, the promise of eternal life made to perfect obedience; which, tho’ we forfeited in our own person, yet we recover in the person of Christ; the promise of life upon the ground and condition of perfect obedience being fulfilled to us in him, who hath yielded that perfect obedience in our room: On the other hand, divine truth and faithfulness, in the threatening of the law, which was death, is glorified, in that it is fulfilled upon the surety; while we, who came under the sentence of death in the first Adam, undergo that death in the second.

Again, is righteousness and justice at any loss by this surety in our room? No, no; whether we look upon it as vindictive or retributive justice, vindictive justice is displayed in its utmost severity upon Christ; Awake, O sword, against my shepherd, and the man that is my fellow: And so the sword is drunk in his blood to infinite satisfaction. Retributive justice is gloriously displayed also, in the sinner’s being rewarded, justified, saved upon this ground.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1d4fed99d8" data-kw="">
<blockquote><p>Because what God so severely punished must have been no light sin but a detestable crime, we must consider what kind of sin there was in Adam’s desertion that enkindled God’s fearful vengeance against the whole of mankind. To regard Adam’s sin as gluttonous intemperance (a common notion) is childish. As if the sum and head of all virtues lay in abstaining solely from one fruit, when all sorts of desirable delights abounded everywhere; and not only abundance but also magnificent variety was at hand in that blessed fruitfulness of earth! We must, therefore, look deeper than sensual intemperance. The prohibition to touch the Tree of Knowledge of good and evil was a trial of obedience (obedientiae examen), that Adam, by observing it, might prove his willing submission to the command of God. …The promise, which gave him hope of eternal life as long as he should eat of the tree of life (arbore vitae), and, on the other hand, the fearful denunciation of death the moment he should taste of the Tree of Knowledge of good and evil, were meant to test and exercise his faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559), 2.1.4.</span></figcaption>

</figure><figure class="quote" id="q-f29b709d88" data-kw="">
<blockquote><p>God intended a Law-dispensation but for a time.

2. Adam, how he was ordained for a Law-life.

3. How predestinated to glory in Christ, how not.

4. That the heathens have no more universal grace than devils.

5. No ground for such grace. It is apparent that God intended not a Law-dispensation in paradise to stand for ever. For nothing is spoken of Adam, after the fall, but of his procreating of children, of the patriarchs, of Adam’s dying and of his acts before the fall, the place of paradise being scarce well known, which says the Lord had a farther design to lay aside the transient Law-dispensation and to set up Christ. The Lord, of purpose, gave a positive Law, forbidding eating of such a tree, added a threatening thereunto particularly, suffered the serpent to tempt, and foresaw what frail nature would do, that he might deal with man, in a dispensation of free grace. Object. Did not God ordain that Adam should have life and righteousness, if he should continue in obedience. Answ. That was a decree conditional of things, (“the man that does these things shall live”) and shows the equity and holiness of the Law, but it was not a decree of persons, by which God predestinated Adam to a Law-glory, as the end, and to Law-obedience as the effectual means leading to that end. Q. Was not Adam chosen? Ans. Adam, according to the Lord’s design, finaliter and objective (finally and objectively) was created in the state of predestination to glory and grace in Christ, as touching [his] person, but according to his inherent condition, he was created in a legal dispensation, which was a gracious inlet to Christ; And according to his Law-state as he represented all mankind, he was created as a lubric [slippery] and frail copy of weak nature. Many who are such as are not chosen are created and live under a covenant of works, having only some concomitant favors of the Gospel, as the preaching thereof.

2. Common grace, inward warnings.

3. Protections of providence and forbearance, in regard they are mixed with the elect. The heathen cannot be said to have any inward calling to grace and glory, because there be some remnants of the image of God left in them, which no more can be called universal grace, then the same sparkles that are left in devils can be called Gospel grace, for they believe, “There is one God and confess the Son of God,” (Jam. 2:19; Luk. 4:34. Mark 1:24). Only if this be called grace, that the nature of man is so capable of Gospel mercy, and the nature of the fallen angels morally not so.

2. The offer is made to them of Christ; not so to devils, we shall not contend. Reason may seem to say that all should have a share of Gospel-grace, but it may be replied to reason, why should it seem to be a part of the goodness and bounty of God to will and desire all and every one to be saved, and not to institute such a dispensation, as all and every one should actually be saved?

2. How should that stand, (“he has mercy on whom he will”) if free-will of the creature absolutely dispose of salvation and damnation?

3. How is it that the calling, adoption, and the offer of mercy is restricted to few, and was confined to the Jews only of old? But we are more ready to call the Lord to a reckoning, for his dispensation of grace to others, then to use our own, as becomes us.

2. We cannot judge aright of God and of his goodness, except he be God our very way.

3. It is a matter of no small difficulty to make right use of the Lord’s freedom of grace, and for clay humbly to adore Sovereignty, and not to stumble at the highness of his ways, who, in these points, has ways and thoughts above ours, “as the heavens are above the earth” (Isa. 55).</p></blockquote>

esented+all+mankind%2C+he+was+created+as+a+lubric+%5Bslippery%5D+and+frail+copy+of+weak+nature.+Many+who+are+such+as+are+not+chosen+are+created+and+live+under+a+covenant+of+works%2C+having+only+some+concomitant+favors+of+the+Gospel%2C+as+the+preaching+thereof.+2.+Common+grace%2C+inward+warnings.+3.+Protections+of+providence+and+forbearance%2C+in+regard+they+are+mixed+with+the+elect.+The+heathen+cannot+be+said+to+have+any+inward+calling+to+grace+and+glory%2C+because+there+be+some+remnants+of+the+image+of+God+left+in+them%2C+which+no+more+can+be+called+universal+grace%2C+then+the+same+sparkles+that+are+left+in+devils+can+be+called+Gospel+grace%2C+for+they+believe%2C+%E2%80%9CThere+is+one+God+and+confess+the+Son+of+God%2C%E2%80%9D+%28Jam.+2%3A19%3B+Luk.+4%3A34.+Mark+1%3A24%29.+Only+if+this+be+called+grace%2C+that+the+nature+of+man+is+so+capable+of+Gospel+mercy%2C+and+the+nature+of+the+fallen+angels+morally+not+so.+2.+The+offer+is+made+to+them+of+Christ%3B+not+so+to+devils%2C+we+shall+not+contend.+Reason+may+seem+to+say+that+all+should+have+a+share+of+Gospel-grace%2C+but+it+may+be+replied+to+reason%2C+why+should+it+seem+to+be+a+part+of+the+goodness+and+bounty+of+God+to+will+and+desire+all+and+every+one+to+be+saved%2C+and+not+to+institute+such+a+dispensation%2C+as+all+and+every+one+should+actually+be+saved%3F+2.+How+should+that+stand%2C+%28%E2%80%9Che+has+mercy+on+whom+he+will%E2%80%9D%29+if+free-will+of+the+creature+absolutely+dispose+of+salvation+and+damnation%3F+3.+How+is+it+that+the+calling%2C+adoption%2C+and+the+offer+of+mercy+is+restricted+to+few%2C+and+was+confined+to+the+Jews+only+of+old%3F+But+we+are+more+ready+to+call+the+Lord+to+a+reckoning%2C+for+his+dispensation+of+grace+to+others%2C+then+to+use+our+own%2C+as+becomes+us.+2.+We+cannot+judge+aright+of+God+and+of+his+goodness%2C+except+he+be+God+our+very+way.+3.+It+is+a+matter+of+no+small+difficulty+to+make+right+use+of+the+Lord%E2%80%99s+freedom+of+grace%2C+and+for+clay+humbly+to+adore+Sovereignty%2C+and+not+to+stumble+at+the+highness+of+his+ways%2C+who%2C+in+these+points%2C+has+ways+and+thoughts+above+ours%2C+%E2%80%9Cas+the+heavens+are+above+the+earth%E2%80%9D+%28Isa.+55%29.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Covenant+of+Life+Opened+or+A+Treatise+of+the+Covenant+of+Grace%2C+%28Edinburgh%2C+1654%29%2C+13%E2%80%9315+%5BSpelling+and+punctuation+modernized%5D.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff29b709d88.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f29b709d88.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/02/rutherford-adam-was-in-a-temporary-legal-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>…the problem of the promises given under the covenant of works and the meaning of the “life” promised to Adam in return for obedience – perpetual, yes, but would it be heavenly or earthly? The[re was a] fairly radical disagreement on the issue between such eminent thinkers as Thomas Goodwin, John Cameron, Moise Amyraut, John Ball, and Johannes Marckius on the side of an earthly reward, and Francis Turretin, J.H. Heidegger, the Formula Consensus Helvetica, Thomas Boston and Thomas Ridgley on the side of a heavenly reward.</p></blockquote>

</figure><figure class="quote" id="q-3b3bd8ec8c" data-kw="">
<blockquote><p>These covenants differ, in relation to the Parties contracting the covenant of works, the Parties were God, and the first Adam, representing all his natural posterity; but in the covenant of grace, the Parties were God the Father, and Christ the second Adam, representing all his spiritual seed. The first covenant, was made with a mere man, a fallible creature: the second, was established with God-man, “the Lord from heaven, who enangeth not.” The former, depended on a righteous creature: the latter, on a righteous, an almighty Redeemer.

The one, was made with man in his best state, and yet he kept it not: the other, was made with God-man, our blessed Immanuel, who neither could nor would, fail in fulfilling it. In that, the triune God, is to be considered as the supreme Lawgiver, and the fountain of uncreated goodness, delighting in communicating happiness to an upright creature: in this, he is to be viewed as infinitely merciful and gracious, rejoicing to give, in a manner suited to the glory of all his perfections, eternal life to an elect sinner believing in Jesus.

According to the covenant of works, God could deal with man, and man with God, immediately; but according to the covenant of grace, he cannot deal with man, nor man with him, but through a Mediator. With the blessed Mediator it was, that he dealt primarily, and immediately; and with man, only in and through Him.</p></blockquote>

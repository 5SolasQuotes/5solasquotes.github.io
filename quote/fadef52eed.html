<main class="wrap"><figure class="quote" id="q-fadef52eed" data-kw="">
<blockquote><p>The knowledge of these things are most necessary. First, they shew the excellency of the Ministry of the new Testament. 2 Cor. 4.1, 2, 3. So that the Ministers thereof need not to be ashamed. Rom. 1.16. It is the power of God to Salvation. Ephes. 3.7.8, 9. And hereby, the meanest Preacher of the Gospel is become greater then John Baptist, namely in regard of his Office; Because they are publishers of these glad-tidings accomplished by Christ.

Second, this shows the happy condition of the faithful now. Math 13. Luke 10. Blessed are the eyes that see those things which you see, &amp;c. Heb. 12.17 18, 19.

Third, it admonishes all Christians of their duty, and that they take heed they neglect not the same. Heb. 2.1, 2, 3. If they escaped not that transgressed the Law, much less shall they that offend against the Gospel. For Christ is the Prophet whom who so will not hear, must be destroyed. Acts 3. at the end. God suffered evil entreaty of his Servants, but after he had sent his Son, and they had despised him, presently he took away the Vineyard. Woes were denounced against Corazin, Bethsaida and Capernaum, wherein is shewed that their state should be worse at the day of Judgment, then Sodom and Gomorrah.

Fourth, this teaches the simple, to distinguish the Law and the Gospel, the knowledge whereof is the key of the whole Scripture, as whereby all the wiles of the Papists may be discovered and avoided. They commonly teach, that the Gospel is the new Law, and a more perfect Law, whence they inferred their Doctrines of Counsel and works of Supererogations. But alas, if the Gospel were a more perfect Law, it were woeful tidings to all mankind: Hereby also may appear that the Law and Gospel cannot be joined in the point of Justification; for as these two are quite contrary. To do a thing by ourselves and to do it by another; to have a thing by desert, and to have it of free gift, and such are the Law and Gospel in the justification of a sinner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brightman.html">Thomas Brightman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Brightman redivivus: or The post-humian of-spring of Mr. Thomas Brightman, in IIII. sermons. Viz. 1. Of the two covenants. 2. The danger of scandals. 3. God’s commission to Christ to preach the Gospel. 4. The saint’s security</cite>, (London: John Rothwell, 1647), pp 61-62.</span></figcaption>

<blockquote><p>Q. 21. Why doth God mention not only servants but beasts?

A. As he would not have servants enslaved and abused by such labour as should unfit them for sabbath work and comfort, so he would have man exercise the clemency of his nature, even towards the brutes; and beasts cannot labour, but man will be put to some labour or diversion by it: and God would have the whole place where we dwell, and all that we have to do with, to bear an open signification of our obedience to his command, and our reverence to his sanctified day and worship.</p></blockquote>

<blockquote><p>Three things about the worship of God are to be considered:

1. The kinds of it…

2. The parts of it…

3. There are certain circumstances and solemnities for the manner of celebrating those parts and kinds: Now the two former must be expressly commanded. The later must not be forbidden nor condemned, only a thing of solemnity is changed into a part when a religious necessity is imposed upon it, and a spiritual efficacy conceived to be annexed unto it, as appears in the priests’ garments in the Law. Thus for example: Prayer is a kind of God’s worship; the confession of sins, petition and thanksgiving for benefits be parts of this kind of worship, and so are the person to whom, and the person in whose name necessary things for the matter of the worship. But now, whether I pray in such or such a place, whether with eyes lift up or cast down, whether kneeling or standing, whether with mine head covered or uncovered, these are certain points of solemnity, as it were adjuncts of the exercise. And here it is sufficient, that I use no such circumstance as is condemned, nor neglect any that is commanded; but if I do esteem it a matter of religious necessity to Godward… I do now turn the circumstance into a part of worship, and seeing it is not from God, of false worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), 9th Book, of the Moral Law, ch. 3, 2nd Commandment, p. 772</span></figcaption>

<blockquote><p>6. The question concerning particular works, or permitted recreations, is wholly useless and trifling: for quod lege prohibitoriâ vetitum non est, permissum intelligitur, says the law: all that is permitted which in the negative precept is not forbidden: But as for some persons to give themselves great liberties of sport on that day is neither pious nor prudent; so to deny some to others is neither just nor charitable. The plowman sits still in the Church and the Priest labours; and the wearied man is permitted to his refreshment, and others not permitted because they need it not (Ordinary Gloss on Mt. 28); and there is no violation of any commandement of God, even when there is a profanation of the day indulged upon pious and worthy considerations.</p></blockquote>

<blockquote><p>How this Worship is Correspondent to the Nature of God. The Lord does show it in the fourth of John, verses 23 and 24, saying, the true worshippers, shall worship God in spirit and truth, that is in the Spirit of sanctification dwelling in the mind, helping our infirmities with sighs and groans, which cannot be expressed; and in the truth of his Word dwelling in us in all wisdom and spiritual understanding, such as these the Father requires should worship Him, because God is a Spirit, and they that worship Him, must worship Him in spirit and truth, and not in the ignorance of the mind, nor in the invention and will-worship of man; For this cause the Psalmist says in the 51:6, ‘Thou O Lord lovest truth in the inward affections’; and in the 50th Psalm he says, ‘Offer to God the sacrifice of praise, and pay the vows of the Most High, and call upon God; for the Lord loves truth in the inward parts.’ This is the pure and simple worship of God, without the glory and beauty of outward ceremonies, agreeing with the simple pure essence and nature of God Himself. Consider well Paul’s caveat in the Col. 2:8,18,20-23, warning all men to beware of human wisdom, and deceitful inventions and traditions, according to the rudiments of the world, and not after Christ; the outward show of holiness which puffs up men’s hearts with self-conceit, being burdened with traditions, which having a glorious show of holiness, of wisdom and voluntary religion, wherein men are out of measure superstitious in zeal, not sparing their bodily labor.</p></blockquote>

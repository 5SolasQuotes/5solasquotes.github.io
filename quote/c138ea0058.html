<main class="wrap"><figure class="quote" id="q-c138ea0058" data-kw="">
<blockquote><p>Now, whoever has been once truly given to Christ, even if he sometimes errs and goes astray, is yet never cast out (John 6:37; 1 John 2:19); thus it is sufficient to have been received once. This is why we do not agree with those who rebaptise persons who have been baptized by heretics or bad ministers. We have no doubt that true baptism may also take place in the Roman Church, although it be administered by ministers who are neither qualified nor lawful, and be polluted with innumerable corruptions.

For, since it has pleased God to preserve by His mercy some remnant of His Church within the Papacy until He reforms it again, He has not willed to loosen the reins of Satan to the point where he comes to reverse and abolish there completely the Baptism by which all the elect are united to one another. Yet it does not follow that those who now present their children to the priests of the Papacy for baptism do well, for they cannot do it without defiling themselves with the sacrileges and corruptions of these priests.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, trans. James Clark (1558; Edinburgh, 2016), 4.49, p. 57.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e36ba5a74f" data-kw="">
<blockquote><p>But since our infants also ought to be baptized according to the promise of the Lord, “I will be your God, and the God of your seed” (Gen. 17:7), both the parents of the baptized infants and the ministers of the Church must take the responsibility that, as soon as they have matured, they will be diligently catechized and instructed in the doctrine of Christ, so that they may make for themselves publicly in church the profession of their faith which they were unable to do when they were baptized, confessing their sins, and embracing with a most grateful heart the grace of Baptism conferred on them in infancy, renouncing the world and Satan, and pledging themselves to the obedience of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Christi</cite>, (1550) in Wilhelm Pauck (ed.), The library of Christian classics: Melanchthon and Bucer (Philadelphia, 1969), pp 228-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-3a9e02a29a" data-kw="">
<blockquote><p>16 And as the covenant once begun with God remaineth perpetually stedfast to such as repent, even after their sins from that time committed; so also baptism once received, confirmeth those that repent in remission of sins for all their life, and therefore ought neither to be terated [sic], nor deferred to the end of life, as if on that condition only it did cleanse us from our sins, if we committed no more after we were once baptized.

17 But all that are baptised with water, whether infants or aged, are not made partakers of the grace of Christ. For God’s eternal election and calling to the kingdom of Christ is free.

18 Neither are all excluded from the grace of Christ which are not baptised with water. For not the want but contempt of baptism excludeth from the covenant made by God with the faithful and their children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A collection of certain learned discourses, written by that famous man of memory Zachary Ursine; doctor and professor of divinity in the noble and flourishing schools of Neustad. For explication of divers difficult points, laid down by that author in his catechism. Lately put in print in Latin by th</cite>, (Oxford: Joseph Barnes, 1600), p. 296.</span></figcaption>

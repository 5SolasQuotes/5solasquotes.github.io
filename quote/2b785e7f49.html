<main class="wrap"><figure class="quote" id="q-2b785e7f49" data-kw="">
<blockquote><p>Seventhly, Get this principle rooted in you, That it is the delight of Christ to give poor sinners an interest [legal right] in Himself. He is not only able to do it, but it is his delight to do it. Christ’s soul is in nothing more. Witness his leaving his Father’s bosom; witness his laying down his crown; witness those many sufferings and deaths that He went through in this world; witness those gospel acclamations, Mk. 16:16, Rev. 22:17; witness those persuasive exhortations and gracious impetrations [obtaining by asking or petition] and entreaties, Isa. 53:11, Mt. 11:28, 2 Cor. 5:20; witness divine injunctions and comminations [threatenings, 1 Jn. 5:23, Mt. 11:21; witness those pathetical lamentations, Mt. 23:37, Lk. 19:42, Ps. 81:13; and witness the inward motions and secret excitations of his blessed Spirit, Gen. 6:3, all which speak out his great willingness and delight to save poor sinners;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 3, The Unsearchable Riches of Christ, p. 206</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>Their heavenly adoption ought to excite them to the exercise of beneficence, that they may imitate their Father’s disposition, “who makes his sun to rise on the evil and on the good,” (Mt. 5:45) There is nothing in which men resemble God more truly than in doing good to others.</p></blockquote>

</figure><figure class="quote" id="q-7176c29a50" data-kw="">
<blockquote><p>Hence likewise we may collect how really and cheerfully willing Christ is to save sinners. Certainly, He that makes such bitter lamentation over the foreseen ruins of Jerusalem, must needs have a very cordial, and unfeigned will and desire of her salvation… What a pathetic expostulation is here, which carries in it notices of vehement affections? Oh! how willing is Christ to give unto sinners the things that belong unto their peace? Yea, is He not more willing to bestow great things than small? Does not his willingness to give, infinitely exceed the sinners’ willingness to receive? Is not Christ more glad to receive poor and weary souls, than they are to come unto Him?… Is not every thing about Christ mighty drawing, alluring, and inviting?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Tears for Jerusalem’s Unbelief &amp; Ruin, Now Humbly Recommended to England’s Consideration in this Her Day of Trial &amp; Danger</cite>, (1679) 254 pp., pp. 66-67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-0496fb5986" data-kw="">
<blockquote><p>The Reformed, although they do not at all deny that words that express affections, just as words that express body parts, are employed to speak of God in the Scriptures, and although likewise they acknowledge that when every imperfection is removed from the affections, the substance of those words is in God, even so do not dare to allow in God these disturbances, in which almost the whole nature of affections consists.</p></blockquote>

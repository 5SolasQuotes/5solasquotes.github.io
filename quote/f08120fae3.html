<blockquote><p>XXVIII. We hold mental distant communion in faith and love with many Churches that by imposing sin do deny us local communion.</p></blockquote>

— Richard Baxter, Detailed | The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (London, 1689), ch. 2, pp. 11-16 | Communion with Opposers">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXVIII.+We+hold+mental+distant+communion+in+faith+and+love+with+many+Churches+that+by+imposing+sin+do+deny+us+local+communion.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Detailed+%7C+The+English+Nonconformity+as+under+King+Charles+II+%26+King+James+II+Truly+Stated+%26+Argued+%28London%2C+1689%29%2C+ch.+2%2C+pp.+11-16+%7C+Communion+with+Opposers&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff08120fae3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f08120fae3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=XXVIII.%20We%20hold%20mental%20distant%20communion,sin%20do%20deny%20us%20local%20communion&amp;text=XXVIII.%20We%20hold%20mental%20distant%20communion%20in%20faith&amp;text=by%20imposing%20sin%20do%20deny%20us%20local%20communion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-29283f1287" data-kw="">
<blockquote><p>Other churches there are in the world which are not evidently guilty of the enormities in doctrine, worship and discipline before discoursed of. These all we judge to be true churches of Christ; and do hope that his promised presence is with them in their assemblies. Answerable hereunto is our judgment concerning their officers or rulers, and all their sacred administrations. It becomes us to think and believe that the one [their offices] have authority from Christ and that the other [their sacred administrations] are accepted with Him: For it is most unwarrantable rashness and presumption, yea an evident fruit of ignorance, or want of love, or secular private interest, when, upon lesser differences men judge churches to be no true churches and their ministers to be no true ministers, and consequently all their administrations to be invalid… But the validity or invalidity of the ordinances of Christ, which are the means of union and communion with Him unto all his disciples, depend not on the determination of things highly disputable in their notion, and not inconsistent with true Gospel-obedience in their practice… We stand to the judgment of Christ and his Word. We cannot but judge indeed that many Churches have missed, and do miss in some things the precise rules of their due constitution and walking; that many of them have added useless, superfluous rites to the worship of God among them; that there is in many of them a sinful neglect of evangelical discipline, or a carnal rule erected in the stead of it; that errors in doctrines of importance and danger, are prevalent in sundry of them; that their rulers are much influenced by a spirit of bitterness and envy against such as plead for reformation beyond their measure or interest; yet that hereupon they should all or any of them immediately forfeit their church-state, so as to have no lawful ministers, nor acceptable sacred administrations, is in itself a false imagination, and such as was never by us entertained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious (1672)</cite>, ch. 3, pp. 84-86</span></figcaption>

</figure><figure class="quote" id="q-dc45fd21f5" data-kw="">
<blockquote><p>XXI… Rulers have authority to command that which is good, though not in a faulty manner; and when we cannot do the good without the faulty manner, it is their fault and not ours: e.g. If an inconvenient time, place, text, tune, etc. be chosen, the union and concord which is held by agreeing in those modes is necessary: He that will not join in them cannot join in the worship. So that we obey the ruler or guide as a determiner of the means of concord, which is necessary, and not sub ratione erroris [under the rule of the error], [we do not obey and perform the action formally] as misdetermining, though [we do the action] in that which is [materially] misdetermined…º And it’s to us a lawful circumstance, because [it is] necessary to concord and [is] commanded, though mistakingly. XXII. We [nonconformists] never held it unlawful to join with a Church or minister that has some faults, both personal and in their acts of worship, as if all that joined were guilty of all the faults there committed: No not though we knew before hand that some false doctrine would be uttered or fault committed: Else we must separate from all the world, and all [people must separate] from us. … XXIV. We never judged needless affected singularity a duty, but judge it best in lawful things for concord’s sake to conform to the custom of the Churches where we live or come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (London, 1689), ch. 2</cite>, pp. 11-16</span></figcaption>

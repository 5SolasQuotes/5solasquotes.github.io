<main class="wrap"><figure class="quote" id="q-dae3e85038" data-kw="">
<blockquote><p>Sometime he [Satan] tempts to lawful liberties, to ear, setting the Law of nature in opposition to the divine positive-law, Gen. 3. ‘The tree is good for meat;’ then God and Nature ordained it for food. In all which, holy Sovereignty gives influences natural to the tempter; nor will He have us to question his Sovereignty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Influences of the Life of Grace</cite>, … (London, 1659), pp. 110-111</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9428c2fa7a" data-kw="">
<blockquote><p>For in the Old Testament there are many rules, directions and examples, as a pillar of fire to guide the Churches now by (as that Rom. 15:4 shows) namely those examples and rules of moral and common equity, else the Church of God should loose now many a good ground, for many practices… Now if you [Independents] will use the Old Testament in some examples and commands, as you do (though here you forget to mention it), then grounds out of the Old Testament (in matters not ceremonial and judicial proper to the Jews’ policy, nation and times) but in things of moral and common equity will justify other practices…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, (1644), p. 69</span></figcaption>

</figure><figure class="quote" id="q-e50800b783" data-kw="">
<blockquote><p>I would learn of him what makes a lawful ordinance about matters of fact or things to be done? Not the will of superiors, else there shall be no unlawful ordinances (for every ordinance has the will of the ordainer). Not the lawfulness of the thing in itself which is ordained either, for then every ordinance which prescribes a thing lawful in itselfe, were it never so inexpedient in respect of supervenient circumstances, should be lawful. To a lawful ordinance, then, [is] required not only that the thing ordained be lawful in itself… [but] also that it be not inexpedient. So that a thing may be lawful in itself, yet not lawfully ordained, because the ordinance commands the doing of it; whereas there are many things lawful which ought not to be done, because they are not expedient, 1 Cor. 6:12. 3. Since it cannot be a lawful ordinance which ordains a thing inexpedient, it can not be a lawful obedience which is yielded to such an ordinance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 2, ch. 9, pp. 41-42</span></figcaption>

</figure><figure class="quote" id="q-0617859933" data-kw="">
<blockquote><p>5thly. I shall only propose one thing more to your consideration. Although the institutions and examples of the Old Testament, of the duty of magistrates in the things and about the worship of God, are not, in their whole latitude and extent, to be drawn into rules that should be obligatory to all magistrates now, under the administration of the gospel,-and that because the magistrate then was ‘custos, vindex, et administrator legis judicialis, et politiae Mosaicae,’ [the custodian, vindicator and administrator of the Judicial Law and Mosaic polity] from which, as most think, we are freed;–yet, doubtless, there is something moral in those institutions, which, being unclothed of their Judaical form, is still binding to all in the like kind, as to some analogy and proportion. Subduct [subtract] from those administrations what was proper to, ad lies upon the account of, the church and nation of the Jews, and what remains upon the general notion of a church and nation must be everlastingly binding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Kingdom &amp; the Magistrate’s Power: a Sermon</cite>, p. 509</span></figcaption>

</div>
</figure><figure class="quote" id="q-8f08e5695a" data-kw="">
<blockquote><p>Rutherford states quite explicitly that it was Bradwardine who provided him with the solution to the philosophical conundrum of the ground of ethics… Bradwardine offered a subtler threefold division… Bradwardine’s basic distinction was between things which are reasonable naturally prior to the divine will, things which are reasonable naturally posterior to the divine will, and things which are said to be mixed. Within the first category are contained necessary truths about God, such as his being and goodness, which obtain prior to any act of his will… they are able to move the divine will. Within the second category are contained things which are reasonable posterior to God’s will, and which depend on God’s will for their reasonable status. These are therefore said to be caused by the divine will and can in no way move or determine it… Bradward likens it to the situation of someone choosing between two equal alternatives. For when someone chooses one of these, we say that this was a rational choice even though he could have also chosen the other. Within the third category are included reasonable things which are said to be conditionally rather than absolutely necessary. Thus while they do not themselves obtain naturally prior to the divine will, their reasonable status is crucially founded on truths which do obtain in this way… the creature’s duty to love and obey God. For althought the creature’s existence is dependent on the divine will, with the supposition that this creature is in existence it is absolutely reasonable that he should love and obey God and indeed this reasonable status cannot be changed even by God himself… Rutherford therefore had no difficulty transposing this into his own theory of moral complexes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/simon-j-g-burton.html">Simon J.G. Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 7, ‘Samuel Rutherford’s Euthyphro Dilemma: A Reformed Perspective on the Scholastic Natural Law Tradition’ in d. Aaron C. Denlinger, Reformed Orthodoxy in Scotland: Essays on Scottish Theology, 1560-1775 (Bloomsbury, T&amp;T Clark, 2016), pt. 2, pp. 123-40, pp. 134-35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

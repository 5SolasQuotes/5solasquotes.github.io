<main class="wrap"><figure class="quote" id="q-3f15621911" data-kw="">
<blockquote><p>The work of Missions is not simply a measure of expediency devised by the wisdom and piety of the Church in this or any other age of peculiar activity. It is the divinely appointed work which the Church has been organized to do. The doctrine of Missions is of faith, not of opinion. The cause of Missions addresses itself not to the benevolent sympathies merely, but to the conscience and faith of God’s people.

The most efficient means, therefore, of arousing the Church and keeping the Church awake to her duty in this regard, are not ingeniously-devised appliances for rousing the philanthropic sympathies of the people, and for reaching the treasures which their covetousness has hoarded away; but the simple exposition of the great truth of God relating to this work, for the enlightenment of their understandings and consciences: thereby awakening emotions of love for Jesus and his cause in their hearts, that will impel them to a consecration of themselves and their substance to his service.

In this, as in every case, the simple truth of God, apprehended by the understanding and present to the consciousness of the soul, is the means which the Spirit uses for giving energy to, as well as for awakening the spiritual affections in, the heart. And so in regard to the revival of a spirit for this work in the Church at large. The truth of God is the agency which the Spirit will honor.

It is not enough to devise wise expedients and machinery for this work—even though scriptural machinery, and then, folding our hands, sit in silence, waiting for the Spirit to come and stir up the people to work with the machinery. We must expound the truth—not our truth, but the truth of God—relating to the nature, the obligations, and the means of accomplishing the work; and cry earnestly to the Holy Spirit to give our teachings efficiency, in enlightening the understandings and enlarging the hearts of the people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stuart-robinson.html">Stuart Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Kingdom on Earth: A Self-Expanding Missionary Society. A Discourse for the Presbyterian Board of Foreign Missions; Preached in the First Presbyterian Church, N.Y., May 6, 1855</cite>, (New York: Edward O. Jenkins, 1855), pp 12-13.</span></figcaption>

<blockquote><p>Indeed, God not only calls to all who hear His Word, but He also communicates various gifts to them. Speaking of persons who do not come to conversion, the apostle says that they were once enlightened, have tasted of the heavenly gift, and were made partakers of the Holy Ghost, and have tasted the good word of God, and the powers of the world to come. (Heb. 6:4,5) God sometimes grants to reprobates special gifts, also relating to His Word, giving a certain pleasure in it, which nevertheless does not lead to salvation.</p></blockquote>

<blockquote><p>1. That this offer is real. Christ does not deceive, or dissemble with sinners, but really He does desire they should have liberty. Men sometimes make offers of good things to one another, but they are not sincere in them. But it is not so with Christ; He is a real well-wisher to sinners’ souls. He has expressed it all the ways that can be desired. Would you believe his reality, if He does woo sinners? Why, so He does, Lk. 14:23, compel them to come in, viz. by importunate entreaty. Would you believe his reality, if He does wait for sinners? Why, so He does, Rev. 3:20, ‘Behold I stand at the door, and knock, etc.’ Would you believe his reality if He does weep for sinners? Why, so He does, He wept over Jerusalem, Lk. 19:41-42. Would you believe his reality if He does die for sinners? Why, so He did, Rom. 5:8. While we were yet sinners, Christ died for us. Nay, would you believe his reality if he should be damned for sinners? Why, so He was, though not in respect of the place, yet in respect of the pains of Hell: He was ;’made a curse for us,’ Gal. 3:13. What would you have Christ to say or do more than He has said and done, to convince you, that He would have sinners to be partakers of this freedom. Has He not said so in his Word? Has He not sealed it with his blood? Has He not accepted and embraced from time to time, whoever came unto Him? Does He not engage Himself by his faithful promise, to do so still to the end of the world, that He will in no wise cast out such as come to Him, Jn. 6:37. And yet what a wonder is it, that the world is so unbelieving still? and so hard to be persuaded, that Christ has any loving thoughts or purposes towards them? Oh this cursed unbelief, and hardness of heart, that is in men and women that makes them that they will not come to Christ that they might have life!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-ball.html">Nathanael Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Bondage &amp; Freedom</cite>, … from John 8:36 (London: Robinson, 1683), pp. 36–38 Ball (1623–1681) was an English, partial conformist presbyterian minister.</span></figcaption>

</figure><figure class="quote" id="q-3064123999" data-kw="">
<blockquote><p>Wherefore, whosoever in the preaching of the Gospel, are charged and commanded to repent, to believe in Christ, or turn unto God, they are commanded also to use all these external means [“hear a Sermon preached, to read the Scripture, to be informed by Catechizing, and conference of Religion…”] whereby they may be informed of the duty required, and of the means leading thereunto; in the exercise of which external means, they may meet with sundry common operations and effects of God’s Spirit, before they be regenerate or converted, whereof the use may be sound not only in, but also after, conversion; And if any man shall refuse, slight or neglect to follow these preparatory exercises, which may prepare him for conversion, he is inexcusable before God and man, and guilty of rejecting of the offer of reconciliation, yea guilty of resisting of the Holy Ghost, of which sin and guiltiness the holy martyr Stephen charges the misbelieving Jews, 8. As for the regenerate man, he it is who in the acknowledgement of his sinfulness and deserved misery, and of his utter inability to help himself, does cast away all confidence in his own parts, and possible righteousness of his own works, and flees to Christ offered in the Gospel…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1e1630c6fb" data-kw="">
<blockquote><p>1 Cor. 6:12, ‘All things (indifferent) are lawful in themselves, but they are not expedient,’ if we be brought under the power or band of them by law. Therefore, in the means of worship, not only must we see what is lawful, but also what is profitable and conducing to the end… 1 Cor. 7:6, ‘But this I speak by permission, not of commandment.’ Therefore in things in which God has granted us liberty, to do or not to do, permission has place, not obliging necessity or penal laws. 13th Proposition. There cannot be commanding laws in things that are politicly good or evil according to the individual complexion, temperature, or gifts of singular men: [for example] to marry or not to marry, cannot be commanded, for where God looses, no power on earth can bind, v. 33. 1 Cor. 8:7, Paul condemns them in the use of their Christian liberty, ‘Howbeit there be not in every man this knowledge;’ then that rulers may make laws in things indifferent, without scandal, they must remove ignorance. 2. If there be but one person weak in knowledge (there is not in every man that knowledge), a law obliging all in things indifferent cannot be made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (London, 1646), Appendix, Question 1</cite>, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

<blockquote><p>4. …In the art of painting, ye may abstract that which is moral from that which is artificial; but in a King as a King, there is nothing artificial, or which is to be abstracted from justice and piety; for all the acts of kingly authority as kingly, are moral acts of justice, and of piety in preserving both the Tables of the Law (if a King command a stratagem of war, that which is merely artificial is not from the King as King, but from a principle of military art in him, as an expert soldier)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable and Temperate Plea (1642), ch. 19</cite>, p. 307</span></figcaption>

<blockquote><p>5. [Henning] Arnisaeus [d. 1636, a German, Lutheran political writer] desires that kings may use sparingly the plenitude of their power for public good; there must be, says he, necessity to make it lawful to use the plenitude of their power justly; therefore Ahab sinned, in that he unjustly possessed Naboth’s vineyard… but this plenitude of power may be justly put forth in act, says he, if the public good may be regarded.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex… (1644)</cite>, p. 197</span></figcaption>

</figure><figure class="quote" id="q-eeac0e8f62" data-kw="">
<blockquote><p>§12. Question 7. May a true man promise money to a robber for the saving of his life or of a greater sum or more precious commodity? Answer: Yes, in case of necessity, when his life or estate cannot better be preserved: And so taxes may be paid to an enemy in arms, or to a plundering soldier (supposing that it do no other hurt which is greater than the good). Any man may part with a lesser good to preserve a greater: And it is no more voluntary or imputable to our wills than the casting of our goods into the sea to save the vessel and our lives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Directory (London, 1673), pt. 4, ch. 19, title 2</cite>, p. 116</span></figcaption>

</figure><figure class="quote" id="q-c1a9a1236c" data-kw="">
<blockquote><p>Man’s natural liberty is this: privilege of having and doing those things only to which the individual has a moral right. Consequently, the natural liberty of two men in the same commonwealth may be different, because under Providence, their natural endowments and relations may differ. Were it possible to frame a government thoroughly equitable, each person’s civic liberty would be identical with his natural: the privilege of having and doing all those things, and those only, to which each has a moral right.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-l-dabney.html">R. L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practical Philosophy (Mexico, MO, 1897)</cite>, p. 383</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

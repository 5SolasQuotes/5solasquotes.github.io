<blockquote><p>4. They that distinguish between the key of order and the key of jurisdiction do without question allow the former to the presbyters. Now the key of order (as rightly understood, as Spalatensis has largely opened it) comprehends all that power whereby we do immediately work on the conscience, and so is exercised in foro interno, and not directly in externo. Now that which we have agreed on [in Baxter’s Association] is only so much as belongs to order, or to a presbyter as the ambassador of Christ and [as] his watchman over the souls of those people; and it is to be no further effectual than they conscientiously submit to it, voluntarily, without external force. It is but our preaching and applying God’s Word to the consciences of the hearers.</p></blockquote>

ad it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0e31d655df" data-kw="">
<blockquote><p>Other two questions here are shortly to be discussed, as belonging to this purpose, as:

1. Whether discipline be a mark of the visible Church? Mr. [John] Robinson says [that] the power of censures is simply necessary for the being of the Church; sundry of our divines affirm it is. So the learned professors of Leiden, and Ursinus with Pareus. Great Junius says [that] it is a note belonging to the Church’s order, ad decorum; the [Lutheran] Augsburg Confession leaves it out from amongst the notes, and so does Calvin and Whittaker, making two notes only: Word and sacraments. Learned Beza makes only the preaching of the Word a note, not excluding the other two. I think distinctions may help the matter:

1. There is a power of discipline, and there is a care thereof. True Churches have a power given them of Christ, and this Robinson proves, and no more; yet the care to exercise the power may be wanting [lacking] in a true Church. 2nd Distinction: Right discipline is not necessary for the essence of a visible Church: [1.] All our divines condemn Anabaptists and Pelagians, who plead that righteous men only, and such societies as have right discipline, to be true Churches.

2. Novatians and Donatists came near to them in this also, as we may see in Augustine. So Richard Field, Parker [and] Cartwright make it necessary to the well-being of the Church:

1. Because it is not indifferent.

2. Because it is commanded in God’s Word.

3. Discipline in the substantial points is immutable.

4. It is necessary in respect of the end. And all this the learned Parker demonstrates to be true. But it is not necessary simply to the being of it: as a city may be without walls, a garden without an hedge. 3rd Distinction: The power and right to discipline is a propriety essential to the Church, and is not removed from it till God remove the candlestick and the Church cease to be a visible Church; but the exercise may be wanting and the Church a true visible Church, from which we are not to separate. 4th. Discipline is a necessary note and inseparable from a visible Church, whole, entire and not lame and imperfect. But a Church may retain the essence and being of a visible Church, and yet have no discipline in actual use, or little; and though want of discipline do leaven a Church, yet it does not (as Robinson says) evert the nature thereof and turn it into Babylon and a den of dragons. Robinson will have profaneness and impiety, by absolute necessity, rooted out by discipline; but he is too hasty. Nay, not by public preaching of a sent pastor through absolute [necessity], but only through ordinary and conditional necessity. You bind the Almighty too hard.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), ch. 9, section 9, pp. 287-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>You are pleased, dear sir, very kindly to ask me, whether I could sign the Westminster Confession of Faith, and submit to the presbyterian form of government; and to offer to use your influence to procure a call for me to some congregation in Scotland. I should be very ungrateful if I were not thankful for such kindness and friendship. As to my subscribing to the substance of the Westminster Confession, there would be no difficulty; and as to the presbyterian government, I have long been perfectly out of conceit of our unsettled, independent, confused way of church government in this land, and the presbyterian way has ever appeared to me most agreeable to the word of God, and the reason and nature of things; though I cannot say that I think that the presbyterian government of the Church of Scotland is so perfect, that it cannot, in some respects, be mended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>From a letter from Edwards to John Erskine in Scotland. ‘Memoir of Edwards’, prefixed to the London edition of his Works</cite>, p. 163 Edwards was an early-1700’s, New England congregationalist</span></figcaption>

<blockquote><p>2. I grant the whole, and yet nothing is concluded against us. For the power of the keys is not given to the catholic presbytery as to the first subject, to be a mean of edification in an ordinary and constant way; but only in an extraordinary and occasional way, in those things which concern the power of jurisdiction belonging to the whole catholic Church. By ‘extraordinary’ here, I mean not that which is against a particular law of God, and cannot be done without a divine dispensation of providence, but by ‘extraordinary’ I mean that which is raro contingens, and does not oft fall out; as almost it never falls out that the universal Church has need to excommunicate a national Church, for all and every one of a national Church do never fall away from the faith. Yet a remote power for excommunication is in the catholic visible Church.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-991e1ee8e5" data-kw="">
<blockquote><p>And not to urge thee [Calvin] more on these matters, this finally I would wish thee to consider with thyself in the spirit of peace: If when anyone is justified, he is always, even according to thine opinion, sanctified also, what sin is there in establishing some word whereby we may explain both, and generally all the benefits which in that moment are conferred on the sinner by God? If we wish to teach anyone what he receives from God when his sins are forgiven, or when he is admitted to divine grace, wilt thou not suffer us to say, nor to teach him, the benefits which he acquires in his justification? What term shall we use to embrace all these things in one word more conveniently than this one, which is so common in Scripture, and draws its etymology from those words by which absolution from sins and reconciliation with God, and his friendship and adoption, and the performing of works of justice, is designated?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-de-vega.html">Andreas de Vega</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, bk. 15, On Justification, ch. 5, toward the end, p. 683 in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), bk. 2, ch. 4, pp. 149-51 Vega (d. 1560) was a Spanish Franciscan theologian, and is addressing Calvin.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

ld-justification/#:~:text=And%20not%20to%20urge%20thee%20%5BCalvin,of%20works%20of%20justice%2C%20is%20designated&amp;text=And%20not%20to%20urge%20thee%20%5BCalvin%5D%20more%20on&amp;text=the%20performing%20of%20works%20of%20justice%2C%20is%20designated" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1b35431909" data-kw="">
<blockquote><p>22. This new obedience of ours, by which, so far as lies in us, we henceforth conduct ourselves in conformity to the divine law—since it is required by God himself and performed by us—according to its degree and measure is also called our righteousness; by which also, formally, inherently, habitually, or from works, we (according to our measure) are even truly said to be righteous before God, inasmuch as on its account we are regarded by God himself as righteous in part. And with respect to it, in the divine forum, we may in some way be justified (if there were need of it). (Lk. 1:6; Isa. 38:3; 1 Thess. 5:23)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bradshaw.html">William Bradshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertation on the Doctrine of Justification</cite>, (d. 1618; Leiden, 1684), trans. ChatGPT-5, ch. 24, ‘Of the Effects of Justification’; sect. 22, p. 112</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-3ce3b4ac53" data-kw="">
<blockquote><p>[On Rom. 5:17, 19] And here some one may enquire what this gift of justice is which flows to us from Christ our head?… Of this gift the apostle thus speaks; ‘For if by the offence of one man, etc.’ by which words St. Paul declares that, through the merit and good work of the second Adam, many receive the gift of justice and life, as through the sin of the first Adam his posterity had contracted hurt and death. But what other thing could this gift have been but the gift of the Holy Ghost, who should bring both justice and life to those who are endowed with Him.</p></blockquote>

</figure><figure class="quote" id="q-f455066f86" data-kw="">
<blockquote><p>26. Therefore, every true Christian who has actually returned into the grace of God, being now constituted in a state of grace, has a twofold righteousness—not acquired by his own free will or the powers of nature, but given to him by God through Christ—and both are necessary for his salvation: one imputed, the other inherent. The imputed is that which Christ has performed for him, to satisfy for all sins committed by him throughout his whole life; the inherent is that by which, through divine grace in Christ, he begins inwardly more and more to cease from sins to be committed hereafter, and strives most diligently to observe the divine law exactly. For by that imputed righteousness of Christ he is not freed from the keeping of the law, but rather bound to it more closely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bradshaw.html">William Bradshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertation on the Doctrine of Justification</cite>, (d. 1618; Leiden, 1684), trans. ChatGPT-5, ch. 24, ‘Of the Effects of Justification’; sect. 26, pp. 114-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

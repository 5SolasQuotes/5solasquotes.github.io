<blockquote><p>7. A particular Church of any one denomination may fail in some points of doctrine and manners and yet continue a living member of the true Church, if it fail not in fundamentals, and things simply necessary to salvation… …a Church is not presently to be forsaken by particular members thereof for some foul blemishes, nor many wicked men therein…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

— John Reading, A Guide to the Holy City, or, Directions &amp; Helps to an Holy Life containing Rules of Religious Advice… (Oxford: Robinson, 1651), ch. 7, p. 53">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C7.+A+particular+Church+of+any+one+denomination+may+fail+in+some+points+of+doctrine+and+manners+and+yet+continue+a+living+member+of+the+true+Church%2C+if+it+fail+not+in+fundamentals%2C+and+things+simply+necessary+to+salvation%E2%80%A6+%E2%80%A6a+Church+is+not+presently+to+be+forsaken+by+particular+members+thereof+for+some+foul+blemishes%2C+nor+many+wicked+men+therein%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+John+Reading%2C+A+Guide+to+the+Holy+City%2C+or%2C+Directions+%26+Helps+to+an+Holy+Life+containing+Rules+of+Religious+Advice%E2%80%A6+%28Oxford%3A+Robinson%2C+1651%29%2C+ch.+7%2C+p.+53&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F73841483a0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/73841483a0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=7.%20A%20particular%20Church%20of%20any,blemishes%2C%20nor%20many%20wicked%20men%20therein&amp;text=7.%20A%20particular%20Church%20of%20any%20one%20denomination&amp;text=some%20foul%20blemishes%2C%20nor%20many%20wicked%20men%20therein" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-16892bad42" data-kw="">
<blockquote><p>There is also a great difference between toleration and accommodation. By accommodation I understand an agreement of dissenters with the rest of the Church in practical conclusions, so that if any difference be, it is in their principles, not in their practices, and so not obvious, apparent and scandalous to people. I had rather go two miles in an accommodation (yea as many as the word of God will suffer me) than one mile in toleration. For in that way there is no schism, no rent in Israel, but ‘the Lord one, and his name one.’ In this way [of toleration] there is temple against temple, and altar against altar, Manasseh against Ephraim, and Ephraim against Manasseh, and they both against Judah: a misery from which the Lord deliver us. I do not deny, but if a safe and happy accommodation is impossible, such a toleration as I have formerly spoken of, is not to be disallowed. But the accommodation is a more excellent way, and that which is to be rather embraced, yea endeavored for and followed after, according to the apostle’s rule (which Isidorua Pelusiota did long since observe to be the best and happiest way of putting an end to divisions and dissensions in the Church). Let us therefore as many as be perfect be thus minded: and if in anything ye be otherwise minded, God shall reveal even this unto you. Nevertheless whereto we have already attained, let us walk by the same rule, let us mind the same thing (Phil 3:15-16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wholesome Severity Reconciled with Christian Liberty (London, 1645) This was printed anonymously.</cite></span></figcaption>

<blockquote><p>the constant and earnest wish of all good men for these hundred years past… that the Protestant Churches which differ one from another about some points of religion, laying aside or at least moderating on both sides their over-tenacious adhering to their own opinions, may now at length be united and made up into one body… we [the reformed and Lutherans] are not at variance about any fundamental point of Christian religion, or such wherein men may not safely be of either opinion without hazarding their salvation… we make no doubt but every man would then readily wish for this much-desired communion, which none ever shunned or refused but out of a kind of religion and conscience, conceiving it unlawful to entertain a communion with any that are not of the same belief and opinion with themselves: so soon as men on both sides shall be wrought off from this superstitious conceit, they will gladly run and rush (as it were) into one another’s arms and embraces… how foul and scandalous a thing, how hurtful to both sides, how dangerous and pernicious to the whole Christian world this Schism is which has hitherto divided and distracted us… seeing we confess that whatsoever is of necessity for salvation to be believed or done by us, it is all clearly and plainly laid down in this Gospel, what hinders why we may not jointly confirm and ratify those articles wherein we both agree? and for those other points about which we differ, we may express them in such words and phrases as the sacred Scriptures afford us…</p></blockquote>

</figure><figure class="quote" id="q-7f4649e9c9" data-kw="">
<blockquote><p>During his formative years, while studying at Herborn and Heidelberg, Comenius came under the influence of teachers who strengthened his ecumenical predisposition. This is particularly true of the period of study at Heidelberg, where he became acquainted with David Pareus, whose house, ‘Pareanum’, served as the center for those who worked for Protestant union. Two years after his return to his native land, Comenius was ordained priest of the Unity, and became pastor at Fulnek in Moravia. But with the outbreak of the Thirty Years War, Fulnek fell a prey to the fury of the Imperial armies. Comenius was compelled to take refuge on the Bohemian estates of one of the most important members of the Unity, Count Charles of Zerotin… There he wrote his celebrated Labyrinth of the World, a book in which the ecumenical theme found expression in condemnation of the fanaticism and bigotry of the confessional groups…” – Martin Schmidt in A History of the Ecumnical Movement, vol. 1, p. 89 Various – Good Counsels for the Peace of Reformed Churches by some reverend &amp; learned Bishops &amp; other Divines (Oxford: 1641) 150 pp. ToC King James I, To Cardinal Perron Richard Hooker, Answer to Travers Edwin Sandys, View of the State of Religion in the Western World John Davenent, Opinion of Thomas Morton, On the Peace of the Church Joseph Hall Opinion of To John Dury James Ussher Opinion of Sermon before King James Some French Reformed Divines, Opinion of Dury, John A Summary Discourse Concerning the Work of Peace-Ecclesiastical, how it may Concur with the Aim of a Civil Confederation Amongst Protestants (Cambrdige, 1641) 50 pp. A Motion Tending to the Public Good of this Age &amp; of Posterity, or, The Copies of Certain Letters Written by Mr. John Dury to a Worthy Knight at his Earnest Desire, Showing Briefly what a Public Good is &amp; how by the best Means of Reformation in learning &amp; religion it may be Advanced to Some Perfection (1642) 50 pp. Giles Firmin – Separation Examined: or a Treatise wherein the Grounds for Separation from the Ministry &amp; Churches of England are weighed and found too light… Also an humble request presented to the congregational divines, that since the differences between them and the classical [presbyterial]-divines are very small, they would please to strike in with the classical-divines in carrying on the work of reformation… (London: R.I., 1652) 111 pp. Firmin (1614–1697) was a puritan English minister who appeared to lean congregationalist, but could submit to episcopacy and presbyterianism. He actively promoted Baxter’s model of persons of different persuasions in Church government uniting in a consensus practice (as Phil. 3:15-16 says Christians ought to do). Firmin was ejected in the Great Ejection of 1662. Baxter, Richard Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653) 145 pp. ToC See the second part of this, ‘An Explication of some Passages in the foregoing Propositions.. with an Answer to some Objections’ at EEBO. For background to Baxter’s paradigmatic and influential association of moderates of the differing parties for the sake of the Gospel and pastoral work (during a political and ecclesiastical vacuum), and the other similar associations which were modeled after it, see Tim Cooper, When Christians Disagree: Lessons from the Fractured Relationship of John Owen and Richard Baxter (Crossway, 2024), pp. 23, 91-92, 104. For the creedal Profession and 20 Propositions of the discipline of the Association, typed out, see below. See also ‘A Brief Explication of Some Passages in the Profession’. ‘An Explication of Some Passages in the Propositions’ gives a lot more of the philosophy of the whole. Cooper: “England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-amos-comenius.html">John Amos Comenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Labyrinth of the World &amp; the Paradise of the Heart ed. and tr. Count Lutzow (1623; Dent, 1905) 306 pp.</cite>, p. 23</span></figcaption>

<div class="actions"><button class="copy" data-copy="“During his formative years, while studying at Herborn and Heidelberg, Comenius came under the influence of teachers who strengthened his ecumenical predisposition. This is particularly true of the period of study at Heidelberg, where he became acquainted with David Pareus, whose house, ‘Pareanum’, served as the center for those who worked for Protestant union. Two years after his return to his native land, Comenius was ordained priest of the Unity, and became pastor at Fulnek in Moravia. But with the outbreak of the Thirty Years War, Fulnek fell a prey to the fury of the Imperial armies. Comenius was compelled to take refuge on the Bohemian estates of one of the most important members of the Unity, Count Charles of Zerotin… There he wrote his celebrated Labyrinth of the World, a book in which the ecumenical theme found expression in condemnation of the fanaticism and bigotry of the confessional groups…” – Martin Schmidt in A History of the Ecumnical Movement, vol. 1, p. 89 Various – Good Counsels for the Peace of Reformed Churches by some reverend &amp; learned Bishops &amp; other Divines (Oxford: 1641) 150 pp. ToC King James I, To Cardinal Perron Richard Hooker, Answer to Travers Edwin Sandys, View of the State of Religion in the Western World John Davenent, Opinion of Thomas Morton, On the Peace of the Church Joseph Hall Opinion of To John Dury James Ussher Opinion of Sermon before King James Some French Reformed Divines, Opinion of Dury, John A Summary Discourse Concerning the Work of Peace-Ecclesiastical, how it may Concur with the Aim of a Civil Confederation Amongst Protestants (Cambrdige, 1641) 50 pp. A Motion Tending to the Public Good of this Age &amp; of Posterity, or, The Copies of Certain Letters Written by Mr. John Dury to a Worthy Knight at his Earnest Desire, Showing Briefly what a Public Good is &amp; how by the best Means of Reformation in learning &amp; religion it may be Advanced to Some Perfection (1642) 50 pp. Giles Firmin – Separation Examined: or a Treatise wherein the Grounds for Separation from the Ministry &amp; Churches of England are weighed and found too light… Also an humble request presented to the congregational divines, that since the differences between them and the classical [presbyterial]-divines are very small, they would please to strike in with the classical-divines in carrying on the work of reformation… (London: R.I., 1652) 111 pp. Firmin (1614–1697) was a puritan English minister who appeared to lean congregationalist, but could submit to episcopacy and presbyterianism. He actively promoted Baxter’s model of persons of different persuasions in Church government uniting in a consensus practice (as Phil. 3:15-16 says Christians ought to do). Firmin was ejected in the Great Ejection of 1662. Baxter, Richard Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653) 145 pp. ToC See the second part of this, ‘An Explication of some Passages in the foregoing Propositions.. with an Answer to some Objections’ at EEBO. For background to Baxter’s paradigmatic and influential association of moderates of the differing parties for the sake of the Gospel and pastoral work (during a political and ecclesiastical vacuum), and the other similar associations which were modeled after it, see Tim Cooper, When Christians Disagree: Lessons from the Fractured Relationship of John Owen and Richard Baxter (Crossway, 2024), pp. 23, 91-92, 104. For the creedal Profession and 20 Propositions of the discipline of the Association, typed out, see below. See also ‘A Brief Explication of Some Passages in the Profession’. ‘An Explication of Some Passages in the Propositions’ gives a lot more of the philosophy of the whole. Cooper: “England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.”

is+Age+%26+of+Posterity%2C+or%2C+The+Copies+of+Certain+Letters+Written+by+Mr.+John+Dury+to+a+Worthy+Knight+at+his+Earnest+Desire%2C+Showing+Briefly+what+a+Public+Good+is+%26+how+by+the+best+Means+of+Reformation+in+learning+%26+religion+it+may+be+Advanced+to+Some+Perfection+%281642%29+50+pp.+Giles+Firmin+%E2%80%93+Separation+Examined%3A+or+a+Treatise+wherein+the+Grounds+for+Separation+from+the+Ministry+%26+Churches+of+England+are+weighed+and+found+too+light%E2%80%A6+Also+an+humble+request+presented+to+the+congregational+divines%2C+that+since+the+differences+between+them+and+the+classical+%5Bpresbyterial%5D-divines+are+very+small%2C+they+would+please+to+strike+in+with+the+classical-divines+in+carrying+on+the+work+of+reformation%E2%80%A6+%28London%3A+R.I.%2C+1652%29+111+pp.+Firmin+%281614%E2%80%931697%29+was+a+puritan+English+minister+who+appeared+to+lean+congregationalist%2C+but+could+submit+to+episcopacy+and+presbyterianism.+He+actively+promoted+Baxter%E2%80%99s+model+of+persons+of+different+persuasions+in+Church+government+uniting+in+a+consensus+practice+%28as+Phil.+3%3A15-16+says+Christians+ought+to+do%29.+Firmin+was+ejected+in+the+Great+Ejection+of+1662.+Baxter%2C+Richard+Christian+Concord%2C+or+the+Agreement+of+the+Associated+Pastors+%26+Churches+of+Worcestershire%2C+with+Richard+Baxter%E2%80%99s+Explication+%26+Defence+of+it%2C+%26+his+Exhortation+to+Unity+%28London%3A+A.M.%2C+1653%29+145+pp.+ToC+See+the+second+part+of+this%2C+%E2%80%98An+Explication+of+some+Passages+in+the+foregoing+Propositions..+with+an+Answer+to+some+Objections%E2%80%99+at+EEBO.+For+background+to+Baxter%E2%80%99s+paradigmatic+and+influential+association+of+moderates+of+the+differing+parties+for+the+sake+of+the+Gospel+and+pastoral+work+%28during+a+political+and+ecclesiastical+vacuum%29%2C+and+the+other+similar+associations+which+were+modeled+after+it%2C+see+Tim+Cooper%2C+When+Christians+Disagree%3A+Lessons+from+the+Fractured+Relationship+of+John+Owen+and+Richard+Baxter+%28Crossway%2C+2024%29%2C+pp.+23%2C+91-92%2C+104.+For+the+creedal+Profession+and+20+Propositions+of+the+discipline+of+the+Association%2C+typed+out%2C+see+below.+See+also+%E2%80%98A+Brief+Explication+of+Some+Passages+in+the+Profession%E2%80%99.+%E2%80%98An+Explication+of+Some+Passages+in+the+Propositions%E2%80%99+gives+a+lot+more+of+the+philosophy+of+the+whole.+Cooper%3A+%E2%80%9CEngland+had+a+divided+church.+Even+among+puritans%2C+fault+lines+had+visibly+widened+under+the+pressure+of+the+civil+war+and+its+aftermath.+After+his+own+traumatic+experience+of+the+war%2C+Baxter+longed+for+order+and+peace%2C+and+he+developed+a+lifelong+yearning+to+bring+Christians+together+in+unity.+He+identified+four+main+parties+within+the+English+church+%28Congregationalists%2C+Episcopalians%2C+Erastians%2C+and+Presbyterians%29%2C+but+he+felt+that+the+moderates+within+each+party+held+similar+views+and%2C+more+importantly%2C+could+work+together+in+practice+even+if+their+principles+varied.+He+believed+that+if+England%E2%80%99s+ministers+simply+got+on+with+the+work+of+ministry%2C+they+would+be+too+busy+to+notice+how+their+differing+doctrines+of+church+government+might+otherwise+keep+them+apart.+So+he+formed+the+Worcestershire+Association%2C+a+network+open+to+local+parish+ministers+of+all+stripes+who+met+monthly+for+the+purpose+of+mutual+edification+and+encouragement.+In+1653+they+published+their+agreement+to+work+together%2C+and+similar+ministerial+associations+sprang+up+in+other+counties.%E2%80%9D%0A%0A%E2%80%94+John+Amos+Comenius%2C+The+Labyrinth+of+the+World+%26+the+Paradise+of+the+Heart+ed.+and+tr.+Count+Lutzow+%281623%3B+Dent%2C+1905%29+306+pp.%2C+p.+23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7f4649e9c9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7f4649e9c9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=During%20his%20formative%20years%2C%20while%20studying,associations%20sprang%20up%20in%20other%20counties&amp;text=During%20his%20formative%20years%2C%20while%20studying%20at%20Herborn&amp;text=similar%20ministerial%20associations%20sprang%20up%20in%20other%20counties" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>On the Reformed side, the concept of fundamental articles appears as early as 1593 in the irenic or ecumenical theology of Francis Junius–as a response to the question of agreement between the Reformed side and the Lutherans despite significant theological differences: Junius argued that the ‘fundamentals’ or ‘fundamental articles’ are those teachings without which the Christian faith cannot be present–among which is the doctrine of God, the immutable object of faith. (Eirenicum, I, Opuscula, p. 440)</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ab89a2523d" data-kw="">
<blockquote><p>Those who so cry up the Spirit as to cry down ordinances and the ministry do not have the Spirit of God. In the NT, when vision and inspiration were in use, the Spirit did not teach men immediately, but referred them to an outward ministry. A famous instance you have hereof in the Ethiopian eunuch who, reading in his chariot the prophecy of Isaiah, the Spirit did not interpret to him the meaning hereof but bid Philip go and expound it. So, when Christ revealed himself to Paul, He did not teach him Himself, but bid him go to Damascus and there it should be told him what he should do. We have the like example in Cornelius. The Spirit did not teach him immediate, but bid him send for Peter, and he should tell him what he ought to do. By these examples we see how the Lord has honored the ministry. And, therefore, those who cry up the Spirit so as to cry down the ministry, as expecting to have the immediate teaching of the Spirit, doubtless have not the Spirit of God. . . . Those who pretend to the Spirit, and yet boast of the effects of the Spirit, in future revelations rather than in present motions to holy duties, are deceived by a satanic delusion. There are many in these days who will take upon them to tell you future contingent events, but this can be nothing else but a delusion of the devil, because the gifts of the Spirit in foretelling future events is now ceased and does not remain the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The works of Christoper Love, 1, 115-116. (HT: Rich Barcellos)</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-27c6a17e75" data-kw="">
<blockquote><p>XVII… 1. All necessary good things should be sought not from any creature, but from God the Father and the Lord Jesus Christ, without separating the Holy Spirit from them. If someone objects that the invocation of the Holy Spirit is not mentioned here [in Col. 1:2] by Paul, I respond: the religious invocation of the Holy Spirit should be equally due, as it is to the Father and the Son. 1. Because it is the commandment of God: “You shall worship the Lord your God and Him only shall you serve.” And the Holy Spirit is God. 2. Because we have examples of the holy servants of God who invoked the Holy Spirit, such as John in Revelation 1:4, where he says, “Grace to you and peace from Him who is and who was and who is to come, and from the seven Spirits who are before His throne,” which refers to the Holy Spirit. For by these seven Spirits, we should not understand created spirits, for they are the eyes and horns of the Lamb (Revelation 5:6). Therefore, they are of the same essence as the Lamb and therefore uncreated. Since they are uncreated, they are the Holy Spirit. The holy prophets say that the one and the same Spirit is divided into seven spirits. Therefore, it is clear that the Holy Spirit was invoked by the Apostle John, and the same practice was continued by the Apostolic Church, as Justin Martyr testifies in his Second Apology to Emperor Antoninus Pius. “We worship and adore the prophetic Spirit, honoring Him with reason and truth.” It is evident, therefore, that all good things we need should be sought from God the Father, Son, and Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1 (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</cite></span></figcaption>

</figure><figure class="quote" id="q-e039eac94b" data-kw="">
<blockquote><p>This righteousness then, which God communicates to man, and accepts alone, and owns as righteousness, has been revealed, he says, without the law, that is, without the aid of the law; and the law is to be understood as meaning works; for it is not proper to refer this to its teaching, which he immediately adduces as bearing witness to the gratuitous righteousness of faith. Some confine it to ceremonies; but this view I shall presently show to be unsound and frigid. We ought then to know, that the merits of works are excluded. We also see that he blends not works with the mercy of God; but having taken away and wholly removed all confidence in works, he sets up mercy alone. It is not unknown to me, that Augustine gives a different explanation; for he thinks that the righteousness of God is the grace of regeneration; and this grace he allows to be free, because God renews us, when unworthy, by his Spirit; and from this he excludes the works of the law, that is, those works, by which men of themselves endeavour, without renovation, to render God indebted to them. (Deum promereri—to oblige God.) I also well know, that some new speculators proudly adduce this sentiment, as though it were at this day revealed to them. But that the Apostle includes all works without exception, even those which the Lord produces in his own people, is evident from the context.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Epistle of Paul the Apostle to the Romans, trans. John Owen (Bellingham, WA: Logos Bible Software, 2010), 134.</cite></span></figcaption>

</figure><figure class="quote" id="q-67d7d97470" data-kw="">
<blockquote><p>It is the special office of the Spirit to convince the world of sin; to reveal Christ, to regenerate the soul, to lead men to the exercise of faith and repentance; to dwell in those whom He thus renews, as a principle of a new and divine life. By this indwelling of the Spirit, believers are united to Christ, and to one another, so that they form one body. This is the foundation of the communion of saints, making them one in faith, one in love, one in their inward life, and one in their hopes and final destiny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, pt. 1, ch. 8, “The Holy Spirit”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

</figure><figure class="quote" id="q-82dcf6a70a" data-kw="Spirit personality agent">
<blockquote><p>He is an intelligent, voluntary, divine agent; he knoweth, he worketh as he will: which things, if, in their frequent repetition, they are not sufficient to evince an intelligent agent, a personal subsistence, that hath being, life, and will, we must confess that the Scripture was written on purpose to lead us into mistakes and misapprehensions of what we are, under penalty of eternal ruin, rightly to apprehend and believe.</p></blockquote>

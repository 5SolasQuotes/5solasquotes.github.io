<blockquote><p>25. They that say conformists convert no souls take on them to know that of thousands which they know not: and forget that before 1640 there were few but conformists to convert them in the land, and that all the Westminster Assembly, save eight, were such.† And that the parliament kept near 7,000 in the ministry that all conformed on Aug. 24, 1662.²</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b5b9c684e5" data-kw="">
<blockquote><p>9. Whether any constitutions may be tolerated in the church which in their nature indeed are not impious, but do not, nevertheless, tend to edification? I answer that if those constitutions which the queen’s majesty wishes to impose upon you are free from any impiety, they are rather to be tolerated than that the churches should be deserted. For if the edifying of the church is the chief thing to be regarded in this matter, we shall do the church a greater injury by deserting it than by wearing the habits [garments]. And where there is no impiety, and the conscience is not wounded, it is proper to submit, even if some degree of bondage be imposed. In the meantime, however, it might be demanded on the other hand, whether the imposition of the habits, as far as it tends to decency and order, may justly come under the denomination of bondage? … 11, 12. The last two questions come more closely to the point. Whether it is more expedient thus to obey the church, or on account of disobedience to be cast out of the ministry? And, whether good pastors may lawfully be removed from the ministry on account of their non-compliance with such ceremonies? I answer, if in these ceremonies there is no superstition, no impiety, but yet they are imposed upon godly pastors, who would rather that they should not be imposed upon them, I will certainly allow, and that most fully, that a burden and bondage is imposed upon them; but I will not allow, and this for most just reasons, that their station or ministry is on that account to be deserted and place given to wolves, as was before observed, or to ministers less qualified than themselves: especially, since there remains the liberty of preaching, and care may be taken that no greater bondage shall be imposed; with many other things of this kind, etc.</p></blockquote>

</figure><figure class="quote" id="q-98709b5b6d" data-kw="">
<blockquote><p>That the Word and sacraments are not administered rightly and exactly, secundum [in Latin], as altogether agreeing with the prescript of the Lord, no not in all the world; yet albeit they be not administred according to that exact rule, and by reason of our frailty cannot be suddenly reformed, yet may they be so performed that they may be pleasing unto God and healthfull to the Church, yet so as the defect should be lamented and acknowledged; which point if it be not granted, there will be no pure or true Church in all the world; Zachary Ursinus, Catechism, pt. 2, to question 84, fol. 620. That albeit many evil things do go along and be done, yet these things are done by such as hinder reformation, and by the disobedient; not by such as wish and sue for amendment: For ‘blessed are they who hunger and thirst after righteousness,’ Mt. 5:6, (that is) which do desire good things to be done in the Church, which if they be not done it is not their fault: they may in that case retain a good conscience; Ursinus, ibid., fol. 618.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘Reformed Practices’, pp. 119-20</span></figcaption>

2C%20fol.%20618&amp;text=That%20the%20Word%20and%20sacraments%20are%20not%20administered&amp;text=retain%20a%20good%20conscience%3B%20Ursinus%2C%20ibid.%2C%20fol.%20618" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>In the beginning of the blessed Reformation, our wise and pious ancestors took care to set forth an order for redress of many things, which they then, by the Word, discovered to be vain erroneous, superstitious, and idolatrous, in the public worship of God. This occasioned many godly and learned men to rejoice much in the Book of Common Prayer, at that time set forth… Howbeit, long and sad experience hath made it manifest, that the Liturgy used in the Church of England, (notwithstanding all the pains and religious intentions of the compilers of it) hath proved an offence, not only to many of the godly at home, but also to the reformed Churches abroad. For, not to speak of urging the reading of all the prayers, which very greatly increased the burden of it, the many unprofitable and burdensome ceremonies contained in it have occasioned much mischief, as well by disquieting the consciences of many godly ministers and people, who could not yield unto them… …the [Anglican] Liturgy hath been a great means, as on the one hand to make and increase an idle and unedifying ministry… so, on the other side, it hath been (and ever would be, if continued) a matter of endless strife and contention in the Church… especially in these latter times, wherein God vouchsafeth to his people more and better means for the discovery of error and superstition…</p></blockquote>

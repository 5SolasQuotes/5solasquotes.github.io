<blockquote><p>This is a received maxim also: Quod tangit omnes, ab omnibus, suo more, tractari debet. ‘What concerns all, should be agitated by all, according to their degrees of concernment’; but excommunication of a person, in a consociated Church, concerns all the consociated Churches in a presbytery: all are scandalized; all may be, and are in danger to be leavened with the infectious lump.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 1, ch. 10, section 10</cite>, p. 303</span></figcaption>

<blockquote><p>§29 The Decalogue has been prescribed for all people to the extent that it agrees with and explains the common law of nature for all peoples. It has also been renewed and confirmed by Christ our king. Jerome Zanchius says that this is the common judgement of theologians (De Redemptione, I, 10, 1 [actually thesis 1 of the second section (“De legibus humanis“) of Chapter 10].)… §30 Proper law (lex propia) is the law that is drawn up and established by the magistrate on the basis of common law (lex communis) and according to the nature, utility, condition, and other special circumstances of his country. It indicates the peculiar way, means, and manner by which this natural equity among men can be upheld, observed, and cultivated in any given commonwealth. Therefore, proper law (jus proprium) is nothing other than the practice of this common natural law (jus naturale) as adapted to a particular polity. It indicates how individual citizens of a given commonwealth are able to seek and attain this natural equity. Whence it is called the servant and handmaiden of common law (jus commune), and a teacher leading us to the observance of common law. §31 Proper law is established for two principal reasons, as Zanchius says [De Redemptione, I, 11, 1]. The first reason is that not all men have sufficient natural capacity that they are able to draw from these general principles of common law the particular conclusions and laws suitable to the nature and condition of an activity and its circumstances. The second reason is that natural law is not so completely written on the hearts of men that it is sufficiently efficacious in restraining men from evil and impelling them to good… In this sense, it is said that “law is set forth not for the just, but the unjust.” (1 Tim. 1:9) §32 There are two parts of this [proper] law. The first is its agreement with common law, and the second is its difference, as Francis Junius observes (De Politicae Mosis Observatione) and the jurists teach (In commentaries on the Digest I, 1, 4)… Its agreement (convenientia) with common law is in those matters common to each law, namely, in the starting point from which analogical deductions are made, in the subject under consideration, and in the purpose… The purpose of each [common and proper law] is justice and piety, or sanctity, and the same equity and common good in human society. Its difference (discrepantia) from common law arises from the fact that, in accommodation to particular and special circumstances, it departs somewhat from common law, adding or subtracting something from it. Proper law differs for two reasons, each of which provides a necessity for adding or subtracting something from common law. And so mutability, or the possibility and necessity of just changes, is introduced… Since the nature and condition of these circumstances may be diverse, inconstant, and changeable, it is not possible for proper law to acknowledge one and the same disposition of common law for everything and in everything, as Junius and Zanchius, together with the jurists, say. Therefore, this law is rightly said to be mutable or subject to change with respect to circumstances and its consequent difference from common law. But it is altogether immutable with respect to its agreement with common law. So the jurists assert together with Junius, Zanchius, Martyr, and Bucer. Thus common or moral law concludes from its principles that evildoers ought to be punished, but proposes nothing concerning the punishment. Proper law determines specifically that adulterers, murderers, and the like are to be punished by death, unless the punishment should be mitigated because of further circumstances. Various punishments, for example, exist in the Mosaic Law for these crimes… For this reason, the moral precepts of the Decalogue, having no certain, special, and fixed punishment attached to them, are general. The forensic and political law then makes specific determinations, which it relates to the circumstances of any act. §34 This proper law is one thing among the Jews, another among the Romans, another among the Germans today, and still another among other peoples… §35 Jewish proper law is twofold. It is in part ceremonial, and in part forensic or judicial… §37 The forensic [judicial] law was the means by which the Jews were informed and instructed to observe and obey both Tables, or the common law, for the cultivation of human society among them in their polity, according to the circumstances of things, persons, place, and time… §40 It should be observed that often one and the same law of the Jews could be said in varying respects to be moral (or common), ceremonial, and forensic, and to this extent mixed. What is moral in such a law is perpetual; what is judicial can be changed by the change of circumstances… … Ch. 22, §3 From these things it follows that the magistrate is obligated in the administration of the commonwealth to the proper law of Moses so far as moral equity or common law are expressed therein. This is to say, he is required to conform to everything therein that is in harmony with common law. But he is by no means required to conform in those things in which the proper law of Moses, in order to be accommodated to the polity of the Jews, differs from common law. §4 For if the magistrate should establish as absolutely necessary these proper Jewish laws, which by their nature are either changeable or obsolete, he would destroy christian liberty, which has been given for edification to him and to others, and would entangle himself and others in the yoke of slavery. Thereby he would make a necessity of something free, and impede consciences by a grievous and dangerous snare. He would obtrude mortal laws, which were promulgated in former times only for the Jewish people and are by their nature subject to change for a variety of reasons, as if they were immortal. And unless proper laws are changed with the changing circumstances because of which they broadly exist, they become wicked and attain neither to the equity of the Second Table of the Decalogue nor the piety of the First. Thus they cease to contain the common foundation of right reason. Accordingly, the magistrate who makes the proper law of Moses compulsory in his commonwealth sins grievously. For those particular circumstances and considerations because of which the Jewish proper law was promulgated should bear no weight in his commonwealth…</p></blockquote>

<blockquote><p>…the position which this gentleman undertakes to establish is, ‘that appeals and complaints cannot be constitutionally entertained in our church judicatories except in judicial cases;’… This doctrine, after all that he has said in its favour, we are more than ever persuaded is unconstitutional, mischievous, and in the highest degree unreasonable.</p></blockquote>

<blockquote><p>4. He [Parker] makes a distinction betwixt the case of appellation and the case de nulla administratione mala praesumpta. Though the particular eldership has proceeded aright, though it consist of able and sufficient men, and though it be in re propria [in a proper thing], yet if one think himself wronged, and so appeal, then is it made obnoxious to a higher consistory, for says Parker, as the Council of Sardis ordains, audience must not be denied to him who entreats for it. So says Zepperus, speaking of the same purpose: ‘cuivis integrum quoque sit ad superiores gradus provocare, si in inferioris gradus sententia aut decreto aliquid desideret.’ (de Pol. Eccl., bk. 3, ch. 2)</p></blockquote>

<blockquote><p>Whatever is committed against right reason, the same is committed against God and divine law (Rom. 2:12, 14–15), insofar as the law of God made known through nature is identical with the law which is published by a living voice or writing, for which reason the law of nature once obligated our first parents to obedience in the state of integrity.</p></blockquote>

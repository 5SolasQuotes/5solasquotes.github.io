<main class="wrap"><figure class="quote" id="q-8e1b9cd757" data-kw="">
<blockquote><p>The sum and whole cause of the writing of this epistle is to prove that a man is justified by faith only; which proposition whoso denieth, to him is not only this epistle and all that Paul writeth, but also the whole Scripture, so locked up, that he shall never understand it to his soul’s health…And by justifying understand no other thing than to be reconciled to God, and to be restored unto his favor, and to have thy sins forgiven thee. And when I say, God juistifieth us, understand thereby that God for Christ’s sake, merits, and deservings only, receiveth us unto His mercy, favour, and grace, and forgiveth us our sins. And when I say, Christ justifieth us, understand thereby that Christ only hath redeemed us, bought, and delivered us out of the wrath of God and damnation, and hath with his works only purchased us the mercy, the favor, and the grace of God, and the forgiveness of our sins. And when I say that faith justified, understand thereby that faith and trust in the truth God and in the mercy promised us for Christ’s sake, and for His deserving and works only, doth quiet the conscience and certify her that our sins be forgiven, and we in the favour of God. Furthermore we set before thine eyes Christ’s own works and thine own works. Christ’s works only justify thee and make satisfaction for thy sin, and not thine own works…For the promise of mercy is made thee for Christ’s work’s sake, and not for thine works’s sake…Finally, that we say, faith only justified, ought to offend no man. for if this be true, that Christ only redeemed us, Christ only bare our sins, make satisfaction for them and purchased us the favor of God; then it must it must needs be true that the trust only in Christ’s deservings and in the promises of God the Father, made to us for Christ’s sake, doth alone quiet the conscience and certify it that the sins are forgiven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Preface to Romans c. 1526 (Works, 1.508).</span></figcaption>

<blockquote><p>CANON 21. Concerning nature and grace. As the Apostle most truly says to those who would be justified by the law and have fallen from grace, “If justification were through the law, then Christ died to no purpose” (Gal. 2:21), so it is most truly declared to those who imagine that grace, which faith in Christ advocates and lays hold of, is nature: “If justification were through nature, then Christ died to no purpose.” Now there was indeed the law, but it did not justify, and there was indeed nature, but it did not justify. Not in vain did Christ therefore die, so that the law might be fulfilled by him who said, “I have come not to abolish them but to fulfill them” (Matt. 5:17), and that the nature which had been destroyed by Adam might be restored by him who said that he had come “to seek and to save the lost” (Luke 19:10).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/second-council-of-orange.html">Second Council of Orange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons And Decrees Of The Second Council Of Orange</cite>, (AD 529)</span></figcaption>

</figure><figure class="quote" id="q-12c8948707" data-kw="">
<blockquote><p>I remember that Staupitz used to say: “More than a thousand times I have vowed to God that I would improve, but I have never performed what I have vowed. Hereafter I shall not make such vows, because I know perfectly well that I shall not live up to them. Unless God is gracious and merciful to me for the sake of Christ and grants me a blessed final hour when the time comes for me to depart this miserable life, I shall not be able to stand before Him with all my vows and good works.” This despair is not only truthful but is godly and holy. Whoever wants to be saved must make this confession with his mouth and with his heart. The saints do not rely on their own righteousness; they sing with David (Ps. 143:2): “Enter not into judgment with Thy servant, for no man living is justified before Thee”; and (Ps. 130:3): “If Thou, O Lord, shouldst mark iniquities, Lord, who could stand?” Therefore they gaze at Christ, their Propitiator, who gave His life for their sins. And if there is any remnant of sin their flesh, they know that this is not imputed to them but is pardoned by forgiveness. Meanwhile they battle by the Spirit against the flesh. This does not mean that they do not feel its desires at all; it means that they do not gratify them. Even though they feel their flesh raging and rebelling against the Spirit and feel themselves falling into sins and living in them, they do not become downcast on that account or immediately suppose that their way of life, their social station, and the works they have done in accordance with their calling are displeasing to God. No, they fortify themselves with their faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 27: Lectures on Galatians, 1535, Chapters 5-6; 1519, Chapters 1-6, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 27 (Saint Louis: Concordia Publishing House, 1999), 73–74.</span></figcaption>

<blockquote><p>11. In this universe, even what is called evil, when it is rightly ordered and kept in its place, commends the good more eminently, since good things yield greater pleasure and praise when compared to the bad things. For the Omnipotent God, whom even the heathen acknowledge as the Supreme Power over all, would not allow any evil in his works, unless in his omnipotence and goodness, as the Supreme Good, he is able to bring forth good out of evil. What, after all, is anything we call evil except the privation of good? In animal bodies, for instance, sickness and wounds are nothing but the privation of health. When a cure is effected, the evils which were present (i.e., the sickness and the wounds) do not retreat and go elsewhere. Rather, they simply do not exist any more. For such evil is not a substance; the wound or the disease is a defect of the bodily substance which, as a substance, is good. Evil, then, is an accident, i.e., a privation of that good which is called health. Thus, whatever defects there are in a soul are privations of a natural good. When a cure takes place, they are not transferred elsewhere but, since they are no longer present in the state of health, they no longer exist at all.¹ ¹ This section (Chs. III and IV) is the most explicit statement of a major motif which pervades the whole of Augustinian metaphysics. We see it in his earliest writings, Soliloquies, 1, 2, and De ordine, II, 7… The good is positive, constructive, essential; evil is privative, destructive, parasitic on the good. It has its origin, not in nature, but in the will. Cf. Confessions, Bk. VII, Chs. III, V, XII-XVI; On Continence, 14-16; On the Gospel of John, Tractate XCVIII, 7; City of God, XI, 17; XII, 7-9.</p></blockquote>

<blockquote><p>IV. Whence also it [original sin] is natural in us, because it is in us and in our nature—not as it was created upright from the beginning by God (for “God has made man upright,” Eccl. 7:29, which rectitude of the whole workmanship rejects crookedness and distortion), but as it is depraved by the fault of the first principle from which we all naturally descend.</p></blockquote>

<blockquote><p>§38. The Form [of original sin] is the privation of original wisdom and justice (Ps. 143; Rom. 310, ff.), “There is none that understandeth, there is none that seeketh after God. They are all gone out of the way, they are together become unprofitable; there is none that doeth good, no, not one.” Verse 23, “For all have sinned, and come short of the glory of God;” add 1 Cor. 2:14; Eph. 4:18, with an adjoined proclivity to sensible and sensual things. Hence it is called the evil that dwells, inhabits and operates in us (Rom. 7:17, 20-21), and also the Flesh (Jn. 3, 6), the Old man (Eph. 4:22), the law of the members and the body of death (Rom. 7:18, 23-24). But those who here make mention of the positive, distinguish between the positive taken metaphysically or physically, and the positive taken ethically and logically. In the former sense, whatever is positive is being, and has the adjuncts and predicates of being. In the latter sense, the positive signifies the privation of a due habit inhering, but which infers an adjoined inclination to contrary habits, as a disease is not only the privation of health, the temper of the humors being removed and disturbed, but also brings in a vicious quality arisen from the badly disposed humors; and in the venereal plague and leprosy there is not only a privation of pure blood, but also its foul corruption. §39. Therefore, the Original Stain is not a substance, which [the Lutheran] Flacius asserted in the Disputation of Weimar with Victorinus Strigelius in A.D. 1561, which error he then repeated in his Writings. For: (1) Scripture distinguishes this stain from man himself, calling it in Rom. 7:17 “the evil that dwelleth in and adhereth” to us. But that which inhabits differs from its hospice, and that which adheres from that to which it adheres, for example, a garment from a man. (2) Every created substance is from God, and in that sense, good (Gen. 1:31; 1 Tim. 4:4). (3) because God creates man even after the fall, Job 10:8, “Thine hands have made me and fashioned me together round about;” also Ps. 139:14, which cannot be said of sin. (4) Because this error overturns the article of Faith concerning the Creation, concerning the Assumption of human Nature [by Christ], concerning Regeneration, Renovation, and Resurrection. §40. The effects are either moral or physical evils…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Schwartz, 1712), ch. 2, ‘On Original Sin’, p. 14 Latin</span></figcaption>

<blockquote><p>For as the sun cannot cause darkness, or cold in the air; so God cannot cause malice and wickedness in the human heart. This, however great it is in repelling the means of grace, is wholly to be imputed to man alone ; in no way to God.</p></blockquote>

</figure><figure class="quote" id="q-86e8b1fd52" data-kw="Permission Author of sin Holiness The Fall">
<blockquote><p>The almighty power, unsearchable wisdom, and infinite goodness of God, so far manifest themselves in His providence, that His determinate counsel extends itself even to the first fall, and all other sinful actions both of angels and men (Rom. 11:32–34; 2 Sam. 24:1; 1 Chron. 21:1); and that not by a bare permission, which also He most wisely and powerfully bounds, and otherwise orders and governs (2 Kings 19:28; Ps. 76:10), in a manifold dispensation to His most holy ends (Gen. 50:20; Isa. 10:6–7, 12); yet so, as the sinfulness of their acts proceeds only from the creatures, and not from God, who, being most holy and righteous, neither is nor can be the author or approver of sin (Ps. 50:21; 1 John 2:16).</p></blockquote>

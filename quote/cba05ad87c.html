<blockquote><p>The first of which (continuing this history with the end of the second chapter) in the 36 years from the passion of Christ, when the Church of the Jews being overthrown, Satan attempted to invade the Christian church gathered from the Gentiles, and to destroy part of her seed, Rev. 12:17. The thousandth year falls precisely on the times of that wicked Hildebrand, who was called Gregory the seventh, a most damnable necromancer and sorcerer, whom Satan used as an instrument when he was loosed out of bonds from then on to annoy the saints of God with most cruel persecutions and the whole world with dissentions, and most bloody wars: as Benno the Cardinal reports at large. This is the first victory gained over the dragon in the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Geneva Bible Notes</cite>, 1599, On Rev. 20:2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/second-coming.html">Second Coming</a></span></div>

<blockquote><p>Those who make it fully past, begin at four periods, 1. some at Christs birth, and end at Pope Sylvester II, a magician. 2. Some at His death, and end at Benedict III, suffocated by the devil. 3. Others, at the destruction of Jerusalem, and so end it in Gregory VII, or Hildebrand. 4. Most begin it at Constantine’s reign, making this contemporary with that of Satan’s being cast from heaven, ch. 12. This is also ended, anno 1300, in Boniface VIII, when the wars against the Waldenses began. [John] Prideaux, De mille annis Apoc. does thus sum those of that opinion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (Edinburgh: Higgins, 1658), ch. 20, Lecture 4, p. 723</span></figcaption>

</figure><figure class="quote" id="q-1b7202e610" data-kw="">
<blockquote><p>The Fifth Age is of the Church reverting, and Antichrist raging, until this present age when Reformation was aimed at and begun in the West, Antichristian pride was detected and the number of true believers did increase. Then Satan was let loose again, the thousand years of his binding, from the days of Constantine, being expired: then persecutions were frequent; Antichrist foamed and opened his mouth wide to devour the sheep of Jesus. But he who preserved the Woman in the wilderness is the stronger, so that the gates of Hell were not able nor shall be able to prevail against her; yea by the breath of his mouth and preaching of the Word her enemies are scattered, Antichrist is revealed and true Christians are multiplied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-petrie.html">Alexander Petrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Compendious History of the Catholic Church from the year 600 untill the year 1600, showing her Deformation &amp; Reformation: together with the rise, reign, rage, and begin-fall of the Roman Antichrist</cite>, ... (Hague: Adrian Vlack, 1657), Preface, p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/second-coming.html">Second Coming</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Fifth Age is of the Church reverting, and Antichrist raging, until this present age when Reformation was aimed at and begun in the West, Antichristian pride was detected and the number of true believers did increase. Then Satan was let loose again, the thousand years of his binding, from the days of Constantine, being expired: then persecutions were frequent; Antichrist foamed and opened his mouth wide to devour the sheep of Jesus. But he who preserved the Woman in the wilderness is the stronger, so that the gates of Hell were not able nor shall be able to prevail against her; yea by the breath of his mouth and preaching of the Word her enemies are scattered, Antichrist is revealed and true Christians are multiplied.”

— Alexander Petrie, A Compendious History of the Catholic Church from the year 600 untill the year 1600, showing her Deformation &amp; Reformation: together with the rise, reign, rage, and begin-fall of the Roman Antichrist... (Hague: Adrian Vlack, 1657), Preface, p. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Fifth+Age+is+of+the+Church+reverting%2C+and+Antichrist+raging%2C+until+this+present+age+when+Reformation+was+aimed+at+and+begun+in+the+West%2C+Antichristian+pride+was+detected+and+the+number+of+true+believers+did+increase.+Then+Satan+was+let+loose+again%2C+the+thousand+years+of+his+binding%2C+from+the+days+of+Constantine%2C+being+expired%3A+then+persecutions+were+frequent%3B+Antichrist+foamed+and+opened+his+mouth+wide+to+devour+the+sheep+of+Jesus.+But+he+who+preserved+the+Woman+in+the+wilderness+is+the+stronger%2C+so+that+the+gates+of+Hell+were+not+able+nor+shall+be+able+to+prevail+against+her%3B+yea+by+the+breath+of+his+mouth+and+preaching+of+the+Word+her+enemies+are+scattered%2C+Antichrist+is+revealed+and+true+Christians+are+multiplied.%E2%80%9D%0A%0A%E2%80%94+Alexander+Petrie%2C+A+Compendious+History+of+the+Catholic+Church+from+the+year+600+untill+the+year+1600%2C+showing+her+Deformation+%26+Reformation%3A+together+with+the+rise%2C+reign%2C+rage%2C+and+begin-fall+of+the+Roman+Antichrist...+%28Hague%3A+Adrian+Vlack%2C+1657%29%2C+Preface%2C+p.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1b7202e610.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1b7202e610.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/eschatology/#:~:text=The%20Fifth%20Age%20is%20of%20the,revealed%20and%20true%20Christians%20are%20multiplied&amp;text=The%20Fifth%20Age%20is%20of%20the%20Church%20reverting&amp;text=Antichrist%20is%20revealed%20and%20true%20Christians%20are%20multiplied" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f7c6784545" data-kw="">
<blockquote><p>I know that the opinions of the expositors touching these thousand years be diverse. I know how the heresy of the Chiliasts or Millenaries by Papias, authour hereof, as Eusebius recites in the 3rd book [ch. 39.12] of the Ecclesiastical History, was taken hereof. I will not here stand about to confute the opinion of others, which also would be overlong and tedious, and not of so great profit. I wil only utter my own to be weighed of the godly readers, then will I leave it free for every man to follow that thing which he shall think most agreable to the truth and profitable for the godly. And I understand plainly and simply that St. John speaks of a thousand years which ran on by continual course from the time of Christ until the last corrupting of the evangelical preaching and church of Christ. Neither am I very scrupulous in searching out the term of the supputation of these thousand years. Simply I appoint the beginning of the reckoning in the open preaching of the Gospel and what time the Word began now to be received, and was now received of the gentiles. I suppose therefore that there may be three terms or times appointed, which nevertheless shall come all to one reckoning, differing little or nothing amongst themselves or having small diversity, not passing half a year more or less. Ye may therefore, if you please, begin the supputation of the thousand years from the 33rd year of Christ’s birth, wherein Christ also ascended into heaven and Paul being called to the ministry and drawing the gentiles into the felloweship of God’s people by the preaching of God’s Word, began to restrain Satan. And you shall come to the year of our Lord, 1034, and to the bishopric of Pope Benedict IX, which after he come by unlawful means into the chair of St. Peter, as they call it, practiced art-magic and was joined in league with the Devil: of whom he was carried away also, what time he had sold his bishopric before the Pope Gregory VI… Thou wilt say then, that about that time the Devil brake loose again and seduced the people, especially by Popes. Or begin the supputation of the thousand years from that time wherein Paul, being bound for the gospel at Rome, testified that the gospel was preached throughout the world. That was about the year of our Lord, 60; from thence accompting a thousand years, you shall come to the year of our Lord, 1060, when Nicholas II was Pope, under whom it is written that the verity was diversely tempted and corrupted and that Gregory VII did then also by his crafts and enterprises trouble the whole world. Or begin the supputation from the destruction of Jerusalem, what time the Jews [were] cast off, the gentiles in great number entered and were received into the place of the Jews rejected, which was the year of our Lord 73, and thou shalt attain to the year of our Lord 1073, even to Pope Gregory VII: in the which time not a few historiographers write that the Devil himself reigned. Doubtless never man hurt godliness or more stoutly advanced impiety than did this Gregory, otherwise called Hildebrand. Of him I have spoken before in the 13th chapter. Where also I admonished you that Cardinal Benon did accompt those thousand years from the birth of the Lord and concluded [the same] in Sylvester II. It is evident therefore that the gospel has had a notable place in the world, neither has [it] been quenched for the space of a thousand years: that is to say, from the time of the apostles until the year of our Lord was reckoned 1073 or there about… … St. John assigned to Antichrist a certain number of years, to wit 666. Whereof we might understand the name of Antichrist. But therefore it follows not that the Devil was then quite loosed or the light of the Gospel utterly extinguished. For the apostle in his time, speaking of him: ‘The mystery,’ says he, ‘of iniquity now works.’ Antichrist therefore has his seeds, he has his beginning, he has his rising up, his growing and increases. But after a thousand years, he went to work most impudently and most boldly which before also had uttered his maliciousness: but now most venomously of all he spews out his poison, oppressing kings and all that speak never so little against him. We know moreover that in these thousand years past the Devil has reigned in many by murder, perjury and innumerable and unspeakeable evils. But if you consider what has been done since those thousand years, and what is done at this day: you will say those ages of the thousand years to have been golden and silver worlds and ours now for these five hundred years to be of brass, iron, lead and clay. Lactantius in the seventh book of Institutes, the 15th chapter, towards the last end of the world, says he, the state of worldly matters must needs be altered and iniquity prevailing to incline to the worse: so that these our times, in the which iniquity and mischief is grown to the highest degree, yet in comparison of that uncurable evil may be accompted fortunate and in manner golden ages. For justice shall than wear so thin, ungodliness, covetousness, wilfulness and lust shall be so common, that if there shall be then haply any good men, they shall be a pray to the wicked, and everywhere vexed of the unrighteous… By all the which our days now seem to be painted lively. But what is that, which is annexed, that the Devil must be loosed for a little season? seems this a little season which continues now five hundred years? And this place we expound so as that same in the gospel: unless those days were shortened, no flesh should be saved. For it is evidently by stories that neither the Devil, nor Antichrist has enjoyed that his kingdom long quiet. For evermore and in all ages have sprung up some holy and learned men, which being illumined and comforted of God, like Enoch and Helie [Elijah?], haue resisted the ungodly and ungodliness, and have maintained the true religion… Therefore both Satan and the Pope could enjoy these matters but a small season. For immediately after the thousand years sprang up the Waldenses which constantly impugned the Pope and his ungodliness. The Lord has raised up certain kings amongst whom be the Fridericks, German Emperors, Lewis of the house of Bauier, and many others. The Popes also have been at dissension amongst themselves whilst many have been chosen, and every one of them wil be the vicar of Christ, and so tear all that ecclesiastical body of theirs with schisms. There rise up against these preachers earnest and vehement, Wyclif, Huss, Jerome of Prague and diverse others. What is done at this day and has been now these 30 years and more against superstitions and idolatry, against the Pope, and all his clergy, the Papists themselves cry out and all parts of the world can testify. Therefore is the Devil loosed a little season. The Lord Jesus tread him under our feat shortly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Hundred Sermons upon the Apocalypse of Jesus Christ</cite>, ... (London: John Day, 1561), 87th sermon, p. 593-94 &amp; 598-600</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/second-coming.html">Second Coming</a></span></div>

regory VI… Thou wilt say then, that about that time the Devil brake loose again and seduced the people, especially by Popes. Or begin the supputation of the thousand years from that time wherein Paul, being bound for the gospel at Rome, testified that the gospel was preached throughout the world. That was about the year of our Lord, 60; from thence accompting a thousand years, you shall come to the year of our Lord, 1060, when Nicholas II was Pope, under whom it is written that the verity was diversely tempted and corrupted and that Gregory VII did then also by his crafts and enterprises trouble the whole world. Or begin the supputation from the destruction of Jerusalem, what time the Jews [were] cast off, the gentiles in great number entered and were received into the place of the Jews rejected, which was the year of our Lord 73, and thou shalt attain to the year of our Lord 1073, even to Pope Gregory VII: in the which time not a few historiographers write that the Devil himself reigned. Doubtless never man hurt godliness or more stoutly advanced impiety than did this Gregory, otherwise called Hildebrand. Of him I have spoken before in the 13th chapter. Where also I admonished you that Cardinal Benon did accompt those thousand years from the birth of the Lord and concluded [the same] in Sylvester II. It is evident therefore that the gospel has had a notable place in the world, neither has [it] been quenched for the space of a thousand years: that is to say, from the time of the apostles until the year of our Lord was reckoned 1073 or there about… … St. John assigned to Antichrist a certain number of years, to wit 666. Whereof we might understand the name of Antichrist. But therefore it follows not that the Devil was then quite loosed or the light of the Gospel utterly extinguished. For the apostle in his time, speaking of him: ‘The mystery,’ says he, ‘of iniquity now works.’ Antichrist therefore has his seeds, he has his beginning, he has his rising up, his growing and increases. But after a thousand years, he went to work most impudently and most boldly which before also had uttered his maliciousness: but now most venomously of all he spews out his poison, oppressing kings and all that speak never so little against him. We know moreover that in these thousand years past the Devil has reigned in many by murder, perjury and innumerable and unspeakeable evils. But if you consider what has been done since those thousand years, and what is done at this day: you will say those ages of the thousand years to have been golden and silver worlds and ours now for these five hundred years to be of brass, iron, lead and clay. Lactantius in the seventh book of Institutes, the 15th chapter, towards the last end of the world, says he, the state of worldly matters must needs be altered and iniquity prevailing to incline to the worse: so that these our times, in the which iniquity and mischief is grown to the highest degree, yet in comparison of that uncurable evil may be accompted fortunate and in manner golden ages. For justice shall than wear so thin, ungodliness, covetousness, wilfulness and lust shall be so common, that if there shall be then haply any good men, they shall be a pray to the wicked, and everywhere vexed of the unrighteous… By all the which our days now seem to be painted lively. But what is that, which is annexed, that the Devil must be loosed for a little season? seems this a little season which continues now five hundred years? And this place we expound so as that same in the gospel: unless those days were shortened, no flesh should be saved. For it is evidently by stories that neither the Devil, nor Antichrist has enjoyed that his kingdom long quiet. For evermore and in all ages have sprung up some holy and learned men, which being illumined and comforted of God, like Enoch and Helie [Elijah?], haue resisted the ungodly and ungodliness, and have maintained the true religion… Therefore both Satan and the Pope could enjoy these matters but a small season. For immediately after the thousand years sprang up the Waldenses which constantly impugned the Pope and his ungodliness. The Lord has raised up certain kings amongst whom be the Fridericks, German Emperors, Lewis of the house of Bauier, and many others. The Popes also have been at dissension amongst themselves whilst many have been chosen, and every one of them wil be the vicar of Christ, and so tear all that ecclesiastical body of theirs with schisms. There rise up against these preachers earnest and vehement, Wyclif, Huss, Jerome of Prague and diverse others. What is done at this day and has been now these 30 years and more against superstitions and idolatry, against the Pope, and all his clergy, the Papists themselves cry out and all parts of the world can testify. Therefore is the Devil loosed a little season. The Lord Jesus tread him under our feat shortly.”

— Heinrich Bullinger, A Hundred Sermons upon the Apocalypse of Jesus Christ... (London: John Day, 1561), 87th sermon, p. 593-94 &amp; 598-600">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+know+that+the+opinions+of+the+expositors+touching+these+thousand+years+be+diverse.+I+know+how+the+heresy+of+the+Chiliasts+or+Millenaries+by+Papias%2C+authour+hereof%2C+as+Eusebius+recites+in+the+3rd+book+%5Bch.+39.12%5D+of+the+Ecclesiastical+History%2C+was+taken+hereof.+I+will+not+here+stand+about+to+confute+the+opinion+of+others%2C+which+also+would+be+overlong+and+tedious%2C+and+not+of+so+great+profit.+I+wil+only+utter+my+own+to+be+weighed+of+the+godly+readers%2C+then+will+I+leave+it+free+for+every+man+to+follow+that+thing+which+he+shall+think+most+agreable+to+the+truth+and+profitable+for+the+godly.+And+I+understand+plainly+and+simply+that+St.+John+speaks+of+a+thousand+years+which+ran+on+by+continual+course+from+the+time+of+Christ+until+the+last+corrupting+of+the+evangelical+preaching+and+church+of+Christ.+Neither+am+I+very+scrupulous+in+searching+out+the+term+of+the+supputation+of+these+thousand+years.+Simply+I+appoint+the+beginning+of+the+reckoning+in+the+open+preaching+of+the+Gospel+and+what+time+the+Word+began+now+to+be+received%2C+and+was+now+received+of+the+gentiles.+I+suppose+therefore+that+there+may+be+three+terms+or+times+appointed%2C+which+nevertheless+shall+come+all+to+one+reckoning%2C+differing+little+or+nothing+amongst+themselves+or+having+small+diversity%2C+not+passing+half+a+year+more+or+less.+Ye+may+therefore%2C+if+you+please%2C+begin+the+supputation+of+the+thousand+years+from+the+33rd+year+of+Christ%E2%80%99s+birth%2C+wherein+Christ+also+ascended+into+heaven+and+Paul+being+called+to+the+ministry+and+drawing+the+gentiles+into+the+felloweship+of+God%E2%80%99s+people+by+the+preaching+of+God%E2%80%99s+Word%2C+began+to+restrain+Satan.+And+you+shall+come+to+the+year+of+our+Lord%2C+1034%2C+and+to+the+bishopric+of+Pope+Benedict+IX%2C+which+after+he+come+by+unlawful+means+into+the+chair+of+St.+Peter%2C+as+they+call+it%2C+practiced+art-magic+and+was+joined+in+league+with+the+Devil%3A+of+whom+he+was+carried+away+also%2C+what+time+he+had+sold+his+bishopric+before+the+Pope+Gregory+VI%E2%80%A6+Thou+wilt+say+then%2C+that+about+that+time+the+Devil+brake+loose+again+and+seduced+the+people%2C+especially+by+Popes.+Or+begin+the+supputation+of+the+thousand+years+from+that+time+wherein+Paul%2C+being+bound+for+the+gospel+at+Rome%2C+testified+that+the+gospel+was+preached+throughout+the+world.+That+was+about+the+year+of+our+Lord%2C+60%3B+from+thence+accompting+a+thousand+years%2C+you+shall+come+to+the+year+of+our+Lord%2C+1060%2C+when+Nicholas+II+was+Pope%2C+under+whom+it+is+written+that+the+verity+was+diversely+tempted+and+corrupted+and+that+Gregory+VII+did+then+also+by+his+crafts+and+enterprises+trouble+the+whole+world.+Or+begin+the+supputation+from+the+destruction+of+Jerusalem%2C+what+time+the+Jews+%5Bwere%5D+cast+off%2C+the+gentiles+in+great+number+entered+and+were+received+into+the+place+of+the+Jews+rejected%2C+which+was+the+year+of+our+Lord+73%2C+and+thou+shalt+attain+to+the+year+of+our+Lord+1073%2C+even+to+Pope+Gregory+VII%3A+in+the+which+time+not+a+few+historiographers+write+that+the+Devil+himself+reigned.+Doubtless+never+man+hurt+godliness+or+more+stoutly+advanced+impiety+than+did+this+Gregory%2C+otherwise+called+Hildebrand.+Of+him+I+have+spoken+before+in+the+13th+chapter.+Where+also+I+admonished+you+that+Cardinal+Benon+did+accompt+those+thousand+years+from+the+birth+of+the+Lord+and+concluded+%5Bthe+same%5D+in+Sylvester+II.+It+is+evident+therefore+that+the+gospel+has+had+a+notable+place+in+the+world%2C+neither+has+%5Bit%5D+been+quenched+for+the+space+of+a+thousand+years%3A+that+is+to+say%2C+from+the+time+of+the+apostles+until+the+year+of+our+Lord+was+reckoned+1073+or+there+about%E2%80%A6+%E2%80%A6+St.+John+assigned+to+Antichrist+a+certain+number+of+years%2C+to+wit+666.+Whereof+we+might+understand+the+name+of+Antichrist.+But+therefore+it+follows+not+that+the+Devil+was+then+quite+loosed+or+the+light+of+the+Gospel+utterly+extinguished.+For+the+apostle+in+his+time%2C+speaking+of+him%3A+%E2%80%98The+mystery%2C%E2%80%99+says+he%2C+%E2%80%98of+iniquity+now+works.%E2%80%99+Antichrist+therefore+has+his+seeds%2C+he+has+his+beginning%2C+he+has+his+rising+up%2C+his+growing+and+increases.+But+after+a+thousand+years%2C+he+went+to+work+most+impudently+and+most+boldly+which+before+also+had+uttered+his+maliciousness%3A+but+now+most+venomously+of+all+he+spews+out+his+poison%2C+oppressing+kings+and+all+that+speak+never+so+little+against+him.+We+know+moreover+that+in+these+thousand+years+past+the+Devil+has+reigned+in+many+by+murder%2C+perjury+and+innumerable+and+unspeakeable+evils.+But+if+you+consider+what+has+been+done+since+those+thousand+years%2C+and+what+is+done+at+this+day%3A+you+will+say+those+ages+of+the+thousand+years+to+have+been+golden+and+silver+worlds+and+ours+now+for+these+five+hundred+years+to+be+of+brass%2C+iron%2C+lead+and+clay.+Lactantius+in+the+seventh+book+of+Institutes%2C+the+15th+chapter%2C+towards+the+last+end+of+the+world%2C+says+he%2C+the+state+of+worldly+matters+must+needs+be+altered+and+iniquity+prevailing+to+incline+to+the+worse%3A+so+that+these+our+times%2C+in+the+which+iniquity+and+mischief+is+grown+to+the+highest+degree%2C+yet+in+comparison+of+that+uncurable+evil+may+be+accompted+fortunate+and+in+manner+golden+ages.+For+justice+shall+than+wear+so+thin%2C+ungodliness%2C+covetousness%2C+wilfulness+and+lust+shall+be+so+common%2C+that+if+there+shall+be+then+haply+any+good+men%2C+they+shall+be+a+pray+to+the+wicked%2C+and+everywhere+vexed+of+the+unrighteous%E2%80%A6+By+all+the+which+our+days+now+seem+to+be+painted+lively.+But+what+is+that%2C+which+is+annexed%2C+that+the+Devil+must+be+loosed+for+a+little+season%3F+seems+this+a+little+season+which+continues+now+five+hundred+years%3F+And+this+place+we+expound+so+as+that+same+in+the+gospel%3A+unless+those+days+were+shortened%2C+no+flesh+should+be+saved.+For+it+is+evidently+by+stories+that+neither+the+Devil%2C+nor+Antichrist+has+enjoyed+that+his+kingdom+long+quiet.+For+evermore+and+in+all+ages+have+sprung+up+some+holy+and+learned+men%2C+which+being+illumined+and+comforted+of+God%2C+like+Enoch+and+Helie+%5BElijah%3F%5D%2C+haue+resisted+the+ungodly+and+ungodliness%2C+and+have+maintained+the+true+religion%E2%80%A6+Therefore+both+Satan+and+the+Pope+could+enjoy+these+matters+but+a+small+season.+For+immediately+after+the+thousand+years+sprang+up+the+Waldenses+which+constantly+impugned+the+Pope+and+his+ungodliness.+The+Lord+has+raised+up+certain+kings+amongst+whom+be+the+Fridericks%2C+German+Emperors%2C+Lewis+of+the+house+of+Bauier%2C+and+many+others.+The+Popes+also+have+been+at+dissension+amongst+themselves+whilst+many+have+been+chosen%2C+and+every+one+of+them+wil+be+the+vicar+of+Christ%2C+and+so+tear+all+that+ecclesiastical+body+of+theirs+with+schisms.+There+rise+up+against+these+preachers+earnest+and+vehement%2C+Wyclif%2C+Huss%2C+Jerome+of+Prague+and+diverse+others.+What+is+done+at+this+day+and+has+been+now+these+30+years+and+more+against+superstitions+and+idolatry%2C+against+the+Pope%2C+and+all+his+clergy%2C+the+Papists+themselves+cry+out+and+all+parts+of+the+world+can+testify.+Therefore+is+the+Devil+loosed+a+little+season.+The+Lord+Jesus+tread+him+under+our+feat+shortly.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+A+Hundred+Sermons+upon+the+Apocalypse+of+Jesus+Christ...+%28London%3A+John+Day%2C+1561%29%2C+87th+sermon%2C+p.+593-94+%26+598-600&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff7c6784545.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f7c6784545.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/eschatology/#:~:text=I%20know%20that%20the%20opinions%20of,tread%20him%20under%20our%20feat%20shortly&amp;text=I%20know%20that%20the%20opinions%20of%20the%20expositors&amp;text=Lord%20Jesus%20tr

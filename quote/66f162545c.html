<main class="wrap"><figure class="quote" id="q-66f162545c" data-kw="">
<blockquote><p>Victory universal shall yet crown the Church of Christ. Reformed Presbyterians are not pessimists. Whatever reverses or successes the holy war of the present hour may unfold in the near future, they are confident about the issue. […] The time is coming when all errors and iniquities shall have their Bar Kholsoums, their seas of destruction, and when the Church of Christ, like emancipated Israel, shall sing songs of triumph and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-kerr.html">James Kerr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Presbyterianism: its special claims</cite>, (Belfast, 1895), p. 16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

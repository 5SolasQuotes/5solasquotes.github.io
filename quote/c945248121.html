<blockquote><p>I enact this for Laymen too, and I enjoin it also upon all Priests [elders; Greek: πρεσβυτέροις], and upon those commissioned to rule. Come to the aid of the Word, all of you to whom God has given power to aid. It is a great thing to check murder, to punish adultery, to chastise theft; much more to establish piety by law, and to bestow sound doctrine. My word will not be able to do as much in fighting for the Holy Trinity as your Edict, if you will bridle the ill disposed, if you will help the persecuted, if you will check the slayers, and prevent people from being slain. I am speaking not merely of bodily but of spiritual slaughter. For all sin is the death of the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Oration XXXVII. On the Words of the Gospel, “When Jesus had finished these sayings,” etc. – S. Matt. XIX. I.</cite>, (n.d.), 23 in Nicene and Post-Nicene Fathers 2, 7: 344.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-79decefbf0" data-kw="">
<blockquote><p>And the truth is, that, besides many other evils, the iniquity and unhappiness of such oaths and covenants [such as the SL&amp;C, which he was just examining] lie much in this, that being commonly framed by persons that even, amongst themselves, are not fully of one mind, but have their different opinions and interests to serve, (and it was so even in this) they commonly patch up so many several articles and clauses, and those too of so versatile and ambiguous terms, that they prove most wretched snares and thickets of briers and thorns to the consciences of those who are engaged in them, and matter of endless contentions and disputes amongst them, about the true sense and intendment, and the ties and obligations of those doubtful clauses: especially in such alterations and revolutions of affairs as always may, and often do, even within few years, follow after them; for the models and productions of such devices are not usually long-lived. And whatsoever may be said for their excuse in whole or in part, who, in yielding to the power that pressed it, and the general opinion of this Church at that time, did take that [Solemn League and] Covenant [1643] in the most moderate and least schismatical sense that the terms can admit; yet, I know not what can be said to clear them of a very great sin, that not only framed such an engine, but violently imposed it upon all ranks of men; not ministers and other public persons only, but the whole body and community of the people, thereby engaging such droves of poor ignorant persons to they knew not what, and (to speak freely) to such a hodge-podge of things of various concernments, religious and civil, as church discipline and government, the privileges of parliaments, and liberties of subjects, and condign punishment of malignants— things hard enough for the wisest and learnedest to draw the just lines of, and to give plain definitions and decisions of them, and therefore certainly as far off from the reach of poor country people’s understanding as from the true interest of their souls. And yet to tie them by a religious oath, either to know all, or to contend for them blindfold, without knowing of them, where will there be instanced a greater oppression and tyranny over consciences than this? Certainly, they that now govern in this Church cannot be charged with anything near or like unto it; for whatsoever they require of entrants to the ministry, they require neither subscriptions nor oaths of ministers already entered, and far less of the whole body of the people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works new</cite>, ed. (London: Duncan, 1830), vol. 4, ‘A Modest Defence of Moderate Episcopacy, as Established in Scotland at the Restoration of King Charles II [1660]’, pp. 391-92</span></figcaption>

</figure><figure class="quote" id="q-616ec297fd" data-kw="">
<blockquote><p>Although the service which secular authorities owe to the community does not consist in preaching the divine Word and Law, yet civil officials must govern according to the Word of God and, in the measure of their power, help the success of the divine Word. For as there is no power? which is not from God, and everywhere the present powers are established by Him (Romans 13:1), it certainly follows that this power must be exercised according to the order and will of God.

Only so will this power at last procure the real welfare of its subjects and thus stimulate them to recognize, praise, and glorify God as the Lord of all lords and the King of all kings. But the citizens are not governed for their good and for the true glory of the supreme King when the secular authorities do not rule according to the divine Law and are not set to observe it themselves. For where God is not recognized and obedience to Him is not required before all things, there peace is not peace, justice is not justice, and that which should be profitable brings injury instead.

God therefore forbade the people of Israel to get from foreign people a king who would not be a brother, and commanded the people to accept as king him whom the Lord would elect from their brethren. The king was to write God’s Law and to read it all the days of his life so that he might learn to fear God his Lord, to keep His word and the injunctions of the Law, neither to raise his heart in pride above his brethren nor to deviate either to the right or to the left (Deuteronomy 17:15-20).

If a man, therefore, is to govern beneficially and not to be a tyrant, it is necessary that he be elected by God and from among the people of God. That is to say, he must be a true believer who has not himself stepped forward for the office but has been called to it. The Christian official, recognizing himself as undershepherd of sheep which are not his own but God’s, thinks to govern them not as it seems good to him but according to the Law of God to whom the sheep belong. Consequently a civil officer should day by day govern and treat the people of God according to the divine Law. In great humility and constant awe, he stands before God in order to avoid the least mistake in executing such a great commission.

This Solomon observed. He asked God to give him a teachable heart before all things, so that he might judge his people and know the difference between good and evil (I Kings 3:9). In this prayer he professes that he had been placed above God’s people and not above a people belonging to Solomon himself (I Kings 3:8), to judge it, to lead it to good, and to keep it from evil. He also confesses that human reason has not the power of distinguishing between evil and the true good, of judging rightly, but needs to learn such things from God. Thus enlightened, we can well recognize the heavy divine plague with which God has plagued us and which comes from the fact that we call ourselves Christians and consider ourselves the people of God, and yet our officials who have the power have fallen into the error of believing that the divine Law does not concern them, that they must judge and make regulations more according to the pagan imperial law and other human sentences than according to the sentence of God.

In this they show themselves bailiffs of men and not of God, since they govern their subjects according to the sentences of men and not according to the divine pronouncement. Now, anywhere a man whose law is observed is recognized as lord. No one on earth would consider as belonging to the German emperor a city which would direct all its affairs and regime according to the commands and prohibitions of the French king, and completely ignore the imperial law. Consequently, we cannot pride ourselves on being communities of God and the people of God, if we respect, accept, and keep all sorts of laws, ordinances, and regulations other than God’s. Only His Law can make us live.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Instruction in Christian Love</cite>, trans. Paul T. Fuhrmann (1523; Richmond VA: John Knox Press, 1952), pp 35-37.</span></figcaption>

+a+true+believer+who+has+not+himself+stepped+forward+for+the+office+but+has+been+called+to+it.+The+Christian+official%2C+recognizing+himself+as+undershepherd+of+sheep+which+are+not+his+own+but+God%E2%80%99s%2C+thinks+to+govern+them+not+as+it+seems+good+to+him+but+according+to+the+Law+of+God+to+whom+the+sheep+belong.+Consequently+a+civil+officer+should+day+by+day+govern+and+treat+the+people+of+God+according+to+the+divine+Law.+In+great+humility+and+constant+awe%2C+he+stands+before+God+in+order+to+avoid+the+least+mistake+in+executing+such+a+great+commission.%0A%0AThis+Solomon+observed.+He+asked+God+to+give+him+a+teachable+heart+before+all+things%2C+so+that+he+might+judge+his+people+and+know+the+difference+between+good+and+evil+%28I+Kings+3%3A9%29.+In+this+prayer+he+professes+that+he+had+been+placed+above+God%E2%80%99s+people+and+not+above+a+people+belonging+to+Solomon+himself+%28I+Kings+3%3A8%29%2C+to+judge+it%2C+to+lead+it+to+good%2C+and+to+keep+it+from+evil.+He+also+confesses+that+human+reason+has+not+the+power+of+distinguishing+between+evil+and+the+true+good%2C+of+judging+rightly%2C+but+needs+to+learn+such+things+from+God.+Thus+enlightened%2C+we+can+well+recognize+the+heavy+divine+plague+with+which+God+has+plagued+us+and+which+comes+from+the+fact+that+we+call+ourselves+Christians+and+consider+ourselves+the+people+of+God%2C+and+yet+our+officials+who+have+the+power+have+fallen+into+the+error+of+believing+that+the+divine+Law+does+not+concern+them%2C+that+they+must+judge+and+make+regulations+more+according+to+the+pagan+imperial+law+and+other+human+sentences+than+according+to+the+sentence+of+God.%0A%0AIn+this+they+show+themselves+bailiffs+of+men+and+not+of+God%2C+since+they+govern+their+subjects+according+to+the+sentences+of+men+and+not+according+to+the+divine+pronouncement.+Now%2C+anywhere+a+man+whose+law+is+observed+is+recognized+as+lord.+No+one+on+earth+would+consider+as+belonging+to+the+German+emperor+a+city+which+would+direct+all+its+affairs+and+regime+according+to+the+commands+and+prohibitions+of+the+French+king%2C+and+completely+ignore+the+imperial+law.+Consequently%2C+we+cannot+pride+ourselves+on+being+communities+of+God+and+the+people+of+God%2C+if+we+respect%2C+accept%2C+and+keep+all+sorts+of+laws%2C+ordinances%2C+and+regulations+other+than+God%E2%80%99s.+Only+His+Law+can+make+us+live.%E2%80%9D%0A%0A%E2%80%94+Martin+Bucer%2C+Instruction+in+Christian+Love%2C+trans.+Paul+T.+Fuhrmann+%281523%3B+Richmond+VA%3A+John+Knox+Press%2C+1952%29%2C+pp+35-37.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F616ec297fd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/616ec297fd.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/04/14/martin-bucer-on-secular-authorities-ruling-according-to-the-divine-law/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-c469fd8b7f" data-kw="">
<blockquote><p>I know not any, that ever I read, or heard, said, the sword of men can compel the mind, or compel men in things of the mind; for let the persecuting Emperors, and all the Tyrants on earth, armed with the fury and power of the Prince of the bottomless pit, torture, torment, or kill, they cannot reach soul, mind, will, conscience and affections, we never said that the sword is a means of converting souls to Christ, or that Religion is, or can be compelled: but we hold that the sword is an external, though not simply necessary means to hinder wolves and grievous foxes to destroy the souls of others, by bringing out of their corrupt minds in word, writing, teaching, professing another Gospel, such as fleshly and abominable familism; now the not perverting of the souls of others, the only object of the Magistrates sword, is not the conversion, nor any sign that the false teacher thus hindered to hurt the flock, is converted to the faith.

The Magistrate then defendeth only, and guardeth the Law of God and Church from pestilent heresy, but neither he, nor his sword is hereby made a means, way, or cause of conversion of souls, or propagating the Gospel: who ever usurp the sword to defend ravening wolves, that, with such doctrine destroys the flock of Christ, they give their power to the beast, and their horns and strength to the false Prophet, and I writ it, God shall deliver souls out of their captivity; (for the elect cannot finally be seduced, Matth. 24.24.)</p></blockquote>

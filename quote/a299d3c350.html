<main class="wrap"><figure class="quote" id="q-a299d3c350" data-kw="">
<blockquote><p>Conclusion 1: This civil coercive power is not only unnecessary, but unlawful to be exercised in the planting of the Church, and bringing men to the faith of Christ. Churches are not to be planted by weapons, but by doctrines (Lactantius, Institutes, bk. 5, ch. 20); not by the power of the sword, but by the efficacy of the Word; not by carnal weapons, but by spiritual means. The commission that Christ gave his apostles for the spreading and planting of the Gospel was only this, ‘Go and teach all nations, baptizing them in the name of the Father, and of the Son and of the Holy Ghost,’ Mt. 28:19-20, the like, in Mk. 16:15. And Christ tells us his kingdom is not of this world, for then his servants would fight for him, Jn. 18:36, but that was not the way to plant or advance his kingdom. Christ has no need of such carnal weapons for the planting of his Church, or the settling Him in his kingdom: the apostles had a warfare to fight, but the weapons of their warfare were not carnal, but spiritual, and yet strong to pull down the strongest holds of sin and Satan, and to bring every thought in obedience to Christ, 2 Cor. 10:3-4. They had a sword to wield, but that sword was no other but the Word of God, the sword of the Spirit, Eph. 6:17; Rev. 19:15. Here were armies to subdue even nations to Christ, but these were armies of teachers, not of soldiers, as the Psalmist alludes, Ps. 68:11. External force is not the way of Christ for the spreading his Gospel, and planting of his kingdom: It is true here, Religio suaderi potest, cogi non potest, ‘Men may be persuaded into a religion, but they can never be compelled.’ All externall acts of power are not able to beget internal acts of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, (London: Miller, 1646), p. 326</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>Now as to this sort of dependence which ministers have upon the magistrate, in the actual discharge of their office, for clearing thereof, distinguish next between the exercise of the ministry simply and in itself considered, and the circumstances of that exercise: Or distinguish subordination into that which is absolute and that which is only secundum quid, or in some certain respects. Now, as by this indulgence your ministers do not depend upon the prince essentially and derivatively as to their office and authority, and matter of their embassage; so neither simply and absolutely for the exercise of it (both these they have and hold immediately of Christ alone), but only and merely in regard of the circumstance and adjunct of the peaceableness and legal immunity of the public exercise of it in such and such places of his realm: Even as the exercise of the protestant religion, being authorized by law, depends upon him; and as the exercise of your ministry within any family depends upon the master of the family. And yourselves in your papers upon this subject acknowledge this kind of subordination and dependence (viz. in respect of the public, free, peaceable exercise of the ministry) to be not unlawful. To this [William] Apollonius also accords, [Jus majestatis circa sacra, 1642] part last [pp. 249–51], §2, ch. 3. Neither is it to be thought that this does subject the ministry, but the man; not the function, but the person, to the civil power, except it be (as some of yourselves say) in obliquo, indirectly and objectively, even as the other matters of God are, being objects about which his imperative and coercive power is conversant… [The indulged] consequently are Christ’s ambassadors and sent-servants still, even as you are; only they have the peaceableness and civil freedom of the public exercise of their function from the ruler: a thing they were and are bound to pray for, 1 Tim. 2:1–2, that under him they ‘may lead a quiet and peaceable life in all godliness and honesty;’ and consequently, or by parity of reason, in the exercise of their ministry. And if this may and should be prayed for, as it is his duty to grant it, so it cannot be their crime to accept it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead</cite>, (London, 1681), pp. 89–91</span></figcaption>

</figure><figure class="quote" id="q-97903c9b00" data-kw="">
<blockquote><p>Reason 5. Let those that better know the law of the land consider whether it be not necessary to our own peace to free us from lawsuits that we have first the people’s express consent [for church membership, duties and public reproofs]? and whether they may have no action against a minister else for naming any man in the congregation by reproof and pronouncing him a person to be avoided? and so no discipline will be exercised.</p></blockquote>

<blockquote><p>5. Also, there is a difference between the constraining of a circumcised or baptized people to worship God in the purity of ordinances, as they have been engaged thereto, which was Josiah’s practice, and the constraining of a people to engage and be baptized which were not formerly engaged; because, actual members of a Church have not even that liberty as others have to abandon ordinances: and this puts them to no new engagement in religion, but presses them to continue under former engagements and accordingly to perform: Hence we see, that both in the Old and New Testament, Church-members have been put to many things and restrained from many things, which had not been pertinent in the case of others. See, 2 Chron. 15:13.</p></blockquote>

<blockquote><p>…princes, and all who hold the office of magistracy, are here reminded of their duty. It is not enough, if, by giving to every one what is due, they restrain all acts of violence, and maintain peace; but they must likewise endeavor to promote religion, and to regulate morals by wholesome discipline. The exhortation of David (Psalm 2:12) to “kiss the Son,” and the prophecy of Isaiah, that they shall be nursing — fathers of the Church, (Isaiah 49:23) are not without meaning; and, therefore, they have no right to flatter themselves, if they neglect to lend their assistance to maintain the worship of God.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>
<div class="actions"><button class="copy" data-copy="“…princes, and all who hold the office of magistracy, are here reminded of their duty. It is not enough, if, by giving to every one what is due, they restrain all acts of violence, and maintain peace; but they must likewise endeavor to promote religion, and to regulate morals by wholesome discipline. The exhortation of David (Psalm 2:12) to “kiss the Son,” and the prophecy of Isaiah, that they shall be nursing — fathers of the Church, (Isaiah 49:23) are not without meaning; and, therefore, they have no right to flatter themselves, if they neglect to lend their assistance to maintain the worship of God.”

— John Calvin, ‘A Sermon on the Duty of Civil Rulers to Enforce and Defend the True Religion and True Godliness in their Realms by drawing out the sword against all Heretics and others who trouble the Church…’ on 1 Tim. 2:1-2 (d. 1564; 1579)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6princes%2C+and+all+who+hold+the+office+of+magistracy%2C+are+here+reminded+of+their+duty.+It+is+not+enough%2C+if%2C+by+giving+to+every+one+what+is+due%2C+they+restrain+all+acts+of+violence%2C+and+maintain+peace%3B+but+they+must+likewise+endeavor+to+promote+religion%2C+and+to+regulate+morals+by+wholesome+discipline.+The+exhortation+of+David+%28Psalm+2%3A12%29+to+%E2%80%9Ckiss+the+Son%2C%E2%80%9D+and+the+prophecy+of+Isaiah%2C+that+they+shall+be+nursing+%E2%80%94+fathers+of+the+Church%2C+%28Isaiah+49%3A23%29+are+not+without+meaning%3B+and%2C+therefore%2C+they+have+no+right+to+flatter+themselves%2C+if+they+neglect+to+lend+their+assistance+to+maintain+the+worship+of+God.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+%E2%80%98A+Sermon+on+the+Duty+of+Civil+Rulers+to+Enforce+and+Defend+the+True+Religion+and+True+Godliness+in+their+Realms+by+drawing+out+the+sword+against+all+Heretics+and+others+who+trouble+the+Church%E2%80%A6%E2%80%99+on+1+Tim.+2%3A1-2+%28d.+1564%3B+1579%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8abda43efa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8abda43efa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-civil-magistrates-authority-around-spiritual-things-circa-sacra/#:~:text=princes%2C%20and%20all%20who%20hold%20the,to%20maintain%20the%20worship%20of%20God&amp;text=princes%2C%20and%20all%20who%20hold%20the%20office%20of&amp;text=their%20assistance%20to%20maintain%20the%20worship%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

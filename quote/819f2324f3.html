<main class="wrap"><figure class="quote" id="q-819f2324f3" data-kw="">
<blockquote><p>Lastly, justifying faith is such a faith whereby we embrace, entertain, receive, admit Christ, not into our houses, but into our hearts; and whereby conseqently we are united unto Christ, so as that He is said to be in us, and we in Him. ‘To as many as received Him,’ says He, ‘He gave this priviledge to become the sons of God, even to those that beleive in his name.’ Where to ‘receive Him,’ is to give Him entertainment, not so much in their houses, which Matthew, Zacheus, and others of them also did, as in their hearts: according to that of the apostle, ‘that Christ may dwell in your hearts by faith,’ Eph. 3:17. Whence it is that they that are in the faith, are said to have Christ in them. ‘Examine yourselves,’ says the apostle, ‘whether ye be in the Faith: do you not know that Christ is in you?’ 2 Cor. 13:5, thereby implying that if they be in the faith, then Christ is in them… we cannot with any good ground rely on Him or trust Him for the discharge of us from the guilt of our sins, unless we be content to receive, and do willingly embrace Him, on such terms as God offers Him, and as He offers Himself unto us, and on no other terms than these is He offered unto any. But a man may believe that Christ is the Savior of the world, yea that he cannot be saved but by Christ, and yet for all that may refuse to receive Him and yield himself up unto Him, because he mislikes the conditions on which He is tendered unto Him, or delay to do it at present, in hope that he may timely enough do it hereafter. As when a company of rebels are up in arms against their leige lord, and a proclamation of pardon and impunity is published by him unto all such of them as will lay down their arms, put themselves upon his mercy, acknowledge their offence and by solemn oath engage themselves to due allegiance and constant obedience for the future; albeit that they all know him to be their lawful sovereign, and believe that he will be as good as his word to all that so accept of it, nor know which way to escape, but that first or last they shal be surprised, if they do stand out, and have execution done upon them; yet there may be diverse among them that will choose rather to persist in their rebellious courses, or refuse at least to yield themselves up to him and to accept of his gracious offer, either out of a stoutness of stomach and a stifness of self-will, or out of an extreme malice and inveterate hatred against the person of their prince, or out of a strong affection to some adverse party, or out of a fond conceit that they may keep for some good space of time out of the way, undiscovered and unsurprised, or that when they perceive themselves near to be attached, they may then by a tender of themselves attain the benefit of the offer, there being no limitation of time mentioned in it. In the same manner: although a man do beleive that Jesus is the Savior of mankind, and that there is no way for him to attain salvation but by Christ, yet for all that may he refuse to receive Christ for his Lord and Savior or to accept of salvation by Christ, because he mislikes the conditions upon and under which Christ and salvation by Christ is offered and tendred unto him, and without which it cannot be had. But what are those terms, that are so necessarily reqired, and with so much difficulty received? Why these are: ‘If any man will come after me, says our Savior, [Greek], let him utterly deny himself,’ Mt. 16:24… he must not be his own man anymore, but he must in resolution at least be Christ’s alone, wholly at his command, will and disposal… This word or saying, that Christ came to save sinners, it is a sure saying, such as we may write and rest upon it, we may with good ground afford credit unto it, yea and it is withal a very acceptable saying, a saying worthy of all acceptance, 1 Tim. 1:15, and indeed who would not accept of such a gracious offer? would not willingly and gladly entertain such tidings, the glad tidings of salvation, and of salvation not temporal, but eternal? See Isa. 52:7; Nah. 1:15; Rom. 10:15, yea but what is the reason then that this so acceptable message finds so little acceptance in the world, that so few do accept of it? that when this Savior came unto his own, He found so sorry welcome among them, his own refused to receive Him? Jn. 1:11. It is not in the thing offered; that no damned wretch in Hell would refuse to accept; but it is in the terms whereupon the offer is made and tendred, which mans corrupt nature will in no wise condescend unto… The stoutness, or hautiness of the flesh, of man’s carnal heart or mind (and there is an emphasis also in the word ‘flesh’, which of itself has an intimation of infirmity and weakness, Gen. 6:3; Heb. 5:7, yea sometime of a pliable and yeilding disposition, apt to receive any but slight impression, Eze. 36:26; 2 Cor. 3:3, that such a sorry peice of flesh as man’s heart is, should be so stiff, and so stubborn) is enmity against God; not averse to him, but enmity itself against him; stands out in such defiance against Him, and whatsoever He wills and enjoins, that it neither does submit itself, nor can be subjected unto his law…</p></blockquote>

<blockquote><p>But perchance thou wilt ask: If the opening of the eyes be from God alone, to what purpose shall advice be given to thee, in a matter that lies not in thee, and which is not effected by advice, but by supernatural operation? To this I answer that although the power that must enlighten thee does descend from above, yet usually it does communicate itself unto us by the service of certain means, left with us here below. Again, when grace does first breath upon us, it works by degrees, which degrees being by some neglected, or misconstrued, it has bred unto them a greater difficulty and hardness of travail in the new birth; but being perceived and duly entertained, they turn into testimonials unto us, yea to encouragements unto farther degrees of grace.</p></blockquote>

<blockquote><p>Christ knocks at the door of thy heart, O sinner. Though invisible to mortal eyes, He is here, whether you regard it or not. He knocks. But how? By his Word—by a preached gospel—by the admonitions of conscience—and by the strivings of his Spirit. Nor is this all. He calls. “Unto you O men, I call, and my voice is unto the sons of men.” [Prov. 8] He calls by all the invitations of mercy contained in the Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/asahel-nettleton.html">Asahel Nettleton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Remains of the Late Rev. Asahel Nettleton</cite>, ed. B. Tyler (Hartford: Robins &amp; Smith, 1845), Sermon 25, ‘Christ Standing at the Door’, p. 297</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Christ knocks at the door of thy heart, O sinner. Though invisible to mortal eyes, He is here, whether you regard it or not. He knocks. But how? By his Word—by a preached gospel—by the admonitions of conscience—and by the strivings of his Spirit. Nor is this all. He calls. “Unto you O men, I call, and my voice is unto the sons of men.” [Prov. 8] He calls by all the invitations of mercy contained in the Bible.”

<blockquote><p>20. ‘Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ 20. I have my time of offering mercy, and desiring you to entertain it: And if any man hear and obey this call, I will come in by my Spirit, and take habitual possession of him, and have spiritual communion with him, and he with Me. Note: Though it be not without the grace of Christ that we open to him when He knocks, and receive his offered special grace, yet, in this, He lays so much on man as to make our opening, that is, our accepting-faith, the condition of his entering for a fixed habitation by habitual love and holiness. On which account divines used to say that faith and repentance, wrought first in conversion, are the conditions or qualifications for consequent justification and sanctification.</p></blockquote>

</figure><figure class="quote" id="q-d966461caf" data-kw="">
<blockquote><p>It is the voice of my beloved that knocketh, saying, Open to me. This is another sudden apprehension, and sensible acknowledgement of the Church’s, to which she is quickened and excited by the strong and mighty calls and pulsations, by which Christ endeavors to awaken her; whose voice she cannot but know and confess, though she be not so dutiful as she ought to be in obeying it; and therefore she does here aggravate and bewail her fault, which is so much the greater because of his importunity, and tender vehemency for admission: For when Christ calls, and knocks, and begs at the door of our souls to enter, what vile ingratitude is it to shut Him out? When He solicits and entreats so many ways; by his Word and ministers; by his rods and corrections (which have their voice, Mic. 6:9) by his mercies and kindness, but chiefly by the constant admonitions, and provocations, and motions of his Spirit; what inexcusable, obstinate madness is it to deny and drive Him away? Is anything so worthy to be harbored there, as He is? And is it not an incomparable honor, that He will vouchsafe to come under our roof? Whosoever is shut out, sure he deserves an hospitable reception, who will come and sup with such as we are, and brings his feast along with him. Aperi Christo sed extraneis claude, seculo claude, etc. [‘Open to Christ, but to outsiders, shut, shut the world’], drive away and banish all things else, but give Him the best lodging. It is demanded, Can we open? Is it in our power? Has not He the keys Himself, and is not He the door Himself? Does not He shut and none can open? Yes, but when He bids you to open, He lends you a key; and when He infuses grace and says He enables you to open, it is his gift, but your grace; his inspiration, but your improvement: And oh! How blessed are they that are but his turn-keys, his door-keepers. Is there a greater honor, or happiness than to co-operate with God, in that which of all others is the most God-like work, the salvation of souls?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english-annotations.html">English Annotations</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Annotations (the Westminster Annotations)</cite>, 3rd ed. (1658), on Song 5:2</span></figcaption>

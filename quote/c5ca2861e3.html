<main class="wrap"><figure class="quote" id="q-c5ca2861e3" data-kw="">
<blockquote><p>I. Although from what has been said in the preceding question concerning the obscurity of the church, it is easy to answer the proposed question (for if the church can sometimes be so obscured and concealed as to the nowhere conspicuous on the earth—which our opponents themselves acknowledge concerning the times of antichrist—why can we not say that our church certainly existed, but it was latent and obscured?) Because they do not cease to press us over and over again with this question in order to prove that our church did not exist at all at that time. Since it cannot be shown where it was, it was thus a novelty and of recent origin. We must see what reply must be given to such a postulate.

II. However, here before all things it must be observed: (1) that by our church (or the Reformed Church) is not meant that which by express title and notion was distinguished from other assemblies, but which by consanguinity and profession of the same doctrine as to articles of faith and true ecclesiastical communion was the same with hours of today. (2) The true and catholic doctrine is here to be distinguished from discipline, and ceremonies from dogmas, and in the dogmas the questions and maxims of the schools; or the private opinions of doctors are are to be distinguished from the necessary articles of faith to be embraced by the common faith of the church. Again, among those things which the church prescribes, some are of divine right (which are absolutely necessary to faith and salvation, in which the essence of Christianity consists); others are of positive right (which are indeed useful, but nevertheless so that nothing prohibits their being changed and reconstructed in the progress of time).

III. Before we answer the question, however, the absurdity and unfairness of the demand must be marked. First, it supposes a false hypothesis, which is the prime error (πρωτον ψευδος) of our opponents. Once this is denied and overthrown, whatever is built upon it must necessarily fall in like manner—namely, that the true church ought always to exist in the world with perpetual splendor. Since we have in the preceding question proved this to be most false and it is evident that there are times like that of Elijah in which the church lies hidden and is withdrawn from the sight of men, in vain are we asked to show where our church was. For it could lie hidden without splendor and prominence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.10.1–3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e7427f35bb" data-kw="">
<blockquote><p>And indeed there is no possibility of making an actual agreement in those lesser points, because of the different capacities and degrees of faith: And God in the Scripture has not promised such an actual agreement to all the members of the Church in all lesser points of doctrine; for He has not promised a full and uniform discovery of them to all: Yea, it has been showed out of your own great Doctor Stapleton (Ex. pacif. ch. 3), by a Roman Catholic, that in the discovery of small points the Church is not infallibly directed… And thus may we come to a sight of the unity of faith in the Church; For in the explicits, that is, in fundamentals of absolute necessity which knit unto Christ the foundation, there is and ought to be an unity; and this substantial unity may cover the incurable differences in the lesser implicit points being held by infirmity, and not with contention, scandal, and schism: For unity in fundamentals does take away the damning censure of differences in lesser points when there is a will of believing right in these points, but a want of power to attain this belief. And so these differences in lesser points not being put upon account for the will of unity in them, and for the real unity in fundamentals, this real unity in fundamentals is accounted an entire, or at least a solid and saving unity: So that the unity is not to be reckoned from this, that all do actually agree in this belief of all lesser points (for in diverse of these points diverse do necessarily differ) but because their unity in fundamentals, and a will of unity in these lesser points wherein they differ (the imputation of smaller differences being thus taken away) are accounted to them for an entire, or at least for a sufficient unity. And this truth is in not much unlike terms to be seen in Tertullian (Of the Veiling of Virgins, ch. 1): Regula quidem fidei una omninò est, sola immobilis, et irreformabilis, credendi scilicet in unicum Deum, omnipotentem mundi conditorem, et Filium ejus Jesum Christum, etc. ‘The rule of faith is only unmoveable.’ And De Praes., ch. 12: Quaeramus ergò in nostro et à nostris et de nostro, id(que) duntaxat quod salva regula fidei potest in quaestionem devenire. ‘Let us inquire or dispute of that which may come into question without hurting the rule of faith.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-rouse.html">Francis Rous</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Charity Complaining &amp; Maintaining that Rome is Uncharitable to sundry eminent parts of the catholic Church, and especially to Protestants, and is therefore Uncatholic</cite>, (London: 1641), ch. 9, sect. 3, pp. 231-34 Rous was a Westminster divine.</span></figcaption>

</figure><figure class="quote" id="q-d67e8ccc5c" data-kw="">
<blockquote><p>By ‘unity’ we mean the concurrence of men’s judgments, affections and actions about the same thing in one and the same way, and for the same end. By ‘forbearance’ we mean the refraining from uncharitable and unkindly affections and behaviors towards another in some things, although there be some difference between us and him in judgement and in the way of acting about these things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Moderator</cite>, (London: Bellamy, 1652), ch. 3, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>Lastly, there may be corruption in the translation of the Word and in the Church’s interpretation of the Word, and so false doctrines arise and be maintained; yet not being in the fundamental points of the Covenant before mentioned, the Church may be a true church, though corrupted.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9b1e48f8bd" data-kw="">
<blockquote><p>This imposing [of Church courts] takes not away judicious believing [by individuals]… If imposing were a commanding that we receive absolutely what they say, be it good, or ill, without examining [whether] the argument were concludent, as God himself requires Abraham to kill his son, Abraham was without examination to give absolute obedience, and this proves God to be Lord of the conscience, for knowing his Word to be his Word, we are not to examine it by the Scripture or Law of Nature, because if we know who speaks, we are not to examine what is spoken. But though we know who speaks among creatures, be it a prophet, an apostle, an angel, yet must we examine both who speaks and what is spoken.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), ch. 2, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

</figure><figure class="quote" id="q-3c5bf74804" data-kw="">
<blockquote><p>And having first corrupted [Church] government from the primitive simplicity, and made princes their lictors [jailors and executioners] (as [Hugo] Grotius speaks in that excellent epistle newly translated by Mr. Barksdale), they next corrupt doctrine and worship consequently. For tyrants must have their wills in everything: and numerous and needless laws and canons must be made to show their power and fulfil their wills, that they may be lawgivers and a rule to all the world. And when they have made a seeming necessity of doing things unnecessary, then to plead the necessity which they have made, is the sum of all their arguments. And they that are against strict and precise adhering to the Scriptures, or observance of God’s own commands, are yet so strict for obedience to their proud imperious wills that they persuade themselves and others that without it there can be no order, no unity, no peace, but rebellion and confusion: And so they cry up obedience, obedience, that their idol wills may be bowed to by all without control; And when they are mere usurpers, and use no power given them by God, they yet get the advantage of making all odious that obey them not in the least and greatest matters, by the names of schism, unruliness or such like. O say the Papal usurpers, ‘The Church must be obeyed, or there will be no order: Disobedience in small matters is no small sin,’ when they have set up an idol-power against Christ; as if to disobey Him, whose laws they make void by their traditions and usurpations were a lesser fault. And when they have departed as far from the Christian simplicity in doctrine, government and worship, as their voluminous councils and decretals, and missals differ from the ancient simple Christianity, and have made as many snares and engines to divide and tear the Church of Christ as there are noxious (that I say not needless) laws, canons, and decrees imposed as necessary to peace and concord, then no men’s mouths are more opened against schism, when they have unavoidably caused it, yea are the greatest schismatics; And no men call so loud for unity and concord, as they that have first made it a thing impossible. … …

2. Have they not room enough to show their power, and work enough to do in seeing to the execution of Christ’s own universal laws and preserving mere order and decency in undetermined circumstances, that all may be done to edification?

3. Does not every needless oath and subscription by which they would tie men faster to themselves in controvertible cases, plainly tend to undermine themselves and keep up still a conscientious party against them? For while men have nothing to do but live quietly under a government, they will be glad of peace: But when they are put to subscribe, declare, covenant and swear that all this is good or lawful, or that they will never be against it, it sets men unavoidably on the deepest studies of the case, and so all the people are set on trying and judging of that, which else they would never have meddled with: For what honest man will say, swear or promise he knows not what? Even as some crafty rebels would undermine princes by drawing them to put the controverted parts of their prerogative into the subjects’ oaths, that so they may make all the people students and judges of the cause, and unavoidably make factions and dissenters, that else would have lived quietly if they might: so do the Papal clergy ruin themselves by such over-doing impositions. I remember Lampridius tells us that Alexander Severus (that great enemy of injustice) was so severe that he would have made a law to regulate men’s apparel: But Ulpian changed his mind by telling him that many laws cause divisions and make occasions of disobedience. They cry out, ‘There will be no order if ministers and people be left to their own discretion in such and such circumstantials;’ but do they dream of perfect concord on earth? and that men of such various interests, tempers, educations, converse and degrees of knowledge should not differ in a word or gesture? Our English rulers make no laws what gesture shall be used in singing Psalms, or in hearing sermons, and there is no division or great disorder in them: But if on pretence of nearer concord, they should tie all to one gesture, this or that, we should presently find it an engine of division. And O how many such engines have the Papal clergy made and used long! and to what purpose? To silence faithful ministers, to torment faithful Christians in the inquisitions, to brand the best men with the names of heretics and schismatics, to gratify all profaneness and malignity, to quench brotherly love, and to tear the Church into pieces; and no experience will make them wiser.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, ... (London: White, 1675), Preface, n.p.</span></figcaption>

<blockquote><p>We desire proofs, not words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, ... (1637), pt. 3, p. 197</span></figcaption>

<blockquote><p>A 1700’s treatise surfaced two centuries ago regarding the supernatural and scientific phenomenon that plagued Europe in an era when magic, witchcraft, demonology, instances of haunting and even cases of vampires were recorded in historical documentation. It was during the age of reason when a Black Monk from the Benedictine Order of the 18th century penned a work that would become one of the most influential and controversial works of his time. A plethora of cases regarding events in the supernatural had plagued mankind with fear and mystery throughout history, many inhabitants to the regions of Europe came under an epidemic of social hysteria which steamed from reports of corpses rising from their graves, killing and sucking the blood of victims inhabiting small villages or visitations and the haunting of ghosts, evil spirits and demons. The Black Monk, Abbot Don Augustin Calmet tasked himself with the study of these… historically documented reports for the purpose of providing the public with the rules to determine a claim’s legitimacy through philosophical reasoning and scientific examination that was approved by the King of France in 1746. This work provides an in depth look into the history of most superstitions, mythologies, the analysis of events depicted in ancient texts from various religions and historically renowned cases… Calmet lays out the rules for determining the fraudulent claims from the real while also providing a “how to” manual when dealing with or investigating occult matters in witchcraft, ghosts, vampires and demonic possessions. This work was written by an ordained abbot monk and was accepted by European society as scientific research in his time.</p></blockquote>

<blockquote><p>To proceed yet further, we are here to consider the particular remedies which they of the popish church have prescribed against the hurts that have come by witchcraft. And they are principally five. The first is the name of Jesus. We must grant that any Christian may lawfully call upon the name of Jesus in prayer, for the help and deliverance of those who are possessed and bewitched, but yet with the caveat and condition before specified, if it is the will of God, and if their recovery may make for His glory, the benefit of the church, and the good of the diseased parties. But the papist, by the use of this name, intends a further matter, to wit, that the very name uttered in so many letters and syllables is powerful to cast out devils and to help those who are bewitched. For when it is uttered, then (they say) the authority of Christ is present, that the work may be done. [This is] a flat untruth and a practice full of danger. For let this be well considered, whatsoever any man does in this case, he must do it by virtue of his calling, and have also his warrant for the doing thereof out of the Word. If he lacks this, and yet undertakes such a work, he may justly fear the like event that befell the vagabond Jews who were exorcists (Acts 19:13). Now the church of Christ has no warrant in the Word to use this name of Christ for any such purpose. Neither has any ordinary Christian a special calling from God so to do. Therefore, he may not do it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Damned Art of Witchcraft</cite>, … (Cambridge, 1610), ch. 7, ‘The application of the doctrine of witchcraft to our times’, section 3, question 3, ‘Whether a man may prevent the danger of witchcraft, and if he may, then what remedies he may lawfully and effectually use against it?’, pp. 239-40</span></figcaption>

</figure><figure class="quote" id="q-be5d122086" data-kw="">
<blockquote><p>Agrippa’s study of occult philosophy, [has been] acknowledged as a significant contribution to the Renaissance philosophical discussion concerning the powers of ritual magic and its relationship with religion. The three books deal with Elemental, Celestial and Intellectual magic. The books outline the four elements, astrology, kabbalah, numbers, angels, God’s names, the virtues and relationships with each other as well as methods of utilizing these relationships and laws in medicine, scrying, alchemy, ceremonies, origins of what are from the Hebrew, Greek, and Chaldean context. These arguments were common amongst other hermetic philosophers at the time and before. In fact, Agrippa’s interpretation of magic is similar to the authors Marsilio Ficino, Pico della Mirandola and Johann Reuchlin’s synthesis of magic and religion and emphasize an exploration of nature. Unlike many grimoires of the time, before and past, these books are more scholarly and intellectual than mysterious and foreboding. These books are often read as authoritative by those interested in the occult even today.” – Internet Archive Wier, Jan On Witchcraft: An Abridged Translation of Johann Weyer’s De Praestigiis Daemonum [On the Sleights of Demons] Ref (Basil, 1568; Pegasus Press, 1998) 330 pp. Latin 755 pp. No ToC Wier (1515-1588) was a Dutch physician, occultist and demonologist, disciple and follower of Heinrich Cornelius Agrippa. See Wikipedia on ‘De praestigiis daemonum’. Wikipedia: “Weyer published his major works on demons, magic, and witchcraft, in which he applied a skeptical medical view to reported wonders and supposed examples of magic or witchcraft… Nevertheless, while he defended the idea that the Devil’s power was not as strong as claimed by the orthodox Christian churches in De Praestigiis Daemonum, he defended also the idea that demons did have power and could appear before people who called upon them, creating illusions; but he commonly referred to magicians and not to witches when speaking about people who could create illusions, saying they were heretics who were using the Devil’s power to do it, and when speaking on witches, he used the term mentally ill… Weyer’s appeal for clemency for those accused of the crime of witchcraft was opposed later in the sixteenth century by the Swiss physician Thomas Erastus, the French legal theorist Jean Bodin and King James VI of Scotland.</p></blockquote>

<blockquote><p>Until the day Dr. Peck first met the young woman called Jersey, he did not believe in the devil. In fact, as a mature, highly experienced psychiatrist, he expected that this case would resolve his ongoing effort to prove to himself, as scientifically as possible, that there were absolutely no grounds for such beliefs. Yet what he discovered could not be explained away simply as madness or by any standard clinical diagnosis… …he recounts his journey from skepticism to eventual acknowledgment of the reality of an evil spirit, even at the risk of being shunned by the medical establishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/m-scott-peck.html">M. Scott Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Glimpses of the Devil: A Psychiatrist’s Personal Accounts of Possession, Exorcism &amp; Redemption</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Until the day Dr. Peck first met the young woman called Jersey, he did not believe in the devil. In fact, as a mature, highly experienced psychiatrist, he expected that this case would resolve his ongoing effort to prove to himself, as scientifically as possible, that there were absolutely no grounds for such beliefs. Yet what he discovered could not be explained away simply as madness or by any standard clinical diagnosis… …he recounts his journey from skepticism to eventual acknowledgment of the reality of an evil spirit, even at the risk of being shunned by the medical establishment.”

<blockquote><p>XXIV. Then seventh, concerning remedies which we should oppose to any attacks or arts of the demons, it is asked whether spiritual things are sufficient here—prayers, battle, the apostolic armor [Eph. 6]—or whether some sort of external things must be added: holy water, the utterance of the name of Jesus, the use of relics, the sign of the cross, any consecrated things, a figure of the cross (made, that is, of wax), blessed images, and especially exorcism. The papists, in support of their superstitious exorcisms, affirm this. The orthodox deny it: (1) because Scripture commends to us nothing beyond the spiritual things which we mentioned (Eph. 6:11). Indeed, (2) it also expressly rejects all other things (2 Cor. 10:4). Moreover, (3) neither can any bodily things act upon spirits.</p></blockquote>

<blockquote><p>The infants of the Christian people are of the church and of the people of God, parts and members of his congregation. Which thing thus we prove. It is promised by the testimonies all most of all the prophets, that the church of the gentiles should be gathered together and unite unto the church of the people of God, And Christ himself said they should come from the east &amp; west and sit down to eat with the God of Abraham Isaac &amp; Jacob. And again. Go ye your ways into the universal world. &amp;c. Now unto the church of the Jews pertain as well their infants as the Jews them self. No less, then … infants pertain unto the church of Christ as we our selves &amp; as some time did the infants of the Jews.

For if they do not, they were not the promise firm &amp; ratified for then we should not as well as Abraham sit down with God. Which Abraham with them that after the flesh were borne of him were numbered into the church. But and if our infants should not be as well numbered and told into the church with their parents as were the infants of the Jews, Christ should not be indifferent but more parcel in his promises to the Jews then to us, denying us that benefit which he gave unto our fathers the Jews, and so it should appear all the prophesying {is} of the calling of the Gentiles to be void.

Wherefore the infants of the Christian sith they be no less of the visible church as the waxen, it is firm &amp; fast that they be as well of the number of them whom we judge to be elect as their parents. Wherefore I judge them to do ungodly &amp; presumptuously which dampen the infants of the christen when so many apart testimonies of scripture deny it preaching the church of the gentiles to be now not like, but also more ample &amp; large then ever was the Jews which all shall ye see now more manifest, whiles we declare our faith as concerning the church what it is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The reckoning and declaration of the faith and belief of Huldrick Zwingli bishop of Zurich the chief town of Helvetia, sent to Charles.V. that now is Emperor of Rome: holding a parliament or council at Augsburg with the chief lords and learned men of Germany, the year of our Lord MDXXX. in the month</cite>, trans. George Joy (London: Richard Weaver, 1548), unpaginated.</span></figcaption>

<blockquote><p>10th Question: Is the profession of faith and promise—that is, this sacred covenant—required to be confirmed by solemn oath and subscription? Response: Conclusion: This is not simply, nor everywhere or always, necessary; nor does apostolic practice teach this. For it could ordinarily suffice if that solemn promise is made in the presence of the whole Church, or before a synod with many witnesses. Especially when it pertains to matters of God, before his eyes and in his house, namely the Church. An oath is the end of all contradiction, introduced because of human wickedness. Because we must greatly distance ourselves from the evil practice of Papal clerics, who too rashly confirm their causes with dire oaths, curses, and the pledging of souls. Because it is proper for the faithful to be earnest, sincere, and simple, like sheep and doves. Therefore, care must be taken that this abundant caution does not, in some way, seem to cast doubt on their proper fourth way. Conclusion: Nevertheless, it is not illicit to take extra caution, whether for adversaries, or for extraordinary wickedness, frauds and deceptions of men, or for any other just cause. Because, in the renewal and restatement of the sacred covenant, such was done (see 2 Chron. 15:12-15; Neh. 9:38 and 10:1). Therefore, why could this not be done in some case at the first institution of the covenant? Because an oath may be declaratory and promissory in the matter of confession, profession of faith, and embracing the Church and its cause, as Paul’s example teaches (see 2 Cor. 1:23; Rom. 9:1). This, combined with the example of God’s people (see 2 Chron. 15; Neh. 9-10), was imitated by the king and nobility in Scotland in 1581, and by the French Church in the National Synod of Alès in 1619, where they received and confirmed the doctrine of the National Synod of Dordrecht against today’s Pelagians. Furthermore, in Scotland in 1638 and recently in 1643, the nobility, ministers, and people in Scotland and England were united in a solemn confederation. Here, compare what has been said elsewhere about the pledging of souls for their doctrine and cause, and about oaths in public form or church confessions. Part 3, Selected Dissertation on the Oath of Religion. Because not only are oral declarations before the whole Church required, but also subscriptions by the ordinary ministers, elders, and deacons among us are not without reason expected… …it would not be absurd or illicit if, in some case, and for the reasons previously mentioned, a subscription from the members of the Church were required. 4. Because oaths and subscriptions hold a significant place in any confederations and assemblies, and why not in sacred and ecclesiastical matters, if necessity demands it. Conclusion: We reject here oaths of obedience to the Pope, those concerning the Council of Trent; also, the abjurations of reformed doctrine and Church; furthermore, inquisitorial oaths and those arising ex officio [“from duty” unto self-incrimination]. In brief, all oaths and all sacred subscriptions that are not made in injustice, but in truth and judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’, pp. 52-53 (PDF pp. 49-50)</span></figcaption>

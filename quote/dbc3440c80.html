<blockquote><p>VERSE 13. For not the hearers of the law. This verse is connected with the last clause of the preceding, and assigns the reason why the Jews shall be judged or punished according to the law; the mere possession or knowledge of the law would not avail, for it is not the hearers, but the doers of the law that are just before God. The expression hearers instead of readers, is explained by the fact that the law was read in the presence of the people, and by hearing rather than by reading, their knowledge of it was obtained. Comp. Matt. 5:21, John 12:34, Gal. 4:21, James 1:22. To be just before God, and to be justified, are the same thing. They are both forensic expressions, and indicate the state rather than the character of those to whom they refer. Those are just in the sight of God, or are justified, who have done what the law requires, and are regarded and treated accordingly; that is, are declared to be free from condemnation, and entitled to the favour of God. In obvious allusion to the opinion, that being a Jew was enough to secure admission to heaven, the apostle says, It is not the hearers but the doers of the law that are justified. He is not speaking of the method of justification available for sinners, as revealed in the gospel, but of the principles of justice which will be applied to all who look to the law for justification. If men rely on works, they must have works; they must be doers of the law; they must satisfy its demands, if they are to be justified by it. For God is just and impartial; he will, as a judge administering the law, judge every man, not according to his privileges, but according to his works and the knowledge of duty which he has possessed. On these principles, it is his very design to show that no flesh living can be justified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, (Grand Rapids, MI: Louis Kregel, 1882), 81–82.</span></figcaption>

<blockquote><p>[1.] Now the active obedience of Christ falls under a twofold consideration:

1. As the man-Christ’s perfect conformity to the Law of God, so as man he was obliged to do and suffer all that He did and suffered, even to lay down his life for man. But had He been only man his righteousness had neither been by condignity meritorious, nor yet satisfactory for us. But:

2. The whole course of Christ’s obedience from his birth to the grave, by doing and suffering, is to be considered as the doing and suffering of so excellent a Person, his being born, his praying, preaching, dying, coming from a Person, God-man. Now the Law required not praying, preaching of God-man, the blood of God, or the dying of Him who was God-Man. And so all these being both so excellent, and then so undue, have respect of satisfaction to God. 2. The active obedience of Christ and all that Christ did and suffered were performed by Him in his state of humiliation: in which he was poor, [Greek], 2 Cor. 8:9, for us, so also by the same ground a weeping man, hungry, thirsty, weary for us, made lower then the angels by the suffering of death, Heb. 2:9, humbled by partaking of flesh and blood, because of the children, Heb. 2:14, emptied Himself for us, Phil. 2. This was, as [David] Pareus well says: perpetua quaedam passio et paena peccatorum nostrorum, fuit tota vita Christi [‘The whole life of Christ was a certain perpetual suffering and punishment for our sins’]: All these have a respect of punishment and suffering. For since Christ was both a viator [pilgrim] and a comprehensor [one attaining glory], and such a holy sinless person, He ought to have had the actual possession of the crown of glory from the womb, and so should have been free of weeping, hunger, thirst, weariness, groaning, sighing, sadnesse, persecution, reproaches, etc., all which adhered to all his active holiness, and therefore, in that, his actions were satisfactory passions. For satisfaction is defined [as] a voluntary restoring of the equivalent, and as good in the place of what is taken away; and the good restored must be:

1. Undue.

2. The proper good of the restorer, which agrees to the active and passive obedience of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, (1655), pt. 2, ch. 1; pp. 226-27</span></figcaption>

<blockquote><p>The conception embodied in the terms, ‘belief’, ‘faith’, is not that of an arbitrary act of the subject, it is that of a mental state or act which is determined by sufficient reasons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Faith in its Psychological Aspects’ in The Princeton Review Theological Review ix</cite>, 1911, p. 537, also in Studies in Theology (New York, 1932), p. 313 &amp; in Biblical and Theological Studies (Philadelphia, 1952), p. 375, and as quoted by John Murray, Collected Writings, 2.238</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

<blockquote><p>Here the question arises by what means are we justified? We answer with Paul, &quot;By faith only in Christ are we pronounced righteous, and not by works.&quot; Not that we reject good works. Far from it. But we will not allow ourselves to be removed from the anchorage of our salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, on 2:16, p. 55</span></figcaption>

</figure><figure class="quote" id="q-8d2d2850a6" data-kw="">
<blockquote><p>Neither does faith justify as the beginning of justification only: first, because there are no degrees of justification before God; for in the first act it is perfect: and to that act continued throughout this life, faith, as I showed before out of diverse of the Fathers, suffices. I say, suffices to justification: and therefore is not the beginning only, but also the continuance and consummation thereof: for as in the first act it justifies, so also in the continuance of justification: for by it we stand, and by it we live, and so long as we have faith, it is imputed unto us for righteousness even from faith to faith, as it was to Abraham, after he had long continued in the faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification</cite>, (London: 1633), ch. 10, ‘Bellarmine’s Arguments…’, p. 391</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“Neither does faith justify as the beginning of justification only: first, because there are no degrees of justification before God; for in the first act it is perfect: and to that act continued throughout this life, faith, as I showed before out of diverse of the Fathers, suffices. I say, suffices to justification: and therefore is not the beginning only, but also the continuance and consummation thereof: for as in the first act it justifies, so also in the continuance of justification: for by it we stand, and by it we live, and so long as we have faith, it is imputed unto us for righteousness even from faith to faith, as it was to Abraham, after he had long continued in the faith.”

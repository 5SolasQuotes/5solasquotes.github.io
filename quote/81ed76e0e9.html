<main class="wrap"><figure class="quote" id="q-81ed76e0e9" data-kw="">
<blockquote><p>Some things were created in themselves, others in their causes, such as meteors; animals that arise from the commixture of species, like mules, leopards; and according to some, insects, which are thought, but falsely, to be made from putrefaction. Some things are co-created rather than created, such as accidents and adjuncts in their subjects; universals in their species and individuals; time and place or space, in which creatures are received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>X. That the world lacked a beginning, and therefore VI. is eternal by reason of duration, was stated by Ocellus Lucanus and Xenophanes of Colophon, and after them, Aristotle. Although there are not wanting those who excuse Aristotle: and of these, some deny that he simply denied that the world had a beginning, like Thomas, pt. 1, quest. 46, art. 1; others affirm that Aristotle spoke hesitantly on this matter in several places, like Grotius, bk. 1, Of the Truth of the Christian Religion, §7; others use a distinction, and assert that Aristotle stated that God is the emanative cause of the world, without novelty of being, so that the world is indeed posterior to God by nature, but not by duration; like Suarez, Metaphysical Disputations, 20, sect. 1, n. 24, 26. The more common opinion, however, is that Aristotle affirmed that the world is eternal. Whence many Scholastics, rightly supposing from the foundations of the Christian religion that the world was created in time, nevertheless, in deference to Aristotle, defend that the world could have been from eternity; with whom, however, others disagree. We, although we do not deny that this question, setting aside revelation, is most difficult to solve, and that therefore this error should be pardoned in Aristotle and other philosophers who assert eternal matter; yet from revelation, to which sound reason, let alone illuminated reason, is not repugnant, we believe it as indubitable that the world was created by God in time. For: 1. Gen. 1:1, God is said to have created the heaven and the earth “in the beginning”; although indeed the Targum of Jerusalem rendered that “in the beginning” as מהָ כְ וֹבחְּ, “through wisdom”; and Origen, Ambrose, Jerome, and Basil understand the Son of God, from Prov. 8:22; Jn. 1:1; c. 8:28; Col. 1:18; Apoc. 3:14, and take “beginning” not by reason of time, but of order; of which version Menasseh Ben Israel also makes mention, Problems, 13, On Creation; yet we see no solid reason why the more common interpretation should be deserted and the beginning of time be relinquished here. 2. Because in Ps. 90:2, a beginning of time is attributed to the world: “Before the mountains were brought forth, or ever you had formed the earth and the world.” Prov. 8:24-26, “When there were no depths… before the fountains abounded with water. Before the mountains were settled, before the hills was I brought forth: While as yet he had not made the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), ch. 2, Of Creation, pp. 21-22 trans. AI Latin</span></figcaption>
